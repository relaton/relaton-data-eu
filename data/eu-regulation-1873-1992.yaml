title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1873/92 of 6 July 1992 re-establishing the
    levying of customs duties on products of categories 6 and 26 (order Nos 40.0060
    and 40.0260), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1873/92 de la Commission, du 6 juillet 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 6 et 26 (numéros d' ordre 40.0060 et 40.0260) originaires du
    Pakistan, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
