    ai fini del sistema di preferenze tariffarie generalizzate per tener conto della
    particolare situazione del Guatemala relativamente all’esportazione di taluni
    prodotti della pesca nell’Unione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1102/2013 ( 2013. gada 6. novembris
