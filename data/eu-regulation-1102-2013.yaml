title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1102/2013 of 6 November 2013
    amending Implementing Regulation (EU) No 1044/2012 on a derogation from Regulation
    (EEC) No 2454/93 as regards the rules of origin used for the purposes of the scheme
    of generalised tariff preferences to take account of the special situation of
    Guatemala regarding exports of certain fisheries products to the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1102/2013 de la Commission du 6 novembre
    2013 modifiant le règlement d’exécution (UE) n ° 1044/2012 portant dérogation
    au règlement (CEE) n ° 2454/93 en ce qui concerne les règles d’origine établies
    dans le cadre du schéma de préférences tarifaires généralisées, en vue de
    prendre en compte la situation particulière du Guatemala pour l’exportation
    de certains produits de la pêche vers l’Union européenne
  type: main
