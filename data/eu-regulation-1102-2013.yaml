    especial da Guatemala em relação às exportações de certos produtos da pesca
    para a União Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1102/2013 al Comisiei din
    6 noiembrie 2013 de modificare a Regulamentului de punere în aplicare (UE) nr.
    1044/2012 privind acordarea unei derogări de la Regulamentul (CEE) nr. 2454/93
    în ceea ce privește regulile de origine utilizate în cadrul sistemului de preferințe
    tarifare generalizate, pentru a lua în calcul situația specială din Guatemala
    legată de exporturile anumitor produse pescărești către Uniune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1102/2013 zo 6. novembra 2013
    , ktorým sa mení vykonávacie nariadenie (EÚ) č. 1044/2012 o odchýlke z nariadenia
    (EHS) č. 2454/93, pokiaľ ide o pravidlá pôvodu používané na účely systému
    všeobecných colných preferencií, aby sa zohľadnila osobitná situácia Guatemaly
    v súvislosti s vývozom určitých produktov rybolovu do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1102/2013 z dne 6. novembra 2013 o
    spremembi Izvedbene uredbe Komisije (EU) št. 1044/2012 o odstopanju od Uredbe
    (EGS) št. 2454/93 glede pravil o poreklu, ki se uporabljajo za namene sheme splošnih
    tarifnih preferencialov, namenjenemu upoštevanju posebnega položaja Gvatemale
    glede izvoza nekaterih ribiških proizvodov v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1102/2013 de la Comisión, de 6 de noviembre
    de 2013 , por el que se modifica el Reglamento de Ejecución (UE) n ° 1044/2012
    por el que se establece una excepción al Reglamento (CEE) n ° 2454/93 en lo
    relativo a las normas de origen utilizadas a los fines del sistema de preferencias
    arancelarias generalizadas, atendiendo a la situación particular de Guatemala
    en lo que respecta a las exportaciones de determinados productos de la pesca a
    la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1102/2013 av den 6 november
