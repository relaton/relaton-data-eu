  content: Commission Regulation (EEC) No 2037/83 of 22 July 1983 laying down detailed
    rules implementing the system of aid for the use of grapes, grape must and concentrated
    grape must for the manufacture of grape juice and fixing the amounts of aid for
    the 1983/84 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2037/83 de la Commission du 22 juillet 1983 portant
    modalités d' application du régime d' aide à l' utilisation de raisins, de
    moûts de raisins et de moûts de raisins concentrés en vue de l' élaboration
    du jus de raisin et fixant les montants de l' aide pour la campagne viticole 1983/1984
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2037/83 der Kommission vom 22. Juli 1983 über Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von Trauben, Traubenmost und konzentriertem
    Traubenmost zur Herstellung von Traubensaft und zur Festsetzung des Beihilfebetrags
    für das Weinwirtschaftsjahr 1983/1984
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2037/83 af 22. juli 1983 om gennemførelsesbestemmelserne
    for støtteordningen vedrørende anvendelse af druer, druemost og koncentreret
    druemost med henblik på forarbejdning til druesaft samt om fastsættelse af støttebeløbene
    for vinproduktionsåret 1983/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2037/83 της Επιτροπής
