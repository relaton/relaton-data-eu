schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n 193/64/CEE de la Commission, du 21 décembre 1964, portant,
    pour la période du 1er janvier au 31 mars 1965, adaptation et fixation des prix
    d'écluse pour les oeufs de volaille, les volailles vivantes et les volailles
    abattues et fixation des prélèvements envers les pays tiers pour les oeufs de
    volaille en coquille, les volailles vivantes d'un poids n'excédant pas 185 grammes
    et les volailles abattues et fixation des prélèvements intracommunautaires pour
    les oeufs à couver de volaille pour les importations à partir du 1er janvier
    1965
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 193/64/EWG der Kommission vom 21. Dezember 1964 über die
    Anpassung und Festsetzung der Einschleusungspreise für Eier von Hausgeflügel,
    lebendes und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. Januar bis 31. März 1965 sowie über die Festsetzung der
    innergemeinschaftlichen Abschöpfungsbeträge für Bruteier von Hausgeflügel
    für die ab 1. Januar 1965 getätigten Einfuhren
  type: main
- language: it
  script: Latn
  content: Regolamento n. 193/64/CEE della Commissione, del 21 dicembre 1964, che
    adatta e fissa i prezzi limite per le uova di volatili da cortile, per i volatili
    vivi e i volatili macellati, e che fissa i prelievi nei confronti dei paesi terzi
    per le uova in guscio di volatili da cortile, per i volatili di peso non superiore
    ai 185 grammi, e per i volatili macellati, per il periodo dal 1 gennaio al 31
    marzo 1965, e che fissa i prelievi intracomunitari per le uova da cova di volatili
    da cortile per le importazioni a partire dal 1 gennaio 1965
  type: main
- language: nl
  script: Latn
  content: Verordening no. 193/64/EEG van de Commissie van 21 december 1964 houdende
    aanpassing en vaststelling van de sluisprijzen voor eieren van pluimvee, levend
    en geslacht pluimvee, alsmede vaststelling van de heffingen ten opzichte van derde
    landen voor eieren in de schaal van pluimvee, voor levend pluimvee dat niet meer
    dan 185 gram weegt en voor geslacht pluimvee, voor de periode van 1 januari tot
    en met 31 maart 1965, en houdende vaststelling van de intracommunautaire heffingen
    voor broedeieren van pluimvee bij invoer vanaf 1 januari 1965
  type: main
