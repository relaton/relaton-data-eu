title:
- language: en
  script: Latn
  content: '92/413/EEC: Council Decision of 29 June 1992 concerning the conclusion
    of a Cooperation Agreement between the European Economic Community and the Kingdom
    of Sweden on research and technological development in the field of renewable
    raw materials: forestry and wood products (including cork) (Forest) and the recycling
    of waste (Reward)'
  type: main
- language: fr
  script: Latn
  content: '92/413/CEE: Décision du Conseil du 29 juin 1992 concernant la conclusion
    de l''accord de coopération entre la Communauté économique européenne et le
    Royaume de Suède relatif à la recherche et au développement technologique dans
    le domaine des matières premières renouvelables: sylviculture et produits du
    bois (y compris le liège) (Forest) et recyclage des déchets (Reward)'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 29. Juni 1992 über den Abschluß eines Kooperationsabkommens
    zwischen der Europäischen Wirtschaftsgemeinschaft und dem Königreich Schweden
    über Forschung und technologische Entwicklung auf den Gebieten der erneuerbaren
    Rohstoffe: Forstwirtschaft und Holzprodukte (einschließlich Kork) (FOREST) und
    der Rückführung von Abfall (REWARD) (92/413/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 29. juni 1992 om indgåelse af samarbejdsaftalen
