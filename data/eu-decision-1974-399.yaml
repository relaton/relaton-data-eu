title:
- language: en
  script: Latn
  content: Commission Decision of 23 July 1974 authorizing the French Republic not
    to apply Community treatment to handkerchiefs, falling within heading No 61.05
    of of the Common Customs Tariff, originating in the People's Republic of China
    and in free circulation in other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/399/CEE de la Commission, du 23 juillet 1974, autorisant la
    République française à exclure du traitement communautaire les mouchoirs et
    les , de la position 61.05 du Tarif douanier commun, originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Juli 1974, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Taschentücher und Ziertaschentücher
    der Tarifnummer 61.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. juli 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage lommetørklæder, som henhører
    under position 61.05 i den fælles toldtarif, med oprindelse i folkerepublikken
    Kina og som frit kan omsættes i de andre medlemssater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 luglio 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i fazzoletti da naso e da taschino,
    della voce n. 61.05 della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 juli 1974 waarbij de Franse Republiek
    wordt gemachtigd zakdoeken van post 61.05 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
