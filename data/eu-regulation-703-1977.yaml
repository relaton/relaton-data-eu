title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 703/77 of 1 April 1977 concerning a standing
    invitation to tender for white sugar held by the French intervention agency and
    intended for export and re-opening the standing invitations to tender provided
    for in Regulations (EEC) No 2732/76 and (EEC) No 2733/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 703/77 de la Commission, du 1er avril 1977, concernant
    une adjudication permanente pour la vente de sucre blanc détenu par l' organisme
    d' intervention français destiné à l' exportation et rouvrant les adjudications
    permanentes visées aux règlements (CEE) n° 2732/76 et (CEE) n° 2733/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 703/77 der Kommission vom 1. April 1977 über eine
    Dauerausschreibung zum Verkauf von zur Ausfuhr bestimmtem Weißzucker im Besitz
    der französischen Interventionsstelle und zur Wiedereröffnung der Dauerausschreibungen
    nach den Verordnungen (EWG) Nr. 2732/76 und (EWG) Nr. 2733/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 703/77 af 1. april 1977 om en løbende
    licitation med henblik på salg af hvidt sukker, som det franske interventionsorgan
    ligger inde med, og som er bestemt til udførsel, samt om genåbning af de løbende
    licitationer, der er omhandlet i forordning (EØF) nr. 2732/76 og (EØF) nr. 2733/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 703/77 della Commissione, del 1° aprile 1977, che
    concerne una gara permanente per la vendita di zucchero bianco, detenuto dall'
    organismo d' intervento francese destinato all' esportazione e riapre le gare
    permanenti di cui ai regolamenti (CEE) n. 2732/76 e (CEE) n. 2733/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 703/77 van de Commissie van 1 april 1977 betreffende
    een permanente inschrijving voor de verkoop met het oog op de uitvoer van witte
    suiker uit de voorraden van het Franse interventiebureau en tot heropening van
    de in de Verordeningen (EEG) nr. 2732/76 en (EEG) nr. 2733/76 bedoelde permanente
    openbare inschrijvingen
  type: main
