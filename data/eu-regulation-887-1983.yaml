title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 887/83 of 15 April 1983 re-establishing
    the levying of customs duties on other outer garments, products of category 26
    (code 0260), originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 887/83 de la Commission du 15 avril 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres vêtements de dessus,
    de la catégorie 26 (code 0260), originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 887/83 der Kommission vom 15. April 1983 über die
    Wiedereinführung des Zollsatzes für andere Oberkleidung der Warenkategorie Nr.
    26 (Kennziffer 0260), mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 887/83 af 15. april 1983 om genindførelse
    af opkrævning af toldafgifter for andre yderbeklædningsgenstande, under kategori
    nr. 26 (kode 0260), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 887/83 της Επιτροπής
    της 15ης Απριλίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτερα
    ενδύματα εξωτερικά της κατηγορίας προϊόντων
    26 (κωδικός αριθμός 0260), καταγωγής Βραζιλίας,
    δικαιούχων των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 887/83 della Commissione del 15 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli altri indumenti esterni, della
    categoria di prodotti n. 26 (codice 0260), originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 887/83 van de Commissie van 15 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere bovenkleding,
    van de categorie van produkten nr. 26 (codenummer 0260), van oorsprong uit Brazilië
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3378/82 van de Raad
  type: main
