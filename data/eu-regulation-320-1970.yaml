title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 320/70 du Conseil, du 17 février 1970, portant suspension
    temporaire du droit autonome du tarif douanier commun sur le silicium (polycristallin
    ou monocristallin), de très haute pureté, dopé par addition ou par épuration
    sélective, sous forme de disques, plaquettes, rondelles ou formes similaires,
    ayant subi ou non un polissage, de la sous-position 38.19 T
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 320/70 des Rates vom 17. Februar 1970 über die zeitweilige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Silizium (Polykristallin
    oder Monokristallin), von sehr hoher Reinheit, durch Zusatz oder selektive Reinigung
    dotiert, in Form von Scheiben, Plättchen, Rondellen und dergleichen, auch poliert,
    der Tarifstelle 38.19 T
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 320/70 del Consiglio, del 17 febbraio 1970, relativo
    alla sospensione temporanea del dazio autonomo della tariffa doganale comune applicabile
    al silicio (policristallino o monocristallino), ad altissimo tenore di purezza,
    drogato mediante aggiunta o mediante epurazione selettiva, in forma di dischi,
    piastrine, rondelle o forme simili, che abbiano subito o no una politura, della
    sottovoce 38.19 T
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 320/70 van de Raad van 17 februari 1970 houdende
    tijdelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    op silicium (polykristallijn of monokristallijn), in zeer zuivere staat, door
    toevoeging of door selectieve zuivering gedoopt, in de vorm van schijven, plaatjes,
    rondellen en dergelijke vormen, ook indien gepolijst, van post 38.19, postonderverdeling
    T
  type: main
