title:
- language: en
  script: Latn
  content: '92/197/EEC: Commission Decision of 24 March 1992 derogating from the definition
    of the concept of originating products to take account of the special situation
    of the Netherlands'' Antilles with regard to ladies'' knitted pullovers falling
    within CN code 6110 20'
  type: main
- language: fr
  script: Latn
  content: '92/197/CEE: Décision de la Commission, du 24 mars 1992, portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière des Antilles néerlandaises en ce qui concerne les pull-overs
    de bonneterie pour femmes relevant du code NC 6110 20'
  type: main
- language: de
  script: Latn
  content: '92/197/EWG: Entscheidung der Kommission vom 24. März 1992 zur Abweichung
    von der Begriffsbestimmung für "Ursprungswaren" zur Berücksichtigung der besonderen
    Lage der Niederländischen Antillen hinsichtlich gestrickter Damenpullover des
    KN-Codes 6110 20'
  type: main
- language: da
  script: Latn
  content: '92/197/EØF: Kommissionens beslutning af 24. marts 1992 om undtagelse
    fra definitionen af begrebet "varer med oprindelsesstatus" for at tage hensyn
    til De Nederlandske Antillers særlige situation for så vidt angår pullovere
    af trikotage, til kvinder, henhørende under KN-kode 6110 20'
  type: main
- language: el
  script: Grek
  content: '92/197/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
    Μαρτίου 1992 περί παρεκκλίσεως από τον ορισμό
    της έννοιας των " προϊόντων καταγωγής " προκειμένου
    να ληφθεί υπόψη η ειδική κατάσταση των Ολλανδικών
    Αντιλλών όσον αφορά τα πλεκτά πουλόβερ για
    γυναίκες που υπάγονται στον κωδικό ΣΟ 6110 20'
  type: main
- language: fi
  script: Latn
  content: '92/197/ETY: Komission päätös, tehty 24 päivänä maaliskuuta 1992,
    poikkeuksesta alkuperätuotteiden määritelmästä Alankomaiden Antillien erityisaseman
    huomioon ottamiseksi CN-koodiin 6110 20 kuuluvien naisten neulepuseroiden osalta'
  type: main
- language: it
  script: Latn
  content: '92/197/CEE: Decisione della Commissione, del 24 marzo 1992, recante deroga
    alla definizione di "prodotti originari" in considerazione della situazione particolare
    delle Antille olandesi, in ordine ai pullover a maglia per donna di cui al codice
    NC 6110 20'
  type: main
- language: nl
  script: Latn
  content: '92/197/EEG: Beschikking van de Commissie van 24 maart 1992 tot afwijking
    van de definitie van het begrip "produkten van oorsprong" ten einde rekening te
    houden met de bijzondere situatie van de Nederlandse Antillen met betrekking tot
    gebreide damespullovers van GN-code 6110 20'
  type: main
- language: pt
  script: Latn
  content: '92/197/CEE: Decisão da Comissão, de 24 de Março de 1992, que derroga
    a definição da noção de "produtos originários" para ter em conta a situação
    especial das Antilhas Neerlandesas relativamente a pulôveres de malha, de uso
    feminino, correspondentes ao código NC 6110 20'
  type: main
- language: es
  script: Latn
  content: '92/197/CEE: Decisión de la Comisión, de 24 de marzo de 1992, por la
    que se establece una excepción a la definición de la noción de "productos originarios"
    a fin de tener en cuenta la situación especial de las Antillas neerlandesas con
    respecto a los jerséis de punto de señora del código NC 6110 20'
  type: main
- language: sv
  script: Latn
  content: '92/197/EEG: Kommissionens beslut av den 24 mars 1992 om undantag från
