title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/1659 of 6 November 2020 further extending the
    temporary derogation from the Council’s Rules of Procedure introduced by Decision
    (EU) 2020/430, and extended by Decisions (EU) 2020/556, (EU) 2020/702, (EU) 2020/970
    and (EU) 2020/1253, in view of the travel difficulties caused by the COVID-19
    pandemic in the Union
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1659 du Conseil du 6 novembre 2020 portant nouvelle
