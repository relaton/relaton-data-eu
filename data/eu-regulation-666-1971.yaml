    von zur Verarbeitung bestimmtem gefrorenem Rindfleisch anzuwenden ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 666/71 della Commissione, del 30 marzo 1971, che modifica
    il regolamento (CEE) n. 1084/68 per quanto riguarda il tasso di sospensione del
    prelievo applicabile all'importazione delle carni bovine congelate atte alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 666/71 van de Commissie van 30 maart 1971 houdende
    wijziging van Verordening (EEG) nr. 1084/68 betreffende het percentage waarmee
    de heffing bij de invoer van bevroren, voor de verwerking bestemd, rundvlees wordt
    geschorst
