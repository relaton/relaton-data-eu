id: EURegulation5391993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 539/93 of 9 March 1993 determining to what
    extent licence applications submitted during February 1993 for live bovine animals
    weighing between 160 and 300 kg as part of an import quota provided for under
    interim agreements concluded between the Community and the Republic of Poland,
    the Republic of Hungary and the Czech and Slovak Federal Republic (CSFR) may be
    accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 539/93 de la Commission, du 9 mars 1993, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en février 1993 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un quota d'importation prévu
    par les accords intérimaires conclus par la Communauté avec la République de
    Pologne, la République de Hongrie et la République fédérative tchèque et
    slovaque (RFTS)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 539/93 der Kommission vom 9. März 1993 zur Festsetzung
    des Umfangs, in dem die im Februar 1993 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder gemäß den Interimsabkommen zwischen der Gemeinschaft und
    der Republik Polen, der Republik Ungarn und der Tschechischen und Slowakischen
    Föderativen Republik beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 539/93 af 9. marts 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i februar 1993 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et importkontingent, der er fastsat i interimsaftalerne mellem Fællesskabet
    og Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative
    Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 539/93 της Επιτροπής
    της 9ης Μαρτίου 1993 για τον καθορισμό του βαθμού
    στον οποίον είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί το Φεβρουάριο 1993 για ζωντανά ζώα
    του βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας ποσόστωσης εισαγωγής η οποία
    προβλέπεται από τις ενδιάμεσες συμφωνίες που
    έχουν συναφθεί μεταξύ, αφενός της Κοινότητας
    και, αφετέρου, της Δημοκρατίας της Πολωνίας,
    της Δημοκρατίας της Ουγγαρίας και της Τσεχικής
    και Σλοβακικής Ομοσπονδιακής Δημοκρατίας
    (ΤΣΟΔ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 539/93 della Commissione, del 9 marzo 1993, che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel mese di febbraio 1993 per gli animali vivi della specie bovina, dai 160 ai
    300 chilogrammi, nel quadro del contingente di importazione previsto dagli accordi
    interinali conclusi dalla Comunità con la Repubblica di Polonia, la Repubblica
    d' Ungheria e la Repubblica federativa ceca e slovacca (RFCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 539/93 van de Commissie van 9 maart 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor levende runderen met een gewicht van 160 tot 300 kg, die in februari 1993
    zijn ingediend op grond van de invoerregeling die is vastgesteld in de door de
    Gemeenschap met de Republiek Polen, de Republiek Hongarije en de Tsjechische en
    Slowaakse Federatieve Republiek (TSFR) gesloten interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 539/93 da Comissão, de 9 de Março de 1993, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 160 e 300 quilogramas,
    apresentados em Fevereiro de 1993 ao abrigo de uma quota de importação prevista
    nos acordos provisórios concluídos pela Comunidade com a República da Polónia,
    a República da Hungria e a República Federativa Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 539/93 de la Comisión, de 9 de marzo de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de animales vivos de la especie bovina con un peso entre 160 y
    300 kilogramos, presentadas en febrero de 1993 dentro de la cuota de importación
    establecida en los Acuerdos interinos celebrados entre la Comunidad y la República
    de Polonia, la República de Hungría y la República Federativa Checa y Eslovaca
    (RFCE)
  type: main
