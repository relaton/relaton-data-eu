    τρίτων χωρών, εδαφών ή ζωνών αυτών από τις οποίες
    / τα οποία επιτρέπεται η είσοδος στην Ένωση
    φορτίων πουλερικών και ζωικού αναπαραγωγικού
    υλικού πουλερικών, νωπού κρέατος από πουλερικά
    και πτερωτά θηράματα, και για τη διόρθωση των
    παραρτημάτων V και XIV του εκτελεστικού κανονισμού
    (ΕΕ) 2021/404 όσον αφορά συγκεκριμένες καταχωρίσεις
    για τις Ηνωμένες Πολιτείες
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2026/1959, 21. august 2026, millega muudetakse
    rakendusmääruse (EL) 2021/404 V ja XIV lisa seoses Kanadat ja Ameerika Ühendriike
    käsitlevate kannetega selliste kolmandate riikide, territooriumide või nende
    tsoonide loeteludes, millest on lubatud liitu tuua kodulindude ja kodulindude
    paljundusmaterjali ning kodulindude ja uluklindude värske liha saadetisi, ning
    millega parandatakse rakendusmääruse (EL) 2021/404 V ja XIV lisa seoses teatavate
    Ameerika Ühendriike käsitlevate kannetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2026/1959, annettu 21 päivänä
    elokuuta 2026, täytäntöönpanoasetuksen (EU) 2021/404 liitteiden V ja XIV muuttamisesta
    siltä osin kuin on kyse Kanadaa ja Yhdysvaltoja koskevista kohdista sellaisten
    kolmansien maiden, alueiden tai niiden vyöhykkeiden luetteloissa, joista siipikarjan,
    siipikarjan sukusolujen ja alkioiden sekä siipikarjasta ja riistalinnuista saatavan
    tuoreen lihan lähetysten saapuminen unioniin on sallittua, sekä täytäntöönpanoasetuksen
    (EU) 2021/404 liitteiden V ja XIV oikaisemisesta Yhdysvaltoja koskevien tiettyjen
    kohtien osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2026/1959 ón gCoimisiún an 21 Lúnasa
    2026 lena leasaítear Iarscríbhinní V agus XIV a ghabhann le Rialachán Cur
    Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na hiontrálacha a bhaineann
    le Ceanada agus leis na Stáit Aontaithe ar na liostaí de thríú tíortha, de
    chríocha nó de chriosanna de thríú tír nó de chríoch atá údaraithe maidir
    le coinsíneachtaí d’éanlaith chlóis agus de tháirgí geirmeacha ó éanlaith
    chlóis, agus d’fheoil úr ó éanlaith chlóis agus ó éin ghéim a theacht
    isteach san Aontas agus lena gceartaítear Iarscríbhinní V agus XIV a ghabhann
    le Rialachán Cur Chun Feidhme (AE) 2021/404 a mhéid a bhaineann le hiontrálacha
    áirithe a bhaineann leis na Stáit Aontaithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2026/1959 оd 21. kolovoza 2026. o izmjeni
    priloga V. i XIV. Provedbenoj uredbi (EU) 2021/404 u pogledu unosa za Kanadu i
    Sjedinjene Američke Države na popisima trećih zemalja, područja ili njihovih
    zona iz kojih je odobren ulazak u Uniju pošiljaka peradi i zametnih proizvoda
    peradi te svježeg mesa peradi i pernate divljači i o ispravku priloga V. i XIV.
    Provedbenoj uredbi (EU) 2021/404 u pogledu određenih unosa za Sjedinjene Američke
    Države
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/1959 végrehajtási rendelete (2026. augusztus 21.)
    az (EU) 2021/404 végrehajtási rendelet V. és XIV. mellékletének a baromfit,
    baromfi-szaporítóanyagokat, valamint baromfi és szárnyas vadak friss húsát
    tartalmazó szállítmányok Unióba történő beléptetésére engedéllyel
    rendelkező harmadik országok, területek vagy azok körzetei jegyzékében a
    Kanadára és az Egyesült Államokra vonatkozóan szereplő bejegyzések tekintetében
    történő módosításáról, valamint az (EU) 2021/404 végrehajtási rendelet
    V. és XIV. mellékletének az Egyesült Államokra vonatkozóan szereplő bejegyzések
    tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/1959 della Commissione, del 21 agosto
    2026, che modifica gli allegati V e XIV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda le voci relative al Canada e agli Stati Uniti negli elenchi
    di paesi terzi, territori o loro zone da cui è autorizzato l'ingresso nell'Unione
    di partite di pollame e materiale germinale di pollame e di carni fresche di pollame
    e selvaggina da penna e che rettifica tali allegati per quanto riguarda alcune
    voci relative agli Stati Uniti
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/1959 (2026. gada 21. augusts),
    ar ko attiecībā uz ierakstiem par Kanādu un Amerikas Savienotajām Valstīm
    tādu trešo valstu, teritoriju vai to zonu sarakstos, no kurām Savienībā atļauts
    ievest mājputnu un mājputnu reproduktīvo produktu un svaigas mājputnu un medījamo
    putnu gaļas sūtījumus, groza un attiecībā uz dažiem ierakstiem par Amerikas
    Savienotajām Valstīm labo Īstenošanas regulas (ES) 2021/404 V un XIV pielikumu
  type: main
- language: lt
  script: Latn
  content: 2026 m. rugpjūčio 21 d. Komisijos įgyvendinimo reglamentas (ES) 2026/1959,
    kuriuo dėl Kanadai ir Jungtinėms Valstijoms skirtų įrašų trečiųjų šalių,
    jų teritorijų arba zonų, iš kurių į Sąjungą leidžiama įvežti naminių
    paukščių, naminių paukščių genetinės medžiagos produktų ir naminių
    paukščių bei medžiojamųjų paukščių šviežios mėsos siuntas, sąrašuose
    iš dalies keičiami Įgyvendinimo reglamento (ES) 2021/404 V ir XIV priedai ir
    dėl Jungtinėms Valstijoms skirtų tam tikrų įrašų ištaisomi Įgyvendinimo
    reglamento (ES) 2021/404 V ir XIV priedai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/1959 tal-21
    ta’ Awwissu 2026 li jemenda l-Annessi V u XIV tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/404 fir-rigward tal-entrati għall-Kanada u għall-Istati Uniti fil-listi
    ta’ pajjiżi terzi, territorji jew żoni tagħhom li minnhom huwa awtorizzat
    id-dħul fl-Unjoni ta’ konsenji tal-pollam u tal-prodotti ġerminali tal-pollam,
    u tal-laħam frisk tal-pollam u tal-għasafar tal-kaċċa, u li jikkoreġi l-Annessi
    V u XIV tar-Regolament ta’ Implimentazzjoni (UE) 2021/404 fir-rigward ta’
    ċerti entrati għall-Istati Uniti
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2026/1959 van de Commissie van 21 augustus
    2026 tot wijziging van de bijlagen V en XIV bij Uitvoeringsverordening (EU) 2021/404
    wat betreft de vermeldingen voor Canada en de Verenigde Staten in de lijsten van
    derde landen, gebieden of zones daarvan waaruit de binnenkomst in de Unie van
    zendingen pluimvee en levende producten van pluimvee en van zendingen vers vlees
    van pluimvee en vederwild is toegestaan en tot rectificatie van de bijlagen V
    en XIV bij Uitvoeringsverordening (EU) 2021/404 wat bepaalde vermeldingen voor
    de Verenigde Staten betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2026/1959 z dnia 21 sierpnia 2026
    r. w sprawie zmiany załączników V i XIV do rozporządzenia wykonawczego (UE)
    2021/404 w odniesieniu do pozycji dotyczących Kanady i Stanów Zjednoczonych
    w wykazach państw trzecich, terytoriów lub ich stref, z których dozwolone jest
    wprowadzanie do Unii przesyłek drobiu, materiału biologicznego drobiu oraz świeżego
    mięsa drobiu i ptaków łownych, oraz w sprawie sprostowania załączników V
    i XIV do rozporządzenia wykonawczego (UE) 2021/404 w odniesieniu do niektórych
    pozycji dotyczących Stanów Zjednoczonych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2026/1959 da Comissão, de 21 de agosto
    de 2026, que altera os anexos V e XIV do Regulamento de Execução (UE) 2021/404
    no que diz respeito às entradas relativas ao Canadá e aos Estados Unidos nas
    listas de países terceiros, territórios ou respetivas zonas autorizados para
    a entrada na União de remessas de aves de capoeira e produtos germinais de aves
    de capoeira, e de carne fresca de aves de capoeira e aves de caça, e que retifica
    os anexos V e XIV do Regulamento de Execução (UE) 2021/404 no que diz respeito
    a determinadas entradas relativas ao Reino Unido
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2026/1959 al Comisiei din 21 august
    2026 de modificare a anexelor V și XIV la Regulamentul de punere în aplicare
    (UE) 2021/404 în ceea ce privește rubricile referitoare la Canada și Statele
    Unite din listele conținând țările terțe, teritoriile terțe sau zonele din
    acestea autorizate pentru introducerea în Uniune a transporturilor de păsări
    de curte, de materiale germinative provenite de la păsări de curte și de carne
    proaspătă provenită de la păsări de curte și de la vânat cu pene și de
    rectificare anexelor V și XIV la Regulamentul (UE) 2021/40 în ceea ce privește
    anumite rubrici referitoare la Statele Unite
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/1959 z 21. augusta 2026, ktorým
    sa menia prílohy V a XIV k vykonávaciemu nariadeniu (EÚ) 2021/404, pokiaľ
    ide o zápisy týkajúce sa Kanady a Spojených štátov amerických v zoznamoch
    tretích krajín, území alebo ich pásiem, z ktorých je povolený vstup zásielok
    hydiny, zárodočných produktov hydiny a čerstvého mäsa z hydiny a pernatej
    zveri do Únie, a ktorým sa opravujú prílohy V a XIV k vykonávaciemu nariadeniu
    (EÚ) 2021/404, pokiaľ ide o určité zápisy týkajúce sa Spojených štátov
    amerických
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2026/1959 z dne 21. avgusta 2026 o spremembi
    prilog V in XIV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Kanado in Združene
    države Amerike na seznamih tretjih držav, njihovih ozemelj ali območij, iz
    katerih je dovoljen vstop pošiljk perutnine, zarodnega materiala perutnine ter
    svežega mesa perutnine in pernate divjadi v Unijo ter o popravku prilog V in
    XIV k Izvedbeni uredbi (EU) 2021/404 glede nekaterih vnosov za Združene države
    Amerike
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/1959 de la Comisión, de 21 de agosto
    de 2026, por el que se modifican los anexos V y XIV del Reglamento de Ejecución
    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Canadá y
    a los Estados Unidos en las listas de terceros países, territorios o zonas de
    estos desde los que se autoriza la entrada en la Unión de partidas de aves de
    corral, productos reproductivos de aves de corral y carne fresca de aves de corral
    o de aves de caza, y por el que se corrigen dichos anexos en lo relativo a ciertas
    entradas correspondientes a los Estados Unidos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/1959 av den 21 augusti
    2026 om ändring av bilagorna V och XIV till genomförandeförordning (EU) 2021/404
    vad gäller posterna för Förenta staterna och Kanada i förteckningarna över
    tredjeländer, territorier eller zoner däri från vilka sändningar av fjäderfä
    och avelsmaterial från fjäderfä samt färskt kött från fjäderfä och fjädervilt
    får föras in till unionen, och om rättelse av de bilagorna V och XIV till genomförandeförordning
    (EU) 2021/404 vad gäller posterna för Förenta staterna
