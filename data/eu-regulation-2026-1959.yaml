id: EURegulation20261959
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1959 of 21 August 2026 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada and the United States in the lists of third countries, territories,
    or zones thereof authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry, and of fresh meat of poultry and game birds
    and correcting Annexes V and XIV of Implementing Regulation (EU) 2021/404 as regards
    certain entries for the United States
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1959 de la Commission du 21 août 2026
    modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404 en ce
    qui concerne les mentions relatives au Canada et aux États-Unis dans les listes
    de pays tiers, de territoires ou de parties de territoires en provenance desquels
    l’entrée dans l’Union d’envois de volailles et de produits germinaux de
    volailles, ainsi que de viandes fraîches de volailles et de gibier à plumes
    est autorisée, et rectifiant ces annexes en ce qui concerne certaines mentions
    pour les États-Unis
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/1959 der Kommission vom 21. August 2026
    zur Änderung der Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Kanada und die Vereinigten Staaten in den Listen
    der Drittländer, Gebiete oder Zonen derselben, aus denen der Eingang in die Union
    von Sendungen von Geflügel und Zuchtmaterial von Geflügel sowie von frischem
    Fleisch von Geflügel und Wildgeflügel zulässig ist, und zur Berichtigung der
    Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404 hinsichtlich bestimmter
    Einträge für die Vereinigten Staaten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/1959 на Комисията
    от 21 август 2026 година за изменение на приложения
    V и XIV към Регламент за изпълнение (ЕС) 2021/404 по
    отношение на вписванията за Канада и Съединените
    щати в списъците на трети държави, територии
    или зони от тях, от които е разрешено въвеждането
    в Съюза на пратки с домашни птици, зародишни
    продукти от домашни птици и прясно месо от
    домашни птици и пернат дивеч, и за поправка
    на приложения V и XIV към Регламент за изпълнение
    (ЕС) 2021/404 по отношение на някои вписвания за
    Съединените щати
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/1959 ze dne 21. srpna 2026, kterým
    se mění přílohy V a XIV prováděcího nařízení (EU) 2021/404, pokud jde
    o položky pro Kanadu a Spojené státy v seznamech třetích zemí, území nebo
    jejich oblastí, z nichž je povolen vstup zásilek drůbeže a zárodečných
    produktů drůbeže a čerstvého masa drůbeže a pernaté zvěře do Unie, a
    kterým se opravují přílohy V a XIV prováděcího nařízení (EU) 2021/404,
    pokud jde o některé položky pro Spojené státy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/1959 af 21. august 2026
    om ændring af bilag V og XIV til gennemførelsesforordning (EU) 2021/404 for
    så vidt angår oplysningerne om Canada og USA i listerne over tredjelande, territorier
    eller zoner deri, hvorfra det er tilladt at indføre sendinger af fjerkræ og
    avlsmateriale af fjerkræ og fersk kød af fjerkræ og fjervildt til Unionen,
    og om berigtigelse af bilag V og XIV til gennemførelsesforordning (EU) 2021/404
    for så vidt angår oplysningerne om USA
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/1959 της Επιτροπής,
    της 21ης Αυγούστου 2026, για την τροποποίηση των
    παραρτημάτων V και XIV του εκτελεστικού κανονισμού
    (ΕΕ) 2021/404 όσον αφορά τις καταχωρίσεις για τον
