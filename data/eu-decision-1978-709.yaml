title:
- language: en
  script: Latn
  content: Commission Decision of 27 July 1978 authorizing Ireland not to apply Community
    treatment to tents, falling within heading No ex 62.04 (NIMEXE codes 62.04-23,
    73) of the Common Customs Tariff, originating South Korea and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/709/CEE: Décision de la Commission, du 27 juillet 1978, autorisant
    l''Irlande à exclure du traitement communautaire les tentes de la position Ex
    62.04 du Tarif douanier commun (codes Nimexe : 62.04-23; 73), originaires de la
    Corée du Sud et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Juli 1978, mit der Irland ermächtigt
    wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Zelte der Tarifnummer ex 62.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    62.04-23; 73) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. juli 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage telte, som henhører under pos. 62.04 (NIMEXE-kode
    62.04-23, 73) i den fælles toldtarif, har oprindelse i Sydkorea og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 27 luglio 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario le tende della voce ex 62.04 (codice
    Nimexe: 62.04-23; 73) della tariffa doganale comune, originarie della Corea del
    Sud e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 juli 1978 waarbij Ierland wordt gemachtigd
    tenten, van post ex 62.04 van het gemeenschappelijk douanetarief (NIMEXE-code
    62.04-23, 73), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
