  content: Regulation (EEC) No 3208/74 of the Commission of 19 December 1974 fixing
    adjustments to be made to certain refunds fixed in advance for certain milk products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3208/74 de la Commission, du 19 décembre 1974, portant
    fixation des ajustements à apporter à certaines restitutions fixées à l'avance
    pour certains produits laitiers exportés sous forme de marchandises ne relevant
    pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3208/74 der Kommission vom 19. Dezember 1974 zur Festlegung
    der Berichtigungen für bestimmte im voraus festgesetzte Erstattungen für bestimmte
    Milcherzeugnisse, die in Form von Waren ausgeführt werden, die nicht unter Anhang
    II des Vertrages fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3208/74 af 19. december 1974 om fastsættelsen
    af justeringerne af visse forudfastsatte restitutioner for visse mejeriprodukter
    eksporteret i form af varer, som ikke omfattes af bilag II til traktaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3208/74 della Commissione, del 19 dicembre 1974, che
    stabilisce gli adeguamenti da apportare a talune restituzioni fissate in anticipo
    per taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3208/74 van de Commissie van 19 december 1974 houdende
    vaststelling van de aanpassingen aan te brengen in bepaalde vooraf vastgestelde
    restituties voor bepaalde melkprodukten, uitgevoerd in de vorm van goederen welke
    niet vallen onder bijlage II van het Verdrag
