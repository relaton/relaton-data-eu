    o Irskoj/Sjevernoj Irskoj
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2046 rendelete (2022. október 24.) az 1408/2013/EU
    rendelet mellékleteinek a Nagy-Britannia és Észak-Írország Egyesült Királyságának
    az Európai Unióból és az Európai Atomenergia-közösségből történő kilépéséről
    szóló megállapodás, valamint az ahhoz csatolt, Írországról/Észak-Írországról
    szóló jegyzőkönyv rendelkezéseinek figyelembevétele céljából történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/2046 della Commissione del 24 ottobre 2022 che modifica
    gli allegati del regolamento (UE) n. 1408/2013 in modo tale da renderli atti a
    rispecchiare le disposizioni dell’accordo sul recesso del Regno Unito di Gran
    Bretagna e Irlanda del Nord dall’Unione europea e dalla Comunità europea dell’energia
    atomica e del relativo protocollo su Irlanda/Irlanda del Nord
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2022/2046 (2022. gada 24. oktobris), ar ko groza
    Regulas (ES) Nr. 1408/2013 pielikumus nolūkā tos pielāgot, atspoguļojot Līguma
    par Lielbritānijas un Ziemeļīrijas Apvienotās Karalistes izstāšanos no Eiropas
    Savienības un Eiropas Atomenerģijas kopienas un tā Protokola par Īriju/Ziemeļīriju
    noteikumus
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (ES) 2022/2046 2022 m. spalio 24 d. kuriuo siekiant
    priderinti prie Susitarimo dėl Jungtinės Didžiosios Britanijos ir Šiaurės
    Airijos Karalystės išstojimo iš Europos Sąjungos ir Europos atominės energijos
    bendrijos ir jo Protokolo dėl Airijos ir Šiaurės Airijos nuostatų iš dalies
    keičiami Reglamento (ES) Nr. 1408/2013 priedai
  type: main
- language: mt
