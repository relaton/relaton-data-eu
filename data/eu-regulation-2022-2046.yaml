- language: en
  script: Latn
  content: Commission Regulation (EU) 2022/2046 of 24 October 2022 amending the Annexes
    to Regulation (EU) No 1408/2013 as regards their adaptation to reflect the provisions
    of the Agreement on the withdrawal of the United Kingdom of Great Britain and
    Northern Ireland from the European Union and the European Atomic Energy Community
    and its Protocol on Ireland/Northern Ireland
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/2046 de la Commission du 24 octobre 2022 modifiant
    les annexes du règlement (UE) no 1408/2013 aux fins de leur adaptation pour tenir
    compte des dispositions de l’accord sur le retrait du Royaume-Uni de Grande-Bretagne
    et d’Irlande du Nord de l’Union européenne et de la Communauté européenne
    de l’énergie atomique et de son protocole sur l’Irlande et l’Irlande du
    Nord
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/2046 der Kommission vom 24. Oktober 2022 zur Änderung
