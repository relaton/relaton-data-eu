    ustanovení Dohody o vystoupení Spojeného království Velké Británie a Severního
    Irska z Evropské unie a Evropského společenství pro atomovou energii a jejího
    Protokolu o Irsku/Severním Irsku
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2022/2046 af 24. oktober 2022 om ændring
