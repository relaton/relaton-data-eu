    с цел да бъдат отразени разпоредбите на Споразумението
    за оттеглянето на Обединеното кралство Великобритания
    и Северна Ирландия от Европейския съюз и Европейската
    общност за атомна енергия и Протокола за Ирландия/Северна
    Ирландия към него
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2022/2046 ze dne 24. října 2022, kterým se mění
