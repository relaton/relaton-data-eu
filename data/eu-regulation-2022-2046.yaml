    Unit al Marii Britanii și Irlandei de Nord din Uniunea Europeană și din Comunitatea
    Europeană a Energiei Atomice și ale Protocolului la acord privind Irlanda/Irlanda
    de Nord
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2022/2046 z 24. októbra 2022, ktorým sa menia
    prílohy k nariadeniu (EÚ) č. 1408/2013, pokiaľ ide o ich úpravu s cieľom
    zohľadniť ustanovenia Dohody o vystúpení Spojeného kráľovstva Veľkej Británie
    a Severného Írska z Európskej únie a z Európskeho spoločenstva pre atómovú
    energiu a jej protokolu o Írsku/Severnom Írsku
  type: main
