title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 25 octobre 1963, portant modification de
    sa décision du 30 août 1963 autorisant la République fédérale d'Allemagne
    à percevoir un montant compensatoire sur l'importation de certains catégories
    d'aliments pour animaux, contenant du lait
  type: main
- language: de
  script: Latn
  content: '63/605/EWG: Entscheidung der Kommission vom 25. Oktober 1963 zur Änderung
    ihrer Entscheidung vom 30. August 1963, durch die die Bundesrepublik Deutschland
    ermächtigt wird, bei der Einfuhr einiger Futtermittelarten, die Milch enthalten,
    einen Ausgleichsbetrag zu erheben'
  type: main
- language: it
  script: Latn
  content: '63/605/CEE: Decisione della Commissione del 25 ottobre 1963 che modifica
    la decisione del 30 agosto 1963 con la quale si autorizza la Repubblica federale
    di Germania a riscuotere un ammontare compensativo all''importazione di alcune
    categorie di alimenti per animali contenenti latte'
  type: main
- language: nl
  script: Latn
  content: '63/605/EEG: Beschikking van de Commissie van 25 oktober 1963 tot wijziging
    van haar beschikking van 30 augustus 1963, waarbij de Bondsrepubliek Duitsland
    wordt gemachtigd tot het heffen van een compenserend bedrag op de invoer van bepaalde
    soorten melkbevattende veevoeders'
  type: main
