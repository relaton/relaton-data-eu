title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1200/69 du Conseil, du 26 juin 1969, modifiant le
    règlement (CEE) n° 204/69 établissant, pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du Traité, les règles
    générales relatives à l'octroi des restitutions à l'exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1200/69 des Rates vom 26. Juni 1969 zur Änderung
    der Verordnung (EWG) Nr. 204/69 zur Festlegung der allgemeinen Regeln für die
    Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1200/69 del Consiglio, del 26 giugno 1969, che modifica
    il regolamento (CEE) n. 204/69 che stabilisce, per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell'allegato II del trattato, le regole generali
    relative alla concessione delle restituzioni all'esportazione e i criteri per
    stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1200/69 van de Raad van 26 juni 1969 houdende wijziging
    van Verordening (EEG) nr. 204/69 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
