title:
- language: en
  script: Latn
  content: Regulation (EEC) No 436/75 of the Commission of 21 February 1975 on the
    provisional interruption of the standing invitation to tender in respect of subsidies
    to be granted on sugar by virtue of Regulations (EEC) No 3062/74, (EEC) No 312/75
    and (EEC) No 314/75
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 436/75 de la Commission, du 21 février 1975, relatif
    à la suspension temporaire des adjudications permanentes en matière de subventions
    à octroyer dans le secteur du sucre en vertu des règlements (CEE) n 3062/74,
    (CEE) n 312/75 et (CEE) n 314/75
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 436/75 der Kommission vom 21. Februar 1975 zur vorübergehenden
    Aussetzung der in den Verordnungen (EWG) Nr. 3062/74, (EWG) Nr. 312/75 und (EWG)
    Nr. 314/75 vorgesehenen Dauerausschreibungen für die Gewährung von Subventionen
    im Zuckersektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 436/75 af 21. februar 1975 om midlertidig
    suspension af de løbende licitationer for så vidt angår de i forordningerne
    (EØF) nr. 3062/74, (EØF) nr. 312/75 og (EØF) nr. 314/75 omhandlede tilskud
    inden for sukkersektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 436/75 della Commissione, del 21 febbraio 1975, relativo
    alla sospensione temporanea delle gare permanenti in materia di sovvenzioni da
    accordare nel settore dello zucchero di cui ai regolamenti (CEE) n. 3062/74, (CEE)
    n. 312/75 e (CEE) n. 314/75
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 436/75 van de Commissie van 21 februari 1975 inzake
    de tijdelijke schorsing van de permanente openbare inschrijvingen met betrekking
    tot de in de suikersector te verlenen subsidies op grond van de Verordeningen
    (EEG) nr. 3062/74, (EEG) nr. 312/75 en (EEG) nr. 314/75
  type: main
