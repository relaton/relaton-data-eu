title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1483/83 of 8 June 1983 amending for the
    11th time Regulation (EEC) No 610/77 on the determination of prices of adult bovine
    animals on representative Community markets and the survey of prices of certain
    other cattle in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1483/83 de la Commission du 8 juin 1983 portant onzième
    modification du règlement (CEE) no 610/77 relatif à la détermination des prix
    des gros bovins constatés sur les marchés représentatifs de la Communauté
    et au relevé des prix de certains autres bovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1483/83 der Kommission vom 8. Juni 1983 zur elften
    Änderung der Verordnung (EWG) Nr. 610/77 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für ausgewachsene Rinder und
    zur Ermittlung der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1483/83 af 8. juni 1983 om ellevte
    ændring af forordning (EØF) nr. 610/77 om bestemmelse af de priser for voksent
    kvæg, der konstateres på Fællesskabets repræsentative markeder, og om registrering
    af priserne for visse andre kvægkategorier i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1483/83 της Επιτροπής
    της 8ης Ιουνίου 1983 που τροποποιεί για ενδέκατη
    φορά τον κανονισμό (ΕΟΚ) αριθ. 610/77 περί του καθορισμού
    των τιμών των χονδρών βοοειδών που διαπιστώνονται
    στις αντιπροσωπευτικές αγορές της Κοινότητας
    και του πίνακα τιμών ορισμένων άλλων βοοειδών
    εντός της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1483/83 della Commissione dell' 8 giugno 1983 che
    reca undicesima modifica del regolamento (CEE) n. 610/77 relativo alla determinazione
    dei prezzi dei bovini adulti constatati sui mercati rappresentativi della Comunità
    e al rilevamento dei prezzi di taluni altri bovini nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1483/83 van de Commissie van 8 juni 1983 houdende
    elfde wijziging van Verordening (EEG) nr. 610/77 betreffende de vaststelling van
    de op de representatieve markten van de Gemeenschap geconstateerde prijzen voor
    volwassen runderen en betreffende de constatering van de prijzen voor sommige
    andere runderen in de Gemeenschap
  type: main
