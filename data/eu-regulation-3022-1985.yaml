  content: Commission Regulation (EEC) No 3022/85 of 30 October 1985 re-establishing
    the levying of customs duties applicable to ethyl acetate falling within subheading
    29.14 A II c) ex 1, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3022/85 de la Commission du 30 octobre 1985 portant
