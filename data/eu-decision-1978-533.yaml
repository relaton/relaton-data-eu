type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 June 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' shirts, woven, of wool, of cotton or of
    man-made textile fibres, falling within heading No ex 61.03 (NIMEXE codes 61.03-11,
    15, 19) of the Common Customs Tariff, originating in Hong Kong and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/533/CEE: Décision de la Commission, du 5 juin 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises et chemisettes tissées, pour
    hommes et garçonnets, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, de la position Ex 61.03 du Tarif douanier commun (codes Nimexe
    : 61.03-11, 15, 19), originaires de Hong-Kong et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Juni 1978, mit der das Königreich Belgien,
    das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt werden,
    aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    Oberhemden, auch Sport- und Arbeitshemden, aus Geweben, für Männer und Knaben,
    aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen der Tarifnummer
    ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.03-11; 15; 19) von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 5. juni 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vævede skjorter (herunder sports- og arbejdsskjorter), til mænd og
    drenge, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 61.03 (NIMEXE-kode 61.03-11, 15, 19) i den fælles toldtarif, har
    oprindelse i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 giugno 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario camicie e camicette, tessute per uomo e per ragazzo,
    di lana, di cotone o di fibre tessili sintetiche o artificiali della voce ex 61.03
    della tariffa doganale comune (codice Nimexe 61.03-11, 15, 19), originari di Hong
    Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 juni 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    overhemden en sporthemden, geweven, voor heren en jongens, van wol, van katoen,
    of van synthetische of van kunstmatige textielvezels, van post ex 61.03 van het
    gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19), van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
