title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1066/2001 of 31 May 2001 determining, for
    the 2001 marketing year, the estimated loss of income and the estimated level
    of premium payable per ewe and per female goat and fixing the first advance payment
    for this premium and an advance payment of the specific aid for sheep and goat
    farming in certain less-favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1066/2001 de la Commission du 31 mai 2001 portant détermination,
    pour la campagne de commercialisation 2001, de la perte de revenu estimée et
    du montant estimé de la prime payable par brebis et par chèvre, et fixant la
    première avance payable sur cette prime et l'avance payable sur l'aide spécifique
    à l'élevage caprin et ovin dans certaines régions défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1066/2001 der Kommission vom 31. Mai 2001 zur Bestimmung
    des geschätzten Einkommensausfalls und der voraussichtlichen Prämienzahlungen
    je Mutterschaf und Ziege, des ersten Vorschusses auf diese Prämien sowie eines
    Vorschusses auf die Sonderbeihilfe für die Schaf- und Ziegenhaltung in bestimmten
    benachteiligten Gebieten der Gemeinschaft im Wirtschaftsjahr 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1066/2001 af 31. maj 2001 om fastsættelse
    for produktionsåret 2001 af det anslåede indkomsttab, det anslåede præmiebeløb,
    der skal betales pr. moderfår og moderged, det første forskud på dette præmiebeløb
    samt acontobeløbet på den særlige støtte til fåre- og gedeopdræt i visse
    ugunstigt stillede områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1066/2001 της Επιτροπής,
    της 31ης Μαΐου 2001, για τον προσδιορισμό, για
    την περίοδο εμπορίας 2001, της εκτιμώμενης απώλειας
    εισοδήματος και του εκτιμώμενου ύψους πριμοδότησης
    που καταβάλλεται ανά προβατίνα και ανά αίγα,
    καθώς και του ποσού της πρώτης προκαταβολής
    της πριμοδότησης αυτής και του ποσού της προκαταβολής
    της ειδικής ενίσχυσης στην εκτροφή αιγοπροβάτων
    σε ορισμένες μειονεκτικές περιοχές της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1066/2001, annettu 31 päivänä toukokuuta 2001,
    markkinointivuoden 2001 osalta arvioidun tulonmenetyksen sekä uuhta ja naaraspuolista
    vuohta kohden maksettavan palkkion arvioidun tason määrittämisestä sekä tämän
    palkkion ensimmäisen ennakkomaksun ja tietyillä yhteisön epäsuotuisilla alueilla
    lampaan ja vuohen kasvatukselle maksettavan erityisen tuen ennakkomaksun vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1066/2001 della Commissione, del 31 maggio 2001, che
    determina, per la campagna 2001, la perdita stimata di reddito, l'importo stimato
    del premio per pecora e per capra, l'ammontare del primo acconto del premio, nonché
    l'ammontare di un acconto dell'aiuto specifico per l'allevamento ovicaprino in
    alcune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1066/2001 van de Commissie van 31 mei 2001 tot vaststelling,
    voor het verkoopseizoen 2001, van het geraamde inkomensverlies en van het geraamde
    premiebedrag per ooi en per vrouwelĳke geit, alsmede van het eerste voorschot
    op deze premie en van een voorschot op de bĳzondere steun voor de schapen- en
    geitenhouderĳ in bepaalde probleemgebieden van de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1066/2001 da Comissão, de 31 de Maio de 2001, que
    determina, para a campanha de 2001, a perda estimada de rendimento e o montante
    estimado do prémio pagável por ovelha e por cabra e fixa o montante do primeiro
    pagamento por conta desse prémio, bem como o montante de um pagamento por conta
    da ajuda específica à criação de ovinos e caprinos em determinadas zonas desfavorecidas
    da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1066/2001 de la Comisión, de 31 de mayo de 2001, por
    el que se determinan, para la campaña de comercialización de 2001, la pérdida
    de renta estimada y el importe previsto de la prima pagadera por oveja y cabra,
    y por el que se fijan el importe del primer anticipo de esa prima y el de un anticipo
    de la ayuda específica para la cría ovina y caprina de algunas zonas desfavorecidas
    de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1066/2001 av den 31 maj 2001 om fastställande
    för regleringsåret 2001 av det beräknade inkomstbortfallet och det beräknade
    bidraget per tacka och per honget och om fastställande av den första förskottsutbetalningen
    av detta bidrag samt en förskottsbetalning av det särskilda stödet för uppfödning
    av får och getter i vissa mindre gynnade områden i gemenskapen
