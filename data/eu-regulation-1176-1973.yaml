title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1176/73 of the Commission of 4 May 1973 extending the
    interim measures for the importation into the Community of wine exported as 'Cyprus
    Sherry' originating in and coming from Cyprus, provided in Regulation (EEC) No
    456/73
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1176/73 de la Commission, du 4 mai 1973, portant prorogation
    des mesures transitoires applicables à l'importation dans la Communauté de vin
    exporté sous la mention "Cyprus Sherry" originaire et en provenance de Chypre
    visées au règlement (CEE) n° 456/73
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1176/73 der Kommission vom 4. Mai 1973 zur Verlängerung
    der in der Verordnung (EWG) Nr. 456/73 festgelegten Übergangsmaßnahmen für
    die Einfuhr von unter der Bezeichnung "Cyprus sherry" exportiertem Wein mit Ursprung
    in und Herkunft aus Zypern in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1176/73 af 4. maj 1973 om forlængelse
    af gyldigheden af de overgangsforanstaltninger, som finder anvendelse ved indførsel
    i Fællesskabet af vin eksporteret under betegnelsen »Cyprus sherry« med oprindelse
    i og indført fra Cypern, omhandlet i forordning (EØF) nr. 456/73
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1176/73 della Commissione, del 4 maggio 1973, che
    proroga le misure transitorie di cui al regolamento (CEE) n. 456/73 applicabili
    all'importazione nella Comunità di vino esportato sotto la menzione «Cyprus
    sherry» originario e in provenienza da Cipro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1176/73 van de Commissie van 4 mei 1973 houdende
    verlenging van de in Verordening (EEG) nr. 456/73 bedoelde overgangsmaatregelen
    voor invoer in de Gemeenschap van onder de naam "Cyprus sherry' uitgevoerde wijn
    van oorsprong en van herkomst uit Cyprus
  type: main
