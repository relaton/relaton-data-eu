title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/371 of 19 February 2026 recognising
    that the report submitted by Spain under Article 31(2) of Directive (EU) 2018/2001
    of the European Parliament and of the Council contains accurate data for the purposes
    of measuring the greenhouse gas emissions associated with the cultivation of wheat
    in that Member State
  type: main
- language: fr
  script: Latn
