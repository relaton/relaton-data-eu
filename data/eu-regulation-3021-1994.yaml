title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3021/94 of 8 December 1994 amending, for the
    second time, Regulation (EC) No 3676/93 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1994 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3021/94 du Conseil du 8 décembre 1994 modifiant pour
    la deuxième fois le règlement (CE) n° 3676/93 fixant, pour certains stocks
    de poissons ou groupes de stocks de poissons, les totaux admissibles des captures
    pour 1994 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3021/94 DES RATES vom 8. Dezember 1994 zur zweiten
    Änderung der Verordnung (EG) Nr. 3676/93 zur Festlegung der zulässigen Gesamtfangmengen
    und entsprechender Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen
    für 1994
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 3021/94 af 8. december 1994 om anden ændring
    af forordning (EF) nr. 3676/93 om fastsættelse for 1994 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3021/94 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 8ης Δεκεμβρίου 1994 για δεύτερη τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 3676/93 για καθορισμό,
    για ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπόμενων αλιευμάτων
    (TAC) για το 1994, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3021/94 DEL CONSIGLIO dell' 8 dicembre 1994 che modifica,
    per la seconda volta, il regolamento (CE) n. 3676/93 che stabilisce, per alcuni
    stock o gruppi di stock ittici, il totale ammissibile di catture (TAC) per il
    1994 e talune condizioni alle quali ne è soggetta la pesca
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3021/94 VAN DE RAAD van 8 december 1994 houdende tweede
    wijziging van Verordening (EG) nr. 3676/93 inzake de vaststelling van de voor
    1994 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    van visbestanden, alsmede de bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3021/94 DO CONSELHO de 8 de Dezembro de 1994 que altera
    pela segunda vez o Regulamento (CE) nº 3676/93, que fixa, relativamente a determinadas
    unidades populacionais ou grupos de unidades populacionais de peixes, os totais
    admissíveis de capturas para 1994 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3021/94 DEL CONSEJO de 8 de diciembre de 1994 que modifica
    por segunda vez el Reglamento (CE) nº 3676/93 por el que se fijan, para determinadas
    poblaciones y grupos de poblaciones de peces, los totales admisibles de capturas
    para 1994 y determinadas condiciones en las que pueden pescarse
  type: main
