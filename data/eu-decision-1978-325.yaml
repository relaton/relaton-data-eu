id: EUDecision1978325
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 February 1978 authorizing the French Republic
    not to apply Community treatment to shirts for men and boys, of wool, cotton or
    man-made textile fibres, falling within heading No ex 61.03 of the Common Customs
    Tariff, originating in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/325/CEE: Décision de la Commission, du 27 février 1978, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées pour hommes et garçonnets, de laine, de coton ou de fibres
    textiles synthétiques ou artificielles, de la position Ex 61.03 du Tarif douanier
    commun, originaires de Hong-Kong et mises en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Februar 1978, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, für
    Männer und Knaben, aus Wolle, aus Baumwolle oder aus synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. februar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævede skjorter, herunder
    sports- og arbejdsskjorter, til mænd og drenge, af uld, bomuld eller kemofibre,
    som henhører under pos. ex 61.03 i den fælles toldtarif, har oprindelse i Hong-kong
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 febbraio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicie e le camicette per
    uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della voce ex 61.03 della tariffa doganale comune, originarie di Hong Kong e messe
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 februari 1978 waarbij de Franse Republiek
    wordt gemachtigd overhemden en sporthemden voor heren en jongens, van wol, van
    katoen of van synthetische of kunstmatige textielvezels van post ex 61.03 van
    het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
