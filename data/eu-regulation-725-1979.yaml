    die Gewährung einer finanziellen Unterstützung für Demonstrationsvorhaben zur
    Energieeinsparung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 725/79 af 9. april 1979 om fastsættelse
