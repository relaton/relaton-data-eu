title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1788/81 of 30 June 1981 fixing, for the 1981/82
    marketing year, the derived intervention prices for white sugar, the intervention
    price for raw sugar, the minimum prices for A and B beet, the threshold prices
    and the amount of compensation for storage costs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1788/81 du Conseil, du 30 juin 1981, fixant, pour
    la campagne de commercialisation 1981/1982, les prix d' intervention dérivés
    du sucre blanc, le prix d' intervention du sucre brut, les prix minimaux de la
    betterave A et de la betterave B, les prix de seuil ainsi que le montant du remboursement
    pour la péréquation des frais de stockage
  type: main
- language: de
  script: Latn
