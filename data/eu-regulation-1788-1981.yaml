    für Rohzucker, der Mindestpreise für A- und B-Zuckerrüben, der Schwellenpreise
    sowie der Vergütung zum Ausgleich der Lagerkosten für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1788/81 af 30. juni 1981 om fastsættelse
    for produktionsåret 1981/82 af de afledte interventionspriser for hvidt sukker,
