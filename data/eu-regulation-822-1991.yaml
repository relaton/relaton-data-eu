  content: Commission Regulation (EEC) No 822/91 of 3 April 1991 fixing the estimated
    production of olive oil and the amount of the unit production aid that may be
    paid in advance for the 1990/1991 marketing year
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 822/91 DE LA COMMISSION du 3 avril 1991 fixant, pour
    la campagne de commercialisation 1990/1991, la production estimée d'' huile d''
    olive ainsi que le montant de l'' aide unitaire à la production qui peut être
    avancé #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 822/91 DER KOMMISSION vom 3. April 1991 zur Festsetzung
    der geschätzten Olivenölerzeugung und der als Vorschuß zahlbaren einheitlichen
    Erzeugungsbeihilfe für das Wirtschaftsjahr 1990/1991 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 822/91 af 3. april 1991 om fastsættelse
    for produktionsåret 1990/91 af den anslåede olivenolieproduktion samt af det
    enhedsbeløb for produktionsstøtten, der kan udbetales som forskud
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 822/91 της Επιτροπής
    της 3ης Απριλίου 1991 για τον καθορισμό, για την
    περίοδο εμπορίας 1990/91, της εκτιμωμένης παραγωγής
    ελαιόλαδου καθώς και του ποσού της μοναδιαίας
    ενισχύσεως στην παραγωγή που μπορεί να προκαταβληθεί
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 822/91 DELLA COMMISSIONE del 3 aprile 1991 che fissa,
    per la campagna di commercializzazione 1990/1991, la produzione stimata di olio
    d'' oliva e l'' importo dell'' aiuto unitario alla produzione che può essere
    anticipato #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 822/91 VAN DE COMMISSIE van 3 april 1991 tot vaststelling,
    voor het verkoopseizoen 1990/1991, van de geraamde olijfolieproduktie en van het
    bedrag van de produktiesteun per eenheid dat kan worden voorgeschoten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 822/91 DA COMISSÃO de 3 de Abril de 1991 que fixa,
