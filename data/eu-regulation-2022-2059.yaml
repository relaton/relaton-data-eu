title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2059 of 14 June 2022 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the technical details of back-testing
    and profit and loss attribution requirements under Articles 325bf and 325bg of
    Regulation (EU) No 575/2013
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2059 de la Commission du 14 juin 2022 complétant
    le règlement (UE) no 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les détails techniques des exigences
    de contrôles a posteriori et des exigences d’attribution des profits et pertes
    imposées par les articles 325 novoquinquagies et 325 sexagies du règlement (UE)
    no 575/2013
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2059 der Kommission vom 14. Juni 2022 zur
    Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Spezifizierung der technischen
    Einzelheiten der Anforderungen an Rückvergleiche und die Gewinn- und Verlustzuweisung
    gemäß den Artikeln 325bf und 325bg der Verordnung (EU) Nr. 575/2013
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/2059 на Комисията
    от 14 юни 2022 година за допълнение на Регламент
    (ЕС) № 575/2013 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се уточняват техническите характеристики
    във връзка с бек-тестовете и изискванията за
    разпределение на печалбата и загубата съгласно
    членове 325бе и 325бж от Регламент (ЕС) № 575/2013
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/2059 ze dne 14. června
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    575/2013 s ohledem na regulační technické normy upřesňující technické
    podrobnosti požadavků na zpětné testování a přiřazování zisků a ztrát
    podle článků 325bf a 325bg nařízení (EU) č. 575/2013
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/2059 af 14. juni 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013
    for så vidt angår reguleringsmæssige tekniske standarder, som præciserer de
    tekniske detaljer vedrørende backtesting og kravene vedrørende fordeling af
    overskud og tab i henhold til artikel 325bf og 325bg i forordning (EU) nr. 575/2013
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/2059
    της Επιτροπής της 14ης Ιουνίου 2022 για τη συμπλήρωση
    του κανονισμού (ΕΕ) αριθ. 575/2013 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    τα ρυθμιστικά τεχνικά πρότυπα που προσδιορίζουν
    τα τεχνικά στοιχεία του δοκιμαστικού εκ των
    υστέρων ελέγχου και των απαιτήσεων καταλογισμού
    κερδών και ζημιών σύμφωνα με τα άρθρα 325νη και
    325νθ του κανονισμού (ΕΕ) αριθ. 575/2013
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/2059, 14. juuni 2022, millega
