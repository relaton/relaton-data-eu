    (EL) nr 575/2013 artiklite 325bf ja 325bg kohaste järeltestimise ning kasumi
    ja kahjumi tekkeallikate määramise nõuete tehnilised üksikasjad
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/2059, annettu 14 päivänä kesäkuuta
