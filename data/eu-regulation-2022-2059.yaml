    teicniúla na gceanglas cúltástála agus na gceanglas sannta brabúis agus caillteanais
    faoi Airteagal 325bf agus Airteagal 325bg de Rialachán (AE) Uimh. 575/2013
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2059 оd 14. lipnja 2022. o dopuni
    Uredbe (EU) br. 575/2013 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda za tehničke detalje retroaktivnog testiranja te zahtjeva
    za raspodjelu dobiti i gubitka u skladu s člancima 325.bf i 325.bg Uredbe (EU)
    br. 575/2013
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2059 felhatalmazáson alapuló rendelete (2022.
    június 14.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek az 575/2013/EU
    rendelet 325bf. és 325bg. cikke szerinti utótesztelési és eredményvizsgálati
    követelmények technikai részleteit meghatározó szabályozástechnikai standardok
    tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2059 della Commissione del 14 giugno 2022
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le caratteristiche
    tecniche dei requisiti relativi ai test retrospettivi e all’assegnazione di
    profitti e perdite a norma degli articoli 325 novoquinquagies e 325 sexagies del
    regolamento (UE) n. 575/2013
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2059 (2022. gada 14. jūnijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 575/2013 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizē atpakaļejošas pārbaudes
    un peļņas un zaudējumu attiecinājuma prasību tehniskos datus saskaņā ar
    Regulas (ES) Nr. 575/2013 325.bf un 325.bg pantu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2059 2022 m. birželio 14
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas
    techniniais reguliavimo standartais, kuriais nustatomi Reglamento (ES) Nr. 575/2013
    325bf ir 325bg straipsniuose nurodyti grįžtamojo patikrinimo ir pelno ir nuostolio
    priskyrimo reikalavimų techniniai elementai
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2059 tal-14 ta’ Ġunju 2022
    li jissupplimenta r-Regolament (UE) Nru 575/2013 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ standards tekniċi regolatorji li jispeċifikaw id-dettalji
    tekniċi tal-ittestjar retrospettiv u r-rekwiżiti tal-attribuzzjoni u tal-profitt
    u t-telf skont l-Artikoli 325bf u 325bg tar-Regolament (UE) Nru 575/2013
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2059 van de Commissie van 14 juni 2022
    tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement en
    de Raad met technische reguleringsnormen tot nadere bepaling van de technische
    details van de vereisten inzake backtesting en toeschrijving van winsten en verliezen
    op grond van de artikelen 325 novoquinquagies en 325 sexagies van Verordening
    (EU) nr. 575/2013
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2059 z dnia 14 czerwca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 575/2013
    w odniesieniu do regulacyjnych standardów technicznych określających szczegółowe
    informacje techniczne na potrzeby wymogu dotyczącego weryfikacji historycznej
    oraz wymogu dotyczącego przypisania zysków i strat zgodnie z art. 325bf i 325bg
    rozporządzenia (UE) nr 575/2013
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2059 da Comissão de 14 de junho de 2022
    que complementa o Regulamento (UE) n.o 575/2013 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação para especificar os pormenores
    técnicos dos requisitos aplicáveis às verificações a posteriori e à atribuição
    de lucros e perdas nos termos dos artigos 325.o-BC e 325.°-BG do Regulamento
    (UE) n.o 575/2013
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2059 al Comisiei din 14 iunie 2022 de completare
    a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează detaliile
    tehnice ale cerințelor privind testarea ex post și atribuirea profitului și
    a pierderii în temeiul articolelor 325bf și 325bg din Regulamentul (UE) nr.
    575/2013
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2059 zo 14. júna 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ
    ide o regulačné technické predpisy, ktorými sa stanovujú technické podrobnosti
    spätného testovania a požiadavky na pridelenie ziskov a strát podľa článkov
    325bf a 325bg nariadenia (EÚ) č. 575/2013
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2059 z dne 14. junija 2022 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki določajo tehnične podrobnosti testiranja za nazaj
    ter zahteve po pripisu dobičkov in izgub v skladu s členoma 325bf in 325bg Uredbe
    (EU) št. 575/2013
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2059 de la Comisión de 14 de junio de 2022
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los detalles técnicos de los requisitos en materia de pruebas retrospectivas
    y atribución de pérdidas y ganancias con arreglo a los artículos 325 ter septies
    y 325 ter octies del Reglamento (UE) n.o 575/2013
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2059 av den 14 juni 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska tillsynsstandarder som specificerar de tekniska detaljerna
    för krav avseende utfallstest och resultatanalys enligt artikel 325bf och 325bg
    i förordning (EU) nr 575/2013
