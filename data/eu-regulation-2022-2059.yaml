    ja voittojen ja tappioiden tarkastelua koskevien vaatimusten teknisiä yksityiskohtia
    koskevilla teknisillä sääntelystandardeilla
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/2059 ón gCoimisiún an 14 Meitheamh 2022
