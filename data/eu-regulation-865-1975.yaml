  content: Regulation (EEC) No 865/75 of the Council of 18 March 1975 laying down
    general rules for the supply of butteroil under the 1975 food-aid programme to
    the Office of the United Nations High Commissioner for Refugees (UNHCR) for those
    affected by the events in Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 865/75 du Conseil, du 18 mars 1975, établissant les
    règles générales relatives à la fourniture au Haut-Commissariat des Nations
    Unies pour les réfugiés (UNHCR) dans le cadre du programme d'aide alimentaire
    pour 1975 de butteroil destiné aux populations affectées par les événements
    de Chypre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 865/75 des Rates vom 18. März 1975 über die Grundregeln
    für die Lieferung von Butteroil an das Hochkommissariat der Vereinten Nationen
    für Flüchtlinge (UNHCR) zugunsten der von den Ereignissen auf Zypern betroffenen
    Bevölkerung im Rahmen des Nahrungsmittelshilfeprogramms 1975
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 865/75 af 18. marts 1975 om almindelige regler
    vedrørende levering til De forenede Nationers Højkommissariat for Flygtninge
    (UNHCR) om som et led i programmet for fødevarehjælp for 1975, af butteroil,
    bestemt til befolkningsgrupper, der er ramt af begivenhederne på Cypern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 865/75 del Consiglio, del 18 marzo 1975, che stabilisce,
