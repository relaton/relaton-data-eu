  content: Commission Implementing Regulation (EU) 2022/651 of 20 April 2022 initiating
    a review of Implementing Regulation (EU) 2017/1993 imposing a definitive anti-dumping
    duty on imports of certain open mesh fabrics of glass fibres originating in the
    People’s Republic of China as extended to imports of certain open mesh fabrics
    of glass fibres consigned from India, Indonesia, Malaysia, Taiwan and Thailand,
    whether declared as originating in these countries or not, for the purposes of
    determining the possibility of granting an exemption from those measures to one
    Indian exporting producer, repealing the anti-dumping duty with regard to imports
    from that exporting producer and making imports from that exporting producer subject
    to registration
