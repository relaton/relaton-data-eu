    (UE) 2017/1993 por el que se establece un derecho antidumping definitivo sobre
    las importaciones de determinados tejidos de malla abierta hechos de fibra de
    vidrio originarios de la República Popular China, ampliado a las importaciones
    de determinados tejidos de malla abierta hechos de fibra de vidrio procedentes
    de la India, Indonesia, Malasia, Taiwán y Tailandia, hayan sido declarados o
    no originarios de dichos países, a fin de determinar la posibilidad de eximir
    de tales medidas a un productor exportador indio, de derogar el derecho antidumping
    con respecto a las importaciones procedentes de ese productor exportador y de
    someter estas importaciones a la obligación de registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/651 av den 20 april 2022
    om inledande av en översyn av genomförandeförordning (EU) 2017/1993 om införande
    av en slutgiltig antidumpningstull på import av vissa glasfibervävnader med
    öppna maskor med ursprung i Folkrepubliken Kina, utvidgad till att omfatta import
    av vissa glasfibervävnader med öppna maskor som avsänts från Indien, Indonesien,
    Malaysia, Taiwan och Thailand, oavsett om produkternas deklarerade ursprung är
    dessa länder eller inte, i syfte att fastställa om det är möjligt att bevilja
    en indisk exporterande tillverkare befrielse från dessa åtgärder, upphäva
    antidumpningstullen avseende import från den exporterande tillverkaren och låta
    import från den exporterande tillverkaren omfattas av registrering
  type: main
