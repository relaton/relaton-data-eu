type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 744/2003 of 28 April 2003 amending, for the
    second time, Council Regulation (EC) No 1081/2000 prohibiting the sale, supply
    and export to Burma/Myanmar of equipment which might be used for internal repression
    or terrorism, and freezing the funds of certain persons related to important governmental
    functions in that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 744/2003 de la Commission du 28 avril 2003 modifiant
    pour la deuxième fois le règlement (CE) n° 1081/2000 du Conseil concernant
    l'interdiction de la vente, de la fourniture et de l'exportation à la Birmanie/au
    Myanmar de matériel susceptible d'être utilisé à des fins de répression interne
    ou de terrorisme, et le gel des fonds appartenant à certaines personnes ayant
    un lien avec d'importantes fonctions gouvernementales dans ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 744/2003 der Kommission vom 28. April 2003 zur zweiten
    Änderung der Verordnung (EG) Nr. 1081/2000 des Rates über das Verbot des Verkaufs,
    der Lieferung und der Ausfuhr nach Birma/Myanmar von Ausrüstungen, die zur internen
    Repression oder für terroristische Zwecke benutzt werden können, und über das
    Einfrieren der Gelder bestimmter, mit wichtigen Regierungsfunktionen verbundener
    Personen in diesem Land
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 744/2003 af 28. april 2003 om anden ændring
    af Rådets forordning (EF) nr. 1081/2000 om forbud mod salg, levering og eksport
    til Burma/Myanmar af udstyr, der kan anvendes til intern undertrykkelse eller
    terrorisme, og om indefrysning af midler tilhørende visse personer, der har tilknytning
    til vigtige regeringsfunktioner i nævnte land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 744/2003 της Επιτροπής,
    της 28ης Απριλίου 2003, για την τροποποίηση, για
    δεύτερη φορά, του κανονισμού (ΕΚ) αριθ. 1081/2000
    του Συμβουλίου, σχετικά με την απαγόρευση πώλησης,
    προμήθειας και εξαγωγής στη Βιρμανία/Μιανμάρ
    εξοπλισμού δυνάμενου να χρησιμοποιηθεί για
    εσωτερική καταστολή ή τρομοκρατία, και τη δέσμευση
    των κεφαλαίων ορισμένων υψηλών δημοσίων αξιωματούχων
    στην εν λόγω χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 744/2003, annettu 28 päivänä huhtikuuta 2003,
    kansallisiin tukahduttamistoimiin tai terrorismiin mahdollisesti käytettävien
    tarvikkeiden Burmaan/Myanmariin tapahtuvan myynnin, toimittamisen ja viennin kieltämisestä
    sekä tiettyjen tärkeissä valtiollisissa tehtävissä kyseisessä maassa toimivien
    henkilöiden varojen jäädyttämisestä annetun neuvoston asetuksen (EY) N:o
    1081/2000 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 744/2003 della Commissione, del 28 aprile 2003, recante
    seconda modifica del regolamento (CE) n. 1081/2000 del Consiglio che vieta la
    vendita, la fornitura e l'esportazione in Birmania/Myanmar di attrezzature che
    possono essere utilizzate per la repressione interna o a fini terroristici e congela
    i capitali di determinate persone che ricoprono importanti cariche pubbliche sul
    suo territorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 744/2003 van de Commissie van 28 april 2003 tot wĳziging,
    voor de tweede maal, van Verordening (EG) nr. 1081/2000 van de Raad betreffende
    een verbod op de verkoop en de levering aan en de uitvoer naar Birma/Myanmar van
    uitrusting die voor binnenlandse repressie of terrorisme kan worden gebruikt,
    en betreffende het bevriezen van de middelen van bepaalde personen die in dat
    land belangrĳke regeringsposten bekleden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 744/2003 da Comissão, de 28 de Abril de 2003, que
    altera, pela segunda vez, o Regulamento (CE) n.° 1081/2000 do Conselho, que proíbe
    a venda, o fornecimento e a exportação para a Birmânia/Myanmar de equipamento
    susceptível de ser utilizado para actividades de repressão interna ou de terrorismo
    e que congela os fundos de determinadas pessoas ligadas a importantes cargos públicos
    nesse país
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 744/2003 de la Comisión, de 28 de abril de 2003, por
    el que se modifica por segunda vez el Reglamento (CE) n° 1081/2000 del Consejo
    por el que se prohíbe la venta, suministro y exportación a Birmania/Myanmar
    de equipos que pudieran utilizarse para la represión interior o en acciones de
    terrorismo, y por el que se congelan los capitales de determinadas personas relacionadas
    con importantes funciones gubernamentales en dicho país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 744/2003 av den 28 april 2003 om ändring
    för andra gången av rådets förordning (EG) nr 1081/2000 om förbud mot försäljning,
    leverans och export till Burma/Myanmar av utrustning som kan användas i det inre
    förtrycket eller för terrorhandlingar och om frysande av tillgångar som innehas
    av vissa personer med anknytning till viktiga offentliga tjänster i Burma/Myanmar
  type: main
