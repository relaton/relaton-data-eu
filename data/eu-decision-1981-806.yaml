  type: main
- language: it
  script: Latn
  content: '81/806/CEE: Decisione della Commissione, del 22 luglio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli ombrelli (da
    pioggia e da sole), compresi gli ombrelli-bastone, originari di Hong Kong (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
