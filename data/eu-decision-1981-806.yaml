title:
- language: en
  script: Latn
  content: '81/806/EEC: Commission Decision of 22 July 1981 authorizing the French
    Republic not to apply Community treatment to umbrellas and sunshades, including
    walking- stick umbrellas, originating in Hong Kong (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/806/CEE: Décision de la Commission, du 22 juillet 1981, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles originaires de Hong-kong (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/806/EWG: Entscheidung der Kommission vom 22. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus Hongkong stammende Regenschirme und Sonnenschirme,
    einschließlich Stockschirme, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/806/EØF: Kommissionens beslutning af 22. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage paraplyer og
    parasoller (herunder stokkeparaplyer) med oprindelse i Hongkong (Kun den franske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/806/EOK: Απόφαση τής Επιτροπής τής 22ας Ιουλίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά αλεξιβρόχια, τά αλεξήλια καί τά υπό μορφή
    ράβδων παρουσιαζόμενα αλεξιβρόχια καταγωγής
