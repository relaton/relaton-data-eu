title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1932/95 of 3 August 1995 determining to what
    extent applications for import licences for calves not exceeding 80 kilograms
    lodged under Regulation (EC) No 1566/95 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1932/95 DE LA COMMISSION du 3 août 1995 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CE) n° 1566/95 relatif à l'importation
    de veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1932/95 DER KOMMISSION vom 3. August 1995 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Erteilung von Lizenzen für die Einfuhr
    von höchstens 80 kg wiegenden Rindern gemäß der Verordnung (EG) Nr. 1566/95
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1932/95 af 3. august 1995 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for kalve
    på ikke over 80 kg i henhold til forordning (EF) nr. 1566/95 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1932/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 3ης Αυγούστου 1995 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΚ) αριθ. 1566/95 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1932/95, annettu 3 päivänä elokuuta 1995,
    asetuksen (EY) N:o 1566/95 mukaisesti jätettyjen enintään 80 kilogramman painoisia
    vasikoita koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1932/95 DELLA COMMISSIONE del 3 agosto 1995 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel quadro del regolamento (CE) n. 1566/95 per l'importazione di vitelli di peso
    non superiore a 80 chilogrammi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1932/95 VAN DE COMMISSIE van 3 augustus 1995 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om afgifte van invoercertificaten
    die zijn ingediend op grond van Verordening (EG) nr. 1566/95 betreffende de invoer
    van kalveren van maximaal 80 kg
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1932/95 DA COMISSÃO de 3 de Agosto de 1995 que determina
    em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados ao abrigo do Regulamento (CE) nº 1566/95 relativo
    à importação de vitelos de peso não superior a 80 quilogramas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 1932/95 DE LA COMISIÓN de 3 de agosto de 1995 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de expedición
    de certificados de importación presentadas con arreglo al Reglamento (CE) n°
    1566/95 relativo a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1932/95 av den 3 augusti 1995 om fastställande
    av i vilken utsträckning ansökningar om importlicenser som lämnats in i enlighet
    med förordning (EG) nr 1566/95 angående import av kalvar som väger högst 80
    kg kan godkännas
  type: main
