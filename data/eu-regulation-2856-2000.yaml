    le secteur du lait et des produits laitiers, des régimes prévus dans les accords
    européens entre la Communauté et la République de Hongrie, la République de
    Pologne, la République tchèque, la République slovaque, la Bulgarie, la Roumanie
    et la Slovénie et du régime prévu dans les accords sur la libéralisation des
    échanges entre la Communauté et les pays baltes
  type: main
