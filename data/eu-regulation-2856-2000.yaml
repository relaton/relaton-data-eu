  content: Commission Regulation (EC) No 2856/2000 of 27 December 2000 amending Regulation
    (EC) No 2508/97 laying down detailed rules for the application to milk and milk
    products of the schemes provided for in the Europe Agreements between the Community
    and the Republic of Hungary, the Republic of Poland, the Czech Republic, the Slovak
    Republic, Bulgaria, Romania and Slovenia, and the Agreements on free trade between
    the Community and the Baltic States
  type: main
