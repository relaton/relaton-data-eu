title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU, Euratom) 2019/2002 of 28 November
    2019 as regards the authorisation for Bulgaria to continue to use certain approximate
    estimates for the calculation of the VAT own resources base in respect of international
    transport of passengers until the end of 2023 (notified under document C(2019)8590)
    (Only the Bulgarian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’Exécution (UE, Euratom) 2019/2002 de la Commission du 28
    novembre 2019 concernant l’autorisation, pour la Bulgarie, de continuer à utiliser
    certaines estimations approximatives pour le calcul de la base des ressources
    propres provenant de la taxe sur la valeur ajoutée pour les transports internationaux
    de personnes jusqu’à la fin de 2023 [notifiée sous le numéro C(2019) 8590]
    (Le texte en langue bulgare est le seul faisant foi)
  type: main
- language: de
  script: Latn
