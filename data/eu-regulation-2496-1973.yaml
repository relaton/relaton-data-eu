title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2496/73 of the Commission of 13 September 1973 amending
    Regulation (EEC) No 2049/73 laying down general rules concerning the components
    designed to ensure, within the cereals and rice sectors, the protection of the
    processing industry as regards trade within the Community for the 1973/74 marketing
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2496/73 de la Commission, du 13 septembre 1973, modifiant
    le règlement (CEE) n° 2049/73 fixant, en ce qui concerne les échanges intracommunautaires
    pour la campagne de commercialisation 1973/1974, les éléments destinés à assurer,
    dans le secteur des céréales et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2496/73 der Kommission vom 13. September 1973 zur
    Änderung der Verordnung (EWG) Nr. 2049/73 zur Festsetzung des Bestandteils zum
    Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor im Hinblick
    auf den innergemeinschaftlichen Handel für das Wirtschaftsjahr 1973/1974
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2496/73 af 13. september 1973 om ændring
    af forordning (EØF) nr. 2049/73 om fastsættelse for høståret 1973/1974 i -
    for handel inden for fællesskabet - af de elementer, der for korn og ris har
    til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2496/73 della Commissione, del 13 settembre 1973,
    recante modifica del regolamento (CEE) n. 2049/73 che fissa, per quanto riguarda
    gli scambi intracomunitari per la campagna di commercializzazione 1973/1974, gli
    elementi destinati ad assicurare la protezione dell'industria di trasformazione
    nel settore dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2496/73 van de Commissie van 13 september 1973 houdende
    wijziging van Verordening (EEG) nr. 2049/73 tot vaststelling van de elementen
    die dienen om in het verkoopseizoen 1973/1974 in het intracommunautaire handelsverkeer
    in de sector granen en rijst de bescherming van de verwerkende industrie te verzekeren
  type: main
