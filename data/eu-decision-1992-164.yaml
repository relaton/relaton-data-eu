---
id: EUDecision1992164
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '92/164/EEC, Euratom: Commission Decision of 25 February 1992 authorizing
    Portugal to use statistics for years earlier than the last year but one and not
    to take into account certain categories of transactions or to use certain approximate
    estimates for the calculation of the VAT own resources base (Only the Portuguese
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/164/CEE, Euratom: Décision de la Commission, du 25 février 1992,
    autorisant le Portugal à utiliser des données statistiques antérieures à la
    pénultième année et à ne pas tenir compte de certaines catégories d''opérations
    ou à utiliser certaines estimations approximatives pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/164/EWG, Euratom: Entscheidung der Kommission vom 25. Februar 1992
    mit der Portugal ermächtigt wird, statistische Angaben aus Jahren vor dem vorletzten
    Jahr vor dem betreffenden Haushaltsjahr zu verwenden, bei der Berechnung der Grundlage
    für die MwSt.-Eigenmittel bestimmte Gruppen von Umsätzen nicht zu berücksichtigen
    und die Grundlage bei bestimmten anderen Gruppen von Umsätzen anhand annähernder
    Schätzungen zu ermitteln (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/164/EØF, Euratom: Kommissionens beslutning af 25. februar 1992 om
    bemyndigelse af Portugal til at beregne grundlaget for Fællesskabernes momsindtægter
    på basis af statistiske oplysninger hidrørende fra det år, der ligger længere
    tilbage end det næstsidste år, at undlade at tage hensyn til visse transaktioner
    og, for andre transaktioners vedkommende, at foretage en tilnærmelsesvis vurdering
    (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/164/ΕΟΚ, Ευρατόμ: Απόφαση της Επιτροπής
    της 25ης Φεβρουαρίου 1992 με την οποία επιτρέπεται
    στην Πορτογαλία να χρησιμοποιεί στατιστικά
    δεδομένα προγενέστερα εκείνων του προτελευταίου
    έτους και να μην λαμβάνει υπόψη ορισμένες κατηγορίες
    δραστηριοτήτων ή να χρησιμοποιεί κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από το φόρο επί
    της προστιθέμενης αξίας (Το κείμενο στην πορτογαλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '92/164/ETY, Euratom: Komission päätös, tehty 25 päivänä helmikuuta
    1992, luvan antamisesta Portugalille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi (Ainoastaan portugalinkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '92/164/CEE, Euratom: Decisione della Commissione, del 25 febbraio 1992,
    che autorizza la Repubblica portoghese a utilizzare dati statistici anteriori
    al penultimo anno e a non tener conto di determinate categorie di operazioni o
    a ricorrere a talune valutazioni approssimative per il calcolo della base delle
    risorse proprie provenienti dell''imposta sul valore aggiunto (Il testo in lingua
    portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/164/EEG, Euratom: Beschikking van de Commissie van 25 februari 1992
    waarbij Portugal wordt gemachtigd statistische gegevens van vóór het voorlaatste
    jaar te gebruiken en geen rekening te houden met bepaalde categorieën handelingen
    of gebruik te maken van ramingen voor de berekening van de grondslag van de eigen
    middelen uit de belasting over de toegevoegde waarde (Slechts de tekst in de Portugese
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/164/CEE, Euratom: Decisão da Comissão, de 25 de Fevereiro de 1992,
    que autoriza Portugal a utilizar dados estatísticos anteriores ao penúltimo
    ano e a não ter em conta determinadas categorias de operações ou a utilizar
    determinadas estimativas aproximativas para o cálculo da matéria colectável
    dos recursos próprios provenientes do imposto sobre o valor acrescentado (Apenas
    faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '92/164/CEE, Euratom: Decisión de la Comisión, de 25 de febrero de 1992,
    por la que se autoriza a Portugal a utilizar datos estadísticos anteriores al
    penúltimo año y a no tomar en consideración determinadas categorías de operaciones
    o a utilizar determinadas estimaciones aproximadas para el cálculo de la base
    de los recursos propios procedentes del impuesto sobre el valor añadido (El texto
    en lengua portuguesa es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '92/164/EEG, Euratom: Kommissionens beslut av den 25 februari 1992 som
    bemyndigar Portugal att inte beakta vissa kategorier av transaktioner eller att
    använda vissa ungefärliga uppskattningar vid beräkning av den bas av egna medel
    som härrör från mervärdeskatten (Endast den portugisiska texten är giltig)'
  type: main
