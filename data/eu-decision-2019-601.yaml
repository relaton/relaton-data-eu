    auf die Aufnahme des Vereinigten Königreichs Großbritannien und Nordirland und
    mancher seiner unmittelbar der englischen Krone unterstehenden Gebiete in die
    Liste der Drittländer bzw. der Teile von Drittländern, aus denen die Einfuhr
    von Rindersperma in die Union zugelassen ist (Bekannt gegeben unter Aktenzeichen
    C(2019) 2832)
  type: main
