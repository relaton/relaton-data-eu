title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/601 of 11 April 2019 amending
    Annex I to Implementing Decision 2011/630/EU as regards the inclusion of the United
    Kingdom of Great Britain and Northern Ireland and certain of its Crown Dependencies
    in the list of third countries or parts thereof authorised for the introduction
    into the Union of semen of domestic animals of the bovine species (notified under
    document C(2019) 2832)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/601 de la Commission du 11 avril 2019
    modifiant l'annexe I de la décision d'exécution 2011/630/UE en ce qui concerne
    l'inscription du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord et de certaines
    dépendances de la Couronne sur la liste des pays tiers ou parties de pays tiers
    en provenance desquels l'introduction dans l'Union de sperme d'animaux de l'espèce
    bovine est autorisée [notifiée sous le numéro C(2019) 2832]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/601 der Kommission vom 11. April 2019
