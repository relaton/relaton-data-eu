    ceea ce privește includerea Regatului Unit al Marii Britanii și Irlandei de
    Nord și a anumitor teritorii dependente ale Coroanei Britanice în lista țărilor
    terțe sau a părților acestora autorizate pentru introducerea în Uniune de
    material seminal de la animale domestice din specia bovină [notificată cu numărul
    C(2019) 2832]
  type: main
