    Észak-Írország Egyesült Királyságának és egyes koronafüggőségeinek
    a szarvasmarhafajba tartozó háziállatok spermájának az Unióba való behozatalára
    engedéllyel rendelkező harmadik országok vagy azok részei jegyzékébe való
