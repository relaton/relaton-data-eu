id: EURegulation25062001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2506/2001 of 20 December 2001 determining
    the extent to which applications lodged in December 2001 for import licences for
    certain pigmeat sector products under the regime provided for by Council Regulation
    (EC) No 774/94 opening and providing for the administration of certain Community
    tariff quotas for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2506/2001 de la Commission du 20 décembre 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2001 pour certains produits du secteur de la viande de porc peuvent
    être acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94
    du Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2506/2001 der Kommission vom 20. Dezember 2001 über
    die Festsetzung des Umfangs, in dem die im Dezember 2001 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend
    der Regelung der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung
    gemeinschaftlicher Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2506/2001 af 20. december 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i december
    2001 om importlicenser for visse produkter inden for svinekødssektoren i forbindelse
    med Rådets forordning (EF) nr. 774/94 om åbning og forvaltning af en række
    EF-toldkontingenter for oksekød af høj kvalitet, svinekød, fjerkrækød, hvede
    og blandsæd af hvede og rug samt klid og andre restprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2506/2001 της Επιτροπής,
    της 20ής Δεκεμβρίου 2001, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Δεκέμβριο
    2001 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα του χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 774/94 του Συμβουλίου για το άνοιγμα
    και τον τρόπο διαχείρισης ορισμένων κοινοτικών
    δασμολογικών ποσοστώσεων για το χοίρειο κρέας,
    και για ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2506/2001, annettu 20 päivänä joulukuuta 2001,
    joulukuussa 2001 jätettyjen tiettyjä sianliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä tiettyjen sianlihaa ja tiettyjä muita maataloustuotteita
    koskevien yhteisön tariffikiintiöiden avaamisesta ja hallinnasta annetussa neuvoston
    asetuksessa (EY) N:o 774/94 säädetyn järjestelmän mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2506/2001 della Commissione, del 20 dicembre 2001,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di dicembre 2001 per taluni prodotti del settore
    delle carni suine nel quadro del regime previsto dal regolamento (CE) n. 774/94
    del Consiglio recante apertura e modalità di gestione di alcuni contingenti tariffari
    comunitari di carni suine e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2506/2001 van de Commissie van 20 december 2001 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in december
    2001 worden ingediend op grond van Verordening (EG) nr. 774/94 van de Raad houdende
    opening en vaststelling van de wĳze van beheer van communautaire tariefcontingenten
    voor varkensvlees en bepaalde andere landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2506/2001 da Comissão, de 20 de Dezembro de 2001,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Dezembro
    de 2001 ao abrigo do regime previsto no Regulamento (CE) n.° 774/94 do Conselho
    relativo à abertura e modo de gestão de determinados contingentes pautais comunitários
    de carne de suíno e outros produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2506/2001 de la Comisión, de 20 de diciembre de 2001,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en diciembre de 2001 al amparo del régimen previsto en el Reglamento
    (CE) n° 774/94 del Consejo relativo a la apertura y modo de gestión de determinados
    contingentes arancelarios comunitarios de carne de porcino y determinados productos
    agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2506/2001 av den 20 december 2001 om
    den utsträckning i vilken ansökningar om importlicens som inlämnas i december
    2001 skall beviljas för vissa produkter inom grisköttssektorn inom ramen för
    den ordning som fastställs genom rådets förordning (EG) nr 774/94 om öppnande
    och förvaltning av vissa gemenskapstullkvoter för griskött och vissa andra
    jordbruksprodukter
  type: main
