title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3939/87 of 21 December 1987 amending certain
    acts in respect of the application of the common organization of the markets in
    the sheepmeat and goatmeat sector as a consequence of the introduction of the
    combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3939/87 de la Commission du 21 décembre 1987 modifiant
    certains actes relatifs à l'application de l'organisation commune des marchés
    dans le secteur des viandes ovine et caprine suite à l'introduction de la nomenclature
    combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3939/87 der Kommission vom 21. Dezember 1987 zur Änderung
    von Rechtsakten zur Anwendung der gemeinsamen Marktorganisation für Schaf- und
    Ziegenfleisch infolge der Einführung der Kombinierten Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3939/87 af 21. december 1987 om ændring
    af visse retsakter vedrørende den fælles markedsordning for fåre- og gedekød
    som følge af indførelsen af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3939/87 της Επιτροπής
    της 21ης Δεκεμβρίου 1987 που τροποποιεί ορισμένες
    κοινοτικές πράξεις όσον αφορά την κοινή οργάνωση
    της αγοράς στον τομέα του πρόβειου και αίγειου
    κρέατος λόγω της καθιέρωσης της συνδυασμένης
    ονοματολογίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3939/87 della Commissione del 21 dicembre 1987 che
    modifica taluni atti Comunitàri relativi all'applicazione dell'organizzazione
    comune dei mercati nel settore delle carni ovine e caprine in seguito all'introduzione
    della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3939/87 van de Commissie van 21 december 1987 tot
    wijziging van bepaalde besluiten met betrekking tot de gemeenschappelijke ordening
    der markten in de sector schape- en geitevlees als gevolg van de invoering van
    de gecombineerde nomenclatuur
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3939/87 da Comissão de 21 de Dezembro de 1987 que
    altera certos actos relativos à aplicação da organização comum de mercado
    no sector das carnes de ovino e caprino na sequência da introdução da Nomenclatura
    Combinada
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3939/87 de la Comisión de 21 de diciembre 1987 por
    el que se modifican determinados Reglamentos (CEE) relativos a la aplicación
    de la organización común de mercados en el sector de la carne de bovino a consecuencia
    de la introducción de la nomenclatura combinada
  type: main
