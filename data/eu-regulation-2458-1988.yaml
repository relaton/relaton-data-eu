  content: Commission Regulation (EEC) No 2458/88 of 4 August 1988 re-establishing
    the levying of customs duties on footwear with uppers of rubber falling within
    CN codes 6401 and 6402 originating in Thailand and Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
