    caoutchouc, des codes 6401 et 6402 de la nomenclature combinée, originaires de
    Thaïlande et d' Indonésie, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3635/87 du Conseil
  type: main
