title:
- language: en
  script: Latn
  content: Directive 96/1/EC of the European Parliament and of the Council of 22 January
    1996 amending Directive 88/77/EEC on the approximation of the laws of the Member
    States relating to the measures to be taken against the emission of gaseous and
    particulate pollutants from diesel engines for use in vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 96/1/CE du Parlement européen et du Conseil, du 22 janvier 1996,
    modifiant la directive 88/77/CEE concernant le rapprochement des législations
    des États membres relatives aux mesures à prendre contre les émissions de gaz
    polluants et de particules polluantes provenant des moteurs Diesel destinés à
    la propulsion des véhicules
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/1/EG des Europäischen Parlaments und des Rates vom 22. Januar
    1996 zur Änderung der Richtlinie 88/77/EWG zur Angleichung der Rechtsvorschriften
    der Mitgliedstaaten über Maßnahmen gegen die Emission gasförmiger Schadstoffe
    und luftverunreinigender Partikel aus Dieselmotoren zum Antrieb von Fahrzeugen
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentet og Rådets direktiv 96/1/EF af 22. januar 1996 om ændring
    af direktiv 88/77/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning
    om foranstaltninger mod emission af forurenende luftarter og partikler fra dieselmotorer
    til fremdrift af køretøjer
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/1/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 22ας Ιανουαρίου 1996 για
    την τροποποίηση της οδηγίας 88/77/ΕΟΚ για την
    προσέγγιση των νομοθεσιών των κρατών μελών
    σχετικά με τα μέτρα που πρέπει να ληφθούν κατά
    των εκπομπών αερίων και σωματιδιακών ρύπων
    από ντηζελοκινητήρες προοριζόμενους να τοποθετηθούν
    σε οχήματα
  type: main
- language: fi
  script: Latn
  content: Europaan parlamentin ja neuvoston direktiivi 96/1/EY, annettu 22 päivänä
    tammikuuta 1996, ajoneuvoissa käytettyjen dieselmoottoreiden kaasu- ja hiukkaspäästöjen
    torjumiseksi toteutettavia toimenpiteitä koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin 88/77/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 96/1/CE del Parlamento europeo e del Consiglio, del 22 gennaio
    1996, che modifica la direttiva 88/77/CEE riguardante il ravvicinamento delle
    legislazioni degli Stati Membri relative alle misure da prendere contro l'emissione
    di inquinanti gassosi e di particolato prodotti dai motori ad accensione spontanea
    destinati alla propulsione dei veicoli
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/1/EG van het Europees Parlement en de Raad van 22 januari
    1996 tot wijziging van Richtlijn 88/77/EEG inzake de onderlinge aanpassing van
    de wetgevingen van de Lid-Staten met betrekking tot maatregelen tegen de emissie
    van verontreinigende gassen en deeltjes door dieselmotoren bestemd voor het aandrijven
    van voertuigen
  type: main
- language: pt
  script: Latn
  content: Directiva 96/1/CE do Parlamento Europeu e do Conselho, de 22 de Janeiro
    de 1996, que altera a Directiva 88/77/CEE, relativa à aproximação das legislações
    dos Estados-Membros respeitantes às medidas a tomar contra a emissão de gases
    e partículas poluentes pelos motores diesel utilizados em veículos
  type: main
- language: es
  script: Latn
  content: Directiva 96/1/CE del Parlamento Europeo y del Consejo, de 22 de enero
    de 1996, por la que se modifica la Directiva 88/77/CEE relativa a la aproximación
    de las legislaciones de los Estados Miembros sobre las medidas que deben adoptarse
    contra la emisión de gases y partículas contaminantes procedentes de motores
    diesel destinados a la propulsión de vehículos
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv nr 96/1/EG av den 22 januari 1996
    om ändring av direktiv 88/77/EEG om tillnärmning av medlemsstaternas lagstiftning
    om åtgärder mot utsläpp av gas- och partikelformiga föroreningar från dieselmotorer
    som används i fordon
  type: main
