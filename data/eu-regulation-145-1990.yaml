title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 145/90 of 19 January 1990 determining the
    extent to which applications lodged in January 190 for import licences for certain
    poultrymeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 145/90 de la Commission, du 19 janvier 1990, déterminant
