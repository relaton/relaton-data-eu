    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1990 για ορισμένα
    κρέατα πουλερικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 145/90 della Commissione, del 19 gennaio 1990, che
