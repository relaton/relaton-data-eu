---
id: EUDecision1962205
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision instituant un droit de douane forfaitaire applicable aux marchandises
    faisant l'objet de petits envois adressés à des particuliers ou contenues dans
    les bagages personnels des voyageurs pour autant qu'il s'agisse d'importations
    dépourvues de tout caractère commercial
  type: main
- language: de
  script: Latn
  content: Entscheidung über die Einführung eines pauschalen Zollsatzes, der auf
    Waren, die in Kleinsendungen an natürliche Personen eingehen oder im persönlichen
    Gepäck der Reisenden eingeführt werden, unter der Voraussetzung anwendbar ist,
    daß solchen Einfuhren keine kommerziellen Erwägungen zugrunde liegen
  type: main
- language: it
  script: Latn
  content: Decisione relativa all'istituzione di un dazio forfetario applicabile alle
    merci oggetto di piccole spedizioni destinate a privati o contenute nei bagagli
    personali dei viaggiatori, a condizione che si tratti di importazioni prive di
    ogni carattere commerciale
  type: main
- language: nl
  script: Latn
  content: Beschikking houdende instelling van een forfaitair invoerrecht dat van
    toepassing is op goederen die het onderwerp uitmaken van aan particulieren gerichte
    kleine zendingen dan wel zich bevinden in de persoonlijke bagage van reizigers,
    voor zover het invoer betreft waaraan elk handelskarakter vreemd is
  type: main
