  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2206 of 22 December 2020 amending
    Annex I to Regulation (EC) No 119/2009 as regards the entry for the United Kingdom
    in the list of third countries or parts thereof authorised for the introduction
    into the Union of consignments of meat of wild leporidae, of certain wild land
    mammals and of farmed rabbits
  type: main
- language: fr
  script: Latn
