    la mention relative au Royaume-Uni dans la liste des pays tiers ou parties de
    pays tiers en provenance desquels l’introduction dans l’Union d’envois de
    viandes de léporidés sauvages, de certains mammifères terrestres sauvages et
    de lapins d’élevage est autorisée
  type: main
