    nel settore del pollame e delle uova, per il periodo compreso tra il 1o luglio
    e il 30 settembre 1996, nel quadro dei contingenti tariffari comunitari previsti
    dagli accordi europei, conformemente al regolamento (CE) n. 3066/95 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1236/96 van de Commissie van 28 juni 1996 tot wijziging,
