    voor de periode van 1 juli tot en met 30 september 1996 beschikbaar zijn in het
    kader van bij de Europa-Overeenkomsten vastgestelde communautaire tariefcontingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1236/96 da Comissão de 28 de Junho de 1996 que altera
