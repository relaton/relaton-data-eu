title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1236/96 of 28 June 1996 amending Regulations
    (EEC) No 2699/93 and (EC) No 1559/94 and fixing the available quantities for the
    period 1 July to 30 September 1996 under the Community tariff quotas provided
    for in the Europe Agreements pursuant to Council Regulation (EC) No 3066/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1236/96 de la Commission du 28 juin 1996 modifiant
    les règlements (CEE) nº 2699/93 et (CE) nº 1559/94, et fixant les quantités
    disponibles pour la période du 1er juillet au 30 septembre 1996, dans le cadre
    des contingents tarifaires communautaires prévus par les accords européens,
    conformément au règlement (CE) nº 3066/95 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1236/96 der Kommission vom 28. Juni 1996 zur Änderung
    der Verordnungen (EWG) Nr. 2699/93 und (EG) Nr. 1559/94 und zur Festsetzung der
    für den Zeitraum 1. Juli bis 30. September 1996 im Rahmen der in den Europa-Abkommen
    vorgesehenen gemeinschaftlichen Zollkontingente gemäß der Verordnung (EG) Nr.
    3066/95 des Rates verfügbaren Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1236/96 af 28. juni 1996 om ændring
    af forordning (EØF) nr. 2699/93 og (EF) nr. 1599/94 og om fastsættelse af de
    mængder, der er til rådighed for perioden fra den 1. juli til den 30. september
    1996 i forbindelse med de EF-toldkontingenter, der er fastsat i Europaaftalerne,
    jf. Rådets forordning (EF) nr. 3066/95
  type: main
