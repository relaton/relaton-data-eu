  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1236/96, annettu 28 päivänä kesäkuuta 1996,
    asetusten (ETY) N:o 2699/93 ja (EY) N:o 1559/94 muuttamisesta ja käytettävissä
    olevien määrien vahvistamisesta 1 päivän tammikuuta ja 30 päivän kesäkuuta
    1996 väliseksi kaudeksi Eurooppa-sopimuksissa määrättyjen yhteisön tariffikiintiöiden
    osalta neuvoston asetuksen (EY) N:o 3066/95 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1236/96 della Commissione del 28 giugno 1996 che modifica
