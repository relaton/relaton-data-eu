title:
- language: en
  script: Latn
  content: Commission Directive 97/15/EC of 25 March 1997 adopting Eurocontrol standards
    and amending Council Directive 93/65/EEC on the definition and use of compatible
    technical specifications for the procurement of air- traffic-management equipment
    and systems
  type: main
- language: fr
  script: Latn
  content: 97/15/CE. Directive de la Commission du 25 mars 1997 portant adoption de
    normes Eurocontrol et modification de la directive 93/65/CEE du Conseil relative
    à la définition et à l'utilisation de spécifications techniques compatibles
    pour l'acquisition d'équipements et de systèmes pour la gestion du trafic aérien
  type: main
- language: de
  script: Latn
  content: Richtlinie 97/15/EG der Kommission vom 25. März 1997 zur Übernahme von
    Eurocontrol-Normen und zur Änderung der Richtlinie 93/65/EWG des Rates über
    die Aufstellung und Anwendung kompatibler technischer Spezifikationen für die
    Beschaffung von Ausrüstungen und Systemen für das Flugverkehrsmanagement
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 97/15/ES ze dne 25. března 1997, kterou se přijímají
    normy Eurocontrol a mění směrnice Rady 93/65/EHS o definici a užívání slučitelných
    technických specifikací pro zadávání zakázek na zařízení a systémy řízení
    letového provozu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 97/15/EF af 25. marts 1997 om vedtagelse af Eurocontrol-standarder
    og om ændring af Rådets direktiv 93/65/EØF om definition og anvendelse af kompatible
    tekniske specifikationer for erhvervelse af udstyr og systemer til regulering
    af lufttrafikken (air- traffic-management equipment and systems)
  type: main
- language: el
  script: Grek
  content: Οδηγία 97/15/ΕΚ της Επιτροπής της 25ης Μαρτίου
    1997 για έγκριση των προτύπων της Eurocontrol και τροποποίηση
    της οδηγίας 93/65/ΕΟΚ του Συμβουλίου σχετικά
    με τον καθορισμό και τη χρησιμοποίηση συμβατών
    τεχνικών προδιαγραφών για την προμήθεια τεχνικού
    εξοπλισμού και συστημάτων διαχείρισης της
    εναέριας κυκλοφορίας
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 97/15/EÜ, 25. märts 1997, millega võetakse vastu
    Eurocontroli standardid ja muudetakse nõukogu direktiivi 93/65/EMÜ omavahel
    ühilduvate tehnospetsifikaatide määratlemise ja kasutamise kohta lennuliikluse
    korraldamiseks vajalike seadmete ning süsteemide hankimisel
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 97/15/EY, annettu 25 päivänä maaliskuuta 1997,
    Eurocontrol-standardien hyväksymisestä sekä yhteensopivien teknisten eritelmien
    määrittelemisestä ja käytöstä lentoliikenteen hallinnan (ATM) laitteiden
    ja järjestelmien hankinnassa annetun neuvoston direktiivin 93/65/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 97/15/EK irányelve (1997. március 25.) az Eurocontrol-szabványok
    elfogadásáról és a légiforgalom-irányítási berendezések és rendszerek
    beszerzéséhez szükséges kompatibilis műszaki előírások meghatározásáról
    és használatáról szóló 93/65/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 97/15/CE della Commissione del 25 marzo 1997 che adotta le norme
    Eurocontrol e che modifica la direttiva 93/65/CEE del Consiglio relativa alla
    definizione e all'utilizzazione di specifiche tecniche compatibili per l'acquisto
    di apparecchiature e di sistemi per la gestione del traffico aereo
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 97/15/EK (1997. gada 25. marts), ar ko pieņem Eurocontrol
    standartus un groza Padomes Direktīvu 93/65/EEK par saderīgu tehnisko specifikāciju
    noteikšanu un lietošanu gaisa satiksmes vadības iekārtu un sistēmu iegādei
  type: main
- language: lt
  script: Latn
  content: 1997 m. kovo 25 d. Komisijos direktyva 97/15/EB patvirtinanti Eurokontrolės
