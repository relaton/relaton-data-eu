    ir naudojimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 97/15/EC tal-25 ta' Marzu 1997 li tadotta
    l-istandards Eurocontrol u li temenda id-Direttiva tal-Kunsill 93/65 KEE dwar
    id-definizzjoni u l-użu ta' speċifikazzjonijiet tekniċi kompatibbli għall-prokura
    ta' tagħmir u sistemi għall-kontroll tat-traffiku ta' l-ajru
  type: main
- language: nl
  script: Latn
  content: Richtlijn 97/15/EG van de Commissie van 25 maart 1997 tot bekrachtiging
    van Eurocontrol-normen en tot wijziging van Richtlijn 93/65/EEG van de Raad betreffende
    de vaststelling en het gebruik van compatibele technische normen en specificaties
    voor de aanschaf van apparatuur en van systemen voor luchtverkeersafhandeling
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 97/15/WE z dnia 25 marca 1997 r. przyjmująca normy Eurocontrol
    oraz zmieniająca dyrektywę Rady 93/65/EWG w sprawie definicji i korzystania
    ze zgodnych specyfikacji technicznych dla zamówień na sprzęt i systemy zarządzania
    ruchem powietrznym
  type: main
- language: pt
  script: Latn
  content: Directiva 97/15/CE da Comissão de 25 de Março de 1997 que adopta as normas
    Eurocontrol e altera a Directiva 93/65/CEE do Conselho relativa à definição
    e à utilização de especificações técnicas compatíveis para a aquisição
    de equipamentos e de sistemas para a gestão do tráfego aéreo
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 97/15/ES z 25. marca 1997 prijímajúca normy Eurocontrol,
    ktorou sa mení a dopĺňa smernica Rady 93/65/EHS o definovaní a používaní
    zlučiteľných technických špecifikácií pri obstarávaní zariadenia a systémov
    riadenia letovej prevádzky
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 97/15/ES z dne 25. marca 1997 o sprejetju Eurocontrolovih
    standardov in spremembi Direktive Sveta 93/65/EGS o opredelitvi in uporabi združljivih
    tehničnih specifikacij za nakup opreme in sistemov za vodenje zračnega prometa
  type: main
- language: es
  script: Latn
  content: Directiva 97/15/CE de la Comisión de 25 de marzo de 1997 por la que se
    adoptan algunas normas de Eurocontrol y se modifica la Directiva 93/65/CEE del
    Consejo, relativa a la definición y a la utilización de especificaciones técnicas
    compatibles para la adquisición de equipos y de sistemas para la gestión del
    tráfico aéreo
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 97/15/EG av den 25 mars 1997 om antagande av Eurocontrol-standarder
