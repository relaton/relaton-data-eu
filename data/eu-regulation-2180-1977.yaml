  content: Commission Regulation (EEC) No 2180/77 of 30 September 1977 determining
    the amounts applicable as accession compensatory amounts during the month of October
    1977 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2180/77 de la Commission, du 30 septembre 1977, déterminant
    les montants applicables à titre de montants compensatoires «adhésion» pendant
    le mois d'octobre 1977 à certains produits des secteurs des céréales et du
    riz exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2180/77 der Kommission vom 30. September 1977 zur
    Festsetzung der im Oktober 1977 als Beitrittsausgleichsbeträge geltenden Beträge
    für bestimmte Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2180/77 af 30. september 1977 om fastsættelse
    af de beløb, der i oktober 1977 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2180/77 della Commissione, del 30 settembre 1977,
    che determina gli importi compensativi «adesione» applicabili, durante il mese
    di ottobre 1977, a taluni prodotti dei settori dei cereali e del riso esportati
    sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2180/77 van de Commissie van 30 september 1977 houdende
    vaststelling van de bedragen die gedurende de maand oktober 1977 als compenserende
    bedragen "toetreding" moeten worden toegepast voor bepaalde produkten van de sector
    granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage II van
    het Verdrag vallende goederen
