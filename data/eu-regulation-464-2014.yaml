title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 464/2014 of 6 May 2014 derogating
    from Council Regulation (EC) No 1967/2006 as regards the minimum distance from
    the coast and the minimum sea depth for boat seines fishing for sand eel ( Gymnammodytes
    cicerelus and G. semisquamatus ) and gobies ( Aphia minuta and Crystalogobius
    linearis ) in certain territorial waters of Spain (Catalonia)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 464/2014 de la Commission du 6 mai 2014
    portant dérogation au règlement (CE) n ° 1967/2006 du Conseil en ce qui concerne
    la distance de la côte et la profondeur minimales pour les sennes de bateau pêchant
    le lançon ( Gymnammodytes cicerelus et G. semisquamatus ) et les gobies ( Aphia
    minuta et Crystalogobius linearis ) dans certaines eaux territoriales de l'Espagne
    (Catalogne)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 464/2014 der Kommission vom 6. Mai 2014
    zur Abweichung von der Verordnung (EG) Nr. 1967/2006 des Rates hinsichtlich des
    Mindestabstands von der Küste und der Mindestwassertiefe für Bootswaden für
    den Fang von Sandaal (Gymnammodytes cicerelus und G. semisquamatus) und Grundeln
    (Aphia minuta und Crystalogobius linearis) in bestimmten Hoheitsgewässern Spaniens
    (Katalonien)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 464/2014 на Комисията
    от 6 май 2014 година за дерогация от Регламент
    (ЕО) № 1967/2006 на Съвета по отношение на минималното
    разстояние от брега и минималната морска дълбочина
    за улов на пясъчница ( Gymnammodytes cicerelus и G. semisquamatus
    ) и попчета ( Aphia minuta и Crystalogobius linearis ) с лодкови
    грибове в определени териториални води на
    Испания (Каталуня)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 464/2014 ze dne 6. května 2014
    , kterým se stanoví odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde
    o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu smáčkovitých ( Gymnammodytes cicerelus a G. semisquamatus ) a
    hlaváčovitých ( Aphia minuta a Crystalogobius linearis ) v některých teritoriálních
    vodách Španělska (Katalánska)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 464/2014 af 6. maj 2014
    om fravigelse af Rådets forordning (EF) nr. 1967/2006 for så vidt angår mindsteafstanden
    fra kysten og mindstedybden for vod brugt fra fartøjer, der fisker efter tobisarter
    ( Gymnammodytes cicerelus og G. semisquamatus ) og kutlingearter ( Aphia minuta
    og Crystalogobius linearis ) i visse spanske territorialfarvande (Catalonien)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 464/2014
    της Επιτροπής, της 6ης Μαΐου 2014 , για τη θέσπιση
    παρέκκλισης από τον κανονισμό (ΕΚ) αριθ. 1967/2006
    του Συμβουλίου όσον αφορά την ελάχιστη απόσταση
    από την ακτή και το ελάχιστο βάθος θάλασσας
    που οφείλουν να τηρούν οι βιντζότρατες που
    αλιεύουν αμμόχελο ( Gymnammodytes cicerelus και G. semisquamatus
    ) και γωβιό ( Aphia minuta και Crystalogobius linearis ) σε ορισμένα
    χωρικά ύδατα της Ισπανίας (Καταλονία)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 464/2014, 6. mai 2014 , millega tehakse
    erand nõukogu määrusest (EÜ) nr 1967/2006 seoses teatavates Hispaania (Kataloonia)
    territoriaalvetes tobiate ( Gymnammodytes cicerelus ja G. semisquamatus ) ja mudilate
    ( Aphia minuta ja Crystalogobius linearis ) püüdmiseks kasutatavate paadinootade
    miinimumkaugusega rannikust ja vee miinimumsügavusega nende kasutamisel
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 464/2014, annettu 6 päivänä
    toukokuuta 2014 , sovellettavaa vähimmäisetäisyyttä rannikolta ja veden vähimmäissyvyyttä
    koskevan poikkeuksen myöntämiseksi neuvoston asetuksesta (EY) N:o 1967/2006
    kalastettaessa tuulenkalaa ( Gymnammodytes cicerelus ja G. semisquamatus ) sekä
    tokkoa ( Aphia minuta ja Crystalogobius linearis ) alukselta vedettävillä nuotilla
    tietyillä Espanjan aluevesillä (Katalonia)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 464/2014 оd 6. svibnja 2004. o odstupanju
    od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu minimalne udaljenosti od obale
    i minimalne dubine za potegače otvorenog mora koje love hujice ( Gymnammodytes
    cicerelus i G. semisquamatus ) i glavoče ( Aphia minuta i Crystalogobius linearis
    ) u određenim teritorijalnim vodama Španjolske (Katalonija)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 464/2014/EU végrehajtási rendelete ( 2014. május 6. ) Spanyolország
    egyes felségvizein (Katalónia) a homoki angolna ( Gymnammodytes cicerelus és
    G. semisquamatus ) és a gébfélék ( Aphia minuta és Crystalogobius linearis
    ) halászatában alkalmazott, hajóról működtetett kerítőhálók merítési
    mélysége és parttól számított távolsága tekintetében az 1967/2006/EK
    tanácsi rendelettől történő eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 464/2014 della Commissione, del 6 maggio
    2014 , che deroga al regolamento (CE) n. 1967/2006 del Consiglio per quanto riguarda
    la distanza minima dalla costa e la profondità minima per le sciabiche da natante
    utilizzate per la pesca del cicerello ( Gymnammodytes cicerelus e G. semisquamatus
    ) e del ghiozzo ( Aphia minuta e Crystalogobius linearis ) in talune acque territoriali
    della Spagna (Catalogna)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 464/2014 ( 2014. gada 6. maijs
    ), ar ko paredz atkāpi no Padomes Regulas (EK) Nr. 1967/2006 attiecībā uz minimālo
    attālumu no krasta un minimālo dziļumu, kas jāievēro kuģiem, kuri zvejo
    tūbītes ( Gymnammodytes cicerelus un G. semisquamatus ) un jūrasgrunduļus
    ( Aphia minuta un Crystalogobius linearis ) ar laivas velkamajiem vadiem, noteiktos
    Spānijas (Katalonijas) teritoriālajos ūdeņos
  type: main
- language: lt
  script: Latn
  content: 2014 m. gegužės 6 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 464/2014,
    kuriuo nukrypstama nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl minimalaus
    atstumo nuo kranto ir minimalaus jūros gylio reikalavimų, taikomų laivų gaubiamaisiais
    tinklais žvejojant tobius ( Gymnammodytes cicerelus ir G. semisquamatus ) ir
    afijas ( Aphia minuta ir Crystalogobius linearis ) tam tikruose Ispanijos (Katalonija)
    teritoriniuose vandenyse
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 464/2014 tas-
    6 ta' Mejju 2014 li jidderoga mir-Regolament tal-Kunsill (KE) Nru 1967/2006 fejn
    tidħol id-distanza minima mill-kosta u l-fond minimu tal-baħar għal tartaruni
    li jistadu għaċ-ċiċċirell ( Gymnammodytes cicerelus u G. semisquamatus )
    u għall-gobi ( Aphia minuta u Crystalogobius linearis ) f'ċertu ilmijiet territorjali
    ta' Spanja (il-Katalonja)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 464/2014 van de Commissie van 6 mei 2014
    tot afwijking van Verordening (EG) nr. 1967/2006 van de Raad, wat betreft de minimumafstand
    van de kust en de minimumzeediepte voor bootzegens voor de visserij op zandspiering
    ( Gymnammodytes cicerelus en G. semisquamatus ) en op glasgrondel ( Aphia minuta
    en Crystalogobius linearis ) in bepaalde territoriale wateren van Spanje (Catalonië)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 464/2014 z dnia 6 maja 2014
    r. wprowadzające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w zakresie
    minimalnych odległości od brzegu i minimalnej głębokości morza przy połowach
    dobijakowatych ( Gymnammodytes cicerelus i G. semisquamatus ) oraz babkowatych
    ( Aphia minuta i Crystalogobius linearis ) niewodami pełnomorskimi na niektórych
    wodach terytorialnych Hiszpanii (Katalonia)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 464/2014 da Comissão, de 6 de maio
    de 2014 , que derroga o Regulamento (CE) n. ° 1967/2006 do Conselho no que respeita
    a distância mínima da costa e a profundidade para as redes envolventes-arrastantes
    de alar para bordo, utilizadas na pesca de galeota ( Gymnammodytes cicerelus e
    G. semisquamatus ) e de cabozes ( Aphia minuta e Crystalogobius linearis ) em
    determinadas águas territoriais de Espanha (Catalunha)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 464/2014 al Comisiei din 6
    mai 2014 de derogare de la Regulamentul (CE) nr. 1967/2006 al Consiliului în
    ceea ce privește distanța minimă față de coastă și adâncimea minimă a
    mării pentru năvoadele de navă utilizate pentru pescuitul uvei ( Gymnammodytes
    cicerelus și G. semisquamatus ) și al guvizilor ( Alphia minuta și Crystalogobius
    linearis ) în anumite ape teritoriale ale Spaniei (Catalonia)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 464/2014 zo 6 mája 2014 , ktorým
    sa udeľuje výnimka z nariadenia Rady (ES) č. 1967/2006, pokiaľ ide o minimálnu
    vzdialenosť od pobrežia a minimálnu hĺbku mora v prípade lovu piesočnicovitých
    ( Gymnammodytes cicerelus a G. semisquamatus ) a býčkovitých ( Aphia minuta
    a Crystalogobius linearis ) lodnými záťahovými sieťami v určitých pobrežných
    vodách Španielska (Katalánsko)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 464/2014 z dne 6. maja 2014 o odstopanju
    od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od obale in
    najmanjše morske globine za potegalke odprtega morja za lovljenje peščenk (
    Gymnammodytes cicerelus in G. semisquamatus ) in glavačev ( Aphia minuta in Crystalogobius
    linearis ) v določenih teritorialnih vodah Španije (Katalonija)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °464/2014 de la Comisión, de 6 de mayo
    de 2014 , por el que se establece una excepción al Reglamento (CE) n ° 1967/2006
    del Consejo en lo concerniente a la distancia mínima de la costa y la profundidad
    marina mínima para la pesca de lanzones ( Gymnammodytes cicerelus y G. semisquamatus
    ) y góbidos ( Aphia minuta y Crystalogobius linearis ) con redes de tiro desde
    embarcación, en determinadas aguas territoriales de España (Cataluña)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 464/2014 av den 6 maj 2014
    om undantag från rådets förordning (EG) nr 1967/2006 vad gäller minimiavstånd
    från kusten och minimidjup för fiske med fartygsvad/not efter tobisfiskar (
    Gymnammodytes cicerelus och G. semisquamatus ) och smörbultar ( Aphia minuta
    och Crystalogobius linearis ) i vissa territorialvatten i Spanien (Katalonien)
