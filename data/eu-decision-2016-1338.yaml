title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2016/1338 of 4 August 2016 amending Decision (CFSP)
    2015/2052 extending the mandate of the European Union Special Representative in
    Kosovo (This designation is without prejudice to positions on status, and is in
    line with UNSCR 1244/1999 and the ICJ Opinion on the Kosovo declaration of independence.)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2016/1338 du Conseil du 4 août 2016 modifiant la décision
    (PESC) 2015/2052 du Conseil prorogeant le mandat du représentant spécial de
    l'Union européenne au Kosovo (Cette désignation est sans préjudice des positions
    sur le statut et est conforme à la résolution 1244 (1999) du Conseil de sécurité
    des Nations unies ainsi qu'à l'avis de la Cour internationale de justice (CIJ)
    sur la déclaration d'indépendance du Kosovo.)
  type: main
- language: de
  script: Latn
