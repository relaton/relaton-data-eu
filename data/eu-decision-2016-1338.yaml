    Beschlusses (GASP) 2015/2052 zur Verlängerung des Mandats des Sonderbeauftragten
    der Europäischen Union im Kosovo (Diese Bezeichnung berührt nicht die Standpunkte
    zum Status und steht im Einklang mit der Resolution 1244 (1999) des Sicherheitsrates
    der VN und dem Gutachten des Internationalen Gerichtshofs zur Unabhängigkeitserklärung
    des Kosovo.)
  type: main
