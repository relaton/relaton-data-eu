  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2016/1338 del Consiglio, del 4 agosto 2016, che modifica
    la decisione (PESC) 2015/2052 che proroga il mandato del rappresentante speciale
    dell'Unione europea per il Kosovo (Tale designazione non pregiudica le posizioni
    riguardo allo status ed è in linea con la risoluzione 1244 (1999) dell'UNSC e
    con il parere della CIG sulla dichiarazione di indipendenza del Kosovo.)
  type: main
- language: lv
  script: Latn
