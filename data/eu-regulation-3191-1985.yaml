  content: Commission Regulation (EEC) No 3191/85 of 14 November 1985 authorizing
    the United Kingdom to permit under certain conditions an additional increase in
    the alcoholic strength of certain wines and certain products intended for wine
    making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3191/85 de la Commission du 14 novembre 1985 autorisant
    le Royaume-Uni à permettre, sous certaines conditions, une augmentation supplémentaire
    du titre alcoométrique de certains vins et de certains produits destinés à
    l' élaboration des vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3191/85 der Kommission vom 14. November 1985 zur Ermächtigung
    des Vereinigten Königreichs, unter bestimmten Voraussetzungen eine zusätzliche
    Erhöhung des Alkoholgehalts bestimmter Weine und bestimmter zur Weinherstellung
    vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3191/85 af 14. november 1985 om bemyndigelse
    til Det forenede Kongerige til under visse omstændigheder at tillade en yderligere
    forhøjelse af alkoholindholdet i visse vine og i visse produkter, der er bestemt
    til vinfremstilling
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3191/85 της Επιτροπής
    της 14ης Νοεμβρίου 1985 που εξουσιοδοτεί το Ηνωμένο
    Βασίλειο να επιτρέψει, υπό ορισμένες προϋποθέσεις,
    τη συμπληρωματική αύξηση του αλκοολικού τίτλου
    ορισμένων οίνων και ορισμένων προϊόντων προοριζόμενων
    για την παρασκευή οίνου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3191/85 della Commissione del 14 novembre 1985 che
    autorizza il Regno Unito a permettere, in determinate condizioni, un aumento supplementare
    del titolo alcolometrico di taluni vini e di taluni prodotti destinati all' elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3191/85 van de Commissie van 14 november 1985 waarbij
    het Verenigd Koninkrijk gemachtigd wordt om op bepaalde voorwaarden een extra
    verhoging van het alcoholgehalte van bepaalde wijnen en van bepaalde voor de bereiding
    van wijn bestemde produkten toe te staan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3191/85 da Comissão, de 14 de Novembro de 1985,
