    suplementar do teor alcoólico de determinados vinhos e de determinados produtos
    destinados à elaboração dos vinhos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3191/85 de la Comisión, de 14 de noviembre de 1985,
    por el que se autoriza al Reino Unido a permitir, bajo determinadas condiciones,
    un aumento suplementario del grado alcohólico de determinados vinos y de determinados
    productos destinados a la elaboración de vinos
  type: main
