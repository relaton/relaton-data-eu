    της 23ης Ιουλίου 1987 για την περάτωση της διαδικασίας
    επανεξέτασης και για την κατάργηση των μέτρων
    αντιντάμπινγκ που εφαρμόζονται στις εισαγωγές
    υδάτινων διαλυμάτων ουρίας και νιτρικού αμμωνίου,
    καταγωγής Ηνωμένων Πολιτειών Αμερικής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2253/87 del Consiglio del 23 luglio 1987 che chiude
    la procedura di riesame e abroga le misure antidumping applicabili alle importazioni
    di soluzioni acquose di urea e di nitrato di ammonio originarie degli Stati Uniti
    d' America
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2253/87 van de Raad van 23 juli 1987 tot beëindiging
    van de procedure van een nieuw onderzoek en intrekking van de anti-dumpingmaatregelen
    die op de invoer van waterige oplossingen van ureum en van ammoniumnitraat van
    oorsprong uit de Verenigde Staten van Amerika van toepassing zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2253/87 do Conselho de 23 de Julho de 1987 que encerra
