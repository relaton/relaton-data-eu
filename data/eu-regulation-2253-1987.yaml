  content: Council Regulation (EEC) No 2253/87 of 23 July 1987 terminating the review
    proceeding and repealing the anti-dumping measures concerning imports of urea
    and ammonium nitrate in liquid solution originating in the United States of America
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2253/87 du Conseil du 23 juillet 1987 portant clôture
    de la procédure de réexamen et abrogeant les mesures antidumping applicables
    aux importations de solutions aqueuses d' urée et de nitrate d' ammoniaque originaires
    des États-Unis d' Amérique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2253/87 des Rates vom 23. Juli 1987 über die Einstellung
    der Überprüfung und die Aufhebung der Antidumpingmaßnahmen betreffend die Einfuhren
    von Ammoniumnitrat-Harnstoff-Düngemittellösungen mit Ursprung in den Vereinigten
    Staaten von Amerika
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2253/87 af 23. juli 1987 om afslutning af
    den fornyede undersøgelse af de gældende antidumpingforanstaltninger på importen
    af visse gødningsstoffer bestående af en opløsning af urinstof og ammoniumnitrat
    med oprindelse i Amerikas Forenede Stater og om ophævelse af disse foranstaltninger
  type: main
- language: el
  script: Grek
