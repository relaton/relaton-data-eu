    pour certaines dispositions législatives, réglementaires ou administratives
    envisagées par les États membres dans le domaine des transports'
  type: main
- language: de
  script: Latn
  content: '73/402/EWG: Entscheidung des Rates vom 22. November 1973 zur Änderung
