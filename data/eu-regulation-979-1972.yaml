title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 979/72 of 12 May 1972 fixing the compensatory
    amounts provided for in Regulation (EEC) No 974/71 on certain measures of conjunctural
    policy to be taken in agriculture following the temporary widening of the margins
    of fluctuation for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 979/72 de la Commission, du 12 mai 1972, fixant les
    montants compensatoires prévus par le règlement (CEE) n° 974/71 relatif à
    certaines mesures de politique de conjoncture à prendre dans le secteur agricole
    à la suite de l'élargissement temporaire des marges de fluctuation des monnaies
    de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 979/72 der Kommission vom 12. Mai 1972 zur Festsetzung
    der in der Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind, vorgesehenen
    Ausgleichsbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 979/72 della Commissione, del 12 maggio 1972, che
    fissa gli importi compensativi previsti dal regolamento (CEE) n. 974/71 relativo
    a talune misure di politica congiunturale da adottare nel settore agricolo in
    seguito all'ampliamento temporaneo dei margini di fluttuazione delle monete di
    taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 979/72 van de Commissie van 12 mei 1972 houdende
    vaststelling van de compenserende bedragen, bedoeld bij Verordening (EEG) nr.
    974/71 betreffende bepaalde conjunctuurpolitieke maatregelen welke naar aanleiding
    van de tijdelijke verruiming van de fluctuatiemarges van de valuta's van sommige
    Lid- Staten dienen te worden genomen in de landbouwsector
  type: main
