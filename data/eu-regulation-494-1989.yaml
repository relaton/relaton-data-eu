title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 494/89 of 27 February 1989 suspending the
    preferential customs duties and re-introducing the Common Customs Tariff duty
    on imports of large-flowered roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 494/89 de la Commission, du 27 février 1989, suspendant
