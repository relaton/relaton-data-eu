title:
- language: en
  script: Latn
  content: '98/432/EC: Commission Decision of 25 June 1998 authorising Member States
    temporarily to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of plants of strawberry (Fragaria L.), intended for planting,
    other than seeds, originating in the Republic of South Africa (notified under
    document number C(1998) 1751)'
  type: main
- language: fr
  script: Latn
  content: '98/432/CE: Décision de la Commission du 25 juin 1998 autorisant les États
    membres à prévoir à titre provisoire des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les fraisiers (Fragaria L.) destinés
    à la plantation, à l''exception des semences, originaires de la République
    d''Afrique du Sud [notifiée sous le numéro C(1998) 1751]'
  type: main
- language: de
  script: Latn
  content: '98/432/EG: Entscheidung der Kommission vom 25. Juni 1998 zur Ermächtigung
