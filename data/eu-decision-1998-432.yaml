    außer Samen, mit Ursprung in der Republik Südafrika, vorübergehend Ausnahmen
    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen (Bekanntgegeben
    unter Aktenzeichen K(1998) 1751)'
  type: main
- language: da
  script: Latn
