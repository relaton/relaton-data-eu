title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 290/71 de la Commission, du 10 février 1971, abrogeant
    le règlement (CEE) n° 232/71 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d'agrumes originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 290/71 der Kommission vom 10. Februar 1971 zur Aufhebung
    der Verordnung (EWG) Nr. 232/71 zur Anwendung des Zollsatzes des Gemeinsamen Zolltarifs
    auf Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und anderen ähnlichen
    Kreuzungen von Zitrusfrüchten mit Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 290/71 della Commissione, del 10 febbraio 1971, che
    abroga il regolamento (CEE) n. 232/71 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    e altri ibridi similari d'agrumi originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 290/71 van de Commissie van 10 februari 1971 tot
    intrekking van Verordening (EEG) nr. 232/71 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten van
    oorsprong uit Spanje
  type: main
