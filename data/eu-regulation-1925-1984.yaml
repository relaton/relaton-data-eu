  script: Latn
  content: Commission Regulation (EEC) No 1925/84 of 5 July 1984 fixing for the 1984/85
    marketing year the minimum price to be paid to producers and the amount of production
    aid for certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1925/84 de la Commission du 5 juillet 1984 fixant,
    pour la campagne 1984/1985, le prix minimal à payer aux producteurs ainsi que
    le montant de l' aide à la production pour certains produits transformés à
    base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1925/84 der Kommission vom 5. Juli 1984 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe
    für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse für das Wirtschaftsjahr
    1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1925/84 af 5. juli 1984 om fastsættelse
    for produktionsåret 1984/85 af den minimumspris, der skal betales til producenterne
    samt producentstøtten for visse produkter forarbejdet på basis af frugt og grønsager
  type: main
