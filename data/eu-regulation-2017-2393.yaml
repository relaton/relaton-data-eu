  content: Reglamento (UE) 2017/2393 del Parlamento Europeo y del Consejo, de 13 de
    diciembre de 2017, por el que se modifican los Reglamentos (UE) n.° 1305/2013
    relativo a la ayuda al desarrollo rural a través del Fondo Europeo Agrícola
    de Desarrollo Rural (Feader), (UE) n.° 1306/2013 sobre la financiación, gestión
    y seguimiento de la política agrícola común, (UE) n.° 1307/2013 por el que
    se establecen normas aplicables a los pagos directos a los agricultores en virtud
    de los regímenes de ayuda incluidos en el marco de la política agrícola común,
    (UE) n.° 1308/2013 por el que se crea la organización común de mercados de
    los productos agrarios y (UE) n.° 652/2014 por el que se establecen disposiciones
    para la gestión de los gastos relativos a la cadena alimentaria, la salud animal
    y el bienestar de los animales, y relativos a la fitosanidad y a los materiales
    de reproducción vegetal
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2017/2393 av den 13 december
    2017 om ändring av förordningarna (EU) nr 1305/2013 om stöd för landsbygdsutveckling
    från Europeiska jordbruksfonden för landsbygdsutveckling (Ejflu), (EU) nr 1306/2013
    om finansiering, förvaltning och övervakning av den gemensamma jordbrukspolitiken,
    (EU) nr 1307/2013 om regler för direktstöd för jordbrukare inom de stödordningar
    som ingår i den gemensamma jordbrukspolitiken, (EU) nr 1308/2013 om upprättande
    av en samlad marknadsordning för jordbruksprodukter och (EU) nr 652/2014 om fastställande
    av bestämmelser för förvaltningen av utgifter för livsmedelskedjan, djurhälsa,
    djurskydd, växtskydd och växtförökningsmaterial
  type: main
