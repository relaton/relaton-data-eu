    betreffend die Änderung der dem Übereinkommen über das Harmonisierte System als
    Anhang beigefügten Nomenklatur und die Genehmigung von Erläuterungen, Einreihungsavisen
    oder sonstigen Stellungnahmen zur Auslegung des Harmonisierten Systems und Empfehlungen
    zur Gewährleistung einer einheitlichen Auslegung des Harmonisierten Systems im
    Rahmen des Übereinkommens über das Harmonisierte System zu vertretenden Standpunkt
  type: main
