- language: en
  script: Latn
  content: Council Decision (EU) 2026/2608 of 9 November 2026 on the position to be
    taken on behalf of the European Union within the World Customs Organization with
    regard to a Recommendation concerning the amendment of the Nomenclature appended
    as an Annex to the Harmonized System Convention and the approval of Explanatory
    Notes, Classification Opinions or other advice on the interpretation of the Harmonized
    System and recommendations to secure uniformity in the interpretation of the Harmonized
    System under the Harmonized System Convention
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/2608 du Conseil du 9 novembre 2026 relative à la position
    à prendre au nom de l'Union européenne au sein de l'Organisation mondiale des
    douanes en ce qui concerne une recommandation visant à amender la nomenclature
    annexée à la convention sur le système harmonisé et à l'approbation des notes
    explicatives, des avis de classement ou d'autres avis se rapportant à l'interprétation
    du système harmonisé et des recommandations visant à assurer l'interprétation
    uniforme du système harmonisé dans le cadre de la convention sur le système harmonisé
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/2608 des Rates vom 9. November 2026 über den im Namen
