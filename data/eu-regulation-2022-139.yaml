    banche dell’Unione degli antigeni, dei vaccini e dei reagenti diagnostici e
    le prescrizioni in materia di biosicurezza, bioprotezione e biocontenimento per
    il funzionamento di tali banche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/139 (2021. gada 16. novembris),
