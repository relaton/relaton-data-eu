- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/139 of 16 November 2021 supplementing
    Regulation (EU) 2016/429 of the European Parliament and of the Council as regards
    the management, storage and replacement of stocks of the Union antigen, vaccine
    and diagnostic reagent banks and the biosecurity, biosafety and bio-containment
    requirements for the operation of those banks
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/139 de la Commission du 16 novembre 2021
    complétant le règlement (UE) 2016/429 du Parlement européen et du Conseil en
    ce qui concerne la gestion, le stockage et la reconstitution des stocks des banques
    d’antigènes, de vaccins et de réactifs de diagnostic de l’Union ainsi que
    les exigences en matière de biosécurité, de biosûreté et de confinement biologique
    nécessaires au fonctionnement de ces banques
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/139 der Kommission vom 16. November 2021
    zur Ergänzung der Verordnung (EU) 2016/429 des Europäischen Parlaments und des
    Rates in Bezug auf die Verwaltung, Lagerung und Ergänzung der Bestände der Unionsbanken
    für Antigene, Impfstoffe und diagnostische Reagenzien sowie die Anforderungen
    an den Schutz vor biologischen Gefahren, die biologische Sicherheit und das biologische
    Containment für den Betrieb dieser Banken
  type: main
