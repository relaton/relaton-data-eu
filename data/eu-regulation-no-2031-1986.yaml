    ainsi que le montant de l' aide à la production pour les pêches conservées
    au sirop
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2031/86 der Kommission vom 30. Juni 1986 zur Festsetzung
    des den Pfirsicherzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Pfirsiche in Sirup im Wirtschaftsjahr 1986/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2031/86 af 30. juni 1986 om fastsættelse
    af den minimumspris, der skal betales producenten for ferskner, samt af producentstøtten
    for ferskner i sukkeropløsning i produktionsåret 1986/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2031/86 της Επιτροπής
