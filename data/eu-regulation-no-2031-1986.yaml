    τιμής που καταβάλλεται στους παραγωγούς για
    τα ροδάκινα και του ποσού ενίσχυσης στην παραγωγή
    για τα ροδάκινα σε σιρόπι
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2031/86 della Commissione del 30 giugno 1986 che fissa,
