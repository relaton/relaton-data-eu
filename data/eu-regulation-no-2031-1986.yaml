  content: Commission Regulation (EEC) No 2031/86 of 30 June 1986 fixing for the 1986/87
    marketing year the minimum price to be paid to producers for peaches and the amount
    of production aid for peaches in syrup
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2031/86 de la Commission du 30 juin 1986 fixant pour
