    (EOK) αριθ. 2852/81 περί παρεκκλίσεως από τόν κανονισμό
    (EOK) αριθ. 343/79 περί τών γενικών κανόνων πού αφορούν
    ορισμένες εργασίες αποστάξεως τών επιτραπέζιων
