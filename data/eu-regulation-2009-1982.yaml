title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2009/82 of 19 July 1982 amending Regulation
    (EEC) No 2852/81 derogating from Regulation (EEC) No 343/79 in respect of general
    rules relating to the distillation of table wines decided upon in accordance with
    Article 12a of Regulation (EEC) No 337/79t
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2009/82 du Conseil, du 19 juillet 1982, modifiant
    le règlement (CEE) n° 2852/81 dérogeant au règlement (CEE) n° 343/79 en ce
    qui concerne les règles générales de distillation de vins de table décidée
    conformément à l' article 12 "bis" du règlement (CEE) n° 337/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2009/82 des Rates vom 19. Juli 1982 zur Änderung
    der Verordnung (EWG) Nr. 2852/81 zur Abweichung von der Verordnung (EWG) Nr. 343/79
    hinsichtlich der allgemeinen Regeln der nach Artikel 12a der Verordnung (EWG)
    Nr. 337/79 beschlossenen Destillation von Tafelweinu
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2009/82 af 19. juli 1982 om ændring af forordning
    (EØF) nr. 2852/81 om afvigelse fra forordning (EØF) nr. 343/79 for så vidt
    angår de almindelige regler for destillation af bordvin, som er besluttet i henhold
    til artikel 12a i forordning (EØF) nr. 337/79
  type: main
- language: el
  script: Grek
