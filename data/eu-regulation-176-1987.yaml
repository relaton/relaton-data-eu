    aus Drittländern und diesbezüglicher Durchführungsbestimmungen sowie zur Aufhebung
    der Verordnung (EWG) Nr. 621/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 176/87 af 22. januar 1987 om fastsættelse
    for 1987 af kontingentet for import til Spanien af tamkaninkød fra tredjelande
    og af visse bestemmelser for dets anvendelse samt om ophævelse af forordning
    (EØF) nr. 621/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 176/87 της Επιτροπής
    της 22ας Ιανουαρίου 1987 για τον καθορισμό της
    ποσόστωσης, για το έτος 1987, η οποία εφαρμόζεται
    κατά την εισαγωγή στην Ισπανία κρέατος κατοικιδίων
    κουνελιών, προέλευσης τρίτων χωρών, και ορισμένων
