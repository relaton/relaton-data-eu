  script: Latn
  content: Commission Regulation (EEC) No 176/87 of 22 January 1987 fixing, for 1987,
    the quota for imports into Spain of meat of domestic rabbits from third countries
    and certain detailed rules for the application thereof and repealing Regulation
    (EEC) No 621/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 176/87 de la Commission du 22 janvier 1987 fixant,
    pour l' année 1987, le contingent applicable à l' importation en Espagne pour
    la viande de lapins domestiques en provenance des pays tiers et certaines modalités
    pour son application et abrogeant le règlement (CEE) n° 621/86
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 176/87 der Kommission vom 22. Januar 1987 zur Festsetzung
