    conigli domestici provenienti dai paesi terzi, stabilisce le relative modalità
    di applicazione e abroga il regolamento (CEE) n. 621/86
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 176/87 van de Commissie van 22 januari 1987 tot vaststelling
    van het contingent voor 1987 dat Spanje kan toepassen bij invoer van vlees van
    tamme konijnen uit derde landen, en van uitvoeringsbepalingen terzake, alsmede
    tot intrekking van Verordening (EEG) nr. 621/86
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 176/87 da Comissão de 22 de Janeiro de 1987 que
    fixa, para o ano de 1987, o contingente aplicável à importação em Espanha
    de carne de coelho doméstico proveniente de países terceiros e determinadas
    regras para a sua aplicação e que revoga o Regulamento (CEE) n.° 621/86
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 176/87 de la Comisión de 22 de enero de 1987 por
