    Rohzucker, der in den französischen überseeischen Departements erzeugt worden
    ist, vorgesehenen Beihilfe und des Differenzbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1764/76 af 22. juli 1976 om fastsættelse
