    fastsat for raffinering af råsukker, der er fremstillet i de franske oversøiske
    departementer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1764/76 της Επιτροπής
    της 22ας Ιουλίου 1976 περί καθορισμού ορισμένων
    λεπτομερειών όσον αφορά την παροχή του διαφοροποιημένου
    ποσού και την επιδότηση, που προβλέπονται για
    το ραφινάρισμα της ακατέργαστης ζάχαρης που
    παράγεται στα γαλλικά υπερπόντια διαμερίσματα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1764/76 della Commissione, del 22 luglio 1976, che
    stabilisce talune modalità relative alla concessione dell'importo differenziale
    e della sovvenzione previsti per la raffinazione dello zucchero greggio prodotto
    nei dipartimenti francesi d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1764/76 van de Commissie van 22 juli 1976 tot vaststelling
    van uitvoeringsbepalingen voor de toekenning van het differentiële bedrag en
    de subsidie die zijn vastgesteld voor de raffinering van in de Franse overzeese
    departementen geproduceerde ruwe suiker
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1764/76 da Comissão, de 22 de Julho de 1976, que
