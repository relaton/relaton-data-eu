  content: Commission Regulation (EEC) No 1764/76 of 22 July 1976 laying down certain
    detailed rules for granting the differential amount and the subsidy provided for
    the refinery of raw sugar produced in the French overseas departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1764/76 de la Commission, du 22 juillet 1976, établissant
