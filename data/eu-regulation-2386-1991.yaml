title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2386/91 of 5 August 1991 re-establishing
    the levying of customs duties on products falling within CN code 9401, originating
    in Poland, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2386/91 DE LA COMMISSION du 5 août 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 9401
    originaires de la Pologne, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2386/91 DER KOMMISSION vom 5. August 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 9401 mit Ursprung in Polen,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2386/91 af 5. august 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 9401 og med oprindelse
    i Polen, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2386/91 της Επιτροπής
    της 5ης Αυγούστου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    του κωδικού ΣΟ 9401, καταγωγής Πολωνίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2386/91 DELLA COMMISSIONE del 5 agosto 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 9401 originari
    della Polonia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2386/91 VAN DE COMMISSIE van 5 augustus 1991 houdende
