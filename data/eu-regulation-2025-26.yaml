    (EÚ) 2024/1143, pokiaľ ide o zápisy zemepisných označení a zaručených
    tradičných špecialít do registra, ich zmeny, zrušenia, presadzovanie ochrany,
    označovanie a komunikáciu, a ktorým sa mení vykonávacie nariadenie (EÚ)
    2019/34, pokiaľ ide o zemepisné označenia v sektore vinohradníctva a vinárstva,
