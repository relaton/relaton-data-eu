id: EURegulation202526
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/26 of 30 October 2024 laying
    down rules for the application of Regulation (EU) 2024/1143 of the European Parliament
    and of the Council as regards registrations, amendments, cancellations, enforcement
    of the protection, labelling and communication in respect of geographical indications
    and traditional specialities guaranteed, and amending Implementing Regulation
    (EU) 2019/34 as regards geographical indications in the wine sector, and repealing
    Implementing Regulations (EU) No 668/2014 and (EU) 2021/1236
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/26 de la Commission du 30 octobre 2024
    portant modalités d’application du règlement (UE) 2024/1143 du Parlement européen
    et du Conseil en ce qui concerne les enregistrements, les modifications, les annulations,
    l’application de la protection, l’étiquetage et la communication concernant
    les indications géographiques et les spécialités traditionnelles garanties,
    modifiant le règlement d’exécution (UE) 2019/34 en ce qui concerne les indications
    géographiques dans le secteur vitivinicole, et abrogeant les règlements d’exécution
    (UE) no 668/2014 et (UE) 2021/1236
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/26 der Kommission vom 30. Oktober 2024
    mit Durchführungsbestimmungen zur Verordnung (EU) 2024/1143 des Europäischen
    Parlaments und des Rates in Bezug auf Eintragungen, Änderungen, Löschungen,
    die Durchsetzung des Schutzes, die Kennzeichnung und Mitteilungen im Zusammenhang
    mit geografischen Angaben und garantiert traditionellen Spezialitäten und zur
    Änderung der Durchführungsverordnung (EU) 2019/34 in Bezug auf geografische
    Angaben im Weinsektor und zur Aufhebung der Durchführungsverordnungen (EU) Nr.
    668/2014 und (EU) 2021/1236
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/26 на Комисията
    от 30 октомври 2024 година за определяне на правила
    за прилагането на Регламент (ЕС) 2024/1143 на Европейския
    парламент и на Съвета по отношение на регистрациите,
    измененията, заличаванията, правоприлагането
    на закрилата, етикетирането и съобщенията
    във връзка с географските означения и храните
    с традиционно специфичен характер, както и
    за изменение на Регламент за изпълнение (ЕС)
    2019/34 по отношение на географските означения
    в лозаро-винарския сектор и за отмяна на регламенти
    за изпълнение (ЕС) № 668/2014 и (ЕС) 2021/1236
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/26 ze dne 30. října 2024, kterým
    se stanoví prováděcí pravidla k nařízení Evropského parlamentu a Rady
    (EU) 2024/1143, pokud jde o zápisy, změny, rušení, prosazování ochrany,
    označování a oznamování v souvislosti se zeměpisnými označeními a zaručenými
    tradičními specialitami, a kterým se mění prováděcí nařízení (EU) 2019/34,
    pokud jde o zeměpisná označení v odvětví vína, a zrušují prováděcí
    nařízení (EU) č. 668/2014 a (EU) 2021/1236
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/26 af 30. oktober 2024
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2024/1143
    for så vidt angår registreringer, ændringer, annulleringer, håndhævelse af
    beskyttelsen, mærkning og meddelelser vedrørende geografiske betegnelser og
    garanterede traditionelle specialiteter, om ændring af gennemførelsesforordning
    (EU) 2019/34 for så vidt angår geografiske betegnelser i vinsektoren og om ophævelse
    af gennemførelsesforordning (EU) nr. 668/2014 og (EU) 2021/1236
