    és a hagyományos különleges termékek bejegyzése, módosítása, törlése,
    oltalmának érvényesítése, jelölése és közlése tekintetében történő
    alkalmazására vonatkozó szabályok megállapításáról, az (EU) 2019/34 végrehajtási
