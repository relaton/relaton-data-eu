    (UE) 2024/1143 del Parlamento Europeo y del Consejo en lo relativo a las inscripciones
    en el registro, las modificaciones, las cancelaciones, la ejecución de la protección,
    el etiquetado y la comunicación en relación con las indicaciones geográficas
    y las especialidades tradicionales garantizadas, por el que se modifica el Reglamento
    de Ejecución (UE) 2019/34 en lo que respecta a las indicaciones geográficas
    del sector vitivinícola y por el que se derogan los Reglamentos de Ejecución
