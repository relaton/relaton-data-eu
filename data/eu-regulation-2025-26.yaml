    sprememb, preklicev, izvrševanja zaščite, označevanja in sporočanja pri geografskih
    označbah in zajamčenih tradicionalnih posebnostih, o spremembi Izvedbene uredbe
    (EU) 2019/34 glede geografskih označb v vinskem sektorju ter razveljavitvi izvedbenih
