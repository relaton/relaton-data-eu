    registracija, izmjena, poništenja, provedbe zaštite, označivanja i obavješćivanja
    u vezi s oznakama zemljopisnog podrijetla i zajamčeno tradicionalnim specijalitetima
    te o izmjeni Provedbene uredbe (EU) 2019/34 u pogledu oznaka zemljopisnog podrijetla
