    valamint a 668/2014/EU és az (EU) 2021/1236 végrehajtási rendelet hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/26 della Commissione, del 30 ottobre
    2024, che reca modalità di applicazione del regolamento (UE) 2024/1143 del Parlamento
    europeo e del Consiglio per quanto riguarda le registrazioni, le modifiche, le
    cancellazioni, l’applicazione della protezione, l’etichettatura e la comunicazione
    delle indicazioni geografiche e delle specialità tradizionali garantite, che
    modifica il regolamento di esecuzione (UE) 2019/34 per quanto riguarda le indicazioni
    geografiche nel settore vitivinicolo e che abroga i regolamenti di esecuzione
    (UE) n. 668/2014 e (UE) 2021/1236
  type: main
