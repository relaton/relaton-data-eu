    produite par Aspergillus oryzae DSM 33699 en tant qu’additif pour l’alimentation
    des volailles, des porcs d’engraissement, des porcelets sevrés et des truies
    (titulaire de l’autorisation: DSM Nutritional Products Ltd, représentée par
