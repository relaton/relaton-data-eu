    die Fertigstellung des Kanalisationsnetzes von Kalamata sowie die Kanalisationsnetze
    von Korinth, Argos und Tripoli in Griechenland Nr. FC: 93/09/61/016 - 93/09/61/053
    (Nur der griechische Text ist verbindlich)'
  type: main
