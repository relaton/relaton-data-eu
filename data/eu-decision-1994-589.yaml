title:
- language: en
  script: Latn
  content: '94/589/EC: Commission Decision of 12 April 1994 concerning the grant of
    assistance from the cohesion financial instrument to the set of stages of projects
    in Greece: sewage disposal and treatment in Sparta (Stage II), completion of sewerage
    network in Kalamata, sewerage network in Corinth, Argos and Tripoli Nos CF: 93/09/61/016
    - 93/09/61/053 (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/589/CE: Décision de la Commission, du 12 avril 1994, relative à l''octroi
    d''un concours de l''instrument financier de cohésion pour une série de phases
    de projets concernant, d''une part, l''évacuation et l''épuration des effluents
    de Sparte (deuxième phase) ainsi que l''achèvement du réseau d''évacuation
    des effluents de Kalamata et, d''autre part, le réseau d''évacuation des effluents
    de Corinthe, d''Argos et de Tripoli, en Grèce n° FC: 93/09/61/016 - 93/09/61/053
    (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
