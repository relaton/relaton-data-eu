  content: '80/477/EEC: Commission Decision of 14 April 1980 finding that the apparatus
    described as ''Ampex-multiband instrumentation recorder, model FR-3020'', is not
    a scientific apparatus and that Decisions 76/544/EEC and 76/812/EEC are hereby
    repealed'
