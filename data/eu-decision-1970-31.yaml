title:
- language: fr
  script: Latn
  content: '70/31/CECA: Décision de la Commission, du 22 décembre 1969, relative
    à la prorogation de l''autorisation de la vente en commun de combustibles par
    les sociétés minières des bassins belges, groupées au sein du Comptoir belge
    des charbons, société coopérative (COBECHAR)'
  type: main
- language: de
  script: Latn
  content: '70/31/EGKS: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Verlängerung der Genehmigung des gemeinsamen Verkaufs von Brennstoffen durch
    die im "Comptoir belge des charbons, Société coopérative (Cobechar)" zusammengeschlossenen
    Bergwerksgesellschaften der belgischen Reviere'
  type: main
- language: it
  script: Latn
  content: '70/31/CECA: Decisione della Commissione, del 22 dicembre 1969, recante
    proroga dell''autorizzazione di vendita in comune di combustibili da parte delle
    società minerarie dei bacini belgi raggruppate nel «Comptoir belge des charbons,
    société coopérative (Cobechar)»'
  type: main
- language: nl
  script: Latn
  content: '70/31/EGKS: Beschikking van de Commissie van 22 december 1969 houdende
    verlenging van de geldigheidsduur van de ontheffing van de verbodsbepaling inzake
    de gemeenschappelijke verkoop van brandstoffen door de in het Belgisch Kolenbureau,
    samenwerkende vennootschap (Kolbur), verenigde kolenmijnondernemingen van de Belgische
    bekkens'
