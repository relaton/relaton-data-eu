title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 964/76 of 27 April 1976 re-establishing
    the levying of customs duties on other goat and kidskin leather, other, falling
    within subheading 41.04 B II, originating in developing countries to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3010/75
    of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 964/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, préparées, non dénommées, de la sous-position tarifaire 41.04
    B II, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 964/76 der Kommission vom 27. April 1976 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder der Tarifstelle 41.04 B
    II mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr.
    3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 964/76 af 27. april 1976 om genindførelse
    at opkrævning af toldafgifter for læder af gede- og gedekidsskind, andre varer,
    under underposition 41.04 B II, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3010/75
    af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 964/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli caprine,
    preparate, non nominate, della sottovoce doganale n. 41.04 B II originarie dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 964/76 van de Commissie van 27 april 1976 houdende
    wederinstelling van de heffing van de douanerechten voor ander geiteleder, alsmede
    voorgelooide huiden en vellen, overige, van onderverdeling 41.04 B II, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
