  content: Règlement n° 130/67/CEE du Conseil du 13 juin 1967 déterminant les qualités
    type pour certaines céréales et catégories de farines, gruaux et semoules ainsi
    que les règles applicables pour la fixation des prix de seuil de ces catégories
    de produits
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 130/67/EWG des Rates vom 13. Juni 1967 zur Festsetzung der
    Standardqualitäten für bestimmte Arten von Getreide, Mehl, Grobgrieß und Feingrieß
    sowie der Regeln für die Festsetzung der Schwellenpreise dieser Arten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 130/67/CEE del Consiglio, del 13 giugno 1967, che fissa
    le qualità tipo di alcuni cereali e di alcune categorie di farine, semole e semolini,
    nonché le norme applicabili per la fissazione dei prezzi d'entrata di tali categorie
    di prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 130/67/EEG van de Raad van 13 juni 1967 tot vaststelling
    van de standaardkwaliteiten voor bepaalde graansoorten en bepaalde soorten meel,
    grutten, gries en griesmeel, alsmede van de voorschriften voor de vaststelling
    van de drempelprijzen voor deze soorten
