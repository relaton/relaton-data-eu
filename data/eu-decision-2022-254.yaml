title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/254 of 17 December 2021 pursuant
    to Regulation (EU) 2016/679 of the European Parliament and of the Council on the
    adequate protection of personal data by the Republic of Korea under the Personal
    Information Protection Act (notified under document C(2021) 9316)
  type: main
- language: fr
  script: Latn
