    Europeu e do Conselho que estabelece disposições comuns relativas ao Fundo Europeu
    de Desenvolvimento Regional, ao Fundo Social Europeu, ao Fundo de Coesão, ao
    Fundo Europeu Agrícola de Desenvolvimento Rural e ao Fundo Europeu dos Assuntos
    Marítimos e das Pescas e que estabelece disposições gerais relativas ao Fundo
    Europeu de Desenvolvimento Regional, ao Fundo Social Europeu, ao Fundo de Coesão
    e ao Fundo Europeu dos Assuntos Marítimos e das Pescas, os termos e as condições
    aplicáveis ao sistema de intercâmbio eletrónico de dados entre os Estados-Membros
    e a Comissão e que adota, nos termos do Regulamento (UE) n. ° 1299/2013 do Parlamento
    Europeu e do Conselho relativo às disposições específicas aplicáveis ao apoio
    prestado pelo Fundo Europeu de Desenvolvimento Regional ao objetivo da Cooperação
    Territorial Europeia, a nomenclatura das categorias de intervenção para o apoio
    do Fundo Europeu de Desenvolvimento Regional no âmbito do objetivo da cooperação
    territorial europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 184/2014 al Comisiei din 25
    februarie 2014 de stabilire, în temeiul Regulamentului (UE) nr. 1303/2013 al
    Parlamentului European și al Consiliului de stabilire a unor dispoziții comune
    privind Fondul european de dezvoltare regională, Fondul social european, Fondul
    de coeziune, Fondul european agricol pentru dezvoltare rurală și Fondul european
    pentru pescuit și afaceri maritime, precum și de stabilire a anumitor dispoziții
    generale privind Fondul european de dezvoltare regională, Fondul social european,
    Fondul de coeziune și Fondul european pentru pescuit și afaceri maritime, a
    clauzelor și condițiilor aplicabile sistemului de schimb electronic de date
    între statele membre și Comisie și de adoptare, în temeiul Regulamentului
    (UE) nr. 1299/2013 al Parlamentului European și al Consiliului privind dispoziții
    specifice pentru sprijinul din partea Fondului european de dezvoltare regională
    pentru obiectivul de cooperare teritorială europeană, a nomenclaturii categoriilor
    de intervenție pentru sprijinul din Fondul european de dezvoltare regională
    în cadrul obiectivului de cooperare teritorială europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 184/2014 z 25. februára 2014
    , ktorým sa stanovujú pravidlá a podmienky uplatniteľné na systém elektronickej
    výmeny údajov medzi členskými štátmi a Komisiou podľa nariadenia Európskeho
    parlamentu a Rady (EÚ) č. 1303/2013, ktorým sa stanovujú spoločné ustanovenia
    o Európskom fonde regionálneho rozvoja, Európskom sociálnom fonde, Kohéznom
    fonde, Európskom poľnohospodárskom fonde pre rozvoj vidieka a Európskom námornom
    a rybárskom fonde a ktorým sa stanovujú všeobecné ustanovenia o Európskom
    fonde regionálneho rozvoja, Európskom sociálnom fonde, Kohéznom fonde a Európskom
    námornom a rybárskom fonde a ktorým sa prijíma nomenklatúra kategórií intervencií
    na podporu z Európskeho fondu regionálneho rozvoja v rámci cieľa Európska
    územná spolupráca podľa nariadenia Európskeho parlamentu a Rady (EÚ) č.
    1299/2013 o osobitných ustanoveniach na podporu cieľa Európska územná spolupráca
    z Európskeho fondu regionálneho rozvoja
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 184/2014 z dne 25. februarja 2014 o
    določitvi pogojev za sistem elektronske izmenjave podatkov med državami članicami
    in Komisijo v skladu z Uredbo (EU) št. 1303/2013 Evropskega parlamenta in Sveta
    o skupnih določbah o Evropskem skladu za regionalni razvoj, Evropskem socialnem
    skladu, Kohezijskem skladu, Evropskem kmetijskem skladu za razvoj podeželja in
    Evropskem skladu za pomorstvo in ribištvo ter o splošnih določbah o Evropskem
    skladu za regionalni razvoj, Evropskem socialnem skladu, Kohezijskem skladu in
    Evropskem skladu za pomorstvo in ribištvo ter o sprejetju nomenklature za kategorije
    ukrepov za podporo cilju „evropsko teritorialno sodelovanje“ iz Evropskega
    sklada za regionalni razvoj v skladu z Uredbo (EU) št. 1299/2013 Evropskega parlamenta
    in Sveta o posebnih določbah za podporo cilju „evropsko teritorialno sodelovanje“
    iz Evropskega sklada za regionalni razvoj
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 184/2014 de la Comisión, de 25 de febrero
    de 2014 , que establece, con arreglo al Reglamento (UE) n ° 1303/2013 del Parlamento
    Europeo y del Consejo, por el que se establecen disposiciones comunes relativas
    al Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al Fondo de
    Cohesión, al Fondo Europeo Agrícola de Desarrollo Rural y al Fondo Europeo Marítimo
    y de la Pesca, y por el que se establecen disposiciones generales relativas al
    Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al Fondo de Cohesión
    y al Fondo Europeo Marítimo y de la Pesca, las condiciones aplicables al sistema
    de intercambio electrónico de datos entre los Estados miembros y la Comisión
    y la adopción, con arreglo al Reglamento (UE) n ° 1299/2013 del Parlamento Europeo
    y del Consejo, por el que se establecen disposiciones específicas relativas al
    apoyo del Fondo Europeo de Desarrollo Regional al objetivo de cooperación territorial
    europea, de la nomenclatura relativa a las categorías de intervención del apoyo
    del Fondo Europeo de Desarrollo Regional a dicho objetivo
  type: main
- language: sv
  script: Latn
