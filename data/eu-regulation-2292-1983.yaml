title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2292/83 of 10 August 1983 re-establishing
    the levying of customs duties on primary cells and primary batteries, falling
    within heading No 85.03 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2292/83 de la Commission du 10 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux piles électriques de la
    position 85.03 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2292/83 der Kommission vom 10. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Primärelemente und Primärbatterien der Tarifnummer
    85.03, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2292/83 af 10. august 1983 om genindførelse
    af opkrævning af told for primærelementer og primærbatterier, henhørende under
    pos. 85.03 og med oprindelse i Hongkong, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2292/83 της Επιτροπής
    της 10ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τις ηλεκτρικές στήλες
    της κλάσεως 85.03 του Κοινού Δασμολογίου, καταγωγής
    Χονγκ Κονγκ, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2292/83 della Commissione del 10 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle pile elettriche, della voce
    85.03 della tariffa doganale comune, originarie di Hong Kong, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2292/83 van de Commissie van 10 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op elektrische
    elementen en elektrische batterijen van tariefpost 85.03, van oorsprong uit Hong-Kong,
    waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
