title:
- language: en
  script: Latn
  content: '80/566/EEC: Commission Decision of 23 May 1980 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of oak wood originating in Canada (Only the French, German,
    Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/566/CEE: Décision de la Commission, du 23 mai 1980, autorisant certains
    Etats membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil, pour le bois de chêne originaire du Canada (Les textes
    en langues française, allemande, italienne et néerlandaise sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/566/EWG: Entscheidung der Kommission vom 23. Mai 1980 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Eichenholz mit Ursprung in Kanada Ausnahmen von
    bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der
    französische, deutsche, italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/566/EØF: Kommissionens beslutning af 23. maj 1980 om bemyndigelse
    af visse medlemsstater til at undtage egetræ med oprindelse i Canada fra visse
    bestemmelser i Rådets direktiv 77/93/EØF (Kun den franske, tyske, italienske
    og nederlandske og udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '80/566/ΕΟΚ : Απόφαση της Επιτροπής, της 23ης
    Μαΐου 1980, με την οποία επιτρέπεται σε ορισμένα
    κράτη μέλη να προβλέψουν αποκλήσεις για ορισμένες
    διατάξεις της Οδηγίας 77/93/ΕΟΚ του Συμβουλίου,
    όσον αφορά ξυλεία δρυός προέλευσης Καναδά
    (Τα κείμενα στην γαλλική, γερμανική, ιταλική,
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '80/566/CEE: Decisione della Commissione, del 23 maggio 1980, che autorizza
    taluni Stati membri a prevedere deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per il legname di quercia originario del Canada (I testi
    in lingua francese, tedesca, italiana e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/566/EEG: Beschikking van de Commissie van 23 mei 1980 houdende machtiging
