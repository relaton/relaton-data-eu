    Richtlijn 77/93/EEG van de Raad, ten aanzien van eikehout van oorsprong uit Canada
    (Slechts de teksten in de Franse, Duitse, Italiaanseen de Nederlandse taal zijn
    authentiek)'
  type: main
- language: pt
  script: Latn
  content: '80/566/CEE: Decisão da Comissão, de 23 de Maio de 1980, que autoriza
