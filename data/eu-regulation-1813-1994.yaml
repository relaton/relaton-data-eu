    de carne de suíno e outros produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1813/94 de la Comisión, de 22 de julio de 1994, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de julio de 1994 al amparo del régimen previsto en el Reglamento (CE)
    n 774/94 del Consejo, relativo a la apertura y modo de gestión de determinados
    contingentes arancelarios comunitarios de carne de porcino y determinados productos
