title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1813/94 of 22 July 1994 determining the extent
    to which applications lodged in July 1994 for import licences for certain pigmeat
    sector products under the regime provided for by Council Regulation (EC) No 774/94
    opening and providing for the administration of certain Community tariff quotas
    for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1813/94 de la Commission, du 22 juillet 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1994 pour certains produits du secteur de la viande de porc peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1813/94 der Kommission vom 22. Juli 1994 über die
    Festsetzung des Umfangs, in dem die im Juli 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1813/94 af 22. juli 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1994 om importlicencer for visse svinekødsektorer i forbindelse med Rådets forordning
    (EF) nr. 774/94 om åbning og forvaltning af en række EF-toldkontingenter for
    oksekød af høj kvalitet, svinekød, fjerkrækød, hvede og blandsæd af hvede
    og rug samt klid og andre restprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1813/94 της Επιτροπής
    της 22ας Ιουλίου 1994 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Ιούλιο του 1994 για άδειες
    εισαγωγής για ορισμένα προϊόντα του τομέα
    του χοιρείου κρέατος θα γίνουν αποδεκτές βάσει
    του καθεστώτος που προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 774/94 του Συμβουλίου για το άνοιγμα
    και τον τρόπο διαχείρισης ορισμένων κοινοτικών
    δασμολογικών ποσοστώσεων για το χοίρειο κρέας,
    και για ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1813/94 della Commissione, del 22 luglio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dal regolamento (CE) n. 774/94 del Consiglio
    recante apertura e modalità di gestione di alcuni contingenti tariffari comunitari
    di carni suine e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1813/94 van de Commissie van 22 juli 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in juli 1994 worden ingediend
    op grond van Verordening (EG) nr. 774/94 van de Raad houdende opening en vaststelling
    van de wijze van beheer van communautaire tariefcontingenten voor varkensvlees
    en bepaalde andere landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1813/94 da Comissão, de 22 de Julho de 1994, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Julho de
    1994 ao abrigo do regime previsto no Regulamento (CE) nº 774/94 do Conselho relativo
