title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2153/70 du Conseil, du 27 octobre 1970, portant suspension
    partielle du droit autonome du tarif douanier commun sur les crevettes de la variété
    pandalus platiceros japonicus, cuites à l'eau et décortiquées, même congelées,
    destinées à la conserverie (sous-position EX 16.05 b)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2153/70 des Rates vom 27. Oktober 1970 über die teilweise
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Garnelen der
    Art Pandalus Platiceros Japonicus, in Wasser gekocht und geschält, auch gefroren,
    für die Konservenindustrie (Tarifstelle ex 16.05 B)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2153/70 del Consiglio, del 27 ottobre 1970, recante
    sospensione parziale del dazio autonomo della tariffa doganale comune sui gamberetti
    della varietà Pandalus Platiceros Japonicus, cotti in acqua e scorticati, anche
    congelati, destinati all'industria conserviera (sottovoce ex 16.05 B)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2153/70 van de Raad van 27 oktober 1970 houdende
    gedeeltelijke schorsing van het autonome recht van het gemeenschappelijk douanetarief
    voor garnalen van de soort Pandalus Platiceros Japonicus, gekookt in water en
    gepeld, ook indien bevroren, bestemd voor de conservenindustrie (Postonderverdeling
    ex 16.05 B)
  type: main
