  content: Commission Regulation (EC) No 908/94 of 25 April 1994 determining the extent
    to which application lodged in April 1994 for import licences for certain pigmeat
    products under the regime provided for by the Agreements concluded by the Community
    with the Republic of Poland, the Republic of Hungary, the Czech Republic and the
    Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 908/94 de la Commission, du 25 avril 1994, déterminant
