    voor de risicoanalyse inzake landbouwproducten waarvoor restituties worden toegekend
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2655/1999 z dnia 16 grudnia 1999 r. zmieniające
    rozporządzenie (WE) nr 2221/95 ustanawiające szczegółowe zasady stosowania
    rozporządzenia Rady (EWG) nr 386/90 w odniesieniu do kontroli bezpośrednich
    przy wywozie produktów rolnych kwalifikujących się do refundacji i zmieniające
    rozporządzenie (WE) nr 3122/94 ustanawiające kryteria analiz ryzyka w odniesieniu
    do produktów rolnych otrzymujących refundacje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2655/1999 da Comissão, de 16 de Dezembro de 1999,
    que altera o Regulamento (CE) n.o 2221/95, que estabelece as regras de execução
    do Regulamento (CEE) n.o 386/90 do Conselho no que diz respeito ao controlo físico
    aquando da exportação de produtos agrícolas que beneficiam de uma restituição,
    e o Regulamento (CE) n.o 3122/94 que estabelece os critérios da análise de riscos
    no respeitante aos produtos agrícolas que beneficiam de uma restituição
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2655/1999 al Comisiei din 16 decembrie 1999 de modificare
    a Regulamentului (CE) nr. 2221/95 privind normele de aplicare a Regulamentului
    (CEE) nr. 386/90 al Consiliului în ceea ce privește controalele fizice efectuate
    la exportul de produse agricole care beneficiază de restituiri și de modificare
    a Regulamentului (CE) nr. 3122/94 de stabilire a criteriilor pentru evaluarea
    riscurilor în ceea ce privește produsele agricole care beneficiază de o restituire
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2655/1999 zo 16. decembra 1999, ktorým sa
    mení a dopĺňa nariadenie (ES) č. 2221/95 stanovujúce podrobné pravidlá
    uplatňovania nariadenia Rady (EHS) č. 386/90 o fyzických kontrolách vykonávaných
    v čase vývozu poľnohospodárskych výrobkov podliehajúcich vývozným náhradám
    a ktorým sa mení a dopĺňa nariadenie (ES) č. 3122/94 stanovujúce kritériá
    pre analýzu rizika poľnohospodárskych výrobkov, na ktoré sa poskytujú náhrady
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2655/1999 z dne 16. decembra 1999 o spremembah
    Uredbe (ES) št. 2221/95 o določitvi podrobnih pravil za uporabo Uredbe Sveta
    (EGS) št. 386/90 glede fizičnih pregledov, opravljenih pri izvozu kmetijskih
    proizvodov, ki izpolnjujejo pogoje za plačilo izvoznih nadomestil, in o spremembah
    Uredbe (ES) št. 3122/94 o določitvi meril za analizo tveganja v zvezi s kmetijskimi
    proizvodi, za katere se dobijo izvozna nadomestila
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2655/1999 de la Comisión, de 16 de diciembre de 1999,
    que modifica el Reglamento (CE) nº 2221/95 por el que se establecen disposiciones
    de aplicación del Reglamento (CEE) nº 386/90 del Consejo en lo que se refiere
    al control físico de las exportaciones de productos agrícolas que se beneficien
    de una restitución y modifica el Reglamento (CE) nº 3122/94, por el que se establecen
    los criterios para efectuar el análisis de riesgos en lo que concierne a los
    productos agrícolas que se benefician de una restitución
  type: main
