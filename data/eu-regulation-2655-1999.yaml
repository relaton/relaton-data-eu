  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 2655/1999 od 16. prosinca 1999. o izmjeni Uredbe
    (EZ) br. 2221/95 o utvrđivanju detaljnih pravila za primjenu Uredbe Vijeća (EEZ)
    br. 386/90 u pogledu fizičkih pregleda koji se provode pri izvozu poljoprivrednih
    proizvoda koji ispunjavaju uvjete za subvencije te izmjeni Uredbe (EZ) br. 3122/94
