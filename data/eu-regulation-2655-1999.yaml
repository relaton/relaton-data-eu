title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2655/1999 of 16 December 1999 amending Regulation
    (EC) No 2221/95 laying down detailed rules for the application of Council Regulation
    (EEC) No 386/90 as regards physical checks carried out at the time of export of
    agricultural products qualifying for refunds and amending Regulation (EC) No 3122/94
    laying down criteria for risk analysis as regards agricultural products receiving
    refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2655/1999 de la Commission, du 16 décembre 1999, modifiant
    le règlement (CE) nº 2221/95 portant modalités d'application du règlement
    (CEE) nº 386/90 du Conseil en ce qui concerne le contrôle physique lors de l'exportation
    de produits agricoles bénéficiant d'une restitution et le règlement (CE) nº
    3122/94 établissant les critères pour l'analyse de risque en ce qui concerne
    les produits agricoles bénéficiant d'une restitution
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2655/1999 der Kommission vom 16. Dezember 1999 zur
