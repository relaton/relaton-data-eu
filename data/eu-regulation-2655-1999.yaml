    za koje se dobivaju subvencije
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2655/1999/EK rendelete (1999. december 16.) a visszatérítésre
    jogosult mezőgazdasági termékek kivitelekor elvégzett fizikai ellenőrzések
    tekintetében a 386/90/EGK tanácsi rendelet alkalmazására vonatkozó részletes
    szabályok megállapításáról szóló 2221/95/EK rendelet módosításáról,
    valamint a támogatásban részesülő mezőgazdasági termékeket érintő kockázatelemzés
    feltételeinek megállapításáról szóló 3122/94/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2655/1999 della Commissione, del 16 dicembre 1999,
    che modifica il regolamento (CE) n. 2221/95, recante modalità d'applicazione
    del regolamento (CEE) n. 386/90 del Consiglio, per quanto riguarda il controllo
    fisico al momento dell'esportazione di prodotti agricoli che beneficiano di una
    restituzione, e il regolamento (CE) n. 3122/94, che stabilisce i criteri per l'analisi
    di rischio relativa ai prodotti agricoli che beneficiano di una restituzione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr.2655/1999 (1999.gada 16.decembris), kas groza
    Regulu (EK) Nr.2221/95, kurā sīki izstrādāti noteikumi, kā piemērot Padomes
    Regulu (EEK) Nr.386/90 par fiziskām pārbaudēm, ko veic, eksportējot lauksaimniecības
    produktus, par kuriem pienākas kompensācijas, un kas groza Regulu (EK) Nr.3122/94,
    kurā noteikti riska analīzes kritēriji attiecībā uz lauksaimniecības produktiem,
    par kuriem pienākas kompensācijas
  type: main
- language: lt
  script: Latn
  content: 1999 m. gruodžio 16 d. Komisijos reglamentas (EB) Nr. 2655/1999, iš dalies
    pakeičiantis Reglamentą (EB) Nr. 2221/95, nustatantį išsamias Tarybos reglamento
    (EEB) Nr. 386/90 dėl fizinių patikrinimų, atliekamų eksportuojant žemės
    ūkio produktus, už kuriuos skiriamos grąžinamosios išmokos, taikymo taisykles,
    ir iš dalies pakeičiantis Reglamentą (EB) Nr. 3122/94, nustatantį žemės
    ūkio produktų, už kuriuos mokamos grąžinamosios išmokos, rizikos analizės
    kriterijus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 2655/1999 tas-16 ta' Diċembru
    1999 li jemenda r-Regolament (KE) Nru 2221/95 li jistabbilixxi regoli dettaljati
    sabiex jiġi applikat ir-Regolament tal-Kunsill (KEE) Nru 386/90 dwar il-kontrolli
    fiżiċi mwettqa fil-ħin ta' l-esportazzjoni tal-prodotti agrikoli li jikkwalifikaw
