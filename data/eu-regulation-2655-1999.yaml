    rifużjonijiet
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2655/1999 van de Commissie van 16 december 1999 tot
    wijziging van Verordening (EG) nr. 2221/95 houdende nadere bepalingen ter toepassing
    van Verordening (EEG) nr. 386/90 van de Raad ten aanzien van de fysieke controle
    bij de uitvoer van voor een restitutie in aanmerking komende landbouwproducten,
