  script: Latn
  content: Kommissionens förordning (EG) nr 2655/1999 av den 16 december 1999 om
    ändring av förordning (EG) nr 2221/95 om tillämpningsföreskrifter för rådets
    förordning (EEG) nr 386/90 vad gäller fysisk kontroll i samband med export av
