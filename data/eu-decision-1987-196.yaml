    une infestation d''otiorhynque sillonné (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/196/EWG: Entscheidung der Kommission vom 4. März 1987 zur Festlegung
