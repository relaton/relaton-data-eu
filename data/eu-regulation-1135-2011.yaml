  content: Commission Regulation (EU) No 1135/2011 of 9 November 2011 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Implementing Regulation (EU) No 791/2011 on imports of certain open
    mesh fabrics of glass fibres originating in the People’s Republic of China by
    imports of certain open mesh fabrics of glass fibres consigned from Malaysia,
    whether declared as originating in Malaysia or not, and making such imports subject
    to registration
  type: main
