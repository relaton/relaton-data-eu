title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 juin 1963, portant abrogation de sa décision
    du 5 juillet 1962, autorisant la perception d'une taxe compensatoire sur les importations,
    en République fédérale d'Allemagne, de pâte à fondant en provenance du Royaume
    des Pays-Bas, du Royaume de Belgique et de la République française
  type: main
- language: de
  script: Latn
  content: '63/384/EWG: Entscheidung der Kommission vom 11. Juni 1963 über die Aufhebung
    ihrer Entscheidung vom 5. Juli 1962 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Fondantmasse aus dem Königreich der Niederlande, dem Königreich
    Belgien und der Französischen Republik in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/384/CEE: Decisione della Commissione dell''11 giugno 1963 recante abrogazione
    della propria decisione del 5 luglio 1962 relativa alla autorizzazione a riscuotere
    una tassa di compensazione sulle importazioni di pasta per fondente nella Repubblica
    federale di Germania, in provenienza dal Regno dei Paesi Bassi, dal Regno del
    Belgio e dalla Repubblica francese'
  type: main
- language: nl
  script: Latn
  content: '63/384/EEG: Beschikking van de Commissie van 11 juni 1963 houdende intrekking
    van haar beschikking van 5 juli 1962, waarbij machtiging werd verleend tot het
    leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van fondantmassa, uit het Koninkrijk der Nederlanden, het Koninkrijk België en
    de Franse Republiek'
  type: main
