    nebrat v úvahu některé kategorie plnění a používat určité přibližné
    odhady pro výpočet základu vlastních zdrojů z DPH (oznámeno pod číslem
    C(2014) 8921)'
  type: main
- language: da
  script: Latn
  content: '2014/840/EU, Euratom: Kommissionens gennemførelsesafgørelse af 26. november
