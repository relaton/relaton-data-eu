    til at beregne grundlaget for Fællesskabernes momsindtægter uden hensyntagen
    til visse transaktioner og, for andre transaktioners vedkommende, på basis af
    en tilnærmelsesvis vurdering (meddelt under nummer C(2014) 8921)'
  type: main
- language: el
