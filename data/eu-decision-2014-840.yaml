title:
- language: en
  script: Latn
  content: '2014/840/EU, Euratom: Commission Implementing Decision of 26 November
    2014 amending Decision 90/177/Euratom, EEC authorizing Belgium not to take into
    account certain categories of transactions and to use certain approximate estimates
    for the calculation of the VAT own resources base (notified under document C(2014)
    8921)'
  type: main
- language: fr
  script: Latn
  content: '2014/840/UE, Euratom: Décision d''exécution de la Commission du 26 novembre
    2014 modifiant la décision 90/177/Euratom, CEE autorisant la Belgique à ne pas
    tenir compte de certaines catégories d''opérations et à utiliser certaines
    estimations approximatives pour le calcul de la base des ressources propres provenant
    de la taxe sur la valeur ajoutée [notifiée sous le numéro C(2014) 8921]'
  type: main
- language: de
  script: Latn
  content: '2014/840/EU, Euratom: Durchführungsbeschluss der Kommission vom 26. November
    2014 zur Änderung der Entscheidung 90/177/Euratom, EWG, mit der Belgien ermächtigt
    wird, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln (Bekanntgegeben
    unter Aktenzeichen C(2014) 8921)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/840/ЕС, Евратом: Решение за изпълнение
    на Комисията от 26 ноември 2014 година за изменение
    на Решение 90/177/Евратом, ЕИО за разрешаване
    на Белгия да не отчита някои категории сделки
    и да използва някои приблизителни разчети
    при изчисляването на базата за собствените
    ресурси от ДДС (нотифицирано под номер С(2014)
    8921)'
  type: main
- language: cs
  script: Latn
