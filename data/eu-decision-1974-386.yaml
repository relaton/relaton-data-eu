title:
- language: en
  script: Latn
  content: '74/386/EEC: Commission Decision of 17 July 1974 setting a limit date to
    the Commission Decision of 8 May 1974 authorizing the Italian Republic to take
    certain safeguard measures under Article 108 (3) of the EEC Treaty with respect
    to certain sectors of agriculture'
  type: main
- language: fr
  script: Latn
  content: '74/386/CEE: Décision de la Commission, du 17 juillet 1974, fixant notamment
    une date limite de la décision de la Commission, du 8 mai 1974, autorisant la
    République italienne à prendre certaines mesures de sauvegarde au titre de l''
    article 108 paragraphe 3 du traité CEE, en ce qui concerne certains secteurs
    agricoles'
  type: main
- language: de
  script: Latn
  content: '74/386/EWG: Entscheidung der Kommission vom 17. Juli 1974 namentlich zur
    Festsetzung eines Endtermins für die Entscheidung der Kommission vom 8. Mai 1974,
    mit der die Italienische Republik ermächtigt wird, bestimmte Schutzmaßnahmen
    im Sinne von Artikel 108 Absatz 3 des EWG-Vertrags zu treffen, bezüglich bestimmter
    landwirtschaftlicher Sektoren'
  type: main
- language: da
  script: Latn
  content: '74/386/EØF: Kommissionens Beslutning af 17. juli 1974 navnlig om fastsættelse
    af en tidsgrænse for Kommissionens beslutning af 8. maj 1974 om bemyndigelse
    af Den italienske Republik til at træffe visse beskyttelsesforanstaltninger i
    henhold til artikel 108, stk. 3, i EØF-traktaten, for så vidt angår visse sektorer
    inden for landbruget'
  type: main
- language: it
  script: Latn
  content: '74/386/CEE: Decisione della Commissione, del 17 luglio 1974, che fissa
    in particolare per alcuni settori agricoli una data limite di applicabilità della
    decisione della Commissione dell'' 8 maggio 1974, che autorizza la Repubblica
    italiana a prendere talune misure di salvaguardia ai sensi dell'' articolo 108,
    paragrafo 3, del trattato CEE'
  type: main
- language: nl
  script: Latn
  content: '74/386/EEG: Beschikking van de Commissie van 17 juli 1974 waarbij met
    name een datum wordt vastgesteld waarop voor een aantal landbouwsectoren de geldigheidsduur
    afloopt van de beschikking van de Commissie van 8 mei 1974, waarbij de Italiaanse
    Republiek wordt gemachtigd bepaalde vrijwaringsmaatregelen te treffen overeenkomstig
    artikel 108, lid 3, van het Verdrag'
  type: main
