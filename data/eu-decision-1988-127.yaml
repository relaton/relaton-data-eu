title:
- language: en
  script: Latn
  content: '88/127/EEC: Commission Decision of 12 February 1988 authorizing certain
    Member States temporarily to take additional measures to protect themselves against
    the introduction of Corynebacterium sepedonicum as regards the Federal Republic
    of Germany (Only the English, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/127/CEE: Décision de la Commission du 12 février 1988 autorisant
    certains États membres à prendre provisoirement des mesures supplémentaires,
    en vue de se protéger contre l''introduction de Corynebacterium sepedonicum en
    ce qui concerne la République fédérale d''Allemagne (Les textes en langues
    anglaise, française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/127/EWG: Entscheidung der Kommission vom 12. Februar 1988 zur Ermächtigung
    bestimmter Mitgliedstaaten, zum Schutz gegen die Einschleppung von Corynebacterium
    sepedonicum vorübergehend ergänzende Maßnahmen gegenüber der Bundesrepublik
    Deutschland zu treffen (Nur der englische, französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/127/EØF: Kommissionens beslutning af 12. februar 1988 om bemyndigelse
    af visse medlemsstater til at træffe midlertidige supplerende foranstaltninger
    til beskyttelse mod indslæbning af Corynebacterium sepedonicum for så vidt angår
    Forbundsrepublikken Tyskland (Kun den engelske, franske og nederlandske udgave
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/127/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Φεβρουαρίου 1988 με την οποία εξουσιοδοτούνται
    προσωρινά ορισμένα κράτη μέλη να λάβουν συμπληρωματικά
    μέτρα για να προστατευθούν από την εισαγωγή
    στην επικράτειά τους του Corynebacterium sepedonicum από
    την Ομοσπονδιακή Δημοκρατία της Γερμανίας
    (Τα κείμενα στην αγγλική, γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '88/127/CEE: Decisione della Commissione del 12 febbraio 1988 che autorizza
    alcuni Stati membri a prendere provvisoriamente misure supplementari per cautelarsi
    contro l''introduzione nel proprio territorio di Corynebacterium sepedonicum in
    provenienza dalla Repubblica federale di Germania (Il testi in lingua inglese,
    francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/127/EEG: Beschikking van de Commissie van 12 februari 1988 houdende
    machtiging van bepaalde Lid-Staten om ten aanzien van de Bondsrepubliek Duitsland
    tijdelijk aanvullende maatregelen te nemen ten einde zich te beschermen tegen
    het binnenbrengen van Corynebacterium sepedonicum (Slechts de teksten in de Engelse,
    Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/127/CEE: Decisão da Comissão de 12 de Fevereiro de 1988 que autoriza
    determinados Estados-membros a tomarem, temporariamente, medidas suplementares
    para se protegerem contra a introdução de Corynebacterium spedonicum em relação
    à República Federal da Alemanha (Apenas fazem fé os textos nas línguas, inglesa
    francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '88/127/CEE: Decisión de la Comisión de 12 de febrero de 1988 por la
    que se autoriza a determinados Estados miembros para que adopten provisionalmente
    las medidas complementarias necesarias para protegerse contra la introducción
    del Corynebacterium sepedonicum en relación con la República Federal de Alemania
    (Los textos en lenguas inglesa, francesa y neerlandesa son los únicos auténticos)'
