title:
- language: en
  script: Latn
  content: '93/544/EEC: Commission Decision of 5 October 1993 amending the Decision
    91/652/EEC on the establishment of a Community support framework for Community
    structural assistance in the United Kingdom (Areas outside Objective 1) on the
    improvement of the conditions under which agricultural products are processed
    and marketed (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/544/CEE: Décision de la Commission du 5 octobre 1993 modifiant la
    décision 91/652/CEE concernant l''établissement du cadre communautaire d''appui
    pour les interventions structurelles communautaires en matière d''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    au Royaume-Uni (à l''exception de l''Irlande du Nord) (Le texte en langue anglaise
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/544/EWG: ENTSCHEIDUNG DER KOMMISSION vom 5. Oktober 1993 zur Änderung
    der Entscheidung 91/652/EWG zur Aufstellung eines gemeinschaftlichen Förderkonzepts
    für gemeinschaftliche Strukturinterventionen zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen landwirtschaftlicher Erzeugnisse im Vereinigten Königreich
    (ohne Nordirland) (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/544/EØF: KOMMISSIONENS BESLUTNING af 5. oktober 1993 om ændring af
    beslutning 91/652/EØF om fastlæggelse af fællesskabsstøtterammen for EF''
    s strukturinterventioner i Det Forenede Kongerige (distrikter uden for mål nr.
    1) til forbedring af vilkårene for forarbejdning og afsætning af landbrugsprodukter
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/544/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 5ης Οκτωβρίου
    1993 που τροποποιεί την απόφαση 91/652/ΕΟΚ σχετικά
    με την κατάρτιση κοινοτικού πλαισίου στήριξης
    για χορήγηση κοινοτικής διαρθρωτικής βοήθειας
    στο Ηνωμένο Βασίλειο (περιφέρειες εκτός στόχου
    1) που αφορούν τη βελτίωση των συνθηκών μεταποίησης
    και εμπορίας των γεωργικών προϊόντων (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/544/CEE: DECISIONE DELLA COMMISSIONE del 5 ottobre 1993 che modifica
    la decisione 91/652/CEE riguardante la definizione del quadro comunitario di sostegno
    per gli interventi strutturali della Comunità in ordine al miglioramento delle
    condizioni di trasformazione e di commercializzazione dei prodotti agricoli nel
    Regno Unito (zone non comprese nell'' obiettivo 1) (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/544/EEG: BESCHIKKING VAN DE COMMISSIE van 5 oktober 1993 houdende wijziging
    van Beschikking 91/652/EEG tot vaststelling van het communautair bestek voor de
    structurele bijstandsverlening van de Gemeenschap voor de verbetering van de verwerking
    en de afzet van landbouwprodukten in het Verenigd Koninkrijk (met uitzondering
    van Noord-Ierland) (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/544/CEE: Decisão da Comissão de 5 de Outubro de 1993 que altera a
    Decisão 91/652/CEE, que estabelece um quadro comunitário de apoio para as intervenções
    estruturais comunitárias, destinadas à melhoria das condições de transformação
    e comercialização dos produtos agrícolas no Reino Unido (excluindo a Irlanda
    do Norte) (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '93/544/CEE: DECISIÓN DE LA COMISIÓN de 5 de octubre de 1993 que modifica
    la Decisión 91/652/CEE por la que se establece el marco comunitario de apoyo
    para la ayuda estructural comunitaria al Reino Unido (exceptuando Irlanda del
    Norte) en la mejora de las condiciones de transformación y comercialización
    de los productos agrícolas (El texto en lengua inglesa es el único auténtico)'
