title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne à adopter
    une mesure de sauvegarde en application de l'article 226 du Traité, en faveur
    des feuilles et bandes minces en plomb, poudres et paillettes de plomb
  type: main
- language: de
  script: Latn
  content: '63/211/EWG: Entscheidung der Kommission zur Ermächtigung der Italienischen
    Republik auf Anwendung von Schutzmaßnahmen gemäß Artikel 226 des Vertrages
    für Folien und dünne Bänder, Pulver und Flitter aus Blei'
  type: main
- language: it
  script: Latn
  content: '63/211/CEE: Decisione della Commissione che autorizza la Repubblica italiana
    ad adottare, a norma dell''articolo 226 del Trattato, una misura di salvaguardia
    a favore della produzione di fogli e nastri sottili, polveri e pagliette di piombo'
  type: main
- language: nl
  script: Latn
  content: '63/211/EEG: Beschikking van de Commissie tot machtiging van de Italiaanse
    Republiek om op grond van artikel 226 van het Verdrag een vrijwaringsmaatregel
    te nemen ten behoeve van loodfoelie, loodpoeder en loodschilfers'
  type: main
