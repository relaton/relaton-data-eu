title:
- language: en
  script: Latn
  content: '80/922/EEC: Commission Decision of 11 September 1980 authorizing the United
    Kingdom not to apply Community treatment to cotton yarn, falling within heading
    No 55.05 of the Common Customs Tariff (category 1), originating in Mexico and
    in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/922/CEE: Décision de la Commission, du 11 septembre 1980, autorisant
    le Royaume-Uni à exclure du traitement communautaire les fils de coton, de la
    position 55.05 du tarif douanier commun (catégorie 1), originaires du Mexique
    et mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/922/EWG: Entscheidung der Kommission vom 11. September 1980, mit der
    das Vereinigte Königreich ermächtigt wird, aus Mexiko stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne der Tarifnummer 55.05
    des Gemeinsamen Zolltarifs (Kategorie 1) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/922/EØF: Kommissionens beslutning af 11. september 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage garn af bomuld,
    som henhører under pos. 55.05 i den fælles toldtarif (kategori 1), har oprindelse
    i Mexico og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/922/CEE: Decisione della Commissione, dell''11 settembre 1980, che
    autorizza il Regno Unito ad escludere dal trattamento comunitario i filati di
    cotone, della voce 55.05 della tariffa doganale comune, categoria 1, originari
    del Messico e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/922/EEG: Beschikking van de Commissie van 11 september 1980 waarbij
    het Verenigd Koninkrijk wordt gemachtigd garens van katoen, van post 55.05 van
    het gemeenschappelijk douanetarief (categorie 1), van oorsprong uit Mexico en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
