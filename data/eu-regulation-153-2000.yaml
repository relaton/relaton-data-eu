  script: Latn
  content: Commission Regulation (EC) No 153/2000 of 24 January 2000 determining the
    extent to which applications lodged in January 2000 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 January to 31 March 2000
  type: main
- language: fr
  script: Latn
