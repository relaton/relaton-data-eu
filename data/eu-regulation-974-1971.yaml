  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 974/71 del Consiglio, del 12 maggio 1971, relativo
    a talune misure di politica congiunturale da adottare nel settore agricolo in
    seguito all' ampliamento temporaneo dei margini di fluttuazioni delle monete di
    taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 974/71 van de Raad van 12 mei 1971 betreffende bepaalde
