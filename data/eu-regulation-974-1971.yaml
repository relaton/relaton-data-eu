- language: en
  script: Latn
  content: Regulation (EEC) No 974/71 of the Council of 12 May 1971 on certain measures
    of conjunctural policy to be taken in agriculture following the temporary widening
    of the margins of fluctuation for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 974/71 du Conseil, du 12 mai 1971, relatif à certaines
    mesures de politique de conjoncture à prendre dans le secteur agricole à la
    suite de l' élargissement temporaire des marges de fluctuation des monnaies de
    certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 974/71 des Rates vom 12. Mai 1971 über bestimmte
    konjunkturpolitische Maßnahmen, die in der Landwirtschaft im Anschluß an die
    vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
    zu treffen sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 974/71 af 12. maj 1971 om visse konjunkturpolitiske
    foranstaltninger, der skal træffes inden for landbrugssektoren som følge af
    den midlertidige udvidelse af grænserne for kursudsving i visse medlemsstaters
    valutaer
  type: main
