  content: Commission Regulation (EEC) No 1747/85 of 26 June 1985 re-establishing
    the levying of customs duties on other vitamins falling within subheading 29.38
    B V, originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1747/85 de la Commission du 26 juin 1985 portant rétablissement
