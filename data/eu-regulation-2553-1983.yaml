title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2553/83 of 12 September 1983 re-establishing
    the levying of customs duties on gelatin and gelatin derivatives, falling within
    subheading 35.03 ex B and originating in Brazil, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2553/83 de la Commission du 12 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux gélatines
    et leurs dérivés, de la sous-position 35.03 ex B du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2553/83 der Kommission vom 12. September 1983 zur
    Wiedereinführung der Erhebung der Zölle für Gelatine und ihre Derivate der
    Tarifstelle 35.03 ex B, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2553/83 af 12. september 1983 om genindførelse
    af opkrævning af told for gelatine og derivater deraf, henhørende under pos.
    35.03 ex B og med oprindelse i Brasilien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2553/83 της Επιτροπής
    της 12ης Σεπτεμβρίου 1983 περί αποκαταστάσεως
    της εφαρμογής των δασμών για τις ζελατίνες
    και τα παράγωγα αυτών της διακρίσεως 35.03 ex Β
    του Κοινού Δασμολογίου, καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2553/83 della Commissione del 12 settembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili alle gelatine e ai loro
    derivati, della sottovoce 35.03 ex B della tariffa doganale comune, originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2553/83 van de Commissie van 12 september 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op gelatine en
    derivaten daarvan, van postonderverdeling 35.03 ex B, van oorsprong uit Brazilië,
    waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties
    zijn verleend
