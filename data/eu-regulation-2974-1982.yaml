    τής κλάσεως 28. 25 τού Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου τών προβλεπομένων από τόν
    κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2974/82 della Commissione, dell' 8 novembre 1982,
    che ripristina la riscossione dei dazi doganali applicabili agli ossidi di titanio
    della voce 28.25 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
