title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2974/82 of 8 November 1982 re-establishing
    the levying of customs duties on titanium oxides, falling within heading No 28.25
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2974/82 de la Commission, du 8 novembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux oxydes de
    titane, de la position 28.25 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2974/82 der Kommission vom 8. November 1982 zur Wiedereinführung
    der Erhebung der Zölle für Titanoxide der Tarifnummer 28.25, mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werdens
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2974/82 af 8. november 1982 om genindførelse
    af opkrævning af told for oxider af titan, henhørende under pos. 28.25 og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2974/82 τής Επιτροπής
