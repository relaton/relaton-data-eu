  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2456/88 della Commissione del 4 agosto 1988 che ripristina
    la riscossione dei dazi doganali applicabili alla biancheria da tavola, da toletta
    o da cucina, esclusa quella a maglia, della categoria di prodotti n. 39 (numero
    d' ordine 40.0390), originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2456/88 van de Commissie van 4 augustus 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tafellinnen,
    huishoudlinnen, ander dan van brei- of haakwerk, van de categorie van produkten
    nr. 39 (volgnummer 40.0390), van oorsprong uit India, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2456/88 da Comissão de 4 de Agosto de 1988 que
