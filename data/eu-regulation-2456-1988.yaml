title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2456/88 of 4 August 1988 re-establishing
    the levying of customs duties on table linen, toilet and kitchen linen, other
    than knitted or crocheted of category No 39 (code 40.0390) originating in India,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2456/88 de la Commission du 4 août 1988 portant rétablissement
    de la perception des droits de douane applicables au linge de table, de toilette
    ou de cuisine, autre que de bonneterie, de la catégorie de produits n° 39 (numéro
    d' ordre 40.0390) originaire de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2456/88 der Kommission vom 4. August 1988 zur Wiedereinführung
    des Zollsatzes für Tischwäsche, Wäsche zur Körperpflege und Haushaltswäsche,
    andere als aus Gewirken, der Warenkategorie Nr. 39 (lfd. Nr. 40.0390) mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2456/88 af 4. august 1988 om genindførelse
    af opkrævning af toldafgifter for dækketøj, håndklæder, vaskeklude, viskestykker
    og lignende køkkentekstiler, ikke af trikotage (kategori 39, løbenummer 40.0390),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
