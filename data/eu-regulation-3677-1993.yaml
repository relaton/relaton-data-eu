  content: COUNCIL REGULATION (EC) No 3677/93 of 20 December 1993 fixing, for 1994,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of Member States apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3677/93 du Conseil du 20 décembre 1993 fixant, pour
