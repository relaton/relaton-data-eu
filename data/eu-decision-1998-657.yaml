    1998 για την έγκριση του προγράμματος για την
    κατανομή στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1999 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στα πιο άπορα άτομα της Κοινότητας [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 3485]'
  type: main
- language: fi
  script: Latn
