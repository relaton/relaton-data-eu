title:
- language: en
  script: Latn
  content: '98/657/EC: Commission Decision of 12 November 1998 adopting the plan allocating
    to the Member States resources to be charged to the 1999 budget year for the supply
    of food from intervention stocks for the benefit of the most deprived persons
    in the Community (notified under document number C(1998) 3485)'
  type: main
- language: fr
  script: Latn
  content: '98/657/CE: Décision de la Commission du 12 novembre 1998 adoptant le
    plan portant attribution aux États membres de ressources imputables à l''exercice
    1999 pour l''exécution des fournitures de denrées alimentaires provenant des
    stocks d''intervention au bénéfice des personnes les plus démunies de la Communauté
    [notifiée sous le numéro C(1998) 3485]'
  type: main
- language: de
  script: Latn
  content: '98/657/EG: Entscheidung der Kommission vom 12. November 1998 zur Annahme
    des Programms zur Bewilligung von Mitteln, die den Mitgliedstaaten für die Lieferung
    von Nahrungsmitteln aus Interventionsbeständen zur Verteilung an Bedürftige
    in der Gemeinschaft zuzuteilen und im Haushaltsjahr 1999 zu verbuchen sind (Bekanntgegeben
    unter Aktenzeichen K(1998) 3485)'
  type: main
- language: da
  script: Latn
  content: '98/657/EF: Kommissionens beslutning af 12. november 1998 om vedtagelse
    af planen for tildeling til medlemsstaterne af midler, der skal afholdes over
    1999-budgettet, og som skal dække udgifterne til levering af levnedsmidler fra
    interventionslagre til de socialt dårligst stillede personer i Fællesskabet
    (meddelt under nummer K(1998) 3485)'
  type: main
- language: el
  script: Grek
