title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1112/92 of 30 April 1992 re-establishing
    the levying of customs duties on products falling within CN codes 6401 and 6402,
    originating in Malaysia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1112/92 de la Commission du 30 avril 1992 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 6401 et 6402, originaires de Malaysia, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1112/92 DER KOMMISSION vom 30. April 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 6401 und 6402 mit Ursprung
    in Malaysia, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1112/92 af 30. april 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6401 og 6402 og med
    oprindelse i Malaysia, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1112/92 της Επιτροπής
    της 30ής Απριλίου 1992 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    των κωδικών ΣΟ 6401 και 6402, καταγωγής Μαλαισίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1112/92 DELLA COMMISSIONE del 30 aprile 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 6401 e 6402 originari della Malaysia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1112/92 VAN DE COMMISSIE van 30 april 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 6401 en 6402, van oorsprong uit Maleisië, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1112/92 DA COMISSÃO de 30 de Abril de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos NC 6401
    e 6402, originários da Malásia, beneficiários das preferências pautais previstas
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1112/92 DE LA COMISIÓN de 30 de abril de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos de los códigos NC 6401 y 6402 originarios de Malasia, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90
    del Consejo #'
