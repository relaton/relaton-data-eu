title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2408/76 of 4 October 1976 re-establishing
    the levying of the customs duties on zinc oxide and zinc peroxide, falling within
    heading No 28.19, originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2408/76 de la Commission, du 4 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables à l'oxyde de
    zinc et au péroxyde de zinc, de la position tarifaire 28.19, originaires de la
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2408/76 der Kommission vom 4. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für Zinkoxid und Zinkperoxid der Tarifnummer 28.19 mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17.
    November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2408/76 af 4. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for oxid og peroxid af zink, under position 28.19,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2408/76 della Commissione, del 4 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili all'ossido di zinco e
    al perossido di zinco della voce doganale 28.19, originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2408/76 van de Commissie van 4 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zinkoxyde;
    zinkperoxyde, van post 28.19, van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
