    għal theddid ċibernetiku sinifikanti
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2025/301 van de Commissie van 23 oktober
    2024 tot aanvulling van Verordening (EU) 2022/2554 van het Europees Parlement
    en de Raad met betrekking tot technische reguleringsnormen voor de inhoud en termijnen
    van de eerste kennisgeving van en het tussentijdse en het eindverslag over ernstige
    ICT-gerelateerde incidenten en voor de inhoud van de vrijwillige kennisgeving
    van significante cyberdreigingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/301 z dnia 23 października
    2024 r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2022/2554
    w odniesieniu do regulacyjnych standardów technicznych określających treść
    i terminy przedłożenia wstępnego powiadomienia, sprawozdania śródokresowego
    i sprawozdania końcowego dotyczących poważnych incydentów związanych z ICT,
    a także treść dobrowolnego powiadomienia o znaczących cyberzagrożeniach
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/301 da Comissão, de 23 de outubro de 2024,
    que complementa o Regulamento (UE) 2022/2554 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação que especificam o conteúdo
    e os prazos para a notificação inicial e os relatórios intercalar e final sobre
    incidentes de caráter severo relacionados com as TIC, bem como o conteúdo da
    notificação voluntária de ciberameaças significativas
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/301 al Comisiei din 23 octombrie 2024 de
    completare a Regulamentului (UE) 2022/2554 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează conținutul
    și termenele pentru notificarea inițială privind incidentele majore legate
    de TIC și pentru raportul intermediar și raportul final aferente, precum și
    conținutul notificării voluntare privind amenințările cibernetice semnificative
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/301 z 23. októbra 2024, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2554, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa stanovuje obsah a lehoty
    na počiatočné oznámenie, a priebežnú a záverečnú správu o závažných
    incidentoch súvisiacich s IKT a obsah dobrovoľného oznamovania v prípade významných
    kybernetických hrozieb
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/301 z dne 23. oktobra 2024 o dopolnitvi
    Uredbe (EU) 2022/2554 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo vsebino in roke za začetno uradno obvestilo ter vmesno
    in končno poročilo o večjih incidentih, povezanih z IKT, ter vsebino prostovoljnega
    uradnega obvestila o pomembnih kibernetskih grožnjah
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/301 de la Comisión, de 23 de octubre de
    2024, por el que se completa el Reglamento (UE) 2022/2554 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    el contenido y los plazos para la notificación inicial y los informes intermedio
    y final sobre incidentes graves relacionados con las TIC, así como el contenido
    de la notificación voluntaria de ciberamenazas importantes
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/301 av den 23 oktober 2024
    om komplettering av Europaparlamentets och rådets förordning (EU) 2022/2554
    vad gäller tekniska tillsynsstandarder som specificerar innehåll och tidsfrister
    för den första anmälan av, delrapporten och slutrapporten om allvarliga IKT-relaterade
    incidenter samt innehållet i den frivilliga anmälan av betydande cyberhot
