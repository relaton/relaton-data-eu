    mórtheagmhais a bhaineann le TFC, agus maidir leis an tuarascáil idirmheánach
    agus chríochnaitheach ina leith, agus ábhar an fhógra dheonaigh i leith cibearbhagairtí
    suntasacha
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/301 оd 23. listopada 2024. o dopuni
    Uredbe (EU) 2022/2554 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuju sadržaj i rokovi za početnu obavijest, prijelazno
    i završno izvješće o značajnim IKT incidentima te sadržaj dobrovoljne obavijesti
    o ozbiljnim kiberprijetnjama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/301 felhatalmazáson alapuló rendelete (2024. október
    23.) az (EU) 2022/2554 európai parlamenti és tanácsi rendeletnek a jelentős
    IKT-vonatkozású eseményekről szóló kezdeti értesítés, időközi jelentés
    és zárójelentés tartalmát és határidejét, valamint a jelentős kiberfenyegetésekről
    szóló önkéntes értesítés tartalmát meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/301 della Commissione, del 23 ottobre 2024,
    che integra il regolamento (UE) 2022/2554 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano il contenuto
    e i termini della notifica iniziale, della relazione intermedia e della relazione
    finale per gli incidenti gravi connessi alle TIC nonché il contenuto della notifica
    volontaria per le minacce informatiche significative
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/301 (2024. gada 23. oktobris), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2022/2554 papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, kuros precizē sākotnējā paziņojuma,
    starpposma ziņojuma un gala ziņojuma par būtiskiem ar IKT saistītiem incidentiem,
    kā arī brīvprātīgā paziņojuma par būtiskiem kiberdraudiem saturu un termiņus
  type: main
- language: lt
  script: Latn
  content: 2024 m. spalio 23 d. Komisijos deleguotasis reglamentas (ES) 2025/301,
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2022/2554 papildomas techniniais
    reguliavimo standartais, kuriais nustatomas pradinio pranešimo, tarpinio pranešimo
    ir galutinio pranešimo apie didelius su IRT susijusius incidentus turinys ir
    pateikimo terminai, taip pat savanoriško pranešimo apie dideles kibernetines
    grėsmes turinys
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/301 tat-23 ta’ Ottubru 2024
    li jissupplimenta r-Regolament (UE) 2022/2554 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw il-kontenut u
    l-limiti ta’ żmien għan-notifika inizjali ta’ inċidenti kbar relatati mal-ICT,
