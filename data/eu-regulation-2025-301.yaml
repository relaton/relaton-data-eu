title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/301 of 23 October 2024 supplementing
    Regulation (EU) 2022/2554 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the content and time limits for the
    initial notification of, and intermediate and final report on, major ICT-related
    incidents, and the content of the voluntary notification for significant cyber
    threats
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/301 de la Commission du 23 octobre 2024
    complétant le règlement (UE) 2022/2554 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant le contenu et les délais
    pour la notification initiale des incidents majeurs liés aux TIC, et pour les
    rapports intermédiaire et final y afférents, et le contenu de la notification
    volontaire en ce qui concerne les cybermenaces importantes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/301 der Kommission vom 23. Oktober 2024
    zur Ergänzung der Verordnung (EU) 2022/2554 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung des Inhalts und
    der Fristen für die Erstmeldung, die Zwischenmeldung und die Abschlussmeldung
    schwerwiegender IKT-bezogener Vorfälle sowie des Inhalts der freiwilligen Meldung
    erheblicher Cyberbedrohungen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/301 на Комисията
    от 23 октомври 2024 година за допълнение на Регламент
    (ЕС) 2022/2554 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се определят съдържанието и сроковете
    за първоначалното уведомление и неокончателния
    и окончателния доклад за съществени инциденти
    с ИКТ, както и съдържанието на уведомлението
    на доброволен принцип за значителни киберзаплахи
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/301 ze dne 23. října
    2024, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2022/2554,
    pokud jde o regulační technické normy, jež stanoví obsah a lhůty pro prvotní
    oznámení a průběžnou a závěrečnou zprávu o závažných incidentech souvisejících
    s IKT a obsah dobrovolného oznámení o významných kybernetických hrozbách
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/301 af 23. oktober 2024 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2022/2554
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer indholdet
    af og fristerne for den indledende underretning, den foreløbige og endelige rapport
    om større IKT-relaterede hændelser og indholdet af den frivillige underretning
    om væsentlige cybertrusler
  type: main
- language: el
  script: Grek
