    ning vabatahtliku olulistest küberohtudest teatamise sisu
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2025/301, annettu 23 päivänä lokakuuta
    2024, Euroopan parlamentin ja neuvoston asetuksen (EU) 2022/2554 täydentämisestä
    laajavaikutteisia TVT:hen liittyviä poikkeamia koskevan alustavan ilmoituksen
    ja väli- ja loppuraportin sisältöä ja määräaikoja sekä merkittäviä kyberuhkia
    koskevan vapaaehtoisen ilmoituksen sisältöä täsmentävillä teknisillä sääntelystandardeilla
  type: main
- language: ga
  script: Latn
