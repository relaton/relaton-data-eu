id: EUDecision201461
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/61/EU: Commission Implementing Decision of 5 February 2014 extending
    the validity of Decision 2006/502/EC requiring Member States to take measures
    to ensure that only lighters which are child-resistant are placed on the market
    and to prohibit the placing on the market of novelty lighters (notified under
    document C(2014) 493)'
  type: main
- language: fr
  script: Latn
  content: '2014/61/UE: Décision d’exécution de la Commission du 5 février 2014
    prorogeant la validité de la décision 2006/502/CE exigeant des États membres
    qu’ils prennent des mesures destinées à faire en sorte que seuls les briquets
    présentant des caractéristiques de sécurité enfants soient mis sur le marché
    et à interdire la mise sur le marché de briquets fantaisie [notifiée sous le
    numéro C(2014) 493]'
  type: main
- language: de
  script: Latn
  content: '2014/61/EU: Durchführungsbeschluss der Kommission vom 5. Februar 2014
    zur Verlängerung der Geltungsdauer der Entscheidung 2006/502/EG zur Verpflichtung
    der Mitgliedstaaten, Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge
    in Verkehr gebracht werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten
    untersagt wird (Bekanntgegeben unter Aktenzeichen C(2014) 493)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/61/ЕС: Решение за изпълнение на Комисията
    от 5 февруари 2014 година за продължаване на валидността
    на Решение 2006/502/ЕО относно изискването към
    държавите членки да приемат мерки, за да гарантират,
    че на пазара се пускат единствено запалки,
    които са обезопасени спрямо деца, и да забранят
    пускането на пазара на запалки с нестандартен
    дизайн (нотифицирано под номер C(2014) 493)'
  type: main
- language: cs
  script: Latn
  content: '2014/61/EU: Prováděcí rozhodnutí Komise ze dne 5. února 2014 , kterým
    se prodlužuje platnost rozhodnutí 2006/502/ES, kterým se po členských státech
    žádá, aby přijaly opatření zajišťující, aby se na trh uváděly pouze
    zapalovače, které jsou odolné dětem, a zakázaly uvádět na trh zapalovače
    neobvyklého typu (novelty) (oznámeno pod číslem C(2014) 493)'
  type: main
- language: da
  script: Latn
  content: '2014/61/EU: Kommissionens gennemførelsesafgørelse af 5. februar 2014
    om forlængelse af gyldigheden af beslutning 2006/502/EF om et krav til medlemsstaterne
    om at træffe foranstaltninger til at sikre, at der kun markedsføres børnesikrede
    lightere, og forbyde markedsføringen af lightere, der kan henføres under kategorien
    gadgets (meddelt under nummer C(2014) 493)'
  type: main
- language: el
  script: Grek
  content: '2014/61/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 5ης Φεβρουαρίου 2014 , για παράταση της ισχύος
    της απόφασης 2006/502/ΕΚ, που απαιτεί από τα κράτη
    μέλη, αφενός, να λάβουν μέτρα ώστε να εξασφαλίσουν
    ότι θα διατίθενται στην αγορά μόνο αναπτήρες
    ασφαλείς για τα παιδιά και, αφετέρου, να απαγορεύσουν
    τη διάθεση φαντεζί αναπτήρων στην αγορά [κοινοποιηθείσα
    υπό τον αριθμό C(2014) 493]'
  type: main
- language: et
  script: Latn
  content: '2014/61/EL: Komisjoni rakendusotsus, 5. veebruar 2014 , otsuse 2006/502/EÜ
    (millega nõutakse liikmesriikidelt meetmete võtmist, et tagada üksnes lastekindlate
    tulemasinate turuleviimine ning keelustada uudsete tulemasinate turuleviimine)
