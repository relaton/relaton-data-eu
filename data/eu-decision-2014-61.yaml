  type: main
- language: mt
  script: Latn
  content: '2014/61/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tal- 5
    ta’ Frar 2014 li testendi l-validità tad-Deċiżjoni 2006/502/KE li tirrikjedi
    li l-Istati Membri jieħdu miżuri sabiex jiżguraw li l-lajters li jitqiegħdu
    fis-suq ikunu biss dawk reżistenti għat-tfal u li jipprojbixxu t-tqegħid fis-suq
    tal-lajters magħrufa bħala novelty lighters (notifikata bid-dokument C(2014)
    493)'
  type: main
- language: nl
  script: Latn
  content: '2014/61/EU: Uitvoeringsbesluit van de Commissie van 5 februari 2014 tot
    verlenging van de geldigheidsduur van Beschikking 2006/502/EG waarbij de lidstaten
    worden verplicht maatregelen te treffen om ervoor te zorgen dat uitsluitend kinderveilige
    aanstekers op de markt worden gebracht en dat het op de markt brengen van novelty
    lighters wordt verboden (Kennisgeving geschied onder nummer C(2014) 493)'
  type: main
- language: pl
  script: Latn
  content: '2014/61/UE: Decyzja wykonawcza Komisji z dnia 5 lutego 2014 r. przedłużająca
    obowiązywanie decyzji 2006/502/WE zobowiązującej państwa członkowskie do
    podjęcia środków w celu zapewnienia, by na rynek wprowadzane były wyłącznie
    zapalniczki zabezpieczone przed uruchomieniem przez dzieci, oraz w celu zakazania
    wprowadzania na rynek zapalniczek-gadżetów (notyfikowana jako dokument nr C(2014)
    493)'
  type: main
- language: pt
  script: Latn
  content: '2014/61/UE: Decisão de Execução da Comissão, de 5 de fevereiro de
    2014 , que prorroga a validade da Decisão 2006/502/CE que obriga os Estados-Membros
    a tomar as medidas necessárias para garantir que no mercado apenas se colocam
    isqueiros seguros para as crianças e a proibir a colocação no mercado de isqueiros
    novidade ( novelty lighters ) [notificada com o número C(2014) 493]'
  type: main
- language: ro
  script: Latn
  content: '2014/61/UE: Decizia de punere în aplicare a Comisiei din 5 februarie
    2014 de prelungire a valabilității Deciziei 2006/502/CE de obligare a statelor
    membre să adopte măsuri prin care să se asigure că nu se pot introduce pe
    piață decât brichete cu caracteristici de siguranță pentru copii și să
    interzică introducerea pe piață a brichetelor fantezie [notificată cu numărul
    C(2014) 493]'
  type: main
- language: sk
  script: Latn
  content: '2014/61/EÚ: Vykonávacie rozhodnutie Komisie z 5. februára 2014 o predĺžení
    platnosti rozhodnutia 2006/502/ES, ktorým sa členské štáty vyzývajú prijať
    opatrenia s cieľom zabezpečiť, aby sa na trh uvádzali iba zapaľovače, ktoré
    sú zabezpečené proti použitiu deťmi, a zakázať uvádzanie zábavných zapaľovačov
    na trh [oznámené pod číslom C(2014) 493]'
  type: main
- language: sl
  script: Latn
  content: '2014/61/EU: Izvedbeni sklep Komisije z dne 5. februarja 2014 o podaljšanju
