    történt)'
  type: main
- language: it
  script: Latn
  content: '2014/61/UE: Decisione di esecuzione della Commissione, del 5 febbraio
    2014 , che proroga la validità della decisione 2006/502/CE, che prescrive agli
    Stati membri di adottare provvedimenti per assicurare che siano immessi sul mercato
    esclusivamente accendini a prova di bambino e di proibire la commercializzazione
    di accendini fantasia [notificata con il numero C(2014) 493]'
  type: main
- language: lv
  script: Latn
  content: '2014/61/ES: Komisijas Īstenošanas lēmums ( 2014. gada 5. februāris
    ), ar kuru pagarina spēkā esības termiņu Lēmumam 2006/502/EK, ar ko dalībvalstīm
    pieprasa veikt pasākumus, kas atļautu tirgot tikai bērniem drošas šķiltavas
    un aizliegtu tirgot jaunrades šķiltavas (izziņots ar dokumenta numuru C(2014)
    493)'
  type: main
- language: lt
  script: Latn
  content: '2014/61/ES: 2014 m. vasario 5 d. Komisijos įgyvendinimo sprendimas, kuriuo
    pratęsiamas Sprendimo 2006/502/EB, reikalaujančio, kad valstybės narės imtųsi
    priemonių, siekdamos užtikrinti, jog rinkoje būtų platinami tik apsaugą nuo
    vaikų turintys žiebtuvėliai, ir uždrausti pateikti į rinką suvenyrinius
