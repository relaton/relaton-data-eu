  content: Decizia Comisiei din 18 noiembrie 2004 de acordare anumitor părți a unei
    scutiri de la extinderea pentru anumite piese componente de biciclete originare
    din Republica Populară Chineză, prin Regulamentul (CE) nr. 71/97 al Consiliului,
    a dreptului antidumping instituit prin Regulamentul (CEE) nr. 2474/93 al Consiliului
    și menținute de Regulamentul (CE) nr. 1524/2000 al Consiliului și de ridicare
    a suspendării de la plata dreptului antidumping extins la anumite piese componente
    de biciclete originare din Republica Populară Chineză, acordate anumitor părți
    în conformitate cu Regulamentul (CE) nr. 88/97 [notificată cu numărul C(2004)
    4383]
