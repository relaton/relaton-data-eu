title:
- language: en
  script: Latn
  content: '2004/776/EC: Commission Decision of 18 November 2004 granting certain
    parties an exemption from the extension to certain bicycle parts, by Council Regulation
    (EC) No 71/97, of the anti-dumping duty on bicycles originating in the People’s
    Republic of China imposed by Council Regulation (EEC) No 2474/93, and maintained
    by Council Regulation (EC) No 1524/2000, and lifting the suspension of the payment
    of the anti-dumping duty extended to certain bicycle parts originating in the
    People’s Republic of China granted to certain parties pursuant to Commission
    Regulation (EC) No 88/97 (notified under document number C(2004) 4383)'
  type: main
- language: fr
  script: Latn
  content: '2004/776/CE: Décision de la Commission du 18 novembre 2004 exemptant
    certaines parties de l''extension à certaines parties de bicyclettes originaires
    de la République populaire de Chine, par le règlement (CE) n° 71/97 du Conseil,
    du droit antidumping institué par le règlement (CEE) n° 2474/93 du Conseil
    et maintenu par le règlement (CE) n° 1524/2000 du Conseil, et levant la suspension
    du paiement du droit antidumping étendu à certaines parties de bicyclettes originaires
    de la République populaire de Chine accordée à certaines parties en vertu du
    règlement (CE) n° 88/97 [notifiée sous le numéro C(2004) 4383]'
  type: main
- language: de
  script: Latn
  content: '2004/776/EG: Entscheidung der Kommission vom 18. November 2004 zur Befreiung
    bestimmter Parteien von dem mit der Verordnung (EWG) Nr. 2474/93 des Rates eingeführten,
    mit der Verordnung (EG) Nr. 71/97 des Rates auf die Einfuhren bestimmter Fahrradteile
    ausgeweiteten und mit der Verordnung (EG) Nr. 1524/2000 des Rates aufrechterhaltenen
    Antidumpingzoll und zur Aufhebung der gemäß der Verordnung (EG) Nr. 88/97 erfolgten
    Aussetzung der Entrichtung des auf bestimmte Parteien auf bestimmte Fahrradteile
    mit Ursprung in der Volksrepublik China ausgeweiteten Antidumpingzolls (Bekannt
    gegeben unter Aktenzeichen K(2004) 4383)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 18 ноември 2004 година
    за освобождаване на определени страни от обхвата
    на разширеното върху определени велосипедни
    части посредством Регламент (ЕО) № 71/97 на Съвета
    антидъмпингово мито, първоначално наложено
    върху вноса на велосипеди с произход от Китайската
    народна република с Регламент (ЕИО) № 2474/93 на
    Съвета и оставено в сила от Регламент (ЕО) №
    1524/2000 на Съвета, и за отмяна на правото на спиране
    на антидъмпинговото мито по вноса на велосипедни
    части с произход от Китайската народна република,
    предоставено на определени страни съгласно
    Регламент (ЕО) № 88/97 на Комисията (нотифицирано
    под номер С(2004) 4383)
  type: main
- language: cs
  script: Latn
  content: '2004/776/ES: Rozhodnutí Komise ze dne 18. listopadu 2004, kterým se
    některé strany osvobozují od antidumpingového cla z jízdních kol pocházejících
    z Čínské lidové republiky uloženého nařízením Rady (EHS) č. 2474/93
    a zachovaného nařízením Rady (ES) č. 1524/2000, jež bylo nařízením Rady
    (ES) č. 71/97 rozšířeno na některé části a součásti jízdních kol,
    a kterým se zrušuje pozastavení platby antidumpingového cla rozšířeného
    na některé části a součásti jízdních kol pocházejících z Čínské
    lidové republiky, jež bylo některým stranám přiznáno nařízením Komise
    (ES) č. 88/97 (oznámeno pod číslem K(2004) 4383)'
  type: main
- language: da
  script: Latn
  content: '2004/776/EF: Kommissionens beslutning af 18. november 2004 om indrømmelse
