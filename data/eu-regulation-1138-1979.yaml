title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1138/79 of 8 June 1979 fixing the quantities
    of frozen beef intended for processing which may be imported on special conditions
    for the second and third quarters of 1979 and repealing Regulations (EEC) No 2900/77
    and (EEC) No 535/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1138/79 de la Commission, du 8 juin 1979, fixant les
    quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour les deuxième et troisième
    trimestres 1979 et abrogeant les règlements (CEE) n° 2900/77 et (CEE) n° 535/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1138/79 der Kommission vom 8. Juni 1979 zur Festsetzung
    der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die für das
    zweite und dritte Vierteljahr 1979 unter Sonderbedingungen eingeführt werden
    dürfen, und zur Aufhebung der Verordnungen (EWG) Nr. 2900/77 und (EWG) Nr. 535/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1138/79 af 8. juni 1979 om fastsættelse
    af de mængder frosset oksekød til forarbejdning, der kan indføres på særlige
    vilkår for andet og tredje kvartal af 1979, og om ophævelse af forordning (EØF)
    nr. 2900/77 og (EØF) nr. 535/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1138/79 della Commissione, dell' 8 giugno 1979, che
    fissa le quantità di carni bovine congelate destinate alla trasformazione che
    possono essere importate a condizioni speciali per il secondo e terzo trimestre
    1979 e abroga i regolamenti (CEE) n. 2900/77 e (CEE) n. 535/79
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1138/79 van de Commissie van 8 juni 1979 tot vaststelling
    van de hoeveelheden bevroren rundvlees voor verwerking die in het tweede en derde
    kwartaal van 1979 op bijzondere voorwaarden kunnen worden ingevoerd, en houdende
    intrekking van de Verordeningen (EEG) nr. 2900/77 en (EEG) nr. 535/79
  type: main
