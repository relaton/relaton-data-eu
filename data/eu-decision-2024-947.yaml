    Europeană către Islanda în scopul prevenirii, depistării, investigării și
    urmăririi penale a infracțiunilor de terorism și a infracțiunilor grave
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/947 zo 4. marca 2024 o poverení začať rokovania
    s Islandom o dohode medzi Európskou úniou a Islandom o prenose údajov zo záznamov
    o cestujúcich (PNR) z Európskej únie na Island na účely prevencie, odhaľovania,
