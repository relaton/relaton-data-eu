    престъпления и тежки престъпления
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/947 ze dne 4. března 2024 o zmocnění k zahájení
    jednání s Islandem o dohodě mezi Evropskou unií a Islandem o předávání
    údajů jmenné evidence cestujících (PNR) z Evropské unie na Island za účelem
    prevence, odhalování, vyšetřování a stíhání teroristických trestných
    činů a závažné trestné činnosti
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2024/947 af 4. marts 2024 om bemyndigelse til at
