    činnosti
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/947 z dne 4. marca 2024 o pooblastilu za začetek
    pogajanj z Islandijo o sporazumu med Evropsko unijo in Islandijo o prenosu podatkov
    iz evidence podatkov o potnikih (PNR) iz Evropske unije v Islandijo za preprečevanje,
