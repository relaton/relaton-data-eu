    podataka iz evidencije podataka o putnicima (PNR) iz Europske unije Islandu radi
    sprečavanja, otkrivanja, istrage i kaznenog progona kaznenih djela terorizma
    i teških kaznenih djela
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2024/947 határozata (2024. március 4.) az Európai Unió
    és Izland közötti, az utasnyilvántartási adatállomány (PNR) adatainak a
    terrorista bűncselekmények és a súlyos bűncselekmények megelőzése, felderítése,
    nyomozása és a vádeljárás lefolytatása céljából az Európai Unióból
    Izland részére történő továbbításáról szóló megállapodásra irányuló
    tárgyalások Izlanddal történő megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/947 del Consiglio, del 4 marzo 2024, che autorizza
    l’avvio di negoziati con l’Islanda per un accordo tra l’Unione europea e
    l’Islanda sul trasferimento dei dati del codice di prenotazione (Passenger Name
    Record – PNR) dall’Unione europea all’Islanda a fini di prevenzione, accertamento,
    indagine e azione penale nei confronti dei reati di terrorismo e dei reati gravi
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2024/947 (2024. gada 4. marts), ar ko pilnvaro sākt
    sarunas ar Islandi par nolīgumu starp Eiropas Savienību un Islandi par pasažieru
    datu reģistra (PDR) datu pārsūtīšanu no Eiropas Savienības uz Islandi teroristu
    nodarījumu un smagu noziegumu novēršanai, atklāšanai, izmeklēšanai un saukšanai
    pie atbildības par tiem
  type: main
- language: lt
  script: Latn
  content: 2024 m. kovo 4 d. Tarybos sprendimas (ES) 2024/947, kuriuo suteikiami įgaliojimai
    pradėti derybas su Islandija dėl Europos Sąjungos ir Islandijos susitarimo
    dėl keleivio duomenų įrašo (PNR) duomenų perdavimo iš Europos Sąjungos
    į Islandiją teroristinių nusikaltimų ir sunkių nusikaltimų prevencijos,
    nustatymo, tyrimo ir patraukimo už juos baudžiamojon atsakomybėn tikslais
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/947 tal-4 ta’ Marzu 2024 li tawtorizza
    l-ftuħ ta' negozjati mal-Iżlanda għal ftehim bejn l-Unjoni Ewropea u l-Iżlanda
    dwar it-trasferiment ta' data tar-Reġistru tal-Ismijiet tal-Passiġġieri (PNR)
    mill-Unjoni Ewropea lill-Iżlanda għall-prevenzjoni, l-iskoperta, l-investigazzjoni
    u l-prosekuzzjoni ta' reati terroristiċi u kriminalità serja
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2024/947 van de Raad van 4 maart 2024 houdende machtiging
    tot het openen van onderhandelingen met IJsland over een overeenkomst tussen de
    Europese Unie en IJsland inzake de doorgifte van persoonsgegevens van passagiers
    (PNR-gegevens) van de Europese Unie aan IJsland met het oog op het voorkomen,
    opsporen, onderzoeken en vervolgen van terroristische misdrijven en ernstige criminaliteit
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2024/947 z dnia 4 marca 2024 r. upoważniająca do rozpoczęcia
