title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/947 of 4 March 2024 authorising the opening
    of negotiations with Iceland for an agreement between the European Union and Iceland
    on the transfer of Passenger Name Record (PNR) data from the European Union to
    Iceland for the prevention, detection, investigation and prosecution of terrorist
    offences and serious crime
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/947 du Conseil du 4 mars 2024 autorisant l’ouverture
    de négociations avec l’Islande en vue d’un accord entre l’Union européenne
    et l’Islande sur le transfert de données des dossiers passagers (PNR) depuis
    l’Union européenne vers l’Islande pour la prévention et la détection des
    infractions terroristes et des formes graves de criminalité, ainsi que pour les
    enquêtes et les poursuites en la matière
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/947 des Rates vom 4. März 2024 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit Island über ein Abkommen zwischen der Europäischen
    Union und Island über die Übermittlung von Fluggastdatensätzen (PNR-Daten)
    aus der Europäischen Union an Island zum Zwecke der Verhütung, Aufdeckung, Ermittlung
    und Verfolgung von terroristischen Straftaten und schwerer Kriminalität
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/947 на Съвета от 4 март 2024 година
    за разрешаване на започването на преговори
