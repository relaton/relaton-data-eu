title:
- language: fr
  script: Latn
  content: Décision 64/487/CEE de la Commission, du 28 juillet 1964, portant nouvelle
    modification de sa décision, du 5 novembre 1963, autorisant la perception d'une
    taxe compensatoire sur les importations, en République fédérale d'Allemagne,
    de pain en provenance des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '64/487/EWG: Entscheidung der Kommission vom 28. Juli 1964 zur erneuten
    Änderung ihrer Entscheidung vom 5. November 1963 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Brot aus dem Königreich der Niederlande in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/487/CEE: Decisione della Commissione, del 28 luglio 1964, recante nuova
    modifica alla decisione della Commissione del 5 novembre 1963 con cui si autorizza
    la Repubblica federale di Germania a riscuotere una tassa di compensazione sulle
    importazioni di pane in provenienza dai Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '64/487/EEG: Beschikking van de Commissie van 28 juli 1964 houdende nieuwe
    wijziging van haar beschikking van 5 november 1963 waarbij machtiging werd verleend
    tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van brood uit het Koninkrijk der Nederlanden'
  type: main
