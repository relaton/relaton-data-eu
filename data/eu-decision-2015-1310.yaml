title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/1310 of 28 July 2015 amending
    Annex I to Decision 2009/177/EC as regards disease-free status for the whole territory
    of Croatia for koi herpes virus (KHV) disease
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/1310 de la Commission du 28 juillet 2015
    modifiant l'annexe I de la décision 2009/177/CE en ce qui concerne le statut
    «indemne de la maladie» de l'ensemble du territoire de la Croatie pour l'herpèsvirose
    de la carpe koï
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/1310 der Kommission vom 28. Juli 2015
    zur Änderung des Anhangs I der Entscheidung 2009/177/EG in Bezug auf den Seuchenfreiheitsstatus
    des gesamten Hoheitsgebiets Kroatiens hinsichtlich der Koi-Herpes-Viruserkrankung
    (KHV)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/1310 на Комисията
    от 28 юли 2015 година за изменение на приложение
    I към Решение 2009/177/ЕО по отношение на статута
    на свободна от болест за цялата територия на
    Хърватия във връзка с кой-херпесвирусна болест
    по шарана
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/1310, ze dne 28. července 2015,
    kterým se mění příloha I rozhodnutí 2009/177/ES, pokud jde o status celého
    území Chorvatska jako prostého nákazy pro herpesvirózu Koi (KHV)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/1310 af 28. juli 2015
    om ændring af bilag I til beslutning 2009/177/EF for så vidt angår status som
    sygdomsfri for hele Kroatien med hensyn til koi-herpesvirussygdom (KHV)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/1310 της Επιτροπής,
    της 28ης Ιουλίου 2015, για την τροποποίηση του
    παραρτήματος I της απόφασης 2009/177/ΕΚ όσον αφορά
    τον χαρακτηρισμό ολόκληρης της επικράτειας
    της Κροατίας ως απαλλαγμένης από τη λοίμωξη
    του κυπρίνου Koi από ερπητοϊό (νόσος KHV)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/1310, 28. juuli 2015, millega muudetakse
    otsuse 2009/177/EÜ I lisa seoses kogu Horvaatia territooriumile karpkalade herpesviirusest
    (KHV) vaba staatuse andmisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/1310, annettu 28 päivänä
    heinäkuuta 2015, päätöksen 2009/177/EY liitteen I muuttamisesta siltä osin
    kuin on kyse taudista vapaan aseman myöntämisestä Kroatian koko alueelle koikarpin
    herpesviruksen (KHV-taudin) osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/1310 оd 28. srpnja 2015. o izmjeni
    Priloga I. Odluci 2009/177/EZ s obzirom na status slobodno od bolesti za cijelo
    državno područje Hrvatske u pogledu Koi herpes viroze (KHV)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/1310 végrehajtási határozata (2015. július 28.)
    a 2009/177/EK határozat I. mellékletének Horvátország teljes területének
    koi-herpeszvírusbetegségtől (KHV-betegségtől) mentes minősítése tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/1310 della Commissione, del 28 luglio
    2015, che modifica l'allegato I della decisione 2009/177/CE per quanto riguarda
    lo status di indenne dalla malattia da virus erpetico della carpa Koi (KHV) di
    tutto il territorio della Croazia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/1310 (2015. gada 28. jūlijs),
    ar ko groza Lēmuma 2009/177/EK I pielikumu attiecībā uz slimības neskartas
    teritorijas statusu visai Horvātijas teritorijai attiecībā uz koi herpesvīrusu
    (KHV)
  type: main
- language: lt
  script: Latn
  content: 2015 m. liepos 28 d. Komisijos įgyvendinimo sprendimas (ES) 2015/1310,
    kuriuo dėl Koi herpes virusine (KHV) liga neužkrėstos teritorijos statuso suteikimo
    visai Kroatijos teritorijai iš dalies keičiamas Sprendimo 2009/177/EB I priedas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/1310 tat-28
    ta' Lulju 2015 li temenda l-Anness I tad-Deċiżjoni 2009/177/KE dwar l-istatus
    ta' mingħajr mard għat-territorju kollu tal-Kroazja fir-rigward tal-marda tal-vajrus
    tal-erpete tal-koi (KHV)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/1310 van de Commissie van 28 juli 2015 tot
    wijziging van bijlage I bij Beschikking 2009/177/EG wat betreft de status van
    het gehele grondgebied van Kroatië als van het koiherpesvirus (KHV) vrij gebied
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/1310 z dnia 28 lipca 2015 r. zmieniająca
    załącznik I do decyzji 2009/177/WE w odniesieniu do statusu obszaru wolnego
    od choroby w przypadku całego terytorium Chorwacji dla zakażenia herpeswirusem
    koi (KHV)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/1310 da Comissão, de 28 de julho de 2015,
    que altera o anexo I da Decisão 2009/177/CE no que diz respeito ao estatuto de
    indemnidade de doença para a totalidade do território da Croácia relativamente
    à herpesvirose da carpa-koi (KHV)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/1310 a Comisiei din 28 iulie 2015
    de modificare a anexei I la Decizia 2009/177/CE în ceea ce privește statutul
    „indemn de boală” al întregului teritoriu al Croației pentru boala provocată
    de virusul herpetic al crapului koi (KHV)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/1310 z 28. júla 2015, ktorým
    sa mení príloha I k rozhodnutiu 2009/177/ES, pokiaľ ide o štatút celého
    územia Chorvátska ako územia bez výskytu herpesvirózy kaprov koi (KHV)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/1310 z dne 28. julija 2015 o spremembi
    Priloge I k Odločbi 2009/177/ES v zvezi s statusom brez bolezni za celotno ozemlje
    Hrvaške za bolezen, ki jo povzroča Koi herpes virus (KHV)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/1310 de la Comisión, de 28 de julio
    de 2015, por la que se modifica el anexo I de la Decisión 2009/177/CE en lo que
    respecta a la calificación de «libre de la enfermedad» de todo el territorio
    de Croacia en relación con la herpesvirosis koi (HVK)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/1310 av den 28 juli 2015 om
    ändring av bilaga I till beslut 2009/177/EG vad gäller sjukdomsfri status för
    hela Kroatiens territorium i fråga om koiherpesvirus (KHV)
