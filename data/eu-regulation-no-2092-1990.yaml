  script: Latn
  content: Commission Regulation (EEC) No 2092/90 of 20 July 1990 determining the
    extent to which applications lodged in July 1990 for import licences for certain
    pigmeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2092/90 de la Commission, du 20 juillet 1990, déterminant
