title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 359/81 of 11 February 1981 reintroducing
    the levying of customs duties applicable to fabric and other articles of asbestos,
    falling within subheadings 68.13 B II and III and originating in South Korea,
    benefiting from the tariff preferences provided for by Council Regulation (EEC)
    No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 359/81 de la Commission, du 11 février 1981, portant
    rétablissement de la perception des droits de douane applicables aux tissus et
    autres ouvrages en amiante, des sous-positions 68.13 B II et 68.13 B III du tarif
    douanier commun, originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 359/81 der Kommission vom 11. Februar 1981 zur Wiedereinführung
    der Erhebung der Zölle für Gewebe und andere Waren aus Asbest der Tarifstellen
    68.13 B II und III, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 359/81 af 11. februar 1981 om genindførelse
    af opkrævning af told for vævet stof og andre varer af asbest henhørende under
    pos. 68.13 B II og III med oprindelse i Sydkorea, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 359/81 τής Επιτροπής
    τής 11ης Φεβρουαρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τών δασμών γιά τά υφάσματα καί
    έτερα τεχνουργήματα εξ αμιάντου τών δασμολογικών
    διακρίσεων 68. 13 Β ΙΙ, ΙΙΙ καταγωγής Νοτίου Κορέας,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 359/81 della Commissione, dell' 11 febbraio 1981,
    che ripristina la riscossione dei dazi doganali applicabili ai tessuti ed altri
    lavori di amianto, delle sottovoci 68.13 B II e III della tariffa doganale comune,
    originari della Corea del Sud, che beneficiano delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 359/81 van de Commissie van 11 februari 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op weefsels en
    andere werken van asbest van postonderverdeling 68.13 B II, III, van oorsprong
    uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad vermelde
    tariefpreferenties zijn verleend
