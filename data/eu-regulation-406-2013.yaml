  script: Latn
  content: Commission Implementing Regulation (EU) No 406/2013 of 2 May 2013 amending
    the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance prednisolone
  type: main
- language: fr
  script: Latn
