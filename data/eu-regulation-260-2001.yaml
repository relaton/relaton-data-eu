title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 260/2001 of 8 February 2001 replacing the
    Annex to Council Regulation (EEC) No 3677/90 laying down measures to be taken
    to discourage the diversion of certain substances to the illicit manufacture of
    narcotic drugs and psychotropic substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 260/2001 de la Commission du 8 février 2001 remplaçant
    l'annexe du règlement (CEE) n° 3677/90 du Conseil relatif aux mesures à prendre
    afin d'empêcher le détournement de certaines substances pour la fabrication
    illicite de stupéfiants ou de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 260/2001 der Kommission vom 8. Februar 2001 zur Ersetzung
    des Anhangs der Verordnung (EWG) Nr. 3677/90 des Rates über Maßnahmen gegen
    die Abzweigung bestimmer Stoffe zur unerlaubten Herstellung von Suchtstoffen und
    psychotropen Substanzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 260/2001 af 8. februar 2001 til Rådets
    forordning (EØF) nr. 3677/90 om foranstaltninger til modvirkning af ulovlig anvendelse
    af visse stoffer til fremstilling af narkotika og psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 260/2001 της Επιτροπής,
    της 8ης Φεβρουαρίου 2001, που αντικαθιστά το παράρτημα
    του κανονισμού (ΕΟΚ) αριθ. 3677/90 του Συμβουλίου
    για τη θέσπιση μέτρων για την πρόληψη της διοχέτευσης
    ορισμένων ουσιών στην παράνομη παρασκευή ναρκωτικών
    και ψυχοτρόπων ουσιών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 260/2001, annettu 8 päivänä helmikuuta 2001,
    toimenpiteistä tiettyjen aineiden kulkeutumisen estämiseksi huumausaineiden
    tai psykotrooppisten aineiden laittomaan valmistukseen annetun neuvoston asetuksen
    (ETY) N:o 3677/90 liitteen korvaamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 260/2001 della Commissione, dell'8 febbraio 2001, che
    sostituisce l'allegato del regolamento (CEE) n. 3677/90 del Consiglio recante
    misure intese a scoraggiare la diversione di talune sostanze verso la fabbricazione
    illecita di stupefacenti o di sostanze psicotrope
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 260/2001 van de Commissie van 8 februari 2001 houdende
    vervanging van de bĳlage bĳ Verordening (EEG) nr. 3677/90 van de Raad houdende
    maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 260/2001 da Comissão, de 8 de Fevereiro de 2001,
    que substitui o anexo do Regulamento (CEE) n.° 3677/90 do Conselho, que estabelece
    as medidas a adoptar para evitar o desvio de determinadas substâncias para o
    fabrico ilegal de estupefacientes e de substâncias psicotrópicas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 260/2001 de la Comisión, de 8 de febrero de 2001,
    por el que se sustituye el anexo del Reglamento (CEE) n° 3677/90 del Consejo
    relativo a las medidas que deben adoptarse para impedir el desvío de determinadas
    sustancias para la fabricación ilícita de estupefacientes y de sustancias psicotrópicas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 260/2001 av den 8 februari 2001 till
    rådets förordning (EEG) nr 3677/90 om åtgärder för att försvåra avledningen
    av vissa ämnen för olaglig framställning av narkotika och psykotropa ämnen
  type: main
