title:
- language: en
  script: Latn
  content: '95/183/EC: Commission Decision of 24 May 1995 amending Commission Decision
    93/402/EEC concerning animal health conditions and veterinary certification for
    imports of fresh meat from certain South American countries, in order to take
    account of information concerning the States of São Paulo and Minas Gerais (Brazil)'
  type: main
- language: fr
  script: Latn
  content: '95/183/CE: Décision de la Commission du 24 mai 1995 modifiant la décision
    93/402/CEE concernant les conditions de police sanitaire et la certification vétérinaire
    requises à l''importation de viandes fraîches en provenance de certains pays
    d''Amérique du Sud, en vue de tenir compte de certains éléments concernant
    les États de São Paulo et Minas Gerais (Brésil)'
  type: main
- language: de
  script: Latn
  content: '95/183/EG: ENTSCHEIDUNG DER KOMMISSION vom 24. Mai 1995 zur Änderung
    der Entscheidung 93/402/EWG über die Veterinärbedingungen und Veterinärzeugnisse
    für die Einfuhr von frischem Fleisch aus bestimmten südamerikanischen Ländern
    hinsichtlich der brasilianischen Bundesstaaten São Paulo und Minas Gerais'
  type: main
- language: da
  script: Latn
  content: '95/183/EF: KOMMISSIONENS BESLUTNING af 24. maj 1995 om ændring af beslutning
    93/402/EØF om dyresundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika for at tage hensyn
    til forhold vedrørende staterne São Paulo og Minas Gerais (Brasilien)'
  type: main
- language: el
  script: Grek
  content: '95/183/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 24ης Μαΐου
    1995 για τροποποίηση της απόφασης 93/402/ΕΟΚ σχετικά
    με τους όρους υγειονομικού ελέγχου και την
    κτηνιατρική πιστοποίηση που απαιτούνται κατά
    την εισαγωγή νωπών κρεάτων προελεύσεως ορισμένων
    χωρών της Νοτίου Αμερικής, για να ληφθούν υπόψη
    ορισμένα στοιχεία που αφορούν τις πολιτείες,
    Sγo Paulo και Minas Gerais (Βραζιλία)'
  type: main
- language: fi
  script: Latn
  content: '95/183/EY: Komission päätös, tehty 24 päivänä toukokuuta 1995, tuonnissa
    tietyistä Etelä-Amerikan maista tehdyn komission päätöksen 93/402/ETY muuttamisesta
    tiettyjen Brasilian Goiasin, São Paulon ja Minas Geraisin osavaltioita koskevien
    seikkojen huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '95/183/CE: DECISIONE DELLA COMMISSIONE del 24 maggio 1995 che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l'' importazione di carni fresche
    provenienti da taluni paesi dell'' America del Sud, per tener conto della situazione
    sanitaria negli Stati di São Paulo e Minas Gerais (Brasile)'
  type: main
- language: nl
  script: Latn
  content: '95/183/EG: BESCHIKKING VAN DE COMMISSIE van 24 mei 1995 tot wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika
    om rekening te houden met bepaalde elementen inzake de staten São Paulo en Minas
    Gerais (Brazilië) (Voor de EER-relevante tekst)'
  type: main
- language: pt
  script: Latn
  content: '95/183/CE: DECISÃO DA COMISSÃO de 24 de Maio de 1995 que altera a Decisão
    93/402/CEE relativa às condições de polícia sanitária e à certificação
    veterinária requeridas para a importação de carne fresca proveniente de determinados
    países da América do Sul, com vista a ter em conta determinados elementos relativos
    aos Estados de São Paulo e Minas Gerais (Brasil)'
  type: main
- language: es
  script: Latn
  content: '95/183/CE: DECISIÓN DE LA COMISIÓN de 24 de mayo de 1995 por la que
