  script: Latn
  content: Commission Regulation (EC) No 896/2001 of 7 May 2001 laying down detailed
    rules for applying Council Regulation (EEC) No 404/93 as regards the arrangements
    for importing bananas into the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 896/2001 de la Commission du 7 mai 2001 portant modalités
    d'application du règlement (CEE) n° 404/93 du Conseil en ce qui concerne le
    régime d'importation de bananes dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 896/2001 der Kommission vom 7. Mai 2001 mit Durchführungsbestimmungen
