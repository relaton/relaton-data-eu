title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2985/92 of 12 October 1992 amending, for the
    third time, Regulation (EEC) No 3882/91 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1992 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2985/92 du Conseil, du 12 octobre 1992, modifiant
    pour la troisième fois le règlement (CEE) n° 3882/91 fixant, pour certains
    stocks ou groupes de stocks de poissons, les totaux admissibles des captures pour
    1992 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2985/92 des Rates vom 12. Oktober 1992 zur dritten
    Änderung der Verordnung (EWG) Nr. 3882/91 über die zulässigen Gesamtfangmengen
    und über Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen für
    1992
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2985/92 af 12. oktober 1992 om tredje ændring
    af forordning (EØF) nr. 3882/91 om fastsættelse for 1992 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2985/92 του Συμβουλίου
    της 12ης Οκτωβρίου 1992 για την τροποποίηση, για
    τρίτη φορά, του κανονισμού (ΕΟΚ) αριθ. 3882/91 περί
    καθορισμού, για ορισμένα αποθέματα ιχθύων
    ή ομάδες αποθεμάτων ιχθύων, του συνόλου επιτρεπομένων
    αλιευμάτων για το 1992 και ορισμένων όρων υπό
    τους οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2985/92 del Consiglio, del 12 ottobre 1992, recante
    modifica per la terza volta del regolamento (CEE) n. 3882/91 che stabilisce, per
    alcune popolazioni o gruppi di popolazioni ittiche, il totale di catture ammesse
    per il 1992 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2985/92 van de Raad van 12 oktober 1992 tot derde
    wijziging van Verordening (EEG) nr. 3882/91 inzake de vaststelling van de voor
    1992 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2985/92 do Conselho, de 12 de Outubro de 1992, que
    altera pela terceira vez o Regulamento (CEE) n° 3882/91 que fixa, relativamente
    a determinadas unidades populacionais ou grupos de unidades populacionais de peixes,
    os totais admissíveis de capturas para 1992 e certas condições em que podem
    ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2985/92 del Consejo, de 12 de octubre de 1992, que
    modifica por tercera vez el Reglamento (CEE) n° 3882/91 por el que se fijan,
    para determinadas poblaciones o grupos de poblaciones de peces, los totales admisibles
    de capturas para 1992 y determinadas condiciones en las que pueden pescarse
  type: main
