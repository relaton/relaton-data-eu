title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 872/88 of 30 March 1988 re-establishing
    the levying of customs duties on mixed alkybenzenes and mixed alkylnaphthalenes
    falling within CN code 3817, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 872/88 de la Commission du 30 mars 1988 portant rétablissement
    de la perception de droits de douane applicables aux alkylbenzènes en mélanges
    et aux alkylnaphtalènes en mélanges du code NC 3817, originaires de Corée du
    Sud, bénéficiaire des préférences tarifaires prévues par le règlement (CEE)
    n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 872/88 DER KOMMISSION vom 30. März 1988 zur Wiedereinführung
