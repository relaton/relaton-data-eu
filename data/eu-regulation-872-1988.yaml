    der Position 3817 der Kombinierten Nomenklatur mit Ursprung in Südkorea, dem
    die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 872/88 af 30. marts 1988 om genindførelse
