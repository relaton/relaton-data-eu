title:
- language: fr
  script: Latn
  content: Règlement n° 96/65/CEE du Conseil, du 29 juin 1965, concernant les mesures
    à appliquer dans le domaine des prix par les États membres producteurs et portant
    fixation des prix de seuil communs des États membres non producteurs, pour le
    riz et les brisures, pour la campagne 1965/1966
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 96/65/EWG des Rates vom 29. Juni 1965 über die von den
    Erzeugermitgliedstaaten anzuwendenden Maßnahmen auf dem Gebiet der Preise und
    über die Festsetzung der gemeinsamen Schwellenpreise der Mitgliedstaaten ohne
    eigene Erzeugung für Reis und Bruchreis für das Wirtschaftsjahr 1965/1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 96/65/CEE del Consiglio, del 29 giugno 1965, relativo alle
    misure che devono essere applicate nel settore dei prezzi da parte degli Stati
    membri produttori ed alla fissazione dei prezzi d'entrata comuni degli Stati membri
    non produttori per il riso e le rotture di riso per la campagna 1965/1966
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 96/65/EEG van de Raad van 29 juni 1965 inzake de met betrekking
    tot de prijzen door de producerende Lid-Staten toe te passen maatregelen, en houdende
    vaststelling van de gemeenschappelijke drempelprijzen van de niet-producerende
    Lid-Staten, voor rijst en breukrijst voor het verkoopseizoen 1965/1966
  type: main
