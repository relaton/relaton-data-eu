title:
- language: en
  script: Latn
  content: '85/473/EEC: Commission Decision of 2 October 1985 supplementing, by the
    addition of Zimbabwe, the list of third countries from which Member States authorize
    imports of bovine animals, swine and fresh meat'
  type: main
- language: fr
  script: Latn
  content: '85/473/CEE: Décision de la Commission du 2 octobre 1985 prévoyant l''
    adjonction du Zimbabwe à la liste des pays tiers en provenance desquels les États
    membres autorisent les importations d'' animaux et de viandes fraîches des espèces
    bovine et porcine'
  type: main
- language: de
  script: Latn
  content: '85/473/EWG: Entscheidung der Kommission vom 2. Oktober 1985 zur Ergänzung
    der Liste der Drittländer, aus denen die Mitgliedstaaten die Einfuhr von Rindern
    und Schweinen und von frischem Fleisch zulassen, durch Aufnahme von Simbabwe'
  type: main
- language: da
  script: Latn
  content: '85/473/EØF: Kommissionens beslutning af 2. oktober 1985 om optagelse
    af Zimbabwe på listen over de tredjelande, hvorfra medlemsstaterne tillader indførsel
    af kvæg og svin samt fersk kød'
  type: main
- language: el
  script: Grek
  content: '85/473/ΕΟΚ: Απόφαση της Επιτροπής της 2ας Οκτωβρίου
    1985 για τη συμπλήρωση, με την προσθήκη της Ζιμπάμπουε,
    του καταλόγου των τρίτων χωρών από τις οποίες
    τα κράτη μέλη επιτρέπουν εισαγωγές βοοειδών,
    χοίρων και νωπών κρεάτων'
  type: main
- language: it
  script: Latn
  content: '85/473/CEE: Decisione della Commissione del 2 ottobre 1985 che integra,
    con l'' aggiunta dello Zimbabwe, l'' elenco dei paesi terzi dai quali gli stati
    membri autorizzano le importazioni di animali delle specie bovina e suina e di
    carni fresche'
  type: main
- language: nl
  script: Latn
  content: '85/473/EEG: Beschikking van de Commissie van 2 oktober 1985 tot aanvulling
    van de lijst van derde landen waaruit de Lid-Staten de invoer toestaan van runderen,
    varkens en vers vlees, door toevoeging van Zimbabwe'
  type: main
- language: es
  script: Latn
  content: '85/473/CEE: Decisión de la Comisión de 2 de octubre de 1985 por la que
    se prevé la adición de Zimbabwe a la lista de los terceros países respecto
    de los cuales los Estados miembros autorizan las importaciones de animales y de
    carnes frescas de las especies bovina y porcina'
