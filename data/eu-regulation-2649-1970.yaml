  content: Règlement (CEE) n 2649/70 de la Commission, du 22 décembre 1970, déterminant
    les montants des éléments mobiles et les droits additionnels applicables pendant
    le premier trimestre de l'année 1971, à l'importation dans la Communauté des
    marchandises relevant du règlement (CEE) n 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2649/70 der Kommission vom 22. Dezember 1970 zur Festsetzung
    der Höhe der im ersten Vierteljahr 1971 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft anwendbaren beweglichen
    Teilbeträge und Zusatzzölle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2649/70 della Commissione, del 22 dicembre 1970, che
    determina gli importi degli elementi mobili e i dazi addizionali applicabili durante
    il primo trimestre 1971 all'importazione nella Comunità delle merci cui si applica
    il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2649/70 van de Commissie van 22 december 1970 tot
