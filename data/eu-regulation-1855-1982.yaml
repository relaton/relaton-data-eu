title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1855/82 of 9 July 1982 re-establishing the
    levying of customs duties on ethylene glycol, falling within subheading 29.04
    C ex I and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1855/82 de la Commission, du 9 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables à l' éthylèneglycol,
    de la sous-position 29.04 C ex I du tarif douanier commun, originaire du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1855/82 der Kommission vom 9. Juli 1982 zur Wiedereinführung
    der Erhebung der Zölle für Äthylenglykol der Tarifstelle 29.04 C ex I, mit
    Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werdene
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1855/82 af 9. juli 1982 om genindførelse
    af opkrævning af told for ethylenglycol, henhørende under pos. 29.04 C ex I
    og med oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1855/82 τής Επιτροπής
    τής 9ης Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τήν αιθυλενογλυκόλη
    τής δασμολογικής διακρίσεως 29. 04 Γ ex I καταγωγής
    Βραζιλίας, δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1855/82 della Commissione, del 9 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili al glicole etilenico,
    della sottovoce 29.04 C ex I della tariffa doganale comune, originario del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
