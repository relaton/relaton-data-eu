    kivetéséről és a kivetett ideiglenes vám végleges beszedéséről szóló
    1389/2011/EU tanácsi végrehajtási rendelet „új exportőrre” vonatkozó
    felülvizsgálatának megindításáról, az ezen ország egyik exportőrétől
    származó behozatalra vonatkozó vám eltörléséről, valamint az e behozatalra
    vonatkozó nyilvántartásba vételi kötelezettségről
  type: main
