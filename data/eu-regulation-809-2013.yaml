- language: en
  script: Latn
  content: Commission Regulation (EU) No 809/2013 of 27 August 2013 initiating a ‘new
    exporter’ review of Council Implementing Regulation (EU) No 1389/2011 imposing
    a definitive anti-dumping duty on imports of trichloroisocyanuric acid originating
    in the People’s Republic of China, repealing the duty with regard to imports
    from one exporter in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 809/2013 de la Commission du 27 août 2013 portant
    ouverture d’un réexamen au titre de «nouvel exportateur» du règlement (UE)
    n ° 1389/2011 du Conseil instituant un droit antidumping définitif sur les importations
    d’acide trichloro-isocyanurique originaire de la République populaire de Chine,
    abrogeant le droit en ce qui concerne le produit d’un exportateur de ce pays
    et soumettant les importations de ce produit à enregistrement
  type: main
