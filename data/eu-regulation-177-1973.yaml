    nazionali all' interno della nomenclatura della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 177/73 van de Raad van 23 januari 1973 tot machtiging
    van de nieuwe Lid-Staten om in de nomenclatuur van het gemeenschappelijk douanetarief
    nationale onderverdelingen voor sommige landbouwprodukten over te nemen
