  content: Regulation (EEC) No 177/73 of the Council of 23 January 1973 authorizing
    the new Member States to take over national subdivisions for certain agricultural
    products within the Common Customs Tariff nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 177/73 du Conseil, du 23 janvier 1973, autorisant
    les nouveaux États membres à reprendre, au sein de la nomenclature du tarif
    douanier commun, des subdivisions nationales pour certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 177/73 des Rates vom 23. Januar 1973 zur Ermächtigung
    der neuen Mitgliedstaaten, einzelstaatliche Unterteilungen für einige landwirtschaftliche
    Erzeugnisse in das Schema des Gemeinsamen Zolltarifs zu übernehmen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 177/73 af 23. januar 1973 om adgang for de
