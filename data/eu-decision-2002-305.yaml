    tanácsi irányelv I. mellékletébe történő lehetséges felvétele céljából
    részletes vizsgálatra benyújtott dokumentációk teljességének elvi elismeréséről
    (az értesítés a C(2002) 1434. dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/305/CE: Decisione della Commissione, del 19 aprile 2002, che riconosce
    in linea di massima la completezza del fascicolo presentato per un esame particolareggiato
    in vista della possibile iscrizione del clothianidin e della Pseudozyma flocculosa
    nell''allegato I della direttiva 91/414/CEE del Consiglio, relativa all''immissione
    in commercio dei prodotti fitosanitari (Testo rilevante ai fini del SEE) [notificata
    con il numero C(2002) 1434]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 19. aprīlis), ar ko principā atzīst, ka
