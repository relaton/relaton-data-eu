title:
- language: en
  script: Latn
  content: '2002/305/EC: Commission Decision of 19 April 2002 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of clothianidin and Pseudozyma flocculosa in Annex I to
    Council Directive 91/414/EEC concerning the placing of plant-protection products
    on the market (Text with EEA relevance) (notified under document number C(2002)
    1434)'
  type: main
- language: fr
  script: Latn
  content: '2002/305/CE: Décision de la Commission du 19 avril 2002 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle de clothianidin et de Pseudozyma flocculosa à l''annexe
    I de la directive 91/414/CEE du Conseil concernant la mise sur le marché des
    produits phytopharmaceutiques (Texte présentant de l''intérêt pour l''EEE)
    [notifiée sous le numéro C(2002) 1434]'
  type: main
- language: de
  script: Latn
  content: '2002/305/EG: Entscheidung der Kommission vom 19. April 2002 zur grundsätzlichen
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Clothianidin und Pseudozyma flocculosa
    in Anhang I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von
    Pflanzenschutzmitteln eingereicht wurden (Text von Bedeutung für den EWR) (Bekannt
    gegeben unter Aktenzeichen K(2002) 1434)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 19 април 2002 година
    относно признаване по принцип на пълнотата
    на досиетата, представени за подробно проучване
    с оглед на възможното включване на клотианидин
    и Pseudozyma flocculosa в приложение I към Директива 91/414/ЕИО
    на Съвета относно пускането на пазара на продукти
    за растителна защита (нотифицирано под номер
    С(2002) 1434)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 19. dubna 2002, kterým se v zásadě uznává
    úplnost dokumentací předložených k podrobnému zkoumání s ohledem na možné
    zařazení klothianidinu a Pseudozyma flocculosa do přílohy I směrnice Rady
    91/414/EHS o uvádění přípravků na ochranu rostlin na trh (oznámeno pod
    číslem K(2002) 1434)
  type: main
- language: da
  script: Latn
  content: '2002/305/EF: Kommissionens beslutning af 19. april 2002 om principiel
    anerkendelse af, at dossiererne for detaljeret gennemgang med henblik på eventuel
    optagelse af clothianidin og Pseudozyma flocculosa i bilag I til Rådets direktiv
    91/414/EØF om markedsføring af plantebeskyttelsesmidler er fuldstændige (EØS-relevant
    tekst) (meddelt under nummer K(2002) 1434)'
  type: main
- language: el
