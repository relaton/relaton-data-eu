title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1472/91 of 29 May 1991 imposing a provisional
    anti-dumping duty on imports of oxalic acid originating in India or China and
    terminating the anti-dumping proceeding in respect of imports of oxalic acid originating
    in Czechoslovakia
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1472/91 DE LA COMMISSION du 29 mai 1991 instituant
    un droit antidumping provisoire sur les importations d'' acide oxalique originaire
    de l'' Inde et de la Chine et portant clôture de la procédure antidumping relative
    aux importations d'' acide oxalique originaire de la Tchécoslovaquie #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1472/91 DER KOMMISSION vom 29. Mai 1991 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren von Oxalsäure mit Ursprung
    in Indien und China und zur Einstellung des Antidumpingverfahrens gegenüber den
    Einfuhren von Oxalsäure mit Ursprung in der Tschechoslowakei #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1472/91 af 29. maj 1991 om indførelse
    af en midlertidig antidumpingtold på importen af oxalsyre med oprindelse i Indien
    og Kina og om afslutning af antidumpingproceduren vedrørende importen af oxalsyre
    med oprindelse i Tjekkoslovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1472/91 της Επιτροπής
    της 29ης Μαΐου 1991 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές οξαλικού
    οξέος, καταγωγής Ινδίας και Κίνας και για την
    περάτωση της διαδικασίας όσον αφορά τις εισαγωγές
    οξαλικού οξέος καταγωγής Τσεχοσλοβακίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1472/91 DELLA COMMISSIONE del 29 maggio 1991 che
    istituisce un dazio antidumping provvisorio sulle importazioni di acido ossalico
    originario dell'' India e della Cina e chiude il procedimento antidumping relativo
    alle importazioni di acido ossalico originario della Cecoslovacchia #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1472/91 VAN DE COMMISSIE van 29 mei 1991 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van oxaalzuur van oorsprong uit
    India en China, en tot beëindiging van de anti-dumpingprocedure met betrekking
    tot de invoer van oxaalzuur van oorsprong uit Tsjechoslowakije #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1472/91 DA COMISSÃO de 29 de Maio de 1991 que institui
    um direito anti-dumping provisório sobre as importações de ácido oxálico
    originário da Índia e da China e que encerra o processo anti-dumping relativo
    às importações de ácido oxálico originário da Checoslováquia #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1472/91 DE LA COMISIÓN de 29 de mayo de 1991 por
