title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3559/73 of the Commission of 21 December 1973 laying
    down detailed rules for granting financial compensation and indemnities, fixing
    the withdrawal prices and determining the buying in price for certain fishery
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3559/73 de la Commission, du 21 décembre 1973, établissant
    les dispositions d' application relatives à l' octroi de la compensation financière
    et de l' indemnité, ainsi qu' à la fixation des prix de retrait et à la détermination
    des prix d' achat pour certains produits de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3559/73 der Kommission vom 21. Dezember 1973 mit Durchführungsbestimmungen
    über die Gewährung des finanziellen Ausgleichs und der Entschädigung sowie
    über die Festsetzung der Rücknahmepreise und die Feststellung der Ankaufspreise
    für bestimmte Fischereierzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3559/73 af 21. december 1973 om gennemførelsesbestemmelser
    for ydelse af den finansielle udligning og godtgørelse samt om fastsættelse
    af tilbagetagelsespriser og beregning af købspriser for visse fiskerivarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3559/73 τής Επτροπής
    τής 21ης Δεκεμβρίου 1973 περί θεσπίσεως τών διατάξεων
    εφαρμογής σχετικά μέ τή χορήγηση τής χρηματικής
    αντισταθμίσεως καί τής αποζημιώσεως καθώς
    καί τόν καθορισμό τών τιμών αποσύρσεως καί
    τόν καθορισμό τών τιμών αγοράς γιά ορισμένα
    προϊόντα αλιείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3559/73 della Commissione, del 21 dicembre 1973, relativo
    a disposizioni d' applicazione concernenti la concessione della compensazione
    finanziaria e dell' indennità nonché la fissazione dei prezzi di ritiro e la
    constatazione dei prezzi di acquisto per determinati prodotti della pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3559/73 van de Commissie van 21 december 1973 houdende
    uitvoeringsbepalingen betreffende de toekenning van de financiële vergoedingen,
    de bepaling van de ophoudprijzen en de vaststelling van de aankoopprijzen voor
    bepaalde visserijprodukten
