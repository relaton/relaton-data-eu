    Zeitraum 1994 bis 1999 betreffenden einzigen Programmplanungsdokuments zu den
    strukturellen Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen land- und forstwirtschaftlicher Erzeugnisse im Rahmen
    der Zielvorgabe 5a in Spanien (mit Ausnahme von Andalusien, Asturien, den Kanarischen
    Inseln, Cantabria, Castilla und Léon, Castilla-La Mancha, der Gemeinde Valencia,
    Estremadura, Galizien, Murcia sowie Ceuta und Melilla) (Nur der spanische Text
    ist verbindlich)'
