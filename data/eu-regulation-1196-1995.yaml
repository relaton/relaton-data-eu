    Übergangsmaßnahmen zur Umsetzung des Übereinkommens über die Landwirtschaft
    im Rahmen der Uruguay-Runde genannten Ausfuhrlizenzen im Sektor Milch und Milcherzeugnisse
    zugeteilt werden dürfen
  type: main
- language: da
  script: Latn
