title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1196/95 of 24 May 1995 temporarily suspending
    the advance fixing of export refunds on certain milk products and determining
    the proportion of quantities requested for which export licences as provided for
    in Regulation (EC) No 974/95 on certain transitional measures required to implement
    the Uruguay Round Agricultural Agreement may be granted for milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1196/95 de la Commission, du 24 mai 1995, portant suspension
    temporaire de la fixation à l'avance des restitutions à l'exportation de certains
    produits laitiers et déterminant la mesure dans laquelle peuvent être attribuées
    les demandes de certificats d'exportation visés par le règlement (CE) n° 974/95
    portant sur certaines mesures transitoires relatives à la mise en oeuvre de l'accord
    agricole du cycle d'Uruguay dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1196/95 der Kommission vom 24. Mai 1995 zur vorläufigen
