  script: Latn
  content: Komission asetus (EY) N:o 1196/95, annettu 24 päivänä toukokuuta 1995,
    Uruguayn kierroksen maataloutta koskevan sopimuksen täytäntöönpanoon maito-
    ja maitotuotealalla liittyvistä tietyistä siirtymätoimenpiteistä annetussa
