title:
- language: fr
  script: Latn
  content: Décision de la Commission portant prorogation partielle de la décision
    de la Commission du 12 février 1963 autorisant la République italienne à diminuer
    les prélèvements pour les oeufs en coquille destinés à la consommation et
    pour les produits à base d'oeufs
  type: main
- language: de
  script: Latn
  content: '63/219/EWG: Entscheidung der Kommission über die teilweise Verlängerung
    der Entscheidung der Kommission vom 12. Februar 1963, durch die die Italienische
    Republik ermächtigt wird, die Abschöpfungsbeträge für Eier in der Schale,
    die zum Verbrauch bestimmt sind, und für Eiprodukte zu verringern'
  type: main
- language: it
  script: Latn
  content: '63/219/CEE: Decisione della Commissione relativa alla proroga parziale
    della decisione della Commissione del 12 febbraio 1963, che autorizza la Repubblica
    italiana a diminuire i prelievi per le uova in guscio destinate al consumo e per
    i prodotti a base di uova'
  type: main
- language: nl
  script: Latn
  content: '63/219/EEG: Beschikking van de Commissie tot gedeeltelijke verlenging
    van de geldigheidsduur van de beschikking van de Commissie van 12 februari 1963
    waarbij de Italiaanse Republiek wordt gemachtigd het bedrag van de heffingen op
    eieren in de schaal die voor consumptie bestemd zijn, en op eiprodukten te verlagen'
  type: main
