title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 660/89 of 14 March 1989 re-establishing
    the levying of customs duties on men' s or boy' s suits, products of category
    No 16 (order No 40.0160), and women' s or girl' s suits, products of category
    No 74 (order No 40.0740), originating in Thailand to which the preferential tariff
    arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 660/89 de la Commission du 14 mars 1989 portant rétablissement
    de la perception des droits de douane applicables aux costumes complets pour hommes
    et garçonnets, de la catégorie de produits nº 16 (nºd' ordre 40.0160), et
    aux costumes tailleurs pour femmes ou fillettes, de la catégorie de produits
    nº 74 (nºd' ordre 40.0740), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) nº 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 660/89 der Kommission vom 14. März 1989 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen für Männer und Knaben der Warenkategorie
    Nr. 16 (lfd. Nr. 40.0160) und Kostüme und Kombinationen für Frauen und Mädchen
    der Warenkategorie Nr. 74 (lfd. Nr. 40.0740) mit Ursprung in Thailand, dem die
    in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 660/89 af 14. marts 1989 om genindførelse
    af opkrævning af toldafgifter for - jakkesæt, ikke til mænd og drenge under
    varekategori nr. 16 (løbenummer 40.0160) - dragter, kostumer til kvinder og piger
    under varekategori nr. 74 (løbenummer 40.0740), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 4259/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 660/89 της Επιτροπής
