    για γυναίκες ή κορίτσια προϊόντα της κατηγορίας
    74 (κωδικός 40.0740), καταγωγής Ταϊλάνδης, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    4259/88 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 660/89 della Commissione del 14 marzo 1989 che ripristina
    la riscossione dei dazi doganali applicabili ai vestiti e completi per uomo e
    per ragazzo della categoria di prodotti n. 16 (numero d' ordine 40.0160) e agli
    abiti a giacca per donna o ragazza della categoria di prodotti n. 74 (numero d'
    ordine 40.0740) originari della Tailandia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 660/89 van de Commissie van 14 maart 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, voor heren en jongens, van de categorie van produkten nr. 16 (volgnummer
    40.0160) en mantelpakken of broekpakken, voor dames en meisjes, van de categorie
    van produkten nr. 74 (volgnummer 40.0740), van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 4259/88
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 660/89 da Comissão de 14 de Março de 1989 que restabelece
