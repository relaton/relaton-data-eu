title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1163/1999 of 2 June 1999 determining, for
    the 1999 marketing year, the estimated loss of income and the estimated level
    of the premium payable per ewe and per female goat and fixing the first advance
    payment for this premium and an advance payment of the specific aid for sheep
    and goat farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1163/1999 de la Commission, du 2 juin 1999, déterminant,
    pour la campagne 1999, la perte estimée de revenu, le montant estimé de la prime
    payable par brebis et par chèvre, et fixant le montant du premier acompte de
    cette prime ainsi que le montant d'un acompte sur l'aide spécifique à l'élevage
    ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1163/1999 der Kommission vom 2. Juni 1999 zur Bestimmung
    des für das Wirtschaftsjahr 1999 zu gewährenden Einkommensausfalls und der je
    Mutterschaf und Ziege zu gewährenden Prämie, des ersten Vorschusses auf diese
    Prämie sowie eines Vorschusses auf die Sonderbeihilfe für die Schaf- und Ziegenhaltung
    in bestimmten benachteiligten Gebieten der Gemeinschaft
  type: main
- language: da
  script: Latn
