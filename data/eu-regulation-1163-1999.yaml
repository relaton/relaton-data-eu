    uuhta ja naaraspuolista vuohta kohden maksettavan palkkion arvioidun tason määrittämisestä
    sekä tämän palkkion ensimmäisen ennakkomaksun ja tietyillä yhteisön epäsuotuisilla
    alueilla lampaan ja vuohen kasvatukselle maksettavan erityisen tuen ennakkomaksun
    vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1163/1999 della Commissione, del 2 giugno 1999, che
