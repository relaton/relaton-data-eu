    1452/2001, (EÜ) nr 1453/2001 ja (EÜ) nr 1454/2001 kehtestatud äärepoolseimate
    piirkondade tarnimise erikorra üksikasjalikud rakenduseeskirjad
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 127/2005, annettu 27 päivänä tammikuuta 2005,
