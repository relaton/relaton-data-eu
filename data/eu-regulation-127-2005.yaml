title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 127/2005 of 27 January 2005 amending Regulation
    (EC) No 20/2002 laying down detailed rules for implementing the specific supply
    arrangements for the outermost regions introduced by Council Regulations (EC)
    No 1452/2001, (EC) No 1453/2001 and (EC) No 1454/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 127/2005 de la Commission du 27 janvier 2005 modifiant
    le règlement (CE) n° 20/2002 portant modalités d’application des régimes
    spécifiques d’approvisionnement des régions ultrapériphériques établis
    par les règlements du Conseil (CE) n° 1452/2001, (CE) n° 1453/2001 et (CE)
    n° 1454/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 127/2005 der Kommission vom 27. Januar 2005 zur Änderung
