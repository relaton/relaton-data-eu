    vykonávania osobitných opatrení týkajúcich sa dodávok pre najvzdialenejšie
    regióny, zavedených nariadeniami Rady (ES) č. 1452/2001, (ES) č. 1453/2001
    a (ES) č. 1454/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 127/2005 z dne 27. januarja 2005 o spremembi
