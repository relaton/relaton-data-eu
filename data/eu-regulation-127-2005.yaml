    uzgodnień w sprawie dostaw dla najbardziej peryferyjnych regionów, wprowadzone
    rozporządzeniami Rady (WE) nr 1452/2001, (WE) nr 1453/2001 oraz (WE) nr 1454/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 127/2005 da Comissão, de 27 de Janeiro de 2005,
