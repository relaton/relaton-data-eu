    dos regimes específicos de abastecimento das regiões ultraperiféricas estabelecidos
    pelos Regulamentos (CE) n.° 1452/2001, (CE) n.° 1453/2001 e (CE) n.° 1454/2001
    do Conselho
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 127/2005 z 27. januára 2005, ktorým sa mení
