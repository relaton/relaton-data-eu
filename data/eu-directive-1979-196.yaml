title:
- language: en
  script: Latn
  content: Council Directive 79/196/EEC of 6 February 1979 on the approximation of
    the laws of the Member States concerning electrical equipment for use in potentially
    explosive atmospheres employing certain types of protection
  type: main
- language: fr
  script: Latn
  content: Directive 79/196/CEE du Conseil, du 6 février 1979, concernant le rapprochement
    des législations des États membres relatives au matériel électrique utilisable
    en atmosphère explosible mettant en oeuvre certains modes de protection
  type: main
- language: de
  script: Latn
  content: Richtlinie 79/196/EWG des Rates vom 6. Februar 1979 zur Angleichung der
    Rechtsvorschriften der Mitgliedstaaten betreffend elektrische Betriebsmittel zur
    Verwendung in explosibler Atmosphäre, die mit bestimmten Zündschutzarten versehen
    sind
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 79/196/EØF af 6. februar 1979 om indbyrdes tilnærmelse
    af medlemsstaternes lovgivning vedrørende elektrisk materiel til anvendelse i
    eksplosionsfarlig atmosfære og om indførelse af visse beskyttelsesmåder
  type: main
- language: el
  script: Grek
  content: Οδηγία 79/196/EOK του Συμβουλίου της 6ης Φεβρουαρίου
