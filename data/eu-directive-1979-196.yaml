    μελών που αφορούν το ηλεκτρολογικό υλικό που
    δύναται να χρησιμοποιηθεί σε ατμόσφαιρα υπέχουσα
    τον κίνδυνο εκρήξεως και που απαιτεί ορισμένους
    τρόπους προστασίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 79/196/ETY, annettu 6 päivänä helmikuuta 1979,
    räjähdysvaarallisissa tiloissa käytettäviä, tietyn tyyppisellä suojauksella
    varustettuja sähkölaitteita koskevan jäsenvaltioiden lainsäädännön lähentämisestä
  type: main
- language: it
  script: Latn
  content: Direttiva 79/196/CEE del Consiglio, del 6 febbraio 1979, riguardante il
    ravvicinamento delle legislazioni degli Stati Membri relative al materiale elettrico
    destinato ad essere utilizzato in atmosfera esplosiva, per il quale si applicano
    taluni metodi di protezione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 79/196/EEG van de Raad van 6 februari 1979 inzake de onderlinge
    aanpassing van de wetgevingen van de Lid-Staten betreffende elektrisch materieel,
    bestemd voor gebruik in "explosieve omgeving" , dat aan bepaalde beveiligingswijzen
    voldoet
  type: main
- language: pt
  script: Latn
  content: Directiva 79/196/CEE do Conselho, de 6 de Fevereiro de 1979, relativa à
