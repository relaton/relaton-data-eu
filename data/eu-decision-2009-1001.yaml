    от значение за Общността в Макаронезийския
    биогеографски регион (нотифицирано под номер
    C(2009) 10414)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 22. prosince 2009 , kterým se přijímá druhý
    aktualizovaný seznam lokalit významných pro Společenství v makaronéské
    biogeografické oblasti podle směrnice Rady 92/43/EHS (oznámeno pod číslem
    K(2009) 10414)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse af 22. december 2009 om vedtagelse af anden ajourførte
    liste over lokaliteter af fællesskabsbetydning i det biogeografiske område Makaronesien
    i henhold til Rådets direktiv 92/43/EØF (meddelt under nummer K(2009) 10414)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής, της 22ας Δεκεμβρίου
    2009 , σχετικά με την έγκριση δεύτερου ενημερωμένου
    καταλόγου των τόπων κοινοτικής σημασίας για
    τη μακαρονησιακή βιογεωγραφική περιοχή, κατ’
    εφαρμογή της οδηγίας 92/43/ΕΟΚ του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό Ε(2009) 10414]
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 22. detsember 2009 , millega võetakse vastavalt nõukogu
    direktiivile 92/43/EMÜ vastu Makaroneesia biogeograafilises piirkonnas asuvate
    ühenduse tähtsusega alade teine ajakohastatud loetelu (teatavaks tehtud numbri
    K(2009) 10414 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös, annettu 22 päivänä joulukuuta 2009 , neuvoston
    direktiivin 92/43/ETY mukaisen, Makaronesian luonnonmaantieteellisellä alueella
    olevista yhteisön tärkeinä pitämistä alueista tehdyn luettelon toisesta päivityksestä
    (tiedoksiannettu numerolla K(2009) 10414)
  type: main
- language: hr
  script: Latn
  content: '2009/1001/EU: Odluka Komisije od 22. prosinca 2009. o donošenju, na temelju
    Direktive Vijeća 92/43/EEZ, drugog ažuriranog popisa područja od značaja za
    Zajednicu za makaronezijsku biogeografsku regiju (priopćena pod brojem dokumenta
    C(2009) 10414)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata ( 2009. december 22. ) a 92/43/EGK tanácsi irányelv
    értelmében a makaronéziai biogeográfiai régió közösségi jelentőségű
    természeti területeit tartalmazó, második alkalommal frissített jegyzék
    elfogadásáról (az értesítés a C(2009) 10414. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 2009 , che adotta, ai sensi
    della direttiva 92/43/CEE del Consiglio, un secondo elenco aggiornato dei siti
