    Makaronēzijas bioģeogrāfiskajam reģionam (izziņots ar dokumenta numuru C(2009)
    10414)
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 22 d. Komisijos sprendimas, kuriuo pagal Tarybos direktyvą
    92/43/EEB patvirtinamas antrasis atnaujintas Makaronezijos biogeografinio regiono
    Bendrijos svarbos teritorijų sąrašas (pranešta dokumentu Nr. C(2009) 10414)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tat- 22 ta’ Diċembru 2009 li tadotta, skont
    id-Direttiva tal-Kunsill 92/43/KEE, it-tieni lista aġġornata tas-siti ta’
    importanza Komunitarja għar-reġjun bijoġeografiku Makaroneżjan (notifikata
    bid-dokument numru C(2009) 10414)
  type: main
- language: nl
  script: Latn
  content: Besluit van de Commissie van 22 december 2009 tot vaststelling, op grond
    van Richtlijn 92/43/EEG van de Raad, van een tweede bijgewerkte lijst van gebieden
    van communautair belang voor de Macaronesische biogeografische regio (Kennisgeving
    geschied onder nummer C(2009) 10414)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 22 grudnia 2009 r. w sprawie przyjęcia na mocy
    dyrektywy Rady 92/43/EWG drugiego zaktualizowanego wykazu terenów mających znaczenie
    dla Wspólnoty składających się na makaronezyjski region biogeograficzny (notyfikowana
    jako dokument nr C(2009) 10414)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 22 de Dezembro de 2009 , que adopta, em aplicação
    da Directiva 92/43/CEE do Conselho, a segunda lista actualizada dos sítios de
    importância comunitária da região biogeográfica macaronésica [notificada
    com o número C(2009) 10414]
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 22 decembrie 2009 de adoptare, în temeiul Directivei
    92/43/CEE a Consiliului, a celei de-a treia liste actualizate a siturilor de importanță
    comunitară pentru regiunea biogeografică Macaronezia [notificată cu numărul
    C(2009) 10414]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 22. decembra 2009 , ktorým sa podľa smernice Rady
    92/43/EHS prijíma druhý aktualizovaný zoznam lokalít európskeho významu
    v makaronézskom biogeografickom regióne [oznámené pod číslom K(2009) 10414]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije z dne 22. decembra 2009 o sprejetju drugega posodobljenega
    seznama območij v makaroneški biogeografski regiji, pomembnih za Skupnost, v
    skladu z Direktivo Sveta 92/43/EGS (notificirano pod dokumentarno številko C(2009)
    10414)
  type: main
- language: es
