title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 2009 on adopting, pursuant to Council
    Directive 92/43/EEC, a second updated list of sites of Community importance for
    the Macaronesian biogeographical region (notified under document C(2009) 10414)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 22 décembre 2009 arrêtant, en application
    de la directive 92/43/CEE du Conseil, une deuxième liste actualisée des sites
    d’importance communautaire pour la région biogéographique macaronésienne
    [notifiée sous le numéro C(2009) 10414]
  type: main
- language: de
  script: Latn
  content: Beschluss der Kommission vom 22. Dezember 2009 gemäß der Richtlinie 92/43/EWG
    des Rates zur Verabschiedung einer zweiten aktualisierten Liste von Gebieten von
    gemeinschaftlicher Bedeutung in der makaronesischen biogeografischen Region (Bekannt
    gegeben unter Aktenzeichen K(2009) 10414)
  type: main
- language: bg
  script: Cyrl
  content: '2009/1001/ЕС: Решение на Комисията от 22 декември
