title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1503/94 of 27 June 1994 establishing a system
    of compensation for the additional costs incurred in the marketing of certain
    fishery products from the Azores, Madeira, the Canary Islands and the French department
    of Guiana as a result of their very remote location
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1503/94 du Conseil du 27 juin 1994 instituant un régime
    de compensation des surcoûts induits par l'ultrapériphéricité pour l'écoulement
    de certains produits de la pêche des Açores, de Madère, des îles Canaries
    et du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1503/94 DES RATES vom 27. Juni 1994 über eine Regelung
    zum Ausgleich der durch die extreme Randlage bedingten Mehrkosten bei der Vermarktung
    bestimmter Fischereierzeugnisse der Azoren, Madeiras, der Kanarischen Inseln und
    des französischen Departements Guyana
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 1503/94 af 27. juni 1994 om en ordning for
    godtgørelse af fjernområdernes meromkostninger ved afsætning af visse fiskerivarer
    fra Azorerne, Madeira, De Kanariske Øer og det franske departement Guyana
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1503/94 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 27ης Ιουνίου 1994 για τη θέσπιση αντισταθμιστικού
    καθεστώτος του επιπλέον κόστους που συνεπάγεται
    ο άκρως απομακρυσμένος χαρακτήρας των Αζορών,
    της Μαδέρας, των Καναρίων Νήσων και του γαλλικού
    διαμερίσματος της Γουιάνας, όσον αφορά τη διάθεση
    ορισμένων αλιευτικών προϊόντων τους
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1503/94 DEL CONSIGLIO del 27 giugno 1994 che istituisce
    un regime di compensazione dei costi supplementari che incidono sullo smercio
    di taluni prodotti della pesca originari delle Azzorre, di Madera, delle Canarie
    e della Guiana francese
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1503/94 VAN DE RAAD van 27 juni 1994 tot instelling
    van een regeling ter compensatie van de door de ultraperifere ligging veroorzaakte
    extra kosten voor de afzet van bepaalde visserijprodukten van de Azoren, Madeira,
    de Canarische eilanden en het Franse departement Guyana
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1503/94 DO CONSELHO de 27 de Junho de 1994 que institui
    um regime de compensação dos custos suplementares, gerados pela ultraperifericidade,
    ao escoamento de determinados produtos da pesca dos Açores, da Madeira, das ilhas
    Canárias e do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1503/94 DEL CONSEJO de 27 de junio de 1994 por el que
    se establece un régimen de compensación de los costes suplementarios que supone
    la comercialización de determinados productos de la pesca de las Azores, Madeira,
    islas Canarias y el departamento francés de la Guyana, debido a la situación
    ultraperiférica de estas regiones
  type: main
