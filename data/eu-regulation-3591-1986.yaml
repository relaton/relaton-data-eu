    be imported from the United States of America and from Canada under the arrangements
    laid down in Regulation (EEC) No 3655/85
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3591/86 de la Commission du 26 novembre 1986 modifiant
