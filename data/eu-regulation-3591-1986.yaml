    den Vereinigten Staaten von Amerika und Kanada, die im Rahmen der durch die Verordnung
    (EWG) Nr. 3655/85 vorgesehenen Regelung eingeführt werden darf
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3591/86 af 26. november 1986 om ændring
