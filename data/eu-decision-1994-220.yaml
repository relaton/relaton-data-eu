title:
- language: en
  script: Latn
  content: '94/220/EC: Commission Decision of 26 January 1994 requiring France to
    suspend the payment to Groupe Bull of aid granted in breach of Article 93 (3)
    of the EC Treaty'
  type: main
- language: fr
  script: Latn
  content: '94/220/CE: Décision de la Commission, du 26 janvier 1994, enjoignant
    à la France de suspendre le versement d''une aide au groupe Bull accordée en
    violation de l''article 93 paragraphe 3 du traité CE (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/220/EG: Entscheidung der Kommission vom 26. Januar 1994 mit der Auflage
    an Frankreich, die in Zuwiderhandlung gegen Artikel 93 Absatz 3 des EG- Vertrags
    begonnene Zahlung der Beihilfen an den Bull- Konzern einzustellen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/220/EF: Kommissionens beslutning af 26. januar 1994 om krav til Frankrig
    om at indstille udbetalingen af støtte til Bull-gruppen i strid med EF-traktatens
    artikel 93, stk. 3'
  type: main
- language: el
  script: Grek
  content: '94/220/ΕΚ: Απόφαση της Επιτροπής της 26ης Ιανουαρίου
    1994 με την οποία απαιτείται από τη Γαλλία να
    αναστείλει την καταβολή ενίσχυσης στον όμιλο
    Bull, η οποία έχει χορηγηθεί κατά παράβαση του
    άρθρου 93 παράγραφος 3 της συνθήκης ΕΚ'
  type: main
- language: it
  script: Latn
  content: '94/220/CE: Decisione della Commissione, del 26 gennaio 1994, che ingiunge
    alla Francia di sospendere il versamento dell''aiuto a favore del gruppo Bull
    accordato in violazione dell''articolo 93, paragrafo 3 del trattato CE (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '94/220/EG: Beschikking van de Commissie van 26 januari 1994 waarbij van
    Frankrijk opschorting wordt verlangd van de steunregeling ten behoeve van Groupe
    Bull welke in strijd met artikel 93, lid 3, van het EG-Verdrag is ingevoerd'
  type: main
- language: pt
  script: Latn
  content: '94/220/CE: Decisão da Comissão, de 26 de Janeiro de 1994, que exige
    à França a suspensão do pagamento do auxílio a favor do grupo Bull concedido
    em violação do disposto no n° 3 do artigo 93º do Tratado CE (O texto em língua
    francesa é o único que faz fé)'
  type: main
- language: es
  script: Latn
  content: '94/220/CE: Decisión de la Comisión, de 26 de enero de 1994, por la que
    se exige a Francia que suspenda el pago de una ayuda al Grupo Bull, concedida
    en infracción del apartado 3 del artículo 93 del Tratado CE'
