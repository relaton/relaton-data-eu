  content: Regulamento de Execução (UE) 2022/806 da Comissão de 23 de maio de 2022
    que altera o Regulamento de Execução (UE) 2020/492 que institui direitos anti-dumping
    definitivos sobre as importações de determinados têxteis tecidos e/ou agulhados
    em fibra de vidro originários da República Popular da China e do Egito e o Regulamento
    de Execução (UE) 2020/776 que institui direitos de compensação definitivos
    sobre as importações de determinados têxteis tecidos e/ou agulhados em fibra
    de vidro originários da República Popular da China e do Egito, e que institui
    direitos anti-dumping definitivos e direitos de compensação definitivos sobre
    as importações de determinados têxteis tecidos e/ou agulhados em fibra de vidro
    originários da República Popular da China e do Egito introduzidos numa ilha
    artificial, numa instalação fixa ou flutuante ou em qualquer outra estrutura
    na plataforma continental de um Estado-Membro ou na zona económica exclusiva
    declarada por um Estado-Membro nos termos da CNUDM
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/806 al Comisiei din 23 mai
    2022 de modificare a Regulamentului de punere în aplicare (UE) 2020/492 de instituire
    a unor taxe antidumping definitive la importurile de anumite materiale țesute
    și/sau cusute din fibre de sticlă originare din Republica Populară Chineză
    și din Egipt și a Regulamentului de punere în aplicare (UE) 2020/776 de instituire
    a unor taxe compensatorii definitive la importurile de anumite materiale țesute
    și/sau cusute din fibre de sticlă originare din Republica Populară Chineză
    și din Egipt și de instituire a taxelor antidumping definitive și a taxelor
    compensatorii definitive la importurile de anumite materiale țesute și/sau cusute
    din fibră de sticlă originare din Republica Populară Chineză și din Egipt
    și transportate pe o insulă artificială, pe o instalație fixă sau plutitoare
    sau pe orice altă structură aflată pe platoul continental al unui stat membru
    sau în zona economică exclusivă declarată de un stat membru în temeiul UNCLOS
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/806 z 23. mája 2022, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2020/492, ktorým sa ukladá konečné
    antidumpingové clo na dovoz určitých tkaných a/alebo stehovaných textílií
    zo sklenených vlákien s pôvodom v Čínskej ľudovej republike a Egypte, a
    vykonávacie nariadenie (EÚ) 2020/776, ktorým sa ukladajú konečné vyrovnávacie
    clá na dovoz určitých tkaných a/alebo stehovaných textílií zo sklenených
    vlákien s pôvodom v Čínskej ľudovej republike a Egypte, a ukladajú sa konečné
    antidumpingové clá a konečné vyrovnávacie clá na dovoz určitých tkaných
    a/alebo stehovaných textílií zo sklenených vlákien s pôvodom v Čínskej
    ľudovej republike a Egypte prinesených na umelý ostrov, pevné alebo plávajúce
    zariadenie alebo akúkoľvek inú štruktúru na kontinentálnom šelfe členského
    štátu alebo vo výhradnej hospodárskej zóne, ktoré oznámil členský štát
    podľa dohovoru UNCLOS
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/806 z dne 23. maja 2022 o spremembi
    Izvedbene uredbe (EU) 2020/492 o uvedbi dokončnih protidampinških dajatev na
    uvoz nekaterih tkanih in/ali šivanih tkanin iz steklenih vlaken s poreklom iz
    Ljudske republike Kitajske in Egipta ter Izvedbene uredbe (EU) 2020/776 o uvedbi
    dokončnih izravnalnih dajatev na uvoz nekaterih tkanih in/ali šivanih tkanin
    iz steklenih vlaken s poreklom iz Ljudske republike Kitajske in Egipta ter o uvedbi
    dokončnih protidampinških dajatev in dokončnih izravnalnih dajatev na uvoz
    nekaterih tkanih in/ali šivanih tkanin iz steklenih vlaken s poreklom iz Ljudske
    republike Kitajske in Egipta, ki so prinesene na umetni otok, fiksno ali plavajočo
    napravo ali katero koli drugo strukturo v epikontinentalnem pasu države članice
    ali izključni ekonomski coni, ki jo je prijavila država članica v skladu z
    UNCLOS
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/806 de la Comisión de 23 de mayo de
    2022 por el que se modifican el Reglamento de Ejecución (UE) 2020/492, por el
    que se imponen derechos antidumping definitivos sobre las importaciones de determinados
    tejidos de fibra de vidrio de punto y/o cosidos originarios de la República Popular
    China y Egipto, y el Reglamento de Ejecución (UE) 2020/776, por el que se establecen
    derechos compensatorios definitivos sobre las importaciones de determinados tejidos
    de fibra de vidrio de punto y/o cosidos originarios de la República Popular China
    y de Egipto, y por el que se imponen los derechos antidumping y compensatorios
    definitivos sobre las importaciones de determinados tejidos de fibra de vidrio
    de punto y/o cosidos originarios de la República Popular China y Egipto e introducidos
    en una isla artificial, una instalación fija o flotante o cualquier otra estructura
    que se encuentre en la plataforma continental de un Estado miembro o en la zona
    económica exclusiva declarada por un Estado miembro en virtud de la CNUDM
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/806 av den 23 maj 2022
    om ändring av genomförandeförordning (EU) 2020/492 om införande av slutgiltiga
    antidumpningstullar på import av vissa vävda och/eller sydda glasfibermaterial
    med ursprung i Folkrepubliken Kina och Egypten och genomförandeförordning (EU)
    2020/776 om införande av slutgiltiga utjämningstullar på import av vissa vävda
    och/eller sydda glasfibermaterial med ursprung i Folkrepubliken Kina och Egypten
    och om införande av slutgiltiga antidumpningstullar och slutgiltiga utjämningstullar
    på import av vissa vävda och/eller sydda glasfibermaterial med ursprung i Folkrepubliken
    Kina och Egypten som förs till en konstgjord ö, en fast eller flytande anläggning
    eller någon annan struktur på en medlemsstats kontinentalsockel eller den exklusiva
    ekonomiska zon som deklarerats av en medlemsstat i enlighet med Unclos
  type: main
