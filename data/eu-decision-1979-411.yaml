title:
- language: en
  script: Latn
  content: '79/411/ECSC: Commission Decision of 27 March 1979 extending for the second
    time Decision 75/356/ECSC authorizing the application of special tariff measures
    to the carriage by rail of iron ore from Lorraine and western France to Belgium,
    Luxembourg and the Saar (Only the German and French texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/411/CECA: Décision de la Commission, du 27 mars 1979, relative à
    une deuxième prorogation de la décision 75/356/CECA autorisant les mesures tarifaires
    spéciales applicables aux transports ferroviaires de minerais de fer de la Lorraine
    et de l''ouest de la France à destination de la Belgique, du Luxembourg et de
    la Sarre (Les textes en langues allemande et française sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/411/EGKS: Entscheidung der Kommission vom 27. März 1979 über die
    zweite Verlängerung ihrer Entscheidung 75/356/EGKS, mit der sie Frachtermäßigungen
    für Eisenbahntransporte von lothringischem und westfranzösischem Eisenerz nach
    Belgien, Luxemburg und dem Saarland genehmigt hat (Nur der deutsche und französische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/411/EKSF: Kommissionens beslutning af 27. marts 1979 om anden forlængelse
    af beslutning 75/356/EKSF om godkendelse af særtariffer for jernbanetransport
    af jernmalm fra Lorraine og Vestfrankrig til Belgien, Luxembourg og Saar (Kun
    den tyske og franske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/411/CECA: Decisione della Commissione, del 27 marzo 1979, recante seconda
    proroga della decisione 75/356/CECA che autorizza tariffe speciali per i trasporti
    ferroviari di minerali di ferro della Lorena e della Francia occidentale destinati
    al Belgio, al Lussemburgo e alla Saar (I testi in lingua tedesca e francese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/411/EGKS: Beschikking van de Commissie van 27 maart 1979 houdende een
    tweede verlenging van haar Beschikking 75/356/EGKS tot goedkeuring van de toepassing
    van bijzondere tarieven voor het vervoer per spoor van ijzererts van Lotharingen
    en West-Frankrijk naar België, Luxemburg en Saarland (Slechts de teksten in de
    Duitse en de Franse taal zijn authentiek)'
  type: main
