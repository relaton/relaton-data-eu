  content: Commission Regulation (EEC) No 3784/86 of 10 December 1986 re-establishing
    the levying of customs duties on stockings, understockings and the like, other
    than women' s stockings of synthetic textile fibres, products of category 12 (code
    40.0120), originating in Sri Lanka, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3600/85 apply
  type: main
