title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1223/74 of the Commission of 15 May 1974 derogating
    from Regulation (EEC) No 2637/70 as regards the period of validity of export licences
    for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1223/74 de la Commission, du 15 mai 1974, portant
    dérogation au règlement (CEE) n° 2637/70 en ce qui concerne la durée de validité
    des certificats d' exportation dans le secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1223/74 der Kommission vom 15. Mai 1974 über eine
    Abweichung von der Verordnung (EWG) Nr. 2637/70 hinsichtlich der Gültigkeitsdauer
    der Ausfuhrlizenzen für Getreide und Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1223/74 af 15. maj 1974 om afvigelse
    fra forordning (EØF) nr. 2637/70 for så vidt angår gyldighedsperioden for eksportlicenser
    for korn og ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1223/74 della Commissione, del 15 maggio 1974, recante
    deroga al regolamento (CEE) n. 2637/70 per quanto concerne la durata di validità
    dei titoli d' esportazione nei settori dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1223/74 van de Commissie van 15 mei 1974 houdende
    afwijking van Verordening (EEG) nr. 2637/70 inzake de geldigheidsduur van de uitvoercertificaten
    in de sectoren granen en rijst
  type: main
