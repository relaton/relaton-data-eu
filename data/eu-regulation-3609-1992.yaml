title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3609/92 of 14 December 1992 setting for the
    1992/93 marketing year the percentage referred to in Article 3 (1a), second subparagraph,
    of Regulation (EEC) No 426/86 in connection with the premium granted for products
    processed from tomatoes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3609/92 du Conseil, du 14 décembre 1992 fixant, pour
    la campagne 1992/1993, le pourcentage visé à l' article 3 paragraphe 1 bis deuxième
    alinéa du règlement (CEE) n° 426/86 en ce qui concerne la prime octroyée pour
    les produits transformés à base de tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3609/92 des Rates vom 14. Dezember 1992 zur Festsetzung
    des Prozentsatzes nach Artikel 3 Absatz 1a Unterabsatz 2 der Verordnung (EWG)
    Nr. 426/86 hinsichtlich der Prämie für Verarbeitungserzeugnisse aus Tomaten
    im Wirtschaftsjahr 1992/93
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3609/92 af 14. december 1992 om fastsættelse
    for produktionsåret 1992/93 af den procentdel, der er omhandlet i artikel 3,
    stk. 1a, andet afsnit, i forordning (EØF) nr. 426/86 for så vidt angår støtten
    til produkter forarbejdet på basis af tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3609/92 του Συμβουλίου
    της 14ης Δεκεμβρίου 1992 για τον καθορισμό, για
    την περίοδο 1992/93, του ποσοστού που αναφέρεται
    στο άρθρο 3 παράγραφος 1α δεύτερο εδάφιο του
    κανονισμού (ΕΟΚ) αριθ. 426/86 όσον αφορά τη χορηγούμενη
    πριμοδότηση στα μεταποιημένα προϊόντα με βάση
    τη ντομάτα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3609/92 del Consiglio, del 14 dicembre 1992, che fissa
    per la campagna 1992/1993 la percentuale di cui all' articolo 3, paragrafo 1 bis,
    secondo comma del regolamento (CEE) n. 426/86 per quanto riguarda il premio accordato
    ai prodotti trasformati a base di pomodori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3609/92 van de Raad van 14 december 1992 tot vaststelling,
    voor het verkoopseizoen 1992/1993, van het in artikel 3, lid 1 bis, tweede alinea,
    van Verordening (EEG) nr. 426/86 bedoelde percentage in verband met de premie
    voor op basis van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3609/92 do Conselho, de 14 de Dezembro de 1992, que
    fixa, para a campanha de 1992/1993, a percentagem prevista no n° 1a, segundo
    parágrafo, do artigo 3° do Regulamento (CEE) n° 426/86, no que se refere à
    concessão da ajuda aos produtos transformados à base de tomate
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3609/92 del Consejo, de 14 de diciembre de 1992, por
    el que se fija para la campaña 1992/93 el porcentaje contemplado en el párrafo
    segundo del apartado 1 bis del artículo 3 del Reglamento (CEE) n° 426/86 en
    lo referente a la prima concedida para los productos transformados a base de tomates
  type: main
