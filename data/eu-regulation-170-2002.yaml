    departementtien (Poseidom), Azorien ja Madeiran (Poseima) ja Kanariansaarten (Poseican)
    hyväksi annetuissa neuvoston asetuksissa (EY) N:o 1452/2001, (EY) N:o 1453/2001
    ja (EY) N:o 1454/2001 säädettyjen naudanliha-alan palkkiojärjestelmien soveltamista
    koskevista yksityiskohtaisista säännöistä ja asetuksen (EY) N:o 2912/95 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 170/2002/EK rendelete (2002. január 30.) egyes mezőgazdasági
    termékek tekintetében Franciaország tengerentúli megyéi (Poseidom), az Azori-szigetek
    és Madeira (Poseima), valamint a Kanári-szigetek (Poseican) javára egyedi intézkedések
    bevezetéséről szóló 1452/2001/EK, 1453/2001/EK és 1454/2001/EK tanácsi
    rendeletben előírt marha- és borjúhúsra vonatkozó jövedelemtámogatási
    rendszerek alkalmazása részletes szabályainak megállapításáról, valamint
    a 2912/95/EK rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 170/2002 della Commissione, del 30 gennaio 2002, che
    stabilisce le modalità di applicazione relative ai regimi di premi nel settore
    delle carni bovine previsti dai regolamenti (CE) n. 1452/2001, (CE) n. 1453/2001
    e (CE) n. 1454/2001 del Consiglio recanti misure specifiche per taluni prodotti
    agricoli a favore dei dipartimenti francesi d'oltremare (Poseidom), delle Azzorre
    e di Madera (Poseima) nonché delle isole Canarie (Poseican) e che abroga il regolamento
    (CE) n. 2912/95
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 170/2002 (2002. gada 30. janvāris), ar ko paredz
    sīki izstrādātus noteikumus to piemaksu sistēmu piemērošanai attiecībā
    uz liellopu un teļa gaļu, kas paredzētas Padomes regulās (EK) Nr. 1452/2001,
    (EK) Nr. 1453/2001 un (EK) Nr. 1454/2001, ar ko attiecībā uz konkrētiem lauksaimniecības
    produktiem par labu Francijas Aizjūras departamentiem (Poseidom), Azoru salām
    un Madeirai (Poseima) un Kanāriju salām (Poseican) ievieš īpašus pasākumus,
    un ar ko atceļ Regulu (EK) Nr. 2912/95
  type: main
- language: lt
  script: Latn
  content: 2002 m. sausio 30 d. Komisijos reglamentas (EB) Nr. 170/2002, nustatantis
    išsamias išmokų už galvijieną schemų, numatytų Tarybos reglamentuose (EB)
    Nr. 1452/2001, (EB) Nr. 1453/2001 ir (EB) Nr. 1454/2001, įvedančiuose specialias
    priemones tam tikriems Prancūzijos užjūrio departamento (Poseidom), Azorų
    ir Madeiros salų (Poseima) ir Kanarų salų (Poseican) žemės ūkio produktams,
    taikymo taisykles ir panaikinantis Reglamentą (EB) Nr. 2912/95
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru. 170/2002 tat-30 ta’ Jannar 2002
    li jistabbilixxi regoli dettaljati għall-applikazzjoni ta’ l-iskemi tal-premium
    għaċ-ċanga u l-vitella msemmija fir-Regolamenti tal-Kunsill (KE) Nru. 1452/2001,
    (KE) Nru. 1453/2001 u (KE) Nru. 1454/2001 li jintroduċu miżuri speċifiċi rigward
    ċerti prodotti agrikoli għall-benefiċċju tad-dipartimenti Franċiżi li qegħdin
    ‘il barra minn Franza (Poseidom), ta’ l-Ażores u ta’ Madeira (Poseima)
    u tal-Gżejjer Kanarji (Poseican) u li jirrevoka r-Regolament (KE) Nru. 2912/95.
  type: main
- language: nl
  script: Latn
