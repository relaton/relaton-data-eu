title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 170/2002 of 30 January 2002 laying down detailed
    rules for applying the premium schemes for beef and veal provided for in Council
    Regulations (EC) No 1452/2001, (EC) No 1453/2001 and (EC) No 1454/2001 introducing
    specific measures in respect of certain agricultural products for the benefit
    of the French overseas departments (Poseidom), the Azores and Madeira (Poseima)
    and the Canary Islands (Poseican) and repealing Regulation (EC) No 2912/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 170/2002 de la Commission du 30 janvier 2002 portant
    modalités d'application relatives aux régimes de primes dans le secteur de la
    viande bovine prévus par les règlements (CE) n° 1452/2001, (CE) n° 1453/2001
    et (CE) n° 1454/2001 du Conseil portant mesures spécifiques concernant certains
    produits agricoles en faveur des départements français d'outre-mer (Poseidom),
    des Açores et de Madère (Poseima), ainsi que des Canaries (Poseican) et abrogeant
    le règlement (CE) n° 2912/95
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 170/2002 der Kommission vom 30. Januar 2002 mit Durchführungsbestimmungen
