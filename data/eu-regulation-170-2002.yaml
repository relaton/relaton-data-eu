    vaststelling van uitvoeringsbepalingen voor de premieregelingen in de sector rundvlees
    die zĳn ingesteld bĳ de Verordeningen (EG) nr. 1452/2001, (EG) nr. 1453/2001
    en (EG) nr. 1454/2001 van de Raad houdende specifieke maatregelen voor bepaalde
    landbouwproducten ten behoeve van de Franse overzeese departementen (Poseidom),
    de Azoren en Madeira (Poseima) en de Canarische Eilanden (Poseican), en tot intrekking
    van Verordening (EG) nr. 2912/95
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 170/2002 z dnia 30 stycznia 2002 r. ustanawiające
    szczegółowe zasady stosowania systemów premii w sektorze wołowiny i cielęciny,
    określonych w rozporządzeniach Rady (WE) nr 1452/2001, (WE) nr 1453/2001 i (WE)
    nr 1454/2001, wprowadzające szczególne środki w odniesieniu do niektórych
    produktów rolnych na rzecz francuskich departamentów zamorskich (Poseidom),
    Azorów i Madery (Poseima) i Wysp Kanaryjskich (Poseican) oraz uchylające rozporządzenie
    (WE) nr 2912/95
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 170/2002 da Comissão, de 30 de Janeiro de 2002,
    que estabelece normas de execução relativas aos regimes de prémios no sector
    da carne de bovino previstos pelos Regulamentos (CE) n.° 1452/2001, (CE) n.°
    1453/2001 e (CE) n.° 1454/2001 do Conselho, que estabelecem medidas específicas
    relativas a determinados produtos agrícolas a favor dos departamentos franceses
    ultramarinos (Poseidom), dos Açores e da Madeira (Poseima) e das ilhas Canárias
    (Poseican), e que revoga o Regulamento (CE) n.° 2912/95
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 170/2002 z 30. januára 2002 stanovujúce podrobné
    pravidlá uplatňovania systémov prémií na hovädzie a teľacie mäso, ustanovených
    v nariadeniach Rady (ES) č. 1452/2001, (ES) č. 1453/2001 a (ES) č. 1454/2001,
    zavádzajúcich špecifické opatrenia, pokiaľ ide o určité poľnohospodárske
    výrobky v prospech francúzskych zámorských departementov (Poseidom), Azor
    a Madeiry (Poseima) a Kanárskych ostrovov (Poseican), a rušiace nariadenie (ES)
    č. 2912/95
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 170/2002 z dne 30. januarja 2002 o določitvi
    podrobnih pravil za uporabo shem premij za goveje in telečje meso iz uredb Sveta
    (ES) št. 1452/2001, (ES) št. 1453/2001 in (ES) št. 1454/2001 o uvedbi posebnih
    ukrepov v zvezi z nekaterimi kmetijskimi proizvodi v korist francoskih čezmorskih
    departmajev (Poseidom), Azorov in Madeire (Poseima) ter Kanarskih otokov (Poseican)
    in o razveljavitvi Uredbe (ES) št. 2912/95
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 170/2002 de la Comisión, de 30 de enero de 2002, por
    el que se establecen disposiciones de aplicación relativas a los regímenes de
    primas en el sector de la carne de vacuno establecidos por el Reglamento (CE)
    n° 1452/2001, el Reglamento (CE) n° 1453/2001 y el Reglamento (CE) n° 1454/2001
    del Consejo por los que se aprueban medidas específicas en favor de los departamentos
    franceses de ultramar (Poseidom), de Azores y Madeira (Poseima) y de las islas
    Canarias (Poseican) en relación con determinados productos agrícolas, y por
    el que se deroga el Reglamento (CE) n° 2912/95
  type: main
