    stanovené v nařízeních Rady (ES) č. 1452/2001, (ES) č. 1453/2001 a (ES)
    č. 1454/2001, kterými se zavádějí zvláštní opatření pro francouzské
    zámořské departementy (Poseidom), Azory a Madeiru (Poseima) a Kanárské ostrovy
    (Poseican) týkající se některých zemědělských produktů a zrušuje nařízení
    (ES) č. 2912/95
  type: main
- language: da
  script: Latn
