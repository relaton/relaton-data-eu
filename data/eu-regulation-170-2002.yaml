    1452/2001, (EG) Nr. 1453/2001 und (EG) Nr. 1454/2001 des Rates zur Einführung
    von Sondermaßnahmen für bestimmte landwirtschaftliche Erzeugnisse zugunsten
    der französischen überseeischen Departements (Poseidom), der Azoren und Madeiras
    (Poseima) bzw. der Kanarischen Inseln (Poseican) sowie zur Aufhebung der Verordnung
    (EG) Nr. 2912/95
  type: main
- language: cs
  script: Latn
