title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 881/94 of 21 April 1994 determining the extent
    to which applications lodged in April 1994 for import licences for fresh, chilled
    or preserved beef and veal under the import arrangements provided for in the Bilateral
    Agreement between the Community and Sweden can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 881/94 de la Commission, du 21 avril 1994, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en avril 1994 pour certaines viandes bovines fraîches ou réfrigérées
    ou sous forme de conserves dans le cadre du régime d'importation prévu dans
    l'accord bilatéral agricole entre la Communauté et la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 881/94 der Kommission vom 21. April 1994 zur Genehmigung
    der im April 1994 für die Einfuhr von frischem oder gekühltem Rindfleisch oder
    von Rindfleisch in Konserven im Rahmen der Einfuhrregelung des zwischen der Gemeinschaft
    und Schweden geschlossenen bilateralen landwirtschaftlichen Abkommens gestellten
    Anträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 881/94 af 21. april 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i april 1994, om
    importlicenser for oksekød, fersk, kølet eller i form af konserves, i forbindelse
    med den importordning, der er fastsat i den bilaterale landbrugsaftale mellem
    Fællesskabet og Sverige
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 881/94 της Επιτροπής
    της 21ης Απριλίου 1994 για τον καθορισμό του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Απρίλιο 1994, για ορισμένα νωπά
    ή διατηρημένα με απλή ψύξη βόεια κρέατα ή με
    τη μορφή κονσερβών στο πλαίσιο του καθεστώτος
    εισαγωγής που προβλέπεται στη διμερή γεωργική
    συμφωνία μεταξύ της Κοινότητας και της Σουηδίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 881/94 della Commissione, del 21 aprile 1994, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli di importazione
    presentate nel mese di aprile 1994 per talune carni bovine fresche o refrigerate
    o in conserva nel quadro del regime di importazione previsto dall'accordo bilaterale
    agricolo tra la Comunità e la Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 881/94 van de Commissie van 21 april 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers of gekoeld rundvlees of rundvleesconserven, die in april 1994 zijn ingediend
    op grond van de invoerregeling die is vastgesteld in de bilaterale landbouwovereenkomst
    tussen de Gemeenschap en Zweden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 881/94 da Comissão, de 21 de Abril de 1994, que determina
    em que medida podem ser aceites os pedidos de certificado de importação apresentados
    em Abril de 1994 para determinadas carnes de bovino frescas ou refrigeradas ou
    sob forma de conservas, no âmbito do regime de importação previsto no Acordo
    agrícola bilateral entre a Comunidade e a Suécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 881/94 de la Comisión, de 21 de abril de 1994, por el
    que se determina la proporción en que podrán aceptarse las solicitudes de licencias
    de importación de algunas carnes de vacuno frescas, refrigeradas o en conserva
    presentadas en abril de 1994 al amparo del régimen de importación establecido
    en el Acuerdo agrario bilateral celebrado entre la Comunidad y Suecia
  type: main
