title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2204/85 of 30 July 1985 fixing for the 1985
    marketing year the Community offer price for mandarins including tangerines and
    satsumas, Wilkings and other similar citrus hybrids, with the exception of clementines,
    applicable as regards Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2204/85 de la Commission du 30 juillet 1985 fixant,
    pour la campagne 1985, le prix d' offre communautaire valable pour les mandarines,
    y compris tangerines et satsumas, wilkings et autres hybrides similaires d' agrumes,
    à l' exclusion des clémentines, applicable vis-à-vis de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2204/85 der Kommission vom 30. Juli 1985 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen
    Clementinen, gegenüber Griechenland für das Wirtschaftsjahr 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2204/85 af 30. juli 1985 om fastsættelse
    for produktionsåret 1985 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på mandariner (herunder tangeriner og satsumas), wilkings og andre lignende krydsninger
    af citrusfrugter bortset fra clementiner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2204/85 της Επιτροπής
    της 30ής Ιουλίου 1985 περί καθορισμού, για την
    περίοδο εμπορίας 1985, της ισχύουσας κοινοτικής
    τιμής προσφοράς για τα μανταρίνια, συμπεριλαμβανομένων
    των tangerines, satsumas, wilkings και άλλων παρόμοιων υβριδίων
    εσπεριδοειδών, εξαιρέσει των κλημεντινών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2204/85 della Commissione del 30 luglio 1985 che fissa,
    per la campagna 1985, il prezzo d' offerta comunitario applicabile nei confronti
    della Grecia per i mandarini, compresi i tangerini e i mandarini satsuma (o sazuma),
    wilkings e altri simili ibridi di agrumi, escluse le clementine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2204/85 van de Commissie van 30 juli 1985 tot vaststelling,
