  content: Council Directive 84/223/EEC of 10 April 1984 amending for the 20th time
    Directive 64/54/EEC on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 84/233/CEE du Conseil du 10 avril 1984 portant vingtième modification
    de la directive 64/54/CEE relative au rapprochement des législations des États
    membres concernant les agents conservateurs pouvant être employés dans les denrées
    destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 84/223/EWG des Rates vom 10. April 1984 zur zwanzigsten Änderung
    der Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 84/223/EØF af 10. april 1984 om 20. ændring af direktiv
    64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
