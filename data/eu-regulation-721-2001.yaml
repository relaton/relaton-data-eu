title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 721/2001 of 10 April 2001 determining to
    what extent applications lodged in April 2001 for the right to import bulls, cows
    and heifers other than for slaughter of certain Alpine and mountain breeds can
    be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 721/2001 de la Commission du 10 avril 2001 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2001 pour l'importation de taureaux, vaches et génisses,
    autres que ceux destinés à la boucherie, de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 721/2001 der Kommission vom 10. April 2001 zur Bestimmung
    des Umfangs, in welchem den im April 2001 gestellten Anträgen auf Einfuhrrechte
    für die Einfuhr nicht zum Schlachten bestimmter Stiere, Kühe und Färsen bestimmter
    Höhenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 721/2001 af 10. april 2001 om det omfang,
    i hvilket der kan imødekommes ansøgninger om importrettigheder, som er indgivet
    i april 2001 vedrørende import af tyre, køer og kvier af bestemte alpine racer
    og bjergracer, ikke bestemt til slagtning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 721/2001 της Επιτροπής,
    της 10ης Απριλίου 2001, που καθορίζει στο βαθμό
    κατά τον οποίο μπορεί να δοθεί συνέχεια στις
    αιτήσεις δικαιωμάτων εισαγωγής που κατατίθενται
    τον Απρίλιο 2001 για την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων, άλλων πλην των προοριζομένων
    προς σφαγή, ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 721/2001, annettu 10 päivänä huhtikuuta 2001,
    tiettyihin alppi- ja vuoristorotuihin kuuluvien muiden kuin teuraseläimiksi tarkoitettujen
    sonnien, lehmien ja hiehojen tuonnista huhtikuussa 2001 jätettyjen tuontioikeushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 721/2001 della Commissione, del 10 aprile 2001, che
    stabilisce in quale misura è possibile accogliere le domande di diritti d'importazione
    presentate nel mese di aprile 2001 per l'importazione di tori, vacche e giovenche,
    diversi da quelli destinati alla macellazione, di alcune razze alpine e di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 721/2001 van de Commissie van 10 april 2001 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in april 2001 zĳn ingediend voor de invoer van stieren,
    koeien en vaarzen, niet bestemd voor de slacht, van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 721/2001 da Comissão, de 10 de Abril de 2001, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação,
    apresentados em Abril de 2001 para a importação de touros, vacas e novilhas,
    com exclusão dos destinados ao abate, de certas raças alpinas e de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 721/2001 de la Comisión, de 10 de abril de 2001, por
    el que se determina cómo se satisfacen las solicitudes de derechos de importación
    presentadas en el mes de abril de 2001 para la importación de toros, vacas y
    novillas no destinados al matadero, de determinadas razas alpinas y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 721/2001 av den 10 april 2001 om i vilken
    utsträckning de ansökningar om importrättigheter som inlämnats i april 2001
    kan beviljas för import av tjurar, kor och kvigor av vissa alp- och bergraser
    som inte är slaktboskap
  type: main
