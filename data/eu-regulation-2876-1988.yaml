title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2876/88 of 16 September 1988 re-establishing
    the levying of customs duties on trousers, bib and brace overalls, breeches and
    shorts, knitted or crocheted, products of category 28 (order No 40.0280), and
    men's or boys' knitted or crocheted suits and ensembles, products of category
    75 (order No 40.0750), originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2876/88 de la Commission du 16 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux pantalons,
    salopettes, culottes et shorts en bonneterie, de la catégorie de produits n°
    28 (numéro d'ordre 40.0280) et aux costumes, complets et ensembles en bonneterie
    pour hommes et garçonnets de la catégorie de produits n° 75 (numéro d'ordre
    40.0750), originaires de l'Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2876/88 DER KOMMISSION vom 16. September 1988 zur
    Wiedereinführung des Zollsatzes für lange Hosen, Latzhosen und kurze Hosen,
    aus Gewirken, der Warenkategorie Nr. 28 (lfd. Nr. 40.0280) und Anzüge und Kombinationen,
    aus Gewirken, für Männer und Knaben, der Warenkategorie Nr. 75 (lfd. Nr. 40.0750)
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
