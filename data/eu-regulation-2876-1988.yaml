    og sæt, af trikotage, til mænd og drenge, under varekategori nr. 75 (løbenummer
    40.0750), som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
