title:
- language: en
  script: Latn
  content: '91/652/EEC: Commission Decision of 10 December 1991 on the establishment
    of the Community support framework for Community structural assistance on the
    improvement of the conditions under which agricultural products are processed
    and marketed in the United Kingdom (with the exception of Northern Ireland) (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/652/CEE: Décision de la Commission du 10 décembre 1991 concernant
    l''établissement du cadre communautaire d''appui pour les interventions structurelles
    communautaires en matière d''amélioration des conditions de transformation et
    de commercialisation des produits agricoles au Royaume-Uni (à l''exception de
    l''Irlande du Nord) (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 10. Dezember 1991 zur Aufstellung eines
    gemeinschaftlichen Förderkonzepts für gemeinschaftliche Strukturinterventionen
    zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen landwirtschaftlicher
    Erzeugnisse im Vereinigten Königreich (ohne Nordirland) (Nur der englische Text
    ist verbindlich) (91/652/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 10. december 1991 om fastlæggelse af fællesskabsstøtterammen
    for EF'' s strukturinterventioner i Det Forenede Kongerige (undtagen Nordirland)
    til forbedring af vilkårene for forarbejdning og afsætning af landbrugsprodukter
    (Kun den engelske udgave er autentisk) (91/652/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/652/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Δεκεμβρίου 1991 σχετικά με την κατάρτιση του
    κοινοτικού πλαισίου στήριξης παροχής κοινοτικής
    διαρθρωτικής βοήθειας στο Ηνωμένο Βασίλειο
    ( χωρίς τη Βόρεια Ιρλανδία ) για τη βελτίωση
    των συνθηκών μεταποίησης και εμπορίας των
    γεωργικών προϊόντων'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 10 dicembre 1991 riguardante la definizione
    del quadro comunitario di sostegno per gli interventi strutturali della Comunità
    in ordine al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli nel Regno Unito (esclusa l'' Irlanda del Nord) (Il testo
    in lingua inglese è il solo facente fede) (91/652/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 10 december 1991 tot vaststelling van
    het communautair bestek voor structurele bijstandsverlening van de Gemeenschap
    voor de verbetering van de verwerking en de afzet van landbouwprodukten in het
    Verenigd Koninkrijk (met uitzondering van Noord-Ierland) (Slechts de tekst in
    de Engelse taal is authentiek) (91/652/EEG) #'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 10 de Dezembro de 1991 que estabelece um quadro
    comunitário de apoio para as intervenções estruturais comunitárias, destinadas
    à melhoria das condições de transformação e comercialização dos produtos
    agrícolas no Reino Unido (excluindo a Irlanda do Norte) (Apenas faz fé o texto
    em língua inglesa) (91/652/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 10 de diciembre de 1991 por la que se establece
    el marco comunitario de apoyo para la ayuda estructural comunitaria al Reino Unido
    (exceptuando Irlanda del Norte) en la mejora de las condiciones de transformación
    y comercialización de los productos agrícolas (El texto en lengua inglesa es
    el único auténtico) (91/652/CEE) #'
