title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2022/703 of 5 May 2022 concerning
    the renewal of the authorisation of a preparation of Bacillus velezensis DSM 15544
    as a feed additive for weaned piglets, the authorisation for all avian species
    and categories, amending Implementing Regulation (EU) 2016/897, Implementing Regulation
    (EU) 2017/2312 and Implementing Regulation (EU) 2018/1081 and repealing Regulation
    (EU) No 333/2010, Regulation (EU) No 184/2011 and Implementing Regulation (EU)
    2019/893 (holder of the authorisation: Asahi Biocycle Co. Ltd., represented in
    the Union by Pen & Tec Consulting S.L.U.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/703 de la Commission du 5 mai 2022
    concernant le renouvellement de l’autorisation d’une préparation de Bacillus
    velezensis DSM 15544 en tant qu’additif pour l’alimentation des porcelets
    sevrés ainsi que l’autorisation de cette préparation pour toutes les espèces
    et catégories aviaires, modifiant le règlement d’exécution (UE) 2016/897,
    le règlement d’exécution (UE) 2017/2312 et le règlement d’exécution (UE)
    2018/1081, et abrogeant le règlement (UE) no 333/2010, le règlement (UE) no
    184/2011 et le règlement d’exécution (UE) 2019/893 (titulaire de l’autorisation:
    Asahi Biocycle Co. Ltd., représentée dans l’Union par Pen & Tec Consulting
    S.L.U.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/703 der Kommission vom 5. Mai 2022
    zur Verlängerung der Zulassung einer Zubereitung aus Bacillus velezensis DSM
    15544 als Zusatzstoff in Futtermitteln für entwöhnte Ferkel, zur Zulassung für
    alle Arten und Kategorien von Vögeln, zur Änderung der Durchführungsverordnung
    (EU) 2016/897, der Durchführungsverordnung (EU) 2017/2312 und der Durchführungsverordnung
    (EU) 2018/1081 sowie zur Aufhebung der Verordnung (EU) Nr. 333/2010, der Verordnung
    (EU) Nr. 184/2011 und der Durchführungsverordnung (EU) 2019/893 (Zulassungsinhaber:
    Asahi Biocycle Co. Ltd., in der Union vertreten durch Pen & Tec Consulting S.L.U.)'
