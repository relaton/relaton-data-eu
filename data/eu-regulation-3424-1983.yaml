title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3424/83 of 30 November 1983 re-establishing
    the levying of customs duties on knitted or crocheted trousers, products of category
    28 (code 0280), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3424/83 de la Commission du 30 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux pantalons
    de bonneterie de la catégorie de produits no 28 (code 0280), originaires de l'
    Inde, bénéficiaire des préférences tarifaires prévues par le règlement (CEE)
    no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3424/83 der Kommission vom 30. November 1983 über
    die Wiedereinführung des Zollsatzes für Hosen aus Gewirken der Warenkategorie
    Nr. 28 (Kennziffer 0280) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3424/83 af 30. november 1983 om genindførelse
    af opkrævning af toldafgifter for benklæder af trikotage, under varekategori
    nr. 28 (koder 0280), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3424/83 της Επιτροπής
    της 30ής Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για πανταλόνια
    πλεκτά της κατηγορίας 28 (κωδικός 0280), καταγωγής
    Ινδίας, δικαιούχου των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3424/83 della Commissione del 30 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili ai pantaloni a maglia,
    della categoria di prodotti n. 28 (codice 0280), originari dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3424/83 van de Commissie van 30 november 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op broeken
    van brei- of haakwerk van de categorie van produkten nr. 28 (codenummer 0280),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
