---
id: EUDecision16992001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision No 1699/2001/ECSC of 28 August 2001 initiating a "new
    exporter" review of Decision No 283/2000/ECSC imposing a definitive anti-dumping
    duty on imports of certain flat rolled products of iron or non-alloy steel, of
    a width of 600 mm or more, not clad, plated or coated, in coils, not further worked
    than hot-rolled, originating, inter alia, in India, repealing the duty with regard
    to imports from one exporter in this country and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Décision n° 1699/2001/CECA de la Commission du 28 août 2001 portant
    ouverture d'un réexamen, au titre de nouvel exportateur, de la décision n°
    283/2000/CECA instituant un droit antidumping définitif sur les importations
    de certains produits laminés plats, en fer ou en aciers non alliés, d'une largeur
    de 600 millimètres ou plus, non plaqués ni revêtus, enroulés, simplement laminés
    à chaud, originaires, entre autres, de l'Inde, abrogeant le droit applicable
    aux importations d'un exportateur de ce pays et soumettant ces importations à
    enregistrement
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 1699/2001/EGKS der Kommission vom 28. August 2001 zur
    Einleitung einer Überprüfung der Entscheidung Nr. 283/2000/EGKS zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter flachgewalzter
    Erzeugnisse aus Eisen oder nichtlegiertem Stahl, mit einer Breite von 600 mm oder
    mehr, weder plattiert noch überzogen, in Rollen (Coils), nur warmgewalzt, mit
    Ursprung unter anderem in Indien (Überprüfung für einen neuen Ausführer),
    zur Außerkraftsetzung des Zolls gegenüber den Einfuhren der Ware von einem Ausführer
    in diesem Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning nr. 1699/2001/EKSF af 28. august 2001 om indledning
    en fornyet undersøgelse (ny eksportør) af afgørelse nr. 283/2000/EKSF om indførelse
    af en endelig antidumpingtold på importen af visse fladvalsede produkter af jern
    og ulegeret stål, af bredde 600 mm og derover, ikke pletterede, belagte eller
    overtrukne, i oprullet stand, kun varmtvalsede, med oprindelse i bl.a. Indien,
    om ophævelse af tolden for så vidt angår importen fra en eksportør i dette
    land og om registrering af denne import
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 1699/2001/ΕΚΑΧ της Επιτροπής,
    της 28ης Αυγούστου 2001, για την έναρξη διαδικασίας
    επανεξέτασης, όσον αφορά έναν "νέο εξαγωγέα",
    της απόφασης αριθ. 283/2000/ΕΚΑΧ για την επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    ορισμένων πλατέων προϊόντων έλασης από σίδερο
    ή από μη κραματοποιημένο χάλυβα, πλάτους 600
    mm ή περισσότερο, μη επιστρωμένων με άλλο μέταλλο
    ούτε επενδυμένων περιελιγμένων, που έχουν
    απλώς υποβληθεί σε θερμή έλαση, καταγωγής,
    μεταξύ άλλων, Ινδίας, και για την κατάργηση
    του δασμού όσον αφορά τις εισαγωγές από έναν
    εξαγωγέα της εν λόγω χώρας και την υπαγωγή
    των εισαγωγών αυτών σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission päätös N:o 1699/2001/EHTY, tehty 28 päivänä elokuuta 2001,
    lopullisen polkumyyntitullin käyttöönotosta tiettyjen muun muassa Intiasta
    peräisin olevien raudasta tai seostamattomasta teräksestä valmistettujen, vähintään
    600 millimetrin levyisten pleteroimattomien ja muulla tavalla metallilla tai muulla
    aineella pinnoittamattomien, kelattujen, ei enempää valmistettujen kuin kuumavalssattujen
    levyvalmisteiden tuonnissa tehtyyn päätökseen N:o 283/2000/EHTY liittyvän
    "uutta viejää" koskevan tarkastelun vireillepanosta, yhden kyseisen maan viejän
    tuontiin sovellettavan tullin kumoamisesta ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Decisione n. 1699/2001/CECA della Commissione, del 28 agosto 2001, che
    avvia un riesame relativo ai "nuovi esportatori" della decisione n. 283/2000/CECA
    che istituisce un dazio antidumping definitivo sulle importazioni di alcuni tipi
    di prodotti laminati piatti, di ferro o di acciai non legati, di larghezza uguale
    o superiore a 600 mm, non placcati né rivestiti, arrotolati, semplicemente laminati
    a caldo, originari, tra l'altro, dell'India, e che abroga il dazio per quanto
    riguarda le importazioni effettuate da un esportatore di detto paese e stabilisce
    che tali importazioni siano soggette a registrazione
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 1699/2001/EGKS van de Commissie van 28 augustus 2001 tot
    inleiding van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening
    van Beschikking nr. 283/2000/EGKS tot instelling van een definitief antidumpingrecht
    op gewalste, platte producten van ĳzer of van niet-gelegeerd staal, met een breedte
    van 600 mm of meer, niet geplateerd, noch bekleed, opgerold, enkel warmgewalst,
    uit, onder meer, India, tot intrekking van het recht ten aanzien van een producent/exporteur
    in India en tot registratie van de invoer
  type: main
- language: pt
  script: Latn
  content: Decisão n.° 1699/2001/CECA da Comissão, de 28 de Agosto de 2001, relativa
    ao início de um reexame, respeitante a um "novo exportador", da Decisão n.°
    283/2000/CECA que cria um direito anti-dumping definitivo sobre as importações
    de certos produtos laminados planos de ferro ou aço não ligado, de largura igual
    ou superior a 600 mm, não chapeados, folheados ou revestidos, em rolos, simplesmente
    laminados a quente, originários, designadamente, da Índia, que revoga o direito
    relativo às importações de um exportador neste país e sujeitando as importações
    a registo
  type: main
- language: es
  script: Latn
  content: Decisión n° 1699/2001/CECA de la Comisión, de 28 de agosto de 2001,
    por la que se inicia un procedimiento de reconsideración para un "nuevo exportador",
    de la Decisión n° 283/2000/CECA, por la que se establece un derecho antidumping
    definitivo sobre las importaciones de determinados productos laminados planos,
    de hierro o de acero sin alear, de anchura superior o igual a 600 mm, sin chapar
    ni revestir, enrollados, simplemente laminados en caliente, originarias entre
    otros países de la India, por la que se deroga el derecho aplicable a las importaciones
    de un exportador de este país y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut nr 1699/2001/EKSG av den 28 augusti 2001 om inledande
    av en översyn avseende en ny exportör när det gäller beslut nr 283/2000/EKSG,
    om införande av en slutgiltig antidumpningstull på import av vissa valsade platta
    produkter av järn eller olegerat stål, med en bredd av minst 600 mm, varken
    pläterade, på annat sätt metallöverdragna eller försedda med annat överdrag,
    i ringar eller rullar, inte vidare bearbetade efter varmvalsningen, med ursprung
    i bland annat Indien, om upphävande av tullen på import från en exportör i
    detta land och om registrering av denna import
  type: main
