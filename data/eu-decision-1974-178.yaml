title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Republic of
    Italy for expenditure on vocational retraining and resettlement operations carried
    out by the Ministry of Labour and National Insurance and several other Italian
    bodies
  type: main
- language: fr
  script: Latn
  content: Décision 74/178/CEE de la Commission, du 21 décembre 1973, portant octroi
    du concours du Fonds social européen, prévu à l'article 125 du Traité, au
    bénéfice de la République italienne pour des dépenses relatives à des opérations
    de rééducation professionnelle et de réinstallation effectuées par le Ministère
    du travail et de la prévoyance sociale et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Gewährung des in
    Artikel 125 des Vertrages vorgesehenen Zuschusses aus dem Europäischen Sozialfonds
    an die Italienische Republik zu Aufwendungen für vom "Ministero del Lavoro e
    della Previdenza sociale" und mehreren italienischen Körperschaften durchgeführte
    Berufsumschulungs- und Umsiedlungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ydelse af tilskud i henhold
    til traktatens artikel 125 fra Den europæiske Socialfond til Den italienske Republik
    til udgifter ved foranstaltninger til faglig omskoling og flytning gennemført
    af "Ministero del Lavoro e della Previdenza sociale" og flere andre italienske
    organer
  type: main
- language: it
  script: Latn
  content: '74/178/CEE: Decisione della Commissione, del 21 dicembre 1973, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica italiana per spese concernenti operazioni
    di riqualificazione professionale e di nuova sistemazione effettuate dal «Ministero
    del lavoro e della previdenza sociale», e da vari enti italiani'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Italiaanse Republiek voor door het Ministerie van Arbeid
    en Sociale Voorzorg gemaakte herscholingskosten
  type: main
