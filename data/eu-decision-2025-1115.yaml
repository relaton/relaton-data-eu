    Europeu relativo ao Trabalho das Tripulações de Veículos que efetuam Transportes
    Rodoviários Internacionais (AETR) e no âmbito do grupo de trabalho para os transportes
    rodoviários da Comissão Económica das Nações Unidas para a Europa (UNECE),
    no que respeita a uma proposta tendente a conciliar o AETR com as principais alterações
    recentes do Regulamento (CE) n.° 561/2006
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/1115 a Consiliului din 12 mai 2025 privind poziția care
    urmează să fie adoptată în numele Uniunii Europene, în cadrul Grupului de
    experți pentru Acordul european privind activitatea echipajelor vehiculelor care
    efectuează transporturi rutiere internaționale (AETR) și în cadrul Grupului
    de lucru al Comisiei Economice pentru Europa a Organizației Națiunilor Unite
    pentru transportul rutier, în ceea ce privește o propunere de aliniere a AETR
    la cele mai recente principale modificări ale Regulamentului (CE) nr. 561/2006
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/1115 z 12. mája 2025 o pozícii, ktorá sa
    má v mene Európskej únie zaujať v skupine expertov pre Európsku dohodu o
    práci osádok vozidiel v medzinárodnej cestnej doprave (AETR) a v pracovnej
    skupine Európskej hospodárskej komisie Organizácie Spojených národov pre
    cestnú dopravu, pokiaľ ide o návrh zladiť AETR s hlavnými nedávnymi zmenami
    nariadenia (ES) č. 561/2006
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/1115 z dne 12. maja 2025 o stališču, ki se v imenu
    Evropske unije zastopa v skupini strokovnjakov za Evropski sporazum o delu posadk
    na vozilih, ki opravljajo mednarodne cestne prevoze (AETR), in v delovni skupini
    za cestni promet Ekonomske komisije Združenih narodov za Evropo glede predloga
    za uskladitev Sporazuma AETR z glavnimi nedavnimi spremembami Uredbe (ES) št.
    561/2006
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/1115 del Consejo, de 12 de mayo de 2025, por la que
    se establece la posición que debe adoptarse, en nombre de la Unión Europea,
    en el Grupo de expertos sobre el Acuerdo europeo sobre el trabajo de las tripulaciones
    de los vehículos que efectúen transportes internacionales por carretera (AETR)
    y en el Grupo de Trabajo de Transporte por Carretera de la Comisión Económica
    para Europa de las Naciones Unidas, por lo que respecta a una propuesta para adaptar
    el AETR a las principales modificaciones recientes del Reglamento (CE) n.° 561/2006
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/1115 av den 12 maj 2025 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i expertgruppen för den europeiska
    överenskommelsen om arbetsförhållanden för fordonsbesättningar vid internationella
    vägtransporter (AETR) och i arbetsgruppen för vägtransporter inom FN:s ekonomiska
    kommission för Europa, vad gäller ett förslag om att anpassa AETR efter de
    huvudsakliga senaste ändringarna av förordning (EG) nr 561/2006
