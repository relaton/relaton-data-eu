    ds. Umowy europejskiej dotyczącej pracy załóg pojazdów wykonujących międzynarodowe
    przewozy drogowe (AETR) oraz w ramach Grupy Roboczej ds. Transportu Drogowego
    Europejskiej Komisji Gospodarczej ONZ w odniesieniu do wniosku dotyczącego dostosowania
