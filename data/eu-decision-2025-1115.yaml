    dwar il-Ftehim Ewropew dwar il-Ħidma ta’ Ekwipaġġi ta’ Vetturi Involuti
    fit-Trasport Internazzjonali bit-Triq (AETR) u fi ħdan il-Grupp ta’ Ħidma
    dwar it-Trasport bit-Triq tal-Kummissjoni Ekonomika għall-Ewropa tan-Nazzjonijiet
