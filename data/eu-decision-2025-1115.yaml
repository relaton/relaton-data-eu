    група по Европейската спогодба за работата
    на екипажите на превозните средства, извършващи
    международни автомобилни превози (AETR), както
    и в рамките на работната група по автомобилния
    транспорт към Икономическата комисия за Европа
    на Организацията на обединените нации във
    връзка с предложението за привеждане на AETR
