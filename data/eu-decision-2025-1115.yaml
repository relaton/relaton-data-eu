    ekonomikos komisijos Europos šalių susitarimo dėl kelių transporto priemonių
    ekipažų, važinėjančių tarptautiniais maršrutais, darbo (AETR) ekspertų
    grupėje ir Kelių transporto darbo grupėje, dėl pasiūlymo suderinti AETR su
    pagrindiniais naujausiais Reglamento (EB) Nr. 561/2006 pakeitimais
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2025/1115 tat-12 ta’ Mejju 2025 dwar il-pożizzjoni
