title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1115 of 12 May 2025 on the position to be taken
    on behalf of the European Union within the Group of Experts on the European Agreement
    concerning the Work of Crews of Vehicles Engaged in International Road Transport
    (AETR) and within the Working Party on Road Transport of the United Nations Economic
    Commission for Europe as regards a proposal to align the AETR with the main recent
    amendments to Regulation (EC) No 561/2006
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1115 du Conseil du 12 mai 2025 relative à la position
    à prendre au nom de l’Union européenne au sein du groupe d’experts de l’accord
    européen relatif au travail des équipages des véhicules effectuant des transports
    internationaux par route (AETR) et au sein du groupe de travail des transports
    routiers de la Commission économique pour l’Europe des Nations unies (CEE-ONU)
    en ce qui concerne une proposition visant à aligner l’AETR sur les principales
    modifications récemment apportées au règlement (CE) n° 561/2006
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/1115 des Rates vom 12. Mai 2025 zur Festlegung des
