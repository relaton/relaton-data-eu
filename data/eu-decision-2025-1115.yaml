    overeenstemming te brengen met de belangrijkste recente wijzigingen van Verordening
    (EG) nr. 561/2006
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2025/1115 z dnia 12 maja 2025 r. w sprawie stanowiska,
