    sull’accordo europeo relativo alle prestazioni lavorative degli equipaggi dei
    veicoli addetti ai trasporti internazionali su strada (AETR) e in sede di gruppo
    di lavoro dei trasporti su strada della Commissione economica per l’Europa delle
