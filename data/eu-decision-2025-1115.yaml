    zum Europäischen Übereinkommen über die Arbeit des im internationalen Straßenverkehr
    beschäftigten Fahrpersonals (AETR) und im Hauptausschuss Straßenverkehr der
    Wirtschaftskommission für Europa der Vereinten Nationen in Bezug auf einen Vorschlag
    zur Angleichung des AETR an die wichtigsten jüngsten Änderungen der Verordnung
    (EG) Nr. 561/2006 zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2025/1115 на Съвета от 12 май 2025 година
