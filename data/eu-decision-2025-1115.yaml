    apkalpju darbu starptautiskajos autopārvadājumos (AETR) Ekspertu grupā un Apvienoto
    Nāciju Organizācijas Eiropas Ekonomikas komisijas Autotransporta darba grupā
    attiecībā uz priekšlikumu saskaņot AETR ar galvenajiem jaunākajiem Regulas
    (EK) Nr. 561/2006 grozījumiem
  type: main
- language: lt
  script: Latn
  content: 2025 m. gegužės 12 d. Tarybos sprendimas (ES) 2025/1115, dėl pozicijos,
