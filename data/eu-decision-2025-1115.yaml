    végző járművek személyzetének munkájáról szóló európai megállapodással
    (AETR-megállapodás) foglalkozó szakértői csoportjában és a közúti közlekedéssel
    foglalkozó munkacsoportjában az AETR-megállapodásnak az 561/2006/EK rendelet
