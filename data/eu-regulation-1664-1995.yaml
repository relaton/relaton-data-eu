  script: Latn
  content: Commission Regulation (EC) No 1664/95 of 7 July 1995 amending Regulations
    in the sector of cereals, oilseeds and protein crop fixing before 1 February 1995
    certain prices and amounts whose values in ecus have been adjusted because of
    the abolition of the corrective factor in agricultural conversion rates
  type: main
- language: fr
  script: Latn
