  content: Règlement (CEE) n° 864/68 du Conseil, du 28 juin 1968, portant ouverture,
    répartition et mode de gestion des contingents tarifaires communautaires de tissus
    de soie ou de bourre de soie (schappe) et de tissus de coton, tissés sur métiers
    à main, des positions EX 50.09 et EX 55.09 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 864/68 des Rates vom 28. Juni 1968 über die Eröffnung,
    Aufteilung und Verwaltung der Gemeinschaftszollkontingente für auf Handwebstühlen
    hergestellte Gewebe aus Seide oder Schappeseide oder aus Baumwolle der Tarifnummern
    ex 50.09 und ex 55.09 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 864/68 del Consiglio, del 28 giugno 1968, relativo
    all'apertura, alla ripartizione e alle modalità di gestione dei contingenti tariffari
    comunitari per alcuni tessuti di seta o di borra di seta (schappe) e di cotone,
    lavorati su telai a mano, delle voci ex 50.09 e ex 55.09 della tariffa doganale
    comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 864/68 van de Raad van 28 juni 1968 betreffende de
    opening, de verdeling en de wijze van beheer van de communautaire tariefcontingenten
    voor weefsels van zijde of van vlokzijde en weefsels van katoen, vervaardigd op
    handweefgetouwen, van de posten ex 50.09 en ex 55.09 van het gemeenschappelijk
    douanetarief
