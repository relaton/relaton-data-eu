title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 171/2000 of 25 January 2000 determining the
    extent to which applications for import licences submitted in January 2000 for
    certain products in the milk and milk products sector under the schemes provided
    for in the Europe Agreements between the Community and the Republic of Hungary,
    the Republic of Poland, the Czech Republic, the Slovak Republic, Bulgaria, Romania
    and Slovenia and in the Agreements on free trade between the Community and the
    Baltic States may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 171/2000 de la Commission, du 25 janvier 2000, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2000 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la République de Hongrie, la République de Pologne, la République
    tchèque, la République slovaque, la Bulgarie, la Roumanie et la Slovénie et
    du régime prévu par les accords sur la libéralisation des échanges entre la
    Communauté et les pays baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 171/2000 der Kommission vom 25. Januar 2000 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Januar 2000 im Rahmen der Regelungen gemäß
    den Europa-Abkommen zwischen der Gemeinschaft und der Republik Ungarn, der Republik
    Polen, der Tschechischen Republik, der Slowakischen Republik, Bulgarien, Rumänien
    und Slowenien und der Regelung gemäß dem Freihandelsabkommen zwischen der Gemeinschaft
    und den Baltischen Staaten eingereicht wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 171/2000 af 25. januar 2000 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i januar 2000 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Ungarn, Republikken Polen,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien, Rumænien
    og Republikken Slovenien og ordningen i aftalerne om liberalisering af samhandelen
    mellem Fællesskabet og de baltiske lande, kan accepteres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 171/2000 της Επιτροπής,
    της 25ης Ιανουαρίου 2000, για τον προσδιορισμό
    του μέτρου κατά το οποίο μπορούν να γίνονται
    δεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υπεβλήθησαν τον Ιανουάριο του 2000 για ορισμένα
    προϊόντα στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας
    και της Δημοκρατίας της Ουγγαρίας, της Δημοκρατίας
    της Πολωνίας, της Τσεχικής Δημοκρατίας, της
    Σλοβακικής Δημοκρατίας, της Βουλγαρίας, της
    Ρουμανίας, της Σλοβενίας και του καθεστώτος
    που προβλέπεται από τις συμφωνίες ελευθέρωσης
    των συναλλαγών μεταξύ της Κοινότητας και των
    βαλτικών χωρών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 171/2000, annettu 25 päivänä tammikuuta 2000,
