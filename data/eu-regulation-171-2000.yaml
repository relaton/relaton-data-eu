  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 171/2000 della Commissione, del 25 gennaio 2000, che
    stabilisce la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel gennaio 2000 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità e la Repubblica d'Ungheria, la Repubblica di Polonia, la Repubblica
    ceca, la Repubblica slovacca, la Bulgaria, la Romania e la Slovenia e del regime
    previsto dagli accordi sul libero scambio tra la Comunità e i paesi baltici
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 171/2000 van de Commissie van 25 januari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector melk en zuivelproducten,
    die in januari 2000 worden ingediend op grond van de regelingen waarin is voorzien
    bij de Europaovereenkomsten tussen, enerzijds, de Gemeenschap en, anderzijds,
    de Republiek Hongarije, de Republiek Polen, de Tsjechische Republiek, de Slowaakse
    Republiek, Bulgarije, Roemenië en Slovenië en van de regeling waarin is voorzien
    bij de overeenkomsten betreffende vrijhandel en met handel verband houdende zaken
    tussen de Gemeenschap en de Baltische staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 171/2000 da Comissão, de 25 de Janeiro de 2000,
    que determina a medida em que podem ser aceites os pedidos de certificados de
    importação introduzidos em Julho de 1999 para determinados produtos do sector
    de leite e dos produtos lácteos no âmbito dos regimes previstos nos acordos
    europeus entre a Comunidade e a República da Hungria, a República da Polónia,
    a República Checa, a República Eslovaca, a Bulgária, a Roménia e a Eslovénia
    e do regime previsto nos acordos sobre comércio livre entre a Comunidade e os
    países bálticos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 171/2000 de la Comisión, de 25 de enero de 2000, por
    el que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en enero de 2000 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad y la República de Hungría,
    la República de Polonia, la República Checa, la República Eslovaca, Bulgaria,
    Rumania y Eslovenia, del régimen previsto en los Acuerdos de libre comercio entre
    la Comunidad y los países bálticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 171/2000 av den 25 januari 2000 om fastställande
