    oder kuenstlichen Spinnstoffen der Warenkategorie Nr. 72 (lfd. Nr. 40.0720) mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3738/89 af 13. december 1989 om genindførelse
