  content: Commission Regulation (EEC) No 3738/89 of 13 December 1989 re-establishing
    the levying of customs duties on swimwear, of wool, of cotton or of man-made fibres,
    products of category 72 order No 49.0720, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3738/89 de la Commission du 13 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux maillots,
    culottes et slips de bain, de laine, de coton ou de fibres synthétiques ou artificielles,
    de la catégorie de produits n° 72 (numéro d'ordre 40.0720) originaires de l'Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3738/89 DER KOMMISSION vom 13. Dezember 1989 zur Wiedereinfuehrung
