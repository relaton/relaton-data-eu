title:
- language: en
  script: Latn
  content: Council Directive 66/45/Euratom of 27 October 1966 amending the Directives
    laying down the basic standards for the protection of the health of workers and
    the general public against the dangers arising from ionising radiations
  type: main
- language: fr
  script: Latn
  content: Directive 66/45/CEE du Conseil, du 27 octobre 1966, portant modification
    des directives fixant les normes de base relatives à la protection sanitaire
    de la population et des travailleurs contre les dangers résultant des radiations
    ionisantes
  type: main
- language: de
  script: Latn
  content: Richtlinie 66/45/Euratom des Rates vom 27. Oktober 1966 zur Änderung der
    Richtlinien zur Festlegung der Grundnormen für den Gesundheitsschutz der Bevölkerung
    und der Arbeitskräfte gegen die Gefahren ionisierender Strahlungen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 66/45/Euratom af 27. oktober 1966 om ændring af direktiver
    om fastsættelse af grundlæggende normer til beskyttelse af befolkningens og
    arbejdstagernes sundhed mod de farer, som er forbundet med ioniserende stråling
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 66/45/Euratom, annettu 27 päivänä lokakuuta 1966,
    perusnormien vahvistamisesta työntekijöiden ja väestön terveyden suojelemiseksi
    ionisoivasta säteilystä aiheutuvilta vaaroilta annettujen direktiivien muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 66/45/Euratom del Consiglio, del 27 ottobre 1966, che modifica
    le direttive che fissano le norme fondamentali relative alla protezione sanitaria
    della popolazione e dei lavoratori contro i pericoli derivanti dalle radiazioni
    ionizzanti
  type: main
- language: nl
  script: Latn
  content: Richtlijn 66/45/Euratom van de Raad van 27 oktober 1966 houdende wijziging
    van de Richtlijnen tot vaststelling van de basisnormen voor de bescherming van
    de gezondheid der bevolking en der werknemers tegen de aan ioniserende straling
    verbonden gevaren
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 66/45/Euratom av den 27 oktober 1966 om ändring av direktiv
    om fastställande av grundläggande säkerhetsnormer för skydd av arbetstagarnas
    och allmänhetens hälsa mot de faror som uppstår till fölgd av joniserande
    strålning
  type: main
