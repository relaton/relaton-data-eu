title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2895/94 of 25 November 1994 re-establishing
    the levying of customs duties and ending the charges against tariff ceilings opened
    in 1994, on certain textile products originating in Indonesia, Thailand and the
    Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2895/94 de la Commission du 25 novembre 1994 portant
    établissement de la perception des droits de douane et cessation des imputations
    applicables en 1994 à certains produits textiles originaires d'Indonésie, de
    Thaïlande et des Philippines, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2895/94 DER KOMMISSION vom 25. November 1994 über
    die Wiedereinführung des Zollsatzes und zur Einstellung von Anrechnungen für
    den Zeitraum 1994 für bestimmte Textilwaren mit Ursprung in Indonesien, Thailand
    und den Philippinen, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
