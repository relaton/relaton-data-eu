title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1183/80 of 12 May 1980 re-establishing the
    levying of customs duties on tapestries, hand-made, products of category 60 (code
    0600), originating in Peru, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1183/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux tapisseries
    faites à la main de la catégorie de produits n° 60 (code 0600), originaires
    du Pérou, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1183/80 der Kommission vom 12. Mai 1980 über die
    Wiedereinführung des Zollsatzes für Tapisserien, handgewebt, der Warenkategorie
    Nr. 60 (Kennziffer 0600), mit Ursprung in Peru, dem die in der Verordnung (EWG)
    Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1183/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for håndfremstillede tapisserier, under varekategori
    60 (kode 0600), som har oprindelse i Peru og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1183/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli arazzi fatti a mano
    della categoria di prodotti n. 60 (codice 0600), originari del Perù, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1183/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapisserieën,
    met de hand geweven, van de categorie van produkten nr. 60 (codenummer 0600),
    van oorsprong uit Peru, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
