    coeficientes aplicáveis aos cereais exportados sob forma de determinadas bebidas
    espirituosas para o período de 1985/1986, no que diz respeito ao período de
    aplicação desses coeficientes
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2188/86 de la Comisión de 11 de julio de 1986 que
    modifica los Reglamentos (CEE) n° 2443/85 y n° 2444/85, por los que se fijan
    determinados coeficientes aplicables a los cereales exportados en forma de ciertas
    bebidas espirituosas durante el período 1985/1986, en cuanto al período de aplicación
    de estos coeficientes
