    ποτών για την περίοδο 1985/86, όσον αφορά την περίοδο
    εφαρμογής αυτών των συντελεστών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2188/86 della Commissione dell' 11 luglio 1986 che
    modifica i regolamenti (CEE) n. 2443/85 e (CEE) n. 2444/85 che fissano taluni
    coefficienti applicabili ai cereali esportati sotto forma di determinate bevande
    alcoliche per il periodo 1985/86, per quanto concerne il periodo d' applicazione
    di tali coefficienti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2188/86 van de Commissie van 11 juli 1986 houdende
    wijziging van de Verordeningen (EEG) nr. 2443/85 en (EEG) nr. 2444/85 tot vaststelling,
    voor de periode 1985/1986, van bepaalde coëfficiënten voor in de vorm van bepaalde
    alcoholhoudende dranken uitgevoerde granen, ten aanzien van de toepassingstermijn
    van deze coëfficiënten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2188/86 da Comissão de 11 de Julho de 1986 que
