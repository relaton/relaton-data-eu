title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2188/86 of 11 July 1986 amending Regulations
    (EEC) No 2443/85 and (EEC) No 2444/85 fixing for the period 1985/86 certain coefficients
    applicable to cereals exported in the form of certain spirituous beverages, in
    respect of the period of application of those coefficients
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2188/86 de la Commission du 11 juillet 1986 modifiant
    les règlements (CEE) n° 2443/85 et (CEE) n° 2444/85 fixant certains coefficients
    applicables aux céréales exportées sous forme de certaines boissons spiritueuses
    pour la période 1985/1986 en ce qui concerne la période d' application de ces
    coefficients
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2188/86 der Kommission vom 11. Juli 1986 zur Änderung
    der Verordnung (EWG) Nr. 2443/85 und der Verordnung (EWG) Nr. 2444/85 zur Festsetzung
    bestimmter Koeffizienten für in Form bestimmter alkoholischer Getränke ausgeführtes
    Getreide für den Zeitraum 1985/86 in bezug auf den Anwendungszeitraum vorgenannter
    Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2188/86 af 11. juli 1986 om ændring
    af forordning (EØF) nr. 2443/85 og (EØF) nr. 2444/85 om fastsættelse for perioden
    1985/86 af visse koefficienter, der gælder for korn, der eksporteres i form af
    visse alkoholholdige drikkevarer, for så vidt angår koefficienternes anvendelsesperiode
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2188/86 της Επιτροπής
    της 11ης Ιουλίου 1986 που τροποποιεί τους κανονισμούς
    (ΕΟΚ) αριθ. 2443/85 και (ΕΟΚ) αριθ. 2444/85 που καθορίζουν
    ορισμένους συντελεστές που εφαρμόζονται στα
