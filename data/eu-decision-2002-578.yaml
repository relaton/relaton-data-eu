  script: Latn
  content: '2002/578/EC: Commission Decision of 10 July 2002 amending Decision 2002/199/EC
    concerning animal health conditions and veterinary certification for imports of
    live bovine and porcine animals from certain third countries (Text with EEA relevance)
    (notified under document number C(2002) 2553)'
  type: main
- language: fr
  script: Latn
  content: '2002/578/CE: Décision de la Commission du 10 juillet 2002 modifiant la
    décision 2002/199/CE concernant les conditions de police sanitaire et les certificats
