id: EUDecision20211394
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1394 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 87427 × MON 87460 × MON 89034 × 1507 × MON
    87411 × 59122 and genetically modified maize combining two, three, four or five
    of the single events MON 87427, MON 87460, MON 89034, 1507, MON 87411 and 59122,
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2021)6002) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1394 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 et
    du maïs génétiquement modifié combinant deux, trois, quatre ou cinq des événements
    simples MON 87427, MON 87460, MON 89034, 1507, MON 87411 et 59122, consistant
    en ces maïs ou produits à partir de ceux-ci, en application du règlement (CE)
    no 1829/2003 du Parlement européen et du Conseil [notifiée sous le numéro C(2021)
    6002] (Le texte en langue néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1394 der Kommission vom 17. August 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122
    enthalten, aus ihm bestehen oder aus ihm hergestellt werden, und von genetisch
    veränderten Maissorten, in denen zwei, drei, vier oder fünf der Einzelereignisse
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 und 59122 kombiniert werden,
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekannt gegeben unter Aktenzeichen C(2021)6002) (Nur der niederländische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/1394 на Комисията
    от 17 август 2021 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122
    и генетично модифицирана царевица, съвместяваща
    две, три, четири или пет от единичните събития
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 и 59122, в съответствие
    с Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета (нотифицирано под номер С(2021) 6002)
    (само текстът на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/1394 ze dne 17. srpna 2021 o
    povolení uvádění produktů, které obsahují geneticky modifikovanou kukuřici
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 a geneticky
    modifikovanou kukuřici kombinující dvě, tři, čtyři nebo pět jednoduchých
    událostí MON 87427, MON 87460, MON 89034, 1507, MON 87411 a 59122, sestávají
    z nich nebo jsou z nich vyrobeny, na trh podle nařízení Evropského parlamentu
    a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2021) 6002) (Pouze nizozemské
    znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/1394 af 17. august 2021
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 87427 × MON 87460 × MON 89034 ×
    1507 × MON 87411 × 59122-majs og genetisk modificeret majs, der kombinerer to,
    tre, fire eller fem af de enkelte begivenheder MON 87427, MON 87460, MON 89034,
    1507, MON 87411 og 59122, i henhold til Europa-Parlamentets og Rådets forordning
