  content: Kommissionens genomförandebeslut (EU) 2021/1394 av den 17 augusti 2021
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av den genetiskt modifierade majsen MON 87427
    × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 och av genetiskt modifierad
    majs som kombinerar två, tre, fyra eller fem av de enskilda transformationshändelserna
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 och 59122, i enlighet med Europaparlamentets
