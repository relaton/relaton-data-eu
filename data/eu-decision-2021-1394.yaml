  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/1394, 17. august 2021, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi MON 87427 × MON 87460 × MON 89034 × 1507
    × MON 87411 × 59122 ning geneetiliselt muundatud maisi, milles on kombineeritud
    kaks, kolm, neli või viis MON 87427, MON 87460, MON 89034, 1507, MON 87411 ja
    59122 transformatsioonidest, sisaldavaid, neist koosnevaid või valmistatud tooteid
    (teatavaks tehtud numbri C(2021) 6002 all) (Ainult hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/1394, annettu 17 päivänä
    elokuuta 2021, muuntogeenistä maissia MON 87427 × MON 87460 × MON 89034 ×
    1507 × MON 87411 × 59122 ja muunnostapahtumista MON 87427, MON 87460, MON 89034,
    1507, MON 87411 ja 59122 kahta, kolmea, neljää tai viittä yhdistelemällä
    muodostettua muuntogeenistä maissia sisältävien, siitä koostuvien tai siitä
    valmistettujen tuotteiden markkinoille saattamisen sallimisesta Euroopan parlamentin
    ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla
    C(2021) 6002) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/1394 оd 17. kolovoza 2021. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122, ili se sastoje
    ili su proizvedeni od njega, i genetski modificirani kukuruz u kojem se kombiniraju
    dvije, tri, četiri ili pet od pojedinačnih promjena MON 87427, MON 87460, MON
    89034, 1507, MON 87411 i 59122, na temelju Uredbe (EZ) br. 1829/2003 Europskog
    parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2021) 6002) (Vjerodostojan
    je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1394 végrehajtási határozata (2021. augusztus
    17.) a géntechnológiával módosított MON 87427 × MON 87460 × MON 89034 ×
    1507 × MON 87411 × 59122 kukoricát és a géntechnológiával módosított,
    a MON 87427, a MON 87460, a MON 89034, az 1507, a MON 87411 és az 59122 egyszeres
    genetikai események közül kettőt, hármat, négyet vagy ötöt ötvöző kukoricát
    tartalmazó, abból álló vagy abból előállított termékek forgalomba hozatalának
    az 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2021) 6002. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1394 della Commissione del 17 agosto
    2021 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati dal granturco geneticamente modificato MON 87427 × MON 87460 × MON
    89034 × 1507 × MON 87411 × 59122 e dal granturco geneticamente modificato che
    combina due, tre, quattro o cinque dei singoli eventi MON 87427, MON 87460, MON
    89034, 1507, MON 87411 e 59122 a norma del regolamento (CE) n. 1829/2003 del Parlamento
    europeo e del Consiglio [notificata con il numero C(2021)6002] (Il testo in lingua
    neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1394 (2021. gada 17. augusts),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu MON 87427
    × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 un tādu ģenētiski modificētu
    kukurūzu, kurā kombinēti divi, trīs, četri vai pieci vienkārši notikumi
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 un 59122, no tās sastāv vai
    ir no tās ražoti (izziņots ar dokumenta numuru C(2021) 6002) (Autentisks ir
    tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/1394 2021 m. rugpjūčio 17
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 ir genetiškai
    modifikuotų kukurūzų, kuriuose yra įvykusios dviejų, trijų, keturių ar
    penkių atskirų MON 87427, MON 87460, MON 89034, 1507, MON 87411 ir 59122 transformacijos
    įvykių kombinacijos, kurie iš šių kukurūzų sudaryti arba pagaminti (pranešta
    dokumentu Nr. C(2021) 6002) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/1394 tas-17
    ta’ Awwissu 2021 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu jew li huma prodotti mill-qamħirrum ġenetikament modifikat MON 87427
    × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 u l-qamħirrum ġenetikament
    modifikat li jgħaqqad tnejn, tlieta, erbgħa jew ħamsa mill-eventi uniċi MON
    87427, MON 87460, MON 89034, 1507, MON 87411 u 59122, skont ir-Regolament (KE)
    Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata bid-dokument C(2021)
    6002) (It-test bl-Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/1394 van de Commissie van 17 augustus 2021
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    mais MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 en genetisch
    gemodificeerde maisrassen die twee, drie, vier of vijf van de afzonderlijke transformatiestappen
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 en 59122 combineren, overeenkomstig
    Verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad (Kennisgeving
    geschied onder nummer C(2021) 6002) (Slechts de tekst in de Nederlandse taal is
    authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/1394 z dnia 17 sierpnia 2021 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 oraz rodzaje
    genetycznie zmodyfikowanej kukurydzy łączące dwie, trzy, cztery lub pięć
    pojedynczych modyfikacji MON 87427, MON 87460, MON 89034, 1507, MON 87411 i 59122,
    produktów składających się z wymienionych rodzajów genetycznie zmodyfikowanej
    kukurydzy lub z niej wyprodukowanych (notyfikowana jako dokument nr C(2021) 6002)
    (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/1394 da Comissão de 17 de agosto de 2021
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado MON 87427 ×
    MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 e milho geneticamente modificado
    combinando dois, três, quatro ou cinco dos eventos únicos MON 87427, MON 87460,
    MON 89034, 1507, MON 87411 e 59122, nos termos do Regulamento (CE) n.o 1829/2003
    do Parlamento Europeu e do Conselho [notificada com o número C(2021) 6002] (Apenas
    faz fé o texto em língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/1394 a Comisiei din 17 august
    2021 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MON 87427 × MON 87460 ×
    MON 89034 × 1507 × MON 87411 × 59122 și din porumb modificat genetic obținut
    din combinarea a două, trei, patru sau cinci dintre evenimentele de transformare
    MON 87427, MON 87460, MON 89034, 1507, MON 87411 și 59122 în temeiul Regulamentului
    (CE) nr. 1829/2003 al Parlamentului European și al Consiliului [notificată cu
    numărul C(2021) 6002] (Numai textul în limba neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/1394 zo 17. augusta 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 a geneticky
    modifikovanú kukuricu obsahujúcu kombináciu dvoch, troch, štyroch alebo piatich
    genetických modifikácií MON 87427, MON 87460, MON 89034, 1507, MON 87411 a
    59122, sú z nich zložené alebo vyrobené [oznámené pod číslom C(2021)6002]
    (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/1394 z dne 17. avgusta 2021 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON 87427 ×
    MON 87460 × MON 89034 × 1507 × MON 87411 × 59122, so iz nje sestavljeni ali
    proizvedeni, in gensko spremenjeno koruzo, v kateri so združeni dva, trije, štirje
    ali pet dogodkov MON 87427, MON 87460, MON 89034, 1507, MON 87411 in 59122, v
    skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano
    pod dokumentarno številko C(2021) 6002) (Besedilo v nizozemskem jeziku je edino
    verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/1394 de la Comisión de 17 de agosto
    de 2021 por la que se autoriza la comercialización de productos que contengan,
    se compongan o se hayan producido a partir de maíz modificado genéticamente
    MON 87427 × MON 87460 × MON 89034 × 1507 × MON 87411 × 59122 y de maíz modificado
    genéticamente que combina dos, tres, cuatro o cinco de los eventos únicos MON
    87427, MON 87460, MON 89034, 1507, MON 87411 y 59122, de conformidad con el Reglamento
    (CE) n.o 1829/2003 del Parlamento Europeo y del Consejo [notificada con el número
    C(2021) 6002] (El texto en lengua neerlandesa es el único auténtico)
