title:
- language: fr
  script: Latn
  content: Décision 66/423/CEE de la Commission, du 23 juin 1966, portant augmentation
    du volume du contingent tarifaire octroyé à la République italienne pour le
    ferrochrome contenant en poids 0,10 % ou moins de carbone et de 30 % exclus à
    90 % inclus de chrome
  type: main
- language: de
  script: Latn
  content: '66/423/EWG: Entscheidung der Kommission vom 23. Juni 1966 zur Erhöhung
    des der Italienischen Republik für Ferrochrom mit einem Gehalt an Kohlenstoff
    von 0,10 Gewichtshundertteilen oder mehr und an Chrom von mehr als 30 bis 90 Gewichtshundertteilen
    gewährten Zollkontingents'
  type: main
- language: it
  script: Latn
  content: '66/423/CEE: Decisione della Commissione, del 23 giugno 1966, relativa
    all''aumento del volume del contingente tariffario concesso alla Repubblica italiana
    per il ferro-cromo contenente, in peso, fino allo 0,10% di carbonio e dal 30%
    escluso al 90% incluso di cromo'
  type: main
- language: nl
  script: Latn
  content: '66/423/EEG: Beschikking van de Commissie van 23 juni 1966 houdende vergroting
    van het aan de Italiaanse Republiek toegekende tariefcontingent voor ferrochroom,
    bevattende ten hoogste 0,10 gewichtspercent koolstof en meer dan 30 tot en met
    90 gewichtspercenten chroom'
  type: main
