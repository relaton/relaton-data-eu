- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3407/90 of 27 November 1990 re-establishing
    the levying of the customs duties applicable to the products of the CN code 3105
    originating in Poland, to which the preferential arrangements of Council Regulation
    (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3407/90 de la Commission du 27 novembre 1990 portant
