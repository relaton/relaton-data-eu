    dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3407/90 af 27. november 1990 om genindførelse
