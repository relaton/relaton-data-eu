  script: Latn
  content: '2011/197/EU: Commission Decision of 29 March 2011 pursuant to Regulation
    (EC) No 45/2001 of the European Parliament and of the Council on the adequate
    level of protection provided by Japan for personal data transferred from the European
    Union in the specific cases of transfer by the European Commission to Japanese
    customs authorities under Decision No 1/2010 of the Joint Customs Cooperation
    Committee pursuant to Article 21 of the Agreement between the European Community
    and the Government of Japan on cooperation and mutual administrative assistance
    in customs matters regarding mutual recognition of authorised economic operator
    programmes in the European Union and in Japan and for the exclusive and specific
    purposes of Decision No 1/2010 of the Joint Customs Cooperation Committee'
  type: main
- language: fr
  script: Latn
  content: '2011/197/UE: Décision de la Commission du 29 mars 2011 en application
