  script: Latn
  content: '98/168/EC: Commission Decision of 17 February 1998 amending Decision 93/70/EEC
    on codification for the message ''Animo'' to include certain types of mammalian
    waste products'
  type: main
- language: fr
  script: Latn
  content: '98/168/CE: Décision de la Commission du 17 février 1998 modifiant la
    décision 93/70/CEE relative à la codification du message Animo pour y inclure
    certains types de déchets animaux de mammifères'
  type: main
- language: de
  script: Latn
  content: '98/168/EG: Entscheidung der Kommission vom 17. Februar 1998 zur Änderung
    der Entscheidung 93/70/EWG über die Kodierung der "Animo"-Mitteilung zwecks Einbeziehung
    bestimmter Arten von Säugetierabfällen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 16 февруари 1998 година
