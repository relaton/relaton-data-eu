title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1995/2004 of 19 November 2004 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of certain
    grain oriented electrical sheets and strips of silicon-electrical steel with a
    width of more than 500 mm originating in the Russian Federation and continuing
    to make imports of certain grain oriented electrical sheets originating in the
    Russian Federation subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1995/2004 de la Commission du 19 novembre 2004 portant
    acceptation des engagements offerts dans le cadre de la procédure antidumping
    concernant les importations de certaines tôles et de certains feuillards laminés
    à froid, à grains orientés, en aciers au silicium dits «magnétiques», d'une
    largeur supérieure à 500 mm originaires de la Fédération de Russie et maintenant
    l’enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1995/2004 der Kommission vom 19. November 2004 zur
    Annahme von Verpflichtungsangeboten im Zusammenhang mit dem Antidumpingverfahren
    betreffend die Einfuhren bestimmter kornorientierter Bleche aus Silicium-Elektrostahl
    mit einer Breite von mehr als 500 mm mit Ursprung in der Russischen Föderation
    und zur weiteren zollamtlichen Erfassung der genannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1995/2004 ze dne 19. listopadu 2004 o přijetí
    závazků nabídnutých v souvislosti s antidumpingovým řízením týkajícím
    se dovozů některých izotropních elektroplechů a pásů z křemíkové elektrooceli
    širších než 500 mm pocházející z Ruské federace a vedení záznamů o
    dovozech některých izotropních elektroplechů pocházejících z Ruské federace
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1995/2004 af 19. november 2004 om godtagelse
    af tilsagn, der er afgivet i forbindelse med antidumpingproceduren vedrørende
    importen af visse kornorienterede elektriske plader og bånd af silicium-elektrisk
    stål af en bredde på over 500 mm med oprindelse i Den Russiske Føderation,
    og om fortsat at gøre importen af visse kornorienterede elektriske plader med
    oprindelse i Den Russiske Føderation til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1995/2004 της Επιτροπής,
    της 19ης Νοεμβρίου 2004, για την αποδοχή των αναλήψεων
    υποχρεώσεων που προτάθηκαν στο πλαίσιο της
    διαδικασίας αντιντάμπινγκ που αφορά τις εισαγωγές
    ορισμένων φύλλων και ταινιών ψυχρής έλασης,
    με προσανατολισμένους κόκκους, από πυριτιούχο
    χάλυβα για ηλεκτρικές εφαρμογές, με πλάτος
    που υπερβαίνει τα 500 mm, καταγωγής Ρωσικής Ομοσπονδίας,
    και για την συνέχιση της καταγραφής των εισαγωγών
    αυτών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1995/2004, 19. november 2004, millega kiidetakse
    heaks kohustused, mis on välja pakutud seoses dumpinguvastase menetlusega, mis
    käsitleb Vene Föderatsioonist pärineva teatava karedapinnalise silikoonelektrilise,
    laiema kui 500 millimeetrise elektrotehnilise lehtterase ja liistude importi,
    ja jätkatakse Vene Föderatsioonist pärineva teatava karedapinnalise elektrotehnilise
    lehtterase impordile registreerimise kohaldamist
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1995/2004, annettu 19 päivänä marraskuuta
    2004, Venäjän federaatiosta peräisin olevien tiettyjen piiseosteisesta sähköteknisestä
    teräksestä valmistettujen suuntaisrakeisten levyvalmisteiden, joiden leveys
    on suurempi kuin 500 mm, tuontia koskevan polkumyynnin vastaisen menettelyn yhteydessä
    tarjottujen sitoumusten hyväksymisestä sekä Venäjän federaatiosta peräisin
    olevien tiettyjen suuntaisrakeisten sähköteknisten levyvalmisteiden tuonnin
    kirjaamisvelvoitteen jatkamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1995/2004/EK rendelete (2004. november 19.) az Orosz Föderációból
    származó egyes 500 mm-nél szélesebb szilícium-elektroacél szemcseorientált
    elektromos lemezek és szalagok behozatalára vonatkozó dömpingellenes eljárással
    kapcsolatosan felajánlott kötelezettségvállalások elfogadásáról és az
    Orosz Föderációból származó egyes szemcseorientált elektromos lemezek behozatalainak
    nyilvántartásba vételi kötelezettségének fenntartásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1995/2004 della Commissione, del 19 novembre 2004,
    che accetta gli impegni offerti riguardo al procedimento antidumping relativo
    alle importazioni di alcuni tipi di lamiere dette «magnetiche», a grani orientati,
    e di nastri di acciai al silicio detti «magnetici», a grani orientati, di larghezza
    superiore a 500 mm, originari della Federazione russa e che continua a sottoporre
    a registrazione le importazioni di alcuni tipi di lamiere dette «magnetiche»,
    a grani orientati, originarie della Federazione russa
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1995/2004 (2004. gada 19. novembris), ar ko piekrīt
    saistībām, kuras piedāvātas sakarā ar antidempinga procedūru attiecībā
    uz atsevišķu elektrisko lokšņu ar orientētu graudu un elektrotehniskā silīcijtērauda
    slokšņu, kas platākas par 500 mm un kā izcelsme ir Krievijas Federācijā,
    importu, un par turpmāku Krievijas Federācijas izcelsmes reģistrējamu atsevišķu
    elektrisko lokšņu ar orientētu graudu importu
  type: main
- language: lt
  script: Latn
  content: 2004 m. lapkričio 19 d. Komisijos reglamentas (EB) Nr. 1995/2004, priimantis
    įsipareigojimus, pasiūlytus vykdant antidempingo tyrimą dėl tam tikrų Rusijos
    Federacijos kilmės orientuoto grūdėtumo silicinio elektrotechninio plieno lakštų
    ir silicinio elektrotechninio plieno juostelių, kurių plotis didesnis kaip 500
    mm, importo, ir nustatantis, kad tam tikrų Rusijos Federacijos kilmės orientuoto
    grūdėtumo elektrotechninio plieno lakštų importas ir toliau būtų registruojamas
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1995/2004 tad- 19 ta' Novembru 2004
    li jaċċetta garanziji offruti b’konnessjoni mal-proċess ta’ l- anti-dumping
    li jikkonċerna l-importazzjoni ta’ ċerti pjanċi elettriċi orjentati skond
    il-vina u strippi ta’ l-azzar tas- silicon elettriċi b’wisa’ ta’ aktar
    minn 500mm li joriġinaw mil-Federazzjoni tar-Russja u jkompli jissoġġetta l-importazzjoni
    ta’ pjanċi elettriċi orjentati skond il-vina li joriġinaw mil-Federazzjoni
    tar-Russja għar-reġistrazzjoni.
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1995/2004 van de Commissie van 19 november 2004 tot
    aanvaarding van verbintenissen aangeboden in het kader van de antidumpingprocedure
    betreffende de invoer van bepaalde platen en banden met georiënteerde korrel
    van siliciumstaal, met een breedte van meer dan 500 mm, uit de Russische Federatie
    en tot registratie van de invoer van bepaalde elektroplaat met georiënteerde
    korrel uit de Russische Federatie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1995/2004 z dnia 19 listopada 2004 r. przyjmujące
    zobowiązania oferowane w związku z postępowaniem antydumpingowym w odniesieniu
    do przywozu niektórych elektrotechnicznych blach teksturowanych oraz pasów stali
    elektrotechnicznej krzemowej o szerokości powyżej 500 mm pochodzących z Federacji
    Rosyjskiej oraz przedłużające objęcie obowiązkiem rejestracji przywóz niektórych
    elektrotechnicznych blach teksturowanych pochodzących z Federacji Rosyjskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1995/2004 da Comissão, de 19 de Novembro de 2004,
    que aceita os compromissos oferecidos no âmbito do processo anti-dumping relativo
    às importações de determinadas chapas e bandas de aço ao silício, denominadas
    magnéticas, de grãos orientados, de largura superior a 500 mm originárias da
    Federação Russa e que continua a sujeitar a registo as importações de determinadas
    chapas e bandas magnéticas, de grãos orientados, originárias da Federação
    Russa
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1995/2004 z 19. novembra 2004, ktorým sa prijímajú
    záväzky ponúknuté v súvislosti s antidumpingovým konaním týkajúcim sa
    dovozu určitých orientovaných plechov pre elektrotechniku a pásov z kremíkovej
    elektroocele so šírkou väčšou ako 500 mm s pôvodom v Ruskej federácii a
    pokračuje registrácia dovozov určitých orientovaných plechov pre elektrotechniku
    s pôvodom v Ruskej federácii
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1995/2004 z dne 19. novembra 2004 o sprejetju
    zavez, ponujenih v zvezi s protidampinškim postopkom glede uvoza nekaterih zrnato
    usmerjenih elektropločevin in trakov iz silicijevega jekla za elektropločevine
    s širino več kot 500 mm s poreklom iz Ruske federacije ter o nadaljnji registraciji
    uvoza nekaterih zrnato usmerjenih elektropločevin s poreklom iz Ruske federacije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1995/2004 de la Comisión, de 19 de noviembre de 2004,
    por el que se aceptan los compromisos ofrecidos con respecto al procedimiento
    antidumping relativo a las importaciones de determinadas chapas y tiras eléctricas
    con granos orientados de acero eléctrico al silicio, de anchura superior a 500
    milímetros, originarias de la Federación de Rusia, y se siguen sometiendo a
    registro las importaciones de determinadas chapas eléctricas con granos orientados,
    originarias de la Federación de Rusia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1995/2004 av den 19 november 2004 om
    godtagande av åtaganden som erbjudits i samband med antidumpningsförfarandet
    beträffande import av kornorienterade, kallvalsade plåtar och band av kisellegerat
    elektrostål med en bredd av mer är 500 mm med ursprung i Ryska federationen
    och om fortsatt registrering av den importen
