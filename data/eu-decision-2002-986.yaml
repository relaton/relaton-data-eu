title:
- language: en
  script: Latn
  content: '2002/986/EC: Commission Decision of 13 December 2002 amending Decisions
    2001/881/EC drawing up a list of border inspection posts approved for veterinary
    checks on animals and animal products from third countries, and 2002/459/EC listing
    the units in the ANIMO computer network (Text with EEA relevance) (notified under
    document number C(2002) 4987)'
  type: main
- language: fr
  script: Latn
  content: '2002/986/CE: Décision de la Commission du 13 décembre 2002 modifiant
    les décisions 2001/881/CE établissant une liste de postes d''inspection frontaliers
    agréés pour les contrôles vétérinaires sur les animaux et les produits animaux
    en provenance des pays tiers, et 2002/459/CE fixant la liste des unités du réseau
    informatisé ANIMO (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2002) 4987]'
  type: main
- language: de
  script: Latn
  content: '2002/986/EG: Entscheidung der Kommission vom 13. Dezember 2002 zur Änderung
    der Entscheidungen 2001/881/EG zur Festlegung eines Verzeichnisses der für die
    Veterinärkontrollen von aus Drittländern eingeführten Tieren und tierischen
    Erzeugnissen zugelassenen Grenzkontrollstellen und 2002/459/EG zur Festlegung
    der Liste der Einheiten des informatisierten Netzes "ANIMO" (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002) 4987)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 13 декември 2002 година
    за изменение на Решение 2001/881/ЕО относно съставяне
    на списък с граничните инспекционни пунктове,
    одобрени да извършват ветеринарни проверки
    на животни и животински продукти от трети страни,
    и на Решение 2002/459/ЕО относно списъка с единиците
    в компютърната мрежа „Анимо“ (нотифицирано
    под номер С(2002) 4987)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 13. prosince 2002, kterým se mění rozhodnutí
    2001/881/ES, kterým se stanoví seznam stanovišť hraniční kontroly schválených
    pro veterinární kontroly zvířat a živočišných produktů ze třetích zemí,
    a rozhodnutí 2002/459/ES, kterým se zřizuje seznam jednotek v počítačové
    síti ANIMO (oznámeno pod číslem K(2002) 4987)
  type: main
- language: da
  script: Latn
  content: '2002/986/EF: Kommissionens beslutning af 13. december 2002 om ændring
    af beslutning 2001/881/EF om en liste over grænsekontrolsteder, der er godkendt
    til at føre veterinærkontrol med dyr og animalske produkter fra tredjelande,
    og om ændring af beslutning 2002/459/EF om fastsættelse af listen over enheder
    i edb-nettet ANIMO (EØS-relevant tekst) (meddelt under nummer K(2002) 4987)'
  type: main
- language: el
  script: Grek
  content: '2002/986/ΕΚ: Απόφαση της Επιτροπής, της 13ης
    Δεκεμβρίου 2002, σχετικά με την τροποποίηση των
    αποφάσεων 2001/881/ΕΚ, για την κατάρτιση καταλόγου
    μεθοριακών σταθμών επιθεώρησης που είναι εγκεκριμένοι
    για τη διενέργεια κτηνιατρικών ελέγχων σε
    ζώα και ζωικά προϊόντα από τρίτες χώρες, και
    2002/459/EΚ για την κατάρτιση του καταλόγου των
    μονάδων του δικτύου πληροφορικής ANIMO (Κείμενο
    που παρουσιάζει ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα
    υπό τον αριθμό Ε(2002) 4987]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 13. detsember 2002, millega muudetakse otsust 2001/881/EÜ,
    milles koostatakse kolmandatest riikidest pärit loomade ja loomsete toodete veterinaarkontrolliks
    heakskiidetud piiripunktide loetelu, ja otsust 2002/459/EÜ, milles loetletakse
    ANIMO arvutivõrgu üksused (teatavaks tehtud numbri K(2002) 4987 all)
  type: main
- language: fi
  script: Latn
  content: '2002/986/EY: Komission päätös, tehty 13 päivänä joulukuuta 2002,
    kolmansista maista tulevien eläinten ja eläintuotteiden eläinlääkärintarkastuksia
    varten hyväksyttyjen rajatarkastusasemien luettelosta tehdyn päätöksen 2001/881/EY
    ja ANIMO-tietokoneverkon yksiköitä koskevasta luettelosta tehdyn päätöksen
    2002/459/EY muuttamisesta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu
    numerolla K(2002) 4987)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. december 13.) a harmadik országból származó
    állatok és állati termékek állat-egészségügyi ellenőrzésére jóváhagyott
    állat-egészségügyi határállomások jegyzékének összeállításáról
    szóló 2001/881/EK határozat, valamint az ANIMO számítógépes hálózat egységeinek
    felsorolásáról szóló 2002/459/EK határozat módosításáról (az értesítés
    a C(2002) 4987. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2002/986/CE: Decisione della Commissione, del 13 dicembre 2002, recante
    modifica della decisione 2001/881/CE che stabilisce l''elenco dei posti d''ispezione
    frontalieri riconosciuti ai fini dei controlli veterinari sui prodotti e sugli
    animali provenienti dai paesi terzi e della decisione 2002/459/CE che stabilisce
    l''elenco delle unità della rete informatizzata ANIMO (Testo rilevante ai fini
    del SEE) [notificata con il numero C(2002) 4987]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 13. decembris), ar kuru groza Lēmumu 2001/881/EK,
    ar kuru izveido sarakstu, kur uzskaitīti robežkontroles posteņi, kas ir apstiprināti
    ārpuskopienas valstu dzīvnieku un dzīvnieku valsts produktu veterinārajām
    pārbaudēm, un Lēmumu 2002/459/EK, ar kuru uzskaita vienības ANIMO datortīklā
    (izziņots ar dokumenta numuru C(2002) 4987)
  type: main
- language: lt
  script: Latn
  content: 2002 m. gruodžio 13 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    2001/881/EB, nustatantį pasienio kontrolės postų, patvirtintų atlikti gyvūnų
    ir gyvūninės kilmės produktų iš trečiųjų šalių veterinarinius patikrinimus,
    sąrašą ir Sprendimą 2002/459/EB, išvardijantį ANIMO kompiuterių tinklo
    vienetus (pranešta dokumentu Nr. C(2002) 4987)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-13 ta' Diċembru 2002 li temenda d-Deċiżjonijiet
    2001/881/KE li tagħmel lista ta' postijiet ta' ispezzjoni fuq il-fruntiera approvati
    għal kontrolli veterinarji fuq annimali u prodotti ta' l-annimali minn pajjiżi
    terzi, u 2002/459/KE li telenka l-lista ta' l-unitajiet fin-network tal-kompjuter
    ANIMO (notifikata taħt in-numru tad-Dokument K(2002) 4987)
  type: main
- language: nl
  script: Latn
  content: '2002/986/EG: Beschikking van de Commissie van 13 december 2002 tot wĳziging
    van Beschikking 2001/881/EG tot vaststelling van een lĳst van grensinspectieposten
    die zĳn erkend voor de veterinaire controles van dieren en dierlĳke producten
    uit derde landen en van Beschikking 2002/459/EG tot vaststelling van de lĳst
    van de eenheden van het computernetwerk Animo (Voor de EER relevante tekst) (kennisgeving
    geschied onder nummer C(2002) 4987)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 13 grudnia 2002 r. zmieniająca decyzję 2001/881/WE
    ustalającą wykaz punktów kontroli granicznej zatwierdzonych do celów przeprowadzania
    kontroli weterynaryjnych zwierząt i produktów zwierzęcych sprowadzanych z państw
    trzecich oraz decyzję 2002/459/WE wymieniającą jednostki systemu komputerowego
    ANIMO (notyfikowana jako dokument nr C(2002) 4987)
  type: main
- language: pt
  script: Latn
  content: '2002/986/CE: Decisão da Comissão, de 13 de Dezembro de 2002, que altera
    as Decisões 2001/881/CE que estabelece uma lista dos postos de inspecção fronteiriços
    aprovados para a realização dos controlos veterinários de animais vivos e produtos
    animais provenientes de países terceiros e 2002/459/CE que estabelece a lista
    das unidades da rede informatizada "ANIMO" (Texto relevante para efeitos do EEE)
    [notificada com o número C(2002) 4987]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 13 decembrie 2002 de modificare a Deciziilor 2001/881/CE
    de stabilire a listei punctelor de control la frontieră desemnate pentru controalele
    veterinare ale animalelor și ale produselor animale care provin din țări terțe
    și 2002/459/CE de stabilire a listei unităților din rețeaua informatizată
    ANIMO [notificată cu numărul C(2002) 4987]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 13. decembra 2002, ktorým sa mení a dopĺňa rozhodnutie
    2001/881/ES, ktorým sa ustanovil zoznam hraničných inšpekčných miest schválených
    na veterinárne kontroly zvierat a produktov živočíšneho pôvodu z tretích
    krajín a rozhodnutie 2002/459/ES, v ktorom je zoznam terminálov počítačovej
    siete systému ANIMO (oznámené pod číslom dokumentu C(2002) 4987)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 13. decembra 2002 o spremembi odločb 2001/881/ES
    o pripravi seznama mejnih kontrolnih točk, dogovorjenih za veterinarske preglede
    živali in živalskih proizvodov iz tretjih držav, in 2002/459/ES o seznamu enot
    v računalniškem omrežju Animo (notifcirano pod dokumentarno številko K(2002)
    4987)
  type: main
- language: es
  script: Latn
  content: '2002/986/CE: Decisión de la Comisión, de 13 de diciembre de 2002, que
    modifica las Decisiones 2001/881/CE, por la que se establece una lista de los
    puestos de inspección fronterizos que están autorizados para el control veterinario
    de los animales y productos animales procedentes de terceros países, y 2002/459/CE,
    por la que se establece la lista de las unidades de la red informatizada ANIMO
    (Texto pertinente a efectos del EEE) [notificada con el número C(2002) 4987]'
  type: main
- language: sv
  script: Latn
  content: '2002/986/EG: Kommissionens beslut av den 13 december 2002 om ändring
    av beslut 2001/881/EG om upprättande av en förteckning över gränskontrollstationer
    som godkänts för veterinärkontroller och om ändring av kommissionens beslut
    2002/459/EG om fastställande av förteckningen över enheterna i det datoriserade
    nätet Animo (Text av betydelse för EES) [delgivet med nr K(2002) 4987]'
