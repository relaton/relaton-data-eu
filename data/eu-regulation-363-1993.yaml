    nel settore delle carni ovine e caprine nonché il regolamento (CEE) n. 1323/90
    che istituisce un aiuto specifico per l'allevamento ovino e caprino in alcune
    zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 363/93 van de Raad van 10 februari 1993 tot wijziging
