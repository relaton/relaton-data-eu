  content: Council Regulation (EEC) No 363/93 of 10 February 1993 amending Regulation
    (EEC) No 3013/89 on the common organization of the market in sheepmeat and goatmeat
    and Regulation (EEC) No 1323/90 instituting specific aid for sheep and goat farming
    in certain less-favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 363/93 du Conseil, du 10 février 1993, modifiant
