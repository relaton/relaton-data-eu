    έτοιμα, εξ υφασμάτων, τών προϊόντων τής κατηγορίας
    112 (κώδικας 1120), καταγωγής Νοτίου Κορέας, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 739/81 della Commissione, del 23 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (codice 1120), originari della
    Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 739/81 van de Commissie van 23 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels van de categorie van produkten nr. 112 (codenummer 1120),
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
