title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 739/81 of 23 March 1981 re-establishing
    the levying of customs duties on other made up textile articles, woven, products
    of category 112 (code 1120), originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 739/81 de la Commission, du 23 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la catégorie de produits n° 112 (code 1120), originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 739/81 der Kommission vom 23. März 1981 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 739/81 af 23. marts 1981 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer under kategori
    112 (kode 1120), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 739/81 τής Επιτροπής
