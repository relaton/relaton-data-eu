title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1952/96 of 7 October 1996 amending, for the
    fourth time, Regulation (EC) No 3074/95 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1996 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1952/96 du Conseil du 7 octobre 1996 modifiant, pour
    la quatrième fois, le règlement (CE) nº 3074/95 fixant, pour certains stocks
    et groupes de stocks de poissons, les totaux admissibles des captures pour 1996
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1952/96 des Rates vom 7. Oktober 1996 zur vierten Änderung
    der Verordnung (EG) Nr. 3074/95 zur Festlegung der zulässigen Gesamtfangmengen
    und entsprechender Fangbedingungen für bestimmte Fischbestände oder -bestandsgruppen
    (1996)
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 1952/96 af 7. oktober 1996 om fjerde ændring
    af forordning (EF) nr. 3074/95 om fastsættelse for 1996 for de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1952/96 του Συμβουλίου
    της 7ης Οκτωβρίου 1996 για την τέταρτη τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 3074/95, περί καθορισμού,
    για ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1996, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατό να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1952/96, annettu 7 päivänä lokakuuta 1996,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1996 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
    annetun neuvoston asetuksen (EY) N:o 3074/95 muuttamisesta neljännen kerran
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1952/96 del Consiglio del 7 ottobre 1996 recante quarta
    modifica del regolamento (CE) n. 3074/95 che stabilisce per alcuni stock o gruppi
    di stock ittici, il totale ammissibile di catture per il 1996 e talune condizioni
    cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1952/96 van de Raad van 7 oktober 1996 houdende vierde
    wijziging van Verordening (EG) nr. 3074/95 inzake de vaststelling van de voor
    1996 geldende totaal toegestane vangsten voor bepaalde visbestanden of groepen
    visbestanden, alsmede bepaalde bij de visserij in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1952/96 do Conselho de 7 de Outubro de 1996 que altera
    pela quarta vez o Regulamento (CE) nº 3074/95 que fixa os totais admissíveis
    de capturas para 1996 e certas condições em que podem ser pescadas determinadas
    unidades populacionais ou grupos de unidades populacionais de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1952/96 del Consejo de 7 de octubre de 1996 que modifica,
    por cuarta vez, el Reglamento (CE) nº 3074/95 por el que se fijan los totales
    admisibles de capturas de determinadas poblaciones y grupos de poblaciones de
    peces para 1996 y determinadas condiciones en las que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1952/96 av den 7 oktober 1996 om ändring för
    fjärde gången av förordning (EG) nr 3074/95 om fastställande, för vissa fiskbestånd
    och grupper av fiskbestånd, av totala tillåtna fångstmängder under 1996 och
    av vissa villkor för fångsten
  type: main
