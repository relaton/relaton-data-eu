type: standard
title:
- language: fr
  script: Latn
  content: '72/354/CEE: Décision de la Commission, du 5 octobre 1972, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de radio, même combinés avec un appareil d''enregistrement ou de
    reproduction du son et les jumelles, avec ou sans prismes, des positions 85.15
    A III et Ex 90.05 du Tarif douanier commun, originaires respectivement, d''URSS
    et de Hong-Kong et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '72/354/EWG: Entscheidung der Kommission vom 5. Oktober 1972, mit der die
    Französische Republik ermächtigt wird, aus der UdSSR bzw. Hongkong stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte
    für Rundfunk, auch mit einem Tonaufnahme- oder Tonwiedergabegerät kombiniert,
    und Fernrohre, mit oder ohne Prismen, der Tarifnummer 85.15 A III und ex 90.05
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/354/CEE: Decisione della Commissione, del 5 ottobre 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    radioriceventi anche combinati con un apparecchio di registrazione o di riproduzione
    del suono ed i cannocchiali con o senza prismi, delle voci nn. 85.15 A III ed
    ex 90.05 della tariffa doganale comune originari, rispettivamente, dell''URSS
    e di Hong Kong e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/354/EEG: Beschikking van de Commissie van 5 oktober 1972 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook
    indien met ingebouwd toestel voor het opnemen of voor het weergeven van geluid
    en verrekijkers, ook indien met prisma''s van de posten 85.15 A III en ex 90.05
    van het gemeenschappelijk douanetarief, van oorsprong uit respectievelijk USSR
    en Hong-Kong en in de overige Lid- Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten'
  type: main
