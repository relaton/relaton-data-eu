title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2848/79 of 17 December 1979 making the importation
    into the United Kingdom of women' s overcoats and into the Benelux countries of
    men' s and boys' outer garments originating in Taiwan, subject to quantitative
    limits
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2848/79 de la Commission, du 17 décembre 1979, soumettant
    à une limitation quantitative les importations dans le Royaume-Uni de manteaux
    pour femmes et dans le Benelux de vêtements de dessus pour hommes et garçonnets,
    originaires de T' ai-wan
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2848/79 der Kommission vom 17. Dezember 1979 zur Einführung
    von Höchstmengen für die Einfuhr von Mänteln für Frauen in das Vereinigte
    Königreich und Oberkleidung für Männer und Knaben in die Benelux-Länder mit
    Ursprung in Taiwan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2848/79 af 17. december 1979 om indførelse
    af et kvantitativt loft for indførsel i Det forenede Kongerige af frakker til
    kvinder og i Benelux-landene af yderbeklædningsgenstande til mænd og drenge
    med oprindelse i Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 2848/79 της Επιτροπής,
    της 17ης Δεκεμβρίου 1979, με τον οποίο υποβάλλονται
    σε ποσοτικό περιορισμό οι εισαγωγές στο Ηνωμένο
    Βασίλειο γυναικείων παλτών και στην BENELUX ανδρικών
    και παιδικών εσωρούχων προέλευσης Ταϊβάν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2848/79 della Commissione, del 17 dicembre 1979, che
    sottopone a limitazione quantitativa le importazioni nel Regno Unito di cappotti
    per donna e nel Benelux di indumenti esterni per uomo e per ragazzo, originari
    di Taiwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2848/79 van de Commissie van 17 december 1979 waarbij
    de invoer in het Verenigd Koninkrijk van damesmantels en de invoer in de Benelux-landen
    van herenbovenkleding en jongensbovenkleding, van oorsprong uit Taiwan, aan een
    kwantitatief maximum worden onderworpen
  type: main
