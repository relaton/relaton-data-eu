title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2498/96 of 23 December 1996 opening Community
    tariff quotas for 1997 for sheep, goats, sheepmeat and goatmeat falling within
    CN codes 0104 10 30, 0104 10 80, 0104 20 90 and 0204 and derogating from Regulation
    (EC) No 1439/95 laying down detailed rules for the application of Council Regulation
    (EEC) No 3013/89 as regards the import and export of products in the sheepmeat
    and goatmeat sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2498/96 de la Commission du 23 décembre 1996 portant
    ouverture de contingents tarifaires communautaires au titre de 1997 pour les animaux
    vivants des espèces ovine et caprine et pour la viande des animaux des espèces
    ovine et caprine relevant des codes NC 0104 10 30, 0104 10 80, 0104 20 90 et 0204,
    et portant dérogation au règlement (CE) nº 1439/95 établissant les modalités
    d'application du règlement (CEE) nº 3013/89 du Conseil en ce qui concerne l'importation
    et l'exportation de produits du secteur des viandes ovine et caprine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2498/96 der Kommission vom 23. Dezember 1996 zur Eröffnung
    von Gemeinschaftszollkontingenten für Schafe und Ziegen sowie Schaf- und Ziegenfleisch
    der KN- Codes 0104 10 30, 0104 10 80, 0104 20 90 und 0204 für 1997 sowie zur
    Abweichung von der Verordnung (EG) Nr. 1439/95 zur Durchführung der Verordnung
    (EWG) Nr. 3013/89 des Rates hinsichtlich der Einfuhr und Ausfuhr von Schaf- und
    Ziegenfleischerzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2498/96 af 23. december 1996 om åbning
    af EF-toldkontingenter for 1997 for får, geder, fårekød og gedekød henhørende
    under KN-kode 0104 10 30, 0104 10 80, 0104 20 90 og 0204 og om undtagelse fra
    forordning (EF) nr. 1439/95 om gennemførelsesbestemmelser til Rådets forordning
    (EØF) nr. 3013/89 for så vidt angår indførsel og udførsel af fåre- og gedekød
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2498/96 της Επιτροπής
    της 23ης Δεκεμβρίου 1996 για το άνοιγμα κοινοτικών
    δασμολογικών ποσοστώσεων για το 1997 όσον αφορά
    αιγοπρόβατα και κρέας αιγοπροβάτων που εμπίπτουν
    στους κωδικούς ΣΟ 0104 10 30, 0104 10 80, 0104 20 90 και 0204
    και για παρέκκλιση από τον κανονισμό (ΕΚ) αριθ.
    1439/95 σχετικά με τη θέσπιση λεπτομερειών για
    την εφαρμογή του κανονισμού (ΕΟΚ) αριθ. 3013/89
    του Συμβουλίου όσον αφορά τις εισαγωγές και
    εξαγωγές προϊόντων στον τομέα του προβείου
    και αιγείου κρέατος
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2498/96, annettu 23 päivänä joulukuuta 1996,
    yhteisön tariffikiintiöiden avaamisesta CN-koodeihin 0104 10 30, 0104 10 80,
    0104 20 90 ja 0204 kuuluville lampaille, vuohille, lampaanlihalle ja vuohenlihalle
    vuodeksi 1997 ja neuvoston asetuksen (ETY) N:o 3013/89 soveltamista koskevista
    yksityiskohtaisista säännöistä lampaan- ja vuohenliha-alan tuotteiden tuonnin
    ja viennin osalta annetusta asetuksesta (EY) N:o 1439/95 poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2498/96 della Commissione del 23 dicembre 1996 recante
    apertura, per il 1997, di contingenti tariffari comunitari di ovini, caprini,
    carni ovine e carni caprine dei codici NC 0104 10 30, 0104 10 80, 0104 20 90 e
    0204 e che prevede deroga al regolamento (CE) n. 1439/95, recante modalità di
    applicazione del regolamento (CEE) n. 3013/89 del Consiglio in ordine all'importazione
    ed esportazione di prodotti del settore delle carni ovine e caprine
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2498/96 van de Commissie van 23 december 1996 tot
    opening, voor 1997, van communautaire tariefcontingenten voor schapen, geiten,
    schapevlees en geitevlees van de GN-codes 0104 10 30, 0104 10 80, 0104 20 90 en
    0204 en houdende afwijking van Verordening (EG) nr. 1439/95 tot vaststelling van
    bepalingen van Verordening (EEG) nr. 3013/89 van de Raad inzake de invoer en de
    uitvoer van produkten van de sector schape- en geitevlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2498/96 da Comissão de 23 de Dezembro de 1996 que
    abre contingentes pautais comunitários relativos a 1997 para os ovinos e caprinos
    e as carnes de ovino e caprino dos códigos NC 0104 10 30, 0104 10 80, 0104 20
    90 e 0204 e derroga o Regulamento (CE) nº 1439/95, que estabelece normas de execução
    do Regulamento (CEE) nº 3013/89 do Conselho, no que respeita à importação
    e exportação de produtos do sector das carnes de ovino e caprino
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2498/96 de la Comisión de 23 de diciembre de 1996
    por el que se abren contingentes arancelarios comunitarios de ganado ovino y caprino
    y de carne de ovino y caprino de los códigos NC 0104 10 30, 0104 10 80, 0104
    20 90 y 0204 para 1997 y se establecen excepciones al Reglamento (CE) nº 1439/95,
    por el que se establecen disposiciones de aplicación del Reglamento (CEE) nº
    3013/89 del Consejo en lo relativo a la importación y exportación de productos
    del sector de la carne de ovino y caprino
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2498/96 av den 23 december 1996 om öppnande
    av gemenskapstullkvoter för 1997 för får, getter, fårkött och getkött som
    omfattas av KN-nummer 0104 10 30, 0104 10 80, 0104 20 90 och 0204 och om undantag
    från förordning (EG) nr 1439/95 om tillämpningsföreskrifter för rådets förordning
    (EEG) nr 3013/89 beträffande import och export av produkter inom sektorn för
    får- och getkött
  type: main
