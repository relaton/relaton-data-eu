    πράξεις
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/2089, 21. september 2021, millega
    muudetakse delegeeritud määrust (EL) 2019/2122 seoses teatavate kategooriatega,
    kuhu kuuluvad vähese riskiga kaubad, reisijate isikliku pagasi hulka kuuluvad
    kaubad ning lemmikloomad, mis on vabastatud piiripunktis tehtavast ametlikust
    kontrollist, ning kõnealust delegeeritud määrust ja delegeeritud määrust
    (EL) 2019/2074 seoses viidetega teatavatele kehtetuks tunnistatud õigusaktidele
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/2089, annettu 21 päivänä syyskuuta
    2021, delegoidun asetuksen (EU) 2019/2122 muuttamisesta siltä osin kuin on kyse
    tietyistä vähäriskisistä tavaraluokista, matkustajien henkilökohtaisiin matkatavaroihin
    kuuluvista tavaroista ja rajatarkastusasemilla tehtävästä virallisesta valvonnasta
    vapautetuista lemmikkieläimistä sekä kyseisen delegoidun asetuksen ja delegoidun
    asetuksen (EU) 2019/2074 muuttamisesta siltä osin kuin on kyse viittauksista
    tiettyihin kumottuihin säädöksiin
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/2089 ón gCoimisiún an 21 Meán Fómhair
    2021 lena leasaítear Rialachán Tarmligthe (AE) 2019/2122 a mhéid a bhaineann
    le catagóirí áirithe d’earraí a mbaineann riosca íseal leo, earraí ar
    cuid iad de bhagáiste pearsanta paisinéirí agus peataí atá díolmhaithe ó
    rialuithe oifigiúla ag poist rialaithe teorann agus lena leasaítear an Rialachán
    Tarmligthe sin agus Rialachán Tarmligthe (AE) 2019/2074 a mhéid a bhaineann
    le tagairtí do reachtaíocht aisghairthe áirithe
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2089 оd 21. rujna 2021. o izmjeni
    Delegirane uredbe (EU) 2019/2122 u pogledu određenih kategorija robe niskog rizika,
    robe koja čini dio osobne prtljage putnika i kućnih ljubimaca izuzetih od službenih
    kontrola na graničnim kontrolnim postajama te o izmjeni te delegirane uredbe
    i Delegirane uredbe (EU) 2019/2074 u pogledu upućivanja na određeno zakonodavstvo
    koje je stavljeno izvan snage
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2089 felhatalmazáson alapuló rendelete (2021.
    szeptember 21.) az (EU) 2019/2122 felhatalmazáson alapuló rendeletnek az alacsony
    kockázatú áruk, az utasok személyes poggyászának részét képező áruk
    és a kedvtelésből tartott állatok határállomásokon végzett hatósági
    ellenőrzések alól mentesített bizonyos kategóriái tekintetében történő
    módosításáról, valamint az említett felhatalmazáson alapuló rendeletnek
    és az (EU) 2019/2074 felhatalmazáson alapuló rendeletnek egyes hatályon kívül
    helyezett jogszabályokra való hivatkozások tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/2089 della Commissione del 21 settembre
    2021 che modifica il regolamento delegato (UE) 2019/2122 per quanto riguarda alcune
    categorie di merci a basso rischio, le merci contenute nei bagagli personali dei
    passeggeri e gli animali da compagnia esenti da controlli ufficiali ai posti di
    controllo frontalieri e che modifica tale regolamento delegato e il regolamento
    delegato (UE) 2019/2074 per quanto riguarda i riferimenti ad alcuni atti legislativi
    abrogati
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/2089 (2021. gada 21. septembris),
    ar ko attiecībā uz noteiktām tādu preču kategorijām, kas rada zemu risku,
    precēm, kas ir daļa no pasažieru personīgās bagāžas, un lolojumdzīvniekiem,
    kuri ir atbrīvoti no oficiālajām kontrolēm robežkontroles punktos, groza
    Deleģēto regulu (ES) 2019/2122 un ar ko attiecībā uz atsaucēm uz dažiem
    atceltiem tiesību aktiem groza minēto deleģēto regulu un Deleģēto regulu
    (ES) 2019/2074
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/2089 2021 m. rugsėjo 21 d.
    kuriuo dėl tam tikrų kategorijų mažą riziką keliančių prekių, keleivių
    asmeninio bagažo dalį sudarančių prekių ir gyvūnų augintinių, kuriems
    netaikoma oficiali kontrolė pasienio kontrolės postuose, iš dalies keičiamas
    Deleguotasis reglamentas (ES) 2019/2122 ir dėl nuorodų į tam tikrus panaikintus
    teisės aktus iš dalies keičiamas tas deleguotasis reglamentas ir Deleguotasis
    reglamentas (ES) 2019/2074
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/2089 tal-21 ta’ Settembru
    2021 li jemenda r-Regolament Delegat (UE) 2019/2122 fir-rigward ta’ ċerti kategoriji
    ta’ oġġetti li jippreżentaw riskju baxx, oġġetti li jkunu parti mill-bagalji
    personali tal-passiġġieri u annimali domestiċi eżentati mill-kontrolli uffiċjali
    fil-postijiet ta’ kontroll fuq il-fruntieri u li jemenda dak ir-Regolament Delegat
    u r-Regolament Delegat (UE) 2019/2074 fir-rigward tar-referenzi għal ċerta leġiżlazzjoni
    mħassra
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/2089 van de Commissie van 21 september
    2021 tot wijziging van Gedelegeerde Verordening (EU) 2019/2122 wat betreft bepaalde
    categorieën goederen met een laag risico, goederen die deel uitmaken van de persoonlijke
    bagage van passagiers en gezelschapsdieren die van officiële controles aan grenscontroleposten
    zijn vrijgesteld, en tot wijziging van die gedelegeerde verordening en Gedelegeerde
    Verordening (EU) 2019/2074 wat betreft verwijzingen naar bepaalde ingetrokken
    wetgeving
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/2089 z dnia 21 września 2021
    r. zmieniające rozporządzenie delegowane (UE) 2019/2122 w odniesieniu do niektórych
    kategorii towarów stwarzających niskie ryzyko, do towarów stanowiących część
    bagażu osobistego pasażerów i do zwierząt domowych zwolnionych z kontroli
    urzędowych w punktach kontroli granicznej oraz zmieniające to rozporządzenie
    delegowane i rozporządzenie delegowane (UE) 2019/2074 w zakresie odesłań do
    pewnych uchylonych aktów prawnych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/2089 da Comissão de 21 de setembro de 2021
    que altera o Regulamento Delegado (UE) 2019/2122 no que diz respeito a determinadas
    categorias de mercadorias de baixo risco, às mercadorias que fazem parte da bagagem
    pessoal dos passageiros e aos animais de companhia isentos de controlos oficiais
    nos postos de controlo fronteiriços, e que altera esse regulamento delegado e
    o Regulamento Delegado (UE) 2019/2074 no que diz respeito às referências a determinada
    legislação revogada
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/2089 al Comisiei din 21 septembrie 2021
    de modificare a Regulamentului delegat (UE) 2019/2122 în ceea ce privește anumite
    categorii de produse care prezintă un risc mic, produse care fac parte din bagajele
    personale ale pasagerilor și animale de companie exceptate de la efectuarea controalelor
    oficiale la posturile de inspecție la frontieră, precum și de modificare a
    Regulamentului delegat respectiv și a Regulamentului delegat (UE) 2019/2074 în
    ceea ce privește trimiterile la anumite acte legislative abrogate
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/2089 z 21. septembra 2021, ktorým
    sa mení delegované nariadenie (EÚ) 2019/2122, pokiaľ ide o určité kategórie
    tovaru, ktoré predstavujú nízke riziko, tovaru, ktorý je súčasťou osobnej
    batožiny cestujúcich, a spoločenské zvieratá oslobodené od úradných kontrol
    na hraničných kontrolných staniciach, a ktorým sa mení uvedené delegované
    nariadenie a delegované nariadenie (EÚ) 2019/2074, pokiaľ ide o odkazy na určité
    zrušené právne predpisy
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/2089 z dne 21. septembra 2021 o spremembi
    Delegirane uredbe (EU) 2019/2122 glede nekaterih kategorij blaga, ki predstavlja
    nizko tveganje, blaga, ki je del osebne prtljage potnikov, in hišnih živali,
    ki so izvzete iz uradnega nadzora na mejnih kontrolnih točkah, ter o spremembi
    navedene delegirane uredbe in Delegirane uredbe (EU) 2019/2074 glede sklicevanj
    na nekatero razveljavljeno zakonodajo
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/2089 de la Comisión de 21 de septiembre
    de 2021 por el que se modifica el Reglamento Delegado (UE) 2019/2122 en lo que
    respecta a determinadas categorías de mercancías que plantean escaso riesgo,
    a las mercancías que forman parte del equipaje personal de los pasajeros y a
    los animales de compañía exentos de controles oficiales en los puestos de control
    fronterizos, y por el que se modifican dicho Reglamento Delegado y el Reglamento
    Delegado (UE) 2019/2074 en lo que respecta a las referencias a determinados actos
    legislativos derogados
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/2089 av den 21 september
    2021 om ändring av delegerad förordning (EU) 2019/2122 vad gäller vissa kategorier
    av varor som utgör en låg risk, varor som ingår i passagerares personliga bagage
    och sällskapsdjur som är undantagna från offentlig kontroll vid gränskontrollstationer
    samt om ändring av den delegerade förordningen och delegerad förordning (EU)
    2019/2074 vad gäller hänvisningar till viss upphävd lagstiftning
