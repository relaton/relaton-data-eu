id: EURegulation20212089
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/2089 of 21 September 2021 amending
    Delegated Regulation (EU) 2019/2122 as regards certain categories of goods posing
    low risk, goods that form part of passengers’ personal luggage and pet animals
    exempted from official controls at border control posts and amending that Delegated
    Regulation and Delegated Regulation (EU) 2019/2074 as regards references to certain
    repealed legislation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/2089 de la Commission du 21 septembre 2021
    modifiant le règlement délégué (UE) 2019/2122 en ce qui concerne certaines
    catégories de biens présentant un faible risque, les biens contenus dans les
    bagages personnels des passagers et les animaux de compagnie exemptés des contrôles
    officiels aux postes de contrôle frontaliers, et modifiant ledit règlement délégué
    ainsi que le règlement délégué (UE) 2019/2074 en ce qui concerne les références
    à certains actes législatifs abrogés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/2089 der Kommission vom 21. September 2021
    zur Änderung der Delegierten Verordnung (EU) 2019/2122 hinsichtlich bestimmter
    Kategorien von Waren, von denen ein geringes Risiko ausgeht, Waren, die im persönlichen
    Gepäck von Fahrgästen bzw. Passagieren mitgeführt werden, und hinsichtlich
    Heimtieren, die von amtlichen Kontrollen an Grenzkontrollstellen ausgenommen sind,
    sowie zur Änderung der genannten Delegierten Verordnung und der Delegierten Verordnung
    (EU) 2019/2074 in Bezug auf Verweise auf bestimmte aufgehobene Rechtsakte
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/2089 на Комисията
    от 21 септември 2021 година за изменение на Делегиран
    регламент (ЕС) 2019/2122 по отношение на някои категории
    нискорискови стоки, на стоките, които са част
    от личния багаж на пътниците, и на домашните
    любимци, освободени от официален контрол на
    граничните контролни пунктове, и за изменение
    на посочения делегиран регламент и на Делегиран
    регламент (ЕС) 2019/2074 по отношение на позоваванията
    на определени отменени законодателни актове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/2089 ze dne 21. září
    2021, kterým se mění nařízení v přenesené pravomoci (EU) 2019/2122, pokud
    jde o některé kategorie zboží představujícího nízké riziko, zboží,
    které tvoří součást osobních zavazadel cestujících, a zvířat v zájmovém
    chovu osvobozených od úředních kontrol na stanovištích hraniční kontroly,
    a mění uvedené nařízení v přenesené pravomoci a nařízení v přenesené
    pravomoci (EU) 2019/2074, pokud jde o odkazy na některé zrušené právní předpisy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/2089 af 21. september 2021
    om ændring af delegeret forordning (EU) 2019/2122 for så vidt angår visse kategorier
    af varer, der udgør en lav risiko, varer, der indgår i passagerers personlige
    bagage, og selskabsdyr, der er undtaget fra offentlig kontrol på grænsekontrolsteder,
    og om ændring af nævnte delegerede forordning og delegeret forordning (EU) 2019/2074
    for så vidt angår henvisninger til visse ophævede retsakter
  type: main
- language: el
  script: Grek
