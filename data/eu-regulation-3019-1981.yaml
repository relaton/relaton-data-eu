    originari degli Stati dell' Africa, dei Caraibi e del Pacifico o dei paesi e territori
    d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3019/81 van de Raad van 19 oktober 1981 tot wijziging
    van Verordening (EEG) nr. 435/80 inzake de regeling voor landbouwprodukten en
    bepaalde door verwerking van landbouwprodukten verkregen goederen, van oorsprong
