  content: Council Regulation (EEC) No 3019/81 of 19 October 1981 amending Regulation
    (EEC) No 435/80 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States or in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3019/81 du Conseil, du 19 octobre 1981, modifiant
    le règlement (CEE) n° 435/80 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d' Afrique, des Caraïbes et du Pacifique ou des pays et
    territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/81 des Rates vom 19. Oktober 1981 zur Änderung
    der Verordnung (EWG) Nr. 435/80 über die Regelung für landwirtschaftliche Erzeugnisse
    und für bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit
    Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean
    oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3019/81 af 19. oktober 1981 om ændring af
    forordning (EØF) nr. 435/80 om den ordning, der skal gælde for landbrugsprodukter
    og visse varer fremstillet af landbrugsprodukter med oprindelse i staterne i Afrika,
    Vestindien og Stillehavet eller i de oversøiske lande og territorier
  type: main
- language: el
  script: Grek
