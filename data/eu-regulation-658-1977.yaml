title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 658/77 of 29 March 1977 re-establishing
    the levying of customs duties on cotton yarn put up for retail sale, falling within
    heading No 55.06, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 658/77 de la Commission, du 29 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton conditionnés pour la vente au détail, de la position tarifaire 55.06,
    originaires des pays et territoires en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 658/77 der Kommission vom 29. März 1977 zur Wiedereinführung
    des Zollsatzes für Baumwollgarne in Aufmachungen für den Einzelverkauf der Tarifnummer
    55.06, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 658/77 af 29. marts 1977 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger under
    position 55.06, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 658/77 della Commissione, del 29 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili ai filati di cotone preparati per
    la vendita al minuto, della voce doganale 55.06, originari dei paesi in via di
    sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 658/77 van de Commissie van 29 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij Verordening (EEG)
    nr. 3022/76 van de Raad tariefpreferenties werden geopend
  type: main
