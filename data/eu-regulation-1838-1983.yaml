  content: Commission Regulation (EEC) No 1838/83 of 5 July 1983 re-establishing the
    levying of customs duties applicable to ethylene glycol, falling within subheading
    29.04 C ex I originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1838/83 de la Commission du 5 juillet 1983 portant
