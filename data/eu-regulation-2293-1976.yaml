  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2293/76 della Commissione, del 22 settembre 1976,
    che modifica il regolamento (CEE) n. 990/72 relativo alle modalità per la concessione
    di aiuti al latte scremato trasformato in alimenti composti ed al latte scremato
    in polvere destinato all' alimentazione degli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2293/76 van de Commissie van 22 september 1976 houdende
