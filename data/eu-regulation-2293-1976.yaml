    into compound feedingstuffs and for skimmed-milk powder for use as feed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2293/76 de la Commission, du 22 septembre 1976, modifiant
    le règlement (CEE) n° 990/72 relatif aux modalités d' octroi des aides au lait
    écrémé transformé en aliments composés pour animaux et au lait écrémé
    en poudre destiné à l' alimentation des animaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2293/76 der Kommission vom 22. September 1976 zur
