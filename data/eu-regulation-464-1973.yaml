  content: Regulation (EEC) No 464/73 of the Commission of 31 January 1973 on a transitional
    measure arising from Accession and relating to the cancellation of import licences
    for milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 464/73 de la Commission, du 31 janvier 1973, relatif
    à une mesure transitoire à prendre du fait de l' adhésion de nouveaux États
    membres, concernant l' annulation de certificats d' importation dans le secteur
    du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 464/73 der Kommission vom 31. Januar 1973 über eine
    infolge des Beitritts zu treffende Übergangsmaßnahme zur Annullierung von Einfuhrlizenzen
    für Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 464/73 af 31. januar 1973 om en overgangsforanstaltning,
