    inden for sektoren mælk og mejeriprodukter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 464/73 della Commissione, del 31 gennaio 1973, relativo
    ad una disposizione transitoria da adottare in seguito all' adesione dei nuovi
    Stati membri, riguardante l' annullamento dei titoli d' importazione nel settore
    del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 464/73 van de Commissie van 31 januari 1973 met betrekking
