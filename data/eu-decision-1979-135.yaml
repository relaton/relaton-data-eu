title:
- language: en
  script: Latn
  content: '79/135/EEC: Commission Decision of 6 February 1979 making trade in crude
    oil and/or petroleum products between Luxembourg and other Member States subject
    to a system of authorization to be granted automatically by the exporting Member
    State (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/135/CEE: Décision de la Commission, du 6 février 1979, subordonnant
    les échanges de pétrole brut et/ou de produits pétroliers entre le Luxembourg
    et les autres Etats membres à un système d''autorisation à accorder automatiquement
    par l''État membre de provenance (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '79/135/EWG: Entscheidung der Kommission vom 6. Februar 1979 zur Unterstellung
    der Ausfuhren von Rohöl und/oder Erdölerzeugnissen zwischen Luxemburg und den
    anderen Mitgliedstaaten unter ein System automatisch erteilter Genehmigungen durch
    den Herkunftsmitgliedstaat (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/135/EØF: Kommissionens beslutning af 6. februar 1979 om for handelen
    mellem Luxembourg og de øvrige medlemsstater med mineralolie og/eller mineralolieprodukter
    at indføre en ordning med licenser, som automatisk udstedes af den udførende
    medlemsstat (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/135/CEE: Decisione della Commissione, del 6 febbraio 1979, che subordina
    gli scambi di petrolio greggio e/o di prodotti petroliferi tra il Lussemburgo
    e gli altri Stati membri ad un sistema di autorizzazioni rilasciate automaticamente
    dallo Stato membro di provenienza (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/135/EEG: Beschikking van de Commissie van 6 februari 1979 waarbij het
    handelsverkeer van ruwe aardolie en/of aardolieprodukten tussen Luxemburg en de
    andere Lid- Staten wordt onderworpen aan een stelsel van vergunningen die automatisch
    door de Lid-Staat van herkomst moeten worden verleend (Slechts de tekst in de
    Franse taal is authentiek)'
