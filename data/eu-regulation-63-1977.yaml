  content: Commission Regulation (EEC) No 63/77 of 13 January 1977 amending for the
    fifth time Regulation (EEC) No 1143/74 as regards the amount of subsidies for
    certain wine products consigned to Ireland or to the United Kingdom during the
    period 1 January to 3 June 1977
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 63/77 de la Commission, du 13 janvier 1977, portant
