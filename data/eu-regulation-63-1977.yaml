    für bestimmte Weinbauerzeugnisse, die in der Zeit vom 1. Januar bis 30. Juni
    1977 nach Irland und dem Vereinigten Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 63/77 af 13. januar 1977 om femte ændring
