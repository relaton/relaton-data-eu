    Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1231/69 der Kommission vom 30. Juni 1969 über die
    Zusatzzölle, die ab 1. Juli 1969 bei der Einfuhr in die Gemeinschaft von unter
    die Verordnung (EWG) Nr. 1059/69 des Rates fallenden Waren anwendbar sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1231/69 della Commissione, del 30 giugno 1969, relativo
    ai dazi addizionali applicabili, a partire dal 1 luglio 1969, all'importazione
    nella Comunità delle merci cui si applica il regolamento (CEE) n. 1059/69 del
    Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1231/69 van de Commissie van 30 juni 1969 betreffende
