    uredb (ES) št. 382/2008, (ES) št. 1518/2003, (ES) št. 596/2004, (ES) št. 633/2004
    in (ES) št. 951/2006 glede datumov za izdajo izvoznih dovoljenj za leto 2011
    v sektorjih govejega in telečjega mesa, prašičjega mesa, jajc in perutninskega
    mesa ter izvenkvotnega sladkorja in izvenkvotne izoglukoze
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1000/2010 de la Comisión, de 3 de noviembre de 2010
    , por el que se establecen excepciones a los Reglamentos (CE) n ° 2402/96, (CE)
    n ° 2058/96, (CE) n ° 2305/2003, (CE) n ° 969/2006, (CE) n ° 1918/2006, (CE)
    n ° 1964/2006, (CE) n ° 27/2008, (CE) n ° 1067/2008 y (CE) n ° 828/2009, en
    lo que atañe a las fechas para la presentación de solicitudes y la expedición
    de certificados de importación en 2011 en el marco de contingentes arancelarios
    de batatas, fécula de mandioca, mandioca, cereales, arroz, azúcar y aceite de
    oliva, y se establecen excepciones a los Reglamentos (CE) n ° 382/2008, (CE)
    n ° 1518/2003, (CE) n ° 596/2004, (CE) n ° 633/2004 y (CE) n ° 951/2006, en
    lo que atañe a las fechas de expedición de certificados de exportación en 2011
    en los sectores de la carne de vacuno, la carne de porcino, los huevos, la carne
    de aves de corral y el azúcar y la isoglucosa al margen de cuota
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 1000/2010 av den 3 november 2010 om undantag
    från förordningarna (EG) nr 2402/96, (EG) nr 2058/96, (EG) nr 2305/2003, (EG)
    nr 969/2006, (EG) nr 1918/2006, (EG) nr 1964/2006, (EG) nr 27/2008, (EG) nr 1067/2008
    och (EG) nr 828/2009 vad gäller tidpunkterna för inlämnande av ansökningar
    om och utfärdande av importlicenser under 2011 inom ramen för tullkvoterna för
    sötpotatis, maniokstärkelse, maniok, spannmål, ris, socker och olivolja och
    om undantag från förordningarna (EG) nr 382/2008, (EG) nr 1518/2003, (EG) nr
    596/2004, (EG) nr 633/2004 och (EG) nr 951/2006 vad gäller tidpunkterna för
    utfärdande av exportlicenser under 2011 inom sektorerna för nötkött, griskött,
    ägg, fjäderfäkött, utomkvotssocker och utomkvotsisoglukos
