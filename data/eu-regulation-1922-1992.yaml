    præmie ved slagtning af får og om ophævelse af forordning (EØF) nr. 2661/80
    samt om betingelserne for tilbagebetaling af clawback som følge af Domstolens
    dom i de forenede sager nr. 38/90 og 151/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1922/92 της Επιτροπής
    της 13ης Ιουλίου 1992 περί τροποποίησης του κανονισμού
    (ΕΟΚ) αριθ. 1633/84 για τις λεπτομέρειες εφαρμογής
    της μεταβλητής προμοδότησης για τη σφαγή των
    προβατοειδών και για κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 2661/80, και περί καθορισμού των όρων
