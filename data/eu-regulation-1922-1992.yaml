title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1922/92 of 13 July 1992 amending Regulation
    (EEC) No 1633/84 laying down detailed rules for applying the variable slaughter
    premium for sheep and repealing Regulation (EEC) No 2661/80 and determining the
    conditions for the reimbursement of the clawback following the Judgment of the
    Court of Justice in Joined Cases C-38/90 and C- 151/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1922/92 de la Commission, du 13 juillet 1992, modifiant
    le règlement (CEE) n° 1633/84 portant modalités d'application de la prime variable
    à l'abattage des ovins et abrogeant le règlement (CEE) n° 2661/80 et déterminant
    les conditions du remboursement du clawback à la suite de l'arrêt rendu par
    la Cour de justice dans les affaires jointes C-38/90 et C-151/90
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1922/92 der Kommission vom 13. Juli 1992 zur Änderung
    der Verordnung (EWG) Nr. 1633/84 mit Durchführungsbestimmungen für die variable
    Schlachtprämie für Schafe und zur Aufhebung der Verordnung (EWG) Nr. 2661/80
    sowie zur Regelung der Erstattung erhobener Beträge gemäß dem Urteil des Gerichtshofes
    in den verbundenen Rechtssachen C-38/90 und C-151/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1922/92 af 13. juli 1992 om ændring
