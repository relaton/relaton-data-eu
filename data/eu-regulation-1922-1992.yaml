  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1922/92, annettu 13 päivänä heinäkuuta 1992,
    lampaiden muuttuvan teurastuspalkkion soveltamista koskevista yksityiskohtaisista
    säännöistä ja asetuksen (ETY) N:o 2661/80 kumoamisesta annetun asetuksen (ETY)
    N:o 1633/84 muuttamisesta sekä takaisinperinnän korvaamisen edellytyksistä
    yhteisön tuomioistuimen yhdistetyissä tapauksissa C-38/90 ja C-151/90 antaman
    tuomion vuoksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1922/92 della Commissione, del 13 luglio 1992, recante
    modificazione del regolamento (CEE) n. 1633/84 che stabilisce le modalità di
    applicazione del premio variabile alla macellazione degli ovini e che abroga il
    regolamento (CEE) n. 2661/80, e recante le modalità del rimborso dell'importo
    riscosso all'uscita dei prodotti, a seguito della sentenza della Corte di giustizia
    nelle cause riunite C-38/90 e C-151/90
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1922/92 van de Commissie van 13 juli 1992 tot wijziging
    van Verordening (EEG) nr. 1633/84 houdende uitvoeringsbepalingen inzake de variabele
    slachtpremie voor schapen en tot intrekking van Verordening (EEG) nr. 2661/80,
    alsmede tot vaststelling, naar aanleiding van het arrest van het Hof van Justitie
    in de gevoegde zaken C-38/90 en C-151/90, van de voorwaarden voor de terugbetaling
    van de "clawback"
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1922/92 da Comissão, de 13 de Julho de 1992, que
    altera o Regulamento (CEE) nº 1633/84, que estabelece as modalidades de aplicação
    do prémio variável ao abate de ovinos e revoga o Regulamento (CEE) nº 2661/80
    e que estabelece as condições para o reembolso do clawback, na sequência do
    acórdão do Tribunal de Justiça proferido nos processos apensos C 38/90 e C
    151/90
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1922/92 de la Comisión, de 13 de julio de 1992, por
    el que se modifica el Reglamento (CEE) nº 1633/84 sobre modalidades de aplicación
    de la prima variable por sacrificio de ovinos y por el que se deroga el Reglamento
    (CEE) nº 2661/80, y por el que se determinan las condiciones para el reembolso
    del importe cobrado en concepto de recuperación de la prima a raíz de la sentencia
    del Tribunal de Justicia en los asuntos acumulados nº C 38/90 y nº C 151/90
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1922/92 av den 13 juli 1992 om ändring
