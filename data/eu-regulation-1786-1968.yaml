title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1786/68 de la Commission, du 8 novembre 1968, autorisant
    les États membres à prendre des mesures dérogatoires à certains critères
    des normes de qualité applicables aux exportations vers les pays tiers des bulbes,
    oignons et tubercules à fleurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1786/68 der Kommission vom 8. November 1968, mit der
    die Mitgliedstaaten ermächtigt werden, abweichende Maßnahmen in bezug auf gewisse
    Kriterien der Qualitätsnormen für Blumenbulben, - zwiebeln und -knollen bei
    Ausfuhren nach Drittländern zu treffen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1786/68 della Commissione, dell'8 novembre 1968, che
    autorizza gli Stati membri a prendere misure di deroga a taluni criteri delle
    norme di qualità applicabili alle esportazioni verso i paesi terzi di bulbi,
    tuberi e rizomi da fiore
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1786/68 van de Commissie van 8 november 1968 waarbij
    de Lid-Staten worden gemachtigd tot het treffen van maatregelen welke afwijken
    van bepaalde criteria van de kwaliteitsnormen die gelden bij uitvoer naar derde
    landen van bloembollen en bloemknollen
  type: main
