  content: Commission Implementing Regulation (EU) 2025/636 of 25 March 2025 amending
    Annexes III and V to Implementing Regulation (EU) 2020/2235 as regards model animal
    health certificates, model official certificates, model animal health/official
    certificates and private attestation, for the entry into the Union or transit
    through the Union to a third country of consignments of certain categories of
    animals and goods intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (ue) 2025/636 de la Commission du 25 mars 2025
    modifiant les annexes III et V du règlement d’exécution (UE) 2020/2235 en
    ce qui concerne les modèles de certificat zoosanitaire, de certificat officiel,
    de certificat zoosanitaire/officiel et d’attestation privée pour l’entrée
    dans l’Union ou le transit par celle-ci vers un pays tiers d’envois de certaines
    catégories d’animaux et de biens destinés à la consommation humaine
  type: main
- language: de
