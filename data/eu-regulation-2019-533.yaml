    en ter beoordeling van de blootstelling van de consument aan bestrijdingsmiddelenresiduen
    in en op levensmiddelen van plantaardige en dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/533 z dnia 28 marca 2019 r.
    dotyczące wieloletniego skoordynowanego unijnego programu kontroli na lata 2020,
    2021 i 2022, mającego na celu zapewnienie zgodności z najwyższymi dopuszczalnymi
    poziomami pozostałości pestycydów w żywności pochodzenia roślinnego i zwierzęcego
    oraz na jej powierzchni, a także mającego na celu ocenę narażenia konsumenta
    na te pozostałości
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/533 da Comissão, de 28 de março de
