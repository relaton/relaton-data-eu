    para 2020, 2021 y 2022 destinado a garantizar el respeto de los límites máximos
    de residuos de plaguicidas en y sobre los alimentos de origen vegetal y animal
    y a evaluar el grado de exposición de los consumidores a estos residuos
  type: main
- language: sv
  script: Latn
