    skladnosti z mejnimi vrednostmi ostankov pesticidov v ali na živilih rastlinskega
    in živalskega izvora ter za oceno izpostavljenosti potrošnikov ostankom teh
    pesticidov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/533 de la Comisión, de 28 de marzo
