title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/533 of 28 March 2019 concerning
    a coordinated multiannual control programme of the Union for 2020, 2021 and 2022
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/533 de la Commission du 28 mars 2019
    concernant un programme de contrôle, pluriannuel et coordonné, de l'Union pour
    2020, 2021 et 2022, destiné à garantir le respect des teneurs maximales en résidus
    de pesticides dans et sur les denrées alimentaires d'origine végétale et animale
    et à évaluer l'exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/533 der Kommission vom 28. März 2019
    über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2020, 2021
    und 2022 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/533 на Комисията
    от 28 март 2019 година относно координирана многогодишна
    контролна програма на Съюза за 2020, 2021 и 2022 г.
    за гарантиране на спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от растителен
    и животински произход и за оценка на експозицията
    на потребителите на тези пестицидни остатъци
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/533 ze dne 28. března 2019 o
    koordinovaném víceletém kontrolním programu Unie pro roky 2020, 2021 a 2022
    s cílem zajistit dodržování maximálních limitů reziduí pesticidů v potravinách
    rostlinného a živočišného původu a na jejich povrchu a vyhodnotit expozici
    spotřebitelů těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/533 af 28. marts 2019
    om et samordnet flerårigt EU-kontrolprogram for 2020, 2021 og 2022 med det formål
    at sikre overholdelse af maksimalgrænseværdierne for pesticidrester i og på
    vegetabilske og animalske fødevarer og at vurdere forbrugernes eksponering for
    disse rester
  type: main
- language: el
  script: Grek
