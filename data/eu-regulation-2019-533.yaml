    2020, 2021 e 2022, destinado a garantir o respeito dos limites máximos de resíduos
    de pesticidas no interior e à superfície dos alimentos de origem vegetal e animal
    e a avaliar a exposição dos consumidores a estes resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/533 al Comisiei din 28 martie
    2019 privind un program de control multianual coordonat al Uniunii pentru 2020,
    2021 și 2022 vizând asigurarea respectării limitelor maxime de reziduuri de
    pesticide și evaluarea expunerii consumatorilor la reziduurile de pesticide din
    și de pe alimentele de origine vegetală și animală
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/533 z 28. marca 2019 o koordinovanom
    viacročnom kontrolnom programe Únie na roky 2020, 2021 a 2022 s cieľom zabezpečiť
    dodržiavanie maximálnych hladín rezíduí pesticídov a posúdiť vystavenie
    spotrebiteľov rezíduám pesticídov v potravinách rastlinného a živočíšneho
    pôvodu a na nich
  type: main
