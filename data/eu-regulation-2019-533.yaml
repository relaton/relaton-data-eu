    l-2021 u l-2022 biex tiġi żgurata l-konformità mal-livelli massimi ta' residwi
    ta' pestiċidi fi u fuq ikel li joriġina mill-pjanti u mill-annimali u biex jiġi
    vvalutat l-esponiment tal-konsumatur għalihom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/533 van de Commissie van 28 maart 2019
    inzake een in 2020, 2021 en 2022 uit te voeren gecoördineerd meerjarig controleprogramma
