    értékelésére irányuló, a 2020., a 2021. és a 2022. évre vonatkozó többéves
    összehangolt uniós ellenőrzési programról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/533 della Commissione, del 28 marzo
    2019, relativo a un programma coordinato di controllo pluriennale dell'Unione
    per il 2020, il 2021 e il 2022, destinato a garantire il rispetto dei livelli
    massimi di residui di antiparassitari e a valutare l'esposizione dei consumatori
    ai residui di antiparassitari nei e sui prodotti alimentari di origine vegetale
    e animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/533 (2019. gada 28. marts) par
    saskaņotu Savienības daudzgadu kontroles programmu 2020., 2021. un 2022. gadam,
    kas pieņemta, lai nodrošinātu atbilstību maksimālajiem pesticīdu atlieku
    līmeņiem un novērtētu patērētāju eksponētību pesticīdu atliekām augu
