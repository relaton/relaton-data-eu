title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1807/94 of 22 July 1994 determining the extent
    to which applications lodged in July 1994 for licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1807/94 de la Commission, du 22 juillet 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1994 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords intérimaires conclus par
    la Communauté avec la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1807/94 der Kommission vom 22. Juli 1994 über die
    Festsetzung des Umfangs, in dem die im Juli 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und Rumänien und Bulgarien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1807/94 af 22. juli 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1994 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de interimsaftaler, som Fællesskabet har indgået
    med Republikken Rumænien og Bulgarien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1807/94 της Επιτροπής
    της 22ας Ιουλίου 1994 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Ιούλιο του 1994 για άδειες
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις ενδιάμεσες
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Ρουμανία και τη Βουλγαρία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1807/94 della Commissione, del 22 luglio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1994 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi interinali conclusi
    tra la Comunità e la Romania e la Bulgaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1807/94 van de Commissie van 22 juli 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sectoren eieren en pluimvee, die in juli 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1807/94 da Comissão, de 22 de Julho de 1994, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos dos sectores dos ovos e da carne de aves de capoeira
    apresentados em Julho de 1994 ao abrigo do regime previsto nos acordos provisórios
    concluídos pela Comunidade com a Roménia e a Bulgária
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1807/94 de la Comisión, de 22 de julio de 1994, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos de los sectores de la carne de aves de corral
    y de los huevos presentadas en el mes de julio de 1994 al amparo del régimen
    previsto en los Acuerdos interinos celebrados entre la Comunidad y Rumanía y
    Bulgaria
  type: main
