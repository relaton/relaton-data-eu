title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 juin 1967, relative à la fixation du
    pourcentage à prendre en considération à partir du 1er juillet 1967, pour la
    détermination du taux des prélèvements compensateurs institués en application
    de l'article 10 paragraphe 2 deuxième alinéa du Traité
  type: main
- language: de
  script: Latn
  content: '67/458/EWG: Entscheidung der Kommission vom 26. Juni 1967 über die Festsetzung
    des Hundertsatzes, der ab 1. Juli 1967 bei der Berechnung des gemäß Artikel
    10 Absatz (2) zweiter Unterabsatz des Vertrages eingeführten anteiligen Zollsatzes
    zugrunde zu legen ist'
  type: main
- language: it
  script: Latn
  content: '67/458/CEE: Decisione della Commissione, del 26 giugno 1967, relativa
    alla fissazione della percentuale da prendere in considerazione a decorrere dal
    1 luglio 1967 per la determinazione dell''aliquota dei prelievi compensativi istituiti
    in applicazione dell''articolo 10, paragrafo 2, secondo comma, del Trattato'
  type: main
- language: nl
  script: Latn
  content: '67/458/EEG: Beschikking van de Commissie van 26 juni 1967 inzake de vaststelling
    van het percentage dat met ingang van 1 juli 1967 voor de bepaling van de hoogte
    van de met toepassing van artikel 10, lid 2, tweede alinea, van het Verdrag ingestelde
    compenserende heffingen in aanmerking dient te worden genomen'
  type: main
