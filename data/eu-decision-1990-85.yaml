    (rovings) mit Ursprung in der Tschechoslowakei und der Deutschen Demokratischen
    Republik und die Bestaetigung des Auslaufens dieser Massnahmen (90/85/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 1. marts 1990 om afslutning af den fornyede
