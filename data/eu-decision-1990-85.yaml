  content: '90/85/EEC: Commission Decision of 1 March 1990 terminating the review
    of anti-dumping measures applying to imports of certain glass textile fibres (rovings)
    originating in Czechoslovakia and the German Democratic Republic and confirming
    the expiry of the said measures'
  type: main
- language: fr
  script: Latn
  content: '90/85/CEE: Décision de la Commission du 1er mars 1990 portant clôture
    du réexamen des mesures antidumping applicables aux importations de certaines
    fibres de verre textiles (rovings) originaires de Tchécoslovaquie et de la République
    démocratique allemande et confirmant l''expiration desdites mesures'
  type: main
