title:
- language: en
  script: Latn
  content: '89/279/EEC: Commission Decision of 31 March 1989 authorizing certain Member
    States provisionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC, in respect of plants of Juniperus L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '89/279/CEE: Décision de la Commission du 31 mars 1989 autorisant certains
    États membres à prévoir provisoirement des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil pour les végétaux du Juniperus L. originaires
    du Japon'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 31. März 1989 zur einstweiligen Ermächtigung
    bestimmter Mitgliedstaaten, für Pflanzen von Juniperus L., mit Ursprung in Japan,
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
    (89/279/EWG) #'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 31. marts 1989 om midlertidig bemyndigelse
    af visse medlemsstater til at undtage planter af Juniperus L. med oprindelse i
    Japan fra visse bestemmelser i Rådets direktiv 77/93/EØF (89/279/EØF)
  type: main
- language: el
  script: Grek
  content: '89/279/EOK: Απόφαση της Επιτροπής της 31ης Μαρτίου
    1989 που επιτρέπει σε ορισμένα κράτη μέλη προσωρινά
    να προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου, όσον αφορά
    τα φυτά του είδους Juniperus L. καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 31 marzo 1989 che autorizza provvisoriamente
    alcuni Stati membri a stabilire deroghe a determinate disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda i vegetali di Juniperus L. originari
    del Giappone (89/279/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 31 maart 1989 houdende machtiging van
    bepaalde Lid-Staten om, voor planten van Juniperus L., van oorsprong uit Japan,
    voorlopig afwijkingen toe te staan van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad (89/279/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 31 de Março de 1989 que autoriza certos Estados-membros
    a prever provisoriamente derrogaçoes a determinadas disposiçoes da Directiva
    77/93/CEE do Conselho, para plantas de Juniperus L. originarias do Japao (89/279/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 31 de marzo de 1989 por la que se autoriza
    provisionalmente a determinados Estados miembros para establecer excepciones a
    algunas disposiciones de la Directiva 77/93/CEE del Consejo, en relación con
    los vegetales de Juníperus L. originarios de Japón (89/279/CEE) #'
  type: main
