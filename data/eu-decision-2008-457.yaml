title:
- language: en
  script: Latn
  content: '2008/457/EC: Commission Decision of 5 March 2008 laying down rules for
    the implementation of Council Decision 2007/435/EC establishing the European Fund
    for the Integration of third-country nationals for the period 2007 to 2013 as
    part of the General programme Solidarity and Management of Migration Flows as
    regards Member States'' management and control systems, the rules for administrative
    and financial management and the eligibility of expenditure on projects co-financed
    by the Fund (notified under document number C(2008) 795)'
  type: main
- language: fr
  script: Latn
  content: '2008/457/CE: Décision de la Commission du 5 mars 2008 fixant les modalités
    de mise en œuvre de la décision 2007/435/CE du Conseil portant création du
    Fonds européen d''intégration des ressortissants de pays tiers pour la période
    2007-2013 dans le cadre du programme général Solidarité et gestion des flux
    migratoires en ce qui concerne les systèmes de gestion et de contrôle des États
    membres, les règles de gestion administrative et financière et l''éligibilité
    des dépenses pour les projets cofinancés par le Fonds [notifiée sous le numéro
    C(2008) 795]'
  type: main
- language: de
  script: Latn
  content: '2008/457/EG: Entscheidung der Kommission vom 5. März 2008 mit Durchführungsbestimmungen
