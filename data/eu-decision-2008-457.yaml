    für die Integration von Drittstaatsangehörigen für den Zeitraum 2007 bis 2013
    innerhalb des Generellen Programms Solidarität und Steuerung der Migrationsströme
    in Bezug auf die Verwaltungs- und Kontrollsysteme der Mitgliedstaaten, die Vorschriften
    für die Verwaltung und finanzielle Abwicklung aus dem Fonds kofinanzierter Projekte
    und die Förderfähigkeit der Ausgaben im Rahmen solcher Projekte (Bekannt gegeben
    unter Aktenzeichen K(2008) 795)'
