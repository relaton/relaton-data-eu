title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2118/75 of the Commission of 12 August 1975 amending
    Regulation (EEC) No 540/75 on additional measures to be taken in agriculture following
    the fixing, with effect from 4 August 1975, of new representative rates for the
    currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2118/75 de la Commission, du 12 août 1975, modifiant
    le règlement (CEE) n° 540/75 en ce qui concerne les mesures supplémentaires
    à prendre dans le secteur agricole suite à la fixation, avec effet au 4 août
    1975, de nouveaux taux représentatifs pour les monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2118/75 der Kommission vom 12. August 1975 zur Änderung
    der Verordnung (EWG) Nr. 540/75 hinsichtlich ergänzender Maßnahmen, die in der
    Landwirtschaft im Anschluß an die Festsetzung neuer repräsentativer Kurse für
    die Währungen einiger Mitgliedstaaten ab 4. August 1975 zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2118/75 af 12. august 1975 om ændring
    af forordning (EØF) nr. 540/75 for så vidt angår de supplerende foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den fastsættelse,
    som får virkning fra den 4. august 1975, af de nye repræsentative kurser for
    visse medlemsstaters valutaer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2118/75 della Commissione, del 12 agosto 1975, che
    modifica il regolamento (CEE) n. 540/75 per quanto riguarda le misure supplementari
    da adottare nel settore agricolo in seguito alla fissazione, con effetto dal 4
    agosto 1975, di nuovi tassi rappresentativi per le monete di alcuni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2118/75 van de Commissie van 12 augustus 1975 tot
    wijziging van Verordening (EEG) nr. 540/75 ten aanzien van de in de landbouwsector
    te nemen aanvullende maatregelen naar aanleiding van de vaststelling voor de munteenheden
    van bepaalde Lid-Staten, van nieuwe representatieve koersen die gelden met ingang
    van 4 augustus 1975
  type: main
