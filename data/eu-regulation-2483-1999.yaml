title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2483/1999 of 25 November 1999 deducting from
    the quantitative limit on imports of textile goods pertaining to category 4 originating
    in the People's Republic of China an amount corresponding to that imported into
    the European Community in circumvention of the Agreement between the European
    Community and the People's Republic of China on trade in MFA textile products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2483/1999 de la Commission, du 25 novembre 1999, déduisant
    de la limite quantitative fixée pour les importations de produits textiles de
    la catégorie 4 originaires de la République populaire de Chine un volume équivalent
    aux produits importés dans la Communauté européenne en contournement de l'accord
    entre la Communauté européenne et la République populaire de Chine sur le commerce
    des produits textiles AMF
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2483/1999 der Kommission vom 25. November 1999 zur
    Kürzung der Höchstmenge für die Einfuhren von Textilwaren der Kategorie 4 mit
