title:
- language: en
  script: Latn
  content: Commission Decision of 5 December 1980 authorizing the French Republic
    not to apply Community treatment to handkerchiefs of woven fabric originating
    in the People's Republic of China (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 décembre 1980, autorisant la République
    française à exclure du traitement communautaire les mouchoirs en tissus originaires
    de la République populaire de Chine (Le texte en langue française est le seul
    faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Dezember 1980 zur Ermächtigung der
    Französischen Republik, aus der Volksrepublik China stammende Taschentücher
    aus Gewebe von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 5. december 1980 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage lommetørklæder af bomuld,
    med oprindelse i Den kinesiske Folkerepublik (Kun den franske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 dicembre 1980, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i fazzoletti da naso, di tessuti,
    originari della Repubblica popolare cinese (Il testo in lingua francese è il
    solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 december 1980 houdende machtiging van
    de Franse Republiek om zakdoeken van katoenen weefsel, van oorsprong uit de Volksrepubliek
    China, van de communautaire behandeling uit te sluiten (Slechts de tekst in de
    Franse taal is authentiek)
