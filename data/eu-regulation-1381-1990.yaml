title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1381/90 of 22 May 1990 re-establishing the
    levying of customs duties on babies'garments and clothing accessories, products
    of category 68 (order No 40.0680), originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1381/90 de la Commission du 22 mai 1990 portant rétablissement
    de la perception des droits de douane applicables aux vêtements et accessoires
    du vêtement pour bébés de la catégorie de produits n° 68 (numéro d'ordre
    40.0680) originaires de Thaïlande, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1381/90 DER KOMMISSION vom 22. Mai 1990 ueber die
    Wiedereinfuehrung des Zollsatzes fuer Saeuglingskleidung und Bekleidungszubehoer
    fuer Saeuglinge der Warenkategorie 68 (laufende Nummer 40.0680) mit Ursprung in
    Thailand, dem die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1381/90 af 22. maj 1990 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør til spædbørn,
    under varekategori nr. 68 (løbenummer 40.0680), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1381/90 της Επιτροπής
    της 22ας Μαΐου 1990 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για ενδύματα και συμπληρώματα
    ένδυσης για βρέφη, προϊόντα της κατηγορίας
    68 ( αύξων αριθμός 40.0680 ), καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3897/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1381/90 DELLA COMMISSIONE del 22 maggio 1990 che ripristina
    la riscossione dei dazi doganali applicabili agli indumenti ed accessori di abbigliamento
    per bambini piccoli (bébé), della categoria di prodotti n. 68 (numero d'ordine
    40.0680) originari della Tailandia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1381/90 VAN DE COMMISSIE van 22 mei 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op babykleding
    en -kledingtoebehoren, van de categorie van produkten nr. 68 (volgnummer 40.0680),
    van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1381/90 DA COMISSAO de 22 de Maio de 1990 que restabelece
