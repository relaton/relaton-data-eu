  content: '82/213/EEC: Commission Decision of 17 March 1982 establishing that the
    apparatus described as ''Perkin- Elmer - atomic absorption spectrophotometer,
    model 4000G'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/213/CEE: Décision de la Commission, du 17 mars 1982, constatant que
    l''importation de l''appareil dénommé "Perkin Elmer - atomic absorption spectrophotometer,
    model 4000 G", ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/213/EWG: Entscheidung der Kommission vom 17. März 1982 mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer-Atomic Absorption Spectrophotometer, model
    4000G" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/213/EØF: Kommissionens beslutning af 17. marts 1982 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer-Atomic Absorption Spectrophotometer,
    model 4000 G" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
