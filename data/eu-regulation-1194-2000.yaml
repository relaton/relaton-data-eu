title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1194/2000 of 6 June 2000 derogating from
    Regulation (EC) No 708/98 on the taking over of paddy rice by the intervention
    agencies and fixing the corrective amounts and the price increases and reductions
    to be applied, with respect to the period for delivery to the intervention agency
    in the 1999/2000 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1194/2000 de la Commission du 6 juin 2000 dérogeant
    au règlement (CE) nº 708/98 relatif à la prise en charge du riz paddy par les
    organismes d'intervention et fixant les montants correcteurs ainsi que les bonifications
    et les réfactions à appliquer, en ce qui concerne la période de livraison à
    l'intervention pour la campagne 1999/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1194/2000 der Kommission vom 6. Juni 2000 zur Abweichung
    von der Verordnung (EG) Nr. 708/98 über die Übernahme von Rohreis durch die
    Interventionsstellen und zur Festsetzung der anzuwendenden Berichtigungsbeträge,
    Zu- und Abschläge hinsichtlich des Lieferzeitraums im Wirtschaftsjahr 1999/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1194/2000 af 6. juni 2000 om fravigelse
    af forordning (EF) nr. 708/98 om interventionsorganernes overtagelse af uafskallet
    ris og om fastsættelse af korrektionsbeløb samt tillæg og fradrag, for så
    vidt angår perioden for levering til intervention for høståret 1999/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1194/2000 της Επιτροπής,
    της 6ης Ιουνίου 2000, για παρέκκλιση από τον κανονισμό
    (ΕΚ) αριθ. 708/98 για την ανάληψη του αναποφλοίωτου
    ρυζιού (paddy) από τους οργανισμούς παρέμβασης
    και για τον καθορισμό των όρων εφαρμογής διορθωτικών
    ποσών καθώς και των προσαυξήσεων και μειώσεων
    που πρέπει να εφαρμοστούν, όσον αφορά την περίοδο
    παράδοσης στην παρέμβαση για την περίοδο εμπορίας
    1999/2000
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1194/2000, annettu 6 päivänä kesäkuuta 2000,
    interventioelinten suorittamasta paddy- eli raakariisin haltuunotosta ja sovellettavien
    korjausmäärien sekä hinnankorotusten ja -alennusten vahvistamisesta annetusta
    asetuksesta (EY) N:o 708/98 poikkeamisesta interventioon toimittamisen määräajan
    osalta markkinointivuonna 1999/2000
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1194/2000 della Commissione, del 6 giugno 2000, recante
    deroga al regolamento (CE) n. 708/98 relativo alla presa in consegna del risone
    da parte degli organismi d'intervento e alla fissazione degli importi correttori,
    delle maggiorazioni e delle detrazioni da applicare, con riguardo al periodo di
    consegna all'intervento per la campagna 1999/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1194/2000 van de Commissie van 6 juni 2000 houdende
    afwijking, wat de periode voor de levering voor interventie voor het verkoopseizoen
    1999/2000 betreft, van Verordening (EG) nr. 708/98 betreffende de overname van
    padie door de interventiebureaus en houdende vaststelling van de toe te passen
    correctiebedragen, toeslagen en kortingen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1194/2000 da Comissão, de 6 de Junho de 2000, que
    derroga o Regulamento (CE) n.o 708/98 relativo à tomada a cargo do arroz paddy
    pelos organismos de intervenção e que fixa os montantes correctores, as bonificações
    e as depreciações a aplicar por estes organismos, no que diz respeito ao período
    de entrega para intervenção na campanha de 1999/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1194/2000 de la Comisión, de 6 de junio de 2000, por
    el que se establece una excepción en lo que respecta al período de entrega a
    la intervención para la campaña de 1999/2000, al Reglamento (CE) nº 708/98
    relativo a la aceptación del arroz con cáscara por los organismos de intervención
    y por el que se fijan los importes correctores, las bonificaciones y los descuentos
    que deben aplicarse
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1194/2000 av den 6 juni 2000 om undantag
