  script: Latn
  content: COMMISSION REGULATION (EEC) No 2693/93 of 29 September 1993 re-establishing
    the levying of customs duties on products of categories 156 and 157 (order Nos
    42.1560 and 42.1570), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2693/93 de la Commission du 29 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 156 et 157 (numéros d'ordre 42.1560 et 42.1570) originaires de
    Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2693/93 DER KOMMISSION vom 29. September 1993 zur
    Wiedereinführung des Zollsatzes für die Waren der Kategorien 156 und 157 (laufende
    Nummern 42.1560 und 42.1570) mit Ursprung in China, für die die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2693/93 af 29. september 1993 om genindførelse
