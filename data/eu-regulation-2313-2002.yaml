  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2313/2002, annettu 20 päivänä joulukuuta 2002,
    joulukuussa 2002 jätettyjen tiettyjä siipikarjanlihasta peräisin olevia tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä tiettyjen siipikarjanlihaa
