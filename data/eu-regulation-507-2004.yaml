title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 507/2004 of 18 March 2004 determining to
    what extent applications lodged in March 2004 for the right to import young male
    bovine animals for fattening can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 507/2004 de la Commission du 18 mars 2004 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de mars 2004 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 507/2004 der Kommission vom 18. März 2004 zur Bestimmung
    des Umfangs, in welchem den im März 2004 gestellten Anträgen auf Einfuhrrechte
    für zur Mast bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 507/2004 af 18. marts 2004 om fastsættelse
    af nedsættelsesprocentsatsen for de ansøgninger om importrettigheder, der i
    marts 2004 er indgivet for ungtyre til opfedning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 507/2004 της Επιτροπής,
    της 18ης Μαρτίου 2004, για καθορισμό του βαθμού
    στον οποίο μπορούν να γίνουν δεκτές οι αιτήσεις
    για δικαιώματα εισαγωγής, οι οποίες υπεβλήθησαν
    τον Μάρτιο του 2004 για τα νεαρά αρσενικά βοοειδή
    που προορίζονται γα πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 507/2004, annettu 18 päivänä maaliskuuta 2004,
    lihotettaviksi tarkoitettujen nuorten urospuolisten nautojen tuonnista maaliskuussa
    2004 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 507/2004 della Commissione, del 18 marzo 2004, che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate nel mese di marzo 2004 per giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 507/2004 van de Commissie van 18 maart 2004 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in maart 2004 zĳn ingediend voor de invoer van jonge mannelĳke
    mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 507/2004 da Comissão, de 18 de Março de 2004, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Março de 2003 para os bovinos machos jovens para engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 507/2004 de la Comisión, de 18 de marzo de 2004, por
    el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación de bovinos machos jóvenes destinados al engorde presentadas en
    el mes de marzo de 2003
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 507/2004 av den 18 mars 2004 om i vilken
