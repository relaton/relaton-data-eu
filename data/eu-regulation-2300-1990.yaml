title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2300/90 of 26 July 1990 on the application
    of Decision No 4/90 of the EEC-Norway Joint Committee supplementing and amending
    Annex III to Protocol No 3 concerning the definition of the concept of 'originating
    products' and methods of administrative cooperation - Decision No 4/90 of the
    EEC-Norway Joint Committee of 19 June 1990 supplementing and amending, in the
    framework of the Joint Declaration concerning the review of the changes to the
    origin rules as a result of the introduction of the harmonized system, Annex III
    to Protocol No 3 concerning the definition of the concept of 'originating products'
    and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2300/90 de la Commission, du 26 juillet 1990, concernant
    l'application de la décision n° 4/90 du comité mixte CEE-Norvège complétant
    et modifiant le protocole n° 3 relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative - Décision n°
    4/90 du comité mixte CEE- Norvège, du 19 juin 1990, complétant et modifiant,
    dans le cadre de la déclaration commune concernant le réexamen des changements
    apportés aux règles d'origine à la suite de l'introduction du système harmonisé,
    l'annexe III du protocole n° 3 relatif à la définition de la notion de «produits
    originaires» et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2300/90 der Kommission vom 26. Juli 1990 zur Anwendung
    des Beschlusses Nr. 4/90 des Gemischten Ausschusses EWG-Norwegen zur Ergänzung
    und Änderung des Protokolls Nr. 3 über die Bestimmung des Begriffs "Erzeugnisse
    mit Ursprung in" oder "Ursprungserzeugnisse" und über die Methoden der Zusammenarbeit
    der Verwaltungen - Beschluß Nr. 4/90 des Gemischten Ausschusses EWG-Norwegen
    vom 19. Juni 1990 zur Ergänzung und Änderung von Anhang III des Protokolls Nr.
    3 über die Bestimmung des Begriffs "Erzeugnisse mit Ursprung in" oder "Ursprungserzeugnisse"
    und über die Methoden der Zusammenarbeit der Verwaltungen betreffend die Änderungen
    der Ursprungsregeln infolge der Einführung des Harmonisierten Systems
  type: main
- language: da
  script: Latn
