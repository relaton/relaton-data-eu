  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2300/90 della Commissione, del 26 luglio 1990, relativo
    all'applicazione della decisione n. 4/90 del comitato misto CEE-Norvegia che completa
    e modifica il protocollo n. 3 relativo alla definizione della nozione di «prodotti
    originari» ed ai metodi di cooperazione amministrativa - Decisione n. 4/90 del
    comitato misto CEE-Norvegia, del 19 giugno 1990, che completa e modifica, nell'ambito
    della dichiarazione comune riguardante la revisione delle modifiche alle regole
    di origine in conseguenza dell'introduzione del sistema armonizzato, l'allegato
    III del protocollo n. 3 relativo alla definizione della nozione di «prodotti
    originari» ed ai metodi di cooperazione amministrativa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2300/90 van de Commissie van 26 juli 1990 betreffende
    de toepassing van Besluit nr. 4/90 van het Gemengd Comité EEG-Noorwegen tot aanvulling
    en wijziging van Protocol nr. 3 betreffende de definitie van het begrip "produkten
    van oorsprong" en de methoden van administratieve samenwerking - Besluit nr. 4/90
    van het Gemengd Comité EEG-Noorwegen van 19 juni 1990 houdende aanvulling en
    wijziging, in het kader van de gemeenschappelijke verklaring betreffende de herziening
    van de wijzigingen in de regels betreffende de oorsprong ten gevolge van de invoering
    van het geharmoniseerd systeem, van bijlage III bij Protocol nr. 3 betreffende
    de definitie van het begrip "produkten van oorsprong" en de methoden van administratieve
    samenwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2300/90 da Comissão, de 26 de Julho de 1990, relativo
    à aplicação da Decisão nº 4/90 do Comité Misto CEE-Noruega, que completa
    e altera o Protocolo nº 3 relativo à definição da noção de «produtos originários»
    e aos métodos de cooperação administrativa - Decisão nº 4/90 do Comité Misto
    CEE- Noruega, de 19 de Junho de 1990, que completa e altera, no âmbito da declaração
    conjunta relativa à revisão das alterações às regras de origem na sequência
    da introdução do Sistema Harmonizado, o anexo III do Protocolo nº 3 relativo
    à definição da noção de «produtos originários» e aos métodos de cooperação
    administrativa
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2300/90 de la Comisión, de 26 de julio de 1990, relativo
    a la aplicación de la Decisión nº 4/90 del Comité Mixto CEE-Noruega por la
    que se completa y modifica el Protocolo nº 3 relativo a la definición de «productos
    originarios» y a los métodos de cooperación administrativa - Decisión nº
    4/90 del Comité Conjunto CEE-Noruega, de 19 de junio de 1990, por la que se completa
    y modifica el Anexo III al Protocolo nº 3 relativo a la definición de la noción
    de «productos originarios» y a los métodos de cooperación administrativa,
    en el marco de la Declaración Conjunta relativa a la revisión de los cambios
    de las reglas de origen como resultado de la introducción del sistema armonizado
