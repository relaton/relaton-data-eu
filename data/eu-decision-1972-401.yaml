id: EUDecision1972401
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 novembre 1972, autorisant la République
    française à exclure du traitement communautaire les appareils de reproduction
    du son (lecteurs de cassettes) et les appareils mixtes d'enregistrement et de
    reproduction du son, des positions 92.11 A Ex II et 92.11 A III du Tarif douanier
    commun, originaires du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/401/EWG: Entscheidung der Kommission vom 24. November 1972, mit der
    die Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Tonwiedergabegeräte (Kassetten-Wiedergabegeräte)
    und kombinierte Tonaufnahme- und Tonwiedergabegeräte der Tarifnummern 92.11 A
    ex II und 92.11 A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/401/CEE: Decisione della Commissione, del 24 novembre 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    di riproduzione del suono (lettori di cassette) ed apparecchi misti di registrazione
    e di riproduzione del suono delle voci nn. 92.11 A ex II e 92.11 A III della tariffa
    doganale comune, originari del Giappone e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/401/EEG: Beschikking van de Commissie van 24 november 1972 waarbij
    de Franse Republiek wordt gemachtigd toestellen voor het weergeven van geluid
    (cassettelezers) en gecombineerde opname- en weergavetoestellen van posten 92.11
    A ex II en 92.11 A III van het gemeenschappelijk douanetarief, van oorsprong uit
    Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
