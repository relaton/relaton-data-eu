title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1653/92 of 26 June 1992 determining to what
    extent applications for import licences for calves not exceeding 80 kilograms
    lodged under Regulation (EEC) No 1350/92 can be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1653/92 de la Commission du 26 juin 1992 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CEE) n° 1350/92 relatif à l'importation
    de veaux n'excédant pas 80 kilogrammes
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1653/92 DER KOMMISSION vom 26. Juni 1992 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Erteilung von Lizenzen für die Einfuhr
    von höchstens 80 kg wiegenden Rindern gemäß Verordnung (EWG) Nr. 1350/92 stattgegeben
    werden kann #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1653/92 af 26. juni 1992 om fastsættelse
    af, i hvilken udstrækning ansøgninger om udstedelse af importlicenser for kalve
    på ikke over 80 kg i henhold til forordning (EØF) nr. 1350/92 kan imødekommes
    #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1653/92 της Επιτροπής
    της 26ης Ιουνίου 1992 για τον καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται,
    βάσει του κανονισμού (ΕΟΚ) αριθ. 1350/92 για την
    εισαγωγή μόσχων που δεν υπερβαίνουν τα 80 χιλιόγραμμα
  type: main
- language: it
  script: Latn
  content: "#REGOLAMENTO (CEE) N. 1653/92 DELLA COMMISSIONE del 26 giugno 1992 che stabilisce in che misura possono essere accolte le domande di titoli di importazione presentate nel quadro del regolamento (CEE) n. 1350/92 per l' importazione di vitelli di peso non superiore a 80 chilogrammi #"
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1653/92 VAN DE COMMISSIE van 26 juni 1992 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om afgifte van invoercertificaten
    die zijn ingediend op grond van Verordening (EEG) nr. 1350/92 betreffende de invoer
    van kalveren van maximaal 80 kg #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1653/92 DA COMISSÃO de 26 de Junho de 1992 que determina
    em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados ao abrigo do Regulamento (CEE) no 1350/92 relativo
    à importação de vitelos de peso não superior a 80 quilogramas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1653/92 DE LA COMISIÓN de 26 de junio de 1992 por
    el que se determina en qué medida se podrá dar curso a las solicitudes de expedición
    de certificados de importación presentadas con arreglo al Reglamento (CEE) no
    1350/92 relativo a las importaciones de terneros cuyo peso no exceda de 80 kilogramos
    #'
