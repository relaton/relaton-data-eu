id: EUDecision1999745
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/745/EC: Commission Decision of 4 November 1999 concerning the grant
    of Community assistance for evaluation of Community structural interventions and
    modifying the relevant Commission Decision approving programming documents in
    the different Member States (with the exception of Objective 1 and 6 regions)
    in respect of Objective 5(a), covering the period between 1994 and 1999 (notified
    under document number C(1999) 3124) (Only the Spanish, Danish, German, English,
    French, Italian, Dutch, Finnish and Swedish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '1999/745/CE: Décision de la Commission, du 4 novembre 1999, concernant
    l''octroi d''un concours communautaire pour l''évaluation des interventions structurelles
    communautaires relatives à l''amélioration des conditions de transformation
    et de commercialisation des produits agricoles et sylvicoles et modifiant les
    décisions de la Commission y afférentes portant approbation des documents de
    programmation dans les différents États membres (hors des régions relevant
    des objectifs 1 et 6), au titre de l''objectif 5 a), couvrant la période entre
    1994 et 1999 [notifiée sous le numéro C(1999) 3124] (Les textes en langues espagnole,
    danoise, allemande, anglaise, française, italienne, néerlandaise, finnoise et
    suédoise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '1999/745/EG: Entscheidung der Kommission vom 4. November 1999 über die
    Zuweisung von Gemeinschaftsmitteln für die Bewertung der strukturellen Interventionen
    der Gemeinschaft zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen
    land- und forstwirtschaftlicher Erzeugnisse und zur Änderung der jeweiligen Entscheidungen
    der Kommission zur Genehmigung der den Zeitraum 1994 bis 1999 betreffenden Programmplanungsdokumente
    in den verschiedenen Mitgliedstaaten (mit Ausnahme der Ziel-1- und Ziel-6-Regionen)
    im Rahmen des Ziels 5a (Bekanntgegeben unter Aktenzeichen K(1999) 3124) (Nur der
    spanische, dänische, deutsche, englische, französische, italienische, niederländische,
    finnische, und schwedische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '1999/745/EF: Kommissionens beslutning af 4. november 1999 om EF-bistand
    til evaluering af EF-strukturinterventioner for forbedring af vilkårene for forarbejdning
    og afsætning af landbrugs- og skovbrugsprodukter og om ændring af de relevante
    kommissionsbeslutninger om godkendelse af programmeringsdokumenterne i de forskellige
    medlemsstater (med undtagelse af regioner under mål 1 og 6) med hensyn til mål
    5a for perioden mellem 1994 og 1999 (meddelt under nummer K(1999) 3124) (Kun de
    spanske, danske, tyske, engelske, franske, italienske, nederlandske, finske og
    svenske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '1999/745/ΕΚ: Απόφαση της Επιτροπής, της 4ης
    Νοεμβρίου 1999, σχετικά με τη χορήγηση κοινοτικής
    βοήθειας για την αξιολόγηση των διαρθρωτικών
    παρεμβάσεων της Κοινότητας με σκοπό τη βελτίωση
    των συνθηκών μεταποίησης και εμπορίας γεωργικών
    και δασοκομικών προϊόντων και για την τροποποίηση
    των σχετικών αποφάσεων της Επιτροπής σχετικά
    με την έγκριση εγγράφων προγραμματισμού στα
    διάφορα κράτη μέλη (με εξαίρεση τις περιφέρειες
    των στόχων 1 και 6), όσον αφορά το στόχο 5α, για
    την περίοδο μεταξύ 1994 και 1999 [κοινοποιηθείσα
    υπό τον αριθμό Ε(1999) 3124] (Τα κείμενα στην ισπανική,
    δανική, γερμανική, αγγλική, γαλλική, ιταλική,
    ολλανδική, φινλανδική και σουηδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '1999/745/EY: Komission päätös, tehty 4 päivänä marraskuuta 1999,
    yhteisön tuesta maa- ja metsätaloustuotteiden jalostamisen ja kaupan pitämisen
    edellytysten parantamista koskevien rakenteellisten toimien arviointiin sekä
    ohjelmakautta 1994-1999 koskevien jäsenvaltioiden (tavoitteen 1- ja 6-alueita
    lukuun ottamatta) ohjelma-asiakirjojen hyväksymistä koskevien komission päätösten
    muuttamisesta tavoite 5a -alueiden osalta (tiedoksiannettu numerolla K(1999) 3124)
    (Ainoastaan espanjan-, tanskan-, saksa-, englannin-, ranskan-, italian-, hollannin-,
    suomen- ja ruotsinkieliset vedokset ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '1999/745/CE: Decisione della Commissione, del 4 novembre 1999, riguardante
    la concessione di aiuti comunitari per la valutazione degli interventi strutturali
    della Comunità destinati a migliorare le condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e della silvicoltura e recante modifica delle decisioni
    della Commissione in materia che approvano documenti di programmazione nei vari
    Stati membri nel quadro dell''obiettivo 5a), escluse le regioni degli obiettivi
    1 e 6, per il periodo 1994/1999 [notificata con il numero C(1999) 3124] (I testi
    in lingua spagnola, danese, tedesca, inglese, francese, italiana, olandese, finlandese
    e svedese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '1999/745/EG: Beschikking van de Commissie van 4 november 1999 inzake toekenning
    van communautaire steun voor evaluatie van de structurele bijstandsverlening van
    de Gemeenschap voor verbetering van de verwerking en de afzet van land- en bosbouwproducten
    en tot wijziging van de betrokken beschikkingen van de Commissie houdende goedkeuring
    van programmeringsdocumenten voor de verschillende lidstaten in het kader van
    doelstelling 5 a) (buiten gebieden van doelstelling 1 en doelstelling 6), voor
    de periode 1994-1999 (kennisgeving geschied onder nummer C(1999) 3124)'
  type: main
- language: pt
  script: Latn
  content: '1999/745/CE: Decisão da Comissão, de 4 de Novembro de 1999, relativa
    à concessão de apoio comunitário para a avaliação de intervenções estruturais
    comunitárias destinadas ao melhoramento das condições de transformação e
    comercialização dos produtos agrícolas e silvícolas e que altera as decisões
    pertinentes da Comissão que aprovam documentos de programação nos diversos
    Estados-Membros (com excepção das regiões dos objectivos n° 1 e n° 6) respeitantes
    ao objectivo n° 5a, para o período compreendido entre 1994 e 1999 [notificada
    com o número C(1999) 3124]'
  type: main
- language: es
  script: Latn
  content: '1999/745/CE: Decisión de la Comisión, de 4 de noviembre de 1999, relativa
    a la concesión de ayudas comunitarias para la evaluación de las intervenciones
    estructurales comunitarias para mejorar las condiciones de transformación y comercialización
    de los productos agrícolas y de la silvicultura y por la que se modifican las
    Decisiones de la Comisión pertinentes por las que se aprueban documentos de programación
    en los distintos Estados miembros (a excepción de las regiones de los objetivos
    nos 1 y 6) con respecto al objetivo nº 5 a), para el período comprendido entre
    1994 y 1999 [notificada con el número C(1999) 3124] (Los textos en lenguas española,
    danesa, alemana, inglesa, francesa, italiana, neerlandesa, finesa y sueca son
    los únicos auténticos)'
  type: main
- language: sv
  script: Latn
  content: '1999/745/EG: Kommissionens beslut av den 4 november 1999 om beviljande
    av gemenskapsstöd för utvärdering av gemenskapens strukturåtgärder för förbättring
    av bearbetnings- och saluföringsförhållandena för jord- och skogsbruksprodukter
    och om ändring av kommissionens berörda beslut om godkännande av programplaneringsdokument
    för perioden mellan 1994 och 1999 i medlemsstaterna (med undantag för mål 1-
    och mål 6-regioner) när det gäller mål 5 a [delgivet med nr K(1999) 3124]
    (Endast de spanska, danska, tyska, engelska, franska, italienska, nederländska,
    finska och svenska texterna är giltiga)'
