title:
- language: fr
  script: Latn
  content: '63/580/CEE: Décision de la Commission, du 15 octobre 1963, prorogeant
    la validité de la décision de la Commission du 11 septembre 1963 autorisant
    la République française à diminuer les prélèvements pour les oeufs en coquille
    destinés à la consommation'
  type: main
- language: de
  script: Latn
  content: '63/580/ÅWG: Entscheidung der Kommission vom 15. Oktober 1963 zur Verlängerung
    der Geltungsdauer der Entscheidung der Kommission vom 11. September 1963, durch
    die die Republik ermächtigt wird, die Abschöpfungsbeträge für Eier in der
    Schale, die zum Verbrauch bestimmt sind, zu verringern'
  type: main
- language: it
  script: Latn
  content: '63/580/CEE: Decisione della Commissione del 15 ottobre 1963 relativa alla
    proroga della validità della decisione della Commissione dell''11 settembre 1963
    che autorizza la Repubblica francese a ridurre i prelievi per le uova in guscio
    destinate al consumo'
  type: main
- language: nl
  script: Latn
  content: '63/580/EEG: Beschikking van de Commissie van 15 oktober 1963 tot verlenging
    van de geldigheidsduur van de beschikking van de Commissie van 11 september 1963,
    waarbij de Franse Republiek wordt gemachtigd het bedrag van de heffingen voor
    eieren in de schaal die voor consumptie bestemd zijn te verlagen'
  type: main
