  content: '84/51/EEC: Commission Decision of 20 January 1984 establishing that the
    apparatus described as ''Kaman - High-temperature Pressure Measuring System, model
    KP1941'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/51/CEE: Décision de la Commission du 20 janvier 1984 constatant que
    l''importation des appareils dénommés "Kaman - High Temperature pressure measuring
    system, model KP 1941" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
