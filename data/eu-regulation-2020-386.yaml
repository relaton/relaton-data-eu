    se refiere a la lista de terceros países o partes de terceros países desde los
    que está autorizada la introducción en la Unión de productos cárnicos y de
    estómagos, vejigas e intestinos tratados, y se modifica el anexo II del Reglamento
    (UE) n.o 206/2010 en lo que respecta a la lista de terceros países, territorios
    o partes de terceros países o territorios desde los que está autorizada la introducción
    en la Unión de carne fresca
  type: main
