    krajín alebo ich častí, z ktorých je povolený vstup mäsových výrobkov
    a opracovaných žalúdkov, mechúrov a čriev do Únie, a ktorým sa mení príloha
    II k nariadeniu (EÚ) č. 206/2010, pokiaľ ide o zoznam tretích krajín, území
    alebo ich častí, z ktorých sa povoľuje vstup čerstvého mäsa do Únie
  type: main
