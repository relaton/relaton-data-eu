    magar, blåsor och tarmar får föras in till unionen och om ändring av bilaga
    II till förordning (EU) nr 206/2010 vad gäller förteckningen över tredjeländer,
    områden eller delar därav från vilka det är tillåtet att föra in färskt
    kött till unionen
