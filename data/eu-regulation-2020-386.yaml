title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/386 of 9 March 2020 amending
    Annex II to Decision 2007/777/EC as regards the list of third countries or parts
    thereof from which the introduction into the Union of meat products and treated
    stomachs, bladders and intestines is authorised, and amending Annex II to Regulation
    (EU) No 206/2010 as regards the list of third countries, territories or parts
    thereof from which the introduction into the Union of fresh meat is authorised
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/386 de la Commission du 9 mars 2020
    modifiant l’annexe II de la décision 2007/777/CE en ce qui concerne la liste
    des pays tiers ou parties de pays tiers en provenance desquels l’introduction
    de produits à base de viande et d’estomacs, vessies et boyaux traités dans
    l’Union est autorisée, et modifiant l’annexe II du règlement (UE) no 206/2010
    en ce qui concerne la liste des pays tiers, territoires ou parties de pays tiers
    en provenance desquels l’introduction de viandes fraîches dans l’Union est
    autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/386 der Kommission vom 9. März 2020
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich der Liste
    der Drittländer bzw. Teile von Drittländern, aus denen die Einfuhr von Fleischerzeugnissen
    und behandelten Mägen, Blasen und Därmen in die Union zugelassen ist, und zur
    Änderung des Anhang II der Verordnung (EU) Nr. 206/2010 hinsichtlich der Liste
    der Drittländer, Gebiete oder Teile davon, aus denen das Verbringen frischen
    Fleisches in die Union zulässig ist
  type: main
