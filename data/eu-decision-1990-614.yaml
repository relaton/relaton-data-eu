  script: Latn
  content: '90/614/EEC: Commission Decision of 13 November 1990 amending for the sixth
    time Decision 82/351/EEC recognizing certain parts of the territory of the Federal
    Republic of Germany as being officially swine- fever-free (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/614/CEE: Décision de la Commission du 13 novembre 1990 portant sixième
    modification de la décision 82/351/CEE reconnaissant certaines parties du territoire
    de la République Fédérale d''Allemagne comme officiellement indemnes de peste
    porcine (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '90/614/EWG: Entscheidung der Kommission vom 13. November 1990 zur sechsten
    Änderung der Entscheidung 82/351/EWG, durch die bestimmte Teile des Hoheitsgebiets
    der Bundesrepublik Deutschland als amtlich schweinepestfrei anerkannt werden (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/614/EØF: Kommissionens beslutning af 13. november 1990 om sjette ændring
