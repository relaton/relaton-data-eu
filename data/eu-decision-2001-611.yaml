    päätöksen 92/160/ETY muuttamisesta Meksikon alueellistamisen osalta, päätösten
    92/260/ETY, 93/195/ETY, 93/196/ETY ja 93/197/ETY muuttamisesta Meksikosta tapahtuvan
    hevoseläinten tuonnin osalta sekä päätösten 95/392/EY ja 96/486/EY kumoamisesta
    (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla K(2001) 2214)'
  type: main
