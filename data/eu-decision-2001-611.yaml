  script: Latn
  content: '2001/611/EZ: Odluka Komisije od 20. srpnja 2001. o izmjeni Odluke 92/160/EEZ
    o regionalizaciji Meksika i o izmjeni odluka 92/260/EEZ, 93/195/EEZ, 93/196/EEZ
    i 93/197/EEZ o uvozu kopitara iz Meksika, te o stavljanju izvan snage odluka 95/392/EZ
    i 96/486/EZ (priopćena pod brojem dokumenta C(2001) 2214)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. július 20.) a 92/160/EGK határozatnak
    Mexikó régióba sorolása tekintetében történő módosításáról, a 92/260/EGK,
    a 93/195/EGK, a 93/196/EGK és a 93/197/EGK határozatnak a lófélék Mexikóból
    történő behozatala tekintetében történő módosításáról, valamint a
    95/392/EK és a 96/486/EK határozat hatályon kívül helyezéséről (az értesítés
    a C(2001) 2214. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2001/611/CE: Decisione della Commissione, del 20 luglio 2001, che modifica
    la decisione 92/160/CEE per quanto riguarda la regionalizzazione del Messico,
    che modifica le decisioni 92/260/CEE, 93/195/CEE, 93/196/CEE e 93/197/CEE per
    quanto concerne le importazioni di equidi dal Messico e che abroga le decisioni
    95/392/CE e 96/486/CE (Testo rilevante ai fini del SEE) [notificata con il numero
    C(2001) 2214]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 20. jūlijs), ar ko groza Lēmumu 92/160/EEK
    attiecībā uz Meksikas reģionalizāciju, ar ko groza Lēmumus 92/260/EEK, 93/196/EEK
    un 93/197/EEK par zirgu dzimtas dzīvnieku ievešanu no Meksikas, un atceļ Lēmumus
    95/392/EK un 96/486/EK (izziņots ar dokumenta numuru C(2001) 2214)
  type: main
- language: lt
  script: Latn
  content: 2001 m. liepos 20 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    92/160/EEB dėl Meksikos regionavimo, iš dalies keičiantis Sprendimus 92/260/EEB,
    93/195/EEB, 93/196/EEB ir 93/197/EEB dėl arklinių šeimos gyvūnų importo iš
    Meksikos bei panaikinantis Sprendimus 95/392/EB ir 96/486/EB (pranešta dokumentu
    Nr. C(2001) 2214)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni ta’ l-20 ta’ Lulju 2001. li temenda
