    93/196/CEE și 93/197/CEE privind importurile de ecvidee din Mexic și de abrogare
    a Deciziilor 95/392/CE și 96/486/CE [notificată cu numărul C(2001) 2214]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 20. júla 2001, ktorým sa mení a dopĺňa rozhodnutie
