    d-Deċiżjonijiet 92/260/KEE, 93/195/KEE, 93/196/KEE u 93/197/KEE rigward l-importazzjoni
    tar-razez taż-żwiemel mill-Messiku u li tħassar d-Deċiżjonijiet 95/392/KE
    u 96/486/KE (notifikata bid-dokument numru K(2002) 2214)
  type: main
