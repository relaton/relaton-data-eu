  script: Latn
  content: '2001/611/EF: Kommissionens beslutning af 20. juli 2001 om ændring af
    beslutning 92/160/EØF med hensyn til områdeopdeling af Mexico, om ændring af
    beslutning 92/260/EØF, 93/195/EØF, 93/196/EØF og 93/197/EØF med hensyn til
    import af dyr af hestefamilien fra Mexico og om ophævelse af beslutning 95/392/EF
    og 96/486/EF (EØS-relevant tekst) (meddelt under nummer K(2001) 2214)'
  type: main
