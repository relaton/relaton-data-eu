    e 96/486/CE (Texto relevante para efeitos do EEE) [notificada com o número C(2001)
    2214]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 20 iulie 2001 de modificare a Deciziei 92/160/CEE
