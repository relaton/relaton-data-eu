    van Beschikking 92/160/EEG met betrekking tot de regionalisering van Mexico, houdende
    wĳziging van de Beschikkingen 92/260/EEG, 93/195/EEG, 93/196/EEG en 93/197/EEG
    met betrekking tot de invoer van paardachtigen uit Mexico en houdende intrekking
    van de Beschikkingen 95/392/EG en 96/486/EG (Voor de EER relevante tekst) (kennisgeving
    geschied onder nummer C(2001) 2214)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 20 lipca 2001 r. zmieniająca decyzję 92/160/EWG
