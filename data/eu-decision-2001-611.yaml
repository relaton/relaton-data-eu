title:
- language: en
  script: Latn
  content: '2001/611/EC: Commission Decision of 20 July 2001 amending Decision 92/160/EEC
    with regard to the regionalisation of Mexico, amending Decisions 92/260/EEC, 93/195/EEC,
    93/196/EEC and 93/197/EEC with regard to imports of equidae from Mexico and repealing
    Decisions 95/392/EC and 96/486/EC (Text with EEA relevance) (notified under document
    number C(2001) 2214)'
  type: main
- language: fr
  script: Latn
  content: '2001/611/CE: Décision de la Commission du 20 juillet 2001 modifiant la
    décision 92/160/CEE en ce qui concerne la régionalisation du Mexique, modifiant
    les décisions 92/260/CEE, 93/195/CEE, 93/196/CEE et 93/197/CEE en ce qui concerne
    les importations d''équidés en provenance du Mexique et abrogeant les décisions
    95/392/CE et 96/486/CE (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2001) 2214]'
  type: main
- language: de
  script: Latn
  content: '2001/611/EG: Entscheidung der Kommission vom 20. Juli 2001 zur Änderung
    der Entscheidung 92/160/EWG hinsichtlich der Regionalisierung von Mexiko, zur
    Änderung der Entscheidungen 92/260/EWG, 93/195/EWG, 93/196/EWG und 93/197/EWG
    und zur Aufhebung der Entscheidung 95/392/EG und 96/486/EG (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 2214)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 20 юли 2001 година
    за изменение на Решение 92/160/ЕИО относно регионализацията
    на Мексико, за изменение на Решения 92/260/ЕИО,
    93/195/ЕИО и 93/197/ЕИО по отношение на вноса на еднокопитни
    животни от Мексико и за отмяна на Решения 95/392/ЕО
    и 96/486/ЕО (нотифицирано под номер С(2001) 2214)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 20. července 2001, kterým se mění rozhodnutí
    92/160/EHS, pokud jde o regionalizaci Mexika, a rozhodnutí 92/260/EHS, 93/195/EHS,
    93/196/EHS a 93/197/EHS, pokud jde o dovoz koňovitých z Mexika, a kterým se
    zrušují rozhodnutí 95/392/ES a 96/486/ES (oznámeno pod číslem K(2001) 2214)
  type: main
