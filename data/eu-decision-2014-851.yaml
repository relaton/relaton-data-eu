title:
- language: en
  script: Latn
  content: '2014/851/EU, Euratom: Commission Implementing Decision of 26 November
    2014 amending Decision 96/565/EC, Euratom authorizing Sweden not to take into
    account certain categories of transactions and to use certain approximate estimates
    for the calculation of the VAT own resources base (notified under document C(2014)
    8933)'
  type: main
- language: fr
  script: Latn
  content: '2014/851/UE, Euratom: Décision d''exécution de la Commission du 26 novembre
