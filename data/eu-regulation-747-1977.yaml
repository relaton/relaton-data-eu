id: EURegulation7471977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 747/77 of 5 April 1977 extending the application
    for Sweden of certain provisions of Regulation (EEC) No 373/77 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of certain non-member countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 747/77 du Conseil, du 5 avril 1977, prorogeant, en
    ce qui concerne la Suède, l'application de certaines dispositions du règlement
    (CEE) n° 373/77 fixant certaines mesures intérimaires de conservation et de
    gestion des ressources de pêche applicables aux navires battant pavillon de certains
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 747/77 des Rates vom 5. April 1977 zur Schweden betreffenden
    Verlängerung der Geltungsdauer einiger Bestimmungen der Verordnung (EWG) Nr.
    373/77 zur Festlegung von Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung
    der Fischereiressourcen gegenüber Schiffen, die die Flagge bestimmter Drittländer
    führen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 747/77 af 5. april 1977 om forlængelse for
    så vidt angår Sverige af anvendelsen af visse bestemmelser i Rådets forordning
    (EØF) nr. 373/77 af 24. februar 1977 om de midlertidige foranstaltninger til
    bevarelse og regulering af fiskeressourcerne, som skal finde anvendelse på fartøjer,
    der fører visse tredjelandes flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 747/77 del Consiglio, del 5 aprile 1977, che proroga,
    per quanto riguarda la Svezia, l'applicazione di talune disposizioni del regolamento
    (CEE) n. 373/77 che fissa alcune misure interinali di conservazione e di gestione
    delle risorse ittiche applicabili alle navi battenti bandiera di taluni paesi
    terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 747/77 van de Raad van 5 april 1977 houdende verlenging
    van de toepassing, ten opzichte van Zweden, van een aantal bepalingen van Verordening
    (EEG) nr. 373/77 tot vaststelling van bepaalde overgangsmaatregelen voor de instandhouding
    en het beheer van de visbestanden, die van toepassing zijn op vaartuigen die de
    vlag van sommige derde landen voeren
  type: main
