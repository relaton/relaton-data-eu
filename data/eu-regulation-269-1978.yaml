title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 269/78 of 9 February 1978 including wheat
    groats and wheat meal in the list of processed products covered by the system
    of advance payment of refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 269/78 de la Commission, du 9 février 1978, introduisant
    les gruaux et semoules de froment dans la liste des produits transformés auxquels
    s' applique le régime de paiement à l' avance des restitutions
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 269/78 der Kommission vom 9. Februar 1978 zur Aufnahme
    von Weizengrobgrieß und -feingrieß in die Liste der Verarbeitungserzeugnisse,
    für welche die Vorauszahlung der Erstattung gilt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 269/78 af 9. februar 1978 om opførelse
