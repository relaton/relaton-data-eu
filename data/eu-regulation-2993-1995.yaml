title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2993/95 of 19 December 1995 amending Regulation
    (EC) No 1518/95 laying down detailed rules for the application of Council Regulations
    (EEC) No 1418/76 and (EEC) No 1766/92 as regards the import and export system
    for products processed from cereals and rice and amending Regulation (EC) No 1162/95
    laying down special detailed rules for the application of the system of import
    and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2993/95 de la Commission, du 19 décembre 1995, modifiant
    le règlement (CE) n° 1518/95 portant modalités d'application des règlements
    (CEE) n° 1418/76 et (CEE) n° 1766/92 du Conseil en ce qui concerne le régime
    d'importation et d'exportation des produits transformés à base de céréales
    et de riz et modifiant le règlement (CE) n° 1162/95 portant modalités particulières
    d'application du régime des certificats d'importation et d'exportation dans le
    secteur des céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2993/95 der Kommission vom 19. Dezember 1995 zur Änderung
    der Verordnung (EG) Nr. 1518/95 mit Durchführungsbestimmungen zu den Verordnungen
    (EWG) Nr. 1418/76 und (EWG) Nr. 1766/92 des Rates hinsichtlich der Regelung für
    die Einfuhr und Ausfuhr von Getreide- und Reisverarbeitungserzeugnissen und zur
    Änderung der Verordnung (EG) Nr. 1162/95 mit besonderen Durchführungsbestimmungen
    über Ein- und Ausfuhrlizenzen für Getreide und Reis
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2993/95 на Комисията от 19 декември
    1995 година за изменение на Регламент (ЕО) № 1518/95
    относно определяне на подробни правила за
    прилагането на Регламенти (ЕИО) № 1418/76 и (ЕИО)
    № 1766/92 на Съвета по отношение на режима за внос
    и износ на преработени продукти от зърнени
    култури и ориз и за измение на Регламент (ЕО)
    № 1162/95 относно определяне на специални подробни
    правила за прилагането на режима на вносни
    и износни лицензии в сектора на зърнените култури
    и ориза
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2993/95 ze dne 19. prosince 1995, kterým se
    mění nařízení (ES) č. 1518/95, kterým se stanoví prováděcí pravidla
    k nařízením Rady (EHS) č. 1418/76 a (EHS) č. 1766/92, pokud jde o dovozní
    a vývozní režim pro produkty z obilovin a rýže, a mění nařízení (ES)
    č. 1162/95, kterým se stanoví zvláštní prováděcí pravidla k režimu dovozních
    a vývozních licencí pro obiloviny a rýži
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2993/95 af 19. december 1995 om ændring
    af forordning (EF) nr. 1518/95 om gennemførelsesbestemmelser til Rådets forordning
    (EØF) nr. 1418/76 og (EØF) nr. 1766/92 for så vidt angår den import- og eksportordning,
    der gælder for produkter forarbejdet på basis af korn og ris, og om ændring
    af forordning (EF) nr. 1162/95 om særlige gennemførelsesbestemmelser for ordningen
    med import- og eksportlicenser for korn og ris
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2993/95 της Επιτροπής,
    της 19ης Δεκεμβρίου 1995, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1518/95 για τις λεπτομέρειες
    εφαρμογής των κανονισμών (ΕΟΚ) αριθ. 1418/76 και
    (ΕΟΚ) αριθ. 1766/92 του Συμβουλίου σχετικά με το
    καθεστώς εισαγωγών και εξαγωγών των μεταποιημένων
    προϊόντων με βάση τα σιτηρά και το ρύζι, και
    την τροποποίηση του κανονισμού (ΕΚ) αριθ. 1162/95
    περί ειδικών λεπτομερειών εφαρμογής του καθεστώτος
    των πιστοποιητικών εισαγωγής και εξαγωγής
    στον τομέα των σιτηρών και του ρυζιού
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2993/95, 19. detsember 1995, millega muudetakse
    määrust (EÜ) nr 1518/95, millega sätestatakse üksikasjalikud eeskirjad nõukogu
    määruse (EMÜ) nr 1418/76 ning teravilja ja riisi töötlemisel saadud toodete
    impordi- ning ekspordisüsteemi käsitleva määruse (EMÜ) nr 1766/92 kohaldamiseks
    ning muudetakse määrust (EÜ) nr 1162/95, milles sätestatakse üksikasjalikud
    erieeskirjad teravilja ja riisi impordi- ning ekspordilitsentside süsteemi kohaldamiseks
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2993/95, annettu 19 päivänä joulukuuta 1995,
    neuvoston asetusten (ETY) N:o 1418/76 ja (ETY) N:o 1766/92 soveltamista koskevista
    yksityiskohtaisista säännöistä vilja- ja riisijalosteisiin sovellettavan tuonti-
    ja vientijärjestelmän osalta sekä vilja- ja riisialan tuonti- ja vientitodistusjärjestelmän
    soveltamista koskevista erityisitä yksityiskohtaisista säännöistä annetun
    asetuksen (ETY) N:o 1162/95 muuttamisesta annetun asetuksen (EY) N:o 1518/95 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2993/95/EK rendelete (1995. december 19.) az 1418/76/EGK és
    1766/92/EGK tanácsi rendeletek alkalmazása részletes szabályainak a gabonafélékből
    és rizsből előállított termékek import- és exportrendszerének tekintetében
    történő megállapításáról szóló 1518/95/EK rendelet módosításáról,
    és a gabona és rizs import- és exportengedélyezési rendszere alkalmazásának
    különös részletes szabályainak megállapításáról szóló 1162/95/EK rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2993/95 della Commissione, del 19 dicembre 1995, che
    modifica il regolamento (CE) n. 1518/95 recante modalità d'applicazione dei regolamenti
    (CEE) n. 1418/76 e (CEE) n. 1766/92 del Consiglio riguardo al regime di importazione
    e di esportazione dei prodotti trasformati a base di cereali e di riso e recante
    modifica del regolamento (CE) n. 1162/95 che stabilisce le modalità particolari
    d'applicazione del regime dei titoli di importazione e di esportazione nel settore
    dei cereali e del riso
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2993/95 (1995. gada 19. decembris), ar ko groza
    Regulu (EK) Nr. 1518/95, ar kuru paredz sīki izstrādātus noteikumus par to,
    kā piemērot Padomes Regulu (EEK) Nr. 1418/76 un Padomes Regulu (EEK) Nr. 1766/92
    attiecībā uz labības un rīsu pārstrādes produktu eksporta un importa sistēmu,
    un groza Regulu (EK) Nr. 1162/95, ar ko paredz īpašus sīki izstrādātus noteikumus
    par to, kā piemērot importa un eksporta licenču sistēmu attiecībā uz labību
    un rīsiem
  type: main
- language: lt
  script: Latn
  content: 1995 m. gruodžio 19 d. Komisijos reglamentas (EB) Nr. 2993/95, iš dalies
    keičiantis Reglamentą (EB) Nr. 1518/95, nustatantį išsamias taisykles dėl
    Tarybos reglamentų (EEB) Nr. 1418/76 ir (EEB) Nr. 1766/92 taikymo iš grūdų
    ir ryžių perdirbtų produktų importo ir eksporto sistemai ir Reglamentą (EB)
    Nr. 1162/95, nustatantį specialias išsamias taisykles dėl importo ir eksporto
    sistemos taikymo grūdų ir ryžių sektoriuose
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2993/95 tad-19 ta’ Diċembru 1995
    li jemenda r-Regolament (KE) Nru 1518/95 li jistipula regoli dettaljati għall-applikazzjoni
    tar-Regolamenti tal-Kunsill (KEE) Nru 1418/76 u (KEE) Nru 1766/92 fir-rigward
    ta’ sistemi ta’ importazzjoni u esportazzjoni għal prodotti proċessati minn
    ċereali u ross u li jemenda r-Regolament (KE) Nru 1162/95 li jistipula regoli
    speċjali dettaljati għall-applikazzjoni tas-sistema ta’ liċenzi ta’ importazzjoni
    u esportazzjoni għal ċereali u ross
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2993/95 van de Commissie van 19 december 1995 tot
    wijziging van Verordening (EG) nr. 1518/95 tot vaststelling van uitvoeringsbepalingen
    van de Verordeningen (EEG) nr. 1418/76 en (EEG) nr. 1766/92 van de Raad ten aanzien
    van de invoer- en uitvoerregeling voor verwerkte produkten op basis van granen
    en rijst en tot wijziging van Verordening (EG) nr. 1162/95 houdende bijzondere
    uitvoeringsbepalingen inzake het stelsel van invoer- en uitvoercertificaten in
    de sector granen en rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2993/95 z dnia 19 grudnia 1995 r. zmieniające
    rozporządzenie (WE) nr 1518/95 ustanawiające szczegółowe zasady stosowania
    rozporządzeń Rady (EWG) nr 1418/76 i (EWG) nr 1766/92 w zakresie systemu przywozu
    i wywozu produktów przetworzonych na bazie zbóż i ryżu oraz zmieniające rozporządzenie
    (WE) nr 1162/95 ustanawiające specjalne szczegółowe zasady stosowania systemu
    pozwoleń na wywóz i przywóz w sektorze zbóż i ryżu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2993/95 da Comissão, de 19 de Dezembro de 1995, que
    altera o Regulamento (CE) nº 1518/95 que estabelece normas de execução dos
    Regulamentos (CEE) nº 1418/76 e (CEE) nº 1766/92 do Conselho no respeitante
    ao regime de importação e de exportação dos produtos transformados à base
    de cereais e de arroz e altera o Regulamento (CE) nº 1162/95 que estabelece normas
    de execução especiais do regime dos certificados de importação e de exportação
    no sector dos cereais e do arroz
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2993/95 al Comisiei din 19 decembrie 1995 de modificare
    a Regulamentului (CE) nr. 1518/95 de stabilire a normelor de aplicare a Regulamentului
    (CEE) nr. 1418/76 al Consiliului și a Regulamentului (CEE) nr. 1766/92 al Consiliului
    privind sistemul de import și export pentru produsele transformate din cereale
    și orez și de modificare a Regulamentului (CE) nr. 1162/95 de stabilire a normelor
    de aplicare a sistemului de certificate de import și export pentru cereale și
    orez
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2993/95 z 19. decembra 1995, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1518/95 stanovujúce podrobné pravidlá pre uplatňovanie
    nariadení Rady (EHS) č. 1418/76 a (EHS) č. 1766/92 o systéme dovozu a vývozu
    výrobkov vyrobených z obilnín a ryže a ktorým sa mení a dopĺňa nariadenie
    (ES) č. 1162/95 stanovujúce osobitné podrobné pravidlá pre uplatňovanie
    systému dovozných a vývozných licencií na obilniny a ryžu
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2993/95 z dne 19. decembra 1995 o spremembi Uredbe
    (ES) št. 1518/95 o določitvi podrobnih pravil za uporabo uredb Sveta (EGS) št.
    1418/76 in (EGS) št. 1766/92 glede uvozno-izvoznega sistema za predelane proizvode
    iz žit in riža ter o spremembi Uredbe (ES) št. 1162/95 o določitvi posebnih
    podrobnih pravil za uporabo uvoznih in izvoznih dovoljenj za žita in riž
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2993/95 de la Comisión, de 19 de diciembre de 1995,
    por el que se modifica el Reglamento (CE) nº 1518/95 por el que se establecen
    las disposiciones de aplicación de los Reglamentos (CEE) ns 1418/76 y 1766/92
    del Consejo en lo relativo al régimen de importación y exportación de productos
    transformados a base de cereales y de arroz y se modifica el Reglamento (CE) nº
    1162/95 por el que se establecen disposiciones especiales de aplicación del régimen
    de certificados de importación y de exportación en el sector de los cereales
    y del arroz
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2993/95 av den 19 december 1995 om ändring
    av förordning (EG) nr 1518/95 om tillämpningsföreskrifter till rådets förordningar
    (EEG) nr 1418/76 och (EEG) nr 1766/92 vad beträffar import- och exportsystemet
    för bearbetade produkter baserade på spannmål respektive ris och om ändring
    av förordning (EG) nr 1162/95 om särskilda tillämpningsföreskrifter för systemet
    med import- och exportlicenser för spannmål och ris
