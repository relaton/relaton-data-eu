  script: Latn
  content: '2006/188/EC: Council Decision of 21 February 2006 on the conclusion of
    the Agreement between the European Community and the Kingdom of Denmark extending
    to Denmark the provisions of Council Regulation (EC) No 343/2003 establishing
    the criteria and mechanisms for determining the Member State responsible for examining
    an asylum application lodged in one of the Member States by a third-country national
    and Council Regulation (EC) No 2725/2000 concerning the establishment of Eurodac
    for the comparison of fingerprints for the effective application of the Dublin
    Convention'
  type: main
- language: fr
