    bestimmter Interventionsstellen und zur Änderung der Verordnung (EWG) Nr. 1687/76
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1042/79 af 28. maj 1979 om udbydelse
