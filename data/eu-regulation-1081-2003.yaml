    προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1081/2003, annettu 24 päivänä kesäkuuta 2003,
    kesäkuussa 2003 jätettyjen tiettyjä siipikarjanlihasta peräisin olevia tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä tiettyjen siipikarjanlihaa
    ja tiettyjä muita maataloustuotteita koskevien yhteisön tariffikiintiöiden
