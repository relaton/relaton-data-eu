title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2161/83 of 29 July 1983 amending for the
    second time Regulation (EEC) No 3509/82 fixing the standard values to be used
    in calculating the financial compensation and the advance pertaining thereto in
    respect of fishery products withdrawn from the market during the period 1 January
    to 31 December 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2161/83 de la Commission du 29 juillet 1983 portant
    deuxième modification du règlement (CEE) no 3509/82 fixant la valeur forfaitaire
    des produits de la pêche retirés du marché pendant la période allant du 1er
    janvier au 31 décembre 1983, intervenant dans le calcul de la compensation financière
    et de l' avance y afférente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2161/83 der Kommission vom 29. Juli 1983 zur zweiten
    Änderung der Verordnung (EWG) Nr. 3509/82 zur Festsetzung des Pauschalwerts der
    in der Zeit vom 1. Januar bis 31. Dezember 1983 aus dem Handel genommenen Fischereierzeugnisse,
    der zur Berechnung des finanziellen Ausgleichs und des entsprechenden Vorschusses
    dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2161/83 af 29. juli 1983 om anden ændring
    af forordning (EØF) nr. 3509/82 om fastsættelse af den ved beregningen af den
    finansielle udligning og det tilsvarende forskud anvendte forudfastsatte værdi
    af fiskerivarer, der tages tilbage fra markedet i perioden fra den 1. januar til
    den 31. december 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2161/83 της Επιτροπής
    της 29ης Ιουλίου 1983 που τροποποιεί για δεύτερη
    φορά τον κανονισμό (ΕΟΚ) αριθ. 3509/82 περί καθορισμού
    της κατ' αποκοπή αξίας των προϊόντων αλιείας
    που αποσύρονται από την αγορά κατά την περίοδο
    από 1ης Ιανουαρίου έως 31 Δεκεμβρίου 1983, η οποία
    παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2161/83 della Commissione del 29 luglio 1983 recante
    seconda modifica del regolamento (CEE) n. 3509/82 che fissa, ai fini della compensazione
    finanziaria e dell' anticipo corrispondente, il valore forfettario dei prodotti
    della pesca ritirati dal mercato nel periodo dal 1o gennaio al 31 dicembre 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2161/83 van de Commissie van 29 juli 1983 houdende
    tweede wijziging van Verordening (EEG) nr. 3509/82 betreffende de vaststelling
    van de forfaitaire waarde van de in de periode van 1 januari tot en met 31 december
    1983 uit de markt genomen visserijprodukten voor de berekening van de financiële
    vergoeding en het hierop betrekking hebbende voorschot
  type: main
