title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2065/82 of 28 July 1982 determining actual
    production of unginned cotton for the 1981/82 marketing year and fixing the percentage
    of the aid to be paid by Member States for the 1982/83 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2065/82 de la Commission, du 28 juillet 1982, établissant
    la production effective de coton non égrené de la campagne 1981/1982 ainsi que
    le pourcentage de l' aide que les États membres versent au titre de la campagne
    1982/1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2065/82 der Kommission vom 28. Juli 1982 zur Festlegung
    der tatsächlichen Erzeugung von nicht entkörnter Baumwolle im Wirtschaftsjahr
    1981/82 sowie des Prozentsatzes der von den Mitgliedstaaten für das Wirtschaftsjahr
    1982/83 zu zahlenden Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2065/82 af 28. juli 1982 om fastsættelse
    af den faktiske produktion af ikke-egreneret bomuld i produktionsåret 1981/82
    samt den procentdel af støtten, som medlemsstaterne skal udbetale for produktionsåret
    1982/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2065/82 τής Επιτροπής
    τής 28ης Ιουλίου 1982 περί καθορισμού τής πραγματικής
    παραγωγής τού μή εκκοκκισμένου βάμβακος τής
    περιόδου 1981/82 καθώς καί τού ποσοστού τής ενισχύσεως
    πού καταβάλλουν τά Κράτη μέλη γιά τήν περίοδο
    1982/83
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2065/82 della Commissione, del 28 luglio 1982, che
    fissa la produzione effettiva di cotone non sgranato della campagna 1981/1982,
    noché la percentuale dell' aiuto che gli Stati membri versano a titolo della
    campagna 1982/1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2065/82 van de Commissie van 28 juli 1982 tot bepaling
    van de feitelijke produktie van niet-geëgreneerde katoen voor het verkoopseizoen
    1981/1982 alsmede van het steunpercentage dat de Lid-Staten voor het verkoopseizoen
    1982/1983 uitkerene
  type: main
