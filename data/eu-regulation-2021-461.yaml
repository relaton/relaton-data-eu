    organov in izvajalcev nadzora za namene enakovrednosti v okviru ureditev za uvoz
    ekoloških proizvodov na podlagi Uredbe Sveta (ES) št. 834/2007
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/461 de la Comisión de 16 de marzo de
    2021 por el que se modifica el Reglamento (CE) n.o 1235/2008 en lo que respecta
    a la fecha de recepción de las solicitudes de reconocimiento de autoridades y
    organismos de control a efectos de la equivalencia en virtud de los regímenes
