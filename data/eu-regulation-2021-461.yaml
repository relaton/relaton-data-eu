    biex jintlaqgħu talbiet għar-rikonoxximent ta’ awtoritajiet ta’ kontroll
    u korpi ta’ kontroll għall-fini ta’ ekwivalenza skont l-arranġamenti għall-importazzjonijiet
    ta’ prodotti organiċi bbażati fuq ir-Regolament tal-Kunsill (KE) Nru 834/2007
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/461 van de Commissie van 16 maart 2021
