    az ökológiai termékek 834/2007/EK tanácsi rendeleten alapuló behozatalára
    előírt szabályozás szerinti egyenértékűsége szempontjából történő
    elismerésére irányuló kérelmek beérkezési időpontja tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/461 della Commissione del 16 marzo
    2021 che modifica il regolamento (CE) n. 1235/2008 per quanto riguarda la data
    di ricezione delle domande di riconoscimento delle autorità e degli organismi
    di controllo ai fini dell’equivalenza nell’ambito del regime di importazione
    di prodotti biologici basato sul regolamento (CE) n. 834/2007 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/461 (2021. gada 16. marts), ar
    ko Regulu (EK) Nr. 1235/2008 groza attiecībā uz termiņu, līdz kuram saņem
    pieprasījumus kontroles iestāžu un kontroles organizāciju atzīšanai līdzvērtības
    pārbaudes nolūkos, pamatojoties uz Padomes Regulā (EK) Nr. 834/2007 noteikto
    bioloģisko produktu importēšanas kārtību
  type: main
- language: lt
  script: Latn
