    für die Zwecke der Gleichwertigkeit im Rahmen der Einfuhrregelung für ökologische/biologische
    Erzeugnisse gemäß der Verordnung (EG) Nr. 834/2007 des Rates
  type: main
- language: bg
  script: Cyrl
