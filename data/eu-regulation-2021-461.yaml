    primirii cererilor de recunoaștere a autorităților de control și a organismelor
    de control în scopul echivalenței în cadrul regimului de import al produselor
    ecologice în temeiul Regulamentului (CE) nr. 834/2007 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/461 zo 16. marca 2021, ktorým
    sa mení nariadenie (ES) č. 1235/2008, pokiaľ ide o dátum pre prijímanie žiadostí
    o uznanie štátnych inšpekčných organizácií a súkromných inšpekčných
    organizácií na účely rovnocennosti v rámci opatrení týkajúcich sa dovozu
    ekologických produktov na základe nariadenia rady (ES) č. 834/2007
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/461 z dne 16. marca 2021 o spremembi
