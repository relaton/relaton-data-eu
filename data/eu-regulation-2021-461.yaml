title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/461 of 16 March 2021 amending
    Regulation (EC) No 1235/2008 as regards the date for receiving requests for the
    recognition of control authorities and control bodies for the purpose of equivalence
    under the arrangements for imports of organic products based on Council Regulation
    (EC) No 834/2007
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/461 de la Commission du 16 mars 2021
    modifiant le règlement (CE) no 1235/2008 en ce qui concerne la date de réception
    des demandes de reconnaissance des autorités et organismes de contrôle aux fins
    de l’équivalence dans le cadre du régime d’importation de produits biologiques
    fondé sur le règlement (CE) no 834/2007 du Conseil
  type: main
- language: de
  script: Latn
