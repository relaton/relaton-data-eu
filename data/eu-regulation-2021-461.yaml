    dos pedidos de reconhecimento de autoridades de controlo e de organismos de controlo
    para efeitos de equivalência, ao abrigo do regime de importação de produtos
    biológicos baseado no Regulamento (CE) n.o 834/2007 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/461 al Comisiei din 16 martie
