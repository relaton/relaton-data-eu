    internacional sobre el programa mejorado de inspecciones durante los reconocimientos
    de graneleros y petroleros, de 2011, enmiendas al Código internacional de dispositivos
    de salvamento, enmiendas a los formularios C, E y P del apéndice del Convenio
    Internacional para la Seguridad de la Vida Humana en el Mar y enmiendas al Código
    internacional de seguridad para los buques que utilicen gases u otros combustibles
    de bajo punto de inflamación
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2019/851 av den 14 maj 2019 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationen
    vid det 74:e mötet i kommittén för skydd av den marina miljön och det 101:a
    mötet i sjösäkerhetskommittén om antagande av ändringar av bilaga II till
    den internationella konventionen till förhindrande av förorening från fartyg,
    ändringar av den internationella koden för det utökade programmet för inspektioner
    vid besiktning av bulkfartyg och oljetankfartyg, 2011, ändringar av den internationella
    koden om livräddningsanordningar, ändringar av formulären C, E och P i tillägget
    till den internationella konventionen om säkerheten för människoliv till sjöss,
    samt ändringar av den internationella säkerhetskoden för fartyg som använder
    gaser eller andra bränslen med låg flampunkt
