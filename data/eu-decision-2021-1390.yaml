    er fremstillet af genetisk modificeret MZIR098-majs (SYN-ØØØ98-3), i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under
    nummer C(2021) 5997) (Kun den franske og den nederlandske udgave er autentiske)
  type: main
