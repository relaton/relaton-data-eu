title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1390 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MZIR098 (SYN-ØØØ98-3), pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2021)5997) (Only the French and Dutch texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1390 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MZIR098 (SYN-ØØØ98-3), consistant en ce maïs ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 5997] (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1390 der Kommission vom 17. August 2021
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte MZIR098 (SYN-ØØØ98-3) enthalten, aus ihm bestehen oder aus ihm
    hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021) 5997) (Nur
    der französische und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
