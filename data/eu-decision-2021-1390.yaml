    za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MZIR098 (SYN-ØØØ98-3), sastoje se ili su proizvedeni od njega, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2021) 5997) (Vjerodostojni su samo tekstovi na francuskom i nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1390 végrehajtási határozata (2021. augusztus
    17.) a géntechnológiával módosított MZIR098 (SYN-ØØØ98-3) kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2021) 5997. számú dokumentummal történt) (Csak a francia
    és a holland nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/1390 della Commissione del 17 agosto
    2021 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato MZIR098 (SYN-ØØØ98-3) in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2021)5997] (I testi in lingua francese e neerlandese sono i soli
    facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/1390 (2021. gada 17. augusts),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MZIR098 (SYN-ØØØ98-3),
    no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta numuru C(2021)
    5997) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/1390 2021 m. rugpjūčio 17
