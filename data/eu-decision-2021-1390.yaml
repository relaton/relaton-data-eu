    jikkonsistu jew li huma prodotti mill-qamħirrum ġenetikament modifikat MZIR098
    (SYN-ØØØ98-3), skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew
    u tal-Kunsill (notifikata bid-dokument C(2021) 5997) (It-testi bil-Franċiż u
