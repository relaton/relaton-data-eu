title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/1303 of 18 September 2018 on the position to
    be taken on behalf of the European Union within the Association Committee in Trade
    configuration established by the Association Agreement between the European Union
    and the European Atomic Energy Community and their Member States, of the one part,
    and Georgia, of the other part, regarding the update of Annex III (Approximation)
    concerning rules applicable to standardisation, accreditation, conformity assessment,
    technical regulation and metrology, and Annex XVI (Public Procurement) to the
    Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/1303 du Conseil du 18 septembre 2018 relative à la
    position à prendre, au nom de l'Union européenne, au sein du comité d'association
    dans sa configuration «Commerce» créé par l'accord d'association entre l'Union
    européenne et la Communauté européenne de l'énergie atomique et leurs États
    membres, d'une part, et la Géorgie, d'autre part, concernant l'actualisation
    de l'annexe III (rapprochement) pour les règles applicables en matière de normalisation,
    d'accréditation, d'évaluation de la conformité, de réglementations techniques
    et de métrologie et de l'annexe XVI (marchés publics) de l'accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/1303 des Rates vom 18. September 2018 über den Standpunkt,
    der im Namen der Europäischen Union im Assoziationsausschuss in der Zusammensetzung
    „Handel“, der durch das Assoziierungsabkommen zwischen der Europäischen Union
    und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits und
    Georgien andererseits eingerichtet wurde, zur Aktualisierung der Vorschriften
    des Anhangs III (Annäherung) über Normung, Akkreditierung, Konformitätsbewertung,
    technische Regulierung und Messwesen und zur Aktualisierung des Anhangs XVI (Öffentliches
    Beschaffungswesen) des Abkommens zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2018/1303 на Съвета от 18 септември
    2018 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Комитета за асоцииране в състав „Търговия“,
    създаден със Споразумението за асоцииране
    между Европейския съюз и Европейската общност
    за атомна енергия и техните държави членки,
    от една страна, и Грузия, от друга страна, във
    връзка с актуализирането на приложение III (Сближаване)
    относно правилата, приложими по отношение
    на стандартизацията, акредитацията, оценката
    на съответствието, техническите регламенти
    и метрологията, и приложение XVI (Обществени
    поръчки) към споразумението
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2018/1303 ze dne 18. září 2018 o postoji, který
    má být zaujat jménem Evropské unie ve Výboru pro přidružení ve složení
    pro obchod zřízeném Dohodou o přidružení mezi Evropskou unií a Evropským
    společenstvím pro atomovou energii a jejich členskými státy na jedné straně
    a Gruzií na straně druhé, pokud jde o aktualizaci přílohy III (Sbližování
    právních předpisů) týkající se pravidel pro normalizaci, akreditaci, posuzování
    shody, technické předpisy a metrologii a přílohy XVI (Veřejné zakázky)
    dohody
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2018/1303 af 18. september 2018 om den holdning,
