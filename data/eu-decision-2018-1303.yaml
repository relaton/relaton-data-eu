  script: Latn
  content: Neuvoston päätös (EU) 2018/1303, annettu 18 päivänä syyskuuta 2018,
    Euroopan unionin, Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden sekä
    Georgian välisellä assosiaatiosopimuksella perustetussa kauppaan liittyvien
    kysymysten kokoonpanossa olevassa assosiaatiokomiteassa Euroopan unionin puolesta
