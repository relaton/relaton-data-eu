    III (Aproximácia), týkajúcej sa pravidiel uplatniteľných na štandardizáciu,
    akreditáciu, posudzovanie zhody, technické predpisy a metrológiu, a prílohy
    XVI (Verejné obstarávanie) k dohode
  type: main
