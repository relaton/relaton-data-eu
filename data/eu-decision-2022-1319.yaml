    tad-Direttiva (UE) 2016/797 tal-Parlament Ewropew u tal-Kunsill għan-nuqqas ta’
    applikazzjoni ta’ ċerti dispożizzjonijiet stabbiliti fl-ispeċifikazzjonijiet
    tekniċi tal-interoperabbiltà (TSI) għall-konfigurazzjoni mill-ġdid ta’ materjal
    mobbli eżistenti f’19-il trainset TGV P-DUPLEX (notifikata bid-dokument C(2022)
    5150) (It-test bil-Franċiż biss huwa awtentiku)
  type: main
