    interoperacyjności (TSI) odnośnie do rekonfiguracji istniejącego taboru na
    pociągi zespołowe 19 TGV P-DUPLEX, złożonego przez Francję zgodnie z art.
    7 ust. 4 dyrektywy Parlamentu Europejskiego i Rady (UE) 2016/797 (notyfikowana
    jako dokument nr C(2022) 5150) (Jedynie tekst w języku francuskim jest autentyczny)
  type: main
