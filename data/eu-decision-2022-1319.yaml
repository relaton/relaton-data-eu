  content: Uitvoeringsbesluit (EU) 2022/1319 van de Commissie van 26 juli 2022 tot
    aanvaarding van een door Frankrijk overeenkomstig artikel 7, lid 4, van Richtlijn
    (EU) 2016/797 van het Europees Parlement en de Raad ingediend verzoek om ontheffing
    van diverse voorschriften van de TSI’s bij de herconfiguratie van bestaande
    treinstellen tot 19 stellen van het type TGV P-Duplex (Kennisgeving geschied onder
