    un Padomes Direktīvas (ES) 2016/797 7. panta 4. punktu, par dažu savstarpējas
    izmantojamības tehnisko specifikāciju (SITS) noteikumu nepiemērošanu esošā
    ritošā sastāva pārkonfigurēšanai par 19 TGV P-DUPLEX vilciena sastāviem
