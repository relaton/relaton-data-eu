    (4) din Directiva (UE) 2016/797 a Parlamentului European și a Consiliului referitoare
    la neaplicarea anumitor dispoziții prevăzute în specificațiile tehnice de
    interoperabilitate (STI) pentru recompunerea materialului rulant existent în
