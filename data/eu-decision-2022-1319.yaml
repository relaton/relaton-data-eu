    7. cikke (4) bekezdése értelmében benyújtott, egyes átjárhatósági műszaki
    előírások (ÁME-k) rendelkezéseinek meglévő vasúti járművek 19 TGV P-DUPLEX
    vonatszerelvénnyé történő átkonfigurálása tekintetében történő alkalmazásának
    mellőzése iránt benyújtott kérelem elfogadásáról (az értesítés a C(2022)
    5150. számú dokumentummal történt) (Csak a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1319 della Commissione del 26 luglio
    2022 relativa all’accettazione di una domanda, presentata dalla Francia a norma
    dell’articolo 7, paragrafo 4, della direttiva (UE) 2016/797 del Parlamento europeo
    e del Consiglio, di non applicazione di talune disposizioni delle specifiche tecniche
    di interoperabilità (STI) riguardanti la riconfigurazione di materiale rotabile
    esistente in 19 convogli TGV P–DUPLEX [notificata con il numero C(2022) 5150]
    (Il testo in lingua francese è il solo facente fede)
  type: main
- language: lv
  script: Latn
