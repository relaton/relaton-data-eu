title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1319 of 26 July 2022 accepting
    a request submitted by France pursuant to Article 7(4) of Directive (EU) 2016/797
    of the European Parliament and of the Council for the non-application of certain
    technical specification for interoperability (TSI) provisions for re-configuration
    of existing rolling stock into 19 TGV P-DUPLEX trainsets (notified under document
    C(2022) 5150) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1319 de la Commission du 26 juillet
    2022 relative à l’acceptation d’une demande présentée par la France, conformément
    à l’article 7, paragraphe 4, de la directive (UE) 2016/797 du Parlement européen
    et du Conseil, de ne pas appliquer certaines dispositions prévues dans des spécifications
    techniques d’interopérabilité (STI) en vue d’une recomposition du matériel
    roulant existant en 19 rames TGV P-DUPLEX [notifiée sous le numéro C(2022) 5150]
    (Le texte en langue française est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1319 der Kommission vom 26. Juli 2022
    zur Genehmigung eines Antrags Frankreichs gemäß Artikel 7 Absatz 4 der Richtlinie
    (EU) 2016/797 des Europäischen Parlaments und des Rates auf Nichtanwendung bestimmter
    Bestimmungen der technischen Spezifikationen für die Interoperabilität (TSI)
    auf die Umkonfigurierung vorhandener Fahrzeuge zu 19 TGV-P-DUPLEX-Triebzügen
    (Bekannt gegeben unter Aktenzeichen C(2022) 5150) (Nur der französische Text
    ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1319 на Комисията
    от 26 юли 2022 година за приемане на искане, подадено
    от Франция съгласно член 7, параграф 4 от Директива
    (ЕС) 2016/797 на Европейския парламент и на Съвета,
    за неприлагане на разпоредбите на определена
    техническа спецификация за оперативна съвместимост
    (ТСОС) за преконфигуриране на съществуващ подвижен
    състав в 19 влакови композиции от тип TGV P-DUPLEX
    (нотифицирано под номер С(2022) 5150) (само текстът
    на френски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1319 ze dne 26. července 2022
    o přijetí žádosti předložené Francií podle čl. 7 odst. 4 směrnice Evropského
    parlamentu a Rady (EU) 2016/797, která se týká neuplatnění některých ustanovení
    technických specifikací pro interoperabilitu v případě rekonfigurace stávajících
    kolejových vozidel na devatenáct vlakových souprav TGV P-DUPLEX (oznámeno
    pod číslem C(2022) 5150) (Pouze francouzské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1319 af 26. juli 2022
    om accept af en anmodning fra Frankrig i henhold til artikel 7, stk. 4, i Europa-Parlamentets
    og Rådets direktiv (EU) 2016/797 om ikke at anvende visse bestemmelser i de tekniske
    specifikationer for interoperabilitet (TSI) ved rekonfigurering af eksisterende
    rullende materiel til 19 TGV P-DUPLEX-togsæt (meddelt under nummer C(2022) 5150)
    (Kun den franske udgave er autentisk)
  type: main
- language: el
  script: Grek
