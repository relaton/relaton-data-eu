  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1319 оd 26. srpnja 2022. o prihvaćanju
    zahtjeva koji je podnijela Francuska u skladu s člankom 7. stavkom 4. Direktive
    (EU) 2016/797 Europskog parlamenta i Vijeća za neprimjenu određenih odredbi
    tehničkih specifikacija za interoperabilnost (TSI) na rekonfiguraciju postojećih
    željezničkih vozila u 19 kompozicija vlakova tipa TGV P-DUPLEX (priopćeno pod
    brojem dokumenta C(2022) 5150) (Vjerodostojan je samo tekst na francuskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1319 végrehajtási határozata (2022. július 26.)
