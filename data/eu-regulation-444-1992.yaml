title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 444/92 of 25 February 1992 extending Regulation
    (EEC) No 715/90 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States (ACP States) or in the overseas countries
    and territories (OCT)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 444/92 du Conseil, du 25 février 1992, prorogeant
    le règlement (CEE) n° 715/90 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d'Afrique, des Caraïbes et du Pacifique (ACP) ou des pays
    et territoires d'outre-mer (PTOM)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 444/92 des Rates vom 25. Februar 1992 zur Verlängerung
    der Verordnung (EWG) Nr. 715/90 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den AKP-Staaten oder in den überseeischen Ländern und Gebieten (ÜLG)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 444/92 af 25. februar 1992 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 715/90 om den ordning, der skal
    gælde for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter
    med oprindelse i AVS-staterne eller i de oversøiske lande og territorier (OLT)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 444/92 του Συμβουλίου
