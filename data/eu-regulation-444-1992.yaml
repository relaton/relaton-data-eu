    agricoli e a talune merci ottenute dalla trasformazione di prodotti agricoli originari
    degli Stati dell'Africa, dei Caraibi e del Pacifico (ACP) o dei paesi e territori
    d'oltremare (PTOM)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 444/92 van de Raad van 25 februari 1992 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 715/90 inzake de regeling voor
    landbouwprodukten en bepaalde door verwerking van landbouwprodukten verkregen
    goederen, van oorsprong uit de staten in Afrika, het Caribische gebied en de Stille
    Oceaan (ACS-staten) of uit de landen en gebieden overzee (LGO)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 444/92 do Conselho, de 25 de Fevereiro de 1992, que
