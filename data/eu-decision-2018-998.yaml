---
id: EUDecision2018998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/998 of 12 July 2018 amending
    Annex I to Decision 2009/177/EC as regards the status of Croatia for koi herpes
    virus (KHV) disease, of Finland for infectious haematopoietic necrosis (IHN),
    the list of areas in Ireland free of Bonamia ostreae, the list of areas in the
    United Kingdom free of Marteilia refringens and amending Annex I to Decision 2010/221/EU
    as regards the list of areas in the United Kingdom free of Ostreid herpesvirus
    1 μvar (OsHV-1 μVar) (notified under document C(2018) 4381)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/998 de la Commission du 12 juillet 2018
    modifiant l'annexe I de la décision 2009/177/CE en ce qui concerne le statut
    de la Croatie au regard de l'herpèsvirose de la carpe koï et celui de la Finlande
    au regard de la nécrose hématopoïétique infectieuse, la liste des zones de
    l'Irlande indemnes de l'infection à Bonamia ostreae et la liste des zones du
    Royaume-Uni indemnes de l'infection à Marteilia refringens, et modifiant l'annexe
    I de la décision 2010/221/UE en ce qui concerne la liste des zones du Royaume-Uni
    indemnes de l'infection par le microvariant de l'herpèsvirus de l'huître de
    type 1 (OsHV-1 μVar) [notifiée sous le numéro C(2018) 4381]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/998 der Kommission vom 12. Juli 2018
    zur Änderung des Anhangs I der Entscheidung 2009/177/EG im Hinblick auf den Status
    Kroatiens hinsichtlich der Koi-Herpes-Viruserkrankung (KHV), auf den Status Finnlands
    hinsichtlich der infektiösen hämatopoetischen Nekrose (IHN), auf die Liste der
    irischen Gebiete, die frei von Bonamia ostreae sind, und auf die Liste der britischen
    Gebiete, die frei von Marteilia refringens sind, sowie zur Änderung des Anhangs
    I des Beschlusses 2010/221/EU im Hinblick auf die britischen Gebiete, die frei
    vom Ostreiden Herpesvirus 1 μVar (OsHV-1 μVar) sind (Bekannt gegeben unter Aktenzeichen
    C(2018) 4381)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2018/998 на Комисията
    от 12 юли 2018 година за изменение на приложение
    I към Решение 2009/177/ЕО по отношение на статута
    на Хърватия във връзка с болестта кой-херпесвирусна
    болест по шарана, на Финландия — инфекциозна
    хемопоетична некроза, на списъка на райони
    в Ирландия, свободни от Bonamia ostreae, на списъка
    на райони в Обединеното кралство, свободни
    от Marteilia refringens, и за изменение на приложение
    I към Решение 2010/221/ЕС по отношение на списъка
    на районите в Обединеното кралство, свободни
    от Ostreid herpesvirus 1 μvar (OsHV-1 μVar) (нотифицирано под
    номер C(2018) 4381)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/998 ze dne 12. července 2018,
    kterým se mění příloha I rozhodnutí 2009/177/ES, pokud jde o status Chorvatska
    pro herpesvirózu koi (KHV), status Finska pro infekční nekrózu krvetvorné
    tkáně (IHN), seznam oblastí Irska prostých bonamiózy (Bonamia ostreae) a
    seznam oblastí Spojeného království prostých marteiliózy (Marteilia refringens),
    a kterým se mění příloha I rozhodnutí 2010/221/EU, pokud jde o seznam oblastí
    Spojeného království prostých ostreid herpesviru 1 μvar (OsHV-1 μVar) (oznámeno
    pod číslem C(2018) 4381)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/998 af 12. juli 2018
    om ændring af bilag I til beslutning 2009/177/EF for så vidt angår Kroatiens
    status med hensyn til koi-herpesvirus-sygdom (KHV), Finlands status med hensyn
    til infektiøs hæmatopoietisk nekrose (IHN), listen over områder i Irland, der
    er frie for Bonamia ostreae og listen over områder i Det Forenede Kongerige,
    der er frie for Marteilia refringens, og om ændring af bilag I til afgørelse
    2010/221/EU for så vidt angår listen over områder i Det Forenede Kongerige,
    der er frie for ostreid herpesvirus 1 μvar (OsHV-1 μVar) (meddelt under nummer
    C(2018) 4381)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2018/998 της Επιτροπής,
    της 12ης Ιουλίου 2018, για την τροποποίηση του
    παραρτήματος I της απόφασης 2009/177/ΕΚ όσον αφορά
    το καθεστώς της Κροατίας για τη νόσο του έρπητα
    του ψαριού σαζάνι (νόσος KHV), το καθεστώς της
    Φινλανδίας για τη λοιμώδη αιματοποιητική νέκρωση
    (ΛΑΝ), τον κατάλογο των απαλλαγμένων από την
    Bonamia ostreae περιοχών της Ιρλανδίας και τον κατάλογο
    των απαλλαγμένων από τη Marteilia refringens περιοχών
    του Ηνωμένου Βασιλείου, καθώς και για την τροποποίηση
    του παραρτήματος I της απόφασης 2010/221/ΕΕ όσον
    αφορά τον κατάλογο των απαλλαγμένων από τον
    ερπητοϊό των στρειδιών 1 μvar (OsHV-1 μVar) περιοχών
    του Ηνωμένου Βασιλείου [κοινοποιηθείσα υπό
    τον αριθμό C(2018) 4381]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2018/998, 12. juuli 2018, millega muudetakse
    otsuse 2009/177/EÜ I lisa seoses Horvaatia staatusega karpkalade herpesviroosi
    (KHV) ja Soome staatusega nakkusliku vereloomeelundite nekroosi (IHN) osas ning
    Bonamia ostreae'st vabade Iirimaa piirkondade loetelu ja Marteilia refringens'ist
    vabade Ühendkuningriigi piirkondade loetelu osas ja millega muudetakse otsuse
    2010/221/EL I lisa austrite herpesviirusest 1 μvar (OsHV-1 μVar) vabade Ühendkuningriigi
    piirkondade loetelu osas (teatavaks tehtud numbri C(2018) 4381 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/998, annettu 12 päivänä
    heinäkuuta 2018, päätöksen 2009/177/EY liitteen I muuttamisesta siltä osin
    kuin on kyse Kroatian asemasta koikarpin herpesviruksen (KHV-tauti) ja Suomen
    asemasta tarttuvan vertamuodostavan kudoksen kuolion (IHN) osalta, bonamioosi-nilviäistaudista
    (Bonamia ostreae) vapaiden Irlannin alueiden luettelon ja marteilioosi-nilviäistaudista
    (Marteilia refringens) vapaiden Yhdistyneen kuningaskunnan alueiden luettelon
    osalta sekä päätöksen 2010/221/EU liitteen I muuttamisesta ostereiden herpesviruksesta
    1 μvar (OsHV-1 μVar) vapaiden Yhdistyneen kuningaskunnan alueiden osalta (tiedoksiannettu
    numerolla C(2018) 4381)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/998 оd 12. srpnja 2018. o izmjeni
    Priloga I. Odluci 2009/177/EZ u pogledu statusa Hrvatske u odnosu na bolest uzrokovanu
    Koi herpes virusom (KHV), Finske u odnosu na zaraznu hematopetsku nekrozu (ZHN),
    popisa područja u Irskoj slobodnih od Bonamia ostreae, popisa područja u Ujedinjenoj
    Kraljevini slobodnih od Marteilia refringens i o izmjeni Priloga I. Odluci 2010/221/EU
    u pogledu popisa područja u Ujedinjenoj Kraljevini slobodnih od herpesvirusa
    kamenice 1 μνar (OsHV-1 μVar) (priopćeno pod brojem dokumenta C(2018) 4381)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/998 végrehajtási határozata (2018. július 12.)
    a 2009/177/EK határozat I. mellékletének Horvátország koi-herpeszvírusbetegség
    tekintetében fennálló helyzete, Finnország pisztrángfélék fertőző vérképzőszervi
    elhalása (IHN) tekintetében fennálló helyzete, Írország Bonamia ostreae-fertőzéstől
    mentes területeinek jegyzéke és az Egyesült Királyság Marteilia refringens-fertőzéstől
    mentes területeinek jegyzéke tekintetében történő módosításáról, valamint
    a 2010/221/EU határozat I. mellékletének az Egyesült Királyság Ostreid herpeszvírus
    1 μνartól (OsHV-1 μVar) mentes területeinek jegyzéke tekintetében történő
    módosításáról (az értesítés a C(2018) 4381. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/998 della Commissione, del 12 luglio
    2018, che modifica l'allegato I della decisione 2009/177/CE per quanto riguarda
    lo status della Croazia in merito al virus erpetico (KHV), della Finlandia in
    merito alla necrosi ematopoietica infettiva (IHN), l'elenco delle zone dell'Irlanda
    indenni da Bonamia ostreae, l'elenco delle zone del Regno Unito indenni da Marteilia
    refringens e che modifica l'allegato I della decisione 2010/221/UE per quanto
    riguarda l'elenco delle zone del Regno Unito indenni da ostreid herpesvirus 1
    μνar (OsHV-1 μVar) [notificata con il numero C(2018) 4381]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2018/998 (2018. gada 12. jūlijs),
    ar ko Lēmuma 2009/177/EK I pielikumu groza attiecībā uz Horvātijas statusu
    saistībā ar koi herpesvīrusu (KHV), Somijas statusu saistībā ar infekciozo
    hematopoētisko nekrozi (IHN), to Īrijas teritoriju sarakstu, kas pasludinātas
    par Bonamia ostreae infekcijas neskartām, to Apvienotās Karalistes apgabalu
    sarakstu, kuri pasludināti par Marteilia refringens infekcijas neskartiem, un
    ar ko Lēmuma 2010/221/ES I pielikumu groza attiecībā uz to Apvienotās Karalistes
    apgabalu sarakstu, kurus uzskata par austeru herpesvīrusa 1 μνar (OsHV-1 μVar)
    neskartiem (izziņots ar dokumenta numuru C(2018) 4381)
  type: main
- language: lt
  script: Latn
  content: 2018 m. liepos 12 d. Komisijos įgyvendinimo sprendimas (ES) 2018/998,
    kuriuo iš dalies keičiamos Sprendimo 2009/177/EB I priedo nuostatos dėl Kroatijos
    statuso dėl koi herpeso viruso (KHV) infekcijos, Suomijos statuso dėl infekcinės
    hematopoetinės nekrozės (IHN), Bonamia ostreae neapimtų Airijos teritorijų
    sąrašo, Marteilia refringens neapimtų Jungtinės Karalystės teritorijų sąrašo
    ir Sprendimo 2010/221/ES I priedo nuostatos dėl austrių herpeso viruso 1 μνar
    (OsHV-1 μVar) neapimtų Jungtinės Karalystės teritorijų sąrašo (pranešta
    dokumentu Nr. C(2018) 4381)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/998 tat-12 ta'
    Lulju 2018 li temenda l-Anness I tad-Deċiżjoni 2009/177/KE fir-rigward tal-istatus
    tal-Kroazja għall-marda tal-vajrus tal-erpete tal-koi (KHV), l-istatus tal-Finlandja
    għan-nekrożi ematopojetika infettiva (IHN), il-lista taż-żoni fl-Irlanda ħielsa
    mill-Bonamia ostreae, il-lista taż-żoni fir-Renju Unit ħielsa mill-Marteilia
    refringens u li temenda l-Anness I tad-Deċiżjoni 2010/221/UE fir-rigward tal-lista
    taż-żoni fir-Renju Unit ħielsa mill-Ostreid herpesvirus 1 μvar (OsHV-1 μVar)
    (notifikata bid-dokument C(2018) 4381)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/998 van de Commissie van 12 juli 2018 tot
    wijziging van bijlage I bij Beschikking 2009/177/EG wat betreft de status van
    Kroatië ten aanzien van koiherpesvirus (KHV) en van Finland ten aanzien van infectieuze
    hematopoëtische necrose (IHN), de lijst van gebieden in Ierland die vrij zijn
    van Bonamia ostreae, de lijst van gebieden in het Verenigd Koninkrijk die vrij
    zijn van Marteilia refringens, en tot wijziging van bijlage I bij Besluit 2010/221/EU
    wat betreft de lijst van gebieden in het Verenigd Koninkrijk die vrij zijn van
    Ostreid herpesvirus 1 μvar (OsHV-1 μVar) (Kennisgeving geschied onder nummer
    C(2018) 4381)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2018/998 z dnia 12 lipca 2018 r. zmieniająca
    załącznik I do decyzji 2009/177/WE w odniesieniu do statusu Chorwacji pod względem
    zakażenia herpeswirusem koi (KHV), Finlandii pod względem zakaźnej martwicy
    układu krwiotwórczego ryb łososiowatych (IHN), wykazu obszarów w Irlandii
    wolnych od zakażenia wywoływanego przez Bonamia ostreae, wykazu obszarów w
    Zjednoczonym Królestwie wolnych od zakażenia wywoływanego przez Marteilia refringens
    oraz zmieniająca załącznik I do decyzji 2010/221/UE w odniesieniu do wykazu
    obszarów w Zjednoczonym Królestwie wolnych od herpeswirusa 1 μνar (OsHV-1
    μVar) u ostryg (notyfikowana jako dokument nr C(2018) 4381)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/998 da Comissão, de 12 de julho de 2018,
    que altera o anexo I da Decisão 2009/177/CE no que diz respeito ao estatuto da
    Croácia relativamente à herpesvirose da carpa-koi (KHV) e da Finlândia relativamente
    à necrose hematopoética infeciosa (NHI), à lista de zonas da Irlanda indemnes
    de Bonamia ostreae e à lista de zonas do Reino Unido indemnes de Marteilia refringens
    e que altera o anexo I da Decisão 2010/221/UE no que diz respeito à lista de
    zonas do Reino Unido indemnes do vírus Ostreid herpesvirus 1 μvar (OsHV-1 μVar)
    [notificada com o número C(2018) 4381]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/998 a Comisiei din 12 iulie 2018
    de modificare a anexei I la Decizia 2009/177/CE în ceea ce privește statutul
    Croației cu privire la boala provocată de virusul herpetic al crapului koi (KHV)
    și al Finlandei cu privire la necroza hematopoietică infecțioasă (NHI), lista
    zonelor din Irlanda indemne de Bonamia ostreae, lista zonelor din Regatul Unit
    indemne de Marteilia refringens, și de modificare a anexei I la Decizia 2010/221/UE
    în ceea ce privește lista zonelor din Regatul Unit indemne de virusul herpetic
    al stridiilor 1 μvar (OsHV-1 μVar) [notificată cu numărul C(2018) 4381]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2018/998 z 12. júla 2018, ktorým
    sa mení príloha I k rozhodnutiu 2009/177/ES, pokiaľ ide o štatút Chorvátska
    vzhľadom na výskyt herpesvirózy kaprov koi (KHV), Fínska vzhľadom na výskyt
    infekčnej hematopoetickej nekrózy (IHN), zoznam oblastí v Írsku bez výskytu
    bonamiózy, zoznam oblastí v Spojenom kráľovstve bez výskytu marteiliózy,
    a ktorým sa mení príloha I k rozhodnutiu 2010/221/EÚ, pokiaľ ide o zoznam
    oblastí v Spojenom kráľovstve bez výskytu herpetického vírusu ustríc 1
    μVar (OsHV-1 μVar) (oznámené pod číslom C(2018) 4381)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2018/998 z dne 12. julija 2018 o spremembi
    Priloge I k Odločbi 2009/177/ES glede statusa Hrvaške za bolezen, ki jo povzroča
    Koi herpes virus (KHV), Finske za infekciozno hematopoetsko nekrozo (IHN), seznama
    območij na Irskem, ki so prosta okužbe z Bonamia ostreae, in seznama območij
    v Združenem kraljestvu, ki so prosta okužbe z Marteilia refringens, ter o spremembi
    Priloge I k Sklepu 2010/221/EU glede seznama območij v Združenem kraljestvu,
    ki so prosta ostreidnega herpesvirusa 1 μνar (OsHV-1 μνar) (notificirano pod
    dokumentarno številko C(2018) 4381)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2018/998 de la Comisión, de 12 de julio de
    2018, por la que se modifica el anexo I de la Decisión 2009/177/CE en lo que
    respecta a la calificación de Croacia en relación con la herpesvirosis koi (HVK),
    la de Finlandia en relación con la necrosis hematopoyética infecciosa (NHI),
    la lista de zonas de Irlanda libres de Bonamia ostreae y la lista de zonas del
    Reino Unido libres de Marteilia refringens, y por la que se modifica el anexo
    I de la Decisión 2010/221/UE en lo que respecta a la lista de zonas del Reino
    Unido libres del herpesvirus de los ostreidos tipo 1 μVar (OsHV-1 μVar) [notificada
    con el número C(2018) 4381]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2018/998 av den 12 juli 2018 om
    ändring av bilaga I till beslut 2009/177/EG vad gäller status för Kroatien
    i fråga om koiherpesvirus (KHV), för Finland i fråga om infektiös hematopoietisk
    nekros (IHN), förteckningen över områden i Irland fria från Bonamia ostreae,
    förteckningen över områden i Förenade kungariket fria från Marteilia refringens
    och om ändring av bilaga I till beslut 2010/221/EU vad gäller förteckningen
    över områden i Förenade kungariket fria från herpesvirus OsHV-1 μVar [delgivet
    med nr C(2018) 4381]
