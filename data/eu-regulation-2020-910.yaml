---
id: EURegulation2020910
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/910 of 30 June 2020 amending
    Implementing Regulations (EU) 2015/1998, (EU) 2019/103 and (EU) 2019/1583 as regards
    the re-designation of airlines, operators and entities providing security controls
    for cargo and mail arriving from third countries, as well as the postponement
    of certain regulatory requirements in the area of cybersecurity, background check,
    explosive detection systems equipment standards, and explosive trace detection
    equipment, because of the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/910 de la Commission du 30 juin 2020
    modifiant les règlements d’exécution (UE) 2015/1998, (UE) 2019/103 et (UE)
    2019/1583 en ce qui concerne le renouvellement de la désignation des compagnies
    aériennes, des exploitants et des entités assurant des contrôles de sûreté
    sur le fret et le courrier en provenance de pays tiers, ainsi que le report de
    certaines exigences réglementaires dans le domaine de la cybersécurité, de
    la vérification des antécédents, des normes relatives aux équipements de détection
    d’explosifs, et des équipements de détection des traces d’explosifs, en
    raison de la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/910 der Kommission vom 30. Juni 2020
    zur Änderung der Durchführungsverordnungen (EU) 2015/1998, (EU) 2019/103 und
    (EU) 2019/1583 im Hinblick auf die erneute Benennung von Luftfahrtunternehmen,
    Betreibern und Stellen, die Sicherheitskontrollen von Luftfracht und Luftpost
    aus Drittländern durchführen, sowie auf die Verschiebung bestimmter regulatorischer
    Anforderungen in den Bereichen Cybersicherheit, Zuverlässigkeitsüberprüfung,
    Standards für Sprengstoffdetektoren und Sprengstoffspurendetektoren aufgrund
    der COVID-19-Pandemie
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/910 на Комисията
    от 30 юни 2020 година за изменение на регламенти
    за изпълнение (ЕС) 2015/1998, (ЕС) 2019/103 и (ЕС) 2019/1583
    по отношение на повторното определяне на въздушни
    превозвачи, оператори и субекти, предоставящи
    проверки по сигурността на товари и поща, пристигащи
    от трети държави, както и за отлагането на някои
    нормативни изисквания в областта на киберсигурността,
    цялостната проверка, стандартите за оборудване
    за системи за откриване на експлозиви и оборудването
    за откриване на следи от експлозив поради пандемията
    от COVID-19
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/910 ze dne 30. června 2020,
    kterým se mění prováděcí nařízení (EU) 2015/1998, (EU) 2019/103 a (EU)
    2019/1583, pokud jde o opětovné označení leteckých společností, provozovatelů
    a subjektů provádějících bezpečnostní kontroly nákladu a pošty přicházejících
    ze třetích zemí, jakož i o odklad některých regulatorních požadavků v
    oblasti kybernetické bezpečnosti, ověřování spolehlivosti, norem pro systémy
    detekce výbušnin a zařízení pro stopovou detekci výbušnin v důsledku pandemie
    COVID-19
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/910 af 30. juni 2020
    om ændring af gennemførelsesforordning (EU) 2015/1998, (EU) 2019/103 og (EU)
    2019/1583 for så vidt angår genudpegning af luftfartsselskaber, operatører
    og enheder, der udfører sikkerhedskontrol for fragt og post fra tredjelande,
    og udsættelse af visse lovgivningsmæssige krav vedrørende cybersikkerhed, baggrundskontrol,
    normer for udstyr til sporing af eksplosive stoffer samt spordetektionsudstyr
    på grund af covid-19-pandemien
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/910 της Επιτροπής
    της 30ής Ιουνίου 2020 για την τροποποίηση των
    εκτελεστικών κανονισμών (ΕΕ) 2015/1998, (ΕΕ) 2019/103
    και (ΕΕ) 2019/1583 όσον αφορά τον επανορισμό αεροπορικών
    εταιρειών, φορέων εκμετάλλευσης και φορέων
    που εφαρμόζουν διαδικασίες ασφάλειας για φορτίο
    και ταχυδρομείο που αφικνούνται από τρίτες
    χώρες, καθώς και όσον αφορά την αναβολή ορισμένων
    κανονιστικών απαιτήσεων στον τομέα της κυβερνοασφάλειας,
    του ελέγχου ιστορικού, των προτύπων εξοπλισμού
    συστημάτων ανίχνευσης εκρηκτικών και του εξοπλισμού
    ανίχνευσης ιχνών εκρηκτικών, λόγω της πανδημίας
    COVID-19
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/910, 30. juuni 2020, millega muudetakse
    rakendusmäärusi (EL) 2015/1998, (EL) 2019/103 ja (EL) 2019/1583 kolmandatest
    riikidest saabuva kauba ja posti suhtes julgestuskontrollimeetmeid kohaldavate
    lennuettevõtjate, käitajate ja üksuste määramise osas ning teatavate küberjulgeolekut,
    taustakontrolli, lõhkeaine avastamissüsteemi seadmete standardeid ja lõhkeaine
    jälgede avastamise seadmeid käsitlevate regulatiivsete nõuete osas COVID-19
    pandeemia tõttu
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2020/910, annettu 30 päivänä
    kesäkuuta 2020, täytäntöönpanoasetusten (EU) 2015/1998, (EU) 2019/103 ja
    (EU) 2019/1583 muuttamisesta siltä osin kuin on kyse kolmansista maista saapuvaan
    rahtiin ja postiin sovellettavia turvavalvontatoimenpiteitä suorittavien lentoliikenteen
    harjoittajien, toiminnanharjoittajien ja yksiköiden uudelleennimeämistä sekä
    tiettyjen kyberturvallisuutta, taustan tarkistusta, räjähdysaineilmaisinstandardeja
    ja räjähdysainejäämäilmaisimia koskevien sääntelyvaatimusten soveltamisen
    lykkäämisestä COVID-19-pandemian vuoksi
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/910 оd 30. lipnja 2020. o izmjeni,
    zbog pandemije bolesti COVID-19, provedbenih uredbi (EU) 2015/1998, (EU) 2019/103
    i (EU) 2019/1583 u pogledu ponovnog označivanja zračnih prijevoznika, operatora
    i subjekata koji provode zaštitne kontrole tereta i pošte u dolasku iz trećih
    zemalja te odgode određenih regulatornih zahtjeva u području kibersigurnosti,
    provjere podobnosti, standarda za opremu sustava za otkrivanje eksploziva i opreme
    za otkrivanje tragova eksploziva
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/910 végrehajtási rendelete (2020. június 30.)
    az (EU) 2015/1998, az (EU) 2019/103 és az (EU) 2019/1583 végrehajtási rendeletnek
    a harmadik országokból érkező áruk és postai küldemények védelmi ellenőrzését
    végző légitársaságok, üzemeltetők és jogalanyok újbóli kijelölése,
    valamint a kiberbiztonságra, a háttérellenőrzésre, a robbanóanyag-felderítő
    eszközökre és a robbanóanyagnyom-felderítő eszközökre vonatkozó bizonyos
    szabályozási követelményeknek a Covid19-világjárvány miatti elhalasztása
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/910 della Commissione del 30 giugno
    2020 che modifica i regolamenti di esecuzione (UE) 2015/1998, (UE) 2019/103 e
    (UE) 2019/1583 per quanto riguarda la nuova designazione delle compagnie aeree,
    degli operatori e dei soggetti che effettuano controlli di sicurezza di merci
    e posta provenienti da paesi terzi, nonché il rinvio di determinate prescrizioni
    regolamentari nel settore della cibersicurezza, del controllo dei precedenti personali,
    degli standard dei sistemi per il rilevamento di esplosivi e dei dispositivi per
    il rilevamento di tracce di esplosivi, a causa della pandemia di Covid-19
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/910 (2020. gada 30. jūnijs),
    ar ko Īstenošanas regulas (ES) 2015/1998, (ES) 2019/103 un (ES) 2019/1583 groza
    attiecībā uz apzīmējumu atkārtotu piešķiršanu aviosabiedrībām, operatoriem
    un tiesību subjektiem, kuri veic no trešām valstīm ievestas kravas un pasta
    drošības kontroles, kā arī attiecībā uz dažu kiberdrošības, iepriekšējās
    darbības pārbaudes, sprāgstvielu atklāšanas sistēmu iekārtu standartu un
    sprāgstvielu palieku detektoru jomā piemērojamu regulatīvo prasību atlikšanu
    Covid-19 pandēmijas dēļ
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/910 2020 m. birželio 30
    d. kuriuo dėl COVID-19 pandemijos iš dalies keičiamos įgyvendinimo reglamentų
    (ES) 2015/1998, (ES) 2019/103 ir (ES) 2019/1583 nuostatos, susijusios su oro transporto
    bendrovių, veiklos vykdytojų ir subjektų, atliekančių iš trečiųjų šalių
    atvykstančių krovinių ir pašto saugumo kontrolę, pakartotiniu paskyrimu ir
    su tam tikrų kibernetinio saugumo, asmens reputacijos patikrinimo, sprogmenų
    aptikimo sistemų įrangos standartų ir mažo kiekio sprogstamųjų medžiagų
    ieškiklių reguliavimo reikalavimų taikymo atidėjimu
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/910 tat-30
    ta’ Ġunju 2020 li jemenda r-Regolamenti ta’ Implimentazzjoni (UE) 2015/1998,
    (UE) 2019/103 u (UE) 2019/1583 fir-rigward tad-deżinjazzjoni mill-ġdid tal-linji
    tal-ajru, tal-operaturi u tal-entitajiet li jipprovdu kontrolli tas-sigurtà għall-merkanzija
    u l-posta li jaslu minn pajjiżi terzi, kif ukoll il-posponiment ta’ ċerti
    rekwiżiti regolatorji fil-qasam taċ-ċibersigurtà, tal-kontroll tal-isfond,
    tal-istandards tat-tagħmir b’sistemi għad-detezzjoni tal-isplussivi, u tat-tagħmir
    għad-detezzjoni ta’ traċċi tal-isplussivi, minħabba l-pandemija tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/910 van de Commissie van 30 juni 2020
    tot wijziging van de Uitvoeringsverordeningen (EU) 2015/1998, (EU) 2019/103 en
    (EU) 2019/1583 voor wat betreft de vernieuwde aanwijzing van luchtvaartmaatschappijen,
    exploitanten en entiteiten die beveiligingscontroles uitvoeren op vracht en post
    die aankomt uit derde landen, en het uitstel van bepaalde regelgevende eisen op
    het gebied van cyberbeveiliging, achtergrondcontrole, normen voor apparatuur voor
    explosievendetectiesystemen en voor de detectie van explosievensporen, naar aanleiding
    van de COVID-19-pandemie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/910 z dnia 30 czerwca 2020
    r. zmieniające rozporządzenia wykonawcze (UE) 2015/1998, (UE) 2019/103 i (UE)
    2019/1583 w odniesieniu do ponownego wyznaczania przedsiębiorstw lotniczych,
    operatorów i podmiotów oferujących środki kontroli w zakresie ochrony ładunków
    i poczty przywożonych z państw trzecich, a także odroczenia stosowania niektórych
    wymogów regulacyjnych w dziedzinie cyberbezpieczeństwa, sprawdzenia przeszłości,
    norm systemu wykrywania materiałów wybuchowych oraz urządzeń do wykrywania
    śladowych ilości materiałów wybuchowych z powodu pandemii COVID-19
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/910 da Comissão de 30 de junho de
    2020 que altera os Regulamentos de Execução (UE) 2015/1998, (UE) 2019/103 e
    (UE) 2019/1583 no que diz respeito à renovação da designação das companhias
    aéreas, dos operadores e das entidades que efetuam controlos de segurança da
    carga e do correio provenientes de países terceiros, e ao adiamento de determinadas
    obrigações regulamentares de cibersegurança, verificação de antecedentes,
    normas do equipamento de sistemas de deteção de explosivos e do equipamento
    de deteção de vestígios de explosivos, devido à pandemia de COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/910 al Comisiei din 30 iunie
    2020 de modificare a Regulamentelor de punere în aplicare (UE) 2015/1998, (UE)
    2019/103 și (UE) 2019/1583 în ceea ce privește redesemnarea companiilor aeriene,
    a operatorilor și a entităților care furnizează controale de securitate pentru
    mărfurile și poșta care sosesc din țări terțe, precum și amânarea anumitor
    cerințe de reglementare în domeniul securității cibernetice, al verificării
    antecedentelor, al standardelor privind sistemele de detectare a explozivilor
    și al echipamentelor de detectare a urmelor de explozibili, ca urmare a pandemiei
    de COVID-19
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/910 z 30. júna 2020, ktorým
    sa menia vykonávacie nariadenia (EÚ) 2015/1998, (EÚ) 2019/103 a (EÚ) 2019/1583,
    pokiaľ ide o opätovné určenie leteckých spoločností, prevádzkovateľov
    a subjektov vykonávajúcich kontroly bezpečnostnej ochrany nákladu a poštových
    zásielok z tretích krajín, ako aj o odklad určitých regulačných požiadaviek
    v oblasti kybernetickej bezpečnosti, previerok osôb, noriem zariadení systémov
    detekcie výbušnín a zariadení na stopovú detekciu výbušnín v dôsledku
    pandémie COVID-19
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/910 z dne 30. junija 2020 o spremembi
    izvedbenih uredb (EU) 2015/1998, (EU) 2019/103 in (EU) 2019/1583 glede ponovnega
    imenovanja letalskih prevoznikov, operatorjev in subjektov, ki zagotavljajo varnostni
    nadzor za tovor in pošto, ki prihajata iz tretjih držav, ter odloga nekaterih
    regulativnih zahtev na področju kibernetske varnosti, preverjanja preteklosti,
    standardov za sisteme za odkrivanje eksploziva in naprav za zaznavanje sledi eksplozivov
    zaradi pandemije COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/910 de la Comisión de 30 de junio de
    2020 por el que se modifican los Reglamentos de Ejecución (UE) 2015/1998, (UE)
    2019/103 y (UE) 2019/1583, a consecuencia de la pandemia de COVID-19, en lo que
    respecta a la nueva designación de las compañías aéreas, los operadores y
    las entidades que realizan controles de seguridad de la carga y el correo procedentes
    de terceros países, así como al aplazamiento de determinados requisitos reglamentarios
    en los ámbitos de la ciberseguridad, la verificación de antecedentes, las normas
    para los equipos de detección de explosivos y los equipos de detección de trazas
    de explosivos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/910 av den 30 juni 2020
    om ändring av genomförandeförordningarna (EU) 2015/1998, (EU) 2019/103 och
    (EU) 2019/1583 vad gäller förnyat godkännande av lufttrafikföretag, operatörer
    och verksamhetsutövare som tillhandahåller säkerhetskontroller för frakt och
    post som anländer från tredjeland, samt senareläggandet av vissa rättsliga
    krav på området för cybersäkerhet, säkerhetsprövning, standarder för EDS-utrustning
    (Explosive Detection System) och EDS-utrustning, till följd av covid-19-pandemin
  type: main
