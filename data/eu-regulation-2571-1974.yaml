id: EURegulation25711974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2571/74 of the Commission of 9 October 1974 re-establishing
    the levying of the customs duties on articles of asphalt or of similar material,
    falling within heading No 68.08, originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2571/74 de la Commission, du 9 octobre 1974, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en asphalte ou produits similaires, de la position tarifaire 68.08, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2571/74 der Kommission vom 9. Oktober 1974 zur Wiedereinführung
    des Zollsatzes für Waren aus Asphalt- oder aus ähnlichen Stoffen (z.B. Erdölpech,
    Kohlenteerpech) der Tarifnummer 68.08, mit Ursprung in Rumänien, dem die in der
    Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2571/74 af 9. oktober 1974 om genindførelse
    af opkrævning af toldafgifter for varer af asfalt eller af lignende materiale
    under position 68.08, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2571/74 della Commissione, del 9 ottobre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di asfalto o
    di prodotti simili (pece di petrolio, di carbone fossile, ecc.) della voce doganale
    n. 68.08 originari della Romania beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2571/74 van de Commissie van 9 oktober 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op werken van
    asfalt of van dergelijke produkten (petroleumbitumen, koolteerpek, enz.) van post
    68.08, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG)
    nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties werden
    geopend
  type: main
