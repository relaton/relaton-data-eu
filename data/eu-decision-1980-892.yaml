id: EUDecision1980892
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/892/EEC: Commission Decision of 25 July 1980 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, other than those of category 10, falling
    within subheading ex 60.02 B of the Common Customs Tariff (category 11), originating
    in the Philippines and in free circulation in the other Member States (Only the
    French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/892/CEE: Décision de la Commission, du 25 juillet 1980, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, autre que celle de la catégorie 10,
    de la sous-position ex 60.02 B du tarif douanier commun (catégorie 11), originaire
    des Philippines et mise en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/892/EWG: Entscheidung der Kommission vom 25. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus den Philippinen stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken,
    weder gummielastisch noch kautschutiert, andere als Waren der Kategorie 10, der
    Tarifstelle ex 60.02 B (Kategorie 11) des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/892/EØF: Kommissionens beslutning af 25. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, ikke elastisk, bortset fra varer i kategori 10, som henhører under
    pos. ex 60.02 B, kategori 11, i den fælles toldtarif, har oprindelse i Filippinerne
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/892/CEE: Decisione della Commissione, del 25 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, diversi da quelli della categoria 10, della sottovoce
    ex 60.02 B della tariffa doganale comune, categoria 11, originari delle Filippine
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/892/EEG: Beschikking van de Commissie van 25 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, andere dan die van categorie 10, van
    post ex 60.02 B (categorie 11) van het gemeenschappelijk douanetarief, van oorsprong
    uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
