  content: COMMISSION REGULATION (EEC) No 1582/93 of 23 June 1993 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to fruit and vegetable trade between Spain and the Community as constituted
    at 31 December 1985 as regards tomatoes, artichokes, melons, apricots, peaches
    and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1582/93 de la Commission du 23 juin 1993 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et la Communauté
    dans sa composition au 31 décembre 1985 en ce qui concerne les tomates, les artichauts,
    les melons, les abricots, les pêches et les fraises
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1582/93 DER KOMMISSION vom 23. Juni 1993 mit zusätzlichen
    Bestimmungen zum ergänzenden Handelsmechanismus (EHM) für Tomaten, Artischocken,
    Melonen, Aprikosen, Pfirsiche und Erdbeeren im Handel zwischen Spanien und der
    Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1582/93 af 23. juni 1993 om visse yderligere
    gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen (SMS)
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985 i
    sektoren for frugt og grønsager, for så vidt angår tomater, artiskokker, meloner,
    abrikoser, ferskner og jordbær
  type: main
- language: el
  script: Grek
