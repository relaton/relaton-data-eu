title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2438/84 of 23 August 1984 re-establishing
    the levying of customs duties on frames and mountings, and parts thereof, for
    spectacles, pince-nez, lorgnettes, goggles and the like, falling within heading
    No 90.03 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2438/84 de la Commission du 23 août 1984 portant rétablissement
    de la perception des droits de douane applicables aux montures de lunettes, de
    lorgnons, de faces-à-main et d' articles similaires et parties de montures de
    la position 90.03 du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2438/84 der Kommission vom 23. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für Fassungen für Brillen, Klemmer, Stielbrillen oder
    ähnliche Waren, Teile davon der Tarifnummer 90.03 mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2438/84 af 23. august 1984 om genindførelse
    af opkrævning af told for stel og indfatninger til briller, lorgnetter, beskyttelsesbriller
    o. lign., dele til sådanne stel og indfatninger, henhørende under pos. 90.03
    og med oprindelse i Sydkorea, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2438/84 της Επιτροπής
    της 23ης Αυγούστου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για σκελετούς ομματοϋαλίων,
    επιρρινίων τοιούτων, μετά ή άνευ λαβής, και
    παρομοίων ειδών, ως και τα μέρη των σκελετών
    τούτων, της δασμολογικής κλάσεως 90.03 καταγωγής
    Βόρειας Κορέας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2438/84 della Commissione del 23 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili alle montature per occhiali, occhialini,
    occhialetti e oggetti simili e parti di montature, della voce 93.03 della tariffa
    doganale comune, originari della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2438/84 van de Commissie van 23 augustus 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op monturen voor
    brillen, voor lorgnetten, voor faces à main en voor dergelijke artikelen, alsmede
    onderdelen van monturen, van tariefpost 90.03, van oorsprong uit Zuid-Korea, waarvoor
    de in Verordening (EEG) nr. 3569/83 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
