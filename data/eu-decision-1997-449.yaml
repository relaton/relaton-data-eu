    für die Durchführung der Artikel 138 bis 140 der Akte über die Bedingungen
    für den Beitritt der Republik Österreich, der Republik Finnland und des Königreichs
    Schweden (Nur der finnische und der schwedische Text sind verbindlich)'
  type: main
- language: da
