title:
- language: en
  script: Latn
  content: '97/449/EC: Commission Decision of 30 July 1996 amending for the fourth
    time Decision No 95/33/EC approving parts of the Finnish programme for the implementation
    of Articles 138 to 140 of the Act concerning the conditions of Accession of the
    Republic of Austria, the Republic of Finland and the Kingdom of Sweden (Only the
    Finnish and Swedish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/449/CE: Décision de la Commission du 30 juillet 1996 modifiant pour
    la quatrième fois la décision 95/33/CE approuvant certains volets du programme
    finlandais d''application des articles 138 à 140 de l''acte concernant les conditions
    d''adhésion de la République d''Autriche, de la République de Finlande et du
    Royaume de Suède (Les textes en langues finnoise et suédoise sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
