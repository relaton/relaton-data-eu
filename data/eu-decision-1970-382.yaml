title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 juillet 1970, autorisant la République
    française à exclure du traitement communautaire les microscopes de la position
    90.12 du Tarif douanier commun, originaires du Japon, et les jouets de la position
    Ex 97.03 du Tarif douanier commun, originaires du Japon et de Hong-Kong, mis en
    libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/382/EWG: Entscheidung der Kommission vom 17. Juli 1970, mit der die
    Französische Republik ermächtigt wird, die aus Japan stammenden Mikroskope der
    Tarifnummer 90.12 des Gemeinsamen Zolltarifs und die aus Japan und Hongkong stammenden
    Spielzeuge der Tarifnummer ex 97.03, die sich in den übrigen Mitgliedstaaten
    im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/382/CEE: Decisione della Commissione, del 17 luglio 1970, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i microscopi,
    della voce 90.12 della tariffa doganale comune, originari del Giappone ed i giocattoli
    della voce ex 97.03 della medesima tariffa, originari del Giappone e di Hong-Kong
    messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/382/EEG: Beschikking van de Commissie van 17 juli 1970 waarbij de Franse
    Republiek wordt gemachtigd microscopen van post 90.12 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan, en speelgoed van post ex 97.03 van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en Hong-Kong, en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
