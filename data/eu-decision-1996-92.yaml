title:
- language: en
  script: Latn
  content: '96/92/EC: Commission Decision of 11 January 1996 amending Decision 91/449/EEC
    laying down the specimen animal health certificates in respect of meat products
    imported from third countries, to take account of certain products imported from
    Uruguay'
  type: main
- language: fr
  script: Latn
  content: '96/92/CE: Décision de la Commission, du 11 janvier 1996, modifiant la
    décision 91/449/CEE établissant les modèles des certificats sanitaires requis
    à l'' importation de produits à base de viande en provenance des pays tiers
    pour tenir compte de certains produits provenant d'' Uruguay'
  type: main
- language: de
  script: Latn
  content: '96/92/EG: Entscheidung der Kommission vom 11. Januar 1996 zur Änderung
    der Entscheidung 91/449/EWG zur Festlegung der Muster der Tiergesundheitsbescheinigungen
    für aus Drittländern eingeführte Fleischerzeugnisse zur Berücksichtigung bestimmter
    Erzeugnisse aus Uruguay'
  type: main
- language: da
  script: Latn
  content: '96/92/EF: Kommissionens beslutning af 11. januar 1996 om ændring af beslutning
    91/449/EØF om sundhedscertifikater for kødprodukter, der indføres tra tredjelande,
    for at tage hensyn til visse produkter fra Uruguay'
  type: main
- language: el
  script: Grek
  content: '96/92/ΕΚ: Απόφαση της Επιτροπής, της 11ης Ιανουαρίου
    1996, περί τροποποίησης της απόφασης 91/449/ΕΟΚ
    της Επιτροπής για τον καθορισμό του υποδείγματος
    των υγειονομικών πιστοποιητικών που απαιτούνται
    για τα προϊόντα με βάση το κρέας που εισάγονται
    από τρίτες χώρες για να ληφθούν υπόψη ορισμένα
    προϊόντα προέλευσης Ουρουγουάης'
  type: main
- language: fi
  script: Latn
  content: '96/92/EY: Komission päätös, tehty 11 päivänä tammikuuta 1996, lihavalmisteiden
    tuonnissa kolmansista maista käytettävien eläintautitodistusten malleista tehdyn
    päätöksen 91/449/ETY muuttamisesta tiettyjen Uruguaysta lähtöisin olevien
    tuotteiden huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '96/92/CE: Decisione della Commissione, dell'' 11 gennaio 1996, recante
    modifica della decisione 91/449/CEE, che definisce i modelli dei certificati di
    polizia sanitaria per i prodotti a base di carne importati da paesi terzi per
    tener conto di alcuni prodotti provenienti dall'' Uruguay'
  type: main
- language: nl
  script: Latn
  content: '96/92/EG: Beschikking van de Commissie van 11 januari 1996 houdende wijziging
    van Beschikking 91/449/EEG tot vaststelling van het model van de gezondheidscertificaten
    voor uit derde landen ingevoerde vleesprodukten, in verband met bepaalde produkten
    uit Uruguay'
  type: main
- language: pt
  script: Latn
  content: '96/92/CE: Decisão da Comissão, de 11 de Janeiro de 1996, que altera
    a Decisão 91/449/CEE, que estabelece os modelos de certificados sanitários relativos
    aos produtos à base de carne importados de países terceiros, para ter em conta
    certos produtos provenientes do Uruguai'
  type: main
- language: es
  script: Latn
  content: '96/92/CE: Decisión de la Comisión, de 11 de enero de 1996, que modifica,
