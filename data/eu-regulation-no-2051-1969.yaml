    des Umfangs und der Reserve des Gemeinschaftszollkontingents für Heringe, frisch,
    gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt, der Tarifstelle 03.01 B
    I a) 2 aa) des Gemeinsamen Zolltarifs (Zeitraum 1969/1970)
  type: main
- language: it
  script: Latn
