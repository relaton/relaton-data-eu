  content: Règlement (CEE) n° 2051/69 du Conseil, du 17 octobre 1969, portant augmentation
    du volume et de la réserve du contingent tarifaire communautaire de harengs frais,
    réfrigérés ou congelés, entiers, décapités ou tronçonnés, de la sous-position
    03.01 B I a) 2 aa) du tarif douanier commun (période 1969/1970)
  type: main
- language: de
  script: Latn
