  type: main
- language: hr
  script: Latn
  content: ": Provedbena uredba Komisije (EU) br. 201/2013 od 8. ožujka 2013. o izmjeni provedbenih uredaba (EU) br. 788/2011 i (EU) br. 540/2011 u pogledu proširenja uporaba za koje je odobrena aktivna tvar fluazifop-P"
  type: main
- language: hu
  script: Latn
