    și a Regulamentului de punere în aplicare (UE) nr. 540/2011 în ceea ce privește
    o extindere a utilizărilor pentru care este aprobată substanța activă fluazifop-P
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 201/2013 z 8. marca 2013 , ktorým
