title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 201/2013 of 8 March 2013 amending
    Implementing Regulations (EU) No 788/2011 and (EU) No 540/2011 as regards an extension
    of the uses for which the active substance fluazifop-P is approved
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 201/2013 de la Commission du 8 mars
    2013 modifiant les règlements d’exécution (UE) n ° 788/2011 et (UE) n °
    540/2011, en ce qui concerne une extension des utilisations pour lesquelles la
    substance active fluazifop-P est approuvée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 201/2013 der Kommission vom 8. März
    2013 zur Änderung der Durchführungsverordnung (EU) Nr. 788/2011 und der Durchführungsverordnung
    (EU) Nr. 540/2011 hinsichtlich einer Erweiterung der Anwendungen, für die der
    Wirkstoff Fluazifop-P genehmigt ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 201/2013 на Комисията
