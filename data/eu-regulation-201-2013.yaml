    nařízení (EU) č. 540/2011, pokud jde o rozšíření použití, pro která
    byla účinná látka fluazifop-P schválena
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 201/2013 af 8. marts 2013
    om ændring af gennemførelsesforordning (EU) nr. 788/2011 og (EU) nr. 540/2011
    for så vidt angår en udvidelse af de anvendelser, som aktivstoffet fluazifop-P
    er godkendt til
  type: main
- language: el
  script: Grek
