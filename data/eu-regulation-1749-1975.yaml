title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1749/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on equipment for parlour, table and funfair games
    for adults or children (including billiard tables and pintables and table-tennis
    requisites), falling within heading No 97.04, originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3054/74
    of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1749/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour jeux de société, de la position tarifaire 97.04, originaires de Hong-Kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3054/74 du Conseil du 2 décembre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1749/75 der Kommission vom 7. Juli 1975 zur Wiedereinführung
    des Zollsatzes für Gesellschaftsspiele der Tarifnummer 97.04, mit Ursprung in
    Hongkong, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1749/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for selskabsspil under position 97.04, som har
    oprindelse i Hong Kong og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1749/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti per giochi
    di società, della voce doganale 97.04, originari di Hong Kong, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1749/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op artikelen
    voor gezelschapsspelen, van post 97.04, van oorsprong uit Hong-Kong, ten behoeve
    waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene
    tariefpreferenties werden geopend
  type: main
