title:
- language: en
  script: Latn
  content: Council Directive 84/641/EEC of 10 December 1984 amending, particularly
    as regards tourist assistance, the First Directive (73/239/EEC) on the coordination
    of laws, regulations and administrative provisions relating to the taking-up and
    pursuit of the business of direct insurance other than life assurance
  type: main
- language: fr
  script: Latn
  content: Directive 84/641/CEE du Conseil du 10 décembre 1984 modifiant, en ce qui
    concerne notamment l'assistance touristique, la première directive (73/239/CEE)
    portant coordination des dispositions législatives, réglementaires et administratives
    concernant l'accès à l'activité de l'assurance directe autre que l'assurance
    sur la vie, et son exercice
  type: main
- language: de
  script: Latn
  content: Richtlinie 84/641/EWG des Rates vom 10. Dezember 1984 zur insbesondere
    auf die touristische Beistandsleistung bezüglichen Änderung der Ersten Richtlinie
    73/239/EWG zur Koordinierung der Rechts- und Verwaltungsvorschriften betreffend
    die Aufnahme und Ausübung der Tätigkeit der Direktversicherung (mit Ausnahme
    der Lebensversicherung)
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 10 декември 1984 година
    за изменение, особено по отношение на оказването
    на помощ на туристи, на Първата директива (73/239/EИО)
    относно координирането на законовите, подзаконовите
    и административните разпоредби относно достъпа
    до и упражняването на пряка застрахователна
    дейност, различна от животозастраховане
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 10. prosince 1984, kterou se mění první směrnice
