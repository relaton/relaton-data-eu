  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 10 grudnia 1984 r. zmieniająca, szczególnie w zakresie
    ubezpieczenia świadczenia pomocy turystycznej, pierwszą dyrektywę (73/239/EWG)
    w sprawie koordynacji przepisów ustawowych, wykonawczych i administracyjnych
    odnoszących się do podejmowania i prowadzenia działalności w dziedzinie ubezpieczeń
    bezpośrednich innych niż ubezpieczenia na życie
  type: main
- language: pt
  script: Latn
  content: Directiva 84/641/CEE do Conselho, de 10 de Dezembro de 1984, que altera,
