    přístupu k činnosti v přímém pojištění jiném než životním a jejího
    výkonu, a to zejména ve vztahu k asistenčním službám pro turisty
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 84/641/EØF af 10. december 1984 om ændring, navnlig
    for så vidt angår turistassistance, af første direktiv 73/239/EØF om samordning
    af de administrativt eller ved lov fastsatte bestemmelser om adgang til og udøvelse
    af direkte forsikringsvirksomhed bortset fra livsforsikring
  type: main
- language: el
  script: Grek
