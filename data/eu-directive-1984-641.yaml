  script: Latn
  content: Direttiva 84/641/CEE del Consiglio del 10 dicembre 1984 che modifica, per
    quanto riguarda in particolare l'assistenza turistica, la prima direttiva 73/239/CEE
    recante coordinamento delle disposizioni legislative, regolamentari ed amministrative
    in materia di accesso e di esercizio dell'assicurazione diretta diversa dell'assicurazione
    sulla vita
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1984. gada 10. decembris), ar ko groza, jo īpaši
    attiecībā uz palīdzību tūristiem, Padomes Pirmo direktīvu (73/239/EEK) par
    normatīvo un administratīvo aktu koordināciju attiecībā uz uzņēmējdarbības
    sākšanu un veikšanu tiešās apdrošināšanas nozarē, kas nav dzīvības
    apdrošināšana
  type: main
- language: lt
  script: Latn
  content: 1984 m. gruodžio 10 d. Tarybos Direktyva iš dalies keičianti, pirmiausia
