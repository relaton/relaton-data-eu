  content: Directiva Consiliului din 10 decembrie 1984 de modificare, cu privire în
    special la asistența turistică, a primei Directive (73/239/CEE) privind coordonarea
    actelor cu putere de lege și actelor administrative privind inițierea și exercitarea
    activității de asigurare generală directă
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 10. decembra 1984, ktorou sa mení a dopĺňa prvá smernica
