title:
- language: fr
  script: Latn
  content: Décision 65/319/CEE du Conseil du 22 juin 1965, autorisant la République
    italienne à suspendre à l'égard des pays tiers ses droits applicables aux animaux
    vivants de l'espèce bovine, des espèces domestiques, autres, d'un poids unitaire
    n'excédant pas 340 kilogrammes, de la position Ex 01.12 A II
  type: main
- language: de
  script: Latn
  content: '65/319/EWG: Entscheidung des Rates vom 22. Juni 1965 zur Ermächtigung
    der Italienischen Republik, ihre Zollsätze auf Rinder, lebend, Hausrinder, andere,
    mit einem Stückgewicht von höchstens 340 kg, der Tarifnummer ex 01.02 A II,
    gegenüber Drittländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/319/CEE: Decisione del Consiglio, del 22 giugno 1965, con cui si autorizza
    la Repubblica italiana a sospendere nei confronti dei paesi terzi i dazi applicabili
    agli animali vivi della specie bovina, delle specie domestiche, altri, di peso
    unitario non superiore a 340 chilogrammi, della voce ex 01.02 A II'
  type: main
- language: nl
  script: Latn
  content: '65/319/EEG: Beschikking van de Raad van 22 juni 1965 waarbij de Italiaanse
    Republiek wordt gemachtigd haar douanerechten voor levende runderen, huisdieren,
    andere, die per stuk niet meer wegen dan 340 kilogram, van post ex 01.02 A II,
    ten opzichte van derde landen te schorsen'
  type: main
