    agricole, section "orientation", à la République fédérale d''Allemagne, des
    primes versées pendant l''année 1977 pour la reconversion, vers la production
    de viande, de troupeaux bovins à orientation laitière (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
