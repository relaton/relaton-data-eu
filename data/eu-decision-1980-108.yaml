  script: Latn
  content: '80/108/EEC: Commission Decision of 20 December 1979 on the provisional
    reimbursement by the Guidance Section of the EAGGF to the Federal Republic of
    Germany of premiums paid during 1977 for the conversion of dairy herds to meat
    production (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/108/CEE: Décision de la Commission, du 20 décembre 1979, relative
