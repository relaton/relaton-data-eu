    der er fremstillet på grundlag af genetisk modificerede organismer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 49/2000 της Επιτροπής,
    της 10ης Ιανουαρίου 2000, περί τροποποιήσεως του
