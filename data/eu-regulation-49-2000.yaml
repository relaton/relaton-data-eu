    andmete kohustuslikku lisamist teatavate geneetiliselt muundatud organismidest
    toodetud toiduainete märgistusele
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 49/2000, annettu 10 päivänä tammikuuta 2000,
