    επισήμανση ορισμένων τροφίμων που παράγονται
    από γενετικώς τροποποιημένους οργανισμούς
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 49/2000, 10. jaanuar 2000, millega muudetakse
