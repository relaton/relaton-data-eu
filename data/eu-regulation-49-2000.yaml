    ako sú údaje stanovené v smernici 79/112/EEC na označení určitých potravín
    vyrobených z geneticky modifikovaných organizmov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) 49/2000 z dne 10. januarja 2000 o spremembi Uredbe
