    stanoveny ve směrnici 79/112/EHS, při označování určitých potravin vyrobených
    z geneticky modifikovaných organismů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 49/2000 af 10. januar 2000 om ændring
