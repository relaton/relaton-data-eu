title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 49/2000 of 10 January 2000 amending Council
    Regulation (EC) No 1139/98 concerning the compulsory indication on the labelling
    of certain foodstuffs produced from genetically modified organisms of particulars
    other than those provided for in Directive 79/112/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 49/2000 de la Commission, du 10 janvier 2000, modifiant
    le règlement (CE) nº 1139/98 du Conseil concernant la mention obligatoire, dans
    l'étiquetage de certaines denrées alimentaires produites à partir d'organismes
    génétiquement modifiés, d'informations autres que celles prévues par la directive
    79/112/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 49/2000 der Kommission vom 10. Januar 2000 zur Änderung
    der Verordnung (EG) Nr. 1139/98 des Rates über Angaben, die zusätzlich zu den
    in der Richtlinie 79/112/EWG aufgeführten Angaben bei der Etikettierung bestimmter
    aus genetisch veränderten Organismen hergestellter Lebensmittel vorgeschrieben
    sind
  type: main
