  content: Commission Regulation (EEC) No 1646/86 of 28 May 1986 re-establishing the
    levying of customs duties on methanol (methyl alcohol), falling within subheading
    29.04 A I, originating in Bahrain, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
