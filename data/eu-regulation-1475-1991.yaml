title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1475/91 of 31 May 1991 on the arrangements
    applicable to agricultural products subject to reference quantities and originating
    in the African Caribbean and Pacific States or in the overseas countries and territories
    (1991/92)
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1475/91 DE LA COMMISSION du 31 mai 1991 concernant
    la procédure à appliquer à certains produits agricoles, soumis à quantités
    de référence, originaires des États d'' Afrique, des Caraïbes et du Pacifique
    ou des pays et territoires d'' outre-mer (1991/1992) #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1475/91 DER KOMMISSION vom 31. Mai 1991 über das
    Verfahren, das auf bestimmte landwirtschaftliche Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP) oder in den überseeischen
    Ländern und Gebieten (ÜLG), die Referenzmengen unterworfen sind, anzuwenden
    ist (1991/92) #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1475/91 af 31. maj 1991 om den ordning,
    der skal gælde for visse landbrugsprodukter, som er undergivet en referencemængde,
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier (1991/92)
  type: main
- language: el
  script: Grek
