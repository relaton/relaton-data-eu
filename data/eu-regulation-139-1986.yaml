    to in Articles 39, 40 and 41 of Regulation (EEC) No 337/79 and held by intervention
    agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 139/86 du Conseil du 20 janvier 1986 établissant
    les règles générales relatives à l' écoulement des alcools obtenus au titre
    des distillations visées aux articles 39, 40 et 41 du règlement (CEE) n° 337/79
    et détenus par les organismes d' intervention
  type: main
- language: de
  script: Latn
