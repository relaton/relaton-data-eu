    den Artikeln 39, 40 und 41 der Verordnung (EWG) Nr. 337/79 gewonnenem Alkohol
    aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 139/86 af 20. januar 1986 om generelle regler
