  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2019/2087, 28. november 2019, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi Bt11 × MIR162 × MIR604 × 1507 × 5307
    × GA21 ning geneetiliselt muundatud maisi, milles on kombineeritud kaks, kolm,
    neli või viis Bt11, MIR162, MIR604, 1507, 5307 ja GA21 transformatsioonidest,
    sisaldavaid, sellest koosnevaid või valmistatud tooteid (teatavaks tehtud numbri
    C(2019) 8428 all) (Ainult hollandi- ja prantsuskeelne tekst on autentsed)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/2087, annettu 28 päivänä
    marraskuuta 2019, muuntogeenistä maissia Bt11 × MIR162 × MIR604 × 1507 ×
    5307 × GA21 ja muunnostapahtumista Bt11, MIR162, MIR604, 1507, 5307 ja GA21 kahta,
    kolmea, neljää tai viittä yhdistelemällä muodostettua muuntogeenistä maissia
    sisältävien, siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille
    saattamisen sallimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti (tiedoksiannettu numerolla C(2019) 8428) (Ainoastaan hollannin-
    ja ranskankieliset tekstit ovat todistusvoimaisia)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/2087 оd 28. studenoga 2019. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 i genetski modificirani kukuruz
    koji je kombinacija dviju, triju, četiriju ili pet pojedinačnih promjena Bt11,
    MIR162, MIR604, 1507, 5307 i GA21, sastoje se ili su proizvedeni od njega, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2019) 8428) (Vjerodostojni su samo tekstovi na francuskom i nizozemskom
    jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2087 végrehajtási határozata (2019. november
    28.) a géntechnológiával módosított Bt11 × MIR162 × MIR604 × 1507 × 5307
    × GA21 kukoricát és a géntechnológiával módosított, a Bt11, a MIR162,
    a MIR604, az 1507, az 5307 és a GA21 génmódosítási események közül kettőt,
    hármat, négyet vagy ötöt ötvöző kukoricát tartalmazó, abból álló vagy
