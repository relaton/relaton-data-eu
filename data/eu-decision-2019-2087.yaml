  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/2087 av den 28 november 2019
    om godkännande för utsläppande på marknaden av produkter som innehåller,
    består av eller har framställts av genetiskt modifierad majs Bt11 × MIR162
    × MIR604 × 1507 × 5307 × GA21 och av genetiskt modifierad majs som kombinerar
    två, tre, fyra eller fem av de enskilda transformationshändelserna Bt11, MIR162,
    MIR604, 1507, 5307 och GA21, i enlighet med Europaparlamentets och rådets förordning
    (EG) nr 1829/2003 [delgivet med nr C(2019) 8428] (Endast de nederländska och
    franska texterna är giltiga)
