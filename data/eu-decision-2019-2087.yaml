    a C(2019) 8428. számú dokumentummal történt) (Csak a holland és a francia
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/2087 della Commissione del 28 novembre
    2019 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato Bt11 × MIR162 × MIR604 × 1507
    × 5307 × GA21 e da granturco geneticamente modificato che combina due, tre,
    quattro o cinque dei singoli eventi Bt11, MIR162, MIR604, 1507, 5307 e GA21 a
    norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2019) 8428] (Testo rilevante ai fini del SEE) (I testi
    in lingua francese e neerlandese sono i soli facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/2087 (2019. gada 28. novembris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu Bt11 × MIR162
    × MIR604 × 1507 × 5307 × GA21 un ģenētiski modificētu kukurūzu, kurā
    kombinēti divi, trīs, četri vai pieci vienkārši notikumi Bt11, MIR162, MIR604,
    1507, 5307 un GA21, no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2019) 8428) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Sprendimas (ES) 2019/2087 2019 m. lapkričio 28
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 ir genetiškai modifikuotų kukurūzų,
    sudarytų iš dviejų, trijų, keturių ar penkių atskirų Bt11, MIR162, MIR604,
    1507, 5307 ir GA21 genetinių modifikacijų derinių, kurie iš jų sudaryti arba
    kurie iš jų pagaminti (pranešta dokumentu Nr. C(2019) 8428) (Tekstas autentiškas
    tik nyderlandų ir prancūzų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2019/2087 tat-28
    ta’ Novembru 2019 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom,
    li jikkonsistu minn, jew li jkunu magħmulin mill-qamħirrum ġenetikament modifikat
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21, u mill-qamħirrum ġenetikament
    modifikat li jikkombina tnejn, tlieta, erbgħa jew ħamsa mill-eventi uniċi Bt11,
    MIR162, MIR604, 1507, 5307 u GA21 skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill (notifikata bid-dokument C(2019) 8428) (It-testi bl-Olandiż
    u bil-Franċiż biss huma awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/2087 van de Commissie van 28 november 2019
    tot verlening van een vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    mais Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 en genetisch gemodificeerde
    mais die tot stand is gekomen door combinatie van twee, drie, vier of vijf van
    de afzonderlijke transformatiestappen Bt11, MIR162, MIR604, 1507, 5307 en GA21,
    overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement en de
    Raad (Kennisgeving geschied onder nummer C(2019) 8428) (Slechts de teksten in
    de Nederlandse en Franse taal zijn authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/2087 z dnia 28 listopada 2019 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 oraz rodzaje genetycznie zmodyfikowanej
    kukurydzy łączące dwie, trzy, cztery lub pięć modyfikacji Bt11, MIR162, MIR604,
    1507, 5307 i GA21 oraz produktów składających się z wymienionych rodzajów
    genetycznie zmodyfikowanej kukurydzy lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2019) 8428) (Jedynie teksty w języku francuskim i niderlandzkim
    są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/2087 da Comissão de 28 de novembro de
    2019 que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado Bt11 × MIR162
    × MIR604 × 1507 × 5307 × GA21 e milho geneticamente modificado combinando
    dois, três, quatro ou cinco dos eventos únicos Bt11, MIR162, MIR604, 1507, 5307
    e GA21, nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do
    Conselho [notificada com o número C(2019) 8428] (Apenas fazem fé os textos em
    língua francesa e neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/2087 a Comisiei din 28 noiembrie
    2019 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic Bt11 × MIR162 × MIR604 ×
    1507 × 5307 × GA21 și din porumb modificat genetic obținut din combinarea
    a două, trei, patru sau cinci dintre evenimentele de transformare Bt11, MIR162,
    MIR604, 1507, 5307 și GA21 în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului [notificată cu numărul C(2019) 8428] (Numai textele
    în limbile franceză și neerlandeză sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/2087 z 28. novembra 2019, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 a geneticky modifikovanú kukuricu
    obsahujúcu kombináciu dvoch, troch, štyroch alebo piatich genetických modifikácií
    Bt11, MIR162, MIR604, 1507, 5307 a GA21, sú z nich zložené alebo vyrobené
    [oznámené pod číslom C(2019) 8428] (Iba francúzske a holandské znenie je
    autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/2087 z dne 28. novembra 2019 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo Bt11 × MIR162
    × MIR604 × 1507 × 5307 × GA21, so iz nje sestavljeni ali proizvedeni, in gensko
    spremenjeno koruzo, v kateri so združeni dva, trije, štirje ali pet od dogodkov
    Bt11, MIR162, MIR604, 1507, 5307 in GA21, v skladu z Uredbo (ES) št. 1829/2003
    Evropskega parlamenta in Sveta (notificirano pod dokumentarno številko C(2019)
    8428) (Besedilo velja za EGP) (Besedilo v francoskem in nizozemskem jeziku je
    edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/2087 de la Comisión de 28 de noviembre
    de 2019 por la que se autoriza la introducción en el mercado de los productos
    que contengan, se compongan o se hayan producido a partir de maíz modificado
    genéticamente Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21, y de maíz modificado
    genéticamente que combine dos, tres, cuatro o cinco de los eventos únicos Bt11,
    MIR162, MIR604, 1507, 5307 y GA21, de conformidad con el Reglamento (CE) n.o 1829/2003
    del Parlamento Europeo y del Consejo [notificada con el número C(2019) 8428]
    (Los textos en lenguas francesa y neerlandesa son los únicos auténticos)
  type: main
