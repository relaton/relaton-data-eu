id: EUDecision20192087
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2087 of 28 November 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 and
    genetically modified maize combining two, three, four or five of the single events
    Bt11, MIR162, MIR604, 1507, 5307 and GA21 pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2019)
    8428) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: DÉCISION D’EXÉCUTION (UE) 2019/2087 DE LA COMMISSION du 28 novembre
    2019 autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 et du maïs génétiquement
    modifié combinant deux, trois, quatre ou cinq des événements de transformation
    simples Bt11, MIR162, MIR604, 1507, 5307 et GA21, consistant en ces maïs ou produits
    à partir de ceux-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2019) 8428] (Les textes en
    langues française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2087 der Kommission vom 28. November
    2019 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 enthalten,
    aus ihm bestehen oder aus ihm hergestellt werden, und von genetisch veränderten
    Maissorten, in denen zwei, drei, vier oder fünf der Einzelereignisse Bt11, MIR162,
    MIR604, 1507, 5307 und GA21 kombiniert werden, gemäß der Verordnung (EG) Nr.
    1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen
    C(2019) 8428) (Nur der französische und der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2019/2087 на Комисията
    от 28 ноември 2019 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 и генетично
    модифицирана царевица, съвместяваща две, три,
    четири или пет от единичните събития Bt11, MIR162,
    MIR604, 1507, 5307 и GA21 в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2019) 8428) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/2087 ze dne 28. listopadu 2019
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    Bt11 × MIR162 × MIR604 × 1507 × 5307 × GA21 a geneticky modifikovanou kukuřici
    kombinující dvě, tři, čtyři nebo pět jednoduchých událostí Bt11, MIR162,
    MIR604, 1507, 5307 a GA21, sestávají z nich nebo jsou z nich vyrobeny, na trh
    podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2019) 8428) (Pouze nizozemské a francouzské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2019/2087 af 28. november
