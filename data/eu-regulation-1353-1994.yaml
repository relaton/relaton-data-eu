    a título da destilação aberta pelo Regulamento (CE) nº 344/94
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1353/94 DE LA COMISIÓN de 13 de junio de 1994 por
    el que se reducen las cantidades de vino de mesa que figuran en los contratos
    y declaraciones debidamente autorizados con arreglo a la destilación abierta
    por el Reglamento (CE) nº 344/94
  type: main
