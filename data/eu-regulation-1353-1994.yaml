  content: Commission Regulation (EC) No 1353/94 of 13 June 1994 reducing the quantities
    of table wine covered by approved contracts and declarations for distillation
    as provided for in Regulation (EC) No 344/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1353/94 de la Commission du 13 juin 1994 portant réduction
