    nelle dichiarazioni approvati a titolo della distillazione aperta dal regolamento
    (CE) n. 344/94
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1353/94 VAN DE COMMISSIE van 13 juni 1994 tot verlaging
    van de hoeveelheden tafelwijn in de contracten en aangiften die worden goedgekeurd
    in het kader van de bij Verordening (EG) nr. 344/94 geopende mogelijkheid tot
    distillatie
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1353/94 DA COMISSÃO de 13 de Junho de 1994 que reduz
