    au titre de la distillation ouverte par le règlement (CE) n 344/94
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1353/94 DER KOMMISSION vom 13. Juni 1994 zur Kürzung
    der in den für die Destillation gemäß der Verordnung (EG) Nr. 344/94 genehmigten
    Verträgen und Erklärungen angegebenen Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1353/94 af 13. juni 1994 om nedsættelse
    af de mængder bordvin, der er anført i de kontrakter og angivelser, der godkendes
    i henhold til destillationen i forordning (EF) nr. 344/94
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1353/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 13ης Ιουνίου 1994 για τη μείωση των ποσοτήτων
    επιτραπέζιου οίνου που αναφέρονται στις συμβάσεις
    και στις δηλώσεις που έχουν εγκριθεί δυνάμει
    της αποστάξεως που άρχισε με τον κανονισμό
    (ΕΚ) αριθ. 344/94
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1353/94 DELLA COMMISSIONE del 13 giugno 1994 relativo
