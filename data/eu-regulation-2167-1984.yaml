- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2167/84 of 26 July 1984 re-establishing
    the levying of customs duties on polyethylene, falling within subheading 39.02
    C I and originating in Argentina, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2167/84 de la Commission du 26 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables au polyéthylène
    de la sous-position 39.02 C I du tarif douanier commun, originaire de l' Argentine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
