title:
- language: en
  script: Latn
  content: '92/193/ECSC: Commission Decision of 23 March 1992 derogating from High
    Authority recommendation No 1/64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries (154th derogation)'
  type: main
- language: fr
  script: Latn
  content: '92/193/CECA: Décision de la Commission du 23 mars 1992 portant dérogation
    à la recommandation n° 1-64 de la Haute Autorité sur la protection tarifaire
    afin de permettre l''application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires des pays en voie de développement
    (154ème dérogation)'
  type: main
