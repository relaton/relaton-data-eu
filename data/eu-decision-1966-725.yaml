title:
- language: fr
  script: Latn
  content: '66/303/CEE: Décision du Conseil du 14 décembre 1966, modifiant la décision
    du Conseil du 5 mai 1966, relative à la définition de la notion de "produits
    originaires" et aux méthodes de coopération administrative pour l''application
    de la décision du 25 février 1964 relative à l''association des pays et territoires
    d''outre-mer à la Communauté économique européenne'
  type: main
- language: de
  script: Latn
  content: '66/725/EWG: Entscheidung des Rates vom 14. Dezember 1966 zur Änderung
    der Entscheidung des Rates vom 5. Mai 1966 über die Begriffsbestimmung für "Erzeugnisse
    mit Ursprung in ..." oder "Ursprungserzeugnisse" und über die Methoden der Zusammenarbeit
    der Verwaltungen hinsichtlich der Anwendung des Beschlusses vom 25. Februar 1964
    über die Assoziation der überseeischen Länder und Gebiete mit der Europäischen
    Wirtschaftsgemeinschaft'
  type: main
- language: it
  script: Latn
  content: '66/725/CEE: Decisione del Consiglio, del 14 dicembre 1966, che modifica
    la decisione del Consiglio, del 5 maggio 1966, relativa alla definizione della
    nozione di «prodotti originari» ed ai metodi di cooperazione amministrativa
    ai fini dell''applicazione della decisione del 25 febbraio 1964 relativa all''associazione
    dei paesi e territori d''oltremare alla Comunità Economica Europea (66/303/CEE)'
  type: main
- language: nl
  script: Latn
  content: '66/725/EEG: Beschikking van de Raad van 14 december 1966 tot wijziging
    van de beschikking van de Raad van 5 mei 1966 met betrekking tot de definitie
    van het begrip "produkten van oorsprong", alsmede met betrekking tot de methoden
    van administratieve samenwerking voor de toepassing van het besluit van 25 februari
    1964 inzake de Associatie van de Landen en Gebieden Overzee met de Europese Economische
    Gemeenschap (66/303/EEG)'
