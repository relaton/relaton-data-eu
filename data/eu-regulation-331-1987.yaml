- language: en
  script: Latn
  content: Commission Regulation (EEC) No 331/87 of 2 February 1987 amending Regulation
    (EEC) No 467/77 on the method and rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 331/87 de la Commission du 2 février 1987 modifiant
    le règlement (CEE) n° 467/77 relatif à la méthode et au taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions consistant
    en achats, stockage et écoulements
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 331/87 der Kommission vom 2. Februar 1987 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 331/87 af 2. februar 1987 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen af finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 331/87 της Επιτροπής
    της 2ας Φεβρουαρίου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 467/77 περί της μεθόδου και του επιτοκίου
    που πρέπει να εφαρμοστούν για τον υπολογισμό
    των χρηματοδοτικών εξόδων των παρεμβάσεων
    που συνίστανται σε αγορές, αποθεματοποίηση
    και διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 331/87 della Commissione del 2 febbraio 1987 recante
    modifica del regolamento (CEE) n. 467/77 che stabilisce il metodo ed il tasso
    d' interesse da utilizzare per il calcolo delle spese di finanziamento degli interventi
    costituiti da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 331/87 van de Commissie van 2 februari 1987 tot wijziging
    van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de rentevoet
    die dienen te worden toegepast bij de berekening van de financieringskosten van
    de interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 331/87 da Comissão de 2 de Fevereiro de 1987 que
