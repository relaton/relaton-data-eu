    a aplicar para o cálculo das despesas de financiamento das intervenções que
    consistem em compras, armazenamentos e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 331/87 de la Comisión de 2 de febrero de 1987 por
