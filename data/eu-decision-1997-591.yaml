    úplnost dokumentací předložených k podrobnému zkoumání s ohledem na možné
    zařazení mefenoxamu (CGA 329351), ethoxysulfuronu, famoxadonu a Ampelomyces
    quisqualis do přílohy I směrnice Rady 91/414/EHS o uvádění přípravků
    na ochranu rostlin na trh
  type: main
