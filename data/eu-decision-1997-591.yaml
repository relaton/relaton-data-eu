title:
- language: en
  script: Latn
  content: '97/591/EC: Commission Decision of 29 July 1997 recognizing in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of mefenoxam (CGA 329 351), ethoxysulfuron, famoxadone
    and ampelomyces quisqualis in Annex I of Council Directive 91/414/EEC concerning
    the placing of plant protection products on the market'
  type: main
- language: fr
  script: Latn
  content: '97/591/CE: Décision de la Commission du 29 juillet 1997 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription du méfenoxam (CGA 329 351), de l''éthoxylsulfuron, de la famoxadone
    et de l''Ampelomyces quisqualis à l''annexe I de la directive 91/414/CEE du Conseil
    concernant la mise sur le marché des produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
  content: '97/591/EG: Entscheidung der Kommission vom 29. Juli 1997 über die grundsätzliche
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Mefenoxam (CGA 329 351), Ethoxysulfuron,
    Famoxadon und Ampelomyces quisqualis in Anhang I der Richtlinie 91/414/EWG des
    Rates über das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 юли 1997 година
    относно признаване по принцип пълнотата на
