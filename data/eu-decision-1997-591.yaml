    szerek forgalomba hozataláról szóló 91/414/EGK tanácsi irányelv I. mellékletébe
    történő lehetséges felvétele céljából részletes vizsgálatra benyújtott
    dokumentációk teljességének elvi elismeréséről
  type: main
- language: it
  script: Latn
  content: '97/591/CE: Decisione della Commissione del 29 luglio 1997 che riconosce
