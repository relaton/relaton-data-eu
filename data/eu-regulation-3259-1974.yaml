title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3259/74 of the Council of 19 December 1974 amending
    Regulation (EEC) No 974/71 on certain measures of conjunctural policy to be taken
    in agriculture following the temporary widening of the margins of fluctuation
    for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3259/74 du Conseil, du 19 décembre 1974, modifiant
    le règlement (CEE) n° 974/71 relatif à certaines mesures de politique de conjoncture
    à prendre dans le secteur agricole à la suite de l' élargissement temporaire
    des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3259/74 des Rates vom 19. Dezember 1974 zur Änderung
    der Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3259/74 af 19. december 1974 om ændring
    af forordning (EØF) nr. 974/71om visse konjunkturpolitiske foranstaltninger der
    skal træffes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i enkelte medlemsstaters valutaer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3259/74 τού Συμβουλίου
    τής 19ης Δεκεμβρίου 1974 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 974/71 «περί ορισμένων μέτρων
    συγκυριακής πολιτικής πού πρέπει νά ληφθούν
    στόν γεωργικό τομέα μετά τήν προσωρινή διεύρυνση
    τών περιθωρίων διακυμάνσεως τών νομισμάτων
    ορισμένων Κρατών μελών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3259/74 del Consiglio, del 19 dicembre 1974, che modifica
    il regolamento (CEE) n. 974/71 relativo a talune misure di politica congiunturale
    da adottare nel settore agricolo in seguito all' ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3259/74 van de Raad van 19 december 1974 houdende
    wijziging van Verordening (EEG) nr. 974/71 betreffende bepaalde conjunctuurpolitieke
    maatregelen welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges
    van de valuta' s van sommige Lid-Staten dienen te worden genomen in de landbouwsector
