    certificados de importação entregues no mês de Abril de 1988 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1148/88 de la Comisión, de 28 de abril de 1988, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación, presentadas en el mes de abril de 1988 para las
    carnes de vacuno congeladas destinadas a la transformación
