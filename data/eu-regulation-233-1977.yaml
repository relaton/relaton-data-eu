title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 233/77 of 2 February 1977 re-establishing
    the levying of the customs duties on carbonates of sodium anhydrite falling within
    subheading 28.42 A ex II originating in Romania to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 233/77 de la Commission, du 2 février 1977, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 à EX II, originaire de
    la Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 233/77 der Kommission vom 2. Februar 1977 zur Wiedereinführung
    des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle 28.42 A ex II,
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 233/77 af 2. februar 1977 om genindførelse
    af opkrævning af toldafgifter for natriumcarbonat vandfri, under underposition
    28.42 A ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 233/77 della Commissione, del 2 febbraio 1977, che
    ripristina la riscossione dei dazi doganali applicabili al carbonato di sodio
    anidro della sottovoce doganale 28.42 A ex II, originario della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 233/77 van de Commissie van 2 februari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op watervrij
    natriumcarbonaat van post 28.42 A ex II, van oorsprong uit Roemenië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
