    zoonozēm un zoonožu izraisītājiem dzīvniekos un dzīvnieku izcelsmes produktos,
    lai novērstu barības izraisītu infekciju uzliesmojumus un intoksikācijas
  type: main
- language: lt
  script: Latn
  content: 1999 m. liepos 29 d. Europos Parlamento ir Tarybos direktyva 1999/72/EB,
    iš dalies keičianti Tarybos direktyvą 92/117/EEB dėl priemonių, skirtų apsisaugoti
    nuo nurodytų zoonozių ir nurodytų zoonozių sukėlėjų gyvūnuose ir gyvūninės
    kilmės produktuose, siekiant užkirsti kelią su maistu plintančioms infekcijoms
    ir apsinuodijimui
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 1999/72/KE tal-Parlament Ewropew u tal-Kunsill tad-29 ta’
    Lulju 1999 li temenda d-Direttiva 92/117/KEE tal-Kunsill li tikkonċerna l-miżuri
    għall-ħarsien kontra żonosi speċifiċi u aġenti ta’ żonosi speċifiċi
    fl-annimali u fi prodotti li joriġinaw mill-annimali sabiex jitwaqqaf it-tixrid
    ta’ l-infezzjoni u intossikazzjoni permezz ta’ l-ikel
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/72/EG van het Europees Parlement en de Raad van 29 juli
    1999 tot wijziging van Richtlijn 92/117/EEG van de Raad inzake maatregelen voor
    de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij dieren
    en in producten van dierlijke oorsprong teneinde door voedsel overgedragen infecties
    en vergiftigingen te voorkomen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 1999/72/WE Parlamentu Europejskiego i Rady z dnia 29 lipca 1999
    r. w sprawie zmiany dyrektywy Rady 92/117/EWG dotyczącej środków ochrony przed
    określonymi chorobami odzwierzęcymi i odzwierzęcymi czynnikami chorobotwórczymi
    u zwierząt i w produktach pochodzenia zwierzęcego w celu zapobieżenia zakażeniom
    i zatruciom przenoszonym przez żywność
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/72/CE do Parlamento Europeu e do Conselho de 29 de Julho
    de 1999 que altera a Directiva 92/117/CEE do Conselho relativa às medidas de
    protecção contra zoonoses e certos agentes zoonóticos em animais e produtos
    de origem animal a fim de evitar focos de infecção e de intoxicação de origem
    alimentar
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho Parlamentu a Rady 1999/72/ES z 29. júla 1999, ktorou
    sa mení a dopĺňa smernica Rady 92/117/EHS, ktorá sa týka opatrení na ochranu
    proti určitým zoonózam a určitým pôvodcom zoonóz u zvierat a vo výrobkoch
    živočíšneho pôvodu s cieľom zabrániť ohniskám infekcie a intoxikácie
    spôsobeným požívatinami
  type: main
- language: sl
  script: Latn
  content: Direktiva 1999/72/ES Evropskega parlamenta in Sveta z dne 29. julija 1999
    o spremembah Direktive 92/117/EGS o ukrepih za zaščito pred določenimi zoonozami
    ter nekaterimi povzročitelji zoonoz pri živalih in proizvodih živalskega izvora,
    zato da se preprečijo izbruhi okužb, ki se prenašajo s hrano, in zastrupitve
  type: main
- language: es
  script: Latn
  content: Directiva 1999/72/CE del Parlamento Europeo y del Consejo de 29 de julio
    de 1999 por la que se modifica la Directiva 92/117/CEE del Consejo relativa a
    las medidas de protección contra determinadas zoonosis y determinados agentes
    productores de zoonosis en animales y productos de origen animal, a fin de evitar
    el brote de infecciones e intoxicaciones procedentes de los alimentos
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och Rådets direktiv 1999/72/EG av den 29 juli 1999
    om ändring av rådets direktiv 92/117/EEG om skyddsåtgärder mot specifika zoonoser
    och zoonotiska agenser hos djur och animaliska produkter för att förhindra utbrott
    av livsmedelsburna infektioner och förgiftningar
