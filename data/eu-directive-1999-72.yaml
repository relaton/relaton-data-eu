title:
- language: en
  script: Latn
  content: Directive 1999/72/EC of the European Parliament and OF THE Council of 29
    July 1999 amending Directive 92/117/EEC of the Council concerning measures for
    protection against specified zoonoses and specific zoonotic agents in animals
    and products of animal origin in order to prevent outbreaks of food-borne infections
    and intoxications
  type: main
- language: fr
  script: Latn
  content: Directive 1999/72/CE du Parlement européen et du Conseil du 29 juillet
    1999 modifiant la directive 92/117/CEE du Conseil concernant les mesures de protection
    contre certaines zoonoses et certains agents zoonotiques chez les animaux et dans
    les produits d'origine animale, en vue de prévenir les foyers d'infection et
    d'intoxication dus à des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/72/EG des Europäischen Parlaments und des Rates vom 29.
    Juli 1999 zur Änderung der Richtlinie 92/117/EWG des Rates über Maßnahmen zum
    Schutz gegen bestimmte Zoonosen bzw. ihre Erreger bei Tieren und Erzeugnissen
    tierischen Ursprungs zur Verhütung lebensmittelbedingter Infektionen und Vergiftungen
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského Parlamentu a Rady 1999/72/ES ze dne 29. července
    1999, kterou se mění směrnice Rady 92/117/EHS o ochranných opatřeních proti
    některým zoonózám a některým původcům zoonóz u zvířat a v produktech
    živočišného původu se zaměřením na předcházení ohniskům infekce a
    otravám z potravin
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 1999/72/EF af 29. juli 1999 om
    ændring af Rådets direktiv 92/117/EØF om beskyttelsesforanstaltninger over
    for specifikke zoonoser og specifikke zoonotiske agenser hos dyr og i animalske
    produkter for at forhindre levnedsmiddelbårne infektioner og forgiftninger
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/72/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 29ης Ιουλίου 1999 για τροποποίηση
    της οδηγίας 92/117/ΕΟΚ του Συμβουλίου για τα μέτρα
    προστασίας από ορισμένες ζωονόσους και ορισμένους
    ζωονοσογόνους παράγοντες στα ζώα και στα προϊόντα
    ζωικής προέλευσης, προκειμένου να αποφευχθούν
    οι εστίες λοιμώξεων και δηλητηριάσεων που
    οφείλονται στα τρόφιμα
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 1999/72/EÜ, 29. juuli 1999, millega
    muudetakse direktiivi 92/117/EMÜ konkreetsete zoonooside ja konkreetsete zoonootilise
    toimega mõjurite vastaste kaitsemeetmete kohta loomadel ja loomsetel saadustel
    toidu kaudu saadavate nakkushaiguste ja mürgistuste vältimiseks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja Neuvoston direktiivi 1999/72/EY, annettu 29 päivänä
    heinäkuuta 1999, tiettyjä eläimissä ja eläinperäisissä tuotteissa esiintyviä
    zoonooseja ja zoonoosien aiheuttajia koskevista suojatoimenpiteistä elintarvikkeista
    aiheutuvien tartunta- ja myrkytyspesäkkeiden ehkäisemiseksi annetun neuvoston
    direktiivin 92/117/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: AZ Európai Parlament és a Tanács 1999/72/EK irányelve (1999. július
    29.) az élelmiszerből származó fertőzések és mérgezések megelőzése
    érdekében az állatokban és állati eredetű termékekben előforduló meghatározott
    zoonózisok és meghatározott zoonózis-kórokozók elleni védekezési intézkedésekről
    szóló 92/117/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/72/CE del Parlamento Europeo e del Consiglio del 29 luglio
    1999 che modifica la direttiva 92/117/CEE del Consiglio riguardante le misure
    di protezione dalle zoonosi specifiche e la lotta contro agenti zoonotici specifici
    negli animali e nei prodotti di origine animale allo scopo di evitare focolai
    di infezioni e intossicazioni alimentari
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 1999/72/EK (1999. gada 29. jūlijs),
