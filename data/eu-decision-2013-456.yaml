title:
- language: en
  script: Latn
  content: '2013/456/EU: Council Decision of 22 July 2013 amending Decision 97/836/EC
    with a view to accession by the European Community to the Agreement of the United
    Nations Economic Commission for Europe concerning the adoption of uniform technical
    prescriptions for wheeled vehicles, equipment and parts which can be fitted to
    and/or be used on wheeled vehicles and the conditions for reciprocal recognition
    of approvals granted on the basis of these prescriptions ( ‘Revised 1958 Agreement’
    )'
  type: main
- language: fr
  script: Latn
  content: '2013/456/UE: Décision du Conseil du 22 juillet 2013 modifiant la décision
    97/836/CE en vue de l’adhésion de la Communauté européenne à l’accord
    de la Commission économique pour l’Europe des Nations unies concernant l’adoption
    de prescriptions techniques uniformes applicables aux véhicules à roues, aux
    équipements et aux pièces susceptibles d’être montés ou utilisés sur un
    véhicule à roues et les conditions de reconnaissance réciproque des homologations
    délivrées conformément à ces prescriptions ( «accord révisé de 1958» )'
  type: main
- language: de
  script: Latn
  content: '2013/456/EU: Beschluss des Rates vom 22. Juli 2013 zur Änderung des Beschlusses
