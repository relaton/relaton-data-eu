title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2789/80 of 30 October 1980 re-establishing
    the levying of the customs duties on hand tools, falling within heading No 82.04
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2789/80 de la Commission, du 30 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres outils
    et outillage à main, de la position 82.04 du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2789/80 der Kommission vom 30. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für anderes Handwerkszeug der Tarifnummer 82.04 mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2789/80 af 30. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for håndværktøj og håndredskaber, under pos.
    82.04, som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2789/80 della Commissione, del 30 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri utensili e
    utensileria a mano, della voce 82.04 della tariffa doganale comune, originari
    della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2789/80 van de Commissie van 30 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander handgereedschap
    van post 82.04, van oorsprong uit China ten behoeve waarvan bij Verordening (EEG)
    nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
