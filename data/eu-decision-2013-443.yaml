title:
- language: en
  script: Latn
  content: '2013/443/EU: Commission Implementing Decision of 27 August 2013 concerning
    certain protective measures in relation to highly pathogenic avian influenza of
    subtype H7N7 in Italy including the establishment of further restricted zones
    and repealing Implementing Decision 2013/439/EU (notified under document C(2013)
    5623)'
  type: main
- language: fr
  script: Latn
  content: '2013/443/UE: Décision d’exécution de la Commission du 27 août 2013
    concernant certaines mesures de protection motivées par la détection de l’influenza
    aviaire hautement pathogène du sous-type H7N7, en Italie, dont l’établissement
    d’autres zones réglementées, et abrogeant la décision d’exécution 2013/439/UE
    [notifiée sous le numéro C(2013) 5623]'
  type: main
- language: de
  script: Latn
  content: '2013/443/EU: Durchführungsbeschluss der Kommission vom 27. August 2013
