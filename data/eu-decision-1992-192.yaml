  script: Latn
  content: '92/192/EEC: Commission Decision of 16 March 1992 amending Decision 91/642/EEC
    establishing a list of semen-collection centres in Canada approved for the export
    to the Community of deep-frozen semen of domestic animals of the bovine species'
  type: main
- language: fr
  script: Latn
  content: '92/192/CEE: Décision de la Commission du 16 mars 1992 modifiant la décision
    91/642/CEE établissant une liste de centres de collecte de sperme au Canada agréés
    pour l''exportation de sperme surgelé d''animaux domestiques de l''espèce bovine
    vers la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 16. März 1992 zur Änderung der Entscheidung
