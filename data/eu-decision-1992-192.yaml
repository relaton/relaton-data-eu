    von tiefgefrorenem Rindersperma in die Gemeinschaft zugelassenen Besamungsstationen
    in Kanada (92/192/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 16. marts 1992 om ændring af beslutning 91/642/EØF
