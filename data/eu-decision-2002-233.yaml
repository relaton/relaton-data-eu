    ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα υπό
    τον αριθμό Ε(2002) 1187]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus 2002/233/EÜ, 20. märts 2002, millega muudetakse ja parandatakse
    otsust 2002/79/EÜ Hiinast pärinevate või sealt saadetud maapähklite ja teatavate
    maapähklitoodete impordi eritingimuste kehtestamise kohta ja otsust 2002/80/EÜ
    Türgist pärinevate või sealt saadetud viigimarjade, sarapuupähklite ja pistaatsiapähklite
    ning nendest saadud teatavate toodete impordi eritingimuste kehtestamise kohta
    (teatavaks tehtud numbri K(2002) 1187 all)
  type: main
- language: fi
  script: Latn
  content: '2002/233/EY: Komission päätös, tehty 20 päivänä maaliskuuta 2002,
    Kiinasta peräisin olevien tai sieltä lähetettyjen maapähkinöiden ja tiettyjen
    niistä valmistettujen tuotteiden tuonnille määrättävistä erityisedellytyksistä
    tehdyn päätöksen 2002/79/EY muuttamisesta ja oikaisemisesta sekä Turkista
    peräisin olevien tai sieltä lähetettyjen viikunoiden, hasselpähkinöiden,
    pistaasipähkinöiden ja tiettyjen niistä valmistettujen tuotteiden tuonnille
    määrättävistä erityisedellytyksistä tehdyn päätöksen 2002/80/EY muuttamisesta
    ja oikaisemisesta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu numerolla
    K(2002) 1187)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2002. március 20.) a Kínából származó vagy
    ott feladott földimogyoró és földimogyoróból készült egyes termékek behozatalára
    vonatkozó különleges feltételek megállapításáról szóló 2002/79/EK határozat
    és a Törökországból származó vagy ott feladott füge, mogyoró és pisztácia,
    valamint az azokból készült egyes termékek behozatalára vonatkozó különleges
    feltételek megállapításáról szóló 2002/80/EK határozat módosításáról
    és helyesbítéséről (az értesítés a C(2002) 1187. számú dokumentummal
    történt)EGT vonatkozású szöveg.(2002/233/EK)
  type: main
- language: it
  script: Latn
  content: '2002/233/CE: Decisione della Commissione, del 20 marzo 2002, che modifica
    e corregge la decisione 2002/79/CE che subordina a particolari condizioni le importazioni
    di arachidi e di taluni prodotti derivati, originari o provenienti dalla Cina
    e la decisione 2002/80/CE che impone speciali condizioni all''importazione di
    fichi, nocciole e pistacchi e di taluni prodotti da essi derivati originari o
    provenienti dalla Turchia (Testo rilevante ai fini del SEE) [notificata con il
    numero C(2002) 1187]'
  type: main
- language: lv
  script: Latn
  content: Komisijas lēmums (2002. gada 20. marts), ar ko groza un labo Lēmumu 2002/79/EK,
    kas izvirza īpašus nosacījumus Ķīnas izcelsmes vai no Ķīnas sūtītu zemesriekstu
    un dažu no zemesriekstiem iegūtu produktu importam, un Lēmumu 2002/80/EK, kas
    izvirza īpašus nosacījumus Turcijas izcelsmes vai no Turcijas sūtītu vīģu,
    lazdu riekstu, pistāciju, kā arī dažu no tiem iegūtu produktu importam (izziņots
    ar dokumenta numuru C(2002) 1187)
  type: main
- language: lt
  script: Latn
  content: 2002 m. kovo 20 d. Komisijos Sprendimas iš dalies keičiantis ir pataisantis
    Sprendimą 2002/79/EB, nustatantį specialiuosius reikalavimus Kinijoje išaugintų
    arba iš jos siunčiamų žemės riešutų ir tam tikrų žemės riešutų produktų
    importui, ir Sprendimą 2002/80/EB, nustatantį specialius reikalavimus Turkijoje
    išaugintų arba iš jos siunčiamų figų, lazdynų riešutų, pistacijų ir
    tam tikrų jų produktų importui (pranešta dokumentu Nr. C (2002) 1187)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni ta' l-20 ta' Marzu 2002 li temenda u tikkoreġi
    d-Deċiżjoni 2002/79/KE li timponi kondizzjonijiet speċjali fuq l-importazzjoni
    ta' karawett u ċerti prodotti li jsiru mill-karawett li joriġinaw jew li huma
    ikkonsinnati miċ-Ċina u d-Deċiżjoni 2002/80/KE li timponi kondizzjonijiet
    speċjali fuq l-importazzjoni ta' tin, ġellewż u pistaċċi u ċerti prodotti
    li jsiru minn dawn li joriġinaw jew li huma ikkonsinnati mit-Turkija (notifikata
    bid-dokument numru K(2002) 1187)
  type: main
- language: nl
  script: Latn
  content: '2002/233/EG: Beschikking van de Commissie van 20 maart 2002 tot wĳziging
    en rectificatie van Beschikking 2002/79/EG houdende speciale voorwaarden voor
    de invoer van grondnoten en bepaalde van grondnoten afgeleide producten van oorsprong
    uit of verzonden uit China en Beschikking 2002/80/EG tot vaststelling van bĳzondere
    voorwaarden voor de invoer van vĳgen, hazelnoten, pistachenoten en bepaalde daarvan
    afgeleide producten van oorsprong uit of verzonden uit Turkĳe (Voor de EER relevante
    tekst) (kennisgeving geschied onder nummer C(2002) 1187)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 20 marca 2002 r. zmieniająca i zawierająca sprostowanie
    decyzji 2002/79/WE nakładającej specjalne warunki przywozu orzeszków ziemnych
    i niektórych produktów pochodnych pochodzących lub wysyłanych z Chin oraz
    decyzji 2002/80/WE nakładającej specjalne warunki przywozu fig, orzechów laskowych
    i pistacji oraz niektórych produktów pochodnych pochodzących lub wysyłanych
    z Turcji (notyfikowana jako dokument nr C(2002) 1187)
  type: main
- language: pt
  script: Latn
  content: '2002/233/CE: Decisão da Comissão, de 20 de Março de 2002, que altera
    e rectifica a Decisão 2002/79/CE que impõe condições especiais à importação
    de amendoins e de determinados produtos derivados do amendoim, originários ou
    provenientes da China e a Decisão 2002/80/CE que impõe condições especiais
    à importação de figos, avelãs e pistácios e de determinados produtos derivados,
    originários ou provenientes da Turquia (Texto relevante para efeitos do EEE)
    [notificada com o número C(2002) 1187]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 20. marca 2002, ktorým sa mení, dopĺňa a opravuje
    rozhodnutie 2002/79/ES, ktorým sa ukladajú osobitné podmienky pre dovoz arašidov
    a určitých výrobkov z arašidov pochádzajúcich alebo odoslaných z Číny
    a rozhodnutie 2002/80/ES, ktorým sa ukladajú osobitné podmienky pre dovoz fíg,
    lieskových orechov a pistácií, a určitých výrobkov z týchto surovín pochádzajúcich
    alebo odoslaných z Turecka (Oznámené pod číslom C(2002) 1187)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 20. marca 2002 o spremembi in popravku Odločbe
