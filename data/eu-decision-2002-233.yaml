    της απόφασης 2002/79/ΕΚ για την επιβολή ειδικών
    όρων στις εισαγωγές αραχίδας και ορισμένων
    προϊόντων που παράγονται από αραχίδες κινεζικής
    καταγωγής ή προέλευσης και της απόφασης 2002/80/ΕΚ,
    για την επιβολή ειδικών όρων στις εισαγωγές
    σύκων, φουντουκιών και φιστικιών και ορισμένων
    προϊόντων που παράγονται από αυτά, τουρκικής
