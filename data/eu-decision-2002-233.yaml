title:
- language: en
  script: Latn
  content: '2002/233/EC: Commission Decision of 20 March 2002 amending and correcting
    Decision 2002/79/EC imposing special conditions on the import of peanuts and certain
    products derived from peanuts originating in or consigned from China and Decision
    2002/80/EC imposing special conditions on the import of figs, hazelnuts and pistachios
    and certain products derived thereof originating in or consigned from Turkey (Text
    with EEA relevance) (notified under document number C(2002) 1187)'
  type: main
- language: fr
  script: Latn
  content: '2002/233/CE: Décision de la Commission du 20 mars 2002 modifiant et corrigeant
    la décision 2002/79/CE imposant des conditions particulières à l''importation
    d''arachides et de certains produits dérivés originaires ou en provenance de
    Chine et la décision 2002/80/CE imposant des conditions particulières à l''importation
    de figues, de noisettes et de pistaches et de certains produits dérivés originaires
    ou en provenance de Turquie (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2002) 1187]'
  type: main
- language: de
  script: Latn
  content: '2002/233/EG: Entscheidung der Kommission vom 20. März 2002 zur Änderung
    und Berichtigung der Entscheidung 2002/79/EG zum Erlass von Sondervorschriften
    für die Einfuhr von Erdnüssen und bestimmten hieraus hergestellten Erzeugnissen,
    deren Ursprung oder Herkunft China ist, sowie der Entscheidung 2002/80/EG zum
    Erlass von Sondervorschriften für die Einfuhr von Feigen, Haselnüssen, Pistazien
    und bestimmten hieraus hergestellten Erzeugnissen, deren Ursprung oder Herkunft
    die Türkei ist (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen
    K(2002) 1187)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 20. března 2002, kterým se mění a opravuje
    rozhodnutí 2002/79/ES, kterým se stanoví zvláštní podmínky dovozu podzemnice
    olejné a některých výrobků z podzemnice olejné, pocházejících nebo zasílaných
    z Číny, a rozhodnutí 2002/80/ES, kterým se stanoví zvláštní podmínky
    dovozu fíků, lískových ořechů a pistácií a některých výrobků z nich,
    pocházejících nebo zasílaných z Turecka (oznámeno pod číslem K(2002) 1187)
  type: main
- language: da
  script: Latn
  content: '2002/233/EF: Kommissionens beslutning af 20. marts 2002 om ændring og
    berigtigelse af beslutning 2002/79/EF om særlige betingelser for indførsel af
    jordnødder og visse afledte produkter heraf med oprindelse i eller afsendt fra
    Kina og af beslutning 2002/80/EF om særlige betingelser for import af figner,
    hasselnødder og pistacienødder og visse produkter heraf med oprindelse i eller
    afsendt fra Tyrkiet (EØS-relevant tekst) (meddelt under nummer K(2002) 1187)'
  type: main
- language: el
  script: Grek
  content: '2002/233/ΕΚ: Απόφαση της Επιτροπής, της 20ής
