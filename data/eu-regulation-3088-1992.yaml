  script: Latn
  content: Commission Regulation (EEC) No 3088/92 of 27 October 1992 re- establishing
    the levying of customs duties on products of category 97 (order No 40.0970), originating
    in the Philippines, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3088/92 de la Commission, du 27 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 97 (numéro d' ordre 40.0970) originaires des Philippines, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
