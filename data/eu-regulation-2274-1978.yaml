    bestimmter Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des
    Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2274/78 af 29. september 1978 om fastsættelse
