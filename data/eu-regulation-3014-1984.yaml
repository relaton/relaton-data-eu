- language: en
  script: Latn
  content: Council Regulation (EEC) No 3014/84 of 23 October 1984 fixing for the 1984/85
    marketing year the representative market price and the threshold price for olive
    oil and the percentages of the consumption aid to be retained in accordance with
    Article 11 (5) and (6) of Regulation No 136/66/EEC
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3014/84 du Conseil du 23 octobre 1984 fixant, pour
