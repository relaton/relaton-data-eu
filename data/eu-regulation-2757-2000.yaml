title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2757/2000 of 15 December 2000 deciding not
    to accept tenders submitted in response to the 257th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2757/2000 de la Commission du 15 décembre 2000 disposant
    de ne pas donner suite aux offres déposées à la suite de la 257e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2757/2000 der Kommission vom 15. Dezember 2000 über
    den Beschluss, den zur 257. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2757/2000 af 15. december 2000 om ikke
    at tage den 257. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2757/2000 της Επιτροπής,
    της 15ης Δεκεμβρίου 2000, για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τη 257η μερική
    δημοπρασία που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2757/2000, annettu 15 päivänä joulukuuta 2000,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun 257. osittaisen tarjouskilpailun ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2757/2000 della Commissione, del 15 dicembre 2000,
    che decide di non dar seguito alle offerte presentate per la 257a gara parziale
    effettuata nel quadro delle misure generali d'intervento conformemente al regolamento
    (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2757/2000 van de Commissie van 15 december 2000 houdende
    het besluit om geen gevolg te geven aan de offertes in het kader van de 257e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2757/2000 da Comissão, de 15 de Dezembro de 2000,
    que rejeita as propostas apresentadas na sequência do 257.° concurso parcial
    efectuado no âmbito das medidas gerais de intervenção, em conformidade com
    o Regulamento (CEE) n.° 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2757/2000 de la Comisión, de 15 de diciembre de 2000,
    por el que se decide no dar curso a las ofertas presentadas para la 257a licitación
    parcial efectuada en el marco de las medidas generales de intervención en virtud
    del Reglamento (CEE) n° 1627/89
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2757/2000 av den 15 december 2000 om
    att inte fullfölja det tvåhundrafemtiösjunde delanbudsförfarandet som inletts
    som en allmän interventionsåtgärd i enlighet med förordning (EEG) nr 1627/89
  type: main
