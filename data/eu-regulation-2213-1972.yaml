title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2213/72 de la Commission, du 18 octobre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux tapis à points noués ou enroulés, même confectionnés, de la sous-position
    tarifaire 58.01 B, originaires des pays en voie de développement, bénéficiaires
    de préférences tarifaires prévues par le règlement (CEE) n° 2799/71 du Conseil
    du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2213/72 der Kommission vom 18. Oktober 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für geknüpfte Teppiche, auch konfektioniert,
    der Tarifstelle 58.01 B. mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 2799/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2213/72 della Commissione, del 18 ottobre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    tappeti a punti annodati od arrotolati, anche confezionati, della sottovoce doganale
    n. 58.01 B, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2799/71 del Consiglio, del 20 dicembre
    1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2213/72 van de Commissie van 18 oktober 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op tapijten, geknoopt of met opgerolde polen, ook indien geconfectioneerd,
    van onderverdeling 58.01 B van oorsprong uit ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 2799/71 van de Raad van 20 december 1971 tariefpreferenties
    werden geopend
  type: main
