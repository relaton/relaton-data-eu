id: EUDecision1965344
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision 65/344/CEE du Conseil du 30 juin 1965, autorisant le Royaume
    de Belgique à suspendre totalement à l'égard des pays tiers ses droits applicables
    aux animaux vivants de l'espèce bovine, des espèces domestiques, autres, de
    la position Ex 01.02 A II, à l'exclusion des animaux d'un poids inférieur à
    220 kilogrammes et qui n'ont pas de dents de remplacement
  type: main
- language: de
  script: Latn
  content: '65/344/EWG: Entscheidung des Rates vom 30. Juni 1965 zur Ermächtigung
    des Königreichs Belgien, seine Zollsätze gegenüber Drittländern für Rinder,
    lebend, Hausrinder, andere, der Tarifnummer ex 01.02 A II - ausgenommen Tiere
    mit einem Stückgewicht von weniger als 220 Kilogramm, die noch keine zweiten
    Zähne haben - vollständig auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/344/CEE: Decisione del Consiglio, del 30 giugno 1965, con cui si autorizza
    il Regno del Belgio a sospendere totalmente nei confronti dei paesi terzi i dazi
    applicabili agli animali vivi della specie bovina, delle specie domestiche, altri,
    della voce ex 01.02 A II, esclusi gli animali di peso inferiore a 220 chilogrammi
    e che hanno ancora la dentizione di latte'
  type: main
- language: nl
  script: Latn
  content: '65/344/EEG: Beschikking van de Raad van 30 juni 1965 waarbij het Koninkrijk
    België wordt gemachtigd zijn douanerechten voor levende runderen, huisdieren,
    andere, van post ex 01.02 A II, met uitzondering van dieren die minder dan 220
    kg wegen en nog geen wisseltanden hebben, ten opzichte van derde landen volledig
    te schorsen'
  type: main
