    de Republiek Hongarije, de Tsjechische Republiek, Slowakije, Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 117/2000 da Comissão, de 19 de Janeiro de 2000,
