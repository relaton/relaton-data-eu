    τη Δημοκρατία της Ουγγαρίας, την Τσεχική Δημοκρατία,
    τη Σλοβακία, τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 117/2000, annettu 19 päivänä tammikuuta 2000,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    tammikuussa 2000 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 117/2000 della Commissione, del 19 gennaio 2000, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di gennaio 2000 per i contingenti tariffari supplementari
    di carni bovine previsti dal regolamento (CE) n. 1279/98 per la Repubblica di
    Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria
    e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 117/2000 van de Commissie van 19 januari 2000 tot
