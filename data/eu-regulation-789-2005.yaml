    (EØF) nr. 404/93 for så vidt angår reglerne om støtte til udligning af indkomsttab
    i forbindelse med markedsføring af bananer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 789/2005 της Επιτροπής,
    της 25ης Μαΐου 2005, για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1858/93 περί λεπτομερών κανόνων εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 404/93 του Συμβουλίου
