    sektoriuje pajamų netekimą taikymo taisykles
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 789/2005 van de Commissie van 25 mei 2005 tot wijziging
    van Verordening (EEG) nr. 1858/93 houdende toepassingsbepalingen van Verordening
    (EEG) nr. 404/93 van de Raad ten aanzien van de regeling inzake compenserende
    steun voor verlies aan opbrengsten uit de afzet in de sector bananen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 789/2005 z dnia 25 maja 2005 r. zmieniające
