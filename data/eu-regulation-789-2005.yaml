title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 789/2005 of 25 May 2005 amending Regulation
    (EEC) No 1858/93 laying down detailed rules for applying Council Regulation (EEC)
    No 404/93 as regards the aid scheme to compensate for loss of income from marketing
    in the banana sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 789/2005 de la Commission du 25 mai 2005 modifiant
    le règlement (CEE) n° 1858/93 établissant les modalités d'application du règlement
    (CEE) n° 404/93 du Conseil en ce qui concerne le régime d'aide compensatoire
    de perte de recettes de commercialisation dans le secteur de la banane
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 789/2005 der Kommission vom 25. Mai 2005 zur Änderung
