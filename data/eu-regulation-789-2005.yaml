    uplatňovania nariadenia Rady (EHS) č. 404/93 v súvislosti s plánom pomoci
    na kompenzáciu straty výnosov z predaja v odvetví banánov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 789/2005 z dne 25. maja 2005 o spremembi Uredbe
