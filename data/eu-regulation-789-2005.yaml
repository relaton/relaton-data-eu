    k nařízení Rady (EHS) č. 404/93, pokud jde o režim podpor na vyrovnání
    ztrát příjmů z uvedení banánů na trh
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 789/2005 af 25. maj 2005 om ændring
