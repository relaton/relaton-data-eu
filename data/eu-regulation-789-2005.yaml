    rozporządzenia Rady (EWG) nr 404/93 w odniesieniu do systemu pomocy w celu wyrównywania
    strat dochodu z wprowadzania do obrotu w sektorze bananów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 789/2005 da Comissão, de 25 de Maio de 2005, que
    altera o Regulamento (CEE) n.° 1858/93 que estabelece as normas de execução
    do Regulamento (CEE) n.° 404/93 do Conselho no que diz respeito ao regime de
    ajuda compensatória da perda de receitas de comercialização no sector das bananas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 789/2005 z 25. mája 2005, ktorým sa mení
