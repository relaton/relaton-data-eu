  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 789/2005 de la Comisión, de 25 de mayo de 2005, que
    modifica el Reglamento (CEE) n° 1858/93 por el que se establecen las disposiciones
    de aplicación del Reglamento (CEE) n° 404/93 del Consejo por lo que respecta
    al régimen de ayuda compensatoria por pérdida de ingresos de comercialización
