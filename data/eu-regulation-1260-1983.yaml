title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1260/83 of 20 May 1983 derogating from Regulation
    (EEC) No 486/80 as regards the calculation of the amount of the reduction of import
    duties for beef and veal products from the African, Caribbean and Pacific States
    for the period beginning 23 May 1983
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1260/83 de la Commission, du 20 mai 1983, portant dérogation
    au règlement (CEE) n 486/80 en ce qui concerne le calcul des montants de diminution
    des droits à l'importation de produits du secteur de la viande bovine originaires
    des États d'Afrique, des Caraïbes et du Pacifique pour la période débutant
    le 23 mai 1983
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1260/83 der Kommission vom 20. Mai 1983 zur Abweichung
    von der Verordnung (EWG) Nr. 486/80 betreffend die Berechnung der Beträge zur
    Senkung der Eingangsabgaben für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean für den am 23. Mai 1983
    beginnenden Zeitraum
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1260/83 af 20. maj 1983 om undtagelse
    fra forordning (EØF) nr. 486/80 med hensyn til beregningen af de beløb, hvormed
    importafgiften nedsættes ved indførsel af oksekød fra lande i Afrika, Vestindien
    og Stillehavet i den periode, der begynder den 23. maj 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1260/83 της Επιτροπής
    της 20ής Μαΐου 1983 περί παρεκκλίσεως από τον
    κανονισμό (ΕΟΚ) αριθ. 486/80 όσον αφορά τον υπολογισμό
    των ποσών μειώσεως των επιβαρύνσεων κατά την
    εισαγωγή προϊόντων του τομέα του βοείου κρέατος,
    καταγωγής κρατών της Αφρικής, της Καραϊβικής
    και του Ειρηνικού, για την περίοδο που αρχίζει
    στις 23 Μαΐου 1983
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1260/83 della Commissione, del 20 maggio 1983, recante
    deroga al regolamento (CEE) n. 486/80 per quanto concerne il calcolo degli importi
    di cui vengono diminuiti i diritti all'importazione di prodotti del settore delle
    carni bovine, originari degli Stati africani, dei Caraibi e del Pacifico, per
    il periodo che inizia il 23 maggio 1983
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1260/83 van de Commissie van 20 mei 1983 houdende
    afwijking van Verordening (EEG) nr. 486/80 ten aanzien van de berekening van de
    met ingang van 23 mei 1983 toe te passen vermindering van de invoerrechten van
    produkten in de sector rundvlees uit de Staten in Afrika, het Caribische gebied
    en de Stille Oceaan
