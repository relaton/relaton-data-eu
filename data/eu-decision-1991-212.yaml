    in Ireland on the improvement of the conditions under which fishery and aquaculture
    products are processed and marketed (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/212/CEE: Décision de la Commission du 11 mars 1991 concernant l''établissement
