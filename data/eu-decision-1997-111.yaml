title:
- language: en
  script: Latn
  content: '97/111/EC: Commission Decision of 22 January 1997 authorizing the Member
    States exceptionally to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of plants of Vitis L., other than fruits, originating
    in Latvia'
  type: main
- language: fr
  script: Latn
  content: '97/111/CE: Décision de la Commission du 22 janvier 1997 autorisant les
    États membres à prévoir à titre exceptionnel des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour les végétaux de Vitis
    L., à l''exception des fruits, originaires de la Lettonie'
  type: main
- language: de
  script: Latn
  content: '97/111/EG: Entscheidung der Kommission vom 22. Januar 1997 zur Ermächtigung
    der Mitgliedstaaten, für Vitis L., außer Früchten, mit Ursprung in Lettland
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '97/111/EF: Kommissionens Beslutning af 22. januar 1997 om bemyndigelse
    af medlemsstaterne til i særlige tilfaelde at indroemme undtagelser fra visse
    bestemmelser i Rådets direktiv 77/93/EØF for planter af Vitis L., dog ikke frugter,
    med oprindelse i Letland'
  type: main
- language: el
  script: Grek
  content: '97/111/ΕΚ: Απόφαση της Επιτροπής της 22ας Ιανουαρίου
    1997 που επιτρέπει στα κράτη μέλη να προβλέπουν
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου σχετικά με τα φυτά Vitis
    L., άλλα πλην των καρπών, καταγωγής Λετονίας'
  type: main
- language: fi
  script: Latn
  content: '97/111/EY: Komission päätös, tehty 22 päivänä tammikuuta 1997, luvan
    antamisesta jäsenvaltioille säätää erityistapauksissa poikkeuksia Latviasta
    peräisin olevia suvun Vitis L. kasveja, hedelmiä lukuun ottamatta, koskeviin
    neuvoston direktiivin 77/93/ETY tiettyihin säännöksiin'
  type: main
- language: it
  script: Latn
  content: '97/111/CE: Decisione della Commissione del 22 gennaio 1997 che autorizza
    gli Stati membri, in via eccezionale, a prevedere deroghe a determinate disposizioni
    della direttiva 77/93/CEE del Consiglio riguardo alle piante di Vitis L., ad eccezione
    dei frutti, originarie della Lettonia'
  type: main
- language: nl
  script: Latn
  content: '97/111/EG: Beschikking van de Commissie van 22 januari 1997 tot machtiging
    van de Lid-Staten om bij uitzondering voor planten van Vitis L., met uitzondering
    van vruchten, van oorsprong uit Letland afwijking van sommige bepalingen van Richtlijn
    77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '97/111/CE: Decisão da Comissão de 22 de Janeiro de 1997 que autoriza
    os Estados-membros a prever, a título excepcional, uma derrogação de certas
    disposições da Directiva 77/93/CEE do Conselho relativamente às plantas de
    Vitis L., com excepção dos frutos, originárias da Letónia'
  type: main
- language: es
  script: Latn
  content: '97/111/CE: Decisión de la Comisión de 22 de enero de 1997 por la que
