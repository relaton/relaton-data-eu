title:
- language: en
  script: Latn
  content: '2002/502/EC: Commission Decision of 28 July 2000 approving the Community
    Support Framework for Community structural assistance in the Border, Midland and
    Western region under Objective 1 and the Southern and Eastern region qualifying
    for transitional support under Objective 1 in Ireland (notified under document
    number C(2000) 1783)'
  type: main
- language: fr
  script: Latn
  content: '2002/502/CE: Décision de la Commission du 28 juillet 2000 portant approbation
    du cadre communautaire d''appui pour les interventions structurelles communautaires
    dans la région Border Midland and Western relevant de l''objectif n° 1 et dans
    la région Southern and Eastern bénéficiant du soutien transitoire au titre
    de l''objectif n° 1 en Irlande [notifiée sous le numéro C(2000) 1783]'
  type: main
- language: de
  script: Latn
  content: '2002/502/EG: Entscheidung der Kommission vom 28. Juli 2000 zur Genehmigung
