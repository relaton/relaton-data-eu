    der im Rahmen von Ziel 1 übergangsweise unterstützten Region South-East (Bekannt
    gegeben unter Aktenzeichen K(2000) 1783)'
  type: main
- language: da
  script: Latn
  content: '2002/502/EF: Kommissionens beslutning af 28. juli 2000 om godkendelse
