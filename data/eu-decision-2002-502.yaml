    στην περιφέρεια Border, Midland and Western η οποία υπάγεται
    στο στόχο αριθ. 1 και στην περιφέρεια Southern and
    Eastern η οποία πληροί τα κριτήρια για παροχή μεταβατικής
    στήριξης με βάση το στόχο αριθ. 1 στην Ιρλανδία
