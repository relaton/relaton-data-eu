title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1971, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les chemises d'hommes, de la position Ex 61.03 du
    Tarif douanier commun, originaires de Roumanie et mises en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/9/EWG: Entscheidung der Kommission vom 23. November 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Herrenoberhemden der Tarifnummer ex 61.03 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/9/CEE: Decisione della Commissione, del 23 novembre 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie per uomo, della voce n. ex
    61.03 della tariffa doganale comune, originarie della Romania e messe in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/9/EEG: Beschikking van de Commissie van 23 november 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd herenoverhemden van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
