title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 230/2001 of 2 February 2001 imposing a provisional
    anti-dumping duty on certain iron or steel ropes and cables originating in the
    Czech Republic, Russia, Thailand and Turkey and accepting undertakings offered
    by certain exporters in the Czech Republic and Turkey
  type: main
- language: fr
  script: Latn
