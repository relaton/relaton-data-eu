title:
- language: fr
  script: Latn
  content: Décision 66/489/CEE de la Commission, du 29 juillet 1966, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République fédérale d'Allemagne, de
    pain et de produits similaires, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '66/489/EWG: Entscheidung der Kommission vom 29. Juli 1966 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Brot und ähnlichen Erzeugnissen aus dem Königreich der Niederlande
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/489/CEE: Decisione della Commissione, del 29 luglio 1966, con cui si
    modifica nuovamente la decisione della Commissione del 6 novembre 1964, che autorizza
    la riscossione di una tassa compensativa all''importazione, nella Repubblica federale
    di Germania, di pane e prodotti analoghi provenienti dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '66/489/EEG: Beschikking van de Commissie van 29 juli 1966 tot nieuwe wijziging
    van haar beschikking van 6 november 1964 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Bondsrepubliek Duitsland van brood
    en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
