title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2049/75 of the Commission of 25 July 1975 on special
    detailed rules for the application of the system of advance fixing certificates
    for certain agricultural products exported in the form of goods not covered by
    Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2049/75 de la Commission, du 25 juillet 1975, portant
    modalités particulières d' application du régime des certificats de préfixation
    pour certains produits agricoles exportés sous forme de marchandises ne relevant
    pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2049/75 der Kommission vom 25. Juli 1975 über besondere
    Durchführungsvorschriften für Vorausfestsetzungsbescheinigungen für bestimmte
    landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2049/75 af 25. juli 1975 om de særlige
    gennemførelsesbestemmelser for ordningen med forudfastsættelsesattester for
    visse landbrugsprodukter, der udføres i form af varer, som ikke falder ind under
    bilag II til traktaten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2049/75 τής Επιτροπής
    τής 25ης Ιουλίου 1975 περί ειδικών λεπτομερειών
    εφαρμογής τού καθεστώτος τών πιστοποιητικών
    προκαθορισμού γιά ορισμένα γεωργικά προϊόντα
    εξαγόμενα υπό μορφή εμπορευμάτων πού δέν υπάγονται
    στό παράρτημα ΙΙ τής συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2049/75 della Commissione, del 25 luglio 1975, che
    stabilisce le modalità particolari di applicazione del regime dei titoli di fissazione
    anticipata per determinati prodotti agricoli esportati sotto forma di merci non
    comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2049/75 van de Commissie van 25 juli 1975 houdende
    bijzondere uitvoeringsbepalingen inzake het stelsel van voorfixatiecertificaten
    voor bepaalde landbouwprodukten die worden uitgevoerd in de vorm van goederen
    die niet onder bijlage II van het Verdrag vallen
  type: main
