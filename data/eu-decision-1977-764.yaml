title:
- language: en
  script: Latn
  content: '77/764/EEC: Commission Decision of 16 June 1977 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to drawn or blown glass falling within heading No
    ex 70.05 of the Common Customs Tariff, originating in Hungary and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '77/764/CEE: Décision de la Commission, du 16 juin 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le verre étiré ou soufflé dit "verre
    à vitres", de la position ex 70.05 du tarif douanier commun, originaire de Hongrie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '77/764/EWG: Entscheidung der Kommission vom 16. Juni 1977, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Ungarn stammendes und in den anderen Mitgliedstaaten im
    freien Verkehr befindliches gezogenes oder geblasenes Flachglas, sogenanntes ,,Tafelglas''
    '' , der Tarifnummer ex 70.05 des gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '77/764/EØF: Kommissionens Beslutning af 16. juni 1977 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage planglas, trukket eller blæst, som
    henhører under pos. ex 70.05 i den fælles toldtarif, har oprindelse i Ungarn
    og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: '77/764/CEE: Decisione della Commissione, del 16 giugno 1977, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario il vetro tirato o soffiato detto "vetro
    per vetrate" della voce ex 70.05 della tariffa doganale comune, originario dell''
    Ungheria e immesso in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '77/764/EEG: Beschikking van de Commissie van 16 juni 1977 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd getrokken of geblazen glas (zogenaamd vensterglas) van post
    ex 70.05 van het gemeenschappelijk douanetarief, van oorsprong uit Hongarije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
