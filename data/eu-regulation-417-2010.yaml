  script: Latn
  content: Commission Regulation (EU) No 417/2010 of 12 May 2010 amending for the
    127th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban
  type: main
- language: fr
  script: Latn
