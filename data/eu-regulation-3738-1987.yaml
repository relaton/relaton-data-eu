  content: Commission Regulation (EEC) No 3738/87 of 14 December 1987 re-establishing
    the levying of customs duties on butanol and isomers thereof other than normal
    butyl alcohol, falling within subheading 29.04 A III ex b), originating in Romania,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3738/87 de la Commission du 14 décembre 1987 portant
