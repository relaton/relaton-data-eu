  script: Latn
  content: Regolamento (CEE) n. 461/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai pantaloni a maglia
    non per bambini piccoli (bébés), della categoria di prodotti n. 28 (codice 0280),
    originari della Tailandia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 461/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    broeken van brei- of haakwerk, andere dan voor baby' s, van de categorie van produkten
    nr. 28 (codenummer 0280), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
