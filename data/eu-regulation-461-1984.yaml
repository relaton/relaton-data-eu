title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 461/84 of 22 February 1984 re-establishing
    the levying of customs duties on certain knitted or crocheted trousers, other
    than babies' , products of category 28 (code 0280), originating in Thailand, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 461/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    pantalons de bonneterie autres que pour bébés, de la catégorie 28 (code 0280),
    originaires de Thaïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 461/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Hosen aus Gewirken, andere als
    für Säuglinge, der Warenkategorie Nr. 28 (Kennziffer 0280), mit Ursprung in
    Thailand, dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 461/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte benklæder af trikotage, andre end
    til spædbørn, under varekategori nr. 28 (kode 0280), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3570/83
  type: main
- language: el
  script: Grek
