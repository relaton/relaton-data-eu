title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1097/79 of 1 June 1979 re-establishing the
    levying of customs duties on embroidery, in the piece, in strips or in motifs,
    falling within heading No 58.10 and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1097/79 de la Commission, du 1er juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux broderies
    en pièces, en bandes ou en motifs, de la position 58.10 du tarif douanier commun,
    originaires de l' Inde bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1097/79 der Kommission vom 1. Juni 1979 über die
    Wiedereinführung des Zollsatzes für Stickereien als Meterware oder als Motiv
    der Tarifnummer 58.10, mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1097/79 af 1. juni 1979 om genindførelse
    af opkrævning af toldafgifter for broderier, i løbende længder, strimler eller
    motiver, henhørende under pos. 58.10 i den fælles toldtarif, som har oprindelse
    i Indien og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1097/79 della Commissione, del 1° giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai ricami in pezza, in
    strisce o in motivi, della voce doganale 58.10, originari dell' India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1097/79 van de Commissie van 1 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op borduurwerk,
    aan het stuk, in banden of in de vorm van motieven, van post 58.10, van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3157/78 van de Raad
  type: main
