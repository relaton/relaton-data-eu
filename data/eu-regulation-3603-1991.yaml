title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3603/91 of 3 December 1991 amending, for the
    fourth time, Regulation (EEC) No 3926/90 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1991 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3603/91 DU CONSEIL du 3 décembre 1991 modifiant pour
    la quatrième fois le règlement (CEE) no 3926/90 fixant, pour certains stocks
    ou groupes de stocks de poissons, les totaux admissibles des captures pour 1991
    et certaines conditions dans lesquelles ils peuvent être pêchés #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3603/91 DES RATES vom 3. Dezember 1991 zur vierten
    Änderung der Verordnung (EWG) Nr. 3926/90 über die zulässigen Gesamtfangmengen
    und über Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen für
    1991 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3603/91 af 3. december 1991 om fjerde ændring
    af forordning (EØF) nr. 3926/90 om fastsættelse for 1991 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3603/91 του Συμβουλίου
    της 3ης Δεκεμβρίου 1991 για την τροποποίηση, για
    τέταρτη φορά, του κανονισμού ( ΕΟΚ ) αριθ. 3926/90
    περί καθορισμού, για ορισμένα αποθέματα ιχθύων
    ή ομάδες αποθεμάτων ιχθύων, του συνόλου των
    επιτρεπομένων αλιευμάτων για το 1991 και ορισμένων
    όρων υπό τους οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3603/91 DEL CONSIGLIO del 3 dicembre 1991 recante
    quarta modifica del regolamento (CEE) n. 3926/90 che stabilisce, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale di catture ammesse per il 1991 e talune
    condizioni cui è soggetta la pesca di detto totale #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3603/91 VAN DE RAAD van 3 december 1991 houdende
    vierde wijziging van Verordening (EEG) nr. 3926/90 inzake de vaststelling van
    de voor 1991 geldende totaal toegestane vangsten voor bepaalde visbestanden of
    groepen visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3603/91 DO CONSELHO de 3 de Dezembro de 1991 que
    altera pela quarta vez o Regulamento (CEE) no 3926/90 que fixa relativamente a
    certas unidades populacionais ou grupos de unidades populacionais de peixes, os
    totais admissíveis de capturas para 1991 e certas condições em que podem ser
    pescados #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3603/91 DEL CONSEJO de 3 de diciembre de 1991 que
    modifica por cuarta vez el Reglamento (CEE) no 3926/90 por el que se fijan, para
    determinadas poblaciones o grupos de poblaciones de peces, los totales admisibles
    de capturas para 1991 y determinadas condiciones en las que pueden pescarse #'
  type: main
