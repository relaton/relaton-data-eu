title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3170/75 of the Commission of 3 December 1975 amending
    for the seventh time Regulation (EEC) No 1090/75 on the EXIM arrangements for
    beef and veal and providing for the refusal of import licence applications lodged
    during the period 16 to 22 November 1975
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3170/75 de la Commission, du 3 décembre 1975, portant
    septième modification du règlement (CEE) n° 1090/75 concernant le régime EXIM
    dans le secteur de la viande bovine et relatif à la suite à donner aux demandes
    de certificats d'importation déposées pendant la période du 16 au 22 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3170/75 der Kommission vom 3. Dezember 1975 zur 7.
    Änderung der Verordnung (EWG) Nr. 1090/75 hinsichtlich der "EXIM"-Regelung für
    den Rindfleischsektor und betreffend die in der Zeit vom 16. bis 22. November
    1975 beantragten Einfuhrlizenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3170/75 af 3. december 1975 om syvende
    ændring af forordning (EØF) nr. 1090/75 vedrørende EXIM-ordningen i oksekødsektoren
    og særligt hvorvidt de ansøgninger om importlicens, der er indgivet i tidsrummet
    fra den 16. til den 22. november 1975, skal tages til følge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3170/75 della Commissione, del 3 dicembre 1975, recante
    settima modifica del regolamento (CEE) n. 1090/75 per quanto concerne il regime
    EXIM nel settore delle carni bovine e relativo al seguito da riservare alle domande
    di titoli d'importazione presentate tra il 16 e il 22 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3170/75 van de Commissie van 3 december 1975 houdende
    zevende wijziging van Verordening (EEG) nr. 1090/75 inzake de EXIM-regeling in
    de sector rundvlees en inzake de afhandeling van de aanvragen van invoercertificaten
    die zijn ingediend in de periode van 16 tot en met 22 november 1975
  type: main
