    der Verordnung (EG) Nr. 2151/1999 betreffend die Verhängung eines Flugverbots
    zwischen dem Gebiet der Gemeinschaft und dem Gebiet der Bundesrepublik Jugoslawien
    mit Ausnahme der Republik Montenegro und der Provinz Kosovo
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2227/2000 af 9. oktober 2000 om ophaevelse
    af forordning (EF) nr. 2151/1999 om forbud mod flyvninger mellem Faellesskabets
    område og Forbundsrepublikken Jugoslaviens område, bortset fra Republikken Montenegro
    og Kosovo-provinsen
  type: main
- language: el
  script: Grek
