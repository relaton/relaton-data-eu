    εκτός από τη Δημοκρατία του Μαυροβουνίου και
    την Επαρχία του Κοσσυφοπεδίου
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2227/2000, annettu 9 päivänä lokakuuta 2000,
    lentokiellon käyttöönottamisesta Euroopan yhteisön ja Jugoslavian liittotasavallan
    alueiden välillä Montenegron tasavaltaa ja Kosovon maakuntaa lukuun ottamatta
    annetun asetuksen (EY) N:o 2151/1999 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2227/2000 del Consiglio, del 9 ottobre 2000, che abroga
    il regolamento (CE) n. 2151/1999, che impone un divieto di volo tra i territori
    della Comunità e della Repubblica federale di Iugoslavia ad esclusione della
    Repubblica di Montenegro e della provincia del Kosovo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2227/2000 van de Raad van 9 oktober 2000 tot intrekking
    van Verordening (EG) nr. 2151/1999 houdende een verbod op vluchten tussen het
    grondgebied van de Gemeenschap en het grondgebied van de Federale Republiek Joegoslavië,
    met uitzondering van de Republiek Montenegro en de provincie Kosovo
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2227/2000 do Conselho, de 9 de Outubro de 2000, que
    revoga o Regulamento (CE) n.° 2151/1999 relativo à proibição de voos entre
    os territórios da Comunidade e da República Federativa da Jugoslávia, com excepção
    da República do Montenegro e da província do Kosovo
  type: main
- language: es
  script: Latn
