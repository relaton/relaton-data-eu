title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2227/2000 of 9 October 2000 repealing Regulation
    (EC) No 2151/1999 imposing a ban on flights between the territories of the Community
    and the Federal Republic of Yugoslavia other than the Republic of Montenegro or
    the Province of Kosovo
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2227/2000 du Conseil du 9 octobre 2000 abrogeant le
    règlement (CE) n° 2151/1999 concernant l'interdiction des vols entre les territoires
    de la Communauté et de la République fédérale de Yougoslavie, à l'exception
    de la République du Monténégro et de la Province du Kosovo
  type: main
- language: de
  script: Latn
