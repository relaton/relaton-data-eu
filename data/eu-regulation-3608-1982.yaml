  content: Commission Regulation (EEC) No 3608/82 of 23 December 1982 derogating in
    respect of the countries of the Central American Common Market from Articles 1,
    6 and 12 of Regulation (EEC) No 3606/82 on the definition of the concept of originating
    products for purposes of the application of tariff preferences granted by the
    European Economic Community in respect of certain products from developing countriesc
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3608/82 de la Commission, du 23 décembre 1982, portant
    dérogation, pour les pays du Marché commun de l' Amérique centrale (MCAC),
    aux articles 1er, 6 et 12 du règlement (CEE) n° 3606/82 relatif à la définition
    de la notion de produits originaires pour l' application de préférences tarifaires
    accordées par la Communauté économique européenne à certains produits de
    pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3608/82 der Kommission vom 23. Dezember 1982 über
    die zugunsten der Länder des gemeinsamen Marktes von Mittelamerika vorgesehene
    Abweichung von den Artikeln 1, 6 und 12 der Verordnung (EWG) Nr. 3606/82 über
    die Begriffsbestimmung des Warenursprungs bei der Anwendung der von der Europäischen
    Wirtschaftsgemeinschaft für bestimmte Waren aus Entwicklungsländern gewährten
    Zollpräferenzen
  type: main
- language: da
