title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2974/78 of 15 December 1978 re-establishing
    the levying of customs duties on woven fabrics of sheep' s or lambs' wool or of
    fine animal hair, falling within heading No 53.11 and originating in Argentina,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2974/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    laine ou de poils fins, de la position tarifaire 53.11, originaires d' Argentine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    1197/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2974/78 der Kommission vom 15. Dezember 1978 über
    die Wiedereinführung des Zollsatzes für Gewebe aus Wolle oder feinen Tierhaaren,
    der Tarifnummer 53.11, mit Ursprung in Argentinien, dem die in der Verordnung
    (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2974/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af uld eller fine dyrehår, under
    position 53.11, som har oprindelse i Argentina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2974/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di lana o di
    peli fini, della voce doganale 53.11, originari dell' Argentina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2974/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van wol, of van fijn haar, van post 53.11, van oorsprong uit Argentinië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 1197/78
    van de Raad
  type: main
