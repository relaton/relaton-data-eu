id: EURegulation1632002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 163/2002 of 28 January 2002 extending the definitive
    anti-dumping duty imposed by Regulation (EC) No 368/98 on imports of glyphosate
    originating in the People's Republic of China to imports of glyphosate consigned
    from Malaysia or Taiwan, whether declared as originating in Malaysia or Taiwan
    or not, and terminating the investigation in respect of imports from one Malaysian
    and one Taiwanese exporting producer
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 163/2002 du Conseil du 28 janvier 2002 portant extension
    du droit antidumping définitif institué par le règlement (CE) n° 368/98 sur
    les importations de glyphosate originaire de la République populaire de Chine
    aux importations de glyphosate expédié de Malaisie ou de Taïwan, qu'il ait
    ou non été déclaré originaire de Malaisie ou de Taïwan, et clôturant l'enquête
    concernant un producteur-exportateur malaisien et un producteur-exportateur taïwanais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 163/2002 des Rates vom 28. Januar 2002 zur Ausweitung
    des mit der Verordnung (EG) Nr. 368/98 auf die Einfuhren von Glyphosat mit Ursprung
    in der Volksrepublik China eingeführten endgültigen Antidumpingzolls auf die
    Einfuhren von aus Malaysia und Taiwan versandtem Glyphosat, als Ursprungserzeugnis
    Malaysias bzw. Taiwans angemeldet oder nicht, und zur Einstellung der Untersuchung
    gegenüber den Einfuhren der Ware von einem malaysischen und einem taiwanischen
    herstellenden Ausführer
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 163/2002 af 28. januar 2002 om udvidelse af
    den endelige antidumpingtold, der indførtes ved forordning (EF) nr. 368/98 på
    importen af glyphosat med oprindelse i Folkerepublikken Kina, til også at omfatte
    importen af glyphosat afsendt fra Malaysia eller Taiwan, uanset om de er angivet
    med oprindelse i Malaysia eller Taiwan eller ej, og om afslutning af undersøgelsen
    vedrørende importen fra en malaysisk og en taiwansk eksporterende producent
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 163/2002 του Συμβουλίου,
    της 28ης Ιανουαρίου 2002, για την επέκταση του
    οριστικού δασμού αντιντάμπινγκ που έχει επιβληθεί
    με τον κανονισμό (ΕΚ) αριθ. 368/98 στις εισαγωγές
    του προϊόντος glyphosate, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, στις εισαγωγές του προϊόντος glyphosate
    που αποστέλλεται από τη Μαλαισία ή την Ταϊβάν,
    είτε έχει δηλωθεί ως καταγωγής Μαλαισίας ή
    Ταϊβάν είτε όχι, και για την περάτωση της έρευνας
    όσον αφορά τις εισαγωγές από έναν παραγωγό-εξαγωγέα
    της Μαλαισίας και έναν παραγωγό-εξαγωγέα της
    Ταϊβάν
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 163/2002, annettu 28 päivänä tammikuuta 2002,
    Kiinan kansantasavallasta peräisin olevan glyfosaatin tuonnissa asetuksella (EY)
    N:o 368/98 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta koskemaan
    Malesiasta tai Taiwanista tapahtuvaa glyfosaatin tuontia, riippumatta siitä,
    onko se ilmoitettu tullille Malesiasta tai Taiwanista peräisin olevana, sekä
    yhtä malesialaista ja yhtä taiwanilaista vientiä harjoittavaa tuottajaa koskevan
    tutkimuksen päättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 163/2002 del Consiglio, del 28 gennaio 2002, che estende
    il dazio antidumping definitivo istituito dal regolamento (CE) n. 368/98 sulle
    importazioni di glifosato originario della Repubblica popolare cinese alle importazioni
    di glifosato spedito dalla Malaysia o da Taiwan, indipendentemente dal fatto che
    sia dichiarato originario della Malaysia o di Taiwan o meno, e chiude l'inchiesta
    in merito alle importazioni da un produttore esportatore malese e da uno taiwanese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 163/2002 van de Raad van 28 januari 2002 tot uitbreiding
    van het definitief antidumpingrecht dat werd ingesteld bĳ Verordening (EG) nr.
    368/98 op de invoer van glyfosaat van oorsprong uit de Volksrepubliek China tot
    de invoer van glyfosaat verzonden uit Maleisië of Taiwan, al dan niet aangegeven
    als van oorsprong uit Maleisië of Taiwan en tot beëindiging van het onderzoek
    ten aanzien van de invoer van een Maleisische en een Taiwanese exporterende producent
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 163/2002 do Conselho, de 28 de Janeiro de 2002, que
    torna extensivo o direito anti-dumping definitivo instituído pelo Regulamento
    (CE) n.° 368/98 sobre as importações de glifosato, originário da República
    Popular da China, às importações de glifosato, expedido da Malásia ou de Taiwan,
    quer seja ou não declarado originário de Taiwan ou da Malásia, e que encerra
    o inquérito no que se refere às importações provenientes de um produtor-exportador
    da Malásia e de um produtor-exportador de Taiwan
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 163/2002 del Consejo, de 28 de enero de 2002, por el
    que se amplía el derecho antidumping definitivo impuesto por el Reglamento (CE)
    n° 368/98 sobre las importaciones de glifosato originario de la República Popular
    de China a las importaciones de glifosato consignado desde Malasia o Taiwán,
    tanto si se declara originario de Malasia o Taiwán como si no, y se da por concluida
    la investigación por lo que se refiere a las importaciones de un productor exportador
    malasio y otro taiwanés
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 163/2002 av den 28 januari 2002 om utvidgning
    av den slutgiltiga antidumpningstull som införts genom förordning (EG) nr 368/98
    beträffande import av glyfosat med ursprung i Folkrepubliken Kina till att även
    omfatta import av glyfosat som sänds från Malaysia eller Taiwan, oavsett om
    importen deklarerats ha ursprung i Malaysia eller Taiwan, samt om avslutande av
    undersökningen rörande import från en malaysisk och en taiwanesisk exporterande
    tillverkare
  type: main
