  content: Commission Regulation (EEC) No 3008/78 of 20 December 1978 introducing
    a countervailing charge on mandarins (including tangerines and satsumas), clementines,
    wilkings and other similar citrus hybrids originating in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3008/78 de la Commission, du 20 décembre 1978, instituant
    une taxe compensatoire à l'importation de mandarines, y compris tangerines et
    satsumas, clémentines, wilkings et autres hybrides similaires d'agrumes originaires
    d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3008/78 der Kommission vom 20. Dezember 1978 zur Einführung
    einer Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Clementinen, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten,
    mit Ursprung in Algerien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3008/78 af 20. december 1978 om opkrævning
