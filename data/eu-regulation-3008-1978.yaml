  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3008/78 della Commissione, del 20 dicembre 1978, che
    istituisce una tassa di compensazione all'importazione di mandarini, compresi
    i tangerini e i mandarini satsuma (o sazuma), clementine, wilkings e altri ibridi
    simili di agrumi originari dell'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3008/78 van de Commissie van 20 december 1978 houdende
    instelling van een compenserende heffing bij invoer van mandarijnen, tangerines
    en satsuma's daaronder begrepen, clementines, wilkings en andere dergelijke kruisingen
    van citrusvruchten van oorsprong uit Algerië
