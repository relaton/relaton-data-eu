  script: Latn
  content: Commission Delegated Regulation (EU) 2025/65 of 31 October 2024 amending
    Delegated Regulation (EU) 2019/2123 as regards the conditions under which a separate
    Common Health Entry Document is submitted for consignments leaving a border control
    post for a control point where identity and physical checks are to be performed
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/65 de la Commission du 31 octobre 2024
    modifiant le règlement délégué (UE) 2019/2123 en ce qui concerne les conditions
    dans lesquelles un document sanitaire commun d’entrée distinct est présenté
    pour les envois quittant un poste de contrôle frontalier pour un point de contrôle
    où des contrôles d’identité et des contrôles physiques doivent être effectués
  type: main
- language: de
  script: Latn
