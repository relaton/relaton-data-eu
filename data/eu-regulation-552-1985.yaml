title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 552/85 of 1 March 1985 laying down detailed
    rules for the application in the beef and veal sector of Regulation (EEC) No 486/85
    on the arrangements applicable to agricultural products and certain goods resulting
    from the processing of agricultural products originating in the African, Caribbean
    and Pacific States or in the overseas countries and territories, and amending
    Regulation (EEC) No 2377/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 552/85 de la Commission du 1er mars 1985 fixant les
    modalités d' application dans le secteur de la viande bovine du règlement (CEE)
    no 486/85 relatif au régime applicable à des produits agricoles et à certaines
    marchandises résultant de la transformation de produits agricoles originaires
    des États d' Afrique, des Caraïbes et du Pacifique ou des pays et territoires
    d' outre-mer, et modifiant le règlement (CEE) no 2377/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 552/85 der Kommission vom 1. März 1985 zur Festlegung
    der Durchführungsbestimmungen im Sektor Rindfleisch zu der Verordnung (EWG) Nr.
    486/85 über die Regelung für landwirtschaftliche Erzeugnisse und bestimmte aus
    landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean sowie in den überseeischen
    Ländern und Gebieten und zur Änderung der Verordnung (EWG) Nr. 2377/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 552/85 af 1. marts 1985 om fastsættelse
    af gennemførelsesbestemmelser til forordning (EØF) nr. 486/85 om den ordning,
    der skal gælde for landbrugsprodukter og visse varer fremstiller af landbrugsprodukter
    med oprindelse i Afrika, Vestindien og Stillehavet eller i de oversøiske lande
    og territorier og om ændring af forordning (EØF) nr. 2377/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 552/85 της Επιτροπής
    της 1ης Μαρτίου 1985 για τον καθορισμό των λεπτομερειών
    εφαρμογής στον τομέα του βοείου κρέατος του
    κανονισμού (ΕΟΚ) αριθ. 486/85 σχετικά με το καθεστώς
    που εφαρμόζεται στα γεωργικά προϊόντα και
    σε ορισμένα εμπορεύματα που προέρχονται από
    τη μεταποίηση γεωργικών προϊόντων προέλευσης
    κρατών Αφρικής, Καραϊβικής και Ειρηνικού ή
    υπερποντίων χωρών και εδαφών και για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 2377/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 552/85 della Commissione del 1o marzo 1985 che fissa
    le modalità d' applicazione, nel settore delle carni bovine, del regolamento
    (CEE) n. 486/85 relativo al regime applicabile a taluni prodotti agricoli e a
    talune merci risultanti dalla trasformazione di prodotti agricoli originari degli
    stati dell' Africa, dei Caraibi e del Pacifico o dei paesi e territori d' oltremare,
    e modifica il regolamento (CEE) n. 2377/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 552/85 van de Commissie van 1 maart 1985 tot vaststelling
    van uitvoeringsbepalingen in de sector rundvlees van Verordening (EEG) nr. 486/85
    inzake de regeling voor landbouwprodukten en bepaalde door verwerking van landbouwprodukten
    verkregen goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied
    en de Stille Oceaan of uit de landen en gebieden overzee, en tot wijziging van
    Verordening (EEG) nr. 2377/80
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 552/85 da Comissão, de 1 de Março de 1985, que
    fixa as modalidades de aplicação no sector da carne de bovino do Regulamento
    (CEE) n.° 486/85 relativo ao regime aplicável a produtos agrícolas e a certas
    mercadorias resultantes da transformação de produtos agrícolas originários
    dos Estados de África, das Caraíbas e do Pacífico ou das regiões e territórios
    ultramarinos e que altera o Regulamento (CEE) n.° 2377/80
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 552/85 de la Comisión, de 1 de marzo de 1985, por
    el que se fijan las modalidades de aplicación en el sector de la carne de vacuno
    del Reglamento (CEE) n° 486/85 relativo al régimen aplicable a los productos
    agrícolas y a determinadas mercancías resultantes de la transformación de productos
    agrícolas originarios de los Estados de África, del Caribe y del Pacífico o
    de los países y territorios de ultramar, y por el que se modifica el Reglamento
    (CEE) n° 2377/80
  type: main
