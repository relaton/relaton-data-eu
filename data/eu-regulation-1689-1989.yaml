    εισφοράς κατά την εισαγωγή ροδακίνων, συμπεριλαμβανομένων
    και των ροδακίνων υπό την ονομασία brugnons και
    nectarines καταγωγής Ισπανίας (εκτός των Καναρίων
    Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1689/89 della Commissione, del 14 giugno 1989, che
    istituisce una tassa di compensazione all'importazione di pesche, comprese le
    pesche noci e le nettarine originarie della Spagna (escluso le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1689/89 van de Commissie van 14 juni 1989 houdende
    instelling van een compenserende heffing bij invoer van perziken, nectarines daaronder
    begrepen, van oorsprong uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1689/89 da Comissão, de 14 de Junho de 1989, que
    institui uma taxa compensatória na importação de pêssegos, compreendendo os
    pêssegos-carecas e as nectarinas originários de Espanha (excepto as ilhas Canárias)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1689/89 de la Comisión, de 14 de junio de 1989, por
    el que se establece un gravamen compensatorio a la importación de melocotones,
    incluidos los griñones y las nectarinas, originarios de España (excepto las
    Islas Canarias)
