title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1689/89 of 14 June 1989 introducing a countervailing
    charge on peaches including nectarines originating in Spain (except the Canary
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1689/89 de la Commission, du 14 juin 1989, instituant
    une taxe compensatoire à l'importation de pêches, y compris les brugnons et
    les nectarines originaires d'Espagne (excepté les îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1689/89 der Kommission vom 14. Juni 1989 zur Einführung
    einer Ausgleichsabgabe auf die Einfuhr von Pfirsichen, einschließlich Brugnolen
    und Nektarinen, mit Ursprung in Spanien (ausgenommen den Kanarischen Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1689/89 af 14. juni 1989 om opkrævning
    af en udligningsafgift ved indførsel af ferskner, herunder blodferskner og nektariner
    med oprindelse i Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1689/89 της Επιτροπής
