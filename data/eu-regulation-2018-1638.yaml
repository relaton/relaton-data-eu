    no que diz respeito às normas técnicas de regulamentação que especificam as
    formas como deverá ser assegurada a adequação e a verificabilidade dos dados
    de cálculo, assim como os procedimentos internos de supervisão e verificação
    dos fornecedores que o administrador de um índice de referência de importância
    crítica ou significativa deve assegurar quando os dados de cálculo provêm de
    uma função operativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2018/1638 al Comisiei din 13 iulie 2018 de completare
    a Regulamentului (UE) 2016/1011 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează în detaliu
    modalitățile prin care să se asigure caracterul adecvat și verificabil al
    datelor de intrare, precum și procedurile interne de supraveghere și verificare
    pe care administratorul unui indice de referință critic sau semnificativ trebuie
    să se asigure că le instituie un contribuitor în cazul în care datele de intrare
    sunt furnizate de o funcție de front office
  type: main
