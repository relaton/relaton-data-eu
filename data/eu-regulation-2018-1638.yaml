    Consejo en lo que respecta a las normas técnicas de regulación destinadas a
    especificar la manera de garantizar que los datos de cálculo sean adecuados y
    verificables, así como los procedimientos internos de vigilancia y verificación
    de los contribuidores de cuyo establecimiento deberán asegurarse los administradores
    de índices de referencia cruciales o significativos cuando los datos de cálculo
    los aporte una función operativa
  type: main
