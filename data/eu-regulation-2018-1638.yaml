    med avseende på tekniska tillsynsstandarder som ytterligare specificerar hur
    dataunderlagets lämplighet och verifierbarhet ska säkerställas, samt de interna
    övervaknings- och verifieringsförfaranden som en administratör av ett kritiskt
    eller signifikant referensvärde ska säkerställa har inrättats av en rapportör
    när dataunderlaget rapporteras från en front office-funktion
