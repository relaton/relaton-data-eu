title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/1638 of 13 July 2018 supplementing
    Regulation (EU) 2016/1011 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying further how to ensure that input
    data is appropriate and verifiable, and the internal oversight and verification
    procedures of a contributor that the administrator of a critical or significant
    benchmark has to ensure are in place where the input data is contributed from
    a front office function
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/1638 de la Commission du 13 juillet 2018
    complétant le règlement (UE) 2016/1011 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant comment garantir que les
    données sous-jacentes sont appropriées et vérifiables et précisant les procédures
    internes de supervision et de vérification dont l'administrateur d'un indice
    de référence d'importance critique ou significative doit vérifier la mise en
    place chez un contributeur lorsque les données sous-jacentes sont fournies par
    une fonction de salle des marchés
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/1638 der Kommission vom 13. Juli 2018 zur
    Ergänzung der Verordnung (EU) 2016/1011 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards, in denen weiter ausgeführt wird,
    wie die Eignung und Nachprüfbarkeit von Eingabedaten zu gewährleisten ist, und
    welche internen Aufsichts- und Verifizierungsverfahren der Administrator eines
    kritischen oder signifikanten Referenzwerts bei einem Kontributor für den Fall
    sicherzustellen hat, dass Eingabedaten von einem Frontoffice oder einer Frontoffice-Funktion
    bereitgestellt werden
  type: main
