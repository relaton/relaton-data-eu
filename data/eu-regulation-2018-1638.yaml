    ide o regulačné technické predpisy, v ktorých sa bližšie určuje, ako zabezpečiť,
    aby boli vstupné údaje primerané a overiteľné, a vnútorné postupy dohľadu
    a overovania prispievateľa, ktorých zavedenie musí správca kritickej alebo
