title:
- language: en
  script: Latn
  content: Commission Decision of 30 October 1968 relating to the exclusion from Community
    treatment by the Benelux countries under the first paragraph of Article 15 of
    the Treaty of certain paving and tiles originating in Japan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 octobre 1968, relative au recours des
    pays du Benelux à l'article 115 alinéa 1 du Traité pour exclure du traitement
    communautaire certains carreaux de pavement ou de revêtement originaires du Japon
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '68/397/EWG: Entscheidung der Kommission vom 30. Oktober 1968 betreffend
    die Inanspruchnahme von Artikel 115 Absatz 1 des Vertrages durch die Benelux-Länder,
    um bestimmte Boden- und Wandplatten mit Ursprung in Japan, die sich in anderen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 30. oktober 1968 om Benelux-landenes påberåbelse
    af traktatens artikel 115, stk. 1, for at udelukke visse glaserede sten og fliser
    til gulvbelægning eller beklædning af vægge, der har oprindelse i Japan og
    er frit omsættelige i de andre medlemsstater, fra fællesskabsbehandling
  type: main
- language: it
  script: Latn
  content: '68/397/CEE: Decisione della Commissione, del 30 ottobre 1968, relativa
    al ricorso da parte dei paesi del Benelux all''articolo 115, comma 1, del trattato
    per escludere dal trattamento comunitario talune piastrelle da pavimentazione
    o da rivestimento originarie del Giappone e immesse in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/397/EEG: Beschikking van de Commissie van 30 oktober 1968 betreffende
    het verzoek van de Benelux-landen om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige vloer- en wandtegels, van oorsprong uit Japan en in de
    andere Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
