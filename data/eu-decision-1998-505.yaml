title:
- language: en
  script: Latn
  content: '98/505/EC: Commission Decision of 27 July 1998 amending Decision 98/372/EC
    concerning animal health conditions and veterinary certification for imports of
    live animals of bovine and porcine species from certain European countries to
    take into account some aspects in relation to Croatia and the Czech Republic (notified
    under document number C(1998) 2239)'
  type: main
- language: fr
  script: Latn
  content: '98/505/CE: Décision de la Commission du 27 juillet 1998 modifiant la
    décision 98/372/CE concernant les conditions de police sanitaire et les certificats
    sanitaires requis à l''importation d''animaux vivants des espèces bovine et
    porcine en provenance de certains pays européens, afin de prendre en compte certains
    aspects relatifs à la Croatie et à la République tchèque [notifiée sous le
    numéro C(1998) 2239]'
  type: main
- language: de
  script: Latn
  content: '98/505/EG: Entscheidung der Kommission vom 27. Juli 1998 zur Änderung
    der Entscheidung 98/372/EG zur Festlegung der Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von lebenden Rindern und Schweinen aus bestimmten europäischen
    Ländern unter Berücksichtigung bestimmter Aspekte in bezug auf Kroatien und
    die Tschechische Republik (Bekanntgegeben unter Aktenzeichen K(1998) 2239)'
  type: main
- language: da
  script: Latn
  content: '98/505/EF: Kommissionens beslutning af 27. juli 1998 om ændring af beslutning
    98/372/EF om dyresundhedsbetingelser og udstedelse af sundhedscertifikat ved indførsel
    af kvæg og svin fra visse europæiske lande for at tage hensyn til nogle aspekter,
    hvad angår Kroatien og Tjekkiet (meddelt under nummer K(1998) 2239)'
  type: main
- language: el
  script: Grek
  content: '98/505/ΕΚ: Απόφαση της Επιτροπής της 27ης Ιουλίου
    1998 για τροποποίηση της απόφασης 98/372/ΕΚ σχετικά
    με τους υγειονομικούς όρους και την κτηνιατρική
    πιστοποίηση για τις εισαγωγές ζώντων βοοειδών
    και χοιροειδών από ορισμένες ευρωπαϊκές χώρες
    ώστε να ληφθούν υπόψη ορισμένα θέματα που αφορούν
    την Κροατία και τη Δημοκρατία της Τσεχίας [κοινοποιηθείσα
    υπό τον αριθμό Ε(1998) 2239]'
  type: main
- language: fi
  script: Latn
  content: '98/505/EY: Komission päätös, tehty 27 päivänä heinäkuuta 1998,
    eläinten terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista
    elävien naudan- ja siansukuisten eläinten tuonnissa eräistä Euroopan maista
    tehdyn komission päätöksen 98/372/EY muuttamisesta joidenkin Kroatiaa ja Tsekkiä
    koskevien seikkojen huomioon ottamiseksi (tiedoksiannettu numerolla K(1998) 2239)'
  type: main
- language: it
  script: Latn
  content: '98/505/CE: Decisione della Commissione del 27 luglio 1998 che modifica
    la decisione 98/372/CE, relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l''importazione di animali vivi
    delle specie bovina e suina provenienti da alcuni paesi europei, in considerazione
    di alcuni aspetti riguardanti la Croazia e la Repubblica ceca [notificata con
    il numero C(1998) 2239]'
  type: main
- language: nl
  script: Latn
  content: '98/505/EG: Beschikking van de Commissie van 27 juli 1998 houdende wijziging
    van Beschikking 98/372/EG betreffende de veterinairrechtelijke voorschriften en
    de voorschriften inzake veterinaire certificering voor de invoer van levende runderen
    en levende varkens uit bepaalde Europese landen, teneinde rekening te houden met
