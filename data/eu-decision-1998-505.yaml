    98/372/EG om djurhälsovillkor och utfärdande av veterinärintyg för import
    av levande nötkreatur och svin från vissa europeiska länder för att ta hänsyn
    till några aspekter angående Kroatien och Tjeckien [delgivet med nr K(1998)
    2239]'
