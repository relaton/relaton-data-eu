    onder nummer C(1998) 2239)'
  type: main
- language: pt
  script: Latn
  content: '98/505/CE: Decisão da Comissão de 27 de Julho de 1998 que altera a Decisão
    98/372/CE relativa às condições sanitárias e à certificação veterinária
    exigidas para a importação de bovinos e suínos domésticos provenientes de
    determinados países europeus para ter em conta certos aspectos relacionados com
