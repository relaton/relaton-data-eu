    per taluni prodotti del settore delle carni suine per il periodo dal 1° aprile
    al 30 giugno 2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 507/2003 van de Commissie van 20 maart 2003 tot vaststelling
