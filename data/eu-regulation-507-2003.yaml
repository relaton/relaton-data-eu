title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 507/2003 of 20 March 2003 determining the
    extent to which applications lodged in March 2003 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 April to 30 June 2003 can be accepted
  type: main
- language: fr
  script: Latn
