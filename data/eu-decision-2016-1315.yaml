    Fællesskaber og deres medlemsstater på den ene side og Det Hashemitiske Kongerige
    Jordan på den anden side for så vidt angår en midlertidig ændring til aftalens
    protokol 3 om definition af begrebet »produkter med oprindelsesstatus« og metoderne
    for administrativt samarbejde som en reaktion til støtte for flygtningene på
