    dohodou zakládající přidružení mezi Evropskými společenstvími a jejich
    členskými státy na jedné straně a Jordánským hášimovským královstvím
    na straně druhé, pokud jde o dočasnou změnu protokolu č. 3 k uvedené dohodě
    o definici pojmu „původní produkty“ a metodách správní spolupráce v
    reakci napomáhající uprchlíkům před konfliktem v Sýrii
  type: main
