  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2016/1315 van de Raad van 18 juli 2016 betreffende het namens
    de Europese Unie in te nemen standpunt in het Associatiecomité dat is opgericht
    bij de Europees-mediterrane overeenkomst waarbij een associatie tot stand wordt
    gebracht tussen de Europese Gemeenschappen en hun lidstaten, enerzijds, en het
    Hasjemitisch Koninkrijk Jordanië, anderzijds, over een tijdelijke wijziging van
    Protocol nr. 3 bij deze overeenkomst betreffende de definitie van het begrip „producten
    van oorsprong” en methoden van administratieve samenwerking als respons ten
    gunste van de personen die het conflict in Syrië ontvluchten
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2016/1315 z dnia 18 lipca 2016 r. w sprawie stanowiska,
