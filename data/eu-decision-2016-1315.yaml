title:
- language: en
  script: Latn
  content: Council Decision (EU) 2016/1315 of 18 July 2016 on the position to be adopted,
    on behalf of the European Union, within the Association Committee established
    by the Euro-Mediterranean Agreement establishing an Association between the European
    Communities and their Member States, of the one part, and the Hashemite Kingdom
    of Jordan, of the other part, as regards a temporary amendment to Protocol 3 to
    that Agreement concerning the definition of the concept of ‘originating products’
    and methods of administrative cooperation as a response in favour of the refugees
    fleeing the conflict in Syria
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/1315 du Conseil du 18 juillet 2016 relative à la position
    à prendre, au nom de l'Union européenne, au sein du comité d'association institué
    par l'accord euro-méditerranéen établissant une association entre les Communautés
    européennes et leurs États membres, d'une part, et le Royaume hachémite de
    Jordanie, d'autre part, concernant une modification temporaire du protocole 3
    audit accord relatif à la définition de la notion de «produits originaires»
    et aux méthodes de coopération administrative comme réponse en faveur des réfugiés
    fuyant le conflit en Syrie
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/1315 des Rates vom 18. Juli 2016 über den im Namen
    der Europäischen Union im Assoziationsausschuss, der mit dem Europa-Mittelmeer-Abkommen
    zur Gründung einer Assoziation zwischen der Europäischen Gemeinschaft und ihren
    Mitgliedstaaten einerseits und dem Haschemitischen Königreich Jordanien andererseits
    eingesetzt wurde, in Bezug auf eine vorübergehende Änderung des Protokolls Nr.
    3 zu dem genannten Abkommen über die Bestimmung des Begriffs „Erzeugnisse mit
    Ursprung in“ oder „Ursprungserzeugnisse“ und die Methoden der Zusammenarbeit
    der Verwaltungen als Reaktion zugunsten der vor dem Konflikt in Syrien flüchtenden
    Flüchtlinge zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2016/1315 на Съвета от 18 юли 2016 година
    относно позицията, която трябва да бъде заета
    от името на Европейския съюз в рамките на Съвета
    за асоцииране, създаден с Евро-средиземноморското
    споразумение за асоцииране между Европейските
    общности и техните държави членки, от една
    страна, и Хашемитско кралство Йордания, от
