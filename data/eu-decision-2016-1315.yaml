    ustanowionego na mocy Układu eurośródziemnomorskiego ustanawiającego stowarzyszenie
    między Wspólnotami Europejskimi i ich państwami członkowskimi, z jednej strony,
    a Jordańskim Królestwem Haszymidzkim, z drugiej strony, w odniesieniu do tymczasowej
    zmiany protokołu 3 do tego układu, dotyczącego definicji pojęcia „produkty
    pochodzące” oraz metod współpracy administracyjnej, będącej odpowiedzią
    na rzecz uchodźców uciekających przed konfliktem w Syrii
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2016/1315 do Conselho, de 18 de julho de 2016, relativa à
    posição a adotar, em nome da União Europeia, no âmbito do Comité de Associação
    criado pelo Acordo Euro-Mediterrânico que cria uma Associação entre as Comunidades
    Europeias e os seus Estados-Membros, por um lado, e o Reino Hachemita da Jordânia,
    por outro, no que respeita a uma alteração temporária do Protocolo n.° 3 do
    referido Acordo, relativo à definição da noção de produtos originários e
    aos métodos de cooperação administrativa, como resposta em benefício dos refugiados
    que fogem do conflito na Síria
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2016/1315 a Consiliului din 18 iulie 2016 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul Comitetului
    de asociere instituit prin Acordul euro-mediteraneean de instituire a unei asocieri
    între Comunitățile Europene și statele membre ale acestora, pe de o parte,
    și Regatul Hașemit al Iordaniei, pe de altă parte, cu privire la modificarea
    temporară a Protocolului 3 la respectivul acord în ceea ce privește definiția
    noțiunii de „produse originare” și la metodele de cooperare administrativă,
    ca răspuns în favoarea refugiaților care fug din calea conflictului din Siria
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2016/1315 z 18. júla 2016 o pozícii, ktorá sa
    má v mene Európskej únie prijať v asociačnom výbore zriadenom Euro-stredomorskou
    dohodou o pridružení medzi Európskymi spoločenstvami a ich členskými štátmi
    na jednej strane a Jordánskym hášimovským kráľovstvom na strane druhej,
    pokiaľ ide o dočasnú zmenu protokolu č. 3 k uvedenej dohode, týkajúceho
    sa vymedzenia pojmu „výrobky s pôvodom“ a metód administratívnej spolupráce
    ako odpoveď v prospech utečencov, ktorí utekajú v dôsledku konfliktu v Sýrii
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2016/1315 z dne 18. julija 2016 o stališču, ki se v
    imenu Evropske unije, sprejme v okviru Pridružitvenega odbora, ustanovljenega
    z Evro-mediteranskim sporazumom o pridružitvi med Evropskimi skupnostmi in njihovimi
    državami članicami na eni strani in Hašemitsko kraljevino Jordanijo na drugi
    glede začasne spremembe Protokola 3 k navedenemu sporazumu o opredelitvi pojma
    „izdelki s poreklom“ in načinih upravnega sodelovanja kot odziv v prid beguncem,
    ki bežijo pred konfliktom v Siriji
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/1315 del Consejo, de 18 de julio de 2016, relativa
    a la posición que se ha de adoptar, en nombre de la Unión Europea, en el Comité
    de Asociación creado por el Acuerdo Euromediterráneo por el que se crea una
    asociación entre las Comunidades Europeas y sus Estados miembros, por una parte,
    y el Reino Hachemita de Jordania, por otra, por lo que respecta a una modificación
    temporal del Protocolo n.° 3 de dicho Acuerdo, relativo a la definición de la
    noción de «productos originarios» y a los métodos de cooperación administrativa,
    como respuesta en favor de los refugiados que huyen del conflicto en Siria
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2016/1315 av den 18 juli 2016 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i den associeringskommitté som inrättats
    genom Europa-Medelhavsavtalet om upprättande av en associering mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Hashemitiska konungariket
    Jordanien, å andra sidan, vad gäller en tillfällig ändring av protokoll 3
    till det avtalet om definition av begreppet ursprungsprodukter och om metoder
    för administrativt samarbete som en reaktion till förmån för de flyktingar
    som flyr undan konflikten i Syrien
