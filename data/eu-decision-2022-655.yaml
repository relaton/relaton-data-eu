  script: Latn
  content: Tarybos sprendimas (ES) 2022/655 2022 m. balandžio 11 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Europos Sąjungos ir Europos
    atominės energijos bendrijos bei jų valstybių narių ir Armėnijos Respublikos
    visapusiškos ir tvirtesnės partnerystės susitarimu įsteigtoje Partnerystės
    taryboje, dėl Partnerystės tarybos darbo tvarkos taisyklių ir Partnerystės
    komiteto, pakomitečių ir kitų Partnerystės tarybos įsteigtų organų darbo
    tvarkos taisyklių priėmimo ir pakomitečių sąrašo sudarymo šio Susitarimo
    taikymui
  type: main
