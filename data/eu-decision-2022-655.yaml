title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/655 of 11 April 2022 on the position to be adopted
    on behalf of the European Union within the Partnership Council established by
    the Comprehensive and Enhanced Partnership Agreement between the European Union
    and the European Atomic Energy Community and their Member States, of the one part,
    and the Republic of Armenia, of the other part, as regards the adoption of the
    Rules of Procedure of the Partnership Council and those of the Partnership Committee,
    subcommittees and other bodies set up by the Partnership Council, and the establishment
    of the list of Sub-Committees, for the application of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/655 du Conseil du 11 avril 2022 sur la position à
    prendre au nom de l’Union européenne au sein du conseil de partenariat institué
    par l’accord de partenariat global et renforcé entre l’Union européenne
    et la Communauté européenne de l’énergie atomique et leurs États membres,
    d’une part, et la République d’Arménie, d’autre part, concernant l’adoption
    des règlements intérieurs du conseil de partenariat, du comité de partenariat,
    des sous-comités et d’autres organes institués par le conseil de partenariat,
    et l’établissement de la liste des sous-comités, pour l’application dudit
    accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/655 des Rates vom 11. April 2022 zur Festlegung des
    Standpunkts, der im Namen der Europäischen Union in dem mit dem Abkommen über
    eine umfassende und verstärkte Partnerschaft zwischen der Europäischen Union
    und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten einerseits und
    der Republik Armenien andererseits eingesetzten Partnerschaftsrat zur Annahme
    der Geschäftsordnungen des Partnerschaftsrates, des Partnerschaftsausschusses
    und der durch den Partnerschaftsrat eingesetzten Unterausschüsse und sonstigen
    Gremien sowie zur Erstellung der Liste der Unterausschüsse für die Anwendung
    des Abkommens zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/655 на Съвета от 11 април 2022
    година за позицията, която трябва да се заеме
    от името на Европейския съюз в рамките на Съвета
    за партньорство, създаден със Споразумението
    за всеобхватно и засилено партньорство между
    Европейския съюз и Европейската общност за
    атомна енергия и техните държави членки, от
    една страна, и Република Армения, от друга страна,
    във връзка с приемането на процедурния правилник
    на Съвета за партньорство и тези на Комитета
    за партньорство, на подкомитетите и на другите
    органи, създадени от Съвета за партньорство,
    и с утвърждаването на списъка на подкомитетите,
    за прилагането на посоченото споразумение
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/655 ze dne 11. dubna 2022 o postoji, který
    má být jménem Evropské unie přijat v Radě partnerství zřízené Dohodou
    o komplexním a posíleném partnerství mezi Evropskou unií a Evropským společenstvím
    pro atomovou energii a jejich členskými státy na jedné straně a Arménskou
    republikou na straně druhé, pokud jde o přijetí jednacího řádu Rady partnerství
    a jednacích řádů Výboru pro partnerství, podvýborů a dalších orgánů
    zřízených Radou partnerství a o sestavení seznamu podvýborů, za účelem
    provádění uvedené dohody
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/655 af 11. april 2022 om den holdning, der
    skal indtages på Den Europæiske Unions vegne i partnerskabsrådet, der er nedsat
    ved den omfattende og udvidede partnerskabsaftale mellem Den Europæiske Union
    og Det Europæiske Atomenergifællesskab og deres medlemsstater på den ene side
    og Republikken Armenien på den anden side, til vedtagelsen af forretningsordenen
    for partnerskabsrådet, for partnerskabsudvalget, for underudvalgene og for andre
    organer, der nedsættes af partnerskabsrådet, og til oprettelsen af listen over
    underudvalg, for så vidt angår anvendelsen af nævnte aftale
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/655 του Συμβουλίου της 11ης
    Απριλίου 2022 σχετικά με τη θέση που πρέπει να
    ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης στο
    πλαίσιο του συμβουλίου εταιρικής σχέσης που
    συγκροτείται βάσει της συνολικής και ενισχυμένης
    συμφωνίας εταιρικής σχέσης μεταξύ της Ευρωπαϊκής
    Ένωσης και της Ευρωπαϊκής Κοινότητας Ατομικής
    Ενέργειας και των κρατών μελών τους, αφενός,
    και της Δημοκρατίας της Αρμενίας, αφετέρου,
    όσον αφορά τη θέσπιση του εσωτερικού κανονισμού
    του συμβουλίου εταιρικής σχέσης και των εσωτερικών
    κανονισμών της επιτροπής εταιρικής σχέσης,
    των υποεπιτροπών και άλλων οργάνων που έχουν
    συσταθεί από το συμβούλιο εταιρικής σχέσης
    και τη συγκρότηση καταλόγου των υποεπιτροπών,
    για την εφαρμογή της εν λόγω συμφωνίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/655, 11. aprill 2022, Euroopa Liidu nimel võetava
    seisukoha kohta ühelt poolt Euroopa Liidu ja Euroopa Aatomienergiaühenduse ning
    nende liikmesriikide ja teiselt poolt Armeenia Vabariigi vahelise ulatusliku ja
    laiendatud partnerluslepingu alusel moodustatud partnerlusnõukogus seoses partnerlusnõukogu,
    partnerluskomitee ning partnerlusnõukogu loodud allkomiteede ja muude organite
    kodukordade vastuvõtmisega ning allkomiteede loetelu kehtestamisega kõnealuse
    lepingu kohaldamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/655, annettu 11 päivänä huhtikuuta 2022,
    Euroopan unionin ja Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden
    sekä Armenian tasavallan välisellä kokonaisvaltaisella ja tehostetulla kumppanuussopimuksella
    perustetussa kumppanuusneuvostossa Euroopan unionin puolesta esitettävästä
    kannasta kumppanuusneuvoston, kumppanuuskomitean sekä kumppanuusneuvoston perustamien
    alakomiteoiden ja muiden elimien työjärjestysten hyväksymiseen ja alakomiteoiden
    luettelon laatimiseen kyseisen sopimuksen soveltamiseksi
  type: main
- language: ga
  script: Latn
