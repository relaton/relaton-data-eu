    ta’ dak il-Ftehim
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/655 van de Raad van 11 april 2022 betreffende het namens
    de Europese Unie in te nemen standpunt in de door de Brede en Versterkte Partnerschapsovereenkomst
    tussen de Europese Unie en de Europese Gemeenschap voor Atoomenergie en hun lidstaten,
    enerzijds, en de Republiek Armenië, anderzijds, ingestelde Partnerschapsraad,
    over de vaststelling van het reglement van orde van de Partnerschapsraad, en van
    de reglementen van orde van het Partnerschapscomité, van de subcomités en andere
    door de Partnerschapsraad ingestelde organen, en over de vaststelling van de lijst
    van subcomités, met het oog op de toepassing van die overeenkomst
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/655 z dnia 11 kwietnia 2022 r. w sprawie stanowiska,
    jakie ma być przyjęte w imieniu Unii Europejskiej w ramach Rady Partnerstwa
    ustanowionej na mocy Kompleksowej i wzmocnionej umowy o partnerstwie między Unią
    Europejską i Europejską Wspólnotą Energii Atomowej oraz ich państwami członkowskimi,
    z jednej strony, a Republiką Armenii, z drugiej strony, w odniesieniu do przyjęcia
    regulaminu wewnętrznego Rady Partnerstwa oraz regulaminów wewnętrznych Komitetu
    Partnerstwa, podkomitetów i innych organów ustanowionych przez Radę Partnerstwa
    oraz ustanowienia wykazu podkomitetów, do stosowania tej Umowy
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/655 do Conselho de 11 de abril de 2022 relativa à posição
    a tomar em nome da União Europeia no âmbito do Conselho de Parceria criado pelo
    Acordo de Parceria Abrangente e Reforçado entre a União Europeia e a Comunidade
    Europeia da Energia Atómica e os seus Estados-Membros, por um lado, e a República
    da Arménia, por outro, no que respeita à adoção dos Regulamentos Internos
    do Conselho de Parceria, do Comité de Parceria, dos subcomités e dos outros
    órgãos criados pelo Conselho de Parceria, e ao estabelecimento da lista de subcomités,
    para a aplicação do referido acordo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/655 a Consiliului din 11 aprilie 2022 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de parteneriat constituit prin Acordul de parteneriat cuprinzător și consolidat
    dintre Uniunea Europeană și Comunitatea Europeană a Energiei Atomice și statele
    membre ale acestora, pe de o parte, și Republica Armenia, pe de altă parte,
    în ceea ce privește adoptarea regulamentului de procedură al Consiliului de
    parteneriat, a celui al Comitetului de parteneriat și a celui al subcomitetelor
    specializate și al altor organisme înființate de Consiliul de parteneriat,
    și în ceea ce privește stabilirea listei subcomitetelor, în aplicarea acordului
    respectiv
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/655 z 11. apríla 2022 o pozícii, ktorá sa
    má v mene Európskej únie prijať v Rade pre partnerstvo zriadenej Dohodou o
    komplexnom a posilnenom partnerstve medzi Európskou úniou a Európskym spoločenstvom
    pre atómovú energiu a ich členskými štátmi na jednej strane a Arménskou
    republikou na strane druhej, pokiaľ ide o prijatie rokovacieho poriadku Rady
    pre partnerstvo, rokovacieho poriadku Výboru pre partnerstvo a rokovacieho poriadku
    podvýborov a iných orgánov zriadených Radou pre partnerstvo a o stanovenie
    zoznamu podvýborov, na účely vykonávania uvedenej dohody
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/655 z dne 11. aprila 2022 o stališču, ki se v imenu
    Evropske unije sprejme v Partnerskem svetu, ustanovljenem s Celovitim in okrepljenim
    sporazumom o partnerstvu med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo in njunimi državami članicami na eni strani ter Republiko Armenijo
    na drugi strani, v zvezi s sprejetjem poslovnika Partnerskega sveta ter poslovnikov
    Partnerskega odbora, pododborov in drugih organov, ki jih ustanovi Partnerski
    svet, in določitvijo seznama pododborov, za uporabo navedenega sporazuma
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/655 del Consejo de 11 de abril de 2022 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en el Consejo de Asociación
    establecido por el Acuerdo de Asociación Global y Reforzado entre la Unión Europea
    y la Comunidad Europea de la Energía Atómica y sus Estados miembros, por una
    parte, y la República de Armenia, por otra, por lo que respecta a la adopción
    del Reglamento interno del Consejo de Asociación y los del Comité de Asociación
    y de los subcomités y otros órganos creados por el Consejo de Asociación y
    al establecimiento de una lista de subcomités, a efectos de la aplicación de
    dicho Acuerdo
  type: main
