  script: Latn
  content: Rådets beslut (EU) 2022/655 av den 11 april 2022 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i det partnerskapsråd som inrättats
    genom det omfattande och fördjupade partnerskapsavtalet mellan Europeiska unionen
    och Europeiska atomenergigemenskapen och deras medlemsstater, å ena sidan, och
    Republiken Armenien, å andra sidan, vad gäller antagandet av arbetsordningarna
    för partnerskapsrådet, partnerskapskommittén och underkommittéer och andra
    organ som inrättas av partnerskapsrådet, samt om upprättande av förteckningen
    över underkommittéer, för tillämpningen av det avtalet
