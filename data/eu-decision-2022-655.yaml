  script: Latn
  content: Padomes Lēmums (ES) 2022/655 (2022. gada 11. aprīlis) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Partnerības padomē, kura izveidota ar
    Visaptverošu un pastiprinātu partnerības nolīgumu starp Eiropas Savienību
    un Eiropas Atomenerģijas kopienu, un to dalībvalstīm, no vienas puses, un Armēnijas
    Republiku, no otras puses, attiecībā uz Partnerības padomes reglamenta un Partnerības
    komitejas, apakškomiteju un citu Partnerības padomes izveidotu struktūru reglamentu
    pieņemšanu un apakškomiteju saraksta izveidošanu, lai piemērotu minēto nolīgumu
  type: main
