  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/655 od 11. travnja 2022. o stajalištu koje treba
    zauzeti u ime Europske unije u okviru Vijeća za partnerstvo osnovanog Sveobuhvatnim
    i pojačanim sporazumom o partnerstvu između Europske unije i Europske zajednice
    za atomsku energiju i njihovih država članica, s jedne strane, i Republike Armenije,
    s druge strane, u pogledu donošenja poslovnikâ Vijeća za partnerstvo, Odbora
    za partnerstvo, pododborâ i ostalih tijela koje je osnovalo Vijeće za partnerstvo
    te utvrđivanja popisa pododbora, za primjenu tog sporazuma
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/655 határozata (2022. április 11.) az egyrészről
    az Európai Unió, az Európai Atomenergia-közösség és tagállamaik, másrészről
    az Örmény Köztársaság közötti átfogó és megerősített partnerségi
    megállapodással létrehozott partnerségi tanácsban az említett megállapodás
    alkalmazásában a partnerségi tanács, valamint a partnerségi bizottság, és
    a partnerségi tanács által létrehozott albizottságok és más testületek
    eljárási szabályzatának elfogadásával, továbbá az albizottságok jegyzékének
    létrehozásával kapcsolatban az Európai Unió nevében elfogadandó álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/655 del Consiglio dell'11 aprile 2022 relativa alla
    posizione da adottare a nome dell’Unione europea in sede di Consiglio di partenariato
    istituito dall’accordo di partenariato globale e rafforzato tra l’Unione europea
    e la Comunità europea dell’energia atomica e i loro Stati membri, da una parte,
    e la Repubblica d’Armenia, dall’altra, per quanto riguarda l’adozione del
    regolamento interno del Consiglio di partenariato e di quelli del comitato di
    partenariato, dei sottocomitati e degli altri organi istituiti dal Consiglio di
    partenariato, nonché la fissazione dell’elenco dei sottocomitati per l’applicazione
    di tale accordo
  type: main
