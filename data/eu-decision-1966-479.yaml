title:
- language: fr
  script: Latn
  content: Décision 66/479/CEE de la Commission, du 29 juillet 1966, portant prorogation
    de la durée de validité de la décision de la Commission, du 2 mai 1966, autorisant
    le Royaume de Belgique et le Grand-Duché de Luxembourg à suspendre partiellement
    à l'égard des pays tiers leurs droits de douane applicables à l'importation
    de certaines viandes bovines congelées, destinées, sous contrôle douanier,
    à la transformation
  type: main
- language: de
  script: Latn
  content: '66/479/EWG: Entscheidung der Kommission vom 29. Juli 1966 zur Verlängerung
    der Geltungsdauer der Entscheidung der Kommission vom 2. Mai 1966, mit der das
    Königreich Belgien und das Großherzogtum Luxemburg ermächtigt werden, die bei
    der Einfuhr einiger zur Verarbeitung unter Zollaufsicht bestimmter Arten von gefrorenem
    Rindfleisch erhobenen Zollsätze gegenüber dritten Ländern teilweise auszusetzen'
  type: main
- language: it
  script: Latn
  content: '66/479/CEE: Decisione della Commissione, del 29 luglio 1966, che proroga
    il periodo di validità della decisione della Commissione del 2 maggio 1966 che
    autorizza il Regno del Belgio e il Granducato del Lussemburgo a sospendere parzialmente,
    nei confronti dei Paesi terzi, i rispettivi dazi doganali sull''importazione di
    determinate carni bovine congelate destinate alla trasformazione sotto controllo
    doganale'
  type: main
- language: nl
  script: Latn
  content: '66/479/EEG: Beschikking van de Commissie van 29 juli 1966 tot verlenging
    van de geldigheidsduur van de beschikking van de Commissie van 2 mei 1966, waarbij
    het Koninkrijk België en het Groothertogdom Luxemburg worden gemachtigd hun douanerechten
    ten opzichte van derde landen bij de invoer van bepaalde soorten bevroren rundvlees,
    bestemd voor verwerking onder douanetoezicht, gedeeltelijk te schorsen'
  type: main
