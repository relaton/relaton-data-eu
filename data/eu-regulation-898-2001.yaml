title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 898/2001 of 7 May 2001 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the "Register
    of protected designations of origin and protected geographical indications" provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 898/2001 de la Commission du 7 mai 2001 complétant
    l'annexe du règlement (CE) n° 2400/96 relatif à l'inscription de certaines
    dénominations dans le "Registre des appellations d'origine protégées et des
    indications géographiques protégées" prévu au règlement (CEE) n° 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 898/2001 der Kommission vom 7. Mai 2001 zur Ergänzung
    des Anhangs der Verordnung (EG) Nr. 2400/96 der Kommission zur Eintragung bestimmter
    Bezeichnungen in das Verzeichnis der geschützten Ursprungsbezeichnungen und der
    geschützten geografischen Angaben für Agrarerzeugnisse und Lebensmittel gemäß
    Verordnung (EWG) Nr. 2081/92 des Rates zum Schutz von geografischen Angaben und
    Ursprungsbezeichnungen für Agrarerzeugnisse und Lebensmittel
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 898/2001 на Комисията от 7 май
    2001 година за допълнение на приложението към
    Регламент (ЕО) № 2400/96 относно вписването на
    някои означения в „Регистър на защитените
    наименования за произход и на защитените географски
    указания“, предвиден в Регламент (ЕИО) № 2081/92
    на Съвета за защита на географските указания
    и наименованията за произход на селскостопанските
    и хранителните продукти
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 898/2001 ze dne 7. května 2001, kterým se
    doplňuje příloha nařízení ES č. 2400/96 o zápisu určitých názvů do
    „Rejstříku chráněných označení původu a chráněných zeměpisných
    označení“ podle nařízení Rady (EHS) č. 2081/92 o ochraně zeměpisných
    označení a označení původu zemědělských produktů a potravin
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 898/2001 af 7. maj 2001 om en tilføjelse
    i bilaget til forordning (EF) nr. 2400/96 om optagelse af visse betegnelser i
    det register over beskyttede oprindelsesbetegnelser og beskyttede geografiske
    betegnelser, der er fastsat i Rådets forordning (EØF) nr. 2081/92 om beskyttelse
    af geografiske betegnelser og oprindelsesbetegnelser for landbrugsprodukter og
    levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 898/2001 της Επιτροπής,
    της 7ης Μαΐου 2001, για τη συμπλήρωση του παραρτήματος
    του κανονισμού (ΕΚ) αριθ. 2400/96 της Επιτροπής
    σχετικά με την εγγραφή ορισμένων ονομασιών
    στο "Μητρώο προστατευόμενων ονομασιών προέλευσης
    και προστατευόμενων γεωγραφικών ενδείξεων"
    που προβλέπεται στον κανονισμό (ΕΟΚ) αριθ. 2081/92
    του Συμβουλίου περί προστασίας των γεωγραφικών
    ενδείξεων και των ονομασιών προέλευσης των
    γεωργικών προϊόντων και τροφίμων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 898/2001, 7. mai 2001, millega täiendatakse
    määruse (EÜ) nr 2400/96 (teatavate nimede kandmise kohta kaitstud päritolunimetuste
    ja geograafiliste tähiste registrisse, mis on ette nähtud nõukogu määruses
    (EMÜ) nr 2081/92 põllumajandustoodete ja toiduainete geograafiliste tähiste
    ning päritolunimetuste kaitse kohta) lisa
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 898/2001, annettu 7 päivänä toukokuuta 2001,
    tiettyjen nimitysten kirjaamisesta maataloustuotteiden ja elintarvikkeiden maantieteellisten
    merkintöjen ja alkuperänimitysten suojasta annetussa neuvoston asetuksessa (ETY)
    N:o 2081/92 säädettyyn "Suojattujen alkuperänimitysten ja suojattujen maantieteellisten
    merkintöjen rekisteriin" annetun asetuksen (EY) N:o 2400/96 liitteen täydentämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 898/2001 od 7. svibnja 2001. o dopuni Priloga
    Uredbi (EZ) br. 2400/96 o upisu određenih naziva u Registar zaštićenih oznaka
    izvornosti i zaštićenih oznaka zemljopisnog podrijetla kako je predviđeno u
    Uredbi Vijeća (EEZ) br. 2081/92 o zaštiti oznaka zemljopisnog podrijetla i oznaka
    izvornosti za poljoprivredne i prehrambene proizvode
  type: main
- language: hu
  script: Latn
  content: A Bizottság 898/2001/EK rendelete (2001. május 7.) egyes neveknek a mezőgazdasági
    termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben foglalt, az oltalom alatt
    álló földrajzi jelzések és eredetmegjelölések nyilvántartásába való
    bejegyzéséről szóló 2400/96/EK rendelet mellékletének kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 898/2001 della Commissione, del 7 maggio 2001, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel "Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette" di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 898/2001 (2001. gada 7. maijs), ar ko papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu iekļaušanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kurš paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
  type: main
- language: lt
  script: Latn
  content: 2001 m. gegužės 7 d. Komisijos reglamentas (EB) Nr. 898/2001, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Tarybos
    reglamente (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų
    geografinių nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų
    kilmės vietos nuorodų ir saugomų geografinių nuorodų registrą“ priedą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 898/2001 tas-7 ta’ Mejju 2001
    li jissupplimenta l-Anness mar-Regolament (KE) Nru 2400/96 dwar id-dħul ta’
    ċerti ismijiet fir-“Reġistru ta’ denominazzjoni protetta ta’ oriġini
    u indikazzjonijiet ġeografiċi protetti” pprovdut bir-Regolament tal-Kunsill
    (KEE) Nru 2081/92 dwar il-protezzjoni ta’ l-indikazzjonijiet ġeografiċi u
    l-ismijiet ta’ l-oriġini għall-prodotti u l-oġġetti ta' l-ikel agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 898/2001 van de Commissie van 7 mei 2001 houdende
    aanvulling van de bĳlage bĳ Verordening (EG) nr. 2400/96 betreffende de inschrĳving
    van bepaalde benamingen in het "Register van beschermde oorsprongsbenamingen en
    beschermde geografische aanduidingen" bedoeld in Verordening (EEG) nr. 2081/92
    van de Raad inzake de bescherming van geografische aanduidingen en oorsprongsbenamingen
    van landbouwproducten en levensmiddelen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 898/2001 z dnia 7 maja 2001 r. uzupełniające
    załącznik do rozporządzenia (WE) nr 2400/96 w sprawie wpisu niektórych nazw
    do „Rejestru chronionych nazw pochodzenia i chronionych oznaczeń geograficznych”
    przewidzianego w rozporządzeniu Rady (EWG) nr 2081/92 w sprawie ochrony oznaczeń
    geograficznych i nazw pochodzenia dla produktów rolnych i środków spożywczych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 898/2001 da Comissão, de 7 de Maio de 2001, que
    completa o anexo do Regulamento (CE) n.° 2400/96 da Comissão relativo à inscrição
    de determinadas denominações no registo das denominações de origem protegidas
    e das indicações geográficas protegidas previsto no Regulamento (CEE) n.°
    2081/92 do Conselho relativo à protecção das indicações geográficas e denominações
    de origem dos produtos agrícolas e dos géneros alimentícios
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 898/2001 al Comisiei din 7 mai 2001 de completare
    a anexei la Regulamentul (CE) nr. 2400/96 privind înscrierea anumitor denumiri
    în „Registrul denumirilor de origine protejate și al indicațiilor geografice
    protejate”, prevăzut în Regulamentul (CEE) nr. 2081/92 al Consiliului privind
    protecția indicațiilor geografice și a denumirilor de origine ale produselor
    agricole și alimentare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 898/2001 zo 7. mája 2001, ktorým sa dopĺňa
    príloha k nariadeniu (ES) č. 2400/96 o zápise určitých názvov do Registra
    chránených označení pôvodu a chránených zemepisných označení, uvedeného
    v nariadení Rady (EHS) č. 2081/92 o ochrane zemepisných označení a označení
    pôvodu poľnohospodárskych výrobkov a potravín
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 898/2001 z dne 7. maja 2001 o dopolnitvi Priloge
    k Uredbi (ES) št. 2400/96 o vnosu nekaterih imen v „Register zaščitenih označb
    porekla in zaščitenih geografskih označb“, določen v Uredbi Sveta (EGS)
    št. 2081/92 o zaščiti geografskih označb in označb porekla za kmetijske proizvode
    in živila
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 898/2001 de la Comisión, de 7 de mayo de 2001, que
    completa el anexo del Reglamento (CE) n° 2400/96 relativo a la inscripción de
    determinadas denominaciones en el "Registro de denominaciones de origen protegidas
    y de indicaciones geográficas protegidas" establecido en el Reglamento (CEE)
    n° 2081/92 del Consejo relativo a la protección de las indicaciones geográficas
    y de las denominaciones de origen de los productos agrícolas y alimenticios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 898/2001 av den 7 maj 2001 om komplettering
    av bilagan till förordning (EG) nr 2400/96 om upptagandet av vissa namn i "Register
    över skyddade ursprungsbeteckningar och skyddade geografiska beteckningar" som
    föreskrivs i rådets förordning (EEG) nr 2081/92 om skydd för geografiska och
    ursprungsbeteckningar för jordbruksprodukter och livsmedel
