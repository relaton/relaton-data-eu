title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1693/2002 of 25 September 2002 initiating
    an investigation concerning the alleged circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 1784/2000 on imports of certain malleable
    cast iron tube or pipe fittings originating in Brazil by imports of certain malleable
    cast iron tube or pipe fittings consigned from Argentina, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1693/2002 de la Commission du 25 septembre 2002 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 1784/2000 du Conseil sur les importations de certains
    accessoires de tuyauterie en fonte malléable originaires du Brésil par des importations
    de certains accessoires de tuyauterie en fonte malléable expédiés d'Argentine,
    et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1693/2002 der Kommission vom 25. September 2002 zur
    Einleitung einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung
    (EG) Nr. 1784/2000 des Rates eingeführten Antidumpingmaßnahmen auf die Einfuhren
    bestimmter Rohrformstücke aus verformbarem Gusseisen mit Ursprung in Brasilien
    durch die Einfuhren bestimmter aus Argentinien versandter Rohrformstücke aus
    verformbarem Gusseisen und zur zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1693/2002 af 25. september 2002 om indledning
    af en undersøgelse vedrørende den påståede omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 1784/2000 på importen af visse
    rørfittings af deformerbart støbejern med oprindelse i Brasilien ved import
    af visse rørfittings af deformerbart støbejern afsendt fra Argentina, og om
    at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
