  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1693/2002, annettu 25 päivänä syyskuuta 2002,
    Brasiliasta peräisin olevien tiettyjen tempervalurautaisten putkien liitos- ja
    muiden osien tuonnissa neuvoston asetuksella (EY) N:o 1784/2000 käyttöön otettujen
