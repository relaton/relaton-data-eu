  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 gennaio 1978, che modifica la decisione
    77/783/CEE della Commissione, del 24 novembre 1977, che autorizza la Repubblica
    italiana ad ammettere temporaneamente la commercializzazione di sementi che non
    soddisfano alle condizioni della direttiva 66/402/CEE del Consiglio
  type: main
- language: nl
  script: Latn
