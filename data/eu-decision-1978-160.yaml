  script: Latn
  content: Commission Decision of 13 January 1978 amending Commission Decision 77/783/EEC
    authorizing the Italian Republic to permit temporarily the marketing of seed not
    complying with requirements of Council Directive 66/402/EEC
  type: main
- language: fr
  script: Latn
  content: '78/160/CEE: Décision de la Commission, du 13 janvier 1978, modifiant
    la décision 77/783/CEE de la Commission du 24 novembre 1977 autorisant la République
    italienne à admettre temporairement la commercialisation de semences ne répondant
    pas aux exigences de la directive 66/402/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Januar 1978 zur Änderung der Entscheidung
    77/783/EWG der Kommission vom 24. November 1977 zur Ermächtigung der Italienischen
    Republik, vorübergehend Saatgut zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinie 66/402/EWG des Rates nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. januar 1978 om ændring af Kommissionens
