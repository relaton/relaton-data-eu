id: EURegulation14771976
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1477/76 of 23 June 1976 re-establishing
    the levying of customs duties on knives with cutting blades, serrated or not (including
    pruning knives), falling within heading No 82.09, originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1477/76 de la Commission, du 23 juin 1976, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    à lame tranchante ou dentelée, y compris les serpettes fermantes, de la position
    tarifaire 82.09, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1477/76 der Kommission vom 23. Juni 1976 zur Wiedereinführung
    des Zollsatzes für Messer mit schneidender oder gezahnter Klinge, einschließlich
    Klappmesser für den Gartenbau, der Tarifnummer 82.09, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1477/76 af 23. juni 1976 om genindførelse
    af opkrævning af toldafgifter for knive, med skærende eller savtakket æg (herunder
    beskærerknive), under position 82.09, som har oprindelse i udviklingslande og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1477/76 della Commissione, del 23 giugno 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai coltelli a lama trinciante
    o dentata, compresi i roncoli chiudibili della voce doganale n. 82.09 originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1477/76 van de Commissie van 23 juni 1976 houdende
    wederinstelling van de heffing van de douanerechten voor messen (andere dan die
    bedoeld bij post 82.06), ook indien getand, zaksnoeimessen daaronder begrepen,
    van post 82.09, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 tariefpreferenties
    werden geopend
  type: main
