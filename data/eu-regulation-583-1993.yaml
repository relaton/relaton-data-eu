    pour la revente sur le marché intérieur de blé dur détenu par l'organisme
    d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 583/93 der Kommission vom 12. März 1993 zur Änderung
    der Verordnung (EWG) Nr. 353/93 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 300 000 Tonnen Hartweizen aus Beständen
    der italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 583/93 af 12. marts 1993 om ændring
