    of Community quantitative limits concerning economic outward processing traffic
    applicable to certain textile products originating in Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1857/84 de la Commission du 27 juin 1984 modifiant
