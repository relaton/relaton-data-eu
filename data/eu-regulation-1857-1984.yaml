    für 1984 zwischen den Mitgliedstaaten für den wirtschaftlichen passiven Veredelungsverkehr
    für bestimmte Textilwaren mit Ursprung in Jugoslawien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1857/84 af 27. juni 1984 om ændring
