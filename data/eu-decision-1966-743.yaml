  content: Décision 66/743/CEE du Conseil du 22 décembre 1966, portant suspension
    totale des droits du Tarif douanier commun applicables aux avions d'un poids à
    vide supérieur à 15.000 Kg, des positions 88.02 B II C) et D)
  type: main
- language: de
  script: Latn
  content: '66/743/EWG: Entscheidung des Rates vom 22. Dezember 1966 über die vollständige
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Luftfahrzeuge mit einem
    Leergewicht von mehr als 15 000 kg der Tarifnummer 88.02 B II c) und d)'
  type: main
- language: it
  script: Latn
  content: '66/743/CEE: Decisione del Consiglio, del 22 dicembre 1966, recante sospensione
    totale dei dazi della tariffa doganale comune applicabili agli aeroplani di peso
    a vuoto superiore a 15.000 kg delle voci 88.02 B II c) e d)'
  type: main
- language: nl
  script: Latn
  content: '66/743/EEG: Beschikking van de Raad van 22 december 1966 houdende volledige
    schorsing van de rechten van het gemeenschappelijk douanetarief op vliegtuigen
    met een leeggewicht van meer dan 15.000 kilogram van de posten 88.02 B II c) en
    d)'
