title:
- language: en
  script: Latn
  content: '74/269/EEC: Commission Decision of 2 May 1974 authorizing certain Member
    States to make provisions which are more strict concerning the presence of ''Avena
    fatua'' in fodder plant and cereal seed (Only the English and Danish texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '74/269/CEE: Décision de la Commission, du 2 mai 1974, autorisant certains
    États membres à prendre des dispositions plus strictes en ce qui concerne la
    présence d''Avena fatua dans les semences de plantes fourragères et de céréales
    (Les textes en langues anglaise et danoise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '74/269/EWG: Entscheidung der Kommission vom 2. Mai 1974 zur Ermächtigung
    einiger Mitgliedstaaten, bezüglich des Vorhandenseins von Avena fatua in Futterpflanzensaatgut
    und in Getreidesaatgut strengere Vorschriften zu erlassen (Nur der englische und
    dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '74/269/EØF: Kommissionens Beslutning af 2. maj 1974 om bemyndigelse af
    visse medlemsstater til at tage strengere forholdsregler i tilfælde af, at der
    findes Avena fatua i frø af foderplanter og i såsæd (Kun de engelske og danske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '74/269/ΕΟΚ: Απόφαση της Επιτροπής, της 2ας
    Μαΐου 1974, με την οποία επιτρέπεται σε ορισμένα
    κράτη μέλη να λάβουν αυστηρότερα μέτρα όσον
    αφορά την παρουσία Avena fatua στους σπόρους φυτών
    που προορίζονται για ζωοτροφές και δημητριακών
    (Τα κείμενα στη δανική και αγγλική γλώσσα είναι
    τα μόνα αυθεντικά)'
  type: main
- language: fi
  script: Latn
  content: '74/269/ETY: Komission päätös, tehty 2 päivänä toukokuuta 1974, luvan
    antamisesta tietyille jäsenvaltioille antaa tiukempia määräyksiä Avena fatuan
    esiintymisestä rehukasvien ja viljakasvien siemenissä (Ainoastaan tanskan- ja
    englanninkieliset tekstit ovat todistusvoimaisia)'
  type: main
- language: it
  script: Latn
  content: '74/269/CEE: Decisione della Commissione, del 2 maggio 1974, che autorizza
    alcuni Stati membri a prendere disposizioni più restrittive per quanto riguarda
    la presenza di Avena fatua nelle sementi di piante foraggere e di cereali (Il
    testi in lingua inglese e danese sono il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '74/269/EEG: Beschikking van de Commissie van 2 mei 1974 houdende machtiging
    voor bepaalde Lid-Staten om strengere maatregelen te nemen met betrekking tot
    de aanwezigheid van Avena fatua in zaaizaad van groenvoedergewassen en in zaaigranen
    (Slechts de teksten in de Engelse en de Deense taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '74/269/CEE: Decisão da Comissão, de 2 de Maio de 1974, que autoriza
    alguns Estados-membros a tomar decisões mais rigorosas no que se refere à presença
    da Avena fatua nas sementes de plantas forrageiras e de cereais (Apenas fazem
    fé os textos nas línguas inglesa e dinamarquesa)'
  type: main
- language: es
  script: Latn
  content: '74/269/CEE: Decisión de la Comisión, de 2 de mayo de 1974, por la que
    se autoriza a determinados Estados miembros para que adopten disposiciones más
    estrictas en lo que se refiere a la presencia de Avena fatua en las semillas de
    plantas forrajeras y de cereales (Los textos en lenguas inglesa y danesa son los
    únicos auténticos)'
  type: main
- language: sv
  script: Latn
  content: '74/269/EEG: Kommissionens beslut av den 2 maj 1974 om tillstånd för
