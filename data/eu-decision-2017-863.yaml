  script: Latn
  content: Commission Implementing Decision (EU) 2017/863 of 18 May 2017 updating
    the open source software licence EUPL to further facilitate the sharing and reuse
    of software developed by public administrations
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/863 de la Commission du 18 mai 2017 actualisant
