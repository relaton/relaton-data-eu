    des logiciels développés par les administrations publiques
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/863 der Kommission vom 18. Mai 2017 zur
    Aktualisierung der Open-Source-Software-Lizenz EUPL im Hinblick auf die weitere
    Erleichterung der gemeinsamen Nutzung und der Weiterverwendung von Software, die
    von öffentlichen Verwaltungen entwickelt wird
  type: main
- language: bg
