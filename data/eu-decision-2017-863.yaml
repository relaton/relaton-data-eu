    zdrojovým kódem v zájmu dalšího usnadnění sdílení a opětovného použití
    softwaru vyvinutého orgány veřejné správy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/863 af 18. maj 2017 om
