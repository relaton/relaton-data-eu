type: standard
title:
- language: en
  script: Latn
  content: '79/627/EEC: Commission Decision of 18 June 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven breeches,
    shorts and trousers (including slacks) ; women''s, girls''and infants''woven trousers
    and slacks, of wool, of cotton or of man-made textile fibres, falling within heading
    No ex 61.01 and subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (category 6), originating in
    Yugoslavia and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/627/CEE: Décision de la Commission, du 18 juin 1979, autorisant la
    République française à exclure du traitement communautaire les culottes, "shorts"
    et pantalons tissés pour hommes et garçonnets, pantalons tissés pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    et artificielles, de la position ex 61.01 et de la sous- position ex 61.02 B du
    tarif douanier commun (codes Nimexe: 61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68,
    72) (catégorie 6), originaires de Yougoslavie et mis en libre pratique dans les
    autres Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/627/EWG: Entscheidung der Kommission vom 18. Juni 1979, mit der die
    Französische Republik ermächtigt wird, aus Jugoslawien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Shorts und andere kurze
    Hosen und lange Hosen, aus Geweben, für Männer und Knaben; lange Hosen, aus
    Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen
    oder künstlichen Spinnstoffen, der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 61.01-62; 64; 66; 72; 74; 76 und 61.02-66; 68;
    72) (Kategorie 6) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/627/EØF: Kommissionens beslutning af 18. juni 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage shorts og andre
    korte benklæder til mænd og drenge, vævede; lange benklæder til kvinder og
    piger og småbørn, vævede af uld, bomuld, syntetiske eller regenererede fibre,
    som henhører under pos. ex 61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-kode
    61.01-62, 64, 66, 72, 74, 76 - 61.02-66, 68, 72), kategori 6, har oprindelse i
    Jugoslavien og frit kan omsættes i de øvrige medlemsstater (Kun den franske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/627/CEE: Decisione della Commissione, del 18 giugno 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario calzoncini, shorts
    e pantaloni, tessuti, per uomo e per ragazzo, e pantaloni, tessuti, per donna,
    per ragazza e per bambini, di lana, di cotone o di fibre tessili sintetiche o
    artificiali, della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale
    comune (codici Nimexe: 61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68, 72) categoria
    6, originari della Iugoslavia e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/627/EEG: Beschikking van de Commissie van 18 juni 1979 waarbij de Franse
    Republiek wordt gemachtigd shorts en andere korte broeken, lange broeken, geweven,
    voor heren en jongens ; lange broeken, geweven, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels, voor dames, meisjes en kinderen, van de posten
    ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-62,
    64, 66, 72, 74, 76 en 61.02-66, 68, 72) (categorie 6), van oorsprong uit Joegoslavië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
