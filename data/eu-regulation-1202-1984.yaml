title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1202/84 of 30 April 1984 re-establishing
    the levying of customs duties on certain shawls, scarves, mufflers, mantillas,
    veils and the like, products of category 84 (code 0840), originating in China,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1202/84 de la Commission du 30 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certains châles, écharpes,
    foulards, etc., et articles similaires autres qu' en bonneterie, de la catégorie
    84 (code 0840), originaires de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1202/84 der Kommission vom 30. April 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Schals, Umschlagtücher, Haltstücher
    usw., andere als Wirkwaren, der Warenkategorie Nr. 84 (Kennziffer 0840) mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1202/84 af 30. april 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte sjaler, tørklæder, mantiller, og
    lign., bortset fra varer af trikotage, af uld, bomuld, eller kemofibre under varekategori
    nr. 84 (kode 0840), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1202/84 της Επιτροπής
    της 30ής Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    επώμια εν γένει (σάλια, εσάρπες), μανδήλια λαιμού
    κλπ., και παρόμοια είδη έτερα των πλεκτών, προϊόντα
    της κατηγορίας 84 (κωδικός 0840), καταγωγής Κίνας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1202/84 della Commissione del 30 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili a alcuni scialli, sciarpe, fazzoletti
    da collo, ecc., e manufatti simili esclusi quelli a maglia, della categoria di
    prodotti n. 84 (codice 0840), originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1202/84 van de Commissie van 30 april 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sommige
    sjaals, sjerpen, hoofddoeken en halsdoeken, mantilles, sluiers, voiles en dergelijke
    artikelen, van de categorie van produkten nr. 84 (codenummer 0840), van oorsprong
    uit China, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3570/83 van de Raad
  type: main
