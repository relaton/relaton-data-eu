    začasne podpore v okviru Evropskega kmetijskega sklada za razvoj podeželja (EKSRP)
    kot odziv na vpliv ruske invazije na Ukrajino
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/1033 del Parlamento Europeo y del Consejo de 29 de
