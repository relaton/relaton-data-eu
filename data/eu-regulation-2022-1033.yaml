    opatření na poskytnutí výjimečné dočasné podpory v rámci Evropského
    zemědělského fondu pro rozvoj venkova (EZFRV) v reakci na dopad invaze Ruska
    na Ukrajinu
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/1033 af 29. juni 2022
