title:
- language: en
  script: Latn
  content: Regulation (EU) 2022/1033 of the European Parliament and of the Council
    of 29 June 2022 amending Regulation (EU) No 1305/2013 as regards a specific measure
    to provide exceptional temporary support under the European Agricultural Fund
    for Rural Development (EAFRD) in response to the impact of Russia’s invasion
    of Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1033 du Parlement européen et du Conseil du 29 juin
    2022 modifiant le règlement (UE) no 1305/2013 en ce qui concerne une mesure spécifique
    destinée à fournir un soutien temporaire exceptionnel au titre du Fonds européen
    agricole pour le développement rural (Feader) en réaction aux conséquences
    de l’invasion de l’Ukraine par la Russie
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/1033 des Europäischen Parlaments und des Rates vom
