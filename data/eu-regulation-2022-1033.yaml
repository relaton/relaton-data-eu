    besonderen Maßnahme zur Gewährung einer befristeten Sonderunterstützung im
    Rahmen des Europäischen Landwirtschaftsfonds für die Entwicklung des ländlichen
    Raums (ELER) als Reaktion auf die Auswirkungen der russischen Invasion der Ukraine
  type: main
