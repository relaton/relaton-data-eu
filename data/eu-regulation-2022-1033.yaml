    adott válaszként az Európai Mezőgazdasági Vidékfejlesztési Alap (EMVA)
    keretében rendkívüli ideiglenes támogatás nyújtását célzó egyedi intézkedés
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/1033 del Parlamento europeo e del Consiglio del 29
    giugno 2022 che modifica il regolamento (UE) n. 1305/2013 per quanto riguarda
    una misura specifica volta a fornire un sostegno temporaneo eccezionale nell'ambito
    del Fondo europeo agricolo per lo sviluppo rurale (FEASR) in risposta all'impatto
    dell'invasione russa dell'Ucraina
  type: main
- language: lv
  script: Latn
