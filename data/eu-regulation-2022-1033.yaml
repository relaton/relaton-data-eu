  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/1033 do Parlamento Europeu e do Conselho de 29 de
    junho de 2022 que altera o Regulamento (UE) n.o 1305/2013 no que diz respeito
    a uma medida específica para a concessão de apoio temporário excecional ao
    abrigo do Fundo Europeu Agrícola de Desenvolvimento Rural (FEADER) em resposta
    ao impacto da invasão da Ucrânia pela Rússia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/1033 al Parlamentului European și al Consiliului
    din 29 iunie 2022 de modificare a Regulamentului (UE) nr. 1305/2013 în ceea ce
    privește o măsură specifică de acordare a unui sprijin temporar cu caracter
    excepțional în cadrul Fondului european agricol pentru dezvoltare rurală (FEADR)
    ca răspuns la invadarea Ucrainei de către Rusia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2022/1033 z 29. júna 2022,
    ktorým sa mení nariadenie (EÚ) č. 1305/2013, pokiaľ ide o osobitné opatrenie
    na poskytnutie výnimočnej dočasnej podpory v rámci Európskeho poľnohospodárskeho
    fondu pre rozvoj vidieka (EPFRV) v reakcii na dôsledky invázie Ruska na Ukrajinu
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2022/1033 Evropskega parlamenta in Sveta z dne 29. junija 2022
