id: EURegulation17451975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1745/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on yarn of combed sheep's or lambs' wool (worsted
    yarn, not put up for retail sale), falling within heading No 53.07, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3048/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1745/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine peignée, non conditionnés pour la vente au détail, de la position tarifaire
    53.07, originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3048/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1745/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Kammgarne aus Wolle, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifstelle 53.07, mit Ursprung in Brasilien, dem
    die in der Verordnung (EWG) Nr. 3048/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1745/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for garn af kæmmet uld (kamgarn), ikke i detailsalgsoplægninger,
    under position 53.07, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3048/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1745/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana pettinata,
    non preparati per la vendita al minuto, della voce doganale 53.07, originari del
    Brasile, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3048/74, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1745/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op kamgaren
    van wol, niet gereed voor de verkoop in het klein, van post 53.07, van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3048/74 van de Raad van 2 december 1974
  type: main
