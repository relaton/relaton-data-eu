title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 849/85 of 29 March 1985 re-establishing
    the levying of customs duties on glutamic acid and its salts, falling within subheading
    29.23 D III, originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 849/85 de la Commission du 29 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à l' acide glutamique et ses
    sels, de la sous-position 29.23 D III du tarif douanier commun, originaires de
    Thaïlande, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 849/85 der Kommission vom 29. März 1985 zur Wiedereinführung
    der Erhebung der Zölle für Glutaminsäure und ihre Salze der Tarifstelle 29.23
    D III mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3562/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 849/85 af 29. marts 1985 om genindførelse
    af opkrævning af told for glutaminsyre samt salte deraf, henhørende under pos.
    29.23 D III og med oprindelse i Thailand, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 849/85 της Επιτροπής
    της 29ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για το γλουταμικό οξύ
    και τα άλατα αυτού, της διακρίσεως 29.23 Δ ΙΙΙ
    του Κοινού Δασμολογίου, καταγωγής Ταϋλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 849/85 della Commissione del 29 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili all' acido glutammico e suoi sali,
    della sottovoce 29.23 D III della tariffa doganale comune, originario della Tailandia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 849/85 van de Commissie van 29 maart 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op glutaminezuur
    en zouten daarvan, van postonderverdeling 29.23 D III, van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
