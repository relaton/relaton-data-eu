    rubrica referitoare la Statele Unite din lista cu țări terțe, teritorii, zone
    sau compartimente din care anumite produse obținute de la păsări de curte pot
    fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de gripă
    aviară înalt patogenă în urma apariției unor noi focare în țara menționată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/796 z 21. mája 2015, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Spojených štátov amerických v zozname tretích krajín, území, oblastí
    alebo jednotiek, z ktorých možno do Únie dovážať alebo cez jej územie prevážať
    určité komodity z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
    v dôsledku výskytu ďalších ohnísk v danej krajine
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/796 z dne 21. maja 2015 o spremembi
