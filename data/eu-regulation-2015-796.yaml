title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/796 of 21 May 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza following further outbreaks in
    that country
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/796 de la Commission du 21 mai 2015 modifiant
    l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions relatives
    aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci, pour ce qui est de l'influenza aviaire
    hautement pathogène, à la suite de l'apparition de nouveaux foyers dans ce pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/796 der Kommission vom 21. Mai 2015
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zu den Vereinigten Staaten in der Liste von Drittländern, Gebieten,
    Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, in Bezug auf die hochpathogene
    aviäre Influenza nach weiteren Ausbrüchen in diesem Land
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/796 на Комисията
