    na seznamu tretjih držav, ozemelj, območij ali kompartmentov, iz katerih je
    dovoljen uvoz nekaterih perutninskih proizvodov v Unijo ali njegov tranzit skozi
    Unijo, v zvezi z visokopatogeno aviarno influenco po nadaljnjih izbruhih v navedeni
    državi
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/796 de la Comisión, de 21 de mayo de
