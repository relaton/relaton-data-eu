    a la entrada relativa a los Estados Unidos en la lista de terceros países, territorios,
    zonas o compartimentos desde los cuales están permitidos la importación en la
    Unión o el tránsito por esta de determinadas mercancías de aves de corral,
    debido a la aparición de nuevos brotes de influenza aviar altamente patógena
    en dicho país
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/796 av den 21 maj 2015
