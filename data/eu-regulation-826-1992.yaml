title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 826/92 of 1 April 1992 derogating for the
    1991/92 wine year from the producers' requirement to notify the quantities of
    table wine they must deliver for compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 826/92 de la Commission du 1er avril 1992 portant
    mesure dérogatoire pour la campagne 1991/1992 en matière de communication par
    les producteurs de leurs quantités de vin de table à livrer à la distillation
    obligatoire
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 826/92 DER KOMMISSION vom 1. April 1992 über eine
    abweichende Maßnahme für das Wirtschaftsjahr 1991/92 für die Mitteilungen der
    Erzeuger über ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 826/92 af 1. april 1992 om en undtagelsesforanstaltning
    for produktionsåret 1991/92 med hensyn til producenternes meddelelse af bordvinsmængder,
    der skal leveres til obligatorisk destillation #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 826/92 της Επιτροπής
    της 1ης Απριλίου 1992 που προβλέπει μέτρο παρέκκλισης
    για την περίοδο 1991/92, όσον αφορά την ανακοίνωση
    από τους παραγωγούς των ποσοτήτων επιτραπέζιου
    οίνου που θα παραδοθούν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 826/92 DELLA COMMISSIONE del 1o aprile 1992 recante
    una misura derogatoria per la campagna 1991/1992, per quanto riguarda la comunicazione,
    da parte dei produttori, dei quantitativi di vini da tavola che devono consegnare
    alla distillazione obbligatoria #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 826/92 VAN DE COMMISSIE van 1 april 1992 houdende
    afwijkende bepalingen voor het wijnoogstjaar 1991/1992 met betrekking tot de mededeling,
    door de producenten, van de voor verplichte distillatie te leveren hoeveelheden
    tafelwijn #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 826/92 DA COMISSÃO de 1 de Abril de 1992 que estabelece
    uma medida derrogatória para a campanha de 1991/1992 no que diz respeito à comunicação
    pelos produtores das suas quantidades de vinho de mesa a entregar para destilação
    obrigatória #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 826/92 DE LA COMISIÓN de 1 de abril de 1992 por el
    que se establece una medida de excepción, con respecto a la campaña de 1991/92,
    en cuanto a la comunicación que deben efectuar los productores sobre las cantidades
    de vino de mesa que tienen que destinar a destilación obligatoria #'
  type: main
