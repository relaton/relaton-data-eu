title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2803/81 of 28 September 1981 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2803/81 du Conseil, du 28 septembre 1981, modifiant
    le règlement (CEE) n° 3035/80 établissant, pour certains produits agricoles
    exportés sous forme de marchandises ne relevant pas de l' annexe II du traité,
    les règles générales relatives à l' octroi des restitutions à l' exportation
    et les critères de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2803/81 des Rates vom 28. September 1981 zur Änderung
    der Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln für die
    Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2803/81 af 28. september 1981 om ændring
    af forordning (EØF) nr. 3035/80 om fastsættelse af almindelige regler for ydelse
    af eksportrestitutioner og om fastlæggelse af kriterierne for fastsættelse af
    restitutionsbeløbet for visse landbrugsprodukter, der udføres i form af varer,
    som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
