    μή υπαγομένων στό παράρτημα ΙΙ τής συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2803/81 del Consiglio, del 28 settembre 1981, che
    modifica il regolamento (CEE) n. 3035/80 che stabilisce, per taluni prodotti agricoli
    esportati sotto forma di merci non comprese nell' allegato II del trattato, le
    regole generali relative alla concessione delle restituzioni all' esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2803/81 van de Raad van 28 september 1981 houdende
    wijziging van Verordening (EEG) nr. 3035/80 tot vaststelling van de algemene regels
    aangaande de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2803/81 do Conselho, de 28 de Setembro de 1981,
    que altera o Regulamento (CEE) n.° 3035/80 que estabelece para certos produtos
    agrícolas exportados sob a forma de mercadorias não incluídas no Anexo II do
    Tratado, as regras gerais relativas à concessão das restituições à exportação
    e os critérios de fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2803/81 del Consejo, de 28 de septiembre de 1981,
    por el que se modifica el Reglamento (CEE) n° 3035/80 por el que se establecen,
    para determinados productos agrícolas exportados en forma de mercancías no incluidas
    en el Anexo II del Tratado, las normas generales relativas a la concesión de
    restituciones a la exportación y los criterios para la fijación de su importe
  type: main
