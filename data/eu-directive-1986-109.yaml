    siemeniin, jotka on virallisesti varmennettu "perussiemeniksi" tai "varmennetuiksi
    siemeniksi"
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1986. február 27.) a meghatározott fajtájú
