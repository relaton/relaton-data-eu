    vetőmagokra való korlátozásáról
  type: main
- language: it
  script: Latn
  content: Direttiva 86/109/CEE della Commissione del 27 febbraio 1986 che limita
    la commercializzazione delle sementi di talune specie di piante foraggere, oleaginose
    e da fibra alle sementi ufficialmente certificate «sementi di base» o «sementi
    certificate»
  type: main
