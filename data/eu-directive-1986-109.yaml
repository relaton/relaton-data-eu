    zaad" is goedgekeurd
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji z dnia 27 lutego 1986 r. ograniczająca obrót materiałem
    siewnym niektórych gatunków roślin pastewnych oraz oleistych i włóknistych
    do materiału siewnego, który został urzędowo zakwalifikowany jako „elitarny
    materiał siewny” lub „kwalifikowany materiał siewny”
  type: main
- language: pt
  script: Latn
  content: Directiva 86/109/CEE da Comissão de 27 de Fevereiro de 1986 que limita
    a comercialização das sementes de certas espécies de plantas forrageiras e
    de plantas oleaginosas e de fibras às sementes que tenham sido oficialmente certificadas
    como sendo «sementes de base» ou «sementes certificadas»
  type: main
- language: ro
  script: Latn
  content: Directiva Comisiei din 27 februarie 1986 de limitare a comercializării
    semințelor din anumite specii de plante furajere și plante oleaginoase și pentru
    fibră la semințele care au fost certificate oficial ca „semințe de bază”
    sau „semințe certificate”
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie z 27. februára 1986, ktorou sa obmedzuje uvádzanie osiva
