title:
- language: en
  script: Latn
  content: Commission Directive 86/109/EEC of 27 February 1986 limiting the marketing
    of seed of certain species of fodder plants and oil and fibre plants to seed which
    has been officially certified as 'basic seed' or 'certified seed'
  type: main
- language: fr
  script: Latn
  content: Directive 86/109/CEE de la Commission du 27 février 1986 limitant la commercialisation
    des semences de certaines espèces de plantes fourragères et de plantes oléagineuses
    et à fibres aux semences qui ont été officiellement certifiées «semences
    de base» ou «semences certifiées»
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/109/EWG der Kommission vom 27. Februar 1986 zur Beschränkung
    des Verkehrs mit Saatgut bestimmter Arten von Futter-, Öl- und Faserpflanzen
    auf amtlich als "Basissaatgut" oder "Zertifiziertes Saatgut" anerkanntes Saatgut
  type: main
- language: bg
  script: Cyrl
  content: Директива на Комисията от 27 февруари 1986
    година относно ограничаване на търговията
    със семената от някои видове фуражни култури
    и маслодайни и влакнодайни култури до семена,
    които са официално сертифицирани като „базови
    семена“ или „сертифицирани семена“
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise ze dne 27. února 1986 o omezení uvádění osiva některých
    druhů pícnin, olejnin a přadných rostlin na trh na osiva úředně uznaná
    jako „základní osivo“ nebo „certifikované osivo“
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 86/109/EØF af 27. februar 1986 om begrænsning
    af handelen med frø af visse arter foderplanter samt af olie- og spindplanter
    til kun at omfatte frø, der er officielt certificeret som »basisfrø« eller
    »certificeret frø«
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/109/ΕΟΚ της Επιτροπής της 27ης Φεβρουαρίου
    1986 για τον περιορισμό της εμπορίας σπόρων προς
    σπορά ορισμένων ειδών κτηνοτροφικών φυτών,
    ελαιούχων και κλωστικών φυτών στους σπόρους
    προς σπορά που έχουν πιστοποιηθεί επίσημα
    ως «βασικοί σπόροι» ή «πιστοποιημένοι σπόροι»
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv, 27. veebruar 1986, millega lubatakse teatavate söödakultuuride
    ning õli- ja kiudtaimede liikide seemne turustamist ainult juhul, kui see on
    ametlikult sertifitseeritud “eliitseemne” või “sertifitseeritud seemnena”
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 86/109/ETY, annettu 27 päivänä helmikuuta 1986,
