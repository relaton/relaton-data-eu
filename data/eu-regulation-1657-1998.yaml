title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1657/98 of 27 July 1998 determining the percentage
    of quantities which may be allowed in respect of import licence applications lodged
    in July 1998 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1657/98 de la Commission du 27 juillet 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1998 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1279/98 pour la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1657/98 der Kommission vom 27. Juli 1998 zur Bestimmung
    des Prozentsatzes, zu dem den im Juli 1998 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Fleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß Verordnung (EG)
    Nr. 1279/98 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1657/98 af 27. juli 1998 om fastsættelse
