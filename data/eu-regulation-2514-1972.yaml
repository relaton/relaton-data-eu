  content: Règlement (CEE) n° 2514/72 de la Commission, du 29 novembre 1972, fixant
    les taux de restitution applicables, à compter du 1er décembre 1972, au sucre
    et à la mélasse exportés sous forme de marchandises ne relevant pas de l'annexe
    II du Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2514/72 der Kommission vom 29. November 1972 zur Festsetzung
    der ab 1. Dezember 1972 geltenden Erstattungssätze bei der Ausfuhr von Zucker
    und Melasse in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2514/72 della Commissione, del 29 novembre 1972, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 dicembre 1972,
    allo zucchero e al melasso esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2514/72 van de Commissie van 29 november 1972 houdende
    vaststelling van de restituties die met ingang van 1 december 1972 worden toegepast
    voor suiker en melasse, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
