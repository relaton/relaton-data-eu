title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/75/EU of 13 March 2014 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for mercury
    in cold cathode fluorescent lamps (CCFLs) for back-lighting liquid crystal displays,
    not exceeding 5 mg per lamp, used in industrial monitoring and control instruments
    placed on the market before 22 July 2017
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/75/UE de la Commission du 13 mars 2014 modifiant,
    aux fins de son adaptation au progrès technique, l'annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le mercure contenu dans les lampes fluorescentes à cathode froide, à raison
    de 5 milligrammes de mercure par lampe au maximum, servant au rétroéclairage
    des écrans à cristaux liquides utilisés dans les instruments de contrôle et
    de surveillance industriels mis sur le marché avant le 22 juillet 2017
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/75/EU der Kommission vom 13. März 2014 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Quecksilber in Kaltkathoden-Fluoreszenz-Lampen (CCF-Lampen)
    für hintergrundbeleuchtete Flüssigkristallanzeigen mit nicht mehr als 5 mg je
    Lampe zur Verwendung in vor dem 22. Juli 2017 in Verkehr gebrachten industriellen
    Überwachungs- und Kontrollinstrumenten
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/75/ЕС на Комисията
    от 13 март 2014 година за изменение, с цел адаптиране
    към техническия прогрес, на приложение IV към
    Директива 2011/65/ЕС на Европейския парламент
    и на Съвета по отношение на освобождаването
    за живак във флуоресцентни лампи със студен
    катод (ФЛСК) за течнокристални екрани с подсветка,
    който не превишава 5 mg на лампа, използвани
    в промишлените прибори за контрол и управление,
    пуснати на пазара преди 22 юли 2017 г.
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/75/EU ze dne 13. března
    2014 , kterou se za účelem přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    rtuť v zářivkách se studenou katodou (CCFL) pro podsvícení displejů na
    bázi tekutých krystalů, v množství nepřevyšujícím 5 mg na zářivku,
    používaných v průmyslových monitorovacích a kontrolních přístrojích
    uvedených na trh před 22. červencem 2017
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/75/EU af 13. marts 2014 om ændring
    med henblik på tilpasning til den tekniske udvikling af bilag IV til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for anvendelsen
    af kviksølv i koldkatodelysstofrør (CCFL) til bagbelysning i LCD-skærme (højst
    5 mg kviksølv pr. lyskilde), som indgår i industrielle overvågnings- og reguleringsinstrumenter,
    der bringes i omsætning inden den 22. juli 2017
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία 2014/75/ΕΕ της Επιτροπής,
    της 13ης Μαρτίου 2014 , για την τροποποίηση, με
    σκοπό την προσαρμογή στην τεχνική πρόοδο, του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τη χρήση υδραργύρου σε λαμπτήρες
    φθορισμού ψυχρής καθόδου (CCFL) για οθόνες υγρών
    κρυστάλλων οπίσθιου φωτισμού, σε ποσότητα
    που δεν υπερβαίνει τα 5 mg ανά λαμπτήρα, οι οποίες
    χρησιμοποιούνται σε βιομηχανικά όργανα παρακολούθησης
    και ελέγχου που έχουν διατεθεί στην αγορά πριν
    τις 22 Ιουλίου 2017
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/75/EL, 13. märts 2014 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb elavhõbeda kasutamist
    enne 22. juulit 2017 turule lastud tööstuslikes seire- ja kontrolliseadmetes
    kasutatavates taustvalgusega vedelkristallekraanide külmkatood-luminofoorlampides
    koguses mitte üle 5 mg lambi kohta
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/75/EU, annettu 13 päivänä maaliskuuta
    2014 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    elohopeaa taustavalollisiin nestekidenäyttöihin tarkoitetuissa kylmäkatodiloistelampuissa,
    lamppua kohden enintään 5 mg, joita käytetään ennen 22 päivää heinäkuuta
    2017 markkinoille saatettavissa teollisuuden tarkkailu- ja valvontalaitteissa
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/75/EU оd 13. ožujka 2014. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za živu u hladnokatodnim fluorescentnim
    cijevima za pozadinski osvijetljene zaslone s tekućim kristalima, u kojima sadržaj
    žive ne premašuje 5 mg po cijevi, a koje se koriste u instrumentima za praćenje
    i kontrolu u industriji stavljenima na tržište prije 22. srpnja 2017. Tekst
    važan za EGP
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/75/EU felhatalmazáson alapuló irányelve ( 2014. március
    13. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a 2017. július 22. előtt forgalomba hozott ipari felügyeleti és vezérlő
    eszközökben a folyadékkristályos kijelzők háttérvilágítására használt
    hidegkatódos fénycsövekben (CCFL) lámpánként legfeljebb 5 mg mennyiségben
    jelen lévő higany mentesítése tekintetében, a műszaki fejlődéshez történő
    hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/75/UE della Commissione, del 13 marzo 2014 , che
    modifica, adattandolo al progresso tecnico, l'allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un'esenzione relativa
    al mercurio nelle lampade fluorescenti a catodo freddo destinate all'uso negli
    schermi retroilluminati a cristalli liquidi e contenenti non più di 5 mg di mercurio
    per lampada, utilizzate in strumenti di monitoraggio e controllo industriali immessi
    sul mercato antecedentemente al 22 luglio 2017
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/75/ES ( 2014. gada 13. marts ), ar
    ko, pielāgojot zinātnes un tehnikas attīstībai, groza Eiropas Parlamenta un
    Padomes Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu, kas ļauj
    izmantot 5 mg dzīvsudraba katrā aukstā katoda luminiscences spuldzē ( CCFL
    ) aizmugurapgaismojuma šķidro kristālu displejiem, kurus izmanto rūpnieciskajos
    monitoringa un kontroles instrumentos, kas laisti tirgū līdz 2017. gada 22.
    jūlijam
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 13 d. Komisijos deleguotoji direktyva 2014/75/ES, kuria, derinant
    prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir Tarybos
    direktyvos 2011/65/ES IV priedo nuostatos dėl gyvsidabrio naudojimo skystakristalių
    monitorių foninio apšvietimo šaltojo katodo liuminescencinėse lempose (neviršijant
    5 mg gyvsidabrio lempoje), kurios naudojamos rinkai iki 2017 m. liepos 22 d. pateiktuose
    pramoniniuose stebėjimo ir kontrolės prietaisuose, išimties
  type: main
- language: mt
  script: Latn
  content: Direttiva ta' Delega tal-Kummissjoni 2014/75/UE tat- 13 ta' Marzu 2014
    li temenda, għal skopijiet ta' adattament għall-progress tekniku, l-Anness IV
    tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta' eżenzjoni
    għall-merkurju f'bozoz florexxenti bil-katodu kiesaħ (CCFLs) għal skrins bil-kristalli
    likwidi li jixegħlu minn wara, mhux aktar minn 5 mg għal kull bozza, użati
    fi strumenti ta' monitoraġġ u kontroll industrijali mqiegħda fis-suq qabel
    it- 22 ta' Lulju 2017
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/75/EU van de Commissie van 13 maart 2014 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor kwik in fluorescentielampen met koude cathode (CCFL's) voor
    lcd-beeldschermen met achtergrondverlichting met niet meer dan 5 mg kwik per lamp
    voor gebruik in industriële meet- en regelapparatuur die vóór 22 juli 2017
    in de handel is gebracht
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/75/UE z dnia 13 marca 2014 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik IV do dyrektywy Parlamentu
    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla rtęci w lampach
    fluorescencyjnych z zimną katodą (CCFL) do podświetlanych wyświetlaczy ciekłokrystalicznych
    o zawartości rtęci nieprzekraczającej 5 mg na lampę, wykorzystywanych w przyrządach
    do nadzoru i kontroli w obiektach przemysłowych wprowadzonych do obrotu przed
    dniem 22 lipca 2017 r.
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/75/UE da Comissão, de 13 de março de 2014 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para a utilização de mercúrio, numa quantidade não superior a 5 mg/lâmpada,
    em lâmpadas fluorescentes de cátodo frio para retroiluminação de ecrãs de
    cristais líquidos de instrumentos industriais de monitorização e controlo colocados
    no mercado antes de 22 de julho de 2017
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/75/UE a Comisiei din 13 martie 2014 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    mercurul din lămpile fluorescente cu catod rece — maximum 5 mg pe lampă —
    folosite pentru iluminarea din spate a afișajelor cu cristale lichide din componența
    instrumentelor industriale de monitorizare și control introduse pe piață înainte
    de 22 iulie 2017
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/75/EÚ z 13. marca 2014 , ktorou sa na
    účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pri používaní ortuti
    v žiarivkách so studenou katódou (CCFL) na podsvietenie obrazoviek z tekutých
    kryštálov s maximálnym obsahom 5 mg na žiarivku, používaných v priemyselných
    monitorovacích a kontrolných prístrojoch uvedených na trh pred 22. júlom
    2017
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/75/EU z dne 13. marca 2014 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za živo srebro, v hladnih katodnih fluorescentnih sijalkah (CCFL) za osvetlitev
    ozadja zaslonov s tekočimi kristali, ki se uporabljajo v instrumentih za spremljanje
    in nadzor za industrijsko uporabo, danih na trg pred 22. julijem 2017 , kadar
    količina živega srebra ne presega 5 mg na sijalko, zaradi prilagoditve tehničnemu
    napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/75/UE de la Comisión, de 13 de marzo de 2014 ,
    que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el mercurio contenido en lámparas fluorescentes de cátodo frío (CCFL),
    a razón de 5 mg por lámpara como máximo, para pantallas de cristal líquido
    (LCD) con retroiluminación utilizadas en los instrumentos industriales de vigilancia
    y control introducidos en el mercado antes del 22 de julio de 2017
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/75/EU av den 13 mars 2014 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för kvicksilver i kallkatodlysrör
    för bakgrundsbelysta bildskärmar med flytande kristaller, inte överskridande
    5 mg per lampa, som används i industriella övervaknings- och kontrollinstrument
    som släpps ut på EU-marknaden före den 22 juli 2017
  type: main
