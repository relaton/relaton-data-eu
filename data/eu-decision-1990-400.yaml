  script: Latn
  content: '90/400/EEC: Commission Decision of 3 May 1990 amending Commission Decision
    89/288/EEC establishing an initial list of declining industrial areas concerned
    by Objective 2 as defined by Council Regulation (EEC) No 2052/88'
  type: main
- language: fr
  script: Latn
  content: '90/400/CEE: Décision de la Commission du 3 mai 1990 modifiant la décision
    89/288/CEE de la Commission établissant une première liste des zones industrielles
    en déclin concernées par l''objectif n° 2 comme défini par le règlement (CEE)
    n° 2052/88 du Conseil'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 3. Mai 1990 zur Aenderung der Entscheidung
    89/288/EWG der Kommission zur Aufstellung eines ersten Verzeichnisses der Industriegebiete
    mit ruecklaeufiger Entwicklung, die unter das in der Verordnung (EWG) Nr. 2052/88
    des Rates festgelegte Ziel Nr. 2 fallen (90/400/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 3. maj 1990 om aendring af Kommissionens beslutning
    89/288/EOEF om fastlaeggelse af en foerste liste over industriomraader i tilbagegang,
    der beroeres af maal nr. 2 som fastlagt i Raadets forordning (EOEF) nr. 2052/88
    (90/400/EOEF)
  type: main
- language: el
  script: Grek
