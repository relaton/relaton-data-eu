    που εξουσιοδοτούν τη Γερμανία να περιορίσει
    την εμπορία των σπόρων για σπορά ορισμένων
    ποικιλιών καλλιεργουμένων φυτικών ειδών'
  type: main
- language: it
  script: Latn
  content: '92/227/CEE: Decisione della Commissione del 3 aprile 1992 recante modificazione
