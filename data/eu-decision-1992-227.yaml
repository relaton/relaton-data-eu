    van bepaalde rassen van landbouwgewassen te beperken (Slechts de tekst in de Duitse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/227/CEE: Decisão da Comissão de 3 de Abril de 1992 que altera certas
