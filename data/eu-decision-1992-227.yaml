  content: '92/227/EEC: Commission Decision of 3 April 1992 amending certain decisions
    authorizing Germany to restrict the marketing of seed of certain varieties of
    agricultural plant species (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/227/CEE: Décision de la Commission du 3 avril 1992 modifiant certaines
    décisions autorisant l''Allemagne à restreindre la commercialisation de semences
    de certaines variétés d''espèces de plantes agricoles (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '92/227/EWG: Entscheidung der Kommission vom 3. April 1992 zur Änderung
    von Entscheidungen zur Ermächtigung Deutschlands, den Verkehr mit Saatgut bestimmter
    Sorten landwirtschaftlicher Pflanzenarten zu beschränken (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/227/EØF: Kommissionens beslutning af 3. april 1992 om ændring af
    visse beslutninger om bemyndigelse af Tyskland til at begrænse handelen med frø
    af visse sorter af landbrugsprodukter (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '92/227/ΕΟΚ: Απόφαση της Επιτροπής της 3ης Απριλίου
