    commercializzazione delle sementi di talune varietà di specie di piante agricole
    (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '92/227/EEG: Beschikking van de Commissie van 3 april 1992 tot wijziging
