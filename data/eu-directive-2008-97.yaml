    gospodarstwach hodowlanych niektórych związków o działaniu hormonalnym, tyreostatycznym
    i β-agonistycznym
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/97/CE do Parlamento Europeu e do Conselho, de 19 de Novembro
