    de utilização de certas substâncias com efeitos hormonais ou tireostáticos
    e de substâncias β-agonistas em produção animal
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/97/CE a Parlamentului European și a Consiliului din 19
