title:
- language: en
  script: Latn
  content: '78/328/EEC: Commission Decision of 16 March 1978 extending Commission
    Decision 78/200/EEC of 20 January 1978 authorizing Member States to permit temporarily
    the marketing of forestry reproductive material not complying with requirements
    of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '78/328/CEE: Décision de la Commission, du 16 mars 1978, complétant la
    décision 78/200/CEE de la Commission du 20 janvier 1978 autorisant les États
    membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: '78/328/EWG: Entscheidung der Kommission vom 16. März 1978 zur Ergänzung
    der Entscheidung 78/200/EWG vom 20. Januar 1978 zur Ermächtigung der Mitgliedstaaten,
    vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '78/328/EØF: Kommissionens beslutning af 16. marts 1978 om tillæg til
    Kommissionens beslutning 78/200/EØF af 20. januar 1978 om bemyndigelse af medlemsstaterne
    til midlertidigt at tillade handel med forstligt formeringsmateriale, der ikke
    opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '78/328/ΕΟΚ: Απόφαση τής Επιτροπής τής 16ης
    Μαρτίου 1978 περί συμπληρώσεως τής αποφάσεως
    78/200/ΕΟΚ τής Επιτροπής τής 20ής Ιανουαρίου 1978
    «περί εξουσιοδοτήσεως τών Κρατών μελών νά
    αποδέχονται προσωρινά τήν εμπορία δασικού
    πολλαπλασιαστικού υλικού πού δέν ανταποκρίνεται
    στίς απαιτήσεις τής οδηγίας 66/404/ΕΟΚ τού Συμβουλίου»'
  type: main
- language: it
  script: Latn
  content: '78/328/CEE: Decisione della Commissione, del 16 marzo 1978, che completa
    la decisione 78/200/CEE che autorizza gli Stati membri ad ammettere temporaneamente
    la commercializzazione di materiali di riproduzione di alcune specie forestali
    che non corrispondono alle esigenze della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '78/328/EEG: Beschikking van de Commissie van 16 maart 1978 tot aanvulling
    van Beschikking 78/200/EEG van de Commissie van 20 januari 1978 houdende machtiging
    van de Lid-Staten om tijdelijk bosbouwkundig teeltmateriaal tot de handel toe
    te laten dat niet voldoet aan de eisen van Richtlijn 66/404/EEG van de Raad'
  type: main
