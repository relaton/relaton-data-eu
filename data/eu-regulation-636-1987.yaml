  content: Regolamento (CEE) n. 636/87 della Commissione del 2 marzo 1987 che ripristina
    la riscossione dei dazi doganali applicabili agli ami e piccole reti a mano per
    qualsiasi uso, oggetti per la pesca con la lenza; zimbelli artificiali da richiamo,
