title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 636/87 of 2 March 1987 re-establishing the
    levying of customs duties on fish-hooks, line fishing rods and tackle; fish landing
    nets and butterfly nets; decoy 'birds' , lark mirrors and similar hunting or shooting
    requisites, falling within subheading 97.07 B, originating in South Korea, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 636/87 de la Commission du 2 mars 1987 portant rétablissement
    de la perception des droits de douane applicables aux hameçons et épuisettes
    pour tous usages, articles pour la pêche à la ligne, appelants, miroirs à alouettes
    et articles de chasse similaires de la sous-position 97.07 B du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 636/87 der Kommission vom 2. März 1987 zur Wiedereinführung
    der Erhebung der Zölle für Angelhaken, Angelgeräte, Handnetze zum Landen von
    Fischen, Schmetterlingsnetze, Lockvögel, Lerchenspiegel und ähnliche Jagdgeräte
    der Tarifstelle 97.07 B des Gemeinsamen Zolltarifs mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 636/87 af 2. marts 1987 om genindførelse
