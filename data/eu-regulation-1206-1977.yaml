title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1206/77 of 7 June 1977 maintaining the interim
    protective measures with regard to imports into the United Kingdom of cotton yarn,
    not put up for retail sale, originating in the Republic of India
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1206/77 du Conseil, du 7 juin 1977, maintenant les
    mesures de protection provisoires concernant les importations au Royaume-Uni de
    fils de coton non conditionnés pour la vente au détail et originaires de la
    République de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1206/77 des Rates vom 7. Juni 1977 zur Aufrechterhaltung
    der vorläufigen Schutzmaßnahmen bei der Einfuhr von Baumwollgarnen, nicht in
    Aufmachungen für den Einzelverkauf, mit Ursprung in der Republik Indien, in das
    Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1206/77 af 7. juni 1977 om opretholdelse
    af de midlertidige beskyttelsesforanstaltninger ved indførsel til Det forenede
    Kongerige af garn af bomuld, ikke i detailsalgsoplægninger, med oprindelse i
    republikken Indien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1206/77 del Consiglio, del 7 giugno 1977, che mantiene
    le misure di salvaguardia provvisorie concernenti le importazioni nel Regno Unito
    di filati di cotone non preparati per la vendita al minuto ed originari della
    Repubblica dell'India
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1206/77 van de Raad van 7 juni 1977 houdende handhaving
    van de voorlopige beschermende maatregelen met betrekking tot de invoer in het
    Verenigd Koninkrijk van garens van katoen, niet gereed voor de verkoop in het
    klein, van oorsprong uit de Republiek India
