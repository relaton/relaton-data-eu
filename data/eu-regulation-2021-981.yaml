---
id: EURegulation2021981
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2021/981 of 17 June 2021 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase produced
    by Aspergillus niger CBS 109.713 and endo-1,4-beta-glucanase produced by Aspergillus
    niger DSM 18404 as a feed additive for poultry species, ornamental birds and weaned
    piglets (holder of the authorisation: BASF SE), and repealing Regulation (EC)
    No 271/2009 and Implementing Regulation (EU) No 1068/2011'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2021/981 de la Commission du 17 juin 2021
    concernant le renouvellement de l’autorisation d’une préparation d’endo-1,4-β-xylanase
    produite par Aspergillus niger CBS 109.713 et d’endo-1,4-β-glucanase produite
    par Aspergillus niger DSM 18404 en tant qu’additif pour l’alimentation des
    espèces de volailles, des oiseaux d’ornement et des porcelets sevrés (titulaire
    de l’autorisation: BASF SE), et abrogeant le règlement (CE) no 271/2009 et
    le règlement d’exécution (UE) no 1068/2011'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2021/981 der Kommission vom 17. Juni 2021
    zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase,
    gewonnen aus Aspergillus niger CBS 109.713, und Endo-1,4-beta-Glucanase, gewonnen
    aus Aspergillus niger DSM 18404, als Zusatzstoff in Futtermitteln für Geflügelarten,
    Ziervögel und entwöhnte Ferkel (Zulassungsinhaber: BASF SE) sowie zur Aufhebung
    der Verordnung (EG) Nr. 271/2009 und der Durchführungsverordnung (EU) Nr. 1068/2011'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2021/981 на Комисията
    от 17 юни 2021 година за подновяване на разрешението
    за употреба на препарат, който съдържа ендо-1,4-бета-ксиланаза,
    получена от Aspergillus niger CBS 109.713, и ендо-1,4-бета-глюканаза,
    получена от Aspergillus niger DSM 18404, като фуражна добавка
    за домашни птици, декоративни птици и отбити
    прасенца (притежател на разрешителното: BASF
    SE) и за отмяна на Регламент (ЕО) № 271/2009 и Регламент
    за изпълнение (ЕС) № 1068/2011'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2021/981 ze dne 17. června 2021
    o obnovení povolení přípravku z endo-1,4-beta-xylanázy z Aspergillus niger
    CBS 109.713 a endo-1,4-beta-glukanázy z Aspergillus niger DSM 18404 jako doplňkové
    látky pro druhy drůbeže, okrasné ptáky a odstavená selata (držitel povolení:
    BASF SE) a o zrušení nařízení (ES) č. 271/2009 a prováděcího nařízení
    (EU) č. 1068/2011'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2021/981 af 17. juni 2021
    om forlængelse af godkendelse af et præparat af endo-1,4-beta-xylanase produceret
    af Aspergillus niger CBS 109.713 og endo-1,4-beta-glucanase produceret af Aspergillus
    niger DSM 18404 som tilsætningsstof til foder til fjerkræarter, prydfugle og
    fravænnede smågrise (indehaver af godkendelsen: BASF SE) og om ophævelse af
    forordning (EF) nr. 271/2009 og gennemførelsesforordning (EU) nr. 1068/2011'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2021/981 της Επιτροπής
    της 17ης Ιουνίου 2021 σχετικά με την ανανέωση
    της άδειας παρασκευάσματος ενδο-1,4-β-ξυλανάσης
    που παράγεται από Aspergillus niger CBS 109.713 και ενδο-1,4-β-γλυκανάσης
    που παράγεται από Aspergillus niger DSM 18404 ως πρόσθετης
    ύλης ζωοτροφών για είδη πουλερικών, διακοσμητικά
    πτηνά και απογαλακτισμένα χοιρίδια (κάτοχος
    της άδειας: BASF SE) και για την κατάργηση του κανονισμού
    (ΕΚ) αριθ. 271/2009 και του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 1068/2011'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/981, 17. juuni 2021, millega pikendatakse
    luba kasutada Aspergillus niger’i (CBS 109.713) abil saadud endo-1,4-β-ksülanaasi
    ja Aspergillus niger’i (DSM 18404) abil saadud endo-1,4-β-glükanaasi preparaati
    kodulinnuliikide, dekoratiivlindude ja võõrutatud põrsaste söödalisandina
    (loa hoidja BASF SE) ning tunnistatakse kehtetuks määrus (EÜ) nr 271/2009 ja
    rakendusmäärus (EL) nr 1068/2011
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/981, annettu 17 päivänä
    kesäkuuta 2021, Aspergillus niger (CBS 109.713) -organismin tuottamaa endo-1,4-beeta-ksylanaasia
    ja Aspergillus niger (DSM 18404) -organismin tuottamaa endo-1,4-beeta-glukanaasia
    sisältävän valmisteen hyväksynnän uusimisesta siipikarjan, koristetarkoituksessa
    pidettävien lintujen ja vieroitettujen porsaiden rehun lisäaineena (hyväksynnän
    haltija BASF SE) sekä asetuksen (EY) N:o 271/2009 ja täytäntöönpanoasetuksen
    (EU) N:o 1068/2011 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2021/981 ón gCoimisiún an 17 Meitheamh
    2021 maidir leis an athnuachan ar údarú ullmhóide d’ion-1,4-béite-xiolanáis
    arna táirgeadh ag Aspergillus niger CBS 109.713 agus ion-1,4-béite-ghlúcanáis
    arna táirgeadh ag Aspergillus niger DSM 18404 mar bhreiseán beathaithe le haghaidh
    speicis éanlaithe clóis, éin ornáideacha agus bainbh scoite (sealbhóir an
    údaraithe: BASF SE), agus lena n-aisghairtear Rialachán (CE) Uimh. 271/2009
    agus Rialachán Cur Chun Feidhme (AE) Uimh. 1068/2011'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2021/981 оd 17. lipnja 2021. o produljenju
    odobrenja pripravka endo-1,4-beta-ksilanaze dobivene od Aspergillus niger CBS
    109.713 i endo-1,4-beta-glukanaze dobivene od Aspergillus niger DSM 18404 kao
    dodatka hrani za životinje za vrste peradi, ukrasne ptice i odbijenu prasad (nositelj
    odobrenja: BASF SE) te o stavljanju izvan snage Uredbe (EZ) br. 271/2009 i Provedbene
    uredbe (EU) br. 1068/2011'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2021/981 végrehajtási rendelete (2021. június 17.)
    az Aspergillus niger CBS 109.713 által termelt endo-1,4-béta-xilanázt és az
    Aspergillus niger DSM 18404 által termelt endo-1,4-béta-glükanázt tartalmazó
    készítmény baromfifajok, díszmadarak és elválasztott malacok takarmány-adalékanyagaként
    történő engedélyezésének megújításáról (az engedély jogosultja: BASF
    SE), valamint a 271/2009/EK rendelet és az 1068/2011/EU végrehajtási rendelet
    hatályon kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2021/981 della Commissione del 17 giugno
    2021 relativo al rinnovo dell’autorizzazione di un preparato di endo-1,4-beta-xilanasi
    prodotta da Aspergillus niger CBS 109.713 e di endo-1,4-beta-glucanasi prodotta
    da Aspergillus niger DSM 18404 come additivo per mangimi destinati a specie avicole,
    uccelli ornamentali e suinetti svezzati (titolare dell’autorizzazione: BASF
    SE), e che abroga il regolamento (CE) n. 271/2009 e il regolamento di esecuzione
    (UE) n. 1068/2011'
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/981 (2021. gada 17. jūnijs),
    ar ko atjauno atļauju no Aspergillus niger CBS 109.713 iegūtas endo-1,4-beta-ksilanāzes
    un no Aspergillus niger DSM 18404 iegūtas endo-1,4-beta-glikanāzes preparātu
    izmantot par barības piedevu mājputniem, dekoratīvajiem putniem un atšķirtiem
    sivēniem (atļaujas turētājs BASF SE) un ar ko atceļ Regulu (EK) Nr. 271/2009
    un Īstenošanas regulu (ES) Nr. 1068/2011
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/981 2021 m. birželio 17
    d. dėl leidimo naudoti endo-1,4-beta-ksilanazės, gaunamos iš Aspergillus niger
    CBS 109.713, ir endo-1,4-beta-gliukanazės, gaunamos iš Aspergillus niger DSM
    18404, preparatą kaip naminių paukščių, dekoratyvinių paukščių ir nujunkytų
    paršelių pašarų priedą atnaujinimo (leidimo turėtojas – bendrovė BASF
    SE), kuriuo panaikinami Reglamentas (EB) Nr. 271/2009 ir Įgyvendinimo reglamentas
    (ES) Nr. 1068/2011
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/981 tas-17
    ta’ Ġunju 2021 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparazzjoni tal-endo-1,4-beta-ksilanażi
    prodotta mill-Aspergillus niger CBS 109.713 u tal-endo-1,4-beta-glukanażi prodotta
    mill-Aspergillus niger DSM 18404 bħala addittiv tal-għalf għall-ispeċijiet
    tat-tjur tal-irziezet, l-għasafar ornamentali u l-qżieżqeż miftuma (id-detentur
    tal-awtorizzazzjoni: BASF SE), u li jħassar ir-Regolament (KE) Nru 271/2009 u
    r-Regolament ta’ Implimentazzjoni (UE) Nru 1068/2011'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2021/981 van de Commissie van 17 juni 2021
    tot verlenging van de vergunning voor een preparaat van endo-1,4-bèta-xylanase
    geproduceerd door Aspergillus niger CBS 109.713, en endo-1,4-bèta-glucanase geproduceerd
    door Aspergillus niger DSM 18404, als toevoegingsmiddel voor diervoeding voor
    pluimveesoorten, siervogels en gespeende biggen (vergunninghouder: BASF SE), en
    tot intrekking van Verordening (EG) nr. 271/2009 en Uitvoeringsverordening (EU)
    nr. 1068/2011'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2021/981 z dnia 17 czerwca 2021
    r. dotyczące odnowienia zezwolenia na stosowanie preparatu endo-1,4-beta-ksylanazy
    wytwarzanej przez Aspergillus niger CBS 109.713 i endo-1,4-beta-glukanazy wytwarzanej
    przez Aspergillus niger DSM 18404 jako dodatku paszowego dla gatunków drobiu,
    ptaków ozdobnych i prosiąt odsadzonych od maciory (posiadacz zezwolenia: BASF
    SE) oraz uchylające rozporządzenie (WE) nr 271/2009 i rozporządzenie wykonawcze
    (UE) nr 1068/2011'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2021/981 da Comissão de 17 de junho de
    2021 relativo à renovação da autorização de uma preparação de endo-1,4-beta-xilanase
    produzida por Aspergillus niger CBS 109.713 e endo-1,4-beta-glucanase produzida
    por Aspergillus niger DSM 18404 como aditivo em alimentos para espécies de aves
    de capoeira, aves ornamentais e leitões desmamados (detentor da autorização:
    BASF SE), e que revoga o Regulamento (CE) n.o 271/2009 e o Regulamento de Execução
    (UE) n.o 1068/2011'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2021/981 al Comisiei din 17 iunie
    2021 privind reînnoirea autorizației unui preparat de endo-1,4-beta-xilanază
    produsă de Aspergillus niger CBS 109.713 și endo-1,4-beta-glucanază produsă
    de Aspergillus niger DSM 18404 ca aditiv furajer pentru speciile de păsări de
    curte, păsări ornamentale și purcei înțărcați (titularul autorizației:
    BASF SE) și de abrogare a Regulamentului (CE) nr. 271/2009 și a Regulamentului
    de punere în aplicare (UE) nr. 1068/2011'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2021/981 zo 17. júna 2021 o obnovení
    povolenia prípravku z endo-1,4-beta-xylanázy produkovanej hubou Aspergillus
    niger (CBS 109.713) a endo-1,4-beta-glukanázy produkovanej hubou Aspergillus
    niger (DSM 18404) ako kŕmnej doplnkovej látky pre druhy hydiny, okrasné vtáky
    a odstavené prasiatka (držiteľ povolenia: BASF SE) a o zrušení nariadenia
    (ES) č. 271/2009 a vykonávacieho nariadenia (EÚ) č. 1068/2011'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2021/981 z dne 17. junija 2021 o podaljšanju
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, ki jo proizvaja Aspergillus
    niger CBS 109.713, in endo-1,4-beta-glukanaze, ki jo proizvaja Aspergillus niger
    DSM 18404, kot krmni dodatek za vrste perutnine, okrasne ptice in odstavljene
    pujske (imetnik dovoljenja: BASF SE) ter razveljavitvi Uredbe (ES) št. 271/2009
    in Izvedbene uredbe (EU) št. 1068/2011'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2021/981 de la Comisión de 17 de junio
    de 2021 relativo a la renovación de la autorización de un preparado de endo-1,4-beta-xilanasa
    producida por Aspergillus niger (CBS 109.713) y endo-1,4-beta-glucanasa producida
    por Aspergillus niger (DSM 18404) como aditivo para piensos para especies de aves
    de corral, aves ornamentales y lechones destetados (titular de la autorización:
    BASF SE), y por el que se derogan el Reglamento (CE) n.o 271/2009 y el Reglamento
    de Ejecución (UE) n.o 1068/2011'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2021/981 av den 17 juni 2021
    om förlängningen av godkännandet av ett preparat av endo-1,4-beta-xylanas framställt
    av Aspergillus niger CBS 109.713 och endo-1,4-beta-glukanas framställt av Aspergillus
    niger DSM 18404 som fodertillsats för fjäderfäarter, burfåglar och avvanda
    smågrisar (innehavare av godkännandet: BASF SE) samt om upphävande av förordning
    (EG) nr 271/2009 och genomförandeförordning (EU) nr 1068/2011'
