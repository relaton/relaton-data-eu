    les annexes II et III du protocole nº 3 relatif à la définition de la notion
    de produits originaires et aux méthodes de coopération administrative par l'
    adjonction de règles alternatives de pourcentage pour les produits relevant des
    chapitres 84 à 92 de la nomenclature du conseil de coopération douanière
  type: main
