title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1354/85 of 23 May 1985 re-establishing the
    levying of customs duties on yarn of discontinuous or waste synthetic fibres,
    products of category 22 (code 40.0220), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1354/85 de la Commission du 23 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux fils de fibres textiles
    synthétiques discontinus, de la catégorie de produits no 22 (code 40.0220),
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1354/85 der Kommission vom 23. Mai 1985 über die
    Wiedereinführung des Zollsatzes für Garne aus synthetischen Spinnfasern der
    Warenkategorie Nr. 22 (Kennziffer 40.0220) mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1354/85 af 23. maj 1985 om genindførelse
    af opkrævning af toldafgifter for garn af korte syntetiske fibre eller af affald
    af kemofibre under varekategori nr. 22 (kode 40.0220) som har oprindelse i Indien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1354/85 της Επιτροπής
    της 23ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των τελωνειακών δασμών για νήματα από μη συνεχείς
    συνθετικές υφαντικές ίνες, προϊόντα της κατηγορίας
    22 (κωδικός 40.0220), καταγωγής Ινδίας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3563/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1354/85 della Commissione del 23 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ai filati di fibre tessili sintetiche
    in fiocco, della categoria di prodotti n. 22 (codice 40.0220), originari dell'
    India beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1354/85 van de Commissie van 23 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    synthetische stapelvezels, van de categorie van produkten nr. 22 (codenummer 40.0220),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
