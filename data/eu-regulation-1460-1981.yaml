title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1460/81 of 26 May 1981 specifying the extent
    to which applications lodged during the month of May 1981 for import licences
    in respect of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1460/81 de la Commission, du 26 mai 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de mai 1981, pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1460/81 der Kommission vom 26. Mai 1981 über das
    Ausmaß, in dem den im Mai 1981 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1460/81 af 26. maj 1981 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i maj
    1981 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1460/81 της Επιτροπής
    της 26ης Μαΐου 1981 περί καθορισμού σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Μάιο του 1981 για τα νεαρά άρρενα βοοειδή
    που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1460/81 della Commissione, del 26 maggio 1981, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di maggio 1981, per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1460/81 van de Commissie van 26 mei 1981 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in mei 1981 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
