  content: Commission Regulation (EEC) No 3510/87 of 23 November 1987 re-establishing
    the levying of customs duties on yarn of man-made fibres (continuous), products
    of category 43 (code 40.0430), originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3510/87 de la Commission du 23 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux fils de
    fibres textiles synthétiques et artificielles continues de la catégorie de produits
    n° 43 (code 40.0430), originaires du Brésil bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3510/87 der Kommission vom 23. November 1987 zur Wiedereinführung
    des Zollsatzes für synthetische und künstliche Spinnfäden der Warenkategorie
    Nr. 43 (Kennziffer 40.0430) mit Ursprung in Brasilien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3510/87 af 23. november 1987 om genindførelse
    af opkrævning af toldafgifter for garn af endeløse kemofibre under varekategori
    nr. 43 (kode 40.0430), som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
