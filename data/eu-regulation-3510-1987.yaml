    sintetiche ed artificiali continue, della categoria di prodotti n. 43 (codice
    40.0430), originari del Brasile beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3510/87 van de Commissie van 23 november 1987 houdende
