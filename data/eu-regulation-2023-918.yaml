    tulpina I-1237
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2023/918 zo 4. mája 2023, ktorým
    sa mení vykonávacie nariadenie (EÚ) č. 540/2011, pokiaľ ide o predĺženie
    období platnosti schválenia účinných látok aklonifén, ametoktradín, beflubutamid,
    bentiavalikarb, boskalid, kaptán, kletodím, cykloxydím, cyflumetofén, dazomet,
    diklofop, dimetomorf, etefón, fenazachín, fluopikolid, fluoxastrobín, flurochloridón,
    folpet, formetanát, Helicoverpa armigera nucleopolyhedrovirus, hymexazol, kyselina
    indolylmaslová, mandipropamid, metalaxyl, metaldehyd, metám, metazachlór, metribuzín,
    milbemektín, paklobutrazol, penoxsulam, fénmedifám, pirimifos-metyl, propamokarb,
    prochinazid, protiokonazol, S-metolachlór, Spodoptera littoralis nucleopolyhedrovirus,
    Trichoderma asperellum (kmeň T34) aTrichoderma atroviride (kmeň I-1237)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2023/918 z dne 4. maja 2023 o spremembi
