title:
- language: en
  script: Latn
  content: '82/858/EEC: Commission Decision of 2 December 1982 amending Decision 81/888/EEC
    extending, as regards certain non-member countries, the period relating to the
    checks on practices for the maintenance of varieties laid down in Directives 70/457/EEC
    and 70/458/EECs'
  type: main
- language: fr
  script: Latn
  content: '82/858/CEE: Décision de la Commission, du 2 décembre 1982, modifiant
    la décision 81/888/CEE, prorogeant, en ce qui concerne certains pays tiers, les
    périodes relatives aux contrôles des sélections conservatrices fixées dans
    les directives 70/457/CEE et 70/458/CEE'
  type: main
- language: de
  script: Latn
