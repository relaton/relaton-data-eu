    und 70/458/EWG vorgesehenen Fristen für die Kontrolle der Erhaltungszüchtungen
    für einige Drittländer'
  type: main
- language: da
  script: Latn
  content: '82/858/EØF: Kommissionens beslutning af 2. december 1982 om ændring
