type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 November 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to certain men's and boys' waterproof garments falling within
    heading No ex 61.01 of the Common Customs Tariff, originating in Taiwan and in
    free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 24 novembre 1975, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire certains vêtements imperméables pour hommes et garçonnets,
    de la position Ex 61.01 du Tarif douanier commun, originaires de la République
    fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. November 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Regenkleidung für Männer und Knaben der Tarifnummer ex 61.01 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 24. november 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage vandtæt yderbeklædning og vandafvisende regnbeklædning til mænd
    og drenge, som henhører under pos. ex 61.01 i den fælles toldtarif, har oprindelse
    i Taiwan og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 novembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario taluni impermeabili per uomo e per ragazzo della voce
    ex 61.01 della tariffa doganale comune originari di Taiwan e messi in libera pratica
    nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 november 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd bepaalde heren- en jongensregenkleding van post ex 60.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in de Bondsrepubliek Duitsland in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
