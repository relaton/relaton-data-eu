title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1193/88 of 29 April 1988 laying down detailed
    rules for the application of the special arrangements for imports of bran, sharps
    and other residues, whether or not in the form of pellets, derived from the sifting,
    milling or other working of cereals other than maize and rice covered by CN codes
    2302 30 and 2302 40
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1193/88 de la Commission du 29 avril 1988 portant
    modalités d' application du régime particulier d' importation de sons, remoulages
    et autres résidus, même agglomérés sous forme de pellets, du criblage, de
    la mouture ou d' autres traitements des céréales autres que de maïs et de riz
    relevant des codes NC 2302 30 et 2302 40
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1193/88 der Kommission vom 29. April 1988 mit Durchführungsbestimmungen
    für die besondere Regelung der Einfuhr von Kleie und anderen Rückständen, auch
    in Form von Pellets, vom Sichten, Mahlen oder von anderen Bearbeitungen von anderem
    Getreide als Mals und Reis der Unterpositionen 2302 30 und 2302 40 der Kombinierten
    Nomenklatur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1193/88 af 29. april 1988 om gennemførelsesbestemmelser
    for den særlige importordning for klid og andre restprodukter, også i form at
    piller (pellets), fra sigtning, formaling eller anden bearbejdning af korn bortset
    fra majs og ris, henhørende under KN-kode 2302 30 og 2302 40
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1193/88 της Επιτροπής
    της 29ης Απριλίου 1988 για λεπτομέρειες εφαρμογής
    του ειδικού καθεστώτος εισαγωγής πίτουρων
    εν γένει και άλλων υπολειμμάτων, παρουσιαζομένων
    υπό μορφή σβόλων ή όχι, από το κοσκίνισμα, το
    άλεσμα ή άλλες κατεργασίες των σιτηρών εκτός
    από το καλαμπόκι και το ρύζι, που υπάγονται
    στους κωδικούς ΣΟ 2302 30 και 2302 40
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1193/88, annettu 29 päivänä huhtikuuta 1988,
    CN-koodeihin 2302 30 ja 2302 40 kuuluvien leseiden, lesejauhojen sekä muiden
    viljojen kuin maissin ja riisin seulomisessa, jauhamisessa tai muussa käsittelyssä
    syntyneiden muiden jätetuotteiden, myös rakeistettujen, erityisen tuontijärjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1193/88 della Commissione del 29 aprile 1988 recante
    modalità di applicazione del regime speciale di importazione di crusche, stacciature
    ed altri residui, anche agglomerati in forma di pellets, della vagliatura, della
    molitura o di altre lavorazioni dei cereali diversi dal granturco e dal riso di
    cui ai codici NC 2302 30 e 2302 40
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1193/88 van de Commissie van 29 april 1988 houdende
    uitvoeringsbepalingen van de bijzondere invoerregeling voor zemelen, slijpsel
    en andere resten, al dan niet in de vorm van pellets, van het zeven, van het malen
    of van andere bewerkingen van andere granen dan maïs en rijst van de GN-codes
    2302 30 en 2302 40
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1193/88 da Comissão de 29 de Abril de 1988 que
    estabelece normas de execução do regime especial de importação de sêmeas,
    farelos e outros resíduos, mesmo aglomerados sob a forma de pellets, da peneiração,
    moagem ou de outros tratamentos de cereais com excepção dos milhos e do arroz,
    dos códigos NC 2302 30 e 2302 40
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1193/88 de la Comisión de 29 de abril de 1988 por
    el que se establecen las modalidades de aplicación del régimen especial de importación
    de salvados, moyuelos y otros residuos, presentados o no en forma de granulados,
    del cernido, de la molienda o de otros tratamientos de los cereales distintos
    del maíz y del arroz, incluidos en los códigos NC 2302 30 y 2302 40
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 1193/88 av den 29 april 1988 om fastställande
