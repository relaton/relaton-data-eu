    von Rückständen und Stoffen in lebenden Tieren und tierischen Erzeugnissen (Nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '98/152/EF: Kommissionens beslutning af 10. februar 1998 om godkendelse
    af den af Det Forenede Kongerige forelagte overvågningsplan til undersøgelse
    for restkoncentrationer og stoffer i levende dyr og produkter heraf (Kun den engelske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
