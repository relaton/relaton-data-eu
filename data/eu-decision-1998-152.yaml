    ja niistä saatavissa tuotteissa olevien jäämien tai aineiden tutkimiseksi (Ainoastaan
    englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '98/152/CE: Decisione della Commissione del 10 febbraio 1998 che approva
