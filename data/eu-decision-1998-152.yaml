title:
- language: en
  script: Latn
  content: '98/152/EC: Commission Decision of 10 February 1998 approving the monitoring
    plan for the detection of residues or substances in live animals and animal products
    presented by the United Kingdom (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '98/152/CE: Décision de la Commission du 10 février 1998 approuvant le
    plan de surveillance pour la recherche des résidus ou substances dans les animaux
    vivants et leurs produits, présenté par le Royaume-Uni (Le texte en langue anglaise
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '98/152/EG: Entscheidung der Kommission vom 10. Februar 1998 zur Genehmigung
