title:
- language: en
  script: Latn
  content: '97/481/EC: Council Decision of 26 June 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters between the European Community and Ukraine
    establishing a double-checking system without quantitative limits in respect of
    the export of certain steel products covered by the EC and ECSC Treaties from
    Ukraine to the European Community'
  type: main
- language: fr
  script: Latn
  content: '97/481/CE: Décision du Conseil du 26 juin 1997 relative à la conclusion
    d''un accord sous forme d''échange de lettres entre la Communauté européenne
    et l''Ukraine instituant un système de double contrôle sans limite quantitative
    pour l''exportation de certains produits sidérurgiques couverts par les traités
    CECA et CE d''Ukraine dans la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '97/481/EG: Beschluß des Rates vom 26. Juni 1997 über den Abschluß eines
    Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
