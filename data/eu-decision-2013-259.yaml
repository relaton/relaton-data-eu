title:
- language: en
  script: Latn
  content: '2013/259/EU: Commission Implementing Decision of 31 May 2013 amending
    Annex I to Decision 2004/211/EC as regards the entries for Bahrain and China in
    the list of third countries and parts thereof from which imports into the Union
    of live equidae and semen, ova and embryos of the equine species are authorised
    (notified under document C(2013) 2927)'
  type: main
- language: fr
  script: Latn
  content: '2013/259/UE: Décision d’exécution de la Commission du 31 mai 2013
    modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne les mentions
    relatives à Bahreïn et à la Chine figurant sur la liste des pays tiers et des
    parties de ces pays en provenance desquels les importations dans l’Union européenne
    d’équidés vivants et de sperme, d’ovules et d’embryons de l’espèce
    équine sont autorisées [notifiée sous le numéro C(2013) 2927]'
  type: main
- language: de
  script: Latn
  content: '2013/259/EU: Durchführungsbeschluss der Kommission vom 31. Mai 2013 zur
    Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich der Einträge
    für Bahrain und China in der Liste von Drittländern und Teilen von Drittländern,
    aus denen die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen
    und -embryonen in die Europäische Union zugelassen ist (Bekanntgegeben unter
    Aktenzeichen C(2013) 2927)'
  type: main
- language: bg
