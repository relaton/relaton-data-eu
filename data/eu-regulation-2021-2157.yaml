    των εισαγωγών που προέρχονται από αυτόν
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/2157, 6. detsember 2021, millega algatatakse
    rakendusmääruste (EL) 2021/1266 ja (EL) 2021/1267 (millega laiendatakse vastavalt
    lõplikku dumpinguvastast tollimaksu ja lõplikku tasakaalustavat tollimaksu Kanadast
    lähetatud biodiislikütuse impordile olenemata sellest, kas see on deklareeritud
    Kanadast pärinevana või mitte) läbivaatamine, et teha kindlaks võimalus vabastada
    üks Kanada eksportiv tootja nende meetmete kohaldamisest, ning tühistatakse
    dumpinguvastane tollimaks kõnealuselt eksportivalt tootjalt pärineva impordi
    suhtes ja kehtestatakse sellelt eksportivalt tootjalt pärineva impordi registreerimise
    nõue
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/2157, annettu 6 päivänä
    joulukuuta 2021, Kanadasta lähetetyn biodieselin tuontia koskevan lopullisen
    polkumyyntitullin ja lopullisen tasoitustullin soveltamisalan laajentamisesta
    riippumatta siitä, onko alkuperämaaksi ilmoitettu Kanada, annettuja täytäntöönpanoasetuksia
    (EU) 2021/1266 ja (EU) 2021/1267 koskevan tarkastelun vireillepanosta sen määrittämiseksi,
    voidaanko näistä toimenpiteistä myöntää vapautus yhdelle kanadalaiselle
    vientiä harjoittavalle tuottajalle, polkumyyntitullin kumoamisesta kyseisen vientiä
    harjoittavan tuottajan tuonnissa ja kyseisen vientiä harjoittavan tuottajan tuonnin
    kirjaamisvelvoitteesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/2157 ón gCoimisiún an 6 Nollaig
    2021 lena dtionscnaítear athbhreithniú ar Rialacháin Cur Chun Feidhme (AE)
    2021/1266 agus (AE) 2021/1267 lena leathnaítear faoi seach an dleacht frithdhumpála
    chinntitheach agus an dleacht frithchúitimh chinntitheach ar allmhairí bithdhíosail
    arna gcur chun bealaigh ó Cheanada a chumhdach, bíodh dearbhú ann gur de thionscnamh
    Cheanada iad nó ná bíodh, athbhreithniú chun a chinneadh an féidir díolúine
    ó na bearta sin a thabhairt do tháirgeoir onnmhairiúcháin amháin de chuid
    Cheanada, lena n-aisghairtear an dleacht frithdhumpála a mhéid a bhaineann le
    hallmhairí ón táirgeoir onnmhairiúcháin sin agus lena gcuirtear allmhairí
    ón táirgeoir onnmhairiúcháin sin faoi réir a gcláraithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/2157 оd 6. prosinca 2021. o pokretanju
    revizije provedbenih uredbi (EU) 2021/1266 i (EU) 2021/1267 o proširenju konačne
    antidampinške i kompenzacijske pristojbe na uvoz biodizela poslanog iz Kanade,
    bez obzira na to ima li deklarirano podrijetlo iz Kanade ili ne, radi utvrđivanja
    mogućnosti odobravanja izuzeća od tih mjera jednom kanadskom proizvođaču izvozniku,
    stavljanja izvan snage antidampinške pristojbe s obzirom na uvoz od tog proizvođača
    izvoznika te nametanja obveze evidentiranja njegova uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2157 végrehajtási rendelete (2021. december 6.)
    a Kanadában feladott, akár Kanadából származóként, akár nem ilyenként
    bejelentett biodízel behozatalára vonatkozó végleges dömpingellenes és kiegyenlítő
    vám kiterjesztésével kapcsolatos (EU) 2021/1266 és (EU) 2021/1267 végrehajtási
    rendelet felülvizsgálatának az intézkedések alól egy kanadai exportáló
    gyártó számára biztosítható mentesség lehetőségének megállapítása
    céljából történő megindításáról, a dömpingellenes vámnak az érintett
    exportáló gyártótól származó behozatalok tekintetében való hatályon
    kívül helyezéséről, valamint az érintett exportáló gyártótól érkező
    behozatalokra vonatkozó nyilvántartásbavételi kötelezettség bevezetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/2157 della Commissione del 6 dicembre
    2021 che avvia un riesame dei regolamenti di esecuzione (UE) 2021/1266 e (UE)
    2021/1267 che estendono rispettivamente il dazio antidumping definitivo e il dazio
    compensativo definitivo sulle importazioni di biodiesel spedito dal Canada, a
    prescindere dal fatto che venga dichiarato originario del Canada o no, allo scopo
    di determinare la possibilità di concedere un’esenzione da tali misure a un
    produttore esportatore canadese, che abroga il dazio antidumping sulle importazioni
    provenienti da detto produttore esportatore e che dispone la registrazione di
    tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/2157 (2021. gada 6. decembris),
    ar ko sāk pārskatīt Īstenošanas regulas (ES) 2021/1266 un (ES) 2021/1267,
    ar kurām attiecīgi galīgo antidempinga un galīgo kompensācijas maksājumu
    piemēro arī biodīzeļdegvielas importam, kas sūtīts no Kanādas un kam ir
    vai nav deklarēta izcelsme Kanādā, lai noteiktu, vai var piešķirt atbrīvojumu
    no šiem pasākumiem vienam Kanādas ražotājam eksportētājam, atceltu antidempinga
    maksājumu attiecībā uz šā ražotāja eksportētāja veikto importu un šā
    ražotāja eksportētāja veiktajam importam piemērotu reģistrāciju
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/2157 2021 m. gruodžio 6
    d. kuriuo inicijuojama Įgyvendinimo reglamentų (ES) 2021/1266 ir (ES) 2021/1267,
    kuriais išplečiamas atitinkamai galutinio antidempingo ir kompensacinio muito
    taikymas importuojamam iš Kanados siunčiamam biodyzelinui, deklaruojamam arba
    nedeklaruojamam kaip Kanados kilmės, peržiūra siekiant nustatyti galimybę
    atleisti nuo šių priemonių vieną Kanados eksportuojantį gamintoją, panaikinamas
    antidempingo muitas šio eksportuojančio gamintojo importuojamam produktui ir
    nustatoma privaloma šio eksportuojančio gamintojo importuojamo produkto registracija
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2157 tas-6
    ta’ Diċembru 2021 li jniedi rieżami tar-Regolamenti ta’ Implimentazzjoni
    (UE) 2021/1266 u (UE) 2021/1267 li jestendu, rispettivament, id-dazju antidumping
    u kumpensatorju definittiv fuq l-importazzjonijiet tal-bijodiżil ikkunsinnati
    mill-Kanada, kemm jekk iddikjarati li joriġinaw mill-Kanada kif ukoll jekk le,
    għall-finijiet tad-determinazzjoni tal-possibbiltà li tingħata eżenzjoni minn
    dawk il-miżuri lil produttur esportatur Kanadiż wieħed, li jħassar id-dazju
    antidumping fir-rigward tal-importazzjonijiet minn dak il-produttur esportatur
    u li jagħmel l-importazzjonijiet minn dak il-produttur esportatur soġġetti
    għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/2157 van de Commissie van 6 december 2021
    tot opening van een nieuw onderzoek ten aanzien van de Uitvoeringsverordeningen
    (EU) 2021/1266 en (EU) 2021/1267 tot verlenging van het definitieve antidumpingrecht
    respectievelijk het definitieve compenserende recht op uit Canada verzonden biodiesel,
    al dan niet aangegeven als van oorsprong uit Canada, met het oog op het bepalen
    van de mogelijkheid om vrijstelling van die maatregelen te verlenen aan één
    Canadese producent-exporteur, tot intrekking van het antidumpingrecht met betrekking
    tot de invoer van die producent-exporteur en tot registratie van de invoer van
    die producent-exporteur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/2157 z dnia 6 grudnia 2021
    r. wszczynające przegląd rozporządzeń wykonawczych (UE) 2021/1266 i (UE) 2021/1267,
    rozszerzających odpowiednio ostateczne cło antydumpingowe i wyrównawcze na
    przywóz biodiesla wysyłanego z Kanady, zgłoszonego lub niezgłoszonego jako
    pochodzący z Kanady, w celu określenia możliwości przyznania zwolnienia z
    tych środków jednemu kanadyjskiemu producentowi eksportującemu, uchylenia cła
    antydumpingowego w odniesieniu do przywozu od tego producenta eksportującego
    i poddania przywozu od tego producenta eksportującego rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/2157 da Comissão de 6 de dezembro
    de 2021 que dá início ao reexame dos Regulamentos de Execução (UE) 2021/1266
    e (UE) 2021/1267 que tornam extensivo, respetivamente, o direito anti-dumping
    definitivo e o direito de compensação definitivo instituídos sobre as importações
    de biodiesel originário do Canadá, quer seja ou não declarado originário do
    Canadá, para efeitos de determinar a possibilidade de conceder uma isenção
    dessas medidas a um produtor-exportador canadiano, que revoga o direito anti-dumping
    no que diz respeito às importações provenientes desse produtor-exportador e
    que sujeita as importações desse produtor-exportador a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/2157 al Comisiei din 6 decembrie
    2021 de deschidere a unei reexaminări a Regulamentelor de punere în aplicare
    (UE) 2021/1266 și (UE) 2021/1267 de extindere a taxei antidumping definitive
    și, respectiv, a taxei compensatorii definitive asupra importurilor de biomotorină
    expediate din Canada, indiferent dacă au fost sau declarate ca fiind originare
    din Canada, în scopul stabilirii posibilității de a acorda unui producător-exportator
    canadian o scutire de la măsurile respective, de abrogare a taxei antidumping
    cu privire la importurile provenite de la respectivul producător-exportator și
    de înregistrare a importurilor de biomotorină provenite de la respectivul producător-exportator
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/2157 zo 6. decembra 2021, ktorým
    sa začína revízne prešetrovanie vykonávacích nariadení (EÚ) 2021/1266
    a (EÚ) 2021/1267, ktorými sa rozširuje konečné antidumpingové a vyrovnávacie
    clo na dovoz bionafty odosielanej z Kanady bez ohľadu na to, či má, alebo nemá
    deklarovaný pôvod v Kanade, s cieľom určiť, či je možné udeliť výnimku
    z uvedených opatrení jednému kanadskému vyvážajúcemu výrobcovi, zrušiť
    antidumpingové clo vzťahujúce sa na dovoz od uvedeného vyvážajúceho výrobcu
    a zaviesť registráciu dovozu od uvedeného vyvážajúceho výrobcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/2157 z dne 6. decembra 2021 o začetku
    pregleda izvedbenih uredb (EU) 2021/1266 in (EU) 2021/1267 o razširitvi dokončne
    protidampinške oziroma izravnalne dajatve na uvoz biodizla, poslanega iz Kanade,
    ne glede na to, ali je deklariran kot izdelek s poreklom iz Kanade ali ne, da
    se določi možnost odobritve izvzetja iz teh ukrepov enemu kanadskemu proizvajalcu
    izvozniku, razveljavi protidampinška dajatev na uvoz tega proizvajalca izvoznika
    in uvede registracija uvoza tega proizvajalca izvoznika
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/2157 de la Comisión de 6 de diciembre
    de 2021 por el que se inicia una reconsideración de los Reglamentos de Ejecución
    (UE) 2021/1266 y (UE) 2021/1267, por los que se amplían, respectivamente, el
    derecho antidumping definitivo y los derechos compensatorios definitivos sobre
    las importaciones de biodiésel expedido desde Canadá, esté o no declarado como
    originario de Canadá, a fin de determinar la posibilidad de conceder una exención
    en relación con tales medidas a un productor exportador canadiense, derogar el
    derecho antidumping con respecto a las importaciones procedentes de ese productor
    exportador y someter a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/2157 av den 6 december
    2021 om inledande av en översyn av genomförandeförordningar (EU) 2021/1266
    och (EU) 2021/1267 vad gäller utvidgning av den slutgiltiga antidumpningstullen
    respektive utjämningstullen på import av biodiesel som avsänts från Kanada,
    oavsett om produktens deklarerade ursprung är Kanada eller inte, i syfte att
    fastställa möjligheten att bevilja en kanadensisk exporterande tillverkare befrielse
    från dessa åtgärder, upphäva antidumpningstullen på import från denna exporterande
    tillverkare och göra import från denna exporterande tillverkare till föremål
    för registrering
  type: main
