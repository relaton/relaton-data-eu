---
id: EURegulation20212157
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/2157 of 6 December 2021 initiating
    a review of Implementing Regulations (EU) 2021/1266 and (EU) 2021/1267 extending,
    respectively, the definitive anti-dumping and countervailing duty on imports of
    biodiesel consigned from Canada, whether declared as originating in Canada or
    not, for the purposes of determining the possibility of granting an exemption
    from those measures to one Canadian exporting producer, repealing the anti-dumping
    duty with regard to imports from that exporting producer and making imports from
    that exporting producer subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/2157 de la Commission du 6 décembre
    2021 portant ouverture d’un réexamen des règlements d’exécution (UE) 2021/1266
    et (UE) 2021/1267 portant extension, respectivement, du droit antidumping définitif
    et du droit compensateur définitif institués sur les importations de biodiesel
    expédié du Canada, qu’il ait ou non été déclaré originaire de ce pays,
    afin d’étudier la possibilité d’accorder une exemption de ces mesures à
    un producteur-exportateur canadien, abrogeant le droit antidumping en ce qui concerne
    les importations provenant de ce producteur-exportateur et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/2157 der Kommission vom 6. Dezember
    2021 zur Einleitung einer Überprüfung der Durchführungsverordnungen (EU) 2021/1266
    und (EU) 2021/1267 zur Ausweitung des endgültigen Antidumpingzolls bzw. des endgültigen
    Ausgleichszolls auf die aus Kanada versandten Einfuhren von Biodiesel, ob als
    Ursprungserzeugnisse Kanadas angemeldet oder nicht, zwecks Prüfung der Möglichkeit
    einer Befreiung eines kanadischen ausführenden Herstellers von diesen Maßnahmen,
    zur Außerkraftsetzung des Antidumpingzolls auf die von diesem ausführenden Hersteller
    stammenden Einfuhren und zur zollamtlichen Erfassung der von diesem ausführenden
    Hersteller stammenden Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/2157 на Комисията
    от 6 декември 2021 година за започване на преглед
    на регламенти за изпълнение (ЕС) 2021/1266 и (ЕС)
    2021/1267 на Комисията за разширяване на обхвата
    съответно на окончателното антидъмпингово
