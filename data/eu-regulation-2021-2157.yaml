    и въвеждане на регистрационен режим за вноса
    от този производител износител
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/2157 ze dne 6. prosince 2021,
    kterým se zahajuje přezkum prováděcích nařízení (EU) 2021/1266 a (EU)
    2021/1267, kterými se konečné antidumpingové a konečné vyrovnávací clo
    rozšiřuje na dovoz bionafty zasílané z Kanady, bez ohledu na to, zda je u
    ní deklarován původ z Kanady, jehož účelem je zjistit, zda lze od těchto
    opatření osvobodit jednoho kanadského vyvážejícího výrobce, zrušit antidumpingové
    clo, pokud jde o dovoz od tohoto vyvážejícího výrobce, a zavést celní evidenci
    dovozu od tohoto vyvážejícího výrobce
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/2157 af 6. december 2021
    om indledning af en fornyet undersøgelse af gennemførelsesforordning (EU) 2021/1266
    og (EU) 2021/1267 om udvidelse af henholdsvis den endelige antidumpingtold og
    den endelige udligningstold på importen af biodiesel afsendt fra Canada, uanset
    om varen er angivet med oprindelse i Canada, med henblik på at fastslå, om der
    kan bevilges en fritagelse for disse foranstaltninger til en enkelt canadisk eksporterende
    producent, om ophævelse af antidumpingtolden på importen fra denne eksporterende
    producent og om registrering af importen fra denne eksporterende producent
  type: main
