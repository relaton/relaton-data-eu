title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2215/91 of 24 July 1991 re-establishing
    the levying of customs duties on products of categories 10, 18, 39, 40 and 74
    (order Nos 40.0100, 40.0180, 40.0390, 40.0400 and 40.0740), originating in Pakistan,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 2215/91 de la Commission, du 24 juillet 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 10 (numéro d' ordre 40.0100), 18 (numéro d' ordre 40.0180),
    39 (numéro d' ordre 40.0390), 40 (numéro d' ordre 40.0400) et 74 (numéro d'
    ordre 40.0740) originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2215/91 der Kommission vom 24. Juli 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 10 (laufende
    Nummer 40.0100), der Kategorie Nr. 18 (laufende Nummer 40.0180), der Kategorie
    Nr. 39 (laufende Nummer 40.0390), der Kategorie Nr. 40 (laufende Nummer 40.0400)
    und der Kategorie Nr. 74 (laufende Nummer 40.0740) mit Ursprung in Pakistan, dem
    die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2215/91 af 24. juli 1991 om genindførelse
    af opkrævning af told for varer under kategori 10 (løbenummer 40.0100), kategori
    18 (løbenummer 40.0180), kategori 39 (løbenummer 40.0390), kategori 40 (løbenummer
    40.0400) og kategori 74 (løbenummer 40.0740), som har oprindelse i Pakistan og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3832/90
  type: main
- language: el
  script: Grek
