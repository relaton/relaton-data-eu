  script: Latn
  content: '74/505/EEC: Commission Decision of 17 September 1974 authorizing the Member
    States to approve for marketing reproductive material of certain forest species
    satisfying less stringent requirements'
  type: main
- language: fr
  script: Latn
  content: '74/505/CEE: Décision de la Commission, du 17 septembre 1974, autorisant
    les États membres à admettre à la commercialisation des matériels de reproduction
    de certaines espèces forestières soumis à des exigences réduites'
  type: main
- language: de
  script: Latn
  content: '74/505/EWG: Entscheidung der Kommission vom 17. September 1974, mit der
    die Mitgliedstaaten ermächtigt werden, Vermehrungsgut bestimmter forstlicher
    Arten mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen'
  type: main
- language: da
  script: Latn
  content: '74/505/EØF: Kommissionens Beslutning af 17. september 1974 om bemyndigelse
