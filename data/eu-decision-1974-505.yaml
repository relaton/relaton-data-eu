    arter, der opfylder mindre strenge krav'
  type: main
- language: it
  script: Latn
  content: '74/505/CEE: Decisione della Commissione, del 17 settembre 1974, che autorizza
    gli Stati membri ad ammettere alla commercializzazione materiali di riprodozuone
    di alcune specie forestali soggette a esigenze ridotte'
  type: main
- language: nl
  script: Latn
  content: '74/505/EEG: Beschikking van de Commissie van 17 september 1974 houdende
