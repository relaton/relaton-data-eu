title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 575/81 of 4 March 1981 determining to what
    extent applications for import licences lodged during the month of February 1981
    for high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 575/81 de la Commission, du 4 mars 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d' importation
    déposées au mois de février 1981 pour les viandes bovines de haute qualité,
    fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 575/81 der Kommission vom 4. März 1981 zur Bestimmung
    des Maßstabs für die Genehmigung der im Februar 1981 eingereichten Anträge
    auf Einfuhrlizenzen für frisches, gekühltes oder gefrorenes Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 575/81 af 4. marts 1981 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicencer, som er indgivet i februar
    1981 for oksekød af høj kvalitet, fersk, kølet eller frosset, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 575/81 τής Επιτροπής
    τής 4ης Μαρτίου 1981 περί καθορισμού τού μέτρου
    εντός τού οποίου δύναται νά δοθεί συνέχεια
    στίς αιτήσεις πιστοποιητικών εισαγωγής πού
    κατετέθησαν τόν Φεβρουάριο 1981 γιά βόεια κρέατα
    υψηλής ποιότητος, νωπά, διατηρημένα δι απλής
    ψύξεως ή κατεψυγμένα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 575/81 della Commissione, del 4 marzo 1981, che determina
    in quale misura possono essere accolte le domande di titoli d' importazione presentate
    nel mese di febbraio 1981 per le carni bovine di qualità pregiata, fresche, refrigerate
    o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 575/81 van de Commissie van 4 maart 1981 tot vaststelling
