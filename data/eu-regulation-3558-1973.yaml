  content: Regulation (EEC) No 3558/73 of the Commission of 21 December 1973 authorizing
    the United Kingdom to suspend temporarily and totally the customs duties on mackerel
    and horse mackerel imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3558/73 de la Commission, du 21 décembre 1973, autorisant
    le Royaume-Uni à suspendre temporairement et totalement le droit de douane applicable
    aux maquereaux et chinchards importés en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3558/73 der Kommission vom 21. Dezember 1973 zur Ermächtigung
    des Vereinigten Königreichs, den Zoll auf aus anderen Mitgliedstaaten eingeführte
    Makrelen und Stöcker zeitweilig und vollständig auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3558/73 af 21. december 1973 om bemyndigelse
    for Det forenede Kongerige til midlertidigt og fuldstændigt at suspendere tolden
    på makreller og hestemakreller, indført fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3558/73 della Commissione, del 21 dicembre 1973, che
    autorizza il Regno Unito a sospendere temporaneamente e totalmente i dazi doganali
    applicabili agli sgombri e suri importati in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3558/73 van de Commissie van 21 december 1973 waarbij
    het Verenigd Koninkrijk wordt gemachtigd tot tijdelijke en gehele schorsing van
    het douanerecht op uit andere Lid-Staten ingevoerde makrelen en horsmakrelen
