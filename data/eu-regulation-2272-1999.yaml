title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2272/1999 of 27 October 1999 determining
    the extent to which applications lodged in October 1999 for import licences for
    certain poultrymeat sector products pursuant to Regulation (EC) No 509/97 can
    be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2272/1999 de la Commission, du 27 octobre 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1999 pour certains produits du secteur de la viande de volaille dans
    le cadre du règlement (CE) n° 509/97 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2272/1999 der Kommission vom 27. Oktober 1999 über
    die Festsetzung des Umfangs, in dem die im Oktober 1999 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Produkte des Sektors Geflügelfleisch entsprechend
    der Verordnung (EG) Nr. 509/97 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2272/1999 af 27. oktober 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1999 om importlicenser for visse produkter fra fjerkrækødssektoren i forbindelse
    med forordning (EF) nr. 509/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2272/1999 της Επιτροπής,
    της 27ης Οκτωβρίου 1999, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Οκτώβριο 1999 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    του κρέατος πουλερικών στα πλαίσια του κανονισμού
    (ΕΚ) αριθ. 509/97
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2272/1999, annettu 27 päivänä lokakuuta 1999,
    määrättyyn järjestelmään liittyvien lokakuussa 1999 jätettyjen tiettyjä
    siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 509/97 mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2272/1999 della Commissione, del 27 ottobre 1999, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1999 per taluni prodotti del settore del pollame
    nel quadro del regolamento (CE) n. 509/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2272/1999 van de Commissie van 27 oktober 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector slachtpluimvee, die in
    oktober 1999 worden ingediend op grond van Verordening (EG) nr. 509/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2272/1999 da Comissão, de 27 de Outubro de 1999,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de aves de capoeira apresentados em
    Outubro de 1999 ao abrigo do Regulamento (CE) n° 509/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2272/1999 de la Comisión, de 27 de octubre de 1999,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de aves
    de corral presentadas en el mes de octubre de 1999 al amparo del Reglamento (CE)
    n° 509/97
  type: main
- language: sv
  script: Latn
