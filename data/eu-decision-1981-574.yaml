  content: '81/574/EEC: Council Decision of 20 July 1981 adapting, consequent upon
    the accession of Greece, Decision 80/344/EEC adopting a second research programme
    in the field of medical and public health research, consisting of four multiannual
    concerted projects'
  type: main
- language: fr
  script: Latn
  content: '81/574/CEE: Décision du Conseil, du 20 juillet 1981, portant adaptation,
    à la suite de l'' adhésion de la Grèce aux Communautés européennes, de la
    décision 80/344/CEE arrêtant un deuxième programme de recherche dans le domaine
    de la recherche médicale et de la santé publique consistant en quatre actions
    concertées pluriannuelles'
  type: main
- language: de
  script: Latn
