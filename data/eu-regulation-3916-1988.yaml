    ueber die Nichtwiedereinziehung der variablen Schlachtpraemie bei Erzeugnissen
    des Schaf- und Ziegenfleischsektors, die aus der Gemeinschaft ausgefuehrt worden
    sind
  type: main
- language: da
  script: Latn
