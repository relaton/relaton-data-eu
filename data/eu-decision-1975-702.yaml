title:
- language: en
  script: Latn
  content: Commission Decision of 30 October 1975 authorizing the United Kingdom not
    to apply Community treatment to bananas falling within subheading 08.01 B of the
    Common Customs Tariff, originating in Columbia, Costa Rica and Ecuador, and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/702/CEE: Décision de la Commission, du 30 octobre 1975, autorisant
    le Royaume-Uni à exclure du traitement communautaire les bananes, de la position
    08.01 B du Tarif douanier commun, originaires de Colombie, Costa Rica, et Équateur,
    et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 30. Oktober 1975, mit der das Vereinigte
    Königreich ermächtigt wird, Bananen der Tarifstelle 08.01 B des Gemeinsamen
    Zolltarifs mit Ursprung in Kolumbien, Costa Rica und Ecuador, die sich in den
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 30. oktober 1975 om bemyndigelse for Det forenede
    kongerige til at udelukke bananer under pos. 08.01 B i den fælles toldtarif med
    oprindelse i Colombia, Costa-Rica og Equador, som er i fri omsætning i andre
    medlemsstater, fra fællesskabsbehandling
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 ottobre 1975, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario le banane della sottovoce 08.01
    B della tariffa doganale comune, originarie della Colombia, Costa Rica ed Ecuador,
    e immesse in libera pratica in altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 30 oktober 1975 waarbij het Verenigd Koninkrijk
    wordt gemachtigd bananen van post 08.01 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Colombia, Costa-Rica en Ecuador en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
