    Königreich in der Woche vom 25. November bis 1. Dezember 1985 verlassen haben,
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3512/85 af 12. december 1985 om fastsættelse
