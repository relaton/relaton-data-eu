title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2002/78 of 22 August 1978 re-establishing
    the levying of customs duties on wrought plates, sheets and strip, of aluminium,
    falling within heading No 76.03, originating in Yugoslavia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2002/78 de la Commission, du 22 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en aluminium, d'une épaisseur de plus de 0,20 millimètre,
    de la position tarifaire 76.03, originaires de la Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2002/78 der Kommission vom 22. August 1978 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Aluminium, mit einer
    Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2002/78 af 22. august 1978 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af aluminium under position
    76.03, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2002/78 della Commissione, del 22 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri, di alluminio, di spessore superiore a 0,20 mm, della voce doganale
    76.03, originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2002/78 van de Commissie van 22 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen,
    bladen en strippen, van aluminium, met een dikte van meer dan 0,20 mm, van post
    76.03, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG)
    nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
