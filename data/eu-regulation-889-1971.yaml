  content: Règlement (CEE) n° 889/71 de la Commission, du 29 avril 1971, portant
    fixation des coefficients d'adaptation servant au calcul des indemnités et des
    compensations financières pour les produits de la pêche retirés du marché
    et au calcul du prix d'achat des sardines et anchois
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 889/71 der Kommission vom 29. April 1971 zur Festsetzung
    von Anpassungskoeffizienten für die Berechnung der Entschädigungen und des finanziellen
    Ausgleichs für aus dem Handel genommene Fischereierzeugnisse und die Berechnung
    des Ankaufspreises von Sardinen und Sardellen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 889/71 della Commissione, del 29 aprile 1971, che
    fissa i coefficienti di adattamento per il calcolo delle indennità e delle compensazioni
    finanziarie applicabili ai prodotti della pesca ritirati dal mercato e per il
    calcolo del prezzo d'acquisto delle sardine e delle acciughe
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 889/71 van de Commissie van 29 april 1971 houdende
    vaststelling van de aanpassingscoëfficiënten voor de berekening van de financiële
    vergoedingen voor uit de markt genomen visserijprodukten en voor de berekening
    van de aankoopprijs van sardines en ansjovis
  type: main
