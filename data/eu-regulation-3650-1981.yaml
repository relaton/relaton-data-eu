title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3650/81 of 18 December 1981 amending for
    the seventh time the list in Regulation (EEC) No 572/73 setting out the egg and
    poultrymeat products eligible for the advance fixing of export refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3650/81 de la Commission, du 18 décembre 1981, portant
    septième modification du règlement (CEE) n° 572/73 établissant la liste des
    produits des secteurs des oeufs et de la viande de volaille bénéficiant du régime
    de la fixation à l' avance des restitutions à l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3650/81 der Kommission vom 18. Dezember 1981 zur siebten
    Änderung der Liste im Anhang der Verordnung (EWG) Nr. 572/73 zur Festlegung der
    Erzeugnisse auf dem Eiersektor und auf dem Sektor Geflügelfleisch, die für eine
    Vorausfestsetzung der Ausfuhrerstattung in Frage kommen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3650/81 af 18. december 1981 om syvende
    ændring af forordning (EØF) nr. 572/73 om fastsættelse af de æg og fjerkrækødprodukter,
    der kommer i betragtning ved forudfastsættelse af eksportrestitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3650/81 τής Επιτροπής
    τής 18ης Δεκεμβρίου 1981 περί εβδόμης τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 572/73 περί καθορισμού
    τού πίνακος τών προϊόντων στόν τομέα τών αυγών
    καί τού κρέατος πουλερικών πού υπόκεινται
    στό καθεστώς προκαθορισμού τών επιστροφών
    κατά τήν εξαγωγήο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3650/81 della Commissione, del 18 dicembre 1981, recante
    settima modifica del regolamento (CEE) n. 572/73 che stabilisce l' elenco dei
    prodotti del settore delle uova e del pollame ai quali è concesso il beneficio
    della fissazione anticipata della restituzione all' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3650/81 van de Commissie van 18 december 1981 tot
    zevende wijziging van Verordening (EEG) nr. 572/73 houdende vaststelling van de
    produkten in de sector eieren en de sector slachtpluimvee die voor vaststelling
    vooraf van de uitvoerrestitutie in aanmerking komen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3650/81 da Comissão, de 18 de Dezembro de 1981,
    que estabelece a sétima alteração do Regulamento (CEE) n.° 572/73 que estabelece
    a lista dos produtos dos sectores dos ovos e da carne de aves de capoeira que
    beneficiam do regime de fixação antecipada das restituições à exportação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3650/81 de la Comisión, de 18 de diciembre de 1981,
    sobre la séptima modificación del Reglamento (CEE) n° 572/73 por el que se
    establece la lista de los productos de los sectores de los huevos y de la carne
    de aves de corral que se benefician del régimen de fijación previa de las restituciones
    a la exportación
