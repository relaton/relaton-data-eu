title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2477/75 of the Commission of 29 September 1975 providing
    for greater flexibility in the arrangements governing the issue of import licences
    (EXIM) laid down in Regulation (EEC) No 1090/75 in respect of the market in beef
    and veal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2477/75 de la Commission, du 29 septembre 1975, assouplissant
    le régime de délivrance de certificats d' importation (EXIM) établi par le
    règlement (CEE) n° 1090/75 dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2477/75 der Kommission vom 29. September 1975 zur
    Auflockerung des mit der Verordnung (EWG) Nr. 1090/75 über den Rindfleischsektor
    eingeführten Einfuhrlizenzensystems (EXIM)
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2477/75 af 29. september 1975 om lempelse
    af den ordning med udstedelse af importlicenser (EXIM), der er fastsat ved forordning
    (EØF) nr. 1090/75 inden for oksekødsektoren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2477/75 della Commissione, del 29 settembre 1975,
