type: standard
title:
- language: en
  script: Latn
  content: 'Commission Decision of 30 November 1976 authorizing the Federal Republic
    of Germany not to apply Community treatment to certain women''s, girls'' and infants''
    outer garments: shirts and blouses, falling within subheading ex 61.02 B of the
    Common Customs Tariff, originating in the Republic of Korea and in free circulation
    in the Netherlands and the United Kingdom'
  type: main
- language: fr
  script: Latn
  content: '77/74/CEE: Décision de la Commission, du 30 novembre 1976, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    certains vêtements de dessus pour femmes, fillettes et jeunes enfants : chemisiers
    et blouses, de la position Ex 61.02 B du Tarif douanier commun, originaires de
    la République de Corée et mis en libre pratique aux Pays-Bas et au Royaume-Uni'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 30. November 1976, mit der die Bundesrepublik
    Deutschland ermächtigt wird, gewisse aus der Republik Korea stammende und in
    den Niederlanden und im Vereinigten Königreich im freien Verkehr befindliche
    Oberkleidung für Frauen, Mädchen und Kleinkinder: Blusen der Tarifstelle ex
    61.02 B des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens Beslutning af 30. november 1976 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage følgende yderbeklædningsgenstande
    til kvinder, piger og småbørn: bluser, som henhører under pos. ex 61.02 B i
    den fælles toldtarif, har oprindelse i republikken Korea og frit kan omsættes
    i Nederlandene og i Det forenede Kongerige'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 30 novembre 1976, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario taluni indumenti
    esterni per donna, per ragazza e per bambini, camicette e bluse, della sottovoce
    ex 61.02 B della tariffa doganale comune, originari della Repubblica di Corea
    e messi in libera pratica nei Paesi Bassi e nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 30 november 1976 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bepaalde damesbovenkleding, meisjesbovenkleding en
    kinderbovenkleding: blouses, van post ex 61.02 B van het gemeenschappelijk douanetarief,
    van oorsprong uit de Republiek Korea en in Nederland en het Verenigd Koninkrijk
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
