title:
- language: en
  script: Latn
  content: '82/116/EEC: Commission Decision of 1 February 1982 authorizing extension
    of the period for informing the issuing agency of the results of an invitation
    to tender in Mexico in the milk and milk products sector'
  type: main
- language: fr
  script: Latn
  content: '82/116/CEE: Décision de la Commission, du 1er février 1982, autorisant
    la prorogation du délai pour informer l'' organisme de délivrance des résultats
    d'' une adjudication au Mexique, dans le secteur du lait et des produits laitiers'
  type: main
- language: de
  script: Latn
  content: '82/116/EWG: Entscheidung der Kommission vom 1. Februar 1982 zur Verlängerung
    der Frist, in der die lizenzerteilende Stelle über die Ergebnisse einer in Mexiko
    durchgeführten Ausschreibung auf dem Sektor Milch und Milcherzeugnisse unterrichtet
    werden muß'
  type: main
- language: da
  script: Latn
  content: '82/116/EØF: Kommissionens beslutning af 1. februar 1982 om tilladelse
    til at forlænge den frist, inden for hvilken det udstedende organ skal underrettes
    om udfaldet af en licitation i Mexico vedrørende mælk og mejeriprodukter'
  type: main
- language: el
  script: Grek
  content: '82/116/EOK: Απόφαση τής Επιτροπής τής 1ης Φεβρουαρίου
    1982 περί εξουσιοδοτήσεως παρατάσεως τής προθεσμίας
    γιά νά ενημερωθεί ο οργανισμός εκδόσεως περί
    τών αποτελεσμάτων διαγωνισμού στό Μεξικό στόν
    τομέα τού γάλακτος καί τών γαλακτοκομικών
    προϊόντων'
  type: main
- language: it
  script: Latn
  content: '82/116/CEE: Decisione della Commissione, del 1° febbraio 1982, che autorizza
    la proroga del termine per comunicare all'' organismo incaricato del rilascio
    i risultati di una gara indetta in Messico, nel settore del latte e dei prodotti
    lattiero-caseari'
  type: main
- language: nl
  script: Latn
  content: '82/116/EEG: Beschikking van de Commissie van 1 februari 1982 waarbij machtiging
    wordt gegeven om de termijn voor het mededelen aan de voor de afgifte bevoegde
    instantie van de resultaten van een inschrijving in Mexico in de sector melk en
    zuivelprodukten te verlengen'
  type: main
