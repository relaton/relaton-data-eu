  script: Latn
  content: Council Directive 81/1015/EEC of 15 December 1981 amending Directive 76/625/EEC
    concerning the statistical surveys to be carried out by the Member States in order
    to determine the production potential of plantations of certain species of fruit
    trees
  type: main
- language: fr
  script: Latn
  content: Directive 81/1015/CEE du Conseil, du 15 décembre 1981, modifiant la directive
    76/625/CEE concernant les enquêtes statistiques à effectuer par les États membres
    en vue de déterminer le potentiel de production des plantations de certaines
    espèces d'arbres fruitiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 81/1015/EWG des Rates vom 15. Dezember 1981 zur Änderung der
    Richtlinie 76/625/EWG über die von den Mitgliedstaaten durchzuführenden statistischen
    Erhebungen zur Ermittlung des Produktionspotentials bestimmter Baumobstanlagen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 81/1015/EØF af 15. december 1981 om ændring af direktiv
    nr. 76/625/EØF om de statistiske undersøgelser, der skal foretages af medlemsstaterne
    for at bestemme produktionskapaciteten for plantager med visse arter af frugttræer
  type: main
- language: el
  script: Grek
  content: Οδηγία 81/1015/EOK του Συμβουλίου της 15ης Δεκεμβρίου
