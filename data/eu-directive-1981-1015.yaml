    των στατιστικών ερευνών που θα διενεργηθούν
    από τα κράτη μέλη για τον προσδιορισμό του
    δυναμικού παραγωγής των δενδρώνων ορισμένων
    ειδών οπωροφόρων δένδρων
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 81/1015/ETY, annettu 15 päivänä joulukuuta 1981,
    tilastotietojen keruusta jäsenvaltioissa tiettyjen hedelmälajien viljelmien
    tuotantomahdollisuuksien määrittämiseksi annetun direktiivin 76/625/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 81/1015/CEE del Consiglio, del 15 dicembre 1981,che modifica
    la direttiva 76/625/CEE relativa alle indagini statistiche da effettuarsi dagli
    Stati Membri per determinare il potenziale di produzione di alcune specie di alberi
    da frutta
  type: main
- language: nl
  script: Latn
  content: Richtlijn 81/1015/EEG van de Raad van 15 december 1981 tot wijziging van
    Richtlijn 76/625/EEG betreffende de door de Lid-Staten te houden statistische
    enquêtes, ten einde het produktiepotentieel van bepaalde soorten fruitbomen vast
    te stellen
  type: main
- language: pt
  script: Latn
  content: Directiva 81/1015/CEE do Conselho, de 15 de Dezembro de 1981, que altera
    a Directiva 76/625/CEE relativa aos inquéritos estatísticos a efectuar pelos
    Estados-Membros tendo em vista determinar o potencial de produção das plantações
    de certas espécies de árvores de fruto
  type: main
- language: es
  script: Latn
  content: Directiva 81/1015/CEE del Consejo, de 15 de diciembre de 1981, por la que
