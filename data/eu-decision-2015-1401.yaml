    panta Direktīvā 2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: 2015 m. liepos 14 d. Tarybos įgyvendinimo sprendimas (ES) 2015/1401, kuriuo
    Italijai leidžiama taikyti specialią priemonę, kuria nukrypstama nuo Direktyvos
    2006/112/EB dėl pridėtinės vertės mokesčio bendros sistemos 206 ir 226 straipsnių
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kunsill (UE) 2015/1401 tal-14 ta'
    Lulju 2015 li tawtorizza lill-Italja biex tintroduċi miżura speċjali li tidderoga
    mill-Artikoli 206 u 226 tad-Direttiva 2006/112/KE dwar is-sistema komuni ta' taxxa
    fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/1401 van de Raad van 14 juli 2015 waarbij
    Italië wordt gemachtigd een bijzondere maatregel toe te passen die afwijkt van
    de artikelen 206 en 226 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke
    stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2015/1401 z dnia 14 lipca 2015 r. w sprawie
    upoważnienia Włoch do wprowadzenia szczególnego środka stanowiącego odstępstwo
    od art. 206 oraz art. 226 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku
    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/1401 do Conselho, de 14 de julho de 2015,
    que autoriza a Itália a aplicar uma medida especial em derrogação aos artigos
    206.° e 226.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/1401 a Consiliului din 14 iulie
    2015 de autorizare a Italiei să aplice o măsură specială de derogare de la
    articolele 206 și 226 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2015/1401 zo 14. júla 2015, ktorým
    sa Taliansku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článkov
    206 a 226 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2015/1401 z dne 14. julija 2015 o dovoljenju
    Italiji, da uvede posebni ukrep, ki odstopa od členov 206 in 226 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/1401 del Consejo, de 14 de julio de 2015,
    por la que se autoriza a Italia a aplicar una medida especial de excepción a
    lo dispuesto en los artículos 206 y 226 de la Directiva 2006/112/CE relativa
    al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2015/1401 av den 14 juli 2015 om bemyndigande
    för Italien att införa en särskild åtgärd som avviker från artiklarna 206
    och 226 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
