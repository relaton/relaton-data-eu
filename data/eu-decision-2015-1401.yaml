title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2015/1401 of 14 July 2015 authorising
    Italy to introduce a special measure derogating from Articles 206 and 226 of Directive
    2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/1401 du Conseil du 14 juillet 2015 autorisant
    l'Italie à introduire une mesure particulière dérogatoire aux articles 206
    et 226 de la directive 2006/112/CE relative au système commun de taxe sur la
    valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/1401 des Rates vom 14. Juli 2015 zur
    Ermächtigung Italiens, eine von den Artikeln 206 und 226 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Regelung einzuführen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/1401 на Съвета
    от 14 юли 2015 година за предоставяне на разрешение
