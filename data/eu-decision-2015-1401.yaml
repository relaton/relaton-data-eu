    от членове 206 и 226 от Директива 2006/112/ЕО относно
    общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2015/1401 ze dne 14. července 2015,
    kterým se Itálii povoluje zavést zvláštní opatření odchylující se od
    článků 206 a 226 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2015/1401 af 14. juli 2015 om tilladelse
    til Italien til at indføre en særlig foranstaltning, der fraviger artikel 206
    og 226 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/1401 του Συμβουλίου,
    της 14ης Ιουλίου 2015, με την οποία επιτρέπεται
    στην Ιταλία να εφαρμόσει ειδικό μέτρο παρέκκλισης
    από το άρθρο 206 και το άρθρο 226 της οδηγίας 2006/112/ΕΚ
    σχετικά με το κοινό σύστημα φόρου προστιθέμενης
    αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2015/1401, 14. juuli 2015, millega antakse
    Itaaliale luba kehtestada erimeede, millega tehakse erand direktiivi 2006/112/EÜ
    (mis käsitleb ühist käibemaksusüsteemi) artiklitest 206 ja 226
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2015/1401, annettu 14 päivänä
    heinäkuuta 2015, Italialle annettavasta luvasta ottaa käyttöön yhteisestä
    arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY 206 ja 226 artiklasta
    poikkeava erityistoimenpide
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2015/1401 od 14. srpnja 2015. kojom se Italiji
    odobrava uvođenje posebne mjere kojom se odstupa od članaka 206. i 226. Direktive
    2006/112/EZ o zajedničkom sustavu poreza na dodanu vrijednost
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2015/1401 végrehajtási határozata (2015. július 14.)
    Olaszországnak a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK
    irányelv 206. és 226. cikkétől eltérő különös intézkedés bevezetésére
    történő felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/1401 del Consiglio, del 14 luglio 2015,
    che autorizza l'Italia ad introdurre una misura speciale di deroga agli articoli
    206 e 226 della direttiva 2006/112/CE, relativa al sistema comune d'imposta sul
    valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2015/1401 (2015. gada 14. jūlijs),
