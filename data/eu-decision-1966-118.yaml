title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 9 février 1966, relative à la demande
    du gouvernement français en vue de la reconduction des décisions du 31 mars
    1965 et du 29 juin 1965, autorisant une réduction tarifaire de 15 % applicable
    aux transports d'artichauts, de choux-fleurs et de pommes de terre primeurs en
    provenance de la Bretagne, effectués par chemin de fer ou par route sur une distance
    d'au moins 650 km
  type: main
- language: de
  script: Latn
  content: '66/118/EWG: Entscheidung der Kommission vom 9. Februar 1966 über den
    Antrag der französischen Regierung, die Entscheidungen der Kommission vom 31.
    März 1965 und 29. Juni 1965 über die Genehmigung einer Tarifermäßigung von
    15 v. H. für Beförderungen von Artischocken, Blumenkohl und Frühkartoffeln
    aus der Bretagne mit der Eisenbahn oder im Güterkraftverkehr über Entfernungen
    von mindestens 650 km zu verlängern'
  type: main
- language: it
  script: Latn
  content: '66/118/CEE: Decisione della Commissione, del 9 febbraio 1966, in ordine
    alla richiesta presentata dal Governo francese per una proroga di validità delle
    decisioni 31 marzo 1965 e 29 giugno 1965, con le quali si autorizzava una riduzione
    tariffaria del 15% per i trasporti di carciofi, cavolfiori e patate di primizia
    in provenienza dalla Bretagna, effettuati per ferrovia o su strada su una distanza
    di almeno 650 km'
  type: main
- language: nl
  script: Latn
  content: '66/118/EEG: Beschikking van de Commissie van 9 februari 1966 betreffende
    het verzoek van de Franse Regering om verlenging van de beschikkingen van 31 maart
    1965 en 29 juni 1965, waarbij machtiging wordt verleend tof het toepassen van
    een tariefreductie van 15% voor het vervoer van artisjokken, bloemkool en vroege
    aardappelen uit Bretagne dat per spoor of over de weg over een afstand van tenminste
    650 km plaatsvindt'
  type: main
