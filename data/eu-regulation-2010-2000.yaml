title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2010/2000 of 18 September 2000 further amending
    Regulation (EEC) No 3905/88 as regards definitive anti-dumping duties on imports
    of polyester yarn originating in Taiwan and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2010/2000 du Conseil du 18 septembre 2000 portant modification
    ultérieure du règlement (CEE) nº 3905/88 en ce qui concerne les droits antidumping
    définitifs sur les importations de fils de polyesters originaires de Taïwan
    et de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2010/2000 des Rates vom 18. September 2000 zur erneuten
    Änderung der Verordnung (EWG) Nr. 3905/88 hinsichtlich der endgültigen Antidumpingzölle
    auf die Einfuhren von Polyestergarn mit Ursprung in Taiwan und der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2010/2000 af 18. september 2000 om yderligere
    ændring af forordning (EØF) nr. 3905/88 for så vidt angår en endelig antidumpingtold
    på importen af garn af polyester med oprindelse i Taiwan og Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2010/2000 του Συμβουλίου,
    της 18ης Σεπτεμβρίου 2000, για περαιτέρω τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 3905/88 για την επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    νημάτων από πολυεστέρες καταγωγής Ταϊβάν και
    Τουρκίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2010/2000, annettu 18 päivänä syyskuuta 2000,
    lopullisen polkumyyntitullin käyttöön ottamisesta Taiwanista ja Turkista peräisin
    olevan polyesterilangan tuonnissa annetun asetuksen (ETY) N:o 3905/88 muuttamisesta
    uudelleen
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2010/2000 del Consiglio, del 18 settembre 2000, che
    modifica ulteriormente il regolamento (CEE) n. 3905/88 per quanto riguarda i dazi
    antidumping definitivi sulle importazioni di filati di poliesteri originari di
    Taiwan e della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2010/2000 van de Raad van 18 september 2000 tot verdere
    wijziging van Verordening (EEG) nr. 3905/88 wat het definitieve antidumpingrecht
    op de invoer van polyestergaren uit Taiwan en Turkije betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2010/2000 do Conselho, de 18 de Setembro de 2000,
    que altera novamente o Regulamento (CE) n.o 3905/88 no que diz respeito aos direitos
    anti-dumping definitivos sobre as importações de fios de poliésteres originários
    de Taiwan e da Turquia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2010/2000 del Consejo, de 18 de septiembre de 2000,
    que modifica nuevamente el Reglamento (CEE) nº 3905/88 en lo que se refiere a
    los derechos antidumping definitivos sobre las importaciones de hilados de poliéster
    originarios de Taiwán y Turquía
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2010/2000 av den 18 september 2000 om ytterligare
    ändring av förordning (EEG) nr 3905/88 om införande av en slutgiltig antidumpningstull
    på import av polyestergarn med ursprung i Taiwan och Turkiet
  type: main
