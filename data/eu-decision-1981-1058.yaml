title:
- language: en
  script: Latn
  content: '81/1058/EEC: Council Decision of 14 December 1981 on the conclusion of
    a Cooperation Agreement between the European Economic Community and the Kingdom
    of Sweden on the interconnection of the Community network for data transmission
    (Euronet) and the Swedish data network for information-retrieval purposes and
    on the conclusion of a Trilateral Protocol on the purport of the Agreements for
    data network cooperation concluded by the European Economic Community with, on
    the one hand, the Swiss Confederation and, on the other hand, the Kingdom of Sweden'
  type: main
- language: fr
  script: Latn
  content: '81/1058/CEE: Décision du Conseil, du 14 décembre 1981, concernant la
    conclusion de l''accord de coopération entre la Communauté économique européenne
    et le Royaume de Suède concernant l''interconnexion du réseau communautaire
    de transmission de données (Euronet) et du réseau suédois de données pour
    la recherche de l''information, ainsi que la conclusion du protocole tripartite
    sur la teneur des accords pour la coopération en matière de réseau de données
    conclus entre la Communauté économique européenne et la Confédération suisse,
    d''une part, et le Royaume de Suède, d''autre part'
  type: main
- language: de
  script: Latn
  content: '81/1058/EWG: Beschluß des Rates vom 14. Dezember 1981 über den Abschluß
    eines Abkommens über Zusammenarbeit zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Schweden zur Verbindung des Datenfernübertragungsnetzes der
    Gemeinschaft (EURONET) und des schwedischen Datennetzes für Informationsretrieval
    und über den Abschluß eines dreiseitigen Protokolls über den Inhalt der von
    der Europäischen Wirtschaftsgemeinschaft mit der Schweizerischen Eidgenossenschaft
    einerseits und dem Königreich Schweden andererseits geschlossenen Abkommen über
    Zusammenarbeit bei den Datennetzen'
  type: main
- language: da
  script: Latn
  content: '81/1058/EØF: Rådets afgørelse af 14. december 1981 om indgåelse af
    samarbejdsaftalen mellem Det europæiske økonomiske Fællesskab og kongeriget
    Sverige om sammenkobling af Fællesskabets datatransmissionsnet (Euronet) og det
    svenske datanet for informationssøgning og om indgåelse af trepartsprotokollen
    om rækkevidden af aftalerne om samarbejde på datanetområdet, indgået af Det
    europæiske økonomiske Fællesskab dels med Schweiz, dels med kongeriget Sverige'
  type: main
- language: el
  script: Grek
  content: '81/1058/EOK: Απόφαση τού Συμβουλίου τής 14ης
    Δεκεμβρίου 1981 περί συνάψεως συμφωνίας συνεργασίας
    μεταξύ τής Ευρωπαϊκής Οικονομικής Κοινότητος
    καί τού Βασιλείου τής Σουηδίας σχετικά μέ τή
    σύνδεση τού κοινοτικού δικτύου μεταδόσεως
    στοιχείων (Euronet) καί τού σουηδικού δικτύου στοιχείων
    γιά σκοπούς συλλογής πληροφοριών, καί περί
    συνάψεως τριμερούς πρωτοκόλλου σχετικά μέ
    τίς συνέπειες τών συμφωνιών συνεργασίας γιά
    τά δίκτυα στοιχείων, συναφθεισών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί, αφ
    ενός μέν, τής Ελβετικής Συνομοσπονδίας, αφ
    ετέρου δέ, τού Βασιλείου τής Σουηδίας'
  type: main
- language: it
  script: Latn
  content: '81/1058/CEE: Decisione del Consiglio, del 14 dicembre 1981, relativa alla
    conclusione di un accordo di cooperazione tra la Comunità economica europea ed
    il Regno di Svezia avente per oggetto il collegamento tra la rete comunitaria
    di trasmissione dei dati (Euronet) e la rete svedese di dati per la ricerca dell''
    informazione e alla conclusione di un protocollo tripartito sul contenuto degli
    accordi di cooperazione nel settore delle reti di dati conclusi dalla Comunità
    economica europea con la Confederazione elvetica, da una parte, ed il Regno di
    Svezia, dall'' altra parte'
  type: main
- language: nl
  script: Latn
  content: '81/1058/EEG: Besluit van de Raad van 14 december 1981 betreffende de sluiting
    van de Samenwerkingsovereenkomst tussen de Europese Economische Gemeenschap en
    het Koninkrijk Zweden inzake de aansluiting van het Zweedse datanet voor documentatieonderzoek
    op het gebeid van datanetten, die zijn gesloten door de Europese Economische Gemeenschap
    met enerzijds de Zwitserse Bondsstaat en anderzijds het Koninkrijk Zweden'
