    a Tagetes erectából nyert luteinben gazdag kivonat és lutein-/zeaxantinkivonat
    vágó- és tojóbaromfi (a pulykák kivételével), valamint kevésbé jelentős
    vágó- és tojóbaromfifajok takarmány-adalékanyagaként történő engedélyezéséről
    szóló (EU) 2020/1097 végrehajtási rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/420 della Commissione del 9 marzo 2021
    che rettifica il regolamento di esecuzione (UE) 2020/1097 della Commissione relativo
    all’autorizzazione degli estratti ricchi di luteina e degli estratti di luteina/zeaxantina
    da Tagetes erecta come additivi per mangimi destinati al pollame (ad eccezione
    dei tacchini) da ingrasso e allevato per la produzione di uova e a specie avicole
    minori da ingrasso e allevate per la produzione di uova
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/420 (2021. gada 9. marts), ar
    ko labo Īstenošanas regulu (ES) 2020/1097 par atļauju ar luteīnu bagātinātu
    ekstraktu un luteīna/zeaksantīna ekstraktu, kas abi iegūti no Tagetes erecta,
    izmantot par barības piedevām gaļas mājputniem un dējējmājputniem (izņemot
    tītarus) un mazāk izplatītu sugu gaļas mājputniem un dējējmājputniem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/420 2021 m. kovo 9 d. kuriuo
