title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/420 of 9 March 2021 correcting
    Implementing Regulation (EU) 2020/1097 concerning the authorisation of lutein-rich
    and lutein/zeaxanthin extracts from Tagetes erecta as feed additives for poultry
    (except turkeys) for fattening and laying and for minor poultry species for fattening
    and laying
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/420 de la Commission du 9 mars 2021
    rectifiant le règlement d’exécution (UE) 2020/1097 concernant l’autorisation
    d’extraits riches en lutéine et d’extraits de lutéine/zéaxanthine tirés
    de Tagetes erecta en tant qu’additifs pour l’alimentation des volailles (à
    l’exception des dindes) à l’engrais ou de ponte et des espèces mineures
    de volailles à l’engrais ou de ponte
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/420 der Kommission vom 9. März 2021
    zur Berichtigung der Durchführungsverordnung (EU) 2020/1097 betreffend die Zulassung
    luteinreicher Extrakte und von Lutein-Zeaxanthinextrakten aus Tagetes erecta als
    Futtermittelzusatzstoffe für Mast- und Legegeflügel (ausgenommen Truthühner)
    und für Mast- und Legegeflügelarten von geringerer wirtschaftlicher Bedeutung
  type: main
- language: bg
  script: Cyrl
