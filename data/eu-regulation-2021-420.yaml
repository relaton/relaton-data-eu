    на употребата на богат на лутеин екстракт и
    съдържащ лутеин/зеаксантин екстракт от Tagetes
    erecta като фуражни добавки за домашни птици (с
    изключение на пуйки) за угояване и за носачки,
    както и за домашни птици с по-малко стопанско
    значение, за угояване и за носачки
  type: main
