title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3264/80 of 16 December 1980 re-establishing
    the levying of customs duties on other carbon articles, falling within subheading
    85.24 C and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3264/80 de la Commission, du 16 décembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres pièces
    et objets en charbon ou en graphite de la sous-position 85.24 C du tarif douanier
    commun, originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3264/80 der Kommission vom 16. Dezember 1980 zur Wiedereinführung
    des Zollsatzes für Waren aus Kohle oder Graphit der Tarifstelle 85.24 C mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3264/80 af 16. december 1980 om genindførelse
    af opkrævning af toldafgifter for andre dele og genstande af kul eller grafit,
    under pos. 85.24 C, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3264/80 della Commissione, del 16 dicembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri pezzi ed oggetti
    di carbone o di grafite, della sottovoce 85.24 C della tariffa doganale comune,
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3264/80 van de Commissie van 16 december 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op werkstukken
    en voorwerpen, van kool of van grafiet, van post 85.24 C, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
