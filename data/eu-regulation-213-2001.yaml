id: EURegulation2132001
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 213/2001 of 9 January 2001 laying down detailed
    rules for the application of Council Regulation (EC) No 1255/1999 as regards methods
    for the analysis and quality evaluation of milk and milk products and amending
    Regulations (EC) No 2771/1999 and (EC) No 2799/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 213/2001 de la Commission du 9 janvier 2001 portant
    modalités d'application du règlement (CE) n° 1255/1999, en ce qui concerne
    les méthodes à utiliser pour l'analyse et l'évaluation de la qualité du lait
    et des produits laitiers et modifiant les règlements (CE) n° 2771/1999 et (CE)
    n° 2799/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 213/2001 der Kommission vom 9. Januar 2001 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1255/1999 hinsichtlich der Methoden für die Analyse und
    Qualitätsbewertung von Milch und Milcherzeugnissen sowie zur Änderung der Verordnungen
    (EG) Nr. 2771/1999 und (EG) Nr. 2799/1999
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 213/2001 на Комисията от 9 януари
    2001 година относно определяне на подробни правила
    за прилагането на Регламент (ЕО) № 1255/1999 на
    Съвета по отношение на методи за анализ и оценка
    на качеството на млякото и млечните продукти
    и за изменение на Регламенти (ЕО) № 2771/1999 и (ЕО)
    № 2799/1999
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 213/2001 ze dne 9. ledna 2001, kterým se stanoví
    prováděcí pravidla k nařízení Rady (ES) č. 1255/1999, pokud jde o metody
    analýzy a hodnocení jakosti mléka a mléčných výrobků, a kterým se mění
    nařízení (ES) č. 2771/1999 a (ES) č. 2799/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 213/2001 af 9. januar 2001 om gennemførelsesbestemmelser
    til forordning (EF) nr. 1255/1999 for så vidt angår metoder til analyse og vurdering
    af mælks og mejeriprodukters kvalitet og om ændring af forordning (EF) nr. 2771/1999
    og (EF) nr. 2799/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 213/2001 της Επιτροπής,
    της 9ης Ιανουαρίου 2001, για τη θέσπιση λεπτομερειών
    εφαρμογής του κανονισμού (ΕΚ) αριθ. 1255/1999, όσον
    αφορά τις μεθόδους που πρέπει να χρησιμοποιούνται
    για την ανάλυση και την αξιολόγηση της ποιότητας
    του γάλακτος και των γαλακτοκομικών προϊόντων
    και για την τροποποίηση των κανονισμών (ΕΚ)
    αριθ. 2771/1999 και (ΕΚ) αριθ. 2799/1999
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 213/2001, 9. jaanuar 2001, milles sätestatakse
    nõukogu määruse (EÜ) nr 1255/1999 üksikasjalikud rakenduseeskirjad seoses
    piima ja piimatoodete analüüsimise ning kvaliteedi hindamise meetoditega ning
    millega muudetakse määrusi (EÜ) nr 2771/1999 ja (EÜ) nr 2799/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 213/2001, annettu 9 päivänä tammikuuta 2001,
    asetuksen (EY) N:o 1255/1999 soveltamista koskevista yksityiskohtaisista säännöistä
    maidon ja maitotuotteiden analysoimisen ja laadun arvioimisen osalta sekä asetusten
    (EY) N:o 2771/1999 ja (EY) N:o 2799/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 213/2001/EK rendelete (2001. január 9.) a tej és tejtermékek
    elemzése és minőségértékelése tekintetében az 1255/99/EK tanácsi rendelet
    alkalmazása részletes szabályainak megállapításáról, valamint a 2771/1999/EK
    és a 2799/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 213/2001 della Commissione, del 9 gennaio 2001, che
    stabilisce modalità d'applicazione del regolamento (CE) n. 1255/1999 per quanto
    riguarda i metodi per le analisi e la valutazione qualitativa del latte e dei
    prodotti lattiero-caseari e modifica i regolamenti (CE) n. 2771/1999 e (CE) n.
    2799/1999
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 213/2001 (2001. gada 9. janvāris), ar ko nosaka
    sīki izstrādātus noteikumus par to, kā piemērot Padomes Regulu (EK) Nr. 1255/1999
    attiecībā uz piena un piena produktu analīžu un kvalitātes vērtēšanas
    metodēm un groza Regulu (EK) Nr. 2771/1999 un Regulu (EK) Nr. 2799/1999
  type: main
- language: lt
  script: Latn
  content: 2001 m. sausio 9 d. Komisijos reglamentas (EB) Nr. 213/2001, nustatantis
    išsamias Tarybos reglamento (EB) Nr. 1255/1999 taikymo taisykles, susijusias
    su pieno ir pieno produktų analizės bei kokybės vertinimo metodais ir iš dalies
    pakeičiantis Reglamentus (EB) Nr. 2771/1999 ir (EB) Nr. 2799/1999
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill tad-9 ta' Jannar 2001 li jippreskrivi regoli
    dettaljati għall-applikazzjoni tar-Regolament tal-Kunsill (KE) Nru 1255/1999
    fir-rigward ta' metodi għall-analiżi u l-valutazzjoni tal-kwalità tal-ħalib
    u prodotti mill-ħalib u li jemenda r-Regolamenti (KE) Nru 2771/1999 u (KE) Nru
    2799/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 213/2001 van de Commissie van 9 januari 2001 houdende
    uitvoeringsbepalingen van Verordening (EG) nr. 1255/1999, wat betreft de referentiemethoden
    voor de analyse en de kwaliteitsbeoordeling van melk en zuivelproducten, en houdende
    wĳziging van de Verordeningen (EG) nr. 2771/1999 en (EG) nr. 2799/1999
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 213/2001 z dnia 9 stycznia 2001 r. ustanawiające
    szczegółowe zasady stosowania rozporządzenia Rady (WE) nr 1255/1999 w odniesieniu
    do metod analizy oraz oceny jakości mleka i przetworów mlecznych oraz zmieniające
    rozporządzenia (WE) nr 2771/1999 i (WE) nr 2799/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 213/2001 da Comissão, de 9 de Janeiro de 2001, que
    estabelece as normas de execução do Regulamento (CE) n.° 1255/1999, no que
    respeita aos métodos a utilizar para a análise e a avaliação da qualidade
    do leite e dos produtos lácteos e, altera os Regulamentos (CE) n.° 2771/1999
    e (CE) n.° 2799/1999
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 213/2001 al Comisiei din 9 ianuarie 2001 de stabilire
    a normelor de aplicare a Regulamentului (CE) nr. 1255/1999 al Consiliului privind
    metodele de analiză și evaluare calitativă a laptelui și produselor lactate
    și de modificare a Regulamentelor (CE) nr. 2771/1999 și (CE) nr. 2799/1999
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 213/2001 z 9. januára 2001, ktorým sa stanovujú
    podrobné pravidlá pre uplatňovanie nariadenia Rady (ES) č. 1255/1999 týkajúce
    sa metód analýzy a hodnotenia kvality mlieka a mliečnych výrobkov a ktorým
    sa menia a dopĺňajú nariadenia (ES) č. 2771/1999 a (ES) č. 2799/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 213/2001 z dne 9. januarja 2001 o določitvi
    podrobnih pravil za izvajanje Uredbe Sveta (ES) št. 1255/1999 o analitskih metodah
    in ocenjevanju kakovosti mleka in mlečnih proizvodov ter dopolnitvenih uredb
    (ES) št. 2771/1999 in (ES) št. 2799/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 213/2001 de la Comisión, de 9 de enero de 2001, por
    el que se establecen las disposiciones de aplicación del Reglamento (CE) n°
    1255/1999, en lo que atañe a los métodos que deben utilizarse para el análisis
    y la evaluación de la calidad de la leche y de los productos lácteos, y se modifican
    los Reglamentos (CE) n° 2771/1999 y (CE) n° 2799/1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 213/2001 av den 9 januari 2001 om tillämpningsföreskrifter
    för förordning (EG) nr 1255/1999 när det gäller de metoder som skall användas
    för analys och kvalitetsbedömning av mjölk och mjölkprodukter och om ändring
    av förordningarna (EG) nr 2771/1999 och (EG) nr 2799/1999
  type: main
