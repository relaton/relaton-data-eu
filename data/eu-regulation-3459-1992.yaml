title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3459/92 of 30 November 1992 authorizing
    the United Kingdom to permit an additional increase in the alcoholic strength
    of table wines and of quality wines produced in a specified region
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3459/92 de la Commission, du 30 novembre 1992, autorisant
    le Royaume-Uni à permettre, une augmentation supplémentaire du titre alcoométrique
    des vins de table et des vins de qualité produits dans une région déterminée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3459/92 der Kommission vom 30. November 1992 zur Ermächtigung
    des Vereinigten Königreichs, eine zusätzliche Erhöhung des Alkoholgehalts bei
    Tafelwein und Qualitätswein bestimmter Anbaugebiete zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommisionens forordning (EØF) nr. 3459/92 af 30. november 1992 om bemyndigelse
    af Det Forenede Kongerige til under visse omstændigheder at tillade en yderligere
    forhøjelse af alkoholindholdet i bordvine og i kvalitetsvine fra et bestemt dyrkningsområde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3459/92 της Επιτροπής
    της 30ής Νοεμβρίου 1992 που εξουσιοδοτεί το Ηνωμένο
    Βασίλειο να επιτρέπει συμπληρωματική αύξηση
    του αλκοολικού τίτλου των επιτραπέζιων οίνων
    και οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3459/92 della Commissione, del 30 novembre 1992, che
    autorizza il Regno Unito a permettere un aumento supplementare della gradazione
    alcolometrica dei vini da tavola e dei vini du qualità prodotti in una regione
    determinata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3459/92 van de Commissie van 30 november 1992 waarbij
    het Verenigd Koninkrijk wordt gemachtigd een extra verhoging van het alcoholgehalte
    van tafelwijnen en in bepaalde gebieden voortgebrachte kwaliteitswijn toe te staan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3459/92 da Comissão, de 30 de Novembro de 1992,
    que autoriza o Reino Unido a permitir um aumento suplementar do título alcoométrico
    dos vinhos de mesa e dos vinhos de qualidade produzidos numa região determinada
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3459/92 de la Comisión, de 30 de noviembre de 1992,
    por el que se autoriza al Reino Unido para que permita un aumento suplementario
    del grado alcohólico de los vinos de mesa y de los vinos de calidad producidos
    en una región determinada
  type: main
