title:
- language: en
  script: Latn
  content: '80/47/EEC: Commission Decision of 20 December 1979 on surveillance and
    protective measures which Member States may be authorized to take in respect of
    imports of certain products originating in third countries and put into free circulation
    in another Member State'
  type: main
- language: fr
  script: Latn
  content: '80/47/CEE: Décision de la Commission, du 20 décembre 1979, relative
    aux mesures de surveillance et de protection que les États membres peuvent être
    autorisés à prendre à l'' égard de l'' importation de certains produits originaires
    de pays tiers et mis en libre pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '80/47/EWG: Entscheidung der Kommission vom 20. Dezember 1979 betreffend
    Überwachungs- und Schutzmaßnahmen, zu denen die Mitgliedstaaten bei der Einfuhr
    bestimmter aus dritten Ländern stammender und in einem anderen Mitgliedstaat
    im freien Verkehr befindlicher Waren ermächtigt werden können'
  type: main
- language: da
  script: Latn
  content: '80/47/EØF: Kommissionens beslutning af 20. december 1979 om de tilsyns-
    og beskyttelsesforanstaltninger, som medlemsstaterne kan bemyndiges til at træffe
    over for indførsel af visse varer, der har oprindelse i tredjelande og er overgået
    til fri omsætning i en anden medlemsstat'
  type: main
- language: el
  script: Grek
  content: '80/47/EOK: Απόφαση τής Επιτροπής τής 20ής Δεκεμβρίου
    1979 σχετική μέ τά μέτρα επιτηρήσεως καί προστασίας
    τά οποία τά Κράτη μέλη δύνανται νά εξουσιοδοτηθούν
    νά λάβουν ως πρός τήν εισαγωγή ορισμένων προϊόντων
    πού κατάγονται από τρίτες χώρες καί τίθενται
    σέ ελεύθερη κυκλοφορία σ ένα άλλο Κράτος μέλος'
  type: main
- language: it
  script: Latn
  content: '80/47/CEE: Decisione della Commissione, del 20 dicembre 1979, relativa
    alle misure di sorveglianza e di protezione che gli Stati membri possono essere
    autorizzati a prendere nei confronti dell'' importazione di taluni prodotti di
    paesi terzi e immessi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '80/47/EEG: Beschikking van de Commissie van 20 december 1979 betreffende
