title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1686 of 7 July 2021 amending
    Delegated Regulation (EU) 2016/161 as regards the evaluation of notifications
    by national competent authorities to the Commission and the inclusion of cicatrizants
    with ATC code D03AX and pharmaceutical form fly larvae in the list of medicinal
    products that shall not bear the safety features
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1686 de la Commission du 7 juillet 2021
    modifiant le règlement délégué (UE) 2016/161 en ce qui concerne l’évaluation
    des notifications faites à la Commission par les autorités compétentes nationales
    et l’inscription des cicatrisants dont le code ATC est D03AX et la forme pharmaceutique
    «larves de mouches» sur la liste des médicaments qui ne doivent pas être dotés
    des dispositifs de sécurité
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1686 der Kommission vom 7. Juli 2021 zur
    Änderung der Delegierten Verordnung (EU) 2016/161 im Hinblick auf die Bewertung
    der Meldungen der nationalen zuständigen Behörden an die Kommission und die
    Aufnahme von Wundbehandlungsmitteln mit dem ATC-Code D03AX und der Darreichungsform
    Fliegenlarven in die Liste der Arzneimittel, die die Sicherheitsmerkmale nicht
    tragen dürfen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1686 на Комисията
    от 7 юли 2021 година за изменение на Делегиран
    регламент (ЕС) 2016/161 по отношение на оценката
    на уведомленията, подавани от националните
    компетентни органи до Комисията, и включването
    на цикатризаторите с ATC код D03AX и фармацевтичната
    форма „ларви на мухи“ в списъка на лекарствените
    продукти, които не трябва да са с нанесени показатели
    за безопасност
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1686 ze dne 7. července
    2021, kterým se mění nařízení v přenesené pravomoci (EU) 2016/161, pokud
    jde o vyhodnocení oznámení podaných příslušnými vnitrostátními orgány
    Komisi a o zařazení cikatrizantů s ATC kódem D03AX a lékové formy muší
    larvy na seznam léčivých přípravků, které nesmí být opatřeny ochrannými
    prvky
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1686 af 7. juli 2021 om ændring
    af delegeret forordning (EU) 2016/161 for så vidt angår vurdering af nationale
    kompetente myndigheders indberetninger til Kommissionen og medtagelse af andre
    sårhelende midler med ATC-kode D03AX og lægemiddelformen fluelarver på listen
    over lægemidler, som ikke må være forsynet med sikkerhedselementerne
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/1686
    της Επιτροπής της 7ης Ιουλίου 2021 για την τροποποίηση
    του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2016/161
    όσον αφορά την αξιολόγηση των κοινοποιήσεων
    από τις αρμόδιες εθνικές αρχές προς την Επιτροπή
    και τη συμπερίληψη των ουλοποιητικών με κωδικό
    ATC D03AX και με τη φαρμακοτεχνική μορφή προνυμφών
    μυγών στον κατάλογο των φαρμάκων που δεν φέρουν
    τα χαρακτηριστικά ασφαλείας
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/1686, 7. juuli 2021, millega
    muudetakse delegeeritud määrust (EL) 2016/161 seoses komisjonile esitatavate
    liikmesriikide pädevate asutuste teadete hindamisega ning armistumist soodustavate
    ATC-koodiga D03AX ainete ja ravimivormi „kärbsevastsed“ kandmisega selliste
    ravimite loetellu, mille puhul ei kasutata turvaelemente
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/1686, annettu 7 päivänä heinäkuuta
    2021, delegoidun asetuksen (EU) 2016/161 muuttamisesta siltä osin kuin on kyse
    kansallisten toimivaltaisten viranomaisten komissiolle toimittamien ilmoitusten
    arvioinnista ja haavojen hoitoon tarkoitettujen valmisteiden, joiden ATC-koodi
    on D03AX, ja lääkemuodon kärpäsentoukat sisällyttämisestä luetteloon lääkkeistä,
    joissa ei saa olla turvaominaisuuksia
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/1686 ón gCoimisiún an 7 Iúil 2021 lena
    leasaítear Rialachán Tarmligthe (AE) 2016/161 a mhéid a bhaineann le fógraí
    ó údaráis náisiúnta chuig an gCoimisiún a mheas agus cneasaitheoirí ag
    a bhfuil an cód CAT D03AX agus an fhoirm chógaisíochta larbhaí cuileoige a
    áireamh i liosta na gcógas nach mbeidh na gnéithe sábháilteachta orthu
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1686 оd 7. srpnja 2021. o izmjeni
    Delegirane uredbe (EU) 2016/161 u pogledu evaluacije obavijesti nadležnih tijela
    država članica Komisiji te u pogledu uvrštenja cikatrizanata s ATC oznakom
    D03AX, farmaceutskog oblika „ličinke muhe”, na popis lijekova koji ne nose
    sigurnosne oznake
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1686 felhatalmazáson alapuló rendelete (2021.
    július 7.) az (EU) 2016/161 felhatalmazáson alapuló rendeletnek az illetékes
    nemzeti hatóságok által a Bizottságnak küldött értesítések értékelése,
    valamint a „D03AX ATC-kóddal rendelkező hámosító szerek” termékkategóriának
    és a „légylárvák” gyógyszerformának a biztonsági elemekkel el nem látható
    gyógyszerek jegyzékébe való felvétele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1686 della Commissione del 7 luglio 2021
    che modifica il regolamento delegato (UE) 2016/161 per quanto riguarda la valutazione
    delle notifiche trasmesse alla Commissione dalle autorità nazionali competenti
    e l’inclusione dei cicatrizzanti con codice ATC D03AX e forma farmaceutica «larve
    di mosca» nell’elenco dei medicinali che non presentano le caratteristiche
    di sicurezza
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1686 (2021. gada 7. jūlijs), ar
    ko attiecībā uz valstu kompetento iestāžu paziņojumu Komisijai izvērtēšanu
    un rētu mazinātāju ar ATĶ kodu D03AX un mušu kāpuru zāļu formas iekļaušanu
    sarakstā ar recepšu zālēm, ko nedrīkst aprīkot ar drošības pazīmēm,
    groza Deleģēto regulu (ES) 2016/161
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/1686 2021 m. liepos 7 d. kuriuo
    dėl nacionalinių kompetentingų institucijų pranešimų Komisijai vertinimo
    ir cikatrizantų, kurių ATC kodas yra D03AX, ir farmacinės formos musių lervų
    įtraukimo į vaistų, ant kurių pakuotės neturi būti apsaugos priemonių,
    sąrašą iš dalies keičiamas Deleguotasis reglamentas (ES) 2016/161
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/1686 tas-7 ta’ Lulju 2021
    li jemenda r-Regolament Delegat (UE) 2016/161 fir-rigward tal-evalwazzjoni tan-notifiki
    mill-awtoritajiet kompetenti nazzjonali lill-Kummissjoni u l-inklużjoni taċ-ċikatrizzanti
    bil-kodiċi ATC D03AX u l-forma farmaċewtika “larvi tad-dubbien” fil-lista
    ta’ prodotti mediċinali li ma għandux ikollhom il-karatteristiċi ta’ sigurtà
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/1686 van de Commissie van 7 juli 2021
    tot wijziging van Gedelegeerde Verordening (EU) 2016/161 wat betreft de beoordeling
    van kennisgevingen door nationale bevoegde autoriteiten aan de Commissie en de
    opneming van epulotica met ATC-code D03AX en de farmaceutische vorm “vliegenlarven”
    in de lijst van geneesmiddelen waarop de veiligheidskenmerken niet worden aangebracht
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/1686 z dnia 7 lipca 2021 r.
    zmieniające rozporządzenie delegowane (UE) 2016/161 w odniesieniu do oceny powiadomień
    składanych do Komisji przez właściwe organy krajowe oraz włączenia leków
    zabliźniających o kodzie ATC D03AX i postaci farmaceutycznej larw muchy do wykazu
    produktów leczniczych, które nie zawierają zabezpieczeń
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1686 da Comissão de 7 de julho de 2021
    que altera o Regulamento Delegado (UE) 2016/161 no que diz respeito à avaliação
    das notificações das autoridades nacionais competentes à Comissão e à inclusão
    de cicatrizantes com o código ATC D03AX e da forma farmacêutica larvas de mosca
    na lista de medicamentos que não devem ser dotados de dispositivos de segurança
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1686 al Comisiei din 7 iulie 2021 de modificare
    a Regulamentului delegat (UE) 2016/161 în ceea ce privește evaluarea notificărilor
    de către autoritățile naționale competente către Comisie și includerea cicatrizanților
    cu codul ATC D03AX și a formei farmaceutice „larve de muște” în lista medicamentelor
    care nu prezintă elemente de siguranță
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1686 zo 7. júla 2021, ktorým
    sa mení delegované nariadenie (EÚ) 2016/161, pokiaľ ide o hodnotenie oznámení
    zasielaných príslušnými vnútroštátnymi orgánmi Komisii a zaradenie cicatrizantov
    s ATC kódom D03AX a liekovej formy mušie larvy do zoznamu liekov, ktoré nesmú
    byť vybavené bezpečnostnými prvkami
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1686 z dne 7. julija 2021 o spremembi
    Delegirane uredbe (EU) 2016/161 glede ocen obvestil pristojnih nacionalnih organov
    Komisiji ter vključitve cikatrizantov z oznako ATC D03AX in farmacevtske oblike
    mušjih ličink na seznam zdravil, ki ne smejo imeti nameščenih zaščitnih
    elementov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1686 de la Comisión de 7 de julio de 2021
    por el que se modifica el Reglamento Delegado (UE) 2016/161 en lo que respecta
    a la evaluación de las notificaciones a la Comisión por las autoridades nacionales
    competentes y a la inclusión de cicatrizantes con el código ATC D03AX y la forma
    farmacéutica de larvas de mosca en la lista de medicamentos que no deben llevar
    dispositivos de seguridad
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1686 av den 7 juli 2021
    om ändring av delegerad förordning (EU) 2016/161 vad gäller utvärdering av
    anmälningarna från nationella behöriga myndigheter till kommissionen och införande
    av medel vid sår- och brännskador med ATC-kod D03AX och läkemedelsformen fluglarver
    i förteckningen över läkemedel som inte får vara märkta med säkerhetsdetaljer
