title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 902/2009 of 28 September 2009 concerning
    the authorisation of an enzyme preparation of endo-1,4-beta-xylanase produced
    by Trichoderma reesei (CBS 114044) as a feed additive for weaned piglets, chickens
    for fattening, chickens reared for laying, turkeys for fattening and turkeys reared
    for breeding (holder of authorisation Roal Oy)
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n o 902/2009 de la Commission du 28 septembre 2009 concernant
    l’autorisation d’une préparation enzymatique à base d’endo-1,4-β-xylanase
    produite par Trichoderma reesei (CBS 114044) en tant qu’additif pour l’alimentation
    des porcelets sevrés, des poulets d’engraissement, des poulettes élevées
    pour la ponte, des dindes d’engraissement et des dindons élevés pour la reproduction
    (titulaire de l’autorisation: Roal Oy)'
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 902/2009 der Kommission vom 28. September 2009 zur
    Zulassung einer Enzymzubereitung von Endo-1,4-beta-xylanase aus Trichoderma reesei
    (CBS 114044) als Futtermittelzusatzstoff für entwöhnte Ferkel, Masthähnchen,
    Junghennen, Masttruthühner und Jungtruthühner (Zulassungsinhaber Roal Oy)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 902/2009 на Комисията от 28
    септември 2009 година относно разрешителното
    за ензимен препарат, който съдържа ендо-1,4-бета-ксиланаза,
    получена от Trichoderma reesei (CBS 114044), като хранителна
    добавка за отбити прасенца, пилета за угояване,
    пилета, отглеждани за кокошки носачки, пуйки
    за угояване и пуйки, отглеждани за разплод
    (притежател на разрешителното Roal Oy)
  type: main
- language: cs
  script: Latn
