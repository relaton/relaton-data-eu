    přípravku enzymu endo-1,4-beta-xylanázy z Trichoderma reesei (CBS 114044) jako
    doplňkové látky pro odstavená selata, výkrm kuřat, odchov kuřat a kuřice,
    výkrm krůt a odchov krůt (držitel povolení Roal Oy)
  type: main
- language: da
  script: Latn
