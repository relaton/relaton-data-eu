    Roal Oy)'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 902/2009 della Commissione, del 28 settembre 2009 ,
    relativo all’autorizzazione di un preparato enzimatico di endo-1,4-beta-xilanasi
    prodotto dal Trichoderma reesei (CBS 114044) come additivo per mangimi destinati
    a suinetti svezzati, polli da ingrasso, galline ovaiole, tacchini da ingrasso
    e tacchini allevati per la riproduzione (titolare dell’autorizzazione Roal Oy)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 902/2009 ( 2009. gada 28. septembris ) par atļaujas
    piešķiršanu no Trichoderma reesei (CBS 114044) iegūtam endo-1,4-beta-ksilanāzes
    fermentu preparātam kā barības piedevai, kas paredzēta atšķirtiem sivēniem,
    gaļas cāļiem, cāļiem dējējvistu audzēšanai, gaļas tītariem un vaislas
    tītariem (atļaujas turētājs Roal Oy )
  type: main
