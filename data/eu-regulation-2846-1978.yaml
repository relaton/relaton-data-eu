title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2846/78 of 4 December 1978 re-establishing
    the levying of customs duties on electronic calculating machines, not incorporating
    a printing device, falling within subheading 84.52 ex A and originating in Hong
    Kong, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2846/78 de la Commission, du 4 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à calculer électroniques non imprimantes, de la sous-position tarifaire 84.52
    ex A, originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2846/78 der Kommission vom 4. Dezember 1978 zur Wiedereinführung
    des Zollsatzes fúr nichtdruckende elektronische Rechenmaschinen der Tarifstelle
    84.52 ex A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2846/78 af 4. december 1978 om genindførelse
    af opkrævning af toldafgifter for elektroniske regnemaskiner uden anordning til
    trykning af resultat, under underposition 84.52 ex A, som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2846/78 della Commissione, del 4 dicembre 1978, che
    ripristina la riscossione, dei dazi doganali applicabili alle macchine calcolatrici
    elettroniche non scriventi, della sottovoce doganale 84.52 ex A, originarie di
    Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2846/78 van de Commissie van 4 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op niet schrijvende
    elektronische rekenmachines, van post 84.52 ex A, van oorsprong uit Hong-Kong
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
