title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3420/93 of 13 December 1993 re-establishing
    the levying of customs duties on products of category 17 (order No 40.0170), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3420/93 de la Commission du 13 décembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 17 (numéro d'ordre 40.0170) originaires d'Indonésie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3420/93 DER KOMMISSION vom 13. Dezember 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 17 (laufende Nummer 40.0170) mit Ursprung
    in Indonesien, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3420/93 af 13. december 1993 om genindførelse
    af opkrævning af told for varer under kategori 17 (løbenummer 40.0170), som
    har oprindelse i Indonesien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
