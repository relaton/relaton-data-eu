    17 (numero d' ordine 40.0170) originari dell' Indonesia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3420/93 VAN DE COMMISSIE van 13 december 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 17 (volgnummer 40.0170), van oorsprong uit Indonesië, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad
  type: main
