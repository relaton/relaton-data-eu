title:
- language: en
  script: Latn
  content: '71/14/EEC: Commission Decision of 7 December 1970 amending the Commission
    Decision of 19 December 1969 on adaptation of the methods of administrative co-operation
    introduced for the purpose of applying Article 9 (2) of the EEC Treaty to the
    new rules applicable in the field of Community transit'
  type: main
- language: fr
  script: Latn
  content: '71/14/CEE: Décision de la Commission, du 7 décembre 1970, portant modification
    de la décision, du 19 décembre 1969, relative à l'' adaptation des méthodes
    de coopération administrative instituées pour l'' application de l'' article
    9 paragraphe 2 du traité CEE à la nouvelle réglementation applicable en matière
    de transit communautaire'
  type: main
- language: de
  script: Latn
  content: '71/14/EWG: Entscheidung der Kommission vom 7. Dezember 1970 zur Änderung
    der Entscheidung der Kommission vom 19. Dezember 1969 über die Anpassung der
    Methoden der Zusammenarbeit der Verwaltungen hinsichtlich der Anwendung des Artikels
    9 Absatz 2 des EWG-Vertrags an die neue Regelung auf dem Gebiet des gemeinschaftlichen
    Versandverfahrens'
  type: main
- language: da
  script: Latn
  content: '71/14/EØF: Kommissionens beslutning af 7. december 1970 om ændring af
    Kommissionens beslutning af 19. december 1969 vedrørende tilpasning til den nye
    ordning for fællesskabsforsendelse af metoderne for det administrative samarbejde
    med henblik på anvendelsen af artikel 9, stk. (2), i EØF-traktaten'
  type: main
- language: el
  script: Grek
  content: '71/14/EOK: Απόφαση της Επιτροπής της 7ης Δεκεμβρίου
    1970 περί τροποποιήσεως της αποφάσεως της Επιτροπής
    της 19ης Δεκεμβρίου 1969 περί προσαρμογής των
    μεθόδων διοικητικής συνεργασίας, που εθεσπίσθησαν
    για την εφαρμογή του άρθρου 9 παράγραφος 2 της
    Συνθήκης ΕΟΚ, στη νέα ρύθμιση η οποία εφαρμόζεται
    σε θέματα κοινοτικής διαμετακομίσεως'
  type: main
- language: it
  script: Latn
  content: '71/14/CEE: Decisione della Commissione, del 7 dicembre 1970, che modifica
    la decisione della Commissione, del 19 dicembre 1969, relativa all'' adattamento
    dei metodi di cooperazione amministrativa per l'' applicazione dell'' articolo
    9, paragrafo 2, del trattato CEE alla nuova regolamentazione applicabile in materia
    di transito comunitario'
  type: main
- language: nl
  script: Latn
  content: '71/14/EEG: Beschikking van de Commissie van 7 december 1970 houdende wijziging
    van de beschikking van de Commissie van 19 december 1969 betreffende de aanpassing
    van de voor de toepassing van artikel 9, lid 2, van het E.E.G.-Verdrag ingestelde
    methoden van administratieve samenwerking aan de nieuwe regeling welke inzake
    communautair douanevervoer van toepassing is'
