title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1530/71 du Conseil, du 12 juillet 1971, fixant, pour
    la campagne 1971/1972, les principaux centres de commercialisation des céréales
    et les prix d'intervention dérivés s'y rapportant, ainsi que le prix d'intervention
    pour le maïs et le prix d'intervention dérivé unique pour le froment dur
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1530/71 des Rates vom 12. Juli 1971 zur Festlegung
    der wesentlichsten Handelsplätze für Getreide, der für diese Handelsplätze
    geltenden abgeleiteten Interventionspreise, des Interventionspreises für Mais
    sowie des einzigen abgeleiteten Interventionspreises für Hartweizen für das
    Wirtschaftsjahr 1971/1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1530/71 del Consiglio, del 12 luglio 1971, che fissa,
    per la campagna 1971/1972, i principali centri di commercializzazione dei cereali
    e i relativi prezzi d'intervento derivati, nonché il prezzo d'intervento per
    il granturco ed il prezzo d'intervento derivato unico per il frumento duro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1530/71 van de Raad van 12 juli 1971 houdende vaststelling
    van de voornaamste commercialisatiecentra voor granen, de voor deze centra geldende
    afgeleide interventieprijzen, alsmede de interventieprijs voor maïs en de enige
    afgeleide interventieprijs voor durum tarwe voor het verkoopseizoen 1971/1972
  type: main
