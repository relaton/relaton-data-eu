title:
- language: en
  script: Latn
  content: Fourth Council Directive 78/1033/EEC of 19 December 1978 amending Directive
    69/169/EEC on the harmonization of provisions laid down by law, regulation or
    administrative action relating to exemption from turnover tax and excise duty
    on imports in international travel
  type: main
- language: fr
  script: Latn
  content: Quatrième directive 78/1033/CEE du Conseil, du 19 décembre 1978, modifiant
    la directive 69/169/CEE concernant l'harmonisation des dispositions législatives,
    réglementaires et administratives relatives aux franchises des taxes sur le chiffre
    d'affaires et des accises perçues à l'importation dans le trafic international
    de voyageurs
  type: main
- language: de
  script: Latn
  content: Vierte Richtlinie 78/1033/EWG des Rates vom 19. Dezember 1978 zur Änderung
    der Richtlinie 69/169/EWG zur Harmonisierung der Rechts- und Verwaltungsvorschriften
    über die Befreiung von den Umsatzsteuern und Sonderverbrauchsteuern bei der Einfuhr
    im grenzüberschreitenden Reiseverkehr
  type: main
- language: bg
  script: Cyrl
  content: Четвърта директива на Съвета от 19 декември
    1978 година за изменение на Директива 69/169/ЕИО
    за хармонизиране на законовите, подзаконовите
    и административните разпоредби относно освобождаването
    от данък върху оборота и акциз при внос при
    международните пътувания
  type: main
- language: cs
  script: Latn
  content: Čtvrtá směrnice Rady ze dne 19. prosince 1978, kterou se mění směrnice
    69/169/EHS o harmonizaci právních a správních předpisů týkajících se
    osvobození od daní z obratu a spotřebních daní při dovozu v rámci mezinárodního
    cestovního ruchu
  type: main
- language: da
  script: Latn
  content: Rådets fjerde direktiv 78/1033/EØF af 19. december 1978 om ændring af
    direktiv 69/169/EØF om harmonisering af lovgivning om fritagelse for omsætningsafgifter
    og punktafgifter ved indførsel i den internationale rejsetrafik
  type: main
- language: el
  script: Grek
  content: Τέταρτη οδηγία 78/1033/ΕΟΚ του Συμβουλίου
    της 19ης Δεκεμβρίου 1978 περί τροποποιήσεως της
    οδηγίας 69/169/ΕΟΚ «περί εναρμονίσεως των νομοθετικών,
    κανονιστικών και διοικητικών διατάξεων, των
    σχετικών με τις απαλλαγές από τους φόρους κύκλου
    εργασιών και τους ειδικούς φόρους καταναλώσεων
    που εισπράττονται κατά την εισαγωγή στα πλαίσια
    της διεθνούς κυκλοφορίας ταξιδιωτών»
  type: main
- language: et
  script: Latn
  content: Nõukogu neljas direktiiv, 19. detsember 1978, millega muudetakse direktiivi
    69/169/EMÜ rahvusvahelises turismis toimuva impordi suhtes kohaldatavat käibemaksu-
    ja aktsiisivabastust käsitlevate õigusnormidega kehtestatud sätete ühtlustamise
    kohta
  type: main
- language: fi
  script: Latn
  content: Neljäs neuvoston direktiivi 78/1033/ETY, annettu 19 päivänä joulukuuta
    1978, kansainvälisessä matkustajaliikenteessä tapahtuvassa maahantuonnissa
    kannettaviin liikevaihto- ja valmisteveroihin liittyviä vapautuksia koskevien
    lakien, asetusten ja hallinnollisten määräysten yhdenmukaistamisesta annetun
    direktiivin 69/169/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács negyedik irányelve (1978. december 19.) a nemzetközi utazás
    során alkalmazott import forgalmi és jövedéki adó alól nyújtott mentességre
    vonatkozó törvényi, rendeleti vagy közigazgatási intézkedés által megállapított
    rendelkezések összehangolásáról szóló 69/169/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Quarta direttiva 78/1033/CEE del Consiglio, del 19 dicembre 1978, che modifica
    la direttiva 69/169/CEE relativa all'armonizzazione delle disposizioni legislative,
    regolamentari e amministrative riguardanti la franchigia dalle imposte sulla cifra
    d'affari e dalle altre imposizioni indirette interne riscosse all'importazione
    nel traffico internazionale di viaggiatori
  type: main
- language: lv
  script: Latn
  content: Padomes Ceturtā direktīva (1978. gada 19. decembris), ar kuru groza Direktīvu
    69/169/EEK par normatīvu un administratīvu aktu saskaņošanu attiecībā uz
    atbrīvojumiem no apgrozījuma nodokļiem un akcīzes nodokļiem par preču ievešanu
    starptautiskos ceļojumos
  type: main
- language: lt
  script: Latn
  content: 1978 m. gruodžio 19 d. Ketvirtoji Tarybos direktyva iš dalies keičianti
    Direktyvą 69/169/EEB dėl įstatymais ir kitais teisės aktais nustatytų nuostatų,
    susijusių su tarptautiniais maršrutais keliaujančių asmenų importuojamų
    prekių atleidimu nuo apyvartos ir akcizo mokesčių, suderinimo
  type: main
- language: mt
  script: Latn
  content: Ir-Raba' Direttiva tal-Kunsill tad-19 ta' Diċembru 1978 li temenda d-Direttiva
    69/169/KEE dwar l-armonizzazzjoni tad-disposizzjonijiet stabbliti bil-liġi, regolament
    jew azzjoni amministrattiva għar-rigward ta' eżenzjoni minn taxxa fuq id-dħul
    u taxxa tas-sisa fi vjaġġi internazzjonali
  type: main
- language: nl
  script: Latn
  content: Vierde Richtlijn 78/1033/EEG van de Raad van 19 december 1978 tot wijziging
    van Richtlijn 69/169/EEG inzake de harmonisatie van de wettelijke en bestuursrechtelijke
    bepalingen met betrekking tot de vrijstellingen van omzetbelastingen en accijnzen
    die bij invoer worden geheven in het internationale reizigersverkeer
  type: main
- language: pl
  script: Latn
  content: Czwarta dyrektywa Rady z dnia 19 grudnia 1978 r. zmieniająca dyrektywę
    69/169/EWG w sprawie harmonizacji przepisów ustawowych, wykonawczych i administracyjnych
    odnoszących się do zwolnienia z podatku obrotowego i podatku akcyzowego towarów
    przywożonych w międzynarodowym ruchu pasażerskim
  type: main
- language: pt
  script: Latn
  content: Quarta Directiva 78/1033/CEE do Conselho, de 19 de Dezembro de 1978, que
    altera a Directiva 69/169/CEE relativa à harmonização das disposições legislativas,
    regulamentares e administrativas respeitantes às isenções dos impostos sobre
    o volume de negócios e dos impostos sobre consumos específicos cobrados na importação,
    no tráfego de viajantes
  type: main
- language: ro
  script: Latn
  content: A patra directivă a Consiliului din 19 decembrie 1978 de modificare a
    Directivei 69/169/CEE privind armonizarea actelor cu putere de lege și a actelor
    administrative privind normele de scutire de impozit pe cifra de afaceri și de
    accize aplicabile traficului internațional
  type: main
- language: sk
  script: Latn
  content: Štvrtá smernica Rady z 19. decembra 1978, ktorou sa mení a dopĺňa
    smernica 69/169/EHS o harmonizácii ustanovení stanovených zákonom, iným právnym
    predpisom alebo správnym opatrením týkajúce sa oslobodenia od dane z obratu
    a spotrebnej dane na dovozy v medzinárodnom cestovnom ruchu
  type: main
- language: sl
  script: Latn
  content: Četrta direktiva Sveta z dne 19. decembra 1978 o spremembi Direktive Sveta
    69/169/EGS o usklajevanju zakonov in drugih predpisov v zvezi z oprostitvijo prometnega
    davka in trošarine na uvoz v mednarodnih potovanjih
  type: main
- language: es
  script: Latn
  content: Cuarta Directiva 78/1033/CEE del Consejo, de 19 de diciembre de 1978, por
    la que se modifica la Directiva 69/169/CEE relativa a la armonización de las
    disposiciones legales, reglamentarias y administrativas referentes a las franquicias
    de los impuestos sobre el volumen de negocios y de los impuestos sobre consumos
    específicos percibidos sobre la importación en el tráfico internacional de
    viajeros
  type: main
- language: sv
  script: Latn
  content: Rådets fjärde direktiv 78/1033/EEG av den 19 december 1978 med ändring
    av direktiv 69/169/EEG om harmonisering av lagstiftningen om befrielse från omsättningsskatter
    och punktskatter på varor som införs av resande
  type: main
