title:
- language: en
  script: Latn
  content: '80/1238/EEC: Commission Decision of 17 December 1980 authorizing certain
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of oak wood originating in the USA (Only the French, Danish,
    German, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1238/CEE: Deuxième décision de la Commission, du 17 décembre 1980,
    autorisant certains Etats membres à prévoir des dérogations à certaines dispositions
    de la directive 77/93/CEE du Conseil, pour le bois de chêne originaire des Etats-Unis
    d''Amérique (Les textes en langues française, danoise, allemande, italienne
    et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1238/EWG: Zweite Entscheidung der Kommission vom 17. Dezember 1980
    zur Ermächtigung bestimmter Mitgliedstaaten, für Eichenholz mit Ursprung in
    den Vereinigten Staaten von Amerika Ausnahmen von bestimmten Vorschriften der
    Richtlinie 77/93/EWG des Rates vorzusehen (Nur der französische, dänische, deutsche,
    italienische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1238/EØF: Kommissionens anden beslutning af 17. december 1980 om bemyndigelse
    af visse medlemsstater til at undtage egetræ med oprindelse i USA fra visse bestemmelser
    i Rådets direktiv 77/93/EØF (Kun den franske, danske, tyske, italienske og nederlandske
    udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '80/1238/ΕΟΚ: Δεύτερη απόφαση τής Επιτροπής
    τής 17ης Δεκεμβρίου 1980 περί παροχής αδείας σέ
    ορισμένα Κράτη μέλη νά προβλέπουν παρεκκλίσεις
    από ορισμένες διατάξεις τής οδηγίας 77/93/ΕΟΚ
    τού Συμβουλίου γιά τό ξύλο δρυός καταγωγής
    Ηνωμένων Πολιτειών Αμερικής (Τα κείμενα στην
    γαλλική, δανική, γερμανική, ιταλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '80/1238/CEE: Seconda decisione della Commissione, del 17 dicembre 1980,
    che autorizza taluni Stati membri a prevedere deroghe a determinate disposizioni
    della direttiva 77/93/CEE del Consiglio per il legname di quercia originario degli
    Stati Uniti d''America (I testi in lingua francese, danese, tedesca, italiana
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1238/EEG: Tweede Beschikking van de Commissie van 17 december 1980
    houdende machtiging van bepaalde Lid- Staten om afwijkingen van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad vast te stellen ten aanzien van eikehout van
    oorsprong uit de Verenigde Staten van Amerika (Slechts de teksten in de Franse,
    Deense, Duitse, Italiaanse en de Nederlandse taal zijn authentiek)'
