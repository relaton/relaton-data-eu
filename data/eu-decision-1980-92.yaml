title:
- language: en
  script: Latn
  content: '80/92/EEC: Commission Decision of 18 December 1979 authorizing the French
    Republic not to apply Community treatment to compound optical microscopes, falling
    within heading No 90.12 of the Common Customs Tariff, originating in Japan and
    in free circulation in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/92/CEE: Décision de la Commission, du 18 décembre 1979, autorisant
    la République française à exclure du traitement communautaire les microscopes
    optiques de la position 90.12 du tarif douanier commun originaires du Japon et
    mis en libre pratique dans les autres Etats membres (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/92/EWG: Entscheidung der Kommission vom 18. Dezember 1979, mit der
    die Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche optische Mikroskope der Tarifnummer
    90.12 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/92/EØF: Kommissionens beslutning af 18. december 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage optiske mikroskoper,
    som henhører under pos. 90.12 i den fælles toldtarif, har oprindelse i Japan
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/92/CEE: Decisione della Commissione, del 18 dicembre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i microscopi ottici,
    della voce n. 90.12 della tariffa doganale comune, originari del Giappone e messi
    in libera pratica negli altri Stati membri (Il testo in lingua francese è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/92/EEG: Beschikking van de Commissie van 18 december 1979 waarbij de
    Franse Republiek wordt gemachtigd optische microscopen van post 90.12 van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
