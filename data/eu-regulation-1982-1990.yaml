    du code NC 6912 00 50, originaire du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1982/90 DER KOMMISSION vom 11. Juli 1990 zur Wiedereinfuehrung
