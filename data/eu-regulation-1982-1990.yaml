title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1982/90 of 11 July 1990 reintroducing the
    levying of the customs duties applicable to tableware falling under CN code 6912
    00 50 originating in Brazil to which the preferential arrangements of Council
    Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1982/90 de la Commission du 11 juillet 1990 portant
