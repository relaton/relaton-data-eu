    quarter of 1974 on importation of goods covered by Regulation (EEC) No 1059/69
    and containing milk or milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 826/74 de la Commission, du 5 avril 1974, portant rectification
    des montants compensatoires et des éléments mobiles applicables, pendant le
    deuxième trimestre de l'année 1974, à l'importation de marchandises relevant
    du règlement (CEE) n 1059/69, contenant du lait ou des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 826/74 der Kommission vom 5. April 1974 zur Berichtigung
    der Ausgleichsbeträge und beweglichen Teilbeträge für das zweite Vierteljahr
    1974 bei der Einfuhr von Waren, die Milch oder Milcherzeugnisse enthalten und
    unter die Verordnung (EWG) Nr. 1059/69 fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 826/74 af 5. april 1974 om berigtigelse
