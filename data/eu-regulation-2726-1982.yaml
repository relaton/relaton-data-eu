title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2726/82 of 12 October 1982 re-establishing
    the levying of customs duties on other filament lamps for lighting, falling within
    subheading 85.20 A II and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 applye
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2726/82 de la Commission, du 12 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres lampes
    et tubes à incandescence pour l' éclairage, de la sous-position 85.20 A II du
    tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2726/82 der Kommission vom 12. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für andere Glühlampen für elektrische Beleuchtung der
    Tarifstelle 85.20 A II, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2726/82 af 12. oktober 1982 om genindførelse
    af opkrævning af told for andre glødelamper til belysning henhørende under
    pos. 85.20 A II og med oprindelse i Hongkong, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2726/82 τής Επιτροπής
    τής 12ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τούς έτερους λαμπτήρες
    καί σωλήνες διά πυρακτώσεως, διά φωτισμόν,
    τής διακρίσεως 85. 20 Α ΙΙ τού Κοινού Δασμολογίου,
    καταγωγής Χόνγκ Κόνγκ, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2726/82 della Commissione, del 12 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle altre lampade e tubi
    a incandescenza per l' illuminazione, della sottovoce 85.20 A II della tariffa
    doganale comune, originari di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3601/81 del Consiglios
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2726/82 van de Commissie van 12 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere gloeilampen
    en gloeibuizen, voor verlichtingsdoeleinden, van tariefpostonderverdeling 85.20
    A II, van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3601/81
    van de Raad vermelde tariefpreferenties zijn verleende
