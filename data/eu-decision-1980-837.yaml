title:
- language: en
  script: Latn
  content: '80/837/EEC: Commission Decision of 1 August 1980 finding that the conditions
    required for the admission of Common Customs Tariff duties of the scientific apparatus
    described as ''Canberra-X-Ray fluorescence analysis system, consisting of: Si(Li)
    detector, model 7333; Si(Li) preamplifier, model 1713; series 80 Multichannel
    Analyser and accessories'' are fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/837/CEE: Décision de la Commission, du 1er août 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Canberra-X-ray fluorescence
    analysis system, consisting of Si(Li) detector, model 7333, Si(Li) preamplifier,
    model 1713, series 80 Multichannel Analyser and accessories" sont remplies'
  type: main
- language: de
  script: Latn
  content: '80/837/EWG: Entscheidung der Kommission vom 1. August 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung des wissenschaftlichen Geräts ,,Canberra-X-Ray
    fluorescence analysis system, consisting of Si(Li)detector, model 7333, Si(Li)
    preamplifier, model 1713, und series 80 Multichannel Analyzer and accessories''
    '' von den Zöllen des Gemeinsamen Zolltarifs erfüllt sind'
  type: main
- language: da
  script: Latn
  content: '80/837/EØF: Kommissionens beslutning af 1. august 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Canberra-X-Ray fluorescence analysis system, consisting
    of Si(Li) detector, model 7333; Si(Li) preamplifier, model 1713, series 80 Multichannel
    Analyser and accessories" er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/837/EOK: Απόιφαση τής Επιτροπής τής 1ης Αυγούστου
    1980 περί διαπιστώσεως ότι οι απαιτούμενοι όροι
    γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Canberra-X-Ray Fluorscene Analyser consisting of
    si (li) detector, model 7333 si (li) preamplifier, model 1713, series 80 multichannel
    analyser accessories» πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/837/CEE: Decisione della Commissione, del 1° agosto 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Canberra-X-ray fluorescence
    analysis system, consisting of Si (Li) detector, model 7333, Si (Li) preamplifier,
    model 1713, series 80 Multichannel Analyser and accessories" sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/837/EEG: Beschikking van de Commissie van 1 augustus 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat genaamd
    ,,Canberra-X-ray fluorescence analysis system, consisting of: Si(Li) detector,
    model 7333, Si(Li) preamplifier, model 1713, series 80 Multichannel Analyser and
    accessories'' '' is voldaan'
