title:
- language: en
  script: Latn
  content: '91/41/EEC: Commission Decision of 20 December 1990 amending Decision 84/248/EEC
    authorizing the Federal Republic of Germany to adopt, when introducing into its
    territory plants or plant products, special plant health provisions for home-grown
    production of certain fruit plants intended for planting (only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/41/CEE: Décision de la Commission du 20 décembre 1990 modifiant la
    décision 84/248/CEE autorisant la République fédérale d''Allemagne à arrêter,
    lors de l''introduction sur son territoire de végétaux ou de produits végétaux,
    des dispositions phytosanitaires fixées pour la production indigène de certains
    végétaux d''espèces fruitières destinés à être plantés (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 20. Dezember 1990 zur Änderung der Entscheidung
    84/248/EWG zur Ermächtigung der Bundesrepublik Deutschland, beim Verbringen von
    Pflanzen oder Pflanzenerzeugnissen in ihr Gebiet besondere Pflanzenschutzmaßnahmen
    zu treffen, die für die einheimische Erzeugung von einigen zum Anpflanzen bestimmten
    Obstpflanzen vorgesehen sind (Nur der deutsche Text ist verbindlich) (91/41/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 20. december 1990 om ændring af beslutning
    84/248/EØF om bemyndigelse af Forbundsrepublikken Tyskland til for planter og
    planteprodukter, der indføres på dens område, at anvende de særlige plantesundhedsbestemmelser,
    som er gældende for den indenlandske produktion af visse frugtbærende planter
    bestemt til udplantning (Kun den tyske udgave er autentisk) (91/41/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/41/ΕΟΚ: Απόφαση της Επιτροπής της 20ής Δεκεμβρίου
    1990 για τροποποίηση της απόφασης 84/248/ΕΟΚ με
    την οποία εξουσιοδοτείται η Ομοσπονδιακή Δημοκρατία
    της Γερμανίας να θεσπίσει, κατά την εισαγωγή
    στο έδαφός της φυτών και φυτικών προϊόντων,
    φυτοϋγειονομικά μέτρα που έχουν θεσπιστεί
    για την εγχώρια παραγωγή ορισμένων οπωροφόρων
    που προορίζονται για φύτευση'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 20 dicembre 1990 recante modifica della
    decisione 84/248/CEE che autorizza la Repubblica federale di Germania ad adottare,
    all'' atto dell'' introduzione nel suo territorio di vegetali o prodotti vegetali,
    disposizioni fitosanitarie particolari previste per la produzione locale di determinati
    vegetali da frutto destinati alla piantagione (Il testo in lingua tedesca è il
    solo facente fede) (91/41/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 20 december 1990 tot wijziging van Beschikking
    84/248/EEG tot machtiging van de Bondsrepubliek Duitsland om, bij het binnenbrengen
    op haar grondgebied van planten of plantaardige produkten, de bijzondere fytosanitaire
    maatregelen toe te passen die voor de binnenlandse produktie van plantgoed van
    bepaalde, voor opplant bestemde fruitgewassen gelden (Slechts de tekst in de Duitse
    taal is authentiek) (91/41/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 20 de Dezembro de 1990 que altera a Decisão
    84/248/CEE que autoriza a República Federal da Alemanha a adoptar, aquando da
    introdução no seu território de plantas e produtos vegetais, disposições
    fitossanitárias especiais para a produção interna de determinadas plantas produtoras
    de fruto destinadas à plantação (Apenas faz fé o texto em língua alemã)
    (91/41/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 20 de diciembre de 1990 que modifica la Decisión
    84/248/CEE por la que se autoriza a la República Federal de Alemania a adoptar,
    en el momento de la introducción en su territorio de vegetales o productos vegetales,
    disposiciones fitosanitarias especiales para la producción autóctona de determinados
    vegetales de especies frutales destinados a ser plantados (El texto en lengua
    alemana es el único auténtico) (91/41/CEE) #'
