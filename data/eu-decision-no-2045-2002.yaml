id: EUDecisionNo20452002
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Decision No 2045/2002/EC of the European Parliament and of the Council
    of 21 October 2002 amending Decision No 1720/1999/EC adopting a series of actions
    and measures in order to ensure interoperability of and access to trans-European
    networks for the electronic interchange of data between administrations (IDA)
  type: main
- language: fr
  script: Latn
  content: Décision n° 2045/2002/CE du Parlement européen et du Conseil du 21 octobre
    2002 modifiant la décision n° 1720/1999/CE adoptant un ensemble d'actions et
    de mesures visant à assurer l'interopérabilité de réseaux transeuropéens
    pour l'échange électronique de données entre administrations (IDA) et l'accès
    à ces réseaux
  type: main
- language: de
  script: Latn
  content: Beschluss Nr. 2045/2002/EG des Europäischen Parlaments und des Rates vom
    21. Oktober 2002 zur Änderung des Beschlusses Nr. 1720/1999/EG über Aktionen
    und Maßnahmen zur Gewährleistung der Interoperabilität transeuropäischer Netze
    für den elektronischen Datenaustausch zwischen Verwaltungen und des Zugangs zu
    diesen Netzen (IDA)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 2045/2002/ES ze dne 21. října
    2002, kterým se mění rozhodnutí č. 1720/1999/ES, kterým se přijímá soubor
    akcí a opatření pro zajištění interoperability transevropských sítí pro
    elektronickou výměnu dat mezi správními orgány (IDA) a přístupu k nim
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets afgørelse nr. 2045/2002/EF af 21. oktober
    2002 om ændring af afgørelse nr. 1720/1999/EF om fastlæggelse af en række
    aktioner og foranstaltninger med henblik på at sikre interoperabilitet mellem
    og adgang til transeuropæiske net til elektronisk dataudveksling mellem administrationerne
    (Ida)
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 2045/2002/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 21ης Οκτωβρίου 2002, για
    την τροποποίηση της απόφασης αριθ. 1720/1999/ΕΚ
    για τη θέσπιση μιας σειράς δράσεων και μέτρων
    με σκοπό την εξασφάλιση της διαλειτουργικότητας
    των διευρωπαϊκών δικτύων ηλεκτρονικής ανταλλαγής
    δεδομένων μεταξύ διοικήσεων (IDA) και της πρόσβασης
    σε αυτά
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 2045/2002/EÜ, 21. oktoober 2002,
    millega muudetakse otsust nr 1720/1999/EÜ, millega võetakse vastu meetmed haldusasutustevahelise
    elektroonilise andmevahetuse (IDA) üleeuroopaliste võrkude koostalitlusvõime
    ja nendesse pääsemise tagamiseks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 2045/2002/EY, tehty 21
    päivänä lokakuuta 2002, eräistä toimista ja toimenpiteistä hallintojen välisen
    telemaattisen tietojenvaihdon (HVT) Euroopan laajuisten verkkojen yhteentoimivuuden
    ja niihin pääsyn varmistamiseksi tehdyn päätöksen N:o 1720/1999/EY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2045/2002/EK határozata (2002. október
    21.) a közigazgatási rendszerek közötti elektronikus adatcserét (IDA) lehetővé
    tevő transzeurópai hálózatok együttműködési képességét és az e hálózatokhoz
    való hozzáférést biztosító cselekvés- és intézkedéssorozatok elfogadásáról
    szóló 1720/1999/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 2045/2002/CE del Parlamento europeo e del Consiglio, del 21
    ottobre 2002, che modifica la decisione n. 1720/1999/CE che adotta una serie di
    azioni e di misure per garantire l'interoperabilità e l'accesso alle reti transeuropee
    per lo scambio elettronico di dati fra amministrazioni (IDA)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 2045/2002/EK (2002. gada 21.
    oktobris), ar kuru groza Lēmumu Nr. 1720/1999EK, ar ko pieņem vairākas darbības
    un pasākumus, lai nodrošinātu to, ka Eiropas komunikāciju tīkli elektroniskai
    datu apmaiņai starp pārvaldes iestādēm (IDA) būtu savietojami un pieejami
  type: main
- language: lt
  script: Latn
  content: 2002 m. spalio 21 d. Europos Parlamento ir tarybos Sprendimas Nr. 2045/2002/EB
    iš dalies keičiantis Sprendimą 1720/1999/EB, kuriuo patvirtinamas veiksmų
    ir priemonių paketas siekiant užtikrinti transeuropinių tinklų sąveikos gebą
    ir galimybę jais naudotis elektroniniams duomenų mainams tarp valstybės valdymo
    institucijų (IDA)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni Nru 2045/2002/KE tal-Parlament Ewropew u tal-Kunsill tal-21
    ta'Ottubru 2002 li temenda d-Deċiżjoni Nru 1720/1999/KE li tadotta serje ta'
    azzjonijiet u miżuri biex tiżgura l-interoperabilità ta' u l-aċċess għan-networks
    trans-Ewropej għall-iskambju reċiproku elettroniku ta' tagħrif bejn l-amministrazzjonijiet
    (IDA)
  type: main
- language: nl
  script: Latn
  content: Besluit nr. 2045/2002/EG van het Europees Parlement en de Raad van 21 oktober
    2002 tot wijziging van Besluit nr. 1720/1999/EG tot vaststelling van een reeks
    acties en maatregelen ter verzekering van de interoperabiliteit van en de toegang
    tot trans-Europese netten voor elektronische gegevensuitwisseling tussen overheidsdiensten
    (IDA)
  type: main
- language: pl
  script: Latn
  content: Decyzja 2045/2002/WE Parlamentu Europejskiego i Rady z dnia 21 października
    2002 r. zmieniająca decyzję 1720/1999/WE przyjmującą szereg działań i środków
    w celu zapewnienia interoperacyjności i dostępu do transeuropejskich sieci elektronicznej
    wymiany danych między administracjami (IDA)
  type: main
- language: pt
  script: Latn
  content: Decisão n.° 2045/2002/CE do Parlamento Europeu e do Conselho, de 21 de
    Outubro de 2002, que altera a Decisão n.° 1720/1999/CE do Parlamento Europeu
    e do Conselho que adopta uma série de acções e medidas destinadas a garantir
    a interoperabilidade das redes transeuropeias para o intercâmbio electrónico
    de dados entre administrações (IDA) e o acesso a essas redes
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 2045/2002/ES z 21. októbra
    2002, ktorým sa mení a dopĺňa rozhodnutie č. 1720/1999/ES, ktorým sa prijíma
    skupina činností a opatrení na účel zabezpečenia spolupráce medzi transeurópskymi
    sieťami pre elektronickú výmenu údajov medzi verejnými správami (IDA) a
    prístupu k týmto sieťam
  type: main
- language: sl
  script: Latn
  content: Sklep št. 2045/2002/ES Evropskega parlamenta In Sveta z dne 21. oktobra
    2002 o spremembi Sklepa št. 1720/1999/ES o sprejemu niza dejavnosti in ukrepov
    za zagotovitev medobratovalnosti in dostopa do čezevropskih omrežij za elektronsko
    izmenjavo podatkov med upravami (IDA)
  type: main
- language: es
  script: Latn
  content: Decisión n° 2045/2002/CE del Parlamento Europeo y del Consejo, de 21
    de octubre de 2002, por la que se modifica la Decisión n° 1720/1999/CE por la
    que se aprueba un conjunto de acciones y medidas al objeto de garantizar la interoperabilidad
    de las redes telemáticas transeuropeas destinadas al intercambio electrónico
    de datos entre administraciones (IDA), así como el acceso a las mismas
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 2045/2002/EG av den 21 oktober
    2002 om ändring av beslut nr 1720/1999/EG om att anta en rad insatser och åtgärder
    för att säkerställa driftskompatibilitet och tillträde till transeuropeiska
    nät för elektroniskt datautbyte mellan förvaltningar (IDA)
  type: main
