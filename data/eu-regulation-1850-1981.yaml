title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1850/81 of 3 July 1981 amending and derogating
    from Regulation (EEC) No 1530/78 laying down rules for the application of the
    system of aid in respect of certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1850/81 de la Commission, du 3 juillet 1981, modifiant
    et dérogeant au règlement (CEE) n° 1530/78, établissant les modalités d'
    application du régime d' aide pour certains produits transformés à base de
    fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1850/81 der Kommission vom 3. Juli 1981 zur Änderung
    und Abweichung von der Verordnung (EWG) Nr. 1530/78 zur Festlegung der Durchführungsbestimmungen
    zu der Beihilferegelung für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1850/81 af 3. juli 1981 om ændring
    af og undtagelse fra forordning (EØF) nr. 1530/78 om gennemførelsesbestemmelser
    vedrørende støtteordningen for visse produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
