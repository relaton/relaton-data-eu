title:
- language: en
  script: Latn
  content: '82/10/ECSC: Commission Decision of 10 December 1981 extending the period
    of validity of the authorization concerning the equalization fund established
    by the Chamber of Coal Traders and the National Coal Board, London, to reduce
    the price of anthracite and anthracite briquettes originating from within the
    Community and from third countries (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/10/CECA: Décision de la Commission, du 10 décembre 1981, portant
    prorogation de l''approbation d''une caisse de péréquation constituée par la
    Chamber of Coal Traders et le National Coal Board, Londres, en vue de réduire
    le prix de l''anthracite et des agglomérés d''anthracite provenant d''autres
    pays membres de la Communauté et de pays tiers (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/10/EGKS: Entscheidung der Kommission vom 10. Dezember 1981 zur Verlängerung
    der Genehmigung einer von der Chamber of Coal Traders und dem National Coal Board,
    London, eingerichteten Ausgleichskasse zur Verbilligung von aus der Gemeinschaft
    und Drittländern bezogenen Anthrazitkohlen und -briketts (Nur der englische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/10/EKSF: Kommissionens beslutning af 10. december 1981 om forlængelse
    af tilladelsen til en af Chamber of Coal Traders og National Coal Board, London,
    oprettet clearingkasse (udligningsfond) til billiggørelse af antracit og antracitbriketter
    indkøbt fra Fællesskabet og tredjelande (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/10/EKAX: Απόφαση τής Επιτροπής τής 10ης Δεκεμβρίου
    1981 περί παρατάσεως τής αδείας εξισωτικού ταμείου
    πού έχει συσταθεί από τό Chamber of Coal Traders καί τό
    National Coal Board, Λονδίνο, γιά τή μείωση τών τιμών
    τού ανθρακίτη καί τών πλίνθων ανθρακίτη πού
    προέρχονται από τήν Κοινότητα καί από τρίτες
    χώρες (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/10/CECA: Decisione della Commissione, del 10 dicembre 1981, relativa
    alla proroga dell''autorizzazione di una cassa di compensazione istituita dalla
    Chamber of Coal Traders e dal National Coal Board, Londra, al fine di ridurre
    il prezzo dell''antracite e della bricchetta d''antracite importate dai paesi
    della Comunità e dai paesi terzi (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '82/10/EGKS: Beschikking van de Commissie van 10 december 1981 inzake de
    verlenging van de goedkeuring van een door de Chamber of Coal Traders in het Verenigd
    Koninkrijk en de National Coal Board te Londen opgerichte compensatiekas met het
    oog op een verlaging van uit de Gemeenschap en derde landen betrokken antracietkolen
    en antracietbriketten (Slechts de tekst in de Engelse taal is authentiek)'
