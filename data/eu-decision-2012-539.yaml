    om samordning av förfarandena vid upphandling på områdena vatten, energi, transporter
    och posttjänster när det gäller produktion och grossistförsäljning av el
    från konventionella källor i Italiens norra makroområde och södra makroområde
    och om ändring av kommissionens beslut 2010/403/EU [delgivet med nr C(2012) 6665]'
