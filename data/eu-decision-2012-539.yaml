    la aplicarea Directivei 2004/17/CE a Parlamentului European și a Consiliului
    de coordonare a procedurilor de atribuire a contractelor de achiziții în sectoarele
    apei, energiei, transporturilor și serviciilor poștale și de modificare a Deciziei
    2010/403/UE a Comisiei [notificată cu numărul C(2012) 6665]'
  type: main
- language: sk
  script: Latn
