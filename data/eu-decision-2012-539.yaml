    veiklą vandens, energetikos, transporto ir pašto paslaugų sektoriuose, vykdomų
    pirkimų tvarkos derinimo netaikymo elektros energijos iš įprastinių energijos
    išteklių gamybai ir didmeninei prekybai Italijos Šiaurės ir Pietų makrozonose,
    kuriuo iš dalies keičiamas Komisijos sprendimas 2010/403/ES (pranešta dokumentu
    Nr. C(2012) 6665)'
  type: main
