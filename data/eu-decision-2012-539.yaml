    északi és déli makroövezeteiben történő előállításának és nagykereskedelmi
    értékesítésének a vízügyi, energiaipari, közlekedési és postai ágazatban
    működő ajánlatkérők beszerzési eljárásainak összehangolásáról szóló
    2004/17/EK európai parlamenti és tanácsi irányelv alkalmazása alóli mentesítéséről
    és a 2010/403/EU bizottsági határozat módosításáról (az értesítés a
    C(2012) 6665. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2012/539/UE: Decisione di esecuzione della Commissione, del 26 settembre
    2012 , che esonera la produzione e la vendita all’ingrosso di energia elettrica
    da fonti convenzionali in Italia nella macro zona Nord e nella macro zona Sud
    dall’applicazione della direttiva 2004/17/CE del Parlamento europeo e del Consiglio
    che coordina le procedure di appalto degli enti erogatori di acqua e di energia,
    degli enti che forniscono servizi di trasporto e servizi postali e che modifica
    la decisione 2010/403/UE della Commissione [notificata con il numero C(2012) 6665]'
  type: main
- language: lv
  script: Latn
  content: '2012/539/ES: Komisijas Īstenošanas lēmums ( 2012. gada 26. septembris
    ), ar kuru elektroenerģijas ražošanai no tradicionālajiem energoavotiem un
    šādas elektroenerģijas vairumtirdzniecībai Itālijas ziemeļu makrozonā un
    dienvidu makrozonā piemēro atbrīvojumu no Eiropas Parlamenta un Padomes Direktīvas
    2004/17/EK, ar ko koordinē iepirkuma procedūras, kuras piemēro subjekti, kas
    darbojas ūdensapgādes, enerģētikas, transporta un pasta pakalpojumu nozarēs,
    un ar kuru groza Komisijas Lēmumu 2010/403/ES (izziņots ar dokumenta numuru
    C(2012) 6665)'
  type: main
- language: lt
  script: Latn
  content: '2012/539/ES: 2012 m. rugsėjo 26 d. Komisijos įgyvendinimo sprendimas
