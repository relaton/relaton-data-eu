    waarbij de productie van en groothandel in elektriciteit in macro-zone Noord en
    macro-zone Zuid in Italië worden vrijgesteld van de toepassing van Richtlijn
    2004/17/EG van het Europees Parlement en de Raad houdende coördinatie van de
    procedures voor het plaatsen van opdrachten in de sectoren water- en energievoorziening,
