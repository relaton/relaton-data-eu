title:
- language: en
  script: Latn
  content: '2012/539/EU: Commission Implementing Decision of 26 September 2012 exempting
    the production and wholesale of electricity produced from conventional sources
    in macro-zone north and macro-zone south in Italy from the application of Directive
    2004/17/EC of the European Parliament and of the Council coordinating the procurement
    procedures of entities operating in the water, energy, transport and postal services
    sector and amending Commission Decision 2010/403/EU (notified under document C(2012)
    6665)'
  type: main
- language: fr
  script: Latn
  content: '2012/539/UE: Décision d’exécution de la Commission du 26 septembre
    2012 exemptant la production et le commerce de gros d’électricité produite
    à partir de sources traditionnelles dans la macrozone nord et dans la macrozone
    sud de l’Italie de l’application de la directive 2004/17/CE du Parlement européen
    et du Conseil portant coordination des procédures de passation des marchés dans
    les secteurs de l’eau, de l’énergie, des transports et des services postaux
    et modifiant la décision 2010/403/UE de la Commission [notifiée sous le numéro
    C(2012) 6665]'
  type: main
- language: de
  script: Latn
  content: '2012/539/EU: Durchführungsbeschluss der Kommission vom 26. September
    2012 zur Freistellung der Erzeugung von und des Großhandels mit Strom aus konventionellen
    Quellen in der Makrozone Nord und der Makrozone Süd in Italien von der Anwendung
    der Richtlinie 2004/17/EG des Europäischen Parlaments und des Rates zur Koordinierung
    der Zuschlagserteilung durch Auftraggeber im Bereich der Wasser-, Energie- und
    Verkehrsversorgung sowie der Postdienste und zur Änderung des Beschlusses 2010/403/EU
    der Kommission (Bekanntgegeben unter Aktenzeichen C(2012) 6665)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/539/ЕС: Решение за изпълнение на Комисията
    от 26 септември 2012 година за освобождаване на
    производството и търговията на едро с електрическа
    енергия, произведена от конвенционални източници
    в макрозона „Север“ и макрозона „Юг“ в Италия,
    от прилагането на Директива 2004/17/ЕО на Европейския
    парламент и на Съвета относно координирането
    на процедурите за възлагане на поръчки от възложители,
    извършващи дейност в секторите на водоснабдяването,
    енергетиката, транспорта и пощенските услуги
    и за изменение на Решение 2010/403/ЕС на Комисията
    (нотифицирано под номер C(2012) 6665)'
  type: main
- language: cs
  script: Latn
  content: '2012/539/EU: Prováděcí rozhodnutí Komise ze dne 26. září 2012 o
    vynětí výroby a velkoobchodního prodeje elektřiny z konvenčních zdrojů
    v makrozóně Sever a makrozóně Jih v Itálii z použití směrnice Evropského
    parlamentu a Rady 2004/17/ES o koordinaci postupů při zadávání zakázek subjekty
    působícími v odvětví vodního hospodářství, energetiky, dopravy a poštovních
    služeb a o změně rozhodnutí Komise 2010/403/EU (oznámeno pod číslem C(2012)
    6665)'
