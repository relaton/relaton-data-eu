    perinteisiin energialähteisiin perustuvan sähköntuotannon ja niistä tuotetun
    sähkön tukkumyynnin jättämisestä vesi- ja energiahuollon sekä liikenteen
    ja postipalvelujen alalla toimivien yksiköiden hankintamenettelyjen yhteensovittamisesta
    annetun Euroopan parlamentin ja neuvoston direktiivin 2004/17/EY soveltamisalan
    ulkopuolelle sekä komission päätöksen 2010/403/EU muuttamisesta (tiedoksiannettu
    numerolla C(2012) 6665)'
  type: main
- language: hu
  script: Latn
  content: '2012/539/EU: A Bizottság végrehajtási határozata ( 2012. szeptember
