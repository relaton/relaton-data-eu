    die Zollkontingentregelung für die Einfuhr von Bananen in die Gemeinschaft und
    zur Änderung der Verordnung (EWG) Nr. 1442/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 478/95 af 1. marts 1995 om supplerende
