title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2571/84 of 10 September 1984 re-establishing
    the levying of customs duties on statuettes and other ornaments, and articles
    of personal adornment; articles of furniture, falling within heading No 69.13
    and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2571/84 de la Commission du 10 septembre 1984 portant
    rétablissement de la perception des droits de douane applicables aux statuettes,
    objets de fantaisie, d' ameublement, d' ornementation ou de parure, de la position
    69.13 du tarif douanier commun, originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2571/84 der Kommission vom 10. September 1984 zur
    Wiedereinführung der Erhebung der Zölle für Figuren, Phantasiegegenstände,
    Einrichtungs-, Zier- und Schmuckgegenstände der Tarifnummer 69.13 mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2571/84 af 10. september 1984 om genindførelse
    af opkrævning af told for statuetter og andre dekorationsgenstande; pyntegenstande
    til personlig brug; artikler til boligudstyr henhørende under pos. 69.13 og med
    oprindelse i Sydkorea som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2571/84 της Επιτροπής
    της 10ης Σεπτεμβρίου 1984 περί αποκαταστάσεως
    της εφαρμογής των δασμών για αγαλματίδια, μικροκαλλιτεχνήματα,
    αντικείμενα επιπλώσεως, διακοσμήσεως ή ατομικού
    στολισμού της κλάσεως 69.13 του Κοινού Δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2571/84 della Commissione del 10 settembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili alle statuette, oggetti
    di fantasia, di arredamento o di ornamento anche personale, della voce 69.13 della
    tariffa doganale comune, originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2571/84 van de Commissie van 10 september 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op beeldjes, fancy-artikelen,
    meubilerings- en versieringsvoorwerpen, lijfsieraden, van tariefpost 69.13, van
    oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3569/83 van de
    Raad vermelde tariefpreferenties zijn verleend
  type: main
