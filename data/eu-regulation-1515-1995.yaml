title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1515/95 of 29 June 1995 amending Regulation
    (EEC) No 2245/90 laying down detailed rules for the application of the import
    arrangements applicable to products falling within CN codes 0714 10 91 and 0714
    90 11 and originating in the African, Caribbean and Pacific (ACP) States or in
    the overseas countries and territories (OCT) in order to implement the agreement
    on agriculture concluded during the Uruguay Round negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1515/95 de la Commission, du 29 juin 1995, modifiant
    le règlement (CEE) nº 2245/90 portant modalités d' application du régime à
    l' importation des produits des codes NC 0714 10 91 et 0714 90 11 originaires
    des États d' Afrique, des Caraïbes et du Pacifique (ACP) ou des pays et territoires
    d' outre-mer (PTOM) en vue de la mise en oeuvre de l' accord sur l' agriculture
    conclu dans le cadre des négociations du cycle d' Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1515/95 der Kommission vom 29. Juni 1995 zur Änderung
    der Verordnung (EWG) Nr. 2245/90 mit Durchführungsbestimmungen zur Einfuhrregelung
    für Erzeugnisse der KN-Codes 0714 10 91 und 0714 90 11 mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean (AKP) oder in den Überseeischen
    Ländern und Gebieten (ÜLG) im Hinblick auf die Durchführung des im Rahmen der
    Verhandlungen der Uruguay-Runde geschlossenen Übereinkommens über die Landwirtschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1515/95 af 29. juni 1995 om ændring
    af forordning (EØF) nr. 2245/90 om gennemførelsesbestemmelser til importordningen
    for produkter henhørender under KN-kode 0714 10 91 og 0714 90 11 med oprindelse
    i staterne i Afrika, Vestindien og Stillehavet (AVS) eller i de oversøiske lande
    og territorier (OLT) i forbindelse med gennemførelsen af den landbrugsaftale,
    som er indgået under forhandlingerne i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1515/95 της Επιτροπής
    της 29ης Ιουνίου 1995 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 2245/90 για τις λεπτομέρειες εφαρμογής
    του καθεστώτος εισαγωγής προϊόντων που υπάγονται
    στους κωδικούς ΣΟ 0714 10 91 και 0714 90 11, καταγωγής
    των κρατών της Αφρικής, της Καραϊβικής, του
    Ειρηνικού (ΑΚΕ) ή των υπερποντίων χωρών και
    εδαφών (ΥΧΕ), για την εφαρμογή της συμφωνίας
    επί της γεωργίας που συνήφθη στο πλαίσιο των
    διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1515/95, annettu 29 päivänä kesäkuuta 1995,
    CN-koodeihin 0714 10 91 ja 0714 90 11 kuuluvien Afrikan, Karibian ja Tyynenmeren
    (AKT) valtioista tai merentakaisista maista ja merentakaisilta alueilta (MMA)
    peräisin olevien tuotteiden tuontijärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (ETY) N:o 2245/90 muuttamisesta Uruguayn kierroksen
    yhteydessä käytyjen neuvotteluiden aikana tehdyn maataloussopimuksen täytäntöönpanemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1515/95 della Commissione, del 29 giugno 1995, che
    modifica il regolamento (CEE) n. 2245/90 recante modalità d' applicazione del
    regime d' importazione dei prodotti di cui ai codici NC 0714 10 91 e 0714 90 11
    originari degli Stati dell' Africa, dei Caraibi e del Pacifico (ACP) o dei paesi
    e territori d' oltremare (PTOM), ai fini dell' attuazione dell' accordo agricolo
    concluso nel quadro dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1515/95 van de Commissie van 29 juni 1995 tot wijziging
    van Verordening (EEG) nr. 2245/90 houdende uitvoeringsbepalingen van de regeling
    voor invoer van produkten van de GN-codes 0714 10 91 en 0714 90 11 van oorsprong
    uit de Staten in Afrika, het Caribische gebied en de Stille Oceaan (ACS) of uit
    de landen en gebieden overzee (LGO), ter uitvoering van de Overeenkomst inzake
    de landbouw die is gesloten in het kader van de Uruguay-Ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1515/95 da Comissão, de 29 de Junho de 1995, que
    altera o Regulamento (CEE) nº 2245/90, que estabelece normas de execução do
    regime de importação dos produtos dos códigos NC 0714 10 91 e 0714 90 11 originários
    dos Estados de África, das Caraíbas e do Pacífico (ACP) ou dos países e territórios
    ultramarinos (PTU) com vista à execução do acordo agrícola concluído no âmbito
    das negociações do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1515/95 de la Comisión, de 29 de junio de 1995, por
    el que se modifica el Reglamento (CEE) nº 2245/90, por el que se establecen las
    disposiciones de aplicación del régimen de importación de productos de los
    códigos NC 0714 10 91 y 0714 90 11 originarios de los Estados de África, del
    Caribe y del Pacífico (ACP) o de los países y territorios de Ultramar (PTU),
    para la aplicación del Acuerdo agrícola celebrado en el marco de las negociaciones
    de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1515/95 av den 29 juni 1995 om ändring
    av förordning (EEG) nr 2245/90 om tillämpningsföreskrifter för importordningen
    för produkter som omfattas av KN-numren 0714 10 91 och 0714 90 11 med ursprung
    i stater i Afrika, Västindien och Stillahavsområdet (AVS-staterna) eller i utomeuropeiska
    länder och territorier (ULT) i syfte att genomföra det jordbruksavtal som slöts
    inom ramen för förhandlingarna i Uruguayrundan
