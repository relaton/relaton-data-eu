title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2569/1999 of 3 December 1999 repealing Regulation
    (EC) No 2529/1999 suspending the preferential customs duty and re-establishing
    the Common Customs Tariff duty on imports of multiflorous (spray) carnations originating
    in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2569/1999 de la Commission, du 3 décembre 1999, abrogeant
    le règlement (CE) n° 2529/1999 suspendant le droit de douane préférentiel
    et réinstaurant le droit du tarif douanier commun à l'importation d'oeillets
    multiflores (spray) originaires du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2569/1999 der Kommission vom 3. Dezember 1999 zur Aufhebung
    der Verordnung (EG) Nr. 2529/1999 zur Aussetzung des bei der Einfuhr von mehrblütigen
    (Spray) Nelken mit Ursprung in Marokko zu erhebenden Präferenzzolls und zur Wiedereinführung
    des Satzes des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2569/1999 af 3. december 1999 om ophævelse
    af forordning (EF) nr. 2529/1999 om suspension af præferencetolden og genindførelse
    af tolden ifølge den fælles toldtarif ved indførsel af mangeblomstrede nelliker
    (spray) med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2569/1999 της Επιτροπής,
    της 3ης Δεκεμβρίου 1999, για την κατάργηση του
    κανονισμού (ΕΚ) αριθ. 2529/1999 με τον οποίο αναστέλλεται
    ο προτιμησιακός τελωνειακός δασμός και θεσπίζεται
    εκ νέου ο δασμός του κοινού δασμολογίου κατά
    την εισαγωγή πολυανθών γαριφάλων (spray) προερχομένων
    από το Μαρόκο
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2569/1999, annettu 3 päivänä joulukuuta 1999,
    Marokosta peräisin olevien terttuneilikoiden (spraytyyppi) tuonnin etuustullien
    suspendoimisesta ja yhteisen tullitariffin tullin uudelleen käyttöön ottamisesta
    annetun asetuksen (EY) N:o 2529/1999 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2569/1999 della Commissione, del 3 dicembre 1999, recante
    abrogazione del regolamento (CE) n. 2529/1999 che sospende il dazio doganale preferenziale
    e ripristina il dazio della tariffa doganale comune all'importazione dei garofani
    a fiore multiplo (spray) originari del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2569/1999 van de Commissie van 3 december 1999 houdende
    intrekking van Verordening (EG) nr. 2529/1999 tot schorsing van het preferentiële
    douanerecht en tot wederinvoering van het gemeenschappelijk douanerecht bij invoer
    van veelbloemige anjers (tros) van oorsprong uit Marokko
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2569/1999 da Comissão, de 3 de Dezembro de 1999,
    que revoga o Regulamento (CE) n.° 2529/1999 que suspende o direito aduaneiro
    preferencial e restaura o direito da pauta aduaneira comum na importação de
    cravos multifloros (spray) originários de Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2569/1999 de la Comisión, de 3 de diciembre de 1999,
    que deroga el Reglamento (CE) n° 2529/1999 por el que se suspende el derecho
    de aduana preferencial y se restablece el derecho del arancel aduanero común
    a la importación de claveles de varias flores (spray) originarios de Marruecos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2569/1999 av den 3 december 1999 om upphävande
    av förordning (EG) nr 2529/1999 om tillfälligt upphävande av förmånstullen
    och återinförande av tullsatsen i Gemensamma tulltaxan för import av elegancenejlikor
    (spray) med ursprung i Marocko
  type: main
