title:
- language: en
  script: Latn
  content: Commission Directive 70/50/EEC of 22 December 1969 based on the provisions
    of Article 33 (7), on the abolition of measures which have an effect equivalent
    to quantitative restrictions on imports and are not covered by other provisions
    adopted in pursuance of the EEC Treaty
  type: main
- language: fr
  script: Latn
  content: Directive 70/50/CEE de la Commission, du 22 décembre 1969, fondée sur
    les dispositions de l'article 33 paragraphe 7, portant suppression des mesures
    d'effet équivalant à des restrictions quantitatives à l'importation non visées
    par d'autres dispositions prises en vertu du traité CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 70/50/EWG der Kommission vom 22. Dezember 1969, gestützt auf
    die Vorschriften des Artikels 33 Absatz 7 über die Beseitigung von Maßnahmen
    gleicher Wirkung wie mengenmäßige Einfuhrbeschränkungen, die nicht unter andere
    auf Grund des EWG-Vertrags erlassene Vorschriften fallen
  type: main
- language: bg
  script: Cyrl
  content: Директива на Комисията от 22 декември 1969
    година базирана на разпоредбите на член 33,
    параграф 7 за премахване на мерките, които имат
    ефект, равен на количествени ограничения при
    вноса и не са обхванати от други разпоредби,
    приети в изпълнение на разпоредбите на Договора
    за ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise ze dne 22. prosince 1969 založená na čl. 33 odst. 7
    o zrušení opatření s účinkem rovnocenným množstevním omezením dovozu,
    na která se nevztahují jiné předpisy přijaté na základě Smlouvy o EHS
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 70/50/EØF af 22. december 1969 under henvisning
    til bestemmelserne i artikel 33, stk. 7, om afskaffelse af foranstaltninger med
    tilsvarende virkning som kvantitative importrestriktioner, der ikke omfattes af
    andre bestemmelser truffet i medfør af EØF- traktaten
  type: main
- language: el
  script: Grek
  content: Οδηγία 70/50/ΕΟΚ της Επιτροπής, της 22ας Δεκεμβρίου
    1969, με βάση τις διατάξεις του άρθρου 33 παράγραφος
    7, περί κατάργησης των μέτρων ισοδυνάμου αποτελέσματος
    για τους ποσοτικούς περιορισμούς στις εισαγωγές
    που δεν καλύπτονται από άλλες διατάξεις που
    έχουν θεσπιστεί με βάση την Συνθήκη ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv, 22. detsember 1969, mis põhineb artikli 33 lõike
    7 sätetel, nende meetmete kaotamise kohta, millel on koguseliste impordipiirangutega
    samaväärne toime ja mida ei hõlma muud EMÜ asutamislepingu kohaselt vastuvõetud
    sätted
  type: main
- language: hr
  script: Latn
  content: '70/50/EEZ: Direktiva Komisije od 22. prosinca 1969. koja se temelji na
    odredbama članka 33. stavka 7. o ukidanju mjera koje imaju učinak istovrstan
    količinskim ograničenjima na uvoz, a koje nisu obuhvaćene ostalim odredbama
    usvojenima sukladno Ugovoru o osnivanju EEZ-a'
  type: main
- language: hu
  script: Latn
  content: A Bizottság irányelve (1969. december 22.) a 33. cikk (7) bekezdésének
    rendelkezései alapján a behozatal mennyiségi korlátozásaival azonos hatású
    és az EGK-Szerződés értelmében elfogadott egyéb rendelkezések hatálya
    alá nem tartozó intézkedések megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 70/50/CEE della Commissione, del 22 dicembre 1969, che trova
    la sua fonte normativa nel disposto dell'articolo 33 paragrafo 7, del Trattato,
    relativa alla soppressione delle misure d'effetto equivalente a restrizioni quantitative
    non contemplate da altre disposizioni prese in virtú del Trattato CEE
  type: main
- language: lv
  script: Latn
  content: Komisijas direktīva (1969. gada 22. decembris), kuras pamatā ir 33. panta
    7. punkta noteikumi, par to pasākumu atcelšanu, kuru sekas ir līdzvērtīgas
    kvantitatīvajiem importa ierobežojumiem un uz kuriem neattiecas citi noteikumi,
    kas pieņemti saskaņā ar Eiropas Ekonomikas kopienas dibināšanas līgumu
  type: main
- language: lt
  script: Latn
  content: 1969 m. gruodžio 22 d. Komisijos direktyva pagrįsta 33 straipsnio 7 dalies
    nuostatomis dėl priemonių, turinčių kiekybiniams importo apribojimams lygiavertį
    poveikį, kurioms netaikomos kitos nuostatos, priimtos pagal Europos ekonominės
    bendrijos sutartį, panaikinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni tat-22 ta' Diċembru 1969 bażata fuq id-dispożizzjonijiet
    ta' Artikolu 33(7), dwar it-tneħħija ta' miżuri li għandhom effett ekwivalenti
    għal restrizzjonijiet kwantitattivi fuq l-importazzjoni u li m'humiex koperti
    minn dispożizzjonijiet oħra adottati skond it-Trattat tal-KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 70/50/EEG van de Commissie van 22 december 1969 gebaseerd op
    de bepalingen van artikel 33, lid 7, houdende opheffing van de maatregelen van
    gelijke werking als kwantitatieve invoerbeperkingen, niet bedoeld in andere krachtens
    het EEG-Verdrag vastgestelde bepalingen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji z dnia 22 grudnia 1969 r. oparta na przepisach art. 33
    ust. 7 w sprawie zniesienia środków mających skutek równoważny do ograniczeń
    ilościowych w przywozie i nieprzewidzianych innymi przepisami przyjętymi na
    mocy Traktatu EWG
  type: main
- language: ro
  script: Latn
  content: Directiva Comisiei din 22 decembrie 1969 în temeiul articolului 33 alineatul
    (7) privind eliminarea măsurilor cu efect echivalent cu cel al restricțiilor
    cantitative la import care nu sunt reglementate de alte dispoziții adoptate în
    temeiul Tratatului CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie z 22. decembra 1969 vychádzajúca z ustanovení článku
    33 ods. 7 o zrušení opatrení, ktoré majú účinok rovnocenný s kvantitatívnymi
    obmedzeniami dovozu a nevzťahujú sa na ne ostatné ustanovenia prijaté podľa
    Zmluvy o EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije z dne 22. decembra 1969, ki temelji na določbah člena
    33(7) o odpravi ukrepov, ki imajo enak učinek kot količinske omejitve pri uvozu
    in ki jih ne zajemajo drugi predpisi, sprejeti skladno s Pogodbo o ustanovitvi
    EGS
  type: main
