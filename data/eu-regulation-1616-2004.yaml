title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1616/2004 of 13 September 2004 terminating the
    anti-dumping proceedings concerning imports of certain flat-rolled products of
    iron or non-alloy steel, of a width of 600 mm or more, not clad, plated or coated,
    in coils, not further worked than hot-rolled, originating in Bulgaria and South
    Africa
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1616/2004 du Conseil du 13 septembre 2004 clôturant
    les procédures antidumping concernant les importations de certains produits laminés
    plats, en fer ou en aciers non alliés, d'une largeur de 600 mm ou plus, non plaqués
    ni revêtus, enroulés, simplement laminés à chaud, originaires de Bulgarie
    et d'Afrique du Sud
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1616/2004 des Rates vom 13. September 2004 zur Einstellung
    des Antidumpingverfahrens betreffend die Einfuhren bestimmter flachgewalzter Erzeugnisse
    aus Eisen oder nicht legiertem Stahl mit einer Breite von 600 mm oder mehr, weder
    plattiert noch überzogen, in Rollen (Coils), nur warmgewalzt, mit Ursprung in
    Bulgarien und Südafrika
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1616/2004 ze dne 13. září 2004, kterým se
    zastavuje antidumpingové řízení týkající se dovozu některých plochých
    válcovaných výrobků ze železa nebo nelegované oceli o šířce nejméně
    600 mm, neplátovaných, nepokovených ani nepovlakovaných, ve svitcích, pouze
    válcovaných za tepla, pocházejících z Bulharska a Jižní Afriky
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1616/2004 af 13. september 2004 om afslutning
    af antidumpingprocedurerne vedrørende importen af visse fladvalsede produkter
    af jern og ulegeret stål, af bredde 600 mm og derover, ikke pletterede, belagte
    eller overtrukne, i oprullet stand, kun varmtvalsede, med oprindelse i Bulgarien
    og Sydafrika
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1616/2004 του Συμβουλίου,
    της 13ης Σεπτεμβρίου 2004, για την περάτωση της
    διαδικασίας αντιντάμπινγκ σχετικά με τις εισαγωγές
    ορισμένων πλατέων προϊόντων έλασης από σίδηρο
    ή από όχι σε κράμα χάλυβες, με πλάτος 600 mm ή περισσότερο,
    μη επιστρωμένων με άλλο μέταλλο ούτε επενδυμένων,
    περιελιγμένων, που έχουν υποβληθεί απλώς σε
    θερμή έλαση, καταγωγής Βουλγαρίας και Νότιας
    Αφρικής
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1616/2004, 13. september 2004, millega lõpetatakse
    teatavate Bulgaariast ja Lõuna-Aafrikast pärinevate rauast või legeerimata
    terasest vähemalt 600 mm laiuste, plakeerimata, pindamata ja katmata kuumvaltsitud,
    kuid muul viisil töötlemata rullikeeratud lehtvaltstoodete importi käsitlev
    dumpinguvastane menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1616/2004, annettu 13 päivänä syyskuuta 2004,
    Bulgariasta ja Etelä-Afrikasta peräisin olevien, raudasta tai seostamattomasta
    teräksestä valmistettujen, vähintään 600 millimetrin levyisten pleteroimattomien
    ja muulla tavalla metallilla tai muulla aineella pinnoittamattomien, kelattujen,
    ei enempää valmistettujen kuin kuumavalssattujen levyvalmisteiden tuontia koskevan
    polkumyynnin vastaisen menettelyn päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 1616/2004/EK rendelete (2004. szeptember 13.) az egyes Bulgáriából
    és Dél-Afrikából származó, a meleghengerlésen túl tovább nem megmunkált,
    tekercsben lévő, plattírozás, lemezelés vagy bevonat nélküli, síkhengerelt
    vas vagy nem ötvözött acél termékek behozatalára vonatkozó dömpingellenes
    eljárás megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1616/2004 del Consiglio, del 13 settembre 2004, che
    chiude i procedimenti antidumping relativi alle importazioni di alcuni tipi di
    prodotti laminati piatti, di ferro o di acciai non legati, di larghezza pari o
    superiore a 600 mm, non placcati né rivestiti, arrotolati, semplicemente laminati
    a caldo, originarie della Bulgaria e del Sudafrica
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1616/2004 (2004. gada 13. septembris), ar kuru
    izbeidz antidempinga procedūru attiecībā uz dažu tādu plakanu dzelzs un neleģētā
    tērauda velmējumu importu, kam platums ir 600 mm vai vairāk, kas ir neplaķēti,
    bez elektrolītiska vai cita pārklājuma, ruļļos un kas nav vairāk apstrādāti,
    kā tikai karsti velmēti, ar izcelsmi Bulgārijā un Dienvidāfrikā
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugsėjo 13 d. Tarybos reglamentas (EB) Nr. 1616/2004, nutraukiantis
    antidempingo procedūras, taikomas tam tikrų Bulgarijos ir Pietų Afrikos kilmės
    neplakiruotų, nepadengtų ir neapvilktų, suvyniotų į ritinius, po karštojo
    valcavimo toliau neapdorotų plokščių valcavimo gaminių iš geležies arba
    iš nelegiruotojo plieno, kurių plotis ne mažesnis kaip 600 mm, importo atžvilgiu
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1616/2004 tat- 13 ta' Settembru 2004 li
    jtemm il-proċeduri anti-dumping fuq l-importazzjonijiet ta' ċerti prodotti flat-rolled
    tal-ħadid jew ta' l-azzar mhux illigat, b'wisa' ta' 600 mm jew iżjed, mhux plakkati,
    indurati jew miksija, f'kojls, mhux maħdumin aktar milli hot-rolled , li joriġinaw
    fil-Bulgarija u fl-Afrika ta' Isfel
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1616/2004 van de Raad van 13 september 2004 tot beëindiging
    van de antidumpingprocedure betreffende gewalste platte producten, van ijzer of
    van niet gelegeerd staal met een breedte van 600 mm of meer, niet geplateerd,
    noch bekleed, opgerold, enkel warmgewalst, uit Bulgarije en Zuid-Afrika
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1616/2004 z dnia 13 września 2004 r. w sprawie
    umorzenia postępowania antydumpingowego dotyczącego przywozu określonych wyrobów
    walcowanych płaskich wykonanych z żelaza lub stali węglowej, o szerokości
    600 mm lub większej, nieplaterowanych i niepokrytych innym materiałem, w zwojach,
    niepoddanych dalszej obróbce niż walcowanie na gorąco, pochodzących z Bułgarii
    i Republiki Południowej Afryki
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1616/2004 do Conselho, de 13 de Setembro de 2004,
    que encerra o processo anti-dumping relativo às importações de certos produtos
    laminados planos, de ferro ou aço não ligado, de largura igual ou superior a
    600 mm, não folheados, chapeados ou revestidos, em rolos, simplesmente laminados
    a quente, originários da Bulgária e da África do Sul
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1616/2004 z 13. septembra 2004, ktorým sa zastavuje
    antidumpingové konanie týkajúce sa dovozov určitých plochých valcovaných
    výrobkov zo železa alebo z nelegovanej ocele, širokých 600 mm alebo viac,
    neplátovaných, plátovaných alebo pokovovaných v kotúčoch, valcovaných
    za tepla a ďalej nespracovaných, s pôvodom v Bulharsku a Južnej Afrike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1616/2004 z dne 13. septembra 2004 o zaključku
    protidampinških postopkov v zvezi z uvozom določenih sploščeno valjanih izdelkov
    iz železa ali nelegiranega jekla, širine 600 mm ali več, neprevlečenih, v
    svitkih, neobdelanih dlje kot vroče valjanih, s poreklom iz Bolgarije in Južne
    Afrike
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1616/2004 del Consejo, de 13 de septiembre de 2004,
    por el que se dan por concluidos los procedimientos antidumping relativos a las
    importaciones de determinados productos laminados planos, de hierro o de acero
    sin alear, de anchura superior o igual a 600 mm, sin chapar ni revestir, enrollados,
    simplemente laminados en caliente, originarias de Bulgaria y Sudáfrica
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1616/2004 av den 13 september 2004 om avslutande
    av antidumpningsförfarandena rörande import av vissa valsade platta produkter
    av järn eller olegerat stål, med en bredd av minst 600 mm, varken pläterade,
    på annat sätt metallöverdragna eller försedda med annat överdrag, i ringar
    eller rullar, inte vidare bearbetade efter varmvalsningen, med ursprung i Bulgarien
    och Sydafrika
