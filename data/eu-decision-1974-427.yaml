id: EUDecision1974427
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 August 1974 authorizing the Federal Republic of
    Germany not to apply Community treatment to preparations and preserves of beans
    in pod falling within heading No 20.02 ex G of the Common Customs Tariff, originating
    in the People's Republic of China and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: Décision 74/427/CEE de la Commission, du 7 août 1974, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de haricots verts, de la sous-position 20.02 Ex G du Tarif douanier
    commun, originaires de la République populaire de Chine et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. August 1974, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Volksrepublik China stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Konserven und Zubereitungen
    von grünen Bohnen der Tarifnummer 20.02 ex G des Gemeinsamen Zolltarifs von der
    Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. august 1974 om bemyndigelse til fra fællesskabsbehandling
    at undtage grønne bønner, tilberedt eller konserveret, som henhører under position
    20.02 ex G i den fælles toldtarif, har oprindelse i folkerepublikken Kina og
    frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 agosto 1974, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le preparazioni
    e conserve di fagiolini, della voce n. 20.02 ex G della tariffa doganale comune,
    originarie della Repubblica popolare cinese e messe in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 augustus 1974 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bereidingen en conserven van sla-, spek-, pronk- en
    snijbonen, van post 20.02 ex G van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
