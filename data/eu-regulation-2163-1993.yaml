    Mindestpreises sowie der Produktionsbeihilfe für getrocknete Korinthen im Wirtschaftsjahr
    1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2163/93 af 28. juli 1993 om fastsættelse
    for produktionsåret 1993/94 af den minimumspris, der skal betales producenten
    af uforarbejdede sultanas, korender og muskateller, samt af producentstøtten
    for disse tørrede druer
  type: main
- language: el
  script: Grek
