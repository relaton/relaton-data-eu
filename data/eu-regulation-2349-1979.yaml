title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2349/79 of 24 October 1979 amending Regulation
    (EEC) No 1726/79 as regards in particular skimmed-milk powder denatured or processed
    into compound feedingstuffs pursuant to Regulation (EEC) No 1624/76 on the territory
    of another Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2349/79 de la Commission, du 24 octobre 1979, modifiant
    le règlement (CEE) n° 1726/79 en ce qui concerne notamment le lait écrémé
    en poudre dénaturé ou transformé en aliments composés conformément au règlement
    (CEE) n° 1624/76 sur le territoire d'un autre État membre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2349/79 der Kommission vom 24. Oktober 1979 zur Änderung
    der Verordnung (EWG) Nr. 1726/79 insbesondere hinsichtlich des Magermilchpulvers,
    das gemäß der Verordnung (EWG) Nr. 1624/76 im Hoheitsgebiet eines anderen Mitgliedstaats
    denaturiert oder zu Mischfutter verarbeitet wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2349/79 af 24. oktober 1979 om ændring
    af forordning (EØF) nr. 1726/79 især for så vidt angår skummetmælkspulver,
    der denatureres eller forarbejdes til foderblandinger på en anden medlemsstats
    område i henhold til forordning (EØF) nr. 1624/76
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2349/79 της Επιτροπής
    της 24ης Οκτωβρίου 1979 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 1726/79 όσον αφορά ιδίως
    το αποκορυφωμένο γάλα εις κόνιν μετουσιωμένο
    ή μεταποιημένο σε σύνθετες τροφές, σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1624/76, στο έδαφος
    άλλου κράτους μέλους
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 2349/79, annettu 24 päivänä lokakuuta 1979,
    asetuksen (ETY) N:o 1726/79 muuttamisesta erityisesti asetuksen (ETY) N:o 1624/76
    mukaisesti toisen jäsenvaltion alueella denaturoidun tai rehuseoksiksi jalostetun
    rasvattoman maitojauheen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2349/79 della Commissione, del 24 ottobre 1979, recante
    modifica del regolamento (CEE) n. 1726/79 per quanto riguarda, segnatamente, il
    latte scremato in polvere denaturato o trasformato in alimenti composti, conformemente
    al regolamento (CEE) n. 1624/76, in un altro Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2349/79 van de Commissie van 24 oktober 1979 tot
    wijziging van Verordening (EEG) nr. 1726/79, met name ten aanzien van magere-melkpoeder
    dat overeenkomstig Verordening (EEG) nr. 1624/76 op het grondgebied van een andere
    Lid-Staat gedenatureerd of tot mengvoeder verwerkt wordt
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 2349/79 av den 24 oktober 1979 om ändring
    av förordning (EEG) nr 1726/79 särskilt avseende skummjölkspulver som denatureras
    eller bearbetas till foderblandningar inom en annan medlemsstats territorium i
    enlighet med förordning (EEG) nr 1624/76
  type: main
