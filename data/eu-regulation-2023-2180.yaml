  content: Commission Implementing Regulation (EU) 2023/2180 of 16 October 2023 amending
    Implementing Regulation (EU) 2021/607 imposing a definitive anti-dumping duty
    on imports of citric acid originating in the People’s Republic of China as extended
    to imports of citric acid consigned from Malaysia, whether declared as originating
    in Malaysia or not, following a new exporter review pursuant to Article 11(4)
    of Regulation (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/2180 de la Commission du 16 octobre
    2023 modifiant le règlement d’exécution (UE) 2021/607 de la Commission instituant
    un droit antidumping définitif sur les importations d’acide citrique originaire
    de la République populaire de Chine, tel qu’étendu aux importations d’acide
    citrique expédié de Malaisie, qu’il ait ou non été déclaré originaire
    de ce pays, à l’issue d’un réexamen au titre de nouvel exportateur effectué
    conformément à l’article 11, paragraphe 4, du règlement (UE) 2016/1036 du
    Parlement européen et du Conseil
  type: main
