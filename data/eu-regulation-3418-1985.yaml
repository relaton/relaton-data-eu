title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3418/85 of 4 December 1985 re-establishing
    the levying of customs duties applicable to television image and sound recorders
    or reproducers falling within subheading 92.11 B, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3418/85 de la Commission du 4 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables aux appareils
    d' enregistrement ou de reproduction des images et du son en télévision, de
    la sous-position 92.11 B du tarif douanier commun, originaires de Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3418/85 der Kommission vom 4. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für Bild- und Tonaufzeichnungsgeräte oder Bild- und
    Tonwiedergabegeräte, für das Fernsehen, der Tarifstelle 92.11 B des Gemeinsamen
    Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3418/85 af 4. december 1985 om genindførelse
    af opkrævning af told for billed- og lydoptagere eller billed- og lydgengivere
    til fjernsyn, henhørende under pos. 92.11 B og med oprindelse i Sydkorea, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3418/85 της Επιτροπής
    της 4ης Δεκεμβρίου 1985 περί αποκαταστάσεως της
    εφαρμογής των δασμών για συσκευές εγγραφής
    ή αναπαραγωγής των εικόνων και του ήχου στην
    τηλεόραση της διακρίσεως 92.11 Β του κοινού δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3418/85 della Commissione del 4 dicembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi di registrazione
    o di riproduzione delle immagini e del suono in televisione, della sottovoce 92.11
    B della tariffa doganale comune, originari della Corea del Sud, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3418/85 van de Commissie van 4 december 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op toestellen
    voor het opnemen of het weergeven van geluid en beelden voor televisie van postonderverdeling
    92.11 B van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea,
    waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
