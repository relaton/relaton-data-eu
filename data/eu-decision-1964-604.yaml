title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 octobre 1964, portant augmentation du
    volume du contingent tarifaire au bénéfice du Royaume de Belgique et du Grand-Duché
    de Luxembourg pour les cubes, plaques, feuilles et bandes en liège naturel y
    compris les cubes ou carrés pour la fabrication de bouchons
  type: main
- language: de
  script: Latn
  content: '64/604/EWG: Entscheidung der Kommission vom 12. Oktober 1964 zur Erhöhung
    des dem Königreich Belgien und dem Großherzogtum Luxemburg gewährten Zollkontingents
    für Würfel, Platten, Blätter und Streifen aus Naturkork, einschließlich Würfel
    oder Quader zur Herstellung von Stopfen'
  type: main
- language: it
  script: Latn
  content: '64/604/CEE: Decisione della Commissione, del 12 ottobre 1964, relativa
    all''aumento del volume del contingente tariffario in favore del Regno del Belgio
    e del Granducato del Lussemburgo per i cubi, le lastre, i fogli e le strisce di
    sughero naturale compresi i cosiddetti cubi o quadretti per la fabbricazione dei
    turaccioli'
  type: main
- language: nl
  script: Latn
  content: '64/604/EEG: Beschikking van de Commissie van 12 oktober 1964 tot vergroting
    van het aan het Koninkrijk België en het Groothertogdom Luxemburg toegekende
    tariefcontingent voor blokken, platen, bladen, vellen en strippen, van natuurkurk,
    blokjes voor het vervaardigen van kurken (stoppen) daaronder begrepen'
  type: main
