    asetuksen (ETY) N:o 2282/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 516/93 della Commissione, del 5 marzo 1993, recante
    modificazione del regolamento (CEE) n. 2282/90 recante modalità di applicazione
    delle misure destinate ad aumentare il consumo e l'uso delle mele, nonché il
    consumo degli agrumi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 516/93 van de Commissie van 5 maart 1993 tot wijziging
