    utilization of apples and the consumption of citrus fruit
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 516/93 de la Commission, du 5 mars 1993, modifiant
    le règlement (CEE) n° 2282/90 portant modalités d'application des mesures destinées
    à accroître la consommation et l'utilisation de pommes ainsi que la consommation
    d'agrumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 516/93 der Kommission vom 5. März 1993 zur Änderung
