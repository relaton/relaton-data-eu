    zur Steigerung des Verbrauchs und der Verwendung von Äpfeln sowie des Verbrauchs
    von Zitrusfrüchten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 516/93 af 5. marts 1993 om ændring
    af forordning (EØF) nr. 2282/90 om gennemførelsesbestemmelser for forantaltninger
    med henblik på at øge forbruget og anvendelsen af æbler samt forbruget af citrusfrugter
  type: main
- language: el
  script: Grek
