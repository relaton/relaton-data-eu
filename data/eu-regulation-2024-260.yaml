  content: Commission Implementing Regulation (EU) 2024/260 of 12 January 2024 concerning
    the authorisation of cumin essential oil from Cuminum cyminum L., sweet fennel
    tincture from Foeniculum vulgare Mill. ssp. vulgare var. dulce, dong quai tincture
    from Angelica sinensis (Oliv.) Diels, parsley tincture from Petroselinum crispum
