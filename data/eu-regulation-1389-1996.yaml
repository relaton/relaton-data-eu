    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen und der Republik Ungarn geschlossenen Europa-Abkommen sowie
    dem mit der Tschechischen Republik und der Slowakischen Republik beantragt wurden
  type: main
- language: da
  script: Latn
