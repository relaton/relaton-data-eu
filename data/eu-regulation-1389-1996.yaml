  content: COMMISSION REGULATION (EC) No 1389/96 of 17 July 1996 determining the extent
    to which applications lodged in July 1996 for import licences for certain milk
    products and products covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1389/96 DE LA COMMISSION du 17 juillet 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1996 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords européens conclus par la Communauté
    avec la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
