title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 395/2004 of 2 March 2004 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Regulation (EC) No 964/2003 on imports of certain tube or pipe fittings, of iron
    or steel, originating, inter alia, in the People's Republic of China by imports
    of certain tube or pipe fittings, of iron or steel, consigned from Sri Lanka,
    whether declared as originating in Sri Lanka or not and making such imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 395/2004 de la Commission du 2 mars 2004 ouvrant une
    enquête sur le contournement éventuel des mesures antidumping instituées par
    le règlement (CE) n° 964/2003 du Conseil sur les importations de certains accessoires
    de tuyauterie, en fer ou en acier, originaires, entre autres, de la République
    populaire de Chine par des importations de certains accessoires de tuyauterie,
    en fer ou en acier, expédiés du Sri Lanka, qu'ils aient ou non été déclarés
    originaires de ce pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 395/2004 der Kommission vom 2. März 2004 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Verordnung
    (EG) Nr. 964/2003 des Rates gegenüber den Einfuhren bestimmter Rohrformstücke,
    Rohrverschlussstücke und Rohrverbindungsstücke aus Eisen oder Stahl, mit Ursprung
    in unter anderem der Volksrepublik China eingeführten Antidumpingmaßnahmen durch
    aus Sri Lanka versandte Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke
    und Rohrverbindungsstücke aus Eisen oder Stahl, ob als Ursprungserzeugnisse Sri
    Lankas angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
