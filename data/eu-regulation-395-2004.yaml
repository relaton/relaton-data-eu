  type: main
- language: hu
  script: Latn
  content: A Bizottság 395/2004/EK rendelete (2004. március 2.) a 964/2003/EK tanácsi
    rendelettel a többek között a Kínai Népköztársaságból származó vasból
    vagy acélból készült csőszerelvények és -illesztések behozatalára vonatkozóan
    bevezetett dömpingellenes intézkedéseknek a Srí Lankában feladott vasból
    vagy acélból készült csőszerelvények és -illesztések – függetlenül
    attól, hogy azokat Srí Lankáról származóknak jelentik-e be vagy sem –
    behozatala általi lehetséges megkerülésével kapcsolatos vizsgálat kezdeményezéséről,
    valamint e behozatalok nyilvántartásba vételi kötelezettségének előírásáról
  type: main
