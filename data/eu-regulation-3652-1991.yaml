title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3652/91 of 13 December 1991 re-establishing
    the levying of customs duties on products falling within CN codes 4011 and 4013,
    originating in Brazil, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3652/91 DE LA COMMISSION du 13 décembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 4011 et 4013, originaires du Brésil, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3652/91 DER KOMMISSION vom 13. Dezember 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren der KN-Codes 4011 und
    4013 mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3831/90 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3652/91 af 13. december 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4011 og 4013 og med
    oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3652/91 της Επιτροπής
    της 13ης Δεκεμβρίου 1991 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για προϊόντα
    των κωδικών ΣΟ 4011 και 4013, καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    ( ΕΟΚ ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3652/91 DELLA COMMISSIONE del 13 dicembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 4011 e 4013 originari del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3652/91 VAN DE COMMISSIE van 13 december 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 4011 en 4013, van oorsprong uit Brazilië, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3652/91 DA COMISSÃO de 13 de Dezembro de 1991 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos
    NC 4011 e 4013, originários do Brasil, beneficiários das preferências pautais
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3652/91 DE LA COMISIÓN de 13 de diciembre de 1991
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a los productos de los códigos de la nomenclatura combinada 4011 y 4013 originarios
    del Brasil beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3831/90 del Consejo #'
