id: EUDecision1978381
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 March 1978 authorizing the French Republic not
    to apply Community treatment to women's, girls' and infants' (other than babies')
    woven and knitted or crocheted dresses, of wool, of cotton or of man-made textile
    fibres, falling within subheading ex 60.05 A II or ex 61.02 B of the Common Customs
    Tariff, originating in Romania and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/381/CEE: Décision de la Commission, du 13 mars 1978, autorisant la
    République française à exclure du traitement communautaire les robes tissées
    et robes de bonneterie pour femmes, fillettes et jeunes enfants autres que bébés,
    de laine, de coton ou de fibres textiles synthétiques ou artificielles, des sous-
    positions Ex 60.05 A II et Ex 61.02 B du Tarif douanier commun, originaires de
    Roumanie et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. März 1978, mit der die Französische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Kleider aus Geweben und aus Gewirken für Frauen,
    Mädchen und Kleinkinder (ausgenommen Säuglinge), aus Wolle, Baumwolle oder aus
    synthetischen oder künstlichen Spinnstoffen der Tarifnummern ex 60.05 A II und
    ex 61.02 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 13. marts 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af
    trikotage til kvinder, piger og småbørn (undtagen babyer) af uld, bomuld eller
    kemofibre, som henhører under pos. ex 60.05 A II og ex 61.02 B i den fælles
    toldtarif, har oprindelse i Rumænien, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 marzo 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario abiti interi tessuti ed a maglia,
    per donna, per ragazza e per bambini, diversi dai bambini piccoli (bébés) di
    lana, di cotone o di fibre tessili sintetiche o artificiali delle sottovoci ex
    60.05 A II e ex 61.02 B della tariffa doganale comune, originari della Romania
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 maart 1978 waarbij de Franse Republiek
    wordt gemachtigd japonnen voor dames, meisjes en kinderen (andere dan deze voor
    baby's) geweven en van brei- of haakwerk van wol, van katoen of van synthetische
    of van kunstmatige vezels, van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
