title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2216/97 of 3 November 1997 amending Regulation
    (EEC) No 2658/87 on the tariff and statistical nomenclature and on the Common
    Customs Tariff and autonomously suspending collection of Common Customs Tariff
    duties in respect of certain information technology products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2216/97 du Conseil du 3 novembre 1997 modifiant le
    règlement (CEE) nº 2658/87 relatif à la nomenclature tarifaire et statistique
    et au tarif douanier commun, et suspendant, à titre autonome, la perception des
    droits du tarif douanier commun pour certains produits relatifs aux technologies
    de l'information
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2216/97 des Rates vom 3. November 1997 zur Änderung
    der Verordnung (EWG) Nr. 2658/87 über die zolltarifliche und statistische Nomenklatur
    sowie den Gemeinsamen Zolltarif und zur autonomen Aussetzung der Erhebung der
    Zölle des Gemeinsamen Zolltarifs auf bestimmte Waren der Informationstechnologie
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2216/97 af 3. november 1997 om ændring af
    forordning (EØF) nr. 2658/87 om told- og statistiknomenklaturen og den fælles
    toldtarif med henblik på autonom suspension af den fælles toldtarifs toldsatser
    for visse informationsteknologiprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2216/97 του Συμβουλίου
    της 3ης Νοεμβρίου 1997 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2658/87 σχετικά με τη δασμολογική
    και στατιστική ονοματολογία και το κοινό δασμολόγιο
    και την αυτόνομη αναστολή της είσπραξης δασμών
    του κοινού δασμολογίου για ορισμένα προϊόντα
    της τεχνολογίας των πληροφοριών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2216/97, annettu 3 päivänä marraskuuta 1997,
    tariffi- ja tilastonimikkeistöstä ja yhteisestä tullitariffista annetun asetuksen
    (ETY) N:o 2658/87 muuttamisesta sekä tiettyihin tietotekniikkatuotteisiin sovellettavien
    yhteisen tullitariffin tullien yksipuolisesta suspendoimisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2216/97 del Consiglio del 3 novembre 1997 che modifica
    il regolamento (CEE) n. 2658/87 relativo alla nomenclatura tariffaria e statistica
    ed alla tariffa doganale comune, sospendendo, a titolo autonomo, la riscossione
    dei dazi della tariffa doganale comune per alcuni prodotti relativi alle tecnologie
    dell'informazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2216/97 van de Raad van 3 november 1997 tot wijziging
    van Verordening (EEG) nr. 2658/87 met betrekking tot de tarief- en statistieknomenclatuur
    en het gemeenschappelijk douanetarief, houdende autonome schorsing van de rechten
    van het gemeenschappelijk douanetarief voor bepaalde informatietechnologieproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2216/97 do Conselho de 3 de Novembro de 1997 que altera
    o Regulamento (CEE) nº 2658/87 relativo à nomenclatura pautal e estatística
    e à pauta aduaneira comum e que suspende, a título autónomo, a cobrança dos
    direitos da pauta aduaneira comum no que respeita a determinados produtos das
    tecnologias da informação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2216/97 del Consejo de 3 de noviembre de 1997 por el
    que se modifica el Reglamento (CEE) nº 2658/87 relativo a la nomenclatura arancelaria
    y estadística y al arancel aduanero común, y por el que se suspende, con carácter
    autónomo, la recaudación de los derechos del arancel aduanero común respecto
    de determinados productos relativos a las tecnologías de la información
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2216/97 av den 3 november 1997 om ändring
    av förordning (EEG) nr 2658/87 om tulltaxe- och statistiknomenklaturen och om
    Gemensamma tulltaxan, samt om autonom befrielse från uttag av Gemensamma tulltaxans
    tullar för vissa produkter som hänför sig till informationsteknik
  type: main
