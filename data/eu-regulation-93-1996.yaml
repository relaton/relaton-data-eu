title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 93/96 of 23 January 1996 deducting from the
    quantitative limits on imports of certain categories of textile products originating
    in the People's Republic of China amounts corresponding to those imported into
    the European Community in circumvention of the Agreement between the European
    Community and the People's Republic of China on trade in textile products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 93/96 de la Commission, du 23 janvier 1996, déduisant
    des limites quantitatives applicables aux importations de produits textiles de
    certaines catégories originaires de République populaire de Chine, les montants
    correspondant à ceux importés dans la Communauté en contournement de l'accord
    entre la Communauté européenne et la République populaire de Chine sur le commerce
    des produits textiles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 93/96 der Kommission vom 23. Januar 1996 zur Kürzung
    der Höchstmengen für die Einfuhr bestimmter Kategorien von Textilwaren mit Ursprung
    in der Volksrepublik China entsprechend den unter Umgehung des Abkommens zwischen
    der Europäischen Gemeinschaft und der Volksrepublik China über den Handel mit
    Textilwaren in die Gemeinschaft eingeführten Mengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 93/96 af 23. januar 1996 om afskrivning
    på de kvantitative importlofter for visse kategorier af tekstilvarer med oprindelse
    i Den Kinesiske Folkerepublik af mængder svarende til dem, der er indført i
    Fællesskabet ved omgåelse af aftalen mellem Det Europæiske Fællesskab og Den
    Kinesiske Folkerepublik om handel med tekstilvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 93/96 της Επιτροπής,
    της 23ης Ιανουαρίου 1996, για την αφαίρεση από
    τα ποσοτικά όρια στις εισαγωγές ορισμένων
    κατηγοριών κλωστοϋφαντουργικών προϊόντων
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, ποσοτήτων
    που αντιστοιχούν σε εκείνες που έχουν εισαχθεί
    στην Ευρωπαϊκή Κοινότητα, με καταστρατήγηση
    της συμφωνίας μεταξύ της Ευρωπαϊκής Κοινότητας
    και της Λαϊκής Δημοκρατίας της Κίνας για το
    εμπόριο κλωστοϋφαντουργικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 93/96, annettu 23 päivänä tammikuuta 1996,
    Euroopan yhteisön ja Kiinan kansantasavallan tekstiilituotteiden kauppaa koskevan
    sopimuksen määräyksiä kiertäen Euroopan yhteisöön tuotuja määriä vastaavien
    määrien vähentämisestä Kiinan kansantasavallasta peräisin olevien tiettyjen
    tekstiilituotteiden luokkien tuonnin määrällisistä rajoituksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 93/96 della Commissione, del 23 gennaio 1996, che detrae
    dai limiti quantitativi sulle importazioni di alcune categorie di prodotti tessili
    originari della Repubblica popolare cinese quantitativi corrispondenti a quelli
    importati nella Comunità europea eludendo l'accordo tra la Comunità europea
    e la Repubblica popolare cinese sul commercio dei prodotti tessili
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 93/96 van de Commissie van 23 januari 1996 waarbij
    de kwantitatieve maxima voor de invoer van bepaalde categorieën textielprodukten
    van oorsprong uit de Volksrepubliek China worden verminderd met de hoeveelheden
    die in strijd met de overeenkomst tussen de Europese Gemeenschap en de Volksrepubliek
    China betreffende de handel in textielprodukten in de Gemeenschap werden ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 93/96 da Comissão, de 23 de Janeiro de 1996, que
    deduz dos limites quantitativos aplicáveis à importação de certas categorias
    de produtos têxteis originários da República Popular da China as quantidades
    correspondentes às importadas na Comunidade Europeia através de uma evasão
    ao disposto no Acordo entre a Comunidade Europeia e a República Popular da China
    sobre o comércio de produtos têxteis
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 93/96 de la Comisión, de 23 de enero de 1996, por
    el que se deducen de los límites cuantitativos a la importación de determinadas
    categorías de productos textiles originarios de la República Popular de China
    las cantidades correspondientes a los productos importados en la Comunidad Europea
    eludiendo las disposiciones del Acuerdo entre la Comunidad Europea y la República
    Popular de China sobre comercio de productos textiles
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 93/96 av den 23 januari 1996 om avdrag
    på de kvantitativa begränsningar av import av vissa kategorier av textilprodukter
    med ursprung i Kina med samma kvantitet som motsvarar den import till gemenskapen
    där avtalet mellan Europeiska gemenskapen och Kina om handel med textilprodukter
    kringgåtts
  type: main
