title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2718/72 of the Council of 19 December 1972 amending
    Regulation (EEC) No 610/72 on the application of the provisions adopted within
    the framework of the Association between the European Economic Community and Greece
    in respect of the movements of goods in the manufacture of which use was made
    of products from a third country which are in free circulation neither in the
    Community nor in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2718/72 du Conseil, du 19 décembre 1972, modifiant
    le règlement (CEE) n° 610/72 relatif à l' application des dispositions adoptées
    dans le cadre de l' association entre la Communauté économique europénne et
    la Grèce, concernant la circulation des marchandises dans la fabrication desquelles
    sont entrés des produits en provenance de pays tiers ne se trouvant en libre
    pratique ni dans la Communauté ni en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2718/72 des Rates vom 19. Dezember 1972 zur Änderung
    der Verordnung (EWG) Nr. 610/72 über die Anwendung von im Rahmen der Assoziation
    zwischen der Europäischen Wirtschaftsgemeinschaft und Griechenland erlassenen
    Vorschriften betreffend den Verkehr von Waren, die unter Verwendung von Waren
    aus dritten Ländern hergestellt sind, welche sich weder in der Gemeinschaft noch
    in Griechenland im freien Verkehr befanden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2718/72 af 19. december 1972 om ændring
    af forordning (EØF) nr. 610/72 om anvendelse af de bestemmelser, der er fastsat
    inden for rammerne af associeringen mellem Det europæiske økonomiske Fællesskab
    og Grækenland, vedrørende bevægeligheden for varer, ved hvis fremstilling er
    medgået sådanne produkter fra tredjelande, som hverken er genstand for fri omsætning
    i Fællesskabet eller i Grækenland
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2718/72 del Consiglio, del 19 dicembre 1972, che modifica
    il regolamento (CEE) n. 610/72 relativo all' applicazione delle disposizioni adottate
    nel quadro dell' associazione fra la Comunità economica europea e la Grecia riguardo
    alla circolazione delle merci nella cui fabbricazione sono entrati prodotti provenienti
    da paesi terzi e non immessi in libera pratica né nella Comunità né in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2718/72 van de Raad van 19 december 1972 tot wijziging
    van Verordening (EEG) nr. 610/72 betreffende de toepassing van de in het kader
    van de Associatie tussen de Europese Economische Gemeenschap en Griekenland vastgestelde
    bepalingen betreffende het verkeer van goederen waarin produkten uit derde landen
    zijn verwerkt, die zich noch in de Gemeenschap noch in Griekenland in het vrije
    verkeer bevinden
  type: main
