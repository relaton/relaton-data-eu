    produsă de Komagataella phaffii DSM 26469 ca aditiv furajer pentru puii pentru
    îngrășare și puicuțele pentru ouat'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2025/2556 zo 17. decembra 2025 o
    povolení prípravku s obsahom endo-1,4-beta-xylanázy produkovanej mikroorganizmom
    Komagataella phaffii DSM 25376 a endo-1,3(4)-beta-glukanázy produkovanej mikroorganizmom
    Komagataella phaffii DSM 26469 ako kŕmnej doplnkovej látky pre kurčatá na
    znášku alebo na reprodukciu, morky na reprodukciu, menej významné druhy hydiny
    vo výkrme a menej významné druhy hydiny na znášku alebo na reprodukciu (držiteľ
    povolenia: Kaesler Nutrition GmbH) a o zmene vykonávacieho nariadenia (EÚ) 2018/1090,
    pokiaľ ide o podmienky povolenia prípravku s obsahom endo-1,4-beta-xylanázy
    produkovanej mikroorganizmom Komagataella phaffii DSM 25376 a endo-1,3(4)-beta-glukanázy
    produkovanej mikroorganizmom Komagataella phaffii DSM 26469 ako kŕmnej doplnkovej
    látky pre kurčatá vo výkrme a kurčatá chované na znášku'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2025/2556 z dne 17. decembra 2025 o dovoljenju
    za pripravek iz endo-1,4-beta-ksilanaze, proizvedene s Komagataella phaffii DSM
    25376, in endo-1,3(4)-beta-glukanaze, proizvedene s Komagataella phaffii DSM 26469,
    kot krmni dodatek za piščance za nesnice ali za razplod, purane za razplod,
    manj pomembne vrste perutnine za pitanje in manj pomembne vrste perutnine za nesnice
    ali za razplod (imetnik dovoljenja: Kaesler Nutrition GmbH) in o spremembi Izvedbene
    uredbe (EU) 2018/1090 glede pogojev dovoljenja za pripravek iz endo-1,4-beta-ksilanaze,
    proizvedene s Komagataella phaffii DSM 25376, in endo-1,3(4)-beta-glukanaze, proizvedene
    s Komagataella phaffii DSM 26469, kot krmni dodatek za pitovne piščance in piščance
    za nesnice'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2025/2556 de la Comisión, de 17 de diciembre
    de 2025, relativo a la autorización de un preparado de endo-1,4-beta-xilanasa
    producida con Komagataella phaffii DSM 25376 y endo-1,3(4)-beta-glucanasa producida
    con Komagataella phaffii DSM 26469 como aditivo en piensos para pollitas para
    puesta o reproducción, pavos de reproducción, especies menores de aves de corral
    de engorde y especies menores de aves de corral para puesta o reproducción (titular
    de la autorización: Kaesler Nutrition GmbH) y por el que se modifica el Reglamento
    de Ejecución (UE) 2018/1090 en lo que respecta a los términos de la autorización
    del preparado de endo-1,4-beta-xilanasa producida con Komagataella phaffii DSM
    25376 y endo-1,3(4)-beta-glucanasa producida con Komagataella phaffii DSM 26469
    como aditivo en piensos para pollos de engorde y pollitas criadas para puesta'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2025/2556 av den 17 december
    2025 om godkännande av ett preparat av endo-1,4-beta-xylanas framställt med
    Komagataella phaffii DSM 25376 och endo-1,3(4)-beta-glukanas framställt med Komagataella
    phaffii DSM 26469 som fodertillsats för kycklingar avsedda för värpning eller
    avel, kalkoner avsedda för avel, mindre vanligt förekommande fjäderfäarter
    avsedda för slakt och mindre vanligt förekommande fjäderfäarter avsedda för
    värpning eller avel (innehavare av godkännandet: Kaesler Nutrition GmbH), och
    om ändring av genomförandeförordning (EU) 2018/1090 vad gäller villkoren för
    godkännande av ett preparat av endo-1,4-beta-xylanas framställt med Komagataella
    phaffii DSM 25376 och endo-1,3(4)-beta-glukanas framställt med Komagataella phaffii
    DSM 26469 som fodertillsats för slaktkycklingar och kycklingar som föds upp
    till värphöns'
  type: main
