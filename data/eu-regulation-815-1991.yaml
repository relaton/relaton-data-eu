    alueilta peräisin oleviin maataloustuotteisiin ja niistä jalostettuihin tiettyihin
    tavaroihin sovellettavasta järjestelmästä annetun neuvoston asetuksen (ETY)
    N:o 715/90 soveltamista naudanliha-alalla koskevista yksityiskohtaisista säännöistä
    annetun asetuksen (ETY) N:o 970/90 muuttamisesta sekä asetuksen (ETY) N:o 2377/80
    muuttamisesta
  type: main
