title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 815/91 of 2 April 1991 amending Regulation
    (EEC) No 970/90 laying down detailed rules for the application in the beef and
    veal sector of Council Regulation (EEC) No 715/90 on the arrangements applicable
    to agricultural products and certain goods resulting from the processing of agricultural
    products originating in the African, Caribbean and Pacific States or in the overseas
    countries and territories and amending Regulation (EEC) No 2377/80
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 815/91 DE LA COMMISSION du 2 avril 1991 modifiant
    le règlement (CEE) no 970/90 fixant les modalités d'' application dans le secteur
    de la viande bovine du règlement (CEE) no 715/90 du Conseil relatif au régime
    applicable à des produits agricoles et à certaines marchandises résultant de
    la transformation de produits agricoles originaires des États d'' Afrique, des
    Caraïbes et du Pacifique ou des pays et territoires d'' outre-mer, et modifiant
    le règlement (CEE) no 2377/80 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 815/91 DER KOMMISSION vom 2. April 1991 zur Änderung
    der Verordnung (EWG) Nr. 970/90 zur Festlegung der Durchführungsbestimmungen
    im Sektor Rindfleisch zu der Verordnung (EWG) Nr. 715/90 des Rates über die Regelung
    für landwirtschaftliche Erzeugnisse und bestimmte aus landwirtschaftlichen Erzeugnissen
    hergestellte Waren mit Ursprung in den AKP-Staaten sowie in den überseeischen
    Ländern und Gebieten und zur Änderung der Verordnung (EWG) Nr. 2377/80 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 815/91 af 2. april 1991 om ændring
