    til Rådets forordning (EØF) nr. 715/90 om den ordning, der skal gælde for landbrugsprodukter
    og visse varer fremstillet af landbrugsprodukter med oprindelse i AVS-staterne
    eller i de oversøiske lande og territorier, og om ændring af forordning (EØF)
    nr. 2377/80
  type: main
- language: el
  script: Grek
