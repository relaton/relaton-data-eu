title:
- language: en
  script: Latn
  content: '79/191/EEC: Commission Decision of 31 January 1979 authorizing the French
    Republic not to apply Community treatment to receivers, whether or not incorporating
    sound recorders or reproducers, falling within subheading 85.15 A III of the Common
    Customs Tariff, originating in Japan and in free circulation in the other Member
    States'
  type: main
- language: fr
  script: Latn
  content: '79/191/CEE: Décision de la Commission, du 31 janvier 1979, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de radio, même combinés avec un appareil d'' enregistrement et de
    reproduction du son, de la sous-position 85.15 A III du tarif douanier commun,
    originaires du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/191/EWG: Entscheidung der Kommission vom 31. Januar 1979, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte, auch mit Tonaufnahme-
    oder Tonwiedergabegeräten kombiniert, der Tarifstelle 85.15 A III des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/191/EØF: Kommissionens beslutning af 31. januar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage modtagere, også
    kombineret med lydoptagere eller lydgengivere, som henhører under pos. 85.15
    A III i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i
    de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/191/CEE: Decisione della Commissione, del 31 gennaio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi anche combinati con un apparecchio di registrazione o di riproduzione
    del suono della sottovoce 85.15 A III della tariffa doganale comune originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/191/EEG: Beschikking van de Commissie van 31 januari 1979 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid van post 85.15 A III
    van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
