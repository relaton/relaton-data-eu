title:
- language: en
  script: Latn
  content: Council Directive 92/74/EEC of 22 September 1992 widening the scope of
    Directive 81/851/EEC on the approximation of provisions laid down by Law, Regulation
    or Administrative Action relating to veterinary medicinal products and laying
    down additional provisions on homeopathic veterinary medicinal products
  type: main
- language: fr
  script: Latn
  content: Directive 92/74/CEE du Conseil, du 22 septembre 1992, élargissant le champ
    d'application de la directive 81/851/CEE concernant le rapprochement des dispositions
    législatives, réglementaires et administratives relatives aux médicaments vétérinaires
    et fixant des dispositions complémentaires pour les médicaments homéopathiques
    vétérinaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/74/EWG des Rates vom 22. September 1992 zur Erweiterung des
    Anwendungsbereichs der Richtlinie 81/851/EWG zur Angleichung der Rechts- und Verwaltungsvorschriften
    über Tierarzneimittel und zur Festlegung zusätzlicher Vorschriften für homöopathische
    Tierarzneimittel
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/74/EØF af 22. september 1992 om udvidelse af anvendelsesområdet
    for direktiv 81/851/EØF om indbyrdes tilnærmelse af lovgivning om veterinærlægemidler,
    og om fastsættelse af supplerende bestemmelser for homøopatiske veterinærlægemidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/74/ΕΟΚ του Συμβουλίου της 22ας Σεπτεμβρίου
    1992 για τη διεύρυνση του πεδίου εφαρμογής της
    οδηγίας 81/851/ΕΟΚ για την προσέγγιση των νομοθεσιών
    των κρατών μελών σχετικά με τα κτηνιατρικά
    φαρμακευτικά προϊόντα και τη θέσπιση συμπληρωματικών
    διατάξεων για τα ομοιοπαθητικά κτηνιατρικά
    φάρμακα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/74/ETY, annettu 22 päivänä syyskuuta 1992, eläinlääkkeitä
    koskevien lakien, asetusten ja hallinnollisten määräysten lähentämisestä
    annetun direktiivin 81/851/ETY soveltamisalan laajentamisesta ja homeopaattisia
    eläinlääkkeitä koskevista lisäsäännöksistä
  type: main
- language: it
  script: Latn
  content: Direttiva 92/74/CEE del Consiglio, del 22 settembre 1992, che amplia il
    campo d'applicazione della direttiva 81/851/CEE concernente il ravvicinamento
    delle disposizioni legislative, regolamentari ed amministrative relative ai medicinali
    veterinari e che fissa disposizioni complementari per i medicinali omeopatici
    veterinari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/74/EEG van de Raad van 22 september 1992 tot uitbreiding van
    het toepassingsgebied van Richtlijn 81/851/EEG betreffende de aanpassing van de
    wettelijke en bestuursrechtelijke bepalingen inzake geneesmiddelen en tot vaststelling
    van aanvullende bepalingen voor homeopathische geneesmiddelen voor diergeneeskundig
    gebruik
  type: main
- language: pt
  script: Latn
  content: Directiva 92/74/CEE do Conselho, de 22 de Setembro de 1992, que alarga
    o âmbito de aplicação da Directiva 81/851/CEE, relativa à aproximação das
    disposições legislativas, regulamentares e administrativas respeitantes aos
    medicamentos e que estabelece disposições complementares para os medicamentos
    homeopáticos veterinários
  type: main
- language: es
  script: Latn
  content: Directiva 92/74/CEE del Consejo, de 22 de septiembre de 1992, por la que
    se amplía el ámbito de aplicación de la Directiva 81/851/CEE relativa a la
    aproximación de las disposiciones legales, reglamentarias y administrativas sobre
    medicamentos veterinarios y por la que se adoptan disposiciones complementarias
    para los medicamentos homeopáticos veterinarios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 92/74/EEG av den 22 september 1992 om utökad räckvidd
    för direktiv 81/851/EEG om tillnärmning av medlemsstaternas lagstiftning om
    veterinärmedicinska läkemedel och fastställande av ytterligare bestämmelser
    som rör homeopatika avsedda för djur
  type: main
