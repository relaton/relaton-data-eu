type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 984/97 of 30 May 1997 terminating the investigation
    concerning the circumvention of anti-dumping measures imposed by Council Regulations
    (EEC) No 993/93 and (EEC) No 2887/93 on imports of certain electronic weighing
    scales originating in Japan and Singapore, by imports of parts thereof assembled
    in the European Community and ceasing registration of these parts
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 984/97 de la Commission du 30 mai 1997 clôturant l'enquête
    sur le contournement des mesures antidumping instituées par le règlement (CE)
    nº 993/93 du Conseil et par le règlement (CEE) nº 2887/93 du Conseil sur les
    importations de certaines balances électroniques respectivement originaires du
    Japon et de Singapour, par des importations de pièces utilisées dans des opérations
    d'assemblage dans la Communauté européenne et levant l'enregistrement des pièces
    concernées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 984/97 der Kommission vom 30. Mai 1997 zur Einstellung
    der Untersuchung betreffend die Umgehung der mit der Verordnung (EWG) Nr. 993/93
    des Rates und der Verordnung (EWG) Nr. 2887/93 des Rates eingeführten Antidumpingzölle
    auf die Einfuhren bestimmter elektronischer Waagen mit Ursprung in Japan bzw.
    Singapur durch die Einfuhren von in der Europäischen Gemeinschaft montierten
    Teilen dieser Waagen und zur Beendigung der zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 984/97 af 30. maj 1997 om afslutning
    af undersøgelsen vedrørende omgåelse af de antidumpingforanstaltninger, der
    indførtes ved Rådets forordning (EØF) nr. 993/93 og (EØF) nr. 2887/93 på
    importen af visse elektroniske vægte med oprindelse i Japan og Singapore, ved
    import af dele deraf samlet i Det Europæiske Fællesskab og om ophævelse af
    registreringen af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 984/97 της Επιτροπής
    της 30ής Μαΐου 1997 για την περάτωση της έρευνας
    αναφορικά με την καταστρατήγηση μέτρων αντιντάμπινγκ
    που επιβλήθηκαν με τους κανονισμούς (ΕΟΚ) αριθ.
    993/93 και (ΕΟΚ) αριθ. 2887/93 επί των εισαγωγών ορισμένων
    ηλεκτρονικών ζυγών καταγωγής Ιαπωνίας και
    Σιγκαπούρης, αντίστοιχα, με εισαγωγές μερών
    των προϊόντων αυτών που συναρμολογούνται στην
    Ευρωπαϊκή Κοινότητα και για την αναστολή της
    υπαγωγής των εν λόγω μερών σε διαδικασία καταγραφής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 984/97, annettu 30 päivänä toukokuuta 1997,
    Japanista ja Singaporesta peräisin olevien tiettyjen elektronisten vaakojen tuonnissa
    neuvoston asetuksilla (ETY) N:o 993/93 ja (ETY) N:o 2887/93 käyttöön otettujen
    polkumyyntitoimenpiteiden kiertämistä tuomalla osat kyseisistä maista ja kokoonpanemalla
    ne Euroopan yhteisössä koskevan tutkimuksen ja kyseisten osien tuonnin kirjaamisen
    päättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 984/97 della Commissione del 30 maggio 1997 che chiude
    l'inchiesta relativa all'elusione delle misure antidumping istituite dai regolamenti
    (CEE) n. 993/93 e (CEE) n. 2887/93 del Consiglio sulle importazioni di alcuni
    tipi di bilance elettroniche originarie del Giappone e di Singapore per mezzo
    di importazioni di parti degli stessi prodotti assemblate nella Comunità europea
    e mette fine all'obbligo di registrazione per le parti in questione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 984/97 van de Commissie van 30 mei 1997 tot beëindiging
    van het onderzoek naar de ontwijking van de antidumpingmaatregelen die zijn ingesteld
    bij de Verordeningen (EEG) nr. 993/93 en (EEG) nr. 2887/93 van de Raad op de invoer
    van bepaalde elektronische weegschalen van oorsprong uit Japan en Singapore, door
    invoer van onderdelen die geassembleerd worden in de Europese Gemeenschap, en
    tot beëindiging van registratie van deze onderdelen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 984/97 da Comissão de 30 de Maio de 1997 que encerra
    o inquérito sobre a evasão das medidas anti-dumping instituídas pelo Regulamento
    (CEE) nº 993/93 do Conselho e pelo Regulamento (CEE) nº 2887/93 do Conselho
    sobre a importação de certas balanças electrónicas originárias, respectivamente,
    do Japão e de Singapura, através de importações de partes desses produtos
    destinadas a ser montadas na Comunidade Europeia e que põe termo ao registo destas
    últimas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 984/97 de la Comisión de 30 de mayo de 1997 por el
    que se da por concluida la investigación relativa a la elusión de las medidas
    antidumping establecidas por los Reglamentos (CEE) nº 993/93 y (CEE) nº 2887/93
    del Consejo sobre las importaciones de determinadas balanzas electrónicas originarias
    de Japón y de Singapur, mediante importaciones de partes de las mismas para su
    montaje en la Comunidad Europea y por el que se suprime el registro de estas partes
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 984/97 av den 30 maj 1997 om avslutande
    av undersökningen om kringgående av de antidumpningsåtgärder som införts
    genom rådets förordningar (EEG) nr 993/93 och (EEG) nr 2887/93 mot import av
    vissa elektroniska vågar med ursprung i Japan och Singapore genom import av delar
    till dessa vågar som satts samman i Europeiska gemenskapen, och om upphörande
    av registrering av dessa delar
  type: main
