title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3052/89 of 10 October 1989 amending Regulation
    (EEC) No 1780/89 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in Articles 35, 36 and 39 of Regulation
    (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3052/89 de la Commission du 10 octobre 1989 modifiant
    le règlement (CEE) n° 1780/89 établissant les modalités d'application relatives
    à l'écoulement des alcools obtenus au titre des distillations visées aux articles
    35, 36 et 39 du règlement (CEE) n° 822/87 et détenus par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3052/89 DER KOMMISSION vom 10. Oktober 1989 zur Änderung
    der Verordnung (EWG) Nr. 1780/89 mit Durchführungsbestimmungen für den Absatz
    von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der Verordnung
    (EWG) Nr. 822/87 aus Beständen der Interventionsstellen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3052/89 af 10. oktober 1989 om anden
    ændring af forordning (EØF) nr. 1780/89 om gennemførelsesbestemmelser for afsætning
    af alkohol, der er fremstillet i henhold til de i artikel 35, 36 og 39 i forordning
    (EØF) nr. 822/87 omhandlede destillationer, og som interventionsorganerne ligger
    inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3052/89 της Επιτροπής
    της 10ης Οκτωβρίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1780/89 για τη θέσπιση των
    λεπτομερειών εφαρμογής σχετικά με τη διάθεση
    των αλκοολών που λαμβάνονται από τις αποστάξεις
    που αναφέρονται στα άρθρα 35, 36 και 39 του κανονισμού
    (ΕΟΚ) αριθ. 822/87 του Συμβουλίου και ευρίσκονται
    στην κατοχή των οργανισμών παρέμβασης
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3052/89 DELLA COMMISSIONE del 10 ottobre 1989 recante
    modifica del regolamento (CEE) n. 1780/89 che stabilisce le modalità d'' applicazione
    relative allo smercio degli alcoli ottenuti dalle distillazioni di cui agli articoli
    35, 36 e 39 del regolamento (CEE) n. 822/87 e detenuti dagli organismi d'' intervento
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3052/89 VAN DE COMMISSIE van 10 oktober 1989 tot
    wijziging van Verordening (EEG) nr. 1780/89 tot vaststelling van de uitvoeringsbepalingen
    voor de afzet van alcohol die is verkregen bij distillatie als bedoeld in de artikelen
    35, 36 en 39 van Verordening (EEG) nr. 822/87 en die in het bezit is van de interventiebureaus
    #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3052/89 DA COMISSAO de 10 de Outubro de 1989 que altera,
    pela segunda vez, o Regulamento (CEE) n* 1780/89, que estabelece as regras de
    execuçao relativas ao escoamento dos alcoois provenientes das destilaçoes referidas
    nos artigos 35*, 36* e 39* do Regulamento (CEE) n* 822/87 e detidos pelos organismos
    de intervençao
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3052/89 DE LA COMISIÓN de 10 de octubre de 1989 por
    el que se modifica por segunda vez el Reglamento (CEE) no 1780/89 por el que se
    establecen las disposiciones de aplicación relativas a la salida al mercado de
    los alcoholes obtenidos con arreglo a las destilaciones contempladas en los artículos
    35, 36 y 39 del Reglamento (CEE) no 822/87, en posesión de los organismos de
    intervención #'
