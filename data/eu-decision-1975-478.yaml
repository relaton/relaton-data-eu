id: EUDecision1975478
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 July 1975 authorizing Ireland to take protective
    measures under Article 135 of the Act concerning the conditions of accession and
    the adjustments to the Treaties, in respect of footwear with uppers of leather
    falling within subheading 64.02 A of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: '75/478/CEE: Décision de la Commission, du 10 juillet 1975, autorisant
    l''Irlande à adopter des mesures de sauvegarde pour les chaussures à dessus
    en cuir naturel, de la position 64.02 A du Tarif douanier commun, au titre de
    l''article 135 de l''Acte relatif aux conditions d''adhésion et d''adaptation
    des Traités'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Juli 1975, die Irland ermächtigt,
    Schutzmaßnahmen für Schuhzeug aus Naturleder (Tarifnummer 64.02 A des Gemeinsamen
    Zolltarifs) nach Artikel 135 der Akte über die Beitrittsbedingungen und die Anpassungen
    der Verträge zu ergreifen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. juli 1975 om bemyndigelse af Irland til
    at anvende beskyttelsesforanstaltninger for fodtøj med overdel af læder (position
    64.02 A i den fælles toldtarif) i henhold til artikel 135 i akt vedrørende tiltrædelsesvilkårene
    og tilpasningerne af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 luglio 1975, che autorizza l'Irlanda
    ad adottare misure di salvaguardia per le calzature con tomaia di cuoio naturale
    (voce 64.02 A della tariffa doganale comune), ai sensi dell'articolo 135 dell'atto
    relativo alle condizioni di adesione e agli adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 juli 1975 waarbij Ierland gemachtigd
    wordt vrijwaringsmaatregelen te nemen voor schoeisel met bovenstuk van leder (post
    64.02 A van het gemeenschappelijk douanetarief), uit hoofde van artikel 135 van
    de Akte betreffende de toetredingsvoorwaarden en de aanpassing der Verdragen
  type: main
