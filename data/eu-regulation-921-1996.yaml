title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 921/96 of 13 May 1996 amending Regulation (EC)
    No 2178/95 opening and providing for the administration of Community tariff quotas
    and ceilings for certain industrial and fishery products originating in Estonia,
    Latvia and Lithuania, and establishing the detailed provisions for adapting these
    quotas and ceilings, and Regulation (EC) No 1798/94 opening and providing for
    the administration of Community tariff quotas for certain agricultural products
    originating in Bulgaria, the Czech Republic, Hungary, Poland, Romania and Slovakia,
    and establishing the detailed provisions for adapting these quotas (1994 to 1997)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 921/96 du Conseil, du 13 mai 1996, modifiant le règlement
    (CE) n° 2178/95 portant ouverture et mode de gestion de contingents et de plafonds
    tarifaires communautaires pour certains produits industriels et de la pêche originaires
    d'Estonie, de Lettonie et de Lituanie, ainsi que les modalités d'adaptation desdits
    contingents et plafonds, et le règlement (CE) n° 1798/94 portant ouverture et
    mode de gestion de contingents tarifaires communautaires pour certains produits
    agricoles originaires de Bulgarie, de Hongrie, de Pologne, de Roumanie, de Slovaquie
    et de la République tchèque, ainsi que les modalités d'adaptation desdits contingents
    (1994-1997)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 921/96 des Rates vom 13. Mai 1996 zur Änderung der
    Verordnung (EG) Nr. 2178/95 zur Eröffnung und Verwaltung von Gemeinschaftszollkontingenten
    und -plafonds für bestimmte gewerbliche Waren und Fischereierzeugnisse mit Ursprung
    in Estland, Lettland und Litauen sowie zur Einführung eines Verfahrens für die
    Anpassung dieser Zollkontingente und Zollplafonds und der Verordnung (EG) Nr.
    1798/94 zur Eröffnung und Verwaltung von Gemeinschaftszollkontingenten für bestimmte
    landwirtschaftliche Erzeugnisse mit Ursprung in Bulgarien, Ungarn, Polen, Rumänien,
    Slowakien und der Tschechischen Republik sowie zur Einführung eines Verfahrens
    für die Anpassung dieser Zollkontingente (1994-1997)
  type: main
- language: da
  script: Latn
