title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2389/91 of 5 August 1991 re-establishing
    the levying of customs duties on products of category 75 (order No 40 0750), originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2389/91 DE LA COMMISSION du 5 août 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    75 (numéro d'' ordre 40.0750) originaires de la Thaïlande, bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2389/91 DER KOMMISSION vom 5. August 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie 75 (laufende Nummer
    40.0750) mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2389/91 af 5. august 1991 om genindførelse
    af opkrævning af told for varer under kategori 75 (løbenummer 40.0750), som
    har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2389/91 της Επιτροπής
    της 5ης Αυγούστου 1991 περί αποκαταστάσεως της
