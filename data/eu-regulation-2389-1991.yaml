    (numero d'' ordine 40.0750) originari della Tailandia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2389/91 VAN DE COMMISSIE van 5 augustus 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
