  script: Latn
  content: '81/753/EEC: Commission Decision of 4 August 1981 authorizing the French
    Republic not to apply Community treatment to blouses and shirt-blouses, knitted,
    crocheted or woven, originating in India (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/753/CEE: Décision de la Commission, du 4 août 1981, autorisant la
    République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie, tissés, originaires de l''Inde
    (Le texte en langue française est le seul faisant foi)'
  type: main
