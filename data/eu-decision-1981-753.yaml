    oder Geweben von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/753/EØF: Kommissionens beslutning af 4. august 1981 om bemyndigelse
