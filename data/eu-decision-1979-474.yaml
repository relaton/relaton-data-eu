title:
- language: en
  script: Latn
  content: '79/474/EEC: Commission Decision of 27 April 1979 authorizing the French
    Republic not to apply Community treatment to woven table linen, toilet and kitchen
    linen other than of cotton terry fabric, falling within subheading ex 62.02 B
    of the Common Customs Tariff (NIMEXE codes 62.02-41, 43, 47, 65, 73, 77) (category
    39), originating in the People'' s Republic of China and in free circulation in
    the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/474/CEE: Décision de la Commission, du 27 avril 1979, autorisant la
    République française à exclure du traitement communautaire le linge de table,
    linge de toilette, d''office et de cuisine, tissé, autre que de coton bouclé
    du genre éponge, de la sous-position ex 62.02 B du tarif douanier commun (codes
    Nimexe: 62.02- 41, 43, 47, 65, 73, 77) (catégorie 39), originaire de la République
    populaire de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/474/EWG: Entscheidung der Kommission vom 27. April 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Tischwäsche,
    Wäsche zur Körperpflege und andere Haushaltswäsche, aus Geweben, andere als
    Wäsche aus Frottiergeweben, der Tarifstelle ex 62.02 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 62.02-41, 43, 47, 65, 73, 77) (Kategorie 39) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/474/EØF: Kommissionens beslutning af 27. april 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage dækketøj,
    håndklæder, vaskeklude og viskestykker og lignende køkkentekstiler, vævede,
    ikke af frotterstof, som henhører under pos. ex 62.02 B i den fælles toldtarif
    (NIMEXE-nummer 62.02-41, 43, 47, 65, 73, 77 ; kategori 39), har oprindelse i Den
    kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/474/CEE: Decisione della Commissione, del 27 aprile 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario biancheria da
    tavola, biancheria da toletta, da servizio o da cucina, tessuta, diversa da quella
    di cotone riccio del tipo spugna, della sottovoce ex 62.02 B della tariffa doganale
    comune (codici Nimexe: 62.02-41, 43, 47, 65, 73, 77) (categoria 39), originaria
    della Repubblica popolare cinese e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/474/EEG: Beschikking van de Commissie van 27 april 1979 waarbij de
    Franse Republiek wordt gemachtigd tafellinnen, huishoudlinnen, ander dan van katoenen
    bad- of frotteerstof, van post ex 62.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 62.02-41, 43, 47, 65, 73, 77) (categorie 39), van oorsprong uit de
    Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
