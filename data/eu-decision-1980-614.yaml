id: EUDecision1980614
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/614/EEC: Commission Decision of 9 June 1980 authorizing Ireland not
    to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtle necked jumpers and pullovers, undervests and the like, falling
    within heading No ex 60.04 of the Common Customs Tariff (category 4), originating
    in India and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/614/CEE: Décision de la Commission, du 9 juin 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chemises, chemisettes, "T-shirts",
    sous-"pulls", maillots de corps et articles similaires, de la position ex 60.04
    du tarif douanier commun (catégorie 4), originaires de l''Inde et mis en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/614/EWG: Entscheidung der Kommission vom 9. Juni 1980, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs (Kategorie
    4) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/614/EØF: Kommissionens beslutning af 9. juni 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undta1657ge skjorter, herunder sports-
    og arbejdsskjorter, T-shirts, T-shirts med rulle1666krave, undertrøjer og lignende,
    som henhører under pos. ex 60.04, i den fælles toldtarif (kategori 4), har oprindelse
    i Indien og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/614/CEE: Decisione della Commissione, del 9 giugno 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette, T-shirts,
    magliette a collo alto, camiciole e articoli affini della voce ex 60.04 della
    tariffa doganale comune, categoria 4, originari dell''India e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/614/EEG: Beschikking van de Commissie van 9 juni 1980 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, T-shirts, hemdtruien (sous-pulls),
    tricotpakken, maillots de corps en dergelijke artikelen van post ex 60.04 van
    het gemeenschappelijk douanetarief, categorie 4, van oorsprong uit India en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
