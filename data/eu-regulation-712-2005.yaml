title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 712/2005 of 11 May 2005 amending Annexes
    I and II to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin as regards lasalocid and ammonium and sodium salts
    of bituminosulfonates
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CE) n° 712/2005 de la Commission du 11 mai 2005 modifiant
    les annexes I et II du règlement (CEE) n° 2377/90 du Conseil établissant une
    procédure communautaire pour la fixation des limites maximales de résidus de
    médicaments vétérinaires dans les aliments d''origine animale en ce qui concerne
    les substances suivantes: lasalocide et sels d''ammonium et de sodium de bituminosulfonates'
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 712/2005 der Kommission vom 11. Mai 2005 zur Änderung
    der Anhänge I und II der Verordnung (EWG) Nr. 2377/90 des Rates zur Schaffung
    eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen für Tierarzneimittelrückstände
    in Nahrungsmitteln tierischen Ursprungs in Bezug auf Lasalocid sowie Ammonium-
    und Natriumsalze von Bituminosulfonaten
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 712/2005 на Комисията от 11
    май 2005 година за изменение на приложения I и
    II към Регламент (ЕИО) № 2377/90 на Съвета за определяне
    на максимално допустими граници на остатъчни
    вещества от ветеринарномедицински препарати
    в храните от животински произход по отношение
    на лазалоцид и амониеви и натриеви соли на
    битуминосулфонати
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 712/2005 ze dne 11. května 2005, kterým se
    mění přílohy I a II nařízení Rady (EHS) č. 2377/90, kterým se stanoví
    postup Společenství pro stanovení maximálních limitů reziduí veterinárních
    léčivých přípravků v potravinách živočišného původu, pokud jde o lasalocid
    a amonné a sodné soli bituminosulfonátu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 712/2005 af 11. maj 2005 om ændring
    af bilag I og II til Rådets forordning (EØF) nr. 2377/90 om en fælles fremgangsmåde
    for fastsættelse af maskimalgrænseværdier for restkoncentrationer af veterinærlægemidler
    i animalske levnedsmidler for så vidt angår lasalocid samt ammonium- og natriumsalte
    af bituminsulfonater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 712/2005 της Επιτροπής,
    της 11ης Μαΐου 2005, για την τροποποίηση των παραρτημάτων
    I και II του κανονισμού (ΕΟΚ) αριθ. 2377/90 του Συμβουλίου
    για τη θέσπιση κοινοτικής διαδικασίας για
    τον καθορισμό ανώτατων ορίων καταλοίπων κτηνιατρικών
    φαρμάκων στα τρόφιμα ζωικής προέλευσης, όσον
    αφορά τη λασαλοσίδη και τα άλατα αμμωνίου και
    νατρίου βιτουμινοθειικών αλάτων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 712/2005, 11. mai 2005, millega muudetakse
    nõukogu määruse (EMÜ) nr 2377/90 (milles sätestatakse ühenduse menetlus
    veterinaarravimijääkide piirnormide kehtestamiseks loomsetes toiduainetes) I
    ja II lisa seoses lasalotsiidi ning bituumensulfonaatide ammoonium- ja naatriumsooladega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 712/2005, annettu 11 päivänä toukokuuta 2005,
    yhteisön menettelystä eläinlääkejäämien enimmäismäärien vahvistamiseksi
    eläinperäisissä elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o 2377/90
    liitteiden I ja II muuttamisesta lasalosidin sekä bituminosulfonaattien ammonium-
    ja natriumsuolojen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 712/2005/EK rendelete (2005. május 11.) az állati eredetű
    élelmiszerekben található állatgyógyászati készítmények maximális maradékanyag-határértékeinek
    megállapítására szolgáló közösségi eljárás kialakításáról szóló
    2377/90/EGK tanácsi rendelet I. és II. mellékletének a lazalocidra, valamint
    a bituminoszulfonátok ammónium- és nátriumsóira vonatkozó módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 712/2005 della Commissione, dell’11 maggio 2005,
    che modifica gli allegati I e II del regolamento (CEE) n. 2377/90 del Consiglio
    che definisce una procedura comunitaria per la determinazione dei limiti massimi
    di residui di medicinali veterinari negli alimenti di origine animale per quanto
    riguarda il lasalocid e i sali di ammonio e di sodio di bituminosulfonati
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 712/2005 (2005. gada 11. maijs), ar kuru groza
    I un II pielikumu Padomes Regulā (EEK) Nr. 2377/90, ar ko paredz Kopienas procedūru
    veterināro zāļu maksimāli pieļaujamo atlieku daudzumu noteikšanai dzīvnieku
    izcelsmes produktos attiecībā uz lasalocīdu un bituminosulfonāta amonija un
    nātrija sāļiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. kovo 11 d. Komisijos reglamentas (EB) Nr. 712/2005, iš dalies
    keičiantis Tarybos reglamento (EEB) Nr. 2377/90, nustatančio veterinarinių
    vaistų likučių gyvūninės kilmės maisto produktuose didžiausių kiekių
    nustatymo tvarką Bendrijoje, I ir II priedų nuostatas dėl lazalocido bei amonio
    ir natrio druskų bituminosulfonatų
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 712/2005 van de Commissie van 11 mei 2005 tot wijziging
    van de bijlagen I en II bij Verordening (EEG) nr. 2377/90 van de Raad houdende
    een communautaire procedure tot vaststelling van maximumwaarden voor residuen
    van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen van dierlijke
    oorsprong ten aanzien van lasalocide en ammonium- en natriumzouten van bituminosulfonaten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 712/2005 z dnia 11 maja 2005 r. zmieniające
    załączniki I i II do rozporządzenia Rady (EWG) nr 2377/90 ustanawiającego
    wspólnotową procedurę określania maksymalnego limitu pozostałości weterynaryjnych
    produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego w odniesieniu
    do lasalocidu i amonu oraz soli sodowych bituminosulfonianów
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 712/2005 da Comissão, de 11 de Maio de 2005, que
    altera os anexos I e II do Regulamento (CEE) n.° 2377/90 do Conselho que prevê
    um processo comunitário para o estabelecimento de limites máximos de resíduos
    de medicamentos veterinários nos alimentos de origem animal, no que diz respeito
    à lasalocida e aos sais de amónio e de sódio de bituminosulfonatos
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul (CE) nr. 712/2005 al Comisiei din 11 mai 2005 de modificare
    a anexelor I și II la Regulamentul (CEE) nr. 2377/90 al Consiliului de stabilire
    a unei proceduri comunitare pentru stabilirea limitelor maxime de reziduuri de
    produse medicinale veterinare în alimentele de origine animală în ceea ce privește
    următoarele substanțe: lasalocid și săruri de amoniu și de sodiu de bituminosulfonați'
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 712/2005 z 11. mája 2005, ktorým sa menia
    a dopĺňajú prílohy I a II k nariadeniu Rady (EHS) č. 2377/90, ktorým sa
    stanovuje postup Spoločenstva pri určovaní maximálnych limitov rezíduí veterinárnych
    liečiv v potravinách živočíšneho pôvodu, pokiaľ ide o lasalocid a amónne
    a sodné soli bituminosulfonátov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 712/2005 z dne 11. maja 2005 o spremembi Prilog
    I in II k Uredbi Sveta (EGS) št. 2377/90 o določitvi postopka Skupnosti za določanje
    najvišjih mejnih vrednosti ostankov zdravil za uporabo v veterinarski medicini
    v živilih živalskega izvora glede lasalocida ter amonijeve in natrijeve soli
    bituminosulfonatov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 712/2005 de la Comisión, de 11 de mayo de 2005, por
    el que se modifican, en lo referente al lasalocid y a las sales de amonio y de
    sodio de bituminosulfonatos, los anexos I y II del Reglamento (CEE) n° 2377/90
    del Consejo por el que se establece un procedimiento comunitario de fijación
    de los límites máximos de residuos de medicamentos veterinarios en los alimentos
    de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 712/2005 av den 11 maj 2005 om ändring
    av bilagorna I och II till rådets förordning (EEG) nr 2377/90 om inrättandet
    av ett gemenskapsförfarande för att fastställa gränsvärden för högsta tillåtna
    restmängder av veterinärmedicinska läkemedel i livsmedel med animaliskt ursprung
    avseende lasalocid samt ammonium- och natriumsalter av bituminosulfonater
  type: main
