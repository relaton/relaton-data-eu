    relativa agli anodi di cadmio delle celle di Hersch di taluni sensori per la rilevazione
    dell'ossigeno utilizzati negli strumenti di monitoraggio e controllo industriali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2016/1029 (2016. gada 19. aprīlis),
