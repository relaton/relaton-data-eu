    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    dla anod kadmowych w ogniwach Herscha do czujników tlenu używanych w przyrządach
    do nadzoru i kontroli w obiektach przemysłowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2016/1029 da Comissão, de 19 de abril de 2016,
