title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2016/1029 of 19 April 2016 amending,
    for the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for cadmium
    anodes in Hersch cells for certain oxygen sensors used in industrial monitoring
    and control instruments
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2016/1029 de la Commission du 19 avril 2016
    modifiant, aux fins de son adaptation au progrès technique, l'annexe IV de la
    directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne une
    exemption relative aux anodes en cadmium des piles de Hersch présentes dans certains
    capteurs d'oxygène utilisés dans les instruments de surveillance et de contrôle
    industriels
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2016/1029 der Kommission vom 19. April 2016
    zur Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Cadmium-Anoden in Hersch-Zellen für bestimmte Sauerstoffsensoren,
    die in industriellen Überwachungs- und Kontrollinstrumenten verwendet werden
  type: main
- language: bg
  script: Cyrl
