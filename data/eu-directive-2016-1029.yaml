    a Parlamentului European și a Consiliului, în ceea ce privește o derogare pentru
    anozii de cadmiu din celulele Hersch ale anumitor senzori de oxigen utilizați
    în instrumentele industriale de monitorizare și control
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2016/1029 z 19. apríla 2016, ktorou
