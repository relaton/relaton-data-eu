    relativa aos ânodos de cádmio das células Hersch para determinados sensores
    de oxigénio utilizados em instrumentos industriais de monitorização e controlo
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2016/1029 a Comisiei din 19 aprilie 2016 de modificare,
