    i Hersch-celler til visse iltsensorer, der anvendes i industrielle overvågnings-
    og reguleringsinstrumenter
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία (EE) 2016/1029 της Επιτροπής,
