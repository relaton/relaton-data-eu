title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1487/91 of 31 May 1991 abolishing the corrective
    amount on the import of cabbage lettuces into the Community of Ten from Spain
    (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1487/91 de la Commission, du 31 mai 1991, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix de laitues pommées en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1487/91 der Kommission vom 31. Mai 1991 zur Aufhebung
    des bei der Einfuhr von Kopfsalat aus Spanien (mit Ausnahme der Kanarischen Inseln)
    in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1487/91 af 31. maj 1991 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af hovedsalat
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1487/91 της Επιτροπής
    της 31ης Μαΐου 1991 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, κεφαλωτών μαρουλιών
    από την Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1487/91 della Commissione, del 31 maggio 1991, che
    sopprime l'importo correttore da riscuotere all'importazione nella Comunità a
    dieci di lattughe a cappuccio in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1487/91 van de Commissie van 31 mei 1991 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van kropsla van
    herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1487/91 da Comissão, de 31 de Maio de 1991, que
    suprime o montante corrector a cobrar aquando da importação na Comunidade a
    Dez de alfaces repolhudas provenientes de Espanha, com excepção das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1487/91 de la Comisión, de 31 de mayo de 1991, por
    el que se suprime el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de lechugas repolladas procedentes de España (excepto
    las Islas Canarias)
  type: main
