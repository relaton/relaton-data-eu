title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 102/2012 of 27 January 2012 imposing
    a definitive anti-dumping duty on imports of steel ropes and cables originating
    in the People’s Republic of China and Ukraine as extended to imports of steel
    ropes and cables consigned from Morocco, Moldova and the Republic of Korea, whether
    declared as originating in these countries or not, following an expiry review
    pursuant to Article 11(2) of Regulation (EC) No 1225/2009 and terminating the
    expiry review proceeding concerning imports of steel ropes and cables originating
    in South Africa pursuant to Article 11(2) of Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 102/2012 du Conseil du 27 janvier 2012
    instituant un droit antidumping définitif sur les importations de câbles en
    acier originaires de la République populaire de Chine et d’Ukraine, tel qu’étendu
    aux importations de câbles en acier expédiés du Maroc, de Moldavie et de la
    République de Corée, qu’ils aient ou non été déclarés originaires de ces
    pays, à la suite d’un réexamen au titre de l’expiration des mesures conformément
    à l’article 11, paragraphe 2, du règlement (CE) n ° 1225/2009 et clôturant
    la procédure de réexamen au titre de l’expiration des mesures concernant les
    importations de câbles en acier originaires d’Afrique du Sud, conformément
    à l’article 11, paragraphe 2, du règlement (CE) n ° 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 102/2012 des Rates vom 27. Januar 2012
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von Kabeln
    und Seilen aus Stahl mit Ursprung in der Volksrepublik China und der Ukraine,
    ausgeweitet auf die Einfuhren von aus Marokko, der Republik Moldau und der Republik
    Korea versandten Kabeln und Seilen aus Stahl, ob als Ursprungserzeugnisse aus
    diesen Ländern angemeldet oder nicht, im Anschluss an eine Auslaufüberprüfung
    nach Artikel 11 Absatz 2 der Verordnung (EG) Nr. 1225/2009 und zur Einstellung
    des Verfahrens der Auslaufüberprüfung betreffend die Einfuhren von Kabeln und
    Seilen aus Stahl mit Ursprung in Südafrika nach Artikel 11 Absatz 2 der Verordnung
    (EG) Nr. 1225/2009
