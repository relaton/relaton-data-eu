    след преразглеждане с оглед изтичане на срока
    на действие съгласно член 11, параграф 2 от Регламент
    (ЕО) № 1225/2009 и за прекратяване на процедурата
    за преразглеждане с оглед изтичане на срока
    на действие по отношение на вноса на стоманени
    въжета и кабели с произход от Южна Африка съгласно
    член 11, параграф 2 от Регламент (ЕО) № 1225/2009
  type: main
