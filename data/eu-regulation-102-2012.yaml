  content: Provedbena Uredba Vijeća (EU) br. 102/2012 od 27. siječnja 2012. o uvođenju
    konačne antidampinške pristojbe na uvoz čelične užadi i kabela podrijetlom
    iz Narodne Republike Kine i Ukrajine kako je proširena na uvoz čelične užadi
    i kabela poslanih iz Maroka, Moldove i Republike Koreje, bez obzira na to imaju
