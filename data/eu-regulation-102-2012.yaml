  script: Latn
  content: Rådets genomförandeförordning (EU) nr 102/2012 av den 27 januari 2012
    om införande av en slutgiltig antidumpningstull på import av linor och kablar
    av stål med ursprung i Folkrepubliken Kina och Ukraina, som utvidgats till att
    även omfatta import av linor och kablar av stål som avsänts från Marocko,
    Moldavien och Republiken Korea, oavsett om produkternas deklarerade ursprung är
    dessa länder eller inte, till följd av en översyn vid giltighetstidens utgång
    enligt artikel 11.2 i förordning (EG) nr 1225/2009, och om avslutande av översynen
    vid giltighetstidens utgång enligt artikel 11.2 i förordning (EG) nr 1225/2009
    vad gäller import av linor och kablar av stål med ursprung i Sydafrika
