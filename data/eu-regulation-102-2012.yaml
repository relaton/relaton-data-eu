  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 102/2012 af 27. januar 2012
    om indførelse af en endelig antidumpingtold på importen af tovværk og kabler
    af stål med oprindelse i Folkerepublikken Kina og Ukraine, som blev udvidet til
    at omfatte importen af tovværk og kabler af stål afsendt fra Marokko, Moldova
    og Republikken Korea, uanset om varen er angivet med oprindelse i de lande, efter
    en udløbsundersøgelse i henhold til artikel 11, stk. 2, i forordning (EF) nr.
    1225/2009 og om afslutning af udløbsundersøgelsen vedrørende importen af tovværk
    og kabler af stål med oprindelse i Sydafrika i henhold til artikel 11, stk. 2,
    i forordning (EF) nr. 1225/2009
