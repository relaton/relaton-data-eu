  content: Council Regulation (EC) No 192/1999 of 25 January 1999 extending the definitive
    anti-dumping duty, imposed by Regulation (EEC) No 3433/91 on imports of gas-fuelled,
    non-refillable pocket flint lighters originating in the People's Republic of China
    to imports of certain disposable refillable pocket flint lighters originating
    in the People's Republic of China or consigned from or originating in Taiwan and
    to imports of non-refillable lighters consigned from or originating in Taiwan,
    and terminating the proceeding in respect of imports of non-refillable lighters
    consigned from Hong Kong and Macao
  type: main
