    und entsprechender Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen
    (1992)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2119/92 af 20. juli 1992 om ændring af forordning
