  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2119/92 del Consiglio, del 20 luglio 1992, recante
    modifica del regolamento (CEE) n. 3882/91 che stabilisce, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale delle catture ammesse per il 1992 e
    talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2119/92 van de Raad van 20 juli 1992 tot wijziging
    van Verordening (EEG) nr. 3882/91 inzake de vaststelling van de voor 1992 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden,
    alsmede bij de visserij in het kader van de totaal toegestane vangsten in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2119/92 do Conselho, de 20 de Julho de 1992, que
    altera o Regulamento (CEE) n° 3882/91 que fixa, relativamente a certas unidades
    populacionais (stocks) ou grupos de unidades populacionais de peixes, os totais
    admissíveis de capturas para 1992 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2119/92 del Consejo, de 20 de julio de 1992, que modifica
