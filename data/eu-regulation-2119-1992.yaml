    total allowable catches for 1992 and certain conditions under which they may be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2119/92 du Conseil, du 20 juillet 1992, modifiant
    le règlement (CEE) n° 3882/91 fixant, pour certains stocks et groupes de stocks
    de poissons, les totaux admissibles des captures pour 1992 et certaines conditions
    dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
