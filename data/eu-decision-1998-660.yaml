  content: '98/660/EC: Commission Decision of 12 November 1998 authorising Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC (notified
    under document number C(1998) 3489)'
  type: main
- language: fr
  script: Latn
  content: '98/660/CE: Décision de la Commission du 12 novembre 1998 autorisant les
    États membres à permettre temporairement la commercialisation des matériels
    forestiers de reproduction non conformes aux dispositions des directives 66/404/CEE
    et 71/161/CEE du Conseil [notifiée sous le numéro C(1998) 3489]'
  type: main
