title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 852/1999 of 23 April 1999 determining the
    extent to which applications lodged in April 1999 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 852/1999 de la Commission du 23 avril 1999 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1999 pour certains produits du secteur des oeufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 852/1999 der Kommission vom 23. April 1999 über die
    Festsetzung des Umfangs, in dem die im April 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 852/1999 af 23. april 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    1999 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 852/1999 της Επιτροπής
    της 23ης Απριλίου 1999 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Απρίλιο του 1999 για πιστοποιητικά
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 852/1999, annettu 23 päivänä huhtikuuta 1999,
    määrättyyn järjestelmään liittyvien huhtikuussa 1999 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 852/1999 della Commissione del 23 aprile 1999 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 1999 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 852/1999 van de Commissie van 23 april 1999 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren eieren en slachtpluimvee, die in april
    1999 worden ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr.
    1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 852/1999 da Comissão de 23 de Abril de 1999 que determina
    em que medida podem ser aceites os pedidos de certificados de importação de
    determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Abril de 1999 ao abrigo dos Regulamentos (CE) n° 1474/95 e (CE) n° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 852/1999 de la Comisión de 23 de abril de 1999 por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de los huevos y de la carne de
    aves de corral presentadas en el mes de abril de 1999 al amparo de los Reglamentos
    (CE) nos 1474/95 y 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 852/1999 av den 23 april 1999 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa äggprodukter
    samt fjäderfäkött som ges in under april 1999 inom ramen för förordningarna
    (EG) nr 1474/95 och (EG) nr 1251/96 kan godtas
  type: main
