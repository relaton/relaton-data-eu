- language: en
  script: Latn
  content: Commission Regulation (EC) No 236/97 of 7 February 1997 determining the
    loss of income and the premiums applicable per ewe and per female goat in the
    Member States and the payment of the specific aid for sheep and goat farming in
    certain less-favoured areas of the Community for the 1996 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 236/97 de la Commission du 7 février 1997 déterminant,
