title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 625/90 of 12 March 1990 establishing, for the
    period from 1 March to 30 June 1990, certain measures for the conservation and
    management of fishery resources applicable to vessels flying the Japanese flag
    in waters falling under the sovereignty or jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 625/90 du Conseil du 12 mars 1990 fixant, pour la
    période allant du 1er mars au 30 juin 1990, certaines mesures de conservation
    et de gestion des ressources de pêche applicables aux navires battant pavillon
    japonais dans les eaux sous souveraineté ou sous juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 625/90 DES RATES vom 12. März 1990 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter japanischer Flagge in den der Hoheitsgewalt oder der Gerichtsbarkeit
    Portugals unterstehenden Gewässern für die Zeit vom 1. März bis zum 30. Juni
    1990 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 625/90 af 12. marts 1990 om fastsættelse,
    for perioden 1. marts til 30. juni 1990 af visse foranstaltninger til bevarelse
    og forvaltning af fiskeressourcerne for fartøjer, der fører japansk flag, i
    farvandene under Portugals højhedsområde eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 625/90 του Συμβουλίου
    της 12ης Μαρτίου 1990 για τον καθορισμό, κατά το
    διάστημα από την 1η Μαρτίου έως τις 30 Ιουνίου
    1990, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, που εφαρμόζονται για
    τα σκάφη υπό ιαπωνική σημαία στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 625/90 DEL CONSIGLIO del 12 marzo 1990 che stabilisce
    per il periodo dal 1o marzo al 30 giugno 1990 talune misure di conservazione e
    di gestione delle risorse ittiche applicabili alle navi battenti bandiera giapponese
    nelle acque soggette alla sovranità o alla giurisdizione del Portogallo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 625/90 VAN DE RAAD van 12 maart 1990 tot vaststelling,
    voor het tijdvak van 1 maart tot en met 30 juni 1990, van bepaalde maatregelen
    voor de instandhouding en het beheer van de visbestanden welke gelden voor vaartuigen
    die de vlag van Japan voeren en vissen in de wateren die onder de soevereiniteit
    of de jurisdictie van Portugal vallen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 625/90 DO CONSELHO de 12 de Março de 1990 que fixa,
    para o período compreendido entre 1 de Março e 30 de Junho de 1990, determinadas
    medidas de conservação e de gestão dos recursos da pesca aplicáveis aos navios
    arvorando pavilhão japonês nas águas sob soberania ou jurisdição de Portugal
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 625/90 DEL CONSEJO de 12 de marzo de 1990 por el que
    se establecen para el período comprendido entre el 1 de marzo y el 30 de junio
    de 1990 determinadas medidas de conservación y de gestión de los recursos de
    la pesca, aplicables a los barcos que naveguen bajo pabellón japonés en las
    aguas sometidas a la soberanía o a la jurisdicción de Portugal #'
