title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2022/99 of 25 January 2022 amending
    Implementing Decision (EU) 2020/1354 granting temporary support under Regulation
    (EU) 2020/672 to the Portuguese Republic to mitigate unemployment risks in the
    emergency following the COVID-19 outbreak
  type: main
- language: fr
  script: Latn
