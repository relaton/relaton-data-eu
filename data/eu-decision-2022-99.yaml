    unui sprijin temporar Republicii Portugheze în temeiul Regulamentului (UE) 2020/672
    pentru atenuarea riscurilor de șomaj în situația de urgență generată de
    epidemia de COVID-19
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2022/99 z 25. januára 2022, ktorým
