id: EUDecision1980515
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/515/EEC: Commission Decision of 5 May 1980 authorizing Ireland not
    to apply Community treatment to men''s and boys''woven under garments other than
    shirts, falling within subheadings ex 61.03 B and C of the Common Customs Tariff
    (category 18), originating in Hong Kong and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/515/CEE: Décision de la Commission, du 5 mai 1980, autorisant l''Irlande
    à exclure du traitement communautaire les sous-vêtements tissés, autres que
    chemises et chemisettes, pour hommes et garçonnets, de la sous-position ex 61.03
    B et C du tarif douanier commun (catégorie 18), originaires de Hong-kong et mis
    en libre pratique dans les autres Etats membres (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/515/EWG: Entscheidung der Kommission vom 5. Mai 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Unterkleidung aus Geweben, andere als Oberhemden, auch
    Sport- und Arbeitshemden, für Männer und Knaben, der Tarifstellen ex 61.03 B
    und C des Gemeinsamen Zolltarifs (Kategorie 18) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/515/EØF: Kommissionens beslutning af 5. Maj 1980 om bemyndigelse af
    Irland til fra fællesskabsbehandling at undtage underbeklædningsgenstande, vævede,
    andre end skjorter (herunder sports- og arbejdsskjorter), til mænd og drenge,
    som henhører under pos. ex 61.03 B og C i den fælles toldtarif (kategori 18),
    har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/515/CEE: Decisione della Commissione, del 5 maggio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le sottovesti tessute, diverse
    dalle camicie e camicette, per uomo e per ragazzo, delle sottovoci ex 61.03 B
    e C della tariffa doganale comune, categoria 18, originarie di Hong Kong e messe
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/515/EEG: Beschikking van de Commissie van 5 mei 1980 waarbij Ierland
    wordt gemachtigd herenonderkleding en jongensonderkleding, geweven, andere dan
    overhemden en sporthemden van post ex 61.03 B + C van het gemeenschappelijk douanetarief
    (categorie 18), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Engelse taal is authentiek)'
  type: main
