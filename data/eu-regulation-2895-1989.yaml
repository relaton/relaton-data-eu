    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2895/89 της Επιτροπής
