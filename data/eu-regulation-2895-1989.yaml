title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2895/89 of 27 September 1989 re-establishing
    the levying of customs duties on activated carbon, falling within CN code 3802
    10 00, originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2895/89 de la Commission du 27 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux charbons
    activés, du code NC 3802 10 00, originaires de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2895/89 DER KOMMISSION vom 27. September 1989 zur
    Wiedereinführung der Erhebung der Zölle für Aktivkohle des KN-Code 3802 10
    00 mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2895/89 af 27. september 1989 om genindførelse
