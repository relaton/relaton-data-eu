    tot wijziging van bijlage II bij Verordening (EU) 2018/858 van het Europees Parlement
    en de Raad wat betreft de voorschriften inzake milieuprestaties en emissies voor
    in onbeperkte series geproduceerde voertuigen en voor voertuigen voor speciale
    doeleinden, de geautomatiseerde parkeerservice voor in onbeperkte series geproduceerde
