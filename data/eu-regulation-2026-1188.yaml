  script: Latn
  content: Reglamento Delegado (UE) 2026/1188 de la Comisión, de 23 de marzo de 2026,
    por el que se modifica el anexo II del Reglamento (UE) 2018/858 del Parlamento
    Europeo y del Consejo en lo relativo a los requisitos de eficacia medioambiental
