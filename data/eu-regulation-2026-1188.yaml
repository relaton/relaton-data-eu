title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/1188 of 23 March 2026 amending
    Annex II to Regulation (EU) 2018/858 of the European Parliament and of the Council
    as regards the environmental performance and emission requirements for vehicles
    produced in unlimited series and for special purpose vehicles, the automated valet
    parking for vehicles produced in unlimited series, the electric safety and advanced
    driver distraction warning requirements for vehicles produced in small series
    and special purpose vehicles and updating the list of alternative UN Regulations
    in Part II of that Annex
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/1188 de la Commission du 23 mars 2026 modifiant
    l’annexe II du règlement (UE) 2018/858 du Parlement européen et du Conseil
    en ce qui concerne les prescriptions en matière de performance environnementale
    et d’émissions pour les véhicules produits en séries illimitées et pour
    les véhicules à usage spécial, le service voiturier automatisé pour les véhicules
    produits en séries illimitées, les prescriptions en matière de sécurité électrique
    et de système avancé d’avertissement de distraction du conducteur pour les
    véhicules produits en petites séries et les véhicules à usage spécial et
    mettant à jour la liste des règlements de l’ONU reconnus comme équivalents
    figurant dans la partie II de ladite annexe
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/1188 der Kommission vom 23. März 2026
    zur Änderung des Anhangs II der Verordnung (EU) 2018/858 des Europäischen Parlaments
    und des Rates hinsichtlich der Anforderungen an die Umweltverträglichkeit und
    der Emissionsanforderungen für in unbegrenzter Serie hergestellte Fahrzeuge und
    für Fahrzeuge mit besonderer Zweckbestimmung, des automatisierten Parkens von
    in unbegrenzter Serie hergestellten Fahrzeugen, der Anforderungen an die elektrische
    Sicherheit und an das hochentwickelte Warnsystem bei nachlassender Konzentration
    des Fahrers für Kleinserienfahrzeuge und Fahrzeuge mit besonderer Zweckbestimmung
    sowie zur Aktualisierung der Liste alternativer UN-Regelungen in Teil II des genannten
    Anhangs
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2026/1188 на Комисията
    от 23 март 2026 година за изменение на приложение
    II към Регламент (ЕС) 2018/858 на Европейския парламент
    и на Съвета по отношение на екологичните показатели
    и изискванията за емисиите от превозни средства,
    произвеждани в неограничени серии, и от превозни
    средства със специално предназначение, автоматизираното
    паркиране за превозни средства, произвеждани
    в неограничени серии, изискванията за електробезопасност
    и изискванията за усъвършенстваните системи
    за предупреждение за отклонено внимание на
    водача за превозни средства, произвеждани
    в малки серии, и за превозни средства със специално
    предназначение, както и за актуализиране на
    списъка на алтернативните правила на ООН в
    част II от посоченото приложение
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2026/1188 ze dne 23. března
    2026, kterým se mění příloha II nařízení Evropského parlamentu a Rady
    (EU) 2018/858, pokud jde o požadavky na environmentální výkonnost a emise
    vozidel vyráběných v neomezených sériích a vozidel zvláštního určení,
    automatizovaný systém parkování pro vozidla vyráběná v neomezených sériích
    a požadavky na elektrickou bezpečnost a vyspělé upozorňování na rozptýlenost
    řidiče u vozidel vyráběných v malých sériích a vozidel zvláštního určení,
    a kterým se aktualizuje seznam alternativních předpisů OSN v části II uvedené
    přílohy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2026/1188 af 23. marts 2026 om
    ændring af bilag II til Europa-Parlamentets og Rådets forordning (EU) 2018/858
    for så vidt angår krav til miljøpræstationer og emissioner for køretøjer
    fremstillet i ubegrænsede serier og for køretøjer til særlig anvendelse, automatisk
    parkeringsservice til køretøjer fremstillet i ubegrænsede serier, krav til
    elektrisk sikkerhed og avanceret distraktionsadvarsel for køretøjer fremstillet
    i små serier og køretøjer til særlig anvendelse samt om ajourføring af listen
    over alternative FN-regulativer i del II i nævnte bilag
  type: main
