  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2026/1188, 23. märts 2026, millega
    muudetakse Euroopa Parlamendi ja nõukogu määruse (EL) 2018/858 II lisa seoses
    seeriaviisiliselt piiranguteta toodetavate sõidukite ja eriotstarbeliste sõidukite
    keskkonnatoime- ja heitenõuetega, seeriaviisiliselt piiranguteta toodetavate
    sõidukite automaatparkimise nõuetega, väikeseeriana toodetavate sõidukite
    ja eriotstarbeliste sõidukite elektriohutuse ja kõrgtehnoloogiliste juhi tähelepanu
    hajumise eest hoiatamise süsteemide nõuetega ning ajakohastatakse kõnealuse
