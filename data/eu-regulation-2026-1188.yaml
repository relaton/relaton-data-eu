    distração do condutor para veículos produzidos em pequenas séries e para fins
    especiais e que atualiza a lista de regulamentos alternativos da ONU constante
    da parte II desse anexo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2026/1188 al Comisiei din 23 martie 2026 de modificare
    a anexei II la Regulamentul (UE) 2018/858 al Parlamentului European și al Consiliului
    în ceea ce privește cerințele privind performanța de mediu și emisiile pentru
    vehiculele produse în serii nelimitate și pentru vehiculele cu destinație specială,
    sistemele de parcare cu valet automat pentru vehiculele produse în serii nelimitate,
    cerințele privind siguranța electrică și sistemele avansate de avertizare
    privind distragerea atenției conducătorului auto pentru vehiculele produse în
    serii mici și pentru vehiculele cu destinație specială, precum și de actualizare
    a listei regulamentelor ONU alternative din partea II a anexei respective
  type: main
