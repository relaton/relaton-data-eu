  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2026/1188
    της Επιτροπής, της 23ης Μαρτίου 2026, για την τροποποίηση
    του παραρτήματος II του κανονισμού (ΕΕ) 2018/858
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά τις απαιτήσεις περιβαλλοντικών
    επιδόσεων και εκπομπών για οχήματα που παράγονται
    σε απεριόριστες σειρές και για οχήματα ειδικού
    σκοπού, την αυτοματοποιημένη υπηρεσία στάθμευσης
    οχημάτων που παράγονται σε απεριόριστες σειρές,
    τις απαιτήσεις σχετικά με την ηλεκτρική ασφάλεια
    και τα προηγμένα συστήματα προειδοποίησης
    διάσπασης της προσοχής του οδηγού για οχήματα
    που παράγονται σε μικρές σειρές και οχήματα
    ειδικού σκοπού και για την επικαιροποίηση
    του καταλόγου εναλλακτικών κανονισμών του
    ΟΗΕ στο μέρος II του εν λόγω παραρτήματος
  type: main
