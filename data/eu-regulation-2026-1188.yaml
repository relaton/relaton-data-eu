  script: Latn
  content: Komission delegoitu asetus (EU) 2026/1188, annettu 23 päivänä maaliskuuta
    2026, Euroopan parlamentin ja neuvoston asetuksen (EU) 2018/858 liitteen II muuttamisesta
    siltä osin kuin on kyse rajoittamattomina sarjoina valmistettavien ajoneuvojen
    ja erikoiskäyttöön tarkoitettujen ajoneuvojen ympäristöominaisuuksia ja päästöjä
    koskevista vaatimuksista, rajoittamattomina sarjoina valmistettavien ajoneuvojen
    automaattisesta pysäköintipalvelusta, pieninä sarjoina valmistettavien ajoneuvojen
    ja erikoiskäyttöön tarkoitettujen ajoneuvojen sähköturvallisuutta ja kehittynyttä
    kuljettajan tarkkaamattomuuden varoitusjärjestelmää koskevista vaatimuksista
    sekä kyseisessä liitteessä olevassa II osassa esitetyn vastaavien E-sääntöjen
    luettelon päivittämisestä
  type: main
- language: ga
  script: Latn
