  content: Rozporządzenie delegowane Komisji (UE) 2026/1188 z dnia 23 marca 2026
    r. zmieniające załącznik II do rozporządzenia Parlamentu Europejskiego i Rady
    (UE) 2018/858 w odniesieniu do wymogów w zakresie efektywności środowiskowej
    i emisji dla pojazdów produkowanych w nieograniczonych seriach i pojazdów specjalnego
    przeznaczenia, systemów zautomatyzowanego parkowania typu valet parking dla pojazdów
    produkowanych w nieograniczonych seriach, wymogów w zakresie bezpieczeństwa
    elektrycznego i zaawansowanych systemów ostrzegania o rozproszeniu uwagi kierowcy
    dla pojazdów produkowanych w małych seriach i pojazdów specjalnego przeznaczenia
