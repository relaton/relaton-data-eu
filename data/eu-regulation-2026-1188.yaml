  content: Kommissionens delegerade förordning (EU) 2026/1188 av den 23 mars 2026
    om ändring av bilaga II till Europaparlamentets och rådets förordning (EU)
    2018/858 vad gäller krav avseende miljöprestanda och utsläpp för fordon som
    tillverkas i obegränsade serier och för fordon avsedda för särskilda ändamål,
    automatiserad parkering för fordon som tillverkas i obegränsade serier, krav
