  script: Latn
  content: Regulamento Delegado (UE) 2026/1188 da Comissão, de 23 de março de 2026,
    que altera o anexo II do Regulamento (UE) 2018/858 do Parlamento Europeu e do
    Conselho no que respeita aos requisitos em matéria de desempenho ambiental e
    emissões dos veículos produzidos em séries ilimitadas e dos veículos para
    fins especiais, ao estacionamento automatizado para veículos produzidos em séries
