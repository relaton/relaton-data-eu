    parkovací systém v prípade vozidiel vyrábaných v neobmedzených sériách,
    požiadavky na elektrickú bezpečnosť a pokročilé systémy varovania vodiča
    pred rozptýlením v prípade vozidiel vyrábaných v malých sériách a vozidiel
    na špeciálne účely, a ktorým sa aktualizuje zoznam alternatívnych predpisov
    OSN v časti II uvedenej prílohy
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2026/1188 z dne 23. marca 2026 o spremembi
    Priloge II k Uredbi (EU) 2018/858 Evropskega parlamenta in Sveta v zvezi z zahtevami
    glede okoljske uspešnosti in emisij za vozila, izdelana v neomejenih serijah,
    in vozila za posebne namene, zahtevami glede avtomatiziranih storitev parkiranja
    za vozila, izdelana v neomejenih serijah, zahtevami glede električne varnosti
    in naprednega opozarjanja na nepozornost voznika za vozila, izdelana v majhnih
    serijah, in zahtevami za vozila za posebne namene ter o posodobitvi seznama alternativnih
    pravilnikov ZN v delu II navedene priloge
  type: main
