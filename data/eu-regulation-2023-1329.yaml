  script: Latn
  content: Commission Regulation (EU) 2023/1329 of 29 June 2023 amending Annex II
    to Regulation (EC) No 1333/2008 of the European Parliament and of the Council
    as regards the use of polyglycerol polyricinoleate (E 476) and the Annex to Commission
    Regulation (EU) No 231/2012 as regards specifications for glycerol (E 422), polyglycerol
    esters of fatty acids (E 475) and polyglycerol polyricinoleate (E 476)
  type: main
