    poliglicerolio poliricinoleato (E 476) naudojimo iš dalies keičiamas Europos
    Parlamento ir Tarybos reglamento (EB) Nr. 1333/2008 II priedas ir dėl glicerolio
    (E 422), riebalų rūgščių poliglicerolio esterių (E 475) ir poliglicerolio
    poliricinoleato (E 476) specifikacijų iš dalies keičiamas Komisijos reglamento
    (ES) Nr. 231/2012 priedas
  type: main
