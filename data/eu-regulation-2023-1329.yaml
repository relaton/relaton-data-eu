    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2023/1329 della Commissione del 29 giugno 2023 che modifica
    l’allegato II del regolamento (CE) n. 1333/2008 del Parlamento europeo e del
    Consiglio per quanto riguarda l’uso del poliricinoleato di poliglicerolo (E
    476) e l’allegato del regolamento (UE) n. 231/2012 della Commissione per quanto
    riguarda le specifiche del glicerolo (E 422), degli esteri poliglicerici degli
    acidi grassi (E 475) e del poliricinoleato di poliglicerolo (E 476)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2023/1329 (2023. gada 29. jūnijs), ar ko attiecībā
    uz poliglicerīna poliricinolāta (E 476) lietošanu groza Eiropas Parlamenta
    un Padomes Regulas (EK) Nr. 1333/2008 II pielikumu un attiecībā uz glicerīna
    (E 422), taukskābju poliglicerīna esteru (E 475) un poliglicerīna poliricinolāta
    (E 476) specifikācijām groza Komisijas Regulas (ES) Nr. 231/2012 pielikumu
  type: main
- language: lt
  script: Latn
