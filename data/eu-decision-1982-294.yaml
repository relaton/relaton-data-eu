    μέ τήν ονομασία «Quanta Ray-Nd: YAG Laboratory Laser System, model
    DCR-1A» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/294/CEE: Decisione della Commissione, del 13 aprile 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Quanta Ray - Nd:YAG Laboratory
    Laser System, model DCR-1A" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/294/EEG: Beschikking van de Commissie van 13 april 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Quanta Ray - Nd: YAG Laboratory Laser System,
    model DCR-1A" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
