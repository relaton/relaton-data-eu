title:
- language: en
  script: Latn
  content: '82/294/EEC: Commission Decision of 13 April 1982 establishing that the
    apparatus described as ''Quanta Ray - Nd: YAG Laboratory Laser System, model DCR-1A'',
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/294/CEE: Décision de la Commission, du 13 avril 1982, constatant que
    l''importation de l''appareil dénommé "Quanta Ray - Nd: YAG laboratory laser
    system, model DCR-1A" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/294/EWG: Entscheidung der Kommission vom 13. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Quanta Ray-Nd: YAG Laboratory Laser System, model DCR-1A"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/294/EØF: Kommissionens beslutning af 13. april 1982 om fastslåelse
    af, at indførsel af apparatet "Quanta Ray - Nd : YAG laboratory laser system,
    model DCR-1A" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/294/EOK: Απόφαση τής Επιτροπής τής 13ης Απριλίου
