title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1330/91 of 22 May 1991 re-establishing the
    levying of customs duties on products of category 3 (order No 40.0033) and category
    5 (order No 40.0050) originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1330/91 DE LA COMMISSION du 22 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    3 (numéro d'' ordre 40.0033) et 5 (numéro d'' ordre 40.0050) originaires de
    l'' Inde, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1330/91 DER KOMMISSION vom 22. Mai 1991 über die
    Wiedereinführung des Zollsatzes für Waren der Kategorie Nr. 3 (laufende Nummer
    40.0033) und Waren der Kategorie Nr. 5 (laufende Nummer 40.0050) mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1330/91 af 22. maj 1991 om genindførelse
