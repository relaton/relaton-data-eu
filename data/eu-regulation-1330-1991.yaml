    og varer under varekategori nr. 5 (løbenummer 40.0050), som har oprindelse i
    Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
