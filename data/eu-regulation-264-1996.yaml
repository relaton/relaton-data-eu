title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 264/96 of 12 February 1996 determining the
    extent to which applications lodged in January 1996 for import certificates for
    certain cheeses covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 264/96 DE LA COMMISSION du 12 février 1996 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 1996 pour certains fromages dans le cadre du régime prévu par les
    accords européens conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 264/96 DER KOMMISSION vom 12. Februar 1996 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im Januar
    1996 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Europa-Abkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 264/96 af 12. februar 1996 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i januar 1996 for
    visse oste kan imødekommes under den ordning, der er fastsat i Europaaftalerne
    mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 264/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 12ης Φεβρουαρίου 1996 για τον καθορισμό σε
    ποιο βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    τον Ιανουάριο 1996 για ορισμένα τυριά στα πλαίσια
    του καθεστώτος που προβλέπεται από τις ευρωπαϊκές
    συμφωνίες που έχουν συναφθεί από την Κοινότητα
    με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 264/96, annettu 12 päivänä helmikuuta 1996,
    yhteisön sekä Bulgarian ja Romanian välillä tehdyissä Eurooppa-sopimuksissa
    määrätyn järjestelmän mukaisesti tammikuussa 1996 jätettyjen tiettyjä juustoja
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 264/96 DELLA COMMISSIONE del 12 febbraio 1996 che stabilisce
    entro quali limiti possono essere accettate le domande di certificati di importazione
    presentate nel mese di gennaio 1996 per taluni formaggi nel quadro del regime
    previsto dagli accordi europei conclusi tra la Comunità e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 264/96 VAN DE COMMISSIE van 12 februari 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde kaassoorten, die in januari 1996 zijn ingediend op grond van de
    regeling die is vastgesteld in de door de Gemeenschap met Bulgarije en Roemenië
    gesloten Europa-Overeenkomsten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 264/96 DA COMISSÃO de 12 de Fevereiro de 1996 que
