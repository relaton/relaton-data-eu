    apresentados em Janeiro de 1996, para determinados queijos, no âmbito do regime
    previsto nos acordos europeus concluídos pela Comunidade com a Bulgária e a
    Roménia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 264/96 DE LA COMISIÓN de 12 de febrero de 1996 por
