    Amerika, aus denen die Einfuhr frischen Fleisches in die Gemeinschaft zugelassen
    ist (91/344/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 17. juni 1991 om ændring af beslutning 87/257/EØF
