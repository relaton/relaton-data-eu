id: EURegulation6402014
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 640/2014 of 11 March 2014 supplementing
    Regulation (EU) No 1306/2013 of the European Parliament and of the Council with
    regard to the integrated administration and control system and conditions for
    refusal or withdrawal of payments and administrative penalties applicable to direct
    payments, rural development support and cross compliance
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n °640/2014 de la Commission du 11 mars 2014
    complétant le règlement (UE) n °1306/2013 du Parlement européen et du Conseil
    en ce qui concerne le système intégré de gestion et de contrôle, les conditions
    relatives au refus ou au retrait des paiements et les sanctions administratives
    applicables aux paiements directs, le soutien au développement rural et la conditionnalité
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 640/2014 der Kommission vom 11. März 2014
    zur Ergänzung der Verordnung (EU) Nr. 1306/2013 des Europäischen Parlaments
    und des Rates in Bezug auf das integrierte Verwaltungs- und Kontrollsystem und
    die Bedingungen für die Ablehnung oder Rücknahme von Zahlungen sowie für Verwaltungssanktionen
    im Rahmen von Direktzahlungen, Entwicklungsmaßnahmen für den ländlichen Raum
    und der Cross-Compliance
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) № 640/2014 на Комисията
    от 11 март 2014 година за допълнение на Регламент
    (ЕС) № 1306/2013 на Европейския парламент и на Съвета
    по отношение на интегрираната система за администриране
    и контрол и условията за отказ или оттегляне
    на плащанията и административните санкции,
    приложими към директните плащания, подпомагането
    на развитието на селските райони и кръстосаното
    съответствие
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) č. 640/2014 ze dne 11.
    března 2014 , kterým se doplňuje nařízení Evropského parlamentu a Rady
    (EU) č. 1306/2013, pokud jde o integrovaný administrativní a kontrolní systém
    a o podmínky pro zamítnutí nebo odnětí plateb a správní sankce uplatňované
    na přímé platby, podporu na rozvoj venkova a podmíněnost
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) nr. 640/2014 af 11. marts 2014
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 1306/2013
    for så vidt angår det integrerede forvaltnings- og kontrolsystem, betingelserne
    for afslag eller tilbagetrækning af betalinger og administrative sanktioner vedrørende
    direkte betalinger, støtte til udvikling af landdistrikterne og krydsoverensstemmelse
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) αριθ.
    640/2014 της Επιτροπής, της 11ης Μαρτίου 2014 , για
    τη συμπλήρωση του κανονισμού (ΕΕ) αριθ. 1306/2013
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    όσον αφορά το ολοκληρωμένο σύστημα διαχείρισης
    και ελέγχου και τους όρους απόρριψης ή ανάκτησης
    πληρωμών καθώς και τις διοικητικές κυρώσεις
    που εφαρμόζονται στις άμεσες ενισχύσεις, τη
    στήριξη της αγροτικής ανάπτυξης και την πολλαπλή
    συμμόρφωση
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) nr 640/2014, 11. märts 2014 , millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 1306/2013 ühtse
    haldus- ja kontrollisüsteemi osas, otsetoetuste, maaelu arengu toetuse ja nõuetele
    vastavuse süsteemiga seoses kohaldatavatest maksetest keeldumise ja nende tühistamise
    tingimuste osas ning kõnealuste toetuste ja süsteemiga seotud halduskaristuste
    osas
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) N:o 640/2014, annettu 11 päivänä maaliskuuta
    2014 , Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 1306/2013 täydentämisestä
    yhdennetyn hallinto- ja valvontajärjestelmän sekä suoriin tukiin, maaseudun
    kehittämistukeen ja täydentäviin ehtoihin sovellettavien maksujen epäämis-
    ja perumisedellytysten sekä hallinnollisten seuraamusten osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) br. 640/2014 оd 11. ožujka 2014. o dopuni
    Uredbe (EU) br. 1306/2013 Europskog parlamenta i Vijeća u pogledu integriranog
    administrativnog i kontrolnog sustava te uvjeta za odbijanje ili obustavu plaćanja
    i administrativne kazne koje se primjenjuju za izravna plaćanja, potporu ruralnom
    razvoju i višestruku sukladnost
  type: main
- language: hu
  script: Latn
  content: A Bizottság 640/2014/EU felhatalmazáson alapuló rendelete ( 2014. március
    11. ) az 1306/2013/EU európai parlamenti és tanácsi rendeletnek az integrált
    igazgatási és ellenőrzési rendszer, a kifizetések elutasítására és visszavonására
    vonatkozó feltételek, valamint a közvetlen kifizetésekre, a vidékfejlesztési
    támogatásokra és a kölcsönös megfeleltetésre alkalmazandó közigazgatási
    szankciók tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 640/2014 della Commissione, dell’ 11 marzo
    2014 , che integra il regolamento (UE) n. 1306/2013 del Parlamento europeo e del
    Consiglio per quanto riguarda il sistema integrato di gestione e di controllo
    e le condizioni per il rifiuto o la revoca di pagamenti nonché le sanzioni amministrative
    applicabili ai pagamenti diretti, al sostegno allo sviluppo rurale e alla condizionalità
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) Nr. 640/2014 ( 2014. gada 11. marts ),
    ar ko papildina Eiropas Parlamenta un Padomes Regulu (ES) Nr. 1306/2013 attiecībā
    uz integrēto administrācijas un kontroles sistēmu, maksājumu atteikšanas
    vai atsaukšanas nosacījumiem un administratīvajiem sodiem, kas piemērojami
    tiešo maksājumu, lauku attīstības atbalsta un savstarpējās atbilstības
    kontekstā
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 11 d. Komisijos deleguotasis reglamentas (ES) Nr. 640/2014,
    kuriuo papildomos Europos Parlamento ir Tarybos reglamento (ES) Nr. 1306/2013
    nuostatos dėl integruotos administravimo ir kontrolės sistemos ir dėl išmokų
    neskyrimo arba atšaukimo sąlygų bei administracinių nuobaudų, taikomų tiesioginėms
    išmokoms, paramai kaimo plėtrai ir kompleksinei paramai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Delega tal-Kummissjoni (UE) Nru 640/2014 tal-11 ta’
    Marzu 2014 li jissupplimenta r-Regolament (UE) Nru 1306/2013 tal-Parlament Ewropew
    u tal-Kunsill fir-rigward tas-sistema integrata ta’ amministrazzjoni u kontroll
    u l-kundizzjonijiet għar-rifjut jew l-irtirar ta’ pagamenti u penali amministrattivi
    applikabbli għall-pagamenti diretti, l-appoġġ għall-iżvilupp rurali u l-kundizzjonalità
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) nr. 640/2014 van de Commissie van 11 maart
    2014 tot aanvulling van Verordening (EU) nr. 1306/2013 van het Europees Parlement
    en de Raad wat betreft het geïntegreerd beheers- en controlesysteem en de voorwaarden
    voor weigering of intrekking van betalingen en voor administratieve sancties in
    het kader van rechtstreekse betalingen, plattelandsontwikkelingsbijstand en de
    randvoorwaarden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 640/2014 z dnia 11 marca 2014
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 1306/2013
    w odniesieniu do zintegrowanego systemu zarządzania i kontroli oraz warunków
    odmowy lub wycofania płatności oraz do kar administracyjnych mających zastosowanie
    do płatności bezpośrednich, wsparcia rozwoju obszarów wiejskich oraz zasady
    wzajemnej zgodności
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) n. °640/2014 da Comissão, de 11 de março de
    2014 , que completa o Regulamento (UE) n. °1306/2013 do Parlamento Europeu e
    do Conselho no que diz respeito ao sistema integrado de gestão e de controlo
    e às condições de recusa ou retirada de pagamentos, bem como às sanções
    administrativas aplicáveis aos pagamentos diretos, ao apoio ao desenvolvimento
    rural e à condicionalidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) nr. 640/2014 al Comisiei din 11 martie 2014 de
    completare a Regulamentului (UE) nr. 1306/2013 al Parlamentului European și al
    Consiliului în ceea ce privește Sistemul Integrat de Administrare și Control
    și condițiile pentru refuzarea sau retragerea plăților și pentru sancțiunile
    administrative aplicabile în cazul plăților directe, al sprijinului pentru
    dezvoltare rurală și al ecocondiționalității
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 640/2014 z 11. marca 2014 , ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 1306/2013 vzhľadom
    na integrovaný administratívny a kontrolný systém, podmienky zamietnutia alebo
    odňatia platieb a administratívne sankcie uplatniteľné na priame platby, podporné
    nariadenia na rozvoj vidieka a krížové plnenie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) št. 640/2014 z dne 11. marca 2014 o dopolnitvi
    Uredbe (EU) št. 1306/2013 Evropskega parlamenta in Sveta glede integriranega
    administrativnega in kontrolnega sistema, pogojev za zavrnitev ali ukinitev plačil
    in za upravne kazni, ki se uporabljajo za neposredna plačila, podporo za razvoj
    podeželja in navzkrižno skladnost
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) n °640/2014 de la Comisión, de 11 de marzo de
    2014 , por el que se completa el Reglamento (UE) n °1306/2013 del Parlamento
    Europeo y del Consejo en lo que respecta al sistema integrado de gestión y control
    y a las condiciones sobre la denegación o retirada de los pagos y sobre las sanciones
    administrativas aplicables a los pagos directos, a la ayuda al desarrollo rural
    y a la condicionalidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) nr 640/2014 av den 11 mars 2014
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 1306/2013
    vad gäller det integrerade administrations- och kontrollsystemet och villkor
    för avslag på eller indragning av betalningar samt administrativa sanktioner
    som gäller för direktstöd, landsbygdsutvecklingsstöd och tvärvillkor
  type: main
