- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1048/83 of 29 April 1983 fixing the rates
    of the refunds applicable from 1 May 1983 to eggs and egg yolks exported in the
    form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1048/83 de la Commission, du 29 avril 1983, fixant les
    taux des restitutions applicables, à compter du 1er mai 1983, aux oeufs et aux
    jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1048/83 der Kommission vom 29. April 1983 zur Festsetzung
    der ab 1. Mai 1983 geltenden Erstattungssätze bei der Ausfuhr von Eiern und Eigelb
    in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1048/83 af 29. april 1983 om fastsættelse
    af de restitutionssatser, der fra den 1. maj 1983 skal anvendes for æg og æggeblommer,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
