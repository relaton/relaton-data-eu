- language: en
  script: Latn
  content: Council Regulation (EEC) No 3029/79 of 20 December 1979 fixing for 1980
    Community quantitative export quotas for certain types of copper ash and residues
    and for certain types of copper, aluminium and lead waste and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3029/79 du Conseil, du 20 décembre 1979, fixant pour
    1980 des contingents quantitatifs communautaires à l' exportation pour certaines
    cendres et certains résidus de cuivre ainsi que pour certains déchets et débris
    de cuivre, d' aluminium et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3029/79 des Rates vom 20. Dezember 1979 zur Festsetzung
    der mengenmäßigen Ausfuhrkontingente der Gemeinschaft für bestimmte Aschen
    und Rückstände von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten
    Schrott aus Kupfer, Aluminium und Blei für 1980
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3029/79 af 20. december 1979 om fastsættelse
    af kvantitative fællesskabskontingenter for 1980 for udførsel af visse typer
    aske og visse restprodukter af kobber samt visse former for affald og skrot af
    kobber, aluminium og bly
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3029/79 του Συμβουλίου,
    της 20ής Δεκεμβρίου 1979, με τον οποίο καθορίζονται
    για το 1980 οι κοινοτικές ποσοστώσεις εξαγωγής
    για ορισμένα είδη τέφρας και ορισμένα κατάλοιπα
    χαλκού καθώς και για ορισμένα απόβλητα και
    υπολείμματα χαλκού, αλουμινίου και μολύβδου
  type: main
