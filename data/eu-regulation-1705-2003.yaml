title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1705/2003 of 26 September 2003 determining
    the extent to which applications lodged in September 2003 for import licences
    for certain egg sector products and poultrymeat pursuant to Regulations (EC) No
    1474/95 and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1705/2003 de la Commission du 26 septembre 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2003 pour certains produits du secteur des œufs et de la viande
    de volaille dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1705/2003 der Kommission vom 26. September 2003 über
    die Festsetzung des Umfangs, in dem die im September 2003 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Produkte des Sektors Eier und Geflügelfleisch
    entsprechend den Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt
    werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1705/2003 af 26. september 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i september
    2003 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1705/2003 της Επιτροπής,
    της 26ης Σεπτεμβρίου 2003, για καθορισμό ορίων
    εντός των οποίων δύναται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Σεπτέμβριο
    του 2003 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα των αυγών και του κρέατος
    πουλερικών στα πλαίσια των κανονισμών (ΕΚ)
    αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1705/2003, annettu 26 päivänä syyskuuta 2003,
    määrättyyn järjestelmään liittyvien syyskuussa 2003 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1705/2003 della Commissione, del 26 settembre 2003,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di settembre 2003 per taluni prodotti del settore
    delle uova e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n.
    1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1705/2003 van de Commissie van 26 september 2003 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sectoren eieren en slachtpluimvee,
    die in september 2003 worden ingediend op grond van de Verordeningen (EG) nr.
    1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1705/2003 da Comissão, de 26 de Setembro de 2003,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Setembro de 2003 ao abrigo dos Regulamentos (CE) n.° 1474/95 e (CE) n.° 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1705/2003 de la Comisión, de 26 de septiembre de 2003,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de los huevos y de
    la carne de aves de corral presentadas en el mes de septiembre de 2003 al amparo
    de los Reglamentos (CE) n° 1474/95 y (CE) n° 1251/96
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1705/2003 av den 26 september 2003 om
    fastställande av i vilken utsträckning de ansökningar om importlicens för
    vissa äggprodukter samt fjäderfäkött som ges in under september 2003 inom
    ramen för förordningarna (EG) nr 1474/95 och (EG) nr 1251/96 kan godtas
