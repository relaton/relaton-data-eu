title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1241/97 of 30 June 1997 extending Regulation
    (EC) No 1200/95 laying down certain transitional arrangements to determine the
    agricultural component for imports of the goods listed in Table 1 of Annex B to
    Council Regulation (EC) No 3448/93 in order to implement the obligations deriving
    from the Agricultural Agreement concluded during the Uruguay Round of multilateral
    trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1241/97 de la Commission du 30 juin 1997 prorogeant
    le règlement (CE) nº 1200/95 prévoyant certaines mesures transitoires pour
    déterminer l'élément agricole à l'importation des marchandises énumérées
    au tableau 1 de l'annexe B du règlement (CE) nº 3448/93 du Conseil afin de mettre
    en oeuvre les obligations découlant de l'accord sur l'agriculture conclu dans
    le cadre des négociations commerciales multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1241/97 der Kommission vom 30. Juni 1997 zur Verlängerung
    der Verordnung (EG) Nr. 1200/95 über bestimmte Übergangsmaßnahmen zur Feststellung
    des Agrarteilbetrags bei der Einfuhr der in Tabelle 1 von Anhang B der Verordnung
    (EG) Nr. 3448/93 des Rates aufgeführten Waren zur Anwendung der im Rahmen der
    multilateralen Handelsverhandlungen der Uruguay-Runde abgeschlossenen Agrarübereinkünfte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1241/97 af 30. juni 1997 om forlængelse
    af gyldighedsperioden for forordning (EF) nr. 1200/95 om visse overgangsforanstaltninger
    for at bestemme landbrugselementet ved indførsel af varer som opregnet i tabel
    1 i bilag B til Rådets forordning (EF) nr. 3448/93 for at opfylde forpligtelserne
    i den aftale om landbrug, der blev indgået under de multilaterale handelsforhandlinger
    i Uruguay-rundens regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1241/97 της Επιτροπής
    της 30ής Ιουνίου 1997 για την παράταση της ισχύος
    του κανονισμού (ΕΚ) αριθ. 1200/95 περί λήψεως ειδικών
    μεταβατικών μέτρων προς προσδιορισμό της γεωργικής
    παραμέτρου κατά την εισαγωγή των εμπορευμάτων
    που εμφαίνονται στον πίνακα 1 του παραρτήματος
    Β του κανονισμού (ΕΚ) αριθ. 3448/93 του Συμβουλίου
    ώστε να ενεργοποιηθούν οι υποχρεώσεις που
    απορρέουν από τη συμφωνία η οποία αφορά το
    γεωργικό τομέα και η οποία συνήφθη στο πλαίσιο
    των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1241/97, annettu 30 päivänä kesäkuuta 1997,
    tietyistä siirtymätoimenpiteistä maatalousosan määrittämiseksi neuvoston
    asetuksen (EY) N:o 3448/93 liitteessä B olevassa taulukossa 1 lueteltujen tavaroiden
    tuonnissa Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdystä
    maataloutta koskevasta sopimuksesta johtuvien velvoitteiden täytäntöönpanemiseksi
    annetun asetuksen (EY) N:o 1200/95 voimassaoloajan jatkamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1241/97 della Commissione del 30 giugno 1997 che proroga
    il regolamento (CE) n. 1200/95 che prevede alcune misure transitorie intese a
    determinare l'elemento agricolo per l'importazione delle merci di cui alla tabella
    1 dell'allegato B del regolamento (CE) n. 3448/93 del Consiglio per l'attuazione
    degli obblighi che discendono dall'accordo sull'agricoltura concluso nel quadro
    dei negoziati commerciali multilaterali dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1241/97 van de Commissie van 30 juni 1997 tot verlenging
    van Verordening (EG) nr. 1200/95 houdende bepaalde overgangsmaatregelen voor het
    bepalen van het agrarisch element bij invoer van de in tabel 1 van bijlage B bij
    Verordening (EG) nr. 3448/93 van de Raad vermelde goederen, ter nakoming van de
    verplichtingen die voortvloeien uit de Landbouwovereenkomst in het kader van de
    multilaterale handelsbesprekingen van de Uruguay-ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1241/97 da Comissão de 30 de Junho de 1997 que prorroga
    o período de aplicação do Regulamento (CE) nº 1200/95 que prevê algumas medidas
    transitórias para determinar o elemento agrícola aplicado à importação das
    mercadorias enumeradas no quadro 1 do anexo B do Regulamento (CE) nº 3448/93
    do Conselho, a fim de pôr em execução as obrigações decorrentes do Acordo
    sobre a Agricultura concluído no âmbito das negociações comerciais multilaterais
    do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1241/97 de la Comisión de 30 de junio de 1997 por
    el que se prorroga el Reglamento (CE) nº 1200/95 sobre diversas medidas transitorias
    para determinar el elemento agrícola en la importación de las mercancías contempladas
    en el cuadro 1 del Anexo B del Reglamento (CE) nº 3448/93 del Consejo en aplicación
    de las obligaciones que se desprenden del Acuerdo de agricultura celebrado en
    el marco de las negociaciones comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1241/97 av den 30 juni 1997 om förlängning
    av giltigheten för förordning (EG) nr 1200/95 om vissa övergångsåtgärder
    för fastställande av jordbruksdelen vid import av produkter som omfattas av
    tabell 1 till bilaga B till förordning (EG) nr 3448/93 för att uppfylla de förpliktelser
    som följer av jordbruksavtalet vilket slöts inom ramen för de multilaterala
    handelsförhandlingarna i Uruguayrundan
  type: main
