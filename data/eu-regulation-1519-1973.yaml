id: EURegulation15191973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1519/73 of the Commission of 7 June 1973 re-establishing
    Common Customs Tariff duties on building board of wood pulp or of vegetable fibre,
    whether or not bonded with natural or artificial resins or with similar binders,
    falling within heading No 48.09, originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1519/73 de la Commission, du 7 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux plaques pour constructions, en pâte à papier, en bois défibrés ou en végétaux
    divers défibrés, même agglomérés avec des résines naturelles ou artificielles
    ou d' autres liants similaires, de la position tarifaire 48.09, originaires du
    Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1519/73 der Kommission vom 7. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Bauplatten aus Papierhalbstoff,
    aus Fasern von Holz oder von anderen pflanzlichen Stoffen, auch mit natürlichen
    oder künstlichen Harzen oder ähnlichen Bindemitteln hergestellt, der Tarifnummer
    48.09, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 2762/72
    des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1519/73 af 7. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for byggeplader af papirmasse, træfibre
    eller andre vegetabilske fibre, også med indhold af naturharpiks, kunstharpiks
    eller lignende som bindemiddel under position 48.09 som har oprindelse i Brasilien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1519/73 della Commissione, del 7 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    lastre per costruzioni, di pasta di carta, di legno sfibrato o di vegetali diversi
    sfibrati, anche agglomerati con resine naturali o artificiali o con altri leganti
    simili della voce doganale n. 48.09 originari del Brasile beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1519/73 van de Commissie van 7 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op platen voor constructiedoeleinden, van papierstof, van houtvezels
    of van andere plantaardige vezels, ook indien gebonden met natuurlijke hars, met
    kunsthars of met andere dergelijke bindmiddelen van post 48.09, van oorsprong
    uit Brazilië ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad
    van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
