title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2209/90 of 27 July 1990 derogating from the
    definition of "originating products" to take account of the special situation
    of Saint-Pierre and Miquelon with regard to certain fisheries products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2209/90 du Conseil du 27 juillet 1990 portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière de Saint-Pierre-et-Miquelon en ce qui concerne certains
    produits de la pêche
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2209/90 DES RATES vom 27. Juli 1990 zur Abweichung
    von der Begriffsbestimmung fuer Ursprungswaren zur Beruecksichtigung der besonderen
    Lage von Saint-Pierre-et-Miquelon hinsichtlich bestimmter Fischereierzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2209/90 af 27. juli 1990 om undtagelse fra
    definitionen af "varer med oprindelsesstatus" for at tage hensyn til Saint-Pierre-
    et-Miquelons særlige situation for så vidt angår visse fiskerivarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2209/90 του Συμβουλίου
    της 27ης Ιουλίου 1990 για την αναγνώριση παρέκκλισης
    από τον ορισμό της έννοιας " καταγόμενα προϊόντα
    " ή " προϊόντα καταγωγής " προκειμένου να ληφθεί
    υπόψη η ειδική κατάσταση του Saint - Pierre - et - Miquelon
    όσον αφορά ορισμένα προϊόντα αλιείας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2209/90 DEL CONSIGLIO del 27 luglio 1990 recante deroga
    alla definizione di "prodotti originari " per la particolare situazione di Saint-Pierre
    e Miquelon in ordine a taluni prodotti della pesca
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2209/90 VAN DE RAAD van 27 juli 1990 houdende afwijking
    van de definitie van het begrip "produkten van oorsprong" in verband met de bijzondere
    situatie van Saint-Pierre en Miquelon ten aanzien van bepaalde visserijprodukten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2209/90 DO CONSELHO de 27 de Julho de 1990 que derroga
    a definiçao da noçao de produtos originarios para ter em conta a situaçao especial
    de Sao Pedro e Miquelon em relaçao a determinados produtos da pesca
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2209/90 DEL CONSEJO de 27 de julio de 1990 por el que
    se establece una excepcion a la definicion de la nocion de productos originarios
    para tener en cuenta la situacion especial de San Pedro y Miquelon en lo que se
    refiere a determinados productos de la pesca
  type: main
