title:
- language: en
  script: Latn
  content: Council Directive 96/43/EC of 26 June 1996 amending and consolidating Directive
    85/73/EEC in order to ensure financing of veterinary inspections and controls
    on live animals and certain animal products and amending Directives 90/675/EEC
    and 91/496/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 96/43/CE du Conseil du 26 juin 1996 modifiant et codifiant la
    directive 85/73/CEE pour assurer le financement des inspections et des contrôles
    vétérinaires des animaux vivants et de certains produits animaux, et modifiant
    les directives 90/675/CEE et 91/496/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/43/EG des Rates vom 26. Juni 1996 zur Änderung und Kodifizierung
    der Richtlinie 85/73/EWG zur Sicherstellung der Finanzierung der veterinär- und
    hygienerechtlichen Kontrollen von lebenden Tieren und bestimmten tierischen Erzeugnissen
    sowie zur Änderung der Richtlinien 90/675/EWG und 91/496/EWG
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/43/EO на Съвета от 26 юни 1996 година
    за изменение и консолидиране на Директива
    85/73/ЕИО с оглед осигуряване финансирането на
    ветеринарните инспекции и проверки на живи
    животни и някои животински продукти и за изменение
    на Директиви 90/675/ЕИО и 91/496/ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/43/ES ze dne 26. června 1996, kterou se mění a kodifikuje
    směrnice 85/73/EHS tak, aby se zajistilo financování veterinárních prohlídek
    a kontrol živých zvířat a některých živočišných produktů, a kterou
    se mění směrnice 90/675/EHS a 91/496/EHS
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/43/EF af 26. juni 1996 om ændring og kodifikation
    af direktiv 85/73/EØF med henblik på finansiering af veterinærundersøgelse
    og -kontrol af levende dyr og visse animalske produkter og om ændring af direktiv
    90/675/EØF og 91/496/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/43/ΕΚ του Συμβουλίου της 26ης Ιουνίου
    1996 για τροποποίηση και κωδικοποίηση της οδηγίας
    85/73/ΕΟΚ για τη χρηματοδότηση των υγειονομικών
    επιθεωρήσεων και ελέγχων των ζώντων ζώων και
    ορισμένων ζωικών προϊόντων και για τροποποίηση
    των οδηγιών 90/675/ΕΟΚ και 91/496/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/43/EÜ, 26. juuni 1996, millega muudetakse ja konsolideeritakse
    direktiivi 85/73/EMÜ veterinaarinspektsiooni ja elusloomade ja teatavate loomsete
    saaduste kontrolli finantseerimiseks ning direktiivide 90/675/EMÜ ja 91/496/EMÜ
    muutmiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/43/EY, annettu 26 päivänä kesäkuuta 1996, direktiivin
    85/73/ETY muuttamisesta ja kodifioinnista elävien eläinten ja tiettyjen eläintuotteiden
    eläinlääkärintarkastusten ja -valvonnan rahoittamisen varmistamiseksi sekä
    direktiivien 90/675/ETY ja 91/496/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/43/EGK irányelve (1996. június 26.) a 85/73/EGK irányelvnek
    az élő állatok s egyes állati termékek állat-egészségügyi vizsgálata
    és ellenőrzése finanszírozásának biztosítása céljából történő módosításáról
    és egységes szerkezetbe foglalásáról, valamint a 90/675/EGK és a 91/496/EGK
    irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/43/CE del Consiglio del 26 giugno 1996 che modifica e codifica
    la direttiva 85/73/CEE per assicurare il finanziamento delle ispezioni e dei controlli
    veterinari degli animali vivi e di taluni prodotti di origine animale, e che modifica
    le direttive 90/675/CEE e 91/496/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/43/EK, (1996. gada 26. jūnijs), kas labo un konsolidē
    Direktīvu 85/73/EEK, lai nodrošinātu dzīvu dzīvnieku un atsevišķu dzīvnieku
    produktu veterinārās pārbaudes un kontroles finansēšanu, un labo Direktīvas
    90/675/EEK un 91/496/EEK
  type: main
- language: lt
  script: Latn
  content: 1996 m. birželio 26 d. Tarybos direktyva 96/43/EB, iš dalies keičianti
    ir konsoliduojanti Direktyvą 85/73/EEB, kad būtų užtikrintas gyvų gyvūnų
    bei kai kurių gyvūninių produktų veterinarinio patikrinimo ir kontrolės finansavimas,
    ir iš dalies keičianti Direktyvas 90/675/EEB bei 91/496/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/43/KE tas-26 ta’ Ġunju 1996 li temenda u
    tikkonsolida d-Direttiva 85/73/KEE sabiex tassigura l-finanzjament ta’ l-ispezzjonijiet
    veterinarji u l-kontrolli fuq l-annimali ħajjin u fuq ċerti prodotti ta’ l-annimali
    u li temenda d-Direttivi 90/675/KEE u 91/496/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/43/EG van de Raad van 26 juni 1996 tot wijziging en codificering
    van Richtlijn 85/73/EEG om de financiering van de keuringen en veterinaire controles
    van levende dieren en bepaalde dierlijke produkten te garanderen en tot wijziging
    van de Richtlijnen 90/675/EEG en 91/496/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/43/WE z dnia 26 czerwca 1996 r. zmieniająca i konsolidująca
    dyrektywę 85/73/EWG w celu zapewnienia finansowania inspekcji i kontroli weterynaryjnych
    żywych zwierząt i niektórych produktów zwierzęcych oraz zmieniająca dyrektywy
    90/675/EWG i 91/496/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 96/43/CE do Conselho de 26 de Junho de 1996 que altera e codifica
    a Directiva 85/73/CEE para garantir o financiamento das inspecções e controlos
    veterinários de animais vivos e de certos produtos de origem animal e que altera
    as Directivas 90/675/CEE e 91/496/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 96/43/CE a Consiliului din 26 iunie 1996 de modificare și codificare
    a Directivei 85/73/CEE privind asigurarea finanțării inspecțiilor și controalelor
    veterinare ale animalelor vii și ale anumitor produse animaliere și de modificare
    a Directivei 90/675/CEE și a Directivei 91/496/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/43/ES z 26. júna 1996, ktorá mení, dopĺňa a konsoliduje
    smernicu 85/73/EHS s cieľom zabezpečiť financovanie veterinárnych inšpekcií
    a kontrol živých zvierat a určitých živočíšnych výrobkov a mení a dopĺňa
    smernice 90/675/EHS a 91/496/EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/43/ES z dne 26. junija 1996 o spremembi in pripravi
    prečiščenega besedila Direktive 85/73/EGS z namenom zagotavljanja financiranja
    veterinarskih pregledov in kontrol nad živimi živalmi in nekaterimi živalskimi
    proizvodi, in spremembi direktiv 90/675/EGS in 91/496/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 96/43/CE del Consejo de 26 de junio de 1996 por la que se modifica
    y se codifica la Directiva 85/73/CEE con el fin de establecer la financiación
    de las inspecciones y controles veterinarios de animales vivos y ciertos productos
    de origen animal y por la que se modifican las Directivas 90/675/CEE y 91/496/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/43/EG av den 26 juni 1996 om ändring och kodifiering
    av direktiv 85/73/EEG om finansieringen av veterinära besiktningar och kontroller
    av levande djur och vissa animaliska produkter och om ändring av direktiv 90/675/EEG
    och 91/496/EEG
