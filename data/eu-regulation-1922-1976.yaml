title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1922/76 of 2 August 1976 determining for
    the marketing year 1976/77 the variety of long grain rice representative of Community
    production, the difference in value between this variety and the variety of round
    grain rice corresponding to the standard quality and the threshold price for long
    grain husked rice and for milled rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1922/76 de la Commission, du 2 août 1976, fixant,
    pour la campagne 1976/1977, la variété de riz à grains longs représentative
    de la production communautaire, la différence de valeur entre celle-ci et la
    variété de riz à grains ronds correspondant à la qualité type, le prix de
    seuil du riz décortiqué à grains longs et les prix de seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1922/76 der Kommission vom 2. August 1976 zur Festsetzung
    der für die Gemeinschaftsproduktion repräsentativen langkörnigen Reissorte,
    des Wertunterschieds zwischen dieser Sorte und der der Standardqualität entsprechenden
    rundkörnigen Reissorte, des Schwellenpreises für geschälten langkörnigen Reis
    und der Schwellenpreise für vollständig geschliffenen Reis für das Wirtschaftsjahr
    1976/1977
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1922/76 af 2. august 1976 om fastsættelse
    for høståret 1976/1977 af den langkornede rissort, der er repræsentativ for
    produktionen i Fælleskabet, af værdiforskellen mellem denne sort og den rundkornede
    rissort, der svarer til standardkvaliteten, af tærskelprisen for afskallet langkornet
    ris og tærskelprisen for sleben ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1922/76 della Commissione, del 2 agosto 1976, che
    fissa, per la campagna 1976/1977, la varietà di riso a grani lunghi rappresentativa
    della produzione comunitaria, la differenza di valore tra quest'ultima e la varietà
    di riso a grani tondi corrispondente alla qualità tipo, il prezzo d'entrata del
    riso semi-greggio a grani lunghi ed i prezzi d'entrata del riso lavorato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1922/76 van de Commissie van 2 augustus 1976 tot
    vaststelling voor het verkoopseizoen 1976/1977 van de variëteit langkorrelige
    rijst die representatief is voor de communautaire produktie, het waardeverschil
    tussen deze variëteit en de variëteit rondkorrelige rijst die met de standaardkwaliteit
    overeenkomt, de drempelprijs voor langkorrelige gedopte rijst en de drempelprijzen
    voor volwitte rijst
  type: main
