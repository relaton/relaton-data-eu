    και του Συμβουλίου, της 13ης Ιουνίου 2024, σχετικά
    με τις εσωτερικές αγορές ανανεώσιμου αερίου,
    φυσικού αερίου και υδρογόνου, για την τροποποίηση
    των κανονισμών (ΕΕ) αριθ. 1227/2011, (ΕΕ) 2017/1938, (ΕΕ)
    2019/942 και (ΕΕ) 2022/869 και της απόφασης (ΕΕ) 2017/684
    και την κατάργηση του κανονισμού (ΕΚ) αριθ.
    715/2009
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2024/1789, 13. juuni 2024,
    mis käsitleb taastuvatest energiaallikatest toodetud gaasi, maagaasi ja vesiniku
    siseturge ning millega muudetakse määruseid (EL) nr 1227/2011, (EL) 2017/1938,
    (EL) 2019/942 ja (EL) 2022/869 ja otsust (EL) 2017/684 ja tunnistatakse kehtetuks
    määrus (EÜ) nr 715/2009 (uuesti sõnastatud)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2024/1789, annettu 13 päivänä
    kesäkuuta 2024, uusiutuvan kaasun, maakaasun ja vedyn sisämarkkinoista, asetusten
    (EU) N:o 1227/2011, (EU) 2017/1938, (EU) 2019/942 ja (EU) 2022/869 ja päätöksen
    (EU) 2017/684 muuttamisesta sekä asetuksen (EY) N:o 715/2009 kumoamisesta (uudelleenlaadittu)
  type: main
- language: ga
  script: Latn
