title:
- language: en
  script: Latn
  content: Regulation (EU) 2024/1789 of the European Parliament and of the Council
    of 13 June 2024 on the internal markets for renewable gas, natural gas and hydrogen,
    amending Regulations (EU) No 1227/2011, (EU) 2017/1938, (EU) 2019/942 and (EU)
    2022/869 and Decision (EU) 2017/684 and repealing Regulation (EC) No 715/2009
    (recast)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2024/1789 du Parlement européen et du Conseil du 13 juin
    2024 sur les marchés intérieurs du gaz renouvelable, du gaz naturel et de l’hydrogène,
    modifiant les règlements (UE) n° 1227/2011, (UE) 2017/1938, (UE) 2019/942 et
    (UE) 2022/869 et la décision (UE) 2017/684 et abrogeant le règlement (CE) n°
    715/2009 (refonte)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2024/1789 des Europäischen Parlaments und des Rates vom
    13. Juni 2024 über die Binnenmärkte für erneuerbares Gas, Erdgas sowie Wasserstoff,
    zur Änderung der Verordnungen (EU) Nr. 1227/2011, (EU) 2017/1938, (EU) 2019/942
    und (EU) 2022/869 sowie des Beschlusses (EU) 2017/684 und zur Aufhebung der Verordnung
    (EG) Nr. 715/2009 (Neufassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2024/1789 на Европейския парламент
    и на Съвета от 13 юни 2024 година относно вътрешните
    пазари на газ от възобновяеми източници, природен
    газ и водород, за изменение на регламенти (ЕС)
    № 1227/2011, (ЕС) 2017/1938, (ЕС) 2019/942 и (ЕС) 2022/869 и на Решение
    (ЕС) 2017/684 и за отмяна на Регламент (ЕО) № 715/2009
    (преработен текст)
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2024/1789 ze dne 13. června
    2024 o vnitřním trhu s plynem z obnovitelných zdrojů, se zemním plynem a
    s vodíkem, o změně nařízení (EU) č. 1227/2011, (EU) 2017/1938, (EU) 2019/942
    a (EU) 2022/869 a rozhodnutí (EU) 2017/684 a o zrušení nařízení (ES) č.
    715/2009 (přepracované znění)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2024/1789 af 13. juni 2024
    om de indre markeder for vedvarende gas, naturgas og brint, om ændring af forordning
    (EU) nr. 1227/2011, (EU) 2017/1938, (EU) 2019/942 og (EU) 2022/869 og afgørelse
    (EU) 2017/684 og om ophævelse af forordning (EF) nr. 715/2009 (omarbejdning)
  type: main
- language: el
  script: Grek
