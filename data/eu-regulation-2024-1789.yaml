    (UE) 2017/1938, (UE) 2019/942 și (UE) 2022/869 și a Deciziei (UE) 2017/684 și
    de abrogare a Regulamentului (CE) nr. 715/2009 (reformare)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2024/1789 z 13. júna 2024
