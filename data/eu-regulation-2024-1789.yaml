    an 13 Meitheamh 2024 maidir leis na margaí inmheánacha do ghás in-athnuaite,
    gás nádúrtha agus hidrigine, lena leasaítear Rialacháin (AE) Uimh. 1227/2011,
    (AE) 2017/1938 agus (AE) 2019/942 agus (AE) 2022/869 agus Cinneadh (AE) 2017/684
    agus lena n-aisghairtear Rialachán (CE) Uimh. 715/2009 (athmhúnlú)
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2024/1789 Europskog parlamenta i Vijeća od 13. lipnja 2024.
    o unutarnjem tržištu plina iz obnovljivih izvora, prirodnog plina i vodika,
    o izmjeni uredbi (EU) br.1227/2011, (EU) 2017/1938, (EU) 2019/942 i (EU) 2022/869
    i Odluke (EU) 2017/684 te o stavljanju izvan snage Uredbe (EZ) br. 715/2009 (preinaka)
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2024/1789 rendelete (2024. június
    13.) a megújuló gáz, a földgáz és a hidrogén belső piacairól, az (EU)
    1227/2011, (EU) 2017/1938, (EU) 2019/942 és (EU) 2022/869 rendelet és az (EU)
    2017/684 határozat módosításáról, valamint a 715/2009/EK rendelet hatályon
    kívül helyezéséről (átdolgozás)
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2024/1789 del Parlamento europeo e del Consiglio, del
