    (UE) 2019/942 e (UE) 2022/869 e a Decisão (UE) 2017/684 e que revoga o Regulamento
    (CE) n.° 715/2009 (reformulação)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2024/1789 al Parlamentului European și al Consiliului
