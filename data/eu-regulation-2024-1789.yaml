    2022/869 u d-Deċiżjoni (UE) 2017/684 u li jħassar ir-Regolament (KE) Nru 715/2009
    (riformulazzjoni)
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2024/1789 van het Europees Parlement en de Raad van 13
    juni 2024 inzake de interne markten voor hernieuwbaar gas, aardgas en waterstof,
    tot wijziging van de Verordeningen (EU) nr. 1227/2011, (EU) 2017/1938, (EU) 2019/942
    en (EU) 2022/869 en Besluit (EU) 2017/684, en tot intrekking van Verordening (EG)
    nr. 715/2009 (herschikking)
  type: main
- language: pl
  script: Latn
