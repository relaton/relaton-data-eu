id: EURegulation4641978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 464/78 of 6 March 1978 re-establishing the
    levying of the customs duties on plaints and similar products of plaiting materials,
    for all uses, etc., falling within heading No ex 46.02 originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 464/78 de la Commission, du 6 mars 1978, portant rétablissement
    de la perception des droits de douane applicables aux tresses et articles similaires
    en matières à tresser, pour tous usages, etc., de la position tarifaire EX 46.02,
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 464/78 der Kommission vom 6. März 1978 zur Wiedereinführung
    des Zollsatzes für Geflechte und ähnliche Waren aus Flechtstoffen, zu allen
    Verwendungszwecken usw., der Tarifnummer ex 46.02, mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 464/78 af 6. marts 1978 om genindførelse
    af opkrævning af toldafgifter for flettematerialer i form af lidser eller lignende,
    også samlede til bånd, etc., under position ex 46.02, som har oprindelse i Sydkorea
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 464/78 della Commissione, del 6 marzo 1978, che ripristina
    la riscossione dei dazi doganali applicabili alle trecce e manufatti simili, di
    materiali da intreccio, per qualsiasi uso, ecc., della voce doganale ex 46.02,
    originari della Corea del Sud beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 464/78 van de Commissie van 6 maart 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op vlechten
    en dergelijke artikelen, van vlechtstoffen, ongeacht het gebruik daarvan, van
    post ex 46.02, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
