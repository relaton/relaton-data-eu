title:
- language: en
  script: Latn
  content: '82/184/EEC: Commission Decision of 26 February 1982 establishing that
    the apparatus described as ''Cray- Computer System, model Cray-1'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/184/CEE: Décision de la Commission, du 26 février 1982, constatant
    que l''importation de l''appareil dénommé "Cray - Computer System, model Cray-1"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/184/EWG: Entscheidung der Kommission vom 26. Februar 1982, mit der
    festgestellt wird, daß das Gerät ,,CRAY- Computer System, model Cray-1" nicht
    unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/184/EØF: Kommissionens beslutning af 26. februar 1982 om fastslåelse
    af, at indførsel af apparatet "CRAY - Computer System, model Cray-1" ikke kan
    ske med fritagelse for told efter den fælles toldtarif'
  type: main
