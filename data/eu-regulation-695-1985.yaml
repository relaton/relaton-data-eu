title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 695/85 of 15 March 1985 re-establishing
    the levying of customs duties on certain yarn of synthetic textile fibres (continuous),
    products of category 41 (code 40.0410), originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 695/85 de la Commission du 15 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à certains fils de fibres textiles
    synthétiques continues de la catégorie 41 (code 40.0410) originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 695/85 der Kommission vom 15. März 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte synthetische Spinnfäden der Warenkategorie
    41 (Kennziffer 40.0410) mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 695/85 af 15. marts 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte garn af endeløse syntetiske fibre
    under varekategori nr. 41 (kode 40.0410), som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 695/85 της Επιτροπής
    της 15ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής των τελωνειακών δασμών για ορισμένα
    νήματα εκ συνθετικών υφαντικών ινών συνεχών,
    της κατηγορίας προϊόντων 41 (κωδικός 40.0410) καταγωγής
    Βραζιλίας, δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 695/85 della Commissione del 15 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni filati di fibre tessili
    sintetiche continue, della categoria di prodotti n. 41 (codice 40.0410), originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 695/85 van de Commissie van 15 maart 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    garens van synthetische vezels van de categorie van produkten nr. 41 (codenummer
    40.0410), van oorsprong uit Brazilië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
