    réinstaurant le droit du tarif douanier commun à l'importation de roses à petite
    fleur originaires d'Israël, et le règlement (CE) n° 80/97 rétablissant le
    droit de douane préférentiel à l'importation de roses à petite fleur originaires
    d'Israël
