  content: COMMISSION REGULATION (EC) No 1089/97 of 16 June 1997 repealing Regulations
    (EC) No 2188/96 suspending the preferential customs duties and re-establishing
    the Common Customs Tariff duty on imports of small-flowered roses originating
    in Israel and (EC) No 80/97 re-establishing the preferential customs duty on imports
    of small-flowered roses originating in Israel
  type: main
- language: fr
  script: Latn
