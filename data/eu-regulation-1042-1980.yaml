  content: Commission Regulation (EEC) No 1042/80 of 25 April 1980 determining the
    amounts of the variable components and additional duties applicable from 1 May
    to 31 July 1980 inclusive, on the importation into the Community of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1042/80 de la Commission, du 25 avril 1980, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    la période du 1er mai au 31 juillet 1980 inclus, à l'importation dans la Communauté
    des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1042/80 der Kommission vom 25. April 1980 zur Festsetzung
