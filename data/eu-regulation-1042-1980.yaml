    unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren in die Gemeinschaft anzuwendenden
    beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1042/80 af 25. april 1980 om fastsættelse
