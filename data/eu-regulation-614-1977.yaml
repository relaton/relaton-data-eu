title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 614/77 of 23 March 1977 re-establishing
    the levying of customs duties on cotton yarn, put up for retail sale, falling
    within heading No 55.06, originating in Yugoslavia to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 614/77 de la Commission, du 23 mars 1977, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton conditionnés pour la vente au détail, de la position tarifaire 55.06 originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 614/77 der Kommission vom 23. März 1977 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne in Aufmachungen für den Einzelverkauf
    der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 614/77 af 23. marts 1977 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, i detailsalgsoplægninger,
    under position 55.06, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 614/77 della Commissione, del 23 marzo 1977, che ripristina
    la riscossione dei dazi doganali applicabili ai filati di cotone preparati per
    la vendita al minuto, della voce doganale 55.06, originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie, previsti dal regolamento (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 614/77 van de Commissie van 23 maart 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op garens van
    katoen, gereed voor de verkoop in het klein, van post 55.06, van oorsprong uit
    Joegoslavië, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3022/76 van de Raad
  type: main
