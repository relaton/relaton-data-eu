    em suplementos alimentares à base de arroz fermentado com levedura vermelha Monascus
    purpureus
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2019/1901 al Comisiei din 7 noiembrie 2019 de modificare
