title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2019/1901 of 7 November 2019 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of citrinin in food supplements based
    on rice fermented with red yeast Monascus purpureus
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/1901 de la Commission du 7 novembre 2019 modifiant
    le règlement (CE) no 1881/2006 en ce qui concerne les teneurs maximales en citrinine
    dans les compléments alimentaires à base de levure de riz rouge fermentée Monascus
    purpureus
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2019/1901 der Kommission vom 7. November 2019 zur Änderung
    der Verordnung (EG) Nr. 1881/2006 hinsichtlich der Höchstgehalte an Citrinin
    in Nahrungsergänzungsmitteln auf Basis von Reis, der durch den Schimmelpilz Monascus
    purpureus fermentiert wurde
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2019/1901 на Комисията от 7 ноември
    2019 година за изменение на Регламент (ЕО) № 1881/2006
    по отношение на максимално допустимите количества
    цитринин в хранителни добавки на основата
    на ориз, подложен на ферментация с червени
    дрожди Monascus purpureus
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2019/1901 ze dne 7. listopadu 2019, kterým se
    mění nařízení (ES) č. 1881/2006, pokud jde o maximální limity citrininu
    v doplňcích stravy na bázi rýže fermentované červenými kvasnicemi Monascus
    purpureus
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2019/1901 af 7. november 2019 om ændring
    af forordning (EF) nr. 1881/2006 for så vidt angår grænseværdier for citrinin
    i kosttilskud baseret på ris fermenteret med rød gær (Monascus purpureus)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2019/1901 της Επιτροπής της
    7ης Νοεμβρίου 2019 για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1881/2006 όσον αφορά τα μέγιστα επιτρεπτά
    επίπεδα κιτρινίνης στα πρόσθετα τροφίμων με
    βάση το ρύζι που έχει υποστεί ζύμωση με τον
    ερυθρό μύκητα Monascus purpureus
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) 2019/1901, 7. november 2019, millega muudetakse
    määrust (EÜ) nr 1881/2006 seoses tsitriniini piirnormidega punase pärmi Monascus
    purpureus’ega kääritatud riisil põhinevates toidulisandites
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2019/1901, annettu 7 päivänä marraskuuta 2019,
    asetuksen (EY) N:o 1881/2006 muuttamisesta siltä osin kuin kyse on sitriniinin
    enimmäismääristä punahiivalla (Monascus purpureus) fermentoituun riisiin perustuvissa
    ravintolisissä
  type: main
- language: hr
  script: Latn
