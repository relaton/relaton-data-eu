    citrinină în suplimentele alimentare pe bază de orez fermentat cu drojdie roșie
    Monascus purpureus
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2019/1901 zo 7. novembra 2019, ktorým sa mení
