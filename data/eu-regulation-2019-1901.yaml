    ħamra Monascus purpureus
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2019/1901 van de Commissie van 7 november 2019 tot wijziging
    van Verordening (EG) nr. 1881/2006 wat betreft de maximumgehalten aan citrinine
    in voedingssupplementen op basis van met rode gist Monascus purpureus gefermenteerde
    rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2019/1901 z dnia 7 listopada 2019 r. zmieniające
