    της μεταβλητής πριμοδοτήσεως κατά τη σφαγή
    των προβατοειδών για τη Μεγάλη Ερετανία, και
    των ποσών προς είσπραξη για τα προϊόντα που
    εξάγονται από την εν λόγω περιοχή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2379/83 della Commissione, del 23 agosto 1983, che
    fissa, per la Gran Bretagna, l'entità del premio variabile alla macellazione
    degli ovini e gli importi da riscuotere all'uscita di determinati prodotti dal
    territorio di detta regione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2379/83 van de Commissie van 23 augustus 1983 tot
    vaststelling, voor Groot-Brittannië, van het bedrag van de variabele slachtpremie
    voor schapen en van de bedragen die moeten worden geheven op produkten bij het
    verlaten van dit grondgebied
