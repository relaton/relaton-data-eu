  content: Commission Regulation (EEC) No 2379/83 of 23 August 1983 fixing for Great
    Britain the level of the variable slaughter premium for sheep and the amounts
    to be charged on products leaving that region
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2379/83 de la Commission, du 23 août 1983, fixant pour
    la Grande-Bretagne le montant de la prime variable à l'abattage des ovins et
    les montants à percevoir sur les produits quittant cette région
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2379/83 der Kommission vom 23. August 1983 zur Festsetzung
    der Höhe der variablen Schlachtprämie für Schafe in Großbritannien und der
    Beträge, die auf die dieses Gebiet verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2379/83 af 23. august 1983 om fastsættelse
    for Storbritannien af den variable præmie for slagtning af får og af de beløb,
    der skal opkræves for produkter, som udføres fra dette område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2379/83 της Επιτροπής
