  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 414/2012 tal-
    15 ta’ Mejju 2012 li jemenda r-Regolament (KE) Nru 554/2008 fir-rigward tal-kontenut
    minimu u tad-doża minima rakkomandata ta’ preparazzjoni enżimatika ta’ 6-fitażi
    bħala addittiv tal-għalf għad-dundjani tas-simna
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 414/2012 van de Commissie van 15 mei 2012
    tot wijziging van Verordening (EG) nr. 554/2008 wat betreft het minimumgehalte
    en de aanbevolen minimumdosis van een enzympreparaat van 6-fytase als toevoegingsmiddel
    voor diervoeding voor mestkalkoenen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 414/2012 z dnia 15 maja 2012
    r. zmieniające rozporządzenie (WE) nr 554/2008 w odniesieniu do minimalnej zawartości
    i minimalnej zalecanej dawki preparatu enzymatycznego 6-fitazy jako dodatku paszowego
    w paszy dla indyków rzeźnych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 414/2012 da Comissão, de 15 de maio
    de 2012 , que altera o Regulamento (CE) n. ° 554/2008 no que se refere ao teor
    mínimo e à dose mínima recomendada de uma preparação enzimática de 6-fitase
    como aditivo em alimentos para perus de engorda
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 414/2012 al Comisiei din 15
    mai 2012 de modificare a Regulamentului (CE) nr. 554/2008 în ceea ce privește
    conținutul minim al preparatului enzimatic 6-fitază și doza minimă recomandată
    a acestui preparat ca aditiv în hrana curcanilor pentru îngrășat
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 414/2012 z 15. mája 2012 , ktorým
    sa mení a dopĺňa nariadenie (ES) č. 554/2008, pokiaľ ide o minimálny obsah
    a minimálnu odporúčanú dávku enzymatického prípravku 6-fytáza ako kŕmnej
    doplnkovej látky v krmive pre morky na výkrm
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 414/2012 z dne 15. maja 2012 o spremembi
    Uredbe (ES) št. 554/2008 glede najnižje vsebnosti in najmanjšega priporočenega
    odmerka encimskega pripravka iz 6-fitaze kot krmnega dodatka v krmi za purane
    za pitanje
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 414/2012 de la Comisión, de 15 de mayo
    de 2012 , por el que se modifica el Reglamento (CE) n ° 554/2008 en cuanto al
    contenido mínimo y la dosis mínima recomendada de un preparado enzimático 6-fitasa
    como aditivo para la alimentación animal en los piensos para pavos de engorde
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 414/2012 av den 15 maj 2012
    om ändring av förordning (EG) nr 554/2008 vad gäller lägsta halt och lägsta
    rekommenderade dos av ett enzympreparat av 6-fytas som fodertillsats i foder för
    slaktkalkoner
