    minimālo saturu un minimālo ieteicamo devu, ko lieto kā barības piedevu gaļas
    tītaru barībā
  type: main
- language: lt
  script: Latn
  content: 2012 m. gegužės 15 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 414/2012,
