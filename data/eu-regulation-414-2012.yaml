title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 414/2012 of 15 May 2012 amending
    Regulation (EC) No 554/2008 as regards the minimum content and the minimum recommended
    dose of an enzyme preparation of 6-phytase as a feed additive in feed for turkeys
    for fattening
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 414/2012 de la Commission du 15 mai
    2012 modifiant le règlement (CE) n ° 554/2008 en ce qui concerne la teneur minimale
    en préparation enzymatique à base de 6-phytase et la dose recommandée minimale
    de cette préparation en tant qu’additif pour l’alimentation des dindes à
    l’engraissement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 414/2012 der Kommission vom 15. Mai 2012
    zur Änderung der Verordnung (EG) Nr. 554/2008 hinsichtlich des Mindestgehalts
    und der empfohlenen Mindestdosis der Enzymzubereitung 6-Phytase als Futtermittelzusatzstoff
    in Futtermitteln für Masttruthühner
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 414/2012 на Комисията
