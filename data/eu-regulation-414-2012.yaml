  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 414/2012, annettu 15 päivänä
    toukokuuta 2012 , asetuksen (EY) N:o 554/2008 muuttamisesta siltä osin kuin on
    kyse 6-fytaasia sisältävän entsyymivalmisteen vähimmäispitoisuudesta ja suositellusta
