    a minimální doporučenou dávku přípravku enzymu 6-fytázy jako doplňkové
    látky přidané do krmiv pro výkrm krůt
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 414/2012 af 15. maj 2012
