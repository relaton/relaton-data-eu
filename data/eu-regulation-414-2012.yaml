    og mindste anbefalede dosis af et enzympræparat af 6-fytase som tilsætningsstof
    til foder til slagtekalkuner
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 414/2012
