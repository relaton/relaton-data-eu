title:
- language: en
  script: Latn
  content: '84/313/EEC: Commission Decision of 28 May 1984 amending for the fourth
    time Decision 82/467/EEC authorizing a number of Member States to sell butter
    at a reduced price in the form of concentrated butter (Only the French, English
    and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/313/CEE: Décision de la Commission du 28 mai 1984 portant quatrième
    modification de la décision 82/467/CEE autorisant plusieurs États membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Les textes en
    langues française, anglaise et allemande sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '84/313/EWG: Entscheidung der Kommission vom 28. Mai 1984 zur vierten Änderung
    der Entscheidung 82/467/EWG zur Ermächtigung mehrerer Mitgliedstaaten zum Verkauf
    von Butter zu herabgesetzten Preisen in Form von Butterreinfett (Nur der französische,
    englische und deutsche Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/313/EØF: Kommissionens beslutning af 28. maj 1984 om fjerde ændring
    af beslutning 82/467/EØF om bemyndigelse af medlemsstater til at sælge smør
    til nedsat pris i form af koncentreret smør (Kun de franske, engelske og tyske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
