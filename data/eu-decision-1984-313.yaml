    αγγλική και γερμανική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '84/313/CEE: Decisione della Commissione del 28 maggio 1984 recante quarta
    modifica della decisione 82/467/CEE che autorizza vari Stati membri a vendere
