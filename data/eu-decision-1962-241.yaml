id: EUDecision1962241
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à l'autorisation accordée à la République
    italienne, en application de l'article 226 du Traité, de maintenir jusqu'au 7
    août 1962 les droits de douane en vigueur au 2 mars 1960 à l'égard des États
    membres de la Communauté économique européenne et des pays tiers pour les déchets
    et débris de plomb (position du tarif douanier italien 78.01 B) et pour les déchets
    et débris de zinc (position du tarif douanier italien 79.01 B)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung der Italienischen
    Republik, gemäß Artikel 226 des Vertrages bis zum 7. August 1962 die am 2. März
    1960 gegenüber den Mitgliedstaaten der Europäischen Wirtschaftsgemeinschaft
    und den dritten Ländern geltenden Zollsätze für Bearbeitungsabfälle und Schrott
    aus Blei (Nummer des italienischen Zolltarifs 78.01 B) und für Bearbeitungsabfälle
    und Schrott aus Zink (Nummer des italienischen Zolltarifs 79.01B) beizubehalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, a norma dell'articolo 226 del Trattato, a mantenere sino
    al 7 agosto 1962, i dazi doganali in vigore il 2 marzo 1960 nei confronti degli
    Stati membri della CEE e dei paesi terzi per i rottami e cascami di piombo (voce
    della tariffa doganale italiana n. 78.01 B) e per i rottami e cascami di zinco
    (voce della tariffa doganale italiana n. 79.01 B)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om tot 7 augustus
    1962 de per 2 maart 1960 geldende invoerrechten ten opzichte van de Lid-Staten
    van de Europese Economische Gemeenschap en derde landen te handhaven voor resten
    en afvallen van lood (post 78.01 B van het Italiaanse douanetarief) en voor resten
    en afvallen van zink (post 79.01 B van het Italiaanse douanetarief)
  type: main
