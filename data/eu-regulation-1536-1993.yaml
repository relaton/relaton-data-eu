  content: COMMISSION REGULATION (EEC) No 1536/93 of 22 June 1993 determining the
    extent to which applications lodged in May 1993 for import licences for certain
    pigmeat products under the regime provided for by the Bilateral Agreements on
    agriculture concluded between the Community, of the one part, and Austria and
    Finland, of the other part, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1536/93 de la Commission du 22 juin 1993 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    mai 1993 pour certains produits à base de viande de porc, dans le cadre du régime
    prévu par les accords bilatéraux agricoles conclus entre la Communauté, d'une
    part, et l'Autriche et la Finlande, d'autre part, peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1536/93 DER KOMMISSION vom 22. Juni 1993 über die
    Festsetzung des Umfangs, in dem die im Mai 1993 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der bilateralen
    landwirtschaftlichen Abkommen zwischen der Gemeinschaft einerseits und Österreich
    sowie Finnland andererseits genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1536/93 af 22. juni 1993 om fastsættelse
    af, i hvilket omfang det er muligt at imødekomme de ansøgninger, som blev indgivet
    i maj 1993 om importlicenser for visse svinekødsprodukter i forbindelse med den
    ordning, der er fastsat i de bilaterale landbrugsaftaler, som er indgået mellem
    Fællesskabet på den ene side og Østrig og Finland på den anden
  type: main
