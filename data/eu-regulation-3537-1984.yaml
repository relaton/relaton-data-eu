title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3537/84 of 17 December 1984 authorizing
    the conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1984/85 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3537/84 de la Commission du 17 décembre 1984 ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    le vin de table, le moût de raisins, le moût de raisins concentré et le moût
    de raisins concentré rectifié pour la campagne 1984/1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3537/84 der Kommission vom 17. Dezember 1984 zur Eröffnung
    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifiziertem Traubenmost für das Wirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3537/84 af 17. december 1984 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost,
    koncentreret druemost og rektificeret koncentreret druemost i produktionsåret
    1984/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3537/84 της Επιτροπής
    της 17ης Δεκεμβρίου 1984 για την παροχή δυνατότητας
    σύναψης συμφωνητικών μακροπρόθεσμης ιδιωτικής
    αποθεματοποίησης επιτραπέζιων οίνων, γλευκών
