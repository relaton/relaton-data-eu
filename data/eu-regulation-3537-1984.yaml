    συμπυκνωμένων διορθωμένων γλευκών σταφυλής
    για την περίοδο εμπορίας 1984/85
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3537/84 della Commissione del 17 dicembre 1984 che
    concede, per la campagna 1984/1985, la possibilità di concludere contratti di
    magazzinaggio privato a lungo termine per il vino da tavola, il mosto di uve,
    il mosto di uve concentrato e il mosto di uve concentrato rettificato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3537/84 van de Commissie van 17 december 1984 betreffende
