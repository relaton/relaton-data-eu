---
id: EUDirective199632
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 96/32/EC of 21 May 1996 amending Annex II to Directive
    76/895/EEC relating to the fixing of maximum levels for pesticide residues in
    and on fruit and vegetables and Annex II to Directive 90/642/EEC relating to the
    fixing of maximum levels for pesticide residues in and on certain products of
    plant origin, including fruit and vegetables, and providing for the establishment
    of a list of maximum levels
  type: main
- language: fr
  script: Latn
  content: Directive 96/32/CE du Conseil du 21 mai 1996 modifiant l'annexe II de la
    directive 76/895/CEE concernant la fixation de teneurs maximales pour les résidus
    de pesticides sur et dans les fruits et légumes et l'annexe II de la directive
    90/642/CEE concernant la fixation de teneurs maximales pour les résidus de pesticides
    sur ou dans certains produits d'origine végétale, y compris les fruits et légumes,
    et établissant une liste de teneurs maximales
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/32/EG des Rates vom 21. Mai 1996 zur Änderung von Anhang
    II der Richtlinie 76/895/EWG zur Festsetzung von Höchstgehalten an Rückständen
    von Schädlingsbekämpfungsmitteln in und auf Obst und Gemüse, sowie zur Änderung
    von Anhang II der Richtlinie 90/642/EWG über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse, sowie zur Erstellung
    einer Liste von Höchstgehalten
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/32/ЕО на Съвета от 21 май 1996 година
    за изменение на приложение II към Директива
    76/895/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    плодове и зеленчуци и на приложение II към Директива
    90/642/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    някои продукти от растителен произход, включително
    плодове и зеленчуци, и относно съставянето
    на списък за максималните количества
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/32/ES ze dne 21. května 1996, kterou se mění příloha
    II směrnice 76/895/EHS o stanovení maximálních limitů reziduí pesticidů
    v ovoci a zelenině a na jejich povrchu a příloha II směrnice 90/642/EHS o
    stanovení maximálních limitů reziduí pesticidů v některých produktech
    rostlinného původu a na nich, včetně ovoce a zeleniny, a kterou se stanoví
    seznam maximálních limitů
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/32/EF af 21. maj 1996 om ændring af bilag II til direktiv
    76/895/EØF om fastsættelse af maksimalgrænseværdier for pesticidrester på
    og i frugt og grøntsager og bilag II til direktiv 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for pesticidrester på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager, samt om opstilling af en fortegnelse
    over maksimalgrænseværdier
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/32/ΕΚ του Συμβουλίου της 21ης Μαΐου
    1996 περί τροποποιήσεως του παραρτήματος ΙΙ
    της οδηγίας 76/895/ΕΟΚ περί του καθορισμού της
    μέγιστης περιεκτικότητας για τα κατάλοιπα
    των φυτοφαρμάκων επί και εντός των οπωροκηπευτικών
    και του παραρτήματος ΙΙ της οδηγίας 90/642/ΕΟΚ
    που αφορά τον καθορισμό των ανώτατων περιεκτικοτήτων
    για τα κατάλοιπα φυτοφαρμάκων επάνω ή μέσα
    σε ορισμένα προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών, και καταρτίσεως πίνακος
    ανωτάτων περιεκτικοτήτων
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/32/EÜ, 21. mai 1996, millega muudetakse direktiivi
    76/895/EMÜ (puu- ja köögiviljas sisalduvate ja nende pinnal esinevate pestitsiidide
    jääkide piirnormide kehtestamise kohta) II lisa ja direktiivi 90/642/EMÜ (teatavates
    taimset päritolu saadustes, sealhulgas puu- ja köögiviljas sisalduvate ja nende
    pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise kohta) II lisa
    ning sätestatakse piirnormide loetelu koostamine
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/32/EY, annettu 21 päivänä toukokuuta 1996, hedelmien
    ja vihannesten torjunta-ainejäämien enimmäismäärien vahvistamista koskevan
    direktiivin 76/895/ETY liitteen II ja torjunta-ainejäämien enimmäismäärien
    vahvistamista tietyille kasvikunnasta peräisin oleville tuotteille, mukaan lukien
    hedelmät ja vihannekset, koskevan direktiivin 90/642/ETY liitteen II muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/32/EK irányelve (1996. május 21.) a gyümölcsökben és
    zöldségekben, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 76/895/EGK
    irányelv II. mellékletének módosításáról, és az egyes növényi eredetű
    termékekben – többek között a gyümölcsökben és zöldségekben –, illetve
    azok felületén található peszticid-szermaradványok megengedett legmagasabb
    mértékének meghatározásáról szóló 90/642/EGK irányelv II. mellékletének
    módosításáról, valamint egy legmagasabb mértékeket tartalmazó lista létrehozásáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/32/CE del Consiglio del 21 maggio 1996 che modifica l'allegato
    II della direttiva 76/895/CEE che fissa le quantità massime di residui di antiparassitari
    consentite sugli e negli ortofrutticoli nonché l'allegato II della direttiva
    90/642/CEE che fissa le percentuali massime di residui di antiparassitari su e
    in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli, e che prevede
    la stesura di un elenco di percentuali massime
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/32/EK (1996. gada 21. maijs), ar ko groza II pielikumu
    Direktīvai 76/895/EEK par pesticīdu atlieku maksimāli pieļaujamo daudzumu
    noteikšanu augļos un dārzeņos un uz tiem un II pielikumu Direktīvai 90/642/EEK
    par pesticīdu atlieku maksimāli pieļaujamo daudzumu noteikšanu dažos augu
    izcelsmes produktos, to skaitā augļos un dārzeņos un uz tiem, un kura paredz
    maksimāli pieļaujamo daudzumu saraksta izstrādi
  type: main
- language: lt
  script: Latn
  content: 1996 m. gegužės 21 d. Tarybos direktyva 96/32/EB, iš dalies keičianti
    Tarybos direktyvos 76/895/EEB dėl didžiausių pesticidų likučių koncentracijų
    vaisiuose bei daržovėse ir ant jų nustatymo II priedą ir Direktyvos 90/642/EEB
    dėl didžiausių pesticidų likučių koncentracijų tam tikruose augalinės
    kilmės produktuose ir ant jų, įskaitant vaisius ir daržoves, nustatymo II
    priedą ir numatanti sudaryti didžiausių koncentracijų sąrašą
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/32/KEE tal-21 ta' Mejju 1996 li temenda l-Anness
    II tad-Direttiva 76/895/KEE li tirrigwarda l-iffisar ta' livelli massimi ta' residwi
    ta' pestiċidi fi u fuq frott u ħxejjex u l-Anness II tad-Direttiva 90/642/KEE
    li jirrigwarda l-iffisar ta' livelli massimi ta' residwi ta' pestiċidi fi u fuq
    ċerti prodotti li joriġinaw minn pjanti, inklużi l-frott u l-ħxejjex, u li
    jipprovdu għall-istabbiliment ta' lista ta' livelli massimi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/32/EG van de Raad van 21 mei 1996 houdende wijziging van bijlage
    II bij Richtlijn 76/895/EEG betreffende de vaststelling van de maximale hoeveelheden
    residuen van bestrijdingsmiddelen in en op groenten en fruit en van bijlage II
    bij Richtlijn 90/642/EEG tot vaststelling van maximumgehalten aan residuen van
    bestrijdingsmiddelen in en op bepaalde produkten van plantaardige oorsprong; met
    inbegrip van groenten en fruit, en houdende vaststelling van een lijst van maximumgehalten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/32/WE z dnia 21 maja 1996 r. zmieniająca załącznik
    II do dyrektywy 76/895/EWG odnoszącej się do ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w owocach i warzywach oraz na ich powierzchni
    oraz załącznik II do dyrektywy 90/642/EWG odnoszącej się do ustalania najwyższych
    dopuszczalnych poziomów pozostałości pestycydów w niektórych produktach pochodzenia
    roślinnego, w tym owocach i warzywach oraz na ich powierzchni, oraz przewidującej
    ustalanie wykazu najwyższych dopuszczalnych poziomów
  type: main
- language: pt
  script: Latn
  content: Directiva 96/32/CE do Conselho de 21 de Maio de 1996 que altera o anexo
    II da Directiva 76/895/CEE relativa à fixação de teores máximos de resíduos
    de pesticidas nas e sobre as frutas e produtos hortícolas e o anexo II da Directiva
    90/642/CEE relativa à fixação de teores máximos de resíduos de pesticidas
    nos e sobre determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas, e que estabelece uma lista de teores máximos
  type: main
- language: ro
  script: Latn
  content: Directiva 96/32/CE a Consiliului din 21 mai 1996 de modificare a anexei
    II la Directiva 76/895/CEE privind stabilirea conținuturilor maxime de reziduuri
    de pesticide din și de pe fructe și legume, precum și a anexei II la Directiva
    90/642/CEE de stabilire a conținuturilor maxime de reziduuri de pesticide din
    și de pe anumite produse de origine vegetală, inclusiv fructe și legume, precum
    și de stabilire a unei prime liste de conținuturi maxime
  type: main
- language: sk
  script: Latn
  content: Smernica Rady č. 96/32/ES z 21. mája 1996, ktorou sa mení a dopĺňa
    príloha II k smernici č. 76/895/EHS o stanovení maximálnych limitov rezíduí
    pesticídov v a na ovocí a zelenine a príloha II k smernici č. 90/642/EHS o
    stanovení maximálnych limitov rezíduí pesticídov v a na určitých výrobkoch
    rastlinného pôvodu vrátane ovocia a zeleniny a ktorou sa vytvára zoznam maximálnych
    limitov
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/32/ES z dne 21. maja 1996 o spremembah Priloge II Direktive
    76/895/EGS o določitvi mejnih vrednosti ostankov pesticidov v in na sadju in
    zelenjavi ter Priloge II Direktive 90/642/EGS o določitvi mejnih vrednosti ostankov
    pesticidov v in na nekaterih izdelkih rastlinskega izvora, vključno s sadjem
    in zelenjavo, in vzpostavitvi seznama mejnih vrednosti
  type: main
- language: es
  script: Latn
  content: Directiva 96/32/CE del Consejo de 21 de mayo de 1996 por la que se modifican
    el Anexo II de la Directiva 76/895/CEE relativa a la fijación de los límites
    máximos de residuos de plaguicidas en las frutas y hortalizas y el Anexo II de
    la Directiva 90/642/CEE relativa a la fijación de los límites máximos de residuos
    de plaguicidas en determinados productos de origen vegetal, incluidas las frutas
    y hortalizas, y por la que se establece una lista de límites máximos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/32/EG av den 21 maj 1996 om ändring av bilaga II till
    direktiv 76/895/EEG om fastställande av gränsvärden för bekämpningsmedelsrester
    i och på frukt och grönsaker och bilaga II till direktiv 90/642/EEG om fastställande
    av gränsvärden för bekämpningsmedelsrester i och på vissa produkter av vegetabiliskt
    ursprung, inklusive frukt och grönsaker, samt om fastställande av en förteckning
    över gränsvärden
  type: main
