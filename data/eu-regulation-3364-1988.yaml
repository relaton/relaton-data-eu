title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3364/88 of 28 October 1988 specifying the
    extent to which applications lodged in October 1988 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3364/88 de la Commission, du 28 octobre 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1988 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3364/88 der Kommission vom 28. Oktober 1988 über
    das Ausmaß, in dem den im Monat Oktober 1988 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3364/88 af 28. oktober 1988 om det
    omfang, i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet
    i oktober 1988 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3364/88 της Επιτροπής
    της 28ης Οκτωβρίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1988, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3364/88 della Commissione, del 28 ottobre 1988, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1988 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3364/88 van de Commissie van 28 oktober 1988 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in oktober 1988 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3364/88 da Comissão, de 28 de Outubro de 1988, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Outubro de 1988 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3364/88 de la Comisión, de 28 de octubre de 1988, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de octubre de 1988 respecto
    a los jóvenes bovinos machos destinados al engorde
