  content: BESCHLUSS DES RATES vom 21. Dezember 1990 über die vorläufige Anwendung
    der Vereinbarten Niederschrift zur Änderung des Abkommens zwischen der Europäischen
    Wirtschaftsgemeinschaft und der Tschechischen und Slowakischen Föderativen Republik
    über den Handel mit Textilwaren (91/20/EWG)
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 21. december 1990 om midlertidig anvendelse af det
    godkendte protokollat om ændring af aftalen mellem Det Europæiske Økonomiske
    Fællesskab og Den Tjekkiske og Slovakiske Føderative Republik om handel med
    tekstilvarer (91/20/EØF) # RÅDET FOR DE EUROPÆISKE # FÆLLESSKABER HAR - #
    under henvisning til Traktaten om Oprettelse af Det Europæiske Økonomiske Fællesskab,
    særlig artikel 113, # under henvisning til forslag fra Kommissionen, og # ud
    fra følgende betragtninger: # Indtil afslutningen af de nødvendige procedurer
    for indgåelse af aftalen mellem Det Europæiske Økonomiske Fællesskab og Den
    Tjekkiske og Slovakiske Føderative Republik, som blev paraferet den 19. juni
    1986, anvendes aftalen midlertidigt fra den 1. januar 1987, for så vidt angår
    Fællesskabet, i overensstemmelse med afgørelse 87/498/EØF (1); # aftalen åbner
    mulighed for tilpasninger af de kvantitative lofter; # Tjekkoslovakiet accepterede
    det tilbud om udvidet adgang til markedet, som Fællesskabet fremsatte på grundlag
    af en konkret anmodning fra Tjekkoslovakiet i henhold til PHARE-handlingsplanen,
    og i et godkendt protokollat af 30. oktober 1990 aftaltes det for 1990 og 1991
    at hæve de kvantitative EØF-lofter for en række kategorier, der er anført
    i bilag II til ovennævnte aftale; # begge parter var indforstået med, at ovennævnte
    kontingentforhøjelser er af exceptionel karakter og skal bidrage til den koordinerede
    indsats, der udfoldes af »gruppen af 24 industrialiserede lande« med henblik
    på at lette omstruktureringen af den tjekkiske økonomi, blandt andet gennem
    udvidet adgang til markederne i Fællesskabet; # det aftaltes, at nævnte godkendte
    protokollat skal anvendes midlertidigt fra den 15. november 1990 indtil afslutningen
    af de nødvendige procedurer for dets indgåelse, på betingelse af en tilsvarende
    midlertidig anvendelse fra den anden kontraherende parts side - # TRUFFET FØLGENDE
    AFGØRELSE: Eneste artikel Det godkendte protokollat om ændring af aftalen mellem
    Det Europæiske Økonomiske Fællesskab og Den Tjekkiske og Slovakiske Føderative
    Republik om handel med tekstilvarer anvendes midlertidigt fra den 15. november
    1990, indtil den formelle godkendelse heraf foreligger, på betingelse af en tilsvarende
    midlertidig anvendelse fra den anden kontraherende parts side. # Teksten til det
    godkendte protokollat er knyttet til denne afgørelse. Udfærdiget i Bruxelles,
    den 21. december 1990. På Rådets vegne # A. RUBERTI # Formand (1) EFT nr. L
    287 af 9. 10. 1987, s. 89. # BILAG #Af praktiske grunde anføres de varebeskrivelser,
    der anvendes i bilaget, i forkortet form # Forhøjelser af de kvantitative EØF-lofter
    for Tjekkoslovakiet for 1990 og 1991 # Kategori Varebeskrivelse # Enhed Forhøjelse
    # af EØF-lofterne # for 1990 # og 1991 2 Vævede stoffer af bomuld tons 650 3
    Vævet stof af korte syntetiske fibre tons 325 3 a) a) Bortset fra stoffer, ublegede
    og blegede tons FR: 54 # BNL: 31 # 6 Vævede benklæder 1 000 stk. 400 8 Skjorter,
    ikke af trikotage 1 000 stk. 340 9 Håndklædefrottéstof, vævet frottéstof
    tons 70 19 Lommetørklæder 1 000 stk. 8 000 32 Vævede fløjlsstoffer tons 600
    32 a) Skudfløjl, riflet tons 600 36 Vævet stof af syntetiske fibre tons 250
    37 Vævet stof af korte regenererede fibre tons 200 76 Arbejdsbeklædning tons
    230 90 Sejlgarn, reb og tovværk tons 240 110 Luftmadrasser af vævet stof tons
    120 117 Stoffer af hør eller ramie tons 175 # BM291A0118(01)GODKENDT PROTOKOLLAT
    #'
