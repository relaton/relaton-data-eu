title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/790 of 9 June 2020 on the position to be taken
    on behalf of the European Union within the Joint Committee and the Subcommittee
    on Trade and Investment established by the Framework Agreement on Partnership
    and Cooperation between the European Union and its Member States, of the one part,
    and Mongolia, of the other part, as regards the adoption of decisions on the rules
    of procedure of the Joint Committee and the rules of procedure of the Subcommittee
    on Trade and Investment
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/… du Conseil du 9 juin 2020 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité mixte et du sous-comité
    «Commerce et investissement» institués par l’accord-cadre de partenariat
    et de coopération entre l’Union européenne et ses États membres, d’une
    part, et la Mongolie, d’autre part, en ce qui concerne l’adoption de décisions
    relatives au règlement intérieur du comité mixte et au règlement intérieur
    du sous-comité sur le commerce et les investissements
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/790 des Rates vom 9. Juni 2020 über den Standpunkt,
