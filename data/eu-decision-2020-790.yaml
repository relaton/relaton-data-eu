    und Zusammenarbeit zwischen der Europäischen Union und ihren Mitgliedstaaten
    einerseits und der Mongolei andererseits eingesetzt wurden, zur Annahme von Beschlüssen
    über die Geschäftsordnung des Gemischten Ausschusses und die Geschäftsordnung
    des Unterausschusses für Handel und Investitionen zu vertreten ist
