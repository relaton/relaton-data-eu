title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3427/83 of 30 November 1983 re-establishing
    the levying of customs duties on women' s, girls' and infants' woven suits and
    costumes, products of category 29 (code 0290), originating in Sri Lanka, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3427/83 de la Commission du 30 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux costumes-tailleurs,
    tissés pour femmes, fillettes et jeunes enfants, de la catégorie de produits
    no 29 (code 0290), originaires de Sri Lanka, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3427/83 der Kommission vom 30. November 1983 über
    die Wiedereinführung des Zollsatzes für Kostüme und Hosenanzüge, aus Geweben,
    für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 29 (Kennziffer 0290)
    mit Ursprung in Sri Lanka, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3427/83 af 30. november 1983 om genindførelse
    af opkrævning af toldafgifter for dragter og kostumer, herunder kjoledragter
    og buksedragter, vævede, til kvinder, piger og småbørn, under varekategori
    nr. 29 (kode 0290), som har oprindelse i Sri Lanka og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3427/83 της Επιτροπής
    της 30ής Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για κοστούμια—ταγιέρ
    υφασμένα, για γυναίκες, κορασίδες και μικρά
    παιδιά, της κατηγορίας 29 (κωδικός 0290), καταγωγής
    Σρι Λάνκα, δικαιούχου των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3427/83 della Commissione del 30 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili agli abiti a giacca e
    completi, tessuti, per donna, per ragazza e per bambini, della categoria di prodotti
    n. 29 (codice 0290), originari dello Sri Lanka, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3427/83 van de Commissie van 30 november 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    mantelpakken en broekpakken voor dames, meisjes en kinderen, van de categorie
    van produkten nr. 29 (codenummer 0290), van oorsprong uit Sri Lanka, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
