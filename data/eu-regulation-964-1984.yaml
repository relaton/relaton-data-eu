  content: Commission Regulation (EEC) No 964/84 of 9 April 1984 re-establishing the
    levying of customs duties on ethyl acetate, falling within subheading 29.14 A
    II c) ex I and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
