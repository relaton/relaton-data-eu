    di esecuzione (UE) 2021/404 per quanto riguarda gli elenchi di paesi terzi, territori,
    o loro zone o compartimenti da cui è autorizzato l’ingresso nell’Unione di
    equini, prodotti a base di carne, latte, colostro, prodotti ottenuti dal colostro
    e prodotti lattiero-caseari, budelli e animali acquatici
  type: main
- language: lv
