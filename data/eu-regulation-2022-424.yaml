    за изпълнение (ЕС) 2021/404 по отношение на списъците
    на трети държави, територии или зони, или компартменти
    от тях, от които е разрешено въвеждането в Съюза
    на еднокопитни животни, месни продукти, мляко,
    коластра, продукти на основата на коластра
    и млечни продукти, естествени обвивки и водни
    животни
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/424 ze dne 14. března 2022,
    kterým se mění a opravují přílohy I, IV, XV, XVI, XVII a XXI prováděcího
    nařízení (EU) 2021/404, pokud jde o seznam třetích zemí, území nebo jejich
    oblastí či jednotek, z nichž je povolen vstup koňovitých, masných výrobků,
    mléka, mleziva, výrobků z mleziva, mléčných výrobků, střívek a vodních
    živočichů do Unie
  type: main
- language: da
  script: Latn
