    XVII agus XXI a ghabhann le Rialachán Cur Chun Feidhme (AE) 2021/404 a mhéid
    a bhaineann le liostaí de thríú tíortha nó de chríocha, nó de chriosanna
    nó de dheighleoga de thríú tír nó de chríoch a údaraítear i dtaobh each-ainmhithe,
