    sarakstiem, no kuriem Savienībā atļauts ievest zirgu dzimtas dzīvniekus, gaļas
    produktus, pienu, jaunpienu, produktus uz jaunpiena bāzes un piena produktus,
    no zarnām izgatavotus apvalkus un ūdensdzīvniekus, groza un labo Īstenošanas
    regulas (ES) 2021/404 I, IV, XV, XVI, XVII un XXI pielikumu
  type: main
