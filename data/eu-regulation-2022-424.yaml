title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/424 of 14 March 2022 amending
    and correcting Annexes I, IV, XV, XVI, XVII and XXI to Implementing Regulation
    (EU) 2021/404 as regards the lists of third countries, territories or zones or
    compartments thereof authorised for the entry into the Union of equine animals,
    meat products, milk, colostrum, colostrum-based products and dairy products, casings
    and aquatic animals
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/424 de la Commission du 14 mars 2022
    modifiant et rectifiant les annexes I, IV, XV, XVI, XVII et XXI du règlement
    d’exécution (UE) 2021/404 en ce qui concerne les listes des pays tiers et territoires,
    ou des zones ou compartiments de pays tiers ou territoire, en provenance desquels
    l’entrée dans l’Union d’équidés, de produits à base de viande, de lait,
    de colostrum, de produits à base de colostrum et de produits laitiers, de boyaux
    et d’animaux aquatiques est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/424 der Kommission vom 14. März 2022
    zur Änderung und Berichtigung der Anhänge I, IV, XV, XVI, XVII und XXI der Durchführungsverordnung
    (EU) 2021/404 hinsichtlich der Listen von Drittländern, Gebieten oder Zonen bzw.
    Kompartimenten derselben, aus denen der Eingang von Equiden, Fleischerzeugnissen,
    Milch, Kolostrum, Erzeugnissen auf Kolostrumbasis und Milcherzeugnissen, Tierdarmhüllen
    und Wassertieren in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
