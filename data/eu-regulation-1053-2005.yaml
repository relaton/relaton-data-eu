    saskaņā ar Regulu (EK) Nr. 1081/1999 attiecībā uz dažu alpīno un kalnu šķirņu
    buļļu, govju un teļu importu
  type: main
- language: lt
  script: Latn
  content: 2005 m. liepos 5 d. Komisijos reglamentas (EB) Nr. 1053/2005, nustatantis,
