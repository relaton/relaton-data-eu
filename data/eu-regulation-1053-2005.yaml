    veislių bulių, karvių ir telyčių importo teisėms gauti pagal Reglamento
    (EB) Nr. 1081/1999 nuostatas
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1053/2005 van de Commissie van 5 juli 2005 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om rechten op invoer
    die zijn ingediend op grond van Verordening (EG) nr. 1081/1999 betreffende de
    invoer van stieren, koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1053/2005 z dnia 5 lipca 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie uprawnień na przywóz
    byków, krów i jałówek niektórych ras alpejskich i górskich, składane z
    tytułu rozporządzenia (WE) nr 1081/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1053/2005 da Comissão, de 5 de Julho de 2005, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) n.° 1081/1999 relativo à importação
    de touros, de vacas e de novilhas de determinadas raças alpinas e de montanha
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1053/2005 z 5. júla 2005, ustanovujúce podmienky,
    za ktorých možno vyhovieť žiadostiam o dovozné povolenie predloženým v
    zmysle nariadenia (ES) č. 1081/1999 týkajúceho sa dovozu býkov kráv a jalovíc
    niektorých alpských a horských plemien
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1053/2005 z dne 5. julija 2005 o določitvi,
