    z Uredbo (ES) št. 1081/1999 o uvozu bikov, krav in telic nekaterih alpskih in
    gorskih pasem
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1053/2005 de la Comisión, de 5 de julio de 2005, por
    el que se determina la medida en que pueden atenderse las solicitudes de derechos
    de importación presentadas de conformidad con el Reglamento (CE) n° 1081/1999,
    relativo a la importación de toros, vacas y novillas de determinadas razas alpinas
    y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1053/2005 av den 5 juli 2005 om i vilken
