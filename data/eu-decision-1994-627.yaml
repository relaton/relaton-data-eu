  script: Latn
  content: '94/627/EC: Commission Decision of 13 July 1994 on the establishment of
    the Community support framework for Community structural assistance for the Greek
    regions concerned by Objective 1, which is the whole country (Only the Greek text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/627/CE: Décision de la Commission, du 13 juillet 1994, concernant
    l''établissement du cadre communautaire d''appui pour les interventions structurelles
    communautaires dans les régions de la Grèce concernées par l''objectif n°
    1, à savoir la totalité du territoire (Le texte en langue grecque est le seul
    faisant foi)'
  type: main
