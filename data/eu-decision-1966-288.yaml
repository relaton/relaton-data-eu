title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 mars 1966, portant octroi à la République
    fédérale d'Allemagne d'un contingent tarifaire pour les squales, dits "aiguillats",
    frais, réfrigérés ou congelés
  type: main
- language: de
  script: Latn
  content: '66/288/EWG: Entscheidung der Kommission vom 20. April 1966 über den Antrag
    der Französischen Republik nach Artikel 115 Absatz (1) des Vertrages, um Phantasieschmuck,
    ausgenommen gestanzte Medaillen, mit Ursprung aus Hongkong, der sich in den anderen
    Mitgliedstaaten im freien Verkehr befindet, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/288/CEE: Decisione della Commissione, del 20 aprile 1966, relativa
    al ricorso della Repubblica francese all''articolo 115, paragrafo 1, del Trattato,
    per escludere dal trattamento comunitario la minuteria di fantasia, ad eccezione
    delle medaglie ottenute mediante coniazione, originaria di Hong-Kong e messa in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/288/EEG: Beschikking van de Commissie van 20 april 1966 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag fancybijouterieën (met uitzondering van geslagen medailles) die
    van oorsprong zijn uit Hong-Kong en in de andere Lid-Staten in het vrije verkeer
    zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
