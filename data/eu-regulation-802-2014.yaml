title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 802/2014 of 24 July 2014 establishing
    models for national programmes and establishing the terms and conditions of the
    electronic data exchange system between the Commission and Member States pursuant
    to Regulation (EU) No 514/2014 of the European Parliament and of the Council laying
    down general provisions on the Asylum, Migration and Integration Fund and on the
    instrument for financial support for police cooperation, prevention and combating
    crime and crisis management
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 802/2014 de la Commission du 24 juillet
    2014 établissant les modèles pour les programmes nationaux ainsi que les conditions
    et les modalités du système d'échange électronique de données entre la Commission
    et les États membres, conformément au règlement (UE) n ° 514/2014 du Parlement
    européen et du Conseil portant dispositions générales applicables au Fonds
    «Asile, migration et intégration» et à l'instrument de soutien financier à
    la coopération policière, à la prévention et à la répression de la criminalité,
    ainsi qu'à la gestion des crises
  type: main
