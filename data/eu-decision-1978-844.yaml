title:
- language: en
  script: Latn
  content: '78/844/EEC: Commission Decision of 26 September 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to bed linen, table linen, toilet and kitchen linen
    falling within subheading ex 62.02 B of the Common Customs Tariff (NIMEXE code
    62.02-73) originating in the People'' s Republic of China and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/844/CEE: Décision de la Commission, du 26 septembre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire le linge de lit, de toilette, d''office
    ou de cuisine, de la sous-position ex 62.02 B du tarif douanier commun (code Nimexe:
    62.02-73), originaire de la République populaire de Chine et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/844/EWG: Entscheidung der Kommission vom 26. September 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Kónigreich der
    Niederlande ermáchtigt werden, aus der Volksrepublik China stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche Tischwásche, Wásche zur
    Kórperpflege und andere Haushaltswásche, der Tarifstelle ex 62.02 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffer 62.02-73) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/844/EØF: Kommissionens beslutning af 26. september 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage sengelinned, dækketøj, håndklæder,
    vaskeklude og viskestykker, som henhører under pos. ex 62.02 B i den fælles
    toldtarif (NIMEXE-kode 62.02-73), har oprindelse i Den kinesiske Folkerepublik
    og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/844/CEE: Decisione della Commissione, del 26 settembre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario la biancheria da letto, da tavola, da
    toletta, da servizio o da cucina, della sottovoce ex 62.02 B della tariffa doganale
    comune (codice Nimexe: 62.02-73), originaria della Repubblica popolare cinese
    e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/844/EEG: Beschikking van de Commissie van 26 september 1978 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd tafel- bedde- en huishoudlinnen van post ex 62.02 B van het
    gemeenschappelijk douanetarief (NIMEXE-code 62.02-73), van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
