title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2365/77 of 28 October 1977 suspending application
    of the condition to which the importation into the Community of certain types
    of citrus fruit originating in Spain or in Cyprus is subject by virtue of the
    Agreements between the Community and those countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2365/77 du Conseil, du 28 octobre 1977, portant suspension
    de l'application de la condition à laquelle est soumise l'importation dans la
    Communauté de certains agrumes originaires d'Espagne et de Chypre en vertu des
    accords entre la Communauté et chacun de ces pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2365/77 des Rates vom 28. Oktober 1977 zur Aussetzung
    der Anwendung der Bedingung für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung
    in Spanien und Zypern in die Gemeinschaft gemäß den Abkommen zwischen der Gemeinschaft
    und jedem dieser Länder
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2365/77 af 28. oktober 1977 om suspension
    af anvendelsen af den betingelse, som indførsel til Fællesskabet af en række
    citrusfrugter med oprindelse i Spanien og Cypern er underlagt i henhold til aftalerne
    mellem Fællesskabet og hvert af disse lande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2365/77 del Consiglio, del 28 ottobre 1977, che sospende
    l'applicazione della condizione cui sono subordinate le importazioni nella Comunità
    di taluni agrumi originari della Spagna e di Cipro, in virtù degli accordi fra
    la Comunità e ciascuno di tali paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2365/77 van de Raad van 28 oktober 1977 houdende
    schorsing van de toepassing van de voorwaarde waaraan de invoer in de Gemeenschap
    van bepaalde citrusvruchten van oorsprong uit Spanje en uit Cyprus is onderworpen
    krachtens de Overeenkomsten tussen de Gemeenschap en elk van deze landen
  type: main
