title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/741 of 13 May 2022 concerning
    a coordinated multiannual control programme of the Union for 2023, 2024 and 2025
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
    and repealing Implementing Regulation (EU) 2021/601
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/741 de la Commission du 13 mai 2022
    concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2023, 2024 et 2025 destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus, et abrogeant
    le règlement d’exécution (UE) 2021/601
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/741 der Kommission vom 13. Mai 2022
    über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2023, 2024
    und 2025 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs und zur Aufhebung
    der Durchführungsverordnung (EU) 2021/601
  type: main
