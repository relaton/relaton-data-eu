title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3217/75 of the Commission of 3 December 1975 derogating
    in respect of the countries which have signed the Cartagena Agreement (Andean
    Group) from Articles 1, 6 and 13 of Regulation (EEC) No 3214/75 of 3 December
    1975 on the definition of the concept of originating products for purposes of
    the application of tariff preferences granted by the European Economic Community
    in respect of certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3217/75 de la Commission, du 3 décembre 1975, portant
    dérogation pour les pays ayant signé l' accord de Carthagène (Groupe andin)
    aux articles 1er, 6 et 13 du règlement (CEE) n° 3214/75 de la Commission, du
    3 décembre 1975, relatif à la définition de la notion de produits originaires
    pour l' application des préférences tarifaires accordées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3217/75 der Kommission vom 3. Dezember 1975 über
    die zugunsten der Länder, die das Abkommen von Cartagena unterzeichnet haben
    (Andengruppe), vorgesehene Abweichung von den Artikeln 1, 6 und 13 der Verordnung
    (EWG) Nr. 3214/75 der Kommission vom 3. Dezember 1975 über die Begriffsbestimmung
    des Warenursprungs bei der Anwendung der von der Europäischen Wirtschaftsgemeinschaft
    für bestimmte Waren aus Entwicklungsländern gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3217/75 af 3. december 1975 om undtagelse
    for de lande, der har tiltrådt Cartagena-overenskomsten (ANDEAN), fra artikel
    1, 6 og 13 i Kommissionens forordning (EØF) nr. 3214/75 af 3. december 1975 om
    definitionen af begrebet varer med oprindelsesstatus til brug ved anvendelsen
    af de toldpræferencer, der af Det europæiske økonomiske Fællesskab indrømmes
    visse varer fra udviklingslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3217/75 della Commissione, del 3 dicembre 1975, che
    deroga, a favore dei paesi firmatari dell' accordo di Cartagena (gruppo andino)
    agli articoli 1, 6 e 13 del regolamento (CEE) n. 3214/75 della Commissione, del
    3 dicembre 1975, relativo alla definizione della nozione di prodotti originari
    per l' applicazione delle preferenze tariffarie accordate dalla Comunità economica
    europea a taluni prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3217/75 van de Commissie van 3 december 1975 houdende
    afwijking voor de landen die de Overeenkomst van Carthagena (Andesgroep) ondertekend
    hebben van de artikelen 1, 6 en 13 van Verordening (EEG) nr. 3214/75 van de Commissie
    van 3 december 1975 betreffende de definitie van het begrip ,,produkten van oorsprong'
    ' voor de toepassing van de door de Europese Economische Gemeenschap voor bepaalde
    produkten uit ontwikkelingslanden verleende tariefpreferenties
