  script: Latn
  content: REGULAMENTO (CE) Nº 829/95 DA COMISSÃO de 12 de Abril de 1995 que institui
    derrogações ao Regulamento (CE) nº 1223/94, que estabelece normas especiais
    de execução do regime dos certificados de prefixação para certos produtos
    agrícolas exportados sob a forma de mercadorias não abrangidas pelo anexo II
    do Tratado, e ao Regulamento (CEE) nº 3665/87, que estabelece regras comuns de
    execução do regime das restituições à exportação para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 829/95 DE LA COMISIÓN de 12 de abril de 1995 por el
    que se introduce una excepción al Reglamento (CE) nº 1223/94 por el que se establecen
    modalidades especiales de aplicación de régimen de los certificados de fijación
    anticipada para determinados productos agrícolas exportados en forma de mercancías
    no incluidas en el Anexo II del Tratado y por el que se introduce una excepción
    al Reglamento (CEE) nº 3665/87 por el que se establecen las modalidades comunes
    de aplicación del régimen de restituciones a la exportación de productos agrícolas
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 829/95 av den 12 april 1995 om undantag
