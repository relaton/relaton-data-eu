    werden, sowie in Abweichung von der Verordnung (EWG) Nr. 3665/87 über gemeinsame
    Durchführungsvorschriften für Ausfuhrerstattungen bei landwirtschaftlichen Erzeugnissen
  type: main
- language: da
  script: Latn
