    systemet med förutfastställelselicenser för vissa jordbruksprodukter som exporteras
    i form av varor som inte omfattas av bilaga II till fördraget och om undantag
    från förordning (EEG) nr 3665/87 om gemensamma tillämpningsföreskrifter för
    systemet med exportbidrag för jordbruksprodukter
