  script: Latn
  content: REGOLAMENTO (CE) N. 829/95 DELLA COMMISSIONE del 12 aprile 1995 che deroga
    al regolamento (CE) n. 1223/94 che stabilisce le modalità particolari di applicazione
    del regime dei titoli di fissazione anticipata per determinati prodotti agricoli
    esportati sotto forma di merci non comprese nell' allegato II del trattato, e
    che deroga al regolamento (CEE) n. 3665/87 recante modalità comuni di applicazione
    del regime delle restituzioni all' esportazione per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 829/95 VAN DE COMMISSIE van 12 april 1995 houdende
