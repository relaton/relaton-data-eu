  content: COMMISSION REGULATION (EC) No 829/95 of 12 April 1995 derogating from Commission
    Regulation (EC) No 1223/94 laying down special detailed rules for the application
    of the system of advance-fixing certificates for certain agricultural products
    exported in the form of goods not covered by Annex II to the Treaty, and derogating
    from Commission Regulation (EEC) No 3665/87 laying down common detailed rules
    for the application of the system of export refunds on agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 829/95 de la Commission du 12 avril 1995 dérogeant
    au règlement (CE) n° 1223/94 portant modalités particulières d'application
    du régime des certificats de préfixation pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité, et dérogeant
    au règlement (CEE) n° 3665/87 portant modalités communes d'application du régime
    des restitutions à l'exportation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 829/95 DER KOMMISSION vom 12. April 1995 in Abweichung
    von der Verordnung (EG) Nr. 1223/94 über besondere Durchführungsvorschriften
    für Vorausfestsetzungsbescheinigungen für bestimmte landwirtschaftliche Erzeugnisse,
