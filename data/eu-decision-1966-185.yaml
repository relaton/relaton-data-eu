title:
- language: fr
  script: Latn
  content: Décision 66/185/CEE de la Commission, du 2 mars 1966, portant modification
    de sa décision du 7 février 1966, autorisant la perception de taxes compensatoires
    sur les importations, en République fédérale d'Allemagne, de biscuits et gaufres
    en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '66/185/EWG: Entscheidung der Kommission vom 2. März 1966 über die Änderung
    ihrer Entscheidung vom 7. Februar 1966 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Waffeln und Keksen aus den anderen, Mitgliedstaaten in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/185/CEE: Decisione della Commissione del 2 marzo 1966 che modifica
    la decisione del 7 febbraio 1966 che autorizza la riscossione di tasse di compensazione
    sulle importazioni, nella Repubblica federale di Germania, di biscotti e cialde
    in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/185/EEG: Beschikking van de Commissie van 2 maart 1966 tot wijziging
    van haar beschikking van 7 februari 1966 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Bondsrepubliek Duitsland van biscuits
    en wafels uit de overige Lid-Staten'
  type: main
