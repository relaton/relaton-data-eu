title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2687/79 of 29 November 1979 re-establishing
    the levying of customs duties on woven fabrics of silk, of noil or other waste
    silk, falling within heading No 50.09 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2687/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie, de bourre de soie (schappe), etc., de la sous-position 50.09 du tarif douanier
    commun, originaires des pays et territoires en voie de développement, bénéficiaires
    de préférences tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2687/79 der Kommission vom 29. November 1979 zur Wiedereinführung
    des Zollsatzes für Gewebe aus Seide, Schappeseide, usw. der Tarifnummer 50.09
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 1195/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2687/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke, etc. under position
    50.09, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2687/79 della Commissione, del 29 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta, di
    borra di seta (schappe), ecc., della voce doganale 50.09, originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2687/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van zijde, van vlokzijde, enz. van post 50.09, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 1195/79 van de Raad tariefpreferenties
    werden geopend
  type: main
