title:
- language: en
  script: Latn
  content: '94/334/EC: Commission Decision of 26 May 1994 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries with a view to taking account of certain
    meats from Uruguay'
  type: main
- language: fr
  script: Latn
  content: '94/334/CE: Décision de la Commission du 26 mai 1994 modifiant la décision
    93/402/CEE concernant les conditions de police sanitaire et la certification vétérinaire
    requises à l''importation de viandes fraîches en provenance de certains pays
    d''Amérique du Sud, pour tenir compte de certaines viandes provenant d''Uruguay'
  type: main
- language: de
  script: Latn
  content: '94/334/EG: Entscheidung der Kommission vom 26. Mai 1994 zur Änderung
    der Entscheidung 93/402/EWG zur Festlegung der veterinärrechtlichen Bedingungen
    und der Veterinärzeugnisse für die Einfuhr von frischem Fleisch aus einigen
    südamerikanischen Ländern hinsichtlich der Einbeziehung bestimmter Fleischarten
    aus Uruguay'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 26. května 1994, kterým se mění rozhodnutí
    93/402/EHS o veterinárních podmínkách a veterinárních osvědčeních pro
    dovoz čerstvého masa z některých jihoamerických zemí tak, aby se zohlednily
    některé druhy masa z Uruguaye
  type: main
- language: da
  script: Latn
  content: '94/334/EF: Kommissionens beslutning af 26. maj 1994 om ændring af beslutning
    93/402/EØF om sundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika for at tage hensyn
    til visse kødtyper fra Uruguay'
  type: main
- language: el
  script: Grek
  content: '94/334/ΕΚ: Απόφαση της Επιτροπής της 26ης Μαΐου
    1994 για την τροποποίηση της απόφασης 93/402/ΕΟΚ
    σχετικά με τους υγειονομικούς όρους και τα
    υγειονομικά πιστοποιητικά που απαιτούνται
    σχετικά με την εισαγωγή νωπών κρεάτων προερχομένων
    από ορισμένες χώρες της Νότιας Αμερικής, για
    να ληφθούν υπόψη ορισμένα κρέατα προέλευσης
    Ουρουγουάης'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 26. mai 1994, millega muudetakse otsust 93/402/EMÜ loomatervishoiu
    nõuete ja veterinaarsertifikaatide kohta värske liha impordil Lõuna-Ameerika
    riikidest, et võtta arvesse teatavat Uruguayst pärit liha
  type: main
- language: fi
  script: Latn
  content: '94/334/EY: Komission päätös, tehty 26 päivänä toukokuuta 1994, eläinten
    terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista tuoreen
    lihan tuonnissa tietyistä Etelä-Amerikan maista tehdyn päätöksen 93/402/ETY
    muuttamisesta tietyn Uruguaysta tulevan lihan huomioon ottamiseksi'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1994. május 26.) a friss hús dél-amerikai
    országokból történő behozatalára vonatkozó állat-egészségügyi feltételekről
    és állatorvosi bizonyítványról szóló 93/402/EGK határozatnak egyes Uruguayból
    érkező húsok figyelembe vétele céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: '94/334/CE: Decisione della Commissione del 26 maggio 1994 che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l''importazione di carni fresche
    provenienti da paesi dell''America del Sud per tener conto di talune carni provenienti
    dall''Uruguay'
  type: main
- language: lv
  script: Latn
  content: Komisijas lēmums (1994. gada 26. maijs), ar ko groza Lēmumu 93/402/EEK
    par dzīvnieku veselības nosacījumiem un veterināro sertifikāciju attiecībā
    uz svaigas gaļas ievedumiem no Dienvidamerikas valstīm, ņemot vērā konkrētu
    veidu gaļu no Urugvajas
  type: main
- language: lt
  script: Latn
  content: 1994 m. gegužės 26 d. Komisijos Sprendimas iš dalies keičiantis Sprendimą
    93/402/EEB dėl veterinarijos reikalavimų ir veterinarinio sertifikavimo importuojant
    šviežią mėsą iš Pietų Amerikos šalių, taip pat tam tikros rūšies mėsą
    iš Urugvajaus
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-26 ta' Mejju 1994 li temenda Deċiżjoni
    93/402/KEE li tikkonċerna l-kondizzjonijiet ta' saħħa ta' l-annimali u ċertifikati
    veterinarji għall-importazzjonijiet ta' laħam frisk minn pajjiżi ta' l-Amerika
    ta' Isfel bil-ħsieb li jittieħed kont ta' ċertu laħam mill-Urugwaj
  type: main
- language: nl
  script: Latn
  content: '94/334/EG: Beschikking van de Commissie van 26 mei 1994 tot wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika,
    teneinde rekening te houden met bepaalde soorten vlees uit Uruguay'
  type: main
- language: pl
  script: Latn
  content: Decyzja komisji z dnia 26 maja 1994 r. zmieniająca decyzję 93/402/EWG
    dotyczącą warunków zdrowotnych zwierząt i świadectw weterynaryjnych przy
    przywozie świeżego mięsa z państw Ameryki Południowej, w celu uwzględnienia
    niektórych rodzajów mięsa z Urugwaju
  type: main
- language: pt
  script: Latn
  content: '94/334/CE: Decisão da Comissão de 26 de Maio de 1994 que altera a Decisão
    93/402/CEE, relativa às condições sanitárias e à certificação veterinária
    exigidas para a importação de carne fresca proveniente de países da América
    do Sul, para ter em conta determinadas carnes provenientes do Uruguai'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 26. mája 1994, ktorým sa mení a dopĺňa rozhodnutie
    93/402EHS o zdravotnom stave zvierat a o veterinárnej certifikácii pre dovoz
    čerstvého mäsa z krajín Južnej Ameriky vzhľadom na určité druhy mäsa
    z Uruguaja
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 26. maja 1994 o spremembi Odločbe 93/402/EGS o
    pogojih v zvezi z zdravstvenim varstvom živali in izdajanju veterinarskih spričeval
    za uvoz svežega mesa iz južnoameriških držav, z namenom upoštevanja določenih
    vrst mesa iz Urugvaja
  type: main
- language: es
  script: Latn
  content: '94/334/CE: Decisión de la Comisión de 26 de mayo de 1994 por la que
    se modifica la Decisión 93/402/CEE relativa a las condiciones de policía sanitaria
    y a la certificación veterinaria requeridas para la importación de carnes frescas
    procedentes de países de América del Sur, para tener en cuenta determinadas
    carnes procedentes de Uruguay'
  type: main
- language: sv
  script: Latn
  content: '94/334/EG: Kommissionens beslut av den 26 maj 1994 om ändring av beslut
    93/402/EEG om djurhälsovillkor och utfärdande av veterinärintyg vid import
    av färskt kött från länder i Sydamerika i syfte att beakta vissa köttyper
    från Uruguay'
