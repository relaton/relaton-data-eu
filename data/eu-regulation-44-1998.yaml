title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 44/98 of 8 January 1998 establishing, for
    1998, the list of vessels exceeding eight metres length overall permitted to fish
    for sole in certain Community areas using beam trawls whose aggregate length exceeds
    nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 44/98 de la Commission du 8 janvier 1998 établissant,
    pour 1998, la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 44/98 der Kommission vom 8. Januar 1998 zur Festlegung
    der Liste der Schiffe mit einer Länge über alles von mehr als 8 m, die 1998
    in bestimmten Seegebieten der Gemeinschaft beim Seezungenfang Baumkurren verwenden
    dürfen, deren Gesamtbaumlänge mehr als 9 m beträgt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 44/98 af 8. januar 1998 om listen for
    1998 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 44/98 της Επιτροπής της
    8ης Ιανουαρίου 1998 που καταρτίζει, για το 1998,
    τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 44/98, annettu 8 päivänä tammikuuta 1998,
    luettelon laatimisesta vuodeksi 1998 kokonaispituudeltaan kahdeksan metriä ylittävistä
    aluksista, joilla on lupa kalastaa kielikampelaa tietyillä yhteisön vyöhykkeillä
    kokonaispituudeltaan yhdeksän metriä ylittävien puomitroolien avulla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 44/98 della Commissione dell'8 gennaio 1998 che fissa
    l'elenco per il 1998 dei pescherecci di lunghezza fuori tutto superiore a otto
    metri autorizzati a pescare la sogliola in determinate zone della Comunità con
    reti a strascico a pali di lunghezza complessiva superiore a 9 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 44/98 van de Commissie van 8 januari 1998 tot vaststelling
    voor 1998 van de lijst van vaartuigen met een lengte over alles van meer dan acht
    meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale
    boomlengte meer dan negen meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 44/98 da Comissão de 8 de Janeiro de 1998 que estabelece,
    para 1998, a lista dos navios com mais de oito metros de comprimento de fora a
    fora autorizados a pescar linguado em determinadas zonas da Comunidade, utilizando
    redes de arrasto de vara em que o comprimento total das vara seja superior a nove
    metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 44/98 de la Comisión de 8 de enero de 1998 por el
    que se establece para 1998 la lista de barcos cuya eslora total excede los ocho
    metros y a los que se permite la pesca del lenguado dentro de determinadas zonas
    de la Comunidad utilizando artes de arrastre de vara cuya longitud total supere
    los nueve metros
  type: main
- language: sv
  script: Latn
  content: Kommissionens förördning (EG) nr 44/98 av den 8 januari 1998 om fastställande
    av förteckningen för år 1998 över fartyg med en största längd som överstiger
    åtta meter vilka vid fiske efter tunga inom vissa av gemenskapens områden har
    tillstånd att använda bomtrålar vars sammanlagda bomlängd överstiger nio
    meter
