title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 523/91 of 27 February 1991 extending the validity
    of Regulation (EEC) No 715/90 on the arrangements applicable to agricultural products
    and certain goods resulting from the processing of agricultural products originating
    in the ACP States or in the overseas countries and territories (OCT)
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 523/91 DU CONSEIL du 27 février 1991 prorogeant le
    règlement (CEE) no 715/90 relatif au régime applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d'' Afrique, des Caraïbes et du Pacifique (États ACP)
    ou des pays et territoires d'' outre-mer (PTOM) #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 523/91 DES RATES vom 27. Februar 1991 zur Verlängerung
    der Verordnung (EWG) Nr. 715/90 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den AKP-Staaten oder in den überseeischen Ländern und Gebieten (ÜLG) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 523/91 af 27. februar 1991 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 715/90 om den ordning, der skal
    gælde for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter
    med oprindelse i AVS-staterne eller i de oversøiske lande og territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 523/91 του Συμβουλίου
    της 27ης Φεβρουαρίου 1991 για την παράταση του
    κανονισμού (ΕΟΚ) αριθ. 715/90 σχετικά με το καθεστώς
    που εφαρμόζεται σε γεωργικά προϊόντα και σε
    ορισμένα εμπορεύματα που προκύπτουν από τη
    μεταποίηση γεωργικών προϊόντων, καταγωγής
    των κρατών ΑΚΕ ή των υπερποντίων χωρών και
    εδαφών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 523/91 DEL CONSIGLIO del 27 febbraio 1991 che proroga
    il regolamento (CEE) n. 715/90 relativo al regime applicabile a taluni prodotti
    agricoli ed a talune merci risultanti dalla trasformazione di prodotti agricoli
    originari degli Stati dell'' Africa, dei Caraibi e del Pacifico (Stati ACP) o
    dei paesi e territori d'' oltremare (PTOM) #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 523/91 VAN DE RAAD van 27 februari 1991 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 715/90 inzake de regeling voor
    landbouwprodukten en bepaalde door verwerking van landbouwprodukten verkregen
    goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied en de Stille
    Oceaan of uit de landen en gebieden overzee (LGO) #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 523/91 DO CONSELHO de 27 de Fevereiro de 1991 que
    prorroga o Regulamento (CEE) nº 715/90 relativo ao regime aplicável a produtos
    agrícolas e a certas mercadorias resultantes da transformação de produtos originários
    dos Estados de África, das Caraíbas e do Pacífico (Estados ACP) ou dos países
    e territórios ultramarinos (PTU) #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 523/91 DEL CONSEJO de 27 de febrero de 1991 por el
