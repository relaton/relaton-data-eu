title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant octroi du concours
    du FSE au bénéfice de la République française pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par le Ministère
    du travail, de l'emploi et de la population
  type: main
- language: de
  script: Latn
  content: '72/73/EWG: Entscheidung der Kommission vom 23. Dezember 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Französische
    Republik zu Aufwendungen für vom "Ministère du Travail, de l''Emploi et de la
    Population" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '72/73/CEE: Decisione della Commissione, del 23 dicembre 1971, che concede
    un contributo del Fondo sociale europeo alla Repubblica francese per spese concernenti
    operazioni di riqualificazione professionale effettuate dal «Ministère du travail,
    de l''emploi et de la population»'
  type: main
- language: nl
  script: Latn
  content: '72/73/EEG: Beschikking van de Commissie van 23 december 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Franse
    Republiek voor door het "Ministère du travail, de l''emploi et de la population"
    gemaakte herscholingskosten'
