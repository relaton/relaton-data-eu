  script: Latn
  content: Council Regulation (EEC) No 3687/87 of 8 December 1987 imposing a definitive
    anti-dumping duty on imports of mercury originating in the Soviet Union and definitively
    collecting the provisional anti-dumping duty imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3687/87 du Conseil du 8 décembre 1987 instituant
    un droit antidumping définitif sur les importations de mercure originaire d'
    Union soviétique et portant perception définitive du droit antidumping provisoire
    institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3687/87 des Rates vom 8. Dezember 1987 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Quecksilber mit Ursprung
    in der UdSSR und zur endgültigen Vereinnahmung des vorläufigen Antidumpingzolls
    auf diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3687/87 af 8. december 1987 om indførelse
    af en endelig antidumpingtold på importen af kviksølv med oprindelse i Sovjetunionen
    og om endelig opkrævning af den midlertidige antidumpingtold på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3687/87 του Συμβουλίου
    της 8ης Δεκεμβρίου 1987 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές υδραργύρου
    καταγωγής Σοβιετικής Ένωσης και για την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που έχει επιβληθεί στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3687/87 del Consiglio dell' 8 dicembre 1987 che istituisce
    un dazio antidumping definitivo sulle importazioni di mercurio originario dell'
    Unione Sovietica e decide la riscossione definitiva del dazio antidumping provvisorio
    su tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3687/87 van de Raad van 8 december 1987 tot instelling
    van een definitief anti-dumpingrecht op de invoer van kwik (kwikzilver) van oorsprong
    uit de Sowjetunie en houdende definitieve heffing van het op deze invoer ingestelde
    voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3687/87 do Conselho de 8 de Dezembro de 1987 que
    cria um direito anti-dumping definitivo sobre as importações de mercúrio da
    União Soviética e determina a cobrança definitiva do direito anti-dumping provisório
    criado sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3687/87 del Consejo de 8 de diciembre de 1987 por
    el que se establece un derecho antidumping definitivo respecto de las importaciones
    de mercurio originario de la Unión Soviética y se percibe definitivamente el
    derecho antidumping provisional establecido sobre dichas importaciones
  type: main
