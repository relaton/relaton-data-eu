title:
- language: en
  script: Latn
  content: Commission Directive 2002/23/EC of 26 February 2002 amending the Annexes
    to Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC as regards the fixing
    of maximum levels for pesticide residues in and on cereals, foodstuffs of animal
    origin and certain products of plant origin, including fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2002/23/CE de la Commission du 26 février 2002 modifiant les
    annexes des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil, en ce
    qui concerne la fixation de teneurs maximales pour les résidus de pesticides
    respectivement sur et dans les céréales, les denrées alimentaires d'origine
    animale et certains produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/23/EG der Kommission vom 26. Februar 2002 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates hinsichtlich
    der Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    auf und in Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/23/ЕО на Комисията от 26 февруари
    2002 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определяне на максимални количества
    на остатъци от пестициди във и върху зърнени
    култури, храни от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/23/ES ze dne 26. února 2002, kterou se mění přílohy
    směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS, pokud jde o stanovení maximálních
    limitů reziduí pesticidů v obilovinách, v potravinách živočišného původu
    a v některých produktech rostlinného původu, včetně ovoce a zeleniny, a
    na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/23/EF af 26. februar 2002 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester i og på korn, i og
    på levnedsmidler af animalsk oprindelse og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/23/ΕΚ της Επιτροπής, της 26ης Φεβρουαρίου
