  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/23/EÜ, 26. veebruar 2002, millega muudetakse
    direktiivide 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ (vastavalt teraviljas, loomses
    toidus ja teatavates taimsetes saadustes, kaasa arvatud puu- ja köögiviljas,
    sisalduvate ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise
    kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/23/EY, annettu 26 päivänä helmikuuta 2002,
    neuvoston direktiivien 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden muuttamisesta
    viljoissa ja niiden pinnassa, eläinkunnasta peräisin olevissa elintarvikkeissa
    ja niiden pinnassa sekä tietyissä kasvikunnasta peräisin olevissa tuotteissa,
    mukaan luettuina hedelmät ja vihannekset, ja niiden pinnassa olevien torjunta-ainejäämien
    enimmäismäärien vahvistamisen osalta
  type: main
