    οδηγιών του Συμβουλίου 86/362/ΕΟΚ, 86/363/ΕΟΚ και
    90/642/ΕΟΚ που αφορούν, αντιστοίχως, τον καθορισμό
    των ανωτάτων ορίων για τα υπολείμματα φυτοφαρμάκων
    πάνω και μέσα στα σιτηρά, στα τρόφιμα ζωικής
    προέλευσης και σε ορισμένα προϊόντα φυτικής
