    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található peszticid-szermaradványok megengedett legmagasabb mértékének meghatározására
    tekintettel a 86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv
    mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/23/CE della Commissione, del 26 febbraio 2002, recante modifica
    degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    che fissano le quantità massime di residui di antiparassitari rispettivamente
    sui e nei cereali, sui e nei prodotti alimentari di origine animale e su e in
    alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/23/EK (2002. gada 26. februāris), ar ko groza
    pielikumus Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK attiecībā
    uz pesticīdu atliekvielu maksimāli pieļaujamo daudzumu noteikšanu attiecīgi
    labībā un uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem, un dažos
    augu izcelsmes produktos, tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. vasario 26 d. Komisijos direktyva 2002/23/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių pesticidų
    likučių koncentracijų atitinkamai grūduose, gyvūninės kilmės maisto produktuose,
    tam tikruose augalinės kilmės produktuose, įskaitant vaisius ir daržoves,
    bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/23/KE tas-26 ta' Frar 2002 li temenda
    l-Annessi tad-Direttivi tal-Kunsill 86/362/KEE, 86/363/KEE u 90/642/KEE fir-rigward
    ta' l-iffissar tal-livelli massimi għal residwi tal-pestiċidi fi u fuq iċ-ċereali,
    l-ikel li ġej mill-annimali u ċerti prodotti li ġejjin mill-pjanti, inkluż
    l-frott u l-ħxejjex rispettivament
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/23/EG van de Commissie van 26 februari 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad tot vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    in en op respectievelĳk granen, levensmiddelen van dierlĳke oorsprong en bepaalde
    producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2002/23/WE z dnia 26 lutego 2002 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG i 90/642/EWG w odniesieniu do ustalania
    najwyższych dopuszczalnych poziomów pozostałości pestycydów w zbożach, środkach
    spożywczych pochodzenia zwierzęcego i niektórych produktach pochodzenia roślinnego,
    w tym odpowiednio owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/23/CE da Comissão, de 26 de Fevereiro de 2002, que altera
    os anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE no respeitante à
    fixação de teores máximos de resíduos de pesticidas à superfície e no interior
    dos cereais, dos géneros alimentícios de origem animal e de determinados produtos
    de origem vegetal, incluindo frutas e produtos hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/23/CE a Comisiei din 26 februarie 2002 de modificare a anexelor
    la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului în ceea
    ce privește stabilirea conținuturilor maxime de reziduuri de pesticide din și
    de pe cereale, alimente de origine animală și anumite produse de origine vegetală,
    inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/23/ES z 26. februára 2002, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    úrovní rezíduí pesticídov v a na obilninách, potravinách živočíšneho
    pôvodu a určitých výrobkoch rastlinného pôvodu vrátane ovocia, respektíve
    zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/23/ES z dne 26. februarja 2002 o spremembi prilog
    k direktivam Sveta 86/362/EGS, 86/363/EGS in 90/642/EGS v zvezi z določitvijo
    najvišjih mejnih vrednosti ostankov pesticidov v in na žitih, živilih živalskega
    izvora in nekaterih proizvodih rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/23/CE de la Comisión, de 26 de febrero de 2002, por la
    que se modifican los anexos de las Directivas 86/362/CEE, 86/363/CEE y 90/642/CEE
    del Consejo, en lo relativo a la fijación de los límites máximos de residuos
    de plaguicidas en cereales, en productos alimenticios de origen animal y en determinados
    productos de origen vegetal, incluidas las frutas y hortalizas, respectivamente
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/23/EG av den 26 februari 2002 om ändring av
