title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1291/76 of 1 June 1976 temporarily and totally
    suspending the customs duties applicable in the Community as originally constituted
    on a number of chemical products imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1291/76 du Conseil, du 1er juin 1976, portant suspension
    temporaire et totale des droits de douane applicables dans la Communauté dans
    sa composition originaire à un certain nombre de produits chimiques importés
    des nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1291/76 des Rates vom 1. Juni 1976 zur zeitweiligen
    und vollständigen Aussetzung der in der Gemeinschaft in ihrer ursprünglichen
    Zusammensetzung anwendbaren Zollsätze für die Einfuhr von einigen chemischen
    Waren aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1291/76 af 1. juni 1976 om midlertidig og
    fuldstændig suspension af de toldsatser, der i Fællesskabet i dets oprindelige
    udstrækning anvendes på visse kemiske produkter, der indføres fra de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1291/76 del Consiglio, del 1 giugno 1976, che sospende
    temporaneamente e totalmente i dazi doganali applicabili nella Comunità nella
    sua composizione originaria per un certo numero di prodotti chimici importati
    dai nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1291/76 van de Raad van 1 juni 1976 houdende tijdelijke
    en algehele schorsing van de douanerechten van toepassing in de Gemeenschap in
    haar oorspronkelijke samenstelling voor een aantal chemische produkten, ingevoerd
    uit de nieuwe Lid-Staten
