title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 540/68 du Conseil, du 29 avril 1968, fixant un montant
    compensatoire pour le blé tendre, le blé dur, l'orge et le maïs en stock à
    la fin de la campagne 1967/1968 et destinés à l'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 540/68 des Rates vom 29. April 1968 zur Festsetzung
    eines Ausgleichsbetrags für Weichweizen, Hartweizen, Gerste und Mais, die sich
    am Ende des Wirtschaftsjahres 1967/1968 auf Lager befinden und für die Ausfuhr
    bestimmt sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 540/68 del Consiglio, del 29 aprile 1968, che fissa
    un importo compensativo per il grano tenero, il grano duro, l'orzo e il granturco
    che si trovano in stock alla fine della campagna 1967/1968 e che sono destinati
    all'esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 540/68 van de Raad van 29 april 1968 tot vaststelling
    van een compenserend bedrag voor aan het einde van het verkoopseizoen 1967/1968
    in voorraad zijnde en voor uitvoer bestemde zachte tarwe, durum tarwe, gerst en
    maïs
  type: main
