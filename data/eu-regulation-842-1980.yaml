title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 842/80 of 2 April 1980 re-establishing the
    levying of customs duties on shawls, scarves, mufflers, mantillas, veils and the
    like, other than knitted or crocheted, of wool, of cotton or of man-made textile
    fibres, products of category 84 (code 0840), originating in the Philippines, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 842/80 de la Commission, du 2 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux châles,
    écharpes, foulards, cache-nez, cache-col, mantilles, voiles et voilettes, et
    articles similaires, autres qu' en bonneterie, de coton, de laine, de fibres textiles
    synthétiques ou artificielles, de la catégorie de produits n° 84 (code 0840),
    originaires des Philippines, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 842/80 der Kommission vom 2. April 1980 über die
    Wiedereinführung des Zollsatzes für Schals, Umschlagtücher, Halstücher, Kragenschoner,
    Kopftücher, Schleier und ähnliche Waren, andere als Wirkwaren, aus Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen, der Warenkategorie Nr. 84 (Kennziffer
    0840), mit Ursprung in Philippinen, dem die in der Verordnung (EWG) Nr. 2894/79
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 842/80 af 2. april 1980 om genindførelse
    af opkrævning af toldafgifter for sjaler, tørklæder, mantiller, slør o.lign.
    bortset fra varer af trikotage, af uld, bomuld, eller kemofibre under kategori
    84 (kode 0840), som har oprindelse i Filippinerne og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 842/80 della Commissione, del 2 aprile 1980, che ripristina
    la riscossione dei dazi doganali applicabili a scialli, sciarpe, fazzoletti da
    collo, sciarpette, mantiglie, veli e velette, e manufatti simili, esclusi quelli
    a maglia, di cotone, di lana, di fibre tessili sintetiche o artificiali, della
    categoria di prodotti n. 84 (codice 0840), originari delle Filippine beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 842/80 van de Commissie van 2 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sjaals,
    sjerpen, hoofddoeken en halsdoeken, mantilles, sluiers, voiles en dergelijke artikelen,
    andere dan van brei- of haakwerk, van wol, van katoen, van synthetische of van
    kunstmatige textielvezels, van de categorie van produkten nr. 84 (codenummer 0840),
    van oorsprong uit de Filippijnen, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
