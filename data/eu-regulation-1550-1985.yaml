    no cálculo das despesas de financiamento das intervenções que consistem em
    compras, armazenamentos e escoamentos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1550/85 de la Comisión, de 6 de junio de 1985, por
