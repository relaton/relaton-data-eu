  content: Commission Regulation (EEC) No 1550/85 of 6 June 1985 amending Regulation
    (EEC) No 467/77 on the method and the rate of interest to be used for calculating
    the costs of financing intervention measures comprising buying in, storage and
    disposal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1550/85 de la Commission du 6 juin 1985 modifiant le
    règlement (CEE) no 467/77 relatif à la méthode et au taux d' intérêt à appliquer
    pour le calcul des frais de financement des interventions consistant en achat,
    stockage et écoulement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1550/85 der Kommission vom 6. Juni 1985 zur Änderung
    der Verordnung (EWG) Nr. 467/77 über die Methode und den Zinssatz, die bei der
    Berechnung der Finanzierungskosten für Interventionen in Form von Ankauf, Lagerung
    und Absatz anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1550/85 af 6. juni 1985 om ændring
    af forordning (EØF) nr. 467/77 om den metode og den rentesats, der skal anvendes
    ved beregningen af finansieringsudgifter i forbindelse med interventioner i form
    af opkøb, oplagring og afsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1550/85 της Επιτροπής
    της 6ης Ιουνίου 1985 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 467/77 σχετικά με τη μέθοδο και το επιτόκιο
    που πρέπει να εφαρμοστεί στον υπολογισμό των
    εξόδων χρηματοδότησης των παρεμβάσεων που
    συνίστανται στην αγορά, αποθεματοποίηση και
    διάθεση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1550/85 della Commissione del 6 giugno 1985 che modifica
    il regolamento (CEE) n. 467/77, che stabilisce il metodo e il tasso d' interesse
    da utilizzare per il calcolo delle spese di finanziamento degli interventi costituiti
    da acquisti, magazzinaggio e vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1550/85 van de Commissie van 6 juni 1985 tot wijziging
    van Verordening (EEG) nr. 467/77 met betrekking tot de methode en de rentevoet
    die dienen te worden toegepast bij de berekening van de financieringskosten van
    de interventies in de vorm van aankoop, opslag en afzet
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1550/85 da Comissão, de 6 de Junho de 1985, que
