  script: Latn
  content: Commission Implementing Decision (EU) 2022/1945 of 21 February 2020 on
    documents to be issued by Member States pursuant to Article 18(1) and (4) and
    Article 26 of the Agreement on the withdrawal of the United Kingdom of Great Britain
    and Northern Ireland from the European Union and the European Atomic Energy Community
    (notified under document C(2020) 1114)
  type: main
- language: fr
  script: Latn
