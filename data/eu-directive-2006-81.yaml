title:
- language: en
  script: Latn
  content: Commission Directive 2006/81/EC of 23 October 2006 adapting Directive 95/17/EC
    as regards the non-inclusion of one or more ingredients on the list used for the
    labelling of cosmetic products and Directive 2005/78/EC as regards the measures
    to be taken against the emission of gaseous and particulate pollutants from engines
    for use in vehicles, by reason of the accession of Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Directive 2006/81/CE de la Commission du 23 octobre 2006 portant adaptation
    de la directive 95/17/CE en ce qui concerne la non-inscription d'un ou de plusieurs
    ingrédients sur la liste prévue pour l'étiquetage des produits cosmétiques
    et de la directive 2005/78/CE en ce qui concerne les mesures à prendre contre
    les émissions de gaz polluants et de particules polluantes provenant des moteurs
    destinés à la propulsion des véhicules, en raison de l'adhésion de la Bulgarie
    et de la Roumanie
  type: main
- language: de
  script: Latn
  content: Richtlinie 2006/81/EG der Kommission vom 23. Oktober 2006 zur Anpassung
    der Richtlinie 95/17/EG betreffend die Nichteintragung eines oder mehrerer Bestandteile
    in die für die Etikettierung kosmetischer Mittel vorgesehene Liste und der Richtlinie
    2005/78/EG über Maßnahmen gegen die Emission gasförmiger Schadstoffe und luftverunreinigender
    Partikel aus Motoren zum Antrieb von Fahrzeugen anlässlich des Beitritts Bulgariens
    und Rumäniens
  type: main
- language: bg
  script: Cyrl
  content: Директива 2006/81/EО на Комисията от 23 октомври
    2006 година за адаптиране на Директива 95/17/ЕО
    относно невключването на една или повече съставки
    от списъка, използван за етикетирането на козметични
    продукти, и Директива 2005/78/ЕО относно мерките,
    които се предприемат срещу емисии от замърсяващи
    газове и частици от двигатели за превозни средства,
    във връзка с присъединяването на България
    и Румъния
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2006/81/ES ze dne 23. října 2006 , kterou se v důsledku
    přistoupení Bulharska a Rumunska upravují směrnice 95/17/ES, pokud jde o nezařazení
    jedné nebo více přísad do seznamu používaného pro označování kosmetických
    prostředků, a směrnice 2005/78/ES, pokud jde o opatření proti emisím plynných
    znečišťujících látek a znečišťujících částic z motorů vozidel
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2006/81/EF af 23. oktober 2006 om tilpasning af
    direktiv 95/17/EF for så vidt angår dispensation til at en eller flere bestanddele
    ikke opføres på den liste, der er fastsat for etikettering af kosmetiske midler
    og direktiv 2005/78/EF for så vidt angår foranstaltninger mod emission af forurenende
    gasser og partikler fra motorer til fremdrift af køretøjer på grund af Bulgariens
    og Rumæniens tiltrædelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 2006/81/ΕΚ της Επιτροπής, της 23ης Οκτωβρίου
    2006 , για την προσαρμογή της οδηγίας 95/17/ΕΚ όσον
    αφορά τη μη αναγραφή ενός ή περισσοτέρων συστατικών
    στον κατάλογο που προβλέπεται για την επισήμανση
    των προϊόντων και της οδηγίας 2005/78/ΕΚ σχετικά
    με τα μέτρα που πρέπει να ληφθούν κατά των εκπομπών
    αερίων και σωματιδιακών ρύπων από τους κινητήρες
    που χρησιμοποιούνται σε οχήματα, λόγω της προσχώρησης
    της Βουλγαρίας και της Ρουμανίας
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2006/81/EÜ, 23. oktoober 2006 , millega kohandatakse
    direktiivi 95/17/EÜ seoses ühe või mitme koostisaine kandmatajätmisega kosmeetikatoodete
    märgistamisel kasutatavasse loetelusse ja direktiivi 2005/78/EÜ seoses meetmetega,
    mida võetakse sõidukite eralduvate gaasiliste ja tahkete osakeste heidete vastu,
    seoses Bulgaaria ja Rumeenia ühinemisega
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2006/81/EY, annettu 23 päivänä lokakuuta 2006 ,
    yhden tai useamman ainesosan ilmoittamatta jättämisestä luetteloon, joita kosmeettisten
    valmisteiden merkinnässä käytetään, annetun direktiivin 95/17/EY sekä ajoneuvojen
    moottoreiden kaasumaisten ja hiukkasmaisten päästöjen torjumiseksi toteutettavista
    toimenpiteistä annetun direktiivin 2005/78/EY mukauttamisesta Bulgarian ja Romanian
    liittymisen johdosta
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2006/81/EZ od 23. listopada 2006. o prilagodbi Direktive
    95/17/EZ s obzirom na izostavljanje jednog ili više sastojaka s popisa koji se
    koristi za označivanje kozmetičkih proizvoda i Direktive 2005/78/EZ o mjerama
    koje treba poduzeti protiv emisije plinovitih i krutih onečišćujućih tvari
    iz motora za primjenu u vozilima zbog pristupanja Bugarske i Rumunjske
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2006/81/EK irányelve ( 2006. október 23. ) Bulgária és
    Románia csatlakozása következtében a kozmetikai termékek címkézésénél
    használt listán szereplő egy vagy több összetevő mellőzésére vonatkozó
    95/17/EK irányelv és a járművek hajtására használt motorok gáz-halmazállapotú
    szennyezőanyag- és légszennyezőrészecske-kibocsátása elleni intézkedésekre
    vonatkozó 2005/78/EK irányelv kiigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/81/CE della Commissione, del 23 ottobre 2006 , che adegua
    la direttiva 95/17/CE riguardo alla non iscrizione di uno o più ingredienti nell'elenco
    previsto per l'etichettatura dei prodotti cosmetici e la direttiva 2005/78/CE
    riguardo ai provvedimenti da prendere contro l'emissione di inquinanti gassosi
    e di particolato prodotti dai motori ad accensione spontanea destinati alla propulsione
    di veicoli, a motivo dell’adesione della Bulgaria e della Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2006/81/EK ( 2006. gada 23. oktobris ), ar ko pielāgo
    Direktīvu 95/17/EK attiecībā uz vienas vai vairāku sastāvdaļu neiekļaušanu
    kosmētikas līdzekļu marķējuma sastāvdaļu sarakstā un Direktīvu 2005/78/EK
    attiecībā uz pasākumiem, kas jāveic, lai samazinātu gāzveida un daļiņveida
    piesārņotāju emisiju no motoriem, kuri paredzēti transportlīdzekļiem, saistībā
    ar Bulgārijas un Rumānijas pievienošanos
  type: main
- language: lt
  script: Latn
  content: 2006 m. spalio 23 d. Komisijos direktyva 2006/81/EB dėl Bulgarijos ir
    Rumunijos stojimo į Europos Sąjungą pritaikanti Direktyvą 95/17/EB dėl ženklinant
    kosmetikos gaminius į pateikiamą sąrašą neįtraukiamo vieno ar daugiau ingredientų
    ir Direktyvą 2005/78/EB dėl priemonių, kurių būtina imtis mažinant transporto
    priemonėse naudojamų variklių išmetamuosius dujinius bei kietųjų dalelių
    teršalus
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kummissjoni 2006/81/KE tat- 23 ta' Ottubru 2006 li tadatta
    d-Direttiva 95/17/KE dwar in-non-inklużjoni ta' ingredjent wieħed jew aktar
    fil-lista wżata għat-tikkettjar tal-prodotti kosmetiċi u d-Direttiva 2005/78/KE
    fir-rigward tal-miżuri li jridu jittieħdu kontra l-emissjoni ta' tniġġiż
    ta' gass u partikuli minn makni li jintużaw għall-vetturi, minħabba l-adeżjoni
    tar-Repubblika tal-Bulgarija u r-Rumanija.
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2006/81/EG van de Commissie van 23 oktober 2006 tot aanpassing
    van Richtlijn 95/17/EG met betrekking tot het niet vermelden van een of meer ingrediënten
    op de lijst voor etikettering van cosmetische producten en van Richtlijn 2005/78/EG
    met betrekking tot de maatregelen tegen de emissie van verontreinigende gassen
    en deeltjes door voertuigmotoren, in verband met de toetreding van Bulgarije en
    Roemenië
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2006/81/WE z dnia 23 października 2006 r. dostosowująca
    dyrektywę 95/17/WE w odniesieniu do nieumieszczania jednego lub kilku składników
    w wykazie używanym do etykietowania produktów kosmetycznych oraz dyrektywę
    2005/78/WE w odniesieniu do działań, jakie mają zostać podjęte w celu zapobiegania
    emisji zanieczyszczeń gazowych i pyłowych przez silniki stosowane w pojazdach,
    w związku z przystąpieniem Bułgarii i Rumunii
  type: main
- language: pt
  script: Latn
  content: Directiva 2006/81/CE da Comissão, de 23 de Outubro de 2006 , que adapta
    a Directiva 95/17/CE no que diz respeito à não inscrição de um ou de vários
    ingredientes na lista prevista para a rotulagem dos produtos cosméticos e a Directiva
    2005/78/CE no que diz respeito às medidas a tomar contra a emissão de gases
    e partículas poluentes provenientes dos motores utilizados em veículos, em virtude
    da adesão da Bulgária e da Roménia
  type: main
- language: ro
  script: Latn
  content: Directiva 2006/81/CE a Comisiei din 23 octombrie 2006 de adaptare a Directivei
    95/17/CE în ceea ce privește neincluderea unuia sau mai multor ingrediente pe
    lista folosită pentru etichetarea produselor cosmetice și a Directivei 2005/78/CE
    în ceea ce privește măsurile care trebuie luate împotriva emisiilor de gaze
    și de particule poluante provenite de la motoarele utilizate la vehicule, ca
    urmare a aderării Bulgariei și a României
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2006/81/ES z 23. októbra 2006 , ktorou sa z dôvodu pristúpenia
    Bulharska a Rumunska upravuje smernica 95/17/ES, pokiaľ ide o neuvedenie jednej
    alebo viacerých zložiek v zozname, ktorým sa označujú kozmetické výrobky,
    a smernica 2005/78/ES, pokiaľ ide o opatrenia, ktoré treba prijať proti emisiám
    plynných a tuhých znečisťujúcich látok z motorov určených na používanie
    vo vozidlách
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2006/81/ES z dne 23. oktobra 2006 o prilagoditvi Direktive
    95/17/ES v zvezi z nevključevanjem ene ali več sestavin na seznam, uporabljen
    za označevanje kozmetičnih izdelkov, in Direktive 2005/78/ES v zvezi z ukrepi,
    ki jih je treba sprejeti proti emisijam plinastih in trdnih onesnaževal iz motorjev,
    ki se uporabljajo v vozilih, zaradi pristopa Bolgarije in Romunije
  type: main
- language: es
  script: Latn
  content: Directiva 2006/81/CE de la Comisión, de 23 de octubre de 2006 , por la
    que se adapta la Directiva 95/17/CE en lo relativo a la exclusión de uno o varios
    ingredientes de la lista prevista para el etiquetado de productos cosméticos
    y la Directiva 2005/78/CE por lo que se refiere a los requisitos del sistema de
    supervisión del control de emisiones utilizable en los vehículos y a las exenciones
    aplicables a los motores de gas, con motivo de la adhesión de Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2006/81/EG av den 23 oktober 2006 om anpassning
    av direktiv 95/17/EG i fråga om befrielse från kravet att uppta en eller flera
    beståndsdelar i den förteckning som föreskrivs för märkning av kosmetiska
    produkter och av direktiv 2005/78/EG i fråga om åtgärder mot utsläpp av gas-
    och partikelformiga föroreningar från motorer som används i fordon med anledning
    av Bulgariens och Rumäniens anslutning
