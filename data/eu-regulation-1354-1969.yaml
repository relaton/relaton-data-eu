- language: en
  script: Latn
  content: Regulation (EEC) No 1354/69 of the Commission of 15 July 1969 further amending
    the Annex to Regulation No 451/67/EEC determining the quantity of potatoes required
    for the manufacture of 100 kg of starch
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1354/69 de la Commission, du 15 juillet 1969, portant
    nouvelle modification de l' annexe du règlement n° 451/67/CEE, déterminant
    la quantité de pommes de terre nécessaire à la fabrication de 100 kg de fécule
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1354/69 der Kommission vom 15. Juli 1969 zur erneuten
    Änderung des Anhangs der Verordnung Nr. 451/67/EWG zur Festsetzung der zur Herstellung
    von 100 kg Kartoffelstärke nötigen Menge Kartoffeln
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning nr. 1354/69/EØF af 15. juli 1969 om fornyet ændring
    af bilaget til forordning nr. 451/67/EØF om fastsættelse af den mængde kartofler,
    der er nødvendig til fremstilling af 100 kg kartoffelstivelse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1354/69 della Commissione, del 15 luglio 1969, recante
    nuova modifica all' allegato del regolamento n. 451/67/CEE che determina la quantità
    di patate necessaria per la fabbricazione di 100 kg di fecola
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1354/69 van de Commissie van 15 juli 1969 houdende
    nieuwe wijziging van de bijlage van Verordening nr. 451/67/EEG waarbij de hoeveelheid
    aardappelen, die benodigd is voor de vervaardiging van 100 kg zetmeel, wordt bepaald
