title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2106/74 of the Commission of 8 August 1974 amending
    Regulation (EEC) No 834/74 laying down requisite provisions to prevent the sugar
    market being disturbed as a result of the price increase in this sector for the
    1974/75 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2106/74 de la Commission, du 8 août 1974, modifiant
    le règlement (CEE) n° 834/74 établissant des mesures nécessaires pour éviter
    des perturbations sur le marché du sucre provoquées par l'augmentation des prix
    dans ce secteur pour la campagne sucrière 1974/1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2106/74 der Kommission vom 8. August 1974 zur Änderung
    der Verordnung (EWG) Nr. 834/74 über notwendige Maßnahmen zur Verhinderung von
    Störungen auf dem Zuckermarkt, hervorgerufen durch Preiserhöhungen in diesem
    Sektor für das Zuckerwirtschaftsjahr 1974/1975
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2106/74 af 8. august 1974 om ændring
    af forordning (EØF) nr. 834/74 om fastsættelse af nødvendige foranstaltninger
    til undgåelse af forstyrrelser på sukkermarkedet på grund af prisforhøjelsen
    i denne sektor for sukkerproduktionsåret 1974/1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2106/74 della Commissione, dell'8 agosto 1974, che
    modifica il regolamento (CEE) n. 834/74 che stabilisce le misure necessarie per
    evitare perturbazioni sul mercato dello zucchero provocate dall'aumento dei prezzi
    in tale settore per la campagna saccarifera 1974/1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2106/74 van de Commissie van 8 augustus 1974 houdende
    wijziging van Verordening (EEG) nr. 834/74 tot vaststelling van de maatregelen
    welke nodig zijn ter voorkoming van verstoringen van de suikermarkt ten gevolge
    van de prijsverhoging in deze sector voor het verkoopseizoen voor suiker 1974/1975
  type: main
