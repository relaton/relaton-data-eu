    degli Stati membri concernenti l'etichettatura e la presentazione dei prodotti
    alimentari destinati al consumatore finale nonché alla relativa pubblicità
  type: main
- language: nl
  script: Latn
  content: Richtlijn 93/102/EG van de Commissie van 16 november 1993 houdende wijziging
    van Richtlijn 79/112/EEG van de Raad betreffende de onderlinge aanpassing van
    de wetgevingen der Lid-Staten inzake de etikettering en presentatie van levensmiddelen
    bestemd voor de eindgebruiker alsmede inzake de daarvoor gemaakte reclame
  type: main
- language: pt
  script: Latn
  content: Directiva 93/102/CE da Comissão, de 16 de Novembro de 1993, que altera
    a Directiva 79/112/CEE do Conselho relativa à aproximação das legislações
    dos Estados- membros respeitantes à rotulagem, apresentação e publicidade dos
    géneros alimentícios destinados ao consumidor final
  type: main
- language: es
  script: Latn
  content: Directiva 93/102/CE de la Comisión, de 16 de noviembre de 1993, por la
