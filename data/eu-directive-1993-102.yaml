    samt om reklame for sådanne levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 93/102/ΕΚ της Επιτροπής της 16ης Νοεμβρίου
    1993 που τροποποιεί την οδηγία 79/112/ΕΟΚ του Συμβουλίου
    για την προσέγγιση των νομοθεσιών των κρατών
    μελών σχετικά με την επισήμανση και την παρουσίαση
    των τροφίμων που προορίζονται για τον τελικό
    καταναλωτή καθώς επίσης και τη διαφήμισή τους
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 93/102/EY, annettu 16 päivänä marraskuuta 1993,
    kuluttajalle myytäväksi tarkoitettujen elintarvikkeiden merkintöjä, esillepanoa
    ja mainontaa koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun
    neuvoston direktiivin 79/112/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 93/102/CE della Commissione, del 16 novembre 1993, recante modifica
