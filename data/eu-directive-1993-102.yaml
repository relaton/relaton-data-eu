  script: Latn
  content: Commission Directive 93/102/EC of 16 November 1993 amending Directive 79/112/EEC
    on the approximation of the laws of the Member States relating to the labelling,
    presentation and advertising of foodstuffs for sale to the ultimate consumer
  type: main
- language: fr
  script: Latn
  content: Directive 93/102/CE de la Commission, du 16 novembre 1993, portant modification
    de la directive 79/112/CEE du Conseil relative au rapprochement des législations
    des États membres concernant l'étiquetage et la présentation des denrées alimentaires
    destinées au consommateur final ainsi que la publicité faite à leur égard
  type: main
- language: de
  script: Latn
  content: Richtlinie 93/102/EG der Kommission vom 16. November 1993 zur Änderung
    der Richtlinie 79/112/EWG des Rates zur Angleichung der Rechtsvorschriften der
    Mitgliedstaaten über die Etikettierung und Aufmachung von für den Endverbraucher
    bestimmten Lebensmitteln sowie die Werbung hierfür
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 93/102/EF af 16. november 1993 om ændring af Rådets
    direktiv 79/112/EØF om tilnærmelse af medlemsstaternes lovgivning om mærkning
