title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3587/85 of 16 December 1985 amending, by
    reason of the accession of Spain and Portugal, Regulation (EEC) No 3321/82 as
    regards the list of fishery products and sizes qualifying for the carry-over premium
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3587/85 de la Commission du 16 décembre 1985 modifiant,
    en raison de l' adhésion de l' Espagne et du Portugal, le règlement (CEE) no
    3321/82 par l' extension de la liste des produits de la pêche ainsi que des tailles
    y afférentes admis au bénéfice de la prime de report
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3587/85 der Kommission vom 16. Dezember 1985 zur Änderung
    der Verordnung (EWG) Nr. 3321/82 hinsichtlich der Liste der für die Übertragungsprämie
    in Betracht kommenden Fischereierzeugnisse sowie der für diese geltenden Größen
    infolge des Beitritts von Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3587/85 af 16. december 1985 om ændring,
    som følge af Spaniens og Portugals tiltrædelse, af forordning (EØF) nr. 3321/82
    ved udvidelse af listen over sådanne fiskerivarer med angivelse af størrelse
    for hvilke der kan ydes prolongationspræmie
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3587/85 της Επιτροπής
    της 16ης Δεκεμβρίου 1985 για την τροποποίηση,
    λόγω της προσχώρησης της Ισπανίας και της Πορτογαλίας,
    του κανονισμού (ΕΟΚ) αριθ. 3321/82 με την επέκταση
    του καταλόγου των αλιευτικών προϊόντων καθώς
    και των σχετικών μεγεθών τους που είναι αποδεκτά
    για τη χορήγηση πριμοδότησης μεταφοράς
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3587/85 della Commissione del 16 dicembre 1985 che
    modifica, in seguito all' adesione della Spagna e del Portogallo, il regolamento
    (CEE) n. 3321/82, per quanto riguarda l' elenco dei prodotti della pesca e delle
    relative dimensioni ammessi al beneficio del premio di riporto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3587/85 van de Commissie van 16 december 1985 tot
    wijziging, wegens de toetreding van Spanje en Portugal, van Verordening (EEG)
    nr. 3321/82 wat de lijst van de visserijprodukten betreft waarvoor de uitstelpremie
    wordt toegekend en de betrokken grootteklassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3587/85 da Comissão, de 16 de Dezembro de 1985,
    que altera, em razão da adesão de Espanha e de Portugal, o Regulamento (CEE)
    n.° 3321/82, pela extensão da lista dos produtos da pesca bem como dos seus
    tamanhos admitidos ao benefício do prémio de reporte
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3587/85 de la Comisión, de 16 de diciembre de 1985,
    por el que se modifica, debido a la adhesión de España y de Portugal, el Reglamento
    (CEE) n° 3321/82 mediante la ampliación de la lista de los productos de la pesca
    así como de las tallas en ella relacionadas que pueden acogerse al beneficio
    de la prima de aplazamiento
