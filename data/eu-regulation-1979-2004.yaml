  content: Commission Regulation (EC) No 1979/2004 of 17 November 2004 adapting Regulation
    (EC) No 639/2003 laying down detailed rules pursuant to Council Regulation (EC)
    No 1254/1999 as regards requirements for the granting of export refunds related
    to the welfare of live bovine animals during transport by reason of the accession
    to the European Union of the Czech Republic, Estonia, Cyprus, Latvia, Lithuania,
    Hungary, Malta, Poland, Slovenia and Slovakia
  type: main
