title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3064/94 of 15 December 1994 derogating, for
    a period of two years, from Regulation (EEC) No 920/89 laying down quality standards
    for carrots, citrus fruit and dessert apples and pears as regards carrots produced
    in Sweden and determining, on a temporary basis, the conditions for the application
    of Regulation (EEC) No 920/89 as regards certain varieties of apple
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3064/94 de la Commission, du 15 décembre 1994, dérogeant,
    pour une période de deux ans, au règlement (CEE) n° 920/89 fixant des normes
    de qualité pour les carottes, les agrumes et le pommes et poires de table, en
    ce qui concerne les carottes produites en Suède et déterminant temporairement
    les conditions d'application du règlement (CEE) n° 920/89 en ce qui concerne
    certaines variétés de pommes
  type: main
- language: de
  script: Latn
