    Möhren, Zitrusfrüchte sowie Tafeläpfel und -birnen hinsichtlich der in Schweden
    erzeugten Möhren während zwei Jahren und zur Festlegung der vorläufigen Durchführungsbestimmungen
    zu der Verordnung (EWG) Nr. 920/89 hinsichtlich bestimmter Apfelsorten
  type: main
- language: da
