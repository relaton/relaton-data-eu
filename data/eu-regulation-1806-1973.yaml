id: EURegulation18061973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1806/73 of the Commission of 4 July 1973 re-establishing
    Common Customs Tariff duties on glazed setts, flags and paving, hearth and wall
    tiles, falling within heading No 69.08, originating in Hong Kong to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2762/72
    of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1806/73 de la Commission, du 4 juillet 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux autres carreaux, pavés et dalles de pavement et de revêtement, de la position
    tarifaire 69.08, originaires de Hongkong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1806/73 der Kommission vom 4. Juli 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Fliesen, gebrannte Pflastersteine,
    Boden- und Wandplatten, glasiert, der Tarifnummer 69.08, mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1806/73 af 4. juli 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for glaserede sten og fliser til brolægning,
    gulvbelægning eller beklædning af vægge, kaminer og lign., under position 69.08,
    som har oprindelse i Hong Kong og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1806/73 della Commissione, del 4 luglio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    altre piastrelle, blocchetti e lastre da pavimentazione o da rivestimento della
    voce doganale n. 69.08 originari di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1806/73 van de Commissie van 4 juli 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op andere plavuizen en andere vloer- en wandtegels van post 69.08,
    van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG) nr. 2762/72
    van de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
