---
id: EUDecision201799
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/99 of 18 January 2017 amending
    Decision 93/195/EEC as regards animal health and veterinary certification conditions
    for the re-entry of registered horses for racing, competition and cultural events
    after temporary export to Mexico and the United States of America, and amending
    Annex I to Decision 2004/211/EC as regards the entries for China and Mexico in
    the list of third countries and parts thereof from which imports into the Union
    of live equidae and semen, ova and embryos of the equine species are authorised
    (notified under document C(2017) 128)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/99 de la Commission du 18 janvier 2017
    modifiant la décision 93/195/CEE en ce qui concerne les conditions sanitaires
    et la certification sanitaire requises pour la réadmission de chevaux enregistrés
    en vue des courses, de la compétition et de manifestations culturelles après
    exportation temporaire au Mexique et aux États-Unis d'Amérique, et modifiant
    l'annexe I de la décision 2004/211/CE en ce qui concerne les mentions relatives
    à la Chine et au Mexique sur la liste des pays tiers et des parties de ces pays
    en provenance desquels les importations dans l'Union européenne d'équidés vivants
    et de sperme, d'ovules et d'embryons de l'espèce équine sont autorisées [notifiée
    sous le numéro C(2017) 128]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/99 der Kommission vom 18. Januar 2017
    zur Änderung der Entscheidung 93/195/EWG hinsichtlich der tierseuchenrechtlichen
    Bedingungen und der Beurkundung für die Wiedereinfuhr von registrierten Renn-,
    Turnier- und für kulturelle Veranstaltungen bestimmten Pferden nach vorübergehender
    Ausfuhr nach Mexiko und in die Vereinigten Staaten von Amerika sowie zur Änderung
    des Anhangs I der Entscheidung 2004/211/EG hinsichtlich der Einträge für China
    und Mexiko in der Liste von Drittländern und Teilen von Drittländern, aus denen
    die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    in die Union zugelassen ist (Bekannt gegeben unter Aktenzeichen C(2017) 128)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/99 на Комисията
    от 18 януари 2017 година за изменение на Решение
    93/195/ЕИО по отношение на ветеринарно-санитарните
    условия и ветеринарното сертифициране при
    повторното въвеждане на регистрирани коне
    за надбягвания, спортни състезания и културни
    прояви, след временен износ в Мексико и Съединените
    американски щати, и за изменение на приложение
    I към Решение 2004/211/ЕО по отношение на вписването
    за Китай и Мексико в списъка на трети страни
    и части от тях, от които е разрешен вносът в
    Съюза на живи еднокопитни и сперма, яйцеклетки
    и ембриони от еднокопитни животни (нотифицирано
    под номер С(2017) 128)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/99 ze dne 18. ledna 2017, kterým
    se mění rozhodnutí 93/195/EHS, pokud jde o veterinární podmínky a veterinární
    osvědčení pro zpětný dovoz evidovaných koní určených pro dostihy, soutěže
    a kulturní akce po jejich dočasném vývozu do Mexika a do Spojených států
    amerických, a příloha I rozhodnutí 2004/211/ES, pokud jde o položky týkající
    se Číny a Mexika v seznamu třetích zemí a částí jejich území, ze kterých
    je povolen dovoz živých koňovitých a spermatu, vajíček a embryí druhů
    koňovitých do Unie (oznámeno pod číslem C(2017) 128)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/99 af 18. januar 2017
    om ændring af Kommissionens beslutning 93/195/EØF for så vidt angår dyresundhedsmæssige
    betingelser og udstedelse af sundhedscertifikat ved genindførsel af heste, der
    er registreret med henblik på væddeløb, konkurrencer og kulturelle arrangementer,
    efter midlertidig udførsel til Mexico og USA og om ændring af bilag I til beslutning
    2004/211/EF for så vidt angår oplysninger om Kina og Mexico i listen over tredjelande
    og dele heraf, hvorfra import til Unionen af levende dyr af hestefamilien samt
    sæd, æg og embryoner fra dyr af hestefamilien er tilladt (meddelt under nummer
    C(2017) 128)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/99 της Επιτροπής,
    της 18ης Ιανουαρίου 2017, για την τροποποίηση
    της απόφασης 93/195/ΕΟΚ όσον αφορά τους υγειονομικούς
    όρους και την υγειονομική πιστοποίηση που
    απαιτούνται για την επανείσοδο εγγεγραμμένων
    ίππων προοριζόμενων για ιπποδρομίες, διαγωνισμούς
    και πολιτιστικές εκδηλώσεις μετά από προσωρινή
    εξαγωγή στο Μεξικό και τις Ηνωμένες Πολιτείες
    της Αμερικής, και για την τροποποίηση του παραρτήματος
    I της απόφασης 2004/211/ΕΚ όσον αφορά την καταχώριση
    της Κίνας και του Μεξικού στον κατάλογο των
    τρίτων χωρών και των περιοχών τους από τις
    οποίες εγκρίνονται εισαγωγές ζώντων ιπποειδών
    και σπέρματος, ωαρίων και εμβρύων ιπποειδών
    στην Ένωση [κοινοποιηθείσα υπό τον αριθμό C(2017)
    128]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/99, 18. jaanuar 2017, millega muudetakse
    otsust 93/195/EMÜ seoses loomatervisenõuetega ja veterinaarsertifikaatide väljastamise
    tingimustega registreeritud hobuste taassisenemiseks pärast võiduajamise, võistlemise
    ja kultuuriürituste tõttu toimunud ajutist eksporti Mehhikosse ja Ameerika Ühendriikidesse
    ning otsuse 2004/211/EÜ I lisa seoses Hiina ja Mehhiko lisamisega selliste kolmandate
    riikide ja nende territooriumi osade loetelusse, millest on lubatud importida
    elushobuslasi ning hobuslaste spermat, munarakke ja embrüoid (teatavaks tehtud
    numbri C(2017) 128 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/99, annettu 18 päivänä
    tammikuuta 2017, päätöksen 93/195/ETY muuttamisesta siltä osin kuin on kyse
    eläinten terveyttä ja eläinlääkärintodistuksia koskevista vaatimuksista
    rekisteröityjen hevosten takaisintuonnissa raveja, kilpailuja ja kulttuuritapahtumia
    varten tapahtuneen tilapäisen Meksikoon ja Amerikan yhdysvaltoihin viennin jälkeen
    ja päätöksen 2004/211/EY liitteen I muuttamisesta siltä osin kuin on kyse
    Kiinaa ja Meksikoa koskevista kohdista niiden kolmansien maiden ja kolmansien
    maiden alueiden luettelossa, joista elävien hevoseläinten ja hevoseläinten
    siemennesteen, munasolujen ja alkioiden tuonti unioniin on sallittua (tiedoksiannettu
    numerolla C(2017) 128)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/99 оd 18. siječnja 2017. o izmjeni
    Odluke 93/195/EEZ o uvjetima zdravlja životinja i veterinarskom certificiranju
    za ponovni ulazak registriranih konja za utrke, natjecanja i kulturna događanja
    nakon privremenog izvoza u Meksiko i Sjedinjene Američke Države te o izmjeni
    Priloga I. Odluci 2004/211/EZ u pogledu unosa za Kinu i Meksiko na popisu trećih
    zemalja i njihovih dijelova iz kojih je odobren uvoz u Uniju živih kopitara te
    sjemena, jajnih stanica i zametaka kopitara (pripoćeno pod brojem dokumenta C(2017)
    128)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/99 végrehajtási határozata (2017. január 18.)
    a 93/195/EGK határozatnak a lóverseny, lovassportrendezvények vagy kulturális
    események céljára szánt törzskönyvezett lovak Mexikóba és az Amerikai
    Egyesült Államokba történő ideiglenes kivitele utáni újrabehozatalára
    vonatkozó állat-egészségügyi feltételek és szükséges állatorvosi bizonyítványok
    tekintetében, valamint a 2004/211/EK határozat I. mellékletének az élő lófélék,
    továbbá a lófélék spermájának, petesejtjeinek és embrióinak az Unióba
    történő behozatalára feljogosított harmadik országok és azok részei jegyzékében
    a Kínára és Mexikóra vonatkozó bejegyzések tekintetében történő módosításáról
    (az értesítés a C(2017) 128. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/99 della Commissione, del 18 gennaio
    2017, che modifica la decisione 93/195/CEE per quanto riguarda le condizioni di
    polizia sanitaria e la certificazione veterinaria cui è subordinata la reintroduzione
    di cavalli registrati per corse, competizioni e manifestazioni culturali dopo
    un'esportazione temporanea in Messico e negli Stati Uniti d'America, che modifica
    l'allegato I della decisione 2004/211/CE per quanto concerne le voci relative
    alla Cina e al Messico figuranti nell'elenco dei paesi terzi e delle parti di
    paesi terzi da cui sono autorizzate le importazioni nell'Unione di equidi vivi
    nonché di sperma, ovuli ed embrioni della specie equina [notificata con il numero
    C(2017) 128]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/99 (2017. gada 18. janvāris),
    ar ko attiecībā uz dzīvnieku veselības un veterinārās sertifikācijas nosacījumiem
    skriešanās sacīkstēm, sacensībām un kultūras pasākumiem paredzētu reģistrētu
    zirgu atpakaļievešanai pēc pagaidu izvešanas uz Meksiku un Amerikas Savienotajām
    Valstīm groza Lēmumu 93/195/EEK un ar ko groza Lēmuma 2004/211/EK I pielikumu
    attiecībā uz ierakstu par Ķīnu un Meksiku to trešo valstu un to daļu sarakstā,
    no kurām Savienībā atļauts importēt dzīvus zirgu dzimtas dzīvniekus un
    to spermu, olšūnas un embrijus (izziņots ar dokumenta numuru C(2017) 128)
  type: main
- language: lt
  script: Latn
  content: 2017 m. sausio 18 d. Komisijos įgyvendinimo sprendimas (ES) 2017/99, kuriuo
    dėl gyvūnų sveikatos reikalavimų ir veterinarinio sertifikavimo pakartotinai
    įvežant registruotus arklius lenktynėms, varžyboms ir kultūriniams renginiams
    po jų laikino eksporto į Meksiką ir Jungtines Amerikos Valstijas iš dalies
    keičiamas Sprendimas 93/195/EEB ir dėl Kinijos ir Meksikos įrašų trečiųjų
    šalių ir jų dalių, iš kurių į Sąjungą leidžiama importuoti gyvus arklinių
    šeimos gyvūnus ir jų spermą, kiaušialąstes bei embrionus, sąraše iš dalies
    keičiamas Sprendimo 2004/211/EB I priedas (pranešta dokumentu Nr. C(2017) 128)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/99 tat-18 ta'
    Jannar 2017 li temenda d-Deċiżjoni 93/195/KEE dwar is-saħħa tal-annimali u
    l-kundizzjonijiet tagħhom u ċ-ċertifikazzjoni veterinarja tagħhom għad-dħul
    mill-ġdid ta' żwiemel reġistrati għat-tiġrija, kompetizzjoni u okkażjonijiet
    kulturali wara esportazzjoni temporanja lejn il-Messiku u l-Istati Uniti tal-Amerka,
    u li temenda l-Anness I tad-Deċiżjoni 2004/211/KE fir-rigward tal-annotazzjonijiet
    għaċ-Ċina u l-Messiku fil-lista ta' pajjiżi terzi u partijiet minnhom minn
    fejn huma awtorizzati l-importazzjonijiet fl-Unjoni ta' ekwidi ħajjin u ta' semen,
    ova u embrijuni tal-ispeċi ekwina (notifikata bid-dokument C(2017) 128)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/99 van de Commissie van 18 januari 2017 tot
    wijziging van Beschikking 93/195/EEG inzake veterinairrechtelijke voorschriften
    en veterinaire certificeringvoorwaarden voor het opnieuw binnenbrengen van geregistreerde
    paarden voor wedrennen, wedstrijden en culturele manifestaties na tijdelijke uitvoer
    naar Mexico en de Verenigde Staten van Amerika, en tot wijziging van bijlage I
    bij Beschikking 2004/211/EG wat betreft de gegevens over China en Mexico in de
    lijst van derde landen en delen daarvan waaruit levende paardachtigen en sperma,
    eicellen en embryo's van paarden in de Unie mogen worden ingevoerd (Kennisgeving
    geschied onder nummer C(2017) 128)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/99 z dnia 18 stycznia 2017 r. zmieniająca
    decyzję 93/195/EWG w odniesieniu do warunków dotyczących zdrowia zwierząt
    i świadectw weterynaryjnych przy powrotnym wwozie zarejestrowanych koni wyścigowych,
    biorących udział w zawodach i wykorzystywanych w wydarzeniach kulturalnych po
    wywozie czasowym do Meksyku i Stanów Zjednoczonych Ameryki, i zmieniająca załącznik
    I do decyzji 2004/211/WE w odniesieniu do wpisów dotyczących Chin i Meksyku
    w wykazie państw trzecich oraz części ich terytoriów, z których dozwolony
    jest przywóz do Unii żywych zwierząt z rodziny koniowatych, nasienia, komórek
    jajowych i zarodków koni (notyfikowana jako dokument nr C(2017) 128)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/99 da Comissão, de 18 de janeiro de 2017,
    que altera a Decisão 93/195/CEE no que diz respeito às condições sanitárias
    e de certificação veterinária para a reentrada de cavalos registados para corridas,
    concursos e acontecimentos culturais após exportação temporária para o México
    e os Estados Unidos da América, e que altera o anexo I da Decisão 2004/211/CE
    no que diz respeito às entradas relativas à China e ao México na lista de países
    terceiros e partes de países terceiros a partir dos quais são autorizadas as
    importações para a União de equídeos vivos e de sémen, óvulos e embriões
    de equídeos [notificada com o número C(2017) 128]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/99 a Comisiei din 18 ianuarie
    2017 de modificare a Deciziei 93/195/CEE în ceea ce privește condițiile de
    sănătate animală și de certificare veterinară pentru reintroducerea cailor
    înregistrați pentru curse, competiții și evenimente culturale după exportul
    temporar în Mexic și în Statele Unite ale Americii și de modificare a anexei
    I la Decizia 2004/211/CE în ceea ce privește rubricile referitoare la China
    și Mexic din lista țărilor terțe și a regiunilor acestora din care importurile
    în Uniune de ecvidee vii și de material seminal, de ovule și de embrioni din
    specia ecvină sunt autorizate [notificată cu numărul C(2017) 128]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/99 z 18. januára 2017, ktorým
    sa mení rozhodnutie 93/195/EHS, pokiaľ ide o veterinárne podmienky a podmienky
    veterinárnej certifikácie v prípade opakovaného vstupu registrovaných koní
    určených na dostihy, súťaže a kultúrne podujatia po dočasnom vývoze do
    Mexika a Spojených štátov amerických, a ktorým sa mení príloha I k rozhodnutiu
    2004/211/ES, pokiaľ ide o položky týkajúce sa Číny a Mexika v zozname tretích
    krajín a ich častí, z ktorých je povolený dovoz živých koňovitých a ich
    spermy, vajíčok a embryí do Únie [oznámené pod číslom C(2017) 128]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/99 z dne 18. januarja 2017 o spremembi
    Odločbe 93/195/EGS glede pogojev v zvezi z zdravjem živali in izdajanjem veterinarskih
    spričeval za ponovni vstop registriranih konjev za dirke, tekmovanja in kulturne
    prireditve po začasnem izvozu v Mehiko in Združene države Amerike ter o spremembi
    Priloge I k Odločbi 2004/211/ES glede vnosa za Kitajsko in Mehiko na seznamu
    tretjih držav in njihovih delov, iz katerih je dovoljen uvoz živih enoprstih
    kopitarjev ter njihovega semena, jajčnih celic in zarodkov v Unijo (notificirano
    pod dokumentarno številko C(2017) 128)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/99 de la Comisión, de 18 de enero de
    2017, que modifica la Decisión 93/195/CEE en lo relativo a las condiciones zoosanitarias
    y de certificación veterinaria necesarias para la reintroducción de caballos
    registrados para participar en carreras, concursos hípicos y actos culturales,
    después de su exportación temporal a México y a los Estados Unidos de América,
    y que modifica el anexo I de la Decisión 2004/211/CE en lo relativo a la entrada
    correspondiente a China y México en la lista de terceros países y partes de
    los mismos desde los que se autorizan importaciones en la Unión de équidos vivos
    y su esperma, sus óvulos y sus embriones [notificada con el número C(2017) 128]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/99 av den 18 januari 2017 om
    ändring av beslut 93/195/EEG vad gäller djurhälsovillkor och villkor för utfärdande
    av veterinärintyg för återinförsel av hästar som registrerats för kapplöpningar,
    tävlingar och kulturevenemang efter tillfällig export till Mexiko och Amerikas
    förenta stater, och om ändring av bilaga I till beslut 2004/211/EG vad gäller
    posterna för Kina och Mexiko i förteckningen över tredjeländer och delar av
    tredjeländer från vilka import till unionen av levande hästdjur och sperma,
    ägg och embryon från hästdjur är tillåten [delgivet med nr C(2017) 128]
  type: main
