---
id: EUDecision1997151
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/151/EC: Commission Decision of 4 February 1997 recognizing that the
    production of certain wines in specified regions and of certain vinho regional
    in Portugal, by reason of their qualitative characteristics, is far from able
    to satisfy demand (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/151/CE: Décision de la Commission du 4 février 1997 reconnaissant
    que la production de certains vins de qualité produits dans des régions déterminées
    et de certains vinho regional au Portugal est, du fait des caractéristiques qualitatives
    de ces vins, largement inférieure à la demande (Le texte en langue portugaise
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/151/EG: Entscheidung der Kommission vom 4. Februar 1997 zur Anerkennung,
    daß die Erzeugung von Qualitätsweinen bestimmter Anbaugebiete und von "vinho
    regional" in Portugal wegen qualitativer Merkmale der Nachfrage nicht entspricht
    (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/151/EF: Kommissionens beslutning af 4. februar 1997 om anerkendelse
    af, at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder og af
    visse »vinho regional« i Portugal på grund af disse vines kvalitative egenskaber
    langtfra er tilstrækkelig til at dække efterspørgslen (Kun den portugisiske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/151/ΕΚ: Απόφαση της Επιτροπής της 4ης Φεβρουαρίου
    1997 που αναγνωρίζει ότι η παραγωγή οίνων ποιότητας
    που παράγονται σε καθορισμένες περιοχές και
    ορισμένων vinho regional στην Πορτογαλία είναι, λόγω
    των ποιοτικών χαρακτηριστικών αυτών των οίνων,
    κατά πολύ μικρότερη από τη ζήτηση (Το κείμενο
    στην πορτογαλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/151/EY: Komission päätös, tehty 4 päivänä helmikuuta 1997, tiettyjen
    Portugalissa määritetyillä alueilla tuotettujen laatuviinien sekä tiettyjen
    "vinho regional" -pöytäviinien tuotannon toteamisesta niiden laatuominaisuuksien
    vuoksi huomattavasti kysyntää pienemmäksi (Ainoastaan portugalinkielinen teksti
    on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/151/CE: Decisione della Commissione del 4 febbraio 1997 con la quale
    si riconosce che la produzione di alcuni vini di qualità prodotti in regioni
    determinate e di taluni «vinho regional» in Portogallo è ampiamente inferiore
    alla domanda, in ragione delle caratteristiche qualitative di tali vini (Il testo
    in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/151/EG: Beschikking van de Commissie van 4 februari 1997 houdende erkenning
    van het feit dat de productie van bepaalde v.q.p.r.d.''s en bepaalde soorten "vinho
    regional" in Portugal, gezien de kwaliteitskenmerken van deze wijnen, ver bij
    de vraag achterblijft (Slechts de tekst in de Portugese taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/151/CE: Decisão da Comissão de 4 de Fevereiro de 1997 que reconhece
    que a produção em Portugal de determinados vinhos de qualidade produzidos em
    regiões determinadas e de determinados «vinhos regionais» é, pelas suas características
    de qualidade, substancialmente inferior à procura (Apenas faz fé o texto em
    língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '97/151/CE: Decisión de la Comisión de 4 de febrero de 1997 por la que
    se reconoce que la producción en Portugal de determinados vinos de calidad producidos
    en regiones determinadas y algunos «vinho regional» es muy inferior a la demanda,
    debido a sus características cualitativas (El texto en lengua portuguesa es el
    único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/151/EG: Kommissionens beslut av den 4 februari 1997 om förklarande
    av att produktionen av vissa kvalitetsviner från specificerade områden och av
    vissa "vinho regional" i Portugal, på grund av dessa viners kvalitativa egenskaper,
    ligger långt under efterfrågan (Endast den portugisiska texten är giltig)'
  type: main
