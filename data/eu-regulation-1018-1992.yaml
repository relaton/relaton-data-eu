title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1018/92 of 23 April 1992 re-establishing
    the levying of customs duties on products falling within CN codes 8527, 8528 and
    8529, originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1018/92 de la Commission du 23 avril 1992 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 8527, 8528 et 8529 applicables aux produits des codes NC 8527, 8528
    et 8529 originaires de Chine, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1018/92 DER KOMMISSION vom 23. April 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 8527, 8528 und 8529 mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1018/92 af 23. april 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8527, 8528 og 8529
    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1018/92 της Επιτροπής
