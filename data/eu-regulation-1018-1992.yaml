    εφαρμογής τελωνειακών δασμών για προϊόντα
    των κωδικών ΣΟ 8527, 8528 και 8529, καταγωγής Κίνας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1018/92 DELLA COMMISSIONE del 23 aprile 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 8527, 8528 e 8529 originari della Cina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1018/92 VAN DE COMMISSIE van 23 april 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 8527, 8528 en 8529, van oorsprong uit China, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
