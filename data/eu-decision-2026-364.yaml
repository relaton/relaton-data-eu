title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/364 of 19 February 2026 recognising
    that the report submitted by the Netherlands under Article 31(2) of Directive
    (EU) 2018/2001 of the European Parliament and of the Council contains accurate
    data for the purposes of measuring the greenhouse gas emissions associated with
    the cultivation of winter wheat, sugar beet, grain maize and winter rapeseed in
    that Member State
  type: main
- language: fr
  script: Latn
