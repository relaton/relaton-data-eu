    2026 reconnaissant que le rapport soumis par les Pays-Bas au titre de l’article
    31, paragraphe 2, de la directive (UE) 2018/2001 du Parlement européen et du
    Conseil contient des données précises aux fins de la mesure des émissions de
    gaz à effet de serre associées à la culture du blé d’hiver, de la betterave
    sucrière, du maïs-grain et du colza d’hiver dans ledit État membre
  type: main
