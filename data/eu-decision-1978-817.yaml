title:
- language: en
  script: Latn
  content: '78/817/EEC: Commission Decision of 19 September 1978 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of flax, falling within
    heading No ex 54.05 of the Common Customs Tariff, originating in Hungary and in
    free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/817/CEE: Décision de la Commission, du 19 septembre 1978, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    lin de la position ex 54.05 du tarif douanier commun, originaires de Hongrie et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/817/EWG: Entscheidung der Kommission vom 19. September 1978, mit der
    die Italienische Republik ermächtigt wird, aus Ungarn stammende und in den úbrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Flachs der Tarifnummer
    ex 54.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/817/EØF: Kommissionens beslutning af 19. september 1978 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af hør, som henhører under pos. ex 54.05 i den fælles toldtarif, har oprindelse
    i Ungarn og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/817/CEE: Decisione della Commissione, del 19 settembre 1978, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di lino
    della voce ex 54.05 della tariffa doganale comune, originari di Ungheria e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/817/EEG: Beschikking van de Commissie van 19 september 1978 waarbij
    de Italiaanse Republiek wordt gemachtigd weefsels van vlas, van post ex 54.05
    van het gemeenschappelijk douanetarief, van oorsprong uit Hongarije en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
