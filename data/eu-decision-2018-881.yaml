    do Conselho que altere o Regulamento (CE) n.° 1367/2006
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2018/881 a Consiliului din 18 iunie 2018 prin care se solicită
    Comisiei să prezinte un studiu privind opțiunile Uniunii pentru a răspunde
    constatărilor privind cauza ACCC/C/2008/32 ale Comitetului pentru examinarea
    respectării dispozițiilor Convenției de la Aarhus și, dacă este cazul, având
    în vedere rezultatele studiului, o propunere de regulament al Parlamentului European
    și al Consiliului de modificare a Regulamentului (CE) nr 1367/2006
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2018/881 z 18. júna 2018, ktorým sa Komisia žiada,
