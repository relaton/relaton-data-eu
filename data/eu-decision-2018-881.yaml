    dodržiavanie Aarhuského dohovoru vo veci ACCC/C/2008/32, a ak sa to ukáže
    vhodné s ohľadom na výsledky štúdie, návrh nariadenia Európskeho parlamentu
    a Rady, ktorým sa mení nariadenie (ES) č. 1367/2006
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2018/881 z dne 18. junija 2018 s pozivom Komisiji, da
    predloži študijo o možnostih Unije pri obravnavi ugotovitev Odbora za skladnost
    z Aarhuško konvencijo v zadevi ACCC/C/2008/32 in, če je ustrezno glede na rezultate
    študije, predlog uredbe Evropskega parlamenta in Sveta o spremembi Uredbe (ES)
    št. 1367/2006
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2018/881 del Consejo, de 18 de junio de 2018, por la que
    se insta a la Comisión a que presente un estudio acerca de las opciones de las
    que dispone la Unión para dar respuesta a las conclusiones del Comité de Cumplimiento
    del Convenio de Aarhus en relación con el asunto ACCC/C/2008/32 y, si resulta
    adecuado a la luz de los resultados del estudio, una propuesta de Reglamento del
    Parlamento Europeo y del Consejo por el que se modifique el Reglamento (CE) n.°
    1367/2006
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2018/881 av den 18 juni 2018 om en begäran till kommissionen
    att lägga fram en studie om unionens alternativ för att följa upp slutsatserna
    från Århuskonventionens efterlevnadskommitté i ärende ACCC/C/2008/32 och,
    om så är lämpligt med hänsyn till resultaten av studien, ett förslag till
    Europaparlamentets och rådets förordning om ändring av förordning (EG) nr
    1367/2006
