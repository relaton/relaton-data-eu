    tanulmány, valamint az 1367/2006/EK rendeletet módosító európai parlamenti
    és tanácsi rendeletre irányuló javaslat benyújtására való felkéréséről
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2018/881 del Consiglio, del 18 giugno 2018, che invita la
