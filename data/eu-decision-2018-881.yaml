title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/881 of 18 June 2018 requesting the Commission
    to submit a study on the Union's options for addressing the findings of the Aarhus
    Convention Compliance Committee in case ACCC/C/2008/32 and, if appropriate in
    view of the outcomes of the study, a proposal for a Regulation of the European
    Parliament and of the Council amending Regulation (EC) No 1367/2006
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/881 du Conseil du 18 juin 2018 invitant la Commission
    à soumettre une étude sur les moyens dont dispose l'Union pour répondre aux
    conclusions du comité d'examen du respect des dispositions de la convention d'Aarhus
    dans l'affaire ACCC/C/2008/32 et, le cas échéant pour tenir compte des résultats
    de l'étude, une proposition de règlement du Parlement européen et du Conseil
    modifiant le règlement (CE) n° 1367/2006
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/881 des Rates vom 18. Juni 2018 mit dem Ersuchen an
    die Kommission, eine Untersuchung der Möglichkeiten der Union, den Feststellungen
    des Ausschusses zur Überwachung der Einhaltung des Übereinkommens von Aarhus
    in der Sache ACCC/C/2008/32 Rechnung zu tragen und gegebenenfalls, in Anbetracht
    der Ergebnisse der Untersuchung, einen Vorschlag für eine Verordnung des Europäischen
    Parlaments und des Rates zur Änderung der Verordnung (EG) Nr. 1367/2006 zu unterbreiten
  type: main
- language: bg
  script: Cyrl
