  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2018/881 van de Raad van 18 juni 2018 met een verzoek aan
    de Commissie om met een studie te komen over de mogelijkheden waarover de Unie
    beschikt om zich te conformeren aan de bevindingen van het Comité van toezicht
    op de naleving van het Verdrag van Aarhus in zaak ACCC/C/2008/32 en, indien passend
    in het licht van de resultaten van de studie, een voorstel in te dienen voor een
    verordening van het Europees Parlement en de Raad tot wijziging van Verordening
    (EG) nr. 1367/2006
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2018/881 z dnia 18 czerwca 2018 r. wzywająca Komisję
