    dos Estados-membros, de funcionários nacionais envolvidos na aplicação da legislação
    comunitária necessária à realização do mercado interno que é objecto da
    Decisão 92/481/CEE do Conselho (programa Karolus)
  type: main
- language: es
  script: Latn
