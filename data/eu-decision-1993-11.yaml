title:
- language: en
  script: Latn
  content: '93/11/EEC: Commission Decision of 22 December 1992 establishing priority
    areas for the action plan for the exchange between Member State administrations
    of national officials who are engaged in the implementation of Community legislation
    required to achieve the internal market, adopted under Council Decision 92/481/EEC
    (Karolus Programme)'
  type: main
- language: fr
  script: Latn
  content: '93/11/CEE: Décision de la Commission, du 22 décembre 1992, fixant les
    domaines prioritaires pour le plan d'' action pour l'' échange, entre les administrations
    des Etats membres, de fonctionnaires nationaux chargés de la mise en oeuvre de
    la législation communautaire nécessaire à la réalisation du marché intérieur
    faisant l'' objet de la décision 92/481/CEE du Conseil (programme Karolus)'
  type: main
- language: de
  script: Latn
  content: '93/11/EWG: Entscheidung der Kommission vom 22. Dezember 1992 zur Festlegung
    der vorrangigen Bereiche für den mit der Entscheidung 92/481/EWG beschlossenen
    Aktionsplan für den zwischen den Verwaltungen der Mitgliedstaaten vorzunehmenden
    Austausch nationaler Beamter, die mit der zur Verwirklichung des Binnenmarktes
    erforderlichen Durchführung des Gemeinschaftsrechts betraut sind (Programm KAROLUS)'
  type: main
- language: da
  script: Latn
  content: '93/11/EØF: Kommissionens beslutning af 22. december 1992 vedrørende
    de prioriterede områder i handlingsplanen for udveksling mellem medlemsstaternes
    forvaltninger af nationale embedsmænd, som har til opgave at gennemføre de EF-forskrifter,
    som er nødvendige for virkeliggørelsen af det indre marked, jf. Rådets beslutning
    92/481/EØF (KAROLUS-programmet)'
  type: main
- language: el
  script: Grek
  content: '93/11/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1992 για τον καθορισμό των τομέων προτεραιότητας
    οι οποίοι αφορούν το πρόγραμμα δράσης το οποίο
    αποτελεί αντικείμενο της απόφασης 92/481/ΕΟΚ
    του Συμβουλίου σχετικά με την ανταλλαγή εθνικών
    υπαλλήλων μεταξύ των διοικήσεων των κρατών
    μελών, οι οποίοι είναι επιφορτισμένοι με την
    εφαρμογή της κοινοτικής νομοθεσίας που απαιτείται
    για την υλοποίηση της εσωτερικής αγοράς (Πρόγραμμα
    Karolus)'
  type: main
- language: it
  script: Latn
  content: '93/11/CEE: Decisione della Commissione, del 22 dicembre 1992, che stabilisce
    i settori prioritari del piano d'' azione per lo scambio, tra le amministrazioni
    degli Stati membri, di funzionari nazionali incaricati dell'' applicazione della
    normativa comunitaria necessaria per il completamento del mercato interno, oggetto
    della decisione 92/481/CEE (programma KAROLUS)'
  type: main
- language: nl
  script: Latn
  content: '93/11/EEG: Beschikking van de Commissie van 22 december 1992 tot vaststelling
    van de prioritaire werkterreinen van het actieprogramma voor de uitwisseling tussen
    ambtelijke diensten van de Lid-Staten, van nationale ambtenaren die belast zijn
    met de tenuitvoerlegging van communautaire wet- en regelgeving inzake de interne
    markt, dat het onderwerp uitmaakt van Beschikking 92/481/EEG van de Raad (Karolus-
    programma)'
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 22 de Dezembro de 1992, que estabelece os domínios
