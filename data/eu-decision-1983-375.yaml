title:
- language: en
  script: Latn
  content: '83/375/EEC: Commission Decision of 22 July 1983 inviting the Kingdom of
    Belgium to suspend the putting into effect of labelling measures embodied in draft
    national legalization on processed meat and meat products (Only the French and
    Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/375/CEE: Décision de la Commission du 22 juillet 1983 invitant la
    Belgique à surseoir à la mise en application de certaines dispositions d''étiquetage
    prévues par le projet de réglementation nationale relative à la viande préparée
    et aux préparations de viande (Les textes en langues française et néerlandaise
    sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/375/EWG: Entscheidung der Kommission vom 22. Juli 1983, mit der das
    Königreich Belgien ersucht wird, die Anwendung bestimmter Etikettierungsvorschriften
    in dem Entwurf einer innergemeinschaftlichen Regelung über Herstellung und Inverkehrbringen
    von zubereitetem Fleisch und Fleischerzeugnissen auszusetzen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/375/EØF: Kommissionens beslutning af 22. juli 1983 om opfordring af
    kongeriget Belgien til at udsætte anvendelsen af visse mærkningsbestemmelser
    omhandlet i et forslag til nationale bestemmelser om tilberedt kød og varer af
    kød (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/375/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Ιουλίου 1983 με την οποία καλείται το Βέλγιο
    να αναβάλει την εφαρμογή ορισμένων διατάξεων
    για την επισήμανση, οι οποίες προβλέπονται
    από εθνικό σχέδιο κανονιστικής ρυθμίσεως όσον
    αφορά το παρασκευασμένο κρέας και τα κρεατοπαρασκευάσματα
    (Τα κείμενα στην γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '83/375/CEE: Decisione della Commissione del 22 luglio 1983 che invita
    il Belgio a soprassedere alla messa in applicazione di talune disposizioni di
    etichettatura previste dal progetto di regolamentazione nazionale relativa alla
    carne preparata e alle preparazioni a base di carne (Il testi in lingua francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '83/375/EEG: Beschikking van de Commissie van 22 juli 1983 waarbij het
    Koninkrijk België wordt verzocht de toepassing op te schorten van bepaalde etiketteringsvoorschriften
    waarin het ontwerp voor een nationale regeling met betrekking tot bereid vlees
    en vleesbereidingen voorziet (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
  type: main
