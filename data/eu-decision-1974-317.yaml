title:
- language: en
  script: Latn
  content: '74/317/EEC: Commission Decision of 21 June 1974 concerning, inter alia,
    the setting of a time limit, as regards pigmeat, for the Commission Decision of
    8 May 1974 authorizing the Italian Republic to take certain protective measures
    under Article 108 (3) of the EEC Treaty'
  type: main
- language: fr
  script: Latn
  content: '74/317/CEE: Décision de la Commission, du 21 juin 1974, fixant notamment
    une date limite de la décision de la Commission, du 8 mai 1974, autorisant la
    République italienne à prendre certaines mesures de sauvegarde au titre de l''
    article 108 paragraphe 3 du traité CEE, en ce qui concerne le secteur de la viande
    de porc'
  type: main
- language: de
  script: Latn
  content: '74/317/EWG: Entscheidung der Kommission vom 21. Juni 1974 zur Festsetzung
    eines Endtermins in bezug auf Schweinefleisch für die Entscheidung der Kommission
    vom 8. Mai 1974, mit der die Italienische Republik ermächtigt wird, bestimmte
    Schutzmaßnahmen im Sinne von Artikel 108 Absatz 3 des Vertrages zu treffen'
  type: main
- language: da
  script: Latn
  content: '74/317/EØF: Kommissionens Beslutning af 21. juni 1974 navnlig om fastsættelse
    af en tidsgrænse for Kommissionens beslutning af 8. maj 1974 om bemyndigelse
    af Den italienske Republik til at træffe visse beskyttelsesforanstaltninger i
    henhold til artikel 108, stk. 3, i EØF-traktaten, for så vidt angår svinekød'
  type: main
- language: it
  script: Latn
  content: '74/317/CEE: Decisione della Commissione, del 21 giugno 1974, che fissa
    in particolare per il settore delle carni suine una data limite della decisione
    della Commissione, dell'' 8 maggio 1974, che autorizza la Repubblica italiana
    a prendere talune misure di salvaguardia ai sensi dell'' articolo 108, paragrafo
    3, del trattato CEE'
  type: main
- language: nl
  script: Latn
  content: '74/317/EEG: Beschikking van de Commissie van 21 juni 1974 waarbij met
    name een datum wordt vastgesteld waarop voor de sector varkensvlees de geldigheidsduur
    afloopt van de beschikking van de Commissie van 8 mei 1974 waarbij de Italiaanse
    Republiek wordt gemachtigd bepaalde vrijwaringsmaatregelen te treffen overeenkomstig
    artikel 108, lid 3, van het Verdrag'
