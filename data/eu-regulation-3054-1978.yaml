  content: Commission Regulation (EEC) No 3054/78 of 22 December 1978 allocating the
    Community quantitative export quotas for certain types of copper ash and residues
    and for certain types of copper, aluminium and lead waste and scrap
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3054/78 de la Commission, du 22 décembre 1978, portant
    répartition des contingents quantitatifs communautaires à l' exportation pour
    certaines cendres et certains résidus de cuivre ainsi que pour certains déchets
    et débris de cuivre, d' aluminium et de plomb
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3054/78 der Kommission vom 22. Dezember 1978 zur Aufteilung
    der mengenmäßigen Ausfuhrkontingente für bestimmte Aschen und Rückstände
    von Kupfer sowie für bestimmte Bearbeitungsabfälle und bestimmten Schrott aus
    Kupfer, Aluminium und Blei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3054/78 af 22. december 1978 om fordeling
