    visse restprodukter af kobber samt visse former for affald og skrot af kobber,
    aluminium og bly
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3054/78 della Commissione, del 22 dicembre 1978, che
    ripartisce i contingenti quantitativi comunitari all' esportazione per talune
    ceneri e per taluni residui di rame, nonché per taluni cascami e rottami di rame,
    di alluminio e di piombo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3054/78 van de Commissie van 22 december 1978 houdende
