title:
- language: fr
  script: Latn
  content: Décision du Conseil du 19 janvier 1970, portant dérogation à la décision
    du 9 octobre 1961 relative à l'uniformisation de la durée des accords commerciaux
    avec les pays tiers en ce qui concerne l'accord conclu entre la République fédérale
    d'Allemagne et Hong-Kong sur le commerce des textiles de coton
  type: main
- language: de
  script: Latn
  content: '70/79/EWG: Entscheidung des Rates vom 19. Januar 1970 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen mit dritten Ländern hinsichtlich des zwischen der Bundesrepublik
    Deutschland und Hongkong geschlossenen Abkommens über den Handel mit Baumwollspinnstoffen'
  type: main
- language: it
  script: Latn
  content: '70/79/CEE: Decisione del Consiglio, del 19 gennaio 1970, recante deroga
    alla decisione del 9 ottobre 1961 relativa all''uniformazione della durata degli
    accordi commerciali con i paesi terzi per quanto riguarda l''accordo concluso
    tra la Repubblica federale di Germania ed Hong Kong sul commercio dei tessili
    di cotone'
  type: main
- language: nl
  script: Latn
  content: '70/79/EEG: Beschikking van de Raad van 19 januari 1970 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden met derde landen, voor wat betreft het akkoord tussen de
    Bondsrepubliek Duitsland en Hong-Kong inzake de handel in katoentextiel'
  type: main
