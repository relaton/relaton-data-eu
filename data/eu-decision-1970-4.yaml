title:
- language: fr
  script: Latn
  content: Décision du Conseil du 20 décembre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux
    avec les pays tiers en ce qui concerne l'accord conclu entre le Benelux et Hong-Kong
    sur le commerce des textiles de coton
  type: main
- language: de
  script: Latn
  content: '70/4/EWG: Entscheidung des Rates vom 20. Dezember 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen mit dritten Ländern hinsichtlich des zwischen den Benelux-Ländern
    und Hongkong geschlossenen Abkommens über den Handel mit Baumwollspinnstoffen'
  type: main
- language: it
  script: Latn
  content: '70/4/CEE: Decisione del Consiglio, del 20 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali con i paesi terzi, per quanto riguarda l''accordo concluso
    fra il Benelux e Hong-Kong sul commercio dei tessili di cotone'
  type: main
- language: nl
  script: Latn
  content: '70/4/EEG: Beschikking van de Raad van 20 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden met derde landen, voor wat betreft het akkoord inzake de
    handel in katoentextiel tussen de Benelux-landen en Hong-Kong'
  type: main
