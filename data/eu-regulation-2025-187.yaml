    2025 om rättelse av genomförandeförordning (EU) 2022/415 om godkännande av
    äppelsyra, citronsyra framställd av Aspergillus niger DSM 25794, CGMCC 4513/CGMCC
    5751 eller CICC 40347/CGMCC 5343, sorbinsyra och kaliumsorbat, ättiksyra, natriumdiacetat
    och kalciumacetat, propionsyra, natriumpropionat, kalciumpropionat och ammoniumpropionat,
    myrsyra, natriumformiat, kalciumformiat och ammoniumformiat samt mjölksyra framställd
    av Bacillus coagulans (LMG S-26145 eller DSM 23965), Bacillus smithii (LMG S-27890)
    eller Bacillus subtilis (LMG S-27889) och kalciumlaktat som fodertillsatser för
    vissa djurarter
