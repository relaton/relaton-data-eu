  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 18 de marzo de 1991 por la que se fijan las
    cantidades globales de ayuda alimentaria con arreglo al programa de 1991 y se
    establece la lista de productos que deben suministrarse en concepto de ayuda alimentaria
    (91/187/CEE)
