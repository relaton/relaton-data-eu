  content: '91/187/EEC: Commission Decision of 18 March 1991 on the establishment
    of overall quantities of food aid for 1991 and a list of products to be supplied
    as food aid'
  type: main
- language: fr
  script: Latn
  content: '91/187/CEE: Décision de la Commission du 18 mars 1991 relative à la
    fixation des quantités globales d''aide alimentaire au titre du programme 1991
    et à l''établissement de la liste des produits à fournir à titre d''aide alimentaire'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 18. März 1991 zur Festlegung der Gesamtmengen
    der Nahrungsmittelhilfe im Rahmen des Programms für 1991 und zur Erstellung des
    Verzeichnisses der als Nahrungsmittelhilfe zu liefernden Erzeugnisse (91/187/EWG)
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 18. marts 1991 om fastsættelse af de samlede
    mængder fødevarehjælp i henhold til 1991-programmet og af listen over produkter,
    der kan leveres som fødevarehjælp (91/187/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/187/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Μαρτίου 1991 σχετικά με τον καθορισμό των συνολικών
    ποσοτήτων επισιτιστικής βοήθειας στο πλαίσιο
    του προγράμματος 1990 και την κατάρτιση του καταλόγου
    των προϊόντων που χορηγούνται ως επισιτιστική
    βοήθεια'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 marzo 1991 che determina i quantitativi
    globali e l'' elenco dei prodotti da fornire quale aiuto alimentare nell'' ambito
    del programma 1991 (91/187/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 18 maart 1991 tot vaststelling van de totale
    hoeveelheden voedselhulp voor het programma van 1991 en van de lijst van de als
    voedselhulp te leveren produkten (91/187/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 18 de Março de 1991 relativa à fixação das
    quantidades globais de ajuda alimentar a título do programa de 1991 e ao estabelecimento
