title:
- language: fr
  script: Latn
  content: Décision de la Commission n° 64/17/CEE, du 19 décembre 1963, autorisant
    la perception de taxes compensatoires à l'importation, en République fédérale
    d'Allemagne, de dextrines et d'amidons et fécules solubles ou torréfiés en
    provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '64/17/EWG: Entscheidung der Kommission vom 19. Dezember 1964 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von Dextrin, löslicher und gerösteter
    Stärke aus den anderen Mitgliedstaaten in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '64/17/CEE: Decisione della Commissione del 19 dicembre 1963 che autorizza
    la riscossione di tasse di compensazione all''importazione, nella Repubblica federale
    di Germania, di destrine, amidi, fecole solubili o torrefatte provenienti dagli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '64/17/EEG: Beschikking van de Commissie van 19 december 1963 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van dextrine en oplosbaar of geroost zetmeel uit de andere Lid-Staten'
  type: main
