title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 octobre 1972, portant octroi du concours
    du FSE, prévu à l'article 125 du Traité, au bénéfice de la République française
    pour des dépenses relatives à des opérations de rééducation professionnelle
    et de réinstallation effectuées par le Ministère des anciens combattants et
    victimes de guerre et le Ministère du travail, de l'emploi et de la population
  type: main
- language: de
  script: Latn
  content: '72/388/EWG: Entscheidung der Kommission vom 17. Oktober 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an die
    Französische Republik zu Aufwendungen für vom "Ministère des anciens combattants
    et victimes de guerre" und vom "Ministère du travail, de l''emploi et de la population"
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/388/CEE: Decisione della Commissione, del 17 ottobre 1972, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, alla Repubblica francese, per spese concernenti operazioni di
    riqualificazione professionale e di nuova sistemazione effettuate dal «Ministère
    des anciens combattants et victimes de guerre» e dal «Ministère du travail
    de l''emploi et de la population»'
  type: main
- language: nl
  script: Latn
  content: '72/388/EEG: Beschikking van de Commissie van 17 oktober 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van de Franse Republiek voor door het "Ministère
    des anciens combattants et victimes de guerre" en het "Ministère du travail,
    de l''emploi et de la population" gemaakte herscholings- en verplaatsingskosten'
