type: standard
title:
- language: en
  script: Latn
  content: Council Directive 82/890/EEC of 17 December 1982 amending the Directives
    on the approximation of the laws of the Member States relating to wheeled agricultural
    or forestry tractors
  type: main
- language: fr
  script: Latn
  content: Directive 82/890/CEE du Conseil, du 17 décembre 1982, modifiant les directives
    concernant le rapprochement des législations des États membres relatives aux
    tracteurs agricoles ou forestiers à roues
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/890/EWG des Rates vom 17. Dezember 1982 zur Änderung der
    Richtlinien zur Angleichung der Rechtsvorschriften der Mitgliedstaaten für land-
    und forstwirtschaftliche Zugmaschinen auf Rädern
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 17 декември 1982 година
    за изменение на директивите относно сближаването
    на законодателствата на държавите-членки за
    колесните селскостопански или горски трактори
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 17. prosince 1982, kterou se mění směrnice o sbližování
    právních předpisů členských států týkajících se kolových zemědělských
    nebo lesnických traktorů
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 82/890/EØF af 17. december 1982 om ændring af direktiverne
    om indbyrdes tilnærmelse af medlemsstaternes lovgivninger om landbrugs- og skovbrugshjultraktorer
  type: main
- language: el
  script: Grek
  content: Οδηγία 82/890/EOK του Συμβουλίου της 17ης Δεκεμβρίου
    1982 για την τροποποίηση των οδηγιών περί προσέγγισης
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους γεωργικούς ή δασικούς ελκυστήρες με
    τροχούς
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 17. detsember 1982, millega muudetakse direktiive põllu-
    ja metsamajanduslikke ratastraktoreid käsitlevate liikmesriikide õigusaktide
    ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 82/890/ETY, annettu 17 päivänä joulukuuta 1982,
    pyörillä varustettuja maatalous- ja metsätraktoreita koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annettujen direktiivien muuttamisesta
  type: main
- language: hr
  script: Latn
  content: '82/890/EEZ: Direktiva Vijeća od 17. prosinca 1982. o izmjeni direktiva
    o usklađivanju zakonodavstava država članica u odnosu na traktore na kotačima
    za poljoprivredu i šumarstvo'
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1982. december 17.) a kerekes mezőgazdasági vagy
    erdészeti traktorokra vonatkozó tagállami jogszabályok közelítéséről
    szóló irányelvek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 82/890/CEE del Consiglio, del 17 dicembre 1982, che modifica
    le direttive per il ravvicinamento delle legislazioni degli Stati Membri relative
    ai trattori agricoli o forestali a ruote
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1982. gada 17. decembris), ar ko groza direktīvas
    par dalībvalstu tiesību aktu tuvināšanu attiecībā uz lauksaimniecības un
    mežsaimniecības riteņtraktoriem
  type: main
- language: lt
  script: Latn
  content: 1982 m. gruodžio 17 d. Tarybos direktyva, iš dalies keičianti direktyvas
    dėl valstybių narių įstatymų, susijusių su ratiniais žemės ūkio ir miškų
    ūkio traktoriais, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tas-17 ta’ Diċembru 1982 li temenda d-Direttivi
    dwar l-approssimazzjoni tal-liġijiet ta’ l-Istati Membri rigward it-tratturi
    bir-roti għall-agrikoltura jew għall-forestrija
  type: main
- language: nl
  script: Latn
  content: Richtlijn 82/890/EEG van de Raad van 17 december 1982 houdende wijziging
    van de Richtlijnen inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten
    betreffende landbouw- en bosbouwtrekkers op wielen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 17 grudnia 1982 r. zmieniająca dyrektywy w sprawie
    zbliżenia ustawodawstw Państw Członkowskich odnoszących się do kołowych
    ciągników rolniczych lub leśnych
  type: main
- language: pt
  script: Latn
  content: Directiva 82/890/CEE do Conselho, de 17 de Dezembro de 1982, que altera
    as directivas relativas à aproximação das legislações dos Estados-Membros
    respeitantes aos tractores agrícolas ou florestais de rodas
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 17 decembrie 1982 de modificare a directivelor
    de apropiere a legislațiilor statelor membre cu privire la tractoarele agricole
    sau forestiere pe roți
  type: main
- language: sk
  script: Latn
  content: Smernica Rady zo 17. decembra 1982 ktorou sa menia a dopĺňajú smernice
    o aproximácii právnych predpisov členských štátov týkajúcich sa kolesových
    poľnohospodárskych a lesných traktorov
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 17. decembra 1982 o spremembi direktiv o približevanju
    zakonodaje držav članic o kmetijskih ali gozdarskih traktorjih na kolesih
  type: main
- language: es
  script: Latn
  content: Directiva 82/890/CEE del Consejo, de 17 de diciembre de 1982, por la que
    se modifican las Directivas relativas a la aproximación de las legislaciones
    de los Estados Miembros sobre los tractores agrícolas o forestales de ruedas
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 82/890/EEG av den 17 december 1982 om ändring av direktiven
    om tillnärmning av medlemsstaternas lagar och andra författningar om hjulburna
    jordbruks- eller skogstraktorer
  type: main
