    toteuttamisesta Uruguayn kierroksen neuvottelujen tulosten huomioon ottamiseksi
    maatalouden alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1903/96 del Consiglio del 27 settembre 1996 che stabilisce
    talune misure relative all'importazione di prodotti agricoli trasformati dalla
    Svizzera per tener conto dei risultati dei negoziati dell'Uruguay Round nel settore
    agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1903/96 van de Raad van 27 september 1996 tot vaststelling
