title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1903/96 of 27 September 1996 establishing certain
    measures concerning imports of processed agricultural products from Switzerland
    in order to take account of the results of the Uruguay Round negotiations in the
    agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1903/96 du Conseil du 27 septembre 1996 établissant
    certaines mesures concernant l'importation de produits agricoles transformés
    de Suisse pour tenir compte des résultats des négociations de l'Uruguay Round
    dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1903/96 des Rates vom 27. September 1996 über bestimmte
    Maßnahmen betreffend die Einfuhr von landwirtschaftlichen Verarbeitungserzeugnissen
    aus der Schweiz im Hinblick auf die Ergebnisse der Verhandlungen der Uruguay-Runde
    im Agrarbereich
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 1903/96 af 27. september 1996 om visse foranstaltninger
    vedrørende import af forarbejdede landbrugsprodukter fra Schweiz for at tage
    hensyn til resultaterne af Uruguay-rundens forhandlinger på landbrugsområdet
  type: main
- language: el
  script: Grek
