title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3029/85 of 29 October 1985 determining the
    amounts of the variable components and additional duties applicable from 1 November
    1985 to 31 January 1986 on the importation into the Community of goods covered
    by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3029/85 de la Commission, du 29 octobre 1985, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er novembre 1985 au 31 janvier 1986 inclus à l'importation
    dans la Communauté des marchandises relevant du règlement CEE n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3029/85 der Kommission vom 29. Oktober 1985 zur Festsetzung
    der Hohe der vom 1. November 1985 bis einschließlich 31. Januar 1986 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbetrage und Zusatzzö
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3029/85 af 29. oktober 1985 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. november 1985 til den 31. januar 1986
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3029/85 της Επιτροπής
    της 29ης Οκτωβρίου 1985 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά την περίοδο από
    1ης Νοεμβρίου 1985 μέχρι και 31ης Ιανουαρίου 1986
    κατά την εισαγωγή στην Κοινότητα εμπορευμάτων
    που υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3029/85 della Commissione, del 29 ottobre 1985, che
    determina gli importi degli elementi mobili e i dazi addizionali applicabili all'importazione
