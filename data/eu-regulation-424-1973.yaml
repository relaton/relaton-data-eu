    comunitario di uve secche, presentate in imballaggi immediati di contenuto netto
    di 15 kg o meno della sottovoce 08.04 B I della tariffa doganale comune, originari
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 424/73 van de Raad van 5 februari 1973 betreffende
