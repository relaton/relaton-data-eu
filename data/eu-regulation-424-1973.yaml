title:
- language: en
  script: Latn
  content: Regulation (EEC) No 424/73 of the Council of 5 February 1973 opening, allocating
    and providing for the administration of a Community tariff quota for dried grapes
    falling within subheading ex 08.04 B I of the Common Customs Tariff, originating
    in Spain, imported in immediate packings of a net capacity of 15 kg or less
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 424/73 du Conseil, du 5 février 1973, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs, présentés en emballages immédiats d'un contenu inférieur ou égal à
    15 kilogrammes, de la position 08.04 B I du tarif douanier commun, originaires
    d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 424/73 des Rates vom 5. Februar 1973 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 kg oder
    weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs, mit Ursprung in
    Spanien
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 424/73 af 5. februar 1973 om åbning, fordeling
