    af nettovægt 15 kg og derunder, henhørende under position 08.04 B I i den fælles
    toldtarif, med oprindelse i Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 424/73 del Consiglio, del 5 febbraio 1973, relativo
