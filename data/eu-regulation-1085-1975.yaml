- language: en
  script: Latn
  content: Regulation (EEC) No 1085/75 of the Commission of 25 April 1975 suspending
    the standing invitation to tender in respect of subsidies to be granted on sugar
    pursuant to Regulations (EEC) No 314/75, (EEC) No 557/75 and (EEC) No 558/75
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1085/75 de la Commission, du 25 avril 1975, relatif
    à la suspension des adjudications permanentes en matière de subventions à octroyer
    dans le secteur du sucre en vertu des règlements (CEE) n° 314/75, (CEE) n°
    557/75 et (CEE) n° 558/75
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1085/75 der Kommission vom 25. April 1975 zur Aussetzung
    der in den Verordnungen (EWG) Nr. 314/75, Nr. 557/75 und Nr. 558/75 vorgesehenen
    Dauerausschreibungen für die Gewährung von Subventionen im Zuckersektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1085/75 af 25. april 1975 om suspension
