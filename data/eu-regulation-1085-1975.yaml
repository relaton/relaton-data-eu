  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1085/75 della Commissione, del 25 aprile 1975, relativo
    alla sospensione delle gare permanenti in materia di sovvenzioni da accordare
    nel settore dello zucchero in virtù dei regolamenti (CEE) n. 314/75, (CEE) n.
    557/75 e (CEE) n. 558/75
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1085/75 van de Commissie van 25 april 1975 inzake
    de schorsing van de permanente openbare inschrijvingen met betrekking tot de in
    de suikersector te verlenen subsidies op grond van de Verordeningen (EEG) nr.
    314/75, (EEG) nr. 557/75 en (EEG) nr. 558/75
