    Herstellung von Schaumwein von der Bundesrepublik Deutschland eröffnet werden
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio relativa alla riduzione della percentuale minima
    di aumento dei contingenti globali aperti dalla Repubblica federale di Germania
    per l'importazione di vino da pasto e di un vino destinato alla fabbricazione
    di vini spumanti
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad houdende verlaging van het minimumpercentage voor
    de verruiming van de globale contingenten die door de Bondsrepubliek Duitsland
