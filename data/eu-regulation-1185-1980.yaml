id: EURegulation11851980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1185/80 of 12 May 1980 re-establishing the
    levying of customs duties on made up accessories for articles of apparel, other
    than knitted or crocheted, products of category 88 (code 0880), originating in
    Hong Kong, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1185/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres accessoires
    confectionnés du vêtement, autres qu' en bonneterie, de la catégorie de produits
    n° 88 (code 0880), originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1185/80 der Kommission vom 12. Mai 1980 über die
    Wiedereinführung des Zollsatzes für anderes konfektioniertes Bekleidungszubehör,
    andere als aus Gewirken, der Warenkategorie Nr. 88 (Kennziffer 0880), mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1185/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for konfektioneret tilbehør til beklædningsgenstande,
    ikke af trikotage under varekategori 88 (kode 0880), som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1185/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli altri accessori confezionati
    per oggetti di vestiario, esclusi quelli a maglia, della categoria di prodotti
    n. 88 (codice 0880), originari di Hong Kong, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1185/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander geconfectioneerd
    kledingtoebehoren, andere dan die van brei- of haakwerk, van de categorie van
    produkten nr. 88 (codenummer 0880), van oorsprong uit Hong-Kong, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
