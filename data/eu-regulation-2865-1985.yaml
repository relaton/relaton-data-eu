  script: Latn
  content: Regulamento (CEE) n.° 2865/85 da Comissão, de 14 de Outubro de 1985,
    que institui um direito anti-dumping provisório sobre as importações de alguns
    modelos de balanças electrónicas originárias do Japão e que aceita compromissos
    de preços relativamente a certas importações desses produtos originários do
    Japão, encerrando o respectivo processo
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2865/85 de la Comisión, de 14 de octubre de 1985,
    por el que se establece un derecho antidumping provisional sobre las importaciones
    de determinadas balanzas electrónicas originarias de Japón, se aceptan los compromisos
    y se concluye el procedimiento respecto a determinadas importaciones de dicho
    producto originario de Japón
