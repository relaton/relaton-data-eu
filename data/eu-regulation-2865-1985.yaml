  content: Commission Regulation (EEC) No 2865/85 of 14 October 1985 imposing a provisional
    anti-dumping duty on imports of certain electronic scales originating in Japan
    and accepting undertakings and terminating the proceeding in respect of certain
    imports of such products originating in Japan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2865/85 de la Commission, du 14 octobre 1985, instituant
    un droit antidumping provisoire sur les importations de certaines balances électroniques
    originaires du Japon et portant acceptation d'engagements de prix clôturant la
    procédure à l'égard de certaines importations des produits en CAUSE originaires
    du Japon
  type: main
