    Verarbeitung zu Butterschmalz zu herabgesetzten Preisen zu verkaufen'
  type: main
- language: it
  script: Latn
  content: '66/209/CEE: Decisione della Commissione, del 22 marzo 1966, che autorizza
    il Regno del Belgio a vendere a prezzo ridotto burro di ammasso pubblico dopo
    trasformazione in burro fuso'
  type: main
