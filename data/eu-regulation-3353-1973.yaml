  content: Regulation (EEC) No 3353/73 of the Council of 26 November 1973 on the implementation
    of Decision No 9/73 of the EEC/Austria Joint Committee supplementing and amending
    articles 24 and 25 of protocol No 3 concerning the definition of the concept of
    "originating products" and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3353/73 du Conseil, du 26 novembre 1973, concernant
    l'application de la décision n° 9/73 du Comité mixte CEE-Autriche complétant
    et modifiant les articles 24 et 25 du protocole n° 3 relatif à la définition
    de la notion de "produits originaires" et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3353/73 DES RATES VOM 26. NOVEMBER 1973 UEBER DIE
    DURCHFUEHRUNG DES BESCHLUSSES NR. 9/73 DES GEMISCHTEN AUSSCHUSSES EWG-OESTERREICH
    ZUR ERGAENZUNG UND AENDERUNG DER ARTIKEL 24 UND 25 DES PROTOKOLLS NR. 3 UEBER
    DIE BESTIMMUNG DES BEGRIFFS " ERZEUGNISSE MIT URSPRUNG IN " ODER " URSPRUNGSERZEUGNISSE
    " UND UEBER DIE METHODEN DER ZUSAMMENARBEIT DER VERWALTUNGEN
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3353/73 af 26. november 1973 om anvendelse
    af beslutning nr. 9/73, truffet af Den blandede Komité, EØF-Østrig, der supplerer
    og ændrer artiklerne 24 og 25 i Protokol nr. 3 om definitionen af begrebet »varer
    med oprindelsesstatus« og om metoderne for administrativt samarbejde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3353/73 του Συμβουλίου,
    της 26ης Νοεμβρίου 1973, περί της εφαρμογής της
    απόφασης αριθμός 9/73 της Μικτής Επιτροπής ΕΟΚ-Αυστρίας
    με την οποία συμπληρώνονται και τροποποιούνται
    τα άρθρα 24 και 25 του πρωτοκόλλου υπ'αριθ. 3 σχετικά
    με τον καθορισμό της έννοιας «προϊόντα καταγωγής»
    και των μεθόδων διοικητικής συνεργασίας
  type: main
- language: it
  script: Latn
