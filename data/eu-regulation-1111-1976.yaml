title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1111/76 of 13 May 1976 re-establishing the
    levying of customs duties on other butyl alcohols falling within subheading 29.04
    A III b), originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1111/76 de la Commission, du 13 mai 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres alcools
    butyliques, de la sous-position tarifaire 29.04 A III b), originaires de Roumanie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1111/76 der Kommission vom 13. Mai 1976 zur Wiedereinführung
    des Zollsatzes für andere Butylalkohole der Tarifstelle 29.04 A III b) mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November
    1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1111/76 af 13. maj 1976 om genindførelse
    af opkrævning af toldafgifter for andre buthylalkoholer, under underposition
    29.04 A III b), som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1111/76 della Commissione, del 13 maggio 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli altri alcoli butilici
    della sottovoce doganale 29.04 A III b), originari della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1111/76 van de Commissie van 13 mei 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere butylalcoholen,
    van onderverdeling 29.04 A III b), van oorsprong uit Roemenië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
