title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3602/93 of 21 December 1993 amending Regulation
    (EEC) No 3900/92 laying down the special rules of application for the Community
    import arrangements for certain species of preserved tuna, bonito and sardines
    and fixing the quantities of those products which may be imported
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3602/93 de la Commission du 21 décembre 1993 modifiant
    le règlement (CEE) n° 3900/92 établissant les modalités d'application particulières
    du régime communautaire d'importation de conserves de certaines espèces de thon,
    de bonites et de sardines et fixant les quantités de ces produits admises à
    l'importation
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3602/93 DER KOMMISSION vom 21. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 3900/92 mit besonderen Durchführungsbestimmungen zu
    der Einfuhrregelung für bestimmte Thunfisch-, Bonito- und Sardinenkonserven und
    zur Festsetzung der zugelassenen Einfuhrmengen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3602/93 af 21. december 1993 om ændring
    af forordning (EØF) nr. 3900/92 om særlige gennemførelsesbestemmelser for Fællesskabets
    importordning for konserves af visse arter af tunfisk, bonit og sardin og om fastsættelse
    af de mængder af samme produkter, der kan indføres
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3602/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Δεκεμβρίου 1993 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3900/93 που αφορά τη θέσπιση των ειδικών
    λεπτομερειών εφαρμογής του κοινοτικού καθεστώτος
    εισαγωγής κονσέρβας ορισμένων ειδών τόνου,
    παλαμίδας και σαρδέλας και για καθορισμό των
    ποσοτήτων αυτών των προϊόντων που εγκρίνονται
    για εισαγωγή
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3602/93 DELLA COMMISSIONE del 21 dicembre 1993 recante
    modifica del regolamento (CEE) n. 3900/92 che stabilisce le modalità particolari
    di applicazione del regime comunitario di importazione per le conserve di talune
    specie di tonno, di palamita e di sardine e che fissa i quantitativi di tali prodotti
    ammessi all' importazione
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3602/93 VAN DE COMMISSIE van 21 december 1993 tot
    wijziging van Verordening (EEG) nr. 3900/92 houdende uitvoeringsbepalingen van
    de communautaire invoerregeling voor conserven van bepaalde soorten tonijn, boniet
    en sardines, alsmede de hoeveelheden van deze produkten die mogen worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3602/93 DA COMISSÃO de 21 de Dezembro de 1993 que
    altera o Regulamento (CEE) nº 3900/92 que estabelece as normas de execução
    específicas do regime comunitário de importação de conservas de determinadas
    espécies de atum, de bonito e de sardinha e fixa as quantidades destes produtos
    admitidas para importação
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3602/93 DE LA COMISIÓN de 21 de diciembre de 1993
    por el que se modifica el Reglamento (CEE) nº 3900/92 por el que se establecen
    las disposiciones especiales de aplicación del régimen comunitario de importación
    de conservas de determinadas especies de atún, bonito y sardinas y por el que
    se fijan las cantidades de estos productos que se admiten para importación
  type: main
