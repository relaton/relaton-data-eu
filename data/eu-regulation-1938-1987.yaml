title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1938/87 of 3 July 1987 re-establishing the
    levying of customs duties on handkerchiefs, products of category 19 (code 40.0190),
    women' s or girls' suits and ensembles, products of category 29 (code 40.0290),
    track suits, products of category 73 (code 40.0730), and women' s or girls' suits
    and ensembles, products of category 74 (code 40.0740) originating in Pakistan
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3925/86
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1938/87 de la Commission du 3 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes de la catégorie de produits n° 19 (code 40.0190), aux costumes-tailleurs
    et ensembles pour femmes de la catégorie de produits n° 29 (code 40.0290), aux
    survêtements de sport de la catégorie de produits n° 73 (code 40.0730) et aux
    costumes-tailleurs et ensembles pour femmes de la catégorie de produits n° 74
    (code 40.0740), originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
