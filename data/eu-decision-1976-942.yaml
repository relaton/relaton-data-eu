type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 December 1976 authorizing the French Republic
    to permit temporarily the marketing of seed of white clover and red clover not
    satisfying existing Community requirements
  type: main
- language: fr
  script: Latn
  content: '76/942/CEE: Décision de la Commission, du 2 décembre 1976, autorisant
    notamment la République française à admettre temporairement la commercialisation
    de semences de trèfle blanc et de trèfle violet, ne répondant pas aux conditions
    prévues par les dispositions communautaires'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. Dezember 1976 zur Ermächtigung insbesondere
    der Französischen Republik, nicht den Anforderungen der Gemeinschaftsvorschriften
    entsprechendes Saatgut von Weißklee und Rotklee vorübergehend zum Verkehr zuzulassen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 2. december 1976 om bemyndigelse, især til
    Den franske Republik, til midlertidigt at tillade handel med frø af hvidkløver
    og rødkløver, der ikke opfylder de betingelser, der stilles ved fællesskabsbestemmelserne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 dicembre 1976, che autorizza in particolare
    la Repubblica francese ad ammettere temporaneamente la commercializzazione di
    sementi di trifoglio bianco e di trifoglio violetto che non soddisfano alle condizioni
    previste dalle disposizioni comunitarie
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 december 1976 houdende machtiging van
    de Franse Republiek om tijdelijk niet de door de gemeenschapsbepalingen gestelde
    voorwaarden vervullend zaad van witte klaver en van rode klaver tot de handel
    toe te laten
  type: main
