    ja levimise vastu võetavad meetmed ning tunnistatakse kehtetuks otsus 2012/138/EL
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/2095, annettu 28 päivänä
    lokakuuta 2022, toimenpiteistä Anoplophora chinensis (Forster) -organismin unionin
    alueelle kulkeutumisen, asettumisen ja siellä leviämisen estämiseksi sekä
    päätöksen 2012/138/EU kumoamisesta
  type: main
- language: ga
  script: Latn
