    за предотвратяване въвеждането, установяването
    и разпространението на територията на Съюза
    на Anoplophora chinensis (Forster) и за отмяна на Решение
    2012/138/ЕС
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2095 ze dne 28. října 2022,
