title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2095 of 28 October 2022 establishing
    measures to prevent the introduction into, establishment and spread within the
    Union territory of Anoplophora chinensis (Forster) and repealing Decision 2012/138/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2095 de la Commission du 28 octobre
    2022 instituant des mesures destinées à prévenir l’introduction, l’établissement
    et la dissémination d’Anoplophora chinensis (Forster) sur le territoire de
    l’Union et abrogeant la décision 2012/138/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2095 der Kommission vom 28. Oktober
    2022 zur Einführung von Maßnahmen zum Schutz der Union gegen die Einschleppung,
    Etablierung und Ausbreitung von Anoplophora chinensis (Forster) und zur Aufhebung
    des Beschlusses 2012/138/EU
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2095 на Комисията
