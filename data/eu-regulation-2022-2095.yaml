    (Forster) do Unie a jeho usídlení a rozšiřování na území Unie a kterým
    se ruší rozhodnutí 2012/138/EU
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2095 af 28. oktober 2022
    om fastsættelse af foranstaltninger mod indførsel, etablering og spredning i
    Unionens område af Anoplophora chinensis (Forster) og om ophævelse af afgørelse
    2012/138/EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/2095 της Επιτροπής
    της 28ης Οκτωβρίου 2022 σχετικά με τη θέσπιση
    μέτρων για την πρόληψη της εισαγωγής, της εγκατάστασης
    και της εξάπλωσης στο έδαφος της Ένωσης του
    Anoplophora chinensis (Forster) και για την κατάργηση της
    απόφασης 2012/138/ΕΕ
  type: main
- language: et
  script: Latn
