title:
- language: en
  script: Latn
  content: '2000/806/EC: Commission Decision of 11 December 2000 amending Decision
    2000/114/EC on the eligibility of expenditure to be incurred by certain Member
    States in 2000 for the purpose of introducing monitoring and control systems applicable
    to the common fisheries policy (notified under document number C(2000) 3729)'
  type: main
- language: fr
  script: Latn
  content: '2000/806/CE: Décision de la Commission du 11 décembre 2000 modifiant
    la décision 2000/114/CE relative à l''admissibilité des dépenses prévues
    par certains États membres au cours de l''année 2000 pour la mise en oeuvre
    des régimes de surveillance et de contrôle applicables à la politique commune
    de la pêche [notifiée sous le numéro C(2000) 3729]'
  type: main
- language: de
  script: Latn
