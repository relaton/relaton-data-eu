title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1728/1999 of 29 July 1999 imposing a definitive
    anti-dumping duty on imports of synthetic fibres of polyesters originating in
    Taiwan and terminating the proceeding in respect of imports of synthetic fibres
    of polyesters originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1728/1999 du Conseil, du 29 juillet 1999, instituant
