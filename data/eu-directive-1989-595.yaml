---
id: EUDirective1989595
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 89/595/EEC of 10 October 1989 amending Directive 77/452/EEC
    concerning the mutual recognition of diplomas, certificates and other evidence
    of the formal qualifications of nurses responsible for general care, including
    measures to facilitate the effective exercise of the right of establishment and
    freedom to provide services, and amending Directive 77/453/EEC concerning the
    coordination of provisions laid down by law, regulation or administrative action
    in respect of the activities of nurses responsible for general care
  type: main
- language: fr
  script: Latn
  content: Directive 89/595/CEE du Conseil du 10 octobre 1989 modifiant la directive
    77/452/CEE visant à la reconnaissance mutuelle des diplômes, certificats et
    autres titres d'infirmier responsable des soins généraux et comportant des mesures
    destinées à faciliter l'exercice effectif du droit d'établissement et de libre
    prestation de services, ainsi que la directive 77/453/CEE visant à la coordination
    des dispositions législatives, réglementaires et administratives concernant
    les activités de l'infirmier responsable des soins généraux
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/595/EWG des Rates vom 10. Oktober 1989 zur Änderung der
    Richtlinie 77/452/EWG über die gegenseitige Anerkennung der Diplome, Prüfungszeugnisse
    und sonstigen Befähigungsnachweise der Krankenschwester und des Krankenpflegers,
    die für die allgemeine Pflege verantwortlich sind, und über Maßnahmen zur Erleichterung
    der tatsächlichen Ausübung des Niederlassungsrechts und des Rechts auf freien
    Dienstleistungsverkehr sowie der Richtlinie 77/453/EWG zur Koordinierung der Rechts-
    und Verwaltungsvorschriften für die Tätigkeiten der Krankenschwester und des
    Krankenpflegers, die für die allgemeine Pflege verantwortlich sind
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 10 октомври 1989 година
    за изменение на Директива 77/452/ЕИО относно взаимното
    признаване на дипломи, удостоверения и други
    официални документи за професионална квалификация
    на медицински сестри с общ профил, включително
    и за мерките за улесняване на ефективното упражняване
    на правото на установяване и свободата на предоставяне
    на услуги, както и на Директива 77/453/ЕИО относно
    координиране на законовите, подзаконовите
    и административните разпоредби, отнасящи се
    до дейността на медицинските сестри с общ профил
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 10. října 1989, kterou se mění směrnice 77/452/EHS
    o vzájemném uznávání diplomů, osvědčení a jiných dokladů o dosažené
    kvalifikaci zdravotních sester a ošetřovatelů odpovědných za všeobecnou
    péči, obsahující opatření pro usnadnění účinného výkonu práva usazování
    a volného pohybu služeb, a směrnice 77/453/EHS o koordinaci právních a správních
    předpisů týkajících se činnosti zdravotních sester a ošetřovatelů odpovědných
    za všeobecnou péči
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/595/EØF af 10. oktober 1989 om ændring af direktiv
    77/452/EØF om gensidig anerkendelse af eksamensbeviser, certifikater og andre
    kvalifikationsbeviser for sygeplejersker med ansvar for den almene sundheds- og
    sygepleje samt om foranstaltninger, der skal lette den faktiske udøvelse af etableringsretten
    og den frie udveksling af tjenesteydelser, og om ændring af direktiv 77/453/EØF
    om samordning af de ved lov eller administrativt fastsatte bestemmelser om virksomhed
    som sygeplejerske med ansvar for den almene sundheds- og sygepleje
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/595/ΕΟΚ του Συμβουλίου της 10ης Οκτωβρίου
    1989 για την τροποποίηση της οδηγίας 77/452/ΕΟΚ
    περί αμοιβαίας αναγνώρισης των διπλωμάτων,
    πιστοποιητικών και άλλων τίτλων νοσοκόμου
    υπεύθυνου για γενική περίθαλψη και περί των
    μέτρων προς διευκόλυνση της πραγματικής άσκησης
    του δικαιώματος εγκατάστασης και του δικαιώματος
