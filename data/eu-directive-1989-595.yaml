    της οδηγίας 77/453/ΕΟΚ περί του συντονισμού των
    νομοθετικών, κανονιστικών και διοικητικών
    διατάξεων των σχετικών με τη δραστηριότητα
    νοσοκόμου υπεύθυνου για γενική περίθαλψη
  type: main
- language: et
  script: Latn
  content: Nõukogu Direktiiv, 10. oktoober 1989, millega muudetakse direktiivi 77/452/EMÜ,
    mis käsitleb üldõdede diplomite, tunnistuste ja muude kvalifikatsiooni tõendavate
    dokumentide vastastikust tunnustamist ja mis sisaldab meetmeid asutamisõiguse
    ja teenuste osutamise vabaduse kasutamise hõlbustamiseks, ning millega muudetakse
    direktiivi 77/453/EMÜ üldõdede tegevust käsitlevate õigus- ja haldusnormide
    kooskõlastamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/595/ETY, annettu 10 päivänä lokakuuta 1989,
    yleissairaanhoidosta vastaavien sairaanhoitajien tutkintotodistusten, todistusten
    ja muiden muodollista kelpoisuutta osoittavien asiakirjojen vastavuoroisesta tunnustamisesta
    sekä toimenpiteistä sijoittautumisvapauden ja palvelujen tarjoamisen vapauden
    tehokkaan käyttämisen helpottamiseksi annetun direktiivin 77/452/ETY ja yleissairaanhoidosta
    vastaavien sairaanhoitajien toimintaa koskevien lakien, asetusten ja hallinnollisten
    määräysten yhteensovittamisesta annetun direktiivin 77/453/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1989. október 10.) az általános ápolói oklevelek,
    bizonyítványok és a képesítés megszerzéséről szóló egyéb tanúsítványok
    kölcsönös elismeréséről, illetve a letelepedés és szolgáltatásnyújtás
    szabadságának tényleges gyakorlását elősegítő intézkedésekről szóló
    77/452/EGK irányelv módosításáról és a törvényi, rendeleti vagy közigazgatási
    intézkedésekben megállapított, az általános ápolók tevékenységére vonatkozó
    rendelkezések összehangolásáról szóló 77/453/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 89/595/CEE del Consiglio del 10 ottobre 1989 che modifica la
    direttiva 77/452/CEE concernente il reciproco riconoscimento dei diplomi, certificati
    ed altri titoli di infermiere responsabile dell'assistenza generale e comportante
    misure destinate ad agevolare l'esercizio effettivo del diritto di stabilimento
    e di libera prestazione dei servizi e la direttiva 77/453/CEE concernente il coordinamento
    delle disposizioni legislative, regolamentari ed amministrative per l'attività
    di infermiere responsabile dell'assistenza generale
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1989. gada 10. oktobris), ar ko groza Direktīvu 77/452/EEK
    par vispārējas aprūpes māsu diplomu, sertifikātu un citu kvalifikāciju apliecinošu
    dokumentu savstarpēju atzīšanu, tostarp par pasākumiem, kas palīdz sekmīgi
    īstenot tiesības veikt uzņēmējdarbību un brīvību sniegt pakalpojumus,
    un ar ko groza Direktīvu 77/453/EEK par normatīvo vai administratīvo aktu noteikumu
    koordinēšanu attiecībā uz vispārējas aprūpes māsu darbību
  type: main
- language: lt
  script: Latn
  content: 1989 m. spalio 10 d. Tarybos Direktyva iš dalies keičianti Direktyvą
    77/452/EEB dėl bendrosios praktikos slaugytojų diplomų, pažymėjimų ir kitų
    oficialią kvalifikaciją patvirtinančių dokumentų abipusio pripažinimo, įskaitant
    priemones, padedančias veiksmingai naudotis įsisteigimo teise ir laisve teikti
    paslaugas, ir iš dalies keičianti Direktyvą 77/453/EEB dėl įstatymų ir kitų
    teisės aktų nuostatų, reglamentuojančių bendrosios praktikos slaugytojų
    veiklą, derinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill ta' l-10 ta' Ottubru 1989 li temenda d-Direttiva
    77/452/KEE dwar ir-rikonoxximent reċiproku tad-diplomi, iċ-ċertifikati u provi
    oħrajn ta' kwalifiki formali ta' l-infermiera responsabbli għall-kura ġenerali,
    inklużi l-miżuri biex jiffaċilitaw l-eżerċizzju effettiv tad-dritt ta' l-istabbiliment
    u l-libertà li jiġu pprovduti servizzi, u li temenda d-Direttiva 77/453/KEE
    li tikkonċerna l-koordinazzjoni tad-dispożizzjonijiet stabbiliti bil-liġi,
    b'regolament jew b'azzjoni amministrattiva fir-rigward ta' l-attivitajiet ta'
    infermiera responsabbli mill-kura ġenerali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/595/EEG van de Raad van 10 oktober 1989 tot wijziging van
    Richtlijn 77/452/EEG inzake de onderlinge erkenning van de diploma's, certificaten
    en andere titels van verantwoordelijk algemeen ziekenverpleger, tevens houdende
    maatregelen tot vergemakkelijking van de daadwerkelijke uitoefening van het recht
    van vestiging en vrij verrichten van diensten, alsmede van Richtlijn 77/453/EEG
    inzake de coördinatie van de wettelijke en bestuursrechtelijke bepalingen betreffende
    de werkzaamheden van verantwoordelijk algemeen ziekenverpleger
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 10 października 1989 r. zmieniająca dyrektywę
    77/452/EWG dotyczącą wzajemnego uznawania dyplomów, świadectw i innych dokumentów
    potwierdzających posiadanie kwalifikacji pielęgniarki/pielęgniarza odpowiedzialnych
    za opiekę ogólną, łącznie ze środkami mającymi na celu ułatwienie skutecznego
    wykonywania prawa przedsiębiorczości i swobody świadczenia usług oraz uzupełniająca
    dyrektywę 77/453/EWG dotyczącą koordynacji przepisów ustawowych, wykonawczych
    i administracyjnych w zakresie działalności pielęgniarek/pielęgniarzy odpowiedzialnych
    za opiekę ogólną
  type: main
- language: pt
  script: Latn
  content: Directiva 89/595/CEE do Conselho de 10 de Outubro de 1989 que altera a
    Directiva 77/452/CEE, que tem por objectivo o reconhecimento mútuo dos diplomas,
    certificados e outros títulos de enfermeiro responsável por cuidados gerais
    e inclui medidas destinadas a facilitar o exercício efectivo do direito de estabelecimento
    e da livre prestação de serviços, assim como a Directiva 77/453/CEE, que tem
    por objectivo a coordenação das disposições legislativas, regulamentares e
    administrativas relativas às actividades de enfermeiro responsável por cuidados
    gerais
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 10 octombrie 1989 de modificare a Directivei
    77/452/CEE privind recunoașterea reciprocă a diplomelor, certificatelor și
    a altor titluri oficiale de calificare ca asistent medical generalist, inclusiv
    măsurile destinate să faciliteze exercitarea efectivă a dreptului de stabilire
    și a libertății de a presta servicii, și de modificare a Directivei 77/453/CEE
    privind coordonarea actelor cu putere de lege și actelor administrative privind
    activitățile asistenților medicali generaliști
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 10. októbra 1989, ktorou sa mení a dopĺňa smernica
    77/452/EHS o vzájomnom uznávaní diplomov, osvedčení a iných dokladov o formálnych
    kvalifikáciách sestier zodpovedných za všeobecnú starostlivosť a o opatreniach
    uľahčujúcich účinné uplatňovanie práva usadiť sa a slobody poskytovať
    služby, a ktorou sa mení a dopĺňa smernica 77/453/EHS o koordinácii zákonov,
    iných právnych predpisov alebo správnych opatrení týkajúcich sa činnosti
    sestier zodpovedných za všeobecnú starostlivosť
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 10. oktobra 1989 o spremembah Direktive 77/452/EGS
    o vzajemnem priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah
    medicinskih sester za splošno zdravstveno nego, vključno z ukrepi, ki omogočajo
    učinkovito uresničevanje pravice do ustanavljanja in prostega opravljanja storitev,
    ter o spremembah Direktive 77/453/EGS o usklajevanju določb zakonov in drugih
    predpisov o dejavnosti medicinskih sester za splošno zdravstveno nego
  type: main
- language: es
  script: Latn
  content: Directiva 89/595/CEE del Consejo de 10 de octubre de 1989 por la que se
    modifica la Directiva 77/452/CEE sobre el reconocimiento recíproco de los diplomas,
    certificados y otros títulos de enfermero responsable de cuidados generales,
    que contiene además medidas destinadas a facilitar el ejercicio efectivo del
    derecho de establecimiento y de libre prestación de servicios, así como la Directiva
    77/453/CEE sobre coordinación de las disposiciones legales, reglamentarias y
    administrativas relativas a las actividades de los enfermeros responsables de
    cuidados generales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/595/EEG av den 10 oktober 1989 om ändring av direktiv
    77/452/EEG om ömsesidigt erkännande av utbildnings-, examens- och andra behörighetsbevis
    för sjuksköterskor med ansvar för allmän hälso- och sjukvård samt åtgärder
    för att underlätta det faktiska utövandet av etableringsrätten och friheten
    att tillhandahålla tjänster och om ändring av direktiv 77/453/EEG om samordning
    av bestämmelserna i lagar och andra författningar om verksamhet som sjuksköterska
    med ansvar för allmän hälso- och sjukvård
  type: main
