title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2392/88 of 29 July 1988 fixing the accession
    compensatory amounts applicable to cereals for the 1988/89 marketing year and
    the coefficients to be used for calculating the amounts applicable to certain
    processed products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2392/88 de la Commission du 29 juillet 1988 fixant
    les montants compensatoires "adhésion" applicables dans les secteurs des céréales
    pour la campagne 1988/1989 ainsi que les coefficients à retenir pour le calcul
    des montants applicables aux produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2392/88 der Kommission vom 29. Juli 1988 zur Festsetzung
    der im Sektor Getreide geltenden Beitrittsausgleichsbeträge für das Wirtschaftsjahr
    1988/89 sowie der Koeffizienten für die Berechnung der auf bestimmte Verarbeitungserzeugnisse
    anzuwendenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2392/88 af 29. juli 1988 om fastsættelse
    af tiltrædelsesudligningsbeløbene for korn for høståret 1988/89 og koefficienterne
    til beregning af beløbene for visse forarbejdede produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2392/88 της Επιτροπής
    της 29ης Ιουλίου 1988 που καθορίζει τα εξισωτικά
    ποσά προσχωρήσεως που εφαρμόζονται στον τομέα
    των σιτηρών, για την περίοδο 1988/89, καθώς και
    τους συντελεστές που πρέπει να ληφθούν υπόψη
    για τον υπολογισμό των ποσών που εφαρμόζονται
    σε ορισμένα μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2392/88 della Commissione del 29 luglio 1988 che fissa
    gli importi compensativi adesione applicabili nel settore dei cereali per la campagna
    1988/1989, nonché i coefficienti da prendere in considerazione per il calcolo
    degli importi applicabili a taluni prodotti trasformati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2392/88 van de Commissie van 29 juli 1988 tot vaststelling
    van de compenserende bedragen toetreding die in het verkoopseizoen 1988/1989 van
    toepassing zijn in de sector granen alsmede van de coëfficiënten die moeten
    worden aangehouden voor de berekening van de bedragen die voor bepaalde verwerkte
    produkten van toepassing zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2392/88 da Comissão de 29 de Julho de 1988 que
    fixa os montantes compensatórios de adesão aplicáveis ao sector dos cereais
    para a campanha de 1988/1989, bem como os coeficientes a utilizar para o cálculo
    dos montantes aplicáveis a determinados produtos transformados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2392/88 de la Comisión de 29 de julio de 1988 por
    el que se fijan los montantes compensatorios de adhesión aplicables en los sectores
    de los cereales para la campaña de 1988/89 y los coeficientes que deberán utilizarse
    para el cálculo de los montantes aplicables a determinados productos transformados
  type: main
