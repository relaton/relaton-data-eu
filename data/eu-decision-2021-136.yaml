    ca tehnologie inovatoare de reducere a emisiilor de CO2 generate de anumite vehicule
    utilitare ușoare, în legătură cu procedura de testare a vehiculelor ușoare
    armonizată la nivel mondial
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/136 zo 4. februára 2021, ktorým
    sa opravuje vykonávacie rozhodnutie (EÚ) 2019/1119 o schválení efektívneho
    vonkajšieho osvetlenia vozidla s použitím svetelných emisných diód na použitie
    vo vozidlách s motorom s vnútorným spaľovaním a v hybridných elektrických
    vozidlách bez externého nabíjania ako inovačnej technológie na znižovanie
    emisií CO2 z osobných automobilov podľa nariadenia Európskeho parlamentu a
    Rady (ES) č. 443/2009 a vykonávacie rozhodnutie (EÚ) 2020/1339, ktorým sa
    podľa nariadenia Európskeho parlamentu a Rady (EÚ) 2019/631 schvaľuje efektívne
    vonkajšie osvetlenie vozidla s použitím svetelných emisných diód ako inovačná
    technológia na znižovanie emisií CO2 z určitých ľahkých úžitkových vozidiel
    v súvislosti s celosvetovým harmonizovaným skúšobným postupom pre ľahké
    vozidlá
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/136 z dne 4. februarja 2021 o popravku
    Izvedbenega sklepa (EU) 2019/1119 o odobritvi učinkovite zunanje osvetlitve vozil
    s svetlečimi diodami za uporabo v vozilih z motorji z notranjim zgorevanjem in
    hibridnih elektrificiranih vozilih brez zunanjega polnjenja kot inovativne tehnologije
    za zmanjšanje emisij CO2 iz osebnih avtomobilov v skladu z Uredbo (ES) št. 443/2009
    Evropskega parlamenta in Sveta ter Izvedbenega sklepa (EU) 2020/1339 o odobritvi
    učinkovite zunanje osvetlitve vozil z uporabo svetlečih diod kot inovativne
    tehnologije za zmanjšanje emisij CO2 iz nekaterih lahkih gospodarskih vozil v
    zvezi z globalno usklajenim preizkusnim postopkom za lahka vozila v skladu z Uredbo
    (EU) 2019/631 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/136 de la Comisión de 4 de febrero de
    2021 por la que se corrigen la Decisión de Ejecución (UE) 2019/1119, relativa
    a la aprobación de una tecnología de iluminación eficiente para el exterior
    de los vehículos que utiliza diodos emisores de luz para su uso en vehículos
    de motor de combustión interna y en vehículos eléctricos híbridos no recargables
    desde el exterior como tecnología innovadora para la reducción de las emisiones
    de CO2 de los turismos de conformidad con el Reglamento (CE) n.o 443/2009 del
    Parlamento Europeo y del Consejo, y la Decisión de Ejecución (UE) 2020/1339,
    relativa a la aprobación, con arreglo al Reglamento (UE) 2019/631 del Parlamento
    Europeo y del Consejo, de una tecnología de iluminación eficiente para el exterior
    de los vehículos que utiliza diodos emisores de luz como tecnología innovadora
    para reducir las emisiones de CO2 de determinados vehículos comerciales ligeros
    en relación con el procedimiento de ensayo de vehículos ligeros armonizado a
    nivel mundial
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/136 av den 4 februari 2021
    om rättelse av genomförandebeslut (EU) 2019/1119 om godkännande av effektiv
    yttre fordonsbelysning med användning av lysdioder för användning i fordon
    med förbränningsmotor och i icke externt laddbara elektriska hybridfordon som
    en innovativ teknik för att minska koldioxidutsläppen från personbilar i enlighet
    med Europaparlamentets och rådets förordning (EG) nr 443/2009 samt av genomförandebeslut
    (EU) 2020/1339 om godkännande i enlighet med Europaparlamentets och rådets förordning
    (EU) 2019/631 av effektiv yttre fordonsbelysning med användning av lysdioder
    som en innovativ teknik för att minska koldioxidutsläppen från vissa lätta
    nyttofordon med avseende på det globalt harmoniserade provningsförfarandet för
    lätta fordon
  type: main
