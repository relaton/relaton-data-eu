title:
- language: en
  script: Latn
  content: '2001/724/EC: Commission Decision of 11 October 2001 terminating the review
    of Council Regulation (EC) No 1599/1999 imposing a definitive countervailing duty
    on imports of stainless steel wires with a diameter of 1 mm or more originating
    in India (notified under document number C(2001) 3041)'
  type: main
- language: fr
  script: Latn
  content: '2001/724/CE: Décision de la Commission du 11 octobre 2001 clôturant
    le réexamen du règlement (CE) n° 1599/1999 du Conseil instituant un droit compensateur
    définitif sur les importations de fils en aciers inoxydables d''un diamètre
    égal ou supérieur à un millimètre originaires de l''Inde [notifiée sous le
    numéro C(2001) 3041]'
  type: main
- language: de
  script: Latn
