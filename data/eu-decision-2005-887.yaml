  script: Latn
  content: '2005/887/EC: Commission Decision of 12 December 2005 amending Decisions
    2004/695/EC and 2004/840/EC as regards the reallocation of the Community’s financial
    contribution to certain Member States for their programmes for the eradication
    and monitoring of animal diseases and for checks aimed at the prevention of zoonoses
    for 2005 (notified under document number C(2005) 4792)'
  type: main
- language: fr
  script: Latn
  content: '2005/887/CE: Décision de la Commission du 12 décembre 2005 modifiant
