title:
- language: en
  script: Latn
  content: '80/374/EEC: Commission Decision of 31 March 1980 extending the period
    of application of the system of authorization for trade in crude oil and/or petroleum
    products between France and other Member States provided for by Decision 79/126/EEC
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/374/CEE: Décision de la Commission, du 31 mars 1980, prorogeant le
    système d''autorisation pour les échanges de pétrole brut et/ou de produits
    pétroliers entre la France et les autres Etats membres prévu par la décision
    79/126/CEE (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/374/EWG: Entscheidung der Kommission vom 31. März 1980 zur Verlängerung
    der Geltungsdauer des in der Entscheidung 79/126/EWG vorgesehenen Systems automatisch
    erteilter Genehmigungen von Ausfuhren von Rohöl und/oder Erdölerzeugnissen zwischen
    Frankreich und den anderen Mitgliedstaaten (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/374/EØF: Kommissionens beslutning af 31. marts 1980 om forlængelse
    af ordningen med licenser for samhandelen med mineralolie og/eller mineralprodukter
    mellem Frankrig og de øvrige medlemsstater som fastsat i beslutning 79/126/EØF
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/374/CEE: Decisione della Commissione, del 31 marzo 1980, che proroga
    il sistema di autorizzazione per gli scambi di petrolio greggio e/o di prodotti
    petroliferi tra la Francia e gli Stati membri previsto dalla decisione 79/126/CEE
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/374/EEG: Beschikking van de Commissie van 31 maart 1980 tot verlenging
    van de geldigheidsduur van het vergunningstelsel voor het handelsverkeer van ruwe
    aardolie en/of aardolieprodukten tussen Frankrijk en de andere Lid-Staten, neergelegd
    in Beschikking 79/126/EEG (Slechts de tekst in de Franse taal is authentiek)'
