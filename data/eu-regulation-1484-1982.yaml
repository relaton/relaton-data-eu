    objets de fantaisie, d' ameublement, d' ornementation ou de parure, de la position
    69.13 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
