title:
- language: fr
  script: Latn
  content: Décision de la Commission du 31 mars 1965 relative à la demande du gouvernement
    français en vue de la reconduction pour 1965 de la décision de la Commission
    du 19 mars 1964 autorisant une réduction tarifaire de 15 % applicable aux transports
    de choux-fleurs et de pommes de terre primeurs en provenance de la Bretagne, effectués
    par chemin de fer ou par route sur une distance d'au moins 650 km
  type: main
- language: de
  script: Latn
  content: '65/233/EWG: Entscheidung der Kommission vom 31. März 1965 über den Antrag
    der französischen Regierung, die Entscheidung der Kommission vom 19. März 1964
    über die Genehmigung einer Tarifermäßigung von 15 v.H. für Beförderungen
    von Blumenkohl und Frühkartoffeln aus der Bretagne mit der Eisenbahn und im Güterkraftverkehr
    über Entfernungen von mindestens 650 km für das Jahr 1965 zu verlängern'
  type: main
- language: it
  script: Latn
  content: '65/233/CEE: Decisione della Commissione, del 31 marzo 1965, in ordine
    alla richiesta presentata dal Governo francese, intesa a prorogare per l''anno
    1965 la validità della decisione 19 marzo 1964 della Commissione con la quale
    si autorizzava una riduzione tariffaria del 15 % per i trasporti di cavolfiori
    e di patate di primizia in provenienza dalla Bretagna effettuati per ferrovia
    o su strada su una distanza di almeno 650 km'
  type: main
- language: nl
  script: Latn
  content: '65/233/EEG: Beschikking van de Commissie van 31 maart 1965 betreffende
    het verzoek van de Franse Regering om verlenging tot het einde van het jaar 1965
    van de beschikking van de Commissie van 19 maart 1964 waarbij machtiging wordt
    verleend tot het toepassen van een tariefreductie van 15% voor vervoer van bloemkool
    en vroege aardappelen uit Bretagne dat per spoor of over de weg over een afstand
    van ten minste 650 km plaatsvindt'
  type: main
