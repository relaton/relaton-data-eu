    zu herabgesetzten Preisen aus Beständen der Interventionsstelle für den unmittelbaren
    Verbrauch in Form von Butterreinfett
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2131/79 af 28. september 1979 om fjerde
