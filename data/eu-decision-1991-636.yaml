title:
- language: en
  script: Latn
  content: '91/636/EEC: Commission Decision of 29 November 1991 amending Decision
    91/107/EEC authorizing certain Member States to provide for derogations from certain
    provisions of Council Directive 77/93/EEC in respect of sawn wood of conifers
    originating in the USA (Only the Spanish, German, Greek, English, French, Italian,
    Dutch and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/636/CEE: Décision de la Commission du 29 novembre 1991 modifiant la
    décision 91/107/CEE autorisant certains États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    le bois scié de conifères originaire des États-Unis d''Amérique (Les textes
    en langues espagnole, allemande, grecque, anglaise, française, italienne, néerlandaise
    et portugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '91/636/EWG: Entscheidung der Kommission vom 29. November 1991 zur Änderung
    der Entscheidung 91/107/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für
    Nadelschnittholz mit Ursprung in den Vereinigten Staaten von Amerika Ausnahmen
    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur
    der spanische, der deutsche, der griechische, der englische, der französische,
    der italienische, der niederländische und der portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/636/EØF: Kommissionens beslutning af 29. november 1991 om ændring
    af beslutning 91/107/EØF om bemyndigelse af visse medlemsstater til at indrømme
    undtagelser fra visse bestemmelser i Rådets direktiv 77/93/EØF for opskåret
    nåletræ med oprindelse i USA (Kun de spanske, tyske, græske, engelske, franske,
    italienske, nederlandske og portugisiske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '91/636/ΕΟΚ: Απόφαση της Επιτροπής της 29ης
    Νοεμβρίου 1991 για την τροποποίηση της απόφασης
    91/107/ΕΟΚ η οποία επιτρέπει σε ορισμένα κράτη
    μέλη να προβλέπουν παρεκκλίσεις από ορισμένες
    διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά την πριστή ξυλεία κωνοφόρων, καταγωγής
    Ηνωμένων Πολιτειών της Αμερικής (Τα κείμενα
    στην ισπανική, γερμανική, ελληνική, αγγλική,
    γαλλική, ιταλική, ολλανδική και πορτογαλική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '91/636/CEE: Decisione della Commissione del 29 novembre 1991 che modifica
    la decisione 90/107/CEE che autorizza alcuni Stati membri a prevedere deroghe
    a talune disposizioni della direttiva 77/93/CEE del Consiglio per quanto riguarda
    il legname segato di conifere originario degli Stati Uniti d''America (I testi
    in lingua spagnola, tedesca, greca, inglese, francese, italiana, olandese e portoghese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '91/636/EEG: Beschikking van de Commissie van 29 november 1991 houdende
    wijziging van Beschikking 91/107/EEG tot machtiging van een aantal Lid-Staten
    om voor gezaagd naaldhout van oorsprong uit de Verenigde Staten van Amerika afwijkingen
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Spaanse, de Duitse, de Griekse, de Engelse, de Franse, de Italiaanse,
    de Nederlandse en de Portugese taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/636/CEE: Decisão da Comissão de 29 de Novembro de 1991 que altera
    a Decisão 91/107/CEE, que autoriza certos Estados-membros a estabelecer derrogações
    de determinadas disposições da Directiva 77/93/CEE do Conselho em relação
    à madeira serrada de coníferas originária dos Estados Unidos da América (Apenas
    fazem fé os textos nas línguas espanhola, alemã, grega, inglesa, francesa,
    italiana, neerlandesa e portuguesa)'
  type: main
- language: es
  script: Latn
  content: '91/636/CEE: Decisión de la Comisión de 29 de noviembre de 1991 que modifica
    la Decisión 90/107/CEE por la que se autoriza a determinados Estados miembros
    para establecer excepciones a determinadas disposiciones de la Directiva 77/93/CEE
    del Consejo respecto de la madera aserrada de coníferas originaria de Estados
    Unidos de América (Los textos en lengua española, alemana, griega, inglesa,
    francesa, italiana, neerlandesa y portuguesa son los únicos auténticos)'
