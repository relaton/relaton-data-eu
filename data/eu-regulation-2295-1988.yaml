title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2295/88 of 26 July 1988 fixing for the 1988/89
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2295/88 de la Commission du 26 juillet 1988 fixant,
    pour la campagne 1988/1989 le prix minimal à payer aux producteurs pour les tomates
    ainsi que le montant de l' aide à la production pour les produits transformés
    à base de tomates
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2295/88 der Kommission vom 26. Juli 1988 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2295/88 af 26. juli 1988 om fastsættelse
    af den minimumspris, der skal betales producenten for tomater, samt producentstøtten
    for forarbejdede tomater i produktionsåret 1988/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2295/88 της Επιτροπής
    της 26ης Ιουλίου 1988 για τον καθορισμό, για την
    περίοδο εμπορίας 1988/89, της ελάχιστης τιμής
    που πληρώνεται στους παραγωγούς για τις τομάτες
    και του ποσού της ενίσχυσης στην παραγωγή για
    τα προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2295/88 della Commissione del 26 luglio 1988 che fissa,
    per la campagna di commercializzazione 1988/1989, il prezzo minimo da pagare ai
    produttori di pomodori e l' importo dell' aiuto alla produzione per i prodotti
    trasformati a base di pomodoro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2295/88 van de Commissie van 26 juli 1988 tot vaststelling,
    voor het verkoopseizoen 1988/1989, van de aan de telers voor tomaten te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2295/88 da Comissão de 26 de Julho de 1988 que
    fixa para a campanha de comercialização de 1988/1989 o preço mínimo a pagar
    aos produtores para os tomates e o montante da ajuda à produção para os produtos
    transformados à base de tomate
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2295/88 de la Comisión de 26 de julio de 1988 por
    el que se establece, para la campaña 1988/89, el precio mínimo que debe pagarse
    a los productores de tomates y el importe de la ayuda a la producción de productos
    transformados a base de tomates
  type: main
