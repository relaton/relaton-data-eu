title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 172/83 of 25 January 1983 fixing for certain
    fish stocks and groups of fish stocks occurring in the Community' s fishing zone,
    total allowable catches for 1982, the share of these catches available to the
    Community, the allocation of that share between the Member States and the conditions
    under which the total allowable catches may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 172/83 du Conseil du 25 janvier 1983 fixant, pour certains
    stocks ou groupes de stocks de poissons évoluant dans la zone de pêche de la
    Communauté, les totaux admissibles des captures pour 1982, la part de ces captures
    disponible pour la Communauté, la répartition de cette part entre les États
    membres et les conditions dans lesquelles les totaux admissibles des captures
    peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 172/83 des Rates vom 25. Januar 1983 zur Festlegung
    der zulässigen Gesamtfangmenge und des für die Gemeinschaft verfügbaren Anteils,
    der Aufteilung dieses Anteils auf die Mitgliedstaaten sowie der Fangbedingungen
    bei der Ausübung der Fischerei hinsichtlich der zulässigen Gesamtfangmengen
    für bestimmte Fischbestände oder Bestandsgruppen in der Fischereizone der Gemeinschaft
    für 1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 172/83 af 25. januar 1983 om fastsættelse
    for 1982 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande i Fællesskabets fiskerizone samt af Fællesskabets andel af
    disse fangster, af dennes fordeling blandt medlemsstaterne og af bestemmelserne
    for fiskeri efter den samlede tilladte fangstmængde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 172/83 του Συμβουλίου
    της 25ης Ιανουαρίου 1983 περί καθορισμού για το
    1982, για ορισμένα αποθέματα ιχθύων και ομάδες
    αποθεμάτων ιχθύων που αναπτύσσονται στην αλιευτική
    ζώνη της Κοινότητας, του συνόλου επιτρεπομένων
    αλιευμάτων, του μεριδίου της Κοινότητας από
    αυτά τα αλιεύματα, της κατανομής του μεριδίου
    αυτού στα Κράτη μέλη και των όρων υπό τους οποίους
    πραγματοποιείται το σύνολο επιτρεπομένων
    αλιευμάτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 172/83 del Consiglio del 25 gennaio 1983 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche presenti nelle zone di
    pesca della Comunità, il totale delle catture ammesse per il 1982 e la parte
    di queste catture disponibile per la Comunità, la ripartizione di detta parte
    tra gli Stati membri, nonché le condizioni cui è soggetta la pesca del totale
    delle catture ammesse
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 172/83 van de Raad van 25 januari 1983 inzake de
    vaststelling van de voor 1982 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden in de visserijzone van de Gemeenschap en
    het voor de Gemeenschap beschikbare gedeelte van deze vangsten, de verdeling van
    dit gedeelte over de Lid-Staten en de bij de visserij in het kader van de totaal
    toegestane vangsten in acht te nemen voorschriften
  type: main
