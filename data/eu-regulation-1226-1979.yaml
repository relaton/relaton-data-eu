  content: Commission Regulation (EEC) No 1226/79 of 21 June 1979 amending Regulation
    (EEC) No 1054/79 on the sale at prices fixed at a standard rate in advance of
    certain frozen beef from intervention stocks for processing in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1226/79 de la Commission, du 21 juin 1979, modifiant
    le règlement (CEE) n 1054/79 relatif à la vente à prix fixés forfaitairement
    à l'avance, en vue de leur transformation dans la Communauté, de certaines viandes
    bovines congelées provenant des stocks d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1226/79 der Kommission vom 21. Juni 1979 zur Änderung
