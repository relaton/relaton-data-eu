    (ΕΚ) αριθ. 1758/98 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 1 450 000 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1563/1999, annettu 16 päivänä heinäkuuta
    1999, asetuksen (EY) N:o 1758/98 muuttamisesta ja Ranskan interventioelimen hallussaan
    pitämän leipävehnän vientiä koskevan pysyvän tarjouskilpailun kohteena olevan
    määrän nostamisesta 1 450 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1563/1999 della Commissione, del 16 luglio 1999, che
