title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1563/1999 of 16 July 1999 amending Regulation
    (EC) No 1758/98 increasing to 1 450 000 tonnes the quantity of wheat of breadmaking
    quality held by the French intervention agency for which a standing invitation
    to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1563/1999 de la Commission, du 16 juillet 1999, modifiant
    le règlement (CE) n° 1758/98 et portant à 1 450 000 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1563/1999 der Kommission vom 16. Juli 1999 zur Änderung
    der Verordnung (EG) Nr. 1758/98 und zur Erhöhung der Dauerausschreibung zur Ausfuhr
    von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 1 450 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1563/1999 af 16. juli 1999 om ændring
    af forordning (EF) nr. 1758/98 og om forhøjelse til 1 450 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
