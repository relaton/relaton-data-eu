    quantitativo globale oggetto della gara permanente per l'esportazione di frumento
    tenero panificabile detenuto dall'organismo d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1563/1999 van de Commissie van 16 juli 1999 tot wijziging
    van Verordening (EG) nr. 1758/98, teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de uitvoer van zachte tarwe van bakkwaliteit uit Franse
    interventievoorraden betrekking heeft, tot 1 450 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1563/1999 da Comissão, de 16 de Julho de 1999, que
