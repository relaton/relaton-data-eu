  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 141/2001, annettu 24 päivänä tammikuuta 2001,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti tammikuussa 2001 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 141/2001 della Commissione, del 24 gennaio 2001, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 2001 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi conclusi tra la Comunità e
    la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia,
    la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 141/2001 van de Commissie van 24 januari 2001 tot
