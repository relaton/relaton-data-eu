    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de enero de 2001 al amparo del régimen previsto en los Acuerdos celebrados
    entre la Comunidad y Polonia, Hungría, la República Checa, Eslovaquia, Bulgaria
    y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 141/2001 av den 24 januari 2001 om fastställande
