title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 33/79 of 8 January 1978 abolishing the countervailing
    charge on imports of mandarins (including tangerines and satsumas), clementines,
    wilkings and other similar citrus hybrids originating in Algeria
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 33/79 de la Commission, du 8 janvier 1979, supprimant
    la taxe compensatoire à l'importation de mandarine, y compris tangerines et satsumas,
    clémentines, wilkings et autres hybrides similaires d'agrumes originaires d'Algérie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 33/79 der Kommission vom 8. Januar 1979 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Clementinen, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten
    mit Ursprung in Algerien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 33/79 af 8. januar 1979 om ophævelse
    af udligningsafgiften ved indførsel af mandariner (herunder tangeriner og satsumas),
    clementiner, wilkins og andre lignende krydsninger af citrusfrugter med oprindelse
    i Algeriet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 33/79 della Commissione, dell'8 gennaio 1979, che
    sopprime la tassa di compensazione all'importazione di mandarini, compresi i tangerini
    e i mandarini satzuma (o sazuma), le clementine, i wilkings, e altri simili ibridi
    di agrumi originari dell'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 33/79 van de Commissie van 8 januari 1979 houdende
    intrekking van de compenserende heffing op de invoer van mandarijnen, tangerines
    en satsuma's daaronder begrepen, clementines, wilkings en andere dergelijke kruisingen
    van citrusvruchten van oorspong uit Algerië
