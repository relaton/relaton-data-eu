title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 182/81 of 23 January 1981 amending, for
    the second time, Regulation (EEC) No 2726/80 on the granting of aid for concentrated
    grape must and rectified concentrated grape must used in wine-making during the
    1980/81 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 182/81 de la Commission, du 23 janvier 1981, portant
    deuxième modification du règlement (CEE) n° 2726/80 relatif à l' octroi d'
    une aide aux moûts de raisins concentrés et moûts de raisins concentrés rectifiés
    utilisés en vinification au cours de la campagne viticole 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 182/81 der Kommission vom 23. Januar 1981 zur zweiten
    Änderung der Verordnung (EWG) Nr. 2726/80 über eine Beihilfe für konzentrierte
    Traubenmoste und rektifizierte konzentrierte Traubenmoste, die im Weinwirtschaftsjahr
    1980/81 für die Weinbereitung verwendet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 182/81 af 23. januar 1981 om anden
    ændring af forordning (EØF) nr. 2726/80 om støtte til koncentreret druemost
    og koncentreret rectificeret druemost, der anvendes til vinfremstilling i vinproduktionsåret
    1980/81
  type: main
- language: el
  script: Grek
