title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1987/2003 of 12 November 2003 amending Regulation
    (EC) No 98/2003 as regards the forecast supply balance for the Azores for cereals
    and oilseeds, the forecast supply balance for Madeira for vegetable oils, sugar
    and meats and the forecast supply balance for the Canary Islands for cereals,
    oilseeds, hops, livestock feed, milk and milk products and meats
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1987/2003 de la Commission du 12 novembre 2003 modifiant
    le règlement (CE) n° 98/2003, en ce qui concerne le bilan prévisionnel d'approvisionnement
    des Açores pour le secteur des céréales et des oléagineux, le bilan prévisionnel
    d'approvisionnement de Madère pour le secteur des huiles végétales, du sucre
    et des viandes, le bilan prévisionnel d'approvisionnement des Îles Canaries
    pour les secteurs des céréales et oléagineux, du houblon, des produits destinés
    à l'alimentation du bétail, du lait et produits laitiers, et des viandes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1987/2003 der Kommission vom 12. November 2003 zur
    Änderung der Verordnung (EG) Nr. 98/2003 hinsichtlich der Bedarfsvorausschätzung
