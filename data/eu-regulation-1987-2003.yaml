    für die Versorgung Madeiras mit Pflanzenöl, Zucker und Fleisch sowie der Bedarfsvorausschätzung
    für die Versorgung der Kanarischen Inseln mit Getreide, Ölsaaten, Hopfen, Futtermitteln,
    Milch und Milcherzeugnissen sowie Fleisch
  type: main
- language: da
  script: Latn
