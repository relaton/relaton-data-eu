  content: Council Directive 76/463/EEC of 4 May 1976 amending for the second time
    Directive 65/66/EEC laying down specific criteria of purity for the preservatives
    authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 76/463/CEE du Conseil, du 4 mai 1976, portant deuxième modification
