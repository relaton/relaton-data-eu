    Festsetzung der Anpassungskoeffizienten für die Ankaufspreise auf dem Sektor
    Obst und Gemüse #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1998/87 af 7. juli 1987 om visse undtagelser
