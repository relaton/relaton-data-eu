    παρέκκλισης από τα άρθρα 2 και 28α παράγραφος
    1 της έκτης οδηγίας 77/388/ΕΟΚ για την εναρμόνιση
    των νομοθεσιών των κρατών μελών των σχετικών
    με τους φόρους κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '98/161/EY: Neuvoston päätös, tehty 16 päivänä helmikuuta 1998, luvan
