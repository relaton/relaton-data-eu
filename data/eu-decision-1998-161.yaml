title:
- language: en
  script: Latn
  content: '98/161/EC: Council Decision of 16 February 1998 authorising the Kingdom
    of the Netherlands to apply a measure derogating from Articles 2 and 28a(1) of
    the Sixth Council Directive 77/388/EEC on the harmonisation of the laws of the
    Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '98/161/CE: Décision du Conseil du 16 février 1998 autorisant le Royaume
    des Pays-Bas à appliquer une mesure dérogatoire à l''article 2 et à l''article
    28 bis, paragraphe 1, de la sixième directive 77/388/CEE en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '98/161/EG: Entscheidung des Rates vom 16. Februar 1998 zur Ermächtigung
    des Königreichs der Niederlande, eine von Artikel 2 und Artikel 28a Absatz 1
    der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften der
    Mitgliedstaaten über die Umsatzsteuern abweichende Regelung anzuwenden'
  type: main
- language: da
  script: Latn
  content: '98/161/EF: Rådets beslutning af 16. februar 1998 om bemyndigelse af Kongeriget
    Nederlandene til at indføre en foranstaltning, der fraviger bestemmelserne i
