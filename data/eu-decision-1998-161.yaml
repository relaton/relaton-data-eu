    delle legislazioni degli Stati membri relative alle imposte sulla cifra di affari'
  type: main
- language: nl
  script: Latn
  content: '98/161/EG: Beschikking van de Raad van 16 februari 1998 waarbij het Koninkrijk
    der Nederlanden gemachtigd wordt tot toepassing van een maatregel die afwijkt
