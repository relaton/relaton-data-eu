title:
- language: en
  script: Latn
  content: Regulation (EEC) No 382/73 of the Commission of 12 February 1973 on the
    restoration of Common Customs Tariff duties on men' s and boys' outer garments,
    of cotton, of heading ex 61.01, originating in developing countries covered by
    the preferential tariff arrangements set out in Council Regulation (EEC) No 2764/72
    of 19 December 1972
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 382/73 de la Commission, du 12 février 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour hommes et garçonnets, en tissus de coton, de la
    position tarifaire ex 61.01, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2764/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 382/73 der Kommission vom 12. Februar 1973 über die
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Männer und Knaben, aus Geweben aus Baumwolle, der Tarifnummer ex 61.01,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2764/72
    des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 382/73 af 12. februar 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for yderbeklædningsgenstande til mænd
    og drenge af bomuld under position ex. 61.01, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 2764/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 382/73 della Commissione, del 12 febbraio 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    indumenti esterni per uomo e per ragazzo, in tessuti di cotone, della voce doganale
    n. ex 61.01 originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2764/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 382/73 van de Commissie van 12 februari 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op herenbovenkleding en jongensbovenkleding, van katoenen weefsels
    van post ex 61.01, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan
    bij Verordening (EEG) nr. 2764/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
