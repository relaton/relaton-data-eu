id: EURegulationNo20511998
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2051/98 of 24 September 1998 imposing a definitive
    anti-dumping duty on imports of monosodium glutamate originating in Brazil and
    Vietnam, amending Regulation (EC) No 81/96 in respect of anti-dumping measures
    concerning imports of monosodium glutamate originating in the Republic of Korea
    and Taiwan and terminating the proceeding in respect of imports of monosodium
    glutamate originating in the United States of America and Indonesia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2051/98 du Conseil du 24 septembre 1998 instituant
    un droit antidumping définitif sur les importations de glutamate monosodique
    originaire du Brésil et du Viêt-nam, modifiant le règlement (CE) nº 81/96
    en ce qui concerne les mesures antidumping instituées sur les importations de
    glutamate monosodique originaire de la République de Corée et de T'ai-wan et
    clôturant la procédure concernant les importations de ce produit originaire
    des États-Unis d'Amérique et d'Indonésie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2051/98 des Rates vom 24. September 1998 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Mononatriumglutamat
    mit Ursprung in Brasilien und Vietnam, zur Änderung der Verordnung (EG) Nr. 81/96
    über Antidumpingmaßnahmen betreffend die Einfuhren von Mononatriumglutamat mit
    Ursprung in der Republik Korea und Taiwan und zur Einstellung des Verfahrens betreffend
    die Einfuhren von Mononatriumglutamat mit Ursprung in den USA und Indonesien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2051/98 af 24. september 1998 om indførelse
    af en endelig antidumpingtold på importen af mononatriumglutamat med oprindelse
    i Brasilien og Vietnam, om ændring af forordning (EF) nr. 81/96 for så vidt
    angår antidumpingforanstaltningerne vedrørende importen af mononatriumglutamat
    med oprindelse i Republikken Korea og Taiwan og om afslutning af proceduren vedrørende
    importen af mononatriumglutamat med oprindelse i USA og Indonesien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2051/98 του Συμβουλίου
    της 24ης Σεπτεμβρίου 1998 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές γλουταμινικού
    νατρίου καταγωγής Βραζιλίας και Βιετνάμ, για
    την τροποποίηση του κανονισμού (ΕΚ) αριθ. 81/96
    σχετικά με μέτρα αντιντάμπινγκ για τις εισαγωγές
    γλουταμινικού νατρίου καταγωγής Δημοκρατίας
    της Κορέας και Ταϊβάν και για την περάτωση
    της διαδικασίας όσον αφορά τις εισαγωγές γλουταμινικού
    νατρίου καταγωγής ΗΠΑ και Ινδονησίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2051/98, annettu 24 päivänä syyskuuta 1998,
    lopullisen polkumyyntitullin käyttöönottamisesta Brasiliasta ja Vietnamista
    peräisin olevan mononatriumglutamaatin tuonnissa, asetuksen (EY) N:o 81/96 muuttamisesta
    mononatriumglutamaatin tuontia Korean tasavallasta ja Taiwanista koskevien polkumyynnin
    vastaisten toimenpiteiden osalta ja menettelyn päättämisestä Yhdysvalloista
    ja Indonesiasta peräisin olevan mononatriumglutamaatin tuonnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2051/98 del Consiglio del 24 settembre 1998 che istituisce
    un dazio antidumping definitivo sulle importazioni di glutammato monosodico originario
    del Brasile e del Vietnam, che modifica il regolamento (CE) n. 81/96 per quanto
    riguarda le misure antidumping relative alle importazioni di glutammato monosodico
    originario della Repubblica di Corea e di Taiwan e che chiude il procedimento
    per quanto riguarda le importazioni di glutammato monosodico originario degli
    Stati Uniti d'America e dell'Indonesia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2051/98 van de Raad van 24 september 1998 tot instelling
    van een definitief antidumpingrecht op de invoer van mononatriumglutamaat uit
    Brazilië en Vietnam, tot wijziging van Verordening (EG) nr. 81/96 ten aanzien
    van de antidumpingmaatregelen betreffende de invoer van mononatriumglutamaat uit
    de Republiek Korea en Taiwan en tot beëindiging van de procedure betreffende
    de invoer van mononatriumglutamaat uit de Verenigde Staten van Amerika en Indonesië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2051/98 do Conselho de 24 de Setembro de 1998 que
    cria um direito anti-dumping definitivo sobre as importações de glutamato de
    monossódio originário do Brasil e do Vietname, que altera o Regulamento (CE)
    nº 81/96 no que respeita às medidas anti-dumping relativas às importações
    de glutamato de monossódio originário da República da Coreia e de Taiwan e
    que encerra o processo relativo às importações de glutamato de monossódio
    originário dos EUA e da Indonésia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2051/98 del Consejo de 24 de septiembre de 1998 por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de glutamato monosódico originario de Brasil y Viet Nam, por el que se modifica
    el Reglamento (CE) nº 81/96 en lo concerniente a las medidas antidumping relativas
    a las importaciones de glutamato monosódico originario de la República de Corea
    y Taiwán y por el que se da por concluido el procedimiento relativo a las importaciones
    de glutamato monosódico originario de Estados Unidos de América e Indonesia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2051/98 av den 24 september 1998 om införande
    av en slutgiltig antidumpningstull på import av mononatriumglutamat med ursprung
    i Brasilien och Vietnam och om ändring av förordning (EG) nr 81/96 vad gäller
    antidumpningsåtgärder beträffande import av mononatriumglutamat med ursprung
    i Republiken Sydkorea och Taiwan och om avslutande av förfarandet beträffande
    import av mononatriumglutamat med ursprung i USA och Indonesien
  type: main
