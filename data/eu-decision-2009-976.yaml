    enzootică bovină [notificată cu numărul C(2009) 9951]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 15. decembra 2009 , ktorým sa mení a dopĺňa príloha
    D k smernici Rady č. 64/432/EHS, pokiaľ ide o diagnostické testy na enzootickú
