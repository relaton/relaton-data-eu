    assosiaatiosta tehdyn Eurooppa-sopimuksen kauppaa koskevien määräysten mukauttamista
    uusia keskinäisiä maatalousmyönnytyksiä koskevien osapuolten neuvottelujen
    tulosten huomioon ottamiseksi koskevan pöytäkirjan tekemisestä'
  type: main
- language: it
  script: Latn
  content: '2004/484/CE: Decisione del Consiglio, del 22 settembre 2003, relativa
