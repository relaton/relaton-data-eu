  content: Regulation (EU) No 610/2013 of the European Parliament and of the Council
    of 26 June 2013 amending Regulation (EC) No 562/2006 of the European Parliament
    and of the Council establishing a Community Code on the rules governing the movement
    of persons across borders (Schengen Borders Code), the Convention implementing
    the Schengen Agreement, Council Regulations (EC) No 1683/95 and (EC) No 539/2001
    and Regulations (EC) No 767/2008 and (EC) No 810/2009 of the European Parliament
    and of the Council
  type: main
