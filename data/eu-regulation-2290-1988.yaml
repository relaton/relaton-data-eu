    und 6908 90 der Kombinierten Nomenklatur mit Ursprung in Brasilien, dem die in
    der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2290/88 af 26. juli 1988 om genindførelse
