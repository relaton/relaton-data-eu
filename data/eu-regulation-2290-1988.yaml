title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2290/88 of 26 July 1988 re-establishing
    the levying of customs duties on flags and paving falling within CN codes 6908
    10 and 6908 90, originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2290/88 de la Commission du 26 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables aux carreaux
    et dalles de pavement des codes 6908 10 et 6908 90 de la nomenclature combinée,
    originaires du Brésil, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
