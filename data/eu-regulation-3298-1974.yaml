id: EURegulation32981974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3298/74 of the Council of 19 December 1974 extending
    the period of validity of Regulation (EEC) No 3576/73 of imports of the wine product
    exported under the label of 'Cyprus Sherry', originating in and coming from Cyprus,
    and the introduction of subsidies for similar wine products produced in the Community
    as originally constituted and exported to Ireland and the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3298/74 du Conseil, du 19 décembre 1974, prorogeant
    le règlement (CEE) n° 3576/73 relatif à l'importation du produit vinicole exporté
    sous la mention "cyprus sherry", originaire et en provenance de Chypre, et instituant
    des aides pour des produits vinicoles similaires produits dans la Communauté
    dans sa composition originaire et expédiés vers l'Irlande et le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3298/74 des Rates vom 19. Dezember 1974 zur Verlängerung
    der Verordnung (EWG) Nr. 3576/73 über die Einfuhr des Weinbauerzeugnisses mit
    Ursprung in und Herkunft aus Zypern, das unter der Bezeichnung "Cyprus Sherry"
    ausgeführt wird, sowie der Beihilferegelung für gleichartige Weinbauerzeugnisse,
    die in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung erzeugt und nach
    Irland und dem Vereinigten Königreich ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3298/74 af 19. december 1974 om forlængelse
    af forordning (EØF) nr. 3576/73 om indførsel af vinprodukter udført under betegnelsen
    »Cyprus Sherry«, der har oprindelse i og indføres fra Cypern, og om fastsættelse
    af en støtteordning for lignende vinprodukter, der er fremstillet inden for Fællesskabet
    i dets oprindelige udstrækning og afsendt til Irland og Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3298/74 del Consiglio, del 19 dicembre 1974, che proroga
    il regolamento (CEE) n. 3576/73 relativo all'importazione del prodotto vinicolo
    esportato sotto la menzione «Cyprus Sherry», originario e in provenienza da
    Cipro, ed istitutivo di aiuti per prodotti vinicoli simili prodotti nella Comunità
    nella sua composizione originaria e spediti verso l'Irlanda e il Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3298/74 van de Raad van 19 december 1974 tot verlenging
    van Verordening (EEG) nr. 3576/73 betreffende de invoer van het onder de naam
    "Cyprus Sherry" uitgevoerde wijnbouwprodukt van oorsprong en van herkomst uit
    Cyprus en houdende instelling van steunmaatregelen voor soortgelijke in de Gemeenschap
    in haar oorspronkelijke samenstelling geproduceerde wijnbouwprodukten die worden
    verzonden naar Ierland en het Verenigd Koninkrijk
  type: main
