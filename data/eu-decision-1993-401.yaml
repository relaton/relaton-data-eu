title:
- language: en
  script: Latn
  content: '93/401/EEC: Commission Decision of 16 June 1993 deferring, as regards
    the import of fruit plant propagating material and fruit plants intended for fruit
    production from third countries, the date referred to in Article 16 (2) of Directive
    92/34/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/401/CEE: Décision de la Commission du 16 juin 1993 prorogeant, en
    ce qui concerne les importations de matériels de multiplication de plantes fruitières
    et des plantes fruitières destinées à la production de fruits, en provenance
    de pays tiers, le délai fixé à l''article 16 paragraphe 2 de la directive 92/34/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '93/401/EWG: ENTSCHEIDUNG DER KOMMISSION vom 16. Juni 1993 zur Verlängerung
    des in Artikel 16 Absatz 2 der Richtlinie 92/34/EWG des Rates genannten Zeitraums
    hinsichtlich der Einfuhr von aus Drittländern stammendem Vermehrungs- und Pflanzenmaterial
    von Obstarten zur Fruchterzeugung'
  type: main
- language: da
  script: Latn
  content: '93/401/EØF: KOMMISSIONENS BESLUTNING af 16. juni 1993 om udsættelse
    af det i artikel 16, stk. 2, i Rådets direktiv 92/34/EØF omhandlede tidspunkt
    for så vidt angår indførsel fra tredjelande af frugtplanteformeringsmateriale
    og frugtplanter bestemt til frugtproduktion'
  type: main
- language: el
  script: Grek
  content: '93/401/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 16ης
    Ιουνίου 1993 για την παράταση, όσον αφορά την
    εισαγωγή πολλαπλασιαστικού υλικού οπωροφόρων
    φυτών και οπωροφόρων δένδρων που προορίζονται
    για την παραγωγή φρούτων από τρίτες χώρες,
    της προθεσμίας που αναφέρεται στο άρθρο 16 παράγραφος
    2 της οδηγίας 92/34/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '93/401/CEE: DECISIONE DELLA COMMISSIONE del 16 giugno 1993 che proroga
    il termine di cui all'' articolo 16, paragrafo 2 della direttiva 92/34/CEE per
    quanto concerne l'' importazione da paesi terzi dei materiali di moltiplicazione
    delle piante da frutto e delle piante da frutto destinate alla produzione di frutti'
  type: main
- language: nl
  script: Latn
  content: '93/401/EEG: BESCHIKKING VAN DE COMMISSIE van 16 juni 1993 tot verlenging
    van de in artikel 16, lid 2, van Richtlijn 92/34/EEG van de Raad bedoelde termijn
    met betrekking tot de invoer van voor de fruitteelt gebruikte fruitgewassen en
    teeltmateriaal daarvan uit derde landen'
  type: main
- language: pt
  script: Latn
  content: '93/401/CEE: DECISÃO DA COMISSÃO de 16 de Junho de 1993 que difere a
    data referida no no 2 do artigo 16o da Directiva 92/34/CEE do Conselho relativamente
    à importação de fruteiras e de materiais de propagação de fruteiras, destinados
    à produção de frutos, provenientes de países terceiros'
  type: main
- language: es
  script: Latn
  content: '93/401/CEE: DECISIÓN DE LA COMISIÓN de 16 de junio de 1993 por la que
    se prorroga la fecha mencionada en el apartado 2 del artículo 16 de la Directiva
    92/34/CEE del Consejo en el caso de las importaciones de terceros países de material
    de multiplicación de frutales y de plantones de frutal destinados a la producción
    frutícola'
  type: main
