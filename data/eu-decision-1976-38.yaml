id: EUDecision197638
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 October 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to girls' cotton skirts falling within subheading ex 61.02
    B, originating in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 9 octobre 1975, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les jupes en coton pour fillettes de la sous-position
    Ex 61.02 B du Tarif douanier commun, originaires de Taiwan et mises en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. Oktober 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Röcke für Mädchen, aus Baumwolle, der Tarifnummer ex 61.02 B des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. oktober 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage nederdele til piger, af bomuld, som henhører under pos. ex 61.02 B
    i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 ottobre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le gonne di cotone per ragazze, della sottovoce ex
    61.02 B della tariffa doganale comune, originarie di Taiwan e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 oktober 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd meisjesrokken van katoen van post ex 61.02 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
