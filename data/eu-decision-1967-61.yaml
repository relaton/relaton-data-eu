title:
- language: fr
  script: Latn
  content: Décision 67/61/CEE de la Commission, du 6 janvier 1967, portant prorogation
    de la décision du 3 décembre 1965, autorisant la République française à appliquer
    des mesures de protection au titre de l'article 115 alinéa 1 du Traité, en ce
    qui concerne l'importation "d'animaux vivants de l'espèce ovine" et de "viande
    ovine", originaires des pays tiers et mis en libre pratique dans d'autres États
    membres
  type: main
- language: de
  script: Latn
  content: '67/61/EWG: Entscheidung der Kommission vom 6. Januar 1967 zur Verlängerung
    der Geltungsdauer der Entscheidung vom 3. Dezember 1965, mit der die Französische
    Republik ermächtigt wird, nach Artikel 115 Absatz (1) des Vertrages bei der Einfuhr
    von aus dritten Ländern stammenden und in anderen Mitgliedstaaten im freien Verkehr
    befindlichen "lebenden Schafen" und "Fleisch von Schafen" Schutzmaßnahmen anzuwenden'
  type: main
- language: it
  script: Latn
  content: '67/61/CEE: Decisione della Commissione, del 6 gennaio 1967, che proroga
    la decisione del 3 dicembre 1965, con cui si autorizza la Repubblica francese
    ad applicare misure di protezione, ai sensi dell''articolo 115, paragrafo 1, del
    Trattato, per quanto concerne l''importazione di «animali vivi della specie ovina»
    e di «carne ovina», originari dei paesi terzi ed immessi in libera pratica in
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/61/EEG: Beschikking van de Commissie van 6 januari 1967 houdende verlenging
    van de beschikking van 3 december 1965 waarbij de Franse Republiek wordt gemachtigd
    om op grond van artikel 115, eerste alinea, van het Verdrag beschermende maatregelen
    toe te passen ten aanzien van de invoer van levende schapen en schapenvlees, van
    oorsprong uit derde landen en in andere Lid-Staten in het vrije verkeer gebracht'
  type: main
