    von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/177/EØF: Kommissionens beslutning af 11. februar 1988 om godkendelse
