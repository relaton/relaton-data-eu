  content: '88/177/EEC: Commission Decision of 11 February 1988 approving derogations
    provided for by Italy from certain provisions of Council Directive 77/93/EEC in
    respect of seed potatoes originating in Poland (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/177/CEE: Décision de la Commission du 11 février 1988 approuvant
    des dérogations prévues par l''Italie à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne les plants de pommes de terre originaires
    de la Pologne (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
