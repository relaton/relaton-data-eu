    za goriva iz biomase utvrđenima u Direktivi (EU) 2018/2001 Europskog parlamenta
    i Vijeća i o stavljanju izvan snage Provedbene odluke (EU) 2022/1657
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/3191 végrehajtási határozata (2024. december
