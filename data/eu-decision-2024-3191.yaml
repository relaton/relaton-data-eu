title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/3191 of 19 December 2024 on
    the recognition of the Sustainable Biomass Program voluntary scheme for demonstrating
    compliance with the requirements for biomass fuels set in Directive (EU) 2018/2001
    of the European Parliament and of the Council, and repealing Implementing Decision
    (EU) 2022/1657
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/3191 de la Commission du 19 décembre
    2024 portant reconnaissance du système volontaire Sustainable Biomass Program
    pour l’établissement de la conformité avec les exigences applicables aux combustibles
    issus de la biomasse énoncées dans la directive (UE) 2018/2001 du Parlement
    européen et du Conseil, et abrogeant la décision d’exécution (UE) 2022/1657
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/3191 der Kommission vom 19. Dezember
    2024 über die Anerkennung des freiwilligen Systems Sustainable Biomass Program
