    s požadavky na paliva z biomasy stanovenými ve směrnici Evropského parlamentu
    a Rady (EU) 2018/2001 a o zrušení prováděcího rozhodnutí (EU) 2022/1657
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/3191 af 19. december
