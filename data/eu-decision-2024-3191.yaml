    előállított üzemanyagokra vonatkozó követelményeknek való megfelelést
    igazoló Sustainable Biomass Program önkéntes rendszer elismeréséről, valamint
    az (EU) 2022/1657 végrehajtási határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/3191 della Commissione, del 19 dicembre
    2024, relativa al riconoscimento del sistema volontario Sustainable Biomass Program
    per dimostrare il rispetto dei requisiti della direttiva (UE) 2018/2001 del Parlamento
    europeo e del Consiglio per i combustibili da biomassa e che abroga la decisione
    di esecuzione (UE) 2022/1657
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/3191 (2024. gada 19. decembris),
