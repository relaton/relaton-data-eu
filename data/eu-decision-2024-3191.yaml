    van Uitvoeringsbesluit (EU) 2022/1657 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2024/3191 z dnia 19 grudnia 2024 r. w sprawie
