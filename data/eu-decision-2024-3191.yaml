    vederea demonstrării conformității cu cerințele privind combustibilii din
    biomasă stabilite în Directiva (UE) 2018/2001 a Parlamentului European și a
    Consiliului, precum și de abrogare a Deciziei de punere în aplicare (UE) 2022/1657
  type: main
