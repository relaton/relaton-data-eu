    modifiant la décision d’exécution (UE) 2019/1326 en ce qui concerne les normes
    harmonisées relatives à la compatibilité électromagnétique de l’équipement
    de comptage de l’électricité et des interrupteurs automatiques pour usages
    domestiques et analogues
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/622 der Kommission vom 7. April 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2019/1326 in Bezug auf harmonisierte
    Normen für die elektromagnetische Verträglichkeit von Elektrizitätszählern
    und Leitungsschutzschalter für Hausinstallationen und ähnliche Zwecke
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/622 на Комисията
