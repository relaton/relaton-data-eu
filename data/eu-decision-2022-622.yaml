    contagem de eletricidade e dos disjuntores para usos domésticos e análogos
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/622 a Comisiei din 7 aprilie 2022
    de modificare a Deciziei de punere în aplicare (UE) 2019/1326 în ceea ce privește
    standardele armonizate pentru compatibilitatea electromagnetică a echipamentelor
    de măsurare a energiei electrice și a întreruptoarelor automate pentru uz casnic
    și similar
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/622 zo 7. apríla 2022, ktorým
