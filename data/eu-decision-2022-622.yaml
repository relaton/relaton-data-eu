title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/622 of 7 April 2022 amending
    Implementing Decision (EU) 2019/1326 as regards the harmonised standards for electromagnetic
    compatibility of electricity metering equipment and circuit breakers for household
    and similar uses
  type: main
- language: fr
  script: Latn
