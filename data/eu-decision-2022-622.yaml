    normy pro elektromagnetickou kompatibilitu vybavení pro měření elektrické
    energie a jističe pro domácnost a podobné použití
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/622 af 7. april 2022
