    стандарти за електромагнитна съвместимост
    на електроизмервателно оборудване и електрически
    прекъсвачи за битови и подобни приложения
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/622 ze dne 7. dubna 2022, kterým
