    standartiem par elektroenerģijas uzskaites ierīču un mājsaimniecības un līdzīgiem
    lietojumiem paredzētu slēdžu elektromagnētisko savietojamību
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/622 2022 m. balandžio 7 d.
