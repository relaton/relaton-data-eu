  content: '83/521/EEC: Commission Decision of 12 October 1983 establishing that the
    apparatus described as ''Cyber 170-720 and 170-750'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/521/CEE: Décision de la Commission du 12 octobre 1983 constatant que
    l'' importation des appareils dénommés "Cyber 170-720 et 170-750" ne peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
