title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2035/83 of 22 July 1983 amending Regulation
    (EEC) No 1602/82 in respect of coefficients to be applied to the production aid
    for prunes and dried plums (prunes d' Ente)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2035/83 de la Commission du 22 juillet 1983 modifiant
    le règlement (CEE) no 1602/82 en ce qui concerne les coefficients à appliquer
    au montant de l' aide à la production pour les pruneaux et au prix minimal fixé
    pour les prunes d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2035/83 der Kommission vom 22. Juli 1983 zur Änderung
    der Verordnung (EWG) Nr. 1602/82 zur Festsetzung der Koeffizienten, mit denen
    der für Trockenpflaumen festgesetzte Betrag der Produktionsbeihilfe und der für
    getrocknete Pflaumen (prunes d' Ente) festgesetzte Mindestpreis zu multiplizieren
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2035/83 af 22. juli 1983 om ændring
    af forordning (EØF) nr. 1602/82 for så vidt angår fastsættelse af de koefficienter,
    hvormed producentstøtten for svesker samt minimumsprisen for tørrede blommer
    "prunes d' Ente" skal multipliceres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2035/83 της Επιτροπής
    της 22ας Ιουλίου 1983 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 1602/82 όσον αφορά τους συντελεστές
    που πρέπει να εφαρμοστούν στο ποσό της ενισχύσεως
    στην παραγωγή για τα αποξηραμένα δαμάσκηνα
    και τα αποξηραμένα δαμάσκηνα d' Ente
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2035/83 della Commissione del 22 luglio 1983 che modifica
    il regolamento (CEE) n. 1602/82, per quanto concerne i coefficienti da applicare
    all' aiuto alla produzione per le prugne secche ed al prezzo minimo fissato per
    le susine da innesto (prunes d' Ente)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2035/83 van de Commissie van 22 juli 1983 houdende
    wijziging van Verordening (EEG) nr. 1602/82 inzake de vaststelling van de coëfficiënten
    die moeten worden toegepast op het bedrag van de steun bij de produktie van pruimedanten
    en gedroogde geënte pruimen (,,Prunes d' Ente' ' )
  type: main
