---
id: EUDecision1976666
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 June 1976 authorizing the Italian Republic not
    to apply Community treatment to used scrapers, falling within subheading 84.23
    A ex I of the Common Customs Tariff, originating in the United States, the Republic
    of South Africa, Australia and Japan and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '76/666/CEE: Décision de la Commission, du 14 juin 1976, autorisant la
    République italienne à exclure du traitement communautaire les scrapers usagés,
    de la position 84.23 A Ex I du Tarif douanier commun, originaires des États-Unis,
    de la République d''Afrique du SUD, d''Australie et du Japon et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Juni 1976, mit der die Italienische
    Republik ermächtigt wird, aus den USA, der Republik Südafrika, aus Australien
    und Japan stammende und in den anderen Mitgliedstaaten im freien Verkehr befindliche
    gebrauchte Schürfwagen (scrapers) der Tarifstelle 84.23 A ex I des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. juni 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage brugte motorscrapers som henhører
    under pos. 84.23 A ex I i den fælles toldtarif, har oprindelse i De forenede
    Stater, Den sydafrikanske Republik, Australien eller Japan og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 giugno 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le livellatrici (scrapers) usate
    della sottovoce ex 84.23 A ex I della tariffa doganale comune, originarie degli
    Stati Uniti, dell'Africa del Sud, dell'Australia e del Giappone e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 juni 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd gebruikte schrapers, van post 84.23 A ex I van het gemeenschappelijk
    douanetarief, van oorsprong uit de Verenigde Staten, de Republiek Zuid-Afrika,
    Australië en Japan en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
