title:
- language: en
  script: Latn
  content: '78/914/EEC: Commission Decision of 18 October 1978 authorizing the United
    Kingdom not to apply Community treatment to cotton yarn, not put up for retail
    sale, falling within heading No 55.05 of the Common Customs Tariff (NIMEXE codes
    55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58, 61, 65, 67,
    69, 72, 78, 92, 98) originating in Brazil and in free circulation in the other
    Member States'
  type: main
- language: fr
  script: Latn
  content: '78/914/CEE: Décision de la Commission, du 18 octobre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les fils de coton non conditionnés
    pour la vente au détail de la position 55.05 du tarif douanier commun (codes
    Nimexe: 55.05-13; 19; 21; 25; 27; 29; 33; 35; 37; 41; 45; 46; 48; 52; 58; 61;
    65; 67; 69; 72; 78; 92; 98), originaires du Brésil et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/914/EWG: Entscheidung der Kommission vom 18. Oktober 1978, mit der
    das Vereinigte Königreich ermáchtigt wird, aus Brasilien stammende und in den
    úbrigen Mitgliedstaaten im freien Verkehr befindliche Baumwollgarne, nicht in
    Aufmachungen fúr den Einzelverkauf, der Tarifnummer 55.05 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 55.05-13; 19; 21; 25; 27; 29; 33; 35; 37; 41; 45; 46; 48;
    52; 58; 61; 65; 67; 69; 72; 78; 92; 98) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/914/EØF: Kommissionens beslutning af 18. oktober 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage garn af bomuld,
    ikke i detailsalgsoplægninger, som henhører under pos. 55.05 i den fælles toldtarif
    (NIMEXE-kode 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52, 58,
    61, 65, 67, 69, 72, 78, 92, 98), har oprindelse i Brasilien og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/914/CEE: Decisione della Commissione, del 18 ottobre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i filati di cotone non
    preparati per la vendita al minuto, della voce 55.05 della tariffa doganale comune
    (codice Nimexe: 55.05-13, 19, 21, 25, 27, 29, 33, 35, 37, 41, 45, 46, 48, 52,
    58, 61, 65, 67, 69, 72, 78, 92, 98), originari del Brasile e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/914/EEG: Beschikking van de Commissie van 18 oktober 1978 waarbij het
    Verenigd Koninkrijk wordt gemachtigd garens van katoen, niet gereed voor de verkoop
    in het klein, van post 55.05 van het gemeenschappelijk douanetarief (NIMEXE-code
    : 55.05-13 ; 19 ; 21 ; 25 ; 27 ; 29 ; 33 ; 35 ; 37 ; 41 ; 45 ; 46 ; 48 ; 52 ;
    58 ; 61 ; 65 ; 67 ; 69 ; 72 ; 78 ; 92 ; 98), van oorsprong uit Brazilië en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
