  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1954/2005 z dnia 29 listopada 2005 r. zmieniające
    rozporządzenie (WE) nr 796/2004 ustanawiające szczegółowe zasady wdrażania
    wzajemnej zgodności, modulacji oraz zintegrowanego systemu zarządzania i kontroli
