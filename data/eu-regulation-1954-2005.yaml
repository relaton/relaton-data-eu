  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1954/2005, annettu 29 päivänä marraskuuta
    2005 , yhteisen maatalouspolitiikan suoria tukijärjestelmiä koskevista yhteisistä
    säännöistä ja tietyistä viljelijöiden tukijärjestelmistä annetussa neuvoston
    asetuksessa (EY) N:o 1782/2003 säädettyjen täydentävien ehtojen, tuen mukauttamisen
    ja yhdennetyn hallinto- ja valvontajärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (EY) N:o 796/2004 muuttamisesta ja asetuksesta
    (EY) N:o 1782/2003 poikkeamisesta tuen maksamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1954/2005/EK rendelete ( 2005. november 29. ) a közös agrárpolitika
    keretébe tartozó közvetlen támogatási rendszerek közös szabályainak megállapításáról
    és a mezőgazdasági termelők részére meghatározott támogatási rendszerek
    létrehozásáról szóló, 1782/2003/EK tanácsi rendelet által előírt kölcsönös
    megfeleltetés, moduláció, valamint integrált igazgatási és ellenőrzési
    rendszer végrehajtására vonatkozó részletes szabályok megállapításáról
    szóló 796/2004/EK rendelet módosításáról és a támogatás kifizetése
    tekintetében az 1782/2003/EK rendelettől való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1954/2005 della Commissione, del 29 novembre 2005 ,
    che modifica il regolamento (CE) n. 796/2004 recante modalità di applicazione
    della condizionalità, della modulazione e del sistema integrato di gestione e
    di controllo di cui al regolamento (CE) n. 1782/2003 del Consiglio che stabilisce
    norme comuni relative ai regimi di sostegno diretto nell’ambito della politica
    agricola comune e istituisce taluni regimi di sostegno a favore degli agricoltori,
    e recante deroga al regolamento (CE) n. 1782/2003 per quanto riguarda il pagamento
    degli aiuti
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1954/2005 ( 2005. gada 29. novembris ) par grozījumiem
    Regulā (EK) Nr. 796/2004, ar ko nosaka sīki izstrādātus noteikumus par savstarpēju
    atbilstību, pielāgošanu un integrētu pārvaldes un kontroles sistēmu, kas
    paredzēta Padomes Regulā (EK) Nr. 1782/2003, ar ko izveido kopīgus tieša atbalsta
    shēmu noteikumus saskaņā ar kopējo lauksaimniecības politiku un izveido dažas
    atbalsta shēmas lauksaimniekiem, un atkāpjoties no Regulas (EK) Nr. 1782/2003
    noteikumiem par atbalsta maksājumiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 29 d. Komisijos reglamentas (EB) Nr. 1954/2005, iš
    dalies keičiantis Reglamentą (EB) Nr. 796/2004, nustatantį išsamias kompleksinio
    paramos susiejimo, moduliavimo ir integruotos administravimo ir kontrolės sistemos,
    numatytos Tarybos reglamente (EB) Nr. 1782/2003, nustatančiame bendrąsias tiesioginės
    paramos schemų pagal bendrąją žemės ūkio politiką taisykles ir nustatančiame
    tam tikras paramos schemas ūkininkams, ir nukrypstančiame nuo Reglamento (EB)
    Nr. 1782/2003 dėl pagalbos išmokos, įgyvendinimo taisykles
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1954/2005 tad- 29 ta' Novembru 2005
    li jemenda r-Regolament (KE) Nru 796/2004 li jippreskrivi regoli dettaljati għall-implementazzjoni
    ta' konformità [kundizzjonalità], modulazzjoni u amministrazzjoni integrata
    u sistema ta' kontroll kif hemm provvediment dwarhom fir-Regolament tal-Kunsill
