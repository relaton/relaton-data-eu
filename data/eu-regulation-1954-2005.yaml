title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1954/2005 of 29 November 2005 amending Regulation
    (EC) No 796/2004 laying down detailed rules for the implementation of cross-compliance,
    modulation and the integrated administration and control system provided for in
    Council Regulation (EC) No 1782/2003 establishing common rules for direct support
    schemes under the common agricultural policy and establishing certain support
    schemes for farmers and derogating from Regulation (EC) No 1782/2003 as regards
    payment of the aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1954/2005 de la Commission du 29 novembre 2005 modifiant
    le règlement (CE) n o 796/2004 portant modalités d'application de la conditionnalité,
    de la modulation et du système intégré de gestion et de contrôle prévus par
    le règlement (CE) n o 1782/2003 du Conseil établissant des règles communes
    pour les régimes de soutien direct dans le cadre de la politique agricole commune
    et établissant certains régimes de soutien en faveur des agriculteurs, et dérogeant
    au règlement (CE) n o 1782/2003 en ce qui concerne le paiement de l’aide
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1954/2005 der Kommission vom 29. November 2005 zur
    Änderung der Verordnung (EG) Nr. 796/2004 mit Durchführungsbestimmungen zur
    Einhaltung anderweitiger Verpflichtungen, zur Modulation und zum Integrierten
    Verwaltungs- und Kontrollsystem nach der Verordnung (EG) Nr. 1782/2003 des Rates
    mit gemeinsamen Regeln für Direktzahlungen im Rahmen der Gemeinsamen Agrarpolitik
    und mit bestimmten Stützungsregelungen für Inhaber landwirtschaftlicher Betriebe
    und zur Abweichung von der Verordnung (EG) Nr. 1782/2003 hinsichtlich der Beihilfezahlung
  type: main
