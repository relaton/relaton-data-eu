  script: Latn
  content: Regulamento (CE) n. o 1954/2005 da Comissão, de 29 de Novembro de 2005
    , que altera o Regulamento (CE) n. o 796/2004 que estabelece regras de execução
    relativas à condicionalidade, à modulação e ao sistema integrado de gestão
    e de controlo previstos no Regulamento (CE) n. o 1782/2003 do Conselho que estabelece
    regras comuns para os regimes de apoio directo no âmbito da política agrícola
    comum e institui determinados regimes de apoio aos agricultores e derroga ao Regulamento
    (CE) n. o 1782/2003 no que respeita ao pagamento da ajuda
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1954/2005 al Comisiei din 29 noiembrie 2005 de modificare
    a Regulamentului (CE) nr. 796/2004 de stabilire a normelor de aplicare a ecocondiționalității,
    a modulării și a sistemului integrat de gestionare și control, prevăzute de
    Regulamentul (CE) nr. 1782/2003 al Consiliului de stabilire a normelor comune
    pentru schemele de sprijin direct în cadrul politicii agricole comune și de
    stabilire a anumitor scheme de sprijin pentru agricultori și de derogare de la
    Regulamentul (CE) nr. 1782/2003 în ceea ce privește plata ajutorului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1954/2005 z 29. novembra 2005 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 796/2004, ktoré ustanovuje podrobné pravidlá
    na uplatňovanie krížového plnenia, modulácie a integrovaného správneho
    a kontrolného systému uvedeného v nariadení Rady (ES) č. 1782/2003, ktorým
    sa stanovujú spoločné pravidlá pre režimy priamej podpory v rámci spoločnej
    poľnohospodárskej politiky a ktorým sa zavádzajú niektoré režimy podpory
    pre poľnohospodárov a ktorým sa stanovuje odchýlka od nariadenia (ES) č.
    1782/2003, pokiaľ ide o vyplácanie podpory
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1954/2005 z dne 29. novembra 2005 o spremembi
    Uredbe (ES) št. 796/2004 o določitvi podrobnih pravil za izvajanje navzkrižne
    skladnosti, modulacije in integriranega administrativnega in kontrolnega sistema,
    predvidenih z Uredbo Sveta (ES) št. 1782/2003 o skupnih pravilih za sheme neposrednih
    podpor v okviru skupne kmetijske politike ter o uvedbi nekaterih shem podpor za
    kmete in o odstopanju od Uredbe (ES) št. 1782/2003 v zvezi s plačilom pomoči
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1954/2005 de la Comisión, de 29 de noviembre de 2005
    , que modifica el Reglamento (CE) n o 796/2004 por el que se establecen disposiciones
    para la aplicación de la condicionalidad, la modulación y el sistema integrado
    de gestión y control previstos en el Reglamento (CE) n o 1782/2003 del Consejo
    por el que se establecen disposiciones comunes aplicables a los regímenes de
    ayuda directa en el marco de la política agrícola común y se instauran determinados
    regímenes de ayuda a los agricultores y establece excepciones al Reglamento (CE)
    n o 1782/2003 en lo que se refiere al pago de la ayuda
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1954/2005 av den 29 november 2005 om
    ändring av förordning (EG) nr 796/2004 om närmare föreskrifter för tillämpningen
    av de tvärvillkor, den modulering och det integrerade administrations- och kontrollsystem
    som föreskrivs i rådets förordning (EG) nr 1782/2003 om upprättande av gemensamma
    bestämmelser för system för direktstöd inom den gemensamma jordbrukspolitiken
    och om upprättande av vissa stödsystem för jordbrukare, och om avvikelse från
    förordning (EG) nr 1782/2003, när det gäller stödutbetalning
