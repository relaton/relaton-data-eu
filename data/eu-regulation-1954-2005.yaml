  script: Latn
  content: Nařízení Komise (ES) č. 1954/2005 ze dne 29. listopadu 2005 , kterým
    se mění nařízení (ES) č. 796/2004, kterým se stanoví prováděcí pravidla
    pro podmíněnost, odlišení a integrovaný administrativní a kontrolní systém
    podle nařízení Rady (ES) č. 1782/2003, kterým se stanoví společná pravidla
    pro režimy přímých podpor v rámci společné zemědělské politiky a kterým
    se zavádějí některé režimy podpor pro zemědělce, a kterým se stanoví
    odchylka od nařízení (ES) č. 1782/2003 týkající se platby podpory
  type: main
