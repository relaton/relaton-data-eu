title:
- language: en
  script: Latn
  content: '93/111/EEC: Council Decision of 15 february 1993 authorizing the United
    Kingdom to apply an optional measure derogating from Article 17 of the sixth Directive
    (77/388/EEC) on the harmonization of the laws of the Member States relating to
    turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '93/111/CEE: Décision du Conseil, du 15 février 1993, autorisant le Royaume-Uni
    à appliquer une mesure facultative dérogatoire à l'' article 17 de la sixième
    directive (77/388/CEE) en matière d'' harmonisation des législations des Etats
    membres relatives aux taxes sur le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '93/111/EWG: Entscheidung des Rates vom 15. Februar 1993 zur Ermächtigung
    des Vereinigten Königreichs, eine fakultative abweichende Maßnahme zu Artikel
    17 der Sechsten Richtlinie (77/388/EWG) zur Harmonisierung der Rechtsvorschriften
    der Mitgliedstaaten über die Umsatzsteuern anzuwenden'
  type: main
- language: da
  script: Latn
  content: '93/111/EØF: Rådets beslutning af 15. februar 1993 om bemyndigelse af
    Det Forenede Kongerige til at anvende en fakultativ foranstaltning, der fraviger
    bestemmelserne i artikel 17 i sjette direktiv (77/388/EØF) om harmonisering af
    medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '93/111/ΕΟΚ: Απόφαση του Συμβουλίου της 15ης
    Φεβρουαρίου 1993 με την οποία επιτρέπεται στο
    Ηνωμένο Βασίλειο να εφαρμόσει ένα προαιρετικό
    μέτρο κατά παρέκκλιση του άρθρου 17 της έκτης
    οδηγίας (77/388/ΕΟΚ) περί εναρμονίσεως των νομοθεσιών
    των κρατών μελών σχετικά με το φόρο κύκλου
    εργασιών'
  type: main
- language: it
  script: Latn
  content: '93/111/CEE: Decisione del Consiglio, del 15 febbraio 1993, che autorizza
    il Regno Unito ad applicare una misura facoltativa di deroga all'' articolo 17
    della sesta direttiva (77/388/CEE) in materia di armonizzazione delle legislazioni
    degli Stati membri relative alle imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '93/111/EEG: Beschikking van de Raad van 15 februari 1993 waarbij het Verenigd
    Koninkrijk wordt gemachtigd om een facultatieve maatregel toe te passen die afwijkt
    van artikel 17 van de Zesde Richtlijn (77/388/EEG) betreffende de harmonisatie
    van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '93/111/CEE: Decisão do Conselho, de 15 de Fevereiro de 1993, que autoriza
    o Reino Unido a aplicar uma medida facultativa derrogatória ao artigo 17° da
    Sexta Directiva (77/388/CEE) em matéria de harmonização das legislações dos
    Estados-membros relativas aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '93/111/CEE: Decisión del Consejo, de 15 de febrero de 1993, por la que
    se autoriza al Reino Unido a aplicar una medida optativa de excepción al artículo
    17 de la sexta Directiva (77/388/CEE) en materia de armonización de las legislaciones
    de los Estados miembros relativas a los impuestos sobre el volumen de negocios'
  type: main
