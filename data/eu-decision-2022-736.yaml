  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/736 z dne 11. maja 2022 o spremembi
    odločb 2007/305/ES, 2007/306/ES in 2007/307/ES v zvezi s prehodnim obdobjem za
    sledove hibridne oljne ogrščice Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4), hibridne
    oljne ogrščice Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) in oljne ogrščice Topas
    19/2 (ACS-BNØØ7-1) ter proizvodov iz njih (notificirano pod dokumentarno številko
    C(2022) 3009) (Besedilo v nemškem jeziku je edino verodostojno)
