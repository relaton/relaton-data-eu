    on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/736, annettu 11 päivänä
    toukokuuta 2022, päätösten 2007/305/EY, 2007/306/EY ja 2007/307/EY muuttamisesta
    siltä osin kuin on kyse Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4) -hybridirapsin,
    Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) -hybridirapsin ja Topas 19/2 (ACS-BNØØ7-1)
    -rapsin sekä niistä valmistettujen tuotteiden jäämien sallimista koskevasta
    siirtymäajasta (tiedoksiannettu numerolla C(2022) 3009) (Ainoastaan saksankielinen
    teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/736 ón gCoimisiún an 11 Bealtaine
    2022 lena leasaítear Cinntí 2007/305/CE, 2007/306/CE agus 2007/307/CE a mhéid
    a bhaineann leis an tréimhse lamháltais i gcás rianta de ráib hibrideach Ms1xRf1
    (ACS-BNØØ4-7xACS-BNØØ1-4), de ráib hibrideach Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5)
    agus de ráib Topas 19/2 (ACS-BNØØ7-1), chomh maith lena gcuid táirgí díorthaithe
    (a bhfuil fógra tugtha ina leith faoi dhoiciméad C(2022) 3009) (An téacs Gearmáinise
    amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/736 оd 11. svibnja 2022. o izmjeni
    odluka 2007/305/EZ, 2007/306/EZ i 2007/307/EZ u pogledu razdoblja tolerancije
    za tragove hibrida uljane repice Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4), hibrida
    uljane repice Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) i uljane repice Topas 19/2
    (ACS-BNØØ7-1) te od njih dobivenih proizvoda (priopćeno pod brojem dokumenta
    C(2022) 3009) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/736 végrehajtási határozata (2022. május 11.)
    a 2007/305/EK, a 2007/306/EK és a 2007/307/EK határozatnak az Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4)
    hibrid olajrepce, az Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) hibrid olajrepce és
    a Topas 19/2 (ACS-BNØØ7-1) olajrepce, valamint az azokból előállított termékek
    nyomaira vonatkozó türelmi időszak tekintetében történő módosításáról
    (az értesítés a C(2022) 3009. számú dokumentummal történt) (Csak a német
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/736 della Commissione dell'11 maggio
    2022 che modifica le decisioni 2007/305/CE, 2007/306/CE e 2007/307/CE per quanto
    riguarda il periodo di tolleranza delle tracce di colza ibrida Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4),
    di colza ibrida Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) e di colza Topas 19/2 (ACS-BNØØ7-1)
    e dei loro prodotti derivati [notificata con il numero C(2022) 3009] (Il testo
    in lingua tedesca è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/736 (2022. gada 11. maijs), ar
    ko attiecībā uz eļļas rapša hibrīda Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4),
    eļļas rapša hibrīda Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) un eļļas rapša
    Topas 19/2 (ACS-BNØØ7-1), kā arī no tiem atvasināto produktu piemaisījumu
    pielaides periodu groza Lēmumu 2007/305/EK, 2007/306/EK un 2007/307/EK (izziņots
    ar dokumenta numuru C(2022) 3009) (Autentisks ir tikai teksts vācu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/736 2022 m. gegužės 11 d.
    kuriuo dėl hibridinių aliejinių rapsų Ms1xRf1 (ACS-BNØØ4–7xACS-BNØØ1–4),
    hibridinių aliejinių rapsų Ms1xRf2 (ACS-BNØØ4–7xACS-BNØØ2–5) ir aliejinių
    rapsų „Topas 19/2“ (ACS-BNØØ7–1) bei jų produktų pėdsakų toleravimo
    laikotarpio iš dalies keičiami sprendimai 2007/305/EB, 2007/306/EB ir 2007/307/EB
    (pranešta dokumentu Nr. C(2022) 3009) (Tekstas autentiškas tik vokiečių kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/736 tal-11
    ta’ Mejju 2022 li temenda d-Deċiżjonijiet 2007/305/KE, 2007/306/KE u 2007/307/KE
    rigward il-perjodu ta’ tolleranza għal traċċi taż-żrieragħ tal-kolza ibridi
    Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4), taż-żrieragħ tal-kolza ibridi Ms1xRf2
    (ACS-BNØØ4-7xACS-BNØØ2-5) u taż-żrieragħ tal-kolza Topas 19/2 (ACS-BNØØ7-1),
    kif ukoll il-prodotti dderivati minnhom (notifikata bid-dokument C(2022) 3009)
    (It-test bil-Ġermaniż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/736 van de Commissie van 11 mei 2022 tot wijziging
    van de Beschikkingen 2007/305/EG, 2007/306/EG en 2007/307/EG wat betreft de tolerantieperiode
    voor sporen van hybride Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4)-koolzaad, hybride
    Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5)-koolzaad en Topas 19/2 (ACS-BNØØ7-1)-koolzaad
    en daarvan afgeleide producten (Kennisgeving geschied onder nummer C(2022) 3009)
    (Slechts de tekst in de Duitse taal is authentiek)
  type: main
- language: pl
  script: Latn
