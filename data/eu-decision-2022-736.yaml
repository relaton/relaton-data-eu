    γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/736, 11. mai 2022, millega muudetakse
    otsuseid 2007/305/EÜ, 2007/306/EÜ ja 2007/307/EÜ ajavahemiku osas, mil hübriidrapsi
    Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4), hübriidrapsi Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5)
    ja rapsi Topas 19/2 (ACS-BNØØ7-1) ning nendest saadud toodete jälgede esinemine
