  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/736 a Comisiei din 11 mai 2022
    de modificare a Deciziilor 2007/305/CE, 2007/306/CE și 2007/307/CE în ceea ce
    privește perioada de toleranță pentru urmele de rapiță hibridă Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4),
    de rapiță hibridă Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) și de rapiță Topas
    19/2 (ACS-BNØØ7-1), precum și pentru produsele derivate ale acestora [notificată
    cu numărul C(2022) 3009] (Numai textul în limba germană este autentic)
  type: main
