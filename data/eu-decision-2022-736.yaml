title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/736 of 11 May 2022 amending
    Decisions 2007/305/EC, 2007/306/EC and 2007/307/EC as regards the tolerance period
    for traces of Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4) hybrid oilseed rape, Ms1xRf2
    (ACS-BNØØ4-7xACS-BNØØ2-5) hybrid oilseed rape and Topas 19/2 (ACS-BNØØ7-1)
    oilseed rape, as well as their derived products (notified under document C(2022)
    3009) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/736 de la Commission du 11 mai 2022
    modifiant les décisions 2007/305/CE, 2007/306/CE et 2007/307/CE en ce qui concerne
    le délai de tolérance pour les traces de colza hybride Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4),
    de colza hybride Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5) et de colza Topas 19/2
    (ACS-BNØØ7-1), ainsi que des produits qui en sont dérivés [notifiée sous
    le numéro C(2022) 3009] (Le texte en langue allemande est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/736 der Kommission vom 11. Mai 2022 zur
    Änderung der Entscheidungen 2007/305/EG, 2007/306/EG und 2007/307/EG hinsichtlich
    des Toleranzzeitraums für Spuren von Ms1xRf1 (ACS-BNØØ4-7xACS-BNØØ1-4)-Hybrid-Raps,
    Ms1xRf2 (ACS-BNØØ4-7xACS-BNØØ2-5)-Hybrid-Raps und Topas 19/2 (ACS-BNØØ7-1)-Raps
    sowie von daraus gewonnenen Erzeugnissen (Bekannt gegeben unter Aktenzeichen C(2022)
    3009) (Nur der deutsche Text ist verbindlich)
  type: main
