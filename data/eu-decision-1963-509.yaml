title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 31 juillet 1963, relative au recours de
    la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '63/509/EWG: Entscheidung der Kornmission vom 31. Juli 1963 über die Inanspruchnahme
    des Artikels 115 Absatz (1) des Vertrages durch die Französische Republik, um
    bestimmte, in den übrigen Mitgliedstaaten im freien Verkehr befindliche Erzeugnisse
    aus dritten Ländern von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '63/509/CEE: Decisione della Commissione del 31 luglio 1963 relativa al
    ricorso della Repubblica francese all''articolo 115, comma 1, del Trattato, per
    escludere dal trattamento comunitario alcuni prodotti originari di paesi terzi,
    immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/509/EEG: Beschikking van de Commissie van 31 juli 1963 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, alinea 1, van
    het Verdrag bepaalde produkten, die van oorsprong zijn uit derde landen en in
    de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
