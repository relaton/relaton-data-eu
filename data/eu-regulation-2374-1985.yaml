title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2374/85 of 20 August 1985 re-establishing
    the levying of the customs duties on camphor (natural refined and synthetic) falling
    within subheading 29.13 B I b), originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2374/85 de la Commission du 20 août 1985 portant rétablissement
    de la perception des droits de douane applicables au camphre naturel raffiné
    et synthétique de la sous-position 29.13 B I b) du tarif douanier commun, originaire
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2374/85 der Kommission vom 20. August 1985 zur Wiedereinführung
    der Erhebung der Zölle für Kampfer, natürlicher, raffiniert, sowie synthetischer,
    der Tarifstelle 29.13 B I b) des Gemeinsamen Zolltarifs, mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2374/85 af 20. august 1985 om genindførelse
    af opkrævning af told for campher, raffineret naturlig og syntetisk, henhørende
    under pos. 29.13 B I b), med oprindelse i Kina, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2374/85 της Επιτροπής
    της 20ής Αυγούστου 1985 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για την καμφορά, φυσική
    καθαρή και συνθετική της διάκρισης 29.13 Β Ι β)
    του Κοινού Δασμολογίου, καταγωγής Κίνας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3562/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2374/85 della Commissione del 20 agosto 1985 che ripristina
    la riscossione dei dazi doganali applicabili alla canfora naturale raffinata e
    sintetica, della sottovoce 29.13 B I b) della tariffa doganale comune, originaria
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2374/85 van de Commissie van 20 augustus 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kamfer, natuurlijke,
    andere dan ruwe, alsmede synthetische, van postonderverdeling 29.13 B I b), van
    oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
