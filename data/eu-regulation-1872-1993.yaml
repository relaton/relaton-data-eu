  content: COMMISSION REGULATION (EEC) No 1872/93 of 12 July 1993 re-establishing
    the levying of customs duties on products of category 28 (order No 40.0280), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
