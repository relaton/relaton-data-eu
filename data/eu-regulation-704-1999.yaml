title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 704/1999 of 31 March 1999 laying down detailed
    rules for the application of the arrangements for imports of eggs and poultrymeat
    products originating in the African, Caribbean and Pacific States (ACP States)
    and repealing Regulation (EEC) No 903/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 704/1999 de la Commission, du 31 mars 1999, établissant
    les modalités d'application du régime applicable aux produits des secteurs des
    oeufs et de la viande de volailles originaires des États d'Afrique, des Caraïbes
    et du Pacifique (ACP) et abrogeant le règlement (CEE) n° 903/90
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 704/1999 der Kommission vom 31. März 1999 mit den
    Durchführungsbestimmungen zur Regelung der Einfuhr von Erzeugnissen der Sektoren
    Eier und Geflügelfleisch mit Ursprung in den Staaten in Afrika, im karibischen
    Raum und im Pazifischen Ozean (AKP- Staaten) und zur Aufhebung der Verordnung
    (EWG) Nr. 903/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 704/1999 af 31. marts 1999 om gennemførelsesbestemmelser
    til ordningen for æg og fjerkrækød med oprindelse i staterne i Afrika, Vestindien
    og Stillehavet (AVS) og om ophævelse af forordning (EØF) nr. 903/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 704/1999 της Επιτροπής,
    της 31ης Μαρτίου 1999, για τη θέσπιση των λεπτομερειών
    εφαρμογής του καθεστώτος που εφαρμόζεται για
    τα προϊόντα των τομέων των αυγών και του κρέατος
    πουλερικών καταγωγής των κρατών της Αφρικής,
    της Καραϊβικής και του Ειρηνικού (ΑΚΕ), και
    για την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    903/90
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 704/1999, annettu 31 päivänä maaliskuuta 1999,
    Afrikan, Karibian ja Tyynenmeren valtioista (AKT-valtioista) peräisin olevien
    muna-alan ja siipikarjanliha-alan tuotteisiin sovellettavan järjestelmän soveltamista
    koskevista yksityiskohtaisista säännöistä ja asetuksen (ETY) N:o 903/90 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 704/1999 della Commissione, del 31 marzo 1999, che
    stabilisce le modalità di applicazione del regime relativo all'importazione di
    taluni prodotti nei settori delle uova e del pollame originari degli Stati dell'Africa,
    dei Caraibi e del Pacifico (Stati ACP) e che abroga il regolamento (CEE) n.903/90
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 704/1999 van de Commissie van 31 maart 1999 houdende
    vaststelling van de bepalingen ter uitvoering van de regeling voor de producten
    van de sectoren eieren en slachtpluimvee van oorsprong uit de staten in Afrika,
    het Caribische gebied en de Stille Oceaan (ACS-staten), en houdende intrekking
    van Verordening (EEG) nr. 903/90
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 704/1999 da Comissão, de 31 de Março de 1999, que
