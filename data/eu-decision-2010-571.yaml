  script: Latn
  content: '2010/571/EU: Commission Decision of 24 September 2010 amending, for the
    purposes of adapting to scientific and technical progress, the Annex to Directive
    2002/95/EC of the European Parliament and of the Council as regards exemptions
    for applications containing lead, mercury, cadmium, hexavalent chromium, polybrominated
    biphenyls or polybrominated diphenyl ethers (notified under document C(2010) 6403)'
  type: main
- language: fr
  script: Latn
