  type: main
- language: hu
  script: Latn
  content: A Bizottság 145/2003/EK rendelete (2003. január 27.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről,
    valamint a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK tanácsi rendelet kilencedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 145/2003 della Commissione, del 27 gennaio 2003, recante
    nona modifica del regolamento (CE) n. 881/2002 del Consiglio che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 145/2003 (2003. gada 27. janvāris), ar kuru
