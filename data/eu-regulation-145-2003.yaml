title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 145/2003 of 27 January 2003 amending for
    the ninth time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 145/2003 de la Commission du 27 janvier 2003 modifiant
    pour la neuvième fois le règlement (CE) n° 881/2002 du Conseil instituant certaines
    mesures restrictives spécifiques à l'encontre de certaines personnes et entités
    liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et abrogeant
    le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 145/2003 der Kommission vom 27. Januar 2003 zur neunten
