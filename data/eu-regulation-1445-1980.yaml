id: EURegulation14451980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1445/80 of 9 June 1980 re-establishing the
    levying of customs duties on other made up textile articles, woven, excluding
    those of categories 113 and 114, products of category 112 (code 1120), originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1445/80 de la Commission, du 9 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, à l' exception de ceux des catégories 113 et 114,
    de la catégorie 112 (code 1120), originaires de l' Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1445/80 der Kommission vom 9. Juni 1980 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben,
    mit Ausnahme derjenigen der Kategorien 113 und 114, der Warenkategorie Nr. 112
    (Kennziffer 1120), mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr.
    2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1445/80 af 9. juni 1980 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer, bortset
    fra de under kategori 113 og 114 henhørende varer, under kategori 112 (kode 1120),
    som har oprindelse i Indien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1445/80 della Commissione, del 9 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ad altri manufatti confezionati
    di tessuti, esclusi quelli delle categorie 113 e 114, della categoria di prodotti
    n. 112 (codice 1120), originari dell' India, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1445/80 van de Commissie van 9 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels met uitzondering van die van de categorieën 113 en 114
    van de categorie van produkten nr. 112 (codenummer 1120), van oorsprong uit India,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2894/79 van de Raad
  type: main
