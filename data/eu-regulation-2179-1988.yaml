title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2179/88 of 18 July 1988 amending Regulation
    (EEC) No 1873/84 authorizing the offer of disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 337/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2179/88 du Conseil du 18 juillet 1988 modifiant le
    règlement (CEE) n° 1873/84 autorisant l' offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d' avoir fait l' objet
    de pratiques oenologiques non prévues par le règlement (CEE) n° 337/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2179/88 des Rates vom 18. Juli 1988 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 337/79 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2179/88 af 18. juli 1988 om ændring af forordning
    (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte konsum
    af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 337/79 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2179/88 του Συμβουλίου
    της 18ης Ιουλίου 1988 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 337/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2179/88 del Consiglio del 18 luglio 1988 recante modifica
    del regolamento (CEE) n. 1873/84 che autorizza l' offerta e la consegna per il
    consumo diretto di taluni vini importati che possono essere stati sottoposti a
    pratiche enologiche non previste dal regolamento (CEE) n. 337/79
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2179/88 van de Raad van 18 juli 1988 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 337/79
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2179/88 do Conselho de 18 de Julho de 1988 que altera
    o Regulamento (CEE) n.° 1873/84 que autoriza a oferta e o fornecimento para consumo
    humano directo de certos vinhos importados susceptíveis de ter sido objecto de
    práticas enológicas não previstas no Regulamento (CEE) n.° 337/79
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2179/88 del Consejo de 18 de julio de 1988 que modifica
    el Reglamento (CEE) n° 1873/84 por el que se autoriza la oferta y la entrega
    al consumo humano directo de determinados vinos importados que pueden haber sido
    sometidos a prácticas enológicas no previstas en el Reglamento (CEE) n° 337/79
  type: main
