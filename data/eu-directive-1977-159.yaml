    määrittämiseksi annetun direktiivin 76/625/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 77/159/CEE del Consiglio, del 14 febbraio 1977, che modifica
    la direttiva 76/625/CEE relativa alle indagini statistiche da effettuarsi dagli
    Stati Membri per determinare il potenziale di produzione di alcune specie di alberi
    da frutto
  type: main
- language: nl
  script: Latn
  content: Richtlijn 77/159/EEG van de Raad van 14 februari 1977 houdende wijziging
