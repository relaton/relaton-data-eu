    enquêtes, ten einde het produktiepotentieel van bepaalde soorten fruitbomen vast
    te stellen
  type: main
- language: pt
  script: Latn
  content: Directiva 77/159/CEE do Conselho, de 14 de Fevereiro de 1977, que modifica
