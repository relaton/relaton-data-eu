    Erhebungen zur Ermittlung des Produktionspotentials bestimmter Baumobstanlagen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 77/159/EØF af 14. februar 1977 om ændring af direktiv
    76/625/EØF om statistiske undersøgelser, der skal foretages af medlemsstaterne
    for at bestemme produktionskapaciteten for plantager med visse arter af frugttræer
  type: main
- language: el
  script: Grek
