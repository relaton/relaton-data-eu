  content: Council Directive 77/159/EEC of 14 February 1977 amending Directive 76/625/EEC
    concerning the statistical surveys to be carried out by the Member States in order
    to determine the production potential of plantations of certain species of fruit
    trees
  type: main
- language: fr
  script: Latn
  content: Directive 77/159/CEE du Conseil, du 14 février 1977, modifiant la directive
