title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1709/81 of 25 June 1981 re-establishing
    the levying of customs duties on wood screws, falling within subheading 73.32
    B ex II and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1709/81 de la Commission, du 25 juin 1981, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois,
    de la sous-position 73.32 B ex II du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1709/81 der Kommission vom 25. Juni 1981 zur Wiedereinführung
    der Erhebung der Zölle für Schrauben mit Holzgewinde der Tarifstelle 73.32 B
    ex II, mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3322/80 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1709/81 af 25. juni 1981 om genindførelse
    af opkrævning af told for træskruer henhørende under pos. 73.32 B ex II og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
