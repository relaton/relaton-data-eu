    tillæg til og ændring af liste A og B, der som bilag er knyttet til protokol
    nr. 3 angående definitionen af begrebet varer med oprindelsesstatus og angående
    metoderne for administrativt samarbejde, samt listen i artikel 25 i nævnte protokol,
    og om tillæg til note 11 ad artikel 23 i bilag I til denne protokol
