    concept of "originating products" and methods of administrative cooperation and
    the list contained in article 25 of that protocol and supplementing note 11, article
    23 in Annex I to that protocol
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2812/76 du Conseil, du 8 novembre 1976, concernant
    l'application des décisions n° 2/76 et 3/76 du Comité mixte CEE-Norvège, complétant
    et modifiant les listes A et B annexées au protocole n° 3 relatif à la définition
    de la notion de produits originaires et aux méthodes de coopération administrative,
    ainsi que la liste de l'article 25 dudit protocole, et complétant la note 11
    AD article 23 de l'annexe I de ce protocole
  type: main
