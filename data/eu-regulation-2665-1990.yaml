title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2665/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to twine, cordage, ropes and cables,
    of synthetic fibres products of category 90 (order No 40.0900) originating in
    Hungary, to which the preferential tariff arrangements of Council Regulation (EEC)
    No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2665/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages de fibres synthétiques de la catégorie de produits n° 90
    (numéro d'ordre 40.0900), originaires de Hongrie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2665/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer Bindfaeden, Seile und Taue, aus synthetischen
    Spinnstoffen, der Warenkategorie Nr. 90 (laufende Nummer 40.0900) mit Ursprung
    in Ungarn, dem die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2665/90 af 17. september 1990 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, af syntetiske fibre,
    under varekategori 90 (løbenummer 40.0900), som har oprindelse i Ungarn og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2665/90 της Επιτροπής
