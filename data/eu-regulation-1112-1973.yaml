title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1112/73 of the Council of 30 April 1973 amending Regulation
    (EEC) No 974/71 on certain measures of conjunctural policy to be taken in agriculture
    following the temporary widening of the margins of fluctuation for the currencies
    of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1112/73 du Conseil, du 30 avril 1973, modifiant le
    règlement (CEE) n° 974/71 relatif à certaines mesures de politique de conjoncture
    à prendre dans le secteur agricole à la suite de l' élargissement temporaire
    des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1112/73 des Rates vom 30. April 1973 zur Änderung
    der Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1112/73 af 30. april 1973 om ændring af
    forordning (EØF) nr. nr. 974/71 om visse konjunkturpolitiske foranstaltninger,
    der skal træffes inden for landbrugssektoren som følge af den midlertidige udvidelse
    af grænserne for kursudsving i visse medlemsstaters valutaer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1112/73 τού Συμβουλίου
    τής 30ής Απριλίου 1973 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 974/71 «περί ορισμένων μέτρων
    συγκυριακής πολιτικής πού πρέπει νά ληφθούν
    στό γεωργικό τομέα μετά από τήν προσωρινή διεύρυνση
    τών περιθωρίων διακυμάνσεως τών νομισμάτων
    ορισμένων Κρατών μελών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1112/73 del Consiglio, del 30 aprile 1973, che modifica
    il regolamento (CEE) n. 974/71 relativo a talune misure di politica congiunturale
    da adottare nel settore agricolo in seguito all' ampliamento temporaneo dei margini
    di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1112/73 van de Raad van 30 april 1973 houdende wijziging
    van Verordening (EEG) nr. 974/71 betreffende bepaalde conjunctuurpolitieke maatregelen
    welke naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges van
    de valuta' s van sommige Lid-Staten dienen te worden genomen in de landbouwsector
  type: main
