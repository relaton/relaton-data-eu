id: EURegulation30361973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3036/73 of the Commission of 8 November 1973 re-establishing
    Common Customs Tariff duties on women' s, girls' and infants' outer garments,
    not of cotton, falling within heading No ex 61.02, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2629/73 of 26 September 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3036/73 de la Commission, du 8 novembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux vêtements de dessus pour femmes, fillettes et jeunes enfants, en tissus autres
    que de coton, de la position tarifaire ex 61.02, originaires de la Corée du Sud,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2629/73 du Conseil du 26 septembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3036/73 der Kommission vom 8. November 1973 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Oberkleidung
    für Frauen, Mädchen und Kleinkinder, aus anderen Geweben als aus Baumwolle,
    der Tarifnummer ex 61.02, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2629/73 des Rates vom 26. September 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3036/73 af 8. november 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for yderbeklædningsgenstande til kvinder,
    piger og småbørn, ikke af bomuld, under position ex 61.02, som har oprindelse
    i Syd-Korea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2629/73 af 26. september 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3036/73 della Commissione, dell' 8 novembre 1973,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    agli indumenti esterni per donna, per ragazze e per bambini, in tessuti non di
    cotone, della voce doganale ex 61.02, originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2629/73 del Consiglio,
    del 26 settembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3036/73 van de Commissie van 8 november 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op damesbovenkleding, meisjesbovenkleding en kinderbovenkleding,
    van andere weefsels dan van katoen, van post ex 61.02, van oorsprong uit Zuid-Korea,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2629/73 van de Raad van 26 september 1973
  type: main
