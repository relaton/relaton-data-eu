    le règlement (CE) n o 2172/2005 portant modalités d'application d'un contingent
    tarifaire pour l'importation de bovins vivants d'un poids excédant 160 kg originaires
    de Suisse prévu par l'accord entre la Communauté européenne et la Confédération
    suisse relatif aux échanges de produits agricoles
  type: main
- language: de
  script: Latn
