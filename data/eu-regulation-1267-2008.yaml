  type: main
- language: hu
  script: Latn
  content: A Bizottság 1267/2008/EK rendelete ( 2008. december 12. ) az Európai
    Közösség és a Svájci Államszövetség között létrejött, a mezőgazdasági
    termékek kereskedelméről szóló megállapodásban előírt, Svájcból származó,
    160 kilogrammnál nagyobb tömegű élő szarvasmarhafélékre meghatározott
    behozatali vámkontingens alkalmazására vonatkozó részletes szabályok megállapításáról
    szóló 2172/2005/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1267/2008 della Commissione, del 12 dicembre 2008 ,
    che modifica il regolamento (CE) n. 2172/2005 recante modalità di applicazione
    di un contingente tariffario per l'importazione di bovini vivi di peso superiore
    a 160 kg originari della Svizzera previsto dall'accordo tra la Comunità europea
    e la Confederazione svizzera sul commercio di prodotti agricoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1267/2008 ( 2008. gada 12. decembris ), ar kuru
    groza Regulu (EK) Nr. 2172/2005, ar ko nosaka sīki izstrādātus noteikumus par
    importa tarifu kvotu piemērošanu Šveices izcelsmes dzīviem liellopiem, kuru
    svars pārsniedz 160 kg un kā tas paredzēts Eiropas Kopienas un Šveices Konfederācijas
    Nolīgumā par lauksaimniecības produktu tirdzniecību
  type: main
- language: lt
  script: Latn
  content: 2008 m. gruodžio 12 d. Komisijos reglamentas (EB) Nr. 1267/2008, iš dalies
    keičiantis Reglamentą (EB) Nr. 2172/2005, nustatantį išsamias Šveicarijos
    kilmės daugiau kaip 160 kg masės gyvų galvijų importo tarifinės kvotos, numatytos
    Europos bendrijos ir Šveicarijos Konfederacijos susitarime dėl prekybos žemės
    ūkio produktais, taikymo taisykles
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1267/2008 tat- 12 ta’ Diċembru 2008
    li jemenda r-Regolament (KE) Nru 2172/2005 li jistabbilixxi regoli ddettaljati
    għall-applikazzjoni ta’ kwota tariffarja fuq l-importazzjoni ta’ annimali
    bovini ħajjin ta’ piż li ma jaqbiżx il-160 kg u li joriġinaw mill-Iżvizzera
    kif previst fil-Ftehim bejn il-Komunità Ewropea u l-Konfederazzjoni Żvizzera
    dwar il-kummerċ ta’ prodotti agrikoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1267/2008 van de Commissie van 12 december 2008 houdende
