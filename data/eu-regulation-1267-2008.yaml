    en de Zwitserse Bondsstaat inzake de handel in landbouwproducten vastgesteld tariefcontingent
    voor de invoer van levende runderen, van oorsprong uit Zwitserland, met een gewicht
    van meer dan 160 kg
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1267/2008 z dnia 12 grudnia 2008 r. zmieniające
    rozporządzenie Komisji (WE) nr 2172/2005 ustanawiające szczegółowe zasady
    stosowania, przewidzianego w Umowie między Wspólnotą Europejską a Konfederacją
    Szwajcarską w sprawie handlu produktami rolnymi, kontyngentu taryfowego na przywóz
    żywego bydła o wadze przekraczającej 160 kg i pochodzącego ze Szwajcarii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1267/2008 da Comissão, de 12 de Dezembro de 2008
    , que altera o Regulamento (CE) n. o 2172/2005 que estabelece as normas de execução
    relativas a um contingente pautal de bovinos vivos com um peso superior a 160
    kg originários da Suíça, previsto no Acordo entre a Comunidade Europeia e a
    Confederação Suíça relativo ao comércio de produtos agrícolas
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1267/2008 al Comisiei din 12 decembrie 2008 de modificare
    a Regulamentului (CE) nr. 2172/2005 privind normele de aplicare a unui contingent
    tarifar pentru importul de bovine vii în greutate de peste 160 kg originare din
    Elveția prevăzut de acordul încheiat între Comunitatea Europeană și Confederația
    Elvețiană cu privire la comerțul cu produse agricole
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1267/2008 z 12. decembra 2008 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 2172/2005, ktorým sa ustanovujú podrobné
    pravidlá uplatňovania dovoznej colnej kvóty na živý hovädzí dobytok s hmotnosťou
    vyššou ako 160 kg a s pôvodom vo Švajčiarsku podľa Dohody medzi Európskym
    spoločenstvom a Švajčiarskou konfederáciou o obchode s poľnohospodárskymi
    produktmi
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1267/2008 z dne 12. decembra 2008 o spremembi
    Uredbe (ES) št. 2172/2005 o določitvi podrobnih pravil za uporabo uvozne tarifne
    kvote za živo govedo s težo, ki presega 160 kg, in s poreklom iz Švice, določenih
    s Sporazumom med Evropsko skupnostjo in Švicarsko konfederacijo o trgovini s
    kmetijskimi proizvodi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1267/2008 de la Comisión, de 12 de diciembre de 2008
    , que modifica el Reglamento (CE) n o 2172/2005, por el que se establecen las
    disposiciones de aplicación de un contingente arancelario de animales vivos de
