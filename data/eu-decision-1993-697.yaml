title:
- language: en
  script: Latn
  content: '93/697/EC: Council Decision of 13 December 1993 authorizing certain Member
    States to apply or to continue to apply to certain mineral oils, when used for
    specific purposes, reduced rates of excise duty or exemptions from excise duty,
    in accordance with the procedure provided for in Article 8 (4) of Directive 92/81/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/697/CE: Décision du Conseil, du 13 décembre 1993, autorisant certains
    États membres à appliquer ou à continuer à appliquer à certaines huiles minérales
    utilisées à des fins spécifiques des réductions ou des exonérations d''accise
    conformément à la procédure prévue à l''article 8 paragraphe 4 de la directive
    92/81/CEE'
  type: main
- language: de
  script: Latn
  content: '93/697/EG: Entscheidung des Rates vom 13. Dezember 1993 zur Ermächtigung
    einiger Mitgliedstaaten, gemäß dem Verfahren in Artikel 8 Absatz 4 der Richtlinie
    92/81/EWG ermäßigte Verbrauchsteuersätze oder Verbrauchsteuerbefreiungen auf
    Mineralöle, die zu bestimmten Zwecken verwendet werden, zu gewähren oder beizubehalten'
  type: main
- language: da
  script: Latn
  content: '93/697/EF: Rådets beslutning af 13. december 1993 om bemyndigelse af
    en række medlemsstater til at anvende eller fortsat at anvende punktafgiftsnedsættelser
    eller - fritagelser for visse typer mineralolie, når disse benyttes til særlige
    formål, i overensstemmelse med proceduren i artikel 8, stk. 4, i direktiv 92/81/EØF'
  type: main
- language: el
  script: Grek
  content: '93/697/ΕΚ: Απόφαση του Συμβουλίου της 13ης
    Δεκεμβρίου 1993 με την οποία επιτρέπεται σε ορισμένα
    κράτη μέλη να εφαρμόσουν ή να συνεχίσουν να
    εφαρμόζουν σε ορισμένα πετρελαιοειδή όταν
    χρησιμοποιούνται για συγκεκριμένους σκοπούς,
    μειωμένους συντελεστές ειδικών φόρων κατανάλωσης
    ή απαλλαγές από ειδικούς φόρους κατανάλωσης,
    σύμφωνα με τη διαδικασία που προβλέπεται στο
    άρθρο 8 παράγραφος 4 της οδηγίας 92/81/ΕΟΚ'
  type: main
- language: fi
  script: Latn
  content: '93/697/EY: Neuvoston päätös, tehty 13 päivänä joulukuuta 1993, luvan
    antamisesta tietyille jäsenvaltioille soveltaa tai edelleen soveltaa direktiivin
    92/81/ETY 8 artiklan 4 kohdassa säädetyn menettelyn mukaisesti myönnettyä
    alennettua valmisteveroa tai valmisteverosta vapauttamista tiettyihin erityisiin
    tarkoituksiin käytettäviin kivennäisöljyihin'
  type: main
- language: it
  script: Latn
  content: '93/697/CE: Decisione del Consiglio, del 13 dicembre 1993, che autorizza
    alcuni Stati membri ad applicare o a continuare ad applicare a determinati oli
    minerali utilizzati per fini specifici riduzioni delle aliquote d''accisa o esenzioni
    dell''accisa, conformemente alla procedura prevista dell''articolo 8, paragrafo
    4 della direttiva 92/81/CEE'
  type: main
- language: nl
  script: Latn
  content: '93/697/EG: Beschikking van de Raad van 13 december 1993 waarbij sommige
    Lid-Staten toestemming wordt verleend om verlaagde accijnstarieven of vrijstellingen
    van accijns toe te passen of te blijven toepassen op bepaalde minerale oliën
    die voor bijzondere doeleinden worden gebruikt, in overeenstemming met de procedure
    van artikel 8, lid 4, van Richtlijn 92/81/EEG'
  type: main
- language: pt
  script: Latn
  content: '93/697/CE: Decisão do Conselho, de 13 de Dezembro de 1993, que autoriza
    determinados Estados-membros a aplicar ou a continuar a aplicar a certos óleos
    minerais, quando utilizados para fins específicos, reduções das taxas do imposto
    especial sobre o consumo ou isenções a este imposto, nos termos do nº 4 do
    artigo 8º da Directiva 92/81/CEE'
  type: main
- language: es
  script: Latn
  content: '93/697/CE: Decisión del Consejo, de 13 de diciembre de 1993, por la que
    se autoriza a determinados Estados miembros a aplicar o seguir aplicando, a determinados
    hidrocarburos utilizados para fines específicos, tipos reducidos del impuesto
    especial o exenciones del mismo, con arreglo al procedimiento del apartado 4 del
    artículo 8 de la Directiva 92/81/CEE'
  type: main
- language: sv
  script: Latn
  content: '93/697/EG: Rådets beslut av den 13 december 1993 om rätt för vissa
    medlemsstater att på vissa mineraloljor för särskilda användningssätt tillämpa
    nedsatt punktskatt eller medge befrielse från punktskatt enligt det förfarande
    som fastställs i artikel 8.4 i direktiv 92/81/EEG'
  type: main
