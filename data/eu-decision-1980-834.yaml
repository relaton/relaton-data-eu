title:
- language: en
  script: Latn
  content: '80/834/EEC: Commission Decision of 1 August 1980 finding that since the
    conditions required for the admission of Common Customs Tariff duties of the scientific
    apparatus described as ''Extranuclear-Quadrupole Mass Spectrometer, EMBA II''
    have not been fulfilled since 1 February 1979'
  type: main
- language: fr
  script: Latn
  content: '80/834/CEE: Décision de la Commission, du 1er août 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Extranuclear-Quadrupole
    Mass Spectrometer, Emba II" ne sont plus remplies depuis le 1er février 1979'
  type: main
- language: de
  script: Latn
  content: '80/834/EWG: Entscheidung der Kommission vom 1. August 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,Extranuclear-Quadrupole Mass Spectrometer,
    EMBA II'' '' ab 1. Februar 1979 nicht mehr vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/834/EØF: Kommissionens beslutning af 1. august 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Extranuclear-Quadrupole Mass Spectrometer, EMBA
    II" siden den 1. februar 1979 ikke længere er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/834/EOK: Απόφαση τής Επιτροπής τής 1ης Αυγούστου
    1980 περί διαπιστώσεως ότι οι απαιτούμενοι όροι
    γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Extranuclear-Quadrulope Mass Spectrometer Emba
    II» δέν πληρούνται πλέον από τήν 1η Φεβρουαρίου
    1979'
  type: main
- language: it
  script: Latn
  content: '80/834/CEE: Decisione della Commissione, del 1° agosto 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Extranuclear-Quadrupole
    Mass Spectrometer, EMBA II" non sono più soddisfatte dal 1° febbraio 1979'
  type: main
- language: nl
  script: Latn
  content: '80/834/EEG: Beschikking van de Commissie van 1 augustus 1980 vaststellende
    dat aan de voorwaarden, gesteld voor de toelating met vrijstelling van de rechten
    van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat genaamd
    ,,Extranuclear-Quadrupole Mass Spectrometer, EMBA II'' '' sedert 1 februari 1979
    niet langer is voldaan'
  type: main
