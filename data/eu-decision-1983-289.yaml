    humanitärer Organisationen und zu deren Freistellung von Währungsausgleichsbeträgen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/289/EØF: Kommissionens beslutning af 30. maj 1983 om ændring af beslutning
