    med henblik på deres fritagelse for anvendelsen af monetære udligningsbeløb
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/289/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
