title:
- language: en
  script: Latn
  content: '83/289/EEC: Commission Decision of 30 May 1983 amending Decision 81/983/EEC
    approving certain food-aid operations carried out by humanitarian organizations
    and exempting them from monetary compensatory amounts (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/289/CEE: Décision de la Commission du 30 mai 1983 modifiant la décision
    81/983/CEE relative à l''agrément d''opérations d''aide alimentaire réalisées
    par des organismes à but humanitaire, les dispensant de l''application des montants
    compensatoires monétaires (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/289/EWG: Entscheidung der Kommission vom 30. Mai 1983 zur Änderung
