    berättigade till internationellt skydd, för en enhetlig status för flyktingar
    eller personer som uppfyller kraven för att betecknas som subsidiärt skyddsbehövande
    och för innehållet i det beviljade skyddet, om ändring av rådets direktiv
    2003/109/EG och om upphävande av Europaparlamentets och rådets direktiv 2011/95/EU
