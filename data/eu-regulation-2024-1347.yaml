  content: Regulation (EU) 2024/1347 of the European Parliament and of the Council
    of 14 May 2024 on standards for the qualification of third-country nationals or
    stateless persons as beneficiaries of international protection, for a uniform
    status for refugees or for persons eligible for subsidiary protection and for
    the content of the protection granted, amending Council Directive 2003/109/EC
    and repealing Directive 2011/95/EU of the European Parliament and of the Council
  type: main
