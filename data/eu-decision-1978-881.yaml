  script: Latn
  content: '78/881/EEC: Commission Decision of 13 October 1978 on the granting by
    the Guidance Section of the EAGGF to Ireland of a payment on account in respect
    of expenditure incurred during 1977 on aids and premiums relating to the modernization
    of farms including those in the less-favoured farming areas'
  type: main
- language: fr
  script: Latn
  content: '78/881/CEE: Décision de la Commission, du 13 octobre 1978, relative au
    versement par le Fonds européen d'' orientation et de garantie agricole, section
    "orientation", à l'' Irlande d'' un acompte sur les dépenses effectuées pendant
    l'' année 1977 pour les aides et primes relatives à la modernisation des exploitations
    agricoles, y compris dans les zones agricoles défavorisées'
  type: main
- language: de
  script: Latn
