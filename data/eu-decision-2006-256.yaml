title:
- language: en
  script: Latn
  content: '2006/256/EC: Commission Decision of 27 March 2006 amending for the second
    time Decision 2005/758/EC as regards the extension of the parts of Croatia subject
    to certain protection measures in relation highly pathogenic avian influenza (notified
    under document number C(2006) 891)'
  type: main
- language: fr
  script: Latn
  content: '2006/256/CE: Décision de la Commission du 27 mars 2006 modifiant pour
    la deuxième fois la décision 2005/758/CE en ce qui concerne l’extension des
    parties de la Croatie soumises à certaines mesures de protection relatives à
    l’influenza aviaire hautement pathogène [notifiée sous le numéro C(2006)
    891]'
  type: main
- language: de
  script: Latn
  content: '2006/256/EG: Entscheidung der Kommission vom 27. März 2006 zur zweiten
    Änderung der Entscheidung 2005/758/EG zur Ausdehnung der von Maßnahmen zum Schutz
    gegen hoch pathogene Aviäre Influenza betroffenen Gebiete Kroatiens (Bekannt
    gegeben unter Aktenzeichen K(2006) 891)'
  type: main
- language: cs
  script: Latn
  content: '2006/256/ES: Rozhodnutí Komise ze dne 27. března 2006 , kterým se po
    druhé mění rozhodnutí 2005/758/ES, pokud jde o rozšíření částí Chorvatska,
    na které se vztahují některá ochranná opatření související s vysoce patogenní
    influenzou ptáků (oznámeno pod číslem K(2006) 891)'
  type: main
- language: da
  script: Latn
  content: '2006/256/EF: Kommissionens beslutning af 27. marts 2006 om anden ændring
    af beslutning 2005/758/EF med henblik på at lade flere dele af Kroatien være
    omfattet af visse beskyttelsesforanstaltninger over for højpatogen aviær influenza
    (meddelt under nummer K(2006) 891)'
  type: main
- language: el
  script: Grek
  content: '2006/256/ΕΚ: Απόφαση της Επιτροπής, της 27ης
    Μαρτίου 2006 , για την τροποποίηση, για δεύτερη
    φορά, της απόφασης 2005/758/ΕΚ με σκοπό την επέκταση
    του τμήματος εκείνου της Κροατίας στο οποίο
    εφαρμόζονται ορισμένα μέτρα προστασίας λόγω
    της εμφάνισης υψηλής παθογονικότητας γρίπης
    των πτηνών [κοινοποιηθείσα υπό τον αριθμό Ε(2006)
    891]'
  type: main
- language: et
  script: Latn
  content: '2006/256/EÜ: Komisjoni otsus, 27. märts 2006 , millega muudetakse teist
    korda otsust 2005/758/EÜ Horvaatia territooriumi osade laiendamiseks, kus võetakse
    teatavaid kaitsemeetmeid seoses kõrge patogeensusega linnugripiga (teatavaks
    tehtud numbri K(2006) 891 all)'
  type: main
- language: fi
  script: Latn
  content: '2006/256/EY: Komission päätös, tehty 27 päivänä maaliskuuta 2006
    päätöksen 2005/758/EY muuttamisesta toisen kerran niiden Kroatian alueiden
    laajentamiseksi, joilla sovelletaan erittäin patogeenisen lintuinfluenssan esiintymiseen
    liittyviä tiettyjä suojatoimenpiteitä (tiedoksiannettu numerolla K(2006) 891)'
  type: main
- language: hu
  script: Latn
  content: '2006/256/EK: A Bizottság határozata ( 2006. március 27. ) a magas patogenitású
    madárinfluenzával kapcsolatos egyes védekezési intézkedések hatálya alá
    tartozó horvátországi területek kiterjesztése tekintetében a 2005/758/EK
    határozat második alkalommal történő módosításáról (az értesítés
    a C(2006) 891. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2006/256/CE: Decisione della Commissione, del 27 marzo 2006 , che modifica
    per la seconda volta la decisione 2005/758/CE per quanto riguarda l’estensione
    delle parti del territorio della Croazia sottoposte ad alcune misure di protezione
    relative all’influenza aviaria ad alta patogenicità [notificata con il numero
    C(2006) 891]'
  type: main
- language: lv
  script: Latn
  content: '2006/256/EK: Komisijas Lēmums ( 2006. gada 27. marts ), ar ko otro reizi
    groza Lēmumu 2005/758/EK par to Horvātijas daļu paplašināšanu, uz kurām
    attiecina dažus aizsardzības pasākumiem saistībā ar aizdomām par ļoti patogēnu
    putnu gripu (izziņots ar dokumenta numuru K(2006) 891)'
  type: main
- language: lt
  script: Latn
  content: '2006/256/EB: 2006 m. kovo 27 d. Komisijos sprendimas, antrą kartą iš
    dalies keičiantis Sprendimą 2005/758/EB dėl tam tikrų apsaugos priemonių,
    susijusių su labai patogenišku paukščių gripu, taikymo tam tikroms Kroatijos
    teritorijos dalims (pranešta dokumentu Nr. C(2006) 891)'
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tas- 27 ta' Marzu 2006 li temenda għat-tieni
    darba d-Deċiżjoni 2005/758/KE fir-rigward ta' l-estensjoni tal-partijiet tal-Kroazja
    suġġetti għal ċerti miżuri ta' protezzjoni li għandhom x'jaqsmu ma' l-influwenza
    tat-tjur b'patoġeniċità għolja (innotifikata taħt dokument numru C(2006)
    891)
  type: main
- language: nl
  script: Latn
  content: '2006/256/EG: Beschikking van de Commissie van 27 maart 2006 tot tweede
    wijziging van Beschikking 2005/758/EG wat betreft de uitbreiding van de delen
    van Kroatië waar bepaalde beschermende maatregelen gelden in verband met hoogpathogene
    aviaire influenza (Kennisgeving geschied onder nummer C(2006) 891)'
  type: main
- language: pl
  script: Latn
  content: '2006/256/WE: Decyzja Komisji z dnia 27 marca 2006 r. zmieniająca po raz
    drugi decyzję 2005/758/WE w odniesieniu do objęcia dalszych części terytorium
    Chorwacji podlegających niektórym środkom ochronnym w związku z występowaniem
    wysoce zjadliwej grypy ptaków (notyfikowana jako dokument nr C(2006) 891)'
  type: main
- language: pt
  script: Latn
  content: '2006/256/CE: Decisão da Comissão, de 27 de Março de 2006 , que altera
    pela segunda vez a Decisão 2005/758/CE no que diz respeito ao alargamento das
    partes da Croácia sujeitas a determinadas medidas de protecção relacionadas
    com a gripe aviária de alta patogenicidade [notificada com o número C(2006)
    891]'
  type: main
- language: sk
  script: Latn
  content: '2006/256/ES: Rozhodnutie Komisie z 27. marca 2006 , ktorým sa druhýkrát
    mení a dopĺňa rozhodnutie 2005/758/ES, pokiaľ ide o rozšírenie častí Chorvátska,
    ktoré podliehajú určitým ochranným opatreniam v súvislosti s podozrením
    na vysoko patogénnu vtáčiu chrípku [oznámené pod číslom K(2006) 891]'
  type: main
- language: sl
  script: Latn
  content: '2006/256/ES: Odločba Komisije z dne 27. marca 2006 o drugi spremembi
    Odločbe 2005/758/ES glede razširitve delov Hrvaške, za katere veljajo nekateri
    zaščitni ukrepi v zvezi z visoko patogeno aviarno influenco (notificirano pod
    dokumentarno številko C(2006) 891)'
  type: main
- language: es
  script: Latn
  content: '2006/256/CE: Decisión de la Comisión, de 27 de marzo de 2006 , por la
    que se modifica por segunda vez la Decisión 2005/758/CE en cuanto a la ampliación
    de las zonas de Croacia sometidas a determinadas medidas de protección en relación
    con la gripe aviar altamente patógena [notificada con el número C(2006) 891]'
  type: main
- language: sv
  script: Latn
  content: '2006/256/EG: Kommissionens beslut av den 27 mars 2006 om ändring för
    andra gången av beslut 2005/758/EG vad gäller utvidgande av det område i Kroatien
    som omfattas av vissa skyddsåtgärder i samband med högpatogen aviär influensa
    [delgivet med nr K(2006) 891]'
