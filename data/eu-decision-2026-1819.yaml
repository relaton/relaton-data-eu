---
id: EUDecision20261819
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1819 of 27 July 2026 amending
    a number of instruments as regards the authorisation holders and their representatives
    in the Union for the placing on the market of products containing, consisting
    of or produced from certain genetically modified organisms (notified under document
    C(2026) 5096)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1819 de la Commission du 27 juillet
    2026 modifiant un certain nombre d’instruments en ce qui concerne les titulaires
    de l’autorisation et leurs représentants dans l’Union pour la mise sur le
    marché de produits contenant certains organismes génétiquement modifiés, consistant
    en ces organismes ou produits à partir de ceux-ci [notifiée sous le numéro
    C(2026) 5096]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1819 der Kommission vom 27. Juli 2026
    zur Änderung mehrerer Rechtsakte hinsichtlich der Zulassungsinhaber und ihrer
    Vertreter in der Union für das Inverkehrbringen von Erzeugnissen, die genetisch
    veränderte Organismen enthalten, aus ihnen bestehen oder aus ihnen hergestellt
    werden (Bekannt gegeben unter Aktenzeichen C(2026) 5096)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/1819 на Комисията
    от 27 юли 2026 година за изменение на редица инструменти
    по отношение на титулярите на разрешенията
    и техните представители в Съюза за пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от определени генетично
    модифицирани организми (нотифицирано под номер
    С(2026) 5096)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/1819 ze dne 27. července 2026,
    kterým se mění několik nástrojů, pokud jde o držitele povolení a jejich
    zástupce v Unii pro uvádění produktů, které obsahují určité geneticky
    modifikované organismy, sestávají z nich nebo jsou z nich vyrobeny, na trh
    (oznámeno pod číslem C(2026) 5096)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/1819 af 27. juli 2026
    om ændring af en række retsakter for så vidt angår indehavere af tilladelser
    og deres repræsentanter i Unionen vedrørende markedsføring af produkter, der
    indeholder, består af eller er fremstillet af visse genetisk modificerede organismer
    ((meddelt under nummer C(2026) 5096)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/1819 της Επιτροπής,
    της 27ης Ιουλίου 2026, για την τροποποίηση ορισμένων
    πράξεων όσον αφορά τους κατόχους έγκρισης
    και τους αντιπροσώπους τους στην Ένωση για
    τη διάθεση στην αγορά προϊόντων που περιέχουν,
    αποτελούνται ή παράγονται από ορισμένους γενετικώς
    τροποποιημένους οργανισμούς [κοινοποιηθείσα
    υπό τον αριθμό C(2026) 5096]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/1819, 27. juuli 2026, millega muudetakse
    mitmeid õigusakte seoses teatavaid geneetiliselt muundatud organisme sisaldavate,
    neist koosnevate või neist valmistatud toodete turule laskmise loa hoidjate ja
    nende esindajatega liidus (teatavaks tehtud numbri C(2026) 5096 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/1819, annettu 27 päivänä
    heinäkuuta 2026, tiettyjen välineiden muuttamisesta siltä osin kuin on kyse
    tiettyjä muuntogeenisiä organismeja sisältävien, niistä koostuvien tai niistä
    valmistettujen tuotteiden markkinoille saattamista koskevan luvan haltijoista
    ja näiden edustajista unionissa (tiedoksiannettu numerolla C(2026) 5096)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/1819 ón gCoimisiún an 27 Iúil 2026
    lena leasaítear roinnt ionstraimí a mhéid a bhaineann le sealbhóirí an údaraithe
    agus a n-ionadaithe san Aontas chun táirgí ina bhfuil orgánaigh ghéinmhodhnaithe
    áirithe, atá comhdhéanta díobh nó a tháirgtear astu, a chur ar an margadh
    (tugadh fógra faoi leis an doiciméad C(2026) 5096)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/1819 оd 27. srpnja 2026. o izmjeni
    niza instrumenata u pogledu nositelja odobrenja i njihovih zastupnika u Uniji
    za stavljanje na tržište proizvoda koji sadržavaju određene genetski modificirane
    organizme, od njih se sastoje ili su od njih proizvedeni (priopćeno pod brojem
    dokumenta C(2026)5096)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/1819 végrehajtási határozata (2026. július 27.)
    számos jogi aktusnak a bizonyos, géntechnológiával módosított szervezeteket
    tartalmazó, azokból álló vagy azokból előállított termékek forgalomba
    hozatalára vonatkozó engedély jogosultja és uniós képviselője tekintetében
    történő módosításáról (az értesítés a C(2026) 5096. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/1819 della Commissione, del 27 luglio
    2026, che modifica determinati atti per quanto riguarda i titolari dell’autorizzazione
    e i loro rappresentanti nell’Unione ai fini dell’immissione in commercio di
    prodotti contenenti, costituiti o derivati da alcuni organismi geneticamente modificati
    [notificata con il numero C(2026)5096]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/1819 (2026. gada 27. jūlijs),
    ar ko groza vairākus instrumentus attiecībā uz tiem atļauju turētājiem un
    to pārstāvjiem Savienībā, kuriem atļauts laist tirgū produktus, kas satur
    konkrētus ģenētiski modificētus organismus, sastāv vai ir ražoti no tiem
    (izziņots ar dokumenta numuru C(2026) 5096)
  type: main
- language: lt
  script: Latn
  content: 2026 m. liepos 27 d. Komisijos įgyvendinimo sprendimas (ES) 2026/1819,
    kuriuo dėl leidimo turėtojų ir jų atstovų Sąjungoje, įgaliotų pateikti
    rinkai produktus, kurių sudėtyje yra tam tikrų genetiškai modifikuotų organizmų
    arba kurie iš jų sudaryti ar pagaminti, iš dalies keičiami tam tikri teisės
    aktai (pranešta dokumentu Nr. C(2026) 5096)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/1819 tas-27
    ta’ Lulju 2026 li temenda għadd ta’ strumenti fir-rigward tad-detenturi tal-awtorizzazzjoni
    u r-rappreżentanti tagħhom fl-Unjoni għat-tqegħid fis-suq ta’ prodotti li
    fihom, li jikkonsistu minn, jew li huma prodotti minn ċerti organiżmi ġenetikament
    modifikati (notifikata bid-dokument C(2026) 5096)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/1819 van de Commissie van 27 juli 2026 tot
    wijziging van een aantal instrumenten wat betreft de vergunninghouders en hun
    vertegenwoordigers in de Unie voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met bepaalde genetisch
    gemodificeerde organismen (Kennisgeving geschied onder nummer C(2026) 5096)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/1819 z dnia 27 lipca 2026 r. zmieniająca
    kilka aktów w odniesieniu do posiadaczy zezwoleń na wprowadzenie do obrotu produktów
    zawierających niektóre organizmy zmodyfikowane genetycznie, składających się
    z nich lub z nich wyprodukowanych oraz w odniesieniu do przedstawicieli tych posiadaczy
    w Unii (notyfikowana jako dokument nr C(2026) 5096)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/1819 da Comissão, de 27 de julho de 2026,
    que altera uma série de instrumentos no que diz respeito aos detentores de autorizações
    e aos seus representantes na União para a colocação no mercado de produtos
    que contenham, sejam constituídos por ou sejam produzidos a partir de determinados
    organismos geneticamente modificados [notificada com o número C(2026) 5096]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/1819 a Comisiei din 27 iulie 2026
    de modificare a unei serii de documente în ceea ce privește titularii autorizațiilor
    și reprezentanții acestora în Uniune pentru introducerea pe piață a produselor
    care conțin, constau în sau sunt fabricate din anumite organisme modificate
    genetic [notificată cu numărul C(2026) 5096]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/1819 z 27. júla 2026, ktorým
    sa mení niekoľko nástrojov, pokiaľ ide o držiteľov povolenia a ich zástupcov
    v Únii na umiestnenie na trh výrobkov, ktoré obsahujú určitý geneticky modifikovaný
    organizmus, sú z neho zložené alebo vyrobené [oznámené pod číslom C(2026)
    5096]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/1819 z dne 27. julija 2026 o spremembi
    številnih instrumentov glede imetnikov odobritev za dajanje na trg proizvodov,
    ki vsebujejo nekatere gensko spremenjene organizme, so iz njih sestavljeni ali
    proizvedeni, in njihovih zastopnikov v Uniji (notificirano pod dokumentarno številko
    C(2026) 5096)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2026/1819 de la Comisión, de 27 de julio
    de 2026, por la que se modifican determinados actos en lo que respecta a los titulares
    de la autorización y sus representantes en la Unión para la comercialización
    de productos que contengan, estén compuestos o hayan sido producidos a partir
    de determinados organismos modificados genéticamente [notificada con el número
    C(2026) 5096]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2026/1819 av den 27 juli 2026 om
    ändring av ett antal instrument vad gäller innehavarna av godkännanden och
    deras företrädare i unionen för utsläppande på marknaden av produkter som
    innehåller, består av eller har framställts av vissa genetiskt modifierade
    organismer [delgivet med nr C(2026) 5096]
  type: main
