    και θα εισαχθούν στην Ισπανία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3815/88 DELLA COMMISSIONE del 7 dicembre 1988 recante
    modifica del regolamento (CEE) n. 470/88 che fissa per il periodo dal 1o gennaio
    al 31 dicembre 1988, la quantità massima di taluni prodotti del settore dei grassi
    da mettere in consumo e da importare in Spagna
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3815/88 VAN DE COMMISSIE van 7 december 1988 tot
    wijziging van Verordening (EEG) nr. 470/88 tot vaststelling, voor het tijdvak
    van 1 januari tot en met 31 december 1988, van de maximumhoeveelheid van bepaalde
    in Spanje in consumptie te brengen of in te voeren produkten van de sector oliën
    en vetten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3815/88 DA COMISSAO de 7 de Dezembro de 1988 que altera
    o Regulamento (CEE) n* 470/88 que fixa, para o periodo compreendido entre 1 de
    Janeiro e 31 de Dezembro de 1988, a quantidade maxima de determinados produtos
    do sector das matérias gordas a introduzir no consumo e a importar em Espanha
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3815/88 DE LA COMISION de 7 de diciembre de 1988 por
