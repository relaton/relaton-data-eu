    (ΕΟΚ) αριθ. 470/88 για τον καθορισμό, για την περίοδο
    από 1ης Ιανουαρίου έως 31 Δεκεμβρίου 1988 της μέγιστης
    ποσότητας ορισμένων προϊόντων του τομέα των
