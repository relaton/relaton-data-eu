title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3815/88 of 7 December 1988 amending Regulation
    (EEC) No 470/88 fixing, for the period 1 January to 31 December 1988, the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3815/88 de la Commission du 7 décembre 1988 modifiant
    le règlement (CEE) n° 470/88 fixant pour la période allant du 1er janvier au
    31 décembre 1988 la quantité maximale de certains produits du secteur des matières
    grasses à mettre à la consommation et à importer en Espagne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3815/88 DER KOMMISSION vom 7. Dezember 1988 zur Aenderung
    der Verordnung (EWG) Nr. 470/88 zur Festsetzung der Hoechstmengen bestimmter Erzeugnisse
    des Fettsektors, die in Spanien zum freien Verkehr abzufertigen und in dieses
    Land einzufuehren sind, fuer den Zeitraum vom 1. Januar bis zum 31. Dezember 1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3815/88 af 7. december 1988 om ændring
    af forordning (EØF) nr. 470/88 om fastsættelse for perioden 1. januar til 31.
    december 1988 af den største mængde af visse produkter inden for fedtstofsektoren,
    der kan overgå til frit forbrug i og importeres til Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3815/88 της Επιτροπής
