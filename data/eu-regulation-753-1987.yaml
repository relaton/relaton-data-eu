    und Garantiefonds für die Landwirtschaft, Abteilung Garantie, pauschal zu finanzierenden
    Ausgaben im Zusammenhang mit der kostenlosen Verteilung von Erzeugnissen des Obst-
    und Gemüsesektors, die von den Erzeugerorganisationen aus dem Markt genommen
    oder von den Interventionsstellen angekauft wurden
  type: main
- language: da
  script: Latn
