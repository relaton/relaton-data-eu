  content: Commission Regulation (EEC) No 753/87 of 17 March 1987 amending Regulation
    (EEC) No 1365/82 laying down standard rates for the financing, by the European
    Agricultural Guidance and Guarantee Fund, Guarantee Section, of expenditure resulting
    from the free distribution of products withdrawn from the market by producers'
    organizations, or bought in by the intervention agencies, in the fruit and vegetables
    sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 753/87 de la Commission du 17 mars 1987 modifiant
    le règlement (CEE) n° 1365/82 déterminant, de façon forfaitaire, le financement
    par le Fonds européen d' orientation et de garantie agricole, section "garantie",
    des dépenses résultant de la distribution gratuite des produits retirés du
    marché par les organisations de producteurs ou achetés par les organismes d'
    intervention dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 753/87 der Kommission vom 17. März 1987 zur Änderung
