title:
- language: en
  script: Latn
  content: Commission Directive 2001/27/EC of 10 April 2001 adapting to technical
    progress Council Directive 88/77/EEC on the approximation of the laws of the Member
    States relating to measures to be taken against the emission of gaseous and particulate
    pollutants from compression-ignition engines for use in vehicles, and the emission
    of gaseous pollutants from positive-ignition engines fuelled with natural gas
    or liquefied petroleum gas for use in vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 2001/27/CE de la Commission du 10 avril 2001 portant adaptation
    au progrès technique de la directive 88/77/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives aux mesures à prendre contre les
    émissions de gaz polluants et de particules polluantes provenant des moteurs
    à allumage par compression destinés à la propulsion des véhicules et les émissions
    de gaz polluants provenant des moteurs à allumage commandé fonctionnant au gaz
    naturel ou au gaz de pétrole liquéfié et destinés à la propulsion des véhicules
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/27/EG der Kommission vom 10. April 2001 zur Anpassung der
    Richtlinie 88/77/EWG des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    über Maßnahmen gegen die Emission gasförmiger Schadstoffe und luftverunreinigender
    Partikel aus Selbstzündungsmotoren zum Antrieb von Fahrzeugen und die Emission
    gasförmiger Schadstoffe aus mit Erdgas oder Flüssiggas betriebenen Fremdzündungsmotoren
    zum Antrieb von Fahrzeugen an den technischen Fortschritt
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2001/27/ES ze dne 10. dubna 2001, kterou se přizpůsobuje
    technickému pokroku směrnice Rady 88/77/EHS o sbližování právních předpisů
    členských států týkajících se opatření proti emisím plynných znečišťujících
    látek a znečišťujících částic ze vznětových motorů vozidel a emisím
    plynných znečišťujících látek ze zážehových motorů vozidel poháněných
    zemním plynem nebo zkapalněným ropným plynem
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2001/27/EF af 10. april 2001 om tilpasning til den
    tekniske udvikling af Rådets direktiv 88/77/EØF om indbyrdes tilnærmelse af
    medlemsstaternes lovgivninger om foranstaltninger mod emission af forurenende
    luftarter og partikler fra motorer med kompressionstænding til fremdrift af køretøjer
    og emission af forurenende luftarter fra køretøjsmotorer med styret tænding,
    som benytter naturgas eller autogas (LPG) som brændstof
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/27/ΕΚ της Επιτροπής, της 10ης Απριλίου
    2001, για την προσαρμογή στην τεχνική πρόοδο
    της οδηγίας 88/77/EΟΚ του Συμβουλίου για την προσέγγιση
    των νομοθεσιών των κρατών μελών σχετικά με
    τα μέτρα που πρέπει να ληφθούν κατά των εκπομπών
    αερίων και σωματιδιακών ρύπων από τους κινητήρες
    ανάφλεξης με συμπίεση που χρησιμοποιούνται
    σε οχήματα, καθώς και κατά των εκπομπών αερίων
    ρύπων από κινητήρες επιβαλλόμενης ανάφλεξης
    που τροφοδοτούνται με φυσικό αέριο ή υγραέριο
    και χρησιμοποιούνται σε οχήματα
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2001/27/EÜ, 10. aprill 2001, millega kohandatakse
    tehnika arenguga nõukogu direktiivi 88/77/EMÜ liikmesriikide õigusaktide ühtlustamise
    kohta, mis käsitlevad meetmeid, mida võetakse sõidukite diiselmootoritest eralduvate
    gaasiliste ja tahkete osakeste heitmete vastu ning sõidukites kasutatavatest
    maagaasil või veeldatud naftagaasil töötavatest ottomootoritest eralduvate
    gaasiliste osakeste heitmete vastu
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2001/27/EY, annettu 10 päivänä huhtikuuta 2001,
    ajoneuvojen puristussytytysmoottoreiden kaasumaisten ja hiukkasmaisten päästöjen
    sekä ajoneuvoissa käytettävien maa- tai nestekaasulla toimivien ottomoottoreiden
    kaasupäästöjen torjumiseksi toteutettavia toimenpiteitä koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun direktiivin 88/77/ETY mukauttamisesta
    tekniikan kehitykseen
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2001/27/EK irányelve (2001. április 10.) a járművek hajtására
    használt sűrítéses gyújtású motorok gáz-halmazállapotú szennyezőanyag-
    és légszennyezőrészecske-kibocsátása, valamint a járművek hajtására
    használt, földgáz- vagy PB-gázüzemű külső gyújtású motorok gáz-halmazállapotú
    szennyezőanyag-kibocsátása elleni intézkedésekre vonatkozó tagállami jogszabályok
    közelítéséről szóló 88/77/EGK irányelvnek a műszaki fejlődéshez történő
    hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/27/CE della Commissione, del 10 aprile 2001, che adegua
    al progresso tecnico la direttiva 88/77/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati membri relative ai provvedimenti da prendere contro
    l'emissione di inquinanti gassosi e di particolato prodotti dai motori ad accensione
    spontanea destinati alla propulsione di veicoli e l'emissione di inquinanti gassosi
    prodotti dai motori ad accensione comandata alimentati con gas naturale o con
    gas di petrolio liquefatto destinati alla propulsione di veicoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2001/27/EK (2001. gada 10. aprīlis), ar kuru tehnikas
    attīstībai pielāgo Padomes Direktīvu 88/77/EEK par dalībvalstu tiesību aktu
    tuvināšanu attiecībā uz pasākumiem, kas jāveic, lai samazinātu gāzveida
    un daļiņveida piesārņotāju emisiju no kompresijaizdedzes motoriem, kuri paredzēti
    transportlīdzekļiem, un gāzveida piesārņotāju emisiju no dzirksteļaizdedzes
    motoriem, ko darbina ar dabasgāzi vai sašķidrinātu naftas gāzi un kas paredzēti
    transportlīdzekļiem
  type: main
- language: lt
  script: Latn
  content: 2001 m. balandžio 10 d. Komisijos direktyva 2001/27/EB derinanti su technikos
    pažanga Tarybos direktyvą 88/77/EEB dėl valstybių narių įstatymų, reglamentuojančių
    priemones, kurių būtina imtis mažinant transporto priemonėse naudojamų uždegimo
    suspaudimu variklių išmetamuosius dujinius bei kietųjų dalelių teršalus
    ir transporto priemonėse naudojamų kibirkštinio uždegimo variklių, kaip kurą
    vartojančių gamtines dujas ir suskystintas naftos dujas, išmetamuosius dujinius
    teršalus, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2001/27/KE ta' l-10 ta' April 2001 li tadatta
    għall-progress tekniku d-Direttiva tal-Kunsill 88/77/KEE dwar l-approssimazzjoni
    tal-liġijiet ta' l-Istati Membri li għandhom x'jaqsmu mal-miżuri li għandhom
    jittieħdu kontra l-emissjoni ta' sustanzi li li jniġġsu gassużi u ta' partikolati
    minn magni b' compression-ignition għall-użu f'vetturi, u l-emissjoni ta' sustanzi
    gassużi li jniġġsu minn magni b' positive-ignition li jaħdmu b'gass naturali
    jew gass likwidu tal-petroljum għall-użu f'vetturi.
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2001/27/EG van de Commissie van 10 april 2001 houdende aanpassing
    aan de technische vooruitgang van Richtlĳn 88/77/EEG van de Raad inzake de onderlinge
    aanpassing van de wetgevingen van de lidstaten met betrekking tot maatregelen
    tegen de emissie van verontreinigende gassen en deeltjes door voertuigmotoren
    met compressieontsteking en de emissie van verontreinigende gassen door op aardgas
    of vloeibaar petroleumgas lopende voertuigmotoren met elektrische ontsteking
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji NR 2001/27/WE z dnia 10 kwietnia 2001 r. dostosowująca
    do postępu technicznego dyrektywę Rady 88/77/EWG w sprawie zbliżenia ustawodawstw
    Państw Członkowskich odnoszących się do działań, jakie mają zostać podjęte
    przeciwko emisji zanieczyszczeń gazowych i pyłowych przez silniki wysokoprężne
    stosowane w pojazdach oraz emisji zanieczyszczeń gazowych z silników z wymuszonym
    zapłonem napędzanych gazem ziemnym lub gazem płynnym stosowanych w pojazdach
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/27/CE da Comissão, de 10 de Abril de 2001, que adapta ao
    progresso técnico a Directiva 88/77/CEE do Conselho relativa à aproximação
    das legislações dos Estados-Membros respeitantes às medidas a tomar contra
    a emissão de gases e partículas poluentes provenientes dos motores de ignição
    por compressão utilizados em veículos e a emissão de gases poluentes provenientes
    dos motores de ignição comandada alimentados a gás natural ou a gás de petróleo
    liquefeito utilizados em veículos
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2001/27/ES z 10. apríla 2001 prispôsobujúca technickému
    pokroku smernicu Rady 88/77/EHS o aproximácii právnych predpisov členských
    štátov, týkajúcich sa opatrení, ktoré sa musia prijať na zabránenie emisiám
    plynných a pevných znečisťujúcich látok zo vznetových motorov určených
    na použitie vo vozidlách a emisiám plynných znečisťujúcich látok z motorov
    s kladným zapaľovaním motorov, používajúcich ako palivo zemný plyn alebo
    skvapalnené uhľovodíkové plyny, určené na použitie vo vozidlách
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2001/27/ES z dne 10. aprila 2001 o prilagajanju tehničnemu
    napredku Direktive Sveta 88/77/EGS o približevanju zakonodaje držav članic
    o ukrepih proti emisijam plinastih in trdnih onesnaževal iz motorjev s kompresijskim
    vžigom, ki se uporabljajo v vozilih, in emisijam plinastih onesnaževal iz motorjev
    na prisilni vžig s pogonom na zemeljski plin ali na utekočinjeni naftni plin,
    ki se uporabljajo v vozilih
  type: main
- language: es
  script: Latn
  content: Directiva 2001/27/CE de la Comisión, de 10 de abril de 2001, por la que
    se adapta al progreso técnico la Directiva 88/77/CEE del Consejo relativa a la
    aproximación de las legislaciones de los Estados miembros sobre las medidas que
    deben adoptarse contra la emisión de gases y partículas contaminantes procedentes
    de motores de encendido por compresión destinados a la propulsión de vehículos
    y la emisión de gases contaminantes procedentes de motores de encendido por chispa
    alimentados con gas natural o gas licuado del petróleo destinados a la propulsión
    de vehículos
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2001/27/EG av den 10 april 2001 om anpassning till
    den tekniska utvecklingen av rådets direktiv 88/77/EEG om tillnärmning av medlemsstaternas
    lagstiftning om åtgärder mot utsläpp av gas- och partikelformiga föroreningar
    från motorer med kompressionständning som används i fordon samt mot utsläpp
    av gasformiga föroreningar från motorer med gnisttändning drivna med naturgas
    eller gasol vilka används i fordon
