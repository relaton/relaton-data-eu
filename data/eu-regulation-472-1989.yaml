  content: Commission Regulation (EEC) No 472/89 of 24 February 1989 amending Regulation
    (EEC) No 1609/88 as regards the latest date of entry into storage for butter sold
    under Regulation (EEC) No 570/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 472/89 de la Commission du 24 février 1989 modifiant
    le règlement (CEE) n° 1609/88 en ce qui concerne la date limite d'entrée en
    stock du beurre vendu au titre du règlement (CEE) n° 570/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 472/89 DER KOMMISSION vom 24. Februar 1989 zur Änderung
    der Verordnung (EWG) Nr. 1609/88 zur Bestimmung des letzten Termins für die Einlagerung
    der gemäß Verordnung (EWG) Nr. 570/88 zu verkaufenden Butter #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 472/89 af 24. februar 1989 om ændring
    af forordning (EØF) nr. 1609/88, for så vidt angår fristen for indlagring af
    smør, der sælges i henhold til forordning (EØF) nr. 570/88
  type: main
- language: el
  script: Grek
  content: Kανονισμός (ΕΟΚ) αριθ. 472/89 της Επιτροπής
    της 24ης Φεβρουαρίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 1609/88 όσον αφορά την ημερομηνία εισόδου
    σε απόθεμα βουτύρου που πωλείται βάσει του
    κανονισμού (ΕΟΚ) αριθ. 570/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 472/89 DELLA COMMISSIONE del 24 febbraio 1989 che
    modifica il regolamento (CEE) n. 1609/88 in ordine alla data entro la quale deve
    essere entrato all'' ammasso il burro venduto a norma del regolamento (CEE) n.
    570/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 472/89 VAN DE COMMISSIE van 24 februari 1989 houdende
    wijziging van Verordening (EEG) nr. 1609/88 tot vaststelling van de uiterste datum
    voor de inslag van de boter die op grond van Verordening (EEG) nr. 570/88 wordt
    verkocht #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 472/89 DA COMISSÃO de 24 de Fevereiro de 1989 que
