    em existência da manteiga vendida a título do Regulamento (CEE) nº 570/88 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 472/89 DE LA COMISIÓN de 24 de febrero de 1989 que
