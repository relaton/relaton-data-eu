    συντελεστών που εφαρμόζονται στα σιτηρά τα
    οποία εξάγονται υπό μορφή ορισμένων οινοπνευματωδών
    ποτών για την περίοδο 1990/91
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2865/90 DELLA COMMISSIONE del 4 ottobre 1990 che fissa
