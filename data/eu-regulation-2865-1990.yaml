  content: Commission Regulation (EEC) No 2865/90 of 4 October 1990 fixing for the
    period 1990/91 certain coefficients applicable to cereals exported in the form
    of certain spirituous beverages
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2865/90 de la Commission du 4 octobre 1990 fixant
    certains coefficients applicables aux céréales exportées sous forme de certaines
    boissons spiritueuses pour la période 1990/1991
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2865/90 DER KOMMISSION vom 4. Oktober 1990 zur Festsetzung
