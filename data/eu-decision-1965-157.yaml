title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 15 mars 1965, portant rejet d'une demande
    d'autorisation de maintien en faveur de la Corse des dispositions des tarifs spéciaux
    de la Société nationale des chemins de fer français (SNCF) n° 3 chapitre 103
    paragraphe III (transports de pommes de terre), n° 6, chapitre 103 paragraphe
    III (transports de bière) et autorisation du tarif n° 11, chapitre 103 paragraphe
    II (transports de ciment)
  type: main
- language: de
  script: Latn
  content: '65/157/EWG: Entscheidung der Kommission vom 15. März 1965 über die Ablehnung
    eines Antrags auf Beibehaltung der Ausnahmetarife Nr. 3, Kapitel 103 § II (für
    Kartoffeln), Nr. 6, Kapitel 103 § III (für Bier) sowie über die Genehmigung
    des Tarifs Nr. 11, Kapitel 103 § II (für Zement), der Französischen Staatsbahnen
    (SNCF) zugunsten Korsikas'
  type: main
- language: it
  script: Latn
  content: '65/157/CEE: Decisione della Commissione, del 15 marzo 1965, che respinge
    la domanda di autorizzazione a mantenere in vigore le disposizioni delle tariffe
    speciali applicate in Corsica dalla Société Nationale des Chemins de Fer Français
    (S.N.C.F.), n. 3, capitolo 103, paragrafo II (trasporti di patate), n. 6, capitolo
    103, paragrafo III (trasporti di birra), e autorizza la tariffa n. 11, capitolo
    103, paragrafo II (trasporti di cemento)'
  type: main
- language: nl
  script: Latn
  content: '65/157/EEG: Beschikking van de Commissie van 15 maart 1965 houdende afwijzing
    van een verzoek om machtiging tot handhaving van de bepalingen van de speciale
    tarieven van de "Société Nationale des Chemins de fer Français (S.N.C.F.)"
    Nr. 3, hoofdstuk 103, paragraaf II (vervoer van aardappelen) en Nr. 6, hoofdstuk
    103, paragraaf III (vervoer van bier), en houdende machtiging tot toepassing van
    tarief Nr. 11, hoofdstuk 103, paragraaf II (vervoer van cement) ten aanzien van
    Corsica'
  type: main
