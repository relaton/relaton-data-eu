title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 847/82 of 13 April 1982 re-establishing
    the levying of customs duties on sheep and lamb skin leather, falling within subheading
    41.03 B II originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 847/82 de la Commission, du 13 avril 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d' ovins, préparées, de la sous-position 41.03 B II du tarif douanier commun,
    originaires du Pakistan, bénéficiaire des préférences tarifaires, prévues
    par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 847/82 der Kommission vom 13. April 1982 zur Wiedereinführung
    der Erhebung der Zölle für Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 847/82 af 13. april 1982 om genindførelse
    af opkrævning af told for andet læder af fåre- og lammeskind, henhørende under
    pos. 41.03 B II og med oprindelse i Pakistan, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 847/82 τής Επιτροπής τής
    13ης Απριλίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τά έτερα δέρματα προβατοειδών,
    κατειργασμένα, τής δασμολογικής διακρίσεως
    41. 03 Β ΙΙ, καταγωγής Πακιστάν, δικαιούχου τών
    προβλεπομένων από τόν κανονισμό (EOK) αριθ. 3601/81
    τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 847/82 della Commissione, del 13 aprile 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    preparate, della sottovoce 41.03 B II della tariffa doganale comune, originarie
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 847/82 van de Commissie van 13 april 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schapeleder,
    alsmede voorgelooide huiden en vellen van schapen, van postonderverdeling 41.03
    B II, van oorsprong uit Pakistan, waarvoor de in Verordening (EEG) nr. 3601/81
    van de Raad vermelde tariefpreferenties zijn verleend
