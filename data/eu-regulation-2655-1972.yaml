    αριθ. 1/72 του Συμβουλίου «περί καθορισμού των
    μεθόδων διοικητικής συνεργασίας στον τελωνειακό
    τομέα για τη θέση σε εφαρμογή της συμφωνίας
    συνδέσεως μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και της Μάλτας»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2655/72 del Consiglio, del 6 dicembre 1972, riguardante
    l'applicazione della raccomandazione del Consiglio di associazione n. 1/72 relativa
