- language: en
  script: Latn
  content: "/* Regulation (EEC) No 2655/72 of the Council of 6 December 1972 on the application of Recommendation of the Association Council No 1/72 laying down methods of administrative co-operation in the customs sphere for the implementation of the Agreement establishing en Association between the European Economic Community and Malta */"
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2655/72 du Conseil, du 6 décembre 1972, concernant
    l'application de la recommandation du conseil d'association n° 1/72, fixant les
    méthodes de coopération administrative dans le domaine douanier pour la mise
    en application de l'accord créant une association entre la Communauté économique
    européenne et Malte
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2655/72 des Rates vom 6. Dezember 1972 über die Durchführung
    der Empfehlung Nr. 1/72 des Assoziationsrats zur Festlegung der Methoden der Zusammenarbeit
    der Verwaltungen auf dem Zollsektor zum Zweck der Durchführung des Abkommens
    zur Gründung einer Assoziation zwischen der Europäischen Wirtschaftsgemeinschaft
    und Malta
  type: main
- language: da
  script: Latn
  content: "/* Rådets forordning (EØF) nr. 2655/72 af 6. december 1972 om gennemførelse af Associeringsrådets henstilling nr. 1/72 om fastsættelse af administrative samarbejdsmetoder på toldområdet med henblik på iværksættelsen af aftalen om oprettelse af en associering mellem Det europæiske økonomiske Fællesskab og Malta */"
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2655/72 του Συμβουλίου
