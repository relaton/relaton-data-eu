title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 487/86 of 25 February 1986 laying down general
    rules for the components intended to ensure protection of the processing industry
    in the cereals and rice sector and fixing those relating to Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 487/86 du Conseil du 25 février 1986 déterminant
    les règles générales relatives aux éléments destinés à assurer, dans le
    secteur des céréales et du riz, la protection de l' industrie de transformation
    et fixant ceux valables pour l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 487/86 des Rates vom 25. Februar 1986 zur Festlegung
    der Grundregeln betreffend die Bestandteile zum Schutz der Verarbeitungsindustrie
    im Getreide- und Reissektor und zur Festsetzung dieser Bestandteile für Spanien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 487/86 af 25. februar 1986 om fastsættelse
    af de almindelige regler for de elementer, der i korn- og rissektoren skal beskytte
    forarbejdningsindustrien og om fastsættelse af disse elementer for Spaniens vedkommende
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 487/86 του Συμβουλίου
    της 25ης Φεβρουαρίου 1986 περί καθορισμού των
    γενικών κανόνων που αφορούν τα στοιχεία που
    προορίζονται να εξασφαλίσουν, στον τομέα των
    σιτηρών και του ρυζιού, την προστασία της βιομηχανίας
    μεταποίησης και περί καθορισμού των στοιχείων
    αυτών για την Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 487/86 del Consiglio del 25 febbraio 1986 che stabilisce
    le regole generali relative agli elementi destinati a garantire, nel settore dei
    cereali e del riso, la protezione dell' industria di trasformazione e che fissa
    tali elementi validi per la Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 487/86 van de Raad van 25 februari 1986 tot vaststelling
    van de algemene voorschriften betreffende de elementen ter bescherming van de
    verwerkende industrie in de sector granen en rijst en tot vaststelling van deze
    elementen voor Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 487/86 do Conselho de 25 de Fevereiro de 1986 que
    determina as regras gerais relativas aos elementos destinados a assegurar, no
    sector dos cereais e do arroz, a protecção da indústria transformadora e fixa
    os que são válidos para Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 487/86 del Consejo de 25 de febrero de 1986 por el
    que se determinan las normas generales relativas a los elementos destinados a
    asegurar, en el sector de los cereales y del arroz, la protección de la industria
    de transformación y por el que se fijan los referentes a España
  type: main
