title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2618/77 of 28 November 1977 re-establishing
    the levying of the customs duties on wrought plates, sheets and strip, of aluminium
    falling within heading No 76.03, originating in Yugoslavia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2618/77 de la Commission, du 28 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en aluminium, d'une épaisseur de plus de 0,20 millimètres,
    de la position tarifaire 76.03, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2618/77 der Kommission vom 28. November 1977 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Aluminium, mit einer
    Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2618/77 af 28. november 1977 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af aluminium, under position
    76.03, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2618/77 della Commissione, del 28 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri di alluminio, di spessore superiore a 0,20 mm della voce doganale
    76.03 originari della Iugoslavia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2618/77 van de Commissie van 28 november 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen,
    bladen en strippen, van aluminium, met een dikte van meer dan 0,20 mm, van post
    76.03, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG)
    nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
