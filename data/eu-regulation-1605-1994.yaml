    im Rahmen der allgemeinen Präferenzen durch die Verordnung (EWG) Nr. 3831/90
    des Rates für bestimmte gewerbliche Waren mit Ursprung in Indonesien, China,
    Südkorea, Brasilien, Pakistan, Malaysia, Sri Lanka, Singapur und Thailand eröffneten
    Zolltarifplafonds
  type: main
