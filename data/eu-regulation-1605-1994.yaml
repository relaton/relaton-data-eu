  content: Commission Regulation (EC) No 1605/94 of 30 June 1994 ending the charges
    against the tariff ceilings opened from 1 January 1994 to 30 June 1994, in the
    framework of generalized tariff preferences, by Council Regulation (EEC) No 3831/90
    in respect of certain industrial products originating in Indonesia, China, South
    Korea, Brazil, Pakistan, Malaysia, Sri Lanka, Singapore and Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1605/94 de la Commission du 30 juin 1994 portant cessation
    des imputations au bénéfice des plafonds tarifaires ouverts pour la période
    du 1er janvier au 30 juin 1994 dans le cadre des préférences généralisées,
    par le règlement (CEE) n° 3831/90 pour certains produits industriels originaires
    d'Indonésie, de Chine, de Corée du Sud, du Brésil, du Pakistan, de Malaysia,
    du Sri Lanka, de Singapour et de Thaïlande
  type: main
- language: de
  script: Latn
