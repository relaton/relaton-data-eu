    für Hartweizen hinsichtlich der Beihilfegewährung in Italien für das Wirtschaftsjahr
    1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1843/81 af 3. juli 1981 om undtagelse
