---
id: EUDecision1978489
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 May 1978 authorizing Ireland not to apply Community
    treatment to woven table linen, toilet linen and kitchen linen, other than of
    cotton terry fabric, falling within subheading ex 62.02 B of the Common Customs
    Tariff (NIMEXE codes 62.02-41, 43, 47, 65, 73, 77), originating in India and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/489/CEE: Décision de la Commission, du 17 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire le linge de table, le linge de toilette,
    d''office et de cuisine, tissé, autre que de coton boucle du genre éponge, de
    la sous-position Ex 62.02 B (code Nimexe 62.02-41, 43, 47, 65, 73, 77) du Tarif
    douanier commun, originaires de l''Inde et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Mai 1978, mit der Irland ermächtigt
    wird, aus Indien stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Tischwäsche, Wäsche zur Körperpflege und andere aus Frottiergeweben,
    der Tarifnummer ex 62.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 62.02-41,
    43, 47, 65, 73, 77) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage dækketøj, håndklæder, vaskeklude viskestykker
    og lignende køkkentekstiler, vævede, ikke af frotterstof, som henhører under
    pos. ex 62.02 B (NIMEXE-kode 62.02-41, 43, 47, 65, 73, 77) i den fælles toldtarif,
    har oprindelse i Indien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario la biancheria da tavola, da toletta,
    da servizio o da cucina, tessuta, diversa da quella di cotone riccio di tipo spugna
    della sottovoce ex 62.02 B della tariffa doganale comune (codice Nimexe 62.02-41,
    43, 47, 65, 73, 77), originari dell'India e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 mei 1978 waarbij Ierland wordt gemachtigd
    tafel-, bedde- en huishoudlinnen, geweven, ander dan van katoenen bad- of frotteerstof,
    van post ex 62.02 B (NIMEXE-code 62.02-41, 43, 47, 65, 73, 77) van het gemeenschappelijk
    douanetarief, van oorsprong uit India en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
