id: EUDecision1979759
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/759/EEC: Commission Decision of 13 August 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s leather footwear, falling within heading
    No ex 64.02 of the Common Customs Tariff, originating in Czechoslovakia and in
    free circulation in the other Member States (Only the French and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/759/CEE: Décision de la Commission, du 13 août 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chaussures en cuir pour hommes de la
    position ex 64.02 du tarif douanier commun originaires de Tchécoslovaquie et
    mis en libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/759/EWG: Entscheidung der Kommission vom 13. August 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der Tschechoslowakei stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Schuhe aus Leder, für Männer, der Tarifnummer
    ex 64.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/759/EØF: Kommissionens beslutning af 13. august 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage herrefodtøj af læder, som henhører
    under pos. ex 64.02 i den fælles toldtarif har oprindelse i Tjekkoslovakiet og
    frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/759/CEE: Decisione della Commissione, del 13 agosto 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussumburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le calzature di cuoio per uomo, della
    voce ex 64.02 della tariffa doganale comune, originarie della Cecoslovacchia e
    messe in libera pratica negli altri Stati membri (I testi in lingua francese e
    olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/759/EEG: Beschikking van de Commissie van 13 augustus 1979 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd schoeisel van leder, voor heren, van post ex 64.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit Tsjechoslowakije en in de overige Lid- Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
