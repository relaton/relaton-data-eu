title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1350/80 of 30 May 1980 re-establishing the
    levying of customs duties on maleic anhydride, falling within subheading 29.15
    A III and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1350/80 de la Commission, du 30 mai 1980, portant
    rétablissement de la perception des droits de douane applicables à l' anhydride
    maléique, de la sous-position 29.15 A III du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1350/80 der Kommission vom 30. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Maleinsäureanhydrid der Tarifstelle 29.15 A III, mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1350/80 af 30. maj 1980 om genindførelse
    af opkrævning af toldafgifter for malemsyreanhydrid, under pos. 29.15 A III,
    som har oprindelse i Rumænien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1350/80 della Commissione, del 30 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' anidride maleica
    della sottovoce 29.15 A III della tariffa doganale comune, originaria della Romania,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1350/80 van de Commissie van 30 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op maleïnezuuranhydride
    van post 29.15 A III, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
