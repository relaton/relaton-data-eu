title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2954/78 of 12 December 1978 opening, allocating
    and providing for the administration of a Community tariff quota for wines from
    fresh grapes and grape must with fermentation arrested by the addition of alcohol,
    falling within heading No 22.05 of the Common Customs Tariff and originating entirely
    in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2954/78 du Conseil, du 12 décembre 1978, portant
    ouverture, répartition et mode de gestion d' un contingent tarifaire communautaire
    pour les vins de raisins frais et moûts de raisins frais mutés à l' alcool
    de la position 22.05 du tarif douanier commun, entièrement obtenus en Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2954/78 des Rates vom 12. Dezember 1978 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für vollständig
    in Griechenland gewonnenen Wein aus frischen Weintrauben und mit Alkohol stummgemachten
    Most aus frischen Weintrauben der Tarifnummer 22.05 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2954/78 af 12. december 1978 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for vin af friske druer
    og druemost, hvis gæring er standset ved tilsætning af alkohol, henhørende
    under pos. 22.05 i den fælles toldtarif, og som fuldt ud er fremstillet i Grækenland
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2954/78 del Consiglio, del 12 dicembre 1978, relativo
    all' apetura, alla ripartizione ed alle modalità di gestione di un contingente
    tariffario comunitario per i vini di uve fresche e i mosti di uve fresche mutizzati
    con alcole di cui alla voce 22.05 della tariffa doganale comune interamente ottenuti
    in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2954/78 van de Raad van 12 december 1978 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor wijn van verse druiven en druivemost waarvan de gisting door toevoegen van
    alcohol is gestuit, van post 22.05 van het gemeenschappelijk douanetarief, geheel
    in Griekenland verkregen
