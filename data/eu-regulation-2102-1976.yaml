title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2102/76 of 25 August 1976 authorizing Denmark,
    Ireland and the United Kingdom to temporarily and totally suspend the autonomous
    Common Customs Tariff duties on a number of vegetables imported from other Member
    States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2102/76 de la Commission, du 25 août 1976, autorisant
    le Danemark, l'Irlande et le Royaume- Uni à suspendre temporairement et totalement
    les droits de douane applicables à certains légumes importés en provenance
    des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2102/76 der Kommission vom 25. August 1976 zur Ermächtigung
    Dänemarks, Irlands und des Vereinigten Königreichs, die Zollsätze auf bestimmte
    aus anderen Mitgliedstaaten eingeführte Gemüse zeitweilig und vollständig auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2102/76 af 25. august 1976 om bemyndigelse
    af Danmark, Irland og Det forenede Kongerige til midlertidigt helt at suspendere
    tolden på visse grønsager, der indføres fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2102/76 della Commissione, del 25 agosto 1976, che
    autorizza la Danimarca, l'Irlanda e il Regno Unito a sospendere temporaneamente
    e totalmente i dazi doganali a un certo numero di ortaggi importati in provenienza
    dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2102/76 van de Commissie van 25 augustus 1976 waarbij
    Denemarken, Ierland en het Verenigd Koninkrijk worden gemachtigd tot een tijdelijke
    en gehele schorsing van de douanerechten op verschillende uit andere Lid-Staten
    ingevoerde groenten
