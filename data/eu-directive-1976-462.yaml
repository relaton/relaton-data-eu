  script: Latn
  content: Council Directive 76/462/EEC of 4 May 1976 amending for the eleventh time
    Directive 64/54/EEC on the approximation of the laws of the Member States concerning
    the preservatives authorized for use in foodstuffs intended for human consumption
  type: main
- language: fr
  script: Latn
  content: Directive 76/462/CEE du Conseil, du 4 mai 1976, portant onzième modification
    de la directive 64/54/CEE relative au rapprochement des législations des États
    membres concernant les agents conservateurs pouvant être employés dans les denrées
    alimentaires destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 76/462/EWG des Rates vom 4. Mai 1976 zur elften Änderung der
    Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für konservierende Stoffe, die in Lebensmitteln verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 76/462/EØF af 4. maj 1976 om 11. ændring af direktiv
    64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 76/462/ΕΟΚ του Συμβουλίου της 4ης Μαΐου
