    64/54/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τα συντηρητικά που
    επιτρέπεται να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 76/462/ETY, annettu 4 päivänä toukokuuta 1976,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin 64/54/ETY muuttamisesta yhdennentoista kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 76/462/CEE del Consiglio, del 4 maggio 1976, recante 11a modifica
    della direttiva 64/54/CEE relativa al ravvicinamento delle legislazioni degli
    Stati Membri sui conservativi che possono essere impiegati nelle derrate destinate
    all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 76/462/EEG van de Raad van 4 mei 1976 houdende elfde wijziging
    van Richtlijn 64/54/EEG betreffende de aanpassing van de wetgevingen van de Lid-
    Staten inzake conserveermiddelen die mogen worden gebruikt in voor menselijke
    voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 76/462/CEE do Conselho, de 4 de Maio de 1976, que altera pela
    décima primeira vez a Directiva 64/54/CEE relativa à aproximação das legislações
    dos Estados-Membros respeitantes aos conservantes que podem ser utilizados nos
    géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 76/462/CEE del Consejo, de 4 de mayo de 1976, que modifica por
    undécima vez la Directiva 64/54/CEE relativa a la aproximación de las legislaciones
    de los Estados Miembros sobre los agentes conservadores que pueden utilizarse
    en los productos destinados al consumo humano
  type: main
- language: sv
  script: Latn
