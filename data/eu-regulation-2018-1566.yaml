    dovoljenja za pripravek iz endo-1,3(4)-beta-glukanaze in endo-1,4-beta-ksilanaze,
    ki ju proizvaja Aspergillus niger (NRRL 25541), ter alfa-amilaze, ki jo proizvaja
    Aspergillus niger (ATCC66222), kot krmni dodatek za odstavljene pujske in manj
    pomembne vrste prašičev (odstavljenih) ter o spremembi Uredbe (ES) št. 1453/2004
    (imetnik dovoljenja Andrès Pintaluba S.A.)
