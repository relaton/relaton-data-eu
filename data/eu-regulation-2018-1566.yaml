    de 2018, relativo à autorização da preparação de endo-1,3(4)-beta-glucanase
    e endo-1,4-beta-xilanase produzidas por Aspergillus niger (NRRL 25541) e alfa-amilase
    produzida por Aspergillus niger (ATCC66222) como aditivo em alimentos para leitões
    desmamados e espécies menores de suínos (desmamados) e que altera o Regulamento
    (CE) n.° 1453/2004 (detentor da autorização Andrès Pintaluba S.A.)
  type: main
