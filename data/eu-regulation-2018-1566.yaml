    prípravku s obsahom endo-1,3(4)-beta-glukanázy a endo-1,4-beta-xylanázy, ktoré
    produkuje huba Aspergillus niger (NRRL 25541), a alfa-amylázy, ktorú produkuje
    huba Aspergillus niger (ATCC66222), ako kŕmnych doplnkových látok pre odstavené
    prasiatka a zriedkavé druhy ošípaných (odstavené), ktorým sa mení nariadenie
    (ES) č. 1453/2004 (držiteľ povolenia Andrès Pintaluba S.A.)
  type: main
