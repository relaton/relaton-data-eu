id: EURegulation20181566
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1566 of 18 October 2018 concerning
    the authorisation of the preparation of endo-1,3(4)-beta-glucanase and endo-1,4-beta-xylanase
    produced by Aspergillus niger (NRRL 25541) and alpha-amylase produced by Aspergillus
    niger (ATCC66222) as a feed additive for weaned piglets and minor porcine species
    (weaned) and amending Regulation (EC) No 1453/2004 (holder of authorisation Andrès
    Pintaluba S.A.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2018/1566 de la Commission du 18 octobre
    2018 concernant l''autorisation d''une préparation d''endo-1,3(4)-bêta-glucanase
    et d''endo-1,4-bêta-xylanase produites par Aspergillus niger (NRRL 25541) ainsi
    que d''alpha-amylase produite par Aspergillus niger (ATCC66222) en tant qu''additif
    pour l''alimentation des porcelets sevrés et des espèces porcines mineures (sevrées),
    et modifiant le règlement (CE) n° 1453/2004 (titulaire de l''autorisation: Andrès
    Pintaluba S.A.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2018/1566 der Kommission vom 18. Oktober
    2018 zur Zulassung einer Zubereitung aus Endo-1,3(4)-beta-Glucanase und Endo-1,4-beta-Xylanase,
    gewonnen aus Aspergillus niger (NRRL 25541), und Alpha-Amylase, gewonnen aus Aspergillus
    niger (ATCC66222), als Zusatzstoff in Futtermitteln für entwöhnte Ferkel und
    Schweinearten von geringerer wirtschaftlicher Bedeutung (entwöhnt) sowie zur
    Änderung der Verordnung (EG) Nr. 1453/2004 (Zulassungsinhaber: Andrès Pintaluba
    S.A.)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2018/1566 на Комисията
    от 18 октомври 2018 година за разрешаване на употребата
    на препарат от ендо-1,3(4)-бета-глюканаза и ендо-1,4-бета-ксиланаза,
    получени от Aspergillus niger (NRRL 25541), и алфа-амилаза,
    получена от Aspergillus niger (ATCC66222), като фуражна добавка
    за отбити прасенца и за видове свине с по-малко
    стопанско значение (отбити) и за изменение
    на Регламент (ЕО) № 1453/2004 (притежател на разрешението
    Andrès Pintaluba S.A.)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2018/1566 ze dne 18. října 2018
    o povolení přípravku z endo-1,3(4)-beta-glukanázy a endo-1,4-beta-xylanázy
    z Aspergillus niger (NRRL 25541) a alfa-amylázy z Aspergillus niger (ATCC66222)
    jako doplňkové látky pro odstavená selata a menšinové druhy prasat (po odstavu)
    a o změně nařízení (ES) č. 1453/2004 (držitel povolení Andrès Pintaluba
    S.A.)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2018/1566 af 18. oktober 2018
    om godkendelse af præparatet af endo-1,3(4)-beta-glucanase og endo-1,4-beta-xylanase
    produceret af Aspergillus niger (NRRL 25541) og alfa-amylase produceret af Aspergillus
    niger (ATCC66222) som tilsætningsstof til foder til fravænnede smågrise og
    mindre udbredte svinearter (fravænnede) og om ændring af forordning (EF) nr.
    1453/2004 (indehaver af godkendelsen er Andrès Pintaluba S.A.)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2018/1566 της Επιτροπής,
    της 18ης Οκτωβρίου 2018, σχετικά με τη χορήγηση
    άδειας για τη χρήση του παρασκευάσματος ενδο-1,3(4)-β-γλυκανάσης
    και ενδο-1,4-β-ξυλανάσης που παράγεται από Aspergillus
    niger (NRRL 25541) και α-αμυλάσης που παράγεται από
    Aspergillus niger (ATCC66222) ως πρόσθετης ύλης ζωοτροφών
    για απογαλακτισμένα χοιρίδια και μικρά είδη
    χοίρων (απογαλακτισμένα), και την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1453/2004 (κάτοχος της
    άδειας Andrès Pintaluba SA)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2018/1566, 18. oktoober 2018, milles käsitletakse
    loa andmist Aspergillus niger'i (NRRL 25541) abil toodetud endo-1,3(4)-β-glükanaasi
    ja endo-1,4-β-ksülanaasi ning Aspergillus niger'i (ATCC66222) abil toodetud
    α-amülaasi preparaadi kasutamiseks võõrutatud põrsaste ja vähem levinud
    sealiikide (võõrutatud) söödalisandina ning muudetakse määrust (EÜ) nr
    1453/2004 (loa omanik Andrès Pintaluba S.A.)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2018/1566, annettu 18 päivänä
    lokakuuta 2018, Aspergillus niger (NRRL 25541) -organismin tuottamaa endo-1,3(4)-beeta-glukanaasia
    ja endo-1,4-beeta-ksylanaasia ja Aspergillus niger (ATCC66222) -organismin tuottamaa
    alfa-amylaasia sisältävän valmisteen hyväksymisestä vieroitettujen porsaiden
    ja (vieroitettujen) toissijaisten sikaeläinten rehun lisäaineena sekä asetuksen
    (EY) N:o 1453/2004 muuttamisesta (hyväksynnän haltija Andrès Pintaluba SA)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2018/1566 оd 18. listopada 2018. o odobrenju
    pripravka endo-1,3(4)-beta-glukanaze i endo-1,4-beta-ksilanaze proizvedenih od
    Aspergillus niger (NRRL 25541) i alfa-amilaze proizvedene od Aspergillus niger
    (ATCC66222) kao dodatka hrani za odbijenu prasad i manje značajne vrste svinja
    (odbijene) i o izmjeni Uredbe (EZ) br. 1453/2004 (nositelj odobrenja Andrès Pintaluba
    S.A.)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2018/1566 végrehajtási rendelete (2018. október 18.)
    az Aspergillus niger (NRRL 25541) által termelt endo-1,3(4)-béta-glükanázt
    és endo-1,4-béta-xilanázt, valamint az Aspergillus niger (ATCC66222) által
    termelt alfa-amilázt tartalmazó készítmény elválasztott malacok és (elválasztott)
    kistermetű sertésfélék takarmány-adalékanyagaként történő felhasználásának
    engedélyezéséről (az engedély jogosultja: Andrès Pintaluba S.A.) és az
    1453/2004/EK rendelet módosításáról'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2018/1566 della Commissione, del 18 ottobre
    2018, relativo all'autorizzazione del preparato di endo-1,3 (4) -beta-glucanasi
    ed endo-1,4-beta-xilanasi prodotte da Aspergillus niger (NRRL 25541) e di alfa-amilasi
    prodotta da Aspergillus niger (ATCC66222) come additivo per mangimi destinati
    a suinetti svezzati e specie suine minori (svezzate) e recante modifica del regolamento
    (CE) n. 1453/2004 (titolare dell'autorizzazione Andrès Pintaluba SA)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2018/1566 (2018. gada 18. oktobris)
    par atļauju no Aspergillus niger (NRRL 25541) iegūtas endo-1,3(4)-beta-glikanāzes
    un endo-1,4-beta-ksilanāzes un no Aspergillus niger (ATCC66222) iegūtas alfa-amilāzes
    preparātu lietot par barības piedevu atšķirtiem sivēniem un mazāk svarīgu
    sugu (atšķirtām) cūkām un ar ko groza Regulu (EK) Nr. 1453/2004 (atļaujas
    turētājs Andrès Pintaluba S.A.)
  type: main
- language: lt
  script: Latn
  content: 2018 m. spalio 18 d. Komisijos įgyvendinimo reglamentas (ES) 2018/1566
    dėl leidimo naudoti endo-1,3(4)-beta-gliukanazės ir endo-1,4-beta-ksilanazės,
    gautų iš Aspergillus niger (NRRL 25541), ir alfa amilazės, gautos iš Aspergillus
    niger (ATCC66222), preparatą kaip nujunkytų paršelių ir retesnių rūšių
    (nujunkytų) kiaulių pašarų priedą, kuriuo iš dalies keičiamas Reglamentas
    (EB) Nr. 1453/2004 (leidimo turėtojas – „Andrès Pintaluba S.A.“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1566 tat-18 ta'
    Ottubru 2018 dwar l-awtorizzazzjoni tal-preparazzjoni ta' endo-1,3(4)-beta-glukanażi
    u ta' endo-1,4-beta-ksilanażi prodott mill-Aspergillus niger (NRRL 25541) u ta'
    alfa-amilażi prodott mill-Aspergillus niger (ATCC 66222) bħala addittiv tal-għalf
    għall-ħnienes miftuma u għall-ispeċijiet porċini minuri (miftuma) u li jemenda
    r-Regolament (KE) Nru 1453/2004 (id-detentur tal-awtorizzazzjoni Andrès Pintaluba
    S.A.)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2018/1566 van de Commissie van 18 oktober 2018
    tot verlening van een vergunning voor een preparaat van endo-1,3(4)-bèta-glucanase
    en endo-1,4-bèta-xylanase, geproduceerd door Aspergillus niger (NRRL 25541),
    en alfa-amylase, geproduceerd door Aspergillus niger (ATCC66222), als toevoegingsmiddel
    voor diervoeding voor gespeende biggen en kleine varkenssoorten (gespeend) en
    tot wijziging van Verordening (EG) nr. 1453/2004 (vergunninghouder Andrés Pintaluba
    SA)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2018/1566 z dnia 18 października
    2018 r. dotyczące zezwolenia na stosowanie preparatu endo-1,3(4)-beta-glukanazy
    i endo-1,4-beta-ksylanazy wytwarzanych przez Aspergillus niger (NRRL 25541) oraz
    alfa-amylazy wytwarzanej przez Aspergillus niger (ATCC66222) jako dodatku paszowego
    dla prosiąt odstawionych od maciory i podrzędnych gatunków świń (odstawionych
