    framställt av Aspergillus niger (NRRL 25541) och alfaamylas framställt av Aspergillus
    niger (ATCC66222) som fodertillsats för avvanda smågrisar och mindre vanligt
    förekommande svinarter (avvanda) och om ändring av förordning (EG) nr 1453/2004
    (innehavare av godkännandet: Andrès Pintaluba SA)'
