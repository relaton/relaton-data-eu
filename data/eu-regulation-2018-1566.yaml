    și endo-1,4-beta-xilanază produse de Aspergillus niger (NRRL 25541) și alfa-amilază
    produsă de Aspergillus niger (ATCC66222) ca aditiv furajer pentru purceii înțărcați
    și pentru speciile porcine minore (înțărcate) și de modificare a Regulamentului
    (CE) nr. 1453/2004 (titularul autorizației: Andrès Pintaluba S.A.)'
  type: main
