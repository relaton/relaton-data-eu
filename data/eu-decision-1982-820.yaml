title:
- language: en
  script: Latn
  content: '82/820/EEC: Council Decision of 15 November 1982 on the conclusion of
    the Agreement in the form of an exchange of letters between the European Economic
    Community and the Republic of Finland on the interconnection of the Community
    network for data transmission (Euronet) and the Finnish national data network
    and on the conclusion of the Quadripartite Protocol on the purport of the agreements
    for data network cooperation concluded between the European Economic Community,
    the Swiss Confederation, the Kingdom of Sweden and the Republic of Finland'
  type: main
- language: fr
  script: Latn
  content: '82/820/CEE: Décision du Conseil, du 15 novembre 1982, concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté économique
    européenne et la République de Finlande portant sur l''interconnexion du réseau
    communautaire de transmission de données (Euronet) et du réseau national finlandais
    de données, ainsi que la conclusion du protocole quadripartite sur la teneur
    des accords de coopération en matière de réseau de données conclus entre la
    Communauté économique européenne, la Confédération suisse, le Royaume de
    Suède et la République de Finlande'
  type: main
- language: de
  script: Latn
  content: '82/820/EWG: Beschluß des Rates vom 15. November 1982 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Republik Finnland zur Verbindung des Datenfernübertragungsnetzes der
    Gemeinschaft (EURONET) und des finnischen Datennetzes und über den Abschluß
    des vierseitigen Protokolls über den Inhalt der von der Europäischen Wirtschaftsgemeinschaft
    mit der Schweizerischen Eidgenossenschaft, dem Königreich Schweden und der Republik
    Finnland geschlossenen Abkommen über Zusammenarbeit bei den Datennetzen'
  type: main
- language: da
  script: Latn
  content: '82/820/EØF: Rådets afgørelse af 15. november 1982 om indgåelse af
    aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og republikken Finland om sammenkobling af Fællesskabets datatransmissionsnet
    (Euronet) og det finske datanet og om indgåelse af firepartsprotokollen om rækkevidden
    af aftalerne om samarbejde på datanetområdet mellem Det europæiske økonomiske
    Fællesskab, Schweiz, kongeriget Sverige og republikken Finland'
  type: main
- language: el
  script: Grek
  content: '82/820/EOK: Απόφαση τού Συμβουλίου τής 15ης Νοεμβρίου
    1982 γιά τή σύναψη τής συμφωνίας υπό μορφή ανταλλαγής
    επιστολών μεταξύ τής Ευρωπαϊκής Οικονομικής
    Κοινότητας καί τής Δημοκρατίας τής Φινλανδίας
    γιά τή σύνδεση τού κοινοτικού δικτύου μεταδόσεως
    στοιχείων (Euronet) καί τού φινλανδικού εθνικού
    δικτύου στοιχείων, καθώς καί γιά τή σύναψη
    τού τετραμερούς πρωτοκόλλου σχετικά μέ τό
    περιεχόμενο τών συμφωνιών συνεργασίας γιά
    τά δίκτυα στοιχείων, οι οποίες έχουν συναφθεί
    μεταξύ τής Ευρωπαϊκής Οικονομικής Κοινότητας,
    τής Ελβετικής Συνομοσπονδίας, τού Βασιλείου
    τής Σουηδίας καί τής Δημοκρατίας τής Φινλανδίας'
  type: main
- language: it
  script: Latn
  content: '82/820/CEE: Decisione del Consiglio, del 15 novembre 1982, relativa alla
    conclusione dell'' accordo in forma di scambio di lettere tra la Comunità economica
    europea e la Repubblica di Finlandia in merito al collegamento della rete comunitaria
    di trasmissione dei dati (Euronet) con la rete nazionale di dati finlandese ed
    alla conclusione del protocollo quadripartito in merito al contenuto degli accordi
    sulla cooperazione nel settore delle reti di dati conclusi tra la Comunità economica
    europea, la Confederazione svizzera, il Regno di Svezia e la Repubblica di Finlandia'
  type: main
- language: nl
  script: Latn
  content: '82/820/EEG: Besluit van de Raad van 15 november 1982 betreffende de sluiting
    van een Overeenkomst in de vorm van een briefwisseling tussen de Europese Economische
    Gemeenschap en de Republiek Finland inzake de aansluiting van het Finse nationale
    datanet op het datatransmissienet van de Gemeenschap (Euronet) en betreffende
    de sluiting van het Vierpartijenprotocol aagaande de overeenkomsten inzake samenwerking
    op het gebied van datanetten die zijn gesloten door de Europese Economische Gemeenschap
    met de Zwitserse Bondsstaat, het Koninkrijk Zweden en de Republiek Finland'
