- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2235 of 16 December 2020 laying
    down rules for the application of Regulations (EU) 2016/429 and (EU) 2017/625
    of the European Parliament and of the Council as regards model animal health certificates,
    model official certificates and model animal health/official certificates, for
    the entry into the Union and movements within the Union of consignments of certain
    categories of animals and goods, official certification regarding such certificates
    and repealing Regulation (EC) No 599/2004, Implementing Regulations (EU) No 636/2014
    and (EU) 2019/628, Directive 98/68/EC and Decisions 2000/572/EC, 2003/779/EC and
    2007/240/EC
  type: main
- language: fr
  script: Latn
