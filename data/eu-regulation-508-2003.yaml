title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 508/2003 of 20 March 2003 determining the
    extent to which applications lodged in March 2003 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 508/2003 de la Commission du 20 mars 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2003 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 508/2003 der Kommission vom 20. März 2003 über die
    Festsetzung des Umfangs, in dem die im März 2003 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 508/2003 af 20. marts 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2003 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 508/2003 της Επιτροπής,
    της 20ής Μαρτίου 2003, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Μάρτιο 2003 για
    πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τη
    συμφωνία που συνήψε η Κοινότητα με τη Σλοβενία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 508/2003, annettu 20 päivänä maaliskuuta 2003,
    yhteisön Slovenian kanssa tekemässä sopimuksessa määrätyn järjestelmän
    mukaisesti maaliskuussa 2003 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 508/2003 della Commissione, del 20 marzo 2003, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di marzo 2003 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 508/2003 van de Commissie van 20 maart 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in maart 2003 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomst met Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 508/2003 da Comissão, de 20 de Março de 2003, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Março de
    2003 ao abrigo do regime previsto no acordo concluído pela Comunidade com a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 508/2003 de la Comisión, de 20 de marzo de 2003, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de marzo de 2003 al amparo del régimen previsto en el Acuerdo celebrado
    entre la Comunidad y Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 508/2003 av den 20 mars 2003 om fastställande
