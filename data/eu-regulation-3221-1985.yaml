  script: Latn
  content: Commission Regulation (EEC) No 3221/85 of 15 November 1985 fixing the amounts
    to be levied in the beef sector on products which left the United Kingdom during
    the week 28 October to 3 November 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3221/85 de la Commission, du 15 novembre 1985, fixant
    les montants à percevoir dans le secteur de la viande bovine sur les produits
    ayant quitté le Royaume-Uni au cours de la semaine du 28 octobre au 3 novembre
    1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3221/85 der Kommission vom 15. November 1985 zur Festsetzung
    der Beträge, welche im Sektor Rindfleisch auf Erzeugnisse, die das Vereinigte
    Königreich in der Woche vom 28. Oktober bis 3. November 1985 verlassen haben,
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3221/85 af 15. november 1985 om fastsættelse
