title:
- language: en
  script: Latn
  content: '89/171/EEC: Commission Decision of 1 March 1989 concerning the establishment
    of overall quantities of food aid for 1989 and establishing a list of products
    to be supplied as food aid'
  type: main
- language: fr
  script: Latn
  content: '89/171/CEE: Décision de la Commission du 1er mars 1989 relative à la
    fixation des quantités globales d''aide alimentaire au titre du programme 1989
    et à l''établissement de la liste des produits à fournir à titre d''aide alimentaire'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 1. Maerz 1989 zur Festlegung der Gesamtmenge
    der Nahrungsmittelhilfe im Rahmen des Programms fuer 1989 und zur Erstellung des
    Verzeichnisses der als Nahrungsmittelhilfe zu liefernden Erzeugnisse (89/171/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 1. marts 1989 om fastsaettelse af de samlede
    maengder foedevarehjaelp i henhold til 1989-programmet og af listen over produkter,
    der kan leveres som foedevarehjaelp (89/171/EOEF)
  type: main
- language: el
  script: Grek
  content: '89/171/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Μαρτίου
    1989 σχετικά με τον καθορισμό των συνολικών ποσοτήτων
    επισιτιστικής βοήθειας στο πλαίσιο του προγράμματος
    1989 και την κατάρτιση του καταλόγου των προϊόντων
    που χορηγούνται στο πλαίσιο της επισιτιστικής
    βοήθειας'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 1o marzo 1989 che determina i quantitativi
    globali e l'elenco dei prodotti da fornire quale aiuto alimentare nell'ambito
    del programma 1989 (89/171/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 1 maart 1989 tot vaststelling van de totale
    hoeveelheden voedselhulp voor het programma van 1989 en van de lijst van voor
    beschikbaarstelling als voedselhulp in aanmerking komende produkten (89/171/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 1 de Março de 1989 relativa à fixaçao da quantidades
    globais de ajuda alimentar a titulo do programa de 1989 e ao estabelecimento da
    lista dos produtos a fornecer a titulo de ajuda alimentar (89/171/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 1 de marzo de 1989 por el que se fijan las cantidades
