  script: Latn
  content: Commission Implementing Regulation (EU) 2025/2320 of 18 November 2025 amending
    Implementing Regulation (EU) 2021/633 imposing a definitive anti-dumping duty
    on imports of monosodium glutamate originating in the People’s Republic of China
    and in Indonesia following an expiry review pursuant to Article 11(2) of Regulation
    (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2320 de la Commission du 18 novembre
