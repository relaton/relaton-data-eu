title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3111/83 of 4 November 1983 re-establishing
    the levying of customs duties on frames for spectacles, falling within heading
    No 90.03 and originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3111/83 de la Commission du 4 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux montures
    de lunettes, de la position 90.03 du tarif douanier commun, originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3111/83 der Kommission vom 4. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für Fassungen für Brillen der Tarifnummer 90.03 mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3111/83 af 4. november 1983 om genindførelse
    af opkrævning af told for stel til briller, henhørende under position 90.03
    og med oprindelse i Sydkorea, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3111/83 της Επιτροπής
    της 4ης Νοεμβρίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για σκελετούς ομματοϋαλίων
    της κλάσεως 90.03 του Κοινού Δασμολογίου, καταγωγής
    Νοτίου Κορέας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3111/83 della Commissione del 4 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili alle montature per occhiali,
    della voce 90.03 della tariffa doganale comune, originarie della Corea del Sud,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3111/83 van de Commissie van 4 november 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op monturen voor
    brillen van post 90.03 van het gemeenschappelijk douanetarief, van oorsprong uit
    Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3377/82 van de Raad vermelde
    tariefpreferenties zijn verleend
