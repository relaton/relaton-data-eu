title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1098/78 of 25 May 1978 re-establishing the
    levying of customs duties on woven fabrics of silk, of noil or other waste silk,
    falling within heading No 50.09, originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1098/78 de la Commission, du 25 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie, de bourre de soie ou de déchets de bourre de soie, de la position tarifaire
    50.09, originaires du Brésil, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2706/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1098/78 der Kommission vom 25. Mai 1978 über die
    Wiedereinführung des Zollsatzes für Gewebe aus Seide, Schappeseide oder Bourretteseide,
    der Tarifnummer 50.09, mit Ursprung in Brasilien, dem die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1098/78 af 25. maj 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke (herunder schappesilke
    og bourettesilke), under position 50.09, som har oprindelse i Brasilien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1098/78 della Commissione, del 25 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta o di
    borra di seta (schappe) o di cascami di borra di seta (raccadino o pettenuzzo
    di seta) della voce doganale 50.09, originari del Brasile, beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1098/78 van de Commissie van 25 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van zijde, van vlokzijde of van bourrette, van post 50.09, van oorsprong uit Brazilië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 2706/77 van de Raad
  type: main
