title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3559/89 of 28 November 1989 re-establishing
    the levying of customs duties on aluminium plates, sheets and strips, of a thickness
    exceeding 0,2 mm, falling within CN code 7606, originating in Venezuela, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 4257/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3559/89 de la Commission du 28 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux tôles et
    bandes en aluminium, d'une épaisseur excédant 0,2 mm, du code NC 7606, originaires
    de Venezuela, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3559/89 DER KOMMISSION vom 28. November 1989 zur
