title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2013/80 of 28 July 1980 re-establishing
    the levying of customs duties on yarn of carded sheep' s or lambs' wool (woollen
    yarn) or of carded fine animal hair, not put up for retail sale, products of category
    47 (code 0470), originating in Peru, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2013/80 de la Commission, du 28 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    laine ou de poils fins, cardés, non conditionnés pour la vente au détail, de
    la catégorie de produits n° 47 (code 0470), originaires du Pérou, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2013/80 der Kommission vom 28. Juli 1980 über die
    Wiedereinführung des Zollsatzes für Streichgarne aus Wolle oder aus Tierhaaren,
    nicht in Aufmachungen für den Einzelverkauf, der Warenkategorie Nr. 47 (Kennziffer
    0470), mit Ursprung in Peru, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2013/80 af 28. juli 1980 om genindførelse
    af opkrævning af toldafgifter for garn af uld eller fine dyrehår, kartet, ikke
    i detailsalgsoplægninger, under varekategori 47 (kode 0470), som har oprindelse
    i Peru og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2013/80 della Commissione, del 28 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lana o di
    peli fini, cardati, non preparati per la vendita al minuto, della categoria di
    prodotti n. 47 (codice 0470), originari del Perù beneficiario della preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2013/80 van de Commissie van 28 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kaardgaren
    van wol of van fijn haar, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 47 (codenummer 0470) van oorsprong uit Peru, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
