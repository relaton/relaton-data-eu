title:
- language: en
  script: Latn
  content: '88/207/EEC: Commission Decision of 14 December 1987 amending Decisions
    84/73/EEC instituting on the island of Lesbos, prefecture of Lesbos, Greece, a
    pilot action in preparation for the integrated Mediterranean programmes and 86/39/EEC
    instituting in the prefecture of Grevena, Greece, a pilot action in preparation
    for the integrated Mediterranean programmes (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/207/CEE: Décision de la Commission du 14 décembre 1987 modifiant
    les décisions 84/73/CEE, relative à l''institution dans l''île de Lesbos, nome
    de Lesbos, Grèce, d''une action pilote préparatoire à la mise en oeuvre de
    programmes intégrés méditerranéens, et 86/39/CEE, relative à l''institution
    dans le nome de Grevena, Grèce, d''une action pilote préparatoire à la mise
    en oeuvre des programmes intégrés méditerranéens (Le texte en langue grecque
    est le seul faisant foi)'
  type: main
- language: de
