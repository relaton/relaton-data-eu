title:
- language: fr
  script: Latn
  content: Décision 67/60/CEE de la Commission, du 6 janvier 1967, autorisant la
    République française, en vertu de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire "les appareils de micro-analyse par rayons X (autres
    que ceux relevant de la position n° 90.20 du Tarif douanier commun), les appareils
    à résonance magnétique et les spectromètres à rayons bêta" de la position
    Ex 90.28 B du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '67/60/EWG: Entscheidung der Kommission vom 6. Januar 1967, mit der die
    Französische Republik nach Artikel 115 Absatz (1) des Vertrages ermächtigt wird,
    aus Japan stammende und in anderen Mitgliedstaaten im freien Verkehr befindliche
    "Röntgenapparate zur Mikroanalyse (mit Ausnahme der unter Nr. 90.20 des Gemeinsamen
    Zolltarifs fallenden), magnetische Resonanzapparate und Beta-Strahlspektrometer"
    der Tarifnummer ex 90.28 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/60/CEE: Decisione della Commissione, del 6 gennaio 1967, con cui, in
    virtù dell''articolo 115, paragrafo 1, del Trattato, si autorizza la Repubblica
    francese ad escludere dal trattamento comunitario «gli apparecchi di micro-analisi
    a raggi x (diversi da quelli di cui alla voce 90.20 della tariffa doganale comune),
    gli apparecchi a risonanza magnetica e gli spettrometri a raggi beta» della voce
    ex 90.28 B della tariffa doganale comune, originari del Giappone ed immessi in
    libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/60/EEG: Beschikking van de Commissie van 6 januari 1967 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea, van het Verdrag
    röntgentoestellen voor micro-analyse (andere dan die bedoeld bij post 90.20 van
    het gemeenschappelijk douanetarief), toestellen met magnetische resonantie en
    spectrometers met beta-stralen, van post ex 90.28 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in andere Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
