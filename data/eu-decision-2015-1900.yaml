- language: en
  script: Latn
  content: Council Decision (EU) 2015/1900 of 5 October 2015 establishing the position
    to be taken on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and Bosnia and
    Herzegovina, of the other part, concerning a Decision of the Stabilisation and
    Association Council adopting its rules of procedure
  type: main
