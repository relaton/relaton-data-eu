    conjoncturelles en ce qui concerne la première année de base à utiliser pour
    les séries chronologiques selon la NACE Rév. 2 et, pour les séries chronologiques
    antérieures à 2009, à transmettre conformément à la NACE Rév. 2, le niveau
    de détail, la forme, la première période de référence et la période de référence
