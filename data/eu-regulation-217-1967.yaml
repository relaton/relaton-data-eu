title:
- language: fr
  script: Latn
  content: Règlement n° 217/67/CEE du Conseil, du 27 juin 1967 fixant les conditions
    d'octroi des restitutions pouvant être accordées à l'exportation vers les pays
    tiers sous la forme de marchandises ne relevant pas de l'annexe II du Traité,
    de certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 217/67/EWG des Rates vom 27. Juni 1967 zur Festsetzung der
    Bedingungen für die Gewährung von Erstattungen bei der Ausfuhr bestimmter landwirtschaftlicher
    Erzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden Waren nach
    dritten Ländern
  type: main
- language: it
  script: Latn
  content: Regolamento n. 217/67/CEE del Consiglio, del 27 giugno 1967, che fissa
    le condizioni per la concessione delle restituzioni che possono essere accordate
    all'esportazione verso i paesi terzi, sotto forma di merci non comprese nell'allegato
    II del Trattato, di taluni prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 217/67/EEG van de Raad van 27 juni 1967 houdende vaststelling
    van de voorwaarden voor de toekenning van de restituties die kunnen worden verleend
    bij de uitvoer naar derde landen van bepaalde landbouwprodukten in de vorm van
    niet in bijlage II van het Verdrag vermelde goederen
  type: main
