title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/864 of 28 May 2021 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2020/492 on imports of certain woven and/or
    stitched glass fibre fabrics originating in People’s Republic of China and Egypt
    by imports of certain woven and/or stitched glass fibre fabrics consigned from
    Morocco, whether declared as originating in Morocco or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/864 de la Commission du 28 mai 2021
    ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2020/492 sur les importations
    de certains tissus en fibres de verre tissées et/ou cousues originaires de la
    République populaire de Chine et d’Égypte par des importations de certains
    tissus en fibres de verre tissées et/ou cousues expédiées du Maroc, qu’elles
    aient ou non été déclarées originaires de ce pays, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/864 der Kommission vom 28. Mai 2021
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2020/492 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter gewebter und/oder genähter Erzeugnisse aus
    Glasfasern mit Ursprung in der Volksrepublik China und Ägypten durch aus Marokko
    versandte Einfuhren bestimmter gewebter und/oder genähter Erzeugnisse aus Glasfasern,
    ob als Ursprungserzeugnisse Marokkos angemeldet oder nicht, und zur zollamtlichen
    Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/864 на Комисията
    от 28 май 2021 година за започване на разследване
    във връзка с евентуалното заобикаляне на антидъмпинговите
    мерки, наложени с Регламент за изпълнение (ЕС)
    2020/492 върху вноса на определени тъкани от тъкàни
    и/или прошити стъклени влакна с произход от
    Китайската народна република и Египет, чрез
    внос на определени тъкани от тъкàни и/или прошити
    стъклени влакна, изпращани от Мароко, независимо
    дали са декларирани с произход от Мароко, и
    за въвеждане на регистрационен режим за този
    внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/864 ze dne 28. května 2021 o
    zahájení šetření možného obcházení antidumpingových opatření uložených
    prováděcím nařízením (EU) 2020/492 na dovoz některých tkaných a/nebo
    vpichovaných textilií ze skleněných vláken pocházejících z Čínské lidové
    republiky a Egypta dovozem některých tkaných a/nebo vpichovaných textilií
    ze skleněných vláken zasílaných z Maroka, bez ohledu na to, zda je u nich
    deklarován původ z Maroka, a o zavedení celní evidence tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/864 af 28. maj 2021 om
    indledning af en undersøgelse vedrørende den mulige omgåelse af de antidumpingforanstaltninger,
    der blev indført ved gennemførelsesforordning (EU) 2020/492 over for importen
    af visse vævede og/eller stingfæstnede stoffer af glasfiber med oprindelse i
    Folkerepublikken Kina og Egypten, ved import af visse vævede og/eller stingfæstnede
    stoffer af glasfiber afsendt fra Marokko, uanset om varen er angivet med oprindelse
    i Marokko, og om at gøre denne import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/864 της Επιτροπής
    της 28ης Μαΐου 2021 για την έναρξη έρευνας όσον
    αφορά την πιθανή καταστρατήγηση των μέτρων
    αντιντάμπινγκ που επιβλήθηκαν με τον εκτελεστικό
    κανονισμό (ΕΕ) 2020/492 στις εισαγωγές ορισμένων
    υφασμένων και/ή ραμμένων υφασμάτων από υαλοΐνες
