    λόγω εισαγωγών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/864, 28. mai 2021, millega algatatakse
    uurimine, milles käsitletakse võimalikku kõrvalehoidmist Hiina Rahvavabariigist
    ja Egiptusest pärit teatavate kootud ja/või nõeltöödeldud klaaskiust kangaste
    impordi suhtes rakendusmäärusega (EL) 2020/492 kehtestatud dumpinguvastastest
    meetmetest Marokost lähetatud impordi vahendusel, olenemata sellest, kas kõnealused
    tooted on deklareeritud Marokost pärinevana või mitte, ning kehtestatakse sellele
    impordile registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/864, annettu 28 päivänä
    toukokuuta 2021, Kiinan kansantasavallasta ja Egyptistä peräisin olevien tiettyjen
    silmukka- ja/tai ristikudokseksi kudottujen lasikuitukankaiden tuonnissa täytäntöönpanoasetuksella
    (EU) 2020/492 käyttöön otettujen polkumyynnin vastaisten toimenpiteiden mahdollista
    kiertämistä tiettyjen silmukka- ja/tai ristikudokseksi kudottujen lasikuitukankaiden
    tuonnilla Marokosta riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu
    Marokko, koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/864 ón gCoimisiún an 28 Bealtaine
    2021 lena dtionscnaítear imscrúdú a bhaineann le himchéimniú féideartha
    na mbeart frithdhumpála a fhorchuirtear le Rialachán Cur Chun Feidhme (AE) 2020/492
    maidir le hallmhairí fabraicí snáithíní gloine fite agus/nó fuaite áirithe
    de thionscnamh Dhaon-Phoblacht na Síne agus na hÉigipte trí allmhairí fabraicí
    snáithíní gloine fite agus/nó fuaite áirithe a choinsínítear ó Mharacó,
    dearbhaítear gur de thionscnamh Mharacó iad nó ná dearbhaítear, agus na hallmhairí
    sin a chur faoi réir a gcláraithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/864 оd 28. svibnja 2021. o pokretanju
    ispitnog postupka o mogućem izbjegavanju antidampinških mjera uvedenih Provedbenom
    uredbom (EU) 2020/492 na uvoz određenih tkanih i/ili prošivenih tkanina od staklenih
    vlakana podrijetlom iz Narodne Republike Kine i Egipta uvozom određenih tkanih
    i/ili prošivenih tkanina od staklenih vlakana otpremljenih iz Maroka, bez obzira
    na to imaju li deklarirano podrijetlo iz Maroka, te o uvjetovanju takvog uvoza
    evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/864 végrehajtási rendelete (2021. május 28.)
    a Kínai Népköztársaságból és az Egyiptomból származó egyes szőtt és/vagy
    tűzött üvegrost szövetek behozatalára vonatkozóan az (EU) 2020/492 végrehajtási
    rendelettel bevezetett dömpingellenes intézkedéseknek a Marokkóban feladott,
    akár Marokkóból származóként, akár nem ilyenként bejelentett egyes szőtt
    és/vagy tűzött üvegrost szövetek behozatalával megvalósított esetleges
    kijátszására vonatkozó vizsgálat megindításáról, valamint az érintett
    behozatalokra vonatkozó nyilvántartásbavételi kötelezettség bevezetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/864 della Commissione del 28 maggio
    2021 che apre un’inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento di esecuzione (UE) 2020/492 sulle importazioni di alcuni
    prodotti in fibra di vetro tessuti e/o cuciti originari della Repubblica popolare
    cinese e dell’Egitto mediante importazioni di alcuni prodotti in fibra di vetro
    tessuti e/o cuciti spediti dal Marocco, a prescindere che siano dichiarati o no
    originari del Marocco, e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/864 (2021. gada 28. maijs), ar
    ko sāk izmeklēšanu par antidempinga pasākumu, kuri ar Īstenošanas regulu
    (ES) 2020/492 noteikti konkrētu Ķīnas Tautas Republikas un Ēģiptes izcelsmes
    austu un/vai sašūtu stikla šķiedras audumu importam, iespējamo apiešanu,
    kura notiek, importējot konkrētus austus un/vai sašūtus stikla šķiedras
    audumus, kas nosūtīti no Marokas, neatkarīgi no tā, vai tiem ir deklarēta
    Marokas izcelsme, un ar ko uz šādu importu attiecina reģistrāciju
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/864 2021 m. gegužės 28
    d. kuriuo inicijuojamas tyrimas dėl galimo antidempingo priemonių, nustatytų
    Įgyvendinimo reglamentu (ES) 2020/492 tam tikroms importuojamoms Kinijos Liaudies
    Respublikos ir Egipto kilmės austoms ir (arba) siūtoms stiklo pluošto medžiagoms,
    vengimo importuojant iš Maroko siunčiamas tam tikras austas ir (arba) siūtas
    stiklo pluošto medžiagas, deklaruojamas arba nedeklaruojamas kaip Maroko kilmės,
    ir įpareigojama tokius importuojamus produktus registruoti
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/864 tad-28
    ta’ Mejju 2021 li jiftaħ investigazzjoni li tikkonċerna ċ-ċirkomvenzjoni
    possibbli tal-miżuri anti-dumping imposti mir-Regolament ta’ Implimentazzjoni
    (UE) 2020/492 fuq l-importazzjonijiet ta’ ċerti materjali tal-fibra tal-ħġieġ
    minsuġa u/jew meħjuta li joriġinaw mir-Repubblika tal-Poplu taċ-Ċina u mill-Eġittu
    permezz ta’ importazzjonijiet ta’ ċerti materjali tal-fibra tal-ħġieġ
    minsuġa u/jew meħjuta kkonsenjati mill-Marokk, sew jekk iddikjarati li joriġinaw
    mill-Marokk u sew jekk le, u li jagħmel dawn l-importazzjonijiet suġġetti għal
    reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/864 van de Commissie van 28 mei 2021 tot
    opening van een onderzoek naar de mogelijke ontwijking van de bij Uitvoeringsverordening
    (EU) 2020/492 ingestelde antidumpingmaatregelen ten aanzien van de invoer van
    bepaalde geweven en/of gestikte stoffen van glasvezels van oorsprong uit de Volksrepubliek
    China en Egypte, door de invoer van uit Marokko verzonden bepaalde geweven en/of
    gestikte stoffen van glasvezels, al dan niet aangegeven als van oorsprong uit
    Marokko, en tot registratie van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/864 z dnia 28 maja 2021 r.
    wszczynające dochodzenie dotyczące możliwego obchodzenia środków antydumpingowych,
    wprowadzonych rozporządzeniem wykonawczym (UE) 2020/492 na przywóz niektórych
    materiałów z włókna szklanego tkanych lub zszywanych pochodzących z Chińskiej
    Republiki Ludowej i Egiptu przez przywóz niektórych materiałów z włókna
    szklanego tkanych lub zszywanych wysyłanych z Maroka, zgłoszonych lub niezgłoszonych
    jako pochodzące z Maroka, oraz poddanie tego przywozu obowiązkowej rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/864 da Comissão de 28 de maio de 2021
    que inicia um inquérito sobre a eventual evasão às medidas anti-dumping instituídas
    pelo Regulamento de Execução (UE) 2020/492 sobre as importações de determinados
    têxteis tecidos e/ou agulhados em fibra de vidro originários da República Popular
    da China e do Egito através de importações de determinados têxteis tecidos
    e/ou agulhados em fibra de vidro expedidos de Marrocos, independentemente de serem
    ou não declarados originários de Marrocos, e que torna obrigatório o registo
    dessas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/864 al Comisiei din 28 mai
    2021 de deschidere a unei anchete privind o eventuală circumvenție a măsurilor
    antidumping instituite prin Regulamentul de punere în aplicare (UE) 2020/492
    asupra importurilor de anumite materiale țesute și/sau cusute din fibre de sticlă
    originare din Republica Populară Chineză și din Egipt prin importuri de anumite
    materiale țesute și/sau cusute din fibre de sticlă expediate din Maroc, indiferent
    dacă au fost sau nu declarate ca fiind originare din Maroc, și de supunere a
    acestor importuri la înregistrare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/864 z 28. mája 2021, ktorým
    sa začína prešetrovanie týkajúce sa možného obchádzania antidumpingových
    opatrení uložených vykonávacím nariadením (EÚ) 2020/492 na dovoz určitých
    tkaných a/alebo stehovaných textílií zo sklenených vlákien s pôvodom v
    Čínskej ľudovej republike a Egypte dovozom určitých tkaných a/alebo stehovaných
    textílií zo sklenených vlákien odosielaných z Maroka bez ohľadu na to, či
    majú alebo nemajú deklarovaný pôvod v Maroku, a ktorým sa zavádza registrácia
    takéhoto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/864 z dne 28. maja 2021 o začetku
    preiskave glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno
    uredbo (EU) 2020/492 na uvoz nekaterih tkanih in/ali šivanih tkanin iz steklenih
    vlaken s poreklom iz Ljudske republike Kitajske in Egipta, z uvozom nekaterih
    tkanih in/ali šivanih tkanin iz steklenih vlaken, poslanih Maroka, ne glede na
    to, ali so deklarirane kot izdelek s poreklom iz Maroka ali ne, ter o registraciji
    takega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/864 de la Comisión de 28 de mayo de
    2021 por el que se abre una investigación relativa a la posible elusión de las
    medidas antidumping que impuso el Reglamento de Ejecución (UE) 2020/492 a las
    importaciones de determinados tejidos de fibra de vidrio de punto y/o cosidos
    originarios de la República Popular China y de Egipto mediante las importaciones
    de determinados tejidos de fibra de vidrio de punto y/o cosidos procedentes de
    Marruecos, hayan sido o no declarados originarios de este último país, y por
    el que se someten dichas importaciones a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/864 av den 28 maj 2021
    om inledande av en undersökning beträffande eventuellt kringgående av de antidumpningsåtgärder
    som infördes genom genomförandeförordning (EU) 2020/492 beträffande import
    av vissa vävda och/eller sydda glasfibermaterial med ursprung i Folkrepubliken
    Kina och Egypten och som avsänts från Marocko, oavsett om produktens deklarerade
    ursprung är Marocko eller inte, och om registrering av sådan import
  type: main
