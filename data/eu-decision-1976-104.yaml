  content: Commission Decision of 18 December 1975 on the granting by the Guidance
    Section of the EAGGF to the United Kingdom of a payment on account in respect
    of expenditure incurred during 1974 on aids and premiums relating to the modernization
    of farms
  type: main
- language: fr
  script: Latn
  content: '76/104/CEE: Décision de la Commission, du 18 décembre 1975, relative
    au versement par le FEOGA, section orientation, au Royaume-Uni d''un acompte sur
    les dépenses effectuées pendant l''année 1974 pour les aides et primes relatives
    à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Dezember 1975 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahre 1974 zur Modernisierung
    landwirtschaftlicher Betriebe an Beihilfen und Prämien getätigten Ausgaben an
    das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. december 1975 om udbetaling gennem EUGFL,
    udviklingssektionen, til Det forenede Kongerige af et acontobeløb for de udgifter,
