id: EURegulation25891973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2589/73 of the Commission of 24 September 1973 re-establishing
    Common Customs Tariff duties on knives, falling within heading No 82.09, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2589/73 de la Commission, du 24 septembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux couteaux, de la position tarifaire 82.09, originaires des pays en voie de
    développement bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2589/73 der Kommission vom 24. September 1973 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Messer der Tarifnummer
    82.09 mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2589/73 af 24. september 1973 om genidførelse
    af told ifølge den fælles toldtarif for knive, under position 82.09, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2589/73 della Commissione, del 24 settembre 1973,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    ai coltelli della voce doganale n. 82.09, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2762/72
    del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2589/73 van de Commissie van 24 september 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor messen (andere dan die bedoeld bij post 82.06), ook indien getand, zaksnoeimessen
    daaronder begrepen, van post 82.09, van oorsprong uit de ontwikkelingslanden ten
    behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 tariefpreferenties werden geopend
  type: main
