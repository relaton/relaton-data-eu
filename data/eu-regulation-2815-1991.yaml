title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2815/91 of 25 September 1991 re-establishing
    the levying of customs duties on products falling within CN code 3923 21 00, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2815/91 DE LA COMMISSION du 25 septembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3923 21 00, originaires de la Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2815/91 DER KOMMISSION vom 25. September 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 3923 21
    00 mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2815/91 af 25. september 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3923 21 00 og med oprindelse
    i Thailand, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2815/91 της Επιτροπής
    της 25ης Σεπτεμβρίου 1991 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για τα προϊόντα
    του κωδικού ΣΟ 3923 21 00, καταγωγής Ταϊλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2815/91 DELLA COMMISSIONE del 25 settembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 3923 21 00 originari della Tailandia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2815/91 VAN DE COMMISSIE van 25 september 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3923 21 00, van oorsprong uit Thailand, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2815/91 DA COMISSÃO de 25 de Setembro de 1991 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos produtos do código
    NC 3923 21 00, originários da Tailândia, beneficiários das preferências pautais
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 2815/91 DE LA COMISIÓN de 25 de septiembre de 1991
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a los productos del código NC 3923 21 00, originarios de Tailandia, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) nº 3831/90
    del Consejo #'
