title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1536/79 of 23 July 1979 re-establishing
    levying of customs duties on tarpaulins, sails, awnings, sunblinds, tents and
    camping goods, falling within heading No 62.04 and originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1536/79 de la Commission, du 23 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations, stores d' extérieur, tentes et articles de campement,
    de la position 62.04 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1536/79 der Kommission vom 23. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Planen, Segel, Markisen, Zelte und Zeltlagerausrüstungen
    der Tarifnummer 62.04, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1536/79 af 23. juli 1979 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl, markiser, telte og lejrudstyr,
    under position 62.04, som har oprindelse i Sydkorea, og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1536/79 della Commissione, del 23 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai copertoni, vele per
    imbarcazioni, tende per l' esterno, tende ed oggetti per campeggio, della voce
    62.04 della tariffa doganale comune, originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1536/79 van de Commissie van 23 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op dekkleden,
    scheepszeilen, zonneschermen voor winkelpuien en dergelijke, tenten en kampeerartikelen,
    van post 62.04, van oorsprong uit Zuid-Korea waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 1195/79 van de Raad
  type: main
