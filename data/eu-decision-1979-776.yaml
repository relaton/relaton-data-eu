title:
- language: en
  script: Latn
  content: '79/776/EEC: Commission Decision of 28 August 1979 on the reimbursement
    by the Guidance Section of the EAGGF to Ireland of expenditure incurred during
    1978 in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/776/CEE: Décision de la Commission, du 28 août 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à l''Irlande des dépenses effectuées pendant l''année
    1978 dans le cadre d''une action de la Communauté en vue de l''éradication de
    la brucellose, de la tuberculose et de la leucose des bovins (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/776/EWG: Entscheidung der Kommission vom 28. August 1979 über die
    Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an Irland (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/776/EØF: Kommissionens beslutning af 28. august 1979 om refusion gennem
    EUGFL, udviklingssektionen, til Irland af udgifter afholdt i 1978 i forbindelse
    med en fællesskabsaktion med henblik på udryddelse af brucellose, tuberkulose
    og leukose hos kvæg (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/776/CEE: Decisione della Commissione, del 28 agosto 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese
    effettuate nell''anno 1978 nel quadro di un''azione della Comunità per l''eradicazione
    della brucellosi, della tubercolosi e della leucosi dei bovini (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/776/EEG: Beschikking van de Commissie van 28 augustus 1979 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, aan Ierland van de in 1978
    gedane uitgaven in het kader van een gemeenschappelijke actie voor de uitroeiing
    van brucellose, tuberculose en leukose bij runderen (Slechts de tekst in de Engelse
    taal is authentiek)'
