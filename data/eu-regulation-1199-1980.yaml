id: EURegulation11991980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1199/80 of 12 May 1980 re-establishing the
    levying of customs duties on tube and pipes and blanks therefor, of copper; hollow
    bars of copper, falling within heading No 74.07 and originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1199/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    74.07 du tarif douanier commun, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1199/80 der Kommission vom 12. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1199/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under pos. 74.07, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1199/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi (compresi i loro
    sbozzi) e barre forate, di rame, della voce 74.07 della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1199/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor buizen en pijpen (ook
    indien niet afgewerkt) en holle staven, van koper, van post 74.07, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79
    van de Raad tariefpreferenties werden geopend
  type: main
