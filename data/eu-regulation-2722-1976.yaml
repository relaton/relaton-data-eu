title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2722/76 of 25 October 1976 on the tariff treatment
    applicable within the Community as originally constituted to certain products
    imported from the new Member States for use in the construction, maintenance and
    repair of certain aircraft
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2722/76 du Conseil, du 25 octobre 1976, relatif au
    traitement tarifaire applicable dans la Communauté dans sa composition originaire
    à certains produits importés des nouveaux États membres en vue d'être utilisés
    pour la construction, l'entretien et la réparation de certains aérodynes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2722/76 des Rates vom 25. Oktober 1976 über die zolltarifliche
    Behandlung bestimmter, aus den neuen Mitgliedstaaten eingeführter Erzeugnisse,
    die in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung beim Bau, bei
    der Instandhaltung oder Instandsetzung bestimmter Luftfahrzeuge verwendet werden
    sollen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2722/76 af 25. oktober 1976 om toldmæssig
    behandling gældende i Fællesskabet i dettes oprindelige udstrækning af visse
    varer, der indføres fra de nye medlemsstater, og som er beregnet til brug ved
    bygning, vedligeholdelse og reparation af visse flyvemaskiner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2722/76 del Consiglio, del 25 ottobre 1976, relativo
    al trattamento tariffario applicabile nella Comunità nella sua composizione originaria
    a taluni prodotti importati dai nuovi Stati membri e destinati ad essere utilizzati
    per la costruzione, la manutenzione o la riparazione di alcune aerodine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2722/76 van de Raad van 25 oktober 1976 inzake de
    toepassing van het tarief binnen de Gemeenschap in haar oorspronkelijke samenstelling
    op bepaalde produkten welke uit de nieuwe Lid-Staten worden ingevoerd en bestemd
    zijn om te worden gebruikt voor de bouw, het onderhoud of de reparatie van bepaalde
    vliegtoestellen
  type: main
