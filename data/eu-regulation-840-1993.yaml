title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 840/93 of 7 April 1993 amending the time
    limit laid down for the submission of contracts for the support distillation of
    table wine opened by Regulation (EEC) No 130/93 for the 1992/93 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 840/93 de la Commission, du 7 avril 1993, portant
    dérogation pour le délai prévu pour la présentation des contrats de la distillation
    de soutien pour le vin de table ouverte par le règlement (CEE) n° 130/93 pour
    la campagne 1992/1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 840/93 der Kommission vom 7. April 1993 zur Abweichung
    von der Frist für die Vorlage der Verträge bezüglich der mit der Verordnung
    (EWG) Nr. 130/93 für das Wirtschaftsjahr 1992/93 zur Stützung des Tafelweinmarktes
    eröffneten Destillation
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 840/93 af 7. april 1993 om undtagelse
    fra fristen for indgivelse af kontrakter om den støttedestillation af bordvin,
    der er iværksat ved forordning (EØF) nr. 130/93 for produktionsåret 1992/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 840/93 της Επιτροπής
    της 7ης Απριλίου 1993 για παρέκκλιση από την προθεσμία
    που προβλέπεται για την υποβολή των συμβάσεων
    αποστάξεως στηρίξεως για τους επιτραπέζιους
    οίνους που προκηρύχθηκε από τον κανονισμό
    (ΕΟΚ) αριθ. 130/93 για την περίοδο 1992/93
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 840/93 della Commissione, del 7 aprile 1993, recante
    deroga al termine previsto per la presentazione dei contratti relativi alla distillazione
    di sostegno per i vino da tavola indetta dal regolamento (CEE) n. 130/93 per la
    campagna 1992-93
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 840/93 van de Commissie van 7 april 1993 tot vaststelling
    van afwijkende bepalingen inzake de termijn voor de indiening van de contracten
    voor de marktondersteuningsdistillatie van tafelwijn die bij Verordening (EEG)
    nr. 130/93 is geopend voor het wijnoogstjaar 1992/1993
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 840/93 da Comissão, de 7 de Abril de 1993, que estabelece
    uma derrogação do prazo previsto para a apresentação dos contratos da destilação
    de apoio relativa ao vinho de mesa aberta pelo Regulamento (CEE) n° 130/93 para
    a campanha de 1992/1993
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 840/93 de la Comisión, de 7 de abril de 1993, por
    el que se establece una excepción en lo relativo al plazo previsto para la presentación
    de los contratos correspondientes a la destilación de apoyo de vinos de mesa
    abierta por el Reglamento (CEE) n° 130/93 para la campaña 1992/93
  type: main
