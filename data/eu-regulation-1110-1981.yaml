title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1110/81 of 28 April 1981 reintroducing the
    levying of the customs duties applicable to watch cases and parts of watch cases
    falling under heading No 91.09, originating in Hong Kong and benefiting from the
    tariff preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1110/81 de la Commission, du 28 avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux boîtes
    de montres du n° 91.01 et leurs parties, de la position 91.09 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1110/81 der Kommission vom 28. April 1981 zur Wiedereinführung
    der Erhebung der Zölle für Gehäuse für Uhren der Tarifnummer 91.01 und Teile
    davon der Tarifnummer 91.09, mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1110/81 af 28. april 1981 om genindførelse
    af opkrævning af told for kasser til de i pos. 91.01 omhandlede ure samt dele
    dertil, henhørende under pos. 91.09 og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1110/81 τής Επιτροπής
    τής 28ης Απριλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά κελύφη ωρολογίων
    καί μερών αυτών τής δασμολογικής κλάσεως 91.
    09 καταγωγής Χόνγκ Κόνγκ, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1110/81 della Commissione, del 28 aprile 1981, che
    ripristina la riscossione dei dazi doganali applicabili alle casse per orologi
    della voce n. 91.01 e loro parti, della voce 91.09 della tariffa doganale comune,
    originari di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1110/81 van de Commissie van 28 april 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kasten voor
    horloges bedoeld bij post 91.01, alsmede delen daarvan, van tariefpost 91.09,
    van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3322/80 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
