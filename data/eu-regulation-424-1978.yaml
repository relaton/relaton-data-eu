title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 424/78 of 28 February 1978 re-establishing
    the levying of customs duties on gloves, mittens, mitts, stockings, socks and
    sockettes, not being knitted or crocheted goods, falling within heading No 61.10
    and originating in developing countries to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 424/78 de la Commission, du 28 février 1978, portant
    rétablissement de la perception des droits de douane applicables à la ganterie,
    bas, chaussettes et socquettes, autres qu'en bonneterie, de la position tarifaire
    61.10, originaires des pays et territoires en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 424/78 der Kommission vom 28. Februar 1978 zur Wiedereinführung
    des Zollsatzes für Handschuhe, Strümpfe, Socken und Söckchen, nicht gewirkt,
    der Tarifnummer 61.10, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 424/78 af 28. februar 1978 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter, luffer, strømper og sokker,
    ikke af trikotage, under position 61.01, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 424/78 della Commissione, del 28 febbraio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, calze e calzini,
    esclusi quelli a maglia, della voce 61.10 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 424/78 van de Commissie van 28 februari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke, kousen en sokken, andere dan die van brei- of haakwerk,
    van post 61.10, van oorsprong uit de ontwikkelingslanden en -gebieden, ten behoeve
    waarvan bij Verordening (EEG) nr. 2706/77 van de Raad tariefpreferenties werden
    geopend
  type: main
