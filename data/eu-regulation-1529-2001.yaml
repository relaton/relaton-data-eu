title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1529/2001 of 26 July 2001 determining the
    extent to which applications for import licences submitted in July 2001 for certain
    products in the milk and milk products sector under the schemes provided for in
    the Europe Agreements between the Community and the Republic of Hungary, the Republic
    of Poland, the Czech Republic, the Slovak Republic, Bulgaria, Romania and Slovenia
    and in the Agreements on free trade between the Community and the Baltic States
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1529/2001 de la Commission du 26 juillet 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2001 pour certains produits dans le secteur du lait et des produits
    laitiers dans le cadre des régimes prévus par les accords européens entre la
    Communauté et la République de Hongrie, la République de Pologne, la République
    tchèque, la République slovaque, la Bulgarie, la Roumanie et la Slovénie et
    du régime prévu par les accords sur la libéralisation des échanges entre la
    Communauté et les pays baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1529/2001 der Kommission vom 26. Juli 2001 über den
    Umfang, in dem den Anträgen auf Einfuhrlizenzen für bestimmte Milch- und Milcherzeugnisse
    stattgegeben werden kann, die im Juli 2001 im Rahmen der Regelungen gemäß den
    Europa-Abkommen zwischen der Gemeinschaft und der Republik Ungarn, der Republik
    Polen, der Tschechischen Republik, der Slowakischen Republik, Bulgarien, Rumänien
    und Slowenien und der Regelung gemäß dem Freihandelsabkommen zwischen der Gemeinschaft
    und den baltischen Staaten eingereicht wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1529/2001 af 26. juli 2001 om fastsættelse
    af, i hvilket omfang de ansøgninger, der i juli 2001 er indgivet om importlicens
    for visse produkter i sektoren for mælk og mejeriprodukter i henhold til ordningerne
    i Europaaftalerne mellem Fællesskabet og Republikken Ungarn, Republikken Polen,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien, Rumænien
    og Republikken Slovenien og ordningen i aftalerne om liberalisering af samhandelen
    mellem Fællesskabet og de baltiske lande, kan accepteres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1529/2001 της Επιτροπής,
    της 26ης Ιουλίου 2001, για τον προσδιορισμό του
    μέτρου κατά το οποίο μπορούν να γίνονται δεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υπεβλήθησαν
    τον Ιούλιο του 2001 για ορισμένα προϊόντα στον
    τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων στο πλαίσιο των καθεστώτων που προβλέπονται
    από τις ευρωπαϊκές συμφωνίες μεταξύ της Κοινότητας
    και της Δημοκρατίας της Ουγγαρίας, της Δημοκρατίας
    της Πολωνίας, της Τσεχικής Δημοκρατίας, της
    Σλοβακικής Δημοκρατίας, της Βουλγαρίας, της
    Ρουμανίας, της Σλοβενίας και του καθεστώτος
    που προβλέπεται από τις συμφωνίες ελευθέρωσης
    των συναλλαγών μεταξύ της Κοινότητας και των
    βαλτικών χωρών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1529/2001, annettu 26 päivänä heinäkuuta
    2001, yhteisön sekä Unkarin tasavallan, Puolan tasavallan, Tšekin tasavallan,
    Slovakian tasavallan, Bulgarian, Romanian ja Slovenian tasavallan välisissä
    Eurooppa-sopimuksissa sekä yhteisön ja Baltian maiden välisissä vapaakauppaa
    koskevissa sopimuksissa määrätyn järjestelmän mukaisesti tietyistä maito-
    ja maitotuotealan tuotteista vuoden 2001 heinäkuussa jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1529/2001 della Commissione, del 26 luglio 2001, che
    stabilisce la misura in cui possono essere accettate le domande di titoli d'importazione
    presentate nel luglio 2001 per taluni prodotti del settore del latte e del settore
    lattiero-caseario nel quadro dei regimi previsti dagli accordi europei tra la
    Comunità e la Repubblica d'Ungheria, la Repubblica di Polonia, la Repubblica
    ceca, la Repubblica slovacca, la Bulgaria, la Romania e la Slovenia e del regime
    previsto dagli accordi sul libero scambio tra la Comunità e i paesi baltici
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1529/2001 van de Commissie van 26 juli 2001 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector melk en zuivelproducten, die in juli 2001
    worden ingediend op grond van de regelingen waarin is voorzien bĳ de Europaovereenkomsten
    tussen, enerzĳds, de Gemeenschap en, anderzĳds, de Republiek Hongarĳe, de Republiek
    Polen, de Tsjechische Republiek, de Slowaakse Republiek, Bulgarĳe, Roemenië
    en Slovenië en van de regeling waarin is voorzien bĳ de overeenkomsten betreffende
    vrĳhandel en met handel verband houdende zaken tussen de Gemeenschap en de Baltische
    staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1529/2001 da Comissão, de 26 de Julho de 2001, que
    determina a medida em que podem ser aceites os pedidos de certificados de importação
    introduzidos em Julho de 2001 para determinados produtos do sector de leite e
    dos produtos lácteos no âmbito dos regimes previstos nos acordos europeus entre
    a Comunidade e a República da Hungria, a República da Polónia, a República
    Checa, a República Eslovaca, a Bulgária, a Roménia e a Eslovénia e do regime
    previsto nos acordos sobre comércio livre entre a Comunidade e os países bálticos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1529/2001 de la Comisión, de 26 de julio de 2001,
    por el que se determina en qué medida podrán aceptarse las solicitudes de certificados
    de importación presentadas en julio de 2001 relativas a determinados productos
    del sector de la leche y de los productos lácteos en el ámbito de los regímenes
    previstos en los Acuerdos europeos entre la Comunidad y la República de Hungría,
    la República de Polonia, la República Checa, la República Eslovaca, Bulgaria,
    Rumania y Eslovenia, y del régimen previsto en los Acuerdos de libre comercio
    entre la Comunidad y los países bálticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1529/2001 av den 26 juli 2001 om fastställande
    av i vilken utsträckning ansökningar om importlicenser får godkännas som inlämnas
    i juli 2001 för vissa produkter inom sektorn för mjölk och mjölkprodukter
    inom ramen för ordningarna i Europaavtalen mellan gemenskapen och Ungern, Polen,
    Tjeckiska republiken, Slovakien, Bulgarien, Rumänien och Slovenien, ordningen
    i frihandelsavtalen mellan gemenskapen och de baltiska länderna
