title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 179/93 of 29 January 1993 specifying the
    extent to which applications lodged in January 1993 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 179/93 de la Commission, du 29 janvier 1993, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de janvier 1993 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 179/93 der Kommission vom 29. Januar 1993 über das
    Ausmaß, in dem den im Januar 1993 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 179/93 af 29. januar 1993 om fastsættelse
    af, i hvilket omfang ansøgninger om udstedelse af importlicenser, som er indsendt
    i januar 1993 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 179/93 της Επιτροπής
    της 29ης Ιανουαρίου 1993 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1992 για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 179/93 della Commissione, del 29 gennaio 1993, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di gennaio 1993 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 179/93 van de Commissie van 29 januari 1993 tot bepaling
    van de mate waarin de in januari 1993 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 179/93 da Comissão, de 29 de Janeiro de 1993, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Janeiro de 1993 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 179/93 de la Comisión, de 29 de enero de 1993, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de enro de 1993, para los machos
    jóvenes de la especie bovina destinados al engorde
  type: main
