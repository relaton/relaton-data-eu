title:
- language: en
  script: Latn
  content: '86/141/EEC: Commission Decision of 20 March 1986 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of isolated bark of conifers originating in California (USA)
    (Only the Danish, German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/141/CEE: Décision de la Commission du 20 mars 1986 autorisant certains
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne l''écorce isolée de conifères originaire
    de Californie (États-Unis) (Les textes en langues danoise, allemande, française
    et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '86/141/EWG: Entscheidung der Kommission vom 20. März 1986 zur Ermächtigung
    bestimmter Mitgliedstaaten, für lose Rinde von Koniferen mit Ursprung in Kalifornien
    (Vereinigte Staaten von Amerika) Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates vorzusehen (Nur der dänische, deutsche, französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/141/EØF: Kommissionens beslutning af 20. marts 1986 om bemyndigelse
    af visse medlemsstater til at undtage løs bark af nåletræer med oprindelse
    i Californien (USA) fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun
    den danske, tyske, franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '86/141/ΕΟΚ: Απόφαση της Επιτροπής της 20ής
