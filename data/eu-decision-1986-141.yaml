  script: Latn
  content: '86/141/CEE: Decisione della Commissione del 20 marzo 1986 che autorizza
    gli stati membri a prevedere deroghe a talune disposizioni della direttiva 77/93/CEE
    del Consiglio per quanto riguarda la corteccia separata dal tronco di conifere
    originarie della California (USA) (Il testi in lingua danese, tedesca, francese
    e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '86/141/EEG: Beschikking van de Commissie van 20 maart 1986 waarbij sommige
