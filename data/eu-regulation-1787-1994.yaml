    ορισμένα άλλα γεωργικά προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1787/94 della Commissione, del 20 luglio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1994 per taluni prodotti del settore del pollame
    nel quadro del regime previsto dal regolamento (CE) n. 774/94 del Consiglio recante
    apertura e modalità di gestione di alcuni contingenti tariffari comunitari di
    pollame e di taluni altri prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1787/94 van de Commissie van 20 juli 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector slachtpluimvee, die in juli 1994 worden ingediend
    op grond van de regeling waarin is voorzien bij Verordening (EG) nr. 774/94 van
