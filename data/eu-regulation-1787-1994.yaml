title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1787/94 of 20 July 1994 determining the extent
    to which applications lodged in July 1994 for import licences for certain poultrymeat
    products under the regime provided for in Council Regulation (EC) No 774/94 opening
    and providing for the administration of certain Community tariff quotas for poultrymeat
    and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1787/94 de la Commission, du 20 juillet 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1994 pour certains produits à base de viande de volaille peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande de volaille et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1787/94 der Kommission vom 20. Juli 1994 über die
    Festsetzung des Umfangs, in dem die im Juli 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Geflügelfleischerzeugnisse entsprechend der Regelung der Verordnung
    (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher Zollkontingente
    für Geflügelfleisch und andere landwirtschaftliche Erzeugnisse genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1787/94 af 20. juli 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1994 om importlicenser for visse fjerkræsprodukter som kun accepteres i forbindelse
    med den ordning, der er fastsat i Rådets forordning (EF) nr. 774/94 om åbning
    og forvaltning af en række EF-toldkontingenter for fjerkrækød og andre landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1787/94 της Επιτροπής
    της 20ής Ιουλίου 1994 περί καθορισμού ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές αιτήσεις
    που υποβλήθηκαν τον Ιούλιο του 1994 για άδειες
    εισαγωγής κρέατος πουλερικών βάσει του καθεστώτος
    που προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
