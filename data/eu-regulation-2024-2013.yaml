    2024 relatif à des mesures destinées à prévenir l’établissement et la propagation
    de Pomacea (Perry) sur le territoire de l’Union et à l’éradiquer, abrogeant
    la décision d’exécution 2012/697/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2013 der Kommission vom 23. Juli 2024
