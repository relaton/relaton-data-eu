title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2013 of 23 July 2024 on measures
    to prevent the establishment and spread within the Union territory and to eradicate
    Pomacea (Perry) and repealing Implementing Decision 2012/697/EU
  type: main
- language: fr
  script: Latn
