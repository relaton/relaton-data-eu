id: EUDirective1990619
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 90/619/EEC of 8 November 1990 on the coordination of
    laws, regulations and administrative provisions relating to direct life assurance,
    laying down provisions to facilitate the effective exercise of freedom to provide
    services and amending Directive 79/267/EEC
  type: main
- language: fr
  script: Latn
  content: Deuxième directive 90/619/CEE du Conseil, du 8 novembre 1990, portant
    coordination des dispositions législatives, réglementaires et administratives
    concernant l'assurance directe sur la vie, fixant les dispositions destinées
    à faciliter l'exercice effectif de la libre prestation de services et modifiant
    la directive 79/267/CEE
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 90/619/EWG des Rates vom 8. November 1990 zur Koordinierung
    der Rechts- und Verwaltungsvorschriften für die Direktversicherung (Lebensversicherung)
    und zur Erleichterung der tatsächlichen Ausübung des freien Dienstleistungsverkehrs
    sowie zur Änderung der Richtlinie 79/267/EWG
  type: main
- language: da
  script: Latn
  content: Rådets andet direktiv 90/619/EØF af 8. november 1990 om samordning af
    love og administrative bestemmelser vedrørende direkte livsforsikringsvirksomhed,
    om fastsættelse af bestemmelser, der kan lette den faktiske gennemførelse af
    den fri udveksling af tjenesteydelser, og om ændring af direktiv 79/267/EØF
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 90/619/ΕΟΚ του Συμβουλίου της
    8ης Νοεμβρίου 1990 για το συντονισμό των νομοθετικών,
    κανονιστικών και διοικητικών διατάξεων σχετικά
    με την πρωτασφάλιση ζωής και τη θέσπιση διατάξεων
    που σκοπό έχουν να διευκολύνουν την πραγματική
    άσκηση της ελεύθερης παροχής των υπηρεσιών
    καθώς και για την τροποποίηση της οδηγίας 79/267/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: TOINEN Neuvoston direktiivi 90/619/ETY, annettu 8 päivänä marraskuuta
    1990, henkivakuutuksen ensivakuutusliikettä koskevien lakien, asetusten ja hallinnollisten
    määräysten yhteensovittamisesta, säännöksistä, joilla helpotetaan palvelujen
    tarjoamisen vapauden tehokasta käyttämistä, sekä direktiivin 79/267/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 90/619/CEE del Consiglio, dell'8 novembre 1990, che coordina
    le disposizioni legislative, regolamentari e amministrative riguardanti l'assicurazione
    diretta sulla vita, fissa le disposizioni destinate a facilitare l'esercizio effettivo
    della libera prestazione di servizi e modifica la direttiva 79/267/CEE
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 90/619/EEG van de Raad van 8 november 1990 tot coördinatie
    van de wettelijke en bestuursrechtelijke bepalingen betreffende het directe levensverzekeringsbedrijf,
    tot vaststelling van de bepalingen ter bevordering van de daadwerkelijke uitoefening
    van het vrij verrichten van diensten en houdende wijziging van Richtlijn 79/267/EEG
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 90/619/CEE do Conselho, de 8 de Novembro de 1990, relativa
    à coordenação das disposições legislativas, regulamentares e administrativas
    respeitantes ao seguro directo de vida, que fixa as disposições destinadas a
    facilitar o exercício efectivo da livre prestação de serviços e altera a Directiva
    79/267/CEE
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 90/619/CEE del Consejo, de 8 de noviembre de 1990, sobre
    la coordinación de las disposiciones legales, reglamentarias y administrativas
    relativas al seguro directo de vida, por la que se establecen las disposiciones
    destinadas a facilitar el ejercicio efectivo de la libre prestación de servicios
    y por la que se modifica la Directiva 79/267/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/619/EEG av den 8 november 1990 om samordning av lagar
    och andra författningar om direkt livförsäkring, och med bestämmelser avsedda
    att göra det lättare att effektivt utnyttja friheten att tillhandahålla tjänster,
    och om ändring av direktiv 79/267/EEG
  type: main
