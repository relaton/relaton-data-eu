  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2057/97 av den 20 oktober 1997 om fastställande
    av i vilken utsträckning det är möjligt att godkänna ansökningar, som har
    lämnats in i oktober 1997, om importlicenser för vissa mjölkprodukter och produkter
