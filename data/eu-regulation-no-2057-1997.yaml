title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2057/97 of 20 October 1997 determining the
    extent to which applications lodged in October 1997 for certain milk and milk
    products covered by the arrangements provided for in the free-trade Agreements
    concluded by the Community with the Republic of Estonia, the Republic of Latvia
    and the Republic of Lithuania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2057/97 DE LA COMMISSION du 20 octobre 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1997 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords sur la libéralisation des échanges
    conclus par la Communauté avec les pays baltes peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2057/97 DER KOMMISSION vom 20. Oktober 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Oktober 1997
    für die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    einerseits und den Republiken Estland, Lettland und Litauen andererseits geschlossenen
    Abkommen über Freihandel und Handelsfragen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2057/97 af 20. oktober 1997 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i oktober 1997 for
    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i frihandelsaftalerne mellem Fællesskabet og Republikken
    Estland, Republikken Letland og Republikken Litauen
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2057/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 20ής Οκτωβρίου 1997 για τον καθορισμό των
    ποσοστών αποδοχής των αιτήσεων για άδειες
    εισαγωγής που υποβάλλονται τον Οκτώβριο 1997,
    για ορισμένα προϊόντα στον τομέα του γάλακτος
    και των γαλακτοκομικών προϊόντων στα πλαίσια
    του καθεστώτος που προβλέπεται από τις συμφωνίες
    απελευθέρωσης των συναλλαγών που έχει συνάψει
    η Κοινότητα με τη Δημοκρατία της Εσθονίας,
    τη Δημοκρατία της Λεττονίας και τη Δημοκρατία
    της Λιθουανίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2057/97, annettu 20 päivänä lokakuuta 1997,
    yhteisön sekä Viron tasavallan, Latvian tasavallan ja Liettuan tasavallan kanssa
    tehdyissä vapaakauppasopimuksissa määrätyn järjestelmän mukaisesti lokakuussa
    1997 esitettyjen tiettyjen maito- ja maitotuotealan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2057/97 DELLA COMMISSIONE del 20 ottobre 1997 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli di importazione
    presentate nel mese di ottobre 1997 per taluni prodotti del settore lattiero-caseario
    nel quadro del regime previsto dagli accordi di liberalizzazione degli scambi
    conclusi tra la Comunità e la Repubblica estone, la Repubblica lettone e la Repubblica
    lituana
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2057/97 VAN DE COMMISSIE van 20 oktober 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de invoercertificaataanvragen
    voor bepaalde producten in de sector melk en zuivelproducten, die in oktober 1997
    zijn ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten overeenkomsten betreffende vrijhandel met de Republiek Estland, de Republiek
    Letland en de Republiek Litouwen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2057/97 DA COMISSÃO de 20 de Outubro de 1997 que
    determina a medida em que podem ser aceites os pedidos de licença de importação,
    apresentados em Outubro de 1997, para determinados produtos do sector do leite
    e dos produtos lácteos, no âmbito do regime previsto nos acordos de comércio
    livre concluídos pela Comunidade com os países bálticos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2057/97 DE LA COMISIÓN de 20 de octubre de 1997 por
