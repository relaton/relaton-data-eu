id: EURegulation20221288
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1288 of 6 April 2022 supplementing
    Regulation (EU) 2019/2088 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the details of the content and presentation
    of the information in relation to the principle of ‘do no significant harm’,
    specifying the content, methodologies and presentation of information in relation
    to sustainability indicators and adverse sustainability impacts, and the content
    and presentation of the information in relation to the promotion of environmental
    or social characteristics and sustainable investment objectives in pre-contractual
    documents, on websites and in periodic reports
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1288 de la Commission du 6 avril 2022 complétant
    le règlement (UE) 2019/2088 du Parlement européen et du Conseil par des normes
    techniques de réglementation détaillant le contenu et la présentation des informations
    relatives au principe consistant à «ne pas causer de préjudice important»
    et précisant le contenu, les méthodes et la présentation pour les informations
    relatives aux indicateurs de durabilité et aux incidences négatives en matière
    de durabilité ainsi que le contenu et la présentation des informations relatives
    à la promotion de caractéristiques environnementales ou sociales et d’objectifs
    d’investissement durable dans les documents précontractuels, sur les sites
    internet et dans les rapports périodiques
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1288 der Kommission vom 6. April 2022 zur
    Ergänzung der Verordnung (EU) 2019/2088 des Europäischen Parlaments und des
    Rates im Hinblick auf technische Regulierungsstandards zur Festlegung der Einzelheiten
    des Inhalts und der Darstellung von Informationen in Zusammenhang mit dem Grundsatz
    der Vermeidung erheblicher Beeinträchtigungen, des Inhalts, der Methoden und
    der Darstellung von Informationen in Zusammenhang mit Nachhaltigkeitsindikatoren
    und nachteiligen Nachhaltigkeitsauswirkungen sowie des Inhalts und der Darstellung
    von Informationen in Zusammenhang mit der Bewerbung ökologischer oder sozialer
    Merkmale und nachhaltiger Investitionsziele in vorvertraglichen Dokumenten, auf
    Internetseiten und in regelmäßigen Berichten
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1288 на Комисията
    от 6 април 2022 година за допълнение на Регламент
    (ЕС) 2019/2088 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти,
    с които се определят подробно съдържанието
    и начинът на представяне на информацията във
    връзка с принципа за ненанасяне на значителни
    вреди и се определят съдържанието, методиките
    и представянето на информация във връзка с
    показателите за устойчивост и неблагоприятните
    въздействия върху устойчивостта, както и съдържанието
    и представянето на информация във връзка с
    рекламирането на екологични или социални характеристики
    и целите за устойчиви инвестиции в преддоговорни
    документи, уебсайтове и периодични доклади
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1288 ze dne 6. dubna
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2019/2088,
    pokud jde o regulační technické normy, které upřesňují podrobnosti týkající
    se obsahu a struktury informací ve vztahu k zásadě „významně nepoškozovat“
    a které upřesňují obsah, metodologie a strukturu informací ve vztahu k ukazatelům
    udržitelnosti a nepříznivým dopadům na udržitelnost a obsah a strukturu
    informací ve vztahu k prosazování environmentálních nebo sociálních vlastností
    a cílů udržitelných investic v dokumentech před uzavřením smlouvy, na webových
    stránkách a v pravidelných zprávách
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1288 af 6. april 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2019/2088,
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer indholdet
    og præsentationen af oplysninger vedrørende princippet om ikke at gøre væsentlig
    skade, der præciserer indholdet, metoderne og præsentationen af oplysninger
    vedrørende bæredygtighedsindikatorer og negative bæredygtighedsindvirkninger,
    og som præciserer indholdet og præsentationen af oplysningerne om fremme af
    miljømæssige eller sociale karakteristika og bæredygtige investeringsmål i
    dokumenter forud for aftaleindgåelse, på websteder og i periodiske rapporter
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1288
    της Επιτροπής της 6ης Απριλίου 2022 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2019/2088 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τα ρυθμιστικά
    τεχνικά πρότυπα για τον καθορισμό των λεπτομερειών
    του περιεχομένου και της παρουσίασης των πληροφοριών
    που αφορούν την αρχή της «μη πρόκλησης σημαντικής
    βλάβης», για τον καθορισμό του περιεχομένου,
    των μεθοδολογιών και της παρουσίασης των πληροφοριών
    που αφορούν τους δείκτες βιωσιμότητας και
    τις δυσμενείς επιπτώσεις στη βιωσιμότητα,
    καθώς και του περιεχομένου και της παρουσίασης
    των πληροφοριών που αφορούν την προώθηση περιβαλλοντικών
    ή κοινωνικών χαρακτηριστικών και στόχους αειφόρων
    επενδύσεων σε προσυμβατικά έγγραφα, δικτυακούς
    τόπους και περιοδικές εκθέσεις
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/1288, 6. aprill 2022, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2019/2088 seoses regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks põhimõttega „ei kahjusta
    oluliselt“ seotud teabe sisu ja esitamise üksikasjad, kestlikkuse näitajate
    ja kestlikkusele avalduva negatiivse mõjuga seotud teabe sisu, metoodika ja esitusviis
    ning keskkonnaalaste või sotsiaalsete omaduste edendamise ja kestliku investeerimise
    eesmärkidega seotud teabe sisu ja esitusviis lepingueelsetes dokumentides, veebisaitidel
    ja perioodilistes aruannetes
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/1288, annettu 6 päivänä huhtikuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2019/2088 täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään ”ei merkittävää
    haittaa” -periaatteeseen liittyvien tietojen sisällön ja esitystavan yksityiskohdat,
    kestävyysindikaattoreihin ja haitallisiin kestävyysvaikutuksiin liittyvien tietojen
    sisältö, menetelmät ja esitystapa sekä ympäristöön tai yhteiskuntaan liittyvien
    ominaisuuksien ja kestävien sijoitustavoitteiden edistämiseen liittyvien tietojen
    sisältö ja esitystapa ennen sopimuksen tekemistä annettavissa asiakirjoissa,
    verkkosivustoilla ja määräaikaiskatsauksissa
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/1288 ón gCoimisiún an 6 Aibreán 2022
    lena bhforlíontar Rialachán (AE) 2019/2088 ó Pharlaimint na hEorpa agus ón
    gComhairle maidir le caighdeáin theicniúla rialála lena sonraítear na mionsonraí
    maidir le hábhar agus cur i láthair na faisnéise i ndáil leis an bprionsabal
    “gan dochar suntasach a dhéanamh”, lena sonraítear ábhar, modheolaíochtaí
    agus cur i láthair na faisnéise i ndáil le táscairí inbhuanaitheachta agus
    drochthionchair inbhuanaitheachta, agus ábhar agus cur i láthair na faisnéise
    i ndáil le cur chun cinn saintréithe comhshaoil nó sóisialta agus cuspóirí
    infheistíochta inbhuanaithe i ndoiciméid réamhchonarthacha, ar shuíomhanna
    gréasáin agus i dtuarascálacha tréimhsiúla
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1288 оd 6. travnja 2022. o dopuni
    Uredbe (EU) 2019/2088 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se pobliže određuju sadržaj i prikaz informacija o načelu
    „ne nanosi bitnu štetu”, sadržaj, metodologije i prikaz informacija o pokazateljima
    održivosti i štetnim učincima na održivost te sadržaj i prikaz informacija
    o promicanju okolišnih ili socijalnih obilježja i ciljeva održivih ulaganja
    u predugovornoj dokumentaciji, na internetskim stranicama i u periodičnim izvještajima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1288 felhatalmazáson alapuló rendelete (2022.
    április 6.) az (EU) 2019/2088 európai parlamenti és tanácsi rendeletnek a
    jelentős károkozás elkerülését célzó elvvel kapcsolatos információk
    tartalmát és megjelenítését részletesen meghatározó, valamint a fenntarthatósági
    mutatókkal és a fenntarthatóság szempontjából káros hatásokkal kapcsolatos
    információk tartalmát, módszertanát és megjelenítését, továbbá a környezeti
    és társadalmi jellemzők és a fenntartható befektetési célkitűzések előmozdításával
    kapcsolatos, a szerződéskötés előtti dokumentumokban, a weboldalakon és
    az időszakos jelentésekben szereplő információk tartalmát és megjelenítését
    meghatározó szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1288 della Commissione del 6 aprile 2022
    che integra il regolamento (UE) 2019/2088 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i dettagli
    del contenuto e della presentazione delle informazioni relative al principio «non
    arrecare un danno significativo», che specificano il contenuto, le metodologie
    e la presentazione delle informazioni relative agli indicatori di sostenibilità
    e agli effetti negativi per la sostenibilità, nonché il contenuto e la presentazione
    delle informazioni relative alla promozione delle caratteristiche ambientali o
    sociali e degli obiettivi di investimento sostenibile nei documenti precontrattuali,
    sui siti web e nelle relazioni periodiche
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1288 (2022. gada 6. aprīlis), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) 2019/2088 papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, kuros precizē informācijas saturu
    un noformējumu saistībā ar principu “nenodari būtisku kaitējumu”, precizē
    informācijas saturu, metodoloģiju un noformējumu saistībā ar ilgtspējas
    rādītājiem un negatīvu ietekmi uz ilgtspēju, kā arī informācijas saturu
    un noformējumu saistībā ar vides vai sociālo raksturlielumu un ilgtspējīgu
    ieguldījumu mērķu veicināšanu pirmslīguma dokumentos, tīmekļa vietnēs
    un periodiskos ziņojumos
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1288 2022 m. balandžio 6
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2019/2088 papildomas
    techniniais reguliavimo standartais, kuriais patikslinamas su reikšmingos žalos
    nedarymo principu susijusios informacijos turinys ir pateikimas, patikslinamas
    su tvarumo rodikliais ir neigiamu poveikiu tvarumui susijusios informacijos turinys,
    metodika ir pateikimas ir su aplinkos ar socialinių ypatumų bei tvarių investicijų
    tikslų skatinimu susijusios informacijos turinys ir pateikimas ikisutartiniuose
    dokumentuose, interneto svetainėse ir periodinėse ataskaitose
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1288 tas-6 ta’ April 2022
    li jissupplimenta r-Regolament (UE) 2019/2088 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw id-dettalji tal-kontenut
    u l-preżentazzjoni tal-informazzjoni b’rabta mal-prinċipju ta’ “la tagħmilx
    ħsara sinifikanti”, li jispeċifikaw il-kontenut, il-metodoloġiji u l-preżentazzjoni
    tal-informazzjoni b’rabta mal-indikaturi tas-sostenibbiltà u l-impatti avversi
    fuq is-sostenibbiltà, u l-kontenut u l-preżentazzjoni tal-informazzjoni b’rabta
    mal-promozzjoni tal-karatteristiċi ambjentali jew soċjali u l-objettivi ta’
    investiment sostenibbli f’dokumenti prekuntrattwali, fuq siti web u f’rapporti
    perjodiċi
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1288 van de Commissie van 6 april 2022
    tot aanvulling van Verordening (EU) 2019/2088 van het Europees Parlement en de
    Raad met technische reguleringsnormen tot nadere bepaling van de inhoud en presentatie
    van de informatie met betrekking tot het beginsel “geen ernstige afbreuk doen”,
    en tot nadere bepaling van de inhoud, methoden en presentatie van informatie met
    betrekking tot duurzaamheidsindicatoren en ongunstige effecten op de duurzaamheid
    en van de inhoud en presentatie van de informatie met betrekking tot het promoten
    van ecologische of sociale kenmerken en doelstellingen voor duurzaamheidsbeleggingen
    in precontractuele documenten, op websites en in periodieke verslagen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1288 z dnia 6 kwietnia 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2019/2088
    w zakresie regulacyjnych standardów technicznych określających szczegóły
    dotyczące treści i sposobu prezentacji informacji w odniesieniu do zasady „nie
    czyń poważnych szkód”, określających treść, metody i sposób prezentacji
    informacji w odniesieniu do wskaźników zrównoważonego rozwoju i niekorzystnych
    skutków dla zrównoważonego rozwoju, a także określających treść i sposób
    prezentacji informacji w odniesieniu do promowania aspektów środowiskowych lub
    społecznych i celów dotyczących zrównoważonych inwestycji w dokumentach udostępnianych
    przed zawarciem umowy, na stronach internetowych i w sprawozdaniach okresowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1288 da Comissão de 6 de abril de 2022
    que complementa o Regulamento (UE) 2019/2088 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação que especificam com maior
    detalhe o conteúdo e a apresentação das informações relacionadas com o princípio
    de «não prejudicar significativamente». o teor, as metodologias e a apresentação
    das informações relacionadas com os indicadores de sustentabilidade e os impactos
    negativos para a sustentabilidade, e o teor e a apresentação das informações
    relacionadas com a promoção das características ambientais ou sociais e com
    os objetivos de investimento sustentável nos documentos pré-contratuais, nos
    sítios Web e nos relatórios periódicos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1288 al Comisiei din 6 aprilie 2022 de completare
    a Regulamentului (UE) 2019/2088 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează detaliile
    referitoare la conținutul și prezentarea informațiilor în legătură cu principiul
    de „a nu aduce prejudicii semnificative”, care precizează conținutul, metodologia
    și prezentarea informațiilor în legătură cu indicatorii de durabilitate și
    efectele negative asupra durabilității, precum și conținutul și prezentarea
    informațiilor în legătură cu promovarea caracteristicilor de mediu sau sociale
    și a obiectivelor de investiții durabile în documentele precontractuale, pe
    site-urile web și în rapoartele periodice
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1288 zo 6. apríla 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2019/2088, pokiaľ
    ide o regulačné technické predpisy, upresnením podrobností obsahu a prezentácie
    informácií v súvislosti so zásadou „výrazne nenarušiť“, upresnením
    obsahu, metodík a prezentácie informácií v súvislosti s ukazovateľmi udržateľnosti
    a nepriaznivými vplyvmi na udržateľnosť, ako aj obsahu a prezentácie informácií
    v súvislosti s presadzovaním environmentálnych alebo sociálnych vlastností
    a udržateľnými investičnými cieľmi v predzmluvných dokumentoch, na webových
    sídlach a v pravidelných správach
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1288 z dne 6. aprila 2022 o dopolnitvi
    Uredbe (EU) 2019/2088 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo vsebino in prikaz informacij o načelu, „da se ne škoduje
    bistveno“, vsebino, metodologije in prikaz informacij o kazalnikih trajnostnosti
    in škodljivih vplivih na trajnostnost ter vsebini in prikazu informacij o spodbujanju
    okoljskih ali socialnih značilnosti in ciljev trajnostnih naložb v predpogodbenih
    dokumentih, na spletnih mestih in v periodičnih poročilih
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1288 de la Comisión de 6 de abril de 2022
    por el que se completa el Reglamento (UE) 2019/2088 del Parlamento Europeo y del
    Consejo respecto a las normas técnicas de regulación que especifican los pormenores
    en materia de contenido y presentación que ha de cumplir la información relativa
    al principio de «no causar un perjuicio significativo», y especifican el contenido,
    los métodos y la presentación para la información relativa a los indicadores
    de sostenibilidad y las incidencias adversas en materia de sostenibilidad, así
    como el contenido y la presentación de información relativa a la promoción
    de características medioambientales o sociales y de objetivos de inversión sostenible
    en los documentos precontractuales, en los sitios web y en los informes periódicos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1288 av den 6 april 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2019/2088
    vad gäller tekniska standarder för tillsyn som specificerar innehållet i och
    presentationen av information med avseende på principen om att inte orsaka betydande
    skada, och som specificerar innehållet i, metoderna för och presentationen av
    information med avseende på hållbarhetsindikatorer och negativa konsekvenser
    för hållbar utveckling, samt innehållet i och presentationen av information
    med avseende på främjande av miljörelaterade eller sociala egenskaper och mål
    för hållbar investering i upplysningar som lämnas innan avtal ingås, på webbplatser
    och i regelbundna rapporter
  type: main
