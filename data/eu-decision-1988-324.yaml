title:
- language: en
  script: Latn
  content: '88/324/EEC: Commission Decision of 17 May 1988 establishing the amendments
    to be made in respect of potatoes, to the measures taken by Denmark to protect
    itself against the introduction of Corynebacterium sepedonicum (Only the Danish
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/324/CEE: Décision de la Commission du 17 mai 1988 fixant les modifications
    à apporter, pour les pommes de terre, aux mesures prises par le Danemark pour
    se protéger contre l''introduction de Corynebacterium sepedonicum (Le texte en
    langue danoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/324/EWG: Entscheidung der Kommission vom 17. Mai 1988 über Änderungen
    zu den Schutzmaßnahmen Dänemarks gegen die Einschleppung von bakterieller Ringfäule
    bei Kartoffeln (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/324/EØF: Kommissionens beslutning af 17. maj 1988 om ændringer af
    de foranstaltninger, som Danmark har truffet med hensyn til kartofler for at beskytte
    sig imod indslæbning af Corynebacterium sepedonicum (Kun den danske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/324/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Μαΐου 1988 που καθορίζει τις τροποποιήσεις που
    πρέπει να επέλθουν όσον αφορά τα γεώμηλα στα
    μέτρα που έλαβε η Δανία προκειμένου να προστατευθεί
    από την εισαγωγή του Corynebacterium Sepedonicum στο έδαφός
    της (Το κείμενο στην δανική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/324/CEE: Decisione della Commissione del 17 maggio 1988 relativa alle
    modifiche da apportare alle misure adottate dalla Danimarca nel settore delle
    patate per prevenire l''introduzione nel paese del "Corynebacterium sepedonicum"
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/324/EEG: Beschikking van de Commissie van 17 mei 1988 houdende vaststelling
