title:
- language: en
  script: Latn
  content: '81/147/EEC: Commission Decision of 12 February 1981 authorizing Ireland
    not to apply Community treatment to footwear with outer soles and uppers of rubber
    or artificial plastic material originating in Taiwan (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/147/CEE: Décision de la Commission, du 12 février 1981, autorisant
    l''Irlande à instaurer une surveillance intracommunautaire des importations de
    chaussures à semelles extérieures et dessus en caoutchouc ou en matières plastiques
    artificielles originaires de T''ai- wan (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/147/EWG: Entscheidung der Kommission vom 12. Februar 1981 zur Ermächtigung
    Irlands, aus Taiwan stammende Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/147/EØF: Kommissionens beslutning af 12. februar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage fodtøj med ydersål og overdel
    af gummi eller plast med oprindelse i Taiwan, og som frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/147/ΕΟΚ: Απόφαση τής Επιτροπής τής 12ης
    Φεβρουαρίου 1981 περί εξουσιοδοτήσεως τής Ιρλανδίας
    νά καθιερώσει μία ενδοκοινοτική επίβλεψη τών
    εισαγωγών υποδημάτων εχόντων τό εξωτερικόν
    πέλμα καί τό άνω μέρος αυτών εκ καουτσούκ ή
    εκ τεχνητής πλαστικής ύλης, καταγομένων από
    τήν Ταϊβάν (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/147/CEE: Decisione della Commissione, del 12 febbraio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le calzature con suole e tomaia
    di gomma o di materia plastica artificiale originarie di Taiwan (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/147/EEG: Beschikking van de Commissie van 12 februari 1981 houdende
    machtiging van Ierland om schoeisel met buitenzool en bovendeel van rubber of
    van kunstmatige plastische stof van oorsprong uit Taiwan van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
