type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 976/79 of 16 May 1979 re-establishing the
    levying of customs duties on carpets, whether tufted or not, other than of jute
    or other textile bast fibres of heading No 57.03 or coir, falling within subheading
    58.02 ex A and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 976/79 de la Commission, du 16 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux tapis, même "tufted", autres
    que de jute ou d' autres fibres textiles libériennes du n° 57.03, ou de coco,
    de la sous-position 58.02 ex A du tarif douanier commun, originaires des pays
    et territoires en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 976/79 der Kommission vom 16. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Teppiche, auch Nadelflorteppiche, ausgenommen aus Jute oder
    anderen textilen Bastfasern der Tarifnummer 57.03 oder Kokosfasern, der Tarifstelle
    58.02 ex A, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 976/79 af 16. maj 1979 om genindførelse
    af opkrævning af toldafgifter for tæpper, også tuftede varer, bortset fra jutefibre
    eller andre bastfibre henhørende under pos. 57.03 eller kokosfibre, henhørende
    under pos. 58.02 ex A i den fælles toldtarif, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 976/79 della Commissione, del 16 maggio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tappeti, anche "tufted",
    esclusi quelli di iuta e di altre fibre tessili liberiane della voce 57.03 e di
    cocco, della sottovoce 58.02 ex A della tariffa doganale comune, originari dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 976/79 van de Commissie van 16 mei 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten,
    ook zogenaamde ,,tufted' ' -tapijten, met uitzondering van die van jute of van
    andere bastvezels van post 57.03, of van kokosvezels, van post 58.02 ex A, van
    oorsprong uit de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3157/78 van de Raad tariefpreferenties werden geopend
  type: main
