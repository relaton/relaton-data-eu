title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1903/75 of the Commission of 24 July 1975 amending
    Regulation (EEC) No 540/75 laying down additional measures to be taken in agriculture
    following the fixing, with effect from 3 March 1975, of new representative rates
    for the currencies of certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1903/75 de la Commission, du 24 juillet 1975, portant
    modification du règlement (CEE) n° 540/75 définissant les mesures supplémentaires
    à prendre dans le secteur agricole suite à la fixation, avec effet au 3 mars
    1975, de nouveaux taux représentatifs pour les monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1903/75 der Kommission vom 24. Juli 1975 zur Änderung
    der Verordnung (EWG) Nr. 540/75 zur Festlegung ergänzender Maßnahmen, die in
    der Landwirtschaft im Anschluß an die Festsetzung neuer repräsentativer Kurse
    für die Währungen einiger Mitgliedstaaten ab 3. März 1975 zu treffen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1903/75 af 24. juli 1975 om ændring
    af forordning (EØF) nr. 540/75 om fastsættelse af de supplerende foranstaltninger,
    der skal træffes inden for landburgssektoren som følge af den fastsættelse,
    som får virkning den 3. marts 1975 af de nye repræsentative kurser for visse
    medlemsstaters valutaer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1903/75 della Commissione, del 24 luglio 1975, recante
    modifica del regolamento (CEE) n. 540/75, che definisce le misure supplementari
    da adottare nel settore agricolo in seguito alla fissazione, con effetto dal 3
    marzo 1975, di nuovi tassi rappresentativi per le monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1903/75 van de Commissie van 24 juli 1975 tot wijziging
    van Verordening (EEG) nr. 540/75 houdende in de landbouwsector te nemen aanvullende
    maatregelen naar aanleiding van de vaststelling van nieuwe representatieve koersen
    voor de munteenheden van bepaalde Lid-Staten, die gelden met ingang van 3 maart
    1975
  type: main
