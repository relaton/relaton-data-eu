    fir-rigward ta’ ċerti pjanti għat-tħawwil ta’ Ligustrum ovalifolium u Ligustrum
    vulgare, li joriġinaw mir-Renju Unit, u r-Regolament ta’ Implimentazzjoni (UE)
    2020/1213 fir-rigward tal-miżuri fitosanitarji għall-introduzzjoni ta’ dawk
