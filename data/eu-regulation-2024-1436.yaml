  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1436 al Comisiei din 24 mai
    2024 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante aparținând speciilor Ligustrum ovalifolium
    și Ligustrum vulgare originare din Regatul Unit și a Regulamentului de punere
    în aplicare (UE) 2020/1213 în ceea ce privește măsurile fitosanitare pentru
    introducerea pe teritoriul Uniunii a respectivelor plante destinate plantării
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/1436 z 24. mája 2024, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu patriace k druhom Ligustrum ovalifolium a Ligustrum vulgare
    pochádzajúce zo Spojeného kráľovstva, a vykonávacie nariadenie (EÚ) 2020/1213,
    pokiaľ ide o rastlinolekárske opatrenia v súvislosti so vstupom uvedených
    rastlín určených na výsadbu na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/1436 z dne 24. maja 2024 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Ligustrum ovalifolium
    in Ligustrum vulgare s poreklom iz Združenega kraljestva ter Izvedbene uredbe
    (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos navedenih rastlin za saditev
    na ozemlje Unije
  type: main
- language: es
  script: Latn
