    (UE) 2020/1213 w odniesieniu do środków fitosanitarnych do celów wprowadzania
    na terytorium Unii tych roślin przeznaczonych do sadzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/1436 da Comissão, de 24 de maio de
