    ovalifolium ir Ligustrum vulgare augalų iš dalies keičiamas Reglamentas (ES)
    2018/2019 ir dėl fitosanitarinių priemonių, taikomų tiems į Sąjungos teritoriją
    įvežamiems sodinti skirtiems augalams, iš dalies keičiamas Įgyvendinimo reglamentas
    (ES) 2020/1213
  type: main
- language: mt
  script: Latn
