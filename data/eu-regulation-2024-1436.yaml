    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde uit
    het Verenigd Koninkrijk afkomstige voor opplant bestemde planten van de soorten
    Ligustrum ovalifolium en Ligustrum vulgare en tot wijziging van Uitvoeringsverordening
