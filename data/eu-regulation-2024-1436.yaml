    kuningaskunnasta peräisin olevien istutettaviksi tarkoitettujen Ligustrum ovalifolium-
    ja Ligustrum vulgare -lajien kasvien osalta ja täytäntöönpanoasetuksen (EU)
    2020/1213 muuttamisesta siltä osin kuin on kyse kyseisten istutettaviksi tarkoitettujen
    kasvien tuomista unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
