    2024, che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Ligustrum ovalifolium e Ligustrum vulgare originarie
    del Regno Unito e il regolamento di esecuzione (UE) 2020/1213 per quanto riguarda
    le misure fitosanitarie per l’introduzione di tali piante da impianto nel territorio
    dell’Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/1436 (2024. gada 24. maijs), ar
