    vulgare egyes, az Egyesült Királyságból származó, ültetésre szánt növényei
    tekintetében, valamint az (EU) 2020/1213 végrehajtási rendeletnek az említett
    ültetésre szánt növények Unió területére való behozatalára vonatkozó
    növényegészségügyi intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
