  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1436 оd 24. svibnja 2024. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Ligustrum
    ovalifolium i Ligustrum vulgare podrijetlom iz Ujedinjene Kraljevine te Provedbene
    uredbe (EU) 2020/1213 u pogledu fitosanitarnih mjera za unos tog bilja za sadnju
    na područje Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1436 végrehajtási rendelete (2024. május 24.)
