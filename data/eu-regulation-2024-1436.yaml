    zum Anpflanzen bestimmte Pflanzen von Ligustrum ovalifolium und Ligustrum vulgare
    mit Ursprung im Vereinigten Königreich und zur Änderung der Durchführungsverordnung
    (EU) 2020/1213 in Bezug auf die pflanzenschutzrechtlichen Maßnahmen für das
    Einführen dieser zum Anpflanzen bestimmten Pflanzen in das Gebiet der Union
  type: main
