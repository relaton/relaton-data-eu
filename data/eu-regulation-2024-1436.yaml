    ovalifolium un Ligustrum vulgare augiem groza Īstenošanas regulu (ES) 2018/2019
    un attiecībā uz fitosanitārajiem pasākumiem, kurus piemēro minēto stādāmo
    augu ievešanai Savienības teritorijā, groza Īstenošanas regulu (ES) 2020/1213
  type: main
- language: lt
  script: Latn
