title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1436 of 24 May 2024 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Ligustrum ovalifolium and Ligustrum vulgare originating in the United Kingdom,
    and Implementing Regulation (EU) 2020/1213 as regards the phytosanitary measures
    for the introduction of those plants for planting into the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1436 de la Commission du 24 mai 2024
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation appartenant aux espèces Ligustrum ovalifolium
    et Ligustrum vulgare et originaires du Royaume-Uni, et le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables à l’introduction
    de ces végétaux destinés à la plantation sur le territoire de l’Union
  type: main
- language: de
  script: Latn
