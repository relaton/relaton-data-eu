    lo que respecta a determinados vegetales para plantación de Ligustrum ovalifolium
    y Ligustrum vulgare originarios de Reino Unido y el Reglamento de Ejecución (UE)
    2020/1213 en lo que respecta a las medidas fitosanitarias para la introducción
    de esos vegetales para plantación en el territorio de la Unión
  type: main
