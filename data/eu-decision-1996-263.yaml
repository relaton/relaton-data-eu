title:
- language: en
  script: Latn
  content: '96/263/EC: Commission Decision of 28 March 1996 amending Decision 95/424/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1996 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '96/263/CE: Décision de la Commission, du 28 mars 1996, modifiant la décision
    95/424/CE adoptant le plan portant attribution aux États membres de ressources
    imputables à l'' exercice 1996 pour l'' exécution des fournitures de denrées
    alimentaires provenant des stocks d'' intervention au bénéfice des personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '96/263/EG: Entscheidung der Kommission vom 28. März 1996 zur Änderung
    der Entscheidung 95/424/EG zur Annahme des Plans über die Bewilligung von Mitteln,
    die den Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1996 zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '96/263/EF: Kommissionens beslutning af 28. marts 1996 om ændring af beslutning
    95/424/EF om vedtagelse af planen for tildeling til medlemsstaterne af midler,
    der kan afholdes over 1996-budgettet, og som skal dække udgifterne til levering
    af levnedsmidler fra interventionslagre til de socialt dårligst stillede personer
    i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '96/263/ΕΚ: Απόφαση της Επιτροπής, της 28ης Μαρτίου
    1996, για την τροποποίηση της απόφασης 95/424/ΕΚ
    με την οποία εγκρίνεται το πρόγραμμα χορήγησης
    στα κράτη μέλη των πόρων οι οποίοι καταλογίζονται
    στο οικονομικό έτος 1996 για την εκτέλεση των
    προμηθειών σε τρόφιμα με προέλευση τα αποθέματα
    παρέμβασης προς όφελος των πτωχοτέρων ατόμων
    της Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '96/263/EY: Komission päätös, tehty 28 päivänä maaliskuuta 1996,
    varainhoitovuodelle 1996 kirjattavien varojen jakamista jäsenvaltioille koskevan
    suunnitelman hyväksymisestä interventiovarastoista peräisin olevien elintarvikkeiden
    toimittamiseksi yhteisön vähävaraisimmille henkilöille tehdyn päätöksen
    95/424/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/263/CE: Decisione della Commissione, del 28 marzo 1996, recante modifica
    della decisione 95/424/CE, che approva il piano di ripartizione agli Stati membri
    delle risorse da imputare all'' esercizio finanziario 1996 per l'' esecuzione
    delle forniture di derrate alimentari provenienti dalle scorte d'' intervento
    a favore degli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '96/263/EG: Beschikking van de Commissie van 28 maart 1996 houdende wijziging
    van Beschikking 95/424/EG tot vaststelling van het jaarplan voor de toewijzing
    aan de Lid-Staten van voor het begrotingsjaar 1996 te boeken financiële middelen
    voor de levering van levensmiddelen uit interventievoorraden aan de meest hulpbehoevenden
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '96/263/CE: Decisão da Comissão, de 28 de Março de 1996, que altera
    a Decisão 95/424/CE que adopta o plano que atribui aos Estados-membros recursos
    a incluir no exercício orçamental de 1996 para o fornecimento de géneros alimentícios
    provenientes das existências de intervenção a favor das pessoas mais necessitadas
    na Comunidade'
  type: main
- language: es
  script: Latn
  content: '96/263/CE: Decisión de la Comisión, de 28 de marzo de 1996, que modifica
    la Decisión 95/424/CE por la que se adopta el plan que establece la asignación
    a los Estados miembros de recursos imputables al ejercicio presupuestario de 1996
    para el suministro de alimentos procedentes de las existencias de intervención
    en beneficio de las personas más necesitadas de la Comunidad'
  type: main
- language: sv
  script: Latn
  content: '96/263/EG: Kommissionens beslut av den 28 mars 1996 om ändring av beslut
    95/424/EG om fastställande av planen för att tilldela medlemsstaterna resurser
    som hänförs till räkenskapsåret 1996 för leverans av livsmedel från interventionslager
    till de sämst ställda personerna i gemenskapen'
  type: main
