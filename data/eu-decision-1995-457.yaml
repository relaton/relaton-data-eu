title:
- language: en
  script: Latn
  content: '95/457/EC: Commission Decision of 19 October 1995 concerning a request
    for exemption lodged by the Italian Republic pursuant to Article 8 (2) (c) of
    Council Directive 70/156/EEC on the approximation of the laws of the Member States
    relating to the type-approval of motor vehicles and their trailers (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/457/CE: Décision de la Commission, du 19 octobre 1995, concernant
    une demande de dérogation introduite par la République italienne en vertu de
    l''article 8 paragraphe 2 point c) de la directive 70/156/CEE du Conseil concernant
    le rapprochement des législations des États membres relatives à la réception
    des véhicules à moteur et de leurs remorques (Le texte en langue italienne est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '95/457/EG: Entscheidung der Kommission vom 19. Oktober 1995 betreffend
    einen von der Republik Italien gemäß Artikel 8 Absatz 2 Buchstabe c) der Richtlinie
    70/156/EWG des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    über die Betriebserlaubnis für Kraftfahrzeuge und Kraftfahrzeuganhänger eingereichten
    Antrag auf Ausnahmeregelung (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/457/EF: Kommissionens beslutning af 19. oktober 1995 om en dispensationsanmodning
    fra Den Italienske Republik i henhold til artikel 8, stk. 2, litra c), i Rådets
    direktiv 70/156/EØF om tilnærmelse af medlemsstaternes lovgivning om godkendelse
    af motordrevne køretøjer og påhængskøretøjer dertil (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/457/ΕΚ: Απόφαση της Επιτροπής της 19ης Οκτωβρίου
    1995 που αφορά αίτηση παρέκκλισης που υπέβαλε
    η Ιταλική Δημοκρατία βάσει του άρθρου 8 παράγραφος
    2 στοιχείο γ) της οδηγίας 70/156/ΕΟΚ του Συμβουλίου
    για την προσέγγιση των νομοθεσιών των κρατών
    μελών σχετικά με την έγκριση τύπου των μηχανοκινήτων
    οχημάτων και των ρυμουλκουμένων τους (Το κείμενο
    στην ιταλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/457/EY: Komission päätös, tehty 19 päivänä lokakuuta 1995, moottoriajoneuvojen
    ja niiden perävaunujen tyyppihyväksyntää koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun neuvoston direktiivin 70/156/ETY 8 artiklan 2 kohdan
    c alakohdan mukaisesta Italian tasavallan esittämästä poikkeuspyynnöstä (Ainoastaan
    italiankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/457/CE: Decisione della Commissione, del 19 ottobre 1995, riguardante
    una domanda di deroga presentata dalla Repubblica italiana ai sensi dell''articolo
    8, paragrafo 2, lettera c) della direttiva 70/156/CEE del Consiglio concernente
    il ravvicinamento delle legislazioni degli Stati membri relative all''omologazione
    dei veicoli a motore e dei loro rimorchi (Il testo in lingua italiana è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/457/EG: Beschikking van de Commissie van 19 oktober 1995 inzake een
