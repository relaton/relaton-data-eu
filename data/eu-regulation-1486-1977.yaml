title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1486/77 of 1 July 1977 re-establishing the
    levying of customs duties on broom and brush handles, of wood, falling within
    subheading 44.25 ex B, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1486/77 de la Commission, du 1er juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux manches
    de balais et de brosses, en bois, de la sous-position tarifaire 44.25 EX B, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1486/77 der Kommission vom 1. Juli 1977 zur Wiedereinführung
    des Zollsatzes für Griffe für Besen und Bürsten, aus Holz, der Tarifstelle
    44.25 ex B, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1486/77 af 1. juli 1977 om genindførelse
    af opkrævning af toldafgifter for skafter og håndtag, af træ, til koste og
    børster, under underposition 44.25 ex B, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1486/77 della Commissione, del 1 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai manichi di spazzole
    e di scope, di legno, della sottovoce doganale 44.25 ex B, originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1486/77 van de Commissie van 1 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten voor borstel- en bezemstelen,
    van hout, van post 44.25 ex B, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden
    geopend
  type: main
