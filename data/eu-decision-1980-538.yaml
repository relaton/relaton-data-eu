title:
- language: en
  script: Latn
  content: '80/538/EEC: Commission Decision of 19 May 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of expenditure incurred
    during 1979 in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/538/CEE: Décision de la Commission, du 19 mai 1980, relative au remboursement
    par le Fonds européen d''orientation et de garantie agricole, section "orientation",
    au Royaume de Belgique, des dépenses effectuées pendant l''année 1979 dans
    le cadre d''une action de la Communauté en vue de l''éradication de la brucellose,
    de la tuberculose et de la leucose des bovins (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/538/EWG: Entscheidung der Kommission vom 19. Mai 1980 über die Erstattung
    der Ausgaben des Jahres 1979 für die Einführung von Maßnahmen der Gemeinschaft
    zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder an das
    Königreich Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/538/EØF: Kommissionens beslutning af 19. maj 1980 om refusion gennem
    EUGFL, udviklingssektionen, til kongeriget Belgien af udgifter afholdt i 1979
    i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/538/CEE: Decisione della Commissione, del 19 maggio 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno del Belgio delle
    spese effettuate nell''anno 1979 nel quadro di un''azione della Comunità per
    l''eradicazione della brucellosi, della tubercolosi e della leucosi dei bovini
    (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/538/EEG: Beschikking van de Commissie van 19 mei 1980 betreffende de
    vergoeding door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
