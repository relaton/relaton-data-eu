title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3044/80 of 20 November 1980 adjusting the
    amounts of the variable components determined by Regulation (EEC) No 2760/80 determining
    the amounts of the variable component and additional duties applicable from 1
    November to 31 December 1980 inclusive on the importation into the Community of
    goods covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3044/80 de la Commission, du 20 novembre 1980, portant
    rectification des montants des éléments mobiles déterminés par le règlement
    (CEE) n 2760/80 déterminant les montants des éléments mobiles et les droits
    additionnels applicables, pendant la période du 1er novembre au 31 décembre
    1980 inclus, à l'importation dans la Communauté des marchandises relevant du
    règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3044/80 der Kommission vom 20. November 1980 zur Berichtigung
    der Höhe der beweglichen Teilbeträge nach der Verordnung (EWG) Nr. 2760/80 zur
    Festsetzung der Höhe der vom 1. November bis einschließlich 31. Dezember 1980
    bei der Einfuhr der unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren in
    die Gemeinschaft anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3044/80 af 20. november 1980 om berigtigelse
    af de variable elementer, som er fastsat i forordning (EØF) nr. 2760/80, om fastsættelse
    af størrelser af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 1059/69 for perioden fra den
    1. november til den 31. december 1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3044/80 della Commissione, del 20 novembre 1980, che
    rettifica gli importi degli elementi mobili fissati dal regolamento (CEE) n. 2760/80
    che determina gli importi degli elementi mobili e dazi addizionali applicabili
    all'importazione nella Comunità, per il periodo dal 1 novembre al 31 dicembre
    1980 incluso, delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3044/80 van de Commissie van 20 november 1980 tot
    verbetering van de variabele elementen vastgesteld bij Verordening (EEG) nr. 2760/80
    tot vaststelling van het beloop der van 1 november tot en met 31 december 1980
    bij invoer in de Gemeenschap van onder Verordening (EEG) nr. 1059/69 vallende
    goederen toe te passen variabele elementen en aanvullende invoerrechten
