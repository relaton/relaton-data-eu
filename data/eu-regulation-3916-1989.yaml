title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3916/89 of 20 December 1989 fixing, for
    1990, the quota for imports into Portugal of live swine from third countries and
    certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3916/89 de la Commission du 20 décembre 1989 fixant,
    pour l'année 1990, le contingent applicable à l'importation d'animaux vivants
    de l'espèce porcine au Portugal en provenance des pays tiers et certaines modalités
    pour son application
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3916/89 DER KOMMISSION vom 20. Dezember 1989 zur Festlegung
    des 1990 in Portugal anwendbaren Kontingents fuer die Einfuhr von lebenden Schweinen
    aus Drittlaendern und diesbezueglicher Durchfuehrungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3916/89 af 20. december 1989 om fastsættelse
    af kontingentet for 1990 for indførsel til Portugal af levende svin fra tredjelande
    og visse bestemmelser for dets anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3916/89 της Επιτροπής
    της 20ής Δεκεμβρίου 1989 που καθορίζει, για το
    1990, την ποσόστωση που εφαρμόζεται κατά την
    εισαγωγή στην Πορτογαλία ζωντανών χοιροειδών
    προέλευσης τρίτων χωρών, και ορισμένες λεπτομέρειες
    για την εφαρμογή της
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3916/89 DELLA COMMISSIONE del 20 dicembre 1989 che
    fissa per il 1990 il contingente applicabile alle importazioni in Portogallo di
    animali vivi della specie suina provenienti da paesi terzi e stabilisce talune
    modalità per la sua applicazione
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3916/89 VAN DE COMMISSIE van 20 december 1989 tot
    vaststelling van het contingent voor 1990 dat Portugal voor levende varkens uit
    derde landen mag toepassen, en van enige uitvoeringsbepalingen ter zake #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3916/89 DA COMISSAO de 20 de Dezembro de 1989 que
    fixa o contingente para o ano de 1990 aplicavel em Portugal em relaçao aos animais
    vivos da espécie suina provenientes de paises terceiros e determinadas regras
    para a sua aplicaçao
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3916/89 DE LA COMISION de 20 de diciembre de 1989 por
