title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 382/98 of 18 February 1998 amending Regulation
    (EEC) No 3846/87 as regards the agricultural product nomenclature for export refunds
    for cherries provisionally preserved but unsuitable in that state for consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 382/98 de la Commission du 18 février 1998 modifiant
    le règlement (CEE) n° 3846/87 en ce qui concerne la nomenclature des produits
    agricoles pour les restitutions à l'exportation pour les cerises conservées
    provisoirement, mais impropres à l'alimentation en l'état
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 382/98 der Kommission vom 18. Februar 1998 zur Änderung
    der Verordnung (EWG) Nr. 3846/87 hinsichtlich der Nomenklatur für Kirschen, vorläufig
    haltbar gemacht, zum unmittelbaren Genuß nicht geeignet
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 382/98 af 18. februar 1998 om ændring
    af forordning (EØF) nr. 3846/87 for så vidt angår nomenklaturen over eksportrestitutioner
    for landbrugsprodukter i forbindelse med kirsebær, der er konserveret midlertidigt,
    men ikke tilberedt til umiddelbar fortæring
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 382/98 της Επιτροπής
    της 18ης Φεβρουαρίου 1998 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 3846/87 όσον αφορά την
    ονοματολογία των γεωργικών προϊόντων για τις
    επιστροφές κατά την εξαγωγή για κεράσια προσωρινά
    διατηρημένα αλλά ακατάλληλα για διατροφή στην
    κατάσταση που βρίσκονται
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 382/98, annettu 18 päivänä helmikuuta 1998,
    maataloustuotteiden nimikkeistöstä vientitukia varten annetun asetuksen (ETY)
    N:o 3846/87 muuttamisesta siltä osin kuin se koskee väliaikaisesti säilöttyjä
    mutta siinä tilassa välittömään kulutukseen soveltumattomia kirsikoita
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 382/98 della Commissione del 18 febbraio 1998 che modifica
    il regolamento (CEE) n. 3846/87 per quanto riguarda la nomenclatura dei prodotti
    agricoli per le restituzioni all'esportazione per le ciliegie temporaneamente
    conservate, ma non atte per l'alimentazione nello stato in cui sono presentate
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 382/98 van de Commissie van 18 februari 1998 houdende
    wijziging van Verordening (EEG) nr. 3846/87 tot vaststelling van de landbouwproductennomenclatuur
    voor de uitvoerrestituties, wat betreft voorlopig verduurzaamde, maar als zodanig
    voor consumptie ongeschikte kersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 382/98 da Comissão de 18 de Fevereiro de 1998 que
    altera o Regulamento (CEE) nº 3846/87 no que respeita à nomenclatura dos produtos
    agrícolas para as restituições à exportação relativamente a determinadas
    frutas e produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 382/98 de la Comisión de 18 de febrero de 1998 por
