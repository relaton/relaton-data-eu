    atrasiini, deltametriini, imasaliili, indoksakarbi, pendimetaliini, pümetrosiini,
    püraklostrobiini, tiaklopriidi ja trifloksüstrobiini jääkide lubatud piirnormidega
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2007/73/EY, tehty 13 päivänä joulukuuta 2007 ,
    neuvoston direktiivien 86/362/ETY ja 90/642/ETY tiettyjen liitteiden muuttamisesta
    asetamipridin, atratsiinin, deltametriinin, imatsaliilin, indoksakarbin, pendimetaliinin,
    pymetrotsiinin, pyraklostrobiinin, tiaklopridin ja trifloksistrobiinin jäämien
    enimmäismäärien osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2007/73/EK irányelve ( 2007. december 13.) a 86/362/EGK és
