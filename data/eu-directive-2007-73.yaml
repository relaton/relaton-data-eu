    a deltametrin, az imazalil, az indoxakarb, a pendimetalin, a pimetrozin, a piraklostrobin,
    a tiakloprid és a trifloxistrobin megengedett szermaradék-határértékei tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2007/73/CE della Commissione, del 13 dicembre 2007 , che modifica
    alcuni allegati delle direttive 86/362/CEE e 90/642/CEE del Consiglio riguardo
    alle quantità massime di residui delle sostanze acetamiprid, atrazina, deltametrina,
    imazalil, indoxacarb, pendimetalin, pimetrozina, piraclostrobin, tiacloprid e
    triflossistrobina
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2007/73/EK ( 2007. gada 13. decembris), ar ko groza
