  script: Latn
  content: Commission Directive 2007/73/EC of 13 December 2007 amending certain Annexes
    to Council Directives 86/362/EEC and 90/642/EEC as regards maximum residue levels
    for acetamiprid, atrazine, deltamethrin, imazalil, indoxacarb, pendimethalin,
    pymetrozine, pyraclostrobin, thiacloprid and trifloxystrobin
  type: main
- language: fr
  script: Latn
  content: Directive 2007/73/CE de la Commission du 13 décembre 2007 modifiant certaines
    annexes des directives 86/362/CEE et 90/642/CEE du Conseil en ce qui concerne
    les teneurs maximales en résidus d’acétamipride, d’atrazine, de deltaméthrine,
    d’imazalil, d’indoxacarbe, de pendiméthaline, de pymétrozine, de pyraclostrobine,
    de thiaclopride et de trifloxystrobine
  type: main
- language: de
  script: Latn
  content: Richtlinie 2007/73/EG der Kommission vom 13. Dezember 2007 zur Änderung
    bestimmter Anhänge der Richtlinien 86/362/EWG und 90/642/EWG des Rates bezüglich
