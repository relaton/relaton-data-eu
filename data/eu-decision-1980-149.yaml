title:
- language: en
  script: Latn
  content: '80/149/EEC: Commission Decision of 18 January 1980 authorizing the French
    Republic not to apply Community treatment to receivers for television, falling
    within subheading 85.15 A ex III of the Common Customs Tariff, originating in
    Taiwan and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/149/CEE: Décision de la Commission, du 18 janvier 1980, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de télévision de la sous-position 85.15 A ex III du tarif douanier
    commun, originaires de T''ai-wan et mis en libre pratique dans les autres Etats
    membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/149/EWG: Entscheidung der Kommission vom 18. Januar 1980, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Fernsehempfangsgeräte der Tarifstelle
    85.15 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/149/EØF: Kommissionens beslutning af 18. januar 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage fjernsynsmodtagere,
    som henfører under pos. 85.15 ex III i den fælles toldtarif, har oprindelse
    i Taiwan og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/149/CEE: Decisione della Commissione, del 18 gennaio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    per la televisione della sottovoce 85.15 A ex III della tariffa doganale comune,
    originari di Taiwan e messi in libera pratica negli altri Stati membri (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/149/EEG: Beschikking van de Commissie van 18 januari 1980 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen voor televisie van post 85.15
    A ex III van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in
    de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
