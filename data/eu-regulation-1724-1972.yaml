    for korn og de afledede interventionspriser, der refererer sig dertil for visse
    nye medlemsstater for høståret 1972/1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1724/72 del Consiglio, del 20 luglio 1972, che modifica
