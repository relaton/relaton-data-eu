    centri di commercializzazione dei cereali ed i relativi prezzi d' intervento derivati
    per alcuni nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1724/72 van de Raad van 20 juli 1972 tot wijziging
    van Verordening (EEG) nr. 1406/72, ter vaststelling van de voornaamste commercialisatiecentra
    voor granen en van de voor deze centra geldende afgeleide interventieprijzen voor
    bepaalde nieuwe Lid-Staten voor het verkoopseizoen 1972/1973
