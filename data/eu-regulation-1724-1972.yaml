  content: Regulation (EEC) No 1724/72 of the Council of 20 July 1972 amending Regulation
    (EEC) No 1406/72 in order to determine, for the 1972/73 marketing year, the principal
    marketing centres for cereals and the derived intervention prices applicable in
    those centres for certain new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1724/72 du Conseil, du 20 juillet 1972, modifiant
    le règlement (CEE)" n° 1406/72 en vue de fixer, pour la campagne 1972/1973,
    les principaux centres de commercialisation des céréales et les prix d' intervention
    dérivés s' y rapportant pour certains nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1724/72 des Rates vom 20. Juli 1972 zur Änderung
    der Verordnung (EWG) Nr. 1406/72 zwecks Festsetzung der wesentlichsten Handelsplätze
    für Getreide und der für diese Handelsplätze geltenden abgeleiteten Interventionspreise
    für verschiedene neue Mitgliedstaaten für das Wirtschaftsjahr 1972/1973
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1724/72 af 20. juli 1972 om ændring af forordning
