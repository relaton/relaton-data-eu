title:
- language: en
  script: Latn
  content: Regulation (EEC) No 672/74 of the Commission of 26 March 1974 amending
    Regulation (EEC) No 2182/73 laying down detailed rules for the application of
    export levies in the event of the cereals market being disturbed, Regulation (EEC)
    No 2823/73 making like provision in respect of the rice market, and Regulation
    (EEC) No 2637/70
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 672/74 de la Commission, du 26 mars 1974, modifiant
    les règlements (CEE) n° 2182/73 et (CEE) n° 2823/73 relatifs aux modalités
    d' application concernant les prélèvements à l' exportation applicables respectivement
    dans le secteur des céréales et le secteur du riz en cas de perturbation, ainsi
    que le règlement (CEE) n° 2637/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 672/74 der Kommission vom 26. März 1974 zur Änderung
    der Verordnungen (EWG) Nr. 2182/73 und (EWG) Nr. 2823/73 über die Einzelheiten
    der Anwendung der Abschöpfungen bei der Ausfuhr im Getreidesektor bzw. im Reissektor
    im Falle von Störungen und zur Änderung der Verordnung (EWG) Nr. 2637/70
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 672/74 af 26. marts 1974 om ændring
    af forordning (EØF) nr. 2182/73 og (EØF) nr. 2823/73 om gennemførelsesbestemmelser
    vedrørende de inden for kornsektoren og rissektoren gældende eksportafgifter
    i tilfælde af forstyrrelser, samt af forordning (EØF) nr. 2637/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 672/74 della Commissione, del 26 marzo 1974, che modifica
    i regolamenti (CEE) n. 2182/73 e (CEE) n. 2823/73 relativi alle modalità d' applicazione
    dei prelievi all' esportazione applicabili rispettivamente nel settore dei cereali
    e nel settore del riso in caso di perturbazione, nonché il regolamento (CEE)
    n. 2637/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 672/74 van de Commissie van 26 maart 1974 houdende
    wijziging van Verordening (EEG) nr. 2637/70, alsmede van de Verordeningen (EEG)
    nr. 2182/73 en (EEG) nr. 2823/73 betreffende uitvoeringsbepalingen voor uitvoerheffingen
    in de sectoren granen en rijst in geval van verstoring
