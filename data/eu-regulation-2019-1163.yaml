title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1163 of 5 July 2019 amending
    and setting out a single list for the Annexes containing contact details of Member
    States competent authorities and address for notifications to the European Commission
    to certain Regulations concerning restrictive measures
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1163 de la Commission du 5 juillet 2019
    modifiant et établissant une liste unique pour les annexes de certains règlements
    relatifs à des mesures restrictives qui contiennent les coordonnées des autorités
    compétentes des États membres et l'adresse à utiliser pour les notifications
    à la Commission européenne
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1163 der Kommission vom 5. Juli 2019
    zur Änderung und Festlegung einer einzigen Liste der Anhänge mit den Kontaktdaten
    der zuständigen Behörden der Mitgliedstaaten und der Anschrift für Notifikationen
    an die Europäische Kommission über bestimmte Verordnungen über restriktive
    Maßnahmen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1163 на Комисията
    от 5 юли 2019 година за изменение и определяне
    на единен списък за приложенията, съдържащи
    данни за връзка с компетентните органи на държавите
    членки и адрес за изпращане на уведомления
    до Европейската комисия, към определени регламенти
    относно ограничителни мерки
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1163 ze dne 5. července 2019,
    kterým se mění a stanoví jednotný seznam pro přílohy, které obsahují
    kontaktní údaje příslušných orgánů členských států a adresu Evropské
    komise pro oznamování, některých nařízení týkajících se omezujících
    opatření
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1163 af 5. juli 2019
    om ændring af bilagene med kontaktoplysninger om medlemsstaternes kompetente
    myndigheder og den adresse, der benyttes til at underrette Kommissionen, til visse
    forordninger om restriktive foranstaltninger ved fastlæggelse af en fælles liste
    til erstatning for nævnte bilag
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/1163 της Επιτροπής,
    της 5ης Ιουλίου 2019, για την τροποποίηση και
    την κατάρτιση ενιαίου καταλόγου για τα παραρτήματα
    που περιέχουν τα στοιχεία επικοινωνίας των
    αρμόδιων αρχών των κρατών μελών και τη διεύθυνση
    για κοινοποιήσεις προς την Ευρωπαϊκή Επιτροπή
    ορισμένων κανονισμών σχετικά με περιοριστικά
    μέτρα
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2019/1163, 5. juuli 2019, liikmesriikide
