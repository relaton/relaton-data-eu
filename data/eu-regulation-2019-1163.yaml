  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/1163 van de Commissie van 5 juli 2019
    tot wijziging en vaststelling van een enkele lijst voor de bijlagen die de contactgegevens
    van de bevoegde autoriteiten van de lidstaten en de adressen voor de kennisgevingen
    aan de Europese Commissie bevatten, bij bepaalde verordeningen die beperkende
    maatregelen bevatten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/1163 z dnia 5 lipca 2019 r.
    zmieniające i ustanawiające jednolity wykaz w załącznikach zawierających
    dane kontaktowe właściwych organów państw członkowskich oraz adres, na który
    należy przesyłać powiadomienia do Komisji Europejskiej, do niektórych rozporządzeń
    dotyczących środków ograniczających
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1163 da Comissão, de 5 de julho de
    2019, que altera e estabelece uma lista única dos anexos que contêm dados de
    contacto das autoridades competentes dos Estados-Membros e o endereço da Comissão
    Europeia para o envio de notificações sobre determinados regulamentos que impõem
    medidas restritivas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/1163 al Comisiei din 5 iulie
    2019 de modificare a anexelor la anumite regulamente privind măsuri restrictive
    care conțin datele de contact ale autorităților competente ale statelor membre
    și adresa pentru notificările către Comisia Europeană și de stabilire a unei
    liste unice pentru aceste anexe
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1163 z 5. júla 2019, ktorým
    sa mení a stanovuje jednotný zoznam na účely príloh k určitým nariadeniam
    o reštriktívnych opatreniach, ktorý obsahuje kontaktné údaje príslušných
    orgánov členských štátov a adresu na zasielanie oznámení Európskej komisii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1163 z dne 5. julija 2019 o spremembi
    in določitvi enotnega seznama za priloge k nekaterim uredbam o omejevalnih ukrepih,
    ki vsebujejo kontaktne podatke pristojnih organov držav članic in naslov za
    pošiljanje uradnih obvestil Evropski komisiji
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1163 de la Comisión, de 5 de julio
    de 2019, por la que se modifica y se establece una lista única de los anexos
    que contienen información de contacto de las autoridades competentes de los Estados
    miembros y dirección para las notificaciones a la Comisión Europea de determinados
    Reglamentos relativos a medidas restrictivas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2019/1163 av den 5 juli 2019
    om ändring och fastställande av en samlad förteckning för bilagorna med kontaktuppgifter
    till medlemsstaternas behöriga myndigheter och adress för anmälningar till
    Europeiska kommissionen till vissa förordningar om restriktiva åtgärder
