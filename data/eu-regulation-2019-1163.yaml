  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1163 della Commissione, del 5 luglio
    2019, che modifica e stabilisce un elenco unico per gli allegati di certi regolamenti
    concernenti misure restrittive che contengono gli estremi delle autorità competenti
    degli Stati membri e l'indirizzo per le notifiche alla Commissione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1163 (2019. gada 5. jūlijs),
    ar ko groza un izklāsta to pielikumu vienotu sarakstu, kuros ir ietverta dalībvalstu
    kompetento iestāžu kontaktinformācija un adrese paziņojumu sniegšanai Eiropas
    Komisijai saistībā ar konkrētām regulām par ierobežojošiem pasākumiem
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 5 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1163,
    kuriuo nustatomas bendras valstybių narių kompetentingų institucijų kontaktinių
    duomenų sąrašas ir adresas, kuriuo pranešimai siunčiami Europos Komisijai,
    ir todėl iš dalies keičiami tam tikrų reglamentų dėl ribojamųjų priemonių
    priedai
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/1163 tal-5 ta'
    Lulju 2019 li jemenda u jistabbilixxi elenku uniku għall-Annessi li fihom id-dettalji
    ta' kuntatt tal-awtoritajiet kompetenti tal-Istati Membri u l-indirizz għan-notifiki
