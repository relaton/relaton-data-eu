    sisaldavate teatavate piiravaid meetmeid käsitlevate määruste lisade ühtse
    loetelu muutmise ja koostamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2019/1163, annettu 5 päivänä
    heinäkuuta 2019, jäsenvaltioiden toimivaltaisten viranomaisten yhteystiedot
    ja Euroopan komissiolle ilmoittamista varten tarkoitetun osoitteen sisältävien,
    eräiden rajoittavista toimenpiteistä annettujen asetusten liitteiden muuttamisesta
    ja korvaamisesta yhdellä ainoalla luettelolla
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2019/1163 оd 5. srpnja 2019. o izmjeni
    i utvrđivanju jedinstvenog popisa za priloge određenim uredbama o mjerama ograničavanja
