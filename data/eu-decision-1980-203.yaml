id: EUDecision1980203
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/203/EEC: Commission Decision of 25 January 1980 authorizing Ireland
    not to apply Community treatment to women''s, girls''and infants''woven suits
    and costumes, falling within subheading ex 61.02 B II of the Common Customs Tariff
    (category 29), originating in India and in free circulation in the other Member
    States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/203/CEE: Décision de la Commission, du 25 janvier 1980, autorisant
    l''Irlande à exclure du traitement communautaire les costumes-tailleurs tissés
    pour femmes, fillettes et jeunes enfants, de la sous-position ex 61.02 B II du
    tarif douanier commun (catégorie 29), originaires de l''Inde et mis en libre
    pratique dans les autres Etats membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/203/EWG: Entscheidung der Kommission vom 25. Januar 1980, mit der Irland
    ermächtigt wird, aus Indien stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Kostüme und Hosenanzüge für Frauen, Mädchen und
    Kleinkinder, der Tarifstelle ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie
    29, von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/203/EØF: Kommissionens beslutning af 25. januar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage dragter og kostumer til kvinder,
    piger og småbørn, som henhører under pos. ex 61.02 B II i den fælles toldtarif
    (kategori 29), har oprindelse i Indien og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/203/CEE: Decisione della Commissione, del 25 gennaio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli abiti-tailleurs, tessuti,
    per donna, per ragazza e per bambini, della sottovoce ex 61.02 B II della tariffa
    doganale comune, categoria 29, originari dell''India e messi in libera pratica
    negli altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/203/EEG: Beschikking van de Commissie van 25 januari 1980 waarbij Ierland
    wordt gemachtigd geweven mantelpakken en broekpakken voor dames, meisjes en kinderen,
    van post ex 61.02 B II van het gemeenschappelijk douanetarief (categorie 29),
    van oorsprong uit India en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
