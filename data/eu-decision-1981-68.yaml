    aus Geweben, für Männer und Knaben, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/68/EØF: Kommissionens beslutning af 27. januar 1981 om bemyndigelse
