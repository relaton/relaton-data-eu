  content: '81/68/EEC: Commission Decision of 27 January 1981 authorizing the French
    Republic not to apply Community treatment to men''s and boys''woven suits originating
    in Bulgaria (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/68/CEE: Décision de la Commission, du 27 janvier 1981, autorisant
