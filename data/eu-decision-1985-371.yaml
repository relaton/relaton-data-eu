    checks on practices for the maintenance of varieties laid down in Council Directives
    70/457/EEC and 70/458/EEC'
  type: main
- language: fr
  script: Latn
  content: '85/371/CEE: Décision de la Commission du 8 juillet 1985 modifiant la
    décision 81/888/CEE visant à proroger, en ce qui concerne certains pays tiers,
    le délai concernant les contrôles des sélections conservatrices prévu par
    les directives 70/457/CEE et 70/458/CEE du Conseil'
  type: main
- language: de
  script: Latn
