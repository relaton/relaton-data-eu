title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2016/585 of 12 February 2016 amending,
    for the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead,
    cadmium, hexavalent chromium, and polybrominated diphenyl ethers (PBDE) in spare
    parts recovered from and used for the repair or refurbishment of medical devices
    or electron microscopes
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2016/585 de la Commission du 12 février 2016
    modifiant, aux fins de son adaptation au progrès technique, l'annexe IV de la
    directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne une
    exemption pour le plomb, le cadmium, le chrome hexavalent et les polybromodiphényléthers
    (PBDE) dans les pièces détachées récupérées sur des dispositifs médicaux
    ou des microscopes électroniques et utilisées pour leur réparation ou leur
    remise à neuf
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2016/585 der Kommission vom 12. Februar 2016
    zur Änderung — zwecks Anpassung an den technischen Fortschritt — von Anhang
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates bezüglich
    einer Ausnahmeregelung für Blei, Cadmium, sechswertiges Chrom und polybromierte
    Diphenylether (PBDE) in Ersatzteilen, die aus medizinischen Geräten oder Elektronenmikroskopen
    ausgebaut und für die Reparatur oder Wiederinstandsetzung von derartigen Geräten
    oder Mikroskopen verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2016/585 на Комисията
    от 12 февруари 2016 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване на
    оловото, кадмия, шествалентния хром и полибромираните
    дифенилови етери (PBDE) от съответното ограничение
    по отношение на резервни части, взети обратно
    от и използвани за ремонт или обновяване на
    медицински изделия или електронни микроскопи
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2016/585 ze dne 12. února
    2016, kterou se za účelem přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo, kadmium, šestimocný chrom a polybromované difenylethery (PBDE) obsažené
    v náhradních dílech získaných ze zdravotnických prostředků nebo elektronových
    mikroskopů a používaných k jejich opravě či renovaci
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2016/585 af 12. februar 2016 om
    ændring med henblik på tilpasning til den tekniske udvikling af bilag IV til
    Europa-Parlamentets og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse
    for bly, cadmium, hexavalent chrom og polybromerede diphenylethere (PBDE) i reservedele
    nyttiggjort fra og anvendt til reparation eller fornyelse af medicinsk udstyr
    eller elektronmikroskoper
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία (EE) 2016/585 της Επιτροπής,
    της 12ης Φεβρουαρίου 2016, για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τον μόλυβδο, το κάδμιο, το εξασθενές
    χρώμιο και τους πολυβρωμοδιφαινυλαιθέρες
    (PBDE) σε ανταλλακτικά ανακτηθέντα από και χρησιμοποιούμενα
    για την επισκευή ή την ανακαίνιση ιατροτεχνολογικών
    προϊόντων ή ηλεκτρονικών μικροσκοπίων
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2016/585, 12. veebruar 2016, millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb pliid, kaadmiumi,
    kuuevalentset kroomi ja polübroomitud difenüüleetreid (PBDE) varuosades, mis
    on kogutud meditsiiniseadmetest või elektronmikroskoopidest ja mida kasutatakse
    muude selliste seadmete remondiks ja renoveerimiseks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2016/585, annettu 12 päivänä helmikuuta
    2016, Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä, kadmiumia, kuudenarvoista kromia ja polybromidifenyylieettereitä (PBDE-yhdisteet)
    sellaisissa varaosissa, jotka otetaan talteen lääkinnällisistä laitteista
    tai elektronimikroskoopeista ja joita käytetään lääkinnällisten laitteiden
    tai elektronimikroskooppien korjaukseen ja kunnostukseen
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2016/585 оd 12. veljače 2016. o izmjeni,
    u svrhe prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za olovo, kadmij, šestovalentni krom
    i polibromirane difeniletere (PBDE) u rezervnim dijelovima koji su dobiveni iz
    medicinskih proizvoda ili elektronskih mikroskopa i upotrebljavaju se za njihov
    popravak ili obnovu (Tekst važan za EGP)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/585 felhatalmazáson alapuló irányelve (2016.
    február 12.) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az orvostechnikai eszközökből származó és orvostechnikai eszközök vagy
    elektronmikroszkópokok javítására vagy felújítására felhasználandó cserealkatrészekben
    található ólom, kadmium, hat vegyértékű króm és polibrómozott difenil-éterek
    (BPDE) mentesítése tekintetében a műszaki fejlődéshez történő hozzáigazítás
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2016/585 della Commissione, del 12 febbraio 2016,
    che modifica, adattandolo al progresso tecnico, l'allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un'esenzione
    relativa al piombo, al cadmio, al cromo esavalente e agli eteri di difenile polibromurato
    (PBDE) nei pezzi di ricambio recuperati da e usati per la riparazione o il rinnovo
    di dispositivi medici o di microscopi elettronici
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2016/585 (2016. gada 12. februāris),
    ar ko, pielāgojot tehnikas attīstībai, Eiropas Parlamenta un Padomes Direktīvas
    2011/65/ES IV pielikumu groza attiecībā uz atbrīvojumu, ko piemēro no medicīniskajām
    ierīcēm vai elektronu mikroskopiem iegūtu un to remontēšanā vai atjaunošanā
    izmantotu rezerves daļu saturētam svinam, kadmijam, sešvērtīgajam hromam
    un polibromdifenilēteriem (PBDE)
  type: main
- language: lt
  script: Latn
  content: 2016 m. vasario 12 d. Komisijos deleguotoji direktyva (ES) 2016/585, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną, kadmį, šešiavalentį chromą ir polibromintus difenileterius
    (PBDE), esančius atsarginėse dalyse, paimtose iš medicinos prietaisų ar elektroninių
    mikroskopų ir naudojamose tiems prietaisams ar mikroskopams remontuoti arba atnaujinti
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2016/585 tat-12 ta' Frar 2016 li
    temenda, għal skopijiet ta' adattament għall-progress tekniku, l-Anness IV tad-Direttiva
    2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta' eżenzjoni għaċ-ċomb,
    il-kadmju, il-kromju eżavalenti u l-eteri tad-difenil polibromurat (PBDE) fil-parts
    tal-bdil irkuprati minnn u użati għat-tiswija jew ir-rinnovament ta' mezzi mediċi
    jew mikroskopji tal-elettroni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2016/585 van de Commissie van 12 februari 2016
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood, cadmium, zeswaardig chroom en polybroomdifenylethers
    (PBDE) in hergebruikte reserveonderdelen afkomstig uit en gebruikt voor reparatie
    of vernieuwing van medische hulpmiddelen of elektronenmicroscopen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2016/585 z dnia 12 lutego 2016 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik IV do dyrektywy 2011/65/UE
    Parlamentu Europejskiego i Rady w odniesieniu do wyłączenia dla ołowiu, kadmu,
    sześciowartościowego chromu i polibromowanych eterów difenylowych (PBDE) w
    częściach zamiennych odzyskanych z wyrobów medycznych lub mikroskopów elektronowych
    i używanych do ich naprawy lub regeneracji
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2016/585 da Comissão, de 12 de fevereiro de 2016,
    que altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no que respeita a uma isenção
    para a utilização de chumbo, cádmio, crómio hexavalente e éteres difenílicos
    polibromados (PBDE) em peças sobresselentes recuperadas de dispositivos médicos
    ou de microscópios eletrónicos e utilizadas na reparação ou na renovação
    desses equipamentos
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2016/585 a Comisiei din 12 februarie 2016 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumb, cadmiu, crom hexavalent și difenileteri polibromurați (PBDE) în piesele
    de schimb recuperate din dispozitivele medicale sau microscoapele electronice
    și utilizate pentru repararea sau recondiționarea acestora
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2016/585 z 12. februára 2016, ktorou
    sa na účely prispôsobenia technickému pokroku mení príloha IV k smernici
    Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre použitia
    obsahujúce olovo, kadmium, šesťmocný chróm a polybrómované difenylétery
    (PBDE) v náhradných dieloch získaných zo zdravotníckych pomôcok alebo elektrónových
    mikroskopov a používaných na ich opravu alebo modernizáciu
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2016/585 z dne 12. februarja 2016 o
    spremembi Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede
    izjeme za svinec, kadmij, šestvalentni krom in polibromirane difeniletre (PBDE)
    v rezervnih delih, pridobljenih iz medicinskih pripomočkov ali elektronskih mikroskopov,
    za popravilo ali obnovo medicinskih pripomočkov ali elektronskih mikroskopov
    zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2016/585 de la Comisión, de 12 de febrero de 2016,
    que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo, cadmio, cromo hexavalente y polibromodifeniléteres (PBDE) de las
    piezas de repuesto recuperadas de productos sanitarios o microscopios electrónicos
    y utilizadas para la reparación o reacondicionamiento de tales productos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2016/585 av den 12 februari 2016
    om ändring, för anpassning till den tekniska utvecklingen, av bilaga IV till
    Europaparlamentets och rådets direktiv 2011/65/EU vad gäller undantag för bly,
    kadmium, sexvärt krom och polybromerade difenyletrar (PBDE) i reservdelar som
    återvunnits från och används för reparation eller renovering av medicintekniska
    produkter eller elektronmikroskop
