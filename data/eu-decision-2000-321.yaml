    niet aan Richtlijn 66/401/EEG van de Raad voldoet, in de handel wordt gebracht
    (kennisgeving geschied onder nummer C(2000) 954)'
  type: main
- language: pt
  script: Latn
  content: '2000/321/CE: Decisão da Comissão, de 11 de Abril de 2000, que autoriza
