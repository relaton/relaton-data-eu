    σπόρων προς σπορά ορισμένων ειδών που δεν πληρούν
    τις απαιτήσεις της οδηγίας 66/401/ΕΟΚ του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 954]'
  type: main
- language: fi
  script: Latn
  content: '2000/321/EY: Komission päätös, tehty 11 päivänä huhtikuuta 2000,
    luvan antamisesta jäsenvaltioille sallia tilapäisesti tiettyjen sellaisten lajien
    siementen pitäminen kaupan, jotka eivät täytä neuvoston direktiivin 66/401/ETY
    vaatimuksia (tiedoksiannettu numerolla K(2000) 954)'
  type: main
- language: it
  script: Latn
  content: '2000/321/CE: Decisione della Commissione, dell''11 aprile 2000, che autorizza
