title:
- language: en
  script: Latn
  content: '2000/321/EC: Commission Decision of 11 April 2000 authorising the Member
    States to permit temporarily the marketing of seed of certain species not satisfying
    the requirements of Council Directive 66/401/EEC (notified under document number
    C(2000) 954)'
  type: main
- language: fr
  script: Latn
  content: '2000/321/CE: Décision de la Commission du 11 avril 2000 autorisant les
    États membres à admettre temporairement la commercialisation de semences de
    certaines espèces ne satisfaisant pas aux exigences de la directive 66/401/CEE
    du Conseil [notifiée sous le numéro C(2000) 954]'
  type: main
- language: de
  script: Latn
  content: '2000/321/EG: Entscheidung der Kommission vom 11. April 2000 zur Ermächtigung
    der Mitgliedstaaten, bestimmtes, den Anforderungen der Richtlinie 66/401/EWG des
    Rates nicht entsprechendes Saatgut vorübergehend zum Verkehr zuzulassen (Bekanntgegeben
    unter Aktenzeichen K(2000) 954)'
  type: main
- language: da
  script: Latn
  content: '2000/321/EF: Kommissionens beslutning af 11. april 2000 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med frø af visse arter,
    der ikke opfylder kravene i Rådets direktiv 66/401/EØF (meddelt under nummer
    K(2000) 954)'
  type: main
- language: el
  script: Grek
  content: '2000/321/ΕΚ: Απόφαση της Επιτροπής, της 11ης
