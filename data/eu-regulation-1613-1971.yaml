title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1613/71 of the Commission of 26 July 1971 laying down
    detailed rules for fixing c.i.f. prices and levies on rice and broken rice and
    the corrective amounts relating thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1613/71 de la Commission, du 26 juillet 1971, arrêtant
    les modalités de détermination des prix caf et des prélèvements du riz et
    des brisures, ainsi que les montants correcteurs y afférents
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1613/71 der Kommission vom 26. Juli 1971 über die
    Festsetzung der Einzelheiten für die Bestimmung der cif-Preise und der Abschöpfungen
    für Reis und Bruchreis sowie der diesbezüglichen Berichtigungsbeträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1613/71 af 26. juli 1971 om fastsættelse
    af de nærmere bestemmelser for fastsættelse af cif-priser og afgifter for ris
    og brudris samt for fastsættelse af de korrektionsbeløb, som anvendes hertil
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1613/71 τής Επιτροπής
    τής 26ης Ιουλίου 1971 περί θεσπίσεως τών λεπτομερειών
    γιά τόν καθορισμό τών τιμών cif καί τών εισφορών
    ορύζης καί θραυσμάτων ορύζης, καθώς καί τών
    σχετικών διορθωτικών ποσών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1613/71, annettu 26 päivänä heinäkuuta 1971,
    yksityiskohtaisista säännöistä riisin ja rikkoutuneiden riisinjyvien cif-hintojen
    ja maksujen määrittämisestä sekä niihin liittyvistä korjausmääristä
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1613/71 della Commissione, del 26 luglio 1971, che
    stabilisce le modalità per la determinazione dei prezzi cif e dei prelievi del
    riso e delle rotture di riso, nonché i relativi importi correttori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1613/71 van de Commissie van 26 juli 1971 tot vaststelling
    van de wijze waarop de c.i.f.-prijzen en de heffingen voor rijst en breukrijst
    worden bepaald, evenals van de correctiebedragen die hierop betrekking hebben
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1613/71 da Comissão, de 26 de Julho de 1971, que
    estabelece as modalidades de determinação dos preços CIF e dos direitos niveladores
    do arroz e das trincas de arroz, bem como dos respectivos montantes correctores
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1613/71 de la Comisión, de 26 de julio de 1971, por
    el que se establecen las modalidades de determinación de los precios cif y las
    exacciones reguladoras del arroz y del arroz partido, así como los montantes
    correctores correspondientes
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 1613/71 av den 26 juli 1971 om närmare
    bestämmelser för fastställande av cif-priser och avgifter för ris och brutet
    ris och därtill hörande korrektionsbelopp
  type: main
