  script: Latn
  content: Commission Implementing Regulation (EU) 2023/2389 of 29 September 2023
    determining that the information to be automatically exchanged pursuant to the
    agreement to be concluded between the competent authorities of Finland and the
    United Kingdom is equivalent to the information specified in certain provisions
    of Council Directive 2011/16/EU
  type: main
- language: fr
  script: Latn
