title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1249 of 2 September 2020 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2019/1267
    on imports of tungsten electrodes originating in the People’s Republic of China
    to imports of tungsten electrodes consigned from Laos and Thailand, whether declared
    as originating in Laos and Thailand or not, and terminating the investigation
    in respect of imports consigned from India, whether declared as originating in
    India or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1249 de la Commission du 2 septembre
    2020 portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) 2019/1267 sur les importations d’électrodes en tungstène
    originaires de la République populaire de Chine aux importations d’électrodes
    en tungstène expédiées du Laos et de Thaïlande, qu’elles aient ou non été
    déclarées originaires de ces pays, et clôturant l’enquête sur les importations
    expédiées de l’Inde, qu’elles aient ou non été déclarées originaires
    de ce pays
  type: main
- language: de
