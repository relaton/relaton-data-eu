    Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2034/92 de la Comisión, de 22 de julio de 1992, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de julio de 1992 al amparo del régimen previsto en los Acuerdos interinos
    celebrados entre la Comunidad y la República de Polonia, la República de Hungría
    y la República Federativa Checa y Eslovaca
