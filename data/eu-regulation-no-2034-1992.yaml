    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας και
    την Τσεχική και Σλοβακική Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2034/92 della Commissione, del 22 luglio 1992, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1992 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi intermedi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica federativa
    ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2034/92 van de Commissie van 22 juli 1992 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in juli 1992 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    Interimovereenkomsten met de Republiek Polen, de Republiek Hongarije en de Tsjechische
    en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2034/92 da Comissão, de 22 de Julho de 1992, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Julho de
    1992 ao abrigo do regime previsto nos acordos provisórios concluídos pela Comunidade
