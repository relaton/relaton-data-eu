title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2034/92 of 22 July 1992 determining the
    extent to which application lodged in July 1992 for import licences for certain
    pigmeat products under the regime provided for by the Intermediate Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary
    and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2034/92 de la Commission, du 22 juillet 1992, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1992 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords intérimaires conclus par la Communauté avec la
    république de Pologne, la république de Hongrie, et la République fédérative
    tchèque et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2034/92 der Kommission vom 22. Juli 1992 über die
    Festsetzung des Umfangs, in dem die im Juli 1992 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und Polen, Ungarn und der Tschechischen und Slowakischen
    Föderativen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2034/92 af 22. juli 1992 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1992 om importlicenser for visse svinekødprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Republikken
    Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2034/92 της Επιτροπής
    της 22ας Ιουλίου 1992 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Ιούλιο του 1992 για άδειες
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις ενδιάμεσες συμφωνίες,
