  content: 'DECISIÓN DE LA COMISIÓN de 16 de marzo de 1992 por la que se acepta
    el compromiso ofrecido por un productor japonés en relación con el procedimiento
    antidumping relativo a las importaciones de determinado papel termosensible originario
    de Japón, y por la que se concluye la investigación con relación a dicho productor
    (92/177/CEE) #'
