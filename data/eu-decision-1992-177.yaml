    Japan en tot beëindiging van het onderzoek ten aanzien van deze producent (92/177/EEG)
    #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 16 de Março de 1992 que aceita um compromisso
    oferecido por um exportador japonês no âmbito do processo anti-dumping relativo
