title:
- language: en
  script: Latn
  content: '92/177/EEC: Commission Decision of 16 March 1992 accepting an undertaking
    given by a Japanese producer in connection with the anti-dumping proceeding concerning
    imports of certain thermal paper originating in Japan, and terminating the investigation
    with regard to the producer in question'
  type: main
- language: fr
  script: Latn
  content: '92/177/CEE: Décision de la Commission du 16 mars 1992 portant acceptation
    de l''engagement d''un producteur japonais dans le cadre de la procédure antidumping
    concernant les importations de certains papiers thermosensibles originaires du
    Japon et clôture de l''enquête concernant le producteur en question'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 16. März 1992 über die Annahme eines Verpflichtungsangebots
    eines japanischen Herstellers im Rahmen des Antidumpingverfahrens betreffend die
    Einfuhren von bestimmtem Thermopapier mit Ursprung in Japan und über die Einstellung
    des Verfahrens gegenüber diesem Hersteller (92/177/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 16. marts 1992 om godtagelse af et tilsagn
    fra en japansk producent i forbindelse med antidumpingproceduren vedrørende importen
    af visse typer termokopieringspapir med oprindelse i Japan og om afslutning af
    undersøgelsen vedrørende den pågældende producent (92/177/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/177/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Μαρτίου 1992 περί αποδοχής αναλήψεως υποχρεώσεως
    από ιάπωνα παραγωγό όσον αφορά τη διαδικασία
    αντιντάμπινγκ σχετικά με τις εισαγωγές ορισμένων
    τύπων θερμικού χαρτιού καταγωγής Ιαπωνίας,
    και περί περατώσεως της έρευνας σχετικά με
    τον εν λόγω παραγωγό'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 16 marzo 1992 che accetta l'' impegno
    offerto da un produttore giapponese nell'' ambito della procedura antidumping
    relativa alle importazioni di alcuni tipi di carta termica originaria del Giappone
    e che chiude l'' inchiesta nei confronti di tale produttore (92/177/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 16 maart 1992 tot aanvaarding van de door
