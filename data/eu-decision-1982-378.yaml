id: EUDecision1982378
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '82/378/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Ortec - Timing Filter Amplifier, model 474 with Constant- Fraction
    Discriminator, model 473 A, Counter and Timer, model 776 and Nanosecond Display,
    model 425 A'' may not be imported free of Common Customs Tariff duties (Only the
    French, German, Italian, Dutch, Danish, English and Greek texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/378/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "Ortec - Timing Filter Amplifier, model
    474 with Constant-Fraction Discriminator, model 473 A, Counter and Timer, model
    776 and Nanosecond Display, model 425A" ne peut être faite en franchise des droits
    du tarif douanier commun (Les textes en langues française, allemande, italienne,
    néerlandaise, danoise, anglaise et grecque sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/378/EWG: Entscheidung der Kommission vom 19. Mai 1982, mit der festgestellt
    wird, daß das Gerät ,,Ortec- Timing Filter Amplifier, model 474 with Constant-
    Fraction Discriminator, model 473 A, Counter and Timer, model 776 and Nanosecond
    Display, model 425 A" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann (Nur der französische, deutsche, italienische, niederländische,
    dänische, englische und griechische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/378/EØF: Kommissionens beslutning af 19. maj 1982 om fastslåelse
    af, at indførsel af apparatet "Ortec - Timing Filter Amplifier, model 474 with
    Constant- Fraction Discriminator, model 473 A, Counter and Timer, model 776 and
    Nanosecond Display, model 425A" ikke kan ske med fritagelse for told efter den
    fælles toldtarif (Kun de franske, tyske, italienske, nederlandske, danske, engelske
    og græske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/378/EOK: Απόφαση της Επιτροπής τής 19ης Μαΐου
    1982 περί διαπιστώσεως ότι η εισαγωγή της συσκευής
    μέ τήν ονομασία «Ortec — Timing Filter Amplifier, model 474 with
    Constant- Fraction Discriminator, model 473 A, Counter and Timer, model 776 and
    Nanosecond Display, model 425 A» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου
    (Τα κείμενα στην γαλλική, γερμανική, ιταλική,
    ολλανδική, δανική, αγγλική και ελληνική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/378/CEE: Decisione della Commissione, del 19 maggio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Ortec - Timing Filter Amplifier,
    model 474 with Constant-Fraction Discriminator, model 473A, Counter and Timer,
    model 776 and Nanosecond Display, model 425A" non può avvenire in franchigia
    dai dazi della tariffa doganale comune (I testi in lingua francese, tedesca, italiana,
    olandese, danese, inglese e greca sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/378/EEG: Beschikking van de Commissie van 19 mei 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd "Ortec-Timing Filter Amplifier, model 474
    with Constant- Fraction Discriminator, model 473 A, Counter and Timer, model 776
    and Nanosecond Display, model 425 A" , niet met vrijstelling van de rechten van
    het gemeenschappelijk douanetarief mag worden ingevoerd (Slechts de teksten in
    de Franse, Duitse, Italiaanse, Nederlandse, Deense, Engelse en de Griekse taal
    zijn authentiek)'
  type: main
