title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3388/83 of 30 November 1983 amending for
    the 20th time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3388/83 de la Commission du 30 novembre 1983 modifiant
    pour la vingtième fois le règlement (CEE) n° 2730/81 établissant la liste
    des organismes dans les pays tiers importateurs d'où peuvent émaner des adjudications
    dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3388/83 der Kommission vom 30. November 1983 zur 20.Änderung
