    agentur v dovážejících třetích zemích, které jsou oprávněny vypisovat
    nabídková řízení v odvětví mléka a mléčných výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3388/83 af 30. november 1983 om 20.
    ændring af forordning (EØF) nr. 2730/81 om listen over de organer i importerende
    tredjelande, som kan holde licitationer vedrørende mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
