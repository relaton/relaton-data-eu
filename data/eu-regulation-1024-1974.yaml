title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1024/74 of the Commission of 26 April 1974 re-establishing
    the levying of the customs duties on other articles for electrical lighting fittings
    falling within subheading No 70.14 A II, originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3501/73
    of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1024/74 de la Commission, du 26 avril 1974, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    pour l'équipement des appareils d'éclairage électrique de la sous-position
    tarifaire 70.14 A II originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1024/74 der Kommission vom 26. April 1974 zur Wiedereinführung
    des Zollsatzes für andere Waren zum Ausstatten von elektrischen Beleuchtungskörpern,
    der Tarifstelle 70.14 A II, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1024/74 af 26. april 1974 om genindførelse
    af opkrævning af toldafgifter for andre glasartikler, der anvendes som udstyr
    til elektriske belysningsartikler under underposition 70.14 A II, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1024/74 della Commissione, del 26 aprile 1974, che
    ripristina la riscossione dei dazi doganali applicabili ad altri oggetti per completare
    gli apparecchi d'illuminazione elettrica della sottovoce doganale n. 70.14 A II
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1024/74 van de Commissie van 26 april 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere uitrustingsstukken
    voor elektrische verlichtingsartikelen, van onderverdeling 70.14 A II, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de
    Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
