title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 584/82 of 12 March 1982 amending Regulation
    (EEC) No 1054/68 determining the list of agencies certifying the admissibility
    to certain tariff headings of certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 584/82 de la Commission, du 12 mars 1982, modifiant
    le règlement (CEE) n° 1054/68 établissant la liste des organismes émetteurs
    de certificats destinés à permettre l' admission de certains produits laitiers
    en provenance des pays tiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 584/82 der Kommission vom 12. März 1982 zur Änderung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    Drittländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 584/82 af 12. marts 1982 om ændring
    af forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse over de organer,
    der er kompetente til at udstede certifikater vedrørende visse fra tredjelande
    indførte mejeriprodukters henførsel under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 584/82 τής Επιτροπής τής
    12ης Μαρτίου 1982 περί τροποποιήσεως τού κανονισμού
    (EOK) αριθ. 1054/68 περί καταρτίσεως τού καταλόγου
    τών οργανισμών εκδόσεων πιστοποιητικών τά
    οποία προορίζονται νά επιτρέψουν τήν αποδοχή
    ορισμένων γαλακτοκομικών προϊόντων προελεύσεως
    τρίτων χωρών σέ ορισμένες δασμολογικές κλάσεις
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 584/82 della Commissione, del 12 marzo 1982, che modifica
    il regolamento (CEE) n. 1054/68, che stabilisce l' elenco degli organismi emittenti
    dei certificati destinati a permettere l' ammissione di alcune voci tariffarie
    di alcuni prodotti lattiero-caseari in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 584/82 van de Commissie van 12 maart 1982 tot wijziging
