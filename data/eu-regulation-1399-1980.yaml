title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1399/80 of 3 June 1980 re-establishing the
    levying of customs duties on dioctyl phthalates, falling within subheading 29.15
    C ex III, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1399/80 de la Commission, du 3 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux orthophtalates
    de dioctyle, de la sous-position 29.15 C ex III du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1399/80 der Kommission vom 3. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Dioctylphthalate der Tarifstelle 29.15 C ex III, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1399/80 af 3. juni 1980 om genindførelse
    af opkrævning af toldafgifter for dioctylphthalater, under pos. 29.15 C ex III,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1399/80 della Commissione, del 3 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli ortoftalati di diottile,
    della sottovoce 29.15 C ex III della tariffa doganale comune, originari dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1399/80 van de Commissie van 3 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor dioctylorthoftalaten,
    van post 29.15 C ex III, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden
    geopend
  type: main
