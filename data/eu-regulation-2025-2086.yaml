title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/2086 of 17 October 2025 laying
    down, pursuant to Regulation (EU) 2021/2282 on health technology assessment, procedural
    rules for the interaction during, exchange of information on, and participation
    in, the preparation and update of joint clinical assessments of medical devices
    and in vitro diagnostic medical devices at Union level, as well as templates for
    those joint clinical assessments
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2086 de la Commission du 17 octobre
    2025 établissant, conformément au règlement (UE) 2021/2282 concernant l’évaluation
    des technologies de la santé, les règles de procédure applicables à l’interaction
    au cours des évaluations cliniques communes de dispositifs médicaux et de dispositifs
    médicaux de diagnostic in vitro au niveau de l’Union, à l’échange d’informations
    concernant l’élaboration et la mise à jour de ces évaluations et à la participation
    à ces dernières, ainsi que des modèles pour ces évaluations cliniques communes
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/2086 der Kommission vom 17. Oktober
    2025 zur Festlegung von Verfahrensvorschriften für das Zusammenspiel im Zuge
    der Erstellung und Aktualisierung gemeinsamer klinischer Bewertungen von Medizinprodukten
    und In-vitro-Diagnostika auf Unionsebene, den Informationsaustausch darüber und
    die Beteiligung daran sowie zur Festlegung von Mustern für diese gemeinsamen
    klinischen Bewertungen gemäß der Verordnung (EU) 2021/2282 über die Bewertung
    von Gesundheitstechnologien
  type: main
