title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2218/83 of 2 August 1983 re-establishing
    the levying of customs duties on certain women' s, girls' and infants' garments,
    products of category 80 (code 0800) and originating in Pakistan, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2218/83 de la Commission du 2 août 1983 portant rétablissement
    de la perception des droits de douane applicables à certains vêtements pour
    femmes, fillettes et jeunes enfants, de la catégorie de produits 80 (code 0800),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2218/83 der Kommission vom 2. August 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Kleidung für Frauen, Mädchen
    und Kleinkinder, der Warenkategorie Nr. 80 (Kennziffer 0800), mit Ursprung in
    Pakistan, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2218/83 af 2. august 1983 om genindførelse
    af opkrævning af toldafgifter for bestemte beklædningsgenstande til kvinder,
    piger og småbørn under kategori nr. 80 (kode 0800), som har oprindelse i Pakistan
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2218/83 της Επιτροπής
    της 2ας Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    ενδύματα γυναικών, κορασίδων και μικρών παιδιών,
    προϊόντα της κατηγορίας 80 (κωδικός 0800), καταγωγής
    Πακιστάν, δικαιούχων των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2218/83 della Commissione del 2 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili a taluni indumenti per donna, per
    ragazza e per bambini, della categoria di prodotti n. 80 (codice 0800), originari
    del Pakistan, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2218/83 van de Commissie van 2 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    dames-, meisjes- en kinderkleding, van de categorie van produkten nr. 80 (codenummer
    0800), van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
