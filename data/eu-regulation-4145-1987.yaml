  content: Council Regulation (EEC) No 4145/87 of 21 December 1987 on the application
    of Decision No 2/87 of the EEC-Finland Joint Committee supplementing and amending
    Protocol 3 concerning the definition of the concept of originating products and
    methods of administrative cooperation, to provide for further simplification of
    documentation required as evidence of origin
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4145/87 du Conseil du 21 décembre 1987 concernant
    l' application de la décision n° 2/87 du comité mixte CEE-Finlande complétant
    et modifiant le protocole n° 3 relatif à la définition de la notion de "produits
    originaires" et aux méthodes de coopération administrative, en vue d' introduire
    une simplification supplémentaire de la documentation relative à la preuve de
    l' origine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4145/87 des Rates vom 21. Dezember 1987 zur Anwendung
