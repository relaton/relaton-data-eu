title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 152/83 of 21 January 1983 accepting an undertaking
    given in connection with the anti-dumping proceeding concerning polyvinyl chloride
    originating in Czechoslovakia, terminating the proceeding and lifting the provisional
    anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 152/83 de la Commission du 21 janvier 1983 portant
    acceptation d' un engagement souscrit dans le cadre de la procédure anti-"dumping"
    concernant le chlorure de polyvinyle originaire de Tchécoslovaquie, clôture
    de la procédure et abrogation du droit anti-"dumping" provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 152/83 der Kommission vom 21. Januar 1983 über die
    Annahme einer Verpflichtung im Rahmen des Antidumpingverfahrens betreffend Polyvinylchlorid
    mit Ursprung in der Tschechoslowakei sowie die Einstellung des Verfahrens und
    die Aufhebung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 152/83 af 21. januar 1983 om godtagelse
    af tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende polyvinylchlorid
    med oprindelse i Tjekkoslovakiet, om afslutning af denne procedure og om ophævelse
    af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 152/83 της Επιτροπής
    της 21ης Ιανουαρίου 1983 περί αποδοχής αναλήψεως
    υποχρεώσεων στο πλαίσιο της διαδικασίας αντιντάμπινγκ
    για χλωριούχο πολυβινύλιο καταγωγής Τσεχοσλοβακίας,
    περατώσεως της διαδικασίας και καταργήσεως
    του προσωρινού δασμού αντιντάμπινγκ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 152/83 della Commissione del 21 gennaio 1983 che accetta
    l' impegno assunto nel quadro della procedura antidumping riguardo al cloruro
    di polivinile originario della Cecoslovacchia, conclude detta procedura e abolisce
    il dazio provvisorio antidumping
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 152/83 van de Commissie van 21 januari 1983 houdende
    aanvaarding van een verbintenis in het kader van de anti-dumpingprocedure betreffende
    polyvinylchloride van oorsprong uit Tsjechoslowakije, alsmede beëindiging van
    de procedure en opheffing van het voorlopige anti-dumpingrecht
