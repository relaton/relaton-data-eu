    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/506/CEE: Décision de la Commission du 5 octobre 1983 constatant que
    l''importation de l''appareil dénommé "Varian - Gas Chromatography System, model
    Vista 44" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
