title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2184/87 of 22 July 1987 fixing the minimum
    price applicable to dried grapes during the marketing year 1987/88 as well as
    the countervailing charges to be imposed where that price is not observed, and
    amending Council Regulation (EEC) No 950/68
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2184/87 de la Commission du 22 juillet 1987 fixant
    le prix minimal à l' importation applicable aux raisins secs au cours de la campagne
    de commercialisation 1987/1988, ainsi que la taxe compensatoire à percevoir dans
    les cas où ce prix n' est pas respecté et modifiant le règlement (CEE) n°
    950/68 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2184/87 der Kommission vom 22. Juli 1987 zur Festsetzung
    des Mindesteinfuhrpreises für getrocknete Weintrauben im Wirtschaftsjahr 1987/88
    und der im Falle der Nichteinhaltung dieses Preises zu erhebenden Ausgleichsabgabe
    und zur Änderung der Verordnung (EWG) Nr. 950/68 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2184/87 af 22. juli 1987 om fastsættelse
    af minimumsimportprisen for tørrede druer i produktionsåret 1987/88 og af den
    udligningsafgift, der skal opkræves, hvis denne pris ikke overholdes, samt om
    ændring af Rådets forordning (EØF) nr. 950/68
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2184/87 της Επιτροπής
    της 22ας Ιουλίου 1987 που καθορίζει την ελάχιστη
    τιμή στην εισαγωγή, που εφαρμόζεται στις σταφίσες
    κατά τη διάρκεια της περιοδου εμπορίας 1987/88
    καθώς και την εξισωτική εισφορά που εισπράττεται
    στις περιπτώσεις που δεν τηρείται η τιμή αυτή
    και που τροποποιεί τον κανονισμό (ΕΟΚ) αριθ.
    950/68 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2184/87 della Commissione del 22 luglio 1987 che fissa,
    per la campagna di commercializzazione 1987/1988, il prezzo minimo all' importazione
    per le uve secche, nonché la tassa di compensazione applicabile qualora tale
    prezzo non sia rispettato, e modifica il regolamento (CEE) n. 950/68 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2184/87 van de Commissie van 22 juli 1987 tot vaststelling
    van de minimumprijs bij invoer van krenten en rozijnen voor het verkoopseizoen
    1987/1988 en van de compenserende heffing bij niet-inachtneming van deze prijs
    en tevens tot wijziging van Verordening (EEG) nr. 950/68 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2184/87 da Comissão de 22 Julho de 1987 que fixa
    o preço mínimo à importação aplicável às uvas secas durante a campanha
    de comercialização de 1987/1988 bem como o direito de compensação a cobrar
    caso este preço não seja respeitado e que altera o Regulamento (CEE) n.° 950/68
    do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2184/87 de la Comisión de 22 de julio de 1987 por
    el que se fija el precio mínimo a la importación aplicable a las pasas durante
    la campaña de comercialización 1987/88 así como el gravamen compensatorio que
    debe percibirse en aquellos casos en que el precio no haya sido respetado y por
    el que se modifica el Reglamento (CEE) n° 950/68 del Consejo
