schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission relative à la prorogation des mesures de sauvegarde
    accordées à la République italienne, le 27 juillet 1961, pour le plomb de brut
    (position du tarif douanier italien 78.01 A), pour le zinc brut (position du tarif
    douanier italien 79.01 A), et pour les déchets et débris de plomb (position
    du tarif douanier italien 78.01 B) et pour les déchets et débris de zinc (position
    du tarif douanier italien 79.01 B)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission zur Verlängerung der Geltungsdauer der Schutzmaßnahmen,
    zu deren Anwendung die Italienische Republik am 27. Juli 1961 für Rohblei (Tarifnummer
    78.01 A des italienischen Zolltarifs), für Rohzink (Tarifnummer 79.01 A des italienischen
    Zolltarifs) und am 28. Februar 1962 für Bearbeitungsabfälle und Schrott von
    Blei (Tarifnummer 78.01 B des italienischen Zolltarifs) und für Bearbeitungsabfälle
    und Schrott von Zink (Tarifnummer 79.01 B des italienischen Zolltarifs) ermächtigt
    worden ist
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa alla proroga delle misure di salvaguardia
    accordate il 27 luglio 1961 alla Repubblica Italiana per il piombo grezzo (voce
    della tariffa doganale italiana 78.01 A), per lo zinco grezzo (voce della tariffa
    doganale italiana 79.01 A) e il 28 febbraio 1962 per i cascami e rottami di piombo
    (voce della tariffa doganale italiana 78.01 B) e per i cascami e rottami di zinco
    (voce della tariffa doganale italiana 79.01 B)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de verlenging van de geldigheidsduur
    van de vrijwaringsmaatregelen tot toepassing waarvan de Italiaanse Republiek op
    27 juli 1961 voor ruw lood (post 78.01 A van het Italiaanse douanetarief), en
    ruw zink (post 79.01 A van het Italiaanse douanetarief), op 27 juli 1961 en voor
    resten en afvallen van lood (post 78.01 B van het Italiaanse douanetarief) en
    resten en afvallen van zink (post 79.01 B van het Italiaanse douanetarief) op
    28 februari 1962 werd gemachtigd
  type: main
