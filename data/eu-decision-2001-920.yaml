    denominazioni di bevande spiritose e bevande aromatizzate'
  type: main
- language: nl
  script: Latn
  content: '2001/920/EG: Besluit van de Raad van 4 december 2001 betreffende de sluiting
    van een Aanvullend Protocol tot aanpassing van de handelsaspecten van de Europa-overeenkomst
    waarbĳ een associatie tot stand wordt gebracht tussen de Europese Gemeenschappen
    en hun lidstaten, optredend in het kader van de Europese Unie, enerzĳds, en de
    Republiek Slovenië, anderzĳds, om rekening te houden met de uitkomst van de
    onderhandelingen tussen de partĳen over wederzĳdse preferentiële handelsconcessies
    voor bepaalde wĳnen, de wederzĳdse erkenning, bescherming en controle van wĳnbenamingen
