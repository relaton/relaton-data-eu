    dranken en gearomatiseerde dranken'
  type: main
- language: pt
  script: Latn
  content: '2001/920/CE: Decisão do Conselho, de 4 de Dezembro de 2001, relativa
    à celebração de um Protocolo Complementar de adaptação dos aspectos comerciais
    do Acordo Europeu que cria uma associação entre as Comunidades Europeias e os
    seus Estados-Membros, agindo no âmbito da União Europeia, por um lado, e a República
    da Eslovénia, por outro, de modo a ter em conta o resultado das negociações
    entre as partes sobre concessões preferenciais recíprocas em relação a certos
    vinhos, o reconhecimento,a protecção e o controlo recíprocos das denominações
    de vinhos e o reconhecimento, a protecção e o controlo recíprocos das denominações
    de bebidas espirituosas e de bebidas aromatizadas'
  type: main
- language: es
  script: Latn
  content: '2001/920/CE: Decisión del Consejo, de 4 de diciembre de 2001, relativa
    a la celebración de un Protocolo adicional de adaptación de los aspectos comerciales
    del Acuerdo europeo por el que se crea una asociación entre las Comunidades Europeas
    y sus Estados miembros, actuando en el marco de la Unión Europea, por un parte,
    y la República de Eslovenia, por otra, a fin de tener en cuenta el resultado
    de las negociaciones entre las Partes sobre concesiones preferenciales recíprocas
    para determinados vinos, reconocimiento, protección y control recíprocos de
    las denominaciones de los vinos y reconocimiento, protección y control recíprocos
    de las denominaciones de las bebidas espirituosas y aromatizadas'
  type: main
- language: sv
  script: Latn
  content: '2001/920/EG: Rådets beslut av den 4 december 2001 om ingående av ett
    tilläggsprotokoll om anpassning av handelsaspekterna i Europaavtalet om upprättandet
    av en associering mellan Europeiska gemenskaperna och deras medlemsstater, som
    handlar inom ramen för Europeiska unionen, å ena sidan, och Republiken Slovenien,
    å andra sidan, för att beakta resultaten av förhandlingarna mellan parterna
    om ömsesidiga förmånsmedgivanden för vissa viner, ömsesidigt erkännande
    och skydd och ömsesidig kontroll av beteckningar på viner samt ömsesidigt erkännande
    och skydd och ömsesidig kontroll av beteckningar för spritdrycker och aromatiserade
    drycker'
