  script: Latn
  content: '2001/920/CE: Decisione del Consiglio, del 4 dicembre 2001, relativa alla
    conclusione di un protocollo aggiuntivo di adeguamento degli aspetti commerciali
    dell''accordo europeo che istituisce un''associazione tra le Comunità europee
    e i loro Stati membri, che agiscono nel quadro dell''Unione europea, da una parte,
