title:
- language: en
  script: Latn
  content: '2001/920/EC: Council Decision of 4 December 2001 on the conclusion of
    an Additional Protocol adjusting the trade aspects of the Europe Agreement establishing
    an association between the European Communities and their Member States, acting
    within the framework of the European Union, of the one part, and the Republic
    of Slovenia, of the other part, to take account of the outcome of the negotiations
    between the parties on reciprocal preferential concessions for certain wines,
    the reciprocal recognition, protection and control of wine names and the reciprocal
    recognition, protection and control of designations for spirits and aromatised
    drinks'
  type: main
- language: fr
  script: Latn
  content: '2001/920/CE: Décision du Conseil du 4 décembre 2001 relative à la conclusion
    d''un protocole additionnel d''adaptation des aspects commerciaux de l''accord
    européen établissant une association entre les Communautés européennes et
    leurs États membres, agissant dans le cadre de l''Union européenne, d''une part,
    et la République de Slovénie, d''autre part, pour tenir compte des résultats
    des négociations entre les parties concernant l''établissement de concessions
    préférentielles réciproques pour certains vins, la reconnaissance, la protection
    et le contrôle réciproques des dénominations de vins, ainsi que la reconnaissance,
    la protection et le contrôle réciproques des appellations de spiritueux et de
    boissons aromatisées'
  type: main
- language: de
  script: Latn
  content: '2001/920/EG: Beschluss des Rates vom 4. Dezember 2001 über den Abschluss
    eines Zusatzprotokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zur
    Gründung einer Assoziation zwischen den im Rahmen der Europäischen Union handelnden
    Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der Republik
    Slowenien andererseits aufgrund der Ergebnisse der Verhandlungen zwischen den
    Parteien über gegenseitige präferenzielle Zugeständnisse für bestimmte Weine,
    über gegenseitige Anerkennung, Schutz und Kontrolle von Weinnamen und über gegenseitige
    Anerkennung, Schutz und Kontrolle von Bezeichnungen für Spirituosen und aromatisierte
    Getränke'
  type: main
- language: da
  script: Latn
  content: '2001/920/EF: Rådets afgørelse af 4. december 2001 om indgåelse af en
    tillægsprotokol om tilpasning af handelsaspekterne i Europaaftalen om oprettelse
    af en associering mellem De Europæiske Fællesskaber og deres medlemsstater,
    der optræder inden for rammerne af Den Europæiske Union, på den ene side og
    Republikken Slovenien på den anden side for at tage hensyn til resultatet af
    forhandlingerne mellem parterne om gensidige præferenceindrømmelser for visse
    vine, gensidig anerkendelse, beskyttelse og kontrol af vinbetegnelser og gensidig
    anerkendelse, beskyttelse og kontrol af betegnelser for spiritus og aromatiserede
    drikkevarer'
  type: main
- language: el
  script: Grek
  content: '2001/920/ΕΚ: Απόφαση του Συμβουλίου, της 4ης
    Δεκεμβρίου 2001, σχετικά με τη σύναψη ενός πρόσθετου
    πρωτοκόλλου για την προσαρμογή των εμπορικών
    θεμάτων της ευρωπαϊκής συμφωνίας σύνδεσης
