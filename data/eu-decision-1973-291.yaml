id: EUDecision1973291
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 September 1973 authorizing the Kingdom of Belgium
    and the Grand Duchy of Luxembourg not to apply Community treatment to table grapes
    falling within heading No 08.04 A I of the Common Customs Tariff originating in
    Albania and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/291/CEE de la Commission, du 7 septembre 1973, autorisant
    le Royaume de Belgique et le Grand- Duché de Luxembourg à exclure du traitement
    communautaire les raisins de table, de la position 08.04 A I du Tarif douanier
    commun, originaires d'Albanie et mis en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. September 1973, mit der das Königreich
    Belgien und das Großherzogtum Luxemburg ermächtigt werden, aus Albanien stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Tafeltrauben
    der Tarifnummer 08.04 A I des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 7. september 1973 om bemyndigelse for kongeriget
    Belgien og storhertugdømmet Luxembourg til fra fællesskabsbehandling at undtage
    druer til spisebrug, som henhører under position 08.04 A I i den fælles toldtarif,
    har oprindelse i Albanien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 settembre 1973, che autorizza il Regno
    del Belgio e il Granducato del Lussemburgo ad escludere dal trattamento comunitario
    le uve da tavola, della voce n. 08.04 A I della tariffa doganale comune, originarie
    dell'Albania e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 september 1973 waarbij het Koninkrijk
    België en het Groothertogdom Luxemburg worden gemachtigd druiven voor tafelgebruik
    van post 08.04 A I van het gemeenschappelijk douanetarief, van oorsprong uit Albanië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
