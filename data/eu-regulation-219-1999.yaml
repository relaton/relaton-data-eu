    sekä Slovenian tasavallan välisessä väliaikaisessa sopimuksessa määrätyn
    naudanlihaa koskevan tariffikiintiön osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 219/1999 della Commissione del 29 gennaio 1999 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel gennaio 1999 per i contingenti tariffari supplementari di carni
    bovine previsti dall'accordo interinale tra la Comunità e la Repubblica di Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 219/1999 van de Commissie van 29 januari 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in januari 1999
    ingediende aanvragen om invoercertificaten voor het tariefcontingent voor rundvlees
    dat bij de Interim-overeenkomst tussen de Gemeenschap en de Republiek Slovenië
    is vastgesteld
  type: main
