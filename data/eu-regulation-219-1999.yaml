title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 219/1999 of 29 January 1999 determining the
    extent to which applications submitted in January 1999 for import licences for
    the tariff quota for beef and veal provided for in the Interim Agreement between
    the Community and the Republic of Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 219/1999 de la Commission du 29 janvier 1999 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1999 pour le contingent tarifaire de viandes bovines prévu
    par l'accord intérimaire entre la Communauté et la république de Slovénie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 219/1999 der Kommission vom 29. Januar 1999 zur Bestimmung
    des Prozentsatzes, zu dem den im Januar 1999 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch im Rahmen des Zollkontingents gemäß
    dem zwischen der Gemeinschaft und der Republik Slowenien geschlossenen Interimsabkommen
    stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 219/1999 af 29. januar 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i januar 1999 om
    importlicenser for kød i forbindelse med det toldkontingent for oksekød, der
    er fastsat ved interimsaftalen mellem EF og Republikken Slovenien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 219/1999 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Ιανουαρίου 1999 για τον καθορισμό του
    βαθμού στον οποίο μπορούν να γίνουν αποδεκτές
    οι αιτήσεις χορηγήσεως πιστοποιητικών εισαγωγής
    που υποβλήθηκαν τον Ιανουάριο του 1999 για τη
    δασμολογική ποσόστωση βοείου κρέατος που προβλέπεται
    από την προσωρινή συμφωνία μεταξύ της Κοινότητας
    και της Δημοκρατίας της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 219/1999, annettu 29 päivänä tammikuuta 1999,
