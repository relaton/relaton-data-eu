  script: Latn
  content: '97/558/EC, Euratom: Commission Decision of 17 July 1997 amending Decision
    96/501/Euratom, EC, authorizing Portugal to use statistics for years earlier than
    the last year but one for the calculation of the VAT own resources base (Only
    the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/558/CE, Euratom: Décision de la Commission du 17 juillet 1997 modifiant
    la décision 96/501/Euratom, CE autorisant le Portugal à utiliser des données
    statistiques antérieures à la pénultième année pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
