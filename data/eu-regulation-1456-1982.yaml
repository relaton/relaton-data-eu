title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1456/82 of 18 May 1982 fixing for the 1982/83
    marketing year the list of those Community regions which qualify for aid for durum
    wheat and the amount of such aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1456/82 du Conseil, du 18 mai 1982, fixant, pour la
    campagne de commercialisation 1982/1983, la liste des régions de la Communauté
    qui bénéficient de l' aide pour le froment dur ainsi que le montant de cette
    aide
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1456/82 des Rates vom 18. Mai 1982 zur Festlegung
    der Liste der Regionen der Gemeinschaft, in denen die Hartweizenbeihilfe gewährt
    wird, sowie zur Festsetzung der Höhe dieser Beihilfe für das Wirtschaftsjahr
    1982/83
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1456/82 af 18. maj 1982 om fastsættelse
    for høståret 1982/83 af fortegnelsen over regioner i Fællesskabet for hvilke
    der kan ydes støtte til hård hvede samt støttebeløbet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1456/82 τού Συμβουλίου
    τής 18ης Μαΐου 1982 περί καθορισμού, γιά τήν περίοδο
    εμπορίας 1982/83, τού καταλόγου ορισμένων περιοχών
    τής Κοινότητος πού απολαύουν τής ενισχύσεως
    γιά τό σκληρό σίτο, καθώς καί τού ύψους τής
    ενισχύσεως αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1456/82 del Consiglio, del 18 maggio 1982, che fissa,
