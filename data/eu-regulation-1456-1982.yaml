    Comunità che beneficiano dell' aiuto per il frumento duro, nonché l' importo
    di tale aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1456/82 van de Raad van 18 mei 1982 tot vaststelling,
