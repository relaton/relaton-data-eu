  script: Latn
  content: Commission Regulation (EEC) No 2715/83 of 29 September 1983 fixing the
    difference in white sugar prices to be used in calculating the levy for processed
    fruit and vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2715/83 de la Commission, du 29 septembre 1983, fixant
    la différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2715/83 der Kommission vom 29. September 1983 zur
    Festsetzung des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse
    aus Obst und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds
    zwischen Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2715/83 af 29. september 1983 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2715/83 της Επιτροπής
