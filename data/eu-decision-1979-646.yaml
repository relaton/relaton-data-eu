title:
- language: en
  script: Latn
  content: '79/646/EEC: Commission Decision of 6 July 1979 on the reimbursement by
    the Guidance Section of the EAGGF to Ireland of expenditure incurred during 1977
    and additional expenditure declared for 1976 on aids relating to the provision
    of socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/646/CEE: Décision de la Commission, du 6 juillet 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à l''Irlande des dépenses effectuées pendant l''année
    1977 et des dépenses supplémentaires déclarées au titre de l''année 1976
    pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/646/EWG: Entscheidung der Kommission vom 6. Juli 1979 über die Rückvergütung
    der im Jahr 1977 für die sozio- ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten und zusätzlich für 1976
    nachgemeldeten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an Irland (Nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/646/EØF: Kommissionens beslutning af 6. juli 1979 om refusion gennem
    EUGFL, udviklingssektionen, til Irland af de udgifter, som er afholdt i løbet
    af året 1977, samt yderligere udgifter opgivet for 1976 til støtte vedrørende
    social og erhvervsmæssig vejledning og faglige kvalifikationer hos de personer,
    som arbejder i landbruget (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/646/CEE: Decisione della Commissione, del 6 luglio 1979, relativa al
    rimborso da parte del FEAOG, sezione orientamento, all''Irlanda delle spese effettuate
    durante il 1977 e di ulteriori spese relative al 1976 per gli aiuti concernenti
    l''informazione socio-economica e la qualificazione professionale delle persone
    che lavorano nell''agricoltura (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/646/EEG: Beschikking van de Commissie van 6 juli 1979 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan Ierland van de gedurende het jaar 1977
    gedane uitgaven en van aanvullende uitgaven voor 1976 voor steun met betrekking
    tot de sociaal-economische voorlichting en de scholing van personen die in de
    landbouw werkzaam zijn (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
