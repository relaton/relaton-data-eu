  script: Latn
  content: '2001/376/EC: Commission Decision of 18 April 2001 concerning measures
    made necessary by the occurrence of bovine spongiform encephalopathy in Portugal
    and implementing a date-based export scheme (Text with EEA relevance) (notified
    under document number C(2001) 834)'
  type: main
- language: fr
  script: Latn
  content: '2001/376/CE: Décision de la Commission du 18 avril 2001 concernant certaines
    mesures rendues nécessaires par les cas d''encéphalopathie spongiforme bovine
    apparus au Portugal et mettant en œuvre un régime d''exportation fondé sur
    la date (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro
    C(2001) 834]'
  type: main
- language: de
  script: Latn
