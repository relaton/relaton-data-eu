title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2199/82 of 6 August 1982 re-establishing
    the levying of customs duties on musk xylene, falling within subheading 29.03
    B ex II and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2199/82 de la Commission, du 6 août 1982, portant
    rétablissement de la perception des droits de douane applicables au muscxylène,
    de la sous-position 29.03 B ex II du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2199/82 der Kommission vom 6. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Xylolmoschus der Tarifstelle 29.03 B ex II, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werdenf
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2199/82 af 6. august 1982 om genindførelse
    af opkrævning af told for xylolmoskus, henhørende under pos. 29.03 B ex II og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2199/82 τής Επιτροπής
    τής 6ης Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τόν ξυλολικό μόσχο
    τής διακρίσεως 29. 03 Β ex II τού Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2199/82 della Commissione, del 6 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili al muschioxilene, della
    sottovoce 29.03 B ex II della tariffa doganale comune, originario della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2199/82 van de Commissie van 6 augustus 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op muskusxylene
    van tariefpostonderverdeling 29.03 B ex II, van oorsprong uit China, waarvoor
    de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleends
  type: main
