  content: Commission Regulation (EEC) No 3223/91 of 5 November 1991 authorizing the
    United Kingdom to permit under certain conditions an additional increase in the
    alcoholic strength of certain table wines
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3223/91 DE LA COMMISSION du 5 novembre 1991 autorisant
    le Royaume-Uni à permettre, sous certaines conditions, une augmentation supplémentaire
    du titre alcoométrique de certains vins de table #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3223/91 DER KOMMISSION vom 5. November 1991 zur Ermächtigung
    des Vereinigten Königreichs, unter bestimmten Voraussetzungen eine zusätzliche
    Erhöhung des Alkoholgehalts bestimmter Weine und besimmter zur Weinherstellung
    vorgesehener Erzeugnisse zu gestatten #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3223/91 af 5. november 1991 om bemyndigelse
    til Det Forenede Kongerige til under visse omstændigheder at tillade en yderligere
    forhøjelse af alkoholindholdet i visse bordvine
  type: main
- language: el
  script: Grek
