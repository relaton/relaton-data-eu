    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für 5 000 Stück Stiere,
    Kühe und Färsen bestimmter Höhenrassen, nicht zum Schlachten, der Tarifstelle
    ex 01.02 A II b) 2 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
