title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1522/97 of 30 July 1997 determining the extent
    to which applications lodged in July 1997 for licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, the Slovak Republic, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1522/97 DE LA COMMISSION du 30 juillet 1997 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1997 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque,
    la République slovaque, la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1522/97 DER KOMMISSION vom 30. Juli 1997 über die
    Festsetzung des Umfangs, in dem die im Juli 1997 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik, der Slowakischen Republik, Rumänien und Bulgarien genehmigt werden
    können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1522/97 af 30. juli 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1997 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske
    Republik, Rumænien og Republikken Bulgarien
  type: main
- language: el
  script: Grek
