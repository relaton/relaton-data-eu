    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Osama bin Ladenu, Alkaeda tinklu ir Talibanu, ir panaikinantį
    Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1607/2003 tat-12 ta' Settembru 2003
    li jemenda għat-22 darba r-Regolament tal-Kunsill (KE) Nru 881/2002 li jimponi
    ċerti miżuri speċifiċi restrittivi fir-rigward ta' ċerti persuni u entitajiet
    assoċjati ma' Usama bin Laden, in-networks ta' l-Al-Qaida u t-Talibani, u jħassar
    ir-Regolament tal-Kunsill (KE) Nru 467/2001
  type: main
