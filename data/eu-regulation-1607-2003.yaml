    osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom i talibanima
    te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1607/2003/EK rendelete (2003. szeptember 12.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet huszonkettedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1607/2003 della Commissione, del 12 settembre 2003,
    recante ventiduesima modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1607/2003 (2003. gada 12. septembris), ar kuru
