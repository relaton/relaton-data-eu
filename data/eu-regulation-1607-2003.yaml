    īpašus, ierobežojošus, pret noteiktām personām un organizācijām, kuras
    saistītas ar Osamu Bin Ladenu, organizācijas Al–Qaida tīklu un Taliban, vērstus
    pasākumus un ar ko atceļ Padomes Regulu (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2003 m. rugsėjo 12 d. Komisijos reglamentas (EB) Nr. 1607/2003, dvidešimt
