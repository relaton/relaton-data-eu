  content: Commission Regulation (EEC) No 1459/89 of 26 May 1989 on customs duties
    applicable to imports into the Community as constituted at 31 December 1985 of
    certain processed fruit and vegetable products from Spain and Portugal
  type: main
- language: fr
  script: Latn
