    aus Spanien und Portugal in die Gemeinschaft in ihrer Zusammensetzung vom 31.
    Dezember 1985 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1459/89 af 26. maj 1989 om de toldsatser,
