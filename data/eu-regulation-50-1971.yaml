id: EURegulation501971
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 50/71 of the Commission of 12 January 1971 amending,
    in respect of Bulgaria and Romania, Regulation (EEC) No 1054/68 determining the
    list of agencies certifying the admissibility to certain tariff headings of certain
    milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 50/71 de la Commission, du 12 janvier 1971, complétant,
    en ce qui concerne la Bulgarie et la Roumanie, le règlement (CEE) n° 1054/68
    établissant la liste des organismes émetteurs de certificats destinés à permettre
    l' admission de certains produits laitiers en provenance des pays tiers dans certaines
    positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 50/71 der Kommission vom 12. Januar 1971 zur Ergänzung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern in bezug auf Bulgarien und Rumänien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 50/71 af 12. januar 1971 der, vedrørende
    Bulgarien og Rumænien, supplerer forordning (EØF) nr. 1054/68 om oprettelse
    af en fortegnelse over de organer, der er kompetente til udstedelse af attester
    vedrørende visse fra tredjelande udførte mælkeprodukters henførelse under
    bestemte toldpositioner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 50/71 della Commissione, del 12 gennaio 1971, che
    completa, per quanto concerne la Bulgaria e la Romania, il regolamento (CEE) n.
    1054/68 che stabilisce l' elenco degli organismi emittenti dei certificati destinati
    a permettere l' ammissione in alcune voci tariffarie di taluni prodotti lattiero-caseari
    in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 50/71 van de Commissie van 12 januari 1971 tot aanvulling,
    met betrekking tot Bulgarije en Roemenië, van Verordening (EEG) nr. 1054/68 houdende
    vaststelling van de lijst van organisaties voor de afgifte van certificaten ten
    behoeve van de indeling van sommige zuivelprodukten uit derde landen onder bepaalde
    tariefposten
  type: main
