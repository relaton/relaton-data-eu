id: EURegulation10641980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1064/80 of 30 April 1980 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, earthenware or fine pottery, falling within
    subheading 69.12 C and originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1064/80 de la Commission, du 30 avril 1980, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et articles de ménage ou de toilette, en faïence ou en poterie fine, de la sous-position
    69.12 C du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1064/80 der Kommission vom 30. April 1980 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände aus Steingut
    oder feinen Erden, der Tarifstelle 69.12 C, mit Ursprung in Südkorea, dem die
    in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1064/80 af 30. april 1980 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af fajance eller fint ler, under pos. 69.12 C, som har oprindelse i Sydkorea og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1064/80 della Commissione, del 30 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili a vasellame e oggetti
    di uso domestico o da toletta, di terracotta fine o di terraglia, della sottovoce
    doganale 69.12 C originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1064/80 van de Commissie van 30 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op vaatwerk,
    huishoudelijke artikelen en toiletartikelen, van faïence of van fijn aardewerk,
    van post 69.12 C, van oorsprong uit Zuid-Korea ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
