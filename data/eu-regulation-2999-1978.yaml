  content: Commission Regulation (EEC) No 2999/78 of 15 December 1978 making the importation
    of textile products originating in the Hungarian People' s Republic subject to
    common rules for authorization and quantitative limitation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2999/78 de la Commission, du 15 décembre 1978, soumettant
    à un régime commun d' autorisation et de limitation quantitative les importations,
    dans la Communauté, de produits textiles originaires de la République populaire
    hongroise
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2999/78 der Kommission vom 15. Dezember 1978, mit
    der die Einfuhr von Textilwaren mit Ursprung in der Volksrepublik Ungarn in die
    Gemeinschaft einer Genehmigungspflicht und einer Höchstmengenregelung unterworfen
    wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2999/78 af 15. december 1978 om indførelse
