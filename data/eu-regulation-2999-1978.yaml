  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2999/78 della Commissione, del 15 dicembre 1978, che
    subordina l' importazione nella Comunità di prodotti tessili originari della
    Repubblica popolare ungherese ad un regime comune di autorizzazione e di limitazione
    quantitativa
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2999/78 van de Commissie van 15 december 1978 waarbij
