    von Equiden aus bestimmten vom West-Nil-Fieber befallenen Gebieten der Vereinigten
    Staaten von Amerika (Bekannt gegeben unter Aktenzeichen K(2000) 3254)'
  type: main
- language: da
  script: Latn
  content: '2000/713/EF: Kommissionens beslutning af 7. november 2000 om anden ændring
