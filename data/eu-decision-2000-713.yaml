    της Αμερικής και πλήττονται από πυρετό του
    Δυτικού Νείλου [κοινοποιηθείσα υπό τον αριθμό
    Ε(2000) 3254]'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 7 päivänä marraskuuta 2000, eräistä Länsi-Niilin
