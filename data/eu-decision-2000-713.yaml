title:
- language: en
  script: Latn
  content: '2000/713/EC: Commission Decision of 7 November 2000 amending for the second
    time Decision 2000/551/EC on certain protection measures with regard to equidae
    coming from certain parts of the United States of America affected by West Nile
    fever (notified under document number C(2000) 3254)'
  type: main
- language: fr
  script: Latn
  content: '2000/713/CE: Décision de la Commission du 7 novembre 2000 modifiant pour
    la deuxième fois la décision 2000/551/CE relative à certaines mesures de protection
    à l''égard des équidés en provenance de certaines parties des États-Unis
    d''Amérique touchées par la maladie à virus du Nil occidental [notifiée sous
    le numéro C(2000) 3254]'
  type: main
- language: de
  script: Latn
  content: '2000/713/EG: Entscheidung der Kommission vom 7. November 2000 zur zweiten
