title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2529/1999 of 30 November 1999 suspending
    the preferential customs duties and re-establishing the Common Customs Tariff
    duty on imports of multiflorous (spray) carnations originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2529/1999 de la Commission, du 30 novembre 1999, suspendant
    le droit de douane préférentiel et réinstaurant le droit du tarif douanier
    commun à l'importation d'oeillets multiflores (spray) originaires du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2529/1999 der Kommission vom 30. November 1999 zur
    Aussetzung des bei der Einfuhr von mehrblütigen (Spray) Nelken mit Ursprung in
    Marokko zu erhebenden Präferenzzolls und zur Wiedereinführung des Zolls des
    Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2529/1999 af 30. november 1999 om suspension
    af præferencetolden og genindførelse af tolden ifølge den fælles toldtarif
    ved indførsel af mangeblomstrede nelliker (spray) med oprindelse i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2529/1999 της Επιτροπής,
    της 30ής Νοεμβρίου 1999, για αναστολή του προτιμησιακού
    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή πολυανθών γαρίφαλων
    (Spray) καταγωγής Μαρόκου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2529/1999, annettu 30 päivänä marraskuuta
    1999, Marokosta peräisin olevien terttuneilikoiden (spraytyyppi) tuonnin etuustullin
    suspendoimisesta ja yhteisen tullitariffin tullin uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2529/1999 della Commissione, del 30 novembre 1999,
    che sospende il dazio doganale preferenziale e ripristina il dazio della tariffa
    doganale comune all'importazione di garofani a fiore multiplo (spray) originari
    del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2529/1999 van de Commissie van 30 november 1999 tot
    schorsing van het preferentiële douanerecht en tot wederinvoering van het recht
    van het gemeenschappelijk douanetarief bij invoer van veelbloemige anjers (tros)
    van oorsprong uit Marokko
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2529/1999 da Comissão, de 30 de Novembro de 1999,
    que suspende o direito aduaneiro preferencial e reinstaura o direito da pauta
    aduaneira comum na importação de cravos multifloros (spray) originários de
    Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2529/1999 de la Comisión, de 30 de noviembre de 1999,
    por el que se suspende el derecho de aduana preferencial y se restablece el derecho
    del arancel aduanero común a la importación de claveles de varias flores (spray)
    originarios de Marruecos
  type: main
- language: sv
