    Erstattung der Ausgaben des Jahres 1979 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an die Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/959/EØF: Kommissionens beslutning af 23. september 1980 om refusion
