title:
- language: en
  script: Latn
  content: '80/959/EEC: Commission Decision of 23 September 1980 on the reimbursement
    by the Guidance Section of the EAGGF, to the Federal Republic of Germany of expenditure
    incurred during 1979, in connection with Community measures for the eradication
    of brucellosis, tuberculosis and leucosis in cattle (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/959/CEE: Décision de la Commission, du 23 septembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole,
    section "orientation", à la République fédérale d''Allemagne des dépenses
    effectuées pendant l''année 1979 dans le cadre d''une action de la Communauté
    en vue de l''éradication de la brucellose, de la tuberculose et de la leucose
    des bovins (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
