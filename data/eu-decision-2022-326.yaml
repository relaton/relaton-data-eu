---
id: EUDecision2022326
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/326 of 24 February 2022 amending
    Implementing Decision (EU) 2019/961 authorising a provisional measure taken by
    the French Republic in accordance with Article 129 of Regulation (EC) No 1907/2006
    of the European Parliament and of the Council concerning the Registration, Evaluation,
    Authorisation and Restriction of Chemicals (REACH) to restrict the use and the
    placing on the market of certain wood treated with creosote and other creosote-related
    substances (notified under document C(2022) 1074) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/326 de la Commission du 24 février
    2022 modifiant la décision d’exécution (UE) 2019/961 autorisant une mesure
    provisoire prise par la République française conformément à l’article 129
    du règlement (CE) no 1907/2006 du Parlement européen et du Conseil concernant
    l’enregistrement, l’évaluation et l’autorisation des substances chimiques,
    ainsi que les restrictions applicables à ces substances (REACH), afin de restreindre
    l’utilisation et la mise sur le marché de certains bois traités avec de la
    créosote et avec d’autres substances apparentées [notifiée sous le numéro
    C(2022) 1074] (Le texte en langue française est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/326 der Kommission vom 24. Februar 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2019/961 zur Genehmigung der
    von der Französischen Republik nach Artikel 129 der Verordnung (EG) Nr. 1907/2006
    des Europäischen Parlaments und des Rates zur Registrierung, Bewertung, Zulassung
    und Beschränkung chemischer Stoffe (REACH) ergriffenen vorläufigen Maßnahme
    zur Beschränkung der Verwendung und des Inverkehrbringens von bestimmtem, mit
    Kreosot und anderen, mit Kreosot verwandten Stoffen behandeltem Holz (Bekannt
    gegeben unter Aktenzeichen (C(2022) 1074) (Nur der französische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/326 на Комисията
    от 24 февруари 2022 година за изменение на Решение
    (ЕС) 2019/961 за разрешаване на временна мярка,
    предприета от Френската република в съответствие
    с член 129 от Регламент (ЕО) № 1907/2006 на Европейския
    парламент и на Съвета относно регистрацията,
    оценката, разрешаването и ограничаването на
    химикали (REACH), за ограничаване на използването
    и пускането на пазара на обработена с креозот
    дървесина и други свързани с креозот вещества
    (нотифицирано под номер C(2022) 1074) (само текстът
    на френски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/326 ze dne 24. února 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2019/961, kterým se schvaluje prozatímní
    opatření přijaté Francouzskou republikou v souladu s článkem 129 nařízení
    Evropského parlamentu a Rady (ES) č. 1907/2006 o registraci, hodnocení, povolování
    a omezování chemických látek za účelem omezení používání a uvádění
    na trh některého dřeva ošetřeného kreosotem a jinými látkami souvisejícími
    s kreosotem (oznámeno pod číslem C(2022) 1074) (Pouze francouzské znění
    je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/326 af 24. februar 2022
    om ændring af gennemførelsesafgørelse (EU) 2019/961 om godkendelse af den foreløbige
    foranstaltning truffet af Den Franske Republik i henhold til artikel 129 i Europa-Parlamentets
    og Rådets forordning (EF) nr. 1907/2006 om registrering, vurdering og godkendelse
    af samt begrænsninger for kemikalier (REACH) for at begrænse anvendelsen og
    markedsføringen af visse typer træ behandlet med creosot og andre hermed beslægtede
    stoffer (meddelt under nummer C(2022) 1074) (Kun den franske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2022/326 της Επιτροπής
    της 24ης Φεβρουαρίου 2022 για την τροποποίηση
    της εκτελεστικής απόφασης (ΕΕ) 2019/961 που επιτρέπει
    το προσωρινό μέτρο το οποίο έλαβε η Γαλλική
    Δημοκρατία σύμφωνα με το άρθρο 129 του κανονισμού
    (ΕΚ) αριθ. 1907/2006 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου για την καταχώριση, την
    αξιολόγηση, την αδειοδότηση και τους περιορισμούς
    των χημικών προϊόντων (REACH), ώστε να περιορίσει
    τη χρήση και τη διάθεση στην αγορά ορισμένων
    ξύλων που έχουν υποστεί επεξεργασία με κρεόσωτο
    και με άλλες ουσίες συναφείς με το κρεόσωτο
    [κοινοποιηθείσα υπό τον αριθμό C(2022) 1074] (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/326, 24. veebruar 2022, millega muudetakse
    rakendusotsust (EL) 2019/961, millega lubatakse kohaldada Prantsuse Vabariigi
    võetud ajutist meedet piirata kreosoodi ja muude kreosoodiga seotud ainetega
    töödeldud puidu kasutamist ja turulelaskmist vastavalt Euroopa Parlamendi ja
    nõukogu määruse (EÜ) nr 1907/2006 (mis käsitleb kemikaalide registreerimist,
    hindamist, autoriseerimist ja piiramist (REACH)) artiklile 129 (teatavaks tehtud
    numbri C(2022) 1074 all) (Ainult prantsuskeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/326, annettu 24 päivänä
    helmikuuta 2022, tietyn kreosootilla ja muilla kreosoottiin liittyvillä aineilla
    käsitellyn puun käytön ja markkinoille saattamisen rajoittamista koskevan Ranskan
    tasavallan toteuttaman väliaikaisen toimenpiteen hyväksymisestä kemikaalien
    rekisteröinnistä, arvioinnista, lupamenettelyistä ja rajoituksista (REACH)
    annetun Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1907/2006 129 artiklan
    mukaisesti annetun täytäntöönpanopäätöksen (EU) 2019/961 muuttamisesta
    (tiedoksiannettu numerolla C(2022) 1074) (Ainoastaan ranskankielinen teksti on
    todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/326 ón gCoimisiún an 24 Feabhra 2022
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2019/961 lena n-údaraítear beart
    sealadach arna ghlacadh ag Poblacht na Fraince i gcomhréir le hAirteagal 129
    de Rialachán (CE) Uimh. 1907/2006 ó Pharlaimint na hEorpa agus ón gComhairle
    maidir le Clárú, Meastóireacht, Údarú, agus Srianadh Ceimiceán (REACH) chun
    srian a chur ar úsáid agus ar chur ar an margadh adhmad áirithe atá cóireáilte
    le créasóid agus substaintí eile gaolmhara (a bhfuil fógra tugtha ina leith
    faoi dhoiciméad C(2022) 1074) (Is é an téacs i bhFraincis atá barántúil,
    agus an téacs sin amháin)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/326 оd 24. veljače 2022. o izmjeni
    Provedbene odluke (EU) 2019/961 o odobravanju privremene mjere koju je Francuska
    Republika poduzela u skladu s člankom 129. Uredbe (EZ) br. 1907/2006 Europskog
    parlamenta i Vijeća o registraciji, evaluaciji, autorizaciji i ograničavanju
    kemikalija (REACH) kako bi ograničila uporabu i stavljanje na tržište određenog
    drva tretiranog kreozotom i drugim tvarima sličnima kreozotu (priopćeno pod
    brojem dokumenta C(2022) 1074) (Vjerodostojan je samo tekst na francuskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/326 végrehajtási határozata (2022. február 24.)
    a Francia Köztársaság által a vegyi anyagok regisztrálásáról, értékeléséről,
    engedélyezéséről és korlátozásáról (REACH) szóló 1907/2006/EK európai
    parlamenti és tanácsi rendelet 129. cikkével összhangban hozott bizonyos,
    kreozottal vagy egyéb kreozotjellegű anyaggal kezelt faanyagok használatának
    és forgalomba hozatalának korlátozására irányuló átmeneti intézkedés
    engedélyezéséről szóló (EU) 2019/961 bizottsági végrehajtási határozat
    módosításáról (az értesítés a C(2022) 1074. számú dokumentummal történt)
    (Csak a francia nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/326 della Commissione del 24 febbraio
    2022 che modifica la decisione di esecuzione (UE) 2019/961 che autorizza una misura
    provvisoria adottata dalla Repubblica francese a norma dell’articolo 129 del
    regolamento (CE) n. 1907/2006 del Parlamento europeo e del Consiglio concernente
    la registrazione, la valutazione, l’autorizzazione e la restrizione delle sostanze
    chimiche (REACH) al fine di limitare l’uso e l’immissione sul mercato di alcuni
    tipi di legno trattato con creosoto e altre sostanze legate al creosoto [notificata
    con il numero C(2022) 1074] (Il testo in lingua francese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/326 (2022. gada 24. februāris),
    ar kuru groza Īstenošanas lēmumu (ES) 2019/961, ar ko, lai ierobežotu tādas
    noteiktas koksnes izmantošanu un laišanu tirgū, kura apstrādāta ar kreozotu
    un citām kreozotam radniecīgām vielām, atļauj pagaidu pasākumu, kuru Francijas
    Republika veikusi saskaņā ar 129. pantu Eiropas Parlamenta un Padomes Regulā
    (EK) Nr. 1907/2006, kas attiecas uz ķimikāliju reģistrēšanu, vērtēšanu,
    licencēšanu un ierobežošanu (REACH) (izziņots ar dokumenta numuru C(2022)
    1074) (Autentisks ir tikai teksts franču valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/326 2022 m. vasario 24 d.
    kuriuo iš dalies keičiamas Įgyvendinimo sprendimas (ES) 2019/961, kuriuo pagal
    Europos Parlamento ir Tarybos reglamento (EB) Nr. 1907/2006 dėl cheminių medžiagų
    registracijos, įvertinimo, autorizacijos ir apribojimų (REACH) 129 straipsnį
    Prancūzijos Respublikai leidžiama taikyti laikinąją priemonę tam tikros kreozotu
    ir kitomis kreozotui giminingomis medžiagomis apdorotos medienos naudojimui ir
    tiekimui rinkai apriboti (pranešta dokumentu Nr. C(2022) 1074) (Tekstas autentiškas
    tik prancūzų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/326 tal-24
    ta’ Frar 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2019/961
    li awtorizza miżura proviżorja meħuda mir-Repubblika Franċiża f’konformità
    mal-Artikolu 129 tar-Regolament (KE) Nru 1907/2006 tal-Parlament Ewropew u tal-Kunsill
    dwar ir-Reġistrazzjoni, il-Valutazzjoni, l-Awtorizzazzjoni u r-Restrizzjoni ta’
    Sustanzi Kimiċi (REACH) biex tirrestrinġi l-użu u t-tqegħid fis-suq ta’
    ċertu injam trattat bil-kreożot u b’sustanzi oħra relatati mal-kreożot (notifikata
    bid-dokument C(2022) 1074) (It-test bil-Franċiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/326 van de Commissie van 24 februari 2022
    tot wijziging van Uitvoeringsbesluit (EU) 2019/961 tot goedkeuring van de Franse
    voorlopige maatregel overeenkomstig artikel 129 van Verordening (EG) nr. 1907/2006
    van het Europees Parlement en de Raad inzake de registratie en beoordeling van
    en de autorisatie en beperkingen ten aanzien van chemische stoffen (Reach) ter
    beperking van het gebruik en het in de handel brengen van bepaald met creosoot
    en andere aan creosoot verwante stoffen behandeld hout (Kennisgeving geschied
    onder nummer C(2022) 1074) (Slechts de tekst in de Franse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/326 z dnia 24 lutego 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2019/961 w sprawie zezwolenia na wprowadzenie przez
    Republikę Francuską środka tymczasowego zgodnie z art. 129 rozporządzenia
    (WE) nr 1907/2006 Parlamentu Europejskiego i Rady w sprawie rejestracji, oceny,
    udzielania zezwoleń i stosowanych ograniczeń w zakresie chemikaliów (REACH),
    w celu ograniczenia stosowania i wprowadzania do obrotu określonego drewna zaimpregnowanego
    kreozotem i innymi substancjami powiązanymi z kreozotem (notyfikowana jako dokument
    nr C(2022) 1074) (Jedynie tekst w języku francuskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/326 da Comissão de 24 de fevereiro de
    2022 que altera a Decisão de Execução (UE) 2019/961 que autoriza uma medida
    provisória tomada pela República Francesa em conformidade com o artigo 129.o
    do Regulamento (CE) n.o 1907/2006 do Parlamento Europeu e do Conselho relativo
    ao registo, avaliação, autorização e restrição dos produtos químicos (REACH)
    para restringir a utilização e a colocação no mercado de determinadas madeiras
    tratadas com creosoto e outras substâncias relacionadas com creosoto [notificada
    com o número C(2022) 1074] (Apenas faz fé o texto na língua francesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/326 a Comisiei din 24 februarie
    2022 de modificare Deciziei de punere în aplicare (UE) 2019/961 de autorizare
    a unei măsuri provizorii luate de Republica Franceză, în conformitate cu articolul
    129 din Regulamentul (CE) nr. 1907/2006 al Parlamentului European și al Consiliului
    privind înregistrarea, evaluarea, autorizarea și restricționarea substanțelor
    chimice (REACH), de a restricționa utilizarea și introducerea pe piață a anumitor
    tipuri de lemn tratat cu creozot și cu alte substanțe înrudite [notificată
    cu numărul C(2022) 1074] (Numai textul în limba franceză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/326 z 24. februára 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/961, ktorým sa povoľuje dočasné
    opatrenie prijaté Francúzskou republikou v súlade s článkom 129 nariadenia
    Európskeho parlamentu a Rady (ES) č. 1907/2006 o registrácii, hodnotení, autorizácii
    a obmedzovaní chemikálií (REACH) na obmedzenie používania určitého dreva
    ošetreného kreozotom a látkami príbuznými kreozotu a jeho uvádzania na trh
    [oznámené pod číslom C(2022) 1074] (Iba francúzske znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/326 z dne 24. februarja 2022 o spremembi
    Izvedbenega sklepa (EU) 2019/961 o odobritvi začasnega ukrepa, ki ga je Francoska
    republika sprejela v skladu s členom 129 Uredbe (ES) št. 1907/2006 Evropskega
    parlamenta in Sveta o registraciji, evalvaciji, avtorizaciji in omejevanju kemikalij
    (REACH), da bi omejila uporabo in dajanje v promet nekaterega lesa, obdelanega
    s kreozotom in drugimi snovmi, povezanimi s kreozotom (notificirano pod dokumentarno
    številko C(2022) 1074) (Besedilo v francoskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/326 de la Comisión de 24 de febrero
    de 2022 que modifica la Decisión de Ejecución (UE) 2019/961, por la que se autoriza
    una medida provisional tomada por la República Francesa de conformidad con el
    artículo 129 del Reglamento (CE) n.o 1907/2006 del Parlamento Europeo y del Consejo,
    relativo al registro, la evaluación, la autorización y la restricción de las
    sustancias y mezclas químicas (REACH), a fin de restringir el uso y la comercialización
    de determinadas maderas tratadas con creosota y otras sustancias relacionadas
    con la creosota [notificada con el número C(2022) 1074] (El texto en lengua francesa
    es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/326 av den 24 februari 2022
    om ändring av genomförandebeslut (EU) 2019/961 om godkännande av en provisorisk
    åtgärd som vidtagits av Republiken Frankrike i enlighet med artikel 129 i Europaparlamentets
    och rådets förordning (EG) nr 1907/2006 om registrering, utvärdering, godkännande
    och begränsning av kemikalier (Reach) vad gäller begränsning av användning
    och utsläppande på marknaden av visst trä som behandlats med kreosot och andra
    kreosotrelaterade ämnen [delgivet med nr C(2022) 1074] (Endast den franska texten
    är giltig)
