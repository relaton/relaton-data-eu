    Tangerinen und anderen ähnlichen Kreuzungen von Zitrusfrüchten aus Algerien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2375/70 della Commissione, del 25 novembre 1970, che
    istituisce una tassa di compensazione all'importazione di mandarini, satsumas,
    clementine, tangerine ed altri similari di agrumi in provenienza dall'Algeria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2375/70 van de Commissie van 25 november 1970 houdende
    instelling van een compenserende heffing bij invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Algerië
