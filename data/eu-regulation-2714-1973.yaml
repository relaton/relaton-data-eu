  content: Regulation (EEC) No 2714/73 of the Commission of 27 September 1973 determining
    the amounts of the variable components and compensatory amounts, and the additional
    duties applicable, during the fourth quarter of 1973 to the goods covered by Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2714/73 de la Commission, du 27 septembre 1973, déterminant
