    les droits additionnels applicables, pendant le quatrième trimestre de l'année
    1973, aux marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2714/73 der Kommission vom 27. September 1973 zur
    Festsetzung der Höhe der im vierten Vierteljahr 1973 bei der Einfuhr der unter
    die Verordnung (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge,
    Ausgleichsbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2714/73 af 27. september 1973 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    varer henhørende under forordning (EØF) nr. 1059/69 i fjerde kvartal 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2714/73 della Commissione, del 27 settembre 1973,
    che determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il quarto trimestre 1973,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2714/73 van de Commissie van 27 september 1973 tot
