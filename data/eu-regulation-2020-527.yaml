title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/527 of 15 April 2020 re-imposing
    a definitive anti-dumping duty on imports of tubes and pipes of ductile cast iron
    (also known as spheroidal graphite cast iron) originating in India as regards
    Jindal Saw Limited following the judgment of the General Court in T-301/16
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/527 de la Commission du 15 avril 2020
    réinstituant un droit antidumping définitif sur les importations de tubes et
    de tuyaux en fonte ductile (également dénommée «fonte à graphite sphéroïdal»)
    originaires de l’Inde en ce qui concerne Jindal Saw Limited, à la suite de
    l’arrêt du Tribunal dans l’affaire T‐301/16
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/527 der Kommission vom 15. April 2020
    zur Wiedereinführung eines endgültigen Antidumpingzolls auf die Einfuhren von
    Rohren aus duktilem Gusseisen (auch bekannt als Gusseisen mit Kugelgrafit) mit
    Ursprung in Indien in Bezug auf Jindal Saw Limited nach dem Urteil des Gerichts
    in der Rechtssache T-301/16
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/527 на Комисията
    от 15 април 2020 година за повторно налагане на
    окончателно антидъмпингово мито върху вноса
    на тръби от пластичен чугун (наричан също сферографитен
    чугун) с произход от Индия по отношение на Jindal
    Saw Limited след решението на Общия съд по дело T-301/16
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/527 ze dne 15. dubna 2020, kterým
    se opětovně ukládá konečné antidumpingové clo na dovoz trub a trubek z
    tvárné litiny (známé také jako litina s kuličkovým grafitem) pocházejících
    z Indie, pokud jde o společnost Jindal Saw Limited, v návaznosti na rozsudek
    Tribunálu ve věci T-301/16
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/527 af 15. april 2020
    om genindførelse af en endelig antidumpingtold på importen af visse rør af
    duktilt støbejern (også kendt som kuglegrafitstøbejern) med oprindelse i Indien
    for så vidt angår Jindal Saw Limited som følge af Rettens dom i sag T-301/16
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/527 της Επιτροπής
    της 15ης Απριλίου 2020 για την εκ νέου επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    σωλήνων κάθε είδους από όλκιμο χυτοσίδηρο
    (που είναι επίσης γνωστός ως χυτοσίδηρος σφαιροειδούς
    γραφίτη), καταγωγής Ινδίας, όσον αφορά την Jindal
    Saw Limited, μετά την απόφαση του Γενικού Δικαστηρίου
    στην υπόθεση T-301/16
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/527, 15. aprill 2020, millega kehtestatakse
