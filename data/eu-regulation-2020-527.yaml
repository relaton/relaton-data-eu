    Indiast pärit keragrafiitmalmist (kõrgtugevast malmist) torude impordi suhtes
    seoses äriühinguga Jindal Saw Limited
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2020/527, annettu 15 päivänä
    huhtikuuta 2020, lopullisen polkumyyntitullin ottamisesta uudelleen käyttöön
    Intiasta peräisin olevien pallografiittiraudasta (tunnetaan myös nimellä pallografiittivalurauta)
    valmistettujen putkien tuonnissa Jindal Saw Limitedin osalta unionin yleisen tuomioistuimen
    asiassa T-301/16 antaman tuomion perusteella
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/527 оd 15. travnja 2020. o ponovnom
    uvođenju konačne antidampinške pristojbe na uvoz cijevi od duktilnog lijevanog
    željeza (poznato i kao sferoidno grafitno lijevano željezo) podrijetlom iz Indije
    u pogledu društva Jindal Saw Limited na temelju presude Općeg suda u predmetu
    T-301/16
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/527 végrehajtási rendelete (2020. április 15.)
    a Törvényszék T-301/16. sz. ügyben hozott ítéletét követően az Indiából
    származó alakítható öntöttvasból (más néven gömbgrafitos öntöttvasból)
    készült csövek behozatalára vonatkozó végleges dömpingellenes vámnak a
    Jindal Saw Limited tekintetében történő ismételt kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/527 della Commissione del 15 aprile
    2020 che istituisce nuovamente un dazio antidumping definitivo sulle importazioni
    di tubi di ghisa duttile (detta anche ghisa a grafite sferoidale) originari dell’India
    per quanto concerne Jindal Saw Limited a seguito della sentenza del Tribunale
    nella causa T-301/16
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/527 (2020. gada 15. aprīlis),
    ar ko pēc Vispārējās tiesas sprieduma lietā T-301/16 atkārtoti nosaka galīgo
    antidempinga maksājumu Indijas izcelsmes plastiskā čuguna (saukta arī par
    čugunu ar lodveida grafītu) cauruļu un caurulīšu importam attiecībā uz
    Jindal Saw Limited
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/527 2020 m. balandžio 15
    d. kuriuo, atsižvelgiant į Bendrojo Teismo sprendimą byloje T-301/16, importuojamiems
    Indijos kilmės kaliojo ketaus (dar vadinamo ketumi su rutuliniu grafitu) vamzdžiams
    ir vamzdeliams, pagamintiems bendrovės „Jindal Saw Limited“, vėl nustatomas
    galutinis antidempingo muitas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/527 tal-15
    ta’ April 2020 li jimponi mill-ġdid dazju anti-dumping definittiv fuq l-importazzjonijiet
    ta’ tubi u ta’ pajpijiet tal-ħadid fondut duttili (magħruf ukoll bħala
    grafit tal-ħadid fondut sferojdali) li joriġinaw mill-Indja fir-rigward ta’
    Jindal Saw Limited wara s-sentenza tal-Qorti Ġenerali f’T-301/16
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/527 van de Commissie van 15 april 2020
    tot het opnieuw instellen van een definitief antidumpingrecht op buizen en pijpen
    van nodulair gietijzer (eveneens bekend als gietijzer met bolgrafiet), van oorsprong
    uit India, wat Jindal Saw Limited betreft, naar aanleiding van het arrest van
    het Gerecht in zaak T-301/16
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2020/527 z dnia 15 kwietnia 2020
    r. ponownie nakładające ostateczne cło antydumpingowe na przywóz rur i przewodów
    rurowych z żeliwa ciągliwego (zwanego także żeliwem sferoidalnym) pochodzących
    z Indii w odniesieniu do Jindal Saw Limited w związku z wyrokiem Sądu w sprawie
    T-301/16
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2020/527 da Comissão de 15 de abril de
    2020 que reinstitui um direito anti-dumping definitivo sobre as importações
    de tubos de ferro fundido dúctil (também conhecido como ferro fundido com grafite
    esferoidal) originários da Índia, no que diz respeito à Jindal Saw Limited,
    na sequência do acórdão do Tribunal Geral no processo T-301/16
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/527 al Comisiei din 15 aprilie
    2020 de reinstituire a unei taxe antidumping definitive asupra importurilor de
    tuburi și țevi din fontă ductilă (cunoscută și sub denumirea de fontă cu
    grafit sferoidal) originare din India în ceea ce privește Jindal Saw Limited,
    ca urmare a hotărârii Tribunalului în cauza T‐301/16
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/527 z 15. apríla 2020, ktorým
    sa v nadväznosti na rozsudok Všeobecného súdu vo veci T-301/16 opätovne ukladá
    konečné antidumpingové clo na dovoz rúr a rúrok z tvárnej liatiny (tiež
    známej ako liatina s guľôčkovým grafitom) s pôvodom v Indii, pokiaľ ide
    o spoločnosť Jindal Saw Limited
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/527 z dne 15. aprila 2020 o ponovni
    uvedbi dokončne protidampinške dajatve na uvoz cevi iz nodularnega litega železa
    (imenovanega tudi sferoidno grafitno lito železo) s poreklom iz Indije za družbo
    Jindal Saw Limited po sodbi Splošnega sodišča v zadevi T-301/16
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2020/527 de la Comisión de 15 de abril de
    2020 por el que se restablece un derecho antidumping definitivo sobre las importaciones
    de tubos de hierro de fundición maleable (también conocida como fundición de
    grafito esferoidal) originarios de la India, en lo que respecta a Jindal Saw Limited
    a raíz de la sentencia del Tribunal General en el asunto T-301/16
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2020/527 av den 15 april 2020
    om återinförande av en slutgiltig antidumpningstull på import av rör av duktilt
    gjutjärn (även kallat gjutjärn med sfäroidiserad grafit) med ursprung i Indien
    när det gäller Jindal Saw Limited till följd av tribunalens dom i mål T-301/16
