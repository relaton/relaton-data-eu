  content: Council Regulation (EEC) No 320/90 of 5 February 1990 laying down certain
    technical measures for the conservation of fishery resources in the regulatory
    area as defined in the convention on future multilateral cooperation in the Northwest
    Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 320/90 du Conseil du 5 février 1990 fixant certaines
    mesures techniques de conservation des ressources de pêche dans la zone de réglementation
    définie à la convention sur la future coopération multilatérale dans les pêches
    de l'Atlantique du Nord- Ouest
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 320/90 DES RATES vom 5. Februar 1990 mit technischen
    Massnahmen fuer die Erhaltung der Fischbestaende im Regelungsbereich des Uebereinkommens
    ueber die kuenftige multilaterale Zusammenarbeit auf dem Gebiet der Fischerei
    im Nordwestatlantik
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 320/90 af 5. februar 1990 om fastsættelse
    af tekniske foranstaltninger til bevarelse af fiskeressourcerne i det regulerede
    område, der er defineret i konventionen om det fremtidige multilaterale samarbejde
    vedrørende fiskeriet i det nordvestlige Atlanterhav
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 320/90 του Συμβουλίου
    της 5ης Φεβρουαρίου 1990 που θεσπίζει ορισμένα
    τεχνικά μέτρα για τη διατήρηση των αλιευτικών
    πόρων στη ζώνη διακανονισμού που ορίζεται
    στη σύμβαση περί της μελλοντικής πολυμερούς
    συνεργασίας στον τομέα της αλιείας του Βορειοδυτικού
    Ατλαντικού
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 320/90 DEL CONSIGLIO del 5 febbraio 1990 che stabilisce
    alcune misure tecniche di conservazione delle risorse alieutiche della zona di
    regolamentazione definita dalla convenzione sulla futura cooperazione multilaterale
    per la pesca nell'Atlantico nord-occidentale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 320/90 VAN DE RAAD van 5 februari 1990 houdende vaststelling
    van technische maatregelen voor de instandhouding van de visbestanden in het gereglementeerde
    gebied als omschreven in het Verdrag inzake toekomstige multilaterale samenwerking
    op visserijgebied in het noordwestelijk deel van de Atlantische Oceaan
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 320/90 DO CONSELHO de 5 de Fevereiro de 1990 que estabelece
    determinadas medidas técnicas de conservaçao dos recursos da pesca na area de
    regulamentaçao definida pela Convençao sobre a futura Cooperaçao Multilateral
    nas Pescarias do Noroeste do Atlântico
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 320/90 DEL CONSEJO de 5 de febrero de 1990 por el que
    se establecen determinadas medidas técnicas para la conservacion de los recursos
    pesqueros en la zona de regulacion definida en el convenio internacional sobre
    la futura cooperacion multilateral en los caladeros del Atlantico noroccidental
  type: main
