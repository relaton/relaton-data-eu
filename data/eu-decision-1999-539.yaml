    Ιουλίου 1999 για τροποποίηση της απόφασης 98/372/ΕΚ
    της Επιτροπής σχετικά με τους υγειονομικούς
    όρους και την κτηνιατρική πιστοποίηση για
    τις εισαγωγές ζώντων βοοειδών και χοιροειδών
    από ορισμένες ευρωπαϊκές χώρες ώστε να ληφθούν
    υπόψη ορισμένα θέματα σχετικά με τη Βουλγαρία
    και την Τσεχική Δημοκρατία [κοινοποιηθείσα
