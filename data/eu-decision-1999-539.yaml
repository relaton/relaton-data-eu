    elävien naudan- ja siansukuisten eläinten tuonnissa eräistä Euroopan maista
    tehdyn päätöksen 98/372/EY muuttamisesta eräiden Bulgariaa ja Tsekkiä koskevien
    seikkojen huomioon ottamiseksi (tiedoksiannettu numerolla K(1999) 2437)'
  type: main
- language: it
  script: Latn
  content: '1999/539/CE: Decisione della Commissione del 26 luglio 1999 che modifica
