title:
- language: en
  script: Latn
  content: '1999/539/EC: Commission Decision of 26 July 1999 amending Decision 98/372/EC
    concerning the animal health conditions and veterinary certifications for import
    of live animals of bovine and swine species from certain European countries to
    take into account some aspects in relation with Bulgaria and the Czech Republic
    (notified under document number C(1999) 2437)'
  type: main
- language: fr
  script: Latn
  content: '1999/539/CE: Décision de la Commission du 26 juillet 1999 modifiant la
    décision 98/372/CE concernant les conditions de police sanitaire et les certificats
    sanitaires requis à l''importation d''animaux vivants des espèces bovine et
    porcine en provenance de certains pays européens afin de tenir compte de certains
    aspects concernant la Bulgarie et la République tchèque [notifiée sous le numéro
    C(1999) 2437]'
  type: main
- language: de
  script: Latn
  content: '1999/539/EG: Entscheidung der Kommission vom 26. Juli 1999 zur Änderung
    der Entscheidung 98/372/EG zur Festlegung der Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von lebenden Rindern und Schweinen aus bestimmten europäischen
    Ländern in bezug auf Bulgarien und die Tschechische Republik (Bekanntgegeben
    unter Aktenzeichen K(1999) 2437)'
  type: main
- language: da
  script: Latn
  content: '1999/539/EF: Kommissionens beslutning af 26. juli 1999 om ændring af
    beslutning 98/372/EF om dyresundhedsbetingelser og udstedelse af sundhedscertifikat
    ved indførsel af kvæg og svin fra visse europæiske lande for at tage hensyn
    til nogle aspekter hvad angår Bulgarien og Tjekkiet (meddelt under nummer K(1999)
    2437)'
  type: main
- language: el
  script: Grek
