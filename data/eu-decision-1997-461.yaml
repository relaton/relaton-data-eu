title:
- language: en
  script: Latn
  content: '97/461/EC: Commission Decision of 27 June 1997 allocating import quotas
    for the fully halogenated chlorofluorocarbons 11, 12, 113, 114 and 115, other
    fully halogenated chlorofluorocarbons, halons, carbon tetrachloride, 1,1,1-trichloroethane,
    hydrobromofluorocarbons and methyl bromide for the period 1 January to 31 December
    1997, and in addition, allocating placing on the market quotas for hydrochlorofluorocarbons
    for the period 1 January to 31 December 1997 (Only the Dutch, English, French,
    German, Greek, Italian and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/461/CE: Décision de la Commission du 27 juin 1997 ouvrant des quotas
    d''importation des chlorofluorocarbures 11, 12, 113, 114 et 115 entièrement halogénés,
    d''autres chlorofluorocarbures entièrement halogénés, de halons, de tétrachlorure
    de carbone, de trichloro-1,1,1-éthane, d''hydrobromofluorocarbures et de bromure
    de méthyle pour la période allant du 1er janvier au 31 décembre 1997, et ouvrant
    en outre des quotas de mise sur le marché pour les hydrochlorofluorocarbures
    pour la période allant du 1er janvier au 31 décembre 1997 (Les textes en langues
    allemande, grecque, anglaise, française, italienne, néerlandaise et portugaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
