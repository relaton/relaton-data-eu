    11, 12, 113, 114 und 115, der übrigen vollhalogenierten Fluorchlorkohlenwasserstoffe,
    von Halonen, Tetrachlormethan, 1,1,1-Trichlorethan, Fluorbromkohlenwasserstoffen
    und Methylbromid für den Zeitraum vom 1. Januar bis 31. Dezember 1997 sowie zur
    Festsetzung von Quoten für das Inverkehrbringen von Fluorchlorkohlenwasserstoffen
    für den Zeitraum vom 1. Januar bis 31. Dezember 1997 (Nur der deutsche, der englische,
    der französische, der griechische, der italienische, der niederländische und
    der portugiesische Text sind verbindlich)'
  type: main
