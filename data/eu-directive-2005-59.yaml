    двадесет и осмо изменение на Директива 76/769/ЕИО
    на Съвета за сближаване на законовите, подзаконовите
    и административните разпоредби на държавите-членки
    относно ограниченията за пускането на пазара
    и употребата на някои опасни вещества и препарати
    (толуен и трихлорбензен)
  type: main
- language: cs
  script: Latn
