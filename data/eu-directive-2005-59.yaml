title:
- language: en
  script: Latn
  content: Directive 2005/59/EC of the European Parliament and of the Council of 26
    October 2005 amending for the 28th time Council Directive 76/769/EEC on the approximation
    of the laws, regulations and administrative provisions of the Member States relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (toluene and trichlorobenzene)
  type: main
- language: fr
  script: Latn
  content: Directive 2005/59/CE du Parlement européen et du Conseil du 26 octobre
    2005 portant vingt-huitième modification de la directive 76/769/CEE du Conseil
    concernant le rapprochement des dispositions législatives, réglementaires et
    administratives des États membres relatives à la limitation de la mise sur le
    marché et de l'emploi de certaines substances et préparations dangereuses (toluène
    et trichlorobenzène)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/59/EG des Europäischen Parlaments und des Rates vom 26.
    Oktober 2005 zur achtundzwanzigsten Änderung der Richtlinie 76/769/EWG des Rates
    zur Angleichung der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten für
    Beschränkungen des Inverkehrbringens und der Verwendung von bestimmten gefährlichen
    Stoffen und Zubereitungen (Toluol und Trichlorbenzol)
  type: main
- language: bg
  script: Cyrl
