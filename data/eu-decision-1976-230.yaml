---
id: EUDecision1976230
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 October 1975 authorizing the French Republic
    not to apply Community treatment to radio receivers, whether or not combined with
    a sound recorder falling within heading No 85.15 A III of the Common Customs Tariff,
    originating in Taiwan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/230/CEE: Décision de la Commission, du 29 octobre 1975, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de radio, même combinés avec un appareil d''enregistrement et de
    reproduction du son, de la position 85.15 A III du Tarif douanier commun, originaires
    de Taiwan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. Oktober 1975, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Empfangsgeräte für Rundfunk, auch mit einem Tonaufnahme-
    oder Tonwiedergabegerät kombiniert, der Tarifstelle 85.15 A III des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 29. oktober 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage radiomodtagere også kombineret
    med lydoptagere eller lydgengivere, som henhører under position 85.15 A III i
    den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 ottobre 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli apparecchi radioriceventi
    anche combinati con apparecchio di registrazione o di riproduzione del suono della
    voce 85.15 A III della tariffa doganale comune, originari di Taiwan e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 oktober 1975 waarbij de Franse Republiek
    wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, van post 85.15 A III
    van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
