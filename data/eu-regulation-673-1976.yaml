title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 673/76 of 26 March 1976 amending for the
    ninth time Regulation (EEC) No 1770/72 on detailed rules of application relating
    to the additional conditions with which imported wines for direct human consumption
    have to comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 673/76 de la Commission, du 26 mars 1976, modifiant
    pour la neuvième fois le règlement (CEE) n° 1770/72 portant modalités d' application
    relatives aux conditions supplémentaires auxquelles doivent répondre les vins
    importés des pays tiers, destinés à la consommation humaine directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 673/76 der Kommission vom 26. März 1976 zur neunten
    Änderung der Verordnung (EWG) Nr. 1770/72 über Durchführungsbestimmungen zu
    den zusätzlichen Bedingungen, denen aus Drittländern eingeführter Wein für
    den unmittelbaren menschlichen Verbrauch entsprechen muß
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 673/76 af 26. marts 1976 om niende
    ændring af forordning (EØF) nr. 1770/72 om gennemførelsesbestemmelser til de
    yderligere betingelser, som skal opfyldes af vin, der fra tredjelande er indført
    til direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 673/76 della Commissione, del 26 marzo 1976, che modifica
    per la nona volta il regolamento (CEE) n. 1770/72 recante modalità d' applicazione
    relative alle condizioni supplementari cui devono rispondere i vini importati
    dai paesi terzi destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 673/76 van de Commissie van 26 maart 1976 houdende
    negende wijziging van Verordening (EEG) nr. 1770/72 betreffende de nadere voorwaarden
    waaraan uit derde landen ingevoerde wijn voor rechtstreekse menselijke consumptie
    moet voldoen
  type: main
