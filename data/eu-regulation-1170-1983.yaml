    Ausfuhr von im Besitz der britischen Interventionsstelle befindlicher Gerste auf
    900 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1170/83 af 17. maj 1983 om ændring
