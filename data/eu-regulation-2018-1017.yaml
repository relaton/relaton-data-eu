    izvedbenih uredb (EU) 2017/366 in (EU) 2017/367 o uvedbi dokončnih izravnalnih
    in protidampinških dajatev na uvoz fotonapetostnih modulov iz kristalnega silicija
    in njihovih ključnih sestavnih delov (tj. celic) s poreklom iz Ljudske republike
    Kitajske ali ki so od tam poslani ter o spremembi izvedbenih uredb (EU) 2016/184
    in (EU) 2016/185 o razširitvi dokončne izravnalne in protidampinške dajatve
    na uvoz fotonapetostnih modulov iz kristalnega silicija in njihovih ključnih
    sestavnih delov (tj. celic) s poreklom iz Ljudske republike Kitajske ali ki so
    od tam poslani na uvoz fotonapetostnih modulov iz kristalnega silicija in njihovih
    ključnih sestavnih delov (tj. celic), poslanih iz Malezije ali s Tajvana, ne
    glede na to, ali so deklarirani kot izdelki s poreklom iz Malezije in Tajvana
    ali ne
  type: main
