  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2018/1017 av den 18 juli 2018
    om ändring av genomförandeförordningarna (EU) 2017/366 och (EU) 2017/367 om
    införande av slutgiltiga utjämningstullar och antidumpningstullar på import
    av solcellsmoduler av kristallint kisel och väsentliga komponenter (dvs. celler)
    med ursprung i eller avsända från Folkrepubliken Kina och genomförandeförordningarna
    (EU) 2016/184 och (EU) 2016/185 om utvidgning av den slutgiltiga utjämningstullen
    och antidumpningstullen på import av solcellsmoduler av kristallint kisel och
    väsentliga komponenter (dvs. celler) med ursprung i eller avsända från Folkrepubliken
    Kina till att även omfatta import av solcellsmoduler av kristallint kisel och
    väsentliga komponenter (dvs. celler) avsända från Malaysia och Taiwan, oavsett
    om produktens deklarerade ursprung är Malaysia och Taiwan eller inte
