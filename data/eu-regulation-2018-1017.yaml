  script: Latn
  content: Reglamento de Ejecución (UE) 2018/1017 de la Comisión, de 18 de julio
    de 2018, que modifica los Reglamentos de Ejecución (UE) 2017/366 y (UE) 2017/367,
    por los que se establecen derechos compensatorios y antidumping definitivos sobre
    las importaciones de módulos fotovoltaicos de silicio cristalino y componentes
    clave (a saber, células) originarios o procedentes de la República Popular China,
    y los Reglamentos de Ejecución (UE) 2016/184 y (UE) 2016/185, por los que se
    amplían el derecho compensatorio y el derecho antidumping definitivos sobre las
    importaciones de módulos fotovoltaicos de silicio cristalino y componentes clave
    (a saber, células) originarios o procedentes de la República Popular China a
    las importaciones de módulos fotovoltaicos de silicio cristalino y componentes
    clave (a saber, células) procedentes de Malasia y de Taiwán, tanto si se declaran
    originarios de Malasia o de Taiwán como si no
  type: main
