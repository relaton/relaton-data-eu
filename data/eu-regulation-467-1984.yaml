  content: Commission Regulation (EEC) No 467/84 of 23 February 1984 amending for
    the third time Regulation (EEC) No 2108/83 opening a standing invitation to tender
    for the sale of dried grapes and dried figs from the 1981 harvest intended for
    specific uses
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 467/84 de la Commission, du 23 février 1984, modifiant
