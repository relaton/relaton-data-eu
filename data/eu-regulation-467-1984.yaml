    für den Verkauf von getrockneten Weintrauben und getrockneten Feigen der Ernte
    1981 für besondere Verwendungszwecke
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 467/84 af 23. februar 1984 om tredje
