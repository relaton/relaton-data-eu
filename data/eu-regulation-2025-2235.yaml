title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/2235 of 6 November 2025 amending
    Implementing Regulation (EU) 2025/1082 as regards Potato virus S and Potato virus
    X as specified pests for unrooted cuttings for planting of Calibrachoa spp., Petunia
    spp. and their hybrids from Kenya
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2235 de la Commission du 6 novembre
    2025 modifiant le règlement d’exécution (UE) 2025/1082 en ce qui concerne
    le virus S de la pomme de terre et le virus X de la pomme de terre en tant qu’organismes
    nuisibles spécifiés pour les boutures non racinées destinées à la plantation
    de Calibrachoa spp., de Petunia spp. et de leurs hybrides en provenance du Kenya
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/2235 der Kommission vom 6. November
