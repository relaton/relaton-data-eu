id: EURegulation15041974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1504/74 of the Commission of 17 June 1974 re-establishing
    the levying of customs duties on under garments, knitted or crocheted, not elastic
    or rubberized, of cotton, falling within CCT subheading 60.04 A, originating in
    India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3503/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1504/74 de la Commission, du 17 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastique ni caoutchoutée, de coton, de la sous- position
    tarifaire 60.04 A, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1504/74 der Kommission vom 17. Juni 1974 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifstelle 60.04 A, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1504/74 af 17. juni 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastik eller gummeret, af bomuld, under underposition 60.04 A, som har oprindelse
    i Indien og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1504/74 della Commissione, del 17 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata, di cotone, della sottovoce doganale n. 60.04 A, originarie
    dell'India beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1504/74 van de Commissie van 17 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van katoen, van onderverdeling
    60.04 A, van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december 1973
  type: main
