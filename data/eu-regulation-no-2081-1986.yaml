title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2081/86 of 2 July 1986 re-establishing the
    levying of customs duties on twine, cordage, rapes and cables, of synthetic textile
    fibres, plaited or not, products of category 90 (code 40.0900), originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2081/86 de la Commission du 2 juillet 1986 portant
    rétablissement de la perception des droits de douane applicables aux ficelles,
    cordes et cordages, en fibres textiles synthétiques tressés ou non, de la catégorie
    de produits n° 90 (code 40.0900), originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2081/86 der Kommission vom 2. Juli 1986 über die
    Wiedereinführung des Zollsatzes für Bindfäden, Seile und Taue, aus synthetischen
    Spinnstoffen, auch geflochten, der Warenkategorie Nr. 90 (Kennziffer 40.0900),
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3600/85 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2081/86 af 2. juli 1986 om genindførelse
    af opkrævning af toldafgifter for sejlgarn, reb og tovværk, af syntetiske fibre
    også flettet, under varekategori nr. 90 (kode 40.0900), som har oprindelse i
    Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3600/85
  type: main
