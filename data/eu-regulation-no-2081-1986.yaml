    40.0900), originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2081/86 van de Commissie van 2 juli 1986 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
