id: EUDirective201416
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/16/EU of 18 October 2013 amending,
    for the purposes of adapting to technical progress, the Annex IV to Directive
    2011/65/EU of the European Parliament and of the Council as regards an exemption
    for lead as an activator in the fluorescent powder of discharge lamps when used
    for extracorporeal photopheresis lamps containing BSP (BaSi 2 O 5 :Pb) phosphors
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/16/UE de la Commission du 18 octobre 2013 modifiant,
    aux fins de son adaptation au progrès technique, l’annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb en tant qu’activateur dans la poudre fluorescente des lampes à
    décharge contenant des luminophores BSP (BaSi 2 O 5 :Pb) qui sont utilisées
    pour la photophérèse extracorporelle
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/16/EU der Kommission vom 18. Oktober 2013 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei als Aktivator im Leuchtstoffpulver von Gasentladungslampen,
    die als Bariumsilikat-Leuchtstoffe (BaSi 2 O 5 :Pb) enthaltende Lampen zur extrakorporalen
    Photopherese verwendet werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/16/ЕС на Комисията
    от 18 октомври 2013 година за изменение, с цел
    адаптиране към техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета, състоящо се в освобождаване от
    съответното ограничение на употребата на олово
    като активатор в луминесциращия прах на газоразрядни
    лампи, използвани като лампи за екстракорпорална
    фотофореза и съдържащи луминофори от BSP (BaSi
    2 O 5 :Pb)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/16/EU ze dne 18. října
    2013 , kterou se z důvodu přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo jako aktivátor ve fluorescenčním prášku do výbojek, jsou-li používány
    jako zářiče v soláriích obsahující luminofory BSP (BaSi 2 O 5 :Pb)
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/16/EU af 18. oktober 2013 om tilpasning
    til den tekniske udvikling af bilag IV til Europa-Parlamentets og Rådets direktiv
    2011/65/EU, for så vidt angår undtagne anvendelser af bly som aktivator i lyspulver
    i udladningslamper til brug som ekstrakorporale fotofereselamper, der indeholder
    BSP (BaSi 2 O 5 :Pb) fosfor
  type: main
- language: el
  script: Grek
  content: 'Κατ’ εξουσιοδότηση οδηγία 2014/16/ΕΕ της
    Επιτροπής, της 18ης Οκτωβρίου 2013 , για την τροποποίηση,
    με σκοπό την προσαρμογή στην τεχνική πρόοδο,
    του παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
    εξαίρεση για τον μόλυβδο ως ενεργοποιητή της
    φθορίζουσας σκόνης των λαμπτήρων εκκένωσης,
    όταν χρησιμοποιούνται ως λάμπες εξωσωματικής
    φωτοφέρεσης που περιέχουν φωσφορίζουσες ουσίες
    όπως η BSP (BaSi 2 O 5 : Pb)'
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/16/EL, 18. oktoober 2013 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist aktivaatorina
    kehaväliste fotofereesilampidena kasutatavates lahenduslampides, mis sisaldavad
    luminofoorina pliiga legeeritud baariumsilikaati (BaSi 2 O 5 :Pb)
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/16/EU, annettu 18 päivänä lokakuuta
    2013 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen lyijyä aktivaattorina valaisevassa
    jauheessa valoaineita (BaSi 2 O 5 :Pb) sisältävissä purkauslampuissa, joita
    käytetään kehonulkoisiin fotofereesihoitoihin, sisältäviä sovelluksia koskevan
    poikkeuksen osalta
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/16/EU оd 18. listopada 2013. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća o izuzeću za olovo kao aktivator u fluorescentnom prahu
    žarulja na pražnjenje kada se upotrebljavaju kao žarulje za ekstrakorporalnu
    fotoferezu koje sadrže BSP (BaSi 2 O 5 :Pb) fosfore
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/16/EU felhatalmazáson alapuló irányelve ( 2013. október
    18. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    a BSP (BaSi 2 O 5 :Pb) foszforokat tartalmazó, testen kívüli fénykezelésben
    (fotoferezisben) használt kisülő lámpákban található fluoreszcens porban
    aktivátorként alkalmazott ólom mentesítése tekintetében, a műszaki fejlődéshez
    történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/16/UE della Commissione, del 18 ottobre 2013 ,
    che modifica, per adeguarlo al progresso tecnico, l’allegato IV della direttiva
    2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda un’esenzione
    relativa al piombo come attivatore della polvere fluorescente delle lampade a
    scarica utilizzate come lampade di fotoferesi extracorporea contenenti sostanze
    fosforescenti BSP (BaSi 2 O 5 :Pb)
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/16/ES ( 2013. gada 18. oktobris ),
    ar ko, pielāgojot tehnikas attīstībai, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svinam kā luminiscentā
    pulvera aktivatoram gāzizlādes lampās, ja tās izmanto kā ekstrakorporālās
    fotoferēzes lampas, kas satur tādus fosforus kā BSP (BaSi 2 O 5 :Pb)
  type: main
- language: lt
  script: Latn
  content: 2013 m. spalio 18 d. Komisijos deleguotoji direktyva 2014/16/ES, kuria,
    derinant prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir
    Tarybos direktyvos 2011/65/ES IV priedo nuostatos dėl išimties, kuria leidžiama
    naudoti šviną kaip išlydžio lempų fluorescencinių miltelių aktyviklį,
    kai jis naudojamas ekstrakorporinės fotoferezės lempose, kuriose yra BSP (BaSi
    2 O 5 :Pb) liuminoforų
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Delega tal-Kummissjoni 2014/16/UE tat- 18 ta’ Ottubru
    2013 li temenda, għal skopijiet ta’ adattament għall-progress tekniku, l-Anness
    IV tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta’
    eżenzjoni għal ċomb bħala attivatur fit-trab fluworexxenti tal-bozoz bi skariku
    elettriku meta jintużaw għal bozoz tal-fotofereżi extrakorporea li fihom il-fosfori
    BSP (BaSi 2 O 5 :Pb)
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/16/EU van de Commissie van 18 oktober 2013
    tot wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood als activator in het fluorescentiepoeder van gasontladingslampen
    bij gebruik als extracorporele-fotofereselampen met BSP-fosforen (BaSi 2 O 5 :Pb)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/16/UE z dnia 18 października 2013 r.
    zmieniająca, w celu dostosowania do postępu technicznego, załącznik IV do
    dyrektywy Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia
    ołowiu jako aktywatora w proszku fluorescencyjnym lamp wyładowczych stosowanych
    w lampach do fotoforezy pozaustrojowej zawierających luminofory BSP (BaSi 2 O
    5 :Pb)
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/16/UE da Comissão, de 18 de outubro de 2013 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para chumbo como ativador do pó fluorescente de lâmpadas de descarga, utilizadas
    para fotoaférese extracorpórea com substâncias fosforescentes à base de BSP
    (BaSi 2 O 5 :Pb)
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/16/UE a Comisiei din 18 octombrie 2013 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul ca activator în pudra fluorescentă a lămpilor cu descărcare utilizate
    ca lămpi pentru fotoforeză extracorporală, care conține substanțe fluorescente
    BSP (BaSi 2 O 5 :Pb)
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/16/EÚ z 18. októbra 2013 , ktorou sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pre olovo ako aktivátor
    vo fluorescenčnom prachu vo výbojkách, ak sa používajú ako lampy na extrakorporeálnu
    fotoforézu, ktoré obsahujú fosfory BSP (BaSi 2 O 5 :Pb)
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/16/EU z dne 18. oktobra 2013 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjem pri
    uporabi svinca kot aktivatorja v fluorescenčnem prahu razelektritvenih sijalk,
    ko se uporabljajo kot sijalke za zunajtelesno fotoferezo, ki vsebujejo svetilne
    snovi BaSi 2 O 5 :Pb, zaradi prilagoditve tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/16/UE de la Comisión, de 18 de octubre de 2013
    , que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo empleado como activador en el polvo fluorescente de las lámparas
    de descarga utilizadas como lámparas de fotoféresis extracorpórea que contengan
    fósforos del tipo BSP (BaSi 2 O 5 :Pb)
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/16/EU av den 18 oktober 2013 om
    ändring, för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för ”bly som aktivator
    i lysämnen i urladdningslampor som används för extrakorporeala fotofereslampor
    som innehåller BSP (BaSi 2 O 5 :Pb)-fosfor”
  type: main
