  content: Commission Delegated Regulation (EU) 2025/1190 of 13 February 2025 supplementing
    Regulation (EU) 2022/2554 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the criteria used for identifying
    financial entities required to perform threat-led penetration testing, the requirements
    and standards governing the use of internal testers, the requirements in relation
    to the scope, testing methodology and approach for each phase of the testing,
    results, closure and remediation stages and the type of supervisory and other
    relevant cooperation needed for the implementation of TLPT and for the facilitation
    of mutual recognition
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1190 de la Commission du 13 février 2025
    complétant le règlement (UE) 2022/2554 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les critères utilisés
    pour identifier les entités financières tenues d’effectuer des tests d’intrusion
    fondés sur la menace, les exigences et les normes régissant le recours à des
    testeurs internes, les exigences relatives au périmètre et à la méthodologie
    des tests ainsi qu’à l’approche à suivre pour chaque phase des stades de
    test, de résultats, de clôture et de correction et le type de coopération en
    matière de surveillance et les autres types de coopération pertinents qui sont
    nécessaires pour l’exécution des tests d’intrusion fondés sur la menace
    et pour la facilitation de la reconnaissance mutuelle
  type: main
