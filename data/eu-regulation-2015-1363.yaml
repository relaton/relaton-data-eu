- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1363 of 6 August 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza outbreaks in that country
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1363 de la Commission du 6 août 2015
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci, à la suite de l'apparition de foyers
    d'influenza aviaire hautement pathogène dans ce pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/1363 der Kommission vom 6. August 2015
