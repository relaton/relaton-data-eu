    Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, im Zusammenhang mit Ausbrüchen
    der hochpathogenen Aviären Influenza in diesem Land
  type: main
