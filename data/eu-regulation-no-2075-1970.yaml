- language: fr
  script: Latn
  content: Règlement (CEE) n° 2075/70 de la Commission, du 15 octobre 1970, modifiant
    le règlement (CEE) n° 1519/70 relatif à certaines mesures à prendre pour les
    marchandises relevant du règlement (CEE) n° 1059/69 à la suite de la dévaluation
    du franc français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2075/70 der Kommission vom 15. Oktober 1970 zur Änderung
    der Verordnung (EWG) Nr. 1519/70 über Maßnahmen für unter die Verordnung (EWG)
    Nr. 1059/69 fallende Waren infolge der Abwertung des französischen Franken
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2075/70 della Commissione, del 15 ottobre 1970, che
    modifica il regolamento (CEE) n. 1519/70 relativo alle misure da applicare alle
    merci cui si applica il regolamento (CEE) n. 1059/69 in seguito alla svalutazione
    del franco francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2075/70 van de Commissie van 15 oktober 1970 tot
    wijziging van Verordening (EEG) nr. 1519/70 betreffende ingevolge de devaluatie
    van de Franse frank te nemen maatregelen voor de goederen die onder Verordening
    (EEG) nr. 1059/69 vallen
  type: main
