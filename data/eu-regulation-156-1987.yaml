    πιστοποιητικών συμπληρωματικής ενίσχυσης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 156/87 della Commissione del 21 gennaio 1987 recante
    deroga, a titolo temporaneo, al regolamento (CEE) n. 1528/78 recante modalità
    d' applicazione del regime di aiuti per i foraggi essiccati, in ordine al periodo
    di validità dei titoli di aiuto complementare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 156/87 van de Commissie van 21 januari 1987 waarbij
