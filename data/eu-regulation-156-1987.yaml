title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 156/87 of 21 January 1987 derogating, on
    a temporary basis, from Regulation (EEC) No 1528/78 laying down detailed rules
    for the application of the system of aid for dried fodder as regards the period
    of validity of the supplementary aid certificates
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 156/87 de la Commission du 21 janvier 1987 dérogeant,
    à titre temporaire, au règlement (CEE) n° 1528/78 portant modalités d' application
    du régime d' aide pour les fourrages séchés, en ce qui concerne la durée de
    validité des certificats d' aide complémentaire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 156/87 der Kommission vom 21. Januar 1987 zur vorübergehenden
