    zur Beihilferegelung für Trockenfutter hinsichtlich der Gültigkeitsdauer der
    Bescheinigungen über die ergänzende Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 156/87 af 21. januar 1987 om midlertidig
    undtagelse fra forordning (EØF) nr. 1528/78 om gennemførelsesbestemmelser for
    støtteordningen for tørret foder, for så vidt angår gyldighedsperioden for
    attesterne vedrørende tillægsstøtte
  type: main
- language: el
  script: Grek
