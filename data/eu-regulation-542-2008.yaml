title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 542/2008 of 16 June 2008 amending Annexes
    I and II to Council Regulation (EEC) No 2377/90 laying down a Community procedure
    for the establishment of maximum residue limits of veterinary medicinal products
    in foodstuffs of animal origin, as regards cyfluthrin and lectin extracted from
    red kidney beans ( Phaseolus vulgaris)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 542/2008 de la Commission du 16 juin 2008 modifiant
    les annexes I et II du règlement (CEE) n o 2377/90 du Conseil établissant une
    procédure communautaire pour la fixation des limites maximales de résidus de
    médicaments vétérinaires dans les aliments d'origine animale, en ce qui concerne
    la cyfluthrine et la lectine extraite des haricots rouges ( Phaseolus vulgaris)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 542/2008 der Kommission vom 16. Juni 2008 zur Änderung
    der Anhänge I und II der Verordnung (EWG) Nr. 2377/90 des Rates zur Schaffung
    eines Gemeinschaftsverfahrens für die Festsetzung von Höchstmengen für Tierarzneimittelrückstände
    in Nahrungsmitteln tierischen Ursprungs hinsichtlich Cyfluthrin und Lectin aus
    Gartenbohnen ( Phaseolus vulgaris)
  type: main
- language: bg
  script: Cyrl
