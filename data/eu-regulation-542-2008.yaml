    for fastsættelse af maksimalgrænseværdier for restkoncentrationer af veterinærlægemidler
    i animalske levnedsmidler for så vidt angår cyfluthrin og lectin udvundet af
    røde kidneybønner ( Phaseolus vulgaris)
  type: main
- language: el
  script: Grek
