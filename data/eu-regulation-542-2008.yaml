    eläinperäisissä elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o 2377/90
    liitteiden I ja II muuttamisesta syflutriinin ja tarhapavuista ( Phaseolus vulgaris)
    saadun lektiinin osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 542/2008/EK rendelete ( 2008. június 16.) az állati eredetű
    élelmiszerekben található állatgyógyászati készítmények maximális maradékanyag-határértékeinek
    megállapítására szolgáló közösségi eljárás kialakításáról szóló
    2377/90/EGK tanácsi rendelet I. és II. mellékletének a ciflutrin és a vörös
    veteménybabból ( Phaseolus vulgaris) nyert lecitin tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 542/2008 della Commissione, del 16 giugno 2008 , che
    modifica gli allegati I e II del regolamento (CEE) n. 2377/90 del Consiglio che
    definisce una procedura comunitaria per la determinazione dei limiti massimi di
    residui di medicinali veterinari negli alimenti di origine animale per quanto
    riguarda il ciflutrin e la lectina estratta dai fagioli rossi ( Phaseolus vulgaris)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 542/2008 ( 2008. gada 16. jūnijs), ar kuru groza
    Padomes Regulas (EEK) Nr. 2377/90, ar ko nosaka Kopienas procedūru veterināro
    zāļu maksimāli pieļaujamo atlieku daudzumu noteikšanai dzīvnieku izcelsmes
    produktos, I un II pielikumu attiecībā uz ciflutrīnu un lektīnu, kas iegūts
    no sarkanajām kāršu pupiņām ( Phaseolus vulgaris)
  type: main
- language: lt
  script: Latn
  content: 2008 m. birželio 16 d. Komisijos reglamentas (EB) Nr. 542/2008, iš dalies
    keičiantis Tarybos reglamento (EEB) Nr. 2377/90, nustatančio veterinarinių
    vaistų likučių gyvūninės kilmės maisto produktuose didžiausių kiekių
    nustatymo tvarką Bendrijoje, I ir II priedų nuostatas dėl ciflutrino ir lektino,
    gaunamo iš raudonųjų daržinių pupelių ( Phaseolus vulgaris)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 542/2008 tas- 16 ta' Ġunju 2008 li
    jemenda l-Anness I u II tar-Regolament tal-Kunsill (KEE) Nru 2377/90 li jistabbilixxi
    kull proċedura tal-Komunità għal iffissar ta’ limiti massimi ta’ residwi
    ta’ prodotti mediċinali veterinarji fi prodotti ta’ l-ikel ta’ oriġini
    mill-annimali, fir-rigward ta' cyfluthrin u lectin estratti minn fażola ħamra
    ( Phaseolus vulgaris)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 542/2008 van de Commissie van 16 juni 2008 tot wijziging
    van de bijlagen I en II bij Verordening (EEG) nr. 2377/90 van de Raad houdende
    een communautaire procedure tot vaststelling van maximumwaarden voor residuen
    van geneesmiddelen voor diergeneeskundig gebruik in levensmiddelen van dierlijke
    oorsprong, wat betreft cyfluthrine en uit rode kidneybonen ( Phaseolus vulgaris)
    geëxtraheerde lectine
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 542/2008 z dnia 16 czerwca 2008 r. zmieniające
    załączniki I i II do rozporządzenia Rady (EWG) nr 2377/90 ustanawiającego
    wspólnotową procedurę dla określania maksymalnego limitu pozostałości weterynaryjnych
    produktów leczniczych w środkach spożywczych pochodzenia zwierzęcego w odniesieniu
    do cyflutryny oraz lektyny uzyskanej z fasoli czerwonej kidney ( Phaseolus vulgaris)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 542/2008 da Comissão, de 16 de Junho de 2008 , que
    altera os anexos I e II do Regulamento (CEE) n. o 2377/90 do Conselho que prevê
    um processo comunitário para o estabelecimento de limites máximos de resíduos
    de medicamentos veterinários nos alimentos de origem animal, no que diz respeito
    à ciflutrina e à lectina extraída do feijão comum ( Phaseolus vulgaris)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 542/2008 al Comisiei din 16 iunie 2008 de modificare
    a anexelor I și II la Regulamentul (CEE) nr. 2377/90 al Consiliului de stabilire
    a unei proceduri comunitare pentru stabilirea limitelor maxime de reziduuri de
    produse medicinale veterinare în alimentele de origine animală, cu privire la
    ciflutrin și lectină extrasă din fasole roșie ( Phaseolus vulgaris)
  type: main
- language: sk
  script: Latn
  content: Nariadenia Komisie (ES) č. 542/2008 zo 16. júna 2008 , ktorým sa menia
    a dopĺňajú prílohy I a II k nariadeniu Rady (EHS) č. 2377/90, ktorým sa
    stanovuje postup Spoločenstva na určenie maximálnych limitov rezíduí veterinárnych
    liečiv v potravinách živočíšneho pôvodu, pokiaľ ide o cyflutrín a lektín
    z fazule obyčajnej ( Phaseolus vulgaris)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 542/2008 z dne 16. junija 2008 o spremembi prilog
    I in II k Uredbi Sveta (EGS) št. 2377/90 o določitvi postopka Skupnosti za določanje
    najvišjih mejnih vrednosti ostankov zdravil za uporabo v veterinarski medicini
    v živilih živalskega izvora v zvezi s ciflutrinom in lektinom, pridobljenima
    iz navadnega fižola ( Phaseolus vulgaris)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 542/2008 de la Comisión, de 16 de junio de 2008 ,
    que modifica, en lo referente a la ciflutrina y a la lectina de habichuelas rojas
    ( Phaseolus vulgaris), los anexos I y II del Reglamento (CEE) n o 2377/90 del
    Consejo, por el que se establece un procedimiento comunitario de fijación de
    los límites máximos de residuos de medicamentos veterinarios en los alimentos
    de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 542/2008 av den 16 juni 2008 om ändring
    av bilagorna I och II till rådets förordning (EEG) nr 2377/90 om inrättandet
    av ett gemenskapsförfarande för att fastställa gränsvärden för högsta tillåtna
    restmängder av veterinärmedicinska läkemedel i livsmedel med animaliskt ursprung
    avseende cyflutrin och lektin som utvunnits ur trädgårdsbönor (Red kidney bean)
    ( Phaseolus vulgaris)
