    юни 2008 година за изменение на приложения I и
    II към Регламент (ЕИО) № 2377/90 на Съвета относно
    установяване на процедура на Общността за
    определяне на максимално допустимите граници
    на остатъчни вещества от ветеринарномедицински
    продукти в храните от животински произход
    по отношение на цифлутрин и лецитин, извлечен
    от червен фасул ( Phaseolus vulgaris)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 542/2008 ze dne 16. června 2008 , kterým
    se mění přílohy I a II nařízení Rady (EHS) č. 2377/90, kterým se stanoví
    postup Společenství pro stanovení maximálních limitů reziduí veterinárních
    léčivých přípravků v potravinách živočišného původu, pokud jde o cyflutrin
    a lektin z fazolu obecného ( Phaseolus vulgaris)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 542/2008 af 16. juni 2008 om ændring
