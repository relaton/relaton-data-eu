    veterinaarravimijääkide piirnormide kehtestamiseks loomsetes toiduainetes) I
    ja II lisa seoses tsüflutriini ja harilikest punastest aedubadest ( Phaseolus
    vulgaris) saadud lektiiniga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 542/2008, annettu 16 päivänä kesäkuuta 2008
