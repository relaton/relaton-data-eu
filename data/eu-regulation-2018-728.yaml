  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2018/728 della Commissione, del 24 gennaio 2018,
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione relative alle procedure
    per escludere le operazioni con controparti non finanziarie stabilite in un paese
    terzo dai requisiti di fondi propri per il rischio di aggiustamento della valutazione
    del credito
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2018/728 (2018. gada 24. janvāris),
