title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/728 of 24 January 2018 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards for procedures for excluding transactions
    with non-financial counterparties established in a third country from the own
    funds requirement for credit valuation adjustment risk
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/728 de la Commission du 24 janvier 2018
    complétant le règlement (UE) n° 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation établissant des procédures permettant
    d'exclure les opérations effectuées avec des contreparties non financières
    établies dans un pays tiers des exigences de fonds propres pour risque d'ajustement
    de l'évaluation de crédit
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/728 der Kommission vom 24. Januar 2018
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards für Verfahren, nach denen Geschäfte
    mit in Drittländern niedergelassenen nichtfinanziellen Gegenparteien von der
    Eigenmittelanforderung für das CVA-Risiko ausgenommen werden können
  type: main
- language: bg
  script: Cyrl
