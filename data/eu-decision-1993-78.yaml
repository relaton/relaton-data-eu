title:
- language: en
  script: Latn
  content: '93/78/EEC: Commission Decision of 22 December 1992 derogating from certain
    provisions of Council Directive 72/462/EEC with regard to imports of meat into
    the Canary Islands and fixing the rules applicable after importation (Only the
    Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/78/CEE: Décision de la Commission, du 22 décembre 1992, dérogeant
    en ce qui concerne les importations de viandes à destination des îles Canaries
    à certaines dispositions de la directive 72/462/CEE du Conseil et fixant les
    règles applicables après leurs importations (Le texte en langue espagnole est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '93/78/EWG: Entscheidung der Kommission vom 22. Dezember 1992 zur Abweichung
    von bestimmten Vorschriften der Richtlinie 72/462/EWG des Rates hinsichtlich der
    Einfuhren von Fleisch auf die Kanarischen Inseln und zur Festlegung der nach den
    Einfuhren geltenden Regeln (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/78/EØF: Kommissionens beslutning af 22. december 1992 om fravigelse
    af visse bestemmelser i Rådets direktiv 72/462/EØF for så vidt angår indførsel
    af kød bestemt til De Kanariske Øer og om fastsættelse af reglerne, der gælder
    efter indførsel heraf (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '93/78/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1992 για την παρέκκλιση από ορισμένες διατάξεις
    της απόφασης 72/462/ΕΟΚ του Συμβουλίου όσον αφορά
    τις εισαγωγές κρεάτων με προορισμό τα Κανάρια
    Νησιά και τον καθορισμό των κανόνων που εφαρμόζονται
    μετά τις εισαγωγές των (Το κείμενο στην ισπανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '93/78/CEE: Decisione della Commissione, del 22 dicembre 1992, che deroga
    a talune disposizioni della direttiva 72/462/CEE del Consiglio per quanto concerne
    le importazioni di carni destinate alle isole Canarie e che fissa le norme applicabili
    dopo la loro importazione (Il testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/78/EEG: Beschikking van de Commissie van 22 december 1992 tot afwijking,
    ten aanzien van de invoer van voor de Canarische eilanden bestemd vlees, van sommige
    bepalingen van Richtlijn 72/462/EEG van de Raad en tot vaststelling van de voorschriften
    die van toepassing zijn na de invoer ervan (Slechts de tekst in de Spaanse taal
    is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '93/78/CEE: Decisão da Comissão, de 22 de Dezembro de 1992, que derroga
    determinadas disposições previstas na Directiva 72/462/CEE em relação à importação
    de carne destinada às ilhas Canárias, e fixa as regras aplicáveis após a sua
    importação (Apenas faz fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '93/78/CEE: Decisión de la Comisión, de 22 de diciembre de 1992, por
    la que se derogan determinadas disposiciones de la Directiva 72/462/CEE en lo
    que respecta a las importaciones de carnes destinadas a las islas Canarias, y
    por la que se fijan las reglas aplicables tras su importación (El texto en lengua
    española es el único auténtico)'
