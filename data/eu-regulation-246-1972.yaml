title:
- language: en
  script: Latn
  content: Regulation (EEC) No 246/72 of the Commission of 2 February 1972 amending
    Regulation (EEC) No 1054/68 determining the list of agencies certifying the admissibility
    to certain tariff headings of certain milk products from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 246/72 de la Commission, du 2 février 1972, modifiant
    le règlement (CEE) n° 1054/68 établissant la liste des organismes émetteurs
    de certificats destinés à permettre l' admission de certains produits laitiers
    en provenance des pays tiers dans certaines positions tarifaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 246/72 der Kommission vom 2. Februar 1972 zur Änderung
    der Verordnung (EWG) Nr. 1054/68 zur Festlegung der Liste der Stellen für die
    Erteilung von Bescheinigungen für die Zulassung bestimmter Milcherzeugnisse aus
    dritten Ländern zu bestimmten Tarifnummern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 246/72 af 2. februar 1972 om ændring
    af forordning (EØF) nr. 1054/68 om oprettelse af en fortegnelse over de organer,
    der er kompetente til at udstede certifikater vedrørende visse fra tredjelande
    indførte mejeriprodukters henførsel under bestemte toldpositioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 246/72 τής Επιτροπής
    τής 2ας Φεβρουαρίου 1972 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 1054/68 «περί καταρτίσεως
    τού καταλόγου τών οργανισμών εκδόσεως τών
    πιστοποιητικών, τά οποία επιτρέπουν τήν υπαγωγή
    ορισμένων γαλακτοκομικών προϊόντων, προελεύσεως
    τρίτων χωρών, σέ ορισμένες δασμολογικές κλάσεις»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 246/72 della Commissione, del 2 febbraio 1972, che
    modifica il regolamento (CEE) n. 1054/68 che stabilisce l' elenco degli organismi
    emittenti dei certificati destinati a permettere l' ammissione in alcune voci
    tariffarie di taluni prodotti lattiero-caseari in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 246/72 van de Commissie van 2 februari 1972 tot wijziging
    van Verordening (EEG) nr. 1054/68 houdende vaststelling van de lijst van organisaties
    voor de afgifte van certificaten ten behoeve van de indeling van sommige zuivelprodukten
    uit derde landen onder bepaalde tariefposten
  type: main
