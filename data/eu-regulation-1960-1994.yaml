title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1960/94 of 27 July 1994 derogating from the
    detailed rules for the delivery by producers of the table wine they are required
    to deliver for compulsory distillation and support distillation in respect of
    the 1993/94 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1960/94 de la Commission du 27 juillet 1994 portant
    mesure dérogatoire pour la campagne 1993/1994 en matière de livraison par les
    producteurs de leurs quantités de vin de table à livrer au titre des distillations
    obligatoires et de soutien
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1960/94 DER KOMMISSION vom 27. Juli 1994 mit abweichenden
    Bestimmungen zur obligatorischen und unterstützenden Destillation des von den
    Erzeugern zu liefernden Tafelweins im Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1960/94 af 27. juli 1994 om undtagelsesbestemmelser
    for produktionsåret 1993/94 om producenters levering af bordvin til obligatorisk
    destillation og støtte destillation
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1960/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1994 για τη θέσπιση μέτρου παρέκκλισης
    κατά την περίοδο εμπορίας 1993/94 όσον αφορά την
    παράδοση από τους παραγωγούς των ποσοτήτων
    επιτραπέζιου οίνου τις οποίες πρέπει να παραδώσουν
    για υποχρεωτική απόσταξη στήριξης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1960/94 DELLA COMMISSIONE del 27 luglio 1994 recante
    deroga, per la campagna 1993/1994 in ordine alle consegne di vino da tavola conferito
    dai produttori nel quadro delle distillazioni obbligatorie e di sostegno
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1960/94 VAN DE COMMISSIE van 27 juli 1994 tot vaststelling
    van een afwijking voor het wijnoogstjaar 1993/1994 inzake de levering door de
    producenten van de in het kader van de verplichte distillatie en de marktondersteuningsdistillatie
    te leveren hoeveelheden tafelwijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1960/94 DA COMISSÃO de 27 de Julho de 1994 que estabelece
    uma medida derrogatória para a campanha de 1993/1994 em matéria de entrega pelos
    produtores de vinhos de mesa a título da destilação obrigatória e de apoio
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 1960/94 DE LA COMISIÓN de 27 de julio de 1994 por
    el que se establece una excepción relativa a la entrega por parte de los productores
    de cantidades de vino de mesa con destino a las destilaciones obligatorias y apoyo
    durante la campaña 1993/94
  type: main
