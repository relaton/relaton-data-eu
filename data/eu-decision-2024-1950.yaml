    Ενέργειας όσον αφορά την έκδοση απόφασης για
    την προσθήκη μιας προσφάτως εκδοθείσας πράξης
    της Ένωσης στο παράρτημα 2 του πλαισίου του
    Ουίνδσορ
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2024/1950, 13. mai 2024, millega määratakse kindlaks
    Euroopa Liidu nimel võetav seisukoht Suurbritannia ja Põhja-Iiri Ühendkuningriigi
    Euroopa Liidust ja Euroopa Aatomienergiaühendusest väljaastumise lepinguga loodud
    ühiskomitees seoses otsuse, millega lisatakse hiljuti vastu võetud liidu õigusakt
    Windsori raamistiku 2. lisasse, vastuvõtmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2024/1950, annettu 13 päivänä toukokuuta 2024,
    Ison-Britannian ja Pohjois-Irlannin yhdistyneen kuningaskunnan eroamisesta Euroopan
    unionista ja Euroopan atomienergiayhteisöstä tehdyllä sopimuksella perustetussa
    sekakomiteassa Euroopan unionin puolesta otettavasta kannasta sellaisen päätöksen
    hyväksymiseen, jolla äskettäin hyväksytty unionin säädös lisätään Windsorin
    puitteiston liitteeseen 2
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2024/1950 ón gComhairle an 13 Bealtaine 2024 lena mbunaítear
    an seasamh atá le glacadh thar ceann an Aontais Eorpaigh sa Chomhchoiste a bunaíodh
    leis an gComhaontú maidir le Ríocht Aontaithe na Breataine Móire agus Thuaisceart
    Éireann a bheith ag tarraingt siar as an Aontas Eorpach agus as an gComhphobal
    Eorpach do Fhuinneamh Adamhach a mhéid a bhaineann le cinneadh a ghlacadh lena
    gcuirtear gníomh nuaghlactha de chuid an Aontais le hIarscríbhinn 2 a ghabhann
    le Creat Windsor
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2024/1950 od 13. svibnja 2024. o utvrđivanju stajališta
    koje treba zauzeti u ime Europske unije u okviru Zajedničkog odbora osnovanog
    Sporazumom o povlačenju Ujedinjene Kraljevine Velike Britanije i Sjeverne Irske
    iz Europske unije i Europske zajednice za atomsku energiju u pogledu donošenja
    odluke o dodavanju novodonesenog akta Unije u Prilog 2. Windsorskom okviru
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2024/1950 határozata (2024. május 13.) a Nagy-Britannia
    és Észak-Írország Egyesült Királyságának az Európai Unióból és az
    Európai Atomenergia-közösségből történő kilépéséről szóló megállapodással
    létrehozott vegyes bizottságban a Windsori Keretmegállapodás 2. mellékletének
    egy újonnan elfogadott uniós jogi aktussal történő kiegészítésére irányuló
    határozat elfogadásával kapcsolatban az Európai Unió nevében képviselendő
    álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/1950 del Consiglio, del 13 maggio 2024, relativa alla
    posizione da adottare a nome dell’Unione europea in sede di comitato misto istituito
    dall’accordo sul recesso del Regno Unito di Gran Bretagna e Irlanda del Nord
    dall’Unione europea e dalla Comunità europea dell’energia atomica riguardo
    all’adozione di una decisione che aggiunge un atto dell’Unione di recente
    adozione all’allegato 2 del Quadro di Windsor
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2024/1950 (2024. gada 13. maijs), ar kuru nosaka nostāju,
    kas Eiropas Savienības vārdā jāieņem Apvienotajā komitejā, kura izveidota
    ar Līgumu par Lielbritānijas un Ziemeļīrijas Apvienotās Karalistes izstāšanos
    no Eiropas Savienības un Eiropas Atomenerģijas kopienas, attiecībā uz tāda
    lēmuma pieņemšanu, ar ko Vindzoras regulējuma 2. pielikumam pievieno jaunpieņemtu
    Savienības aktu
  type: main
- language: lt
  script: Latn
  content: 2024 m. gegužės 13 d. Tarybos sprendimas (ES) 2024/1950, kuriuo nustatoma
    pozicija, kurios Europos Sąjungos vardu turi būti laikomasi Susitarimu dėl
    Jungtinės Didžiosios Britanijos ir Šiaurės Airijos Karalystės išstojimo
    iš Europos Sąjungos ir Europos atominės energijos bendrijos įsteigtame Jungtiniame
    komitete, dėl sprendimo, kuriuo į Vindzoro sistemos 2 priedą įtraukiamas priimtas
    naujas Sąjungos aktas, priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/1950 tat-13 ta’ Mejju 2024 li tistabbilixxi
    l-pożizzjoni li għandha tittieħed f’isem l-Unjoni Ewropea fil-Kumitat Konġunt
    stabbilit mill-Ftehim dwar il-ħruġ tar-Renju Unit tal-Gran Brittanja u l-Irlanda
    ta’ Fuq mill-Unjoni Ewropea u mill-Komunità Ewropea tal-Enerġija Atomika fir-rigward
    tal-adozzjoni ta’ deċiżjoni li żżid att tal-Unjoni li għadu kif ġie adottat
    mal-Anness 2 tal-Qafas ta’ Windsor
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2024/1950 van de Raad van 13 mei 2024 betreffende het namens
    de Europese Unie in te nemen standpunt in het bij het Akkoord over de terugtrekking
    van het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland uit de Europese
    Unie en de Europese Gemeenschap voor Atoomenergie ingestelde Gemengd Comité wat
    betreft de vaststelling van een besluit tot toevoeging van een vastgestelde nieuwe
    Uniehandeling aan bijlage 2 bij het Windsor-kader
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2024/1950 z dnia 13 maja 2024 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Wspólnego Komitetu
    ustanowionego na podstawie Umowy o wystąpieniu Zjednoczonego Królestwa Wielkiej
    Brytanii i Irlandii Północnej z Unii Europejskiej i Europejskiej Wspólnoty
    Energii Atomowej w odniesieniu do przyjęcia decyzji dodającej nowo przyjęty
    akt Unii do załącznika 2 do ram windsorskich
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2024/1950 do Conselho, de 13 de maio de 2024, que define
    a posição a tomar, em nome da União Europeia, no âmbito do Comité Misto criado
    pelo Acordo sobre a Saída do Reino Unido da Grã-Bretanha e da Irlanda do Norte
    da União Europeia e da Comunidade Europeia da Energia Atómica, no que diz respeito
    à adoção de uma decisão que adita um ato da União recentemente adotado ao
    anexo 2 do Quadro de Windsor
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2024/1950 a Consiliului din 13 mai 2024 de stabilire a poziției
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    mixt înființat prin Acordul privind retragerea Regatului Unit al Marii Britanii
    și Irlandei de Nord din Uniunea Europeană și din Comunitatea Europeană a Energiei
    Atomice în ceea ce privește adoptarea unei decizii de adăugare a unui act al
    Uniunii recent adoptat în anexa 2 la Cadrul Windsor
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/1950 z 13. mája 2024, ktorým sa stanovuje
    pozícia, ktorá sa má v mene Európskej únie zaujať v Spoločnom výbore zriadenom
    Dohodou o vystúpení Spojeného kráľovstva Veľkej Británie a Severného Írska
    z Európskej únie a z Európskeho spoločenstva pre atómovú energiu, pokiaľ
    ide o prijatie rozhodnutia o doplnení novoprijatého aktu Únie do prílohy 2
    k Windsorskému rámcu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/1950 z dne 13. maja 2024 o stališču, ki se v imenu
    Evropske unije zastopa v skupnem odboru, ustanovljenem s Sporazumom o izstopu
    Združenega kraljestva Velika Britanija in Severna Irska iz Evropske unije in
    Evropske skupnosti za atomsko energijo, v zvezi s sprejetjem sklepa o vključitvi
    na novo sprejetega akta Unije v Prilogo 2 k Windsorskemu okviru
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/1950 del Consejo, de 13 de mayo de 2024, por la que
    se establece la posición que debe adoptarse, en nombre de la Unión Europea,
    en el Comité Mixto creado por el Acuerdo sobre la retirada del Reino Unido de
    Gran Bretaña e Irlanda del Norte de la Unión Europea y de la Comunidad Europea
    de la Energía Atómica en lo que respecta a la adopción de una decisión por
    la que se incorpora un acto de la Unión recientemente adoptado al anexo 2 del
    Marco de Windsor
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/1950 av den 13 maj 2024 om fastställande av den
    ståndpunkt som ska intas på Europeiska unionens vägnar i den gemensamma kommitté
    som inrättats genom avtalet om Förenade konungariket Storbritannien och Nordirlands
    utträde ur Europeiska unionen och Europeiska atomenergigemenskapen vad gäller
    antagandet av ett beslut om att lägga till en nyligen antagen unionsakt i bilaga
    2 till Windsorramen
