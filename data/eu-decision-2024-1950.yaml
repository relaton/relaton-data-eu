title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/1950 of 13 May 2024 establishing the position
    to be taken on behalf of the European Union within the Joint Committee established
    by the Agreement on the withdrawal of the United Kingdom of Great Britain and
    Northern Ireland from the European Union and the European Atomic Energy Community
    as regards the adoption of a decision adding a newly adopted Union act to Annex
    2 to the Windsor Framework
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/1950 du Conseil du 13 mai 2024 établissant la position
    à prendre, au nom de l’Union européenne, au sein du comité mixte institué
    par l’accord sur le retrait du Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord de l’Union européenne et de la Communauté européenne de l’énergie
    atomique en ce qui concerne l’adoption d’une décision ajoutant un acte de
    l’Union nouvellement adopté à l’annexe 2 du cadre de Windsor
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/1950 des Rates vom 13. Mai 2024 zur Festlegung des
    Standpunkts, der im Namen der Europäischen Union in dem mit dem Abkommen über
    den Austritt des Vereinigten Königreichs Großbritannien und Nordirland aus der
    Europäischen Union und der Europäischen Atomgemeinschaft eingesetzten Gemeinsamen
    Ausschuss im Hinblick auf die Annahme eines Beschlusses zur Aufnahme eines neu
    erlassenen Rechtsakts der Union in Anhang 2 des Windsor-Rahmens zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/1950 на Съвета от 13 май 2024 година
    за определяне на позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвместния комитет, създаден със Споразумението
    за оттеглянето на Обединеното кралство Великобритания
    и Северна Ирландия от Европейския съюз и Европейската
    общност за атомна енергия, във връзка с приемането
    на решение за добавяне на новоприет акт на
    Съюза в приложение 2 към Рамката от Уиндзор
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/1950 ze dne 13. května 2024 o postoji, který
    má být jménem Evropské unie zaujat ve smíšeném výboru zřízeném Dohodou
    o vystoupení Spojeného království Velké Británie a Severního Irska z Evropské
    unie a Evropského společenství pro atomovou energii k přijetí rozhodnutí,
    kterém se do přílohy 2 Windsorského rámce doplňuje nově přijatý akt Unie
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2024/1950 af 13. maj 2024 om fastlæggelse af den
    holdning, der skal indtages på Den Europæiske Unions vegne i Det Blandede Udvalg,
    der er nedsat ved aftalen om Det Forenede Kongerige Storbritannien og Nordirlands
    udtræden af Den Europæiske Union og Det Europæiske Atomenergifællesskab, til
    vedtagelsen af en afgørelse om tilføjelse af en nyligt vedtagen EU-retsakt i
    Windsorrammens bilag 2
  type: main
- language: el
  script: Grek
  content: Απόφαση (EE) 2024/1950 του Συμβουλίου, της 13ης
    Μαΐου 2024, με την οποία καθορίζεται η θέση που
    πρέπει να ληφθεί εξ ονόματος της Ευρωπαϊκής
    Ένωσης στο πλαίσιο της μεικτής επιτροπής που
    συγκροτήθηκε με τη συμφωνία για την αποχώρηση
    του Ηνωμένου Βασιλείου της Μεγάλης Βρετανίας
    και της Βόρειας Ιρλανδίας από την Ευρωπαϊκή
