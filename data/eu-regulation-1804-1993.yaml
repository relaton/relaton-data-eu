title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1804/93 of 6 July 1993 determining the extent
    to which applications lodged in May 1993 for import licences for fresh, chilled
    or preserved beef and veal under the import arrangements provided for in the Bilateral
    Agreement on Agriculture between the Community and Sweden can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1804/93 de la Commission du 6 juillet 1993 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en mai 1993 pour certaines viandes bovines fraîches ou réfrigérées
    ou sous forme de conserves dans le cadre du régime d'importation prévu dans
    l'accord bilatéral agricole entre la Communauté et la Suède
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1804/93 DER KOMMISSION vom 6. Juli 1993 zur Genehmigung
    der im Mai 1993 für die Einfuhr von frischem oder gekühltem Rindfleisch oder
    von Rindfleisch in Konserven im Rahmen der Einfuhrregelung des zwischen der Gemeinschaft
    und Schweden geschlossenen bilateralen landwirtschaftlichen Abkommens gestellten
    Anträge
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1804/93 af 6. juli 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i maj 1993, om
    importlicenser for oksekød, fersk, kølet eller i form af konserves, i forbindelse
    med den importordning, der er fastsat i den bilaterale landbrugsaftale mellem
    Fællesskabet og Sverige
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1804/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 6ης Ιουλίου 1993 για τον καθορισμό του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Μάιο 1993 για ορισμένα νωπά ή διατηρημένα
    με απλή ψύξη βόεια κρέατα ή με τη μορφή κονσερβών
    στο πλαίσιο του καθεστώτος εισαγωγής που προβλέπεται
    στη διμερή γεωργική συμφωνία μεταξύ της Κοινότητας
    και της Σουηδίας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1804/93 DELLA COMMISSIONE del 6 luglio 1993 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d' importazione
    presentate nel mese di maggio 1993 per talune carni bovine fresche o refrigerate
    o in conserva nel quadro del regime di importazione previsto dall' accordo bilaterale
    agricolo tra la Comunità e la Svezia
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1804/93 VAN DE COMMISSIE van 6 juli 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers of gekoeld rundvlees of rundvleesconserven, die in mei 1993 zijn ingediend
    op grond van de invoerregeling die is vastgesteld in de door de Gemeenschap met
    Zweden gesloten bilaterale landbouwovereenkomst
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1804/93 DA COMISSÃO de 6 de Julho de 1993 que determina
    em que medida podem ser aceites os pedidos de certificado de importação, apresentados
    em Maio de 1993, de determinadas carnes de bovino frescas, refrigeradas ou sob
    forma de conservas, ao abrigo do regime de importação previsto no Acordo bilateral
    agrícola entre a Comunidade e a Suécia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1804/93 DE LA COMISIÓN de 6 de julio de 1993 por el
    que se determina la proporción en que podrán aceptarse las solicitudes de licencias
    de importación de algunas carnes de vacuno frescas, refrigeradas o en conserva
    presentadas en mayo de 1993 al amparo del régimen de importación establecido
    en el Acuerdo agrario bilateral celebrado entre la Comunidad y Suecia
  type: main
