title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 845/77 of 25 April 1977 maintaining in force
    the arrangements for the authorization of imports into France and into the United
    Kingdom of certain knitted or crocheted under garments originating in the Republic
    of the Philippines or the Kingdom of Thailand
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 845/77 du Conseil, du 25 avril 1977, portant maintien
    du régime d'autorisation d'importation en France et au Royaume-Uni de certains
    vêtements de dessous de bonneterie, originaires de la République des Philippines
    et du Royaume de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 845/77 des Rates vom 25. April 1977 zur Aufrechterhaltung
    der Regelung, nach der die Einfuhren bestimmter Unterkleidung aus Gewirken mit
    Ursprung in der Republik der Philippinen und im Königreich Thailand nach Frankreich
    und in das Vereinigte Königreich von einer Genehmigung abhängig sind
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 845/77 af 25. april 1977 om opretholdelse
    af bevillingsordningen for indførsel til Frankrig og Det forenede Kongerige af
    visse underbeklædningsgenstande af trikotage, med oprindelse i republikken Filippinerne
    og i kongeriget Thailand
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 845/77 del Consiglio, del 25 aprile 1977, che mantiene
    in vigore il regime di autorizzazione per l'importazione in Francia e nel Regno
    Unito di talune sottovesti a maglia originarie della Repubblica delle Filippine
    e del Regno di Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 845/77 van de Raad van 25 april 1977 houdende handhaving
    van het vergunningenstelsel voor de invoer in Frankrijk en in het Verenigd Koninkrijk
    van bepaalde onderkleding van brei- of haakwerk van oorsprong uit de Republiek
    der Filippijnen en het Koninkrijk Thailand
