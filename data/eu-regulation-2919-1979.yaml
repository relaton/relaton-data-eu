title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2919/79 of 20 December 1979 on the conclusion
    of the Agreement in the form of an exchage of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1979 to 31 October 1980
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2919/79 du Conseil, du 20 décembre 1979, concernant
    la conclusion de l'accord sous forme d'échange de lettres entre la Communauté
    économique européenne et le Royaume du Maroc fixant, pour la période du 1er
    novembre 1979 au 31 octobre 1980, le montant additionnel à déduire du prélèvement
    applicable à l'importation dans la Communauté d'huile d'olive non traitée originaire
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2919/79 des Rates vom 20. Dezember 1979 über den
    Abschluß des Abkommens in Form eines Briefwechsels zwischen der Europäischen
    Wirtschaftsgemeinschaft und dem Königreich Marokko zur Festsetzung des vom 1.
    November 1979 bis 31. Oktober 1980 geltenden Zusatzbetrags, der bei der Einfuhr
    in die Gemeinschaft von nicht behandeltem Olivenöl mit Ursprung in Marokko von
    der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2919/79 af 20. december 1979 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og kongeriget Marokko vedrørende fastsættelse for perioden 1. november 1979
    til 31. oktober 1980 af det tillægsbeløb, som skal fratrækkes den afgift, der
    anvendes ved indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse
    i Marokko
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2919/79 del Consiglio, del 20 dicembre 1979, relativo
    alla conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità
    economica europea e il Regno del Marocco, che fissa, per il periodo 1° novembre
    1979 - 31 ottobre 1980, l' importo aggiuntivo da detrarre dal prelievo applicabile
    all' importazione nella Comunità di olio di oliva non trattato originario del
    Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2919/79 van de Raad van 20 december 1979 houdende
    sluiting van de Overeenkomst in de vorm van een briefwisseling tussen de Europese
    Economische Gemeenschap en het Koninkrijk Marokko tot vaststelling, voor het tijdvak
    van 1 november 1979 tot en met 31 oktober 1980, van het aanvullend bedrag dat
    in mindering moet worden gebracht op de heffing die bij invoer in de Gemeenschap
    van toepassing is op niet-behandelde olijfolie van oorsprong uit Marokko
