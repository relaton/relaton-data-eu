    le règlement (CE) n o 878/2004 établissant des mesures transitoires conformément
    au règlement (CE) n o 1774/2002, en ce qui concerne certains sous-produits animaux
    classés comme matières des catégories 1 et 2 et destinés à des utilisations
    techniques
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1877/2006 der Kommission vom 18. Dezember 2006 zur
    Änderung der Verordnung (EG) Nr. 878/2004 mit Übergangsregelungen gemäß der
    Verordnung (EG) Nr. 1774/2002 hinsichtlich bestimmter tierischer Nebenprodukte,
    die als Material der Kategorien 1 und 2 eingestuft werden und für technische
    Verwendungszwecke bestimmt sind
  type: main
