title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1482/82 of 10 June 1982 derogating from
    Regulation (EEC) No 1726/70 on the procedure for granting the premium for leaf
    tobacco as regards the dates for the conclusion and registration of cultivation
    contracts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1482/82 de la Commission, du 10 juin 1982, dérogeant
    au règlement (CEE) n° 1726/70 relatif aux modalités d' octroi de la prime pour
    le tabac en feuilles en ce qui concerne les dates de conclusion et d' enregistrement
    des contrats de culturer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1482/82 der Kommission vom 10. Juni 1982 zur Abweichung
    von der Verordnung (EWG) Nr. 1726/70 über Durchführungsbestimmungen für die
    Gewährung der Prämie für Tabakblätter hinsichtlich der Termine für den Abschluß
    und die Registrierung der Anbauverträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1482/82 af 10. juni 1982 om undtagelse
    fra forordning (EØF) nr. 1726/70 om gennemførelsesbestemmelser for ydelse af
    præmie for tobak i blade, for så vidt angår datoerne for indgåelse og registrering
    af dyrkningskontrakter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1482/82 τής Επιτροπής
    τής 10ης Ιουνίου 1982 περί παρεκκλίσεως από τόν
    κανονισμό (EOK) αριθ. 1726/70 περί τών λεπτομερειών
    χορηγήσεως πριμοδοτήσεως στόν καπνό σέ φύλλα
    όσον αφορά τίς ημερομηνίες συνάψεως καί καταχωρήσεως
    τών συμβάσεων καλλιεργείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1482/82 della Commissione, del 10 giugno 1982, che
    deroga al regolamento (CEE) n. 1726/70 che fissa le modalità relative alla concessione
    del premio per il tabacco in foglia per quanto riguarda le date di conclusione
    e registrazione dei contratti di coltivazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1482/82 van de Commissie van 10 juni 1982 houdende
