    luonnollisiin henkilöihin, oikeushenkilöihin, yhteisöihin tai elimiin kohdistuvista
    rajoittavista lisätoimenpiteistä annetun asetuksen (EU) 2016/1686 täytäntöönpanosta
  type: main
- language: ga
