    namířených proti ISIL (Dá’iš) a al-Káidě a fyzickým a právnickým osobám,
    subjektům a orgánům, které jsou s nimi spojeny
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) 2022/235 af 21. februar 2022 om
    gennemførelse af forordning (EU) 2016/1686 om indførelse af yderligere restriktive
    foranstaltninger over for ISIL (Da'esh) og al-Qaeda og fysiske og juridiske personer,
    enheder eller organer, der er knyttet til dem
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/235 του Συμβουλίου
