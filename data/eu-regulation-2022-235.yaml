    мерки, насочени срещу ИДИЛ (Даиш) и Ал-Кайда
    и физически и юридически лица, образувания
    или органи, свързани с тях
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) 2022/235 ze dne 21. února 2022, kterým
