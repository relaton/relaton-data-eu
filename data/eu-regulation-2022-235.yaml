title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) 2022/235 of 21 February 2022 implementing
    Regulation (EU) 2016/1686 imposing additional restrictive measures directed against
    ISIL (Da’esh) and Al-Qaeda and natural and legal persons, entities or bodies
    associated with them
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/235 du Conseil du 21 février 2022
    mettant en œuvre le règlement (UE) 2016/1686 instituant des mesures restrictives
    supplémentaires à l’encontre de l’EIIL (Daech) et d’Al-Qaida ainsi que
    des personnes physiques et morales, des entités ou des organismes qui leur sont
    liés
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/235 des Rates vom 21. Februar 2022 zur
    Durchführung der Verordnung (EU) 2016/1686 zur Verhängung zusätzlicher restriktiver
    Maßnahmen gegen ISIL (Da’esh) und Al-Qaida und die mit ihnen verbundenen natürlichen
    oder juristischen Personen, Organisationen und Einrichtungen
  type: main
- language: bg
  script: Cyrl
