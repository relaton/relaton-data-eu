title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/927 of 15 June 2022 imposing
    a definitive countervailing duty on imports of tubes and pipes of ductile cast
    iron (also known as spheroidal graphite cast iron) originating in India following
    an expiry review pursuant to Article 18 of Regulation (EU) 2016/1037 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/927 de la Commission du 15 juin 2022
    instituant un droit compensateur définitif sur les importations de tubes et de
    tuyaux en fonte ductile (également dénommée «fonte à graphite sphéroïdal»)
    originaires de l’Inde à l’issue d’un réexamen au titre de l’expiration
    des mesures effectué en vertu de l’article 18 du règlement (UE) 2016/1037
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
