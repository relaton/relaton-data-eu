    öntöttvasból) készült csövek behozatalára vonatkozó végleges kiegyenlítő
    vámnak az (EU) 2016/1037 európai parlamenti és tanácsi rendelet 18. cikke
    szerinti hatályvesztési felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/927 della Commissione del 15 giugno
    2022 che istituisce un dazio compensativo definitivo sulle importazioni di tubi
    di ghisa duttile (detta anche ghisa a grafite sferoidale) originari dell’India
    in seguito al riesame in previsione della scadenza a norma dell’articolo 18
    del regolamento (UE) 2016/1037 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/927 (2022. gada 15. jūnijs),
