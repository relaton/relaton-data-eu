    rahoituksen enimmäismäärästä tuotantokaudeksi 2002—2003 ja asetuksen (EY)
    N:o 528/1999 3 artiklan 3 kohdasta poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2407/2001 della Commissione, del 10 dicembre 2001,
    che fissa i massimali di finanziamento delle azioni intese a migliorare la qualità
    della produzione di olio d'oliva e di olive da tavola per il ciclo di produzione
    2002/03 e che deroga all'articolo 3, paragrafo 3, del regolamento (CE) n. 528/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2407/2001 van de Commissie van 10 december 2001 tot
    vaststelling van de plafonds voor de financiering van de acties ter verbetering
    van de kwaliteit van de productie van olĳfolie en tafelolĳven voor de productiecyclus
    2002/2003 en houdende afwĳking van artikel 3, lid 3, van Verordening (EG) nr.
    528/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2407/2001 da Comissão, de 10 de Dezembro de 2001,
    que fixa, para o ciclo de produção de 2002/2003, os limites máximos de financiamento
    das acções de melhoria da qualidade da produção de azeite e de azeitonas de
    mesa e derroga ao n.° 3 do artigo 3.° do Regulamento (CE) n.° 528/1999
  type: main
- language: es
  script: Latn
