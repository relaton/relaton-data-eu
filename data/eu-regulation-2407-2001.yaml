    zur Abweichung von Artikel 3 Absatz 3 der Verordnung (EG) Nr. 528/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2407/2001 af 10. december 2001 om fastsættelse
