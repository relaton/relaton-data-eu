    ανωτάτων επιπέδων χρηματοδότησης ενεργειών
    με σκοπό τη βελτίωση της ποιότητας της παραγωγής
    ελαιόλαδου και επιτραπέζιων ελιών για τον
    κύκλο παραγωγής 2002/03 και για παρέκκλιση από
    το άρθρο 3 παράγραφος 3 του κανονισμού (ΕΚ) αριθ.
    528/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2407/2001, annettu 10 päivänä joulukuuta 2001,
