id: EURegulation15351972
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1535/72 de la Commission, du 18 juillet 1972, portant
    rétablissement des droits du tarif douanier commun applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, de la sous- position tarifaire
    70.14 B, originaire de Hong-Kong bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1535/72 der Kommission vom 18. Juli 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Glaswaren für Beleuchtung, für
    Signalvorrichtungen oder zu optischen Zwecken, nicht aus optischem Glas, nicht
    optisch bearbeitet, der Tarifstelle 70.14 B. mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1535/72 della Commissione, del 18 luglio 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    vetrerie per illuminazione, per segnalazione e per ottica comune, della sottovoce
    doganale 70.14 B, originarie di Hong Kong, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1535/72 van de Commissie van 18 juli 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op verlichtingsartikelen, signaal- en waarschuwingsartikelen, van
    glas; optische elementen van gewoon glas, niet optisch bewerkt van onderverdeling
    70.14 B. van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening (EEG)
    nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties werden
    geopend
  type: main
