title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2879/76 of 23 November 1976 amending Regulation
    (EEC) No 1530/76 as regards the final date for application of a specific provision
    on the payment of aid for skimmed-milk powder denatured or processed into compound
    feedingstuffs within the territory of another Member State
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2879/76 du Conseil, du 23 novembre 1976, modifiant
    le règlement (CEE) n° 1530/76 en ce qui concerne la date limite d'application
    d'une modalité particulière relative au paiement de l'aide pour le lait écrémé
    en poudre dénaturé ou transformé en aliments composés pour animaux sur le
    territoire d'un autre État membre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2879/76 des Rates vom 23. November 1976 zur Änderung
    der Verordnung (EWG) Nr. 1530/76 hinsichtlich der befristeten Anwendung einer
    Sonderbestimmung für die Zahlung der Beihilfe für im Hoheitsgebiet eines anderen
    Mitgliedstaats denaturiertes oder zu Mischfutter verarbeitetes Magermilchpulver
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2879/76 af 23. november 1976 om ændring
    af forordning (EØF) nr. 1530/76 for så vidt angår den tidsbegrænsede anvendelse
    af en særlig bestemmelse om udbetaling af støtte til skummetmælkspulver, der
    denatureres eller forarbejdes til foderblandinger på en anden medlemsstats område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2879/76 του Συμβουλίου,
    της 23ης Νοεμβρίου 1976, περί τροποποίησης του
    Κανονισμού (ΕΟΚ) αριθ. 1530/76 όσον αφορά την προθεσμία
    εφαρμογής εξαιρετικής διαδικασίας όσον αφορά
    την πληρωμή ενισχύσεων για αποκορυφωμένο γάλα
    σε σκόνη το οποίο έχει μετουσιωθεί ή μετατραπεί
    σε σύνθετες ζωοτροφές στο έδαφος ενός άλλου
    κράτους μέλους
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2879/76, annettu 23 päivänä marraskuuta 1976,
    asetuksen (ETY) N:o 1530/76 muuttamisesta toisen jäsenvaltion alueella denaturoidulle
    tai rehuseoksiksi jalostetulle rasvattomalle maitojauheelle maksettavaa tukea
    koskevan yksityiskohtaisen erityissäännön soveltamisen määräpäivän osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2879/76 del Consiglio, del 23 novembre 1976, che modifica
    il regolamento (CEE) n. 1530/76, per quanto riguarda la data limite d'applicazione
    di una modalità particolare di pagamento dell'aiuto per il latte scremato in
    polvere denaturato o trasformato in alimenti composti per animali nel territorio
    di un altro Stato membro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2879/76 van de Raad van 23 november 1976 tot wijziging
