title:
- language: en
  script: Latn
  content: Commission Directive 2001/58/EC of 27 July 2001 amending for the second
    time Directive 91/155/EEC defining and laying down the detailed arrangements for
    the system of specific information relating to dangerous preparations in implementation
    of Article 14 of European Parliament and Council Directive 1999/45/EC and relating
    to dangerous substances in implementation of Article 27 of Council Directive 67/548/EEC
    (safety data sheets)
  type: main
- language: fr
  script: Latn
  content: Directive 2001/58/CE de la Commission du 27 juillet 2001 portant deuxième
    modification de la directive 91/155/CEE définissant et fixant, en application
    de l'article 14 de la directive 1999/45/CE du Parlement européen et du Conseil,
    les modalités du système d'information spécifique relatif aux préparations
    dangereuses et, en application de l'article 27 de la directive 67/548/CEE du Conseil,
    les modalités du système d'information spécifique relatif aux substances dangereuses
    (fiches de données de sécurité)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/58/EG der Kommission vom 27. Juli 2001 zur zweiten Änderung
    der Richtlinie 91/155/EWG zur Festlegung der Einzelheiten eines besonderen Informationssystems
    für gefährliche Zubereitungen gemäß Artikel 14 der Richtlinie 1999/45/EG des
    Europäischen Parlaments und des Rates und für gefährliche Stoffe gemäß Artikel
    27 der Richtlinie 67/548/EWG des Rates (Sicherheitsdatenblätter)
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/58/ЕО на Комисията от 27 юли
    2001 година относно второ изменение на Директива
    91/155/ЕИО за определяне и установяване на подробни
    правила на системата за специфична информация,
    отнасяща се до опасни препарати в изпълнение
    на член 14 от Директива 1999/45/ЕО на Европейския
    парламент и на Съвета по отношение на опасни
    вещества в изпълнение на член 27 от Директива
    67/548/ЕИО на Съвета (информационни листове за
    безопасност)
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2001/58/ES ze dne 27. července 2001, kterou se podruhé
    mění směrnice 91/155/EHS, kterou se vymezují a stanoví podrobnosti o systému
    specifických informací pro nebezpečné přípravky podle článku 14 směrnice
    Evropského parlamentu a Rady 1999/45/ES a pro nebezpečné látky podle článku
    27 směrnice Rady 67/548/EHS (bezpečnostní listy)
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2001/58/EF af 27. juli 2001 om anden ændring af
    direktiv 91/155/EØF om fastsættelse af de nærmere bestemmelser for en særlig
    informationsordning vedrørende farlige præparater til gennemførelse af artikel
    14 i Europa-Parlamentets og Rådets direktiv 1999/45/EF og vedrørende farlige
    stoffer til gennemførelse af artikel 27 i Rådets direktiv 67/548/EØF (sikkerhedsdatablade)
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/58/ΕΚ της Επιτροπής, της 27ης Ιουλίου
    2001, για δεύτερη τροποποίηση της οδηγίας 91/155/ΕΟΚ
    για τον προσδιορισμό και καθορισμό των λεπτομερών
    κανόνων για το σύστημα ειδικής πληροφόρησης
    σχετικά με τα επικίνδυνα παρασκευάσματα κατ'
    εφαρμογή του άρθρου 14 της οδηγίας 1999/45/ΕΚ του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    και σχετικά με τις επικίνδυνες ουσίες κατ'
    εφαρμογή του άρθρου 27 της οδηγίας 67/548/ΕΟΚ του
    Συμβουλίου (δελτία δεδομένων ασφαλείας)
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2001/58/EÜ, 27. juuli 2001, millega muudetakse teist
    korda direktiivi 91/155/EMÜ, milles määratletakse ja sätestatakse ohtlikke
    valmistisi käsitleva eriteabe süsteemi üksikasjalik kord Euroopa Parlamendi
    ja nõukogu direktiivi 1999/45/EÜ artikli 14 rakendamiseks ning ohtlikke aineid
    käsitleva eriteabe süsteemi üksikasjalik kord nõukogu direktiivi 67/548/EMÜ
    artikli 27 rakendamiseks (ohutuskaardid)
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2001/58/EY, annettu 27 päivänä heinäkuuta 2001,
    yksityiskohtaisten järjestelyjen määrittelemisestä ja vahvistamisesta vaarallisia
    valmisteita koskevaa erityistietojärjestelmää varten Euroopan parlamentin ja
    neuvoston direktiivin 1999/45/EY 14 artiklan täytäntöönpanemiseksi annetun
    direktiivin 91/155/ETY muuttamisesta toisen kerran neuvoston direktiivin 67/548/ETY
    27 artiklan (käyttöturvallisuustiedotteet) täytäntöönpanemiseksi vaarallisten
    aineiden osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2001/58/EK irányelve (2001. július 27.) az 1999/45/EK európai
    parlamenti és tanácsi irányelv 14. cikkének végrehajtása során a veszélyes
    készítményekre, illetve a 67/548/EGK tanácsi irányelv 27. cikkének végrehajtása
    során a veszélyes anyagokra vonatkozó különös információk rendszerével
    kapcsolatos részletes rendelkezések meghatározásáról és megállapításáról
    szóló 91/155/EGK irányelv második alkalommal történő módosításáról
    (biztonsági adatlapok)
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/58/CE della Commissione, del 27 luglio 2001, che modifica
    per la seconda volta la direttiva 91/155/CEE che definisce e fissa le modalità
    del sistema di informazione specifica concernente i preparati pericolosi ai sensi
    dell'articolo 14 della direttiva 1999/45/CE del Parlamento europeo e del Consiglio
    nonché quelle relative alle sostanze pericolose conformemente all'articolo 27
    della direttiva 67/548/CEE del Consiglio (schede dati di sicurezza)
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2001/58/EK (2001. gada 27. jūlijs), ar kuru otro
    reizi groza Direktīvu 91/155/EEK, ar ko nosaka un izklāsta sīki izstrādātu
    kārtību, kādā izveidojama īpašas informācijas sistēma attiecībā uz bīstamiem
    preparātiem, īstenojot Eiropas Parlamenta un Padomes Direktīvas 1999/45/EK
    14. pantu, un attiecībā uz bīstamām vielām, īstenojot Padomes Direktīvas
    67/548/EEK 27. pantu (drošības datu lapas)
  type: main
- language: lt
  script: Latn
  content: 2001 m. liepos 27 d. Komisijos direktyva 2001/58/EB antrą kartą iš dalies
    keičianti Direktyvą 91/155/EEB, kurioje apibrėžiamos ir nustatomos išsamios
    nuostatos dėl specifinės informacijos, susijusios su pavojingais preparatais,
    sistemos įgyvendinant Europos Parlamento ir Tarybos direktyvos 1999/45/EB 14
    straipsnį ir apie pavojingas medžiagas įgyvendinant Tarybos direktyvos 67/548/EEB
    27 straipsnį (dėl saugos duomenų lapų)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2001/58/KE tas-27 ta' Lulju 2001 li temenda
    għat-tieni darba d-Direttiva 91/155/KEE li tiddefinixxi u tistabbilixxi l-arranġamenti
    ddettaljati għas-sistema tat-tagħrif speċifiku dwar il-preparazzjonijiet perikolużi
    fl-implimentazzjoni ta' l-Artikolu 14 tad-Direttiva 1999/45/KE tal-Parlament Ewropew
    u tal-Kunsill, u dwar is-sustanzi perikolużi fl-implimentazzjoni ta' l-Artikolu
    27 tad-Direttiva tal-Kunsill 67/548/KEE (data sheets tas-sigurtà)
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2001/58/EG van de Commissie van 27 juli 2001 tot tweede wĳziging
    van Richtlĳn 91/155/EEG houdende beschrĳving en vaststelling van de wĳze van
    uitvoering van het systeem voor specifieke informatie inzake gevaarlĳke preparaten
    krachtens artikel 14 van Richtlĳn 1999/45/EG van het Europees Parlement en de
    Raad en inzake gevaarlĳke stoffen krachtens artikel 27 van Richtlĳn 67/548/EEG
    van de Raad (veiligheidsinformatiebladen)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2001/58/WE z dnia 27 lipca 2001 r. zmieniająca po raz
    drugi dyrektywę 91/155/EWG określającą i ustanawiającą szczegółowe uzgodnienia
    dotyczące systemu szczególnych informacji o preparatach niebezpiecznych w związku
    z wykonaniem art. 14 dyrektywy Parlamentu Europejskiego i Rady 99/45/WE oraz odnosząca
    się do substancji niebezpiecznych w związku z wykonaniem art. 27 dyrektywy Rady
    67/548/EWG (arkusz danych dotyczących bezpieczeństwa)
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/58/CE da Comissão, de 27 de Julho de 2001, que altera pela
    segunda vez a Directiva 91/155/CEE que define e estabelece as modalidades do sistema
    de informação específico relativo às preparações perigosas, em aplicação
    do artigo 14.° da Directiva 1999/45/CE do Parlamento Europeu e do Conselho relativo
    às substâncias perigosas, em aplicação do artigo 27.° da Directiva 67/548/CEE
    do Conselho (fichas de segurança)
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/58/CE a Comisiei din 27 iulie 2001 de efectuare a celei
    de-a doua modificări a Directivei 91/155/CEE pentru definirea și stabilirea,
    în conformitate cu articolul 14 din Directiva 1999/45/CE a Parlamentului European
    și a Consiliului, a normelor metodologice privind sistemul specific de informare
    referitor la preparatele periculoase, precum și, în conformitate cu articolul
    27 din Directiva 67/548/CEE a Consiliului, a normelor metodologice privind sistemul
    specific de informare referitor la substanțele periculoase (fișe tehnice de
    securitate)
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2001/58/ES z 27. júla 2001, ktorou sa druhýkrát mení
    a dopĺňa smernica 91/155/EHS, ktorou sa stanovujú podrobnosti informačného
    systému pre nebezpečné prípravky na vykonanie článku 14 smernice Európskeho
    parlamentu a Rady 1999/45/ES a o nebezpečných látkach na vykonanie článku
    27 smernice Rady 67/548/EHS (karty bezpečnostných údajov)
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2001/58/ES z dne 27. julija 2001 o drugi spremembi Direktive
    Komisije 91/155/EGS o opredelitvi in določitvi podrobne ureditve sistema posebnih
    informacij za nevarne pripravke v skladu s členom 14 Direktive Evropskega parlamenta
    in Sveta 1999/45/ES in v zvezi z nevarnimi snovmi v skladu s členom 27 Direktive
    Sveta 67/548/EGS (varnostni listi)
  type: main
- language: es
  script: Latn
  content: Directiva 2001/58/CE de la Comisión, de 27 de julio de 2001, que modifica
    por segunda vez la Directiva 91/155/CEE de la Comisión, por la que se definen
    y fijan las modalidades del sistema de información específica respecto a los
    preparados peligrosos en aplicación del artículo 14 de la Directiva 1999/45/CE
    del Parlamento Europeo y del Consejo y respecto a las sustancias peligrosas en
    aplicación del artículo 27 de la Directiva 67/548/CEE del Consejo (fichas de
    datos de seguridad)
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2001/58/EG av den 27 juli 2001 om ändring för
    andra gången av direktiv 91/155/EEG om införandet och den närmare utformningen
    av ett särskilt informationssystem avseende farliga preparat (beredningar) i
    enlighet med artikel 14 i Europaparlamentets och rådets direktiv 1999/45/EG och
    avseende farliga ämnen i enlighet med artikel 27 i rådets direktiv 67/548/EEG
    (säkerhetsdatablad)
