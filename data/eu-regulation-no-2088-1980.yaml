title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2088/80 of 4 August 1980 re-establishing
    the levying of customs duties on antibiotics, falling within heading No 29.44
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2088/80 de la Commission, du 4 août 1980, portant
    rétablissement de la perception des droits de douane applicables aux antibiotiques,
    de la position 29.44 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2088/80 der Kommission vom 4. August 1980 zur Wiedereinführung
    des Zollsatzes für Antibiotika der Tarifnummer 29.44, mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2088/80 af 4. august 1980 om genindførelse
    af opkrævning af toldafgifter for antibiotica under pos. 29.44, som har oprindelse
    i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2088/80 della Commissione, del 4 agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli antibiotici della
    voce 29.44 della tariffa doganale comune, originari della Cina, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2088/80 van de Commissie van 4 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op antibiotica
    van post 29.44, van oorsprong uit China ten behoeve waarvan bij Verordening (EEG)
    nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
