type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1502/73 of the Commission of 6 June 1973 re-establishing
    Common Customs Tariff duties on wrought bars, rods, angles, shapes and sections
    of aluminium, as well as aluminium wire, falling within sub-heading No 76.02,
    originating in Yugoslavia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1502/73 de la Commission, du 6 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux barres, profilés et fils de section pleine, en aluminium, de la position
    tarifaire 76.02, originaires de Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1502/73 der Kommission vom 6. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Stäbe, Profile und Draht, aus
    Aluminium, massiv, der Tarifnummer 76.02, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1502/73 af 6. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for stænger, profiler og tråd, af aluminium
    under position 76.02 som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1502/73 della Commissione, del 6 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    barre, profilati e fili di sezione piena, di alluminio, della voce doganale n.
    76.02, originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1502/73 van de Commissie van 6 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op staven, profielen en draad, massief, van aluminium van post
    76.02, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG)
    nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden
    geopend
  type: main
