  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2611/83 della Commissione, del 15 settembre 1983,
    relativo alla vendita, a prezzi fissati forfettariamente in anticipo, di talune
    carni bovine provenienti dalle scorte d'intervento e destinate alla trasformazione
    nella Comunità e recante abrogazione del regolamento (CEE) n. 1965/83
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2611/83 van de Commissie van 15 september 1983 inzake
