title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2611/83 of 15 September 1983 on the sale
    at prices fixed at a standard rate in advance of certain beef from intervention
    stocks for processing in the Community and repealing Regulation (EEC) No 1965/83
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2611/83 de la Commission, du 15 septembre 1983, relatif
    à la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d'intervention
    et abrogeant le règlement (CEE) n 1965/83
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2611/83 der Kommission vom 15. September 1983 über
    den Verkauf von bestimmtem Interventionsrindfleisch, das zur Verarbeitung in der
    Gemeinschaft bestimmt ist, zu pauschal im voraus festgesetzten Preisen und zur
    Aufhebung der Verordnung (EWG) Nr. 1965/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2611/83 af 19. september 1983 om salg
    til forudfastsatte priser af visse former for oksekød fra interventionslagrene
    med henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 1965/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2611/83 της Επιτροπής
