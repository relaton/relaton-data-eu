    αποκοπή τιμή καθοριζόμενη εκ των προτέρων,
    εν όψει της μεταποιήσεώς τους εντός της Κοινότητας,
    ορισμένων βοείων κρεάτων που προέρχονται από
    αποθέματα οργανισμών παρεμβάσεως και περί
