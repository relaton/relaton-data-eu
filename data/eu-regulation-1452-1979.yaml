id: EURegulation14521979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1452/79 of 12 July 1979 re-establishing
    the levying of the customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of other kinds of pottery ; earthenware
    or fine pottery, falling within subheading 69.12 C and originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1452/79 de la Commission, du 12 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en autres matières céramiques, en
    faïence ou en poterie fine, de la sous-position 69.12 C du tarif douanier commun,
    originaires de Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1452/79 der Kommission vom 12. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus anderen
    keramischen Stoffen, aus Steingut oder feinen Erden, der Tarifstelle 69.12 C,
    mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1452/79 af 12. juli 1979 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler
    af andet keramisk materiale, varer af fajance eller fint ler, henhørende under
    pos. 69.12 C i den fælles toldtarif, som har oprindelse i Sydkorea og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1452/79 della Commissione, del 12 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e agli oggetti
    di uso domestico o da toletta, di altre materie ceramiche, di terracotta fine
    o di terraglia, della sottovoce 69.12 C della tariffa doganale comune, originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1452/79 van de Commissie van 12 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op vaatwerk,
    huishoudelijke artikelen en toiletartikelen, van andere keramische stoffen, van
    faience of van fijn aardewerk, van post 69.12 C, van oorsprong uit Zuid-Korea,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
