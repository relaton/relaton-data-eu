title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1183/77 of 3 June 1977 maintaining the arrangements
    making the importation into Italy of certain woven fabrics of cotton and certain
    woven fabrics of synthetic textile fibres originating in the Kingdom of Thailand
    subject to authorization
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1183/77 du Conseil, du 3 juin 1977, portant maintien
    du régime soumettant à autorisation les importations en Italie de certains tissus
    de coton et de fibres textiles synthétiques originaires du Royaume de Thaïlande
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1183/77 des Rates vom 3. Juni 1977 zur Aufrechterhaltung
    der Regelung, mit der die Einfuhr von Geweben aus Baumwolle und Geweben aus synthetischen
    Spinnfasern mit Ursprung im Königreich Thailand nach Italien von der Erteilung
    einer Genehmigung abhängig gemacht wird
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1183/77 af 3. juni 1977 om opretholdelse
    af importbevillingsordningen ved indførsel til Italien af vævede stoffer af
    bomuld og af syntetiske fibre med oprindelse i kongeriget Thailand
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1183/77 del Consiglio, del 3 giugno 1977, che mantiene
    in vigore il regime che subordina a licenza le importazioni in Italia di taluni
    tessuti di cotone e di fibre tessili sintetiche originari del Regno di Tailandia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1183/77 van de Raad van 3 juni 1977 tot handhaving
    van de regeling houdende instelling van een vergunningenstelsel voor de invoer
    in Italië van bepaalde weefsels van katoen en weefsels van synthetische textielvezels
    van oorsprong uit het Koninkrijk Thailand
  type: main
