title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 454/2005 of 18 March 2005 determining the
    extent to which applications lodged in March 2005 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 April 2005 to 30 June 2005 can be accepted
  type: main
- language: fr
  script: Latn
