  script: Latn
  content: Commission Regulation (EU) 2022/1038 of 29 June 2022 amending Annex II
    to Regulation (EC) No 1333/2008 of the European Parliament and of the Council
    as regards the use of polyvinylpyrrolidone (E1201) in food for special medical
    purposes, in tablet and coated tablet forms
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1038 de la Commission du 29 juin 2022 modifiant l’annexe
