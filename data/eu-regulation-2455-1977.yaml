title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2455/77 of 8 November 1977 re-establishing
    the levying of customs duties on ammonia, anhydrous or in aqueous solution, falling
    within heading No 28.16, originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2455/77 de la Commission, du 8 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables à l'ammoniac
    liquéfié ou en solution (ammoniaque), de la position tarifaire 28.16, originaire
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2455/77 der Kommission vom 8. November 1977 zur Wiedereinführung
    des Zollsatzes für Ammoniak, verflüssigt oder gelöst (Salmiakgeist), der Tarifnummer
    28.16, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2455/77 af 8. november 1977 om genindførelse
    af opkrævning af toldafgifter for ammoniak, under underposition 28.16, som har
    oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2455/77 della Commissione, dell'8 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili all'ammoniaca liquefatta
    o in soluzione, della voce doganale 28.16, originaria dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2455/77 van de Commissie van 8 november 1977 houdende
    wederinstelling van de heffing van de douanerechten voor ammoniak en ammonia,
    van post 28.16, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
