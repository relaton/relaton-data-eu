  content: COMMISSION REGULATION (EEC) No 2524/93 of 13 September 1993 re-establishing
    the levying of customs duties on products of category 35 (order No 40.0350), originating
    in Pakistan and Malaysia, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2524/93 de la Commission du 13 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 35 (numéro d'ordre 40.0350) originaires du Pakistan et de Malaysia,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2524/93 DER KOMMISSION vom 13. September 1993 zur
    Wiedereinführung des Zollsatzes für die Waren der Kategorie 35 (laufende Nummer
    40.0350) mit Ursprung in Pakistan und Malaysia, für die die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2524/93 af 13. september 1993 om genindførelse
    af opkrævning af told for varer under kategori 35 (løbenummer 40.0350), som
    har oprindelse i Pakistan og Malaysia og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
