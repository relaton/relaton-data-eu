  content: Commission Regulation (EU) 2015/896 of 11 June 2015 amending Annex IV to
    Regulation (EC) No 396/2005 of the European Parliament and of the Council as regards
    maximum residue levels for Trichoderma polysporum strain IMI 206039, Trichoderma
    asperellum (formerly T. harzianum) strains ICC012, T25 and TV1, Trichoderma atroviride
    (formerly T. harzianum) strains IMI 206040 and T11, Trichoderma harzianum strains
    T-22 and ITEM 908, Trichoderma gamsii (formerly T. viride) strain ICC080, Trichoderma
    asperellum (strain T34), Trichoderma atroviride strain I-1237, geraniol, thymol,
    sucrose, ferric sulphate (iron (III) sulphate), ferrous sulphate (iron (II) sulphate)
    and folic acid in or on certain products
  type: main
- language: fr
  script: Latn
