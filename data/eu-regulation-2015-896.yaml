    IV du règlement (CE) n° 396/2005 du Parlement européen et du Conseil en ce
    qui concerne les limites maximales applicables aux résidus de Trichoderma polysporum
    — souche IMI 206039, de Trichoderma asperellum (anciennement T. harzianum) —
    souches ICC012, T25 et TV1, de Trichoderma atroviride (anciennement T. harzianum)
    — souches IMI 206040 et T11, de Trichoderma harzianum — souches T-22 et ITEM
    908, de Trichoderma gamsii (anciennement T. viride) — souche ICC080, de Trichoderma
    asperellum — souche T34, de Trichoderma atroviride — souche I-1237, de géraniol,
    de thymol, de saccharose, de sulfate ferrique [sulfate de fer (III)], de sulfate
    ferreux [sulfate de fer (II)] et d'acide folique présents dans ou sur certains
    produits
  type: main
