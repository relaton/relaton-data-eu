title:
- language: en
  script: Latn
  content: '88/162/EEC: Commission Decision of 1 February 1988 on a concerted measure
    for the grant of a standby indemnity to fishermen from certain Member States of
    the Community who have had to suspend their fishing activities in waters under
    the sovereignty or jurisdiction of Morocco (Only the Spanish and Portuguese texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/162/CEE: Décision de la Commission du 1er février 1988 relative à
    une action concertée pour l''octroi d''une indemnité d''attente destinée aux
    pêcheurs de certains États membres de la Communauté ayant dû suspendre leurs
    activités de pêche dans les eaux sous souveraineté ou juridiction du Maroc
    (Les textes en langues espagnole etportugaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/162/EWG: Entscheidung der Kommission vom 1. Februar 1988 über eine
    konzertierte Maßnahme für die Gewährung einer Überliegeentscheidung zugunsten
    von Fischern bestimmter Mitgliedstaaten der Gemeinschaft, die ihre Fangtätigkeit
    in den Gewässern unter der Hoheit oder Gerichtsbarkeit Marokkos einstellen mußten
    (Nur der spanische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/162/EØF: Kommissionens beslutning af 1. februar 1988 om en samordnet
    foranstaltning til ydelse af ventegodtgørelse til de fiskere fra visse medlemsstater
    i Fællesskabet, der har måttet indstille deres fiskeri i farvandene under Marokkos
    højhedsområde eller jurisdiktion (Kun den spanske og portugisiske udgave er
    autentiske)'
  type: main
- language: el
  script: Grek
  content: '88/162/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Φεβρουαρίου
    1988 σχετικά με συντονισμένη δράση για τη χορήγηση
    αποζημίωσης αναμονής στους αλιείς ορισμένων
    κρατών μελών της Κοινότητας οι οποίοι έχουν
    αναγκαστεί να διακόψουν τις αλιευτικές τους
    δραστηριότητες στα ύδατα που βρίσκονται υπό
    την κυριαρχία ή τη δικαιοδοσία του Μαρόκου
