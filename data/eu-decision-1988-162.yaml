    le attività di pesca nelle acque soggette alla sovranità o alla giurisdizione
    del Marocco (Il testi in lingua spagnola e portoghese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '88/162/EEG: Beschikking van de Commissie van 1 februari 1988 inzake een
