title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1717/1999 of 30 July 1999 determining the
    extent to which import rights applications submitted in July 1999 under the tariff
    quotas for beef provided for by Regulation (EC) No 1272/1999 for Estonia, Latvia,
    and Lithuania may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1717/1999 de la Commission, du 30 juillet 1999, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites en juillet 1999 pour les contingents tarifaires de la viande bovine
    prévus par le règlement (CE) n° 1272/1999 pour l'Estonie, la Lettonie et la
    Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1717/1999 der Kommission vom 30. Juli 1999 zur Bestimmung
    des Ausmaßes, in dem den im Juli 1999 gestellten Anträgen auf Erteilung von
    Einfuhrrechte im Rahmen der in der Verordnung (EG) Nr. 1272/1999 für Litauen,
    Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1717/1999 af 30. juli 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder indgivet
    i juli 1999 for de toldkontingenter i oksekødssektoren, der er fastsat i forordning
    (EF) nr. 1272/1999 for Estland, Letland og Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1717/1999 της Επιτροπής,
    της 30ής Ιουλίου 1999, για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως δικαιωμάτων εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1999 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται από τον
    κανονισμό (ΕΚ) αριθ. 1272/1999 για την Εσθονία, τη
    Λετονία και τη Λιθουανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1717/1999, annettu 30 päivänä heinäkuuta
    1999, asetuksessa (EY) N:o 1272/1999 määrättyjen naudanlihan tariffikiintiöitä
    koskevien, heinäkuussa 1999 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
    Viron, Latvian ja Liettuan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1717/1999 della Commissione, del 30 luglio 1999, che
    stabilisce in che misura possono essere accolte le domande di diritti di importazione
    presentate nel luglio 1999 per i contingenti tariffari di carni bovine previsti
    dal regolamento (CE) n. 1272/1999 per l'Estonia, la Lettonia e la Lituania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1717/1999 van de Commissie van 30 juli 1999 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 1999 ingediende aanvragen
    om rechten tot invoer voor de tariefcontingenten voor rundvlees op grond van Verordening
    (EG) nr. 1272/1999 voor Estland, Letland en Litouwen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1717/1999 da Comissão, de 30 de Julho de 1999, que
    determina em que medida podem ser aceites os pedidos dos direitos de importação
    apresentados em Julho de 1999 para os contingentes pautais de carne de bovino
    previstos no Regulamento (CE) n° 1272/1999 para a Estónia, a Letónia e a Lituânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1717/1999 de la Comisión, de 30 de julio de 1999,
    por el que se determina la proporción en que podrán aceptarse las solicitudes
    de derechos de importación, presentadas en julio de 1999, correspondientes a
    los contingentes arancelarios de carne de vacuno establecidos por el Reglamento
    (CE) n° 1272/1999 para Lituania, Letonia y Estonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1717/1999 av den 30 juli 1999 om i vilken
