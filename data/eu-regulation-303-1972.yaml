title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 303/72 de la Commission, du 10 février 1972, modifiant
    les montants compensatoires fixés dans le secteur agricole à la suite de l'élargissement
    temporaire des marges de fluctuation des monnaies des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 303/72 der Kommission vom 10. Februar 1972 zur Änderung
    der Ausgleichsbeträge, die in der Landwirtschaft im Anschluß an die vorübergehende
    Erweiterung der Bandbreiten der Währungen der Mitgliedstaaten festgesetzt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 303/72 della Commissione, del 10 febbraio 1972, che
    modifica gli importi di compensazione fissati per il settore agricolo in seguito
    all'ampliamento temporaneo dei margini di fluttuazione delle monete degli Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 303/72 van de Commissie van 10 februari 1972 houdende
    wijziging van de compenserende bedragen welke naar aanleiding van de tijdelijke
    verruiming van de fluctuatiemarges van de valuta's van de Lid-Staten werden vastgesteld
    in de landbouwsector
  type: main
