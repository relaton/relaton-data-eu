    communautaire les importations de certains produits textiles originaires de certains
    pays tiers #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3788/91 DER KOMMISSION vom 19. Dezember 1991 zur
