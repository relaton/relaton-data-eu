    bestimmter Textilwaren aus bestimmten Drittländern einer Gemeinschaftsüberwachung
    unterworfen wird #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3788/91 af 19. december 1991 om ændring
