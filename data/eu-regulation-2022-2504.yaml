  content: Commission Implementing Regulation (EU) 2022/2504 of 19 December 2022 amending
    Annexes III and V to Implementing Regulation (EU) 2020/2235 as regards model animal
    health/official certificates and official certificates for the entry into the
    Union of consignments of certain fishery products and highly refined products
    of animal origin, and model private attestation for entering certain composite
    products into the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2504 de la Commission du 19 décembre
    2022 modifiant les annexes III et V du règlement d’exécution (UE) 2020/2235
    en ce qui concerne les modèles de certificat zoosanitaire/officiel et les modèles
    de certificat officiel pour l’entrée dans l’Union d’envois de certains
    produits de la pêche et produits hautement raffinés d’origine animale, et
    le modèle d’attestation privée pour l’entrée dans l’Union de certains
    produits composés
  type: main
