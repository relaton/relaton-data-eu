id: EUDecision2022531
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/531 of 31 March 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean GMB151 (BCS-GM151-6) pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2022)1893) (Only the German text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/531 de la Commission du 31 mars 2022
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié GMB151 (BCS-GM151-6), consistant en ce soja ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2022) 1893] (Le texte en langue allemande
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/531 der Kommission vom 31. März 2022
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Sojabohnen der Sorte GMB151 (BCS-GM151-6) enthalten, aus ihnen bestehen oder aus
    ihnen gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2022)1893) (Nur
    der deutsche Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/531 на Комисията
    от 31 март 2022 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    соя GMB151 (BCS-GM151-6), съгласно Регламент (ЕО) № 1829/2003
    на Европейския парламент и на Съвета (нотифицирано
    под номер С(2022) 1893) (само текстът на немски език
    е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/531 ze dne 31. března 2022 o
    povolení uvedení produktů, které obsahují geneticky modifikovanou sóju GMB151
    (BCS-GM151-6), sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2022)
    1893) (Pouze německé znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/531 af 31. marts 2022
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret GMB151-sojabønne (BCS-GM151-6), i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under
    nummer C(2022) 1893) (Kun den tyske udgave er autentisk)
  type: main
- language: el
  script: Grek
