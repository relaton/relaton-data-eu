    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένη σόγια
    GMB151 (BCS-GM151-6), σύμφωνα με τον κανονισμό (ΕΚ) αριθ.
    1829/2003 του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
