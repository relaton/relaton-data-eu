  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/531, annettu 31 päivänä
    maaliskuuta 2022, muuntogeenistä soijaa GMB151 (BCS-GM151-6) sisältävien, siitä
    koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamisen sallimisesta
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2022) 1893) (Ainoastaan saksankielinen teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/531 ón gCoimisiún an 31 Márta 2022
    lena n-athnuaitear an t-údarú chun táirgí ina bhfuil, arb í atá iontu, nó
    a tháirgtear as pónaire shoighe ghéinmhodhnaithe GMB151 (BCS-GM151-6) a chur
    ar an margadh de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa
    agus ón gComhairle (a bhfuil fógra tugtha ina leith faoi dhoiciméad C(2022)1893)
    (Is é an téacs Gearmáinise amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/531 оd 31. ožujka 2022. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificiranu soju
    GMB151 (BCS-GM151-6) ili se sastoje ili su proizvedeni od nje, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2022) 1893) (Vjerodostojan je samo tekst na njemačkom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/531 végrehajtási határozata (2022. március 31.)
    a géntechnológiával módosított GMB151 (BCS-GM151-6) szójababot tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2022) 1893. számú dokumentummal történt) (Csak a német
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/531 della Commissione del 31 marzo 2022
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati da soia geneticamente modificata GMB151 (BCS-GM151-6) in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2022) 1893] (Il testo in lingua tedesca è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/531 (2022. gada 31. marts), ar
    ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētas sojas pupas GMB151
    (BCS-GM151-6), sastāv vai ir ražoti no tām (izziņots ar dokumenta numuru C(2022)
    1893) (Autentisks ir tikai teksts vācu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/531 2022 m. kovo 31 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų sojų
    GMB151 (BCS-GM151-6), kurie iš jų sudaryti arba kurie iš jų pagaminti (pranešta
    dokumentu Nr. C(2022) 1893) (Tekstas autentiškas tik vokiečių kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/531 tal-31
    ta’ Marzu 2022 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu minn, jew li huma prodotti mill-fażola tas-sojja ġenetikament modifikata
    GMB151 (BCS-GM151-6) skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew
    u tal-Kunsill (notifikata bid-dokument C(2022)1893) (It-test bil-Ġermaniż biss
    hu awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/531 van de Commissie van 31 maart 2022 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    soja GMB151 (BCS-GM151-6) overeenkomstig Verordening (EG) nr. 1829/2003 van het
    Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2022) 1893)
    (Slechts de tekst in de Duitse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/531 z dnia 31 marca 2022 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną soję
    GMB151 (BCS-GM151-6), składających się z niej lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2022) 1893) (Jedynie tekst w języku niemieckim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/531 da Comissão de 31 de março de 2022
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de soja geneticamente modificada GMB151 (BCS-GM151-6)
    nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho
    [notificada com o número C(2022) 1893] (Apenas faz fé o texto em língua alemã)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/531 a Comisiei din 31 martie 2022
    de autorizare a introducerii pe piață a produselor care conțin, constau în
    sau sunt fabricate din soia modificată genetic GMB151 (BCS-GM151-6), în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2022) 1893] (Numai textul în limba germană este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/531 z 31. marca 2022, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestniť na trh výrobky, ktoré obsahujú geneticky modifikovanú sóju GMB151
    (BCS-GM151-6), sú z nej zložené alebo vyrobené [oznámené pod číslom C(2022)
    1893] (Iba nemecké znenie je autentické)
  type: main
