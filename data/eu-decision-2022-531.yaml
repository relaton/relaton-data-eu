  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/531, 31. märts 2022, millega lubatakse
    turule lasta geneetiliselt muundatud sojauba GMB151 (BCS-GM151-6) sisaldavaid,
    sellest koosnevaid või sellest valmistatud tooteid vastavalt Euroopa Parlamendi
