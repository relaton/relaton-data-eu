title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1376/78 of 21 June 1978 extending certain interim
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Spain, to 31 July 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1376/78 du Conseil, du 21 juin 1978, prorogeant jusqu'au
    31 juillet 1978 certaines mesures intérimaires de conservation et de gestion
    des ressources de pêche applicables aux navires battant pavillon de l'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1376/78 des Rates vom 21. Juni 1978 zur Verlängerung
    bestimmter Übergangsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände
    gegenüber Schiffen, die die Flagge Spaniens führen, bis zum 31. Juli 1978
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1376/78 af 21. juni 1978 om forlængelse
    indtil den 31. juli 1978 af en række midlertidige foranstaltninger til bevarelse
    og forvaltning af fiskeressourcerne, som skal finde anvendelse på fartøjer,
    der fører Spaniens flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1376/78 del Consiglio, del 21 giugno 1978, che proroga
    fino al 31 luglio 1978 talune misure provvisorie per la conservazione e la gestione
    delle risorse ittiche da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1376/78 van de Raad van 21 juni 1978 houdende verlenging
    tot en met 31 juli 1978 van bepaalde overgangsmaatregelen voor de instandhouding
    en het beheer van de visbestanden, die van toepassing zijn op vaartuigen die de
    vlag van Spanje voeren
