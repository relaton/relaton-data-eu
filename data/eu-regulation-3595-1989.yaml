  content: Commission Regulation (EEC) No 3595/89 of 30 November 1989 fixing, for
    1990, the quota for imports into Spain of pigmeat products from third countries
    and certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3595/89 de la Commission du 30 novembre 1989 fixant,
    pour l'année 1990, le contingent applicable à l'importation en Espagne de produits
    du secteur de la viande de porc en provenance des pays tiers et certaines modalités
    pour son application
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3595/89 DER KOMMISSION vom 30. November 1989 zur
    Festlegung des 1990 in Spanien anwendbaren Kontingents für die Einfuhr von Schweinefleischerzeugnissen
    aus Drittländern und diesbezüglicher Durchführungsbestimmungen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3595/89 af 30. november 1989 om fastsættelse
    af kontingentet for 1990 for indførsel til Spanien af svinekødprodukter fra
    tredjelande og visse bestemmelser for dets anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3595/89 της Επιτροπής
    της 30ής Νοεμβρίου 1989 που καθορίζει, για το 1990
    την ποσόστωση που εφαρμόζεται κατά την εισαγωγή
    στην Ισπανία προϊόντων του τομέα του χοιρείου
    κρέατος προέλευσης τρίτων χωρών και ορισμένες
    λεπτομέρειες για την εφαρμογή της
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3595/89 DELLA COMMISSIONE del 30 novembre 1989 che
    fissa il contingente applicabile nel 1990 alle importazioni in Spagna di prodotti
    del settore delle carni suine provenienti dai paesi terzi e stabilisce le relative
    modalità di applicazione #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3595/89 VAN DE COMMISSIE van 30 november 1989 tot
    vaststelling van het contingent voor 1990 dat Spanje voor produkten van de sector
    varkensvlees uit derde landen mag toepassen, en van uitvoeringsbepalingen ter
    zake #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 3595/89 DA COMISSÃO de 30 de Novembro de 1989 que
    fixa o contingente para o ano de 1990 aplicável em Espanha em relação aos produtos
    do sector da carne de suíno provenientes de países terceiros e determinadas
    regras para a sua aplicação #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3595/89 DE LA COMISIÓN de 30 de noviembre de 1989
    por el que se establecen los contingentes para 1990 aplicables a las importaciones
    en España de productos del sector de la carne de porcino procedentes de terceros
    países y determinadas normas para su aplicación #'
