    oltalmáról szóló 2081/92/EGK tanácsi rendeletben előírt „Oltalom alatt
    álló eredetmegjelölések és földrajzi jelzések nyilvántartása” elnevezésű
    nyilvántartásba való bejegyzéséről szóló 2400/96/EK rendelet mellékletének
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2784/98 della Commissione del 22 dicembre 1998 che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel «Registro delle denominazioni di origine protette e
    delle indicazioni geografiche protette» di cui al regolamento (CEE) n. 2081/92
    del Consiglio relativo alla protezione delle indicazioni geografiche e delle denominazioni
    di origine dei prodotti agricoli e alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2784/98 (1998. gada 22. decembris), ar ko papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu iekļaušanu “Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā”,
    kurš paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu aizsardzību
  type: main
- language: lt
  script: Latn
  content: 1998 m. gruodžio 22 d. Komisijos reglamentas (EB) Nr. 2784/98, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įtraukimo į Tarybos
    reglamente (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų
    geografinių nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų
    kilmės vietos nuorodų ir saugomų geografinių nuorodų registrą“ priedą
  type: main
