title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2037/91 of 11 July 1991 fixing for the 1991/92
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2037/91 DE LA COMMISSION du 11 juillet 1991 fixant,
    pour la campagne 1991/1992, le prix minimal à payer aux producteurs pour les
    tomates ainsi que le montant de l'' aide à la production pour les produits transformés
    à base de tomates #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2037/91 DER KOMMISSION vom 11. Juli 1991 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreis sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2037/91 af 11. juli 1991 om fastsættelse
    for produktionsåret 1991/92 af den minimumspris, der skal betales producenterne
    for tomater, samt producentstøtten for produkter forarbejdet på basis af tomater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2037/91 της Επιτροπής
    της 11ης Ιουλίου 1991 που καθορίζει, για την περίοδο
    εμπορίας 1991/92, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τις τομάτες καθώς και
    το ποσό της ενίσχυσης στην παραγωγή για τα
    μεταποιημένα προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2037/91 DELLA COMMISSIONE dell'' 11 luglio 1991 che
    stabilisce, per la campagna di commercializzazione 1991/1992, il prezzo minimo
    da pagare ai produttori di pomodori e l'' importo dell'' aiuto alla produzione
    per i prodotti trasformati a base di pomodoro #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2037/91 VAN DE COMMISSIE van 11 juli 1991 tot vaststelling,
    voor het verkoopseizoen 1991/1992, van de voor tomaten aan de telers te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2037/91 DA COMISSÃO de 11 de Julho de 1991 que fixa,
    em relação à campanha de comercialização de 1991/1992, o preço mínimo do
    tomate a pagar aos produtores, bem como o montante da ajuda à produção para
    os produtos transformados à base de tomate #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2037/91 DE LA COMISIÓN de 11 de julio de 1991 por
    el que se fijan, para la campaña de 1991/92, el precio mínimo que debe pagarse
    a los productores de tomate y el importe de la ayuda a la producción de los productos
    transformados a base de tomates #'
  type: main
