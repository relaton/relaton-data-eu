    účinných látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí
    v potravinách živočíšneho pôvodu, týkajúce sa látky triklabendazol
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 222/2012 z dne 14. marca 2012 o spremembi
