title:
- language: fr
  script: Latn
  content: '69/395/CEE: Décision de la Commission, du 27 octobre 1969, autorisant
    la République française, en vertu de l''article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire les "carreaux, pavés et dalles de pavement
    ou de revêtement, non vernissés ni émaillés, autres", position 69.07 B II,
    et les "autres carreaux, pavés et dalles de pavement ou de revêtement, autres,
    en autres matières céramiques", position 69.08 B II du Tarif douanier commun
    originaires du Japon et mis en libre pratique en Allemagne'
  type: main
- language: de
  script: Latn
  content: '69/395/EWG: Entscheidung der Kommission vom 27. Oktober 1969 zur Ermächtigung
    der Französischen Republik, gemäß Artikel 115 Absatz 1 des Vertrages "Fliesen,
    gebrannte Pflastersteine, Boden- und Wandplatten, unglasiert, und andere" der
    Tarifnummer 69.07 B II und "Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, und andere aus anderen keramischen Stoffen" der Tarifnummer 69.08 B
    II des Gemeinsamen Zolltarifs mit Ursprung in Japan, die sich in Deutschland im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/395/CEE: Decisione della Commissione, del 27 ottobre 1969, che autorizza
    la Repubblica francese, ai sensi dell''articolo 115, comma 1, del trattato, ad
    escludere dal trattamento comunitario le «piastrelle, blocchetti e lastre da
    pavimentazione o da rivestimento, non verniciati né smaltati, altri» della voce
    69.07 B II e le «altre piastrelle, blocchetti e lastre da pavimentazione o da
    rivestimento, altri, di altre materie ceramiche» della voce 69.08 B II della
    tariffa doganale comune, originarie del Giappone e messe in libera pratica in
    Germania'
  type: main
- language: nl
  script: Latn
  content: '69/395/EEG: Beschikking van de Commissie van 27 oktober 1969 waarbij aan
    de Franse Republiek machtiging wordt verleend om, op grond van artikel 115, eerste
    alinea, van het Verdrag, plavuizen, vloer- en wandtegels, verglaasd noch geglazuurd,
    andere, van post 69.07 B II, alsmede andere plavuizen en andere vloer- en wandtegels,
    andere, van andere keramische stoffen, van post 69.08 B II van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in Duitsland in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
