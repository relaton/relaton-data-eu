title:
- language: en
  script: Latn
  content: '2000/568/EC: Commission Decision of 8 September 2000 amending Decision
    96/301/EC authorising Member States temporarily to take emergency measures against
    the dissemination of Pseudomonas solanacearum (Smith) Smith as regards Egypt (notified
    under document number C(2000) 2531)'
  type: main
- language: fr
  script: Latn
  content: '2000/568/CE: Décision de la Commission du 8 septembre 2000 portant modification
    de la décision 96/301/CE autorisant les États membres à prendre provisoirement
    des mesures d''urgence en vue de se protéger contre la propagation de Pseudomonas
    solanacearum (Smith) Smith en provenance d''Égypte [notifiée sous le numéro
    C(2000) 2531]'
  type: main
- language: de
  script: Latn
  content: '2000/568/EG: Entscheidung der Kommission vom 8. September 2000 zur Änderung
    der Entscheidung 96/301/EG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    gegen die Verbreitung von Pseudomonas solanacearum (Smith) Smith befristete Sofortmaßnahmen
    gegenüber Ägypten zu treffen (Bekannt gegeben unter Aktenzeichen K(2000) 2531)'
  type: main
- language: da
  script: Latn
  content: '2000/568/EF: Kommissionens beslutning af 8. september 2000 om ændring
    af beslutning 96/301/EF om bemyndigelse af medlemsstaterne til midlertidigt at
    træffe hasteforanstaltninger mod spredning af Pseudomonas solanacearum (Smith)
    Smith, for så vidt angår Egypten (meddelt under nummer K(2000) 2531)'
  type: main
- language: el
  script: Grek
  content: '2000/568/ΕΚ: Απόφαση της Επιτροπής, της 8ης
    Σεπτεμβρίου 2000, για την τροποποίηση της απόφασης
    96/301/ΕΚ με την οποία επιτρέπεται προσωρινά στα
    κράτη μέλη να λάβουν κατεπείγοντα μέτρα κατά
    της εξάπλωσης της Pseudomonas solanacearum (Smith) Smith όσον
    αφορά την Αίγυπτο [κοινοποιηθείσα υπό τον αριθμό
    Ε(2000) 2531]'
  type: main
- language: fi
  script: Latn
  content: '2000/568/EY: Komission päätös, tehty 8 päivänä syyskuuta 2000, luvan
    antamisesta jäsenvaltioille toteuttaa väliaikaisesti Egyptiä koskevia kiireellisiä
    toimenpiteitä Pseudomonas solanacearum (Smith) Smith -taudinaiheuttajan leviämisen
    estämiseksi tehdyn päätöksen 96/301/EY muuttamisesta (tiedoksiannettu numerolla
    K(2000) 2531)'
  type: main
- language: it
  script: Latn
  content: '2000/568/CE: Decisione della Commissione, dell''8 settembre 2000, recante
    modifica della decisione 96/301/CE che autorizza gli Stati membri ad adottare,
    a titolo provvisorio, misure d''emergenza contro la propagazione di Pseudomonas
    solanacearum (Smith) Smith per quanto riguarda l''Egitto [notificata con il numero
    C(2000) 2531]'
  type: main
- language: nl
  script: Latn
  content: '2000/568/EG: Beschikking van de Commissie van 8 september 2000 houdende
    wijziging van Beschikking 96/301/EG tot machtiging van de lidstaten om ten aanzien
    van Egypte tijdelijk aanvullende maatregelen te nemen tegen de verspreiding van
    Pseudomonas solanacearum (Smith) Smith (kennisgeving geschied onder nummer C(2000)
    2531)'
  type: main
- language: pt
  script: Latn
  content: '2000/568/CE: Decisão da Comissão, de 8 de Setembro de 2000, que altera
    a Decisão 96/301/CE que autoriza os Estados-Membros a adoptar provisoriamente
    medidas adicionais contra a propagação de Pseudomonas solanacearum (Smith) Smith
    no que respeita ao Egipto [notificada com o número C(2000) 2531]'
  type: main
- language: es
  script: Latn
  content: '2000/568/CE: Decisión de la Comisión, de 8 de septiembre de 2000, que
