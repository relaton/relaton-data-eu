title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1866/72 de la Commission, du 30 août 1972, fixant
    les taux des restitutions applicables, à compter du 1er septembre 1972, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1866/72 der Kommission vom 30. August 1972 zur Festsetzung
    der ab 1. September 1972 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1866/72 della Commissione, del 30 agosto 1972, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 settembre 1972,
    a taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1866/72 van de Commissie van 30 augustus 1972 houdende
    vaststelling van de restituties welke vanaf 1 september 1972 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
