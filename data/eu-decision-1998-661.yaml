title:
- language: en
  script: Latn
  content: '98/661/EC: Commission Decision of 16 November 1998 amending Commission
    Decision 93/467/EEC authorising Member States to provide for derogations from
    certain provisions of Council Directive 77/93/EEC, in respect of oak (Quercus
    L.) logs with bark attached, originating in Canada or the United States of America
    (notified under document number C(1998) 3503)'
  type: main
- language: fr
  script: Latn
  content: '98/661/CE: Décision de la Commission du 16 novembre 1998 modifiant la
    décision 93/467/CEE autorisant les États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil en ce qui concerne
    les grumes de chêne (Quercus L.) avec écorce, originaires du Canada ou des États-Unis
    d''Amérique [notifiée sous le numéro C(1998) 3503]'
  type: main
- language: de
  script: Latn
  content: '98/661/EG: Entscheidung der Kommission vom 16. November 1998 zur Änderung
