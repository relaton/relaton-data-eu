    (Quercus L.) mit Rinde mit Ursprung in Kanada oder den Vereinigten Staaten von
    Amerika Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates
    vorzusehen (Bekanntgegeben unter Aktenzeichen K(1998) 3503)'
  type: main
- language: cs
  script: Latn
