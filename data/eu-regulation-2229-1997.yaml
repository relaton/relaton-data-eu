  script: Latn
  content: Council Regulation (EC) No 2229/97 of 30 October 1997 concerning the interruption
    of certain economic relations with Angola in order to induce the 'União Nacional
    para a Independência Total de Angola' (UNITA) to fulfil its obligations in the
    peace process
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2229/97 du Conseil du 30 octobre 1997 concernant l'interruption
    de certaines relations économiques avec l'Angola afin d'inciter la «União Nacional
    para a Independência Total de Angola» (UNITA), à remplir ses obligations dans
    le processus de paix
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) NR. 2229/97 des Rates vom 30. Oktober 1997 betreffend die
    Aussetzung bestimmter wirtschaftlicher Beziehungen zu Angola zwecks Veranlassung
    der UNITA zur Erfüllung ihrer Verpflichtungen im Rahmen des Friedensprozesses
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2229/97 af 30. oktober 1997 om afbrydelse af
    visse økonomiske forbindelser med Angola med henblik på at anspore »União
    Nacional para a Independência Total de Angola« (UNITA) til at indfri sine forpligtelser
    som led i fredsprocessen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2229/97 του Συμβουλίου
    της 30ής Οκτωβρίου 1997 σχετικά με τη διακοπή
    ορισμένων οικονομικών σχέσεων με την Αγκόλα,
    προκειμένου να παρακινηθεί η «UNIAO NACIONAL PARA A
    INDEPENDENCIA TOTAL DE ANGOLA» (UNITA) να εκπληρώσει τις υποχρεώσεις
    της κατά την ειρηνευτική διαδικασία
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2229/97, annettu 30 päivänä lokakuuta 1997,
    tiettyjen taloussuhteiden keskeyttämisestä Angolaan "União Nacional para a
    Independência Total de Angolan" (UNITA) taivuttamiseksi täyttämään velvollisuutensa
    rauhanprosessissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2229/97 del Consiglio del 30 ottobre 1997 relativo
    all'interruzione di alcune relazioni economiche con l'Angola per indurre la «União
    Nacional para a Independência Total de Angola» (UNITA) a rispettare gli obblighi
    assunti nell'ambito del processo di pace
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2229/97 van de Raad van 30 oktober 1997 inzake de
    onderbreking van bepaalde economische betrekkingen met Angola, teneinde de União
    Nacional para a Independência Total de Angola (Unita) ertoe te bewegen zich aan
    zijn verplichtingen krachtens het vredesproces te houden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2229/97 do Conselho de 30 de Outubro de 1997 relativo
    à interrupção de certas relações económicas com Angola tendo em vista induzir
    a União Nacional para a Independência Total de Angola (UNITA) a cumprir as obrigações
    que lhe incumbem no âmbito do processo de paz
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2229/97 del Consejo de 30 de octubre de 1997 relativo
