    di uso domestico o da toletta, di porcellana della voce doganale 69.11 della tariffa
    doganale comune originari dello Sri Lanka beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3417/86 van de Commissie van 7 november 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op vaatwerk, huishoudelijke
    artikelen en toiletartikelen, van porselein, van post 69.11 van het gemeenschappelijk
    douanetarief, van oorsprong uit Sri Lanka, waarvoor de in Verordening (EEG) nr.
    3599/85 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
