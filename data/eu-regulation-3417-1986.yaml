title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3417/86 of 7 November 1986 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic toilet purposes, of porcelain or china, falling within heading
    69.11, originating in Sri Lanka, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3417/86 de la Commission du 7 novembre 1986 portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine de la position 69.11 du
    tarif douanier commun, originaires du Sri Lanka, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3417/86 der Kommission vom 7. November 1986 zur Wiedereinführung
    der Erhebung der Zölle für Geschirr, Haushalts- und Toilettengegenstände, aus
    Porzellan, der Tarifnummer 69.11 des Gemeinsamen Zolltarifs mit Ursprung in Sri
    Lanka, dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3417/86 af 7. november 1986 om genindførelse
    af opkrævning af told for bordservice samt husholdnings- og toiletartikler, af
    porcelæn, henhørende under pos. 69.11 i den fælles toldtarif og med oprindelse
    i Sri Lanka, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3599/85
  type: main
- language: el
  script: Grek
