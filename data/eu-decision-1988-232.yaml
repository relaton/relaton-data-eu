title:
- language: en
  script: Latn
  content: '88/232/EEC: Commission Decision of 17 March 1988 authorizing the Kingdom
    of Spain to apply intra- Community surveillance to imports of motor vehicles for
    the transport of persons or goods, originating in Romania and placed in free circulation
    in the Community (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/232/CEE: Décision de la Commission du 17 mars 1988 autorisant le Royaume
    d''Espagne à procéder à une surveillance intracommunautaire des importations
    de véhicules automobiles pour le transport de personnes ou de marchandises originaires
    de Roumanie et mis en libre pratique dans la Communauté (Le texte en langue espagnole
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/232/EWG: Entscheidung der Kommission vom 17. März 1988 zur Ermächtigung
    des Königreichs Spanien zur Einführung einer innergemeinschaftlichen Überwachung
    bei Einfuhren von aus Rumänien stammenden und in der Gemeinschaft im Personen
    freien Verkehr befindlichen Kraftfahrzeugen zur Beförderung von Personen oder
    Waren (Nur der spanische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/232/EØF: Kommissionens beslutning af 17. marts 1988 om bemyndigelse
    af Kongeriget Spanien til at indføre tilsyn inden for Fællesskabet med indførslen
    af automobiler til person- eller godsbefordring, som har oprindelse i Rumænien
    og er overgået til fri omsætning i Fællesskabet (Kun den spanske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/232/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Μαρτίου 1988 που εξουσιοδοτεί την Ισπανία να
    υποβάλει σε ενδοκοινοτική επιτήρηση τις εισαγωγές
    αυτοκινήτων οχημάτων για τη μεταφορά επιβατών
    ή εμπορευμάτων, καταγωγής Ρουμανίας, τα οποία
    έχουν τεθεί σε ελεύθερη κυκλοφορία στην Κοινότητα
    (Το κείμενο στην ισπανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/232/CEE: Decisione della Commissione del 17 marzo 1988 che autorizza
    il Regno di Spagna ad instaurare una sorveglianza intracomunitaria sulle importazioni
    di autoveicoli per il trasporto di persone o di merci originari della Romania
    e immessi in libera pratica nella Comunità (Il testo in lingua spagnola è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/232/EEG: Beschikking van de Commissie van 17 maart 1988 houdende machtiging
    van het Koninkrijk Spanje om intracommunautair toezicht in te stellen op de invoer
    van automobielen voor het vervoer van personen of goederen, van oorsprong uit
    Roemenië en in de Gemeenschap in het vrije verkeer gebracht (Slechts de tekst
    in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/232/CEE: Decisão da Comissão de 17 de Março de 1988 que autoriza
    o Reino de Espanha a proceder a uma vigilância intracomunitária das importações
    de veículos automóveis para o transporte de pessoas ou de mercadorias originários
    da Roménia e introduzidos em livre-prática na Comunidade (Apenas faz fé o texto
    em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '88/232/CEE: Decisión de la Comisión de 17 de marzo de 1988 por la que
