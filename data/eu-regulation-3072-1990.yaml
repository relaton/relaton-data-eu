title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3072/90 of 22 October 1990 again amending articles
    6 and 17 of the Protocol concerning the concept of 'originating products' and
    methods of administrative Cooperation to the Cooperation Agreement between the
    European economic community and the Kingdom of morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3072/90 du Conseil, du 22 octobre 1990, modifiant
    une nouvelle fois les articles 6 et 17 du protocole relatif à la définition
    de la notion de "produits originaires" et aux méthodes de coopération administrative
    de l'accord de coopération entre la Communauté économique européenne et le
    Royaume du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3072/90 des Rates vom 22. Oktober 1990 zur erneuten
    Änderung der Artikel 6 und 17 des Protokolls über die Bestimmung des Begriffs
    "Erzeugnisse mit Ursprung in" oder "ursprungserzeugnisse" und über die Methoden
    der Zusammenarbeit der Verwaltungen zum kooperationsabkommen zwischen der europäischen
    Wirtschaftsgemeinschaft und dem Königreich Marokko
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3072/90 af 22. oktober 1990 om en ny ændring
    af artikel 6 og 17 i protokollen vedrørende definitionen af begrebet "varer med
    oprindelsesstatus" og vedrørende metoderne for administrativt samarbejde til
    samarbejdsaftalen mellem det europæiske økonomiske fællesskab og kongeriget
    Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3072/90 του Συμβουλίου
    της 22ας Οκτωβρίου 1990 περί νέας τροποποίησης
    των άρθρων 6 και 17 του πρωτοκόλλου σχετικά με
    τον ορισμό της έννοιας «καταγόμενα προϊόντα»
    ή «προϊόντα καταγωγής» και με τις μεθόδους
    διοικητικής συνεργασίας της συμφωνίας συνεργασίας
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και του Βασιλείου του Μαρόκου
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3072/90, annettu 22 päivänä lokakuuta 1990,
    Euroopan talousyhteisön ja Marokon kuningaskunnan yhteistyösopimuksen käsitteen
    alkuperätuotteet määritelmää ja hallinnollisen yhteistyön menetelmiä koskevan
    pöytäkirjan 6 ja 17 artiklan muuttamisesta uudelleen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3072/90 del Consiglio, del 22 ottobre 1990, che modifica
    di nuovo gli articoli 6 e 17 del protocollo relativo alla definizione della nozione
    di " prodotti originari " ed ai metodi di cooperazione amministrativa dell'accordo
    di cooperazione tra la Comunità economica europea e il regno del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3072/90 van de raad van 22 oktober 1990 tot hernieuwde
    wijziging van de artikelen 6 en 17 van het protocol betreffende de definitie van
    het begrip "produkten van oorsprong" en de methoden van administratieve samenwerking
    bij de samenwerkingsovereenkomst tussen de Europese economische gemeenschap en
    het koninkrijk Marokko
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3072/90 do conselho, de 22 de outubro de 1990, que
    altera novamente os artigos 6 e 17 do protocolo relativo a definição da noção
    de "produtos originários" e aos métodos de cooperação administrativa ao acordo
    de cooperação entre a comunidade económica europeia e o reino de Marrocos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3072/90 del consejo, de 22 de octubre de 1990, por
    el que se modifican de nuevo los artículos 6 y 17 del protocolo relativo a la
    definición de "productos originarios" y a los métodos de cooperación administrativa
    del acuerdo de cooperación entre la comunidad económica europea y el reino de
    Marruecos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3072/90 av den 22 oktober 1990 om ytterligare
    ändring av artiklarna 6 och 17 i protokollet om begreppet "ursprungsvaror" och
    metoderna för administrativt samarbete i samarbetsavtalet mellan Europeiska ekonomiska
    gemenskapen och Marocko
