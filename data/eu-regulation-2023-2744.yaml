  script: Latn
  content: Commission Implementing Regulation (EU) 2023/2744 of 20 November 2023 amending
    Implementing Regulation (EU) 2020/2235 as regards model animal health certificates,
    model official certificates, model animal health/official certificates and private
    attestation, for the entry into the Union or transit through the Union of consignments
    of certain categories of animals and goods, and official certification regarding
    such certificates
  type: main
- language: fr
