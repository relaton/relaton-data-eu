    leverantörer av nätverk för leverans av innehåll, leverantörer av utlokaliserade
    driftstjänster, leverantörer av utlokaliserade säkerhetstjänster, leverantörer
    av marknadsplatser online, leverantörer av sökmotorer, leverantörer av plattformar
    för sociala nätverkstjänster och tillhandahållare av betrodda tjänster
