  content: Regulation (EEC) No 2543/74 of the Commission of 4 October 1974 opening
    an invitation to tender for the mobilization of long grain milled rice as food
    aid for the United Nations Relief and Works Agency for Palestine (UNRWA)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2543/74 de la Commission, du 4 octobre 1974, relatif
    à l'ouverture d'une adjudication pour la mobilisation de riz blanchi à grains
    longs destinés à l'Office de secours et de travaux des Nations Unies pour les
    réfugiés de Palestine, ci-après dénommé l'UNRWA, à titre d'aide
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2543/74 der Kommission vom 4. Oktober 1974 über die
    Durchführung einer Ausschreibung zur Bereitstellung von geschliffenem Langkornreis
    als Hilfeleistung für das Hilfswerk der Vereinten Nationen für die palästinensischen
    Flüchtlinge im Nahen Osten, nachstehend UNRWA genannt
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2543/74 af 4. oktober 1974 om åbning
    af en licitation med henblik på mobilisering af langkornet sleben ris som støtte,
    bestemt til De forenede Nationers hjælpeorganisation for palæstinensiske flygtninge,
    herefter benævnt UNRWA
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2543/74 della Commissione, del 4 ottobre 1974, relativo
    ad una gara per la mobilitazione di riso lavorato a grani lunghi destinato all'Ufficio
    dei soccorsi delle Nazioni Unite per i rifugiati di Palestina, in seguito denominato
    UNRWA, a titolo di aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2543/74 van de Commissie van 4 oktober 1974 betreffende
    de openstelling van een inschrijving voor het beschikbaar stellen van volwitte
    langkorrelige rijst als voedselhulp aan het bureau voor bijstand en uitvoering
    van werken van de Verenigde Naties ten behoeve van de Palestijnse vluchtelingen,
    hierna genoemd UNRWA
