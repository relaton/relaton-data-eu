title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1639/74 of the Commission of 27 June 1974 re-establishing
    the levying of the customs duties on reconstituted wood, etc., falling within
    heading No 44.18, originating in Yugoslavia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December 1973
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1639/74 de la Commission, du 27 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux bois dits
    "artificiels" ou "reconstitués", etc., de la position tarifaire 44.18, originaires
    de Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1639/74 der Kommission vom 27. Juni 1974 zur Wiedereinführung
    des Zollsatzes für sogenanntes Kunstholz usw., der Tarifnummer 44.18, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates vom 18.
    Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1639/74 af 27. juni 1974 om genindførelse
    af opkrævning af toldafgifter for kunstigt træ, etc., under position 44.18,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1639/74 della Commissione, del 27 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili al legno detto «artificiale»
    o «ricostituito», ecc., della voce doganale n. 44.18 originario della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1639/74 van de Commissie van 27 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op kunsthout
    verkregen door houtkrullen, enz., van post 44.18, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
