title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/566 of 14 February 2024 amending
    Annex VIII to Implementing Regulation (EU) 2021/620 as regards the approval or
    withdrawal of the disease-free status of certain zones of Germany and Spain as
    regards infection with bluetongue virus (serotypes 1-24) and the approval of the
    extension of an eradication programme for infection with that virus
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/566 de la Commission du 14 février
    2024 modifiant l’annexe VIII du règlement d’exécution (UE) 2021/620 en ce
    qui concerne l’approbation ou le retrait du statut indemne de maladie pour certaines
    zones d’Allemagne et d’Espagne au regard de l’infection par le virus de
    la fièvre catarrhale ovine (sérotypes 1-24) et l’approbation de l’extension
    d’un programme d’éradication de l’infection par ce virus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/566 der Kommission vom 14. Februar 2024
    zur Änderung von Anhang VIII der Durchführungsverordnung (EU) 2021/620 hinsichtlich
    der Genehmigung oder Aberkennung des Status seuchenfrei für bestimmte Zonen Deutschlands
    und Spaniens in Bezug auf Infektionen mit dem Virus der Blauzungenkrankheit (Serotypen
    1-24) sowie der Genehmigung der Erweiterung eines Tilgungsprogramms für Infektionen
    mit dem genannten Virus
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/566 на Комисията
    от 14 февруари 2024 година за изменение на приложение
    VIII към Регламент за изпълнение (ЕС) 2021/620 във
    връзка с одобряването или отнемането на статута
    свободна от болест на някои зони от Германия
    и Испания по отношение на инфекция с вируса
    на болестта син език (серотипове 1—24) и във
    връзка с одобряването на удължаването на срока
    на програма за ликвидиране на инфекция с този
    вирус
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/566 ze dne 14. února 2024, kterým
    se mění příloha VIII prováděcího nařízení (EU) 2021/620, pokud jde o
    schválení nebo odnětí statusu území prostého nákazy některých oblastí
    Německa a Španělska, pokud jde o infekci virem katarální horečky ovcí (sérotypy
    1–24), a schválení rozšíření eradikačního programu pro infekci tímto
    virem
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/566 af 14. februar 2024
    om ændring af bilag VIII til gennemførelsesforordning (EU) 2021/620 for så
    vidt angår godkendelse eller tilbagekaldelse af status som sygdomsfri for visse
    zoner i Tyskland og Spanien for så vidt angår infektion med bluetonguevirus
    (serotype 1-24) og godkendelse af udvidelsen af et program for udryddelse af infektion
    med nævnte virus
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/566 της Επιτροπής,
    της 14ης Φεβρουαρίου 2024, για την τροποποίηση
    του παραρτήματος VIII του εκτελεστικού κανονισμού
    (ΕΕ) 2021/620 όσον αφορά την έγκριση ή την ανάκληση
    του καθεστώτος απαλλαγμένου από νόσο για ορισμένες
    ζώνες της Γερμανίας και της Ισπανίας σχετικά
    με τη λοίμωξη από τον ιό του καταρροϊκού πυρετού
    (ορότυποι 1-24) και την έγκριση της επέκτασης
    προγράμματος εκρίζωσης για τη λοίμωξη από
    τον εν λόγω ιό
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/566, 14. veebruar 2024, millega muudetakse
    rakendusmääruse (EL) 2021/620 VIII lisa seoses Saksamaa ja Hispaania teatavate
    tsoonide taudivaba staatuse heakskiitmise või tühistamisega lammaste katarraalse
    palaviku viiruse (serotüübid 1–24) põhjustatud nakkuse suhtes ning kõnealuse
    viiruse põhjustatud nakkuse likvideerimise programmi pikendamise heakskiitmisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/566, annettu 14 päivänä
    helmikuuta 2024, täytäntöönpanoasetuksen (EU) 2021/620 liitteen VIII muuttamisesta
    siltä osin kuin on kyse Saksan ja Espanjan tiettyjen vyöhykkeiden taudista vapaan
    aseman hyväksymisestä tai hyväksynnän peruuttamisesta sinikieliviruksen (serotyypit
    1–24) aiheuttaman tartunnan osalta sekä kyseisen viruksen aiheuttaman tartunnan
    hävittämisohjelman laajentamisen hyväksymisestä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/566 ón gCoimisiún an 14 Feabhra
    2024 lena leasaítear Iarscríbhinn VIII a ghabhann le Rialachán Cur Chun Feidhme
    (AE) 2021/620 a mhéid a bhaineann le formheas nó aistarraingt an stádais saor
    ó ghalair atá ag criosanna áirithe den Ghearmáin agus den Spáinn a mhéid
    a bhaineann le hionfhabhtú leis an víreas gormtheanga (séiritíopaí 1-24)
    agus formheas an fhadaithe ar chlár díothaithe maidir le hionfhabhtú leis an
    víreas sin
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/566 оd 14. veljače 2024. o izmjeni
    Priloga VIII. Provedbenoj uredbi (EU) 2021/620 u pogledu odobravanja ili povlačenja
    statusa slobodno od bolesti za određene zone Njemačke i Španjolske u pogledu
    infekcije virusom bolesti plavog jezika (serotipovi 1 – 24) i odobrenja produljenja
    programa iskorjenjivanja infekcije tim virusom
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/566 végrehajtási rendelete (2024. február 14.)
    az (EU) 2021/620 végrehajtási rendelet VIII. mellékletének Németország és
    Spanyolország egyes körzetei betegségtől mentes státuszának a kéknyelv-betegség
    vírusával (1–24-es szerotípus) való fertőzöttség tekintetében történő
    jóváhagyása vagy visszavonása, valamint az e vírussal való fertőzöttségre
    vonatkozó mentesítési program kiterjesztésének jóváhagyása tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/566 della Commissione, del 14 febbraio
    2024, che modifica l’allegato VIII del regolamento di esecuzione (UE) 2021/620
    per quanto riguarda l’approvazione o il ritiro dello status di indenne da malattia
    di alcune zone della Germania e della Spagna in relazione all’infezione da virus
    della febbre catarrale degli ovini (sierotipi 1-24) e l’approvazione dell’estensione
    di un programma di eradicazione dell’infezione da tale virus
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/566 (2024. gada 14. februāris),
    ar ko attiecībā uz statusa brīvs no slimības apstiprināšanu vai atsaukšanu
    noteiktām Vācijas un Spānijas zonām attiecībā uz infekciozā katarālā
    drudža vīrusa (1.–24. serotipa) infekciju, kā arī minētā vīrusa infekcijas
    izskaušanas programmas paplašināšanas apstiprināšanu groza Īstenošanas
    regulas (ES) 2021/620 VIII pielikumu
  type: main
- language: lt
  script: Latn
  content: 2024 m. vasario 14 d. Komisijos įgyvendinimo reglamentas (ES) 2024/566,
    kuriuo dėl tam tikrų Vokietijos ir Ispanijos zonų mėlynojo liežuvio viruso
    (1–24 serotipų) infekcija neužkrėstos teritorijos statuso patvirtinimo arba
    panaikinimo ir dėl to viruso infekcijos likvidavimo programos pratęsimo patvirtinimo
    iš dalies keičiamas Įgyvendinimo reglamento (ES) 2021/620 VIII priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/566 tal-14
    ta’ Frar 2024 li jemenda l-Anness VIII tar-Regolament ta’ Implimentazzjoni
    (UE) 2021/620 fir-rigward tal-approvazzjoni jew l-irtirar tal-istatus ta’ ħelsien
    mill-mard ta’ ċerti żoni tal-Ġermanja u ta’ Spanja fir-rigward tal-infezzjoni
    bil-virus tal-ilsien blu (is-serotipi 1–24) u l-approvazzjoni tal-estensjoni
    ta’ programm ta’ eradikazzjoni għall-infezzjoni b’dak il-virus
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/566 van de Commissie van 14 februari 2024
    tot wijziging van bijlage VIII bij Uitvoeringsverordening (EU) 2021/620 wat betreft
    de goedkeuring of intrekking van de ziektevrije status van bepaalde zones van
    Duitsland en Spanje ten aanzien van infectie met het bluetonguevirus (serotypen
    1-24) en de goedkeuring van de verlenging van een uitroeiingsprogramma voor infectie
    met dat virus
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/566 z dnia 14 lutego 2024
    r. zmieniające załącznik VIII do rozporządzenia wykonawczego (UE) 2021/620
    w odniesieniu do zatwierdzenia lub cofnięcia statusu obszaru wolnego od choroby
    dla niektórych stref Niemiec i Hiszpanii w związku z zakażeniem wirusem choroby
    niebieskiego języka (serotypy 1–24) oraz zatwierdzenia przedłużenia programu
    likwidacji zakażenia tym wirusem
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/566 da Comissão, de 14 de fevereiro
    de 2024, que altera o anexo VIII do Regulamento de Execução (UE) 2021/620 no
    que se refere à aprovação ou à retirada do estatuto de indemnidade de doença
    de determinadas zonas da Alemanha e da Espanha no que diz respeito à infeção
    pelo vírus da febre catarral ovina (serótipos 1-24) e à aprovação da prorrogação
    de um programa de erradicação para a infeção por esse vírus
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/566 al Comisiei din 14 februarie
    2024 de modificare a anexei VIII la Regulamentul de punere în aplicare (UE) 2021/620
    în ceea ce privește aprobarea sau retragerea statutului de indemn de boală
    al anumitor zone din Germania și Spania referitor la infecția cu virusul bolii
    limbii albastre (serotipurile 1-24) și aprobarea extinderii unui program de eradicare
    pentru infecția cu virusul respectiv
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/566 zo 14. februára 2024, ktorým
    sa mení príloha VIII k vykonávaciemu nariadeniu (EÚ) 2021/620, pokiaľ ide
    o schválenie alebo zrušenie štatútu bez výskytu choroby určitých pásiem
    Nemecka a Španielska v súvislosti s infekciou vírusom katarálnej horúčky
    oviec (sérotypy 1 – 24) a schválenie predĺženia eradikačného programu
    pre infekciu uvedeným vírusom
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/566 z dne 14. februarja 2024 o spremembi
    Priloge VIII k Izvedbeni uredbi (EU) 2021/620 glede odobritve ali odvzema statusa
    nekaterih območij Nemčije in Španije kot prostih bolezni v zvezi z okužbo
    z virusom modrikastega jezika (serotipi 1-24) in odobritve razširitve programa
    izkoreninjenja okužbe s tem virusom
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/566 de la Comisión, de 14 de febrero
    de 2024, por el que se modifica el anexo VIII del Reglamento de Ejecución (UE)
    2021/620 en lo referente a la aprobación o retirada del estatus de libre de enfermedad
    de determinadas zonas de Alemania y España en lo que respecta a la infección
    por el virus de la lengua azul (serotipos 1 a 24) y a la aprobación de la ampliación
    de un programa de erradicación de la infección por dicho virus
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/566 av den 14 februari
    2024 om ändring av bilaga VIII till genomförandeförordning (EU) 2021/620 vad
    gäller godkännande eller återkallande av sjukdomsfri status för vissa zoner
    i Tyskland och Spanien med avseende på infektion med blåtungevirus (serotyperna
    1–24) och godkännande av förlängning av ett program för utrotning av infektion
    med detta virus
  type: main
