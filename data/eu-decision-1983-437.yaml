  script: Latn
  content: '83/437/EEC: Commission Decision of 10 August 1983 establishing that the
    apparatus described as ''Hitachi - Transmission Electron Microscope, model H700H,
    with scanning attachment and X-ray energy dispersive detector'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/437/CEE: Décision de la Commission du 10 août 1983 constatant que
