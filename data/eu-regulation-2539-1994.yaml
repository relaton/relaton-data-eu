    Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2539/94 della Commissione, del 19 ottobre 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1994 per le carni bovine fresche, refrigerate o
    congelate nel quadro dei regimi di importazione previsti dagli accordi europei
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria e dall'accordo
    interinale con l'ex Repubblica federativa ceca e slovacca (RFCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2539/94 van de Commissie van 19 oktober 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers, gekoeld of bevroren rundvlees, die in oktober 1994 zijn ingediend op
    grond van de invoerregelingen die zijn vastgesteld in de door de Gemeenschap met
    de Republiek Polen en de Republiek Hongarije gesloten Europa-Overeenkomsten en
    de met de vroegere Tsjechische en Slowaakse Federatieve Republiek (TSFR) gesloten
    Interimovereenkomst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2539/94 da Comissão, de 19 de Outubro de 1994, que
