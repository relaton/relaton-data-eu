    vabastamise kohta kohustusest kohaldada teatavate liikide suhtes nõukogu direktiive
    66/401/EMÜ, 66/402/EMÜ, 68/193/EMÜ, 1999/105/EÜ ja 2002/57/EÜ, mis käsitlevad
    vastavalt söödakultuuride seemne, teraviljaseemne, viinamarjade vegetatiivse
    paljundusmaterjali, metsapaljundusmaterjali ning õli- ja kiudtaimede seemne turustamist
    (teatavaks tehtud numbri K(2005) 525 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 8 päivänä maaliskuuta 2005, Tšekin, Viron,
    Kyproksen, Latvian, Liettuan, Maltan ja Puolan vapauttamisesta velvollisuudesta
    soveltaa tiettyjen lajien osalta rehukasvien ja viljakasvien siementen, viiniköynnöksen
    kasvullisen lisäysaineiston ja metsänviljelyaineiston sekä öljy- ja kuitukasvien
    siementen pitämisestä kaupan annettuja neuvoston direktiivejä 66/401/ETY, 66/402/ETY,
    68/193/ETY, 1999/105/EY ja 2002/57/EY [tiedoksiannettu numerolla K(2005) 525]
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2005. március 8.) a Cseh Köztársaságnak,
    az Észt Köztársaságnak, a Ciprusi Köztársaságnak, a Lett Köztársaságnak,
    a Litván Köztársaságnak, a Máltai Köztársaságnak és a Lengyel Köztársaságnak
    a takarmánynövény-vetőmagok, a gabonavetőmagok, a vegetatív szőlő-szaporítóanyagok,
    az erdészeti szaporítóanyagok, illetőleg az olaj- és rostnövények vetőmagjának
    forgalmazásáról szóló 66/401/EGK, 66/402/EGK, 68/193/EGK, 1999/105/EK és
    2002/57/EK tanácsi irányelv szerinti kötelezettségek alól egyes fajok tekintetében
    történő mentesítéséről (az értesítés a C(2005) 525. számú dokumentummal
    történt)
  type: main
