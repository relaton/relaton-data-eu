    veislėms atitinkamai taikyti Tarybos direktyvas 66/401/EEB, 66/402/EEB, 68/193/EEB,
    1999/105/EB ir 2002/57/EB dėl prekybos pašarinių augalų sėkla, javų sėkla,
    vynmedžių dauginimo medžiaga, miško dauginamąja medžiaga ir aliejinių ir
