title:
- language: en
  script: Latn
  content: Commission Decision of 8 March 2005 releasing the Czech Republic, Estonia,
    Cyprus, Latvia, Lithuania, Malta and Poland from the obligation to apply to certain
    species Council Directives 66/401/EEC, 66/402/EEC, 68/193/EEC, 1999/105/EC and
    2002/57/EC on the marketing of fodder plant seed, cereal seed, material for the
    vegetative propagation of the vine, forest reproductive material and seed of oil
    and fibre plants respectively (notified under document number C(2005) 525)
  type: main
- language: fr
  script: Latn
  content: Décision de la commission du 8 mars 2005 dispensant la République tchèque,
    l'Estonie, Chypre, la Lettonie, la Lituanie, Malte et la Pologne de l'obligation
    d'appliquer à certaines espèces les directives 66/401/CEE, 66/402/CEE, 68/193/CEE,
    1999/105/CE et 2002/57/CE du Conseil relatives à la commercialisation, respectivement,
    des semences de plantes fourragères, des semences de céréales, des matériels
    de multiplication végétative de la vigne, des matériels forestiers de reproduction
    et des semences de plantes oléagineuses et à fibres [notifiée sous le numéro
    C(2005) 525]
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. März 2005 zur Befreiung der Tschechischen
    Republik, Estlands, Zyperns, Lettlands, Litauens, Maltas und Polens von der Verpflichtung,
    auf bestimmte Arten die Richtlinien 66/401/EWG, 66/402/EWG, 68/193/EWG, 1999/105/EG
    und 2002/57/EG des Rates über den Verkehr mit Futterpflanzensaatgut, Getreidesaatgut,
    vegetativem Vermehrungsgut von Reben, forstlichem Vermehrungsgut bzw. Saatgut
    von Öl- und Faserpflanzen anzuwenden (Bekannt gegeben unter Aktenzeichen K(2005)
    525)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 8. března 2005, kterým se Česká republika,
    Estonská republika, Kyperská republika, Lotyšská republika, Litevská republika,
    Republika Malta a Polská republika osvobozují od povinnosti uplatňovat na některé
    druhy směrnice Rady 66/401/EHS, 66/402/EHS, 68/193/EHS, 1999/105/ES a 2002/57/ES
    týkající se uvádění osiva pícnin, osiva obilovin, révového vegetativního
    množitelského materiálu, reprodukčního materiálu lesních dřevin, osiva
    olejnin a přadných rostlin na trh (oznámeno pod číslem K(2005) 525)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 8. marts 2005 om fritagelse af Tjekkiet, Estland,
    Cypern, Letland, Litauen, Malta og Polen for forpligtelsen til for visse arters
    vedkommende at anvende Rådets direktiv 66/401/EØF, 66/402/EØF, 68/193/EØF,
    1999/105/EF og 2002/57/EF om henholdsvis handel med frø af foderplanter, handel
    med sædekorn, handel med vegetativt formeringsmateriale af vin, markedsføring
    af forstligt formeringsmateriale og handel med frø af olie- og spindplanter (meddelt
    under nummer K(2005) 525)
  type: main
