    της 20ής Δεκεμβρίου 1992 για τον καθορισμό ορισμένων
    μέτρων διατηρήσεως και διαχειρίσεως των αλιευτικών
    πόρων της ζώνης διακανονισμού όπως ορίζεται
    στη σύμβαση για τη μελλοντική πολυμερή συνεργασία
    στην αλιεία του Βορειοδυτικού Ατλαντικού
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3927/92 del Consiglio, del 20 dicembre 1992, che stabilisce
    alcune misure di conservazione e di gestione delle risorse alieutiche della zona
    di regolamentazione definita dalla convenzione sulla futura cooperazione multilaterale
    per la pesca nell' Atlantico nordoccidentale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3927/92 van de Raad van 20 december 1992 tot vaststelling
