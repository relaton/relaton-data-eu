  script: Latn
  content: Council Regulation (EEC) No 3927/92 of 20 December 1992 laying down certain
    conservation and management measures for fishery resources in the Regulatory Area
    as defined in the Convention on Future Multilateral Cooperation in the North West
    Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3927/92 du Conseil, du 20 décembre 1992, fixant certaines
    mesures de conservation et de gestion des ressources halieutiques de la zone de
    réglementation définie dans la convention sur la future coopération multilatérale
    dans les pêches de l' Atlantique du Nord-Ouest
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3927/92 des Rates vom 20. Dezember 1992 über Maßnahmen
