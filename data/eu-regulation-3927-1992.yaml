    über die künftige multilaterale Zusammenarbeit auf dem Gebiet der Fischerei
    im Nordwestatlantik
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3927/92 af 20. december 1992 om fastsættelse
    af foranstaltninger til bevarelse og forvaltning af fiskeressourcerne i det regulerede
    område, der er defineret i konventionen om det fremtidige multilaterale samarbejde
    vedrørende fiskeriet i det nordvestlige Atlanterhav
  type: main
- language: el
  script: Grek
