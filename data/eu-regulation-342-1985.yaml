title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 342/85 of 7 February 1985 re-establishing
    the levying of customs duties on certain woven, knitted or crocheted carpets and
    on certain floor coverings of felt, products of category 59 (code 40.0590) originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 342/85 de la Commission du 7 février 1985 portant
    rétablissement de la perception des droits de douane applicables à certains
    tapis, tissés ou en bonneterie, aussi bien qu' à certains revêtements de sol
    en feutre, de la catégorie 59 (code 40.0590), originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 342/85 der Kommission vom 7. Februar 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte gewebte oder gewirkte Teppiche
    und für bestimmte Bodenbeläge aus Filz der Warenkategorie Nr. 59 (Kennziffer
    40.0590) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3563/84 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 342/85 af 7. februar 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte gulvtæpper, vævede eller af trikotage,
    for bestemte gulvbelægning af filt under varekategori nr. 59 (kode 40.0590),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 342/85 της Επιτροπής
    της 7ης Φεβρουαρίου 1985 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένους
    τάπητες, υφασμένους ή πλεκτούς, καθώς επίσης
    και για ορισμένα είδη επιστρώσεως δαπέδου,
    εκ πιλήματος, της κατηγορίας προϊόντων αριθ.
    59 (κωδικός 40.0590), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3563/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 342/85 della Commissione del 7 febbraio 1985 che ripristina
    la riscossione dei dazi doganali applicabili a taluni tappeti, tessuti o a maglia
    ed a taluni rivestimenti in feltro per pavimenti, della categoria di prodotti
    59 (codice 40.0590) originari della Cina beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 342/85 van de Commissie van 7 februari 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    tapijten, geweven of van brei- of haakwerk, alsook op vloerbedekking van vilt
    van de categorie van produkten nr. 59 (codenummer 40.0590) van oorsprong uit China,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3563/84 van de Raad
  type: main
