title:
- language: en
  script: Latn
  content: '82/577/EEC: Commission Decision of 29 July 1982 authorizing the French
    Republic to apply intra-Community surveillance to imports of men''s and boys''shirts,
    originating in Turkey, which have been put into free circulation in the Community
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/577/CEE: Décision de la Commission, du 29 juillet 1982, autorisant
    la République française à instaurer une surveillance intracommunautaire à
    l''égard des importations de chemises et chemisettes pour hommes et garçonnets,
    originaires de Turquie et mises en libre pratique dans la Communautés (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/577/EWG: Entscheidung der Kommission vom 29. Juli 1982 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Türkei stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Oberhemden, auch Sport- und Arbeitshemden für Männer und
    KnabenT (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/577/EØF: Kommissionens beslutning af 29. juli 1982 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af skjorter til mænd og drenge med oprindelse i Tyrkiet og overgået til fri
    omsætning i en anden medlemsstatd (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/577/EOK: Απόφαση τής Επιτροπής τής 29ης Ιουλίου
    1982 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επίβλεψης
    τών εισαγωγών υποκαμίσων καί υποκαμισακίων
    ανδρών καί παίδων καταγωγής Τουρκίας πού έχουν
    τεθεί σέ ελεύθερη κυκλοφορία στήν Κοινότητα
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/577/CEE: Decisione della Commissione, del 29 luglio 1982, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria sulle importazioni
    di camicie e camicette per uomo e per ragazzo originarie della Turchia e immesse
    in libera pratica nella Comunità (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '82/577/EEG: Beschikking van de Commissie van 29 juli 1982 houdende machtiging
    van de Franse Republiek tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van overhemden en sporthemden, van oorsprong uit Turkije,
    die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de tekst in
    de Franse taal is authentiek)'
