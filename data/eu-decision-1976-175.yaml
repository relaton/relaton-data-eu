id: EUDecision1976175
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 October 1975 authorizing the Italian Republic
    not to apply Community treatment to cathode-ray tubes for 20-inch colour television
    sets falling within subheading 85.21 A ex III of the Common Customs Tariff, originating
    in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/175/CEE: Décision de la Commission, du 28 octobre 1975, autorisant
    la République italienne à exclure du traitement communautaire les tubes cathodiques
    pour récepteurs de télévision en couleur de 20" de la position 85.21 A Ex III
    du Tarif douanier commun, originaires du Japon et mis en libre pratique dans les
    autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Oktober 1975, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Kathodenstrahlröhren für Farbfernsehempfänger
    (20") der Tarifstelle 85.21 A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. oktober 1975 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage katodestrålerør (billedrør)
    til farvefjernsynsmodtagere (20"), som henhører under position 85.21 A ex III
    i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 ottobre 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tubi catodici per televisori
    a colore di 20" della sottovoce 85.21 A ex III della tariffa doganale comune,
    originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 oktober 1975 waarbij de Italiaanse
    Republiek wordt gemachtigd kathodestraalbuizen voor ontvangtoestellen voor kleurentelevisie
    (20"), van post 85.21 A ex III van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
