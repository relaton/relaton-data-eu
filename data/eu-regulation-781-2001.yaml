    den Wiederverkauf auf dem Binnenmarkt von Reis aus Beständen der französischen
    Interventionsstelle auf 20000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 781/2001 af 20. april 2001 om ændring
    af forordning (EF) nr. 572/2001 for så vidt angår forhøjelse af licitationsmængden
    til 20000 tons ris, som det franske interventionsorgan ligger inde med, med henblik
    på salg på det indre marked
  type: main
- language: el
  script: Grek
