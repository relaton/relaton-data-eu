  script: Latn
  content: Komission asetus (EY) N:o 781/2001, annettu 20 päivänä huhtikuuta 2001,
    asetuksen (EY) N:o 572/2001 muuttamisesta ja Ranskan interventioelimen hallussa
    olevan pysyvässä tarjouskilpailussa sisämarkkinoilla jälleenmyytäväksi tarkoitetun
    riisimäärän korottamisesta 20000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 781/2001 della Commissione, del 20 aprile 2001, che
