title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 781/2001 of 20 April 2001 amending Regulation
    (EC) No 572/2001 and increasing to 20000 tonnes the standing invitation to tender
    for the resale on the internal market of rice held by the French intervention
    agency
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 781/2001 de la Commission du 20 avril 2001 modifiant
