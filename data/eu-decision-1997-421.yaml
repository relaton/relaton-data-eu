title:
- language: en
  script: Latn
  content: '97/421/EC: Commission Decision of 24 June 1997 amending Decisions 96/23/EC,
    96/98/EC, 96/99/EC, 96/102/EC and 97/32/EC concerning the presentation of supporting
    and financial documents linked to Community financial contributions for certain
    animal and public health measures (Only the Danish, French, English and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/421/CE: Décision de la Commission du 24 juin 1997 modifiant les décisions
    96/23/CE, 96/98/CE, 96/99/CE, 96/102/CE et 97/32/CE en ce qui concerne la présentation
    des pièces justificatives et des documents financiers relatifs à la participation
    financière de la Communauté à certaines mesures en matière de santé animale
    et de santé publique (Les textes en langues danoise, française, anglaise et
    néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/421/EG: Entscheidung der Kommission vom 24. Juni 1997 zur Änderung
    der Entscheidungen 96/23/EG, 96/98/EG, 96/99/EG, 96/102/EG und 97/32/EG in bezug
    auf die Vorlage der technischen und finanziellen Belege im Zusammenhang mit der
    finanziellen Beteiligung der Gemeinschaft an bestimmten Maßnahmen im Veterinärbereich
    (Nur der französische, der niederländische, der dänische und der englische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/421/EF: Kommissionens beslutning af 24. juni 1997 om ændring af beslutning
    96/23/EF, 96/98/EF, 96/99/EF, 96/102/EF og 97/32/EF for så vidt angår forelæggelsen
    af finansielle bilag i tilknytning til EF-tilskud til visse foranstaltninger vedrørende
    dyrs og menneskers sundhed (Kun de danske, franske, engelske og nederlandske udgaver
    er autentiske)'
  type: main
- language: el
  script: Grek
