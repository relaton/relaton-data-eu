    96/99/ΕΚ, 96/102/ΕΚ και 97/32/ΕΚ όσον αφορά την υποβολή
    συνοδευτικών και χρηματοοικονομικών εγγράφων
    που συνδέονται με τις κοινοτικές χρηματοδοτικές
    συνδρομές για ορισμένα ζωοϋγειονομικά μέτρα
