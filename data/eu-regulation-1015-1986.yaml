    dei prodotti lattiero-caseari, il livello degli importi compensativi adesione
    negli scambi con la Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1015/86 van de Commissie van 8 april 1986 houdende
