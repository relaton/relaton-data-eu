  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2016/861 ze dne 18. února
    2016, kterým se opravuje nařízení Komise v přenesené pravomoci (EU) č.
    528/2014, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU)
    č. 575/2013, pokud jde o regulační technické normy pro rizika opcí jiná
    než rizika delta v rámci standardizovaného přístupu k tržním rizikům,
    a kterým se opravuje nařízení Komise v přenesené pravomoci (EU) č. 604/2014,
    kterým se doplňuje směrnice Evropského parlamentu a Rady 2013/36/EU, pokud
    jde o regulační technické normy týkající se kvalitativních a vhodných
    kvantitativních kritérií k určení kategorií zaměstnanců, jejichž pracovní
    činnosti mají podstatný vliv na rizikový profil instituce
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2016/861 af 18. februar 2016 om
    berigtigelse af Kommissionens delegerede forordning (EU) nr. 528/2014 om supplerende
    regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013 for så
