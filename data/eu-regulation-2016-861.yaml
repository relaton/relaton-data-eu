  script: Grek
  content: Κατ' εξουσιοδότηση κανονισμός (ΕΕ) 2016/861
    της Επιτροπής, της 18ης Φεβρουαρίου 2016, σχετικά
    με τη διόρθωση του κατ' εξουσιοδότηση κανονισμού
