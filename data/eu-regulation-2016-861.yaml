title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2016/861 of 18 February 2016 correcting
    Commission Delegated Regulation (EU) No 528/2014 supplementing Regulation (EU)
    No 575/2013 of the European Parliament and of the Council with regard to regulatory
    technical standards for non-delta risk of options in the standardised market risk
    approach and correcting Commission Delegated Regulation (EU) No 604/2014 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards with respect to qualitative and appropriate
    quantitative criteria to identify categories of staff whose professional activities
    have a material impact on an institution's risk profile
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2016/861 de la Commission du 18 février 2016
    rectifiant le règlement délégué (UE) n° 528/2014 de la Commission complétant
    le règlement (UE) n° 575/2013 du Parlement européen et du Conseil en ce qui
    concerne les normes techniques de réglementation pour le risque non-delta lié
    aux options dans la méthode standard pour le risque de marché, et le règlement
    délégué (UE) n° 604/2014 de la Commission complétant la directive 2013/36/UE
    du Parlement européen et du Conseil par des normes techniques de réglementation
    en ce qui concerne les critères qualitatifs et quantitatifs appropriés permettant
    de recenser les catégories de personnel dont les activités professionnelles
    ont une incidence significative sur le profil de risque d'un établissement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2016/861 der Kommission vom 18. Februar 2016
    zur Berichtigung der Delegierten Verordnung (EU) Nr. 528/2014 der Kommission zur
    Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für Nicht-Delta-Risiken von Optionen
    gemäß dem standardisierten Marktrisiko-Ansatz und zur Berichtigung der Delegierten
    Verordnung (EU) Nr. 604/2014 der Kommission zur Ergänzung der Richtlinie 2013/36/EU
    des Europäischen Parlaments und des Rates im Hinblick auf technische Regulierungsstandards
    in Bezug auf qualitative und angemessene quantitative Kriterien zur Ermittlung
    der Mitarbeiterkategorien, deren berufliche Tätigkeit sich wesentlich auf das
    Risikoprofil eines Instituts auswirkt
  type: main
