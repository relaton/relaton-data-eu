  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2016/861, 18. veebruar 2016, millega
    parandatakse komisjoni delegeeritud määrust (EL) nr 528/2014, millega täiendatakse
    Euroopa Parlamendi ja nõukogu määrust (EL) nr 575/2013 seoses regulatiivsete
    tehniliste standarditega, milles käsitletakse optsioonide muid riske kui deltarisk
    tururiski standardmeetodi puhul, ning millega parandatakse komisjoni delegeeritud
    määrust (EL) nr 604/2014, millega täiendatakse Euroopa Parlamendi ja nõukogu
    direktiivi 2013/36/EL seoses regulatiivsete tehniliste standarditega kvalitatiivsete
    ja asjakohaste kvantitatiivsete kriteeriumide kohta, mille alusel määratakse
    kindlaks selliste töötajate kategooriad, kelle ametialane tegevus mõjutab oluliselt
    krediidiasutuse või investeerimisühingu riskiprofiili
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2016/861, annettu 18 päivänä helmikuuta
    2016, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 575/2013 täydentämisestä
    teknisillä sääntelystandardeilla, joita sovelletaan markkinariskiä koskevassa
    standardimenetelmässä optioihin liittyviin muihin riskeihin kuin deltaa koskeviin
    riskeihin, annetun delegoidun komission asetuksen (EU) N:o 528/2014 oikaisemisesta
    ja Euroopan parlamentin ja neuvoston direktiivin 2013/36/EU täydentämisestä
    teknisillä sääntelystandardeilla laadullisista ja asianmukaisista määrällisistä
    perusteista sellaisten henkilöstöryhmien yksilöimiseksi, joiden ammatillisella
    toiminnalla on merkittävä vaikutus laitoksen riskiprofiiliin, annetun komission
    delegoidun asetuksen (EU) N:o 604/2014 oikaisemisesta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/861 оd 18. veljače 2016. o ispravku
    Delegirane uredbe Komisije (EU) br. 528/2014 o dopuni Uredbe (EU) br. 575/2013
    Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih standarda za
    rizike osim delta-rizika za opcije u standardiziranom pristupu tržišnom riziku
    te o ispravku Delegirane uredbe Komisije (EU) br. 604/2014 o dopuni Direktive
    2013/36/EU Europskog parlamenta i Vijeća u vezi s regulatornim tehničkim standardima
    u odnosu na kvalitativne i odgovarajuće kvantitativne kriterije za utvrđivanje
    kategorija zaposlenika čije profesionalne aktivnosti imaju značajan utjecaj
    na profil rizičnosti institucije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/861 felhatalmazáson alapuló rendelete (2016. február
    18.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek az opciókkal
    kapcsolatos, piaci kockázati sztenderd módszer szerinti nem delta kockázatok
    kezelését meghatározó szabályozástechnikai standardok tekintetében történő
    kiegészítéséről szóló 528/2014/EU felhatalmazáson alapuló bizottsági
    rendelet helyesbítéséről, valamint a 2013/36/EU európai parlamenti és tanácsi
    irányelvnek a szakmai tevékenységükkel valamely intézmény kockázati profiljára
    jelentős hatást gyakorló munkavállalók kategorizálásának minőségi és
    megfelelő mennyiségi kritériumaira irányuló szabályozási technikai standardok
    tekintetében történő kiegészítéséről szóló 604/2014/EU felhatalmazáson
    alapuló bizottsági rendelet helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2016/861 della Commissione, del 18 febbraio 2016,
    recante rettifica del regolamento delegato (UE) n. 528/2014 della Commissione
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione per i rischi delle opzioni
    diversi dal rischio delta nel metodo standardizzato per il rischio di mercato
    e del regolamento delegato (UE) n. 604/2014 della Commissione che integra la direttiva
    2013/36/UE del Parlamento europeo e del Consiglio per quanto riguarda le norme
    tecniche di regolamentazione relative ai criteri qualitativi e quantitativi adeguati
    per identificare le categorie di personale le cui attività professionali hanno
    un impatto sostanziale sul profilo di rischio dell'ente
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2016/861 (2016. gada 18. februāris),
    ar kuru labo Komisijas Deleģēto regulu (ES) Nr. 528/2014, ar ko papildina Eiropas
    Parlamenta un Padomes Regulu (ES) Nr. 575/2013 attiecībā uz regulatīviem tehniskajiem
    standartiem par iespējas līgumu riskiem, kuri nav delta riski, saskaņā ar
    standartizēto tirgus riska pieeju, un Komisijas Deleģēto regulu (ES) Nr. 604/2014,
    ar ko papildina Eiropas Parlamenta un Padomes Direktīvu 2013/36/ES attiecībā
    uz regulatīvajiem tehniskajiem standartiem par kvalitātes un attiecīgiem kvantitātes
    kritērijiem, kas vajadzīgi, lai noteiktu to darbinieku kategorijas, kuru profesionālajai
    darbībai ir būtiska ietekme uz iestādes riska profilu
  type: main
- language: lt
  script: Latn
  content: 2016 m. vasario 18 d. Komisijos deleguotasis reglamentas (ES) 2016/861,
    kuriuo ištaisomas Komisijos deleguotasis reglamentas (ES) Nr. 528/2014, kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas nuostatomis
    dėl techninių reguliavimo standartų, taikomų pasirinkimo sandorių ne delta
    rizikai naudojant standartizuotą rinkos rizikos metodą, ir ištaisomas Komisijos
    deleguotasis reglamentas (ES) Nr. 604/2014, kuriuo papildomos Europos Parlamento
    ir Tarybos direktyvos 2013/36/ES nuostatos dėl techninių reguliavimo standartų,
    susijusių su kokybiniais ir atitinkamais kiekybiniais kriterijais, pagal kuriuos
    nustatomos darbuotojų, kurių profesinė veikla turi reikšmingą poveikį įstaigos
    rizikos pobūdžiui, kategorijos
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2016/861 tat-18 ta' Frar 2016 li
    jikkoreġi r-Regolament Delegat tal-Kummissjoni (UE) Nru 528/2014 li jissupplimenta
    r-Regolament (UE) Nru 575/2013 tal-Parlament Ewropew u tal-Kunsill fir-rigward
    tal-istandards tekniċi regolatorji tal-opzjonijiet fl-approċċ standardizzat
    tar-riskju tas-suq u li jikkoreġi r-Regolament Delegat tal-Kummissjoni (UE) Nru
    604/2014 li jissupplimenta d-Direttiva 2013/36/UE tal-Parlament Ewropew u tal-Kunsill
    f'dak li jikkonċerna l-istandards tekniċi regolatorji fir-rigward tal-kriterji
    kwalitattivi u kwantitattivi xierqa biex jiġu identifikati l-kategoriji ta' persunal
    li l-attivitajiet professjonali tiegħu jkollhom impatt materjali fuq il-profil
    tar-riskju tal-istituzzjoni
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2016/861 van de Commissie van 18 februari
    2016 tot correctie van Gedelegeerde Verordening (EU) nr. 528/2014 van de Commissie
    tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement en
    de Raad met betrekking tot technische reguleringsnormen voor niet-deltarisico
    van opties in het kader van de standaardbenadering voor marktrisico en tot correctie
    van Gedelegeerde Verordening (EU) nr. 604/2014 van de Commissie houdende aanvulling
    van Richtlijn 2013/36/EU van het Europees Parlement en de Raad met betrekking
    tot technische reguleringsnormen met betrekking tot kwalitatieve en passende kwantitatieve
    criteria tot vaststelling van de categorieën van medewerkers wier beroepswerkzaamheden
    het risicoprofiel van een instelling materieel beïnvloeden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Delegowane Komisji (UE) 2016/861 z dnia 18 lutego 2016
    r. w sprawie sprostowania rozporządzenia delegowanego Komisji (UE) nr 528/2014
    uzupełniającego rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 575/2013
    w odniesieniu do regulacyjnych standardów technicznych dotyczących ryzyka związanego
    z opcjami innego niż ryzyko delta w ramach standardowego podejścia do ryzyka
    rynkowego oraz w sprawie sprostowania rozporządzenia delegowanego Komisji (UE)
    nr 604/2014 uzupełniającego dyrektywę Parlamentu Europejskiego i Rady 2013/36/UE
    w odniesieniu do regulacyjnych standardów technicznych w odniesieniu do kryteriów
    jakościowych i właściwych kryteriów ilościowych ustalania kategorii pracowników,
    których działalność zawodowa ma istotny wpływ na profil ryzyka instytucji
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2016/861 da Comissão, de 18 de fevereiro de
    2016, que retifica o Regulamento Delegado (UE) n.° 528/2014 da Comissão que
    complementa o Regulamento (UE) n.° 575/2013 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação relativas ao risco
    não delta das opções no método padrão de tratamento do risco de mercado,
    bem como o Regulamento Delegado (UE) n.° 604/2014 da Comissão que complementa
    a Diretiva 2013/36/UE do Parlamento Europeu e do Conselho no que diz respeito
    às normas técnicas de regulamentação para efeitos dos critérios qualitativos
    e quantitativos adequados para identificar as categorias de pessoal cujas atividades
    profissionais têm um impacto significativo no perfil de risco da instituição
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2016/861 al Comisiei din 18 februarie 2016 de
    rectificare a Regulamentului delegat (UE) nr. 528/2014 al Comisiei de completare
    a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare pentru alte riscuri
    decât riscul delta ale opțiunilor în cadrul abordării standardizate a riscului
    de piață și de rectificare a Regulamentului delegat (UE) nr. 604/2014 al Comisiei
    de completare a Directivei 2013/36/UE a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare referitoare la criteriile
    calitative și cantitative corespunzătoare pentru identificarea categoriilor
    de personal ale căror activități profesionale au un impact semnificativ asupra
    profilului de risc al unei instituții
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2016/861 z 18. februára 2016, ktorým
    sa opravuje delegované nariadenie Komisie (EÚ) č. 528/2014, ktorým sa dopĺňa
    nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ ide o regulačné
    technické predpisy pre riziko iné než delta pri opciách v štandardizovanom
    prístupe k trhovému riziku, a ktorým sa opravuje delegované nariadenie Komisie
    (EÚ) č. 604/2014, ktorým sa dopĺňa smernica Európskeho parlamentu a Rady
    2013/36/EÚ, pokiaľ ide o regulačné technické predpisy so zreteľom na kvalitatívne
    a vhodné kvantitatívne kritériá na vymedzenie kategórií pracovníkov, ktorých
    profesionálne činnosti majú významný vplyv na rizikový profil inštitúcie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2016/861 z dne 18. februarja 2016 o popravku
    Delegirane uredbe Komisije (EU) št. 528/2014 o dopolnitvi Uredbe (EU) št. 575/2013
    Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi standardi za
    ne-delta tveganja, povezana z opcijami, pri standardiziranem pristopu za tržna
    tveganja in o popravku Delegirane uredbe Komisije (EU) št. 604/2014 o dopolnitvi
    Direktive 2013/36/EU Evropskega parlamenta in Sveta glede regulativnih tehničnih
    standardov v zvezi s kvalitativnimi in ustreznimi kvantitativnimi merili za opredelitev
    kategorij zaposlenih, katerih poklicne dejavnosti pomembno vplivajo na profil
    tveganosti institucij
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2016/861 de la Comisión, de 18 de febrero de
    2016, por el que se corrige el Reglamento Delegado (UE) n.° 528/2014 de la Comisión,
    por el que se completa el Reglamento (UE) n.° 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación para el
    riesgo distinto de delta de las opciones en el método estándar del riesgo de
    mercado y se corrige el Reglamento Delegado (UE) n.° 604/2014 de la Comisión
    por el que se complementa la Directiva 2013/36/UE del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación en relación
    con los criterios cualitativos y los criterios cuantitativos adecuados para determinar
    las categorías de personal cuyas actividades profesionales tienen una incidencia
    importante en el perfil de riesgo de una entidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2016/861 av den 18 februari 2016
    om rättelse av kommissionens delegerade förordning (EU) nr 528/2014 om komplettering
    av Europaparlamentets och rådets förordning (EU) nr 575/2013 vad gäller tekniska
    tillsynsstandarder för optioners icke-deltarisker i samband med standardmetoden
    för marknadsrisk och om rättelse av kommissionens delegerade förordning (EU)
    nr 604/2014 som kompletterar Europaparlamentets och rådets direktiv 2013/36/EU
    vad gäller tekniska standarder för tillsyn avseende kvalitativa och kvantitativa
    kriterier för att fastställa personalkategorier vars yrkesutövning har väsentlig
    inverkan på ett instituts riskprofil
  type: main
