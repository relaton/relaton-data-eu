title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1212 of 4 July 2017 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified maize DAS-40278-9, pursuant to Regulation (EC) No 1829/2003
    of the European parliament and of the Council on genetically modified food and
    feed (notified under document C(2017) 4503)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1212 de la Commission du 4 juillet 2017
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié DAS-40278-9, consistant en ce maïs ou produits à partir de celui-ci,
    en application du règlement (CE) n° 1829/2003 du Parlement européen et du Conseil
    sur les denrées alimentaires et les aliments pour animaux génétiquement modifiés
    [notifiée sous le numéro C(2017) 4503]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1212 der Kommission vom 4. Juli 2017
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte DAS-40278-9 enthalten, aus ihm bestehen oder aus ihm gewonnen werden,
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekannt gegeben unter Aktenzeichen C(2017) 4503)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1212 на Комисията
    от 4 юли 2017 година за разрешаване пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица DAS-40278-9, в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    относно генетично модифицираните храни и фуражи
    (нотифицирано под номер C(2017) 4503)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1212 ze dne 4. července 2017
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    DAS-40278-9, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 o geneticky modifikovaných potravinách
    a krmivech (oznámeno pod číslem C(2017) 4503)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/1212 af 4. juli 2017
