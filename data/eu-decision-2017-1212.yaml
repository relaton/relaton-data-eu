    er fremstillet af genetisk modificeret DAS-40278-9-majs, i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 om genetisk modificerede fødevarer og
    foderstoffer (meddelt under nummer C(2017) 4503)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1212 της Επιτροπής,
