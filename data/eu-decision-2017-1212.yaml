    a géntechnológiával módosított DAS-40278-9 kukoricát tartalmazó, abból
    álló vagy abból előállított termékek forgalomba hozatalának a géntechnológiával
    módosított élelmiszerekről és takarmányokról szóló 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2017) 4503. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1212 della Commissione, del 4 luglio
    2017, che autorizza l'immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato DAS-40278-9, a norma del regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio relativo agli alimenti
    e ai mangimi geneticamente modificati [notificata con il numero C(2017) 4503]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1212 (2017. gada 4. jūlijs),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 par
    ģenētiski modificētu pārtiku un barību atļauj laist tirgū produktus, kas
    satur ģenētiski modificētu kukurūzu DAS-40278-9, no tās sastāv vai no tās
    ir ražoti (izziņots ar dokumenta numuru C(2017) 4503)
  type: main
