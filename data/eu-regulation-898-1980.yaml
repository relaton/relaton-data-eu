type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 898/80 of 11 April 1980 re-establishing
    the levying of customs on goat and kidskin leather, except leather falling within
    heading No 41.06 or 41.08, other, other, falling within subheading 41.04 B II
    and originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 898/80 de la Commission, du 11 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux peaux de
    caprins, préparées, autres que celles des n°s 41.06 et 41.08, autres peaux,
    non dénommées, de la sous-position 41.04 B II du tarif douanier commun, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 898/80 der Kommission vom 11. April 1980 zur Wiedereinführung
    des Zollsatzes für Ziegen- und Zickelleder, ausgenommen Leder der Tarifnummern
    41.06 und 41.08; anderes Leder, der Tarifstelle 41.04 B II mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 898/80 af 11. april 1980 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidskind (undtagen varer,
    der henhører under pos. 41.06 og 41.08), i andre tilfælde, andre varer, under
    pos. 41.04 B II, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 898/80 della Commissione, dell' 11 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle pelli caprine, preparate,
    escluse quelle delle voci 41.06 e 41.08, altre pelli, non nominate, della sottovoce
    41.04 B II della tariffa doganale comune, originarie dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 898/80 van de Commissie van 11 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor geiteleder, alsmede voorgelooide
    huiden en vellen, van geiten, met uitzondering van de produkten bedoeld bij de
    posten 41.06 en 41.08; andere, van post 41.04 B II, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties
    werden geopend
  type: main
