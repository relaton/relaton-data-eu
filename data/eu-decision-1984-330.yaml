  script: Latn
  content: '84/330/EEC: Decision of the European Parliament of 10 April 1984 on the
    discharge granted to the Management Board of the European Centre for the Development
    of Vocational Training in respect of the implementation of its appropriations
    for the 1982 financial year . Resolution embodying the comments accompanying the
    decision granting a discharge to the Management Board of the European Centre for
    the Development of Vocational Training in respect of its revenue and expenditure
    accounts for the 1982 financial year'
  type: main
- language: fr
  script: Latn
  content: '84/330/CEE: Décision du Parlement européen du 10 avril 1984 donnant
    décharge au conseil d''administration du Centre européen pour le développement
    de la formation professionnelle sur l''exécution de son budget pour l''exercice
    1982 . Résolution contenant les observations relatives à la décision donnant
    décharge au conseil d''administration du Centre européen pour le développement
    de la formation professionnelle sur ses comptes de gestion pour l''exercice 1982'
  type: main
