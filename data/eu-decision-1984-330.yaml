    Berufsbildung erteilte Entlastung zur Ausführung seiner Einnahmen- und Ausgabenpläne
    für das Haushaltsjahr 1982 . Entschließung mit den Bemerkungen zu dem Beschluß,
    dem Verwaltungsrat des Europäischen Zentrums für die Förderung der Berufsbildung
    Entlastung zur Ausführung seiner Einnahmen- und Ausgabenpläne für das Haushaltsjahr
    1982 zu erteilen'
  type: main
- language: da
