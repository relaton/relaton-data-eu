  script: Latn
  content: Commission Implementing Decision (EU) 2021/1996 of 15 November 2021 establishing
    the equivalence, for the purpose of facilitating the right of free movement within
    the Union, of COVID-19 certificates issued by the Republic of Serbia to the certificates
    issued in accordance with Regulation (EU) 2021/953 of the European Parliament
    and of the Council
