title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 126/2004 of 23 January 2004 determining the
    extent to which the applications for import licences submitted in January 2004
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 126/2004 de la Commission du 23 janvier 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2004 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 2535/2001 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 126/2004 der Kommission vom 23. Januar 2004 zur Festlegung
    des Umfangs, in dem den im Januar 2004 gestellten Anträgen auf Erteilung von
    Lizenzen für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung
    (EG) Nr. 2535/2001 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 126/2004 af 23. januar 2004 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i januar 2004 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 2535/2001, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 126/2004 της Επιτροπής,
    της 23ης Ιανουαρίου 2004, που καθορίζει το κατά
    πόσον μπορούν να γίνουν δεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υπεβλήθησαν
    τον Ιανουάριο του 2004 για ορισμένα γαλακτοκομικά
    προϊόντα στο πλαίσιο ορισμένων δασμολογικών
    ποσοστώσεων που θεσπίσθηκαν με τον κανονισμό
    (ΕΚ) αριθ. 2535/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 126/2004, annettu 23 päivänä tammikuuta 2004,
    asetuksella (EY) N:o 2535/2001 avatuissa tiettyjen maitotuotteiden tariffikiintiöissä
    tammikuussa 2004 jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 126/2004 della Commissione, del 23 gennaio 2004, che
    stabilisce in quale misura possano essere accettate le domande di titoli di importazione
    presentate nel mese di gennaio 2004 per determinati prodotti lattiero-caseari
    nell'ambito di taluni contingenti tariffari aperti dal regolamento (CE) n. 2535/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 126/2004 van de Commissie van 23 januari 2004 tot
    vaststelling van de mate waarin invoercertificaataanvragen die in januari 2004
    in het kader van bĳ Verordening (EG) nr. 2535/2001 geopende tariefcontingenten
    voor bepaalde zuivelproducten zĳn ingediend, kunnen worden geaccepteerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 126/2004 da Comissão, de 23 de Janeiro de 2004,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Janeiro de 2004 para certos produtos lácteos no âmbito de determinados
    contingentes pautais abertos pelo Regulamento (CE) n.° 2535/2001
  type: main
- language: es
  script: Latn
