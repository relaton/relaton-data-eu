  script: Latn
  content: '79/1051/EEC: Commission Decision of 27 November 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Grand Duchy of Luxembourg of premiums
    paid during 1978 for the conversion of dairy herds to meat production (Only the
    French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/1051/CEE: Décision de la Commission, du 27 novembre 1979, relative
