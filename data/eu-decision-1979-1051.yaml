    (FEOGA), section "orientation", au grand-duché de Luxembourg, des primes versées
    pendant l''année 1978 pour la reconversion, vers la production de viande, de
    troupeaux bovins à orientation laitière (Le texte en langue française est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
