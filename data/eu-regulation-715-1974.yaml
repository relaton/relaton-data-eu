title:
- language: en
  script: Latn
  content: Regulation (EEC) No 715/74 of the Commission of 29 March 1974 modifying
    the Annex to Regulation (EEC) No 757/71 concerning the special rules for granting
    aid for exports of skimmed-milk powder for use as feed and skimmed milk processed
    into compound feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 715/74 de la Commission, du 29 mars 1974, modifiant
    l'annexe du règlement (CEE) n° 757/71 relatif à des modalités particulières
    concernant l'octroi d'aides pour le lait écrémé en poudre destiné à l'alimentation
    des animaux et le lait écrémé transformé en aliments composés lors de l'exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 715/74 der Kommission vom 29. März 1974 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 757/71 über besondere Durchführungsbestimmungen
    hinsichtlich der Beihilfengewährung für Magermilchpulver für Futterzwecke und
    zu Mischfutter verarbeitete Magermilch bei der Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 715/74 af 29. marts 1974 om ændring
    af forordning (EØF) nr. 757/71 om særlige, ved udførsel anvendelige gennemførelsesbestemmelser
    vedrørende ydelse af støtte til skummetmælkspulver til foderbrug og skummetmælk,
    der forarbejdes til foderblandinger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 715/74 della Commissione, del 29 marzo 1974, che modifica
    l'allegato del regolamento (CEE) n. 757/71 relativo a modalità d'applicazione
    particolari concernenti la concessione di aiuti per il latte scremato in polvere
    destinato all'alimentazione degli animali e per il latte scremato trasformato
    in alimenti composti, al momento dell'esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 715/74 van de Commissie van 29 maart 1974 houdende
    wijziging van de bijlage van Verordening (EEG) nr. 757/71 betreffende bijzondere
    uitvoeringsbepalingen met betrekking tot de steunverlening bij uitvoer voor magere-melkpoeder
    bestemd voor voederdoeleinden en tot mengvoeder verwerkte ondermelk
  type: main
