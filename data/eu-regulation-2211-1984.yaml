type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2211/84 of 30 July 1984 re-establishing
    the levying of customs duties on clothing accessories and articles, knitted or
    crocheted, products of category 67 (code 0670), originating in Brazil, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3570/83
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2211/84 de la Commission du 30 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux accessoires
    du vêtement et articles de bonneterie de la catégorie 67 (code 0670), originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2211/84 der Kommission vom 30. Juli 1984 über die
    Wiedereinführung des Zollsatzes für Bekleidungszubehör und andere Wirkwaren
    der Warenkategorie Nr. 67 (Kennziffer 0670) mit Ursprung in Brasilien, dem die
    in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2211/84 af 30. juli 1984 om genindførelse
    af opkrævning af toldafgifter for tilbehør til beklædningsgenstande og varer
    af trikotage, under varekategori nr. 67 (kode 0670), som har oprindelse i Brasilien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2211/84 της Επιτροπής
    της 30ής Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα έτοιμα
    ενδύματα εξωτερικά πλεκτά, μη ελαστικά ουδέ
    συνδεδυασμένα μετά καουτσούκ, καθώς και για
    τα συμπληρώματα της ενδύσεως και έτερα είδη
    (εξαιρέσει των μαγιώ λουτρού), προϊόντα της
    κατηγορίας 67 (κωδικός 0670), καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2211/84 della Commissione del 30 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli accessori di abbigliamento ed
    altri manufatti a maglia, della categoria di prodotti n. 67 (codice 0670), originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2211/84 van de Commissie van 30 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kledingtoebehoren
    en artikelen, van de categorie van produkten nr. 67 (codenummer 0670), van oorsprong
    uit Brazilië, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3570/83 van de Raad
  type: main
