title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2071/77 of 20 September 1977 maintaining in
    force, with certain amendments, the arrangements for the authorization of imports
    into certain Member States of woven fabrics of cotton and of garments originating
    in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2071/77 du Conseil, du 20 septembre 1977, portant
    maintien, avec certaines modifications, du régime d'autorisation d'importation,
    dans certains États membres, de tissus de coton et de vêtements originaires
    de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2071/77 des Rates vom 20. September 1977 zur mit einigen
    Änderungen verbundenen Aufrechterhaltung der Genehmigungspflicht für Einfuhren
    von Baumwollgeweben und Bekleidung mit Ursprung in bestimmten Drittländern nach
    einigen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2071/77 af 20. september 1977 om opretholdelse
    med visse ændringer af bevillingsordningen for indførsel til visse medlemsstater
    af vævede stoffer af bomuld samt af beklædningsgenstande med oprindelse i visse
    tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2071/77 del Consiglio, del 20 settembre 1977, che
    mantiene in vigore, con talune modifiche, un regime di licenze di importazione,
    in taluni Stati membri, di tessuti di cotone e oggetti di vestiario, originari
    di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2071/77 van de Raad van 20 september 1977 tot handhaving
    met enige wijzigingen van het vergunningenstelsel voor de invoer in bepaalde Lid-Staten
    van weefsels van katoen en van kleding van oorsprong uit bepaalde derde landen
  type: main
