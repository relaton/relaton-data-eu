title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1283/82 of 17 May 1982 imposing a definitive
    anti-dumping duty on oxalic acid originating in China and definitively collecting
    the amounts secured by way of provisional duty on oxalic acid originating in China
    and Czechoslovakia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1283/82 du Conseil, du 17 mai 1982, instituant un
    droit anti-"dumping" définitif sur l' acide oxalique originaire de Chine et percevant
    définitivement les montants garantis à titre de droit provisoire sur l' acide
    oxalique originaire de Chine et de Tchécoslovaquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1283/82 des Rates vom 17. Mai 1982 zur Einführung
    eines endgültigen Antidumpingzolls auf Oxalsäure mit Ursprung in China und zur
    endgültigen Vereinnahmung der in Form des vorläufigen Antidumpingzolls auf Oxalsäure
    mit Ursprung in China und der Tschechoslowakei einbehaltenen Beträge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1283/82 af 17. maj 1982 om indførelse af
    en endelig antidumpingtold på oxalsyre med oprindelse i Kina og om endelig opkrævning
    af de beløb, der er stillet som sikkerhed i form af midlertidig told på oxalsyre
    med oprindelse i Kina og Tjekkoslovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1283/82 τού Συμβουλίου
    τής 17ης Μαΐου 1982 περί επιβολής οριστικού δασμού
    αντιντάμπινγκ στό οξαλικό οξύ καταγωγής Κίνας
    καί περί οριστικής εισπράξεως τών ποσών πού
    αποτελούν αντικείμενο εγγυήσεως μέσω προσωρινού
    δασμού επί τού οξαλικού οξέος καταγωγής Κίνας
    καί Τσεχοσλοβακίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1283/82 del Consiglio, del 17 maggio 1982, recante
    istituzione di un dazio antidumping definitivo sull' acido ossalico originario
    della Cina e la riscossione definitiva della cauzione depositata a titolo di dazio
    provvisorio sull' acido ossalico originario della Cina e della Cecoslovacchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1283/82 van de Raad van 17 mei 1982 houdende instelling
    van een definitief anti-dumpingrecht op oxaalzuur van oorsprong uit China en definitieve
    inning van de bedragen die tot zekerheid zijn gesteld voor het voorlopige recht
    op oxaalzuur van oorsprong uit China en Tsjechoslowakije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1283/82 do Conselho, de 17 de Maio de 1982, que
    institui um direito "anti-dumping" definitivo sobre o ácido oxálico originário
    da China e que determina a cobrança definitiva dos montantes garantidos a título
    do direito provisório sobre o ácido oxálico originário da China e da Checoslováquia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1283/82 del Consejo, de 17 de mayo de 1982, por el
    que se establece un derecho antidumping definitivo sobre el ácido oxálico originario
    de China y por el que se perciben definitivamente los importes garantizados en
    concepto de derecho provisional sobre el ácido oxálico originario de China y
    Checoslovaquia
