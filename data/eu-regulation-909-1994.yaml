    την Τσεχική Δημοκρατία και τη Σλοβακική Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 909/94 della Commissione, del 25 aprile 1994, che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di aprile 1994 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca e la
    Repubblica slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 909/94 van de Commissie van 25 april 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sectoren eieren en pluimvee, die in april 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Overeenkomsten met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek en de Slowaakse Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 909/94 da Comissão, de 25 de Abril de 1994, que determina
