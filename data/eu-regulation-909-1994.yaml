title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 909/94 of 25 April 1994 determining the extent
    to which applications lodged in April 1994 licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 909/94 de la Commission, du 25 avril 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    avril 1994 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 909/94 der Kommission vom 25. April 1994 über die
    Festsetzung des Umfangs, in dem die im April 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik und der Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 909/94 af 25. april 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i april
    1994 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 909/94 της Επιτροπής
    της 25ης Απριλίου 1994 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε τον Απρίλιο του 1994 για άδειες
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
