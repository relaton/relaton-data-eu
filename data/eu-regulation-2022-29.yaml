  script: Latn
  content: Commission Delegated Regulation (EU) 2022/29 of 28 October 2021 supplementing
    Regulation (EU) 2019/1700 of the European Parliament and of the Council by specifying
    the number and the title of the variables in the income and living conditions
    domain on Labour market and housing, Intergenerational transmission of advantages
    and disadvantages, Housing difficulties, and the 2023 ad hoc subject on Households
    energy efficiency
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/29 de la Commission du 28 octobre 2021
    complétant le règlement (UE) 2019/1700 du Parlement européen et du Conseil
    en précisant le nombre et l’intitulé des variables dans le domaine du revenu
    et des conditions de vie sur le marché du travail et le logement, la transmission
    intergénérationnelle d’avantages et de désavantages, les difficultés de
    logement et le sujet ad hoc de 2023 sur l’efficacité énergétique des ménages
  type: main
