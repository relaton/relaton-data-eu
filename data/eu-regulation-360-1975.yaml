title:
- language: en
  script: Latn
  content: Regulation (EEC) No 360/75 of the Commission of 12 February 1975 determining
    the amounts applicable as compensatory amounts during the months of January and
    February 1975 to certain cereal and rice products exported in the form of goods
    not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 360/75 de la Commission, du 12 février 1975, déterminant
    les montants applicables à titre de montants compensatoires pendant les mois
    de janvier et février 1975 à certains produits des secteurs des céréales et
    du riz exportés sous forme de marchandises ne relevant pas de l'annexe II du
    Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 360/75 der Kommission vom 12. Februar 1975 zur Festsetzung
    der im Januar und Februar 1975 als Beitrittsausgleichsbeträge geltenden Beträge
    für einige Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 360/75 af 12. februar 1975 om fastsættelse
    af de beløb, der i januar og februar 1975 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 360/75 della Commissione, del 12 febbraio 1975, che
    determina gli importi compensativi «adesione» applicabili, durante i mesi di
    gennaio e febbraio 1975, a taluni prodotti dei settori dei cereali e del riso
    esportati sotto forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 360/75 van de Commissie van 12 februari 1975 houdende
    vaststelling van de bedragen die gedurende de maanden januari en februari 1975
    als compenserende bedragen moeten worden toegepast voor bepaalde produkten van
    de sector granen en de sector rijst, uitgevoerd in de vorm van niet in de bijlage
    II van het Verdrag vermelde goederen
  type: main
