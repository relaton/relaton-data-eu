title:
- language: en
  script: Latn
  content: '96/600/EC: Commission Decision of 9 October 1996 authorizing France to
    pay the processing premium provided for in Council Regulation (EEC) No 805/68
    on the common organization of the market in beef and veal, for animals withdrawn
    from production before exceeding the age of 20 days (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/600/CE: Décision de la Commission du 9 octobre 1996 autorisant la
    France à payer la prime de transformation prévue par le règlement (CEE) nº
    805/68 du Conseil portant organisation commune des marchés dans le secteur de
    la viande bovine pour des animaux retirés de la production avant d''avoir dépassé
    l''âge de vingt jours (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/600/EG: Entscheidung der Kommission vom 9. Oktober 1996 zur Ermächtigung
    Frankreichs, die mit der Verordnung (EWG) Nr. 805/68 des Rates über die gemeinsame
    Marktorganisation für Rindfleisch vorgesehene Verarbeitungsprämie für im Alter
    von weniger als 20 Tagen aus der Produktion genommene Tiere zu gewähren (Nur
    der französische Wortlaut ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/600/EF: Kommissionens Beslutning af 9. oktober 1996 om bemyndigelse
    af Frankrig til at udbetale den i Rådets forordning (EØF) nr. 805/68 om den
    fælles markedsordning for oksekød fastsatte forarbejdningspræmie for dyr, der
    fjernes fra produktionen, inden de er over tyve dage gamle (Kun den franske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/600/ΕΚ: Απόφαση της Επιτροπής της 9ης Οκτωβρίου
    1996 που επιτρέπει στη Γαλλία να καταβάλει την
    πριμοδότηση μεταποίησης η οποία προβλέπεται
    από τον κανονισμό (ΕΟΚ) αριθ. 805/68 του Συμβουλίου
    για την κοινή οργάνωση αγοράς στον τομέα του
    βοείου κρέατος, για τα ζώα που αποσύρονται
    από την παραγωγή προτού υπερβούν την ηλικία
    των είκοσι ημερών (Το κείμενο στη γαλλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/600/EY: Komission päätös, tehty 9 päivänä lokakuuta 1996, luvan
    antamisesta Ranskalle maksaa naudanliha-alan yhteisestä markkinajärjestelystä
    annetussa neuvoston asetuksessa (ETY) N:o 805/68 säädettyä jalostuspalkkiota
    eläimille, jotka on poistettu tuotannosta ennen kuin ne ovat yli kahdenkymmenen
    päivän ikäisiä (Ainoastaan ranskankielinen teksti on todistusvoimainen.)'
  type: main
- language: it
  script: Latn
  content: '96/600/CE: Decisione della Commissione del 9 ottobre 1996 che autorizza
    la Francia a pagare il premio di trasformazione previsto dal regolamento (CEE)
    n. 805/68 del Consiglio, relativo all''organizzazione comune dei mercati nel settore
    delle carni bovine, per animali ritirati dalla produzione prima di aver superato
    l''età di venti giorni (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/600/EG: Beschikking van de Commissie van 9 oktober 1996 houdende machtiging
    van Frankrijk tot betaling van de bij Verordening (EEG) nr. 805/68 van de Raad
    houdende een gemeenschappelijke ordening der markten in de sector rundvlees vastgestelde
    verwerkingspremie voor kalveren die uit produktie worden genomen vóórdat zij
    ouder zijn dan 20 dagen (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/600/CE: Decisão da Comissão de 9 de Outubro de 1996 que autoriza
    a França a pagar o prémio para a transformação de animais retirados da produção
    antes de ultrapassarem vinte dias de idade, previsto pelo Regulamento (CEE) n°
    805/68 do Conselho que estabelece a organização comum de mercado no sector da
    carne de bovino (Apenas faz fé o texto em língua francesa)'
  type: main
- language: es
  script: Latn
  content: '96/600/CE: Decisión de la Comisión de 9 de octubre de 1996 por la que
    se autoriza a Francia a pagar la prima de transformación contemplada en el Reglamento
    (CEE) nº 805/68 del Consejo, por el que se establece la organización común
    de mercados en el sector de la carne de bovino, por los animales retirados de
    la producción antes de superar los veinte días de edad (El texto en lengua francesa
    es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '96/600/EG: Kommissionens beslut av den 9 oktober 1996 om bemyndigande
    av Frankrike att utbetala det bearbetningsbidrag som föreskrivs genom rådets
    förordning (EEG) nr 805/68 om den gemensamma organisationen av marknaden för
    nötkött för djur som tagits ur produktion innan de är äldre än tjugo dagar
    (Endast den franska texten är giltig)'
  type: main
