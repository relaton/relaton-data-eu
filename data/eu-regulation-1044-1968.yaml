    paragraphe 2 du règlement n° 23 relatif à l'organisation commune des marchés
    dans le secteur des fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1044/68 der Kommission vom 24. Juli 1968 zur Änderung
    der Verordnung Nr. 99/65/EWG betreffend die Festlegung von Durchführungsbestimmungen
    für Artikel 11 Absatz 2 der Verordnung Nr. 23 über die gemeinsame Marktorganisation
    für Obst und Gemüse
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1044/68 della Commissione, del 24 luglio 1968, che
    modifica il regolamento n. 99/65/CEE che fissa le modalità di applicazione dell'articolo
    11, paragrafo 2, del regolamento n. 23 relativo alla graduale attuazione di un'organizzazione
    comune dei mercati nel settore degli ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1044/68 van de Commissie van 24 juli 1968 houdende
    wijziging van Verordening nr. 99/65/EEG inzake de wijze van toepassing van artikel
    11, lid 2, van Verordening 23 met betrekking tot de gemeenschappelijke ordening
    der markten voor groenten en fruit
