title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1524/92 of 12 June 1992 authorizing the
    Italian intervention agency to put up for sale by invitation to tender 12 000
    tonnes of paddy rice with a view to export in the form of milled rice to the Republics
    resulting from the dissolution of the Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1524/92 de la Commission, du 12 juin 1992, autorisant
    l'organisme d'intervention italien à mettre en adjudication 12 000 tonnes de
    riz paddy en vue d'exportation sous forme de riz blanchi à destination des républiques
    issues de la dissolution de l'URSS
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1524/92 der Kommission vom 12. Juni 1992 zur Ermächtigung
    der italienischen Interventionsstelle, 12 000 Tonnen Rohreis zur Ausfuhr nach
    den durch die Auflösung der UdSSR entstandenen Republiken in Form von voll- ständig
    geschliffenem Reis auszuschreiben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1524/92 af 12. juni 1992 om bemyndigelse
    af det italienske interventionsorgan til at udbyde 12 000 tons uafskallet ris
    i licitation med henblik på udførsel i form af sleben ris til republikker, der
    er opstået efter opløsningen af Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1524/92 της Επιτροπής
    της 12ης Ιουνίου 1992 που επιτρέπει στον ιταλικό
    οργανισμό παρεμβάσεως να προκηρύξει διαγωνισμό
    για 12 000 τόνους ρυζιού paddy με σκοπό την εξαγωγή
    του, υπό μορφή λευκασμένου ρυζιού, με προορισμό
    τις Δημοκρατίες που προήλθαν από τη διάλυση
    της ΕΣΣΔ
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1524/92 della Commissione, del 12 giugno 1992, che
    autorizza l'organismo di intervento italiano a vendere mediante gara 12 000 t
    di risone da esportare sotto forma di riso lavorato nelle Repubbliche sorte dallo
    scioglimento dell'Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1524/92 van de Commissie van 12 juni 1992 tot machtiging
    van het Italiaanse interventiebureau om 12 000 ton padie via een openbare inschrijving
    te verkopen met het oog op uitvoer in de vorm van volwitte rijst naar de republieken
    die zijn ontstaan als gevolg van de ontbinding van de USSR
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1524/92 da Comissão, de 12 de Junho de 1992, que
    autoriza o organismo de intervenção italiano a adjudicar 12 000 toneladas de
    arroz paddy tendo em vista a sua exportação sob a forma de arroz branqueado
    para as repúblicas resultantes da dissolução da URSS
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1524/92 de la Comisión, de 12 de junio de 1992, por
    el que se autoriza al organismo de intervención italiano a sacar a licitación
    12 000 toneladas de arroz con cáscara para su exportación en forma de arroz
    blanco con destino a las Repúblicas resultantes de la disolución de la URSS
  type: main
