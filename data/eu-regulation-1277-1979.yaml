  content: Council Regulation (EEC) No 1277/79 of 25 June 1979 laying down certain
    conservation and management measures for common fishery resources off the West
    Greenland coast applicable in 1979 to vessels flying the flag of Canada
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1277/79 du Conseil, du 25 juin 1979, fixant, pour
    l' année 1979, certaines mesures de conservation et de gestion des ressources
    de pêche au large de la côte occidentale du Groenland, applicables aux navires
    battant pavillon du Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1277/79 des Rates vom 25. Juni 1979 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände vor
    der westgrönländischen Küste gegenüber Schiffen unter kanadischer Flagge für
    1979
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1277/79 af 25. juni 1979 om fastsættelse
    for 1979 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne
    ud for Grønlands vestkyst, som skal finde anvendelse på fartøjer, der fører
    canadisk flag
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1277/79 del Consiglio, del 25 giugno 1979, che dispone
