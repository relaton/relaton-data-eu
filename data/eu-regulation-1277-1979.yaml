    al largo delle coste occidentali della Groenlandia, da applicare alle navi battenti
    bandiera del Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1277/79 van de Raad van 25 juni 1979 tot vaststelling
