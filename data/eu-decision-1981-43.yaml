id: EUDecision198143
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '81/43/EEC: Commission Decision of 19 January 1981 authorizing the French
    Republic not to apply Community treatment to blouses and shirt-blouses, knitted
    or crocheted (not elastic or rubberized), or woven, for women, girls and infants,
    of wool, of cotton or of man- made textile fibres, falling within subheadings
    ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff (category 7), originating
    in India and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/43/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    la République française à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie (non élastique ni caoutchoutée)
    ou tissés, originaires de l''Inde (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/43/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus Indien stammende Blusen und Hemdblusen aus Gewirken
    (weder gummielastisch noch kautschutiert) oder Geweben von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/43/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage skjorter, skjortebluser
    og bluser af trikotage (ikke elastisk eller gummeret) eller vævede med oprindelse
    i Indien (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/43/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    chemisiers, blouses-chemisiers καί μπλούζες, πλεκτά (μή ελαστικά
    ουδέ συνδεδυασμένα μετά καουτσούκ) ή υφασμένα,
    καταγόμενα από τήν Ινδία (Το κείμενο στην γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/43/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario camicie, camicette
    e bluse, a maglia, o tessute, originarie dell''India (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/43/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van de Franse Republiek om blouses en hemdblouses, van brei- of haakwerk (niet
    elastisch, niet gegummeerd) of geweven, van oorsprong uit India van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
