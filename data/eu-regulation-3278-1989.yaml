    für in der ausschließlichen Wirtschaftszone Norwegens und in der Fischereizone
    um Jan Mayen fischende Fischereifahrzeuge auf die Mitgliedstaaten (1989) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3278/89 af 30. oktober 1989 om anden ændring
