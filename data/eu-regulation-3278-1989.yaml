title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3278/89 of 30 October 1989 amending, for the
    second time, Regulation (EEC) No 4196/88 allocating, for 1989, certain catch quotas
    between Member States for vessels fishing in the Norwegian exclusive economic
    zone and the fishing zone around Jan Mayen
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3278/89 du Conseil du 30 octobre 1989 modifiant pour
