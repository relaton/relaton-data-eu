  content: Commission Regulation (EEC) No 376/78 of 23 February 1978 abolishing the
    countervailing charge on imports of mandarins (including tangerines and satsumas),
    clementines, wilkings and other similar citrus hybrids originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 376/78 de la Commission, du 23 février 1978, supprimant
    la taxe compensatoire à l'importation de mandarines, y compris tangerines et
    satsumas, clémentines, wilkings et autres hybrides similaires d'agrumes originaires
    du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 376/78 der Kommission vom 23. Februar 1978 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Clementinen, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten
    mit Ursprung in Marokko
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 376/78 af 23. februar 1978 om ophævelse
