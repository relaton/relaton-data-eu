title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1162 of 1 July 2019 amending
    Annexes I and II to Regulation (EU) No 206/2010 as regards the models of veterinary
    certificates BOV-X, OVI-X, OVI-Y and RUM and the lists of third countries, territories
    or parts thereof from which the introduction into the Union of certain ungulates
    and of fresh meat is authorised
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1162 de la Commission du 1er juillet
    2019 modifiant les annexes I et II du règlement (UE) n° 206/2010 en ce qui concerne
    les modèles de certificat vétérinaire BOV-X, OVI-X, OVI-Y et RUM, ainsi que
    les listes des pays tiers, territoires ou parties de pays tiers ou territoires
    en provenance desquels l'introduction dans l'Union de certains ongulés et de
    viandes fraîches est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/1162 der Kommission vom 1. Juli 2019
    zur Änderung der Anhänge I und II der Verordnung (EU) Nr. 206/2010 hinsichtlich
    der Musterveterinärbescheinigungen BOV-X, OVI-X, OVI-Y und RUM sowie der Listen
    der Drittländer, Gebiete und Teile davon, aus denen das Verbringen bestimmter
    Huftiere und bestimmten frischen Fleisches in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/1162 на Комисията
    от 1 юли 2019 година за изменение на приложения
    I и II към Регламент (ЕС) № 206/2010 по отношение
    на образците на ветеринарни сертификати BOV-X,
    OVI-X, OVI-Y и RUM и списъците на трети страни, територии
    или части от тях, от които е разрешено въвеждането
    в Съюза на някои копитни животни и на прясно
    месо
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/1162 ze dne 1. července 2019,
