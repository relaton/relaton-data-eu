    vzory veterinárních osvědčení BOV-X, OVI-X, OVI-Y a RUM a seznamy třetích
    zemí, území nebo jejich částí, z nichž je povolen vstup některých kopytníků
    a čerstvého masa na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2019/1162 af 1. juli 2019
