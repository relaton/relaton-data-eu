    BOV-X, OVI-X, OVI-Y i RUM i popisa trećih zemalja, državnih područja ili njihovih
    dijelova odobrenih za unos određenih papkara i svježeg mesa u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1162 végrehajtási rendelete (2019. július 1.)
    a 206/2010/EU rendelet I. és II. mellékletének a BOV-X, az OVI-X, az OVI-Y
    és a RUM állategészségügyi bizonyítványminták, valamint az egyes patás
    állatok és a friss hús Európai Unióba történő behozatalára engedéllyel
