    standardveterinærcertifikaterne BOV-X, OVI-X, OVI-Y og RUM samt listerne over
    tredjelande, tredjelandsområder og dele heraf, hvorfra det er tilladt at indføre
    visse hovdyr og fersk kød til Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2019/1162 της Επιτροπής,
