    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1162 della Commissione, del 1° luglio
    2019, che modifica gli allegati I e II del regolamento (UE) n. 206/2010 per quanto
    riguarda i modelli di certificati veterinari BOV-X, OVI-X, OVI-Y e RUM e gli elenchi
    dei paesi terzi, territori o loro parti da cui è autorizzata l'introduzione nell'Unione
    di determinati ungulati e carni fresche
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1162 (2019. gada 1. jūlijs),
    ar ko attiecībā uz veterināro sertifikātu paraugiem BOV-X, OVI-X, OVI-Y un
    RUM un attiecībā uz tādu trešo valstu, to teritoriju vai daļu sarakstiem,
    no kurām Savienībā atļauts ievest atsevišķus nagaiņus un svaigu gaļu,
    groza Regulas (ES) Nr. 206/2010 I un II pielikumu
  type: main
- language: lt
  script: Latn
  content: 2019 m. liepos 1 d. Komisijos įgyvendinimo reglamentas (ES) 2019/1162,
