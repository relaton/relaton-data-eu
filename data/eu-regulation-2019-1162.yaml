    ce privește modelele de certificate sanitar-veterinare BOV-X, OVI-X, OVI-Y și
    RUM și listele de țări terțe, teritorii sau părți ale acestora din care
    este autorizată introducerea în Uniune de anumite ungulate și de carne proaspătă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1162 z 1. júla 2019, ktorým
