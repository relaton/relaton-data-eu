title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3984/87 of 15 December 1987 fixing catch possibilities
    for 1988 for certain fish stocks and groups of fish stocks in the Regulatory Area
    as defined in the NAFO Convention and amending Regulation (EEC) No 3251/87 establishing
    an interim autonomous scheme of control in respect of Community vessels operating
    in the Regulatory Area of the North-West Atlantic Fisheries Organization (NAFO)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3984/87 du Conseil du 15 décembre 1987 fixant, pour
    1988, les possibilités de captures de certains stocks ou groupes de stocks de
    poissons dans la zone de réglementation définie par la convention NAFO et modifiant
    le règlement (CEE) n° 3251/87 instituant un programme intérimaire autonome
    de contrôle des navires communautaires dans la zone de réglementation de l'
    organisation des pêches de l' Atlantique du nord-ouest (NAFO)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3984/87 des Rates vom 15. Dezember 1987 zur Festlegung
    der Fangmöglichkeiten für bestimmte Fischbestände oder -bestandsgruppen im
    Regelungsbereich des NAFO-Übereinkommens für 1988 und zur Änderung der Verordnung
    (EWG) Nr. 3251/87 über eine autonome Zwischenregelung zur Kontrolle von Schiffen
    der Gemeinschaft im Regelungsbereich der Organisation für die Fischerei im Nordwestatlantik
    (NAFO)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3984/87 af 15. december 1987 om fastsættelse
    af fangstmulighederne for 1988 for visse fiskebestande eller grupper af fiskebestande
    i det af NAFO-Konventionen regulerede område og om ændring af forordning (EØF)
    nr. 3251/87 om fastsættelse af en midlertidig autonom ordning til kontrol med
    EF-fartøjer i det af Organisationen for Fiskeriet i Det Nordvestlige Atlanterhav
    (NAFO) regulerede område
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3984/87 του Συμβουλίου
    της 15ης Δεκεμβρίου 1987 για τον καθορισμό, για
    το 1988, των αλιευτικών δυνατοτήτων για ορισμένα
    αποθέματα ιχθύων ή ομάδες αποθεμάτων ιχθύων
    στη ζώνη διακανονισμού που ορίζεται από τη
    σύμβαση NAFO και για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 3251/87 για τη θέσπιση ενδιάμεσου αυτόνομου
    προγράμματος ελέγχου των κοινοτικών σκαφών
    στη ζώνη διακανονισμού της Οργάνωσης Αλιείας
    του Βορειοδυτικού Ατλαντικού (NAFO)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3984/87 del Consiglio del 15 dicembre 1987 che fissa
    per il 1988 le possibilità di catture per alcune popolazioni o gruppi di popolazioni
    ittiche nella zona di regolamentazione definita dalla convenzione NAFO e che modifica
    il regolamento (CEE) n. 3251/87 che istituisce un programma interinale autonomo
    di controllo per le navi della Comunità che operano nella zona di regolamentazione
    della Organizzazione della pesca dell' Atlantico nord-occidentale (NAFO)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3984/87 van de Raad van 15 december 1987 tot vaststelling
    van de vangstmogelijkheden, voor 1988, voor bepaalde visbestanden of groepen bestanden
    in het in het NAFO-Verdrag omschreven gereglementeerde gebied en tot wijziging
    van Verordening (EEG) nr. 3251/87 tot vaststelling van een autonome overgangsregeling
    voor controle en inspectie van vaartuigen van de Gemeenschap die hun activiteit
    uitoefenen in het gereglementeerde gebied van de Visserijorganisatie voor het
    noordwestelijk deel van de Atlantische Oceaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3984/87 do Conselho de 15 de Dezembro de 1987 que
    fixa, para 1988, as possibilidades de capturas relativamente a determinadas unidades
    populacionais ou grupos de unidades populacionais de peixes, na zona de regulamentação
    definida pela Convenção NAFO, e que altera o Regulamento (CEE) n.° 3251/87,
    que estabelece um programa autónomo interino de controlo dos navios comunitários
    que operam na área de regulamentação da Organização das Pescarias do Noroeste
    do Atlântico (NAFO)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3984/87 del Consejo de 15 de diciembre de 1987 por
    el que se fijan para el año 1988 las posibilidades de capturas para determinadas
    poblaciones o grupos de poblaciones de peces, en la zona de reglamentación definida
    por el Convenio NAFO que modifica el Reglamento (CEE) n° 3251/87 por el que se
    establece un programa autónomo provisional de control de los barcos comunitarios
    que faenan en la Zona de Regulación de la Organización de la Pesca en el Atlántico
    Noroccidental (NAFO)
  type: main
