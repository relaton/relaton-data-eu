title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 3438/93 of 15 December 1993 establishing,
    for 1994, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3438/93 de la Commission du 15 décembre 1993 établissant
    pour 1994 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3438/93 DER KOMMISSION vom 15. Dezember 1993 zur Festlegung
    der Liste für 1994 der Schiffe mit einer Länge über alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3438/93 af 15. december 1993 om listen
    for 1994 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3438/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 15ης Δεκεμβρίου 1993 που καταρτίζει, για το
    1994, τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3438/93 DELLA COMMISSIONE del 15 dicembre 1993 che
    fissa l' elenco per il 1994 dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i nove
    metri
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3438/93 VAN DE COMMISSIE van 15 december 1993 tot
    vaststelling voor 1994 van de lijst van vaartuigen met een lengte over alles van
    meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan
    de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3438/93 DA COMISSÃO de 15 de Dezembro de 1993 que
    estabelece para 1994 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3438/93 DE LA COMISIÓN de 15 de diciembre de 1993
    por el que se establece para 1994 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
