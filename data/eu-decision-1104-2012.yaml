title:
- language: en
  script: Latn
  content: Decision No 1104/2012/EU of the European Parliament and of the Council
    of 21 November 2012 amending Council Decision 2008/971/EC to include forest reproductive
    material of the ‘qualified’ category and to update the name of the authorities
    responsible for the approval and control of the production
  type: main
- language: fr
  script: Latn
  content: Décision n ° 1104/2012/UE du Parlement européen et du Conseil du 21
    novembre 2012 modifiant la décision 2008/971/CE du Conseil en vue d’inclure
    les matériels forestiers de reproduction de la catégorie «matériels qualifiés»
    et de mettre à jour la liste des autorités responsables de l’admission et
    du contrôle de la production
  type: main
- language: de
  script: Latn
  content: Beschluss Nr. 1104/2012/EU des Europäischen Parlaments und des Rates vom
    21. November 2012 zur Änderung der Entscheidung 2008/971/EG des Rates zum Zweck
    der Aufnahme von forstlichem Vermehrungsgut der Kategorie „qualifiziert“ sowie
    der Aktualisierung von Namen der für Zulassung und Kontrolle der Erzeugung zuständigen
    Behörden
  type: main
- language: bg
  script: Cyrl
  content: Решение № 1104/2012/ЕС на Европейския парламент
    и на Съвета от 21 ноември 2012 година за изменение
    на Решение 2008/971/ЕО на Съвета за включване на
    горския репродуктивен материал от категория
    „окачествен“ и за актуализиране на списъка
    с наименования на органите, отговарящи за одобрението
    и производствения контрол
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 1104/2012/EU ze dne 21. listopadu
    2012 , kterým se mění rozhodnutí Rady 2008/971/ES, pokud jde o zahrnutí reprodukčního
    materiálu lesních dřevin kategorie „kvalifikovaný“ a aktualizaci názvů
    orgánů příslušných pro schvalování a kontrolu produkce
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets afgørelse nr. 1104/2012/EU af 21. november
    2012 om ændring af Rådets beslutning 2008/971/EF for at medtage forstligt formeringsmateriale
    af kategorien »kvalificeret« og ajourføre navnet på de myndigheder, der er
    ansvarlige for godkendelse og kontrol af produktionen
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 1104/2012/EE του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 21ης Νοεμβρίου 2012 , περί
    τροποποιήσεως της απόφασης 2008/971/ΕΚ για τη συμπερίληψη
    του δασικού πολλαπλασιαστικού υλικού της κατηγορίας
    «χαρακτηρισμένο» και για την επικαιροποίηση
    του ονόματος των αρχών που είναι αρμόδιες για
    την έγκριση και τον έλεγχο της παραγωγής
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 1104/2012/EL, 21. november 2012
    , millega muudetakse nõukogu otsust 2008/971/EÜ, et lisada kategooriasse „tingimustele
    vastav paljundusmaterjal” kuuluvat metsapaljundusmaterjali ning ajakohastada
    toodangu heakskiidu ja kontrolli eest vastutavate asutuste nimesid
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 1104/2012/EU, annettu 21
    päivänä marraskuuta 2012 , neuvoston päätöksen 2008/971/EY muuttamisesta
    luokkaan ”alustavasti testattu” kuuluvan metsänviljelyaineiston sisällyttämiseksi
    sen soveltamisalaan ja tuotannon hyväksymisestä ja valvonnasta vastaavien viranomaisten
    nimien saattamiseksi ajan tasalle
  type: main
- language: hr
  script: Latn
  content: Odluka br. 1104/2012/EU Europskog parlamenta i Vijeća od 21. studenoga
    2012. o izmjeni Odluke Vijeća 2008/971/EZ radi uvrštenja šumskog reprodukcijskog
    materijala kategorije „kvalificiran” i ažuriranja naziva tijela odgovornih
    za odobravanje i nadzor proizvodnje
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1104/2012/EU határozata ( 2012. november
    21. ) a 2008/971/EK tanácsi határozatnak az erdészeti szaporítóanyagoknak
    a „minősített” kategóriába történő besorolása, és az engedélyezést
    és az előállítás ellenőrzését végző hatóságok nevének frissítése
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 1104/2012/UE del Parlamento europeo e del Consiglio, del 21
    novembre 2012 , che modifica la decisione 2008/971/CE del Consiglio per includere
    i materiali forestali di moltiplicazione della categoria «qualificati» e per
    aggiornare i nomi delle autorità responsabili dell’ammissione e del controllo
    della produzione
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 1104/2012/ES ( 2012. gada 21.
    novembris ), ar ko groza Padomes Lēmumu 2008/971/EK attiecībā uz tāda meža
    reproduktīvā materiāla iekļaušanu minētā lēmuma darbības jomā, kas pieskaitāms
    kategorijai “uzlabots” , un to iestāžu nosaukumu atjaunināšanu, kas atbildīgas
    par ražošanas apstiprināšanu un kontroli
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 21 d. Europos Parlamento ir Tarybos sprendimas Nr. 1104/2012/ES,
    kuriuo iš dalies keičiamas Tarybos sprendimas 2008/971/EB, siekiant į jo taikymo
    sritį įtraukti miško dauginamąją medžiagą, kurios kategorija yra „atitinkanti
    (kokybės) reikalavimus“ , ir atnaujinti už patvirtinimą ir auginimo kontrolę
    atsakingų institucijų pavadinimus
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni Nru 1104/2012/UE tal-Parlament Ewropew u tal-Kunsill tal- 21
    ta’ Novembru 2012 li temenda d-Deċiżjoni tal-Kunsill 2008/971/KE biex tinkludi
    l-materjal riproduttiv tal-foresta tal-kategorija “kwalifikati” u biex taġġorna
    l-isem tal-awtoritajiet responsabbli għall-approvazzjoni u l-kontroll tal-produzzjoni
  type: main
- language: nl
  script: Latn
  content: Besluit nr. 1104/2012/EU van het Europees Parlement en de Raad van 21 november
    2012 tot wijziging van Beschikking 2008/971/EG voor het opnemen van bosbouwkundig
    teeltmateriaal van de categorie „gekeurd” in het toepassingsgebied van die
    beschikking en voor het bijwerken van de namen van de voor de goedkeuring van
    en het toezicht op de productie verantwoordelijke autoriteiten
  type: main
- language: pl
  script: Latn
  content: Decyzja Parlamentu Europejskiego i Rady nr 1104/2012/UE z dnia 21 listopada
    2012 r. w sprawie zmiany decyzji Rady 2008/971/WE w celu włączenia leśnego
    materiału rozmnożeniowego kategorii „kwalifikowany” oraz aktualizacji nazwy
    organów odpowiedzialnych za zatwierdzanie i kontrolę produkcji
  type: main
- language: pt
  script: Latn
  content: Decisão n. ° 1104/2012/UE do Parlamento Europeu e do Conselho, de 21
    de novembro de 2012 , que altera a Decisão 2008/971/CE do Conselho para incluir
    materiais florestais de reprodução da categoria «material qualificado» e atualizar
    o nome das autoridades responsáveis pela aprovação e controlo da produção
  type: main
- language: ro
  script: Latn
  content: Decizia nr. 1104/2012/UE a Parlamentului European și a Consiliului din
    21 noiembrie 2012 de modificare a Deciziei 2008/971/CE a Consiliului pentru a
    include materialul forestier de reproducere din categoria „calificat” și
    a actualiza numele autorităților responsabile de autorizarea și controlul producției
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 1104/2012/EÚ z 21. novembra
    2012 , ktorým sa mení a dopĺňa rozhodnutie Rady 2008/971/ES s cieľom zahrnúť
    množiteľský materiál lesných kultúr kategórie „kvalifikovaný“ a aktualizovať
    názvy orgánov zodpovedných za schvaľovanie a kontrolu produkcie
  type: main
- language: sl
  script: Latn
  content: Sklep št. 1104/2012/EU Evropskega parlamenta in Sveta z dne 21. novembra
    2012 o spremembi Odločbe Sveta 2008/971/ES, da se vključi gozdni reprodukcijski
    material kategorije „kvalificiran“ in posodobijo imena organov, pristojnih
    za odobritev in nadzor proizvodnje
  type: main
- language: es
  script: Latn
  content: Decisión n ° 1104/2012/UE del Parlamento Europeo y del Consejo, de 21
    de noviembre de 2012 , por la que se modifica la Decisión 2008/971/CE del Consejo
    a fin de incluir materiales forestales de reproducción de la categoría «cualificados»
    y actualizar el nombre de las autoridades responsables de la autorización y del
    control de la producción
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 1104/2012/EU av den 21 november
    2012 om ändring av rådets beslut 2008/971/EG i syfte att införa skogsodlingsmaterial
    i kategorin ”individutvalt” och uppdatera namnen på de myndigheter som ansvarar
    för godkännande och kontroll av produktionen
