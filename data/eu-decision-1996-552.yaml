title:
- language: en
  script: Latn
  content: '96/552/EC: Commission Decision of 6 September 1996 approving the plan
    presented by Germany for the eradication of classical swine fever in feral pigs
    in Brandenburg and Mecklenburg-Western Pomerania, and repealing Decision 93/617/EC
    (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/552/CE: Décision de la Commission du 6 septembre 1996 portant approbation
    du plan d''éradication de la peste porcine classique chez les porcs sauvages
    dans le Brandebourg et le Mecklembourg-Poméranie-Occidentale, présenté par
    l''Allemagne, et abrogeant la décision 93/617/CE (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/552/EG: Entscheidung der Kommission vom 6. September 1996 zur Genehmigung
    des von Deutschland vorgelegten Plans zur Tilgung der klassischen Schweinepest
    bei Wildschweinen in Brandenburg und Mecklenburg-Vorpommern sowie zur Aufhebung
    der Entscheidung 93/617/EG (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/552/EF: Kommissionens beslutning af 6. september 1996 om godkendelse
    af den af Tyskland forelagte plan for udryddelse af klassisk svinepest hos vildtlevende
    svin i Brandenburg og Mecklenburg-Vorpommern og om ophævelse af beslutning 93/617/EF
    (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/552/ΕΚ: Απόφαση της Επιτροπής της 6ης Σεπτεμβρίου
    1996 για την έγκριση του προγράμματος εξάλειψης
    της κλασικής πανώλης των αγριόχοιρων στο Βραδεμβούργο
    και Mecklenburg-Δυτική Πομερανία, που έχει υποβληθεί
    από τη Γερμανία, και για την κατάργηση της απόφασης
    93/617/ΕΚ (Το κείμενο στη γερμανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '96/552/EY: Komission päätös, tehty 6 päivänä syyskuuta 1996, Saksan
    tekemän suunnitelman hyväksymisestä klassisen sikaruton torjumiseksi luonnonvaraisissa
    sioissa Brandenburgin ja Mecklenburg-Westpommernin alueella sekä päätöksen
    93/617/EY kumoamisesta (Ainoastaan saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/552/CE: Decisione della Commissione del 6 settembre 1996 che approva
    il piano di eradicazione della peste suina classica dai suini selvatici nel Brandeburgo
    e nel Meclemburgo-Pomerania occidentale, e che abroga la decisione 93/617/CE (Il
    testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '96/552/EG: Beschikking van de Commissie van 6 september 1996 tot goedkeuring
    van het door Duitsland ingediende programma voor de uitroeiing van klassieke varkenspest
    bij wilde varkens in Brandenburg en Mecklenburg- Vorpommern, en tot intrekking
    van Beschikking 93/617/EG (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '96/552/CE: Decisão da Comissão de 6 de Setembro de 1996 que aprova o
