title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1978 on the reimbursement by the Guidance
    Section of the EAGGF to Ireland of expenditure incurred during 1976 on aids relating
    to the provision of socio-economic guidance for and the acquisition of occupational
    skills by persons engaged in agriculture
  type: main
- language: fr
  script: Latn
  content: '78/382/CEE: Décision de la Commission, du 10 avril 1978, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section orientation, à l''Irlande des dépenses effectuées pendant l''année
    1976 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1978 über die Rückvergütung
    der im Jahr 1976 für die sozio-ökonomische Information und die berufliche Qualifikation
    der in der Landwirtschaft tätigen Personen geleisteten Ausgaben durch den EAGFL,
    Abteilung Ausrichtung, an Irland
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. april 1978 om refusion gennem EUGFL, udviklingssektionen,
    til Irland af de udgifter, som er afholdt i løbet af året 1976 til støtte vedrørende
    social og erhvervsmæssig vejledning og faglige kvalifikationer hos de personer,
    som arbejder i landbruget
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1978, relativa al rimborso da
    parte del FEAOG, sezione orientamento, all'Irlanda delle spese effettuate durante
    il 1976 per gli aiuti concernenti l'informazione socio-economica e la qualificazione
    professionale delle persone che lavorano nell'agricoltura
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1978 betreffende vergoeding door
    het EOGFL, afdeling Oriëntatie, aan Ierland van de gedurende het jaar 1976 gedane
    uitgaven voor steun met betrekking tot de sociaal-economische voorlichting en
    de scholing van personen die in de landbouw werkzaam zijn
