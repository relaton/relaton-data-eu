    model TEMSCAN- 200 CX" non può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/293/EEG: Beschikking van de Commissie van 13 april 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Jeol - Electron Microscope, model Temscan-200CX"
