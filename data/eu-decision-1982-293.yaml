title:
- language: en
  script: Latn
  content: '82/293/EEC: Commission Decision of 13 April 1982 establishing that the
    apparatus described as ''Jeol - Electron Microscope, model Temscan-200CX'', may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/293/CEE: Décision de la Commission, du 13 avril 1982, constatant que
    l''importation de l''appareil dénommé "JEOL - electron microscope, model Temscan-200
    CX" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/293/EWG: Entscheidung der Kommission vom 13. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Jeol- Electron Microscope, model Temscan-200CX" nicht
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/293/EØF: Kommissionens beslutning af 13. april 1982 om fastslåelse
    af, at indførsel af apparatet "Jeol - Electron microscope, model Temscan-200CX"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/293/EOK: Απόφαση τής Επιτροπής τής 13ης Απριλίου
