id: EUDecision1980265
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/265/EEC: Commission Decision of 31 January 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven and knitted or crocheted dresses, falling
    within subheadings ex 60.05 A II and ex 61.02 B II of the Common Customs Tariff
    (category 26), originating in Taiwan and in free circulation in the other Member
    States (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/265/CEE: Décision de la Commission, du 31 janvier 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et robes de bonneterie
    des sous-positions ex 60.05 A II et ex 61.02 B II du tarif douanier commun (catégorie
    26), originaires de T''ai-wan et mises en libre pratique dans les autres États
    membres (Les textes en langues française et néerlandaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/265/EWG: Entscheidung der Kommission vom 31. Januar 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Taiwan stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Kleider aus Geweben und aus Gewirken der Tarifstellen
    ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs, Kategorie 26, von
    der Gemein schaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/265/EØF: Kommissionens beslutning af 31. januar 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage,
    som henhører under pos. ex 60.05 A II og 61.02 B II i den fælles toldtarif (kategori
    26), har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/265/CEE: Decisione della Commissione, del 31 gennaio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario gli abiti interi tessuti ed a maglia,
    delle sottovoci ex 60.05 A II e ex 61.02 B II della tariffa doganale comune, categoria
    26, originaria di Taiwan e messi in libera pratica negli altri Stati membri (Il
    testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/265/EEG: Beschikking van de Commissie van 31 januari 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd japonnen, geweven en van brei- of haakwerk, van de posten ex
    60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief, categorie
    26, van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
