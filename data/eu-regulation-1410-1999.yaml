title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1410/1999 of 29 June 1999 amending Regulation
    (EC) No 2808/98 laying down detailed rules for the application of the agrimonetary
    system for the euro in agriculture and amending the definition of certain operative
    events provided for in Regulations (EEC) No 3889/87, (EEC) No 3886/92, (EEC) No
    1793/93, (EEC) No 2700/93 and (EC) No 293/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1410/1999 de la Commission, du 29 juin 1999, modifiant
    le règlement (CE) n° 2808/98 portant modalités d'application du régime agrimonétaire
    de l'euro dans le secteur agricole et modifiant la définition de certains faits
    générateurs reprise dans les règlements (CEE) n° 3889/87, (CEE) n° 3886/92,
    (CEE) n° 1793/93, (CEE) n° 2700/93 et (CE) n° 293/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1410/1999 der Kommission vom 29. Juni 1999 zur Änderung
    der Verordnung (EG) Nr. 2808/98 mit Durchführungsvorschriften für die agromonetäre
    Regelung nach Einführung des Euro im Agrarsektor und zur Änderung der Festlegung
    bestimmter maßgeblicher Tatbestände in den Verordnungen (EWG) Nr. 3889/87, (EWG)
    Nr. 3886/92, (EWG) Nr. 1793/93, (EWG) Nr. 2700/93 und (EG) Nr. 293/98
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1410/1999 на Комисията от 29
    юни 1999 година за изменение на Регламент (ЕО)
    № 2808/98 относно определяне на подробни правила
    за прилагането на агромонетарния режим на
    еурото в селското стопанство и за изменение
    на дефиницията на някои правопораждащи факти,
    предвидени в Регламенти (ЕИО) № 3889/87, (ЕИО) №
    3886/92, (ЕИО) № 1793/93, (ЕИО) № 2700/93 и (ЕО) № 293/98
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1410/1999 ze dne 29. června 1999, kterým
    se mění nařízení (ES) č. 2808/98, kterým se stanoví prováděcí pravidla
    k agromonetární úpravě pro euro v zemědělství a kterým se mění definice
    některých rozhodných skutečností stanovených v nařízeních (EHS) č. 3889/87,
    (EHS) č. 3886/92, (EHS) č. 1793/93, (EHS) č. 2700/93 a (ES) č. 293/98
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1410/1999 af 29. juni 1999 om ændring
    af forordning (EF) nr. 2808/98 om gennemførelsesbestemmelser for den agromonetære
    ordning for euroen i landbrugssektoren og om ændring af definitionen af visse
    udløsende begivenheder i forordning (EØF) nr. 3889/87, (EØF) nr. 3886/92, (EØF)
    nr. 1793/93, (EØF) nr. 2700/93 og (EF) nr. 293/98
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1410/1999 της Επιτροπής
    της 29ης Ιουνίου 1999 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2808/98 περί λεπτομερειών
    εφαρμογής του γεωργονομισματικού καθεστώτος
    του ευρώ στον γεωργικό τομέα και την τροποποίηση
    του καθορισμού ορισμένων γενεσιουργών αιτίων
    που αναφέρονται στους κανονισμούς (ΕΟΚ) αριθ.
    3889/87, (ΕΟΚ) αριθ. 3886/92, (ΕΟΚ) αριθ. 1793/93, (ΕΟΚ) αριθ.
    2700/93 και (ΕΚ) αριθ. 293/98
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1410/1999, 29. juuni 1999, millega muudetakse
    määrust (EÜ) nr 2808/98, millega sätestatakse põllumajanduse eurol põhineva
    valuutasüsteemi üksikasjalikud rakenduseeskirjad põllumajandussektoris, ja
    muudetakse määrustes (EMÜ) nr 3889/87, (EMÜ) nr 3886/92, (EMÜ) nr 1793/93,
    (EMÜ) nr 2700/93 ja (EÜ) nr 293/98 sätestatud teatavate rakendusjuhtude määratlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1410/1999, annettu 29 päivänä kesäkuuta 1999,
    maatalouden euromääräisen valuuttajärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä maatalousalalla annetun asetuksen (EY) N:o 2808/98 sekä asetuksissa
    (ETY) N:o 3889/87, (ETY) N:o 3886/92, (ETY) N:o 1793/93, (ETY) N:o 2700/93 ja
    (EY) N:o 293/98 annetun tiettyjen määräytymisperusteiden määritelmän muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1410/1999/EK rendelete (1998. június 29.) az euró agromonetáris
    rendszerének a mezőgazdasági ágazatban való alkalmazására vonatkozó részletes
    szabályok megállapításáról szóló 2808/98/EK rendelet, valamint a 3889/87/EGK,
    a 3886/92/EGK, az 1793/93/EGK, a 2700/93/EGK és a 293/98/EK rendeletekben szereplő
    egyes meghatározó ügyleti tények meghatározásának módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1410/1999 della Commissione del 29 giugno 1999 che
    modifica il regolamento (CE) n. 2808/98 recante modalità d'applicazione del regime
    agromonetario dell'euro nel settore agricolo, e la definizione di alcuni fatti
    generatori di cui ai regolamenti (CEE) n. 3889/87, (CEE) n. 3886/92, (CEE) n.
    1793/93, (CEE) n. 2700/93 e (CE) n. 293/98
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1410/1999 (1999. gada 29. jūnijs), ar kuru groza
    Regulu (EK) Nr. 2808/98, ar ko nosaka sīki izstrādātus noteikumus eiro agromonetārā
    režīma piemērošanai lauksaimniecībā un groza dažu noteicošo dienu definīcijas,
    kuras paredzētas Regulās (EEK) Nr. 3889/87, (EEK) Nr. 3886/92, (EEK) Nr. 1793/93,
    (EEK) Nr. 2700/93 un (EK) Nr. 293/98
  type: main
- language: lt
  script: Latn
  content: 1999 m. birželio 29 d. Komisijos reglamentas (EB) Nr. 1410/1999, iš dalies
    keičiantis Reglamentą (EB) Nr. 2808/98, nustatantį išsamias žemės ūkio
    pinigų politikos sistemos taikymo taisykles eurui žemės ūkyje, ir iš dalies
    pakeičiantis Reglamentuose (EEB) Nr. 3889/87, (EEB) Nr. 3886/92, (EEB) Nr. 1793/93,
    (EEB) Nr. 2700/93 ir (EB) Nr. 293/98 numatytų tam tikrų operacinių įvykių
    apibrėžimus
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1410/1999 tad-29 ta’ Ġunju 1999
    li jemenda r-Regolament (KE) Nru 2808/98 li jistabbilixxi regoli dettaljati għall-applikar
    ta’ sistema agrimonetarja għall-ewro fl-agrikoltura u jemenda d-definizzjoni
    ta’ ċerti avvenimenti operattivi li hemm disposizzjoni dwarhom fir-Regolamenti
    (KEE) Nru 3889/87, (KEE) Nru 3886/92, (KEE) Nru 1793/93, (KEE) Nru 2700/93 u (KE)
    Nru 293/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1410/1999 van de Commissie van 29 juni 1999 tot wijziging
    van Verordening (EG) nr. 2808/98 houdende bepalingen voor de toepassing van het
    agromonetaire stelsel voor de euro in de landbouwsector en tot wijziging van een
    aantal ontstaansfeiten die bepaald zijn in de Verordeningen (EEG) nr. 3889/87,
    (EEG) nr. 3886/92, (EEG) nr. 1793/93, (EEG) nr. 2700/93 en (EG) nr. 293/98
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1410/99 z dnia 29 czerwca 1999 r. zmieniające
    rozporządzenie 2808/98/WE ustanawiające szczegółowe zasady stosowania agromonetarnego
    systemu dla EUR w rolnictwie oraz zmieniające definicje niektórych terminów
    operacyjnych przewidzianych w rozporządzeniach 3889/87/EWG, 3886/92/EWG, 1793/93/EWG,
    2700/93/EWG i 293/98/WE
  type: main
- language: pt
  script: Latn
  content: 'Regulamento (CE) n° 1410/1999 da Comissão de 29 de Junho de 1999 que
    altera o Regulamento (CE) n° 2808/98 da Comissão que estabelece normas de execução
    do regime agromonetário do euro no sector agrícola e altera a definição de
    determinados factos geradores que consta dos seguintes Regulamentos: (CEE) n°
    3889/87, (CEE) n° 3886/92, (CEE) n° 1793/93, (CEE) n° 2700/93 e (CE) n° 293/98'
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1410/1999 al comisiei din 29 iunie 1999 de modificare
    a Regulamentului (CE) nr. 2808/98 de stabilire a normelor de aplicare a sistemului
    agromonetar pentru moneda euro în sectorul agricol și de modificare a definiției
    anumitor fapte generatoare prevăzute de Regulamentele (CEE) nr. 3889/87, (CEE)
    nr. 3886/92, (CEE) nr. 1793/93, (CEE) nr. 2700/93 și (CE) nr. 293/98
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1410/1999 z 29. júna 1999, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2808/98 ustanovujúce podrobné pravidlá uplatňovania
    poľnohospodárskeho menového systému pre euro v poľnohospodárstve a ktorým
    sa mení a dopĺňa definícia určitých rozhodujúcich skutočností stanovených
    v nariadeniach (EHS) č. 3889/87, (EHS) č. 3886/92, (EHS) č. 1793/93, (EHS)
    č. 2700/93 a (ES) č. 293/98
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1410/1999 z dne 29. junija 1999 o spremembah
    Uredbe (ES) št. 2808/98 o določitvi podrobnih pravil za uporabo kmetijsko-monetarnega
    sistema za evro v kmetijstvu in spremembi opredelitve nekaterih operativnih dogodkov
    iz uredb (EGS) št. 3889/87, (EGS) št. 3886/92, (EGS) št. 1793/93, (EGS) št.
    2700/93 in (ES) št. 293/98
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1410/1999 de la Comisión de 29 de junio de 1999 que
    modifica el Reglamento (CE) n° 2808/98 por el que se establecen las disposiciones
    de aplicación del régimen agromonetario del euro en el sector agrario y que
    modifica la definición de determinados hechos generadores recogidos en los Reglamentos
    (CEE) nos 3889/87, 3886/92, 1793/93, 2700/93 y (CE) n° 293/98
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens förordning (EG) nr 1410/1999 av den 29 juni 1999 om ändring
    av förordning (EG) nr 2808/98 om tillämpningsföreskrifter för den agromonetära
    ordningen för euron inom jordbrukssektorn och om ändring av definitionen av
    vissa avgörande händelser i följande förordningar: (EEG) nr 3889/87, (EEG)
    nr 3886/92, (EEG) nr 1793/93, (EEG) nr 2700/93 och (EG) nr 293/98'
  type: main
