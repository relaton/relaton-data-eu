title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3045/92 of 22 October 1992 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for export to Georgia under Regulation (EEC)
    No 1897/92 and amending Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3045/92 de la Commission, du 22 octobre 1992, relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées vers la Géorgie en application du règlement (CEE) n° 1897/92
    et modifiant le règlement (CEE) n° 569/88
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3045/92 der Kommission vom 22. Oktober 1992 über
    den Verkauf von Interventionsrindfleisch zur Ausfuhr nach Georgien gemäß der
    Verordnung (EWG) Nr. 2539/84 und der Verordnung (EWG) Nr. 1897/92 sowie zur Änderung
    der Verordnung (EWG) Nr. 569/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3045/92 af 22. oktober 1992 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Georgien i henhold til forordning (EØF) nr. 1897/92
    og om ændring af forordning (EØF) nr. 569/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3045/92 της Επιτροπής
    της 22ας Οκτωβρίου 1992 σχετικά με την πώληση,
    βάσει της διαδικασίας που καθορίζεται στον
    κανονισμό (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που
    κατέχεται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται να εξαχθεί προς τη Γεωργία,
    σε εφαρμογή του κανονισμού (ΕΟΚ) αριθ. 1897/92 και
    για την τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    569/88
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3045/92, annettu 22 päivänä lokakuuta 1992,
    tiettyjen interventioelinten hallussaan pitämien ja asetuksen (ETY) N:o 1897/92
    mukaisesti Gruusiaan vietäväksi tarkoitettujen naudanlihojen myynnistä asetuksessa
    (ETY) N:o 2539/84 määriteltyä menettelyä noudattaen ja asetuksen (ETY) N:o
    569/88 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3045/92 della Commissione, del 22 ottobre 1992, relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'intervento e destinate all'esportazione
    in Georgia, in applicazione del regolamento (CEE) n. 1897/92 e che modifica il
    regolamento (CEE) n. 569/88
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3045/92 van de Commissie van 22 oktober 1992 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar Georgië
    bestemd rundvlees ter uitvoering van Verordening (EEG) nr. 1897/92 en tot wijziging
    van Verordening (EEG) nr. 569/88
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3045/92 da Comissão, de 22 de Outubro de 1992, relativo
    à venda, no âmbito do procedimento definido no Regulamento (CEE) nº 2539/84,
    de carne de bovino detida por certos organismos de intervenção e destinada a
    ser exportada para a Geórgia, em aplicação do Regulamento (CEE) nº 1897/92,
    e que altera o Regulamento (CEE) nº 569/88
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3045/92 de la Comisión, de 22 de octubre de 1992,
    relativo a la venta, en el marco del procedimiento definido en el Reglamento (CEE)
    nº 2539/84, de carnes de vacuno en poder de determinados organismos de intervención
    y destinadas a ser exportadas a Georgia en aplicación del Reglamento (CEE) nº
    1897/92 y por el que se modifica el Reglamento (CEE) nº 569/88
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3045/92 av den 22 oktober 1992 om försäljning
    enligt förfarandet i förordning (EEG) nr 2539/84 av sådant nötkött som innehas
    av vissa interventionsorgan och som är avsett för export till Georgien enligt
    förordning (EEG) nr 1897/92 och om ändring av förordning (EEG) nr 569/88
