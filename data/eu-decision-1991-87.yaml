id: EUDecision199187
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '91/87/EEC, Euratom: Commission Decision of 4 February 1991 amending Decision
    90/179/Euratom, EEC authorizing the Federal Republic of Germany to use statistics
    for years earlier than the last year and not to take into account certain categories
    of transactions or to use certain approximate estimates for the calculation of
    the VAT own resources base (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/87/CEE, Euratom: Décision de la Commission du 4 février 1991 modifiant
    la décision 90/179/Euratom, CEE autorisant la République fédérale d''Allemagne
    à utiliser des données statistiques antérieures à la pénultième année et
    à ne pas tenir compte de certaines catégories d''opérations ou à utiliser
    certaines estimations approximatives pour le calcul de la base des ressources
    propres provenant de la taxe sur la valeur ajoutée (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/87/EWG, Euratom: Entscheidung der Kommission vom 4. Februar 1991 zur
    Änderung der Entscheidung 90/179/Euratom, EWG, mit der die Bundesrepublik Deutschland
    ermächtigt wird, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel
    bestimmte Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei
    bestimmten anderen Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln
    (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/87/EØF, Euratom: Kommissionens beslutning af 4. februar 1991 om ændring
    af beslutning 90/179/Euratom, EØF om bemyndigelse af Forbundsrepublikken Tyskland
    til at beregne grundlaget for Fællesskabernes momsindtægter på basis af statistiske
    oplysninger hidrørende fra et år, der ligger længere tilbage end det næstsidste
    år, at undlade at tage hensyn til visse transaktioner og, for andre transaktioners
    vedkommende, at foretage en tilnærmelsesvis vurdering (Kun den tyske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '91/87/ΕΟΚ, Ευρατόμ: Απόφαση της Επιτροπής
    της 4ης Φεβρουαρίου 1991 για την τροποποίηση
    της απόφασης 90/179/Ευρατόμ, ΕΟΚ, με την οποία
    επιτρέπεται στη Γερμανία να χρησιμοποιεί στατιστικά
    δεδομένα προγενέστερα εκείνων του προτελευταίου
    έτους και να μη λαμβάνει υπόψη ορισμένες κατηγορίες
    δραστηριοτήτων ή να χρησιμοποιεί κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από το φόρο επί
    της προστιθεμένης αξίας'
  type: main
- language: it
  script: Latn
  content: '91/87/CEE, Euratom: Decisione della Commissione del 4 febbraio 1991 che
    modifica la decisione 90/179/Euratom, CEE che autorizza la Repubblica federale
    di Germania a utilizzare dati statistici anteriori al penultimo anno e a non tener
    conto di determinate categorie di operazioni e a ricorrere a talune valutazioni
    approssimative per il calcolo della base delle risorse proprie provenienti dall''imposta
    sul valore aggiunto (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '91/87/EEG, Euratom: Beschikking van de Commissie van 4 februari 1991 tot
    wijziging van Beschikking 90/179/Euratom, EEG, waarbij de Bondsrepubliek Duitsland
    wordt gemachtigd gebruik te maken van statistische gegevens van aan het voorlaatste
    jaar voorafgaande jaren en geen rekening te houden met bepaalde categorieën handelingen
    of gebruik te maken van ramingen voor de berekening van de grondslag van de eigen
    middelen uit de belasting over de toegevoegde waarde (Slechts de tekst in de Duitse
    taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/87/CEE, Euratom: Decisão da Comissão de 4 de Fevereiro de 1991 que
    altera a Decisão 90/179/Euratom, CEE, que autoriza a República Federal da Alemanha
    a não ter em conta determinadas categorias de operações e a utilizar determinadas
    estimativas aproximativas para o cálculo da matéria colectável dos recursos
    próprios provenientes do Imposto sobre o Valor Acrescentado (Apenas faz fé o
    texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '91/87/CEE, Euratom: Decisión de la Comisión de 4 de febrero de 1991
    por la que se modifica la Decisión 90/179/Euratom, CEE, por la que se autoriza
    a la República Federal de Alemania a utilizar datos estadísticos anteriores
    al penúltimo año y a no tomar en consideración determinadas categorías de
    operaciones y utilizar estimaciones aproximadas para el cálculo de la base de
    los recursos propios procedentes del Impuesto sobre el Valor Añadido (El texto
    en lengua alemana es el único auténtico)'
  type: main
