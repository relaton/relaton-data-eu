  content: Council Regulation (EEC) No 3224/82 of 22 November 1982 opening, allocating
    and providing for the administration of a Community tariff quota for yarn of poly(p-phenyleneterephthalamide)
    for use in the manufacture of tyres or of products used in the manufacture of
    tyres, falling within subheading ex 51.01 A of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3224/82 du Conseil, du 22 novembre 1982, portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire pour
    les fils de poly("p"-phénylène téréphtalamide), destinés à être utilisés
    dans la fabrication de pneumatiques ou de produits utilisés dans la fabrication
    de pneumatiques, de la sous-position ex 51.01 A du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3224/82 des Rates vom 22. November 1982 zur Eröffnung,
