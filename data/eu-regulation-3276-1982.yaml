  content: Verordening (EEG) nr. 3276/82 van de Raad van 3 december 1982 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van methylamine,
    dimethylamine en trimethylamine van oorsprong uit de Duitse Democratische Republiek,
    en definitieve inning van de tot zekerheid voor het voorlopige anti-dumpingrecht
    gestelde bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3276/82 do Conselho, de 3 de Dezembro de 1982, que
