title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3276/82 of 3 December 1982 imposing a definitive
    anti-dumping duty on imports of methylamine, dimethylamine and trimethylamine
    originating in the German Democratic Republic and definitively collecting the
    amounts secured by way of provisional duty
  type: main
- language: fr
  script: Latn
