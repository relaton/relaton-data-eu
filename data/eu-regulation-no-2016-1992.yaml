title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2016/92 of 20 July 1992 determining the
    extent to which applications lodged in July 1992 for import licences for fresh,
    chilled or frozen beef under the import arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic (CSFR) can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2016/92 de la Commission du 20 juillet 1992 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1992 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    intérimaires conclus par la Communauté avec la République de Pologne, la République
    de Hongrie et la République fédérative tchèque et slovaque (RFTS)
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2016/92 DER KOMMISSION vom 20. Juli 1992 zur Festsetzung
    des Umfangs, in dem die im Juli 1992 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Interimsabkommen zwischen
    der Gemeinschaft und der Republik Polen, der Republik Ungarn und der Tschechischen
    und Slowakischen Föderativen Republik (TSFR) genehmigt werden können #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2016/92 af 20. juli 1992 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i juli 1992, om
    importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i interimsaftalerne mellem Fællesskabet og Republikken Polen,
    Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2016/92 της Επιτροπής
    της 20ής Ιουλίου 1992 περί καθορισμού του ορίου
    εντός του οποίου δύναται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο του 1992 για τα νωπά, διατηρημένα με
    απλή ψύξη ή κατεψυγμένα βόεια κρέατα στα πλαίσια
    των καθεστώτων εισαγωγής που προβλέπονται
