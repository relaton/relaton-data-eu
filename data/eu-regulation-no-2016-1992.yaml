  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2016/92 DELLA COMMISSIONE del 20 luglio 1992 che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d''
    importazione presentate nel mese di luglio 1992 per le carni bovine fresche, refrigerate
    o congelate nel quadro dei regimi di importazione previsti dagli accordi interinali
    conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria
    e la Repubblica federativa ceca e slovacca (RFCS) #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2016/92 VAN DE COMMISSIE van 20 juli 1992 tot vaststelling
