    nekaterih živali, zarodnega materiala in proizvodov živalskega izvora v Unijo
    ter za njihove premike in ravnanje z njimi po vstopu
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2020/692 de la Comisión, de 30 de enero de 2020,
    que completa el Reglamento (UE) 2016/429 del Parlamento Europeo y del Consejo
    en lo referente a las normas para la entrada en la Unión, y para el desplazamiento
    y la manipulación tras la entrada, de las partidas de determinados animales, productos
    reproductivos y productos de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2020/692 av den 30 januari 2020
    om komplettering av Europaparlamentets och rådets förordning (EU) 2016/429 vad
    gäller bestämmelser för införsel till unionen samt förflyttning och hantering
    efter införsel av sändningar av vissa djur, avelsmaterial och produkter av animaliskt
    ursprung
