    jde o pravidla pro vstup zásilek některých zvířat, zárodečných produktů a produktů
    živočišného původu do Unie a jejich přemísťování a manipulaci s nimi po vstupu
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2020/692 af 30. januar 2020 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2016/429
    for så vidt angår regler vedrørende indførsel til Unionen og flytning og håndtering
    efter indførsel af sendinger af visse dyr, visse typer avlsmateriale og visse
    animalske produkter
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2020/692 της Επιτροπής, της 30ής Ιανουαρίου
