    de Raad wat betreft regels voor de binnenkomst in de Unie en het na binnenkomst
    verplaatsen van en werken met zendingen van bepaalde dieren, levende producten
    en producten van dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2020/692 z dnia 30 stycznia 2020
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2016/429
    w odniesieniu do przepisów dotyczących wprowadzania do Unii przesyłek niektórych
    zwierząt, materiału biologicznego i produktów pochodzenia zwierzęcego oraz przemieszczania
    ich i postępowania z nimi po ich wprowadzeniu
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2020/692 da Comissão, de 30 de janeiro de 2020,
    que complementa o Regulamento (UE) 2016/429 do Parlamento Europeu e do Conselho
    no que diz respeito às regras aplicáveis à entrada na União, e à circulação e
    ao manuseamento após a entrada, de remessas de determinados animais, produtos
    germinais e produtos de origem animal
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/692 al Comisiei din 30 ianuarie 2020 de
    completare a Regulamentului (UE) 2016/429 al Parlamentului European și al Consiliului
    în ceea ce privește normele privind intrarea în Uniune, precum și circulația și
    manipularea după intrare, a transporturilor de anumite animale, de materiale germinative
    și de produse de origine animală
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/692 z 30. januára 2020, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2016/429, pokiaľ ide o
    pravidlá týkajúce sa vstupu zásielok určitých zvierat, zárodočných produktov a
    produktov živočíšneho pôvodu do Únie a ich premiestňovania a zaobchádzania s nimi
    po ich vstupe do Únie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/692 z dne 30. januarja 2020 o dopolnitvi
