title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/692 of 30 January 2020 supplementing
    Regulation (EU) 2016/429 of the European Parliament and of the Council as regards
    rules for entry into the Union, and the movement and handling after entry of consignments
    of certain animals, germinal products and products of animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/692 de la Commission du 30 janvier 2020 complétant
    le règlement (UE) 2016/429 du Parlement européen et du Conseil en ce qui concerne
    les règles applicables à l’entrée dans l’Union d’envois de certains animaux, produits
    germinaux et produits d’origine animale, ainsi qu’aux mouvements et à la manipulation
    de ces envois après leur entrée dans l’Union
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/692 der Kommission vom 30. Januar 2020
    zur Ergänzung der Verordnung (EU) 2016/429 des Europäischen Parlaments und des
    Rates hinsichtlich Vorschriften für den Eingang von Sendungen von bestimmten Tieren,
    bestimmtem Zuchtmaterial und bestimmten Erzeugnissen tierischen Ursprungs in die
    Union und für deren anschließende Verbringung und Handhabung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2020/692 на Комисията от 30 януари 2020 година
    за допълнение на Регламент (ЕС) 2016/429 на Европейския парламент и на Съвета
    по отношение на правилата за въвеждането в Съюза на пратки с някои животни, зародишни
    продукти и продукти от животински произход и за движението им и боравенето с тях
    след въвеждане
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2020/692 ze dne 30. ledna 2020,
