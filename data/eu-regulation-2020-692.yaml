    per quanto riguarda le norme per l’ingresso nell’Unione, e per i movimenti e la
    manipolazione dopo l’ingresso, di partite di determinati animali, materiale germinale
    e prodotti di origine animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2020/692 (2020. gada 30. janvāris), ar ko
