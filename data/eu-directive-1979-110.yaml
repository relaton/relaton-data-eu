title:
- language: en
  script: Latn
  content: Council Directive 79/110/EEC of 24 January 1979 authorizing the Italian
    Republic to postpone the notification and implementation of its national plans
    for the accelerated eradication of brucellosis and tuberculosis in cattle
  type: main
- language: fr
  script: Latn
  content: Directive 79/110/CEE du Conseil, du 24 janvier 1979, autorisant la République
    italienne à reporter la communication et la mise en oeuvre de ses plans nationaux
    d'éradication accélérée de la brucellose et de la tuberculose des bovins
  type: main
- language: de
  script: Latn
  content: Richtlinie 79/110/EWG des Rates vom 24. Januar 1979 zur Ermächtigung der
    Italienischen Republik, die Vorlage und die Durchführung ihrer nationalen Pläne
    zur beschleunigten Tilgung von Brucellose und Tuberkulose der Rinder aufzuschieben
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 79/110/EØF af 24. januar 1979 om bemyndigelse til Den
    italienske Republik til at udsætte fremsendelsen og iværksættelsen af dens
    nationale planer for fremskyndet udryddelse af brucellose og tuberkulose hos kvæg
  type: main
- language: el
  script: Grek
  content: Οδηγία 79/110/EOK του Συμβουλίου της 24ης Ιανουαρίου
    1979 περί εξουσιοδοτήσεως της Ιταλικής Δημοκρατίας
    να ανακοινώσει και να θέσει σ' εφαρμογή τα εθνικά
    της σχέδια για την επιτάχυνση της εξαλείψεως
    της βρουκελλώσεως και της φυματιώσεως των
    βοοειδών
  type: main
- language: it
  script: Latn
  content: Direttiva 79/110/CEE del Consiglio, del 24 gennaio 1979, che autorizza
    la Repubblica italiana a rinviare la comunicazione e l'attuazione dei piani nazionali
    di eradicazione accelerata della brucellosi e della tubercolosi dei bovini
  type: main
- language: nl
  script: Latn
  content: Richtlijn 79/110/EEG van de Raad van 24 januari 1979 houdende machtiging
    van de Italiaanse Republiek om de kennisgeving en de tenuitvoerlegging van de
    nationale programma's voor de versnelde uitroeiing van brucellose en tuberculose
    bij runderen uit te stellen
  type: main
- language: es
  script: Latn
  content: Directiva 79/110/CEE del Consejo, de 24 de enero de 1979, por la que se
    autoriza a la República Italiana a aplazar la comunicación y la ejecución de
    sus planes nacionales de erradicación acelerada de la brucelosis y de la tuberculosis
    del ganado bovino
  type: main
