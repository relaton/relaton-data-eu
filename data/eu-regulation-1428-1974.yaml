  content: Regulation (EEC) No 1428/74 of the Council of 4 June 1974 amending, in
    respect of tomatoes, Regulation (EEC) No 228/73 laying down general rules for
    the system of compensatory amounts for fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1428/74 du Conseil, du 4 juin 1974, modifiant, en
    ce qui concerne les tomates, le règlement (CEE) n° 228/73 déterminant les règles
    générales du régime des montants compensatoires dans le secteur des fruits
    et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1428/74 des Rates vom 4. Juni 1974 zur Änderung der
    Verordnung (EWG) Nr. 228/73 über die Festlegung allgemeiner Vorschriften für
    die Regelung der Ausgleichsbeträge im Sektor Obst und Gemüse in bezug auf Tomaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1428/74 af 4. juni 1974 om ændring for så
