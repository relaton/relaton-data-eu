    den Wiederverkauf auf dem Binnenmarkt auf 795 911 Tonnen Getreide aus Beständen
    der spanischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2786/94 af 16. november 1994 om ændring
