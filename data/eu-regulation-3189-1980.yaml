id: EURegulation31891980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3189/80 of 9 December 1980 re-establishing
    the levying of the customs duties on choline chloride, falling within subheading
    29.24 ex B and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3189/80 de la Commission, du 9 décembre 1980, portant
    rétablissement de la perception des droits de douane applicables au chlorure
    de choline, de la sous-position 29.24 ex B du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3189/80 der Kommission vom 9. Dezember 1980 zur Wiedereinführung
    des Zollsatzes für Cholinchlorid der Tarifstelle 29.24 ex B mit Ursprung in Rumänien,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionenes forordning (EØF) nr. 3189/80 af 9. december 1980 om genindførelse
    af opkrævning af toldafgifter for cholinchlorid under pos. 29.24 ex B, som har
    oprindelse i Rumænien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3189/80 della Commissione, del 9 dicembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili al cloruro di colina,
    della sottovoce 29.24 ex B della tariffa doganale comune, originario della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3189/80 van de Commissie van 9 december 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op cholinechloride,
    van post 29.24 ex B, van oorsprong uit Roemenië ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
