title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1939 of 9 November 2021 on the position to be
    taken on behalf of the European Union within the Trade Committee established by
    the Trade Agreement between the European Union and its Member States, of the one
    part, and Colombia, Peru, and Ecuador, of the other part, as regards modifications
    to Appendices 2, 2A and 5 to Annex II to that Agreement
  type: main
- language: fr
  script: Latn
