    à prendre au nom de l’Union européenne au sein du comité «Commerce» institué
    par l’accord commercial entre l’Union européenne et ses États membres, d’une
    part, et la Colombie, le Pérou et l’Équateur, d’autre part, en ce qui concerne
    des modifications des appendices 2, 2A et 5 de l’annexe II dudit accord
  type: main
- language: de
