  script: Latn
  content: '81/981/EEC: Commission Decision of 12 October 1981 amending the import
    arrangements laid down in Commission Decision 81/248/EEC as applied in Italy in
    respect of imports of fibre building board from the Soviet Union (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/981/CEE: Décision de la Commission, du 12 octobre 1981, modifiant
    le régime d''importation prévu par la décision 81/248/CEE de la Commission
    appliqué en Italie à l''égard de l''Union soviétique en ce qui concerne les
    panneaux de fibres de bois (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/981/EWG: Entscheidung der Kommission vom 12. Oktober 1981 zur Änderung
    der mit der Entscheidung 81/248/EWG der Kommission festgelegten und in Italien
    gegenüber der UdSSR für Platten aus Holzfasern angewandten Einfuhrregelung (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/981/EØF: Kommissionens beslutning af 12. oktober 1981 om ændring
