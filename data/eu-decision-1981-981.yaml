    πού προβλέπεται από τήν απόφαση 81/248/EOK τής Επιτροπής
    καί εφαρμόζεται στήν Ιταλία έναντι τής ΕΣΣΔ
    όσον αφορά τίς πλάκες—διαφράγματα από ίνες
    ξύλου (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
