    της εισφοράς που εφαρμόζεται για τα πίτυρα
    καταγωγής Αλγερίας, Μαρόκου και Τυνησίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 21/83 della Commissione, del 5 gennaio 1983, che fissa
