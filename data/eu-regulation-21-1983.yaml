title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 21/83 of 5 January 1983 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 21/83 de la Commission, du 5 janvier 1983, fixant le
    montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 21/83 der Kommission vom 5. Januar 1983 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 21/83 af 5. januar 1983 om fastsættelse
    af det beløb, hvormed det variable element af importafgiften for klid med oprindelse
    i Algeriet, Marokko og Tunesien skal nedsættes
  type: main
- language: el
  script: Grek
