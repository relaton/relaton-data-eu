  content: Commission Regulation (EEC) No 2054/77 of 14 September 1977 discontinuing
    the granting of private storage aid in respect of pigmeat and permitting the extension
    of storage contracts in respect of certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2054/77 de la Commission, du 14 septembre 1977, mettant
    fin à l'octroi d'aides au stockage privé et permettant la prolongation de la
    durée des contrats pour certains produits stockés dans le secteur de la viande
    de porc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2054/77 der Kommission vom 14. September 1977 zur
    Einstellung der Gewährung von Beihilfen für die private Lagerhaltung und zur
    Ermöglichung der Verlängerung der Vertragsdauer für bestimmte eingelagerte
    Erzeugnisse auf dem Schweinefleischsektor
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2054/77 af 14. september 1977 om ophør
