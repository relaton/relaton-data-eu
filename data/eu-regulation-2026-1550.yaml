  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1550 of 2 July 2026 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, Chile and the United States in the lists of third countries, territories,
    or zones thereof authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry, and of fresh meat of poultry and game birds
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1550 de la Commission du 2 juillet
    2026 modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Canada, au Chili et aux États-Unis
    dans les listes des pays tiers, territoires et zones de pays tiers ou territoires
    en provenance desquels l’entrée dans l’Union d’envois de volailles et de
    produits germinaux de volailles ainsi que de viandes fraîches de volailles et
    de gibier à plumes est autorisée
  type: main
