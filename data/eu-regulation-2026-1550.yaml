    Listen der Drittländer, Gebiete oder Zonen derselben, aus denen der Eingang von
    Sendungen von Geflügel und Zuchtmaterial von Geflügel sowie frischem Fleisch
    von Geflügel und Federwild in die Union zulässig ist
  type: main
