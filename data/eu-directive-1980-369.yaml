id: EUDirective1980369
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 80/369/EEC of 26 March 1980 authorizing the French Republic
    not to apply in the French overseas departments Directives 72/464/EEC and 79/32/EEC
    on taxes other than turnover taxes which affect the consumption of manufactured
    tobacco
  type: main
- language: fr
  script: Latn
  content: Directive 80/369/CEE du Conseil, du 26 mars 1980, autorisant la République
    française à ne pas appliquer dans les départements français d'outre-mer les
    directives 72/464/CEE et 79/32/CEE concernant les impôts autres que les taxes
    sur le chiffre d'affaires frappant la consommation des tabacs manufacturés
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/369/EWG des Rates vom 26. März 1980 zur Ermächtigung der
    Französischen Republik, die Bestimmungen der Richtlinien 72/464/EWG und 79/32/EWG
    über die anderen Verbrauchsteuern auf Tabakwaren als die Umsatzsteuer in den
    französischen überseeischen Departements nicht anzuwenden
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/369/EØF af 26. marts 1980 om bemyndigelse af Den franske
    Republik til i de oversøiske departementer at undlade at anvende direktiv 72/464/EØF
    og 79/32/EØF om forbrugsbeskatning af forarbejdet tobak fra omsætningsafgift
  type: main
- language: el
  script: Grek
  content: Οδηγία 80/369/ΕΟΚ του Συμβουλίου της 26ης Μαρτίου
    1980 περί εξουσιοδοτήσεως της Γαλλικής Δημοκρατίας
    να μην εφαρμόζει στα γαλλικά υπερπόντια εδάφη
    τις οδηγίες 72/464/ΕΟΚ και 79/32/ΕΟΚ περί των φόρων,
    εκτός των φόρων κύκλου εργασιών, οι οποίοι
    βαρύνουν την κατανάλωση κατεργασμένων καπνών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 80/369/ETY, annettu 26 päivänä maaliskuuta 1980,
    Ranskan tasavallan oikeudesta olla soveltamatta Ranskan merentakaisiin departementteihin
    muita valmistetun tupakan kulutukseen kohdistuvia veroja kuin liikevaihtoveroja
    koskevia direktiivejä 72/464/ETY ja 79/32/ETY
  type: main
- language: it
  script: Latn
  content: Direttiva 80/369/CEE del Consiglio, del 26 marzo 1980, che autorizza la
    Repubblica francese a non applicare nei dipartimenti francesi d'oltremare le direttive
    72/464/CEE e 79/32/CEE relative alle imposte diverse dall'imposta sulla cifra
    d'affari che gravano sul consumo dei tabacchi lavorati
  type: main
- language: nl
  script: Latn
  content: Richtlijn 80/369/EEG van de Raad van 26 maart 1980 waarbij de Franse Republiek
    wordt gemachtigd Richtlijn 72/464/EEG en Richtlijn 79/32/EEG betreffende de belasting,
    andere dan omzetbelasting, op het verbruik van tabaksfabrikaten, niet in de Franse
    overzeese departementen toe te passen
  type: main
- language: pt
  script: Latn
  content: Directiva 80/369/CEE do Conselho, de 26 de Março de 1980, que autoriza
    a República Francesa a não aplicar, nos departamentos franceses ultramarinos,
    as Directivas 72/464/CEE e 79/32/CEE relativas aos impostos que incidem sobre
    o consumo de tabacos manufacturados com excepção dos impostos sobre o volume
    de negócios
  type: main
- language: es
  script: Latn
  content: Directiva 80/369/CEE del Consejo, de 26 de marzo de 1980, por la que se
    autoriza a la República Francesa a no aplicar en los departamentos franceses
    de Ultramar las Directivas 72/464/CEE y 79/32/CEE relativas a los impuestos distintos
    de los impuestos sobre el volumen de negocios que gravan el consumo de labores
    del tabaco
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 80/369/EEG av den 26 mars 1980 om tillstånd för Frankrike
    att i de franska utomeuropeiska departementen underlåta att tillämpa direktiv
    72/464/EEG och 79/32/EEG om andra skatter än omsättningsskatter som påverkar
    förbrukningen av tobaksvaror
  type: main
