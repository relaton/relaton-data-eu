title:
- language: en
  script: Latn
  content: '79/998/EEC: Commission Decision of 12 November 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1978 in connection with Community measures for the eradication of brucellosis,
    tuberculosis and leucosis in cattle (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/998/CEE: Décision de la Commission, du 12 novembre 1979, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des dépenses effectuées pendant
    l''année 1978 dans le cadre d''une action de la Communauté en vue de l''éradication
    de la brucellose, de la tuberculose et de la leucose des bovins (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/998/EWG: Entscheidung der Kommission vom 12. November 1979 über die
    Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an das Vereinigte Königreich (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/998/EØF: Kommissionens beslutning af 12. november 1979 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af udgifter afholdt
    i 1978 i forbindelse med en fællesskabsaktion med henblik på udryddelse af brucellose,
    tuberkulose og leukose hos kvæg (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/998/CEE: Decisione della Commissione, del 12 novembre 1979, relativa
