    de introducere a unui sistem de înregistrare contabilă a cheltuielilor aferente
    infrastructurilor de transport feroviar, rutier și pe căi navigabile interioare
    și de abrogare a Regulamentului (CE) nr. 851/2006 al Comisiei de precizare a
    posturilor care se vor înscrie la diferite poziții din situația contabilă,
    prezentate în anexa I la Regulamentul (CEE) nr. 1108/70 al Consiliului
