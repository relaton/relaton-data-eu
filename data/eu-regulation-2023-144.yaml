  script: Latn
  content: Regulation (EU) 2023/144 of the European Parliament and of the Council
    of 18 January 2023 repealing Regulation (EEC) No 1108/70 of the Council introducing
    an accounting system for expenditure on infrastructure in respect of transport
    by rail, road and inland waterway, and repealing Commission Regulation (EC) No
    851/2006 specifying the items to be included under the various headings in the
    forms of accounts shown in Annex I to Council Regulation (EEC) No 1108/70
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2023/144 du Parlement européen et du Conseil du 18 janvier
    2023 abrogeant le règlement (CEE) no 1108/70 du Conseil instaurant une comptabilité
    des dépenses afférentes aux infrastructures de transports par chemin de fer,
    par route et par voie navigable et abrogeant le règlement (CE) no 851/2006 de
    la Commission relatif à la fixation du contenu des différentes positions des
    schémas de comptabilisation de l’annexe I du règlement (CEE) no 1108/70 du
