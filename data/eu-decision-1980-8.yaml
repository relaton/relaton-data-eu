id: EUDecision19808
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 December 1979 authorizing the French Republic
    not to apply Community treatment to men's and boys'garments, including collars,
    shirt fronts and cuffs; men's and boys'shirts, woven, of wool, of cotton or of
    man-made textile fibres, falling within heading No ex 61.03 of the Common Customs
    Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating in the People's
    Republic of China and in free circulation in the other Member States (Only the
    French text is authentic)
  type: main
- language: fr
  script: Latn
  content: 'Décision de la Commission, du 3 décembre 1979, autorisant la République
    française à exclure du traitement communautaire les vêtements de dessous (linge
    de corps) pour hommes et garçonnets, y compris les cols, faux-cols, plastrons
    et manchettes; chemises et chemisettes tissées, pour hommes et garçonnets, de
    laine, de coton ou de fibres textiles synthétiques ou artificielles, de la position
    ex 61.03 du tarif douanier commun (codes Nimexe: 61.03-11, 15, 19) (catégorie
    8), originaires de la République populaire de Chine et mises en libre pratique
    dans les autres États membres (Le texte en langue française est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 3. Dezember 1979, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Unterkleidung (Leibwäsche) für
    Männer und Knaben auch Kragen, Vorhemden und Manschetten : Oberhemden, auch Sport-
    und Arbeitshemden, aus Geweben, für Männer und Knaben, aus Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen, der Tarifnummer ex 61.03 des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.03-11, 15, 19) (Kategorie 8) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 3. december 1979 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    til mænd og drenge (herunder flipper, skjortebryster og manchetter) : vævede
    skjorter (herunder sports- og arbejdsskjorter) til mænd og drenge, af uld, bomuld
    eller syntetiske eller regenererede fibre, som henhører under pos. ex 61.03 i
    den fællestoldtarif (NIMEXE-nummer 61.03-11, 15, 19; kategori 8), har oprindelse
    i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 3 dicembre 1979, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario sottovesti (biancheria da dosso)
    per uomo e per ragazzo, compresi i colli, colletti, sparati e polsini (camicie
    e camicette, tessute, per uomo e per ragazzo, di lana, di cotone o di fibre tessili
    sintetiche o artificiali), della voce ex 61.03 della tariffa doganale comune (codici
    Nimexe : 61.03-11, 15, 19), categoria 8, originari della Repubblica popolare cinese
    e messi in libera pratica negli altri Stati membri (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 3 december 1979 waarbij de Franse Republiek
    wordt gemachtigd herenonderkleding en jongensonderkleding, kragen, boorden, fronten
    en manchetten daaronder begrepen : overhemden en sporthemden, geweven van wol
    of katoen of van synthetische of van kunstmatige textielvezels, van post ex 61.03
    van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19) (categorie
    8), van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
  type: main
