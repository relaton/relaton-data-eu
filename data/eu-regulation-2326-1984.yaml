title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2326/84 of 9 August 1984 re-establishing
    the levying of customs duties on dodecylbenzene, falling within subheading 38.19
    E I and originating in Brazil, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2326/84 de la Commission du 9 août 1984 portant rétablissement
    de la perception des droits de douane applicables au dodécylbenzène, de la sous-position
    38.19 E I du tarif douanier commun, originaire du Brésil, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2326/84 der Kommission vom 9. August 1984 zur Wiedereinführung
