    in Brasilien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2326/84 af 9. august 1984 om genindførelse
    af opkrævning af told for dodecylbenzen, henhørende under pos. 38.19 E I og
    med oprindelse i Brasilien, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3569/83
  type: main
