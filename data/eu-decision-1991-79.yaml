  content: '91/79/EEC: Commission Decision of 4 February 1991 approving measures to
    set up pilot projects for the control of rabies with a view to its eradication
    or prevention, presented by the Federal Republic of Germany (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/79/CEE: Décision de la Commission, du 4 février 1991, approuvant
    des actions visant à l''établissement de projets pilotes destinés à lutter
    contre la rage en vue de son éradication ou de sa prévention présentés par
    la République fédérale d''Allemagne (Le texte en langue allemande est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
