    (ES) 2018/1862 attiecībā uz minimālajiem datu kvalitātes standartiem un tehniskajām
    specifikācijām fotogrāfiju, DNS profilu un daktiloskopisko datu ievadīšanai
    Šengenas Informācijas sistēmā (SIS) policijas sadarbības un tiesu iestāžu
    sadarbības krimināllietās jomā, un ar ko atceļ Komisijas Īstenošanas lēmumu
    (ES) 2016/1345 (izziņots ar dokumenta numuru C(2020) 9228)
  type: main
