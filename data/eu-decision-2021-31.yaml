  script: Latn
  content: Decisión de Ejecución (UE) 2021/31 de la Comisión de 13 de enero de
    2021 por la que se establecen disposiciones de aplicación del Reglamento (UE)
    2018/1862 del Parlamento Europeo y del Consejo en lo relativo a las normas mínimas
    de calidad de los datos y las especificaciones técnicas para la introducción
    de fotografías, perfiles de ADN y datos dactiloscópicos en el Sistema de Información
    de Schengen (SIS) en el ámbito de la cooperación policial y judicial en materia
    penal y por la que se deroga la Decisión de Ejecución (UE) 2016/1345 de la Comisión
    [notificada con el número C(2020) 9228]
  type: main
