  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/31 van de Commissie van 13 januari 2021 tot
    vaststelling van uitvoeringsbepalingen voor Verordening (EU) 2018/1862 van het
    Europees Parlement en de Raad inzake de minimumnormen voor gegevenskwaliteit en
    de technische specificaties voor het invoeren van foto’s, DNA-profielen en dactyloscopische
    gegevens in het Schengeninformatiesysteem (SIS) op het gebied van politiële en
    justitiële samenwerking in strafzaken, en tot intrekking van Uitvoeringsbesluit
    (EU) 2016/1345 van de Commissie (Kennisgeving geschied onder nummer C(2020) 9228)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/31 z dnia 13 stycznia 2021 r. w sprawie
    ustanowienia zasad stosowania rozporządzenia Parlamentu Europejskiego i Rady
    (UE) 2018/1862 w odniesieniu do minimalnych norm jakości danych i specyfikacji
    technicznych dotyczących wprowadzania fotografii, profili DNA i danych daktyloskopijnych
    do Systemu Informacyjnego Schengen (SIS) w dziedzinie współpracy policyjnej
    i współpracy wymiarów sprawiedliwości w sprawach karnych oraz uchylająca
    decyzję wykonawczą Komisji (UE) 2016/1345 (notyfikowana jako dokument nr C(2020)
    9228)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/31 da Comissão de 13 de janeiro de 2021
    que estabelece normas de execução do Regulamento (UE) 2018/1862 do Parlamento
    Europeu e do Conselho no que diz respeito às normas mínimas de qualidade dos
    dados e às especificações técnicas para a introdução de fotografias, perfis
    de ADN e dados dactiloscópicos no Sistema de Informação de Schengen (SIS) no
    domínio da cooperação policial e da cooperação judiciária em matéria penal,
    e que revoga a Decisão de Execução (UE) 2016/1345 da Comissão [notificada
    com o número C(2020) 9228]
  type: main
- language: ro
  script: Latn
