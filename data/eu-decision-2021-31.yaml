id: EUDecision202131
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/31 of 13 January 2021 on laying
    down rules for the application of Regulation (EU) 2018/1862 of the European Parliament
    and of the Council as regards the minimum data quality standards and technical
    specifications for entering photographs, DNA profiles and dactyloscopic data in
    the Schengen Information System (SIS) in the field of police cooperation and judicial
    cooperation in criminal matters and repealing Commission Implementing Decision
    (EU) 2016/1345 (notified under document C(2020) 9228)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/31 de la Commission du 13 janvier 2021
    portant modalités d’application du règlement (UE) 2018/1862 du Parlement européen
    et du Conseil en ce qui concerne les normes minimales en matière de qualité
    des données et les spécifications techniques pour l’introduction de photographies,
    de profils ADN et de données dactyloscopiques dans le système d’information
    Schengen (SIS) dans le domaine de la coopération policière et de la coopération
    judiciaire en matière pénale, et abrogeant la décision d’exécution (UE)
    2016/1345 de la Commission [notifiée sous le numéro C(2020) 9228]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/31 der Kommission vom 13. Januar 2021
    zur Festlegung der Vorschriften für die Anwendung der Verordnung (EU) 2018/1862
    des Europäischen Parlaments und des Rates hinsichtlich der Mindestqualitätsstandards
    für Daten und der technischen Spezifikationen für die Eingabe von Lichtbildern,
    DNA-Profilen und daktyloskopischen Daten in das Schengener Informationssystem
    (SIS) im Bereich der polizeilichen Zusammenarbeit und der justiziellen Zusammenarbeit
    in Strafsachen und zur Aufhebung des Durchführungsbeschlusses (EU) 2016/1345
    der Kommission (Bekannt gegeben unter Aktenzeichen C(2020)9228)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/31 на Комисията
    от 13 януари 2021 година за определяне на правила
    за прилагането на Регламент (ЕС) 2018/1862 на Европейския
    парламент и на Съвета по отношение на минималните
    стандарти за качество на данните и техническите
    спецификации за въвеждане на снимки, ДНК профили
    и дактилоскопични данни в Шенгенската информационна
    система (ШИС) в областта на полицейското сътрудничество
    и съдебното сътрудничество по наказателноправни
    въпроси и за отмяна на Решение за изпълнение
    (ЕС) 2016/1345 на Комисията (нотифицирано под номер
    С(2020)9228)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/31, ze dne 13. ledna 2021 o stanovení
    prováděcích pravidel k nařízení Evropského parlamentu a Rady (EU) 2018/1862,
    pokud jde o minimální normy kvality údajů a technické specifikace pro vkládání
    fotografií, profilů DNA a daktyloskopických údajů do Schengenského informačního
    systému (SIS) v oblasti policejní spolupráce a justiční spolupráce v trestních
    věcech, a o zrušení prováděcího rozhodnutí Komise (EU) 2016/1345 (oznámeno
    pod číslem C(2020) 9228)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/31 af 13. januar 2021
    om gennemførelsesbestemmelser til Europa-Parlamentets og Rådets forordning (EU)
    2018/1862 for så vidt angår minimumsstandarder for datakvalitet og tekniske
    specifikationer for indlæsning af fotografier, DNA-profiler og fingeraftryksoplysninger
