  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/31, annettu 13 päivänä
    tammikuuta 2021, Euroopan parlamentin ja neuvoston asetuksen (EU) 2018/1862 soveltamissäännöistä
    sellaisten tietoja koskevien vähimmäislaatuvaatimusten ja teknisten eritelmien
    osalta, joita sovelletaan valokuvien, DNA-tunnisteiden ja sormenjälkitietojen
    tallentamisessa Schengenin tietojärjestelmään (SIS) poliisiyhteistyön ja rikosoikeudellisen
    yhteistyön alalla, sekä komission täytäntöönpanopäätöksen (EU) 2016/1345
    kumoamisesta (tiedoksiannettu numerolla C(2020) 9228)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/31 оd 13. siječnja 2021. o utvrđivanju
    pravila o primjeni Uredbe (EU) 2018/1862 Europskog parlamenta i Vijeća u pogledu
    minimalnih standarda kvalitete podataka i tehničkih specifikacija za unos fotografija,
    profila DNK-a i daktiloskopskih podataka u Schengenski informacijski sustav (SIS)
    u području policijske suradnje i pravosudne suradnje u kaznenim stvarima te o
