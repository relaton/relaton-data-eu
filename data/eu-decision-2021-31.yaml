  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/31 tat-13
    ta’ Jannar 2021 dwar l-istabbiliment ta’ regoli għall-applikazzjoni tar-Regolament
    (UE) 2018/1862 tal-Parlament Ewropew u tal-Kunsill fir-rigward tal-istandards
