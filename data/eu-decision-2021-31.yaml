    European și al Consiliului în ceea ce privește standardele minime de calitate
    a datelor și specificațiile tehnice pentru introducerea fotografiilor, a profilurilor
    ADN și a datelor dactiloscopice în Sistemul de informații Schengen (SIS) în
    domeniul cooperării polițienești și al cooperării judiciare în materie penală
    și de abrogare a Deciziei de punere în aplicare (UE) 2016/1345 a Comisiei [notificată
    cu numărul C(2020) 9228]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/31 z 13. januára 2021, ktorým
    sa stanovujú pravidlá uplatňovania nariadenia Európskeho parlamentu a Rady
    (EÚ) 2018/1862, pokiaľ ide o minimálne normy pre kvalitu údajov a technické
    špecifikácie pre vkladanie fotografií, profilov DNA a daktyloskopických údajov
    do Schengenského informačného systému (SIS) v oblasti policajnej spolupráce
    a justičnej spolupráce v trestných veciach, a ktorým sa zrušuje vykonávacie
    rozhodnutie Komisie (EÚ) 2016/1345 [oznámené pod číslom C(2020) 9228]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/31 z dne 13. januarja 2021 o določitvi
    pravil za uporabo Uredbe (EU) 2018/1862 Evropskega parlamenta in Sveta glede minimalnih
    standardov kakovosti podatkov in tehničnih specifikacij za vnos fotografij, profilov
    DNK in daktiloskopskih podatkov v schengenski informacijski sistem (SIS) na področju
    policijskega in pravosodnega sodelovanja v kazenskih zadevah ter o razveljavitvi
