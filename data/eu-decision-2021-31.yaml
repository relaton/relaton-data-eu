    brojem dokumenta C(2020) 9228)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/31 végrehajtási határozata (2021. január 13.)
    a rendőrségi együttműködés és a büntetőügyekben folytatott igazságügyi
    együttműködés terén a fényképek, DNS-profilok és daktiloszkópiai adatok
    Schengeni Információs Rendszerbe (SIS) történő bevitelére vonatkozó adatminőségi
    minimum-előírások és műszaki előírások tekintetében az (EU) 2018/1862
    európai parlamenti és tanácsi rendelet alkalmazási szabályainak megállapításáról,
    valamint az (EU) 2016/1345 bizottsági végrehajtási határozat hatályon kívül
    helyezéséről (az értesítés a C(2020) 9228. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/31 della Commissione del 13 gennaio 2021
    che stabilisce le disposizioni di applicazione del regolamento (UE) 2018/1862
    del Parlamento europeo e del Consiglio per quanto riguarda le norme minime di
    qualità dei dati e le specifiche tecniche per l’inserimento di fotografie,
    profili DNA e dati dattiloscopici nel sistema d’informazione Schengen (SIS)
    nel settore della cooperazione di polizia e della cooperazione giudiziaria in
    materia penale e che abroga la decisione di esecuzione (UE) 2016/1345 della Commissione
    [notificata con il numero C(2020) 9228]
  type: main
- language: lv
  script: Latn
