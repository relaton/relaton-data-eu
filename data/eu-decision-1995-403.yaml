title:
- language: en
  script: Latn
  content: '95/403/CFSP: Council Decision of 25 September 1995 supplementing Decision
    94/276/CFSP on a joint action adopted by the Council on the basis of Article J.3
    of the Treaty on European Union, in support of the Middle East peace process,
    concerning the observation of elections to the Palestinian Council and the coordination
    of the international operation for observing the elections'
  type: main
- language: fr
  script: Latn
  content: '95/403/PESC: Décision du Conseil, du 25 septembre 1995, complétant la
