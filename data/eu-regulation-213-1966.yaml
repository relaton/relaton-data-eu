  content: Règlement n 213/66/CEE de la Commission du 20 décembre 1966, modifiant
    le règlement n 70 en vue de fixer des coefficients d'équivalence entre le blé
    dur grec ainsi que le sorgho mexicain offerts sur le marché mondial et le standard
    de qualité fixé pour le prix de seuil
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 213/66/EWG der Kommission vom 20. Dezember 1966 zur Änderung
    der Verordnung Nr. 70 betreffend die Festsetzung von Ausgleichskoeffizienten zwischen
    auf dem Weltmarkt angebotenem griechischem Hartweizen sowie mexikanischem Sorghum
    und der für den Schwellenpreis maDgebenden Standardqualität
  type: main
- language: it
  script: Latn
  content: Regolamento n. 213/66/CEE della Commissione, del 20 dicembre 1966, che
    modifica il regolamento n. 70 per la fissazione di un coefficiente di equivalenza
    tra il grano duro greco come pure il sorgo messicano offerti sul mercato mondiale
    e la qualità tipo per la quale è fissato il prezzo d'entrata
  type: main
- language: nl
  script: Latn
  content: Verordening no. 213/66/EEG van de Commissie van 20 december 1966 houdende
    wijziging van Verordening no. 70, met het oog op het vaststellen van gelijkwaardigheidscoëfficiënten
    voor de aanpassing tussen de op de wereldmarkt aangeboden Griekse harde tarwe
    en Mexicaanse sorghum en de standaardkwaliteit waarvoor de drempelprijs is bepaald
  type: main
