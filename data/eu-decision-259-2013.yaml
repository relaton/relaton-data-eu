title:
- language: en
  script: Latn
  content: Decision No 259/2013/EU of the European Parliament and of the Council of
    13 March 2013 amending Decision No 574/2007/EC with a view to increasing the co-financing
    rate of the External Borders Fund for certain Member States experiencing or threatened
    with serious difficulties with respect to their financial stability
  type: main
- language: fr
  script: Latn
  content: Décision n ° 259/2013/UE du Parlement européen et du Conseil du 13 mars
    2013 modifiant la décision n ° 574/2007/CE en vue d'augmenter le taux de cofinancement
    du Fonds pour les frontières extérieures pour certains États membres qui connaissent
    ou risquent de connaître de graves difficultés quant à leur stabilité financière
  type: main
- language: de
  script: Latn
  content: Beschluss Nr. 259/2013/EU des Europäischen Parlaments und des Rates vom
    13. März 2013 zur Änderung der Entscheidung Nr. 574/2007/EG im Hinblick auf
    die Anhebung des Kofinanzierungssatzes des Außengrenzenfonds für bestimmte,
    hinsichtlich ihrer Finanzstabilität von gravierenden Schwierigkeiten betroffene
    oder bedrohte Mitgliedstaaten
  type: main
- language: bg
  script: Cyrl
  content: Решение № 259/2013/ЕС на Европейския парламент
    и на Съвета от 13 март 2013 година за изменение
    на Решение № 574/2007/ЕО с цел увеличаване на процента
    на съфинансиране по Фонда за външните граници
    за някои държави членки, които изпитват или
    са застрашени от сериозни затруднения във
    връзка с финансовата си стабилност
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 259/2013/EU ze dne 13. března
    2013 , kterým se mění rozhodnutí č. 574/2007/ES s cílem zvýšit míru spolufinancování
    ze strany Fondu pro vnější hranice pro některé členské státy, jejichž
    finanční stabilita je postižena či ohrožena závažnými obtížemi
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets afgørelse nr. 259/2013/EU af 13. marts
    2013 om ændring af beslutning nr. 574/2007/EF med henblik på at forhøje medfinansieringssatsen
    for Fonden for De Ydre Grænser for visse medlemsstater, som er i eller trues
    af alvorlige vanskeligheder, hvad angår deres finansielle stabilitet
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 259/2013/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 13ης Μαρτίου 2013 , για
    την τροποποίηση της απόφασης αριθ. 574/2007/ΕΚ,
    με στόχο την αύξηση του ποσοστού συγχρηματοδότησης
    του Ταμείου Εξωτερικών Συνόρων για ορισμένα
    κράτη μέλη τα οποία αντιμετωπίζουν ή απειλούνται
    από σοβαρές δυσκολίες σε σχέση με τη χρηματοοικονομική
    τους σταθερότητα
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 259/2013/EL, 13. märts 2013 ,
    millega muudetakse otsust nr 574/2007/EÜ, et suurendada Välispiirifondi kaasrahastamise
    määra teatavate liikmesriikide puhul, kes on finantsstabiilsuse säilitamisega
    tõsistes raskustes või kellel on oht sattuda sellistesse raskustesse
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 259/2013/EU, annettu 13
    päivänä maaliskuuta 2013 , päätöksen N:o 574/2007/EY muuttamisesta ulkorajarahaston
    yhteisrahoitusosuuden korottamiseksi tiettyjen rahoitusvakautensa osalta vakavissa
    vaikeuksissa olevien tai vakavien vaikeuksien uhasta kärsivien jäsenvaltioiden
    osalta
  type: main
- language: hr
  script: Latn
  content: Odluka br. 259/2013/EU Europskog parlamenta i Vijeća od 13. ožujka 2013.
    o izmjeni Odluke br. 574/2007/EZ s ciljem povećanja stope sufinanciranja Fonda
    za vanjske granice za određene države članice koje imaju ili kojima prijete
    ozbiljne poteškoće u odnosu na njihovu financijsku stabilnost
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 259/2013/EU határozata ( 2013. március
    13. ) a Külső Határok Alap társfinanszírozási arányának növelése érdekében
    az 574/2007/EK határozatnak a pénzügyi stabilitás vonatkozásában súlyos
    nehézségekkel küzdő vagy súlyos nehézségekkel fenyegetett bizonyos tagállamok
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 259/2013/UE del Parlamento europeo e del Consiglio, del 13
    marzo 2013 , che modifica la decisione n. 574/2007/CE al fine di aumentare il
    tasso di cofinanziamento del Fondo per le frontiere esterne per alcuni Stati membri
    che si trovano o rischiano di trovarsi in gravi difficoltà di stabilità finanziaria
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 259/2013/ES ( 2013. gada 13.
    marts ), ar ko groza Lēmumu Nr. 574/2007/EK, lai paaugstinātu Eiropas Ārējo
    robežu fonda līdzfinansējuma likmi konkrētām dalībvalstīm, kuras saskaras
    ar nopietnām grūtībām vai kurām draud šādas grūtības saistībā ar to
    finanšu stabilitāti
  type: main
- language: lt
  script: Latn
  content: 2013 m. kovo 13 d. Europos Parlamento ir Tarybos sprendimas Nr. 259/2013/ES,
    kuriuo iš dalies keičiamas Sprendimas Nr. 574/2007/EB siekiant padidinti bendro
    finansavimo iš Išorės sienų fondo normą tam tikroms valstybėms narėms,
    kurios turi didelių finansinio stabilumo sunkumų arba kurioms gresia tokie sunkumai
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni Nru 259/2013/UE tal-Parlament Ewropew u tal-Kunsill tat- 13
    ta' Marzu 2013 li temenda d-Deċiżjoni Nru 574/2007/KE bil-ħsieb li tiżdied
    ir-rata ta’ kofinanzjament tal-Fond għall-Fruntieri Esterni għal ċerti Stati
    Membri li qed jesperjenzaw jew huma mhedda b’diffikultajiet serji fir-rigward
    tal-istabbiltà finanzjarja tagħhom
  type: main
- language: nl
  script: Latn
  content: Besluit nr. 259/2013/EU van het Europees Parlement en de Raad van 13 maart
    2013 tot wijziging van Beschikking nr. 574/2007/EG om het cofinancieringspercentage
    van het Buitengrenzenfonds te verhogen voor bepaalde lidstaten die ernstige moeilijkheden
    ondervinden of dreigen te ondervinden op het gebied van hun financiële stabiliteit
  type: main
- language: pl
  script: Latn
  content: Decyzja Parlamentu Europejskiego i Rady (UE) nr 259/2013/UE z dnia 13 marca
    2013 r. zmieniająca decyzję nr 574/2007/WE w celu zwiększenia stawki współfinansowania
    w ramach Funduszu Granic Zewnętrznych dla niektórych państw członkowskich
    doświadczających poważnych trudności w zakresie swojej stabilności finansowej
    lub nimi zagrożonych
  type: main
- language: pt
  script: Latn
  content: Decisão n. ° 259/2013/UE do Parlamento Europeu e do Conselho, de 13 de
    março de 2013 , que altera a Decisão n. ° 574/2007/CE a fim de aumentar a taxa
    de cofinanciamento do Fundo para as Fronteiras Externas a favor de certos Estados-Membros
    confrontados ou ameaçados por graves dificuldades de estabilidade financeira
  type: main
- language: ro
  script: Latn
  content: Decizia nr. 259/2013/UE a Parlamentului European și a Consiliului din
    13 martie 2013 de modificare a Deciziei nr. 574/2007/CE în vederea majorării
    ratei de cofinanțare a Fondului pentru frontierele externe în cazul statelor
    membre care se confruntă sau riscă să se confrunte cu dificultăți grave legate
    de stabilitatea lor financiară
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 259/2013/EÚ z 13. marca
    2013 , ktorým sa mení a dopĺňa rozhodnutie č. 574/2007/ES s cieľom zvýšiť
    mieru spolufinancovania uplatňovanú v rámci Fondu pre vonkajšie hranice v
    prípade niektorých členských štátov, ktoré majú vážne ťažkosti v súvislosti
    s ich finančnou stabilitou, alebo ktorým takéto ťažkosti hrozia
  type: main
- language: sl
  script: Latn
  content: Sklep št. 259/2013/EU Evropskega parlamenta in Sveta z dne 13. marca 2013
    o spremembi Odločbe št. 574/2007/ES z namenom povečanja stopnje sofinanciranja
    v okviru Sklada za zunanje meje za nekatere države članice, ki imajo ali jim
    grozijo hude težave v zvezi z njihovo finančno stabilnostjo
  type: main
- language: es
  script: Latn
  content: Decisión n ° 259/2013/UE del Parlamento Europeo y del Consejo, de 13
    de marzo de 2013 , por la que se modifica la Decisión n ° 574/2007/CE a fin
    de incrementar el porcentaje de cofinanciación del Fondo para las Fronteras Exteriores
    en lo que respecta a determinados Estados miembros que sufren o corren el riesgo
    de sufrir graves dificultades en lo relativo a su estabilidad financiera
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 259/2013/EU av den 13 mars 2013
    om ändring av beslut nr 574/2007/EG för att öka medfinansieringssatsen för
    fonden för yttre gränser för vissa medlemsstater som drabbats eller hotas av
    allvarliga svårigheter med avseende på deras finansiella stabilitet
  type: main
