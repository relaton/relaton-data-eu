title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1285/2000 of 19 June 2000 fixing for the
    2000/01 marketing year the minimum price to be paid to producers for Williams
    and Rocha pears and the amount of production aid for Williams and Rocha pears
    in syrup and/or natural fruit juice
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1285/2000 de la Commission du 19 juin 2000 fixant le
    prix minimal à payer aux producteurs pour les poires Williams et Rocha ainsi
    que le montant de l'aide à la production pour ces poires conservées au sirop
    et/ou au jus naturel de fruits, pour la campagne 2000/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1285/2000 der Kommission vom 19. Juni 2000 zur Festsetzung
    des den Erzeugern für Williams- und Rocha-Birnen zu zahlenden Mindestpreises
    und der Produktionsbeihilfe für diese Birnen in Sirup und/oder natürlichem Fruchtsaft
    für das Wirtschaftsjahr 2000/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1285/2000 af 19. juni 2000 om fastsættelse
    for produktionsåret 2000/01 af den minimumspris, der skal betales producenterne
    for williams- og rochapærer, samt produktionsstøtten for disse pærer i sukkeropløsning
    og/eller i naturlig frugtsaft
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1285/2000 της Επιτροπής,
    της 19ης Ιουνίου 2000, για καθορισμό, για την περίοδο
    2000/2001, της ελάχιστης τιμής που καταβάλλεται
    στους παραγωγούς για τα αχλάδια Williams και Rocha,
    και για το ποσό της ενίσχυσης στην παραγωγή
    για αχλάδια Williams και Rocha διατηρημένα σε σιρόπι
    ή/και σε φυσικό χυμό φρούτων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1285/2000, annettu 19 päivänä kesäkuuta 2000,
    tuottajille Williams- ja Rocha-päärynöistä maksettavan vähimmäishinnan sekä
    näiden sokeriliemeen ja/tai omaan mehuunsa säilöttyjen päärynöiden tuotantotuen
    määrän vahvistamisesta markkinointivuodeksi 2000/2001
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1285/2000 della Commissione, del 19 giugno 2000, che
    fissa, per la campagna di commercializzazione 2000/2001, il prezzo minimo da pagare
    ai produttori di pere Williams e Rocha e l'importo dell'aiuto alla produzione
    di tali pere sciroppate e/o conservate nel succo naturale di frutta
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1285/2000 van de Commissie van 19 juni 2000 tot vaststelling,
    voor het verkoopseizoen 2000/2001, van de voor Williams- en Rochaperen aan de
    telers te betalen minimumprijs en van het bedrag van de productiesteun voor peren
    op siroop en/of op natuurlijk vruchtensap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1285/2000 da Comissão, de 19 de Junho de 2000, que
    fixa, para a campanha de comercialização de 2000/01, o preço mínimo a pagar
    aos produtores para as peras Williams e Rocha e o montante da ajuda à produção
    para as peras Williams e Rocha em calda e/ou em sumo natural de frutas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1285/2000 de la Comisión, de 19 de junio de 2000,
