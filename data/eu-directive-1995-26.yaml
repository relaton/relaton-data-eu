title:
- language: en
  script: Latn
  content: European Parliament and Council Directive 95/26/EC of 29 June 1995 amending
    Directives 77/780/EEC and 89/646/EEC in the field of credit institutions, Directives
    73/239/EEC and 92/49/EEC in the field of non- life insurance, Directives 79/267/EEC
    and 92/96/EEC in the field of life assurance, Directive 93/22/EEC in the field
    of investment firms and Directive 85/611/EEC in the field of undertakings for
    collective investment in transferable securities (Ucits), with a view to reinforcing
    prudential supervision
  type: main
- language: fr
  script: Latn
  content: Directive 95/26/CE du Parlement européen et du Conseil, du 29 juin 1995,
    modifiant les directives 77/780/CEE et 89/646/CEE dans le domaine des établissements
    de crédit, les directives 73/239/CEE et 92/49/CEE dans le domaine de l'assurance
    non vie, les directives 79/267/CEE et 92/96/CEE dans le domaine de l'assurance
    vie, la directive 93/22/CEE dans le domaine des entreprises d'investissement et
    la directive 85/611/CEE dans le domaine des organismes de placement collectif
    en valeurs mobilières (OPCVM) afin de renforcer la surveillance prudentielle
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/26/EG des Europäischen Parlaments und des Rates vom 29.
    Juni 1995 zur Änderung der Richtlinien 77/780/EWG und 89/646/EWG betreffend Kreditinstitute,
    der Richtlinien 73/239/EWG und 92/49/EWG betreffend Schadenversicherungen, der
    Richtlinien 79/267/EWG und 92/96/EWG betreffend Lebensversicherungen, der Richtlinie
    93/22/EWG betreffend Wertpapierfirmen sowie der Richtlinie 85/611/EWG betreffend
    bestimmte Organismen für gemeinsame Anlagen in Wertpapieren (OGAW) zwecks verstärkter
    Beaufsichtigung dieser Finanzunternehmen
  type: main
- language: bg
  script: Cyrl
  content: Директива 95/26/ЕО на Европейския парламент
    и на Съвета от 29 юни 1995 година за изменение
    на Директиви 77/780/ЕИО и 89/646/ЕИО в областта на
    кредитните институции, Директиви 73/239/ЕИО и
    92/49/ЕИО в областта на застраховането, различно
    от животозастраховане, Директиви 79/267/ЕИО и
    92/96/ЕИО в областта на животозастраховането,
    Директива 93/22/ЕИО в областта на инвестиционните
    посредници и Директива 85/611/ЕИО в областта на
    предприятията за колективно инвестиране в
    прехвърлими ценни книжа (ПКИПЦК), с оглед засилване
    на разумния надзор
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 95/26/ES ze dne 29. června 1995,
    kterou se mění směrnice 77/780/EHS a 89/646/EHS o úvěrových institucích,
    směrnice 73/239/EHS a 92/49/EHS o jiném než životním pojištění, směrnice
    79/267/EHS a 92/96/EHS o životním pojištění, směrnice 93/22/EHS o investičních
    podnicích a směrnice 85/611/EHS o subjektech kolektivního investování do
    převoditelných cenných papírů (SKIPCP)
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 95/26/EF af 29. juni 1995 om ændring
    af direktiv 77/780/EØF og 89/646/EØF om kreditinstitutter, direktiv 73/239/EØF
    og 92/49/EØF om skadesforsikring, direktiv 79/267/EØF og 92/96/EØF om livsforsikring,
    direktiv 93/22/EØF om investeringsselskaber og direktiv 85/611/EØF om institutter
    for kollektiv investering i værdipapirer (investeringsinstitutter), med henblik
    på at styrke tilsynet på disse områder
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/26/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 29ης Ιουνίου 1995 για την
    τροποποίηση των οδηγιών 77/780/ΕΟΚ και 89/646/ΕΟΚ
    στον τομέα των πιστωτικών ιδρυμάτων, των οδηγιών
    73/239/ΕΟΚ και 92/49/ΕΟΚ στον τομέα της ασφάλισης
