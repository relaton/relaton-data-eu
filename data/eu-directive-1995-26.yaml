    συλλογικών επενδύσεων σε κινητές αξίες (ΟΣΕΚΑ),
    με σκοπό την ενίσχυση της προληπτικής εποπτείας
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 95/26/EÜ, 29. juuni 1995, krediidiasutusi
    käsitlevate direktiivide 77/780/EMÜ ja 89/646/EMÜ, kahjukindlustust käsitlevate
    direktiivide 73/239/EMÜ ja 92/49/EMÜ, elukindlustust käsitlevate direktiivide
    79/267/EMÜ ja 92/96/EMÜ, investeerimisühinguid käsitleva direktiivi 93/22/EMÜ
    ning avatud investeerimisfonde (UCITS) käsitleva direktiivi 85/611/EMÜ muutmise
    kohta, et tugevdada järelevalvet usaldatavusnormatiivide täitmise üle
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 95/26/EY, annettu 29 päivänä
    kesäkuuta 1995, luottolaitosalan direktiivien 77/780/ETY ja 89/646/ETY, vahinkovakuutusalan
    direktiivien 73/239/ETY ja 92/49/ETY, henkivakuutusalan direktiivien 79/267/ETY
    ja 92/96/ETY, sijoituspalveluyritysten alan direktiivin 93/22/ETY sekä arvopapereihin
    kohdistuvaa yhteistä sijoitustoimintaa harjoittavien yritysten (yhteissijoitusyritysten)
    alan direktiivin 85/611/ETY muuttamisesta toiminnan vakauden valvonnan tehostamiseksi
  type: main
- language: hr
  script: Latn
  content: Direktiva Europskog parlamenta i Vijeća 95/26/EZ od 29. lipnja 1995. o
    izmjeni direktiva 77/780/EEZ i 89/646/EEZ u području kreditnih ustanova, direktiva
    73/239/EEZ i 92/49/EEZ u području neživotnog osiguranja, direktiva 79/267/EEZ
    i 92/96/EEZ u području životnog osiguranja, Direktive 93/22/EEZ u području
    investicijskih društava i Direktive 85/611/EEZ u području subjekata za zajednička
    ulaganja u prenosive vrijednosne papire (UCITS) za potrebe jačanja bonitetnog
    nadzora
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és Tanács 95/26/EK irányelve (1995. június 29.)
    a hitelintézetek vonatkozásában a 77/780/EGK és a 89/646/EGK irányelvnek,
    a nem életbiztosítási tevékenység vonatkozásában a 73/239/EGK és a 92/49/EGK
    irányelvnek, az életbiztosítások vonatkozásában a 79/267/EGK és a 92/96/EGK
    irányelvnek, a befektetési vállalkozások vonatkozásában a 93/22/EGK irányelvnek,
    valamint az átruházható értékpapírokkal foglalkozó kollektív befektetési
    vállalkozások (ÁÉKBV) vonatkozásában a 85/611/EGK irányelvnek a prudenciális
    felügyelet megerősítése érdekében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 95/26/CE del Parlamento europeo e del Consiglio, del 29 giugno
    1995, che modifica le direttive 77/780/CEE e 89/646/CEE relative agli enti creditizi,
    le direttive 73/239/CEE e 92/49/CEE relative alle assicurazioni diverse dalle
    assicurazioni sulla vita, le direttive 79/267/CEE e 92/96/CEE relative alle assicurazioni
    sulla vita, la direttiva 93/22/CEE relativa ai servizi di investimento e la direttiva
    85/611/CEE in materia di taluni organismi di investimento collettivo in valori
    mobiliari (OICVM) al fine di rafforzare la vigilanza prudenziale
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 95/26/EK (1995. gada 29. jūnijs),
    ar ko groza Direktīvu 77/780/EEK un Direktīvu 89/646/EEK kredītiestāžu jomā,
    Direktīvu 73/239/EEK un Direktīvu 92/49/EEK nedzīvības apdrošināšanas jomā,
    Direktīvu 79/267/EEK un Direktīvu 92/96/EEK dzīvības apdrošināšanas jomā,
    Direktīvu 93/22/EEK ieguldījumu sabiedrību jomā un Direktīvu 85/611/EEK attiecībā
    uz pārvedamo vērtspapīru kolektīvo ieguldījumu uzņēmumiem (PVKIU), lai
    stiprinātu konsultatīvo uzraudzību
  type: main
- language: lt
  script: Latn
  content: 1995 m. birželio 29 d. Europos Parlamento ir Tarybos Direktyva 95/26/EB
    iš dalies keičianti Direktyvas 77/780/EEB ir 89/646/EEB dėl kredito įstaigų,
    Direktyvas 73/239/EEB ir 92/49/EEB dėl ne gyvybės draudimo, Direktyvas 79/267/EEB
    ir 92/96/EEB dėl gyvybės draudimo, Direktyvą 93/22/EEB dėl investicinių įmonių,
    Direktyvą 85/611/EEB dėl kolektyvinio investavimo į perleidžiamus vertybinius
    popierius subjektų (KIPVPS), kad būtų gerinama riziką ribojanti priežiūra
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Parlament Ewropew U Tal-Kunsill 95/26/KE tad-29 ta’
    Ġunju 1995 li temenda d-Direttivi 77/780/KEE u 89/646/KEE fil-qasam ta’ l-istituzzjonijiet
    ta’ kreditu, id-Direttivi 73/239/KEE u 92/49/KEE fil-qasam ta’ l-assigurazzjoni
    mhux tal-ħajja, id-Direttivi 79/267/KEE u 92/96/KEE fil-qasam ta’ l-assigurazzjoni
    tal-ħajja, id-Direttiva 93/22/KEE fil-qasam ta’ ditti ta’ investiment u d-Direttiva
    85/611/KEE fil-qasam ta’ impriżi ta’ l-investiment kollettiv f’titoli trasferibbli
    (Ucits), bil-għan li tissaħħah is-superviżjoni prudenti
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/26/EG van het Europees Parlement en de Raad van 29 juni 1995
    tot wijziging van de Richtlijnen 77/780/EEG en 89/646/EEG op het gebied van kredietinstellingen,
    de Richtlijnen 73/239/EEG en 92/49/EEG op het gebied van het schadeverzekeringsbedrijf,
    de Richtlijnen 79/267/EEG en 92/96/EEG op het gebied van het levensverzekeringsbedrijf,
    Richtlijn 93/22/EEG op het gebied van beleggingsondernemingen en Richtlijn 85/611/EEG
    op het gebied van instellingen voor collectieve belegging in effecten (icbe's),
    teneinde het bedrijfseconomische toezicht te versterken
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 95/26/WE Parlamentu Europejskiego i Rady z dnia 29 czerwca 1995
    r. zmieniająca dyrektywy 77/780/EWG i 89/646/EWG w dziedzinie instytucji kredytowych,
    dyrektywy 73/239/EWG i 92/49/EWG w dziedzinie ubezpieczeń innych niż ubezpieczenia
    na życie, dyrektywy 79/267/EWG i 92/96/EWG w dziedzinie ubezpieczeń na życie,
    dyrektywę 93/22/EWG w dziedzinie przedsiębiorstw inwestycyjnych i dyrektywę
    85/611/EWG w zakresie przedsiębiorstw zbiorowego inwestowania w zbywalne papiery
    wartościowe (UCTIS) w celu wzmocnienia nadzoru ostrożnościowego
  type: main
- language: pt
  script: Latn
  content: Directiva 95/26/CE do Parlamento Europeu e do Conselho, de 29 de Junho
    de 1995, que altera as Directivas 77/780/CEE e 89/646/CEE no domínio das instituições
    de crédito, as Directivas 73/239/CEE e 92/49/CEE no domínio dos seguros não-vida,
    as Directivas 79/267/CEE e 92/96/CEE no domínio do seguro de vida, a Directiva
    93/22/CEE no domínio das empresas de investimento e a Directiva 85/611/CEE do
    Conselho no domínio dos organismos de investimento colectivo em valores mobiliários
    (OICVM), a fim de reforçar a supervisão prudencial
  type: main
- language: ro
  script: Latn
  content: Directiva 95/26/CE a Parlamentului European și a Consiliului din 29 iunie
    1995 de modificare a Directivelor 77/780/CEE și 89/646/CEE în domeniul instituțiilor
    de credit, a Directivelor 73/239/CEE și 92/49/CEE în domeniul asigurării generale,
    a Directivelor 79/267/CEE și 92/96/CEE în domeniul asigurării de viață, a
    Directivei 93/22/CEE în domeniul întreprinderilor de investiții și a Directivei
    85/611/CEE în domeniul organismelor de plasament colectiv în valori mobiliare
    (OPCVM), în vederea consolidării supravegherii prudențiale
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 95/26/ES z 29. júna 1995, ktorou
    sa menia a dopíňajú smernice 77/780/EHS a 89/646/EHS v oblasti úverových
    inštitúcií, smernice 73/239/EHS a 92/49/EHS v oblasti neživotného poistenia,
    smernice 79/267/EHS a 92/96/EHS v oblasti životného poistenia, smernica 93/22/EHS
    v oblasti investičných spoločností a smernica 85/611/EHS v oblasti podnikov
    kolektívneho investovania do prevoditeľných cenných papierov (PKIPCP), so
    zreteľom na upevnenie obozretného dohľadu
  type: main
- language: sl
  script: Latn
  content: Direktiva Evropskega parlamenta in Sveta 95/26/EC z dne 29. junija 1995
    ki spreminja Direktivi 77/780/EGS in 89/646/EGS na področju kreditnih institucij,
    Direktivi 73/239/EGS in 92/49/EGS na področju premoženjskega zavarovanja, Direktivi
    79/267/EGS in 92/96/EGS na področju življenjskega zavarovanja, Direktivo 93/22/EGS
    na področju investicijskih družb ter Direktivo 85/611/EGS na področju kolektivnih
    naložbenih podjemov za vlaganja v prenosljive vrednostne papirje (KNPVP) z namenom
    okrepitve nadzora varnega in skrbnega poslovanja
  type: main
- language: es
  script: Latn
  content: Directiva 95/26/CE del Parlamento Europeo y del Consejo, de 29 de junio
    de 1995, por la que se modifican las Directivas 77/780/CEE y 89/646/CEE, relativas
    a las entidades de crédito, las Directivas 73/239/CEE y 92/49/CEE, relativas
    al seguro directo distinto del seguro de vida, las Directivas 79/267/CEE y 92/96/CEE,
    relativas al seguro directo de vida, la Directiva 93/22/CEE, relativa a las empresas
    de inversión y la Directiva 85/611/CEE, sobre determinados organismos de inversión
    colectiva en valores mobiliarios (OICVM) con objeto de reforzar la supervisión
    prudencial
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 95/26/EG av den 29 juni 1995 om
    ändring av direktiv 77/780/EEG och 89/646/EEG om kreditinstitut, direktiv 73/239/EEG
    och 92/49/EEG om andra direkta försäkringar än livförsäkringar, direktiv
    79/267/EEG och 92/96/EEG om direkta livförsäkringar, direktiv 93/22/EEG om tjänster
    inom värdepappersområdet och direktiv 85/611/EEG om företag för kollektiva
    investeringar i överlåtbara värdepapper (fondföretag) i syfte att stärka
    tillsynen på dessa områden
  type: main
