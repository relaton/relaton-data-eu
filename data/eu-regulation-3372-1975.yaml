title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3372/75 of the Commission of 23 December 1975 fixing
    for the 1976 fishing year withdrawal prices for the fishery products listed in
    Annex I (A) and (C) to Regulation (EEC) No 2142/70 and for certain products landed
    in areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3372/75 de la Commission, du 23 décembre 1975, fixant,
    pour les produits de la pêche énumérés à l'annexe I sous A et C, ainsi que
    pour certains produits débarqués dans des zones très éloignées des principaux
    centres de consommation de la Communauté, du règlement (CEE) n° 2142/70, les
    prix de retrait valables pour l'année 1976
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3372/75 der Kommission vom 23. Dezember 1975 zur Festsetzung
    der Rücknahmepreise für das Jahr 1976 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 2142/70 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3372/75 af 23. december 1975 om fastsættelse
    af tilbagetagelsespriserne for året 1976 for de fiskerivarer, som er anført
    i afsnit A og C i bilag I til forordning (EØF) nr. 2142/70, samt for visse af
    de i nævnte forordning omhandlede varer fra landingsområder, der ligger meget
    fjernt fra Fællesskabets vigtigste forbrugscentre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3372/75 della Commissione, del 23 dicembre 1975, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, nonché
    per taluni prodotti sbarcati in zone molto lontane dai principali centri di consumo
    della Comunità, del regolamento (CEE) n. 2142/70, i prezzi di ritiro validi per
    l'anno 1976
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3372/75 van de Commissie van 23 december 1975 tot
    vaststelling van de in 1976 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 2142/70 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
