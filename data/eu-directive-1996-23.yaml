---
id: EUDirective199623
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 96/23/EC of 29 April 1996 on measures to monitor certain
    substances and residues thereof in live animals and animal products and repealing
    Directives 85/358/EEC and 86/469/EEC and Decisions 89/187/EEC and 91/664/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 96/23/CE du Conseil, du 29 avril 1996, relative aux mesures de
    contrôle à mettre en oeuvre à l'égard de certaines substances et de leurs
    résidus dans les animaux vivants et leurs produits et abrogeant les directives
    85/358/CEE et 86/469/CEE et les décisions 89/187/CEE et 91/664/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/23/EG des Rates vom 29. April 1996 über Kontrollmaßnahmen
    hinsichtlich bestimmter Stoffe und ihrer Rückstände in lebenden Tieren und tierischen
    Erzeugnissen und zur Aufhebung der Richtlinien 85/358/EWG und 86/469/EWG und der
    Entscheidungen 89/187/EWG und 91/664/EWG
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/23/ES ze dne 29. dubna 1996 o kontrolních opatřeních
    u některých látek a jejich reziduí v živých zvířatech a živočišných
    produktech a o zrušení směrnic 85/358/EHS a 86/469/EHS a rozhodnutí 89/187/EHS
    a 91/664/EHS
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/23/EF af 29. april 1996 om de kontrolforanstaltninger,
    der skal iværksættes for visse stoffer og restkoncentrationer heraf i levende
    dyr og produkter heraf og om ophævelse af direktiv 85/358/EØF og 86/469/EØF
    og beslutning 89/187/EØF og 91/664/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/23/ΕΚ του Συμβουλίου, της 29ης Απριλίου
    1996, περί της λήψης μέτρων ελέγχου για ορισμένες
    ουσίες και τα κατάλοιπά τους σε ζώντα ζώα και
    στα προϊόντα τους και κατάργησης των οδηγιών
    85/358/ΕΟΚ και 86/469/ΕΟΚ και των αποφάσεων 89/187/ΕΟΚ
    και 91/664/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/23/EÜ, 29. aprill 1996, millega nähakse ette teatavate
    ainete ja nende jääkide kontrollimise meetmed elusloomades ja loomsetes toodetes
    ning tunnistatakse kehtetuks direktiivid 85/358/EMÜ ja 86/469/EMÜ ning otsused
    89/187/EMÜ ja 91/664/EMÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/23/EY, annettu 29 päivänä huhtikuuta 1996, elävissä
    eläimissä ja niistä saatavissa tuotteissa olevien tiettyjen aineiden ja niiden
    jäämien osalta suoritettavista tarkastustoimenpiteistä ja direktiivien 85/358/ETY
    ja 86/469/ETY sekä päätösten 89/187/ETY ja 91/664/ETY kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/23/EK irányelve (1996. április 29.) egyes élő állatokban
    és állati termékekben lévő anyagok és azok maradványainak ellenőrzésére
    szolgáló intézkedésekről, valamint a 85/358/EGK és 86/469/EGK irányelvek,
    továbbá a 89/187/EGK és 91/664/EGK határozatok hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 96/23/CE del Consiglio, del 29 aprile 1996, concernente le misure
    di controllo su talune sostanze e sui loro residui negli animali vivi e nei loro
    prodotti e che abroga le direttive 85/358/CEE e 86/469/CEE e le decisioni 89/187/CEE
    e 91/664/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/23/EK (1996. gada 29. aprīlis), ar ko paredz pasākumus,
    lai kontrolētu noteiktas vielas un to atliekas dzīvos dzīvniekos un dzīvnieku
    izcelsmes produktos, un ar ko atceļ Direktīvu 85/358/EEK un Direktīvu 86/469/EEK,
    kā arī Lēmumu 89/187/EEK un Lēmumu 91/664/EEK
  type: main
- language: lt
  script: Latn
  content: 1996 m. balandžio 29 d. Tarybos direktyva 96/23/EB dėl kai kurių medžiagų
    ir jų likučių gyvuose gyvūnuose ir gyvūninės kilmės produktuose monitoringo
    priemonių, panaikinanti Direktyvas 85/358/EEB ir 86/469/EEB bei Sprendimus 89/187/EEB
    ir 91/664/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/23/KE tad-29 ta' April 1996 dwar miżuri għall-monitoraġġ
    ta' ċerti sustanzi u residwi tagħhom f'annimali ħajjin u prodotti ta' l-annimali
    u li tħassar id-Direttivi 85/358/KEE u 86/469/KEE u d-Deċiżjonijiet 89/187/KEE
    u 91/664/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/23/EG van de Raad van 29 april 1996 inzake controlemaatregelen
    ten aanzien van bepaalde stoffen en residuen daarvan in levende dieren en in produkten
    daarvan en tot intrekking van de Richtlijnen 85/358/EEG en 86/469/EEG en de Beschikkingen
    89/187/EEG en 91/664/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/23/WE z dnia 29 kwietnia 1996 r. w sprawie środków
    monitorowania niektórych substancji i ich pozostałości u żywych zwierząt
    i w produktach pochodzenia zwierzęcego oraz uchylająca dyrektywy 85/358/EWG
    i 86/469/EWG oraz decyzje 89/187/EWG i 91/664/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 96/23/CE do Conselho, de 29 de Abril de 1996, relativa às medidas
    de controlo a aplicar a certas substâncias e aos seus resíduos nos animais vivos
    e respectivos produtos e que revoga as Directivas 85/358/CEE e 86/469/CEE e as
    Decisões 89/187/CEE e 91/664/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/23/ES z 29. apríla 1996 o opatreniach na monitorovanie
    určitých látok a ich rezíduí v živých zvieratách a živočíšnych produktoch
    a o zrušení smerníc 85/358/EHS a 86/469/EHS a rozhodnutí 89/187/EHS a 91/664/EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/23/ES z dne 29. aprila 1996 o ukrepih za spremljanje
    nekaterih snovi in njihovih ostankov v živih živalih in v živalskih proizvodih
    ter razveljavitvi direktiv 85/358/EGS in 86/469/EGS in odločb 89/187/EGS in 91/664/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 96/23/CE del Consejo, de 29 de abril de 1996, relativa a las
    medidas de control aplicables respecto de determinadas sustancias y sus residuos
    en los animales vivos y sus productos y por la que se derogan las Directivas 85/358/CEE
    y 86/469/CEE y las Decisiones 89/187/CEE y 91/664/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/23/EG av den 29 april 1996 om införande av kontrollåtgärder
    för vissa ämnen och restsubstanser av dessa i levande djur och i produkter framställda
    därav och om upphävande av direktiv 85/358/EEG och 86/469/EEG samt beslut 89/187/EEG
    och 91/664/EEG
  type: main
