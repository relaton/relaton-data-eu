title:
- language: en
  script: Latn
  content: '88/296/EEC: Council Decision of 3 May 1988 on the conclusion of an Agreement
    in the form of an exchange of letters concerning the provisional application of
    the Protocol setting out the fishing rights and financial compensation provided
    for in the Agreement between the Government of the Republic of Senegal and the
    European Economic Community on fishing off the coast of Senegal for the period
    from 29 February 1988 to 28 February 1990'
  type: main
- language: fr
  script: Latn
  content: '88/296/CEE: Décision du Conseil du 3 mai 1988 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les droits de pêche et la contrepartie financière prévus
    dans l''accord entre le gouvernement de la République du Sénégal et la Communauté
    économique européenne concernant la pêche au large de la côte sénégalaise,
    pour la période du 29 février 1988 au 28 février 1990'
  type: main
- language: de
  script: Latn
