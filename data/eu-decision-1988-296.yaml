    zwischen der Regierung der Republik Senegal und der Europäischen Wirtschaftsgemeinschaft
    über die Fischerei vor der senegalesischen Küste für die Zeit vom 29. Februar
    1988 bis zum 28. Februar 1990 (88/296/EWG) #'
  type: main
- language: da
