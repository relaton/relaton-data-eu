    og finansiel godtgørelse, som omhandlet i Aftalen mellem Regeringen for Republikken
    Senegal og Det Europæiske Økonomiske Fællesskab om Fiskeri ud for Senegals
    Kyst, for perioden fra 29. februar 1988 til 28. februar 1990 (88/296/EØF) #'
  type: main
- language: el
