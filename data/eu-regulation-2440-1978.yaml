title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2440/78 of 18 October 1978 re-establishing
    the levying of customs duties on articles of jewellery and parts thereof, of precious
    metal, falling within subheading 71.12 A, originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2705/77
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2440/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de bijouterie et de joaillerie et leurs parties, etc., en métaux précieux de
    la sous-position tarifaire 71.12 A, originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2440/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Schmuckwaren und Teile davon, aus Edelmetallen, der Tarifstelle
    71.12 A, mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2440/78 af 18. oktober 1978 om genindførelse
    af toldafgifter for bijouterivarer og dele deraf, etc., af ædle metaller, under
    underposition 71.12 A, som har oprindelse i Thailand og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF)nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2440/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle minuterie e oggetti
    di gioielleria e loro parti, ecc., di metalli preziosi, della sottovoce 71.12
    A della tariffa doganale comune, originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2440/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op bijouterieën
    en juwelen, alsmede delen daarvan, van edele metalen, van onderverdeling 71.12
    A, van oorsprong uit Thailand ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad algemene tariefpreferenties werden geopend
  type: main
