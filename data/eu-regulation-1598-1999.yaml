  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1598/1999, annettu 20 päivänä heinäkuuta
    1999, asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä
    koskevien, heinäkuussa 1999 esitettyjen tuontitodistushakemusten hyväksyttävyydestä
    Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian
    ja Romanian osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1598/1999 della Commissione, del 20 luglio 1999, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
