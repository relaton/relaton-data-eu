title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1794/77 of 2 August 1977 re-establishing
    the levying of the customs duties on acrylic polymers, methacrylic polymers and
    acrylo-methacrylic copolymers, in the form of plates, sheets, etc., falling within
    subheading 39.02 C ex XII, originating in Thailand to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) 1794/77 de la Commission, du 2 août 1977, portant rétablissement
    de la perception des droits de douane applicables aux polymères acryliques, polymères
    méthacryliques, copolymères acrylométhacryliques, sous forme de plaques, feuilles,
    pellicules, etc., de la sous-position tarifaire 39.02 C EX XII, originaires de
    Thaïlande bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1794/77 der Kommission vom 2. August 1977 zur Wiedereinführung
    des Zollsatzes für Acrylpolymerisate, Methacrylpolymerisate, Acryl-Methacryl-Mischpolymerisate
    in Formen von Platten, Folien, Filmen usw., der Tarifstelle 39.02 C ex XII, mit
    Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1794/77 af 2. august 1977 om genindførelse
    af toldafgifter for polyacrylsyrederivater og polymethacrylsyrederivater samt
    co-polymerisationsprodukter af acryl- og metacrylsyre omfatter plader, ark, etc.,
    under underposition 39.02 C ex XII, som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1794/77 della Commissione, del 2 agosto 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai polimeri acrilici,
    polimeri metacrilici, copolimeri acrilometacrilici, sotto la forma di lastre,
    fogli, ecc. della sottovoce doganale 39.02 C ex XII originari della Tailandia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3021/76
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1794/77 van de Commissie van 2 augustus 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op acrylpolymeren,
    methacrylpolymeren, acrylomethacrylcopolymeren, in de vorm van platen, vellen,
    foliën, stroken en strippen, enz., van post 39.02 C ex XII, van oorsprong uit
    Thailand, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene
    tariefpreferenties werden geopend
  type: main
