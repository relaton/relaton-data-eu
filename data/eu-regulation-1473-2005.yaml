title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1473/2005 of 9 September 2005 determining
    to what extent import right applications submitted during the month of August
    2005 for certain live bovine animals as part of a tariff quota provided for in
    Regulation (EC) No 1241/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1473/2005 de la Commission du 9 septembre 2005 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites au mois d'août 2005 pour certains bovins vivants dans le cadre d'un
    contingent tarifaire prévu par le règlement (CE) n° 1241/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1473/2005 der Kommission vom 9. September 2005 zur
    Festsetzung des Umfangs, in dem die im August 2005 eingereichten Anträge auf
    Einfuhrlizenzen für bestimmte lebende Rinder im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 1241/2005 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1473/2005 ze dne 9. září 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních licencí
    na měsíc srpen 2005 pro určitý živý skot, podaným v rámci celní kvóty
    dle nařízení (ES) č. 1241/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1473/2005 af 9. september 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicencer, som er
    indsendt i august 2005, for levende kreaturer i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1241/2005
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1473/2005 της Επιτροπής,
    της 9ης Σεπτεμβρίου 2005, για καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Αύγουστο του 2005 για ορισμένα
    ζώντα βοοειδή, στο πλαίσιο μιας δασμολογικής
    ποσόστωσης η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 1241/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1473/2005, 9. september 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordilitsentside taotlusi augustis
    2005, mis on esitatud teatavate elusveiste kohta määrusega (EÜ) nr 1241/2005
    ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1473/2005, annettu 9 päivänä syyskuuta 2005,
    eläviä nautaeläimiä koskevien elokuussa 2005 jätettyjen tuontitodistushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1241/2005 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1473/2005/EK rendelete (2005. szeptember 9.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1241/2005/EK rendeletben szabályozott
    vámkontingens keretében, az egyes élő szarvasmarhafélékre vonatkozóan 2005
    augusztusában benyújtott importtanúsítvány iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1473/2005 della Commissione, del 9 settembre 2005,
    che stabilisce in che misura possono essere accolte le domande di certificati
    di importazione presentate nel mese di agosto 2005 per bovini vivi nel quadro
    del contingente tariffario previsto dal regolamento (CE) n. 1241/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1473/2005 (2005. gada 9. septembris), ar ko nosaka,
    cik lielā mērā var pieņemt importa tiesību ievešanas atļauju saņemšanai,
    kuras iesniegtas 2005. gada augustā attiecībā uz konkrētiem dzīviem Rumānijas
    izcelsmes liellopiem tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr.
    1241/2005
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 9 d. Komisijos reglamentas (EB) Nr. 1473/2005, nustatantis,
    kokia dalimi galima patenkinti paraiškas tam tikrų gyvų galvijų importo licencijoms
    gauti, pateiktas 2005 m. rugpjūčio mėn., remiantis tarifine kvota, nustatyta
    Reglamente (EB) Nr. 1241/2005
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1473/2005 van de Commissie van 9 september 2005 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen voor
    invoercertificaten voor bepaalde levende runderen, die in augustus 2005 zijn ingediend
    op grond van een bij Verordening (EG) nr. 1241/2005 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1473/2005 z dnia 9 września 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie pozwoleń na przywóz
    w miesiącu sierpniu 2005 r. niektórych sztuk żywego bydła w ramach kontyngentu
    taryfowego przewidzianego w rozporządzeniu (WE) nr 1241/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1473/2005 da Comissão, de 9 de Setembro de 2005,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados animais vivos da espécie bovina, apresentados no mês de Agosto
    de 2005 ao abrigo de um contingente pautal previsto pelo Regulamento (CE) n.°
    1241/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1473/2005 z 9. septembra 2005, ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií na
    mesiac august 2005 na niektorý živý hovädzi dobytok v rámci colnej kvóty
    ustanovenej v nariadení (ES) č. 1241/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1473/2005 z dne 9. septembra 2005 o določitvi,
    v kakšnem obsegu se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi v
    mesecu avgustu 2005 za nekatero živo govedo, v okviru tarifne kvote, predvidene
    z Uredbo (ES) št. 1241/2005
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1473/2005 de la Comisión, de 9 de septiembre de 2005,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación en el mes de agosto de 2005 de animales vivos de
    la especie bovina, presentadas dentro de un contingente arancelario establecido
    en el Reglamento (CE) n° 1241/2005
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1473/2005 av den 9 september 2005 om
    i vilken utsträckning ansökningar om importlicenser inlämnade under augusti
    2005 för vissa levande nötkreatur inom ramen för den avgiftskvot som fastställts
    i förordning (EG) nr 1241/2005 kan beviljas
  type: main
