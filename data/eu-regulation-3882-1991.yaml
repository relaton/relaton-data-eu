title:
- language: en
  script: Latn
  content: Council Regulation ( EEC ) No 3832/91 of 18 December 1991 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1992 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 3882/91 du Conseil, du 18 décembre 1991, fixant,
    pour certains stocks de poissons, les totaux admissibles des captures pour 1992
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 3882/91 des Rates vom 18. Dezember 1991 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechender Fangbedingungen für bestimmte
    Fischbestände oder Bestandsgruppen ( 1992 )
  type: main
- language: da
  script: Latn
  content: Rådets forordning ( EØF ) nr. 3882/91 af 18. december 1991 om fastsættelse
    for 1992 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3882/91 του Συμβουλίου
    της 18ης Δεκεμβρίου 1991 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, του συνόλου επιτρεπομένων αλιευμάτων,
    για το έτος 1992, καθώς και ορισμένων όρων υπό
    τους οποίους οι ιχθείς αυτοί μπορούν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 3882/91 del Consiglio, del 18 dicembre 1991, che
    stabilisce, per alcune popolazioni o gruppi di popolazioni ittiche, il totale
    di catture ammesse per il 1992 e talune condizioni cui è soggetta la pesca di
    detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 3882/91 van de Raad van 18 december 1991 inzake
    de vaststelling van de voor 1992 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden, alsmede bij de visserij in het kader van
    de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 3882/91 do Conselho, de 18 de Dezembro de 1991,
    que fixa, relativamente a determinadas unidades populacionais ou grupos de unidades
    populacionais de peixes, os totais admissíveis dee capturas para 1992 e certas
    condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento ( CEE ) n° 3882/91 del Consejo, de 18 de diciembre de 1991,
    por el que se fijan, para determinadas poblaciones o grupos de poblaciones de
    peces, los totales admisibles de capturas para 1992 y determinadas condiciones
    en las que pueden pescarse
  type: main
