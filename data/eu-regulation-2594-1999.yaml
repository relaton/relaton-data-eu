  content: Commission Regulation (EC) No 2594/1999 of 8 December 1999 amending Regulations
    (EC) No 2243/1999, (EC) No 2251/1999, (EC) No 2258/1999 and (EC) No 2262/1999
    establishing the standard import values for determining the entry price of certain
    fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2594/1999 de la Commission, du 8 décembre 1999, rectifiant
    les règlements (CE) n° 2243/1999, (CE) n° 2251/1999, (CE) n° 2258/1999 et
    (CE) n° 2262/1999 établissant des valeurs forfaitaires à l'importation pour
    la détermination du prix d'entrée de certains fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2594/1999 der Kommission vom 8. Dezember 1999 zur Berichtigung
