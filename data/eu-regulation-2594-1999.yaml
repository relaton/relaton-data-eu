    των κανονισμών (ΕΚ) αριθ. 2243/1999, (ΕΚ) αριθ. 2251/1999,
    (ΕΚ) αριθ. 2258/1999 και (ΕΚ) αριθ. 2262/1999 όσον αφορά
    τον καθορισμό των κατ' αποκοπή τιμών κατά την
    εισαγωγή για τον καθορισμό της τιμής εισόδου
    ορισμένων οπωροκηπευτικών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2594/1999, annettu 8 päivänä joulukuuta 1999,
