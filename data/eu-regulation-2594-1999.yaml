    (EG) Nr. 2262/1999 zur Festlegung pauschaler Einfuhrwerte für die Bestimmung
    der im Sektor Obst und Gemüse geltenden Einfuhrpreise
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2594/1999 af 8. december 1999 til berigtigelse
