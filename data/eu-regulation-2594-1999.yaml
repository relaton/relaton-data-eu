    annettujen asetusten (EY) N:o 2243/1999, (EY) N:o 2251/1999, (EY) N:o 2258/1999
    ja (EY) N:o 2262/1999 oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2594/1999 della Commissione, dell'8 dicembre 1999,
    che rettifica i regolamenti (CE) n. 2243/1999, (CE) n. 2251/1999, (CE) n. 2258/1999
    e (CE) n. 2262/1999 recanti fissazione dei valori forfettari all'importazione
    ai fini della determinazione del prezzo di entrata di alcuni ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2594/1999 van de Commissie van 8 december 1999 houdende
    rectificatie van de Verordeningen (EG) nr. 2243/1999, (EG) nr. 2251/1999, (EG)
    nr. 2258/1999 en (EG) nr. 2262/1999 tot vaststelling van forfaitaire invoerwaarden
    voor de bepaling van de invoerprijzen van bepaalde soorten groenten en fruit
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2594/1999 da Comissão, de 8 de Dezembro de 1999,
