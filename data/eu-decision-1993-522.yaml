title:
- language: en
  script: Latn
  content: '93/522/EEC: Commission Decision of 30 September 1993 on the definition
    of the measures eligible for Community financing in the programmes for the control
    of organisms harmful to plants or plant products in the French overseas departments,
    in the Azores and in Madeira (Only the French and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/522/CEE: Décision de la Commission, du 30 septembre 1993, relative
    à la définition des mesures éligibles au financement communautaire concernant
    les programmes de lutte contre les organismes nuisibles aux végétaux ou aux
    produits végétaux dans les départements français d''outre-mer, aux Açores
    et à Madère (Les textes en langues française et portugaise sont les seuls faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '93/522/EWG: Entscheidung der Kommission vom 30. September 1993 zur Festlegung
    der für eine Finanzierung durch die Gemeinschaft in Betracht kommenden Maßnahmen
    im Rahmen der Programme zur Bekämpfung der Schadorganismen von Pflanzen und pflanzlichen
    Erzeugnissen in den französischen überseeischen Departements sowie auf den Azoren
    und Madeira (Nur der französische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/522/EØF: Kommissionens beslutning af 30. september 1993 om fastlæggelse
