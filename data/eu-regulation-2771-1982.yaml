title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2771/82 of 15 October 1982 fixing the buying-in
    prices for hindquarters of beef applicable from 22 November 1982, amending Regulation
    (EEC) No 2226/78 and repealing Regulation (EEC) No 1756/821
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2771/82 de la Commission, du 15 octobre 1982, fixant
    les prix d' achat à l' intervention de quartiers arrière dans le secteur de
    la viande bovine, valables à partir du 22 novembre 1982, modifiant le règlement
    (CEE) n° 2226/78 et abrogeant le règlement (CEE) n° 1756/82
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2771/82 der Kommission vom 15. Oktober 1982 zur Festsetzung
    der ab 22. November 1982 geltenden Ankaufspreise bei Interventionen für Hinterviertel
    auf dem Rindfleischsektor sowie zur Änderung der Verordnung (EWG) Nr. 2226/78
    und zur Aufhebung der Verordnung (EWG) Nr. 1756/82f
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2771/82 af 15. oktober 1982 om fastsættelse
    af interventionsopkøbspriserne for bagfjerdinger inden for oksekødsektoren,
    gældende fra den 22. november 1982, om ændring af forordning (EØF) nr. 2226/78
    og om ophævelse af forordning (EØF) nr. 1756/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2771/82 τής Επιτροπής
    τής 15ης Οκτωβρίου 1982 περί καθορισμού τών τιμών
    αγοράς στήν παρέμβαση τών οπισθίων τεταρτημορίων
    στόν τομέα τού βοείου κρέατος, πού ισχύουν
    από τίς 22 Νοεμβρίου 1982, περί τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 2226/78 καί περί καταργήσεως
    τού κανονισμού (EOK) αριθ. 1756/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2771/82 della Commissione, del 15 ottobre 1982, che
