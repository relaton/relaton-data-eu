title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1289/88 of 11 May 1988 re-establishing the
    levying of customs duties on garments, other than knitted or crocheted, products
    of category 78 (order No 40.0780), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1289/88 de la Commission du 11 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux vêtements, autres qu' en
    bonneterie, de la catégorie de produits n° 78 (n° d' ordre 40.0780), originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1289/88 der Kommission vom 11. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Bekleidung, andere als aus Gewirken, der Warenkategorie Nr.
    78 (lfd. Nr. 40.0780) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1289/88 af 11. maj 1988 om genindførelse
    af opkrævning af toldafgifter for beklædningsgenstande, ikke af trikotage under
    varekategori nr. 78 (løbenummer 40.0780), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1289/88 της Επιτροπής
