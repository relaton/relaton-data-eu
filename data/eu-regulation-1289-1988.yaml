    τελωνειακών δασμών για ενδύματα εκτός από
    τα πλεκτά, προϊόντα της κατηγορίας 78 (αύξων
    αριθμός 40.0780) καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3783/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1289/88 della Commissione dell' 11 maggio 1988 che
    ripristina la riscossione dei dazi doganali applicabili agli indumenti diversi
    da quelli a maglia, della categoria di prodotti n. 78 (numero d' ordine 40.0780),
    originari dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1289/88 van de Commissie van 11 mei 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kleding,
    andere dan van brei- of haakwerk, van de categorie van produkten nr. 78 (volgnummer
    40.0780), van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1289/88 da Comissão de 11 de Maio de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis ao vestuário exterior, com excepção
    do de malha, da categoria de produtos n.° 78 (n.° de ordem 40.0780), originário
    da Índia, beneficiária das preferências pautais previstas no Regulamento (CEE)
    n.° 3783/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1289/88 de la Comisión de 11 de mayo de 1988 relativo
