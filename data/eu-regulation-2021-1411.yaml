  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1411 of 27 August 2021 concerning
    the renewal of the authorisation of Clostridium butyricum FERM BP-2789 as a feed
    additive for chickens reared for laying, turkeys for fattening, turkeys reared
    for breeding, minor avian species (excluding laying birds), weaned piglets and
    weaned minor porcine species, its authorisation for chickens for fattening, suckling
    piglets and suckling minor porcine species, and repealing Implementing Regulations
    (EU) No 373/2011, (EU) No 374/2013 and (EU) No 1108/2014 (holder of authorisation
    Miyarisan Pharmaceutical Co. Ltd represented by Huvepharma NV Belgium)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2021/1411 de la Commission du 27 août
    2021 concernant le renouvellement de l’autorisation du Clostridium butyricum
    FERM BP-2789 en tant qu’additif pour l’alimentation des poulettes destinées
    à la ponte, des dindons d’engraissement, des dindons élevés pour la reproduction,
    des espèces aviaires mineures (à l’exception des oiseaux pondeurs), des porcelets
    sevrés et des espèces porcines mineures sevrées, son autorisation pour les
    poulets d’engraissement, les porcelets non sevrés et les espèces porcines
    mineures non sevrées, et abrogeant les règlements d’exécution (UE) no 373/2011,
    (UE) no 374/2013 et (UE) no 1108/2014 (titulaire de l’autorisation: Miyarisan
    Pharmaceutical Co. Ltd, représentée par Huvepharma NV Belgique)'
