title:
- language: en
  script: Latn
  content: Council Directive 92/117/EEC of 17 December 1992 concerning measures for
    protection against specified zoonoses and specified zoonotic agents in animals
    and products of animal origin in order to prevent outbreaks of food-borne infections
    and intoxications
  type: main
- language: fr
  script: Latn
  content: Directive 92/117/CEE du Conseil, du 17 décembre 1992, concernant les mesures
    de protection contre certaines zoonoses et certains agents zoonotiques chez les
    animaux et dans les produits d'origine animale, en vue de prévenir les foyers
    d'infection et d'intoxication dus à des denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 92/117/EWG des Rates vom 17. Dezember 1992 über Maßnahmen
    zum Schutz gegen bestimmte Zoonosen bzw. ihre Erreger bei Tieren und Erzeugnissen
    tierischen Ursprungs zur Verhütung lebensmittelbedingter Infektionen und Vergiftungen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 92/117/EHS ze dne 17. prosince 1992 o ochranných opatřeních
    proti některým zoonózám a některým původcům zoonóz u zvířat a v produktech
    živočišného původu se zaměřením na předcházení ohniskům infekce a
    otravám z potravin
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 92/117/EØF af 17. december 1992 om beskyttelsesforanstaltninger
    over for specifikke zoonoser og specifikke zoonotiske agenser hos dyr og i animalske
    produkter for at forhindre levnedsmiddelbårne infektioner og forgiftninger
  type: main
- language: el
  script: Grek
  content: Οδηγία 92/117/ΕΟΚ του Συμβουλίου της 17ης Δεκεμβρίου
    1992 για τα μέτρα προστασίας από ορισμένες ζωονόσους
    και ορισμένους ζωονοσογόνους παράγοντες στα
    ζώα και τα προϊόντα ζωικής προέλευσης, προκειμένου
    να αποφευχθούν οι εστίες λοιμώξεων και δηλητηριάσεων
    που οφείλονται στα τρόφιμα
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 92/117/EMÜ, 17. detsember 1992, konkreetsete zoonooside
    ja konkreetsete zoonootilise toimega mõjurite vastaste kaitsemeetmete kohta loomadel
    ja loomsetel saadustel toidu kaudu saadavate nakkushaiguste ja mürgistuste vältimiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 92/117/ETY, annettu 17 päivänä joulukuuta 1992,
    tiettyjä eläimissä ja eläinperäisissä tuotteissa esiintyviä zoonooseja
    ja zoonoosien aiheuttajia koskevista suojatoimenpiteistä elintarvikkeista aiheutuvien
    tartunta- ja myrkytyspesäkkeiden ehkäisemiseksi
  type: main
- language: hu
  script: Latn
  content: A Tanács 92/117/EGK irányelve (1992. december 17.) az élelmiszerből
    származó fertőzések és mérgezések megelőzése érdekében az állatokban
    és állati eredetű termékekben előforduló meghatározott zoonózisok és
    meghatározott zoonózis-kórokozók elleni védekezési intézkedésekről
  type: main
- language: it
  script: Latn
  content: Direttiva 92/117/CEE del Consiglio, del 17 dicembre 1992, riguardante le
    misure di protezione dalle zoonosi specifiche e la lotta contro agenti zoonotici
    specifici negli animali e nei prodotti di origine animale allo scopo di evitare
    focolai di infezioni e intossicazioni alimentari
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 92/117/EEK (1992. gada 17. septembris) par aizsardzības
    pasākumiem pret īpašām zoonozēm un īpašiem zoonožu ierosinātājiem dzīvniekos
    un dzīvnieku izcelsmes produktos ar mērķi aizkavēt pārtikas izraisītu infekciju
    un intoksikāciju uzliesmojumus
  type: main
- language: lt
  script: Latn
  content: 1992 m. gruodžio 17 d. Tarybos direktyva 92/117/EEB dėl priemonių, skirtų
    apsisaugoti nuo nurodytų zoonozių ir nurodytų zoonozių sukėlėjų gyvūnuose
    ir gyvūninės kilmės produktuose, siekiant užkirsti kelią su maistu plintančioms
    infekcijoms ir apsinuodijimui
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 92/117/KEE tas-17 ta' Diċembru 1992 rigward miżuri
    ta' protezzjoni kontra żonosijiet speċifikati u l-aġenti żonotiċi speċifikati
    u l-prodotti ta' oriġini mill-annimali sabiex jipprevjenu pases ta' infezzjonijiet
    u intossikazzjonijiet miġrura bl-ikel
  type: main
- language: nl
  script: Latn
  content: Richtlijn 92/117/EEG van de Raad van 17 december 1992 inzake maatregelen
    voor de bescherming tegen bepaalde zoönoses en bepaalde zoönoseverwekkers bij
    dieren en in produkten van dierlijke oorsprong ten einde door voedsel overgedragen
    infecties en vergiftigingen te voorkomen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 92/117/EWG z dnia 17 grudnia 1992 r. dotycząca środków
    ochrony przed określonymi chorobami odzwierzęcymi i odzwierzęcymi czynnikami
    chorobotwórczymi u zwierząt i w produktach pochodzenia zwierzęcego, w celu
    zapobieżenia zakażeniom i zatruciom przenoszonym przez żywność
  type: main
- language: pt
  script: Latn
  content: Directiva 92/117/CEE do Conselho, de 17 de Dezembro de 1992, relativa às
    medidas de protecção contra zoonoses e certos agentes zoonóticos em animais
    e produtos de origem animal a fim de evitar focos de infecção e de intoxicação
    de origem alimentar
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 92/117/EHS zo 17. decembra 1992 týkajúca sa opatrení na
    ochranu proti určitým zoonózam a určitým pôvodcom zoonóz u zvierat a vo
    výrobkoch živočíšneho pôvodu s cieľom zabrániť ohniskám infekcie a intoxikácie
    spôsobených požívatinami
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 92/117/EGS z dne 17. decembra 1992 o ukrepih za zaščito
    pred določenimi zoonozami ter nekaterimi povzročitelji zoonoz pri živalih in
    proizvodih živalskega izvora, zato da se preprečijo izbruhi okužb, ki se prenašajo
    s hrano, in zastrupitve
  type: main
- language: es
  script: Latn
  content: Directiva 92/117/CEE del Consejo, de 17 de diciembre de 1992, relativa
    a las medidas de protección contra determinadas zoonosis y determinados agentes
    productores de zoonosis en animales y productos de origen animal, a fin de evitar
    el brote de infecciones e intoxicaciones procedentes de los alimentos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 92/117/EEG av den 17 december 1992 om skyddsåtgärder
    mot specifika zoonoser och zoonotiska agenser hos djur och animaliska produkter
    för att förhindra utbrott av livsmedelsburna infektioner och förgiftningar
  type: main
