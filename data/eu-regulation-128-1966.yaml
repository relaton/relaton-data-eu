    zwischen auf dem Weltmarkt angebotenem finnischem Hafer und der für den Schwellenpreis
    maDgebenden Standardqualität
  type: main
- language: it
  script: Latn
  content: Regolamento n. 128/66/CEE della Commissione, del 12 settembre 1966, modificante
