title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1815/74 of the Council of 11 July 1974 amending Regulation
    (EEC) No 3509/73 on the opening of tariff preferences in the form of a partial
    suspension of customs duties for products made from jute and coir originating
    in India and products made from jute originating in Bangladesh
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1815/74 du Conseil, du 11 juillet 1974, modifiant
    le règlement (CEE) n° 3509/73 portant ouverture de préférences tarifaires
    sous forme de suspensions partielles des droits de douane pour des produits manufacturés
    de jute et de coco originaires de l'Inde et des produits manufacturés de jute
    originaires du Bangladesh
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1815/74 des Rates vom 11. Juli 1974 zur Änderung
    der Verordnung (EWG) Nr. 3509/73 zur Eröffnung von Zollpräferenzen in Form von
    teilweisen Aussetzungen der Zollsätze für Fertigwaren aus Jute und Kokosfasern
    mit Ursprung in Indien und für Fertigwaren aus Jute mit Ursprung in Bangla Desh
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1815/74 af 11. juli 1974 om ændring af forordning
    (EØF) nr. 3509/73 om åbning af toldpræferencer i form af delvis toldsuspension
    for forarbejdede varer af jute og kokos med oprindelse i Indien og forarbejdede
    varer af jute med oprindelse i Bangla Desh
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1815/74 del Consiglio, dell'11 luglio 1974, che modifica
    il regolamento (CEE) n. 3509/73 relativo alla concessione di preferenze tariffarie
    sotto forma di sospensione parziale dei dazi doganali per taluni manufatti di
    iuta e di cocco originari dell'India e per taluni manufatti di iuta originari
    del Bangladesh
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1815/74 van de Raad van 11 juli 1974 tot wijziging
    van Verordening (EEG) nr. 3509/73 betreffende de opening van tariefpreferenties
    in de vorm van gedeeltelijke schorsingen van de douanerechten voor industrieprodukten
    van jute en van kokos van oorsprong uit India en voor industrieprodukten van jute
    van oorsprong uit Bangla Desh
  type: main
