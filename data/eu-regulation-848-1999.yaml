title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 848/1999 of 23 April 1999 determining the
    extent to which the applications for import licences submitted in April 1999 for
    certain dairy products under certain tariff quotas opened by Regulation (EC) No
    1374/98 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 848/1999 de la Commission du 23 avril 1999 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en avril 1999 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n° 1374/98 de la Commission peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 848/1999 der Kommission vom 23. April 1999 zur Festlegung
    des Umfangs, in dem den im April 1999 gestellten Anträgen auf Erteilung von Lizenzen
    für die Einfuhr von Milcherzeugnissen im Rahmen der durch die Verordnung (EG)
    Nr. 1374/98 eröffneten Zollkontingente stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 848/1999 af 23. april 1999 om, i hvilket
    omfang de ansøgninger om importlicenser, som er indgivet i april 1999 vedrørende
    visse mejeriprodukter inden for de toldkontingenter, der blev åbnet ved forordning
    (EF) nr. 1374/98, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 848/1999 της Επιτροπής
    της 23ης Απριλίου 1999 που καθορίζει το κατά πόσον
    μπορούν να γίνουν δεκτές οι αιτήσεις πιστοποιητικών
    εισαγωγής που υπεβλήθησαν τον Απρίλιο 1999 για
    ορισμένα γαλακτοκομικά προϊόντα στο πλαίσιο
    ορισμένων δασμολογικών ποσοστώσεων που θεσπίσθηκαν
    με τον κανονισμό (ΕΚ) αριθ. 1374/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 848/1999, annettu 23 päivänä huhtikuuta 1999,
    asetuksessa (EY) N:o 1374/98 avattuihin tariffikiintiöihin kuuluville maitotuotteille
    huhtikuussa 1999 käyttöön otettujen tuontitodistusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 848/1999 della Commissione del 23 aprile 1999 che stabilisce
