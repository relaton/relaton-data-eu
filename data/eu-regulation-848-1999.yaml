    die in april 1999 voor bepaalde melkproducten zijn ingediend in het kader van
    bepaalde tariefcontingenten, geopend bij Verordening (EG) nr. 1374/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 848/1999 da Comissão de 23 de Abril de 1999 que determina
