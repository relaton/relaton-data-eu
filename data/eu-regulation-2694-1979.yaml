title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2694/79 of 29 November 1979 re-establishing
    the levying of customs duties on narrow woven fabrics, and narrow fabrics (bolduc),
    falling within heading No ex 58.05 and originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2694/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables à la rubanerie
    et aux rubans sans trame en fils ou en fibres parallélisés, de la position EX
    58.05 du tarif douanier commun, originaires de l'Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2694/79 DER KOMMISSION VOM 29. NOVEMBER 1979 UEBER
    DIE WIEDEREINFUEHRUNG DES ZOLLSATZES FUER BAENDER UND SCHUSSLOSE BAENDER AUS PARALLEL
    GELEGTEN UND GEKLEBTEN GARNEN ODER SPINNSTOFFEN DER TARIFNUMMER EX 58.05 MIT URSPRUNG
    IN INDIEN, DEM DIE IN DER VERORDNUNG ( EWG ) NR. 1195/79 DES RATES VORGESEHENEN
    ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2694/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for vævede bånd og bånd af sammenlimede parallelle
    garner eller fibre under position ex 58.05, som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2694/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI NASTRI, GALLONI
    E SIMILI, E NASTRI SENZA TRAMA DI FIBRE O DI FILI DISPOSTI PARALLELAMENTE, ECC.,
    DELLA VOCE DOGANALE EX 58.05, ORIGINARI DELL' INDIA BENEFICIARIA DELLE PREFERENZE
    TARIFFARIE PREVISTE DAL REGOLAMENTO ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2694/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op lint, alsmede
    bolduclint, zijnde lint zonder inslag van aaneengelijmde evenwijdig lopende draden
    of textielvezels, van post ex 58.05, van oorsprong uit India waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening ( EEG ) nr. 1195/79 van
    de Raad
  type: main
