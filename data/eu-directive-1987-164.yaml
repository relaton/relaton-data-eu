    de las legislaciones de los Estados Miembros relativas a la protección de los
    trabajadores asalariados en caso de insolvencia del empresario
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 87/164/EEG av den 2 mars 1987 om ändring, på grund av
    Spaniens anslutning, av direktiv 80/987/EEG om tillnärmning av medlemsstaternas
    lagstiftning om skydd för arbetstagarna vid arbetsgivarens insolvens
