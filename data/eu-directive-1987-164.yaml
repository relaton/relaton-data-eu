    susijusių su darbuotojų apsauga jų darbdaviui tapus nemokiam, suderinimo
  type: main
- language: mt
  script: Latn
  content: Id–Direttiva tal-Kunsill tat-2 ta' Marzu 1987 li temenda, minħabba l-adeżjoni
