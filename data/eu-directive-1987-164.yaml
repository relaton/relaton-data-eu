    attiecībā uz darbinieku aizsardzību to darba devēja maksātnespējas gadījumā
  type: main
- language: lt
  script: Latn
  content: 1987 m. kovo 2 d. Tarybos Direktyva iš dalies pakeičianti, atsižvelgiant
