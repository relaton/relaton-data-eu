    Membri dwar il-protezzjoni ta' l-impjegati f'każ ta' l-insolvenza ta' min iħaddimhom
  type: main
- language: nl
  script: Latn
  content: Richtlijn 87/164/EEG van de Raad van 2 maart 1987 tot wijziging, in verband
    met de toetreding van Spanje, van Richtlijn 80/987/EEG betreffende de onderlinge
    aanpassing van de wetgevingen der Lid-Staten inzake de bescherming van de werknemers
    bij insolventie van de werkgever
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 2 marca 1987 r. zmieniająca w związku z przystąpieniem
    Hiszpanii dyrektywę nr 80/987/EWG w sprawie zbliżania przepisów prawnych Państw
    Członkowskich dotyczących ochrony pracowników na wypadek niewypłacalności
    ich pracodawcy
  type: main
- language: pt
  script: Latn
  content: Directiva 87/164/CEE do Conselho de 2 de Março de 1987 que altera, em
    função da adesão de Espanha, a Directiva 80/987/CEE respeitante à aproximação
    de legislações dos Estados-Membros relativas à protecção dos trabalhadores
    assalariados em caso de insolvabilidade do empregador
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 2. marca 1987, ktorou sa mení a dopĺňa v súvislosti
    s pristúpením Španielska smernica 80/987/EHS o aproximácii právnych predpisov
    členských štátov, vzťahujúcich sa na ochranu zamestnancov v prípade platobnej
    neschopnosti ich zamestnávateľa
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 2. marca 1987 ki zaradi pristopa Španije spreminja
    Direktivo 80/987/EGS o približevanju zakonodaje držav članic o varstvu delavcev
    v primeru plačilne nesposobnosti njihovega delodajalca
  type: main
- language: es
  script: Latn
  content: Directiva 87/164/CEE del Consejo de 2 de marzo de 1987 por la que se modifica,
