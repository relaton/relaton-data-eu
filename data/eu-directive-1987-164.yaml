title:
- language: en
  script: Latn
  content: Council Directive 87/164/EEC of 2 March 1987 amending, on account of the
    accession of Spain, Directive 80/987/EEC on the approximation of the laws of the
    Member States relating to the protection of employees in the event of the insolvency
    of their employer
  type: main
- language: fr
  script: Latn
  content: Directive 87/164/CEE du Conseil du 2 mars 1987 modifiant, en raison de
    l'adhésion de l'Espagne, la directive 80/987/CEE concernant le rapprochement
    des législations des États membres relatives à la protection des travailleurs
    salariés en cas d'insolvabilité de l'employeur
  type: main
- language: de
  script: Latn
  content: Richtlinie 87/164/EWG des Rates vom 2. März 1987 zur aufgrund des Beitritts
    Spaniens erfolgenden Änderung der Richtlinie 80/987/EWG Angleichung der Rechtsvorschriften
    der Mitgliedstaaten über den Schutz der Arbeitnehmer bei Zahlungsunfähigkeit
    des Arbeitgebers
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 2. března 1987, kterou se v důsledku přistoupení
    Španělska mění směrnice 80/987/EHS o sbližování právních předpisů
    členských států týkajících se ochrany zaměstnanců v případě platební
    neschopnosti zaměstnavatele
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 87/164/EØF af 2. marts 1987 om ændring, som følge af
    Spaniens tiltrædelse, af direktiv 80/987/EØF om indbyrdes tilnærmelse af medlemsstaternes
    lovgivning om beskyttelse af arbejdstagerne i tilfælde af arbejdsgiverens insolvens
  type: main
- language: el
  script: Grek
  content: Οδηγία 87/164/ΕΟΚ του Συμβουλίου της 2ας Μαρτίου
    1987 για την τροποποίηση, λόγω της προσχώρησης
    της Ισπανίας, της οδηγίας 80/987/ΕΟΚ περί προσέγγισης
    των νομοθεσιών των κρατών μελών σχετικά με
    την προστασία των μισθωτών σε περίπτωση αφερεγγυότητας
    του εργοδότη
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 2. märts 1987, millega muudetakse Hispaania ühinemise
    tõttu direktiivi 80/987/EMÜ töötajate kaitset tööandja maksejõuetuse korral
    käsitlevate liikmesriikide õigusaktide ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 87/164/ETY, annettu 2 päivänä maaliskuuta 1987,
    työntekijöiden suojaa työnantajan maksukyvyttömyystilanteessa koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun direktiivin 80/987/ETY muuttamisesta
    Espanjan liittymisen vuoksi
  type: main
- language: hu
  script: Latn
  content: A Tanács 87/164/EGK irányelve (1987. március 2.) a munkáltató fizetésképtelensége
    esetén a munkavállalók védelmére vonatkozó tagállami jogszabályok közelítéséről
    szóló 80/987/EGK irányelv Spanyolország csatlakozása folytán történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 87/164/CEE del Consiglio del 2 marzo 1987 che modifica, a seguito
    dell'adesione della Spagna, la direttiva 80/987/CEE concernente il ravvicinamento
    delle legislazioni degli Stati Membri relative alla tutela dei lavoratori subordinati
    in caso di insolvenza del datore di lavoro
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1987. gada 2. marts), ar ko, ņemot vērā Spānijas
