title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 967/76 of 27 April 1976 re-establishing
    the levying of customs duties on under garments, knitted or crocheted, not elastic
    or rubberized, of cotton, falling within subheading 60.04 A, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 967/76 de la Commission, du 27 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux sous-vêtements
    de bonneterie non élastiqué ni caoutchoutée, de coton, de la sous- position
    tarifaire 60.04 A, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3002/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 967/76 der Kommission vom 27. April 1976 über die
    Wiedereinführung des Zollsatzes für Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle, der Tarifstelle 60.04 A, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3002/75 des Rates vom 17. November 1975
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 967/76 af 27. april 1976 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande af trikotage, ikke
    elastik eller gummeret, af bomuld, under underposition 60.04 A, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 967/76 della Commissione, del 27 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti a maglia
    non elastica né gommata, di cotone, della sottovoce doganale n. 60.04 A originarie
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 967/76 van de Commissie van 27 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op onderkleding
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, van katoen, van onderverdeling
    60.04 A, van oorsprong uit de onwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3002/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
