id: EUDecision1973172
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 June 1973 authorizing the Italian Republic not
    to apply Community treatment to outboard motors falling within headings No 84.06
    B of the Common Customs Tariff, originating in Japan and in free circulation in
    the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 73/172/CEE de la Commission, du 18 juin 1973, autorisant la République
    italienne à exclure du traitement communautaire les propulseurs spéciaux du
    type hors bord, de la position 84.06 B du Tarif douanier commun, originaires du
    Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Juni 1973, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Außenbordmotoren der Tarifnummer 84.06 B des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 18. juni 1973 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage påhængsmotorer til både,
    som henhører under position 84.06 B i den fælles toldtarif, har oprindelse i
    Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 giugno 1973, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i propulsori speciali del tipo
    fuoribordo della voce n. 84.06 B della tariffa doganale comune, originari del
    Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 juni 1973 waarbij de Italiaanse Republiek
    wordt gemachtigd buitenboordmotoren van post 84.06 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
