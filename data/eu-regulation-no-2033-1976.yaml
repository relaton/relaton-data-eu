title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2033/76 of 17 August 1976 fixing the amounts
    by which the variable component of the levy on bran and sharps originating in
    Algeria, Morocco or Tunisia is to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2033/76 de la Commission, du 17 août 1976, fixant
    le montant dont doit être diminué l'élément mobile du prélèvement applicable
    aux sons et remoulages originaires d'Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2033/76 der Kommission vom 17. August 1976 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2033/76 af 17. august 1976 om fastsættelse
    af det beløb, hvormed det variable element i importafgiften for klid med oprindelse
    i Algeriet, Marokko og Tunesien skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2033/76 della Commissione, del 17 agosto 1976, che
    fissa l'importo di cui deve essere diminuito l'elemento mobile del prelievo applicabile
    alle crusche e stacciature originarie dell'Algeria, del Marocco e della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2033/76 van de Commissie van 17 augustus 1976 tot
    vaststelling van het bedrag waarmee het variabele element van de heffing die van
    toepassing is op zemelen en slijpsel van oorsprong uit Algerije, Marokko en Tunesië
    moet worden verminderd
