  content: Commission Regulation (EEC) No 1729/82 of 30 June 1982 temporarily suspending
    certain provisions of Regulation (EEC) No 2042/75 on special detailed rules for
    the application of the system of import and export licences for cereals and rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1729/82 de la Commission, du 30 juin 1982, relatif
