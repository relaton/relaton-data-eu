    Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen für Getreide und
    Reis
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1729/82 af 30. juni 1982 om suspension
