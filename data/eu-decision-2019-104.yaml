    stabbilit taħt il-Ftehim dwar Sħubija Ekonomika, Koordinazzjoni Politika u Koperazzjoni
    bejn il-Komunità Ewropea u l-Istati Membri tagħha, min-naħa l-waħda, u l-Istati
    Uniti Messikani, min-naħa l-oħra, fir-rigward tal-emendar tad-Deċiżjonijiet
    tal-Kunsill Konġunt Nru 2/2000 u Nru 2/2001 sabiex jittieħed kont tal-adeżjoni
    tar-Repubblika tal-Kroazja mal-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2019/104 van de Raad van 22 mei 2018 betreffende het namens
    de Europese Unie in de Gezamenlijke Raad EU-Mexico die is opgericht in het kader
    van de Overeenkomst inzake economisch partnerschap, politieke coördinatie en
    samenwerking tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de
    Verenigde Mexicaanse Staten, anderzijds, in te nemen standpunt met betrekking
    tot de wijziging van de Besluiten nr. 2/2000 en nr. 2/2001 van de Gezamenlijke
    Raad om rekening te houden met de toetreding van de Republiek Kroatië tot de
    Europese Unie
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2019/104 z dnia 22 maja 2018 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej, w ramach Wspólnej Rady UE–Meksyk
    ustanowionej na mocy Umowy o partnerstwie gospodarczym oraz koordynacji politycznej
    i współpracy między Wspólnotą Europejską i jej państwami członkowskimi,
    z jednej strony, a Meksykańskimi Stanami Zjednoczonymi, z drugiej strony, w związku
    ze zmianą decyzji Wspólnej Rady nr 2/2000 i nr 2/2001 w celu uwzględnienia
    przystąpienia Republiki Chorwacji do Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2019/104 do Conselho, de 22 de maio de 2018, relativa à
    posição a tomar, em nome da União Europeia, no âmbito do Conselho Conjunto
    UE-México estabelecido pelo Acordo de Parceria Económica, de Concertação Política
    e de Cooperação entre a Comunidade Europeia e os seus Estados-Membros, por um
    lado, e os Estados Unidos Mexicanos, por outro, que respeita à alteração das
    Decisões n.° 2/2000 e n.° 2/2001 do Conselho Conjunto, a fim de ter em conta
    a adesão da República da Croácia à União Europeia
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2019/104 a Consiliului din 22 mai 2018 privind poziția care
    urmează să fie adoptată, în numele Uniunii Europene, în cadrul Consiliului
    mixt UE-Mexic instituit prin Acordul de parteneriat economic, de coordonare politică
    și de cooperare dintre Comunitatea Europeană și statele membre ale acesteia,
    pe de o parte, și Statele Unite Mexicane, pe de altă parte, în ceea ce privește
    modificarea Deciziilor nr. 2/2000 și nr. 2/2001 ale Consiliului mixt pentru a
    se ține seama de aderarea Republicii Croația la Uniunea Europeană
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2019/104 z 22. mája 2018 o pozícii, ktorá sa
    má v mene Európskej únie prijať v Spoločnej rade EÚ – Mexiko zriadenej
    Dohodou o hospodárskom partnerstve, politickej koordinácii a spolupráci medzi
    Európskym spoločenstvom a jeho členskými štátmi na jednej strane a Spojenými
    štátmi mexickými na strane druhej pokiaľ ide o zmeny rozhdnutí Spoločnej
    rady č. 2/2000 a č. 2/2001na účely zohľadnenia pristúpenia Chorvátskej
    republiky k Európskej únii
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2019/104 z dne 22. maja 2018 o stališču, ki se v imenu
    Evropske unije zavzame v Skupnem svetu EU-Mehika, ustanovljenem na podlagi Sporazuma
    o gospodarskem partnerstvu in političnem usklajevanju in sodelovanju med Evropsko
    skupnostjo in njenimi državami članicami na eni strani ter Združenimi mehiškimi
    državami na drugi, v zvezi s spremembo sklepov št. 2/2000 in št. 2/2001 Skupnega
    sveta zaradi upoštevanja pristopa Republike Hrvaške k Evropski uniji
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2019/104 del Consejo, de 22 de mayo de 2018, relativa a
    la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    conjunto UE-México creado en el marco del Acuerdo de asociación económica,
    concertación política y cooperación entre la Comunidad Europea y sus Estados
    miembros, por una parte, y los Estados Unidos Mexicanos, por otra, con respecto
    a la modificación de las Decisiones n.° 2/2000 y n.° 2/2001 del Consejo conjunto,
    para tener en cuenta la adhesión de la República de Croacia a la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2019/104 av den 22 maj 2018 om den ståndpunkt som
    ska intas, på Europeiska unionens vägnar, i gemensamma rådet EU–Mexiko, som
    inrättades genom avtalet om ekonomiskt partnerskap, politisk samordning och samarbete
    mellan Europeiska gemenskapen och dess medlemsstater, å ena sidan, och Mexikos
    förenta stater, å andra sidan, när det gäller ändringar av Gemensamma rådets
    beslut nr 2/2000 och nr 2/2001 med anledning av Republiken Kroatiens anslutning
    till Europeiska unionen
