title:
- language: en
  script: Latn
  content: Council Decision (EU) 2019/104 of 22 May 2018 on the position to be adopted,
    on behalf of the European Union, within the EU-Mexico Joint Council established
    under the Economic Partnership, Political Coordination and Cooperation Agreement
    between the European Community and its Member States, of the one part, and the
    United Mexican States, of the other part, as regards the amendment of Decisions
    No 2/2000 and No 2/2001 of the Joint Council to take account of the accession
    of the Republic of Croatia to the European Union
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2019/104 du Conseil du 22 mai 2018 relative à la position
    à prendre, au nom de l'Union européenne, au sein du Conseil conjoint UE-Mexique
    institué dans le cadre de l'accord de partenariat économique, de coordination
    politique et de coopération entre la Communauté européenne et ses États membres,
    d'une part, et les États-Unis mexicains, d'autre part, concernant la modification
    des décisions n° 2/2000 et n° 2/2001 du Conseil conjoint pour tenir compte
    de l'adhésion de la République de Croatie à l'Union européenne
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2019/104 des Rates vom 22. Mai 2018 über den im Namen der
    Europäischen Union in dem durch das Abkommen über wirtschaftliche Partnerschaft,
    politische Koordinierung und Zusammenarbeit zwischen der Europäischen Gemeinschaft
    und ihren Mitgliedstaaten einerseits und den Vereinigten Mexikanischen Staaten
    andererseits eingerichteten Gemischten Rat EU-Mexiko hinsichtlich der Änderungen
    der Beschlüsse Nr. 2/2000 und Nr. 2/2001 des Gemischten Rates anlässlich des
    Beitritts der Republik Kroatien zur Europäischen Union zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2019/104 на Съвета от 22 май 2018 година
    за позицията, която трябва да се заеме от името
    на Европейския съюз в рамките на Съвместния
    съвет ЕС—Мексико, създаден съгласно Споразумението
    за икономическо партньорство, политическо
    координиране и сътрудничество между Европейската
    общност и нейните държави членки, от една страна,
    и Съединените мексикански щати, от друга страна,
    във връзка с изменението на решения № 2/2000 и
    № 2/2001 на Съвместния съвет, за да се вземе предвид
    присъединяването на Република Хърватия към
    Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2019/104 ze dne 22. května 2018 o postoji, který
    má být zaujat jménem Evropské unie ve Smíšené radě EU-Mexiko, zřízené
    podle Dohody o hospodářském partnerství, politické koordinaci a spolupráci
    mezi Evropským společenstvím a jeho členskými státy na jedné straně a
    Spojenými státy mexickými na straně druhé, ke změně rozhodnutí Smíšené
    rady č. 2/2000 a č. 2/2001 s ohledem na přistoupení Chorvatské republiky
    k Evropské unii
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2019/104 af 22. maj 2018 om den holdning, der skal
    indtages på Den Europæiske Unions vegne i Det Fælles Råd EU-Mexico, der er
    nedsat ved aftalen om økonomisk partnerskab og politisk samordning og samarbejde
    mellem Det Europæiske Fællesskab og dettes medlemsstater på den ene side og
    De Forenede Mexicanske Stater på den anden side, for så vidt angår ændring
    af det fælles råds afgørelse nr. 2/2000 og 2/2001 for at tage hensyn til Republikken
    Kroatiens tiltrædelse af Den Europæiske Union
  type: main
- language: el
