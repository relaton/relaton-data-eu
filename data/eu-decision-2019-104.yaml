    kumppanuutta, poliittista yhteensovittamista sekä yhteistyötä koskevassa sopimuksessa
    perustetussa EU–Meksiko-yhteisneuvostossa Euroopan unionin puolesta esitettävästä
    kannasta yhteisneuvoston päätösten N:o 2/2000 ja N:o 2/2001 muuttamiseen Kroatian
    tasavallan Euroopan unioniin liittymisen huomioon ottamiseksi
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2019/104 od 22. svibnja 2018. o stajalištu koje treba
    zauzeti, u ime Europske unije, u okviru Zajedničkog vijeća EU-Meksiko koje je
    osnovano na temelju Sporazuma o gospodarskom partnerstvu, političkoj koordinaciji
    i suradnji između Europske zajednice i njezinih država članica, s jedne strane,
    i Sjedinjenih Meksičkih Država, s druge strane, u pogledu izmjene odluka Zajedničkog
    vijeća br. 2/2000 i br. 2/2001 kako bi se uzelo u obzir pristupanje Republike
    Hrvatske Europskoj uniji
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2019/104 határozata (2018. május 22.) az Európai Unió
    által az egyrészről az Európai Közösség és annak tagállamai, valamint
    másrészről a Mexikói Egyesült Államok között létrejött gazdasági partnerségi,
    politikai koordinációs és együttműködési megállapodás által létrehozott
    EU–Mexikó Vegyes Tanácsban képviselendő álláspontról, a Vegyes Tanács
    2/2000 és 2/2001 sz. határozatának módosításával kapcsolatban, a Horvát
    Köztársaság Európai Unióhoz történő csatlakozásának figyelembevétele
    céljából
  type: main
