---
id: EUDecision2006205
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2006/205/CFSP of 10 March 2006 implementing Common Position
    2004/694/CFSP on further measures in support of the effective implementation of
    the mandate of the International Criminal Tribunal for the former Yugoslavia (ICTY)
  type: main
- language: fr
  script: Latn
  content: Décision 2006/205/PESC du Conseil du 10 mars 2006 mettant en œuvre la
    position commune 2004/694/PESC concernant de nouvelles mesures définies à l'appui
    d'une mise en œuvre effective du mandat du Tribunal pénal international pour
    l'ex-Yougoslavie (TPIY)
  type: main
- language: de
  script: Latn
  content: Beschluss des Rates 2006/205/GASP vom 10. März 2006 zur Durchführung
    des Gemeinsamen Standpunkts 2004/694/GASP betreffend weitere Maßnahmen zur Unterstützung
    der wirksamen Ausführung des Mandats des Internationalen Strafgerichtshofs für
    das ehemalige Jugoslawien (ICTY)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2006/205/SZBP ze dne 10. března 2006 , kterým se provádí
    společný postoj 2004/694/SZBP o dalších opatřeních na podporu účinného
    provádění mandátu Mezinárodního trestního tribunálu pro bývalou Jugoslávii
    (ICTY)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2006/205/FUSP af 10. marts 2006 om gennemførelse af
    fælles holdning 2004/694/FUSP om yderligere foranstaltninger til støtte for
    den effektive gennemførelse af mandatet til Det Internationale Krigsforbrydertribunal
    vedrørende Det Tidligere Jugoslavien (ICTY)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2006/205/ΚΕΠΠΑ του Συμβουλίου, της
    10ης Μαρτίου 2006 , η οποία θέτει σε εφαρμογή την
    κοινή θέση 2004/694/ΚΕΠΠΑ για περαιτέρω μέτρα προς
    υποστήριξη της αποτελεσματικής εφαρμογής
    της εντολής του Διεθνούς Ποινικού Δικαστηρίου
    για την πρώην Γιουγκοσλαβία (ICTY)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2006/205/ÜVJP, 10. märts 2006 , millega rakendatakse ühist
    seisukohta 2004/694/ÜVJP edasiste meetmete kohta, millega toetatakse endise Jugoslaavia
    asjade rahvusvahelise kriminaalkohtu (EJRK) volituste tõhusat rakendamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2006/205/YUTP, tehty 10 päivänä maaliskuuta 2006
    , entisen Jugoslavian alueen kansainvälisen rikostuomioistuimen toimeksiannon
    tehokasta täytäntöönpanoa tukevista lisätoimenpiteistä hyväksytyn yhteisen
    kannan 2004/694/YUTP täytäntöönpanosta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/205/KKBP határozata ( 2006. március 10. ) a volt Jugoszláviában
    elkövetett háborús bűncselekményeket vizsgáló Nemzetközi Törvényszék
    (ICTY) célkitűzései hatékony végrehajtásának támogatására irányuló
    további intézkedésekről szóló 2004/694/KKBP közös álláspont végrehajtásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2006/205/PESC del Consiglio, del 10 marzo 2006 , che applica
    la posizione comune 2004/694/PESC relativa ad ulteriori misure definite a sostegno
    dell’effettiva attuazione del mandato del Tribunale penale internazionale per
    la ex Iugoslavia (ICTY)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2006/205/KĀDP ( 2006. gada 10. marts ), ar ko īsteno
    Kopējo nostāju 2004/694/KĀDP par turpmākiem pasākumiem, lai atbalstītu sekmīgu
    Starptautiskā Kara noziegumu tribunāla bijušajai Dienvidslāvijai ( ICTY )
    mandāta īstenošanu
  type: main
- language: lt
  script: Latn
  content: 2006 m. kovo 10 d. Tarybos sprendimas 2006/205/BUSP, įgyvendinantis Bendrąją
    poziciją 2004/694/BUSP dėl tolesnių priemonių, remiančių veiksmingą Tarptautinio
    baudžiamojo tribunolo buvusiai Jugoslavijai (TBTBJ) mandato vykdymą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2006/205/PESK ta' l- 10 ta' Marzu 2006 li timplimenta
    l-Pożizzjoni Komuni 2004/694/PESK dwar miżuri oħra ta' appoġġ għall-implimentazzjoni
    effettiva tal-mandat tat-Tribunal Kriminali Internazzjonali għal dik li qabel
    kienet il-Jugoslavja (ICTY)
  type: main
- language: nl
  script: Latn
  content: Besluit 2006/205/GBVB van de Raad van 10 maart 2006 tot uitvoering van
    Gemeenschappelijk Standpunt 2004/694/GBVB betreffende aanvullende maatregelen
    ter ondersteuning van de daadwerkelijke uitvoering van het mandaat van het Internationaal
    Straftribunaal voor het voormalige Joegoslavië (ICTY)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2006/205/WPZiB z dnia 10 marca 2006 r. dotycząca wprowadzenia
    w życie wspólnego stanowiska 2004/694/WPZiB w sprawie dalszych środków wspierających
    skuteczne wykonywanie mandatu Międzynarodowego Trybunału Karnego dla byłej
    Jugosławii (ICTY)
  type: main
- language: pt
  script: Latn
  content: Decisão 2006/205/PESC do Conselho, de 10 de Março de 2006 , que executa
    a Posição Comum 2004/694/PESC relativa a medidas adicionais de apoio ao exercício
    efectivo do mandato do Tribunal Penal Internacional para a ex-Jugoslávia (TPIJ)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2006/205/SZBP z 10. marca 2006 , ktorým sa vykonáva
    spoločná pozícia 2004/694/SZBP o ďalších opatreniach na podporu efektívneho
    vykonávania mandátu Medzinárodného trestného tribunálu pre bývalú Juhosláviu
    (ICTY)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2006/205/SZVP z dne 10. marca 2006 o izvajanju Skupnega stališča
    2004/694/SZVP o nadaljnjih ukrepih v podporo učinkovitemu izvajanju mandata Mednarodnega
    kazenskega sodišča za nekdanjo Jugoslavijo (MKSJ)
  type: main
- language: es
  script: Latn
  content: Decisión 2006/205/PESC del Consejo, de 10 de marzo de 2006 , por la que
    se aplica la Posición Común 2004/694/PESC sobre otras medidas en apoyo de la
    aplicación efectiva del mandato del Tribunal Penal Internacional para la antigua
    Yugoslavia (TPIY)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2006/205/GUSP av den 10 mars 2006 om genomförande av gemensam
    ståndpunkt 2004/694/GUSP om ytterligare åtgärder till stöd för ett effektivt
    genomförande av Internationella tribunalen för f.d. Jugoslaviens (ICTY) uppgift
  type: main
