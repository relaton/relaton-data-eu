    της 25ης Ιανουαρίου 1983 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2767/75 περί θεσπίσεως των
    γενικών κανόνων που αφορούν το σύστημα το αποκαλούμενο
