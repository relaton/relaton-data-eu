  content: Council Regulation (EEC) No 220/83 of 25 January 1983 amending Regulation
    (EEC) No 2767/75 laying down general rules for the system of 'pilot products and
    derived products' enabling additional amounts to be fixed for pigmeat
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 220/83 du Conseil du 25 janvier 1983 modifiant le règlement
    (CEE) no 2767/75 établissant les règles générales relatives au système dit
    des produits pilotes et dérivés permettant la fixation de montants supplémentaires
    dans le secteur de la viande de porc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 220/83 des Rates vom 25. Januar 1983 zur Änderung
