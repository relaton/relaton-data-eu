    von Leit- und Folgeerzeugnissen' ' , das die Festsetzung von Zusatzbeträgen auf
    dem Schweinefleischsektor ermöglicht
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 220/83 af 25. januar 1983 om ændring af
    forordning (EØF) nr. 2767/75 om de almindelige regler vedrørende det såkaldte
    "system for ledeprodukter og følgeprodukter", der muliggør fastsættelse af
    tillægsafgifter inden for svinekødsektoren
  type: main
- language: el
  script: Grek
