  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 220/83 del Consiglio del 25 gennaio 1983 che modifica
    il regolamento (CEE) n. 2767/75 che stabilisce le norme generali relative al sistema
    detto dei "prodotti pilota e prodotti derivati" che consente la fissazione di
    importi supplementari nel settore delle carni suine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 220/83 van de Raad van 25 januari 1983 tot wijziging
