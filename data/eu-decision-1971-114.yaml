title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 février 1971, autorisant le Grand-Duché
    de Luxembourg à admettre, jusqu'au 31 mai 1971, la commercialisation de semences
    certifiées d'avoine ainsi que de blé et d'orge de printemps soumises à des
    exigences réduites
  type: main
- language: de
  script: Latn
  content: '71/114/EWG: Entscheidung der Kommission vom 19. Februar 1971 zur Ermächtigung
    des Großherzogtums Luxemburg, bis zum 31. Mai 1971 zertifiziertes Saatgut von
    Hafer sowie von Sommerweizen und Sommergerste mit minderen Anforderungen zum Verkehr
    zuzulassen'
  type: main
- language: it
  script: Latn
  content: '71/114/CEE: Decisione della Commissione, del 19 febbraio 1971, che autorizza
    il Granducato del Lussemburgo ad ammettere fino al 31 maggio 1971 la commercializzazione
    di sementi certificate di avena, di grano e d''orzo primaverile soggette a requisiti
    ridotti'
  type: main
- language: nl
  script: Latn
  content: '71/114/EEG: Beschikking van de Commissie van 19 februari 1971 tot machtiging
    van het Groothertogdom Luxemburg om tot en met 31 mei 1971 gecertificeerde zaden
    van haver, alsook van tarwe en zomergerst, waaraan minder strenge eisen zijn gesteld,
    tot de handel toe te laten'
  type: main
