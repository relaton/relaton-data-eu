title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/2966 of 21 November 2024 on the position to
    be adopted on behalf of the European Union within the Joint Committee established
    by the Agreement between European Economic Community and the Republic of Iceland,
    with regard to a decision concerning the amendment of Protocol 3 to that Agreement
    as regards permeability between the Regional Convention on pan-Euro-Mediterranean
    preferential rules of origin and the Transitional rules of origin
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2966 du Conseil du 21 novembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité mixte
    institué par l’accord entre la Communauté économique européenne et la République
    d’Islande, sur une décision concernant la modification du protocole n° 3 dudit
    accord en ce qui concerne la perméabilité entre la convention régionale sur
    les règles d’origine préférentielles paneuro-méditerranéennes et les règles
    d’origine transitoires
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/2966 des Rates vom 21. November 2024 über den Standpunkt,
