    Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Republik Island
    eingesetzt wurde, hinsichtlich eines Beschlusses zur Änderung des Protokolls
    Nr. 3 zum genannten Abkommen betreffend die Durchlässigkeit zwischen den Ursprungsregeln
    des Regionalen Übereinkommens über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    und den Übergangsregeln für den Ursprung zu vertreten ist
  type: main
- language: bg
