title:
- language: en
  script: Latn
  content: '94/665/EC: Commission Decision of 27 September 1994 amending the information
    contained in the list in the Annex to Commission Regulation (EC) No 3438/93 establishing,
    for 1994, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres'
  type: main
- language: fr
  script: Latn
  content: '94/665/CE: Décision de la Commission du 27 septembre 1994 modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CE) n° 3438/93
    établissant pour 1994 la liste des bateaux dont la longueur hors tout dépasse
    huit mètres, autorisés à pêcher la sole dans certaines zones de la Communauté
    à l''aide de chaluts à perches dont la longueur totale dépasse neuf mètres'
  type: main
- language: de
  script: Latn
  content: '94/665/EG: ENTSCHEIDUNG DER KOMMISSION vom 27. September 1994 zur Änderung
    bestimmter Angaben in der Liste des Anhangs der Verordnung (EG) Nr. 3438/93 zur
    Festlegung der Liste für 1994 der Schiffe mit einer Länge über alles von mehr
    als 8 m, die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen'
  type: main
- language: da
  script: Latn
  content: '94/665/EF: KOMMISSIONENS BESLUTNING af 27. september 1994 om ændring
    af visse oplysninger i listen i bilaget til forordning (EF) nr. 3438/93 om listen
    for 1994 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m'
  type: main
- language: el
  script: Grek
  content: '94/665/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 27ης Σεπτεμβρίου
    1994 για τροποποίηση ορισμένων στοιχείων του
    καταλόγου που εμφαίνεται στο παράρτημα του
    κανονισμού (ΕΟΚ) αριθ. 3438/93 που καταρτίζει, για
    το 1994, τον κατάλογο των σκαφών άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσα
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα'
  type: main
- language: it
  script: Latn
  content: '94/665/CE: DECISIONE DELLA COMMISSIONE del 27 settembre 1994 che modifica
    alcuni dati dell'' elenco che figura nell'' allegato del regolamento (CE) n. 3438/93
    che fissa l'' elenco, per il 1994, dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i nove
    metri'
  type: main
- language: nl
  script: Latn
  content: '94/665/EG: BESCHIKKING VAN DE COMMISSIE van 27 september 1994 tot wijziging
    van bepaalde gegevens van de lijst in de bijlage bij Verordening (EG) nr. 3438/93
    tot vaststelling voor 1994 van de lijst van vaartuigen met een lengte over alles
    van meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren
    waarvan de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen'
  type: main
- language: pt
  script: Latn
  content: '94/665/CE: DECISÃO DA COMISSÃO de 27 de Setembro de 1994 que altera
    certas informações da lista constante do anexo do Regulamento (CE) nº 3438/93
    que estabelece para 1994 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros'
  type: main
- language: es
  script: Latn
  content: '94/665/CE: DECISIÓN DE LA COMISIÓN de 27 de septiembre de 1994 que modifica
    algunos datos de la lista que figura en el Anexo del Reglamento (CE) nº 3438/93
    por el que se establece para 1994 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros'
  type: main
