title:
- language: en
  script: Latn
  content: '82/805/EEC: Commission Decision of 15 November 1982 establishing that
    the apparatus described as ''Quanta Ray - Nd: Yag Laboratory Laser System, model
    DCR-1A, with Pulsed Dye Laser, model PDL-1'' may not be imported free of Common
    Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/805/CEE: Décision de la Commission, du 15 novembre 1982, constatant
    que l''importation de l''appareil dénommé "Quanta Ray - Nd: Yag Laboratory Laser
    System, model DCR-1A, with Pulsed Dye Laser, model PDL-1" ne peut être faite
    en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/805/EWG: Entscheidung der Kommission vom 15. November 1982, mit der
    festgestellt wird, daß das Gerät ,,Quanta - Ray-Nd: Yag Laboratory Laser System,
    model DCR-1A, with Pulsed Dye Laser, model PDL-1" , nicht unter Befreiung von
    den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/805/EØF: Kommissionens beslutning af 15. november 1982 om fastslåelse
    af, at indførsel af apparatet "Quanta - Ray-Nd: Yag Laboratory Laser system,
    model DCR-1A, with Pulsed Dye Laser, model PDL-1" ikke kan ske med fritagelse
    for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/805/EOK: Απόφαση τής Επιτροπής τής 15ης Νοεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Quanta Ray - Nd: Yag Laboratory Laser System, model
    DCR-1A, with Pulsed Dye Laser, model PDL- 1» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/805/CEE: Decisione della Commissione, del 15 novembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Quanta Ray - Nd: Yag Laboratory
    Laser System, model DCR-1A, with Pulsed Dye Laser, model PDL- 1" non può avvenire
    in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/805/EEG: Beschikking van de Commissie van 15 november 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Quanta-Ray-Nd: YAG Laboratory Laser
    System, model DCR- 1A, with pulsed Dye Laser, model PDL-1" niet met vrijstelling
    van de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
