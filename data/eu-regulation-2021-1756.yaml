title:
- language: en
  script: Latn
  content: Regulation (EU) 2021/1756 of the European Parliament and of the Council
    of 6 October 2021 amending Regulation (EU) 2017/625 as regards official controls
    on animals and products of animal origin exported from third countries to the
    Union in order to ensure compliance with the prohibition of certain uses of antimicrobials
    and Regulation (EC) No 853/2004 as regards the direct supply of meat from poultry
    and lagomorphs
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/1756 du Parlement européen et du Conseil du 6 octobre
    2021 modifiant le règlement (UE) 2017/625 en ce qui concerne les contrôles officiels
    effectués sur les animaux et les produits d’origine animale exportés au départ
    de pays tiers vers l’Union afin de garantir le respect de l’interdiction de
    certaines utilisations d’antimicrobiens et le règlement (CE) no 853/2004 en
    ce qui concerne l’approvisionnement direct de viande de volaille et de lagomorphes
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/1756 des Europäischen Parlaments und des Rates vom
    6. Oktober 2021 zur Änderung der Verordnung (EU) 2017/625 hinsichtlich der amtlichen
    Kontrollen von Tieren und Erzeugnissen tierischen Ursprungs, die aus Drittländern
    in die Union ausgeführt werden, um die Einhaltung des Verbots bestimmter Verwendungen
    antimikrobieller Wirkstoffe sicherzustellen, und der Verordnung (EG) Nr. 853/2004
    hinsichtlich der direkten Abgabe von Fleisch von Geflügel und Hasentieren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2021/1756 на Европейския парламент
    и на Съвета от 6 октомври 2021 година за изменение
    на Регламент (ЕС) 2017/625 по отношение на официалния
    контрол на животни и продукти от животински
    произход, изнасяни от трети държави за Съюза,
    за да се гарантира спазването на забраната
    на някои видове употреба на антимикробни средства,
    и на Регламент (ЕО) № 853/2004 по отношение на директната
    доставка на месо от птици и лагоморфни
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2021/1756 ze dne 6. října
    2021, kterým se mění nařízení (EU) 2017/625, pokud jde o úřední kontroly
    zvířat a produktů živočišného původu vyvážených ze třetích zemí
    do Unie s cílem zajistit dodržování zákazu určitých použití antimikrobik
    a nařízení (ES) č. 853/2004, pokud jde o přímé dodávky masa z drůbeže
    a zajícovců
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2021/1756 af 6. oktober
    2021 om ændring af forordning (EU) 2017/625, for så vidt angår offentlig kontrol
    af dyr og animalske produkter, der eksporteres fra tredjelande til Unionen, med
    henblik på at sikre overholdelse af forbuddet mod visse anvendelser af antimikrobielle
    stoffer, og af forordning (EF) nr. 853/2004, for så vidt angår direkte levering
    af kød fra fjerkræ og lagomorfer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2021/1756 του Ευρωπαϊκού Κοινοβουλίου
