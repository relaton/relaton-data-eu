  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2021/1756, 6. oktoober 2021,
    millega muudetakse määrust (EL) 2017/625 seoses kolmandatest riikidest liitu
    eksporditavate loomade ja loomsete saaduste ametliku kontrolliga, et tagada antimikroobikumide
    teatavate kasutusviiside keelu järgimine ja määrust (EÜ) nr 853/2004, millega
    sätestatakse loomset päritolu toidu hügieeni erireeglid
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2021/1756, annettu 6 päivänä
    lokakuuta 2021, asetuksen (EU) 2017/625 muuttamisesta kolmansista maista unioniin
    vietävien eläinten ja eläinperäisten tuotteiden virallisen valvonnan osalta
    mikrobilääkkeiden tiettyjä käyttötarkoituksia koskevan kiellon noudattamisen
    varmistamiseksi ja asetuksen (EY) N:o 853/2004 muuttamiseksi jäniseläinten ja
    siipikarjan lihan suoraan kuluttajalle toimittamisen osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2021/1756 ó Pharlaimint na hEorpa agus ón gComhairle
    an 6 Deireadh Fómhair 2021 lena leasaítear Rialachán (AE) 2017/625 a mhéid
    a bhaineann le rialuithe oifigiúla ar ainmhithe agus ar tháirgí de bhunadh
    ainmhíoch a onnmhairítear ó thríú tíortha chuig an Aontas chun comhlíonadh
    an toirmisc ar úsáidí áirithe frithmhiocróbach a áirithiú agus Rialachán
    (CE) Uimh. 853/2004 a mhéid a bhaineann le soláthar díreach feola ó éanlaith
    chlóis agus ó ghiorriaigh
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2021/1756 Europskog parlamenta i Vijeća od 6. listopada 2021.
    o izmjeni Uredbe (EU) 2017/625 u pogledu službenih kontrola životinja i proizvoda
    životinjskog podrijetla koji se izvoze iz trećih zemalja u Uniju kako bi se
    osiguralo poštovanje zabrane određenih primjena antimikrobnih sredstava i Uredbe
    (EZ) br. 853/2004 u pogledu izravne opskrbe mesom peradi i dvojezubaca
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2021/1756 rendelete (2021. október
    6.) az (EU) 2017/625 rendeletnek az antimikrobiális szerek bizonyos felhasználásaira
    vonatkozó tilalomnak való megfelelés biztosítása érdekében a harmadik országokból
    az Unióba behozott állatokra és állati eredetű termékekre vonatkozó hatósági
    ellenőrzések tekintetében történő módosításáról, valamint a 853/2004/EK
    rendeletnek a baromfi és nyúlfélék húsával történő közvetlen ellátás
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/1756 del Parlamento europeo e del Consiglio del 6
    ottobre 2021 che modifica il regolamento (UE) 2017/625 per quanto riguarda i controlli
    ufficiali su animali e prodotti di origine animale esportati dai paesi terzi nell’Unione
    al fine di garantire il rispetto del divieto di taluni usi degli antimicrobici
    e il regolamento (CE) n. 853/2004 per quanto riguarda la fornitura diretta di
    carni provenienti da pollame e lagomorfi
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2021/1756 (2021. gada 6. oktobris),
    ar ko groza Regulu (ES) 2017/625 attiecībā uz oficiālajām kontrolēm, kuras
    veic no trešām valstīm uz Savienību eksportētiem dzīvniekiem un dzīvnieku
    izcelsmes produktiem, lai nodrošinātu atbilstību antimikrobiālo līdzekļu
    konkrētu lietojumu aizliegumam, un Regulu (EK) Nr. 853/2004 attiecībā uz mājputnu
    un zaķveidīgo gaļas tiešu piegādi
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2021/1756 2021 m. spalio
    6 d. kuriuo iš dalies keičiamos Reglamento (ES) 2017/625 nuostatos dėl iš
    trečiųjų šalių į Sąjungą eksportuojamų gyvūnų ir gyvūninių produktų
    oficialios kontrolės, siekiant užtikrinti, kad būtų laikomasi draudimo tam
    tikrais atvejais naudoti antimikrobines medžiagas, ir Reglamento (EB) Nr. 853/2004
    nuostatos dėl tiesiogiai tiekiamos naminių paukščių ir kiškiažvėrių mėsos
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2021/1756 tal-Parlament Ewropew u tal-Kunsill tas-6 ta’
    Ottubru 2021 li jemenda r-Regolament (UE) 2017/625 fir-rigward tal-kontrolli uffiċjali
    fuq annimali u prodotti li joriġinaw mill-annimali li jiġu esportati minn pajjiżi
    terzi lejn l-Unjoni sabiex tiġi żgurata l-konformità mal-projbizzjoni ta’
    ċerti użi ta’ antimikrobiċi u r-Regolament (KE) Nru 853/2004 fir-rigward
    tal-provvista diretta ta’ laħam tal-pollam u tal-lagomorfi
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2021/1756 van het Europees Parlement en de Raad van 6
    oktober 2021 tot wijziging van Verordening (EU) 2017/625 wat betreft officiële
    controles op dieren en producten van dierlijke oorsprong die vanuit derde landen
    naar de Unie worden uitgevoerd om de naleving van het verbod op bepaalde toepassingen
    van antimicrobiële stoffen te waarborgen en van Verordening (EG) nr. 853/2004
    wat betreft de rechtstreekse levering van vlees van pluimvee en lagomorfen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/1756 z dnia 6
    października 2021 r. zmieniające rozporządzenie (UE) 2017/625 w odniesieniu
    do kontroli urzędowych zwierząt i produktów pochodzenia zwierzęcego wywożonych
    z państw trzecich do Unii w celu zapewnienia przestrzegania zakazu dotyczącego
    niektórych zastosowań środków przeciwdrobnoustrojowych oraz rozporządzenie
    (WE) nr 853/2004 w odniesieniu do bezpośrednich dostaw mięsa z drobiu lub zajęczaków
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2021/1756 do Parlamento Europeu e do Conselho de 6 de
    outubro de 2021 que altera o Regulamento (UE) 2017/625 no que diz respeito aos
    controlos oficiais de animais e produtos de origem animal exportados de países
    terceiros para a União a fim de assegurar o cumprimento da proibição de determinadas
    utilizações de antimicrobianos e o Regulamento (CE) n.o 853/2004 no que diz
    respeito ao fornecimento direto de carne de aves de capoeira e de lagomorfos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2021/1756 al Parlamentului European și al Consiliului
    din 6 octombrie 2021 de modificare a Regulamentului (UE) 2017/625 în ceea ce
    privește controalele oficiale efectuate asupra animalelor și produselor de origine
    animală exportate din țări terțe către Uniune pentru a asigura respectarea
    interdicției privind anumite utilizări ale antimicrobienelor și a Regulamentului
    (CE) nr. 853/2004 în ceea ce privește aprovizionarea directă cu carne de pasăre
    și de lagomorfe
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2021/1756 zo 6. októbra
    2021, ktorým sa mení nariadenie (EÚ) 2017/625, pokiaľ ide o úradné kontroly
    zvierat a produktov živočíšneho pôvodu vyvážaných z tretích krajín do
    Únie, s cieľom zabezpečiť dodržiavanie zákazu určitých použití antimikrobík,
    a nariadenie (ES) č. 853/2004, pokiaľ ide o priame dodávanie mäsa z hydiny
    a zajacovitých
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2021/1756 Evropskega parlamenta in Sveta z dne 6. oktobra 2021
    o spremembi Uredbe (EU) 2017/625 glede uradnega nadzora nad živalmi in proizvodi
    živalskega izvora, ki se izvažajo iz tretjih držav v Unijo, da se zagotovi
    skladnost s prepovedjo nekaterih vrst uporabe protimikrobnih snovi, ter Uredbe
    (ES) št. 853/2004 v zvezi z neposredno dobavo mesa perutnine in lagomorfov
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2021/1756 del Parlamento Europeo y del Consejo de 6 de
    octubre de 2021 por el que se modifica el Reglamento (UE) 2017/625 en lo que respecta
    a los controles oficiales de animales y productos de origen animal exportados
    de terceros países a la Unión para garantizar el cumplimiento de la prohibición
    de determinados usos de los antimicrobianos, y el Reglamento (CE) n.o 853/2004
    en lo relativo al suministro directo de carne procedente de aves de corral y lagomorfos
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2021/1756 av den 6 oktober
    2021 om ändring av förordning (EU) 2017/625 vad gäller offentlig kontroll av
    djur och produkter av animaliskt ursprung som exporteras från tredjeländer till
    unionen i syfte att säkerställa efterlevnad av förbudet mot viss användning
    av antimikrobiella medel och förordning (EG) nr 853/2004 vad gäller direkta
    leveranser av kött från fjäderfä och hardjur
