    10 del regolamento (CEE) n. 2423/88 del Consiglio relativa ad alcuni modelli di
    stampanti a impatto seriale a matrice di punti montate nella Comunità e chiude
    la procedura stessa (89/543/CEE) (89/543/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 6 oktober 1989 tot aanvaarding van verbintenissen
