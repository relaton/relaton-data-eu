  content: '89/543/EEC: Commission Decision of 6 October 1989 accepting undertakings
    and terminating the investigation under Article 13 (10) of Regulation (EEC) No
    2423/88 concerning certain serial-impact dot-matrix printers assembled in the
    Community'
  type: main
- language: fr
  script: Latn
  content: '89/543/CEE: Décision de la Commission du 6 octobre 1989 portant acceptation
