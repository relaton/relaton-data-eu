    Punkt-Matrix-Drucker (89/543/EWG) (89/543/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 6. oktober 1989 om godtagelse af tilsagn og
