- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2970/88 of 27 September 1988 re-establishing
    the levying of customs duties on electric filament lamps, falling within CN code
    8539, originating in Romania, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2970/88 de la Commission du 27 septembre 1988 portant
