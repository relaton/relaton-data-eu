    πορτογαλική βιομηχανία ραφιναρίσματος ακατέργαστης
    ζάχαρης που εισάγεται από τρίτες χώρες με μειωμένη
    εισφορά στην Πορτογαλία'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 13 luglio 1992 che adegua, per la campagna
