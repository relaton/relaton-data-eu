  script: Latn
  content: '92/391/EEC: Commission Decision of 13 July 1992 altering the adjustment
    aid to the Portuguese refining industry for raw sugar imported from third countries
    at a reduced levy for the 1992/93 marketing year into Portugal'
  type: main
- language: fr
  script: Latn
  content: '92/391/CEE: Décision de la Commission du 13 juillet 1992 portant, pour
    la campagne de commercialisation 1992/1993, ajustement de l''aide d''adaptation
    à l''industrie portugaise du raffinage de sucre brut importé des pays tiers
    à prélèvement réduit au Portugal (Le texte en langue portugaise est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 13. Juli 1992 zur Anpassung der Beihilfe
    für die Anpassung der portugiesischen Raffinationsbetriebe, die mit verminderter
    Abschöpfung aus Drittländern in Portugal eingeführten Rohzucker verarbeiten,
    für das Wirtschaftsjahr 1992/93 (Nur der portugiesische Text ist verbindlich)
    (92/391/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 13. juli 1992 om justering for produktionsåret
    1992/93 af tilpasningsstøtten til raffineringsindustrien i Portugal for råsukker,
    der indføres til Portugal med nedsat afgift fra tredjelande (Kun den portugisiske
    udgave er autentisk) (92/391/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/391/ΕΟΚ: Απόφαση της Επιτροπής της 13ης
