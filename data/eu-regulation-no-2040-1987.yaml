title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2040/87 of 10 July 1987 re-establishing
    the levying of customs duties on silicides falling within subheading 28.57 D of
    the Common Customs Tariff originating in Brazil to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2040/87 de la Commission du 10 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux siliciures,
    de la sous-position 28.57 D du tarif douanier commun, originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2040/87 der Kommission vom 10. Juli 1987 zur Wiedereinführung
    der Erhebung der Zölle für Silicide der Tarifstelle 28.57 D des Gemeinsamen
    Zolltarifs mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3924/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2040/87 af 10. juli 1987 om genindførelse
    af opkrævning af told for silicider henhørende under pos. 28.57 D i den fælles
    toldtarif og med oprindelse i Brasilien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2040/87 της Επιτροπής
    της 10ης Ιουλίου 1987 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ενώσεις του πυριτίου
    της διάκρισης 28.57 Δ του κοινού δασμολογίου,
    καταγωγής Βραζιλίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2040/87 della Commissione del 10 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai siliciuri della sottovoce 28.57
    D della tariffa doganale comune, originari del Brasile beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2040/87 van de Commissie van 10 juli 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op siliciden van
    post 28.57 D van het gemeenschappelijk douanetarief, van oorsprong uit Brazilië,
    waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2040/87 da Comissão de 10 de Julho de 1987 que
