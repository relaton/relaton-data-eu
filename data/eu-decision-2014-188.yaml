title:
- language: en
  script: Latn
  content: "(2014/188/EU): Commission Implementing Decision of 3 April 2014 on the identification of ICT technical specifications eligible for referencing in public procurement (notified under document C(2014) 2120)"
  type: main
- language: fr
  script: Latn
  content: "(2014/188/UE): Décision d'exécution de la Commission du 3 avril 2014 relative à l'identification des spécifications techniques des TIC susceptibles de servir de référence dans la passation des marchés publics [notifiée sous le numéro C(2014) 2120]"
  type: main
- language: de
  script: Latn
  content: "(2014/188/EU): Durchführungsbeschluss der Kommission vom 3. April 2014 zur Festlegung der technischen Spezifikationen im IKT-Bereich, auf die bei der Vergabe öffentlicher Aufträge Bezug genommen werden kann (Bekanntgegeben unter Aktenzeichen C(2014) 2120)"
  type: main
- language: bg
  script: Cyrl
  content: "(2014/188/ЕС): Решение за изпълнение на Комисията от 3 април 2014 година относно идентифициране на технически спецификации в областта на информационните и комуникационните технологии (ИКТ), допустими за позоваване в обществените поръчки (нотифицирано под номер С(2014) 2120)"
  type: main
- language: cs
  script: Latn
  content: "(2014/188/EU): Prováděcí rozhodnutí Komise ze dne 3. dubna 2014 o identifikaci technických specifikací IKT, na něž je možné odkazovat při zadávání veřejných zakázek (oznámeno pod číslem C(2014) 2120)"
  type: main
- language: da
  script: Latn
  content: "(2014/188/EU): Kommissionens gennemførelsesafgørelse af 3. april 2014 om udpegning af IKT-tekniske specifikationer, der vil kunne henvises til i forbindelse med offentlige udbud (meddelt under nummer C(2014) 2120)"
  type: main
- language: el
  script: Grek
  content: "(2014/188/EE): Εκτελεστική απόφαση της Επιτροπής, της 3ης Απριλίου 2014 , για την ταυτοποίηση των τεχνικών προδιαγραφών ΤΠΕ που είναι επιλέξιμες για χρήση στις δημόσιες συμβάσεις [κοινοποιηθείσα υπό τον αριθμό C(2014) 2120]"
  type: main
- language: et
  script: Latn
  content: "(2014/188/EL): Komisjoni rakendusotsus, 3. aprill 2014 , mis käsitleb selliste IKT tehniliste spetsifikatsioonide kindlaksmääramist, millele saaks riigihangetes viidata (teatavaks tehtud numbri C(2014) 2120 all)"
  type: main
- language: fi
  script: Latn
  content: "(2014/188/EU): Komission täytäntöönpanopäätös, annettu 3 päivänä huhtikuuta 2014 , julkisissa hankinnoissa viittausasiakirjoina käytettävien tieto- ja viestintätekniikan teknisten eritelmien yksilöimisestä (tiedoksiannettu numerolla C(2014) 2120)"
  type: main
- language: hr
  script: Latn
  content: "(2014/188/EU): Provedbena odluka Komisije оd 3. travnja 2014. o utvrđivanju tehničkih specifikacija IKT-a koje su prihvatljive za pozivanja u javnoj nabavi (priopćeno pod brojem dokumenta C(2014) 2120)"
  type: main
- language: hu
  script: Latn
  content: "(2014/188/EU): A Bizottság végrehajtási határozata ( 2014. április 3. ) a közbeszerzésben hivatkozható IKT műszaki előírások azonosításáról (az értesítés a C(2014) 2120. számú dokumentummal történt)"
  type: main
- language: it
  script: Latn
  content: "(2014/188/UE): Decisione di esecuzione della Commissione, del 3 aprile 2014 , relativa all'individuazione delle specifiche tecniche nel settore delle TIC cui è possibile fare riferimento negli appalti pubblici [notificata con il numero C(2014) 2120]"
  type: main
- language: lv
  script: Latn
  content: "(2014/188/ES): Komisijas Īstenošanas lēmums ( 2014. gada 3. aprīlis ) par to IKT tehnisko specifikāciju noteikšanu, uz kurām var atsaukties publiskajā iepirkumā (izziņots ar dokumenta numuru C(2014) 2120)"
  type: main
- language: lt
  script: Latn
  content: "(2014/188/ES): 2014 m. balandžio 3 d. Komisijos įgyvendinimo sprendimas dėl IRT techninių specifikacijų, kurios, vykdant viešuosius pirkimus, gali tikti naudoti kaip nuorodos, nustatymo (pranešta dokumentu Nr. C(2014) 2120)"
  type: main
- language: mt
  script: Latn
  content: "(2014/188/UE): Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni tat- 3 ta' April 2014 dwar l-identifikazzjoni tal-ispeċifikazzjonijiet tekniċi tal-ICT eliġibbli għar-referenzjar fl-akkwist pubbliku (notifikata bid-dokument C(2014) 2120)"
  type: main
- language: nl
  script: Latn
  content: "(2014/188/EU): Uitvoeringsbesluit van de Commissie van 3 april 2014 betreffende de identificatie van technische ICT-specificaties die in aanmerking kunnen komen om te dienen als referentie in openbare aanbestedingen (Kennisgeving geschied onder nummer C(2014) 2120)"
  type: main
- language: pl
  script: Latn
  content: "(2014/188/UE): Decyzja wykonawcza Komisji z dnia 3 kwietnia 2014 r. w sprawie wskazania kwalifikowalnych specyfikacji technicznych ICT na potrzeby dokonywania odniesień w zamówieniach publicznych (notyfikowana jako dokument nr C(2014) 2120)"
  type: main
- language: pt
  script: Latn
  content: "(2014/188/UE): Decisão de Execução da Comissão, de 3 de abril de 2014 , relativa à identificação das especificações técnicas das TIC elegíveis para referência nos contratos públicos [notificada com o número C(2014) 2120]"
  type: main
- language: ro
  script: Latn
  content: "(2014/188/UE): Decizia de punere în aplicare a Comisiei din 3 aprilie 2014 privind identificarea specificațiilor tehnice TIC care pot fi utilizate drept referințe în procedurile de achiziții publice [notificată cu numărul C(2014) 2120]"
  type: main
- language: sk
  script: Latn
  content: "(2014/188/EÚ): Vykonávacie rozhodnutie Komisie z 3. apríla 2014 o určení technických špecifikácií IKT spĺňajúcich podmienky na to, aby sa na ne vo verejnom obstarávaní uvádzali odkazy [oznámené pod číslom C(2014) 2120]"
  type: main
- language: sl
  script: Latn
  content: "(2014/188/EU): Izvedbeni sklep Komisije z dne 3. aprila 2014 o opredelitvi tehničnih specifikacij IKT, primernih za sklicevanje pri javnem naročanju (notificirano pod dokumentarno številko C(2014) 2120)"
  type: main
- language: es
  script: Latn
  content: "(2014/188/UE): Decisión de Ejecución de la Comisión, de 3 de abril de 2014 , sobre la identificación de especificaciones técnicas TIC que se puedan usar como referencia en la contratación pública [notificada con el número C(2014) 2120]"
  type: main
- language: sv
  script: Latn
  content: "(2014/188/EU): Kommissionens genomförandebeslut av den 3 april 2014 om fastställande av tekniska specifikationer för informations- och kommunikationsteknik som det kan hänvisas till vid offentlig upphandling [delgivet med nr C(2014) 2120]"
