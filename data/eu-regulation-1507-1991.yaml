title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1507/91 of 4 June 1991 re-establishing the
    levying of customs duties on products of category 9 (order No 40.0090) and products
    of category 39 (order No 40.0390), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1507/91 DE LA COMMISSION du 4 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    9 (numéro d'' ordre 40.0090) et 39 (numéro d'' ordre 40.0390), originaires de
    l'' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1507/91 DER KOMMISSION vom 4. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 9 (laufende
    Nummer 40.0090) und die Waren der Kategorie Nr. 39 (laufende Nummer 40.0390) mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1507/91 af 4. juni 1991 om genindførelse
    af opkrævning af told for varer under kategori 9 (løbenummer 40.0090) og varer
    under kategori 39 (løbenummer 40.0390), som har oprindelse i Indien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
