title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1976 on the reimbursement by the Guidance
    Section of the EAGGF to the Kingdom of the Netherlands of expenditure incurred
    during 1974 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purposes of structural
    improvement
  type: main
- language: fr
  script: Latn
  content: '77/50/CEE: Décision de la Commission, du 22 décembre 1976, relative
    au remboursement par le FEOGA, section orientation, au Royaume des Pays-Bas des
    dépenses effectuées pendant l''année 1974 pour les indemnités relatives à
    l''encouragement à la cessation de l''activité agricole et à l''affectation
    de la superficie agricole utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1976 über die Rückvergütung
    der im Jahr 1974 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das Königreich
    der Niederlande
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 22. december 1976 om refusion gennem EUGFL,
    udviklingssektionen, til kongeriget Nederlandene af de udgifter, som er afholdt
    i løbet af året 1974 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1976, relativa al rimborso
    da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi delle spese
    effettuate nel 1974 per le indennità relative all'incoraggiamento alla cessazione
    dell'attività agricola ed alla destinazione della superficie agricola utilizzata
    a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 december 1976 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk der Nederlanden voor
    de gedurende het jaar 1974 gedane uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending voor cultuurgrond
    tot verbetering van de structuur
  type: main
