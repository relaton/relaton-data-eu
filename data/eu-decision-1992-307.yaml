title:
- language: en
  script: Latn
  content: '92/307/EEC: Commission Decision of 25 May 1992 approving measures to set
    up pilot projects for the control of rabies with a view to its eradication or
    prevention presented by the Kingdom of Belgium (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/307/CEE: Décision de la Commission, du 25 mai 1992, approuvant des
    actions visant à l''établissement de projets pilotes destinés à lutter contre
    la rage en vue de son éradication ou de sa prévention présentés par la Belgique
    (Les textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '92/307/EWG: Entscheidung der Kommission vom 25. Mai 1992 zur Genehmigung
    von Maßnahmen zur Aufstellung der von Belgien vorgelegten Pilotprogramme zur
    Tilgung oder Verhütung der Tollwut (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/307/EØF: Kommissionens beslutning af 25. maj 1992 om godkendelse af
    foranstaltninger til iværksættelse af pilotprojekter til bekæmpelse af rabies
    med henblik på udryddelse eller forebyggelse heraf, forelagt af Belgien (Kun
    de franske og nederlandske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '92/307/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Μαΐου 1992 για την έγκριση δράσεων εκπόνησης
    πρότυπων σχεδίων καταπολέμησης της λύσσας
    με σκοπό την εξάλειψη ή την πρόληψή της, που
    υποβλήθηκαν από το Βέλγιο (Τα κείμενα στη γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '92/307/CEE: Decisione della Commissione, del 25 maggio 1992, recante approvazione
    di progetti pilota di lotta contro la rabbia, presentati dal Belgio ai fini dell''eradicazione
    e della prevenzione di tale malattia (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '92/307/EEG: Beschikking van de Commissie van 25 mei 1992 houdende goedkeuring
