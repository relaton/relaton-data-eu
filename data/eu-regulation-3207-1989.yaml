title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3207/89 of 23 October 1989 amending Regulation
    (EEC) No 3034/80 fixing the quantities of basic products considered to have been
    used in the manufacture of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3207/89 du Conseil du 23 octobre 1989 modifiant le
    règlement (CEE) n° 3034/80 fixant les quantités de produits de base considérées
    comme étant entrées dans la fabrication de marchandises relevant du règlement
    (CEE) n° 3033/80
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3207/89 DES RATES vom 23. Oktober 1989 zur Änderung
    der Verordnung (EWG) Nr. 3034/80 zur Festlegung der Grunderzeugnismengen, von
    denen unterstellt wird, daß sie zur Herstellung von Waren der Verordnung (EWG)
    Nr. 3033/80 verwendet worden sind #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3207/89 af 23. oktober 1989 om ændring af
    forordning (EØF) nr. 3034/80 om fastsættelse af de mængder basisprodukter,
    der anses som medgået til fremstilling af varer henhørende under forordning
    (EØF) nr. 3033/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3207/89 του Συμβουλίου
    της 23ης Οκτωβρίου 1989 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3034/80 περί καθορισμού
    των ποσοτήτων προϊόντων βάσης που θεωρούνται
    ότι έχουν χρησιμοποιηθεί στην παρασκευή εμπορευμάτων
    τα οποία υπάγονται στον κανονισμό (ΕΟΚ) αριθ.
    3033/80
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3207/89 DEL CONSIGLIO del 23 ottobre 1989 recante
    modifica del regolamento (CEE) n. 3034/80 che fissa i quantitativi di prodotti
    di base che si considerano entrati nella fabbricazione di merci cui si applica
    il regolamento (CEE) n. 3033/80 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3207/89 VAN DE RAAD van 23 oktober 1989 houdende
    wijziging van Verordening (EEG) nr. 3034/80 tot vaststelling van de hoeveelheden
    basisprodukten die worden geacht bij de vervaardiging van de onder Verordening
    (EEG) nr. 3033/80 vallende goederen te zijn gebruikt #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3207/89 DO CONSELHO de 23 de Outubro de 1989 que altera
    o Regulamento (CEE) n* 3034/80 que fixa as quantidades de produtos de base consideradas
    como tendo entrado no fabrico de mercadorias abrangidas pelo Regulamento (CEE)
    n* 3033/80
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3207/89 DEL CONSEJO de 23 de octubre de 1989 que modifica
    el Reglamento (CEE) no 3034/80 por el que se determinan las cantidades de productos
    de base que se consideran incluidas en la fabricación de mercancías reguladas
    por el Reglamento (CEE) no 3033/80 #'
