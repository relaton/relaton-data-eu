    Gemeinde Kolyndros (93/09/61/015), - Kanalisationssystem und biologische Kläranlage
    in Orestiada (93/09/61/017) - Neuanlage der Mülldeponie im Ostteil von Saloniki
    (93/09/61/035) - Abfallbehandlung in der Gemeinde Patras (93/09/61/039) - Anlagen
    zur Abwasserbehandlung in Ptolemaida (93/09/61/054) - in Griechenland. - Nr. F.C.:
    93/09/61/015 - 93/09/61/017 - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 - (Nur
    der griechische Text ist verbindlich)'
