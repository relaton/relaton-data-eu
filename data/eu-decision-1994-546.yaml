  type: main
- language: nl
  script: Latn
  content: '94/546/EG: Beschikking van de Commissie van 16 december 1993 inzake de
    toekenning van bijstand uit het cohesie- financieringsinstrument voor een groep
    projectfasen inzake - waterafvoersystemen en biologische waterzuivering in de
    deme Kolindros (93/09/61/015), - waterafvoersystemen en biologische waterzuivering
    in Orestiada (93/09/61/017), - aanleg van een aan hygiënische normen beantwoordend
    stort voor het oostelijk deel van Thessaloniki (93/09/61/035), - beheer van het
    afval van de deme Patras (93/09/61/039), - installaties voor de behandeling van
    het afvalwater van de stad Ptolemaïda (93/09/61/054) - in Griekenland - Nr. CF:
    93/09/61/015 - 93/09/61/017 - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 - (Slechts
    de tekst in de Griekse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '94/546/CE: Decisão da Comissão de 16 de Dezembro de 1993 relativa à
    concessão de uma contribuição do instrumento financeiro de coesão para o conjunto
    de fases de projecto de rede de esgotos e estação de tratamento biológico do
    município de Kolindros (93/09/61/015), de rede de esgotos e estação de tratamento
    biológico em Orestiada (93/09/61/017), de ordenamento do local de enterramento
    de detritos do sector oriental de Salónica (93/09/61/035), de gestão dos detritos
    do município de Patras (93/09/61/039) e de instalações de tratamento de efluentes
    da cidade de Ptolemaida (93/09/61/054), na Grécia - nº FC: 93/09/61/015 - 93/09/61/017
    - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 - (Apenas faz fé o texto em língua
    grega)'
  type: main
- language: es
  script: Latn
  content: '94/546/CE: Decisión de la Comisión de 16 de diciembre de 1993 sobre
    la concesión de una ayuda del instrumento financiero de cohesión a Grecia para
    el conjunto de fases de los proyectos de: - red de alcantarillado y estación
    de depuración biológica en el municipio de Kolindros (93/09/61/015), - red de
    alcantarillado y estación de depuración biológica en Orestias (93/09/61/017),
    - reacondicionamiento del vertedero cubierto del distrito este de Salónica (93/09/61/035),
    - gestión de los residuos de la ciudad de Patras (93/09/61/039), - instalaciones
    de tratamiento de las aguas residuales de la ciudad de Ptolemaïs, red de alcantarillado
    y estación de depuración biológica en Kozani, instalaciones de tratamiento
    de aguas residuales en Florina, modernización del centro de tratamiento de aguas
    residuales de la ciudad de Kastoria y construcción de instalaciones de tratamiento
    terciario de aguas residuales (93/09/61/054) - Nº FC: 93/09/61/015 - 93/09/61/017
    - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 (El texto en lengua griega es el
    único auténtico)'
