title:
- language: en
  script: Latn
  content: '94/546/EC: Commission Decision of 16 December 1993 granting assistance
    from the cohesion financial instrument for the following project stages in Greece:
    - 93/09/61/015 - sewerage and biological purification facilities for the municipality
    of Kolindros - 93/09/61/017 - sewerage and biological purification facilities
    at Orestiada - 93/09/61/035 - redevelopment of waste burial site serving the east
    side of Thessaloniki - 93/09/61/039 - waste disposal for the municipality of Patras
    - 93/09/61/054 - sewage treatment installations for the town of Ptolemaida - Nos
    CF: 93/09/61/015 - 93/09/61/017 - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 (Only
    the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/546/CE: Décision de la Commission du 16 décembre 1993 relative à
    l''octroi d''un concours de l''instrument financier de cohésion pour une série
    de phases de projets concernant: - un réseau d''égouts et une station d''épuration
    biologique pour la commune de Kolyndros (93/09/61/015), - un réseau d''égouts
    et une station d''épuration biologique à Orestiada (93/09/61/017), - le réaménagement
    du site d''enfouissement sanitaire de l''arrondissement est de Thessalonique (93/09/61/035),
    - la gestion des déchets de la ville de Patras (93/09/61/039), - des installations
    de traitement des effluents de la ville de Ptolemaïda, un réseau d''égouts
    et une station d''épuration biologique à Kozani, une installation de traitement
    des effluents à Florina, et la modernisation d''une installation de traitement
    des effluents de la ville de Kastoria et l''adjonction d''une installation de
    traitement tertiaire (93/09/61/054) en Grèce - nº FC: 93/09/61/015S93/09/61/017
    - 93/09/61/035 - 93/09/61/039 - 93/09/61/054 - (Le texte en langue grecque est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/546/EG: Entscheidung der Kommission vom 16. Dezember 1993 über die
    Gewährung einer Unterstützung aus dem Kohäsions-Finanzinstrument für die Serie
