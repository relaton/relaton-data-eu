    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/900 della Commissione del 3 giugno
    2021 che autorizza una modifica delle condizioni d’uso del nuovo alimento «galatto-oligosaccaride‘
