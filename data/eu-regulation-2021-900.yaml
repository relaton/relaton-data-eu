  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/900 van de Commissie van 3 juni 2021 tot
    goedkeuring van een wijziging van de gebruiksvoorwaarden voor het nieuwe voedingsmiddel
    “galacto-oligosacharide” krachtens Verordening (EU) 2015/2283 van het Europees
    Parlement en de Raad, en tot wijziging van Uitvoeringsverordening (EU) 2017/2470
    van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/900 z dnia 3 czerwca 2021
    r. zezwalające na zmianę w warunkach stosowania nowej żywności „galaktooligosacharydy”
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (UE) 2015/2283 oraz
    zmieniające rozporządzenie wykonawcze Komisji (UE) 2017/2470
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/900 da Comissão de 3 de junho de 2021
    que autoriza uma alteração das condições de utilização do novo alimento
    galacto-oligossacárido ao abrigo do Regulamento (UE) 2015/2283 do Parlamento
    Europeu e do Conselho e que altera o Regulamento de Execução (UE) 2017/2470
    da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/900 al Comisiei din 3 iunie
    2021 de autorizare a unei modificări a condițiilor de utilizare a alimentului
    nou „galacto-oligozaharidă” în temeiul Regulamentului (UE) 2015/2283 al
    Parlamentului European și al Consiliului și de modificare a Regulamentului de
    punere în aplicare (UE) 2017/2470 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/900 z 3. júna 2021, ktorým
