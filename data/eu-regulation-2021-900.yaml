    Lebensmittel „Galacto-Oligosaccharid“ gemäß der Verordnung (EU) 2015/2283
    des Europäischen Parlaments und des Rates sowie zur Änderung der Durchführungsverordnung
    (EU) 2017/2470 der Kommission
  type: main
- language: bg
  script: Cyrl
