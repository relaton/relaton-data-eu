    podmienok používania novej potraviny „galaktooligosacharid“ a ktorým sa
    mení vykonávacie nariadenie Komisie (EÚ) 2017/2470
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/900 z dne 3. junija 2021 o odobritvi
    spremembe pogojev uporabe novega živila „galakto-oligosaharid“ v skladu z
    Uredbo (EU) 2015/2283 Evropskega parlamenta in Sveta ter o spremembi Izvedbene
    uredbe Komisije (EU) 2017/2470
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/900 de la Comisión de 3 de junio de
    2021 por el que se autoriza un cambio en las condiciones de uso del nuevo alimento
    «galacto-oligosacáridos» con arreglo al Reglamento (UE) 2015/2283 del Parlamento
    Europeo y del Consejo y se modifica el Reglamento de Ejecución (UE) 2017/2470
    de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/900 av den 3 juni 2021
