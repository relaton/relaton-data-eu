id: EUDecision197646
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 October 1975 authorizing the French Republic
    not to apply Community treatment to imports of new fabric sacks of a kind used
    for the packing of goods, made from polyethylene or polypropylene strip or the
    like, falling within subheading 62.03 B ex II of the Common Customs Tariff, originating
    in South Korea and in free circulation in the Netherlands
  type: main
- language: fr
  script: Latn
  content: '76/46/CEE: Décision de la Commission, du 29 octobre 1975, autorisant
    la République française à exclure du traitement communautaire les importations
    de sacs d''emballage neufs en tissus, obtenus à partir de lames ou formes similaires
    de polyéthylène ou de polypropylène, de la sous-position 62.03 B Ex II du Tarif
    douanier commun, originaires de la Corée du Sud et mis en libre pratique aux
    Pays-Bas'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 29. Oktober 1975, mit der die Französische
    Republik ermächtigt wird, aus Südkorea stammende und in den Niederlanden im
    freien Verkehr befindliche neue Säcke zu Verpackungszwecken, aus Geweben aus
    Streifen oder dergleichen aus Polyäthylen oder Polypropylen, der Tarifstelle
    62.03 B ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 29. oktober 1975 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage indførsel af nye sække til
    emballage af polyethylen- eller polypropylenfibre, som henhører under pos. 62.03
    B ex II i den fælles toldtarif, har oprindelse i Sydkorea og frit kan omsættes
    i Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 ottobre 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le importazioni di sacchi nuovi
    da imballaggio di tessuti fabbricati con lamette e simili di polietilene o di
    polipropilene della sottovoce 62.03 B ex II della tariffa doganale comune, originari
    della Corea del Sud e messi in libera pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 29 oktober 1975 waarbij de Franse Republiek
    wordt gemachtigd nieuwe zakken voor verpakkingsdoeleinden van weefsels verkregen
    uit polyethyleen- of polypropeenstroken of dergelijke vormen, van post 62.03 B
    ex II van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea en
    in Nederland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
