title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3668/93 of 20 December 1993 extending into 1994
    the application of Regulation (EEC) No 3917/92 applying generalized tariff preferences
    for 1994 in respect of certain products originating in developing countries, and
    adding to the list of beneficiaries of such preferences
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 3668/93 du Conseil, du 20 décembre 1993, prorogeant
    en 1994 l' application du règlement (CEE) nº 3917/92 portant application de
    préférences tarifaires généralisées pour l' année 1993 à certains produits
    originaires de pays en développement et complétant la liste des bénéficiaires
    de ces préférences
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3668/93 des Rates vom 20. Dezember 1993 zur Verlängerung
    für 1994 der Verordnung (EWG) Nr. 3917/92 zur Anwendung allgemeiner Zollpräferenzen
    für bestimmte Erzeugnisse mit Ursprung in Entwicklungsländern im Jahr 1993 und
    zur Ergänzung der Liste der Begünstigten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3668/93 af 20. december 1993 om forlængelse
    i 1994 af gyldigheden af forordning (EØF) nr. 3917/92 om anvendelse af generelle
    toldpræferencer i 1993 for visse varer med oprindelse i udviklingslande og om
    supplering af listen over præferenceberettigede lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3668/93 του Συμβουλίου
    της 20ής Δεκεμβρίου 1993 για την παράταση, κατά
    το 1994, της εφαρμογής του κανονισμού (ΕΟΚ) αριθ.
    3917/92 για την εφαρμογή των γενικευμένων δασμολογικών
    προτιμήσεων κατά το έτος 1993 σε ορισμένα προϊόντα
    καταγωγής των αναπτυσσομένων χωρών και για
    τη συμπλήρωση του καταλόγου των δικαιούχων
    των προτιμήσεων αυτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3668/93 del Consiglio, del 20 dicembre 1993, che proroga
    nel 1994 l' applicazione del regolamento (CEE) n. 3917/92 recante applicazione
    delle preferenze tariffarie generalizzate per il 1993 a taluni prodotti originari
    di paesi in via di sviluppo e che completa l' elenco dei beneficiari di dette
    preferenze
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3668/93 van de Raad van 20 december 1993 tot verlenging
    in 1994 van de toepassing van Verordening (EEG) nr. 3917/92 houdende toepassing
    van algemene tariefpreferenties voor het jaar 1993 op bepaalde produkten van oorsprong
    uit ontwikkelingslanden, en aanvulling van de lijst van voor deze preferenties
    in aanmerking komende landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3668/93 do Conselho, de 20 de Dezembro de 1993, que
    prorroga para 1994 a aplicação do Regulamento (CEE) nº 3917/92 relativo à
    aplicação de preferências pautais generalizadas para o ano de 1993 a certos
    produtos originários de países em desenvolvimento e completa a lista dos beneficiários
    dessas preferências
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3668/93 del Consejo, de 20 de diciembre de 1993, por
    el que se prorroga en 1994 la aplicación del Reglamento (CEE) nº 3917/92 relativo
    a la aplicación de preferencias arancelarias generalizadas para el año 1993
    a determinados productos originarios de países en desarrollo y por el que se
    completa la lista de beneficiarios de estas preferencias
  type: main
