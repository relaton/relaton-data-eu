type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 14 February 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to tea towels and glass cloths of a mixture of cotton and
    flax, falling within subheading ex 62.02 B of the Common Customs Tariff, originating
    in Romania and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/446/CEE: Décision de la Commission, du 14 février 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les serviettes de cuisine en toile mixte
    coton-lin de la position Ex 62.02 B du Tarif douanier commun, originaires de Roumanie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 14. Februar 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Küchenhandtücher aus Baumwolle mit Beimischung von Flachs,
    der Tarifnummer ex 62.02 B des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 14. februar 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage viskestykker af stof af bomuld blandet med hør, som henhører under
    pos. ex 62.02 B i den fælles toldtarif, har oprindelse i Rumænien og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 14 febbraio 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario gli strofinacci di cucina di tela mista cotone e lino
    della voce ex 62.02 B della tariffa doganale comune, originari della Romania e
    messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 14 februari 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd keukenhanddoeken van gemengd weefsel van katoen en linnen, van de post
    ex 62.02 B van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
