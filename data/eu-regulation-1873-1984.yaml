id: EURegulation18731984
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1873/84 of 28 June 1984 authorizing the offer
    or disposal for direct human consumption of certain imported wines which may have
    undergone oenological processes not provided for in Regulation (EEC) No 337/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1873/84 du Conseil du 28 juin 1984 autorisant l'offre
    et la livraison à la consommation humaine directe de certains vins importés
    susceptibles d'avoir fait l'objet de pratiques oenologiques non prévues par le
    règlement (CEE) n° 337/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1873/84 des Rates vom 28. Juni 1984 zur Genehmigung
    des Anbietens oder der Abgabe zum unmittelbaren menschlichen Verbrauch von bestimmten
    eingeführten Weinen, bei denen angenommen werden kann, daß sie Gegenstand von
    in der Verordnung (EWG) Nr. 337/79 nicht vorgesehenen önologischen Verfahren
    waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1873/84 af 28. juni 1984 om tilladelse til
    udbud eller afsætning til direkte konsum af visse indførte vine, som eventuelt
    har været underkastet andre ønologiske fremgangsmåder end de i forordning (EØF)
    nr. 337/79 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1873/84 του Συμβουλίου
    της 28ης Ιουνίου 1984 που επιτρέπει την προσφορά
    και την παράδοση στην άμεση ανθρώπινη κατανάλωση
    ορισμένων εισαγόμενων οίνων δυναμένων να αποτελέσουν
    το αντικείμενο οινολογικών πρακτικών που δεν
    προβλέπονται από τον κανονισμό (ΕΟΚ) αριθ. 337/79
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1873/84, annettu 28 päivänä kesäkuuta 1984,
    sellaisilla enologisilla käytännöillä, joista ei ole säädetty asetuksessa
    (ETY) N:o 337/79, mahdollisesti käsiteltyjen tiettyjen tuontiviinien tarjoamisen
    ja toimittamisen sallimisesta nautittavaksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1873/84 del Consiglio del 28 giugno 1984 che autorizza
    l'offerta e la consegna per il consumo umano diretto di taluni vini importati
    che possono essere stati sottoposti a pratiche enologiche non previste dal regolamento
    (CEE) n. 337/79
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1873/84 van de Raad van 28 juni 1984 houdende machtiging
    tot aanbieding of levering voor rechtstreekse menselijke consumptie van bepaalde
    ingevoerde wijnen waarop oenologische procédés kunnen zijn toegepast waarin
    niet is voorzien bij Verordening (EEG) nr. 337/79
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1873/84 do Conselho, de 28 de Junho de 1984, que
    autoriza a oferta e o fornecimento para consumo humano directo de certos vinhos
    importados susceptíveis de terem sido objecto de práticas enológicas não previstas
    no Regulamento (CEE) nº 337/79
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1873/84 del Consejo, de 28 de junio de 1984, por el
    que se autoriza la oferta y la entrega al consumo humano directo de determinados
    vinos importados que pueden haber sido sometidos a prácticas enológicas no previstas
    en el Reglamento (CEE) nº 337/79
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1873/84 av den 28 juni 1984 om tillstånd
    att erbjuda och leverera för direkt konsumtion vissa importerade viner som kan
    ha genomgått enologiska processer som inte stadgas om i förordning (EEG) nr
    337/79
  type: main
