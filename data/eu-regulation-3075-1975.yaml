title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3075/75 of the Council of 17 November 1975 on the tariff
    treatment applicable within the Community as originally constituted to certain
    products imported from the new Member States for use in the construction, maintenance
    and repair of certain aircraft
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3075/75 du Conseil, du 17 novembre 1975, relatif au
    traitement tarifaire applicable, dans la Communauté dans sa composition originaire,
    à certains produits importés des nouveaux États membres en vue d'être utilisés
    pour la construction, l'entretien ou la réparation de certains aérodynes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3075/75 des Rates vom 17. November 1975 über die
    zolltarifliche Behandlung bestimmter, aus den neuen Mitgliedstaaten eingeführter
    Erzeugnisse, die in der Gemeinschaft in ihrer ursprünglichen Zusammensetzung
    beim Bau, bei der Instandhaltung oder Instandsetzung bestimmter Luftfahrzeuge
    verwendet werden sollen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3075/75 af 17. november 1975 om toldmæssig
    behandling gældende i Fællesskabet i dets oprindelige udstrækning af visse
    varer, der indføres fra de nye medlemsstater, og som er beregnet til brug ved
    bygning, vedligeholdelse og reparation af visse flyvemaskiner
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3075/75 del Consiglio, del 17 novembre 1975, relativo
    al trattamento tariffario applicabile nella Comunità nella sua composizione originaria
    a taluni prodotti importati dai nuovi Stati membri e destinati ad essere utilizzati
    per la costruzione, la manutenzione o la riparazione di alcune aerodine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3075/75 van de Raad van 17 november 1975 inzake de
    toepassing van het tarief binnen de Gemeenschap in haar oorspronkelijke samenstelling
    op bepaalde produkten welke uit de nieuwe Lid-Staten worden ingevoerd en bestemd
    zijn om te worden gebruikt voor de bouw, het onderhoud en de reparatie van bepaalde
    vliegtoestellen
  type: main
