- language: en
  script: Latn
  content: Council Decision (EU) 2022/2489 of 25 November 2022 on the position to
    be taken on behalf of the European Union at the 42nd meeting of the Standing Committee
    of the Convention on the conservation of European wildlife and natural habitats
    (the ‘Bern Convention’)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/2489 du Conseil du 25 novembre 2022 établissant la
    position à prendre, au nom de l’Union européenne, lors de la 42e réunion
    du comité permanent de la convention relative à la conservation de la vie sauvage
    et du milieu naturel de l’Europe («convention de Berne»)
  type: main
- language: de
  script: Latn
