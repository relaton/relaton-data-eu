title:
- language: en
  script: Latn
  content: Regulation (EU) 2021/1068 of the European Parliament and of the Council
    of 24 June 2021 amending Regulation (EU) 2016/1628 as regards its transitional
    provisions for certain machinery fitted with engines in the power ranges greater
    than or equal to 56 kW and less than 130 kW, and greater than or equal to 300
    kW, in order to address the impact of the COVID-19 crisis
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/1068 du Parlement européen et du Conseil du 24 juin
    2021 modifiant le règlement (UE) 2016/1628 en ce qui concerne ses dispositions
    transitoires applicables à certains engins équipés de moteurs dont la plage
    de puissance est supérieure ou égale à 56 kW et inférieure à 130 kW, ou est
    supérieure ou égale à 300 kW, pour faire face aux effets de la crise liée
    à la COVID-19
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/1068 des Europäischen Parlaments und des Rates vom
    24. Juni 2021 zur Änderung der Verordnung (EU) 2016/1628 hinsichtlich ihrer Übergangsbestimmungen
    für bestimmte Maschinen, die mit Motoren der Leistungsbereiche 56 kW oder mehr
    und weniger als 130 kW oder 300 kW oder mehr ausgestattet sind, um den Auswirkungen
    der COVID-19-Krise zu begegnen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2021/1068 на Европейския парламент
    и на Съвета от 24 юни 2021 година за изменение
    на Регламент (ЕС) 2016/1628 по отношение на неговите
    преходни разпоредби за някои видове техника,
    оборудвана с двигатели с мощност в диапазон,
    по-голям или равен на 56 kW и по-малък от 130 kW, както
    и по-голям или равен на 300 kW, с цел справяне с
    въздействието на кризата с COVID-19
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2021/1068 ze dne 24. června
    2021, kterým se mění nařízení (EU) 2016/1628, pokud jde o přechodná ustanovení
    ohledně určitých strojů vybavených motory s rozsahem výkonu alespoň 56
    kW, avšak méně než 130 kW a s rozsahem výkonu alespoň 300 kW, s cílem řešit
    dopad krize COVID-19
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2021/1068 af 24. juni 2021
    om ændring af forordning (EU) 2016/1628, for så vidt angår overgangsbestemmelser
    for visse maskiner udstyret med motorer i effektområderne større end eller lig
    med 56 kW og mindre end 130 kW samt større end eller lig med 300 kW for at imødegå
    virkningen af covid-19-krisen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2021/1068 του Ευρωπαϊκού Κοινοβουλίου
