    tranżitorji tiegħu għal ċertu makkinarju mgħammar b’magni fil-meded tal-potenza
    akbar minn jew ugwali għal 56 kW u inqas minn 130 kW, u akbar minn jew ugwali
    għal 300 kW, biex jiġi indirizzat l-impatt tal-kriżi tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2021/1068 van het Europees Parlement en de Raad van 24
    juni 2021 tot wijziging van Verordening (EU) 2016/1628 wat de overgangsbepalingen
    ervan betreft voor bepaalde machines die zijn uitgerust met motoren in de vermogensgroep
    van ten minste 56 kW en minder dan 130 kW, of de vermogensgroep van ten minste
    300 kW, met het oog op het aanpakken van de gevolgen van de COVID-19-crisis
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2021/1068 z dnia 24
    czerwca 2021 r. zmieniające rozporządzenie (UE) 2016/1628 w odniesieniu do jego
    przepisów przejściowych dotyczących niektórych maszyn wyposażonych w silniki
    o zakresach mocy co najmniej 56 kW i nie większym niż 130 kW oraz co najmniej
    300 kW, w celu zaradzenia skutkom kryzysu związanego z COVID-19
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2021/1068 do Parlamento Europeu e do Conselho de 24 de
    junho de 2021 que altera o Regulamento (UE) 2016/1628 no que diz respeito às
    suas disposições transitórias para máquinas específicas equipadas com motores
    na gama de potências igual ou superior a 56 kW, e inferior a 130 kW ou igual
    ou superior a 300 kW, para fazer face aos efeitos da crise da COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2021/1068 al Parlamentului European și al Consiliului
    din 24 iunie 2021 de modificare a Regulamentului (UE) 2016/1628 în ceea ce privește
    dispozițiile sale tranzitorii pentru anumite echipamente prevăzute cu motoare
    cu o putere mai mare sau egală cu 56 kW și mai mică de 130 kW, precum și cu
    o putere mai mare sau egală cu 300 kW, pentru a aborda impactul crizei provocate
    de COVID-19
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2021/1068 z 24. júna 2021,
    ktorým sa mení nariadenie (EÚ) 2016/1628, pokiaľ ide o jeho prechodné ustanovenia
    pre určité stroje vybavené motormi v rozsahu výkonu minimálne 56 kW a menej
    ako 130 kW, a minimálne 300 kW, s cieľom riešiť vplyv krízy spôsobenej ochorením
    COVID-19
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2021/1068 Evropskega parlamenta in Sveta z dne 24. junija 2021
    o spremembi Uredbe (EU) 2016/1628 v zvezi z njenimi prehodnimi določbami za nekatero
    mehanizacijo, opremljeno z motorji v razponu moči večji ali enaki 56 kW in manjši
    od 130 kW ter z močjo večjo ali enako 300 kW, za obravnavo posledic krize zaradi
    COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2021/1068 del Parlamento Europeo y del Consejo de 24 de
    junio de 2021 por el que se modifica el Reglamento (UE) 2016/1628 en lo que respecta
    a sus disposiciones transitorias aplicables a determinadas máquinas equipadas
    con motores que se encuentren en intervalos de potencia superior o igual a 56
    kW e inferior a 130 kW, y superior o igual a 300 kW, con el fin de hacer frente
    al impacto de la crisis de la COVID-19
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2021/1068 av den 24 juni
    2021 om ändring av förordning (EU) 2016/1628 vad gäller dess övergångsbestämmelser
    för vissa maskiner utrustade med motorer i effektintervallen på minst 56 kW
    och mindre än 130 kW och på minst 300 kW i syfte att hantera konsekvenserna
    av covid-19-krisen
