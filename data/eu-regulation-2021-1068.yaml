    kriisi mõju
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2021/1068, annettu 24 päivänä
    kesäkuuta 2021, asetuksen (EU) 2016/1628 muuttamisesta sen tiettyjä tehoalueeltaan
