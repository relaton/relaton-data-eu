    strojeve opremljene motorima rasponâ snage od 56 kW ili veće snage i snage manje
    od 130 kW te snage od 300 kW ili veće snage kako bi se odgovorilo na učinke
    krize uzrokovane bolešću COVID-19
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2021/1068 rendelete (2021. június
    24.) a Covid19-válság hatásainak kezelése érdekében az (EU) 2016/1628 rendeletnek
    bizonyos, 56 kW vagy annál nagyobb és 130 kW-nál kisebb, valamint 300 kW vagy
    annál nagyobb teljesítménytartományba tartozó motorokkal felszerelt gépekre
    vonatkozó átmeneti rendelkezések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/1068 del Parlamento europeo e del Consiglio del 24
    giugno 2021 che modifica il regolamento (UE) 2016/1628 per quanto riguarda le
    disposizioni transitorie per alcune macchine munite di motorinell’intervallo
    di potenza pari o superiore a 56 kW e inferiore a 130 kW e pari o superiore a
    300 kW, al fine di far fronte agli effetti della crisi COVID-19
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2021/1068 (2021. gada 24. jūnijs),
    ar ko groza Regulu (ES) 2016/1628 attiecībā uz tās pārejas noteikumiem par
    noteiktu tehniku, kas aprīkota ar motoriem, kuru jauda ir 56 kW vai lielāka,
    bet mazāka par 130 kW, un 300 kW vai lielāka, nolūkā mazināt Covid-19 izraisītās
    krīzes ietekmi
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2021/1068 2021 m. birželio
    24 d. kuriuo, siekiant atsižvelgti į COVID-19 krizės poveikį, iš dalies keičiamos
    Reglamento (ES) 2016/1628 pereinamojo laikotarpio nuostatos, taikomos tam tikriems
    mechanizmams su 56 kW arba didesnės ir 130 kW arba mažesnės galios ir 300 kW
    arba didesnės galios intervalų varikliais
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2021/1068 tal-Parlament Ewropew u tal-Kunsill tal-24 ta’
