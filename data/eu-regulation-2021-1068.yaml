    lena chuid forálacha idirthréimhseacha maidir le hinnealra áirithe atá feistithe
    le hinnill sna raonta cumhachta atá níos mó ná, nó cothrom le, 56 kW agus
    níos lú ná 130 kW, agus níos mó ná, nó cothrom le, 300 kW, chun aghaidh
    a thabhairt ar thionchar ghéarchéim COVID-19
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2021/1068 Europskog parlamenta i Vijeća od 24. lipnja 2021.
