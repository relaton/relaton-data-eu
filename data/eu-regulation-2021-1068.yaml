    τις μεταβατικές διατάξεις του για ορισμένα
    μηχανήματα που είναι εξοπλισμένα με κινητήρες
    στο εύρος ισχύος μεγαλύτερης των 56 kW και μικρότερης
    των 130 kW, και μεγαλύτερης ή ίσης των 300 kW, προκειμένου
    να αντιμετωπιστούν οι επιπτώσεις της κρίσης
    της COVID-19
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2021/1068, 24. juuni 2021,
