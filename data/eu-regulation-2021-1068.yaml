    varustettuja koneita koskevien siirtymäsäännösten osalta covid-19-kriisin
    vaikutusten huomioon ottamiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2021/1068 ó Pharlaimint na hEorpa agus ón gComhairle
