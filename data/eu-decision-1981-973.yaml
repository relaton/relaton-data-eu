title:
- language: en
  script: Latn
  content: '81/973/EEC: Commission Decision of 9 November 1981 authorizing Italy temporarily
    to take additional measures to protect itself against the introduction of Erwinia
    amylovora (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/973/CEE: Décision de la Commission, du 9 novembre 1981, autorisant
    l''Italie à prendre provisoirement des dispositions complémentaires en vue de
    se préserver contre l''introduction d''Erwinia amylovora (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/973/EWG: Entscheidung der Kommission vom 9. November 1981 zur Ermächtigung
    Italiens, vorläufig ergänzende Maßnahmen zum Schutz vor der Einschleppung von
    Erwinia amylovora zu treffen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/973/EØF: Kommissionens beslutning af 9. november 1981 om bemyndigelse
    af Italien til at træffe midlertidige supplerende foranstaltninger til beskyttelse
    mod indslæbning af Erwinia amylovora (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/973/EOK: Απόφαση τής Επιτροπής τής 9ης Νοεμβρίου
    1981 επιτρέπουσα στήν Ιταλία νά λάβει προσωρινά
    συμπληρωματικά μέτρα γιά τήν προστασία από
    τό βακτήριο Erwinia amylovora (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/973/CEE: Decisione della Commissione, del 9 novembre 1981, che autorizza
    l''Italia ad adottare provvisoriamente disposizioni complementari per premunirsi
    contro l''introduzione di Erwinia amylovora (Il testo in lingua italiana è il
    solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/973/EEG: Beschikking van de Commissie van 9 november 1981 tot machtiging
    van Italië om tijdelijk aanvullende maatregelen te treffen om het gevaar voor
    insleep van Erwinia amylovora af te wenden (Slechts de tekst in de Italiaanse
    taal is authentiek)'
