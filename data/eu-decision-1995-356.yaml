title:
- language: en
  script: Latn
  content: '95/356/Euratom: Commission Decision of 28 June 1995 concerning the conclusion
    of the Implementing Agreement between the European Atomic Energy Community, represented
    by the Commission of the European Communities, and Atomic Energy of Canada Limited
    designated as implementing agent by the Government of Canada on the involvement
    of Canada in the European Atomic Energy Community contribution to the Engineering
    Design Activities (EDA) for the International Thermonuclear Experimental Reactor
    (ITER), by the Commission, on behalf of the Community'
  type: main
- language: fr
  script: Latn
  content: '95/356/Euratom: Décision de la Commission, du 28 juin 1995, concernant
    la conclusion, par la Commission, au nom de la Communauté, de l''accord de mise
    en oeuvre entre la Communauté européenne de l''énergie atomique, représentée
    par la Commission des Communautés européennes, et l''Énergie atomique du Canada
    limitée (EACL), désignée comme agent de mise en oeuvre par le gouvernement
    du Canada, concernant la participation du Canada à la contribution de la Communauté
    européenne de l''énergie atomique aux activités ayant trait au projet détaillé
    (EDA) du réacteur thermonucléaire expérimental international (ITER)'
  type: main
- language: de
  script: Latn
  content: '95/356/Euratom: Beschluß der Kommission vom 28. Juni 1995 über den Abschluß
