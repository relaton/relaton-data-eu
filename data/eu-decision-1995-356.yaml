    durch die Kommission der Europäischen Gemeinschaften, und Atomic Energy of Canada
    Limited, von der kanadischen Regierung zur durchführenden Stelle ernannt, über
    die Beteiligung Kanadas am Beitrag der Europäischen Atomgemeinschaft zur Erstellung
    eines detaillierten technischen Entwurfs (EDA) für den Internationalen thermonuklearen
    Versuchsreaktor (ITER) durch die Kommission im Namen der Gemeinschaft'
  type: main
