title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1849/86 of 13 June 1986 introducing a countervailing
    charge on peaches including nectarines originating in Spain (except the Canary
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1849/86 de la Commission, du 13 juin 1986, instituant
    une taxe compensatoire à l'importation de pêches, y compris les brugnons et
    les nectarines, originaires d'Espagne (excepté les îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1849/86 der Kommission vom 13. Juni 1986 zur Einführung
    einer Ausgleichsabgabe auf die Einfuhr von Pfirsichen, einschließlich Nektarinen,
    mit Ursprung in Spanien (ausgenommen den Kanarischen Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1849/86 af 13. juni 1986 om opkrævning
    af en udligningsafgift ved indførsel af ferskner, herunder blodferskner og nektariner,
    med oprindelse i Spanien (med undtagelse af De kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1849/86 της Επιτροπής
    της 13ης Ιουνίου 1986 περί καθιερώσεως εξισωτικής
    εισφοράς κατά την εισαγωγή ροδακίνων στα οποία
    περιλαμβάνονται και τα brugnons και nectarines καταγωγής
    Ισπανίας (εκτός Καναρίων νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1849/86 della Commissione, del 13 giugno 1986, che
    istituisce una tassa di compensazione all'importazione di pesche, comprese le
    pesche noci, originarie della Spagna (eccetto le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1849/86 van de Commissie van 13 juni 1986 houdende
    instelling van een compenserende heffing bij invoer van perziken, nectarines daaronder
    begrepen, van oorsprong uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1849/86 da Comissão, de 13 de Junho de 1986, que
