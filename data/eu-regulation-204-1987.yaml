title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 204/87 of 22 January 1987 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing in the Community, repealing Regulation (EEC) No 3563/86 and amending
    Regulation (EEC) No 2182/77
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 204/87 de la Commission du 22 janvier 1987 relatif
    à la vente à prix fixé forfaitairement à l' avance, en vue de leur transformation
    dans la Communauté, de certaines viandes bovines provenant des stocks d' intervention,
    abrogeant le règlement (CEE) n° 3563/86 et modifiant le règlement (CEE) n°
    2182/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 204/87 der Kommission vom 22. Januar 1987 über den
