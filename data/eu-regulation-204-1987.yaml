    bestimmt ist, zu pauschal im voraus festgesetzten Preisen, zur Aufhebung der Verordnung
    (EWG) Nr. 3563/86 und zur Änderung der Verordnung (EWG) Nr. 2182/77
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 204/87 af 22. januar 1987 om salg til
    forudfastsatte priser af visse former for oksekød fra interventionslagrene med
    henblik på forarbejdning i Fællesskabet og om ophævelse af forordning (EØF)
    nr. 3563/86 og om ændring af forordning (EØF) nr. 2182/77
  type: main
- language: el
  script: Grek
