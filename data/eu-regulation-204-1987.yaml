  script: Latn
  content: Regolamento (CEE) n. 204/87 della Commissione del 22 gennaio 1987 relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte d' intervento e destinate alla trasformazione nella Comunità,
    recante abrogazione del regolamento (CEE) n. 3563/86 e che modifica il regolamento
    (CEE) n. 2182/77
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 204/87 van de Commissie van 22 januari 1987 inzake
