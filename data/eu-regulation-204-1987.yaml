    Gemeenschap, van rundvlees uit de voorraden van de interventiebureaus, houdende
    intrekking van Verordening (EEG) nr. 3563/86 en tot wijziging van Verordening
    (EEG) nr. 2182/77
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 204/87 da Comissão de 22 de Janeiro de 1987 relativo
