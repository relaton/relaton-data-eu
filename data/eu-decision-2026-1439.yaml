  content: Rådets beslut (EU) 2026/1439 av den 25 juni 2026 om bemyndigande att inleda
    förhandlingar om protokoll mellan unionen och Island, Konungariket Norge, Schweiziska
    edsförbundet och Furstendömet Liechtenstein, om komplettering av deras respektive
    avtal och protokoll om kriterier och mekanismer för att fastställa vilken stat
    som ska ansvara för handläggningen av en asylansökan som görs i dessa länder,
    i syfte att införa regler som möjliggör deras deltagande i delarna II och IV
    i Europaparlamentets och rådets förordning (EU) 2024/1351 och i kapitlen II
    och III i Europaparlamentets och rådets förordning (EU) 2024/1359
