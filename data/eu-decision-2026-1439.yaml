  content: A Tanács (EU) 2026/1439 határozata (2026. június 25.) az Unió, valamint
    Izland, a Norvég Királyság, a Svájci Államszövetség és a Liechtensteini
    Hercegség közötti, az említett országokban benyújtott menedékjog iránti
    kérelem megvizsgálásáért felelős tagállam meghatározására vonatkozó
    feltételek és eljárási szabályok megállapításáról szóló megállapodásaikat
    és jegyzőkönyvüket az (EU) 2024/1351 európai parlamenti és tanácsi rendelet
