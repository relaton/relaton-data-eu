  script: Latn
  content: Besluit (EU) 2026/1439 van de Raad van 25 juni 2026 tot machtiging tot
    het openen van onderhandelingen met het oog op protocollen tussen de Unie en IJsland,
    het Koninkrijk Noorwegen, de Zwitserse Bondsstaat en het Vorstendom Liechtenstein
    ter aanvulling van hun respectieve overeenkomsten en respectief protocol inzake
    de criteria en mechanismen voor de vaststelling van de staat die verantwoordelijk
    is voor de behandeling van een in die landen ingediend asielverzoek, om er regels
    in op te nemen om hun deelname aan de delen II en IV van Verordening (EU) 2024/1351
    van het Europees Parlement en de Raad en aan de hoofdstukken II en III van Verordening
    (EU) 2024/1359 van het Europees Parlement en de Raad mogelijk te maken
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2026/1439 z dnia 25 czerwca 2026 r. upoważniająca do
    podjęcia rokowań w sprawie protokołów między Unią a, Republiką Islandii,
    Królestwem Norwegii, Konfederacją Szwajcarską i Księstwem Liechtensteinu,
    uzupełniających ich odnośne umowy i protokół dotyczące kryteriów i mechanizmów
    umożliwiających określanie państwa właściwego dla rozpatrywania wniosku
    o udzielenie azylu złożonego w tych państwach w celu uwzględnienia przepisów
    umożliwiając uczestnictwo tych państw w stosowaniu przepisów części II i
    IV rozporządzenia Parlamentu Europejskiego i Rady (UE) 2024/1351 oraz rozdziałów
    II i III rozporządzenia Parlamentu Europejskiego i Rady (UE) 2024/1359
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2026/1439 do Conselho, de 25 de junho de 2026, que autoriza
    a abertura de negociações tendo em vista protocolos entre a União Europeia,
    e a Islândia, o Reino da Noruega, a Confederação Suíça e o Principado do
    Listenstaine, respetivamente, que completam os respetivos acordos e protocolo
    relativos aos critérios e mecanismos para determinar o Estado responsável pela
    análise de um pedido de asilo apresentado nestes países, de modo a incluir as
    regras que permitam a sua participação nas partes II e IV do Regulamento (UE)
    2024/1351 do Parlamento Europeu e do Conselho e nos capítulos II e III do Regulamento
    (UE) 2024/1359 do Parlamento Europeu e do Conselho
  type: main
