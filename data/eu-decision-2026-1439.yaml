    in tali paesi, allo scopo di includere le norme che consentano la partecipazione
    di tali paesi alle parti II e IV del regolamento (UE) 2024/1351 del Parlamento
    europeo e del Consiglio e ai capi II e III del regolamento (UE) 2024/1359 del
    Parlamento europeo e del Consiglio
  type: main
