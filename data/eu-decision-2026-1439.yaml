  script: Latn
  content: Decisión (UE) 2026/1439 del Consejo, de 25 de junio de 2026, por la que
    se autoriza la apertura de negociaciones relativas a protocolos entre la Unión
    e Islandia, el Reino de Noruega, la Confederación Suiza y el Principado de Liechtenstein
    que complementen sus acuerdos y protocolo respectivos en lo que respecta a los
    criterios y mecanismos para determinar el Estado responsable de examinar una solicitud
    de asilo presentada en dichos países, a fin de incluir normas que permitan su
    participación en las partes II y IV del Reglamento (UE) 2024/1351 del Parlamento
    Europeo y del Consejo y en los capítulos II y III del Reglamento (UE) 2024/1359
    del Parlamento Europeo y del Consejo
  type: main
