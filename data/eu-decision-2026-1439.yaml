  script: Latn
  content: Nõukogu otsus (EL) 2026/1439, 25. juuni 2026, millega antakse luba alustada
    läbirääkimisi liidu ja Islandi, Norra Kuningriigi, Šveitsi Konföderatsiooni
    ja Liechtensteini Vürstiriigi vahel protokollide üle, millega täiendatakse
    nende vastavaid lepinguid ja protokolli, mis käsitlevad nendes riikides esitatud
    varjupaigataotluse läbivaatamise eest vastutava riigi määratlemise kriteeriume
    ja mehhanisme, et lisada normid, mis võimaldavad nende riikide osalemist Euroopa
    Parlamendi ja nõukogu määruse (EL) 2024/1351 II ja IV osas ning Euroopa Parlamendi
    ja nõukogu määruse (EL) 2024/1359 II ja III peatükis
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2026/1439, annettu 25 päivänä kesäkuuta 2026,
    luvan antamisesta aloittaa neuvottelut unionin sekä Islannin, Norjan kuningaskunnan,
    Sveitsin valaliiton ja Liechtensteinin ruhtinaskunnan välillä pöytäkirjoista,
    joilla täydennetään niiden kanssa niistä perusteista ja menettelyistä, joilla
    ratkaistaan kyseisissä maissa jätetyn turvapaikkahakemuksen käsittelystä vastuussa
    oleva valtio tehtyjä sopimuksia ja pöytäkirjaasäännöillä niiden osallistumisesta
    Euroopan parlamentin ja neuvoston asetuksen (EU) 2024/1351 II ja IV osaan ja Euroopan
    parlamentin ja neuvoston asetuksen (EU) 2024/1359 II ja III lukuun
