  script: Latn
  content: Sklep Sveta (EU) 2026/1439 z dne 25. junija 2026 o pooblastilu za začetek
    pogajanj o protokolih med Unijo ter Islandijo, Kraljevino Norveško, Švicarsko
    konfederacijo in Kneževino Lihtenštajn za dopolnitev njihovih sporazumov in
    protokola o kriterijih/merilih in mehanizmih za določitev države, odgovorne
