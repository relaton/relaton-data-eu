    příslušného pro posuzování žádosti o azyl podané v uvedených zemích
    s cílem zahrnout pravidla pro jejich účast na části II a IV nařízení Evropského
    parlamentu a Rady (EU) 2024/1351 a na kapitole II a III nařízení Evropského
    parlamentu a Rady (EU) 2024/1359
  type: main
