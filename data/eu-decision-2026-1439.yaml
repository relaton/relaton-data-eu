- language: en
  script: Latn
  content: Council Decision (EU) 2026/1439 of 25 June 2026 authorising the opening
    of negotiations for protocols between the Union and Iceland, the Kingdom of Norway,
    the Swiss Confederation and the Principality of Liechtenstein supplementing their
    respective agreements and protocol concerning the criteria and mechanisms for
    establishing the State responsible for examining a request for asylum lodged in
    those countries, to include rules to enable their participation in Parts II and
    IV of Regulation (EU) 2024/1351 of the European Parliament and of the Council
    and in Chapters II and III of Regulation (EU) 2024/1359 of the European Parliament
    and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/1439 du Conseil du 25 juin 2026 autorisant l’ouverture
    de négociations sur des protocoles entre l’Union et l’Islande, le Royaume
    de Norvège, la Confédération suisse et la Principauté de Liechtenstein complétant
    leurs accords et protocole respectifs relatifs aux critères et aux mécanismes
    permettant de déterminer l’État responsable de l’examen d’une demande
    d’asile introduite dans ces pays, afin d’y inclure des règles permettant
    leur participation aux parties II et IV du règlement (UE) 2024/1351 du Parlement
    européen et du Conseil et aux chapitres II et III du règlement (UE) 2024/1359
    du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/1439 des Rates vom 25. Juni 2026 über die Ermächtigung
    zur Aufnahme von Verhandlungen über Protokolle zwischen der Union und Island,
    dem Königreich Norwegen, der Schweizerischen Eidgenossenschaft und dem Fürstentum
    Liechtenstein zur Ergänzung ihrer jeweiligen Abkommen und des Protokolls über
    die Kriterien und Verfahren zur Bestimmung des zuständigen Staates für die Prüfung
    eines in dem jeweiligen Land gestellten Asylantrags, um Vorschriften aufzunehmen,
    die ihre Beteiligung an den Teilen II und IV der Verordnung (EU) 2024/1351 des
    Europäischen Parlaments und des Rates und den Kapiteln II und III der Verordnung
    (EU) 2024/1359 des Europäischen Parlaments und des Rates ermöglichen
  type: main
- language: bg
  script: Cyrl
