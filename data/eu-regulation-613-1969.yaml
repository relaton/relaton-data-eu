  content: Règlement (CEE) n 613/69 de la Commission, du 28 mars 1969, fixant les
    taux des restitutions applicables, à compter du 1er avril 1969, à certains produits
    laitiers exportés sous forme de marchandises ne relevant pas de l'annexe II du
    traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 613/69 der Kommission vom 28. März 1969 zur Festsetzung
    der ab 1. April 1969 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 613/69 della Commissione, del 28 marzo 1969, che fissa
    i tassi delle restituzioni applicabili, a decorrere dal 1 aprile 1969, a taluni
    prodotti lattiero-caseari esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 613/69 van de Commissie van 28 maart 1969 houdende
    vaststelling van de restituties welke vanaf 1 april 1969 van toepassing zijn op
    bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
