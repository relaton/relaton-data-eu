    di cui vengono diminuiti i diritti all' importazione i prodotti del settore delle
    carni bovine, originari degli Stati africani, dei Caraibi e del Pacifico, per
    il periodo che inizia il 20 maggio 1982
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1242/82 van de Commissie van 19 mei 1982 houdende
