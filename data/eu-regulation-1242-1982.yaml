title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1242/82 of 19 May 1982 derogating from Regulation
    (EEC) No 486/80 as regards the calculation of the amount of the reduction of import
    duties for beef and veal products from the African, Caribbean and Pacific States
    for the period beginning 20 May 1982
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1242/82 de la Commission, du 19 mai 1982, portant
    dérogation du règlement (CEE) n° 486/80 en ce qui concerne le calcul des montants
    de diminution des droits à l' importation de produits du secteur de la viande
    bovine originaires des États d' Afrique, des Caraïbes et du Pacifique pour la
    période débutant le 20 mai 1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1242/82 der Kommission vom 19. Mai 1982 zur Abweichung
    von der Verordnung (EWG) Nr. 486/80 betreffend die Berechnung der Beträge zur
    Senkung der Eingangsabgaben für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean für den am 20. Mai 1982
    beginnenden Zeitraumn
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1242/82 af 19. maj 1982 om undtagelse
    fra forordning (EØF) nr. 486/80 med hensyn til beregningen af de beløb, hvormed
    importafgiften nedsættes ved indførsel af oksekød fra lande i Afrika, Vestindien
    og Stillehavet i den periode, der begynder den 20. maj 1982r
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1242/82 τής Επιτροπής
    τής 19ης Μαΐου 1982 περί παρεκκλίσεως από τόν
    κανονισμό (EOK) αριθ. 486/80 όσον αφορά τόν υπολογισμό
