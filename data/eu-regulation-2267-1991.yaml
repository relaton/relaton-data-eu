  content: Commission Regulation (EEC) No 2267/91 of 29 July 1991 determining, for
    tobacco from the 1990 harvest, the quantity actually produced and the prices and
    premiums payable under the system of maximum guaranteed quantities
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2267/91 DE LA COMMISSION du 29 juillet 1991 établissant,
