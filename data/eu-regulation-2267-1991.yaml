    et les primes à payer en application du régime des quantités maximales garanties
    #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2267/91 DER KOMMISSION vom 29. Juli 1991 zur Feststellung
