title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/1212 of 29 May 2026 on the position to be taken
    on behalf of the European Union within the Committee of the Parties to the Council
    of Europe Convention on preventing and combating violence against women and domestic
    violence, at its 20th meeting, concerning conclusions on the implementation of
    recommendations in respect of certain Parties to that Convention and concerning
    the election of members of the Group of experts on action against violence against
    women and domestic violence, with regard to matters related to institutions and
    public administration of the Union
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/1212 du Conseil du 29 mai 2026 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité des parties à
    la convention du Conseil de l’Europe sur la prévention et la lutte contre la
    violence à l’égard des femmes et la violence domestique, lors de sa 20e réunion,
    au sujet des conclusions sur la mise en œuvre de recommandations concernant certaines
    parties à ladite convention, ainsi que de l’élection de membres du groupe
    d’experts sur la lutte contre la violence à l’égard des femmes et la violence
    domestique, en ce qui concerne les questions liées aux institutions et à l’administration
    publique de l’Union
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/1212 des Rates vom 29. Mai 2026 über den im Namen
    der Europäischen Union im Ausschuss der Vertragsparteien des Übereinkommens
    des Europarats zur Verhütung und Bekämpfung von Gewalt gegen Frauen und häuslicher
    Gewalt auf seiner 20. Sitzung zur hinsichtlich der Schlussfolgerungen zur Durchführung
    der Empfehlungen die an bestimmte Vertragsparteien dieses Übereinkommens gerichtet
    sind und zur Wahl von Mitgliedern der Expertengruppe für die Bekämpfung von
    Gewalt gegen Frauen und häuslicher Gewalt in Bezug auf Aspekte, die die Organe
    und die öffentliche Verwaltung der Union betreffen, zu vertretenden Standpunkt
