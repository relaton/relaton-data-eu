  content: Regulation (EEC) No 2991/74 of the Council of 26 November 1974 temporarily
    suspending totally the customs duties applicable in the Community as originally
    constituted to a number of chemical products imported from the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2991/74 du Conseil, du 26 novembre 1974, portant suspension
    temporaire et totale des droits de douane applicables dans la Communauté dans
    sa composition originaire sur un certain nombre de produits chimiques importés
    des nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2991/74 des Rates vom 26. November 1974 zur zeitweiligen
    und vollständigen Aussetzung der in der Gemeinschaft in ihrer ursprünglichen
    Zusammensetzung anwendbaren Zollsätze für die Einfuhr von einigen chemischen
    Waren aus den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2991/74 af 26. november 1974 om midlertidig
