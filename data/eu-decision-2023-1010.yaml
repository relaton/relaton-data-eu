    de négociations avec la République fédérative du Brésil en vue d’un accord
    entre l’Union européenne et la République fédérative du Brésil sur l’échange
    de données à caractère personnel entre l’Agence de l’Union européenne
    pour la coopération des services répressifs (Europol) et les autorités brésiliennes
    compétentes pour lutter contre les formes graves de criminalité et le terrorisme
  type: main
