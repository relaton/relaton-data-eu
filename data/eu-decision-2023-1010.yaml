title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/1010 of 15 May 2023 authorising the opening
    of negotiations with the Federative Republic of Brazil for an agreement between
    the European Union and the Federative Republic of Brazil on the exchange of personal
    data between the European Union Agency for Law Enforcement Cooperation (Europol)
    and the Brazilian authorities competent for fighting serious crime and terrorism
  type: main
- language: fr
  script: Latn
