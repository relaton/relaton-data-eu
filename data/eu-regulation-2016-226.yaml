  script: Latn
  content: Commission Implementing Regulation (EU) 2016/226 of 17 February 2016 amending
    Implementing Regulation (EU) No 999/2014 imposing a definitive anti-dumping duty
    on imports of ammonium nitrate originating in Russia following an expiry review
    pursuant to Article 11(2) of Council Regulation (EC) No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/226 de la Commission du 17 février 2016
