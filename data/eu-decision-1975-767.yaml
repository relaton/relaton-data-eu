  script: Latn
  content: '75/767/EEC: Council Decision of 9 December 1975 accepting the Customs
    Cooperation Council''s recommendation of 1 January 1975 designed to enable statistical
    data on international trade collected on the basis of the Brussels Nomenclature
    to be expressed in terms of the second revision of the Standard International
    Trade Classification'
  type: main
- language: fr
  script: Latn
