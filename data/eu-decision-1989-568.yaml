  script: Latn
  content: '89/568/EEC: Commission Decision of 25 October 1989 terminating the review
    of anti-dumping measures applying to imports of certain synthetic fibre hand-knitting
    yarn originating in Turkey and confirming the expiry of the said measures'
  type: main
- language: fr
  script: Latn
  content: '89/568/CEE: Décision de la Commission du 25 octobre 1989 portant clôture
    du réexamen des mesures antidumping applicables aux importations de certains
    fils à tricoter à la main, constitués de fibres textiles synthétiques, originaires
    de Turquie et confirmant l''expiration desdites mesures'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 25. Oktober 1989 über den Abschluß der
    Überprüfung der Antidumpingmaßnahmen betreffend die Einfuhren bestimmter Handstrickgarne
    aus synthetischen oder künstlichen Spinnfasern mit Ursprung in der Türkei und
    zur Bestätigung des Auslaufens dieser Maßnahmen (89/568/EWG) (89/568/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 25. oktober 1989 om afslutning af den fornyede
    undersøgelse af antidumpingforanstaltningerne vedrørende importen af visse typer
    strikkegarn af syntetiske fibre med oprindelse i Tyrkiet og om bekræftelse af
    ophøret af nævnte foranstaltninger (89/568/EØF) (89/568/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/568/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Οκτωβρίου 1989 για την περάτωση της επανεξέτασης
    των μέτρων αντιντάμπινγκ που εφαρμόζονται
    στις εισαγωγές ορισμένων χειροποίητων νημάτων
    από συνθετικές υφαντικές ίνες, καταγωγής Τουρκίας,
    και την επιβεβαίωση της λήξης των εν λόγω μέτρων'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 25 ottobre 1989 che chiude la procedura
    di riesame delle misure antidumping applicabili alle importazioni di taluni filati
    di fibre sintetiche per maglieria a mano, originari della Turchia, e che conferma
    la scadenza di tali misure (89/568/CEE) (89/568/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 25 oktober 1989 tot beëindiging van het
