  script: Latn
  content: Council Implementing Regulation (EU) 2017/395 of 7 March 2017 implementing
    Article 13 of Regulation (EU) No 356/2010 imposing certain specific restrictive
    measures directed against certain natural or legal persons, entities or bodies,
    in view of the situation in Somalia
  type: main
- language: fr
  script: Latn
