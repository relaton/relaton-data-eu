type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2437/78 of 18 October 1978 re-establishing
    the levying of customs duties on narrow woven fabrics and narrow fabrics (bolduc),
    consisting of warp without weft assembled by means of an adhesive, other than
    goods falling within heading No 58.06, falling within heading No 58.05, originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2437/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables à la rubanerie
    et rubans sans trame en fils ou fibres parallélisés et encollés, à l' exclusion
    des articles du n° 58.06, de la position tarifaire 58.05, originaires des pays
    et territoires en voie de développement, bénéficiaires de préférences tarifaires
    prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2437/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Bánder und schußlose Bánder aus parallel gelegten und geklebten
    Garnen oder Spinnstoffen (bolducs), ausgenommen Waren der Tarifnummer 58.06, der
    Tarifnummer 58.05, mit Ursprung in Entwicklungslándern, denen die in der Verordnung
    (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2437/78 af 18. oktober 1978 om genindførelse
    af toldafgifter for vævede bånd (bortset fra varer henhørende under position
    58.06) og bånd bestående af sammenlimede parallelle garner eller fibre, under
    position 58.05, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2437/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai nastri, galloni e simili
    e ai nastri senza trama di fibre o di fili disposti parallelamente ed incollati
    (bolduc), esclusi i manufatti della voce 58.06, della voce 58.05 della tariffa
    doganale comune, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2437/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op lint, alsmede
    bolduclint, zijnde lint zonder inslag van aaneengelijmde evenwijdig lopende draden
    of textielvezels, met uitzondering van de artikelen bedoeld bij post 58.06, van
    post 58.05, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 1197/78 van de Raad tariefpreferenties werden geopend
  type: main
