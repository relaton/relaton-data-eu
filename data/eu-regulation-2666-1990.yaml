    σχοινιά και χονδρά σχοινιά, πλεκτά ή μη, προϊόντα
    της κατηγορίας 90 ( αύξων αριθμός 40.0900 ), και στα
    είδη κατασκευασμένα με νήματα κατηγορίας προϊόντων
