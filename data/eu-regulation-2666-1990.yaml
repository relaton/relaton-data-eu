  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2666/90 DELLA COMMISSIONE del 17 settembre 1990 che
    ripristina la riscossione dei dazi doganali applicabili allo spago, alle corde
    e alle funi di fibre tessili sintetiche della categoria di prodotti n. 90 (numero
    d'ordine 40.0900) e agli oggetti della categoria di prodotti n. 98 (numero d'ordine
    40.0980) originari della Cina, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2666/90 VAN DE COMMISSIE van 17 september 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bindgaren,
    touw en kabel, van synthetische vezels, van de categorie van produkten nr. 90
    (volgnummer 40.0900) en artikelen van de categorie van produkten nr. 98 (volgnummer
    40.0980), van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3897/89 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2666/90 DA COMISSAO de 17 de Setembro de 1990 que
