title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2060/81 of 14 July 1981 fixing the accession
    compensatory amounts applicable in the cereals sector for the 1981/82 marketing
    year and the coefficients to be used for the calculation of the amounts on processed
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2060/81 de la Commission, du 14 juillet 1981, fixant
    les montants compensatoires "adhésion" applicables dans le secteur des céréales
    pour la campagne de commercialisation 1981/1982 ainsi que les coefficients à
    retenir pour le calcul des montants applicables aux produits transformés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2060/81 der Kommission vom 14. Juli 1981 zur Festsetzung
    der für das Wirtschaftsjahr 1981/82 anwendbaren Beitrittsausgleichsbeträge für
    Getreide sowie der Koeffizienten zur Berechnung der Beitrittsausgleichsbeträge
    für Verarbeitungserzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2060/81 af 14. juli 1981 om fastsættelse
    af tiltrædelsesudligningsbeløbene for korn for markedsåret 1981/82 og af de
    koefficienter, der skal anvendes ved beregning af de beløb, der gælder for forarbejdende
    produkter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2060/81 τής Επιτροπής
    τής 14ης Ιουλίου 1981 περί καθορισμού τών εξισωτικών
    ποσών προσχωρήσεως τά οποία εφαρμόζονται στόν
    τομέα τών σιτηρών γιά τήν περίοδο εμπορίας
    1981/82, καθώς καί τών συντελεστών πού λαμβάνονται
    υπόψη γιά τόν υπολογισμό τών ποσών πού εφαρμόζονται
    στά μεταποιημένα προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2060/81 della Commissione, del 14 luglio 1981, che
    fissa gli importi compensativi "adesione" applicabili nel settore dei cereali
    per la campagna di commercializzazione 1981/1982, nonché i coefficienti necessari
    per il calcolo degli importi applicabili ai prodotti trasformati
  type: main
- language: nl
