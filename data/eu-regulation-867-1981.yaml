title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 867/81 of 1 April 1981 re-establishing the
    levying of customs duties on textile fabrics impregnated, etc., products of category
    100 (1000), originating in South Korea, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 867/81 de la Commission, du 1er avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux tissus imprégnés,
    etc., de la catégorie de produits n° 100 (code 1000), originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 867/81 der Kommission vom 1. April 1981 über die
    Wiedereinführung des Zollsatzes für Gewebe, getränkt, usw., der Warenkategorie
    Nr. 100 (Kennziffer 1000), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 867/81 af 1. april 1981 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer, imprægneret, etc. under kategori
    100 (kode 1 000), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 867/81 τής Επιτροπής
