    εμπεποτισμένα, κλπ. , προϊόντων τής κατηγορίας
    αριθ. 100 (κώδικας 1000), καταγωγής Νοτίου Κορέας,
    δικαιούχων τών προβλεπομένων στόν κανονισμό
    (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 867/81 della Commissione, del 1° aprile 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti impregnati,
    ecc., della categoria di prodotti n. 100 (codice 1000), originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 867/81 van de Commissie van 1 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels,
    geïmpregneerd, enz., van categorie van produkten 100 (codenummer 1000), van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3320/80 van de Raad
