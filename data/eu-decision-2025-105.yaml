title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/105 of 22 January 2025 amending
    Decision 2006/771/EC updating harmonised technical conditions in the area of radio
    spectrum use for short-range devices and repealing Implementing Decision 2014/641/EU
    on harmonised technical conditions of radio spectrum use by wireless audio programme
    making and special events equipment in the Union (notified under document C(2025)
    192)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/105 de la Commission du 22 janvier 2025
    modifiant la décision 2006/771/CE pour mettre à jour les conditions techniques
    harmonisées d’utilisation du spectre radioélectrique pour les dispositifs
    à courte portée et abrogeant la décision d’exécution 2014/641/UE sur l’harmonisation
    des conditions techniques d’utilisation du spectre radioélectrique par les
    équipements audio sans fil pour la réalisation de programmes et d’événements
    spéciaux dans l’Union [notifiée sous le numéro C(2025) 192]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/105 der Kommission vom 22. Januar 2025
    zur Änderung der Entscheidung 2006/771/EG im Hinblick auf die Aktualisierung
    der harmonisierten technischen Bedingungen für die Frequenznutzung durch Geräte
    mit geringer Reichweite und zur Aufhebung des Durchführungsbeschlusses 2014/641/EU
    über harmonisierte technische Bedingungen für die Nutzung von Funkfrequenzen
    durch drahtlose PMSE-Audioausrüstungen in der Union (Bekannt gegeben unter Aktenzeichen
    C(2025) 192)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/105 на Комисията
    от 22 януари 2025 година за изменение на Решение
    2006/771/ЕО с оглед актуализиране на хармонизираните
    технически условия в областта на използването
    на радиочестотния спектър за устройства с
    малък обсег на действие и за отмяна на Решение
    за изпълнение 2014/641/ЕС относно хармонизирани
    технически условия за използването на радиочестотния
    спектър от безжично звукотехническо оборудване
    за подготовка на програми и специални прояви
    в Съюза (нотифицирано под номер С(2025) 192)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/105 ze dne 22. ledna 2025, kterým
    se mění rozhodnutí 2006/771/ES s cílem aktualizovat harmonizované technické
    podmínky v oblasti užívání rádiového spektra pro zařízení krátkého
    dosahu a zrušuje prováděcí rozhodnutí 2014/641/EU o harmonizovaných technických
    podmínkách využívání rádiového spektra bezdrátovými zvukovými zařízeními
    pro zajištění zpravodajských programů a pořádání hromadných společenských
    akcí (PMSE) v Unii (oznámeno pod číslem C(2025) 192)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/105 af 22. januar 2025
    om ændring af beslutning 2006/771/EF for så vidt angår ajourføring af harmoniserede
    tekniske vilkår for brug af radiofrekvenser til kortdistanceudstyr og om ophævelse
    af gennemførelsesafgørelse 2014/641/EU om samordnede tekniske vilkår for brug
    af frekvenser til trådløst PMSE-lydudstyr i Unionen (meddelt under nummer C(2025)
    192)
  type: main
- language: el
  script: Grek
