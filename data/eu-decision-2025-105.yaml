    jaoks kasutatavate raadiosageduste vallas, ning tunnistatakse kehtetuks otsus
    2014/641/EL, milles käsitletakse liidus programmitootmise ja erisündmuste edastamise
    traadita audioseadmetes kasutatava raadiospektriga seotud ühtlustatud tehnilisi
