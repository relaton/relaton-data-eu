  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2025/105 z dne 22. januarja 2025 o spremembi
    Odločbe 2006/771/ES in posodobitvi harmoniziranih tehničnih pogojev na področju
    uporabe radiofrekvenčnega spektra za naprave kratkega dosega ter razveljavitvi
    Izvedbenega sklepa 2014/641/EU o usklajenih tehničnih pogojih za uporabo radiofrekvenčnega
    spektra za brezžično avdioopremo za izdelavo programov in posebne dogodke v
    Uniji (notificirano pod dokumentarno številko C(2025) 192)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2025/105 de la Comisión, de 22 de enero de
    2025, por la que se modifica la Decisión 2006/771/CE en el sentido de actualizar
    las condiciones técnicas armonizadas de uso del espectro radioeléctrico para
    los dispositivos de corto alcance, y se deroga la Decisión de Ejecución 2014/641/UE
    sobre las condiciones técnicas armonizadas relativas al uso del espectro radioeléctrico
    por los equipos inalámbricos de audio para la creación de programas y acontecimientos
    especiales en la Unión [notificada con el número C(2025) 192]
  type: main
- language: sv
