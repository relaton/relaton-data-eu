    radiotaajuuksien yhdenmukaistettujen teknisten ehtojen päivittämiseksi ja unionissa
    ohjelma- ja tapahtumatuotannon langattomissa audiolaitteistoissa käytettäviä
    radiotaajuuksia koskevista yhdenmukaistetuista teknisistä ehdoista annetun täytäntöönpanopäätöksen
    2014/641/EU kumoamisesta (tiedoksiannettu numerolla C(2025) 192)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2025/105 ón gCoimisiún an 22 Eanáir 2025
    lena leasaítear Cinneadh 2006/771/CE lena nuashonraítear coinníollacha teicniúla
    comhchuibhithe i réimse na húsáide speictrim raidió le haghaidh gairis gearr-raoin
    agus lena n-aisghairtear Cinneadh Cur Chun Feidhme 2014/641/AE maidir le coinníollacha
    teicniúla comhchuibhithe i ndáil le húsáid speictrim raidió i dtaifeadadh
    clár fuaime gan sreang agus ag trealamh le haghaidh imeachtaí speisialta san
    Aontas (tugadh fógra faoi leis an doiciméad C(2025) 192)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2025/105 оd 22. siječnja 2025. o izmjeni
    Odluke 2006/771/EZ radi ažuriranja usklađenih tehničkih uvjeta u području
    uporabe radiofrekvencijskog spektra za uređaje malog dometa i o stavljanju izvan
    snage Provedbene odluke 2014/641/EU o usklađenim tehničkim uvjetima uporabe
    radiofrekvencijskog spektra za bežičnu audioopremu za proizvodnju programa pri
    prijenosu posebnih događaja u Uniji (priopćeno pod brojem dokumenta C(2025)
    192)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/105 végrehajtási határozata (2025. január 22.)
    a 2006/771/EK határozatnak a kis hatótávolságú eszközök általi rádióspektrum-használattal
    kapcsolatos harmonizált műszaki feltételek naprakésszé tétele céljából
    történő módosításáról és az Unión belül a műsorgyártáshoz és különleges
    eseményekhez használt vezeték nélküli hangfrekvenciás berendezések általi
    rádióspektrum-használat harmonizált műszaki feltételeiről szóló 2014/641/EU
    végrehajtási határozat hatályon kívül helyezéséről (az értesítés a
    C(2025) 192. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/105 della Commissione, del 22 gennaio
    2025, che modifica la decisione 2006/771/CE aggiornando le condizioni tecniche
    armonizzate nell’ambito dell’uso dello spettro radio per le apparecchiature
    a corto raggio e abroga la decisione di esecuzione 2014/641/UE relativa alle condizioni
    tecniche armonizzate per l’utilizzo dello spettro radio da parte delle apparecchiature
    audio senza fili per la realizzazione di programmi e di eventi speciali nell’Unione
    [notificata con il numero C(2025) 192]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/105 (2025. gada 22. janvāris)
    par Lēmuma 2006/771/EK grozījumiem, kas atjaunina harmonizētos tehniskos noteikumus
    maza darbības attāluma ierīču radiofrekvenču spektra izmantošanas jomā
    un atceļ Īstenošanas lēmumu 2014/641/ES par harmonizētajiem tehniskajiem
    nosacījumiem radiofrekvenču spektra izmantošanai programmu gatavošanas un
    īpašo pasākumu bezvadu skaņas iekārtās Savienībā (izziņots ar dokumenta
    numuru C(2025) 192)
  type: main
- language: lt
  script: Latn
  content: 2025 m. sausio 22 d. Komisijos įgyvendinimo sprendimas (ES) 2025/105,
    kuriuo dėl suderintų techninių radijo spektro naudojimo mažojo nuotolio radijo
    ryšio įrenginiams sąlygų atnaujinimo iš dalies keičiamas Sprendimas 2006/771/EB
    ir kuriuo panaikinamas Įgyvendinimo sprendimas 2014/641/ES dėl suderintų techninių
    radijo spektro naudojimo Sąjungoje programų kūrimo ir specialiųjų renginių
    belaidei garso įrangai sąlygų (pranešta dokumentu Nr. C(2025) 192)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/105 tat-22
    ta’ Jannar 2025 li temenda d-Deċiżjoni 2006/771/KE li taġġorna l-kundizzjonijiet
    tekniċi armonizzati fil-qasam tal-użu tal-ispettru tar-radju għall-apparati
    ta’ medda qasira u li tħassar id-Deċiżjoni ta’ Implimentazzjoni 2014/641/UE
    dwar il-kundizzjonijiet tekniċi armonizzati għall-użu tal-ispettru tar-radju
    minn tagħmir tal-awdjo mingħajr fili għall-ħolqien ta’ programmi u avvenimenti
    speċjali fl-Unjoni (notifikata bid-dokument C(2025) 192)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2025/105 van de Commissie van 22 januari 2025 tot
    wijziging van Beschikking 2006/771/EG betreffende de actualisering van de geharmoniseerde
    technische voorwaarden voor gebruik van radiospectrum door korteafstandsapparatuur
    en tot intrekking van Uitvoeringsbesluit 2014/641/EU betreffende geharmoniseerde
    technische voorwaarden voor gebruik in de Unie van radiospectrum door draadloze
    apparatuur voor programmaproductie en speciale evenementen (Kennisgeving geschied
    onder nr. C(2025) 192)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2025/105 z dnia 22 stycznia 2025 r. zmieniająca
    decyzję 2006/771/WE aktualizującą zharmonizowane warunki techniczne w dziedzinie
    wykorzystywania widma radiowego na potrzeby urządzeń bliskiego zasięgu oraz
    uchylająca decyzję wykonawczą 2014/641/UE w sprawie zharmonizowanych warunków
    technicznych wykorzystywania widma radiowego przez bezprzewodowe urządzenia do
    transmisji sygnałów akustycznych użytkowane do realizacji programów i imprez
    specjalnych w Unii Europejskiej (notyfikowana jako dokument nr C(2025) 192)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/105 da Comissão, de 22 de janeiro de
    2025, que altera a Decisão 2006/771/CE com vista a atualizar as condições técnicas
    harmonizadas no domínio da utilização do espetro de radiofrequências para
    equipamentos de curto alcance e que revoga a Decisão de Execução 2014/641/UE
    relativa às condições técnicas harmonizadas de utilização do espetro radioelétrico
    por equipamentos áudio sem fios na realização de programas e eventos especiais
    na União [notificada com o número C(2025) 192]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/105 a Comisiei din 22 ianuarie
    2025 de modificare a Deciziei 2006/771/CE în vederea actualizării condițiilor
    tehnice armonizate de utilizare a spectrului de frecvențe radio pentru dispozitivele
    cu rază mică de acțiune și de abrogare a Deciziei de punere în aplicare 2014/641/UE
    privind condițiile tehnice armonizate de utilizare a spectrului de frecvențe
    radio de către echipamentele audio pe suport radio utilizate pentru producția
    de programe și pentru evenimente speciale în Uniune [notificată cu numărul
    C(2025) 192]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2025/105 z 22. januára 2025, ktorým
    sa mení rozhodnutie 2006/771/ES o harmonizácii rádiového frekvenčného spektra
    na využitie zariadeniami s krátkym dosahom a zrušení vykonávacieho rozhodnutia
    2014/641/EÚ o harmonizovaných technických podmienkach využívania rádiového
    frekvenčného spektra bezdrôtovými zariadeniami na výrobu zvukových programov
    a osobitných podujatí v Únii [oznámené pod číslom C(2025) 192]
  type: main
