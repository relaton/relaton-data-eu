  content: Kommissionens genomförandebeslut (EU) 2025/105 av den 22 januari 2025
    om ändring av beslut 2006/771/EG vad gäller uppdatering av harmoniserade tekniska
    villkor på området radiospektrumanvändning för kortdistansutrustning och om
    upphävande av genomförandebeslut 2014/641/EU om harmoniserade tekniska villkor
    för radiospektrum som används av trådlös PMSE-ljudutrustning i unionen [delgiviet
    med nr C(2025) 192]
