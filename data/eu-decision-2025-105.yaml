    μικρής εμβέλειας και για την κατάργηση της
    εκτελεστικής απόφασης 2014/641/ΕΕ σχετικά με τους
    εναρμονισμένους τεχνικούς όρους χρήσης του
    ραδιοφάσματος από ασύρματο ακουστικό εξοπλισμό
    υπηρεσιών προγραμματισμού και ειδικών εκδηλώσεων
    στην Ένωση [κοινοποιηθείσα υπό τον αριθμό C(2025)
    192]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (ET) 2025/105, 22. jaanuar 2025, millega muudetakse
