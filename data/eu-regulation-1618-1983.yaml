  content: Commission Regulation (EEC) No 1618/83 of 15 June 1983 fixing, for the
    1983/84 marketing year, the minimum price to be paid to producers and the amount
    of production aid for certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1618/83 de la Commission du 15 juin 1983 fixant, pour
    la campagne 1983/1984, le prix minimal à payer aux producteurs ainsi que le montant
    de l' aide à la production pour certains produits transformés à base de fruits
    et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1618/83 der Kommission vom 15. Juni 1983 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe
    für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse für das Wirtschaftsjahr
    1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1618/83 af 15. juni 1983 om fastsættelse
    for produktionsåret 1983/84 af producentstøtten og den minimumspris, der skal
    betales til producenterne, for visse produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1618/83 της Επιτροπής
