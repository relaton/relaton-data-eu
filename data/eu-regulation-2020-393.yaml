    o compartimenti da cui determinati prodotti ottenuti dal pollame possono essere
    importati o transitare nell’Unione in relazione alla malattia di Newcastle
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/393 (2020. gada 11. marts), ar
