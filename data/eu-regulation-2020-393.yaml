    týkající se Ruska na seznamu třetích zemí, území, oblastí nebo jednotek,
    z nichž lze do Unie dovážet nebo přes její území přepravovat určité
    drůbeží komodity v souvislosti s newcastleskou chorobou
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/393 af 11. marts 2020
