title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/393 of 11 March 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Russia in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into or transit through the Union in relation
    to Newcastle disease
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/393 de la Commission du 11 mars 2020
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne les mentions
    relatives à la Russie sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l’Union ou transiter par celle-ci, pour ce qui est de la maladie de Newcastle
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/393 der Kommission vom 11. März 2020
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zu Russland in der Liste von Drittländern, Gebieten, Zonen und Kompartimenten,
    aus denen bestimmte Geflügelwaren in die Union eingeführt bzw. durch die Union
    durchgeführt werden dürfen, im Zusammenhang mit der Newcastle-Krankheit
  type: main
- language: bg
  script: Cyrl
