    с нюкасълска болест на приложение I към Регламент
    (ЕО) № 798/2008 по отношение на вписването за Русия
    в списъка на трети държави, територии, зони
    или компартменти, от които могат да бъдат внасяни
    или да преминават транзитно през територията
    на Съюза определени стоки, получени от домашни
    птици
  type: main
- language: cs
  script: Latn
