    II du règlement d’exécution (UE) 2021/403 en ce qui concerne les modèles
    de certificats pour l’entrée dans l’Union d’envois de certains produits
    destinés à la consommation humaine provenant de solipèdes domestiques et de
    certaines catégories d’équidés
  type: main
