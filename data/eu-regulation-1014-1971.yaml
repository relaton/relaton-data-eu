title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1014/71 de la Commission, du 17 mai 1971, fixant les
    montants compensatoires prévus par le règlement (CEE) n° 974/71 relatif à
    certaines mesures de politique de conjoncture à prendre dans le secteur agricole
    à la suite de l'élargissement temporaire des marges de fluctuation des monnaies
    de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1014/71 der Kommission vom 17. Mai 1971 zur Festsetzung
    der in der Verordnung (EWG) Nr. 974/71 über bestimmte konjunkturpolitische Maßnahmen,
    die in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der
    Bandbreiten der Währungen einiger Mitgliedstaaten zu treffen sind, vorgesehenen
    Ausgleichsbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1014/71 della Commissione, del 17 maggio 1971, che
    fissa gli importi compensativi previsti dal regolamento (CEE) n. 974/71 relativo
    a talune misure di politica congiunturale da adottare nel settore agricolo in
    seguito all'ampliamento temporaneo dei margini di fluttuazione delle monete di
    taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1014/71 van de Commissie van 17 mei 1971 houdende
    vaststelling van de compenserende bedragen bedoeld bij Verordening (EEG) nr. 974/71
    betreffende bepaalde conjunctuurpolitieke maatregelen welke naar aanleiding van
    de tijdelijke verruiming van de fluctuatiemarges van de valuta's van sommige Lid-
    Staten dienen te worden genomen in de landbouwsector
  type: main
