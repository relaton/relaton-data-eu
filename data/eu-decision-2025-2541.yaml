    álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2025) 8558. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/2541 della Commissione, del 16 dicembre
