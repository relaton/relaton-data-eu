    contenenti, costituiti o derivati da granturco geneticamente modificato MON 87427
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2025) 8558]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2025/2541 (2025. gada 16. decembris),
