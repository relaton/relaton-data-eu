title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/2541 of 16 December 2025 on
    renewing the authorisation for the placing on the market of products containing,
    consisting of or produced from genetically modified maize MON 87427 pursuant to
    Regulation (EC) No 1829/2003 of the European Parliament and of the Council (notified
    under document C(2025) 8558)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/2541 de la Commission du 16 décembre
    2025 renouvelant l’autorisation de mise sur le marché de produits contenant
    du maïs génétiquement modifié MON 87427, consistant en ce maïs ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2025) 8558]
  type: main
- language: de
  script: Latn
