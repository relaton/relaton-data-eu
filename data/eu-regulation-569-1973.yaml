title:
- language: en
  script: Latn
  content: Regulation (EEC) No 569/73 of the Council of 26 February 1973 temporarily
    suspending customs duties on certain fruits and vegetables originating in the
    Associated African and Malagasy States and in the overseas countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 569/73 du Conseil, du 26 février 1973, portant suspension
    temporaire des droits de douane applicables à certains fruits et légumes originaires
    des États africains et malgache associés ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 569/73 des Rates vom 26. Februar 1973 über die zeitweilige
    Aussetzung der auf bestimmte Obst- und Gemüsesorten mit Ursprung in den assoziierten
    afrikanischen Staaten und Madagaskar oder den überseeischen Ländern und Gebieten
    angewandten Zölle
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 569/73 af 26. februar 1973 om midlertidig
    suspension af de vor visse frugter og grønsager med oprindelse i de associerde
    afrikanske stater og Madagascar eller de oversøiske lande og territorier gældende
    toldafgifter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 569/73 del Consiglio, del 26 febbraio 1973, che sospende
    temporaneamente i dazi doganali applicabili a taluni ortofrutticoli originari
    degli Stati africani e malgascio associati o dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 569/73 van de Raad van 26 februari 1973 houdende
    tijdelijke schorsing van de douanerechten voor bepaalde soorten groenten en fruit
    van oorsprong uit de geassocieerde Afrikaanse staten en Madagaskar of de landen
    en gebieden overzee
