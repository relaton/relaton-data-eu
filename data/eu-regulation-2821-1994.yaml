title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2821/94 of 21 November 1994 re-establishing
    the levying of customs duties and ending the charges against tariff ceilings opened
    in 1994, on certain textile products originating in Indonesia, India, Thailand,
    Pakistan and South Korea, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2821/94 de la Commission du 21 novembre 1994 portant
    établissement de la perception des droits de douane et cessation des imputations
    applicables en 1994 à certains produits textiles originaires d'Indonésie, d'Inde,
    du Pakistan, de Thaïlande et de Corée du Sud, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2821/94 DER KOMMISSION vom 21. November 1994 über
    die Wiedereinführung des Zollsatzes und zur Einstellung von Anrechnungen für
    den Zeitraum 1994 für bestimmte Textilwaren mit Ursprung in Indonesien, Indien,
    Thailand, Pakistan und Südkorea, für die die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
