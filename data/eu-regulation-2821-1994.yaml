    åbnet i 1994 for visse tekstilvarer med oprindelse i Indonesien, Indien, Thailand,
    Pakistan og Sydkorea, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
