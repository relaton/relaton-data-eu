  script: Latn
  content: Commission Implementing Regulation (EU) 2015/392 of 9 March 2015 terminating
    a ‘new exporter’ review of Council Implementing Regulation (EU) No 1389/2011
    imposing a definitive anti-dumping duty on imports of trichloroisocyanuric acid
    originating in the People's Republic of China, re-imposing the duty with regard
    to imports from the exporter and terminating the registration of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/392 de la Commission du 9 mars 2015 clôturant
    le réexamen au titre de «nouvel exportateur» du règlement d'exécution (UE)
    n ° 1389/2011 du Conseil instituant un droit antidumping définitif sur les importations
    d'acide trichloro-isocyanurique originaire de la République populaire de Chine,
    réinstituant le droit à l'égard des importations provenant de l'exportateur
    concerné et mettant un terme à l'enregistrement de ces importations
  type: main
