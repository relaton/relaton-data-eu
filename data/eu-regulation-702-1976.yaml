    und Betriebsklasse auszuwählenden Buchführungsbetriebe sowie der Abgrenzung
    des Erfassungsbereichs
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 702/76 af 29. marts 1976 om ændring
    af forordning nr. 91/66/EØF af 29. juni 1966 for så vidt angår antallet af
    regnskabsførende bedrifter, der skal udvælges pr. område og pr. bedriftsklasse,
    samt afgrænsningen af undersøgelsesområdet
  type: main
- language: el
  script: Grek
