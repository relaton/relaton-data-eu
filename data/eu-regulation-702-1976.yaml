title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 702/76 of 29 March 1976 amending Regulation
    No 91/66/EEC of 29 June 1966 concerning the number of returning holdings to be
    selected in each division and each category of holding and the size of the field
    of survey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 702/76 de la Commission, du 29 mars 1976, modifiant
    le règlement (CEE) n° 91/66/CEE du 29 juin 1966 en ce qui concerne le nombre
    d' exploitations comptables à sélectionner par circonscription et par classe
    d' exploitation, ainsi que la délimitation du champ d' observation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 702/76 der Kommission vom 29. März 1976 zur Änderung
