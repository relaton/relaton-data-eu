title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 546/2001 of 20 March 2001 amending Regulation
    (EC) No 180/2001 derogating from the rules for the application of Council Regulation
    (EC) No 1251/1999 with regard to set-aside as a result of the adverse weather
    conditions in some Community regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 546/2001 de la Commission du 20 mars 2001 modifiant
    le règlement (CE) n° 180/2001 qui déroge aux modalités d'application du règlement
    (CE) n° 1251/1999 du Conseil en ce qui concerne le gel des terres suite à de
    mauvaises conditions climatiques dans certaines régions de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 546/2001 der Kommission vom 20. März 2001 zur Änderung
    der Verordnung (EG) Nr. 180/2001 zur Abweichung von den Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1251/1999 des Rates hinsichtlich der Flächenstilllegung
    infolge ungünstiger Witterungsbedingungen in bestimmten Regionen der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 546/2001 af 20. marts 2001 om ændring
    af forordning (EF) nr. 180/2001, der fraviger gennemførelsesbestemmelserne til
    Rådets forordning (EF) nr. 1251/1999 for så vidt angår jordudtagning som følge
    af ugunstige vejrforhold i visse områder i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 546/2001 της Επιτροπής,
    της 20ής Μαρτίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 180/2001 περί παρεκκλίσεως
    από τις λεπτομέρειες εφαρμογής του κανονισμού
    (ΕΚ) αριθ. 1251/1999 του Συμβουλίου όσον αφορά την
    παύση καλλιέργειας γαιών λόγω δυσμενών καιρικών
    συνθηκών σε ορισμένες περιοχές της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 546/2001, annettu 20 päivänä maaliskuuta 2001,
    neuvoston asetuksen (EY) N:o 1251/1999 soveltamista koskevista yksityiskohtaisista
    säännöistä poikkeamisesta joidenkin yhteisön alueiden huonoista ilmasto-olosuhteista
    johtuvan kesannoinnin osalta annetun asetuksen (EY) N:o 180/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 546/2001 della Commissione, del 20 marzo 2001, recante
    modifica del regolamento (CE) n. 180/2001 che deroga alle modalità d'applicazione
    del regolamento (CE) n. 1251/1999 del Consiglio per quanto concerne il ritiro
    di seminativi a seguito di avverse condizioni climatiche in alcune regioni della
    Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 546/2001 van de Commissie van 20 maart 2001 tot wĳziging
    van Verordening (EG) nr. 180/2001 waarbĳ, in verband met het slechte weer in
    bepaalde gebieden van de Gemeenschap, wordt afgeweken van de uitvoeringsbepalingen
    van Verordening (EG) nr. 1251/1999 van de Raad ten aanzien van de braaklegging
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 546/2001 da Comissão, de 20 de Março de 2001, que
    altera o Regulamento (CE) n.° 180/2001, que derroga as normas de execução do
    Regulamento (CE) n.° 1251/1999 do Conselho no que respeita à retirada de terras
    na sequência de más condições climatéricas em determinadas regiões da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 546/2001 de la Comisión, de 20 de marzo de 2001, que
    modifica el Reglamento (CE) n° 180/2001, por el que se prevé una excepción
    al Reglamento (CE) n° 1251/1999 del Consejo en lo que respecta a la retirada
    de tierras a raíz de las condiciones climáticas adversas en determinadas regiones
    de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 546/2001 av den 20 mars 2001 om ändring
