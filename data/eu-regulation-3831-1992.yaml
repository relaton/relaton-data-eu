title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3831/92 of 28 December 1992 amending Regulation
    (EEC) No 816/89 establishing the list of products subject to the supplementary
    trade mechanism in the fresh fruit and vegetables sector and determining the products
    which, in the case of deliveries to Spain, remain subject to that mechanism
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3831/92 de la Commission, du 28 décembre 1992, modifiant
    le règlement (CEE) n° 816/89 fixant la liste des produits soumis au mécanisme
    complémentaire applicable aux échanges dans le secteur des fruits et légumes
    et déterminant les produits qui, en ce qui concerne les livraisons en Espagne,
    restent soumis audit mécanisme
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3831/92 der Kommission vom 28. Dezember 1992 zur Änderung
    der Verordnung (EWG) Nr. 816/89 zur Erstellung der Liste der Erzeugnisse des Sektors
    Obst und Gemüse, frisch, die dem ergänzenden Handelsmechanismus unterliegen,
    und zur Bestimmung der Erzeugnisse, die im Handel mit Spanien weiterhin diesem
    Mechanismus unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3831/92 af 28. december 1992 om ændring
    af forordning (EØF) nr. 816/89 om fastsættelse af listen over de produkter,
    som den supplerende mekanisme for samhandelen finder anvendelse på inden for
    sektoren for friske frugter og grønsager, og om fastsættelse af de produkter,
    der med hensyn til leverancer til Spanien fortsat er omfattet af nævnte mekanisme
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3831/92 της Επιτροπής
    της 28ης Δεκεμβρίου 1992 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 816/89 περί καθορισμού του
    καταλόγου των προϊόντων που υπάγονται στο
    συμπληρωματικό μηχανισμό που εφαρμόζεται
    στις συναλλαγές στον τομέα των νωπών οπωροκηπευτικών
    και των προϊόντων τα οποία, όσον αφορά τις παραδόσεις
    στις Ισπανία, υπάγονται στον εν λόγω μηχανισμό
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3831/92, annettu 28 päivänä joulukuuta 1992,
    tuoreiden hedelmien ja vihannesten täydentävän kaupan järjestelmän alaisten
    tuotteiden luettelosta annetun asetuksen (ETY) N:o 816/89 muuttamisesta ja kyseisen
    järjestelmän alaisista tuotteista Espanjaan tapahtuvien toimitusten osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3831/92 della Commissione, del 28 dicembre 1992, recante
    modifica del regolamento (CEE) n. 816/89 che fissa l'elenco dei prodotti sottoposti
    al meccanismo complementare applicabile agli scambi nel settore degli ortofrutticoli,
    nonché determinazione dei prodotti che restano soggetti a tale meccanismo per
    quanto riguarda le forniture alla Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3831/92 van de Commissie van 28 december 1992 tot
    wijziging van Verordening (EEG) nr. 816/89 houdende vaststelling van de lijst
    van produkten van de sector verse groenten en fruit waarvoor de aanvullende regeling
    voor het handelsverkeer van toepassing is, en tot vaststelling, wat de leveringen
    aan Spanje betreft, van de produkten waarvoor deze regeling blijft gelden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3831/92 da Comissão, de 28 de Dezembro de 1992,
    que altera o Regulamento (CEE) nº 816/89 que fixa a lista dos produtos sujeitos
    ao mecanismo complementar aplicável às trocas comerciais no sector das frutas
    e produtos hortícolas e que determina os produtos que, no que diz respeito aos
    fornecimentos a Espanha, continuam submetidos ao citado mecanismo
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3831/92 de la Comisión, de 28 de diciembre de 1992,
    que modifica el Reglamento (CEE) n° 816/89 por el que se establece la lista de
    productos sometidos al mecanismo complementario aplicable a los intercambios en
    el sector de las frutas y hortalizas frescas y por el que se determinan los productos
    que continúan sometidos a dicho mecanismo, en lo referente a las entregas a España
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3831/92 av den 28 december 1992 om ändring
    av förordning (EEG) nr 816/89 om upprättandet av förteckningen över de produkter
    inom sektorn för färsk frukt och grönsaker som omfattas av den kompletterande
    handelsmekanismen och om fastställande av de produkter som vid leveranser till
    Spanien förblir föremål för nämnda mekanism
  type: main
