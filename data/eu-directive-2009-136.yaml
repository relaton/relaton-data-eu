title:
- language: en
  script: Latn
  content: Directive 2009/136/EC of the European Parliament and of the Council of
    25 November 2009 amending Directive 2002/22/EC on universal service and users’
    rights relating to electronic communications networks and services, Directive
    2002/58/EC concerning the processing of personal data and the protection of privacy
    in the electronic communications sector and Regulation (EC) No 2006/2004 on cooperation
    between national authorities responsible for the enforcement of consumer protection
    laws
  type: main
- language: fr
  script: Latn
  content: Directive 2009/136/CE du Parlement européen et du Conseil du 25 novembre
    2009 modifiant la directive 2002/22/CE concernant le service universel et les
    droits des utilisateurs au regard des réseaux et services de communications électroniques,
    la directive 2002/58/CE concernant le traitement des données à caractère personnel
    et la protection de la vie privée dans le secteur des communications électroniques
    et le règlement (CE) n o 2006/2004 relatif à la coopération entre les autorités
    nationales chargées de veiller à l’application de la législation en matière
    de protection des consommateurs
  type: main
- language: de
  script: Latn
