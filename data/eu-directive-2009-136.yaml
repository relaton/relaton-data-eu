    attiecībā uz elektronisko sakaru tīkliem un pakalpojumiem, Direktīvu 2002/58/EK
    par personas datu apstrādi un privātās dzīves aizsardzību elektronisko komunikāciju
    nozarē un Regulu (EK) Nr. 2006/2004 par sadarbību starp valstu iestādēm, kas
    atbildīgas par tiesību aktu īstenošanu patērētāju tiesību aizsardzības
    jomā
  type: main
