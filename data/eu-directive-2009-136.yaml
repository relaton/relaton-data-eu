    2009 recante modifica della direttiva 2002/22/CE relativa al servizio universale
    e ai diritti degli utenti in materia di reti e di servizi di comunicazione elettronica,
    della direttiva 2002/58/CE relativa al trattamento dei dati personali e alla tutela
    della vita privata nel settore delle comunicazioni elettroniche e del regolamento
    (CE) n. 2006/2004 sulla cooperazione tra le autorità nazionali responsabili dell’esecuzione
    della normativa a tutela dei consumatori
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2009/136/EK ( 2009. gada 25. novembris),
