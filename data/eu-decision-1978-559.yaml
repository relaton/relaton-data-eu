title:
- language: en
  script: Latn
  content: '78/559/EEC: Commission Decision of 12 June 1978 settling the dispute between
    the Federal Republic of Germany on the one side and Belgium and the Netherlands
    on the other over the level of the compulsory tariffs for the carriage of goods
    by road between those Member States (Only the French, German and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/559/CEE: Décision de la Commission, du 12 juin 1978, réglant le différend
    entre la République fédérale d''Allemagne, d''une part, et la Belgique et les
    Pays-Bas, d''autre part, au sujet de la fixation du niveau des tarifs obligatoires
    applicables aux transports de marchandises par route entre les États membres
    en cause (Les textes en langues française, allemande et néerlandaise sont les
    seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '78/559/EWG: Entscheidung der Kommission vom 12. Juni 1978 zur Regelung
    des Streitfalls zwischen der Bundesrepublik Deutschland einerseits sowie Belgien
    und den Niederlanden andererseits über die Festsetzung des Niveaus der obligatorischen
    Tarife im Gúterkraftverkehr zwischen diesen Mitgliedstaaten (Nur der französische,
    deutsche und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/559/EØF: Kommissionens beslutning af 12. juni 1978 om bilæggelse
    af tvisten mellem Forbundsrepublikken Tyskland på den ene side og Belgien og
    Nederlandene på den anden side vedrørende fastsættelse af niveauet for de obligatoriske
    tariffer for godstransport ad landevej mellem de pågældende medlemsstater (Kun
    den franske, tyske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '78/559/CEE: Decisione della Commissione, del 12 giugno 1978, che compone
    la vertenza tra, da un lato, la Repubblica federale di Germania e, dall''altro,
    il Belgio e i Paesi Bassi, relativa alla fissazione del livello delle tariffe
    obbligatorie applicabili ai trasporti di merci su strada tra questi Stati membri
    (I testi in lingua francese, tedesca e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '78/559/EEG: Beschikking van de Commissie van 12 juni 1978 tot regeling
    van het geschil tussen de Bondsrepubliek Duitsland enerzijds en België en Nederland
    anderzijds over de vaststelling van het niveau van de verplichte tarieven voor
    het goederenvervoer over de weg tussen de betrokken Lid-Staten (Slechts de teksten
    in de Franse, Duitse en de Nederlandse taal zijn authentiek)'
