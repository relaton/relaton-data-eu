- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 126/98 of 16 January 1998 laying down to
    what extent applications for issue of export licences submitted during January
    1998 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 126/98 DE LA COMMISSION du 16 janvier 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de janvier 1998 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 126/98 DER KOMMISSION vom 16. Januar 1998 über das
    Ausmaß, in dem den im Januar 1998 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 126/98 af 16. januar 1998 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    januar 1998 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 126/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Ιανουαρίου 1998 για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Ιανουάριο 1998 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 126/98, annettu 16 päivänä tammikuuta 1998,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden tammikuussa
    1998 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 126/98 DELLA COMMISSIONE del 16 gennaio 1998 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di gennaio 1998 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in un paese terzo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 126/98 VAN DE COMMISSIE van 16 januari 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in januari 1998 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 126/98 DA COMISSÃO de 16 de Janeiro de 1998 que determina
