title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1197 of 11 July 2022 amending
    Annexes V and XIV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Canada, the United Kingdom and the United States in the lists of third countries
    authorised for the entry into the Union of consignments of poultry, germinal products
    of poultry and fresh meat of poultry and game birds and correcting Annex XIV as
    regards an entry for the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1197 de la Commission du 11 juillet
    2022 modifiant les annexes V et XIV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives au Canada, aux États-Unis et au Royaume-Uni
    dans les listes des pays tiers en provenance desquels l’entrée dans l’Union
    d’envois de volailles et de produits germinaux de volailles ainsi que de viandes
    fraîches de volailles et de gibier à plumes est autorisée et rectifiant l’annexe
    XIV en ce qui concerne une mention pour le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1197 der Kommission vom 11. Juli 2022
    zur Änderung der Anhänge V und XIV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Kanada, das Vereinigte Königreich und die Vereinigten
    Staaten in den Listen der Drittländer, aus denen der Eingang in die Union von
    Sendungen von Geflügel, Zuchtmaterial von Geflügel sowie frischem Fleisch von
    Geflügel und Federwild zulässig ist und zur Berichtigung des Anhangs XIV hinsichtlich
    eines Eintrags für das Vereinigte Königreich
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1197 на Комисията
    от 11 юли 2022 година за изменение на приложения
    V и XIV към Регламент за изпълнение (ЕС) 2021/404 по
    отношение на вписванията за Канада, Обединеното
    кралство и Съединените щати в списъците на
    трети държави, от които е разрешено въвеждането
    в Съюза на пратки с домашни птици, зародишни
    продукти от домашни птици и прясно месо от
    домашни птици и пернат дивеч, и за изменение
    на приложение XIV по отношение на вписването
    за Обединеното кралство
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1197 ze dne 11. července 2022,
    kterým se mění přílohy V a XIV prováděcího nařízení (EU) 2021/404,
    pokud jde o položky pro Kanadu, Spojené království a Spojené státy americké
    v seznamech třetích zemí, z nichž je povolen vstup zásilek drůbeže, zárodečných
    produktů drůbeže a čerstvého masa drůbeže a pernaté zvěře do Unie, a
    kterým se opravuje příloha XIV, pokud jde o položku pro Spojené království
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1197 af 11. juli 2022
    om ændring af bilag V og XIV til gennemførelsesforordning (EU) 2021/404 for
    så vidt angår oplysningerne om Canada, Det Forenede Kongerige og USA i listerne
    over tredjelande, hvorfra det er tilladt at indføre sendinger af fjerkræ, avlsmateriale
    af fjerkræ og fersk kød af fjerkræ og fjervildt til Unionen og om berigtigelse
    af bilag XIV for så vidt angår oplysningerne om Det Forenede Kongerige
  type: main
