    kodulindude ja uluklindude värske liha saadetisi, ning parandatakse XIV lisa
    seoses Ühendkuningriiki käsitleva kandega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1197, annettu 11 päivänä
    heinäkuuta 2022, täytäntöönpanoasetuksen (EU) 2021/404 liitteiden V ja XIV
    muuttamisesta siltä osin kuin on kyse Kanadaa, Yhdistynyttä kuningaskuntaa ja
    Yhdysvaltoja koskevista kohdista niiden kolmansien maiden luetteloissa, joista
    siipikarjan, siipikarjan sukusolujen ja alkioiden sekä siipikarjasta ja riistalinnuista
    saatavan tuoreen lihan lähetysten saapuminen unioniin on sallittua, sekä liitteen
    XIV oikaisemisesta Yhdistynyttä kuningaskuntaa koskevan kohdan osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1197 ón gCoimisiún an 11 Iúil
    2022 lena leasaítear Iarscríbhinní V agus XIV a ghabhann le Rialachán Cur
    Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na hiontrálacha a bhaineann
    le Ceanada, an Ríocht Aontaithe agus na Stáit Aontaithe ar liostaí na dtríú
    tíortha atá údaraithe maidir le coinsíneachtaí d’éanlaith clóis, de tháirgí
    geirmeacha ó éanlaith chlóis, agus d’fheoil úr ó éanlaith chlóis agus
    ó éin ghéim a theacht isteach san Aontas agus leasaítear Iarscríbhinn XIV
    a mhéid a bhaineann leis an iontráil a bhaineann leis an Ríocht Aontaithe
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1197 оd 11. srpnja 2022. o izmjeni
    priloga V. i XIV. Provedbenoj uredbi (EU) 2021/404 u pogledu unosa za Kanadu,
    Ujedinjenu Kraljevinu i Sjedinjene Američke Države na popisima trećih zemalja
    iz kojih je odobren ulazak u Uniju pošiljaka peradi, zametnih proizvoda peradi
    te svježeg mesa peradi i pernate divljači i ispravku Priloga XIV. u pogledu
    unosa za Ujedinjenu Kraljevinu
  type: main
