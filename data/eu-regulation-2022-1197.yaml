    baromfi-szaporítóanyagokat, valamint baromfi és szárnyas vadak friss húsát
    tartalmazó szállítmányok Unióba történő beléptetésére engedéllyel
    rendelkező harmadik országok jegyzékében a Kanadára, az Egyesült Királyságra
    és az Egyesült Államokra vonatkozóan szereplő bejegyzések tekintetében
    történő módosításáról, valamint XIV. mellékletének egy, az Egyesült
    Királyságra vonatkozó bejegyzés tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1197 della Commissione dell'11 luglio
    2022 che modifica gli allegati V e XIV del regolamento di esecuzione (UE) 2021/404
    per quanto riguarda le voci relative al Canada, al Regno Unito e agli Stati Uniti
    negli elenchi di paesi terzi da cui è autorizzato l'ingresso nell'Unione di partite
    di pollame, materiale germinale di pollame e carni fresche di pollame e selvaggina
    da penna e che rettifica l'allegato XIV per quanto riguarda una voce relativa
    al Regno Unito
  type: main
- language: lv
