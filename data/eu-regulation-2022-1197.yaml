  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1197 de la Comisión de 11 de julio
    de 2022 por el que se modifican los anexos V y XIV del Reglamento de Ejecución
    (UE) 2021/404 en lo que concierne a las entradas correspondientes a Canadá, al
    Reino Unido y a los Estados Unidos en las listas de terceros países desde los
    que se autoriza la entrada en la Unión de partidas de aves de corral, productos
    reproductivos de aves de corral y carne fresca de aves de corral y de aves de
    caza y por el que se corrige el anexo XIV en lo que concierne a una entrada correspondiente
    al Reino Unido
  type: main
