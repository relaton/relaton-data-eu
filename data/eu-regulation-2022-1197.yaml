  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1197 av den 11 juli 2022
    om ändring av bilagorna V och XIV till genomförandeförordning (EU) 2021/404
    vad gäller posterna för Kanada, Förenade kungariket och Förenta staterna i
    förteckningarna över tredjeländer från vilka sändningar av fjäderfä, avelsmaterial
    från fjäderfä samt färskt kött från fjäderfä och fjädervilt får föras
    in till unionen och om rättelse av bilaga XIV vad gäller en post för Förenade
    kungariket
