    prilog V in XIV k Izvedbeni uredbi (EU) 2021/404 glede vnosov za Kanado, Združeno
    kraljestvo in Združene države Amerike na seznamih tretjih držav, iz katerih
    je dovoljen vstop pošiljk perutnine, zarodnega materiala perutnine ter svežega
    mesa perutnine in pernate divjadi v Unijo ter o popravku Priloge XIV glede vnosa
    za Združeno kraljestvo
  type: main
