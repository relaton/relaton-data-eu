    ide o zápisy týkajúce sa Kanady, Spojeného kráľovstva a Spojených štátov
    amerických v zoznamoch tretích krajín, z ktorých sa povoľuje vstup zásielok
    hydiny, zárodočných produktov hydiny a čerstvého mäsa z hydiny a pernatej
    zveri do Únie, a ktorým sa opravuje príloha XIV, pokiaľ ide o zápis týkajúci
    sa Spojeného kráľovstva
  type: main
