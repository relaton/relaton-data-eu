    (UE) 2021/404 în ceea ce privește rubricile referitoare la Canada, Regatul Unit
    și Statele Unite din listele conținând țările terțe autorizate pentru introducerea
    în Uniune a transporturilor de păsări de curte, de materiale germinative provenite
    de la păsări de curte și de carne proaspătă provenită de la păsări de
    curte și de la vânat cu pene și de rectificare a anexei XIV în ceea ce privește
    o rubrică referitoare la Regatul Unit
  type: main
