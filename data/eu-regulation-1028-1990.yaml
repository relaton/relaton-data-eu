title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1028/90 of 25 April 1990 introducing a corrective
    amount on the import of aubergines into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1028/90 de la Commission, du 25 avril 1990, instituant
    un montant correcteur à percevoir lors de l'importation dans la Communauté à
    Dix de aubergines en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1028/90 der Kommission vom 25. April 1990 zur Einführung
    eines bei der Einfuhr von Auberginen aus Spanien (mit Ausnahme der Kanarischen
    Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1028/90 af 25. april 1990 om indførelse
    af korrektionsbeløb, der skal opkræves ved indførsel til De Ti af auberginer
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1028/90 της Επιτροπής
    της 25ης Απριλίου 1990 για καθιέρωση διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, μελιτζανών από την
    Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1028/90 della Commissione, del 25 aprile 1990, che
    istituisce un importo correttore da riscuotere all'importazione nella Comunità
    dei dieci di melanzane in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1028/90 van de Commissie van 25 april 1990 houdende
    instelling van een correctiebedrag bij invoer in de Gemeenschap van de Tien van
    aubergines van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1028/90 da Comissão, de 25 de Abril de 1990, que
    institui um montante corrector a cobrar aquando da importação na Comunidade
    a Dez de beringelas provenientes de Espanha (com excepção das ilhas Canárias)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1028/90 de la Comisión, de 25 de abril de 1990, por
    el que se establece el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de berenjenas procedentes de España (excepto las
    Islas Canarias)
  type: main
