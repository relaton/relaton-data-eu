title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1095/77 of 25 May 1977 re-establishing the
    levying of the customs duties on building board of wood pulp or of vegetable fibre,
    etc., falling within heading No 48.09, originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1095/77 de la Commission, du 25 mai 1977 , portant
    rétablissement de la perception des droits de douane applicables aux plaques
    pour construction, en pâte à papier, en bois défibrés ou en végétaux divers
    défibrés, etc. , de la position tarifaire 48.09, originaires du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1095/77 der Kommission vom 25. Mai 1977 zur Wiedereinführung
    des Zollsatzes für Bauplatten aus Papierhalbstoff, aus Fasern von Holz oder von
    anderen pflanzlichen Stoffen, usw., der Tarifnummer 48.09, mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1095/77 af 25. maj 1977 om genindførelse
    af opkrævning af toldafgifter for byggeplader af papirmasse, træfibre eller
    andre vegetabilske fibre, etc., under position 48.09, som har oprindelse i Brasilien,
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1095/77 della Commissione, del 25 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle lastre per costruzioni,
    di pasta di carta, di legno sfibrato o di vegetali diversi sfibrati, ecc., della
    voce doganale 48.09, originarie del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1095/77 van de Commissie van 25 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op platen voor
    constructiedoeleinden, van papierstof, van houtvezels of van andere plantaardige
    vezels, enz., van post 48.09, van oorsprong uit Brazilië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
