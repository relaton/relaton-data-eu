title:
- language: en
  script: Latn
  content: '1999/635/EC: Commission Decision of 13 September 1999 refusing to grant
    the Turks and Caicos Islands a derogation concerning the definition of the concept
    of ''originating products'' with regard to rice of CN code 1006 30 (notified under
    document number C(1999) 2899)'
  type: main
- language: fr
  script: Latn
  content: '1999/635/CE: Décision de la Commission, du 13 septembre 1999, portant
    refus d''accorder aux îles Turks et Caicos une dérogation à la définition
    de la notion de produits originaires en ce qui concerne le riz relevant du code
    NC 1006 30 [notifiée sous le numéro C(1999) 2899]'
  type: main
