  content: Règlement (CEE) n° 2289/72 de la Commission, du 27 octobre 1972, fixant
    les taux des restitutions applicables, à compter du 1er novembre 1972, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2289/72 der Kommission vom 27. Oktober 1972 zur Festsetzung
    der ab 1. November 1972 geltenden Erstattungssätze bei der Ausfuhr von bestimmten
    Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2289/72 della Commissione, del 27 ottobre 1972, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 novembre 1972,
    a taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2289/72 van de Commissie van 27 oktober 1972 houdende
    vaststelling van de restituties welke vanaf 1 november 1972 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het Verdrag vermelde goederen
