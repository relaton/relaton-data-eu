title:
- language: en
  script: Latn
  content: '2006/586/EC: Commission Decision of 25 August 2006 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of chromafenozide, halosulfuron, tembotrione, valiphenal
    and Zucchini yellow mosaic virus — weak strain in Annex I to Council Directive
    91/414/EEC (notified under document number C(2006) 3820)'
  type: main
- language: fr
  script: Latn
  content: '2006/586/CE: Decision de la Commission du 25 août 2006 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle du chromafénozide, de l’halosulfuron, du tembotrione,
    du valiphénal et du virus de la mosaïque jaune de la courgette (souche bénigne)
    à l''annexe I de la directive 91/414/CEE du Conseil [notifiée sous le numéro
    C(2006) 3820]'
  type: main
- language: de
  script: Latn
  content: '2006/586/EG: Entscheidung der Kommission vom 25. August 2006 zur grundsätzlichen
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von Chromafenozid, Halosulfuron, Tembotrion,
    Valiphenal und Zucchinigelbmosaikvirus (abgeschwächter Stamm) in Anhang I der
    Richtlinie 91/414/EWG des Rates eingereicht wurden (Bekannt gegeben unter Aktenzeichen
    K(2006) 3820)'
  type: main
- language: bg
