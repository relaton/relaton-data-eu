title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 avril 1967, portant prorogation de la
    décision du 14 avril 1965 autorisant la République italienne à exclure du traitement
    communautaire les piles électriques de la position 85.03 du Tarif douanier commun,
    originaires du Japon et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/299/EWG: Entscheidung der Kommission vom 27. April 1967 zur Verlängerung
    der Entscheidung vom 14. April 1965, mit der die Italienische Republik ermächtigt
    wurde, Primärelemente und Primärbatterien (Tarifnr. 85.03 des Gemeinsamen Zolltarifs)
    japanischen Ursprungs, die sich in den anderen Mitgliedstaaten im freien Verkehr
    befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/299/CEE: Decisione della Commissione, del 27 aprile 1967, relativa
    alla proroga della decisione del 14 aprile 1965 che autorizza la Repubblica italiana
    ad escludere dal trattamento comunitario le pile elettriche della voce 85.03 della
    tariffa doganale comune, originarie del Giappone e messe in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/299/EEG: Beschikking van de Commissie van 27 april 1967 houdende verlenging
    van de beschikking van 14 april 1965 waarbij de Italiaanse Republiek is gemachtigd
    elektrische elementen en elektrische batterijen, van post 85.03 van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit Japan en in de andere Lid-Staten in het
    vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
