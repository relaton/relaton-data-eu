- language: en
  script: Latn
  content: Council Regulation (EC) No 913/2009 of 24 September 2009 terminating the
    new exporter review of Regulation (EC) No 1174/2005 imposing a definitive anti-dumping
    duty and collecting definitively the provisional duty imposed on imports of hand
    pallet trucks and their essential parts originating in the People’s Republic
    of China, re-imposing the duty with regard to imports from one exporter in this
    country and terminating the registration of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 913/2009 du Conseil du 24 septembre 2009 clôturant
    le réexamen au titre de nouvel exportateur du règlement (CE) n o 1174/2005 instituant
    un droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de transpalettes à main et de leurs parties essentielles
    originaires de la République populaire de Chine, réinstituant le droit en ce
    qui concerne les produits d’un exportateur de ce pays et mettant un terme à
    l’enregistrement de ces importations
  type: main
- language: de
  script: Latn
