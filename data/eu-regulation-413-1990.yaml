title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 413/90 of 16 February 1990 introducing a
    corrective amount on the import of artichokes into the Community of Ten from Spain
    (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 413/90 de la Commission, du 16 février 1990, instituant
    un montant correcteur à percevoir lors de l'importation dans la Communauté à
    Dix d'artichauts en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 413/90 der Kommission vom 16. Februar 1990 zur Einführung
    eines bei der Einfuhr von Artischocken aus Spanien (mit Ausnahme der Kanarischen
    Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 413/90 af 16. februar 1990 om indførelse
    af korrektionsbeløb, der skal opkræves ved indførsel til De Ti af artiskokker
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 413/90 της Επιτροπής
    της 16ης Φεβρουαρίου 1990 για καθιέρωση διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, αγκινάρων από την
    Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 413/90 della Commissione, del 16 febbraio 1990, che
    istituisce un importo correttore da riscuotere all'importazione nella Comunità
    dei dieci di carciofi in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 413/90 van de Commissie van 16 februari 1990 houdende
    instelling van een correctiebedrag bij invoer in de Gemeenschap van Tien van artisjokken
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 413/90 da Comissão, de 16 de Fevereiro de 1990,
    que institui um montante corrector a cobrar aquando da importação na Comunidade
    a Dez de alcachofras provenientes de Espanha (com excepção das ilhas Canárias)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 413/90 de la Comisión, de 16 de febrero de 1990,
    por el que se establece el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de alcachofas procedentes de España (excepto las
    Islas Canarias)
  type: main
