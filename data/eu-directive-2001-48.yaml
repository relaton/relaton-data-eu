    pesticidov v in na žitih in ter v in na nekaterih proizvodih rastlinskega izvora,
    vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2001/48/CE de la Comisión, de 28 de junio de 2001, por la que
