    koncentracijų atitinkamai grūduose ir kai kuriuose augalinės kilmės produktuose,
    įskaitant vaisius ir daržoves, ir ant jų priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2001/48/KE tat-28 ta’ Ġunju 2001 li temenda
