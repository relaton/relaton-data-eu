title:
- language: en
  script: Latn
  content: Commission Directive 2001/48/EC of 28 June 2001 amending the Annexes to
    Council Directives 86/362/EEC and 90/642/EEC on the fixing of maximum levels for
    pesticide residues in and on cereals and certain products of plant origin, including
    fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2001/48/CE de la Commission du 28 juin 2001 modifiant les annexes
    des directives 86/362/CEE et 90/642/CEE du Conseil concernant la fixation de teneurs
    maximales pour les résidus de pesticides respectivement sur et dans les céréales
    et certains produits d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/48/EG der Kommission vom 28. Juni 2001 zur Änderung der
    Anhänge der Richtlinien 86/362/EWG und 90/642/EWG des Rates über die Festsetzung
    von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln auf und
    in Getreide und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich
    Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/48/ЕО на Комисията от 28 юни
    2001 година за изменение на приложенията към
    Директиви 86/362/ЕИО и 90/642/ЕЕО на Съвета относно
    определянето на максимални количества на остатъци
    от пестициди, съответно във и върху зърнените
    култури и някои продукти от растителен произход,
    включително плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2001/48/ES ze dne 28. června 2001, kterou se mění přílohy
    směrnic Rady 86/362/EHS a 90/642/EHS o stanovení maximálních limitů reziduí
    pesticidů v obilovinách a v některých produktech rostlinného původu, včetně
    ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2001/48/EF af 28. juni 2001 om ændring af bilagene
    til Rådets direktiv 86/362/EØF og 90/642/EØF om fastsættelse af maksimalgrænseværdier
    for indholdet af pesticidrester i og på korn og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
