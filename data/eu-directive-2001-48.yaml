  script: Latn
  content: Richtlĳn 2001/48/EG van de Commissie van 28 juni 2001 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG en 90/642/EEG van de Raad tot vaststelling
    van maximumgehalten aan residuen van bestrĳdingsmiddelen in en op granen, respectievelĳk
    in en op bepaalde producten van plantaardige oorsprong, met inbegrip van groenten
    en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2001/48/WE z dnia 28 czerwca 2001 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG oraz 90/642/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów, odpowiednio w zbożach i w niektórych produktach
    pochodzenia roślinnego, w tym owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/48/CE da Comissão, de 28 de Junho de 2001, que altera os
    anexos das Directivas 86/362/CEE e 90/642/CEE relativas à fixação de limites
    máximos de resíduos de pesticidas à superfície e no interior dos cereais e
    de determinados produtos de origem vegetal, incluindo frutas e produtos hortícolas,
    respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/48/CE a Comisiei din 28 iunie 2001 de modificare a anexelor
    la Directivele 86/362/CEE și 90/642/CEE ale Consiliului privind stabilirea conținuturilor
    maxime de reziduuri de pesticide din și de pe cereale și unele produse de origine
    vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2001/48/ES z 28. júna 2001, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 86/362/EHS a 90/642/EHS o stanovovaní maximálnych
    hladín zvyškov pesticídov v a na obilninách a určitých produktoch rastlinného
    pôvodu, vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2001/48/ES z dne 28. junija 2001 o spremembi prilog
