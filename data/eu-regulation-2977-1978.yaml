type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2977/78 of 15 December 1978 re-establishing
    the levying of customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, not optically worked or of optical glass, falling
    within subheading 70.14 B and originating Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2977/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, de signalisation et d' optique commune, de la sous-position tarifaire
    70.14 B, originaire de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2977/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, nicht aus optischem Glas, der Tarifstelle 70.14 B, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2977/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, refleksglas, optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, under underposition
    70.14 B, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2977/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, della sottovoce doganale 70.14 B, originarie
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2977/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas ; optische elementen van gewoon glas,
    niet optisch bewerkt, van onderverdeling 70.14 B, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
