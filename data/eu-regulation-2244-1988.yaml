  content: Council Regulation (EEC) No 2244/88 of 19 July 1988 amending, with regard
    to Moscatel dried grapes, Regulation (EEC) No 989/84 introducing a system of guarantee
    thresholds for certain processed fruit and vegetable products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2244/88 du Conseil du 19 juillet 1988 modifiant, en
    ce qui concerne les raisins secs Moscatel, le règlement (CEE) n° 989/84 instaurant
    un système de seuils de garantie pour certains produits transformés à base
    de fruits et légumes
