  script: Latn
  content: VERORDNUNG (EG) Nr. 72/97 DER KOMMISSION vom 17. Januar 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Januar 1997
    für die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen und der Republik Ungarn geschlossenen Europa-Abkommen sowie
    dem mit der Tschechischen Republik und der Slowakischen Republik beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 72/97 af 17. januar 1997 om fastsættelse
