title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1015/82 of 30 April 1982 fixing the rates
    of the refunds applicable from 1 May 1982 to eggs and egg yolks exported in the
    form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1015/82 de la Commission, du 30 avril 1982, fixant les
    taux des restitutions applicables, à compter du 1er mai 1982, aux oeufs et aux
    jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1015/82 der Kommission vom 30. April 1982 zur Festsetzung
    der ab 1. Mai 1982 geltenden Erstattungssätze bei der Ausfuhr von Eiern und Eigelb
    in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1015/82 af 30. april 1982 om fastsættelse
    af de restitutionssatser, der fra den 1. maj 1982 skal anvendes for æg og æggeblommer,
    der udføres i form af varer, som ikke omfattes af traktatens bilag II
  type: main
- language: el
  script: Grek
