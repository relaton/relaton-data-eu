title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1692/76 of 13 July 1976 re-establishing
    the levying of customs duties on thread of asbestos, falling within subheading
    68.13 B I, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1692/76 de la Commission, du 13 juillet 1976, portant
    rétablissement de la perception des droits de douane applicables aux fils en
    amiante, de la sous-position tarifaire 68.13 B I, originaires de la Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1692/76 der Kommission vom 13. Juli 1976 zur Wiedereinführung
    des Zollsatzes für Fäden aus Asbest der Tarifstelle 68.13 B I mit Ursprung in
    Jugoslawien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November
    1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1692/76 af 13. juli 1976 om genindførsel
    af opkrævning af toldafgifter for garn af asbest, under underposition 68.13 B
    I, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1692/76 della Commissione, del 13 luglio 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai fili di amianto, della
    sottovoce doganale 68.13 B I, originari della Iugoslavia, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre
    1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1692/76 van de Commissie van 13 juli 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    asbest, van onderverdeling 68.13 B I, van oorsprong uit Joegoslavië, ten behoeve
    waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene
    tariefpreferenties werden geopend
  type: main
