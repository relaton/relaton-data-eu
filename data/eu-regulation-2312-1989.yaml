title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2312/89 of 28 July 1989 specifying the extent
    to which applications lodged in July 1989 for import licences in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2312/89 de la Commission, du 28 juillet 1989, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juillet 1989 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2312/89 der Kommission vom 28. Juli 1989 über das
    Ausmaß, in dem den im Juli 1989 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2312/89 af 28. juli 1989 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i juli
    1989 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2312/89 της Επιτροπής
    της 28ης Ιουλίου 1989 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Ιούλιο του 1989, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2312/89 della Commissione, del 28 luglio 1989, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di luglio 1989 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2312/89 van de Commissie van 28 juli 1989 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juli 1989 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2312/89 da Comissão, de 28 de Julho de 1989, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apesentados no mês de Julho de 1989 para os bovinos machos jovens
    destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2312/89 de la Comisión, de 28 de julio de 1989, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de julio de 1989 respecto a
    los jóvenes bovinos machos destinados al engorde
  type: main
