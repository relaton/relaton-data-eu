    του προσωρινού δασμού
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 706/84 del Consiglio del 16 marzo 1984 che impone
    un dazio compensativo definitivo nell' ambito della procedura antisovvenzione
    relativa alle importazioni di accessori per tubi di ghisa malleabile originari
    della Spagna e che prevede la riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 706/84 van de Raad van 16 maart 1984 houdende instelling
