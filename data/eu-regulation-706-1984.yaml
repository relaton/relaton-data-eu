    concernant les importations d' accessoires de tuyauterie en fonte malléable originaires
    d' Espagne et portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 706/84 des Rates vom 16. März 1984 zur Erhebung eines
    endgültigen Ausgleichszolls im Rahmen des Antisubventionsverfahrens betreffend
    die Einfuhren von Rohrformstücken, Rohrverschlußstücken und Rohrverbindungsstücken
    aus Temperguß mit Ursprung in Spanien und zur endgültigen Vereinnahmung des
    vorläufigen Ausgleichszolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 706/84 af 16. marts 1984 om indførelse af
    en endelig udligningstold i forbindelse med antisubsidieproceduren vedrørende
    importen af rørfittings af støbejern, blødstøbte (aducerede varer), med oprindelse
    i Spanien og om endelig opkrævning af den midlertidige udligningstold
  type: main
- language: el
  script: Grek
