  content: Council Regulation (EEC) No 706/84 of 16 March 1984 imposing a definitive
    countervailing duty in the framework of the anti-subsidy proceedings concerning
    imports of tube and pipe fittings of malleable cast iron originating in Spain
    and proposing the definitive collection of the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 706/84 du Conseil du 16 mars 1984 portant imposition
