    betreffende de invoer van hulpstukken (fittings) voor buisleidingen van smeedbaar
    gietijzer, van oorsprong uit Spanje, en houdende definitieve inning van het voorlopig
    recht
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 706/84 del Consejo de 16 de marzo de 1984 por el que
    se impone un derecho compensatorio definitivo en el marco del procedimiento antisubvenciones
