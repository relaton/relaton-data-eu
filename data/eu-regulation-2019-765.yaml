    des États-Unis d'Amérique et clôturant la procédure concernant ces importations
    à la suite d'un réexamen au titre de l'expiration des mesures effectué conformément
    à l'article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil
  type: main
