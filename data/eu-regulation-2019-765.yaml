title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/765 of 14 May 2019 repealing
    the anti-dumping duty on imports of bioethanol originating in the United States
    of America and terminating the proceedings in respect of such imports, following
    an expiry review pursuant to Article 11(2) of the Regulation (EU) 2016/1036 of
    the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
