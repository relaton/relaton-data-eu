  script: Latn
  content: '80/989/EEC: Decision of the European Parliament of 19 September 1980 on
    the discharge to be granted to the Management Board of the European Centre for
    the Development of Vocational Training in respect of the implementation of its
    appropriations for the financial years 1975, 1976, 1977 and 1978 and on the reports
    of the Audit Board and of the Court of Auditors'
  type: main
- language: fr
  script: Latn
  content: '80/989/CEE: Décision du Parlement européen, du 19 septembre 1980, sur
    la décharge à donner au conseil d''administration du Centre européen pour le
    développement de la formation professionnelle pour l''exécution de son budget
    pour les exercices 1975, 1976, 1977 et 1978, ainsi que sur les rapports de la
    commission de contrôle et de la Cour des comptes'
  type: main
- language: de
  script: Latn
