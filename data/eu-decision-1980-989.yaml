    Berufsbildung zu erteilende Entlastung zur Ausfuehrung seiner Einnahmen- und Ausgabenplaene
    fuer die Haushaltsjahre 1975, 1976, 1977 und 1978 und ueber die Berichte des Kontrollausschusses
    und des Rechnungshofs'
  type: main
- language: da
  script: Latn
