  content: Commission Regulation (EEC) No 645/86 of 28 February 1986 fixing the initial
    quotas for 1986 which may be applied to trade in certain products in the wine
    sector between Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 645/86 de la Commission du 28 février 1986 fixant
    les contingents initiaux pour l' année 1986 pouvant être appliqués, pour certains
    produits du secteur viti-vinicole, dans les échanges entre l' Espagne et le Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 645/86 der Kommission vom 28. Februar 1986 zur Festsetzung
    der Anfangskontingente 1986 für bestimmte Erzeugnisse des Weinsektors im Handel
    zwischen Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 645/86 af 28. februar 1986 om fastsættelse
    af de første kontingenter for 1986, som kan anvendes for visse vinprodukter i
    samhandelen mellem Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 645/86 της Επιτροπής
