    prodotti del settore vitivinicolo, negli scambi tra la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 645/86 van de Commissie van 28 februari 1986 tot
    vaststelling van het oorspronkelijk contingent voor 1986 dat in het handelsverkeer
    tussen Spanje en Portugal op bepaalde produkten van de wijnbouwsector kan worden
    toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 645/86 da Comissão de 28 de Fevereiro de 1986 que
