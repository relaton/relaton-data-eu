    ποσοστώσεις για το έτος 1986 που μπορούν να εφαρμοσθούν,
    για ορισμένα προϊόντα του αμπελοοινικού τομέα,
    στις συναλλαγές μεταξύ της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 645/86 della Commissione del 28 febbraio 1986 che
