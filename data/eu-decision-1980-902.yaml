id: EUDecision1980902
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/902/EEC: Commission Decision of 7 August 1980 authorizing Ireland not
    to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, other than those of category 10, falling within subheading
    60.02 B of the Common Customs Tariff (category 11), originating in the Philippines
    and in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/902/CEE: Décision de la Commission, du 7 août 1980, autorisant l''Irlande
    à exclure du traitement communautaire la ganterie de bonneterie non élastique
    ni caoutchoutée, autre que celle de la catégorie 10, de la sous-position 60.02
    B du tarif douanier commun (catégorie 11), originaire des Philippines et mise
    en libre pratique dans les autres Etats membres (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/902/EWG: Entscheidung der Kommission vom 7. August 1980, mit der Irland
    ermächtigt wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, andere als Waren der Kategorie 10, der Tarifstelle 60.02 B des
    Gemeinsamen Zolltarifs (Kategorie 11) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/902/EØF: Kommissionens beslutning af 7. august 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage handsker, vanter og luffer,
    ikke elastisk, bortset fra varer i kategori 10, som henhører under pos. 60.02
    B i den fælles toldtarif (kategori 11), har oprindelse på Filippinerne og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/902/CEE: Decisione della Commissione, del 7 agosto 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i guanti a maglia non elastica
    né gommata, diversi da quelli della categoria 10, della sottovoce 60.02 B della
    tariffa doganale comune, categoria 11, originari delle Filippine e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/902/EEG: Beschikking van de Commissie van 7 augustus 1980 waarbij Ierland
    wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch of van
    niet- gegummeerd brei- of haakwerk, andere dan die van categorie 10, van post
    60.02 B van het gemeenschappelijk douanetarief (categorie 11), van oorsprong uit
    de Filippijnen en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
