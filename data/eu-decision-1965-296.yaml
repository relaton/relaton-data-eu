title:
- language: fr
  script: Latn
  content: Décision 65/296/CEE de la Commission, du 20 mai 1965, relative aux recours
    du Royaume de Belgique, du Grand-Duché de Luxembourg et du Royaume des Pays-Bas
    à l'article 115 alinéa 1 du Traité, pour exclure du traitement communautaire
    certains produits originaires du Japon et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '65/296/EWG: Entscheidung der Kommission vom 20. Mai 1965 über den Antrag
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande gemäß Artikel 115 Absatz (1) des Vertrages, um bestimmte, aus Japan
    stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Waren
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/296/CEE: Decisione della Commissione, del 20 maggio 1965, relativa
    ai ricorsi del Regno del Belgio, del Granducato del Lussemburgo e del Regno dei
    Paesi Bassi all''articolo 115, primo comma, del Trattato, per escludere dal trattamento
    comunitario alcuni prodotti originari del Giappone e immessi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/296/EEG: Beschikking van de Commissie van 20 mei 1965 betreffende het
    verzoek van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk
    der Nederlanden om op grond van artikel 115, eerste alinea, van het Verdrag sommige
    produkten, die van oorsprong zijn uit Japan en in de andere Lid-Staten in het
    vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
