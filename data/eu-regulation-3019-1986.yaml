    της 30ής Σεπτεμβρίου 1986 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές των τυποποιημένων
    πολυφασικών ηλεκτρικών κινητήρων ισχύος μεγαλύτερης
    από 0,75 kW αλλά όχι μεγαλύτερης από 75 kW, καταγωγής
    Βουλγαρίας, Ουγγαρίας, Πολωνίας, Λαϊκής Δημοκρατίας
    της Γερμανίας, Ρουμανίας, Τσεχοσλοβακίας και
    Σοβιετικής Ένωσης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3019/86 della Commissione del 30 settembre 1986 che
    istituisce un dazio antidumping provvisorio sulle importazioni di motori elettrici
    polifase normalizzati di potenza superiore a 0,75 Kw ed inferiore o pari a 75
    Kw, originari della Bulgaria, Ungheria, Polonia, Repubblica democratica tedesca,
    Romania, Cecoslovacchia e Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3019/86 van de Commissie van 30 september 1986 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van gestandaardiseerde
    meerfasige elektromotoren met een vermogen van meer dan 0,75 kW tot en met 75
    kW, van oorsprong uit Bulgarije, de Duitse Democratische Republiek, Hongarije,
    Polen, Roemenië, Tsjechoslowakije en de Sovjetunie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3019/86 da Comissão de 30 de Setembro de 1986 que
