title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3019/86 of 30 September 1986 imposing a
    provisional anti-dumping duty on imports of standardized multi-phase electric
    motors having an output of more than 0,75 kW but not more than 75 kW, originating
    in Bulgaria, Czechoslovakia, the German Democratic Republic, Hungary, Poland,
    Romania and the USSR
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3019/86 de la Commission du 30 septembre 1986 instituant
    un droit antidumping provisoire à l' égard des importations de moteurs électriques
    polyphasés normalisés d' une puissance de plus de 0,75 à 75 kilowatts inclus,
    originaires de Bulgarie, de Hongrie, de Pologne, de la République démocratique
    allemande, de Roumanie, de Tchécoslovaquie et d' Union soviétique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/86 der Kommission vom 30. September 1986 zur
    Einführung eines vorläufigen Antidumpingzolls auf Einfuhren von standardisierten
    Mehrphasen-Wechselstrommotoren mit einer Leistung von mehr als 0,75 bis 75 kW
    mit Ursprung in Bulgarien, Ungarn, Polen, der Deutschen Demokratischen Republik,
    Rumänien, der Tschechoslowakei und der Sowjetunion
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3019/86 af 30. september 1986 om indførelse
    af en midlertidig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Bulgarien,
    Den tyske demokratiske Republik, Polen, Rumænien, Sovjetunionen, Tjekkoslovakiet
    og Ungarn
  type: main
- language: el
  script: Grek
