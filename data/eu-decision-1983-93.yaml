  content: '83/93/EEC: Commission Decision of 1 March 1983 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of ferro-silicon
    originating in Iceland, Norway, Sweden, Venezuela and Yugoslavia and terminating
    that proceeding'
  type: main
- language: fr
  script: Latn
  content: '83/93/CEE: Décision de la Commission du 1er mars 1983 portant acceptation
    des engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les importations de ferrosilicium originaires d'' Islande, de Norvège, de Suède,
    du Venezuela et de Yougoslavie, et portant clôture de la procédure'
  type: main
