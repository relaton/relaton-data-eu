  script: Latn
  content: '83/93/EWG: Beschluß der Kommission vom 1. März 1983 zur Annahme von
    Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend bestimmte Ferrosiliciumeinfuhren
    mit Ursprung in Island, Norwegen, Schweden, Venezuela und Jugoslawien und über
    die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '83/93/EØF: Kommissionens afgørelse af 1. marts 1983 om godtagelse af
