    hinsichtlich der Aujeszky-Krankheit für Schweine, die für seuchenfreie Regionen
    in Frankreich bestimmt sind'
  type: main
- language: da
  script: Latn
  content: '93/341/EØF: Kommissionens beslutning af 13. maj 1993 om ændring af beslutning
