  content: Commission Regulation (EC) No 2634/94 of 27 October 1994 re-establishing
    the levying of customs duties on certain textile products originating in Philippines,
    Brazil, Pakistan, Indonesia and China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
