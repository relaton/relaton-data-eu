title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2255/82 of 12 August 1982 determining, for
    the 1982/83 marketing year, the components for protection of the processing industry
    in the cereals and rice sector in trade between Greece and the other Member States
    of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2255/82 de la Commission, du 12 août 1982, déterminant,
    pour la campagne de commercialisation 1982/1983, les éléments destinés à assurer
    la protection de l' industrie de transformation des céréales et du riz dans
    les échanges entre la Grèce et les autres États membres de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2255/82 der Kommission vom 12. August 1982 zur Festsetzung
    der Bestandteile zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    beim Handel zwischen Griechenland und den anderen Mitgliedstaaten der Gemeinschaft
    für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2255/82 af 12. august 1982 om fastsættelse
    for produktionsåret 1982/83 af de elementer, der skal beskytte forarbejdningsindustrien
    for korn og ris i samhandelen mellem Grækenland og Fællesskabets øvrige medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2255/82 τής Επιτροπής
    τής 12ης Αυγούστου 1982 περί καθορισμού γιά τήν
    περίοδο εμπορίας 1982/83 τών στοιχείων τά οποία
    προορίζονται νά εξασφαλίσουν τήν προστασία
    τής μεταποιητικής βιομηχανίας σιτηρών καί
    όρυζας στίς συναλλαγές μεταξύ τής Ελλάδος
    καί τών Κρατών μελών τής Κοινότητος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2255/82 della Commissione, del 12 agosto 1982, che
    stabilisce, per la campagna di commercializzazione 1982/1983, gli elementi destinati
    ad assicurare, nel settore dei cereali e del riso, la protezione dell' industria
    di trasformazione negli scambi tra la Grecia e gli altri Stati membri della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2255/82 van de Commissie van 12 augustus 1982 tot
