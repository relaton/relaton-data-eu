    packaging and labelling of dangerous substances in order to adapt it to Regulation
    (EC) No 1907/2006 concerning the Registration, Evaluation, Authorisation and Restriction
    of Chemicals (REACH) and establishing a European Chemicals Agency
  type: main
- language: fr
  script: Latn
