title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 618/92 of 11 March 1992 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of boneless beef held by certain
    intervention agencies and intended for export to certain destinations and amending
    Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 618/92 de la Commission du 11 mars 1992 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines désossées détenues par certains organismes d'intervention
    et destinées à être exportées vers certaines destinations et modifiant le
    règlement (CEE) n 569/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 618/92 DER KOMMISSION vom 11. März 1992 über den
    Verkauf von Interventionsrindfleisch ohne Knochen zur Ausfuhr nach gewissen Bestimmungsländern
    nach der Verordnung (EWG) Nr. 2539/84 und zur Änderung der Verordnung (EWG) Nr.
    569/88 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 618/92 af 11. marts 1992 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af udbenet oksekød fra visse interventionsorganer
    med henblik på eksport til visse bestemmelsessteder og om ændring af forordning
    (EØF) nr. 569/88 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 618/92 της Επιτροπής
