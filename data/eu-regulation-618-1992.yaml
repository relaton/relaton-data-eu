    της διαδικασίας που καθορίζεται στον κανονισμό
    ( ΕΟΚ ) αριθ. 2539/84, αποστεωμένου βοείου κρέατος
    που κατέχεται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται να εξαχθεί προς ορισμένους
    προορισμούς και για την τροποποίηση του κανονισμού
    ( ΕΟΚ ) αριθ. 569/88
  type: main
- language: it
  script: Latn
