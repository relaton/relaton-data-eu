    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine disossate da taluni organismi d'' intervento e destinate all''
    esportazione verso talune destinazioni e che modifica il regolamento (CEE) n.
    569/88 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 618/92 VAN DE COMMISSIE van 11 maart 1992 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer naar bepaalde
