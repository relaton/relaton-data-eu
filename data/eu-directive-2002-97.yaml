title:
- language: en
  script: Latn
  content: Commission Directive 2002/97/EC of 16 December 2002 amending the Annexes
    to Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC as regards the fixing
    of maximum levels for pesticide residues (2,4-D, triasulfuron and thifensulfuron
    methyl) in and on cereals, foodstuffs of animal origin and certain products of
    plant origin, including fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Directive 2002/97/CE de la Commission du 16 décembre 2002 modifiant les
    annexes des directives 86/362/CEE, 86/363/CEE, et 90/642/CEE du Conseil concernant
    la fixation de teneurs maximales pour les résidus de pesticides (2,4-D, triasulfuron
    et thifensulfuron méthyle) respectivement sur et dans les céréales, denrées
    alimentaires d'origine animale et certains produits d'origine végétale, y compris
    les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2002/97/EG der Kommission vom 16. Dezember 2002 zur Änderung
    der Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates hinsichtlich
    der Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    (2,4-D, Triasulfuron und Thifensulfuron-methyl) auf und in Getreide, Lebensmitteln
    tierischen Ursprungs und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich
    Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2002/97/ЕО на Комисията от 16 декември
    2002 година за изменение на приложенията към
    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определянето на максималните количества
    на остатъци от пестициди (2,4-D, триасулфурон
    и тифенсулфурон метил) във и върху зърнени
    култури, храни от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2002/97/ES ze dne 16. prosince 2002, kterou se mění
    přílohy směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálních
    limitů reziduí pesticidů (2,4-D, triasulfuronu a thifensulfuron-methylu) v
    obilovinách, v potravinách živočišného původu a v určitých produktech
    rostlinného původu, včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2002/97/EF af 16. december 2002 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester (2,4-D, triasulfuron
    og thifensulfuronmethyl) i og på korn, levnedsmidler af animalsk oprindelse og
    visse produkter af vegetabilsk oprindelse, herunder frugt og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2002/97/ΕΚ της Επιτροπής, της 16ης Δεκεμβρίου
    2002, για τροποποίηση των παραρτημάτων των οδηγιών
    86/362/ΕΟΚ, 86/363/ΕΟΚ και 90/642/ΕΟΚ του Συμβουλίου
    όσον αφορά τον καθορισμό των ανωτάτων ορίων
    για τα υπολείμματα φυτοφαρμάκων (2,4-D, triasulfuron
    και thifensulfuron methyl) πάνω και μέσα στα σιτηρά, στα
    τρόφιμα ζωικής προέλευσης και σε ορισμένα
    προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2002/97/EÜ, 16. detsember 2002, millega muudetakse
    lisasid nõukogu direktiivides 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ teraviljas,
    loomses toidus ja teatavates taimsetes toiduainetes, sealhulgas puu- ja köögiviljas
    sisalduvate ja nende pinnal esinevate pestitsiidide (2,4-D, triasulfuroon ja tifensulfuroonmetüül)
    jääkide piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2002/97/EY, annettu 16 päivänä joulukuuta 2002,
    neuvoston direktiivien 86/362/ETY, 86/363/ETY ja 90/642/ETY liitteiden muuttamisesta
    viljoissa ja niiden pinnassa, eläinperäisissä elintarvikkeissa sekä tietyissä
    kasvikunnasta peräisin olevissa tuotteissa, mukaan luettuina hedelmät ja vihannekset,
    ja niiden pinnassa olevien torjunta-ainejäämien (2,4-D, triasulfuroni ja tifensulfuronimetyyli)
    enimmäismäärien vahvistamisen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2002/97/EK irányelve (2002. december 16.) a 86/362/EGK, 86/363/EGK
    és a 90/642/EGK tanácsi irányelv mellékletének a gabonafélékben, állati
    eredetű élelmiszerekben és egyes növényi eredetű termékekben – többek
    között a gyümölcsökben és zöldségekben –, illetve azok felületén található
    peszticid-szermaradványok (2,4-D, triaszulfuron és tifenszulfuron-metil) megengedett
    legmagasabb mértékének meghatározása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2002/97/CE della Commissione, del 16 dicembre 2002, recante modifica
    degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    che fissano le quantità massime di residui di antiparassitari (2,4-D, triasulfuron
    e tifensulfuron metile) rispettivamente sui e nei cereali, sui e nei prodotti
    alimentari di origine animale e su e in alcuni prodotti di origine vegetale, compresi
    gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2002/97/EK (2002. gada 16. decembris), ar ko groza
    pielikumus Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK attiecībā
    uz pesticīdu (2,4-D, triasulfurona un tifensulfurona metila) atlieku maksimāli
    pieļaujamo daudzumu noteikšanu labībā un uz tās, dzīvnieku izcelsmes pārtikas
    produktos un uz tiem un dažos augu izcelsmes produktos, to skaitā augļos un
    dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2002 m. gruodžio 16 d. Komisijos direktyva 2002/97/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių pesticidų
    likučių (2,4-D, triasulfurono ir metiltifensulfurono) koncentracijų atitinkamai
    grūduose, gyvūninės kilmės maisto produktuose ir kai kuriuose augalinės kilmės
    produktuose, įskaitant vaisius ir daržoves, ir ant jų priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2002/97/KE tas-16 ta’ Diċembru 2002 li
    temenda l-Annessi għad-Direttivi tal-Kunsill 86/362/KEE, 86/363/KEE u 90/642/KEE
    dwar l-iffissar ta’ livelli massimi ta’ residwi tal-pestiċidi (2,4-D, triasulfuron
    u thifensulfuron methyl) fuq u fiċ-ċereali, oġġetti ta’ l-ikel li joriġinaw
    mill-annimali u ċerti prodotti li joriġinaw mill-pjanti, inkluż frott u ħaxix
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2002/97/EG van de Commissie van 16 december 2002 houdende wĳziging
    van de bĳlagen bĳ de Richtlĳnen 86/362/EEG, 86/363/EEG en 90/642/EEG van de
    Raad tot vaststelling van maximumgehalten aan residuen van bestrĳdingsmiddelen
    (2,4-D, triasulfuron en thifensulfuron-methyl) in en op respectievelĳk granen,
    levensmiddelen van dierlĳke oorsprong en bepaalde producten van plantaardige
    oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji nr 2002/97/WE z dnia 16 grudnia 2002 r. zmieniająca
    załączniki do dyrektyw Rady 86/362/EWG, 86/363/EWG i 90/642/EWG w zakresie ustalania
    najwyższych dopuszczalnych poziomów pozostałości pestycydów (2,4-D, triasulfuronu
    i thifensulfuronu metylowego) w zbożach, środkach spożywczych pochodzenia zwierzęcego
    i niektórych produktach pochodzenia roślinnego, w tym owocach i warzywach oraz
    na ich powierzchniach
  type: main
- language: pt
  script: Latn
  content: Directiva 2002/97/CE da Comissão, de 16 de Dezembro de 2002, que altera
    os anexos das Directivas 86/362/CEE, 86/363/CEE e 90/642/CEE no respeitante à
    fixação de teores máximos de resíduos dos pesticidas 2,4-D, triassulfurão
    e tifensulfurão-metilo à superfície e no interior dos cereais, de géneros
    alimentícios de origem animal e de determinados produtos de origem vegetal, incluindo
    frutas e produtos hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 2002/97/CE a Comisiei din 16 decembrie 2002 de modificare a anexelor
    la Directivele 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului privind stabilirea
    conținuturilor maxime pentru reziduurile de pesticide (2,4-D, triasulfuron și
    metil tifensulfuron) de pe și din cereale, produse alimentare de origine animală
    și anumite produse de origine vegetală, inclusiv fructe și legume
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2002/97/ES zo 16. decembra 2002, ktorou sa menia a dopĺňajú
    prílohy smernice Rady 86/363/EHS a 90/642/EHS o stanovených maximálnych hladinách
    rezíduí pesticídov (2,4-D, triasulfuron a thifensulfuron-metyl) v a na obilninách,
    potravinách živočíšneho pôvodu a určitých výrobkoch rastlinného pôvodu,
    vrátane ovocia a zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2002/97/ES z dne 16. decembra 2002 o spremembi prilog
    k direktivam Sveta 86/362/EGS, 86/363/EGS in 90/642/EGS o določanju najvišjih
    mejnih vrednosti ostankov pesticidov (2,4-D, triasulfuron in tifensulfuron-metil)
    v in na žitih, živilskih izdelkih živalskega izvora in nekaterih izdelkih rastlinskega
    izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2002/97/CE de la Comisión, de 16 de diciembre de 2002, por la
    que se modifican los anexos de las Directivas 86/362/CEE, 86/363/CEE y 90/642/CEE
    del Consejo, relativas a la fijación de los contenidos máximos de residuos de
    plaguicidas (2,4-D, triasulfurón y tifensulfurón metilo) sobre y en los cereales,
    los productos alimenticios de origen animal y determinados productos de origen
    vegetal, incluidas las frutas y hortalizas
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2002/97/EG av den 16 december 2002 om ändring av
    bilagorna till rådets direktiv 86/362/EEG, 86/363/EEG och 90/642/EEG beträffande
    fastställande av gränsvärden för bekämpningsmedelsrester (2,4-D, triasulfuron
    och tifensulfuronmetyl) i och på spannmål, livsmedel av animaliskt ursprung
    och vissa produkter av vegetabiliskt ursprung, inklusive frukt och grönsaker
