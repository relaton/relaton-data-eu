title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 776/94 of 29 March 1994 repealing Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the treaty, and the criteria for fixing the amount of such refunds and amending
    Regulation (EEC) No 876/68 laying down general rules for granting export refunds
    on milk and milk products and criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 776/94 du Conseil du 29 mars 1994 abrogeant le règlement
    (CEE) n° 3035/80 établissant, pour certains produits agricoles exportés sous
    forme de marchandises ne relevant pas de l'annexe II du traité, les règles générales
    relatives à l'octroi des restitutions à l'exportation et les critères de fixation
    de leur montant, et modifiant le règlement (CEE) n° 876/68 établissant, dans
    le secteur du lait et des produits laitiers, les règles générales relatives
    à l'octroi des restitutions à l'exportation et aux critères de fixation de
    leur montant
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 776/94 DES RATES vom 29. März 1994 zur Aufhebung der
    Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln für die Gewährung
    von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden, und zur Änderung der Verordnung
    (EWG) Nr. 876/68 über die Grundregeln für die Gewährung von Erstattungen bei
    der Ausfuhr von Milch und Milcherzeugnissen und die Kriterien für die Festsetzung
    der Erstattung
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 776/94 af 29. marts 1994 om ophævelse af forordning
    (EØf) nr. 3035/80 om fastsættelse af almindelige regler for ydelse af eksportrestitutioner
    og om fastlæggelse af kriterierne for fastsættelse af restitutionsbeløbet for
    visse landbrugsprodukter, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II, og om ændring af forordning (EØF) nr. 876/68 om fastsættelse af de
    almindelige regler for ydelse af eksportrestitutioner for mælk og mejeriprodukter
    og om kriterierne for fastsættelse af restitutionsbeløbet
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 776/94 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 29ης Μαρτίου 1994 για την κατάργηση του κανονισμού
    (ΕΟΚ) αριθ. 3035/80 περί καθορισμού των γενικών
    κανόνων που αφορούν τη χορήγηση επιστροφών
    κατά την εξαγωγή και των κριτηρίων καθορισμού
    του ύψους αυτών, για ορισμένα γεωργικά προϊόντα
    εξαγόμενα υπό μορφή εμπορευμάτων μη υπαγομένων
    στο παράρτημα II της συνθήκης, και για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 876/68 περί καθορισμού,
    στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, των γενικών κανόνων για τη χορήγηση
    επιστροφών κατά την εφαρμογή και τα κριτήρια
    καθορισμού του ύψους τους
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 776/94, annettu 29 päivänä maaliskuuta 1994,
    tiettyjen perustamissopimuksen liitteeseen II kuulumattomina tavaroina vietävien
    maataloustuotteiden vientituen myöntämistä ja sen määrän vahvistamisperusteita
    koskevista yleisistä säännöistä annetun asetuksen (ETY) N:o 3035/80 kumoamisesta
    ja maito- ja maitotuotealan vientitukien myöntämistä koskevista yleisistä
    säännöistä sekä niiden suuruuden vahvistamisperusteista annetun asetuksen
    (ETY) N:o 876/68 muuttamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 776/94 DEL CONSIGLIO del 29 marzo 1994 che abroga il
    regolamento (CEE) n. 3035/80 che stabilisce, per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell' allegato II del trattato, le regole generali
    relative alla concessione delle restituzioni all' esportazione e i criteri per
    stabilire il rolo importo e che modifica il regolamento (CEE) n. 876/68 che stabilisce,
    nel settore del latte e dei prodotti lattiero-caseari, le norme generali relative
    alla concessione delle restituzioni all' esportazione e ai criteri per la fissazione
    del loro ammontare
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 776/94 VAN DE RAAD van 29 maart 1994 tot intrekking
    van Verordening (EEG) nr. 3035/80 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen en tot wijziging
    van Verordening (EEG) nr. 876/68 tot vaststelling van de algemene voorschriften
    betreffende de toekenning van de restituties bij de uitvoer en de criteria voor
    de vaststelling van het bedrag van de restitutie in de sector melk en zuivelprodukten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 776/94 DO CONSELHO de 29 de Março de 1994 que revoga
    o Regulamento (CEE) nº 3035/80, que estabelece, para certos produtos agrícolas
    exportados sob a forma de mercadorias não abrangidas pelo anexo II do Tratado,
    as regras gerais relativas à concessão das restituições à exportação e
    os critérios de fixação do seu montante e que altera o Regulamento (CEE) nº
    876/68, que estabelece no sector do leite e dos produtos lácteos as regras gerais
    relativas à concessão de restituições à exportação e aos critérios de
    fixação do seu montante
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 776/94 DEL CONSEJO de 29 de marzo de 1994 por el que
    se deroga el Reglamento (CEE) nº 3035/80 por el que se establecen, para determinados
    productos agrícolas exportados en forma de mercancías no incluidas en el Anexo
    II del Tratado, las normas generales relativas a la concesión de las restituciones
    a la exportación y los criterios para la fijación de su importe, y se modifica
    el Reglamento (CEE) nº 876/68 por el que se establece, en el sector de la leche
    y los productos lácteos, las normas generales relativas a la concesión de las
    restituciones a la exportación y los criterios para la fijación de su importe
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 776/94 av den 29 mars 1994 om upphävande av
    förordning (EEG) nr 3035/80 om allmänna bestämmelser för beviljande av exportbidrag
    för vissa jordbruksprodukter som exporteras i form av varor som inte omfattas
    av bilaga 2 till fördraget och kriterier för fastställande av bidragsbeloppen
    och om ändring av förordning (EEG) nr 876/68 om allmänna bestämmelser för
    beviljande av exportbidrag för mjölk och mjölkprodukter och kriterier för
    fastställande av bidragsbeloppen
