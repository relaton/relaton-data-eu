  script: Latn
  content: Rådets beslut (EU) 2025/1884 av den 15 december 2025 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i EPA-rådet, i kommittén för
    högre tjänstemän och i den rådgivande EPA-kommittén, vilka inrättats genom
    det ekonomiska partnerskapsavtalet mellan Europeiska unionen, å ena sidan, och
    Republiken Kenya, medlem i Östafrikanska gemenskapen, å andra sidan, vad gäller
    rekommendationen av kommittén för högre tjänstemän till EPA-rådet om deltagande
    i den rådgivande EPA-kommittén, beslutet av EPA-rådet om deltagande i den rådgivande
    EPA-kommittén, beslutet av kommittén för högre tjänstemän om dess godkännande
    av den rådgivande EPA-kommitténs antagande av sin arbetsordning samt beslutet
    av den rådgivande EPA-kommittén om antagande av dess arbetsordning
