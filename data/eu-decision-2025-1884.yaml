    del AAE, en el Comité de Altos Funcionarios y en el Comité Consultivo del AAE,
    creados por el Acuerdo de Asociación Económica entre la Unión Europea, por
    una parte, y la República de Kenia, miembro de la Comunidad del África Oriental,
    por otra, con respecto a la Recomendación del Comité de Altos Funcionarios al
    Consejo del AAE sobre la participación en el Comité Consultivo del AAE, a la
    Decisión del Consejo del AAE sobre la participación en el Comité Consultivo
    del AAE, a la Decisión del Comité de Altos Funcionarios sobre su acuerdo con
    la adopción por el Comité Consultivo del AAE de su reglamento interno y a la
    Decisión del Comité Consultivo del AAE sobre la adopción de su reglamento interno
  type: main
