title:
- language: en
  script: Latn
  content: '80/897/EEC: Commission Decision of 28 July 1980 authorizing the French
    Republic not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste), falling within heading No 56.07 A of the Common Customs
    Tariff (category 3), originating in Taiwan and in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/897/CEE: Décision de la Commission, du 28 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les tissus de
    fibres textiles synthétiques discontinues de la sous-position 56.07 A du tarif
    douanier commun (catégorie 3), originaires de T''ai-wan et mis en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/897/EWG: Entscheidung der Kommission vom 28. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern
    der Tarifstelle 56.07 A des Gemeinsamen Zolltarifs (Kategorie 3) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/897/EØF: Kommissionens beslutning af 28. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre, syntetiske eller regenererede, som henhører under pos. 56.07
    A i den fælles toldtarif (kategori 3), har oprindelse i Taiwan og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/897/CEE: Decisione della Commissione, del 28 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche in fiocco, della sottovoce 56.07 A della tariffa doganale comune,
    categoria 3, originari di Taiwan e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/897/EEG: Beschikking van de Commissie van 28 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd weefsels van synthetische stapelvezels van post 56.07
    A (categorie 3) van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
