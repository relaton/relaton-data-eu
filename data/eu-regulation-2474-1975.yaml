title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2474/75 of the Commission of 29 September 1975 fixing
    the amounts by which the import charges on beef and veal originating in the African,
    Caribbean and Pacific States or in the overseas countries and territories are
    to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2474/75 de la Commission, du 29 septembre 1975, fixant
    les montants de diminution des charges à l'importation de viandes bovines originaires
    des États d'Afrique, des Caraïbes et du Pacifique ou des pays et territoires
    d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2474/75 der Kommission vom 29. September 1975 zur
    Festsetzung der Beträge zur Senkung der Einfuhrabgaben bei Rindfleisch aus den
    Staaten in Afrika, im Karibischen Raum und im Pazifischen Ozean oder in den Überseeischen
    Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2474/75 af 29. september 1975 om fastsættelse
    af de beløb, med hvilke importbelastningerne for oksekød med oprindelse i staterne
    i Afrika, Vestindien og Stillehavet eller i de oversøiske territotier nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2474/75 della Commissione, del 29 settembre 1975,
    che fissa gli importi di cui sono ridotti gli oneri applicabili all'importazione
    di carni bovine originarie degli Stati africani, dei Caraibi e del Pacifico o
    dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2474/75 van de Commissie van 29 september 1975 houdende
    vaststelling van de bedragen welke in mindering worden gebracht op de belastingen
    bij invoer van rundvlees van oorsprong uit de landen in Afrika, het Caribisch
    Gebied en de Stille Oceaan of uit de landen en gebieden overzee
  type: main
