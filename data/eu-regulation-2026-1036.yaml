    iz Bacillus velezensis CECT 5940 kot krmni dodatek za pitovne purane, purane za
    razplod, manj pomembne vrste perutnine za pitanje in za razplod ter okrasne ptice
    (razen za razmnoževanje)'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2026/1036 de la Comisión, de 7 de mayo
    de 2026, relativo a la autorización de un preparado de Bacillus velezensis CECT
    5940 como aditivo para piensos destinado a aves de corral para puesta (titular
    de la autorización: Evonik Operations GmbH), por el que se modifica el Reglamento
    de Ejecución (UE) 2020/1395 en lo que respecta a los términos de la autorización
    de un preparado de Bacillus velezensis CECT 5940 como aditivo para piensos destinado
    a pollos de engorde y criados para puesta, y por el que se modifica el Reglamento
    de Ejecución (UE) 2021/2050 en lo que respecta a los términos de la autorización
    de un preparado de Bacillus velezensis CECT 5940 como aditivo para piensos destinado
    a pavos de engorde, pavos criados para reproducción, especies menores de aves
    de corral de engorde y criadas para reproducción y aves ornamentales (excepto
    para reproducción)'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2026/1036 av den 7 maj 2026
    om godkännande av ett preparat av Bacillus velezensis CECT 5940 som fodertillsats
    för fjäderfän avsedda för värpning (innehavare av godkännandet: Evonik Operations
    GmbH), om ändring av genomförandeförordning (EU) 2020/1395 vad gäller villkoren
    för godkännande av ett preparat av Bacillus velezensis CECT 5940 som fodertillsats
    för slaktkycklingar och för kycklingar som föds upp till värphöns och om
    ändring av genomförandeförordning (EU) 2021/2050 vad gäller villkoren för
    godkännande av ett preparat av Bacillus velezensis CECT 5940 som fodertillsats
    för slaktkalkoner, kalkoner som föds upp för avel, mindre vanligt förekommande
    fjäderfäarter avsedda för slakt och som föds upp för avel samt burfåglar
    (utom för reproduktion)'
  type: main
