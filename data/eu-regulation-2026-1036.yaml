  content: 'Commission Implementing Regulation (EU) 2026/1036 of 7 May 2026 concerning
    the authorisation of a preparation of Bacillus velezensis CECT 5940 as a feed
    additive for poultry for laying (holder of authorisation: Evonik Operations GmbH),
    amending Implementing Regulation (EU) 2020/1395 as regards the terms of the authorisation
