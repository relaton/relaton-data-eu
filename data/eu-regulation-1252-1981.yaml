    intervention allemand et destiné à l' exportation vers la Pologne, et modifiant
    les règlements (CEE) n° 2044/75 et (CEE) n° 1687/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1252/81 der Kommission vom 11. Mai 1981 über den
    Sonderverkauf von Magermilchpulver aus Beständen der deutschen Interventionsstelle
