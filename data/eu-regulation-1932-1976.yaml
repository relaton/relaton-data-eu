title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1932/76 of 20 July 1976 determining for the
    1976/77 wine-growing year the prices to be paid under the compulsory distillation
    of the by-products of wine-making and the maximum amount of the contribution from
    the Guarantee Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1932/76 du Conseil, du 20 juillet 1976, déterminant,
    pour la campagne viticole 1976/1977, les prix à payer au titre de la distillation
    obligatoire des sous-produits de la vinification et le montant maximal de la participation
    du Fonds européen d'orientation et de garantie agricole, section garantie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1932/76 des Rates vom 20. Juli 1976 zur Festlegung
    der im Rahmen der obligatorischen Destillation der Nebenerzeugnisse der Weinbereitung
    zu zahlenden Preise sowie des Höchstbetrags der Beteiligung des Europäischen
    Ausrichtungs- und Garantiefonds der Landwirtschaft, Abteilung Garantie, für das
    Weinwirtschaftsjahr 1976/1977
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1932/76 af 20. juli 1976 om fastsættelse
    for vinproduktionsåret 1976/1977 af de priser, der skal betales i forbindelse
    med den obligatoriske destillering af biprodukter fra vinfremstilling, og af det
    maksimale beløb, hvormed Den europæiske udviklings- og garantifond for Landbruget,
    garantisektionen, deltager
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1932/76 del Consiglio, del 20 luglio 1976, che determina,
    per la campagna viticola 1976/1977, i prezzi da pagare a titolo della distillazione
    obbligatoria dei sottoprodotti della vinificazione e l'importo massimo della partecipazione
    del Fondo europeo agricolo di orientamento e di garanzia, sezione garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1932/76 van de Raad van 20 juli 1976 houdende vaststelling,
    voor het wijnoogstjaar 1976/1977, van de uit hoofde van de verplichte distillatie
    van de bijprodukten van de wijnbereiding te betalen prijzen en van het maximumbedrag
    van de bijdrage van het Europees Oriëntatie- en Garantiefonds voor de Landbouw,
    afdeling Garantie
