  content: Council Regulation (EEC) No 2469/78 of 16 October 1978 on the opening,
    allocation and administration of a Community tariff quota for dried grapes in
    immediate containers of a net capacity of 15 kilograms or less, falling within
    subheading 08.04 B I of the Common Customs Tariff (1979)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2469/78 du Conseil, du 16 octobre 1978, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs présentés en emballages immédiats d' un contenu net inférieur ou égal
    à 15 kilogrammes, de la sous-position 08.04 B I du tarif douanier commun (année
    1979)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2469/78 des Rates vom 16. Oktober 1978 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 Kilogramm
    oder weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs (1979)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2469/78 af 16. oktober 1978 om åbning, fordeling
