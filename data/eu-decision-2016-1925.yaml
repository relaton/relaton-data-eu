  script: Latn
  content: Commission Implementing Decision (EU) 2016/1925 of 31 October 2016 repealing
    Implementing Decision (EU) 2016/17 authorising the United Kingdom to prohibit
    on its territory the marketing of a variety of hemp listed in the Common Catalogue
    of varieties of agricultural plant species, pursuant to Council Directive 2002/53/EC
    (notified under document C(2016) 6860)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1925 de la Commission du 31 octobre 2016
    abrogeant la décision d'exécution (UE) 2016/17 autorisant le Royaume-Uni à
