title:
- language: fr
  script: Latn
  content: Décision 65/15/CEE de la Commission, du 21 décembre 1965, autorisant
    la perception d'une taxe compensatoire sur les importations en République fédérale
    d'Allemagne de pain et de produits similaires en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '65/15/EWG: Entscheidung der Kommission vom 21. Dezember 1964 zur Änderung
    ihrer Entscheidung vom 6. November 1964 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Brot und ähnlichen Erzeugnissen aus dem Königreich der Niederlande
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '65/15/CEE: Decisione della Commissione, del 21 dicembre 1964, relativa
    alla modifica della propria decisione del 6 novembre 1964, che autorizza la riscossione
    di una tassa di compensazione sulle importazioni, nella Repubblica federale di
    Germania, di pane e prodotti analoghi provenienti dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '65/15/EEG: Beschikking van de Commissie van 21 december 1964 houdende
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van brood en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
