type: standard
title:
- language: en
  script: Latn
  content: '98/707/EC: Council Decision of 22 October 1998 relating to the conclusion
    of a Protocol for the adaptation of the trade aspects of Europe Agreement between
    the European Communities and their Member States, of the one part, and the Czech
    Republic, of the other part, to take into account the accession of the Republic
    of Austria, the Republic of Finland and the Kingdom of Sweden to the European
    Union and the results of the agricultural negotiations of the Uruguay Round, including
    the improvements of the existing preferential regime'
  type: main
- language: fr
  script: Latn
  content: '98/707/CE: Décision du Conseil du 22 octobre 1998 relative à la conclusion
    du protocole portant adaptation des aspects commerciaux de l''accord européen
    entre les Communautés européennes et leurs États membres, d''une part, et la
    République tchèque, d''autre part, afin de tenir compte de l''adhésion de la
    République d''Autriche, de la République de Finlande et du Royaume de Suède
    à l''Union européenne, ainsi que du résultat des négociations agricoles du
    cycle d''Uruguay, et notamment des améliorations du régime préférentiel existant'
  type: main
- language: de
  script: Latn
  content: '98/707/EG: Beschluß des Rates vom 22. Oktober 1998 über den Abschluß
    des Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der
    Tschechischen Republik andererseits zur Berücksichtigung des Beitritts der Republik
    Österreich, der Republik Finnland und des Königreichs Schweden zur Europäischen
    Union und der Ergebnisse der Agrarverhandlungen der Uruguay-Runde einschließlich
    der Verbesserung der bestehenden Präferenzregelung'
  type: main
- language: da
  script: Latn
  content: '98/707/EF: Rådets afgørelse af 22. oktober 1998 om indgåelse af en
    protokol om tilpasning af handelsaspekterne i Europaaftalen mellem De Europæiske
    Fællesskaber og deres medlemsstater på den ene side og Den Tjekkiske Republik
    på den anden side for at tage hensyn til Republikken Finlands, Kongeriget Sveriges
    og Republikken Østrigs tiltrædelse af Den Europæiske Union og resultaterne
    af landbrugsforhandlingerne under Uruguay-runden, også forbedringerne af den
    eksisterende præferenceordning'
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 22ας Οκτωβρίου
    1998 περί συνάψεως του πρωτοκόλλου προσαρμογής
    των εμπορικών πτυχών της ευρωπαϊκής συμφωνίας
    μεταξύ των Ευρωπαϊκών Κοινοτήτων και των κρατών
    μελών τους, αφενός, και της Τσεχικής Δημοκρατίας,
    αφετέρου, προκειμένου να ληφθούν υπόψη η προσχώρηση
    της Δημοκρατίας της Αυστρίας, της Δημοκρατίας
    της Φινλανδίας και του Βασιλείου της Σουηδίας
    στην Ευρωπαϊκή Ένωση και τα αποτελέσματα των
    γεωργικών διαπραγματεύσεων του Γύρου της Ουρουγουάης,
    περιλαμβανομένων των βελτιώσεων του ισχύοντος
    προτιμησιακού καθεστώτος
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös tehty 22 päivänä lokakuuta 1998, Euroopan yhteisöjen
    ja niiden jäsenvaltioiden sekä Tsekin tasavallan Eurooppa-sopimuksen kauppaa
    koskevien määräysten mukauttamista koskevan pöytäkirjan tekemisestä Itävallan
    tasavallan, Suomen tasavallan ja Ruotsin kuningaskunnan Euroopan unioniin liittymisen
    ja Uruguayn kierroksen maataloutta koskevien neuvottelujen tulosten, mukaan lukien
    voimassa olevan etuusjärjestelyn parannukset, huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: '98/707/CE: Decisione del Consiglio del 22 ottobre 1998 relativa alla conclusione
    del protocollo di adeguamento degli aspetti commerciali dell''accordo europeo
    tra le Comunità europee e i loro Stati membri, da una parte, e la Repubblica
    ceca, dall''altra, per tener conto dell''adesione della Repubblica d''Austria,
    della Repubblica di Finlandia e del Regno di Svezia all''Unione europea e dei
    risultati dei negoziati agricoli dell''Uruguay Round, compresi i miglioramenti
    del regime preferenziale esistente'
  type: main
- language: nl
  script: Latn
  content: '98/707/EG: Besluit van de Raad van 22 oktober 1998 betreffende de sluiting
    van het protocol tot aanpassing van de handelsaspecten van de Europa-overeenkomst
    tussen de Europese Gemeenschappen en hun lidstaten, enerzijds, en de Tsjechische
    Republiek, anderzijds, in verband met de toetreding van de Republiek Oostenrijk,
    de Republiek Finland en het Koninkrijk Zweden tot de Europese Unie en de resultaten
    van de landbouwonderhandelingen van de Uruguay-ronde, met inbegrip van de verbeteringen
    van de huidige preferentiële regeling'
  type: main
- language: pt
  script: Latn
  content: '98/707/CE: Decisão do Conselho de 22 de Outubro de 1998 relativa à conclusão
    do protocolo que adapta os aspectos comerciais do Acordo Europeu entre as Comunidades
    Europeias e os seus Estados-membros, por um lado, e a República Checa, por outro,
    a fim de ter em conta a adesão da República da Áustria, da República da Finlândia
    e do Reino da Suécia à União Europeia, assim como os resultados das negociações
    do «Uruguay Round» no domínio agrícola, incluindo as melhorias do regime preferencial
    existente'
  type: main
- language: es
  script: Latn
  content: '98/707/CE: Decisión del Consejo de 22 de octubre de 1998 relativa a la
    celebración del Protocolo para la adaptación de los aspectos comerciales del
    Acuerdo europeo entre las Comunidades Europeas y sus Estados miembros, por una
    parte, y la República Checa, por otra, para tener en cuenta la adhesión de la
    República de Austria, de la República de Finlandia y del Reino de Suecia a la
    Unión Europea, así como los resultados de las negociaciones agrícolas de la
    Ronda Uruguay, incluida la mejora del actual régimen preferencial'
  type: main
- language: sv
  script: Latn
  content: Rådets beslut av den 22 oktober 1998 om att anta ett protokoll om anpassning
    av handelsaspekterna i Europaavtalet mellan gemenskaperna och deras medlemsstater,
    å ena sidan, och Tjeckien, å andra sidan, för att beakta Republiken Österrikes,
    Republiken Finlands och Konungariket Sveriges anslutning till Europeiska unionen
    och resultaten av jordbruksförhandlingarna inom Uruguayrundan, däribland förbättningarna
    av den befintliga förmånsordningen
