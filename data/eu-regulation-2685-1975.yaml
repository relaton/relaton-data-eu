  script: Latn
  content: Verordnung (EWG) Nr. 2685/75 der Kommission vom 21. Oktober 1975 über
    die Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft angekauftem
    Magermilchpulver im Rahmen der Nahrungsmittelhilfe an das Kinderhilfswerk der
    Vereinten Nationen (UNICEF) für Indien
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2685/75 af 21. oktober 1975 om licitation
