title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1574/92 of 19 June 1992 re-establishing
    the levying of customs duties on products falling within CN code 6403, originating
    in India, to which the preferential arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1574/92 de la Commission du 19 juin 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 6403
    originaires de l'Inde, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1574/92 DER KOMMISSION vom 19. Juni 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 6403 mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1574/92 af 19. juni 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 6403 og med oprindelse
    i Indien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1574/92 της Επιτροπής
    της 19ης Ιουνίου 1992 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    του κωδικού ΣΟ 6403, καταγωγής Ινδίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1574/92 DELLA COMMISSIONE del 19 giugno 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 6403 originari dell'' India, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1574/92 VAN DE COMMISSIE van 19 juni 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 6403, van oorsprong uit India, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1574/92 DA COMISSÃO de 19 de Junho de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 6403,
    originários da Índia, beneficiários das preferências pautais previstas pelo
    Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1574/92 DE LA COMISIÓN de 19 de junio de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 6403 originarios de la India, beneficiarios de las preferencias
    arancelarias previstas por el Reglamento (CEE) no 3831/90 del Consejo #'
