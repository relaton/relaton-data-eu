  content: '82/198/EEC: Commission Decision of 17 March 1982 establishing that the
    apparatus described as ''Ortec- position emission tomograph, Neuro Ecat, model
    Ecat IV'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/198/CEE: Décision de la Commission, du 17 mars 1982, constatant que
