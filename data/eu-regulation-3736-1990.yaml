  content: Council Regulation (Euratom, ECSC, EEC) No 3736/90 of 19 December 1990
    correcting, with effect from 1 July 1989, and adjusting, with effect from 1 July
    1990, the remuneration and pensions of officials and other servants of the European
    Communities and the weightings applied thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 3736/90 du Conseil, du 19 décembre
