title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 229/2006 of 9 February 2006 determining the
    extent to which applications for import rights lodged in respect of the quota
    for live bovine animals of a weight exceeding 160 kg and originating in Switzerland,
    provided for in Regulation (EC) No 2172/2005, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 229/2006 de la Commission du 9 février 2006 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées pour le contingent de bovins vivants d'un poids excédant 160 kg originaires
    de Suisse, prévu par le règlement (CE) n o 2172/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 229/2006 der Kommission vom 9. Februar 2006 zur Bestimmung
    des Umfangs, in welchem den Anträgen auf Einfuhrrechte für das gemäß der Verordnung
    (EG) Nr. 2172/2005 vorgesehene Zollkontingent für lebende Rinder mit einem Stückgewicht
    von mehr als 160 kg mit Ursprung in der Schweiz stattgegeben werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 229/2006 ze dne 9. února 2006 , kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní práva podaným pro
    kvóty pro dovoz živého skotu o hmotnosti vyšší než 160 kg podle nařízení
    (ES) č. 2172/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 229/2006 af 9. februar 2006 om fastsættelse
    af, i hvilket omfang ansøgningerne om importrettigheder for import af levende
    kvæg med en vægt på over 160 kg og med oprindelse i Schweiz under det kontingentet,
    som er fastsat i forordning (EF) nr. 2172/2005, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 229/2006 της Επιτροπής,
    της 9ης Φεβρουαρίου 2006 , για να καθοριστεί σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για δικαιώματα εισαγωγής που έχουν υποβληθεί
    για την ποσόστωση, βάσει του κανονισμού (ΕΚ)
    αριθ. 2172/2005, στον τομέα των ζώντων βοοειδών
    βάρους άνω των 160 χιλιογράμμων και καταγωγής
    Ελβετίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 229/2006, 9. veebruar 2006 , millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi, mis on
    esitatud seoses määruses (EÜ) nr 2172/2005 Šveitsist pärit üle 160 kg kaaluvate
    elusveiste kvoodiga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 229/2006, annettu 9 päivänä helmikuuta 2006
    , asetuksessa (EY) N:o 2172/2005 säädetyn, yli 160 kilogramman painoisia eläviä
    Sveitsistä peräisin olevia nautaeläimiä koskevan kiintiön mukaisesti jätettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 229/2006/EK rendelete ( 2006. február 9. ) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni a 160 kilogrammnál nagyobb tömegű
    élő szarvasmarhafélékre a 2172/2005/EK rendeletben szabályozott kontingensére
    benyújtott behozatali jogok iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 229/2006 della Commissione, del 9 febbraio 2006 , che
    stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate per il contingente di bovini vivi di peso superiore a 160 kg originari
    della Svizzera previsto dal regolamento (CE) n. 2172/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 229/2006 ( 2006. gada 9. februāris ), ar ko
    nosaka, cik lielā mērā var izpildīt pieteikumus uz tiesībām nodarboties
    ar importu, kuri iesniegti attiecībā uz kvotu dzīviem liellopiem, kuru svars
    pārsniedz 160 kg un kuru izcelsme ir Šveicē, kas paredzēta Regulā (EK) Nr.
    2172/2005
  type: main
- language: lt
  script: Latn
  content: 2006 m. vasario 9 d. Komisijos reglamentas (EB) Nr. 229/2006, nustatantis,
