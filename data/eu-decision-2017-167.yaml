  script: Latn
  content: Commission Implementing Decision (EU) 2017/167 of 30 January 2017 temporarily
    authorising Belgium, the Czech Republic, France and Spain to certify pre-basic
    mother plants and pre-basic material of specific species of fruit plants referred
