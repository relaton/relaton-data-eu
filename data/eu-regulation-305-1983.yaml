    Ausfuhr von im Besitz der britischen Interventionsstelle befindlicher Gerste auf
    400 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 305/83 af 4. februar 1983 om ændring
