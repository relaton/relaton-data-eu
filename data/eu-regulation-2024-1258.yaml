    alalla noudatettavien, vähimmäistaukoja ja vuorokautisia ja viikoittaisia lepoaikoja
    koskevien vähimmäisvaatimusten osalta ja jäsenvaltioiden valtuuksista määrätä
    seuraamuksia toisessa jäsenvaltiossa tai kolmannessa maassa tehdyistä asetuksen
    (EU) N:o 165/2014 rikkomisista
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2024/1258 ó Pharlaimint na hEorpa agus ón gComhairle
    an 24 Aibreán 2024 lena leasaítear Rialachán (CE) Uimh. 561/2006 a mhéid a
    bhaineann leis na ceanglais íosta maidir le híos-sosanna agus tréimhsí scíthe
    laethúla agus seachtainiúla san earnáil iompair ócáidigh paisinéirí agus
    maidir le cumhacht na mBallstát pionóis a fhorchur i leith sáruithe ar Rialachán
    (AE) Uimh. 165/2014 a rinneadh i mBallstát eile nó i dtríú tír
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2024/1258 Europskog parlamenta i Vijeća od 24. travnja 2024.
    o izmjeni Uredbe (EZ) br. 561/2006 s obzirom na minimalne zahtjeve u pogledu minimalnih
    stanki te dnevnih i tjednih razdoblja odmora u sektoru povremenog prijevoza putnika
    i s obzirom na ovlast država članica za izricanje sankcija za kršenja Uredbe
    (EU) br. 165/2014 počinjena u drugoj državi članici ili trećoj zemlji
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2024/1258 rendelete (2024. április
    24.) az 561/2006/EK rendeletnek a különjárati személyszállítási ágazatban
    alkalmazott minimumszünetekre, valamint a napi és heti pihenőidőkre vonatkozó
    minimumkövetelmények, továbbá a 165/2014/EU rendeletnek másik tagállamban
    vagy valamely harmadik országban elkövetett megsértése miatti szankciók kiszabására
    irányuló tagállami hatáskör tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2024/1258 del Parlamento europeo e del Consiglio, del
    24 aprile 2024, che modifica il regolamento (CE) n. 561/2006 per quanto riguarda
    gli obblighi minimi in materia di interruzioni minime e di periodi di riposo giornalieri
    e settimanali nel settore del trasporto occasionale di passeggeri e per quanto
    riguarda il potere degli Stati membri di imporre sanzioni in caso di infrazioni
    al regolamento (UE) n. 165/2014 commesse in un altro Stato membro o in un paese
    terzo
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2024/1258 (2024. gada 24. aprīlis),
    ar ko groza Regulu (EK) Nr. 561/2006 attiecībā uz minimālajām prasībām par
    minimālajiem pārtraukumiem un ikdienas un iknedēļas atpūtas laikposmiem pasažieru
    neregulāro pārvadājumu nozarē un attiecībā uz dalībvalstu pilnvarām piemērot
    sodus par Regulas (ES) Nr. 165/2014 pārkāpumiem, kas izdarīti citā dalībvalstī
    vai trešā valstī
  type: main
- language: lt
  script: Latn
  content: 2024 m. balandžio 24 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2024/1258, kuriuo iš dalies keičiamas Reglamentas (EB) Nr. 561/2006, kiek tai
    susiję su minimalių pertraukų ir kasdienio bei kassavaitinio poilsio laikotarpių
    minimaliaisiais reikalavimais vienkartinių keleivių vežimo paslaugų sektoriuje
    ir su valstybių narių įgaliojimais skirti sankcijas už kitoje valstybėje
    narėje ar trečiojoje valstybėje padarytus Reglamento (ES) Nr. 165/2014 pažeidimus
  type: main
