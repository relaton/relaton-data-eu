title:
- language: en
  script: Latn
  content: Regulation (EU) 2024/1258 of the European Parliament and of the Council
    of 24 April 2024 amending Regulation (EC) No 561/2006 as regards minimum requirements
    on minimum breaks and daily and weekly rest periods in the occasional passenger
    transport sector and as regards Member States’ power to impose penalties for
    infringements of Regulation (EU) No 165/2014 committed in another Member State
    or in a third country
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2024/1258 du Parlement européen et du Conseil du 24 avril
    2024 modifiant le règlement (CE) n° 561/2006 en ce qui concerne les exigences
    minimales relatives aux durées minimales des pauses et des temps de repos journaliers
    et hebdomadaires dans le secteur du transport occasionnel de voyageurs et en ce
    qui concerne le pouvoir des États membres d’infliger des sanctions en cas d’infractions
    au règlement (UE) n° 165/2014 commises dans un autre État membre ou dans un
    pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2024/1258 des Europäischen Parlaments und des Rates vom
    24. April 2024 zur Änderung der Verordnung (EG) Nr. 561/2006 hinsichtlich der
    Mindestanforderungen an Mindestfahrtunterbrechungen sowie die täglichen und wöchentlichen
    Mindestruhezeiten im Sektor des Personengelegenheitsverkehrs und hinsichtlich
    der Befugnis der Mitgliedstaaten, Sanktionen für in einem anderen Mitgliedstaat
    oder einem Drittstaat begangene Verstöße gegen die Verordnung (EU) Nr. 165/2014
    zu verhängen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2024/1258 на Европейския парламент
    и на Съвета от 24 април 2024 година за изменение
    на Регламент (ЕО) № 561/2006 по отношение на минималните
    изисквания за минимални почивки по време на
    работа и за дневните и седмичните почивки в
    сектора на случайния превоз на пътници и по
    отношение на правомощията на държавите членки
    да налагат санкции за нарушения на Регламент
    (ЕС) № 165/2014, извършени в друга държава членка
    или в трета страна
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2024/1258 ze dne 24. dubna
    2024, kterým se mění nařízení (ES) č. 561/2006, pokud jde o minimální
    požadavky na minimální přestávky v řízení a denní a týdenní doby odpočinku
    v odvětví příležitostné osobní dopravy a pokud jde o pravomoc členských
    států ukládat sankce za porušení nařízení (EU) č. 165/2014, k němuž
    došlo v jiném členském státě nebo ve třetí zemi
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2024/1258 af 24. april 2024
