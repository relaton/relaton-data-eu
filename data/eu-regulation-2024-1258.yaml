    požiadavky na minimálne prestávky a doby denného a týždenného odpočinku
    v odvetví príležitostnej osobnej dopravy a pokiaľ ide o právomoc členských
    štátov ukladať sankcie za porušenia nariadenia (EÚ) č. 165/2014, ku ktorým
    došlo v inom členskom štáte alebo v tretej krajine
  type: main
