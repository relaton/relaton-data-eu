    for minimumspauser og daglig og ugentlig hviletid i sektoren for lejlighedsvis
    persontransport og for så vidt angår medlemsstaternes beføjelser til at pålægge
    sanktioner for overtrædelser af forordning (EU) nr. 165/2014 begået i en anden
    medlemsstat eller i et tredjeland
  type: main
