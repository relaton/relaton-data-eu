    do minimalnych wymogów dotyczących minimalnych przerw oraz dziennego i tygodniowego
    okresu odpoczynku w sektorze okazjonalnego przewozu osób oraz w odniesieniu do
    uprawnień państw członkowskich do nakładania kar za naruszenia rozporządzenia
