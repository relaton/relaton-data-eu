    ce privește cerințele minime privind pauzele minime și perioadele de repaus
    zilnic și săptămânal în sectorul transportului ocazional de călători și
    în ceea ce privește competența statelor membre de a aplica sancțiuni în cazul
    încălcărilor Regulamentului (UE) nr. 165/2014 săvârșite într-un alt stat
    membru sau într-o țară terță
  type: main
- language: sk
  script: Latn
