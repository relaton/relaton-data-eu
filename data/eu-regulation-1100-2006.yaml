  script: Latn
  content: Commission Regulation (EC) No 1100/2006 of 17 July 2006 laying down, for
    the marketing years 2006/07, 2007/08 and 2008/09, detailed rules for the opening
    and administration of tariff quotas for raw cane-sugar for refining, originating
    in least developed countries, as well as detailed rules applying to the importation
    of products of tariff heading 1701 originating in least developed countries
  type: main
