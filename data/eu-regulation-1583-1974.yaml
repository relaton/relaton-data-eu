title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1583/74 of the Commission of 24 June 1974 re-establishing
    the levying of the customs duties on goat and kid skin leather, other, falling
    within subheading 41.04 B II, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1583/74 de la Commission, du 24 juin 1974, portant
    rétablissement de la perception des droits de douane applicables aux peaux de
    caprins, préparées, non dénommées, de la sous-position tarifaire 41.04 B II,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1583/74 der Kommission vom 24. Juni 1974 zur Wiedereinführung
    des Zollsatzes für Ziegen- und Zickelleder, anderes, der Tarifstelle 41.04 B
    II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1583/74 af 24. juni 1974 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidskind, andre varer,
    under underposition 41.04 B II, som har oprindelse i Indien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18.
    december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1583/74 della Commissione, del 24 giugno 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle pelli caprine, preparate,
    non nominate, della sottovoce doganale 41.04 B II originarie dell'India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1583/74 van de Commissie van 24 juni 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op geiteleder,
    alsmede voorgelooide huiden en vellen, overige, van onderverdeling 41.04 B II,
    van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
