    jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 964/81 der Kommission vom 8. April 1981 zur Festsetzung
