    środków dotyczących tymczasowego złagodzenia zasad wykorzystywania czasów
    na start lub lądowanie w związku z kryzysem związanym z COVID-19
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1889 da Comissão de 23 de julho de 2021
    que altera o Regulamento (CEE) n.o 95/93 do Conselho no que respeita à prorrogação
    das medidas para a isenção temporária das regras de utilização das faixas
    horárias devido à crise da COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1889 al Comisiei din 23 iulie 2021 de modificare
    a Regulamentului (CEE) nr. 95/93 al Consiliului în ceea ce privește extinderea
    măsurilor de reducere temporară a obligațiilor de utilizare a sloturilor orare
    ca urmare a crizei provocate de pandemia de COVID-19
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1889 z 23. júla 2021, ktorým
