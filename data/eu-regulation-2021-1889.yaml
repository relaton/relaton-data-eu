    od pravil uporabe slotov zaradi krize zaradi COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1889 de la Comisión de 23 de julio de 2021
    por el que se modifica el Reglamento (CEE) n.o 95/93 del Consejo en lo que respecta
    a la prórroga de las medidas de flexibilización temporal de las normas de utilización
    de las franjas horarias debido a la crisis de la COVID-19
  type: main
- language: sv
  script: Latn
