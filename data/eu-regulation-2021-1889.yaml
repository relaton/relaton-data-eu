    na dočasnú úľavu z uplatňovania pravidiel využívania prevádzkových intervalov
    v dôsledku krízy spôsobenej ochorením COVID-19
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1889 z dne 23. julija 2021 o spremembi
