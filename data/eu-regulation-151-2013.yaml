  script: Latn
  content: Reglamento Delegado (UE) n ° 151/2013 de la Comisión, de 19 de diciembre
    de 2012 , por el que se completa el Reglamento (UE) n ° 648/2012 del Parlamento
    Europeo y del Consejo, relativo a los derivados extrabursátiles, las entidades
    de contrapartida central y los registros de operaciones, en lo que respecta a
    las normas técnicas de regulación que especifican los datos que los registros
    de operaciones habrán de publicar y mantener disponibles y las normas operativas
    para la agregación y comparación de los datos y el acceso a los mismos
  type: main
