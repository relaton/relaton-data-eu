  script: Latn
  content: Regulamentul delegat (UE) nr. 151/2013 al Comisiei din 19 decembrie 2012
    de completare a Regulamentului (UE) nr. 648/2012 al Parlamentului European și
    al Consiliului privind instrumentele financiare derivate extrabursiere, contrapărțile
    centrale și registrele centrale de tranzacții, în ceea ce privește standarde
    tehnice de reglementare care să precizeze datele care urmează să fie publicate
    și puse la dispoziție de registrele centrale de tranzacții și standarde operaționale
    pentru agregarea, compararea și accesarea datelor
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) č. 151/2013 z 19. decembra 2012 ,
    ktorým sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 648/2012
    o mimoburzových derivátoch, centrálnych protistranách a archívoch obchodných
    údajov, pokiaľ ide o regulačné technické normy bližšie určujúce údaje,
    ktoré majú archívy obchodných údajov zverejniť a sprístupniť, a prevádzkové
    normy na agregáciu a porovnávanie údajov a prístup k týmto údajom
  type: main
