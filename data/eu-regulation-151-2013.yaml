  content: Regolamento delegato (UE) n. 151/2013 della Commissione, del 19 dicembre
    2012 , che integra il regolamento (UE) n. 648/2012 del Parlamento europeo e del
    Consiglio sugli strumenti derivati OTC, le controparti centrali e i repertori
    di dati sulle negoziazioni per quanto riguarda le norme tecniche di regolamentazione
    che specificano le informazioni da pubblicare e mettere a disposizione in tali
    repertori e gli standard operativi richiesti per aggregare e comparare i dati
    tra i repertori e accedervi
  type: main
