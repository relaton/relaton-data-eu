    finančnih instrumentih OTC, centralnih nasprotnih strankah in repozitorijih sklenjenih
    poslov glede regulativnih tehničnih standardov, ki določajo podatke, ki jih
    morajo repozitoriji sklenjenih poslov javno objaviti in predložiti, ter operativne
    standarde za zbiranje, primerjavo in dostop do podatkov
  type: main
