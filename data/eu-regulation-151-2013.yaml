    w sprawie instrumentów pochodnych będących przedmiotem obrotu poza rynkiem
    regulowanym, kontrahentów centralnych i repozytoriów transakcji w odniesieniu
    do regulacyjnych standardów technicznych określających dane, które mają być
    publikowane i udostępniane przez repozytoria transakcji, a także standardy operacyjne
    dotyczące agregowania i porównywania danych oraz dostępu do tych danych
  type: main
