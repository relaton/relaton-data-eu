    e do Conselho relativo aos derivados OTC, às contrapartes centrais e aos repositórios
    de transações, no que diz respeito às normas técnicas de regulamentação
    que especificam os dados que devem ser divulgados e disponibilizados pelos repositórios
    de transações, bem como normas operacionais com vista à agregação, à comparação
    e ao acesso a esses dados
  type: main
