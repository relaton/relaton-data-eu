    en de Raad betreffende otc-derivaten, centrale tegenpartijen en transactieregisters
    met technische reguleringsnormen ter specificatie van de door transactieregisters
    te publiceren en beschikbaar te stellen gegevens en van operationele normen voor
    de aggregatie van, vergelijking tussen en toegang tot gegevens
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) nr 151/2013 z dnia 19 grudnia 2012
