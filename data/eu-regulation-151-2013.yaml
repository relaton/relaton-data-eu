    felekről és a kereskedési adattárakról szóló 648/2012/EU európai parlamenti
    és tanácsi rendeletnek a kereskedési adattárak által közzéteendő és hozzáférhetővé
    teendő adatokat, valamint az adatok összesítésére, összehasonlítására
    és az adatokhoz való hozzáférésre vonatkozó működési standardokat meghatározó
    szabályozási technikai standardok tekintetében történő kiegészítéséről
  type: main
