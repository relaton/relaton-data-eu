    ārpusbiržas atvasinātajiem instrumentiem, centrālajiem darījumu partneriem
    un darījumu reģistriem attiecībā uz regulatīvajiem tehniskajiem standartiem,
    kas nosaka datus, kuri darījumu reģistriem ir jāpublicē un jādara pieejami,
    un darbības standartus saistībā ar datu apkopošanu un salīdzināšanu un
    piekļuvi datiem
  type: main
