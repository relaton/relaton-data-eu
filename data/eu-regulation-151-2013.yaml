- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 151/2013 of 19 December 2012 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council on OTC
    derivatives, central counterparties and trade repositories, with regard to regulatory
    technical standards specifying the data to be published and made available by
    trade repositories and operational standards for aggregating, comparing and accessing
    the data
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 151/2013 de la Commission du 19 décembre
    2012 complétant le règlement (UE) n ° 648/2012 du Parlement européen et du
    Conseil sur les produits dérivés de gré à gré, les contreparties centrales
    et les référentiels centraux par des normes techniques de réglementation précisant
    les informations à publier et à mettre à disposition par les référentiels
    centraux, ainsi que les normes opérationnelles à respecter pour l’agrégation,
    la comparaison et l’accessibilité des données
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 151/2013 der Kommission vom 19. Dezember
    2012 zur Ergänzung der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments
    und des Rates über OTC-Derivate, zentrale Gegenparteien und Transaktionsregister
    im Hinblick auf technische Regulierungsstandards für die von Transaktionsregistern
    zu veröffentlichenden und zugänglich zu machenden Daten sowie operationelle
    Standards für die Zusammenstellung und den Vergleich von Daten sowie den Datenzugang
  type: main
