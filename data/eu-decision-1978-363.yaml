id: EUDecision1978363
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 March 1978 authorizing the Italian Republic not
    to apply Community treatment to new tyre cases and tubeless tyres, falling within
    heading No ex 40.11 of the Common Customs Tariff, originating in Japan and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/363/CEE: Décision de la Commission, du 15 mars 1978, autorisant la
    République italienne à exclure du traitement communautaire les pneumatiques
    neufs, de la position Ex 40.11 du Tarif douanier commun, originaires du Japon
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. März 1978, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche neue Laufdecken und schlauchlose Reifen der Tarifnummer
    ex 40.11 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 15. marts 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage nye dæk (ikke massive), herunder
    slangeløse, som henhører under pos. ex 40.11 i den fælles toldtarif, har oprindelse
    i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 15 marzo 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le coperture nuove della voce
    ex 40.11 della tariffa doganale comune, originarie del Giappone e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 maart 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd nieuwe buitenbanden van post ex 40.11 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
