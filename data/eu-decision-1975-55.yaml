id: EUDecision197555
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 13 January 1975 authorizing France to apply protective
    measures to live sheep falling within subheading 01.04 A I b) of the Common Customs
    Tariff and mutton and lamb falling within subheading 02.01 A ex IV of the Common
    Customs Tariff, originating in third countries and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: '75/55/CEE: Décision de la Commission, du 13 janvier 1975, autorisant
    la République française à appliquer des mesures de protection pour les animaux
    vivants de l''espèce ovine de la position 01.04 A I B) du Tarif douanier commun
    et la viande ovine de la position 02.01 A Ex IV du Tarif douanier commun, originaires
    de pays tiers et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Januar 1975, mit der die Französische
    Republik ermächtigt wird, Schutzmaßnahmen anzuwenden für lebende Schafe der
    Tarifnummer 01.04 A I b) des Gemeinsamen Zolltarifs und Fleisch von Schafen der
    Tarifnummer 02.01 A ex IV des Gemeinsamen Zolltarifs mit Ursprung in dritten Ländern,
    die sich in den anderen Mitgliedstaaten im freien Verkehr befinden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. januar 1975 om at bemyndige Den franske
    Republik til at anvende beskyttelsesforanstaltninger for får, levende, pos. 01.04
    A I b) i den fælles toldtarif, og for fårekød pos. 02.01 A ex IV i den fælles
    toldtarif, med oprindelse i tredjelande og i fri omsætning i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 gennaio 1975, con cui si autorizza
    la Repubblica francese ad applicare delle misure di protezione per gli animali
    vivi della specie ovina, della voce n. 01.04 A I b) della tariffa doganale comune,
    e la carne ovina, della voce n. 02.01 A ex IV della tariffa doganale comune, originari
    dei paesi terzi e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 januari 1975 waarbij de Franse Republiek
    wordt gemachtigd beschermende maatregelen te nemen voor levende schapen van post
    01.04 A I b) van het gemeenschappelijk douanetarief en schapevlees van post 02.01
    A ex IV van het gemeenschappelijk douanetarief van oorsprong uit derde landen
    en in andere Lid-Staten in het vrije verkeer gebracht
  type: main
