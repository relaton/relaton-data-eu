    der Richtlinie 66/402/EWG nicht entspricht, zum Verkehr zuzulassent (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/339/EØF: Kommissionens beslutning af 7. maj 1982 om bemyndigelse af
