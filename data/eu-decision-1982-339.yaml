  content: '82/339/EEC: Commission Decision of 7 May 1982 authorizing the Italian
    Republic to permit temporarily the marketing of rice seed not satisfying the requirements
    of Council Directive 66/402/EECe (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/339/CEE: Décision de la Commission, du 7 mai 1982, autorisant la République
    italienne à admettre temporairement la commercialisation de semences de riz ne
    répondant pas aux exigences de la directive 66/402/CEE (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
