title:
- language: fr
  script: Latn
  content: '70/67/CEE: Décision de la Commission, du 30 décembre 1969, portant fixation
    d''une taxe compensatoire sur les importations en Belgique, au Luxembourg et aux
    Pays-Bas, d''alcool éthylique d''origine agricole en provenance des États membres
    détenteurs de monopole'
  type: main
- language: de
  script: Latn
  content: '70/67/EWG: Entscheidung der Kommission vom 30. Dezember 1969 über die
    Festsetzung einer Ausgleichsabgabe bei der Einfuhr von Äthylalkohol landwirtschaftlichen
    Ursprungs aus Mitgliedstaaten, in denen ein Monopol besteht, nach Belgien, Luxemburg
    und den Niederlanden'
  type: main
- language: it
  script: Latn
  content: '70/67/CEE: Decisione della Commissione, del 30 dicembre 1969, che fissa
    una tassa di compensazione applicabile alle importazioni nel Belgio, nel Lussemburgo
    e nei Paesi Bassi di alcole etilico di origine agricola in provenienza dagli Stati
    membri detentori di monopolio'
  type: main
- language: nl
  script: Latn
  content: '70/67/EEG: Beschikking van de Commissie van 30 december 1969 houdende
    vaststelling van een compenserende heffing op de invoer in België, Luxemburg
    en Nederland van uit landbouwprodukten verkregen ethylalcohol uit de monopoliehoudende
    Lid-Staten'
  type: main
