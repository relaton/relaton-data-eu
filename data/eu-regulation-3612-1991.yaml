title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3612/91 of 12 December 1991 laying down
    certain additional detailed rules for the application of the supplementary trade
    mechanism (STM) to fruit and vegetable trade between Spain and the Community as
    constituted at 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives,
    artichokes, table grapes, and melons
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3612/91 DE LA COMMISSION du 12 décembre 1991 fixant
    certaines modalités additionnelles pour l'' application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l'' Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les artichauts, les raisins de
    table et les melons #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3612/91 DER KOMMISSION vom 12. Dezember 1991 mit
    zusätzlichen Bestimmungen zum ergänzenden Handelsmechanismus (EHM) für Tomaten,
    Salat, Endivie Eskariol, Artischocken, Tafeltrauben und Melonen im Handel zwischen
    Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3612/91 af 12. december 1991 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    (SMS) mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985
    i sektoren for frugt og grønsager, for så vidt angår tomater, salat, bredbladet
    endivie, artiskokker, druer til spisebrug og meloner
  type: main
- language: el
  script: Grek
