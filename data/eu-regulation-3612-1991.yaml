    lattughe, le cicorie scarole, i carciofi, le uve da tavola, e i meloni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3612/91 VAN DE COMMISSIE van 12 december 1991 tot
