    en ce qui concerne la modification de l’annexe II (Réglementations techniques,
    normes, essais et certification), de l’annexe X (Services en général) et du
    protocole 37 (comportant la liste prévue à l’article 101) de l’accord EEE
    (Évaluation des technologies de la santé)
  type: main
