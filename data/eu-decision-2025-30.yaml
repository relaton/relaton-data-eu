title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/30 of 17 December 2024 on the position to be
    adopted, on behalf of the European Union, within the EEA Joint Committee concerning
    the amendment of Annex II (Technical regulations, standards, testing and certification),
    Annex X (Services in general) and Protocol 37 (containing the list provided for
    in Article 101) to the EEA Agreement (Health Technology Assessment)
  type: main
- language: fr
  script: Latn
