title:
- language: en
  script: Latn
  content: '2000/787/EC: Council Decision of 23 November 2000 on the signing, on behalf
    of the European Community, of the Agreement in the form of an Exchange of Letters
    between the European Community and the People''s Republic of China initialled
    in Beijing on 19 May 2000 amending the Agreement between them on trade in textile
    products and amending the Agreement between them initialled on 19 January 1995
    on trade in textile products not covered by the MFA bilateral Agreement, and authorising
    its provisional application'
  type: main
- language: fr
  script: Latn
  content: '2000/787/CE: Décision du Conseil du 23 novembre 2000 portant sur la signature,
    au nom de la Communauté européenne, de l''accord sous forme d''échange de lettres
    entre la Communauté européenne et la République populaire de Chine, paraphé
    à Pékin le 19 mai 2000, modifiant l''accord conclu entre elles sur le commerce
    des produits textiles et l''accord conclu entre elles, paraphé le 19 janvier
    1995, concernant le commerce des produits textiles non couverts par l''accord
    bilatéral AMF, et autorisant son application provisoire'
  type: main
- language: de
  script: Latn
  content: '2000/787/EG: Beschluss des Rates vom 23. November 2000 über die Unterzeichnung
    im Namen der Europäischen Gemeinschaft des am 19. Mai 2000 in Peking paraphierten
    Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
    und der Volksrepublik China zur Änderung ihres Abkommens über den Handel mit
    Textilwaren und zur Änderung ihres am 19. Januar 1995 paraphierten Abkommens
    über den Handel mit Textilwaren, die nicht unter das bilaterale MFV-Abkommen
    fallen, und über die Genehmigung seiner vorläufigen Anwendung'
  type: main
- language: da
  script: Latn
  content: '2000/787/EF: Rådets afgørelse af 23. november 2000 om undertegnelse
    på Det Europæiske Fællesskabs vegne af aftalen i form af brevveksling mellem
    Det Europæiske Fællesskab og Folkerepublikken Kina, paraferet i Beijing den
    19. maj 2000, om ændring af aftalen mellem dem om handel med tekstilvarer og
    om ændring af aftalen mellem dem, paraferet den 19. januar 1995, om handel med
    tekstilvarer, der ikke er omfattet af den bilaterale MFA-aftale, samt om bemyndigelse
    til dens midlertidige anvendelse'
  type: main
- language: el
  script: Grek
