    på Europeiska gemenskapens vägnar av avtalet genom skriftväxling mellan Europeiska
    gemenskapen och Folkrepubliken Kina, paraferat i Peking den 19 maj 2000, om ändring
    av avtalet mellan dessa parter om handel med textilprodukter och av avtalet mellan
    dessa parter, paraferat den 19 januari 1995, om handel med textilprodukter som
