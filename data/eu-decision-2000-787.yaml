    a Comunidade Europeia e a República Popular da China, rubricado em Pequim, em
    19 de Maio de 2000, que altera o Acordo sobre o comércio de produtos têxteis
    por elas celebrado e que altera o Acordo sobre o comércio de produtos têxteis
    não abrangidos pelo Acordo Bilateral AMF, por elas rubricado em 19 de Janeiro
