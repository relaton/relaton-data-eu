    για το εμπόριο κλωστοϋφαντουργικών προϊόντων
    που δεν καλύπτονται από τη διμερή συμφωνία
    ΣΠΙ και για την έγκριση της προσωρινής εφαρμογής
    της'
  type: main
- language: fi
  script: Latn
  content: '2000/787/EY: Neuvoston päätös, tehty 23 päivänä marraskuuta 2000,
