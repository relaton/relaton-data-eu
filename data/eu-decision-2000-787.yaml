    Notas entre la Comunidad Europea y la República Popular de China, rubricado en
    Pekín el 19 de mayo de 2000, por el que se modifica el Acuerdo celebrado entre
    ellas sobre el comercio de productos textiles y por el que se modifica el Acuerdo
    celebrado entre ellas rubricado el 19 de enero de 1995 sobre el comercio de productos
