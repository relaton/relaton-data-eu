  content: Council Regulation (EEC) No 2731/85 of 27 September 1985 temporarly and
    totally suspending the autonomous common customs tariff duties on certain products
    falling within subheadings ex 29.04 a III A), ex 39.02 C I A) and 39.02 C I B)
    and amending, in respect of certain monolithic integrated circuits, falling within
    subheading ex 85.21 D II, Regulation (EEC) No 1736/85 temporarly suspending the
    autonomous common customs tariff duties on a number of industrial products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2731/85 du Conseil, du 27 septembre 1985, portant
    suspension temporaire et totale des droits autonomes du tarif douanier commun
    sur certains produits des sous-positions EX 29.04 A III a), EX 39.02 C I a) et
    EX 39.02 C I b), et modifiant, en ce qui concerne certains circuits intégrés
    monolithiques de la sous- position EX 85.21 D II, le règlement (CEE) n° 1736/85
    portant suspension temporaire des droits autonomes du tarif douanier commun sur
    un certain nombre de produits industriels
  type: main
