    pour les restitutions à l'' exportation, en ce qui concerne les codes NC ex 1102
    et ex 1103 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3307/91 DER KOMMISSION vom 13. November 1991 zur
