  content: Commission Regulation (EEC) No 3307/91 of 13 November 1991 amending Regulation
    (EEC) No 3846/87 establishing an agricultural products nomenclature for export
    refunds, with regard to CN codes ex 1102 and ex 1103
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3307/91 DE LA COMMISSION du 13 novembre 1991 modifiant
