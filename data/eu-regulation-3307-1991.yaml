    landwirtschaftlichen Erzeugnisse für Ausfuhrerstattungen bezüglich der KN-Codes
    ex 1102 und ex 1103 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3307/91 af 13. november 1991 om ændring
