    und dem Vereinigten Königreich Großbritannien und Nordirland andererseits eingesetzten
    Sonderausschuss für Straßenverkehr in Bezug auf eine Liste der Kategorien, Arten
    und Schweregrade schwerwiegender Verstöße, die zur Aberkennung der Zuverlässigkeit
    eines Güterkraftverkehrsunternehmers führen können, zu vertreten ist
  type: main
