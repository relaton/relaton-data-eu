  content: Council Decision (EU) 2025/2416 of 27 October 2025 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Road
    Transport established by the Trade and Cooperation Agreement between the European
    Union and the European Atomic Energy Community, of the one part, and the United
    Kingdom of Great Britain and Northern Ireland, of the other part, on a list of
    categories, types and degrees of seriousness of serious infringements which may
    lead to the loss of good repute for a road haulage operator
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2416 du Conseil du 27 octobre 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité spécialisé chargé
    du transport routier institué par l’accord de commerce et de coopération entre
    l’Union européenne et la Communauté européenne de l’énergie atomique,
    d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande du Nord, d’autre
    part, en ce qui concerne une liste des catégories, types et niveaux de gravité
    des infractions graves susceptibles d’aboutir à la perte de l’honorabilité
    d’un transporteur routier
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/2416 des Rates vom 27. Oktober 2025 über den Standpunkt,
