  script: Latn
  content: Sklep Sveta (EU) 2025/2416 z dne 27. oktobra 2025 o stališču, ki se v
    imenu Evropske unije zastopa v Specializiranem odboru za cestni prevoz, ustanovljenem
    s Sporazumom o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo
    za atomsko energijo na eni strani ter Združenim kraljestvom Velika Britanija
