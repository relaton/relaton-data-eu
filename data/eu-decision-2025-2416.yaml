  content: Decisión (UE) 2025/2416 del Consejo, de 27 de octubre de 2025, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    Especializado en Transporte por Carretera establecido por el Acuerdo de Comercio
    y Cooperación entre la Unión Europea y la Comunidad Europea de la Energía Atómica,
    por una parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra,
