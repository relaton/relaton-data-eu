    zriadenom Dohodou o obchode a spolupráci medzi Európskou úniou a Európskym
    spoločenstvom pre atómovú energiu na jednej strane a Spojeným kráľovstvom
    Veľkej Británie a Severného Írska na strane druhej, pokiaľ ide o zoznam kategórií,
    druhov a stupňov závažnosti závažných porušení, ktoré môžu viesť k
    strate bezúhonnosti prevádzkovateľa cestnej nákladnej dopravy
  type: main
