title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2924/73 of the Commission of 26 October 1973 re-establishing
    Common Customs Tariff duties on fabricated asbestos and articles thereof etc,
    falling within heading No 68.13 of the Common Customs Tariff, originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2924/73 de la Commission, du 26 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à l' amiante travaillé, ouvrages en amiante, etc., de la position tarifaire
    68.13, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2924/73 der Kommission vom 26. Oktober 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für bearbeiteten Asbest; Asbestwaren
    usw. der Tarifnummer 68.13, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2924/73 af 26. oktober 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for bearbejdede asbestfibre, varer af
    asbest, etc., under position 68.13, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2762/72
    af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2924/73 della Commissione, del 26 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili all'
    amianto lavorato, lavori di amianto, ecc., della voce doganale n. 68.13 originari
    della Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2924/73 van de Commissie van 26 oktober 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bewerkte asbestvezels; werken van asbest, enz., van post 68.13,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties werden geopend
  type: main
