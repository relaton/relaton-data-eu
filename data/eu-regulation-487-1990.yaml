    le carote, gli agrumi e le mele e pere da tavola, per quanto riguarda il calibro
    delle mele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 487/90 van de Commissie van 27 februari 1990 houdende
