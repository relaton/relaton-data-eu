    Zitrusfrüchte sowie Tafeläpfel und -birnen hinsichtlich der Größensortierung
    der Äpfel
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 487/90 af 27. februar 1990 om ændring
