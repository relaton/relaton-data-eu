    standards for carrots, citrus fruit and dessert apples and pears
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 487/90 de la Commission du 27 février 1990 modifiant
    le règlement (CEE) n° 920/89 portant fixation des normes de qualité pour les
    carottes, les agrumes et les pommes et poires de table, en ce qui concerne le
    calibre des pommes
  type: main
