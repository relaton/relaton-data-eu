schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1314/2003 of 24 July 2003 determining to
    what extent import right applications submitted for live bovine animals weighing
    between 80 and 300 kg as part of a tariff quota provided for in Regulation (EC)
    No 1247/1999 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1314/2003 de la Commission du 24 juillet 2003 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites pour les animaux vivants de l'espèce bovine d'un poids de 80 à 300
    kg dans le cadre d'un contingent tarifaire prévu par le règlement (CE) n° 1247/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1314/2003 der Kommission vom 24. Juli 2003 zur Festsetzung
    des Umfangs, in dem die Aufträge auf Einfuhrrechte für lebende, 80 bis 300 kg
    schwere Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG) Nr.
    1247/1999 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1314/2003 af 24. juli 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder for
    levende kvæg af en vægt på 80 til 300 kg i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1247/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1314/2003 της Επιτροπής,
    της 24ης Ιουλίου 2003, για τον καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις δικαιωμάτων εισαγωγής που έχουν
    υποβληθεί για ζωντανά βοοειδή, βάρους από 80
    έως 300 χιλιόγραμμα, στο πλαίσιο μιας δασμολογικής
    ποσόστωσης η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 1247/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1314/2003, annettu 24 päivänä heinäkuuta
    2003, eläviä 80—300 kg painavia nautaeläimiä koskevien tuontioikeushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1247/1999 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1314/2003 della Commissione, del 24 luglio 2003, che
    stabilisce in che misura possono essere accolte le domande di diritti di importazione
    presentate per gli animali vivi della specie bovina, da 80 a 300 kg, nel quadro
    del contingente tariffario previsto dal regolamento (CE) n. 1247/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1314/2003 van de Commissie van 24 juli 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de invoerrechtenaanvragen voor
    levende runderen met een gewicht van 80 tot 300 kg, die zĳn ingediend op grond
    van een bĳ Verordening (EG) nr. 1247/1999 vastgesteld tariefcontingent
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1314/2003 da Comissão, de 24 de Julho de 2003, que
    determina em que medida podem ser aceites os pedidos de direitos de importação
    de animais vivos da espécie bovina com peso compreendido entre 80 e 300 quilogramas,
    apresentados ao abrigo de um contingente pautal previsto pelo Regulamento (CE)
    n.° 1247/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1314/2003 de la Comisión, de 24 de julio de 2003,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    derechos de importación de animales vivos de la especie bovina con un peso entre
    80 y 300 kg, presentadas dentro de un contingente arancelario establecido en el
    Reglamento (CE) n° 1247/1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1314/2003 av den 24 juli 2003 om i vilken
    utsträckning ansökningar om importrättigheter inlämnade för levande nötkreatur
    med en vikt på 80–300 kg inom ramen för den avgiftskvot som fastställts i
    förordning (EG) nr 1247/1999 kan beviljas
  type: main
