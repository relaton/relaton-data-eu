title:
- language: en
  script: Latn
  content: '79/473/EEC: Commission Decision of 27 April 1979 authorizing the French
    Republic not to apply Community treatment to handkerchiefs of woven fabrics, of
    a value of not more than 15 EUA/kg, falling within subheading 61.05 B of the Common
    Customs Tariff (NIMEXE codes 61.05-30, 99) (category 19), originating in the People''
    s Republic of China and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/473/CEE: Décision de la Commission, du 27 avril 1979, autorisant la
    République française à exclure du traitement communautaire les mouchoirs en
    tissus d''une valeur inférieure ou égale à 15 unités de compte européennes
    par kilogramme poids net, de la sous- position 61.05 B du tarif douanier commun
    (codes Nimexe: 61.05-30, 99) (catégorie 19), originaires de la République populaire
    de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/473/EWG: Entscheidung der Kommission vom 27. April 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Taschentücher
    aus Gewebe, mit einem Wert von nicht mehr als 15 ERE je kg Eigengewicht, der Tarifstelle
    61.05 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.05-30, 99) (Kategorie
    19) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/473/EØF: Kommissionens beslutning af 27. april 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage lommetørklæder
    af bomuld, ikke over 15 ERE/kg, som henhører under pos. 61.05 B i den fælles
    toldtarif (NIMEXE-nummer 61.05-30, 99 ; kategori 19), har oprindelse i Den kinesiske
    Folkerepublik og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/473/CEE: Decisione della Commissione, del 27 aprile 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario fazzoletti da
    naso, di tessuti, di un valore non superiore a 15 UCE per kg netto, della sottovoce
    61.05 B della tariffa doganale comune (codici Nimexe: 61.05-30, 99) (categoria
    19), originari della Repubblica popolare cinese e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/473/EEG: Beschikking van de Commissie van 27 april 1979 waarbij de
    Franse Republiek wordt gemachtigd zakdoeken van katoenen weefsels met een waarde
    van niet meer dan 15 ERE/kg, nettogewicht, van post 61.05 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 61.05-30, 99) (categorie 19), van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
