title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2058/87 of 13 July 1987 re-establishing
    the levying of customs duties on chromium oxides and hydroxides, falling within
    heading No 28.21, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2058/87 de la Commission du 13 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux oxydes et
    hydroxydes de chrome de la position 28.21 du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2058/87 der Kommission vom 13. Juli 1987 zur Wiedereinführung
    der Erhebung der Zölle für Chromoxide und -hydroxide der Tarifnummer 28.21 des
    Gemeinsamen Zolltarifs mit Ursprung in China, dem die in der Verordnung (EWG)
    Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2058/87 af 13. juli 1987 om genindførelse
    af opkrævning af told for oxider og hydroxider af chrom henhørende under pos.
    28.21 i den fælles toldtarif og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2058/87 της Επιτροπής
    της 13ης Ιουλίου 1987 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα οξείδια και υδροξείδια
    χρωμίου της κλάσεως 28.21 του κοινού δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2058/87 della Commissione del 13 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili agli ossidi e idrossidi di cromo,
    della voce 28.21 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2058/87 van de Commissie van 13 juli 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op chroomoxyden
    en chroomhydroxyden van post 28.21 van het gemeenschappelijk douanetarief, van
    oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2058/87 da Comissão de 13 de Julho de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a óxidos e hidróxidos
    de crómio, da posição 28.21 de pauta aduaneira comum originários da China,
    beneficiária das preferências pautais previstas pelo Regulamento (CEE) n.°
    3924/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2058/87 de la Comisión de 13 de julio de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a óxidos
    e hidróxidos de cromo de la partida n° 28.21 del arancel aduanero común, originarios
    de la República Popular China, beneficiario de las preferencias arancelarias
    previstas por el Reglamento (CEE) n° 3924/86 del Consejo
