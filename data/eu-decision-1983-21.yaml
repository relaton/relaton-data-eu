title:
- language: en
  script: Latn
  content: '83/21/EEC: Commission Decision of 13 January 1983 establishing that the
    apparatus described as ''LSI - Pulse Volume Recorder, model PVR-4-C'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/21/CEE: Décision de la Commission du 13 janvier 1983 constatant que
    l''importation de l''appareil dénommé "LSI - Pulse Volume Recorder, model PVR-4-C"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/21/EWG: Entscheidung der Kommission vom 13. Januar 1983, mit der festgestellt
    wird, daß das Gerät ,,LSI- Pulse Volume Recorder, model PVR-4-C" nicht unter
    Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '83/21/EØF: Kommissionens beslutning af 13. januar 1983 om fastslåelse
    af, at indførsel af apparatet "L.S.I. - Pulse Volume Recorder, model PVR-4-C"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
