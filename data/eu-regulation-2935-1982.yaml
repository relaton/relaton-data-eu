    med oprindelse i Den tyske demokratiske Republik og Polen, om afslutning af denne
    procedure og om ophævelse af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2935/82 τής Επιτροπής
