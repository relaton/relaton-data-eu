title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2935/82 of 28 October 1982 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning trichloroethylene
    originating in the German Democratic Republic and Poland, terminating the proceeding
    and repealing provisional anti-dumping duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2935/82 de la Commission, du 28 octobre 1982, portant
    acceptation d' engagements dans le cadre de la procédure anti-"dumping" concernant
    le trichloréthylène originaire de la République démocratique allemande et
    de Pologne, clôture de la procédure, et abrogation des droits anti-"dumping"
    provisoires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2935/82 der Kommission vom 28. Oktober 1982 über
    die Annahme von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend
    Trichloräthylen mit Ursprung in der Deutschen Demokratischen Republik und in
    Polen, über die Einstellung des Verfahrens und die Aufhebung des vorläufigen
    Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2935/82 af 28. oktober 1982 om godtagelse
