    (ES) 2017/1131 nuostatos dėl paprastų, skaidrių ir standartizuotų pakeitimo
    vertybiniais popieriais priemonių ir turtu užtikrintų komercinių vekselių,
    reikalavimų, taikomų pagal atvirkštinio atpirkimo sandorius gaunamam turtui,
