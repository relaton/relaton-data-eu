    del Consiglio per quanto riguarda le cartolarizzazioni e le commercial paper garantite
    da attività (ABCP) semplici, trasparenti e standardizzate (STS), i requisiti
    per le attività ricevute nel quadro di operazioni di acquisto con patto di rivendita
    e le metodologie di valutazione della qualità creditizia
  type: main
- language: lv
  script: Latn
