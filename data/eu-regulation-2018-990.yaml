  script: Latn
  content: Commission Delegated Regulation (EU) 2018/990 of 10 April 2018 amending
    and supplementing Regulation (EU) 2017/1131 of the European Parliament and of
    the Council with regard to simple, transparent and standardised (STS) securitisations
    and asset-backed commercial papers (ABCPs), requirements for assets received as
    part of reverse repurchase agreements and credit quality assessment methodologies
  type: main
- language: fr
  script: Latn
