    en ce qui concerne les titrisations et les papiers commerciaux adossés à des
    actifs (ABCP) simples, transparents et standardisés (STS), les exigences applicables
    aux actifs reçus dans le cadre d'accords de prise en pension et les méthodologies
    d'évaluation de la qualité de crédit
  type: main
