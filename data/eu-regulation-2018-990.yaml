    átlátható és egységesített (STS) értékpapírosítás és eszközfedezetű
    kereskedelmi értékpapírok (ABCP-k), a fordított repomegállapodások részeként
    kapott eszközökre alkalmazandó követelmények és a hitelminőség-értékelés
    módszertanai tekintetében történő módosításáról és kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2018/990 della Commissione, del 10 aprile 2018,
