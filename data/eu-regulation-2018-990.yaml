    uz vienkāršiem, pārredzamiem un standartizētiem (VPS) vērtspapīrošanas
    darījumiem un ar aktīviem balstītiem komerciāliem vērtspapīriem (ABKV),
    prasībām attiecībā uz aktīviem, kas saņemti saistībā ar pirkšanas ar
    atpārdošanu līgumiem, un kredītkvalitātes novērtēšanas metodēm
  type: main
- language: lt
  script: Latn
