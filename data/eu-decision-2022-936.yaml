  content: Council Decision (EU) 2022/936 of 13 June 2022 on the position to be taken
    on behalf of the European Union at the 14th meeting of the Committee of Technical
    Experts of the Intergovernmental Organisation for International Carriage by Rail
    (OTIF) as regards the modification of the uniform technical prescriptions concerning
    telematics applications for freight and the revision of Annex B to the ATMF Uniform
    Rules on derogations, and in the written procedure of the Revision Committee of
    OTIF as regards the modification of the ATMF Uniform Rules
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/936 du Conseil du 13 juin 2022 relative à la position
