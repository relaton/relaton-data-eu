    d’experts techniques de l’Organisation intergouvernementale pour les transports
    internationaux ferroviaires (OTIF) au regard de la modification des prescriptions
    techniques uniformes concernant les applications télématiques au service du
    fret et de la révision de l’annexe B des règles uniformes ATMF relative aux
    dérogations, ainsi que lors de la procédure écrite de la commission de révision
    de l’OTIF en ce qui concerne la modification des règles uniformes ATMF
  type: main
