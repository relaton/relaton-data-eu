  script: Latn
  content: COMMISSION REGULATION (EC) No 3304/93 of 30 November 1993 re-establishing
    the levying of customs duties on products falling within CN code 2921 42 10, originating
    in India, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3304/93 de la Commission du 30 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2921 42 10, originaires d'Inde, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3304/93 DER KOMMISSION vom 30. November 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 2921 42 10 mit Ursprung in
    Indien, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3304/93 af 30. november 1993 om genindførelse
