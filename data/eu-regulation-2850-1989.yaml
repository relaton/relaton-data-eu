  content: Commission Regulation (EEC) No 2850/89 of 22 September 1989 re-establishing
    the levying of customs duties on bed linen, other than knitted or crocheted, products
    of category 20 (order No 40.0200), originating in Thailand to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
