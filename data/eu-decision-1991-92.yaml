title:
- language: en
  script: Latn
  content: '91/92/EEC: Commission Decision of 11 February 1991 amending Decision 86/414/EEC
    as regards the list of establishments in Argentina approved for the purpose of
    importing meat products into the Community'
  type: main
- language: fr
  script: Latn
  content: '91/92/CEE: Décision de la Commission du 11 février 1991 modifiant la
    décision 86/414/CEE en ce qui concerne la liste des établissements d''Argentine
    agréés pour l''importation de produits à base de viande dans la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 11. Februar 1991 zur Änderung der Entscheidung
    86/414/EWG in bezug auf die Liste der Betriebe in Argentinien, aus denen die Einfuhr
    von Fleischerzeugnissen in die Gemeinschaft zugelassen ist (91/92/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 11. februar 1991 om ændring af beslutning
    86/414/EØF for så vidt angår listen over de virksomheder i Argentina, der er
    godkendt til indførsel af kødprodukter til Fællesskabet (91/92/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/92/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Φεβρουαρίου
    1991 που τροποποιεί την απόφαση 86/414/ΕΟΚ όσον
    αφορά τον πίνακα των εγκαταστάσεων της Αργεντινής
    που έχουν εγκριθεί για την εισαγωγή προϊόντων
    με βάση το κρέας στην Κοινότητα'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE dell'' 11 febbraio 1991 che modifica la decisione
    86/414/CEE per quanto riguarda l'' elenco degli stabilimenti dell'' Argentina,
    in provenienza dai quali è autorizzata l'' importazione di prodotti a base di
    carne nella Comunità (91/92/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 11 februari 1991 tot wijziging van Beschikking
    86/414/EEG met betrekking tot de lijst van inrichtingen in Argentinië die erkend
    zijn voor de invoer van vleesprodukten in de Gemeenschap (91/92/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 11 de Fevereiro de 1991 que altera a Decisão
    86/414/CEE no que respeita à lista dos estabelecimentos da Argentina aprovados
    para a importação de produtos à base de carne pela Comunidade (91/92/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 11 de febrero de 1991 por la que se modifica
    la Decisión 86/414/CEE en lo que se refiere a la lista de los establecimientos
    de Argentina autorizados para la importación de productos a base de carne en
    la Comunidad (91/92/CEE) #'
  type: main
