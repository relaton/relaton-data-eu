    jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 1411/96 DA COMISSÃO de 19 de Julho de 1996 que determina
    em que medida pode ser dado seguimento aos pedidos de direitos à importação
    apresentados no mês de Junho de 1996 para os bovinos machos jovens destinados
    à engorda
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 1411/96 DE LA COMISIÓN de 19 de julio de 1996 que
