    presentadas en el mes de junio de 1996 para los machos jóvenes de la especie
    bovina destinados al engorde
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 1411/96 av den 19 juli 1996 om i vilken
