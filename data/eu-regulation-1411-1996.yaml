  script: Latn
  content: COMMISSION REGULATION (EC) No 1411/96 of 19 July 1996 specifying the extent
    to which applications lodged in June 1996 for import rights in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1411/96 DE LA COMMISSION du 19 juillet 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au mois de juin 1996 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1411/96 DER KOMMISSION vom 19. Juli 1996 über das
    Ausmaß, in dem den im Juni 1996 eingereichten Anträgen auf Einfuhrrechte für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1411/96 af 19. juli 1996 om fastsættelse
    af, i hvilket omfang ansøgninger om importrettigheder, som er indsendt i juni
    1996 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1411/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Ιουλίου 1996 για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    δικαίωμα εισαγωγής που υποβλήθηκαν τον Ιούνιο
    1996 για τα νεαρά άρρενα βοοειδή που προορίζονται
    για πάχυνση
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1411/96, annettu 19 päivänä heinäkuuta 1996,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen kesäkuussa 1996 esitettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1411/96 DELLA COMMISSIONE del 19 luglio 1996 che stabilisce
    in quale misura può essere dato seguito alle domande di diritto d'importazione
    presentate nel mese di giugno 1996 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1411/96 VAN DE COMMISSIE van 19 juli 1996 tot bepaling
