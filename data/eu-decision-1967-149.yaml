title:
- language: fr
  script: Latn
  content: Décision 67/149/CEE de la Commission, du 14 février 1967, autorisant
    la République française, en vertu de l'article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire les "fleurs coupées" originaires des pays
    tiers et mises en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '67/149/EWG: Entscheidung der Kommission vom 14. Februar 1967, mit der
    die Französische Republik gemäß Artikel 115 Absatz (1) des Vertrages ermächtigt
    wird, aus dritten Ländern stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche "Schnittblumen" von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/149/CEE: Decisione della Commissione, del 14 febbraio 1967, che autorizza
    la Repubblica francese, ai sensi dell''articolo 115, primo comma del Trattato,
    ad escludere dal trattamento comunitario i «fiori recisi» originari di paesi
    terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/149/EEG: Beschikking van de Commissie van 14 februari 1967 waarbij
    aan de Franse Republiek op grond van artikel 115, eerste alinea, van het Verdrag
    machtiging wordt verleend om afgesneden bloemen, die van oorsprong zijn uit derde
    landen en in andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
