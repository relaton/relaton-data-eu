title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2592/81 of 4 September 1981 re-establishing
    the levying of customs duties on other made up textile articles, woven, excluding
    those of categories 113 and 114, products of category 112 (code 1120), originating
    in Thailand, to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2592/81 de la Commission, du 4 septembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, à l' exception de ceux des catégories 113 et 114,
    de la catégorie de produits n° 112 (code 1120), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues au règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2592/81 der Kommission vom 4. September 1981 über
    die Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben,
    mit Ausnahme derjenigen der Kategorien 113 und 114, der Warenkategorie Nr. 112
    (Kennziffer 1120), mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr.
    3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2592/81 af 4. september 1981 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer, borset
    fra de under kategorierne 113 og 114 henhørende varer under kategori 112 (kode
    1120), som har oprindelse i Thailand og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2592/81 τής Επιτροπής
    τής 4ης Σεπτεμβρίου 1981 περί αποκαταστάσεως
    τής εφαρμογής τελωνειακών δασμών γιά τά έτερα
    είδη έτοιμα εξ υφασμάτων, εξαιρέσει τών ειδών
    τών κατηγοριών 113 καί 114 τών προϊόντων τής κατηγορίας
    112 (κώδικας 1120), καταγωγής Ταϋλάνδης, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2592/81 della Commissione, del 4 settembre 1981, che
    ripristina la riscossione dei dazi doganali applicabili a altri manufatti confezionati
    di tessuti, esclusi quelli delle categorie 113 e 114 della categoria di prodotti
    n. 112 (codice 1120), originari della Tailandia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2592/81 van de Commissie van 4 september 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels, met uitzondering van die van de categorieën 113 en 114,
    van de categorie van produkten nr. 112 (codenummer 1120), van oorsprong uit Thailand
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3320/80 van de Raad
