id: EUDecision1978186
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 18 January 1978 authorizing the French Republic
    not to apply Community treatment to umbrellas and sunshades falling within heading
    No 66.01 of the Common Customs Tariff, originating in Taiwan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/186/CEE: Décision de la Commission, du 18 janvier 1978, autorisant
    la République française à exclure du traitement communautaire les parapluies,
    parasols et ombrelles, de la position 66.01 du Tarif douanier commun, originaires
    de Tai-Wan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Januar 1978, mit der die Französische
    Republik ermächtigt wird, die aus Taiwan stammenden und in den anderen Mitgliedstaaten
    im freien Verkehr befindlichen Regenschirme und Sonnenschirme der Tarifnummer
    66.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 18. januar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage paraplyer og parasoller, som
    henhører under position 66.01 i den fælles toldtarif, har oprindelse i Taiwan
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli ombrelli (da pioggia e da
    sole) della voce 66.01 della tariffa doganale comune, originari di Taiwan e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd paraplu's en parasols, van post 66.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Taiwan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
