title:
- language: fr
  script: Latn
  content: Décision 65/316/CEE de la Commission, du 2 juin 1965, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire les "crevettes simplement cuites à l'eau et décortiquées",
    originaires du Chili et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/316/EWG: Entscheidung der Kommission vom 2. Juni 1965 über den Antrag
    der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages, um aus
    Chile stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    Garnelen, nur in Wasser gekocht, ohne Panzer, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/316/CEE: Decisione della Commissione, del 2 giugno 1965, relativa al
    ricorso della Repubblica francese ai sensi dell''articolo 115, primo comma, del
    Trattato al fine d''escludere dal trattamento comunitario i gamberi semplicemente
    cotti in acqua e docorticati, provenienti dal Cile ed immessi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/316/EEG: Beschikking van de Commissie van 2 juni 1965 betreffende het
    verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea, van
    het Verdrag garnalen, enkel gekookt in water en ontdaan van de schaal, die van
    oorsprong zijn uit Chili en in de andere Lid-Staten in het vrije verkeer zijn
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
