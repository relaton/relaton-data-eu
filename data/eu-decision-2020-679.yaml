    und ihren Mitgliedstaaten andererseits eingesetzten Gemischten CETA-Ausschuss
    zur Annahme eines Beschlusses zu vertreten ist, mit dem das Verfahren für die
    Annahme von Auslegungen gemäß Artikel 8.31 Absatz 3 und Artikel 8.44 Absatz
    3 Buchstabe a CETA als Anhang der Geschäftsordnung des Gemischten CETA-Ausschusses
    festgelegt wird
