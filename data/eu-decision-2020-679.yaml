- language: en
  script: Latn
  content: Council Decision (EU) 2020/679 of 18 May 2020 on the position to be taken
    on behalf of the European Union in the CETA Joint Committee established under
    the Comprehensive Economic and Trade Agreement (CETA) between Canada, of the one
    part, and the European Union and its Member States, of the other part, as regards
    the adoption of a decision on the procedure for the adoption of interpretations
    in accordance with Articles 8.31.3 and 8.44.3(a) of CETA as an Annex to its Rules
    of Procedure
  type: main
- language: fr
  script: Latn
  content: Décision (Ue) 2020/679 du Conseil du 18 mai 2020 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Comité mixte de l’AECG
    établi par l’accord économique et commercial global (AECG) entre le Canada,
    d’une part, et l’Union européenne et ses États membres, d’autre part,
    quant à l’adoption d’une décision concernant la procédure d’adoption
    d’interprétations conformément aux articles 8.31.3 et 8.44.3 a) de l’AECG
    en tant qu’annexe de ses règles de procédure
  type: main
