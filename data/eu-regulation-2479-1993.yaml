    des catégories 14, 20 et 26 (numéros d'ordre 40.0140, 40.0200 et 40.0260), originaires
    de Malaysia, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
