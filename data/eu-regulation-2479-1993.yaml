  content: COMMISSION REGULATION (EEC) No 2479/93 of 7 September 1993 re-establishing
    the levying of customs duties on products of category Nos 14, 20 and 26 (order
    Nos 40.0140, 40.0200 and 40.0260), originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2479/93 de la Commission du 7 septembre 1993 portant
