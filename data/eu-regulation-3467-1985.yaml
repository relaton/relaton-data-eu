title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3467/85 of 9 December 1985 re-establishing
    the levying of the customs duties applicable to ethylene glycol falling within
    subheading 29.04 C ex I, originating in Saudi Arabia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3467/85 de la Commission du 9 décembre 1985 portant
    rétablissement de la perception des droits de douane applicables à l' éthylèneglycol,
    de la sous-position 29.04 C ex I du tarif douanier commun, originaire de l' Arabie
    saoudite, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3467/85 der Kommission vom 9. Dezember 1985 zur Wiedereinführung
    der Erhebung der Zölle für Äthylenglykol der Tarifstelle 29.04 C ex I des Gemeinsamen
    Zolltarifs mit Ursprung in Saudi-Arabien, dem die in der Verordnung (EWG) Nr.
    3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3467/85 af 9. december 1985 om genindførelse
