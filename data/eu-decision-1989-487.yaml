    Richtlinie 77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten
    über die Umsatzsteuern abweichende Sondermaßnahme zu treffen'
  type: main
- language: da
  script: Latn
  content: '89/487/EØF: Rådets Beslutning af 28. juli 1989 om bemyndigelse til Den
