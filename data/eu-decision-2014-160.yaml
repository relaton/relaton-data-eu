---
id: EUDecision2014160
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/160/EU: Commission Implementing Decision of 20 March 2014 repealing
    lists of third country establishments from which Member States authorise imports
    of certain products of animal origin adopted on the basis of Council Decision
    95/408/EC (notified under document C(2014) 1742)'
  type: main
- language: fr
  script: Latn
  content: '2014/160/UE: Décision d’exécution de la Commission du 20 mars 2014
    abrogeant les listes des établissements de pays tiers en provenance desquels
    les États membres autorisent les importations de certains produits d’origine
    animale, adoptées sur la base de la décision 95/408/CE du Conseil [notifiée
    sous le numéro C(2014) 1742]'
  type: main
- language: de
  script: Latn
  content: '2014/160/EU: Durchführungsbeschluss der Kommission vom 20. März 2014
    zur Aufhebung von auf der Grundlage der Entscheidung 95/408/EG des Rates angenommenen
    Listen der Drittlandbetriebe, aus denen die Mitgliedstaaten bestimmte tierische
    Erzeugnisse einführen dürfen (Bekanntgegeben unter Aktenzeichen C(2014) 1742)'
  type: main
- language: bg
  script: Cyrl
  content: '2014/160/ЕС: Решение за изпълнение на Комисията
    от 20 март 2014 година за отмяна на списъци на
    предприятия в трети страни, от които държавите
    членки разрешават внос на определени продукти
    от животински произход, приети въз основа на
    Решение 95/408/ЕО на Съвета (нотифицирано под
    номер C(2014) 1742)'
  type: main
- language: cs
  script: Latn
  content: '2014/160/EU: Prováděcí rozhodnutí Komise ze dne 20. března 2014 ,
    kterým se zrušují seznamy zařízení třetích zemí, ze kterých členské
    státy povolují dovoz určitých produktů živočišného původu, přijaté
    na základě rozhodnutí Rady 95/408/ES (oznámeno pod číslem C(2014) 1742)'
  type: main
- language: da
  script: Latn
  content: '2014/160/EU: Kommissionens gennemførelsesafgørelse af 20. marts 2014
    om ophævelse af lister over tredjelandsvirksomheder, hvorfra medlemsstaterne
    tillader indførsel af visse animalske produkter, som er vedtaget på grundlag
    af Rådets beslutning 95/408/EF (meddelt under nummer C(2014) 1742)'
  type: main
- language: el
  script: Grek
  content: '2014/160/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 20ής Μαρτίου 2014 , για την κατάργηση των καταλόγων
    εγκαταστάσεων τρίτων χωρών από τις οποίες
    τα κράτη μέλη επιτρέπουν τις εισαγωγές ορισμένων
    προϊόντων ζωικής προέλευσης που θεσπίζονται
    με βάση την απόφαση 95/408/ΕΚ του Συμβουλίου [κοινοποιηθείσα
    υπό τον αριθμό C(2014) 1742]'
  type: main
- language: et
  script: Latn
  content: '2014/160/EL: Komisjoni rakendusotsus, 20. märts 2014 , millega tunnistatakse
    kehtetuks nõukogu otsuse 95/408/EÜ alusel vastuvõetud loetelud kolmandate riikide
    ettevõtjate kohta, kellelt liikmesriigid lubavad importida teatavaid loomset
    päritolu tooteid (teatavaks tehtud numbri C(2014) 1742 all)'
  type: main
- language: fi
  script: Latn
  content: '2014/160/EU: Komission täytäntöönpanopäätös, annettu 20 päivänä
    maaliskuuta 2014 , neuvoston päätöksen 95/408/EY perusteella hyväksyttyjen
    sellaisia kolmansien maiden laitoksia koskevien luetteloiden kumoamisesta, joista
    jäsenvaltiot sallivat tiettyjen eläinperäisten tuotteiden tuonnin (tiedoksiannettu
    numerolla C(2014) 1742)'
  type: main
- language: hr
  script: Latn
  content: '2014/160/EU: Provedbena odluka Komisije оd 20. ožujka 2014. o stavljanju
    izvan snage popisa objekata u trećim zemljama iz kojih države članice odobravaju
    uvoz određenih proizvoda životinjskog podrijetla koji su doneseni na temelju
    Odluke Vijeća 95/408/EZ (priopćeno pod brojem dokumenta C(2014) 1742)'
  type: main
- language: hu
  script: Latn
  content: '2014/160/EU: A Bizottság végrehajtási határozata ( 2014. március
    20. ) a 95/408/EK tanácsi határozat alapján elfogadott, a tagállamok által
    egyes állati eredetű termékek behozatalára feljogosított harmadik országbeli
    létesítmények jegyzékeinek hatályon kívül helyezéséről (az értesítés
    a C(2014) 1742. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2014/160/UE: Decisione di esecuzione della Commissione, del 20 marzo 2014
    , che abroga gli elenchi degli stabilimenti di paesi terzi dai quali gli Stati
    membri autorizzano l’importazione di determinati prodotti di origine animale,
    adottati in base alla decisione 95/408/CE del Consiglio [notificata con il numero
    C(2014) 1742]'
  type: main
- language: lv
  script: Latn
  content: '2014/160/ES: Komisijas Īstenošanas lēmums ( 2014. gada 20. marts ),
    ar kuru atceļ uz Padomes Lēmuma 95/408/EK pamata pieņemtos sarakstus ar trešo
    valstu uzņēmumiem, no kuriem dalībvalstis atļauj importēt noteiktus dzīvnieku
    izcelsmes produktus (izziņots ar dokumenta numuru C(2014) 1742)'
  type: main
- language: lt
  script: Latn
  content: '2014/160/ES: 2014 m. kovo 20 d. Komisijos įgyvendinimo sprendimas, kuriuo
    panaikinami trečiųjų šalių įmonių, iš kurių valstybės narės leidžia
    importuoti tam tikrus gyvūninės kilmės produktus, sąrašai, priimti remiantis
    Tarybos sprendimu 95/408/EB (pranešta dokumentu Nr. C(2014) 1742)'
  type: main
- language: mt
  script: Latn
  content: '2014/160/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tal- 20
    ta’ Marzu 2014 li tħassar listi ta’ stabbilimenti f’pajjiżi terzi li minnhom
    l-Istati Membri jawtorizzaw l-importazzjonijiet ta’ ċerti prodotti ta’ oriġini
    tal-annimali adottati abbażi tad-Deċiżjoni tal-Kunsill 95/408/KE (notifikata
    bid-dokument C(2014) 1742)'
  type: main
- language: nl
  script: Latn
  content: '2014/160/EU: Uitvoeringsbesluit van de Commissie van 20 maart 2014 tot
    intrekking van op grond van Beschikking 95/408/EG van de Raad goedgekeurde lijsten
    van inrichtingen in derde landen waaruit de lidstaten de invoer van bepaalde producten
    van dierlijke oorsprong toestaan (Kennisgeving geschied onder nummer C(2014) 1742)'
  type: main
- language: pl
  script: Latn
  content: '2014/160/UE: Decyzja wykonawcza Komisji z dnia 20 marca 2014 r. uchylająca
    wykazy zakładów w państwach trzecich, z których państwa członkowskie zezwalają
    na przywóz określonych produktów pochodzenia zwierzęcego, przyjęte na podstawie
    decyzji Rady 95/408/WE (notyfikowana jako dokument nr C(2014) 1742)'
  type: main
- language: pt
  script: Latn
  content: '2014/160/UE: Decisão de Execução da Comissão, de 20 de março de 2014
    , que revoga as listas de estabelecimentos de países terceiros dos quais os Estados-Membros
    autorizam a importação de determinados produtos de origem animal adotadas com
    base na Decisão 95/408/CE do Conselho [notificada com o número C(2014) 1742]'
  type: main
- language: ro
  script: Latn
  content: '2014/160/UE: Decizia de punere în aplicare a Comisiei din 20 martie 2014
    de abrogare a listelor unităților din țările terțe din care statele membre
    autorizează importurile de anumite produse de origine animală, adoptate pe baza
    Deciziei 95/408/CE a Consiliului [notificată cu numărul C(2014) 1742]'
  type: main
- language: sk
  script: Latn
  content: '2014/160/EÚ: Vykonávacie rozhodnutie Komisie z 20. marca 2014 , ktorým
    sa zrušujú zoznamy podnikov tretích krajín, z ktorých sú členské štáty
    oprávnené dovážať niektoré produkty živočíšneho pôvodu, prijaté na
    základe rozhodnutie Rady 95/408/ES [oznámené pod číslom C(2014) 1742]'
  type: main
- language: sl
  script: Latn
  content: '2014/160/EU: Izvedbeni sklep Komisije z dne 20. marca 2014 o razveljavitvi
    seznamov obratov v tretjih državah, iz katerih države članice dovolijo uvoz
    nekaterih proizvodov živalskega izvora, ki so bili sprejeti na podlagi Odločbe
    Sveta 95/408/ES (notificirano pod dokumentarno številko C(2014) 1742)'
  type: main
- language: es
  script: Latn
  content: '2014/160/UE: Decisión de Ejecución de la Comisión, de 20 de marzo de
    2014 , por la que se derogan las listas de establecimientos de terceros países
    desde los cuales los Estados miembros autorizan la importación de determinados
    productos de origen animal, adoptadas sobre la base de la Decisión 95/408/CE
    del Consejo [notificada con el número C(2014) 1742]'
  type: main
- language: sv
  script: Latn
  content: '2014/160/EU: Kommissionens genomförandebeslut av den 20 mars 2014 om
    upphävande av de förteckningar över anläggningar i tredjeland från vilka
    medlemsstaterna tillåter import av vissa produkter av animaliskt ursprung som
    antagits på grundval av rådets beslut 95/408/EG [delgivet med nr C(2014) 1742]'
  type: main
