  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Berechnungsgrundlage für die beschleunigte
    Angleichung an den Gemeinsamen Zolltarif am 1. Januar 1961 für Kakaomasse, auch
    entfettet (Tarifnr. 18.03), und Kakaopulver, nicht gezuckert (Tarifnr. 18.05)
  type: main
- language: it
  script: Latn
