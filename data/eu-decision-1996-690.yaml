title:
- language: en
  script: Latn
  content: '96/690/EC: Commission Decision of 26 November 1996 amending the information
    contained in the list in the Annex to Regulation (EEC) No 55/87 establishing the
    list of vessels exceeding eight metres length overall permitted to use beam trawls
    within certain coastal areas of the Community'
  type: main
- language: fr
  script: Latn
  content: '96/690/CE: Décision de la Commission du 26 novembre 1996 modifiant certaines
    informations sur la liste figurant à l''annexe du règlement (CEE) nº 55/87
    établissant la liste des bateaux dont la longueur hors tout dépasse huit mètres
    autorisés à pêcher à l''aide de chaluts à perches dans certaines zones côtières
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '96/690/EG: Entscheidung der Kommission vom 26. November 1996 zur Änderung
