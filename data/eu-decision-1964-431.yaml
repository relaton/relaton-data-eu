title:
- language: fr
  script: Latn
  content: Décision 64/431/CEE du Conseil du 16 juillet 1964, autorisant la République
    italienne à suspendre à l'égard des pays tiers, les droits applicables aux
    animaux vivants de l'espèce bovine, des espèces domestiques, autres, d'un poids
    unitaire n'excédant pas 340 kilogrammes, de la position Ex 01.02 A II
  type: main
- language: de
  script: Latn
  content: '64/431/EWG: Entscheidung des Rates vom 16. Juli 1964 zur Ermächtigung
    der Italienischen Republik, ihre Zollsätze auf Rinder, lebend, Hausrinder, andere,
    mit einem Stückgewicht von höchstens 340 kg, der Tarifnummer ex 01.02 A II,
    gegenüber Drittländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '64/431/CEE: Decisione del Consiglio, del 16 luglio 1964, che autorizza
    la Repubblica italiana a sospendere, nei confronti dei paesi terzi, i dazi applicabili
    agli animali vivi della specie bovina, delle specie domestiche, altri, del peso
    unitario non superiore a 340 chilogrammi, della voce ex 01.02 A II'
  type: main
- language: nl
  script: Latn
  content: '64/431/EEG: Beschikking van de Raad van 16 juli 1964 tot machtiging van
    de Italiaanse Republiek om haar rechten op levende runderen, huisdieren, andere,
    die per stuk niet meer wegen dan 340 kilogram, van post ex 01.02 A II, ten aanzien
    van derde landen te schorsen'
  type: main
