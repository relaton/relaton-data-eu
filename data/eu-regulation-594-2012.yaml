    A, PCB-a koji nisu slični dioksinu i melamina u hrani
  type: main
- language: hu
  script: Latn
  content: A Bizottság 594/2012/EU rendelete ( 2012. július 5. ) az 1881/2006/EK
    rendeletnek az élelmiszerekben előforduló ochratoxin-A, nem dioxinszerű PCB-k
