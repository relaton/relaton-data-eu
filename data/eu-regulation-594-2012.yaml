    Nr. 1881/2006
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 594/2012 tal- 5 ta’ Lulju 2012 li
    jemenda r-Regolament (KE) 1881/2006 fir-rigward tal-livelli massimi tal-kontaminanti
    okratossina A, PCBs li ma jixbħux lid-dijossini u l-melamina fl-oġġetti tal-ikel
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 594/2012 van de Commissie van 5 juli 2012 tot wijziging
    van Verordening (EG) nr. 1881/2006 wat de maximumgehalten aan de verontreinigingen
    ochratoxine A, niet-dioxineachtige pcb’s en melamine in levensmiddelen betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 594/2012 z dnia 5 lipca 2012 r. zmieniające
    rozporządzenie (WE) nr 1881/2006 w odniesieniu do najwyższych dopuszczalnych
    zanieczyszczeń ochratoksyną A, polichlorowanymi bifenylami o działaniu niepodobnym
    do dioksyn i melaminą w środkach spożywczych
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 594/2012 da Comissão, de 5 de julho de 2012 , que
    altera o Regulamento (CE) n. ° 1881/2006 no que se refere aos teores máximos
    dos contaminantes ocratoxina A, PCB não semelhantes a dioxinas e melamina nos
    géneros alimentícios
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 594/2012 al Comisiei din 5 iulie 2012 de modificare
    a Regulamentului (CE) 1881/2006 în ceea ce privește nivelurile maxime ale contaminanților
    ochratoxină A, PCB care nu sunt de tipul dioxinei și melamină din produsele
    alimentare
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 594/2012 z 5. júla 2012 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1881/2006, pokiaľ ide o maximálne hodnoty obsahu
    kontaminantov ochratoxínu A, PCB nepodobných dioxínom a melamínu v potravinách
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 594/2012 z dne 5. julija 2012 o spremembi Uredbe
    (ES) št. 1881/2006 v zvezi z mejnimi vrednostmi onesnaževal ohratoksina A, dioksinom
    nepodobnih PCB in melamina v živilih
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 594/2012 de la Comisión, de 5 de julio de 2012 ,
    por el que se modifica el Reglamento (CE) n ° 1881/2006 de la Comisión, por
    el que se fija el contenido máximo de determinados contaminantes en los productos
    alimenticios, en lo concerniente a los contenidos máximos de los contaminantes
    ocratoxina A, PCBs no similares a las dioxinas y melamina en los productos alimenticios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 594/2012 av den 5 juli 2012 om ändring
