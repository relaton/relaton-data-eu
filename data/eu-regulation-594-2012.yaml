    látek ochratoxinu A, PCB bez dioxinového efektu a melaminu v potravinách
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 594/2012 af 5. juli 2012 om ændring
    af forordning (EF) nr. 1881/2006 for så vidt angår grænseværdierne for de
    forurenende stoffer ochratoksin A, ikke-dioxinlignende PCB'er og melamin i fødevarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 594/2012 της Επιτροπής,
