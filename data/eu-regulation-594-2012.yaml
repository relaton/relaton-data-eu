title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 594/2012 of 5 July 2012 amending Regulation
    (EC) 1881/2006 as regards the maximum levels of the contaminants ochratoxin A,
    non dioxin-like PCBs and melamine in foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 594/2012 de la Commission du 5 juillet 2012 modifiant
    le règlement (CE) n ° 1881/2006 en ce qui concerne les teneurs maximales en
    ochratoxine A, en PCB non coplanaires et en mélamine dans les denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 594/2012 der Kommission vom 5. Juli 2012 zur Änderung
    der Verordnung (EG) Nr. 1881/2006 hinsichtlich der Höchstgehalte für die Kontaminanten
    Ochratoxin A, nicht dioxinähnliche PCB und Melamin in Lebensmitteln
  type: main
