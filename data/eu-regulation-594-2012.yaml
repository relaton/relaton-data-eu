    dei contaminanti ocratossina A, PCB non diossina-simili e melamina nei prodotti
    alimentari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 594/2012 ( 2012. gada 5. jūlijs ), ar kuru groza
