title:
- language: en
  script: Latn
  content: Council Directive 93/16/EEC of 5 April 1993 to facilitate the free movement
    of doctors and the mutual recognition of their diplomas, certificates and other
    evidence of formal qualifications
  type: main
- language: fr
  script: Latn
  content: Directive 93/16/CEE du Conseil, du 5 avril 1993, visant à faciliter la
    libre circulation des médecins et la reconnaissance mutuelle de leurs diplômes,
    certificats et autres titres
  type: main
- language: de
  script: Latn
  content: Richtlinie 93/16/EWG des Rates vom 5. April 1993 zur Erleichterung der
    Freizügigkeit für Ärzte und zur gegenseitigen Anerkennung ihrer Diplome, Prüfungszeugnisse
    und sonstigen Befähigungsnachweise
  type: main
- language: bg
  script: Cyrl
  content: Директива 93/16/ЕИО на Съвета от 5 април 1993
