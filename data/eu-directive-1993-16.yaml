    o dosažené kvalifikaci
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 93/16/EØF af 5. april 1993 om fremme af den frie bevægelighed
    for læger og gensidig anerkendelse af deres eksamensbeviser, certifikater og
    andre kvalifikationsbeviser
  type: main
- language: el
  script: Grek
  content: Οδηγία 93/16/ΕΟΚ του Συμβουλίου της 5ης Απριλίου
    1993 για τη διευκόλυνση της ελεύθερης κυκλοφορίας
    των ιατρών και της αμοιβαίας αναγνώρισης των
    διπλωμάτων, πιστοποιητικών και άλλων τίτλων
    τους
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 93/16/EMÜ, 5. aprill 1993, arstide vaba liikumise hõlbustamise
