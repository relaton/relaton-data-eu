title:
- language: en
  script: Latn
  content: Commission Decision of 21 November 1975 on the granting by the Guidance
    Section of the EAGGF to the United Kingdom of a payment on account in respect
    of expenditure incurred during 1974 on annuities relating to measures to encourage
    the cessation of farming and the reallocation of utilized agricultural area for
    the purposes of structural improvement
  type: main
- language: fr
  script: Latn
  content: '75/744/CEE: Décision de la Commission, du 21 novembre 1975, relative
    au versement par le FEOGA, section orientation, au Royaume-Uni d''un acompte sur
    les dépenses effectuées pendant l''année 1974 pour les indemnités relatives
    à l''encouragement à la cessation de l''activité agricole et à l''affectation
    de la superficie agricole utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. November 1975 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr 1974 zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. november 1975 om udbetaling gennem EUGFL,
    udviklingssektionen, til Det forenede Kongerige af et á contobeløb for de udgifter,
    som er afholdt i løbet af året 1974 til godtgørelser vedrørende støtte til
    ophør af landbrugsvirksomhed og til udnyttelse af udnyttet landbrugsareal til
    strukturforbedringsformål
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 novembre 1975, relativa al versamento
    da parte del FEAOG, sezione orientamento, al Regno Unito di un anticipo sulle
    spese effettuate durante il 1974 per le indennità concernenti l'incoraggiamento
    alla cessazione dell'attività agricola e alla destinazione della superficie agricola
    utilizzata a scopi di miglioramento delle strutture
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 november 1975 inzake de betaling door
    het E.O.G.F.L., afdeling Oriëntatie, aan het Verenigd Koninkrijk van een voorschot
    voor de gedurende het jaar 1974 gedane uitgaven voor de uitkeringen met betrekking
    tot de bevordering van de bedrijfsbeëindiging in de landbouw en van de aanwending
    van cultuurgrond tot verbetering van de structuur
  type: main
