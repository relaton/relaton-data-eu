    indicativi ed una sorveglianza comunitaria per le importazioni di taluni prodotti
    originari dell'Austria, della Finlandia, della Norvegia e della Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1049/76 van de Raad van 4 mei 1976 houdende wijziging
    van de Verordeningen (EEG) nrs. 87/76, 88/76, 90/76 en 92/76 betreffende vaststelling
    van indicatieve maxima en instelling van een communautair toezicht op de invoer
    van bepaalde produkten van oorsprong uit Oostenrijk, Finland, Noorwegen en Zweden
