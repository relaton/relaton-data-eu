  content: Council Regulation (EEC) No 1049/76 of 4 May 1976 amending Regulations
    (EEC) No 87/76, (EEC) No 88/76, (EEC) No 90/76 and (EEC) No 92/76 establishing
    indicative ceilings and Community supervision for imports of certain products
    originating in Austria, Finland, Norway and Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1049/76 du Conseil, du 4 mai 1976, modifiant les règlements
    (CEE) n° 87/76, n 88/76, n 90/76 et n° 92/76 portant établissement de plafonds
    indicatifs et d'une surveillance communautaire à l'égard des importations de
    certains produits originaires d'Autriche, de Finlande, de Norvège et de Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1049/76 des Rates vom 4. Mai 1976 zur Änderung der
    Verordnungen (EWG) Nrn. 87/76, 88/76, 90/76 und 92/76 zur Festsetzung von Richtplafonds
    und zur Einrichtung einer gemeinschaftlichen Überwachung der Einfuhren bestimmter
    Waren mit Ursprung in Österreich, Finnland, Norwegen und Schweden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1049/76 af 4. maj 1976 om ændring af forordning
