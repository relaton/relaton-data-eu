title:
- language: en
  script: Latn
  content: '87/400/EEC: Council Decision of 23 July 1987 authorizing the United Kingdom
    to apply an optional measure derogating from Article 17 of the Sixth Directive
    (77/388/EEC) on the harmonization of the laws of the Member States relating to
    turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '87/400/CEE: Décision du Conseil du 23 juillet 1987 autorisant le Royaume-Uni
    à appliquer une mesure facultative dérogatoire à l'' article 17 de la sixième
    directive (77/388/CEE) en matière d'' harmonisation des législations des États
    membres relatives aux taxes sur le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '87/400/EWG: Entscheidung des Rates vom 23. Juli 1987 zur Ermächtigung
    des Vereinigten Königreichs, eine fakultative abweichende Maßnahme zu Artikel
    17 der sechsten Richtlinie (77/388/EWG) vom 17. Mai 1977 zur Harmonisierung der
    Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern anzuwenden'
  type: main
- language: da
  script: Latn
  content: '87/400/EØF: Rådets beslutning af 23. juli 1987 om bemyndigelse af Det
    Forenede Kongerige til at anvende en fakultativ foranstaltning, der fraviger bestemmelserne
    i artikel 17 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '87/400/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Ιουλίου 1987 για την εξουσιοδότηση του Ηνωμένου
    Βασιλείου να εφαρμόσει ένα προαιρετικό μέτρο
    παρέκκλισης από το άρθρο 17 της έκτης οδηγίας
    (77/388/ΕΟΚ) για την εναρμόνιση των νομοθεσιών
    των κρατών μελών, των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '87/400/CEE: Decisione del Consiglio del 23 luglio 1987 che autorizza il
    Regno Unito ad applicare una misura facoltativa di deroga all'' articolo 17 della
    sesta direttiva (77/388/CEE) in materia di armonizzazione delle legislazioni degli
    Stati membri relative alle imposte sulla cifra di affari'
  type: main
- language: nl
  script: Latn
  content: '87/400/EEG: Beschikking van de Raad van 23 juli 1987 waarbij het Verenigd
    Koninkrijk wordt gemachtigd om een facultatieve maatregel toe te passen die afwijkt
    van artikel 17 van de Zesde Richtlijn (77/388/EEG) betreffende de harmonisatie
    van de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
