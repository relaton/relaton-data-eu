title:
- language: en
  script: Latn
  content: '2012/203/EU: Commission Implementing Decision of 19 April 2012 amending
    Annex I to Decision 2006/766/EC as regards the entry for Chile in the list of
    third countries from which imports of live, chilled, frozen or processed bivalve
    molluscs, echinoderms, tunicates and marine gastropods for human consumption are
    permitted (notified under document C(2012) 2446)'
  type: main
- language: fr
  script: Latn
  content: '2012/203/UE: Décision d’exécution de la Commission du 19 avril 2012
    modifiant l’annexe I de la décision 2006/766/CE en ce qui concerne l’entrée
    relative au Chili sur la liste des pays tiers en provenance desquels l’importation
    de mollusques bivalves, d’échinodermes, de tuniciers et de gastéropodes marins
    destinés à l’alimentation humaine, qu’ils soient vivants, réfrigérés,
    congelés ou transformés, est autorisée [notifiée sous le numéro C(2012) 2446]'
  type: main
- language: de
  script: Latn
  content: '2012/203/EU: Durchführungsbeschluss der Kommission vom 19. April 2012
    zur Änderung des Anhangs I der Entscheidung 2006/766/EG in Bezug auf den Eintrag
    für Chile in der Liste der Drittländer, aus denen die Einfuhr von lebenden,
    gekühlten, tiefgefrorenen oder verarbeiteten Muscheln, Stachelhäutern, Manteltieren
    und Meeresschnecken zum menschlichen Verzehr zulässig ist (Bekanntgegeben unter
    Aktenzeichen C(2012) 2446)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/203/ЕС: Решение за изпълнение на Комисията
