    за Чили в списъка с трети страни, от които е
    разрешен вносът на живи, охладени, замразени
    или преработени двучерупчести мекотели, бодлокожи,
    ципести и морски коремоноги, предназначени
    за консумация от човека (нотифицирано под номер
    C(2012) 2446)'
  type: main
- language: cs
  script: Latn
