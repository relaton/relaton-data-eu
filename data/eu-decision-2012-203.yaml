    se Chile v seznamu třetích zemí, ze kterých je povolen dovoz živých, chlazených,
    zmrazených nebo zpracovaných mlžů, ostnokožců, pláštěnců a mořských
    plžů určených k lidské spotřebě (oznámeno pod číslem C(2012) 2446)'
  type: main
