type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2143/74 of the Commission of 13 August 1974 re-establishing
    the levying of customs duties on handkerchiefs, of fabrics other than cotton,
    falling within subheading ex 61.05, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3503/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2143/74 de la Commission, du 13 août 1974, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, en tissus autres que de coton, de la position tarifaire EX 61.05,
    originaires de l'Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3503/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2143/74 der Kommission vom 13. August 1974 über die
    Wiedereinführung des Zollsatzes für Taschentücher und Ziertaschentücher, aus
    anderen Geweben als Baumwolle, der Tarifstelle ex 61.05, mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3503/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2143/74 af 13. august 1974 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, andre varer end bomuldsvarer,
    under position ex 61.05, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2143/74 della Commissione, del 13 agosto 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai fazzoletti da naso
    e da taschino, in tessuti non di cotone, della voce doganale n. ex 61.05 originari
    dell'India beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2143/74 van de Commissie van 13 augustus 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op zakdoeken,
    van andere weefsels dan van katoen, van onderverdeling ex 61.05, van oorsprong
    uit India, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3503/73 van de Raad van 18 december 1973
  type: main
