    1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3548/73 della Commissione, del 21 dicembre 1973, recante
    modifica del regolamento (CEE) n. 2805/73 che stabilisce l' elenco dei vini bianchi
    di qualità prodotti in regioni determinate e dei vini bianchi di qualità importanti
    aventi un tenore particolare di anidride solforosa, nonché alcune disposizioni
    transitorie relative al tenore di anidride solforosa dei vini prodotti anteriormente
    al 1° ottobre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3548/73 van de Commissie van 21 december 1973 tot
    wijziging van Verordening (EEG) nr. 2805/73 houdende vaststelling van de lijst
    van in bepaalde gebieden voortgebrachte witte kwaliteitswijnen en ingevoerde witte
    kwaliteitswijnen met een bijzonder gehalte aan zwaveldioxyde, en houdende overgangsbepalingen
    betreffende het gehalte aan zwaveldioxyde in vÄoÄor 1 oktober 1973 voortgebrachte
    wijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3548/73 da Comissão, de 21 de Dezembro de 1973,
    que altera o Regulamento (CEE) n.° 2805/73 que estabelece a lista de vinhos brancos
    de qualidade produzidos em regiões determinadas e de vinhos brancos de qualidade
    importados com um teor em anidrido sulfuroso especial e que contêm certas disposições
    transitórias que dizem respeito ao teor em anidrido sulfuroso dos vinhos produzidos
    antes de 1 de Outubro de 1973
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3548/73 de la Comisión, de 21 de diciembre de 1973,
    por el que se modifica el Reglamento (CEE) n° 2805/73 por el que se establece
    la lista de los vinos blancos de calidad producidos en regiones determinadas y
    de los vinos blancos de calidad importados, con un contenido particular en anhídrido
    sulfuroso, y sobre determinadas disposiciones transitorias relativas al contenido
    en anhídrido sulfuroso de los vinos producidos antes de 1 octubre de 1973
