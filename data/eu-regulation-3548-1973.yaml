title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3548/73 of the Commission of 21 December 1973 amending
    Regulation (EEC) No 2805/73 determining a list of white quality wines produced
    in specified regions and of imported white quality wines containing a certain
    percentage of sulphur dioxide and laying down certain transitional provisions
    relating to the percentage of sulphur dioxide in wines produced before 1 October
    1973
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3548/73 de la Commission, du 21 décembre 1973, modifiant
    le règlement (CEE) n° 2805/73 établissant la liste des vins blancs de qualité
    produits dans des régions déterminées et des vins blancs de qualité importés
    ayant une teneur en anhydride sulfureux particulière et portant certaines dispositions
    transitoires concernant la teneur en anhydride sulfureux des vins produits avant
    le 1er octobre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3548/73 der Kommission vom 21. Dezember 1973 zur Änderung
    der Verordnung (EWG) Nr. 2805/73 zur Aufstellung des Verzeichnisses der in bestimmten
    Anbaugebieten erzeugten weißen Qualitätsweine und der eingeführten weißen
    Qualitätsweine mit einem außergewöhnlichen Schwefeldioxidgehalt sowie zur Festlegung
    bestimmter Übergangsmaßnahmen für den Schwefeldioxidgehalt bei vor dem 1. Oktober
    1973 erzeugten Weinen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3548/73 af 21. december 1973 om ændring
    af forordning (EØF) nr. 2805/73 om opstilling af en liste over hvide kvalitetsvine
    for bestemte dyrkningsområder og indførte hvide kvalitetsvine, som har et særligt
    svovldioxydindhold, og om visse overgangsbestemmelser vedrørende svovldioxydindholdet
    i vin, som er produceret inden 1. oktober 1973
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3548/73 της Επιτροπής
    της 21ης Δεκεμβρίου 1973 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2805/73 περί καταρτίσεως
    του πίνακα λευκών οίνων ποιότητος παραγομένων
    εντός καθορισμένων περιοχών και εισαγομένων
    λευκών οίνων ποιότητος που έχουν διακριτκή
