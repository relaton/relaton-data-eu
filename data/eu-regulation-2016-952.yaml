  script: Latn
  content: Commission Implementing Regulation (EU) 2016/952 of 15 June 2016 approving
    the low-risk active substance Saccharomyces cerevisiae strain LAS02 in accordance
    with Regulation (EC) No 1107/2009 of the European Parliament and of the Council
    concerning the placing of plant protection products on the market, and amending
    the Annex to Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/952 de la Commission du 15 juin 2016
