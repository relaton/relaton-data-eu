title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 719/79 of 9 April 1979 re-establishing the
    levying of customs duties on other sheep and lamb skin leather, other, falling
    within subheading 41.03 B II, originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 719/79 de la Commission, du 9 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d' ovins, non dénommées, de la sous-position tarifaire 41.03 B II, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 719/79 der Kommission vom 9. April 1979 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 719/79 af 9. april 1979 om genindførelse
    af opkrævning af toldafgifter for læder af fåre- og lammeskind, andre varer,
    under underposition 41.03 B II, som har oprindelse i Indien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 719/79 della Commissione, del 9 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli ovine non nominate,
    della sottovoce 41.03 B II, originarie dell' India beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 719/79 van de Commissie van 9 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander schapeleder,
    overige, van post 41.03 B II, van oorsprong uit India, ten behoeve waarvan bij
    Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
