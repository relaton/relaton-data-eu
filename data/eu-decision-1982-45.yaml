    Benelux countries, the Federal Republic of Germany, Greece, Italy and the United
    Kingdom in respect of China regarding various industrial products'
  type: main
- language: fr
  script: Latn
  content: '82/45/CEE: Décision de la Commission, du 14 janvier 1982, modifiant le
    régime d''importation prévu par la décision 81/248/CEE de la Commission et
    appliqué au Benelux, en République fédérale d''Allemagne, en Grèce, en Italie
    et au Royaume-Uni, à l''égard de la Chine en ce qui concerne divers produits
    industriels'
  type: main
