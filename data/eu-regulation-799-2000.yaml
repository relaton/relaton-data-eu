id: EURegulation7992000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 799/2000 of 17 April 2000 terminating the
    investigation concerning the alleged circumvention of anti-dumping measures imposed
    by Council Regulation (EEC) No 2861/93 on imports of certain magnetic disks (3,5&quot;
    microdisks) originating in Taiwan and the People's Republic of China by assembly
    operations in the Community, and discontinuing the registration of imports of
    microdisk parts introduced by Regulation (EC) No 1646/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 799/2000 de la Commission, du 17 avril 2000, clôturant
    l'enquête portant sur le contournement présumé des mesures antidumping instituées
    par le règlement (CE) nº 2861/93 du Conseil sur les importations de certains
    disques magnétiques (microdisques de 3,5 pouces) originaires de Taïwan et de
    la République populaire de Chine par des opérations d'assemblage dans la Communauté
    et terminant l'enregistrement des importations des pièces de microdisques instauré
    par le règlement (CE) nº 1646/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 799/2000 der Kommission vom 17. April 2000 zur Einstellung
    der Untersuchung betreffend die angebliche Umgehung der mit der Verordnung (EG)
    Nr. 2861/93 des Rates eingeführten Antidumpingzölle auf die Einfuhren bestimmter
    Magnetplatten (3,5"-Mikroplatten) mit Ursprung in Taiwan und der Volksrepublik
    China durch Montagevorgänge in der Gemeinschaft und zur Beendigung der gemäß
    Verordnung (EG) Nr. 1646/1999 der Kommission eingeführten zollamtlichen Erfassung
    der Einfuhren von Teilen dieser Mikroplatten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 799/2000 af 17. april 2000 om afslutning
    af undersøgelsen vedrørende angivelig omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EØF) nr. 2861/93 på importen af visse
    magnetplader (3,5" disketter) med oprindelse i Taiwan og Folkerepublikken Kina,
    ved samleprocesser i Fællesskabet og om ophævelse af registreringen af importen
    af dele til mikrodisketter, der indførtes ved forordning (EF) nr. 1646/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 799/2000 της Επιτροπής,
    της 17ης Απριλίου 2000, για την περάτωση της έρευνας
    αναφορικά με την κατά τους ισχυρισμούς, καταστρατήγηση
    των μέτρων αντιντάμπινγκ που επεβλήθησαν με
    τον κανονισμό (ΕΟΚ) αριθ. 2861/93 του Συμβουλίου
    στις εισαγωγές ορισμένων μαγνητικών δίσκων
    (μικροδίσκων 3,5") καταγωγής Ταϊβάν και Λαϊκής
    Δημοκρατίας της Κίνας μέσω εργασιών συναρμολόγησης
    στην Κοινότητα, και για την περάτωση της υπαγωγής
    εισαγωγών μερών των μικροδίσκων που καθιερώθηκε
    με τον κανονισμό (ΕΚ) αριθ. 1646/1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 799/2000, annettu 17 päivänä huhtikuuta 2000,
    tiettyjen Taiwanista ja Kiinan kansantasavallasta peräisin olevien magneettilevyjen
    (3,5 tuuman mikrolevyt) tuonnissa neuvoston asetuksella (ETY) N:o 2861/93 käyttöön
    otettujen polkumyyntitoimenpiteiden väitettyä kiertämistä koskevan tutkimuksen
    päättämisestä sekä asetuksen (EY) N:o 1646/1999 mukaisesti aloitetun mikrolevyjen
    osien kirjaamisen lopettamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 799/2000 della Commissione, del 17 aprile 2000, che
    chiude l'inchiesta relativa alla presunta elusione, mediante operazioni di assemblaggio
    nella Comunità, delle misure antidumping istituite dal regolamento (CEE) n. 2861/93
    del Consiglio nei confronti delle importazioni di alcuni tipi di dischi magnetici
    (microfloppy da 3,5 pollici) originari di Taiwan e della Repubblica popolare cinese
    e revoca la registrazione delle importazioni di parti di microfloppy introdotta
    con regolamento (CE) n. 1646/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 799/2000 van de Commissie van 17 april 2000 tot beëindiging
    van het onderzoek naar de mogelijke ontwijking van de bij Verordening (EG) nr.
    2861/93 van de Raad vastgestelde antidumpingmaatregelen ten aanzien van de invoer
    van bepaalde magneetschijven (3,5"-microschijven) uit Taiwan en de Volksrepubiek
    China door assemblage in de Gemeenschap, en tot stopzetting van de registratie
    van de invoer van deze microschijven die bij Verordening (EG) nr. 1646/1999 is
    ingesteld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 799/2000 da Comissão, de 17 de Abril de 2000, que
    encerra o inquérito relativo à alegada evasão às medidas anti-dumping criadas
    pelo Regulamento (CEE) n.o 2861/93 do Conselho sobre as importações de certos
    discos magnéticos (microdiscos - disquetes de 3,5 polegadas) originários de
    Taiwan e da República Popular da China, através de operações de montagem na
    Comunidade e termina o registo das importações de partes de microdiscos instituído
    pelo Regulamento (CE) n.o 1646/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 799/2000 de la Comisión, de 17 de abril de 2000, relativo
    a la apertura de una investigación sobre la presunta elusión de las medidas
    antidumping establecidas por el Reglamento (CEE) nº 2861/93 del Consejo relativo
    a las importaciones de determinados discos magnéticos (microdiscos de 3,5 pulgadas)
    originarios de Taiwán y de la República Popular de China mediante operaciones
    de montaje en la Comunidad, y por el que dejan de someterse a registro las importaciones
    de piezas de microdiscos introducido por el Reglamento (CE) nº 1646/1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 799/2000 av den 17 april 2000 om avslutande
    av undersökningen om påstått kringgående av antidumpningsåtgärder införda
    genom rådets förordning (EEG) nr 2861/93 på import av vissa magnetskivor (3,5-tumsdisketter)
    med ursprung i Taiwan och i Folkrepubliken Kina genom monteringsverksamhet i gemenskapen
    och om upphörande av registreringen av import av delar till mikrodisketter som
    infördes genom förordning (EG) nr 1646/1999
  type: main
