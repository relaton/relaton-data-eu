title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 janvier 1965, relative à la fixation
    du pourcentage des droits de douane et des moyennes des prélèvements agricoles
    applicables envers les pays tiers, à prendre en considération à partir du 1er
    février 1965, pour la détermination du taux des prélèvements compensateurs
    institués en application de l'article 10 paragraphe 2 deuxième alinéa du Traité
  type: main
- language: de
  script: Latn
  content: '65/82/EWG: Entscheidung der Kommission vom 29. Januar 1965 über die Festsetzung
    des Hundertsatzes der Zollsätze und der mittleren Abschöpfungen gegenüber dritten
    Ländern, die der Berechnung des gemäß Artikel 10 Absatz (2) zweiter Unterabsatz
    des Vertrages eingeführten anteiligen Zolls ab 1. Februar zugrunde zu legen sind'
  type: main
- language: it
  script: Latn
  content: '65/82/CEE: Decisione della Commissione, del 29 gennaio 1965, relativa
    alla fissazione della percentuale dei dazi doganali e delle medie dei prelievi
    agricoli applicabili nei confronti dei paesi terzi, da prendere in considerazione,
    a partire dal 1 febbraio 1965, per la determinazione dell''aliquota dei prelievi
    compensativi istituiti in applicazione dell''articolo 10, paragrafo 2, secondo
    comma, del Trattato'
  type: main
- language: nl
  script: Latn
  content: '65/82/EEG: Beschikking van de Commissie van 29 januari 1965 inzake de
    vaststelling van het percentage van de douanerechten en van de rekenkundige gemiddelden
    van de ten opzichte van derde landen toepasselijke landbouwheffingen, dat met
    ingang van 1 februari 1965 voor de bepaling van de hoogte van de met toepassing
    van artikel 10, lid 2, tweede alinea, van het Verdrag ingestelde compenserende
    heffingen in aanmerking dient te worden genomen'
  type: main
