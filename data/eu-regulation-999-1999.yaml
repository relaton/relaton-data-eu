title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 999/1999 of 11 May 1999 amending Regulation
    (EC) No 293/98 as regards the operative event applicable to the transport costs
    for fruit and vegetables distributed free of charge following their withdrawal
    from the market
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 999/1999 de la Commission, du 11 mai 1999, modifiant
    le règlement (CE) n° 293/98 en ce qui concerne le fait générateur applicable
    aux frais de transport des fruits et légumes distribués gratuitement après
    leur retrait du marché
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 999/1999 der Kommission vom 11. Mai 1999 zur Änderung
    der Verordnung (EG) Nr. 293/98 hinsichtlich des maßgeblichen Tatbestands für
    die Kosten des Transports von nach der Entnahme aus dem Markt kostenlos zu verteilendem
    Obst und Gemüse
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 999/1999 ze dne 11. května 1999, kterým
    se mění nařízení (ES) č. 293/98, pokud jde o rozhodné skutečností pro
    náklady na přepravu ovoce a zeleniny bezplatně rozdělované po jejich stažení
    z trhu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 999/1999 af 11. maj 1999 om ændring
    af forordning (EF) nr. 293/98 for så vidt angår den udløsende begivenhed for
    transportomkostninger for frugt og grøntsager, der uddeles gratis efter deres
    tilbagekøb fra markedet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 999/1999 της Επιτροπής,
    της 11ης Μαΐου 1999, για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 293/98 για τον καθορισμό των γενεσιουργών
    αιτίων που εφαρμόζονται στα έξοδα μεταφοράς
    των οπωροκηπευτικών τα οποία διανέμονται δωρεάν
    μετά την απόσυρσή τους από την αγορά
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 999/1999, 11. mai 1999, millega muudetakse
    määrust (EÜ) nr 293/98 rakendusjuhu osas, mida kohaldatakse tasuta jagatava
    puu- ja köögivilja veokulude suhtes pärast nende toodete turult kõrvaldamist
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 999/1999, annettu 11 päivänä toukokuuta 1999,
    asetuksen (EY) N:o 293/98 muuttamisesta markkinoilta poistettujen hedelmien ja
    vihannesten ilmaisjakelun kuljetuskustannuksiin sovellettavan määräytymisperusteen
    osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 999/1999/EK rendelete (1999. május 11.) a piaci forgalomból
    való kivonását követően ingyenesen elosztott gyümölcs és zöldség fuvarozási
    költségeire vonatkozó meghatározó ügyleti tény tekintetében a 293/98/EK
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 999/1999 della Commissione, dell'11 maggio 1999, che
    modifica il regolamento (CE) n. 293/98 per quanto riguarda il fatto generatore
    applicabile alle spese di trasporto degli ortofrutticoli distribuiti gratuitamente
    dopo il ritiro dal mercato
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 999/1999 (1999. gada 11. maijs), ar ko groza
    Regulu (EK) Nr. 293/98 attiecībā uz noteicošo dienu, kuru piemēro to augļu
    un dārzeņu transporta izmaksām, ko izplata bez maksas pēc izņemšanas no
    tirgus
  type: main
- language: lt
  script: Latn
  content: 1999 m. gegužės 11 d. Komisijos reglamentas (EB) Nr. 999/1999, iš dalies
    keičiantis Reglamentą (EB) Nr. 293/98 dėl atliekamos operacijos, kurios imamasi
    siekiant padengti nemokamai platinamų pašalintų iš rinkos vaisių ir daržovių
    po jų pašalinimo iš rinkos transporto išlaidas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 999/1999 tal-11 ta’ Mejju 1999
