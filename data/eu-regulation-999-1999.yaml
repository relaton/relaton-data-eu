    tat-trasport għall-frott u l-ħxejjex ta’ l-ikel mqassma b’xejn wara li jiġu
    rtirati mis-suq
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 999/1999 van de Commissie van 11 mei 1999 tot wijziging
    van Verordening (EG) nr. 293/98 wat betreft het ontstaansfeit voor de vervoerskosten
    in verband met de gratis uitreiking van uit de markt genomen groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 999/1999 z dnia 11 maja 1999 r. zmieniające
    rozporządzenie (WE) nr 293/98 w odniesieniu do terminu operacyjnego mającego
    zastosowanie do kosztów transportu owoców i warzyw rozprowadzanych bezpłatnie
    po ich wycofaniu z rynku
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 999/1999 da Comissão, de 11 de Maio de 1999, que
    altera o Regulamento (CE) n° 293/98 no que respeita ao facto gerador aplicável
    às despesas de transporte das frutas e produtos hortícolas distribuídos gratuitamente
    após a sua retirada do mercado
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 999/1999 z 11. mája 1999, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 293/98, pokiaľ ide o rozhodujúcu skutkovú podstatu
    týkajúcu sa dopravných nákladov spojených s ovocím a zeleninou, ktoré sa
    po ich stiahnutí z trhu zadarmo rozvezú
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 999/1999 z dne 11. maja 1999 o spremembi Uredbe
    (ES) št. 293/98 v zvezi z datumi uveljavitve, ki se uporablja za stroške prevoza
    sadja in zelenjave, razdeljenega brezplačno potem, ko je bilo umaknjeno s trga
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 999/1999 de la Comisión, de 11 de mayo de 1999, por
    el que se modifica el Reglamento (CE) n° 293/98 en lo que respecta al hecho generador
    aplicable a los gastos de transporte de las frutas y hortalizas distribuidas de
    forma gratuita tras su retirada del mercado
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 999/1999 av den 11 maj 1999 om ändring
    av förordning (EG) nr 293/98 när det gäller den avgörande händelse som skall
    tillämpas för transportkostnaderna för frukt och grönsaker som delas ut gratis
    efter det att de har återtagits från marknaden
