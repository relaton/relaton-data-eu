    pour la revente sur le marché intérieur de blé dur détenu par l'organisme
    d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2963/93 der Kommission vom 27. Oktober 1993 zur Änderung
    der Verordnung (EWG) Nr. 2781/93 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 500 000 Tonnen Hartweizen aus Beständen
    der italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2963/93 af 27. oktober 1993 om ændring
