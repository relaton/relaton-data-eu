title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2055/97 of 20 October 1997 laying down to
    what extent applications for issue of export licences submitted during October
    1997 for beef and veal products which may benefit from special import treatment
    in Canada may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2055/97 DE LA COMMISSION du 20 octobre 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'octobre 1997 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation au Canada
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2055/97 DER KOMMISSION vom 20. Oktober 1997 über das
    Ausmaß, in dem den im Oktober 1997 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2055/97 af 20. oktober 1997 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    oktober 1997 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    Canada, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2055/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 20ής Οκτωβρίου 1997 για καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Οκτώβριο 1997 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2055/97, annettu 20 päivänä lokakuuta 1997,
    Kanadassa erityistuontikohtelun saavien naudanliha-alan tuotteiden lokakuussa
    1997 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2055/97 DELLA COMMISSIONE del 20 ottobre 1997 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di ottobre 1997 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2055/97 VAN DE COMMISSIE van 20 oktober 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in oktober 1997 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in Canada
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2055/97 DA COMISSÃO de 20 de Outubro de 1997 que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Outubro de 1997 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    no Canadá
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2055/97 DE LA COMISIÓN de 20 de octubre de 1997 por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de octubre de 1997, para los productos
    del sector de la carne de bovino que se beneficien de un trato especial para su
    importación en Canadá
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2055/97 av den 20 oktober 1997 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under oktober månad 1997
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till Kanada
