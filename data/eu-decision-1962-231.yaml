title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne à maintenir,
    jusqu'au 30 juin 1982 au plus tard, des contingents pour l'acide citrique (position
    29.12 A IVA du tarif douanier italien) et pour le citrate de calcium (position
    29.16 A IVB du tarif douanier italien)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Ermächtigung der Italienischen Republik,
    bis spätestens zum 30. Juni 1962 Kontingente für Zitronensäure (Tarifnr. des
    italienischen Zolltarifs 29.16 A IV a) und Kalziumzitrat (Tarifnr. des italienischen
    Zolltarifs 29.16 A IV b) aufrechtzuerhalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione alla Repubblica
    Italiana a mantenere, al più tardi fino al 30 giugno 1962, contingenti per l'acido
    citrico (voce della tariffa doganale italiana 29.16 A IVa) e per il citrato di
    calcio (voce della tariffa doganale italiana 29.16 A IV b)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie houdende machtiging van de Italiaanse Republiek
    tot het handhaven van de contingenten voor citroenzuur (post 29.16 A IVa van het
    Italiaanse douanetarief) en voor calciumcitraat (post 29.16 A IVb van het Italiaanse
    douanetarief) tot uiterlijk 30 juni 1962
  type: main
