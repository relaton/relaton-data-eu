    Einfuhrlizenzen von Grundgetreide mit Vorausfestsetzung der Abschöpfung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3084/83 af 31. oktober 1983 om undtagelse
