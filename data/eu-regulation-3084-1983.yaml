    pour les certificats d' importation de céréales de base avec fixation à l'
    avance du prélèvement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3084/83 der Kommission vom 31. Oktober 1983 zur Abweichung
