---
id: EUDecision20152329
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/2329 of 11 December 2015 determining
    that the temporary suspension of the preferential customs duty established under
    the stabilisation mechanism for bananas of the Trade Agreement between the European
    Union and its Member States, of the one part, and Colombia and Peru, of the other
    part, and under the stabilisation mechanism for bananas of the Agreement establishing
    an Association between the European Union and its Member States, on the one hand,
    and Central America on the other, is not appropriate for imports of bananas originating
    respectively in Peru and Guatemala for the year 2015
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/2329 de la Commission du 11 décembre
    2015 déterminant que la suspension temporaire du droit de douane préférentiel
    établi au titre du mécanisme de stabilisation pour les bananes prévu par l'accord
    commercial entre l'Union européenne et ses États membres, d'une part, et la
    Colombie et le Pérou, d'autre part, et au titre du mécanisme de stabilisation
    pour les bananes prévu par l'accord établissant une association entre l'Union
    européenne et ses États membres, d'une part, et l'Amérique centrale, d'autre
    part, n'est pas appropriée dans le cas des importations de bananes originaires
    respectivement du Pérou et du Guatemala pour l'année 2015
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/2329 der Kommission vom 11. Dezember
    2015 zur Feststellung, dass die vorübergehende Aussetzung des Präferenzzolls,
    der im Rahmen des Stabilisierungsmechanismus für Bananen des Handelsübereinkommens
    zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits und Kolumbien
    und Peru andererseits sowie im Rahmen des Stabilisierungsmechanismus für Bananen
    des Abkommens zur Gründung einer Assoziation zwischen der Europäischen Union
    und ihren Mitgliedstaaten einerseits und Zentralamerika andererseits festgesetzt
    wurde, für Einfuhren von Bananen mit Ursprung in Peru bzw. Guatemala für das
    Jahr 2015 nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/2329 на Комисията
    от 11 декември 2015 година за определяне на временното
    спиране на прилагането на преференциалното
    мито, установено по силата на механизма за
    стабилизиране по отношение на бананите от
    Споразумението за търговия между Европейския
    съюз и неговите държави членки, от една страна,
    и Колумбия и Перу, от друга страна, и по силата
    на механизма за стабилизиране по отношение
    на бананите от Споразумението за асоцииране
    между Европейския съюз и неговите държави
    членки, от една страна, и Централна Америка,
    от друга страна, за нецелесъобразно по отношение
    на вноса на банани с произход съответно от
    Перу и Гватемала за 2015 година
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/2329 ze dne 11. prosince 2015,
    kterým se určuje, že pro rok 2015 není vhodné dočasné pozastavení preferenční
    celní sazby pro dovoz banánů pocházejících z Peru a Guatemaly podle mechanismu
    stabilizace pro banány Obchodní dohody mezi Evropskou unií a jejími členskými
    státy na jedné straně a Kolumbií a Peru na straně druhé a podle mechanismu
    stabilizace pro banány Dohody zakládající přidružení mezi Evropskou unií
    a jejími členskými státy na jedné straně a Střední Amerikou na straně
    druhé
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/2329 af 11. december
    2015 om fastsættelse af, at den midlertidige suspension af den præferencetold,
    som er fastsat under stabiliseringsmekanismen for bananer i handelsaftalen mellem
    Den Europæiske Union og dens medlemsstater på den ene side og Colombia og Peru
    på den anden side og under stabiliseringsmekanismen for bananer i aftalen om
    oprettelse af en associering mellem Den Europæiske Union og dens medlemsstater
    på den ene side og Mellemamerika på den anden side, ikke er hensigtsmæssig
    for import af bananer med oprindelse i Peru og Guatemala for 2015
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/2329 της Επιτροπής,
    της 11ης Δεκεμβρίου 2015, με την οποία ορίζεται
    ότι η προσωρινή αναστολή του προτιμησιακού
    δασμού που θεσπίστηκε βάσει του μηχανισμού
    σταθεροποίησης για τις μπανάνες στο πλαίσιο
    της συμφωνίας εμπορίου μεταξύ της Ευρωπαϊκής
    Ένωσης και των κρατών μελών της, αφενός, και
    της Κολομβίας και του Περού, αφετέρου, και βάσει
    του μηχανισμού σταθεροποίησης για τις μπανάνες
    στο πλαίσιο της συμφωνίας σύνδεσης μεταξύ
    της Ευρωπαϊκής Ένωσης και των κρατών μελών
    της, αφενός, και της Κεντρικής Αμερικής, αφετέρου,
    δεν κρίνεται σκόπιμη για τις εισαγωγές μπανανών
    καταγωγής, αντίστοιχα, Περού και Γουατεμάλας
    για το έτος 2015
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/2329, 11. detsember 2015, millega määratakse
    kindlaks, et ühelt poolt Euroopa Liidu ja tema liikmesriikide ning teiselt poolt
    Colombia ja Peruu vahelise kaubanduslepingu banaane käsitleva stabiilsusmehhanismi
    ning ühelt poolt Euroopa Liidu ja selle liikmesriikide ning teiselt poolt Kesk-Ameerika
    riikide vahel assotsiatsiooni loomise lepingu banaane käsitleva stabiilsusmehhanismi
    raames kehtestatud soodustollimaksu ajutine peatamine ei ole Peruust ja Guatemalast
    pärit banaanide impordi suhtes aastal 2015 asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/2329, annettu 11 päivänä
    joulukuuta 2015, sen määrittämisestä, että Euroopan unionin ja sen jäsenvaltioiden
    sekä Kolumbian ja Perun välisen kauppasopimuksen ja toisaalta Euroopan unionin
    ja sen jäsenvaltioiden sekä Keski-Amerikan välisestä assosiaatiosta tehdyn
    sopimuksen sisältämän banaaneja koskevan vakautusmekanismin mukaisen etuustullin
    väliaikainen suspendoiminen ei ole tarpeen Perusta ja Guatemalasta peräisin
    olevien banaanien tuonnissa vuonna 2015
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/2329 оd 11. prosinca 2015. kojom
    se utvrđuje da privremena obustava povlaštenih carina uspostavljenih na temelju
    mehanizma stabilizacije za banane iz Sporazuma o trgovini između Europske unije
    i njezinih država članica, s jedne strane, i Kolumbije i Perua, s druge strane,
    i na temelju mehanizma stabilizacije za banane iz Sporazuma o pridruživanju između
    Europske unije i njezinih država članica, s jedne strane, i Središnje Amerike,
    s druge strane, nije primjerena za uvoz banana podrijetlom iz Perua i Gvatemale
    za 2015.
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/2329 végrehajtási határozata (2015. december
    11.) a Peruból és Guatemalából származó friss banán behozatalára az egyrészről
    az Európai Unió és tagállamai, másrészről Kolumbia és Peru közötti kereskedelmi
    megállapodásban foglalt banánkereskedelmi stabilizációs mechanizmus keretében,
    illetve az egyrészről az Európai Unió és tagállamai, másrészről Közép-Amerika
    közötti társulási megállapodásban foglalt banánkereskedelmi stabilizációs
    mechanizmus keretében alkalmazott kedvezményes vámtételek 2015. évi ideiglenes
    felfüggesztése nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/2329 della Commissione, dell'11 dicembre
    2015, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    istituito in virtù del meccanismo di stabilizzazione per le banane previsto dall'accordo
    commerciale tra l'Unione europea e i suoi Stati membri, da una parte, e la Colombia
    e il Perù, dall'altra, e in virtù del meccanismo di stabilizzazione per le banane
    previsto dall'accordo che istituisce un'associazione tra l'Unione europea e i
    suoi Stati membri, da una parte, e l'America centrale, dall'altra, non è appropriata
    per quanto riguarda le importazioni di banane originarie rispettivamente del Perù
    e del Guatemala per l'anno 2015
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/2329 (2015. gada 11. decembris),
    ar ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar stabilizācijas mehānismu banāniem Tirdzniecības nolīgumā starp
    Eiropas Savienību un tās dalībvalstīm, no vienas puses, un Kolumbiju un Peru,
    no otras puses, un stabilizācijas mehānismu banāniem Nolīgumā, ar ko izveido
    asociāciju starp Eiropas Savienību un tās dalībvalstīm, no vienas puses,
    un Centrālameriku, no otras puses, attiecībā uz attiecīgi Peru un Gvatemalas
    izcelsmes banānu importu 2015. gadā nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2015 m. gruodžio 11 d. Komisijos įgyvendinimo sprendimas (ES) 2015/2329,
    kuriuo nustatoma, kad pagal Europos Sąjungos bei jos valstybių narių ir Kolumbijos
    bei Peru prekybos susitarimo bananų importo stabilizavimo priemonę ir pagal
    Susitarimo, kuriuo steigiama Europos Sąjungos bei jos valstybių narių ir Centrinės
    Amerikos asociacija, bananų importo stabilizavimo priemonę nustatyto lengvatinio
    muito laikinas taikymo nutraukimas 2015 m. atitinkamai Peru ir Gvatemalos kilmės
    importuojamiems bananams yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/2329 tal-11
    ta' Diċembru 2015 li tiddetermina li s-sospensjoni temporanja tad-dazji doganali
    preferenzjali stabbiliti taħt il-mekkaniżmu ta' stabbilizzazzjoni għall-banana
    tal-Ftehim ta' Kummerċ bejn l-Unjoni Ewropea u l-Istati Membri tagħha, minn
    naħa waħda, u l-Kolombja u l-Perù, min-naħa l-oħra, u skont il-mekkaniżmu
    ta' stabbilizzazzjoni għall-banana tal-Ftehim li jistabbilixxi Assoċjazzjoni
    bejn l-Unjoni Ewropea u l-Istati Membri tagħha, minn naħa waħda, u l-Amerika
    Ċentrali min-naħa l-oħra, mhix xierqa għall-importazzjoni tal-banana li joriġinaw
    rispettivament fil-Peru u fil-Gwatemala għas-sena 2015
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/2329 van de Commissie van 11 december 2015
    waarbij wordt bepaald dat de opschorting van het preferentiële douanerecht dat
    is vastgesteld in het kader van het stabilisatiemechanisme voor bananen in de
    handelsovereenkomst tussen de Europese Unie en haar lidstaten, enerzijds, en Colombia
    en Peru, anderzijds, en in het kader van het stabilisatiemechanisme voor bananen
    in de overeenkomst waarbij een associatie tot stand wordt gebracht tussen de Europese
    Unie en haar lidstaten, enerzijds, en Midden-Amerika, anderzijds, niet passend
    is voor de invoer van bananen van oorsprong uit respectievelijk Peru en Guatemala
    voor het jaar 2015
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/2329 z dnia 11 grudnia 2015 r. w sprawie
    ustalenia, że tymczasowe zawieszenie preferencyjnego cła ustanowionego w ramach
    mechanizmu stabilizacyjnego dotyczącego bananów przywołanego w Umowie o handlu
    między Unią Europejską i jej państwami członkowskimi, z jednej strony, a
    Kolumbią i Peru, z drugiej strony, oraz w ramach mechanizmu stabilizacyjnego
    dotyczącego bananów przywołanego w Umowie ustanawiającej stowarzyszenie między
    Unią Europejską i jej państwami członkowskimi, z jednej strony, a Ameryką
    Środkową, z drugiej strony, nie jest odpowiednie dla przywozu bananów pochodzących
    odpowiednio z Peru i Gwatemali w 2015 r.
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/2329 da Comissão, de 11 de dezembro de
    2015, que determina que a suspensão temporária do direito aduaneiro preferencial
    estabelecido ao abrigo do mecanismo de estabilização para as bananas do Acordo
    Comercial entre a União Europeia e os seus Estados-Membros, por um lado, e a
    Colômbia e o Peru, por outro lado, e no âmbito do mecanismo de estabilização
    para as bananas do Acordo que cria uma Associação entre a União Europeia e
    os seus Estados-Membros, por um lado, e a América Central, por outro, não é
    adequada para as importações de bananas originárias, respetivamente, no Peru
    e na Guatemala para o ano de 2015
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/2329 a Comisiei din 11 decembrie
    2015 de stabilire a faptului că suspendarea temporară a taxelor vamale preferențiale
    instituite în temeiul mecanismului de stabilizare pentru banane din Acordul comercial
    între Uniunea Europeană și statele membre ale acesteia, pe de o parte, și
    Columbia și Peru, pe de altă parte, în temeiul mecanismului de stabilizare
    pentru banane din Acordul de instituire a unei asocieri între Uniunea Europeană
    și statele membre ale acesteia, pe de o parte, și America Centrală, pe de altă
    parte, nu este adecvată pentru importurile de banane originare din Peru și Guatemala
    pentru anul 2015
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/2329 z 11. decembra 2015, ktorým
    sa určuje, že na rok 2015 nie je vhodné dočasné pozastavenie preferenčného
    cla na dovoz banánov s pôvodom v Peru a Guatemale stanoveného na základe stabilizačného
    mechanizmu pre banány v rámci Dohody o obchode medzi Európskou úniou a jej
    členskými štátmi na jednej strane a Kolumbiou a Peru na strane druhej a na
    základe stabilizačného mechanizmu pre banány v rámci Dohody, ktorou sa zakladá
    pridruženie medzi Európskou úniou a jej členskými štátmi na jednej strane
    a Strednou Amerikou na strane druhej
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/2329 z dne 11. decembra 2015 o ugotovitvi,
    da začasna opustitev preferencialnih carin, vzpostavljenih v okviru stabilizacijskega
    mehanizma za banane iz Trgovinskega sporazuma med Evropsko unijo in njenimi državami
    članicami na eni strani ter Kolumbijo in Perujem na drugi strani ter v okviru
    stabilizacijskega mehanizma za banane iz Sporazuma o pridružitvi med Evropsko
    unijo in njenimi državami članicami na eni strani ter Srednjo Ameriko na drugi
    strani, ni primerna za uvoz banan s poreklom iz Peruja oziroma Gvatemale za leto
    2015
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/2329 de la Comisión, de 11 de diciembre
    de 2015, por la que se determina que la suspensión temporal del arancel aduanero
    preferencial establecido en el marco del mecanismo de estabilización para el
    banano del Acuerdo comercial entre la Unión Europea y sus Estados miembros, por
    una parte, y Colombia y el Perú, por otra, y en el marco del mecanismo de estabilización
    para el banano del Acuerdo comercial entre la Unión Europea y sus Estados miembros,
    por una parte, y Centroamérica, por otra, no es apropiada para las importaciones
    de plátanos (bananas) originarios, respectivamente, de Perú y Guatemala para
    el año 2015
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/2329 av den 11 december 2015
    om fastställande av att det tillfälliga upphävandet av förmånstullarna enligt
    stabiliseringsmekanismen för bananer i handelsavtalet mellan Europeiska unionen
    och dess medlemsstater, å ena sidan, och Colombia och Peru, å andra sidan, och
    enligt stabiliseringsmekanismen för bananer i avtalet om upprättande av en associering
    mellan Europeiska unionen och dess medlemsstater, å ena sidan, och Centralamerika,
    å andra sidan, inte är lämpligt för import av bananer med ursprung i Peru
    och Guatemala under 2015
  type: main
