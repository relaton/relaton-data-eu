title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1827/77 of 5 August 1977 maintaining with certain
    amendments, the arrangements for the authorization of imports into the Community
    or into certain Member States of cotton yarn and of garments originating in certain
    third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1827/77 du Conseil, du 5 août 1977, portant maintien,
    avec certaines modifications, du régime d'autorisation d'importation dans la
    Communauté ou dans certains États membres de fils de coton et de vêtements
    originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1827/77 des Rates vom 5. August 1977 zu der mit einigen
    Änderungen verbundenen Aufrechterhaltung der Genehmigungspflicht für die Einfuhr
    von Baumwollgarnen und Bekleidung mit Ursprung in bestimmten Drittländern in
    die Gemeinschaft oder in bestimmte Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1827/77 af 5. august 1977 om opretholdelse
    af visse ændringer af bevillingsordningen for indførsel til Fællesskabet eller
    visse medlemsstater af garn af bomuld samt af beklædningsgenstande med oprindelse
    i visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1827/77 del Consiglio, del 5 agosto 1977, che mantiene
    in vigore, con talune modifiche, il regime di autorizzazioni d'importazione nella
    Comunità o in taluni Stati membri per dei filati di cotone e degli indumenti
    originari di taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1827/77 van de Raad van 5 augustus 1977 houdende
    handhaving, met enige wijzigingen, van de regeling waarbij de invoer in de Gemeenschap
    of in bepaalde Lid-Staten van garens van katoen en kleding van oorsprong uit bepaalde
    derde landen, aan een vergunningenstelsel wordt onderworpen
  type: main
