title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1093/79 of 1 June 1979 re-establishing the
    levying of customs duties on other kinds of leather, other, falling within subheading
    41.05 B II and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1093/79 de la Commission, du 1er juin 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux,
    non dénommées, d' autres animaux, de la sous-position 41.05 B II du tarif douanier
    commun, originaires de la Yougoslavie bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1093/79 der Kommission vom 1. Juni 1979 zur Wiedereinführung
    des Zollsatzes für bestimmtes Leder aus Häuten oder Fellen von anderen Tieren
    der Tarifnummer 41.05 B II, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3156/78 des Rates Vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1093/79 af 1. juni 1979 om genindførelse
    af opkrævning af toldafgifter for læder af andre dyrehuder og dyreskind, andre
    varer, henhørende under pos. 41.05 B II i den fælles toldtarif, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, der er fastsat i Rådets forordning
    (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1093/79 della Commissione, del 1° giugno 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli, non
    nominate, di altri animali, della sottovoce doganale 41.05 B II, originarie della
    Iugoslavia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1093/79 van de Commissie van 1 juni 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op ander leder
    en voorgelooide huiden en vellen, van andere dieren, van post 41.05 B II, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
