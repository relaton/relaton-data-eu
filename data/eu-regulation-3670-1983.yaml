  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3670/83 della Commissione del 19 dicembre 1983 che
    stabilisce le modalità per il calcolo dei prezzi di ritiro e fissa, per la campagna
    di pesca 1984, i prezzi di ritiro per i prodotti della pesca di cui all' allegato
    I, parti A e D, del regolamento (CEE) n. 3796/81, nonché per taluni prodotti
    sbarcati in zone molto distanti dai principali centri di consumo della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3670/83 van de Commissie van 19 december 1983 houdende
