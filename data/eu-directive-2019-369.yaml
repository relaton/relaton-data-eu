title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2019/369 of 13 December 2018 amending
    the Annex to Council Framework Decision 2004/757/JHA as regards the inclusion
    of new psychoactive substances in the definition of ‘drug’
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2019/369 de la Commission du 13 décembre 2018
    modifiant l'annexe de la décision-cadre 2004/757/JAI du Conseil en ce qui concerne
    l'inclusion de nouvelles substances psychoactives dans la définition du terme
    «drogue»
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2019/369 der Kommission vom 13. Dezember 2018
    zur Änderung des Anhangs des Rahmenbeschlusses 2004/757/JI des Rates zur Aufnahme
    neuer psychoaktiver Substanzen in die Drogendefinition
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2019/369 на Комисията
    от 13 декември 2018 година за изменение на приложението
    към Рамково решение 2004/757/ПВР на Съвета във
    връзка с включването на нови психоактивни
    вещества в определението за „наркотици“
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci (EU) 2019/369 ze dne 13. prosince
    2018, kterou se mění příloha rámcového rozhodnutí Rady 2004/757/SVV, pokud
    jde o zahrnutí nových psychoaktivních látek do definice drogy
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2019/369 af 13. december 2018 om
    ændring af bilaget til Rådets rammeafgørelse 2004/757/RIA for så vidt angår
    inkluderingen af nye psykoaktive stoffer i definitionen af »narkotika«
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία (EE) 2019/369 της Επιτροπής,
    της 13ης Δεκεμβρίου 2018, για την τροποποίηση
    του παραρτήματος της απόφασης-πλαισίου 2004/757/ΔΕΥ
    του Συμβουλίου όσον αφορά τη συμπερίληψη νέων
    ψυχοδραστικών ουσιών στον ορισμό των ναρκωτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv (EL) 2019/369, 13. detsember 2018, millega
    muudetakse raamotsuse 2004/757/JSK lisa seoses uute psühhoaktiivsete ainete lisamisega
    uimasti määratlusse
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi (EU) 2019/369, annettu 13 päivänä joulukuuta
    2018, neuvoston puitepäätöksen 2004/757/YOS liitteen muuttamisesta siltä osin
    kuin on kyse uusien psykoaktiivisten aineiden sisällyttämisestä huumausaineen
    määritelmään
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/369 оd 13. prosinca 2018. o izmjeni
    Priloga Okvirnoj odluci Vijeća 2004/757/PUP u pogledu obuhvaćanja novih psihoaktivnih
    tvari definicijom „droge”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/369 felhatalmazáson alapuló irányelve (2018.
    december 13.) a 2004/757/IB tanácsi kerethatározat mellékletének a kábítószer
    fogalommeghatározása új pszichoaktív anyagokkal való kiegészítése céljából
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2019/369 della Commissione, del 13 dicembre 2018,
    che modifica l'allegato della decisione quadro 2004/757/GAI del Consiglio per
    quanto riguarda l'inclusione di nuove sostanze psicoattive nella definizione di
    «stupefacenti»
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2019/369 (2018. gada 13. decembris),
    ar ko groza Padomes Pamatlēmuma 2004/757/TI pielikumu attiecībā uz jaunu psihoaktīvu
    vielu iekļaušanu narkotiskās vielas definīcijā
  type: main
- language: lt
  script: Latn
  content: 2018 m. gruodžio 13 d. Komisijos deleguotoji direktyva (ES) 2019/369,
    kuria dėl naujų psichoaktyviųjų medžiagų įtraukimo į termino „narkotikas“
    apibrėžtį iš dalies keičiamas Tarybos pamatinio sprendimo 2004/757/TVR priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2019/369 tat-13 ta' Diċembru 2018
    li temenda l-Anness tad-Deċiżjoni Kwadru tal-Kunsill 2004/757/ĠAI rigward l-inklużjoni
    ta' sustanzi psikoattivi ġodda fid-definizzjoni ta' “droga”
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2019/369 van de Commissie van 13 december 2018
    tot wijziging van de bijlage bij Kaderbesluit 2004/757/JBZ van de Raad in verband
    met het opnemen van nieuwe psychoactieve stoffen in de definitie van „drug”
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2019/369 z dnia 13 grudnia 2018 r. zmieniająca
    załącznik do decyzji ramowej Rady 2004/757/WSiSW w odniesieniu do włączenia
    nowych substancji psychoaktywnych do definicji „narkotyku”
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2019/369 da Comissão, de 13 de dezembro de 2018,
    que altera o anexo da Decisão-Quadro 2004/757/JAI do Conselho no que respeita
    à inclusão de novas substâncias psicoativas na definição de droga
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2019/369 a Comisiei din 13 decembrie 2018 de modificare
    a anexei la Decizia-cadru 2004/757/JAI a Consiliului în ceea ce privește includerea
    unor substanțe psihoactive noi în definiția termenului „drog”
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2019/369 z 13. december 2018, ktorou
    sa mení príloha k rámcovému rozhodnutiu Rady 2004/757/SVV, pokiaľ ide o zahrnutie
    nových psychoaktívnych látok do vymedzenia pojmu drogy
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2019/369 z dne 13. decembra 2018 o spremembi
    Priloge k Okvirnemu sklepu Sveta 2004/757/PNZ v zvezi z vključitvijo novih psihoaktivnih
    snovi v opredelitev pojma „prepovedana droga“
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2019/369 de la Comisión, de 13 de diciembre de
    2018, por la que se modifica el anexo de la Decisión Marco 2004/757/JAI del Consejo
    en lo que respecta a la inclusión de nuevas sustancias psicotrópicas en la definición
    de «droga»
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2019/369 av den 13 december 2018
    om ändring av bilagan till rådets rambeslut 2004/757/RIF vad gäller inkluderande
    av nya psykoaktiva substanser i definitionen av begreppet ”narkotika”
