    non conforme alle disposizioni del regolamento (CEE) n. 1601/91 del Consiglio
    che stabilisce le regole generali relative alla definizione, alla designazione
    e alla presentazione dei vini aromatizzati, delle bevande aromatizzate a base
    di vino e dei cocktail aromatizzati di prodotti vitivinicoli [notificata con il
    numero C(2002) 2773]'
  type: main
