title:
- language: en
  script: Latn
  content: '2002/624/EC: Commission Decision of 24 July 2002 authorising Italy to
    allow the export of an aromatised wine-based drink not complying with Council
    Regulation (EEC) No 1601/91 laying down general rules on the definition, description
    and presentation of aromatised wines, aromatised wine-based drinks and aromatised
    wine-product cocktails (notified under document number C(2002) 2773)'
  type: main
- language: fr
  script: Latn
  content: '2002/624/CE: Décision de la Commission du 24 juillet 2002 autorisant
    l''Italie à permettre l''exportation d''une boisson aromatisée à base de vin
    non conforme aux dispositions du règlement (CEE) n° 1601/91 du Conseil établissant
    les règles générales relatives à la définition, à la désignation et à
    la présentation des vins aromatisés, des boissons aromatisées à base de vin
    et des cocktails aromatisés de produits vitivinicoles [notifiée sous le numéro
    C(2002) 2773]'
  type: main
- language: de
  script: Latn
  content: '2002/624/EG: Entscheidung der Kommission vom 24. Juli 2002 zur Ermächtigung
    Italiens, die Ausfuhr eines aromatisierten weinhaltigen Getränks zuzulassen,
    das den Bestimmungen der Verordnung (EWG) Nr. 1601/91 des Rates zur Festlegung
    der allgemeinen Regeln für die Begriffsbestimmung, Bezeichnung und Aufmachung
    aromatisierten Weines, aromatisierter weinhaltiger Getränke und aromatisierter
    weinhaltiger Cocktails nicht entspricht (Bekannt gegeben unter Aktenzeichen K(2002)
    2773)'
  type: main
- language: da
  script: Latn
  content: '2002/624/EF: Kommissionens beslutning af 24. juli 2002 om bemyndigelse
    af Italien til at tillade eksport af en aromatiseret vinbaseret drikkevare, der
    ikke opfylder bestemmelserne i Rådets forordning (EØF) nr. 1601/91 om almindelige
    regler for definition, betegnelse og præsentation af aromatiserede vine, aromatiserede
    vinbaserede drikkevarer og aromatiserede cocktails af vinprodukter (meddelt under
    nummer K(2002) 2773)'
  type: main
- language: el
  script: Grek
  content: '2002/624/ΕΚ: Απόφαση της Επιτροπής, της 24ης
    Ιουλίου 2002, που εξουσιοδοτεί την Ιταλία να
    επιτρέψει την εξαγωγή αρωματισμένου ποτού
    με βάση τον οίνο που δεν συμμορφούται προς
    τις διατάξεις του κανονισμού (ΕΟΚ) αριθ. 1601/91
    του Συμβουλίου για τη θέσπιση των γενικών κανόνων
    σχετικά με τον ορισμό, τον χαρακτηρισμό και
    την παρουσίαση των αρωματισμένων οίνων, των
    αρωματισμένων ποτών με βάση τον οίνο και των
    αρωματισμένων κοκτέιλ αμπελοοινικών προϊόντων
    [κοινοποιηθείσα υπό τον αριθμό Ε(2002) 2773]'
  type: main
- language: fi
  script: Latn
  content: '2002/624/EY: Komission päätös, tehty 24 päivänä heinäkuuta 2002,
    luvan antamisesta Italialle viedä maasta maustettua viinipohjaista juomaa, joka
    ei ole maustettujen viinien ja maustettujen viinipohjaisten ja viinistä valmistettujen
    juomasekoitusten määritelmää, kuvausta ja esittelyä koskevista yleisistä
    säännöistä annetun neuvoston asetuksen (ETY) N:o 1601/91 mukaista (tiedoksiannettu
    numerolla K(2002) 2773)'
  type: main
- language: it
  script: Latn
  content: '2002/624/CE: Decisione della Commissione, del 24 luglio 2002, che autorizza
