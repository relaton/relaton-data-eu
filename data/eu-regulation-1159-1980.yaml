title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1159/80 of 7 May 1980 re-establishing the
    levying of customs duties on inner tubes and tyre cases of the kind used on bicycles,
    falling within heading No ex 40.11 and originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1159/80 de la Commission, du 7 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux chambres à air et pneumatiques
    des types utilisés pour vélocipèdes, de la position ex 40.11 du tarif douanier
    commun, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1159/80 der Kommission vom 7. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Luftschläuche und Laufdecken und schlauchlose Reifen für
    Fahrräder der Tarifnummer ex 40.11 mit Ursprung in Jugoslawien, dem die in der
    Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1159/80 af 7. maj 1980 om genindførelse
    af opkrævning af toldafgifter for slanger og dæk til cykler uden motor, under
    position ex 40.11, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1159/80 della Commissione, del 7 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle camere d' aria e
    coperture dei tipi utilizzati per velocipedi, della voce ex 40.11 della tariffa
    doganale comune, originarie della Iugoslavia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1159/80 van de Commissie van 7 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op binnenbanden
    en buitenbanden van het type gebruikt voor rijwielen, van post ex 40.11, van oorsprong
    uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
