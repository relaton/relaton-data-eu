title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/2122 of 10 October 2019 supplementing
    Regulation (EU) 2017/625 of the European Parliament and of the Council as regards
    certain categories of animals and goods exempted from official controls at border
    control posts, specific controls on passengers’ personal luggage and on small
    consignments of goods sent to natural persons which are not intended to be placed
    on the market and amending Commission Regulation (EU) No 142/2011
  type: main
- language: fr
  script: Latn
  content: Règlement Délégué (UE) 2019/2122 de la Commission du 10 octobre 2019
    complétant le règlement (UE) 2017/625 du Parlement européen et du Conseil en
    ce qui concerne certaines catégories d’animaux et de biens exemptées des contrôles
    officiels aux postes de contrôle frontaliers, des contrôles spécifiques des
    bagages personnels des passagers et de petits envois de biens expédiés à des
    personnes physiques, qui ne sont pas destinés à être mis sur le marché et
    modifiant le règlement (UE) no 142/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/2122 der Kommission vom 10. Oktober 2019
    zur Ergänzung der Verordnung (EU) 2017/625 des Europäischen Parlaments und des
    Rates hinsichtlich bestimmter Kategorien von Tieren und Waren, die von amtlichen
    Kontrollen an Grenzkontrollstellen ausgenommen sind, hinsichtlich besonderer Kontrollen
    des persönlichen Gepäcks von Fahrgästen bzw. Passagieren und von für natürliche
    Personen bestimmten Kleinsendungen von Waren, die nicht in Verkehr gebracht werden
    sollen, sowie zur Änderung der Verordnung (EU) Nr. 142/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/2122 на Комисията
    от 10 октомври 2019 година за допълнение на Регламент
    (ЕС) 2017/625 на Европейския парламент и на Съвета
    по отношение на някои категории животни и стоки,
    освободени от официален контрол на граничните
    контролни пунктове, по отношение на специалния
    контрол на личния багаж на пътниците и на малките
    пратки от стоки, изпратени до физически лица,
    които не са предназначени за пускане на пазара,
    и за изменение на Регламент (ЕС) № 142/2011 на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise V Přenesené Pravomoci (EU) 2019/2122 ze dne 10. října
    2019, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2017/625,
    pokud jde o některé kategorie zvířat a zboží osvobozených od úředních
    kontrol na stanovištích hraniční kontroly, zvláštní kontroly osobních
    zavazadel cestujících a malých zásilek zboží, které není určeno k uvedení
    na trh, zasílaných fyzickým osobám, a kterým se mění nařízení Komise
    (EU) č. 142/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens Delegerede Forordning (EU) 2019/2122 af 10. oktober 2019
    om supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2017/625
    for så vidt angår visse kategorier af dyr og varer, der er undtaget fra offentlig
    kontrol ved grænsekontrolsteder, særlig kontrol af passagerers personlige bagage
    og af små sendinger af varer til fysiske personer, som ikke er bestemt til at
    blive markedsført, og om ændring af Kommissionens forordning (EU) nr. 142/2011
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2019/2122
    της Επιτροπής της 10ης Οκτωβρίου 2019 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2017/625 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά ορισμένες κατηγορίες
