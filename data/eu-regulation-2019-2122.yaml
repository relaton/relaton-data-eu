    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni Delegeeritud Määrus (EL) 2019/2122, 10. oktoober 2019, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2017/625 seoses piiripunktides
    ametlikust kontrollist vabastatud teatavate looma- ja kaubakategooriatega, reisijate
    isikliku pagasi ja selliste kaupade erikontrolliga, mis saadetakse väikeste saadetistena
    füüsilistele isikutele ja mis ei ole ette nähtud turule laskmiseks, ning millega
    muudetakse komisjoni määrust (EL) nr 142/2011
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2019/2122, annettu 10 päivänä lokakuuta
    2019, Euroopan parlamentin ja neuvoston asetuksen (EU) 2017/625 täydentämisestä
    siltä osin kuin on kyse rajatarkastusasemilla tehtävästä virallisesta valvonnasta
    vapautetuista tietyistä eläinten ja tavaroiden luokista, matkustajien henkilökohtaisiin
    matkatavaroihin kohdistuvasta erityisestä valvonnasta ja luonnollisille henkilöille
    osoitetuista pienistä tavaralähetyksistä, joita ei ole tarkoitus saattaa markkinoille,
    sekä komission asetuksen (EU) N:o 142/2011 muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/2122 оd 10. listopada 2019. o dopuni
    Uredbe (EU) 2017/625 Europskog parlamenta i Vijeća u pogledu određenih kategorija
    životinja i robe izuzetih od službenih kontrola na graničnim kontrolnim postajama,
    posebnih kontrola osobne prtljage putnika i malih pošiljaka robe koje se šalju
    fizičkim osobama i nisu namijenjene stavljanju na tržište te o izmjeni Uredbe
    Komisije (EU) br. 142/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/2122 Felhatalmazáson Alapuló Rendelete (2019.
    október 10.) az (EU) 2017/625 európai parlamenti és tanácsi rendeletnek a
    határállomásokon végzett hatósági ellenőrzések alól mentesített bizonyos
    állat- és árukategóriák, valamint az utasok személyes poggyászára és
    a természetes személyeknek küldött, nem forgalomba hozatalra szánt áruk
    kisméretű szállítmányaira vonatkozó egyedi ellenőrzések tekintetében
    történő kiegészítéséről és a 142/2011/EU bizottsági rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/2122 della Commissione del 10 ottobre 2019
    che integra il regolamento (UE) 2017/625 del Parlamento europeo e del Consiglio
    per quanto riguarda alcune categorie di animali e merci esenti da controlli ufficiali
    ai posti di controllo frontalieri, i controlli specifici relativamente al bagaglio
    personale dei passeggeri e a piccole partite di merci spedite a persone fisiche,
    non destinate all’immissione in commercio, e che modifica il regolamento (UE)
    n. 142/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/2122 (2019. gada 10. oktobris),
    ar ko attiecībā uz atbrīvojumu no oficiālajām kontrolēm robežkontroles
    punktos noteiktu kategoriju dzīvniekiem un precēm, konkrētām kontrolēm pasažieru
    personīgajai bagāžai un nelieliem tādu preču sūtījumiem fiziskām personām,
    kurus nav paredzēts laist tirgū, papildina Eiropas Parlamenta un Padomes Regulu
    (ES) 2017/625, kā arī groza Komisijas Regulu (ES) Nr. 142/2011
  type: main
- language: lt
  script: Latn
  content: Komisijos Deleguotasis Reglamentas (ES) 2019/2122 2019 m. spalio 10 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2017/625 papildomas nuostatomis
    dėl tam tikrų kategorijų gyvūnų ir prekių, kuriems netaikoma oficialioji
    kontrolė pasienio kontrolės postuose, keleivių asmeninio bagažo ir nedidelių
    fiziniams asmenims siunčiamų prekių siuntų, kurios nėra skirtos pateikti
    rinkai, konkrečios kontrolės ir iš dalies keičiamas Komisijos reglamentas
    (ES) Nr. 142/2011
  type: main
- language: mt
  script: Latn
  content: REGOLAMENT DELEGAT TAL-KUMMISSJONI (UE) 2019/2122 tal-10 ta’ Ottubru
    2019 li jissupplimenta r-Regolament (UE) 2017/625 tal-Parlament Ewropew u tal-Kunsill
    dwar ċerti kategoriji ta’ annimali u oġġetti eżentati minn kontrolli uffiċjali
    fil-postijiet ta’ kontroll fuq il-fruntieri, kontrolli speċifiċi fuq il-bagalji
    personali tal-passiġġieri u fuq kunsinni żgħar ta’ oġġetti mibgħuta lil
    persuni fiżiċi li mhumiex maħsuba biex jitqiegħdu fis-suq u li jemenda r-Regolament
    tal-Kummissjoni (UE) Nru 142/2011
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/2122 van de Commissie van 10 oktober
    2019 tot aanvulling van Verordening (EU) 2017/625 van het Europees Parlement en
    de Raad wat betreft bepaalde categorieën dieren en goederen die van officiële
    controles aan grenscontroleposten zijn vrijgesteld, en specifieke controles van
    de persoonlijke bagage van passagiers en van kleine zendingen goederen die aan
    natuurlijke personen worden gezonden en niet bestemd zijn om in de handel te worden
    gebracht en tot wijziging van Verordening (EU) nr. 142/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2019/2122 z dnia 10 października
    2019 r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2017/625
    w odniesieniu do niektórych kategorii zwierząt i towarów zwolnionych z kontroli
    urzędowych w punktach kontroli granicznej i w odniesieniu do określonych kontroli
    bagażu osobistego pasażerów i małych przesyłek towarów wysyłanych do osób
    fizycznych i nieprzeznaczonych do wprowadzenia do obrotu oraz zmieniające rozporządzenie
    Komisji (UE) nr 142/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/2122 da Comissão de 10 de outubro de 2019
    que completa o Regulamento (UE) 2017/625 do Parlamento Europeu e do Conselho no
    que diz respeito a determinadas categorias de animais e mercadorias isentas de
    controlos oficiais nos postos de controlo fronteiriços e aos controlos específicos
    das bagagens pessoais dos passageiros e das pequenas remessas de mercadorias enviadas
    a pessoas singulares não destinadas a ser colocadas no mercado, e que altera
    o Regulamento (UE) n.o 142/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/2122 al Comisiei din 10 octombrie 2019 de
    completare a Regulamentului (UE) 2017/625 al Parlamentului European și al Consiliului
    în ceea ce privește anumite categorii de animale și de mărfuri exceptate de
    la efectuarea controalelor oficiale la posturile de inspecție la frontieră,
    controalele specifice privind bagajele personale ale pasagerilor și transporturile
    mici de bunuri expediate către persoane fizice, care nu sunt destinate introducerii
    pe piață, și de modificare a Regulamentului (UE) nr. 142/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/2122 z 10. októbra 2019, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2017/625, pokiaľ ide
    o určité kategórie zvierat a tovaru oslobodené od úradných kontrol na hraničných
    kontrolných staniciach, špecifické kontroly osobnej batožiny cestujúcich
    a malých zásielok tovaru, ktorý nie je určený na uvedenie na trh, poslaných
    fyzickým osobám, a ktorým sa mení nariadenie Komisie (EÚ) č. 142/2011
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/2122 z dne 10. oktobra 2019 o dopolnitvi
    Uredbe (EU) 2017/625 Evropskega parlamenta in Sveta glede nekaterih kategorij
    živali in blaga, izvzetih iz uradnega nadzora na mejnih kontrolnih točkah, posebnega
    nadzora osebne prtljage potnikov ter blaga v majhnih pošiljkah, ki se pošlje
    fizičnim osebam in ni namenjeno dajanju na trg, ter o spremembi Uredbe Komisije
    (EU) št. 142/2011
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2019/2122 de la Comisión de 10 de octubre de
    2019 por el que se completa el Reglamento (UE) 2017/625 del Parlamento Europeo
    y del Consejo en lo que respecta a determinadas categorías de animales y mercancías
    exentas de controles oficiales en los puestos de control fronterizos y a los controles
    específicos del equipaje personal de los pasajeros y de las pequeñas partidas
    de mercancías expedidas para personas físicas y que no estén destinadas a comercializarse,
    y por el que se modifica el Reglamento (UE) n.o 142/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/2122 av den 10 oktober 2019
    om komplettering av Europaparlamentets och rådets förordning (EU) 2017/625 vad
    gäller vissa kategorier av djur och varor som är undantagna från offentlig
    kontroll vid gränskontrollstationer, särskild kontroll av passagerares personliga
    bagage och små sändningar av varor som sänds till fysiska personer och som
    inte är avsedda att släppas ut på marknaden och om ändring av kommissionens
    förordning (EU) nr 142/2011
