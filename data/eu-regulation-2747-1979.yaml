title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2747/79 of 6 December 1979 amending in respect
    of sheep' s or lambs' wool, not carded or combed, waste of sheep' s or lambs'
    wool, or of other animal hair (fine or course), not pulled or garnetted, cotton,
    not carded or combed, and cotton linters, Regulation (EEC) No 749/78 on the determination
    of the origin of textile products, falling within Chapters 51, and 53 to 62 of
    the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2747/79 de la Commission, du 6 décembre 1979, modifiant,
    en ce qui concerne la laine en masse, les déchets de laine et de poils (fins
    ou grossiers) à l' exclusion des effilochés, le coton en masse et les linters
    de coton, le règlement (CEE) n° 749/78 relatif à la détermination de l' origine
    des produits textiles des chapitres 51 et 53 à 62 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2747/79 der Kommission vom 6. Dezember 1979 zur Änderung
    der Verordnung (EWG) Nr. 749/78 über die Bestimmung des Ursprungs von Textilwaren
    der Kapitel 51 und 53 bis 62 des Gemeinsamen Zolltarifs im Hinblick auf Wolle,
    weder gekrempelt noch gekämmt, Abfälle von Wolle oder feinen oder groben Tierhaaren,
    ausgenommen Reißspinnstoff, Baumwolle, weder gekrempelt noch gekämmt, und Baumwoll-Linters
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2747/79 af 6. december 1979 om ændring
    af forordning (EØF) nr. 749/78 om bestemmelse af oprindelse for tekstilvarer
    henhørende under kapitel 51 og 53-62 i den fælles toldtarif for så vidt angår
    uld, ikke kartet eller kæmmet, affald af uld og andre dyrehår (fine eller grove),
    ikke opkradset, bomuld, ikke kartet eller kæmmet, og bomuldslinters
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2747/79 τής Επιτροπής
    τής 6ης Δεκεμβρίου 1979 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 749/78 «περί προσδιορισμού
    τής καταγωγής τών κλωστοϋφαντουργικών προϊόντων
    τών κεφαλαίων 51 καί 53 έως 62 τού Κοινού Δασμολογίου»,
    όσον αφορά τό έριον εις μάζας, τά απορρίμματα
    ερίου καί τριχών (εκλεκτής ποιότητος καί μή),
    εξαιρέσει τών ερίων καί τριχών τών προερχομένων
    εκ τής ξάνσεως νημάτων, υφασμάτων ή ρακών, τόν
    βάμβακα εις μάζας καί τάς βραχείας ίνας εκ
    βάμβακος μή δυναμένας νά κλωστοποιηθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2747/79 della Commissione, del 6 dicembre 1979, che
    modifica il regolamento (CEE) n. 749/78 relativo alla determinazione dell' origine
    dei prodotti tessili dei capitoli 51 e da 53 a 62 della tariffa doganale comune,
    per quanto riguarda le lane in massa, i cascami di lana e di peli (fini o grossolani),
    esclusi gli sfilacciati, il cotone in massa ed i linters di cotone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2747/79 van de Commissie van 6 december 1979 houdende
    wijziging met betrekking tot wol, niet gekaard en niet gekamd, afval van wol,
    van fijn of van grof haar, met uitzondering van rafelwol en van rafelingen van
    haar, katoen, niet gekaard en niet gekamd, linters van katoen, van Verordening
    (EEG) nr. 749/78 betreffende de bepaling van de oorsprong van de textielprodukten
    van de hoofdstukken 51 en 53 tot en met 62 van het gemeenschappelijk douanetarief
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2747/79 da Comissão, de 6 de Dezembro de 1979,
    que altera, no que respeita à lã em rama, desperdícios de lã e de pêlos (finos
    ou grosseiros), com exclusão da lã e pêlos, de trapos, algodão em rama e "linters"
    de algodão, o Regulamento (CEE) n.° 749/78 relativo à determinação da origem
    dos produtos têxteis dos capítulos 51 e 53 a 62 da pauta aduaneira comum
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2747/79 de la Comisión, de 6 de diciembre de 1979,
    por el que se modifica, respecto a la lana sin cardar ni peinar, a los desperdicios
    de lana y de pelos (finos u ordinarios) con exclusión de las hilachas, al algodón
    sin cardar ni peinar y a los linters de algodón, el Reglamento (CEE) n° 749/78
    relativo a la determinación del origen de los productos textiles de los capítulos
    51 y 53 a 62 del arancel aduanero común
  type: main
