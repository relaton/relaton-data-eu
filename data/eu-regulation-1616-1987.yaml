    der Gemeinschaft festgestellten Preise für ausgewachsene Rinder und zur Ermittlung
    der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1616/87 af 10. juni 1987 om 19. ændring
