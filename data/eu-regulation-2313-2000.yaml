  script: Latn
  content: Regolamento (CE) n. 2313/2000 del Consiglio, del 17 ottobre 2000, che istituisce
    un dazio antidumping definitivo e reca riscossione definitiva del dazio provvisorio
    sulle importazioni di alcuni tubi catodici per ricevitori di televisioni a colori
    originarie dell'India e della Repubblica di Corea, e che chiude il procedimento
    antidumping relativo alle importazioni originarie della Lituania, della Malaysia
    e della Repubblica popolare cinese
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2313/2000 (2000. gada 17. oktobris), ar ko piemēro
