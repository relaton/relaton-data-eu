    do direito provisório instituído sobre as importações de determinados tubos
    de raios catódicos para receptores de televisão a cores, originários da Índia
    e da República da Coreia e que encerra o processo anti-dumping no que respeita
    às importações originárias da Lituânia, da Malásia e da República Popular
    da China
  type: main
