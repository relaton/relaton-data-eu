title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2313/2000 of 17 October 2000 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of certain cathode-ray colour television picture tubes originating in
    India and the Republic of Korea, and terminating the anti-dumping proceeding in
    respect of imports originating in Lithuania, Malaysia and the People's Republic
    of China
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2313/2000 du Conseil du 17 octobre 2000 instituant
    un droit antidumping définitif et portant perception définitive des droits provisoires
    sur les importations de certains tubes cathodiques pour récepteurs de télévision
    en couleurs originaires de l'Inde et de la République de Corée et clôturant
    la procédure antidumping concernant les importations en provenance de Lituanie,
    de Malaisie et de la République populaire de Chine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2313/2000 des Rates vom 17. Oktober 2000 zur Einführung
