    für Farbfernsehempfangsgeräte mit Ursprung in Indien und der Republik Korea,
    zur endgültigen Vereinnahmung des vorläufigen Zolls auf die Einfuhren aus diesen
    Ländern und zur Einstellung des Verfahrens betreffend die Einfuhren mit Ursprung
    in Litauen, Malaysia und der Volksrepublik China
  type: main
- language: cs
  script: Latn
