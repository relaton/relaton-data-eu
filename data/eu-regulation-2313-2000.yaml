  script: Latn
  content: Verordening (EG) nr. 2313/2000 van de Raad van 17 oktober 2000 tot instelling
    van definitieve antidumpingrechten en tot definitieve inning van de voorlopige
    rechten die zijn ingesteld op de invoer van bepaalde kathodestraalbuizen voor
    kleurentelevisietoestellen van oorsprong uit India en de Republiek Korea en tot
    beëindiging van de antidumpingprocedure ten aanzien van invoer van oorsprong
