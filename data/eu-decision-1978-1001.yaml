title:
- language: en
  script: Latn
  content: '78/1001/EEC: Commission Decision of 27 November 1978 on the granting by
    the Guidance Section of the EAGGF to the Kingdom of Belgium of a payment on account
    in respect of expenditure incurred during 1977 on annuities relating to measures
    to encourage the cessation of farming and the reallocation of utilized agricultural
    area for the purpose of structural improvement'
  type: main
- language: fr
  script: Latn
  content: '78/1001/CEE: Décision de la Commission, du 27 novembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume de Belgique, d''un acompte sur les dépenses effectuées
    pendant l''année 1977 pour les indemnités relatives à l''encouragement à la
    cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures'
  type: main
- language: de
  script: Latn
  content: '78/1001/EWG: Entscheidung der Kommission vom 27. November 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1977 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an das Königreich Belgien'
  type: main
- language: da
  script: Latn
  content: '78/1001/EØF: Kommissionens beslutning af 27. november 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til kongeriget Belgien af et acontobeløb for
    de udgifter, som er afholdt i løbet af året 1977 til godtgørelser vedrørende
    støtte til ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal
    til strukturforbedringsformål'
  type: main
- language: it
  script: Latn
  content: '78/1001/CEE: Decisione della Commissione, del 27 novembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, al Regno del Belgio di
    un anticipo sulle spese effettuate durante il 1977 per le indennità concernenti
    l'' incoraggiamento alla cessazione dell'' attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture'
  type: main
- language: nl
  script: Latn
  content: '78/1001/EEG: Beschikking van de Commissie van 27 november 1978 inzake
    de betaling door het EOGFL, afdeling Oriëntatie, aan het Koninkrijk België van
    een voorschot in verband met de gedurende het jaar 1977 gedane uitgaven voor de
    uitkeringen met betrekking tot de bevordering van de bedrijfsbeëindiging in de
    landbouw en van de aanwending van cultuurgrond tot verbetering van de structuur'
  type: main
