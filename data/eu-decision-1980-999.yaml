title:
- language: en
  script: Latn
  content: '80/999/EEC: Commission Decision of 6 October 1980 authorizing Ireland
    not to apply Community treatment to men''s and boys''woven under garments, other
    than shirts, originating in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/999/CEE: Décision de la Commission, du 6 octobre 1980, autorisant
    l''Irlande à exclure du traitement communautaire les sous-vêtements tissés,
    autres que chemises et chemisettes, pour hommes et garçonnets, originaires de
    Hong-kong (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/999/EWG: Entscheidung der Kommission vom 6. Oktober 1980 zur Ermächtigung
