title:
- language: en
  script: Latn
  content: '92/187/EEC: Commission Decision of 28 February 1992 laying down the conditions
    which have to be complied with for importation of certain raw materials for the
    pharmaceutical processing industry, coming from certain third countries, which
    do not appear on the list established by Council Decision 79/542/EEC'
  type: main
- language: fr
  script: Latn
  content: '92/187/CEE: Décision de la Commission, du 28 février 1992, établissant
    les conditions à remplir lors de l''importation de certaines matières premières
    destinées à l''industrie de transformation pharmaceutique en provenance de certains
    pays tiers ne figurant pas sur la liste établie par la décision 79/542/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: '92/187/EWG: Entscheidung der Kommission vom 28. Februar 1992 zur Festlegung
    der Bedingungen für die Einfuhr bestimmten Rohmaterials für die pharmazeutische
    Verarbeitungsindustrie aus bestimmten Drittländern, die nicht auf der mit der
    Entscheidung 79/542/EWG des Rates festgelegten Liste aufgeführt sind'
  type: main
- language: da
  script: Latn
  content: '92/187/EØF: Kommissionens beslutning af 28. februar 1992 om betingelserne
    for indførsel af visse råvarer til den farmaceutiske industri fra tredjelande,
    som ikke er opført på listen i Rådets beslutning 79/542/EØF'
  type: main
- language: el
  script: Grek
  content: '92/187/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Φεβρουαρίου 1992 για τη θέσπιση των όρων οι οποίοι
    πρέπει να ισχύουν προκειμένου για τις εισαγωγές
    ορισμένων πρώτων υλών της μεταποιητικής φαρμακοβιομηχανίας,
    προερχομένων από τις τρίτες χώρες οι οποίες
    δεν εμφαίνονται στον κατάλογο ο οποίος έχει
    καταρτισθεί με βάση την απόφαση 79/542/ΕΟΚ του
    Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '92/187/ETY: Komission päätös, tehty 28 päivänä helmikuuta 1992,
