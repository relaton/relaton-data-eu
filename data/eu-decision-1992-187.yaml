    non figurano nell''elenco di cui alla decisione 79/542/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '92/187/EEG: Beschikking van de Commissie van 28 februari 1992 houdende
    vastlegging van de voorwaarden voor de invoer van bepaalde grondstoffen voor de
    farmaceutische verwerkingsindustrie uit bepaalde derde landen die niet voorkomen
    op de lijst vastgelegd in Beschikking 79/542/EEG van de Raad'
  type: main
