title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 277/81 of 30 January 1981 fixing the standard
    values to be used in calculating financial compensation in respect of fishery
    products withdrawn from the market during the period from 2 February to 31 December
    1981
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 277/81 de la Commission, du 30 janvier 1981, fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    période du 2 février au 31 décembre 1981, intervenant dans le calcul de la
    compensation financière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 277/81 der Kommission vom 30. Januar 1981 zur Festsetzung
    des Pauschalwerts der aus dem Handel genommenen Fischereierzeugnisse, der zur
    Berechnung des finanziellen Ausgleichs für die Zeit vom 2. Februar bis 31. Dezember
    1981 herangezogen wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 277/81 af 30. januar 1981 om fastsættelse
    af den ved beregningen af den finansielle udligning anvendte fikserede værdi
    af fiskerivarer, der fjernes fra handelen i perioden fra den 2. februar til den
    31. december 1981
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 277/81 τής Επιτροπής
    τής 30ής Ιανουαρίου 1981 περί καθορισμού τής κατ
    αποκοπή αξίας τών προϊόντων αλιείας πού αποσύρονται
    από τήν αγορά κατά τήν περίοδο από 2 Φεβρουαρίου
    μέχρι 31 Δεκεμβρίου 1981, ή οποία παρεμβαίνει
    στόν υπολογισμό τής χρηματικής αντισταθμίσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 277/81 della Commissione, del 30 gennaio 1981, che
    fissa il valore forfettario dei prodotti della pesca ritirati dal mercato durante
    il periodo dal 2 febbraio fino al 31 dicembre 1981 che figura nel calcolo della
    compensazione finanziaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 277/81 van de Commissie van 30 januari 1981 betreffende
    de vaststelling van de forfaitaire waarde van de in de periode van 2 februari
    tot en met 31 december 1981 uit de markt genomen visserijprodukten voor de berekening
    van de financiële vergoeding
