  content: Commission Regulation (EEC) No 1696/80 of 30 June 1980 fixing, for the
    1979/80 marketing year, the maximum amount of the contribution to storage costs
    which sugar manufacturers may require of beet and cane producers when sugar is
    carried forward
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1696/80 de la Commission, du 30 juin 1980, fixant,
