title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1748/91 of 19 June 1991 re-establishing
    the levying of customs duties on products falling within CN codes 8523 and 8524,
    originating in China, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1748/91 DE LA COMMISSION du 19 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 8523
    et 8524 originaires de la Chine, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1748/91 DER KOMMISSION vom 19. Juni 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 8523 und 8524 mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1748/91 af 19. juni 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8523 og 8524 og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1748/91 της Επιτροπής
    της 19ης Ιουνίου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    των κωδικών ΣΟ 8523 και 8524 καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1748/91 DELLA COMMISSIONE del 19 giugno 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 8523 e 8524 originari della Cina, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1748/91 VAN DE COMMISSIE van 19 juni 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 8523 en 8524, van oorsprong uit China, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1748/91 DA COMISSAO, DE 19 DE JUNHO DE 1991, QUE
    RESTABELECE A COBRANCA DOS DIREITOS ADUANEIROS APLICAVEIS AOS PRODUTOS DOS CODIGOS
    NC 8523 E 8524, ORIGINARIOS DA CHINA, BENEFICIARIOS DAS PREFERENCIAS PAUTAIS PELO
    REGULAMENTO ( CEE ) NO 3831/90 DO CONSELHO
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1748/91 DE LA COMISIÓN de 19 de junio de 1991 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos de los códigos NC 8523 y 8524 originarios de China beneficiarios de
    las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90 del
    Consejo #'
