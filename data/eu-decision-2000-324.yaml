title:
- language: en
  script: Latn
  content: '2000/324/EC: Commission Decision of 25 April 2000 amending Decision 1999/215/EC
    accepting undertakings offered in connection with the anti-dumping proceedings
    concerning imports of polypropylene binder or baler twine originating in Poland,
    the Czech Republic and Hungary and terminating the proceeding in respect of such
    imports originating in Saudi Arabia (notified under document number C(2000) 1058)'
  type: main
- language: fr
  script: Latn
  content: '2000/324/CE: Décision de la Commission du 25 avril 2000 portant modification
    de la décision 1999/215/CE portant acceptation des engagements offerts dans le
    cadre de la procédure antidumping concernant les importations de ficelle lieuse
    ou botteleuse en polypropylène originaire de Pologne, de la République tchèque
    et de Hongrie et clôturant la procédure concernant les importations originaires
    d''Arabie saoudite [notifiée sous le numéro C(2000) 1058]'
  type: main
- language: de
  script: Latn
  content: '2000/324/EG: Beschluß der Kommission vom 25. April 2000 über die Änderung
    des Beschlusses 1999/215/EG zur Annahme von Verpflichtungsangeboten im Zusammenhang
    mit den Antidumpingverfahren betreffend die Einfuhren von Binde- oder Pressengarnen
    aus Polypropylen mit Ursprung in Polen, der Tschechischen Republik und Ungarn
    und zur Einstellung des Verfahrens gegenüber solchen Einfuhren mit Ursprung in
    Saudi-Arabien (Bekanntgegeben unter Aktenzeichen K(2000) 1058)'
  type: main
- language: da
  script: Latn
  content: '2000/324/EF: Kommissionens afgørelse af 25. april 2000 om ændring af
    afgørelse 1999/215/EF om godtagelse af tilsagn afgivet i forbindelse med antidumpingproceduren
    vedrørende importen af binde- og pressegarn med oprindelse i Polen, Tjekkiet
    og Ungarn og om afslutningen af proceduren med hensyn til importen af sådanne
    varer med oprindelse i Saudi-Arabien (meddelt under nummer K(2000) 1058)'
  type: main
- language: el
  script: Grek
  content: '2000/324/ΕΚ: Απόφαση της Επιτροπής, της 25ης
    Απριλίου 2000, για τροποποίηση της απόφασης 1999/215/ΕΚ
    για την αποδοχή των αναλήψεων υποχρεώσεων
    που προτάθηκαν σε σχέση με τη διαδικασίας αντιντάμπινγκ
    όσον αφορά τις εισαγωγές σπάγκων για δεσίματα
    ή δεματιάσματα από πολυπροπυλένιο καταγωγής
    Πολωνίας, Τσεχικής Δημοκρατίας και Ουγγαρίας
    και για την περάτωση της διαδικασίας όσον αφορά
    αυτές τις εισαγωγές καταγωγής Σαουδικής Αραβίας
    [κοινοποιηθείσα υπό τον αριθμό Ε(2000) 1058]'
  type: main
- language: fi
  script: Latn
  content: '2000/324/EY: Komission päätös, tehty 25 päivänä huhtikuuta 2000,
    Puolasta, Tsekin tasavallasta ja Unkarista peräisin olevan polypropeenista valmistetun
    lyhdelangan ja paalinarun tuontia koskevan polkumyyntimenettelyn yhteydessä esitettyjen
    sitoumusten hyväksymisestä ja menettelyn sellaisen Saudi-Arabiasta peräisin
    olevan tuonnin osalta päättämisestä tehdyn päätöksen 1999/215/EY muuttamisesta
    (tiedoksiannettu numerolla K(2000) 1058)'
  type: main
- language: it
  script: Latn
  content: '2000/324/CE: Decisione della Commissione, del 25 aprile 2000, che modifica
    la decisione 1999/215/CE che accetta gli impegni offerti in relazione ai procedimenti
    antidumping riguardanti le importazioni di spago di polipropilene originario della
    Polonia, della Repubblica ceca e dell''Ungheria e che chiude il procedimento nei
    riguardi di tali importazioni originarie dell''Arabia Saudita [notificata con
    il numero C(2000) 1058]'
  type: main
- language: nl
  script: Latn
  content: '2000/324/EG: Besluit van de Commissie van 25 april 2000 houdende wijziging
    van Besluit 1999/215/EG tot aanvaarding van verbintenissen die zijn aangeboden
    in verband met de antidumpingprocedures met betrekking tot de invoer van bindtouw
    van polypropyleen van oorsprong uit Polen, de Tsjechische Republiek en Hongarije
    en tot beëindiging van de procedure ten aanzien van dergelijke uitvoer uit Saoedi-Arabië
    (kennisgeving geschied onder nummer C(2000) 1058)'
  type: main
- language: pt
  script: Latn
  content: '2000/324/CE: Decisão da Comissão, de 25 de Abril de 2000, que altera
    a Decisão 1999/215/CE que aceita os compromissos oferecidos no âmbito dos processos
    anti-dumping relativos às importações de cordéis para atadeiras ou enfardadeiras
    de polipropileno originários da Polónia, da República Checa e da Hungria e
    que encerra o processo relativo às importações desse mesmo produto originárias
    da Arábia Saudita [notificada com o número C(2000) 1058]'
  type: main
- language: es
  script: Latn
  content: '2000/324/CE: Decisión de la Comisión, de 25 de abril de 2000, por la
    que se modifica la Decisión 1999/215/CE por la que se aceptan los compromisos
    ofrecidos con respecto a los procedimientos antidumping relativos a las importaciones
    de cuerdas para atadoras o gavilladoras de polipropileno originarias de Polonia,
    la República Checa y Hungría y por la que se da por concluido el procedimiento
    relativo a las importaciones de ese producto originario de Arabia Saudí [notificada
    con el número C(2000) 1058]'
  type: main
- language: sv
  script: Latn
  content: '2000/324/EG: Kommissionens beslut av den 25 april 2000 om ändring av
    beslut 1999/215/EG om godtagande av åtaganden som gjorts i samband med antidumpningsförfarandena
    rörande import av skördegarn av polypropen med ursprung i Polen, Tjeckiska republiken
    och Ungern och om avslutande av det förfarande som avser import av skördegarn
    av polypropen med ursprung i Saudiarabien [delgivet med nr K(2000) 1058]'
