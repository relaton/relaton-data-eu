    στις προσφορές που κατατέθηκαν για τη 280ή μερική
    δημοπρασία που πραγματοποιείται στο πλαίσιο
    γενικών μέτρων παρεμβάσεως σύμφωνα με τον
    κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2473/2001, annettu 14 päivänä joulukuuta 2001,
    asetuksessa (ETY) N:o 1627/89 säädettyjen interventiota koskevien erityistoimenpiteiden
    mukaisesti toteutetun 280. osittaisen tarjouskilpailun ratkaisematta jättämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2473/2001 della Commissione, del 14 dicembre 2001,
    che decide di non dar seguito alle offerte presentate per la 280a gara parziale
    effettuata nel quadro delle misure generali d'intervento conformemente al regolamento
    (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2473/2001 van de Commissie van 14 december 2001 houdende
