    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2473/2001 da Comissão, de 14 de Dezembro de 2001,
    que rejeita as propostas apresentadas na sequência do 280.° concurso parcial
    efectuado no âmbito das medidas gerais de intervenção, em conformidade com
    o Regulamento (CEE) n.° 1627/89
  type: main
- language: es
