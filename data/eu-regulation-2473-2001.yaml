title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2473/2001 of 14 December 2001 deciding not
    to accept tenders submitted in response to the 280th partial invitation to tender
    as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2473/2001 de la Commission du 14 décembre 2001 disposant
    de ne pas donner suite aux offres déposées à la suite de la 280e adjudication
    partielle effectuée dans le cadre des mesures générales d'intervention conformément
    au règlement (CEE) n° 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2473/2001 der Kommission vom 14. Dezember 2001 über
    den Beschluss, den zur 280. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2473/2001 af 14. december 2001 om ikke
    at tage den 280. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    til følge i henhold til forordning (EØF) nr. 1627/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2473/2001 της Επιτροπής,
