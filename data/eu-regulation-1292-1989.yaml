  content: Council Regulation (EEC) No 1292/89 of 3 May 1989 amending Regulation (EEC)
    No 3/84 introducing arrangements for movement within the Community of goods sent
    from one Member State for temporary use in one or more other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1292/89 du Conseil du 3 mai 1989 modifiant le règlement
    (CEE) n° 3/84 instituant un régime de circulation intracommunautaire de marchandises
    expédiées d'un État membre en vue d'une utilisation temporaire dans un ou plusieurs
    autres États membres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1292/89 DES RATES vom 3. Mai 1989 zur Änderung der
