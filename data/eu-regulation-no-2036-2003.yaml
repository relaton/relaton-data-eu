title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2036/2003 of 19 November 2003 derogating
    from Regulation (EC) No 896/2001 as regards the fixing of adjustment coefficients
    to be applied to the reference quantity for each traditional operator under the
    tariff quotas for banana imports for 2004
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2036/2003 de la Commission du 19 novembre 2003 dérogeant
    au règlement (CE) n° 896/2001 en ce qui concerne la fixation des coefficients
    d'adaptation à appliquer à la quantité de référence de chaque opérateur
    traditionnel dans le cadre des contingents tarifaires à l'importation de bananes,
    pour l'année 2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2036/2003 der Kommission vom 19. November 2003 zur
    Abweichung von der Verordnung (EG) Nr. 896/2001 hinsichtlich der Festsetzung der
    Anpassungskoeffizienten für die Referenzmengen der traditionellen Marktbeteiligten
    im Rahmen der Zollkontingente für die Einfuhr von Bananen für das Jahr 2004
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2036/2003 ze dne 19. listopadu 2003, kterým
    se stanoví odchylka od nařízení (ES) č. 896/2001, pokud jde o stanovení
    vyrovnávacích koeficientů, které se mají použít na referenční množství
    každého tradičního hospodářského subjektu v rámci celních kvót pro dovozy
    banánů v roce 2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2036/2003 af 19. november 2003 om fravigelse
    af forordning (EF) nr. 896/2001 for så vidt angår fastsættelsen af de justeringskoefficienter,
    der skal anvendes på hver traditionel importørs referencemængde i forbindelse
    med toldkontingenterne for import af bananer for 2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2036/2003 της Επιτροπής,
    της 19ης Νοεμβρίου 2003, για παρέκκλιση από τον
    κανονισμό (ΕΚ) αριθ. 896/2001 όσον αφορά τον καθορισμό
    των συντελεστών προσαρμογής που θα εφαρμοστούν
    στην ποσότητα αναφοράς κάθε παραδοσιακού εμπορευομένου
    στο πλαίσιο των δασμολογικών ποσοστώσεων κατά
    την εισαγωγή μπανανών, για το έτος 2004
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2036/2003, 19. november 2003, millega kehtestatakse
    erand komisjoni määrusest (EÜ) nr 896/2001, millega määratakse kindlaks kõikide
    seniste ettevõtjate tariifikvootide alusel imporditavate banaanide individuaalsete
    kvootide suhtes kohaldatavad korrigeerimiskoefitsientid 2004. aastal
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2036/2003, annettu 19 päivänä marraskuuta
    2003, asetuksen (EY) N:o 896/2001 säännöksistä poikkeamisesta banaanien tuontitariffikiintiöiden
    kunkin perinteisen toimijan viitemäärään sovellettavien mukautuskertoimien
    osalta vuonna 2004
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2036/2003/EK rendelete (2003. november 19.) a 2004-es banánbehozatal
    vámkontingenseivel kapcsolatosan a hagyományos piaci szereplők referenciamennyiségére
    alkalmazandó kiigazítási együttható tekintetében a 896/2001/EK rendelettől
    való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2036/2003 della Commissione, del 19 novembre 2003,
    recante deroga al regolamento (CE) n. 896/2001 per quanto riguarda la fissazione
    dei coefficienti di adattamento da applicare per il 2004 al quantitativo di riferimento
    di ogni operatore tradizionale nel quadro dei contingenti tariffari per l'importazione
    di banane
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2036/2003 (2003. gada 19. novembris), ar kuru
    atkāpjas no Regulas (EK) Nr. 896/2001 attiecībā uz to pielāgošanas koeficientu
    noteikšanu, kas piemērojami katra tradicionālā tirgus dalībnieka references
    daudzumam saskaņā ar tarifu kvotām banānu importam 2004. gadam
  type: main
- language: lt
  script: Latn
  content: 2003 m. lapkričio 19 d. Komisijos reglamentas (EB) Nr. 2036/2003, nukrypstantis
    nuo Reglamento (EB) Nr. 896/2001 dėl korekcijos koeficientų, kiekvieno tradicinio
    operatoriaus referenciniam kiekiui taikytinų remiantis 2004 m. bananų importo
    tarifinėmis kvotomis
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 2036/2003 tad-19 ta’ Novembru
    2003 li jidderoga mir-Regolament (KE) Nru 896/2001 dwar l-iffissar ta’ ko-effiċjenti
    ta’ aġġustament li għandhom ikunu applikati għall-kwantita ta’ referenza
    għal kull operatur tradizzjonali taħt il-kwoti ta’ tariffa għal esportazzjonijiet
    ta’ banana għall-2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2036/2003 van de Commissie van 19 november 2003 tot
    afwĳking van Verordening (EG) nr. 896/2001 voor wat betreft de vaststelling,
    voor 2004, van de aanpassingscoëfficiënten die moeten worden toegepast op de
    referentiehoeveelheid van elke traditionele marktdeelnemer in het kader van de
    tariefcontingenten voor de invoer van bananen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2036/2003 z dnia 19 listopada 2003 r. wprowadzające
    odstępstwo od rozporządzenia (WE) nr 896/2001 w odniesieniu do ustalania współczynników
    dostosowujących, jakie mają być stosowane dla ilości referencyjnej każdego
    tradycyjnego podmiotu gospodarczego w ramach kontyngentów taryfowych na przywóz
    bananów na 2004 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2036/2003 da Comissão, de 19 de Novembro de 2003,
    que derroga ao Regulamento (CE) n.° 896/2001 no que respeita à fixação dos
    coeficientes de adaptação a aplicar à quantidade de referência de cada operador
    tradicional no quadro dos contingentes pautais de importação de bananas para
    2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2036/2003 z 19. novembra 2003 ustanovujúce
    výnimku z nariadenia (ES) č. 896/2001, pokiaľ ide o stanovenie koeficientov
    prispôsobenia, ktoré sa majú uplatňovať na referenčné množstvo každého
    tradičného operátora v rámci colných kvót pri dovoze banánov na rok 2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2036/2003 z dne 19. novembra 2003 o odstopanju
    od Uredbe (ES) št. 896/2001 glede določitev koeficientov prilagoditve, ki se
    uporabljajo pri referenčni količini za vsakega tradicionalnega izvajalca v okviru
    tarifnih kvot za uvoz banan za leto 2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2036/2003 de la Comisión, de 19 de noviembre de 2003,
    por el que se establece una excepción al Reglamento (CE) n° 896/2001 en lo que
    respecta a la determinación de los coeficientes de adaptación aplicables para
    el año 2004 a la cantidad de referencia de cada operador tradicional dentro de
    los contingentes arancelarios de importación de plátanos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2036/2003 av den 19 november 2003 om
    undantag från förordning (EG) nr 896/2001 vad beträffar justeringskoefficienterna
    för år 2004 för varje traditionell aktörs referenskvantitet inom ramen för
    tullkvoterna för import av bananer
  type: main
