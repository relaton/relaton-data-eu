title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 341/78 of 20 February 1978 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain, for the period 21 February to 31 May 1978
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 341/78 du Conseil, du 20 février 1978, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l'Espagne, pour la période allant du 21 février
    au 31 mai 1978
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 341/78 des Rates vom 20. Februar 1978 zur Festlegung
    von Übergangsmaßnahmen für die Zeit vom 21. Februar bis zum 31. Mai 1978 zur
    Erhaltung und Bewirtschaftung der Fischbestände gegenüber Schiffen, die die
    Flagge Spaniens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 341/78 af 20. februar 1978 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører Spaniens flag, i perioden
    21. februar - 31. maj 1978
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 341/78 del Consiglio, del 20 febbraio 1978, che stabilisce
    talune misure provvisorie per la conservazione e la gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Spagna, per il periodo dal 21 febbraio
    al 31 maggio 1978
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 341/78 van de Raad van 20 februari 1978 tot vaststelling
    van bepaalde overgangsmaatregelen voor de instandhouding en het beheer van de
    visbestanden, die in het tijdvak van 21 februari tot en met 31 mei 1978 van toepassing
    zijn op vaartuigen die de vlag van Spanje voeren
  type: main
