title:
- language: en
  script: Latn
  content: '92/234/EEC: Council Decision of 28 April 1992 authorizing the automatic
    renewal or maintenance in force of provisions governing matters covered by the
    common commercial policy contained in the friendship, trade and navigation treaties
    and similar agreements concluded between Member States and third countries'
  type: main
- language: fr
  script: Latn
  content: '92/234/CEE: Décision du Conseil du 28 avril 1992 autorisant la tacite
    reconduction ou le maintien en vigueur des dispositions dont les matières relèvent
    de la politique commerciale commune, contenues dans les traités d''amitié, de
    commerce et de navigation et accords similaires conclus par les États membres
    avec les pays tiers'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DES RATES vom 28. April 1992 zur Genehmigung der stillschweigenden
    Verlängerung oder der Beibehaltung der Bestimmungen von Freundschafts-, Handels-
    und Schiffahrtsverträgen sowie ähnlichen Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern, deren Gegenstand unter die gemeinsame Handelspolitik fällt
    (92/234/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 28. april 1992 om bemyndigelse til stiltiende videreførelse
    eller opretholdelse af bestemmelser, hvis indhold er omfattet af den fælles handelspolitik,
    og som er indeholdt i de venskabs-, handels- og skibsfartstraktater og lignende
    aftaler, som medlemsstaterne har indgået med tredjelande (92/234/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/234/ΕΟΚ: Απόφαση του Συμβουλίου της 28ης
    Απριλίου 1992 για την έγκριση της σιωπηρής ανανέωσης
    ή της διατήρησης σε ισχύ ορισμένων διατάξεων
    το αντικείμενο των οποίων υπάγεται στην κοινή
    εμπορική πολιτική και οι οποίες περιλαμβάνονται
    στις συνθήκες φιλίας, εμπορίου και ναυτιλίας
    και στις ομοειδείς συμφωνίες που έχουν συνάψει
    τα κράτη μέλη με τις τρίτες χώρες'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO del 28 aprile 1992 che autorizza il tacito rinnovo
    o il mantenimento in vigore delle disposizioni relative a materie che rientrano
    nella politica commerciale comune contenute nei trattati d'' amicizia, di commercio
    e di navigazione ed accordi analoghi conclusi dagli Stati membri con i paesi terzi
    (92/234/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE RAAD van 28 april 1992 houdende machtiging tot stilzwijgende
    verlenging of handhaving van de bepalingen betreffende aangelegenheden die vallen
    onder de gemeenschappelijke handelspolitiek en die vervat zijn in de tussen de
    Lid-Staten en derde landen gesloten vriendschaps-, handels- en scheepvaartverdragen
    en soortgelijke akkoorden (92/234/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DO CONSELHO de 28 de Abril de 1992 que autoriza a recondução
    tácita ou a manutenção em vigor das disposições cujas matérias sejam abrangidas
    pela política comercial comum e figurem nos tratados de amizade, de comércio
    e de navegação e em acordos similares celebrados pelos Estados-membros com países
    terceiros (92/234/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DEL CONSEJO de 28 de abril de 1992 por la que se autoriza la
    tácita reconducción o el mantenimiento en vigor de las disposiciones cuyas materias
    estén sujetas a la política comercial común contenidas en los tratados de amistad,
    comercio y navegación, y acuerdos similares celebrados por los Estados miembros
    con terceros países (92/234/CEE) #'
  type: main
