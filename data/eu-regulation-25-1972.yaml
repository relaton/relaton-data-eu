  content: Règlement (CEE) n 25/72 de la Commission, du 5 janvier 1972, supprimant
    la taxe compensatoire à l'importation de mandarines, satsumas, clémentines,
    tangérines et autres hybrides similaires d'agrumes en provenance de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 25/72 der Kommission vom 5. Januar 1972 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Mandarinen, Satsumas, Clementinen, Tangerinen
    und anderen ähnlichen Kreuzungen von Zitrusfrüchten aus der Türkei
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 25/72 della Commissione, del 5 gennaio 1972, che sopprime
    la tassa di compensazione all'importazione di mandarini, satsuma, clementine,
    tangerini ed altri ibridi similari d'agrumi in provenienza dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 25/72 van de Commissie van 5 januari 1972 houdende
    intrekking van de compenserende heffing op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten uit
    Turkije
  type: main
