    la flacără și instalațiile de alimentare a vehiculelor pentru vehicule cu
    gaz natural
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/2272 z 20. decembra 2021, ktorým
