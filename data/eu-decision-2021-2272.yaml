  content: Commission Implementing Decision (EU) 2021/2272 of 20 December 2021 amending
    Implementing Decision (EU) 2019/1616 as regards harmonised standards for seamless
    and welded stainless steel tubes, steel forgings for pressure purposes at high
    temperature and with high proof strength, unfired pressure vessels and vehicle
    fuelling appliances for natural gas vehicles
  type: main
- language: fr
  script: Latn
