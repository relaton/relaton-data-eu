    2021 modifiant la décision d’exécution (UE) 2019/1616 en ce qui concerne les
    normes harmonisées relatives aux tubes en acier inoxydable sans soudure et soudés,
    aux pièces forgées en acier pour appareils à pression avec propriétés spécifiées
    à température élevée, aux récipients sous pression non soumis à la flamme
    et aux bornes de distribution de carburant pour les véhicules fonctionnant au
    gaz naturel
  type: main
