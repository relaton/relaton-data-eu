title:
- language: en
  script: Latn
  content: '80/898/EEC: Commission Decision of 29 July 1980 authorizing the Italian
    Republic not to apply Community treatment to kraft wrapping and packaging paper,
    falling within heading No ex 48.01 of the Common Customs Tariff, originating in
    Czechoslovakia and in free circulation in the other Member States (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/898/CEE: Décision de la Commission, du 29 juillet 1980, autorisant
    la République italienne à exclure du traitement communautaire le papier kraft
    pour emballages de la position ex 48.01 du tarif douanier commun originaire de
    Tchécoslovaquie et mis en libre pratique dans les autres Etats membres (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/898/EWG: Entscheidung der Kommission vom 29. Juli 1980, mit der die
    Italienische Republik ermächtigt wird, aus der Tschechoslowakei stammendes und
    in den übrigen Mitgliedstaaten im freien Verkehr befindliches Kraftpackpapier
    der Tarifnummer ex 48.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/898/EØF: Kommissionens beslutning af 29. juli 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage kraftpapir
    til indpakning, som henhører under pos. ex 48.01 i den fælles toldtarif, har
    oprindelse i Tjekkoslovakiet og frit kan omsættes i de øvrige medlemsstater
    (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/898/CEE: Decisione della Commissione, del 29 luglio 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario la carta kraft
    da imballaggio della voce ex 48.01 della tariffa doganale comune, originaria della
    Cecoslovacchia e messa in libera pratica negli altri Stati membri (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/898/EEG: Beschikking van de Commissie van 29 juli 1980 waarbij de Italiaanse
    Republiek wordt gemachtigd kraftpapier (ander pakpapier) van post ex 48.01 van
    het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
