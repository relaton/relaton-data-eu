    εργαλείων χειρός, της κλάσεως 82.04 του Κοινού
    Δασμολογίου, καταγωγής Χονγκ Κονγκ, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3191/83 della Commissione dell' 11 novembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili agli altri utensili e
    utensileria a mano della voce 82.04 della tariffa doganale comune, originari di
    Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3191/83 van de Commissie van 11 november 1983 houdende
