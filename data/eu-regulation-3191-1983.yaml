title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3191/83 of 11 November 1983 re-establishing
    the levying of customs duties on other hand tools, falling within heading No 82.04
    and originating in Hong Kong, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3191/83 de la Commission du 11 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres outils
    et outillage à main, de la position 82.04 du tarif douanier commun, originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3191/83 der Kommission vom 11. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für anderes Handwerkszeug der Tarifnummer 82.04 mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3191/83 af 11. november 1983 om genindførelse
    af opkrævning af told for håndværktøj og håndredskaber, henhørende under
    pos. 82.04 og med oprindelse i Hongkong, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3191/83 της Επιτροπής
    της 11ης Νοεμβρίου 1983 περί αποκαταστάσεως της
