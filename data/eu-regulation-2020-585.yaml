    għall-2021, l-2022 u l-2023 biex tiġi żgurata l-konformità mal-livelli massimi
    ta’ residwi ta’ pestiċidi fl-ikel u fuq l-ikel li joriġina mill-pjanti u
    mill-annimali, u biex jiġi vvalutat l-esponiment tal-konsumatur għalihom
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/585 van de Commissie van 27 april 2020
