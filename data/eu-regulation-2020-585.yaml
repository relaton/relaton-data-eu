title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/585 of 27 April 2020 concerning
    a coordinated multiannual control programme of the Union for 2021, 2022 and 2023
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/585 de la Commission du 27 avril 2020
    concernant un programme de contrôle, pluriannuel et coordonné, de l’Union
    pour 2021, 2022 et 2023, destiné à garantir le respect des teneurs maximales
    en résidus de pesticides dans et sur les denrées alimentaires d’origine végétale
    et animale et à évaluer l’exposition du consommateur à ces résidus
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/585 der Kommission vom 27. April 2020
    über ein mehrjähriges koordiniertes Kontrollprogramm der Union für 2021, 2022
    und 2023 zur Gewährleistung der Einhaltung der Höchstgehalte an Pestizidrückständen
    und zur Bewertung der Verbraucherexposition gegenüber Pestizidrückständen in
    und auf Lebensmitteln pflanzlichen und tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/585 на Комисията
    от 27 април година 2020 относно координирана многогодишна
    контролна програма на Съюза за 2021, 2022 и 2023 г.
    за гарантиране на спазването на максимално
    допустимите граници на остатъчни вещества
    от пестициди във и върху храни от растителен
    и животински произход и за оценка на експозицията
    на потребителите на тези пестицидни остатъци
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/585 ze dne 27. dubna 2020 o koordinovaném
    víceletém kontrolním programu Unie pro roky 2021, 2022 a 2023 s cílem zajistit
    dodržování maximálních limitů reziduí pesticidů v potravinách rostlinného
    a živočišného původu a na jejich povrchu a vyhodnotit expozici spotřebitelů
    těmto reziduím pesticidů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2020/585 af 27. april 2020
    om et samordnet flerårigt EU-kontrolprogram for 2021, 2022 og 2023 med det formål
    at sikre overholdelse af maksimalgrænseværdierne for pesticidrester i og på
    vegetabilske og animalske fødevarer og at vurdere forbrugernes eksponering for
    disse rester
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/585 της Επιτροπής
