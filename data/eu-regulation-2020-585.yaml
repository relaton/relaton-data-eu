    de pesticidas no interior e à superfície dos alimentos de origem vegetal e animal
    e a avaliar a exposição dos consumidores a estes resíduos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/585 al Comisiei din 27 aprilie
    2020 privind un program de control multianual coordonat al Uniunii pentru 2021,
    2022 și 2023 vizând asigurarea respectării limitelor maxime de reziduuri de
    pesticide și evaluarea expunerii consumatorilor la reziduurile de pesticide din
    și de pe alimentele de origine vegetală și animală
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/585 z 27. apríla 2020 o koordinovanom
    viacročnom kontrolnom programe Únie na roky 2021, 2022 a 2023 s cieľom zabezpečiť
    dodržiavanie maximálnych hladín rezíduí pesticídov a posúdiť vystavenie
    spotrebiteľov rezíduám pesticídov v potravinách rastlinného a živočíšneho
