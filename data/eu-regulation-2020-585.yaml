    összehangolt uniós ellenőrzési programról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2020/585 della Commissione del 27 aprile
    2020 relativo a un programma coordinato di controllo pluriennale dell’Unione
    per il 2021, il 2022 e il 2023, destinato a garantire il rispetto dei livelli
    massimi di residui di antiparassitari e a valutare l’esposizione dei consumatori
    ai residui di antiparassitari nei e sui prodotti alimentari di origine vegetale
    e animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/585 (2020. gada 27. aprīlis)
    par saskaņotu Savienības daudzgadu kontroles programmu 2021., 2022. un 2023.
    gadam, kas pieņemta, lai nodrošinātu atbilstību maksimālajiem pesticīdu
    atlieku līmeņiem un novērtētu patērētāju eksponētību pesticīdu atliekām
    augu un dzīvnieku izcelsmes pārtikā un uz tās
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/585 2020 m. balandžio 27
