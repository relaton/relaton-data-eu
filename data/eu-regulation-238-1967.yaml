    relativo ad alcune misure di organizzazione comune dei mercati nel settore dello
    zucchero per la campagna 1967/1968
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 238/67/EEG van de Commissie van 30 juni 1967 betreffende
