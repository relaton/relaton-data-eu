    Maßnahmen zur gemeinsamen Marktorganisation für Zucker für das Wirtschaftsjahr
    1967/1968 erforderlich sind
  type: main
- language: it
  script: Latn
  content: Regolamento n. 238/67/CEE della Commissione, del 30 giugno 1967, riguardante
