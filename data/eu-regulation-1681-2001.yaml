title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1681/2001 of 22 August 2001 amending Regulation
    (EC) No 174/1999 laying down special detailed rules for the application of Council
    Regulation (EEC) No 804/68 as regards export licences and export refunds in the
    case of milk and milk products and Regulation (EC) No 1498/1999 laying down rules
    for the implementation of Council Regulation (EEC) No 804/68 as regards communications
    between the Member States and the Commission in the milk and milk products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1681/2001 de la Commission du 22 août 2001 modifiant
    le règlement (CE) n° 174/1999 établissant les modalités particulières d'application
    du règlement (CEE) n° 804/68 du Conseil en ce qui concerne les certificats d'exportation
    et des restitutions à l'exportation dans le secteur du lait et des produits laitiers
    et le règlement (CE) n° 1498/1999 portant modalités d'application du règlement
    (CEE) n° 804/68 du Conseil en ce qui concerne les communications entre les États
    membres et la Commission dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1681/2001 der Kommission vom 22. August 2001 zur Änderung
    der Verordnung (EG) Nr. 174/1999 mit besonderen Durchführungsvorschriften zur
    Verordnung (EWG) Nr. 804/68 des Rates im Hinblick auf die Ausfuhrlizenzen und
    die Ausfuhrerstattungen im Sektor Milch und Milcherzeugnisse und der Verordnung
    (EG) Nr. 1498/1999 mit Durchführungsbestimmungen zur Verordnung (EWG) Nr. 804/68
    des Rates hinsichtlich der gegenseitigen Mitteilungen der Mitgliedstaaten und
    der Kommission im Sektor Milch und Milcherzeugnisse
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1681/2001 ze dne 22. srpna 2001, kterým se
    mění nařízení (ES) č. 174/1999, kterým se stanoví zvláštní prováděcí
    pravidla k nařízení Rady (EHS) č. 804/68, pokud jde o vývozní licence a
    vývozní náhrady pro mléko a mléčné výrobky, a nařízení (ES) č. 1498/1999,
    kterým se stanoví prováděcí pravidla k nařízení Rady (EHS) č. 804/68,
    pokud jde o sdělení mezi členskými státy a Komisí v odvětví mléka a mléčných
    výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1681/2001 af 22. august 2001 om ændring
    af forordning (EF) nr. 174/1999 om særlige gennemførelsesbestemmelser til Rådets
    forordning (EØF) nr. 804/68 for så vidt angår anvendelsen af eksportlicenser
    og eksportrestitutioner for mælk og mejeriprodukter og forordning (EF) nr. 1498/1999
    om gennemførelsesbestemmelser til Rådets forordning (EØF) nr. 804/68 for så
    vidt angår meddelelser, der udveksles mellem medlemsstaterne og Kommissionen
    om mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1681/2001 της Επιτροπής,
    της 22ας Αυγούστου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 174/1999 περί καθορισμού των
    ειδικών λεπτομερειών εφαρμογής του κανονισμού
    (ΕΟΚ) αριθ. 804/68 του Συμβουλίου όσον αφορά τα
    πιστοποιητικά εξαγωγής και επιστροφές κατά
    την εξαγωγή στον τομέα του γάλακτος και των
    γαλακτοκομικών προϊόντων και την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1498/1999 για τις λεπτομέρειες
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 804/68 του
    Συμβουλίου όσον αφορά τις ανακοινώσεις μεταξύ
    των κρατών μελών και της Επιτροπής στον τομέα
    του γάλακτος και των γαλακτοκομικών προϊόντων
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1681/2001, 22. august 2001, millega muudetakse
    määrust (EÜ) nr 174/1999, millega kehtestatakse nõukogu määruse (EMÜ) nr
    804/68 rakendamise üksikasjalikud erieeskirjad piima ja piimatoodete ekspordilitsentside
    ja -toetuste kohta, ja määrust (EÜ) nr 1498/1999, millega sätestatakse nõukogu
    määruse (EMÜ) nr 804/68 rakenduseeskirjad liikmesriikide ja komisjoni vahelise
    teabevahetuse kohta piima ja piimatoodete sektoris
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1681/2001, annettu 22 päivänä elokuuta 2001,
    neuvoston asetuksen (ETY) N:o 804/68 soveltamista koskevista yksityiskohtaisista
    erityissäännöistä maito- ja maitotuotealan vientitodistusten ja vientitukien
    osalta annetun asetuksen (EY) N:o 174/1999 ja neuvoston asetuksen (ETY) N:o 804/68
    soveltamista koskevista yksityiskohtaisista säännöistä siltä osin kuin on
    kyse jäsenvaltioiden ja komission välisistä tiedonannoista maito- ja maitotuotealalla
    annetun asetuksen (EY) N:o 1498/1999 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1681/2001/EK rendelete (2001. augusztus 22.) a tejre és tejtermékekre
    vonatkozó kiviteli engedélyek és export-visszatérítések tekintetében a
    804/68/EGK tanácsi rendelet alkalmazására vonatkozó különös részletes
    szabályok megállapításáról szóló 174/1999/EK rendelet, valamint a tej-
    és tejtermékágazatban a tagállamok és a Bizottság közötti információcsere
    tekintetében a 804/68/EGK tanácsi rendelet végrehajtási szabályainak megállapításáról
    szóló 1498/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1681/2001 della Commissione, del 22 agosto 2001, che
    modifica il regolamento (CE) n. 174/1999, recante modalità particolari di applicazione
    del regolamento (CEE) n. 804/68 del Consiglio, riguardo ai titoli di esportazione
    e alle restituzioni nel settore del latte e dei prodotti lattiero-caseari, e il
    regolamento (CE) n. 1498/1999, recante modalità di applicazione del regolamento
    (CEE) n. 804/68 del Consiglio in ordine alle comunicazioni tra gli Stati membri
    e la Commissione nel settore del latte e dei prodotti lattiero-caseari
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1681/2001 (2001. gada 22. augusts), ar kuru groza
    Regulu (EK) Nr. 174/1999, ar ko paredz īpašus sīki izstrādātus noteikumus
    Padomes Regulas (EEK) Nr. 804/68 piemērošanai attiecībā uz eksporta licencēm
    un eksporta kompensācijām pienam un piena produktiem, un Regulu (EK) Nr. 1498/1999,
    ar ko paredz noteikumus Padomes Regulas (EEK) Nr. 804/68 ieviešanai attiecībā
    uz saziņu starp dalībvalstīm un Komisiju piena un piena produktu nozarē
  type: main
- language: lt
  script: Latn
  content: 2001 m. rugpjūčio 22 d. Komisijos reglamentas (EB) Nr. 1681/2001, iš
    dalies keičiantis Reglamentą (EB) Nr. 174/1999, nustatantį išsamias specialiąsias
    Tarybos reglamento (EEB) Nr. 804/68 taikymo taisykles dėl pieno ir pieno produktų
    eksporto licencijų ir eksporto grąžinamųjų išmokų, ir Reglamentą (EB)
    Nr. 1498/1999, nustatantį Tarybos reglamento (EEB) Nr. 804/68 įgyvendinimo taisykles
    dėl valstybių narių ir Komisijos informacinių pranešimų pieno bei pieno
    produktų sektoriuje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1681/2001 tat-22 ta’Awwissu 2001
    li jemenda r-Regolament (KE) Nru 174/1999 li jippreskrivi regoli dettaljati speċjali
    fuq l-applikazzjoni tar-Regolament tal-Kunsill (KEE) Nru 804/68 dwar il-liċenzi
    ta’ l-esportazzjoni u r-rifużjonijiet ta’ l-esportazzjonijiet fil-każ tal-ħalib
    u l-prodotti tal-ħalib u r-Regolament (KE) Nru 1498/1999 li jippreskrivi r-regoli
    għall-implimentazzjoni tar-Regolament tal-Kunsill (KEE) Nru 804/68 rigward il-komunikazzjonijiet
    bejn l-Istati Membri u l-Kummissjoni fis-settur tal-ħalib u tal-prodotti tal-ħalib
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1681/2001 van de Commissie van 22 augustus 2001 houdende
    wĳziging van Verordening (EG) nr. 174/1999 tot vaststelling van de specifieke
    uitvoeringsbepalingen van Verordening (EEG) nr. 804/68 van de Raad inzake de uitvoercertificaten
    en de uitvoerrestituties in de sector melk en zuivelproducten, en van Verordening
    (EG) nr. 1498/1999 houdende uitvoeringsbepalingen van Verordening (EEG) nr. 804/68
    van de Raad betreffende de mededelingen van gegevens tussen de lidstaten en de
    Commissie in de sector melk en zuivelproducten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1681/2001 z dnia 22 sierpnia 2001 r. zmieniające
    rozporządzenie (WE) nr 174/1999 ustanawiające specjalne szczegółowe zasady
    stosowania rozporządzenia Rady (EWG) nr 804/68 w odniesieniu do pozwoleń na
    wywóz i refundacji wywozowych do mleka i przetworów mlecznych oraz rozporządzenie
    (WE) nr 1498/1999 ustanawiające zasady wdrażania rozporządzenia Rady (EWG)
    nr 804/68 w odniesieniu do wymiany informacji między Państwami Członkowskimi
    a Komisją, dotyczących sektora mleka i przetworów mlecznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1681/2001 da Comissão, de 22 de Agosto de 2001,
    que altera o Regulamento (CE) n.° 174/1999 que estabelece as normas especiais
    de execução do Regulamento (CEE) n.° 804/68 do Conselho no que respeita aos
    certificados de exportação e às restituições à exportação no sector do
    leite e dos produtos lácteos e o Regulamento (CE) n.° 1498/1999 que estabelece
    as modalidades de aplicação do Regulamento (CEE) n.° 804/68 do Conselho no
    que respeita às comunicações entre os Estados-Membros e a Comissão no sector
    do leite e dos produtos lácteos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1681/2001 z 22. augusta 2001, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 174/1999 stanovujúce osobitné podrobné pravidlá
    uplatňovania nariadenia Rady (EHS) č. 804/68 v súvislosti s vývoznými povoleniami
    a náhradami za vývoz v prípade mlieka a mliečnych výrobkov a nariadenie (ES)
    č. 1498/1999 stanovujúce pravidlá vykonávania nariadenia Rady (EHS) č. 804/68
    v súvislosti s komunikáciou medzi členskými štátmi a Komisiou v sektore
    mlieka a mliečnych výrobkov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1681/2001 z dne 22. avgusta 2001 o spremembi
    Uredbe (ES) št. 174/1999 o posebnih podrobnih pravilih za uporabo Uredbe Sveta
    (EGS) št. 804/68 glede izvoznih dovoljenj in izvoznih nadomestil za mleko in
    mlečne izdelke in Uredbe (ES) št. 1498/1999 o določitvi pravil za izvajanje
    Uredbe Sveta (EGS) št. 804/68 v zvezi s komuniciranjem med državami članicami
    in Komisijo v sektorju mleka in mlečnih izdelkov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1681/2001 de la Comisión, de 22 de agosto de 2001,
    que modifica el Reglamento (CE) n° 174/1999 por el que se establecen disposiciones
    específicas de aplicación del Reglamento (CEE) n° 804/68 del Consejo en lo
    relativo a los certificados de exportación y las restituciones por exportación
    en el sector de la leche y de los productos lácteos, y el Reglamento (CE) n°
    1498/1999 por el que se establecen disposiciones de aplicación del Reglamento
    (CEE) n° 804/68 del Consejo en lo relativo a las comunicaciones entre los Estados
    miembros y la Comisión en el sector de la leche y de los productos lácteos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1681/2001 av den 22 augusti 2001 om ändring
    av förordning (EG) nr 174/1999 om fastställande av särskilda tillämpningsföreskrifter
    till rådets förordning (EEG) nr 804/68 i fråga om exportlicenser och exportbidrag
    inom sektorn för mjölk och mjölkprodukter och av förordning (EG) nr 1498/1999
    om tillämpningsföreskrifter till rådets förordning (EEG) nr 804/68 beträffande
    meddelanden mellan medlemsstaterna och kommissionen med avseende på mjölk och
    mjölkprodukter
