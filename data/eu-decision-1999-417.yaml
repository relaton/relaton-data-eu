    estabelecimentos dos Estados Unidos da América aprovados para a importação
    de carnes frescas na Comunidade e que altera a Decisão 79/542/CEE do Conselho
    que estabelece uma lista de países terceiros de onde os Estados-Membros autorizam
    a importação de animais das espécies bovina e suína e de carne fresca [notificada
