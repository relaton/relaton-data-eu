title:
- language: en
  script: Latn
  content: '1999/417/EC: Commission Decision of 16 June 1999 amending Decision 1999/301/EC
    amending Decision 87/257/EEC on the list of establishments in the United States
    of America approved for the purpose of importing fresh meat into the Community
    and amending Council Decision 79/542/EEC drawing up a list of third countries
    from which the Member States authorise imports of bovine animals, swine, fresh
    meat and meat products (notified under document number C(1999) 1709)'
  type: main
- language: fr
  script: Latn
  content: '1999/417/CE: Décision de la Commission, du 16 juin 1999, modifiant la
    décision 1999/301/CE modifiant la décision 87/257/CEE relative à la liste des
    établissements des États-Unis d''Amérique agréés pour l''importation de viandes
    fraîches dans la Communauté et la décision 79/542/CEE du Conseil établissant
    une liste des pays tiers en provenance desquels les États membres autorisent
    l''importation d''animaux des espèces bovine et porcine, de viandes fraîches
    et de produits à base de viande [notifiée sous le numéro C(1999) 1709]'
  type: main
- language: de
  script: Latn
  content: '1999/417/EG: Entscheidung der Kommission vom 16. Juni 1999 zur Änderung
    der Entscheidung 1999/301/EG der Kommission zur Änderung der Entscheidung 87/257/EWG
    über eine Liste der Betriebe in den Vereinigten Staaten von Amerika, die zur
    Einfuhr frischen Fleisches in die Gemeinschaft zugelassen sind, und zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung einer Liste von Drittländern,
    aus denen die Mitgliedstaaten Einfuhren von Rindern, Schweinen, Einhufern, Schafen
    und Ziegen sowie von frischem Fleisch und Fleischerzeugnissen zulassen (Bekanntgegeben
    unter Aktenzeichen K(1999) 1709)'
  type: main
- language: da
  script: Latn
