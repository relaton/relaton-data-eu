    listen over virksomheder i Amerikas Forenede Stater, der er godkendt til indførsel
    af fersk kød til Fællesskabet, og om ændring af Rådets beslutning 79/542/EØF
    om listen over de tredjelande, hvorfra medlemsstaterne tillader indførsel af
    kvæg, svin, fersk kød og kødprodukter (meddelt under nummer K(1999) 1709)'
  type: main
