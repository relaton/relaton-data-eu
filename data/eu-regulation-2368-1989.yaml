    κανονισμού (ΕΟΚ) αριθ. 3951/89 για τον καθορισμό,
    για το 1989, των αλιευτικών δυνατοτήτων για ορισμένα
    αποθέματα ιχθύων στη ζώνη διακανονισμού που
    ορίζεται από τη σύμβαση NAFO
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2368/89 DEL CONSIGLIO del 28 luglio 1989 recante
    modifica del regolamento (CEE) n. 3951/88 che fissa per il 1989 le possibilità
    di catture per alcune popolazioni o gruppi di popolazioni ittiche nella zona di
    regolamentazione definita dalla convenzione NAFO #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2368/89 VAN DE RAAD van 28 juli 1989 tot wijziging
