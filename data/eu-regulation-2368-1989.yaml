  content: Council Regulation (EEC) No 2368/89 of 28 July 1989 amending Regulation
    (EEC) No 3951/88 fixing catch possibilities for 1989 for certain fish stocks and
    groups of fish stocks in the Regulatory Area as defined in the NAFO Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2368/89 du Conseil du 28 juillet 1989 modifiant le
    règlement (CEE) n° 3951/88 fixant pour 1989 les possibilités de captures pour
    certains stocks ou groupes de stocks de poissons dans la zone de réglementation
    définie par la convention de l'Organisation des pêches de l'Atlantique du Nord-Ouest
    (NAFO)
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2368/89 DES RATES vom 28. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 3951/88 zur Festlegung der Fangmöglichkeiten für bestimmte
    Fischbestände oder Bestandsgruppen im Regelungsbereich des NAFO-Übereinkommens
    für 1989 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2368/89 af 28. juli 1989 om ændring af forordning
    (EØF) nr. 3951/88 om fastsættelse af fangstmulighederne for 1989 for visse fiskebestande
    og grupper af fiskebestande i det af NAFO-konventionen regulerede område
  type: main
- language: el
  script: Grek
