    Consiglio, sull’adesione volontaria delle organizzazioni a un sistema comunitario
    di ecogestione e audit (EMAS) [notificata con il numero C(2020) 8151]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2020/1802 (2020. gada 27. novembris), ar ko groza
    norādījumus par darbībām, kas vajadzīgas, lai piedalītos EMAS saskaņā
    ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1221/2009 par organizāciju brīvprātīgu
