  script: Latn
  content: Regolamento (CEE) n. 1644/88 della Commissione del 13 giugno 1988 che ripristina
    la riscossione dei dazi doganali applicabili alle gonne per donna o per ragazza
    della categoria di prodotti 27 (numero d' ordine 40.0270) e ai cappotti, giacche
    e altri vestiti a maglia della categoria di prodotti n. 83 (numero d' ordine 40.0830),
