title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1644/88 of 13 June 1988 re-establishing
    the levying of customs duties on women' s or girls' skirts, products of category
    27 (order No 40.0270) and overcoats, jackets, blazers and other garments, knitted
    or crocheted, products of category 83 (order No 40.0830), originating in India,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1644/88 de la Commission du 13 juin 1988 portant rétablissement
    de la perception des droits de douane applicables aux jupes, pour femmes ou fillettes,
    de la catégorie 27 (numéro d' ordre 40.0270) aux manteaux, vestes et autres
    vêtements, en bonneterie, de la catégorie 83 (numéro d' ordre 40.0830), originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1644/88 der Kommission vom 13. Juni 1988 zur Wiedereinführung
    des Zollsatzes für Röcke für Frauen und Mädchen der Warenkategorie Nr. 27
    (lfd. Nr. 40.0270) sowie Mäntel, Jacken und andere Bekleidung aus Gewirken der
    Warenkategorie Nr. 83 (lfd. Nr. 40.0830) mit Ursprung in Indien, dem die in der
    Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1644/88 af 13. juni 1988 om genindførelse
    af opkrævning af toldafgifter for nederdele til kvinder og piger (kategori 27,
    løbenummer 40.0270) og frakker, jakker og andre beklædningsgenstande (kategori
    83, løbenummer 40.0830), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
