    dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3506/90 af 3. december 1990 om genindførelse
