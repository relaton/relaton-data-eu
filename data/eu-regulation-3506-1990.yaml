title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3506/90 of 3 December 1990 re-establishing
    the levying of the customs duties on products falling within CN code 4203, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 3506/90 de la Commission, du 3 décembre 1990, portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 4203 originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) nº 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3506/90 der Kommission vom 3. Dezember 1990 zur Wiedereinführung
