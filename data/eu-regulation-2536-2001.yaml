schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2536/2001 of 21 December 2001 amending, for
    the third time, Council Regulation (EC) No 1705/98 concerning the interruption
    of certain economic relations with Angola in order to induce the "União Nacional
    para a Independência Total de Angola" (UNITA) to fulfil its obligations in the
    peace process, and repealing Regulation (EC) No 2229/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2536/2001 de la Commission du 21 décembre 2001 modifiant,
    pour la troisième fois, le règlement (CE) n° 1705/98 du Conseil concernant
    l'interruption de certaines relations économiques avec l'Angola afin d'inciter
    l'"União Nacional para a Independência Total de Angola" (UNITA) à remplir ses
    obligations dans le processus de paix, et abrogeant le règlement (CE) n° 2229/97
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2536/2001 der Kommission vom 21. Dezember 2001 zur
    dritten Änderung der Verordnung (EG) Nr. 1705/98 des Rates betreffend die Aussetzung
    bestimmter wirtschaftlicher Beziehungen zu Angola zur Veranlassung der "União
    Nacional para a Independencia Total de Angola" (UNITA) zur Erfüllung ihrer Verpflichtungen
    im Rahmen des Friedensprozesses und zur Aufhebung der Verordnung (EG) Nr. 2229/97
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2536/2001 af 21. december 2001 om ændring
    for tredje gang af Rådets forordning (EF) nr. 1705/98 om afbrydelse af visse
    økonomiske forbindelser med Angola med henblik på at anspore "União Nacional
    para a Independência Total de Angola" (UNITA) til at indfri sine forpligtelser
    som led i fredsprocessen og om ophævelse af forordning (EF) nr. 2229/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2536/2001 της Επιτροπής,
    της 21ης Δεκεμβρίου 2001, για την τροποποίηση,
    για τρίτη φορά, του κανονισμού (ΕΚ) αριθ. 1705/98
    του Συμβουλίου όσον αφορά τη διακοπή ορισμένων
    οικονομικών σχέσεων με την Αγκόλα, προκειμένου
    να παρακινηθεί η "União Nacional para a Independencia Total de
    Angola" (UNITΑ) να εκπληρώσει τις υποχρεώσεις της
    κατά την ειρηνευτική διαδικασία και για την
    κατάργηση του κανονισμού (ΕΚ) αριθ. 2229/97 του
    Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2536/2001, annettu 21 päivänä joulukuuta 2001,
    tiettyjen taloussuhteiden keskeyttämisestä Angolaan "União Nacional para a
    Independência Total de Angola'n" (UNITA) taivuttamiseksi täyttämään velvollisuutensa
    rauhanprosessissa ja asetuksen (EY) N:o 2229/97 kumoamisesta annetun neuvoston
    asetuksen (EY) N:o 1705/98 muuttamisesta kolmanteen kertaan
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2536/2001 della Commissione, del 21 dicembre 2001,
    che modifica, per la terza volta, il regolamento (CE) n. 1705/98 del Consiglio
    relativo all'interruzione di alcune relazioni economiche con l'Angola per indurre
    l'"Unione nazionale per l'indipendenza totale dell'Angola" (UNITA) a rispettare
    gli obblighi assunti nell'ambito del processo di pace e che abroga il regolamento
    (CE) n. 2229/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2536/2001 van de Commissie van 21 december 2001 houdende
    derde wĳziging van Verordening (EG) nr. 1705/98 van de Raad inzake de onderbreking
    van bepaalde economische betrekkingen met Angola, teneinde de União Nacional
    para a Independência Total de Angola (UNITA) ertoe te bewegen zich aan zĳn verplichtingen
    krachtens het vredesproces te houden, en tot intrekking van Verordening (EG) nr.
    2229/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2536/2001 da Comissão, de 21 de Dezembro de 2001,
    que altera, pela terceira vez, o Regulamento (CE) n.° 1705/98 do Conselho relativo
    à interrupção de certas relações económicas com Angola para induzir a União
    Nacional para a Independência Total de Angola (UNITA) a cumprir as suas obrigações
    no processo de paz, e que revoga o Regulamento (CE) n.° 2229/97 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2536/2001 de la Comisión, de 21 de diciembre de 2001,
    por el que se modifica, por tercera vez, el Reglamento (CE) n° 1705/98 del Consejo
    relativo a la interrupción de determinadas relaciones económicas con Angola
    a fin de inducir a la "União Nacional para a Independência Total de Angola"
    (UNITA) a cumplir sus obligaciones en el proceso de paz, y por el que se deroga
    el Reglamento (CE) n° 2229/97
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2536/2001 av den 21 december 2001 om
    ändring för tredje gången av rådets förordning (EG) nr 1705/98 om avbrytande
    av vissa ekonomiska förbindelser med Angola för att få "União Nacional para
    a Independência Total de Angola" (Unita) att uppfylla sina skyldigheter i fredsprocessen
    samt om upphävande av förordning (EG) nr 2229/97
  type: main
