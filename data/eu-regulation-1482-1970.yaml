title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1482/70 de la Commission, du 24 juillet 1970, relatif
    à des mesures d'application concernant les importations de riz et brisures originaires
    des États africains et malgache associés ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1482/70 der Kommission vom 24. Juli 1970 über Durchführungsmaßnahmen
    für die Einfuhren von Reis und Bruchreis mit Ursprung in den assoziierten afrikanischen
    Staaten und Madagaskar oder den überseeischen Ländern und Gebieten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1482/70 della Commissione, del 24 luglio 1970, relativo
    a misure d'applicazione per quanto concerne le importazioni di riso e di rotture
    di riso originari degli Stati africani e malgascio associati o dei paesi e territori
    d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1482/70 van de Commissie van 24 juli 1970 houdende
    uitvoeringsbepalingen voor de invoer van rijst en breukrijst van oorsprong uit
    de geassocieerde Afrikaanse staten en Madagaskar of uit de landen en gebieden
    overzee
  type: main
