---
id: EUDecision198011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 3 December 1979 authorizing the Italian Republic
    not to apply Community treatment to man-made fibres (discontinuous), not carded,
    combed or otherwise prepared for spinning, falling within heading No 56.01 of
    the Common Customs Tariff, originating in Romania and in free circulation in the
    other Member States (Only the Italian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 décembre 1979, autorisant la République
    italienne à exclure du traitement communautaire les fibres textiles synthétiques
    et artificielles discontinues en masse, de la position 56.01 du tarif douanier
    commun, originaires de Roumanie et mises en libre pratique dans les autres Etats
    membres (Le texte en langue italienne est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 3. Dezember 1979, mit der die Italienische
    Republik ermächtigt wird, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche synthetische und künstliche Spinnfasern, weder
    gekrempelt noch gekämmt, der Tarifnummer 56.01 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen (Nur der italienische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 3. december 1979 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage korte kemofibre, ikke kartede,
    kæmmede eller på anden måde beredte til spinding, som henhører under pos.
    56.01 i den fælles toldtarif har oprindelse i Rumænien og frit kan omsættes
    i de øvrige medlemsstater (Kun den italienske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 3 dicembre 1979, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario il fiocco di fibre tessili sintetiche
    artificiali della voce 56.01 della tariffa doganale comune, originari della Romania
    e messi in libera pratica negli altri Stati membri (Il testo in lingua italiana
    è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 3 december 1979 waarbij de Italiaanse
    Republiek wordt gemachtigd synthetische of kunstmatige stapelvezels van post 56.01
    van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)
  type: main
