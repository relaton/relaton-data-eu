title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2978/74 of the Commission of 26 November 1974 laying
    down conditions for the sale for export of skimmed-milk powder held by intervention
    agencies and concerning the adjustment of refunds fixed in advance for skimmed-milk
    powder not coming from intervention stocks
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2978/74 de la Commission, du 26 novembre 1974, déterminant
    les conditions de vente du lait écrémé en poudre détenu par les organismes
    d'intervention et destiné à l'exportation et relatif à l'ajustement des restitutions
    fixées à l'avance pour le lait écrémé en poudre ne provenant pas des stocks
    d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2978/74 der Kommission vom 26. November 1974 zur Festlegung
    der Verkaufsbedingungen für Magermilchpulver aus Beständen der Interventionsstellen
    für die Ausfuhr und über die Berichtigung der im voraus festgesetzten Erstattungen
    für Magermilchpulver, das nicht aus dem Besitz der Interventionsstellen stammt
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2978/74 af 26. november 1974 om fastsættelse
    af betingelserne for salg med henblik på udførsel af skummetmælkspulver, som
    interventionsorganerne ligger inde med, og om justering af forudfastsatte restitutioner
    for skummetmælkspulver, der ikke hidrører fra interventionslagre
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2978/74 della Commissione, del 26 novembre 1974, che
    stabilisce le condizioni di vendita del latte scremato in polvere detenuto dagli
    organismi d'intervento e destinato all'esportazione e che disciplina l'adeguamento
    delle restituzioni fissate in anticipo per il latte scremato in polvere non proveniente
    dalle scorte d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2978/74 van de Commissie van 26 november 1974 houdende
    vaststelling van de voorwaarden voor de verkoop van magere-melkpoeder in het bezit
    van de interventiebureaus en bestemd voor uitvoer en met betrekking tot vooraf
    vastgestelde restituties voor magere-melkpoeder dat niet afkomstig is van interventievoorraden
  type: main
