title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2752/73 of the Commission of 10 October 1973 amending
    Regulation (EEC) No 2637/70 in respect of the period of validity of advance fixing
    certificates for certain agricultural products, exported in the form of goods
    not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2752/73 de la Commission, du 10 octobre 1973, modifiant
    le règlement (CEE) n° 2637/70 en ce qui concerne la durée de validité des
    certificats de préfixation de certains produits agricoles exportés sous forme
    de marchandises ne relevant pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2752/73 der Kommission vom 10. Oktober 1973 zur Änderung
    der Verordnung (EWG) Nr. 2637/70 hinsichtlich der Gültigkeitsdauer der Vorausfestsetzungsbescheinigungen
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von Waren ausgeführt
    werden, die nicht unter Anhang II des Vertrages fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2752/73 af 10. oktober 1973 om ændring
    af forordning (EØF) nr. 2637/70 for så vidt angår gyldighedsperioden for forudfastsættelsesattester
    for visse landbrugsprodukter, der udføres i form af varer, som ikke omfattes
    af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2752/73 della Commissione, del 10 ottobre 1973, che
    modifica il regolamento (CEE) n. 2637/70 per quanto concerne la durata della validità
    dei certificati di fissazione anticipata di alcuni prodotti agricoli esportati
    sotto forma di merci non comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2752/73 van de Commissie van 10 oktober 1973 houdende
    wijziging van Verordening (EEG) nr. 2637/70 voor zover het betreft de geldigheidsduur
    van voorfixatiecertificaten voor bepaalde landbouwprodukten uitgevoerd in de vorm
    van niet onder bijlage II van het Verdrag vallende goederen
