title:
- language: en
  script: Latn
  content: '79/162/EEC: Commission Decision of 22 December 1978 on the granting by
    the Guidance Section of the EAGGF to the Federal Republic of Germany of a payment
    on account in respect of expenditure incurred during 1977 on aids and premiums
    relating to the modernization of farms including those in the less-favoured farming
    areas (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/162/CEE: Décision de la Commission, du 22 décembre 1978, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République fédérale d''Allemagne d''un acompte
    sur les dépenses effectuées pendant l''année 1977 pour les aides et primes
    relatives à la modernisation des exploitations agricoles, y compris dans les
    zones agricoles défavorisées (Le texte en langue allemande est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '79/162/EWG: Entscheidung der Kommission vom 22. Dezember 1978 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1977 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen und Prämien
    - einschließlich der Hilfen für benachteiligte landwirtschaftliche Gebiete -
    getätigten Ausgaben an die Bundesrepublik Deutschland (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/162/EØF: Kommissionens beslutning af 22. december 1978 om udbetaling
    gennem EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1977 til støtte og præmier
    vedrørende modernisering af landbrugsbedrifter, herunder sådanne beliggende
    i ugunstigt stillede områder (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/162/CEE: Decisione della Commissione, del 22 dicembre 1978, relativa
    al versamento da parte del FEAOG, sezione orientamento, alla Repubblica federale
    di Germania di un anticipo sulle spese effettuate durante il 1977 per gli aiuti
    ed i premi relativi all''ammodernamento delle aziende agricole, comprese quelle
    nelle zone agricole svantaggiate (Il testo in lingua tedesca è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/162/EEG: Beschikking van de Commissie van 22 december 1978 betreffende
    de betaling door het EOGFL, afdeling Oriëntatie, aan de Bondsrepubliek Duitsland
    van een voorschot in verband met de in 1977 verrichte uitgaven voor steun en premies
    met betrekking tot de modernisering van landbouwbedrijven, waaronder mede begrepen
    die in probleemgebieden in de landbouw (Slechts de tekst in de Duitse taal is
    authentiek)'
  type: main
