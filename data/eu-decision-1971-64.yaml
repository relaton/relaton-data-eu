title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 16 décembre 1970, portant octroi du concours
    du Fonds social européen au bénéfice du Royaume des Pays-Bas pour des dépenses
    relatives à des opérations de rééducation professionnelle et de réinstallation
    effectuées par le "Ministerie van sociale zaken en volksgezondheid"
  type: main
- language: de
  script: Latn
  content: '71/64/EWG: Entscheidung der Kommission vom 16. Dezember 1970 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an das Königreich
    der Niederlande zu Aufwendungen für vom "Ministerie van Sociale Zaken en Volksgezondheid"
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '71/64/CEE: Decisione della Commissione, del 16 dicembre 1970, che concede
    un contributo del Fondo sociale europeo al Regno dei Paesi Bassi per spese concernenti
    operazioni di riqualificazione e di nuova sistemazione effettuate dal «Ministerie
    van Sociale Zaken en Volksgezondheid»'
  type: main
- language: nl
  script: Latn
  content: '71/64/EEG: Beschikking van de Commissie van 16 december 1970 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van het
    Koninkrijk der Nederlanden voor door het Ministerie van Sociale Zaken en Volksgezondheid
    gemaakte herscholings- en verplaatsingskosten'
  type: main
