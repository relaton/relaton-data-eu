title:
- language: en
  script: Latn
  content: Council Directive 96/26/EC of 29 April 1996 on admission to the occupation
    of road haulage operator and road passenger transport operator and mutual recognition
    of diplomas, certificates and other evidence of formal qualifications intended
    to facilitate for these operators the right to freedom of establishment in national
    and international transport operations
  type: main
- language: fr
  script: Latn
  content: Directive 96/26/CE du Conseil, du 29 avril 1996, concernant l'accès à
    la profession de transporteur de marchandises et de transporteur de voyageurs
    par route ainsi que la reconnaissance mutuelle des diplômes, certificats et autres
    titres visant à favoriser l'exercice effectif de la liberté d'établissement
    de ces transporteurs dans le domaine des transports nationaux et internationaux
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/26/EG des Rates vom 29. April 1996 über den Zugang zum Beruf
    des Güter- und Personenkraftverkehrsunternehmers im innerstaatlichen und grenzüberschreitenden
    Verkehr sowie über die gegenseitige Anerkennung der Diplome, Prüfungszeugnisse
    und sonstigen Befähigungsnachweise für die Beförderung von Gütern und die
    Beförderung von Personen im Straßenverkehr und über Maßnahmen zur Förderung
    der tatsächlichen Inanspruchnahme der Niederlassungsfreiheit der betreffenden
    Verkehrsunternehmer
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/26/ЕО на Съвета от 29 април 1996
    година относно допускане до професията на
    автомобилен превозвач на товари и автомобилен
    превозвач на пътници и взаимно признаване
    на дипломи, удостоверения и други официални
    документи за професионална квалификация, предназначени
    да улеснят упражняването на правото на свободно
    установяване на тези превозвачи за осъществяване
    на вътрешни и международни превози
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/26/ES ze dne 29. dubna 1996 o přístupu k povolání
    provozovatele silniční přepravy zboží a provozovatele silniční přepravy
    osob, jakož i o vzájemném uznávání diplomů, osvědčení a jiných dokladů
    o dosažené kvalifikaci, s cílem umožnit účinný výkon svobody usazování
    těchto dopravců v oblasti vnitrostátní a mezinárodní dopravy
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/26/EF af 29. april 1996 om adgang til erhvervet godstransport
    ad landevej og erhvervet personbefordring ad landevej samt om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser, som skal lette
    den faktiske udøvelse af etableringsfrihed for de pågældende udøvere af transportvirksomhed
    inden for indenlandsk og international eksport
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/26/ΕΚ του Συμβουλίου, της 29ης Απριλίου
    1996, για την πρόσβαση στο επάγγελμα του οδικού
    μεταφορέα εμπορευμάτων και επιβατών και αμοιβαίας
    αναγνώρισης των διπλωμάτων, πιστοποιητικών
    και άλλων τίτλων που διευκολύνουν την πραγμάτωση
    του δικαιώματος εγκαταστάσεως των μεταφορέων
    αυτών στον τομέα των εσωτερικών και διεθνών
    μεταφορών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/26/EÜ, 29. aprill 1996, siseriiklike ja rahvusvaheliste
    vedude maanteeveo-ettevõtja ja reisijate autoveo-ettevõtja tegevusalale lubamise,
    nende diplomite, tunnistuste ja muude kvalifikatsiooni tõendavate dokumentide
    vastastikuse tunnustamise ning kõnealuste ettevõtjate asutamisvabaduse õiguse
    soodustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/26/EY, annettu 29 päivänä huhtikuuta 1996, maanteiden
    kansallisen ja kansainvälisen tavara- ja henkilöliikenteen harjoittajien ammattiin
    pääsystä sekä tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta
    osoittavien asiakirjojen vastavuoroisesta tunnustamisesta sekä toimenpiteistä
    näiden liikenteenharjoittajien sijoittautumisvapauden tehokkaan käyttämisen
    edistämiseksi
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/26/EK irányelve (1996. április 29.) a belföldi és nemzetközi
    közlekedés terén a közúti árufuvarozói és személyszállítói szakma
    gyakorlásának engedélyezéséről, valamint e személyek szabad letelepedéshez
    való joga gyakorlásának előmozdítása érdekében az oklevelek, bizonyítványok
    és képesítés megszerzéséről szóló egyéb tanúsítványok kölcsönös
    elismeréséről
  type: main
- language: it
  script: Latn
  content: Direttiva 96/26/CE del Consiglio, del 29 aprile 1996, riguardante l'accesso
    alla professione di trasportatore su strada di merci e di viaggiatori, nonché
    il riconoscimento reciproco di diplomi, certificati e altri titoli allo scopo
    di favorire l'esercizio della libertà di stabilimento di detti trasportatori
    nel settore dei trasporti nazionali ed internazionali
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/26/EK (1996. gada 29. aprīlis) par atļaušanu kravu
    autopārvadātājiem un pasažieru autopārvadātājiem veikt profesionālo darbību
    un par diplomu, sertifikātu un citu kvalifikāciju apliecinošo dokumentu savstarpēju
    atzīšanu, lai veicinātu šo pārvadātāju tiesības veikt uzņēmējdarbību
    iekšzemes un starptautisko autopārvadājumu nozarē
  type: main
- language: lt
  script: Latn
  content: 1996 m. balandžio 29 d. Tarybos Direktyva 96/26/EB dėl leidimo verstis
    krovinių ir keleivių vežėjo kelių transportu verslu ir diplomų, pažymėjimų
    bei kitų oficialių profesinę kvalifikaciją patvirtinančių dokumentų tarpusavio
    pripažinimo, skirto palengvinti šiems vežėjams naudojimąsi įsisteigimo laisve
    nacionalinio ir tarptautinio vežimo srityje
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill 96/26/KE tad-29 ta’ April 1996 dwar dħul għall-impjieg
    ta’ operatur ta’ trasport ta’ merkanzija bit-triq u operatur ta’ trasport
    ta’ passiġġieri bit-triq u r-rikonoxximent reċiproku ta’ diplomi, ċertifikati
    u evidenza oħra ta’ kwalifiki formali intenzjonati li jiffaċilitaw għal dawn
    l-operaturi d-dritt tal-libertà li jistabbilixxu ħidmiet ta’ trasport nazzjonali
    jew internazzjonali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/26/EG van de Raad van 29 april 1996 inzake de toegang tot
    het beroep van ondernemer van goederen-, respectievelijk personenvervoer over
    de weg, nationaal en internationaal, en inzake de wederzijdse erkenning van diploma's,
    certificaten en andere titels ter vergemakkelijking van de uitoefening van het
    recht van vrije vestiging van bedoelde vervoerondernemers
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/26/WE z dnia 29 kwietnia 1996 r. w sprawie dostępu do
    zawodu przewoźnika drogowego transportu rzeczy i przewoźnika drogowego transportu
    osób oraz wzajemnego uznawania dyplomów, świadectw i innych dokumentów potwierdzających
    posiadanie kwalifikacji, mająca na celu ułatwienie tym przewoźnikom korzystania
    z prawa swobody przedsiębiorczości w dziedzinie transportu krajowego i międzynarodowego
  type: main
- language: pt
  script: Latn
  content: Directiva 96/26/CE do Conselho, de 29 de Abril de 1996, relativa ao acesso
    à profissão de transportador rodoviário de mercadorias e de transportador rodoviário
    de passageiros, bem como ao reconhecimento mútuo dos diplomas, certificados e
    outros títulos, com o objectivo de favorecer o exercício efectivo da liberdade
    de estabelecimento desses transportadores no domínio dos transportes nacionais
    e internacionais
  type: main
- language: ro
  script: Latn
  content: Directiva 96/26/CE a Consiliului din 29 aprilie 1996 privind accesul la
    ocupația de operator de transport rutier de marfă și operator de transport
    rutier de călători și recunoașterea reciprocă a diplomelor, certificatelor
    și a altor titluri oficiale de calificare, pentru a facilita acestor operatori
    de transport dreptul la libera stabilire pentru operațiuni de transport național
    și internațional
  type: main
- language: sk
  script: Latn
  content: Smernica Rady č. 96/26/ES z 29. apríla 1996 o prístupe k povolaniu prevádzkovateľa
    cestnej nákladnej dopravy a prevádzkovateľa cestnej osobnej dopravy a o vzájomnom
    uznávaní diplomov, osvedčení a iných dokladov o formálnych kvalifikáciách
    s cieľom uľahčiť týmto prevádzkovateľom uplatňovanie slobody usadiť sa
    v oblasti vnútroštátnej a medzinárodnej dopravy
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/26/ES z dne 29. aprila 1996 o dovoljenju za opravljanje
    dejavnosti cestnega prevoznika v tovornem in potniškem prometu ter o medsebojnem
    priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah za
    olajšanje uresničevanja pravic teh prevoznikov do ustanavljanja prevoznih podjetij
    v domačem in mednarodnem prometu
  type: main
- language: es
  script: Latn
  content: Directiva 96/26/CE del Consejo, de 29 de abril de 1996, relativa al acceso
    a la profesión de transportista de mercancías y de transportista de viajeros
    por carretera, así como al reconocimiento recíproco de los diplomas, certificados
    y otros títulos destinados a favorecer el ejercicio de la liberdad de establecimiento
    de estos transportistas en el sector de los transportes nacionales e internacionales
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/26/EG av den 29 april 1996 om rätt att yrkesmässigt
    bedriva person- och godstransporter på väg och om ömsesidigt erkännande av
    utbildnings-, examens- och andra behörighetsbevis för att främja ett effektivt
    utnyttjande av dessa transportörers etableringsrätt på området för nationella
    och internationella transporter
  type: main
