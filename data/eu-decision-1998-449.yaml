title:
- language: en
  script: Latn
  content: '98/449/EC: Council Decision of 29 June 1998 on the conclusion of the Agreement
    in the form of an Exchange of Letters between the European Community and the Government
    of the Republic of Guinea concerning the provisional application of the Protocol
    establishing the fishing possibilities and the financial compensation provided
    for in the Agreement between the European Economic Community and the Government
    of the Revolutionary People''s Republic of Guinea on fishing off the Guinean coast
    for the period 1 January 1998 to 31 December 1999'
  type: main
- language: fr
  script: Latn
  content: '98/449/CE: Décision du Conseil du 29 juin 1998 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté européenne
    et le gouvernement de la République de Guinée relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République populaire révolutionnaire de Guinée concernant la pêche au
    large de la côte guinéenne, pour la période du 1er janvier 1998 au 31 décembre
    1999'
  type: main
- language: de
  script: Latn
  content: '98/449/EG: Beschluss des Rates vom 29. Juni 1998 über den Abschluß des
    Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
    und der Regierung der Republik Guinea über die vorläufige Anwendung des Protokolls
    zur Festlegung der Fangmöglichkeiten und der finanziellen Gegenleistung nach
    dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Revolutionären Volksrepublik Guinea über die Fischerei vor der Küste Guineas
    für die Zeit vom 1. Januar 1998 bis zum 31. Dezember 1999'
  type: main
- language: da
