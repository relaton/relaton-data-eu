    om midlertidig anvendelse af protokollen om fastsættelse af de fiskerimuligheder
    og den finansielle modydelse, der er omhandlet i aftalen mellem Det Europæiske
    Økonomiske Fællesskab og regeringen for Den Revolutionære Folkerepublik Guinea
    om fiskeri ud for Guineas kyst, for perioden 1. januar 1998 til 31. december 1999'
  type: main
- language: el
