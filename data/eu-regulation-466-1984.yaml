  content: Commission Regulation (EEC) No 466/84 of 22 February 1984 re-establishing
    the levying of customs duties on diethylene glycol, falling within subheading
    29.08 B ex I and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 466/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables au 2,2' -Oxydiéthanol
    (diéthylèneglycol), de la sous-position 29.08 B ex I du tarif douanier commun,
    originaire du Brésil, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
