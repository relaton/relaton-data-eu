    ryb i zwierząt domowych oraz nalewki z imbiru otrzymywanej z Zingiber officinale
    Roscoe dla koni i psów'
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/485 da Comissão de 22 de março de
    2021 relativo à autorização como aditivos em alimentos de óleo essencial de
    gengibre de Zingiber officinale Roscoe para todas as espécies animais, de oleorresina
