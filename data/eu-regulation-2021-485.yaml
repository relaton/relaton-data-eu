  script: Latn
  content: Reglamento de Ejecución (UE) 2021/485 de la Comisión de 22 de marzo de
    2021 relativo a la autorización como aditivos para piensos del aceite esencial
    de jengibre (Zingiber officinale Roscoe) para todas las especies animales, de
    la oleorresina de jengibre (Zingiber officinale Roscoe) para pollos de engorde,
