title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/485 of 22 March 2021 concerning
    the authorisation as feed additives of ginger essential oil from Zingiber officinale
    Roscoe for all animal species, ginger oleoresin from Zingiber officinale Roscoe
    for chickens for fattening, laying hens, turkeys for fattening, piglets, pigs
    for fattening, sows, dairy cows, veal calves (milk replacers), cattle for fattening,
    sheep, goats, horses, rabbits, fish and pets and ginger tincture from Zingiber
    officinale Roscoe for horses and dogs
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/485 de la Commission du 22 mars 2021
    concernant l’autorisation en tant qu’additifs alimentaires de l’huile essentielle
    de gingembre tirée de Zingiber officinale Roscoe pour toutes les espèces animales,
    de l’oléorésine de gingembre tirée de Zingiber officinale Roscoe pour les
    poulets d’engraissement, les poules pondeuses, les dindons d’engraissement,
    les porcelets, les porcs d’engraissement, les truies, les vaches laitières,
    les veaux d’engraissement (aliment d’allaitement), les bovins d’engraissement,
    les ovins, les caprins, les chevaux, les lapins, les poissons et les animaux de
    compagnie, ainsi que de la teinture de gingembre tirée de Zingiber officinale
    Roscoe pour les chevaux et les chiens
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/485 der Kommission vom 22. März 2021
    zur Zulassung von ätherischem Ingweröl aus Zingiber officinale Roscoe als Futtermittelzusatzstoff
    für alle Tierarten, von Ingweroleoresin aus Zingiber officinale Roscoe als Futtermittelzusatzstoff
    für Masthühner, Legehennen, Masttruthühner, Ferkel, Mastschweine, Sauen, Milchkühe,
    Mastkälber (Milchaustauschfuttermittel), Mastrinder, Schafe, Ziegen, Pferde,
    Kaninchen, Fische und Heimtiere sowie von Ingwertinktur aus Zingiber officinale
    Roscoe als Futtermittelzusatzstoff für Pferde und Hunde
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/485 на Комисията
    от 22 март 2021 година за разрешаване на употребата
    като фуражни добавки на етерично масло от джинджифил
    (Zingiber officinale Roscoe) за всички животински видове,
    масло-смола от джинджифил (Zingiber officinale Roscoe) за
    пилета за угояване, кокошки носачки, пуйки
    за угояване, прасенца, свине за угояване, свине
    майки, млечни крави, телета (заместители на
