    кози, коне, зайци, риба и домашни любимци, както
    и на тинктура от джинджифил (Zingiber officinale Roscoe)
    за коне и кучета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/485 ze dne 22. března 2021 o
    povolení zázvorového esenciálního oleje ze Zingiber officinale Roscoe jako
    doplňkové látky pro všechny druhy zvířat, zázvorového oleoresinu ze Zingiber
    officinale Roscoe jako doplňkové látky pro výkrm kuřat, nosnice, výkrm krůt,
    selata, výkrm prasat, prasnice, dojnice, telata (mléčné krmné směsi), výkrm
    skotu, ovce, kozy, koně, králíky, ryby a zvířata v zájmovém chovu a zázvorové
    tinktury ze Zingiber officinale Roscoe jako doplňkové látky pro koně a psy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/485 af 22. marts 2021
    om godkendelse som fodertilsætningsstoffer af æterisk ingefærolie fra Zingiber
    officinale Roscoe til alle dyrearter, ingefæroleoresin fra Zingiber officinale
    Roscoe til slagtekyllinger, æglæggende høner, slagtekalkuner, smågrise, slagtesvin,
    søer, malkekøer, fedekalve (mælkeerstatninger), slagtekvæg, får, geder, heste,
    kaniner, fisk og selskabsdyr og ingefærtinktur fra Zingiber officinale Roscoe
    til heste og hunde
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/485 της Επιτροπής
    της 22ας Μαρτίου 2021 για τη χορήγηση άδειας για
    τη χρήση του αιθέριου ελαίου ζιγγίβερης από
    Zingiber officinale Roscoe ώς πρόσθετης ύλης ζωοτροφών
    για όλα τα ζωικά είδη, της ελαιορητίνης ζιγγίβερης
    από Zingiber officinale Roscoe για κοτόπουλα προς πάχυνση,
    όρνιθες ωοπαραγωγής, γαλοπούλες προς πάχυνση,
    χοιρίδια, χοίρους προς πάχυνση, χοιρομητέρες,
    αγελάδες γαλακτοπαραγωγής, μόσχους προς πάχυνση
    (υποκατάστατα γάλακτος), βοοειδή προς πάχυνση,
    πρόβατα, αίγες, άλογα, κουνέλια, ψάρια και ζώα
    συντροφιάς, και του βάμματος ζιγγίβερης από
    Zingiber officinale Roscoe για άλογα και σκύλους
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/485, 22. märts 2021, milles käsitletakse
    loa andmist Zingiber officinale Roscoe taimedest saadud ingveri eeterliku õli
    kasutamiseks kõikide loomaliikide söödalisandina, Zingiber officinale Roscoe
    taimedest saadud ingveri õlivaigu kasutamiseks broilerkanade, munakanade, broilerkalkunite,
    põrsaste, nuumsigade, emiste, piimalehmade, lihavasikate, nuumveiste, lammaste,
    kitsede, hobuste, küülikute, kalade ja lemmikloomade söödalisandina (lihavasikate
    puhul piimaasendajas) ning Zingiber officinale Roscoe taimedest saadud ingveritinktuuri
    kasutamiseks hobuste ja koerte söödalisandina
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/485, annettu 22 päivänä
    maaliskuuta 2021, Zingiber officinale Roscoe -kasvista saatavan eteerisen inkivääriöljyn
    hyväksymisestä rehun lisäaineena kaikkien eläinlajien ruokinnassa, Zingiber
    officinale Roscoe -kasvista saatavan inkiväärin oleohartsin hyväksymisestä
    rehun lisäaineena broilereiden, munivien kanojen, lihakalkkunoiden, porsaiden,
    lihasikojen, emakkojen, lypsylehmien, lihavasikoiden (juottorehut), lihanautojen,
    lampaiden, vuohien, hevosten, kanien, kalojen ja lemmikkieläinten ruokinnassa
    sekä Zingiber officinale Roscoe -kasvista saatavan inkivääritinktuuran hyväksymisestä
    rehun lisäaineena hevosten ja koirien ruokinnassa
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2021/485 ón gCoimisiún an 22 Márta
    2021 maidir le bláthola sinséir ó Zingiber officinale Roscoe a údarú mar
    bhreiseáin beathaithe le haghaidh gach speicis ainmhíoch, maidir le hoiléaroisín
    sinséir ó Zingiber officinale Roscoe a údarú le haghaidh: sicíní lena ramhrú,
    béaróga, turcaithe lena ramhrú, bainbh, muca lena ramhrú, cránacha muice,
    ba déiríochta, laonna feola (bainne púdrach), eallaí lena ramhrú, caoirigh,
    gabhair, capaill, coiníní, éisc agus peataí agus maidir le tintiúr sinséir
    ó Zingiber officinale Roscoe a údarú le haghaidh capall agus madraí'
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/485 оd 22. ožujka 2021. o odobrenju
    kao dodataka hrani za životinje eteričnog ulja đumbira Zingiber officinale
    Roscoe za sve životinjske vrste, oleo smole đumbira od Zingiber officinale Roscoe
    za piliće za tov, kokoši nesilice, pure za tov, prasad, svinje za tov, krmače,
    mliječne krave, telad za klanje (mliječni nadomjesci), goveda za tov, ovce,
    koze, konje, kuniće, ribe i kućne ljubimce te tinkture đumbira od Zingiber
    officinale Roscoe za konje i pse
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/485 végrehajtási rendelete (2021. március 22.)
    a Zingiber officinale Roscoe-ból nyert gyömbér illóolaj valamennyi állatfaj,
    a Zingiber officinale Roscoe-ból nyert gyömbér oleorezin brojlercsirkék, tojótyúkok,
    hízópulykák, malacok, hízósertések, kocák, tejelő tehenek, hízóborjak
    (tejpótlók), hízómarhák, juhok, kecskék, lovak, nyulak, halak és kedvtelésből
    tartott állatok, valamint a Zingiber officinale Roscoe-ból nyert gyömbértinktúra
    lovak és kutyák takarmány-adalékanyagaként történő engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/485 della Commissione del 22 marzo
    2021 relativo all’autorizzazione dell’olio essenziale di zenzero estratto
    da Zingiber officinale Roscoe come additivo per mangimi destinati a tutte le specie
    animali, dell’oleoresina di zenzero estratta da Zingiber officinale Roscoe come
    additivo per mangimi destinati a polli da ingrasso, galline ovaiole, tacchini
    da ingrasso, suinetti, suini da ingrasso, scrofe, vacche da latte, vitelli a carne
    bianca (sostituti del latte), bovini da ingrasso, ovini, caprini, cavalli, conigli,
    pesci e animali da compagnia e della tintura di zenzero estratta da Zingiber officinale
    Roscoe come additivo per mangimi destinati a cavalli e cani
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/485 (2021. gada 22. marts) par
    atļauju no Zingiber officinale Roscoe iegūtu ingvera ēterisko eļļu izmantot
    par barības piedevu visu sugu dzīvniekiem, no Zingiber officinale Roscoe iegūtus
    ingvera oleosveķus izmantot par barības piedevu gaļas cāļiem, dējējvistām,
    gaļas tītariem, sivēniem, gaļas cūkām, sivēnmātēm, piena govīm, nobarojamiem
    teļiem (piena aizstājējbarībā), gaļas liellopiem, aitām, kazām, zirgiem,
    trušiem, zivīm un lolojumdzīvniekiem un no Zingiber officinale Roscoe iegūtu
    ingvera tinktūru izmantot par barības piedevu zirgiem un suņiem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/485 2021 m. kovo 22 d. dėl
    leidimo naudoti imbiero eterinį aliejų, gautą iš Zingiber officinale Roscoe,
    kaip visų rūšių gyvūnų pašaro priedą, imbiero dervingąjį aliejų, gautą
    iš Zingiber officinale Roscoe, kaip penimų viščiukų, vištų dedeklių, penimų
    kalakutų, paršelių, penimų kiaulių, paršavedžių, pieninių karvių, veršelių
    (pieno pakaitalui), penimų galvijų, avių, ožkų, arklių, triušių, žuvų
    ir gyvūnų augintinių pašaro priedą ir imbiero tinktūrą, gautą iš Zingiber
    officinale Roscoe, kaip arklių ir šunų pašaro priedą
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/485 tat-22
    ta’ Marzu 2021 dwar l-awtorizzazzjoni bħala addittivi fl-għalf taż-żejt
    essenzjali tal-ġinġer miż-Zingiber officinale Roscoe għall-ispeċijiet kollha
    tal-annimali, l-oleoreżina tal-ġinġer miż-Zingiber officinale Roscoe għat-tiġieġ
    tas-simna, it-tiġieġ tal-bajd, id-dundjani tas-simna, il-qżieqeż, il-ħnieżer
