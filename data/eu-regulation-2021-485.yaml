    il-fniek, il-ħut u l-annimali tad-dar u tat-tintura tal-ġinġer miż-Zingiber
    officinale Roscoe għaż-żwiemel u l-klieb
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/485 van de Commissie van 22 maart 2021
    tot verlening van een vergunning als toevoegingsmiddel voor diervoeding voor etherische
