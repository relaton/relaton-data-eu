    látok
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/485 z dne 22. marca 2021 o dovoljenju
    kot krmni dodatki za eterično olje iz ingverja iz Zingiber officinale Roscoe
    za vse živalske vrste, oleorezin iz ingverja iz Zingiber officinale Roscoe za
    pitovne piščance, kokoši nesnice, purane za pitanje, sesne pujske, prašiče
    pitance, svinje, krave molznice, teleta, rejena za meso (mlečni nadomestki),
    govedo za pitanje, ovce, koze, konje, kunce, ribe in hišne živali ter tinkturo
    iz ingverja iz Zingiber officinale Roscoe za konje in pse
  type: main
