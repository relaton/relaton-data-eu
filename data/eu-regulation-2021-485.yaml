  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/485 al Comisiei din 22 martie
    2021 privind autorizarea ca aditivi furajeri a uleiului esențial de ghimbir din
    Zingiber officinale Roscoe pentru toate speciile de animale, a oleorășinii de
