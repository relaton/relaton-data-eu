title:
- language: en
  script: Latn
  content: '91/285/EEC: Commission Decision of 21 May 1991 authorizing the French
    Republic to apply intra-Community surveillance in respect of imports of certain
    textile products originating in certain third countries (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/285/CEE: Décision de la Commission du 21 mai 1991 autorisant la République
    française à procéder à une surveillance intracommunautaire à l''égard des
    importations de certains produits textiles originaires de certains pays tiers
    (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 21. Mai 1991 zur Ermächtigung Frankreichs,
    eine innergemeinschaftliche Überwachung der Einfuhren bestimmter Textilwaren
    mit Ursprung in bestimmten Drittländern einzuführen (Nur der französische Text
    ist verbindlich) (91/285/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 21. maj 1991 om bemyndigelse af Den Franske
    Republik til at indføre et tilsyn inden for Fællesskabet med importen af visse
    tekstilvarer med oprindelse i bestemte lande (Kun den franske udgave er autentisk)
    (91/285/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/285/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Μαΐου 1991 με την οποία εξουσιοδοτείται η Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής τρίτων χωρών'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 21 maggio 1991 che autorizza la Repubblica
    francese a procedere ad una sorveglianza intracomunitaria nei confronti delle
    importazioni di alcuni prodotti tessili originari di determinati paesi terzi (Il
    testo in lingua francese è il solo facente fede) (91/285/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 21 mei 1991 waarbij Frankrijk wordt gemachtigd
    een intracommunautair toezicht in te stellen op de invoer van bepaalde textielprodukten
    van oorsprong uit enige derde landen (Slechts de tekst in de Franse taal is authentiek)
    (91/285/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '91/285/CEE: Decisão da Comissão, de 21 de Maio de 1991, que autoriza
    a Republica francesa a proceder a uma fiscalização intracomunitára das importações
    de determinados produtos texteis originarios de certos países terceiros'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 21 de mayo de 1991 por la que se autoriza
    a la República Francesa a proceder a una vigilancia intracomunitaria con respecto
    a las importaciones de determinados productos textiles originarios de terceros
    países (El texto en lengua francesa es el único auténtico) (91/285/CEE) #'
  type: main
