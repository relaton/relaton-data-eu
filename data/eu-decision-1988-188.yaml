    temporaneamente la commercializzazione di sementi di specie forestali non rispondenti
    ai requisiti prescritti dalla direttiva 71/161/CEE del Consiglio (Il testo in
    lingua tedesca è il solo facente fede) (88/188/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 25 februari 1988 tot wijziging van Beschikking
    87/163/EEG houdende machtiging van de Bondsrepubliek Duitsland om bosbouwzaad
    dat niet aan de eisen van Richtlijn 71/161/EEG van de Raad voldoet, tijdelijk
    tot de handel toe te laten (Slechts de tekst in de Duitse taal is authentiek)
    (88/188/EEG) #'
  type: main
