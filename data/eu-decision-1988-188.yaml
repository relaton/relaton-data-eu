title:
- language: en
  script: Latn
  content: '88/188/EEC: Commission Decision of 25 February 1988 amending Decision
    87/163/EEC authorizing the Federal Republic of Germany to permit temporarily the
    marketing of forestry seed not satisfying the requirements of Council Directive
    71/161/EEC (only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/188/CEE: Décision de la Commission du 25 février 1988 modifiant la
    décision 87/163/CEE autorisant la République fédérale d''Allemagne à admettre
    temporairement la commercialisation de semences forestières ne répondant pas
    aux exigences de la directive 71/161/CEE du Conseil (Le texte en langue allemande
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 25. Februar 1988 zur Änderung der Entscheidung
    87/163/EWG zur Ermächtigung der Bundesrepublik Deutschland, vorübergehend forstliches
    Saatgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 71/161/EWG
    des Rates nicht entspricht (Nur der deutsche Text ist verbindlich) (88/188/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 25. februar 1988 om ændring af beslutning
    87/163/EØF om bemyndigelse af Forbundsrepublikken Tyskland til midlertidigt at
    tillade handel med forstligt frømateriale, der ikke opfylder kravene i Rådets
    direktiv 71/161/EØF (Kun den tyske udgave er autentisk) (88/188/EØF) #'
  type: main
- language: el
  script: Grek
  content: '88/188/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Φεβρουαρίου 1988 για την τροποποίηση της απόφασης
    87/163/ΕΟΚ για την παροχή αδείας στην Ομοσπονδιακή
    Δημοκρατία της Γερμανίας να επιτρέπει προσωρινά
    την εμπορία σπόρων προς σπορά δασικών ειδών
    που δεν ανταποκρίνονται στις απαιτήσεις της
    οδηγίας 71/161/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 25 febbraio 1988 recante modifica della
