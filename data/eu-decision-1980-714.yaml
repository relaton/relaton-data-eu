title:
- language: en
  script: Latn
  content: '80/714/EEC: Commission Decision of 3 July 1980 on the reimbursement by
    the Guidance Section of the EAGGF to the French Republic of expenditure incurred
    during 1978 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/714/CEE: Décision de la Commission, du 3 juillet 1980, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", à la République française des dépenses effectuées pendant
    l''année 1978 pour les indemnités relatives à l''encouragement à la cessation
    de l''activité agricole et à l''affectation de la superficie agricole utilisée
    à des fins d''amélioration des structures (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/714/EWG: Entscheidung der Kommission vom 3. Juli 1980 über die Rückvergütung
    der im Jahr 1978 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an die Französische
    Republik (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/714/EØF: Kommissionens beslutning af 3. juli 1980 om refusion gennem
    EUGFL, udviklingssektionen, til Den franske Republik af de udgifter, som er afholdt
    i løbet af året 1978 til godtgørelser vedrørende støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål (Kun
    den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/714/CEE: Decisione della Commissione, del 3 luglio 1980, relativa al
    rimborso da parte del FEAOG, sezione orientamento, alla Repubblica francese delle
    spese effettuate durante il 1978 per le indennità concernenti l''incoraggiamento
    alla cessazione dell''attività agricola e alla destinazione della superficie
    agricola utilizzata a scopi di miglioramento delle strutture (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/714/EEG: Beschikking van de Commissie van 3 juli 1980 betreffende vergoeding
    door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van de gedurende
    het jaar 1978 gedane uitgaven voor de uitkeringen met betrekking tot de bevordering
    van de bedrijfsbeëindiging in de landbouw en van aanwending van cultuurgrond
    tot verbetering van de structuur (Slechts de tekst in de Franse taal is authentiek)'
  type: main
