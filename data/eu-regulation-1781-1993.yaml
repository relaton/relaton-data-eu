title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1781/93 of 30 June 1993 imposing a definitive
    countervalling duty on imports of ball bearings with a greatest external diameter
    not exceeding 30 mm, originating in Thailand but exported to the Community from
    another country, and definitively collecting the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1781/93 du Conseil, du 30 juin 1993, instituant un
    droit compensateur définitif sur les importations de roulements à billes dont
    le plus grand diamètre extérieur n'excède pas 30 millimètres, originaires
    de Thaïlande mais exportés vers la Communauté à partir d'un autre pays, et
    portant perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1781/93 des Rates vom 30. Juni 1993 zur Einführung
    eines endgültigen Ausgleichszolls auf die Einfuhren von Kugellagern mit einem
    größten äußeren Durchmesser von 30 mm oder weniger mit Ursprung in Thailand,
    aber aus einem anderen Land in die Gemeinschaft ausgeführt, und zur endgültigen
    Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1781/93 af 30. juni 1993 om indførelse af
    en endelig udligningstold på importen af kuglelejer med største udvendige diameter
    på ikke over 30 mm med oprindelse i Thailand, men eksporteret til Fællesskabet
    fra et andet land, og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1781/93 του Συμβουλίου
    της 30ής Ιουνίου 1993 για την επιβολή οριστικού
    αντισταθμιστικού δασμού στις εισαγωγές ένσφαιρων
    τριβέων με μέγιστη εξωτερική διάμετρο 30 mm,
    καταγωγής Ταϊλάνδης, οι οποίοι εξάγονται στην
    Κοινότητα από άλλη τρίτη χώρα, και για την οριστική
    είσπραξη του προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 1781/93, annettu 30 päivänä kesäkuuta 1993,
    lopullisen tasoitustullin käyttöön ottamisesta Thaimaasta peräisin olevien
    yhteisöön muusta kolmannesta maasta vietyjen kuulalaakerien, joiden suurin ulkohalkaisija
    on enintään 30 millimetriä, tuonnissa ja väliaikaisen tullin lopullisesta
    kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1781/93 del Consiglio, del 30 giugno 1993, che istituisce
    un dazio compensativo definitivo sulle importazioni di cuscinetti a sfere il cui
    maggior diametro esterno è inferiore o uguale a 30 mm, di origine tailandese
    ma esportati nella Comunità da un altro paese terzo, e che decide la riscossione
    definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) Nr. 1781/93 van de Raad van 30 juni 1993 tot instelling
    van een definitief compenserend recht op de invoer van kogellagers met een grootste
    uitwendige diameter van niet meer dan 30 mm, van oorsprong uit Thailand doch naar
    de Gemeenschap uit een ander land uitgevoerd en tot definitieve inning van het
    voorlopig recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1781/93 do Conselho, de 30 de Junho de 1993, que
    institui um direito de compensação definitivo sobre as importações de rolamentos
    de esferas cujo maior diâmetro exterior não exceda 30 mm, originários da Tailândia
    mas exportados para a Comunidade a partir de outro país e que institui a cobrança
    definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1781/93 del Consejo, de 30 de junio de 1993, por el
    que se establece un derecho compensatorio definitivo sobre las importaciones de
    rodamientos de bolas cuyo máximo diámetro exterior no exceda de 30 mm, originarios
    de Tailandia pero exportados a la Comunidad desde otro país, y por el que se
    percibe definitivamente el derecho provisional
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 1781/93 av den 30 juni 1993 om införande
    av en slutgiltig utjämningstull på import av kullager med en yttre diameter
    av högst 30 mm med ursprung i Thailand, men som exporteras till gemenskapen från
    ett annat land, samt om slutgiltigt uttag av den preliminära tullen
  type: main
