  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1675 Végrehajtási Rendelete (2019. október 4.)
    a Verticillium albo-atrum WCS850 törzs hatóanyagnak mint kis kockázatú hatóanyagnak
    a növényvédő szerek forgalomba hozataláról szóló 1107/2009/EK európai
    parlamenti és tanácsi rendelet szerinti jóváhagyása meghosszabbításáról,
    továbbá az 540/2011/EU bizottsági végrehajtási rendelet mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2019/1675 della Commissione del 4 ottobre
    2019 che rinnova l’approvazione della sostanza attiva Verticillium albo-atrum
    ceppo WCS850 come sostanza a basso rischio, in conformità al regolamento (CE)
    n. 1107/2009 del Parlamento europeo e del Consiglio relativo all’immissione
    sul mercato dei prodotti fitosanitari, e che modifica l’allegato del regolamento
    di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/1675 (2019. gada 4. oktobris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par
    augu aizsardzības līdzekļu laišanu tirgū atjauno apstiprinājumu darbīgajai
    vielai Verticillium albo-atrum celmam WCS850 kā zema riska vielai un groza Komisijas
    Īstenošanas regulas (ES) Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2019/1675 2019 m. spalio 4 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką pratęsiamas veikliosios medžiagos
    Verticillium albo-atrum (padermė WCS850), kaip nedidelės rizikos veikliosios
    medžiagos, patvirtinimo galiojimas ir iš dalies keičiamas Komisijos įgyvendinimo
    reglamento (ES) Nr. 540/2011 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2019/1675 tal-4
