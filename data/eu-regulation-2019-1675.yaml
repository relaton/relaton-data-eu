  script: Latn
  content: 'Durchführungsverordnung (EU) 2019/1675 der Kommission vom 4. Oktober
    2019 zur Erneuerung der Genehmigung für den Wirkstoff Verticillium albo-atrum
    Stamm: WCS850 als Wirkstoff mit geringem Risiko gemäß der Verordnung (EG) Nr.
    1107/2009 des Europäischen Parlaments und des Rates über das Inverkehrbringen
    von Pflanzenschutzmitteln und zur Änderung des Anhangs der Durchführungsverordnung
    (EU) Nr. 540/2011 der Kommission'
  type: main
