    Verticillium albo-atrum bħala sustanza b’riskju baxx skont ir-Regolament (KE)
    Nru 1107/2009 tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta’
    prodotti għall-protezzjoni tal-pjanti u li jemenda l-Anness tar-Regolament ta’
    Implimentazzjoni tal-Kummissjoni (UE) Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2019/1675 Van De Commissie van 4 oktober 2019
    tot verlenging van de goedkeuring van de werkzame stof Verticillium albo-atrum
    stam WCS850 als een stof met een laag risico overeenkomstig Verordening (EG) nr.
    1107/2009 van het Europees Parlement en de Raad betreffende het op de markt brengen
    van gewasbeschermingsmiddelen, en tot wijziging van de bijlage bij Uitvoeringsverordening
    (EU) nr. 540/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2019/1675 z dnia 4 października
    2019 r. w sprawie odnowienia zatwierdzenia substancji czynnej Verticillium albo-atrum
    szczep WCS850 jako substancji niskiego ryzyka, zgodnie z rozporządzeniem Parlamentu
    Europejskiego i Rady (WE) nr 1107/2009 dotyczącym wprowadzania do obrotu środków
    ochrony roślin, oraz w sprawie zmiany załącznika do rozporządzenia wykonawczego
    Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2019/1675 da Comissão de 4 de outubro de
    2019 que renova a aprovação da substância ativa Verticillium albo-atrum estirpe
    WCS850 como substância de baixo risco, em conformidade com o Regulamento (CE)
    n.o 1107/2009 do Parlamento Europeu e do Conselho relativo à colocação dos
    produtos fitofarmacêuticos no mercado, e que altera o anexo do Regulamento de
    Execução (UE) n.o 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2019/1675 al Comisiei din 4 octombrie
    2019 de reînnoire a aprobării substanței active Verticillium albo-atrum tulpina
    WCS850, ca substanță cu risc redus, în conformitate cu Regulamentul (CE) nr.
    1107/2009 al Parlamentului European și al Consiliului privind introducerea pe
    piață a produselor fitosanitare, și de modificare a anexei la Regulamentul
    de punere în aplicare (UE) nr. 540/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2019/1675 zo 4. októbra 2019, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh obnovuje schválenie účinnej
    látky Verticillium albo-atrum kmeň WCS850 ako účinnej látky s nízkym rizikom
    a ktorým sa mení príloha k vykonávaciemu nariadeniu Komisie (EÚ) č. 540/2011
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2019/1675 z dne 4. oktobra 2019 o obnovitvi
    odobritve aktivne snovi Verticillium albo-atrum, sev WCS850, kot snovi z majhnim
    tveganjem v skladu z Uredbo (ES) št. 1107/2009 Evropskega parlamenta in Sveta
    o dajanju fitofarmacevtskih sredstev v promet ter o spremembi Priloge k Izvedbeni
    uredbi Komisije (EU) št. 540/2011
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2019/1675 de la Comisión de 4 de octubre
    de 2019 por el que se renueva la aprobación de la sustancia activa Verticillium
    alboatrum, cepa WCS850, como sustancia de bajo riesgo, de conformidad con el Reglamento
    (CE) n.o 1107/2009 del Parlamento Europeo y del Consejo, relativo a la comercialización
    de productos fitosanitarios, y se modifica el anexo del Reglamento de Ejecución
    (UE) n.o 540/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens Genomförandeförordning (EU) 2019/1675 av den 4 oktober
    2019 om förnyelse av godkännandet av det verksamma ämnet Verticillium albo-atrum
    stam WCS850 som ett verksamt ämne med låg risk i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1107/2009 om utsläppande av växtskyddsmedel
    på marknaden, och om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011
