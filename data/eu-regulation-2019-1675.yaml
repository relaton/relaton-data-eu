title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1675 of 4 October 2019 renewing
    the approval of the active substance Verticillium albo-atrum strain WCS850 as
    a low-risk substance in accordance with Regulation (EC) No 1107/2009 of the European
    Parliament and of the Council concerning the placing of plant protection products
    on the market, and amending the Annex to Commission Implementing Regulation (EU)
    No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2019/1675 de la Commission du 4 octobre
    2019 renouvelant l’approbation de la substance Verticillium albo-atrum, souche
    WCS850 en tant que substance active à faible risque, conformément au règlement
    (CE) no 1107/2009 du Parlement européen et du Conseil concernant la mise sur
    le marché des produits phytopharmaceutiques, et modifiant l’annexe du règlement
    d’exécution (UE) no 540/2011 de la Commission
  type: main
