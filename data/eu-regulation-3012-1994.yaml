title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3012/94 of 12 December 1994 amending Regulation
    (EC) No 2150/94 fixing, for unginned cotton, the actual production for the 1993/94
    marketing year, the estimated production and the provisional reduction in the
    aid for the 1994/95 marketing year and the amount by which the guide price is
    to be reduced for the 1995/96 marketing year and fixing the definitive reduction
    for the 1994/95 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3012/94 de la Commission du 12 décembre 1994 portant
    modification du règlement (CE) n° 2150/94 fixant, pour le coton non égrené,
    la production effective pour la campagne de commercialisation 1993/1994, déterminant
    pour la campagne 1994/1995 la production estimée, l'abattement provisoire de
    l'aide, et fixant le montant dont sera diminué le prix d'objectif pour la campagne
    1995/1996 et fixant l'abattement définitif pour la campagne 1994/1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3012/94 DER KOMMISSION vom 12. Dezember 1994 zur Änderung
    der Verordnung (EG) Nr. 2150/94 zur Festsetzung der tatsächlichen Erzeugung an
    nicht entkörnter Baumwolle im Wirtschaftsjahr 1993/94, der geschätzten Erzeugung
    im Wirtschaftsjahr 1994/95 und der vorläufigen Kürzung der Beihilfe sowie der
    Verringerung des Zielpreises im Wirtschaftsjahr 1995/96 sowie zur Festsetzung
    der endgültigen Kürzung der Beihilfe im Wirtschaftsjahr 1994/95
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3012/94 af 12. december 1994 om ændring
    af forordning (EF) nr. 2150/94 om fastsættelse for ikke-egreneret bomuld for
    produktionsåret 1993/94 af den faktiske produktion og for produktionsåret 1994/95
    af den anslåede produktion, foreløbig nedsættelse af støttebeløbet og fastsættelse
    af det beløb, hvormed målprisen for produktionsåret 1995/96 nedsættes, og
    den definitive nedsættelse for produktionsåret 1994/95
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3012/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 12ης Δεκεμβρίου 1994 για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2150/94 που καθορίζει, για το σύσσπορο
    βάμβακα, την πραγματική παραγωγή για την περίοδο
    εμπορίας 1993/94, προσδιορίζει για την περίοδο
    1994/95 την εκτιμώμενη παραγωγή, την προσωρινή
    μείωση της ενίσχυσης και καθορίζει το ποσό
    κατά το οποίο θα μειωθεί η τιμή στόχου για την
    περίοδο εμπορίας 1995/96 και για τον καθορισμό
    της οριστικής μείωσης για την περίοδο εμπορίας
    1994/95
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 3012/94, annettu 12 päivänä joulukuuta 1994,
    puuvillan, josta siemeniä ei ole poistettu, markkinointivuoden 1993/1994 tosiasiallisesta
    tuotannosta, markkinointivuoden 1994/1995 arvioidusta tuotannosta ja tuen väliaikaisesta
    vähennyksestä sekä markkinointivuoden 1995/1996 kohdehinnasta vähennettävästä
    määrästä annetun asetuksen (EY) N:o 2150/94 muuttamisesta sekä lopullisen
    vähennyksen vahvistamisesta markkinointivuoden 1994/1995 osalta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3012/94 DELLA COMMISSIONE del 12 dicembre 1994 recante
    modifica del regolamento (CE) n. 2150/94 che fissa, per il cotone non sgranato,
    la produzione effettiva per la campagna di commercializzazione 1993/1994, che
    determina per la campagna 1994/1995 la produzione stimata e la riduzione provvisoria
    dell' aiuto e che fissa l' importo della diminuzione del prezzo d' obiettivo per
    la campagna 1995/1996, nonché la riduzione definitiva per la campagna 1994/1995
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3012/94 VAN DE COMMISSIE van 12 december 1994 houdende
    wijziging van Verordening (EG) nr. 2150/94 tot vaststelling, voor niet-geëgreneerde
    katoen, van de feitelijke produktie voor het verkoopseizoen 1993/1994 en van de
    geraamde produktie en de voorlopige korting op het steunbedrag voor het verkoopseizoen
    1994/1995, en tot vaststelling van het bedrag waarmee de streefprijs voor het
    verkoopseizoen 1995/1996 zal worden verlaagd, en vaststelling van de definitieve
    korting voor het verkoopseizoen 1994/1995
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3012/94 DA COMISSÃO de 12 de Dezembro de 1994 que
    altera o Regulamento (CE) nº 2150/94, que fixa, em relação ao algodão não
    descaroçado, a produção efectiva da campanha de comercialização de 1993/1994,
    determina, para a campanha de comercialização de 1994/1995, a produção estimada
    e a redução provisória da ajuda e fixa o montante de que será diminuído o
    preço de objectivo na campanha de 1995/1996, e fixa a redução definitiva para
    a campanha de 1994/1995
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3012/94 DE LA COMISIÓN de 12 de diciembre de 1994
    por el que se modifica el Reglamento (CE) nº 2150/94 por el que se fijan la producción
    efectiva de la campaña de comercialización 1993/94, la producción estimada
    y la reducción provisional de la ayuda de la campaña 1994/95 y el importe en
    que se reducirá el precio de objetivo de la campaña 1995/96 del algodón sin
    desmotar, y por el que se fija la reducción definitiva para la campaña 1994/95
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 3012/94 av den 12 december 1994 om ändring
    av förordning (EG) nr 2150/94 om fastställande för orensad bomull av den verkliga
    produktionen för regleringsåret 1993/94, den beräknade produktionen och den
    preliminära sänkningen av stödet för regleringsåret 1994/95 samt av det belopp
    med vilket målpriset skall sänkas för regleringsåret 1995/96, och om fastställande
    av den slutgiltiga sänkningen för regleringsåret 1994/95
