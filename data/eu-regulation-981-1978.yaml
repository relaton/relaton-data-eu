title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 981/78 of 16 May 1978 re-establishing the
    levying of customs duties on other goat and kidskin leather, other falling within
    subheading 41.04 B II, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 981/78 de la Commission, du 16 mai 1978, portant rétablissement
    de la perception des droits de douane applicables aux autres peaux de caprins
    non dénommées, de la sous-position tarifaire 41.04 B II, originaires des pays
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 981/78 der Kommission vom 16. Mai 1978 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder, ausgenommen Leder der
    Tarifnummern 41.06 und 41.08, der Tarifstelle 41.04 B II, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 981/78 af 16. maj 1978 om genindførelse
    af opkrævning af toldafgifter for andet læder af gede- og gedekidskind, andre
    varer, henhørende under underposition 41.04 B II, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 981/78 della Commissione, del 16 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli caprine,
    non nominate, della sottovoce doganale 41.04 B II originarie dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 981/78 van de Commissie van 16 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten voor ander geiteleder, overige,
    van post 41.04 B II, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties werden geopend
  type: main
