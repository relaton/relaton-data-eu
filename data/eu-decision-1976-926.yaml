id: EUDecision1976926
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 November 1976 authorizing the French Republic
    not to apply Community treatment to unbleached or bleached woven fabrics of cotton
    or synthetic textile fibres falling within heading No ex 55.09 and subheading
    56.07 ex A of the Common Customs Tariff, originating in the Republic of Korea
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/926/CEE: Décision de la Commission, du 10 novembre 1976, autorisant
    la République française à exclure du traitement communautaire les tissus écrus
    et blanchis de coton ou de fibres textiles synthétiques, des positions Ex 55.09
    et 56.07 Ex A du Tarif douanier commun, originaires de la République de Corée
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. November 1976, mit der die Französische
    Republik ermächtigt wird, aus der Republik Korea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche rohe oder gebleichte Gewebe aus
    Baumwolle der Tarifnummer ex 55.09 und aus synthetischen Spinnfasern der Tarifstelle
    56.07 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. november 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævede, ublegede og blegede
    stoffer af bomuld eller syntetiske fibre, som henhører under pos. ex 55.09 og
    56.07 ex A i den fælles toldtarif, har oprindelse i republikken Korea og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 novembre 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti grezzi ed imbianchiti
    di cotone o di fibre tessili sintetiche delle voci ex 55.09 e 56.07 ex A della
    tariffa doganale comune, originari della Repubblica di Corea e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 november 1976 waarbij de Franse Republiek
    wordt gemachtigd ongebleekte en gebleekte weefsels van katoen of van synthetische
    vezels, van de posten ex 55.09 en 56.07 ex A van het gemeenschappelijk douanetarief,
    van oorsprong uit de Republiek Korea en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
