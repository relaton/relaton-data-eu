    η ελάχιστη τιμή εισαγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3519/88 della Commissione dell' 11 novembre 1988 che
    modifica il regolamento (CEE) n. 2303/88 per quanto concerne la tassa di compensazione
    applicabile qualora il prezzo minimo all' importazione per le uve secche non sia
    rispettato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3519/88 van de Commissie van 11 november 1988 tot
