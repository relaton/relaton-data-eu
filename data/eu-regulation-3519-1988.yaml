  content: Commission Regulation (EEC) No 3519/88 of 11 November 1988 amending Regulation
    (EEC) No 2303/88 as regards the countervailing charges to be imposed where the
    minimum import price for dried grapes is not observed
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3519/88 de la Commission du 11 novembre 1988 modifiant
    le règlement (CEE) n° 2303/88 en ce qui concerne les taxes compensatoires à
    percevoir dans les cas où le prix minimal à l' importation, applicable aux raisins
    secs, n' est pas respecté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3519/88 der Kommission vom 11. November 1988 zur Änderung
    der Verordnung (EWG) Nr. 2303/88 zur Festsetzung des Mindesteinfuhrpreises für
    getrocknete Weintrauben und der im Falle der Nichteinhaltung dieses Preises zu
    erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3519/88 af 11. november 1988 om ændring
    af forordning (EØF) nr. 2303/88 for så vidt angår den udligningsafgift, der
    skal opkræves, hvis minimumsimportprisen for tørrede druer ikke overholdes
  type: main
- language: el
  script: Grek
