    за удължаване на мандата на специалния представител
    на Европейския съюз в Косово (Това название
    не засяга позициите по отношение на статута
    и е съобразено с Резолюция 1244/1999 на Съвета за
    сигурност на ООН и становището на Международния
    съд относно обявяването на независимост от
    страна на Косово.)
  type: main
- language: cs
  script: Latn
