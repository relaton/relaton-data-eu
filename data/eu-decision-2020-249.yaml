  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2020/249 del Consiglio del 25 febbraio 2020 che modifica
    la decisione (PESC) 2018/903 che proroga il mandato del rappresentante speciale
    dell’Unione europea per il Kosovo (Tale designazione non pregiudica le posizioni
    riguardo allo status ed è in linea con la risoluzione 1244 (1999) dell’UNSC
    e con il parere della CIG sulla dichiarazione di indipendenza del Kosovo.)
  type: main
- language: lv
  script: Latn
  content: Padomes lēmums (KĀDP) 2020/249 (2020. gada 25. februāris), ar kuru groza
    Lēmumu (KĀDP) 2018/903, ar ko pagarina pilnvaru termiņu Eiropas Savienības
    īpašajam pārstāvim Kosovā (Šis nosaukums neskar nostājas par statusu un
    atbilst ANO DP Rezolūcijai 1244 (1999) un Starptautiskās Tiesas atzinumam par
    Kosovas neatkarības deklarāciju.)
  type: main
- language: lt
  script: Latn
