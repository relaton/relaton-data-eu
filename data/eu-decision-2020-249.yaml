title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2020/249 of 25 February 2020 amending Decision
    (CFSP) 2018/903 extending the mandate of the European Union Special Representative
    in Kosovo (This designation is without prejudice to positions on status, and is
    in line with UNSCR 1244 (1999) and the ICJ Opinion on the Kosovo declaration of
    independence.)
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2020/249 du Conseil du 25 février 2020 modifiant la décision
    (PESC) 2018/903 prorogeant le mandat du représentant spécial de l’Union européenne
    au Kosovo (Cette désignation est sans préjudice des positions sur le statut
    et est conforme à la résolution 1244 (1999) du Conseil de sécurité des Nations
    unies ainsi qu’à l’avis de la CIJ sur la déclaration d’indépendance du
    Kosovo.)
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2020/249 des Rates vom 25. Februar 2020 zur Änderung
    des Beschlusses (GASP) 2018/903 ur Verlängerung des Mandats des Sonderbeauftragten
    der Europäischen Union im Kosovo (Diese Bezeichnung berührt nicht die Standpunkte
    zum Status und steht im Einklang mit der Resolution 1244 (1999) des VN‐Sicherheitsrates
    und dem Gutachten des Internationalen Gerichtshofs zur Unabhängigkeitserklärung
    des Kosovos.)
  type: main
- language: bg
  script: Cyrl
