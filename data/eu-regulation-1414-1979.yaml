title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1414/79 of 5 July 1979 re-establishing the
    levying of customs duties on wrought plates, sheets and strip, of copper, falling
    within heading No 74.04 and originating in Chile, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1414/79 de la Commission, du 5 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en cuivre, d' une épaisseur de plus de 0,15 millimètre,
    de la position 74.04 du tarif douanier commun, originaires du Chili, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1414/79 der Kommission vom 5. Juli 1979 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Kupfer, mit einer
    Dicke von mehr als 0,15 mm, der Tarifnummer 74.04, mit Ursprung in Chile, dem
    die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1414/79 af 5. juli 1979 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af kobber, under pos. 74.04,
    som har oprindelse i Chile og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1414/79 della Commissione, del 5 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili a lamiere, lastre, fogli
    e nastri di rame, di spessore superiore a 0,15 mm, della voce doganale 74.04,
    originari del Cile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1414/79 van de Commissie van 5 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op platen,
    bladen en strippen, van koper, met een dikte van meer dan 0,15 mm, van post 74.04,
    van oorsprong uit Chili, ten behoeve waarvan bij Verordening (EEG) nr. 3156/78
    van de Raad algemene tariefpreferenties werden geopend
  type: main
