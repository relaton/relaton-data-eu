- language: en
  script: Latn
  content: Commission Regulation (EC) No 2629/98 of 7 December 1998 laying down rates
    of compensatory interest applicable during the first half of 1999 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2629/98 de la Commission du 7 décembre 1998 fixant
