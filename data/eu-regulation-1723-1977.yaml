    controlo da utilização e/ou do destino de produtos provenientes da intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1723/77 de la Comisión, de 28 de julio de 1977, por
    el que se modifica el Reglamento (CEE) n° 1687/76 por el que se establecen las
    modalidades comunes de control de la utilización y/o el destino de productos
    procedentes de la intervención
