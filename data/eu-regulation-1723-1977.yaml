    (ΕΟΚ) αριθ. 1687/76 «περί καθιερώσεως κοινών λεπτομερειών
    ελέγχου τής χρησιμοποιήσεως καί/ή τού προορισμού
    τών προϊόντων πού προέρχονται από τήν παρέμβαση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1723/77 della Commissione, del 28 luglio 1977, recante
    modifica del regolamento (CEE) n. 1687/76, che stabilisce modalità comuni di
    controllo dell' utilizzazione e/o della destinazione di prodotti provenienti dall'
    intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1723/77 van de Commissie van 28 juli 1977 houdende
    wijziging van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke
    bepalingen inzake de controle op het gebruik en/of de bestemming van produkten
    uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1723/77 da Comissão, de 28 de Julho de 1977, que
