title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1723/77 of 28 July 1977 amending Regulation
    (EEC) No 1687/76 laying down detailed rules for verifying the use and/or destination
    of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1723/77 de la Commission, du 28 juillet 1977, modifiant
    le règlement (CEE) n° 1687/76 établissant les modalités communes de contrôle
    de l' utilisation et/ou de la destination de produits provenant de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1723/77 der Kommission vom 28. Juli 1977 zur Änderung
    der Verordnung ((EWG) Nr. 1687/76 zur Festlegung der gemeinsamen Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1723/77 af 28. juli 1977 om ændring
    af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser for kontrol
    med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1723/77 τής Επιτροπής
