title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 398/81 of 9 February 1981 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 398/81 du Conseil, du 9 février 1981, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 398/81 des Rates vom 9. Februar 1981 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    Schiffe unter norwegischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 398/81 af 9. februar 1981 om fastsættelse
