  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1929/96, annettu 7 päivänä lokakuuta 1996,
    yhteisön sekä Baltian maiden välisissä vapaakauppasopimuksissa määrätyn
    järjestelmän soveltamista koskevista yksityiskohtaisista säännöistä maito-
    ja maitotuotealalla annetun komission asetuksen (EY) N:o 1713/95 muuttamisesta
