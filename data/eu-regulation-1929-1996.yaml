  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1929/96 de la Comisión de 7 de octubre de 1996 por
    el que se modifica el Reglamento (CE) nº 1713/95 por el que se establecen las
    disposiciones de aplicación, en el sector de la leche y los productos lácteos,
