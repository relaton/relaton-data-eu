    sowie zur Erstattung der Einfuhrabgaben, die auf Einfuhren zwischen dem 1. Juli
    1996 und dem 30. September 1996 erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EF) nr. 1929/96 af 7. oktober 1996 om ændring
