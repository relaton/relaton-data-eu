  script: Latn
  content: Commission Regulation (EC) No 1929/96 of 7 October 1996 amending Regulation
    (EC) No 1713/95 laying down detailed rules for the application to milk and milk
    products of the arrangements provided for in the Agreements on free trade between
    the Community and the Baltic States and providing for reimbursement of import
    duties charged between 1 July and 30 September 1996
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1929/96 de la Commission du 7 octobre 1996 modifiant
    le règlement (CE) nº 1713/95 établissant les modalités d'application, dans
    le secteur du lait et des produits laitiers, du régime prévu dans les accords
    sur la libéralisation des échanges entre la Communauté et les pays baltes et
    prévoyant le remboursement des droits à l'importation perçus sur les importations
    réalisées entre le 1er juillet et le 30 septembre 1996
  type: main
