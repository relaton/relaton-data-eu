    im voraus festgesetzten Abschöpfungen bei der Einfuhr und der Erstattungen bei
    der Ausfuhr für Reis zu berücksichtigen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1506/72 af 13. juli 1972 om fastsættelse
