    ajustement des prélèvements à l' importation et des restitutions à l' exportation
    fixés à l' avance pour le riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1506/72 der Kommission vom 13. Juli 1972 zur Festsetzung
