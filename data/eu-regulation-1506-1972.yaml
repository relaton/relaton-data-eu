  content: Regulation (EEC) No 1506/72 of the Commission of 13 July 1972 fixing for
    the 1972/73 marketing year the amounts to be taken into account for the purpose
    of adjusting import levies and export refunds fixed in advance for rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1506/72 de la Commission, du 13 juillet 1972, fixant,
