    elemente de fixare din fier sau oțel originare din Republica Populară Chineză,
    astfel cum a fost extinsă la importurile de anumite elemente de fixare din fier
    sau oțel expediate din Malaysia, indiferent dacă au fost sau nu declarate ca
    provenind din Malaysia, în urma unei reexaminări efectuate în perspectiva expirării
