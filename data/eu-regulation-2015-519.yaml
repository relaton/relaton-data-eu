  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/519 av den 26 mars 2015
    om införande av en slutgiltig antidumpningstull på import av vissa fästdon
    av järn eller stål med ursprung i Folkrepubliken Kina, som utvidgats till att
    även omfatta import av vissa fästdon av järn eller stål som avsänts från
    Malaysia, oavsett om produkternas deklarerade ursprung är Malaysia eller inte,
    efter en översyn vid giltighetstidens utgång enligt artikel 11.2 i förordning
    (EG) nr 1225/2009
