    prostředků ze železa nebo oceli pocházejících z Čínské lidové republiky,
    rozšířeného na dovoz některých spojovacích prostředků ze železa nebo
    oceli zasílaných z Malajsie bez ohledu na to, zda je u nich deklarován původ
