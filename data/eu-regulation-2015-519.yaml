title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/519 of 26 March 2015 imposing
    a definitive anti-dumping duty on imports of certain iron or steel fasteners originating
    in the People's Republic of China, as extended to imports of certain iron or steel
    fasteners consigned from Malaysia, whether declared as originating in Malaysia
    or not, following an expiry review pursuant to Article 11(2) of Regulation (EC)
    No 1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/519 de la Commission du 26 mars 2015
    instituant un droit antidumping définitif sur les importations de certains éléments
    de fixation en fer ou en acier originaires de la République populaire de Chine,
    tel qu'étendu aux importations de certains éléments de fixation en fer ou en
    acier expédiés de Malaisie, qu'ils aient ou non été déclarés originaires
    de ce pays, à l'issue d'un réexamen au titre de l'expiration des mesures effectué
    conformément à l'article 11, paragraphe 2, du règlement n ° 1225/2009
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/519 der Kommission vom 26. März 2015
    zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    Verbindungselemente aus Eisen oder Stahl mit Ursprung in der Volksrepublik China,
    ausgeweitet auf aus Malaysia versandte Einfuhren bestimmter Verbindungselemente
    aus Eisen oder Stahl, ob als Ursprungserzeugnisse Malaysias angemeldet oder nicht,
    im Anschluss an eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung
    (EG) Nr. 1225/2009
  type: main
- language: bg
  script: Cyrl
