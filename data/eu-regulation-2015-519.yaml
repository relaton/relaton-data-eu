    zo železa alebo ocele s pôvodom v Čínskej ľudovej republike rozšírené
    na dovoz určitých spojovacích materiálov zo železa alebo ocele zasielaných
    z Malajzie bez ohľadu na to, či sú deklarované ako výrobky s pôvodom v Malajzii,
    alebo nie, na základe preskúmania pred uplynutím platnosti podľa článku
