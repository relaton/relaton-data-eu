  content: Commission Decision of 1 October 1979 on the reimbursement by the Guidance
    Section of the EAGGF to the Kingdom of Denmark of expenditure incurred during
    1975 on aids and premiums relating to the modernization of farms (Only the Danish
    text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er octobre 1979, relative au remboursement
    par le Fonds européen d'orientation et de garantie agricole (FEOGA), section
    "orientation", au Royaume du Danemark des dépenses effectuées pendant l'année
    1975 pour les aides et primes relatives à la modernisation des exploitations
    agricoles (Le texte en langue danoise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 1. Oktober 1979 über die Rückvergütung
    der im Jahr 1975 zur Modernisierung landwirtschaftlicher Betriebe für Beihilfen
    und Prämien getätigten Ausgaben durch den EAGFL, Abteilung Ausrichtung, an das
    Königreich Dänemark (Nur der dänische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 1. oktober 1979 om refusion gennem EUGFL, udviklingssektionen,
    til kongeriget Danmark af de udgifter, som er afholdt i løbet af året 1975 til
    støtte og præmier vedrørende modernisering af landbrugsbedrifter (Kun den danske
    udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 1 ottobre 1979, relativa al rimborso da
    parte del FEAOG, sezione orientamento, al Regno di Danimarca delle spese effettuate
    durante il 1975 per gli aiuti ed i premi relativi all'ammodernamento delle aziende
    agricole (Il testo in lingua danese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 1 oktober 1979 inzake de vergoeding door
    het EOGFL, afdeling Oriëntatie, aan het Koninkrijk Denemarken van de gedurende
    het jaar 1975 gedane uitgaven voor de steun en premies met betrekking tot de modernisering
    van landbouwbedrijven (Slechts de tekst in de Deense taal is authentiek)
