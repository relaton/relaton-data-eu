  content: '87/544/EEC: Commission Decision of 5 November 1987 authorizing Belgium
    to specify a minimum number of animals in the case of applications for the special
    premium for beef producers (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/544/CEE: Décision de la Commission du 5 novembre 1987 autorisant le
    Belgique à prévoir un nombre minimal d''animaux pour les demandes de prime spéciale
    en faveur des producteurs de viande bovine (Les textes en langues française et
    néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/544/EWG: Entscheidung der Kommission vom 5. November 1987 zur Ermächtigung
    Belgiens, für die Anträge auf Sonderprämie für Rindfleischerzeuger eine Mindestzahl
    Tiere vorzusehen (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/544/EØF: Kommissionens beslutning af 5. november 1987 om tilladelse
    til Belgien til at fastsætte et minimumsantal af dyr for ansøgninger om en særlig
    præmie til oksekødproducenter (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '87/544/ΕΟΚ: Απόφαση της Επιτροπής της 5ης Νοεμβρίου
