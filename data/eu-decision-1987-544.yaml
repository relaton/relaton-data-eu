    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '87/544/CEE: Decisione della Commissione del 5 novembre 1987 che autorizza
    il Belgio a prevedere un numero minimo di animali per le domande di premio speciale
    a favore dei produttori di carni bovine (I testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '87/544/EEG: Beschikking van de Commissie van 5 november 1987 waarbij België
