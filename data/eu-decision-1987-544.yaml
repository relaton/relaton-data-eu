    rundvleesproducenten op een minimumaantal dieren betrekking moeten hebben (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/544/CEE: Decisão da Comissão de 5 de Novembro de 1987 que autoriza
