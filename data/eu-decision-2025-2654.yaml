title:
- language: en
  script: Latn
  content: Commission Delegated Decision (EU) 2025/2654 of 17 September 2025 on the
    renewal of the determination that the solvency regime in force in Brazil, Japan
    and Mexico applicable to undertakings with their head office in those third countries
    is provisionally equivalent to that laid down in Title I, Chapter VI of Directive
    2009/138/EC of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision déléguée (UE) 2025/2654 de la Commission du 17 septembre 2025
    relative au renouvellement de la constatation que le régime de solvabilité en
    vigueur au Brésil, au Japon et au Mexique et applicable aux entreprises ayant
    leur siège social dans ces pays tiers est provisoirement équivalent à celui
    prévu au titre I, chapitre VI, de la directive 2009/138/CE du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Delegierter Beschluss (EU) 2025/2654 der Kommission vom 17. September 2025
    über die Verlängerung der Feststellung, dass die Solvabilitätssysteme Brasiliens,
    Japans und Mexikos, die auf Unternehmen mit Sitz in diesen Drittländern anwendbar
    sind, vorläufig als gleichwertig mit dem in Titel I Kapitel VI der Richtlinie
    2009/138/EG des Europäischen Parlaments und des Rates festgelegten System anerkannt
    werden
  type: main
- language: bg
  script: Cyrl
  content: Делегирано решение (ЕС) 2025/2654 на Комисията
    от 17 септември 2025 година за подновяване на
    определянето, че действащите в Бразилия, Япония
    и Мексико режими на платежоспособност, приложими
    за дружествата с централно управление в тези
    трети държави, е временно еквивалентен на предвидения
    в дял I, глава VI от Директива 2009/138/ЕО на Европейския
    парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise v přenesené pravomoci (EU) 2025/2654 ze dne 17. září
    2025, kterým se prodlužuje platnost zjištění, že solventnostní režimy
    platné v Brazílii, Japonsku a Mexiku, které platí pro pojišťovny a zajišťovny
    se sídlem v těchto třetích zemích, jsou prozatímně rovnocenné solventnostnímu
    režimu stanovenému v hlavě I kapitole VI směrnice Evropského parlamentu a
    Rady 2009/138/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede afgørelse (EU) 2025/2654 af 17. september 2025
    om forlængelse af fastslåelsen af, at den solvensordning, der er gældende i
    Brasilien, Japan og Mexico, og som finder anvendelse på selskaber med hovedsæde
    i disse tredjelande, er midlertidigt ækvivalent med ordningen i afsnit I, kapitel
    VI, i Europa-Parlamentets og Rådets direktiv 2009/138/EF
  type: main
- language: el
  script: Grek
