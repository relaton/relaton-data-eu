    (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1715/87 della Commissione del 19 giugno 1987 che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelliccerie lavorate o
    confezionate, della sottovoce 43.03 B della tariffa doganale comune originarie
    della Cina e Hong Kong beneficiarie delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1715/87 van de Commissie van 19 juni 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander bontwerk
    (bewerkte of geconfectioneerde pelterijen) van postonderverdeling 43.03 B van
    het gemeenschappelijk douanetarief, van oorsprong uit China en Hong Kong, waarvoor
    de in Verordening (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1715/87 da Comissão de 19 de Junho de 1987 que
