title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1715/87 of 19 June 1987 re-establishing
    the levying of customs duties on other articles of furskin falling within subheading
    43.03 B, originating in China and Hong Kong, to which the tariff preferences set
    out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1715/87 de la Commission du 19 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux autres pelleteries ouvrées
    ou confectionnées (fourrures) de la sous-position 43.03 B du tarif douanier commun,
    originaires de Chine et de Hong-kong, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1715/87 der Kommission vom 19. Juni 1987 zur Wiedereinführung
    der Erhebung der Zölle für andere Waren aus Pelzfellen der Tarifstelle 43.03
    B des Gemeinsamen Zolltarifs mit Ursprung in China und Hongkong, denen die in
    der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1715/87 af 19. juni 1987 om genindførelse
    af opkrævning af told for andre varer af pelsskind henhørende under pos. 43.03
    B i den fælles toldtarif og med oprindelse i Kina og Hongkong som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1715/87 της Επιτροπής
    της 19ης Ιουνίου 1987 περί αποκαταστάσεως της
