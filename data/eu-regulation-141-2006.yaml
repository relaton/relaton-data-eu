title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 141/2006 of 26 January 2006 specifying the
    extent to which applications lodged in January 2006 for import certificates in
    respect of young male bovine animals for fattening as part of a tariff quota provided
    for in Regulation (EC) No 992/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 141/2006 de la Commission du 26 janvier 2006 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois de janvier 2006 pour les jeunes bovins mâles destinés à
    l'engraissement dans le cadre d'un contingent tarifaire prévu par le règlement
    (CE) n o 992/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 141/2006 der Kommission vom 26. Januar 2006 über das
    Ausmaß, in dem den im Januar 2006 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 992/2005 stattgegeben werden kann
  type: main
- language: cs
  script: Latn
