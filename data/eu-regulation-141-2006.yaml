    v rámci celní kvóty dle nařízení (ES) č. 992/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 141/2006 af 26. januar 2006 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indsendt i januar
    2006 for ungtyre bestemt til opfedning, i forbindelse med et toldkontingent, der
    er fastsat i forordning (EF) nr. 992/2005, kan imødekommes
  type: main
- language: el
  script: Grek
