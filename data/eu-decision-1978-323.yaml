---
id: EUDecision1978323
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 February 1978 authorizing the French Republic
    not to apply Community treatment to electrical measuring, checking, analyzing
    or automatically controlling instruments and apparatus falling within heading
    No 90.28 of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/323/CEE: Décision de la Commission, du 23 février 1978, autorisant
    la République française à exclure du traitement communautaire les instruments
    et appareils électriques ou électroniques de mesure, de vérification, de contrôle,
    de régulation ou d''analyse, de la position 90.28 du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Februar 1978, mit der die Französische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche elektrische oder elektronische Instrumente, Apparate
    und Geräte zum Messen, Prüfen, Kontrollieren, Regeln oder zum Analysieren der
    Tarifnummer 90.28 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 23. februar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage elektriske og elektroniske
    instrumenter og apparater til måling, afprøvning, kontrollering, analysering
    og automatisk regulering, som henhører under pos. 90.28 i den fælles toldtarif,
    har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 febbraio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli strumenti e gli apparecchi
    elettrici o elettronici di misura, di verifica, di controllo, di regolazione o
    di analisi, della voce 90.28 della tariffa doganale comune, originari del Giappone
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 februari 1978 waarbij de Franse Republiek
    wordt gemachtigd elektrische of elektronische meet-, verificatie-, controle-,
    regel- of analyseerinstrumenten, -apparaten en -toestellen van post 90.28 van
    het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
