title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3034/80 of 11 November 1980 fixing the quantities
    of basic products considered to have been used in the manufacture of goods covered
    by Regulation (EEC) No 3033/80 and amending Regulation (EEC) No 950/68 on the
    Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3034/80 du Conseil, du 11 novembre 1980, fixant les
    quantités de produits de base considérées comme étant entrées dans la fabrication
    de marchandises relevant du règlement (CEE) n° 3033/80 et modifiant le règlement
    (CEE) n° 950/68 relatif au tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3034/80 des Rates vom 11. November 1980 zur Festlegung
    der Grunderzeugnismengen, von denen unterstellt wird, daß sie zur Herstellung
    von Waren der Verordnung (EWG) Nr. 3033/80 verwendet worden sind, und zur Änderung
    der Verordnung (EWG) Nr. 950/68 über den Gemeinsamen Zolltarif
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3034/80 af 11. november 1980 om fastsættelse
    af de mængder basisprodukter, der anses som medgået til fremstilling af varer,
    der henhører under forordning (EØF) nr. 3033/80, og om ændring af forordning
    (EØF) nr. 950/68 om den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3034/80 τού Συμβουλίου
    τής 11ης Νοεμβρίου 1980 περί καθορισμού τών ποσοτήτων
    προϊόντων βάσεως πού θεωρούνται ότι έχουν
    χρησιμοποιηθεί στήν παρασκευή εμπορευμάτων,
    τά οποία υπάγονται στόν κανονισμό (ΕΟΚ) αριθ.
    3033/80 καί περί τροποποιήσεως τού κανονισμού
    (ΕΟΚ) αριθ. 950/68 περί Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3034/80 del Consiglio, dell' 11 novembre 1980, che
    fissa i quantitativi di prodotti di base che si considerano entrati nella fabbricazione
    di merci cui si applica il regolamento (CEE) n. 3033/80 e che modifica il regolamento
    (CEE) n. 950/68 relativo alla tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3034/80 van de Raad van 11 november 1980 tot vaststelling
    van de hoeveelheden basisprodukten die worden geacht bij de vervaardiging van
    de onder Verordening (EEG) nr. 3033/80 vallende goederen te zijn gebruikt en tot
    wijziging van Verordening (EEG) nr. 950/68 betreffende het gemeenschappelijk douanetarief
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3034/80 do Conselho, de 11 de Novembro de 1980,
    que fixa as quantidades de produtos de base consideradas como tendo entrado no
    fabrico de mercadorias abrangidas pelo Regulamento (CEE) n.° 3033/80 e que altera
    o Regulamento (CEE) n.° 950/68 relativo à pauta aduaneira comum
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3034/80 del Consejo, de 11 de noviembre de 1980, por
