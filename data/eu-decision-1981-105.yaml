title:
- language: en
  script: Latn
  content: '81/105/EEC: Commission Decision of 5 February 1981 authorizing Ireland
    not to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtle necked jumpers and pullovers, undervests and the like, originating
    in Thailand (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/105/CEE: Décision de la Commission, du 5 février 1981, autorisant
    l''Irlande à exclure du traitement communautaire les chemises, chemisettes, "T-shirts",
    sous-"pulls", maillots de corps et articles similaires, originaires de Thaïlande
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/105/EWG: Entscheidung der Kommission vom 5. Februar 1981 zur Ermächtigung
    Irlands, aus Thailand stammende Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/105/EØF: Kommissionens beslutning af 5. februar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage skjorter, herunder sports-
    og arbejdsskjorter, T-shirts, T-shirts med rullekrave, undertrøjer o. lign.,
    med oprindelse i Thailand (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/105/ΕΟΚ: Απόφαση τής Επιτροπής τής 5ης Φεβρουαρίου
    1981 περί εξουσιοδοτήσεως τής Ιρλανδίας νά αποκλείσει
    από τήν κοινοτική μεταχείριση υποκάμισα, υποκαμισάκια,
    T-shirts, sous-pulls, φανέλες καί παρόμοια είδη καταγόμενα
    από τήν Ταϋλάνδη (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/105/CEE: Decisione della Commissione, del 5 febbraio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le camicie, camicette, T-shirts,
    magliette a collo alto, camiciole e articoli affini, originari della Tailandia
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/105/EEG: Beschikking van de Commissie van 5 februari 1981 houdende
    machtiging van Ierland om overhemden en sporthemden, T-shirts, hemdtruien (sous-pulls),
    tricotpakken, maillots de corps en dergelijke artikelen, van oorsprong uit Thailand,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
