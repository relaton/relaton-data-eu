title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1976 authorizing Ireland to maintain
    protective measures under Article 135 of the Act of Accession in respect of footwear
    with uppers of leather (Common Customs Tariff subheading 64.02 A)
  type: main
- language: fr
  script: Latn
  content: '77/56/CEE: Décision de la Commission, du 17 novembre 1976, autorisant
    l''Irlande à maintenir des mesures de sauvegarde pour les chaussures à dessus
    en cuir naturel (relevant de la sous-position 64.02 A du Tarif douanier commun)
    au titre de l''article 135 de l''Acte d''adhésion'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1976, mit der Irland ermächtigt
    wird, für Schuhe mit Oberteil aus Leder der Tarifstelle 64.02 A des Gemeinsamen
    Zolltarifs Schutzmaßnahmen gemäß Artikel 135 der Beitrittsakte beizubehalten
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. november 1976 om bemyndigelse til Irland
    til at opretholde beskyttelsesforanstaltninger for fodtøj med overdel af læder
    (henhørende under pos. 64.02 A i den fælles toldtarif) i henhold til artikel
    135 i tiltrædelsesakten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1976, che autorizza l'Irlanda
    a mantenere misure di salvaguardia per le calzature in cuoio naturale (della sottovoce
    64.02 A della tariffa doganale comune) ai termini dell'articolo 135 dell'atto
    di adesione
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1976 waarbij Ierland wordt
    gemachtigd vrijwaringsmaatregelen te handhaven voor schoeisel met bovendeel van
    leder (post 64.02 A van het gemeenschappelijk douanetarief), uit hoofde van artikel
    135 van de Toetredingsakte
  type: main
