---
id: EUDecision1962240
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne, en application
    de l'article 226 du Traité, à maintenir pour le chlorure de zinc (position 28.30
    A VII A du tarif douanier italien) la protection douanière telle qu'elle résulte
    de l'exécution intégrale des dispositions du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Ermächtigung der Italienischen
    Republik gemäß Artikel 226 des Vertrages, für Zinkchlorid (Nummer 28.30 A VII
    a des italienischen Zolltarifs) den sich aus der vollständigen Durchführung
    des Vertrages ergebenden Zollschutz beizubehalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa all'autorizzazione accordata alla
    Repubblica Italiana, a norma dell'articolo 226 del Trattato, a mantenere la protezione
    doganale come risulta dall'esecuzione integrale delle disposizioni del Trattato,
    per il cloruro di zinco (voce della tariffa doganale italiana 28.30 A VII a)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende de op grond van artikel 226 van
    het Verdrag aan de Italiaanse Republiek verleende machtiging om de uit de volledige
    tenuitvoerlegging van de bepalingen van het Verdrag voortvloeiende beschermende
    invoerrechten te handhaven voor zinkchloride (post 28.30 A VII a van het Italiaanse
    douanetarief)
  type: main
