title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1600/72 of the Commission of 20 July 1972 amending
    the Annex to Regulation (EEC) No 1373/70 on common detailed rules for the application
    of the system of import and export licences and advance fixing certificates for
    agricultural products subject to a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1600/72 de la Commission, du 20 juillet 1972, modifiant
    l' annexe du règlement (CEE) n° 1373/70, portant modalités communes d' application
    du régime de certificats d' importation, d' exportation, et de préfixation pour
    les produits agricoles soumis à un régime de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1600/72 der Kommission vom 20. Juli 1972 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 1373/70 über gemeinsame Durchführungsvorschriften
    für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für
    landwirtschaftliche Erzeugnisse, die einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1600/72 af 20. juli 1972 om ændring
    af bilaget til forordning (EØF) nr. 1373/70 om fælles gennemførelsesbestemmelser
    for import- og eksportlicenser samt forudfastsættelsesattester for landbrugsvarer,
    for hvilke der gælder en ordning med fællespriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1600/72 della Commissione, del 20 luglio 1972, recante
    modifica dell' allegato del regolamento (CEE) n. 1373/70 che stabilisce modalità
    comuni di applicazione per il regime dei titoli di importazione e di esportazione
    e dei certificati di fissazione anticipata relativi a prodotti agricoli soggetti
    ad un regime di prezzo unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1600/72 van de Commissie van 20 juli 1972 tot wijziging
    van de bijlage van Verordening (EEG) nr. 1373/70 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
    waarvoor een stelsel van gemeenschappelijke prijzen geldt
  type: main
