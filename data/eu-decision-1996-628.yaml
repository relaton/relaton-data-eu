title:
- language: en
  script: Latn
  content: '96/628/EC: Commission Decision of 18 October 1996 amending Decision 96/483/EC
    drawing up the list of third countries entitled to use the model animal health
    certificates for imports into the Community of live poultry and hatching eggs
    other than ratites and eggs thereof as laid down by Decision 96/482/EC'
  type: main
- language: fr
  script: Latn
  content: '96/628/CE: Décision de la Commission du 18 octobre 1996 portant modification
    de la décision 96/483/CE établissant la liste des pays tiers habilités à utiliser
    les certificats sanitaires modèles pour les importations, dans la Communauté,
    de volailles vivantes et d''oeufs à couver, à l''exclusion des ratites et de
    leurs oeufs, conformément à la décision 96/482/CE'
  type: main
- language: de
  script: Latn
  content: '96/628/EG: Entscheidung der Kommission vom 18. Oktober 1996 zur Änderung
    der Entscheidung 96/483/EG zur Erstellung einer Liste von Drittländern, die berechtigt
    sind, die Tiergesundheitsbescheinigungen für Einfuhren von lebendem Geflügel
    und Bruteiern nach den in der Entscheidung 96/482/EG vorgesehenen Mustern zu verwenden'
  type: main
- language: da
  script: Latn
  content: '96/628/EF: Kommissionens Beslutning af 18. oktober 1996 om ændring af
    beslutning 96/483/EF om listen over tredjelande, der er berettiget til at benytte
    modellen til sundhedscertifikater ved indførsel til Fællesskabet af levende
    fjerkræ og rugeæg, bortset fra strudsefugle og strudseæg, som fastsat i beslutning
    96/482/EF'
  type: main
- language: el
  script: Grek
  content: '96/628/ΕΚ: Απόφαση της Επιτροπής της 18ης Οκτωβρίου
    1996 για τροποποίηση της απόφασης 96/483/ΕΚ περί
    καταρτίσεως του καταλόγου τρίτων χωρών στις
    οποίες επιτρέπεται να χρησιμοποιούν τα υποδείγματα
    των ζωοϋγειονομικών πιστοποιητικών για εισαγωγές
    ζωντανών πουλερικών και αυγών προς εκκόλαψη,
    εκτός των στρουθιονιδών και των αυγών τους,
    όπως προβλέπεται στην απόφαση 96/482/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '96/628/EY: Komission päätös, tehty 18 päivänä lokakuuta 1996, päätöksessä
    96/483/EY määrättyjen elävän siipikarjan ja siitosmunien, lukuun ottamatta
    sileälastaisia lintulajeja ja niiden munia, yhteisöön tuontia varten myönnettävien
    eläinten terveystodistusten malleja käyttämään oikeutettujen kolmansien maiden
    luettelon laatimisesta tehdyn päätöksen 96/482/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/628/CE: Decisione della Commissione del 18 ottobre 1996 recante modifica
    della decisione 96/483/CE che stabilisce l''elenco dei paesi terzi autorizzati
    a utilizzare i modelli di certificati sanitari per le importazioni nella Comunità
    di pollame vivo e uova da cova, ad eccezione dei ratiti e delle relative uova,
    definiti dalla decisione 96/482/CE della Commissione'
  type: main
- language: nl
  script: Latn
  content: '96/628/EG: Beschikking van de Commissie van 18 oktober 1996 tot wijziging
    van Beschikking 96/483/EG houdende vaststelling van de lijst van derde landen
    die gebruik mogen maken van de diergezondheidscertificaten voor de invoer van
    levend pluimvee en broedeieren, met uitzondering van ratieten en eieren daarvan,
    volgens het bij Beschikking 96/482/EG vastgestelde model'
  type: main
- language: pt
  script: Latn
  content: '96/628/CE: Decisão da Comissão de 18 de Outubro de 1996 que altera a
    Decisão 96/483/CE, que estabelece a lista dos países terceiros autorizados a
    utilizar os modelos de certificados sanitários para as importações de aves
    de capoeira vivas e de ovos para incubação, com exclusão das ratites e seus
    ovos, constantes da Decisão 96/482/CE'
  type: main
- language: es
  script: Latn
  content: '96/628/CE: Decisión de la Comisión de 18 de octubre de 1996 que modifica
    la Decisión 96/483/CE por la que se establece la lista de terceros países autorizados
    para utilizar, en las importaciones de aves de corral vivas y huevos para incubar,
    excepto las rátidas y sus huevos, los modelos de certificados sanitarios que
    figuran en la Decisión 96/482/CE'
  type: main
- language: sv
  script: Latn
  content: '96/628/EG: Kommissionens beslut av den 18 oktober 1996 om ändring av
    beslut 96/483/EG om upprättande av förteckningen över tredje länder med rätt
    att använda förlagan till djurhälsointygen för import till gemenskapen av
    levande fjäderfä och kläckägg, med undantag för strutsfåglar och deras ägg,
    enligt beslut 96/482/EG'
  type: main
