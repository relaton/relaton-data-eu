    da destilação de apoio relativa ao vinho de mesa aberta pelo Regulamento (CEE)
    nº 130/93 para a campanha de 1992/1993
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2141/93 de la Comisión, de 29 de julio de 1993, por
