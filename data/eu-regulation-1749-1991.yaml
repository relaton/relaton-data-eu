title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1749/91 of 19 June 1991 re-establishing
    the levying of customs duties on products falling within CN code 9503, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1749/91 DE LA COMMISSION du 19 juin 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 9503
    originaires de la Chine, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1749/91 DER KOMMISSION vom 19. Juni 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 9503 mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1749/91 af 19. juni 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 9503 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1749/91 της Επιτροπής
    της 19ης Ιουνίου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 9503 καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1749/91 DELLA COMMISSIONE del 19 giugno 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 9503 originari della Cina, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1749/91 VAN DE COMMISSIE van 19 juni 1991 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 9503, van oorsprong uit China, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1749/91 DA COMISSAO, DE 19 DE JUNHO DE 1991, QUE
    RESTABELECE A COBRANCA DOS DIREITOS ADUANEIROS APLICAVEIS AOS PRODUTOS DO CODIGO
    NC 9503, ORIGINARIOS DA CHINA, BENEFICIARIOS DAS PREFERENCIAS PAUTAIS PELO REGULAMENTO
    ( CEE ) NO 3831/90 DO CONSELHO
  type: main
- language: es
  script: Latn
