  script: Latn
  content: '88/343/EEC: Commission Decision of 26 May 1988 amending for the second
    time Commission Decision 87/361/EEC recognizing certain parts of the territory
    of the French Republic as being officially swine fever-free (only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/343/CEE: Décision de la Commission du 26 mai 1988 portant deuxième
