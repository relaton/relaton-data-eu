  script: Latn
  content: Direttiva 2000/82/CE della Commissione, del 20 dicembre 2000, recante modifica
    degli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio, che fissano le quantità massime di residui di antiparassitari
    rispettivamente sugli e negli ortofrutticoli, sui e nei cereali, sui e nei prodotti
    alimentari di origine animale e su e in alcuni prodotti di origine vegetale, compresi
    gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/82/EK (2000. gada 20. decembris), ar kuru groza
    pielikumus Padomes Direktīvai 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK
    par pesticīdu atlieku maksimāli pieļaujamo daudzumu noteikšanu attiecīgi
    augļos un dārzeņos un uz tiem, labībā un uz tās, dzīvnieku izcelsmes produktos
    un uz tiem un dažos augu izcelsmes produktos, to skaitā augļos un dārzeņos
    un uz tiem
  type: main
