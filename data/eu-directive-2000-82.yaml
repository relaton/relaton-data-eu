    leistinos pesticidų likučio koncentracijos vaisiuose ir daržovėse, grūdinėse
    kultūrose, gyvūninės kilmės maisto produktuose ir kai kuriuose augalinės
    kilmės produktuose, įskaitant vaisius ir daržoves, ir ant jų priedus
  type: main
