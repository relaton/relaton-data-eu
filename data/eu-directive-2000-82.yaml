    illetőleg az egyes növényi eredetű termékekben – többek között a gyümölcsökben
    és zöldségekben –, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 76/895/EGK,
    86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
