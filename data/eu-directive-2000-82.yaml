  script: Latn
  content: Directive 2000/82/CE de la Commission du 20 décembre 2000 modifiant les
    annexes des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil
    concernant la fixation de teneurs maximales pour les résidus de pesticides respectivement
    sur et dans les céréales, les denrées alimentaires d'origine animale et certains
    produits d'origine végétale, y compris les fruits et légumes
  type: main
