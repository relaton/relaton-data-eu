  script: Latn
  content: Commission Directive 2000/82/EC of 20 December 2000 amending the Annexes
    to Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC on the
    fixing of maximum levels for pesticide residues in and on fruit and vegetables,
    cereals, foodstuffs of animal origin and certain products of plant origin, including
    fruit and vegetables respectively
  type: main
