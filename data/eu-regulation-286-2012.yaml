title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) No 286/2012 of 27 January 2012 amending,
    in order to include a new textile fibre name, Annex I, and, for the purposes of
    their adaptation to technical progress, Annexes VIII and IX to Regulation (EU)
    No 1007/2011 of the European Parliament and of the Council on textile fibre names
    and related labelling and marking of the fibre composition of textile products
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) n ° 286/2012 de la Commission du 27 janvier
    2012 modifiant, afin d’inclure une nouvelle dénomination de fibre textile,
    l'annexe I et, aux fins de leur adaptation au progrès technique, les annexes
    VIII et XI du règlement (UE) n ° 1007/2011 du Parlement européen et du Conseil
    relatif aux dénominations des fibres textiles et à l’étiquetage et au marquage
    correspondants des produits textiles
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) Nr. 286/2012 der Kommission vom 27. Januar 2012
