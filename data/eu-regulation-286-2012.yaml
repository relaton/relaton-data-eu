    ehhez kapcsolódó címkézéséről és jelöléséről szóló 1007/2011/EU
    európai parlamenti és tanácsi rendelet I. mellékletének új textilszál-elnevezéssel
    való kiegészítése érdekében, valamint VIII. és IX. mellékletének a műszaki
    fejlődéshez való hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) n. 286/2012 della Commissione, del 27 gennaio
    2012 , che modifica rispettivamente l’allegato I e gli allegati VIII e IX del
    regolamento (UE) n. 1007/2011, del Parlamento europeo e del Consiglio relativo
    alle denominazioni delle fibre tessili e all’etichettatura e al contrassegno
