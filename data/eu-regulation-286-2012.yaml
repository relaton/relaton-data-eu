    Parlaments und des Rates über die Bezeichnungen von Textilfasern und die damit
    zusammenhängende Etikettierung und Kennzeichnung der Faserzusammensetzung von
    Textilerzeugnissen zwecks Hinzufügung einer neuen Textilfaserbezeichnung sowie
    der Anhänge VIII und IX dieser Verordnung zwecks Anpassung an den technischen
    Fortschritt
  type: main
