    połowów okrężnicą, pływające pod banderą Hiszpanii lub Francji, lub zarejestrowane
    w Hiszpanii lub we Francji, prowadzące połowy tuńczyka błękitnopłetwego
    w Oceanie Atlantyckim, na wschód od 45° długości geograficznej zachodniej,
    oraz w Morzu Śródziemnym
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 476/2012 da Comissão, de 5 de junho
    de 2012 , que proíbe as atividades de pesca dos cercadores com rede de cerco
    com retenida que arvoram pavilhão de Espanha ou França ou estão registados
    em Espanha ou França e exercem a pesca do atum rabilho no oceano Atlântico,
    a leste de 45° W, e no mar Mediterrâneo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 476/2012 al Comisiei din 5
    iunie 2012 de interzicere a activităților de pescuit ale navelor cu plasă-pungă
    care arborează pavilionul Spaniei sau al Franței sau sunt înregistrate în
    Spania sau în Franța și care pescuiesc ton roșu în Oceanul Atlantic, la est
    de meridianul de 45° longitudine vestică, și în Marea Mediterană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 476/2012 z 5. júna 2012 , ktorým
    sa zakazujú rybolovné činnosti plavidlám s kruhovými záťahovými sieťami
    plaviacim sa pod vlajkou Španielska alebo Francúzska alebo registrovaným v
    Španielsku alebo vo Francúzsku, ktoré lovia tuniaka modroplutvého v Atlantickom
    oceáne východne od 45° západnej dĺžky a v Stredozemnom mori
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 476/2012 z dne 5. junija 2012 o prepovedi
    ribolovnih dejavnosti z ribiškimi plovili z zapornimi plavaricami, ki plujejo
    pod zastavo Španije ali Francije ali so registrirana v Španiji ali Franciji
