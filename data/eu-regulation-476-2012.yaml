title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 476/2012 of 5 June 2012 prohibiting
    fishing activities for purse seiners flying the flag of Spain or France or registered
    in Spain or France, fishing for bluefin tuna in the Atlantic Ocean, east of longitude
    45° W, and in the Mediterranean Sea
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 476/2012 de la Commission du 5 juin
    2012 interdisant, dans l’océan Atlantique, à l’est de la longitude 45°
    O, et dans la mer Méditerranée, la pêche du thon rouge par les senneurs à
    senne coulissante battant pavillon de l’Espagne ou de la France ou enregistrés
    dans ces États membres
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 476/2012 der Kommission vom 5. Juni 2012
    über ein Verbot des Fangs von Rotem Thun im Atlantik östlich von 45° W und
    im Mittelmeer durch Ringwadenfänger, die die Flagge Spaniens oder Frankreichs
    führen oder in Spanien oder Frankreich registriert sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 476/2012 на Комисията
    от 5 юни 2012 година за забрана на риболовни дейности
    от страна на кораби с мрежи гъргър под флага
    на Испания или Франция, или регистрирани в
    Испания или Франция, извършващи риболов на
    червен тон в Атлантическия океан, на изток
    от 45° западна дължина и в Средиземно море
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 476/2012 ze dne 5. června 2012
    , kterým se zakazuje rybolov tuňáka obecného v Atlantském oceánu východně
    od 45° z. d. a ve Středozemním moři plavidly lovícími košelkovými nevody
    plujícími pod vlajkou Španělska nebo Francie nebo registrovanými ve Španělsku
    nebo Francii
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 476/2012 af 5. juni 2012
    om forbud mod fiskeri efter almindelig tun i Atlanterhavet øst for 45° V og
