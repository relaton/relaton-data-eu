    dolžine in v Sredozemskem morju
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 476/2012 de la Comisión, de 5 de junio
    de 2012 , por el que se prohíben las actividades pesqueras de los cerqueros que
    enarbolan pabellón de España o Francia o están matriculados en España o Francia
    y practican la pesca de atún rojo en el Océano Atlántico, al este del meridiano
    45° O, y en el Mar Mediterráneo
  type: main
