  content: Commission Implementing Regulation (EU) 2017/1159 of 29 June 2017 amending
    Council Implementing Regulation (EU) No 1105/2010 and Commission Implementing
    Regulation (EU) 2017/325 as regards the definition of the product scope of the
    current anti-dumping measures concerning imports of high tenacity yarns of polyesters
    originating in the People's Republic of China, and providing for the possibility
    of repayment or remission of duties in certain cases
  type: main
