    d'exécution (UE) 2017/325 de la Commission en ce qui concerne la définition
    du produit soumis aux mesures antidumping en vigueur applicables aux importations
    de fils de polyesters à haute ténacité originaires de la République populaire
    de Chine, et prévoyant la possibilité du remboursement ou de la remise des droits
    dans certains cas
  type: main
