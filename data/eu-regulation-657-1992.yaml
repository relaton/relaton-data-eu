  content: Commission Regulation (EEC) No 657/92 of 16 March 1992 amending Regulation
    (EEC) No 3743/91 laying down detailed rules for the application of the import
    arrangements provided for by Council Regulations (EEC) No 3668/91 and (EEC) No
    3669/91 in the beef and veal sectors, and Regulation (EEC) No 3744/91 laying down
    detailed rules for the application of import arrangements provided for in Council
    Regulation (EEC) No 3670/91 for frozen thin skirt of bovine animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 657/92 de la Commission du 16 mars 1992 modifiant
    les règlements (CEE) n° 3743/91, portant modalités d'application des régimes
    d'importation prévus par les règlements (CEE) n° 3668/91 et (CEE) n 3669/91
    du Conseil dans le secteur de la viande bovine, et (CEE) n 3744/91, portant modalités
    d'application du régime d'importation prévu par le règlement (CEE) n° 3670/91
    du Conseil pour la hampe congelée de l'espèce bovine
  type: main
- language: de
  script: Latn
