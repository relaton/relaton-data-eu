title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1155/91 of 3 May 1991 re- establishing the
    levying of customs duties on products of category 6 (order No 40.0060), originating
    in Pakistan, to which the preferential tariff arrangement set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1155/91 DE LA COMMISSION du 3 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    6 (numéro d'' ordre 40.0060) originaires du Pakistan bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1155/91 DER KOMMISSION vom 3. Mai 1991 über die
    Wiedereinführung des Zollsatzes für Waren der Kategorie Nr. 6 (lfd. Nummer 40.0060)
    mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1155/91 af 3. maj 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 6 (løbenummer 40.0060), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1155/91 της Επιτροπής
    της 3ης Μαΐου 1991 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    6 ( αύξων αριθμός 40.0060 ), καταγωγής Πακιστάν,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3832/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1155/91 DELLA COMMISSIONE del 3 maggio 1991 che ripristina
    la riscossione dei dazi doganali applicabili ai prdotti della categoria n. 6 (numero
    d'' ordine 40.0060) originari del Pakistan, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1155/91 VAN DE COMMISSIE van 3 mei 1991 houende
    wederinstelling van de heffing van invoerrechten van toepassing op produkten van
