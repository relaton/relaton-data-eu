    den Vertrieb und die Einfuhr von Lebensmitteln tierischen Ursprungs im Hinblick
    auf die Aufnahme einer Behandlung zur Abtötung bestimmter Seuchenerreger in Fleisch
    (Bekanntgegeben unter Aktenzeichen C(2013) 4853)'
