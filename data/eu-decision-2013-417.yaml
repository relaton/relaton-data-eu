title:
- language: en
  script: Latn
  content: '2013/417/EU: Commission Implementing Decision of 31 July 2013 amending
    Annex III to Council Directive 2002/99/EC laying down the animal health rules
    governing the production, processing, distribution and introduction of products
    of animal origin for human consumption as regards the addition of a treatment
    to eliminate certain animal health risks in meat (notified under document C(2013)
    4853)'
  type: main
- language: fr
  script: Latn
  content: '2013/417/UE: Décision d’exécution de la Commission du 31 juillet 2013
    modifiant l’annexe III de la directive 2002/99/CE du Conseil fixant les règles
    de police sanitaire régissant la production, la transformation, la distribution
    et l’introduction des produits d’origine animale destinés à la consommation
    humaine en vue d’ajouter un traitement visant à éliminer certains risques
    pour la santé animale liés aux viandes [notifiée sous le numéro C(2013) 4853]'
  type: main
- language: de
