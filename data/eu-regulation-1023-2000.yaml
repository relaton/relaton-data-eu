  script: Latn
  content: Commission Regulation (EC) No 1023/2000 of 16 May 2000 amending Regulation
    (EC) No 1758/98 increasing to 3 950 000 tonnes the quantity of wheat of breadmaking
    quality held by the French intervention agency for which a standing invitation
    to tender for export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1023/2000 de la Commission du 16 mai 2000 modifiant
