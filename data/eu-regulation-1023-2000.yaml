    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1023/2000 der Kommission vom 16. Mai 2000 zur Änderung
    der Verordnung (EG) Nr. 1758/98 und zur Erhöhung der Dauerausschreibung zur Ausfuhr
    von im Besitz der französischen Interventionsstelle befindlichem Brotweichweizen
    auf 3 950 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1023/2000 af 16. maj 2000 om ændring
    af forordning (EF) nr. 1758/98 og om forhøjelse til 3 950 000 tons af den løbende
    licitation med henblik på eksport af bageegnet blød hvede, som er i det franske
    interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
