    (ΕΚ) αριθ. 1758/98 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 3 950 000 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γαλλικός οργανισμός
    παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1023/2000, annettu 16 päivänä toukokuuta 2000,
    asetuksen (EY) N:o 1758/98 muuttamisesta ja Ranskan interventioelimen hallussaan
    pitämän leipävehnän vientiä koskevan pysyvän tarjouskilpailun kohteena olevan
    määrän nostamisesta 3 950 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1023/2000 della Commissione, del 16 maggio 2000, che
