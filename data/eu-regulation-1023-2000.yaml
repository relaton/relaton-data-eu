    openbare inschrijving voor de uitvoer van zachte tarwe van bakkwaliteit uit Franse
    interventievoorraden betrekking heeft, tot 3 950 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1023/2000 da Comissão, de 16 de Maio de 2000, que
