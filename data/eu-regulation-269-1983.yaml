    en lo referente a las medidas de control vinculadas a la concesión de una ayuda
    a la compra de mantequilla por las instituciones y las colectividades sin fines
    lucrativos así como por el Ejército y las unidades asimiladas de los Estados
    miembros
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 269/83 av den 1 februari 1983 om den
