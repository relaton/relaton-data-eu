title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 269/83 of 1 February 1983 amending for the
    fourth time Regulations (EEC) No 2191/81 and (EEC) No 2192/81 with regard to the
    control measures connected with the granting of aid for the purchase of butter
    by non-profit-making institutions and organizations and by the armies and similar
    forces of the Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 269/83 de la Commission du 1er février 1983 portant
    quatrième modification des règlements (CEE) n° 2191/81 et (CEE) n 2192/81 en
    ce qui concerne les mesures de contrôle liées à l'octroi d'une aide à l'achat
    de beurre par les institutions et les collectivités sans but lucratif ainsi que
    par l'armée et les unités assimilées des États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 269/83 der Kommission vom 1. Februar 1983 zur vierten
    Änderung der Verordnungen (EWG) Nr. 2191/81 und (EWG) Nr. 2192/81 hinsichtlich
    der Kontrollmaßnahmen, die mit der Gewährung einer Beihilfe zum Ankauf von Butter
    durch gemeinnützige Einrichtungen sowie durch die Streitkräfte und ihnen gleichgestellte
    Einheiten der Mitgliedstaaten verbunden sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 269/83 на Комисията от 1 февруари
    1983 година за изменение за четвърти път на Регламенти
    (ЕИО) № 2191/81 и (ЕИО) № 2192/81 по отношение на контролните
    мерки, свързани с предоставянето на помощ за
    закупуването на масло от институции и организации
    с нестопанска цел, както и от армията и институциите
    с подобен статут в държавите-членки
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 269/83 ze dne 1. února 1983, kterým se počtvrté
    mění nařízení (EHS) č. 2191/81 a (EHS) č. 2192/81, pokud jde o kontrolní
    opatření související s poskytováním podpory pro nákup másla neziskovými
    institucemi a organizacemi, armádami a podobnými silami členských států
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 269/83 af 1. februar 1983 om fjerde
    ændring af forordning (EØF) nr. 2191/81 og (EØF) nr. 2192/81 for så vidt angår
    kontrolforanstaltningerne i forbindelse med ydelse af støtte til smør, der købes
    af institutioner eller samfund, der ikke arbejder med gevinst for øje, samt af
    væbnede styrker og dermed ligestillede enheder i medlemsstaterne
  type: main
- language: el
  script: Grek
