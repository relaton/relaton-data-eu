    valamint fegyveres és hasonló testületei által történő vajbeszerzéshez
    nyújtott támogatással kapcsolatos ellenőrző intézkedések tekintetében
    negyedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 269/83 della Commissione del 1o febbraio 1983 recante
    quarta modifica dei regolamenti (CEE) n. 2191/81 e (CEE) n. 2192/81 per quanto
    riguarda le misure di controllo connesse alla concessione di un aiuto per l'acquisto
    di burro da parte delle istituzioni e collettività senza scopo di lucro nonché
    da parte delle forze armate e corpi assimilati degli Stati membri
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 269/83 (1983. gada 1. februāris), ar kuru ceturto
    reizi groza Regulas (EEK) Nr. 2191/81 un (EEK) Nr. 2192/81 attiecībā uz kontroles
    pasākumiem, kas saistīti ar atbalsta piešķiršanu dalībvalstu bezpeļņas
    iestāžu un organizāciju, kā arī armiju un līdzīgu spēku sviesta pirkumiem
  type: main
- language: lt
  script: Latn
  content: 1983 m. vasario 1 d. Komisijos Reglamentas (EEB) Nr. 269/83 ketvirtą kartą
    iš dalies keičiantis Reglamentus (EEB) Nr. 2191/81 ir (EEB) Nr. 2192/81 dėl
    kontrolės priemonių, susijusių su pagalbos suteikimu valstybių narių pelno
    nesiekiančioms institucijoms ir organizacijoms bei armijoms ir panašioms pajėgoms
    sviestui pirkti
  type: main
- language: mt
  script: Latn
  content: Regolament tal-kummissjoni (KEE) Nru 269/83 ta’ l-1 ta’ Frar 1983 li
    jemenda għar-raba’ darba r-Regolamenti (KEE) Nri 2191/81 u (KEE) Nru 2192/81
    fejn jikkonċerna l-miżuri ta’ kontroll konnessi ma l-għoti ta’ għajnuna
    għax-xiri ta’ butir minn istituzzjonijiet u organizzazzjonijiet li ma jagħmlux
    profitt u mill-armati u forzi oħra simili ta’ l-Istati Membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 269/83 van de Commissie van 1 februari 1983 tot vierde
    wijziging van de Verordeningen (EEG) nr. 2191/81 en (EEG) nr. 2192/81 ten aanzien
    van de controlemaatregelen in verband met de toekenning van steun voor de aankoop
    van boter door instellingen en gemeenschappen zonder winstoogmerk, alsmede door
    het leger en de daarmee gelijkgestelde eenheden van de Lid-Staten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) NR 269/83 z dnia 1 lutego 1983 r. zmieniające
    po raz czwarty rozporządzenia (EWG) nr 2191/81 oraz (EWG) nr 2192/81 w odniesieniu
    do środków kontroli związanych z przyznawaniem pomocy na zakup masła przez
    instytucje i organizacje o celu niezarobkowym oraz armie i podobne jednostki Państw
    Członkowskich
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 269/83 da Comissão, de 1 de Fevereiro de 1983, que
    estabelece a quarta alteração aos Regulamentos (CEE) nº 2191/81 e (CEE) nº
    2192/81 no que diz respeito às medidas de controlo ligadas à concessão de uma
    ajuda à compra de manteiga pelas instituições e colectividades sem fins lucrativos,
    bem como pelo exército e unidades similares dos Estados-membros
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 269/83 al comisiei din 1 februarie 1983 privind
    a patra modificare a Regulamentelor (CEE) nr. 2191/81 și (CEE) nr. 2192/81 în
    ceea ce privește măsurile de control legate de acordarea unui ajutor pentru
    achiziționarea untului de către instituțiile și colectivitățile fără scop
    lucrativ, precum și de către armată și unitățile similare din statele membre
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 269/83 z 1. februára 1983, ktorým sa štvrtýkrát
    menia a dopĺňajú nariadenia (EHS) č. 2191/81 a (EHS) č. 2192/81 v súvislosti
    s kontrolnými opatreniami spojenými s udeľovaním pomoci pre nákup masla neziskovými
    inštitúciami a organizáciami, armádami a podobnými ozbrojenými silami členských
    štátov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 269/83 z dne 1. februarja 1983 o četrti spremembi
    Uredbe (EGS) št. 2191/81 in (EGS) št. 2192/81 glede nadzornih ukrepov, povezanih
    z dodeljevanjem pomoči za nakup masla neprofitnim ustanovam in organizacijam
    ter vojskam in podobnim enotam držav članic
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 269/83 de la Comisión, de 1 de febrero de 1983, sobre
