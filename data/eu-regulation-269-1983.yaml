    voittoa tavoittelemattomille laitoksille ja yhteisöille sekä jäsenvaltioiden
    armeijoille ja vastaaville yksiköille voin ostoon myönnettävään tukeen liittyvien
    tarkastusmenettelyjen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 269/83/EGK rendelete (1983. február 1.) a 2191/81/EGK és
