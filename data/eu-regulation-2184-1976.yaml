  content: Commission Regulation (EEC) No 2184/76 of 3 September 1976 concerning the
    issue of an invitation to tender for the supply to the International Committee
    of the Red Cross, for Panama for use as food aid, of vitaminized skimmed-milk
    powder to be purchased on the Community market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2184/76 de la Commission, du 3 septembre 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté et destiné
    au Comité international de la Croix-Rouge pour le Panama
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2184/76 der Kommission vom 3. September 1976 über
    eine Ausschreibung für die Lieferung von auf dem Markt der Gemeinschaft gekauftem
    Magermilchpulver mit zugesetzten Vitaminen, das im Rahmen der Nahrungsmittelhilfe
    an das Internationale Komitee vom Roten Kreuz für Panama bestimmt ist
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2184/76 af 3. september 1976 om licitation
