  content: Council Decision (EU) 2021/1055 of 21 June 2021 on the position to be taken
    on behalf of the European Union within the Conference of Contracting Parties to
    the Convention on the collection, deposit and reception of waste generated during
    navigation on the Rhine and other inland waterways (CDNI) on the adoption of the
    resolution aiming to extend the ban on the discharging of domestic wastewater
    to inland waterways vessels carrying between 12 and 50 passengers
  type: main
- language: fr
  script: Latn
