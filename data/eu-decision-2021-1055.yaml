    des déchets survenant en navigation rhénane et intérieure (CDNI) sur l’adoption
    de la résolution visant à étendre l’interdiction du rejet des eaux usées
    domestiques aux bateaux de navigation intérieure transportant entre 12 et 50
    passagers
