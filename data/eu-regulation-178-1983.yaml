title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 178/83 of 25 January 1983 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 178/83 du Conseil du 25 janvier 1983 fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 178/83 des des Rates vom 25. Januar 1983 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    Schiffe unter norwegischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 178/83 af 25. januar 1983 om fastsættelse
    af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, som fører norsk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 178/83 του Συμβουλίου
    της 25ης Ιανουαρίου 1983 περί καθορισμού ορισμένων
    ενδιάμεσων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων τα οποία εφαρμόζονται
    σε σκάφη υπό νορβηγική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 178/83 del Consiglio del 25 gennaio 1983 che dispone
    talune misure provvisorie di conservazione e di gestione delle risorse di pesca,
    da applicare ai pescherecci battenti bandiera della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 178/83 van de Raad van 25 januari 1983 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op vaartuigen die de vlag van Noorwegen voeren
  type: main
