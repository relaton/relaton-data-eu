  content: Règlement n° 73/63/CEE du Conseil, du 11 juillet 1963, modifiant et complétant
    certaines dispositions des règlements n° 3 et 4 (travailleurs saisonniers et
    autres travailleurs qui ne résident pas dans le pays à la législation duquel
    ils sont soumis)
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 73/63/EWG des Rats vom 11. Juli 1963 zur Änderung und Ergänzung
    verschiedener Bestimmungen der Verordnungen Nr. 3 und Nr. 4 (Saisonarbeiter und
    sonstige Arbeitnehmer, die nicht in dem Land wohnen, dessen Rechtsvorschriften
    für sie gelten)
  type: main
- language: it
  script: Latn
  content: Regolamento n. 73/63/CEE del Consiglio, dell'11 luglio 1963, che modifica
    e integra alcune disposizioni dei regolamenti n. 3 e 4 (lavoratori stagionali
    e altri lavoratori che non risiedono nel paese nella cui legislazione sono sottoposti)
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 73/63/EEG van de Raad van 11 juli 1963 tot wijziging en
