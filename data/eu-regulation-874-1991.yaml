  content: Commission Regulation (EEC) No 874/91 of 9 April 1991 abolishing the corrective
    amount on the import of artichokes into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 874/91 de la Commission, du 9 avril 1991, supprimant
