    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή
    στην Κοινότητα των Δέκα αγκινάρων από την Ισπανία,
    εκτός των Καναρίων Νήσων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 874/91 della Commissione, del 9 aprile 1991, che sopprime
    l'importo correttore da riscuotere all'importazione nella Comunità a dieci di
    carciofi in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 874/91 van de Commissie van 9 april 1991 tot intrekking
