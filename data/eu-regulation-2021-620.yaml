title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/620 of 15 April 2021 laying
    down rules for the application of Regulation (EU) 2016/429 of the European Parliament
    and of the Council as regards the approval of the disease-free and non-vaccination
    status of certain Member States or zones or compartments thereof as regards certain
    listed diseases and the approval of eradication programmes for those listed diseases
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/620 de la Commission du 15 avril 2021
    établissant les modalités d’application du règlement (UE) 2016/429 du Parlement
    européen et du Conseil en ce qui concerne l’approbation du statut «indemne
    de maladie» et du statut de non-vaccination de certains États membres ou de
    zones ou compartiments de ceux-ci au regard de certaines maladies répertoriées
    et l’approbation des programmes d’éradication de ces maladies répertoriées
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/620 der Kommission vom 15. April 2021
    mit Durchführungsbestimmungen zur Verordnung (EU) 2016/429 des Europäischen
    Parlaments und des Rates hinsichtlich der Genehmigung des Status „seuchenfrei“
    und des Status der Nichtimpfung für bestimmte Mitgliedstaaten oder Zonen oder
    Kompartimente dieser Mitgliedstaaten in Bezug auf bestimmte gelistete Seuchen
    und der Genehmigung von Tilgungsprogrammen für diese gelisteten Seuchen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/620 на Комисията
    от 15 април 2021 година за установяване на правила
    за прилагането на Регламент (ЕС) 2016/429 на Европейския
    парламент и на Съвета във връзка с одобряването
    на статута „свободен от болест“ и на статута
    „без ваксинация“ на някои държави членки
    или зони или компартменти от тях по отношение
    на определени болести от списъка и одобряването
    на програми за ликвидиране на тези болести
    от списъка
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/620 ze dne 15. dubna 2021, kterým
    se stanoví prováděcí pravidla k nařízení Evropského parlamentu a Rady
    (EU) 2016/429, pokud jde o schválení statusu území prostého nákazy a statusu
    území, kde se neprovádí vakcinace, některých členských států nebo jejich
    oblastí či jednotek pro některé nákazy uvedené na seznamu a schválení
    eradikačních programů pro zmíněné nákazy uvedené na seznamu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/620 af 15. april 2021
    om regler for anvendelsen af Europa-Parlamentets og Rådets forordning (EU) 2016/429
    for så vidt angår godkendelse af status som sygdomsfri og ikkevaccinationsstatus
    for visse medlemsstater eller zoner eller kompartmenter deri med hensyn til visse
    listeopførte sygdomme og godkendelse af programmer for udryddelse af disse listeopførte
    sygdomme
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/620 της Επιτροπής
    της 15ης Απριλίου 2021 για τη θέσπιση κανόνων
    εφαρμογής του κανονισμού (ΕΕ) 2016/429 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου όσον αφορά
