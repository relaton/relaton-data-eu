    εν λόγω καταγεγραμμένων νόσων
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/620, 15. aprill 2021, milles sätestatakse
    eeskirjad Euroopa Parlamendi ja nõukogu määruse (EL) 2016/429 kohaldamiseks
    seoses teatavate liikmesriikide ning nende tsoonide ja bioturvarühmikute taudivaba
    staatuse ja vaktsineerimisvaba staatuse heakskiitmisega teatavate loetellu kantud
    taudide suhtes ning nende taudide likvideerimise programmide heakskiitmisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/620, annettu 15 päivänä
    huhtikuuta 2021, Euroopan parlamentin ja neuvoston asetuksen (EU) 2016/429 soveltamissäännöistä
    siltä osin kuin on kyse tiettyjen jäsenvaltioiden tai niiden vyöhykkeiden tai
    lokeroiden taudista vapaan aseman ja rokottamattomuusstatuksen hyväksymisestä
    tiettyjen luetteloitujen tautien osalta sekä kyseisten luetteloitujen tautien
    hävittämisohjelmien hyväksymisestä (ETA:n kannalta merkityksellinen teksti)4
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/620 ón gCoimisiún an 15 Aibreán
    2021 lena leagtar síos rialacha maidir le cur i bhfeidhm Rialachán (AE) 2016/429
    ó Pharlaimint na hEorpa agus ón gComhairle a mhéid a bhaineann le formheas
    an stádais saor ó ghalair agus an stádais neamh-vacsaínithe atá ag Ballstát
    áirithe nó ag criosanna nó deighleoga díobh i ndáil le galair liostaithe
    áirithe agus formheas na gclár díothaithe le haghaidh na ngalar liostaithe
    sin
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/620 оd 15. travnja 2021. o utvrđivanju
    pravila za primjenu Uredbe (EU) 2016/429 Europskog parlamenta i Vijeća u pogledu
    odobravanja statusa „slobodno od bolesti” i statusa područja na kojemu se
    ne provodi cijepljenje za određene države članice ili njihove zone ili kompartmente
    s obzirom na određene bolesti s popisa te u pogledu odobravanja programa iskorjenjivanja
    tih bolesti s popisa
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/620 végrehajtási rendelete (2021. április 15.)
    az (EU) 2016/429 európai parlamenti és tanácsi rendeletnek az egyes tagállamok
    és azok körzetei vagy kompartmentjei „betegségtől mentes” és „nem vakcinázó”
    státuszának bizonyos jegyzékbe foglalt betegségek tekintetében történő
    jóváhagyása, valamint az említett betegségekre vonatkozó mentesítési programok
    jóváhagyása tekintetében történő alkalmazására vonatkozó szabályok
    megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/620 della Commissione del 15 aprile
    2021 recante modalità di applicazione del regolamento (UE) 2016/429 del Parlamento
    europeo e del Consiglio per quanto riguarda l’approvazione dello status di indenne
    da malattia e dello status di zona di non vaccinazione di alcuni Stati membri
    o di loro zone o compartimenti in relazione ad alcune malattie elencate e all’approvazione
    dei programmi di eradicazione per tali malattie elencate
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/620 (2021. gada 15. aprīlis),
    ar ko nosaka noteikumus par Eiropas Parlamenta un Padomes Regulas (ES) 2016/429
    piemērošanu saistībā ar statusa “brīvs no slimības” un “neveic vakcināciju”
    apstiprināšanu noteiktām dalībvalstīm vai to zonām vai nodalījumiem attiecībā
    uz noteiktām sarakstā norādītām slimībām, kā arī apstiprina šo sarakstā
    norādīto slimību izskaušanas programmas
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/620 2021 m. balandžio 15
    d. kuriuo nustatomos Europos Parlamento ir Tarybos reglamento (ES) 2016/429 taikymo
    taisyklės, susijusios su tam tikrų valstybių narių arba jų zonų ar laikymo
    vietų tam tikromis į sąrašą įtrauktomis ligomis neužkrėstos teritorijos
    statuso arba neskiepijimo nuo jų statuso patvirtinimu ir tų į sąrašą įtrauktų
    ligų likvidavimo programų patvirtinimu
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/620 tal-15
    ta’ April 2021 li jistabbilixxi r-regoli għall-applikazzjoni tar-Regolament
    (UE) 2016/429 tal-Parlament Ewropew u tal-Kunsill rigward l-approvazzjoni tal-istatus
    ta’ ħelsien mill-mard u tal-istatus ta’ mingħajr tilqim ta’ ċerti Stati
    Membri jew taż-żoni jew il-kompartimenti tagħhom fir-rigward ta’ ċertu mard
    elenkat, u rigward l-approvazzjoni ta’ programmi ta’ eradikazzjoni għal dak
    il-mard elenkat
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/620 van de Commissie van 15 april 2021
    tot vaststelling van bepalingen ter uitvoering van Verordening (EU) 2016/429 van
    het Europees Parlement en de Raad wat betreft de goedkeuring van de ziektevrije
    en non-vaccinatiestatus van bepaalde lidstaten of zones of compartimenten daarvan
    ten aanzien van bepaalde in de lijst opgenomen ziekten en de goedkeuring van uitroeiingsprogramma’s
    voor die in de lijst opgenomen ziekten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/620 z dnia 15 kwietnia 2021
    r. ustanawiające przepisy dotyczące stosowania rozporządzenia Parlamentu Europejskiego
    i Rady (UE) 2016/429 w odniesieniu do zatwierdzania statusu obszaru wolnego od
    choroby i statusu obszaru nieobjętego szczepieniami niektórych państw członkowskich
    lub ich stref lub kompartmentów w przypadku niektórych chorób umieszczonych
    w wykazie oraz zatwierdzania programów likwidacji tych chorób umieszczonych
    w wykazie
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/620 da Comissão de 15 de abril de
    2021 que estabelece regras de execução do Regulamento (UE) 2016/429 do Parlamento
    Europeu e do Conselho no que se refere à aprovação do estatuto de indemnidade
    de doença e de não vacinação de determinados Estados-Membros ou respetivas
    zonas ou compartimentos no que diz respeito a determinadas doenças listadas e
    à aprovação de programas de erradicação para essas doenças listadas
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/620 al Comisiei din 15 aprilie
    2021 de stabilire a normelor de aplicare a Regulamentului (UE) 2016/429 al Parlamentului
    European și al Consiliului în ceea ce privește aprobarea statutului de indemn
    de boală și a statutului de nevaccinare al anumitor state membre sau zone ori
    compartimente ale acestora cu privire la anumite boli listate și la aprobarea
    programelor de eradicare a bolilor listate respective
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/620 z 15. apríla 2021, ktorým
    sa stanovujú pravidlá uplatňovania nariadenia Európskeho parlamentu a Rady
    (EÚ) 2016/429, pokiaľ ide o schválenie štatútu bez výskytu choroby a bez
    vakcinácie v určitých členských štátoch alebo ich pásmach alebo kompartmentoch,
    pokiaľ ide o určité choroby zo zoznamu, a schválenie eradikačných programov
    pre uvedené choroby zo zoznamu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/620 z dne 15. aprila 2021 o določitvi
    pravil za uporabo Uredbe (EU) 2016/429 Evropskega parlamenta in Sveta glede odobritve
    statusa nekaterih držav članic, njihovih območij ali kompartmentov kot prostih
    bolezni in njihovega statusa necepljenja v zvezi z nekaterimi boleznimi s seznama
    in odobritve programov izkoreninjenja navedenih bolezni s seznama
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/620 de la Comisión de 15 de abril de
    2021 por el que se establecen normas para la aplicación del Reglamento (UE) 2016/429
    del Parlamento Europeo y del Consejo relativas a la aprobación del estatus de
    libre de enfermedad y el estatus de libre de enfermedad sin vacunación de determinados
    Estados miembros, zonas o compartimentos de estos en lo que respecta a determinadas
    enfermedades de la lista y a la aprobación de los programas de erradicación
    de dichas enfermedades de la lista
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/620 av den 15 april 2021
    om tillämpningsföreskrifter för Europaparlamentets och rådets förordning
    (EU) 2016/429 vad gäller godkännande av sjukdomsfri status och status som icke-vaccinerande
    för vissa medlemsstater eller zoner eller anläggningskretsar däri med avseende
    på vissa förtecknade sjukdomar och godkännande av program för utrotning av
    dessa förtecknade sjukdomar
