  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2719/93 della Commissione, del 1 ottobre 1993, che
    fissa il prezzo massimo di acquisto e i quantitativi di carni bovine acquistate
    all'intervento per la centesima gara parziale effettuata nel quadro delle misure
    generali d'intervento conformemente al regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2719/93 van de Commissie van 1 oktober 1993 tot vaststelling
