    af Europa-Parlamentets og Rådets forordning (EF) nr. 715/2007 om typegodkendelse
    af motorkøretøjer med hensyn til emissioner fra lette personbiler og lette erhvervskøretøjer
    (Euro 5 og Euro 6) og om adgang til reparations- og vedligeholdelsesinformationer
    om køretøjer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 171/2013 της Επιτροπής,
    της 26ης Φεβρουαρίου 2013 , για την τροποποίηση
    των παραρτημάτων I και IX και την αντικατάσταση
    του παραρτήματος VIII της οδηγίας 2007/46/ΕΚ του
    Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    για τη θέσπιση πλαισίου για την έγκριση των
    μηχανοκίνητων οχημάτων και των ρυμουλκουμένων
    τους, και των συστημάτων, κατασκευαστικών στοιχείων
    και χωριστών τεχνικών μονάδων που προορίζονται
    για τα οχήματα αυτά (οδηγία-πλαίσιο) και για
    την τροποποίηση των παραρτημάτων I και XII του
    κανονισμού (ΕΚ) αριθ. 692/2008 της Επιτροπής για
    την εφαρμογή και την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 715/2007 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου που αφορά την έγκριση τύπου
    μηχανοκινήτων οχημάτων όσον αφορά εκπομπές
    από ελαφρά επιβατηγά και εμπορικά οχήματα
    (Εuro 5 και Euro 6) και σχετικά με την πρόσβαση σε
    πληροφορίες επισκευής και συντήρησης οχημάτων
