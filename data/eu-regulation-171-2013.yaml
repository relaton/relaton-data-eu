  script: Latn
  content: Reglamento (UE) n ° 171/2013 de la Comisión, de 26 de febrero de 2013
    , por el que se modifican los anexos I y IX y se sustituye el anexo VIII de la
    Directiva 2007/46/CE del Parlamento Europeo y del Consejo, por la que se crea
    un marco para la homologación de los vehículos de motor y de los remolques,
    sistemas, componentes y unidades técnicas independientes destinados a dichos
    vehículos (Directiva marco), y se modifican los anexos I y XII del Reglamento
    (CE) n ° 692/2008 de la Comisión, por el que se aplica y modifica el Reglamento
    (CE) n ° 715/2007 del Parlamento Europeo y del Consejo, sobre la homologación
    de tipo de los vehículos de motor por lo que se refiere a las emisiones procedentes
    de turismos y vehículos comerciales ligeros (Euro 5 y Euro 6) y sobre el acceso
    a la información relativa a la reparación y el mantenimiento de los vehículos
