title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 171/2013 of 26 February 2013 amending Annexes
    I and IX, replacing Annex VIII to Directive 2007/46/EC of the European Parliament
    and of the Council establishing a framework for the approval of motor vehicles
    and their trailers, and of systems, components and separate technical units intended
    for such vehicles (Framework Directive), and amending Annexes I and XII to Commission
    Regulation (EC) No 692/2008 implementing and amending Regulation (EC) No 715/2007
    of the European Parliament and of the Council on type-approval of motor vehicles
    with respect to emissions from light passenger and commercial vehicles (Euro 5
    and Euro 6) and on access to vehicle repair and maintenance information
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 171/2013 de la Commission du 26 février 2013 modifiant
    les annexes I et IX et remplaçant l’annexe VIII de la directive 2007/46/CE
    du Parlement européen et du Conseil établissant un cadre pour la réception
    des véhicules à moteur, de leurs remorques et des systèmes, des composants
    et des entités techniques destinés à ces véhicules (directive-cadre), et modifiant
    les annexes I et XII du règlement (CE) n ° 692/2008 de la Commission portant
    application et modification du règlement (CE) n ° 715/2007 du Parlement européen
    et du Conseil relatif à la réception des véhicules à moteur au regard des
    émissions des véhicules particuliers et utilitaires légers (Euro 5 et Euro
    6) et aux informations sur la réparation et l’entretien des véhicules
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 171/2013 der Kommission vom 26. Februar 2013 zur Änderung
    der Anhänge I und IX sowie zur Ersetzung des Anhangs VIII der Richtlinie 2007/46/EG
    des Europäischen Parlaments und des Rates zur Schaffung eines Rahmens für die
    Genehmigung von Kraftfahrzeugen und Kraftfahrzeuganhängern sowie von Systemen,
    Bauteilen und selbstständigen technischen Einheiten für diese Fahrzeuge (Rahmenrichtlinie)
    und zur Änderung der Anhänge I und XII der Verordnung (EG) Nr. 692/2008 der
    Kommission zur Durchführung und Änderung der Verordnung (EG) Nr. 715/2007 des
    Europäischen Parlaments und des Rates über die Typgenehmigung von Kraftfahrzeugen
    hinsichtlich der Emissionen von leichten Personenkraftwagen und Nutzfahrzeugen
    (Euro 5 und Euro 6) und über den Zugang zu Reparatur- und Wartungsinformationen
    für Fahrzeuge
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 171/2013 на Комисията от 26
    февруари 2013 година за изменение на приложения
    I и IX, замяна на приложение VIII към Директива
    2007/46/ЕО на Европейския парламент и на Съвета
    за създаване на рамка за одобрение на моторните
    превозни средства и техните ремаркета, както
    и на системи, компоненти и отделни технически
    възли, предназначени за такива превозни средства
    (Рамкова директива) и за изменение на приложения
    I и XII към Регламент (ЕО) № 692/2008 на Комисията
    за прилагане и изменение на Регламент (ЕО) №
    715/2007 на Европейския парламент и на Съвета за
    типово одобрение на моторни превозни средства
    по отношение на емисиите от леки превозни средства
    за превоз на пътници и товари (Евро 5 и Евро
    6) и за достъпа до информация за ремонт и техническо
    обслужване на превозни средства
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 171/2013 ze dne 26. února 2013 , kterým se
    mění přílohy I a IX a nahrazuje příloha VIII směrnice Evropského parlamentu
    a Rady 2007/46/ES, kterou se stanoví rámec pro schvalování motorových vozidel
    a jejich přípojných vozidel, jakož i systémů, konstrukčních částí a
    samostatných technických celků určených pro tato vozidla (rámcová směrnice),
    a kterým se mění přílohy I a XII nařízení Komise (ES) č. 692/2008, kterým
    se provádí a mění nařízení Evropského parlamentu a Rady (ES) č. 715/2007
    o schvalování typu motorových vozidel z hlediska emisí z lehkých osobních
    vozidel a z užitkových vozidel (Euro 5 a Euro 6) a z hlediska přístupu k informacím
    o opravách a údržbě vozidla
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 171/2013 af 26. februar 2013 om ændring
