    päästöjen (Euro 5 ja Euro 6) osalta ja ajoneuvojen korjaamiseen ja huoltamiseen
    tarvittavien tietojen saatavuudesta annetun Euroopan parlamentin ja neuvoston
    asetuksen (EY) N:o 715/2007 täytäntöönpanosta ja muuttamisesta annetun komission
    asetuksen (EY) N:o 692/2008 liitteiden I ja XII muuttamisesta
  type: main
