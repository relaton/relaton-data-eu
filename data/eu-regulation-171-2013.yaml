  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 171/2013 da Comissão, de 26 de fevereiro de 2013
    , que altera os anexos I e IX, substitui o anexo VIII da Diretiva 2007/46/CE do
    Parlamento Europeu e do Conselho, que estabelece um quadro para a homologação
    dos veículos a motor e seus reboques, e dos sistemas, componentes e unidades
    técnicas destinados a serem utilizados nesses veículos (Diretiva-Quadro) e altera
    os anexos I e XII do Regulamento (CE) n. ° 692/2008 da Comissão, que executa
    e altera o Regulamento (CE) n. ° 715/2007 do Parlamento Europeu e do Conselho
    relativo à homologação dos veículos a motor no que respeita às emissões
    dos veículos ligeiros de passageiros e comerciais (Euro 5 e Euro 6) e ao acesso
    à informação relativa à reparação e manutenção de veículos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 171/2013 al Comisiei din 26 februarie 2013 de modificare
