title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 875/2012 of 25 September 2012 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 990/2011 on imports of bicycles
    originating in the People's Republic of China by imports of bicycles consigned
    from Indonesia, Malaysia, Sri Lanka and Tunisia, whether declared as originating
    in Indonesia, Malaysia, Sri Lanka and Tunisia or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 875/2012 de la Commission du 25 septembre 2012 ouvrant
    une enquête concernant l’éventuel contournement des mesures antidumping instituées
    par le règlement d’exécution (UE) n ° 990/2011 du Conseil sur les importations
    de bicyclettes originaires de la République populaire de Chine par des importations
    de bicyclettes expédiées d’Indonésie, de la Malaisie, du Sri Lanka et de
    la Tunisie, qu’elles aient ou non été déclarées originaires de l’Indonésie,
    de la Malaisie, du Sri Lanka et de la Tunisie, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 875/2012 der Kommission vom 25. September 2012 zur
    Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit der
    Durchführungsverordnung (EU) Nr. 990/2011 des Rates eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren von Fahrrädern mit Ursprung in der Volksrepublik China
    durch aus Indonesien, Malaysia, Sri Lanka und Tunesien versandte Einfuhren von
    Fahrrädern, ob als Ursprungserzeugnisse Indonesiens, Malaysias, Sri Lankas oder
    Tunesiens angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
