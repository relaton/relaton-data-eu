  script: Latn
  content: Uitvoeringsverordening (EU) nr. 400/2010 van de Raad van 26 april 2010
    tot uitbreiding van het bij Verordening (EG) nr. 1858/2005 ingestelde definitieve
    antidumpingrecht op stalen kabels van oorsprong uit onder meer de Volksrepubliek
    China tot stalen kabels verzonden vanuit de Republiek Korea, al dan niet aangegeven
    als van oorsprong uit de Republiek Korea, en tot beëindiging van het onderzoek
    betreffende de invoer van stalen kabels verzonden vanuit Maleisië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 400/2010 z dnia 26 kwietnia 2010
    r. rozszerzające ostateczne cło antydumpingowe nałożone rozporządzeniem (WE)
    nr 1858/2005 na przywóz stalowych lin i kabli pochodzących między innymi z
    Chińskiej Republiki Ludowej na przywóz stalowych lin i kabli wysyłanych z Republiki
    Korei zgłoszonych lub niezgłoszonych jako pochodzące z Republiki Korei oraz
    kończące dochodzenie w odniesieniu do do przywozu stalowych lin i kabli wysyłanych
    z Malezji
  type: main
