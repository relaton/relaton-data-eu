  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 400/2010 al Consiliului din
    26 aprilie 2010 de extindere a taxei antidumping definitive instituite prin Regulamentul
    (CE) nr. 1858/2005 privind importurile de cabluri și parâme din oțel originare,
    printre altele, din Republica Populară Chineză la importurile de cabluri și
    parâme din oțel expediate din Republica Coreea, indiferent dacă produsul este
    sau nu declarat ca provenind din Republica Coreea, și de închidere a anchetei
    privind importurile expediate din Malaysia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 400/2010 z 26. apríla 2010 , ktorým
    sa rozširuje konečné antidumpingové clo uložené nariadením (ES) č. 1858/2005
    na dovoz oceľových lán a káblov s pôvodom okrem iného v Čínskej ľudovej
    republike na dovoz oceľových lán a káblov zasielaných z Kórejskej republiky
    bez ohľadu na to, či majú, alebo nemajú deklarovaný pôvod v Kórejskej republike,
    a ktorým sa ukončuje prešetrovanie týkajúce sa dovozu zasielaného z Malajzie
  type: main
- language: sl
  script: Latn
  content: Izvedbena Uredba Sveta (EU) št. 400/2010 z dne 26. aprila 2010 o razširitvi
    dokončne protidampinške dajatve, uvedene z Uredbo (ES) št. 1858/2005 na uvoz
    jeklenih vrvi in kablov s poreklom, med drugim, iz Ljudske republike Kitajske,
    na uvoz jeklenih vrvi in kablov, poslanih iz Republike Koreje, ne glede na to,
    ali je njihovo poreklo deklarirano v Republiki Koreji ali ne, in zaključku preiskave
    v zvezi z uvozom, poslanim iz Malezije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n o 400/2010 del Consejo, de 26 de abril
    de 2010 , por el que se amplía el derecho antidumping definitivo establecido
    por el Reglamento (CE) n o 1858/2005 sobre las importaciones de cables de acero
    originarios, entre otros países, de la República Popular China a las importaciones
    de cables de acero procedentes de la República de Corea, hayan sido o no declaradas
    originarias de la República de Corea, y por el que se da por concluida la investigación
    respecto de las importaciones procedentes de Malasia
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 400/2010 av den 26 april 2010
    om utvidgning av den slutgiltiga antidumpningstull som genom förordning (EG)
    nr 1858/2005 införts på import av linor och kablar av stål med ursprung i bland
    annat Folkrepubliken Kina till att även omfatta import av linor och kablar av
    stål som avsänts från Republiken Korea, oavsett om produkternas deklarerade
    ursprung är Republiken Korea eller inte, och om avslutande av undersökningen
    rörande import som avsänts från Malaysia
