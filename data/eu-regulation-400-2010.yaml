title:
- language: en
  script: Latn
  content: Implementing Regulation of the Council (EU) No 400/2010 of 26 April 2010
    extending the definitive anti-dumping duty imposed by Regulation (EC) No 1858/2005
    on imports of steel ropes and cables originating, inter alia, in the People’s
    Republic of China to imports of steel ropes and cables consigned from the Republic
    of Korea, whether declared as originating in the Republic of Korea or not, and
    terminating the investigation in respect of imports consigned from Malaysia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n o 400/2010 du Conseil du 26 avril 2010
    portant extension du droit antidumping définitif institué par le règlement
    (CE) n o 1858/2005 sur les importations de câbles en acier originaires, entre
    autres, de la République populaire de Chine aux importations de câbles en acier
    expédiés de la République de Corée, qu’ils aient ou non été déclarés
    originaires de ce pays, et clôturant l’enquête concernant les importations
    expédiées de Malaisie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 400/2010 des Rates vom 26. April 2010
    zur Ausweitung des mit der Verordnung (EG) Nr. 1858/2005 eingeführten endgültigen
    Antidumpingzolls auf die Einfuhren von Kabeln und Seilen aus Stahl mit Ursprung
    unter anderem in der Volksrepublik China auf die Einfuhren von aus der Republik
    Korea versandten Kabeln und Seilen aus Stahl, ob als Ursprungserzeugnisse aus
    der Republik Korea angemeldet oder nicht, und zur Einstellung der Untersuchung
    betreffend die aus Malaysia versandten Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 400/2010 на Съвета
    от 26 април 2010 година за разширяване на обхвата
    на окончателното антидъмпингово мито, наложено
    с Регламент (ЕО) № 1858/2005 върху вноса на стоманени
    въжета и кабели с произход, inter alia , от Китайската
    народна република, към вноса на стоманени въжета
    и кабели, изпращани от Република Корея, независимо
    дали са декларирани с произход от Република
    Корея, и за прекратяване на разследването по
    отношение на вноса, изпращан от Малайзия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 400/2010 ze dne 26. dubna 2010 ,
    kterým se konečné antidumpingové clo uložené nařízením Rady (ES) č.
    1858/2005 na dovoz ocelových lan a kabelů pocházejících mimo jiné z Čínské
    lidové republiky rozšiřuje na dovoz ocelových lan a kabelů zasílaných z
    Korejské republiky bez ohledu na to, zda je u něho deklarován původ z Korejské
    republiky, a kterým se ukončuje šetření týkající se dovozu výrobků zasílaných
    z Malajsie
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesforordning (EU) nr. 400/2010 af 26. april 2010 om
    udvidelse af den endelige antidumpingtold, der indførtes ved forordning (EF)
    nr. 1858/2005 på importen af tovværk og kabler af stål med oprindelse i bl.a.
    Folkerepublikken Kina, til også at omfatte importen af tovværk og kabler af
    stål afsendt fra Republikken Korea, uanset om varen er angivet med oprindelse
    i Republikken Korea eller ej, og om afslutning af undersøgelsen vedrørende import
    afsendt fra Malaysia
  type: main
