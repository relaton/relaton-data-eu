    huhtikuuta 2010 , muun muassa Kiinan kansantasavallasta peräisin olevien teräsköysien
    ja -kaapeleiden tuonnissa asetuksella (EY) N:o 1858/2005 käyttöön otetun lopullisen
    polkumyyntitullin laajentamisesta koskemaan teräsköysien ja -kaapeleiden tuontia
    Korean tasavallasta riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu
    Korean tasavalta, ja tutkimuksen päättämisestä Malesiasta peräisin olevan
    tuonnin osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Vijeća (EU) br. 400/2010 od 26. travnja 2010. o proširenju
    konačne antidampinške pristojbe uvedene Uredbom (EZ) br. 1858/2005 na uvoz čelične
    užadi i kabela podrijetlom iz, između ostalog, Narodne Republike Kine na uvoz
    čelične užadi i kabela poslanih iz Republike Koreje, bez obzira na to imaju
    li deklarirano podrijetlo iz Republike Koreje ili ne, te prekidu ispitnog postupka
    u vezi uvoza poslanog iz Malezije
  type: main
- language: hu
  script: Latn
  content: A Tanács 400/2010/EU végrehajtási rendelete ( 2010. április 26. ) az
    1858/2005/EK rendelettel a többek között a Kínai Népköztársaságból származó
    acél drótkötelek és -kábelek behozatalára kivetett végleges dömpingellenes
    vámnak a Koreai Köztársaságban feladott – akár a Koreai Köztársaságból
    származóként, akár nem ilyenként bejelentett – acél drótkötelek és
    -kábelek behozatalára történő kiterjesztéséről, valamint a Malajziában
    feladott behozatalokra vonatkozó vizsgálat megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 400/2010 del Consiglio, del 26 aprile
    2010 , che estende il dazio antidumping definitivo istituito dal regolamento (CE)
    n. 1858/2005 sulle importazioni di cavi d’acciaio originari, tra l’altro,
    della Repubblica popolare cinese alle importazioni di cavi d’acciaio spediti
    dalla Repubblica di Corea, anche se non dichiarati originari della Repubblica
    di Corea, e che chiude l’inchiesta per quanto riguarda le importazioni spedite
    dalla Malaysia
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 400/2010 ( 2010. gada 26. aprīlis
    ), ar ko paplašina galīgo antidempinga maksājumu, kurš ar Regulu (EK) Nr.
    1858/2005 noteikts par cita starpā Ķīnas Tautas Republikas izcelsmes tērauda
    trošu un tauvu importu, attiecinot to uz tērauda trošu un tauvu importu, kas
    nosūtīts no Korejas Republikas, neatkarīgi no tā, vai tās ir deklarētas
    ar izcelsmi Korejas Republikā, un ar ko izbeidz izmeklēšanu attiecībā uz
    importu, kas nosūtīts no Malaizijas
  type: main
- language: lt
  script: Latn
  content: 2010 m. balandžio 26 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 400/2010,
    kuriuo galutinio antidempingo muito, Tarybos reglamentu (EB) Nr. 1858/2005 nustatyto
    importuojamiems, inter alia , Kinijos Liaudies Respublikos kilmės plieniniams
    lynams ir kabeliams, taikymas išplečiamas importuojamiems plieniniams lynams
    ir kabeliams, siunčiamiems iš Korėjos Respublikos, deklaruojamiems kaip Korėjos
    Respublikos kilmės arba ne, ir baigiamas tyrimas dėl importuojamų produktų,
    siunčiamų iš Malaizijos
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjojni tal-Kunsill (UE) Nru 400/2010 tas- 26
    ta’ April 2010 li jestendi d-dazju definittiv anti-dumping impost mir-Regolament
    (KE) Nru 1858/2005 fuq l-importazzjonijiet ta’ ħbula tal-azzar u kejbils li
    joriġinaw, inter alia, fir-Repubblika Popolari taċ-Ċina għall-importazzjonijiet
    ta’ ħbula tal-azzar u kejbils ikkonsenjati mir-Repubblika tal-Korea, sew jekk
