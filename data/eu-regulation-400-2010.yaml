    pelo Regulamento (CE) n. o 1858/2005 sobre as importações de cabos de aço originários,
    nomeadamente, da República Popular da China às importações de cabos de aço
    expedidos da República da Coreia, independentemente de serem ou não declarados
    originários da República da Coreia, e que encerra o inquérito no que diz respeito
    às importações expedidas da Malásia
  type: main
