    tuoreen lihan ja lihavalmisteiden tuonnin, tehdyn neuvoston päätöksen 79/542/ETY
    muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '93/99/CEE: Decisione della Commissione, del 22 dicembre 1992, recante
    l'' elenco dei paesi terzi da cui gli Stati membri autorizzano l'' importazione
    di animali delle specie bovina, suina ed equina, di carni fresche e di prodotti
    a base di carne'
  type: main
- language: nl
  script: Latn
  content: '93/99/EEG: Beschikking van de Commissie van 22 december 1992 tot wijziging
