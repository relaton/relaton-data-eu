title:
- language: en
  script: Latn
  content: '93/99/EEC: Commission Decision of 22 December 1992 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine and equidae, fresh meat and meat products'
  type: main
- language: fr
  script: Latn
  content: '93/99/CEE: Décision de la Commission, du 22 décembre 1992, modifiant
    la décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les Etats membres autorisent l'' importation d'' animaux des espèces
    bovine et porcine, d'' équidés, de viandes fraîches et de produits à base
    de viande'
  type: main
- language: de
  script: Latn
  content: '93/99/EWG: Entscheidung der Kommission vom 22. Dezember 1992 zur Änderung
    der Entscheidung 79/542/EWG des Rates zur Aufstellung eines Verzeichnisses der
    Drittländer, aus denen die Mitgliedstaaten die Einfuhr von Rindern, Schweinen,
    Einhufern, frischem Fleisch und Fleischprodukten zulassen'
  type: main
- language: da
  script: Latn
  content: '93/99/EØF: Kommissionens beslutning af 22. december 1992 om ændring
    af Rådets beslutning 79/542/EØF om opstilling af en liste over de tredjelande,
    hvorfra medlemsstaterne tillader indførsel af kvæg, svin og enhovede dyr samt
    fersk kød eller kødprodukter'
  type: main
- language: el
  script: Grek
  content: '93/99/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1992 που τροποποιεί την απόφαση 79/542/ΕΟΚ του Συμβουλίου
    περί καταρτίσεως ενός πίνακα τρίτων χωρών
    από τις οποίες τα κράτη μέλη επιτρέπουν τις
    εισαγωγές βοοειδών, χοίρων και ιπποειδών, νωπών
    κρεάτων και προϊόντων με βάση το κρέας'
  type: main
- language: fi
  script: Latn
  content: '93/99/ETY: Komission päätös, tehty 22 päivänä joulukuuta 1992, luettelosta
