    landen waaruit de Lid- Staten de invoer van runderen, varkens, paardachtigen,
    vers vlees en vleesprodukten toestaan'
  type: main
- language: pt
  script: Latn
  content: '93/99/CEE: Decisão da Comissão, de 22 de Dezembro de 1992, que altera
