title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1349/75 of the Council of 26 May 1975 amending Regulation
    (EEC) No 1878/74 laying down, for the 1974/75 wine-growing year, the price to
    be paid for alcohol delivered to intervention agencies under the obligation to
    distil the by-products of wine-making, and the maximum amount of the contribution
    towards this price by the Guarantee Section of the European Agricultural Guidance
    and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1349/75 du Conseil, du 26 mai 1975, modifiant le règlement
    (CEE) n° 1878/74 déterminant, pour la campagne viticole 1974/1975, le prix à
    payer pour l'alcool livré aux organismes d'intervention au titre de la distillation
    obligatoire des sous-produits de la vinification et le montant maximal de l'intervention,
    dans ce prix, du Fonds européen d'orientation et de garantie agricole, section
    garantie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1349/75 des Rates vom 26. Mai 1975 zur Änderung der
    Verordnung (EWG) Nr. 1878/74 zur Festlegung des von den Interventionsstellen zu
    zahlenden Preises für den Alkohol, der ihnen im Rahmen der Verpflichtung zur
    Destillation der Nebenerzeugnisse der Weinbereitung geliefert wird, und des dabei
    vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung
    Garantie, zu übernehmenden Höchstanteils für das Weinwirtschaftsjahr 1974/1975
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1349/75 af 26. maj 1975 om ændring af forordning
    (EØF) nr. 1878/74 om fastsættelse for vinhøståret 1974/1975 af den pris, der
    skal betales for alkohol, som leveres til interventionsorganerne, som følge af
    forpligtelsen til destillering af biprodukter ved vinfremstilling samt af det
    størstebeløb, hvormed Den europæiske udviklings- og garantifond for Landbruget,
    garantisektionen, skal intervenere med hensyn til denne pris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1349/75 del Consiglio, del 26 maggio 1975, recante
    modifica del regolamento (CEE) n. 1878/74 che fissa, per la campagna viticola
    1974/1975, il prezzo dell'alcole consegnato agli organismi d'intervento per la
    distillazione obbligatoria dei sottoprodotti della vinificazione e determina l'importo
    massimo dell'intervento in tale prezzo del Fondo europeo agricolo di orientamento
    e di garanzia, sezione garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1349/75 van de Raad van 26 mei 1975 houdende wijziging
    van Verordening (EEG) nr. 1878/74 tot vaststelling, voor het wijnoogstjaar 1974/1975,
    van de prijs die moet worden betaald voor de aan de interventiebureaus uit hoofde
    van de verplichte distillatie van de bijprodukten van de wijnbereiding geleverde
    alcohol, alsmede van het maximumgedeelte van deze prijs dat voor rekening komt
    van het Europees Oriëntatie- en Garantiefonds voor de Landbouw, afdeling Garantie
  type: main
