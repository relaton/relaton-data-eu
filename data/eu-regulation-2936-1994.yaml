  content: Commission Regulation (EC) No 2936/94 of 1 December 1994 re-establishing
    the levying of customs duties on certain industrial products originating in Indonesia,
    Thailand and China, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
