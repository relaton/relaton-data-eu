title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1234/96 of 28 June 1996 amending Regulations
    (EEC) Nos 388/92 and 1727/92, laying down detailed rules for the implementation
    of the specific arrangements for the supply of cereal products to the French overseas
    departments (FOD) and to the Azores and Madeira respectively and establishing
    the relevant forecast supply balances, and establishing a forecast balance for
    the supply to the Canary Islands of cereal products and glucose
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1234/96 de la Commission du 28 juin 1996 modifiant
    les règlements (CEE) nº 388/92 et (CEE) nº 1727/92 portant modalités d'application
    du régime spécifique pour l'approvisionnement en produits céréaliers respectivement
    des départements français d'outre-mer et des Açores et de Madère et établissant
    les bilans respectifs d'approvisionnement, et d'autre part, établissant le bilan
    prévisionnel d'approvisionnement en produits céréaliers et en glucose des îles
    Canaries
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1234/96 der Kommission vom 28. Juni 1996 zur Änderung
    der Verordnungen (EWG) Nr. 388/92 und (EWG) Nr. 1727/92 mit besonderen Durchführungsbestimmungen
    zur Versorgung der Azoren und Madeiras mit Getreideerzeugnissen und zur Erstellung
    der jeweiligen vorläufigen Versorgungsbilanzen bzw. der vorläufigen Bilanz für
    die Versorgung der Kanarischen Inseln mit Getreideerzeugnissen und Glukose
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1234/96 af 28. juni 1996 om ændring
    af forordning (EØF) nr. 388/92 og (EØF) nr. 1727/92 om gennemførelsesbestemmelser
    for den særlige forsyningsordning for henholdsvis de oversøiske franske departementer
    (OD) og Azorerne og Madeira vedrørende kornprodukter og om udarbejdelse af opgørelser
    over forsyningsbehovene, samt om udarbejdelse af opgørelsen over forsyningsbehovene
    vedrørende kornprodukter og isoglucose på De Kanariske Øer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1234/96 της Επιτροπής
    της 28ης Ιουνίου 1996 για την τροποποίηση αφενός
    μεν των κανονισμών (ΕΟΚ) αριθ. 388/92 και (ΕΟΚ) αριθ.
    1727/92 περί λεπτομερών κανόνων εφαρμογής του
    ειδικού καθεστώτος για τον εφοδιασμό σε προϊόντα
    σιτηρών αντιστοίχως των γαλλικών υπερποντίων
    διαμερισμάτων και των Αζορών και της Μαδέρας
    και για τον καθορισμό των αντιστοίχων ισοζυγίων
    εφοδιασμού και, αφετέρου, για τον καθορισμό
    του ισοζυγίου προβλέψεων εφοδιασμού σε προϊόντα
    σιτηρών και σε γλυκόζη των Καναρίων Νήσων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1234/96, annettu 28 päivänä kesäkuuta 1996,
    Ranskan merentakaisten departementtien ja Azorien ja Madeiran erityisen viljatuotteiden
    hankintajärjestelmän soveltamista koskevista yksityiskohtaisista säännöistä
    ja hankintataseiden vahvistamisesta annettujen asetusten (ETY) N:o 388/92 ja (ETY)
    N:o 1727/92 muuttamisesta sekä toisaalta Kanariansaarten viljatuotteiden ja glukoosin
    arvioidun hankintataseen vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1234/96 della Commissione del 28 giugno 1996 recante
    modifica dei regolamenti (CEE) n. 388/92 e (CEE) n. 1729/92 relativi alle modalità
    di applicazione del regime specifico per l'approvvigionamento cerealicolo rispettivamente
    dei dipartimenti francesi d'oltremare (DOM) e delle Azzorre e Madera e che fissano
    i rispettivi bilanci previsionali di approvvigionamento, da un lato, e recante
    fissazione, dall'altro, del bilancio previsionale di approvvigionamento delle
    isole Canarie in prodotti cerealicoli e glucosio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1234/96 van de Commissie van 28 juni 1996 tot wijziging
    van de Verordeningen (EEG) nr. 388/92 en (EEG) nr. 1727/92 houdende bepalingen
    ter uitvoering van de specifieke regeling voor de voorziening van respectievelijk
    de Franse overzeese departementen (DOM) en de Azoren en Madeira met graanprodukten
    en tot vaststelling van de respectieve voorzieningsbalansen, en tot vaststelling
    van een geraamde balans voor de voorziening van de Canarische eilanden met graanprodukten
    en glucose
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1234/96 da Comissão de 28 de Junho de 1996 que altera
    o Regulamento (CEE) nº 388/92 e (CEE) nº 1727/92 que estabelecem normas de execução
    do regime específico para o abastecimento em produtos cerealíferos, respectivamente,
    dos departamentos franceses ultramarinos e dos Açores e da Madeira e que estabelecem
    as respectivas estimativas das necessidades de abastecimento e, por outro lado,
    que estabelece a estimativa das necessidades de abastecimento em produtos cerealíferos
    e em glicose das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1234/96 de la Comisión de 28 de junio de 1996 por
    el que se modifican los Reglamentos (CEE) nos 388/92 y 1727/92 por los que se
    establecen disposiciones de aplicación del régimen específico para el abastecimiento
    de productos del sector de los cereales, respectivamente, a los departamentos
    franceses de Ultramar y a las Azores y Madeira, y los respectivos planes de previsiones
    de abastecimiento y, por otra parte, establecen el plan de previsiones de abastecimiento
    de productos del sector de los cereales y de glucosa a las islas Canarias
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1234/96 av den 28 juni 1996 dels om ändring
    av förordningarna (EEG) nr 388/92 och (EEG) nr 1727/92 om närmare bestämmelser
    för den särskilda ordningen för tillförsel av spannmålsprodukter till de
    franska utomeuropeiska departementen repektive Azorerna och Madeira och om upprättande
    av de respektive prognostiserade försörjningsbalanserna och dels om upprättande
    av en prognostiserad försörjningsbalans för försörjning av Kanarieöarna
    med spannmål och glukos
  type: main
