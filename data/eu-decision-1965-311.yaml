title:
- language: fr
  script: Latn
  content: Décision du Conseil du 15 juin 1965, portant nouvelle prorogation de la
    décision du Conseil du 4 avril 1962, prévoyant la perception d'une taxe compensatoire
    sur certaines marchandises résultant de la transformation de produits agricoles
  type: main
- language: de
  script: Latn
  content: '65/311/EWG: Beschluß des Rates vom 15. Juni 1965 zur nochmaligen Verlängerung
    seines Beschlusses vom 4. April 1962 zur Erhebung einer Ausgleichsabgabe auf bestimmte
    Waren, die durch Verarbeitung landwirtschaftlicher Erzeugnisse entstehen'
  type: main
- language: it
  script: Latn
  content: '65/311/CEE: Decisione del Consiglio, del 15 giugno 1965, che proroga nuovamente
    la decisione del Consiglio del 4 aprile 1962 relativa alla percezione di una tassa
    di compensazione su talune merci risultanti dalla trasformazione di prodotti agricoli'
  type: main
- language: nl
  script: Latn
  content: '65/311/EEG: Besluit van de Raad van 15 juni 1965 houdende nieuwe verlenging
    van het besluit van de Raad van 4 april 1962 inzake het opleggen van een compenserende
    heffing op bepaalde produkten, verkregen uit de verwerking van landbouwprodukten'
  type: main
