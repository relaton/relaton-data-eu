    1706/98 do Conselho que fixa o regime aplicável aos produtos agrícolas e às
    mercadorias resultantes da sua transformação originários dos Estados da África,
    das Caraíbas e do Pacífico (ACP)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2809/98 de la Comisión de 22 de diciembre de 1998
