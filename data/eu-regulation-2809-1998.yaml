    yksityiskohtaisista säännöistä vilja-alalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2809/98 della Commissione del 22 dicembre 1998 recante
    modalità di applicazione, nel settore dei cereali, del regolamento (CE) n. 1706/98
    del Consiglio, che stabilisce il regime applicabile ai prodotti agricoli e alle
    merci ottenute dalla loro trasformazione, originari degli Stati dell'Africa, dei
    Caraibi e del Pacifico (ACP)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2809/98 van de Commissie van 22 december 1998 houdende
    bepalingen ter uitvoering, in de sector granen, van Verordening (EG) nr. 1706/98
