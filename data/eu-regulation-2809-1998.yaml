title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2809/98 of 22 December 1998 laying down detailed
    rules for the application in the cereals sector of Council Regulation (EC) No
    1706/98 on the arrangements applicable to agricultural products and goods resulting
    from the processing of agricultural products originating in the African, Caribbean
    and Pacific States (ACP States)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2809/98 de la Commission du 22 décembre 1998 portant
    modalités d'application, dans le secteur des céréales, du règlement (CE) nº
    1706/98 du Conseil fixant le régime applicable aux produits agricoles et aux
    marchandises résultant de leur transformation, originaires des États d'Afrique,
    des Caraïbes et du Pacifique (ACP)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2809/98 der Kommission vom 22. Dezember 1998 mit Durchführungsbestimmungen
