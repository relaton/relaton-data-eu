    Erzeugnisse und daraus hergestellte Waren mit Ursprung in den Staaten in Afrika,
    im karibischen Raum und im Pazifischen Ozean (AKP) im Hinblick auf den Getreidesektor
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2809/98 af 22. december 1998 om gennemførelsesbestemmelser
