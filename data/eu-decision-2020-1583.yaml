    und verstärkte Partnerschaft zwischen der Europäischen Union und der Europäischen
    Atomgemeinschaft und ihren Mitgliedstaaten einerseits und der Republik Armenien
    andererseits eingesetzten Partnerschaftsausschuss im Zusammenhang mit der Ersetzung
    der Liste von Personen, die in Streitbeilegungsverfahren als Schiedsrichter dienen
    sollen, zu vertreten ist
