    institué par l’accord de partenariat global et renforcé entre l’Union européenne
    et la Communauté européenne de l’énergie atomique et leurs États membres,
    d’une part, et la République d’Arménie, d’autre part, en ce qui concerne
    le remplacement de la liste des personnes devant exercer les fonctions d’arbitre
    dans les procédures de règlement des différends
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/1583 des Rates vom 23. Oktober 2020 über den Standpunkt,
