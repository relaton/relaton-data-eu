title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/1583 of 23 October 2020 on the position to be
    adopted on behalf of the European Union within the Partnership Committee established
    by the Comprehensive and Enhanced Partnership Agreement between the European Union
    and the European Atomic Energy Community and their Member States, of the one part,
    and the Republic of Armenia, of the other part, as regards the replacement of
    the list of individuals to serve as arbitrators in dispute-settlement proceedings
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/1583 du Conseil du 23 octobre 2020 relative à la position
