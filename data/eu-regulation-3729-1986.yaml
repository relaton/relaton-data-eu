    Malaysia, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3729/86 de la Commission du 5 décembre 1986 portant
