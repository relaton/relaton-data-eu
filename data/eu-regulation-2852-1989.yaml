  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2852/89 DELLA COMMISSIONE del 22 settembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre artificiali
    continue della categoria di prodotti n. 36 (numero d'' ordine 40.0360), i costumi
    e mutandine da bagno della categoria di prodotti n. 72 (numero d'' ordine 40.0720),
    gli scialli, sciarpe, fazzoletti esclusi quelli a maglia della categoria di prodotti
    n. 84 (numero d'' ordine 40.0840), originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2852/89 VAN DE COMMISSIE van 22 september 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van kunstmatige stapelvezels, van de categorie van produkten nr. 36 (volgnummer
    40.0360), badpakken en zwembroeken, van de categorie van produkten nr. 72 (volgnummer
    40.0720), en sjaals, sjerpen, hoofddoeken, andere dan van brei- of haakwerk, van
    de categorie van produkten nr. 84 (volgnummer 40.0840), van oorsprong uit China,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 4259/88 van de Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2852/89 DA COMISSÃO de 22 de Setembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos tecidos de fibras
    têxteis artificiais contínuas, da categoria de produtos 36 (nº de ordem 40.0360),
    fatos e calções de banho da categoria de produtos 72 (nº de ordem 40.0720),
    xailes, lenços para o pescoço ou para os ombros com excepção dos de malha,
    da categoria de produtos 84 (nº de ordem 40.0840), originários da China, beneficiária
    das preferências pautais previstas no Regulamento (CEE) nº 4259/88 do Conselho
    #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2852/89 DE LA COMISION de 22 de septiembre de 1989
    relativo al restablecimiento de la recaudacion de los derechos arancelarios aplicables
    a los tejidos de fibras textiles artificiales continuas de la categoria de productos
    no 36 (numero de orden 40.0360), a los pantalones cortos y trajes " slips " de
    bano de la categoria de productos no 72 (numero de orden 40.0720) y a los mantones,
    chales y panuelos, que no sean de punto, de la categoria de productos no 84 (numero
    de orden 40.0840), originarios de China, beneficiaria de las preferencias arancelarias
    previstas por el Reglamento (CEE) no 4259/88 del Consejo
