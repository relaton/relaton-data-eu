title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2852/89 of 22 September 1989 re-establishing
    the levying of customs duties on woven fabrics of continuous artificial fibres,
    products of category 36 (order No 40.0360), swimwear, products of category 72
    (order No 40.0720), and shawls, scarves and mufflers, other than knitted or crocheted,
    products of category 81 (order No 40.0840), originating in China to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2852/89 de la Commission du 22 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres artificielles continues, de la catégorie de produits 36 (numéro d'ordre
    40.0360), aux maillots, culottes et slips de bain, de la catégorie de produits
    72 (numéro d'ordre 40.0720), et aux châles, écharpes, foulards autres qu'en
    bonneterie de la catégorie de produits 84 (numéro d'ordre 40.0840), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2852/89 DER KOMMISSION vom 22. September 1989 zur
    Wiedereinführung des Zollsatzes für Gewebe aus künstlichen Spinnfäden der
    Warenkategorie 36 (lfd. Nr. 40.0360), Badeanzüge und Badehosen der Warenkategorie
    72 (lfd. Nr. 40.0720) und Schals, Umschlagtücher, Halstücher, andere als aus
    Gewirken, der Warenkategorie Nr. 84 (lfd. Nr. 40.0840) mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2852/89 af 22. september 1989 om genindførelse
    af opkrævning af toldafgifter for vævet stof af endeløse syntetiske fibre under
    varekategori 36 (løbenummer 40.0360), badebeklædning under varekategori 72 (løbenummer
    40.0720), sjaler, tørklæder, mantiller, ikke af trikotage, under varekategori
    nr. 84 (løbenummer 40.0840), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
