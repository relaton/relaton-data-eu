  script: Latn
  content: '81/106/EEC: Commission Decision of 5 February 1981 on the reimbursement
    by the EAGGF, Guidance Section, to the United Kingdom of expenditure incurred
    during 1978 on aids and premiums relating to the modernization of farms, including
    those in the less-favoured farming areas (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/106/CEE: Décision de la Commission, du 5 février 1981, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole, section
    "orientation", au Royaume-Uni, des dépenses effectuées pendant l''année 1978
    pour les aides et primes relatives à la modernisation des exploitations agricoles,
    y compris dans les zones agricoles défavorisées (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
