id: EUDecision1978759
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 August 1978 authorizing the Federal Republic
    of Germany not to apply Community treatment to woven fabrics of regenerated textile
    fibres, unbleached or bleached, falling within subheading ex 56.07 B of the Common
    Customs Tariff, originating in the USSR and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/759/CEE: Décision de la Commission, du 25 août 1978, autorisant la
    République fédérale d''Allemagne à exclure du traitement communautaire les
    tissus de fibres textiles artificielles, écrus ou blanchis de la sous- position
    Ex 56.07 B du Tarif douanier commun, originaires d''URSS et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. August 1978, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der UdSSR stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus künstlichen Spinnfasern, roh oder gebleicht,
    der Tarifstelle ex 56.07 B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 25. august 1978 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage vævet stof af regenererede
    fibre, ubleget eller bleget, som henhører under pos. ex 56.07 B i den fælles
    toldtarif, har oprindelse i USSR og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 agosto 1978, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario i tessuti di fibre
    tessili artificiali, greggi o imbianchiti, della voce ex 56.07 B della tariffa
    doganale comune, originari dell'URSS e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 augustus 1978 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd weefsels van kunstmatige vezels, ongebleekt of gebleekt,
    van post ex 56.07 B, van het gemeenschappelijk douanetarief, van oorsprong uit
    USSR en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
