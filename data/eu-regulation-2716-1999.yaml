title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2716/1999 of 20 December 1999 amending Regulation
    (EC) No 1564/1999 fixing the minimum import price applicable to dried grapes during
    the 1999/2000 marketing year as well as the countervailing charge to be imposed
    where that price is not observed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2716/1999 de la Commission, du 20 décembre 1999, modifiant
    le règlement (CE) nº 1564/1999 fixant le prix minimal à l'importation applicable
    aux raisins secs au cours de la campagne de commercialisation 1999/2000 ainsi
    que la taxe compensatoire à percevoir dans les cas où ce prix n'est pas respecté
  type: main
- language: de
  script: Latn
