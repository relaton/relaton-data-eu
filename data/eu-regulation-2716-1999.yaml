    für getrocknete Weintrauben im Wirtschaftsjahr 1999/2000 und der im Fall der
    Nichteinhaltung dieses Preises zu erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2716/1999 af 20. december 1999 om ændring
