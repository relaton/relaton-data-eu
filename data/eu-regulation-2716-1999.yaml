    ei noudateta, annetun asetuksen (EY) N:o 1564/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2716/1999 della Commissione, del 20 dicembre 1999,
    recante modifica del regolamento (CE) n. 1564/1999 che fissa, per la campagna
    di commercializzazione 1999/2000, il prezzo minimo all'importazione per le uve
    secche, nonché la tassa di compensazione applicabile qualora tale prezzo non
    sia rispettato
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2716/1999 van de Commissie van 20 december 1999 tot
    wijziging van Verordening (EG) nr. 1564/1999 tot vaststelling van de minimumprijs
    bij invoer van krenten en rozijnen voor het verkoopseizoen 1999/2000 en van de
    compenserende heffing bij niet-inachtneming van deze prijs
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2716/1999 da Comissão, de 20 de Dezembro de 1999,
