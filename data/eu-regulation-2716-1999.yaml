    tørrede druer i produktionsåret 1999/2000 og af den udligningsafgift, der skal
    opkræves, hvis denne pris ikke overholdes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2716/1999 της Επιτροπής,
    της 20ής Δεκεμβρίου 1999, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1564/1999 που καθορίζει
    την ελάχιστη τιμή στην εισαγωγή που εφαρμόζεται
    στις σταφίδες κατά τη διάρκεια της περιόδου
    εμπορίας 1999/2000, καθώς και την εξισωτική εισφορά
    που εισπράττεται στις περιπτώσεις που δεν
    τηρείται η τιμή αυτή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2716/1999, annettu 20 päivänä joulukuuta 1999,
