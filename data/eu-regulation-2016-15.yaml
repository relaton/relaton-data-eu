    de mesa podem ser introduzidos na União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/15 al Comisiei din 7 ianuarie
    2016 de aprobare a programului de control al fostei Republici iugoslave a Macedoniei
    pentru salmonela la găinile ouătoare și de modificare a anexei I la Regulamentul
    (CE) nr. 798/2008 în ceea ce privește rubrica referitoare la fosta Republică
    iugoslavă a Macedoniei din lista țărilor terțe din care pot proveni ouăle
    pentru consum introduse în Uniune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/15 zo 7. januára 2016, ktorým
    sa schvaľuje program bývalej Juhoslovanskej republiky Macedónsko na kontrolu
    salmonely v prípade nosníc a ktorým sa mení príloha I k nariadeniu (ES) č.
    798/2008, pokiaľ ide o zápis týkajúci sa bývalej Juhoslovanskej republiky
    Macedónsko do zoznamu tretích krajín, z ktorých možno do Únie dovážať
    konzumné vajcia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/15 z dne 7. januarja 2016 o odobritvi
    programa nadzora salmonele pri kokoših nesnicah v nekdanji jugoslovanski republiki
    Makedoniji in spremembi Priloge I k Uredbi (ES) št. 798/2008 glede vnosa, ki
    se nanaša na nekdanjo jugoslovansko republiko Makedonijo, na seznamu tretjih
    držav, iz katerih je dovoljen uvoz konzumnih jajc v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/15 de la Comisión, de 7 de enero de
    2016, por el que se aprueba el programa de control de la antigua República Yugoslava
    de Macedonia para la salmonela en gallinas ponedoras y por el que se modifica
    el anexo I del Reglamento (CE) n° 798/2008 en lo relativo a la entrada correspondiente
    a la antigua República Yugoslava de Macedonia en la lista de terceros países
    a partir de los cuales pueden introducirse en la Unión huevos de mesa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/15 av den 7 januari 2016
    om godkännande av kontrollprogrammet för f.d. jugoslaviska republiken Makedonien
    avseende salmonella hos värphöns och om ändring av bilaga I till förordning
    (EG) nr 798/2008 vad gäller uppgifterna om f.d. jugoslaviska republiken Makedonien
    i förteckningen över tredjeländer från vilka konsumtionsägg får föras in
    till unionen
