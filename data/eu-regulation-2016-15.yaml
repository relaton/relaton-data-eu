title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/15 of 7 January 2016 approving
    the control programme of the former Yugoslav Republic of Macedonia for Salmonella
    in laying hens and amending Annex I to Regulation (EC) No 798/2008 as regards
    the entry for the former Yugoslav Republic of Macedonia in the list of third countries
    from which table eggs may be introduced into the Union
  type: main
- language: fr
  script: Latn
