title:
- language: en
  script: Latn
  content: '2011/510/EU: Commission Decision of 4 August 2011 extending the period
    referred to in Article 114(6) of the Treaty on the Functioning of the European
    Union in relation to national provisions maintaining the limit values for lead,
    barium, arsenic, antimony, mercury and nitrosamines and nitrosatable substances
    in toys notified by Germany pursuant to Article 114(4) (notified under document
    C(2011) 5355)'
  type: main
- language: fr
  script: Latn
  content: '2011/510/UE: Décision de la Commission du 4 août 2011 relative à l’extension
    de la période mentionnée à l’article 114, paragraphe 6, du traité sur le
    fonctionnement de l’Union européenne relatif aux dispositions nationales maintenant
    les valeurs limites pour le plomb, le baryum, l’arsenic, l’antimoine, le mercure,
    les nitrosamines et les substances nitrosables dans les jouets notifiées par
    l’Allemagne en vertu de l’article 114, paragraphe 4 [notifiée sous le numéro
    C(2011) 5355]'
  type: main
