    4 notifizierte einzelstaatliche Bestimmungen zur Beibehaltung der Grenzwerte für
    Blei, Barium, Arsen, Antimon, Quecksilber sowie für Nitrosamine und nitrosierbare
    Stoffe in Spielzeug (Bekannt gegeben unter Aktenzeichen K(2011) 5355)'
