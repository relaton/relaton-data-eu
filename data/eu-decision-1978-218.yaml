id: EUDecision1978218
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 2 February 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to coats and jackets of woven man-made textile fibres, falling
    within heading No ex 61.02 of the Common Customs Tariff, originating in Yugoslavia
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: 78/218/CEE Décision de la Commission, du 2 février 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux et vestes tissés de fibres
    textiles synthétiques pour femmes, de la position Ex 61.02 du Tarif douanier
    commun, originaires de Yougoslavie et mis en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 2. Februar 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Mäntel und Jacken aus synthetischen Spinnstoffen der Tarifnummer
    ex 61.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 2. februar 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage frakker og jakker af blandede syntetiske fibre, som henhører under
    position 61.02 i den fælles toldtarif, har oprindelse i Jugoslavien og frit kan
    omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 2 febbraio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i cappotti e le giacche di fibre tessili sintetiche
    per donna, della voce ex 61.02 della tariffa doganale comune, originari della
    Iugoslavia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 2 februari 1978 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden
    gemachtigd geweven damesmantels en jassen van synthetische textielvezels van post
    ex 61.02 van het gemeenschappelijk douanetarief, van oorsprong uit Joegoslavië
    en in de andere Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
