    uvedbo digitalne prizemne televizije na oddaljenih in manj urbaniziranih območjih
    (zunaj avtonomne skupnosti Kastilja – Manča) (notificirano pod dokumentarno
    številko C(2021) 4048) (Besedilo v španskem jeziku je edino verodostojno)
