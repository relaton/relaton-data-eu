title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2021/2034 of 10 June 2021 on the State aid SA.28599
    (C 23/2010) (ex NN 36/2010, ex CP 163/2009)) implemented by Spain for the deployment
    of digital terrestrial television in remote and less urbanised areas (outside
    Castilla-La Mancha) (notified under document C(2021) 4048) (Only the Spanish version
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/2034 de la Commission du 10 juin 2021 relative à l’aide
    d’État SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) octroyée par l’Espagne
    en faveur du déploiement de la télévision numérique terrestre dans des zones
    éloignées et moins urbanisées (excepté en Castille-La Manche) [notifiée sous
    le numéro C(2021) 4048] (Le texte en langue espagnole est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/2034 der Kommission vom 10. Juni 2021 über die staatliche
    Beihilfe SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009), die Spanien für
    die Einführung des terrestrischen Digitalfernsehens in entlegenen und weniger
    besiedelten Gebieten (mit Ausnahme von Kastilien-La Mancha) gewährt hat (Bekannt
    gegeben unter Aktenzeichen C(2021) 4048) (Nur der spanische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/2034 на Комисията от 10 юни
    2021 година относно държавна помощ SA.28599 (C 23/2010)
    (ex NN 36/2010, ex CP 163/2009), приведена в действие от Испания,
    за въвеждане на цифрова наземна телевизия
    в отдалечени и слабо урбанизирани райони (извън
    Кастилия-Ла Манча) (нотифицирано под номер
    C(2021) 4048) (само текстът на испански език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise (EU) 2021/2034 ze dne 10. června 2021 o státní podpoře
    SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) poskytnuté Španělskem
    na zavedení digitálního pozemního televizního vysílání ve vzdálených
    a méně urbanizovaných oblastech (kromě oblasti Kastilie-La Mancha) (oznámeno
    pod číslem C(2021) 4048) (Pouze španělské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse (EU) 2021/2034 af 10. juni 2021 om statsstøtte
    SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009)) iværksat af Spanien til
    implementering af jordsendt digital-TV i fjerntliggende og mindre urbaniserede
    områder (uden for Castilla-La Mancha) (meddelt under nummer C(2021) 4048) (Kun
    den spanske version er autentisk)
  type: main
- language: el
  script: Grek
  content: Απόφαση (EE) 2021/2034 της Επιτροπής της 10ης Ιουνίου
    2021 σχετικά με την κρατική ενίσχυση SA.28599 (C 23/2010)
    (πρώην NN 36/2010, πρώην CP 163/2009) την οποία η Ισπανία
    έθεσε σε εφαρμογή για την ανάπτυξη επίγειας
    ψηφιακής τηλεόρασης σε απομακρυσμένες και
    λιγότερο αστικοποιημένες περιοχές (εκτός της
    Καστίλης-Λα Μάντσα) [κοινοποιηθείσα υπό τον
    αριθμό C(2021) 4048] (Το κείμενο στην ισπανική γλώσσα
    είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus (EL) 2021/2034, 10. juuni 2021, riigiabi SA.28599 (C 23/2010)
    (ex NN 36/2010, ex CP 163/2009) kohta, mida Hispaania andis maapealse digitelevisiooni
    kasutuselevõtuks äärealadel ja vähem linnastunud piirkondades (väljaspool
    Castilla-La Manchat) (teatavaks tehtud numbri C(2021) 4048 all) (Ainult hispaaniakeelne
    tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission päätös (EU) 2021/2034, annettu 10 päivänä kesäkuuta 2021,
    valtiontuesta SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009), jota Espanja
    on myöntänyt maanpäällisen verkon digitaalitelevisiolle syrjäisillä ja vähemmän
    kaupungistuneilla alueilla (Castilla-La Manchan ulkopuolella) (tiedoksiannettu
    numerolla C(2021) 4048) (Ainoastaan espanjankielinen teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Odluka Komisije (EU) 2021/2034 оd 10. lipnja 2021. o državnoj potpori
    SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) koju je provela Španjolska
    za uvođenje digitalne zemaljske televizije na udaljenim i manje urbaniziranim
    područjima (izvan Kastilje-La Manche) (priopćeno pod brojem dokumenta C(2021)
    4048) (Vjerodostojan je samo tekst na španjolskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2034 határozata (2021. június 10.) a Spanyolország
    által a digitális földfelszíni televíziózás távoli és kevésbé urbanizált
    területeken történő kiépítésére (Kasztília-La Mancha régión kívül)
    odaítélt SA.28599. (C 23/2010., korábbi NN 36/2010., korábbi CP 163/2009.)
    sz. állami támogatásról (az értesítés a C(2021) 4048. számú dokumentummal
    történt) (Csak a spanyol nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/2034 della Commissione del 10 giugno 2021 relativa
    all'aiuto di Stato SA.28599 [C 23/2010 (ex NN 36/2010, ex CP 163/2009)] concesso
    dal Regno di Spagna a favore della diffusione della televisione digitale terrestre
    in zone remote e meno urbanizzate (ad eccezione di Castiglia-La Mancha) [notificata
    con il numero C(2021) 4048] (Il testo in lingua spagnola è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (ES) 2021/2034 (2021. gada 10. jūnijs) par valsts atbalstu
    SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009), ko Spānija sniegusi zemes
    ciparu televīzijas (DTT) ieviešanai attālās un mazāk urbanizētās teritorijās
    (ārpus Kastīlijas-Lamančas) (izziņots ar dokumenta numuru C(2021) 4048) (Autentisks
    ir tikai teksts spāņu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos sprendimas (ES) 2021/2034 2021 m. birželio 10 d. dėl valstybės
    pagalbos SA.28599 (C 23/2010 (ex NN 36/2010, ex CP 163/2009), kurią Ispanija
    suteikė skaitmeninės antžeminės televizijos technologijai diegti atokiose
    ir mažiau urbanizuotose vietovėse (išskyrus Kastiliją-La Mančą) (pranešta
    dokumentu Nr. C(2021) 4048) (Tekstas autentiškas tik ispanų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni (UE) 2021/2034 tal-10 ta’ Ġunju 2021 dwar
    l-Għajnuna mill-Istat SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009)) implimentata
    minn Spanja għat-tnedija tat-televiżjoni diġitali terrestri f’żoni remoti
    u inqas urbanizzati (barra minn Castilla-La Mancha) (notifikata bid-dokument C(2021)
    4048) (Il-verżjoni Spanjola biss hija awtentika)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/2034 van de Commissie van 10 juni 2021 betreffende de
    steunmaatregel SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) die Spanje
    heeft uitgevoerd voor de ontwikkeling van digitale terrestrische televisie in
    afgelegen en minder verstedelijkte gebieden (met uitzondering van Castilla-La
    Mancha) (Kennisgeving geschied onder nummer C(2021) 4048) (Slechts de tekst in
    de Spaanse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji (UE) 2021/2034 z dnia 10 czerwca 2021 r. w sprawie pomocy
    państwa SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) wdrożonej przez
    Hiszpanię na rzecz rozwinięcia naziemnej telewizji cyfrowej na obszarach oddalonych
    i mniej zurbanizowanych (poza regionem Kastylia-La Mancha) (notyfikowana jako
    dokument nr C(2021) 4048) (Jedynie tekst w języku hiszpańskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/2034 da Comissão de 10 de junho de 2021 relativa ao
    auxílio estatal SA.28599 [C 23/2010 (ex-NN 36/2010, ex-CP 163/2009)] concedido
    pelo Reino de Espanha para a implantação da televisão digital terrestre em
    zonas remotas e menos urbanizadas (exceto em Castela-Mancha) [notificada com o
    número C(2021) 4048] (Apenas faz fé o texto na língua espanhola)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/2034 a Comisiei din 10 iunie 2021 privind ajutorul de
    stat SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) pus în aplicare de
    Spania pentru instalarea televiziunii digitale terestre în zonele îndepărtate
    și mai puțin urbanizate (cu excepția comunității autonome Castilla-La Mancha)
    [notificată cu numărul C(2021) 4048] (Numai textul în limba spaniolă este
    autentic)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (EÚ) 2021/2034 z 10. júna 2021 o štátnej pomoci
    SA.28599 (C 23/2010) (ex NN 36/2010, ex CP 163/2009) poskytnutej Španielskom
    na rozvoj digitálneho terestriálneho televízneho vysielania vo vzdialených
    a v menej urbanizovaných oblastiach (okrem autonómneho spoločenstva Kastília-La
    Mancha) [oznámené pod číslom C(2021) 4048] (Iba španielske znenie je autentické)
  type: main
