title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 534/2003 of 26 March 2003 determining the
    extent to which applications lodged in March 2003 for licences for certain eggs
    and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic, Slovakia, Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 534/2003 de la Commission du 26 mars 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en mars 2003 pour certains produits des secteurs de la viande de volaille et des
    œufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la République de Pologne, la République de Hongrie, la République tchèque,
    la Slovaquie, la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 534/2003 der Kommission vom 26. März 2003 über die
    Festsetzung des Umfangs, in dem die im März 2003 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse der Sektoren Eier und Geflügelfleisch entsprechend
    der Regelung der Abkommen zwischen der Gemeinschaft und der Republik Polen, der
    Republik Ungarn, der Tschechischen Republik, der Slowakei, Rumänien und Bulgarien
    genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 534/2003 af 26. marts 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    2003 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske
    Republik, Rumænien og Republikken Bulgarien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 534/2003 της Επιτροπής,
    της 26ης Μαρτίου 2003, για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν το Μάρτιο του 2003 για πιστοποιητικά
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
    τις οποίες συνήψε η Κοινότητα με τη Δημοκρατία
    της Πολωνίας, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακία τη Ρουμανία
    και τη Βουλγαρία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 534/2003, annettu 26 päivänä maaliskuuta 2003,
    yhteisön sekä Puolan, Unkarin, Tšekin tasavallan, Slovakian, Romanian ja Bulgarian
    välisissä väliaikaisissa sopimuksissa määrättyyn järjestelmään liittyvien
    maaliskuussa 2003 jätettyjen tiettyjä siipikarjanliha- ja muna-alan tuotteita
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 534/2003 della Commissione, del 26 marzo 2003, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di marzo 2003 per taluni prodotti del settore delle uova e
    del pollame nel quadro del regime previsto dagli accordi conclusi tra la Comunità
    e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica ceca, la
    Slovacchia, la Romania e la Bulgaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 534/2003 van de Commissie van 26 maart 2003 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sectoren slachtpluimvee en eieren, die in maart
    2003 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarĳe,
    de Tsjechische Republiek, Slowakĳe, Roemenië en Bulgarĳe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 534/2003 da Comissão, de 26 de Março de 2003, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos dos sectores dos ovos e da carne de aves de capoeira
    apresentados em Março de 2003 ao abrigo do regime previsto nos acordos concluídos
    pela Comunidade com a República da Polónia, a República da Hungria, a República
    Checa, a Eslováquia, a Roménia e a Bulgária
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 534/2003 de la Comisión, de 26 de marzo de 2003, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación de algunos productos de los sectores de la carne de aves de corral
    y de los huevos presentadas en el mes de marzo de 2003 al amparo del régimen
    previsto en los Acuerdos celebrados entre la Comunidad y la República de Polonia,
    la República de Hungría, la República Checa, la República Eslovaca, Rumania
    y la República de Bulgaria
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 534/2003 av den 26 mars 2003 om fastställande
    av i vilken utsträckning de ansökningar om importlicens för vissa ägg- och
    fjäderfäköttprodukter som ges in under mars 2003 i enlighet med det förfarande
    som föreskrivs i interimsavtalen mellan gemenskapen och Polen, Ungern, Tjeckien,
    Slovakien, Rumänien och Bulgarien kan godtas
