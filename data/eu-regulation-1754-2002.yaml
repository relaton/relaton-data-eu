title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1754/2002 of 1 October 2002 amending for
    the fourth time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with Usama bin Laden, the Al-Qaida network and the Taliban, and repealing Council
    Regulation (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1754/2002 de la Commission du 1er octobre 2002 modifiant
    pour la quatrième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1754/2002 der Kommission vom 1. Oktober 2002 zur vierten
    Änderung der Verordnung (EG) Nr. 881/2002 des Rates über die Anwendung bestimmter
    spezifischer restriktiver Maßnahmen gegen bestimmte Personen und Organisationen,
    die mit Osama bin Laden, dem Al-Qaida-Netzwerk und den Taliban in Verbindung stehen,
    und zur Aufhebung der Verordnung (EG) Nr. 467/2001 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1754/2002 на Комисията от 1
    октомври 2002 година за изменение за четвърти
    път на Регламент (ЕО) № 881/2002 на Съвета за налагане
    на някои специфични ограничителни мерки, насочени
    срещу определени лица и образувания, свързани
    с Осама бен Ладен, мрежата на Ал Кайда и талибаните,
    и за отмяна на Регламент (ЕО) № 467/2001 на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1754/2002 ze dne 1. října 2002, kterým se
    počtvrté mění nařízení Rady (ES) č. 881/2002 o zavedení některých zvláštních
    omezujících opatření namířených proti některým osobám a subjektům spojeným
    s Usámou bin Ládinem, sítí Al-Kajdá a Talibanem a o zrušení nařízení
    Rady (ES) č. 467/2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1754/2002 af 1. oktober 2002 om fjerde
    ændring af Rådets forordning (EF) nr. 881/2002 om indførelse af visse specifikke
    restriktive foranstaltninger mod visse personer og enheder, der har tilknytning
    til Usama bin Laden, Al-Qaida-organisationen og Taliban, og om ophævelse af Rådets
    forordning (EF) nr. 467/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1754/2002 της Επιτροπής,
