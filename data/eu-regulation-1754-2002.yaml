    Osama bin Ladeni, Al-Qaida võrgu ja Talibaniga seotud isikute ja üksuste vastu
    suunatud eripiirangud ja tunnistatakse kehtetuks nõukogu määrus (EÜ) nr 467/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1754/2002, annettu 1 päivänä lokakuuta 2002,
    tiettyihin Osama bin Ladenia, Al-Qaida-verkostoa ja Talebania lähellä oleviin
    henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista toimenpiteistä
    sekä neuvoston asetuksen (EY) N:o 467/2001 kumoamisesta annetun neuvoston asetuksen
    (EY) N:o 881/2002 muuttamisesta neljännen kerran
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 1754/2002 od 1. listopada 2002. o četvrtoj izmjeni
    Uredbe Vijeća (EZ) br. 881/2002 o određenim posebnim restriktivnim mjerama protiv
    određenih osoba i subjekata povezanih s Osamom bin Ladenom, mrežom Al-Qaidom
    i talibanima te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1754/2002/EK rendelete (2002. október 1.) az Oszáma bin
    Ládennel, az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló
    egyes személyekkel és szervezetekkel szemben meghatározott szigorító intézkedések
    bevezetéséről és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről
    szóló 881/2002/EK tanácsi rendelet negyedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1754/2002 della Commissione, del 1° ottobre 2002,
    recante quarta modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1754/2002 (2002. gada 1. oktobris), ar ko ceturto
    reizi groza Padomes Regulu (EK) Nr. 881/2002, ar kuru paredz īpašus ierobežojošus
    pasākumus, kas vērsti pret konkrētām personām un organizācijām, kas saistītas
    ar Osamu Bin Ladenu, Al-Qaida tīklu un Taliban, un ar kuru atceļ Padomes Regulu
    (EK) Nr. 467/2001
  type: main
- language: lt
  script: Latn
  content: 2002 m. spalio 1 d. Komisijos reglamentas (EB) Nr. 1754/2002, ketvirtą
    kartą iš dalies keičiantis Tarybos reglamentą (EB) Nr. 881/2002, nustatantį
    tam tikras specialias ribojančias priemones, taikomas tam tikriems asmenims ir
    subjektams, susijusiems su Usama bin Ladenu, Al-Qaida tinklu ir Talibanu, bei
    panaikinantį Tarybos reglamentą (EB) Nr. 467/2001
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 1754/2002 ta' l-1 ta' Ottubru 2002
    li jemenda għar-raba' darba r-Regolament tal-Kunsill (KE) Nru 881/2002 li jimponi
    ċerti miżuri speċifiċi restrittivi mmirati kontra ċerti persuni u entitajiet
    li huma assoċjati ma' Usama Bin Laden, l-Al-Qaida network u t-Taliban, u jħassar
    ir-Regolament tal-Kunsill (KE) Nru 467/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1754/2002 van de Commissie van 1 oktober 2002 tot
    vierde wĳziging van Verordening (EG) nr. 881/2002 van de Raad tot vaststelling
    van bepaalde specifieke beperkende maatregelen tegen sommige personen en entiteiten
    die banden hebben met Usama bin Laden, het Al Qa'ida-netwerk en de Taliban, en
    tot intrekking van Verordening (EG) nr. 467/2001 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1754/2002 z dnia 1 października 2002 r.
    zmieniające po raz czwarty rozporządzenie Rady (WE) nr 881/2002 wprowadzające
    niektóre szczególne środki ograniczające skierowane przeciwko niektórym osobom
    i podmiotom związanym z Osamą bin Ladenem, siecią Al-Kaida i talibami i uchylające
    rozporządzenie Rady (WE) nr 467/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1754/2002 da Comissão, de 1 de Outubro de 2002,
    que altera pela quarta vez o Regulamento (CE) n.° 881/2002 do Conselho que institui
    certas medidas restritivas específicas contra determinadas pessoas e entidades
    associadas a Osama bin Laden, à rede Al-Qaida e aos Talibã, e que revoga o Regulamento
    (CE) n.° 467/2001 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1754/2002 al Comisiei din 1 octombrie 2002 de efectuare
    a celei de-a patra modificări a Regulamentului (CE) nr. 881/2002 al Consiliului
    de instituire a unor măsuri restrictive specifice împotriva anumitor persoane
    și entități care au legătură cu Osama ben Laden, cu rețeaua Al-Qaida și
    cu talibanii și de abrogare a Regulamentului (CE) nr. 467/2001 al Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1754/2002 z 1. októbra 2002, ktoré štvrtýkrát
    mení a dopĺňa nariadenie Rady (ES) č. 881/2002, ktoré ukladá niektoré špecifické
    obmedzujúce opatrenia namierené proti niektorým osobám a subjektom spojeným
    s Usámom bin Ládinom, sieťou Al-Qaida a Talibanom a ruší nariadenie Rady
    (ES) č. 467/2001
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1754/2002 z dne 1. oktobra 2002 o četrti spremembi
    Uredbe Sveta (ES) št. 881/2002 o posebnih omejevalnih ukrepih za nekatere osebe
    in subjekte, povezane z Osama bin Ladnom, mrežo Al-Kaida in talibani, in o razveljavitvi
    Uredbe Sveta (ES) št. 467/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1754/2002 de la Comisión, de 1 de octubre de 2002,
    por el que se modifica por cuarta vez el Reglamento (CE) n° 881/2002 del Consejo
    por el que se imponen determinadas medidas restrictivas específicas dirigidas
    contra determinadas personas y entidades asociadas con Usamah bin Ladin, la red
    Al-Qaida y los talibanes y por el que se deroga el Reglamento (CE) n° 467/2001
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1754/2002 av den 1 oktober 2002 om ändring
