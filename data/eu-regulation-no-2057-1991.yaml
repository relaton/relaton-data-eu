title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2057/91 of 12 July 1991 suspending customs
    duties applicable to vinous alcohol from Spain intended for use as motor fuel
    within the Community under special sales by tender
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 2057/91 de la Commission, du 12 juillet 1991, portant
    suspension des droits de douane applicables à l' alcool d' origine vinique obtenu
    en Espagne et destiné à être utilisé comme carburant dans la Communauté dans
    le cadre d' adjudications particulières
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2057/91 der Kommission vom 12. Juli 1991 zur Aussetzung
    von Zöllen auf spanischen, zur Verwendung als Treibstoff in der Gemeinschaft
    bestimmten Weinalkohol im Rahmen von Sonderausschreibungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2057/91 af 12. juli 1991 om supension
    af tolden for vinalkohol, der er fremstillet i Spanien, og som er bestemt til
    anvendelse som brændstof i Fællesskabet i forbindelse med særlige licitationer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2057/91 της Επιτροπής
    της 12ης Ιουλίου 1991 για την αναστολή των δασμών
    που εφαρμόζονται στην αλκοόλη οινικής προελεύσεως
    που λαμβάνεται στην Ισπανία και προορίζεται
    να χρησιμοποιηθεί ως καύσιμο στην Κοινότητα
    στα πλαίσια ειδικών δημοπρασιών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2057/91 della Commissione, del 12 luglio 1991, che
    sospende i dazi doganali applicabili all' alcole di origine vinica ottenuto in
    Spagna e destinato ad essere utilizzato nel settore dei carburanti all' interno
    della Comunità nell' ambito di gare particolari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2057/91 van de Commissie van 12 juli 1991 tot schorsing
    van de douanerechten op in Spanje geproduceerde en in het kader van bijzondere
    inschrijvingen toegewezen alcohol uit wijnbouwprodukten, bestemd voor gebruik
    als motorbrandstof in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2057/91 da Comissão, de 12 de Julho de 1991, que
    suspende os direitos aduaneiros aplicáveis ao álcool vínico obtido em Espanha
    e destinado a utilização como combustível e na Comunidade, no âmbito de concursos
    especiais
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2057/91 de la Comisión, de 12 de julio de 1991, por
    el que se suspenden los derechos de aduana aplicables al alcohol vínico obtenido
    en España y destinado a ser utilizado como carburante en la Comunidad, en el
    marco de las licitaciones específicas
  type: main
