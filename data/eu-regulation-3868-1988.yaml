    di conigli domestici provenienti dai paesi terzi, stabilisce le relative modalità
    di applicazione e abroga il regolamento (CEE) n. 3694/87
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3868/88 VAN DE COMMISSIE van 13 december 1988 tot
