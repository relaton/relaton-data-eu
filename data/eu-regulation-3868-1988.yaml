  content: Commission Regulation (EEC) No 3868/88 of 13 December 1988 fixing, for
    1989 the quota for imports into Spain of meat of domestic rabbits from third countries
    and certain detailed rules for the application thereof and repealing Regulation
    (EEC) No 3694/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3868/88 de la Commission du 13 décembre 1988 fixant,
