    aus Drittlaendern und diesbezueglicher Durchfuehrungsbestimmungen sowie zur Aufhebung
    der Verordnung (EWG) Nr. 3694/87
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3868/88 af 13. december 1988 om fastsættelse
