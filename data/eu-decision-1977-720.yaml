title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1977 authorizing the Federal Republic
    of Germany, the French Republic, the Grand Duchy of Luxembourg and the United
    Kingdom to permit under certain conditions an additional increase in the alcoholic
    strength of certain wines and certain products intended for wine making
  type: main
- language: fr
  script: Latn
  content: '77/720/CEE: Décision de la Commission, du 17 novembre 1977, autorisant
    la République fédérale d''Allemagne, la République française, le Grand-Duché
    de Luxembourg et le Royaume-Uni à permettre, sous certaines conditions, une augmentation
    supplémentaire du titre alcoométrique de certains vins et de certains produits
    destinés à l''élaboration des vins'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1977 zur Ermächtigung der
    Bundesrepublik Deutschland, der Französischen Republik, des Großherzogtums Luxemburg
    und des Vereinigten Königreichs, unter bestimmten Bedingungen eine zusätzliche
    Erhöhung des Alkoholgehalts bestimmter Weine und bestimmter zur Herstellung von
    Wein vorgesehener Erzeugnisse zu gestatten
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. november 1977 om bemyndigelse af Forbundsrepublikken
    Tyskland, Den franske Republik, storhertugdømmet Luxembourg og Det forenede Kongerige
    til under visse omstændigheder at tillade en yderligere forhøjelse af alkoholindholdet
    i visse vine og visse produkter, der er bestemt til vinfremstilling
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1977, che autorizza la Repubblica
    federale di Germania, la Repubblica francese, il Granducato del Lussemburgo e
    il Regno Unito a permettere, in determinate condizioni, un aumento supplementare
    della gradazione alcolometrica di taluni vini e di taluni prodotti destinati all'elaborazione
    dei vini
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1977 waarbij de Bondsrepubliek
    Duitsland, de Franse Republiek, het Groothertogdom Luxemburg en het Verenigd Koninkrijk
    gemachtigd worden om op bepaalde voorwaarden een extra verhoging van het alcoholgehalte
    van bepaalde wijnen en van bepaalde voor de bereiding van wijn bestemde produkten
    toe te staan
  type: main
