title:
- language: en
  script: Latn
  content: '2006/335/EC: Commission Decision of 8 May 2006 authorising the Republic
    of Poland to prohibit on its territory the use of 16 genetically modified varieties
    of maize with the genetic modification MON 810 listed in the Common catalogue
    of varieties of agricultural plant species, pursuant to Council Directive 2002/53/EC
    (notified under document number C(2006) 1795)'
  type: main
- language: fr
  script: Latn
  content: '2006/335/CE: Décision de la Commission du 8 mai 2006 autorisant la République
    de Pologne à interdire sur son territoire l’utilisation de seize variétés
    de maïs génétiquement modifiées dérivées de la lignée MON 810, figurant
    dans le catalogue commun des variétés des espèces de plantes agricoles, conformément
    à la directive 2002/53/CE du Conseil [notifiée sous le numéro C(2006) 1795]'
  type: main
- language: de
  script: Latn
  content: '2006/335/EG: Entscheidung der Kommission vom 8. Mai 2006 zur Ermächtigung
    der Republik Polen, in ihrem Hoheitsgebiet die Verwendung von sechzehn in den
    gemeinsamen Sortenkatalog für landwirtschaftliche Pflanzenarten gemäß der Richtlinie
    2002/53/EG des Rates eingetragenen Maissorten mit der genetischen Veränderung
    MON 810 zu verbieten (Bekannt gegeben unter Aktenzeichen K(2006) 1795)'
  type: main
- language: cs
  script: Latn
