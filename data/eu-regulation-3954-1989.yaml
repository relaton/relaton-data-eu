title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3954/89 of 27 December 1989 re-establishing
    the levying of customs duties on trousers, bib and brace overalls, breeches and
    shorts (other than swimwear), knitted or crocheted, products of category 28 (order
    No 40.0280), originating in the Philippines, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3954/89 de la Commission du 27 décembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux pantalons,
    salopettes à bretelles, culottes et shorts (autres que pour le bain), en bonneterie,
    de la catégorie de produits n° 28 (numéro d'ordre 40.0280), originaires des
    Philippines, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3954/89 DER KOMMISSION vom 27. Dezember 1989 ueber
    die Wiedereinfuehrung des Zollsatzes fuer lange Hosen (einschliesslich Kniebundhosen
    und aehnliche Hosen), Latzhosen und kurze Hosen, andere als Badehosen, aus Gewirken
    der Warenkategorie Nr. 28 (lfd. Nr. 40.0280) mit Ursprung auf den Philippinen,
    denen die in der Verordnung (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3954/89 af 27. december 1989 om genindførelse
    af opkrævning af toldafgifter for benklæder, overalls, shorts og andre korte
    benklæder (bortset fra badedragter) af trikotage under varekategori 28 (løbenummer
    40.0280), som har oprindelse i Filippinerne og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
- language: el
  script: Grek
