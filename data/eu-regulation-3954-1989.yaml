    a los pantalones de peto con tirante y " shorts " (que no sean para bano) de punto,
    de la categoria de productos no 28 (numeros de orden 40.0280) originarios de las
    Filipinas beneficiario de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 4259/88 del Consejo
