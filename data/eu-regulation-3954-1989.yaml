    του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3954/89 DELLA COMMISSIONE del 27 dicembre 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai pantaloni, tute a bretelle,
    calzoncini e short (diversi da quelli da bagno), a maglia, della categoria di
    prodotti n. 28 (numero d'ordine 40.0280), originari delle Filippine, beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 4259/88 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3954/89 VAN DE COMMISSIE van 27 december 1989 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op lange broeken,
    zogenaamde Amerikaanse overalls, korte broeken en shorts (andere dan zwembroeken),
    van brei- of haakwerk, van de categorie van produkten nr. 28 (volgnummer 40.0280),
    van oorsprong uit de Filippijnen, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 4259/88 van de Raad
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3954/89 DA COMISSAO de 27 de Dezembro de 1989 que
    restabelece a cobrança dos direitos aduaneiros aplicaveis às calças fatos-macaco
    com suspensorios, calçoes e shorts (excluindo os de banho), em malha, da categoria
    de produtos n* 28 (n* de ordem 40.0280), originarios das Filipinas, beneficiarias
    das preferências pautais previstas no Regulamento (CEE) n* 4259/88 do Conselho
  type: main
