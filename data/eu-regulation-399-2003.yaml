title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 399/2003 of 3 March 2003 amending and correcting
    Regulation (EC) No 98/2003 establishing the supply balances and Community aid
    for the supply of certain essential products for human consumption, for processing
    and as agricultural inputs and for the supply of live animals and eggs to the
    outermost regions under Council Regulations (EC) No 1452/2001, (EC) No 1453/2001
    and (EC) No 1454/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 399/2003 de la Commission du 3 mars 2003 modifiant
    et rectifiant le règlement (CE) n° 98/2003 relatif à l'établissement des bilans
    prévisionnels et la fixation des aides communautaires pour l'approvisionnement
    en certains produits essentiels à la consommation humaine, à la transformation
    et en tant qu'intrants agricoles et pour la fourniture d'animaux vivants et d'œufs
    aux régions ultrapériphériques conformément aux règlements (CE) n° 1452/2001,
    (CE) n° 1453/2001 et (CE) n° 1454/2001 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 399/2003 der Kommission vom 3. März 2003 zur Änderung
    und Berichtigung der Verordnung (EG) Nr. 98/2003 zur Festsetzung der Bedarfsvorausschätzungen
    und der Gemeinschaftsbeihilfen für die Versorgung der Regionen in äußerster
    Randlage mit bestimmten zum Direktverbrauch, zur Verarbeitung oder als Produktionsmittel
    benötigten Agrarerzeugnissen einschließlich lebenden Tieren und Eiern gemäß
    den Verordnungen (EG) Nr. 1452/2001, 1453/2001 und 1454/2001 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 399/2003 af 3. marts 2003 om ændring
    og berigtigelse af forordning (EF) nr. 98/2003 om fastsættelse af foreløbige
    forsyningsopgørelser og EF-støtte til levering af vigtige produkter til konsum,
    forarbejdning og anvendelse som rå- og hjælpestoffer og til levering af levende
    dyr og æg til regionerne i den yderste periferi i henhold til Rådets forordning
    (EF) nr. 1452/2001, (EF) nr. 1453/2001 og (EF) nr. 1454/2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 399/2003 της Επιτροπής,
    της 3ης Μαρτίου 2003, για την τροποποίηση και
    διόρθωση του κανονισμού (ΕΚ) αριθ. 98/2003 σχετικά
    με την κατάρτιση των ισοζυγίων προβλέψεων
    και τον καθορισμό των κοινοτικών ενισχύσεων
    για τον εφοδιασμό με ορισμένα βασικά προϊόντα
    για κατανάλωση από τον άνθρωπο, για μεταποίηση
    και ως γεωργικές εισροές καθώς και για την
    προμήθεια ζώντων ζώων και αυγών στις ιδιαίτερα
    απομακρυσμένες περιφέρειες σύμφωνα με τους
    κανονισμούς του Συμβουλίου (ΕΚ) αριθ. 1452/2001,
    (ΕΚ) αριθ. 1453/2001 και (ΕΚ) αριθ. 1454/2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 399/2003, annettu 3 päivänä maaliskuuta 2003,
    syrjäisimpien alueiden alustavien hankintataseiden ja yhteisön tukien vahvistamisesta
    ihmisravinnoksi, jalostukseen ja maatalouden tuotantopanoksina käytettävien
    tiettyjen välttämättömien tuotteiden sekä elävien eläinten ja munien hankkimiseksi
    neuvoston asetusten (EY) N:o 1452/2001, (EY) N:o 1453/2001 ja (EY) N:o 1454/2001
    mukaisesti annetun asetuksen (EY) N:o 98/2003 muuttamisesta ja oikaisemisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 399/2003 della Commissione, del 3 marzo 2003, che modifica
    e rettifica il regolamento (CE) n. 98/2003 relativo alla definizione dei bilanci
    previsionali e alla fissazione degli aiuti comunitari per l'approvvigionamento
    di alcuni prodotti essenziali per il consumo umano, la trasformazione e come fattori
    di produzione agricoli nonché per la fornitura di animali vivi e di uova alle
    regioni ultraperiferiche, conformemente ai regolamenti (CE) n. 1452/2001, (CE)
    n. 1453/2001 e (CE) n. 1454/2001 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 399/2003 van de Commissie van 3 maart 2003 houdende
    wĳziging en rectificatie van Verordening (EG) nr. 98/2003 tot vaststelling van
    de voorzieningsbalansen en van de communautaire steun voor de voorziening van
    bepaalde essentiële producten voor menselĳke consumptie, voor verwerking of
    voor verbruik als productiemiddel in de landbouw en voor de levering van levende
    dieren en eieren aan de ultraperifere regio's overeenkomstig de Verordeningen
    (EG) nr. 1452/2001, (EG) nr. 1453/2001 en (EG) nr. 1454/2001 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 399/2003 da Comissão, de 3 de Março de 2003, que
    altera e rectifica o Regulamento (CE) n.° 98/2003 relativo ao estabelecimento
    das estimativas e à fixação das ajudas comunitárias para o abastecimento de
    certos produtos essenciais para o consumo humano e a transformação e como factores
    de produção agrícola e para o fornecimento de animais vivos e de ovos às regiões
    ultraperiféricas, em conformidade com os Regulamentos (CE) n.° 1452/2001, (CE)
    n.° 1453/2001 e (CE) n.° 1454/2001 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 399/2003 de la Comisión, de 3 de marzo de 2003, por
    el que se modifica y rectifica el Reglamento (CE) n° 98/2003 relativo a la elaboración
    de los planes de previsiones y a la fijación de las ayudas comunitarias al abastecimiento
    de determinados productos esenciales para el consumo humano, la transformación
    y la utilización como insumos agrarios y para el suministro de animales vivos
    y de huevos a las regiones ultraperiféricas de conformidad con los Reglamentos
    (CE) n° 1452/2001, (CE) n° 1453/2001 y (CE) n° 1454/2001 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 399/2003 av den 3 mars 2003 om ändring
    och rättelse av förordning (EG) nr 98/2003 om upprättande av prognostiserade
    försörjningsbalanser och fastställande av gemenskapsstöd för försörjningen
    av vissa produkter som är nödvändiga som livsmedel, för bearbetning samt som
    insatsvaror i jordbruket, och för leveransen av levande djur och ägg till de
    yttersta randområdena i enlighet med rådets förordningar (EG) nr 1452/2001,
    (EG) nr 1453/2001 och (EG) nr 1454/2001
  type: main
