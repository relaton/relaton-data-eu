  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2078/95 de la Comisión, de 30 de agosto de 1995, por
    el que se dispone en el sector de los cereales una excepción a los Reglamentos
    (CEE) nº 3665/87 de la Comisión, por el que se establecen las modalidades comunes
    de aplicación del régimen de restituciones a la exportación para los productos
