    modalités communes d'application du régime des restitutions à l'exportation
    pour les produits agricoles et au règlement (CEE) n° 3719/88 portant modalités
    communes d'application du régime des certificats d'importation, d'exportation
    et de préfixation pour les produits agricoles
  type: main
