  content: Commission Regulation (EC) No 2078/95 of 30 August 1995 concerning derogations
    in the cereals sector from Regulation (EEC) No 3665/87 laying down common detailed
    rules for the application of the system of export refunds on agricultural products
    and from Regulation (EEC) No 3719/88 laying down common detailed rules for the
    application of the system of import and export licences and advance-fixing certificates
    for agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2078/95 de la Commission, du 30 août 1995, portant,
