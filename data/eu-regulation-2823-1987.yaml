title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2823/87 of 18 September 1987 on the documents
    to be used for the purpose of implementing Community measures entailing verification
    of the use and/or destination of goods
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2823/87 de la Commission du 18 septembre 1987 relatif
    aux documents à utiliser en vue de l' application des mesures communautaires
    entraînant le contrôle de l' utilisation et/ou de la destination des marchandises
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2823/87 der Kommission vom 18. September 1987 über
    die Papiere, die im Rahmen der eine Überwachung der Verwendung und/oder Bestimmung
    der Waren erfordernden Gemeinschaftsmaßnahmen zu verwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2823/87 af 18. september 1987 om de
    dokumenter, der skal benyttes med henblik på anvendelsen af fællesskabsforanstaltninger,
    som medfører kontrol med varers anvendelse og/eller bestemmelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2823/87 της Επιτροπής
    της 18ης Σεπτεμβρίου 1987 σχετικά με τα παραστατικά
    που πρέπει να χρησιμοποιούνται εν όψει της
    εφαρμογής των κοινοτικών μέτρων που συνεπάγονται
    τον έλεγχο της χρήσης ή/και του προορισμού
    των εμπορευμάτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2823/87 della Commissione del 18 settembre 1987 relativo
    ai documenti da utilizzare in vista dell' attuazione delle misure comunitarie
    che prevedono il controllo dell' utilizzazione e/o della destinazione delle merci
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2823/87 van de Commissie van 18 september 1987 betreffende
    de documenten die dienen te worden gebruikt met het oog op de toepassing van communautaire
    maatregelen die de controle op het gebruik en/of de bestemming van de goederen
    met zich brengen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2823/87 da Comissão de 18 de Setembro de 1987 relativo
    aos documentos a utilizar com vista à aplicação das medidas comunitárias que
    determinam o controlo da utilização e/ou do destino das mercadorias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2823/87 de la Comisión de 18 de septiembre de 1987
    relativo a los documentos que se deben utilizar para la aplicación de las medidas
    comunitarias que impliquen el control del uso y/o del destino de las mercancías
  type: main
