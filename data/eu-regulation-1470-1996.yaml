title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1470/96 of 25 July 1996 determining to what
    extent licence applications submitted during July 1996 for live bovine animals
    weighing between 160 and 300 kg as part of a tariff quota provided for pursuant
    to Regulation (EC) No 1250/96
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1470/96 DE LA COMMISSION du 25 juillet 1996 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1996 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un contingent tarifaire prévu
    par le règlement (CE) n° 1250/96
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1470/96 DER KOMMISSION vom 25. Juli 1996 zur Festsetzung
    des Umfangs, in dem die im Juli 1996 für die Einfuhr lebender, 160 bis 300 kg
    schwerer Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG) Nr.
    1250/96 beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1470/96 af 25. juli 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i juli 1996 om importlicenser
    for levende kvæg af en vægt på 160 til 300 kg i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1250/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1470/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Ιουλίου 1996 για τον καθορισμό του βαθμού
    στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιούλιο 1996 για ζωντανά ζώα του
    βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας δασμολογικής ποσόστωσης η
    οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    1250/96
  type: main
