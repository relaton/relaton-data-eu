title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3820/81 of 23 December 1981 derogating in
    respect of the countries which have signed the Cartagena Agreement (Andean Group)
    from Articles 1, 6 and 12 of Regulation (EEC) No 3817/81 on the definition of
    the concept of originating products for purposes of the application of tariff
    preferences granted by the European Economic Community in respect of certain products
    from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3820/81 de la Commission, du 23 décembre 1981, portant
    dérogation, pour les pays ayant signé l' accord de Carthagène (Groupe andin),
    aux articles 1er, 6 et 12 du règlement (CEE) n° 3817/81 relatif à la définition
    de la notion de produits originaires pour l' application de préférences tarifaires
    accordées par la Communauté économique européenne à certains produits de
    pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3820/81 der Kommission vom 23. Dezember 1981 über
    die zugunsten der Länder, die das Abkommen von Cartagena unterzeichnet haben
    (Anden-Gruppe), vorgesehene Abweichung von den Artikeln 1, 6 und 12 der Verordnung
    (EWG) Nr. 3817/81 über die Begriffsbestimmung des Warenursprungs bei der Anwendung
    der von der Europäischen Wirtschaftsgemeinshaft für bestimmte Waren aus Entwicklungsländern
    gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3820/81 af 23. december 1981 om undtagelse
    for de lande, der har tiltrådt Cartagena-overenskomsten (ANDEAN), fra artikel
    1, 6 og 12 i forordning (EØF) nr. 3817/81 om definitionen af begrebet varer med
    oprindelsesstatus til brug ved anvendelsen af de toldpræferencer, der af Det
    europæiske økonomiske Fællesskab indrømmes visse varer fra udviklingslande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3820/81 τής Επιτροπής
    τής 23ης Δεκεμβρίου 1981 περί παρεκκλίσεως, όσον
    αφορά τίς χώρες πού έχουν υπογράψει τή συμφωνία
    τής Cartagena (συγκρότημα Ανδενών), από τά άρθρα
    1, 6 καί 12 τού κανονισμού (EOK) αριθ. 3817/81 περί τού
    ορισμού τής εννοίας τών καταγομένων προϊόντων
    γιά τήν εφαρμογή τών δασμολογικών προτιμήσεων
    πού παρέχονται από τήν Ευρωπαϊκή Οικονομική
    Κοινότητα σέ ορισμένα προϊόντα αναπτυσσομένων
    χωρών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3820/81 della Commissione, del 23 dicembre 1981, che
    deroga, a favore dei paesi firmatari dell' accordo di Cartagena (gruppo andino),
    agli articoli 1, 6 e 12 del regolamento (CEE) n. 3817/81 relativo alla definizione
    della nozione di prodotti originari per l' applicazione delle preferenze tariffarie
    accordate dalla Comunità economica europea a taluni prodotti dei paesi in via
    di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3820/81 van de Commissie van 23 december 1981 houdende
    afwijking voor de landen die de Overeenkomst van Carthagena (Andesgroep) ondertekend
    hebben van de artikelen 1, 6 en 12 van Verordening (EEG) nr. 3817/81 betreffende
    de definitie van het begrip ,,produkten van oorsprong' ' voor de toepassing van
    de door de Europese Economische Gemeenschap voor bepaalde produkten uit ontwikkelingslanden
