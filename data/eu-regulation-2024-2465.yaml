---
id: EURegulation20242465
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2465 of 10 September 2024
    amending Regulations concerning restrictive measures and setting out a single
    list for the Annexes to those Regulations containing the contact details of Member
    States’ competent authorities and the address for notifications to the European
    Commission
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2465 de la Commission du 10 septembre
    2024 modifiant les règlements relatifs à des mesures restrictives et établissant
    pour les annexes de ces règlements une liste unique contenant les coordonnées
    des autorités compétentes des États membres et l’adresse à utiliser pour
    les notifications à la Commission européenne
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2465 der Kommission vom 10. September
    2024 zur Änderung bestimmter Verordnungen über restriktive Maßnahmen und zur
    Festlegung einer einzigen Liste der Anhänge dieser Verordnungen mit den Kontaktdaten
    der zuständigen Behörden der Mitgliedstaaten und der Anschrift für Notifikationen
    an die Europäische Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/2465 на Комисията
    от 10 септември 2024 година за изменение на регламентите
    за ограничителни мерки и установяване на единен
    списък за приложенията към тези регламенти,
    съдържащ данните за връзка с компетентните
    органи на държавите членки, и на адреса за изпращане
    на уведомления до Европейската комисия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/2465 ze dne 10. září 2024,
    kterým se mění nařízení týkající se omezujících opatření a stanoví
    jednotný seznam pro přílohy těchto nařízení obsahující kontaktní údaje
    příslušných orgánů členských států a adresu pro účely oznamování
    Evropské komisi
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/2465 af 10. september
    2024 om ændring af forordninger om restriktive foranstaltninger og om fastlæggelse
    af en enkelt liste med henblik på bilagene til disse forordninger med kontaktoplysninger
    om medlemsstaternes kompetente myndigheder og den adresse, der benyttes til at
    underrette Europa-Kommissionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/2465 της Επιτροπής,
    της 10ης Σεπτεμβρίου 2024, για την τροποποίηση
    κανονισμών που αφορούν περιοριστικά μέτρα
    και για την κατάρτιση ενιαίου καταλόγου για
    τα παραρτήματα των κανονισμών αυτών που περιέχουν
    τα στοιχεία επικοινωνίας των αρμόδιων αρχών
    των κρατών μελών και τη διεύθυνση για κοινοποιήσεις
    προς την Ευρωπαϊκή Επιτροπή
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/2465, 10. september 2024, millega
    muudetakse piiravaid meetmeid käsitlevaid määrusi ja kehtestatakse nimetatud
    määruste lisades esitamiseks ühtne loetelu, mis sisaldab liikmesriikide pädevate
    ametiasutuste kontaktandmeid ja aadressi teadete saatmiseks Euroopa Komisjonile
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/2465, annettu 10 päivänä
    syyskuuta 2024, rajoittavista toimenpiteistä annettujen asetusten muuttamisesta
    sekä jäsenvaltioiden toimivaltaisten viranomaisten yhteystiedot ja Euroopan
    komissiolle ilmoittamista varten tarkoitetun osoitteen sisältävien kyseisten
    asetusten liitteiden korvaamisesta yhdellä ainoalla luettelolla
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/2465 ón gCoimisiún an 10 Meán
    Fómhair 2024 lena leasaítear Rialacháin a bhaineann le bearta sriantacha agus
    lena leagtar amach liosta aonair le haghaidh na nIarscríbhinní a ghabhann leis
    na Rialacháin sin ina bhfuil sonraí teagmhála údaráis inniúla na mBallstát
    agus an seoladh le haghaidh fógraí chuig an gCoimisiún Eorpach
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/2465 оd 10. rujna 2024. o izmjeni
    određenih uredaba o mjerama ograničavanja i utvrđivanju jedinstvenog popisa
    za priloge tim uredbama koji sadržavaju podatke za kontakt nadležnih tijela
    država članica i adresu za slanje obavijesti Europskoj komisiji
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/2465 végrehajtási rendelete (2024. szeptember
    10.) a korlátozó intézkedésekről szóló rendeletek módosításáról, valamint
    az illetékes tagállami hatóságok elérhetőségét és az Európai Bizottság
    értesítési címét tartalmazó mellékletek egységes jegyzékének meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/2465 della Commissione, del 10 settembre
    2024, che modifica i regolamenti concernenti misure restrittive e stabilisce un
    elenco unico per gli allegati di tali regolamenti contenente gli estremi delle
    autorità competenti degli Stati membri e l’indirizzo per le notifiche alla
    Commissione europea
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/2465 (2024. gada 10. septembris),
    ar ko groza regulas par ierobežojošiem pasākumiem un izveido vienotu sarakstu
    minēto regulu pielikumiem, kurā iekļauta dalībvalstu kompetento iestāžu
    kontaktinformācija un adrese paziņojumu nosūtīšanai Eiropas Komisijai
  type: main
- language: lt
  script: Latn
  content: 2024 m. rugsėjo 10 d. Komisijos įgyvendinimo reglamentas (ES) 2024/2465,
    kuriuo iš dalies keičiami reglamentai dėl ribojamųjų priemonių ir kuriuo
    nustatomas tų reglamentų priedams bendras sąrašas, kuriame nurodomi valstybių
    narių kompetentingų institucijų kontaktiniai duomenys ir adresas, kuriuo Europos
    Komisijai siunčiami pranešimai
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/2465 tal-10
    ta’ Settembru 2024 li jemenda Regolamenti dwar miżuri restrittivi u li jistabbilixxi
    lista unika għall-Annessi ta’ dawk ir-Regolamenti li fihom id-dettalji ta’
    kuntatt tal-awtoritajiet kompetenti tal-Istati Membri u l-indirizz għan-notifiki
    lill-Kummissjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/2465 van de Commissie van 10 september
    2024 tot wijziging van verordeningen betreffende beperkende maatregelen en tot
    vaststelling van een enkele lijst voor de bijlagen bij die verordeningen die de
    contactgegevens van de bevoegde autoriteiten van de lidstaten en de adressen voor
    de kennisgevingen aan de Europese Commissie bevatten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/2465 z dnia 10 września 2024
    r. zmieniające rozporządzenia dotyczące środków ograniczających i ustanawiające
    jednolity wykaz do celów załączników do tych rozporządzeń zawierający dane
    kontaktowe właściwych organów państw członkowskich oraz adres, na który
    należy przesyłać powiadomienia skierowane do Komisji Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/2465 da Comissão, de 10 de setembro
    de 2024, que altera regulamentos que impõem medidas restritivas e estabelece
    uma lista única dos anexos desses regulamentos que contêm os dados de contacto
    das autoridades competentes dos Estados-Membros e o endereço para o envio de
    notificações à Comissão Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/2465 al Comisiei din 10 septembrie
    2024 de modificare a regulamentelor privind măsuri restrictive și de stabilire
    a unei liste unice pentru anexele la regulamentele respective care conțin datele
    de contact ale autorităților competente ale statelor membre și adresa pentru
    notificările către Comisia Europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/2465 z 10. septembra 2024, ktorým
    sa menia nariadenia o reštriktívnych opatreniach a ktorým sa stanovuje jednotný
    zoznam na účely príloh k uvedeným nariadeniam, ktorý obsahuje kontaktné
    údaje príslušných orgánov členských štátov a adresu na zasielanie oznámení
    Európskej komisii
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/2465 z dne 10. septembra 2024 o spremembi
    uredb o omejevalnih ukrepih in določitvi enotnega seznama za priloge k zadevnim
    uredbam, ki vsebujejo kontaktne podatke pristojnih organov držav članic in naslov
    za pošiljanje uradnih obvestil Evropski komisiji
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/2465 de la Comisión, de 10 de septiembre
    de 2024, por el que se modifican los Reglamentos relativos a medidas restrictivas
    y se establece una lista única para los anexos de dichos Reglamentos con información
    de contacto de las autoridades competentes de los Estados miembros y dirección
    para las notificaciones a la Comisión Europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/2465 av den 10 september
    2024 om ändring av förordningar om restriktiva åtgärder och fastställande
    av en samlad förteckning för bilagorna till de förordningarna med kontaktuppgifter
    till medlemsstaternas behöriga myndigheter och adressen för anmälningar till
    Europeiska kommissionen
  type: main
