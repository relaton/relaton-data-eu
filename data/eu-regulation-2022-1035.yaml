title:
- language: en
  script: Latn
  content: Regulation (EU) 2022/1035 of the European Parliament and of the Council
    of 29 June 2022 amending Regulation (EU) 2021/954 on a framework for the issuance,
    verification and acceptance of interoperable COVID-19 vaccination, test and recovery
    certificates (EU Digital COVID Certificate) with regard to third-country nationals
    legally staying or residing in the territories of Member States during the COVID-19
    pandemic
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2022/1035 du Parlement européen et du Conseil du 29 juin
    2022 modifiant le règlement (UE) 2021/954 relatif à un cadre pour la délivrance,
    la vérification et l’acceptation de certificats COVID-19 interopérables de
    vaccination, de test et de rétablissement (certificat COVID numérique de l’UE)
    destinés aux ressortissants de pays tiers séjournant ou résidant légalement
    sur le territoire des États membres pendant la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2022/1035 des Europäischen Parlaments und des Rates vom
    29. Juni 2022 zur Änderung der Verordnung (EU) 2021/954 über einen Rahmen für
    die Ausstellung, Überprüfung und Anerkennung interoperabler Zertifikate zur
    Bescheinigung von COVID-19-Impfungen und -Tests sowie der Genesung von einer COVID-19-Infektion
    (digitales COVID-Zertifikat der EU) für Drittstaatsangehörige mit rechtmäßigem
    Aufenthalt oder Wohnsitz im Hoheitsgebiet der Mitgliedstaaten während der COVID-19-Pandemie
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2022/1035 на Европейския парламент
    и на Съвета от 29 юни 2022 година за изменение
    на Регламент (ЕС) 2021/954 относно рамка за издаването,
    проверката и приемането на оперативно съвместими
    сертификати за ваксинация срещу, направено
    изследване за и преболедуване на COVID-19 (Цифров
    COVID сертификат на ЕС) за граждани на трети държави,
    които са в законен престой или пребивават законно
    на територията на държавите членки, по време
    на пандемията от COVID-19
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2022/1035 ze dne 29. června
    2022, kterým se mění nařízení (EU) 2021/954 o rámci pro vydávání, ověřování
    a uznávání interoperabilních certifikátů o očkování, o testu a o zotavení
    v souvislosti s onemocněním COVID-19 (digitální certifikát EU COVID) ve vztahu
    ke státním příslušníkům třetích zemí s oprávněným pobytem nebo bydlištěm
    na území členských států během pandemie COVID-19
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2022/1035 af 29. juni 2022
    om ændring af Europa-Parlamentets og Rådets forordning (EU) 2021/954 om en ramme
    for udstedelse, kontrol og accept af interoperable covid-19-vaccinations-, test-
    og restitutionscertifikater (EU's digitale covidcertifikat) for så vidt angår
    tredjelandsstatsborgere, der lovligt opholder sig eller bor på medlemsstaternes
    område under covid-19-pandemien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2022/1035 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 29ης Ιουνίου 2022 για την
