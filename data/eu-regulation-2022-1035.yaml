    COVID-19 vaktsineerimis-, testimis- ja läbipõdemistõendite (ELi digitaalne
    COVID-tõend) väljaandmise, kontrollimise ja aktsepteerimise raamistik seoses
    kolmandate riikide kodanikega, kes seaduslikult viibivad või elavad COVID-19
    pandeemia ajal liikmesriikide territooriumil
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2022/1035, annettu 29 päivänä
    kesäkuuta 2022, kehyksestä covid-19-tautiin liittyvien yhteentoimivien rokotusta,
    testausta ja taudista parantumista koskevien todistusten (EU:n digitaalinen koronatodistus)
    myöntämiseksi jäsenvaltioiden alueella laillisesti oleskeleville tai asuville
    kolmansien maiden kansalaisille covid-19-pandemian aikana sekä kyseisten todistusten
    todentamiseksi ja hyväksymiseksi annetun asetuksen (EU) 2021/954 muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2022/1035 ó Pharlaimint na hEorpa agus ón gComhairle
    an 29 Meitheamh 2022 lena leasaítear Rialachán (AE) 2021/954 maidir le creat
    chun deimhnithe idir-inoibritheacha COVID-19 i ndáil le vacsaíniú, tástáil
    agus téarnamh (Deimhniú Digiteach COVID-19 AE) a eisiúint maidir le náisiúnaigh
    tríú tír atá ag fanacht go dleathach nó a bhfuil cónaí orthu go dleathach
    ar chríocha na mBallstát le linn phaindéim COVID-19 agus chun iad a fhíorú,
    agus chun go nglacfaí leo
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2022/1035 Europskog parlamenta i Vijeća od 29. lipnja 2022.
    o izmjeni Uredbe (EU) 2021/954 o okviru za izdavanje, provjeru i prihvaćanje
    interoperabilnih potvrda o cijepljenju, testiranju i preboljenju bolesti COVID-19
    (EU digitalna COVID potvrda) u pogledu državljana trećih zemalja koji se zakonito
    nalaze ili borave na državnom području država članica tijekom pandemije bolesti
    COVID-19
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2022/1035 rendelete (2022. június
    29.) a Covid19-világjárvány idején a tagállamok területein jogszerűen tartózkodó
    vagy lakóhellyel rendelkező harmadik országbeli állampolgárok tekintetében
    interoperábilis, Covid19-oltásra, tesztre és gyógyultságra vonatkozó igazolványok
    (uniós digitális Covid-igazolvány) kiállításának, ellenőrzésének és
    elfogadásának keretéről szóló (EU) 2021/954 rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2022/1035 del Parlamento europeo e del Consiglio del 29
    giugno 2022 che modifica il regolamento (UE) 2021/954 su un quadro per il rilascio,
    la verifica e l'accettazione di certificati interoperabili di vaccinazione, di
    test e di guarigione in relazione alla COVID-19 (certificato COVID digitale dell'UE)
    per i cittadini di paesi terzi regolarmente soggiornanti o residenti nel territorio
    degli Stati membri durante la pandemia di COVID-19
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2022/1035 (2022. gada 29. jūnijs),
    ar ko groza Regulu (ES) 2021/954 par sadarbspējīgu Covid-19 vakcinācijas, testa
    un pārslimošanas sertifikātu (ES digitālais Covid sertifikāts) izdošanas,
    verifikācijas un akceptēšanas satvaru attiecībā uz trešo valstu valstspiederīgajiem,
    kas Covid-19 pandēmijas laikā likumīgi uzturas vai dzīvo dalībvalstu teritorijā
  type: main
- language: lt
  script: Latn
  content: Europos Parlamento ir Tarybos reglamentas (ES) 2022/1035 2022 m. birželio
    29 d. kuriuo iš dalies keičiamas Reglamentas (ES) 2021/954 dėl sąveikiųjų
    COVID-19 skiepijimo, tyrimo ir persirgimo pažymėjimų (ES skaitmeninio COVID
    pažymėjimo), skirtų trečiųjų valstybių piliečiams, teisėtai esantiems
    arba gyvenantiems valstybių narių teritorijose, išdavimo, tikrinimo ir pripažinimo
    COVID-19 pandemijos metu sistemos
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2022/1035 tal-Parlament Ewropew u tal-Kunsill tad-29 ta’
    Ġunju 2022 li jemenda r-Regolament (UE) 2021/954 dwar qafas għall-ħruġ, għall-verifika
    u għall-aċċettazzjoni ta’ ċertifikati COVID-19 interoperabbli tat-tilqim,
    tat-testijiet u tal-fejqan (Ċertifikat COVID Diġitali tal-UE) fir-rigward ta’
    ċittadini ta’ pajjiżi terzi li joqogħdu jew jirrisjedu legalment fit-territorji
    tal-Istati Membri matul il-pandemija tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2022/1035 van het Europees Parlement en de Raad van 29
    juni 2022 tot wijziging van Verordening (EU) 2021/954 betreffende een kader voor
    de afgifte, verificatie en aanvaarding van interoperabele COVID-19-vaccinatie-,
    test- en herstelcertificaten (digitaal EU-COVID-certificaat) ten aanzien van onderdanen
    van derde landen die legaal op het grondgebied van de lidstaten verblijven of
    wonen tijdens de COVID-19-pandemie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2022/1035 z dnia 29
    czerwca 2022 r. dotyczące zmiany rozporządzenia (UE) 2021/954 w sprawie ram
    wydawania obywatelom państw trzecich legalnie przebywającym lub zamieszkującym
    na terytoriach państw członkowskich w czasie pandemii COVID-19 interoperacyjnych
    zaświadczeń o szczepieniu, o wyniku testu i o powrocie do zdrowia w związku
    z COVID-19 (unijne cyfrowe zaświadczenie COVID), oraz weryfikowania i uznawania
    takich zaświadczeń
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2022/1035 do Parlamento Europeu e do Conselho de 29 de
    junho de 2022 que altera o Regulamento (UE) 2021/954 relativo a um regime para
    a emissão, verificação e aceitação de certificados interoperáveis de vacinação,
    teste e recuperação da COVID-19 (Certificado Digital COVID da UE) no que respeita
    a nacionais de países terceiros que permaneçam ou residam no território dos
    Estados-Membros durante a pandemia de COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2022/1035 al Parlamentului European și al Consiliului
    din 29 iunie 2022 de modificare a Regulamentului (UE) 2021/954 privind cadrul
    pentru eliberarea, verificarea și acceptarea certificatelor interoperabile de
    vaccinare, testare și vindecare de COVID-19 (certificatul digital al UE privind
    COVID) referitor la resortisanții țărilor terțe aflați în situație de ședere
    legală sau care au reședință legală pe teritoriul statelor membre, pe durata
    pandemiei de COVID-19
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2022/1035 z 29. júna 2022,
    ktorým sa mení nariadenie (EÚ) 2021/954 o rámci pre vydávanie, overovanie
    a uznávanie interoperabilných potvrdení o očkovaní proti ochoreniu COVID-19,
    o vykonaní testu a prekonaní tohto ochorenia (digitálny COVID preukaz EÚ),
    pokiaľ ide o štátnych príslušníkov tretích krajín, ktorí sa oprávnene
    zdržiavajú na území členských štátov alebo v nich majú oprávnený pobyt,
    počas pandémie ochorenia COVID-19
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2022/1035 Evropskega parlamenta in Sveta z dne 29. junija 2022
    o spremembi Uredbe (EU) 2021/954 o okviru za izdajanje, preverjanje in priznavanje
    interoperabilnih potrdil o cepljenju, testu in preboleli bolezni v zvezi s COVID-19
    (digitalno COVID potrdilo EU) v zvezi z državljani tretjih držav, ki se zakonito
    nahajajo ali prebivajo na ozemlju držav članic med pandemijo COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2022/1035 del Parlamento Europeo y del Consejo de 29 de
    junio de 2022 por el que se modifica el Reglamento (UE) 2021/954, relativo a un
    marco para la expedición, verificación y aceptación de certificados COVID-19
    interoperables de vacunación, de prueba diagnóstica y de recuperación (certificado
    COVID digital de la UE) con respecto a los nacionales de terceros países que
    se encuentren o residan legalmente en los territorios de los Estados miembros
    durante la pandemia de COVID-19
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2022/1035 av den 29 juni
    2022 om ändring av förordning (EU) 2021/954 om en ram för utfärdande, kontroll
    och godtagande av interoperabla intyg om vaccination mot, testning för och tillfrisknande
    från covid-19 (EU:s digitala covidintyg) för tredjelandsmedborgare som lagligen
    vistas eller är bosatta på medlemsstaternas territorier under covid-19-pandemin
