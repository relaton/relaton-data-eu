    την αποδοχή διαλειτουργικών πιστοποιητικών
    εμβολιασμού κατά της COVID-19, διαγνωστικού της
    ελέγχου και ανάρρωσης από αυτή (Ψηφιακό Πιστοποιητικό
    COVID της ΕΕ) όσον αφορά υπηκόους τρίτων χωρών
    που παραμένουν ή διαμένουν νόμιμα στις επικράτειες
    κρατών μελών κατά τη διάρκεια της πανδημίας
    της COVID-19
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2022/1035, 29. juuni 2022,
