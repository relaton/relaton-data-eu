title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 décembre 1971, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    la "Bundesanstalt für Arbeit"
  type: main
- language: de
  script: Latn
  content: '72/76/EWG: Entscheidung der Kommission vom 23. Dezember 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für von der Bundesanstalt für Arbeit durchgeführte
    Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/76/CEE: Decisione della Commissione, del 23 dicembre 1971, che concede
    un contributo del Fondo sociale europeo alla Repubblica federale di Germania per
    spese concernenti operazioni di riqualificazione professionale effettuate dalla
    « Bundesanstalt für Arbeit»'
  type: main
- language: nl
  script: Latn
  content: '72/76/EEG: Beschikking van de Commissie van 23 december 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Bondsrepubliek
    Duitsland voor door de "Bundesanstalt für Arbeit" gemaakte herscholingskosten'
