  script: Latn
  content: '2007/680/EC: Commission Decision of 22 October 2007 amending Decision
    2006/410/EC, setting the amounts which, pursuant to Articles 10(2), 143d and 143e
    of Council Regulation (EC) No 1782/2003, are made available to the EAFRD and the
    amounts available for EAGF expenditure, and Decision 2006/636/EC fixing the annual
    breakdown by Member State for Community support to rural development for the period
    from 1 January 2007 to 31 December 2013 (notified under document number C(2007)
    5106)'
  type: main
- language: fr
  script: Latn
  content: '2007/680/CE: Décision de la Commission du 22 octobre 2007 modifiant la
    décision 2006/410/CE fixant les montants qui, en application de l'' article 10,
    paragraphe 2, de l''article 143 quinquies et de l''article 143 sexies du règlement
    (CE) n° 1782/2003 du Conseil, sont mis à la disposition du Feader et les montants
    qui sont mis à la disposition du FEAGA, et la décision 2006/636/CE fixant, par
    État membre, la ventilation annuelle du soutien communautaire en faveur du développement
    rural pour la période allant du 1 er janvier 2007 au 31 décembre 2013 [notifiée
    sous le numéro C(2007) 5106]'
  type: main
