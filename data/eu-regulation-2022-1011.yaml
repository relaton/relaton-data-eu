    olevan vieraan tai oman pääoman ehtoisen rahoitusvälineen on laskenut liikkeeseen
    kyseinen asiakas
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/1011 ón gCoimisiún an 10 Márta 2022
    lena bhforlíontar Rialachán (AE) Uimh. 575/2013 ó Pharlaimint na hEorpa agus
    ón gComhairle maidir le caighdeáin theicniúla rialála lena sonraítear an
    chaoi a gcinnfear na neamhchosaintí indíreacha ar chliant ó dhíorthacha agus
    ó chonarthaí díorthach creidmheasa i gcás nach ndearnadh an conradh go díreach
    leis an gcliant ach gur eisigh an cliant sin an ionstraim fholuiteach fiachais
    nó chothromais
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1011 оd 10. ožujka 2022. o dopuni
    Uredbe (EU) br. 575/2013 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda kojima se pobliže određuje način utvrđivanja neizravnih
    izloženosti prema jednoj osobi koje proizlaze iz ugovora o izvedenicama i ugovora
    o kreditnim izvedenicama ako ugovor nije izravno sklopljen s jednom osobom, nego
    je ta osoba izdala odnosni dužnički ili vlasnički instrument
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1011 felhatalmazáson alapuló rendelete (2022.
    március 10.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek az intézmény
    által nem közvetlenül az ügyféllel kötött, de alapul szolgáló termékként
    az ügyfél által kibocsátott, hitelviszonyt vagy tulajdoni részesedést megtestesítő
    instrumentummal rendelkező származtatott ügyletekből és hitelderivatíva-ügyletekből
    eredő, ügyféllel szembeni közvetett kitettségek meghatározásának módját
    megállapító szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/1011 della Commissione del 10 marzo 2022
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano le modalità
    di determinazione delle esposizioni indirette verso un cliente derivanti da contratti
    derivati e contratti derivati su crediti, laddove il contratto non sia stato stipulato
    direttamente con il cliente ma lo strumento di debito o di capitale sottostante
    sia stato emesso da tale cliente
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/1011 (2022. gada 10. marts), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 575/2013 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizē, kā noteikt netiešos
    riska darījumus ar klientu, kuri izriet no atvasināto instrumentu un kredītu
    atvasināto instrumentu līgumiem, ja līgums nav tieši noslēgts ar klientu,
    bet attiecīgais klients ir emitējis pamatā esošo parāda vai pašu kapitāla
    instrumentu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/1011 2022 m. kovo 10 d. kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas techniniais
    reguliavimo standartais, kuriais nustatoma, kaip nustatyti netiesiogines kliento
    pozicijas, susidarančias dėl išvestinių finansinių priemonių sandorių ir
    kredito išvestinių finansinių priemonių sutarčių, dėl kurių su tuo klientu
    nėra susitarta tiesiogiai, bet kurių pagrindinė skolos arba nuosavybės priemonė
    yra išleista to kliento
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/1011 tal-10 ta’ Marzu 2022
    li jissupplimenta r-Regolament (UE) Nru 575/2013 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw kif jiġu ddeterminati
    l-iskoperturi indiretti għal klijent li jirriżultaw minn kuntratti ta’ derivattivi
    u derivattivi ta’ kreditu meta l-kuntratt ma jkunx sar direttament mal-klijent
    iżda l-istrument sottostanti ta’ dejn jew ekwità jkun inħareġ minn dak il-klijent
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/1011 van de Commissie van 10 maart 2022
    tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement en
    de Raad met betrekking tot technische reguleringsnormen om te bepalen hoe de indirecte
    blootstellingen met betrekking tot een cliënt ten gevolge van derivaten- en kredietderivatencontracten
    moeten worden bepaald indien het contract niet rechtstreeks met de cliënt is
    gesloten maar het onderliggende schuld- of aandeleninstrument door die cliënt
    is uitgegeven
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/1011 z dnia 10 marca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 575/2013
    w odniesieniu do regulacyjnych standardów technicznych określających sposób
    ustalania ekspozycji pośrednich wobec klienta wynikających z kontraktów na
    instrumenty pochodne i na kredytowe instrumenty pochodne w przypadku, gdy kontrakt
    nie został zawarty bezpośrednio z klientem, lecz instrument dłużny lub kapitałowy
    będący instrumentem bazowym został wyemitowany przez tego klienta
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/1011 da Comissão de 10 de março de 2022
    que complementa o Regulamento (UE) n.o 575/2013do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação que especificam o
    modo como determinar as exposições indiretas sobre um cliente decorrentes de
    contratos de derivados e de derivados de crédito nos casos em que o contrato
    não foi diretamente celebrado com o cliente, mas o instrumento de dívida ou
    de capital próprio subjacente foi emitido por esse cliente
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/1011 al Comisiei din 10 martie 2022 de completare
    a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează modul
    de determinare a expunerilor indirecte față de un client care provin din contracte
    derivate și contracte derivate de credit, atunci când contractele nu sunt încheiate
    direct cu respectivul client, dar instrumentul de datorie sau de capital suport
    a fost emis de clientul respectiv
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/1011 z 10. marca 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa stanovuje, ako určiť nepriame
    expozície voči klientovi vyplývajúce zo zmlúv o derivátoch a zo zmlúv o
    kreditných derivátoch, ak táto zmluva nie je priamo uzatvorená s daným klientom,
    ale daný klient emitoval podkladový dlhový alebo kapitálový nástroj
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/1011 z dne 10. marca 2022 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi o načinu določitev posrednih izpostavljenosti do stranke,
    ki izhajajo iz pogodb o izvedenih finančnih instrumentih in pogodb o kreditnih
    izvedenih finančnih instrumentih, če pogodba ni bila sklenjena neposredno s
    stranko, vendar je ta stranka izdala osnovni dolžniški ali lastniški instrument
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1011 de la Comisión de 10 de marzo de 2022
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    cómo determinar las exposiciones indirectas frente a un cliente resultantes de
    contratos de derivados y de contratos de derivados de crédito que no se hayan
    suscrito directamente con dicho cliente, pero cuyo instrumento de deuda o de renta
    variable subyacente haya sido emitido por dicho cliente
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1011 av den 10 mars 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska tillsynsstandarder för att specificera hur man ska fastställa
    indirekta exponeringar mot en kund som följer av derivatkontrakt och kreditderivatkontrakt
    om kontraktet inte ingåtts direkt med kunden men ligger till grund för det underliggande
    skuld- eller aktieinstrument som emitterats av den kunden
