    regulatiivsete tehniliste standarditega, millega täpsustatakse, kuidas määrata
    kindlaks tuletislepingutest ja krediidituletisinstrumentide lepingutest tulenevad
    kaudsed riskipositsioonid kliendi suhtes, kui leping ei ole sõlmitud otse kliendiga,
    kuid selle aluseks oleva võla- või kapitaliinstrumendi on emiteerinud asjaomane
    klient
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/1011, annettu 10 päivänä maaliskuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 575/2013 täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään, miten määritetään
    johdannais- ja luottojohdannaissopimuksista johtuvat asiakkaaseen liittyvät välilliset
