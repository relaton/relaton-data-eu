title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1011 of 10 March 2022 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying how to determine the indirect
    exposures to a client arising from derivatives and credit derivatives contracts
    where the contract was not directly entered into with the client but the underlying
    debt or equity instrument was issued by that client
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1011 de la Commission du 10 mars 2022 complétant
    le règlement (UE) no 575/2013 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant comment déterminer les expositions indirectes
    sur un client découlant de contrats dérivés et de contrats dérivés de crédit
    qui n’ont pas été directement conclus avec ce client mais dont le titre de
    créance ou l’instrument de fonds propres sous-jacent a été émis par ce client
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1011 der Kommission vom 10. März 2022
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates im Hinblick auf technische Regulierungsstandards zur Festlegung, wie
    die indirekten Risikopositionen gegenüber einem Kunden aus Derivatkontrakten
    und aus Kreditderivatkontrakten zu ermitteln sind, wenn der Kontrakt nicht direkt
    mit dem Kunden abgeschlossen wurde, jedoch der zugrunde liegende Schuldtitel oder
    das zugrunde liegende Eigenkapitalinstrument von diesem Kunden begeben wurde
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/1011 на Комисията
    от 10 март 2022 година за допълнение на Регламент
    (ЕС) № 575/2013 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на непреките експозиции към
    клиент, произтичащи от договори за деривати
    и за кредитни деривати, когато даденият договор
    не е бил сключен пряко с клиента, но базовият
    дългов или капиталов инструмент е бил емитиран
    от този клиент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/1011 ze dne 10. března
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    575/2013, pokud jde o regulační technické normy upřesňující, jak určit
    nepřímé expozice vůči klientovi vzniklé na základě derivátových smluv
    a smluv o úvěrových derivátech, pokud smlouva nebyla přímo uzavřena s tímto
    klientem, avšak slouží jako podklad dluhového nebo akciového nástroje vydaného
    tímto klientem
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/1011 af 10. marts 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer,
    hvordan de indirekte eksponeringer mod en kunde, der opstår som følge af derivat-
    og kreditderivatkontrakter, hvis kontrakten ikke er indgået direkte med kunden,
    men det underliggende gælds- eller aktieinstrument er udstedt af den pågældende
    kunde, skal fastlægges
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/1011
    της Επιτροπής της 10ης Μαρτίου 2022 για τη συμπλήρωση
