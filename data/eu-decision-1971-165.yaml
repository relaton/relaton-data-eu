title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 29 mars 1971, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure du traitement
    communautaire les tissus de coton autres qu'à point de gaze ou boucles du genre
    éponge, teints, de la position Ex 55.09 du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/165/EWG: Entscheidung der Kommission vom 29. März 1971, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die aus Japan stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Gewebe aus Baumwolle, andere als Drehergewebe oder
    Schlingengewebe (Frottiergewebe), gefärbt, der Tarifnummer ex 55.09 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/165/CEE: Decisione della Commissione, del 29 marzo 1971, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    a escludere dal trattamento comunitario i tessuti di cotone diversi da quelli
    a punto di garza o ricci del tipo spugna, tinti, della voce ex 55.09 della tariffa
    doganale comune, originari del Giappone e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/165/EEG: Beschikking van de Commissie van 29 maart 1971 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd weefsels van katoen, andere dan met gaasbinding en andere dan
    badof frotteerstof (lussendoek), geverfd, van post ex 55.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
