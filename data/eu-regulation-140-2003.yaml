  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 140/2003 av den 27 januari 2003 om i
    vilken utsträckning ansökningar om importlicenser inlämnade under januari 2003
    för de tilläggskvoter för nötkött som föreskrivs i förordning (EG) nr 1279/98
