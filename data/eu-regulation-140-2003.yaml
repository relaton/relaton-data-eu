title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 140/2003 of 27 January 2003 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in January 2003 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 140/2003 de la Commission du 27 janvier 2003 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 2003 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1279/98 pour la République de Pologne, la
    République de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 140/2003 der Kommission vom 27. Januar 2003 zur Bestimmung
    des Prozentsatzes, zu dem den im Januar 2003 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß der Verordnung
    (EG) Nr. 1279/98 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 140/2003 af 27. januar 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i januar 2003 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 1279/98 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 140/2003 της Επιτροπής,
    της 27ης Ιανουαρίου 2003, για καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιανουάριο του 2003 για τις συμπληρωματικές
    δασμολογικές ποσοστώσεις βοείου κρέατος που
    προβλέπονται από τον κανονισμό (ΕΚ) αριθ. 1279/98
    για την Πολωνία, τη Δημοκρατία της Ουγγαρίας,
    την Τσεχική Δημοκρατία, τη Σλοβακία, τη Βουλγαρία
    και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 140/2003, annettu 27 päivänä tammikuuta 2003,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    tammikuussa 2003 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 140/2003 della Commissione, del 27 gennaio 2003, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di gennaio 2003 per i contingenti tariffari supplementari
    di carni bovine previsti dal regolamento (CE) n. 1279/98 per la Repubblica di
    Polonia, la Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Bulgaria
    e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 140/2003 van de Commissie van 27 januari 2003 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in januari 2003
    ingediende aanvragen om invoercertificaten voor de tariefcontingenten voor rundvlees
    die bĳ Verordening (EG) nr. 1279/98 zĳn vastgesteld voor de Republiek Polen,
    de Republiek Hongarĳe, de Tsjechische Republiek, Slowakĳe, Bulgarĳe en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 140/2003 da Comissão, de 27 de Janeiro de 2003,
