    tal-1988 relatat mal-Konvenzjoni Internazzjonali dwar il-Linji tat-Tagħbija tal-1966
    (Protokoll tal-Linji tat-Tagħbija tal-1988)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2026/1029 van de Raad van 27 april 2026 over het namens de
    Europese Unie in te nemen standpunt tijdens de 84e zitting van de Commissie voor
    de bescherming van het mariene milieu van de Internationale Maritieme Organisatie
    over de vaststelling van wijzigingen van het Internationaal Verdrag ter voorkoming
    van verontreiniging door schepen (Marpol) en tijdens de 111e zitting van de Maritieme
    Veiligheidscommissie van de Internationale Maritieme Organisatie over de vaststelling
    van wijzigingen van het Internationaal Verdrag voor de beveiliging van mensenlevens
    op zee (Solas) van 1974, de Internationale Code voor de veiligheid van hogesnelheidsvaartuigen
    van 1994 (HSC-code 1994), de Internationale Code voor de veiligheid van hogesnelheidsvaartuigen
    van 2000 (HSC-code 2000), de Internationale code voor het uitgebreide inspectieprogramma
    bij inspecties van bulkschepen en olietankschepen van 2011 (ESP-code 2011), de
    Internationale code voor reddingsmiddelen (LSA-code) en het Protocol van 1988
    bij het Internationaal Verdrag betreffende de uitwatering van schepen van 1966
    (Uitwateringsprotocol 1988)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2026/1029 z dnia 27 kwietnia 2026 r. w sprawie stanowiska,
    które ma być zajęte w imieniu Unii Europejskiej na 84. posiedzeniu Komitetu
    Ochrony Środowiska Morskiego Międzynarodowej Organizacji Morskiej w odniesieniu
    do przyjęcia zmian w Międzynarodowej konwencji o zapobieganiu zanieczyszczaniu
    morza przez statki (MARPOL) oraz na 111. posiedzeniu Komitetu Bezpieczeństwa
    na Morzu Międzynarodowej Organizacji Morskiej w odniesieniu do przyjęcia zmian
    w Międzynarodowej konwencji o bezpieczeństwie życia na morzu (konwencja SOLAS)
    z 1974 r., Międzynarodowym kodeksie bezpieczeństwa jednostek szybkich z 1994
    r. (kodeks HSC z 1994 r.), Międzynarodowym kodeksie bezpieczeństwa jednostek
    szybkich z 2000 r. (kodeks HSC z 2000 r.), Międzynarodowym kodeksie rozszerzonego
    programu inspekcji podczas przeglądów masowców i zbiornikowców olejowych z
    2011 r. (kodeks ESP z 2011 r.), Międzynarodowym kodeksie środków ratunkowych
    (kodeks LSA) oraz Protokole z 1988 r. do Międzynarodowej konwencji o liniach
    ładunkowych z 1966 r. (protokół z 1988 r. o liniach ładunkowych)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2026/1029 do Conselho, de 27 de abril de 2026, relativa à
    posição a tomar, em nome da União Europeia, no âmbito do Comité de Proteção
    do Meio Marinho da Organização Marítima Internacional, na sua 84.a sessão,
    no que respeita à adoção de alterações à Convenção Internacional para
    a Prevenção da Poluição por Navios (MARPOL), e no âmbito do Comité de Segurança
    Marítima da Organização Marítima Internacional, na sua 111.a sessão, no que
    respeita à adoção de alterações à Convenção Internacional para a Salvaguarda
    da Vida Humana no Mar (SOLAS), de 1974, ao Código Internacional de Segurança
    para Embarcações de Alta Velocidade, de 1994 (Código HSC de 1994), ao Código
    Internacional de Segurança para Embarcações de Alta Velocidade, de 2000 (Código
    HSC de 2000), ao Código Internacional para o Programa Reforçado de Inspeções
    no âmbito das vistorias a graneleiros e petroleiros, de 2011 (Código ESP de
    2011), ao Código Internacional dos Meios de Salvação (Código LSA), e ao Protocolo
    de 1988 relativo à Convenção Internacional das Linhas de Carga, de 1966 (Protocolo
    das Linhas de Carga de 1988)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2026/1029 a Consiliului din 27 aprilie 2026 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Organizației
    Maritime Internaționale cu ocazia celei de a 84-a sesiuni a Comitetului pentru
    protecția mediului marin în ceea ce privește adoptarea unor modificări la
    Convenția internațională pentru prevenirea poluării de către nave (MARPOL)
    și cu ocazia celei de a 111-a sesiuni a Comitetului pentru siguranță maritimă
    în ceea ce privește adoptarea unor modificări la Convenția internațională
    pentru ocrotirea vieții omenești pe mare (SOLAS) din 1974, la Codul internațional
    din 1994 pentru siguranța navelor de mare viteză (Codul HSC din 1994), la Codul
    internațional din 2000 pentru siguranța navelor de mare viteză (Codul HSC din
    2000), la Codul internațional din 2011 privind programul intensificat de inspecții
    efectuate cu ocazia inspecțiilor la vrachiere și petroliere (Codul ESP din 2011),
    la Codul internațional al mijloacelor de salvare (Codul LSA) și la Protocolul
    din 1988 referitor la Convenția internațională din 1966 privind liniile de
    încărcare (Protocolul din 1988 privind liniile de încărcare)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2026/1029 z 27. apríla 2026 o pozícii, ktorá
    sa má v mene Európskej únie zaujať vo Výbore pre ochranu morského prostredia
    Medzinárodnej námornej organizácie na jeho 84. zasadnutí, pokiaľ ide o prijatie
    zmien Medzinárodného dohovoru o zabránení znečisťovaniu z lodí (MARPOL),
    a vo Výbore pre námornú bezpečnosť Medzinárodnej námornej organizácie
    na jeho 111. zasadnutí, pokiaľ ide o prijatie zmien Medzinárodného dohovoru
    o bezpečnosti ľudského života na mori (SOLAS) z roku 1974, Medzinárodného
    kódexu pre bezpečnosť vysokorýchlostných plavidiel z roku 1994 (kódex HSC
    z roku 1994), Medzinárodného kódexu pre bezpečnosť vysokorýchlostných plavidiel
    z roku 2000 (kódex HSC z roku 2000), Medzinárodného kódexu programu rozšírených
    inšpekcií v rámci prehliadok lodí na hromadný náklad a ropných tankerov
    z roku 2011 (kódex ESP z roku 2011), Medzinárodného kódexu pre záchranné
    prostriedky (kódex LSA) a protokolu z roku 1988 k Medzinárodnému dohovoru o
    nákladovej značke z roku 1966 (protokol o nákladovej značke z roku 1988)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2026/1029 z dne 27. aprila 2026 o stališču, ki se v
    imenu Evropske unije zastopa v Odboru za varstvo morskega okolja Mednarodne pomorske
    organizacije na njegovem 84. zasedanju glede sprejetja sprememb Mednarodne konvencije
    o preprečevanju onesnaževanja morja z ladij (MARPOL) in v Odboru za pomorsko
    varnost Mednarodne pomorske organizacije na njegovem 111. zasedanju glede sprejetja
    sprememb Mednarodne konvencije o varstvu človeškega življenja na morju (SOLAS)
    iz leta 1974, Mednarodnega kodeksa o varnosti visokohitrostnih plovil iz leta
    1994 (kodeks HSC iz leta 1994), Mednarodnega kodeksa o varnosti visokohitrostnih
    plovil iz leta 2000 (kodeks HSC iz leta 2000), Mednarodnega kodeksa o okrepljenem
    programu inšpekcij med pregledi ladij za prevoz razsutega tovora in naftnih tankerjev
    iz leta 2011 (kodeks ESP iz leta 2011), Mednarodnega kodeksa o reševalni opremi
    (kodeks LSA) in Protokola iz leta 1988 k Mednarodni konvenciji o tovornih črtah
    iz leta 1966 (Protokol o tovornih črtah iz leta 1988)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2026/1029 del Consejo, de 27 de abril de 2026, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    de Protección del Medio Marino de la Organización Marítima Internacional durante
    su 84.° período de sesiones con respecto a la adopción de enmiendas al Convenio
    Internacional para Prevenir la Contaminación por los Buques (MARPOL) y en el
    Comité de Seguridad Marítima de la Organización Marítima Internacional durante
    su 111.° período de sesiones con respecto a la adopción de enmiendas al Convenio
    Internacional para la Seguridad de la Vida Humana en el Mar (SOLAS), 1974, al
    Código internacional de seguridad para naves de gran velocidad, 1994 (Código
    NGV 1994), al Código internacional de seguridad para naves de gran velocidad,
    2000 (Código NGV 2000), al Código internacional sobre el programa mejorado de
    inspecciones durante los reconocimientos de graneleros y petroleros, 2011 (Código
    ESP 2011), al Código internacional de dispositivos de salvamento (Código IDS)
    y al Protocolo de 1988 relativo al Convenio Internacional sobre Líneas de Carga,
    1966 (Protocolo sobre Líneas de Carga de 1988)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2026/1029 av den 27 april 2026 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationens
    kommitté för skydd av den marina miljön vid dess 84:e möte vad gäller antagandet
    av ändringar av den internationella konventionen till förhindrande av förorening
    från fartyg (Marpol) och i Internationella sjöfartsorganisationens sjösäkerhetskommitté
    vid dess 111:e möte vad gäller antagandet av ändringar av den internationella
    konventionen om säkerheten för människoliv till sjöss (Solas) från 1974,
    den internationella säkerhetskoden för höghastighetsfartyg från 1994 (1994
    års HSC-kod), den internationella säkerhetskoden för höghastighetsfartyg från
    2000 (2000 års HSC-kod), den internationella koden för det utökade programmet
    för inspektioner vid besiktning av bulkfartyg och oljetankfartyg från 2011 (2011
    års ESP-kod), den internationella koden för livräddningsutrustning (LSA-koden)
    samt av protokollet från 1988 om den internationella lastlinjekonventionen från
    1966 (1988 års lastlinjeprotokoll)
