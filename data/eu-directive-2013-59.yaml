title:
- language: en
  script: Latn
  content: Council Directive 2013/59/Euratom of 5 December 2013 laying down basic
    safety standards for protection against the dangers arising from exposure to ionising
    radiation, and repealing Directives 89/618/Euratom, 90/641/Euratom, 96/29/Euratom,
    97/43/Euratom and 2003/122/Euratom
  type: main
- language: fr
  script: Latn
  content: Directive 2013/59/Euratom du Conseil du 5 décembre 2013 fixant les normes
    de base relatives à la protection sanitaire contre les dangers résultant de
    l'exposition aux rayonnements ionisants et abrogeant les directives 89/618/Euratom,
    90/641/Euratom, 96/29/Euratom, 97/43/Euratom et 2003/122/Euratom
  type: main
- language: de
  script: Latn
  content: Richtlinie 2013/59/Euratom des Rates vom 5. Dezember 2013 zur Festlegung
    grundlegender Sicherheitsnormen für den Schutz vor den Gefahren einer Exposition
    gegenüber ionisierender Strahlung und zur Aufhebung der Richtlinien 89/618/Euratom,
    90/641/Euratom, 96/29/Euratom, 97/43/Euratom und 2003/122/Euratom
  type: main
