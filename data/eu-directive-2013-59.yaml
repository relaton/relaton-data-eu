    záření a zrušují se směrnice 89/618/Euratom, 90/641/Euratom, 96/29/Euratom,
    97/43/Euratom a 2003/122/Euratom
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2013/59/Euratom af 5. december 2013 om fastlæggelse af
