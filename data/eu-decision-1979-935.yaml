title:
- language: en
  script: Latn
  content: '79/935/EEC: Commission Decision of 22 October 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Federal Republic of Germany of expenditure
    incurred during 1978 in connection with Community measures for the eradication
    of brucellosis, tuberculosis and leucosis in cattle (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/935/CEE: Décision de la Commission, du 22 octobre 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République fédérale d''Allemagne des dépenses
    effectuées pendant l''année 1978 dans le cadre d''une action de la Communauté
    en vue de l''éradication de la brucellose, de la tuberculose et de la leucose
    des bovins (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/935/EWG: Entscheidung der Kommission vom 22. Oktober 1979 über die
    Erstattung der Ausgaben des Jahres 1978 für die Einführung von Maßnahmen der
    Gemeinschaft zur Tilgung der Brucellose, der Tuberkulose und der Leukose der Rinder
    an die Bundesrepublik Deutschland (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/935/EØF: Kommissionens beslutning af 22. oktober 1979 om refusion
    gennem EUGFL, udviklingssektionen, til Forbundsrepublikken Tyskland af udgifter
    afholdt i 1978 i forbindelse med en fællesskabsaktion med henblik på udryddelse
    af brucellose, tuberkulose og leukose hos kvæg (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/935/CEE: Decisione della Commissione, del 22 ottobre 1979, relativa
    al rimborso da parte del FEAOG, sezione orientamento, alla Repubblica federale
    di Germania delle spese effettuate nell''anno 1978 nel quadro di un''azione della
    Comunità per l''eradicazione della brucellosi, della tubercolosi e della leucosi
    dei bovini (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/935/EEG: Beschikking van de Commissie van 22 oktober 1979 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de Bondsrepubliek Duitsland
