    κατά την οποία η Πορτογαλία δύναται να αποστέλει
    ορισμένα ιπποειδή που προέρχονται από το μέρος
    του εδάφους της Πορτογαλίας το οποίο θεωρείται
    ότι έχει μολυνθεί από πανώλη των ίππων'
  type: main
- language: fi
  script: Latn
  content: '91/93/ETY: Komission päätös, tehty 11 päivänä helmikuuta 1991, siitä
