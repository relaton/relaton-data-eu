  script: Latn
  content: '91/93/EEC: Commission Decision of 11 February 1991 determining the period
    of the year during which Portugal may dispatch certain equidae from the part of
    its territory considered to be infected with African horse sickness'
  type: main
- language: fr
  script: Latn
  content: '91/93/CEE: Décision de la Commission du 11 février 1991 fixant la période
    de l''année durant laquelle le Portugal peut expédier certains équidés de
    la partie de son territoire considérée comme infectée de peste équine'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 11. Februar 1991 zur Festsetzung des Jahresabschnitts,
    in dem Portugal gewisse Equiden aus dem von Pferdepest befallenen Teil seines
    Hoheitsgebiets ausführen kann (91/93/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 11. februar 1991 om fastsættelse af den periode
    af året, i hvilken Portugal kan sende visse enhovede dyr fra den del af dets
    område, der betragtes som angrebet af hestepest (91/93/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/93/ΕΟΚ: Απόφαση της Επιτροπής της 11ης Φεβρουαρίου
