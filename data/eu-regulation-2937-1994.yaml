  content: Commission Regulation (EC) No 2937/94 of 1 December 1994 re-establishing
    the levying of customs duties on certain textile products originating in India,
    Malaysia, Thailand and the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
