title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 août 1969, autorisant la République
    fédérale d'Allemagne à différer le relèvement de ses droits de douane nationaux
    vers ceux du Tarif douanier commun en ce qui concerne certains vins algériens
  type: main
- language: de
  script: Latn
  content: '69/310/EWG: Entscheidung der Kommission vom 28. August 1969, durch die
    die Bundesrepublik Deutschland ermächtigt wird, die Erhöhung der Sätze ihres
    Zolltarifs für bestimmte algerische Weine in Richtung auf die Sätze des Gemeinsamen
    Zolltarifs aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '69/310/CEE: Decisione della Commissione, del 28 agosto 1969, che autorizza
    la Repubblica federale di Germania a differire l''aumento dei dazi nazionali verso
    quelli della tariffa doganale comune per quanto concerne taluni vini algerini'
  type: main
- language: nl
  script: Latn
  content: '69/310/EEG: Beschikking van de Commissie van 28 augustus 1969 waarbij
    de Bondsrepubliek Duitsland gemachtigd wordt de verhoging van de rechten van haar
    douanetarief tot die van het gemeenschappelijk douanetarief voor bepaalde Algerijnse
    wijnen uit te stellen'
  type: main
