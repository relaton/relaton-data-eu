title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1360 of 28 September 2020 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 87708 × MON 89788 × A5547-127, pursuant to
    Regulation (EC) No 1829/2003 of the European Parliament and of the Council (notified
    under document C(2020) 6435) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1360 de la Commission du 28 septembre
    2020 autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié MON 87708 × MON 89788 × A5547-127, consistant en ce soja ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2020) 6435] (Le texte en
    langue néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1360 der Kommission vom 28. September
    2020 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderte Sojabohnen der Sorte MON 87708 × MON 89788 × A5547-127 enthalten,
    aus ihnen bestehen oder aus ihnen gewonnen werden, gemäß der Verordnung (EG)
    Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt gegeben unter
    Aktenzeichen C(2020) 6435) (Nur der niederländische Text ist verbindlich)
  type: main
