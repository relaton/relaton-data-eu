title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 412/90 of 16 February 1990 introducing a
    corrective amount on the import of fresh lemons into the Community of Ten from
    Spain (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 412/90 de la Commission, du 16 février 1990, instituant
