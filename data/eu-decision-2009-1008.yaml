title:
- language: en
  script: Latn
  content: Council Implementing Decision of 7 December 2009 authorising the Republic
    of Latvia to extend the application of a measure derogating from Article 193 of
    Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution du Conseil du 7 décembre 2009 autorisant la République
    de Lettonie à proroger l’application d’une mesure dérogeant à l’article
    193 de la directive 2006/112/CE relative au système commun de taxe sur la valeur
    ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss des Rates vom 7. Dezember 2009 zur Ermächtigung
    der Republik Lettland, die Anwendung einer von Artikel 193 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichenden Regelung zu verlängern
  type: main
- language: bg
  script: Cyrl
  content: '2009/1008/ЕС: Решение за изпълнение на Съвета
    от 7 декември 2009 година за предоставяне на разрешение
    на Република Латвия да удължи срока на прилагането
    на мярка за дерогация от член 193 от Директива
    2006/112/ЕО относно общата система на данъка върху
    добавената стойност'
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady ze dne 7. prosince 2009 , kterým se Lotyšské
    republice povoluje prodloužit účinnost opatření odchylujícího se od článku
    193 směrnice 2006/112/ES o společném systému daně z přidané hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse af 7. december 2009 om bemyndigelse af
    Republikken Letland til at udvide anvendelsen af en foranstaltning, der fraviger
    bestemmelserne i artikel 193 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική Απόφαση του Συμβουλίου, της
    7ης Δεκεμβρίου 2009 , με την οποία επιτρέπεται
    στη Δημοκρατία της Λετονίας να παρατείνει
    την εφαρμογή μέτρου παρέκκλισης από το άρθρο
    193 της οδηγίας 2006/112/ΕΚ σχετικά με το κοινό σύστημα
    φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus, 7. detsember 2009 , millega lubatakse Läti Vabariigil
    pikendada meetme kohaldamist, millega tehakse erand direktiivi 2006/112/EÜ (mis
    käsitleb ühist käibemaksusüsteemi) artiklist 193
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös, annettu 7 päivänä joulukuuta
    2009 , luvan antamisesta Latvian tasavallalle jatkaa yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 193 artiklasta poikkeavan toimenpiteen soveltamista
  type: main
- language: hu
  script: Latn
  content: A Tanács végrehajtási határozata ( 2009. december 7. ) a Lett Köztársaságnak
    a közös hozzáadottértékadó-rendszerről szóló 2006/112/EK irányelv 193.
    cikkétől eltérő intézkedés alkalmazásának kiterjesztésére történő
    felhatalmazásáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione del Consiglio, del 7 dicembre 2009 , che autorizza
    la Repubblica di Lettonia a prorogare l’applicazione di una misura di deroga
    all’articolo 193 della direttiva 2006/112/CE relativa al sistema comune d’imposta
    sul valore aggiunto
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums ( 2009. gada 7. decembris ), ar ko Latvijas
    Republikai atļauj turpināt piemērot pasākumu, atkāpjoties no 193. panta Direktīvā
    2006/112/EK par kopējo pievienotās vērtības nodokļa sistēmu
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 7 d. Tarybos įgyvendinimo sprendimas, leisti Latvijos
    Respublikai toliau taikyti priemonę, kuria nukrypstama nuo Direktyvos 2006/112/EB
    dėl pridėtinės vertės mokesčio bendros sistemos 193 straipsnio
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kunsill tas- 7 ta’ Diċembru 2009
    li tawtorizza lir-Repubblika tal-Latvja biex testendi l-applikazzjoni ta’ miżura
    ta’ deroga mill-Artikolu 193 tad-Direttiva 2006/112/KE dwar is-sistema komuni
    ta’ taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit van de Raad van 7 december 2009 waarbij de Republiek
    Letland wordt gemachtigd een maatregel te blijven toepassen die afwijkt van artikel
    193 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel van belasting
    over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady z dnia 7 grudnia 2009 r. upoważniająca Republikę
    Łotewską do przedłużenia stosowania środka stanowiącego odstępstwo od art.
    193 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 7 de Dezembro de 2009 , que autoriza
    a República da Letónia a prorrogar a aplicação de uma medida em derrogação
    ao artigo 193. o da Directiva 2006/112/CE relativa ao sistema comum do imposto
    sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 7 decembrie 2009 de autorizare
    a Republicii Letonia în vederea aplicării în continuare a unei măsuri de derogare
    de la dispozițiile articolului 193 din Directiva 2006/112/CE privind sistemul
    comun al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady zo 7. decembra 2009 , ktorým sa Lotyšskej
    republike povoľuje predĺžiť uplatňovanie opatrenia odchyľujúceho sa od
    článku 193 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta z dne 7. decembra 2009 o dovoljenju Republiki Latviji,
    da še naprej uporablja odstopanje od člena 193 Direktive 2006/112/ES o skupnem
    sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución del Consejo, de 7 de diciembre de 2009 , por la
    que se autoriza a la República de Letonia a prorrogar la aplicación de una medida
    de excepción a lo dispuesto en el artículo 193 de la Directiva 2006/112/CE relativa
    al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut av den 7 december 2009 om bemyndigande för
    Republiken Lettland att förlänga tillämpningen av en åtgärd som avviker från
    artikel 193 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
  type: main
