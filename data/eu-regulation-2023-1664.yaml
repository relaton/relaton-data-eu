    hinsichtlich der Einträge für Argentinien, das Vereinigte Königreich und die
    Vereinigten Staaten in den Listen der Drittländer, aus denen der Eingang in die
    Union von Sendungen von Geflügel, Zuchtmaterial von Geflügel sowie frischem
    Fleisch von Geflügel und Federwild zulässig ist
