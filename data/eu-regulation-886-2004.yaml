    vides un ārējo sakaru jomā sakarā ar Čehijas, Igaunijas, Kipras, Latvijas,
    Lietuvas, Ungārijas, Maltas, Polijas, Slovēnijas un Slovākijas pievienošanos
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (EB) Nr 886/2004, 2004 m. kovo 4 d., pritaikantis
