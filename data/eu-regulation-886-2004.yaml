title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 886/2004 of 4 March 2004 adapting certain
    regulations and decisions in the field of free movement of goods, competition
    policy, agriculture, environment and external relations by reason of the accession
    of the Czech Republic, Estonia, Cyprus, Latvia, Lithuania, Hungary, Malta, Poland,
    Slovenia and Slovakia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 886/2004 de la Commission du 4 mars 2004 portant adaptation
    de certains règlements et décisions dans les domaines de la libre circulation
    des marchandises, de la politique de concurrence, de l’agriculture, de l’environnement
    ainsi que des relations extérieures, du fait de l’adhésion de la République
    tchèque, de l’Estonie, de Chypre, de la Lettonie, de la Lituanie, de la Hongrie,
    de Malte, de la Pologne, de la Slovénie et de la Slovaquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 886/2004 der Kommission vom 4. März 2004 zur Anpassung
    einiger Verordnungen, Beschlüsse und Entscheidungen in den Bereichen freier Warenverkehr,
    Wettbewerbspolitik, Landwirtschaft, Umweltschutz und auswärtige Beziehungen wegen
    des Beitritts der Tschechischen Republik, Estlands, Zyperns, Lettlands, Litauens,
    Ungarns, Maltas, Polens, Sloweniens und der Slowakei
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 886/2004 на Комисията от 4 март
    2004 година за адаптирането на някои регламенти
    и решения в областите на свободното движение
    на стоки, политиката на конкуренция, земеделието,
    околната среда и външните работи поради присъединяването
    на Чешката република, Естония, Кипър, Латвия,
    Литва, Унгария, Малта, Полша, Словения и Словакия
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 886/2004 ze dne 4. března 2004, kterým se
    v důsledku přistoupení České republiky, Estonska, Kypru, Lotyšska, Litvy,
    Maďarska, Malty, Polska, Slovinska a Slovenska upravují některá nařízení
    a rozhodnutí týkající se volného pohybu zboží, politiky hospodářské
    soutěže, zemědělství, životního prostředí, jakož i vnějších vztahů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 886/2004 af 4. marts 2004 om tilpasning
