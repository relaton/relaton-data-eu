    konkurrencepolitik, landbrug, miljø og eksterne forbindelser som følge af Tjekkiets,
    Estlands, Cyperns, Letlands, Litauens, Ungarns, Maltas, Polens, Sloveniens og
    Slovakiets tiltrædelse
  type: main
- language: el
  script: Grek
