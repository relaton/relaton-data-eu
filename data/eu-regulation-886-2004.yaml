    žemės ūkio, aplinkos apsaugos ir išorinių ryšių srityse dėl Čekijos,
    Estijos, Kipro, Latvijos, Lenkijos, Lietuvos, Maltos, Slovakijos, Slovėnijos
    ir Vengrijos įstojimo
  type: main
- language: mt
  script: Latn
