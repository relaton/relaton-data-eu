    Málta, Szlovákia és Szlovénia csatlakozása miatt történő módosulásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 886/2004 della Commissione, del 4 marzo 2004, che adatta
    taluni regolamenti e decisioni in materia di libera circolazione delle merci,
    politica della concorrenza, agricoltura, ambiente e relazioni esterne, in conseguenza
    dell’adesione della Repubblica ceca, dell’Estonia, di Cipro, della Lettonia,
    della Lituania, dell’Ungheria, di Malta, della Polonia, della Slovenia e della
    Slovacchia
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 886/2004 (2004. gada 4. marts), ar ko pielāgo
