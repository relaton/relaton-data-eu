  content: Commission Implementing Regulation (EU) 2023/2605 of 22 November 2023 amending
    Implementation Regulation (EU) 2022/926 imposing a definitive anti-dumping duty
    on imports of tubes and pipes of ductile cast iron (also known as spheroidal graphite
    cast iron) originating in India, following a partial interim review pursuant to
    Article 11(3) of Regulation (EU) 2016/1036 of the European Parliament and of the
    Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/2605 de la Commission du 22 novembre
