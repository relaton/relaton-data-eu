    antidumping définitif sur les importations de tubes et de tuyaux en fonte ductile
    (également dénommée fonte à graphite sphéroïdal) originaires de l’Inde
    à l’issue d’un réexamen intermédiaire partiel effectué en vertu de l’article
    11, paragraphe 3, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
