id: EURegulation24281980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2428/80 of 22 September 1980 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18 and originating in developing countries, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2428/80 de la Commission, du 22 septembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques fixes, variables ou ajustables de la position 85.18 du tarif douanier
    commun, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2428/80 der Kommission vom 22. September 1980 zur
    Wiedereinführung des Zollsatzes für elektrische Festkondensatoren, Drehkondensatoren
    und andere einstellbare Kondensatoren der Tarifnummer 85.18, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2428/80 af 22. september 1980 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under pos. 85.18, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2428/80 della Commissione, del 22 settembre 1980,
    che ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce 85.18 della tariffa doganale comune,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2428/80 van de Commissie van 22 september 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor elektrische condensatoren
    (vaste condensatoren, draaicondensatoren en regelbare of instelbare condensatoren),
    van post 85.18, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
