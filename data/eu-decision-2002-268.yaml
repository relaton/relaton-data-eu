title:
- language: en
  script: Latn
  content: '2002/268/EC: Commission Decision of 8 April 2002 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of nicobifen, tritosulfuron and bifenazate in Annex I to
    Council Directive 91/414/EEC concerning the placing of plant-protection products
    on the market (Text with EEA relevance) (notified under document number C(2002)
    1306)'
  type: main
- language: fr
  script: Latn
  content: '2002/268/CE: Décision de la Commission du 8 avril 2002 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription éventuelle du nicobifène, du tritosulfuron et du bifénazate
    à l''annexe I de la directive 91/414/CEE du Conseil concernant la mise sur le
    marché des produits phytopharmaceutiques (Texte présentant de l''intérêt pour
    l''EEE) [notifiée sous le numéro C(2002) 1306]'
  type: main
- language: de
  script: Latn
