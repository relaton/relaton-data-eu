  script: Latn
  content: '2009/614/EC: Commission Decision of 23 July 2009 amending Decision 2008/458/EC
    laying down rules for the implementation of Decision No 575/2007/EC of the European
    Parliament and of the Council establishing the European Return Fund for the period
    2008 to 2013 as part of the general programme Solidarity and management of migration
    flows as regards Member States’ management and control systems, the rules for
    administrative and financial management and the eligibility of expenditure on
    projects co-financed by the Fund (Notified under document C(2009) 5453)'
  type: main
- language: fr
  script: Latn
  content: '2009/614/CE: Décision de la Commission du 23 juillet 2009 portant modification
    de la décision 2008/458/CE fixant les modalités de mise en œuvre de la décision
    n o 575/2007/CE du Parlement européen et du Conseil portant création du Fonds
    européen pour le retour pour la période 2008-2013 dans le cadre du programme
    général Solidarité et gestion des flux migratoires en ce qui concerne les systèmes
    de gestion et de contrôle des États membres, les règles de gestion administrative
    et financière et l''éligibilité des dépenses pour les projets cofinancés
    par le Fonds [notifiée sous le numéro C(2009) 5453]'
  type: main
