    της Ουγγαρίας και την Τσεχική και Σλοβακική
    Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2945/93 della Commissione, del 26 ottobre 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1993 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi interinali conclusi
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica
    federativa ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2945/93 van de Commissie van 26 oktober 1993 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde produkten in de sectoren eieren en pluimvee,
    die in oktober 1993 worden ingediend op grond van de regeling die is vastgesteld
    in de door de Gemeenschap gesloten Interimovereenkomsten met de Republiek Polen,
    de Republiek Hongarije en de Tsjechische en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2945/93 da Comissão, de 26 de Outubro de 1993, que
