title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2945/93 of 26 October 1993 determining the
    extent to which applications lodged in October 1993 for import licences for certain
    eggs and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary
    and the Czech and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2945/93 de la Commission, du 26 octobre 1993, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1993 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords intérimaires conclus entre
    la Communauté et la Pologne, la Hongrie et la République fédérative tchèque
    et slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2945/93 der Kommission vom 26. Oktober 1993 über
    die Festsetzung des Umfangs, in dem die im Oktober 1993 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Eier und für Geflügelfleisch entsprechend der
    Regelung der Interimsabkommen zwischen der Gemeinschaft und Polen, Ungarn und
    der Tschechischen und Slowakischen Föderativen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2945/93 af 26. oktober 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1993 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de interimsaftaler, som Fællesskabet har indgået
    med Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative
    Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2945/93 της Επιτροπής
    της 26ης Οκτωβρίου 1993 περί καθορισμού ορίων
    εντός των οποίων δύναται να γίνει αποδεκτή
    η αίτηση που υποβλήθηκε τον Οκτώβριο του 1993
    για άδειες εισαγωγής αυγών και κρέατος πουλερικών
    βάσει του καθεστώτος που προβλέπεται από τις
    ενδιάμεσες συμφωνίες, τις οποίες συνήψε η Κοινότητα
