id: EUDecision1978162
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 January 1978 authorizing the French Republic
    not to apply Community treatment to raincoats for men and women, falling within
    heading Nos ex 61.01 and ex 61.02 of the Common Customs Tariff, originating in
    Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/162/CEE: Décision de la Commission, du 16 janvier 1978, autorisant
    la République française à exclure du traitement communautaire les manteaux
    de pluie pour hommes, femmes, des positions Ex 61.01 et Ex 61.02 du Tarif douanier
    commun, originaires de Hong-Kong et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Januar 1978, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Regenmäntel für Männer und Frauen, der Tarifnummern
    ex 61.01 und ex 61.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 16. januar 1978 om bemyndigelse til Den franske
    Republik til fra fællesskabsbehandling at undtage regnfrakker til mænd og kvinder,
    som henhører under position ex 61.01 og ex 61.02 i den fælles toldtarif, har
    oprindelse i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli impermeabili per uomo e
    per donna, delle voci ex 61.01 e ex 61.02 della tariffa doganale comune, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd regenjassen voor heren en dames van post ex 61.01 en 61.02 van
    het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
