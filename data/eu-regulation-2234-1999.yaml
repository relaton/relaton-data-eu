title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2234/1999 of 21 October 1999 laying down
    to what extent applications for issue of export licences submitted during October
    1999 for beef products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2234/1999 de la Commission, du 21 octobre 1999, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'octobre 1999 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2234/1999 der Kommission vom 21. Oktober 1999 über
    das Ausmaß, in dem den im Oktober 1999 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2234/1999 af 21. oktober 1999 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    oktober 1999 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2234/1999 της Επιτροπής,
    της 21ης Οκτωβρίου 1999, για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Οκτώβριο 1999 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2234/1999, annettu 21 päivänä lokakuuta 1999,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden lokakuussa
    1999 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2234/1999 della Commissione, del 21 ottobre 1999, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di ottobre 1999 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2234/1999 van de Commissie van 21 oktober 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in oktober 1999
    ingediende aanvragen om uitvoercertificaten voor producten van de sector rundvlees
    waarvoor een bijzondere behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2234/1999 da Comissão, de 21 de Outubro de 1999,
    que determina em que medida pode ser dado seguimento aos pedidos de entrega de
    certificados de exportação depositados no mês de Outubro de 1999 em relação
    a produtos do sector da carne de bovino que beneficiam de um tratamento especial
    na importação num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2234/1999 de la Comisión, de 21 de octubre de 1999,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    certificados de exportación, presentadas en el mes de octubre de 1999, para los
    productos del sector de la carne de bovino que se beneficien de un trato especial
    para su importación en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2234/1999 av den 21 oktober 1999 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under oktober månad 1999
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
  type: main
