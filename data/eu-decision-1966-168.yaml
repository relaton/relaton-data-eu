title:
- language: fr
  script: Latn
  content: Décision 66/168/CEE de la Commission, du 1er mars 1966, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire le café, non torréfié, non décaféiné, de la
    position 09.01 A I A du Tarif douanier commun, originaire des pays autres que
    les EAMA et PTOM associés à la CEE, et mis en libre pratique dans les pays du
    Benelux
  type: main
- language: de
  script: Latn
  content: '66/168/EWG: Entscheidung der Kommission vom 1. März 1966 über den Antrag
    der Republik Frankreich gemäß Artikel 115 Absatz (1) des Vertrages, nicht gerösteten,
    nicht entkoffeinierten Kaffee der Tarifnummer 09.01 A I a des Gemeinsamen Zolltarifs
    mit Ursprung in anderen Ländern als den assoziierten afrikanischen Staaten und
    Madagaskar und den mit der EWG assoziierten überseeischen Ländern und Gebieten,
    der sich in den Benelux-Ländern im freien Verkehr befindet, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '66/168/CEE: Decisione della Commissione, del 1 marzo 1966, relativa al
    ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    allo scopo di escludere dal trattamento comunitario il caffè non torrefatto,
    non decaffeinizzato, di cui alla voce 09.01 A I a della tariffa doganale comune,
    originario dei paesi che non siano gli Stati africani e Madagascar ed i paesi
    e territori d''oltremare associati alla CEE, e messo in libera pratica nei paesi
    del Benelux'
  type: main
- language: nl
  script: Latn
  content: '66/168/EEG: Beschikking van de Commissie van 1 maart 1966 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag koffie, ongebrand, waaruit geen cafeïne is verwijderd, van post
    09.01 A I a van het gemeenschappelijk douanetarief, die van oorsprong is uit andere
    landen dan de met de EEG geassocieerde Afrikaanse staten en Madagaskar en landen
    en gebieden overzee en die in de Beneluxlanden in het vrije verkeer is gebracht,
    van de communautaire behandeling uit te sluiten.'
  type: main
