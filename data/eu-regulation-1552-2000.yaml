  script: Latn
  content: 'Commission Regulation (EC) No 1552/2000 of 14 July 2000 amending Regulation
    (EC) No 1547/1999 concerning the control procedures to apply to shipments of certain
    types of waste to: Estonia, Hong Kong, Hungary, Indonesia, Lithuania, San Marino
    and Thailand'
  type: main
- language: fr
  script: Latn
