title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 284/2012 of 29 March 2012 imposing
    special conditions governing the import of feed and food originating in or consigned
    from Japan following the accident at the Fukushima nuclear power station and repealing
    Implementing Regulation (EU) No 961/2011
  type: main
- language: fr
  script: Latn
