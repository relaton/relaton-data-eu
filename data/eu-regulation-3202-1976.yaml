    forordning (EØF) nr. 3200/76 af 21. december 1976 om definitionen af begrebet
    varer med oprindelsesstatus til brug ved anvendelsen af de toldpræferencer, der
    af Det europæiske økonomiske Fællesskab indrømmes visse varer fra udviklingslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3202/76 della Commissione, del 21 dicembre 1976, che
    deroga a favore dei paesi del mercato comune dell' America centrale agli articoli
    1, 6 e 13 del regolamento (CEE) n. 3200/76 della Commissione, del 21 dicembre
    1976, relativo alla definizione della nozione di prodotti originari per l' applicazione
    delle preferenze tariffarie accordate dalla Comunità economica europea a taluni
    prodotti di paesi in via di sviluppo
  type: main
- language: nl
