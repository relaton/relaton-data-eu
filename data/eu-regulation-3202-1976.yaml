title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3202/76 of 21 December 1976 derogating in
    respect of the countries of the Central American Common Market from Articles 1,
    6 and 13 of Commission Regulation (EEC) No 3200/76 of 21 December 1976 on the
    definition of the concept of originating products for purposes of the application
    of tariff preferences granted by the European Economic Community in respect of
    certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3202/76 de la Commission, du 21 décembre 1976, portant
    dérogation, pour les pays du marché commun de l' Amérique centrale, aux articles
    1er, 6 et 13 du règlement (CEE) n° 3200/76 de la Commission, du 21 décembre
    1976, relatif à la définition de la notion de produits originaires pour l' application
    des préférences tarifaires accordées par la Communauté économique européenne
    à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3202/76 der Kommission vom 21. Dezember 1976 über
    die zugunsten der Länder des Gemeinsamen Marktes von Mittelamerika vorgesehene
    Abweichung von den Artikeln 1, 6 und 13 der Verordnung (EWG) Nr. 3200/76 der Kommission
    vom 21. Dezember 1976 über die Begriffsbestimmung des Warenursprungs bei der
    Anwendung der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren
    aus Entwicklungsländern gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3202/76 af 21. december 1976 om undtagelse
