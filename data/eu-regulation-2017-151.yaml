title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/151 of 27 January 2017 amending
    Annex I to Regulation (EC) No 798/2008, as regards the entries in the list of
    third countries, territories, zones or compartments from which poultry and poultry
    products may be imported into and transit through the Union and the veterinary
    certification requirements
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/151 de la Commission du 27 janvier 2017
    modifiant l'annexe I du règlement (CE) n° 798/2008, en ce qui concerne les mentions
    sur la liste des pays tiers, territoires, zones ou compartiments en provenance
    desquels les volailles et les produits de volailles peuvent être importés dans
    l'Union et transiter par celle-ci ainsi que les règles en matière de certification
    vétérinaire
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/151 der Kommission vom 27. Januar 2017
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich der
    Einträge in der Liste von Drittländern, Gebieten, Zonen und Kompartimenten,
    aus denen die Einfuhr von Geflügel und Geflügelerzeugnissen in die Union und
    ihre Durchfuhr durch die Union zugelassen ist, und zur Festlegung der diesbezüglichen
    Veterinärbescheinigungen
  type: main
