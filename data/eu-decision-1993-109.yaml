title:
- language: en
  script: Latn
  content: '93/109/EEC: Council Decision of 15 February 1993 authorizing the French
    Republic to extend the application of a measure derogating from Article 17 (2)
    of the sixth Directive (77/388/EEC) on the harmonization of the laws of the Member
    States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '93/109/CEE: Décision du Conseil, du 15 février 1993, autorisant la République
    française à proroger l'' application d'' une mesure dérogatoire à l'' article
    17 paragraphe 2 de la sixième directive (77/388/CEE) en matière d'' harmonisation
    des législations des Etats membres relatives aux taxes sur le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '93/109/EWG: Entscheidung des Rates vom 15. Februar 1993 zur Ermächtigung
    der Französischen Republik, die Anwendung einer von Artikel 17 Absatz 2 der Sechsten
    Richtlinie (77/388/EWG) zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten
    über die Umsatzsteuern abweichenden Maßnahme zu verlängern'
  type: main
- language: da
  script: Latn
  content: '93/109/EØF: Rådets beslutning af 15. februar 1993 om bemyndigelse af
    Den Franske Republik til at forlænge anvendelsen af en foranstaltning, som fraviger
    artikel 17, stk. 2, i sjette direktiv (77/388/EØF) om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '93/109/ΕΟΚ: Απόφαση του Συμβουλίου της 15ης
    Φεβρουαρίου 1993 που επιτρέπει στη Γαλλική Δημοκρατία
    να παρατείνει την εφαρμογή μέτρου παρέκκλισης
    από το άρθρο 17 παράγραφος 2 της έκτης οδηγίας
    (77/388/ΕΟΚ) περί εναρμονίσεως των νομοθεσιών
    των κρατών μελών σχετικά με το φόρο κύκλου
    εργασιών'
  type: main
- language: it
  script: Latn
  content: '93/109/CEE: Decisione del Consiglio, del 15 febbraio 1993, che autorizza
    la Repubblica Francese a prorogare l'' applicazione di una misura di deroga all''
    articolo 17, paragrafo 2 della sesta direttiva (77/388/CEE) in materia di armonizzazione
    delle legislazioni degli Stati membri relative alle imposte sulla cifra di affari'
  type: main
- language: nl
  script: Latn
  content: '93/109/EEG: Beschikking van de Raad van 15 februari 1993 waarbij de Franse
    Republiek wordt gemachtigd de toepassing van een van artikel 17, lid 2, van de
    Zesde Richtlijn (77/388/EEG) betreffende de harmonisatie van de wetgevingen der
    Lid-Staten inzake omzetbelasting afwijkende maatregel voort te zetten'
  type: main
- language: pt
  script: Latn
  content: '93/109/CEE: Decisão do Conselho, de 15 de Fevereiro de 1993, que autoriza
    a República Francesa a prorrogar a aplicação de uma medida derrogatória do
    n° 2 do artigo 17° da Sexta Directiva (77/388/CEE), relativa à harmonização
    das legislações dos Estados-membros respeitantes aos impostos sobre o volume
    de negócios'
  type: main
- language: es
  script: Latn
  content: '93/109/CEE: Decisión del Consejo, de 15 de febrero de 1993, por la que
