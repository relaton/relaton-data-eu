---
id: EUDecision20202217
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/2217 of 22 December 2020 amending
    Annexes I and III to Decision 2010/472/EU as regards the entry for the United
    Kingdom in the lists of third countries or parts thereof authorised for imports
    into the Union of semen, ova and embryos of animals of the ovine and caprine species
    (notified under document C(2020) 9554)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2217 de la Commission du 22 décembre
    2020 modifiant les annexes I et III de la décision 2010/472/UE en ce qui concerne
    la mention relative au Royaume-Uni dans les listes des pays tiers ou parties de
    pays tiers en provenance desquels l’importation dans l’Union de sperme, d’ovules
    et d’embryons d’ovins et de caprins est autorisée [notifiée sous le numéro
    C(2020) 9554]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2217 der Kommission vom 22. Dezember
    2020 zur Änderung der Anhänge I und III des Beschlusses 2010/472/EU im Hinblick
    auf die Aufnahme des Vereinigten Königreichs in die Listen der Drittländer und
    Teile von Drittländern, aus denen die Einfuhr von Samen, Eizellen und Embryonen
    von Schafen und Ziegen in die Union zugelassen ist (Bekannt gegeben unter Aktenzeichen
    C(2020) 9554)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/2217 на Комисията
    от 22 декември 2020 година за изменение на приложения
    I и III към Решение 2010/472/ЕС по отношение на вписването
    за Обединеното кралство в списъците на трети
    страни или части от тях, от които е разрешен
    вносът в Съюза на сперма, яйцеклетки и ембриони
    от животни от рода на овцете и козите (нотифицирано
    под номер С(2020) 9554)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/2217, ze dne 22. prosince 2020,
    kterým se mění přílohy I a III rozhodnutí 2010/472/EU, pokud jde o položku
    týkající se Spojeného království v seznamech třetích zemí nebo jejich
    částí, ze kterých je povolen dovoz spermatu, vajíček a embryí ovcí a koz
    do Unie (oznámeno pod číslem C(2020) 9554)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/2217 af 22. december
    2020 om ændring af bilag I og III til afgørelse 2010/472/EU for så vidt angår
    oplysningerne om Det Forenede Kongerige på listerne over tredjelande eller dele
    deraf, hvorfra det er tilladt at indføre sæd, æg og embryoner fra fåre- og
    gedearter til Unionen (meddelt under nummer C(2020) 9554)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/2217 της Επιτροπής
    της 22ης Δεκεμβρίου 2020 για την τροποποίηση των
    παραρτημάτων I και ΙΙΙ της απόφασης 2010/472/ΕΕ
    όσον αφορά την καταχώριση για το Ηνωμένο Βασίλειο
    στους καταλόγους τρίτων χωρών ή τμημάτων τους
    εκ των οποίων επιτρέπονται οι εισαγωγές σπέρματος,
    ωαρίων και εμβρύων αιγοπροβάτων στην Ένωση
    [κοινοποιηθείσα υπό τον αριθμό C(2020) 9554]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/2217, 22. detsember 2020, millega muudetakse
    otsuse 2010/472/EL I ja III lisa Ühendkuningriiki käsitleva kande osas selliste
    kolmandate riikide või nende osade loeteludes, kust on lubatud liitu importida
    lammaste ja kitsede spermat, munarakke ja embrüoid (teatavaks tehtud numbri C(2020)
    9554 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/2217, annettu 22 päivänä
    joulukuuta 2020, päätöksen 2010/472/EU liitteiden I ja III muuttamisesta siltä
    osin kuin on kyse Yhdistynyttä kuningaskuntaa koskevista kohdista sellaisten
    kolmansien maiden tai niiden osien luetteloissa, joista lammas- ja vuohieläinten
    siemennesteen, munasolujen ja alkioiden tuonti unioniin on sallittu (tiedoksiannettu
    numerolla C(2020) 9554)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/2217 оd 22. prosinca 2020. o izmjeni
    priloga I. i III. Odluci 2010/472/EU u pogledu unosa za Ujedinjenu Kraljevinu
    na popisima trećih zemalja ili njihovih dijelova iz kojih je odobren uvoz u Uniju
    sjemena, jajnih stanica i zametaka ovaca i koza (priopćeno pod brojem dokumenta
    C(2020)9554)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2217 végrehajtási határozata (2020. december
    22.) a 2010/472/EU határozat I. és III. mellékletének az Egyesült Királyságnak
    a juh- és kecskefélékhez tartozó állatok spermáinak, petesejtjeinek és
    embrióinak Unióba történő behozatalára engedéllyel rendelkező harmadik
    országok, illetve azok részeinek jegyzékeibe való bejegyzése tekintetében
    történő módosításáról (az értesítés a C(2020) 9554. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/2217 della Commissione del 22 dicembre
    2020 che modifica gli allegati I e III della decisione 2010/472/UE per quanto
    riguarda la voce relativa al Regno Unito negli elenchi dei paesi terzi o di parti
    di essi da cui è autorizzata l’importazione nell’Unione di sperma, ovuli
    ed embrioni di animali delle specie ovina e caprina [notificata con il numero
    C(2020) 9554]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/2217 (2020. gada 22. decembris),
    ar ko Lēmuma 2010/472/ES I un III pielikumu groza attiecībā uz ierakstu par
    Apvienoto Karalisti to trešo valstu vai to daļu sarakstos, no kurām Savienībā
    atļauts importēt aitu un kazu spermu, olšūnas un embrijus (izziņots ar dokumenta
    numuru C(2020) 9554)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/2217 2020 m. gruodžio 22
    d. kuriuo dėl Jungtinės Karalystės įrašo trečiųjų šalių arba jų dalių,
    iš kurių leidžiama importuoti į Sąjungą avinių ir ožkinių rūšių gyvūnų
    spermą, kiaušialąstes ir embrionus, sąrašuose iš dalies keičiami Sprendimo
    2010/472/ES I ir III priedai (pranešta dokumentu Nr. C(2020) 9554)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2020/2217 tat-22
    ta’ Diċembru 2020 li temenda l-Annessi I u III tad-Deċiżjoni 2010/472/UE
    fir-rigward tal-entrata għar-Renju Unit fil-listi ta’ pajjiżi terzi jew partijiet
    minnhom awtorizzati għall-importazzjonijiet fl-Unjoni ta’ semen, ova u embrijuni
    ta’ annimali tal-ispeċi ovina u kaprina (notifikata bid-dokument C(2020) 9554)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/2217 van de Commissie van 22 december 2020
    tot wijziging van bijlagen I en III bij Besluit 2010/472/EU wat betreft de vermelding
    van het Verenigd Koninkrijk in de lijsten van derde landen of delen daarvan waaruit
    sperma, eicellen en embryo’s van schapen en geiten in de Unie mogen worden ingevoerd
    (Kennisgeving geschied onder nummer C(2020) 9554)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/2217 z dnia 22 grudnia 2020 r. zmieniająca
    załączniki I i III do decyzji 2010/472/UE w odniesieniu do pozycji dotyczącej
    Zjednoczonego Królestwa w wykazach państw trzecich lub części ich terytoriów,
    z których dozwolony jest przywóz do Unii nasienia, komórek jajowych i zarodków
    owiec i kóz (notyfikowana jako dokument nr C(2020) 9554)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/2217 da Comissão de 22 de dezembro de
    2020 que altera os anexos I e III da Decisão 2010/472/UE no que diz respeito
    à entrada do Reino Unido nas listas de países terceiros ou partes de países
    terceiros autorizados para a importação na União na União sémen, óvulos
    e embriões de animais das espécies ovina e caprina [notificada com o número
    C(2020) 9554]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2217 a Comisiei din 22 decembrie
    2020 de modificare a anexelor I și III la Decizia 2010/472/UE în ceea ce privește
    includerea Regatului Unit în listele cu țări terțe sau cu părți ale acestora
    care sunt autorizate pentru importurile în Uniune de material seminal, de ovule
    și de embrioni de animale din speciile ovină și caprină [notificată cu numărul
    C(2020) 9554]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/2217 z 22. decembra 2020, ktorým
    sa menia prílohy I a III k rozhodnutiu 2010/472/EÚ, pokiaľ ide o položku týkajúcu
    sa Spojeného kráľovstva v zoznamoch tretích krajín alebo ich častí, z ktorých
    sa povoľuje dovoz spermy, vajíčok a embryí oviec (Ovine) a kôz (Caprinae)
    do Únie [oznámené pod číslom C(2020)9554]
  type: main
- language: sl
  script: Latn
  content: Delegirani sklep Komisije (EU) 2020/2217 z dne 22. decembra 2020 o spremembi
    prilog I in III k Sklepu 2010/472/EU glede vnosa za Združeno kraljestvo na seznamih
    tretjih držav ali njihovih delov, iz katerih je dovoljen vnos semena, jajčnih
    celic in zarodkov ovc in koz v Unijo (notificirano pod dokumentarno številko
    C(2020) 9554)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/2217 de la Comisión de 22 de diciembre
    de 2020 por la que se modifican los anexos I y III de la Decisión 2010/472/UE
    en lo relativo a la incorporación del Reino Unido a las listas de terceros países
    o partes de terceros países autorizados a importar en la Unión esperma, óvulos
    y embriones de ovinos y caprinos [notificada con el número C(2020) 9554]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/2217 av den 22 december 2020
    om ändring av bilagorna I och III till beslut 2010/472/EU vad gäller införande
    av Förenade kungariket i förteckningarna över tredjeländer eller delar därav
    från vilka sperma, ägg och embryon från får och getter får importeras till
    unionen (delgivet med nr C(2020) 9554)
