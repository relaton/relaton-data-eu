  content: Règlement (CEE) n° 1913/70 de la Commission, du 23 septembre 1970, modifiant
    le règlement (CEE) n° 772/70 concernant une adjudication permanente pour la
    vente de sucre blanc destiné à l'exportation et détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1913/70 der Kommission vom 23. September 1970 zur
    Änderung der Verordnung (EWG) Nr. 772/70 über eine Dauerausschreibung zum Verkauf
    von Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1913/70 della Commissione, del 23 settembre 1970,
    che modifica il regolamento (CEE) n. 772/70 relativo ad una gara permanente per
    la vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1913/70 van de Commissie van 23 september 1970 houdende
    wijziging van Verordening (EEG) nr. 772/70 betreffende een permanente openbare
    inschrijving voor de verkoop van witte suiker bestemd voor de uitvoer en in het
    bezit van het Franse interventiebureau
