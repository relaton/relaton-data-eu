title:
- language: en
  script: Latn
  content: '79/678/EEC: Commission Decision of 18 July 1979 authorizing the French
    Republic not to apply Community treatment to crepes and woven fabrics of silk,
    falling within subheadings 50.09 ex A and ex C of the Common Customs Tariff, originating
    in the People''s Republic of China and in free circulation in the other Member
    States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/678/CEE: Décision de la Commission, du 18 juillet 1979, autorisant
    la République française à exclure du traitement communautaire les crêpes et
    les tissus de soie de la sous-position 50.09 ex A et ex C du tarif douanier commun,
    originaires de la République populaire de Chine et mis en libre pratique dans
    les autres États membres (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/678/EWG: Entscheidung der Kommission vom 18. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Seide,
    Schappeseide oder Bourretteseide der Tarifstellen 50.09 ex A und ex C des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/678/EØF: Kommissionens beslutning af 18. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage crepestoffer,
    vævet stof af natursilke, som henhører under pos. 50.09 ex A og ex C i den fælles
    toldtarif, har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/678/CEE: Decisione della Commissione, del 18 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario crespi, tessuti
    di seta delle sottovoci 50.09 ex A e ex C della tariffa doganale comune originari
    della Repubblica popolare cinese e messi in libera pratica negli altri Stati membri
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/678/EEG: Beschikking van de Commissie van 18 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd crêpe, weefsels van zijde, van post 50.09 ex A en
    ex C van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
