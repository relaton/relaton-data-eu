title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1252/84 of 4 May 1984 re-establishing the
    levying of customs duties on certain woven fabrics of man-made fibres (continuous),
    products of category 35 (code 0350), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1252/84 de la Commission du 4 mai 1984 portant rétablissement
    de la perception des droits de douane applicables à certains tissus, de fibres
    textiles synthétiques continues, de la catégorie de produits 35 (code 0350),
    originaires de l' Indonésie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1252/84 der Kommission vom 4. Mai 1984 über die Wiedereinführung
    des Zollsatzes für Gewebe aus synthetischen Spinnfäden der Warenkategorie Nr.
    35 (Kennziffer 0350) mit Ursprung in Indonesien, dem die in der Verordnung (EWG)
    Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1252/84 af 4. maj 1984 om genindførelse
    af opkrævning af toldafgifter for bestemt vævet stof af endeløse kemofibre,
    under varekategori nr. 35 (kode 0350), som har oprindelse i Indonesien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1252/84 της Επιτροπής
    της 4ης Μαΐου 1984 περί αποκαταστάσεως της εφαρμογής
    τελωνειακών δασμών για ορισμένα υφάσματα εκ
    συνθετικών υφαντικών ινών συνεχών, προϊόντα
    της κατηγορίας 35 (κωδικός 0350), καταγωγής Ινδονησίας,
    δικαιούχου των προβλεπομένων, στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου, δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1252/84 della Commissione del 4 maggio 1984 che ripristina
    la riscossione dei dazi doganali applicabili a certi tessuti di fibre tessili
    sintetiche continue, della categoria di prodotti n. 35 (codice 0350), originari
    dell' Indonesia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1252/84 van de Commissie van 4 mei 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    weefsels van synthetische continuvezels van de categorie van produkten nr. 35
    (codenummer 0350), van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
  type: main
