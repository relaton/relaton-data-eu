id: EURegulation21791995
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2179/95 of 8 August 1995 providing for the adjustment,
    as an autonomous and transitional measure, of certain agricultural concessions
    provided for in the Europe Agreements and amending Regulation (EC) No 3379/94
    opening and administering certain Community tariff quotas in 1995 for certain
    agricultural products and for beer, to take account of the Agreement on Agriculture
    concluded during the Uruguay Round Multilateral Trade Negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2179/95 du Conseil, du 8 août 1995, prévoyant l'
    adaptation autonome et transitoire de certaines concessions agricoles prévues
    par les accords européens et modifiant le règlement (CE) nº 3379/94 portant
    ouverture et mode de gestion de certains contingents tarifaires communautaires
    en 1995 pour certains produits agricoles et pour la bière, afin de tenir compte
    de l' accord sur l' agriculture conclu dans le cadre des négociations commerciales
    multilatérales du cycle d' Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2179/95 des Rates vom 8. August 1995 zur vorübergehenden
    autonomen Anpassung von in den Europa-Abkommen vorgesehenen landwirtschaftlichen
    Zugeständnissen und zur Änderung der Verordnung (EG) Nr. 3379/94 zur Eröffnung
    und Verwaltung von Zollkontingenten für bestimmte landwirtschaftliche Erzeugnisse
    und für Bier (1995), um dem im Rahmen der multilateralen Handelsverhandlungen
    der Uruguay-Runde geschlossenen Übereinkommen über die Landwirtschaft Rechnung
    zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2179/95 af 8. august 1995 om autonom og midlertidig
    tilpasning af visse landbrugsindrømmelser i Europaaftalerne og om ændring af
    Rådets forordning (EF) nr. 3379/94 om åbning og forvaltning af visse EF-kontingenter
    i 1995 for visse landbrugsprodukter og øl, for at tage hensyn til den landbrugsaftale,
    som er indgået under de multilaterale handelsforhandlinger i Uruguay-rundens
    regi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2179/95 του Συμβουλίου
    της 8ης Αυγούστου 1995 για αυτόνομη και μεταβατική
    προσαρμογή ορισμένων γεωργικών παραχωρήσεων
    που προβλέπονται στις ευρωπαϊκές συμφωνίες
    και για την τροποποίηση του κανονισμού (ΕΚ)
    αριθ. 3379/94 για το άνοιγμα και τον τρόπο διαχείρισης
    ορισμένων κοινοτικών δασμολογικών ποσοστώσεων
    για το 1995 σχετικά με ορισμένα γεωργικά προϊόντα
    και με την μπίρα, προκειμένου να ληφθεί υπόψη
    η συμφωνία για τη γεωργία που έχει συναφθεί
    στο πλαίσιο των πολυμερών εμπορικών διαπραγματεύσεων
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2179/95, annettu 8 päivänä elokuuta 1995,
    tiettyjen Eurooppa-sopimuksissa määrättyjen maataloutta koskevien myönnytysten
    autonomisesta ja väliaikaisesta mukauttamisesta sekä tiettyjä maataloustuotteita
    ja olutta koskevien tiettyjen yhteisön tariffikiintiöiden avaamisesta ja hallinnoinnista
    vuonna 1995 annetun asetuksen (EY) N:o 3379/94 muuttamisesta Uruguayn kierroksen
    monenvälisten kauppaneuvottelujen osana tehdyn maataloussopimuksen huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2179/95 del Consiglio, dell' 8 agosto 1995, che stabilisce
    l' adeguamento autonomo e transitorio di alcune concessioni agricole previste
    dagli accordi europei e che modifica il regolamento (CE) n. 3379/94, recante apertura
    e modalità di gestione di taluni contingenti tariffari comunitari nel 1995 per
    determinati prodotti agricoli e per la birra, al fine di tener conto dell' accordo
    sull' agricoltura concluso nel quadro dei negoziati commerciali multilaterali
    dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2179/95 van de Raad van 8 augustus 1995 houdende,
    in verband met de in het kader van de multilaterale handelsbesprekingen van de
    Uruguay-Ronde gesloten Overeenkomst inzake de landbouw, een autonome en tijdelijke
    aanpassing van bepaalde in de Europa- Overeenkomsten opgenomen landbouwconcessies
    en wijziging van Verordening (EG) nr. 3379/94 houdende opening en wijze van beheer
    van communautaire tariefcontingenten voor bepaalde landbouwprodukten en voor bier
    in 1995
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2179/95 do Conselho, de 8 de Agosto de 1995, que adapta,
    com carácter autónomo e transitório, certas concessões agrícolas previstas
    nos Acordos Europeus e altera o Regulamento (CE) nº 3379/94 relativo à abertura
    e modo de gestão de determinados contingentes pautais para certos produtos agrícolas
    e para a cerveja em 1995, a fim de ter em conta o Acordo sobre a agricultura celebrado
    no âmbito das negociações comerciais multilaterais do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2179/95 del Consejo, de 8 de agosto de 1995, por el
    que se adaptan, con carácter autónomo y transitorio, determinadas concesiones
    agrícolas previstas en los Acuerdos europeos y se modifica el Reglamento (CE)
    nº 3379/94, relativo a la apertura y modo de gestión de contingentes arancelarios
    comunitarios correspondientes a algunos productos agrícolas y a la cerveza para
    1995 a fin de tener en cuenta lo establecido en el Acuerdo sobre agricultura celebrado
    en el marco de las negociaciones comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2179/95 av den 8 augusti 1995 om autonom anpassning
    under en övergångsperiod av vissa jordbrukskoncessioner som föreskrivs i Europaavtalen
    och om ändring av förordning (EG) nr 3379/94 om öppnande och förvaltning av
    vissa gemenskapstullkvoter år 1995 för vissa jordbruksprodukter och för öl
    i syfte att beakta det jordbruksavtal som ingåtts inom ramen för de multilaterala
    handelsförhandlingarna under Uruguayrundan
  type: main
