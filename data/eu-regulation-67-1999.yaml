  content: Council Regulation (EC) No 67/1999 of 18 December 1998 laying down for
    1999 certain conservation and management measures for fishery resources in the
    Convention Area as defined in the Convention on future Multilateral Cooperation
    in North-East Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 67/1999 du Conseil du 18 décembre 1998 fixant, pour
    1999, certaines mesures techniques de conservation et de gestion des ressources
    halieutiques dans la zone de la convention définie par la convention sur la future
    coopération multilatérale dans les pêches de l'Atlantique du Nord-Est
  type: main
- language: de
  script: Latn
