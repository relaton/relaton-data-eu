    monenkeskistä yhteistyötä koskevassa yleissopimuksessa määritetyn yleissopimusalueen
    kalavaroihin sovellettavista säilyttämis- ja hoitotoimenpiteistä vuodeksi 1999
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 67/1999 del Consiglio del 18 dicembre 1998 che stabilisce,
