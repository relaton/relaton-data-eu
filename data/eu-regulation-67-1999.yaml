    des Übereinkommens über die künftige multilaterale Zusammenarbeit auf dem Gebiet
    der Fischerei im Nordostatlantik (1999)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 67/1999 af 18. december 1998 om fastsættelse
    for 1999 af foranstaltninger til bevarelse og forvaltning af fiskeressourcer i
    konventionsområdet som defineret i konventionen om det fremtidige multilaterale
    samarbejde vedrørende fiskeriet i det nordøstlige Atlanterhav
  type: main
- language: el
  script: Grek
