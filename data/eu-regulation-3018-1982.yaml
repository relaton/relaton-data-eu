title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3018/82 of 11 November 1982 imposing a provisional
    anti-dumping duty on imports of certain sodium carbonate originating in the United
    States of America and accepting certain undertakings concerning the imports of
    certain sodium carbonate originating in the United States of America
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3018/82 de la Commission, du 11 novembre 1982, instituant
    un droit anti-"dumping" provisoire sur les importations de carbonate de sodium
    originaire des États-Unis d' Amérique, d' une part, et portant acceptation de
    certains engagements relatifs à l' importation de carbonate de sodium originaire
    des États-Unis d' Amérique, d' autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3018/82 der Kommission vom 11. November 1982 zur Einführung
    eines vorläufigen Antidumpingzolls auf bestimmte Formen von Natriumcarbonat mit
    Ursprung in den Vereinigten Staaten von Amerika sowie zur Annahme bestimmter Verpflichtungen
    betreffend die Einfuhren bestimmter Formen von Natriumcarbonat mit Ursprung in
    den Vereinigten Staaten von Amerika
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3018/82 af 11. november 1982 om indførelse
    af en midlertidig antidumpingtold på importen af visse typer natriumcarbonat
    med oprindelse i Amerikas Forenede Stater og om godtagelse af visse tilsagn vedrørende
    importen af visse typer natriumcarbonat med oprindelse i Amerikas Forenede Stater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3018/82 τής Επιτροπής
    τής 11ης Νοεμβρίου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές ορισμένων
    ειδών ανθρακικού νατρίου προελεύσεως Ηνωμένων
    Πολιτειών Αμερικής καί περί αποδοχής ορισμένων
    υποχρεώσεων σχετικά μέ τίς εισαγωγές ορισμένων
    ειδών ανθρακικού νατρίου προελεύσεως Ηνωμένων
    Πολιτειών Αμερικής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3018/82 della Commissione, dell' 11 novembre 1982,
    che impone un dazio antidumping provvisorio sulle importazioni di alcuni carbonati
    di sodio originari degli Stati Uniti d' America e che accetta alcuni impegni relativi
    alle importazioni degli stessi prodotti originari degli Stati Uniti d' America
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3018/82 van de Commissie van 11 november 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van een bepaalde soort
    natriumcarbonaat van oorsprong uit de Verenigde Staten van Amerika en aanvaarding
    van een verbintenis met betrekking tot de invoer van een bepaalde soort natriumcarbonaat
    van oorsprong uit de Verenigde Staten van Amerika
  type: main
