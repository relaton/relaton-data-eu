    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölleg
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2077/82 af 28. juli 1982 om fastsættelse
