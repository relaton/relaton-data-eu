  content: Commission Regulation (EEC) No 2077/82 of 28 July 1982 determining the
    amounts of the variable components and additional duties applicable from 1 August
    to 31 October 1982 on the importation into the Community of goods covered by Regulation
    (EEC) No 3033/80m
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2077/82 de la Commission, du 28 juillet 1982, déterminant
