    über eine Abweichung von der Bestimmung des Begriffs ,,Ursprungswaren" zur Berücksichtigung
    der besonderen Lage von Fidschi bei der Herstellung von haltbar gemachtem Thunfisch
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1421/87 af 21. maj 1987 om gennemførelse
