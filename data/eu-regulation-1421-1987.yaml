    houdende afwijking van de definitie van het begrip ,,produkten van oorsprong"
    in verband met de bijzondere situatie van Fiji voor wat betreft de produktie van
    tonijnconserven aldaar
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1421/87 do Conselho de 21 de Maio de 1987 relativo
