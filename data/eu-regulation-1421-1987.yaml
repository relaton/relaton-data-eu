    ACP-CEE che deroga alla definizione della nozione di "prodotti originari" per
    tener conto della situazione particolare delle isole Figi per quanto attiene alla
    produzione di conserve di tonno
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1421/87 van de Raad van 21 mei 1987 betreffende de
