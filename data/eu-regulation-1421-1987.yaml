  script: Latn
  content: Council Regulation (EEC) No 1421/87 of 21 May 1987 regarding the application
    of Decision 1/87 of the ACP-EEC Customs Cooperation Committee derogating from
    the definition of the concept of 'originating products' to take account of the
    special situation of Fiji with regard to its production of canned tuna
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1421/87 du Conseil du 21 mai 1987 relatif à l' application
