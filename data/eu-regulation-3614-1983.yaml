    τελωνειακών δασμών για ορισμένα αντιβιοτικά
    της κλάσεως ex 29.44 του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3614/83 della Commissione del 20 dicembre 1983 che
