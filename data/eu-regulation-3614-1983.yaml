title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3614/83 of 20 December 1983 re-establishing
    the levying of customs duties on certain antibiotics, falling within heading No
    ex 29.44 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3614/83 de la Commission du 20 décembre 1983 portant
    rétablissement de la perception des droits de douane applicables à certains
    antibiotiques de la position ex 29.44 du tarif douanier commun, originaires de
    Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3614/83 der Kommission vom 20. Dezember 1983 zur Wiedereinführung
    der Erhebung der Zölle für gewisse Antibiotika der Tarifnummer ex 29.44 mit
    Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3614/83 af 20. december 1983 om genindførelse
    af opkrævning af told for bestemte antibiotica, henhørende under pos. ex 29.44
    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3614/83 της Επιτροπής
