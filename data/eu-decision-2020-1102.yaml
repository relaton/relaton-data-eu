type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1102 of 24 July 2020 on the
    approval of the technology used in a 48 Volt efficient motor-generator combined
    with a 48 Volt/12 Volt DC/DC converter for use in conventional combustion engine
    and certain hybrid electric passenger cars and light commercial vehicles as an
    innovative technology pursuant to Regulation (EU) 2019/631 of the European Parliament
    and of the Council and by reference to the New European Driving Cycle (NEDC)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1102 de la Commission du 24 juillet
    2020 relative à l’approbation de la technologie utilisée dans un alternodémarreur
    48 volts à haut rendement combiné à un convertisseur 48 volts/12 volts CC/CC
    destiné à équiper les voitures particulières et les véhicules utilitaires
    légers à moteur à combustion classique ainsi que certaines voitures particulières
    et certains véhicules utilitaires légers hybrides électriques, en tant que
    technologie innovante, conformément au règlement (UE) 2019/631 du Parlement
    européen et du Conseil et par référence au nouveau cycle européen de conduite
    (NEDC)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1102 der Kommission vom 24. Juli 2020
    über die Genehmigung der in effizienten 48-Volt-Motorgeneratoren mit 48V/12V-Gleichspannungswandler
    für Personenkraftwagen mit konventionellem Verbrennungsmotor und bestimmte Personenkraftwagen
    und leichte Nutzfahrzeuge mit Hybridelektroantrieb verwendeten Technologie als
    innovative Technologie gemäß der Verordnung (EU) 2019/631 des Europäischen
    Parlaments und des Rates mit Bezugnahme auf den neuen Europäischen Fahrzyklus
    (NEFZ)
  type: main
- language: bg
  script: Cyrl
