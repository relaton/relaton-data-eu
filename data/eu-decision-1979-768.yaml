title:
- language: en
  script: Latn
  content: '79/768/EEC: Commission Decision of 23 August 1979 authorizing the Italian
    Republic not to apply Community treatment to transistors, falling within heading
    No ex 85.21 of the Common Customs Tariff (NIMEXE code 85.21- 51) (subdivision
    1), originating in Japan and in free circulation in the other Member States (Only
    the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/768/CEE: Décision de la Commission, du 23 août 1979, autorisant la
    République italienne à exclure du traitement communautaire les transistors,
    de la position ex 85.21 du tarif douanier commun (codes Nimexe : 85.21- 51, 1),
    originaires du Japon et mis en libre pratique dans les autres Etats membres (Le
    texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/768/EWG: Entscheidung der Kommission vom 23. August 1979, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Transistoren der Tarifnummer ex
    85.21 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 85.21-51 ; 1) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/768/EØF: Kommissionens beslutning af 23. august 1979 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage transistorer,
    som henhører under pos. ex 85.21 i den fælles toldtarif (NIMEXE-nummer 85.21-51,
    1), har oprindelse i Japan og frit kan omsættes i de øvrige medlemsstater (Kun
    den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/768/CEE: Decisione della Commissione, del 23 agosto 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i transistori
    della voce ex 85.21 della tariffa doganale comune (codice Nimexe: 85.21-51), originari
    del Giappone e messi in libera pratica negli altri Stati membri (Il testo in lingua
    italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/768/EEG: Beschikking van de Commissie van 23 augustus 1979 waarbij
    de Italiaanse Republiek wordt gemachtigd transistors, van post ex 85.21 van het
    gemeenschappelijk douanetarief (NIMEXE-code 85.21-51, 1), van oorsprong uit Japan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
