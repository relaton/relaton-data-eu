id: EURegulation19261996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1926/96 of 7 October 1996 establishing certain
    concessions in the form of Community tariff quotas for certain agricultural products
    and providing for the adjustment, as an autonomous and transitional measure, of
    certain agricultural concessions provided for in the agreements on free trade
    and trade-related matters with Estonia, Latvia and Lithuania, to take account
    of the Agreement on Agriculture concluded during the Uruguay Round Multilateral
    Trade Negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1926/96 du Conseil du 7 octobre 1996 établissant certaines
    concessions sous forme de contingents tarifaires communautaires pour certains
    produits agricoles et prévoyant l'adaptation autonome et transitoire de certaines
    concessions agricoles prévues par les accords sur la libéralisation des échanges
    et l'institution de mesures d'accompagnement avec l'Estonie, la Lettonie et la
    Lituanie, afin de tenir compte de l'accord sur l'agriculture conclu dans le cadre
    des négociations commerciales multilatérales du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1926/96 des Rates vom 7. Oktober 1996 über Zugeständnisse
    in Form von gemeinschaftlichen Zollkontingenten für bestimmte landwirtschaftliche
    Erzeugnisse und über die autonome, befristete Anpassung bestimmter Zugeständnisse
    für landwirtschaftliche Erzeugnisse gemäß den Abkommen über Freihandel und
    Handelsfragen mit Estland, Lettland und Litauen im Anschluß an das in den multilateralen
    Handelsverhandlungen der Uruguay-Runde geschlossene Übereinkommen über die Landwirtschaft
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 1926/96 af 7. oktober 1996 om indrømmelser
    i form af EF-toldkontingenter for bestemte landbrugsprodukter og om justering,
    som en autonom overgangsforanstaltning, af indrømmelser på landbrugsområdet,
    jf. aftalerne om frihandel og handelsanliggender med Estland, Letland og Litauen,
    for at tage hensyn til aftalen om landbrug indgået under Uruguay-rundens multilaterale
    handelsforhandlinger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1926/96 του Συμβουλίου
    της 7ης Οκτωβρίου 1996 για τη θέσπιση ορισμένων
    παραχωρήσεων υπό μορφή κοινοτικών δασμολογικών
    ποσοστώσεων για ορισμένα γεωργικά προϊόντα
    και για την αυτόνομη και μεταβατική προσαρμογή
    ορισμένων παραχωρήσεων που αφορούν γεωργικά
    προϊόντα και προβλέπονται στις συμφωνίες ελευθέρων
    συναλλαγών και εμπορικών θεμάτων με την Εσθονία,
    τη Λετονία και τη Λιθουανία, ώστε να τηρηθεί
    η συμφωνία περί γεωργίας η οποία συνήφθη κατά
    τις πολυμερείς εμπορικές διαπραγματεύσεις
    του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1926/96, annettu 7 päivänä lokakuuta 1996,
    tietyille maataloustuotteille yhteisön tariffikiintiöinä annetuista tietyistä
    myönnytyksistä ja Viron, Latvian ja Liettuan kanssa tehdyissä vapaakauppaa
    ja kaupan liitännäistoimenpiteitä koskevissa sopimuksissa määrättyjen tiettyjen
    maataloutta koskevien myönnytysten autonomisesta ja väliaikaisesta mukauttamisesta
    Uruguayn kierroksen monenvälisten kauppaneuvottelujen osana tehdyn maataloussopimuksen
    huomioon ottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1926/96 del Consiglio del 7 ottobre 1996 che stabilisce
    talune concessioni sotto forma di contingenti tariffari comunitari per taluni
    prodotti agricoli e prevede l'adeguamento autonomo e transitorio di talune concessioni
    agricole previste dagli accordi con l'Estonia, la Lettonia e la Lituania sul libero
    scambio e sull'istituzione di misure di accompagnamento, al fine di tener conto
    dell'accordo sull'agricoltura concluso nel quadro dei negoziati commerciali multilaterali
    dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1926/96 van de Raad van 7 oktober 1996 houdende vaststelling,
    in verband met de in het kader van de multilaterale handelsbesprekingen van de
    Uruguay-Ronde gesloten Overeenkomst inzake de landbouw, van bepaalde concessies
    in de vorm van communautaire tariefcontingenten voor bepaalde landbouwprodukten
    en van een autonome overgangsregeling tot aanpassing van bepaalde landbouwconcessies
    die zijn opgenomen in de Overeenkomsten met Estland, Letland en Litouwen betreffende
    vrijhandel en met handel verband houdende zaken
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1926/96 do Conselho de 7 de Outubro de 1996 que estabelece
    determinadas concessões sob a forma de contingentes pautais comunitários para
    certos produtos agrícolas e que prevê a adaptação, a título autónomo e transitório,
    de certas concessões agrícolas previstas nos acordos sobre comércio livre e
    matérias conexas com a Estónia, Letónia e Lituânia para ter em conta o Acordo
    sobre a agricultura concluído no âmbito das negociações comerciais multilaterais
    do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1926/96 del Consejo de 7 de octubre de 1996 por el
    que se establecen determinadas concesiones en forma de contingentes arancelarios
    comunitarios para determinados productos agrícolas y se adaptan, con carácter
    autónomo y transitorio, determinadas concesiones agrícolas previstas en los
    Acuerdos sobre libre comercio y medidas de acompañamiento celebrados con Estonia,
    Letonia y Lituania con el fin de tener en cuenta el Acuerdo de agricultura celebrado
    en el marco de las negociaciones comerciales multilaterales de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1926/96 av den 7 oktober 1996 om vissa koncessioner
    i form av gemenskapstullkvoter för vissa jordbruksprodukter och om anpassning,
    som autonom övergångsåtgärd, av vissa jordbrukskoncessioner enligt avtalen
    om frihandel och handelsrelaterade frågor med Estland, Lettland och Litauen så
    att det jordbruksavtal beaktas som ingicks under Uruguayrundans multilaterala
    handelsförhandlingar
  type: main
