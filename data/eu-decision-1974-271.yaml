id: EUDecision1974271
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 March 1974 authorizing the French Republic not
    to apply Community treatment to certain petroleum products falling within CCT
    heading Nos 27.09 and 27.10, originating in third countries, and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/271/CEE de la Commission, du 6 mars 1974, autorisant la République
    française à exclure du traitement communautaire certains produits pétroliers,
    des positions 27.09 et 27.10 du Tarif douanier commun, originaires des pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. März 1974, wodurch die Französische
    Republik ermächtigt wird, bestimmte Erdölerzeugnisse der Nummern 27.09 und 27.10
    des Gemeinsamen Zolltarifs mit Ursprung in dritten Ländern, die sich in den übrigen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. marts 1974 om tilladelse for Den franske
    Republik til ikke at underkaste visse mineralske olieprodukter, henhørende under
    position 27.09 og 27.10 i D.F.T. med oprindelse i tredje lande og overgået til
    fri omsætning i de andre medlemsstater, fællesskabsbehandling
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 marzo 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario taluni prodotti petroliferi
    delle voci 27.09 e 27.10 della tariffa doganale comune, originari dei paesi terzi
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 maart 1974 waarbij de Franse Republiek
    wordt gemachtigd bepaalde aardolieprodukten van de posten 27.09 en 27.10 van het
    gemeenschappelijk douanetarief, van oorsprong uit derde landen en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
