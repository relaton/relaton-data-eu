title:
- language: en
  script: Latn
  content: '79/931/EEC: Commission Decision of 19 October 1979 authorizing the Federal
    Republic of Germany not to apply Community treatment to woven fabrics of cotton,
    other than gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille
    fabrics, tulle and other net fabrics, falling within heading No 55.09 of the Common
    Customs Tariff (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16,
    17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59,
    61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84,
    86, 87, 92, 93, 97) (category 2), originating in South Korea and in free circulation
    in the other Member States (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/931/CEE: Décision de la Commission, du 19 octobre 1979, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les tissus de coton autres que tissus à point de gaze, bouclés du genre éponge,
    rubanerie, velours, peluches, tissus bouclés, tissus de chenille, tulles et tissus
    à mailles nouées de la position 55.09 du tarif douanier commun (codes Nimexe:
    55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35,
    37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68,
    69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) (catégorie
    2), originaires de la Corée du Sud et mis en libre pratique dans les autres États
    membres (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/931/EWG: Entscheidung der Kommission vom 19. Oktober 1979, mit der
    die Bundesrepublik Deutschland ermächtigt wird, aus Südkorea stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle,
    andere als Drehergewebe, Schlingengewebe (Frottiergewebe), Bänder, Samt, Plüsch,
    Schlingengewebe, Chenillegewebe, Tülle und geknüpfte Netzstoffe der Tarifnummer
    55.09 des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 55.09-01, 02, 03, 04, 05,
    11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52,
    53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76,
    77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) (Kategorie 2) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/931/EØF: Kommissionens beslutning af 19. oktober 1979 om bemyndigelse
    af Forbundsrepublikken Tyskland til fra fællesskabsbehandling at undtage vævede
    stoffer af bomuld, bortset fra drejervævet stof af bomuld, frotterstof, vævede
    bånd, fløjls-, plys og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos. 55.09 i den fælles toldtarif (NIMEXE-nummer 55.09-01, 02, 03, 04,
    05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51,
    52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74,
    76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97 ; kategori 2), har oprindelse i
    Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den tyske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/931/CEE: Decisione della Commissione, del 19 ottobre 1979, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario i
    tessuti di cotone, diversi da quelli a punto di garza, ricci del tipo spugna,
    passamaneria, velluti, felpe, tessuti di ciniglia, tulli e tessuti a maglie annodate,
    della voce 55.09 della tariffa doganale comune (codici Nimexe: 55.09-01, 02, 03,
    04, 05, 11,12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49,
    51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73,
    74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97), categoria 2, originari della
    Corea del Sud e messi in libera pratica negli altri Stati membri (Il testo in
    lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/931/EEG: Beschikking van de Commissie van 19 oktober 1979 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd weefsels van katoen, andere dan weefsels
    met gaasbinding, bad- of frotteerstof (lussendoek), lint, fluweel, pluche, lussenweefsel,
