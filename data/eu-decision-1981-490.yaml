title:
- language: en
  script: Latn
  content: '81/490/EEC: Commission Decision of 14 May 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''pyjamas, knitted or crocheted,
    originating in Romania (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/490/CEE: Décision de la Commission, du 14 mai 1981, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les pyjamas de bonneterie, pour hommes
    et garçonnets, originaires de Roumanie (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/490/EWG: Entscheidung der Kommission vom 14. Mai 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Rumänien stammende Schlafanzüge aus Gewirken für Männer und
    Knaben von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/490/EØF: Kommissionens beslutning af 14. maj 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage pyjamas af trikotage til mænd og drenge,
    med oprindelse i Rumænien (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/490/ΕΟΚ: Απόφαση τής Επιτροπής τής 14ης
    Μαΐου 1981 βάσει τής οποίας εξουσιοδοτούνται
    τό Βασίλειο τού Βελγίου, τό Μεγάλο Δουκάτο
    τού Λουξεμβούργου καί τό Βασίλειο τών Κάτω
    Χωρών νά εξαιρέσουν από τήν κοινοτική μεταχείριση
    τίς πλεκτές πυζάμες γιά άνδρες καί μικρά παιδιά,
    καταγωγής Ρουμανίας (Τα κείμενα στην γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/490/CEE: Decisione della Commissione, del 14 maggio 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i pigiami a maglia, per uomo e per ragazzo,
    originari della Romania (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/490/EEG: Beschikking van de Commissie van 14 mei 1981 houdende machtiging
