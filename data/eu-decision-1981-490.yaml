    Nederlanden om pyjama''s van brei- of haakwerk voor heren en jongens van oorsprong
    uit Roemenië van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
