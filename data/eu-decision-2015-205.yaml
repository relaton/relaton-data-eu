  script: Latn
  content: Commission Implementing Decision (EU) 2015/205 of 6 February 2015 amending
    Decision 2006/415/EC on protective measures in relation to an outbreak of highly
    pathogenic avian influenza of the subtype H5N1 in poultry in Bulgaria (notified
    under document C(2015) 699)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/205 de la Commission du 6 février 2015
    modifiant la décision 2006/415/CE en ce qui concerne des mesures de protection
