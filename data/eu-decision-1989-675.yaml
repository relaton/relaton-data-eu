title:
- language: en
  script: Latn
  content: '89/675/EEC: Council Decision of 18 December 1989 on the conclusion of
    the Agreement in the form of an exchange of letters concerning the provisional
    application of the protocol establishing for the period 16 June 1989 to 15 June
    1991 the fishing rights and financial compensation provided for in the Agreement
    between the European Economic Community and the government of the Republic of
    Guinea-Bissau on fishing off the coast of Guinea-Bissau'
  type: main
- language: fr
  script: Latn
  content: '89/675/CEE: Décision du Conseil du 18 décembre 1989, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pèche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée-Bissau concernant la pèche au large de la côte
    de Guinée-Bissau pour la période du 16 juin 1989 au 15 juin 1991'
  type: main
- language: de
  script: Latn
  content: '89/675/EWG: BESCHLUSS DES RATES VOM 18. DEZEMBER 1989 UEBER DEN ABSCHLUSS
