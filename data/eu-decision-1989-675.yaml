    AF DE FISKERIMULIGHEDER OG DEN FINANSIELLE GODTGOERELSE, DER ER OMHANDLET I AFTALEN
    MELLEM DET EUROPAEISKE OEKONOMISKE FAELLESSKAB OG REGERINGEN FOR REPUBLIKKEN GUINEA-BISSAU
    OM FISKERI UD FOR GUINEA-BISSAUS KYST, FOR PERIODEN FRA DEN 16. JUNI 1989 TIL
    DEN 15. JUNI 1991'
  type: main
- language: el
  script: Grek
