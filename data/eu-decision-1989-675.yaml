    υπό μορφή ανταλλαγής επιστολών για την προσωρινή
    εφαρμογή του πρωτοκόλλου για τον καθορισμό
    των δυνατοτήτων αλιείας και της χρηματικής
    αντιστάθμισης που προβλέπονται στη συμφωνία
