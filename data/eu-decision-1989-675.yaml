    Μπισάου περί της αλιείας στα ανοικτά των ακτών
    της Γουινέας- Μπισάου για την περίοδο από τις
    16 Ιουνίου 1989 έως τις 15 Ιουνίου 1991'
  type: main
- language: it
  script: Latn
  content: '89/675/CEE: DECISIONE DEL CONSIGLIO, DEL 18 DICEMBRE 1989, CONCERNENTE
