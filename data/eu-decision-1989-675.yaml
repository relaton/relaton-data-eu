    PROTOKOLLS ZUR FESTSETZUNG DER FANGMOEGLICHKEITEN UND DES FINANZIELLEN AUSGLEICHS
    NACH DEM ABKOMMEN ZWISCHEN DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DER REGIERUNG
    DER REPUBLIK GUINEA-BISSAU UEBER DIE FISCHEREI VOR DER KUESTE GUINEA-BISSAUS FUER
    DIE ZEIT VOM 16. JUNI 1989 BIS 15. JUNI 1991'
  type: main
