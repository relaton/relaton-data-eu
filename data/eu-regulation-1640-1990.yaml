  content: Commission Regulation (EEC) No 1640/90 of 18 June 1990 abolishing the corrective
    amount on the import of apricots into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1640/90 de la Commission, du 18 juin 1990, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix d'abricots en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1640/90 der Kommission vom 18. Juni 1990 zur Aufhebung
