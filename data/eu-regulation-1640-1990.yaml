    in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1640/90 af 18. juni 1990 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af abrikoser
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1640/90 της Επιτροπής
    της 18ης Ιουνίου 1990 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή
    στην Κοινότητα των Δέκα βερικόκων από την Ισπανία,
    εκτός των Καναρίων Νήσων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1640/90 della Commissione, del 18 giugno 1990, che
    sopprime l'importo correttore da riscuotere all'importazione nella Comunità a
    dieci di albicocche in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1640/90 van de Commissie van 18 juni 1990 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van abrikozen
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1640/90 da Comissão, de 18 de Junho de 1990, que
    suprime o montante corrector a cobrar aquando da importação na Comunidade a
    Dez de alperces provenientes de Espanha, com excepção das ilhas Canárias
  type: main
- language: es
  script: Latn
