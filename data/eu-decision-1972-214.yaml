title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 mai 1972, autorisant la République française
    à exclure du traitement communautaire l'urée, de la position 31.02 B du Tarif
    douanier commun, originaire de Pologne et mise en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '72/214/EWG: Entscheidung der Kommission vom 5. Mai 1972, mit der die Französische
    Republik ermächtigt wird, aus Polen stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Harnstoffe der Tarifnummer 31.02 B des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/214/CEE: Decisione della Commissione, del 5 maggio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario l''urea della
    voce n. 31.02 B della tariffa doganale comune, originaria della Polonia e messa
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/214/EEG: Beschikking van de Commissie van 5 mei 1972 waarbij de Franse
    Republiek wordt gemachtigd ureum van post 31.02 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Polen en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
