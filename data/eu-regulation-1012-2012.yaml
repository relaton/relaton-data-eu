    muuttamisesta tartunnanlevittäjälajien luettelon ja epitsoottista ulseratiivista
    syndroomaa koskevien terveys- ja todistusvaatimusten osalta sekä siltä osin
    kuin on kyse Thaimaata koskevasta kohdasta niiden kolmansien maiden luettelossa,
    joista on sallittua tuoda unioniin tiettyjä kala- ja kalastustuotteita
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1012/2012 od 5. studenoga 2012. o izmjeni
    Uredbe (EZ) br. 2074/2005 i Uredbe (EZ) br. 1251/2008 u pogledu popisa vektorskih
    vrsta, zdravstvenih zahtjeva i zahtjeva za certificiranje u vezi s epizootskim
    ulcerativnim sindromom i u pogledu unosa Tajlanda na popis trećih zemalja iz
    kojih je dopušten uvoz određenih riba i proizvoda ribarstva u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1012/2012/EU végrehajtási rendelete ( 2012. november 5.
    ) a 2074/2005/EK és a 1251/2008/EK rendeletnek a kórokozó-átvivő fajok jegyzékének,
    a járványos fekélybetegségre vonatkozó egészségügyi feltételeknek és
    bizonyítványkiállítási követelményeknek, valamint a bizonyos halak és
    halászati termékek Unióba történő behozatalára feljogosított harmadik
    országok jegyzékének Thaiföldre vonatkozó bejegyzése tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1012/2012 della Commissione, del 5 novembre
    2012 , che modifica il regolamento (CE) n. 2074/2005 e il regolamento (CE) n.
    1251/2008 per quanto riguarda l'elenco delle specie vettrici, le condizioni di
    polizia sanitaria e le condizioni di certificazione concernenti la sindrome ulcerativa
    epizootica e per quanto riguarda l'inserimento della Thailandia nell'elenco dei
    paesi terzi dai quali sono autorizzate le importazioni di determinati pesci e
    prodotti della pesca verso l'Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1012/2012 ( 2012. gada 5. novembris
    ), ar kuru Regulā (EK) Nr. 2074/2005 un Regulā (EK) Nr. 1251/2008 izdara grozījumus
    attiecībā uz pārnēsātājsugu sarakstu, veselības prasībām un sertifikācijas
    prasībām, kas saistītas ar epizootisko čūlu sindromu, un attiecībā uz Taizemes
    iekļaušanu to trešo valstu sarakstā, no kurām atļauts importēt Savienībā
    konkrētas zivis un zvejniecības produktus
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 5 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1012/2012,
    kuriuo dėl gyvūnų platintojų rūšių sąrašo, sveikatos reikalavimų ir
    sertifikavimo reikalavimų, susijusių su epizootiniu opiniu sindromu, ir dėl
    Tailandui skirto įrašo trečiųjų šalių, iš kurių leidžiama importuoti
    į Sąjungą tam tikras žuvis ir žuvininkystės produktus, sąraše iš dalies
    keičiamas Reglamentas (EB) Nr. 2074/2005 ir Reglamentas (EB) Nr. 1251/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 1012/2012 tal-
    5 ta’ Novembru 2012 li jemenda r-Regolament (KE) Nru 2074/2005 u r-Regolament
    (KE) Nru 1251/2008 fir-rigward tal-lista ta' speċijiet li jgħaddu l-mard, ir-rekwiżiti
    tas-saħħa u r-rekwiżiti ta' ċertifikazzjoni li jikkonċernaw is-sindromu ulċerattiv
    epiżotiku u rigward l-annotazzjoni għat-Tajlandja fil-lista ta' pajjiżi terzi
    li minnhom l-importazzjonijiet ta' ċertu ħut u prodotti tas-sajd fl-Unjoni huma
    permessi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1012/2012 van de Commissie van 5 november
    2012 tot wijziging van Verordening (EG) nr. 2074/2005 en Verordening (EG) nr.
    1251/2008 wat betreft de lijst van vectorsoorten, de veterinairrechtelijke voorschriften
    en de certificeringsvoorschriften betreffende het epizoötisch ulceratief syndroom
    en wat betreft de vermelding van Thailand in de lijst van derde landen waaruit
    bepaalde vissen en visserijproducten in de Unie mogen worden ingevoerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1012/2012 z dnia 5 listopada
    2012 r. zmieniające rozporządzenie (WE) nr 2074/2005 i rozporządzenie (WE)
    nr 1251/2008 w odniesieniu do wykazu gatunków-wektorów, wymogów dotyczących
    zdrowia i wymagań certyfikacji dotyczących zakaźnego zespołu owrzodzenia oraz
    w odniesieniu do pozycji dotyczącej Tajlandii w wykazie państw trzecich, z których
    dozwolony jest przywóz do Unii niektórych ryb i produktów rybołówstwa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1012/2012 da Comissão, de 5 de novembro
    de 2012 , que altera o Regulamento (CE) n. ° 2074/2005 e o Regulamento (CE) n.
    ° 1251/2008 no que diz respeito à lista de espécies vetoras, aos requisitos
    de saúde e aos requisitos de certificação aplicáveis à síndrome ulcerativa
    epizoótica e no que diz respeito à entrada relativa à Tailândia na lista de
    países terceiros a partir dos quais são permitidas as importações de determinados
    peixes e produtos da pesca na União Europeia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1012/2012 al Comisiei din
    5 noiembrie 2012 de modificare a Regulamentului (CE) nr. 2074/2005 și a Regulamentului
    (CE) nr. 1251/2008 în ceea ce privește lista speciilor vectori, cerințele de
    sănătate animală și cerințele de certificare referitoare la sindromul ulcerativ
    epizootic și în ceea ce privește rubrica pentru Thailanda din lista de țări
    terțe din care sunt permise importurile de anumite specii de pești și produse
    pescărești în Uniune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1012/2012 z 5. novembra 2012
    , ktorým sa mení a dopĺňa nariadenie (ES) č. 2074/2005 a nariadenie (ES)
    č. 1251/2008, pokiaľ ide o zoznam druhov prenášačov, veterinárne požiadavky
    a požiadavky na certifikáciu v súvislosti s epizootickým ulceróznym syndrómom,
    ako aj o zaradenie Thajska do zoznamu tretích krajín, z ktorých je povolené
    dovážať určité druhy rýb a produkty rybolovu do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1012/2012 z dne 5. novembra 2012 o
    spremembi Uredbe (ES) št. 2074/2005 in Uredbe (ES) št. 1251/2008 glede seznama
    vektorskih vrst, zahtev za zdravstveno varstvo živali in pogojev za izdajanje
    spričeval v zvezi z epizootskim ulcerativnim sindromom ter glede vnosa za Tajsko
    na seznam tretjih držav, iz katerih je dovoljen uvoz nekaterih rib in ribiških
    proizvodov v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 1012/2012 de la Comisión, de 5 de noviembre
    de 2012 , que modifica el Reglamento (CE) n ° 2074/2005 y el Reglamento (CE)
    n ° 1251/2008 en cuanto a la lista de las especies portadoras, los requisitos
    zoosanitarios y los requisitos de certificación del síndrome ulceroso epizoótico
    y en cuanto a la entrada correspondiente a Tailandia en la lista de terceros países
    desde los que se autorizan las importaciones en la Unión de determinados peces
    y productos de la pesca
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1012/2012 av den 5 november
    2012 om ändring av förordningarna (EG) nr 2074/2005 och (EG) nr 1251/2008 vad
    gäller förteckningen över smittbärande arter, djurhälsokrav och intygskrav
    avseende epizootiskt ulcerativt syndrom samt vad gäller uppgifterna om Thailand
    i förteckningen över tredjeländer från vilka det är tillåtet att importera
    vissa fiskarter och fiskeriprodukter till unionen
  type: main
