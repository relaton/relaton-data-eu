title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1012/2012 of 5 November 2012
    amending Regulation (EC) No 2074/2005 and Regulation (EC) No 1251/2008 as regards
    the list of vector species, the health requirements and the certification requirements
    concerning epizootic ulcerative syndrome and as regards the entry for Thailand
    in the list of third countries from which imports of certain fish and fishery
    products into the Union are permitted
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 1012/2012 de la Commission du 5 novembre
    2012 modifiant le règlement (CE) n ° 2074/2005 et le règlement (CE) n ° 1251/2008
    en ce qui concerne la liste des espèces vectrices, les conditions de police sanitaire
    et de certification relatives au syndrome ulcératif épizootique et en ce qui
    concerne l’inscription relative à la Thaïlande dans la liste des pays tiers
    en provenance desquels certains poissons et produits de la pêche peuvent être
    importés dans l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1012/2012 der Kommission vom 5. November
    2012 zur Änderung der Verordnung (EG) Nr. 2074/2005 und der Verordnung (EG) Nr.
    1251/2008 hinsichtlich der Liste der Überträgerarten, der Gesundheits- und Bescheinigungsanforderungen
    bei epizootischem ulzerativem Syndrom sowie hinsichtlich des Eintrags für Thailand
    in der Liste von Drittländern, aus denen die Einfuhr bestimmter Fische und Fischereierzeugnisse
    in die EU gestattet ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1012/2012 на
    Комисията от 5 ноември 2012 година за изменение
    на Регламент (ЕО) № 2074/2005 и Регламент (ЕО) №
    1251/2008 по отношение на списъка с векторни видове,
    здравните изисквания и изискванията за сертифициране
    във връзка с епизоотичния улцеративен синдром
    и по отношение на вписването на Тайланд в списъка
    с трети страни, от които е разрешен вносът на
    някои риби и рибни продукти в Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1012/2012 ze dne 5. listopadu
    2012 , kterým se mění nařízení (ES) č. 2074/2005 a nařízení (ES) č.
    1251/2008, pokud jde o seznam druhů přenašečů, zdravotní požadavky a požadavky
    na osvědčení, které se týkají epizootického vředového syndromu, a pokud
    jde o položku pro Thajsko uvedenou na seznamu třetích zemí, z nichž je povolen
    dovoz některých ryb a produktů rybolovu do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 1012/2012 af 5. november
