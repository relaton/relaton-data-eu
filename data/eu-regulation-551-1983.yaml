title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 551/83 of 8 March 1983 imposing a definitive
    anti-dumping duty on kraftliner paper and board originating in the United States
    of America and accepting undertakings given in connection with the review of the
    anti-dumping proceeding on kraftliner paper and board originating in Austria,
    Canada, Finland, Portugal, the Soviet Union and Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 551/83 du Conseil du 8 mars 1983 portant institution
    d' un droit anti-"dumping" définitif sur le papier et le carton kraft originaires
    des États-Unis d' Amérique et acceptation des engagements offerts dans le cadre
    du réexamen de la procédure anti-"dumping" concernant le papier et le carton
    kraft originaires d' Autriche, du Canada, de Finlande, du Portugal, d' Union soviétique
    et de Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 551/83 des Rates vom 8. März 1983 zur Einführung
    eines endgültigen Antidumpingzolls für Kraftpapier und Kraftpappe mit Ursprung
    in den Vereinigten Staaten von Amerika und zur Annahme von Verpflichtungen im
    Zusammenhang mit der Überprüfung des Antidumpingverfahrens betreffend Kraftpapier
    und Kraftpappe mit Ursprung in Österreich, Kanada, Finnland, Portugal, der Sowjetunion
    und Schweden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 551/83 af 8. marts 1983 om indførelse af
    en endelig antidumpingtold på kraftliner med oprindelse i Amerikas Forenede Stater
    og om godtagelse af tilsagn afgivet i forbindelse med den fornyede undersøgelse
    af antidumpingproduren vedrørende kraftliner med oprindelse i Canada, Finland,
    Portugal, Sovjetunionen, Sverige og Østrig
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 551/83 του Συμβουλίου
    της 8ης Μαρτίου 1983 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ επί του χάρτου και του
    χαρτονίου kraft καταγωγής Ηνωμένων Πολιτειών
    Αμερικής και την αποδοχή της προσφοράς αναλήψεως
    υποχρεώσεως στα πλαίσια της επανεξέτασης της
    διαδικασίας αντιντάμπινγκ σχετικά με τις εισαγωγές
    χάρτου και χαρτονίου kraft καταγωγής Αυτρίας,
    Καναδά, Φινλανδίας, Πορτογαλίας, Σοβιετικής
    Ένωσης και Σουηδίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 551/83 del Consiglio dell' 8 marzo 1983 che istituisce
    un dazio antidumping definitivo su carte e cartoni kraft per copertine, cosiddetti
    "kraftliner", originari degli Stati Uniti d' America e che accetta gli impegni
    offerti nell' ambito del riesame della procedura antidumping relativa a carte
    e cartoni kraft per copertina, cosiddetti "kraftliner", originari dell' Austria,
    del Canada, della Finlandia, del Portogallo, dell' Unione Sovietica e della Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 551/83 van de Raad van 8 maart 1983 houdende instelling
    van een definitief anti-dumpingrecht op kraftpapier en kraftkarton van oorsprong
    uit de Verenigde Staten van Amerika en aanvaarding van verbintenissen in verband
    met de herziening van de anti-dumpingprocedure voor kraftpapier en kraftkarton
    van oorsprong uit Canada, Finland, Oostenrijk, Portugal, de Sowjetunie en Zweden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 551/83 do Conselho, de 8 de Março de 1983, que
    institui um direito "anti-dumping" definitivo sobre o papel e o cartão "Kraft"
    originários dos Estados Unidos da América e que aceita compromissos oferecidos
    no âmbito do reexame do processo "anti-dumping" relativo ao papel e ao cartão
    "Kraft" originários da Áustria, do Canadá, da Finlândia, de Portugal, da União
    Soviética e da Suécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 551/83 del Consejo, de 8 de marzo de 1983, por el
    que se establece un derecho antidumping definitivo sobre el papel y el cartón
    kraft originarios de los Estados Unidos de América y se aceptan los compromisos
    ofrecidos en el marco de la reconsideración del procedimiento antidumping relativo
    al papel y al cartón kraft originarios de Austria, Canadá, Finlandia, Portugal,
    Unión Soviética y Suecia
