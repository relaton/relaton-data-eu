title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1266/90 of 14 May 1990 abolishing the corrective
    amount on the import of aubergines into the Community of Ten from Spain (except
    the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1266/90 de la Commission, du 14 mai 1990, supprimant
    le montant correcteur à percevoir lors de l'importation dans la Communauté à
    dix d'aubergines en provenance d'Espagne (à l'exception des îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1266/90 der Kommission vom 14. Mai 1990 zur Aufhebung
    des bei der Einfuhr von Auberginen aus Spanien (mit Ausnahme der Kanarischen Inseln)
    in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1266/90 af 14. maj 1990 om afskaffelse
    af det korrektionsbeløb, der skal opkræves ved indførsel til De Ti af auberginer
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1266/90 της Επιτροπής
    της 14ης Μαΐου 1990 για την κατάργηση του διορθωτικού
    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή
    στην Κοινότητα των Δέκα μελιτζάνων από την
    Ισπανία, εκτός των Καναρίων Νήσων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1266/90 della Commissione, del 14 maggio 1990, che
    sopprime l'importo correttore da riscuotere all'importazione nella Comunità a
    dieci di melanzane in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1266/90 van de Commissie van 14 mei 1990 tot intrekking
    van het correctiebedrag bij invoer in de Gemeenschap van de Tien van aubergines
    van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1266/90 da Comissão, de 14 de Maio de 1990, que
    suprime o montante corrector a cobrar aquando da importação na Comunidade a
    Dez de beringelas provenientes de Espanha, com excepção das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1266/90 de la Comisión, de 14 de mayo de 1990, por
    el que se suprime el importe corrector que deberá percibirse por las importaciones
    en la Comunidad de los Diez de berenjenas procedentes de España (excepto las
    Islas Canarias)
  type: main
