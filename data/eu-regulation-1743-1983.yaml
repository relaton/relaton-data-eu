title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1743/83 of 28 June 1983 re-establishing
    the levying of customs duties on other bovine cattle leather, falling within subheading
    41.02 ex C and originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1743/83 de la Commission du 28 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux autres cuirs et peaux de
    bovins, de la sous-position 41.02 ex C du tarif douanier commun, originaires du
    Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1743/83 der Kommission vom 28. Juni 1983 zur Wiedereinführung
    der Erhebung der Zölle für anderes Rind- und Kalbleder der Tarifstelle 41.02
    ex C, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3377/82 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1743/83 af 28. juni 1983 om genindførelse
    af opkrævning af told for andet læder af kvæghuder og læder af hestehuder
    henhørende under pos. 41.02 ex C og med oprindelse i Pakistan, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1743/83 της Επιτροπής
    της 28ης Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για έτερα σκύτη και δέρματα
    βοοειδών της διακρίσεως 41.02 ex Γ του Κοινού Δασμολογίου,
    καταγωγής Πακιστάν, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1743/83 della Commissione del 28 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli altri cuoi e pelli di bovini
    della sottovoce 41.02 ex C della tariffa doganale comune, originari del Pakistan
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1743/83 van de Commissie van 28 juni 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander leder
    van runderen van postonderverdeling 41.02 ex C van oorsprong uit Pakistan waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
