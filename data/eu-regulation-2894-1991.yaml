    und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen Clementinen,
    für das Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2894/91 af 1. oktober 1991 om fastsættelse
