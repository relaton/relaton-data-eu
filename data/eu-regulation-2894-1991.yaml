  script: Latn
  content: Commission Regulation (EEC) No 2894/91 of 1 October 1991 fixing for the
    1991/92 marketing year the reference price for mandarins, including tangerines
    and satsumas, wilkings and other similar citrus hybrids, with the exception of
    clementines
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2894/91 DE LA COMMISSION du 1er octobre 1991 fixant
