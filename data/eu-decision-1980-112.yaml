  content: '80/112/EEC: Commission Decision of 20 December 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Belgium of premiums paid
    during 1978 for the conversion of dairy herds to meat production (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/112/CEE: Décision de la Commission, du 20 décembre 1979, relative
