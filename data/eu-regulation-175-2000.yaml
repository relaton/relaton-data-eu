title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 175/2000 of 24 January 2000 reimposing a definitive
    anti-dumping duty on imports of leather handbags originating in the People's Republic
    of China and sold for export to the Community by certain exporting producers and
    amending Regulation (EC) No 1567/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 175/2000 du Conseil, du 24 janvier 2000, rétablissant
    un droit antidumping définitif sur les importations de sacs à main en cuir originaires
    de la République populaire de Chine et vendus à l'exportation vers la Communauté
    par certains producteurs-exportateurs, et modifiant le règlement (CE) nº 1567/97
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 175/2000 des Rates vom 24. Januar 2000 zur Wiedereinführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Handtaschen aus Leder
    mit Ursprung in der Volksrepublik China, die von bestimmten ausführenden Herstellern
    zur Ausfuhr in die Gemeinschaft verkauft werden, und zur Änderung der Verordnung
    (EG) Nr. 1567/97
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 175/2000 af 24. januar 2000 om genindførelse
    af en endelig antidumpingtold på importen af håndtasker af læder med oprindelse
    i Folkerepublikken Kina og solgt med henblik på eksport til Fællesskabet af
    visse eksporterende producenter og om ændring af forordning (EF) nr. 1567/97
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 175/2000 του Συμβουλίου,
    της 24ης Ιανουαρίου 2000, για την εκ νέου επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    σακιδίων χεριού από δέρμα καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας τα οποία πωλούνται προς
    εξαγωγή στην Κοινότητα από ορισμένους παραγωγούς
    εξαγωγείς και για την τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 1567/97
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 175/2000, annettu 24 päivänä tammikuuta 2000,
    lopullisen polkumyyntitullin uudelleen ottamisesta käyttöön sellaisten Kiinan
    kansantasavallasta peräisin olevien nahasta valmistettujen käsilaukkujen tuonnissa,
    joita tietyt vientiä harjoittavat tuottajat myyvät yhteisöön vietäviksi,
    ja neuvoston asetuksen (EY) N:o 1567/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 175/2000 del Consiglio, del 24 gennaio 2000, che istituisce
    un nuovo dazio antidumping definitivo sulle importazioni di borsette in cuoio
    originarie della Repubblica popolare cinese esportate nella Comunità da alcuni
    produttori esportatori e che modifica il regolamento (CE) n. 1567/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 175/2000 van de Raad van 24 januari 2000 tot wederinstelling
    van een definitief antidumpingrecht op de invoer van lederen handtassen uit de
    Volksrepubliek China die door een aantal exporterende producenten voor uitvoer
    naar de Gemeenschap verkocht worden en tot wijziging van Verordening (EG) nr.
    1567/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 175/2000 do Conselho, de 24 de Janeiro de 2000, que
    reinstitui um direito anti-dumping definitivo sobre as importações de bolsas
    de couro originárias da República Popular da China e vendidas para exportação
    para a Comunidade por certos produtores-exportadores e que altera o Regulamento
    (CE) n.o 1567/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 175/2000 del Consejo, de 24 de enero de 2000, por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    bolsos de cuero originarios de la República Popular de China y vendidos para
    su exportación a la Comunidad por algunos productores-exportadores y por el que
    se modifica el Reglamento (CE) nº 1567/97
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 175/2000 av den 24 januari 2000 om återinförande
