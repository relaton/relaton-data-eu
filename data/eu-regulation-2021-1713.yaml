    for så vidt angår mindsteafstanden fra kysten og mindstedybden for vod brugt
    fra fartøjer, der fisker efter tobisarter (Gymnammodytes cicerelus og G. semisquamatus)
    og kutlingearter (Aphia minuta og Crystalogobius linearis) i visse spanske territorialfarvande
    (Catalonien)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/1713 της Επιτροπής
