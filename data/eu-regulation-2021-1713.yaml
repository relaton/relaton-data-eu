    по отношение на минималното разстояние от
    брега и минималната морска дълбочина за улов
    на пясъчница (Gymnammodytes cicerelus и G. semisquamatus) и попчета
    (Aphia minuta и Crystalogobius linearis) с лодкови грибове в
    определени териториални води на Испания (Каталуня)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/1713 ze dne 24. září 2021,
    kterým se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud
    jde o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu smačkovitých (Gymnammodytes cicerelus a G. semisquamatus) a hlaváčovitých
    (Aphia minuta a Crystalogobius linearis) v některých teritoriálních vodách
    Španělska (Katalánska)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/1713 af 24. september
