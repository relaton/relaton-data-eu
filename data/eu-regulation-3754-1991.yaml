    Regulation (EEC) No 599/91 and amending Regulation (EEC) No 569/88
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3754/91 DE LA COMMISSION du 20 décembre 1991 relatif
