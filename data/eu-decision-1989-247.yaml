title:
- language: en
  script: Latn
  content: '89/247/EEC: Commission Decision of 28 March 1989 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of isolated bark of conifers originating in California (USA)
    (Only the Danish, German, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/247/CEE: Décision de la Commission du 28 mars 1989 autorisant certains
    Etats membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne l''écorce isolée de conifères originaire
    de Californie (Etats-Unis d''Amérique) (Les textes en langues danoise, allemande,
    française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/247/EWG: Entscheidung der Kommission vom 28. Maerz 1989 zur Ermaechtigung
    bestimmter Mitgliedstaaten, für lose Rinde von Koniferen mit Ursprung in Kalifornien
    (Vereinigte Staaten von Amerika) Ausnahmen von bestimmten Vorschriften der Richtlinie
    77/93/EWG des Rates vorzusehen (Nur der dänische, deutsche, französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/247/EØF: Kommissionens beslutning af 28. marts 1989 om bemyndigelse
    af visse medlemsstater til at undtage loes bark af naaletraeer med oprindelse
    i Californien (USA) fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun
    den danske, tyske, franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '89/247/ΕΟΚ: Απόφαση της Επιτροπής της 28ης
    Μαρτίου 1989 για την παροχή αδείας σε ορισμένα
    κράτη μέλη να προβλέπουν παρεκκλίσεις από
    ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ του
    Συμβουλίου όσον αφορά τους μεμονωμένους φλοιούς
    κωνοφόρων καταγωγής Καλιφόρνιας (ΗΠΑ) (Τα κείμενα
    στην δανική, γερμανική, γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '89/247/CEE: Decisione della Commissione del 28 marzo 1989 che autorizza
    determinati Stati membri a prevedere deroghe a talune disposizioni della direttiva
    77/93/CEE del Consiglio per quanto riguarda la corteccia separata dal tronco di
    conifere originarie della California (USA) (Il testi in lingua danese, tedesca,
    francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '89/247/EEG: Beschikking van de Commissie van 28 maart 1989 tot machtiging
