    (Verenigde Staten van Amerika), afwijkingen toe te staan van sommige bepalingen
    van Richtlijn 77/93/EEG van de Raad (Slechts de teksten in de Deense, Duitse,
    Franse en de Nederlandse taal zijn authentiek)'
  type: main
