type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1215/96 of 28 June 1996 amending Regulation
    (EEC) No 903/90 laying down detailed rules for the application of the arrangements
    applicable to imports of certain poultrymeat products originating in the African,
    Caribbean and Pacific States (ACP) or in the overseas countries and territories
    (OCT), in order to implement the Agricultural Agreement concluded during the Uruguay
    Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1215/96 de la Commission du 28 juin 1996 modifiant le
    règlement (CEE) nº 903/90 établissant les modalités d'application du régime
    applicable à l'importation de certains produits relevant du secteur de la viande
    de volaille originaires des États d'Afrique, des Caraïbes et du Pacifique (ACP)
    ou des pays et territoires d'outre-mer (PTOM), en vue de la mise en oeuvre de
    l'accord sur l'agriculture conclu dans le cadre des négociations du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1215/96 der Kommission vom 28. Juni 1996 zur Änderung
    der Verordnung (EWG) Nr. 903/90 zur Festlegung der den Sektor Geflügelfleisch
    betreffenden Durchführungsbestimmungen zur Regelung für landwirtschaftliche
    Erzeugnisse mit Ursprung in den Staaten in Afrika, im karibischen Raum und im
    Pazifischen Ozean (AKP-Staaten) oder in den überseeischen Ländern und Gebieten
    (ÜLG)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1215/96 af 28. juni 1996 om ændring
    af forordning (EØF) nr. 903/90 om gennemførelsesbestemmelser til importordningen
    for visse produkter i sektoren for fjerkrækød med oprindelse i staterne i Afrika,
    Vestindien og Stillehavet (AVS) eller i de oversøiske lande og territorier (OLT)
    med henblik på iværksættelsen af den landbrugsaftale, der blev indgået i forbindelse
    med forhandlingerne med Uruguay- runden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1215/96 της Επιτροπής
    της 28ης Ιουνίου 1996 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 903/90 για τις λεπτομέρειες εφαρμογής
    του καθεστώτος εισαγωγής προϊόντων που υπάγονται
    στον τομέα του κρέατος των πουλερικών καταγωγής
    των κρατών της Αφρικής, της Καραϊβικής, του
    Ειρηνικού (ΑΚΕ) ή των υπερποντίων χωρών και
    εδαφών (ΥΧΕ) για την εφαρμογή της συμφωνίας
    επί της γεωργίας που συνήφθη στο πλαίσιο των
    διαπραγματεύσεων του Γύρου της Ουρουγουάης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1215/96, annettu 28 päivänä kesäkuuta 1996,
    Afrikan, Karibian ja Tyynenmeren valtioista (AKT-valtiot) tai merentakaisista
    maista ja merentakaisilta alueilta (MMA) peräisin olevien tiettyjen siipikarjanliha-alan
    tuotteiden tuontijärjestelmän soveltamista koskevista yksityiskohtaisista säännöistä
    annetun asetuksen (ETY) N:o 903/90 muuttamisesta Uruguayn kierroksen neuvottelujen
    osana tehdyn maataloussopimuksen täytäntöön panemiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1215/96 della Commissione del 28 giugno 1996 che modifica
    il regolamento (CEE) n. 903/90 che stabilisce le modalità d'applicazione del
    regime applicabile all'importazione di taluni prodotti nel settore del pollame
    originari degli Stati dell'Africa, dei Caraibi e del Pacifico (Stati ACP) o dei
    paesi e territori d'oltremare (PTOM) ai fini dell'attuazione dell'accordo sull'agricoltura
    concluso nel quadro dei negoziati dell'Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1215/96 van de Commissie van 28 juni 1996 tot wijziging
    van Verordening (EEG) nr. 903/90 houdende bepalingen ter uitvoering van de regeling
    die geldt bij invoer van bepaalde produkten van de sector slachtpluimvee, van
    oorsprong uit de Staten in Afrika, het Caribische gebied en de Stille Oceaan (ACS-Staten),
    of uit de landen en gebieden overzee (LGO), met het oog op de tenuitvoerlegging
    van de Overeenkomst inzake de landbouw in het kader van de Uruguay-Ronde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n 1215/96 da Comissão de 28 de Junho de 1996 que altera
    o Regulamento (CEE) nº 903/90 que estabelece as regras de execução do regime
    aplicável na importação de determinados produtos do sector da carne de aves
    de capoeira originários dos Estados de África, das Caraíbas e do Pacífico
    (ACP) ou dos países e territórios ultramarinos (PTU) com vista à aplicação
    do acordo sobre a agricultura concluído no âmbito das negociações do «Uruguay
    Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1215/96 de la Comisión de 28 de junio de 1996 por el
    que se modifica el Reglamento (CEE) nº 903/90, por el que se establecen las normas
    de desarrollo del régimen aplicable a la importación de determinados productos
    del sector de la carne de aves de corral procedentes de los Estados de África,
    del Caribe y del Pacífico (ACP) o de los países y territorios de Ultramar (PTU),
    para la aplicación del Acuerdo agrícola celebrado en el marco de las negociaciones
    de la Ronda Uruguay
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1215/96 av den 28 juni 1996 om ändring
    av förordning (EEG) nr 903/90 om tillämpningsföreskrifter för systemet med
    import av vissa produkter av fjäderfäkött som har sitt ursprung i länder i
    Afrika, Västindien och Stilla havsområdet (AVS-staterna) eller i de utomeuropeiska
    länderna och territorierna (ULT) för att genomföra det jordbruksavtal som slöts
    inom ramen för förhandlingarna i Uruguayrundan
  type: main
