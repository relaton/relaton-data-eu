title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 938/2014 of 2 September 2014
    initiating an investigation concerning the possible circumvention of anti-dumping
    measures imposed by Council Regulation (EU) No 502/2013 on imports of bicycles
    originating in the People's Republic of China by imports of bicycles consigned
    from Cambodia, Pakistan and the Philippines, whether declared as originating in
    Cambodia, Pakistan and the Philippines or not, and making such imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 938/2014 de la Commission du 2 septembre
    2014 ouvrant une enquête concernant l'éventuel contournement des mesures antidumping
    instituées par le règlement (UE) n ° 502/2013 du Conseil sur les importations
    de bicyclettes originaires de la République populaire de Chine par des importations
    de bicyclettes expédiées du Cambodge, du Pakistan et des Philippines, qu'elles
    aient ou non été déclarées originaires du Cambodge, du Pakistan et des Philippines,
    et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 938/2014 der Kommission vom 2. September
    2014 zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der
    mit der Verordnung (EU) Nr. 502/2013 des Rates eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren von Fahrrädern mit Ursprung in der Volksrepublik China
    durch aus Kambodscha, Pakistan und von den Philippinen versandte Einfuhren von
    Fahrrädern, ob als Ursprungserzeugnisse Kambodschas, Pakistans oder der Philippinen
    angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
