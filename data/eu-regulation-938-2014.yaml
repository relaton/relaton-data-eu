  content: Kommissionens genomförandeförordning (EU) nr 938/2014 av den 2 september
    2014 om inledande av en undersökning beträffande ett eventuellt kringgående
    av de antidumpningsåtgärder som infördes genom rådets förordning (EU) nr
    502/2013 på import av cyklar med ursprung i Folkrepubliken Kina genom import
    av cyklar som avsänts från Kambodja, Pakistan eller Filippinerna, oavsett om
    produktens deklarerade ursprung är Kambodja, Pakistan eller Filippinerna eller
    inte, och om registrering av sådan import
