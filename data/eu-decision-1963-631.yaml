title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 novembre 1963, autorisant la perception
    de taxes compensatoires sur les importations, dans la République française,
    de chocolat en masse ou en granulés, de confiseries et préparations comportant
    du cacao ou du chocolat, sans liqueur alcoolique, en provenance des autres États
    membres
  type: main
- language: de
  script: Latn
  content: '63/631/EWG: Entscheidung der Kommission vom 5. November 1963 über die
    Erhebung von Ausgleichsabgaben bei der Einfuhr von Schokolade, Schokoladewaren
    und kakaohaltigen Zuckerwaren, nicht alkoholhaltig, sowie von kakaohaltigen oder
    schokoladehaltigen Zubereitungen aus den anderen Mitgliedstaaten in die Französische
    Republik'
  type: main
- language: it
  script: Latn
  content: '63/631/CEE: Decisione della Commissione del 5 novembre 1963 che autorizza
    la riscossione di tasse di compensazione sulle importazioni nella Repubblica francese
    di cioccolata in massa o in granuli, di dolciumi e di preparazioni contenenti
    cacao o cioccolata, senza alcolici, in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/631/EEG: Beschikking van de Commissie van 5 november 1963 houdende
    machtiging tot het leggen van compenserende heffingen op de invoer in de Franse
    Republiek van chocolade in blokken of in korrels en van suikerwerk en voedingsmiddelen
    met cacao of met chocolade zonder likeur, uit de andere Lid-Staten'
  type: main
