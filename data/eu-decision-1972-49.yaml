    de réinstallation effectuées par le "Land" Nordrheim- Westfalen
  type: main
- language: de
  script: Latn
  content: '72/49/EWG: Entscheidung der Kommission vom 22. November 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für vom Land Nordrhein- Westfalen durchgeführte
    Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/49/CEE: Decisione della Commissione, del 22 novembre 1971, che concede
    un contributo del FSE alla Repubblica federale di Germania per spese concernenti
    operazioni di nuova sistemazione effettuate dal «Land» Renania settentrionale-Westfalia'
  type: main
- language: nl
  script: Latn
