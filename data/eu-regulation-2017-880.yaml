title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2017/880 of 23 May 2017 laying down rules on
    the use of a maximum residue limit established for a pharmacologically active
    substance in a particular foodstuff for another foodstuff derived from the same
    species and a maximum residue limit established for a pharmacologically active
    substance in one or more species for other species, in accordance with Regulation
    (EC) No 470/2009 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/880 de la Commission du 23 mai 2017 établissant les
    règles relatives à l'utilisation d'une limite maximale de résidus (LMR) établie
    pour une substance pharmacologiquement active dans une denrée alimentaire particulière
    destinée à une autre denrée alimentaire dérivée de la même espèce et d'une
    LMR établie pour une ou plusieurs espèces destinées à d'autres espèces, conformément
    aux dispositions du règlement (CE) n° 470/2009 du Parlement européen et du
    Conseil
  type: main
