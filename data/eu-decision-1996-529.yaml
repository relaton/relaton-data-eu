    houden met de bijzondere situatie van St.-Pierre en Miquelon wat bevroren kabeljauwfilets
    van GN-code 0304 20 betreft'
  type: main
- language: pt
  script: Latn
  content: '96/529/CE: Decisão da Comissão de 29 de Julho de 1996 que derroga a
