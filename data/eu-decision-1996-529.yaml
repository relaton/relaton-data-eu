title:
- language: en
  script: Latn
  content: '96/529/EC: Commission Decision of 29 July 1996 derogating from the definition
    of the concept of ''originating products'' to take account of the special situation
    of Saint Pierre and Miquelon with regard to frozen fillets of cod of CN code 0304
    20'
  type: main
- language: fr
  script: Latn
  content: '96/529/CE: Décision de la Commission du 29 juillet 1996 portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière de Saint-Pierre-et-Miquelon en ce qui concerne les filets
    de morue congelés relevant du code NC 0304 20'
  type: main
- language: de
  script: Latn
  content: '96/529/EG: Entscheidung der Kommission vom 29. Juli 1996 über eine Abweichung
    von der Bestimmung des Begriffs "Ursprungswaren" zur Berücksichtigung der besonderen
    Lage Saint Pierres und Miquelons bei gefrorenen Kabeljaufilets des KN-Codes 0304
    20'
  type: main
- language: da
  script: Latn
  content: '96/529/EF: Kommissionens beslutning af 29. juli 1996 om en undtagelse
    fra definitionen af begrebet »varer med oprindelsesstatus« for at tage hensyn
    til den særlig situation på Saint Pierre og Miquelon, hvad angår frosne torskefileter
    henhørende under KN-kode 0304 20'
  type: main
- language: el
  script: Grek
  content: '96/529/ΕΚ: Απόφαση της Επιτροπής της 29ης Ιουλίου
    1996 για την καθιέρωση παρέκκλισης από τον ορισμό
    της έννοιας των καταγόμενων προϊόντων, προκειμένου
    να ληφθούν υπόψη τα ιδιαίτερα δεδομένα των
    νησιών Σαιν Πιερ και Μικελόν, όσον αφορά τα
    κατεψυγμένα φιλέτα μπακαλιάρων τα οποία υπάγονται
    στον κωδικό ΣΟ 0304 20'
  type: main
- language: fi
  script: Latn
  content: '96/529/EY: Komission päätös, tehty 29 päivänä heinäkuuta 1996,
    alkuperätuotteiden käsitteen määritelmästä poikkeamisesta Saint-Pierre ja
    Miquelonin erityistilanteen huomioon ottamiseksi koodiin 0304 20 kuuluvien jäädytettyjen
    turskafileiden osalta'
  type: main
- language: it
  script: Latn
  content: '96/529/CE: Decisione della Commissione del 29 luglio 1996 che deroga alla
    definizione di prodotti originari per tener conto della situazione particolare
    di Saint Pierre e Miquelon per quanto riguarda i filetti di merluzzo congelati
    di cui al codice NC 0304 20'
  type: main
- language: nl
  script: Latn
  content: '96/529/EG: Beschikking van de Commissie van 29 juli 1996 houdende afwijking
