- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1426/93 of 9 June 1993 re-establishing the
    levying of customs duties on products of categories 21 and 36 (order Nos 40.0210,
    and 40.0360), originating in Indonesia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1426/93 de la Commission du 9 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    21 et 36 (numéros d'ordre 40.0210, et 40.0360) originaires d'Indonésie, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1426/93 DER KOMMISSION vom 9. Juni 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorien 21 und 36 (laufende Nummern 40.0210
    und 40.0360) mit Ursprung in Indonesien, für die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1426/93 af 9. juni 1993 om genindførelse
