    (Kennisgeving geschied onder nummer C(2020) 7139)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/1549 z dnia 22 października 2020
    r. uchylająca decyzję 2004/200/WE w sprawie środków w celu zapobieżenia wprowadzaniu
