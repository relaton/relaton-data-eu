title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1549 of 22 October 2020 repealing
    Decision 2004/200/EC on measures to prevent the introduction into and the spread
    within the Community of Pepino mosaic virus (notified under document C(2020) 7139)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1549 de la Commission du 22 octobre
    2020 abrogeant la décision 2004/200/CE relative à des mesures visant à éviter
    l’introduction et la propagation dans la Communauté du virus de la mosaïque
    du pépino [notifiée sous le numéro C(2020) 7139]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1549 der Kommission vom 22. Oktober 2020
    zur Aufhebung der Entscheidung 2004/200/EG mit Maßnahmen zum Schutz der Gemeinschaft
    gegen die Einschleppung und Ausbreitung des Pepino Mosaic Virus (Bekannt gegeben
    unter Aktenzeichen C(2020) 7139)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/1549 на Комисията
