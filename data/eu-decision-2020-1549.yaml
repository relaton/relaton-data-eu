    2004/200/ЕО относно мерките за предотвратяване
    въвеждането и разпространението в Общността
    на Pepino mosaic virus (нотифицирано под номер C(2020) 7139)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1549 ze dne 22. října 2020,
