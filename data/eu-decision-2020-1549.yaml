    viru Pepino mosaic do Společenství a proti jeho rozšiřování na území Společenství
    (oznámeno pod číslem C(2020) 7139)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/1549 af 22. oktober 2020
    om ophævelse af beslutning 2004/200/EF om foranstaltninger mod indslæbning og
    spredning i EF af pepinomosaikvirus (meddelt under nummer C(2020) 7139)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/1549 της Επιτροπής
    της 22ας Οκτωβρίου 2020 για την κατάργηση της
    απόφασης 2004/200/ΕΚ σχετικά με μέτρα κατά της
    εισόδου και κατά της εξάπλωσης στην Κοινότητα
    του ιού της μωσαΐκωσης (Pepino mosaic virus) [κοινοποιηθείσα
    υπό τον αριθμό C(2020) 7139]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/1549, 22. oktoober 2020, millega tunnistatakse
    kehtetuks otsus 2004/200/EÜ melon-maavitsa mosaiikviiruse ühendusse sissetoomise
    ja seal levimise vältimise kohta (teatavaks tehtud numbri C(2020) 7139 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/1549, annettu 22 päivänä
    lokakuuta 2020, toimenpiteistä pepinon mosaiikkiviruksen yhteisöön kulkeutumisen
    ja siellä leviämisen estämiseksi tehdyn komission päätöksen 2004/200/EY
    kumoamisesta (tiedoksiannettu numerolla C(2020) 7139)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/1549 оd 22. listopada 2020. o stavljanju
    izvan snage Odluke 2004/200/EZ o mjerama kojima se sprečava unošenje Pepino
    mozaik virusa u Zajednicu i njegovo širenje unutar Zajednice (priopćeno pod
    brojem dokumenta C(2020) 7139)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1549 végrehajtási határozata (2020. október
    22.) a pepino mozaic vírus Közösségbe történő behurcolása és a Közösségen
    belüli elterjedése elleni intézkedésekről szóló 2004/200/EK bizottsági
    határozat hatályon kívül helyezéséről (az értesítés a C(2020) 7139.
    számú dokumentummal történt)
  type: main
- language: it
  script: Latn
