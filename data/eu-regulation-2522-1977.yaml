type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2522/77 of 15 November 1977 re-establishing
    the levying of customs duties on appliances, apparatus, accessories and requisites
    for gymnastics or athletics, or for sports and outdoor games falling within subheadings
    97.06 B and C, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2522/77 de la Commission, du 15 novembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux articles
    pour les jeux de plein air, la gymnastique, l'athlétisme et autres sports, des
    sous-positions tarifaires 97.06 B et C, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2522/77 der Kommission vom 15. November 1977 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten, der Tarifstellen 97.06 B und C, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2522/77 af 15. november 1977 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil,
    under underposition 97.06 B og C, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2522/77 della Commissione, del 15 novembre 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all'aperto, da ginnastica, da atletica ed altri sport, delle sottovoci
    doganali 97.06 B e C, originari dei paesi in via di sviluppo, beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2522/77 van de Commissie van 15 november 1977 houdende
    wederinstelling van de heffing van de douanerechten voor artikelen en toestellen
    voor openluchtspelen, voor gymnastiek, voor atletiek en voor andere sporten, van
    post 97.06 B en C, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
