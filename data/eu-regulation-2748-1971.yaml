schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2748/71 de la Commission, du 22 décembre 1971, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à certaines peaux préparées d'autres animaux, à l'exclusion de celles des
    ns 41.06 à 41.08 inclus, de la sous-position tarifaire 41.05 B II, originaires
    de la Yougoslavie, bénéficiaire des préférences tarifaires, prévues par le
    règlement (CEE) n 1309/71 du Conseil du 21 juin 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2748/71 der Kommission vom 22. Dezember 1971 über
    die Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für bestimmtes
    Leder aus Häuten oder Fellen von anderen Tieren, ausgenommen Leder der Tarifnummern
    41.06 bis 41.08, der Tarifstelle 41.05 B II, mit Ursprung in Jugoslawien, dem
    die in der Verordnung (EWG) Nr. 1309/71 des Rates vom 21. Juni 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2748/71 della Commissione, del 22 dicembre 1971, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili a
    talune pelli preparate di altri animali, escluse quelle delle voci dal n. 41.06
    al n. 41.08 incluso, della sottovoce doganale n. 41.05 B II, originarie della
    Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 1309/71 del Consiglio, del 21 giugno 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2748/71 van de Commissie van 22 december 1971 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op bepaalde soorten leder en voorgelooide huiden en vellen, van
    andere dieren, met uitzondering van de produkten bedoeld bij de posten 41.06 tot
    en met 41.08 van onderverdeling 41.05 B II, van oorsprong uit Joegoslavië, ten
    behoeve waarvan de algemene tariefpreferenties gelden, als bepaald bij Verordening
    (EEG) nr. 1309/71 van de Raad van 21 juni 1971
  type: main
