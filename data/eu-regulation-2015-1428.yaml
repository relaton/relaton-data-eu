title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2015/1428 of 25 August 2015 amending Commission
    Regulation (EC) No 244/2009 with regard to ecodesign requirements for non-directional
    household lamps and Commission Regulation (EC) No 245/2009 with regard to ecodesign
    requirements for fluorescent lamps without integrated ballast, for high intensity
    discharge lamps, and for ballasts and luminaires able to operate such lamps and
    repealing Directive 2000/55/EC of the European Parliament and of the Council and
    Commission Regulation (EU) No 1194/2012 with regard to ecodesign requirements
    for directional lamps, light emitting diode lamps and related equipment
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2015/1428 de la Commission du 25 août 2015 modifiant le
    règlement (CE) n° 244/2009 de la Commission en ce qui concerne les exigences
    relatives à l'écoconception des lampes à usage domestique non dirigées et
    le règlement (CE) n° 245/2009 de la Commission en ce qui concerne les exigences
    en matière d'écoconception applicables aux lampes fluorescentes sans ballast
    intégré, aux lampes à décharge à haute intensité, ainsi qu'aux ballasts
    et aux luminaires qui peuvent faire fonctionner ces lampes, et abrogeant la directive
    2000/55/CE du Parlement européen et du Conseil et le règlement (UE) n° 1194/2012
    de la Commission en ce qui concerne les exigences relatives à l'écoconception
    des lampes dirigées, des lampes à diodes électroluminescentes et des équipements
    correspondants
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2015/1428 der Kommission vom 25. August 2015 zur Änderung
    der Verordnung (EG) Nr. 244/2009 der Kommission im Hinblick auf die Festlegung
    von Anforderungen an die umweltgerechte Gestaltung von Haushaltslampen mit ungebündeltem
    Licht und der Verordnung (EG) Nr. 245/2009 der Kommission im Hinblick auf die
    Festlegung von Anforderungen an die umweltgerechte Gestaltung von Leuchtstofflampen
    ohne eingebautes Vorschaltgerät, Hochdruckentladungslampen sowie Vorschaltgeräte
    und Leuchten zu ihrem Betrieb und zur Aufhebung der Richtlinie 2000/55/EG des
    Europäischen Parlaments und des Rates und der Verordnung (EU) Nr. 1194/2012 der
    Kommission im Hinblick auf die Anforderungen an die umweltgerechte Gestaltung
    von Lampen mit gebündeltem Licht, LED-Lampen und dazugehörigen Geräten
  type: main
