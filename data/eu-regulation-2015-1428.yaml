    ökodisainile esitatavate nõuete suhtes ning millega tunnistatakse kehtetuks
    Euroopa Parlamendi ja nõukogu direktiiv 2000/55/EÜ ning komisjoni määrust
    (EL) nr 1194/2012 seoses suundvalguslampide, leedlampide ja nende lisaseadmete
    ökodisaini nõuetega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2015/1428, annettu 25 päivänä elokuuta 2015, ympärisäteilevien
    kotitalouslamppujen ekologista suunnittelua koskevia vaatimuksia koskevan komission
    asetuksen (EY) N:o 244/2009 muuttamisesta sekä loistelamppujen, joissa ei ole
    sisäistä virranrajoitinta, suurpainepurkauslamppujen sekä virranrajoittimien
    ja valaisimien, joissa voidaan käyttää tällaisia lamppuja, ekologista suunnittelua
    koskevia vaatimuksia sekä Euroopan parlamentin ja neuvoston direktiivin 2000/55/EY
    kumoamista koskevan komission asetuksen (EY) N:o 245/2009 muuttamisesta sekä
    suunnattujen lamppujen, loistediodilamppujen ja niihin liittyvien laitteiden ekologista
    suunnittelua koskevia vaatimuksia koskevan komission asetuksen (EU) N:o 1194/2012
    muuttamisesta
  type: main
