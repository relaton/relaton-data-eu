  script: Latn
  content: Regulamentul (UE) 2015/1428 al Comisiei din 25 august 2015 de modificare
    a Regulamentului (CE) nr. 244/2009 al Comisiei în ceea ce privește cerințele
    de proiectare ecologică pentru lămpi de uz casnic nondirecționale și a Regulamentului
    (CE) nr. 245/2009 al Comisiei în ceea ce privește cerințele de proiectare ecologică
