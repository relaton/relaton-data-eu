    de intensitate ridicată, precum și balasturilor și corpurilor de iluminat compatibile
    cu aceste lămpi, și de abrogare a Directivei 2000/55/CE a Parlamentului European
    și a Consiliului și a Regulamentului (UE) nr. 1194/2012 al Comisiei în ceea
    ce privește cerințele de proiectare ecologică pentru lămpile direcționale,
    lămpile cu diode electroluminiscente și echipamentele aferente
  type: main
