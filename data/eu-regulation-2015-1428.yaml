  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2015/1428 ze dne 25. srpna 2015, kterým se mění
    nařízení Komise (ES) č. 244/2009, pokud jde o požadavky na ekodesign nesměrových
    světelných zdrojů pro domácnost, nařízení Komise (ES) č. 245/2009, pokud
    jde o požadavky na ekodesign zářivek bez integrovaného předřadníku, vysoce
    intenzivních výbojek a předřadníků a svítidel, jež mohou sloužit k provozu
    těchto zářivek a výbojek, a zrušení směrnice Evropského parlamentu a Rady
    2000/55/ES, a nařízení Komise (EU) č. 1194/2012, pokud jde o požadavky na
    ekodesign směrových světelných zdrojů, světelných zdrojů využívajících
    elektroluminiscenčních diod a souvisejících zařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2015/1428 af 25. august 2015 om ændring
    af Kommissionens forordning (EF) nr. 244/2009 for så vidt angår krav til miljøvenligt
    design af ikke-retningsbestemte lyskilder i boliger og Kommissionens forordning
    (EF) nr. 245/2009 i forbindelse med miljøvenligt design af lysstofrør uden indbygget
    forkobling og højtryksdamplamper samt forkoblinger og armaturer hertil, og om
