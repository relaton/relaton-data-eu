  script: Latn
  content: Regulamento (UE) 2015/1428 da Comissão, de 25 de agosto de 2015, que altera
    o Regulamento (CE) n.° 244/2009 da Comissão no que respeita aos requisitos de
    conceção ecológica para as lâmpadas domésticas não direcionais e o Regulamento
    (CE) n.° 245/2009 da Comissão no que respeita aos requisitos de conceção ecológica
    das lâmpadas fluorescentes sem balastro integrado, das lâmpadas de descarga
    de alta intensidade e dos balastros e luminárias que podem funcionar com essas
    lâmpadas, e que revoga a Diretiva 2000/55/CE do Parlamento Europeu e do Conselho
    e o Regulamento (UE) n.° 1194/2012 da Comissão no que respeita aos requisitos
    de conceção ecológica para as lâmpadas direcionais, as lâmpadas de díodos
    emissores de luz e os equipamentos conexos
  type: main
