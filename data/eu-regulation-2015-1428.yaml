  script: Latn
  content: Komisjoni määrus (EL) 2015/1428, 25. august 2015, millega muudetakse
    komisjoni määrust (EÜ) nr 244/2009 kodumajapidamises kasutatavate suunamata
    valgusvooga lampide ökodisaini nõuete osas ning komisjoni määrust (EÜ) nr
