  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2015/1428 della Commissione, del 25 agosto 2015, che modifica
    il regolamento (CE) n. 244/2009 della Commissione in merito alle specifiche per
    la progettazione ecocompatibile delle lampade non direzionali per uso domestico
    e il regolamento (CE) n. 245/2009 della Commissione per quanto riguarda le specifiche
    per la progettazione ecocompatibile di lampade fluorescenti senza alimentatore
    integrato, lampade a scarica ad alta intensità e di alimentatori e apparecchi
    di illuminazione in grado di far funzionare tali lampade, e che abroga la direttiva
    2000/55/CE del Parlamento europeo e del Consiglio e il regolamento (UE) n. 1194/2012
    della Commissione in merito alle specifiche per la progettazione ecocompatibile
    delle lampade direzionali, delle lampade con diodi a emissione luminosa e delle
    pertinenti apparecchiature
  type: main
