title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 380/76 of 20 February 1976 re-establishing
    the levying of customs duties on glazed setts, flags and paving, hearth and wall
    tiles, falling within heading No 69.08, originating in developing countries to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 380/76 de la Commission, du 20 février 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position tarifaire 69.08,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 380/76 der Kommission vom 20. Februar 1976 zur Wiedereinführung
    des Zollsatzes für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Entwicklungsländern, denen die
    in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 380/76 af 20. februar 1976 om genindførelse
    af opkrævning af toldafgifter for glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o. lign., under position 69.08, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 380/76 della Commissione, del 20 febbraio 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre piastrelle,
    blocchetti e lastre da pavimentazione o da rivestimento, della voce doganale 69.08,
    originari dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 380/76 van de Commissie van 20 februari 1976 houdende
    wederinstelling van de heffing van de douanerechten voor andere plavuizen en andere
    vloer- en wandtegels, van post 69.08, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 tariefpreferenties werden geopend
  type: main
