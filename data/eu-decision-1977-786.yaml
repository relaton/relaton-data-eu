id: EUDecision1977786
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 September 1977 authorizing the Federal Republic
    of Germany not to apply Community treatment to panty hose of synthetic textile
    fibres, falling within heading No ex 60.04 of the Common Customs Tariff, originating
    in the Republic of Korea and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/786/CEE: Décision de la Commission, du 9 septembre 1977, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    les bas-culottes de fibres textiles synthétiques, de la position Ex 60.04 du
    Tarif douanier commun, originaires de la République de Corée et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. September 1977, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus der Republik Korea stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Strumpfhosen aus synthetischen Spinnstoffen
    der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. september 1977 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage strømpebenklæder af syntetiske
    fibre, som henhører under pos. ex 60.04 i den fælles toldtarif, har oprindelse
    i republikken Korea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 settembre 1977, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario le calze-mutande
    di fibre tessili sintetiche della voce ex 60.04 della tariffa doganale comune,
    originarie della Repubblica di Corea e messe in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 september 1977 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd kousenbroeken van synthetische textielvezels van post
    ex 60.04 van het gemeenschappelijk douanetarief, van oorsprong uit de Republiek
    Korea en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
