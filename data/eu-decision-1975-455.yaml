id: EUDecision1975455
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 April 1975 authorizing the Italian Republic not
    to apply Community treatment to sewing machine heads and their parts, falling
    within subheadings 84.41 A ex I, ex II and ex III of the Common Customs Tariff,
    originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/455/CEE: Décision de la Commission, du 24 avril 1975, autorisant la
    République italienne à exclure du traitement communautaire les têtes de machines
    à coudre et leurs parties et pièces détachées des sous-positions 84.41 A Ex
    I, Ex II et Ex III du Tarif douanier commun, originaires du Japon et mises en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. April 1975, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Nähmaschinenköpfe, einschließlich Teile davon,
    der Tarifnummer 84.41 A ex I, ex II und ex III des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning om bemyndigelse for Den italienske Republik til
    fra fællesskabsbehandling at undtage symaskinehoveder og deres dele, som henhører
    under position 84.41 A ex I, ex II, ex III i den fælles toldtarif, har oprindelse
    i Japan, og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 aprile 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le teste di macchine da cucire
    e relative parti staccate della sottovoce n. 84.41 A ex I, ex II e ex III della
    tariffa doganale comune, originarie del Giappone e messe in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 april 1975 waarbij de Italiaanse Republiek
    wordt gemachtigd koppen van naaimachines, delen en onderdelen, van post 84.41
    A ex I, ex II en ex III van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
