title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1102/73 of the Commission of 27 April 1973 re-establishing
    Common Customs Tariff duties on phosphorus pentoxide and phosphoric acids (meta-,
    ortho- and pyro-) falling within heading No 28.10 originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2762/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1102/73 de la Commission, du 27 avril 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à l' anhydride et aux acides phosphoriques (méta-, ortho- et pyro-), de la position
    tarifaire 28.10, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1102/73 der Kommission vom 27. April 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Phosphorsäureanhydrid und Phosphorsäuren
    (Meta-, Ortho- und Pyrophosphorsäure) der Tarifnummer 28.10, mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2762/72 des Rates
    vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1102/73 af 27. april 1973 om genindførelse
    af told, ifølge den fælles toldtarif for Diphosphorpentoxid, meta- ; ortho-
    og pyrophosphorsyre under position 28.10 som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1102/73 della Commissione, del 27 aprile 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili all'
    anidride e agli acidi fosforici (meta-, orto- e piro) della voce doganale n. 28.10,
    originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1102/73 van de Commissie van 27 april 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor fosforzuuranhydride (fosforpentoxyde) en fosforzuren (meta-, ortho- en pyrofosforzuur)
    van post 28.10, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 tariefpreferenties
    werden geopend
  type: main
