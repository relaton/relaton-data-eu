id: EURegulation21451974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2145/74 of the Commission of 13 August 1974 re-establishing
    the levying of customs duties on appliances, apparatus, accessories and requisites
    for gymnastics or athletics, or for sports and outdoor games (other than articles
    falling within heading No 97.04), falling within subheading 97.06 B and C, originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2145/74 de la Commission, du 13 août 1974, portant
    rétablissement de la perception des droits de douane applicables aux articles
    et engins pour les jeux de plein-air, des sous-positions tarifaires 97.06 B et
    C, originaires du Pakistan bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2145/74 der Kommission vom 13. August 1974 zur Wiedereinführung
    des Zollsatzes für Geräte für Freiluftspiele, Leichtathletik, Gymnastik und
    andere Sportarten, ausgenommen Waren der Tarifnummer 97.04, der Tarifstellen 97.06
    B und C, mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2145/74 af 13. august 1974 om genindførelse
    af opkrævning af toldafgifter for redskaber og rekvisitter til udendørsspil
    under underposition 97.06 B og C, som har oprindelse i Pakistan og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3501/73 af
    18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2145/74 della Commissione, del 13 agosto 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti ed attrezzi
    per giuochi all'aperto, da ginnastica, da atletica ed altri sport, diversi da
    quelli della voce n. 97.04 delle sottovoci doganali n. 97.06 B e C originari del
    Pakistan beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3501/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2145/74 van de Commissie van 13 augustus 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op artikelen
    en toestellen voor openluchtspelen voor gymnastiek voor atletiek en voor andere
    sporten, met uitzondering van de artikelen bedoeld bij post 97.04, van onderverdeling
    97.06 B en C, van oorsprong uit Pakistan, ten behoeve waarvan bij Verordening
    (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
