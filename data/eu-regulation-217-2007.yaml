- language: en
  script: Latn
  content: Commission Regulation (EC) No 217/2007 of 28 February 2007 initiating an
    investigation concerning the possible circumvention of countervailing measures
    imposed by Council Regulation (EC) No 1628/2004 on imports of certain graphite
    electrode systems originating in India by imports of certain artificial graphite
    originating in India and making such imports subject to registration
  type: main
- language: fr
  script: Latn
