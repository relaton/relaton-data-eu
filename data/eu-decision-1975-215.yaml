title:
- language: en
  script: Latn
  content: Commission Decision of 19 March 1975 authorizing the French Republic to
    exclude from the application of Council Regulation (EEC) No 866/75 imports into
    the département of Réunion of products to which that Regulation would otherwise
    apply
  type: main
- language: fr
  script: Latn
  content: '75/215/CEE: Décision de la Commission, du 19 mars 1975, autorisant la
    République française à exclure de l''application du règlement (CEE) n° 866/75
    du Conseil les produits visés dans ledit règlement, importés dans le département
    de la Réunion'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. März 1975 zur Ermächtigung der Französischen
    Republik, von der Anwendung der Verordnung (EWG) Nr. 866/75 des Rates die darin
    genannten Waren auszuschließen, soweit sie in das Departement Réunion eingeführt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. marts 1975 om bemyndigelse af Den franske
    Republik til ikke at anvende Rådets forordning (EØF) nr. 866/75 på de i denne
    forordning nævnte varer, der indføres i departementet Réunion
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 marzo 1975, che autorizza la Repubblica
    francese ad escludere dall'applicazione del regolamento (CEE) n. 866/75 del Consiglio
    i prodotti figuranti in detto regolamento, importati nel dipartimento della Riunione
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 maart 1975 waarbij de Franse Republiek
    wordt gemachtigd van de toepassing van Verordening (EEG) nr. 866/75 van de Raad
    uit te sluiten de in die verordening genoemde produkten die in het departement
    Reunion worden ingevoerd
  type: main
