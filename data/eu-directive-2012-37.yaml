title:
- language: en
  script: Latn
  content: Commission Implementing Directive 2012/37/EU of 22 November 2012 amending
    certain Annexes of Council Directives 66/401/EEC and 66/402/EEC as regards the
    conditions to be satisfied by the seed of Galega orientalis Lam., the maximum
    weight of a seed lot of certain fodder plant species and the sample size of Sorghum
    spp.
  type: main
- language: fr
  script: Latn
  content: Directive d’exécution 2012/37/UE de la Commission du 22 novembre 2012
    modifiant certaines annexes des directives 66/401/CEE et 66/402/CEE du Conseil
    en ce qui concerne les conditions auxquelles doivent satisfaire les semences de
    Galega orientalis Lam., le poids maximal des lots de semences de certaines espèces
    de plantes fourragères et la taille des échantillons de Sorghum spp.
  type: main
- language: de
  script: Latn
  content: Durchführungsrichtlinie 2012/37/EU der Kommission vom 22. November 2012
    zur Änderung bestimmter Anhänge der Richtlinien 66/401/EWG und 66/402/EWG des
    Rates in Bezug auf die Anforderungen an das Saatgut von Galega orientalis Lam.,
    das Höchstgewicht einer Saatgutpartie bestimmter Futterpflanzenarten und den
    Probenumfang von Sorghum spp.
  type: main
- language: bg
  script: Cyrl
  content: Директива за изпълнение 2012/37/ЕС на Комисията
    от 22 ноември 2012 година за изменение на някои
    приложения към директиви 66/401/ЕИО и 66/402/ЕИО
    на Съвета по отношение на условията, на които
    трябва да отговарят семената от Galega orientalis Lam.,
    максималното тегло на партидите семена от
    някои видове фуражни растения и големината
    на пробите от Sorghum spp.
  type: main
- language: cs
  script: Latn
  content: Prováděcí směrnice Komise 2012/37/EU ze dne 22. listopadu 2012 , kterou
    se mění některé přílohy směrnic Rady 66/401/EHS a 66/402/EHS, pokud jde
    o podmínky, které musí splňovat osivo Galega orientalis Lam., maximální
    hmotnost partií osiv některých druhů pícnin a velikost vzorku Sorghum spp.
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesdirektiv 2012/37/EU af 22. november 2012 om
    ændring af visse bilag til Rådets direktiv 66/401/EØF og 66/402/EØF for så
    vidt angår de betingelser, der skal opfyldes for frø af Galega orientalis Lam.,
    maksimumsvægten af et parti frø af visse foderplanter og stikprøvestørrelsen
    for Sorghum spp.
  type: main
- language: el
  script: Grek
  content: Εκτελεστική οδηγία 2012/37/ΕΕ της Επιτροπής,
    της 22ας Νοεμβρίου 2012 , για την τροποποίηση ορισμένων
    παραρτημάτων των οδηγιών 66/401/ΕΟΚ και 66/402/ΕΟΚ
    του Συμβουλίου όσον αφορά τους όρους που πρέπει
    να πληροί ο σπόρος Galega orientalis Lam., το μέγιστο
    βάρος μιας σπορομερίδας ορισμένων ειδών κτηνοτροφικών
    φυτών και το μέγεθος δείγματος του Sorghum spp.
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusdirektiiv 2012/37/EL, 22. november 2012 , millega muudetakse
    nõukogu direktiive 66/401/EMÜ ja 66/402/EMÜ seoses Galega orientalis Lam. seemne
    suhtes kohaldatavate tingimuste, teatavate söödakultuuride seemnepartiide maksimummassi
    ja Sorghum spp. proovi kogusega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanodirektiivi 2012/37/EU, annettu 22 päivänä
    marraskuuta 2012 , neuvoston direktiivien 66/401/ETY ja 66/402/ETY tiettyjen liitteiden
    muuttamisesta siltä osin kuin kyse on Galega orientalis Lam. -lajin siemeniin
    sovellettavista edellytyksistä, tiettyjen rehukasvilajien siemenerän enimmäispainosta
    ja Sorghum spp. -lajin näytekoosta
  type: main
- language: hr
  script: Latn
  content: Provedbena direktiva Komisije 2012/37/EU od 22. studenoga 2012. o izmjeni
    pojedinih priloga direktivama Vijeća 66/401/EEZ i 66/402/EEZ u pogledu uvjeta
    koje mora ispunjavati sjeme Galega orientalis Lam., maksimalne težine partije
    sjemena određenih vrsta krmnog bilja i veličine uzorka Sorghum spp.
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2012/37/EU végrehajtási irányelve ( 2012. november 22.
    ) a 66/401/EGK és a 66/402/EGK tanácsi irányelv egyes mellékleteinek a Galega
    orientalis Lam. vetőmagjára vonatkozó feltételek, egyes takarmánynövény-vetőmagok
    tételeinek maximális tömege és a Sorghum spp. mintamérete tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva di esecuzione 2012/37/UE della Commissione, del 22 novembre 2012
    , che modifica taluni allegati delle direttive 66/401/CEE e 66/402/CEE del Consiglio
    per quanto riguarda le condizioni che devono soddisfare le sementi di Galega orientalis
    Lam., il peso massimo di un lotto di sementi di alcune specie di piante foraggere
    e le dimensioni del campione di Sorghum spp.
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas direktīva 2012/37/ES ( 2012. gada 22. novembris
    ), ar ko groza konkrētus Padomes Direktīvu 66/401/EEK un 66/402/EEK pielikumus,
    mainot nosacījumus, kas jāievēro attiecībā uz Galega orientalis Lam. sēklām,
    konkrētu lopbarības augu sugu sēklu partiju maksimālo svaru un Sorghum spp.
    parauga lielumu
  type: main
- language: lt
  script: Latn
  content: 2012 m. lapkričio 22 d. Komisijos įgyvendinimo direktyva 2012/37/ES,
    kuria dėl reikalavimų, kuriuos turi atitikti Galega orientalis Lam. sėkla,
    dėl tam tikrų pašarinių rūšių augalų sėklos partijos didžiausio svorio
    ir dėl Sorghum spp. mėginio dydžio iš dalies keičiami tam tikri Tarybos direktyvų
    66/401/EEB ir 66/402/EEB priedai
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Implimentazzjoni tal-Kummissjoni 2012/37/UE tat- 22 ta’
    Novembru 2012 li temenda ċerti Annessi tad-Direttivi tal-Kunsill 66/401/KEE u
    66/402/KEE fir-rigward tal-kundizzjonijiet li għandhom jiġu ssodisfati miż-żerriegħa
    ta’ Galega orientalis Lam., il-piż massimu ta’ lott taż-żerriegħa ta’
    ċerti speċijiet ta’ pjanti tal-għalf u d-daqs tal-kampjun ta’ Sorghum spp.
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsrichtlijn 2012/37/EU van de Commissie van 22 november 2012 tot
    wijziging van bepaalde bijlagen bij de Richtlijnen 66/401/EEG en 66/402/EEG van
    de Raad wat betreft de voorwaarden waaraan zaaizaad van Galega orientalis Lam.
    moet voldoen, het maximumgewicht van een partij zaaizaad van bepaalde soorten
    groenvoedergewassen en de monstergrootte van Sorghum spp.
  type: main
- language: pl
  script: Latn
  content: Dyrektywa wykonawcza Komisji 2012/37/UE z dnia 22 listopada 2012 r. zmieniająca
    niektóre załączniki do dyrektyw Rady 66/401/EWG i 66/402/EWG w odniesieniu
    do warunków, jakie muszą być spełnione przez materiał siewny Galega orientalis
    Lam., maksymalnej wagi partii materiału siewnego niektórych gatunków roślin
    pastewnych i wielkości próbki Sorghum spp.
  type: main
- language: pt
  script: Latn
  content: Diretiva de Execução 2012/37/UE da Comissão, de 22 de novembro de 2012
    , que altera determinados anexos das Diretivas 66/401/CEE e 66/402/CEE do Conselho
    no que se refere às condições a cumprir pelas sementes de Galega orientalis
    Lam., ao peso máximo dos lotes de sementes de determinadas plantas forrageiras
    e à dimensão das amostras de Sorghum spp.
  type: main
- language: ro
  script: Latn
  content: Directiva de punere în aplicare 2012/37/UE a Comisiei din 22 noiembrie
    2012 de modificare a anumitor anexe la Directivele 66/401/CEE și 66/402/CEE în
    ceea ce privește condițiile pe care trebuie să le îndeplinească semințele
    de Galega orientalis Lam., greutatea maximă a unui lot de semințe de anumite
    specii de plante furajere și dimensiunea eșantionului de Sorghum spp.
  type: main
- language: sk
  script: Latn
  content: Vykonávacia smernica Komisie 2012/37/EÚ z 22. novembra 2012 , ktorou
    sa menia niektoré prílohy k smerniciam Rady 66/401/EHS a 66/402/EHS, pokiaľ
    ide o podmienky, ktoré musí spĺňať osivo Galega orientalis Lam., maximálnu
    hmotnosť dávky osiva niektorých druhov krmovín a veľkosť vzorky Sorghum
    spp.
  type: main
- language: sl
  script: Latn
  content: Izvedbena direktiva Komisije 2012/37/EU z dne 22. novembra 2012 o spremembi
    nekaterih prilog k direktivam Sveta 66/401/EGS in 66/402/EGS v zvezi s pogoji,
    ki jih mora izpolnjevati seme Galega orientalis Lam., največjo težo partije
    semena nekaterih vrst krmnih rastlin ter velikostjo vzorca Sorghum spp.
  type: main
- language: es
  script: Latn
  content: Directiva de Ejecución 2012/37/UE de la Comisión, de 22 de noviembre
    de 2012 , por la que se modifican determinados anexos de las Directivas 66/401/CEE
    y 66/402/CEE del Consejo en lo que se refiere a las condiciones que deben cumplir
    las semillas de Galega orientalis Lam., el peso máximo de cada lote de semillas
    de determinadas especies de plantas forrajeras y el tamaño de la muestra de Sorghum
    spp.
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandedirektiv 2012/37/EU av den 22 november 2012
    om ändring av vissa av bilagorna till rådets direktiv 66/401/EEG och 66/402/EEG
    vad gäller de villkor som utsädet Galega orientalis Lam. ska uppfylla, den högsta
    vikten för ett utsädesparti av vissa arter av foderväxter och provstorleken
    för Sorghum spp.
  type: main
