title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 13 avril 1972, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves de
    haricots verts, de la position 20.02 Ex G du Tarif douanier commun, originaires
    de la République populaire de Chine et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '72/177/EWG: Entscheidung der Kommission vom 13. April 1972, mit der die
    Bundesrepublik Deutschland ermächtigt wird, aus der Volksrepublik China stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Konserven von
    grünen Bohnen der Tarifnummer 20.02 ex G des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/177/CEE: Decisione della Commissione, del 13 aprile 1972, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario le
    conserve di fagiolini della voce n. 20.02 ex G della tariffa doganale comune,
    originari della Repubblica popolare cinese e messi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/177/EEG: Beschikking van de Commissie van 13 april 1972 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd conserven van sla-, spek-, pronk-, en
    snijbonen, van post 20.02 ex G van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
