  script: Latn
  content: '89/249/EEC: Commission Decision of 5 April 1989 amending Commission Decision
    89/171/EEC of 1 March 1989 concerning the establishment of overall quantities
    of food aid for 1989 and establishing a list of products to be supplied as food
    aid'
  type: main
- language: fr
  script: Latn
  content: '89/249/CEE: Décision de la Commission du 5 avril 1989 modifiant la décision
    89/171/CEE de la Commission, du 1er mars 1989, relative à la fixation des quantités
    globales d''aide alimentaire au titre du programme 1989 et à l''établissement
    de la liste des produits à fournir à titre d''aide alimentaire'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 5. April 1989 zur Aenderung des Beschlusses
    89/171/EWG der Kommission vom 1. Maerz 1989 zur Festlegung der Gesamtmengen der
    Nahrungsmittelhilfe im Rahmen des Programms fuer 1989 und zur Erstellung des Verzeichnisses
    der als Nahrungsmittelhilfe zu liefernden Erzeugnisse (89/249/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 5. april 1989 om aendring af afgoerelse 89/171/EOEF
    af 1. marts 1989 om fastsaettelse af de samlede maengder foedevarehjaelp i henhold
    til 1989-programmet og af listen over produkter, der kan leveres som foedevarehjaelp
    (89/249/EOEF)
  type: main
- language: el
