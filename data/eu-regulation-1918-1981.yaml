    Mindestpreises sowie der Produktionsbeihilfe für Kirschen, in Sirup haltbar gemacht,
    für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordng (EØF) nr. 1918/81 af 10. juli 1981 om ændring
