title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2236 of 16 December 2020 laying
    down rules for the application of Regulations (EU) 2016/429 and (EU) 2017/625
    of the European Parliament and of the Council as regards model animal health certificates
    for the entry into the Union and movements within the Union of consignments of
    aquatic animals and of certain products of animal origin from aquatic animals,
    official certification regarding such certificates and repealing Regulation (EC)
    No 1251/2008
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/2236 de la Commission du 16 décembre
    2020 portant modalités d’application des règlements (UE) 2016/429 et (UE)
    2017/625 du Parlement européen et du Conseil en ce qui concerne les modèles
    de certificat zoosanitaire pour l’entrée dans l’Union et les mouvements au
    sein de l’Union d’envois d’animaux aquatiques et de certains produits d’origine
    animale issus d’animaux aquatiques, ainsi qu’en ce qui concerne la certification
    officielle relative à ces certificats, et abrogeant le règlement (CE) no 1251/2008
  type: main
- language: de
  script: Latn
