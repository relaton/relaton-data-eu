    Veterinärbescheinigungen für den Eingang in die Union von Sendungen von Wassertieren
    und von bestimmten Erzeugnissen tierischen Ursprungs aus Wassertieren und für
    deren Verbringungen innerhalb der Union sowie hinsichtlich der amtlichen Bescheinigungstätigkeit
    im Zusammenhang mit derartigen Bescheinigungen und zur Aufhebung der Verordnung
    (EG) Nr. 1251/2008
  type: main
