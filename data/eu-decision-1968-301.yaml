    σύμφωνα με το άρθρο 108 παράγραφος 3 της συνθήκης
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '68/301/CEE: Decisione della commissione, del 23 luglio 1968, che autorizza
    la repubblica francese a prendere talune misure di salvaguardia ai sensi dell''articolo
    108, paragrafo 3, del trattato (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
