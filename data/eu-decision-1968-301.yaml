title:
- language: fr
  script: Latn
  content: '68/301/CEE: Décision de la commission, du 23 juillet 1968, autorisant
    la République française à prendre certaines mesures de sauvegarde conformément
    à l''article 108 paragraphe 3 du traité (Le texte en langue française est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '68/301/EWG: Entscheidung der Kommission vom 23. Juli 1968, mit der die
    Französische Republik ermächtigt wird, gemäß Artikel 108 Absatz 3 des Vertrages
    bestimmte Schutzmaßnahmen zu treffen'
  type: main
- language: el
  script: Grek
  content: '68/301/ΕΟΚ: Απόφαση της Επιτροπής, της 23ης
    Ιουλίου 1968, με την οποία επιτρέπεται στην γαλλική
