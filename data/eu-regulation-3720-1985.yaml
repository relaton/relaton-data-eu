title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3720/85 of 20 December 1985 amending for the
    fourth time Regulation (EEC) No 1/85 fixing, for certain fish stocks and groups
    of fish stocks, provisional total allowable catches for 1985 and certain conditions
    under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3720/85 du Conseil du 20 décembre 1985 portant quatrième
    modification du règlement (CEE) no 1/85 fixant, pour certains stocks ou groupes
    de stocks de poissons, les totaux admissibles provisoires des captures pour 1985
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3720/85 des Rates vom 20. Dezember 1985 zur vierten
    Änderung der Verordnung (EWG) Nr. 1/85 zur Festlegung der vorläufig zulässigen
    Gesamtfangmengen und bestimmter Fangbedingungen hinsichtlich der zuläßigen Gesamtfangmengen
    für bestimmte Fischbestände oder Bestandsgruppen für 1985
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3720/85 af 20. december 1985 om fjerde ændring
    af forordning (EØF) nr. 1/85 om fastsættelse for 1985 af de foreløbige samlede
    tilladte fangstmængder for visse fiskebestande og grupper af fiskebestande samt
    af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3720/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για την τέταρτη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1/85 για τον καθορισμό,
    για ορισμένα αποθέματα ιχθύων ή ομάδες αποθεμάτων
    ιχθύων, του προσωρινού συνόλου επιτρεπομένων
    αλιευμάτων για το 1985 και ορισμένων όρων υπό
    τους οποίους μπορούν να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3720/85 del Consiglio del 20 dicembre 1985 recante
    quarta modifica del regolamento (CEE) n. 1/85 che fissa, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale provvisorio delle catture ammissibile
    per il 1985 ed alcune condizioni cui è soggetta la pesca del totale delle catture
    ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3720/85 van de Raad van 20 december 1985 houdende
    vierde wijziging van Verordening (EEG) nr. 1/85 inzake de vaststelling van de
    voor 1985 geldende voorlopige totaal toegestane vangsten voor bepaalde visbestanden
    of groepen visbestanden en bepaalde bij de visserij in het kader van de totaal
    toegestane vangsten in acht te nemen voorschriften
  type: main
