    d'infrastructure
  type: main
- language: de
  script: Latn
  content: '64/449/EWG: Entscheidung der Kommission vom 10. Juli 1964 über die im
    Jahre 1965 durchzuführenden Straßenverkehrszählungen, gemäß der Entscheidung
    des Rates vom 22. Juni 1964 über die Durchführung einer Enquete über die Wegekosten'
  type: main
- language: it
  script: Latn
