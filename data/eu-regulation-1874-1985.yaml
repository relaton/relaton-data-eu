title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1874/85 of 4 July 1985 amending Regulation
    (EEC) No 262/79 as regards the products to be incorporated in concentrated butter
    for processing into formula B products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1874/85 de la Commission du 4 juillet 1985 modifiant
    le règlement (CEE) no 262/79 en ce qui concerne les produits à incorporer dans
    le beurre concentré destiné à être transformé en produits de la formule B
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1874/85 der Kommission vom 4. Juli 1985 zur Änderung
    der Verordnung (EWG) Nr. 262/79 bezüglich der Erzeugnisse, die dem zu Erzeugnissen
    der Formel B zu verarbeitenden Butterfett beizumischen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1874/85 af 4. juli 1985 om ændring
    af forordning (EØF) nr. 262/79 for så vidt angår de produkter, der skal tilsættes
    smørkoncentrat til forarbejdning til produkter under formel B
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1874/85 της Επιτροπής
    της 4ης Ιουλίου 1985 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 262/79 όσον αφορά τα προϊόντα που ενσωματώνονται
    στο συμπυκνωμένο βούτυρο που προορίζεται να
    μεταποιηθεί σε προϊόντα του τύπου Β
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1874/85 della Commissione del 4 luglio 1985 che modifica
    il regolamento (CEE) n. 262/79 per quanto concerne i prodotti da incorporare nel
    burro concentrato destinato ad essere trasformato in prodotti della formula B
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1874/85 van de Commissie van 4 juli 1985 houdende
    wijziging van Verordening (EEG) nr. 262/79 wat de produkten betreft toe te voegen
    aan boterconcentraat, bestemd om tot produkten van de formule B te worden verwerkt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1874/85 da Comissão, de 4 de Julho de 1985, que
    altera o Regulamento (CEE) n.° 262/79 no que diz respeito aos produtos a incorporar
    na manteiga concentrada destinada a ser transformada em produtos da fórmula B
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1874/85 de la Comisión, de 4 de julio de 1985, por
    el que se modifica el Reglamento (CEE) n° 262/79 en lo que se refiere a los productos
    que han de incorporarse a la mantequilla concentrada destinada a ser transformada
    en productos de la fórmula B
  type: main
