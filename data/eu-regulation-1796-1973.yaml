title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1796/73 of the Commission of 29 June 1973 amending
    Regulation (EEC) No 1373/70 on common rules for the application of the system
    of import and export licences and advance fixing certificates for agricultural
    products subject to a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1796/73 de la Commission, du 29 juin 1973, modifiant
    le règlement (CEE) n° 1373/70 portant modalités communes d'application du régime
    de certificats d'importation, d'exportation et de préfixation pour les produits
    agricoles soumis à un régime de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1796/73 der Kommission vom 29. Juni 1973 zur Änderung
    der Verordnung (EWG) Nr. 1373/70 über gemeinsame Durchführungsvorschriften für
    Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für landwirtschaftliche
    Erzeugnisse, die einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1796/73 af 29. juni 1973 om ændring
    af forordning (EØF) nr. 1373/70 om fælles gennemførelsesbestemmelser for import-
    og eksportlicenser samt forudfastsættelsesattester for landbrugsprodukter, for
    hvilke der gælder en ordning med fællespriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1796/73 della Commissione, del 29 giugno 1973, recante
    modifica del regolamento (CEE) n. 1373/70, che stabilisce modalità comuni di
    applicazione per il regime dei titoli di importazione e di esportazione e dei
    certificati di fissazione anticipata, relativi a prodotti agricoli soggetti ad
    un regime di prezzo unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1796/73 van de Commissie van 29 juni 1973 tot wijziging
    van Verordening (EEG) nr. 1373/70 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatie certificaten voor landbouwprodukten
    waarvoor een stelsel van gemeenschappelijke prijzen geldt
  type: main
