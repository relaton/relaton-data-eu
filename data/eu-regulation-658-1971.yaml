  content: Règlement (CEE) n° 658/71 du Conseil, du 30 mars 1971, portant suspension
    totale du droit autonome du tarif douanier commun pour les huîtres (autres que
    plates) ne pesant pas plus de 12 grammes la pièce, de la sous- position EX. 03.03
    B I b)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 658/71 des Rates vom 30. März 1971 über die vollständige
    Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs für Austern (ausgenommen
    flache) mit einem Stückgewicht von höchstens 12 g der Tarifstelle ex 03.03 B
    I b)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 658/71 del Consiglio, del 30 marzo 1971, relativo
    alla sospensione totale del dazio autonomo della tariffa doganale comune per le
    ostriche (diverse da quelle piatte pesanti, per pezzo, non più di 12 g, della
    sottovoce ex 03.03 B I b)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 658/71 van de Raad van 30 maart 1971 houdende algehele
    schorsing van het autonome recht van het gemeenschappelijk douanetarief voor oesters
    (andere dan zaaioesters), wegende per stuk niet meer dan 12 g, van onderverdeling
    ex 03.03 B I b)
