title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1361 of 28 July 2022 amending
    Regulation (EU) No 748/2012 as regards the certification, oversight and enforcement
    tasks of the competent authorities in the implementation of the rules concerning
    the organisations involved in the design and production of aircraft used for sport
    and recreational aviation
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1361 de la Commission du 28 juillet
    2022 modifiant le règlement (UE) no 748/2012 en ce qui concerne les tâches de
    certification, de supervision et de mise en application incombant aux autorités
    compétentes dans le cadre de la mise en œuvre des règles relatives aux organismes
    intervenant dans la conception et la production des aéronefs utilisés pour l’aviation
    sportive et de loisir
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1361 der Kommission vom 28. Juli 2022
    zur Änderung der Verordnung (EU) Nr. 748/2012 in Bezug auf die Zertifizierungs-,
    Aufsichts- und Durchsetzungsaufgaben der zuständigen Behörden bei der Umsetzung
    der Vorschriften für Organisationen, die an der Entwicklung und Herstellung von
    im Flugsport und in der Freizeitluftfahrt eingesetzten Luftfahrzeugen beteiligt
    sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1361 на Комисията
    от 28 юли 2022 година за изменение на Регламент
    (ЕС) № 748/2012 по отношение на задачите по сертифициране,
    надзор и правоприлагане на компетентните органи
    при прилагането на правилата относно организациите,
    участващи в проектирането и производството
    на въздухоплавателни средства, използвани
    за спортно и развлекателно въздухоплаване
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1361 ze dne 28. července 2022,
    kterým se mění nařízení (EU) č. 748/2012, pokud jde o úkoly příslušných
    úřadů v oblasti certifikace, dozoru a vynucování při provádění pravidel
    týkajících se organizací zapojených do projektování a výroby letadel používaných
    pro sportovní a rekreační letectví
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1361 af 28. juli 2022
    om ændring af forordning (EU) nr. 748/2012 for så vidt angår de kompetente
    myndigheders certificerings-, tilsyns- og håndhævelsesopgaver i forbindelse
    med gennemførelsen af reglerne vedrørende de organisationer, der er involveret
    i konstruktion og fremstilling af luftfartøjer til sports- og fritidsflyvning
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1361 της Επιτροπής
