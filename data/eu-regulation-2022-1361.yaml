    de aeronaves utilizadas na aviação desportiva e recreativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1361 al Comisiei din 28 iulie
    2022 de modificare a Regulamentului (UE) nr. 748/2012 în ceea ce privește sarcinile
    de certificare, de supraveghere și de asigurare a aplicării normelor care revin
    autorităților competente în cadrul punerii în aplicare a normelor referitoare
    la organizațiile implicate în proiectarea și producția de aeronave utilizate
    în aviația sportivă și de agrement
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1361 z 28. júla 2022, ktorým
    sa mení nariadenie (EÚ) č. 748/2012, pokiaľ ide o úlohy príslušných orgánov
    v oblasti osvedčovania, dohľadu a presadzovania predpisov pri vykonávaní pravidiel
    týkajúcich sa organizácií zapojených do projektovania a výroby lietadiel
    používaných na letecký šport a rekreačné lietanie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1361 z dne 28. julija 2022 o spremembi
