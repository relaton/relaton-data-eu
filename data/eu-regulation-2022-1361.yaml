    kyse toimivaltaisten viranomaisten sertifiointi-, valvonta- ja vaatimustenmukaisuuden
    varmistamistehtävistä urheilu- ja harrasteilmailussa käytettävien ilma-alusten
    suunnitteluun ja tuotantoon osallistuvia organisaatioita koskevien sääntöjen
    täytäntöönpanossa
  type: main
