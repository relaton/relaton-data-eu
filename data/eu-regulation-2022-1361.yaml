    a dhéantar mar spórt agus mar chaitheamh aimsire
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1361 оd 28. srpnja 2022. o izmjeni
    Uredbe (EU) br. 748/2012 u pogledu zadaća certifikacije, nadzora i osiguravanja
    provedbe propisa nadležnih tijela u provedbi pravila povezanih s organizacijama
    uključenima u projektiranje i proizvodnju zrakoplova koji se upotrebljavaju u
    sportskom i rekreacijskom zrakoplovstvu
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1361 végrehajtási rendelete (2022. július 28.)
    a 748/2012/EU rendeletnek a sport- és szabadidős repülésre szánt légi járművek
    tervezésében és gyártásában érintett szervezetekre vonatkozó szabályok
    végrehajtása során az illetékes hatóságok tanúsítási, felügyeleti és
    végrehajtási feladatai tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1361 della Commissione del 28 luglio
    2022 che modifica il regolamento (UE) n. 748/2012 per quanto riguarda i compiti
    di certificazione, sorveglianza e applicazione delle autorità competenti nell’ambito
    dell’attuazione delle norme concernenti le imprese coinvolte nella progettazione
    e produzione di aeromobili utilizzati nell’aviazione sportiva e da diporto
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1361 (2022. gada 28. jūlijs)
    par grozījumiem Regulā (ES) Nr. 748/2012 attiecībā uz kompetento iestāžu
    sertifikācijas, uzraudzības un izpildes uzdevumiem, īstenojot noteikumus par
    organizācijām, kas iesaistītas aviācijas sportā un izklaides lidojumos izmantojamu
    gaisa kuģu projektēšanā un ražošanā
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1361 2022 m. liepos 28 d.
    kuriuo dėl sertifikavimo, priežiūros ir vykdymo užtikrinimo užduočių, kurias
    kompetentingos institucijos atlieka įgyvendindamos taisykles, susijusias su sportinei
    ir rekreacinei aviacijai naudojamų orlaivių projektavimo ir gamybos organizacijomis,
    iš dalies keičiamas Reglamentas (ES) Nr. 748/2012
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1361 tat-28
    ta’ Lulju 2022 li jemenda r-Regolament (UE) Nru 748/2012 fir-rigward tal-kompiti
    ta’ ċertifikazzjoni, sorveljanza u infurzar tal-awtoritajiet kompetenti fl-implimentazzjoni
    tar-regoli li jikkonċernaw l-organizzazzjonijiet involuti fid-disinn u fil-produzzjoni
    ta’ inġenji tal-ajru li jintużaw għall-avjazzjoni sportiva u rikreattiva
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1361 van de Commissie van 28 juli 2022
    tot wijziging van Verordening (EU) nr. 748/2012 wat betreft de certificerings-,
    toezichts- en handhavingstaken van de bevoegde autoriteiten in het kader van de
    tenuitvoerlegging van de regels betreffende de organisaties die betrokken zijn
    bij het ontwerp en de productie van luchtvaartuigen voor de sport- en recreatieve
    luchtvaart
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1361 z dnia 28 lipca 2022
    r. zmieniające rozporządzenie (UE) nr 748/2012 w odniesieniu do zadań właściwych
    organów w zakresie certyfikacji, nadzoru i egzekwowania prawodawstwa w ramach
    wdrażania przepisów dotyczących organizacji uczestniczących w projektowaniu
    i produkcji statków powietrznych wykorzystywanych w lotnictwie sportowym i rekreacyjnym
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1361 da Comissão de 28 de julho de
