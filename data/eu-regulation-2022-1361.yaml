    letalstvu
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1361 de la Comisión de 28 de julio
    de 2022 por el que se modifica el Reglamento (UE) n.o 748/2012 en lo que respecta
