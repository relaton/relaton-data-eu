title:
- language: en
  script: Latn
  content: '81/628/EEC: Commission Decision of 24 July 1981 on the duty-free importation
    of goods intended to be distributed or made available free of charge to victims
    of the earthquake which occurred in June 1981 in Sicily (Only the Italian text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/628/CEE: Décision de la Commission, du 24 juillet 1981, relative à
    l''admission en franchise des droits à l''importation de marchandises destinées
    à être distribuées ou mises à la disposition gratuitement des victimes du
    tremblement de terre survenu en Sicile en juin 1981 (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/628/EWG: Entscheidung der Kommission vom 24. Juli 1981 über die Befreiung
    von Eingangsabgaben für bestimmte Waren, die an die von dem im Juni 1981 in Sizilien
    aufgetretenen Erdbeben betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich
    zur Verfügung gestellt werden sollen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/628/EØF: Kommissionens beslutning af 24. juli 1981 om fritagelse for
    told ved indførsel af varer, der er bestemt til gratis udlevering til eller gratis
    bliver stillet til rådighed for ofrene for jordskælvene i juni 1981 på Sicilien
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/628/ΕΟΚ: Απόφαση τής Επιτροπής τής 24ης
    Ιουλίου 1981 περί τής εισαγωγής, μέ ατέλεια δασμών,
    τών εμπορευμάτων τά οποία προορίζονται νά
    διανεμηθούν ή νά διατεθούν δωρεάν στά θύματα
    τού σεισμού πού έπληξε τή Σικελία τόν Ιούνιο
    τού 1981 (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/628/CEE: Decisione della Commissione, del 24 luglio 1981, relativa
    all''ammissione in franchigia dai diritti all''importazione di merci destinate
    ad essere distribuite o messe gratuitamente a disposizione delle vittime del terremoto
    avvenuto in Sicilia nel giugno 1981 (Il testo in lingua italiana è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/628/EEG: Beschikking van de Commissie van 24 juli 1981 betreffende
    de invoer met vrijstelling van rechten bij invoer van goederen, bestemd om gratis
    te worden verstrekt of ter beschikking gesteld aan de slachtoffers van de in juni
    1981 voorgevallen aardbeving op Sicilië (Slechts de tekst in de Italiaanse taal
    is authentiek)'
