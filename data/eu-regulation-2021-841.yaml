  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/841 da Comissão de 19 de fevereiro de 2021
    que altera o Regulamento Delegado (UE) n.o 640/2014 no respeitante às regras
    em matéria de incumprimento no que se refere ao sistema de identificação e
    registo de bovinos, ovinos e caprinos e ao cálculo do nível das sanções administrativas
    relativas a animais declarados ao abrigo dos regimes de ajuda «animais» ou das
    medidas de apoio «animais»
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/841 al Comisiei din 19 februarie 2021 de
    modificare a Regulamentului delegat (UE) nr. 640/2014 în ceea ce privește normele
    referitoare la neconformitățile legate de sistemul de identificare și înregistrare
    a bovinelor, ovinelor și caprinelor și la calcularea nivelului sancțiunilor
    administrative cu privire la animalele declarate în cadrul schemelor de ajutoare
    pentru animale sau al măsurilor de sprijin legate de animale
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/841 z 19. februára 2021, ktorým
