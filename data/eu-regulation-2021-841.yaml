    galvijų, avių ir ožkų identifikavimo ir registravimo sistema, ir administracinių
    nuobaudų, susijusių su gyvuliais, kurie buvo deklaruoti pagal paramos už gyvulius
    sistemas arba su gyvuliais susijusias paramos priemones, dydžio apskaičiavimo
