  script: Latn
  content: Commission Delegated Regulation (EU) 2021/841 of 19 February 2021 amending
    Delegated Regulation (EU) No 640/2014 as regards the rules on non-compliances
    in relation to the system for the identification and registration for bovine,
    ovine and caprine animals and on the calculation of the level of administrative
    penalties in respect of declared animals under animal aid schemes or animal-related
    support measures
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/841 de la Commission du 19 février 2021
    modifiant le règlement délégué (UE) no 640/2014 en ce qui concerne les règles
    relatives aux cas de non-conformité au regard du système d’identification
    et d’enregistrement des bovins, des ovins et des caprins et au calcul du niveau
    des sanctions administratives en ce qui concerne les animaux déclarés au titre
    des régimes d’aide liée aux animaux ou des mesures de soutien lié aux animaux
  type: main
- language: de
  script: Latn
