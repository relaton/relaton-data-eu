    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/841 della Commissione del 19 febbraio 2021
    che modifica il regolamento delegato (UE) n. 640/2014 per quanto riguarda le norme
    sulle inadempienze in relazione al sistema di identificazione e registrazione
    degli animali delle specie bovina, ovina e caprina e sul calcolo dell’entità
    delle sanzioni amministrative per gli animali dichiarati nell’ambito dei regimi
    di aiuti per animale o delle misure di sostegno connesse agli animali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/841 (2021. gada 19. februāris),
