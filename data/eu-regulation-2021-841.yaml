  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/841 de la Comisión de 19 de febrero de 2021
    por el que se modifica el Reglamento Delegado (UE) n.o 640/2014 en lo que respecta
    a las normas sobre incumplimientos en relación con el sistema de identificación
