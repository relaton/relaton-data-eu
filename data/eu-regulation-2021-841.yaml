    neatbilstībām, kuras saistītas ar liellopu, aitu un kazu identifikācijas un
    reģistrācijas sistēmu, un noteikumiem par to, kā aprēķināmi administratīvie
    sodi attiecībā uz dzīvniekiem, kas deklarēti dzīvnieku atbalsta shēmu vai
    ar dzīvniekiem saistīta atbalsta pasākumu satvarā
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/841 2021 m. vasario 19 d.
