    von Rindern, Schafen und Ziegen und über die Berechnung der Höhe der Verwaltungssanktionen
    bei im Rahmen von Beihilferegelungen für Tiere oder tierbezogenen Stützungsmaßnahmen
    gemeldeten Tieren
  type: main
