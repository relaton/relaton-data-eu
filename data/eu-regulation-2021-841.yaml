    v súvislosti s nahlásenými zvieratami v rámci režimov pomoci na zvieratá
    alebo podporných opatrení na zvieratá
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/841 z dne 19. februarja 2021 o spremembi
