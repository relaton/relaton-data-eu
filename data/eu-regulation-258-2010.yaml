title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 258/2010 of 25 March 2010 imposing special
    conditions on the imports of guar gum originating in or consigned from India due
    to contamination risks by pentachlorophenol and dioxins, and repealing Decision
    2008/352/EC
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 258/2010 de la Commission du 25 mars 2010 soumettant
    les importations de gomme de guar originaire ou en provenance d’Inde à des
    conditions particulières, en raison des risques de contamination par le pentachlorophénol
    et les dioxines, et abrogeant la décision 2008/352/CE
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 258/2010 der Kommission vom 25. März 2010 zum Erlass
    von Sondervorschriften für die Einfuhr von Guarkernmehl, dessen Ursprung oder
