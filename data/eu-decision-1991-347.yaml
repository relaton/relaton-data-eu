  content: '91/347/EEC: Commission Decision of 24 June 1991 authorizing the French
    Republic to apply intra-Community surveillance in respect of imports of woven
    fabrics of cotton originating in Brazil (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/347/CEE: Décision de la Commission du 24 juin 1991 autorisant la République
    française à procéder à une surveillance intracommunautaire à l''égard des
    importations de tissus de coton originaires du Brésil (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 24. Juni 1991 zur Ermächtigung der Französischen
    Republik, eine innergemeinschaftliche Überwachung der Einfuhren von Gewebe aus
    Baumwolle mit Ursprung in Brasilien einzuführen (Nur der französische Text ist
    verbindlich) (91/347/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 24. juni 1991 om bemyndigelse af Den Franske
    Republik til at indføre et tilsyn inden for Fællesskabet med importen af vævet
    stof af bomuld med oprindelse i Brasilien (Kun den franske udgave er autentisk)
    (91/347/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/347/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
    Ιουνίου 1991 με την οποία εξουσιοδοτείται η Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών υφασμάτων από βαμβάκι καταγωγής
    Βραζιλίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 24 giugno 1991 che autorizza la Repubblica
    francese a procedere ad una sorveglianza intracomunitaria delle importazioni di
    tessuti di cotone della categoria 2 originari del Brasile (Il testo in lingua
    francese è il solo facente fede) (91/347/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 24 juni 1991 waarbij de Franse Republiek
