  content: Règlement n° 218/67/CEE du Conseil, du 27 juin 1967, modifiant le règlement
    n° 34/67/CEE relatif à certaines mesures concernant l'importation de viande
    bovine congelée et de vaches vivantes destinées à la fabrication, en provenance
    des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 218/67/EWG des Rates vom 27. Juni 1967 zur Änderung der
    Verordnung Nr. 34/67/EWG über bestimmte Maßnahmen bei Einfuhren aus dritten
    Ländern von gefrorenem Rindfleisch und von lebenden Kühen, die zur Verarbeitung
    bestimmt sind
  type: main
- language: it
  script: Latn
  content: Regolamento n. 218/67/CEE del Consiglio, del 27 giugno 1967, che modifica
    il regolamento n. 34/67/CEE relativo a talune misure concernenti l'importazione
    di carni bovine congelate e di vacche vive destinate alla trasformazione in provenienza
    dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 218/67/EEG van de Raad van 27 juni 1967 houdende wijziging
    van Verordening Nr. 34/67/EEG betreffende bepaalde maatregelen inzake de invoer
    uit derde landen van bevroren rundvlees en voor verwerking bestemde levende koeien
