  script: Latn
  content: Commission Regulation (EEC) No 758/84 of 23 March 1984 re-establishing
    the levying of customs duties on antimony oxides, falling within subheading 28.28
    ex N and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 758/84 de la Commission du 23 mars 1984 portant rétablissement
