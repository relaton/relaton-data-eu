id: EUDecision1997654
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/654/EC: Commission Decision of 29 September 1997 amending Decision
    97/280/EC recognizing that the production of certain quality wines produced in
    specified regions in Austria, by reason of their qualitative characteristics,
    is far from able to satisfy demand (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/654/CE: Décision de la Commission du 29 septembre 1997 modifiant la
    décision 97/280/CE reconnaissant que la production de certains vins de qualité
    produits dans des régions déterminées en Autriche est, du fait des caractéristiques
    qualitatives de ces vins, largement inférieure à la demande (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/654/EG: Entscheidung der Kommission vom 29. September 1997 zur Änderung
    der Entscheidung 97/280/EG zur Feststellung, daß die Erzeugung von Qualitätsweinen
    bestimmter Anbaugebiete in Österreich wegen qualitativer Merkmale der Nachfrage
    nicht entspricht (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/654/EF: Kommissionens beslutning af 29. september 1997 om ændring
    af beslutning 97/280/EF om anerkendelse af, at produktionen af visse kvalitetsvine
    fra bestemte dyrkningsområder i Østrig på grund af disse vines kvalitative
    egenskaber langtfra er tilstrækkelig til at dække efterspørgslen (Kun den tyske
    tekst er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/654/ΕΚ: Απόφαση της Επιτροπής της 29ης Σεπτεμβρίου
    1997 για την τροποποίηση της απόφασης 97/280/ΕΚ,
    με την οποία αναγνωρίζεται ότι η παραγωγή ορισμένων
    οίνων ποιότητας που παράγονται σε καθορισμένες
    περιοχές της Αυστρίας είναι, λόγω των ποιοτικών
    χαρακτηριστικών των οίνων αυτών, σε μεγάλο
    βαθμό κατώτερη από τη ζήτηση (Το κείμενο στη
    γερμανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/654/EY: Komission päätös, tehty 29 päivänä syyskuuta 1997, tiettyjen
    Itävallassa määritetyillä alueilla tuotettujen laatuviinien tuotannon toteamisesta
    niiden laatuominaisuuksien vuoksi huomattavasti kysyntää pienemmäksi tehdyn
    päätöksen 97/280/EY muuttamisesta (Ainoastaan saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/654/CE: Decisione della Commissione del 29 settembre 1997 recante modifica
    della decisione 97/280/CE che riconosce la produzione di taluni vini di qualità
    prodotti in determinate regioni dell''Austria largamente inferiore alla domanda
    a causa delle caratteristiche qualitative di tali vini (Il testo in lingua tedesca
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/654/EG: Beschikking van de Commissie van 29 september 1997 tot wijziging
    van Beschikking 97/280/EG houdende erkenning van het feit dat de productie van
    bepaalde v.q.p.r.d.''s in Oostenrijk, gezien de kwaliteitskenmerken van deze wijnen,
    ver bij de vraag achterblijft (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '97/654/CE: Decisão da Comissão de 29 de Setembro de 1997 que altera
    a Decisão 97/280/CE que reconhece que a produção na Áustria de determinados
    vinhos de qualidade produzidos em regiões determinadas é, pelas suas características
    de qualidade, substancialmente inferior à procura (Apenas faz fé o texto em
    língua alemã)'
  type: main
- language: es
  script: Latn
  content: '97/654/CE: Decisión de la Comisión de 29 de septiembre de 1997 que modifica
    la Decisión 97/280/CE, por la que se reconoce que la producción en Austria de
    determinados vinos de calidad producidos en regiones determinadas es muy inferior
    a la demanda, debido a sus características cualitativas (El texto en lengua alemana
    es el único auténtico)'
  type: main
- language: sv
  script: Latn
  content: '97/654/EG: Kommissionens beslut av den 29 september 1997 om ändring av
    beslut 97/280/EG om erkännande av att produktionen av vissa kvalitetsviner som
    framställs i specificerade områden i Österrike på grund av dessa viners kvalitativa
    egenskaper ligger långt under efterfrågan (Endast den tyska texten är giltig)'
  type: main
