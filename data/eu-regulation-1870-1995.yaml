  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1870/95, annettu 26 päivänä heinäkuuta 1995,
    yksityiskohtaisista säännöistä kesannointimaan käytön soveltamisesta yhteisössä
    valmistettavien tuotteiden raaka-aineiden tuottamiseen ensisjaisesti muihin tarkoituksiin
    kuin elintarvikkeiksi tai eläinten ravinnoksi annetun asetuksen (ETY) N:o 334/93
    muuttamisesta sekä yksityiskohtaisista säännöistä neuvoston asetuksen (ETY)
    N:o 1765/92 soveltamisesta kesannoidun alan käyttämiseen yhteisössä valmistettavien
    teollisuustuotteiden monivuotisten raaka-aineiden tuottamiseen, joita ei ole tarkoitettu
    ihmis- tai eläinravinnoksi annetun asetuksen (ETY) N:o 2595/93 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1870/95 della Commissione, del 26 luglio 1995, che
    modifica il regolamento (CEE) n. 334/93 recante modalità d'applicazione relative
    all'uso di superfici ritirate dalla produzione allo scopo di ottenere materiali
    per la fabbricazione, nella Comunità, di prodotti non destinati in primo luogo
    al consumo umano o animale e che abroga il regolamento (CEE) n. 2595/93 che stabilisce
    le modalità d'applicazione del regolamento (CEE) n. 1765/92 del Consiglio riguardo
    all'utilizzo delle superfici messe a riposo ai fini della produzione di materie
    prime pluriennali destinate alla fabbricazione nella Comunità di prodotti adibiti
    ad usi diversi dall'alimentazione umana o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1870/95 van de Commissie van 26 juli 1995 houdende
    wijziging van Verordening (EEG) nr. 334/93 tot vaststelling van uitvoeringsbepalingen
    betreffende het gebruik van uit produktie genomen grond voor de produktie van
    grondstoffen voor de vervaardiging, in de Gemeenschap, van niet specifiek voor
    voeding of vervoedering bestemde produkten en tot intrekking van Verordening (EEG)
    nr. 2595/93 houdende uitvoeringsbepalingen van Verordening (EEG) nr. 1765/92 van
    de Raad wat betreft het gebruik van braakgelegde grond voor de produktie van door
    meerjarige teelt verkregen grondstoffen voor de vervaardiging, in de Gemeenschap,
    van niet voor voeding of vervoedering bestemde produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1870/95 da Comissão, de 26 de Julho de 1995, que
    altera o Regulamento (CEE) nº 334/93, que estabelece normas de execução para
    a utilização de terras retiradas para a produção de matérias destinadas ao
    fabrico, na Comunidade, de produtos não destinados primariamente ao consumo humano
    ou animal, e revoga o Regulamento (CEE) nº 2595/93, que estabelece normas de
    execução do Regulamento (CEE) nº 1765/92 do Conselho no que respeita à utilização
    de terras retiradas na produção de matérias-primas plurianuais destinadas ao
    fabrico, na Comunidade, de produtos não destinados à alimentação humana e/ou
    animal
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1870/95 de la Comisión, de 26 de julio de 1995, que
    modifica el Reglamento (CEE) nº 334/93, por el que se establecen disposiciones
    de aplicación relativas a la utilización de las tierras retiradas de la producción
    con vistas a la obtención de materias para la fabricación en la Comunidad de
    productos que no se destinen principalmente al consumo humano o animal, y que
    deroga el Reglamento (CEE) nº 2595/93, por el que se establecen disposiciones
    de aplicación del Reglamento (CEE) nº 1765/92 del Consejo en lo relativo a la
    utilización de tierras retiradas de la producción para la obtención de materias
    primas plurianuales destinadas a la elaboración en la Comunidad de productos
    destinados a fines distintos de la alimentación humana o animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1870/95 av den 26 juli 1995 om ändring
    av förordning (EEG) nr 334/93 om genomförandebestämmelser för användningen
    av jordbruksmark som tagits ur bruk till produktiva råvaror för tillverkning
    inom gemenskapen av produkter som inte primärt är avsedda till livsmedel eller
    djurfoder, och om upphävande av förordning (EEG) nr 2595/93 om tillämpningsföreskrifter
    för rådets förordning (EEG) nr 1765/92 vad avser användningen av uttagen mark
    för produktion av fleråriga råvaror avsedda för framställning inom gemenskapen
    av produkter som inte är avsedda som livsmedel eller djurfoder
  type: main
