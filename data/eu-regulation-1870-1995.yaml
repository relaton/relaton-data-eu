title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1870/95 of 26 July 1995 amending Regulation
    (EEC) No 334/93 laying down detailed implementing rules for the use of land set
    aside for the provision of materials for the manufacture within the Community
    of products not primarily intended for human or animal consumption and repealing
    Regulation (EEC) No 2595/93 laying down detailed rules for implementing Council
    Regulation (EEC) No 1765/92 as regards the use of land set aside for the production
    of multiannual raw materials for the manufacture within the Community of products
    not intended for human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1870/95 de la Commission, du 26 juillet 1995, modifiant
    le règlement (CEE) n° 334/93 portant modalités d'application relatives à l'utilisation
    des terres mises en jachère pour la production de matières premières servant
    à la fabrication, dans la Communauté, de produits destinés à des fins principales
    autres que la consommation humaine ou animale et abrogeant le règlement (CEE)
    n° 2595/93 portant modalités d'application du règlement (CEE) n° 1765/92 du
    Conseil en ce qui concerne l'utilisation des terres mises en jachère pour la
    production, dans la Communauté de produits destinés à des fins autres que l'alimentation
    humaine et/ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1870/95 der Kommission vom 26. Juli 1995 zur Änderung
    der Verordnung (EWG) Nr. 334/93 mit detaillierten Durchführungsbestimmungen für
    die Nutzung stillgelegter Flächen zur Erzeugung von Ausgangserzeugnissen, die
    in der Gemeinschaft zu nicht in erster Linie für Lebens- oder Futtermittelzwecke
    bestimmten Erzeugnissen verarbeitet werden und zur Aufhebung der Verordnung (EWG)
    Nr. 2595/93 mit Durchführungsvorschriften zur Verordnung (EWG) Nr. 1765/92 des
    Rates hinsichtlich der Verwendung stillgelegter Flächen für die Erzeugung ausdauernder
    Kulturpflanzen, aus denen in der Gemeinschaft Erzeugnisse für andere als Lebens-
    und/oder Futtermittelzwecke hergestellt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1870/95 af 26. juli 1995 om ændring
    af forordning (EØF) nr. 334/93 om gennemførelsesbestemmelser for anvendelse
    af udtagne landbrugsarealer med henblik på tilvejebringelse af materialer til
    fremstilling i Fællesskabet af produkter, som ikke primært er bestemt til konsum
    eller foderbrug, og om ophævelse af forordning (EØF) nr. 2595/93 om gennemførelsesbestemmelser
    til Rådets forordning (EØF) nr. 1765/92 for så vidt angår anvendelse af udtagne
    arealer med henblik på tilvejebringelse af flerårige råvarer til fremstilling
    i Fællesskabet af produkter, som ikke er bestemt til konsum og/eller foderbrug
  type: main
- language: el
  script: Grek
