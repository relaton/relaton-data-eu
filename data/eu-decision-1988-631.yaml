title:
- language: en
  script: Latn
  content: '88/631/EEC: Commission Decision of 1 December 1988 amending for the fourth
    time Commission Decision 87/361/EEC recognizing certain parts of the territory
    of the French Republic as being officially swine-fever free (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/631/CEE: Décision de la Commission du 1er décembre 1988 portant quatrième
    modification de la décision de la Commission 87/361/CEE reconnaissant certaines
    parties du territoire de la République française comme officiellement indemnes
    de peste porcine (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '88/631/EWG: Entscheidung der Kommission vom 1. Dezember 1988 zur vierten
    Änderung der Entscheidung 87/361/EWG der Kommission, durch die bestimmte Teile
    des Hoheitsgebiets der Französischen Republik amtlich als schweinepestfrei anerkannt
    werden (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/631/EØF: Kommissionens beslutning af 1. december 1988 om ændring
