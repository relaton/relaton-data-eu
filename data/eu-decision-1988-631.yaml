    της απόφασης της Επιτροπής 87/361/ΕΟΚ για την
    αναγνώριση ορισμένων τμημάτων του εδάφους
    της Γαλλικής Δημοκρατίας ως επίσημα απαλλαγμένων
    από την πανώλη των χοίρων (Το κείμενο στη γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/631/CEE: Decisione della Commissione del 1o dicembre 1988 recante quarta
