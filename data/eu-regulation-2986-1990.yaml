title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2986/90 of 12 October 1990 amending the
    list annexed to regulation (EEC) No 55/87 establishing the list of vessels exceeding
    eight metres length overall permitted to use beam trawls within certain areas
    of the community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2986/90 de la Commission, du 12 octobre 1990, modifiant
    la liste annexée au règlement (CEE) n° 55/87 établissant la liste des bateaux
    dont la longueur hors tout dépasse huit mètres autorisés à pêcher à l'aide
    de chaluts à perches dans certaines zones de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2986/90 der Kommission vom 12. Oktober 1990 zur Änderung
    der liste im Anhang der Verordnung (EWG) Nr. 55/87 zur Festlegung der liste der
    schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten Zonen
    der Gemeinschaft mit baumkurren fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2986/90 af 12. oktober 1990 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 55/87 om listen
    over fartøjer med en længde overalt på over 8 m, der i visse af Fællesskabets
    kystområder har tilladelse til at anvende bomtrawl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2986/90 της Επιτροπής
    της 12ης Οκτωβρίου 1990 για την τροποποίηση του
    καταλόγου που είναι προσαρτημένος στον κανονισμό
    (ΕΟΚ) αριθ. 55/87 για την κατάρτιση του καταλόγου
    των σκαφών συνολικού μήκους άνω των οκτώ μέτρων
    τα οποία επιτρέπεται να χρησιμοποιούν δοκότρατες
    σε ορισμένες παράκτιες περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2986/90 della Commissione, del 12 ottobre 1990, recante
    modifica dell'elenco allegato al regolamento (CEE) n. 55/87 che fissa l'elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati ad
    usare reti a strascico a pali in determinate zone della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2986/90 van de commissie van 12 oktober 1990 houdende
    wijziging van de lijst in de bijlage bij verordening (EEG) nr. 55/87 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde zones van de gemeenschap mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2986/90 da comissão, de 12 de outubro de 1990, que
    altera a lista anexa ao Regulamento (CEE) n° 55/87, que estabelece a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar
    redes de arrasto de vara em determinadas zonas da comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2986/90 de la comisión, de 12 de octubre de 1990,
    que modifica la lista aneja al Reglamento (CEE) n° 55/87, por el que se establece
    la lista de barcos cuya eslora total exceda los ocho metros y a los que se permite
    faenar utilizando artes de arrastre de vara dentro de determinadas zonas de la
    comunidad
  type: main
