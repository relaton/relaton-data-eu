title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1849/87 of 30 June 1987 abolishing the countervailing
    charge on peaches including nectarines originating in Spain (except the Canary
    Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1849/87 de la Commission, du 30 juin 1987, supprimant
    la taxe compensatoire à l'importation de pêches, y compris les brugnons et les
    nectarines originaires d'Espagne (excepté les îles Canaries)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1849/87 der Kommission vom 30. Juni 1987 zur Aufhebung
    der Ausgleichsabgabe auf die Einfuhr von Pfirsischen, einschließlich Nektarinen,
    mit Ursprung in Spanien (ausgenommen den Kanarischen Inseln)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1849/87 af 30. juni 1987 om ophævelse
    af udligningsafgiften ved indførsel af ferskener, herunder blodferskener og nektariner
    med oprindelse i Spanien (med undtagelse af De kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1849/87 της Επιτροπής
    της 30ής Ιουνίου 1987 περί καταργήσεως της εξισωτικής
    εισφοράς κατά την εισαγωγή ροδακίνων στα οποία
    περιλαμβάνονται και τα brugnons και Nectarines καταγωγής
    Ισπανίας (εκτός Καναρίων νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1849/87 della Commissione, del 30 giugno 1987, che
    sopprime la tassa di compensazione all'importazione di pesche, comprese le pesche
    noci, originarie della Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1849/87 van de Commissie van 30 juni 1987 houdende
    intrekking van de compenserende heffing op de invoer van perziken, nectarines
    daaronder begrepen, van oorsprong uit Spanje (met uitzondering van de Canarische
    eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1849/87 da Comissão, de 30 de Junho de 1987, que
    suprime o direito de compensação na importação de pêssegos, incluindo as
    nectarinas originárias de Espanha (com excepção das Ilhas Canárias)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1849/87 de la Comisión, de 30 de junio de 1987, por
    el que se suprime el gravamen compensatorio a la importación de melocotones,
    incluidos los griñones y nectarinas de España (excepto las Islas Canarias)
  type: main
