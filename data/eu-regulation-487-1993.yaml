    à la distillation obligatoire visée à l' article 39 du règlement (CEE) n°
    822/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 487/93 der Kommission vom 2. März 1993 zur Festsetzung
    des zur obligatorischen Destillation gemäß Artikel 39 der Verordnung (EWG) Nr.
    822/87 des Rates zu liefernden Prozentsatzes der Tafelweinerzeugung für das Wirtschaftsjahr
    1992/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 487/93 af 2. marts 1993 om fastsættelse
    for produktionsåret 1992/93 af, hvor stor en procent del af produktionen af bordvin,
    der skal leveres til obligatorisk destillation efter artikel 39 i Rådets forordning
    (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
