    mesa a entregar para a destilação obrigatória referida no artigo 39° do Regulamento
    (CEE) n° 822/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 487/93 de la Comisión, de 2 de marzo de 1993, por
