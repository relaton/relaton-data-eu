  content: Commission Regulation (EEC) No 487/93 of 2 March 1993 for the 1992/93 wine
    year the percentages of table wine production to be delivered for compulsory distillation
    as provided for in Article 39 of Council Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 487/93 de la Commission, du 2 mars 1993, fixant pour
