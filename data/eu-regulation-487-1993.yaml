    αριθ. 822/87
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 487/93 della Commissione, del 2 marzo 1993, che fissa,
    per la campagna 1992/93, le percentuali della produzione di vini da tavola da
    consegnare alla distillazione obbligatoria di cui all' articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 487/93 van de Commissie van 2 maart 1993 tot vaststelling,
    voor het wijnoogstjaar 1992/1993, van de percentages van de tafelwijnproduktie
