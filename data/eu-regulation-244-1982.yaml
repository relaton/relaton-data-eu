title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 244/82 of 1 February 1982 re-establishing
    the levying of customs duties on glazed setts, flags and paving, hearth and wall
    tiles, falling within heading No 69.08 and originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3601/81
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 244/82 de la Commission, du 1er février 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres carreaux,
    pavés et dalles de pavement ou de revêtement, de la position 69.08 du tarif
    douanier commun, originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 244/82 der Kommission vom 1. Februar 1982 zur Wiedereinführung
    der Erhebung der Zölle für Fliesen, gebrannte Pflastersteine, Boden- und Wandplatten,
    glasiert, der Tarifnummer 69.08, mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 244/82 af 1. februar 1982 om genindførelse
    af opkrævning af told for glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o. lign., henhørende under pos. 69.08 og
    med oprindelse i Thailand, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 244/82 τής Επιτροπής τής
    1ης Φεβρουαρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά έτερα πλακίδια, κύβους
    καί πλάκες δαπέδου ή επενδύσεως τής κλάσεως
    69. 08 τού Κοινού Δασμολογίου καταγωγής Ταϋλάνδης,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 244/82 della Commissione, del 1° febbraio 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle altre piastrelle,
    blocchetti e lastre da pavimentazione o da rivestimento, della voce 69.08 della
    tariffa doganale comune, originari della Tailandia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 244/82 van de Commissie van 1 februari 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op andere plavuizen
    en andere vloer- en wandtegels van tariefpost 69.08, van oorsprong uit Thailand,
    waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
