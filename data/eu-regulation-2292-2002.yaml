title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2292/2002 of 20 December 2002 determining
    the extent to which applications lodged in December 2002 for import licences for
    certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2292/2002 de la Commission du 20 décembre 2002 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2002 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la République
    de Pologne, la République de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2292/2002 der Kommission vom 20. Dezember 2002 über
    die Festsetzung des Umfangs, in dem die im Dezember 2002 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung
    der Abkommen zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik,
    der Slowakei, Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2292/2002 af 20. december 2002 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i december
    2002 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2292/2002 της Επιτροπής,
    της 20ής Δεκεμβρίου 2002, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν το Δεκέμβριο 2002
    για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2292/2002, annettu 20 päivänä joulukuuta 2002,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tšekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti joulukuussa 2002 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2292/2002 della Commissione, del 20 dicembre 2002,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di dicembre 2002 per taluni prodotti del settore
    delle carni suine nel quadro del regime previsto dagli accordi conclusi tra la
    Comunità e la Repubblica di Polonia, la Repubblica di Ungheria, la Repubblica
    ceca, la Slovacchia, la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2292/2002 van de Commissie van 20 december 2002 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sector varkensvlees, die in december
    2002 worden ingediend op grond van de regeling die is vastgesteld in de door de
    Gemeenschap gesloten overeenkomsten met de Republiek Polen, de Republiek Hongarĳe,
    de Tsjechische Republiek, de Slowaakse Republiek, Bulgarĳe en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2292/2002 da Comissão, de 20 de Dezembro de 2002,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Dezembro
    de 2002 ao abrigo do regime previsto nos acordos concluídos pela Comunidade com
    a República da Polónia, a República da Hungria, a República Checa, a Eslováquia,
    a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2292/2002 de la Comisión, de 20 de diciembre de 2002,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de diciembre de 2002 al amparo del régimen previsto en
    los Acuerdos celebrados entre la Comunidad y Polonia, Hungría, la República
    Checa, Eslovaquia, Bulgaria y Rumania
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2292/2002 av den 20 december 2002 om
    fastställande av i vilken utsträckning ansökningar som lämnats in i december
    2002 om importlicenser för vissa grisköttsprodukter i enlighet med den ordning
    som fastställs i avtalen mellan gemenskapen samt Polen, Ungern, Tjeckien, Slovakien,
    Bulgarien och Rumänien kan godkännas
