title:
- language: en
  script: Latn
  content: '79/929/EEC: Commission Decision of 19 October 1979 authorizing the French
    Republic not to apply Community treatment to men''s and boys''shirts, woven, of
    wool, of cotton or of man-made textile fibres, falling within subheading 61.03
    A of the Common Customs Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating
    in Pakistan and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/929/CEE: Décision de la Commission, du 19 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes tissées, pour hommes et garçonnets, de laine, de coton ou de
    fibres textiles synthétiques ou artificielles de la sous-position 61.03 A du
    tarif douanier commun (codes Nimexe: 61.03-11, 15, 19) (catégorie 8), originaires
    du Pakistan et mises en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/929/EWG: Entscheidung der Kommission vom 19. Oktober 1979, mit der
    Frankreich ermächtigt wird, aus Pakistan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden und Sport- und Arbeitshemden aus Geweben,
    für Männer und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen, der Tarifstelle 61.03 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.03-11, 15, 19) (Kategorie 8) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/929/EØF: Kommissionens beslutning af 19. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede skjorter
    (herunder sports- og arbejdsskjorter) til mænd og drenge, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. 61.03 A i den fælles
    toldtarif (NIMEXE-nummer 61.03-11, 15, 19 ; kategori 8), har oprindelse i Pakistan
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/929/CEE: Decisione della Commissione, del 19 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario camicie e camicette,
    tessute, per uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche
    o artificiali, della sottovoce 61.03 A della tariffa doganale comune (codici Nimexe:
    61.03-11, 15, 19), categoria 8, originarie del Pakistan e messe in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/929/EEG: Beschikking van de Commissie van 19 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd overhemden en sporthemden, geweven van wol,
    van katoen of van synthetische of van kunstmatige textielvezels, van post 61.03
    A van het gemeenschappelijk douanetarief (NIMEXE-code 61.03-11, 15, 19) (categorie
    8), van oorsprong uit Pakistan en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
  type: main
