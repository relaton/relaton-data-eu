  script: Latn
  content: Commission Regulation (EEC) No 1591/76 of 30 June 1976 authorizing Ireland
    and the United Kingdom to align their tariffs with the Common Customs Tariff in
    respect of certain grape juices and musts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1591/76 de la Commission, du 30 juin 1976, autorisant
    l' Irlande et le Royaume-Uni à rapprocher leurs tarifs du tarif douanier commun
    pour certains jus et moûts de raisins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1591/76 der Kommission vom 30. Juni 1976, mit der
    Irland und das Vereinigte Königreich ermächtigt werden, ihre Zollsätze für
    bestimmte Säfte und für Traubenmost dem Gemeinsamen Zolltarif anzunähern
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1591/76 af 30. juni 1976 om bemyndigelse
    af Irland og Det forenede Kongerige til at tilnærme deres tariffer til den fælles
    toldtarif for så vidt angår visse former for saft af druemost
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1591/76 della Commissione, del 30 giugno 1976, che
    autorizza l' Irlanda e il Regno Unito a ravvicinare le rispettive tariffe alla
    tariffa doganale comune per determinati succhi e mosti d' uva
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1591/76 van de Commissie van 30 juni 1976 waarbij
    Ierland en het Verenigd Koninkrijk gemachtigd worden hun tarieven voor bepaalde
    soorten druivesap en druivemost aan het gemeenschappelijk douanetarief aan te
    passen
