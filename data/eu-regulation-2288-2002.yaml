    Δημοκρατίας, Ρωσίας, Ταϊλάνδης και Τουρκίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2288/2002, annettu 19 päivänä joulukuuta 2002,
    tiettyjen Thaimaasta, Tšekin tasavallasta, Turkista ja Venäjältä peräisin
    olevien rauta- tai teräsköysien ja -kaapeleiden tuontia koskevan lopullisen
    polkumyyntitullin käyttöönotosta ja väliaikaisen polkumyyntitullin kantamisesta
    lopullisesti annetun neuvoston asetuksen (EY) N:o 1601/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2288/2002 del Consiglio, del 19 dicembre 2002, che
    modifica il regolamento (CE) n. 1601/2001 che istituisce un dazio antidumping
    definitivo e riscuote definitivamente il dazio antidumping provvisorio istituito
    nei confronti delle importazioni di alcuni tipi di cavi di ferro o di acciaio
    originarie della Repubblica ceca, della Russia, della Tailandia e della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2288/2002 van de Raad van 19 december 2002 tot wĳziging
    van Verordening (EG) nr. 1601/2001 tot instelling van een definitief antidumpingrecht
    en tot definitieve inning van het voorlopige antidumpingrecht op de invoer van
    bepaalde soorten ĳzeren of stalen kabels uit de Republiek Tsjechië, Rusland,
    Thailand en Turkĳe
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2288/2002 do Conselho, de 19 de Dezembro de 2002,
    que altera o Regulamento (CE) n.° 1601/2001 que institui um direito anti-dumping
    definitivo e que cobra a título definitivo o direito anti-dumping provisório
