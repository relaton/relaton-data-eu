title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2288/2002 of 19 December 2002 amending Regulation
    (EC) No 1601/2001 imposing a definitive anti–dumping duty and definitively collecting
    the provisional anti-dumping duty imposed on imports of certain iron or steel
    ropes and cables originating in the Czech Republic, Russia, Thailand and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2288/2002 du Conseil du 19 décembre 2002 modifiant
    le règlement (CE) n° 1601/2001 instituant un droit antidumping définitif et
    portant perception définitive du droit provisoire institué sur les importations
    de certains câbles en fer ou en acier originaires de la République tchèque,
    de Russie, de Thaïlande et de Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2288/2002 des Rates vom 19. Dezember 2002 zur Änderung
    der Verordnung (EG) Nr. 1601/2001 zur Einführung eines endgültigen Antidumpingzolls
    und zur endgültigen Vereinnahmung des vorläufigen Antidumpingzolls auf die Einfuhren
    bestimmter Kabel und Seile aus Eisen oder Stahl mit Ursprung in der Tschechischen
    Republik, Russland, Thailand und der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2288/2002 af 19. december 2002 om ændring
    af forordning (EF) nr. 1601/2001 om indførelse af en endelig antidumpingtold
    på importen af tovværk og kabler af jern og stål med oprindelse i Den Tjekkiske
    Republik, Rusland, Thailand og Tyrkiet
  type: main
- language: el
  script: Grek
