  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 84/2012 della Commissione, del 1 °febbraio
    2012 , che modifica, per quanto attiene alla sostanza fenossimetilpenicillina,
    l’allegato del regolamento (UE) n. 37/2010 concernente le sostanze farmacologicamente
    attive e la loro classificazione per quanto riguarda i limiti massimi di residui
    negli alimenti di origine animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 84/2012 ( 2012. gada 1. februāris
    ), ar ko attiecībā uz vielu fenoksimetilpenicilīnu groza pielikumu Regulai
    (ES) Nr. 37/2010 par farmakoloģiski aktīvajām vielām un to klasifikāciju
    pēc to atlieku maksimāli pieļaujamā satura
  type: main
- language: lt
  script: Latn
  content: 2012 m. vasario 1 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 84/2012,
    kuriuo dėl medžiagos fenoksimetilpenicilino iš dalies keičiamas Reglamento
    (ES) Nr. 37/2010 dėl farmakologiškai aktyvių medžiagų, jų klasifikacijos
    ir didžiausios leidžiamosios koncentracijos gyvūniniuose maisto produktuose
    priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 84/2012 tal-
    1 ta’ Frar 2012 li jemenda l-Anness tar-Regolament (UE) Nru 37/2010 dwar is-sustanzi
    farmakoloġikament attivi u l-klassifikazzjoni tagħhom fir-rigward tal-limiti
    massimi ta’ residwi fl-oġġetti tal-ikel li ġejjin mill-annimali fejn tidħol
    is-sustanza fenossimetilpeniċillina
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 84/2012 van de Commissie van 1 februari
    2012 tot wijziging van de bijlage bij Verordening (EU) nr. 37/2010 betreffende
    farmacologisch werkzame stoffen en de indeling daarvan op basis van maximumwaarden
    voor residuen in levensmiddelen van dierlijke oorsprong, wat de stof fenoxymethylpenicilline
    betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 84/2012 z dnia 1 lutego 2012
    r. zmieniające, w odniesieniu do substancji fenoksymetylopenicylina, załącznik
    do rozporządzenia (UE) nr 37/2010 w sprawie substancji farmakologicznie czynnych
    i ich klasyfikacji w odniesieniu do maksymalnych limitów pozostałości w środkach
    spożywczych pochodzenia zwierzęcego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 84/2012 da Comissão, de 1 de fevereiro
    de 2012 , que altera o anexo do Regulamento (UE) n. ° 37/2010 relativo a substâncias
    farmacologicamente ativas e respetiva classificação no que respeita aos limites
    máximos de resíduos nos alimentos de origem animal, relativamente à substância
    fenoximetilpenicilina
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 84/2012 al Comisiei din 1
    februarie 2012 de modificare a anexei la Regulamentul (UE) nr. 37/2010 privind
    substanțele active din punct de vedere farmacologic și clasificarea lor în
    funcție de limitele reziduale maxime din produsele alimentare de origine animală,
    în ceea ce privește substanța fenoximetilpenicilină
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 84/2012 z 1. februára 2012 ,
    ktorým sa mení a dopĺňa príloha k nariadeniu (EÚ) č. 37/2010 o farmakologicky
    účinných látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí
    v potravinách živočíšneho pôvodu týkajúce sa látky fenoxymetylpenicilín
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 84/2012 z dne 1. februarja 2012 o spremembi
    Priloge k Uredbi (EU) št. 37/2010 o farmakološko aktivnih snoveh in njihovi
    razvrstitvi glede mejnih vrednosti ostankov v živilih živalskega izvora v zvezi
    s snovjo fenoksimetilpenicilin
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 84/2012 de la Comisión, de 1 de febrero
    de 2012 , por el que se modifica en lo que respecta a la sustancia fenoximetilpenicilina
    el anexo del Reglamento (UE) n ° 37/2010 relativo a las sustancias farmacológicamente
    activas y su clasificación por lo que se refiere a los límites máximos de residuos
    en los productos alimenticios de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 84/2012 av den 1 februari
    2012 om ändring av bilagan till förordning (EU) nr 37/2010 om farmakologiskt
    aktiva substanser och deras klassificering med avseende på MRL-värden i animaliska
    livsmedel vad gäller substansen fenoximetylpenicillin
