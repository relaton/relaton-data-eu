title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 84/2012 of 1 February 2012 amending
    the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance phenoxymethylpenicillin
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 84/2012 de la Commission du 1 er février
    2012 modifiant l’annexe du règlement (UE) n ° 37/2010 relatif aux substances
    pharmacologiquement actives et à leur classification en ce qui concerne les limites
    maximales de résidus dans les aliments d’origine animale, concernant la substance
    phénoxyméthylpénicilline
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 84/2012 der Kommission vom 1. Februar
    2012 zur Änderung des Anhangs der Verordnung (EU) Nr. 37/2010 über pharmakologisch
    wirksame Stoffe und ihre Einstufung hinsichtlich der Rückstandshöchstmengen
    in Lebensmitteln tierischen Ursprungs betreffend Phenoxymethylpenicillin
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 84/2012 на Комисията
    от 1 февруари 2012 година за изменение на приложението
    към Регламент (ЕС) № 37/2010 относно фармакологичноактивните
    субстанции и тяхната класификация по отношение
    на максимално допустимите стойности на остатъчните
    количества в храните от животински произход
    във връзка със субстанцията феноксиметилпеницилин
  type: main
- language: cs
  script: Latn
