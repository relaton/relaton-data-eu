    látkách a jejich klasifikaci podle maximálních limitů reziduí v potravinách
    živočišného původu, pokud jde o látku fenoxymethylpenicillin
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 84/2012 af 1. februar
