title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1958/82 of 16 July 1982 imposing a provisional
    anti-dumping duty on imports of photographic enlargers originating in Poland and
    the USSR, accepting an undertaking and terminating the proceeding in respect of
    imports of photographic enlargers originating in Czechoslovakia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1958/82 de la Commission, du 16 juillet 1982, instituant
    un droit anti-"dumping" provisoire sur les importations d' appareils d' agrandissement
    photographiques, originaires de Pologne et d' Union soviétique, acceptant un
    engagement et clôturant la procédure anti-"dumping" concernant les importations
    d' appareils d' agrandissement photographiques originaires de Tchécoslovaquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1958/82 der Kommission vom 16. Juli 1982 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren von photographischen Vergrößerungsapparaten
    mit Ursprung in Polen und der UdSSR und zur Annahme einer Verpflichtung sowie
    zur Einstellung des Verfahrens betreffend die Einfuhren von photographischen Vergrößerungsapparaten
    mit Ursprung in der Tschechoslowakei
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1958/82 af 16. juli 1982 om indførelse
    af en midlertidig antidumpingtold på importen af forstørrelsesapparater til
    fotografisk brug med oprindelse i Polen og Sovjetunionen, godtagelse af tilsagn
    og om afslutning af proceduren vedrørende importen af sådanne forstørrelsesapparater
    med oprindelse i Tjekkoslovakiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1958/82 τής Επιτροπής
    τής 16ης Ιουλίου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές μηχανημάτων
    φωτογραφικών μεγεθύνσεων καταγωγής Πολωνίας
    καί ΕΣΣΔ καί περί αποδοχής δεσμεύσεως, καθώς
    καί περί περατώσεως τής διαδικασίας όσον αφορά
    τίς εισαγωγές μηχανημάτων φωτογραφικών μεγεθύνσεων
    καταγωγής Τσεχοσλοβακίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1958/82 della Commissione, del 16 luglio 1982, che
    istituisce un dazio provvisorio antidumping sulle importazioni di ingranditori
    fotografici, originari della Polonia e dell' URSS, accetta un impegno e chiude
    la procedura relativa alle importazioni di ingranditori fotgrafici originari della
    Cecoslovacchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1958/82 van de Commissie van 16 juli 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van vergrotingstoestellen,
    van oorsprong uit Polen en de USSR, aanvaarding van een verbintenis en beëindiging
    van de procedure ten aanzien van de invoer van vergrotingstoestellen voor de fotografie,
    van oorsprong uit Tsjechoslowakije
  type: main
