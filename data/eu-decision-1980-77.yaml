title:
- language: en
  script: Latn
  content: '80/77/EEC: Commission Decision of 10 December 1979 on the granting by
    the Guidance Section of the EAGGF to the French Republic of a payment on account
    in respect of expenditure incurred during 1978 on annuities relating to measures
    to encourage the cessation of farming and the reallocation of utilized agricultural
    area for the purpose of structural improvement (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/77/CEE: Décision de la Commission, du 10 décembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République française d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les indemnités relatives à l''encouragement
    de la cessation de l''activité agricole et à l''affectation de la superficie
    agricole utilisée à des fins d''amélioration des structures (Le texte en langue
    française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/77/EWG: Entscheidung der Kommission vom 10. Dezember 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit
    und der Verwendung der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    getätigten Ausgaben an die Französische Republik (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/77/EØF: Kommissionens beslutning af 10. december 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den franske Republik af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1978 til godtgørelser vedrørende
    støtte til ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal
    til strukturforbedringsformål (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/77/CEE: Decisione della Commissione, del 10 dicembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, alla Repubblica francese
    di un acconto sulle spese effettuate durante il 1978 per le indennità concernenti
    l''incoraggiamento alla cessazione dell''attività agricola e alla destinazione
    della superficie agricola utilizzata a scopi di miglioramento delle strutture
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/77/EEG: Beschikking van de Commissie van 10 december 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van een
    voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor de uitkeringen
    met betrekking tot de bevordering van de bedrijfsbeëindiging in de landbouw en
    van de aanwending van cultuurgrond tot verbetering van de structuur (Slechts de
    tekst in de Franse taal is authentiek)'
  type: main
