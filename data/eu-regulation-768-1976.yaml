title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 768/76 of 2 April 1976 re-establishing the
    levying of customs duties on broom and brush bodies and handles of wood, falling
    within subheading 44.25 ex B, originating in Brazil to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 768/76 de la Commission, du 2 avril 1976, portant
    rétablissement de la perception des droits de douane applicables aux manches
    de balais et de brosses, en bois, de la sous-position tarifaire EX 44.25 B, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 768/76 der Kommission vom 2. April 1976 zur Wiedereinführung
    des Zollsatzes für Griffe für Besen und Bürsten, aus Holz, der Tarifstelle
    44.25 ex B, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 768/76 af 2. april 1976 om genindførelse
    af opkrævning af toldafgifter for skafter og håndtag af træ, til koste og børster,
    under underposition 44.25 ex B, som har oprindelse i Brasilien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3010/75 af
    17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 768/76 della Commissione, del 2 aprile 1976, che ripristina
    la riscossione dei dazi doganali applicabili ai manichi di spazzole e di scope,
    di legno, della sottovoce doganale 44.25 ex B, originari del Brasile, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 768/76 van de Commissie van 2 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op borstelen
    bezemstelen, van hout, van onderverdeling 44.25 ex B, van oorsprong uit Brazilië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 algemene tariefpreferenties werden geopend
  type: main
