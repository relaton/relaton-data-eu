title:
- language: en
  script: Latn
  content: '75/23/EEC: Third Commission Decision of 13 December 1974 relating to the
    application of the Council Directive of 24 April 1972 on the approximation of
    the laws of the Member States relating to insurance against civil liability in
    respect of the use of motor vehicles and to the enforcement of the obligation
    to insure against such liability'
  type: main
- language: fr
  script: Latn
  content: '75/23/CEE: Troisième décision de la Commission, du 13 décembre 1974,
    relative à l'' application de la directive du Conseil, du 24 avril 1972, concernant
    le rapprochement des législations des États membres relatives à l'' assurance
    de la responsabilité civile résultant de la circulation de véhicules automoteurs
    et au contrôle de l'' obligation d'' assurer cette responsabilité'
  type: main
- language: de
  script: Latn
  content: '75/23/EWG: Dritte Entscheidung der Kommission vom 13. Dezember 1974 zur
    Durchführung der Richtlinie des Rates vom 24. April 1972 betreffend die Angleichung
    der Rechtsvorschriften der Mitgliedstaaten bezüglich der Kraftfahrzeughaftpflichtversicherung
    und der Kontrolle der entsprechenden Versicherungspflicht'
  type: main
- language: da
  script: Latn
  content: '75/23/EØF: Kommissionens tredje Beslutning af 13. december 1974 om gennemførelse
    af Rådets direktiv af 24. april 1972 om indbyrdes tilnærmelse af medlemsstaternes
    lovgivning om ansvarsforsikring for motorkøretøjer og kontrollen med forsikringspligtens
    overholdelse'
  type: main
- language: el
  script: Grek
  content: '75/23/ΕΟΚ: Τρίτη απόφαση τής Επιτροπής τής
    13ης Δεκεμβρίου 1974 περί εφαρμογής τής οδηγίας
    τού Συμβουλίου τής 24ης Απριλίου 1972 «περί προσεγγίσεως
    τών νομοθεσιών τών Κρατών μελών επί τής ασφαλίσεως
    τής αστικής ευθύνης εκ τής κυκλοφορίας τών
    αυτοκινήτων οχημάτων καί τού ελέγχου τής υποχρεώσεως
    ασφαλίσεως τής ευθύνης αυτής»'
  type: main
- language: it
  script: Latn
  content: '75/23/CEE: Terza decisione della Commissione, del 13 dicembre 1974, relativa
    all'' applicazione della direttiva del Consiglio del 24 aprile 1972, concernente
    il ravvicinamento delle legislazioni degli Stati membri in materia di assicurazione
    della responsabilità civile risultante dalla circolazione di autoveicoli e di
    controllo dell'' obbligo di assicurare tale responsabilità'
  type: main
- language: nl
  script: Latn
  content: '75/23/EEG: Derde beschikking van de Commissie van 13 december 1974 tot
    toepassing van de richtlijn van de Raad van 24 april 1972 inzake de onderlinge
    aanpassing van de wetgevingen der Lid-Staten betreffende de verzekering tegen
    de wettelijke aansprakelijkheid waartoe de deelneming aan het verkeer van motorrijtuigen
    aanleiding kan geven en de controle op de verzekering tegen deze aansprakelijkheid'
  type: main
- language: pt
  script: Latn
  content: '75/23/CEE: Terceira Decisão da Comissão, de 13 de Dezembro de 1974,
    relativa à aplicação da Directiva 72/166/CEE do Conselho, de 24 de Abril de
    1972, relativa à aproximação das legislações dos Estados-membros respeitantes
    ao seguro de responsabilidade civil que resulta da circulação de veículos automóveis
    e à fiscalização de cumprimento da obrigação de segurar esta responsabilidade'
  type: main
- language: es
  script: Latn
  content: '75/23/CEE: Tercera Decisión de la Comisión, de 13 de diciembre de 1974,
    relativa a la aplicación de la Directiva del Consejo, de 24 de abril de 1972,
    relativa a la aproximación de las legislaciones de los Estados miembros sobre
    el seguro de la responsabilidad civil que resulta de la circulación de vehículos
    automóviles y sobre el control de la obligación de asegurar dicha responsabilidad'
  type: main
