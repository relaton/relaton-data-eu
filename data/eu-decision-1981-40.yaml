title:
- language: en
  script: Latn
  content: '81/40/EEC: Commission Decision of 19 January 1981 authorizing Ireland
    not to apply Community treatment to woven overcoats, raincoats and other coats,
    cloaks and capes, jackets and blazers originating in India (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/40/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    l''Irlande à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes) et vestes tissés originaires de l''Inde (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/40/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    Irlands, aus Indien stammende Mäntel, Umhänge und Jacken, aus Geweben, von der
    Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/40/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker
    og blazere, vævede med oprindelse i Indien (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/40/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Ιρλανδίας νά αποκλείσει
    από τήν κοινοτική μεταχείριση τά επανωφόρια,
    αδιάβροχα (συμπεριλαμβανομένων τών καπών)
    καί σακκάκια υφασμένα, καταγόμενα από τήν Ινδία
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/40/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli
    e simili, e giacche, tessuti, originari dell''India (Il testo in lingua inglese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/40/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van Ierland om mantels, regenjassen en capes daaronder begrepen, blazers en jasjes,
    geweven, van oorsprong uit India van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
