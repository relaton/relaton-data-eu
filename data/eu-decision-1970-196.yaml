title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 mars 1970, autorisant la République italienne
    à exclure du traitement communautaire les tissus de soie ou de bourre de soie
    (schappe), de la position 50.09 du Tarif douanier commun, originaires de la République
    populaire de Chine et de la Corée du Nord et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '70/196/EWG: Entscheidung der Kommission vom 4. März 1970, mit der die
    Italienische Republik ermächtigt wird, die aus der Volksrepublik China und Nordkorea
    stammenden und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen
    Gewebe aus Seide oder Schappeseide der Position 50.09 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/196/CEE: Decisione della Commissione, del 4 marzo 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario i tessuti di seta
    e di borra di seta (schappe), della voce 50.09 della tariffa doganale comune,
    originari della Repubblica popolare di Cina e della Corea del Nord e messi in
    libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/196/EEG: Beschikking van de Commissie van 4 maart 1970 waarbij de Italiaanse
    Republiek wordt gemachtigd weefsels van zijde of van vlokzijde van post 50.09
    van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China
    en Noord-Korea, en in de overige Lid-Staten in het vrije verkeer gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
