title:
- language: en
  script: Latn
  content: '78/200/EEC: Commission Decision of 20 January 1978 authorizing Member
    States to permit temporarily the marketing of forestry reproductive material not
    complying with requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '78/200/CEE: Décision de la Commission, du 20 janvier 1978, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences de la directive 66/404/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '78/200/EWG: Entscheidung der Kommission vom 20. Januar 1978 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '78/200/EØF: Kommissionens beslutning af 20. januar 1978 om bemyndigelse
    til medlemstaterne til midlertidigt af tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '78/200/ΕΟΚ: Απόφαση της Επιτροπής της 20ής
    Ιανουαρίου 1978 περί εξουσιοδοτήσεως των κρατών
    μελών να αποδέχονται προσωρινά την εμπορία
    δασικού πολλαπλασιαστικού υλικού που δεν ανταποκρίνονται
    στις απαιτήσεις της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '78/200/CEE: Decisione della Commissione, del 20 gennaio 1978, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di riproduzione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '78/200/EEG: Beschikking van de Commissie van 20 januari 1978 houdende
    machtiging van de Lid-Staten om tijdelijk bosbouwkundig teeltmateriaal tot de
    handel toe te laten dat niet aan de eisen van Richtlijn 66/404/EEG voldoet'
  type: main
