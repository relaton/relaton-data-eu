title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 14 juin 1963, portant octroi d'un contingent
    tarifaire au Royaume des Pays-Bas pour les cubes, plaques, feuilles et bandes
    en liège naturel, y compris les cubes ou carrés pour la fabrication des bouchons
  type: main
- language: de
  script: Latn
  content: '63/406/EWG: Entscheidung der Kommission vom 14. Juni 1963 über die Gewährung
    eines Zollkontingents für Würfel, Platten, Blätter und Streifen aus Naturkork
    einschließlich Würfel oder Quader zur Herstellung von Stopfen an das Königreich
    der Niederlande'
  type: main
- language: it
  script: Latn
  content: '63/406/CEE: Decisione della Commissione del 14 giugno 1963, relativa alla
    concessione di un contingente tariffario al Regno dei Paesi Bassi per cubi, lastre,
    fogli e strisce di sughero naturale, compresi i cosiddetti cubi o quadretti per
    la fabbricazione dei turaccioli'
  type: main
- language: nl
  script: Latn
  content: '63/406/EEG: Beschikking van de Commissie van 14 juni 1963 houdende toekenning
    van een tariefcontingent aan het Koninkrijk der Nederlanden voor blokken, platen,
    bladen, vellen en strippen, van natuurkurk, blokjes voor het vervaardigen van
    kurken (stoppen) daaronder begrepen'
  type: main
