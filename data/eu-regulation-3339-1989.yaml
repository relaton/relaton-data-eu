title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3339/89 of 7 November 1989 re-establishing
    of customs duties on knitted or crocheted fabric other than of categories 38 A
    and 63, of wool, cotton or man-made fibres, products of category 65 (order No
    40.0650), originating in Argentina, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3339/89 de la Commission du 7 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux étoffes
    de bonneterie autres que les articles de catégories 38 à et 63, de laine, de
    coton ou de fibres synthétiques ou artificielles, de la catégorie de produits
    n° 65 (numéro d'ordre 40.0650) originaires de l'Argentine, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3339/89 DER KOMMISSION vom 7. November 1989 zur Wiedereinführung
