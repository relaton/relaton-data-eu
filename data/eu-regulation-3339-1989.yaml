    Wolle, Baumwolle oder synthetischen oder künstlichen Spinnfasern der Warenkategorie
    Nr. 65 (lfd. Nr. 40.0650) mit Ursprung in Argentinien, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
