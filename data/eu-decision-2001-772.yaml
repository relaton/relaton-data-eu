  script: Latn
  content: '2001/772/EC: Commission Decision of 19 October 2001 adopting the plan
    allocating to the Member States resources to be charged to the 2002 budget year
    for the supply of food from intervention stocks for the benefit of the most deprived
    persons in the Community (notified under document number C(2001) 2874)'
  type: main
- language: fr
  script: Latn
