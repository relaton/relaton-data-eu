title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 770/80 of 28 March 1980 re-establishing
    the levying of customs duties on methanol (methyl alcohol), falling within subheading
    29.04 A I and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 770/80 de la Commission, du 28 mars 1980, portant
    rétablissement de la perception des droits de douane applicables au méthanol
    (alcool méthylique) de la sous-position 29.04 A I du tarif douanier commun, originaire
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 770/80 der Kommission vom 28. März 1980 zur Wiedereinführung
    des Zollsatzes für Methanol (Methylalkohol) der Tarifstelle 29.04 A I mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 770/80 af 28. marts 1980 om genindførelse
    af opkrævning af toldafgifter for methanol (methylalkohol), under underpos. 29.04
    A I, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 770/80 della Commissione, del 28 marzo 1980, che ripristina
    la riscossione dei dazi doganali applicabili al metanolo (alcole metilico) della
    sottovoce 29.04 A I della tariffa doganale comune, originario dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 770/80 van de Commissie van 28 maart 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor methanol (methylalcohol),
    van post 29.04 A I, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
