    en ce qui concerne le calcul servant à déterminer le respect, par les constructeurs,
    des normes de performance en matière d’émissions de CO2 pour les voitures
    particulières neuves et les véhicules utilitaires légers neufs pour les années
    civiles 2025 à 2027
