  script: Latn
  content: Regulation (EU) 2025/1214 of the European Parliament and of the Council
    of 17 June 2025 amending Regulation (EU) 2019/631 to include an additional flexibility
    as regards the calculation of manufacturers’ compliance with CO2 emission performance
    standards for new passenger cars and new light commercial vehicles for the calendar
    years 2025 to 2027
  type: main
- language: fr
  script: Latn
