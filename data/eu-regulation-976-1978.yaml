title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 976/78 of 12 May 1978 amending Regulation (EEC)
    No 878/77 as regards the exchange rates to be applied in agriculture for various
    currencies and concerning the effects of the fixing of new representative rates
    on existing rights and obligations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 976/78 du Conseil, du 12 mai 1978, modifiant le règlement
    (CEE) n° 878/77 en ce qui concerne le taux de change à appliquer pour différentes
    monnaies dans le secteur agricole et relatif aux incidences de la fixation de
    nouveaux taux sur les droits et obligations existants
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 976/78 des Rates vom 12. Mai 1978 zur Änderung der
    Verordnung (EWG) Nr. 878/77 hinsichtlich der in der Landwirtschaft anzuwendenden
    Umrechnungskurse für verschiedene Währungen und über die Auswirkung der Festsetzung
    neuer repräsentativer Kurse auf die bestehenden Rechte und Pflichten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 976/78 af 12. maj 1978 om ændring af forordning
    (EØF) nr. 878/77 for så vidt angår den vekselkurs, der skal anvendes for forskellige
    valutaer i landbrugssektoren, og om virkningerne af fastsættelsen af nye repræsentative
    kurser på eksisterende rettigheder og forpligtelser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 976/78 του Συμβουλίου
    της 12ης Μαΐου 1978 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 878/77 «περί των τιμών συναλλάγματος
    που πρέπει να εφαρμόζονται για διάφορα νομίσματα
    στον γεωργικό τομέα και περί των επιπτώσεων
    του καθορισμού νέων αντιπροσωπευτικών τιμών
    επί των υφισταμένων δικαιωμάτων και υποχρεώσεων»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 976/78 del Consiglio, del 12 maggio 1978, che modifica
    il regolamento (CEE) n. 878/77 per quanto concerne il tasso di cambio da applicare
    a varie monete nel settore agricolo e relativo alle incidenze della fissazione
    di nuovi tassi rappresentativi sui diritti e sugli obblighi esistenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 976/78 van de Raad van 12 mei 1978 tot wijziging
    van Verordening (EEG) nr. 878/77 ten aanzien van de voor verschillende munteenheden
    in de landbouwsector toe te passen wisselkoersen en van de consequenties van de
    vaststelling van nieuwe representatieve koersen voor bestaande rechten en verplichtingen
  type: main
