title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2352/92 of 7 August 1992 re-establishing
    the levying of customs duties on produts of category 36 (order No 40.0360), originating
    in Bulgaria, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2352/92 de la Commission du 7 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    n° 36 (numéro d'ordre 40.0360) originaires de Bulgarie, bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2352/92 DER KOMMISSION vom 7. August 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie Nr. 36 (laufende Nummer 40.0360) mit
    Ursprung in Bulgarien, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2352/92 af 7. august 1992 om genindførelse
    af opkrævning af told for varer under kategori 36 (løbenummer 40.0360), som
    har oprindelse i Bulgarien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
