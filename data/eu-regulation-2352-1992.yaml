    previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2352/92 VAN DE COMMISSIE van 7 augustus 1992 houdende
