title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1665/78 of 14 July 1978 amending Regulation
    (EEC) No 1687/76 laying down detailed rules for verifying the use and/or destination
    of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1665/78 de la Commission, du 14 juillet 1978, modifiant
    le règlement (CEE) n° 1687/76 établissant les modalités communes de contrôle
    de l' utilisation et/ou de la destination des produits provenant de l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1665/78 der Kommission vom 14. Juli 1978 zur Änderung
    der Verordnung (EWG) Nr. 1687/76 zur Festlegung der gemeinsamen Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1665/78 af 14. juli 1978 om ændring
    af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser for kontrol
    med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1665/78 τής Επιτροπής
    τής 14ης Ιουλίου 1978 περί τροποποιήσεως τού κανονισμού
    (ΕΟΚ) αριθ. 1687/76 «περί καθορισμού τών κοινών
    λεπτομερειών ελέγχου τής χρήσεως ή/καί τού
    προορισμού τών προϊόντων πού προέρχονται από
    τήν παρέμβαση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1665/78 della Commissione, del 14 luglio 1978, recante
    modifica del regolamento (CEE) n. 1687/76 che stabilisce modalità comuni di controllo
    dell' utilizzazione e/o della destinazione di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1665/78 van de Commissie van 14 juli 1978 houdende
    wijziging van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke
    bepalingen inzake de controle op het gebruik en/of de bestemming van produkten
    uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1665/78 da Comissão, de 14 de Julho de 1978, que
    altera o Regulamento (CEE) n.° 1687/76 que estabelece as modalidades comuns de
    controlo da utilização e/ou do destino dos produtos provenientes da intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1665/78 de la Comisión, de 14 de julio de 1978, por
    el que se modifica el Reglamento (CEE) n° 1687/76 por el que se establecen las
    modalidades comunes de control de la utilización y/o el destino de los productos
    procedentes de la intervención
