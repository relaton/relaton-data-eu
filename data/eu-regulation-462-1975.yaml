  script: Latn
  content: Regulation (EEC) No 462/75 of the Council of 27 February 1975 extending
    the system of premiums for the orderly marketing of certain adult bovine animals
    for slaughter and for the retention of cattle
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 462/75 du Conseil, du 27 février 1975, prorogeant
    le régime de prime pour la mise sur le marché ordonnée de certains gros bovins
    de boucherie ainsi que le régime de prime de maintien du cheptel bovin
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 462/75 des Rates vom 27. Februar 1975 zur Verlängerung
    des Prämiensystems für eine geregelte Vermarktung bestimmter ausgewachsener
    Schlachtrinder und des Prämiensystems für die Erhaltung von Rinderbeständen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 462/75 af 27. februar 1975 om forlængelse
    af præmieordningen for reguleret markedsføring af visse former for voksent slagtekvæg
    samt af præmieordningen for bevarelse af kvægbestanden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 462/75 del Consiglio, del 27 febbraio 1975, che proroga
    il regime di premi per un'ordinata immissione in commercio di taluni bovini adulti
    destinati alla macellazione ed il regime di premi per il mantenimento del bestiame
    bovino
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 462/75 van de Raad van 27 februari 1975 houdende
    verlenging van de geldigheidsduur van de premieregeling voor het geordend op de
    markt brengen van bepaalde volwassen slachtrunderen en van de premieregeling voor
    het aanhouden van de rundveestapel
