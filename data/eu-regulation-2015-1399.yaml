    de 2015, por el que se deniega la autorización del preparado de Bacillus toyonensis
    (NCIMB 14858T) (antes Bacillus cereus var. toyoi NCIMB 40112/CNCM I-1012) como
    aditivo de piensos para el vacuno de engorde, conejos de engorde, pollos de engorde,
    lechones (destetados), cerdos de engorde, cerdas para reproducción y terneros
    de cría, se revocan las autorizaciones del preparado de Bacillus cereus var.
    toyoi (NCIMB 40112/CNCM I-1012) como aditivo de piensos para los pavos de engorde
    y las conejas de reproducción, se modifican los Reglamentos (CE) n° 256/2002,
    (CE) n° 1453/2004, (CE) n° 255/2005 y (CE) n° 1200/2005 y se derogan los Reglamentos
    (CE) n° 166/2008, (CE) n° 378/2009 y el Reglamento de Ejecución (UE) n° 288/2013
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/1399 av den 17 augusti
    2015 om att inte godkänna ett preparat av Bacillus toyonensis (NCIMB 14858T)
    (tidigare Bacillus cereus var. toyoi NCIMB 40112/CNCM I-1012) som fodertillsats
    för slaktboskap, slaktkaniner, slaktkycklingar, smågrisar (avvanda), slaktsvin,
    avelssuggor och kalvar för uppfödning, om permanent indragning av godkännandena
    av preparatet av Bacillus cereus var. toyoi (NCIMB 40112/CNCM I-1012) som fodertillsats
    för slaktkalkoner och avelskaniner, om ändring av förordningarna (EG) nr 256/2002,
    (EG) nr 1453/2004, (EG) nr 255/2005 och (EG) nr 1200/2005 och om upphävande av
    förordningarna (EG) nr 166/2008 och (EG) nr 378/2009 samt genomförandeförordning
    (EU) nr 288/2013
  type: main
