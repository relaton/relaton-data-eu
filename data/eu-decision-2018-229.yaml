title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2018/229 of 12 February 2018 establishing, pursuant
    to Directive 2000/60/EC of the European Parliament and of the Council, the values
    of the Member State monitoring system classifications as a result of the intercalibration
    exercise and repealing Commission Decision 2013/480/EU (notified under document
    C(2018) 696)
  type: main
- language: fr
  script: Latn
