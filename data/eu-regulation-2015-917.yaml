title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/917 of 15 June 2015 amending
    Annex I to Regulation (EU) No 206/2010 laying down lists of third countries, territories
    or parts thereof authorised for the introduction into the European Union of certain
    animals and fresh meat and the veterinary certification requirements as regards
    Bangladesh
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/917 de la Commission du 15 juin 2015
    modifiant l'annexe I du règlement (UE) n° 206/2010 établissant des listes des
    pays tiers, territoires ou parties de pays tiers ou territoires en provenance
    desquels l'introduction dans l'Union européenne de certains animaux et viandes
    fraîches est autorisée, et définissant les exigences applicables en matière
    de certification vétérinaire en ce qui concerne le Bangladesh
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/917 der Kommission vom 15. Juni 2015
