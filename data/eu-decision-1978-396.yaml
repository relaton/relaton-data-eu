id: EUDecision1978396
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 11 April 1978 authorizing the French Republic not
    to apply Community treatment to men's and boys' underpants and briefs, women's,
    girls' and infants' knickers and briefs, knitted or crocheted, not elastic or
    rubberized, of cotton or synthetic textile fibres, falling within heading No ex
    60.04 of the Common Customs Tariff, originating in Hong Kong and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/396/CEE: Décision de la Commission, du 11 avril 1978, autorisant la
    République française à exclure du traitement communautaire les slips et caleçons
    pour hommes et garçonnets, slips et culottes pour femmes, fillettes et jeunes
    enfants, de bonneterie non élastique ni caoutchoutée, de coton ou de fibres
    textiles synthétiques, de la position Ex 60.04 du Tarif douanier commun, originaires
    de Hong-Kong et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 11. April 1978, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterhosen und Slips für Männer und Knaben, Schlüpfer
    und dergleichen für Frauen, Mädchen und Kleinkinder, aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle oder aus synthetischen Spinnstoffen der Tarifnummer
    ex 60.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. april 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabshandling at undtage trusser og andre underbenklæder
    til mænd og drenge, trusser og andre underbenklæder, til kvinder, piger og småbørn,
    ikke elastisk eller gummeret, af bomuld eller syntetiske fibre, som henhører
    under pos. ex 60.04 i den fælles toldtarif, har oprindelse i Hongkong og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'11 aprile 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario mutande, mutandine e slip per
    uomo e per ragazzo nonché per donna, per ragazza e per bambini, a maglia non
    elastica né gommata, di cotone o di fibre tessili sintetiche, della voce ex 60.04
    della tariffa doganale comune, originari di Hong Kong e messi in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 11 april 1978 waarbij de Franse Republiek
    wordt gemachtigd slips en onderbroeken voor heren en jongens, slips en broeken
    voor dames, meisjes en kinderen, van niet-elastisch of van niet-gegummeerd breiof
    haakwerk, van katoen of van synthetische textielvezels, van post ex 60.04 van
    het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
