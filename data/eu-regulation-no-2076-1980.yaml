title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2076/80 of 1 August 1980 re-establishing
    the levying of customs duties on screws for wood, falling within subheading 73.32
    ex B and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2076/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois,
    de la sous-position 73.32 ex B du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2076/80 der Kommission vom 1. August 1980 zur Wiedereinführung
    des Zollsatzes für Holzschrauben der Tarifstelle 73.32 ex B mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2076/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for træskruer, under pos. 73.32 ex B, som har
    oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2076/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle viti per legno della
    sottovoce 73.32 ex B della tariffa doganale comune, originarie della Cina, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2076/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op houtschroeven,
    van post 73.32 ex B, van oorsprong uit China, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
