title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 499/87 of 16 February 1987 derogating from
    the definition of 'originating products' to take account of the special situation
    of Saint-Pierre and Miquelon with regard to certain fishery products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 499/87 du Conseil du 16 février 1987 portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière de Saint-Pierre-et-Miquelon en ce qui concerne certains
    produits de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 499/87 des Rates vom 16. Februar 1987 zur Abweichung
    von der Begriffsbestimmung für Ursprungswaren zur Berücksichtigung der besonderen
    Lage von Saint-Pierre-et-Miquelon hinsichtlich bestimmter Fischereierzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 499/87 af 16. februar 1987 om undtagelse
    fra definitionen af "varer med oprindelsesstatus" for at tage hensyn til Saint-Pierre-et-Miquelons
    særlige situation for så vidt angår visse fiskerivarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 499/87 του Συμβουλίου
    της 16ης Φεβρουαρίου 1987 για την αναγνώριση παρέκκλισης
    από τον ορισμό «προϊόντα καταγωγής» προκειμένου
    να ληφθεί υπόψη η ειδική κατάσταση του Saint-Pierre
    και Miquelon σχετικά με ορισμένα προϊόντα αλιείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 499/87 del Consiglio del 16 febbraio 1987 recante
    deroga alla definizione di "prodotti originari" per tener conto della particolare
    situazione di Saint-Pierre-et-Miquelon per quanto concerne taluni prodotti della
    pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 499/87 van de Raad van 16 februari 1987 houdende
    afwijking van de definitie van het begrip ,,produkten van oorsprong" in verband
    met de bijzondere situatie van Saint-Pierre en Miquelon ten aanzien van bepaalde
    visserijprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 499/87 do Conselho de 16 de Fevereiro de 1987 que
    derroga a definição da noção de "produtos originários" para ter em conta
    a situação especial de São Pedro e Miquelon em relação a determinados produtos
    da pesca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 499/87 del Consejo de 16 de febrero de 1987 por el
    que se establece una excepción a la definición de la noción de productos originarios
    para tener en cuenta la situación especial de San Pedro y Miquelón en lo que
    se refiere a determinados productos de la pesca
  type: main
