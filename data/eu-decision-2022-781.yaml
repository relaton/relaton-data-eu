title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/781 of 16 May 2022 on the signing, on behalf
    of the Union, of the Agreement between the European Union and New Zealand pursuant
    to Article XXVIII of the General Agreement on Tariffs and Trade (GATT) 1994 relating
    to the modification of concessions on all the tariff-rate quotas included in the
    EU Schedule CLXXV as a consequence of the United Kingdom’s withdrawal from the
    European Union
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/781 du Conseil du 16 mai 2022 relative à la signature,
    au nom de l’Union, de l’accord entre l’Union européenne et la Nouvelle-Zélande
    conformément à l’article XXVIII de l’accord général sur les tarifs douaniers
    et le commerce (GATT) de 1994 concernant la modification des concessions pour
    l’ensemble des contingents tarifaires de la liste CLXXV de l’UE à la suite
    du retrait du Royaume-Uni de l’Union européenne
  type: main
- language: de
  script: Latn
