    (GATT) XXVIII. cikke alapján létrejött, az EU CLXXV. engedményes listájában
    szereplő valamennyi vámkontingensre vonatkozó engedményeknek az Egyesült
    Királyság Európai Unióból való kilépése következtében szükséges módosításáról
    szóló megállapodásnak az Unió nevében történő aláírásáról
  type: main
- language: it
  script: Latn
