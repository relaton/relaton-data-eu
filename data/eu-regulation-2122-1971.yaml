title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2122/71 de la Commission, du 1er octobre 1971, fixant
    les montants compensatoires valables à partir du 4 octobre 1971 dans le secteur
    agricole à la suite de l'élargissement temporaire des marges de fluctuation
    des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2122/71 der Kommission vom 1. Oktober 1971 zur Festsetzung
    der ab 4. Oktober 1971 geltenden Ausgleichsbeträge in der Landwirtschaft im Anschluß
    an die vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2122/71 della Commissione, del 1 ottobre 1971, che
    fissa gli importi di compensazione validi a partire dal 4 ottobre 1971 nel settore
    agricolo in seguito all'ampliamento temporaneo dei margini di fluttuazione delle
    monete di alcuni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2122/71 van de Commissie van 1 oktober 1971 houdende
    vaststelling van de compenserende bedragen, geldig met ingang van 4 oktober 1971
    in de landbouwsector naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges
    van de valuta's van sommige Lid-Staten
