    für Einfuhr- und Ausfuhrlizenzen für Getreide und Reis hinsichtlich der Gültigkeitsdauer
    der für Lieferungen der gemeinschaftlichen Nahrungsmittelhilfe erteilten Lizenzen
    #'
  type: main
- language: da
  script: Latn
