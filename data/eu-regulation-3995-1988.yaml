  content: Commission Regulation (EEC) No 3995/88 of 21 December 1988 amending Regulation
    (EEC) No 2042/75 on special detailed rules for the application of the system of
    import and export licences for cereals and rice as regards the term of validity
    of licences issued for Community food aid operations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3995/88 de la Commission du 21 décembre 1988 modifiant
