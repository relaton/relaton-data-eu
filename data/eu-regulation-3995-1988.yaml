    du régime des certificats d'importation et d'exportation dans le secteur des
    céréales et du riz en ce qui concerne la durée de validité des certificats
    délivrés pour des opérations d'aide alimentaire communautaires
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3995/88 DER KOMMISSION vom 21. Dezember 1988 zur
