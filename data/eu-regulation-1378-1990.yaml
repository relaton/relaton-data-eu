    die Einfuhr von bestimmten Schweinefleischerzeugnissen eingereichten Lizenzanträgen
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1378/90 af 23. maj 1990 om berigtigelse
