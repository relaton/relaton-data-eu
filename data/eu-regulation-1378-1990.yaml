  content: Commission Regulation (EEC) No 1378/90 of 23 May 1990 correcting Regulation
    (EEC) No 987/90 determining the extent to which applications lodged in April 1990
    for import licences for certain pigmeat products can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1378/90 de la Commission, du 23 mai 1990, rectifiant
