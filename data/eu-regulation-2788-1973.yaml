title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2788/73 of the Commission of 12 October 1973 re-establishing
    Common Customs Tariff duties on yarn of combed sheep' s or lambs' wool (worsted
    yarn), not put up for retail sale falling within CCT heading No 53.07 originating
    in Brazil to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2766/72 of 19 December 1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2788/73 de la Commission, du 12 octobre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de laine peignée, non conditionnés pour la vente au détail, de la
    position tarifaire 53.07, originaires du Brésil bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2766/72 du Conseil du 19 décembre
    1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2788/73 der Kommission vom 12. Oktober 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Kammgarne aus Wolle, nicht in Aufmachungen
    für den Einzelverkauf, der Tarifnummer 53.07, mit Ursprung in Brasilien, dem
    die in der Verordnung (EWG) Nr. 2766/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2788/73 af 12. oktober 1973 om genindførelse
    af told ifølge den fælles toldtarif for garn af kæmmet uld (kamgarn), ikke
    i detailsalgsoplægninger under position 53.07 som har oprindelse i Brasilien
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2766/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2788/73 della Commissione, del 12 ottobre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di lana pettinata, non preparati per la vendita al minuto, della voce doganale
    53.07, originari del Brasile, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2766/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2788/73 van de Commissie van 12 oktober 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kamgaren van wol, niet gereed voor de verkoop in het klein van
    post 53.07, van oorsprong uit Brazilië, ten behoeve waarvan bij Verordening (EEG)
    nr. 2766/72 van de Raad van 19 december 1972 tariefpreferenties werden geopend
  type: main
