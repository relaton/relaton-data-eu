id: EURegulation29961975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2996/75 of the Commission of 17 November 1975 re-establishing
    the levying of the customs duties on articles of asphalt or of similar material
    falling within heading No 68.08, originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2996/75 de la Commission, du 17 novembre 1975, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    en asphalte ou produits similaires, de la position tarifaire 68.08, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2996/75 der Kommission vom 17. November 1975 zur Wiedereinführung
    des Zollsatzes für Waren aus Asphalt oder aus ähnlichen Stoffen (z.B. Erdölpech,
    Kohlenteerpech) der Tarifnummer 68.08 mit Ursprung in Rumänien, dem die in der
    Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2996/75 af 17. november 1975 om genindførelse
    af opkrævning af toldafgifter for varer af asfalt eller af lignende materiale,
    under position 68.08, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2996/75 della Commissione, del 17 novembre 1975, che
    ripristina la riscossione dei dazi doganali applicabili ai lavori di asfalto o
    di prodotti simili della voce doganale n. 68.08, originari della Romania beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2996/75 van de Commissie van 17 november 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op werken van
    asfalt of van dergelijke produkten (petroleumbitumen, koolteerpek, enz.), van
    post 68.08, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG)
    nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden
    geopend
  type: main
