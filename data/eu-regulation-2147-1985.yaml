title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2147/85 of 30 July 1985 fixing for the 1985/86
    marketing year the minimum price to be paid to producers for unprocessed dried
    grapes and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2147/85 de la Commission du 30 juillet 1985 fixant,
    pour la campagne 1985/1986, le prix minimal à payer aux producteurs pour les
    raisins secs non transformés ainsi que le montant de l' aide à la production
    pour les raisins secs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2147/85 der Kommission vom 30. Juli 1985 zur Festsetzung
    des den Erzeugern für unverarbeitete getrocknete Weintrauben zu zahlenden Mindestpreises
    und der Produktionsbeihilfe für getrockenete Weintrauben für das Wirtschaftsjahr
    1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2147/85 af 30. juli 1985 om fastsættelse
    for produktionsåret 1985/86 af den minimumspris, der skal betales til producenterne
    for uforarbejdede tørrede druer og af producentstøtten for tørrede druer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2147/85 της Επιτροπής
    της 30ής Ιουλίου 1985 για τον καθορισμό της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    μη μεταποιημένες σταφίδες και του ποσού της
    ενίσχυσης στην παραγωγή σταφίδας για την περίοδο
    εμπορίας 1985/86
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2147/85 della Commissione del 30 luglio 1985 che fissa,
    per la campagna di commercializzazione 1985/1986, il prezzo minimo da pagare ai
    produttori per le uve secche non trasformate e l' importo dell' aiuto alla produzione
    per le uve secche
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2147/85 van de Commissie van 30 juli 1985 tot vaststelling,
    voor het verkoopseizoen 1985/1986, van de aan de telers te betalen minimumprijs
    voor rozijnen en krenten (basisprodukt) alsmede van het bedrag van de produktiesteun
    voor rozijnen en krenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2147/85 da Comissão, de 30 de Julho de 1985, que
    fixa, para a campanha de 1985/1986, o preço mínimo a pagar aos produtores em
    relação às uvas secas não transformadas bem como o montante da ajuda à produção
    em relação a certas uvas secas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2147/85 de la Comisión, de 30 de julio de 1985, por
    el que se fijan, para la campaña 1985/86, el precio mínimo que se deberá pagar
    a los productores por las pasas no transformadas y el importe de la ayuda a la
    producción para las pasas
  type: main
