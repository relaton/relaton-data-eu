id: EURegulation13711972
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (Euratom) No 1371/72 of the Council of 27 June 1972 determining
    the rates and conditions of the special allowances which may be granted to officials
    or servants who are paid from appropriations in the research and investment budget
    and employed in an establishment of the Joint Research Centre or on indirect action
    for certain services of a special nature
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom) n° 1371/72 du Conseil, du 27 juin 1972, déterminant
    les conditions d' attribution et les taux des indemnités qui peuvent être accordées
    à des fonctionnaires ou agents rémunérés sur les crédits de recherches et
    d' investissement et affectés à un établissement du Centre commun de recherches
    ou aux actions indirectes pour certaines prestations de service présentant un
    caractère particulier
  type: main
- language: de
  script: Latn
  content: Verordnung (Euratom) Nr. 1371/72 des Rates vom 27. Juni 1972 zur Festlegung
    der Bedingungen für die Gewährung und der Sätze der Vergütungen, die Beamten
    und Bediensteten, die ihre Bezüge aus Mitteln des Forschungs- und Investitionshaushaltsplans
    erhalten und in einer Anstalt der Gemeinsamen Forschungsstelle oder im Rahmen
    indirekter Aktionen dienstlich verwendet werden, für bestimmte Dienstleistungen
    besonderer Art gewährt werden können
  type: main
- language: da
  script: Latn
  content: Rådets forordning (Euratom) nr. 1371/72 af 27. juni 1972 om fastlæggelse
    af betingelserne for ydelse af tillæg samt satserne herfor, til tjenestemænd
    og øvrige ansatte, hvis vederlag afholdes over forsknings- og investeringsbudgetter,
    og som gør tjeneste ved et anlæg under Det fælles Forskningscenter, eller som
    udøver virksomhed i tilknytning hertil for visse tjenesteydelser af særlig art
  type: main
- language: it
  script: Latn
  content: Regolamento (Euratom) n. 1371/72 del Consiglio, del 27 giugno 1972, che
    determina le condizioni di attribuzione e l' ammontare delle indennità che possono
    essere concesse a funzionari o agenti, retribuiti in base agli stanziamenti per
    la ricerca e gli investimenti, che prestano servizio presso uno stabilimento del
    Centro comune di ricerche o svolgono azioni indirette per talune prestazioni di
    servizio di carattere particolare
  type: main
- language: nl
  script: Latn
  content: Verordening (Euratom) nr. 1371/72 van de Raad van 27 juni 1972 tot vaststelling
    van de voorwaarden voor de toekenning en van de hoogte van de toeslagen die voor
    bepaalde dienstverrichtingen met een bijzonder karakter kunnen worden toegekend
    aan ambtenaren en andere personeelsleden wier bezoldiging ten laste komt van de
    onderzoek- en investeringskredieten en die verbonden zijn aan een inrichting van
    het Gemeenschappelijk Centrum voor Onderzoek of bij indirecte acties zijn betrokken
  type: main
