    pour les résidus de pesticides sur ou dans certains produits d'origine végétale,
    y compris les fruits et légumes, et prévoyant l'établissement d'une liste de
    teneurs maximales
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/38/EG des Rates vom 17. Juli 1995 zur Änderung der Anhänge
    I und II der Richtlinie 90/642/EWG über die Festsetzung von Höchstgehalten an
    Rückständen von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse, sowie zur Erstellung
    einer Liste von Höchstgehalten
  type: main
