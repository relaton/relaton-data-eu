  script: Latn
  content: Directiva 95/38/CE a Consiliului din 17 iulie 1995 de modificare a anexelor
    I și II la Directiva 90/642/CEE de stabilire a conținuturilor maxime de reziduuri
    de pesticide din și de pe anumite produse de origine vegetală, inclusiv fructe
    și legume, precum și de stabilire a unei liste de conținuturi maxime
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 95/38/ES zo 17. júla 1995, ktorou sa menia a dopĺňajú
