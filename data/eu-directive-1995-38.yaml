    poziomów pozostałości pestycydów w niektórych produktach pochodzenia roślinnego,
    w tym owocach i warzywach, oraz na ich powierzchni oraz przewidująca ustalenie
    wykazu najwyższych dopuszczalnych poziomów
  type: main
