  script: Latn
  content: Council Directive 95/38/EC of 17 July 1995 amending Annexes I and II to
    Directive 90/642/EEC on the fixing of maximum levels for pesticide residues in
    and on certain products of plant origin, including fruit and vegetables, and providing
    for the establishment of a list of maximum levels
  type: main
- language: fr
  script: Latn
