title:
- language: en
  script: Latn
  content: '80/514/EEC: Commission Decision of 5 May 1980 authorizing Ireland not
    to apply Community treatment to tents, falling within subheadings ex 62.04 A II
    and B II of the Common Customs Tariff (category 91), originating in South Korea
    and in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/514/CEE: Décision de la Commission, du 5 mai 1980, autorisant l''Irlande
    à exclure du traitement communautaire les tentes, de la sous-position ex 62.04
    A II et B II du tarif douanier commun (catégorie 91), originaires de la Corée
    du Sud et mises en libre pratique dans les autres Etats membres (Le texte en langue
    anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/514/EWG: Entscheidung der Kommission vom 5. Mai 1980, mit der Irland
    ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Zelte der Tarifstellen ex 62.04 A II und B II des
    Gemeinsamen Zolltarifs (Kategorie 91) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/514/EØF: Kommissionens beslutning af 5. maj 1980 om bemyndigelse af
    Irland til fra fælleskabsbehandling at undtage telte, som henhører under pos.
    ex 62.04 A II og B II i den fælles toldtarif (kategori 91), har oprindelse i
    Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/514/CEE: Decisione della Commissione, del 5 maggio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le tende delle sottovoci ex
    62.04 A II e B II della tariffa doganale comune, categoria 91, originarie della
    Corea del Sud e messe in libera pratica negli altri Stati membri (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/514/EEG: Beschikking van de Commissie van 5 mei 1980 waarbij Ierland
    wordt gemachtigd tenten van post ex 62.04 A II en B II van het gemeenschappelijk
    douanetarief (categorie 91), van oorsprong uit Zuid- Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
