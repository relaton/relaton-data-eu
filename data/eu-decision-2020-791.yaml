    a 13-a sesiuni a Comisiei de experți tehnici a Organizației Interguvernamentale
    pentru Transporturile Internaționale Feroviare privind adoptarea de modificări
    ale specificațiilor tehnice uniforme privind vagoanele de marfă, marcarea vehiculelor
    și zgomotul produs de materialul rulant, precum și privind adoptarea unei revizuiri
    integrale a normelor de certificare și de auditare a entităților responsabile
    cu întreținerea și a specificațiilor privind registrele naționale ale vehiculelor
  type: main
- language: sk
