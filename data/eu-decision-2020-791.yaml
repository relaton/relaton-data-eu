    Technicznych Międzyrządowej Organizacji Międzynarodowych Przewozów Kolejami
    w odniesieniu do przyjęcia zmian ujednoliconych przepisów technicznych dotyczących
    wagonów towarowych, oznaczeń na pojazdach oraz hałasu wywoływanego przez tabor
    kolejowy, a także w odniesieniu do przyjęcia całościowego przeglądu zasad
