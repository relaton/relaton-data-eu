    Tekniċi Uniformi li jikkonċernaw il-vaguni tal-merkanzija, l-immarkar tal-vetturi
    u l-istorbju tal-materjal fuq ir-roti, u fir-rigward tal-adozzjoni ta’ rieżami
    bis-sħiħ tar-regoli għaċ-ċertifikazzjoni u l-awditjar tal-entitajiet responsabbli
    mill-manutenzjoni u l-ispeċifikazzjonijiet li jikkonċernaw ir-reġistri nazzjonali
    tal-vetturi
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2020/791 van de Raad van 10 juni 2020 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen op de 13e bijeenkomst van de
    commissie van technisch deskundigen van de Intergouvernementele Organisatie voor
    het internationale spoorwegvervoer in verband met de vaststelling van wijzigingen
    van de uniforme technische voorschriften voor goederenwagens, voertuigmarkeringen
    en rollendmaterieelgeluid, en een volledige herziening van de regels voor de certificering
    en inspectie van met onderhoud belaste entiteiten en van de specificaties voor
    nationale voertuigregisters
  type: main
