    otázky Medzivládnej organizácie pre medzinárodnú železničnú prepravu,
    pokiaľ ide o prijatie zmien jednotných technických predpisov o nákladných
    vozňoch, o označovaní vozidiel a o hluku železničných vozidiel, a o prijatie
    úplnej revízie pravidiel certifikácie a auditu subjektov zodpovedných za údržbu
    a špecifikácií týkajúcich sa národných registrov vozidiel
  type: main
