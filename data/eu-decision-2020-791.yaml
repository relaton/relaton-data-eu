title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/791 of 10 June 2020 on the position to be taken
    on behalf of the European Union at the 13th session of the Committee of Technical
    Experts of the Intergovernmental Organisation for International Carriage by Rail
    regarding the adoption of amendments to the Uniform Technical Prescriptions concerning
    freight wagons, vehicle marking and rolling stock noise, and regarding the adoption
    of a full revision of the rules for the certification and auditing of entities
    in charge of maintenance and of the specifications concerning national vehicle
    registers
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/791 du Conseil du 10 juin 2020 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 13e session de la Commission
    d’experts techniques de l’Organisation intergouvernementale pour les transports
    internationaux ferroviaires en ce qui concerne l’adoption de modifications des
    prescriptions techniques uniformes relatives aux wagons de marchandises, au marquage
    des véhicules et au bruit du matériel roulant, ainsi que l’adoption d’une
    révision complète des règles de certification et d’audit des entités chargées
    de l’entretien et des spécifications relatives aux registres nationaux des
    véhicules
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2020/791 des Rates vom 10. Juni 2020 über den im Namen
    der Europäischen Union auf der 13. Tagung des Fachausschusses für technische
    Fragen der Zwischenstaatlichen Organisation für den internationalen Eisenbahnverkehr
    im Hinblick auf die Annahme von Änderungen der einheitlichen technischen Vorschriften
    über Güterwagen, über die Kennzeichnung von Eisenbahnfahrzeugen und über die
    Geräuschemissionen von Fahrzeugen sowie die Annahme einer vollständigen Überarbeitung
    der Rechtsvorschriften für die Zertifizierung und Prüfung der für die Instandhaltung
    zuständigen Stellen sowie der nationalen Spezifikationen zu den Fahrzeugregistern
    zu vertretenden Standpunkt
  type: main
