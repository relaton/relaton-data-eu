  script: Latn
  content: Sklep Sveta (EU) 2020/791 z dne 10. junija 2020 o stališču, ki se v imenu
    Evropske unije zastopa na 13. zasedanju Odbora strokovnjakov za tehnična vprašanja
    Medvladne organizacije za mednarodni železniški promet glede sprejetja sprememb
    enotnih tehničnih predpisov za tovorne vagone, označevanje vozil in za hrup
    tirnih vozil ter glede sprejetja popolne revizije pravil za podeljevanje spričeval
    subjektom, zadolženim za vzdrževanje, in revizijo navedenih subjektov ter popolne
    revizije specifikacij za registre vozil
  type: main
