  script: Latn
  content: Decisión (UE) 2020/791 del Consejo de 10 de junio de 2020 relativa a la
    posición que debe adoptarse, en nombre de la Unión Europea, en la 13.a sesión
    de la Comisión de Expertos Técnicos de la Organización Intergubernamental para
    los Transportes Internacionales por Ferrocarril por lo que respecta a la adopción
    de enmiendas de las prescripciones técnicas uniformes sobre vagones de mercancías,
    marcado de vehículos y ruido del material rodante, y a la adopción de una revisión
    completa de las normas para la certificación y la auditoría de las entidades
    encargadas del mantenimiento y de las especificaciones relativas a los registros
    nacionales de vehículos
  type: main
