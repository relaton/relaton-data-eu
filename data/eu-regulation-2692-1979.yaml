title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2692/79 of 29 November 1979 re-establishing
    the levying of customs duties on terry towelling and similar terry fabrics of
    cotton, falling within heading No 55.08 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2692/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position 55.08 du tarif douanier commun,
    originaires des pays en voie de développement, bénéficiaires de préférences
    tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2692/79 DER KOMMISSION VOM 29. NOVEMBER 1979 ZUR
    WIEDEREINFUEHRUNG DES ZOLLSATZES FUER SCHLINGENGEWEBE ( FROTTIERGEWEBE ) AUS BAUMWOLLE
    DER TARIFNUMMER 55.08 MIT URSPRUNG IN ENTWICKLUNGSLAENDERN, DENEN DIE IN DER VERORDNUNG
    ( EWG ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2692/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld under position 55.08, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2692/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI TESSUTI DI COTONE
    RICCI DEL TIPO SPUGNA DELLA VOCE DOGANALE 55.08, ORIGINARI DEI PAESI IN VIA DI
    SVILUPPO BENEFICIARI DELLE PREFERENZE TARIFFARIE PREVISTE DAL REGOLAMENTO 1195/79
    DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2692/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bad- of
    frotteerstof ( lussendoek ) van katoen van post 55.08, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening ( EEG ) nr. 1195/79 van de Raad tariefpreferenties
    werden geopend
