    του κανονισμού (ΕΟΚ) αριθ. 1124/77 περί νέας οριοθετήσεως
    των ζωνών προορισμού για τις επιστροφές ή τις
    εισφορές κατά την εξαγωγή και ορισμένα πιστοποιητικά
    εξαγωγής στον τομέα των σιτηρών και της ορύζης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 501/85 della Commissione del 27 febbraio 1985 che
    modifica il regolamento (CEE) n. 1124/77 recante nuova delimitazione delle zone
    di destinazione per le restituzioni o i prelievi all' esportazione e per determinati
    titoli d' esportazione nei settori dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 501/85 van de Commissie van 27 februari 1985 tot
    wijziging van Verordening (EEG) nr. 1124/77 houdende een nieuwe afbakening van
    de zones van bestemming voor de restituties of de heffingen bij uitvoer en voor
    bepaalde uitvoercertificaten in de sectoren granen en rijst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 501/85 da Comissão, de 27 de Fevereiro de 1985,
    que altera o Regulamento (CEE) n.° 1124/77 que estabelece a delimitação das
    zonas de destino para as restituições ou os direitos niveladores à exportação
    e para certos certificados de exportação nos sectores dos cereais e do arroz
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 501/85 de la Comisión, de 27 de febrero de 1985,
    por el que se modifica el Reglamento (CEE) n° 1124/77 por el que se delimitan
    las zonas de destino para las restituciones o las exacciones reguladoras a la
    exportación y para determinados certificados de exportación en los sectores
    de los cereales y del arroz
