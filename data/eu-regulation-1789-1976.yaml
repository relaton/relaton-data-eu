  content: Commission Regulation (EEC) No 1789/76 of 23 July 1976 amending Regulations
    (EEC) No 1896/73 and (EEC) No 582/76 as regards beef which may be bought into
    intervention in Germany, and coefficients in the beef sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1789/76 de la Commission, du 23 juillet 1976, modifiant
    les règlements (CEE) n° 1896/73 et n° 582/76 en ce qui concerne les produits
    pouvant faire l'objet d'achats à l'intervention en République fédérale d'Allemagne,
    ainsi que leurs coefficients dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1789/76 der Kommission vom 23. Juli 1976 zur Änderung
    der Verordnungen (EWG) Nr. 1896/73 und Nr. 582/76 hinsichtlich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen in Deutschland
    sein können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1789/76 af 23. juli 1976 om ændring
