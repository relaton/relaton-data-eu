    der gemäß Artikel 11 Absätze 5 und 6 der Verordnung Nr. 136/66/EWG vom Betrag
    der Verbrauchsbeihilfe einzuhaltenden Prozentsätze für das Wirtschaftsjahr 1985/86
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2990/85 af 22. oktober 1985 om fastsættelse
