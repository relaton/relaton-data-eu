  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1920/87 del Consiglio del 2 luglio 1987 che prevede
    la concessione di un aiuto speciale per i semi di girasole prodotti e trasformati
    in Portogallo e che modifica il regolamento (CEE) n. 476/86 che fissa le regole
    generali del regime di controllo dei prezzi e delle quantità di taluni prodotti
    del settore delle materie grasse immessi in consumo in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1920/87 van de Raad van 2 juli 1987 houdende toekenning
    van bijzondere steun voor zonnebloemzaad geproduceerd en verwerkt in Portugal
    en tot wijziging van Verordening (EEG) nr. 476/86 tot vaststelling van de algemene
    voorschriften voor de controleregeling met betrekking tot de prijzen en de in
    Portugal in consumptie gebrachte hoeveelheden van bepaalde produkten van de sector
    oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1920/87 do Conselho de 2 de Julho de 1987 que prevê
    a concessão de uma ajuda especial para as sementes de girassol produzidas e transformadas
    em Portugal e que altera o Regulamento (CEE) n.° 476/86 que determina as regras
    gerais do regime de controlo dos preços e das quantidades introduzidas no consumo
    em Portugal de determinados produtos do sector das matérias gordas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1920/87 del Consejo de 2 de julio de 1987 por el que
    se prevé la concesión de una ayuda especial para las semillas de girasol producidas
    y transformadas en Portugal y que modifica el Reglamento (CEE) n° 476/86 por
    el que se determinan las reglas generales del régimen de control de los precios
    y de las cantidades despachadas al consumo en Portugal de determinados productos
    del sector de las materias grasas
