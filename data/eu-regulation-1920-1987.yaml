title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1920/87 of 2 July 1987 providing for the granting
    of special aid for sunflower seeds produced and processed in Portugal and amending
    Regulation (EEC) No 476/86 laying down general rules for the mechanism for controlling
    the prices and the quantities of certain products in the oils and fats sector
    released for consumption in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1920/87 du Conseil du 2 juillet 1987 prévoyant l'
    octroi d' une aide spéciale pour les graines de tournesol produites et transformées
    au Portugal et modifiant le règlement (CEE) n° 476/86 déterminant les règles
    générales du régime de contrôle des prix et des quantités mises à la consommation
    au Portugal de certains produits du secteur des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1920/87 des Rates vom 2. Juli 1987 über eine Sonderprämie
    für in Portugal erzeugte und verarbeitete Sonnenblumenkerne und zur Änderung
    der Verordnung (EWG) Nr. 476/86 zur Festlegung der allgemeinen Regeln für das
    System der Kontrolle der Preise und der in Portugal zum freien Verkehr abgefertigten
    Mengen bei bestimmten Erzeugnissen des Fettsektors
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1920/87 af 2. juli 1987 om ydelse af en særlig
    støtte til solsikkefrø, der er produceret og forarbejdet i Portugal, og om ændring
    af forordning (EØF) nr. 476/86 om fastsættelse af almindelige regler for kontrolordningen
    vedrørende de mængder af visse produkter inden for fedtstofsektoren, der overgår
    til frit forbrug i Portugal, og priserne på disse
  type: main
