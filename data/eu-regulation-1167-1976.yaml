title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1167/76 of 17 May 1976 amending Annex IV to
    Regulation (EEC) No 816/70 laying down additional provisions for the common organization
    of the market in wine and the Common Customs Tariff as regards the exchange rates
    applicable to customs duties on certain wines
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1167/76 du Conseil, du 17 mai 1976, modifiant l' annexe
    IV du règlement (CEE) n° 816/70 portant dispositions complémentaires en matière
    d' organisation commune du marché viti-vinicole, et le tarif douanier commun
    en ce qui concerne le taux de change applicable aux droits de douane sur certains
    vins
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1167/76 des Rates vom 17. Mai 1976 zur Änderung des
    Anhangs IV der Verordnung (EWG) Nr. 816/70 zur Festlegung ergänzender Vorschriften
    für die gemeinsame Marktorganisation für Wein und zur Änderung des Gemeinsamen
    Zolltarifs hinsichtlich der bei den Weinzöllen anzuwendenden Wechselkurse
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1167/76 af 17. maj 1976 om ændring af bilag
    IV til forordning (EØF) nr. 816/70 om supplerende regler for den fælles markedsordning
    for vin, og af den fælles toldtarif for så vidt angår den vekselkurs, der skal
    anvendes for told på visse typer vin
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1167/76 del Consiglio, del 17 maggio 1976, che modifica
    l' allegato IV del regolamento (CEE) n. 816/70 che prevede disposizioni complementari
    in materia di organizzazione comune del mercato vitivinicolo e la tariffa doganale
    comune per quanto concerne il tasso di cambio applicabile ai dazi doganali su
    taluni vini
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1167/76 van de Raad van 17 mei 1976 tot wijziging
    van bijlage IV van Verordening (EEG) nr. 816/70 houdende aanvullende bepalingen
    inzake de gemeenschappelijke ordening van de wijnmarkt, en van het gemeenschappelijk
    douanetarief, ten aanzien van de voor de douanerechten op bepaalde wijnen toe
    te passen wisselkoers
  type: main
