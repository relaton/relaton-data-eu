    le decisioni 93/52/CEE, 2001/618/CE e 2003/467/CE in ordine alla qualifica dei
    paesi aderenti per quanto riguarda la brucellosi (B. melitensis), la malattia
    di Aujeszky, la leucosi bovina enzootica, la brucellosi e la tubercolosi dei bovini,
    nonché alla qualifica della Francia per quanto riguarda la malattia di Aujeszky
    (Testo rilevante ai fini del SEE) [notificata con il numero C(2004) 1094]'
  type: main
