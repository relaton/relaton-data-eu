    ohledně brucelózy (B. melitensis), Aujeszkyho choroby, enzootické leukózy
    skotu, brucelózy skotu a tuberkulózy skotu a o status Francie ohledně Aujeszkyho
    choroby (oznámeno pod číslem K(2004) 1094)
  type: main
- language: da
