    landes status med hensyn til brucellose (B. melitensis), Aujeszkys sygdom, enzootisk
    kvægleukose, kvægbrucellose og tuberkulose samt Frankrigs status med hensyn
    til Aujeszkys sygdom (EØS-relevant tekst) (meddelt under nummer K(2004) 1094)'
  type: main
- language: el
