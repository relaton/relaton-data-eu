    enzootikus leukózisa, a szarvasmarhák brucellózisa, és a gümőkór vonatkozásában
    és Franciaország státusa tekintetében az Aujeszky-féle betegség vonatkozásában
    történő módosításáról (az értesítés a C(2004) 1094. számú dokumentummal
    történt)
  type: main
