title:
- language: en
  script: Latn
  content: '2004/320/EC: Commission Decision of 31 March 2004 amending Decisions 93/52/EEC,
    2001/618/EC and 2003/467/EC as regards the status of acceding countries with regard
    to brucellosis (B. melitensis), Aujeszky''s disease, enzootic bovine leukosis,
    bovine brucellosis and tuberculosis and of France with regard to Aujeszky''s disease
    (Text with EEA relevance) (notified under document number C(2004) 1094)'
  type: main
- language: fr
  script: Latn
  content: '2004/320/CE: Décision de la Commission du 31 mars 2004 modifiant les
    décisions 93/52/CEE, 2001/618/CE et 2003/467/CE, en ce qui concerne le statut
    des pays adhérents au regard de la brucellose (Br. melitensis), de la maladie
    d''Aujeszky, de la leucose bovine enzootique, de la brucellose bovine et de la
    tuberculose bovine et celui de la France au regard de la maladie d''Aujeszky (Texte
    présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2004) 1094]'
  type: main
- language: de
  script: Latn
  content: '2004/320/EG: Entscheidung der Kommission vom 31. März 2004 zur Änderung
    der Entscheidungen 93/52/EWG, 2001/618/EG und 2003/467/EG hinsichtlich des Status
    der Beitrittsländer in Bezug auf die Tierseuchen Brucellose (B. melitensis),
    Aujeszky-Krankheit, Rinderleukose, Rinderbrucellose und Tuberkulose sowie hinsichtlich
    des Status von Frankreich in Bezug auf die Aujeszky-Krankheit (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2004) 1094)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 31. března 2004, kterým se mění rozhodnutí
