id: EUDecision1985318
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '85/318/EEC: Commission Decision of 11 June 1985 concerning the zones referred
    to in Article 2 (3) of Regulation (EEC) No 2616/80 instituting a specific Community
    regional development measure contributing to overcoming constraints on the development
    of new economic activities in certain zones adversely affected by restructuring
    of the steel industry (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/318/CEE: Décision de la Commission du 11 juin 1985 relative aux zones
    visées à l''article 2 paragraphe 3 du règlement (CEE) n° 2616/80 instituant
    une action communautaire spécifique de développement régional contribuant à
    l''élimination des obstacles au développement de nouvelles activités économiques
    dans certaines zones affectées par la restructuration de l''industrie sidérugique
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/318/EWG: Entscheidung der Kommission vom 11. Juni 1985 bezüglich der
    Gebiete gemäß Artikel 2 Absatz 3 der Verordnung (EWG) Nr. 2616/80 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige in
    bestimmten von der Umstrukturierung der Eisen- und Stahlindustrie betroffenen
    Gebieten (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/318/EØF: Kommissionens beslutning af 11. juni 1985 om de områder,
    der er omhandlet i artikel 2, stk. 3, i forordning (EØF) nr. 2616/80 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i jern- og stålindustrien (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/318/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Ιουνίου 1985 για τις ζώνες οι οποίες αναφέρονται
    στο άρθρο 2 παράγραφος 3 του κανονισμού (ΕΟΚ)
    αριθ. 2616/80 περί ανάληψης ειδικής κοινοτικής
    ενέργειας περιφερειακής ανάπτυξης για τη συμβολή
    στην εξάλειψη των εμποδίων στην ανάπτυξη νέων
    οικονομικών δραστηριοτήτων σε ορισμένες ζώνες
    που θίγονται από την αναδιάρθρωση της βιομηχανίας
    σιδήρου και χάλυβα (Το κείμενο στη γαλλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/318/CEE: Decisione della Commissione dell''11 giugno 1985 relativa
    alle zone di cui all''articolo 2, paragrafo 3, del regolamento (CEE) n. 2616/80
    che istituisce un''azione comunitaria specifica di sviluppo regionale per contribuire
    ad eliminare gli ostacoli allo sviluppo di nuove attività economiche in talune
    zone colpite dalla ristrutturazione dell''industria siderurgica (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/318/EEG: Beschikking van de Commissie van 11 juni 1985 betreffende
    de gebieden als bedoeld in artikel 2, lid 3, van Verordening (EEG) nr. 2616/80
    tot instelling van een specifieke communautaire actie voor regionale ontwikkeling
    om bij te dragen tot de uitschakeling van de hinderpalen voor de ontwikkeling
    van nieuwe economische activiteiten in sommige door de herstructurering van de
    ijzer- en staalindustrie getroffen zones (Slechts de tekst in de Franse taal is
    authentiek)'
  type: main
- language: es
  script: Latn
  content: '85/318/CEE: Decisión de la Comisión de 11 de junio de 1985 relativa
    a las zonas contempladas en el apartado 3 del artículo 2 del Reglamento (CEE)
    nº 2616/80 por el que se establece una acción comunitaria específica de desarrollo
    regional que contribuya a la eliminación de los obstáculos al desarrollo de
    nuevas actividades económicas en determinadas zonas afectadas por la reestructuración
    de la industria siderúrgica (El texto en lengua francesa es el único auténtico)'
