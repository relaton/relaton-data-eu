    presentate nel mese di febbraio 1997 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in un paese terzo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 281/97 VAN DE COMMISSIE van 17 februari 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in februari 1997 ingediende
    aanvragen om uitvoercertificaten voor producten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 281/97 DA COMISSÃO de 17 de Fevereiro de 1997 que
