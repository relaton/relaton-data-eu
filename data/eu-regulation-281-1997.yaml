title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 281/97 of 17 February 1997 laying down to
    what extent applications for issue of export licences submitted during February
    1997 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 281/97 DE LA COMMISSION du 17 février 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de février 1997 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 281/97 DER KOMMISSION vom 17. Februar 1997 über das
    Ausmaß, in dem den im Februar 1997 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 281/97 af 17. februar 1997 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i februar
    1997 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 281/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Φεβρουαρίου 1997 για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν το Φεβρουάριο 1997 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 281/97, annettu 17 päivänä helmikuuta 1997,
