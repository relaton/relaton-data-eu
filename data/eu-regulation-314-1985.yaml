title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 314/85 of 6 February 1985 introducing a
    countervailing charge on mandarins (including tangerines and satsumas), wilkings
    and other similar citrus hybrids, excluding clementines originating in Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 314/85 de la Commission, du 6 février 1985, instituant
    une taxe compensatoire à l'importation de mandarines, y compris tangerines et
    satsumas, wilkings et autres hybrides similaires d'agrumes, à l'exclusion des
    clémentines originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 314/85 der Kommission vom 6. Februar 1985 zur Einführung
    einer Ausgleichsabgabe auf die Einfuhr von Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und anderen ähnlichen Kreuzungen von Zitrusfrüchten,
    ausgenommen Clementinen, mit Ursprung in Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 314/85 af 6. februar 1985 om opkrævning
    af en udligningsafgift ved indførsel af mandariner (herunder tangeriner og satsumas),
    Wilkings og andre lignende krydsninger af citrusfrugter, undtagen clementiner
    med oprindelse i Spanien
  type: main
