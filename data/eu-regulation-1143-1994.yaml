    combinata 4820 50 00 originari della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1143/94 VAN DE COMMISSIE van 18 mei 1994 houdende
