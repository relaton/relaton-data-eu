title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1143/94 of 18 May 1994 re- etablishing the
    levying of the customs duties applicable to products falling within CN code 4820
    50 00 originating in South Korea, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1143/94 de la Commission du 18 mai 1994 portant rétablissement
    de la perception des droits de douane applicables aux produits du code NC 4820
    50 00 originaires de Corée du Sud, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1143/94 DER KOMMISSION vom 18. Mai 1994 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 4820 50 00 mit Ursprung in
    Südkorea, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1143/94 af 18. maj 1994 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 4820 50 00 og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1143/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
