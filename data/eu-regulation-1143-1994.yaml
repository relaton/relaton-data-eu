    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 4820 50 00 καταγωγής Νότιας Κορέας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1143/94 DELLA COMMISSIONE del 18 maggio 1994 che ripristina
