    uit de belasting over de toegevoegde waarde (Kennisgeving geschied onder nummer
    C(2017) 7857)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE, Euratom) 2017/2222 z dnia 30 listopada
