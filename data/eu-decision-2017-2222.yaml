  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU, Euratom) 2017/2222 z dne 30. novembra 2017
    o spremembi Odločbe 90/178/Euratom, EGS o pooblastitvi Luksemburga, da pri izračunu
    osnove za lastna sredstva iz naslova DDV ne upošteva nekaterih kategorij transakcij
