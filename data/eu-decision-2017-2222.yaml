    kategóriák figyelmen kívül hagyásának és bizonyos közelítő becslések
    alkalmazásának Luxemburg számára való engedélyezéséről szóló 90/178/Euratom,
    EGK határozat módosításáról (az értesítés a C(2017) 7857. számú dokumentummal
    történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE, Euratom) 2017/2222 della Commissione, del
    30 novembre 2017, recante modifica della decisione 90/178/Euratom, CEE che autorizza
    il Granducato del Lussemburgo a non tener conto di determinate categorie di operazioni
    o a ricorrere a talune valutazioni approssimative per il calcolo della base delle
    risorse proprie provenienti dall'imposta sul valore aggiunto [notificata con il
    numero C(2017) 7857]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES, Euratom) 2017/2222 (2017. gada 30.
    novembris), ar kuru groza Lēmumu 90/178/Euratom, EEK, ar ko Luksemburgai atļauj
    neņemt vērā noteiktas darījumu kategorijas un izmantot noteiktas aptuvenas
    aplēses PVN pašu resursu bāzes aprēķinam (izziņots ar dokumenta numuru C(2017)
    7857)
  type: main
- language: lt
  script: Latn
  content: 2017 m. lapkričio 30 d. Komisijos įgyvendinimo sprendimas (ES, Euratomas)
