    să nu țină seama de anumite categorii de operațiuni și să utilizeze anumite
    estimări aproximative pentru calculul bazei resurselor proprii provenite din
    TVA [notificată cu numărul C(2017) 7857]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ, Euratom) 2017/2222 z 30. novembra
