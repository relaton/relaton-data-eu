    do nieuwzględniania określonych kategorii transakcji i do wykorzystywania określonych
    przybliżonych danych szacunkowych do obliczenia podstawy zasobów własnych opartych
    na VAT (notyfikowana jako dokument nr C(2017) 7857)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE, Euratom) 2017/2222 da Comissão, de 30 de novembro
    de 2017, que altera a Decisão 90/178/Euratom, CEE que autoriza o Luxemburgo a
    não ter em conta certas categorias de operações e a utilizar determinadas estimativas
    aproximativas para o cálculo da matéria coletável dos recursos próprios provenientes
    do IVA [notificada com o número C(2017) 7857]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE, Euratom) 2017/2222 a Comisiei din 30
