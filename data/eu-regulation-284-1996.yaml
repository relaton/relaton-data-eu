  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 284/96 da Comissão, de 14 de Fevereiro de 1996, que
    derroga o Regulamento (CE) nº 1439/95, que estabelece normas de execução do
    Regulamento (CEE) nº 3013/89 do Conselho, no que respeita à importação e exportação
    de produtos do sector das carnes de ovino e caprino e o Regulamento (CE) nº 3016/95,
    que abre contingentes pautais comunitários relativos a 1996 para os ovinos e
    caprinos e as carnes de ovino e caprino dos códigos NC 0104 10 30, 0104 10 80,
    0104 20 90 e 0204
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 284/96 de la Comisión, de 14 de febrero de 1996, por
    el que se establecen excepciones al Reglamento (CE) nº 1439/95 por el que se
    establecen disposiciones de aplicación del Reglamento (CEE) nº 3013/89 del Consejo,
    en lo relativo a la importación y exportación de productos del sector de la
    carne de ovino y caprino, y al Reglamento (CE) nº 3016/95 por el que se abren
    contingentes arancelarios comunitarios de ganado ovino y caprino y de carne de
    ovino y caprino de los códigos NC 0104 10 30, 0104 10 80, 0104 20 90 y 0204 para
