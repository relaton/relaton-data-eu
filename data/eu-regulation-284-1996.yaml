    της 14ης Φεβρουαρίου 1996, περί παρεκκλίσεως από
    τον κανονισμό (ΕΚ) αριθ. 1439/95 σχετικά με τη θέσπιση
    λεπτομερών κανόνων για την εφαρμογή του κανονισμού
    (ΕΟΚ) αριθ. 3013/89 του Συμβουλίου όσον αφορά τις
