title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 284/96 of 14 February 1996 derogating from
    Regulation (EC) No 1439/95 laying down detailed rules for the application of Council
    Regulation (EEC) No 3013/89 as regards the import and export of products in the
    sheepmeat and goatmeat sector and from Regulation (EC) No 3016/95 opening Community
    tariff quotas for 1996 for sheep, goats, sheepmeat and goatmeat falling within
    CN codes 0104 10 30, 0104 10 80, 0104 20 90 and 0204
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 284/96 de la Commission, du 14 février 1996, portant
    dérogation au règlement (CE) nº 1439/95 établissant les modalités d' application
    du règlement (CEE) nº 3013/89 du Conseil en ce qui concerne l' importation et
    l' exportation de produits du secteur des viandes ovine et caprine, et au règlement
    (CE) nº 3016/95 portant ouverture de contingents tarifaires communautaires pour
    1996 pour les animaux vivants des espèces ovine et caprine et pour la viande
    des animaux des espèces ovine et caprine relevant des codes NC 0104 10 30, 0104
    10 80, 0104 20 90 et 0204
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 284/96 der Kommission vom 14. Februar 1996 zur Anpassung
    der Verordnung (EG) Nr. 1439/95 zur Durchführung der Verordnung (EWG) Nr. 3013/89
    des Rates hinsichtlich der Einfuhr und Ausfuhr von Schaf- und Ziegenfleischerzeugnissen
    sowie der Verordnung (EG) Nr. 3016/95 zur Eröffnung von Gemeinschaftszollkontingenten
    für Schafe und Ziegen sowie Schaf- und Ziegenfleisch der KN-Codes 0104 10 30,
    0104 10 80, 0104 20 90 und 0204 für 1996
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 284/96 af 14. februar 1996 om undtagelse
    fra forordning (EF) nr. 1439/95 om gennemførelsesbestemmelser til Rådets forordning
    (EØF) nr. 3013/89 for så vidt angår indførsel og udførsel af fåre- og gedekød
    og fra forordning (EF) nr. 3016/95 om åbning af EF-toldkontingenter for 1996
    for får, geder, fårekød og gedekød henhørende under KN-kode 0104 10 30, 0104
    10 80, 0104 20 90 og 0204
  type: main
- language: el
  script: Grek
