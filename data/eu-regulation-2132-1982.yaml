title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2132/82 of 30 July 1982 re-establishing
    the levying of customs duties on travel goods, falling within subheading 42.02
    B and originating in India, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2132/82 de la Commission, du 30 juillet 1982, portant
    rétablissement de la perception des droits de douane applicables aux articles
    de voyage de la sous-position 42.02 B du tarif douanier commun, originaires de
    l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2132/82 der Kommission vom 30. Juli 1982 zur Wiedereinführung
    der Erhebung der Zölle für Reiseartikel der Tarifstelle 42.02 B, mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen
    Zollpräferenzen gewährt werdeng
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2132/82 af 30. juli 1982 om genindførelse
    af opkrævning af told for rejseartikler, henhørende under pos. 42.02 B og med
    oprindelse i Indien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2132/82 τής Επιτροπής
    τής 30ής Ιουλίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά είδη ταξειδίου
    τής διακρίσεως 42. 02 Β τού Κοινού Δασμολογίου,
    καταγωγής Ινδιών, δικαιούχων τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2132/82 della Commissione, del 30 luglio 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti da viaggio,
    della sottovoce 42.02 B della tariffa doganale comune, originari dell' India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del ConsiglioC
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2132/82 van de Commissie van 30 juli 1982 houdende
