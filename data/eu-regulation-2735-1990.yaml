    peräisin olevien volframimalmien ja niiden rikasteiden tuonnissa ja väliaikaisen
    tullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2735/90 del Consiglio, del 24 settembre 1990, che
    istituisce un dazio antidumping definitivo sulle importazioni di minerali e concentrati
    di tungsteno originari della Repubblica popolare cinese e dispone la riscossione
    definitiva del dazio antidumping provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2735/90 van de Raad van 24 september 1990 tot instelling
    van een definitief anti- dumpingrecht op de invoer van wolfraamerts en concentraten
    daarvan, van oorsprong uit de Volksrepubliek China, en tot definitieve inning
    van het voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2735/90 do Conselho, de 24 de Setembro de 1990, que
    institui um direito anti-dumping definitivo sobre as importações de minério
    de tungsténio e seus concentrados originárias da República Popular da China
    e que estabelece a cobrança definitiva do direito anti-dumping provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2735/90 del Consejo, de 24 de septiembre de 1990,
