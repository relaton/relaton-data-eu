title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2735/90 of 24 September 1990 imposing a definitive
    anti-dumping duty on imports of tungsten ores and concentrates originating in
    the People's Republic of China and definitively collecting the provisional anti-dumping
    duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2735/90 du Conseil, du 24 septembre 1990, instituant
    un droit antidumping définitif sur les importations de minerai de tungstène
    et de leurs concentrés originaires de la République populaire de Chine et portant
    perception définitive du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2735/90 des Rates vom 24. September 1990 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Wolframerzen und -konzentraten
    mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmung des
    vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2735/90 af 24. september 1990 om indførelse
    af en endelig antidumpingtold på importen af wolframmalm og koncentrater deraf
    med oprindelse i Den Kinesiske Folkerepublik og om endelig opkrævning af den
    midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2735/90 του Συμβουλίου
    της 24ης Σεπτεμβρίου 1990 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές μεταλλευμάτων
    βολφραμίου και των εμπλουτισμένων από αυτά,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας και
    για την οριστική είσπραξη του προσωρινού δασμού
    αντιντάμπινγκ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2735/90, annettu 24 päivänä syyskuuta 1990,
