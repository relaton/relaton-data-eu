title:
- language: en
  script: Latn
  content: '87/199/EEC: Commission Decision of 10 March 1987 amending Decision 84/58/EEC
    authorizing the United Kingdom temporarily to take additional measures to protect
    itself against the introduction of Puccinia horiana (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/199/CEE: Décision de la Commission du 10 mars 1987 modifiant la décision
    84/58/CEE autorisant provisoirement le Royaume-Uni à prendre des dispositions
    complémentaire en vue de se préserver contre l''introduction du Puccinia horiana
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/199/EWG: Entscheidung der Kommission vom 10. März 1987 zur Änderung
    der Entscheidung 84/58/EWG zur Ermächtigung des Vereinigten Königreichs, zum
    Schutz gegen die Einschleppung von Puccinia horiana vorübergehend ergänzende
    Maßnahmen zu treffen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/199/EØF: Kommissionens beslutning af 10. marts 1987 om ændring af
    beslutning 84/58/EØF om bemyndigelse af Det forenede Kongerige til midlertidigt
    at træffe supplerende foranstaltninger for at beskytte sig mod indslæbning af
    Puccinia horiana (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/199/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Μαρτίου 1987 που τροποποιεί την απόφαση 84/58/ΕΟΚ
    περί παροχής προσωρινής αδείας στο Ηνωμένο
    Βασίλειο να λάβει πρόσθετα μέτρα για να προστατευθεί
    από την εισαγωγή της Puccinia horiana (Το κείμενο στην
    αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/199/CEE: Decisione della Commissione del 10 marzo 1987 recante modifica
    della decisione 84/58/CEE che autorizza il Regno Unito ad adottare a titolo provvisorio
    disposizioni complementari per premunirsi contro l''introduzione di "Puccinia
    horiana" (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/199/EEG: Beschikking van de Commissie van 10 maart 1987 houdende wijziging
    van Beschikking 84/58/EEG tot machtiging van het Verenigd Koninkrijk om voorlopig
    aanvullende beschermende maatregelen te nemen tegen het binnenbrengen van Puccinia
    horiana op zijn grondgebied (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/199/CEE: Decisão da Comissão de 10 de Março de 1987 que altera a
    Decisão 84/58/CEE que autoriza o Reino Unido a tomar, temporariamente, medidas
    complementares de protecção contra a introdução de Puccinia horiana (Apenas
    faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '87/199/CEE: Decisión de la Comisión de 10 de marzo de 1987 por la que
    se modifica la Decisión 84/58/CEE por la que se autoriza al Reino Unido para
    adoptar, con carácter transitorio, medidas suplementarias para protegerse contra
    la introducción de la Puccinia horiana (El texto en lengua inglesa es el único
    auténtico)'
  type: main
