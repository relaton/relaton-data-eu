title:
- language: en
  script: Latn
  content: Regulation (EEC) No 954/74 of the Commission of 19 April 1974 reintroducing
    Common Customs Tariff duties on cotton yarn, put up for retail sale, falling within
    heading No 55.06, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3578/73 of 28 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 954/74 de la Commission, du 19 avril 1974, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de coton conditionnés pour la vente au détail, de la position tarifaire
    55.06, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3578/73 du Conseil du 28 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 954/74 der Kommission vom 19. April 1974 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Baumwollgarne in Aufmachungen für
    den Einzelverkauf, der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 3578/73 des Rates vom 28. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 954/74 af 19. april 1974 om genindførelse
    af tolden ifølge den fælles toldtarif for garn af bomuld, i detailsalgsoplægninger
    henhørende under pos. 55.06, der har oprindelse i Jugoslavien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3578/73 af
    28. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 954/74 della Commissione, del 19 aprile 1974, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di cotone preparati per la vendita al minuto della voce doganale n. 55.06,
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3578/73 del Consiglio, del 28 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 954/74 van de Commissie, van 19 april 1974 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van katoen, gereed voor de verkoop in het klein, van
    tariefpost 55.06, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3578/73 van de Raad van 28 december 1973 tariefpreferenties werden geopend
  type: main
