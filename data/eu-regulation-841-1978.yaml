title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 841/78 of 26 April 1978 re-establishing
    the levying of customs duties on carbonate of sodium anhydrous, falling within
    subheading 28.42 A ex II and originating in Romania, to which the preferential
    tariff arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 841/78 de la Commission, du 26 avril 1978, portant
    rétablissement de la perception des droits de douane applicables au carbonate
    de sodium anhydre, de la sous-position tarifaire 28.42 à EX II, originaire de
    Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 841/78 der Kommission vom 26. April 1978 zur Wiedereinführung
    des Zollsatzes für wasserfreies Natriumkarbonat der Tarifstelle 28.42 A ex II,
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 841/78 af 26. april 1978 om genindførelse
    af opkrævning af toldafgifter for natriumcarbonat, vandfri, under underposition
    28.42 A ex II, som har oprindelse i Rumænien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 841/78 della Commissione, del 26 aprile 1978, che
    ripristina la riscossione del dazi doganali applicabili al carbonato di sodio
    anidro, della sottovoce doganale 28.42 A ex II, originario della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 841/78 van de Commissie van 26 april 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op watervrij
    natriumcarbonaat, van post 28.42 A ex II, van oorsprong uit Roemenië, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
