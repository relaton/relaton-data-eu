    aan de marktdeelnemers-nieuwkomers de jaarlijkse toewijzigingen voor het jaar
    1999 in het kader van de tariefcontingenten voor invoer en de hoeveelheid traditionele
    ACS-bananen worden toegekend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1591/1999 da Comissão de 20 de Julho de 1999 que
