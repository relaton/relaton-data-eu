    Marktbeteiligten" zuzuteilenden Jahresmengen an den Zolleinfuhrkontingenten und
    den traditionellen AKP- Bananen für 1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1591/1999 af 20. juli 1999 om ændring
