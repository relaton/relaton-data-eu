    vuodeksi 1999 annetun asetuksen (EY) N:o 2631/98 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1591/1999 della Commissione del 20 luglio 1999 recante
    modifica del regolamento (CE) n. 2631/98 che determina i quantitativi per i quali
    sono concesse, per l'anno 1999, le assegnazioni annuali agli "operatori nuovi
    arrivati" nel quadro dei contingenti tariffari all'importazione e del quantitativo
    di banane ACP tradizionali
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1591/1999 van de Commissie van 20 juli 1999 houdende
