    allocations annuelles aux "opérateurs nouveaux arrivés" sont octroyées, pour
    l'année 1999, dans le cadre des contingents tarifaires à l'importation et de
    la quantité de bananes traditionnelles ACP
  type: main
- language: de
  script: Latn
