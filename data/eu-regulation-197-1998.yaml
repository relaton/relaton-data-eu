    tammikuussa 1998 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan
    tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian, Bulgarian ja Romanian
    osalta
  type: main
