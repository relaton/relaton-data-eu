title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 197/98 of 26 January 1998 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in January 1998 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1939/97 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 197/98 DE LA COMMISSION du 26 janvier 1998 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1998 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1939/97 pour la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 197/98 DER KOMMISSION vom 26. Januar 1998 zur Bestimmung
    des Prozentsatzes, zu dem den im Januar 1998 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Fleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß Verordnung (EG)
    Nr. 1939/97 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 197/98 af 26. januar 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i januar 1998 om
    importlicenser for kød i forbindelse med de toldkontingenter for oksekød, der
    i forordning (EF) nr. 1939/97 er fastsat for Republikken Polen, Republikken Ungarn,
    Den Tjekkiske Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
