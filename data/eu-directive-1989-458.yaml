id: EUDirective1989458
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 89/458/EEC of 18 July 1989 amending with regard to European
    emission standards for cars below 1,4 litres, Directive 70/220/EEC on the approximation
    of the laws of the Member States relating to measures to be taken against air
    pollution by emissions from motor vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 89/458/CEE du Conseil du 18 juillet 1989 modifiant, en ce qui
    concerne les normes européennes d'émission pour les automobiles de cylindrée
    inférieure à 1,4 litre, la directive 70/220/CEE concernant le rapprochement
    des législations des États membres relatives aux mesures à prendre contre la
    pollution de l'air par les émissions des véhicules à moteur
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/458/EWG des Rates vom 18. Juli 1989 zur Änderung der Richtlinie
    70/220/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten Über Maßnahmen
    gegen die Verunreinigung der Luft durch Emissionen von Kraftfahrzeugen hinsichtlich
    der Europäischen Emissionsnormen für Kraftfahrzeuge mit einem Hubraum unter
    1,4 Litern
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 18. července 1989, kterou se mění směrnice 70/220/EHS
    o sbližování právních předpisů členských států týkajících se opatření
    proti znečišťování ovzduší plyny zážehových motorů motorových vozidel,
    pokud jde o evropské normy pro automobily se zdvihovým objemem motoru menším
    než 1,4 litru
  type: main
- language: da
  script: Latn
  content: Rådest Direktiv af 18. juli 1989 om ændring af direktiv 70/220/EØF om
    tilnærmelse af medlemsstaternes lovgivninger om foranstaltninger mod luftforurening
    forårsaget af udstødningsgas fra motorkøretøjer for så vidt angår europæiske
    emissionsnormer for biler med motorslagvolumen på mindre end 1,4 liter (89/458/EØF)
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/458/ΕΟΚ του Συμβουλίου της 18ης Ιουλίου
    1989 για την τροποποίηση, όσον αφορά τα ευρωπαϊκά
    πρότυπα εκπομπής για αυτοκίνητα κυβισμού μικρότερου
    των 1.400 cm3, της οδηγίας 70/220/ΕΟΚ περί προσεγγίσεως
    των νομοθεσιών των κρατών μελών σχετικά με
    τα μέτρα που πρέπει να ληφθούν κατά της ατμοσφαιρικής
    ρύπανσης από εκπομπές οχημάτων με κινητήρα
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 18. juuli 1989, millega muudetakse alla 1,4-liitriste
    autode Euroopa heitmenormide osas direktiivi 70/220/EMÜ mootorsõidukite heitgaaside
    tekitatud õhusaaste vastu võetavaid meetmeid käsitlevate liikmesriikide õigusaktide
    ühtlustamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/458/ETY, annettu 18 päivänä heinäkuuta 1989,
    moottoriajoneuvojen päästöjen aiheuttaman ilman pilaantumisen estämiseksi
    toteutettavia toimenpiteitä koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun neuvoston direktiivin 70/220/ETY muuttamisesta eurooppalaisten päästöjä
    koskevien standardien mukaiseksi alle 1,4 litraisten autojen osalta
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1989. július 18.) az 1,4 liter hengerűrtartalom
    alatti személygépjárművekre vonatkozó európai kibocsátási szabványok
    tekintetében a gépjárművek külső gyújtású motorjainak kipufogógázai
    által okozott levegőszennyezés elleni intézkedésekre vonatkozó tagállami
    jogszabályok közelítéséről szóló 70/220/EGK irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva del Consiglio del 18 luglio 1989 che modifica, per quanto riguarda
    le norme europee di emissione per autoveicoli di cilindrata inferiore a 1,4 litri,
    la direttiva 70/220/CEE concernente il ravvicinamento delle legislazioni degli
    Stati membri relative alle misure da adottare contro l' inquinamento atmosferico
    con le emissioni dei veicoli a motore (89/458/CEE)
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva (1989. gada 18. jūlijs), ar ko attiecībā uz Eiropas
    emisiju standartiem mašīnām ar motora darba tilpumu mazāku par 1,4 litriem
    groza Direktīva 70/220/EEK par dalībvalstu tiesību aktu tuvināšanu attiecībā
    uz pasākumiem, kas jāveic, lai novērstu gaisa piesārņošanu, ko rada emisija
    no mehāniskajiem transportlīdzekļiem
  type: main
- language: lt
  script: Latn
  content: 1989 m. liepos 18 d. Tarybos direktyva, iš dalies keičianti Direktyvą
    70/220/EEB dėl valstybių narių įstatymų, reglamentuojančių priemones, kurių
    būtina imtis oro apsaugai nuo teršimo motorinių transporto priemonių su priverstinio
    uždegimo varikliais išmetamosiomis dujomis, suderinimo, atsižvelgiant į Europos
    išmetamųjų medžiagų standartus automobiliams su mažesnio kaip 1,4 l darbinio
    tūrio varikliais
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill tat-18 ta’ Lulju 1989 li temenda fir-rigward
    l-istandards ta’ emissjoni għal karozzi li huma ta’ inqas minn 1,4 litri,
    id-Direttiva 70/220/KEE dwar l-l-approssimazzjoni tal-liġijiet ta’ l-Istati
    Membri dwar il-miżuri li għandhom jittieħdu kontra it-tniġġis ta’ l-arja
    kawżat minn emissjonijiet minn vetturi bil-mutur
  type: main
- language: nl
  script: Latn
  content: Richtlijn van de Raad van 18 juli 1989 tot wijziging, voor wat betreft
    de Europese emissienormen voor auto' s met een cilinderinhoud van minder dan 1,4
    liter, van Richtlijn 70/220/EEG inzake de onderlinge aanpassing van de wetgevingen
    der Lid-Staten met betrekking tot de maatregelen die moeten worden genomen tegen
    luchtverontreiniging door uitlaatgassen van motorvoertuigen (89/458/EEG)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 18 lipca 1989 r. zmieniająca w odniesieniu do europejskich
    norm emisyjnych dla samochodów o pojemności mniejszej niż 1,4 litra dyrektywę
    70/220/EWG w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących
    się do działań, jakie mają być podjęte w celu ograniczenia zanieczyszczanie
    powietrza przez spaliny z silników o zapłonie iskrowym pojazdów silnikowych
  type: main
- language: pt
  script: Latn
  content: Directiva do Conselho de 18 de Julho de 1989 que altera, no que diz respeito
    às normas europeias de emissões para automóveis com motores de cilindrada inferior
    a 1,4 litro, a Directiva 70/220/CEE relativa à aproximação das legislações
    dos Estados-membros respeitantes às medidas a tomar contra a poluição do ar
    por emissões provenientes dos veículos a motor (89/458/CEE)
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 18. júla 1989, ktorou sa mení a dopĺňa smernica č.
    70/220/EHS o aproximácii právnych predpisov členských štátov o opatreniach
    proti znečisťovaniu ovzdušia výfukovými plynmi z motorových vozidiel, vzhľadom
    na európske normy emisií pre vozidlá s obsahom nižším než 1,4 litra
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 18. julija 1989 ki glede evropskih emisijskih standardov
    za avtomobile pod 1,4 litra spreminja Direktivo 70/220/EGS o približevanju zakonodaje
    držav članic o ukrepih, proti onesnaževanju zraka z emisijami iz motornih vozil
  type: main
- language: es
  script: Latn
  content: Directiva 89/458/CEE del Consejo, de 18 de julio de 1989, por la que se
    modifica, en lo que se refiere a las normas europeas de emisión para vehículos
    de cilindrada inferior a 1,4 litros, la Directiva 70/220/CEE relativa a la aproximación
    de las legislaciones de los Estados miembros en materia de medidas contra la contaminación
    atmosférica causada por las emisiones de los vehículos a motor
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 89/458/EEG av den 18 juli 1989 om ändring i direktiv
    70/220/EEG om tillnärmning av medlemsstaternas lagstiftning om åtgärder mot
    luftförorening genom avgaser från motorfordon såvitt avser europeiska utsläppsnormer
    för bilar med motorer mindre än 1,4 liter
  type: main
