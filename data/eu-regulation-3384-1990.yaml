  content: Commission Regulation (EEC) No 3384/90 of 26 November 1990 laying down
    rates of compensatory interest applicable during the first half of 1991 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3384/90 de la Commission du 26 novembre 1990 fixant
