    douanière relative aux produits compensateurs ou aux marchandises en l'état
    pendant le premier semestre de 1991
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3384/90 DER KOMMISSION vom 26. November 1990 mit Saetzen
    von Ausgleichszinsen, die im ersten Halbjahr 1991 bei Entstehung einer Zollschuld
    fuer Veredelungserzeugnisse oder unveredelte Waren anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3384/90 af 26. november 1990 om fastsættelse
