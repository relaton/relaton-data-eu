    der Erhebung der Zölle für Hexamethylentetramin der Tarifstelle 29.26 B II a),
    mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2965/81 af 15. oktober 1981 om genindførelse
    af opkrævning af told for hexamethylentetramin, henhørende under pos. 29.26
    B II a) og med oprindelse i Rumænien, som præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
