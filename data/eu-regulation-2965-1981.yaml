title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2965/81 of 15 October 1981 re-establishing
    the levying of customs duties on hexamethylenetetramine, falling within subheading
    29.26 B II a) and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2965/81 de la Commission, du 15 octobre 1981, portant
    rétablissement de la perception des droits de douane applicables à l' hexaméthylènetétramine
    de la sous-position tarifaire 29.26 B II a) du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
