    zavedení některých zvláštních omezujících opatření namířených proti
    některým osobám a subjektům spojeným s organizacemi ISIL (Dá'iš) a al-Kajdá
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/413 af 10. marts 2022
