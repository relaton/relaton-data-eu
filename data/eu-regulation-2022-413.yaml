title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/413 of 10 March 2022 amending
    for the 330th time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the ISIL (Da'esh) and Al-Qaida organisations
  type: main
- language: fr
  script: Latn
