title:
- language: en
  script: Latn
  content: '76/162/EEC: Commission Decision of 19 December 1975 on amendments to the
    boundaries of less-favoured areas in the Federal Republic of Germany within the
    meaning of Article 3 (4) and (5) of Council Directive 75/268/EEC and Directive
    75/270/EEC of 28 April 1975 (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '76/162/CEE: Décision de la Commission, du 19 décembre 1975, modifiant
    les limites des zones agricoles défavorisées au sens de l''article 3 paragraphes
    4 et 5 de la directive 75/268/CEE du Conseil du 28 avril 1975 et figurant à l''annexe
    de la directive 75/270/CEE du Conseil, qui se trouvent sur le territoire de la
    République fédérale d''Allemagne (Le texte en langue grecque est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '76/162/EWG: Entscheidung der Kommission vom 19. Dezember 1975 betreffend
    die Änderung der Grenzen der in der Anlage zu der Richtlinie des Rates 75/270/EWG
    aufgeführten benachteiligten Gebiete im Sinne von Artikel 3 Absätze 4 und 5
    der Richtlinie des Rates 75/268/EWG vom 28. April 1975 in der Bundesrepublik Deutschland
    (Nur Der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '76/162/EØF: Kommissionens Beslutning af 19. december 1975 om ændring
    af grænserne for de i bilaget til Rådets direktiv 75/270/EØF anførte ugunstigt
    stillede områder i henhold til artikel 3, stk. 4 og 5, i Rådets direktiv 75/268/EØF
    af 28. april 1975 i Forbundsrepublikken Tyskland (Kun den græske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '76/162/ΕΟΚ : Απόφαση της Επιτροπής, της 19ης
    Δεκεμβρίου 1975, περί της τροποποίησης των ορίων
    των μειονεκτούντων αγροτικών ζωνών υπό την
    έννοια του άρθρου 3 παράγραφοι 4 και 5 της Οδηγίας
    75/268/ΕΟΚ του Συμβουλίου της 28ης Απριλίου 1975
