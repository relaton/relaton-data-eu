  script: Latn
  content: '76/162/CEE: Decisione della Commissione, del 19 dicembre 1975, che modifica
    i limiti delle zone svantaggiate della Repubblica federale di Germania, elencate
    nell''allegato della direttiva 75/270/CEE del Consiglio e definite all''articolo
    3, paragrafi 4 e 5, della direttiva 75/268/CEE del Consiglio del 28 aprile 1975
    (Il testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
