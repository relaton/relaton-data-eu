title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2041/95 of 23 August 1995 fixing the single
    reduction coefficient for the determination of the quantity of third country or
    non-traditional ACP bananas to be allocated to each Category C operator registered
    in Austria, Finland and Sweden for import into those Member States for the fourth
    quarter of 1995
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2041/95 DE LA COMMISSION du 23 août 1995 fixant le
    coefficient uniforme de réduction pour la détermination de la quantité de bananes
    originaires des pays tiers ou non traditionnelles ACP à attribuer à chaque opérateur
    de la catégorie C enregistré en Autriche, en Finlande ou en Suède pour l'importation
    dans ces États membres pour le quatrième trimestre de l'année 1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2041/95 DER KOMMISSION vom 23. August 1995 zur Festsetzung
    des einheitlichen Koeffizienten, mit dem die Mengen Drittlandsbananen und nichttraditionelle
    AKP-Bananen zu verringern sind, die den in Österreich, Finnland oder Schweden
    registrierten Marktbeteiligten der Gruppe C zur Einfuhr in diesen Mitgliedstaaten
    für das vierte Quartal 1995 zugeteilt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2041/95 af 23. august 1995 om fastsættelse
    af den fælles nedsættelseskoefficient til beregning af den mængde bananer fra
    tredjelande eller ikke-traditionelle AVS-bananer, der skal tildeles hver erhvervsdrivende
    i kategori C, der er registreret i Østrig, Finland og Sverige, for import til
    disse medlemsstater i fjerde kvartal af 1995
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2041/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 23ης Αυγούστου 1995 για τον καθορισμό ενιαίου
    συντελεστή μειώσεως για τον προσδιορισμό της
    ποσότητας μπανάνας προέλευσης τρίτων χωρών
    ή μη παραδοσιακών ΑΚΕ που θα κατανεμηθεί σε
    κάθε επιχειρηματία της κατηγορίας Γ καταχωρημένο
    στην Αυστρία, τη Φινλανδία ή τη Σουηδία για
    εισαγωγή στα κράτη μέλη αυτά κατά το τέταρτο
    τρίμηνο του 1995
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2041/95, annettu 23 päivänä elokuuta 1995,
    yhtenäisestä vähennyskertoimesta kullekin Itävallassa, Suomessa tai Ruotsissa
    rekisteröidylle C-luokan toimijalle vuoden 1995 viimeiselle neljännekselle myönnettävän
    kolmansien maiden tai muiden kuin perinteisten AKT-maiden banaanien edellä mainittuihin
    jäsenvaltioihin maahantuotavan määrän määrittämiseksi
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2041/95 DELLA COMMISSIONE del 23 agosto 1995 che fissa
    il coefficiente uniforme di riduzione per la determinazione della quantità di
    banane dei paesi terzi o di banane non tradizionali ACP da assegnare a ciascun
    operatore della categoria C registrato in Austria, Finlandia e Svezia per l'importazione
    in tali Stati membri nel corso del quarto trimestre del 1995
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2041/95 VAN DE COMMISSIE van 23 augustus 1995 tot
    vaststelling van de uniforme verminderingscoëfficiënt voor het bepalen van de
    hoeveelheid bananen uit derde landen of niet-traditionele ACS-bananen die voor
    het vierde kwartaal van 1995 aan elke in Oostenrijk, Finland en Zweden geregistreerde
    marktdeelnemer van categorie C wordt toegewezen voor invoer in deze Lid-Staten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2041/95 DA COMISSÃO de 23 de Agosto de 1995 que fixa
    o coeficiente uniforme de redução para a determinação da quantidade de bananas
    de países terceiros e de bananas não tradicionais ACP a atribuir a cada operador
    da categoria C inscrito nos registos da Áustria, da Finlândia e da Suécia para
    importação nestes Estados-membros no quarto trimestre de 1995
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2041/95 DE LA COMISIÓN de 23 de agosto de 1995 por
    el que se establece el coeficiente simple de reducción para el establecimiento
    de la cantidad de plátanos de terceros países o ACP no tradicionales que deben
    asignarse a cada agente económico de la categoría C registrado en Austria, Finlandia
    o Suecia para su importación en dichos Estados miembros durante el cuarto trimestre
    de 1995
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2041/95 av den 23 augusti 1995 om fastställande
    av den enhetliga nedsättningskoefficienten för fastställande av den kvantitet
    bananer från tredje land eller icke traditionella AVS-bananer som skall tilldelas
    varje aktör i kategori C registrerad i Österrike, Finland eller Sverige för
    import till dessa medlemsstater för fjärde kvartalet 1995
  type: main
