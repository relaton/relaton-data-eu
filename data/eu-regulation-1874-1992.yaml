    de la catégorie 7 (numéro d' ordre 40.0070) originaires du Brésil, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) nr. 1874/92 der Kommission vom 6. Juli 1992 zur Wiedereinführung
