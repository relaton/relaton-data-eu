title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 octobre 1969, autorisant la République
    française en vertu de l'article 115 alinéa 1 du Traité, à exclure du traitement
    communautaire les "prunes fraîches", de la position 08.07 D du Tarif douanier
    commun, originaires de Yougoslavie et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '69/385/EWG: Entscheidung der Kommission vom 21. Oktober 1969, mit der
    die Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, Frischpflaumen der Tarifnummer 08.07 D des Gemeinsamen Zolltarifs mit Ursprung
    in Jugoslawien, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '69/385/CEE: Decisione della Commissione, del 21 ottobre 1969, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del trattato,
    ad escludere dal trattamento comunitario le «prugne fresche» della voce 08.07
    D della tariffa doganale comune, originarie della Iugoslavia ed immesse in libera
    pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '69/385/EEG: Beschikking van de Commissie van 21 oktober 1969 houdende
    machtiging van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag "verse pruimen" van post 08.07 D van het gemeenschappelijk douanetarief,
    die van oorsprong zijn uit Joegoslavië en in andere Lid-Staten in het vrije verkeer
    zijn gebracht, van de communautaire behandeling uit te sluiten'
  type: main
