title:
- language: en
  script: Latn
  content: '2004/227/EC: Council Decision of 26 February 2004 amending Decision 2002/736/EC
    authorising the Hellenic Republic to apply a measure derogating from Articles
    2 and 28a of the Sixth Council Directive 77/388/EEC on the harmonisation of the
    laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2004/227/CE: Décision du Conseil du 26 février 2004 modifiant la décision
    2002/736/CE autorisant la République hellénique à appliquer une mesure dérogatoire
    aux articles 2 et 28 bis de la sixième directive 77/388/CEE en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '2004/227/EG: Entscheidung des Rates vom 26. Februar 2004 zur Änderung
    der Entscheidung 2002/736/EG zur Ermächtigung der Hellenischen Republik zur Anwendung
    einer von den Artikeln 2 und 28a der Sechsten Richtlinie 77/388/EWG über die
    Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    abweichenden Regelung'
  type: main
- language: da
  script: Latn
  content: '2004/227/EF: Rådets beslutning af 26. februar 2004 om ændring af beslutning
    2002/736/EF om bemyndigelse af Den Hellenske Republik til at træffe en foranstaltning,
    der fraviger artikel 2 og artikel 28a i sjette direktiv 77/388/EØF om harmonisering
    af medlemsstaternes lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '2004/227/ΕΚ: Απόφαση του Συμβουλίου, της 26ης
    Φεβρουαρίου 2004, για τροποποίηση της απόφασης
    2002/736/ΕΚ με την οποία εξουσιοδοτείται η Ελληνική
    Δημοκρατία να εφαρμόσει μέτρο παρέκκλισης
    από τα άρθρα 2 και 28α της έκτης οδηγίας 77/388/ΕΟΚ
    περί εναρμονίσεως των νομοθεσιών των κρατών
    μελών των σχετικών με τους φόρους κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '2004/227/EY: Neuvoston päätös, tehty 26 päivänä helmikuuta 2004,
    luvan antamisesta Helleenien tasavallalle soveltaa jäsenvaltioiden liikevaihtoverolainsäädännön
    yhdenmukaistamisesta annetun kuudennen direktiivin 77/388/ETY 2 ja 28 a artiklasta
    poikkeavaa toimenpidettä tehdyn päätöksen 2002/736/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '2004/227/CE: Decisione del Consiglio, del 26 febbraio 2004, recante modifica
    della decisione 2002/736/CE che autorizza la Repubblica ellenica ad applicare
    una misura di deroga agli articoli 2 e 28 bis della sesta direttiva 77/388/CEE
    del Consiglio in materia di armonizzazione delle leggi degli Stati membri relative
    alle imposte sulla cifra d''affari'
  type: main
- language: nl
  script: Latn
  content: '2004/227/EG: Beschikking van de Raad van 26 februari 2004 tot wĳziging
    van Beschikking 2002/736/EG waarbĳ Griekenland gemachtigd wordt tot toepassing
    van een maatregel die afwĳkt van artikel 2 en artikel 28 bis van de Zesde Richtlĳn
    77/388/EEG betreffende de harmonisatie van de wetgevingen der lidstaten inzake
    omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '2004/227/CE: Decisão do Conselho, de 26 de Fevereiro de 2004, que altera
