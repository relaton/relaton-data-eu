title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1982/85 of 16 July 1985 amending Regulation
    (EEC) No 3035/80 laying down general rules for granting export refunds on certain
    agricultural products exported in the form of goods not covered by Annex II to
    the Treaty, and the criteria for fixing the amount of such refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1982/85 du Conseil du 16 juillet 1985 modifiant le
    règlement (CEE) no 3035/80 établissant, pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l' annexe II du traité, les règles
    générales relatives à l' octroi des restitutions à l' exportation et les critères
    de fixation de leur montant
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1982/85 des Rates vom 16. Juli 1985 zur Änderung
    der Verordnung (EWG) Nr. 3035/80 zur Festlegung der allgemeinen Regeln für die
    Gewährung von Ausfuhrerstattungen und der Kriterien zur Festsetzung des Erstattungsbetrags
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrages fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1982/85 af 16. juli 1985 om ændring af forordning
    (EØF) nr. 3035/80 om fastsættelse af almindelige regler for ydelse af eksportrestitutioner
    og om fastlæggelse af kriterierne for fastsættelse af restitutionsbeløbet for
    visse landbrugsprodukter, der udførees i form af varer, som ikke omfattes af
    traktatens bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1982/85 του Συμβουλίου
    της 16ης Ιουλίου 1985 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3035/80 περί καθορισμού
    των γενικών κανόνων που αφορούν τη χορήγηση
    επιστροφών κατά την εξαγωγή και των κριτηρίων
    καθορισμού του ύψους αυτών, για ορισμένα γεωργικά
    προϊόντα εξαγόμενα υπό μορφή εμπορευμάτων
    μη υπαγομένων στο παράρτημα ΙΙ της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1982/85 del Consiglio del 16 luglio 1985 che modifica
    il regolamento (CEE) n. 3035/80 che stabilisce, per taluni prodotti agricoli esportati
    sotto forma di merci non comprese nell' allegato II del trattato, le regole generali
    relative alla concessione delle restituzioni all' esportazione e i criteri per
    stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1982/85 van de Raad van 16 juli 1985 tot wijziging
    van Verordening (EEG) nr. 3035/80 tot vaststelling van de algemene regels aangaande
    de toekenning van restituties bij uitvoer en de criteria voor de vaststelling
    van het restitutiebedrag betreffende bepaalde landbouwprodukten, uitgevoerd in
    de vorm van goederen die niet onder bijlage II van het Verdrag vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1982/85 do Conselho, de 16 de Julho de 1985, que
    altera o Regulamento (CEE) n.° 3035/80 que estabelece em relação a certos produtos
    agrícolas exportados sob a forma de mercadorias não abrangidas pelo Anexo II
    do Tratado as regras gerais relativas à concessão das restituições à exportação
    e os critérios para a fixação do seu montante
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1982/85 del Consejo, de 16 de julio de 1985, por el
    que se modifica el Reglamento (CEE) n° 3035/80 que establece las normas generales
    relativas a la concesión de restituciones a la exportación y los criterios de
    fijación de sus importes, para determinados productos agrícolas exportados en
    forma de mercancías no incluidas en el Anexo II del Tratado
  type: main
