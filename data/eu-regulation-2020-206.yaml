title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/206 of 14 February 2020 authorising
    the placing on the market of fruit pulp, pulp juice, concentrated pulp juice from
    Theobroma cacao L. as a traditional food from a third country under Regulation
    (EU) 2015/2283 of the European Parliament and of the Council and amending Implementing
    Regulation (EU) 2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/206 de la Commission du 14 février
    2020 autorisant la mise sur le marché de la pulpe de cacao (Theobroma cacao L.),
    de son jus et de son jus concentré en tant qu’aliment traditionnel en provenance
    d’un pays tiers en vertu du règlement (UE) 2015/2283 du Parlement européen
    et du Conseil et modifiant le règlement d’exécution (UE) 2017/2470
  type: main
- language: de
  script: Latn
