    e del succo concentrato di polpa del frutto di Theobroma cacao L. quale alimento
    tradizionale da un paese terzo a norma del regolamento (UE) 2015/2283 del Parlamento
    europeo e del Consiglio e che modifica il regolamento di esecuzione (UE) 2017/2470
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas Regula (ES) 2020/206 (2020. gada 14. februāris),
