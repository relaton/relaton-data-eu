title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2527/78 of 27 October 1978 re-establishing
    the levying of the customs duties on other articles of iron or steel, falling
    within heading No 73.40, originating in Hong Kong, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2527/78 de la Commission, du 27 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres ouvrages
    en fonte, fer ou acier, de la position tarifaire 73.40, originaires de Hong-kong,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2527/78 der Kommission vom 27. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr andere Waren aus Eisen und Stahl der Tarifnummer 73.40, mit
    Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen
    Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2527/78 af 27. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for andre varer af jern og stål, under position
    73.40, som har oprindelse i Hongkong, og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2527/78 della Commissione, del 27 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli altri lavori di ghisa,
    di ferro o di acciaio, della voce 73.40 della tariffa doganale comue, originari
    di Hong Kong, beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2527/78 van de Commissie van 27 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere werken
    van gietijzer, van ijzer of van staal, van post 73.40, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
