title:
- language: en
  script: Latn
  content: '78/916/EEC: Commission Decision of 19 October 1978 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to under garments falling within heading Nos 61.03
    and 61.04 of the Common Customs Tariff originating in Hungary and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/916/CEE: Décision de la Commission, du 19 octobre 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vêtements de dessous (linge de corps)
    des positions 61.03 et 61.04 du tarif douanier commun, originaires de Hongrie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/916/EWG: Entscheidung der Kommission vom 19. Oktober 1978, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Ungarn stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung (Leibwäsche) der Tarifnummern 61.03
    und 61.04 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/916/EØF: Kommissionens beslutning af 19. oktober 1978 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage underbeklædningsgenstande, som henhører
    under pos. 61.03 og 61.04 i den fælles toldtarif, har oprindelse i Ungarn og
    frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/916/CEE: Decisione della Commissione, del 19 ottobre 1978, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le sottovesti (biancheria da dosso),
    delle voci 61.03 e 61.04 della tariffa doganale comune, originarie dell'' Ungheria
    e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/916/EEG: Beschikking van de Commissie van 19 oktober 1978 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd onderkleding van de posten 61.03 en 61.04 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hongarije en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
