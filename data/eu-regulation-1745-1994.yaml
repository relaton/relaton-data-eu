    στον οποίο μπορούν να γίνουν αποδεκτές οι αιτήσεις
    για άδειες εισαγωγής που υποβλήθηκαν στο πλαίσιο
    της ετήσιας ποσόστωσης τυριών που άνοιξε από
    την Κοινότητα στη Σουηδία
  type: main
