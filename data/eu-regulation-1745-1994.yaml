  content: Commission Regulation (EC) No 1745/94 of 15 July 1994 determining the extent
    to which applications for import licences introduced under the annual cheese quota
    opened by the Community to Sweden may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1745/94 de la Commission, du 15 juillet 1994, déterminant
