    le cadre d'un contingent annuel de fromages ouvert par la Communauté à la Suède
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1745/94 der Kommission vom 15. Juli 1994 zur Genehmigung
