title:
- language: en
  script: Latn
  content: '73/55/EEC: Commission Decision of 9 March 1973 amending the Commission
    Decision of 12 May 1971 empowering Member States to take interim protective measures
    with regard to the importation of certain products originating in third countries
    and put into free circulation in other Member States'
  type: main
- language: fr
  script: Latn
  content: '73/55/CEE: Décision de la Commission, du 9 mars 1973, modifiant sa décision
    du 12 mai 1971 autorisant les États membres à prendre des mesures de protection
    conservatoires à l'' égard de l'' importation de certains produits originaires
    de pays tiers et mis en libre pratique dans un autre État membre'
  type: main
- language: de
  script: Latn
  content: '73/55/EWG: Entscheidung der Kommission vom 9. März 1973 zur Änderung
    ihrer Entscheidung vom 12. Mai 1971, mit der die Mitgliedstaaten ermächtigt wurden,
    Sicherungsmaßnahmen bei der Einfuhr aus dritten Ländern stammender und in einem
    anderen Mitgliedstaat im freien Verkehr befindlicher Waren zu treffen'
  type: main
- language: da
  script: Latn
  content: '73/55/EØF: Kommissionens Beslutning af 9. marts 1973 om ændring af dens
    beslutning af 12. maj 1971 ved hvilken medlemslandene bemyndiges til at træffe
    foreløbige beskyttelsesforanstaltninger ved indførslen af visse fra tredjelande
    hidrørende varer, der er i fri omsætning i en anden medlemsstat'
  type: main
- language: el
  script: Grek
  content: '73/55/ΕΟΚ: Απόφαση τής Επιτροπής τής 9ης Μαρτίου
    1973 περί τροποποιήσεως τής αποφάσεώς της τής
    12ης Μαΐου «περί εξουσιοδοτήσεως τών Κρατών
    μελών νά λαμβάνουν συντηρητικά μέτρα προστασίας
    κατά τής εισαγωγής ορισμένων προϊόντων πού
    κατάγονται από τρίτες χώρες καί έχουν τεθεί
    σέ ελεύθερη κυκλοφορία σέ άλλο Κράτος μέλος»'
  type: main
- language: it
  script: Latn
  content: '73/55/CEE: Decisione della Commissione, del 9 marzo 1973, recante modifica
    della decisione del 12 maggio 1971 che autorizza gli Stati membri a prendere misure
    conservative di difesa nei contronti dell'' importazione di certi prodotti originari
    dei paesi terzi e immessi in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '73/55/EEG: Beschikking van de Commissie van 9 maart 1973 houdende wijziging
    van de beschikking van 12 mei 1971 waarbij de Lid-Staten worden gemachtigd beschermende
    maatregelen te treffen ten aanzien van de invoer van bepaalde produkten van oorsprong
    uit derde landen die in een andere Lid-Staat in het vrije verkeer worden gebracht'
  type: main
