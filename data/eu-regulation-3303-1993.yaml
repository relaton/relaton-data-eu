    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3303/93 DELLA COMMISSIONE del 30 novembre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 8712 00 originari dell' Indonesia e della Tailandia, beneficiarie delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3831/90
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3303/93 VAN DE COMMISSIE van 30 november 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 8712 00, van oorsprong uit Indonesië en Thailand, waarvoor de in
    Verordening (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
