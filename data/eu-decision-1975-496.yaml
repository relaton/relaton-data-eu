---
id: EUDecision1975496
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 June 1975 authorizing the Italian Republic not
    to apply Community treatment to footwear with outer soles of leather or composition
    leather; footwear (other than footwear falling within heading No 64.01) with outer
    soles of rubber or artificial plastic material falling within heading No 64.02
    of the Common Customs Tariff, originating in the Chinese People's Republic and
    in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/496/CEE: Décision de la Commission, du 19 juin 1975, autorisant la
    République italienne à exclure du traitement communautaire les chaussures à
    semelles extérieures en cuir naturel, artificiel ou reconstitué ; les chaussures
    (autres que celles de la position 64.01) à semelles extérieures en caoutchouc
    ou en matière plastique artificielle, de la position 64.02 du Tarif douanier
    commun, originaires de la République populaire de Chine et mises en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. Juni 1975, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Schuhe mit Laufsohlen aus Leder
    oder Kunstleder; Schuhe mit Laufsohlen aus Kautschuk oder Kunststoff (ausgenommen
    Schuhe der Tarifnummer 64.01) der Tarifnummer 64.02 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. juni 1975 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage fodtøj med ydersål af læder
    eller kunstlæder; fodtøj (bortset fra fodtøj henhørende under pos. 64.01)
    med ydersål af gummi eller plast, som henhører under pos. 64.02 i den fælles
    toldtarif, har oprindelse i folkerepublikken Kina, og frit kan omsættes i de
    andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 giugno 1975, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario le calzature con suole esterne
    di cuoio naturale, artificiale o ricostituito; calzature (non comprese nella voce
    64.01) con suole esterne di gomma o di materia plastica artificiale, della voce
    64.02 della tariffa doganale comune, originarie della Repubblica popolare cinese
    e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 juni 1975 waarbij de Italiaanse Republiek
    wordt gemachtigd schoeisel met buitenzool van leder of van kunstleder en schoeisel
    (ander dan dit bedoeld bij post 64.01), met buitenzool van rubber of van kunstmatige
    plastische stof van post 64.02 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
