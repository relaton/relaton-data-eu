title:
- language: fr
  script: Latn
  content: Décision de la Commission prorogeant la décision de la Commission du
    16 octobre 1962, autorisant le Royaume de Belgique à suspendre temporairement
    les importations de raisins de table en provenance des États membres, classés
    dans la catégorie de qualité "extra"
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission betreffend die Verlängerung der Entscheidung
    der Kommission vom 16. Oktober 1962, mit der das Königreich Belgien ermächtigt
    wurde, die Einfuhr von Tafeltrauben der Klasse "extra" aus den Mitgliedstaaten
    vorübergehend auszusetzen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa alla proroga della decisione della
    Commissione del 16 ottobre 1962, che autorizza il Regno del Belgio a sospendere
    temporaneamente le importazioni di uve da tavola in provenienza dagli Stati membri,
    classificate nella categoria di qualità «extra»
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie houdende verlenging van de beschikking van
    de Commissie van 16 oktober 1962 houdende machtiging van het Koninkrijk België
    om de invoer van tafeldruiven, afkomstig uit de Lid-Staten en ingedeeld in de
    kwaliteitsklasse "extra", tijdelijk te schorsen
  type: main
