title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1964/75 of the Commission of 29 July 1975 determining
    the amounts applicable as accession compensatory amounts during the month of August
    1975 to certain cereal and rice products exported in the form of goods not covered
    by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1964/75 de la Commission, du 29 juillet 1975, déterminant
    les montants applicables à titre de montants compensatoires adhésion pendant
    le mois d'août 1975 à certains produits des secteurs des céréales et du riz
    exportés sous forme de marchandises ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1964/75 der Kommission vom 29. Juli 1975 zur Festsetzung
    der im August 1975 als Beitrittsausgleichsbeträge geltenden Beträge für bestimmte
    Getreide- und Reiserzeugnisse, die in Form von nicht unter Anhang II des Vertrages
    fallenden Waren ausgeführt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1964/75 af 29. juli 1975 om fastsættelse
    af de beløb, der fra 1. august 1975 skal anvendes som tiltrædelsesudligningsbeløb
    for visse produkter fra korn- og rissektoren, der udføres i form af varer, som
    ikke omfattes af traktatens bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1964/75 della Commissione, del 29 luglio 1975, che
    determina gli importi compensativi «adesione» applicabili, durante il mese di
    agosto 1975, a taluni prodotti dei settori dei cereali e del riso esportati sotto
    forma di merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1964/75 van de Commissie van 29 juli 1975 houdende
    vaststelling van de bedragen die gedurende de maand augustus 1975 als compenserende
    bedragen "toetreding" moeten worden toegepast voor bepaalde produkten van de sector
    granen en de sector rijst, uitgevoerd in de vorm van niet onder bijlage II van
    het Verdrag vallende goederen
  type: main
