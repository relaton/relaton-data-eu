title:
- language: fr
  script: Latn
  content: Règlement n° 742/67/CEE du Conseil, du 24 octobre 1967, créant les sélections
    spéciales I et II du FEOGA relatives aux mesures de compensation communautaires
    en faveur de l'Allemagne, de l'Italie et du Luxembourg, et au versement d'un montant
    de 4 millions d'unités de compte en faveur du Luxembourg
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 742/67/EWG des Rates vom 24. Oktober 1967 über die Bildung
    der Sonderabteilungen I und II des Europäischen Ausrichtungs- und Garantiefonds
    für die Landwirtschaft für gemeinschaftliche Ausgleichsmaßnahmen zugunsten
    Deutschlands, Italiens und Luxemburgs sowie für die Zahlung eines Betrages von
    4 Millionen Rechnungseinheiten an Luxemburg
  type: main
- language: it
  script: Latn
  content: Regolamento n. 742/67/CEE del Consiglio, del 24 ottobre 1967, che istituisce
    le sezioni speciali I e II del Fondo europeo agricolo di orientamento e di garanzia
    relative alle misure di compensazioni comunitarie a favore della Germania, dell'Italia
    e del Lussemburgo ed al versamento di un importo di 4 milioni di unità di conto
    a favore del Lussemburgo
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 742/67/EEG van de Raad van 24 oktober 1967 houdende instelling
    van de speciale afdelingen I en II van het Europees Oriëntatie- en Garantiefonds
    voor de Landbouw met betrekking tot de maatregelen voor communautaire compensaties
    ten gunste van Duitsland, Italië en Luxemburg en met betrekking tot de uitkering
    van een bedrag van 4 miljoen rekeneenheden ten gunste van Luxemburg
  type: main
