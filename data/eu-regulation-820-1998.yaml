    presentate nel mese di aprile 1998 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 820/98 van de Commissie van 17 april 1998 tot vaststelling
