title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 820/98 of 17 April 1998 laying down to what
    extent applications for issue of export licences submitted during April 1998 for
    beef and veal products which may benefit from special import treatment in Canada
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 820/98 de la Commission du 17 avril 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 1998 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation au Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 820/98 der Kommission vom 17. April 1998 über das
    Ausmaß, in dem den im April 1998 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 820/98 af 17. april 1998 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    april 1998 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    Canada, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 820/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 17ης Απριλίου 1998 για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Απρίλιο 1998 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 820/98, annettu 17 päivänä huhtikuuta 1998,
