title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 128/92 of 21 January 1992 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing under an aid programme organized by a Member State and repealing
    Regulation (EEC) No 2857/90
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 128/92 de la Commission, du 21 janvier 1992, relatif
    à la vente à prix fixé forfaitairement à l'avance, en vue de leur transformation
    dans le cadre d'un programme d'aide organisé par un État membre, de certaines
    viandes bovines provenant des stocks d'intervention et abrogeant le règlement
    (CEE) n° 2857/90
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 128/92 der Kommission vom 21. Januar 1992 über den
    Verkauf von bestimmtem Rindfleisch aus Interventionsbeständen zu pauschal im
    voraus festgesetzten Preisen zur Verarbeitung im Rahmen eines einzelstaatlichen
    Hilfsprogramms und zur Aufhebung der Verordnung (EWG) Nr. 2857/90
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 128/92 af 21. januar 1992 om salg til
    forudfastsat pris af visse former for oksekød fra interventionslagre med henblik
    på forarbejdning som led i et af en medlemsstat tilrettelagt støtteprogram og
    om ophævelse af forordning (EØF) nr. 2857/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 128/92 της Επιτροπής
    της 21ης Ιανουαρίου 1992 σχετικά με την πώληση
    σε προκαθορισμένη κατ’αποκοπή τιμή με σκοπό
    τη μεταποίησή τους στα πλαίσια προγράμματος
    ενίσχυσης που οργανώνεται από ένα κράτος μέλος,
    ορισμένων βοείων κρεάτων που προέρχονται από
    τα αποθέματα της παρέμβασης και την κατάργηση
    του κανονισμού (ΕΟΚ) αριθ. 2857/90
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 128/92 della Commissione, del 21 gennaio 1992, relativo
    alla vendita, a prezzi fissati forfettariamente in anticipo, di talune carni bovine
    provenienti dalle scorte di intervento, destinate alla trasformazione nell'ambito
    di un programma di aiuto organizzato da uno Stato membro e recante abrogazione
    del regolamento (CEE) n. 2857/90
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 128/92 van de Commissie van 21 januari 1992 inzake
    de verkoop, tegen vooraf forfaitair vastgestelde prijzen, van rundvlees uit interventievoorraden
    voor verwerking in het kader van een door een Lid-Staat opgezet voedselhulpprogramma
    en houdende intrekking van Verordening (EEG) nr. 2857/90
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 128/92 da Comissão, de 21 de Janeiro de 1992, relativo
    à venda a preço fixado forfetária e antecipadamente, com vista à transformação,
    no âmbito de um programa de auxílio organizado por um Estado-membro, de determinadas
    carnes de bovino provenientes das existências de intervenção e que revoga o
    Regulamento (CEE) nº 2857/90
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 128/92 de la Comisión, de 21 de enero de 1992, relativo
    a la venta, a precio fijado a tanto alzado anticipado, de determinadas carnes
    de vacuno procedentes de las existencias de intervención, para su posterior transformación,
    en el marco de los programas de ayuda organizados por un Estado miembro y por
    el que se deroga el Reglamento (CEE) nº 2857/90
  type: main
