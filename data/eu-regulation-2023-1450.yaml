title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1450 of 13 July 2023 imposing
    a definitive anti-dumping duty on imports of certain seamless pipes and tubes
    of iron (other than cast iron) or steel (other than stainless steel), of circular
    cross-section, of an external diameter exceeding 406,4 mm, originating in the
    People’s Republic of China following an expiry review pursuant to Article 11(2)
    of Regulation (EU) 2016/1036 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1450 de la Commission du 13 juillet
    2023 instituant un droit antidumping définitif sur les importations de certains
    tubes et tuyaux sans soudure en fer (à l’exclusion de la fonte) ou en acier
    (à l’exclusion de l’acier inoxydable), de section circulaire et d’un diamètre
    extérieur excédant 406,4 mm, originaires de la République populaire de Chine
    à l’issue d’un réexamen au titre de l’expiration des mesures mené conformément
    à l’article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen
    et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/1450 der Kommission vom 13. Juli 2023
