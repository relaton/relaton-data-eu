    nahtloser Rohre aus Eisen (ausgenommen aus Gusseisen) oder Stahl (ausgenommen
    aus nichtrostendem Stahl) mit kreisförmigem Querschnitt und einem Außendurchmesser
    von mehr als 406,4 mm mit Ursprung in der Volksrepublik China im Anschluss an
    eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036
    des Europäischen Parlaments und des Rates
  type: main
