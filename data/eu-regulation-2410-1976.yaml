title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2410/76 of 4 October 1976 re-establishing
    the levying of the customs duties on electrical capacitors, fixed or variable,
    falling within heading No 85.18, originating in South Korea, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2410/76 de la Commission, du 4 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux condesateurs
    électriques, fixés, variables ou ajustables, de la position tarifaire 85.18,
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2410/76 der Kommission vom 4. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für elektrische Festkondensatoren und andere einstellbare Kondensatoren
    der Tarifnummer 85.18 mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2410/76 af 4. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under position 85.18, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2410/76 della Commissione, del 4 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce doganale 85.18, originari della Corea
    del Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2410/76 van de Commissie van 4 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren), van post 85.18, van oorsprong uit Zuid-Korea, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
