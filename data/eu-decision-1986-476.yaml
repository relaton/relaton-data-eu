title:
- language: en
  script: Latn
  content: '86/476/EEC: Commission Decision of 6 August 1986 authorizing the Kingdom
    of Spain to introduce intra- Community surveillance of imports of products originating
    in certain third countries which have been put into free circulation in one of
    the Member States and which may be the subject of protective measures under Article
    115 of the Treaty (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/476/CEE: Décision de la Commission du 6 août 1986 autorisant le Royaume
    d''Espagne à instaurer une surveillance intracommunautaire des importations des
    produits originaires de certains pays tiers mis en libre pratique dans un des
    États membres, susceptibles de faire l''objet de mesures de protection au titre
    de l''article 115 du traité (Le texte en langue espagnole est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '86/476/EWG: Entscheidung der Kommission vom 6. August 1986 zur Ermächtigung
    des Königreichs Spanien zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Drittländern stammenden und in einem der Mitgliedstaaten
    im zollrechtlich freien Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß
    Artikel 115 des Vertrages unterworfen werden können (Nur der spanische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/476/EØF: Kommissionens beslutning af 6. august 1986 om bemyndigelse
    af kongeriget Spanien til at indføre tilsyn inden for Fællesskabet med indførslen
    af varer, der har oprindelse i visse tredjelande og er overgået til fri omsætning
    i en af medlemsstaterne, og som kan gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115 (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/476/ΕΟΚ: Απόφαση της Επιτροπής της 6ης Αυγούστου
    1986 περί χορηγήσεως αδείας στο Βασίλειο της
    Ισπανίας να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών προϊόντων, καταγωγής τρίτων
    χωρών, τα οποία τίθενται σε ελεύθερη κυκλοφορία
    σ ένα κράτος μέλος και τα οποία μπορούν να αποτελέσουν
    αντικείμενο των μέτρων προστασίας, δυνάμει
    του άρθρου 115 της συνθήκης (Το κείμενο στην
    ισπανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/476/CEE: Decisione della Commissione del 6 agosto 1986 che autorizza
    il Regno di Spagna ad istituire una sorveglianza intracomunitaria sulle importazioni
    dei prodotti originari di taluni paesi terzi e immessi in libera pratica in uno
    degli Stati membri, che possono essere oggetto di misure di salvaguardia ai sensi
    dell''articolo 115 del trattato (Il testo in lingua spagnola è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '86/476/EEG: Beschikking van de Commissie van 6 augustus 1986 waarbij het
    Koninkrijk Spanje wordt gemachtigd de invoer van produkten van oorsprong uit bepaalde
    derde landen die in een Lid-Staat in het vrije verkeer zijn gebracht en die het
    voorwerp kunnen vormen van beschermende maatregelen krachtens artikel 115 van
    het Verdrag, onder intracommunautair toezicht te plaatsen (Slechts de tekst in
    de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '86/476/CEE: Decisão da Comissão de 6 de Agosto de 1986 que autoriza
    o Reino de Espanha a instaurar uma vigilância intracomunitária das importações
    dos produtos originários de certos países terceiros introduzidos em livre prática
    num dos Estados-membros e susceptíveis de serem objecto de medidas de protecção
    a título do artigo 115 do Tratado. (Apenas faz fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '86/476/CEE: Decisión de la Comisión de 6 de agosto de 1986 por la que
    se autoriza al Reino de España a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de productos originarios de determinados terceros
    países despachados a libre práctica en uno de los Estados miembros, que puedan
    ser objeto de medidas de protección en virtud de lo dispuesto en el artículo
    115 del tratado (El texto en lengua española es el único auténtico)'
  type: main
