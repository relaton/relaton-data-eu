id: EUDecision1978403
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 March 1978 authorizing the United Kingdom not
    to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, coated with vinyl, falling within heading No ex 60.02
    of the Common Customs Tariff, originating in South Korea and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/403/CEE: Décision de la Commission, du 17 mars 1978, autorisant le
    Royaume-Uni à exclure du traitement communautaire les gants de bonneterie non
    élastique ni caoutchoutée enduits de vinyle, de la position Ex 60.02 du Tarif
    douanier commun, originaires de la Corée du Sud et mis en libre pratique dans
    les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. März 1978, mit der das Vereinigte
    Königreich ermächtigt wird, aus Südkorea stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastische noch
    kautschutiert, bestrichen mit Vinyl, der Tarifnummer ex 60.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. marts 1978 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, overtrukket med vinyl, som henhører
    under pos. ex 60.02 i den fælles toldtarif, har oprindelse i Sydkorea og frit
    kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 marzo 1978, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario guanti a maglia non elastica né
    gommata, impregnata di vinyl, della voce ex 60.02 della tariffa doganale comune,
    originari della Corea del Sud e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 maart 1978 waarbij het Verenigd Koninkrijk
    gemachtigd wordt handschoenen, wanten en dergelijke artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, met een deklaag van vinyl, van post
    ex 60.02 van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
