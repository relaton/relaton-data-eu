title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1467/2004 of 13 August 2004 imposing a definitive
    anti-dumping duty and collecting definitively the provisional duty imposed on
    imports of polyethylene terephthalate originating in Australia, the People's Republic
    of China and terminating the anti-dumping proceeding concerning imports of polyethylene
    terephthalate originating in Pakistan and releasing the amounts secured by way
    of the provisional duties imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1467/2004 du Conseil du 13 août 2004 instituant un
    droit antidumping définitif et portant perception définitive du droit provisoire
    institué sur les importations de polyéthylène téréphtalate originaire d’Australie
    et de la République populaire de Chine, clôturant la procédure antidumping
    concernant les importations de polyéthylène téréphtalate originaire du Pakistan
    et libérant les montants déposés au titre du droit provisoire institué
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1467/2004 des Rates vom 13. August 2004 zur Einführung
