  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1467/2004 van de Raad van 13 augustus 2004 tot instelling
    van een definitief antidumpingrecht en tot definitieve inning van het voorlopige
    antidumpingrecht op polyethyleentereftalaat uit Australië en de Volksrepubliek
    China alsmede tot beëindiging van de procedure betreffende polyethyleentereftalaat
    uit Pakistan en de vrijgave van de bedragen die uit hoofde van het voorlopige
    recht als zekerheid waren gesteld
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1467/2004 z dnia 13 sierpnia 2004 r. dotyczące
    nałożenia ostatecznego cła antydumpingowego i ostatecznego pobrania kwoty cła
    tymczasowego nałożonego na przywóz tereftalanu polietylenu pochodzącego z
    Australii i Chińskiej Republiki Ludowej oraz zakończenia postępowania antydumpingowego
    w sprawie przywozu tereftalanu polietylenu pochodzącego z Pakistanu oraz zwolnienia
    kwot zabezpieczonych z tytułu nałożenia tymczasowych opłat celnych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1467/2004 do Conselho, de 13 de Agosto de 2004, que
    cria um direito anti-dumping definitivo e cobra a título definitivo o direito
    provisório criado sobre as importações de tereftalato de polietileno originário
    da Austrália e da República Popular da China e que encerra o processo anti-dumping
    relativo às importações de tereftalato de polietileno originário do Paquistão
    e libera os montantes garantes do direito provisório criado
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1467/2004 al Consiliului din 13 august 2004 de instituire
    a unui drept antidumping definitiv și de percepere definitivă a dreptului provizoriu
    instituit pentru importurile de polietilenă tereftalată originară din Australia
    și din Republica Populară Chineză, de încheiere a procedurii antidumping privind
    importurile de polietilenă tereftalată originară din Pakistan și de eliberare
    a sumelor depuse cu titlul de drept provizoriu instituit
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1467/2004 z 13. augusta 2004, ktorým sa zavádzajú
    konečné antidumpingové clá a ktorým sa začnú s konečnou platnosťou vyberať
    predbežné clá zavedené na dovezený tovar z polyetylén tereftalátu s pôvodom
    v Austrálii, Čínskej ľudovej republike a ktorým sa ruší antidumpingové
    konanie, ktoré sa vzťahuje na dovezený tovar z polyetylén tereftalátu s pôvodom
    v Pakistane, a ktorým sa uvoľnia sumy zaistené prostredníctvom zavedených
    predbežných ciel
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1467/2004 z dne 13. avgusta 2004 o uvedbi dokončnih
    protidampinških dajatev in dokončnem pobiranju začasnih dajatev uvedenih za
    uvoz polietilentereftalata s poreklom iz Avstralije, Ljudske republike Kitajske
    ter o prenehanju protidampinškega postopka glede uvoza polietilentereftalata
    s poreklom iz Pakistana in sprostitvi zneskov, zavarovanih z začasnimi dajatvami
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1467/2004 del Consejo, de 13 de agosto de 2004, por
    el que se establece un derecho antidumping definitivo y se percibe definitivamente
    el derecho provisional establecido sobre las importaciones de poli(tereftalato
    de etileno) originarias de Australia y la República Popular China y por el que
    se concluye el procedimiento antidumping relativo a las importaciones de poli(tereftalato
    de etileno) originarias de Pakistán y se liberan los importes garantizados mediante
    los derechos provisionales establecidos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1467/2004 av den 13 augusti 2004 om införande
    av en slutgiltig antidumpningstull och om slutgiltigt uttag av den preliminära
    tull som införts på import av polyetentereftalat med ursprung i Australien eller
    Folkrepubliken Kina samt om avslutande av antidumpningsförfarandet rörande import
    av polyetentereftalat med ursprung i Islamiska republiken Pakistan och om frisläppande
    av de belopp för vilka säkerhet ställts i form av preliminär tull
