  script: Latn
  content: Neuvoston asetus (EY) N:o 1467/2004, annettu 13 päivänä elokuuta 2004,
    lopullisen polkumyyntitullin käyttöönotosta Australiasta ja Kiinan kansantasavallasta
    peräisin olevan polyeteenitereftalaatin tuonnissa ja siinä käyttöön otetun
    väliaikaisen tullin lopullisesta kantamisesta, Pakistanista peräisin olevan
    polyeteenitereftalaatin tuontia koskevan polkumyyntimenettelyn päättämisestä
    sekä käyttöön otetun väliaikaisen tullin vakuutena olevien määrien vapauttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1467/2004/EK rendelete (2004. augusztus 13.) az Ausztráliából
    és a Kínai Népköztársaságból származó polietilén-tereftalát behozatalára
    végleges dömpingellenes vám kivetéséről és az ideiglenesen kivetett vám
    végleges beszedéséről, valamint a Pakisztánból származó polietilén-tereftalát
    behozatalára vonatkozó dömpingellenes eljárás megszüntetéséről és a
    kivetett ideiglenes vámokkal biztosított összegek felszabadításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1467/2004 del Consiglio, del 13 agosto 2004, che istituisce
    un dazio antidumping definitivo e dispone la riscossione definitiva dei dazi provvisori
    istituiti sulle importazioni di polietilentereftalato originario dell'Australia
    e della Repubblica popolare cinese, chiude il procedimento antidumping nei confronti
    delle importazioni di polietilentereftalato originario del Pakistan e libera gli
    importi depositati a titolo di dazio provvisorio
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1467/2004 (2004. gada 13. augusts), ar ko piemēro
    galīgo antidempinga maksājumu un galīgi iekasē uzlikto pagaidu maksājumu
    attiecībā uz Austrālijas un Ķīnas Tautas Republikas izcelsmes polietilēntereftalāta
    importu, kā arī izbeidz antidempinga procedūru attiecībā uz Pakistānas izcelsmes
    polietilēntereftalāta importu un atmaksā summas, kuras nodrošinātas ar pagaidu
    maksājumiem
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugpjūčio 13 d. Tarybos reglamentas (EB) Nr. 1467/2004, dėl
    galutinio antidempingo muito nustatymo, laikinojo muito, taikomo Australijos ir
    Kinijos Liaudies Respublikos kilmės polietileno tereftalato importui, galutinio
    surinkimo, Pakistano kilmės polietileno tereftalato importui taikomos antidempingo
    procedūros nutraukimo ir nustatytais laikinais muitais garantuotų sumų grąžinimo
  type: main
