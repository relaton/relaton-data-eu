    Antidumpingzolls auf die Einfuhren von Polyethylenterephthalat mit Ursprung in
    Australien und der Volksrepublik China sowie zur Einstellung des Antidumpingverfahrens
    betreffend die Einfuhren von Polyethylenterephthalat mit Ursprung in Pakistan
    und zur Freigabe der Sicherheitsleistungen für die vorläufigen Zölle
  type: main
