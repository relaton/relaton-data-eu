title:
- language: en
  script: Latn
  content: '82/607/EEC: Council Decision of 28 July 1982 concerning the coordination
    of the actions of the Member States and the Commission related to activities preparatory
    to a long-term programme for the use of telematics for Community information systems
    concerned with imports/exports and the management and financial control of agricultural
    market organizations'
  type: main
- language: fr
  script: Latn
  content: '82/607/CEE: Décision du Conseil, du 28 juillet 1982, concernant la coordination
    des actions des États membres et de la Commission relatives à des activités
    préliminaires à un programme à long terme portant sur l'' utilisation de la
    télématique dans les systèmes communautaires d'' information sur les exportations
    et les importations ainsi que sur la gestion et le contrôle financier des organisations
    du marché agricole'
  type: main
- language: de
  script: Latn
  content: '82/607/EWG: Beschluß des Rates vom 28. Juli 1982 zur Koordinierung der
    Maßnahmen der Mitgliedstaaten und der Kommission zur Vorbereitung eines langfristigen
    Programms über die Anwendung der Telematik in den Informationssystemen der Gemeinschaft
    für die Ein- und Ausfuhren sowie die Verwaltung und die Finanzkontrolle der Marktorganisation
    für verschiedene Agrarerzeugnisse'
  type: main
- language: da
  script: Latn
  content: '82/607/EØF: Rådets afgørelse af 28. juli 1982 om koordination af medlemsstaternes
    og Kommissionens aktioner i forbindelse med forberedelserne til et langtidsprogram
    for anvendelsen af telematik til fællesskabsinformationssystemer vedrørende
    indførsel og udførsel samt forvaltning af og den finansielle kontrol med markedsordningerne
    for landbrugsvarer'
  type: main
- language: el
  script: Grek
  content: '82/607/EOK: Απόφαση τού Συμβουλίου τής 28ης Ιουλίου
    1982 γιά τό συντονισμό τών ενεργειών τών Κρατών
    μελών καί τής Επιτροπής σχετικά μέ τίς προκαταρκτικές
    δραστηριότητες γιά μακροπρόθεσμο πρόγραμμα
    πού αφορά τή χρησιμοποίηση τής τηλεματικής
    στά κοινοτικά συστήματα πληροφόρησς σκετικά
    μέ τίς εξαγωγές καί τίς εισαγωγές, καθώς καί
    τή διαχείριση καί τό δημοσιονομικό έλεγχο
    τών οργανώσεων τής γεωργικής αγοράς'
  type: main
- language: it
  script: Latn
  content: '82/607/CEE: Decisione del Consiglio, del 28 luglio 1982, in merito al
    coordinamento delle azioni degli Stati membri e della Commissione concernenti
    la preparazione di un programma a lungo termine di impiego della telematica nei
    sistemi d'' informazione comunitari sulle importazioni/esportazioni e sulla gestione
    ed il controllo finanziario delle organizzazioni del mercato agricolo'
  type: main
- language: nl
  script: Latn
  content: '82/607/EEG: Besluit van de Raad van 28 juli 1982 inzake de coórdinatie
    van de maatregelen van de Lid-Staten en van de Commissie met betrekking tot de
    werkzaamheden ter voorbereiding van een programma op lange termijn inzake het
    gebruik van telematica voor de communautaire informatiesystemen betreffende in-
    en uitvoer en het beheer en de financiële controle van landbouwmarktorganisaties'
  type: main
- language: pt
  script: Latn
  content: '82/607/CEE: Decisão do Conselho, de 28 de Julho de 1982, relativa à
