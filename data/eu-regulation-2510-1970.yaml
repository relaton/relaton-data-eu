title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2510/70 de la Commission, du 11 décembre 1970, fixant
    pour la campagne 1970/1971, le prix d'achat minimum des oranges livrées à l'industrie
    et le montant de la compensation financière après transformation de ces oranges
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2510/70 der Kommission vom 11. Dezember 1970 zur Festsetzung
    des Mindestankaufspreises für an die Industrie gelieferte Apfelsinen und des
    finanziellen Ausgleichs nach der Verarbeitung dieser Apfelsinen für das Wirtschaftsjahr
    1970/1971
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2510/70 della Commissione, dell'11 dicembre 1970,
    che fissa per la campagna 1970/1971 il prezzo minimo d'acquisto delle arance consegnate
    all'industria e l'importo della compensazione finanziaria dopo la trasformazione
    di tali arance
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2510/70 van de Commissie van 11 december 1970 houdende
    vaststelling voor het verkoopseizoen 1970/1971 van de minimumprijs van sinaasappelen
    bij levering aan de industrie en het bedrag van de financiële vergoeding bij
    de verwerking hiervan
