title:
- language: en
  script: Latn
  content: '96/569/EC: Council Decision of 24 September 1996 on the conclusion of
    the Agreement in the form of an Exchange of Letters concerning the provisional
    application of the Protocol defining for the period from 3 May 1996 to 2 May 1999
    the fishing opportunities and the financial compensation provided for by the Agreement
    between the European Economic Community and the Government of the People''s Republic
    of Angola on fishing off the coast of Angola'
  type: main
- language: fr
  script: Latn
  content: '96/569/CE: Décision du Conseil du 24 septembre 1996 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République populaire d''Angola sur la pêche au large de l''Angola pour
    la période du 3 mai 1996 au 2 mai 1999'
  type: main
- language: de
  script: Latn
  content: '96/569/EG: Beschluß des Rates vom 24. September 1996 über den Abschluß
    des Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des
    Protokolls zur Festlegung der Fangmöglichkeiten und des finanziellen Ausgleichs
    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Volksrepublik Angola über die Fischerei vor der Küste Angolas für die Zeit
    vom 3. Mai 1996 bis zum 2. Mai 1999'
  type: main
- language: da
  script: Latn
  content: '96/569/EF: Rådets Afgørelse af 24. september 1996 om indgåelse af aftalen
