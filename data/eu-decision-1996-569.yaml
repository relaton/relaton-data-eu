    for perioden 3. maj 1996 til 2. maj 1999 af de fiskerimuligheder og det finansielle
    bidrag, der er omhandlet i aftalen mellem Det Europæiske Økonomiske Fællesskab
    og Folkerepublikken Angola om fiskeri ud for Angola'
  type: main
- language: el
  script: Grek
  content: '96/569/ΕΚ: Απόφαση του Συμβουλίου της 24ης
    Σεπτεμβρίου 1996 σχετικά με τη σύναψη συμφωνίας
    υπό μορφήν ανταλλαγής επιστολών όσον αφορά
    την προσωρινή εφαρμογή του πρωτοκόλλου που
    ορίζει τις αλιευτικές δυνατότητες και τη χρηματική
    αντιστάθμιση που προβλέπεται από τη συμφωνία
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της κυβέρνησης της Δημοκρατίας της Αγκόλα
    όσον αφορά την αλιεία στα ανοικτά των ακτών
    της Αγκόλα για την περίοδο από 3 Μαΐου 1996 έως
    2 Μαΐου 1999'
  type: main
- language: fi
  script: Latn
  content: '96/569/EY: Neuvoston päätös, tehty 24 päivänä syyskuuta 1996, Euroopan
    yhteisön ja Angolan tasavallan hallituksen välisessä Angolan rannikon edustalla
    harjoitettavasta kalastuksesta tehdyssä sopimuksessa määrättyjen kalastusmahdollisuuksien
    ja taloudellisen korvauksen vahvistamista 3 päivänä toukokuuta 1996 alkavaksi
    ja 2 päivänä toukokuuta 1999 päättyväksi ajaksi koskevan pöytäkirjan väliaikaista
    soveltamista koskevan sopimuksen tekemisestä kirjeenvaihtona'
  type: main
- language: it
  script: Latn
  content: '96/569/CE: Decisione del Consiglio del 24 settembre 1996 relativa alla
