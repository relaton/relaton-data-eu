title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/482 of 24 November 2025 amending
    Delegated Regulation (EU) 2017/567 as regards the determination of what constitutes
    a liquid market for equity instruments, the obligation to provide market data
    on a reasonable commercial basis, the size specific to the instrument for the
    purposes of obligations for systematic internalisers, and the definition of and
    disclosure for post-trade risk reduction services
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/482 de la Commission du 24 novembre 2025
    modifiant le règlement délégué (UE) 2017/567 en ce qui concerne la définition
    des éléments constitutifs d’un marché liquide pour les actions et instruments
    assimilés, l’obligation de fournir des données de marché à des conditions
    commerciales raisonnables, la taille spécifique à l’instrument aux fins des
    obligations incombant aux internalisateurs systématiques, ainsi que la définition
    des services de réduction des risques post-négociation et la publication d’informations
    les concernant
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/482 der Kommission vom 24. November 2025
    zur Änderung der Delegierten Verordnung (EU) 2017/567 im Hinblick auf die Bestimmung,
    was unter einem liquiden Markt für Eigenkapitalinstrumente zu verstehen ist,
    die Verpflichtung zur Bereitstellung von Marktdaten zu angemessenen kaufmännischen
    Bedingungen, den für die Zwecke der Verpflichtungen für systematische Internalisierer
    für das Instrument typischen Umfang und die Begriffsbestimmung und Offenlegung
    von Diensten zur Verringerung von Nachhandelsrisiken
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2026/482 на Комисията
    от 24 ноември 2025 година за изменение на Делегиран
    регламент (ЕС) 2017/567 по отношение на определянето
    на това какво представлява ликвиден пазар
    на капиталови инструменти, задължението за
    предоставяне на пазарни данни при разумни
    търговски условия, специфичния за инструмента
    размер с оглед на задълженията на систематичните
    участници и определението и оповестяването
    на услугите за намаляване на риска след сключване
    на сделка
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2026/482 ze dne 24. listopadu
    2025, kterým se mění nařízení v přenesené pravomoci (EU) 2017/567, pokud
    jde o určení toho, co představuje likvidní trh s kapitálovými nástroji,
    povinnost poskytovat údaje o trhu za přiměřených obchodních podmínek, konkrétní
    objem pro daný nástroj pro účely povinností systematických internalizátorů
    a definici a zveřejňování služeb poobchodního snižování rizika
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2026/482 af 24. november 2025
    om ændring af delegeret forordning (EU) 2017/567 for så vidt angår fastlæggelse
    af, hvad der udgør et likvidt marked for aktieinstrumenter, forpligtelsen til
