    to, kas ir kapitāla vērtspapīru instrumentu likvīds tirgus, pienākumu sniegt
    tirgus datus ar pamatotiem komerciāliem nosacījumiem, instrumentam raksturīgo
    apjomu sistemātisko internalizētāju pienākumu izpildei un pēctirdzniecības
    riska mazināšanas pakalpojumu definīciju un informācijas atklāšanu par tiem
  type: main
- language: lt
