    pareigos teikti rinkos duomenis pagrįstomis komercinėmis sąlygomis, dėl priemonei
    būdingo dydžio, susijusio su sistemingai sandorius savo viduje sudarančių
    tarpininkų pareigomis, ir dėl rizikos mažinimo po sandorio sudarymo paslaugų
