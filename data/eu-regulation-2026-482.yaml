    cad is margadh leachtach le haghaidh ionstraimí cothromais ann, an oibleagáid
    sonraí margaidh a sholáthar ar bhonn réasúnta tráchtála, an méid atá sonrach
    don ionstraim chun críoch oibleagáidí le haghaidh inmheánaitheoirí córasacha,
