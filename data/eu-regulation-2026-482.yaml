  script: Latn
  content: Regolamento delegato (UE) 2026/482 della Commissione, del 24 novembre 2025,
    che modifica il regolamento delegato (UE) 2017/567 per quanto riguarda la determinazione
    di cosa costituisce un mercato liquido per gli strumenti rappresentativi di capitale,
    l’obbligo di fornire i dati di mercato a condizioni commerciali ragionevoli,
    la dimensione specifica dello strumento ai fini degli obblighi per gli internalizzatori
    sistematici come pure la definizione dei servizi di riduzione del rischio post-negoziazione
    e la relativa comunicazione di informazioni
  type: main
