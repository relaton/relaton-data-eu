title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 octobre 1971, autorisant la République
    italienne à exclure du traitement communautaire les pellicules sensibilisées,
    non impressionnées, de la position 37.02 du Tarif douanier commun, originaires
    du Japon et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/356/EWG: Entscheidung der Kommission vom 19. Oktober 1971, mit der
    die Italienische Republik ermächtigt wird, die aus Japan stammenden und in den
    übrigen Mitgliedstaaten im freien Verkehr befindlichen lichtempfindlichen Filme
    in Rollen oder Streifen, auch gelocht, nicht belichtet, der Tarifnummer 37.02
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/356/CEE: Decisione della Commissione, del 19 ottobre 1971, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le pellicole sensibilizzate
    non impressionate, della voce n. 37.02 della tariffa doganale comune, originarie
    del Giappone e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/356/EEG: Beschikking van de Commissie van 19 oktober 1971 waarbij de
    Italiaanse Republiek wordt gemachtigd lichtgevoelige, onbelichte films, van post
    37.02 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de
    overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
