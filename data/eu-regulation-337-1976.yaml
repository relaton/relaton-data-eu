  content: Commission Regulation (EEC) No 337/76 of 17 February 1976 temporarily including
    butteroil in the list of processed products covered by the system of advance payment
    of refunds
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 337/76 de la Commission, du 17 février 1976, introduisant
    temporairement le butteroil dans la liste des produits transformés auxquels s'applique
    le régime de paiement à l'avance des restitutions
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 337/76 der Kommission vom 17. Februar 1976 zur vorübergehenden
    Wiederaufnahme von Butteroil in die Liste der Verarbeitungserzeugnisse, auf die
    die Vorauszahlungsregelung der Erstattungen angewandt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 337/76 af 17. februar 1976 om midlertidig
    opførelse af butteroil på listen over forarbejdede produkter, for hvilke ordningen
    med forudbetaling af restitutioner gælder
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 337/76 della Commissione, del 17 febbraio 1976, che
    aggiunge temporaneamente il butteroil alla lista dei prodotti trasformati ai quali
    si applica il regime di pagamento in anticipo delle restituzioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 337/76 van de Commissie van 17 februari 1976 houdende
