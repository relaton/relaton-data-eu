title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3409/82 of 13 December 1982 amending Regulation
    (EEC) No 2764/77 extending the period for which Class III may be applied in respect
    of certain fruit and vegetablesy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3409/82 du Conseil, du 13 décembre 1982, modifiant
    le règlement (CEE) n° 2764/77 prorogeant la période pendant laquelle la catégorie
    de qualité III de certains fruits et légumes peut être rendue applicable
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3409/82 des Rates vom 13. Dezember 1982 zur Änderung
    der Verordnung (EWG) Nr. 2764/77 zur Verlängerung des Zeitraums, in dem die Güteklasse
    III bei bestimmten Obst- und Gemüsearten angewendet werden kann
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3409/82 af 13. december 1982 om ændring
    af forordning (EØF) nr. 2764/77 om forlængelse af perioden, i hvilken kvalitetsklasse
    III kan tillades anvendt for visse arter af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3409/82 τού Συμβουλίου
    τής 13ης Δεκεμβρίου 1982 γιά τήν τροποποίηση τού
    κανονισμού (EOK) αριθ. 2764/77 περί παρατάσεως τής
    περιόδου κατά τή διάρκεια τής οποίας δύναται
    νά εφαρμόζεται η ποιοτική κατηγορία ΙΙΙ ορισμένων
    οπωροκηπευτικών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3409/82 del Consiglio, del 13 dicembre 1982, che modifica
    il regolamento (CEE) n. 2764/77 che proroga, per determinati prodotti ortofrutticoli,
    il periodo in cui la categoria di qualità III può essere resa applicabile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3409/82 van de Raad van 13 december 1982 tot wijziging
    van Verordening (EEG) nr. 2764/77 tot verlenging van de periode waarin voor bepaalde
    soorten groenten en fruit de kwaliteitsklasse III kan worden toegepast
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3409/82 do Conselho, de 13 de Dezembro de 1982,
    que altera o Regulamento (CEE) n.° 2764/77 que prorroga o período durante o
    qual pode tornar-se aplicável a categoria de qualidade III de certas frutas e
    produtos hortícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3409/82 del Consejo, de 13 de diciembre de 1982, por
    el que se modifica el Reglamento (CEE) n° 2764/77 por el que se prorroga el período
    durante el cual puede aplicarse la categoría de calidad III de determinadas frutas
    y hortalizas
  type: main
