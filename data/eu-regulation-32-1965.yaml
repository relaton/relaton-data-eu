    a profitto della Comunità in esecuzione dell'articolo 12, primo comma, dei Protocolli
    sui privilegi e sulle immunità della Comunità Economica Europea e della Comunità
    Europea dell'Energia Atomica
  type: main
- language: nl
  script: Latn
