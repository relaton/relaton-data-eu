  script: Latn
  content: Verordnung Nr. 32/65/EWG, 6/65/Euratom der Räte vom 16. März 1965 zur
    Änderung der Bestimmungen und des Verfahrens für die Erhebung der in Artikel
    12 Absatz (1) der Protokolle über die Vorrechte und Befreiungen der Europäischen
    Wirtschaftsgemeinschaft und der Europäischen Atomgemeinschaft vorgesehenen Steuer
    zugunsten der Gemeinschaft
  type: main
- language: it
  script: Latn
