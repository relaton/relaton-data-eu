title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2086/98 of 30 September 1998 amending Regulation
    (EC) No 1672/98 determining the extent to which applications lodged in July 1998
    for licences for certain egg and poultrymeat products under the regime provided
    for by the Interim Agreements concluded by the Community with the Republic of
    Poland, the Republic of Hungary, the Czech Republic, the Slovak Republic, Romania
    and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2086/98 de la Commission du 30 septembre 1998 modifiant
    le règlement (CE) n° 1672/98 déterminant la mesure dans laquelle les demandes
    de certificats d'importation introduites en juillet 1998 pour certains produits
    des secteurs de la viande de volaille et des oeufs dans le cadre du régime prévu
    dans les accords conclus entre la Communauté et la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Roumanie et
    la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2086/98 der Kommission vom 30. September 1998 zur Änderung
    der Verordnung (EG) Nr. 1672/98 über die Festsetzung des Umfangs, in dem die
    im Juli 1998 gestellten Anträge auf Einfuhrlizenzen für bestimmte Eier und für
    Geflügelfleisch entsprechend der Regelung der Abkommen zwischen der Gemeinschaft
    und der Republik Polen, der Republik Ungarn, der Tschechischen Republik, der Slowakei,
    Rumänien und Bulgarien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2086/98 af 30. september 1998 om ændring
    af forordning (EF) nr. 1672/98 om fastsættelse af, i hvilket omfang der kan accepteres
    ansøgninger, der blev indgivet i juli 1998 om importlicenser for visse æg- og
    fjerkrækødprodukter i forbindelse med den ordning, der er fastsat i de aftaler,
    som Fællesskabet har indgået med Republikken Polen, Republikken Ungarn, Den
    Tjekkiske Republik, Den Slovakiske Republik, Rumænien og Republikken Bulgarien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2086/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Σεπτεμβρίου 1998 για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1672/98 για τον καθορισμό
    σε ποιο βαθμό μπορούν να γίνουν αποδεκτές οι
    αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1998 για ορισμένα προϊόντα των τομέων
    του κρέατος των πουλερικών και των αυγών στο
    πλαίσιο του καθεστώτος που προβλέπεται στις
    συμφωνίες που έχει συνάψει η Κοινότητα και
    η Δημοκρατία της Πολωνίας, η Δημοκρατία της
    Ουγγαρίας, η Τσεχική Δημοκρατία, η Σλοβακική
    Δημοκρατία, η Ρουμανία και η Βουλγαρία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2086/98, annettu 30 päivänä syyskuuta 1998,
    yhteisön sekä Puolan, Unkarin, Tsekin tasavallan, Slovakian tasavallan, Romanian
    ja Bulgarian välisissä väliaikaisissa sopimuksissa määrättyyn järjestelmään
    liittyvien heinäkuussa 1998 jätettyjen tiettyjä siipikarjanliha- ja muna-alan
    tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä annetun asetuksen
    (EY) N:o 1672/98 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2086/98 della Commissione del 30 settembre 1998 che
    modifica il regolamento (CE) n. 1672/98 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli di importazione presentate nel mese di luglio
    1998 per taluni prodotti del settore delle uova e del pollame nel quadro del regime
    previsto dagli accordi conclusi tra la Comunità e la Repubblica di Polonia, la
    Repubblica di Ungheria, la Repubblica ceca, la Slovacchia, la Romania e la Bulgaria
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2086/98 van de Commissie van 30 september 1998 houdende
    wijziging van Verordening (EG) nr. 1672/98 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sectoren slachtpluimvee en eieren, die in juli 1998 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomsten met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek, de Slowaakse Republiek, de Republiek Roemenië en de Republiek Bulgarije
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2086/98 da Comissão de 30 de Setembro de 1998 que
    altera o Regulamento (CE) nº 1672/98 que determina em que medida podem ser aceites
    os pedidos de certificados de importação de determinados produtos dos sectores
    dos ovos e da carne de aves de capoeira apresentados em Julho de 1998 ao abrigo
    do regime previsto nos acordos concluídos pela Comunidade com a República da
    Polónia, a República da Hungria, a República Checa, a Eslováquia, a Roménia
    e a Bulgária
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2086/98 de la Comisión de 30 de septiembre de 1998
    por el que se modifica el Reglamento (CE) n° 1672/98 por el que se determina
    la proporción en que se satisfarán las solicitudes de certificados de importación
    de algunos productos de los sectores de la carne de aves de corral y de los huevos
    presentadas en el mes de julio de 1998 al amparo del régimen previsto en los
    Acuerdos celebrados entre la Comunidad y la República de Polonia, la República
    de Hungría, la República Checa, la República Eslovaca, Rumania y la República
    de Bulgaria
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2086/98 av den 30 september 1998 om ändring
    av kommissionens förordning (EG) nr 1672/98 om fastställande av i vilken utsträckning
    de ansökningar om importlicens för vissa ägg- och fjäderfäköttprodukter
    som ges in under juli 1998 i enlighet med det förfarande som föreskrivs i avtalen
    mellan gemenskapen och Polen, Ungern, Tjeckien, Slovakien, Rumänien och Bulgarien
    kan godtas
