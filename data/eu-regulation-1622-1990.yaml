title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1622/90 of 15 June 1990 amending Regulation
    (EEC) No 3987/89 fixing for the period 1 January to 31 December 1990 the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1622/90 de la Commission du 15 juin 1990 modifiant
    le règlement (CEE) n° 3987/89 fixant, pour la période allant du 1er janvier
    au 31 décembre 1990, la quantité maximale de certains produits du secteur des
    matières grasses à mettre à la consommation et à importer en Espagne et au
    Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1622/90 DER KOMMISSION vom 15. Juni 1990 zur Aenderung
    der Verordnung (EWG) Nr. 3987/89 zur Festsetzung der Hoechstmengen bestimmter
    Erzeugnisse des Fettsektors, die in Spanien und Portugal zum freien Verkehr abzufertigen
    und in diese Laender einzufuehren sind, fuer den Zeitraum vom 1. Januar bis zum
    31. Dezember 1990
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1622/90 af 15. juni 1990 om ændring
    af forordning (EØF) nr. 3987/89 om fastsættelse for perioden 1. januar til 31.
    december 1990 af den største mængde af visse produkter inden for fedtstofsektoren,
    der kan overgå til frit forbrug i og importeres til Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1622/90 της Επιτροπής
    της 15ης Ιουνίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3987/89 που καθορίζει για
    την περίοδο από 1ης Ιανουαρίου έως 31 Δεκεμβρίου
    1990 τη μέγιστη ποσότητα ορισμένων προϊόντων
    του τομέα των λιπαρών ουσιών που διατίθενται
    στην κατανάλωση και εισάγονται στην Ισπανία
    και την Πορτογαλία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1622/90 DELLA COMMISSIONE del 15 giugno 1990 che modifica
    il regolamento (CEE) n. 3987/89 che fissa, per il periodo dal 1o gennaio al 31
    dicembre 1990, la quantità massima di taluni prodotti del settore dei grassi
    da mettere in consumo e da importare in Spagna e in Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1622/90 VAN DE COMMISSIE van 15 juni 1990 tot wijziging
    van Verordening (EEG) nr. 3987/89 tot vaststelling, voor het tijdvak van 1 januari
    tot en met 31 december 1990, van de maximum hoeveelheid van bepaalde in Spanje
    en Portugal in consumptie te brengen of in te voeren produkten van de sector oliën
    en vetten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1622/90 DA COMISSAO de 15 de Junho de 1990 que altera
    o Regulamento (CEE) n* 3987/89 que fixa, para o periodo que vai de 1 de Janeiro
    e 31 de Dezembro de 1990, a quantidade maxima de determinados produtos do sector
    das matérias gordas a introduzir no consumo e a importar para Espanha e para
    Portugal
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1622/90 DE LA COMISION de 15 de junio de 1990 que modifica
    el Reglamento (CEE) no 3987/89 por el que se fija, para el periodo comprendido
    entre el 1 de enero y el 31 de diciembre de 1990, la cantidad maxima de ciertos
    productos del sector de las materias grasas que habra de despacharse al consumo
    e importarse en Espana y Portugal
  type: main
