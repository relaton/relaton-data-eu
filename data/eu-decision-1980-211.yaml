title:
- language: en
  script: Latn
  content: '80/211/EEC: Commission Decision of 25 January 1980 establishing that the
    conditions required for the admission free of Common Customs Tariff duties of
    the scientific apparatus described as ''Ortec- GE(Li) Detector System, model 1513-16280''
    , are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/211/CEE: Décision de la Commission, du 25 janvier 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Ortec-GE (Li) Detector
    System, model 1513-16280" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/211/EWG: Entscheidung der Kommission vom 25. Januar 1980, mit der festgestellt
    wird, daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs für das wissenschaftliche Gerät ,,ORTEC-GE(Li) Detector System, model
    1513-16280'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/211/EØF: Kommissionens beslutning af 25. januar 1980 om fastslåelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "ORTEC - GE (Li) DETECTOR SYSTEM, model 1513-16280"
    ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/211/ΕΟΚ: Απόφαση τής Επιτροπής τής 25ης
    Ιανουαρίου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Ortec—GE (Li) Detector System, model 1513—16280»
    δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/211/CEE: Decisione della Commissione, del 25 gennaio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Ortec-GE (Li) Detector
    System, model 1513-16280" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/211/EEG: Beschikking van de Commissie van 25 januari 1980 vaststellende
    dat de voorwaarden welke vereist zijn voor de toelating met vrijstelling van de
    rechten van het gemeenschappelijk douanetarief van het wetenschappelijk apparaat
    genaamd ,,Ortec-Ge(Li) Detector System, model 1513-16280'' '' niet vervuld zijn'
