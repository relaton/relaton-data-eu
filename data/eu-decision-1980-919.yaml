title:
- language: en
  script: Latn
  content: '80/919/EEC: Commission Decision of 9 September 1980 authorizing Ireland
    not to apply Community treatment to babies''garments, falling within subheadings
    ex 61.02 A and ex 61.04 A of the Common Customs Tariff (category 80), originating
    in Hong Kong and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/919/CEE: Décision de la Commission, du 9 septembre 1980, autorisant
    l''Irlande à exclure du traitement communautaire les vêtements pour bébés,
    des sous- positions ex 61.02 A et ex 61.04 A du tarif douanier commun (catégorie
    80), originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/919/EWG: Entscheidung der Kommission vom 9. September 1980, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Säuglingskleidung der Tarifstellen ex 61.02 A und
    ex 61.04 A des Gemeinsamen Zolltarifs (Kategorie 80) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/919/EØF: Kommissionens beslutning af 9. september 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage beklædningsgenstande til
    spædbørn, som henhører under pos. ex 61.02 A og ex 61.04 A i den fælles toldtarif
    (kategori 80), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/919/CEE: Decisione della Commissione, del 9 settembre 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli indumenti per bambini,
    delle sottovoci ex 61.02 A e ex 61.04 A della tariffa doganale comune, categoria
    80, originari di Hong Kong e messi in libera pratica negli altri Stati membri
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/919/EEG: Beschikking van de Commissie van 9 september 1980 waarbij
    Ierland wordt gemachtigd kleding voor baby''s, van de posten ex 61.02 A en ex
    61.04 A van het gemeenschappelijk douanetarief (categorie 80), van oorsprong uit
    Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
