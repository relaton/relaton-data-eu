    της 29ης Οκτωβρίου 1997 για καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Οκτώβριο 1997 για τις συμπληρωματικές δασμολογικές
