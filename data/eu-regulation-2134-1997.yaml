title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2134/97 of 29 October 1997 determining the
    percentages of quantities which may be allowed in respect of import licence applications
    lodged in October 1997 under tariff quotas for meat provided for in Regulation
    (EC) No 1939/97 for the Republic of Poland, the Republic of Hungary, the Czech
    Republic, Slovakia, Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2134/97 DE LA COMMISSION du 29 octobre 1997 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en octobre 1997 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1939/97 pour la république de Pologne, la
    république de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2134/97 DER KOMMISSION vom 29. Oktober 1997 zur Bestimmung
    des Prozentsatzes, zu dem den im Oktober 1997 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch aus der Republik Polen, der Republik
    Ungarn, der Tschechischen Republik, der Slowakischen Republik, der Republik Bulgarien
    und der Republik Rumänien im Rahmen der Zollkontingente gemäß der Verordnung
    (EG) Nr. 1939/97 stattgegeben wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2134/97 af 29. oktober 1997 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i oktober 1997
    om importlicenser under de toldkontingenter for oksekød, der i forordning (EF)
    nr. 1939/97 er fastsat for Republikken Polen, Republikken Ungarn, Den Tjekkiske
    Republik, Den Slovakiske Republik, Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
