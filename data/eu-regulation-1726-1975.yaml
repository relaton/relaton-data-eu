title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1726/75 of the Commission of 4 July 1975 fixing the
    amounts by which the import charges on beef and veal originating in the African,
    Caribbean and Pacific States or in the overseas countries and territories are
    to be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1726/75 de la Commission, du 4 juillet 1975, fixant
    les montants de diminution des charges à l'importation de viandes bovines originaires
    des États d'Afrique, des Caraïbes et du Pacifique ou des pays et territoires
    d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1726/75 der Kommission vom 4. Juli 1975 zur Festsetzung
    der Beträge zur Senkung der Einfuhrabgaben bei Rindfleisch aus den Staaten in
    Afrika, im Karibischen Raum und im Pazifischen Ozean oder in den Überseeischen
    Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1726/75 af 4. juli 1975 om fastsættelse
    af de beløb, med hvilke importbelastningerne for oksekød, med oprindelse i staterne
    i Afrika, Vestindien og Stillehavet eller i de oversøiske lande eller territorier,
    nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1726/75 della Commissione, del 4 luglio 1975, che
    fissa gli importi di cui sono ridotti gli oneri applicabili all'importazione di
    carni bovine originarie degli Stati africani, dei Caraibi e del Pacifico o dei
    paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1726/75 van de Commissie van 4 juli 1975 houdende
    vaststelling van de bedragen welke in mindering worden gebracht op de belastingen
    bij invoer van rundvlees van oorsprong uit de landen in Afrika, het Caribisch
    Gebied en de Stille Oceaan of uit de landen en gebieden overzee
  type: main
