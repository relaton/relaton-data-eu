  content: 'Règlement n° 41 du Conseil relatif à la détermination de la quantité
    de céréales fourragères nécessaire pour la production d''un kilogramme de
    volaille abattue des catégories suivantes : canard, dinde, oie, pintade et poule
    pondeuse'
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 41 des Rats über die Festsetzung der Futtergetreidemenge,
    die zur Erzeugung von einem Kilogramm geschlachtete Enten, Puten, Gänse, Perlhühner
    und Legehühner erforderlich ist
  type: main
- language: it
  script: Latn
  content: 'Regolamento n. 41 del Consiglio relativo alla determinazione del quantitativo
    di cereali da foraggio necessario per la produzione di un chilogrammo di pollame
