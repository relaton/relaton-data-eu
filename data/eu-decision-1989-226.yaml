title:
- language: en
  script: Latn
  content: '89/226/EEC: Commission Decision of 10 March 1989 amending Decision 87/544/EEC
    authorizing Belgium to specify a minimum number of animals in the case of applications
    for the special premium for beef producers (Only the French and Dutch texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/226/CEE: Décision de la Commission du 10 mars 1989 modifiant la décision
    87/544/CEE autorisant la Belgique à prévoir un nombre minimal d''animaux pour
    les demandes de prime spéciale en faveur des producteurs de viande bovine (Les
    textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '89/226/EWG: Entscheidung der Kommission vom 10. März 1989 zur Änderung
    der Entscheidung 87/544/EWG zur Ermächtigung Belgiens, für die Anträge auf
    Sonderprämie für Rindfleischerzeuger eine Mindestzahl Tiere vorzusehen (Nur
    der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '89/226/EØF: Kommissionens beslutning af 10. marts 1989 om ændring af
    beslutning 87/554/EØF om tilladelse til Belgien til at fastsætte et minimumsantal
    af dyr for ansøgninger om en særlig præmie til oksekødsproducenter (Kun den
    franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '89/226/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Μαρτίου 1989 για τροποποίηση της αποφάσεως 87/544/ΕΟΚ
    που επιτρέπει στο Βέλγιο να προβλέψει έναν
    ελάχιστο αριθμό ζώων για τις αιτήσεις για την
    ειδική πριμοδότηση υπέρ των παραγωγών βοείου
    κρέατος (Τα κείμενα στην γαλλική και ολλανδική
    γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '89/226/CEE: Decisione della Commissione del 10 marzo 1989 che modifica
    la decisione 87/544/CEE che autorizza il Belgio a prevedere un numero di animali
    per le domande di premio speciale a favore dei produttori di carni bovine (I testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '89/226/EEG: Beschikking van de Commissie van 10 maart 1989 tot wijziging
    van Beschikking 87/544/EEG waarbij België gemachtigd wordt voor te schrijven
    dat aanvragen van de speciale premie voor rundvleesproducenten op een minimumaantal
    dieren betrekking moeten hebben (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '89/226/CEE: Decisão da Comissão de 10 de Março de 1989 que altera a
    Decisão 87/554/CEE, que autoriza a Bélgica a prever um numero mínimo de animais
    para os pedidos de prémio especial a favor dos produtores de carne de bovino
    (Apenas fazem fé os textos nas línguas francesa e neerlandesa)'
  type: main
- language: es
  script: Latn
  content: '89/226/CEE: Decisión de la Comisión de 10 de marzo de 1989 por la que
    se modifica la Decisión 87/544/CEE por la que se autoriza a Bélgica a fijar
    un numero de animales para la solicitudes de prima especial en favor de los productores
    de carne de vacuno (Los textos en lenguas francesa y neerlandesa son los únicos
    auténticos)'
