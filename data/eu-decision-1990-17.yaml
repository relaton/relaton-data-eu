id: EUDecision199017
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '90/17/EEC: Commission Decision of 22 December 1989 adopting the 1990 plan
    allocating to the Member States resources to be charged to the 1990 budget year
    for the supply of food from intervention stocks to designated organizations for
    distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '90/17/CEE: Décision de la Commission du 22 décembre 1989 adoptant le
    plan de 1990 portant attribution aux États membres de ressources imputables à
    l''exercice 1990 pour la fourniture de denrées alimentaires provenant des stocks
    d''intervention à des organisations désignées pour les distribuer aux personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 22. Dezember 1989 zur Bewilligung von Mitteln,
    die im Haushaltsjahr 1990 fuer die Lieferung von Nahrungsmitteln aus Interventionsbestaenden
    an bestimmte Einrichtungen zur Verteilung an Beduerftige in der Gemeinschaft zu
    verbuchen sind (90/17/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 22. december 1989 om vedtagelse af 1990-planen
    for tildeling til medlemsstaterne af midler, der skal afholdes over 1990-budgettet,
    og som skal daekke udgifterne til levering af levnedsmidler fra interventionslagre
    til de udpegede organisationer med henblik paa uddeling til de socialt daarligst
    stillede personer i Faellesskabet (90/17/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/17/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1989 για την έγκριση του προγράμματος 1990 για
    την κατανομή στα κράτη μέλη των πόρων που θα
    καταλογισθούν στο έτος προϋπολογισμού 1990 για
    τη χορήγηση τροφίμων που προέρχονται από τα
    αποθέματα παρέμβασης σε οργανισμούς που έχουν
    ορισθεί για τη διανομή τους στους απόρους της
    Κοινότητας'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 22 dicembre 1989 che approva il piano per
    il 1990 che assegna agli Stati membri le risorse da imputare all'esercizio finanziario
    1990 per la fornitura a determinati organismi di derrate alimentari provenienti
    dalle scorte di intervento e destinate ad essere distribuite agli indigenti nella
    Comunità (90/17/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 22 december 1989 tot vaststelling van
    het jaarplan voor 1990 voor de toewijzing aan de Lid-Staten van voor het begrotingsjaar
    1990 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan de meest behoeftigen
    in de Gemeenschap (90/17/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Dezembro de 1989 que adopta o plano para 1990,
    que atribui aos Estados-membros recursos a incluir no exercicio orçamental de
    1990 para o fornecimento, a determinadas organizaçoes, de géneros alimenticios,
    provenientes das existências de intervençao, para distribuiçao às pessoas
    mais necessitadas na Comunidade (90/17/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 22 de diciembre de 1989 por la que se adopta
    el plan para 1990 que establece la asignacion a los Estados miembros de recursos
    imputables al ejercicio presupuestario para el suministro a determinadas organizaciones
    de alimentos procedentes de existencias de intervencion, para su distribucion
    entre las personas mas necesitadas de la Comunidad (90/17/CEE)
  type: main
