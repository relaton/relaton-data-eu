    dell' utilizzazione e/o della destinazione di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 628/85 van de Commissie van 12 maart 1985 tot wijziging
    van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke bepalingen
    inzake de controle op het gebruik en/of de bestemming van produkten uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 628/85 da Comissão, de 12 de Março de 1985, que
