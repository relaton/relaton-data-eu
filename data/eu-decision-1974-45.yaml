title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1973 amending the Commission Decision
    of 23 January 1973 authorizing the Federal Republic of Germany to apply special
    health guarantees for the prevention of leucosis in the case of bovine animals
    imported for breeding or production
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 21 décembre 1973, portant modification
    de la décision de la Commission, du 23 janvier 1973, autorisant la République
    fédérale d'Allemagne à appliquer des garanties sanitaires particulières relatives
    à la lutte contre la leucose, en cas d'introduction sur son territoire de bovins
    d'élevage ou de rente
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973 zur Änderung der Entscheidung
    der Kommission vom 23. Januar 1973, mit der die Bundesrepublik Deutschland ermächtigt
    wird, beim Verbringen von Zucht- und Nutzrindern in ihr Hoheitsgebiet zur Bekämpfung
    der Leukose besondere gesundheitspolizeiliche Garantien anzuwenden
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om ændring af Kommissionens
    beslutning af 23. januar 1973 om bemyndigelse af forbundsrepublikken Tyskland
    til ved indbringelse på dens område af avls- eller brugskvæg at anvende særlige
    sundhedsmæssige garantier med henblik på bekæmpelse af leukose
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1973, recante modifica della
    decisione della Commissione del 23 gennaio 1973 che autorizza la Repubblica federale
    di Germania ad applicare speciali garanzie sanitarie all'introduzione di bovini
    da allevamento e da produzione nel proprio territorio con riferimento alla lotta
    contro la leucosi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 tot wijziging van de
    beschikking van de Commissie van 23 januari 1973 waarbij de Bondsrepubliek Duitsland
    wordt gemachtigd om bij invoer van fok- en gebruiksrunderen bijzondere gezondheidsgaranties
    in het kader van de leukosebestrijding toe te passen
  type: main
