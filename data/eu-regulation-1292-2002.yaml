title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1292/2002 of 16 July 2002 laying down to
    what extent applications for issue of export licences submitted during July 2002
    for beef products which may benefit from special import treatment in a third country
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1292/2002 de la Commission du 16 juillet 2002 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de juillet 2002 pour les produits du secteur
    de la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1292/2002 der Kommission vom 16. Juli 2002 über das
    Ausmaß, in dem den im Juli 2002 eingereichten Anträgen auf Ausfuhrlizenzen für
    Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1292/2002 af 16. juli 2002 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    juli 2002 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    et tredjeland, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1292/2002 της Επιτροπής,
    της 16ης Ιουλίου 2002, που καθορίζει σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Ιούλιο 2002 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1292/2002, annettu 16 päivänä heinäkuuta
    2002, kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden
    heinäkuussa 2002 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1292/2002 della Commissione, del 16 luglio 2002, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    esportazione presentate nel mese di luglio 2002 per i prodotti del settore delle
    carni bovine che beneficiano di un trattamento speciale all'importazione in un
    paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1292/2002 van de Commissie van 16 juli 2002 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 2002 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bĳzondere
    behandeling geldt bĳ invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1292/2002 da Comissão, de 16 de Julho de 2002, que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Julho de 2002 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1292/2002 de la Comisión, de 16 de julio de 2002,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    certificados de exportación, presentadas en el mes de julio de 2002, para los
    productos del sector de la carne de bovino que se beneficien de un trato especial
    para su importación en un tercer país
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1292/2002 av den 16 juli 2002 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under juli månad 2002
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
  type: main
