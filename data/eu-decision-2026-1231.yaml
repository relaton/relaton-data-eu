title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1231 of 11 June 2026 amending
    Implementing Decision (EU) 2021/1182 as regards harmonised standards for biological
    evaluation of medical devices, symbols to be used with information to be supplied
    by the manufacturer, medical electrical equipment, transfusion equipment for medical
    use, ophthalmic optics, non-active surgical implants, washer-disinfectors, prosthetics
    and sharps injury protection
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1231 de la Commission du 11 juin 2026
    modifiant la décision d’exécution (UE) 2021/1182 en ce qui concerne les normes
    harmonisées pour l’évaluation biologique des dispositifs médicaux, les symboles
    à utiliser avec les informations à fournir par le fabricant, les appareils électromédicaux,
    le matériel de transfusion à usage médical, l’optique ophtalmique, les implants
    chirurgicaux non actifs, les laveurs désinfecteurs, les prothèses et la protection
    contre les blessures par perforants
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1231 der Kommission vom 11. Juni 2026
    zur Änderung des Durchführungsbeschlusses (EU) 2021/1182 in Bezug auf harmonisierte
    Normen für die biologische Beurteilung von Medizinprodukten, Symbole zur Verwendung
    im Rahmen der vom Hersteller bereitzustellenden Informationen, medizinische elektrische
    Geräte, Transfusionsgeräte zur medizinischen Verwendung, Augenoptik, nichtaktive
    chirurgische Implantate, Reinigungs-Desinfektionsgeräte, Prothetik und Schutz
    vor Stich- und Schnittverletzung
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2026/1231 на Комисията
    от 11 юни 2026 година за изменение на Решение за
    изпълнение (ЕС) 2021/1182 по отношение на хармонизираните
    стандарти за биологично оценяване на медицински
    изделия, символи, които трябва да се използват
    заедно с информацията, предоставяна от производителя,
    електромедицински апарати, апарати за трансфузия
    за медицинско използване, офталмологична оптика,
    неактивни хирургически импланти, машини за
    измиване и дезинфекция, протезиране и защита
    от нараняване от остри части
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/1231 ze dne 11. června 2026,
    kterým se mění prováděcí rozhodnutí (EU) 2021/1182, pokud jde o harmonizované
    normy pro biologické hodnocení zdravotnických prostředků, značky používané
    s informacemi poskytovanými se zdravotnickými prostředky, zdravotnické elektrické
    přístroje, transfuzní přístroje pro zdravotnické použití, oční optiku,
    neaktivní chirurgické implantáty, mycí a dezinfekční zařízení, protetiku
    a ochranu před poraněním ostrými předměty
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/1231 af 11. juni 2026
