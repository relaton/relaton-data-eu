    laitteita, terveydenhuollossa käytettäviä infuusiovälineitä, silmälääketieteellistä
    optiikkaa, ei-aktiivisia kirurgisia implantteja, pesu- ja desinfiointikoneita,
    proteeseja ja neulanpistovammojen estämistä koskevista yhdenmukaistetuista standardeista
  type: main
