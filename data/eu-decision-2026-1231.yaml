    medicinskih proizvoda, simbole koji se upotrebljavaju s podacima koje osigurava
    proizvođač, medicinske električne uređaje, opremu za transfuziju za medicinsku
    primjenu, oftalmološku optiku, neaktivne kirurške implantate, uređaje za pranje
    i dezinfekciju, protetiku i zaštitu od ozljeda oštrim predmetima
  type: main
