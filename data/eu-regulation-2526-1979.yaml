title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2526/79 of 14 November 1979 re-establishing
    the levying of customs duties on quaternary ammonium salts and hydroxides, falling
    within subheading 29.24 B and originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2526/79 de la Commission, du 14 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres sels
    et hydrates d' ammonium quaternaires, de la sous-position 29.24 B du tarif douanier
    commun, originaires de Roumanie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2526/79 der Kommission vom 14. November 1979 zur Wiedereinführung
    des Zollsatzes für andere quaternäre organische Ammoniumsalze und -hydroxide
    der Tarifstelle 29.24 B, mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2526/79 af 14. november 1979 om genindførelse
    af opkrævning af toldafgifter for kvaternære ammoniumsalte og kvaternære ammoniumhydroxider,
    under underposition 29.24 B, som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2526/79 della Commissione, del 14 novembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli altri sali e idrossidi
    di ammonio quaternari, ecc., della sottovoce 29.24 B della tariffa doganale comune,
    originari della Romania, beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2526/79 van de Commissie van 14 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere quaternaire
    ammoniumzouten en hydroxyden, van post 29.24 B, van oorsprong uit Roemenië, ten
    behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
