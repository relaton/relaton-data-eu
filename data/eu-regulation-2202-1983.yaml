title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2202/83 of 1 August 1983 re-establishing
    the levying of customs duties on shawls, scarves, mufflers, other than knitted
    or crocheted, products of category 84 (code 0840) and originating in Pakistan,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2202/83 de la Commission du 1er août 1983 portant
    rétablissement de la perception des droits de douane applicables aux châles,
    écharpes, foulards, autres qu' en bonneterie de la catégorie de produits 84
    (code 0840), originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2202/83 der Kommission vom 1. August 1983 über die
    Wiedereinführung des Zollsatzes für Schals, Umschlagtücher, Halstücher, andere
    als Wirkwaren, der Warenkategorie Nr. 84 (Kennziffer 0840), mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2202/83 af 1. august 1983 om genindførelse
    af opkrævning af toldafgifter for sjaler, tørklæder, slør, bortset fra varer
    af trikotage, under kategori nr. 84 (kode 0840), som har oprindelse i Pakistan
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2202/83 της Επιτροπής
    της 1ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα επώμια
    εν γένει (σάλια, εσάρπες), μανδήλια λαιμού, έτερα
    των πλεκτών, προϊόντα της κατηγορίας 84 (κώδικας
    0840), καταγωγής Πακιστάν, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2202/83 della Commissione del 1o agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli scialli, sciarpe, fazzoletti
    da collo, esclusi quelli a maglia, della categoria di prodotti n. 84 (codice 0840),
    originari del Pakistan, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2202/83 van de Commissie van 1 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sjaals,
    sjerpen, hoofddoeken en halsdoeken, andere dan van brei- of haakwerk, van de categorie
    van produkten nr. 84 (codenummer 0840), van oorsprong uit Pakistan, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82
    van de Raad
