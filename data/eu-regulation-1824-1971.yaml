  content: Règlement (CEE) n° 1824/71 de la Commission, du 20 août 1971, complétant
    le règlement (CEE) n° 1728/71 concernant une adjudication permanente pour la
    vente de sucre blanc destiné à l'exportation et détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1824/71 der Kommission vom 20. August 1971 zur Ergänzung
    der Verordnung (EWG) Nr. 1728/71 über eine Dauerausschreibung zum Verkauf von
    Weißzucker, der zur Ausfuhr bestimmt ist und sich im Besitz der französischen
    Interventionsstelle befindet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1824/71 della Commissione, del 20 agosto 1971, che
    completa il regolamento (CEE) n. 1728/71 relativo ad una gara permanente per la
    vendita di zucchero bianco destinato all'esportazione e detenuto dall'organismo
    d'intervento francese
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1824/71 van de Commissie van 20 augustus 1971 tot
    aanvulling van Verordening (EEG) nr. 1728/71 betreffende een permanente openbare
    inschrijving voor de verkoop van witte suiker bestemd voor de uitvoer in het bezit
    van het Franse interventiebureau
