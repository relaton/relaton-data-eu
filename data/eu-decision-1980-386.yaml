id: EUDecision1980386
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/386/EEC: Commission Decision of 19 March 1980 authorizing Ireland not
    to apply Community treatment to jerseys, pullovers, slipovers, waistcoats, twinsets,
    cardigans, bedjackets and jumpers, falling within heading No ex 60.05 A I of the
    Common Customs Tariff (category 5), originating in Hong Kong and in free circulation
    in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/386/CEE: Décision de la Commission, du 19 mars 1980, autorisant l''Irlande
    à exclure du traitement communautaire les chandails, "pullovers", "twinsets",
    gilets et vestes de la sous-position ex 60.05 A I du tarif douanier commun (catégorie
    5), originaires de Hong-kong et mis en libre pratique dans les autres Etats membres
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/386/EWG: Entscheidung der Kommission vom 19. März 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Pullover, Slipover, Twinsets, Westen und Strickjacken
    der Tarifstelle ex 60.05 A I des Gemeinsamen Zolltarifs (Kategorie 5) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/386/EØF: Kommissionens beslutning af 19. marts 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste, som henhører under pos. ex
    60.05 A I i den fælles toldtarif (kategori 5), har oprindelse i Hongkong og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/386/CEE: Decisione della Commissione, del 19 marzo 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le maglie, pullover, con e
    senza maniche, slip-over, twinset, giubbetti e giacche, della sottovoce ex 60.05
    A I della tariffa doganale comune (categoria 5), originari di Hong Kong e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/386/EEG: Beschikking van de Commissie van 19 maart 1980 waarbij Ierland
    wordt gemachtigd truien, jumpers, pullovers, slipovers, twinsets, vesten en jasjes
    van post ex 60.05 A I van het gemeenschappelijk douanetarief (categorie 5), van
    oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse
    taal is authentiek)'
  type: main
