    zuzulassen, das den Anforderungen der Richtlinie 68/193/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '97/112/EF: Kommissionens Beslutning af 22. januar 1997 om bemyndigelse
