    kapcsolatos biztosítéki intézkedések alkalmazásáról szóló, az Egyesült
    Királyság, az Európai Atomenergia-közösség és a Nemzetközi Atomenergia-ügynökség
    között létrejött megállapodáshoz csatolt 1. és 2. jegyzőkönyv módosításainak
    az Európai Bizottság által történő megkötésének jóváhagyásáról
