title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 345/96 of 27 February 1996 amending Annex
    I to Council Regulation (EC) No 1808/95 opening and providing for the administration
    of Community tariff quotas bound in GATT for certain agricultural, industrial
    and fisheries products and establishing the detailed provisions for adapting these
    quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 345/96 de la Commission, du 27 février 1996, modifiant
    l'annexe I du règlement (CE) n° 1808/95 du Conseil portant ouverture et mode
    de gestion de contingents tarifaires communautaires consolidés au GATT pour certains
    produits agricoles, industriels et de la pêche, et définissant les modalités
    d'amendement ou d'adaptation desdits contingents
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 345/96 der Kommission vom 27. Februar 1996 zur Änderung
    des Anhangs I der Verordnung (EG) Nr. 1808/95 des Rates zur Eröffnung und Verwaltung
    von im GATT gebundenen Gemeinschaftszollkontingenten für einige landwirtschaftliche
    und gewerbliche Erzeugnisse sowie Fischereierzeugnisse und zur Einführung eines
    Verfahrens zur Änderung oder Anpassung dieser Zollkontingente
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 345/96 af 27. februar 1996 om ændring
    af bilag I til Rådets forordning (EF) nr. 1808/95 om åbning og forvaltning af
    GATT-bundne fællesskabstoldkontingenter for visse landbrugsprodukter, industri-
    og fiskerivarer og om visse gennemførelsesbestemmelser for så vidt angår tilpasning
    af disse toldkontingenter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 345/96 της Επιτροπής,
    της 27ης Φεβρουαρίου 1996, για τροποποίηση του
    παραρτήματος Ι του κανονισμού (ΕΚ) αριθ. 1808/95
    του Συμβουλίου σχετικά με το άνοιγμα και τον
    τρόπο διαχείρισης των παγιωμένων στη Γενική
    Συμφωνία Δασμών και Εμπορίου (GATT) κοινοτικών
    δασμολογικών ποσοστώσεων για ορισμένα γεωργικά,
    βιομηχανικά και αλιευτικά προϊόντα και με
    τον καθορισμό της μεθόδου τροποποίησης ή προσαρμογής
    των εν λόγω ποσοστώσεων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 345/96, annettu 27 päivänä helmikuuta 1996,
    GATT:iin sidottujen yhteisön tariffikiintiöiden avaamisesta ja hoidosta tiettyjen
    maatalous-, teollisuus- ja kalataloustuotteiden osalta sekä mainittujen kiintiöiden
    muuttamista tai mukauttamista koskevista säännöistä annetun neuvoston asetuksen
    (EY) N:o 1808/95 liitteen I muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 345/96 della Commissione, del 27 febbraio 1996, che
    modifica l'allegato I del regolamento (CE) n. 1808/95 del Consiglio recante apertura
    e modalità di gestione di contingenti tariffari Comunitàri consolidati al GATT
    per taluni prodotti agricoli, industriali e della pesca e che definisce le modalità
    di rettifica e di adattamento dei suddetti contingenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 345/96 van de Commissie van 27 februari 1996 tot wijziging
    van bijlage I bij Verordening (EG) nr. 1808/95 van de Raad betreffende de opening
    en de wijze van beheer van in de GATT geconsolideerde communautaire tariefcontingenten
    voor bepaalde landbouw-, industrie- en visserijprodukten en de vaststelling van
    modaliteiten voor de wijziging of aanpassing van die contingenten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 345/96 da Comissão, de 27 de Fevereiro de 1996, que
    altera o anexo I do Regulamento (CE) nº 1808/95 do Conselho relativo à abertura
    e modo de gestão de contingentes pautais comunitários consolidados no GATT,
    para certos produtos agrícolas, industriais e da pesca e à definição das modalidades
    de correcção ou de adaptação dos referidos contingentes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 345/96 de la Comisión, de 27 de febrero de 1996, por
