---
id: EUDecision1974281
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 May 1974 authorizing the Kingdom of Belgium, the
    Grand Duchy of Luxembourg and the Kingdom of the Netherlands to postpone raising
    their customs tariff duties to the level of those of the Common Customs Tariff
    as regards manufactured tobacco falling within tariff subheadings 24.02 A, B,
    C and D
  type: main
- language: fr
  script: Latn
  content: Décision 74/281/CEE de la Commission, du 8 mai 1974, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer
    le relèvement des droits de leur tarif douanier vers ceux du Tarif douanier commun
    en ce qui concerne les tabacs fabriqués des sous-positions tarifaires 24.02 A,
    B, C, D
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Mai 1974, mit der das Königreich Belgien,
    das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt werden,
    die Angleichung (Erhöhung) der Zollsätze ihrer Zolltarife an die des Gemeinsamen
    Zolltarifs für verarbeiteten Tabak der Tarifstellen 24.02 A, B, C und D aufzuschieben
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. maj 1974 om bemyndigelse af kongeriget Belgien,
    storhertugdømmet Luxembourg og kongeriget Nederlandene til at udskyde tilpasningen
    af toldsatserne i deres toldtariffer til den fælles toldtarif, for så vidt angår
    forarbejdet tobak henhørende under pos. 24.02 A, B, C og D
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 maggio 1974, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi a differire
    l'aumento dei dazi della loro tariffa doganale verso quelli della tariffa doganale
    comune per i tabacchi lavorati delle sottovoci tariffarie 24.02 A, B, C e D
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 mei 1974 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    de aanpassing van de rechten van hun douanetarief aan die van het gemeenschappelijk
    douanetarief uit te stellen voor tabaksfabrikaten van de onderverdelingen 24.02
    A, B, C en D
  type: main
