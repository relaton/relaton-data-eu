title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 779/79 of 19 April 1979 re-establishing
    the levying of customs duties on other rubber tyres, tyre cases, interchangeable
    tyre treads, etc., falling within heading No ex 40.11 and originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 779/79 de la Commission, du 19 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux autres bandages,
    pneumatiques, bandes de roulement amovibles pour pneumatiques, etc., de la position
    tarifaire ex 40.11, originaires de la Yougoslavie bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 779/79 der Kommission vom 19. April 1979 zur Wiedereinführung
    des Zollsatzes für Reifen, auswechselbare Überreifen, Luftschläuche und Felgenbänder,
    usw., der Tarifnummer ex 40.11, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 779/79 af 19. april 1979 om genindførelse
    af opkrævning af toldafgifter for andre dæk, ringe, udskiftelige slidbaner til
    dæk samt slanger etc., under pos. ex 40.11, som har oprindelse i Jugoslavien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 779/79 della Commissione, del 19 aprile 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle gomme piene o semipiene,
    coperture, battistrada amovibili per coperture, ecc., altre, della voce doganale
    ex 40.11, originarie della Iugoslavia beneficiaria delle preferenze previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 779/79 van de Commissie van 19 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op banden en
    velglinten, van niet-geharde gevulcaniseerde rubber, voor wielen van alle soorten
    ; verwisselbare loopvlakken voor banden, enz., van post ex 40.11, van oorsprong
    uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
