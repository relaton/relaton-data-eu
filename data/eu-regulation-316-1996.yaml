title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 316/96 of 21 February 1996 determining to
    what extent applications for the right to import for cows and heifers of certain
    mountain breeds lodged under Regulation (EC) No 207/96 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 316/96 DE LA COMMISSION du 21 février 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au titre du règlement (CE) n° 207/96 relatif à l'importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 316/96 DER KOMMISSION vom 21. Februar 1996 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte für Kühe und Färsen bestimmter
    Höhenrassen gemäß der Verordnung (EG) Nr. 207/96 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 316/96 af 21. februar 1996 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergracer i henhold til forordning (EF) nr. 207/96 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 316/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Φεβρουαρίου 1996 για να καθορισθεί σε
    ποιό βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται
    βάσει του κανονισμού (ΕΚ) αριθ. 207/96 όσον αφορά
    την εισαγωγή αγελάδων και δαμάλεων ορισμένων
    ορεσίβιων φυλών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 316/96, annettu 21 päivänä helmikuuta 1996,
    asetuksen (EY) N:o 207/96 mukaisesti jätettyjen tiettyihin vuoristorotuihin kuuluvia
    lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 316/96 DELLA COMMISSIONE del 21 febbraio 1996 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel quadro del regolamento (CE) n. 207/96 relativo all'importazione di vacche
    e giovenche di alcune razze di montagna
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 316/96 VAN DE COMMISSIE van 21 februari 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de ingediende aanvragen voor
    invoerrechten op grond van Verordening (EG) nr. 207/96 betreffende de invoer van
    koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 316/96 DA COMISSÃO de 21 de Fevereiro de 1996 que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados ao abrigo do Regulamento (CE) nº 207/96 relativo à importação
    de vacas e de novilhas de determinadas raças de montanha
  type: main
