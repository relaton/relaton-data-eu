title:
- language: en
  script: Latn
  content: Regulation (EEC) No 376/73 of the Commission of 31 January 1973 amending,
    as regards the compensatory amounts provided for in the Act of Accession, Regulations
    (EEC) Nos 1259/72, 1282/72, 1519/72, 1717/72, 2474/72, 2537/72 and 2561/72 relating
    to special sales of butter
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 376/73 de la Commission, du 31 janvier 1973, modifiant
    les règlements (CEE) n° 1259/72, n° 1282/72 n° 1519/72, n° 1717/72, n° 2474/72,
    n° 2537/72 et n° 2561/72 relatifs à des ventes particulières de beurre en
    ce qui concerne les montants compensatoires prévus à l' acte d' adhésion
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 376/73 der Kommission vom 31. Januar 1973 zur Änderung
    der Sonderverkäufe von Butter betreffenden Verordnungen (EWG) Nr. 1259/72, Nr.
    1282/72, Nr. 1519/72, Nr. 1717/72, Nr. 2474/72, Nr. 2537/72 und Nr. 2561/72 hinsichtlich
    der in der Beitrittsakte vorgesehenen Ausgleichsbeträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 376/73 af 31. januar 1973 om ændring
    af forordningerne (EØF) nr. 1259/72, nr. 1282/72, nr 1519/72, nr. 1717/72, nr.
    2474/72, nr. 2537/72 og nr. 2561/72 om salg af smør på særlige vilkår, for
    så vidt angår de i tiltrædelsesakten fastsatte udlingingsbeløb
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 376/73 della Commissione, del 31 gennaio 1973, che
    modifica i regolamenti (CEE) n. 1259/72, n. 1282/72, n. 1519/72, n. 1717/72, n.
    2474/72, n. 2537/72 e n. 2561/72 relativi a vendite particolari di burro, per
    quanto riguarda gli importi compensativi previsti nell' atto di adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 376/73 van de Commissie van 31 januari 1973 houdende
    wijziging van de Verordeningen (EEG) nr. 1259/72, nr. 1282/72, nr. 1519/72, nr.
    1717/72, nr. 2474/72, nr. 2537/72 en nr. 2561/72 met betrekking tot de bijzondere
    afzet van boter, voor wat betreft de in de Akte van toetreding voorziene compenserende
    bedragen
  type: main
