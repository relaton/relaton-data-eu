title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 245/2009 of 18 March 2009 implementing Directive
    2005/32/EC of the European Parliament and of the Council with regard to ecodesign
    requirements for fluorescent lamps without integrated ballast, for high intensity
    discharge lamps, and for ballasts and luminaires able to operate such lamps, and
    repealing Directive 2000/55/EC of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 245/2009 de la Commission du 18 mars 2009 mettant en
    œuvre la directive 2005/32/CE du Parlement européen et du Conseil en ce qui
    concerne les exigences en matière d’écoconception applicables aux lampes fluorescentes
    sans ballast intégré, aux lampes à décharge à haute intensité, ainsi qu’aux
    ballasts et aux luminaires qui peuvent faire fonctionner ces lampes, et abrogeant
    la directive 2000/55/CE du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 245/2009 der Kommission vom 18. März 2009 zur Durchführung
    der Richtlinie 2005/32/EG des Europäischen Parlaments und des Rates im Hinblick
    auf die Festlegung von Anforderungen an die umweltgerechte Gestaltung von Leuchtstofflampen
    ohne eingebautes Vorschaltgerät, Hochdruckentladungslampen sowie Vorschaltgeräte
    und Leuchten zu ihrem Betrieb und zur Aufhebung der Richtlinie 2000/55/EG des
    Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 245/2009 на Комисията от 18
    март 2009 година за прилагане на Директива 2005/32/ЕО
    на Европейския парламент и на Съвета по отношение
    на изискванията за екопроектиране на луминесцентни
    лампи без вграден баласт, газоразрядни лампи
    с висок интензитет и баласти и осветители,
    които могат да работят с такива лампи, както
    и за отменяне на Директива 2000/55/ЕО на Европейския
    парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 245/2009 ze dne 18. března 2009 , kterým
    se provádí směrnice Evropského parlamentu a Rady 2005/32/ES, pokud jde o požadavky
    na ekodesign zářivek bez integrovaného předřadníku, vysoce intenzivních
    výbojek a předřadníků a svítidel, jež mohou sloužit k provozu těchto
    zářivek a výbojek, a kterým se zrušuje směrnice Evropského parlamentu a
    Rady 2000/55/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 245/2009 af 18. marts 2009 om gennemførelse
    af Europa-Parlamentets og Rådets direktiv 2005/32/EF i forbindelse med miljøvenligt
    design af lysstofrør uden indbygget forkobling og højtryksdamplamper samt forkoblinger
    og armaturer hertil, og om ophævelse af Europa-Parlamentets og Rådets direktiv
    2000/55/EF
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 245/2009 της Επιτροπής,
    της 18ης Μαρτίου 2009 , περί εφαρμογής της οδηγίας
    2005/32/ΕΚ του Ευρωπαϊκού Κοινοβουλίου και του
    Συμβουλίου όσον αφορά τις απαιτήσεις οικολογικού
    σχεδιασμού για τους λαμπτήρες φθορισμού χωρίς
    ενσωματωμένα στραγγαλιστικά πηνία, για τους
    λαμπτήρες εκκένωσης υψηλής έντασης καθώς και
    για τα στραγγαλιστικά πηνία και φωτιστικά
    σώματα που είναι ικανά να λειτουργούν με τους
    εν λόγω λαμπτήρες και περί κατάργησης της οδηγίας
    2000/55/ΕΚ του Ευρωπαϊκού Κοινοβουλίου και του
    Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 245/2009, 18. märts 2009 , millega rakendatakse
    Euroopa Parlamendi ja nõukogu direktiiv 2005/32/EÜ sisseehitatud liiteseadiseta
    luminofoorlampide, suure valgustugevusega lahenduslampide ning nende lampidega
    koos kasutatavate liiteseadiste ja valgustite ökodisainile esitatavate nõuete
    suhtes ning millega tunnistatakse kehtetuks Euroopa Parlamendi ja nõukogu direktiiv
    2000/55/EÜ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 245/2009, annettu 18 päivänä maaliskuuta 2009
    , Euroopan parlamentin ja neuvoston direktiivin 2005/32/EY täytäntöönpanemisesta
    loistelamppujen, joissa ei ole sisäistä virranrajoitinta, suurpainepurkauslamppujen
    sekä virranrajoittimien ja valaisimien, joissa voidaan käyttää tällaisia
    lamppuja, ekologista suunnittelua koskevien vaatimusten osalta ja Euroopan parlamentin
    ja neuvoston direktiivin 2000/55/EY kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EZ) br. 245/2009 od 18. ožujka 2009. o primjeni Direktive
    2005/32/EZ Europskog parlamenta i Vijeća s obzirom na zahtjeve za ekološki dizajn
    za fluorescentne cijevi bez ugrađenih prigušnica, visokoučinkovite žarulje
    s izbojem te prigušnice i svjetiljke koje mogu upravljati takvim žaruljama i
    o stavljanju izvan snage Direktive 2000/55/EZ Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság 245/2009/EK rendelete ( 2009. március 18.) a 2005/32/EK európai
    parlamenti és tanácsi irányelvnek a beépített előtét nélküli fénycsövek,
    nagy intenzitású kisülőlámpák és az ilyen lámpák működtetésére alkalmas
    előtétek és lámpatestek környezetbarát tervezési követelményei tekintetében
    történő végrehajtásáról, valamint a 2000/55/EK európai parlamenti és
    tanácsi irányelv hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 245/2009 della Commissione, del 18 marzo 2009 , recante
    modalità di esecuzione della direttiva 2005/32/CE del Parlamento europeo e del
    Consiglio per quanto riguarda le specifiche per la progettazione ecocompatibile
    di lampade fluorescenti senza alimentatore integrato, lampade a scarica ad alta
    intensità e di alimentatori e apparecchi di illuminazione in grado di far funzionare
    tali lampade, e che abroga la direttiva 2000/55/CE del Parlamento europeo e del
    Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 245/2009 ( 2009. gada 18. marts) par Eiropas
    Parlamenta un Padomes Direktīvas 2005/32/EK īstenošanu attiecībā uz ekodizaina
    prasībām par luminiscences lampām bez iebūvētas droseles, augstas intensitātes
    gāzizlādes lampām, kā arī šādu lampu ekspluatācijai izmantojamām droselēm
    un apgaismes iekārtām un par Eiropas Parlamenta un Padomes Direktīvas 2000/55/EK
    atcelšanu
  type: main
- language: lt
  script: Latn
  content: 2009 m. kovo 18 d. Komisijos reglamentas (EB) Nr. 245/2009, kuriuo įgyvendinama
    Europos Parlamento ir Tarybos direktyva 2005/32/EB, nustatant liuminescencinių
    lempų su įmontuotu balastiniu įtaisu, didelio intensyvumo išlydžio lempų,
    balastinių įtaisų ir tas lempas naudoti pritaikytų šviestuvų ekologinio
    projektavimo reikalavimus, ir kuriuo panaikinama Europos Parlamento ir Tarybos
    direktyva 2000/55/EB
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 245/2009 tat- 18 ta’ Marzu 2009 li
    jimplimenta d-Direttiva 2005/32/KE tal-Parlament Ewropew u tal-Kunsill dwar ir-rekwiżiti
    tal-ekodisinn għall-bozoz fluworexxenti mingħajr ballast integrata, għall-bozoz
    b’ discharge ta’ intensità għolja, u għall-ballasts u l-lampi li kapaċi
    jħaddmu bozoz ta’ dan it-tip, u li jħassar id-Direttiva 2000/55/KE tal-Parlament
    Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 245/2009 van de Commissie van 18 maart 2009 tot uitvoering
    van Richtlijn 2005/32/EG van het Europees Parlement en de Raad betreffende eisen
    inzake ecologisch ontwerp voor fluorescentielampen zonder ingebouwd voorschakelapparaat,
    voor hogedrukgasontladingslampen en voor voorschakelapparaten en armaturen die
    deze lampen kunnen laten branden, en tot intrekking van Richtlijn 2000/55/EG van
    het Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 245/2009 z dnia 18 marca 2009 r. w sprawie
    wykonania dyrektywy 2005/32/WE Parlamentu Europejskiego i Rady w odniesieniu do
    wymogów dotyczących ekoprojektu dla lamp fluorescencyjnych bez wbudowanego statecznika,
    dla lamp wyładowczych dużej intensywności, a także dla stateczników i opraw
    oświetleniowych służących do zasilania takich lamp, oraz uchylające dyrektywę
    2000/55/WE Parlamentu Europejskiego i Rady
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 245/2009 da Comissão, de 18 de Março de 2009 ,
    que dá execução à Directiva 2005/32/CE do Parlamento Europeu e do Conselho
    no que respeita aos requisitos de concepção ecológica das lâmpadas fluorescentes
    sem balastro integrado, das lâmpadas de descarga de alta intensidade e dos balastros
    e luminárias que podem funcionar com essas lâmpadas, e que revoga a Directiva
    2000/55/CE do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 245/2009 al Comisiei din 18 martie 2009 de implementare
    a Directivei 2005/32/CE a Parlamentului European și a Consiliului în ceea ce
    privește cerințele de proiectare ecologică aplicabile lămpilor fluorescente
    fără balast încorporat, lămpilor cu descărcare de intensitate ridicată,
    precum și balasturilor și corpurilor de iluminat compatibile cu aceste lămpi,
    și de abrogare a Directivei 2000/55/CE a Parlamentului European și a Consiliului
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 245/2009 z 18. marca 2009 , ktorým sa vykonáva
    smernica Európskeho parlamentu a Rady 2005/32/ES v súvislosti s požiadavkami
    na ekodizajn žiariviek bez zabudovaného predradníka, výbojok s vysokou svietivosťou
    a predradníkov a svietidiel, ktoré sú schopné ovládať takéto svetelné
    zdroje, a ktorým sa ruší smernica Európskeho parlamentu a Rady 2000/55/ES
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 245/2009 z dne 18. marca 2009 o izvajanju Direktive
    Evropskega parlamenta in Sveta 2005/32/ES v zvezi z zahtevami za okoljsko primerno
    zasnovo fluorescenčnih sijalk brez vdelanih predstikalnih naprav, visokointenzivnostnih
    sijalk in predstikalnih naprav in svetilk za delovanje teh sijalk ter o razveljavitvi
    Direktive Evropskega parlamenta in Sveta 2000/55/ES
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 245/2009 de la Comisión, de 18 de marzo de 2009 ,
    por el que se aplica la Directiva 2005/32/CE del Parlamento Europeo y del Consejo
    en lo relativo a los requisitos de diseño ecológico para lámparas fluorescentes
    sin balastos integrados, para lámparas de descarga de alta intensidad y para
    balastos y luminarias que puedan funcionar con dichas lámparas, y se deroga la
    Directiva 2000/55/CE del Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 245/2009 av den 18 mars 2009 om genomförande
    av Europaparlamentets och rådets direktiv 2005/32/EG när det gäller krav på
    ekodesign för lysrör utan inbyggt förkopplingsdon, urladdningslampor med hög
    intensitet samt förkopplingsdon och armaturer som kan driva sådana lampor och
    om upphävande av Europaparlamentets och rådets direktiv 2000/55/EG
