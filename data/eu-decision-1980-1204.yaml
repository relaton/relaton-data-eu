title:
- language: en
  script: Latn
  content: Commission Decision of 5 December 1980 authorizing the French Republic
    not to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, originating in Hong Kong (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 décembre 1980, autorisant la République
    française à exclure du traitement communautaire la ganterie de bonneterie non
    élastique ni caoutchoutée originaire de Hong-kong
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Dezember 1980 zur Ermächtigung der
    Französischen Republik, aus Hongkong stammende Handschuhe aus Gewirken, weder
    gummielastisch noch kautschutiert, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 5. december 1980 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, med oprindelse i Hongkong (Kun den
    franske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 dicembre 1980, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i guanti a maglia non elastica
    né gommata originari di Hong Kong (Il testo in lingua francese è il solo facente
    fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 december 1980 houdende machtiging van
    de Franse Republiek om handschoenen, wanten en dergelijke artikelen, van niet-
    elastisch of van niet-gegummeerd brei- of haakwerk, van oorsprong uit Hong-Kong,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)
