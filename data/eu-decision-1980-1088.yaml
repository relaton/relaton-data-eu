title:
- language: en
  script: Latn
  content: '80/1088/EEC: Commission Decision of 20 October 1980 authorizing the United
    Kingdom to extend certain protective measures with regard to fresh bananas originating
    in certain third countries (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1088/CEE: Décision de la Commission, du 20 octobre 1980, autorisant
    le Royaume-Uni à proroger certaines mesures conservatoires à l''égard des bananes
    fraîches originaires de certains pays tiers (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1088/EWG: Entscheidung der Kommission vom 20. Oktober 1980 mit der
    das Vereinigte Königreich ermächtigt wird, bestimmte vorläufige Maßnahmen
    hinsichtlich von Bananen, frisch, aus bestimmten Drittländern aufrechtzuerhalten
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1088/EØF: Kommissionens beslutning af 20. oktober 1980 om bemyndigelse
    af Det forenede Kongerige til at forlænge anvendelsen af visse beskyttelsesforanstaltninger
    vedrørende import af bananer, friske, med oprindelse i visse tredjelande (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1088/CEE: Decisione della Commissione, del 20 ottobre 1980, che autorizza
    il Regno Unito a prorogare talune misure cautelari nei confronti delle banane
    fresche originarie di taluni paesi terzi (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1088/EEG: Beschikking van de Commissie van 20 oktober 1980 waarbij
    het Verenigd Koninkrijk wordt gemachtigd tot verlenging van bepaalde te nemen
    beschermende maatregelen ten aanzien van verse bananen van oorsprong uit bepaalde
    derde landen (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
