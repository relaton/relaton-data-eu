    kuningaskuntaa koskevien poikkeusten voimassaolon päättymispäivän vahvistamiseksi
  type: main
- language: it
  script: Latn
  content: Direttiva 89/460/CEE del Consiglio del 18 luglio 1989 che modifica la direttiva
    85/3/CEE relativa ai pesi, alle dimensioni e a certe altre caratteristiche tecniche
    di taluni veicoli stradali, allo scopo di stabilire la data di scadenza delle
    deroghe concesse all'Irlanda e al Regno Unito
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/460/EEG van de Raad van 18 juli 1989 tot wijziging van Richtlijn
    85/3/EEG betreffende de gewichten, de afmetingen en sommige andere technische
    kenmerken van bepaalde wegvoertuigen met het oog op de vaststelling van de datum
    waarop de aan Ierland en het Verenigd Koninkrijk toegestane afwijkingen verstrijken
  type: main
- language: pt
  script: Latn
