title:
- language: en
  script: Latn
  content: Council Directive 89/460/EEC of 18 July 1989 amending, with a view to fixing
    an expiry date for the derogations accorded to Ireland and the United Kingdom,
    Directive 85/3/EEC on the weights, dimensions and certain other technical characteristics
    of certain road vehicles
  type: main
- language: fr
  script: Latn
  content: Directive 89/460/CEE du Conseil du 18 juillet 1989 modifiant, en vue de
    fixer la date d'expiration des dérogations accordées à l'Irlande et au Royaume-Uni,
    la directive 85/3/CEE relative aux poids, aux dimensions et à certaines autres
    caractéristiques techniques de certains véhicules routiers
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/460/EWG des Rates Vom 18. Juli 1989 zur Änderung der Richtlinie
