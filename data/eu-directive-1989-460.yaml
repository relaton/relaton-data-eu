    bestimmter Straßenfahrzeuge hinsichtlich der Festlegung des Fristablaufs der
    Ausnahmeregelung für Irland und das Vereinigte Königreich
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/460/EØF af 18. juli 1989 om ændring af direktiv 85/3/EØF
