  type: main
- language: nl
  script: Latn
  content: '2014/420/EU: Besluit van de Raad van 23 juni 2014 over het door de Europese
    Unie in te nemen standpunt in het Gemengd Comité dat is opgericht bij de Overeenkomst
    tussen de Europese Economische Gemeenschap en de Republiek IJsland van 22 juli
    1972 , wat betreft de vervanging van Protocol nr. 3 bij deze overeenkomst betreffende
    de definitie van het begrip „producten van oorsprong” en methoden van administratieve
    samenwerking, door een nieuw protocol waarin, wat de oorsprongsregels betreft,
    naar de Regionale Conventie betreffende de pan-Euro-mediterrane preferentiële
    oorsprongsregels wordt verwezen'
  type: main
- language: pl
  script: Latn
  content: '2014/420/UE: Decyzja Rady z dnia 23 czerwca 2014 r. w sprawie stanowiska,
    jakie ma zostać przyjęte przez Unię Europejską w ramach Wspólnego Komitetu
    ustanowionego Umową między Europejską Wspólnotą Gospodarczą a Republiką
    Islandii z dnia 22 lipca 1972 r. w odniesieniu do zastąpienia Protokołu 3 do
    tej umowy dotyczącego definicji pojęcia „produkty pochodzące” oraz metod
    współpracy administracyjnej nowym protokołem, który w odniesieniu do reguł
    pochodzenia odwołuje się do Regionalnej konwencji w sprawie paneurośródziemnomorskich
    preferencyjnych reguł pochodzenia'
  type: main
- language: pt
  script: Latn
  content: '2014/420/UE: Decisão do Conselho, de 23 de junho de 2014 , relativa à
    posição a adotar pela União Europeia no âmbito do Comité Misto instituído
    pelo Acordo entre a Comunidade Económica Europeia e a República da Islândia
    de 22 de julho de 1972 , sobre a substituição do Protocolo n. ° 3 do referido
    Acordo, relativo à definição do conceito de «produtos originários» e aos
    métodos de cooperação administrativa, por um novo protocolo que, no que se
    refere às regras de origem, remeta para a Convenção Regional sobre Regras de
    Origem Preferenciais Pan-Euromediterrânicas'
  type: main
- language: ro
  script: Latn
  content: '2014/420/UE: Decizia Consiliului din 23 iunie 2014 privind poziția care
    urmează să fie adoptată de Uniunea Europeană în cadrul Comitetului mixt instituit
    prin Acordul dintre Comunitatea Economică Europeană și Republica Islanda de
    la 22 iulie 1972 , în legătură cu înlocuirea Protocolului nr. 3 la respectivul
    acord, privind definirea conceptului de „produse originare” și metodele de
    cooperare administrativă, cu un nou protocol care, în ceea ce privește regulile
    de origine, să facă trimitere la Convenția regională cu privire la regulile
    de origine preferențiale pan-euro-mediteraneene'
  type: main
- language: sk
  script: Latn
  content: '2014/420/EÚ: Rozhodnutie Rady z 23. júna 2014 o pozícii, ktorú má
    Európska únia zaujať v spoločnom výbore zriadenom Dohodou medzi Európskym
    hospodárskym spoločenstvom a Islandskou republikou z 22. júla 1972 , pokiaľ
    ide o nahradenie protokolu 3 k uvedenej dohode týkajúceho sa vymedzenia pojmu
    „pôvodné výrobky“ a metód administratívnej spolupráce novým protokolom,
    ktorý, pokiaľ ide o pravidlá pôvodu, odkazuje na regionálny dohovor o paneuro-stredomorských
    preferenčných pravidlách pôvodu'
  type: main
- language: sl
  script: Latn
  content: '2014/420/EU: Sklep Sveta z dne 23. junija 2014 o stališču, ki ga Evropska
    unija sprejme v Skupnem odboru, ustanovljenim s Sporazumom med Evropsko gospodarsko
    skupnostjo in Republiko Islandijo z dne 22. julija 1972 , glede nadomestitve Protokola
    3 k navedenemu sporazumu o opredelitvi pojma „izdelki s poreklom“ in načinih
    upravnega sodelovanja z novim protokolom, ki se v zvezi s pravili o poreklu sklicuje
    na Regionalno konvencijo o pan-evro-mediteranskih preferencialnih pravilih o poreklu'
  type: main
- language: es
  script: Latn
  content: '2014/420/UE: Decisión del Consejo, de 23 de junio de 2014 , relativa
    a la posición que deberá adoptar la Unión Europea en el seno del Comité Mixto
    instituido por el Acuerdo entre la Comunidad Económica Europea y la República
    de Islandia, de 22 de julio de 1972 , por lo que respecta a la sustitución de
    su Protocolo n ° 3 relativo a la definición de la noción de «productos originarios»
    y métodos de cooperación administrativa, por un nuevo Protocolo que, por lo
    que respecta a las normas de origen, se refiera al Convenio regional sobre las
    normas de origen preferenciales paneuromediterráneas'
  type: main
- language: sv
  script: Latn
  content: '2014/420/EU: Rådets beslut av den 23 juni 2014 om den ståndpunkt som
    Europeiska unionen ska inta i den gemensamma kommitté som inrättades genom avtalet
    av den 22 juli 1972 mellan Europeiska ekonomiska gemenskapen och Republiken Island
    beträffande ersättande av protokoll 3 (om definition av begreppet ”ursprungsprodukter”
    och om metoder för administrativt samarbete) till avtalet med ett nytt protokoll,
    som vad gäller ursprungsregler hänvisar till den regionala konventionen om Europa–Medelhavstäckande
    regler om förmånsursprung'
