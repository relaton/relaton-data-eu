    διοικητικής συνεργασίας, με νέο πρωτόκολλο
    το οποίο, όσον αφορά τους κανόνες καταγωγής,
    παραπέμπει στην περιφερειακή σύμβαση για πανευρωμεσογειακούς
    προτιμησιακούς κανόνες καταγωγής'
  type: main
- language: et
  script: Latn
  content: '2014/420/EL: Nõukogu otsus, 23. juuni 2014 , Euroopa Liidu seisukoha
