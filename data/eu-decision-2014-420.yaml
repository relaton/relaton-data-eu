title:
- language: en
  script: Latn
  content: '2014/420/EU: Council Decision of 23 June 2014 on the position to be adopted
    by the European Union within the Joint Committee established by the Agreement
    between the European Economic Community and the Republic of Iceland of 22 July
    1972 , as regards the replacement of Protocol 3 to that Agreement, concerning
    the definition of the concept of ‘originating products’ and methods of administrative
    cooperation, by a new Protocol which, as regards the rules of origin, refers to
    the Regional Convention on pan-Euro-Mediterranean preferential rules of origin'
  type: main
- language: fr
  script: Latn
  content: '2014/420/UE: Décision du Conseil du 23 juin 2014 relative à la position
    à prendre par l''Union européenne au sein du comité mixte institué par l''accord
    entre la Communauté économique européenne et la République d''Islande du 22
    juillet 1972 en ce qui concerne le remplacement du protocole n ° 3 à cet accord,
    relatif à la définition de la notion de «produits originaires» et aux méthodes
    de coopération administrative, par un nouveau protocole qui, pour ce qui est
    des règles d''origine, fait référence à la convention régionale sur les règles
    d''origine préférentielles paneuro-méditerranéennes'
  type: main
- language: de
  script: Latn
  content: '2014/420/EU: Beschluss des Rates vom 23. Juni 2014 über den von der Europäischen
    Union einzunehmenden Standpunkt im Gemischten Ausschuss, der gemäß dem Abkommen
    vom 22. Juli 1972 zwischen der Europäischen Wirtschaftsgemeinschaft und der Republik
    Island eingesetzt wurde, hinsichtlich der Ersetzung des Protokolls Nr. 3 dieses
    Abkommens über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“
    oder „Ursprungserzeugnisse“ und über die Methoden der Zusammenarbeit der
    Verwaltungen durch ein neues Protokoll, das hinsichtlich der Ursprungsregeln auf
    das Regionale Übereinkommen über Pan-Europa-Mittelmeer-Präferenzursprungsregeln
    verweist'
  type: main
- language: bg
  script: Cyrl
  content: '2014/420/ЕС: Решение на Съвета от 23 юни 2014 година
    относно позицията, която да бъде приета от
    Европейския съюз в рамките на Съвместния комитет,
    създаден по силата на Споразумението между
    Европейската икономическа общност и Република
    Исландия от 22 юли 1972 г. , във връзка със замяната
    на Протокол № 3 относно определението на понятието
    „продукти с произход“ и методите на административно
    сътрудничество към посоченото споразумение
    с нов протокол, в който по отношение на правилата
    за произход се прави препратка към Регионалната
    конвенция за паневросредиземноморските преференциални
    правила за произход'
  type: main
- language: cs
  script: Latn
  content: '2014/420/EU: Rozhodnutí Rady ze dne 23. června 2014 o postoji, který
    má Evropská unie zaujmout ve smíšeném výboru zřízeném dohodou mezi Evropským
    hospodářským společenstvím a Islandskou republikou ze dne 22. července 1972
    , pokud jde o nahrazení protokolu č. 3 k uvedené dohodě o definici pojmu „původní
    produkty“ a metodách správní spolupráce novým protokolem, který, pokud
    jde o pravidla původu, odkazuje na Regionální úmluvu o celoevropsko-středomořských
    pravidlech původu'
  type: main
- language: da
  script: Latn
  content: '2014/420/EU: Rådets afgørelse af 23. juni 2014 om den holdning, som
    Den Europæiske Union skal indtage i Det Blandede Udvalg, der er nedsat i henhold
    til overenskomsten mellem Det Europæiske Økonomiske Fællesskab og Republikken
    Island af 22. juli 1972 , vedrørende erstatning af nævnte overenskomsts protokol
    nr. 3 om definitionen af begrebet »produkter med oprindelsesstatus« og ordninger
    for administrativt samarbejde med en ny protokol, hvori der for så vidt angår
    oprindelsesreglerne henvises til den regionale konvention om pan-Euro-Middelhavs-regler
    for præferenceoprindelse'
  type: main
- language: el
  script: Grek
  content: '2014/420/EΕ: Απόφαση του Συμβουλίου, της 23ης
    Ιουνίου 2014 , σχετικά με τη θέση που πρέπει να
    λάβει η Ευρωπαϊκή Ένωση στο πλαίσιο της Μεικτής
    Επιτροπής που συγκροτήθηκε με τη συμφωνία
    μεταξύ της Ευρωπαϊκής Οικονομικής Κοινότητας
    και της Δημοκρατίας της Ισλανδίας, της 22ας
    Ιουλίου 1972 , όσον αφορά την αντικατάσταση του
