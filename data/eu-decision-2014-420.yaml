  type: main
- language: fi
  script: Latn
  content: '2014/420/EU: Neuvoston päätös, annettu 23 päivänä kesäkuuta 2014
    , Euroopan talousyhteisön ja Islannin tasavallan välillä 22 päivänä heinäkuuta
    1972 tehdyllä sopimuksella perustetussa sekakomiteassa esitettävästä Euroopan
    unionin kannasta käsitteen ”alkuperätuotteet” määrittelyä ja hallinnollisen
    yhteistyön menetelmiä koskevan pöytäkirjan N:o 3 korvaamiseen uudella pöytäkirjalla,
    jossa alkuperäsääntöjen osalta viitataan etuuskohteluun oikeuttavia Paneurooppa–Välimeri-alkuperäsääntöjä
    koskevaan alueelliseen yleissopimukseen'
  type: main
- language: hr
  script: Latn
  content: '2014/420/EU: Odluka Vijeća od 23. lipnja 2014. o stajalištu koje treba
    donijeti Europska unija u okviru Zajedničkog odbora osnovanog Sporazumom između
    Europske ekonomske zajednice i Republike Islanda od 22. srpnja 1972. , u pogledu
    zamjene Protokola 3. uz taj sporazum o definiciji pojma „proizvodi s podrijetlom”
    i načinima administrativne suradnje novim protokolom u kojem se u pogledu pravila
    podrijetla upućuje na Regionalnu konvenciju o Pan-Euro-Mediteranskim povlaštenim
    pravilima podrijetla'
  type: main
- language: hu
  script: Latn
  content: '2014/420/EU: A Tanács határozata ( 2014. június 23. ) az Európai Gazdasági
    Közösség és az Izlandi Köztársaság közötti, 1972. július 22-i megállapodással
    létrehozott vegyes bizottságon belül az említett megállapodáshoz csatolt,
    a származó termék fogalmának meghatározásáról és az igazgatási együttműködés
    módszereiről szóló 3. jegyzőkönyvnek egy új, a származási szabályok
    tekintetében a pán-euromediterrán preferenciális származási szabályokról
    szóló regionális egyezményre hivatkozó jegyzőkönyvvel történő helyettesítésével
    összefüggésben az Európai Unió által képviselendő álláspontról'
  type: main
- language: it
  script: Latn
  content: '2014/420/UE: Decisione del Consiglio, del 23 giugno 2014 , relativa alla
    posizione che l''Unione europea deve adottare in seno al Comitato misto istituito
    dall''accordo tra la Comunità economica europea e la Repubblica d''Islanda del
    22 luglio 1972 per quanto riguarda la sostituzione del protocollo n. 3 del suddetto
    accordo, relativo alla definizione della nozione di «prodotti originari» e ai
    metodi di cooperazione amministrativa, con un nuovo protocollo che, per quanto
    riguarda le norme di origine, faccia riferimento alla convenzione regionale sulle
    norme di origine preferenziali paneuromediterranee'
  type: main
- language: lv
  script: Latn
  content: '2014/420/ES: Padomes Lēmums ( 2014. gada 23. jūnijs ) par nostāju,
