  script: Latn
  content: Commission Regulation (EEC) No 1224/91 of 8 May 1991 re- establishing the
    levying of customs duties on products falling within CN codes 3102 30 10 and 3102
    30 90, originating in Poland, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
