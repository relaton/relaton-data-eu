id: EURegulation29721978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2972/78 of 15 December 1978 re-establishing
    the levying of customs duties on wood sawn lengthwise, sliced or peeled but not
    further prepared, etc., falling within subheading 44.14 B and originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2972/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux bois simplement
    sciés longitudinalement, tranchés ou déroulés, etc., de la sous-position tarifaire
    44.14 B, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2972/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Holz, in der Längsrichtung gesägt, gemessert oder geschält,
    usw., der Tarifstelle 44.14 B, mit Ursprung in Entwicklungsländern, denen die
    in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2972/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for træ, savet i længderetningen, skåret eller
    skrællet, under underposition 44.14 B, som har oprindelse i udviklingslande og
    omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr.
    2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2972/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili al legno semplicemente
    segato per il lungo, tranciato o sfogliato, ecc., della sottovoce doganale 44.14
    B, originario dei paesi in via di sviluppo, beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2972/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten voor hout, enkel overlangs
    gezaagd of enkel gesneden of geschild, enz., van onderverdeling 44.14 B, van oorsprong
    uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad algemene tariefpreferenties werden geopend
  type: main
