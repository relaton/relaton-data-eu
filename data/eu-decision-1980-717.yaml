title:
- language: en
  script: Latn
  content: '80/717/EEC: Commission Decision of 7 July 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''TSI laser anemometer system, consisting of: 1090 tracking
    system, 925 laser and base, 901-2 polarization rotator, 910-2 transmitting optics,
    930 receiving optics, 960 photomultiplier system, 980-2 frequency shifter'' ,
    are fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/717/CEE: Décision de la Commission, du 7 juillet 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "TSI-Laser Anemometer System,
    consisting of: 1090 tracking system, 925 laser and base, 901-2 polarization rotator,
    910-2 transmitting optics, 930 receiving optics, 960 photomultiplier system, 980-2
    frequency shifter" sont remplies'
  type: main
- language: de
  script: Latn
  content: '80/717/EWG: Entscheidung der Kommission vom 7. Juli 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung des wissenschaftlichen Geräts ,,TSI-Laser
    Anemometer System, consisting of: 1019 tracking system, 925 laser and base, 901-2
    polarization rotator, 910-2 transmitting optics, 930 receiving optics, 960 photomultiplier
    system, 980-2 frequency shifter'' '' , von den Zöllen des Gemeinsamen Zolltarifs
    erfüllt sind'
  type: main
- language: da
  script: Latn
  content: '80/717/EØF: Kommissionens beslutning af 7. juli 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "TSI - Laser Anemometer System, consisting of: -
    1090 tracking system, - 925 laser and base, - 901-2 polarization rotator, - 910-2
    transmitting optics, - 930 receiving optics, - 960 photomultiplier system, - 980-2
    frequency shifter" er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/717/ΕΟΚ: Απόφαση τής Επιτροπής τής 7ης Ιουλίου
    1980 περί διαπιστώσεως ότι οι απαιτούμενοι όροι
    γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
