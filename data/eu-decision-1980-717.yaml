    doganale comune dell'' apparecchio scientifico denominato "TSI laser anemometer
    system, consisting of: 1090 tracking system, 925 laser and base, 901-2 polarization
    rotator, 910-2 transmitting optics, 930 receiving optics, 960 photomultiplier
    system, 980-2 frequency shifter" sono soddisfatte'
  type: main
