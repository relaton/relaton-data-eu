- language: en
  script: Latn
  content: Commission Regulation (EU) No 34/2013 of 16 January 2013 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for 2-phenylphenol, ametoctradin,
    Aureobasidium pullulans strains DSM 14940 and DSM 14941, cyproconazole, difenoconazole,
    dithiocarbamates, folpet, propamocarb, spinosad, spirodiclofen, tebufenpyrad and
    tetraconazole in or on certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 34/2013 de la Commission du 16 janvier 2013 modifiant
    les annexes II, III et IV du règlement (CE) n ° 396/2005 du Parlement européen
    et du Conseil en ce qui concerne les limites maximales applicables aux résidus
    du 2-phénylphénol, de l’amétoctradine, des souches DSM 14940 et DSM 14941
    d’ Aureobasidium pullulans , du cyproconazole, du difénoconazole, des dithiocarbamates,
    du folpet, du propamocarbe, du spinosad, du spirodiclofène et du tébufenpyrade
    présents dans ou sur certains produits
  type: main
