title:
- language: en
  script: Latn
  content: Council Directive 85/614/EEC of 20 December 1985 amending, on account of
    the accession of Spain and Portugal, Directive 85/384/EEC on the mutual recognition
    of diplomas, certificates and other evidence of formal qualifications in architecture,
    including measures to facilitate the effective exercise of the right of establishment
    and freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Directive 85/614/CEE du Conseil du 20 décembre 1985 modifiant, en raison
    de l'adhésion de l'Espagne et du Portugal, la directive 85/384/CEE visant à
    la reconnaissance mutuelle des diplômes, certificats et autres titres du domaine
    de l'architecture et comportant des mesures destinées à faciliter l'exercice
    effectif du droit d'établissement et de la libre prestation de services
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/614/EWG des Rates vom 20. Dezember 1985 zur Änderung aufgrund
    des Beitritts Spaniens und Portugals der Richtlinie 85/384/EWG für die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    auf dem Gebiet der Architektur und für Maßnahmen zur Erleichterung der tatsächlichen
    Ausübung des Niederlassungsrechts und des Rechts auf freien Dienstleistungsverkehr
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 20 декември 1985 година
    за изменение, във връзка с присъединяването
    на Испания и Португалия, на Директива 85/384/ЕИО
    за взаимното признаване на дипломи, удостоверения
    и други официални документи по архитектура,
    включително мерки за улесняване ефективното
    упражняване на правото на установяване и свободното
    предоставяне на услуги
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 20. prosince 1985, kterou se vzhledem k přistoupení
    Španělska a Portugalska mění směrnice 85/384/EHS o vzájemném uznávání
    diplomů, osvědčení a jiných dokladů o dosažené kvalifikaci v oboru architektury
    obsahující opatření k usnadnění účinného výkonu práva usazování a
    volného pohybu služeb
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 85/614/EØF af 20. december 1985 om ændring, som følge
    af Spaniens og Portugals tiltrædelse, af direktiv 85/384/EØF om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser inden for arkitekturområdet,
    herunder om foranstaltninger, som skal lette den faktiske udøvelse af retten
    til etablering og fri udveksling af tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 85/614/ΕΟΚ του Συμβουλίου της 20ής Δεκεμβρίου
