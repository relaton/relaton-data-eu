  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 85/614/ETY, annettu 20 päivänä joulukuuta 1985,
    tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta osoittavien
    asiakirjojen vastavuoroisesta tunnustamisesta arkkitehtuurin alalla sekä toimenpiteistä
    sijoittautumisoikeuden ja palvelujen tarjoamisen vapauden tehokkaan käyttämisen
    helpottamiseksi annetun direktiivin 85/384/ETY muuttamisesta Espanjan ja Portugalin
    liittymisen vuoksi
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1985. december 20.) az építészmérnöki oklevelek,
    bizonyítványok és a képesítés megszerzéséről szóló egyéb tanúsítványok
    kölcsönös elismeréséről, valamint a letelepedés és a szolgáltatásnyújtás
    szabadságának tényleges gyakorlását elősegítő intézkedésekről szóló
    85/384/EGK irányelvnek Spanyolország és Portugália csatlakozása következtében
    szükségessé váló módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 85/614/CEE del Consiglio del 20 dicembre 1985 che modifica, in
    seguito all'adesione della Spagna e del Portogallo, la direttiva 85/384/CEE concernente
    il reciproco riconoscimento dei diplomi, certificati ed altri titoli del settore
    dell'architettura e comportante misure destinate ad agevolare l'esercizio effettivo
    del diritto di stabilimento e di libera prestazione di servizi
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1985. gada 20. decembris), ar ko groza, ņemot vērā
    Spānijas un Portugāles pievienošanos, Direktīvu Nr. 85/384/EEK par arhitektu
    diplomu, sertifikātu un citu kvalifikāciju apliecinošu dokumentu savstarpēju
    atzīšanu, tostarp par pasākumiem, kas palīdz sekmīgi īstenot tiesības veikt
    uzņēmējdarbību un brīvību sniegt pakalpojumus
  type: main
- language: lt
  script: Latn
  content: 1985 m. gruodžio 20 d. Tarybos Direktyva dėl Ispanijos ir Portugalijos
    įstojimo iš dalies keičianti Direktyvą 85/384/EEB dėl architektūros diplomų,
    pažymėjimų ir kitų oficialią kvalifikaciją patvirtinančių dokumentų abipusio
    pripažinimo, įskaitant priemones, padedančias veiksmingai naudotis įsisteigimo
    teise ir laisve teikti paslaugas
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tal-20 ta' Diċembru 1985. li temenda, minħabba
    l-adeżjoni ta' Spanja u tal-Portugall, id-Direttiva 85/384/KEE dwar ir-rikonoxximent
    reċiproku tad-diplomi, taċ-ċertifikati u ta' evidenza oħra ta' kwalifiki formali
    fl-arkitettura, inklużi miżuri sabiex jiġi ffaċilitat l-eżerċizzju effettiv
    tad-dritt ta' stabbiliment u tal-libertà ta' provvediment ta' servizzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 85/614/EEG van de Raad van 20 december 1985 tot wijziging, in
    verband met de toetreding van Spanje en Portugal, van Richtlijn 85/384/EEG inzake
    de onderlinge erkenning van de diploma's, certificaten en andere titels op het
    gebied van de architectuur, tevens houdende maatregelen tot vergemakkelijking
    van de daadwerkelijke uitoefening van het recht van vestiging en vrij verrichten
    van diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 20 grudnia 1985 r. zmieniająca, ze względu na przystąpienie
    Hiszpanii i Portugalii, dyrektywę 85/384/EWG w sprawie wzajemnego uznawania dyplomów,
    świadectw i innych dokumentów potwierdzających posiadanie kwalifikacji w dziedzinie
    architektury, łącznie ze środkami ułatwiającymi skuteczne korzystanie z prawa
    przedsiębiorczości i swobody świadczenia usług
  type: main
- language: pt
  script: Latn
  content: Directiva 85/614/CEE do Conselho, de 20 de Dezembro de 1985, que altera,
    na sequência da adesão de Espanha e Portugal, a Directiva 85/384/CEE relativa
    ao reconhecimento mútuo dos diplomas, certificados e outros títulos do domínio
    da arquitectura, incluindo medidas destinadas a facilitar o exercício efectivo
    do direito de estabelecimento e de livre prestação de serviços
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 20 decembrie 1985 de modificare, în vederea
    aderării Spaniei și a Portugaliei, a Directivei 85/384/CEE privind recunoașterea
    reciprocă a diplomelor, a certificatelor și a altor titluri oficiale de calificare
    în domeniul arhitecturii, inclusiv a măsurilor de facilitare a exercitării
    efective a dreptului de stabilire și a libertății de a presta servicii
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 20. decembra 1985, ktorou sa v dôsledku pristúpenia Španielska
    a Portugalska mení a dopĺňa smernica 85/384/EHS o vzájomnom uznávaní diplomov,
    osvedčení a iných dokladov o formálnych kvalifikáciách v oblasti architektúry
    a o opatreniach na uľahčenie účinného uplatňovania práva usadiť sa a slobody
    poskytovať služby
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 20. decembra 1985 o spremembah Direktive 85/384/EGS
    o vzajemnem priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah
    v arhitekturi, skupaj z ukrepi za učinkovito uresničevanje pravice do ustanavljanja
    podjetij in svobode opravljanja storitev, zaradi pristopa Španije in Portugalske
  type: main
- language: es
  script: Latn
  content: Directiva 85/614/CEE del Consejo, de 20 de diciembre de 1985, por la que
    se modifica, con motivo de la adhesión de España y de Portugal, la Directiva
    85/384/CEE referente al reconocimiento mutuo de diplomas, certificados y otros
    títulos en materia de arquitectura e incluyendo medidas destinadas a facilitar
    el ejercicio efectivo del derecho de establecimiento y de la libre prestación
    de servicios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 85/614/EEG av den 20 december 1985 om ändring, på grund
    av Spaniens och Portugals anslutning, av direktiv 85/384/EEG om det ömsesidiga
    erkännandet av utbildnings-, examens- och andra behörighetsbevis på arkitekturområdet,
    däribland åtgärder för att underlätta ett effektivt utövande av etableringsrätten
    och friheten att tillhandahålla tjänster
