    niiden laatuominaisuuksien vuoksi huomattavasti kysyntää pienemmäksi (Ainoastaan
    saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '97/280/CE: Decisione della Commissione del 17 aprile 1997 con la quale
