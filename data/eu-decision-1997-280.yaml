    που παράγονται σε καθορισμένες περιοχές της
    Αυστρίας είναι, λόγω των ποιοτικών χαρακτηριστικών
    αυτών των οίνων, κατά πολύ μικρότερη από τη
    ζήτηση (Το κείμενο στη γερμανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/280/EY: Komission päätös, tehty 17 päivänä huhtikuuta 1997, tiettyjen
