title:
- language: en
  script: Latn
  content: '97/280/EC: Commission Decision of 17 April 1997 recognizing that the production
    of certain quality wines produced in specified regions in Austria, by reason of
    their qualitative characteristics, is far from able to satisfy demand (Only the
    German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/280/CE: Décision de la Commission du 17 avril 1997 reconnaissant que
    la production de certains vins de qualité produits dans des régions déterminées
    en Autriche est, du fait des caractéristiques qualitatives de ces vins, largement
    inférieure à la demande (Le texte en langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/280/EG: Entscheidung der Kommission vom 17. April 1997 zur Feststellung,
    daß die Erzeugung von Qualitätsweinen bestimmter Anbaugebiete in Österreich
    wegen qualitativer Merkmale der Nachfrage nicht entspricht (Nur der deutsche Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/280/EF: Kommissionens beslutning af 17. april 1997 om anerkendelse
    af, at produktionen af visse kvalitetsvine fra bestemte dyrkningsområder i Østrig
    på grund af disse vines kvalitative egenskaber langtfra er tilstrækkelig til
    at dække efterspørgslen (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/280/ΕΚ: Απόφαση της Επιτροπής της 17ης Απριλίου
