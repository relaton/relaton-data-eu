    caratteristiche qualitative di tali vini (Il testo in lingua tedesca è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '97/280/EG: Beschikking van de Commissie van 17 april 1997 houdende erkenning
    van het feit dat de productie van bepaalde v.q.p.r.d.''s in Oostenrijk, gezien
    de kwaliteitskenmerken van deze wijnen, ver bij de vraag achterblijft (Slechts
    de tekst in de Duitse taal is authentiek)'
  type: main
