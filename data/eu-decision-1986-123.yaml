    Community and the Government of Canada relating to the claim by the European Economic
    Community for compensation arising from the extension of quotas on imports into
    Canada of women'' s and girls'' footwear for the period 1 December 1985 to 30
    November 1988'
  type: main
- language: fr
  script: Latn
