title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1990/72 de la Commission, du 18 septembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux barres, profilés et fils de section pleine, en aluminium, de la position
    tarifaire 76.02, originaires de la Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre
    1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1990/72 der Kommission vom 18. September 1972 zur
    Wiedereinführung des Zollsatzes des Gemeinsamen Zolltarifs für Stäbe, Profile
    und Draht, aus Aluminium, massiv, der Tarifnummer 76.02, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1990/72 della Commissione, del 18 settembre 1972,
    che ripristina la riscossione dei dazi della tariffa doganale comune applicabili
    alle barre, profilati e fili di sezione piena, di alluminio, della voce doganale
    n. 76.02 originari della Iugoslavia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1990/72 van de Commissie van 18 september 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op staven, profielen en draad, massief, van aluminium, van post
    76.02, van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG)
    nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties werden
    geopend
  type: main
