    der 109. Tagung des Schiffssicherheitsausschusses in Bezug auf die Annahme von
    Änderungen des Internationalen Codes für die Sicherheit von Schiffen, die Gase
    oder andere Brennstoffe mit niedrigem Flammpunkt verwenden (IGF-Code), zu vertretenden
    Standpunkt
  type: main
- language: bg
  script: Cyrl
