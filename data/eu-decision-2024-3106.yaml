title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/3106 of 26 November 2024 on the position to
    be taken on behalf of the European Union within the International Maritime Organization’s
    Maritime Safety Committee at its 109th session as regards the adoption of amendments
    to the International Code of Safety for Ships using Gases or other Low-flashpoint
    Fuels (IGF Code)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3106 du Conseil du 26 novembre 2024 relative à la
    position à prendre au nom de l’Union européenne au sein du comité de la sécurité
    maritime de l’Organisation maritime internationale, lors de sa 109e session,
    en ce qui concerne l’adoption d’amendements au recueil international de règles
    de sécurité applicables aux navires qui utilisent des gaz ou d’autres combustibles
    à faible point d’éclair (recueil IGF)
  type: main
- language: de
  script: Latn
