id: EURegulation16081980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1608/80 of 25 June 1980 re-establishing
    the levying of customs duties on household utensils of wood, falling within heading
    No 44.24 and originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1608/80 de la Commission, du 25 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux ustensiles
    de ménage en bois, de la position 44.24 du tarif douanier commun, originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1608/80 der Kommission vom 25. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Haushaltsgeräte aus Holz der Tarifnummer 44.24, mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1608/80 af 25. juni 1980 om genindførelse
    af opkrævning af toldafgifter for husholdingsartikler af træ, under pos. 44.24,
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1608/80 della Commissione, del 25 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di uso domestico
    di legno della voce 44.24 della tariffa doganale comune, originari della Tailandia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1608/80 van de Commissie van 25 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op huishoudelijke
    artikelen van hout, van post 44.24, van oorsprong uit Thailand ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
