    għandhom jittieħdu sabiex jiskoraġġixxu d-diverzjoni ta' ċerti sostanzi għall-manifattura
    illeċita ta' drogi narkotiċi u sustanzi psikotropiċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 988/2002 van de Raad van 3 juni 2002 tot wĳziging
    van Verordening (EEG) nr. 3677/90 houdende maatregelen om te voorkomen dat bepaalde
    stoffen worden misbruikt voor de illegale vervaardiging van verdovende middelen
    en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 988/2002 z dnia 3 czerwca 2002 r. zmieniające
    rozporządzenie (EWG) nr 3677/90 ustanawiające środki, które powinny być podjęte
    w celu uniemożliwiania wykorzystywania niektórych substancji do nielegalnego
    wytwarzania środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 988/2002 do Conselho, de 3 de Junho de 2002, que
    altera o Regulamento (CEE) n.° 3677/90 que estabelece as medidas a adoptar para
    evitar o desvio de determinadas substâncias para o fabrico ilegal de estupefacientes
    e de substâncias psicotrópicas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 988/2002 z 3. júna 2002, ktorým sa mení a dopĺňa
    nariadenie (EHS) č. 3677/90, ktorým sa stanovujú opatrenia, ktoré treba prijať,
    aby sa zabránilo zneužívaniu určitých látok na nedovolenú výrobu omamných
    látok a psychotropných látok
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 988/2002 z dne 3. junija 2002 o spremembi Uredbe
