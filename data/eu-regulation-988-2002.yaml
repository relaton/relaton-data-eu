title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 988/2002 of 3 June 2002 amending Regulation
    (EEC) No 3677/90 laying down measures to be taken to discourage the diversion
    of certain substances to the illicit manufacture of narcotic drugs and psychotropic
    substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 988/2002 du Conseil du 3 juin 2002 modifiant le règlement
    (CEE) n° 3677/90 relatif aux mesures à prendre afin d'empêcher le détournement
    de certaines substances pour la fabrication illicite de stupéfiants ou de substances
    psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 988/2002 des Rates vom 3. Juni 2002 zur Änderung der
    Verordnung (EWG) Nr. 3677/90 über Maßnahmen gegen die Abzweigung bestimmter
    Stoffe zur unerlaubten Herstellung von Suchtstoffen und psychotropen Substanzen
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 988/2002 ze dne 3. června 2002, kterým se mění
    nařízení (EHS) č. 3677/90 o opatřeních, která mají být přijata za účelem
    zamezení zneužívání určitých látek k nedovolené výrobě omamných a
    psychotropních látek
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 988/2002 af 3. juni 2002 om ændring af forordning
    (EØF) nr. 3677/90 om foranstaltninger til modvirkning af ulovlig anvendelse af
    visse stoffer til fremstilling af narkotika og psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 988/2002 του Συμβουλίου,
    της 3ης Ιουνίου 2002, για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3677/90 για τη θέσπιση μέτρων
    για την πρόληψη της διοχέτευσης ορισμένων
    ουσιών στην παράνομη παρασκευή ναρκωτικών
    και ψυχοτρόπων ουσιών
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 988/2002, 3. juuni 2002, millega muudetakse
    määrust (EMÜ) nr 3677/90, millega kehtestatakse meetmed, et tõkestada narkootiliste
    ja psühhotroopsete ainete ebaseaduslikuks valmistamiseks kasutatavate teatavate
    ainete levikut
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 988/2002, annettu 3 päivänä kesäkuuta 2002,
    toimenpiteistä tiettyjen aineiden kulkeutumisen estämiseksi huumausaineiden
    tai psykotrooppisten aineiden laittomaan valmistukseen annetun asetuksen (ETY)
    N:o 3677/90 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 988/2002/EK rendelete (2002. június 3.) az egyes anyagok kábítószerek
    és pszichotróp anyagok tiltott előállítására való eltérítésének megakadályozására
    irányuló intézkedések megállapításáról szóló 3677/90/EGK tanácsi rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 988/2002 del Consiglio, del 3 giugno 2002, che modifica
    il regolamento (CEE) n. 3677/90 recante misure intese a scoraggiare la diversione
    di talune sostanze verso la fabbricazione illecita di stupefacenti o di sostanze
    psicotrope
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 988/2002 (2002. gada 3. jūnijs), ar ko groza Regulu
    (EEK) Nr. 3677/90, ar kuru paredz pasākumus, kas jāveic, lai novērstu dažu
    vielu novirzīšanu narkotisko un psihotropo vielu nelikumīgai izgatavošanai
  type: main
- language: lt
  script: Latn
  content: 2002 m. birželio 3 d. Tarybos reglamentas (EB) Nr. 988/2002, iš dalies
