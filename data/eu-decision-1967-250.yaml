title:
- language: fr
  script: Latn
  content: Décision 67/250/CEE du Conseil du 11 avril 1967, portant suspension totale
    du droit du Tarif douanier commun applicable aux anchois (engraulis S.P.P.), salés
    ou en saumures, présentés en barils ou autres récipients d'un poids unitaire
    minimum de 10 kg, de la position Ex 03.02 A I C) 2
  type: main
- language: de
  script: Latn
  content: '67/250/EWG: Entscheidung des Rates vom 11. April 1967 über die vollständige
    Aussetzung des Zollsatzes des Gemeinsamen Zolltarifs für Sardellen ("Engraulis
    s.p.p."), gesalzen oder in Salzlake, in Fässern oder anderen Behältern mit einem
    Stückgewicht von mindestens 10 kg, der Tarifnummer ex 03.02 A I c) 2'
  type: main
- language: it
  script: Latn
  content: '67/250/CEE: Decisione del Consiglio, dell''11 aprile 1967, recante sospensione
    totale del dazio della tariffa doganale comune applicabile alle alici (Engraulis
    s.p.p.) salate o in salamoia, confezionate in barili o altri recipienti di peso
    unitario minimo di 10 kg, della voce ex 03.02 A I c) 2'
  type: main
- language: nl
  script: Latn
  content: '67/250/EEG: Beschikking van de Raad van 11 april 1967 houdende algehele
    schorsing van het recht van het gemeenschappelijk douanetarief voor ansjovis (Engraulis
    s.p.p.), gezouten of gepekeld, in vaatjes of andere verpakkingen die per stuk
    ten minste 10 kilogram wegen, van post ex 03.02 A I c ) 2'
  type: main
