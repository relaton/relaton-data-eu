title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2869/93 of 20 October 1993 amending Regulation
    (EEC) No 3567/92 concerning the notification deadlines for the transfers of rights
    and temporary leases laid down by Council Regulation (EEC) No 3013/89 on the common
    organization of the market in sheepmeat and goatmeat
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2869/93 de la Commission du 20 octobre 1993 modifiant
    le règlement (CEE) n° 3567/92 en ce qui concerne les délais de notification
    des transferts des droits et cessions temporaires prévus par le règlement (CEE)
    n° 3013/89 du Conseil portant organisation commune des marchés dans le secteur
    des viandes ovine et caprine
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2869/93 DER KOMMISSION vom 20. Oktober 1993 zur Änderung
