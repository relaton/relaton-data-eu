    dei trasferimenti dei diritti e delle cessioni temporanee previsti dal regolamento
    (CEE) n. 3013/89 del Consiglio relativo all' organizzazione comune dei mercati
    nel settore delle carni ovine e caprine
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2869/93 VAN DE COMMISSIE van 20 oktober 1993 tot
