    von Anspruchsübertragungen und zeitlich begrenzten Abtretungen und der Verordnung
    (EWG) Nr. 3013/89 über die gemeinsame Marktorganisation für Schaf- und Ziegenfleisch
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2869/93 af 20. oktober 1993 om ændring
