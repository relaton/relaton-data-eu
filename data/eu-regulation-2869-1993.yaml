    της 20ής Οκτωβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3567/92 όσον αφορά τις προθεσμίες
    ανακοινώσεως της μεταφοράς των δικαιωμάτων
