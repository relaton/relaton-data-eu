title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 529/95 of 9 March 1995 deferring for imports
    from certain third countries the date of application of Article 11 (1) of Council
    Regulation (EEC) No 2092/91 on organic production of agricultural products and
    indications referring thereto on agricultural products and foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 529/95 de la Commission, du 9 mars 1995, prorogeant
    le délai de mise en application de l'article 11 paragraphe 1 du règlement (CEE)
    n° 2092/91 du Conseil concernant le mode de production biologique de produits
    agricoles et sa présentation sur les produits agricoles et des denrées alimentaires
    en ce qui concerne les importations de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 529/95 der Kommission vom 9. März 1995 zur Verschiebung
    der Anwendung von Artikel 11 Absatz 1 der Verordnung (EWG) Nr. 2092/91 des Rates
    über den ökologischen Landbau und die entsprechende Kennzeichnung der landwirtschaftlichen
    Erzeugnisse und Lebensmittel auf die Einfuhren aus bestimmten Drittländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 529/95 af 9. marts 1995 om udskydelse,
    for så vidt angår indførsler fra visse tredjelande, af fristen for anvendelsen
    af artikel 11, stk. 1, i Rådets forordning (EØF) nr. 2092/91 om økologisk produktionsmetode
    for landbrugsprodukter og om angivelse heraf på landbrugsprodukter og levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 529/95 της Επιτροπής
    της 9ης Μαρτίου 1995 για την παράταση της προθεσμίας
    εφαρμογής του άρθρου 11 παράγραφος 1 του κανονισμού
    (ΕΟΚ) αριθ. 2092/91 του Συμβουλίου περί του βιολογικού
    τρόπου παραγωγής γεωργικών προϊόντων και των
    σχετικών ενδείξεων στα γεωργικά προϊόντα και
    στα είδη διατροφής όσον αφορά τις εισαγωγές
    από ορισμένες τρίτες χώρες
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 529/95, annettu 9 päivänä maaliskuuta 1995,
    maataloustuotteiden luonnonmukaisesta tuotantotavasta ja siihen viittaavista merkinnöistä
    maataloustuotteissa ja elintarvikkeissa annetun neuvoston asetuksen (ETY) N:o
    2092/91 11 artiklan 1 kohdan täytäntöönpanoa koskevan määräajan jatkamisesta
    tietyistä kolmansista maista tapahtuvan tuonnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 529/95 della Commissione, del 9 marzo 1995, che rinvia,
    per quanto riguarda le importazioni da determinati paesi terzi, la data di applicazione
    dell'articolo 11, paragrafo 1 del regolamento (CEE) n. 2092/91 del Consiglio,
    relativo al metodo di produzione biologico di prodotti agricoli e all'indicazione
    di tale metodo sui prodotti agricoli e sulle derrate alimentari
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 529/95 van de Commissie van 9 maart 1995 houdende
    verlenging van de termijn na afloop waarvan artikel 11, lid 1, van Verordening
    (EEG) nr. 2092/91 van de Raad inzake de biologische produktiemethode en aanduidingen
    dienaangaande op landbouwprodukten en levensmiddelen, moet worden toegepast op
    de invoer uit bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 529/95 da Comissão, de 9 de Março de 1995, que adia
    a aplicação do nº 1 do artigo 11º do Regulamento (CEE) nº 2092/91 do Conselho,
    relativo ao modo de produção biológico de produtos agrícolas e à sua indicação
    nos produtos agrícolas e nos géneros alimentícios, no que se refere às importações
    de certos países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 529/95 de la Comisión, de 9 de marzo de 1995, por
    el que se prorroga con respecto a las importaciones procedentes de determinados
    países terceros el plazo para la aplicación del apartado 1 del artículo 11
    del Reglamento (CEE) nº 2092/91 del Consejo sobre la producción agrícola ecológica
    y su indicación en los productos agrarios y alimenticios
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 529/95 av den 9 mars 1995 om uppskjutande
    av tillämpningen av artikel 11.1 i rådets förordning (EEG) nr 2092/91 om ekologisk
    produktion av jordbruksprodukter och uppgifter därom på jordbruksprodukter och
    livsmedel vad gäller införsel från vissa tredje länder
  type: main
