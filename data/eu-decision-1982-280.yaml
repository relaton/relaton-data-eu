  content: '82/280/EEC: Commission Decision of 13 April 1982 establishing that the
    apparatus described as ''Scintag - diffractometer, model R3'', may be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/280/CEE: Décision de la Commission, du 13 avril 1982, constatant que
    l''importation de l''appareil dénommé "Scintag-diffractometer, model R3" peut
    être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/280/EWG: Entscheidung der Kommission vom 13. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Scintag - Diffractometer, model R 3" unter Befreiung von
    den Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/280/EØF: Kommissionens beslutning af 13. april 1982 om fastslåelse
