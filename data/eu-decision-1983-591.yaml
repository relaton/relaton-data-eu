  content: '83/591/EEC: Commission Decision of 24 November 1983 establishing that
    the apparatus described as ''BIOS - Nuclear Stethoscope'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/591/CEE: Décision de la Commission du 24 novembre 1983 constatant
    que l''importation de l''appareil dénommé "BIOS - Nuclear Stethoscope" ne peut
    être faite en franchise des droits du tarif douanier commun'
  type: main
