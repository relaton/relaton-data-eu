title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2969/77 of 23 December 1977 derogating in
    respect of the countries which have signed the Cartagena Agreement (Andean Group)
    from Articles 1, 6 and 13 of Commission Regulation (EEC) No 2966/77 of 23 December
    1977 on the definition of the concept of originating products for purposes of
    the application of tariff preferences granted by the European Economic Community
    in respect of certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2969/77 de la Commission, du 23 décembre 1977, portant
    dérogation, pour les pays ayant signé l' accord de Carthagène (groupe andin),
    aux articles 1er, 6 et 13 du règlement (CEE) n° 2966/77 de la Commission, du
    23 décembre 1977, relatif à la définition de la notion de produits originaires
    pour l' application des préférences tarifaires accordées par la Communauté
    économique européenne à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2969/77 der Kommission vom 23. Dezember 1977 über
    die zugunsten der Länder, die das Abkommen von Cartagena unterzeichnet haben
    (Andengruppe), vorgesehene Abweichung von den Artikeln 1, 6 und 13 der Verordnung
    (EWG) Nr. 2966/77 der Kommission vom 23. Dezember 1977 über die Begriffsbestimmung
    des Warenursprungs bei der Anwendung der von der Europäischen Wirtschaftsgemeinschaft
    für bestimmte Waren aus Entwicklungsländern gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2969/77 af 23. december 1977 om undtagelse
    for de lande, der har tiltrådt Cartagena-overenskomsten (ANDEAN) fra artikel
    1, 6 og 13 i Kommissionens forordning (EØF) nr. 2966/77 af 23. december 1977
    om definitionen af begrebet varer med oprindelsesstatus til brug ved anvendelsen
    af de toldpræferencer, der af Det europæiske økonomiske Fællesskab indrømmes
    visse varer fra udviklingslande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2969/77 della Commissione, del 23 dicembre 1977, che
    deroga, a favore dei paesi firmatari dell' accordo di Cartagena (gruppo andino)
    agli articoli 1, 6 e 13 del regolamento (CEE) n. 2966/77 della Commisssione, del
    23 dicembre 1977, relativo alla definizione della nozione di prodotti originari
    per l' applicazione delle preferenze tariffarie accordate dalla Comunità economica
    europea a taluni prodotti di paesi in via di sviluppo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2969/77 van de Commissie van 23 december 1977 houdende
    afwijking voor de landen die de Overeenkomst van Carthagena (Andesgroep) ondertekend
    hebben van de artikelen 1,6 en 13 van Verordening (EEG) nr. 2966/77 van de Commissie
    van 23 december 1977 betreffende de definitie van het begrip ,,produkten van oorsprong'
    ' voor de toepassing van de door de Europese Economische Gemeenschap voor bepaalde
    produkten uit ontwikkelingslanden verleende tariefpreferenties
