---
id: EUDecision2016320
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/320 of 3 March 2016 amending
    Decision 2004/842/EC concerning implementing rules whereby Member States may authorise
    the placing on the market of seed belonging to varieties for which an application
    for entry in the national catalogues of varieties of agricultural plant species
    or vegetable species has been submitted (notified under document C(2016) 1221)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/320 de la Commission du 3 mars 2016 modifiant
    la décision 2004/842/CE relative aux modalités d'exécution selon lesquelles
    les États membres peuvent autoriser la commercialisation de semences appartenant
    à des variétés pour lesquelles une demande d'inscription au catalogue national
    des variétés des espèces de plantes agricoles et des espèces de légumes a
    été présentée [notifiée sous le numéro C(2016) 1221]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2016/320 der Kommission vom 3. März 2016
    zur Änderung der Entscheidung 2004/842/EG über Durchführungsbestimmungen, nach
    denen die Mitgliedstaaten das Inverkehrbringen von Saatgut der Sorten genehmigen
    können, für die die Aufnahme in die einzelstaatlichen Sortenkataloge für landwirtschaftliche
    Pflanzenarten oder für Gemüsearten beantragt wurde (Bekanntgegeben unter Aktenzeichen
    C(2016) 1221)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/320 на Комисията
    от 3 март 2016 година за изменение на Решение
    2004/842/ЕО относно правилата за изпълнение, с
    които държавите членки могат да разрешават
    предлагането на пазара на семена, които принадлежат
    към сортовете, за които е подадено заявление
    за вписване в националния каталог на сортовете
    на земеделските растителни видове (нотифицирано
    под номер С(2016) 1221)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2016/320 ze dne 3. března 2016, kterým
    se mění rozhodnutí 2004/842/ES o prováděcích pravidlech, podle nichž mohou
    členské státy povolit uvádění na trh osiva těch odrůd, pro které byly
    předloženy žádosti o zapsání do katalogu odrůd druhů zemědělských rostlin
    nebo druhů zeleniny členského státu (oznámeno pod číslem C(2016) 1221)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2016/320 af 3. marts 2016
    om ændring af beslutning 2004/842/EF om gennemførelsesbestemmelser, hvorefter
    medlemsstaterne kan tillade markedsføring af frø tilhørende sorter, for hvilke
    der er indgivet en ansøgning om opførelse på den nationale sortsliste over
    landbrugsplantearter eller grøntsagsarter (meddelt under nummer C(2016) 1221)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/320 της Επιτροπής,
    της 3ης Μαρτίου 2016, για την τροποποίηση της
    απόφασης 2004/842/ΕΚ σχετικά με κανόνες εφαρμογής
    βάσει των οποίων τα κράτη μέλη μπορούν να επιτρέπουν
    τη διάθεση στο εμπόριο σπόρων ποικιλίας για
    την οποία έχει ήδη υποβληθεί αίτηση εγγραφής
    στον εθνικό κατάλογο ποικιλιών καλλιεργούμενων
    φυτικών ειδών ή κηπευτικών ειδών [κοινοποιηθείσα
    υπό τον αριθμό C(2016) 1221]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2016/320, 3. märts 2016, millega muudetakse
    otsust 2004/842/EÜ rakenduseeskirjade kohta, mille alusel liikmesriigid võivad
    lubada turule viia nende sortide seemneid, mille kohta on esitatud taotlus riiklikku
    põllumajandustaimesortide või köögiviljasortide kataloogi kandmiseks (teatavaks
    tehtud numbri C(2016) 1221 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2016/320, annettu 3 päivänä
    maaliskuuta 2016, täytäntöönpanosäännöistä, joiden nojalla jäsenvaltiot
    voivat antaa luvan saattaa markkinoille sellaisten lajikkeiden siemeniä, joista
    on tehty viljelykasvilajien tai vihanneslajien kansalliseen lajikeluetteloon lisäämistä
    koskeva hakemus, tehdyn komission päätöksen 2004/842/EY muuttamisesta (tiedoksiannettu
    numerolla C(2016) 1221)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2016/320 оd 3. ožujka 2016. o izmjeni
    Odluke 2004/842/EZ o provedbenim pravilima kojima države članice mogu odobriti
    stavljanje na tržište sjemena koje pripada sortama za koje je podnesen zahtjev
    za unos u nacionalni katalog sorata poljoprivrednih biljnih vrsta ili vrsta povrća
    (priopćeno pod brojem dokumenta C(2016) 1221)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/320 végrehajtási határozata (2016. március 3.)
    az olyan fajtához tartozó vetőmagok vonatkozásában, amelyek tekintetében
    a mezőgazdasági növényfajok vagy zöldségfajok nemzeti fajtajegyzékbe való
    felvételi kérelmét benyújtották; ezen vetőmagok forgalmazásának tekintetében
    a tagállamok által történő engedélyezésére vonatkozó végrehajtási szabályokról
    szóló 2004/842/EK bizottsági határozat módosításáról (az értesítés
    a C(2016) 1221. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/320 della Commissione, del 3 marzo 2016,
    che modifica la decisione 2004/842/CE relativa alle norme di applicazione con
    cui gli Stati membri possono autorizzare la commercializzazione di sementi appartenenti
    a varietà per le quali sia stata presentata una domanda di iscrizione nel catalogo
    nazionale delle varietà delle specie di piante agricole o delle specie di ortaggi
    [notificata con il numero C(2016) 1221]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2016/320 (2016. gada 3. marts), ar
    ko groza Lēmumu 2004/842/EK par īstenošanas noteikumiem, ar ko dalībvalstis
    var atļaut laist tirgū tādu šķirņu sēklas, par kurām ir iesniegts pieteikums
    iekļaušanai valsts lauksaimniecības augu šķirņu vai dārzeņu šķirņu
    katalogā (izziņots ar dokumenta numuru C(2016) 1221)
  type: main
- language: lt
  script: Latn
  content: 2016 m. kovo 3 d. Komisijos įgyvendinimo sprendimas (ES) 2016/320, kuriuo
    iš dalies keičiamas Komisijos sprendimas 2004/842/EB dėl įgyvendinimo taisyklių,
    kuriomis remdamosi valstybės narės gali leisti teikti į rinką sėklas, priklausančias
    veislėms, dėl kurių buvo pateiktos paraiškos jas įtraukti į žemės ūkio
    augalų rūšių veislių ar daržovių rūšių veislių nacionalinį katalogą
    (pranešta dokumentu Nr. C(2016) 1221)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/320 tat-3 ta'
    Marzu 2016 li temenda d-Deċiżjoni 2004/842/KE rigward l-implimentar ta' regolamentazzjoni
    li biha l-Istati Membri jistgħu jawtorizzaw it-tqegħid fis-suq ta' żerriegħa
    li tappartjeni għal varjetajiet li għalihom ġiet sottomessa applikazzjoni għad-dħul
    fil-katalogu nazzjonali ta' varjetajiet ta' speċi ta' pjanti agrikoli jew speċi
    veġetali (notifikata bid-dokument C(2016) 1221)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/320 van de Commissie van 3 maart 2016 tot
    wijziging van Beschikking 2004/842/EG tot vaststelling van uitvoeringsregels volgens
    welke de lidstaten toestemming kunnen geven voor het in de handel brengen van
    zaai- of pootgoed van rassen waarvoor de opname in de nationale rassenlijst voor
    landbouw- of groentegewassen is aangevraagd (Kennisgeving geschied onder nummer
    C(2016) 1221)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2016/320 z dnia 3 marca 2016 r. zmieniająca
    decyzję 2004/842/WE w sprawie przepisów wykonawczych, na mocy których państwa
    członkowskie mogą zezwolić na wprowadzenie do obrotu materiału siewnego należącego
    do odmiany, dla której złożono wniosek o włączenie do krajowego katalogu
    odmian gatunków roślin rolniczych lub katalogu odmian gatunków warzyw (notyfikowana
    jako dokument nr C(2016) 1221)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/320 da Comissão, de 3 de março de 2016,
    que altera a Decisão 2004/842/CE que diz respeito às normas de execução segundo
    as quais os Estados-Membros podem autorizar a colocação no mercado de sementes
    pertencentes a variedades para as quais foi apresentado um pedido de inscrição
    no catálogo nacional de variedades de espécies agrícolas ou de espécies hortícolas
    [notificada com o número C(2016) 1221]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/320 a Comisiei din 3 martie 2016
    de modificare a Deciziei 2004/842/CE privind modalitățile de aplicare conform
    cărora statele membre pot autoriza comercializarea semințelor aparținând unor
    soiuri pentru care s-a depus o cerere de înscriere în catalogul național al
    soiurilor de plante agricole și de specii de legume [notificată cu numărul
    C(2016) 1221]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2016/320 z 3. marca 2016, ktorým
    sa mení rozhodnutie 2004/842/ES o vykonávacích pravidlách, podľa ktorých
    môžu členské štáty udeľovať oprávnenia na uvádzanie na trh osiva patriaceho
    do odrôd, na ktoré bola podaná žiadosť o zápis do štátneho katalógu poľnohospodárskych
    rastlinných druhov alebo zeleninových druhov [oznámené pod číslom C(2016)
    1221]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2016/320 z dne 3. marca 2016 o spremembi
    Odločbe 2004/842/ES o pravilih za izvajanje, po katerih lahko države članice
    dovolijo dajanje v promet semen tistih sort, za katere je bila vložena prošnja
    za vpis v nacionalni katalog sort poljščin ali zelenjadnic (notificirano pod
    dokumentarno številko C(2016) 1221)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/320 de la Comisión, de 3 de marzo de
    2016, por la que se modifica la Decisión 2004/842/CE, relativa a disposiciones
    de aplicación por las que los Estados miembros pueden autorizar la comercialización
    de semillas pertenecientes a variedades para las que se haya presentado una solicitud
    de inscripción en el catálogo nacional de variedades de especies de plantas
    agrícolas y hortícolas [notificada con el número C(2016) 1221]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2016/320 av den 3 mars 2016 om ändring
    av beslut 2004/842/EG om genomförandebestämmelser enligt vilka medlemsstaterna
    får tillåta utsläppande på marknaden av utsäde som hör till sorter för
    vilka det har lämnats in en ansökan om införande på den nationella sortlistan
    för arter av lantbruks- eller köksväxter [delgivet med nr C(2016) 1221]
