title:
- language: en
  script: Latn
  content: '87/568/EEC: Commission Decision of 25 November 1987 amending Decision
    87/429/EEC authorizing Portugal to import from third countries at a reduced levy
    certain quantities of raw sugar during the period 1 July 1987 to 30 June 1988
    (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/568/CEE: Décision de la Commission du 25 novembre 1987 modifiant la
    décision 87/429/CEE autorisant le Portugal à importer des pays tiers à prélèvement
    réduit certaines quantités de sucre brut au titre de la période du 1er juillet
    1987 au 30 juin 1988 (Le texte en langue portugaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '87/568/EWG: Entscheidung der Kommission vom 25. November 1987 zur Änderung
    der Entscheidung 87/429/EWG zur Ermächtigung Portugals, für den Zeitraum vom
    1. Juli 1987 bis 30. Juni 1988 bestimmte Rohzuckermengen mit verminderter Abschöpfung
    aus Drittländern einzuführen (Nur der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/568/EØF: Kommissionens beslutning af 25. november 1987 om ændring
    af beslutning 87/429/EØF om bemyndigelse af Portugal til at indføre visse mængder
    råsukker under anvendelse af nedsat afgift fra tredjelande for perioden fra den
    1. juli 1987 til den 30. juni 1988 (Kun den portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/568/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Νοεμβρίου 1987 που τροποποιεί την απόφαση 87/429/ΕΟΚ
    που επιτρέπει στην Πορτογαλία να εισάγει από
    τρίτες χώρες με μειωμένη εισφορά ορισμένες
    ποσότητες ακατέργαστης ζάχαρης για την περίοδο
    από την 1η Ιουλίου 1987 έως τις 30 Ιουνίου 1988 (Το
    κείμενο στην πορτογαλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/568/CEE: Decisione della Commissione del 25 novembre 1987 che modifica
    la decisione 87/429/CEE che autorizza il Portogallo a importare dai paesi terzi
    taluni quantitativi di zucchero greggio a prelievo ridotto nel periodo dal 1 luglio
    1987 al 30 giugno 1988 (Il testo in lingua portoghese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/568/EEG: Beschikking van de Commissie van 25 november 1987 tot wijziging
    van Beschikking 87/429/EEG houdende machtiging van Portugal om bepaalde hoeveelheden
    ruwe suiker met een verlaagde heffing uit derde landen in te voeren voor de periode
    van 1 juli 1987 tot en met 30 juni 1988 (Slechts de tekst in de Portugese taal
    is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/568/CEE: Decisão da Comissão de 25 de Novembro de 1987 que altera
    a Decisão 87/429/CEE que autoriza Portugal a importar de países terceiros com
    direito nivelador reduzido determinadas quantidades de açúcar em bruto durante
    o período compreendido entre 1 de Julho de 1987 e 30 de Junho de 1988 (Apenas
    faz fé o texto em língua portuguesa)'
  type: main
- language: es
  script: Latn
  content: '87/568/CEE: Decisión de la Comisión de 25 de noviembre de 1987 que modifica
    la Decisión 87/429/CEE por la que se autoriza a Portugal a importar de terceros
    países, con una exacción reguladora de tipo reducido, ciertas cantidades de
    azúcar terciado para el período comprendido entre el 1 de julio de 1987 y el
    30 de junio de 1988 (El texto en lengua portuguesa es el único auténtico)'
  type: main
