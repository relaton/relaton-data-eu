title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1444/93 of 11 June 1993 repealing the Annex
    to Regulation (EEC) No 3805/92 establishing, for 1993, the list of vessels exceeding
    eight metres length overall and permitted to fish for sole within certain areas
    of the Community using beam trawls whose aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1444/93 de la Commission du 11 juin 1993 remplaçant
    l'annexe du règlement (CEE) n° 3805/92 établissant pour 1993 la liste des bateaux
    dont la longueur hors tout dépasse huit mètres autorisés à pêcher la sole
    dans certaines zones de la Communauté à l'aide de chaluts à perches dont la
    longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1444/93 DER KOMMISSION vom 11. Juni 1993 zum Ersatz
    des Anhangs der Verordnung (EWG) Nr. 3805/92 zur Festlegung der Liste für 1993
    der Schiffe mit einer Länge über alles von mehr als acht Metern, die in bestimmten
    Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtlänge mehr als neun Meter
    beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1444/93 af 11. juni 1993 om udskiftning
    af bilaget til forordning (EØF) nr. 3805/92 om listen for 1993 over fartøjer
    med en længe overalt på over 8 m, der ved fiskeri efter tunge i visse af Fællesskabets
    områder har tilladelse til at anvende bomtrawl, hvis samlede bomlængde overstiger
    9 m
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1444/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 11ης Ιουνίου 1993 περί αντικαταστάσεως του
    παραρτήματος του κανονισμού (ΕΟΚ) αριθ. 3805/92
    που καταρτίζει, για το 1993, τον κατάλογο των
    σκαφών μήκους άνω των οκτώ μέτρων τα οποία
    επιτρέπεται να αλιεύουν γλώσσες σε ορισμένες
    περιοχές της Κοινότητας, χρησιμοποιώντας δοκότρατες
    των οποίων το συνολικό μήκος υπερβαίνει τα
    εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1444/93 DELLA COMMISSIONE dell' 11 giugno 1993 che
    sostituisce l' allegato del regolamento (CEE) n. 3805/92 che fissa l' elenco per
    il 1993 dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzati
    a pescare la sogliola in determinate zone costiere della Comunità utilizzando
    reti a strascico a pali, la cui lunghezza complessiva superi nove metri
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1444/93 VAN DE COMMISSIE van 11 juni 1993 houdende
    vervanging van de bijlage bij Verordening (EEG) nr. 3805/92 tot vaststelling voor
    1993 van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter
    en die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale boomlengte
    meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1444/93 DA COMISSÃO de 11 de Junho de 1993 que substitui
    o anexo do Regulamento (CEE) no 3805/92, que estabelece para 1993 a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a pescar
    linguado em determinadas zonas da Comunidade, utilizando redes de arrasto de vara
    em que o comprimento total das varas seja superior a nove metros
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1444/93 DE LA COMISIÓN de 11 de junio de 1993 por
    el que se sustituye el Anexo del Reglamento (CEE) no 3805/92, por el que se establece
    para 1993 la lista de barcos cuya eslora total excede los ocho metros y a los
    que se permite la pesca del lenguado dentro de determinadas zonas de la Comunidad
    utilizando artes de arrastre de vara cuya longitud total supere los nueve metros
  type: main
