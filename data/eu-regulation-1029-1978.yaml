  content: Commission Regulation (EEC) No 1029/78 of 19 May 1978 amending Regulation
    (EEC) No 610/77 on the determination of prices of adult bovine animals on representative
    Community markets and the survey of prices of certain other cattle in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1029/78 de la Commission, du 19 mai 1978, modifiant
    le règlement (CEE) n° 610/77 relatif à la détermination des prix des gros
    bovins constatés sur les marchés représentatifs de la Communauté et au relevé
    des prix de certains autres bovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1029/78 der Kommission vom 19. Mai 1978 zur Änderung
    der Verordnung (EWG) Nr. 610/77 zur Bestimmung der auf den repräsentativen Märkten
    der Gemeinschaft festgestellten Preise für ausgewachsene Rinder und zur Ermittlung
    der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1029/78 af 19. maj 1978 om ændring
