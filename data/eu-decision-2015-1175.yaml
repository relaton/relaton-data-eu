    modifiant la décision 2006/473/CE en ce qui concerne la reconnaissance du magisterial
    district de Gordonia en Afrique du Sud comme indemnes de Guignardia citricarpa
    Kiely (toutes les souches pathogènes aux Citrus) [notifiée sous le numéro C(2015)
    4749]
  type: main
- language: de
  script: Latn
