  script: Latn
  content: Commission Implementing Decision (EU) 2015/1175 of 15 July 2015 amending
    Decision 2006/473/EC as regards the recognition of the magisterial district of
    Gordonia in South Africa as being free from Guignardia citricarpa Kiely (all strains
    pathogenic to Citrus) (notified under document C(2015) 4749)
  type: main
- language: fr
  script: Latn
