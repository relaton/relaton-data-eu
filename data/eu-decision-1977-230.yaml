title:
- language: en
  script: Latn
  content: Council Decision of 14 March 1977 extending the period of validity of Decision
    76/277/EEC authorizing Ireland to take protective measures in respect of footwear
    with uppers of leather originating in Sweden
  type: main
- language: fr
  script: Latn
  content: '77/230/CEE: Décision du Conseil du 14 mars 1977, prorogeant la validité
    de la décision 76/277/CEE autorisant l''Irlande à prendre des mesures de sauvegarde
    pour les chaussures à dessus en cuir naturel originaires de Suède'
  type: main
- language: de
  script: Latn
  content: Entscheidung des Rates vom 14. März 1977 zur Verlängerung der Gültigkeitsdauer
    der Entscheidung 76/277/EWG, mit der Irland ermächtigt wird, Schutzmaßnahmen
    bei der Einfuhr von Schuhen mit Oberteil aus Leder mit Ursprung in Schweden zu
    treffen
  type: main
- language: da
  script: Latn
  content: Rådets Beslutning af 14. marts 1977 om forlængelse af gyldigheden af
    beslutning 76/277/EØF om bemyndigelse for Irland til at anvende beskyttelsesforanstaltninger
    over for fodtøj, med overdel af læder, med oprindelse i Sverige
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 14 marzo 1977, che proroga la validità della
    decisione 76/277/CEE, che autorizza l'Irlanda ad attuare misure protettive per
    le calzature con tomaia di cuoio naturale originarie della Svezia
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Raad van 14 maart 1977 houdende verlenging van de geldigheidsduur
    van Beschikking 76/277/EEG waarbij Ierland wordt gemachtigd vrijwaringsmaatregelen
    te nemen met betrekking tot schoeisel met bovendeel van leder van oorsprong uit
    Zweden
  type: main
