title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 339/80 of 13 February 1980 amending Regulation
    (EEC) No 2831/79 as regards the possibility of terminating short-term storage
    contracts for grape must and concentrated grape must at the time of the conclusion
    of a long-term contract
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 339/80 de la Commission, du 13 février 1980, modifiant
    le règlement (CEE) n° 2831/79 en ce qui concerne la possibilité de résiliation
    des contrats de stockage à court terme pour les moûts de raisins et les moûts
    de raisins concentrés lors de la conclusion d' un contrat à long terme
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 339/80 der Kommission vom 13. Februar 1980 zur Änderung
    der Verordnung (EWG) Nr. 2831/79 zur Ermöglichung der Aufhebung von kurzfristigen
    Lagerverträgen für Traubenmoste und konzentrierte Traubenmoste bei Abschluß
    eines langfristigen Vertrages
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 339/80 af 13. februar 1980 om ændring
    af forordning (EØF) nr. 2831/79 for så vidt angår muligheden for at opsige
    kortfristede kontrakter om oplagring af druemost og koncentreret druemost ved
    indgåelse af en langfristet kontrakt
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 339/80 della Commissione, del 13 febbraio 1980, che
    modifica il regolamento (CEE) n. 2831/79 per quanto concerne la possibilità di
    risolvere i contratti di magazzinaggio a breve termine per i mosti di uve e i
    mosti di uve concentrati al momento della conclusione di contratti a lungo termine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 339/80 van de Commissie van 13 februari 1980 tot
    wijziging van Verordening (EEG) nr. 2831/79 ten aanzien van de mogelijkheid tot
    opzegging van kortlopende contracten voor de opslag van druivemost en geconcentreerde
    druivemost bij het sluiten van een langlopend contract
  type: main
