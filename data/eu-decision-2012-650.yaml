  type: main
- language: hu
  script: Latn
  content: '2012/650/EU: A Bizottság végrehajtási határozata ( 2012. október
    17. ) a 2006/766/EK határozat II. mellékletének Curaçaónak és Sint Maartennek
    az emberi fogyasztásra szánt egyes halászati termékek behozatalára jogosult
    harmadik országok és területek jegyzékébe való felvétele és a Holland
    Antillák e jegyzékből való törlése tekintetében történő módosításáról
    (az értesítés a C(2012) 7147. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2012/650/UE: Decisione di esecuzione della Commissione, del 17 ottobre
    2012 , che modifica l’allegato II della decisione 2006/766/CE per quanto concerne
    l’inserimento di Curaçao e Sint Maarten nell’elenco dei paesi terzi e dei
    territori da cui sono autorizzate le importazioni di determinati prodotti della
    pesca destinati al consumo umano e la soppressione delle Antille olandesi da tale
    elenco [notificata con il numero C(2012) 7147]'
  type: main
- language: lv
  script: Latn
  content: '2012/650/ES: Komisijas Īstenošanas lēmums ( 2012. gada 17. oktobris
