    Curaçaa a Sint Maarten do seznamu třetích zemí a území, ze kterých je povolen
    dovoz některých produktů rybolovu určených k lidské spotřebě, a odstranění
    Nizozemských Antil z uvedeného seznamu (oznámeno pod číslem C(2012) 7147)'
  type: main
