    II към Решение 2006/766/ЕО по отношение на вписването
    на Кюрасао и Синт Мартен в списъка с третите
    страни и териториите, от които е разрешен вносът
    на рибни продукти, предназначени за консумация
    от човека, както и по отношение на заличаването
    на Нидерландските Антили от посочения списък
    (нотифицирано под номер C(2012) 7147)'
  type: main
- language: cs
  script: Latn
  content: '2012/650/EU: Prováděcí rozhodnutí Komise ze dne 17. října 2012 ,
