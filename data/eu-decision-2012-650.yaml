    iekļaušanu to trešo valstu un teritoriju sarakstā, no kurām ir atļauts ievest
    konkrētus zvejniecības produktus, kas paredzēti lietošanai pārtikā, un Nīderlandes
    Antiļu svītrošanu no minētā saraksta (izziņots ar dokumenta numuru C(2012)
    7147)'
  type: main
- language: lt
  script: Latn
  content: '2012/650/ES: 2012 m. spalio 17 d. Komisijos įgyvendinimo sprendimas,
