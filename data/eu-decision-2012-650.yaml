    iš kurių leidžiama importuoti tam tikrus žmonėms vartoti skirtus žuvininkystės
    produktus, sąrašą ir Nyderlandų Antilų išbraukimo iš to sąrašo iš dalies
    keičiamas Sprendimo 2006/766/EB II priedas (pranešta dokumentu Nr. C(2012) 7147)'
  type: main
