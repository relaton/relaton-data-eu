title:
- language: en
  script: Latn
  content: '2012/650/EU: Commission Implementing Decision of 17 October 2012 amending
    Annex II to Decision 2006/766/EC as regards the inclusion of Curaçao and Sint
    Maarten in the list of third countries and territories from which imports of certain
    fishery products for human consumption are permitted and the deletion of the Netherlands
    Antilles from that list (notified under document C(2012) 7147)'
  type: main
- language: fr
  script: Latn
  content: '2012/650/UE: Décision d’exécution de la Commission du 17 octobre 2012
    modifiant l’annexe II de la décision 2006/766/CE en ce qui concerne l’inclusion
    de Curaçao et de Sint-Maarten sur la liste des pays tiers et territoires en provenance
    desquels l’importation des produits de la pêche destinés à la consommation
    humaine est autorisée ainsi que la suppression des Antilles néerlandaises de
    cette liste [notifiée sous le numéro C(2012) 7147]'
  type: main
- language: de
  script: Latn
  content: '2012/650/EU: Durchführungsbeschluss der Kommission vom 17. Oktober 2012
    zur Änderung des Anhangs II der Entscheidung 2006/766/EG zwecks Aufnahme von
    Curaçao und St. Martin in die Liste der Drittländer und Gebiete, aus denen Einfuhren
    bestimmter Fischereierzeugnisse zum menschlichen Verzehr zulässig sind, und zur
    Streichung der Niederländischen Antillen von dieser Liste (Bekanntgegeben unter
    Aktenzeichen C(2012) 7147)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/650/ЕС: Решение за изпълнение на Комисията
