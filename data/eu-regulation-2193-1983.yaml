title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2193/83 of 29 July 1983 accepting an undertaking
    given in connection with the anti-dumping review proceeding on imports of urea
    ammonium nitrate solution fertilizer (UAN) originating in the United States of
    America and terminating the proceeding
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2193/83 du Conseil du 29 juillet 1983 portant acceptation
    d' un engagement souscrit dans le cadre de la révision de la procédure anti-"dumping"
    sur les importations d' engrais composé d' urée et de nitrate d' ammonium en
    solution (UNA), originaire des États-Unis d' Amérique et portant clôture de
    cette procédure
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2193/83 des Rates vom 29. Juli 1983 über die Annahme
    einer Verpflichtung im Rahmen der Überprüfung von Antidumpingmaßnahmen betreffend
    die Einfuhren von Ammoniumnitrat-Harnstoff-Düngemittellösung (AHD) mit Ursprung
    in den Vereinigten Staaten von Amerika und über die Einstellung des Verfahrens
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2193/83 af 29. juli 1983 om godtagelse af
    et tilsagn afgivet i forbindelse med den reviderede antidumpingprocedure vedrørende
    importen af gødningsstoffer bestående af en opløsning af urinstof og ammoniumnitrat
    (UAN) med oprindelse i Amerikas Forenede Stater og om afslutning af denne procedure
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2193/83 του Συμβουλίου
    της 29ης Ιουλίου 1983 για την αποδοχή υποχρέωσης
    που έχει αναληφθεί στα πλαίσια της αναθεώρησης
    της διαδικασίας αντιντάμπινγκ που αφορά τις
    εισαγωγές λιπάσματος από διάλυμα ουρίας και
    νιτρικού αμμωνίου (UAN), καταγωγής Ηνωμένων Πολιτειών
    Αμερικής και την περάτωση της διαδικασίας
    αυτής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2193/83 del Consiglio del 29 luglio 1983 che accetta
    l' impegno assunto nell' ambito della procedura di revisione dell' azione antidumping
    riguardante le importazioni di concime costituito da una soluzione di urea e nitrato
    di ammonio (UNA) originario degli Stati Uniti d' America, e che conclude questa
    procedura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2193/83 van de Raad van 29 juli 1983 houdende aanvaarding
    van een prijsverbintenis, aangegaan in het kader van een nieuw onderzoek in de
    anti-dumpingprocedure betreffende de invoer van meststoffen van ureum-ammoniumnitraatoplossing
    van oorsprong uit de Verenigde Staten van Amerika en houdende beëindiging van
    deze procedure
  type: main
