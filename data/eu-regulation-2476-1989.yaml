  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2476/89 DELLA COMMISSIONE dell'' 11 agosto 1989 che
    ripristina la riscossione dei dazi doganali applicabili ai supporti preparati
    per la registrazione del suono o per simili registrazioni del codice NC 8523 e
    ai dischi, nastri e altri supporti per la registrazione del suono o per simili
