    (KN-kode 8523) og plader, bånd og andre medier med indspilning af lyd eller andre
    fænomener (KN-kode 8524) med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2476/89 της Επιτροπής
