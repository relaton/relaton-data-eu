title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2476/89 of 11 August 1989 re-establishing
    the levying of customs duties on prepared unrecorded media for sound recording
    or similar recording of other phenomena and records, tapes and other recorded
    media for sound or other similarly recorded phenomena falling within CN codes
    8523 and 8524 originating in China to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2476/89 de la Commission du 11 août 1989 portant
    rétablissement de la perception des droits de douane applicables pour les supports
    préparés pour l'enregistrement du son ou pour enregistrements du code NC 8523
    et les disques, bandes et autres supports pour l'enregistrement du son ou pour
    enregistrements du code NC 8524, originaires de la Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2476/89 DER KOMMISSION vom 11. August 1989 zur Wiedereinführung
    der Erhebung der Zölle für Tonträger und ähnliche zur Aufnahme vorgerichtete
    Aufzeichnungsträger des KN-Code 8523 und Schallplatten, Magnetbänder und andere
    Tonträger und ähnliche Aufzeichnungsträger des KN-Code 8524 mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2476/89 af 11. august 1989 om genindførelse
