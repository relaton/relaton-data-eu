  type: main
- language: pt
  script: Latn
  content: '92/466/CEE: Decisão da Comissão, de 2 de Setembro de 1992, que fixa
    o montante dos recursos próprios do imposto sobre o valor acrescentado (IVA)
    de que a República Federal da Alemanha é devedora para o exercício de 1990
    e relativo às operações referidas na vigésima Directiva 85/361/CEE do Conselho,
    de 16 de Julho de 1985, em matéria de harmonização das legislações dos Estados-membros
    respeitantes aos impostos sobre o volume de negócios - sistema comum de imposto
    sobre o valor acrescentado: derrogações relativas às ajudas especiais concedidas
    a certos agricultores em compensação do desmantelamento dos montantes compensatórios
    monetários aplicáveis a determinados produtos agrícolas (Apenas faz fé o texto
    em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '92/466/CEE: Decisión de la Comisión, de 2 de septiembre de 1992, por
    la que se fija la cuantía de los recursos propios IVA debida por la República
    Federal de Alemania por el ejercicio 1990 y relativa a las operaciones contempladas
    en la vigésima Directiva 85/361/CEE del Consejo, de 16 de julio de 1985, en materia
    de armonización de las legislaciones de los Estados miembros relativas a los
    impuestos sobre el volumen de negocios - Sistema común del impuesto sobre el
    valor añadido: excepciones relativas a las ayudas especiales concedidas a determinados
    agricultores en compensación al desmantelamiento de los montantes compensatorios
    monetarios aplicables a determinados productos agrícolas (El texto en lengua
    alemana es el único auténtico)'
