    het begrotingsjaar 1990 is verschuldigd in verband met de verrichtingen die vallen
    onder de Twintigste Richtlijn 85/361/EEG van de Raad van 16 juli 1985 betreffende
    de harmonisatie van de wetgevingen der Lid- Staten inzake omzetbelasting - Gemeenschappelijk
