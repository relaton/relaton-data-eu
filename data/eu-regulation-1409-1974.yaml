title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1409/74 of the Council of 4 June 1974 extending the
    Community tariff quota opened by Regulation (EEC) No 3509/73 for newsprint falling
    within subheading 48.01 A of the Common Customs Tariff to include certain papers
    falling within subheading 48.01 E thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1409/74 du Conseil, du 4 juin 1974, étendant le bénéfice
    du contingent tarifaire communautaire ouvert par le règlement (CEE) n° 3590/73
    pour le papier journal de la sous-position 48.01 A du tarif douanier commun à
    certains papiers relevant de la sous-position 48.01 E
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1409/74 des Rates vom 4. Juni 1974 über die Ausdehnung
    des mit Verordnung (EWG) Nr. 3590/73 eröffneten Gemeinschaftszollkontingents
    für Zeitungsdruckpapier der Tarifstelle 48.01 A des Gemeinsamen Zolltarifs auf
    bestimmte Papiere der Tarifstelle 48.01 E
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1409/74 af 4. juni 1974 om udvidelse af det
    ved forordning (EØF) nr. 3590/73 indførte fællesskabstoldkontingent for avispapir
    henhørende under pos. 48.01 A i den fælles toldtarif til også at omfatte visse
    former for papir henhørende under pos. 48.01 E
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1409/74 del Consiglio, del 4 giugno 1974, che estende
    a talune carte della sottovoce 48.01 E il beneficio del contingente tariffario
    comunitario aperto con il regolamento (CEE) n. 3590/73 per la carta da giornali
    della sottovoce 48.01 A della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1409/74 van de Raad van 4 juni 1974 houdende uitbreiding
    tot bepaald papier vallende onder onderverdeling 48.01 E van het bij Verordening
    (EEG) nr. 3590/73 geopende communautaire tariefcontingent voor courantenpapier
    van onderverdeling 48.01 A van het gemeenschappelijk douanetarief
  type: main
