    (EWG) Nr. 2641/80 des Rates hinsichtlich der Einfuhren von Erzeugnissen des Schaf-
    und Ziegenfleischsektors mit Ursprung in bestimmten Drittlaendern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1249/90 af 11. maj 1990 om undtagelse
