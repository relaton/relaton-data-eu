    (EEG) nr. 2641/80 van de Raad met betrekking tot de invoer van produkten uit de
    sector schape- en geitevlees van oorsprong uit bepaalde derde landen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1249/90 DA COMISSAO de 11 de Maio de 1990 que derroga
