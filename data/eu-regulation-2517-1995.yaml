  script: Latn
  content: COMMISSION REGULATION (EC) No 2517/95 of 27 October 1995 determining the
    extent to which applications lodged in October 1995 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2517/95 DE LA COMMISSION du 27 octobre 1995 déterminant
