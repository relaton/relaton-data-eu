  content: Règlement (CEE) n 732/72 de la Commission, du 11 avril 1972, déterminant
    les montants des éléments mobiles rectifiés applicables, à compter du 14 avril
    1972, à l'importation dans la Communauté de certaines marchandises relevant
    du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 732/72 der Kommission vom 11. April 1972 zur Festsetzung
    der Höhe der ab 14. April 1972 bei der Einfuhr von bestimmten, unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft anwendbaren berichtigten
    beweglichen Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 732/72 della Commissione, dell'11 aprile 1972, che
    determina gli importi degli elementi mobili rettificati applicabili dal 14 aprile
    1972 all'importazione nella Comunità di talune merci cui si applica il regolamento
    (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 732/72 van de Commissie van 11 april 1972 tot vaststelling
    van de bedragen der verbeterde variabele elementen welke met ingang van 14 april
    1972 bij de invoer in de Gemeenschap van toepassing zijn op bepaalde onder Verordening
    (EEG) nr. 1059/69 van de Raad vallende goederen
