title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2217/83 of 2 August 1983 re-establishing
    the levying of customs duties on babies' knitted outer garments, products of category
    71 (code 0710) and originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2217/83 de la Commission du 2 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux vêtements de dessus de
    bonneterie, pour bébés, de la catégorie de produits 71 (code 0710), originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2217/83 der Kommission vom 2. August 1983 über die
    Wiedereinführung des Zollsatzes für Oberkleidung für Säuglinge, gewirkt, der
    Warenkategorie Nr. 71 (Kennziffer 0710), mit Ursprung in Thailand, dem die in
    der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2217/83 af 2. august 1983 om genindførelse
    af opkrævning af toldafgifter for yderbeklædningsgenstande af trikotage, til
    spædbørn, under kategori nr. 71 (kode 0710), som har oprindelse i Thailand og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2217/83 της Επιτροπής
    της 2ας Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για εξωτερικά
    ενδύματα πλεκτά, διά βρέφη, προϊόντα της κατηγορίας
    71 (κωδικός 0710), καταγωγής Ταϋλάνδης, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2217/83 della Commissione del 2 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli indumenti esterni a maglia per
    bambini piccoli, della categoria di prodotti n. 71 (codice 0710), originari della
    Tailandia, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2217/83 van de Commissie van 2 augustus 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bovenkleding
    van brei- of haakwerk voor baby' s, van de categorie van produkten nr. 71 (codenummer
    0710), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
  type: main
