    pokud jde o položky pro Namibii v seznamech třetích zemí, území nebo jejich
    oblastí, z nichž je povolen vstup zásilek čerstvého masa a masných výrobků
    z některých kopytníků do Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2026/2238 af 2. oktober 2026
