title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/2238 of 2 October 2026 amending
    Annexes XIII and XV to Implementing Regulation (EU) 2021/404 as regards the entries
    for Namibia in the lists of third countries or territories, or zones thereof authorised
    for the entry into the Union of consignments of fresh meat and meat products of
    certain ungulates
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/2238 de la Commission du 2 octobre
    2026 modifiant les annexes XIII et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les inscriptions de la Namibie sur les listes des pays tiers
    et territoires, ou des zones de pays tiers ou territoire, en provenance desquels
    l’entrée dans l’Union d’envois de viandes fraîches et de produits à base
    de viande de certains ongulés est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/2238 der Kommission vom 2. Oktober 2026
    zur Änderung der Anhänge XIII und XV der Durchführungsverordnung (EU) 2021/404
    hinsichtlich der Einträge für Namibia in den Listen der Drittländer, Gebiete
    oder Zonen derselben, aus denen der Eingang von Sendungen von frischem Fleisch
    und Fleischerzeugnissen bestimmter Huftiere in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2026/2238 на Комисията
