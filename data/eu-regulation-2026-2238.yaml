    XIII и XV към Регламент за изпълнение (ЕС) 2021/404
    по отношение на вписванията за Намибия в списъците
    на трети държави или територии, или зони от
    тях, от които е разрешено въвеждането в Съюза
    на пратки с прясно месо и месни продукти от
    някои копитни животни
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/2238 ze dne 2. října 2026,
