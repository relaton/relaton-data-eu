    eller territorier eller zoner deri, hvorfra det er tilladt at indføre sendinger
    af fersk kød og kødprodukter af visse hovdyr til Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2026/2238 της Επιτροπής,
