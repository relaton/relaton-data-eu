    cu țările terțe, teritoriile sau zonele din acestea autorizate pentru introducerea
    în Uniune a transporturilor de carne proaspătă și de produse din carne de
    anumite ungulate
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2026/2238 z 2. októbra 2026, ktorým
