  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2026/2238 de la Comisión, de 2 de octubre
    de 2026, por el que se modifican los anexos XIII y XV del Reglamento de Ejecución
    (UE) 2021/404 por lo que respecta a las entradas correspondientes a Namibia en
    la lista de terceros países o territorios, o zonas de estos, desde los que se
