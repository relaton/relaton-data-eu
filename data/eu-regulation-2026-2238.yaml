    proizvoda od određenih kopitara i papkara
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/2238 végrehajtási rendelete (2026. október 2.)
    az (EU) 2021/404 végrehajtási rendelet XIII. és XV. mellékletének a bizonyos
    patásokból származó friss hús és húskészítmények szállítmányainak
