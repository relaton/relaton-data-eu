    di carni fresche e prodotti a base di carne di determinati ungulati
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2026/2238 (2026. gada 2. oktobris),
    ar ko attiecībā uz ierakstiem par Namībiju tādu trešo valstu, teritoriju
    vai to zonu sarakstos, no kurām atļauts Savienībā ievest svaigas noteiktu
    nagaiņu gaļas un šādas gaļas produktu sūtījumus, groza Īstenošanas regulas
    (ES) 2021/404 XIII un XV pielikumu
  type: main
