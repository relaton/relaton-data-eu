title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1036/92 of 27 April 1992 laying down detailed
    rules for transferring Community aid granted for collective projects for the restructuring
    of vineyards under Council Regulation (EEC) No 458/80 and amending Decision 81/525/EEC
    on applications for refunds of and advances on premiums paid for collective projects
    for the restructuring of vineyards
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1036/92 de la Commission, du 27 avril 1992, relatif
    aux modalités de transfert des concours communautaires octroyés à des projets
    de restructuration collective du vignoble dans le cadre du règlement (CEE) n°
    458/80 du Conseil et modifiant la décision 81/525/CEE relative aux demandes d'avance
    et de remboursement des primes versées au titre de la restructuration du vignoble
    dans le cadre d'opérations collectives
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1036/92 der Kommission vom 27. April 1992 mit Durchführungsvorschriften
    für die Übertragung von gemeinschaftlichen Zuschüssen, die gemäß der Verordnung
    (EWG) Nr. 458/80 des Rates für Vorhaben zur Umstrukturierung von Rebflächen
    im Rahmen kollektiver Maßnahmen gewährt worden sind, sowie zur Änderung der
    Entscheidung 81/525/EWG über die Anträge auf Vorschüsse und Erstattung der
    Prämien, die für die Umstrukturierung der Rebflächen im Rahmen kollektiver
    Maßnahmen gezahlt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1036/92 af 27. april 1992 om gennemførelsesbestemmelser
    til overførsel af fællesskabsstøtte ydet til projekter for kollektiv omstrukturering
    af vinarealer i medfør af Rådets forordning (EØF) nr. 458/80 og om ændring
    af beslutning 81/525/EØF om ansøgninger om forskud og om refusion af præmier
    for omstrukturering af vinarealer som led i kollektive foranstaltninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1036/92 της Επιτροπής
    της 27ης Απριλίου 1992 για τις λεπτομέρειες εφαρμογής
    της μεταφοράς των κοινοτικών συνδρομών που
    χορηγούνται σε σχέδια συλλογικής αναδιάρθρωσης
    του αμπελώνα στο πλαίσιο του κανονισμού (ΕΟΚ)
    αριθ. 458/80 του Συμβουλίου και για την τροποποίηση
    της απόφασης 81/525/ΕΟΚ περί των αιτήσεων για
    προκαταβολές και απόδοση των πριμοδοτήσεων
    που έχουν καταβληθεί για την αναδιάρθρωση
    των αμπελώνων στα πλαίσια συλλογικών ενεργειών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1036/92, annettu 27 päivänä huhtikuuta 1992,
    neuvoston asetuksen (ETY) N:o 458/80 mukaisesti viinitarhojen rakenneuudistuksia
    koskeviin yhteisiin hankkeisiin myönnetyn yhteisön tuen siirtämistä koskevista
    yksityiskohtaisista säännöistä ja viinitarhojen rakenneuudistuksia koskevien
    yhteisten hankkeiden yhteydessä maksettujen palkkioiden ennakkomaksu- ja korvaushakemuksista
    tehdyn päätöksen 81/525/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1036/92 della Commissione, del 27 aprile 1992, relativo
    alle modalità di trasferimento dei contributi comunitari concessi a progetti
    di ristrutturazione collettiva dei vigneti nel quadro del regolamento (CEE) n.
    458/80 del Consiglio, e che modifica la decisione 81/525/CEE riguardante le domande
    di anticipo e di rimborso degli aiuti versati per la ristrutturazione dei vigneti
    nel quadro delle operazioni collettive
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1036/92 van de Commissie van 27 april 1992 tot vaststelling
    van de uitvoeringsbepalingen inzake de overdracht van de door de Gemeenschap toegekende
    steun voor projecten voor de collectieve herstructurering van wijngaarden in het
    kader van Verordening (EEG) nr. 458/80 van de Raad en tot wijziging van Beschikking
    81/525/EEG betreffende de aanvragen voor voorschotten en terugbetaling van betaalde
    premies voor de herstructurering van wijngaarden in het kader van collectieve
    operaties
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1036/92 da Comissão, de 27 de Abril de 1992, que
    estabelece as normas de execução relativas à transferência da participação
    comunitária concedida a projectos de restruturação colectiva da vinha no âmbito
    do Regulamento (CEE) nº 458/80 do Conselho e que altera a Decisão 81/525/CEE
    relativa aos pedidos de adiantamento e de reembolso dos prémios pagos a título
    da reestruturação da vinha no âmbito de operações colectivas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1036/92 de la Comisión, de 27 de abril de 1992, relativo
    a las disposiciones de aplicación de la transferencia de las ayudas comunitarias
    concedidas para proyectos de reestructuración colectiva del viñedo en el marco
    del Reglamento (CEE) nº 458/80 del Consejo por la que se modifica la Decisión
    81/525/CEE relativa a las solicitudes de anticipo y reembolso de las primas pagadas
    en concepto de reestructuración del viñedo en el marco de operaciones colectivas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1036/92 av den 27 april 1992 om närmare
    bestämmelser om överföring av gemenskapsstöd som beviljats för samfällda
    projekt för omstrukturering av vinodlingar enligt rådets förordning (EEG) nr
    458/80 samt om ändring av beslut 81/525/EEG om ansökningar om ersättning för
    och förskott på bidrag till kollektiva projekt för omstrukturering av vinodlingar
