    Abschluß von Verträgen über die Einrichtung und den Betrieb des Help Desk Server
    der Managementeinheit und des SIRENE-Netzes (Phase II) als Vertreter bestimmter
    Mitgliedstaaten zu handeln und solche Verträge zu verwalten'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 3. května 1999 o zmocnění generálního tajemníka
