title:
- language: en
  script: Latn
  content: '1999/322/EC: Council Decision of 3 May 1999 authorising the Secretary-General
    of the Council of the European Union in the context of the integration of the
    Schengen acquis into the framework of the European Union to act as representative
    of certain Member States for the purposes of concluding contracts relating to
    the installation and functioning of the Help Desk Server of the Management Unit
    and of the Sirene Network Phase II and to manage such contracts'
  type: main
- language: fr
  script: Latn
  content: '1999/322/CE: Décision du Conseil, du 3 mai 1999, autorisant le secrétaire
    général du Conseil de l''Union européenne, dans le contexte de l''intégration
    de l''acquis de Schengen dans le cadre de l''Union européenne, à agir en tant
    que représentant de certains États membres aux fins de la conclusion de contrats
    concernant l''installation et le fonctionnement du serveur d''assistance de l''unité
    de gestion et du réseau Sirene phase II et de la gestion de ces contrats'
  type: main
- language: de
  script: Latn
  content: '1999/322/EG: Beschluß des Rates vom 3. Mai 1999 zur Ermächtigung des
