    i Den Europæiske Union at handle som repræsentant for visse medlemsstater med
    henblik på at indgå kontrakter om oprettelse og drift af forvaltningsenhedens
    server til on-line-hjælp og Sirene- nettet, fase II, samt til at forvalte sådanne
    kontrakter'
  type: main
