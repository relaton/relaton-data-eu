title:
- language: en
  script: Latn
  content: '2001/916/EC: Council Decision of 3 December 2001 on the conclusion of
    an Additional Protocol adjusting the trade aspects of the Stabilisation and Association
    Agreement between the European Communities and their Member States, of the one
    part, and the former Yugoslav Republic of Macedonia, of the other part, to take
    account of the outcome of the negotiations between the parties on reciprocal preferential
    concessions for certain wines, the reciprocal recognition, protection and control
    of wine names and the reciprocal recognition, protection and control of designations
    for spirits and aromatised drinks'
  type: main
- language: fr
  script: Latn
  content: '2001/916/CE: Décision du Conseil du 3 décembre 2001 relative à la conclusion
