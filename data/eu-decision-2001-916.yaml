  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 3 decembrie 2001 privind încheierea unui Protocol
    adițional de adaptare a aspectelor comerciale ale Acordului de stabilizare și
    de asociere dintre Comunitățile Europene și statele lor membre, pe de o parte,
    și Fosta Republică Iugoslavă a Macedoniei, pe de altă parte, pentru a ține
    seama de rezultatele negocierilor dintre părți privind stabilirea de concesii
    preferențiale reciproce pentru anumite vinuri, recunoașterea, protecția și
    controlul reciproc al denumirilor de vinuri, precum și recunoașterea, protecția
    și controlul reciproc al denumirilor de băuturi spirtoase și de băuturi aromatizate
  type: main
