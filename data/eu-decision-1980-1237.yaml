  script: Latn
  content: '80/1237/EEC: Commission Decision of 17 December 1980 amending Decision
    80/566/EEC authorizing certain Member States to provide for derogations from certain
    provisions of Council Directive 77/93/EEC in respect of oak wood originating in
    Canada (Only the French, Danish, German, Italian and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1237/CEE: Décision de la Commission, du 17 décembre 1980, modifiant
    la décision 80/566/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil, pour le bois de
    chêne originaire du Canada (Les textes en langues française, danoise, allemande,
    italienne et néerlandaise sont les seuls faisant foi)'
  type: main
