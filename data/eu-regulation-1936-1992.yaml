    καταλόγου που είναι προσαρτημένος στον κανονισμό
    (ΕΟΚ) αριθ. 55/87 για την κατάρτιση του καταλόγου
    των σκαφών συνολικού μήκους άνω των οκτώ μέτρων
    τα οποία επιτρέπεται να χρησιμοποιούν δοκότρατες
    σε ορισμένες παράκτιες περιοχές της Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1936/92, annettu 13 päivänä heinäkuuta 1992,
    tietyillä yhteisön rannikkoalueilla puomitroolin käyttöluvan omaavien kahdeksan
    metrin kokonaispituuden ylittävien alusten luettelosta annettuun asetukseen (ETY)
    N:o 55/87 liitetyn luettelon muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1936/92 della Commissione del 13 luglio 1992 recante
    modifica dell'elenco allegato al regolamento (CEE) n. 55/87 che fissa l'elenco
    dei pescherecci di lunghezza fuori tutto superiore a otto metri, autorizzato ad
    usare reti a strascico a pali in determinate zone della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1936/92 van de Commissie van 13 juli 1992 houdende
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 55/87 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde kustzones van de Gemeenschap mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1936/92 da Comissão de 13 de Julho de 1992 que altera
    a lista anexa ao Regulamento (CEE) nº 55/87 que estabelece a lista dos navios
    com mais de oito metros de comprimento de fora a fora autorizados a utilizar redes
    de arrasto de vara em determinadas zonas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1936/92 de la Comisión de 13 de julio de 1992 que
