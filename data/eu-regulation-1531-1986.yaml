title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1531/86 of 21 May 1986 re-establishing the
    levying of customs duties applicable to alkyds and other polyesters, in one of
    the forms mentioned in Note 3 (d) to Chapter 39; others, falling within subheading
    39.01 C III ex a), originating in South Korea, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: 'Règlement (CEE) n° 1531/86 de la Commission du 21 mai 1986 portant rétablissement
    de la perception des droits de douane applicables aux alkydes et autres polyesters
    sous l'' une des formes visées à la note 3 sous d) du chapitre 39: autres, de
    la sous-position 39.01 C III ex a) du tarif douanier commun, originaires de la
    Corée du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil'
  type: main
- language: de
  script: Latn
  content: 'Verordnung (EWG) Nr. 1531/86 der Kommission vom 21. Mai 1986 zur Wiedereinführung
    der Erhebung der Zölle für Alkyde und andere Polyester in Formen im Sinne der
    Vorschrift 3 d) zu Kapitel 39: andere, der Tarifstelle 39.01 C III ex a) des Gemeinsamen
    Zolltarifs, mit Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3599/85
    des Rates vorgesehenen Zollpräferenzen gewährt werden'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1531/86 af 21. maj 1986 om genindførelse
    af opkrævning af told for alkyder og andre polyestere i former som nævnt i bestemmelse
    3 d) til kapitel 39; andre, henhørende under pos. 39.01 C III ex a) og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1531/86 της Επιτροπής
    της 21ης Μαΐου 1986 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για αλκύδια και άλλους
    πολυεστέρες με μία από τις μορφές που αναφέρονται
    στη σημείωση 3 στοιχείο δ) του κεφαλαίου 39, άλλα,
    της διακρίσεως 39.01 Γ ΙΙΙ ex α) του κοινού δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1531/86 della Commissione del 21 maggio 1986 che ripristina
    la riscossione dei dazi doganali applicabili agli alchidi ed altri poliesteri
    nelle forme previste dalla nota 3 d) del capitolo 39; altri della sottovoce 39.01
    C III ex a) della tariffa doganale comune, originari della Corea del Sud beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: 'Verordening (EEG) nr. 1531/86 van de Commissie van 21 mei 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op alkyden en
    andere polyesters in één van de vormen bedoeld bij Aantekening 3 d) op Hoofdstuk
    39: andere, van post 39.01 C III ex a) van het gemeenschappelijk douanetarief,
    van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3599/85 van
    de Raad vermelde tariefpreferenties zijn verleend'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento (CEE) n.° 1531/86 da Comissão de 21 de Maio de 1986 que
