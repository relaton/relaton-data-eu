title:
- language: en
  script: Latn
  content: '73/153/EEC: Commission Decision of 23 May 1973 authorizing the Member
    States to allow the marketing of reproductive material of certain forest species
    subjected to reduced requirements'
  type: main
- language: fr
  script: Latn
  content: '73/153/CEE: Décision de la Commission, du 23 mai 1973, autorisant les
    États membres à admettre à la commercialisation des matériels de reproduction
    de certaines espèces forestières soumis à des exigences réduites'
  type: main
- language: de
  script: Latn
  content: '73/153/EWG: Entscheidung der Kommission vom 23. Mai 1973, mit der die
    Mitgliedstaaten ermächtigt werden, Vermehrungsgut bestimmter forstlicher Arten
    mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen'
  type: main
- language: da
  script: Latn
  content: '73/153/EØF: Kommissionens Beslutning af 23. maj 1973 hvorefter medlemsstaterne
    bemyndiges til at tillade handel med avlsmaterialer af bestemte forstlige arter,
    der opfylder mindre krav'
  type: main
- language: it
  script: Latn
  content: '73/153/CEE: Decisione della Commissione, del 23 maggio 1973, che autorizza
    gli Stati membri ad ammettere alla commercializzazione materiali di riproduzione
    di alcune specie forestali soggetti a esigenze ridotte'
  type: main
- language: nl
  script: Latn
  content: '73/153/EEG: Beschikking van de Commissie van 23 mei 1973 houdende machtiging
    van de Lid-Staten om teeltmateriaal van zekere bosbouwsoorten, waaraan minder
    strenge eisen zijn gesteld, tot de handel toe te laten'
  type: main
