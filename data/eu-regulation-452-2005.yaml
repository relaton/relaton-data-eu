  script: Latn
  content: Commission Regulation (EC) No 452/2005 of 18 March 2005 determining the
    extent to which applications lodged in March 2005 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
