  content: Commission Regulation (EEC) No 2498/76 of 13 October 1976 concerning the
    issue of an invitation to tender to the World Food Programme for use as food aid
    of vitaminized skimmed-milk powder to be purchased on the Community market for
    certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2498/76 de la Commission, du 13 octobre 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté destiné
    au programme alimentaire mondial pour différents pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2498/76 der Kommission vom 13. Oktober 1976 über
    die Ausschreibung zur Lieferung von auf dem Markt der Gemeinschaft gekauftem Magermilchpulver
