title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1531/88 of 31 May 1988 imposing a definitive
    anti-dumping duty on imports of potassium permanganate originating in the People'
    s Republic of China and definitively collecting the provisional anti-dumping duty
    imposed on those imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1531/88 du Conseil du 31 mai 1988 instituant un droit
    antidumping définitif sur les importations de permanganate de potassium originaire
    de la République populaire de Chine et portant perception définitive du droit
    antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1531/88 des Rates vom 31. Mai 1988 zur Erhebung eines
    endgültigen Antidumpingzolls auf die Einfuhren von Kaliumpermanganat mit Ursprung
    in der Volksrepublik China und zur endgültigen Vereinnahmung des auf diese Einfuhren
    erhobenen vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1531/88 af 31. maj 1988 om indførelse af
    en endelig antidumpingtold på importen af kaliumpermanganat med oprindelse i
    Den Kinesiske Folkerepublik og om endelig opkrævning af den midlertidige antidumpingtold
    på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1531/88 του Συμβουλίου
    της 31ης Μαΐου 1988 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές υπερμαγγανικού
    καλίου, καταγωγής Λαϊκής Δημοκρατίας της Κίνας,
    και για την οριστική είσπραξη του προσωρινού
    δασμού αντιντάμπινγκ που έχει επιβληθεί στις
    εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1531/88 del Consiglio del 31 maggio 1988 che istituisce
    un dazio antidumping definitivo sulle importazioni di permanganato di potassio
    originario della Repubblica popolare cinese e stabilisce la riscossione definitiva
    del dazio antidumping provvisorio istituito su dette importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1531/88 van de Raad van 31 mei 1988 tot instelling
    van een definitief anti-dumpingrecht op de invoer van kaliumpermanganaat van oorsprong
    uit de Volksrepubliek China en tot definitieve inning van het op deze invoer ingestelde
    voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1531/88 do Conselho de 31 de Maio de 1988 que institui
    um direito antidumping definitivo sobre as importações de permanganato de potássio
    originário da República Popular da China e que estabelece a cobrança definitiva
    do direito antidumping provisório instituído sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1531/88 del Consejo de 31 de mayo de 1988 por el que
    se establece un derecho antidumping definitivo sobre las importaciones de permanganato
    potásico originario de la República Popular de China y se percibe definitivamente
    el derecho antidumping provisional establecido sobre dichas importaciones
  type: main
