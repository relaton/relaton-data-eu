title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/3009 of 28 November 2024 on the position to
    be taken on behalf of the European Union within the Association Council established
    by the Euro-Mediterranean Agreement establishing an association between the European
    Communities and their Member States, of the one part, and the Republic of Tunisia,
    of the other part, as regards the amendment of that Agreement by replacing Protocol
    No 4 concerning the definition of the concept of ‘originating products’ and
    methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3009 du Conseil du 28 novembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    la Communauté européenne et ses États membres, d’une part, et la République
    tunisienne, d’autre part, en ce qui concerne la modification dudit accord par
    le remplacement de son protocole n° 4 relatif à la définition de la notion
    de «produits originaires» et aux méthodes de coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/3009 des Rates vom 28. November 2024 über den Standpunkt,
