---
id: EUDecision1977763
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 April 1977 authorizing the French Republic not
    to apply Community treatment to tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or china (including biscuit
    porcelain and parian) or of other kinds of pottery other than common pottery or
    stoneware falling within heading No 69.11 and subheadings 69.12 C and D of the
    Common Customs Tariff, originating in the People's Republic of China and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/763/CEE: Décision de la Commission, du 6 avril 1977, autorisant la
    République française à exclure du traitement communautaire la vaisselle et
    les articles de ménage ou de toilette en porcelaine ou en autres matières céramiques
    que la terre commune ou le grès, de la position 69.11 et des sous-positions 69.12
    C et D du Tarif douanier commun, originaires de la République populaire de Chine
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. April 1977, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammendes und in den anderen
    Mitgliedstaaten im freien Verkehr befindliches Geschirr sowie Haushalts- und Toilettengegenstände
    aus Porzellan oder aus anderen keramischen Stoffen als gewöhnlichem Ton und Steinzeug
    der Tarifnummern 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. april 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage bordservice samt husholdnings-
    og toiletartikler af porcelæn eller af andet keramisk materiale end almindeligt
    ler og stentøj, som henhører under pos. 69.11 og pos. 69.12 C og D i den fælles
    toldtarif, har oprindelse Den kinesiske Folkerepublik og frit kan omsættes i
    de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 aprile 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il vasellame e gli oggetti di
    uso domestico o da toletta, di porcellana o di altre materie ceramiche ad ecccezione
    della terracotta comune e del gres, delle voci 69.11 e 69.12 C e D della tariffa
    doganale comune, originari della Repubblica popolare cinese e messi in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 april 1977 waarbij de Franse Republiek
    wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen, van porselein
    of van andere keramische stoffen dan gewoon aardewerk of gres, van de posten 69.11
    en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
