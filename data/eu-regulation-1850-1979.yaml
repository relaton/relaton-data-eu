title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1850/79 of 20 August 1979 re-establishing
    the levying of customs duties on salicylic acid, falling within subheading 29.16
    B I a) and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1850/79 de la Commission, du 20 août 1979, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    salicylique, de la sous-position 29.16 B I a) du tarif douanier commun, originaire
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1850/79 der Kommission vom 20. August 1979 zur Wiedereinführung
    des Zollsatzes für Salicylsäure der Tarifstelle 29.16 B I a), mit Ursprung in
    Rumänien, dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1850/79 af 20. august 1979 om genindførelse
    af opkrævning af toldafgifter for salicylsyre, henhørende under pos. 29.16 B
    I a) i den fælles toldtarif, som har oprindelse i Rumænien og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1850/79 della Commissione, del 20 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili all' acido salicilico,
    della sottovoce 29.16 B I a) della tariffa doganale comune, originario della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1850/79 van de Commissie van 20 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op salicylzuur,
    van post 29.16 B I a), van oorsprong uit Roemenië ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
