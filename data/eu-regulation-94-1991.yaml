title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 94/91 of 15 January 1991 suspending the
    preferential customs duties and re-introducing the Common Customs Tariff duty
    on imports of large-flowered roses originating in Morocco
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 94/91 de la Commission, du 15 janvier 1991, suspendant
