    greca di cotone non sgranato nonché la conseguente riduzione del prezzo di obiettivo
    e che deroga, per la campagna di commercializzazione 2001/2002, a talune regole
    di gestione e a talune modalità di concessione dell'aiuto in Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1398/2002 van de Commissie van 31 juli 2002 tot vaststelling
