    sich daraus ergebenden Verringerung des Zielpreises und zur Abweichung von bestimmten
    Verwaltungsvorschriften und Beihilfemodalitäten für das Wirtschaftsjahr 2001/02
    in Griechenland
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1398/2002 af 31. juli 2002 om fastsættelse
