title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1398/2002 of 31 July 2002 fixing, for the
    2001/02 marketing year, the actual production of unginned cotton in Greece and
    the resulting reduction of the guide price and derogating, for the 2001/02 marketing
    year, from certain management rules and aid award procedures in Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1398/2002 de la Commission du 31 juillet 2002 fixant,
    pour la campagne de commercialisation 2001/2002, la production effective grecque
    de coton non égrené ainsi que la réduction du prix d'objectif qui en résulte
    et dérogeant, pour la campagne de commercialisation 2001/2002, à certaines règles
    de gestion et modalités d'octroi de l'aide en Grèce
  type: main
- language: de
  script: Latn
