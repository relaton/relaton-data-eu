    οδηγίας 85/73/ΕΟΚ για τη χρηματοδότηση των υγειονομικών
    επιθεωρήσεων και ελέγχων των ζωικών προϊόντων
    που αναφέρονται στο παράρτημα Α της οδηγίας
    89/662/ΕΟΚ και στην οδηγία 90/675/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 94/64/EY, annettu 14 päivänä joulukuuta 1994, direktiivin
