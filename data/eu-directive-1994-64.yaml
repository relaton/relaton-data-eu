    eläinlääkärintarkastusten ja -valvonnan rahoittamisesta annetun direktiivin
    85/73/ETY liitteen muuttamisesta
  type: main
- language: it
  script: Latn
  content: DIRETTIVA 94/64/CE DEL CONSIGLIO del 14 dicembre 1994 che modifica l' allegato
    della direttiva 85/73/CEE relativa al finanziamento delle ispezioni e dei controlli
    veterinari dei prodotti di origine animale di cui all' allegato A della direttiva
    89/662/CEE e alla direttiva 90/675/CEE
  type: main
- language: nl
  script: Latn
  content: RICHTLIJN 94/64 EG VAN DE RAAD van 14 december 1994 tot wijziging van de
    bijlage bij Richtlijn 85/73/EEG inzake de financiering van de keuringen en veterinaire
    controles van dierlijke produkten zoals bedoeld in bijlage A van Richtlijn 89/662/EEG
    en in Richtlijn 90/675/EEG
  type: main
- language: pt
  script: Latn
  content: DIRECTIVA 94/64/CE DO CONSELHO de 14 de Dezembro de 1994 que altera o anexo
    da Directiva 85/73/CEE, relativa ao financiamento das inspecções e controlos
    veterinários dos produtos de origem animal a que se referem o anexo A da Directiva
    89/662/CEE e a Directiva 90/675/CEE
  type: main
- language: es
  script: Latn
  content: DIRECTIVA 94/64/CE DEL CONSEJO de 14 de diciembre de 1994 por la que se
