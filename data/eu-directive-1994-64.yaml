title:
- language: en
  script: Latn
  content: Council Directive 94/64/EEC of 14 December 1994 amending the Annex to Directive
    85/73/EEC on the financing of veterinary inspections and controls of animal products
    covered by Annex a to Directive 89/662/EEC and by Directive 90/675/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 94/64/CE du Conseil du 14 décembre 1994 modifiant l'annexe de
    la directive 85/73/CEE relative au financement des inspections et contrôles vétérinaires
    des produits animaux visés à l'annexe A de la directive 89/662/CEE et à la
    directive 90/675/CEE
  type: main
- language: de
  script: Latn
  content: RICHTLINIE 94/64/EG DES RATES vom 14. Dezember 1994 zur Änderung des Anhangs
    der Richtlinie 85/73/EWG über die Finanzierung der veterinär- und hygienerechtlichen
    Kontrollen von tierischen Erzeugnissen im Sinne des Anhangs A der Richtlinie 89/662/EWG
    und im Sinne der Richtlinie 90/675/EWG
  type: main
- language: da
  script: Latn
  content: RÅDETS DIREKTIV 94/64/EØF af 14. december 1994 om ændring af bilaget
    til direktiv 85/73/EØF om finansiering af veterinærundersøgelse og -kontrol
