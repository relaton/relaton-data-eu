    og i direktiv 90/675/EØF
  type: main
- language: el
  script: Grek
  content: ΟΔΗΓΙΑ 94/64/ΕΚ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 14ης Δεκεμβρίου
