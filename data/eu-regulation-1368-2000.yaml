title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1368/2000 of 28 June 2000 amending Regulation
    (EC) No 539/2000 increasing to 220 307 tonnes the quantity of common wheat of
    breadmaking quality held by the German intervention agency for which a standing
    invitation to tender for export to certain ACP countries has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1368/2000 de la Commission du 28 juin 2000 modifiant
    le règlement (CE) n° 539/2000 et portant à 220 307 tonnes l'adjudication permanente
    pour l'exportation de blé tendre panifiable détenu par l'organisme d'intervention
    allemand et destiné à être exporté vers certains pays ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1368/2000 der Kommission vom 28. Juni 2000 zur Änderung
    der Verordnung (EG) Nr. 539/2000 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr in bestimmte AKP-Länder von im Besitz der deutschen Interventionsstelle
    befindlichem Brotweichweizen auf 220 307 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1368/2000 af 28. juni 2000 om ændring
    af forordning (EF) nr. 539/2000 og om forhøjelse til 220 307 tons af den løbende
    licitation med henblik på eksport til en række AVS-lande af bageegnet blød
    hvede som er i det tyske interventionsorgans besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1368/2000 της Επιτροπής,
    της 28ης Ιουνίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 539/2000 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 220 307 τόνων μαλακού αρτοποιήσιμου
    σίτου που έχει στη διάθεσή του ο γερμανικός
    οργανισμός παρέμβασης και ο οποίος προορίζεται
    για εξαγωγή προς ορισμένες χώρες ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1368/2000, annettu 28 päivänä kesäkuuta 2000,
    asetuksen (EY) N:o 539/2000 muuttamisesta ja Saksan interventioelimen hallussaan
    pitämän leipävehnän vientiä tiettyihin AKT-maihin koskevan pysyvän tarjouskilpailun
    kohteena olevan määrän nostamisesta 220 307 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1368/2000 della Commissione, del 28 giugno 2000, che
    modifica il regolamento (CE) n. 539/2000 e che porta a 220 307 tonnellate il quantitativo
    globale oggetto della gara permanente per l'esportazione in alcuni paesi ACP di
    frumento tenero panificabile detenuto dall'organismo d'intervento tedesco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1368/2000 van de Commissie van 28 juni 2000 tot wijziging
    van Verordening (EG) nr. 539/2000, teneinde de hoeveelheid waarop de permanente
    openbare inschrijving voor de uitvoer naar sommige ACS-landen van zachte tarwe
    van bakkwaliteit uit Duitse interventievoorraden betrekking heeft, tot 220 307
    ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1368/2000 da Comissão, de 28 de Junho de 2000, que
    altera o Regulamento (CE) n.° 539/2000 e eleva a 220 307 toneladas o concurso
    permanente para a exportação para determinados países ACP de trigo mole panificável
    detido pelo organismo de intervenção alemão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1368/2000 de la Comisión, de 28 de junio de 2000,
    por el que se modifica el Reglamento (CE) n° 539/2000 y se eleva a 220 307 toneladas
    la licitación permanente para la exportación a determinados países ACP de trigo
    blando panificable en poder del organismo de intervención alemán
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1368/2000 av den 28 juni 2000 om ändring
    av förordning (EG) nr 539/2000 och om höjning till 220 307 ton av den stående
    anbudsinfordran för export till vissa AVS-länder av vete av brödkvalitet som
    innehas av det tyska interventionsorganet
  type: main
