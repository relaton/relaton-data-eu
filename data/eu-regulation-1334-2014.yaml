  script: Latn
  content: Provedbena uredba Komisije (EU) br. 1334/2014 оd 16. prosinca 2014. o
    odobravanju aktivne tvari gama-cihalotrin u skladu s Uredbom (EZ) br. 1107/2009
    Europskog parlamenta i Vijeća o stavljanju na tržište sredstava za zaštitu
    bilja i o izmjeni Priloga Provedbenoj uredbi Komisije (EU) br. 540/2011 i o dopuštanju
    državama članicama da produže privremena odobrenja za tu aktivnu tvar
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1334/2014/EU végrehajtási rendelete ( 2014. december 16.
    ) a gamma-cihalotrin hatóanyagnak a növényvédő szerek forgalomba hozataláról
    szóló 1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyásáról,
    az 540/2011/EU bizottsági végrehajtási rendelet mellékletének módosításáról,
    továbbá az említett hatóanyag ideiglenes engedélyeinek a tagállamok által
    történő meghosszabbításának engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1334/2014 della Commissione, del 16 dicembre
    2014 , che approva la sostanza attiva gamma-cyhalotrin in conformità al regolamento
    (CE) n. 1107/2009 del Parlamento europeo e del Consiglio relativo all'immissione
    sul mercato dei prodotti fitosanitari, modifica l'allegato del regolamento di
    esecuzione (UE) n. 540/2011 della Commissione e consente agli Stati membri di
    prorogare le autorizzazioni provvisorie concesse per tale sostanza attiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 1334/2014 ( 2014. gada 16. decembris
    ), ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009
    par augu aizsardzības līdzekļu laišanu tirgū apstiprina darbīgo vielu gamma-cihalotrīnu
    un groza Komisijas Īstenošanas regulas (ES) Nr. 540/2011 pielikumu, kā arī
    atļauj dalībvalstīm pagarināt minētajai darbīgajai vielai piešķirtās
    pagaidu atļaujas
  type: main
- language: lt
  script: Latn
  content: 2014 m. gruodžio 16 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 1334/2014,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką patvirtinama veiklioji medžiaga
    gama-cihalotrinas ir iš dalies keičiamas Komisijos įgyvendinimo reglamento
    (ES) Nr. 540/2011 priedas ir valstybėms narėms suteikiama galimybė pratęsti
    šios veikliosios medžiagos laikinosios registracijos galiojimą
  type: main
