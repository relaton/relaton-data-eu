    възможност на държавите членки да удължат
    срока на временните разрешения, предоставени
    за посоченото активно вещество
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 1334/2014 ze dne 16. prosince
