title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1334/2014 of 16 December 2014
    approving the active substance gamma-cyhalotrin, in accordance with Regulation
    (EC) No 1107/2009 of the European Parliament and of the Council concerning the
    placing of plant protection products on the market, and amending the Annex to
    Commission Implementing Regulation (EU) No 540/2011 and allowing Member States
    to extend provisional authorisations granted for that active substance
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 1334/2014 de la Commission du 16 décembre
    2014 portant approbation de la substance active gamma-cyhalothrine, conformément
    au règlement (CE) n ° 1107/2009 du Parlement européen et du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques, modifiant l'annexe du
    règlement d'exécution (UE) n ° 540/2011 et autorisant les États membres à
    prolonger les autorisations provisoires accordées pour cette substance active
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1334/2014 der Kommission vom 16. Dezember
    2014 zur Genehmigung des Wirkstoffs gamma-Cyhalothrin gemäß der Verordnung (EG)
    Nr. 1107/2009 des Europäischen Parlaments und des Rates über das Inverkehrbringen
    von Pflanzenschutzmitteln und zur Änderung des Anhangs der Durchführungsverordnung
    (EU) Nr. 540/2011 der Kommission sowie zur Ermächtigung der Mitgliedstaaten,
    vorläufige Zulassungen betreffend diesen Wirkstoff zu verlängern
  type: main
- language: bg
  script: Cyrl
