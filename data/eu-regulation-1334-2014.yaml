    (KE) Nru 1107/2009 tal-Parlament Ewropew u tal-Kunsill dwar it-tqegħid fis-suq
    ta' prodotti għall-protezzjoni tal-pjanti, u li jemenda l-Anness tar-Regolament
    ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 540/2011 u li jippermetti lill-Istati
    Membri jestendu l-awtorizzazzjonijiet proviżorji mogħtija għal dik is-sustanza
    attiva
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1334/2014 van de Commissie van 16 december
    2014 tot goedkeuring van de werkzame stof gamma-cyhalothrin overeenkomstig Verordening
    (EG) nr. 1107/2009 van het Europees Parlement en de Raad betreffende het op de
    markt brengen van gewasbeschermingsmiddelen, en tot wijziging van de bijlage bij
