    lidstaten om de geldigheidsduur van voorlopige toelatingen voor de werkzame stof
    te verlengen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 1334/2014 z dnia 16 grudnia
    2014 r. w sprawie zatwierdzenia substancji czynnej gamma-cyhalotryna, zgodnie
    z rozporządzeniem Parlamentu Europejskiego i Rady (WE) nr 1107/2009 dotyczącym
    wprowadzania do obrotu środków ochrony roślin, w sprawie zmiany załącznika
    do rozporządzenia wykonawczego Komisji (UE) nr 540/2011 oraz umożliwienia państwom
    członkowskim przedłużenia tymczasowych zezwoleń udzielonych dla tej substancji
    czynnej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 1334/2014 da Comissão, de 16 de dezembro
    de 2014 , que aprova a substância ativa gama-cialotrina, em conformidade com
    o Regulamento (CE) n. ° 1107/2009 do Parlamento Europeu e do Conselho, relativo
    à colocação dos produtos fitofarmacêuticos no mercado, e que altera o anexo
    do Regulamento de Execução (UE) n. ° 540/2011 da Comissão e autoriza os Estados-Membros
    a prorrogar as autorizações provisórias concedidas a essa substância ativa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1334/2014 al Comisiei din
    16 decembrie 2014 de aprobare a substanței active gama-cihalotrin, în conformitate
    cu Regulamentul (CE) nr. 1107/2009 al Parlamentului European și al Consiliului
    privind introducerea pe piață a produselor fitosanitare, de modificare a anexei
    la Regulamentul de punere în aplicare (UE) nr. 540/2011 al Comisiei și de acordare
    a permisiunii statelor membre să extindă autorizațiile provizorii pentru substanța
    activă respectivă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 1334/2014 zo 16. decembra 2014
    , ktorým sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009
    o uvádzaní prípravkov na ochranu rastlín na trh schvaľuje účinná látka
    gama-cyhalotrín a ktorým sa mení príloha k vykonávaciemu nariadeniu Komisie
    (EÚ) č. 540/2011, a ktorým sa členským štátom povoľuje predĺžiť platnosť
    dočasných autorizácií udelených pre uvedenú účinnú látku
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 1334/2014 z dne 16. decembra 2014 o
    odobritvi aktivne snovi gama-cihalotrin v skladu z Uredbo (ES) št. 1107/2009
    Evropskega parlamenta in Sveta o dajanju fitofarmacevtskih sredstev v promet ter
    o spremembi Priloge k Izvedbeni uredbi Komisije (EU) št. 540/2011 in o dovoljenju
    državam članicam, da podaljšajo veljavnost začasnih registracij, ki so jih
    izdale za navedeno aktivno snov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °1334/2014 de la Comisión, de 16 de diciembre
    de 2014 , por el que se aprueba la sustancia activa gamma-cihalotrin con arreglo
    al Reglamento (CE) n ° 1107/2009 del Parlamento Europeo y del Consejo, relativo
    a la comercialización de productos fitosanitarios, se modifica el anexo del Reglamento
    de Ejecución (UE) n ° 540/2011 y se permite a los Estados miembros ampliar las
    autorizaciones provisionales concedidas para dicha sustancia activa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 1334/2014 av den 16 december
    2014 om godkännande av det verksamma ämnet gamma-cyhalotrin i enlighet med Europaparlamentets
    och rådets förordning (EG) nr 1107/2009 om utsläppande av växtskyddsmedel
    på marknaden, om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011 och om tillstånd för medlemsstaterna att förlänga provisoriska
    godkännanden som beviljats det verksamma ämnet
