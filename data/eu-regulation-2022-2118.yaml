  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/2118, 13. juuli 2022, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2020/1503 seoses ühisrahastusteenuse
    osutajate individuaalse laenuportfelli valitsemise regulatiivsete tehniliste standarditega,
