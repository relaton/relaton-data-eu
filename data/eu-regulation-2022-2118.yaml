    avaldatav teave iga üksiku portfelli kohta ning ettenägematute kulude reservidega
    seoses nõutavad põhimõtted ja menetlused
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/2118, annettu 13 päivänä heinäkuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) 2020/1503 täydentämisestä
    joukkorahoituspalvelun tarjoajien suorittamaa yksilöllistä lainasalkunhoitoa
    koskevilla teknisillä sääntelystandardeilla, joissa täsmennetään luottoriskin
    arviointimenetelmän osatekijät, kustakin yksittäisestä salkusta sijoittajille
    julkistettavat tiedot sekä vararahastoihin liittyvät toimintaperiaatteet ja
    menettelyt
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/2118 ón gCoimisiún an 13 Iúil 2022 lena
    bhforlíontar Rialachán (AE) 2020/1503 ó Pharlaimint na hEorpa agus ón gComhairle
    maidir le caighdeáin theicniúla rialála i ndáil le bainistíocht punainne
    aonair iasachtaí a dhéanann soláthraithe seirbhísí sluachistiúcháin, lena
    sonraítear na heilimintí den mhodh chun measúnú a dhéanamh ar riosca creidmheasa,
    an fhaisnéis maidir le gach punann aonair atá le nochtadh d’infheisteoirí,
    agus na beartais agus na nósanna imeachta is gá i ndáil le cistí teagmhasacha
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2118 оd 13. srpnja 2022. o dopuni
    Uredbe (EU) 2020/1503 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda o portfeljima zajmova kojima na pojedinačnoj osnovi upravljaju pružatelji
    usluga skupnog financiranja, kojima se utvrđuju elementi metode procjene kreditnog
    rizika, informacije o svakom pojedinačnom portfelju koje se obznanjuju ulagateljima
    te obvezne politike i postupci u pogledu fondova za nepredviđene izdatke
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2118 felhatalmazáson alapuló rendelete (2022.
    július 13.) az (EU) 2020/1503 európai parlamenti és tanácsi rendeletnek a
    közösségi finanszírozási szolgáltatók által végzett egyéni hitelportfólió-kezelésre
    vonatkozó, a hitelkockázat-értékelési módszertan elemeit, az egyes portfóliókra
    vonatkozóan a befektetők számára rendelkezésre bocsátandó információkat,
    valamint a vészhelyzeti alapokkal kapcsolatban szükséges szabályzatokat és
    eljárásokat meghatározó szabályozástechnikai standardok tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2118 della Commissione del 13 luglio 2022
    che integra il regolamento (UE) 2020/1503 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione sulla gestione individuale
    di portafogli di prestiti da parte di fornitori di servizi di crowdfunding, specificando
    gli elementi del metodo di valutazione del rischio di credito, le informazioni
    su ciascun portafoglio individuale da comunicare agli investitori e le politiche
    e le procedure richieste in relazione ai fondi a copertura dei rischi
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2118 (2022. gada 13. jūlijs), ar
    kuru attiecībā uz regulatīvajiem tehniskajiem standartiem par aizdevumu portfeļu
    individuālo pārvaldību, ko veic kolektīvās finansēšanas pakalpojumu sniedzēji,
    Eiropas Parlamenta un Padomes Regulu (ES) 2020/1503 papildina, precizējot kredītriska
    novērtēšanas metodes elementus, ieguldītājiem atklājamo informāciju par
    katru atsevišķo portfeli un politiku un procedūras, kas nepieciešamas attiecībā
    uz ārkārtas gadījumiem paredzētajiem fondiem
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2118 2022 m. liepos 13 d.
    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2020/1503 papildomas sutelktinio
    finansavimo paslaugų teikėjų atliekamo individualių paskolų portfelių valdymo
    techniniais reguliavimo standartais, kuriais nustatomi kredito rizikos vertinimo
    metodo elementai, investuotojams atskleistina informacija apie kiekvieną individualų
    portfelį ir nenumatytų atvejų fondams taikytina politika bei procedūros
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2118 tat-13 ta’ Lulju 2022
    li jissupplimenta r-Regolament (UE) 2020/1503 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji dwar l-immaniġġjar ta’ portafolli
    individwali ta’ self minn fornituri ta’ servizzi ta’ finanzjament kollettiv,
    li jispeċifikaw l-elementi tal-metodu għall-valutazzjoni tar-riskju tal-kreditu,
    l-informazzjoni dwar kull portafoll individwali li għandha tiġi żvelata lill-investituri,
    u l-politiki u l-proċeduri meħtieġa fir-rigward tal-fondi ta’ kontinġenza
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2118 van de Commissie van 13 juli 2022
    tot aanvulling van Verordening (EU) 2020/1503 van het Europees Parlement en de
    Raad met betrekking tot technische reguleringsnormen voor het individuele portefeuillebeheer
    van leningen door crowdfundingdienstverleners en tot nadere bepaling van de elementen
    voor de beoordeling van het kredietrisico, de informatie betreffende elke individuele
    portefeuille die aan beleggers bekend moet worden gemaakt en de in verband met
    noodfondsen vereiste beleidsregels en procedures
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2118 z dnia 13 lipca 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2020/1503
    w odniesieniu do regulacyjnych standardów technicznych w zakresie indywidualnego
    zarządzania portfelem pożyczek przez dostawców usług finansowania społecznościowego,
    określające elementy metody stosowanej do oceny ryzyka kredytowego, informacje
    dotyczące każdego indywidualnego portfela, które należy ujawnić inwestorom,
    oraz polityki i procedury wymagane w odniesieniu do funduszy zabezpieczających
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2118 da Comissão de 13 de julho de 2022
    que complementa o Regulamento (UE) 2020/1503 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação relativas à gestão
    individual de carteiras de empréstimos por prestadores de serviços de financiamento
    colaborativo, que especificam os elementos do método de avaliação do risco
    de crédito, as informações sobre cada carteira individual a divulgar aos investidores
    e as políticas e os procedimentos exigidos em relação aos fundos de contingência
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2118 al Comisiei din 13 iulie 2022 de completare
    a Regulamentului (UE) 2020/1503 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare referitoare la administrarea
    de portofolii individuale de împrumuturi de către furnizorii de servicii de
    finanțare participativă, precizând elementele metodei de evaluare a riscului
    de credit, informațiile privind fiecare portofoliu individual care trebuie comunicate
    investitorilor, precum și politicile și procedurile necesare cu privire la fondurile
    de rezervă
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2118 z 13. júla 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2020/1503, pokiaľ
    ide o regulačné technické predpisy týkajúce sa riadenia individuálneho portfólia
    pôžičiek poskytovateľmi služieb hromadného financovania, ktorými sa spresňujú
    prvky metódy posúdenia kreditného rizika, informácie o každom individuálnom
    portfóliu, ktoré sa majú oznámiť investorom, a politiky a postupy vyžadované
    v súvislosti s fondmi na nepredvídané udalosti
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2118 z dne 13. julija 2022 o dopolnitvi
    Uredbe (EU) 2020/1503 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o individualnem upravljanju portfeljev posojil s strani ponudnikov storitev
    množičnega financiranja, ki določajo elemente metode za oceno kreditnega tveganja,
    informacije o vsakem posameznem portfelju, ki se razkrijejo vlagateljem, ter politike
    in postopke, potrebne v zvezi z rezervnimi skladi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2118 de la Comisión de 13 de julio de 2022
    por el que se completa el Reglamento (UE) 2020/1503 del Parlamento Europeo y del
    Consejo en lo que respecta a las normas técnicas de regulación sobre la gestión
    individualizada de carteras de préstamos por parte de los proveedores de servicios
    de financiación participativa, que especifican los elementos del método utilizado
    para evaluar el riesgo de crédito, la información sobre cada cartera de préstamos
    que debe comunicarse a los inversores, y las políticas y procedimientos que deben
    adoptarse en lo que respecta a los fondos de contingencia
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2118 av den 13 juli 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) 2020/1503
    vad gäller tekniska tillsynsstandarder för individuell portföljförvaltning
    av lån från leverantörer av gräsrotsfinansieringstjänster, som specificerar
    inslagen i metoden för bedömningen av kreditrisken, information om varje enskild
    portfölj som ska lämnas till investerare och de riktlinjer och förfaranden
    som krävs i samband med beredskapsfonder
  type: main
