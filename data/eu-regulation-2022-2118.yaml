title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2118 of 13 July 2022 supplementing
    Regulation (EU) 2020/1503 of the European Parliament and of the Council with regard
    to regulatory technical standards on individual portfolio management of loans
    by crowdfunding service providers, specifying the elements of the method to assess
    credit risk, the information on each individual portfolio to be disclosed to investors,
    and the policies and procedures required in relation to contingency funds
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2118 de la Commission du 13 juillet 2022
    complétant le règlement (UE) 2020/1503 du Parlement européen et du Conseil
    par des normes techniques de réglementation relatives à la gestion individuelle
    de portefeuilles de prêts par les prestataires de services de financement participatif,
    précisant les éléments de la méthode d’évaluation du risque de crédit,
    les informations à communiquer aux investisseurs sur chaque portefeuille individuel
    et les politiques et procédures requises en ce qui concerne les fonds de réserve
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2118 der Kommission vom 13. Juli 2022 zur
    Ergänzung der Verordnung (EU) 2020/1503 des Europäischen Parlaments und des
    Rates in Bezug auf technische Regulierungsstandards für die individuelle Verwaltung
    des Kreditportfolios durch Schwarmfinanzierungsdienstleister, in denen die Elemente
    der Methode zur Kreditrisikobewertung, die den Anlegern zu jedem einzelnen Portfolio
    offenzulegenden Informationen und die für Notfallfonds erforderlichen Regelungen
    und Verfahren festgelegt sind
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/2118 на Комисията
    от 13 юли 2022 година за допълнение на Регламент
    (ЕС) 2020/1503 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    относно индивидуалното управление на портфейл
    от заеми от страна на доставчици на услуги
    за колективно финансиране, с които се определят
    елементите на метода за оценка на кредитния
    риск, информацията за всеки отделен портфейл,
    която трябва да бъде оповестявана пред инвеститорите,
    както и политиките и процедурите, изисквани
    във връзка с фондовете за непредвидени обстоятелства
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/2118 ze dne 13. července
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2020/1503,
    pokud jde o regulační technické normy pro individuální správu portfolií
    úvěrů poskytovateli služeb skupinového financování, upřesňující prvky
    metody posuzování úvěrového rizika, informace o každém jednotlivém portfoliu,
    které mají být sděleny investorům, a politiky a postupy požadované ve vztahu
    k pohotovostním fondům
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/2118 af 13. juli 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2020/1503
    for så vidt angår reguleringsmæssige tekniske standarder for crowdfundingtjenesteudbyderes
    individuelle porteføljepleje af lån for at præcisere metoden til vurdering
    af kreditrisikoen, de oplysninger om hver individuel portefølje, som skal gives
    til investorerne, og de nødvendige politikker og procedurer i forbindelse med
    reservefonde
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/2118
    της Επιτροπής της 13ης Ιουλίου 2022 για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2020/1503 του Ευρωπαϊκού Κοινοβουλίου
