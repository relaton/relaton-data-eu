    pour la mise en œuvre des normes de base communes dans le domaine de la sûreté
    de l’aviation civile, en ce qui concerne les méthodes utilisées pour l’inspection/le
    filtrage des personnes autres que les passagers et des objets qu’elles transportent
  type: main
- language: de
  script: Latn
