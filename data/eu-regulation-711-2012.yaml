  script: Latn
  content: Commission Implementing Regulation (EU) No 711/2012 of 3 August 2012 amending
    Regulation (EU) No 185/2010 laying down detailed measures for the implementation
    of the common basic standards on aviation security as regards the methods used
    for screening persons other than passengers and items carried
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 711/2012 de la Commission du 3 août
