title:
- language: en
  script: Latn
  content: '96/483/EC: Commission Decision of 12 July 1996 drawing up the list of
    third countries entitled to use the model animal health certificates for imports
    into the Community of live poultry and hatching eggs other than ratites and eggs
    thereof as laid down by Decision 96/482/EC'
  type: main
- language: fr
  script: Latn
  content: '96/483/CE: Décision de la Commission du 12 juillet 1996 établissant
    la liste des pays tiers habilités à utiliser les certificats sanitaires modèles
    pour les importations dans la Communauté de volailles vivantes et d''oeufs à
    couver, à l''exclusion des ratites et de leurs oeufs à couver, conformément
    à la décision 96/482/CE'
  type: main
- language: de
  script: Latn
  content: '96/483/EG: Entscheidung der Kommission vom 12. Juli 1996 zur Erstellung
    einer Liste von Drittländern, die befugt sind, für die Einfuhr in die Gemeinschaft
    von lebendem Geflügel und Bruteiern, ausgenommen Laufvögel (Flachbrustvögel)
    und deren Bruteier, die Tiergesundheitsbescheinigungen nach den in der Entscheidung
    96/482/EG vorgesehenen Mustern zu verwenden'
  type: main
- language: da
  script: Latn
  content: '96/483/EF: Kommissionens beslutning af 12. juli 1996 om listen over tredjelande,
    der er berettigede til at benytte modellen til sundhedscertifikater ved indførsel
    til Fællesskabet af levende fjerkræ og rugeæg, bortset fra strudsefugle og
    strudseæg, som fastsat i beslutning 96/482/EF'
  type: main
- language: el
  script: Grek
  content: '96/483/ΕΚ: Απόφαση της Επιτροπής της 12ης Ιουλίου
    1996 για την κατάρτιση του καταλόγου τρίτων χωρών
    στις οποίες επιτρέπεται να χρησιμοποιούν τα
    υποδείγματα των πιστοποιητικών υγείας των
    ζώων για εισαγωγές στην Κοινότητα ζώντων πουλερικών
    και αυγών για επώαση, εκτός των στρουθιονιδών
    και των αυγών τους, όπως προβλέπεται στην απόφαση
    96/482/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '96/483/EY: Komission päätös, tehty 12 päivänä heinäkuuta 1996,
    komission päätöksessä 96/482/EY määrättyjen elävän siipikarjan ja siitosmunien,
    lukuun ottamatta sileälastaisia lintulajeja ja niiden munia, tuontia yhteisöön
    varten myönnettävien eläinten terveystodistusten malleja käyttämään oikeutettujen
    kolmansien maiden luettelon laatimisesta'
  type: main
- language: it
  script: Latn
  content: '96/483/CE: Decisione della Commissione del 12 luglio 1996 recante l''elenco
    dei paesi terzi autorizzati ad utilizzare i modelli di certificati sanitari per
    le importazioni nella Comunità di pollame vivo e uova da cova, ad eccezione dei
    ratiti e delle relative uova, di cui alla decisione 96/482/CE'
  type: main
- language: nl
  script: Latn
  content: '96/483/EG: Beschikking van de Commissie van 12 juli 1996 tot vaststelling
    van de lijst van derde landen die gebruik mogen maken van de diergezondheidscertificaten
