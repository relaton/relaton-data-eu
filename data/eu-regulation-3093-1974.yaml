title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3093/74 of the Commission of 6 December 1974 re-establishing
    the levying of customs duties on woven fabrics of silk or of waste silk other
    than noil, falling within heading No 50.09, originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3505/73
    of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3093/74 de la Commission, du 6 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie ou de bourre de soie (schappe), de la position tarifaire 50.09, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3505/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3093/74 der Kommission vom 6. Dezember 1974 zur Wiedereinführung
    des Zollsatzes für Gewebe aus Seide oder Schappeseide der Tarifnummer 50.09 mit
    Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3505/73 des Rates vom
    18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3093/74 af 6. december 1974 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke (undtagen af bourettesilke)
    under position 50.09, som har oprindelse i Indien og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3505/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3093/74 della Commissione, del 6 dicembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta o di
    borra di seta (schappe), della voce doganale n. 50.09, originari dell'India, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3505/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3093/74 van de Commissie van 6 december 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op weefsels
    van zijde of van vlokzijde van post 50.09, van oorsprong uit India, ten behoeve
    waarvan bij Verordening (EEG) nr. 3505/73 van de Raad van 18 december 1973 tariefpreferenties
    werden geopend
  type: main
