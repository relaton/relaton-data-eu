title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1249/2000 of 15 June 2000 amending Regulation
    (EC) No 2848/98 in the raw tobacco sector as regards the final date for using
    the specific aid, the repayment of unused amounts and detailed rules for the advance
    on the specific aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1249/2000 de la Commission du 15 juin 2000 modifiant
    le règlement (CE) nº 2848/98 dans le secteur du tabac brut en ce qui concerne
    la date limite d'utilisation de l'aide spécifique, le remboursement de sommes
    non utilisées ainsi que les modalités de l'avance sur l'aide spécifique
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1249/2000 der Kommission vom 15. Juni 2000 zur Änderung
    der Verordnung (EG) Nr. 2848/98 hinsichtlich des Termins für die Verwendung der
    Sonderbeihilfe, der Zurückzahlung der nicht verwendeten Beträge und der Einzelheiten
    des Vorschusses auf die Sonderbeihilfe
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1249/2000 ze dne 15. června 2000, kterým
    se mění nařízení (ES) č. 2848/98 v odvětví surového tabáku, pokud jde
    o lhůtu pro využití zvláštní podpory, vrácení nevyužitých částek a
    prováděcí pravidla pro zálohu na zvláštní podporu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1249/2000 af 15. juni 2000 om ændring
    af forordning (EF) nr. 2848/98 for så vidt angår fristen for anvendelse af særstøtten,
    tilbagebetaling af ikke anvendte beløb og reglerne for forskud på særstøtten
    i tobakssektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1249/2000 της Επιτροπής,
    της 15ης Ιουνίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2848/98 στον τομέα του ακατέργαστου καπνού,
    όσον αφορά την προθεσμία χρησιμοποίησης της
    ειδικής ενίσχυσης, την επιστροφή των μη δαπανηθέντων
    ποσών, καθώς και τους τρόπους πληρωμής της
    προκαταβολής της ειδικής ενίσχυσης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1249/2000, 15. juuni 2000, millega muudetakse
    toortubakasektoris määrust (EÜ) nr 2848/98 eriabi kasutamise lõppkuupäeva,
    kasutamata summade tagasimaksmise ja eriabi ettemaksmise üksikasjalike eeskirjade
    osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1249/2000, annettu 15 päivänä kesäkuuta 2000,
    asetuksen (EY) N:o 2848/98 muuttamisesta raakatupakka-alalla erityistuen käytön
    määräpäivän, käyttämättömien määrien palauttamisen sekä erityistuen
    ennakkoa koskevien yksityiskohtaisten sääntöjen osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1249/2000/EK rendelete (2000. június 15.) a nyersdohányágazatban
    a 2848/98/EK rendeletnek a külön támogatás felhasználására vonatkozó határidő,
    a felhasználatlan összegek visszafizetése, valamint a külön támogatásból
    nyújtott előlegre vonatkozó részletes szabályok tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1249/2000 della Commissione, del 15 giugno 2000, che
    modifica il regolamento (CE) n. 2848/98 nel settore del tabacco greggio per quanto
    riguarda la data limite di utilizzazione dell'aiuto specifico, il rimborso delle
    somme non utilizzate e le modalità dell'anticipo sull'aiuto specifico
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1249/2000 (2000. gada 15. jūnijs), ar ko groza
    Regulu (EK) Nr. 2848/98 tabakas nozarē attiecībā uz īpašā atbalsta izmantošanas
    termiņu, neizmantoto summu atmaksu un sīki izstrādātiem īpašā atbalsta
    avansa noteikumiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. birželio 15 d. Komisijos reglamentas (EB) Nr. 1249/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 2848/98 dėl galutinės konkrečios pagalbos
    naudojimo datos, nepanaudotų sumų grąžinimo ir konkrečios pagalbos išankstinio
    mokėjimo išsamių taisyklių žaliavinio tabako sektoriuje
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1249/2000 tal-15 ta’ Ġunju 2000
    li jemenda r-Regolament Nru 2848/98 fis-settur tat-tabakk mhux maħdum fir-rigward
    tad-data finali biex tiġi użata l-għajnuna speċifika, il-ħlas lura ta’
    ammonti mhux użati u r-regoli dettaljati għall-ħlas bil-quddiem fuq l-għajnuna
    speċifika
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1249/2000 van de Commissie van 15 juni 2000 tot wijziging
    van Verordening (EG) nr. 2848/98 voor de sector ruwe tabak ten aanzien van de
    uiterste datum voor het gebruik van de specifieke steun, de terugbetaling van
    ongebruikte bedragen en de bepalingen inzake het voorschot op de specifieke steun
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1249/2000 z dnia 15 czerwca 2000 r. zmieniające
    rozporządzenie (WE) nr 2848/98 w sektorze surowca tytoniowego w zakresie ostatecznego
    terminu wykorzystania specjalnej pomocy, zwrotu niewykorzystanych kwot pomocy
    oraz szczegółowych zasad stosowanych do zaliczek specjalnej pomocy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1249/2000 da Comissão, de 15 de Junho de 2000, que
    altera o Regulamento (CE) n.o 2848/98 relativo ao sector do tabaco em rama, no
    que diz respeito à data-limite de utilização da ajuda específica, ao reembolso
    de montantes não utilizados e às modalidades de adiantamento sobre a ajuda específica
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1249/2000 z 15. júna 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2848/98 o sektore nespracovaného tabaku, týkajúce
    sa o konečného termínu na využitie špecifickej pomoci, vrátenia nevyužitých
    súm a podrobných pravidiel poskytovania preddavkov špecifickej pomoci
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1249/2000 z dne 15. junija 2000 o spremembi Uredbe
    (ES) št. 2848/98 iz sektorja surovega tobaka glede končnega datuma za uporabo
    posebne pomoči, vračila neporabljenih zneskov in podrobnih pravilih za predplačilo
    za posebno pomoč
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1249/2000 de la Comisión, de 15 de junio de 2000,
    que modifica el Reglamento (CE) nº 2848/98 referente al sector del tabaco crudo,
    en lo que respecta a la fecha límite de utilización de la ayuda específica,
    el reembolso de las cantidades no utilizadas y las modalidades del anticipo de
    la ayuda específica
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1249/2000 av den 15 juni 2000 om ändring
    av förordning (EG) nr 2848/98 inom tobakssektorn när det gäller sista dag för
    användning av det särskilda stödet, återbetalning av ej använda belopp samt
    föreskrifter om förskott på det särskilda stödet
  type: main
