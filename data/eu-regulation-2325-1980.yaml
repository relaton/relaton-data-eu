title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2325/80 of 4 September 1980 laying down
    detailed rules for the application of the additional measures applicable to holders
    of long-term storage contracts for table wine for the 1979/80 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2325/80 de la Commission, du 4 septembre 1980, établissant
    les modalités d' application des mesures complémentaires réservées aux détenteurs
    de contrats de stockage à long terme des vins de table pour la campagne 1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2325/80 der Kommission vom 4. September 1980 zur Festlegung
    der Durchführungsbestimmungen für die Inhabern langfristiger Lagerverträge
    für Tafelweine vorbehaltenen ergänzenden Maßnahmen für das Wirtschaftsjahr
    1979/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2325/80 af 4. september 1980 fastsættelse
    af gennemførelsesbestemmelser for de supplerende foranstaltninger, der er forbeholdt
    indehaverne af langfristede oplagringskontrakter for bordvin for produktionsåret
    1979/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 2325/80 της Επιτροπής,
    της 4ης Σεπτεμβρίου 1980, περί καθορισμού των
    μεθόδων εφαρμογής των συμπληρωματικών μέτρων
    που ισχύουν για τους κατόχους συμβάσεων μακροπρόθεσμης
    αποθήκευσης επιτραπέζιων οίνων για την περίοδο
    εμπορίας 1979/1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2325/80 della Commissione, del 4 settembre 1980, che
    stabilisce le modalità di applicazione delle misure complementari riservate ai
    titolari di contratti di magazzinaggio a lungo termine dei vini da tavola per
    la campagna 1979/1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2325/80 van de Commissie van 4 september 1980 tot
    vaststelling van de bepalingen ter uitvoering van de aanvullende maatregelen ten
    behoeve van degenen die voor het wijnoogstjaar 1979/1980 langlopende opslagcontracten
    voor tafelwijn hebben gesloten
  type: main
