    Sojabohnen der Sorte DAS-81419-2 × DAS–44406–6 enthalten, aus ihnen bestehen
    oder aus ihnen gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des
    Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021)
    5994) (Nur der niederländische Text ist verbindlich)
  type: main
