title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/1387 of 17 August 2021 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean DAS-81419-2 × DAS–44406–6, pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2021)5994) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/1387 de la Commission du 17 août 2021
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié DAS-81419-2 × DAS-44406-6, consistant en ce soja ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2021) 5994] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/1387 der Kommission vom 17. August 2021
