    eläinlääkärintarkastusten ja -valvonnan rahoittamisesta annetun direktiivin
    85/73/ETY liitteen muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 95/24/CE del Consiglio, del 22 giugno 1995, che modifica l'allegato
    della direttiva 85/72/CEE relativa al finanziamento delle ispezioni e dei controlli
    veterinari dei prodotti di origine animale contemplati nell'allegato A della direttiva
    89/662/CEE e nella direttiva 90/675/CEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/24/EG van de Raad van 22 juni 1995 houdende wijziging van
    de bijlage van Richtlijn 85/73/EEG inzake de financiering van de keuringen en
    veterinaire controles van dierlijke produkten zoals bedoeld in bijlage A van Richtlijn
    89/662/EEG en in Richtlijn 90/675/EEG
  type: main
- language: pt
  script: Latn
  content: Directiva 95/24/CE do Conselho, de 22 de Junho de 1995, que altera o anexo
    da Directiva 85/73/CEE relativa ao financiamento das inspecções e controlos
    veterinários dos produtos de origem animal a que se referem o anexo A da Directiva
    89/662/CEE e a Directiva 90/675/CEE
  type: main
- language: es
  script: Latn
  content: Directiva 95/24/CE del Consejo, de 22 de junio de 1995, por la que se modifica
