title:
- language: en
  script: Latn
  content: Council Directive 95/24/EC of 22 June 1995 amending the Annex to Directive
    85/73/EEC on the financing of veterinary inspections and controls of animal products
    covered by Annex A to Directive 89/662/EEC and by Directive 90/675/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 95/24/CE du Conseil, du 22 juin 1995, modifiant l'annexe de la
    directive 85/73/CEE relative au financement des inspections et contrôles vétérinaires
    des produits animaux visés à l'annexe A de la directive 89/662/CEE et à la
    directive 90/675/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/24/EG des Rates vom 22. Juni 1995 zur Änderung des Anhangs
    der Richtlinie 85/73/EWG über die Finanzierung der veterinär- und hygienerechtlichen
    Kontrollen von tierischen Erzeugnissen im Sinne des Anhangs A der Richtlinie 89/662/EWG
    und im Sinne der Richtlinie 90/675/EWG
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 95/24/EF af 22. juni 1995 om ændring af bilaget til direktiv
    85/73/EØF om finansiering af veterinærundersøgelse og -kontrol af produkter
    af animalsk oprindelse, der er omhandlet i bilag A til direktiv 89/662/EØF og
    i direktiv 90/675/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/24/ΕΚ του Συμβουλίου της 22ας Ιουνίου
    1995 για την τροποποίηση του παραρτήματος της
    οδηγίας 85/73/ΕΟΚ για τη χρηματοδότηση των υγειονομικών
    επιθεωρήσεων και ελέγχων των ζωικών προϊόντων
    που αναφέρονται στο παράρτημα Α της οδηγίας
    89/662/ΕΟΚ και στην οδηγία 90/675/ΕΟΚ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 95/24/EY, annettu 22 päivänä kesäkuuta 1995, direktiivin
