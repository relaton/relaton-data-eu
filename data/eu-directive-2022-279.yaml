title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2022/279 of 13 December 2021 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for the use of mercury in other discharge lamps for special purposes
  type: main
- language: fr
  script: Latn
  content: Directive déléguée (UE) 2022/279 de la Commission du 13 décembre 2021
    modifiant, aux fins de son adaptation au progrès scientifique et technique, l’annexe
    III de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui
    concerne une exemption relative à l’utilisation du mercure dans d’autres
    lampes à décharge à usage spécial
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2022/279 der Kommission vom 13. Dezember 2021
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
    — des Anhangs III der Richtlinie 2011/65/EU des Europäischen Parlaments und
    des Rates hinsichtlich einer Ausnahme für die Verwendung von Quecksilber in anderen
    Entladungslampen für besondere Verwendungszwecke
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2022/279 на Комисията
