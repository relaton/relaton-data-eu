    erityiskäyttöön tarkoitetuissa purkauslampuissa koskevan poikkeuksen osalta
  type: main
- language: ga
  script: Latn
  content: Treoir Tarmligthe (AE) 2022/279 ón gCoimisiún an 13 Nollaig 2021 lena
