    Europskog parlamenta i Vijeća u pogledu izuzeća za uporabu žive u drugim žaruljama
    s izbijanjem za posebne primjene
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/279 felhatalmazáson alapuló irányelve (2021.
    december 13.) a 2011/65/EU európai parlamenti és tanácsi irányelv III. mellékletének
    a higanynak a különleges rendeltetésű egyéb kisülőlámpákban való felhasználására
    vonatkozó mentesség tekintetében, a tudományos és műszaki fejlődéshez
    történő hozzáigazítás céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata (UE) 2022/279 della Commissione del 13 dicembre 2021
    che modifica, adeguandolo al progresso scientifico e tecnico, l’allegato III
    della direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l’esenzione relativa all’uso del mercurio in altre lampade a scarica per usi
    speciali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva (ES) 2022/279 (2021. gada 13. decembris),
    ar ko attiecībā uz atbrīvojumu, kurš atļauj dzīvsudrabu izmantot citās
    gāzizlādes spuldzēs īpašām vajadzībām, groza Eiropas Parlamenta un Padomes
    Direktīvas 2011/65/ES III pielikumu, to pielāgojot zinātnes un tehnikas attīstībai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotoji direktyva (ES) 2022/279 2021 m. gruodžio 13 d. kuria,
    derinant prie mokslo ir technikos pažangos, dėl išimties naudoti gyvsidabrį
    kitose specialiosios paskirties išlydžio lempose iš dalies keičiamas Europos
    Parlamento ir Tarybos direktyvos 2011/65/ES III priedas
  type: main
- language: mt
  script: Latn
  content: Direttiva Delegata tal-Kummissjoni (UE) 2022/279 tat-13 ta’ Diċembru
    2021 li temenda, għall-finijiet ta’ adattament għall-progress xjentifiku u
    tekniku, l-Anness III tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ eżenzjoni għall-użu tal-merkurju f’lampi oħra bi skarika
    elettrika għal finijiet speċjali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn (EU) 2022/279 van de Commissie van 13 december 2021
    tot wijziging, met het oog op aanpassing aan de wetenschappelijke en technische
    vooruitgang, van bijlage III bij Richtlijn 2011/65/EU van het Europees Parlement
    en de Raad betreffende een vrijstelling voor het gebruik van kwik in andere gasontladingslampen
    voor speciale doeleinden
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji (UE) 2022/279 z dnia 13 grudnia 2021 r. zmieniająca,
    w celu dostosowania do postępu naukowo-technicznego, załącznik III do dyrektywy
    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    stosowania rtęci w innych lampach wyładowczych do celów specjalnych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2022/279 da Comissão de 13 de dezembro de 2021
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção relativa à utilização de mercúrio em outras lâmpadas de descarga
    para fins especiais
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2022/279 a Comisiei din 13 decembrie 2021 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea mercurului în alte lămpi cu descărcare pentru uz
    special
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2022/279 z 13. decembra 2021, ktorou
    sa na účely prispôsobenia technickému a vedeckému pokroku mení príloha
    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    na používanie ortuti v iných výbojkách na osobitné účely
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2022/279 z dne 13. decembra 2021 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za uporabo živega srebra v drugih sijalkah na razelektrenje za posebne namene
    zaradi prilagoditve znanstvenemu in tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada (UE) 2022/279 de la Comisión de 13 de diciembre de
    2021 por la que se modifica, para adaptarlo al progreso científico y técnico,
    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo por
    lo que respecta a una exención relativa al uso de mercurio en otras lámparas
    de descarga para usos especiales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2022/279 av den 13 december 2021
    om ändring, för anpassning till den vetenskapliga och tekniska utvecklingen,
    av bilaga III till Europaparlamentets och rådets direktiv 2011/65/EU vad gäller
    undantag för användning av kvicksilver i andra urladdningslampor för särskilda
    ändamål
