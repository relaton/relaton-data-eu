title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1001/2004 of 18 May 2004 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of ammonium
    nitrate originating in the Russian Federation and Ukraine and making imports of
    ammonium nitrate originating in the Russian Federation or Ukraine subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1001/2004 de la Commission du 18 mai 2004 portant acceptation
    d’engagements offerts dans le cadre de la procédure antidumping concernant
    les importations de nitrate d'ammonium originaire de la Fédération de Russie
    et d'Ukraine et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1001/2004 der Kommission vom 18. Mai 2004 zur Annahme
    von Verpflichtungsangeboten im Zusammenhang mit dem Antidumpingverfahren betreffend
    die Einfuhren von Ammoniumnitrat mit Ursprung in der Russischen Föderation und
    der Ukraine sowie zur zollamtlichen Erfassung der genannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1001/2004 ze dne 18. května 2004 o přijetí
    závazků nabídnutých v souvislosti s antidumpingovým řízením týkajícím
    se dovozů dusičnanu amonného pocházejících z Ruské federace a Ukrajiny
    a o vedení celních záznamů o dovozech dusičnanu amonného z Ruské federace
    a Ukrajiny
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1001/2004 af 18. maj 2004 om godtagelse
    af tilsagn, der er afgivet i forbindelse med antidumpingproceduren vedrørende
    importen af ammoniumnitrat med oprindelse i Den Russiske Føderation og Ukraine,
    og om at gøre importen af ammoniumnitrat med oprindelse i Den Russiske Føderation
    og Ukraine til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1001/2004 της Επιτροπής,
    της 18ης Μαΐου 2004, για την αποδοχή των αναλήψεων
    υποχρεώσεων που προτάθηκαν στο πλαίσιο της
    διαδικασίας αντιντάμπινγκ όσον αφορά τις εισαγωγές
    νιτρικού αμμωνίου καταγωγής Ρωσικής Ομοσπονδίας
    και Ουκρανίας και για την υπαγωγή των εισαγωγών
    νιτρικού αμμωνίου καταγωγής Ρωσικής Ομοσπονδίας
    ή Ουκρανίας σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1001/2004, 18. mai 2004, millega kiidetakse
    heaks seoses Venemaa Föderatsioonist ja Ukrainast pärit ammooniumnitraadi importi
    käsitleva dumpinguvastase menetlusega pakutud kohustused ning kehtestatakse Venemaa
    Föderatsioonist ja Ukrainast pärit ammooniumnitraadi impordi suhtes registreerimisnõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1001/2004, annettu 18 päivänä toukokuuta 2004,
    Venäjän federaatiosta ja Ukrainasta peräisin olevan ammoniumnitraatin tuontia
    koskevan polkumyynnin vastaisen menettelyn yhteydessä tarjottujen sitoumusten
    hyväksymisestä sekä Venäjän federaatiosta tai Ukrainasta peräisin olevan
    ammoniumnitraatin tuonnin kirjaamisvelvoitteesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1001/2004/EK rendelete (2004. május 18.) az Orosz Föderációból
    és Ukrajnából származó ammónium-nitrát behozatalát érintő dömpingellenes
    eljárással kapcsolatban vállalt kötelezettségek elfogadásáról valamint
    az Orosz Föderációból és Ukrajnából származó, bejelentés-köteles ammónium-nitrát
    behozataláról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1001/2004 della Commissione, del 18 maggio 2004, che
    accetta gli impegni offerti in relazione al procedimento antidumping relativo
    alle importazioni di nitrato di ammonio originario della Federazione Russa e dell’Ucraina
    e che sottopone a registrazione le importazioni di nitrato di ammonio originario
    della Federazione Russa o dell’Ucraina
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1001/2004 (2004. gada 18. maijs), ar ko pieņem
    saistības, kas piedāvātas attiecībā uz Krievijas Federācijas un Ukrainas
    izcelsmes amonija nitrāta importa antidempinga procedūru, un ar ko paredz Krievijas
    Federācijas un Ukrainas izcelsmes amonija nitrāta importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 18 d. Komisijos reglamentas (EB) Nr. 1001/2004 priimantis
    įsipareigojimus, pasiūlytus pagal antidempingo procedūrą dėl amonio nitrato,
    kurio kilmės šalis yra Rusijos Federacija ir Ukraina, importo, ir įpareigojantis
    registruoti importuojamą amonio nitratą, kurio kilmės šalis yra Rusijos Federacija
    arba Ukraina
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1001/2004 tat- 18 ta' Mejju 2004 li
    jaċċetta garanziji offerti in konnessjoni mal-proċedura anti-dumping li tikkonċerna
    l-importazzjoni tan-nitrat ta’ l-ammonju li joriġina mill-Federazzjoni Russa
    u mill-Ukraina u li tagħmel l-importazzjoni tan-nitrat ta’ l-ammonju li joriġinaw
    mill-Federazzjoni Russa jew l-Ukraina suġġetta għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1001/2004 van de Commissie van 18 mei 2004 tot aanvaarding
    van de verbintenissen die zijn aangeboden in het kader van de antidumpingprocedure
    betreffende ammoniumnitraat uit Rusland en Oekraïne en tot registratie van de
    invoer van ammoniumnitraat uit Rusland en Oekraïne
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1001/2004 z dnia 18 maja 2004 r. przyjmujące
    zobowiązania oferowane w związku z postępowaniem antydumpingowym w odniesieniu
    do przywozu azotanu amonu pochodzącego z Rosji i Ukrainy oraz obejmujące obowiązkiem
    rejestracji przywóz azotanu amonu pochodzącego z Rosji i Ukrainy
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1001/2004 da Comissão, de 18 de Maio de 2004, que
    aceita os compromissos oferecidos no âmbito do processo anti-dumping relativo
    às importações de nitrato de amónio originário da Federação Russa e da
    Ucrânia e que torna obrigatório o registo destas importações
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1001/2004 zo dňa 18. mája 2004 o prijatí
    záväzkov ponúknutých v súvislosti s antidumpingovým konaním týkajúcim
    sa dovozov dusičnanu amónneho pôvodom z Ruskej federácie a Ukrajiny a o zavedení
    registrácie dovozov dusičnanu amónneho pôvodom z Ruskej federácie alebo Ukrajiny
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1001/2004 z dne 18. maja 2004 o sprejetju zavez,
    ponujenih v zvezi s protidampinškim postopkom glede uvoza amonijevega nitrata
    s poreklom iz Ruske federacije in Ukrajine ter o registraciji uvoza amonijevega
    nitrata, s poreklom iz Ruske federacije ali Ukrajine
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1001/2004 de la Comisión, de 18 de mayo de 2004, por
    el que se aceptan los compromisos ofrecidos en relación con el procedimiento
    antidumping correspondiente a las importaciones de nitrato de amonio originarias
    de la Federación de Rusia y Ucrania y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1001/2004 av den 18 maj 2004 om godtagande
    av åtaganden som gjorts i samband med antidumpningsförfarandet rörande import
    av ammoniumnitrat med ursprung i Ryska federationen och Ukraina och om registrering
    av sådan import
  type: main
