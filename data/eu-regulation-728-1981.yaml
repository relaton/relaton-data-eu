title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 728/81 of 20 March 1981 re-establishing
    the levying of customs duties on carpets, products of category 142 (code 1420),
    originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 728/81 de la Commission, du 20 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux tapis de
    poils grossiers, de la catégorie de produits n° 142 (code 1420), originaires
    de pays et territoires en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 728/81 der Kommission vom 20. März 1981 zur Wiedereinführung
    des Zollsatzes für Teppiche aus groben Tierhaaren der Warenkategorie Nr. 142
    (Kennziffer 1420) mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 728/81 af 20. marts 1981 om genindførelse
    af opkrævning af toldafgifter for gulvtæpper af grove dyrehår, under varekategori
    nr. 142 (kode 1420), som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 728/81 τής Επιτροπής
    τής 20ής Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά τάπητες εκ
    τριχών χονδροειδών τών προϊόντων τής κατηγορίας
    142 (κώδικας 1420) καταγωγής υπό ανάπτυξη χωρών
    καί εδαφών, δικαιούχων τών προβλεπομένων στόν
    κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 728/81 della Commissione, del 20 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di peli grossolani, della
    categoria di prodotti n. 142 (codice n. 1420), originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 728/81 van de Commissie van 20 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten
    van grof haar, van de categorie van produkten nr. 142 (codenummer 1420), van oorsprong
    uit de ontwikkelingslanden en -gebieden, ten behoeve waarvan bij Verordening (EEG)
    nr. 3320/80 van de Raad tariefpreferenties werden geopend
  type: main
