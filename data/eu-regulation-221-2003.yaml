    originaires de la République islamique du Pakistan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 221/2003 der Kommission vom 4. Februar 2003 zur Genehmigung
    von Übertragungen zwischen den Höchstmengen für Textilwaren und Bekleidung
    mit Ursprung in der Islamischen Republik Pakistan
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 221/2003 af 4. februar 2003 om tilladelse
