    μεταξύ των ποσοτικών ορίων κλωστοϋφαντουργικών
    προϊόντων και ειδών ένδυσης καταγωγής Ισλαμικής
    Δημοκρατίας του Πακιστάν
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 221/2003, annettu 4 päivänä helmikuuta 2003,
    luvan antamisesta Pakistanin islamilaisesta tasavallasta peräisin olevien tekstiili-
    ja vaatetustuotteiden määrällisten rajoitusten siirroille
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 221/2003 della Commissione, del 4 febbraio 2003, che
    autorizza trasferimenti tra i limiti quantitativi per i prodotti tessili e dell'abbigliamento
    originari della Repubblica islamica del Pakistan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 221/2003 van de Commissie van 4 februari 2003 waarbĳ
    machtiging wordt verleend tot de overdracht van bepaalde hoeveelheden tussen de
    kwantitatieve maxima voor textiel- en kledingproducten van oorsprong uit de Islamitische
    Republiek Pakistan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 221/2003 da Comissão, de 4 de Fevereiro de 2003,
