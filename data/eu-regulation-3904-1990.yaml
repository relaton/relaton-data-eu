title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3904/90 of 19 December 1990 suspending for
    the 1991 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fisheries ventures set up between natural or
    legal persons from Portugal and Morocco, on the direct landing of such products
    in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3904/90 de la Commission du 19 décembre 1990 portant,
    pour la campagne 1991, suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l'occasion de leur débarquement direct au Portugal
  type: main
- language: de
  script: Latn
