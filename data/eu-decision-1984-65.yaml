title:
- language: en
  script: Latn
  content: '84/65/EEC: Commission Decision of 1 February 1984 establishing that the
    apparatus described as ''IL - Atomic Absorption Spectrophotometer, model IL 951
    with Atomizer, model IL 655 CTF'' may not be imported free of Common Customs Tariff
    duties'
  type: main
- language: fr
  script: Latn
  content: '84/65/CEE: Décision de la Commission du 1er février 1984 constatant
    que l''importation de l''appareil dénommé "I.L. - Atomic Absorption Spectrophotometer,
    model IL 951 with Atomizer, model IL 655 CTF" ne peut être faite en franchise
    des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '84/65/EWG: Entscheidung der Kommission vom 1. Februar 1984, mit der festgestellt
    wird, daß das Gerät ,,I.L.- Atomic Absorption Spectrophotometer, model IL 951
    with Atomizer, model IL 655 CTF" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '84/65/EØF: Kommissionens beslutning af 1. februar 1984 om fastslåelse
    af, at indførsel af apparatet "I.L. - Atomic Absorption Spectrophotometer, model
    IL 951 with Atomizer, model IL 655 CTF" ikke kan ske med fritagelse for told efter
    den fælles toldtarif'
  type: main
