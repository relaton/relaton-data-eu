title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 777/90 of 29 March 1990 derogating for the
    1989/90 wine year from the producers'requirement to notify the quantities of table
    wine they must deliver for compulsory distillation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 777/90 de la Commission du 29 mars 1990 portant mesure
    dérogatoire pour la campagne 1989/1990 en matière de communication par les producteurs
    de leurs quantités de vin de table à livrer à la distillation obligatoire
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 777/90 DER KOMMISSION vom 29. Maerz 1990 ueber eine
    abweichende Massnahme fuer das Wirtschaftsjahr 1989/90 fuer die Mitteilungen der
    Erzeuger ueber ihre zur obligatorischen Destillation zu liefernden Tafelweinmengen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 777/90 af 29. marts 1990 om en undtagelsesforanstaltning
    for produktionsåret 1989/90 med hensyn til producenternes meddelelse af bordvinsmængder,
    der skal leveres til obligatorisk destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 777/90 της Επιτροπής
    της 29ης Μαρτίου 1990 που προβλέπει μέτρο παρέκκλισης
    για την περίοδο 1989/90 όσον αφορά την ανακοίνωση
    από τους παραγωγούς των ποσοτήτων επιτραπέζιου
    οίνου που θα παραδοθούν στην υποχρεωτική απόσταξη
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 777/90 DELLA COMMISSIONE del 29 marzo 1990 recante
    una misura derogatoria per la campagna 1989/1990, per quanto riguarda la comunicazione,
    da parte dei produttori, dei quantitativi di vini da tavola che devono consegnare
    alla distillazione obbligatoria
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 777/90 VAN DE COMMISSIE van 29 maart 1990 houdende
    afwijkende bepalingen voor het wijnoogstjaar 1989/1990 met betrekking tot de mededeling,
    door de producenten, van de voor verplichte distillatie te leveren hoeveelheden
    tafelwijn
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 777/90 DA COMISSAO de 29 de Março de 1990 que estabelece
    uma medida derrogatoria para a campanha de 1989/1990 no que diz respeito à comunicaçao
    pelos produtores das suas quantidades de vinho de mesa a entregar para destilaçao
    obrigatoria
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 777/90 DE LA COMISION de 29 de marzo de 1990 por el
    que se establece una medida de excepcion, con respecto a la campana de 1989/90,
    en cuanto a la comunicacion que deben efectuar los productores sobre las cantidades
    de vino de mesa que tienen que destinar a destilacion obligatoria
  type: main
