    e (CEE) n. 507/82, per quanto riguarda il termine di trasmissione della relazione
    sull' impiego dei fondi comunitari che deve essere trasmessa all' organismo d'
    intervento nel quadro delle azioni destinate ad ampliare i mercati nel settore
    del latte e dei prodotti lattiero-caseari
  type: main
