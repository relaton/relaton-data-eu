title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2467/82 of 10 September 1982 amending Regulations
    (EEC) No 271/82, (EEC) No 272/82, (EEC) No 273/82 and (EEC) No 507/82 in respect
    of the period for submission of the report on the utilization of Community funds
    to the intervention agency in connection with measures to expand the market in
    milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2467/82 de la Commission, du 10 septembre 1982, portant
    modification des règlements (CEE) n° 271/82, (CEE) n° 272/82, (CEE) n° 273/82
    et (CEE) n° 507/82 en ce qui concerne le délai pour la transmission du rapport
    sur l' utilisation des fonds communautaires à l' organisme d' intervention dans
    le cadre des actions destinées à élargir les marchés dans le secteur du lait
    et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2467/82 der Kommission vom 10. September 1982 zur
    Änderung der Verordnungen (EWG) Nr. 271/82, (EWG) Nr. 272/82, (EWG) Nr. 273/82
    und (EWG) Nr. 507/82 hinsichtlich der Frist für die Übermittlung des Berichts
    über die Verwendung der Gemeinschaftsmittel im Rahmen der Maßnahmen zur Erweiterung
    der Märkte im Sektor Milch und Milcherzeugnisse an die Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2467/82 af 10. september 1982 om ændring
    af forordning (EØF) nr. 271/82, (EØF) nr. 272/82, (EØF) nr. 273/82 og (EØF)
    nr. 507/82 for så vidt angår fristen for indgivelse til interventionsorganet
    af rapporten vedrørende anvendelsen af fællesskabsmidlerne i forbindelse med
    foranstaltningerne til udvidelse af markederne for mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2467/82 τής Επιτροπής
    τής 10ης Σεπτεμβρίου 1982 περί τροποποιήσεως
