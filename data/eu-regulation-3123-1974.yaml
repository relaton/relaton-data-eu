title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3123/74 of the Commission of 11 December 1974 re-establishing
    the levying of customs duties on woodscrews falling within subheading ex 73.32
    B II, originating in developing countries to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3123/74 de la Commission, du 11 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux vis à bois
    de la sous-position tarifaire EX 73.32 B II, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3123/74 der Kommission vom 11. Dezember 1974 zur Wiedereinführung
    des Zollsatzes für Holzschrauben, der Tarifstelle ex 73.32 B II, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3123/74 af 11. december 1974 om genindførelse
    af opkrævning af toldafgifter for træskruer under underposition ex 73.32 B II,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3123/74 della Commissione, dell'11 dicembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili alle viti per legno,
    della sottovoce doganale n. ex 73.32 B II, originarie dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3123/74 van de Commissie van 11 december 1974 houdende
    wederinstelling van de heffing van de douanerechten voor houtschroeven, van onderverdeling
    ex 73.32 B II, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 tariefpreferenties
    werden geopend
