  content: Commission Regulation (EEC) No 1023/92 of 24 April 1992 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to trade in fruit and vegetables between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives, carrots,
    artichokes, melons and strawberries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1023/92 de la Commission du 24 avril 1992 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et la Communauté
    dans sa composition au 31 décembre 1985 en ce qui concerne les tomates, les laitues,
    les chicorées scaroles, les carottes, les artichauts, les melons et les fraises
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1023/92 DER KOMMISSION vom 24. April 1992 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Salat, Endivie Eskariol, Karotten, Artischocken, Melonen und Erdbeeren
    zwischen Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember
    1985 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1023/92 af 24. april 1992 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    (SMS) mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985
    inden for frugt- og grønsagssektoren, for så vidt angår tomater, salat, bredbladet
    endivie, gulerødder, artiskokker, meloner og jordbær #'
  type: main
