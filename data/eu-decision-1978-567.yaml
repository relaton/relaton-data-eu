id: EUDecision1978567
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 22 June 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's and boys' leather footwear, including boots, falling
    within heading No ex 64.02 of the Common Customs Tariff, originating in Romania
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/567/CEE: Décision de la Commission, du 22 juin 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chaussures en cuir pour hommes, y compris
    brodequins, de la position Ex 64.02 du Tarif douanier commun, originaires de Roumanie
    et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Juni 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Schuhe aus Leder für Männer, einschließlich große Schnürstiefel,
    der Tarifnummer ex 64.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 22. juni 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage herrefodtøj af læder, herunder støvler, som henhører under pos.
    ex 64.02 i den fælles toldtarif, har oprindelse i Rumænien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 giugno 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le calzature in cuoio per uomo e scarponi comuni della
    voce ex 64.02 della tariffa doganale comune, originari della Romania e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 juni 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    schoeisel van leder voor heren (daaronder werkschoenen) van post ex 64.02 van
    het gemeenschappelijk douanetarief, van oorsprong uit Roemenië en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
