title:
- language: en
  script: Latn
  content: '86/567/EEC: Commission Decision of 18 November 1986 extending the date
    of application of Commission Decision 81/10/EEC determining the regions from which
    Greece may not consign to other Member States any bovine animal or swine, or any
    fresh meat from bovine animals, swine, sheep or goats'
  type: main
- language: fr
  script: Latn
  content: '86/567/CEE: Décision de la Commission du 18 novembre 1986 prorogeant
    la date d'' application de la décision de la Commission 81/10/CEE établissant
    les régions à partir desquelles la Grèce n'' expédie vers les autres États
    membres aucun animal des espèces bovine et porcine, ni de viandes fraîches des
    espèces bovine, porcine, ovine et caprine'
  type: main
- language: de
  script: Latn
  content: '86/567/EWG: Entscheidung der Kommission vom 18. November 1986 zur Verlängerung
    der Geltungsdauer der Entscheidung 81/10/EWG der Kommission zur Festlegung der
    Gebiete, aus denen Griechenland weder Tiere der Gattungen Rind und Schwein noch
    frisches Fleisch von Rindern, Schweinen, Schafen und Ziegen in die übrigen Mitgliedstaaten
    versenden darf'
  type: main
- language: da
  script: Latn
  content: '86/567/EØF: Kommissionens beslutning af 18. november 1986 om forlængelse
    af anvendelsen af Kommissionens beslutning 81/10/EØF om fastsættelse af de områder,
    hvorfra Grækenland undlader at sende kvæg og svin samt fersk okse-, svine-,
    fåre- eller gedekød til de øvrige medlemsstater'
  type: main
- language: el
  script: Grek
  content: '86/567/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Νοεμβρίου 1986 για την παράταση της ημερομηνίας
    εφαρμογής της απόφασης 81/10/ΕΟΚ περί καθορισμού
    των περιφερειών από τις οποίες η Ελληνική Δημοκρατία
    δεν αποστέλλει προς τα υπόλοιπα κράτη μέλη
    κανένα βοοειδές και χοιροειδές, ούτε νωπά κρέατα
    των βοοειδών, χοιροειδών, προβατοειδών και
    αιγοειδών'
  type: main
- language: it
  script: Latn
  content: '86/567/CEE: Decisione della Commissione del 18 novembre 1986 che proroga
    l'' applicazione della decisione 81/10/CEE della Commissione che stabilisce le
    regioni da cui la Grecia non spedisce, verso gli altri Stati membri, alcun animale
    delle specie bovina e suina, né carni fresche delle specie bovina, suina, ovina
    e caprina'
  type: main
- language: nl
  script: Latn
  content: '86/567/EEG: Beschikking van de Commissie van 18 november 1986 houdende
    verlenging van de termijn voor de toepassing van Beschikking 81/10/EEG van de
    Commissie tot vaststelling van de gebieden waaruit Griekenland geen runderen en
    varkens en geen vers vlees van runderen, varkens, geiten en schapen naar de andere
    Lid-Staten zendt'
  type: main
- language: pt
  script: Latn
  content: '86/567/CEE: Decisão da Comissão de 18 de Novembro de 1986 que prorroga
    o período de aplicação da Decisão da Comissão 81/10/CEE que estabelece as
    regiões a partir das quais a Grécia não pode expedir para os outros Estados-membros
    qualquer animal das espécies bovina e suína, nem carnes frescas de animais das
    espécies bovina, suína, ovina e caprina'
  type: main
- language: es
  script: Latn
  content: '86/567/CEE: Decisión de la Comisión de 18 de noviembre de 1986 por la
    que se amplía el período de aplicación de la Decisión 81/10/CEE de la Comisión,
    por la que se determinan las regiones de Grecia desde las que dicho país no puede
    enviar a otros Estados miembros ningún animal de las especies bovina o porcina,
    ni carne fresca de vacuno, porcino, ovino o caprino'
