    d'aliments composés à base de céréales entre l'Italie et les autres États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 269/67/EWG der Kommission vom 30. Juni 1967 über die Festsetzung
    der Abgabe und der Subvention, die vorübergehend auf den Handel mit Getreidemischfutter
    zwischen Italien und den übrigen Mitgliedstaaten anzuwenden sind
  type: main
- language: it
  script: Latn
  content: Regolamento n. 269/67/CEE della Commissione, del 30 giugno 1967, relativo
    alla determinazione della tassa e della sovvenzione applicabili, a titolo transitorio,
    agli scambi di alimenti composti a base di cereali tra l'Italia e gli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 269/67/EEG van de Commissie van 30 juni 1967 houdende vaststelling
    van de heffing en de subsidie die bij wijze van overgangsmaatregel gelden voor
    het handelsverkeer in mengvoeders op basis van granen tussen Italië en de overige
    Lid-Staten
