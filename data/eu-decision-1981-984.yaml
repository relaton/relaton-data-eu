  content: '81/984/EEC: Commission Decision of 23 November 1981 on a Belgian Government
    proposal to aid certain investments in a refinery at Antwerp (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/984/CEE: Décision de la Commission, du 23 novembre 1981, relative
    à une aide que le gouvernement belge projette d''accorder en faveur de certains
    investissements à réaliser dans une raffinerie à Anvers (Les textes en langues
    française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/984/EWG: Entscheidung der Kommission vom 23. November 1981 über ein
    Beihilfevorhaben der belgischen Regierung für bestimmte Investitionen in einer
    Raffinerie in Antwerpen (Nur der französische und niederländische Text sind
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/984/EØF: Kommissionens beslutning af 23. november 1981 om en støtte,
    som den belgiske regering påtænker at yde til visse investeringer, der skal
    foretages i et raffinaderi i Antwerpen (Kun de franske og nederlandske udgaver
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/984/EOK: Απόφαση της Επιτροπής της 23ης Νοεμβρίου
    1981 για την ενίσχυση την οποία σχεδιάζει να
    χορηγήσει η κυβέρνηση του Βελγίου σε ορισμένες
    επενδύσεις που πρόκειται να πραγματοποιηθούν
    σε διυλιστήριο της Αμβέρσας (Τα κείμενα στη
    γαλλική και ολλανδική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/984/CEE: Decisione della Commissione, del 23 novembre 1981, concernente
    un aiuto che il governo belga prospetta di concedere a favore di determinati investimenti
    previsti in una raffineria di Anversa (I testi in lingua francese e olandese sono
    i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/984/EEG: Beschikking van de Commissie van 23 november 1981 inzake een
