  script: Latn
  content: Commission Regulation (EC) No 1252/2006 of 18 August 2006 amending Regulation
    (EC) No 796/2006 as regards the list of Member States where buying-in of butter
    by tendering is open for the period expiring on 31 August 2006
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1252/2006 de la Commission du 18 août 2006 modifiant
    le règlement (CE) n o 796/2006 en ce qui concerne la liste des États membres
    dans lesquels les achats de beurre par adjudication sont ouverts pour la période
    expirant le 31 août 2006
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1252/2006 der Kommission vom 18. August 2006 zur Änderung
    der Verordnung (EG) Nr. 796/2006 hinsichtlich der Liste der Mitgliedstaaten, in
    denen der Ankauf von Butter im Rahmen einer Ausschreibung für den am 31. August
    2006 ablaufenden Zeitraum eröffnet wurde
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1252/2006 ze dne 18. srpna 2006 , kterým se
