    w których skup masła w trybie przetargu jest otwarty na okres do dnia 31 sierpnia
    2006 r.
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1252/2006 da Comissão, de 18 de Agosto de 2006 ,
