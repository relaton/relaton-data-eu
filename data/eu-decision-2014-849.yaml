    на Федерална република Германия да използва
    статистически данни за години преди предпоследната
    година и да не отчита някои категории сделки
    или да използва някои приблизителни разчети
    при изчисляването на базата за собствените
    ресурси от ДДС (нотифицирано под номер С(2014)
    8931)'
