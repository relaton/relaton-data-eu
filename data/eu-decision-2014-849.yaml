title:
- language: en
  script: Latn
  content: '2014/849/EU, Euratom: Commission Implementing Decision of 26 November
    2014 amending Decision 90/179/Euratom, EEC authorizing the Federal Republic of
    Germany to use statistics for years earlier than the last year but one and not
    to take into account certain categories of transactions or to use certain approximate
    estimates for the calculation of the VAT own resources base (notified under document
    C(2014) 8931)'
  type: main
- language: fr
  script: Latn
  content: '2014/849/UE: Décision d''exécution de la Commission du 26 novembre 2014
    modifiant la décision 90/179/Euratom, CEE autorisant la République fédérale
    d''Allemagne à utiliser des données statistiques antérieures à la pénultième
    année et à ne pas tenir compte de certaines catégories d''opérations ou à
    utiliser certaines estimations approximatives pour le calcul de la base des ressources
    propres provenant de la taxe sur la valeur ajoutée [notifiée sous le numéro
    C(2014) 8931]'
  type: main
- language: de
  script: Latn
  content: '2014/849/EU, Euratom: Durchführungsbeschluss der Kommission vom 26. November
    2014 zur Änderung der Entscheidung 90/179/Euratom, EWG mit der die Bundesrepublik
    Deutschland ermächtigt wird, statistische Angaben vor dem vorletzten Jahr zu
    verwenden und bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte
    Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten
    anderen Gruppen von Umsätzen anhand annähernder Schätzungen zu ermitteln (Bekanntgegeben
    unter Aktenzeichen C(2014) 8931)'
  type: main
- language: bg
