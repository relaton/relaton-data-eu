title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2322/88 of 26 July 1988 amending Commission
    Regulation (EEC) No 3847/87 establishing the list of vessels exceeding eight metres
    length overall permitted to use within certain coastal areas of the Community
    beam trawls whose aggregate length exceeds eight metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2322/88 de la Commission du 26 juillet 1988 modifiant
    le règlement (CEE) n° 3847/87 établissant la liste des bateaux dont la longueur
    hors tout dépasse 8 mètres, autorisés à pêcher dans certaines zones côtières
    de la Communauté à l'aide de chaluts à perches dont la longueur totale dépasse
    8 mètres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2322/88 DER KOMMISSION vom 26. Juli 1988 zur Änderung
    der Verordnung (EWG) Nr. 3847/87 zur Festlegung der Liste der Schiffe mit einer
    Länge über alles von mehr als 8 m, die in bestimmten Küstengebieten der Gemeinschaft
    mit Baumkurren fischen dürfen, deren Gesamtbaumlänge mehr als 8 m beträgt #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2322/88 af 26. juli 1988 om ændring
    af forordning (EØF) nr. 3847/87 om listen over fartøjer med en længde overalt
    på over 8 m, der i visse af Fællesskabets kystområder har tilladelse til at
    anvende bomtrawl, hvis samlede længde overstiger 8 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2322/88 της Επιτροπής
    της 26ης Ιουλίου 1988 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3847/87 που καταρτίζει τον
    κατάλογο των σκαφών συνολικού μήκους άνω των
    8 μέτρων τα οποία επιτρέπεται να αλιεύουν σε
    ορισμένες παράκτιες περιοχές της Κοινότητας
    χρησιμοποιώντας δοκότρατες των οποίων το συνολικό
    μήκος υπερβαίνει τα 8 μέτρα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2322/88 DELLA COMMISSIONE del 26 luglio 1988 recante
    modifica del regolamento (CEE) n. 3847/87 della Commissione che fissa l'' elenco
    dei pescherecci di lunghezza fuori tutto superiore a 8 metri, autorizzati ad usare,
    in determinate zone costiere della Comunità, reti a strascico a pali, la cui
    lunghezza complessiva superi gli 8 metri #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2322/88 VAN DE COMMISSIE van 26 juli 1988 tot wijziging
    van Verordening (EEG) nr. 3847/87 tot vaststelling van de lijst van vaartuigen
    met een lengte over alles van meer dan 8 meter en die in bepaalde kustzones van
    de Gemeenschap boomkorren mogen gebruiken waarvan de totale boomlengte meer dan
    8 meter bedraagt #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2322/88 da Comissão de 26 de Julho de 1988 que
    altera o Regulamento (CEE) n.° 3847/87 da Comissão, que estabelece a lista dos
    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar,
    em determinadas zonas costeiras da Comunidade, redes de arrasto de vara em que
    o comprimento total das varas seja superior a oito metros
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Ng 2322/88 DE LA COMISIÓN de 26 de julio de 1988 que
    modifica el Reglamento (CEE) No 3847/87 por el que se establece la lista de barcos
    cuya eslora total exceda los ocho metros y a los que se permite utilizar, dentro
    de determinadas zonas costeras de la Comunidad, artes de arrastre de vara cuya
    longitud total supere los ocho metros #'
