title:
- language: en
  script: Latn
  content: Decision No 889/98/EC of the European Parliament and of the Council of
    7 April 1998 amending Council Decision 92/481/EEC on the adoption of an action
    plan for the exchange between Member State administrations of national officials
    who are engaged in the implementation of Community legislation required to achieve
    the internal market (Karolus programme)
  type: main
- language: fr
  script: Latn
  content: Décision n° 889/98/CE du Parlement européen et du Conseil du 7 avril
    1998 modifiant la décision 92/481/CEE du Conseil concernant l'adoption d'un plan
    d'action pour l'échange, entre les administrations des États membres, de fonctionnaires
    nationaux chargés de la mise en oeuvre de la législation communautaire nécessaire
    à la réalisation du marché intérieur (programme Karolus)
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 889/98/EG des Europäischen Parlaments und DES Rates vom
    7. April 1998 zur Änderung der Entscheidung 92/481/EWG des Rates über einen
    Aktionsplan für den zwischen den Verwaltungen der Mitgliedstaaten vorzunehmenden
    Austausch nationaler Beamter, die mit der zur Verwirklichung des Binnenmarktes
    erforderlichen Durchführung des Gemeinschaftsrechts betraut sind (Programm Karolus)
  type: main
- language: da
  script: Latn
  content: Europa-parlamentets og Rådets beslutning nr. 889/98/EF af 7. april 1998
    om ændring af Rådets beslutning 92/481/EØF om vedtagelse af en handlingsplan
    for udveksling mellem medlemsstaternes forvaltninger af nationale embedsmænd,
    der har til opgave at gennemføre de EF-forskrifter, som er nødvendige for virkeliggørelsen
    af det indre marked (Karolus- programmet)
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 889/98/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 7ης Απριλίου 1998 σχετικά
    με την τροποποίηση της απόφασης 92/481/ΕΟΚ του
    Συμβουλίου για τη θέσπιση ενός προγράμματος
    δράσης σχετικά με την ανταλλαγή εθνικών υπαλλήλων
    μεταξύ των διοικήσεων των κρατών μελών, οι
    οποίοι είναι επιφορτισμένοι με την εφαρμογή
    της κοινοτικής νομοθεσίας που απαιτείται για
    την υλοποίηση της εσωτερικής αγοράς (πρόγραμμα
    Karolus)
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja Neuvoston päätös N:o 889/98/EY, tehty 7 päivänä
    huhtikuuta 1998, sisämarkkinoiden toteuttamiseksi tarvittavan yhteisön lainsäädännön
    täytäntöönpanosta vastaavien kansallisten virkamiesten vaihtoa jäsenvaltioiden
    hallintojen välillä koskevasta toimintasuunnitelmasta (Karolus-ohjelma) tehdyn
    neuvoston päätöksen 92/481/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Decisione n. 889/98/CE del Parlamento europeo e del Consiglio del 7 aprile
    1998 che modifica la decisione 92/481/CEE del Consiglio per l'adozione di un piano
    d'azione per lo scambio, tra le amministrazioni degli Stati membri, di funzionari
    nazionali incaricati dell'applicazione della normativa comunitaria necessaria
    per il completamento del mercato interno (programma Karolus)
  type: main
- language: nl
  script: Latn
  content: Beschikking Nr. 889/98/EG van het Europees Parlement en de Raad van 7 april
    1998 tot wijziging van Beschikking 92/481/EEG van de Raad betreffende een actieprogramma
    voor de uitwisseling, tussen ambtelijke diensten van de lidstaten, van nationale
    ambtenaren die belast zijn met de tenuitvoerlegging van communautaire wet- en
    regelgeving inzake de interne markt (Karolus-programma)
  type: main
- language: pt
  script: Latn
  content: Decisão nº 889/98/CE do Parlamento Europeu e do Conselho de 7 de Abril
    de 1998 que altera a Decisão 92/481/CEE do Conselho relativa à adopção de
    um plano de acção para o intercâmbio, entre as administrações dos Estados-
    membros, de funcionários nacionais envolvidos na aplicação da legislação
    comunitária necessária à realização do mercado único (programa Karolus)
  type: main
- language: es
  script: Latn
  content: Decisión n° 889/98/CE del Parlamento Europeo y del Consejo de 7 de abril
    de 1998 por la que se modifica la Decisión 92/481/CEE del Consejo relativa a
    la adopción de un plan de acción para el intercambio entre las administraciones
    de los Estados miembros de funcionarios nacionales encargados de la puesta en
    marcha de la legislación comunitaria necesaria para la realización del mercado
    interior (programa Karolus)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och Rådets beslut nr 889/98/EG av den 7 april 1998
    om ändring av rådets beslut 92/481/EEG om antagande av en handlingsplan för
    utbytesverksamhet mellan medlemsstaternas förvaltningar i fråga om nationella
    tjänstemän som medverkar i genomförandet av den gemenskapslagstiftning som
    krävs för att förverkliga den inre marknaden (Karolus-programmet)
