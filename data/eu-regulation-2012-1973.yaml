title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2012/73 of the Council of 24 July 1973 extending for
    the second time Regulations (EEC) Nos 2313/71 and 2823/71 partially and temporarily
    suspending Common Customs Tariff duties applicable to wine originating in and
    coming from Algeria, Morocco, Tunisia and Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2012/73 du Conseil, du 24 juillet 1973, prorogeant
    pour la deuxième fois les règlements (CEE) n° 2313/73 et n 2823/71, portant
    suspension temporaire partielle des droits du tarif douanier commun applicables
    aux vins originaires et en provenance de l'Algérie, du Maroc, de la Tunisie et
    de la Turquie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2012/73 des Rates vom 24. Juli 1973 zur zweiten Verlängerung
    der Verordnungen (EWG) Nrn. 2313/71 und 2823/71 über die zeitweilige teilweise
    Aussetzung der Zollsätze des Gemeinsamen Zolltarifs für Wein mit Ursprung in
    und Herkunft aus Algerien, Marokko, Tunesien und der Türkei
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2012/73 af 24. juli 1973 om den anden forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 2313/71 og 2823/71 om midlertidig
    og delvis suspension af satserne i den fælles toldtarif for vin, der har oprindelse
    i og kommer fra Algeriet, Tunesien og Tyrkiet
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2012/73 del Consiglio, del 24 luglio 1973, che proroga
    per la seconda volta i regolamenti (CEE) n. 2313/71 e 2823/71, recanti sospensione
    temporanea parziale dei dazi della tariffa doganale comune applicabili ai vini
    originari e provenienti dall'Algeria, dal Marocco, dalla Tunisia e dalla Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2012/73 van de Raad van 24 juli 1973 houdende tweede
    verlenging van de Verordening (EEG) nr. 2313/71 en nr. 2823/71 houdende tijdelijke
    gedeeltelijke schorsing van de rechten van het gemeenschappelijk douanetarief
    voor wijn van oorsprong en herkomst uit Algerië, Marokko, Tunesië en Turkije
  type: main
