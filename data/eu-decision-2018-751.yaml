title:
- language: en
  script: Latn
  content: Council Decision (EU) 2018/751 of 14 May 2018 on the position to be adopted
    on behalf of the European Union within the Stabilisation and Association Council
    established by the Stabilisation and Association Agreement between the European
    Communities and their Member States, of the one part, and the former Yugoslav
    Republic of Macedonia, of the other part, concerning the transition to the second
    stage of the Association between the European Communities and their Member States,
    of the one part, and the former Yugoslav Republic of Macedonia, of the other part,
    pursuant to Article 5(3) of the Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2018/751 du Conseil du 14 mai 2018 relative à la position
    à prendre au nom de l'Union européenne au sein du conseil de stabilisation et
    d'association institué par l'accord de stabilisation et d'association entre les
    Communautés européennes et leurs États membres, d'une part, et l'ancienne République
    yougoslave de Macédoine, d'autre part, concernant le passage à la deuxième
    phase de l'association entre les Communautés européennes et leurs États membres,
    d'une part, et l'ancienne République yougoslave de Macédoine, d'autre part,
    conformément à l'article 5, paragraphe 3, de l'accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2018/751 des Rates vom 14. Mai 2018 über den im Namen der
    Europäischen Union in dem gemäß dem Stabilisierungs- und Assoziierungsabkommen
    zwischen den europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits
    und der ehemaligen jugoslawischen Republik Mazedonien andererseits eingesetzten
