    Dohodou o stabilizaci a přidružení mezi Evropskými společenstvími a jejich
    členskými státy na jedné straně a Bývalou jugoslávskou republikou Makedonie
    na straně druhé, pokud jde o přechod do druhé etapy přidružení mezi Evropskými
