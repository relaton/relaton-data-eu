title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1969, portant octroi du concours
    du FSE au bénéfice de la République italienne pour des dépenses relatives
    à des opérations de réinstallation effectuées par le Ministero dell'interno
    et l'Opera nazionale per gli invalidi di guerra (ONIG)
  type: main
- language: de
  script: Latn
  content: '70/91/EWG: Entscheidung der Kommission vom 22. Dezember 1969 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für vom "Ministero dell''Interno" und von der "Opera nazionale per gli invalidi
    di guerra (ONIG)" durchgeführte Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '70/91/CEE: Decisione della Commissione, del 22 dicembre 1969, relativa
    alla concessione di un contributo del FSE a favore della Repubblica italiana per
    spese concernenti operazioni di nuova sistemazione effettuate dal «Ministero
    dell''interno» e dall''«Opera nazionale per gli invalidi di guerra (ONIG)»'
  type: main
- language: nl
  script: Latn
  content: '70/91/EEG: Beschikking van de Commissie van 22 december 1969 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door het "Ministero dell''interno" en het "Opera nazionale per gli invalidi
    di guerra (O.N.I.G.)" gemaakte verplaatsingskosten'
  type: main
