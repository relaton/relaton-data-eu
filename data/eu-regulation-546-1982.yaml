title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 546/82 of 8 March 1982 re-establishing the
    levying of customs duties on goat and kid skin leather, falling within subheading
    41.04 B II and originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 546/82 de la Commission, du 8 mars 1982, portant rétablissement
    de la perception des droits de douane applicables aux autres peaux de caprins,
    préparées, de la sous-position 41.04 B II du tarif douanier commun, originaires
    de l' Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 546/82 der Kommission vom 8. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für anderes Ziegen- und Zickelleder der Tarifstelle 41.04
    B II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 546/82 af 8. marts 1982 om genindførelse
    af opkrævning af told for andet læder af gede- og gedekidskind, henhørende
    under pos. 41.04 B II og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 546/82 τής Επιτροπής τής
    8ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά έτερα δέρματα αιγοειδών, κατειργασμένα,
    τής δασμολογικής διακρίσεως 41. 04 Β ΙΙ, καταγωγής
    Ινδίας, δικαιούχου τών προβλεπομένων από τόν
    κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 546/82 della Commissione, dell' 8 marzo 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli caprine,
    preparate, della sottovoce 41.04 B II della tariffa doganale comune, originarie
    dell' India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 546/82 van de Commissie van 8 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op geiteleder,
    alsmede voorgelooide huiden en vellen, van geiten, van postonderverdeling 41.04
    B II, van oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3601/81 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
