    van Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een steunregeling
    voor producenten van bepaalde akkerbouwgewassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 575/2001 da Comissão, de 23 de Março de 2001, que
