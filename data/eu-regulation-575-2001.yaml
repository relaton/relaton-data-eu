  content: Commission Regulation (EC) No 575/2001 of 23 March 2001 derogating from
    Regulation (EC) No 2316/1999 laying down detailed rules for the application of
    Council Regulation (EC) No 1251/1999 establishing a support system for producers
    of certain arable crops, with regard to set-aside
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 575/2001 de la Commission du 23 mars 2001 dérogeant
