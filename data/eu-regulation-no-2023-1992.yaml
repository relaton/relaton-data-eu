title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2023/92 of 20 July 1992 fixing for the 1992/93
    marketing year the minimum price to be paid to producers for tomatoes and the
    amount of production aid for processed tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2023/92 de la Commission du 20 juillet 1992 fixant,
    pour la campagne 1992/1993, le prix minimal à payer aux producteurs pour les
    tomates ainsi que le montant de l'aide à la production pour les produits transformés
    à base de tomates
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2023/92 DER KOMMISSION vom 20. Juli 1992 zur Festsetzung
    des den Tomatenerzeugern zu zahlenden Mindestpreises sowie der Produktionsbeihilfe
    für Verarbeitungserzeugnisse aus Tomaten im Wirtschaftsjahr 1992/93 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2023/92 af 20. juli 1992 om fastsættelse
    for produktionsåret 1992/93 af den minimumspris, der skal betales producenterne
    for tomater, samt af producentstøtten for produkter forarbejdet på basis af
    tomater #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2023/92 της Επιτροπής
    της 20ής Ιουλίου 1992 που καθορίζει, για την περίοδο
    εμπορίας 1992/93, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για τις τομάτες καθώς και
    το ποσό της ενίσχυσης στην παραγωγή για τα
    μεταποιημένα προϊόντα με βάση τις τομάτες
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2023/92 DELLA COMMISSIONE del 20 luglio 1992 che
    stabilisce, per la campagna di commercializzazione 1992/1993, il prezzo minimo
    da pagare ai produttori di pomodori e l'' importo dell'' aiuto alla produzione
    per i prodotti trasformati a base di pomodoro #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2023/92 VAN DE COMMISSIE van 20 juli 1992 tot vaststelling,
    voor het verkoopseizoen 1992/1993, van de voor tomaten aan de telers te betalen
    minimumprijs, alsmede van het bedrag van de steun bij de produktie van op basis
    van tomaten verwerkte produkten #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2023/92 DA COMISSÃO de 20 de Julho de 1992 que fixa,
    em relação à campanha de comercialização de 1992/1993, o preço mínimo do
    tomate a pagar aos produtores, bem como o montante da ajuda à produção para
    os produtos transformados à base de tomate #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2023/92 DE LA COMISIÓN de 20 de julio de 1992 por
    el que se fijan, para la campaña de 1992/93, el precio mínimo que debe pagarse
    a los productores de tomate y el importe de la ayuda a la producción de los productos
    a base de tomates #'
  type: main
