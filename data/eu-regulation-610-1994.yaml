title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 610/94 of 18 March 1994 amending Regulation
    (EC) No 465/94 fixing for the 1993/94 wine year the percentages of table wine
    production to be delivered for compulsory distillation as provided for in Article
    39 of Council Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 610/94 de la Commission du 18 mars 1994 modifiant le
    règlement (CE) n° 465/94 fixant pour la campagne 1993/1994 les pourcentages
    de la production de vin de table à livrer à la distillation obligatoire visée
    à l'article 39 du règlement (CEE) n° 822/87 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 610/94 DER KOMMISSION vom 18. März 1994 zur Änderung
    der Verordnung (EG) Nr. 465/94 zur Festsetzung des zur obligatorischen Destillation
    gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87 des Rates zu liefernden Prozentsatzes
    der Tafelweinerzeugung für das Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 610/94 af 18. marts 1994 om ændring
    af forordning (EF) nr. 465/94 om fastsættelse for produktionsåret 1993/94 af,
    hvor stor en procentdel af produktionen af bordvin, der skal leveres til obligatorisk
    destillation efter artikel 39 i Rådets forordning (EØF) nr. 822/87
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 610/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Μαρτίου 1994 για τον καθορισμό, για την
    περίοδο 1993/94, των ποσοστών παραγωγής επιτραπέζιου
    οίνου που παραδίδονται στην υποχρεωτική απόσταξη
    που αναφέρεται στο άρθρο 39 του κανονισμού (ΕΟΚ)
    αριθ. 822/87 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 610/94 DELLA COMMISSIONE del 18 marzo 1994 che modifica
    il regolamento (CE) n. 465/94 che fissa, per la campagna 1993/1994, le percentuali
    della produzione di vini da tavola da consegnare alla distillazione obbligatoria
    di cui all' articolo 39 del regolamento (CEE) n. 822/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 610/94 VAN DE COMMISSIE van 18 maart 1994 houdende
    wijziging van Verordening (EG) nr. 465/94 tot vaststelling, voor het wijnoogstjaar
    1993/1994, van de percentages van de tafelwijnproduktie die moeten worden geleverd
    voor de in artikel 39 van Verordening (EEG) nr. 822/87 van de Raad bedoelde distillatie
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 610/94 DA COMISSÃO de 18 de Março de 1994 que altera
