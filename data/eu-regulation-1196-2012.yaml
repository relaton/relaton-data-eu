title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1196/2012 of 13 December 2012
    amending Regulation (EU) No 9/2010 as regards the minimum content of a preparation
    of endo-1,4-beta-xylanase produced by Trichoderma reesei (ATCC PTA 5588) as a
    feed additive in feed for laying hens (holder of authorisation Danisco Animal
    Nutrition)
  type: main
- language: fr
  script: Latn
