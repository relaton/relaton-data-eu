    an einer Zubereitung von Endo-1,4-beta-Xylanase aus Trichoderma reesei (ATCC PTA
    5588) als Futtermittelzusatzstoff in Futtermitteln für Legehennen (Zulassungsinhaber
    Danisco Animal Nutrition)
  type: main
