    2012 modifiant le règlement (UE) n o 9/2010 en ce qui concerne la teneur minimale
    d’une préparation d’endo-1,4-β-xylanase produite par Trichoderma reesei
    (ATCC PTA 5588) en tant qu’additif dans l’alimentation des poules pondeuses
    (titulaire de l’autorisation: Danisco Animal Nutrition)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1196/2012 der Kommission vom 13. Dezember
