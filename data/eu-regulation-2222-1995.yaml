title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2222/95 of 20 September 1995 determining
    the extent to which applications lodged in August 1995 for the issue of import
    licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2222/95 de la Commission, du 20 septembre 1995, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'août 1995 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2222/95 der Kommission vom 20. September 1995 über
    den Umfang, in dem den im Monat August 1995 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2222/95 af 20. september 1995 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i august 1995 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2222/95 της Επιτροπής
    της 20ής Σεπτεμβρίου 1995 ο οποίος καθορίζει σε
    ποιό βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    έκδοσης πιστοποιητικών εισαγωγής που κατατέθηκαν
    τον Αύγουστο του 1995 για τα κατεψυγμένα βόεια
    κρέατα που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2222/95, annettu 20 päivänä syyskuuta 1995,
    elokuussa 1995 jätettyjen, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2222/95 della Commissione, del 20 settembre 1995, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli di
    importazione presentate nel mese di agosto 1995 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2222/95 van de Commissie van 20 september 1995 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in augustus 1995
    ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees,
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2222/95 da Comissão, de 20 de Setembro de 1995, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados em Agosto de 1995 para carne de bovino congelada
    destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2222/95 de la Comisión, de 20 de septiembre de 1995,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    expedición de certificados de importación presentadas hasta el mes de agosto
    de 1995 para las carnes de vacuno congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2222/95 av den 20 september 1995 om i
