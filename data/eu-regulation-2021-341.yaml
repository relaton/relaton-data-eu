id: EURegulation2021341
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2021/341 of 23 February 2021 amending Regulations
    (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU) 2019/2021,
    (EU) 2019/2022, (EU) 2019/2023 and (EU) 2019/2024 with regard to ecodesign requirements
    for servers and data storage products, electric motors and variable speed drives,
    refrigerating appliances, light sources and separate control gears, electronic
    displays, household dishwashers, household washing machines and household washer-dryers
    and refrigerating appliances with a direct sales function
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2021/341 de la Commission du 23 février 2021 modifiant
    les règlements (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020,
    (UE) 2019/2021, (UE) 2019/2022, (UE) 2019/2023 et (UE) 2019/2024 en ce qui concerne
    les exigences d’écoconception applicables aux serveurs et aux produits de stockage
    de données, aux moteurs électriques et aux variateurs de vitesse, aux appareils
    de réfrigération, aux sources lumineuses et aux appareillages de commande séparés,
    aux dispositifs d’affichage électroniques, aux lave-vaisselle ménagers, aux
    lave-linge ménagers et aux lave-linge séchants ménagers, et aux appareils de
    réfrigération disposant d’une fonction de vente directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2021/341 der Kommission vom 23. Februar 2021 zur Änderung
    der Verordnungen (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020,
    (EU) 2019/2021, (EU) 2019/2022, (EU) 2019/2023 und (EU) 2019/2024 in Bezug auf
    Ökodesign-Anforderungen an Server und Datenspeicherprodukte, Elektromotoren und
    Drehzahlregelungen, Kühlgeräte, Lichtquellen und separate Betriebsgeräte, elektronische
    Displays, Haushaltsgeschirrspüler, Haushaltswaschmaschinen und Haushaltswaschtrockner
    sowie Kühlgeräte mit Direktverkaufsfunktion
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2021/341 на Комисията от 23 февруари
    2021 година за изменение на регламенти (ЕС) 2019/424,
    (ЕС) 2019/1781, (ЕС) 2019/2019, (ЕС) 2019/2020, (ЕС) 2019/2021, (ЕС)
    2019/2022, (ЕС) 2019/2023 и (ЕС) 2019/2024 по отношение на изискванията
    за екопроектиране на сървъри и продукти за
    съхранение на данни, електродвигатели и регулатори
    на честотата на въртене, хладилни уреди, светлинни
    източници и отделна пусково-регулираща апаратура,
    електронни екрани, домакински съдомиялни машини,
    битови перални машини и битови перални машини
    със сушилня и хладилни уреди с функция за директна
    продажба
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2021/341 ze dne 23. února 2021, kterým se mění
    nařízení (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU)
    2019/2021, (EU) 2019/2022, (EU) 2019/2023 a (EU) 2019/2024, pokud jde o požadavky
    na ekodesign serverů a datových úložišť, elektromotorů a pohonů s proměnnými
    otáčkami, chladicích spotřebičů, světelných zdrojů a samostatných předřadných
    přístrojů, elektronických displejů, myček nádobí pro domácnost, praček
    pro domácnost a praček se sušičkou pro domácnost a chladicích spotřebičů
    s přímou prodejní funkcí
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2021/341 af 23. februar 2021 om ændring
    af forordning (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU)
    2019/2021, (EU) 2019/2022, (EU) 2019/2023 og (EU) 2019/2024 for så vidt angår
    krav til miljøvenligt design af servere og datalagringsprodukter, elmotorer og
    frekvensomformere, køle/fryseapparater, lyskilder og separate styreanordninger,
    elektroniske skærme, husholdningsopvaskemaskiner, husholdningsvaskemaskiner og
    husholdningsvaske/tørremaskiner samt køle/fryseapparater, der anvendes til direkte
    salg
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2021/341 της Επιτροπής της 23ης
    Φεβρουαρίου 2021 για την τροποποίηση των κανονισμών
    (ΕΕ) 2019/424, (ΕΕ) 2019/1781, (ΕΕ) 2019/2019, (ΕΕ) 2019/2020, (ΕΕ)
    2019/2021, (ΕΕ) 2019/2022, (ΕΕ) 2019/2023 και (ΕΕ) 2019/2024 όσον
    αφορά τις απαιτήσεις οικολογικού σχεδιασμού
    για εξυπηρετητές και προϊόντα αποθήκευσης
    δεδομένων, ηλεκτρικούς κινητήρες και συστήματα
    μετάδοσης μεταβλητής ταχύτητας, ψυκτικές συσκευές,
    φωτεινές πηγές και χωριστές διατάξεις χειρισμού
    των φωτεινών πηγών, ηλεκτρονικές διατάξεις
    απεικόνισης, οικιακά πλυντήρια πιάτων, οικιακά
    πλυντήρια ρούχων και οικιακά πλυντήρια-στεγνωτήρια
    ρούχων, και ψυκτικές συσκευές με λειτουργία
    άμεσης πώλησης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) 2021/341, 23. veebruar 2021, millega muudetakse
    määrusi (EL) 2019/424, (EL) 2019/1781, (EL) 2019/2019, (EL) 2019/2020, (EL)
    2019/2021, (EL) 2019/2022, (EL) 2019/2023 ja (EL) 2019/2024 seoses serverite ja
    andmesalvestustoodete, elektrimootorite ja sagedusmuundurite, jahutus-külmutusseadmete,
    valgusallikate ja eraldiseisvate talitlusseadiste, kuvarite, kodumajapidamises
    kasutatavate nõudepesumasinate, kodumajapidamises kasutatavate pesumasinate ja
    kodumajapidamises kasutatavate pesumasinate-kuivatite ning otsese müügifunktsiooniga
    jahutus-külmutusseadmete ökodisaini nõuetega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2021/341, annettu 23 päivänä helmikuuta 2021,
    asetusten (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU)
    2019/2021, (EU) 2019/2022, (EU) 2019/2023 ja (EU) 2019/2024 muuttamisesta palvelinten
    ja tiedontallennustuotteiden, sähkömoottoreiden ja taajuusmuuttajien, kylmäsäilytyslaitteiden,
    valonlähteiden ja erillisten liitäntälaitteiden, elektronisten näyttöjen,
    kotitalouksien astianpesukoneiden, kotitalouksien pyykinpesukoneiden ja kotitalouksien
    kuivaavien pyykinpesukoneiden sekä suoran myyntitoiminnon kylmäsäilytyslaitteiden
    ekologista suunnittelua koskevien vaatimusten osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2021/341 ón gCoimisiún an 23 Feabhra 2021 lena leasaítear
    Rialacháin (AE) 2019/424, (AE) 2019/1781, (AE) 2019/2019, (AE) 2019/2020, (AE)
    2019/2021, (AE) 2019/2022, (AE) 2019/2023 agus (AE) 2019/2024 a mhéid a bhaineann
    le ceanglais éicidhearthóireachta maidir le freastalaithe agus táirgí stórála
    sonraí, mótair leictreacha agus tiomántáin luais inathraithe, fearais chuisniúcháin,
    foinsí solais agus gléasanna rialaithe ar leithligh, taispeántais leictreonacha,
    miasniteoirí tí, meaisíní níocháin tí agus meaisíní triomadóir-niteoir
    tí agus fearais chuisniúcháin a bhfuil feidhm díolacháin dhírigh acu
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2021/341 оd 23. veljače 2021. o izmjeni uredaba
    (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU) 2019/2021,
    (EU) 2019/2022, (EU) 2019/2023 i (EU) 2019/2024 u pogledu zahtjeva za ekološki
    dizajn poslužitelja i proizvoda za pohranu podataka, elektromotora i pogona s
    promjenjivom brzinom, rashladnih uređaja, izvora svjetlosti i zasebnih predspojnih
    naprava, elektroničkih zaslona, kućanskih perilica posuđa, kućanskih perilica
    rublja i kućanskih perilica-sušilica rublja i rashladnih uređaja s funkcijom
    izravne prodaje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/341 rendelete (2021. február 23.) az (EU) 2019/424,
    az (EU) 2019/1781, az (EU) 2019/2019, az (EU) 2019/2020, az (EU) 2019/2021, az
    (EU) 2019/2022, az (EU) 2019/2023 és az (EU) 2019/2024 rendeletnek a szerverek
    és az adattárolók, az elektromos motorok és a frekvenciaváltók, a hűtőkészülékek,
    a fényforrások és különálló vezérlőegységek, az elektronikus kijelzők,
    a háztartási mosogatógépek, a háztartási mosógépek és háztartási mosó-szárítógépek,
    valamint a kiskereskedelmi használatra szánt hűtőkészülékek környezettudatos
    tervezésére vonatkozó rendelkezések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2021/341 della Commissione del 23 febbraio 2021 che modifica
    i regolamenti (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020, (UE)
    2019/2021, (UE) 2019/2022, (UE) 2019/2023 e (UE) 2019/2024 per quanto riguarda
    le specifiche per la progettazione ecocompatibile di server e prodotti di archiviazione
    dati, motori elettrici e variatori di velocità, apparecchi di refrigerazione,
    sorgenti luminose e unità di alimentazione separate, display elettronici, lavastoviglie
    per uso domestico, lavatrici per uso domestico e lavasciuga biancheria per uso
    domestico, e apparecchi di refrigerazione con funzione di vendita diretta
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2021/341 (2021. gada 23. februāris), ar ko Regulu
    (ES) 2019/424, (ES) 2019/1781, (ES) 2019/2019, (ES) 2019/2020, (ES) 2019/2021,
    (ES) 2019/2022, (ES) 2019/2023 un (ES) 2019/2024 groza attiecībā uz ekodizaina
    prasībām serveriem un datu glabāšanas ražojumiem, elektromotoriem un regulējama
    ātruma piedziņām, aukstumiekārtām, gaismas avotiem un atsevišķiem vadības
    blokiem, elektroniskajiem displejiem, sadzīves trauku mazgāšanas mašīnām,
    sadzīves veļas mazgāšanas mašīnām un sadzīves veļas mazgāšanas un žāvēšanas
    mašīnām un aukstumiekārtām ar tiešās pārdošanas funkciju
  type: main
- language: lt
  script: Latn
  content: Komisijos reglamentas (ES) 2021/341 2021 m. vasario 23 d. kuriuo iš dalies
    keičiamos reglamentų (ES) 2019/424, (ES) 2019/1781, (ES) 2019/2019, (ES) 2019/2020,
    (ES) 2019/2021, (ES) 2019/2022, (ES) 2019/2023 ir (ES) 2019/2024 nuostatos dėl
    serverių ir duomenų saugojimo gaminių, elektros variklių ir tolydžiojo reguliavimo
    pavarų, šaldymo aparatų, šviesos šaltinių ir atskirų valdymo įtaisų,
    elektroninių vaizduoklių, buitinių indaplovių, buitinių skalbyklių bei buitinių
    skalbyklių-džiovyklių ir prekėms tiesiogiai parduoti skirtų šaldymo aparatų
    ekologinio projektavimo reikalavimų
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2021/341 tat-23 ta’ Frar 2021 li jemenda
    r-Regolamenti (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020, (UE)
    2019/2021, (UE) 2019/2022, (UE) 2019/2023 u (UE) 2019/2024 fir-rigward tar-rekwiżiti
    tal-ekodisinn għal servers u prodotti tal-ħżin tad-data, muturi elettriċi
    u sistemi ta’ trażmissjoni b’veloċità varjabbli, apparat refriġeranti,
    sorsi tad-dawl u tagħmir ta’ kontroll separat, unitajiet tal-wiri elettroniċi,
    magni tal-ħasil tal-platti domestiċi, magni tal-ħasil tal-ħwejjeġ domestiċi
    u magni tal-ħasil u tat-tnixxif tal-ħwejjeġ domestiċi b’funzjoni ta’ bejgħ
    dirett
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2021/341 van de Commissie van 23 februari 2021 tot wijziging
    van Verordeningen (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020,
    (EU) 2019/2021, (EU) 2019/2022, (EU) 2019/2023 en (EU) 2019/2024, wat betreft
    de eisen inzake ecologisch ontwerp voor servers en gegevensopslagproducten, elektromotoren
    en snelheidsvariatoren, koelapparaten, lichtbronnen en afzonderlijke voorschakelapparatuur,
    elektronische beeldschermen, huishoudelijke afwasmachines, huishoudelijke wasmachines
    en huishoudelijke was-droogcombinaties en koelapparaten met een directe-verkoopfunctie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2021/341 z dnia 23 lutego 2021 r. zmieniające
    rozporządzenia (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020,
    (UE) 2019/2021, (UE) 2019/2022, (UE) 2019/2023 oraz (UE) 2019/2024 w odniesieniu
    do wymogów dotyczących ekoprojektu dla serwerów i produktów do przechowywania
    danych, silników elektrycznych i układów bezstopniowej regulacji obrotów,
    urządzeń chłodniczych, źródeł światła i oddzielnego osprzętu sterującego,
    wyświetlaczy elektronicznych, zmywarek do naczyń dla gospodarstw domowych, pralek
    dla gospodarstw domowych i pralko-suszarek dla gospodarstw domowych oraz urządzeń
    chłodniczych z funkcją sprzedaży bezpośredniej
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2021/341 da Comissão de 23 de fevereiro de 2021 que altera
    os Regulamentos (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020,
    (UE) 2019/2021, (UE) 2019/2022, (UE) 2019/2023 e (UE) 2019/2024 no respeitante
    aos requisitos de conceção ecológica aplicáveis aos servidores e produtos
    de armazenamento de dados, motores elétricos e variadores de velocidade, aparelhos
    de refrigeração, fontes de luz e dispositivos de comando separados, ecrãs eletrónicos,
    máquinas de lavar louça para uso doméstico, máquinas de lavar roupa para uso
    doméstico e máquinas combinadas de lavar e secar roupa para uso doméstico e
    aparelhos de refrigeração com função de venda direta
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2021/341 al Comisiei din 23 februarie 2021 de modificare
    a Regulamentelor (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019, (UE) 2019/2020,
    (UE) 2019/2021, (UE) 2019/2022, (UE) 2019/2023 și (UE) 2019/2024 în ceea ce
    privește cerințele în materie de proiectare ecologică aplicabile serverelor
    și produselor pentru stocarea datelor, motoarelor electrice și variatoarelor
    de viteză, aparatelor frigorifice, surselor de lumină și dispozitivelor de
    comandă separate, afișajelor electronice, mașinilor de spălat vase de uz casnic,
    mașinilor de spălat rufe de uz casnic și mașinilor de spălat și uscat rufe
    de uz casnic, precum și aparatelor frigorifice cu funcție de vânzare directă
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2021/341 z 23. februára 2021, ktorým sa menia
    nariadenia (EÚ) 2019/424, (EÚ) 2019/1781, (EÚ) 2019/2019, (EÚ) 2019/2020,
    (EÚ) 2019/2021, (EÚ) 2019/2022, (EÚ) 2019/2023 a (EÚ) 2019/2024, pokiaľ ide
    o požiadavky na ekodizajn serverov a dátových úložísk, elektromotorov a
    pohonov s premenlivými otáčkami, chladiacich spotrebičov, svetelných zdrojov
    a samostatných ovládacích zariadení, elektronických displejov, umývačiek
    riadu pre domácnosť, práčok a práčok so sušičkou pre domácnosť a chladiacich
    spotrebičov s funkciou priameho predaja
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2021/341 z dne 23. februarja 2021 o spremembi uredb
    (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020, (EU) 2019/2021,
    (EU) 2019/2022, (EU) 2019/2023 in (EU) 2019/2024 v zvezi z zahtevami za okoljsko
    primerno zasnovo strežnikov in izdelkov za shranjevanje podatkov, elektromotorjev
    in pogonov s spremenljivo hitrostjo, hladilnih aparatov, svetlobnih virov in ločenih
    krmilnih naprav, elektronskih prikazovalnikov, gospodinjskih pomivalnih strojev,
    gospodinjskih pralnih strojev in pralno-sušilnih strojev ter hladilnih aparatov
    z neposredno prodajno funkcijo
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2021/341 de la Comisión de 23 de febrero de 2021 por el
    que se modifican los Reglamentos (UE) 2019/424, (UE) 2019/1781, (UE) 2019/2019,
    (UE) 2019/2020, (UE) 2019/2021, (UE) 2019/2022, (UE) 2019/2023 y (UE) 2019/2024
    en lo relativo a los requisitos de diseño ecológico aplicables a servidores
    y productos de almacenamiento de datos, motores eléctricos y controladores de
    velocidad variable, aparatos de refrigeración, fuentes luminosas y mecanismos
    de control independientes, pantallas electrónicas, lavavajillas domésticos,
    lavadoras domésticas y lavadoras-secadoras domésticas y aparatos de refrigeración
    con función de venta directa
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2021/341 av den 23 februari 2021 om ändring
    av förordningarna (EU) 2019/424, (EU) 2019/1781, (EU) 2019/2019, (EU) 2019/2020,
    (EU) 2019/2021, (EU) 2019/2022, (EU) 2019/2023 och (EU) 2019/2024 vad gäller
    krav på ekodesign för servrar och datalagringsprodukter, elektriska motorer
    och varvtalsreglerare, kyl-/frysprodukter, ljuskällor och separata drivdon, elektroniska
    bildskärmar, diskmaskiner för hushållsbruk, tvättmaskiner för hushållsbruk
    och kombinerade tvättmaskiner/torktumlare för hushållsbruk, samt kyl-/frysprodukter
    med direktförsäljningsfunktion
