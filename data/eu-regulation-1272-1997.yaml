    soveltamista koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 2999/92 muuttamisesta ja hankintaa koskevan ennakkoarvion määrittämisestä
    ajanjaksolle 1 päivästä heinäkuuta 1997 31 päivään joulukuuta 1997
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1272/97 della Commissione del 1o luglio 1997 recante
    modifica del regolamento (CEE) n. 2999/92 relativo alle modalità di applicazione
    del regime specifico di approvvigionamento di prodotti trasformati a base di ortofrutticoli
    per Madera, e che stabilisce il bilancio di approvvigionamento per il periodo
    dal 1o luglio 1997 al 31 dicembre 1997
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1272/97 van de Commissie van 1 juli 1997 tot aanpassing
    van Verordening (EEG) nr. 2999/92 houdende bepalingen ter uitvoering van de specifieke
    regeling voor de voorziening van Madeira met producten van de sector verwerkte
    groenten en fruit, en ter vaststelling van de voorzieningsbalans voor de periode
    van 1 juli tot en met 31 december 1997
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1272/97 da Comissão de 1 de Julho de 1997 que altera
