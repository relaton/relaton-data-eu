title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1272/97 of 1 July 1997 amending Regulation
    (EEC) No 2999/92 laying down detailed rules for the application of the specific
    measures for the supply of processed fruit and vegetables to Madeira and to determine
    the forecast supply balance for the period 1 July to 31 December 1997
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1272/97 de la Commission du 1er juillet 1997 modifiant
    le règlement (CEE) nº 2999/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement de Madère en produits du secteur des fruits et légumes
    transformés et déterminant le bilan d'approvisionnement pour la période du
    1er juillet au 31 décembre 1997
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1272/97 der Kommission vom 1. Juli 1997 zur Änderung
    der Verordnung (EWG) Nr. 2999/92 mit Durchführungsbestimmungen zur Sonderregelung
    für die Versorgung von Madeira mit Verarbeitungserzeugnissen aus Obst und Gemüse
    und zur Errichtung der Versorgungsbilanz für den Zeitraum vom 1. Juli 1997 bis
    31. Dezember 1997
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1272/97 af 1. juli 1997 om ændring af
    forordning (EØF) nr. 2999/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Madeira vedrørende forarbejdede frugt- og grøntsagsprodukter,
    og fastsættelse af den foreløbige forsyningsopgørelse, for så vidt angår
    perioden 1. juli til 31. december 1997
  type: main
- language: el
  script: Grek
