  script: Latn
  content: Komission asetus (ETY) N:o 1699/89, annettu 15 päivänä kesäkuuta 1989,
    asetuksen (ETY) N:o 2192/81 keskeyttämisestä, siltä osin kuin se koskee jäsenvaltioiden
    armeijoiden ja vastaavien yksiköiden voin ostamiseen myönnettävää tukea
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1699/89 della Commissione del 15 giugno 1989 che sospende
