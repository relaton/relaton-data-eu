    von Butter durch die Streitkräfte und ihnen gleichgestellte Einheiten der Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1699/89 af 15. juni 1989 om suspension
