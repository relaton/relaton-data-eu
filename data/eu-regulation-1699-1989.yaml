    van boter door het leger en de daarmee gelijkgestelde eenheden van de Lid-Staten
    betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1699/89 da Comissão de 15 de Junho de 1989 que suspende
