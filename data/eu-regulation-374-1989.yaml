title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 374/89 of 14 February 1989 amending Regulation
    (EEC) No 3662/88 and increasing to 200 000 tonnes the amount of durum wheat held
    by the Italian intervention agency for which a standing invitation to tender for
    resale has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 374/89 de la Commission, du 15 février 1989, modifiant
    le règlement (CEE) n 3662/88 et portant à 200 000 tonnes l'adjudication permanente
    pour la revente de froment dur détenu par l'organisme d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 374/89 der Kommission vom 15. Februar 1989 zur Änderung
    der Verordnung (EWG) Nr. 3662/88 zur Erweiterung der Dauerausschreibung für den
    Wiederverkauf auf dem Binnenmarkt auf 200 000 Tonnen Hartweizen aus Beständen
    der italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 374/89 af 15. februar 1989 om ændring
    af forordning (EØF) nr. 3662/88 og om forhøjelse til 200 000 tons af den løbende
    licitation med henblik på videresalg af hård hvede, som det italienske interventionsorgan
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 374/89 της Επιτροπής
    της 14ης Φεβρουαρίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3662/88 και ορίζει σε 200 000 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση σκληρού
    σιταριού που έχει στη διάθεσή του ο ιταλικός
    οργανισμός παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 374/89 della Commissione, del 14 febbraio 1989, che
    modifica il regolamento (CEE) n. 3662/88 e che porta a 200 000 t il quantitativo
    globale oggetto della gara permanente per la vendita di frumento duro detenuto
    dall'organismo d'intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 374/89 van de Commissie van 15 februari 1989 tot
    wijziging van Verordening (EEG) nr. 3662/88 ten einde de hoeveelheid waarop de
    permanente openbare inschrijving voor de verkoop van durumtarwe uit de voorraden
    van het Italiaanse interventiebureau betrekking heeft, tot 200 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 374/89 da Comissão, de 15 de Fevereiro de 1989,
    que altera o Regulamento (CEE) nº 3662/88 e que eleva para 200 000 toneladas
    o concurso permanente para a revenda de trigo duro pelo organismo de intervenção
    italiano
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 374/89 de la Comisión, de 15 de febrero de 1989, por
    el que se modifica el Reglamento (CEE) n 3662/88 y se eleva a 200 000 toneladas
    la licitación permanente para la reventa de trigo duro en poder del organismo
    de intervención italiano
