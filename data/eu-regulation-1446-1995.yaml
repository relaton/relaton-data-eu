    transitorio di talune disposizioni relative alle importazioni nella Comunità
    di taluni prodotti cerealicoli in provenienza dalla Repubblica di Polonia, dalla
    Repubblica di Ungheria, dalla Repubblica Ceca, dalla Repubblica Slovacca, dalla
