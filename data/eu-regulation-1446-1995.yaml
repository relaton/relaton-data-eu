title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1446/95 of 26 June 1995 amending Regulations
    (EC) No 121/94 and (EC) No 1606/94 as regards the transitional adjustment of certain
    rules on imports into the Community of certain products in the cereals sector
    from the Republic of Poland, the Republic of Hungary, the Czech Republic, the
    Slovak Republic, the Republic of Bulgaria, and Romania, in order to implement
    the Agreement on Agriculture concluded during the Uruguay Round of negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1446/95 de la Commission, du 26 juin 1995, modifiant
    les règlements (CE) n° 121/94 et (CE) n 1606/94 en ce qui concerne l'adaptation
    transitoire de certaines dispositions relatives aux importations dans la Communauté
    de certains produits du secteur céréalier en provenance de République de Pologne,
    de République de Hongrie, de République tchèque, de République slovaque, de
    République de Bulgarie et de Roumanie en vue de la mise en oeuvre des accords
    conclus dans le cadre des négociations du cycle d'Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1446/95 der Kommission vom 26. Juni 1995 zur Änderung
    der Verordnungen (EG) Nr. 121/94 und (EG) Nr. 1606/94 in bezug auf die übergangsweise
    Anpassung bestimmter Vorschriften für die Einfuhr bestimmter Getreideerzeugnisse
    aus der Republik Polen, der Republik Ungarn, der Tschechischen Republik, der Slowakischen
    Republik, der Republik Bulgarien und Rumänien in die Gemeinschaft zur Umsetzung
    des im Rahmen der Uruguay-Runde geschlossenen Übereinkommens über die Landwirtschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1446/95 af 26. juni 1995 om ændring
