    tilpasning af visse bestemmelser for indførsel til Fællesskabet af kornprodukter
    fra Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske
    Republik, Republikken Bulgarien og Rumænien med henblik på iværksættelsen
    af den landbrugsaftale, der er indgået i forbindelse med forhandlingerne under
    Uruguay-runden
  type: main
- language: el
  script: Grek
