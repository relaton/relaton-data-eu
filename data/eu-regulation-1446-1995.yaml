    inzake de landbouw
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1446/95 da Comissão, de 26 de Junho de 1995, que
    altera os Regulamentos (CE) nº 121/94 e (CE) nº 1606/94 no diz respeito à adaptação
    transitória de certas disposições relativas às importações na Comunidade
    de determinados produtos do sector cerealífero provenientes da República da
    Polónia, da República da Hungria, da República Checa, da República Eslovaca,
    da República da Bulgária e da Roménia, tendo em vista a execução do Acordo
    sobre a agricultura concluído no âmbito das negociações do «Uruguay Round»
  type: main
