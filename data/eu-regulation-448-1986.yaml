title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 448/86 of 24 February 1986 establishing, for
    the period from 3 March to 30 June 1986, certain measures for the conservation
    and management of fishery resources applicable to vessels flying the Japanese
    flag in waters falling under the sovereignty or jurisdiction of Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 448/86 du Conseil du 24 février 1986 fixant, pour
    la période du 3 mars au 30 juin 1986, certaines mesures de conservation et de
    gestion des ressources de pêche applicables aux navires battant pavillon japonais
    dans les eaux sous souveraineté ou sous juridiction du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 448/86 des Rates vom 24. Februar 1986 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter japanischer Flagge in den der Hoheitsgewalt oder der Gerichtsbarkeit
    Portugals unterstehenden Gewässern für die Zeit vom 3. März bis zum 30. Juni
    1986
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 448/86 af 24. februar 1986 om fastsættelse,
    for perioden 3. marts til 30. juni 1986, af visse foranstaltninger til bevarelse
    og forvaltning af fiskeressourcerne for fartøjer, der fører japansk flag, i
    farvandene under Portugals højhedsområde eller jurisdiktion
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 448/86 του Συμβουλίου
    της 24ης Φεβρουαρίου 1986 για τον καθορισμό, κατά
    το διάστημα από τις 3 Μαρτίου έως τις 30 Ιουνίου
    1986, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων, που εφαρμόζονται για
    τα σκάφη υπό ιαπωνική σημαία στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 448/86 del Consiglio del 24 febbraio 1986 che stabilisce
    per il periodo 3 marzo - 30 giugno 1986 talune misure di conservazione e di gestione
    delle risorse ittiche applicabili alle navi battenti bandiera giapponese nelle
    acque soggette alla sovranità o alla giurisdizione del Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 448/86 van de Raad van 24 februari 1986 tot vaststelling,
    voor het tijdvak van 3 maart tot en met 30 juni 1986, van bepaalde maatregelen
    voor de instandhouding en het beheer van de visbestanden welke gelden voor vaartuigen
    die de vlag van Japan voeren en vissen in de wateren die onder de soevereiniteit
    of de jurisdictie van Portugal vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 448/86 do Conselho de 24 de Fevereiro de 1986 que
    fixa para o período compreendido entre 3 de Março e 30 de Junho de 1986, determinadas
    medidas de conservação e de gestão dos recursos da pesca aplicáveis aos navios
    arvorando pavilhão japonês nas águas sob soberania ou jurisdição de Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 448/86 del Consejo de 24 de febrero de 1986 por el
    que se establecen para el período comprendido entre el 3 de marzo y el 30 de
    junio de 1986 determinadas medidas de conservación y de gestión de los recursos
    de la pesca, aplicables a los barcos que naveguen bajo pabellón japonés en las
    aguas sometidas a la soberanía o a la jurisdicción de Portugal
  type: main
