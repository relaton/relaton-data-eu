    κανονισμού (ΕΟΚ) αριθ. 641/86 σχετικά με τον καθορισμό
    των λεπτομερειών εφαρμογής του συμπληρωματικού
    μηχανισμού στις συναλλαγές για τα προϊόντα
    του τομέα μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά που αναφέρονται στο παράρτημα
    ΧΧΙΙ της πράξης προσχώρησης και εισάγονται
    στην Πορτογαλία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 3836/92, annettu 28 päivänä joulukuuta 1992,
    täydentävän kaupan järjestelmän soveltamista liittymisasiakirjan liitteessä
    XXII tarkoitettuihin ja Portugaliin tuotaviin hedelmä- ja vihannesjalostealan
    tuotteisiin koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY)
    N:o 641/86 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3836/92 della Commissione, del 28 dicembre 1992, recante
    modifica del regolamento (CEE) n. 641/86 che fissa le modalità di applicazione
    del meccanismo complementare applicabile agli scambi per i prodotti trasformati
    a base di ortofrutticoli importati in Portogallo che figurano nell' allegato XXII
    dell' atto di adesione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3836/92 van de Commissie van 28 december 1992 tot
    wijziging van Verordening (EEG) nr. 641/86 tot vaststelling van uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor de in bijlage XXII
    bij de Toetredingsakte genoemde produkten van de sector van op basis van groenten
    en fruit verwerkte produkten, die in Portugal worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3836/92 da Comissão, de 28 de Dezembro de 1992,
    que altera o Regulamento (CEE) n° 641/86, que determina as regras de execução
    do mecanismo complementar às trocas comerciais para o sector dos produtos transformados
    à base de frutas e de produtos hortícolas importados em Portugal, referidos
    no anexo XXII do Acto de Adesão
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3836/92 de la Comisión, de 28 de diciembre de 1992,
