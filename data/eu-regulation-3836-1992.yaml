    las modalidades de aplicación del mecanismo complementario de los intercambios
    para los productos del sector transformados a base de frutas y hortalizas importados
    de Portugal e incluidos en el Anexo XXII del Acta de adhesión
  type: main
- language: sv
  script: Latn
