  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 71/97, annettu 10 päivänä tammikuuta 1997,
    Kiinan kansantasavallasta peräisin olevien polkupyörien tuonnissa asetuksella
    (ETY) N:o 2474/93 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta
