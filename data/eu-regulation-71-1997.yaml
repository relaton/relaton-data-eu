title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 71/97 of 10 January 1997 extending the definitive
    anti-dumping duty imposed by Regulation (EEC) No 2474/93 on bicycles originating
    in the People's Republic of China to imports of certain bicycle parts from the
    People's Republic of China, and levying the extended duty on such imports registered
    under Regulation (EC) No 703/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 71/97 du Conseil du 10 janvier 1997 portant extension
    du droit antidumping définitif institué par le règlement (CEE) n° 2474/93
    sur les bicyclettes originaires de la République populaire de Chine aux importations
    de certaines parties de bicyclettes en provenance de la République populaire
    de Chine et portant prélèvement du droit étendu sur ces importations enregistrées
    conformément au règlement (CE) n 703/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 71/97 des Rates vom 10. Januar 1997 zur Ausweitung
    des mit der Verordnung (EWG) Nr. 2474/93 auf Fahrräder mit Ursprung in der Volksrepublik
    China eingeführten endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    Fahrradteile aus der Volksrepublik China und zur Erhebung des ausgeweiteten Zolls
    auf derartige gemäß der Verordnung (EG) Nr. 703/96 zollamtlich erfaßte Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 71/97 af 10. januar 1997 om udvidelse af den
    endelige antidumpingtold på importen af cykler med oprindelse i Den Kinesiske
    Folkerepublik, som indførtes ved Rådets forordning (EØF) nr. 2474/93, til også
    at omfatte visse dele til cykler fra Den Kinesiske Folkerepublik og om opkrævning
    af denne told på import registreret i henhold til forordning (EF) nr. 703/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 71/97 του Συμβουλίου
    της 10ης Ιανουαρίου 1997 για την επέκταση του
