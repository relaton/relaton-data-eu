title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2091/83 of 20 July 1983 determining the
    amounts of the variable components and additional duties applicable from 1 August
    to 31 October 1983 on the importation into the Community of goods covered by Regulation
    (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2091/83 de la Commission, du 20 juillet 1983, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er août au 31 octobre 1983 inclus à l'importation dans
    la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2091/83 der Kommission vom 20. Juli 1983 zur Festsetzung
    der Höhe der vom 1. August bis einschließlich 31. Oktober 1983 bei der Einfuhr
    der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2091/83 af 20. juli 1983 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. august til den 31. oktober 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2091/83 της Επιτροπής
    της 20ής Ιουλίου 1983 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών που εφαρμόζονται κατά τήν περίοδο από
    1ης Αυγούστου 1983 μέχρι και 31ης Οκτωβρίου 1983
    κατά την εισαγωγή στην Κοινότητα εμπορευμάτων
    που υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2091/83 della Commissione, del 20 luglio 1983, che
