    n. 7 (numero d'ordine 40.0070) originari della Malaysia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3897/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2668/90 VAN DE COMMISSIE van 17 september 1990 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten,
    van de categorie van produkten nr. 7 (volgnummer 40.0070), van oorsprong uit Maleisië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3897/89 van de Raad
  type: main
