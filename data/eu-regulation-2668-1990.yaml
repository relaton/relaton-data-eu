title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2668/90 of 17 September 1990 reintroducing
    the levying of the customs duties applicable to products of category 7 (order
    No 40.0070) originating in Malaysia, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 3897/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2668/90 de la Commission du 17 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie de produits n° 7 (numéro d'ordre 40.0070), originaires de Malaysia,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2668/90 DER KOMMISSION vom 17. September 1990 zur
    Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 7 (laufende
    Nummer 40.0070) mit Ursprung in Malaysia, dem die in der Verordnung (EWG) Nr.
    3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2668/90 af 17. september 1990 om genindførelse
    af opkrævning af toldafgifter for varer under varekategori 7 (løbenummer 40.0770),
    som har oprindelse i Malaysia og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3897/89
  type: main
- language: el
  script: Grek
