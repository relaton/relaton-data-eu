title:
- language: fr
  script: Latn
  content: Décision 65/230/CEE de la Commission, du 31 mars 1965, portant prorogation
    et nouvelle modification de sa décision du 6 novembre 1964, autorisant la perception
    d'une taxe compensatoire sur les importations, en République fédérale d'Allemagne,
    de pain et de produits similaires, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '65/230/EWG: Entscheidung der Kommission vom 31. März 1965 zur Verlängerung
    und erneuten Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung
    einer Ausgleichsabgabe auf Einfuhren von Brot und ähnlichen Erzeugnissen aus
    dem Königreich der Niederlande in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '65/230/CEE: Decisione della Commissione, del 31 marzo 1965, che proroga
    e modifica nuovamente la sua decisione del 6 novembre 1964, con cui si autorizza
    la riscossione di una tassa compensativa all''importazione nella Repubblica federale
    di Germania di pane e prodotti analoghi provenienti dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '65/230/EEG: Beschikking van de Commissie van 31 maart 1965 tot verlenging
    en nieuwe wijziging van haar beschikking van 6 november 1964 houdende machtiging
    tot het leggen van een compenserende heffing op de invoer in de Bondsrepubliek
    Duitsland van brood en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
