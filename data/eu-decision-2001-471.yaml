  script: Latn
  content: '2001/471/EC: Commission Decision of 8 June 2001 laying down rules for
    the regular checks on the general hygiene carried out by the operators in establishments
    according to Directive 64/433/EEC on health conditions for the production and
    marketing of fresh meat and Directive 71/118/EEC on health problems affecting
    the production and placing on the market of fresh poultry meat (Text with EEA
    relevance) (notified under document number C(2001) 1561)'
  type: main
- language: fr
  script: Latn
