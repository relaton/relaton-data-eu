title:
- language: en
  script: Latn
  content: '2009/298/EC: Commission Decision of 26 March 2009 prolonging the validity
    of Decision 2006/502/EC requiring Member States to take measures to ensure that
    only lighters which are child-resistant are placed on the market and to prohibit
    the placing on the market of novelty lighters (notified under document number
    C(2009) 2078)'
  type: main
- language: fr
  script: Latn
  content: '2009/298/CE: Décision de la Commission du 26 mars 2009 prorogeant la
    validité de la décision 2006/502/CE exigeant des États membres qu’ils prennent
    des mesures destinées à faire en sorte que seuls les briquets présentant des
    caractéristiques de sécurité enfants soient mis sur le marché et à interdire
    la mise sur le marché de briquets fantaisie [notifiée sous le numéro C(2009)
    2078]'
  type: main
- language: de
  script: Latn
  content: '2009/298/EG: Entscheidung der Kommission vom 26. März 2009 zur Verlängerung
    der Geltungsdauer der Entscheidung 2006/502/EG zur Verpflichtung der Mitgliedstaaten,
    Maßnahmen zu treffen, damit nur kindergesicherte Feuerzeuge in Verkehr gebracht
    werden und das Inverkehrbringen von Feuerzeugen mit Unterhaltungseffekten untersagt
    wird (Bekannt gegeben unter Aktenzeichen K(2009) 2078)'
  type: main
