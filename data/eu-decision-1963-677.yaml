title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 décembre 1963, autorisant la perception
    de taxes compensatoires à l'importation en République italienne, de dextrines
    et d'amidons et féculés solubles ou torréfiés, ainsi que de parements et apprêts
    préparés, à base de matières amylacées, en provenance de certains États
    membres
  type: main
- language: de
  script: Latn
  content: '63/677/EWG: Entscheidung der Kommission vom 4. Dezember 1963 über die
    Erhebung von Ausgleichsabgaben auf Einfuhren von Dextrin, löslicher oder gerösteter
    Stärke sowie von zubereiteten Zurichtemitteln und zubereiteten Appreturen auf
    der Grundlage von Stärke aus den verschiedenen Mitgliedstaaten in die Italienische
    Republik'
  type: main
- language: it
  script: Latn
  content: '63/677/CEE: Decisione della Commissione del 4 dicembre 1963 che autorizza
    la riscossione di tasse di compensazione all''importazione nella Repubblica italiana
    di destrine, amidi e fecole solubili o torrefatte e di bozzime e appretti preparati
    a base di sostanze amidacee in provenienza da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/677/EEG: Beschikking van de Commissie van 4 december 1963 houdende
    machtiging tot het leggen van een compenserende heffing op de invoer in de Italiaanse
    Republiek van dextrine, oplosbaar of geroost zetmeel en preparaten voor het appreteren
    op basis van zetmeel of van zetmeelderivaten uit bepaalde Lid-Staten'
  type: main
