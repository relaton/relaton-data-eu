  content: Commission Regulation (EEC) No 2515/81 of 28 August 1981 laying down detailed
    rules for the application of the additional measures applicable to holders of
    long-term storage contracts for table wine for the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2515/81 de la Commission, du 28 août 1981, établissant
    les modalités d' application des mesures complémentaires réservées aux détenteurs
    de contrats de stockage à long terme des vins de table pour la campagne 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2515/81 der Kommission vom 28. August 1981 zur Festlegung
    der Durchführungsbestimmungen für die Inhabern langfristiger Lagerverträge
    für Tafelweine vorbehaltenen ergänzenden Maßnahmen für das Wirtschaftsjahr
    1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2515/81 af 28. august 1981 om gennemførelsesbestemmelser
    for de supplerende foranstaltninger, der er forbeholdt indehaverne af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1980/81
  type: main
- language: el
  script: Grek
