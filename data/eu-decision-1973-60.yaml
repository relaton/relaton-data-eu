title:
- language: en
  script: Latn
  content: '73/60/EEC: Commission Decision declaring that the conditions governing
    the mobilization of common wheat for a national food and project are satisfied
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '73/60/CEE: Décision de la Commission du 26 février 1973 constatant que
    les conditions prévues pour la mobilisation de froment tendre destiné à une
    action nationale d''aide alimentaire sont remplies (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '73/60/EWG: Entscheidung der Kommission vom 26. Februar 1973 zur Feststellung,
    daß die Voraussetzungen für die Bereitstellung von Weichweizen für eine nationale
    Nahrungsmittelhilfsaktion erfüllt sind (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '73/60/EØF: Kommissionens beslutning af 26. februar 1973 om konstatering
    af, at betingelserne er opfyldt for tilvejebringelse af blød hvede til en national
    fødevarehjælpeaktion (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '73/60/CEE: Decisione della Commissione, del 26 febbraio 1973, che constata
    che le condizione previste per la mobilitazione di frumento tenero destinato ad
    un''azione nazionale per gli aiuti alimentari sono soddisfatte (Il testi in lingua
    francese e olandese sono il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '73/60/EEG: Beschikking van de Commissie van 26 februari 1973 houdende
    de constatering dar aan de voor het beschikbaar stellen van zachte tarwe voor
    een nationale actie voor voedselhulp gestelde voorwaarden is voldaan (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
