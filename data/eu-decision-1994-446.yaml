    produits à base d''os, de cornes et de produits à base de corne ainsi que d''onglons
    et de produits à base d''onglons, à l''exclusion des farines tirées de ces
    produits, non destinés à l''alimentation humaine ou animale, en vue de leur
    transformation'
  type: main
