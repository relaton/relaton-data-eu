title:
- language: en
  script: Latn
  content: '94/446/EC: Commission Decision of 14 June 1994 laying down the requirements
    for the importation from third countries of bones and bone products, horns and
    horn products and hooves and hoof products, excluding meals thereof, for further
    processing not intended for human or animal consumption'
  type: main
- language: fr
  script: Latn
  content: '94/446/CE: Décision de la Commission, du 14 juin 1994, définissant les
