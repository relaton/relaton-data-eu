title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3399/92 of 26 November 1992 fixing the definitive
    production aid for certain processed tomato products in respect of the 1992/93
    marketing year and derogating for that year from Regulations (EEC) No 1558/91
    and (EEC) No 722/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3399/92 de la Commission, du 26 novembre 1992, fixant
    l' aide définitive à la production pour certains produits transformés à base
    de tomates, pour la campagne 1992/1993, et dérogeant, pour cette campagne, aux
    règlements (CEE) n° 1558/91 et (CEE) n° 722/88
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3399/92 der Kommission vom 26. November 1992 zur Festsetzung
    der endgültigen Produktionsbeihilfe für bestimmte Verarbeitungserzeugnisse aus
    Tomaten sowie zur Abweichung von den Verordnungen (EWG) Nr. 1558/91 und (EWG)
    Nr. 722/88 für das Wirtschaftsjahr 1992/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3399/92 af 26. november 1992 om den
    endelige producentstøtte for visse produkter forarbejdet på basis af tomater
    for produktionsåret 1992/93 og om undtagelse for samme produktionsår fra forordning
    (EØF) nr. 1558/91 og (EØF) nr. 722/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3399/92 της Επιτροπής
    της 26ης Νοεμβρίου 1992 για τον καθορισμό της
    οριστικής ενίσχυσης στην παραγωγή για ορισμένα
    μεταποιημένα προϊόντα με βάση την τομάτα, για
    την περίοδο εμπορίας 1992/93, και για παρεκκλίσεις
    για την εν λόγω περίοδο εμπορίας, από τους κανονισμούς
    (ΕΟΚ) αριθ. 1558/91 και (ΕΟΚ) αριθ. 722/88
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3399/92 della Commissione, del 26 novembre 1992, che
    stabilisce l' aiuto definitivo alla produzione concesso ad alcuni prodotti trasformati
    a base di pomodori per la campagna 1992/1993 e deroga, per tale campagna, ai regolamenti
    (CEE) n. 1558/91 e (CEE) n. 722/88
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3399/92 van de Commissie van 26 november 1992 houdende
    vaststelling van de definitieve steun bij de produktie van bepaalde op basis van
    tomaten verwerkte produkten voor het verkoopseizoen 1992/1993 en houdende afwijking
    van de Verordeningen (EEG) nr. 1558/91 en (EEG) nr. 722/88 voor dit verkoopseizoen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3399/92 da Comissão, de 26 de Novembro de 1992,
    que fixa a ajuda definitiva à produção para determinados produtos transformados
    à base de tomate relativamente à campanha de 1992/1993 e que derroga, em relação
    a essa campanha, os Regulamentos (CEE) n° 1558/91 e (CEE) n° 722/88
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3399/92 de la Comisión, de 26 de noviembre de 1992,
