title:
- language: en
  script: Latn
  content: '2009/858/EC: Commission Decision of 27 November 2009 approving certain
    amended programmes for the eradication and monitoring of animal diseases and zoonoses
    for the year 2009 and amending Decision 2008/897/EC as regards the reallocation
    of the Community’s financial contribution to certain Member States for programmes
    approved by that Decision and by Decision 2009/560/EC (notified under document
    C(2009) 9193)'
  type: main
- language: fr
  script: Latn
  content: '2009/858/CE: Décision de la Commission du 27 novembre 2009 approuvant
    certains programmes modifiés d’éradication et de surveillance de maladies
    animales et zoonoses pour l’année 2009 et modifiant la décision 2008/897/CE
    afin de redistribuer entre certains États membres la participation financière
    de la Communauté aux programmes approuvés par ladite décision et par la décision
    2009/560/CE [notifiée sous le numéro C(2009) 9193]'
  type: main
