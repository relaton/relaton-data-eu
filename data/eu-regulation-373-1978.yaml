title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 373/78 of 23 February 1978 laying down certain
    detailed rules for the conduct of distillation operations in the wine sector and
    defining the event giving rise to payment of the amounts involved in these operations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 373/78 de la Commission, du 23 février 1978, portant
    certaines modalités d' application concernant les opérations de distillation
    dans le secteur viti-vinicole et définissant le fait générateur du paiement
    relatif aux montants concernant ces opérations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 373/78 der Kommission vom 23. Februar 1978 mit Durchführungsvorschriften
    für die Destillationsmaßnahmen im Sektor Wein und zur Festlegung des anspruchsbegründenden
    Tatbestands für die Zahlung der diese Maßnahmen betreffenden Beträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 373/78 af 23. februar 1978 om visse
    nærmere bestemmelser vedrørende destillation i vinsektoren og fastlæggelse
    af det forhold, der ligger til grund for stiftelsen af fordringen vedrørende
    beløbene i forbindelse med destillation
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 373/78 τής Επιτροπής
