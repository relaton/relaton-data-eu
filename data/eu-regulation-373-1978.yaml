    εφαρμογής πού αφορούν τίς εργασίες αποστάξεως
    στόν αμπελοοινικό τομέα καί περί καθορισμού
    τού γενεσιουργού αιτίου πληρωμής τών ποσών
    πού αφορούν στίς εργασίες αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 373/78 della Commissione, del 23 febbraio 1978, che
    fissa talune modalità d' applicazione concernenti le operazioni di distillazione
    nel settore vitivinicolo e definisce il fatto generatore del pagamento relativo
    agli importi concernenti queste operazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 373/78 van de Commissie van 23 februari 1978 houdende
    uitvoeringsbepalingen ten aanzien van de distillatie in de wijnsector en definitie
    van het feit waardoor het recht ontstaat op uitbetaling van de daarmee samenhangende
    bedragen
