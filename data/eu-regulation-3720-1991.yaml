- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3720/91 of 18 December 1991 opening compulsory
    distillation as provided for in Article 39 of Council Regulation (EEC) No 822/87
    and derogating for the 1991/92 wine year from certain detailed rules for the application
    thereof
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3720/91 DE LA COMMISSION du 18 décembre 1991 ouvrant
    la distillation obligatoire prévue à l'' article 39 du règlement (CEE) no 822/87
    du Conseil et dérogeant à certaines modalités d'' application y afférentes
    pour la campagne 1991/1992 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3720/91 DER KOMMISSION vom 18. Dezember 1991 zur
    Eröffnung der obligatorischen Destillation gemäß Artikel 39 der Verordnung
    (EWG) Nr. 822/87 des Rates und zur Abweichung von diesbezüglichen Durchführungsbestimmungen
    für das Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3720/91 af 18. december 1991 om iværksættelse
    af obligatorisk destillation som omhandlet i artikel 39 i Rådets forordning (EØF)
    nr. 822/87 og om undtagelse fra visse bestemmelser om destillationens gennemførelse
    for produktionsåret 1991/92
  type: main
- language: el
  script: Grek
