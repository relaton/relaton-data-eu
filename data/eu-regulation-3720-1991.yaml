    της 18ης Δεκεμβρίου 1991 για το άνοιγμα υποχρεωτικής
    αποστάξεως που προβλέπεται στο άρθρο 39 του
    κανονισμού ( ΕΟΚ ) αριθ. 822/87 του Συμβουλίου και
    για την παρέκκλιση ορισμένων σχετικών λεπτομερειών
    εφαρμογής για την περίοδο 1991/92
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3720/91 DELLA COMMISSIONE del 18 dicembre 1991 recante
    apertura della distillazione obbligatoria di cui all'' articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio e recante deroga ad alcune modalità di applicazione
    ad essa relative per la campagna 1991/1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3720/91 VAN DE COMMISSIE van 18 december 1991 tot
