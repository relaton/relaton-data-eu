    enthaltende Erzeugnisse für Einfuhren im ersten Vierteljahr 1966
  type: main
- language: it
  script: Latn
  content: Regolamento n. 169/65/CEE della Commissione, del 20 dicembre 1965, che
    adatta e fissa i prezzi limite applicabili ai suini, alle carni suine e ai prodotti
    a base di carni suine per le importazioni effettuate nel primo trimestre 1966
  type: main
