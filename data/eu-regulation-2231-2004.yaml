id: EURegulation22312004
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2231/2004 of 23 December 2004 terminating
    the investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 119/97 on imports of certain ring binder
    mechanisms originating in the People’s Republic of China by imports of certain
    ring binder mechanisms consigned from Thailand, whether declared as originating
    in Thailand or not, and terminating the registration of such imports imposed by
    Regulation (EC) No 844/2004
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2231/2004 de la Commission du 23 décembre 2004 clôturant
    l’enquête sur le contournement possible des mesures antidumping instituées
    par le règlement (CE) n° 119/97 du Conseil sur les importations de certains
    mécanismes pour reliure à anneaux originaires de la République populaire de
    Chine par des importations de certains mécanismes pour reliure à anneaux expédiés
    de Thaïlande, qu'ils aient ou non été déclarés originaires de ce pays, et
    mettant fin à l’enregistrement de ces importations imposé par le règlement
    (CE) n° 844/2004 de la Commission
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2231/2004 der Kommission vom 23. Dezember 2004 zur
    Einstellung der Untersuchung betreffend die mutmaßliche Umgehung der mit der
    Verordnung (EG) Nr. 119/97 des Rates eingeführten Antidumpingmaßnahmen gegenüber
    den Einfuhren bestimmter Ringbuchmechaniken mit Ursprung in der Volksrepublik
    China durch die Einfuhren bestimmter aus Thailand versandter Ringbuchmechaniken,
    ob als Ursprungserzeugnis Thailands angemeldet oder nicht, und zur Einstellung
    der mit der Verordnung (EG) Nr. 844/2004 eingeführten zollamtlichen Erfassung
    der letztgenannten Einfuhren
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2231/2004 ze dne 23. prosince 2004 o ukončení
    šetření o údajném obcházení antidumpingových opatření uložených nařízením
    Rady (ES) č. 119/97 na dovoz některých mechanismů kroužkových pořadačů
    pocházejících z Čínské lidové republiky dovozem některých mechanismů
    kroužkových pořadačů zasílaných z Thajska, ať již jsou deklarované jako
    pocházející z Thajska či nikoli, a o ukončení celní evidence těchto dovozů
    uložené nařízením (ES) č. 844/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2231/2004 af 23. december 2004 om afslutning
    af undersøgelsen vedrørende den mulige omgåelse af de antidumpingforanstaltninger,
    der indførtes ved Rådets forordning (EF) nr. 119/97 på importen af visse ringmekanismer
    med oprindelse i Folkerepublikken Kina, ved import af visse ringmekanismer afsendt
    fra Thailand, uanset om de er angivet med oprindelse i Thailand eller ej, og om
    afslutning af den registrering af denne import, der iværksattes ved forordning
    (EF) nr. 844/2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2231/2004 της Επιτροπής,
    της 23ης Δεκεμβρίου 2004, για τον τερματισμό της
    έρευνας όσον αφορά την πιθανή καταστρατήγηση
    των μέτρων αντιντάμπινγκ που επιβλήθηκαν με
    τον κανονισμό (ΕΚ) αριθ. 119/97 του Συμβουλίου
    στις εισαγωγές ορισμένων μηχανισμών με δακτυλίους
    για το δέσιμο φύλλων, καταγωγής Λαϊκής Δημοκρατίας
    της Κίνας, από εισαγωγές ορισμένων μηχανισμών
    με δακτυλίους για το δέσιμο φύλλων που αποστέλλονται
    από την Ταϊλάνδη, είτε δηλώνονται ως καταγωγής
    Ταϊλάνδης είτε όχι, και για τερματισμό της
    καταγραφής των εν λόγω εισαγωγών η οποία επεβλήθη
    με τον κανονισμό (ΕΚ) αριθ. 844/2004
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2231/2004, 23. detsember 2004, millega lõpetatakse
    uurimine seoses väidetava kõrvalehoidmisega teatavate Hiina Rahvavabariigist
    pärinevate spiraalköiteseadiste impordi suhtes nõukogu määrusega (EÜ) nr
    119/97 kehtestatud dumpinguvastastest meetmetest teatavate Taist saadetud spiraalköiteseadiste
    impordi kaudu, mille puhul tooted on deklareeritud Taist pärinevana või mitte,
    ning lõpetatakse kõnealuse impordi registreerimine, mis kehtestati määrusega
    (EÜ) nr 844/2004
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2231/2004, annettu 23 päivänä joulukuuta 2004,
    tiettyjen Kiinan kansantasavallasta peräisin olevien rengaskirjamekanismien tuonnissa
    neuvoston asetuksella (EY) N:o 119/97 käyttöön otettujen polkumyyntitoimenpiteiden
    mahdollista kiertämistä tiettyjen rengaskirjamekanismien tuonnilla Thaimaasta,
    riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu Thaimaa, koskevan tutkimuksen
    päättämisestä ja kyseisen tuonnin asetuksen (EY) N:o 844/2004 mukaisesti tapahtuvan
    kirjaamisen lopettamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2231/2004/EK határozata (2004. december 23.) a Kínai Népköztársaságból
    származó egyes gyűrűsfűzős irattartók behozatalára vonatkozó végleges
    dömpingellenes vámok kivetéséről, valamint a kivetett ideiglenes vámok végleges
    beszedéséről szóló 119/97/EK tanácsi rendelet egyes gyűrűsfűzős irattartók
    thaiföldiként vagy nem thaiföldiként bejelentett szállítmányai Thaiföldön
    keresztül történő behozatala általi esetleges kijátszására vonatkozó
    vizsgálat lezárásáról és a 844/2004/EK rendelet által az ilyen behozatalra
    előírt nyilvántartásba vételi kötelezettség eltörléséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2231/2004 della Commissione, del 23 dicembre 2004,
    che chiude l'inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento (CE) n. 119/97 del Consiglio sulle importazioni di alcuni
    tipi di meccanismi per la legatura di fogli originari della Repubblica popolare
    cinese mediante importazioni di alcuni tipi di meccanismi per la legatura di fogli
    spediti dalla Thailandia, indipendentemente dal fatto che siano dichiarati o meno
    originari della Thailandia, e che chiude la registrazione di tali importazioni,
    istituita con il regolamento (CE) n. 844/2004
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2231/2004 (2004. gada 23. decembris), ar ko pārtrauc
    izmeklēšanu saistībā ar to antidempinga pasākumu iespējamo apiešanu, kas
    ar Padomes Regulu (EK) Nr. 119/97 noteikti dažu Ķīnas Tautas Republikas izcelsmes
    gredzenveida stiprinājuma mehānismu importam, ko veic, nosūtot tos no Taizemes
    un deklarējot vai nedeklarējot kā Taizemes izcelsmes ražojumus, un pārtrauc
    šāda importa reģistrāciju, kas noteikta ar Regulu (EK) Nr. 844/2004
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 23 d. Komisijos reglamentas (EB) Nr. 2231/2004, nutraukiantis
    tyrimą dėl tam tikrų Tarybos reglamentu (EB) Nr. 119/97 Kinijos Liaudies Respublikos
    kilmės žiedinių susegimo mechanizmų importui įvestų antidempingo priemonių
    galimo vengimo, įvežant iš Tailando tam tikrus žiedinius susegimo mechanizmus,
    deklaruojamus arba nedeklaruojamus kaip Tailando kilmės, ir nutraukiantis tokio
    importo registravimą, numatytą Komisijos reglamentu (EB) Nr. 844/2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2231/2004 van de Commissie van 23 december 2004 tot
    beëindiging van het bij Verordening (EG) nr. 844/2004 ingeleide onderzoek naar
    de mogelijke ontduiking van antidumpingrechten die bij Verordening (EG) nr. 119/97
    van de Raad zijn ingesteld op ringbandmechanismen uit de Volksrepubliek China
    door verzending van ringbandmechanismen vanuit Thailand, bij invoer al dan niet
    aangegeven als van oorsprong uit Thailand, en tot beëindiging van de registratie
    van die invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2231/2004 z dnia 23 grudnia 2004 r. kończące
    dochodzenie dotyczące możliwego obejścia środków antydumpingowych nałożonych
    na mocy rozporządzenia Rady (WE) nr 119/97 w sprawie przywozu niektórych mechanizmów
    kołowych do segregatorów pochodzących z Chińskiej Republiki Ludowej przez
    przywóz niektórych mechanizmów kołowych do segregatorów wysyłanych z Tajlandii,
    zgłoszonych lub niezgłoszonych jako pochodzące z Tajlandii oraz kończące
    rejestrację takich przywozów, nałożoną rozporządzeniem Komisji (WE) nr 844/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2231/2004 da Comissão, de 23 de Dezembro de 2004,
    que encerra o inquérito sobre a eventual evasão das medidas anti-dumping instituídas
    pelo Regulamento (CE) n.° 119/97 do Conselho sobre as importações de determinados
    mecanismos de argolas para encadernação originários da República Popular da
    China por importações de determinados mecanismos de argolas para encadernação
    expedidos da Tailândia, quer sejam ou não declarados originários da Tailândia,
    e que põe termo ao registo destas importações previsto no Regulamento (CE)
    n.° 844/2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2231/2004 z 23. decembra 2004, ktorým sa ukončuje
    vyšetrovanie týkajúce sa možného obchádzania antidumpingových opatrení,
    uložených nariadením Rady (ES) č. 119/97 o dovoze určitých mechanizmov na
    krúžkové bloky s pôvodom v Čínskej ľudovej republike prostredníctvom dovozu
    určitých mechanizmov na krúžkové bloky zaslaných z Thajska, tiež deklarovaných
    s pôvodom v Thajsku, a ktorým sa ukončuje registrácia tohto dovozu, uložená
    nariadením (ES) č. 844/2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2231/2004 z dne 23. decembra 2004 o zaključku
    preiskave glede možnega izogibanja protidampinškim ukrepom, ki jih uvaja Uredba
    Sveta (ES) št. 119/97 o uvozu določenih obročnih mehanizmov za vezavo s poreklom
    iz Ljudske republike Kitajske, pri uvozu določenih obročnih mehanizmov za vezavo,
    poslanih iz Tajske, ne glede na to ali ima prijavljeno poreklo iz Tajske ali ne,
    in o zaključku prijave za takšen uvoz, kot ga uvaja Uredba Sveta (ES) št. 844/2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2231/2004 de la Comisión, de 23 de diciembre de 2004,
    por el que se da por concluida la investigación referente a la supuesta elusión
    de las medidas antidumping impuestas por el Reglamento (CE) n° 119/97 del Consejo
    sobre las importaciones de determinados mecanismos para encuadernación con anillos
    originarios de la República Popular China mediante importaciones de determinados
    mecanismos para encuadernación con anillos procedentes de Tailandia, hayan sido
    o no declaradas originarias de Tailandia, y se pone fin al registro a que estaban
    sometidas dichas importaciones en virtud del Reglamento (CE) n° 844/2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2231/2004 av den 23 december 2004 om
    avslutande av undersökningen rörande eventuellt kringgående av de antidumpningsåtgärder
    som genom rådets förordning (EG) nr 119/97 införts beträffande import av vissa
    ringpärmsmekanismer med ursprung i Folkrepubliken Kina, genom import av vissa
    ringpärmsmekanismer som avsänts från Konungariket Thailand, oavsett om produktens
    deklarerade ursprung är Konungariket Thailand, och om avslutande av registrering
    av sådan import enligt förordning (EG) nr 844/2004
