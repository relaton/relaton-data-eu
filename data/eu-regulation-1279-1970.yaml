title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1279/70 de la Commission, du 30 juin 1970, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    le troisième trimestre de l'année 1970, à l'importation dans la Communauté
    des marchandises relevant du règlement (CEE) n 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1279/70 der Kommission vom 30. Juni 1970 zur Festsetzung
    der Höhe der im dritten Vierteljahr 1970 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft anwendbaren beweglichen
    Teilbeträge und Zusatzzölle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1279/70 della Commissione, del 30 giugno 1970, che
    determina gli importi degli elementi mobili e i dazi addizionali applicabili durante
    il terzo trimestre 1970 all'importazione nella Comunità delle merci cui si applica
    il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1279/70 van de Commissie van 30 juni 1970 tot vaststelling
