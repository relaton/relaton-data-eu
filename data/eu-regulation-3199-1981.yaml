    mit einem Gehalt an Kohlenstoff von 4 Gewichtshundertteilen oder mehr der Tarifstelle
    ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3199/81 af 9. november 1981 om forhøjelse
