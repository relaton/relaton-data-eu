  content: Commission Regulation (EEC) No 1065/89 of 25 April 1989 amending Regulation
    (EEC) No 2989/88 increasing to 1 300 000 tonnes the quantity of durum wheat held
    by the Italian intervention agency for which a standing invitation to tender for
    export has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1065/89 de la Commission, du 25 avril 1989, modifiant
