    pour l'exportation de blé dur détenu par l'organisme d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1065/89 der Kommission vom 25. April 1989 zur Änderung
    der Verordnung (EWG) Nr. 2989/88 und zur Erhöhung der Dauerausschreibung zur
    Ausfuhr von im Besitz der italienischen Interventionsstelle befindlichem Hartweizen
    auf 1 300 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1065/89 af 25. april 1989 om ændring
