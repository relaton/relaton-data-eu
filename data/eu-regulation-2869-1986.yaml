title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2869/86 of 16 September 1986 re-establishing
    the levying of customs duties on synthetic textile fibres (discontinuous or waste),
    carded or combed, products of category 55 (code 40.0550), originating in Mexico,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2869/86 de la Commission du 16 septembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux fibres textiles
    synthétiques discontinues cardées ou peignées de la catégorie de produits
    n° 55 (code 40.0550), originaires du Mexique, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2869/86 der Kommission vom 16. September 1986 über
    die Wiedereinführung des Zollsatzes für synthetische und künstliche Spinnfasern,
    gekrempelt oder gekämmt, der Warenkategorie Nr. 55 (Kennziffer 40.0550) mit Ursprung
    in Mexiko, denen die in der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2869/86 af 16. september 1986 om genindførelse
