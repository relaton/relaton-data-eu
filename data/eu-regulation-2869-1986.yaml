    originarie del Messico beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2869/86 van de Commissie van 16 september 1986 houdende
