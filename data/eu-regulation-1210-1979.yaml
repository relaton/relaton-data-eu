title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1210/79 of 19 June 1979 extending the period
    of validity of Regulation (EEC) No 1267/69 laying down special provisions applicable
    to the importation into the Community from Greece of goods covered by Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1210/79 du Conseil, du 19 juin 1979, prorogeant la
    durée de validité du règlement (CEE) n° 1267/69 fixant les dispositions particulières
    applicables lors de l' importation dans la Communauté, en provenance de Grèce,
    des marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1210/79 des Rates vom 19. Juni 1979 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 1267/69 zur Festlegung der Sonderbestimmungen,
    die bei der Einfuhr von unter die Verordnung (EWG) Nr. 1059/69 fallenden Waren
    aus Griechenland in die Gemeinschaft anwendbar sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1210/79 af 19. juni 1979 om forlængelse
    af gyldigheden for forordning (EØF) nr. 1267/69 om fastsættelse af særlige
    bestemmelser for indførsel i Fællesskabet af varer fra Grækenland, som henhører
    under forordning (EØF) nr. 1059/69
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1210/79 del Consiglio, del 19 giugno 1979, che proroga
    la durata di validità del regolamento (CEE) n. 1267/69 che fissa le disposizioni
    particolari applicabili all' importazione nella Comunità di merci soggette al
    regolamento (CEE) n. 1059/69, provenienti dalla Grecia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1210/79 van de Raad van 19 juni 1979 tot verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 1267/69 houdende vaststelling
    van de speciale voorschriften die van toepassing zijn bij de invoer in de Gemeenschap
    uit Griekenland van onder Verordening (EEG) nr. 1059/69 vallende goederen
  type: main
