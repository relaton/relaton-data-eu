title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2234/83 of 3 August 1983 re-establishing
    the levying of customs duties on polystyrene and its copolymers of styrene, falling
    within subheading 39.02 C VI and originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2234/83 de la Commission du 3 août 1983 portant rétablissement
    de la perception des droits de douane applicables au polystyrène et ses copolymètres,
    de la sous-position 39.02 C VI du tarif douanier commun, originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2234/83 der Kommission vom 3. August 1983 zur Wiedereinführung
    der Erhebung der Zölle für Polystyrol und seine Mischpolymerisate der Tarifstelle
    39.02 C VI, mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3377/82
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2234/83 af 3. august 1983 om genindførelse
    af opkrævning af told for polystyren og copolymerisationsprodukter deraf, henhørende
    under pos. 39.02 C VI og med oprindelse i Brasilien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2234/83 της Επιτροπής
    της 3ης Αυγούστου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για την πολυστυρόλη και
    τα συμπολυμερή της τής διακρίσεως 39.02 Γ VI του
    Κοινού Δασμολογίου, καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3377/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2234/83 della Commissione del 3 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili al polistirolo e ai suoi copolimeri,
    della sottovoce 39.02 C VI della tariffa doganale comune, originari del Brasile,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2234/83 van de Commissie van 3 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op polystyreen
    en copolymeren daarvan van post 39.02 C VI, van oorsprong uit Brazilië, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
