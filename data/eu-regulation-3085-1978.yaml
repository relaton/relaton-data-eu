  content: Council Regulation (Euratom, ECSC, EEC) No 3085/78 of 21 December 1978
    amending, with particular reference to the monetary parities to be used, Regulation
    (EEC, Euratom, ECSC) No 259/68 laying down the Staff Regulations of officials
    of the European Communities and the conditions of employment of other servants
    of these Communities, Regulation (Euratom, ECSC, EEC) No 2530/72 and Regulation
    (ECSC, EEC, Euratom) No 1543/73 concerning certain special measures
  type: main
- language: fr
  script: Latn
  content: Règlement (Euratom, CECA, CEE) n° 3085/78 du Conseil, du 21 décembre
    1978, modifiant, notamment en ce qui concerne les parités monétaires à utiliser,
    le règlement (CEE, Euratom, CECA) n° 259/68 fixant le statut des fonctionnaires
    des Communautés européennes ainsi que le régime applicable aux autres agents
    de ces Communautés, et le règlement (Euratom, CECA, CEE) n° 2530/72 ainsi que
    le règlement (CECA, CEE, Euratom) n° 1543/73 relatifs à certaines mesures particulières
  type: main
