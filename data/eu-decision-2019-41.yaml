title:
- language: en
  script: Latn
  content: Council Decision (EU) 2019/41 of 3 December 2018 on the position to be
    taken, on behalf of the European Union, within the Association Committee established
    by the Euro-Mediterranean Agreement establishing an Association between the European
    Communities and their Member States, of the one part, and the Hashemite Kingdom
    of Jordan, of the other part, as regards an amendment to Protocol 3 to that Agreement
    concerning the definition of the concept of ‘originating products’ and methods
    of administrative cooperation
  type: main
- language: fr
  script: Latn
