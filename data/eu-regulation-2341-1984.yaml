title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2341/84 of 10 August 1984 re-establishing
    the levying of customs duties on camphor, natural refined and synthetic, falling
    within subheading 29.13 B I b) and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2341/84 de la Commission du 10 août 1984 portant rétablissement
    de la perception des droits de douane applicables au camphre naturel raffiné
    et synthétique, de la sous-position 29.13 B I b) du tarif douanier commun, originaire
    de la Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2341/84 der Kommission vom 10. August 1984 zur Wiedereinführung
    der Erhebung der Zölle für Kampfer, natürlich, raffiniert sowie synthetisch,
    der Tarifstelle 29.13 B I b) mit Ursprung in China, dem die in der Verordnung
    (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2341/84 af 10. august 1984 om genindførelse
    af opkrævning af told for campher, raffineret naturlig og syntetisk, henhørende
    under pos. 29.13 B I b) og med oprindelse i Kina, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2341/84 της Επιτροπής
    της 10ης Αυγούστου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για την καφουρά φυσική
    κεκαθαρμένη και συνθετική, της διακρίσεως
    29.13 Β Ι β) του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    ποσοστώσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2341/84 della Commissione del 10 agosto 1984 che ripristina
    la riscossione dei dazi doganali applicabili alla canfora, naturale raffinata
    e sintetica, della sottovoce 29.13 B I b) della tariffa doganale comune, originaria
    della Cina beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2341/84 van de Commissie van 10 augustus 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kamfer, natuurlijke,
    andere dan ruwe, alsmede synthetische, van postonderverdeling 29.13 B I b), van
    oorsprong uit China, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
