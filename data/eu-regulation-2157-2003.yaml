title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2157/2003 of 10 December 2003 amending for
    the 26th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2157/2003 de la Commission du 10 décembre 2003 modifiant
    pour la vingt-sixième fois le règlement (CE) n° 881/2002 du Conseil instituant
    certaines mesures restrictives spécifiques à l'encontre de certaines personnes
    et entités liées à Oussama ben Laden, au réseau Al-Qaida et aux Taliban, et
    abrogeant le règlement (CE) n° 467/2001 du Conseil
  type: main
- language: de
  script: Latn
