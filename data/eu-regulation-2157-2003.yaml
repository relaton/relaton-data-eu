    szóló 881/2002/EK tanácsi rendelet huszonhatodik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2157/2003 della Commissione, del 10 dicembre 2003,
    recante ventiseiesima modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
