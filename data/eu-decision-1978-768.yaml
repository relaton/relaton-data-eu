id: EUDecision1978768
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 September 1978 authorizing the French Republic
    not to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 of the Common Customs
    Tariff (NIMEXE codes 60.02-40; 50; 60; 70; 80), originating in Hong Kong and in
    free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/768/CEE: Décision de la Commission, du 8 septembre 1978, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, de la position 60.02 du Tarif douanier
    commun (codes Nimexe : 60.02-40, 50, 60, 70, 80), originaire de Hong-Kong et mise
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. September 1978, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.02-40; 50; 60; 70; 80) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 8. september 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, som henhører under pos. 60.02 i den
    fælles toldtarif (NIMEXE-kode 60.02-40, 50, 60, 70, 80), har oprindelse i Hongkong
    og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, dell''8 settembre 1978, che autorizza la
    Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, della voce 60.02 della tariffa doganale comune (codice
    Nimexe: 60.02-40, 50, 60, 70, 80), originari di Hong Kong e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 september 1978 waarbij de Franse Republiek
    wordt gemachtigd handschoenen, wanten en dergelijke artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van post 60.02 van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.02-40, 50, 60, 70, 80), van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
