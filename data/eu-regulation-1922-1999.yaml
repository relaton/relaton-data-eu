title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1922/1999 of 8 September 1999 laying down
    detailed rules for the application of Council Regulation (EC) No 850/98 as regards
    conditions under which vessels exceeding eight metres length overall shall be
    permitted to use beam trawls within certain waters of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1922/1999 de la Commission, du 8 septembre 1999, arrêtant
    les modalités d'application du règlement (CE) nº 850/98 du Conseil, en ce qui
    concerne les conditions auxquelles les bateaux dont la longueur hors tout dépasse
    huit mètres peuvent être autorisés à utiliser des chaluts à perche dans certaines
    eaux de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1922/1999 der Kommission vom 8. September 1999 mit
    Durchführungsbestimmungen zu der Verordnung (EG) Nr. 850/98 des Rates betreffend
    die Bedingungen, unter denen Schiffe mit einer Länge über alles von mehr als
    8 m in bestimmten Gemeinschaftsgewässern Baumkurren verwenden dürfen
  type: main
- language: bg
  script: Cyrl
