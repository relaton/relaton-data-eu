title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 699/85 of 18 March 1985 re-establishing
    the levying of customs duties on certain cotton yarn not put up for retail sale,
    products of category 1 a) (code 40.0014), originating in Thailand, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3563/84
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 699/85 de la Commission du 18 mars 1985 portant rétablissement
    de la perception des droits de douane applicables à certains fils de coton non
    conditionnés pour la vente au détail, de la catégorie de produits no 1 a) (code
    40.0014), originaires de Thaïlande, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 699/85 der Kommission vom 18. März 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf der Warenkategorie Nr. 1 a) (Kennziffer 40.0014), mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3563/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 699/85 af 18. marts 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte garn af bomuld, ikke i detailsalgsoplægninger,
    under varekategori nr. 1 a) (kode 40.0014), som har oprindelse i Thailand og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 699/85 της Επιτροπής
    της 18ης Μαρτίου 1985 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για νήματα εκ
    βάμβακος μη συσκευασμένα για τη λιανική πώληση,
    της κατηγορίας προϊόντων 1 α) (κωδικός 40.0014)
    καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 699/85 della Commissione del 18 marzo 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni filati di cotone non preparati
    per la vendita al minuto, della categoria di prodotti n. 1 a) (codice 40.0014),
    originari della Tailandia beneficiaria delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 699/85 van de Commissie van 18 maart 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    garens van katoen, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 1 a) (codenummer 40.0014), van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3563/84
    van de Raad
