id: EUDecision1976669
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 June 1976 authorizing the Italian Republic not
    to apply Community treatment to used straddle carriers, falling within heading
    No ex 87.07 of the Common Customs Tariff, originating in the United States and
    Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/669/CEE: Décision de la Commission, du 21 juin 1976, autorisant la
    République italienne à exclure du traitement communautaire les chariots-cavaliers
    usagés, de la position Ex 87.07 du Tarif douanier commun, originaires des États-Unis
    et du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Juni 1976, mit der die Italienische
    Republik ermächtigt wird, aus den Vereinigten Staaten und aus Japan stammende
    und in den anderen Mitgliedstaaten im freien Verkehr befindliche gebrauchte Portalkraftkarren
    der Tarifnummer ex 87.07 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. juni 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage brugte portaltrucks, som henhører
    under pos. ex 87.07 i den fælles toldtarif, har oprindelse i De forenede Stater
    eller Japan og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 giugno 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i carrelli elevatori usati della
    voce ex 87.07 della tariffa doganale comune, originari degli Stati Uniti e del
    Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 juni 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd gebruikte portaalwagens, van post ex 87.07 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Verenigde Staten en Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
