    Директиви 86/362/ЕИО, 86/363/ЕИО и 90/642/ЕИО на Съвета
    относно определянето на максимални количества
    на остатъци от пестициди във и върху зърнените
    култури, храните от животински произход и някои
    продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/42/ES ze dne 22. června 2000, kterou se mění přílohy
    směrnic Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálních limitů
    reziduí pesticidů v obilovinách, v potravinách živočišného původu a v
    některých produktech rostlinného původu, včetně ovoce a zeleniny, a na jejich
    povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/42/EF af 22. juni 2000 om ændring af bilagene
    til Rådets direktiv 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for indholdet af pesticidrester i og på korn, i og
    på levnedsmidler af animalsk oprindelse og på og i visse produkter af vegetabilsk
    oprindelse, herunder frugt og grøntsager
  type: main
