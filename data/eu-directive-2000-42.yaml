    ta’ livelli massimi għar-residwi tal-pestiċidi fuq jew fiċ-ċereali, oġġetti
    ta’ l-ikel li ġejjin mill-annimali u ċerti prodotti li ġejjin mill-pjanti,
    inkluż il-frott u l-ħxejjex rispettivament.Test b’relevanza ŻEE
  type: main
