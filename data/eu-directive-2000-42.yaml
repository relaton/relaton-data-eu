  content: Smernica Komisie 2000/42/ES z 22. júna 2000, ktorá mení a dopĺňa prílohy
    k smerniciam Rady 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálnych
    hladín pre rezíduá pesticídov v a na obilninách, potravinách živočíšneho
