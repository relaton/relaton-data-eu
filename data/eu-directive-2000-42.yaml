title:
- language: en
  script: Latn
  content: Commission Directive 2000/42/EC of 22 June 2000 amending the Annexes to
    Council Directives 86/362/EEC, 86/363/EEC and 90/642/EEC on the fixing of maximum
    levels for pesticide residues in and on cereals, foodstuffs of animal origin and
    certain products of plant origin, including fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/42/CE de la Commission du 22 juin 2000 modifiant les annexes
    des directives 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil concernant la fixation
    de teneurs maximales pour les résidus de pesticides respectivement sur et dans
    les céréales, les denrées alimentaires d'origine animale et certains produits
    d'origine végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/42/EG der Kommission vom 22. Juni 2000 zur Änderung der
    Anhänge der Richtlinien 86/362/EWG, 86/363/EWG und 90/642/EWG des Rates über
    die Festsetzung von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln
    auf und in Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
