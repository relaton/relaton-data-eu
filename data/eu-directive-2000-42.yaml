    peräisin olevissa elintarvikkeissa ja niiden pinnassa olevien torjunta-ainejäämien
    enimmäismäärien vahvistamisesta annetun neuvoston direktiivin 86/363/ETY ja
    torjunta-ainejäämien enimmäismäärien vahvistamisesta tietyille kasvikunnasta
    peräisin oleville tuotteille, mukaan lukien hedelmät ja vihannekset, annetun
    neuvoston direktiivin 90/642/ETY liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/42/EK irányelve (2000. június 22.) a gabonafélékben,
    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található peszticid-szermaradványok megengedett legmagasabb mértékének meghatározásáról
    szóló 86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv mellékleteinek
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/42/CE della Commissione, del 22 giugno 2000, recante modifica
    degli allegati delle direttive 86/362/CEE, 86/363/CEE e 90/642/CEE del Consiglio,
    che fissano le quantità massime di residui di antiparassitari rispettivamente
    sui e nei cereali, sui e nei prodotti alimentari di origine animale e su e in
    alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/42/EK (2000. gada 22. jūnijs), ar ko groza pielikumus
    Padomes Direktīvām 86/362/EEK, 86/363/EEK un 90/642/EEK par pesticīdu atliekvielu
    maksimāli pieļaujamo daudzumu noteikšanu attiecīgi labībā un uz tās, dzīvnieku
    izcelsmes pārtikas produktos un uz tiem, un dažos augu izcelsmes produktos,
    tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. birželio 22 d. Komisijos direktyva 2000/42/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl didžiausių pesticidų
    likučių koncentracijų atitinkamai grūduose, gyvūninės kilmės maisto produktuose
    ir tam tikruose augalinės kilmės produktuose, įskaitant vaisius ir daržoves,
    bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2000/42/KE tat-22 ta’ Ġunju li temenda
