    Raad tot vaststelling van maximumgehalten aan residuen van bestrijdingsmiddelen
    in en op respectievelijk granen, levensmiddelen van dierlijke oorsprong en bepaalde
    producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/42/WE z dnia 22 czerwca 2000 r. zmieniająca załączniki
    do dyrektyw Rady 86/362/EWG, 86/363/EWG oraz 90/642/EWG w sprawie ustalania najwyższych
    dopuszczalnych poziomów pozostałości pestycydów w zbożach, środkach spożywczych
    pochodzenia zwierzęcego i niektórych produktach pochodzenia roślinnego, w tym
    odpowiednio owocach i warzywach oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/42/CE da Comissão, de 22 de Junho de 2000, que altera os
