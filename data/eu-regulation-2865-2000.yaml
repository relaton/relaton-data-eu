    und Eier betreffenden Durchführungsbestimmungen zu den Verordnungen (EG) Nr.
    3066/95, (EG) Nr. 1727/2000, (EG) Nr. 2290/2000, (EG) Nr. 2433/2000, (EG) Nr.
    2434/2000 und (EG) Nr. 2435/2000 des Rates und zur Aufhebung der Verordnungen
    (EWG) Nr. 2699/93 und (EG) Nr. 1559/94
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2865/2000 af 27. december 2000 om ændring
