    1559/94
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2865/2000 da Comissão, de 27 de Dezembro de 2000,
    que altera o Regulamento (CE) n.o 1899/97, que estabelece as regras de execução,
    nos sectores da carne de aves de capoeira e dos ovos, do regime previsto pelos
    Regulamentos (CE) n.o 3066/95, (CE) n.o 1727/2000, (CE) n.o 2290/2000, (CE) n.o
    2433/2000, (CE) n.o 2434/2000 e (CE) n.o 2435/2000 do Conselho e que revoga os
    Regulamentos (CEE) n.o 2699/93 e (CE) n.o 1559/94
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2865/2000 de la Comisión, de 27 de diciembre de 2000,
    que modifica el Reglamento (CE) nº 1899/97 por el que se establecen las disposiciones
    de aplicación del régimen establecido por los Reglamentos (CE) nos 3066/95,
    1727/2000, 2290/2000, 2433/2000, 2434/2000 y 2435/2000 del Consejo, en los sectores
