    æg- og fjerkrækødssektoren af den ordning, der er fastsat i Rådets forordning
    (EF) nr. 3066/95, (EF) nr. 1727/2000, (EF) nr. 2290/2000, (EF) nr. 2433/2000,
    (EF) nr. 2434/2000 og (EF) nr. 2435/2000, og om ophævelse af forordning (EØF)
    nr. 2699/93 og (EF) nr. 1559/94
  type: main
- language: el
  script: Grek
