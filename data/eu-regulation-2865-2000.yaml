title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2865/2000 of 27 December 2000 amending Regulation
    (EC) No 1899/97 setting rules of application in the poultrymeat and egg sectors
    for the arrangements covered by Council Regulation (EC) No 3066/95, (EC) No 1727/2000,
    (EC) No 2290/2000, (EC) No 2433/2000, (EC) No 2434/2000 and (EC) No 2435/2000
    and repealing Regulations (EEC) No 2699/93 and (EC) No 1559/94
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2865/2000 de la Commission du 27 décembre 2000 modifiant
    le règlement (CE) nº 1899/97 établissant les modalités d'application dans
    les secteurs de la viande de volaille et des oeufs du régime prévu par les règlements
    (CE) nº 3066/95, (CE) nº 1727/2000, (CE) nº 2290/2000, (CE) nº 2433/2000,
    (CE) nº 2434/2000 et (CE) nº 2435/2000 du Conseil et abrogeant les règlements
    (CEE) nº 2699/93 et (CE) nº 1559/94
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2865/2000 der Kommission vom 27. Dezember 2000 zur
