id: EURegulation8012013
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 801/2013 of 22 August 2013 amending Regulation
    (EC) No 1275/2008 with regard to ecodesign requirements for standby, off mode
    electric power consumption of electrical and electronic household and office equipment,
    and amending Regulation (EC) No 642/2009 with regard to ecodesign requirements
    for televisions
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 801/2013 de la Commission du 22 août 2013 modifiant
    le règlement (CE) n ° 1275/2008 en ce qui concerne les exigences d’écoconception
    relatives à la consommation d’électricité en mode veille et en mode arrêt
    des équipements ménagers et de bureau électriques et électroniques, et modifiant
    le règlement (CE) n ° 642/2009 en ce qui concerne les exigences d’écoconception
    des téléviseurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 801/2013 der Kommission vom 22. August 2013 zur Änderung
    der Verordnung (EG) Nr. 1275/2008 im Hinblick auf die Festlegung von Ökodesign-Anforderungen
    an den Stromverbrauch elektrischer und elektronischer Haushalts- und Bürogeräte
    im Bereitschafts- und im Aus-Zustand und zur Änderung der Verordnung (EG) Nr.
    642/2009 im Hinblick auf die Festlegung von Anforderungen an die umweltgerechte
    Gestaltung von Fernsehgeräten
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 801/2013 на Комисията от 22
    август 2013 година за изменение на Регламент
    (ЕО) № 1275/2008 по отношение на изискванията за
    екопроектиране към електрическото и електронното
    битово и офис оборудване във връзка с консумацията
    му на електроенергия в режим „в готовност“
    и режим „изключен“ , както и за изменение на
    Регламент (ЕО) № 642/2009 по отношение на изискванията
    за екопроектиране на телевизори
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) č. 801/2013 ze dne 22. srpna 2013 , kterým se
    mění nařízení (ES) č. 1275/2008, pokud jde o požadavky na ekodesign z hlediska
    spotřeby elektrické energie elektrických a elektronických zařízení určených
    pro domácnosti a kanceláře v pohotovostním režimu a ve vypnutém stavu, a
    kterým se mění nařízení (ES) č. 642/2009, pokud jde o požadavky na ekodesign
    televizních přijímačů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 801/2013 af 22. august 2013 om ændring
    af forordning (EF) nr. 1275/2008 for så vidt angår krav til miljøvenligt design
    af elektriske og elektroniske husholdningsapparater og kontorudstyr med hensyn
    til strømforbrug i standbytilstand og slukket tilstand, og om ændring af forordning
    (EF) nr. 642/2009 for så vidt angår krav til miljøvenligt design af fjernsyn
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 801/2013 της Επιτροπής,
    της 22ας Αυγούστου 2013 , περί τροποποίησης του
    κανονισμού (ΕΚ) αριθ. 1275/2008 της Επιτροπής όσον
    αφορά τις απαιτήσεις οικολογικού σχεδιασμού
    για την κατανάλωση ηλεκτρικής ενέργειας ηλεκτρικού
    και ηλεκτρονικού οικιακού και γραφειακού εξοπλισμού
    σε λειτουργία αναμονής ή εκτός λειτουργίας
    και περί τροποποίησης του κανονισμού (ΕΚ) αριθ.
    642/2009 όσον αφορά τις απαιτήσεις οικολογικού
    σχεδιασμού για τηλεοράσεις
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 801/2013, 22. august 2013 , millega muudetakse
    määrust (EÜ) nr 1275/2008 seoses ökodisaini nõuetega elektriliste ja elektrooniliste
    kodumasinate ja kontoriseadmete elektrienergia tarbimise kohta ooteseisundis ja
    väljalülitatud seisundis ning millega muudetakse määrust (EÜ) nr 642/2009
    televiisorite ökodisaini nõuete osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 801/2013, annettu 22 päivänä elokuuta 2013
    , asetuksen (EY) N:o 1275/2008 muuttamisesta kotitalouksissa ja toimistoissa käytettävien
    sähkö- ja elektroniikkalaitteiden lepovirtakulutuksen ekologista suunnittelua
    koskevien vaatimusten osalta ja asetuksen (EY) N:o 642/2009 muuttamisesta televisioiden
    ekologista suunnittelua koskevien vaatimusten osalta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 801/2013 оd 22. kolovoza 2013. o izmjeni Uredbe
    (EZ) br. 1275/2008 o uspostavi okvira za utvrđivanje zahtjeva za ekološki dizajn
    za uporabu električne energije u električnoj i elektroničkoj kućanskoj i uredskoj
    opremi u stanju pripravnosti ili isključenosti i o izmjeni Uredbe (EZ) br. 642/2009
    u odnosu na zahtjeve za ekološki dizajn televizora
  type: main
- language: hu
  script: Latn
  content: A Bizottság 801/2013/EU rendelete ( 2013. augusztus 22. ) az elektromos
    és az elektronikus háztartási és irodai berendezések készenléti és kikapcsolt
    üzemmódbeli villamosenergia-fogyasztására vonatkozóan a környezettudatos
    tervezés követelményeit megállapító 1275/2008/EK rendelet, valamint a televíziókészülékek
    környezettudatos tervezésének követelményeit megállapító 642/2009/EK rendelet
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 801/2013 della Commissione, del 22 agosto 2013 , recante
    modifica del regolamento (CE) n. 1275/2008 per quanto riguarda le specifiche di
    progettazione ecocompatibile relative al consumo di energia elettrica nei modi
    stand-by e spento delle apparecchiature elettriche ed elettroniche domestiche
    e da ufficio e recante modifica del regolamento (CE) n. 642/2009 in merito alle
    specifiche per la progettazione ecocompatibile dei televisori
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 801/2013 ( 2013. gada 22. augusts ), ar ko groza
    Regulu (EK) Nr. 1275/2008 par ekodizaina prasībām attiecībā uz elektrisko,
    elektronisko mājsaimniecības un biroja iekārtu elektroenerģijas patēriņu
    gatavības un izslēgtā režīmā un ar ko groza Regulu (EK) Nr. 642/2009 attiecībā
    uz ekodizaina prasībām televizoriem
  type: main
- language: lt
  script: Latn
  content: 2013 m. rugpjūčio 22 d. Komisijos reglamentas (ES) Nr. 801/2013, kuriuo
    iš dalies keičiamas Reglamentas (EB) Nr. 1275/2008, kuriuo nustatomi išjungtos
    ir budėjimo režimu veikiančios elektros ir elektroninės buitinės ir biuro
    įrangos elektros energijos suvartojimo ekologinio projektavimo reikalavimai,
    ir iš dalies keičiamas Reglamentas (EB) Nr. 642/2009, kuriuo nustatomi televizijos
    aparatų ekologinio projektavimo reikalavimai
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 801/2013 tat- 22 ta’ Awwissu 2013
    li jemenda r-Regolament (KE) Nru 1275/2008 fir-rigward tar-rekwiżiti tal-ekodisinn
    għall-konsum tal-elettriku ta’ tagħmir tal-elettriku u elettroniku tad-dar
    u tal-uffiċċju f’modalità standby u f’modalità mitfi, u li jemenda r-Regolament
    (KE) Nru 642/2009 fir-rigward tar-rekwiżiti tal-ekodisinn għat-televixins
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 801/2013 van de Commissie van 22 augustus 2013 tot
    wijziging van Verordening (EG) nr. 1275/2008 wat betreft voorschriften inzake
    ecologisch ontwerp voor het elektriciteitsverbruik van elektrische en elektronische
    huishoud- en kantoorapparatuur in de stand-by- en uit-stand, en tot wijziging
    van Verordening (EG) nr. 642/2009 betreffende eisen inzake ecologisch ontwerp
    voor televisies
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 801/2013 z dnia 22 sierpnia 2013 r. zmieniające
    rozporządzenie (WE) nr 1275/2008 w odniesieniu do wymogów dotyczących ekoprojektu
    dla zużycia energii przez elektryczne i elektroniczne urządzenia gospodarstwa
    domowego i urządzenia biurowe w trybie czuwania i wyłączenia oraz zmieniające
    rozporządzenie (WE) nr 642/2009 w odniesieniu do wymogów dotyczących ekoprojektu
    dla telewizorów
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 801/2013 da Comissão, de 22 de agosto de 2013 ,
    que altera o Regulamento (CE) n. ° 1275/2008 no que respeita aos requisitos de
    conceção ecológica para o consumo de energia do equipamento elétrico e eletrónico
    doméstico e de escritório nos estados de vigília e de desativação e que altera
    o Regulamento (CE) n. ° 642/2009 no que respeita aos requisitos de conceção
    ecológica para televisores
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 801/2013 al Comisiei din 22 august 2013 de modificare
    a Regulamentului (CE) nr. 1275/2008 în ceea ce privește cerințele în materie
    de proiectare ecologică pentru puterea consumată în modul standby și oprit
    de echipamentele electrice și electronice de uz casnic și de birou și de modificare
    a Regulamentului (CE) nr. 642/2009 în ceea ce privește cerințele de proiectare
    ecologică pentru aparatele TV
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 801/2013 z 22. augusta 2013 , ktorým sa mení
    nariadenie (ES) č. 1275/2008, pokiaľ ide o požiadavky na ekodizajn elektrických
    a elektronických zariadení v domácnosti a kancelárskych zariadení v súvislosti
    so spotrebou elektrickej energie v stave pohotovosti a vo vypnutom stave, a ktorým
    sa mení nariadenie (ES) č. 642/2009 o požiadavkách na ekodizajn televízorov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 801/2013 z dne 22. avgusta 2013 o spremembi Uredbe
    (ES) št. 1275/2008 glede zahtev za okoljsko primerno zasnovo za porabo energije
    pri električni in elektronski gospodinjski ter pisarniški opremi v stanju pripravljenosti
    in izključenosti ter o spremembi Uredbe (ES) št. 642/2009 glede zahtev za okoljsko
    primerno zasnovo televizorjev
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 801/2013 de la Comisión, de 22 de agosto de 2013
    , por el que se modifica el Reglamento (CE) n ° 1275/2008 en lo relativo a los
    requisitos de diseño ecológico aplicables al consumo de energía eléctrica
    en los modos preparado y desactivado de los equipos eléctricos y electrónicos
    domésticos y de oficina, y por el que se modifica el Reglamento (CE) n ° 642/2009
    con respecto a los requisitos de diseño ecológico aplicables a las televisiones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 801/2013 av den 22 augusti 2013 om ändring
    av förordning (EG) nr 1275/2008 vad gäller krav på ekodesign för elektriska
    och elektroniska hushålls- och kontorsprodukters elförbrukning i standby- och
    frånläge och om ändring av förordning (EG) nr 642/2009 vad gäller krav på
    ekodesign för tv-mottagare
