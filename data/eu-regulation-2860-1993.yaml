  content: Council Regulation (EEC) No 2860/93 of 18 October 1993 amending Regulation
    (EEC) No 577/91 imposing a definitive anti-dumping duty on imports of certain
    types of electronic microcircuits known as Eproms (erasable programmable read-only
    memories) originating in Japan
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2860/93 du Conseil du 18 octobre 1993 modifiant le
