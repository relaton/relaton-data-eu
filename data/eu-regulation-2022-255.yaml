title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/255 of 15 December 2021 amending
    Council Regulation (EEC) No 95/93 as regards the extension of measures for temporary
    relief from the slot utilisation rules due to the COVID-19 crisis
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/255 de la Commission du 15 décembre 2021
    modifiant le règlement (CEE) no 95/93 du Conseil en ce qui concerne la prolongation
    des mesures d’allègement temporaire des règles d’utilisation des créneaux
    horaires en raison de la crise de la COVID-19
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/255 der Kommission vom 15. Dezember 2021
    zur Änderung der Verordnung (EWG) Nr. 95/93 des Rates hinsichtlich der Verlängerung
    der Maßnahmen zur vorübergehenden Entlastung von den Vorschriften für die Nutzung
    von Zeitnischen aufgrund der COVID-19-Krise
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/255 на Комисията
    от 15 декември 2021 година за изменение на Регламент
    (ЕИО) № 95/93 на Съвета по отношение на удължаването
    на срока на действие на мерките за временно
    облекчаване на правилата за използване на
    слотовете вследствие на кризата, свързана
    с COVID-19
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/255 ze dne 15. prosince
    2021, kterým se mění nařízení Rady (EHS) č. 95/93, pokud jde o prodloužení
    opatření pro dočasnou úlevu od pravidel využívání letištních časů
    z důvodu krize COVID-19
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/255 af 15. december 2021
    om ændring af Rådets forordning (EØF) nr. 95/93 for så vidt angår forlængelse
    af foranstaltninger med henblik på midlertidig lempelse af reglerne om slotudnyttelse
    som følge af covid-19-krisen
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/255
    της Επιτροπής της 15ης Δεκεμβρίου 2021 για την
    τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 95/93 του
    Συμβουλίου όσον αφορά την παράταση των μέτρων
    προσωρινής απαλλαγής από τους κανόνες χρησιμοποίησης
    του διαθέσιμου χρόνου χρήσης (slots) λόγω της
    κρίσης της COVID-19
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/255, 15. detsember 2021, millega
    muudetakse nõukogu määrust (EMÜ) nr 95/93 seoses teenindusaegade kasutamise
    eeskirjade kohaldamisest ajutist vabastust käsitlevate meetmete pikendamisega
    COVID-19 kriisi tõttu
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/255, annettu 15 päivänä joulukuuta
    2021, neuvoston asetuksen (ETY) N:o 95/93 muuttamisesta siltä osin kuin on kyse
    toimenpiteiden jatkamisesta lähtö- ja saapumisaikojen käyttösäännöistä
    covid-19-kriisin vuoksi myönnettävän väliaikaisen helpotuksen osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/255 ón gCoimisiún an 15 Nollaig 2021
    lena leasaítear Rialachán (CEE) Uimh. 95/93 ón gComhairle maidir le síneadh
    a chur leis na bearta díolúine sealadacha ó na rialacha maidir le húsáid
    sliotán i ngeall ar ghéarchéim COVID-19
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/255 оd 15. prosinca 2021. o izmjeni
    Uredbe Vijeća (EEZ) br. 95/93 u pogledu produljenja mjera za privremeno ublažavanje
    obveze iskorištenosti slotova zbog krize uzrokovane bolešću COVID-19
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/255 felhatalmazáson alapuló rendelete (2021. december
    15.) a 95/93/EGK tanácsi rendeletnek a résidő-felhasználási szabályokra
    vonatkozóan a Covid19-válság miatt bevezetett ideiglenes könnyítésre irányuló
    intézkedések meghosszabbítása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/255 della Commissione del 15 dicembre 2021
    che modifica il regolamento (CEE) n. 95/93 del Consiglio per quanto riguarda la
    proroga delle misure di alleggerimento temporaneo delle norme sull’utilizzo
    delle bande orarie a causa della crisi COVID-19
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/255 (2021. gada 15. decembris),
    ar ko Padomes Regulu (EEK) Nr. 95/93 groza attiecībā uz pasākumu pagarināšanu
    saistībā ar pagaidu atbrīvojumu no laika nišu izmantošanas noteikumiem Covid-19
    krīzes dēļ
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/255 2021 m. gruodžio 15 d.
    kuriuo dėl priemonių, susijusių su laiko tarpsnių naudojimo taisyklių laikinu
    palengvinimu dėl COVID-19 krizės, taikymo pratęsimo iš dalies keičiamas Tarybos
    reglamentas (EEB) Nr. 95/93
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/255 tal-15 ta’ Diċembru
    2021 li jemenda r-Regolament tal-Kunsill (KEE) Nru 95/93 fir-rigward tal-estensjoni
    ta’ miżuri għall-eżenzjoni temporanja mir-regoli dwar l-użu tas-slots minħabba
    l-kriżi tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/255 van de Commissie van 15 december
    2021 tot wijziging van Verordening (EEG) nr. 95/93 van de Raad wat betreft de
    verlenging van maatregelen voor tijdelijke vrijstelling van de regels inzake het
    gebruik van slots vanwege de COVID-19-crisis
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/255 z dnia 15 grudnia 2021
    r. zmieniające rozporządzenie Rady (EWG) nr 95/93 w odniesieniu do przedłużenia
    środków dotyczących tymczasowego złagodzenia zasad wykorzystywania czasów
    na start lub lądowanie w związku z kryzysem związanym z COVID-19
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/255 da Comissão de 15 de dezembro de 2021
    que altera o Regulamento (CEE) n.o 95/93 do Conselho no que respeita à prorrogação
    das medidas de isenção temporária das regras de utilização das faixas horárias
    devido à crise de COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/255 al Comisiei din 15 decembrie 2021 de
    modificare a Regulamentului (CEE) nr. 95/93 al Consiliului în ceea ce privește
    extinderea măsurilor de reducere temporară a obligațiilor de utilizare a sloturilor
    orare ca urmare a crizei provocate de pandemia de COVID-19
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/255 z 15. decembra 2021, ktorým
    sa mení nariadenie Rady (EHS) č. 95/93, pokiaľ ide o predĺženie platnosti
    opatrení na dočasnú úľavu z uplatňovania pravidiel využívania prevádzkových
    intervalov v dôsledku krízy spôsobenej ochorením COVID-19
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/255 z dne 15. decembra 2021 o spremembi
    Uredbe Sveta (EGS) št. 95/93 glede podaljšanja ukrepov za začasno razbremenitev
    od pravil uporabe slotov zaradi krize zaradi COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/255 de la Comisión de 15 de diciembre de
    2021 por el que se modifica el Reglamento (CEE) n.o 95/93 del Consejo en lo que
    respecta a la prórroga de las medidas de flexibilización temporal de las normas
    de utilización de las franjas horarias debido a la crisis de la COVID-19
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/255 av den 15 december 2021
    om ändring av rådets förordning (EEG) nr 95/93 vad gäller förlängning av
    åtgärder för tillfällig lättnad från reglerna om utnyttjande av ankomst-
    och avgångstider på grund av covid-19-krisen
  type: main
