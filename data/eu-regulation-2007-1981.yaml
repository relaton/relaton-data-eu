title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2007/81 of 13 July 1981 determining, for the
    1981/82 wine-growing year, the prices to be paid under the compulsory distillation
    of the by-products of wine making and, notwithstanding Regulation (EEC) No 349/79,
    the amount of the contribution from the Guarantee Section of the European Agricultural
    Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2007/81 du Conseil, du 13 juillet 1981, déterminant,
    pour la campagne viticole 1981/1982, les prix à payer au titre de la distillation
    obligatoire des sous-produits de la vinification et, par dérogation au règlement
    (CEE) n° 349/79, le montant de la participation du Fonds européen d' orientation
    et de garantie agricole, section "garantie"
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2007/81 des Rates vom 13. Juli 1981 zur Festlegung
    der im Rahmen der obligatorischen Destillation der Nebenerzeugnisse der Weinbereitung
    zu zahlenden Preise sowie - abweichend von der Verordnung (EWG) Nr. 349/79 - des
    Betrages der Beteiligung des Europäischen Ausrichtungs- und Garantiefonds für
    die Landwirtschaft, Abteilung Garantie, für das Weinwirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2007/81 af 13. juli 1981 om fastsættelse
    for vinproduktionsåret 1981/82 af de priser, der skal betales i forbindelse med
    den obligatoriske destillation af biprodukter fra vinfremstilling, og, som undtagelse
    fra forordning (EØF) nr. 349/79, af det beløb, hvormed Den europæiske Udviklings-
    og Garantifond for Landbruget, garantisektionen, deltager
  type: main
