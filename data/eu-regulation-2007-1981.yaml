    obbligatoria dei sottoprodotti della vinificazione e, in deroga al regolamento
    (CEE) n. 349/79, l' importo della partecipazione del Fondo europeo agricolo di
    orientamento e di garanzia, sezione garanzia
  type: main
- language: nl
