title:
- language: en
  script: Latn
  content: '92/520/EEC: Commission Decision of 3 November 1992 amending Decision 89/374/EEC
    of 2 June 1989 on the organization of a temporary experiment under Council Directive
    66/402/EEC on the marketing of cereal seed, in order to establish the conditions
    to be satisfied by the crop and the seed of hybrids of rye'
  type: main
- language: fr
  script: Latn
  content: '92/520/CEE: Décision de la Commission, du 3 novembre 1992, modifiant
    la décision 89/374/CEE concernant l'' organisation d'' une expérimentation temporaire
    conformément à la directive 66/402/CEE du Conseil concernant la commercialisation
    des semences de céréales, en vue de fixer les conditions auxquelles doivent
    satisfaire les cultures et les semences d'' hybrides de seigle'
  type: main
- language: de
  script: Latn
  content: '92/520/EWG: Entscheidung der Kommission vom 3. November 1992 zur Änderung
