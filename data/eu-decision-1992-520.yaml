    temporaneo nel quadro della direttiva 66/402/CEE del Consiglio relativa alla commercializzazione
    delle sementi di cereali, al fine di stabilire le condizioni cui devono rispondere
    le colture e le sementi degli ibridi di segala'
  type: main
- language: nl
  script: Latn
  content: '92/520/EEG: Beschikking van de Commissie van 3 november 1992 tot wijziging
