    kaupan annetun neuvoston direktiivin 66/402/ETY mukaisesti kasvustojen ja ruishybridien
    siementen laatua koskevien vaatimusten luomiseksi tehdyn päätöksen 89/374/ETY
    muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '92/520/CEE: Decisione della Commissione, del 3 novembre 1992, recante
