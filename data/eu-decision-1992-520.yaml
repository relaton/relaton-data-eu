    Versuchs im Rahmen der Richtlinie 66/402/EWG des Rates über den Verkehr mit Getreidesaatgut
    zur Festlegung der Voraussetzungen, denen der Feldbestand und das Saatgut von
    Roggenhybriden genügen müssen'
  type: main
- language: da
  script: Latn
  content: '92/520/EØF: Kommissionens beslutning af 3. november 1992 om ændring
