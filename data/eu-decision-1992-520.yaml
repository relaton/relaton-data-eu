    που αφορά την οργάνωση προσωρινής πειραματικής
    δοκιμής σύμφωνα με την οδηγία 66/402/ΕΟΚ του Συμβουλίου
    περί εμπορίας σπόρων σιτηρών προς σπορά για
    τον καθορισμό των όρων που πρέπει να πληρούν
