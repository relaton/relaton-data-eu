title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/869 of 27 May 2021 amending
    Implementing Decision (EU) 2018/638 as regards its date of expiration in order
    to prolong the measures to prevent the introduction into and the spread within
    the Union territory of the pest Spodoptera frugiperda (Smith) (notified under
    document C(2021) 3576)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/869 de la Commission du 27 mai 2021
    modifiant la décision d’exécution (UE) 2018/638 en ce qui concerne sa date
    d’expiration afin de prolonger les mesures destinées à éviter l’introduction
    et la propagation sur le territoire de l’Union de l’organisme nuisible Spodoptera
    frugiperda (Smith) [notifiée sous le numéro C(2021) 3576]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/869 der Kommission vom 27. Mai 2021 zur
