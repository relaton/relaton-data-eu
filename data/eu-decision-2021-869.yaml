    fir-rigward tad-data ta’ skadenza tagħha sabiex ittawwal il-miżuri għall-prevenzjoni
    tal-introduzzjoni u t-tixrid tal-organiżmu ta’ ħsara Spodoptera frugiperda
    (Smith) fit-territorju tal-Unjoni (notifikata bid-dokument C(2021) 3576)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/869 van de Commissie van 27 mei 2021 tot wijziging
