    C(2021) 3576)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/869 végrehajtási határozata (2021. május 27.)
    az (EU) 2018/638 végrehajtási határozatnak a Spodoptera frugiperda (Smith)
    károsító Unió területére történő behurcolásának és ott történő
    elterjedésének megelőzését célzó intézkedések meghosszabbítása érdekében
    a hatályvesztése időpontja tekintetében történő módosításáról (az
    értesítés a C(2021) 3576. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/869 della Commissione del 27 maggio 2021
    che modifica la decisione di esecuzione (UE) 2018/638 per quanto riguarda la data
    di scadenza al fine di prorogare le misure per impedire l’introduzione e la
    diffusione nel territorio dell’Unione dell’organismo nocivo Spodoptera frugiperda
    (Smith) [notificata con il numero C(2021) 3576]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/869 (2021. gada 27. maijs), ar
    ko Īstenošanas lēmumu (ES) 2018/638 groza attiecībā uz tā piemērošanas
    termiņu, lai pagarinātu pasākumus, kas veicami, lai novērstu kaitīgā organisma
    Spodoptera frugiperda (Smith) ievešanu un izplatīšanos Savienības teritorijā
    (izziņots ar dokumenta numuru C(2021) 3576)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/869 2021 m. gegužės 27 d.
    kuriuo, siekiant pratęsti priemonių, kuriomis užtikrinama, kad į Sąjungos
    teritoriją nebūtų įvežti ir joje neišplistų kenkėjai kukurūziniai dykrinukai
    Spodoptera frugiperda (Smith), galiojimą, iš dalies keičiama Įgyvendinimo
    sprendimo (ES) 2018/638 nuostata dėl jo galiojimo pabaigos datos (pranešta dokumentu
    Nr. C(2021) 3576)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/869 tas-27
