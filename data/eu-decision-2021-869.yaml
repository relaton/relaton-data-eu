    om de maatregelen ter voorkoming van het binnenbrengen en de verspreiding op het
    grondgebied van de Unie van het schadelijk organisme Spodoptera frugiperda (Smith)
    te verlengen (Kennisgeving geschied onder nummer C(2021) 3576)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/869 z dnia 27 maja 2021 r. zmieniająca
