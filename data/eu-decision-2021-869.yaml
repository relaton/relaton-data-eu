    на въвеждането и разпространението на територията
    на Съюза на вредителя Spodoptera frugiperda (Smith) (нотифицирано
    под номер C(2021)3576)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/869 ze dne 27. května 2021,
    kterým se mění prováděcí rozhodnutí (EU) 2018/638, pokud jde o datum konce
    jeho použitelnosti, za účelem prodloužení opatření proti zavlékání škodlivého
    organismu Spodoptera frugiperda (Smith) do Unie a jeho rozšiřování na území
    Unie (oznámeno pod číslem C(2021)3576)
  type: main
- language: da
  script: Latn
