    zwecks Verlängerung der Maßnahmen zum Schutz der Union gegen die Einschleppung
    und Ausbreitung des Schädlings Spodoptera frugiperda (Smith) (Bekannt gegeben
    unter Aktenzeichen C(2021)3576)
  type: main
