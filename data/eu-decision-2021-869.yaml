    toukokuuta 2021, täytäntöönpanopäätöksen (EU) 2018/638 muuttamisesta sen
    voimassaolon päättymispäivän osalta tuhoojan Spodoptera frugiperda (Smith)
    unionin alueelle kulkeutumisen ja siellä leviämisen estämiseksi toteutettavien
    toimenpiteiden jatkamiseksi (tiedoksiannettu numerolla C(2021) 3576)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/869 оd 27. svibnja 2021. o izmjeni
