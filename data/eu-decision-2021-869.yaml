    przedłużenia środków zapobiegających wprowadzaniu do Unii i rozprzestrzenianiu
    się w niej agrofaga Spodoptera frugiperda (Smith) (notyfikowana jako dokument
    nr C(2021) 3576)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/869 da Comissão de 27 de maio de 2021
    que altera a Decisão de Execução (UE) 2018/638 da Comissão no que diz respeito
    à sua data de expiração a fim de prolongar as medidas destinadas a evitar a
    introdução e a propagação no território da União da praga Spodoptera frugiperda
    (Smith) [notificada com o número C(2021) 3576]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/869 a Comisiei din 27 mai 2021
    de modificare a Deciziei de punere în aplicare (UE) 2018/638 în ceea ce privește
    data expirării sale în scopul prelungirii măsurilor de prevenire a introducerii
    și a răspândirii pe teritoriul Uniunii a organismului dăunător Spodoptera
    frugiperda (Smith) [notificată cu numărul C(2021) 3576]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/869 z 27. mája 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2018/638, pokiaľ ide o dátum uplynutia
    jeho platnosti, s cieľom predĺžiť opatrenia na zabránenie zavlečeniu škodcu
    Spodoptera frugiperda (Smith) na územie Únie a jeho rozšíreniu na tomto území
    [oznámené pod číslom C(2021) 3576]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/869 z dne 27. maja 2021 o spremembi
    Izvedbenega sklepa (EU) 2018/638 glede njegovega datuma konca uporabe, da se podaljšajo
    ukrepi za preprečevanje vnosa škodljivega organizma Spodoptera frugiperda (Smith)
    v Unijo in njegovega širjenja znotraj Unije (notificirano pod dokumentarno številko
    C(2021) 3576)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/869 de la Comisión de 27 de mayo de
