type: standard
title:
- language: en
  script: Latn
  content: COUNCIL REGULATION (EC) No 264/95 of 6 February 1995 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 264/95 du Conseil du 6 février 1995 modifiant le règlement
    (CEE) n° 1873/84 autorisant l'offre et la livraison à la consommation humaine
    directe de certains vins importés susceptibles d'avoir fait l'objet de pratiques
    oenologiques non prévues par le règlement (CEE) n° 822/87
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 264/95 DES RATES vom 6. Februar 1995 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 264/95 af 6. februar 1995 om ændring af forordning
    (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte konsum
    af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 264/95 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 6ης Φεβρουαρίου 1995 για τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν αντικείμενο οινολογικών πρακτικών
    που δεν προβλέπονται από τον κανονισμό (ΕΟΚ)
    αριθ. 822/87
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 264/95, annettu 6 päivänä helmikuuta 1995,
    sellaisilla enologisilla käytännöillä, joista ei ole säädetty asetuksessa
    (ETY) N:o 822/87, mahdollisesti käsiteltyjen tiettyjen tuontiviinien tarjoamisen
    ja toimittamisen sallimisesta nautittavaksi annetun asetuksen (ETY) N:o 1873/84
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 264/95 DEL CONSIGLIO del 6 febbraio 1995 che modifica
    il regolamento (CEE) n. 1873/84 che autorizza l' offerta e la consegna per il
    consumo umano diretto di taluni vini importati che possono essere stati sottoposti
    a pratiche enologiche non previste dal regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 264/95 VAN DE RAAD van 6 februari 1995 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 264/95 DO CONSELHO de 6 de Fevereiro de 1995 que altera
    o Regulamento (CEE) nº 1873/84 que autoriza a oferta e o fornecimento para consumo
    humano directo de certos vinhos importados susceptíveis de terem sido sujeitos
    a práticas enológicas não previstas no Regulamento (CEE) nº 822/87
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 264/95 DEL CONSEJO de 6 de febrero de 1995 que modifica
    el Reglamento (CEE) nº 1873/84 por el que se autoriza la oferta y la entrega
    al consumo humano directo de determinados vinos importados que pueden haber sido
    sometidos a prácticas enológicas no previstas en el Reglamento (CEE) nº 822/87
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 264/95 av den 6 februari 1995 om ändring av
    förordning (EEG) nr 1873/84 som tillåter utbjudande till försäljning eller
    leverans för direkt konsumtion av vissa importerade viner som kan ha varit föremål
    för enologisk behandling som inte reglerats i förordning (EEG) nr 822/87
  type: main
