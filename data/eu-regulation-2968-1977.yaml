    vom 23. Dezember 1977 über die Begriffsbestimmung des Warenursprungs bei der
    Anwendung der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren
    aus Entwicklungsländern gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2968/77 af 23. december 1977 om undtagelse
