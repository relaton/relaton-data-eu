id: EURegulation17431975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1743/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on men's and boys' under garments, including collars,
    shirt fronts and cuffs, of cotton fabric, falling within heading No ex 61.03,
    originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1743/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous pour hommes et garçonnets, y compris les cols, faux cols, plastrons
    et manchettes, en tissus de coton, de la position tarifaire EX 61.03, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1743/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Männer
    und Knaben, auch Kragen, Vorhemden und Manschetten, aus Baumwolle, der Tarifnummer
    ex 61.03, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1743/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til mænd og drenge
    (herunder flipper, skjortebryster og manchetter), varer af bomuld, under position
    ex 61.03, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1743/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per uomo e per ragazzo, compresi i colli, colletti, sparati e polsini,
    in tessuti di cotone, della voce doganale ex 61.03, originarie dei paesi in via
    di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1743/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op herenonderkleding
    en jongensonderkleding, kragen, boorden, fronten en manchetten daaronder begrepen,
    van weefsels van katoen, van tariefpost ex 61.03, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3046/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
