title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1818/75 of the Council of 10 July 1975 on the agricultural
    levies, compensatory amounts and other import charges applicable to agricultural
    products and to certain goods resulting from their processing, contained in travellers'
    personal baggage
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1818/75 du Conseil, du 10 juillet 1975, relatif aux
    prélèvements agricoles, montants compensatoires et autres impositions à l'
    importation, applicables aux produits agricoles et à certaines marchandises résultant
    de leur transformation, contenus dans les bagages personnels des voyageurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1818/75 des Rates vom 10. Juli 1975 über die landwirtschaftlichen
    Abschöpfungen, Ausgleichsbeträge und sonstigen Abgaben bei der Einfuhr von landwirtschaftlichen
    Erzeugnissen und von bestimmten landwirtschaftlichen Verarbeitungserzeugnissen
    im persönlichen Gepäck von Reisenden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1818/75 af 10. juli 1975 om landbrugsimportafgifter,
    udligningsafgifter og andre importbelastninger for landbrugsprodukter og visse
    varer fremstillet heraf, som indføres af rejsende i deres personlige bagage
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1818/75 τού Συμβουλίου
    τής 10ης Ιουλίου 1975 περί τών γεωργικών εισφορών,
    τών εξισωτικών ποσών καί λοιπών επιβαρύνσεων
    κατά τήν εισαγωγή πού εφαρμόζονται επί γεωργικών
    προϊόντων καί ορισμένων εμπορευμάτων πού προκύπτουν
    από τήν μεταποίησή τους καί περιέχονται στίς
    προσωπικές αποσκευές τών ταξιδιωτών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1818/75 del Consiglio, del 10 luglio 1975, relativo
    ai prelievi agricoli, agli importi compensativi e alle altre imposizioni all'
    importazione applicabili ai prodotti agricoli e a talune merci risultanti dalla
    loro trasformazione, contenuti nei bagagli personali dei viaggiatori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1818/75 van de Raad van 10 juli 1975 betreffende
    de landbouwheffingen, compenserende bedragen en andere invoerheffingen die van
