title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2263/70 du Conseil, du 10 novembre 1970, portant augmentation
    du contingent tarifaire communautaire de morues entières, décapitées ou tronçonnées,
    simplement salées ou en saumure, ou séchées, de la position 03.02 à I b) du
    tarif douanier commun (année 1970)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2263/70 des Rates vom 10. November 1970 zur Erhöhung
    des Gemeinschaftszollkontingents für Kabeljau, ganz, ohne Kopf oder zerteilt,
    nur gesalzen, in Salzlake oder getrocknet, der Tarifstelle 03.02 A I b) des Gemeinsamen
    Zolltarifs (1970)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2263/70 del Consiglio, del 10 novembre 1970, relativo
    all'aumento del contingente tariffario comunitario di merluzzi interi, decapitati
    o in pezzi, semplicemente salati o in salamoia, o secchi, della voce 03.02 A I
    b) della tariffa doganale comune (anno 1970)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2263/70 van de Raad van 10 november 1970 tot vergroting
    van het communautaire tariefcontingent van kabeljauw, ook indien ontdaan van kop
    of in moten gesneden, enkel gezouten, gepekeld of gedroogd, van post 03.02 A I
    b) van het gemeenschappelijk douanetarief (1970)
  type: main
