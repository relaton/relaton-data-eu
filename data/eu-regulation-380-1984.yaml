title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 380/84 of 15 February 1984 amending Regulations
    (EEC) No 262/79, (EEC) No 1932/81 and (EEC) No 1687/76 as regards rules on transport
    and movement between Member States of intermediate products obtained from butter
    or concentrated butter intended for the manufacture of certain foodstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 380/84 de la Commission du 15 février 1984 modifiant
    les règlements (CEE) no 262/79, (CEE) no 1932/81 et (CEE) no 1687/76 en ce qui
    concerne les modalités de transport et le mouvement entre États membres de produits
    intermédiaires obtenus à partir de beurre ou beurre concentré destiné à la
    fabrication de certains produits alimentaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 380/84 der Kommission vom 15. Februar 1984 zur Änderung
    der Verordnungen (EWG) Nr. 262/79, (EWG) Nr. 1932/81 und (EWG) Nr. 1687/76 hinsichtlich
    der Bedingungen für die Beförderung und die Verbringung von aus Butter oder
    Butterreinfett gewonnenen Zwischenerzeugnissen zur Herstellung bestimmter Lebensmittel
    zwischen den Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 380/84 af 15. februar 1984 om ændring
    af forordning (EØF) nr. 262/79, (EØF) nr. 1932/81 og (EØF) nr. 1687/76 for
    så vidt angår reglerne for forsendelse og bevægelse mellem medlemsstaterne
    af produkter på mellemstadiet, der er fremstillet af smør eller koncentreret
    smør beregnet til fremstilling af visse levnedsmidler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 380/84 της Επιτροπής
    της 15ης Φεβρουαρίου 1984 για την τροποποίηση
    των κανονισμών (ΕΟΚ) αριθ. 262/79, (ΕΟΚ) αριθ. 1932/81
    και (ΕΟΚ) αριθ. 1687/76 σχετικά με τις διατάξεις
    μεταφοράς και τη διακίνηση μεταξύ των κρατών
    μελών ενδιάμεσων προϊόντων που λαμβάνονται
    από το βούτυρο ή το συμπυκνωμένο βούτυρο που
    προορίζονται για την παρασκευή ορισμένων τροφίμων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 380/84 della Commissione del 15 febbraio 1984 che
    modifica i regolamenti (CEE) n. 262/79, (CEE) n. 1932/81 e (CEE) n. 1687/76 per
    quanto riguarda il trasporto e il movimento fra Stati membri di prodotti intermedi
    ottenuti dal burro o dal burro concentrato destinato alla fabbricazione di alcuni
    prodotti alimentari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 380/84 van de Commissie van 15 februari 1984 tot
    wijziging van de Verordeningen (EEG) nr. 262/79, (EEG) nr. 1932/81 en (EEG) nr.
    1687/76 inzake transportvoorwaarden voor en het verkeer tussen de Lid-Staten van
    tussenprodukten die uit voor de vervaardiging van bepaalde levensmiddelen bestemde
    boter of boterconcentraat zijn verkregen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 380/84 da Comissão, de 15 de Fevereiro de 1984,
    que altera os Regulamentos (CEE) n.° 262/79, (CEE) n.° 1932/81 e (CEE) n.°
    1687/76 no que diz respeito às modalidades de transporte e ao movimento entre
    Estados-membros de produtos intermédios obtidos a partir de manteiga ou de manteiga
    concentrada destinada ao fabrico de certos produtos alimentares
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 380/84 de la Comisión, de 15 de febrero de 1984,
    por el que se modifican los Reglamentos (CEE) n° 262/79, (CEE) n° 1932/81 y
    (CEE) n° 1687/76 en lo referente a las modalidades de transporte y al movimiento,
    entre los Estados miembros, de productos intermedios obtenidos a partir de la
    mantequilla o mantequilla concentrada destinada a la fabricación de determinados
    productos alimenticios
  type: main
