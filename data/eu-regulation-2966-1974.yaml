    alla sospensione dell' applicazione dell' articolo 4 bis, paragrafo 2, del regolamento
    (CEE) n. 974/71
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2966/74 van de Commissie van 25 november 1974 betreffende
