  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2966/74 de la Commission, du 25 novembre 1974, relatif
    à des mesures transitoires en matière de montants compensatoires monétaires
    à la suite de la suspension de l' application de l' article 4bis paragraphe 2
    du règlement (CEE) n° 974/71
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2966/74 der Kommission vom 25. November 1974 über
    Übergangsmaßnahmen im Bereich der Währungsausgleichsbeträge im Zuge der Aussetzung
    der Anwendung von Artikel 4a Absatz 2 der Verordnung (EWG) Nr. 974/71
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2966/74 af 25. november 1974 om midlertidige
