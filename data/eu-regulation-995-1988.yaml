    (ΕΟΚ) αριθ. 569/88 για τον καθορισμό των κοινών
    λεπτομερειών ελέγχου της χρησιμοποίησης ή/και
    του προορισμού προϊόντων που προέρχονται από
    την παρέμβαση
  type: main
