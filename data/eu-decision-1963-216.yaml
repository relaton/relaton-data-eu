title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant la République italienne à adopter
    une mesure de sauvegarde en application de l'article 226 du Traité, en faveur
    du chromate de plomb, du chromate de zinc et des pigments à base de chromate
    de plomb ou de zinc
  type: main
- language: de
  script: Latn
  content: '63/216/EWG: Entscheidung der Kommission zur Ermächtigung der Italienischen
    Republik auf Anwendung einer Schutzmaßnahmen gemäß Artikel 226 des Vertrages
    für Bleichromat, Zinkchromat und Farbpigmente auf der Grundlage von Blei- und
    Zinkchromat'
  type: main
- language: it
  script: Latn
  content: '63/216/CEE: Decisione della Commissione che autorizza la Repubblica italiana
    ad adottare, a norma dell''articolo 226 del Trattato, una misura di salvaguardia
    a favore della produzione di cromati di piombo, di cromati di zinco, e dei pigmenti
    a base di cromati di piombo e di zinco'
  type: main
- language: nl
  script: Latn
  content: '63/216/EEG: Beschikking van de Commissie tot machtiging van de Italiaanse
    Republiek om op grond van artikel 226 van het Verdrag een vrijwaringsmaatregel
    te nemen ten behoeve van loodchromaat, van zinkchromaat en pigmenten op basis
    van loodchromaat en zinkchromaat'
  type: main
