title:
- language: en
  script: Latn
  content: '85/625/EEC: Commission Decision of 16 December 1985 amending Decision
    85/262/EEC authorizing Member States to permit temporarily the marketing of forest
    reproductive material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '85/625/CEE: Décision de la Commission du 16 décembre 1985 modifiant
    la décision 85/262/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '85/625/EWG: Entscheidung der Kommission vom 16. Dezember 1985 zur Änderung
    der Entscheidung 85/262/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend
    forstliches Vermehrungsgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '85/625/EØF: Kommissionens beslutning af 16. december 1985 om ændring
    af beslutning 85/262/EØF om bemyndigelse af medlemsstaterne til midlertidigt
    at tillade handel med forstligt formeringsmateriale, der ikke opfylder kravene
    i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '85/625/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Δεκεμβρίου 1985 για τροποποίηση της απόφασης
    85/262/ΕΟΚ που επιτρέπει στα κράτη μέλη να εγκρίνουν
    προσωρινά την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν ανταποκρίνεται στις απαιτήσεις
    της οδηγίας 66/404/ΕΟΚ του Συμβουλίου'
  type: main
- language: it
  script: Latn
  content: '85/625/CEE: Decisione della Commissione del 16 dicembre 1985 recante modifica
    della decisione 85/262/CEE che autorizza gli stati membri ad ammettere temporaneamente
    la commercializzazione di materiali di moltiplicazione di alcune specie forestali
    che non corrispondono alle esigenze della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '85/625/EEG: Beschikking van de Commissie van 16 december 1985 tot wijziging
    van Beschikking 85/262/EEG houdende machtiging van de Lid-Staten om bosbouwkundig
    teeltmateriaal dat niet aan de eisen van Richtlijn 66/404/EEG van de Raad voldoet,
    tijdelijk tot de handel toe te laten'
  type: main
- language: pt
  script: Latn
  content: '85/625/CEE: Decisão da Comissão, de 16 de Dezembro de 1985, que altera
    a Decisão 85/262/CEE que autoriza os Estados-membros a admitirem temporariamente
    a comercialização de materiais florestais de reprodução que não correspondam
    às exigências da Directiva 66/404/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '85/625/CEE: Decisión de la Comisión, de 16 de diciembre de 1985, por
    la que se modifica la Decisión 85/262/CEE por la que se autoriza a los Estados
    miembros a admitir temporalmente la comercialización de materiales forestales
    de reproducción que no cumplan los requisitos de la Directiva 66/404/CEE del
    Consejo'
