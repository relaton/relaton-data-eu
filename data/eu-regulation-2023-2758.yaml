  script: Latn
  content: Commission Implementing Regulation (EU) 2023/2758 of 12 December 2023 imposing
    a definitive anti-dumping duty on imports of certain hot-rolled flat products
    of iron, non-alloy or other alloy steel originating in the Federative Republic
    of Brazil, the Islamic Republic of Iran and the Russian Federation following an
    expiry review pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/2758 de la Commission du 12 décembre
    2023 instituant un droit antidumping définitif sur les importations de certains
    produits plats laminés à chaud en fer, en aciers non alliés ou en autres aciers
    alliés, originaires de la République fédérative du Brésil, de la République
    islamique d’Iran et de la Fédération de Russie à l’issue d’un réexamen
    au titre de l’expiration des mesures mené conformément à l’article 11,
    paragraphe 2, du règlement (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
