    der Kontrolle der in Portugal zum freien Verkehr abgefertigten Mengen bei bestimmten
    Erzeugnissen des Fettsektors
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1726/87 af 22. juni 1987 om ændring
