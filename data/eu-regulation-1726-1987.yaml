    the quantities of certain products in the oils and fats sector released for consumption
    in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1726/87 de la Commission du 22 juin 1987 modifiant
    le règlement (CEE) n° 1184/86 arrêtant les modalités du régime de contrôle
    des quantités mises à la consommation au Portugal de certains produits du secteur
    des matières grasses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1726/87 der Kommission vom 22. Juni 1987 zur Änderung
