    viestintäpalvelujen tarjontaan unionissa soveltuvia maanpäällisiä järjestelmiä
    varten annetun päätöksen (EU) 2015/750 muuttamisesta ulottamalla se koskemaan
    yhdenmukaistettuja taajuusalueita 1427–1452 MHz ja 1492–1517 MHz (tiedoksiannettu
    numerolla C(2018) 2286)
  type: main
