    szolgáltatások nyújtására alkalmas földfelszíni rendszerek érdekében
    történő harmonizálásáról szóló (EU) 2015/750 végrehajtási határozatnak
    a harmonizált 1427–1452 MHz és 1492–1517 MHz frekvenciasávra történő
    kiterjesztéséről (az értesítés a C(2018) 2286. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2018/661 della Commissione, del 26 aprile
    2018, che modifica la decisione di esecuzione (UE) 2015/750 relativa all'armonizzazione
    della banda di frequenza 1452-1492 MHz per i sistemi terrestri in grado di fornire
    servizi di comunicazione elettronica nell'Unione per quanto riguarda la sua estensione
    nelle bande di frequenze armonizzate 1427-1452 MHz e 1492-1517 MHz [notificata
    con il numero C(2018) 2286]
  type: main
- language: lv
  script: Latn
