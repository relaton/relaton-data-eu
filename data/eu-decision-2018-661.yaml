title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/661 of 26 April 2018 amending
    Implementing Decision (EU) 2015/750 on the harmonisation of the 1452-1492 MHz
    frequency band for terrestrial systems capable of providing electronic communications
    services in the Union as regards its extension in the harmonised 1427-1452 MHz
    and 1492-1517 MHz frequency bands (notified under document C(2018) 2286)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/661 de la Commission du 26 avril 2018
    modifiant la décision d'exécution (UE) 2015/750 sur l'harmonisation de la bande
    de fréquences 1452-1492 MHz pour les systèmes terrestres permettant de fournir
    des services de communications électroniques dans l'Union, en ce qui concerne
    son extension dans les bandes de fréquences harmonisées 1427-1452 MHz et 1492-1517
    MHz [notifiée sous le numéro C(2018) 2286]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/661 der Kommission vom 26. April 2018
    zur Änderung des Durchführungsbeschlusses (EU) 2015/750 zur Harmonisierung des
    Frequenzbands 1452-1492 MHz für terrestrische Systeme, die elektronische Kommunikationsdienste
    in der Union erbringen können, im Hinblick auf seine Ausweitung auf die harmonisierten
    Frequenzbänder 1427-1452 MHz und 1492-1517 MHz (Bekannt gegeben unter Aktenzeichen
    C(2018) 2286)
  type: main
- language: bg
  script: Cyrl
