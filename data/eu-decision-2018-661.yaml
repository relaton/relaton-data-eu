    maapealsete süsteemide jaoks, millega on võimalik pakkuda elektroonilise side
    teenuseid Euroopa Liidus) seoses selle laiendamisega ühtlustatud sagedusaladele
    1427 – 1452 MHz ja 1492 – 1517 MHz (teatavaks tehtud numbri C(2018) 2286 all)
  type: main
