    harmonizāciju tādu zemes sistēmu vajadzībām, kas Savienībā spēj nodrošināt
    elektronisko sakaru pakalpojumus, groza, to attiecinot arī uz harmonizēto 1427–1452
    MHz un 1492–1517 MHz frekvenču joslu (izziņots ar dokumenta numuru C(2018)
    2286)
  type: main
- language: lt
  script: Latn
