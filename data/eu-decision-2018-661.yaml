    Provedbene odluke (EU) 2015/750 o usklađivanju frekvencijskog pojasa 1452–1492
    MHz za zemaljske sustave kojima se pružaju usluge elektroničkih komunikacija
    u Uniji u pogledu njezina proširenja na usklađene frekvencijske pojaseve 1427–1452
