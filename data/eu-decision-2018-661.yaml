    την εναρμόνιση της ζώνης συχνοτήτων 1452-1492 MHz
    για επίγεια συστήματα ικανά να παρέχουν υπηρεσίες
    ηλεκτρονικών επικοινωνιών στην Ένωση, όσον
    αφορά την επέκτασή της στις εναρμονισμένες
    ζώνες συχνοτήτων 1427-1452 MHz και 1492-1517 MHz [κοινοποιηθείσα
