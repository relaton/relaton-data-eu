    за изпълнение (ЕС) 2015/750 относно хармонизирането
    на радиочестотната лента 1452—1492 MHz за наземни
    системи, позволяващи предоставянето на електронни
    съобщителни услуги в Съюза по отношение на
    разширяването му в хармонизираните радиочестотни
    ленти 1427—1452 MHz и 1492—1517 MHz (нотифицирано под
    номер С(2018) 2286)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/661 ze dne 26. dubna 2018, kterým
    se mění prováděcí rozhodnutí (EU) 2015/750 o harmonizaci kmitočtového
    pásma 1452–1492 MHz pro zemské systémy k poskytování služeb elektronických
    komunikací v Unii, pokud jde o jeho rozšíření v harmonizovaných kmitočtových
    pásmech 1427–1452 MHz a 1492–1517 MHz (oznámeno pod číslem C(2018) 2286)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2018/661 af 26. april 2018
    om udvidelse af gennemførelsesafgørelse (EU) 2015/750 om harmoniseret anvendelse
    af frekvensbåndet 1452-1492 MHz til jordbaserede systemer, der kan levere elektroniske
    kommunikationstjenester i Unionen, til at omfatte frekvensbåndene 1427-1452 MHz
    og 1492-1517 MHz (meddelt under nummer C(2018) 2286)
  type: main
- language: el
  script: Grek
