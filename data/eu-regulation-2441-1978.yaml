title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2441/78 of 18 October 1978 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18, originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2441/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques fixes, variables ou ajustables, de la position tarifaire 85.18, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2441/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr elektrische Festkondensatoren, Drehkondensatoren und andere
    einstellbare Kondensatoren, der Tarifnummer 85.18, mit Ursprung in Singapur, dem
    die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2441/78 af 18. oktober 1978 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under position 85.18, som har oprindelse i Singapore og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2441/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce 85.18 della tariffa doganale comune,
    originari di Singapore beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2441/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren), van post 85.18, van oorsprong uit Singapore ten behoeve waarvan
    bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
