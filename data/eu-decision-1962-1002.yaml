title:
- language: fr
  script: Latn
  content: Décision de la Commission relative au recours de la République fédérale
    d'Allemagne à l'article 115, alinéa 1, CEE pour exclure du traitement communautaire
    les engrais minéraux ou chimiques azotés de la position 31.02 B du Tarif douanier
    commun originaires de la Pologne et mis en libre pratique dans les autres États
    membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission über die Inanspruchnahme von Artikel 115 Absatz
    1 des Vertrages durch die Bundesrepublik Deutschland, um aus Polen stammende mineralische
    oder chemische Stickstoffdüngemittel der Tarifnummer 31.02 B des Gemeinsamen
    Zolltarifs, die in den anderen Mitgliedstaaten in den freien Verkehr gebracht
    wurden, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa al ricorso della Repubblica federale
    di Germania all'articolo 115, comma 1 del Trattato per escludere dal trattamento
    comunitario i concimi minerali ò chimici azotati della voce 31.02 B della Tariffa
    doganale comune, originari della Polonia e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie betreffende het door de Bondsrepubliek Duitsland
    op grond van artikel 115, eerste alinea, van het EEG-Verdrag gedane verzoek om
    minerale of chemische stikstofhoudende meststoffen van post 31.02 B van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit Polen en in de andere Lid-Staten in het
    vrije verkeer zijn gebracht, van de communautaire behandeling uit te sluiten
  type: main
