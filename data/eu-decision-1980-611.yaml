title:
- language: en
  script: Latn
  content: '80/611/EEC: Commission Decision of 2 June 1980 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste), falling within subheading 56.07 A of the Common Customs
    Tariff (category 3), originating in South Korea and in free circulation in the
    other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/611/CEE: Décision de la Commission, du 2 juin 1980, autorisant le
    Royaume-Uni à exclure du traitement communautaire les tissus de fibres textiles
    synthétiques discontinues, de la sous-position 56.07 A du tarif douanier commun
    (catégorie 3), originaires de Corée du Sud et mis en libre pratique dans les
    autres Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/611/EWG: Entscheidung der Kommission vom 2. Juni 1980, mit der das
    Vereinigte Königreich ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern
    der Tarifstelle 56.07 A des Gemeinsamen Zolltarifs (Kategorie 3) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/611/EØF: Kommissionens beslutning af 2. juni 1980 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbe1505handling at undtage vævet
    stof af korte kemofibre, syntetiske eller regenere1515rede, som henhører under
    pos. 56.07 A i den fælles toldtarif (kategori 3), har oprindelse i Sydkorea og
    frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/611/CEE: Decisione della Commissione, del 2 giugno 1980, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i tessuti di fibre tessili
    sintetiche in fiocco, della sottovoce 56.07 A della tariffa doganale comune, categoria
    3, originari della Corea del Sud e messi in libera pratica negli altri Stati membri
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/611/EEG: Beschikking van de Commissie van 2 juni 1980 waarbij het Verenigd
    Koninkrijk wordt gemachtigd weefsels van synthetische stapelvezels, van post 56.07
    A, categorie 3, van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
