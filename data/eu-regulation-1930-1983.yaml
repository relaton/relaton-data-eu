title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1930/83 of 13 July 1983 re-establishing
    the levying of customs duties on melamine, falling within subheading 29.35 ex
    Q and originating in Romania, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1930/83 de la Commission du 13 juillet 1983 portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire de Roumanie,
    bénéficiaire des préférences tarifaires prévues au règlement (CEE) no 3377/82
    du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1930/83 der Kommission vom 13. Juli 1983 zur Wiedereinführung
