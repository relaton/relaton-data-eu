title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3386/87 of 11 November 1987 re-establishing
    the levying of customs duties on travel goods and articles of apparel and clothing
    accessories, of leather or of composition leather falling within subheadings 42.02
    B and 42.03 A, B II, III, C, originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3386/87 de la Commission du 11 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux articles
    de voyage et aux vêtements et accessoires du vêtement en cuir naturel, artificiel
    ou reconstitué des sous-positions 42.02 B et 42.03 A; B II, III; C du tarif douanier
    commun, originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3386/87 der Kommission vom 11. November 1987 zur Wiedereinführung
    der Erhebung der Zölle für Reiseartikel und für Bekleidung und Bekleidungszubehör
    aus Leder oder Kunstleder der Tarifstellen 42.02 B; 42.03 A, B II, B III und C
    des Gemeinsamen Zolltarifs mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3386/87 af 11. november 1987 om genindførelse
    af opkrævning af told for rejseartikler og beklædningsgenstande og tilbehør
    dertil, af læder eller kunstlæder henhørende under pos. 42.02 B og 42.03 A,
    B II, B III, C i den fælles toldtarif med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
