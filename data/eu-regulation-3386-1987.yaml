  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3386/87 della Commissione dell' 11 novembre 1987 che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti da viaggio
    e agli oggetti di vestiario e loro accessori di cuoio o di pelli, naturali, artificiali
    o ricostituiti, delle sottovoci 42.02 B, 42.03 A, B II, B III e C della tariffa
    doganale comune originari dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3386/87 van de Commissie van 11 november 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op reisartikelen
    en kleding en kledingtoebehoren, van leder of van kunstleder, van de postonderverdelingen
    42.02 B; 42.03 A, B II, B III en C van het gemeenschappelijk douanetarief, van
    oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3924/86 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
