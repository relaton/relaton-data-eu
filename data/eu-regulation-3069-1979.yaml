title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3069/79 of 20 December 1979 derogating in
    respect of the countries of the Central American Common Market from Articles 1,
    6 and 13 of Commission Regulation (EEC) No 3067/79 of 20 December 1979 on the
    definition of the concept of originating products for purposes of the application
    of tariff preferences granted by the European Economic Community in respect of
    certain products from developing countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3069/79 de la Commission, du 20 décembre 1979, portant
    dérogation, pour les pays du Marché commun de l' Amérique centrale, aux articles
    1er, 6 et 13 du règlement (CEE) n° 3067/79 de la Commission, du 20 décembre
    1979, relatif à la définition de la notion de produits originaires pour l' application
    de préférences tarifaires accordées par la Communauté économique européenne
    à certains produits de pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3069/79 der Kommission vom 20. Dezember 1979 über
    die zugunsten der Länder des gemeinsamen Marktes von Mittelamerika vorgesehene
    Abweichung von den Artikeln 1, 6 und 13 der Verordnung (EWG) Nr. 3067/79 der Kommission
    vom 20. Dezember 1979 über die Begriffsbestimmung des Warenursprungs bei der
    Anwendung der von der Europäischen Wirtschaftsgemeinschaft für bestimmte Waren
    aus Entwicklungsländern gewährten Zollpräferenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3069/79 af 20. december 1979 om undtagelse
