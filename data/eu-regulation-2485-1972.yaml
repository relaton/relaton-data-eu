  content: Règlement (CEE) n° 2485/72 du Conseil, du 29 novembre 1972, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs, de la sous-position 08.04 B I du tarif douanier commun, présentés en emballages
    immédiats d'un contenu net inférieur ou égal à 15 kilogrammes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2485/72 des Rates vom 29. November 1972 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Weintrauben,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 kg oder
    weniger, der Tarifstelle 08.04 B I des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2485/72 del Consiglio, del 29 novembre 1972, relativo
    all'apertura, alla ripartizione e alle modalità di gestione del contingente tariffario
    comunitario per le uve secche, della sottovoce n. 08.04 B I della tariffa doganale
    comune, presentate in imballaggi immediati di contenuto netto di 15 kg o meno
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2485/72 van de Raad van 29 november 1972 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor rozijnen en krenten van onderverdeling 08.04 B I van het gemeenschappelijk
    douanetarief, in verpakkingen met een netto-inhoud per onmiddellijke verpakking
    van 15 kilogram of minder
