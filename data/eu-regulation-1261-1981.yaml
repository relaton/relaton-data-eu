  content: Commission Regulation (EEC) No 1261/81 of 12 May 1981 amending Regulations
    (EEC) No 1107/68 and (EEC) No 2496/78 as regards the level of aid for the private
    storage of Grana Padano, Parmigiano Reggiano and Provolone cheeses
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1261/81 de la Commission, du 12 mai 1981, modifiant
    les règlements (CEE) n° 1107/68 et (CEE) n° 2496/78 en ce qui concerne le niveau
    des aides pour le stockage privé des fromages grana padano et parmigiano-reggiano
    et du fromage provolone
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1261/81 der Kommission vom 12. Mai 1981 zur Änderung
    der Verordnungen (EWG) Nr. 1107/68 und (EWG) Nr. 2496/78 hinsichtlich der Höhe
    der Beihilfe für die private Lagerhaltung der Käsesorten Grana Padano, Parmigiano-Reggiano
    und Provolone
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1261/81 af 12. maj 1981 om ændring
    af forordning (EØF) nr. 1107/68 og (EØF) nr. 2496/78 for så vidt angår størrelsen
    af støtte til privat oplagring af ostene Grana Padano og Parmigiano-Reggiano
    samt Provolone
  type: main
- language: el
  script: Grek
