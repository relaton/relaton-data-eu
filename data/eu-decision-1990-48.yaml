    de blé dur ne répondant pas aux exigences de la directive 66/402/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 26. Januar 1990 zur Ermaechtigung der Griechischen
    Republik, voruebergehend Saatgut von Hartweizen zum Verkehr zuzulassen, das den
    Anforderungen der Richtlinie 66/402/EWG des Rates nicht entspricht (90/48/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 26. januar 1990 om bemyndigelse af Den Hellenske
