  script: Latn
  content: '2000/196/EC: Commission Decision of 22 February 2000 refusing the placing
    on the market of Stevia rebaudiana Bertoni: plants and dried leaves as a novel
    food or novel food ingredient under Regulation (EC) No 258/97 of the European
    Parliament and of the Council (notified under document number C(2000) 77) (Only
    the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
