    plantes et feuilles séchées» en tant que nouvel aliment ou nouvel ingrédient
    alimentaire conformément au règlement (CE) nº 258/97 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2000) 77] (Le texte en langue néerlandaise
    est le seul faisant foi.)'
