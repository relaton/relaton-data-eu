title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2655/92 of 8 September 1992 restricting use
    of the procedure for the international transport of goods under cover of TIR carnets
    (TIR Convention) in the case of consignments travelling between two points situated
    in the European Economic Community via the territories of the Republics of Serbia
    and Montenegro
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2655/92 du Conseil, du 8 septembre 1992, limitant
    l'utilisation du régime du transport international des marchandises sous le couvert
    de carnets TIR (convention TIR) pour les envois effectués entre deux points situés
    dans la Communauté économique européenne et devant emprunter le territoire
    des Républiques de Serbie et du Monténégro
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2655/92 des Rates vom 8. September 1992 zur Beschränkung
    des internationalen Warenverkehrs mit Carnet TIR (TIR-Übereinkommen) für Sendungen
    zwischen zwei Orten der Europäischen Wirtschaftsgemeinschaft und über das Gebiet
    der Republiken Serbien und Montenegro
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2655/92 af 8. september 1992 om begrænsning
    af brugen af toldkonventionen om international godstransport på grundlag af TIR-carneter
    (TIR-konventionen) for forsendelser mellem to steder i Det Europæiske Økonomiske
    Fællesskab, som passerer Republikkerne Serbien og Montenegros territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2655/92 του Συμβουλίου
    της 8ης Σεπτεμβρίου 1992 που περιορίζει τη χρήση
    του καθεστώτος διεθνούς μεταφοράς εμπορευμάτων
    με καρνέ TIR (σύμβαση TIR) για τις αποστολές που
    πραγματοποιούνται μεταξύ δύο σημείων ευρισκόμενων
    εντός της Ευρωπαϊκής Οικονομικής Κοινότητας
    και οι οποίες υποχρεούνται να διέλθουν από
    το έδαφος των Δημοκρατιών της Σερβίας και του
    Μαυροβουνίου
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2655/92, annettu 8 päivänä syyskuuta 1992,
    TIR-carnet'ihin merkittyjen tavaroiden kansainvälistä kuljetusta koskevan menettelyn
    (TIR-yleissopimus) käytön rajoittamisesta kahden Euroopan talousyhteisön alueella
    sijaitsevan paikan välisten, Serbian ja Montenegron tasavaltojen alueen kautta
    tapahtuvien tavaralähetysten osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2655/92 del Consiglio, dell'8 settembre 1992, che
    limita l'utilizzazione del regime del trasporto internazionale delle merci sotto
    scorta di carnet TIR (convenzione TIR) per le spedizioni che sono effettuate tra
    due località situate nella Comunità economica europea e che devono attraversare
    il territorio delle Repubbliche di Serbia e di Montenegro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2655/92 van de Raad van 8 september 1992 tot beperking
    van het gebruik van het stelsel van internationaal vervoer van goederen onder
    dekking van het document TIR (TIR-Overeenkomst) voor verzendingen tussen twee
    punten gelegen in de Europese Economische Gemeenschap via het grondgebied van
    de Republieken Servië en Montenegro
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2655/92 do Conselho, de 8 de Setembro de 1992, que
    limita a utilização do regime do transporte internacional de mercadorias a coberto
    de cadernetas TIR (convenção TIR) nº que se refere às expedições efectuadas
    entre dois pontos situados na Comunidade Económica Europeia que devam atravessar
    o território das Repúblicas da Sérvia e do Montenegro
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2655/92 del Consejo, de 8 de septiembre de 1992, por
    el que se limita la utilización del régimen de transporte internacional de mercancías
    al amparo de los cuadernos TIR (Convenio TIR) para los envíos entre dos puntos
    situados en la Comunidad Económica Europea a través del territorio de las Repúblicas
    de Serbia y de Montenegro
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 2655/92 av den 8 september 1992 om begränsning
