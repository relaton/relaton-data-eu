  script: Latn
  content: '2001/441/EC: Commission Decision of 29 May 2001 authorising Member States
    to provide for derogations from certain provisions of Council Directive 2000/29/EC
    in respect of plants of strawberry (Fragaria L.), intended for planting, other
    than seeds, originating in Argentina (notified under document number C(2001) 1485)'
  type: main
- language: fr
  script: Latn
