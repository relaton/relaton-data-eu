title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1314/71 du Conseil, du 21 juin 1971, établissant,
    pour certains produits des chapitres 1 à 24 du tarif douanier commun, un système
    de préférences généralisées en faveur des pays en voie de développement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1314/71 des Rates vom 21. Juni 1971 über die Einführung
    eines allgemeinen Präferenzsystems für bestimmte Erzeugnisse der Kapitel 1 bis
    24 des Gemeinsamen Zolltarifs zugunsten von Entwicklungsländern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1314/71 del Consiglio, del 21 giugno 1971, che attua
    un sistema di preferenze generalizzate in favore dei paesi in via di sviluppo
    per taluni prodotti dei capitoli 1 - 24 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1314/71 van de Raad van 21 juni 1971 houdende invoering
    van een stelsel van algemene preferenties ten behoeve van de ontwikkelingslanden
    voor sommige produkten van de hoofdstukken 1 tot en met 24 van het gemeenschappelijk
    douanetarief
  type: main
