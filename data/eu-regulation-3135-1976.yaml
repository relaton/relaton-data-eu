  script: Latn
  content: Commission Regulation (EEC) No 3135/76 of 22 December 1976 amending Regulation
    (EEC) No 1687/76 laying down common detailed rules for verifying the use and/or
    destination of products from intervention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3135/76 de la Commission, du 22 décembre 1976 portant
    modification du règlement (CEE) n° 1687/76 établissant les modalités communes
    de contrôle de l' utilisation et/ou de la destination de produits provenant de
    l' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3135/76 der Kommission vom 22. Dezember 1976 zur Änderung
    der Verordnung (EWG) Nr. 1687/76 zur Festlegung gemeinsamer Durchführungsbestimmungen
    für die Überwachung der Verwendung und/oder Bestimmung von Erzeugnissen aus
    den Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3135/76 af 22. december 1976 om ændring
    af forordning (EØF) nr. 1687/76 om fælles gennemførelsesbestemmelser for kontrol
    med anvendelse af og/eller bestemmelse for produkter fra intervention
  type: main
- language: el
  script: Grek
