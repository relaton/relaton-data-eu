    από τήν παρέμβαση»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3135/76 della Commissione, del 22 dicembre 1976, recante
    modifica del regolamento (CEE) n. 1687/76 che stabilisce modalità comuni di controllo
    dell' utilizzazione e/o della destinazione di prodotti provenienti dall' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3135/76 van de Commissie van 22 december 1976 houdende
    wijziging van Verordening (EEG) nr. 1687/76 tot vaststelling van gemeenschappelijke
    bepalingen inzake de controle op het verbruik en/of de bestemming van produkten
    uit interventie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3135/76 da Comissão, de 22 de Dezembro de 1976,
