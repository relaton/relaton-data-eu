  script: Latn
  content: Commission Delegated Regulation (EU) 2021/473 of 18 December 2020 supplementing
    Regulation (EU) 2019/1238 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the requirements on information documents,
    on the costs and fees included in the cost cap and on risk-mitigation techniques
    for the pan-European Personal Pension Product
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/473 de la Commission du 18 décembre 2020
    complétant le règlement (UE) 2019/1238 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant, pour le produit paneuropéen
    d’épargne-retraite individuelle, les exigences régissant les documents d’information,
    les coûts et frais inclus dans le plafond des coûts et les techniques d’atténuation
    des risques
  type: main
- language: de
  script: Latn
