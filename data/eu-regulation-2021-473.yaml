    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/473 della Commissione del 18 dicembre 2020
    che integra il regolamento (UE) 2019/1238 del Parlamento europeo e del Consiglio
