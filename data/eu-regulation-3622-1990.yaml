  content: Commission Regulation (EEC) No 3622/90 of 14 December 1990 authorizing
    the conclusion of long-term private storage contracts for table wine, grape must,
    concentrated grape must and rectified concentrated grape must in respect of the
    1990/91 wine year
  type: main
- language: fr
  script: Latn
