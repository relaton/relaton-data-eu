title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1515/74 of the Commission of 18 June 1974 on the application
    of inward processing arrangements in trade between the Member States of the Community
    as originally constituted and the new Member States, and between the new Member
    States themselves, for such time as customs duties are levied in such trade
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº1515/74 de la Commission, du 18 juin 1974, relatif
    à l' application du régime du perfectionnement actif dans les échanges entre
    les États membres de la Communauté dans sa composition originaire et les nouveaux
    États membres, et entre les nouveaux États membres, pendant la période durant
    laquelle des droits de douane sont perçus lors de ces échanges
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1515/74 der Kommission vom 18. Juni 1974 über die
    Anwendung des aktiven Veredelungsverkehrs im Handel zwischen den Mitgliedstaaten
    der Gemeinschaft in ihrer ursprünglichen Zusammensetzung und den neuen Mitgliedstaaten
    sowie zwischen den neuen Mitgliedstaaten, solange im Rahmen dieses Handels Zölle
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1515/74 af 18. juni 1974 om anvendelse
    af proceduren for aktiv forædling i samhandelen mellem Fællesskabet i dets oprindelige
    udstrækning og de nye medlemsstater samt mellem de nye medlemsstater indbyrdes
    i det tidsrum, hvor opkrævning af told finder sted i denne samhandel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1515/74 της Επιτροπής
    της 18ης Ιουνίου 1974 περί εφαρμογής του καθεστώτος
    τελειοποιήσεως προς επανεξαγωγή στις συναλλαγές
    μεταξύ των κρατών μελών της Κοινότητος, στην
    αρχική της σύνθεση, και των νέων κρατών μελών,
    και μεταξύ νέων κρατών μελών, στην περίοδο
    κατά τη διάρκεια της οποίας εισπράττονται
    δασμοί κατά τις συναλλαγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1515/74 della Commissione, del 18 giugno 1974, relativo
    all' applicazione del regime del perfezionamento attivo negli scambi tra la Comunità
    nella sua composizione originaria e i nuovi Stati membri, e fra i nuovi Stati
    membri, nel periodo di riscossione dei dazi doganali su tali scambi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1515/74 van de Commissie van 18 juni 1974 inzake
    de toepassing van de regeling "actieve veredeling' ' in het handelsverkeer tussen
    de Lid-Staten van de Gemeenschap in haar oorspronkelijke samenstelling en de nieuwe
    Lid-Staten, en tussen de nieuwe Lid-Staten onderdeling, gedurende de periode waarin
    in dit handelsverkeer douanerechten worden geheven
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº1515/74 de la Comisión, de 18 de junio de 1974, relativo
    a la aplicación del régimen de perfeccionamiento activo en los intercambios
    entre los Estados miembros de la Comunidad en su composición original y los nuevos
    Estados miembros, y entre los nuevos Estados miembros, durante el período en
    el que se perciban derechos de aduana por dichos intercambios
