    251 în conformitate cu Regulamentul (CE) nr. 1107/2009 al Parlamentului European
    și al Consiliului privind introducerea pe piață a produselor fitosanitare,
    precum și de modificare a anexei la Regulamentul de punere în aplicare (UE)
    nr. 540/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/19 zo 7. januára 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh obnovuje schválenie účinnej
