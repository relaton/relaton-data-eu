    и на Съвета относно пускането на пазара на
    продукти за растителна защита, на одобрението
    на активното вещество Purpureocillium lilacinum, щам 251,
    и за изменение на приложението към Регламент
    за изпълнение (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
