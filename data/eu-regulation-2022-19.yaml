    szczep 251, zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (WE) nr
    1107/2009 dotyczącym wprowadzania do obrotu środków ochrony roślin, oraz w
    sprawie zmiany załącznika do rozporządzenia wykonawczego (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/19 da Comissão de 7 de janeiro de
