    251, em conformidade com o Regulamento (CE) n.o 1107/2009 do Parlamento Europeu
    e do Conselho relativo à colocação dos produtos fitofarmacêuticos no mercado,
    e que altera o anexo do Regulamento de Execução (UE) n.o 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/19 al Comisiei din 7 ianuarie
