  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/19 af 7. januar 2022
    om fornyelse af godkendelsen af aktivstoffet Purpureocillium lilacinum stamme
    251, jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1107/2009 om markedsføring
    af plantebeskyttelsesmidler, og om ændring af bilaget til Kommissionens gennemførelsesforordning
    (EU) nr. 540/2011
  type: main
- language: el
  script: Grek
