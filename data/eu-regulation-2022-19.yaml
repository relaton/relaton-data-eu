    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/19, 7. jaanuar 2022, millega pikendatakse
    toimeaine Purpureocillium lilacinum (tüvi 251) heakskiitu vastavalt Euroopa Parlamendi
    ja nõukogu määrusele (EÜ) nr 1107/2009 taimekaitsevahendite turulelaskmise
