    tar-razza 251 f’konformità mar-Regolament (KE) Nru 1107/2009 tal-Parlament
    Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta’ prodotti għall-protezzjoni
    tal-pjanti, u li jemenda l-Anness tar-Regolament ta’ Implimentazzjoni tal-Kummissjoni
    (UE) Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/19 van de Commissie van 7 januari 2022
