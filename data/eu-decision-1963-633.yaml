title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 novembre 1963, autorisant la République
    française à différer le rapprochement des droits des tarifs spéciaux de la
    Guyane, de la Martinique et de la Réunion vers ceux du Tarif douanier commun
    en ce qui concerne les tabacs fabriqués
  type: main
- language: de
  script: Latn
  content: '63/633/EWG: Entscheidung der Kommission vom 11. November 1963, mit der
    die Französische Republik ermächtigt wird, für verarbeiteten Tabak die Angleichung
    der Zollsätze der Sondertarife von Guayana, Martinique und Réunion an diejenigen
    des Gemeinsamen Zolltarifs aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/633/CEE: Decisione della Commissione dell''11 novembre 1963 che autorizza
    la Repubblica francese a differire il ravvicinamento dei dazi previsti nelle tariffe
    speciali della Guaina, della Martinica e dell''Isola della Riunione a quelli della
    tariffa doganale comune per quanto riguarda i tabacchi lavorati'
  type: main
- language: nl
  script: Latn
  content: '63/633/EEG: Beschikking van de Commissie van 11 november 1963 waarbij
    de Franse Republiek wordt gemachtigd tot uitstel van de aanpassing der rechten
    van de speciale douanetarieven voor Guyana, Martinique en Réunion aan het gemeenschappelijk
    douanetarief ten aanzien van tabaksfabrikaten'
  type: main
