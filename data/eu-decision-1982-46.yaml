title:
- language: en
  script: Latn
  content: '82/46/EEC: Commission Decision of 15 January 1982 changing the import
    arrangements established by Commission Decision 81/248/EEC and applied in the
    Federal Republic of Germany in respect of Albania, Bulgaria, Hungary, Poland,
    Czechoslovakia, the USSR, Vietnam, North Korea and Mongolia regarding glass inners
    for vacuum flasks or for other vacuum vessels, finished (Only the German text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/46/CEE: Décision de la Commission, du 15 janvier 1982, modifiant le
    régime d''importation prévu par la décision 81/248/CEE de la Commission et
    appliqué en République fédérale d''Allemagne à l''égard de l''Albanie, la
    Bulgarie, la Hongrie, la Pologne, la Tchécoslovaquie, l''Union soviétique, le
    Viêt-nam, la Corée du Nord et la Mongolie en ce qui concerne les ampoules de
    verre pour récipients isolants, finies (Le texte en langue allemande est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '82/46/EWG: Entscheidung der Kommission vom 15. Januar 1982 zur Änderung
    der durch Entscheidung 81/248/EWG der Kommission festgelegten und in der Bundesrepublik
    Deutschland gegenüber Albanien, Bulgarien, Ungarn, Polen, der Tschechoslowakei,
    der UdSSR, Vietnam, Nordkorea und der Mongolei für Glaskolben für Isolierbehälter,
    fertig, angewandten Einfuhrregelungen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/46/EØF: Kommissionens beslutning af 15. januar 1982 om ændring af
    den importordning, der er fastsat i Kommissionens beslutning 81/248/EØF, og som
    anvendes i Forbundsrepublikken Tyskland over for Albanien, Bulgarien, Ungarn,
    Polen, Tjekkoslovakiet, Sovjetunionen, Vietnam, Nordkorea og Mongoliet, for så
    vidt angår glaskolber til termoflasker og lignende isotermiske beholdere, i andre
    tilfælde (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/46/EOK: Απόφαση τής Επιτροπής τής 15ης Ιανουαρίου
    1982 περί τροποποιήσεως τού καθεστώτος εισαγωγής
    πού προβλέπεται από τήν απόφαση 81/248/EOK τής Επιτροπής
    πού εφαρμόζεται εις τήν Ομοσπονδιακή Δημοκρατία
    τής Γερμανίας έναντι τής Αλβανίας, τής Βουλγαρίας,
