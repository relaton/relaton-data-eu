    διά μονωτικά δοχεία έτοιμες (Το κείμενο στην
    γερμανική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/46/CEE: Decisione della Commissione, del 15 gennaio 1982, che modifica
    il regime d''importazione, istituito con decisione 81/248/CEE della Commissione,
    applicato nella Repubblica federale di Germania nei confronti dell''Albania, della
    Bulgaria, dell''Ungheria, della Polonia, della Cecoslovacchia, dell''URSS, del
