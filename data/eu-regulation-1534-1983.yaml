title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1534/83 of 13 June 1983 re-establishing
    the levying of customs duties on paint, distemper and brushes, falling within
    subheading 96.01 B ex III and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1534/83 de la Commission du 13 juin 1983 portant rétablissement
    de la perception des droits de douane applicables à certains brosses, pinceaux
    et articles de brosserie, de la sous-position 96.01 B ex III du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1534/83 der Kommission vom 13. Juni 1983 zur Wiedereinführung
    der Erhebung der Zölle für Farbpinsel, ähnliche Pinsel und Bürsten, der Tarifstelle
    96.01 B ex III, mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr.
    3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1534/83 af 13. juni 1983 om genindførelse
    af opkrævning af told for pensler til kunstnere samt til undervisningsbrug, henhørende
    under position 96.01 B ex III i den fælles toldtarif og med oprindelse i Hongkong,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1534/83 της Επιτροπής
    της 13ης Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ψήκτρες και χρωστήρες
    διά ζωγραφικήν, της διακρίσεως 96.01 Β ex ΙΙΙ του
    Κοινού Δασμολογίου, καταγωγής Χονγκ Κονγκ,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1534/83 della Commissione del 13 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili alle spazzole, pennelli e oggetti
    di spazzolificio della sottovoce 96.01 B ex III della tariffa doganale comune,
    originari di Hong Kong beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1534/83 van de Commissie van 13 juni 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op borstels en
    kwasten van postonderverdeling 96.01 B ex III, van oorsprong uit Hong-Kong, waarvoor
    de in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefprefenties zijn
    verleend
  type: main
