title:
- language: en
  script: Latn
  content: '80/419/EEC: Commission Decision of 25 March 1980 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, falling within heading No ex 60.02 of
    the Common Customs Tarif (category 10), originating in Taiwan and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/419/CEE: Décision de la Commission, du 25 mars 1980, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, de la position ex 60.02 du tarif douanier commun
    (code Nimexe: 60.02-40) (catégorie 10), originaire de T''ai-wan et mise en libre
    pratique dans les autres Etats membres (Le texte en langue française est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/419/EWG: Entscheidung der Kommission vom 25. März 1980, mit der die
    Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer ex 60.02 des Gemeinsamen Zolltarifs (Kategorie
    10) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/419/EØF: Kommissionens beslutning af 25. marts 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, som henhører under pos. ex 60.02 i den fælles toldtarif (kategori
    10), har oprindelse i Taiwan og frit kan omsættes i de øvrige medlemsstater
    (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/419/CEE: Decisione della Commissione, del 25 marzo 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, della voce ex 60.02 della tariffa doganale comune (categoria
    10), originari di Taiwan e messi in libera pratica negli altri Stati membri (Il
    testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/419/EEG: Beschikking van de Commissie van 25 maart 1980 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk, van post ex 60.02
    van het gemeenschappelijk douanetarief (categorie 10), van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
