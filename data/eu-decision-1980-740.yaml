id: EUDecision1980740
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/740/EEC: Commission Decision of 3 July 1980 authorizing the French
    Republic not to apply Community treatment to woven and knitted or crocheted skirts,
    falling within subheadings ex 60.05 A II and ex 61.02 B II of the Common Customs
    Tariff (category 26), originating in Hong Kong in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/740/CEE: Décision de la Commission, du 3 juillet 1980, autorisant
    la République française à exclure du traitement communautaire les robes tissées
    et robes de bonneterie, des sous-positions ex 60.05 A II et ex 61.02 B II du tarif
    douanier commun (catégorie 26), originaires de Hong-kong et mises en libre pratique
    dans les autres Etats membres (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/740/EWG: Entscheidung der Kommission vom 3. Juli 1980, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Kleider aus Geweben und Gewirken
    der Tarifstellen ex 60.05 A II und ex 61.02 B II des Gemeinsamen Zolltarifs (Kategorie
    26) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/740/EØF: Kommissionens beslutning af 3. juli 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede kjoler
    og kjoler af trikotage, som henhører under pos. ex 60.05 A II og ex 61.02 B II
    i den fælles toldtarif (kategori 26), har oprindelse i Hongkong og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/740/CEE: Decisione della Commissione, del 3 luglio 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli abiti interi
    tessuti ed a maglia, delle sottovoci ex 60.05 A II e ex 61.02 B II della tariffa
    doganale comune, categoria 26, originari di Hong Kong e messi in libera pratica
    negli altri Stati membri (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/740/EEG: Beschikking van de Commissie van 3 juli 1980 waarbij de Franse
    Republiek wordt gemachtigd japonnen, geweven en van brei- of haakwerk, van de
    posten ex 60.05 A II en ex 61.02 B II van het gemeenschappelijk douanetarief (categorie
    26), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de tekst in
    de Franse taal is authentiek)'
  type: main
