title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3866/91 of 16 December 1991 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1992
    fishing year
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3866/91 DE LA COMMISSION du 16 décembre 1991 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1992 intervenant dans le calcul de la compensation financière
    et de l'' avance y afférente #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3866/91 DER KOMMISSION vom 16. Dezember 1991 zur
    Festsetzung des Pauschalwerts für das Fischwirtschaftsjahr 1992 für die aus
    dem Handel genommenen Fischereierzeugnisse, der zur Berechnung des finanziellen
    Ausgleichs und des entsprechenden Vorschusses dient #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3866/91 af 16. december 1991 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1992
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3866/91 της Επιτροπής
    της 16ης Δεκεμβρίου 1991 περί καθορισμού της κατ'
    αποκοπήν αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1992
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3866/91 DELLA COMMISSIONE del 16 dicembre 1991 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell'' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1992 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3866/91 VAN DE COMMISSIE van 16 december 1991 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1992 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 3866/91 DA COMISSÃO de 16 de Dezembro de 1991 que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1992 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 3866/91 DE LA COMISIÓN de 16 de diciembre de 1991
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1992 que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta #'
  type: main
