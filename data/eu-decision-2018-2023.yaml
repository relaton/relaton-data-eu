    517/2014 Evropskega parlamenta in Sveta o fluoriranih toplogrednih plinih, referenčnih
    vrednosti za obdobje od 30. marca 2019 do 31. decembra 2020 za proizvajalce ali
    uvoznike s sedežem v Združenem kraljestvu, ki so zakonito dali na trg fluorirane
    ogljikovodike od 1. januarja 2015 dalje, kot so sporočili v skladu z navedeno
    uredbo (notificirano pod dokumentarno številko C(2018) 8801)
  type: main
