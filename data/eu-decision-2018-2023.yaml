    които законно са пускали на пазара флуоровъглеводороди
    в периода, започващ от 1 януари 2015 г., както е
    докладвано съгласно горепосочения регламент
    (нотифицирано под номер С(2018) 8801)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2018/2023 ze dne 17. prosince 2018
