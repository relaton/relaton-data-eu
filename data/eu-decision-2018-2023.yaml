    Evropského parlamentu a Rady (EU) č. 517/2014 o fluorovaných skleníkových
    plynech stanoví referenční hodnoty, pokud jde o referenční hodnoty na období
    od 30. března 2019 do 31. prosince 2020 pro výrobce nebo dovozce usazené ve
    Spojeném království, kteří podle uvedeného nařízení od 1. ledna 2015
    zákonně uvedli na trh částečně fluorované uhlovodíky (oznámeno pod číslem
