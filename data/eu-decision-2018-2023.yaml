id: EUDecision20182023
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2018/2023 of 17 December 2018 on
    amending Implementing Decision (EU) 2017/1984 determining, pursuant to Regulation
    (EU) No 517/2014 of the European Parliament and of the Council on fluorinated
    greenhouse gases, reference values as regards reference values for the period
    from 30 March 2019 to 31 December 2020 for producers or importers established
    within the United Kingdom, which have lawfully placed on the market hydrofluorocarbons
    from 1 January 2015, as reported under that Regulation (notified under document
    C(2018) 8801)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/2023 de la Commission du 17 décembre
    2018 modifiant la décision d'exécution (UE) 2017/1984 établissant, conformément
    au règlement (UE) n° 517/2014 du Parlement européen et du Conseil relatif aux
    gaz à effet de serre fluorés, les valeurs de référence en ce qui concerne
    les valeurs de référence applicables, pendant la période comprise entre le
    30 mars 2019 et le 31 décembre 2020, aux producteurs ou importateurs établis
    au Royaume-Uni qui ont légalement mis sur le marché des hydrofluorocarbones
    à partir du 1er janvier 2015 selon les données communiquées en vertu dudit
    règlement [notifiée sous le numéro C(2018) 8801]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/2023 der Kommission vom 17. Dezember
    2018 zur Änderung des Durchführungsbeschlusses (EU) 2017/1984 zur Bestimmung
    — gemäß der Verordnung (EU) Nr. 517/2014 des Europäischen Parlaments und
    des Rates über fluorierte Treibhausgase — von Referenzwerten in Bezug auf die
    Referenzwerte für den Zeitraum 30. März 2019 bis 31. Dezember 2020 für im Vereinigten
    Königreich ansässige Hersteller oder Einführer, die gemäß der Verordnung
    gemeldete Mengen teilfluorierter Kohlenwasserstoffe ab dem 1. Januar 2015 rechtmäßig
    in Verkehr gebracht haben (Bekannt gegeben unter Aktenzeichen C(2018) 8801)
  type: main
