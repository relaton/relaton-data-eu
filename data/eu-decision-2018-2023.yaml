    de la Comisión, por la que se determinan valores de referencia, de conformidad
    con el Reglamento (UE) n.° 517/2014 del Parlamento Europeo y del Consejo, sobre
    los gases fluorados de efecto invernadero, por lo que respecta a los valores de
    referencia para el período comprendido entre el 30 de marzo de 2019 y el 31 de
    diciembre de 2020 de los productores o importadores establecidos en el Reino Unido
    que hayan notificado, en el marco del Reglamento, haber comercializado legalmente
    hidrofluorocarburos desde el 1 de enero de 2015 [notificada con el número C(2018)
    8801]
  type: main
