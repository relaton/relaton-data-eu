  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2018/2023, annettu 17 päivänä
    joulukuuta 2018, fluoratuista kasvihuonekaasuista annetun Euroopan parlamentin
    ja neuvoston asetuksen (EU) N:o 517/2014 mukaisesta viitearvojen määrittämisestä
