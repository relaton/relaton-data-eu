    numerolla C(2018) 8801)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2018/2023 оd 17. prosinca 2018. o izmjeni
    Provedbene odluke (EU) 2017/1984 o utvrđivanju, u skladu s Uredbom (EU) br. 517/2014
