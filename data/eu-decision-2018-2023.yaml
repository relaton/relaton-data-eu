    al Consiliului privind gazele fluorurate cu efect de seră, a valorilor de referință
    în ceea ce privește valorile de referință aplicabile, în perioada cuprinsă
    între 30 martie 2019 și 31 decembrie 2020, producătorilor sau importatorilor
    stabiliți în Regatul Unit care au introdus hidrofluorcarburi în mod legal pe
    piață începând cu 1 ianuarie 2015, astfel cum s-a raportat în conformitate
    cu acest regulament [notificată cu numărul C(2018) 8801]
