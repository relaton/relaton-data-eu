    for perioden 3. december 1999-2. december 2002 af de fiskerimuligheder og det
    finansielle bidrag, der er omhandlet i aftalen mellem Det Europæiske Fællesskab
    og regeringen for Mauritius om fiskeri i de mauritiske farvande'
  type: main
- language: el
  script: Grek
