  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös, tehty 29 päivänä kesäkuuta 2000, Euroopan yhteisön
    ja Mauritiuksen hallituksen välisessä Mauritiuksen vesialueilla harjoitettavaa
    kalastusta koskevassa sopimuksessa määrätyt kalastusmahdollisuudet ja taloudellisen
    korvauksen 3 päivän joulukuuta 1992 ja 2 päivän joulukuuta 2002 väliseksi
    ajanjaksoksi vahvistavan pöytäkirjan väliaikaista soveltamista koskevan kirjeenvaihtona
    tehdyn sopimuksen tekemisestä
  type: main
- language: it
  script: Latn
