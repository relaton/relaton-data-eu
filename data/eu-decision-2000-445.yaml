    nach dem Abkommen zwischen der Europäischen Gemeinschaft und der Regierung von
    Mauritius über die Fischerei vor der Küste von Mauritius für die Zeit vom 3.
    Dezember 1999 bis zum 2. Dezember 2002'
  type: main
- language: da
  script: Latn
  content: '2000/445/EF: Rådets afgørelse af 29. juni 2000 om indgåelse af aftalen
