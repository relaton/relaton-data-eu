title:
- language: en
  script: Latn
  content: '2000/445/EC: Council Decision of 29 June 2000 concerning the conclusion
    of an Agreement in the form of an Exchange of Letters on the provisional application
    of the Protocol defining, for the period 3 December 1999 to 2 December 2002, the
    fishing opportunities and the financial contribution provided for by the Agreement
    between the European Community and the Government of Mauritius on fishing in the
    waters of Mauritius'
  type: main
- language: fr
  script: Latn
  content: '2000/445/CE: Décision du Conseil du 29 juin 2000 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant, pour la période du 3 décembre 1999 au 2 décembre 2002,
    les possibilités de pêche et la contrepartie financière prévues dans l''accord
    entre la Communauté européenne et le gouvernement de Maurice concernant la pêche
    dans les eaux mauriciennes'
  type: main
- language: de
  script: Latn
  content: '2000/445/EG: Beschluß des Rates vom 29. Juni 2000 über den Abschluß
