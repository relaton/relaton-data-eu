    ανταλλαγής επιστολών για την προσωρινή εφαρμογή
    του πρωτοκόλλου για τον καθορισμό, για την
    περίοδο από τις 3 Δεκεμβρίου 1999 έως τις 2 Δεκεμβρίου
    2002, των αλιευτικών δυνατοτήτων και της χρηματοδοτικής
    αντιστάθμισης που προβλέπεται από τη συμφωνία
