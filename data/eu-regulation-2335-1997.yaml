title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2335/97 of 24 November 1997 repealing Regulation
    (EEC) No 611/93 with respect to the imposition of a definitive anti-dumping duty
    on imports into the Community of certain electronic microcircuits known as DRAMs
    originating in the Republic of Korea
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2335/97 du Conseil du 24 novembre 1997 abrogeant le
    règlement (CEE) n° 611/93 en ce qui concerne l'institution d'un droit antidumping
    définitif sur les importations dans la Communauté de certaines microstructures
    électroniques, dites «DRAM», originaires de la République de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2335/97 des Rates vom 24. November 1997 zur Aufhebung
