    auf die Einfuhren bestimmter elektronischer Mikroschaltungen, sogenannter DRAMs,
    mit Ursprung in der Republik Korea in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2335/97 af 24. november 1997 om ophævelse
