title:
- language: en
  script: Latn
  content: '82/276/EEC: Commission Decision of 22 April 1982 establishing that the
    apparatus described as ''Perkin- Elmer - infrared spectrophotometer, model 283'',
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/276/CEE: Décision de la Commission, du 22 avril 1982, constatant que
    l''importation de l''appareil dénommé "Perkin-Elmer infrared spectrophotometer,
    model 283" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/276/EWG: Entscheidung der Kommission vom 22. April 1982, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer-Infrared Spectrophotometer, model 283" ,
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/276/EØF: Kommissionens beslutning af 22. april 1982 om fastslåelse
    af, at indførsel af apparatet "Perkin Elmer - Infrared Spectrophotometer, model
    283" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
