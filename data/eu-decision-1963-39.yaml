  content: Décision de la Commission portant prorogation et modification de sa décision
    du 10 octobre 1962 autorisant la perception d'une taxe compensatoire sur les importations
    en République fédérale d'Allemagne, de pain en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '63/39/EWG: Entscheidung der Kommission über die Verlängerung und Änderung
    ihrer Entscheidung vom 10. Oktober 1962 über die Erhebung einer Ausgleichsabgabe
    auf die Einfuhren von Brot aus dem Königreich der Niederlande in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/39/CEE: Decisione della Commissione che proroga e modifica la propria
    decisione del 10 ottobre 1962 che autorizza la Repubblica federale di Germania
    a riscuotere una tassa di compensazione sulle importazioni di pane in provenienza
    dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '63/39/EEG: Beschikking van de Commissie houdende verlenging en wijziging
    van haar beschikking van 10 oktober 1962, waarbij machtiging werd verleend tot
    het leggen van een compenserende heffing op de invoer in de Bondsrepubliek Duitsland
    van brood uit het Koninkrijk der Nederlanden'
