---
id: EUDecision202686
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Decision (EU) 2026/86 of the European Central Bank of 19 December 2025
    amending Decision (EU) 2016/456 (ECB/2016/3) as regards investigations in relation
    to the prevention of fraud, corruption and any other illegal activities affecting
    the financial interests of the Union and amending Decision (EU) 2020/1575 (ECB/2020/54)
    as regards the follow-up to suspected breaches of professional duties where the
    person concerned is a high-level ECB official (ECB/2025/45)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/86 de la Banque centrale européenne du 19 décembre
    2025 modifiant la décision (UE) 2016/456 (BCE/2016/3) en ce qui concerne les
    enquêtes en matière de lutte contre la fraude, la corruption et toute autre
    activité illégale portant atteinte aux intérêts financiers de l’Union et
    modifiant la décision (UE) 2020/1575 (BCE/2020/54) en qui concerne le suivi des
    manquements présumés aux obligations professionnelles lorsque la personne concernée
    est un responsable de haut niveau de la BCE (BCE/2025/45)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/86 der Europäischen Zentralbank vom19. Dezember 2025
    zur Änderung des Beschlusses (EU) 2016/456 (EZB/2016/3) im Hinblick auf Untersuchungen
    zur Bekämpfung von Betrug, Korruption und sonstigen gegen die finanziellen Interessen
    der Union gerichteten rechtswidrigen Handlungen sowie zur Änderung des Beschlusses
    (EU) 2020/1575 (EZB/2020/54) im Hinblick auf die Weiterverfolgung vermeintlicher
    Verstöße gegen berufliche Pflichten, die hochrangige Funktionsträger der EZB
    betreffen (EZB/2025/45)
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2026/86 на Европейската централна
    банка от 19 декември 2025 година за изменение
    на Решение (ЕС) 2016/456 (ЕЦБ/2016/3) по отношение на
    разследванията във връзка с предотвратяването
    на измами, корупция и всякакви други незаконни
    дейности, засягащи финансовите интереси на
    Съюза и за изменение на Решение (ЕС) 2020/1575 (ЕЦБ/2020/54)
    относно последващите действия във връзка с
    предполагаеми нарушения на професионалните
    задължения, когато засегнатото лице е високопоставен
    служител на ЕЦБ (ЕЦБ/2025/45)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropské centrální banky (EU) 2026/86 ze dne 19. prosince
    2025, kterým se mění rozhodnutí (EU) 2016/456 (ECB/2016/3), pokud jde o vyšetřování
    v souvislosti s předcházením podvodům, úplatkářství a jakýmkoli jiným
    protiprávním činnostem ohrožujícím finanční zájmy Unie, a kterým se
    mění rozhodnutí (EU) 2020/1575 (ECB/2020/54), pokud jde o přijímání opatření
    v návaznosti na podezření z porušení služebních povinností v případech,
    kdy je dotčenou osobou vysoce postavený úředník ECB (ECB/2025/45)
  type: main
- language: da
  script: Latn
  content: Den Europæiske Centralbanks afgørelse (EU) 2026/86 af 19. december 2025
    om ændring af afgørelse (EU) 2016/456 (ECB/2016/3) hvad angår undersøgelser
    i forbindelse med forebyggelse af svig, korruption og anden ulovlig aktivitet,
    der skader Unionens finansielle interesser og om ændring af afgørelse (EU) 2020/1575
    (ECB/2020/54) hvad angår opfølgningen på overtrædelser af tjenestepligter,
    når den berørte person er en højtstående embedsmand i ECB (ECB/2025/45)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2026/86 της Ευρωπαϊκής Κεντρικής
    Τράπεζας, της 19ης Δεκεμβρίου 2025, που τροποποιεί
    την απόφαση (ΕΕ) 2016/456 (ΕΚΤ/2016/3) ως προς τη διεξαγωγή
    ερευνών συνδεόμενων με την πρόληψη της απάτης,
    της διαφθοράς και κάθε άλλης παράνομης δραστηριότητας
    που θίγει τα οικονομικά συμφέροντα της Ένωσης
    και την απόφαση (ΕΕ) 2020/1575 (ΕΚΤ/2020/54) ως προς την
    παρακολούθηση εικαζόμενων παραβάσεων επαγγελματικού
    καθήκοντος που αφορούν ανώτατους λειτουργούς
    της ΕΚΤ (ΕΚΤ/2025/45)
  type: main
- language: et
  script: Latn
  content: Euroopa Keskpanga otsus (EL) 2026/86, 19. detsember 2025, millega muudetakse
    otsust (EL) 2016/456 (EKP/2016/3) seoses liidu finantshuve mõjutava pettuse,
    korruptsiooni ja muu ebaseadusliku tegevuse tõkestamisega läbiviidatavate juurdlustega,
    ja muudetakse otsust (EL) 2020/1575 (EKP/2020/54) seoses ametikohustuse rikkumise
    teabe edasise käsitlemisega, kui asjaomane isik on EKP kõrgetasemeline töötaja
    (EKP/2025/45)
  type: main
- language: fi
  script: Latn
  content: Euroopan keskuspankin päätös (EU) 2026/86, annettu 19 päivänä joulukuuta
    2025, päätöksen (EU) 2016/456 (EKP/2016/3) muuttamisesta petosten, lahjonnan
    ja unionin taloudellisia etuja vahingoittavan muun laittoman toiminnan torjuntaan
    liittyvien tutkimusten osalta ja päätöksen (EU) 2020/1575 (EKP/2020/54) muuttamisesta
    virkatoimintaan liittyvien velvoitteiden epäiltyjen rikkomisten jatkotoimien
    osalta, kun kyseessä oleva henkilö kuuluu EKP:n ylimpään johtoon (EKP/2025/45)
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2026/86 ón mBanc Ceannais Eorpach an 19 Nollaig 2025 lena
    leasaítear Cinneadh (AE) 2016/456 (BCE/2016/3) a mhéid a bhaineann le himscrúduithe
    i ndáil le calaois, éilliú agus aon ghníomhaíocht neamhdhleathach eile a
    dhéanann difear do leasanna airgeadais an aontais a chosc agus lena leasaítear
    Cinneadh (AE) 2020/1575 (BCE/2020/54) a mhéid a bhaineann leis an obair leantach
    ar sháruithe amhrasta ar dhualgais ghairmiúla i gcás inar comhlacht ardleibhéil
    bce é an duine lena mbaineann (BCE/2025/45)
  type: main
- language: hr
  script: Latn
  content: Odluka (EU) 2026/86 Europske središnje banke od 19. prosinca 2025. o izmjeni
    Odluke (EU) 2016/456 (ESB/2016/3) o istragama u području sprečavanja prijevara,
    korupcije i svih drugih nezakonitih aktivnosti koje utječu na financijske interese
    Unije i o izmjeni Odluke (EU) 2020/1575 (ESB/2020/54) u vezi s daljnjim postupanjem
    u slučaju sumnje na povredu profesionalnih dužnosti kada je prijavljena osoba
    visoki dužnosnik ESB-a (ESB/2025/45)
  type: main
- language: hu
  script: Latn
  content: Az Európai Központi Bank (EU) 2026/86 határozata (2025. december 19.)
    az (EU) 2016/456 határozatnak (EKB/2016/3) a csalás, a korrupció és az Unió
    pénzügyi érdekeit sértő bármely más jogellenes tevékenység megelőzésével
    kapcsolatos vizsgálatok tekintetében történő módosításáról és az (EU)
    2020/1575 határozatnak (EKB/2020/54) a feltételezett szakmai kötelezettségszegéseknek
    az EKB valamely vezető tisztségviselőjének érintettsége esetén történő
    nyomon követése tekintetében történő módosításáról (EKB/2025/45)
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2026/86 della Banca centrale europea, del 19 dicembre 2025,
    che modifica la decisione (UE) 2016/456 (BCE/2016/3) per quanto riguarda le indagini
    in materia di lotta contro le frodi, la corruzione e ogni altra attività illecita
    lesiva degli interessi finanziari dell’Unione e che modifica la decisione (UE)
    2020/1575 (BCE/2020/54) per quanto riguarda il monitoraggio delle presunte violazioni
    di doveri professionali laddove una persona interessata sia un’alta carica della
    BCE (BCE/2025/45)
  type: main
- language: lv
  script: Latn
  content: Eiropas Centrālās bankas Lēmums (ES) 2026/86 (2025. gada 19. decembris),
    ar ko Lēmumu (ES) 2016/456 (ECB/2016/3) groza attiecībā uz izmeklēšanu saistībā
    ar krāpšanas, korupcijas un citu tādu nelikumīgu darbību novēršanu, kas
    ietekmē Savienības finanšu intereses, un ar ko Lēmumu (ES) 2020/1575 (ECB/2020/54)
    groza attiecībā uz turpmākajiem pasākumiem saistībā ar aizdomām par profesionālo
    pienākumu pārkāpumiem, ja attiecīgā persona ir augsta līmeņa ECB amatpersona
    (ECB/2025/45)
  type: main
- language: lt
  script: Latn
  content: 2025 m. gruodžio 19 d. Europos Centrinio Banko sprendimas (ES) 2026/86,
    kuriuo dėl tyrimų, susijusių su Sąjungos finansiniams interesams kenkiančio
    sukčiavimo, korupcijos ar bet kokios kitos neteisėtos veiklos prevencija, iš
    dalies keičiamas Sprendimas (ES) 2016/456 (ECB/2016/3) ir kuriuo dėl tolesnių
    veiksmų, susijusių su įtariamais profesinių pareigų pažeidimais, kai atitinkamas
    asmuo yra ECB aukšto lygio tarnautojas, iš dalies keičiamas Sprendimas (ES)
    2020/1575 (ECB/2020/54) (ECB/2025/45)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni (UE) 2026/86 tal-Bank Ċentrali Ewropew tad-19 ta’ Diċembru
    2025 li temenda d-Deċiżjoni (UE) 2016/456 (BĊE/2016/3) dwar investigazzjonijiet
    fir-rigward tal-prevenzjoni tal-frodi, tal-korruzzjoni u ta’ kull attività
    illegali oħra li jaffettwaw l-interessi finanzjarji tal-Unjoni u li temenda d-Deċiżjoni
    (UE) 2020/1575 (BĊE/2020/54) dwar is-segwitu għal ksur suspettat ta’ dmirijiet
    professjonali meta l-persuna kkonċernata tkun uffiċjal ta’ livell għoli tal-BĊE
    (BĊE/2025/45)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2026/86 van de Europese Centrale Bank van 19 december 2025
    tot wijziging van Besluit (EU) 2016/456 (ECB/2016/3) voor wat betreft onderzoeken
    op het gebied van fraudepreventie, corruptie en elke andere onwettige activiteit
    die de financiële belangen van de Unie schaadt, en tot wijziging van Besluit
    (EU) 2020/1575 (ECB/2020/54) betreffende de opvolging van vermoedelijke schendingen
    van professionele verplichtingen waar de desbetreffende persoon een hoge ambtenaar
    van de ECB is (ECB/2025/45)
  type: main
- language: pl
  script: Latn
  content: Decyzja Europejskiego Banku Centralnego (UE) 2026/86 z dnia 19 grudnia
    2025 r. zmieniająca decyzję (UE) 2016/456 (EBC/2016/3) w odniesieniu do dochodzeń
    związanych z zapobieganiem nadużyciom finansowym, korupcji oraz innych bezprawnym
    działaniom mającym wpływ na interesy finansowe Unii oraz zmieniająca decyzję
    (UE) 2020/1575 (EBC/2020/54) w odniesieniu do działań następczych w związku
    z podejrzeniem naruszenia obowiązków służbowych w przypadku gdy osoba, której
    sprawa dotyczy, jest pracownikiem wysokiego szczebla Europejskiego Banku Centralnego
    (EBC/2025/45)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2026/86 do Banco Central Europeu, de 19 de dezembro de 2025,
    que altera a Decisão (UE) 2016/456 (BCE/2016/3) no que respeita aos inquéritos
    em matéria de luta contra a fraude, a corrupção e quaisquer outras atividades
    ilegais lesivas dos interesses financeiros da União e que altera a Decisão (UE)
    2020/1575 (BCE/2020/54) no que respeita ao seguimento de suspeitas de infração
    a deveres profissionais sempre que a pessoa em causa seja um alto responsável
    do BCE (BCE/2025/45)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2026/86 a Băncii Centrale Europene din 19 decembrie 2025
    de modificare a Deciziei (UE) 2016/456 (BCE/2016/3) în ceea ce privește investigațiile
    în materie de prevenire a fraudei, corupției și a oricăror alte activități
    ilegale care afectează interesele financiare ale Uniunii Europene și de modificare
    a Deciziei (UE) 2020/1575 (BCE/2020/54) privind acțiunile ulterioare corespunzătoare
    în cazul suspiciunilor de încălcare a atribuțiilor profesionale atunci când
    persoana vizată este un înalt funcționar al BCE (BCE/2025/45)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskej centrálnej banky (EÚ) 2026/86 z 19. decembra 2025,
    ktorým sa mení rozhodnutie (EÚ) 2016/456 (ECB/2016/3), pokiaľ ide o vyšetrovania
    v súvislosti s predchádzaním podvodom, korupcii a akýmkoľvek iným protiprávnym
    činom poškodzujúcim finančné záujmy únie, a ktorým sa mení rozhodnutie
    (EÚ) 2020/1575 (ECB/2020/54), pokiaľ ide o prijímanie opatrení v nadväznosti
    na podozrenia z porušenia služobných povinností, ak je dotknutou osobou vysokopostavený
    úradník ECB (ECB/2025/45)
  type: main
- language: sl
  script: Latn
  content: Sklep Evropske centralne banke (EU) 2026/86 z dne 19. decembra 2025 o spremembi
    Sklepa (EU) 2016/456 (ECB/2016/3) glede preiskav v zvezi s preprečevanjem goljufij,
    korupcije in drugih nezakonitih dejanj, ki škodijo finančnim interesom Unije,
    ter o spremembi Sklepa (EU) 2020/1575 (ECB/2020/54) glede nadaljnjega ukrepanja
    na podlagi suma kršitve poklicnih dolžnosti, kadar je zadevna oseba visoki uradnik
    ECB (ECB/2025/45)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2026/86 del Banco Central Europeo, de 19 de diciembre de
    2025, por la que se modifican la Decisión (UE) 2016/456 (BCE/2016/3) en lo que
    respecta a las investigaciones en materia de lucha contra el fraude, la corrupción
    y toda actividad ilegal que afecte a los intereses financieros de la Unión y
    la Decisión (UE) 2020/1575 (BCE/2020/54) en lo que respecta al seguimiento de
    presuntas infracciones de deberes profesionales que afecten a un alto cargo del
    BCE (BCE/2025/45)
  type: main
- language: sv
  script: Latn
  content: Europeiska centralbankens beslut (EU) 2026/86 av den 19 december 2025 om
    ändring av beslut (EU) 2016/456 (ECB/2016/3) vad gäller utredningar för att
    bekämpa bedrägerier, korruption och all annan olaglig verksamhet som riktar
    sig mot unionens ekonomiska intressen och om ändring av beslut (EU) 2020/1575
    (ECB/2020/54) vad gäller uppföljning av misstänkta överträdelser av tjänsterelaterade
    skyldigheter där den berörda personen är medlem i ett organ på hög nivå
    inom ECB (ECB/2025/45)
  type: main
