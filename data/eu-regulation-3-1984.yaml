title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3/84 of 19 December 1983 introducing arrangements
    for movement within the Community of goods sent from one Member State for temporary
    use in one or more other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3/84 du Conseil du 19 décembre 1983 instituant un
    régime de circulation intracommunautaire de marchandises expédiées d' un État
    membre en vue d' une utilisation temporaire dans un ou plusieurs autres États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3/84 des Rates vom 19. Dezember 1983 zur Einführung
    eines Verfahrens des innergemeinschaftlichen Verkehrs mit Waren, die zum vorübergehenden
    Gebrauch aus einem Mitgliedstaat in einen oder mehrere andere Mitgliedstaaten
    versandt werden
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3/84 af 19. december 1983 om en ordning for
    bevægelser inden for Fællesskabet af varer, der ekspederes fra en medlemsstat
    med henblik på varernes midlertidige anvendelse i en eller flere andre medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3/84 του Συμβουλίου
    της 19ης Δεκεμβρίου 1983 για τη θέσπιση καθεστώτος
    ενδοκοινοτικής κυκλοφορίας εμπορευμάτων που
    αποστέλλονται από ένα κράτος μέλος με σκοπό
    την προσωρινή χρησιμοποίησή τους σε ένα ή περισσότερα
    άλλα κράτη μέλη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3/84 del Consiglio del 19 dicembre 1983 che istituisce
    un regime di circolazione intracomunitaria di merci spedite da uno Stato membro
    per essere temporaneamente utilizzate in uno o più altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3/84 van de Raad van 19 december 1983 tot instelling
    van een regeling voor intracommunautair verkeer van goederen die uit een Lid-Staat
    worden verzonden om tijdelijk te worden gebruikt in één of meer andere Lid-Staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3/84 do Conselho, de 19 de Dezembro de 1983, que
    institui um regime de circulação intracomunitária de mercadorias expedidas
    de um Estado-membro para utilização temporária num ou em vários Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3/84 del Consejo, de 19 de diciembre de 1983, por
    el que se establece un régimen de circulación intracomunitaria de mercancías
    expedidas desde un Estado miembro para su utilización temporal en uno o varios
    Estados miembros
  type: main
