title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 246/90 of 30 January 1990 amending Regulation
    (EEC) No 3946/89 fixing certain additional detailed rules for the application
    of the supplementary trade mechanism to fruit and vegetables as regards artichokes,
    carrots, strawberries, lettuce, melons, table grapes and tomatoes and bringing
    broad- leaf endives under these rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 246/90 de la Commission du 30 janvier 1990 modifiant
    le règlement (CEE) n° 3946/89 fixant certaines modalités additionnelles pour
    l'application du mécanisme complémentaire aux échanges dans le secteur des
    fruits et légumes en ce qui concerne les artichauts, les carottes, les fraises,
    les laitues, les melons, les raisins de table, les tomates et étendant ces dispositions
    aux chicorées scaroles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 246/90 DER KOMMISSION vom 30. Januar 1990 zur Aenderung
    der Verordnung (EWG) Nr. 3946/89 zur Festsetzung einiger zusaetzlicher Bestimmungen
    zur Anwendung des ergaenzenden Handelsmechanismus im Sektor Obst und Gemuese hinsichtlich
    Artischocken, Karotten, Erdbeeren, Salat, Melonen, Tafeltrauben und Tomaten sowie
    zur Anwendung dieser Bestimmungen auf Endivie Eskariol
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 246/90 af 30. januar 1990 om ændring
    af Kommissionens forordning (EØF) nr. 3946/89 om visse yderligere gennemførelsesbestemmelser
    for den supplerende mekanisme for samhandelen for friske frugter og grønsager,
    for så vidt angår artiskokker, gulerødder, jordbær, salat, meloner, spisedruer
    og tomater, og om udvidelse af disse bestemmelser til også at omfatte bredbladet
    endivie
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 246/90 της Επιτροπής
    της 30ής Ιανουαρίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3946/89 για τον καθορισμό
    ορισμένων πρόσθετων λεπτομερειών για την εφαρμογή
    του συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις αγγινάρες, τα καρότα, τις φράουλες, τα μαρούλια,
    τα πεπόνια, τα επιτραπέζια σταφύλια και τις
    τομάτες και για επέκταση των διατάξεων αυτών
    στις σκαρόλες
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 246/90, annettu 30 päivänä tammikuuta 1990,
    tietyistä lisäyksistä hedelmä- ja vihannesalan täydentävän kaupan järjestelmän
    soveltamista koskeviin yksityiskohtaisiin sääntöihin latva-artisokkien, porkkanoiden,
    mansikoiden, salaattien, melonien, syötäväksi tarkoitettujen viinirypäleiden
    ja tomaattien osalta annetun asetuksen (ETY) N:o 3946/89 muuttamisesta sekä sen
    säännösten ulottamisesta koskemaan siloendiivejä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 246/90 DELLA COMMISSIONE del 30 gennaio 1990 che modifica
    il regolamento (CEE) n. 3946/89 della Commissione recante fissazione di modalità
    complementari di applicazione del meccanismo complementare applicabile agli scambi
    nel settore degli ortofrutticoli per quanto riguarda i carciofi, le carote, le
    fragole, le lattughe, i meloni, le uve da tavola e i pomodori e che estende tali
    disposizioni alle cicorie scarole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 246/90 VAN DE COMMISSIE van 30 januari 1990 tot wijziging
    van Verordening (EEG) nr. 3946/89 tot vaststelling van bijkomende bepalingen voor
    de toepassing van de aanvullende regeling voor het handelsverkeer in de sector
    groenten en fruit, ten aanzien van artisjokken, wortelen, aardbeien, sla, meloenen,
    tafeldruiven en tomaten, en tot uitbreiding van de werkingssfeer van die verordening
    tot andijvie
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 246/90 DA COMISSAO de 30 de Janeiro de 1990 que altera
    o Regulamento (CEE) n* 3946/89 que fixa determinadas modalidades complementares
    para a aplicaçao do mecanismo complementar às trocas comerciais no sector dos
    frutos e produtos horticolas, no que se refere às alcachofras, às cenouras,
    aos morangos, às alfaces, aos meloes, às uvas de mesa e aos tomates, e que alarga
    o âmbito dessas disposiçoes às chicorias escarolas
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 246/90 DE LA COMISION de 30 de enero de 1990 que modifica
    el Reglamento (CEE) no 3946/89 de la Comision por el que se establecen determinadas
    normas adicionales para la aplicacion del mecanismo complementario de los intercambios
    en el sector de las frutas y hortalizas en lo que respecta a las alcachofas, zanahorias,
    fresas, lechugas, melones, uvas de mesa y tomates, y que amplia estas disposiciones
    a las escarolas de hoja lisa
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 246/90 av den 30 januari 1990 om ändring
    av förordning (EEG) nr 3946/89 om fastställande av vissa ytterligare tillämpningsföreskrifter
    för den kompletterande handelsmekanismen för frukt och grönsaker vad gäller
    kronärtskockor, morötter, jordgubbar, sallat, meloner, bordsdruvor och tomater
    och om införande av escarolesallat under dessa bestämmelser
  type: main
