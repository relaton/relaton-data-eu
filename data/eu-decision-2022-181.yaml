id: EUDecision2022181
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/181 of 9 February 2022 amending
    Implementing Decision (EU) 2021/260 as regards certain movements between Member
    States or parts thereof of aquatic animals subject to national measures and Annex
    I thereto as regards the disease status of Ireland in respect of Ostreid herpesvirus-1μvar
    (OsHV-1μvar)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/181 de la Commission du 9 février 2022
    modifiant la décision d’exécution (UE) 2021/260 en ce qui concerne certains
    mouvements, entre États membres ou parties d’États membres, d’animaux aquatiques
    faisant l’objet de mesures nationales et son annexe I en ce qui concerne le
    statut de l’Irlande au regard de l’infection par l’herpès virus de l’huître
    1 μνar (OsHV-1 μνar)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/181 der Kommission vom 9. Februar 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2021/260 in Bezug auf bestimmte
    Verbringungen zwischen Mitgliedstaaten oder Teilen von Mitgliedstaaten von Wassertieren,
    die nationalen Maßnahmen unterliegen, sowie des Anhangs I hinsichtlich des Seuchenstatus
    von Irland mit Blick auf das Ostreide Herpesvirus 1 μVar (OsHV-1 μVar)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/181 на Комисията
    от 9 февруари 2022 година за изменение на Решение
    за изпълнение (ЕС) 2021/260 по отношение на някои
    видове движение между държави членки или части
    от тях на водни животни, спрямо които се прилагат
    национални мерки, и на приложение I към него
    по отношение на статуса на Ирландия по отношение
    на Ostreid herpesvirus-1μvar (OsHV-1μvar)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/181 ze dne 9. února 2022, kterým
    se mění prováděcí rozhodnutí (EU) 2021/260, pokud jde o některá přemísťování
    vodních živočichů mezi členskými státy nebo částmi jejich území, na
    něž se vztahují vnitrostátní opatření, a příloha I uvedeného rozhodnutí,
    pokud jde o nákazový status Irska v případě ostreid herpesvirus 1 μvar (OsHV-1
    μvar)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/181 af 9. februar 2022
    om ændring af gennemførelsesafgørelse (EU) 2021/260 for så vidt angår visse
    flytninger mellem medlemsstater eller dele heraf af akvatiske dyr, som er underlagt
    nationale foranstaltninger, og af bilag I hertil for så vidt angår Irlands sygdomsstatus
    med hensyn til ostreid herpesvirus 1 μνar (OsHV-1 μνar)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/181 της Επιτροπής
    της 9ης Φεβρουαρίου 2022 για την τροποποίηση
    της εκτελεστικής απόφασης (ΕΕ) 2021/260 όσον αφορά
    ορισμένες μετακινήσεις, μεταξύ κρατών μελών
    ή τμημάτων αυτών, υδρόβιων ζώων που υπόκεινται
    σε εθνικά μέτρα, και του παραρτήματος I της
    εν λόγω απόφασης όσον αφορά το καθεστώς νόσου
    της Ιρλανδίας ως προς τον ερπητοϊό των στρειδιών
    - 1 μvar (OsHV-1 μvar)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/181, 9. veebruar 2022, millega muudetakse
    rakendusotsust (EL) 2021/260 seoses selliste veeloomade teatava liikumisega liikmesriikide
    või nende osade vahel, mille suhtes kohaldatakse riiklikke meetmeid, ning kõnealuse
    otsuse I lisa seoses Iirimaa taudistaatusega seoses austrite herpesviirusega 1μvar
    (OsHV-1μvar)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/181, annettu 9 päivänä
    helmikuuta 2022, täytäntöönpanopäätöksen (EU) 2021/260 muuttamisesta siltä
    osin kuin on kyse sellaisten taudeille alttiiden vesieläinlajien siirroista jäsenvaltioiden
    tai niiden osien välillä, joihin sovelletaan kansallisia toimenpiteitä, sekä
    kyseisen asetuksen liitteen I muuttamisesta siltä osin kuin on kyse Irlannin
    tautitilanteesta ostereiden herpesvirus-1μvar (OsHV-1μvar) -taudin osalta
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/181 ón gCoimisiún an 9 Feabhra 2022
    lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2021/260 ón gCoimisiún a mhéid
    a bhaineann le gluaiseachtaí áirithe d’ainmhithe uisceacha idir na Ballstáit
    nó idir codanna díobh faoi réir bearta náisiúnta agus Iarscríbhinn I a ghabhann
    leis a mhéid a bhaineann le stádas galair na hÉireann i ndáil le víreas heirpéis
    oisre-1μνar (OsHV-1μνar)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/181 оd 9. veljače 2022. o izmjeni
    Provedbene odluke (EU) 2021/260 u pogledu određenih premještanja između država
    članica ili njihovih dijelova akvatičnih životinja koje podliježu nacionalnim
    mjerama te Priloga I. toj odluci u pogledu statusa bolesti Irske u odnosu na herpesvirus
    kamenice 1 μνar (OsHV-1μvar)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/181 végrehajtási határozata (2022. február 9.)
    az (EU) 2021/260 végrehajtási határozatnak a nemzeti intézkedések hatálya
    alá tartozó víziállatok tagállamok vagy azok részei közötti bizonyos mozgatásai
    tekintetében történő módosításáról, valamint az említett határozat
    I. mellékletének az Ostreid herpeszvírus 1μvarra (OsHV-1μvar) vonatkozóan
    Írország járványügyi státusza tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/181 della Commissione del 9 febbraio
    2022 che modifica la decisione di esecuzione (UE) 2021/260 per quanto riguarda
    alcuni movimenti tra Stati membri, o zone di essi, di animali acquatici soggetti
    a misure nazionali e il relativo allegato I per quanto riguarda lo stato sanitario
    dell’Irlanda nei confronti dell’Ostreid herpesvirus-1 μvar (OsHV-1 μvar)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/181 (2022. gada 9. februāris),
    ar ko attiecībā uz konkrētām tādu ūdensdzīvnieku pārvietošanas darbībām
    starp dalībvalstīm vai to daļām, uz ko attiecina valstu pasākumus, groza
    Īstenošanas lēmumu (ES) 2021/260 un ar ko attiecībā uz Īrijas statusu saistībā
    ar austeru herpesvīrusu 1μvar (OsHV-1μvar) groza minētā lēmuma I pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/181 2022 m. vasario 9 d. kuriuo
    dėl tam tikro vandens gyvūnų perkėlimo tarp valstybių narių ar jų dalių,
    kuriose taikomos nacionalinės priemonės, iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2021/260 ir dėl Airijos statuso, susijusio su austrių herpeso
    virusu-1 μvar (OsHV-1 μvar), iš dalies keičiamas jo I priedas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/181 tad-9
    ta’ Frar 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2021/260
    fir-rigward ta’ ċerti movimenti bejn l-Istati Membri jew partijiet minnhom
    ta’ annimali akkwatiċi soġġetti għall-miżuri nazzjonali u l-Anness I tagħha
    fir-rigward tal-istatus tal-marda tal-Irlanda fir-rigward tal-Ostreid herpesvirus-1μvar
    (OsHV-1μVar)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/181 van de Commissie van 9 februari 2022 tot
    wijziging van Uitvoeringsbesluit (EU) 2021/260 wat betreft bepaalde verplaatsingen
    tussen lidstaten of delen daarvan van waterdieren waarvoor nationale maatregelen
    zijn genomen en van bijlage I bij dat uitvoeringsbesluit wat betreft de ziektestatus
    van Ierland ten aanzien van ostreid herpesvirus 1 μνar (OsHV-1 μνar)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/181 z dnia 9 lutego 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2021/260 w odniesieniu do niektórych przemieszczeń
    między państwami członkowskimi lub ich częściami zwierząt wodnych podlegających
    środkom krajowym oraz załącznik I do tej decyzji w odniesieniu do statusu zdrowotnego
    Irlandii w przypadku herpeswirusa-1μvar u ostryg (OsHV-1μvar)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/181 da Comissão de 9 de fevereiro de
    2022 que altera a Decisão de Execução (UE) 2021/260, no que diz respeito a
    determinadas deslocações entre Estados-Membros ou partes destes de animais aquáticos
    sujeitos a medidas nacionais, e o seu anexo I, no que diz respeito ao estatuto
    da Irlanda em relação ao Ostreid herpesvirus 1 μvar (OsHV-1 μvar)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/181 a Comisiei din 9 februarie
    2022 de modificare a Deciziei de punere în aplicare (UE) 2021/260 în ceea ce
    privește anumite deplasări între statele membre sau părți ale acestora a
    animalelor acvatice care fac obiectul unor măsuri naționale și a anexei I la
    aceasta în ceea ce privește statutul Irlandei referitor la virusul herpetic
    al stridiilor 1 μvar (OsHV-1 μvar)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/181 z 9. februára 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2021/260, pokiaľ ide o určité premiestňovanie
    vodných živočíchov, na ktoré sa vzťahujú vnútroštátne opatrenia, medzi
    členskými štátmi alebo ich časťami, a príloha I k nemu, pokiaľ ide o štatút
    Írska v súvislosti s výskytom choroby herpetický vírus ustríc – 1μνar
    (OsHV-1μνar)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/181 z dne 9. februarja 2022 o spremembi
    Izvedbenega sklepa (EU) 2021/260 glede nekaterih premikov vodnih živali med državami
    članicami ali njihovimi deli, za katere veljajo nacionalni ukrepi, ter Priloge
    I k navedenemu sklepu v zvezi s statusom Irske glede ostreidnega herpesvirusa-1μvar
    (OsHV-1μvar)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/181 de la Comisión de 9 de febrero de
    2022 por la que se modifica la Decisión de Ejecución (UE) 2021/260 en lo que
    se refiere a determinados desplazamientos de animales acuáticos objeto de medidas
    nacionales entre Estados miembros o partes de Estados miembros y por la que se
    modifica su anexo I en lo que se refiere a la calificación de Irlanda con respecto
    al herpesvirus de los ostreidos tipo 1 μνar (OsHV-1 μνar)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/181 av den 9 februari 2022
