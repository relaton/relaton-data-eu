  content: Commission Regulation (EC) No 2810/2000 of 21 December 2000 establishing
    the forecast supply balances for cereal products and dried fodder for the smaller
    Aegean islands for 2001 and amending Regulation (EC) No 3175/94 laying down detailed
    rules of application for the specific supply arrangements
  type: main
- language: fr
  script: Latn
