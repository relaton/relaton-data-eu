    Mar Egeo in prodotti cerealicoli e in foraggi essiccati per il 2001 e che modifica
    il regolamento (CE) n. 3175/94 recante modalità di applicazione del regime specifico
    di approvvigionamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2810/2000 van de Commissie van 21 december 2000 tot
    vaststelling van de op ramingen berustende balans voor de voorziening van de kleinere
    eilanden in de Egeïsche Zee met graanproducten en gedroogde voedergewassen in
    2001, en tot wijziging van Verordening (EG) nr. 3175/94 houdende bepalingen voor
    de toepassing van de specifieke regeling voor de voorziening
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2810/2000 da Comissão, de 21 de Dezembro de 2000,
    que estabelece o balanço previsional de abastecimento em produtos cerealíferos
    e em forragens secas das ilhas menores do mar Egeu para 2001 e altera o Regulamento
