    no formato de Certificado Digital COVID da UE que indiquem a conclusão de uma
    série de vacinação primária
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/2288 al Comisiei din 21 decembrie 2021 de
