title:
- language: en
  script: Latn
  content: Regulation (EU) 2026/1881 of the European Parliament and of the Council
    of 24 July 2026 on a temporary derogation from certain provisions of Directive
    2002/58/EC as regards the use of technologies by providers of number-independent
    interpersonal communications services for the processing of personal and other
    data for the purpose of combating online child sexual abuse
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/1881 du Parlement européen et du Conseil du 24 juillet
    2026 relatif à une dérogation temporaire à certaines dispositions de la directive
    2002/58/CE en ce qui concerne l’utilisation de technologies par les fournisseurs
    de services de communications interpersonnelles non fondés sur la numérotation
    pour le traitement de données à caractère personnel et d’autres données
    aux fins de la lutte contre les abus sexuels commis contre des enfants en ligne
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/1881 des Europäischen Parlaments und des Rates vom
    24. Juli 2026 über eine vorübergehende Ausnahme von bestimmten Vorschriften
    der Richtlinie 2002/58/EG hinsichtlich der Verwendung von Technologien durch Anbieter
    nummernunabhängiger interpersoneller Kommunikationsdienste zur Verarbeitung personenbezogener
    und anderer Daten zwecks Bekämpfung des sexuellen Missbrauchs von Kindern im
    Internet
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2026/1881 на Европейския парламент
    и на Съвета от 24 юли 2026 година относно временна
    дерогация от някои разпоредби на Директива
    2002/58/ЕО по отношение на използването на технологии
    от доставчици на междуличностни съобщителни
    услуги без номерà за обработване на лични и
    други данни за целите на борбата с онлайн сексуалното
    насилие над деца
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2026/1881 ze dne 24. července
    2026 o dočasné odchylce od některých ustanovení směrnice 2002/58/ES, pokud
    jde o používání technologií poskytovateli interpersonálních komunikačních
    služeb nezávislých na číslech ke zpracování osobních a jiných údajů
    pro účely boje proti pohlavnímu zneužívání dětí on-line
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2026/1881 af 24. juli 2026
    om en midlertidig undtagelse fra visse bestemmelser i direktiv 2002/58/EF, for
    så vidt angår den anvendelse af teknologier til behandling af personoplysninger
    og andre data, der foretages af udbydere af nummeruafhængige interpersonelle
    kommunikationstjenester med det formål at bekæmpe seksuelt misbrug af børn
    online
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2026/1881 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 24ης Ιουλίου 2026, περί
    προσωρινής παρεκκλίσεως από ορισμένες διατάξεις
    της οδηγίας 2002/58/ΕΚ όσον αφορά τη χρήση τεχνολογιών
    από παρόχους υπηρεσιών διαπροσωπικών επικοινωνιών
    ανεξαρτήτως αριθμών για την επεξεργασία προσωπικών
    και άλλων δεδομένων, προς καταπολέμηση της
    σεξουαλικής κακοποίησης παιδιών στο διαδίκτυο
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2026/1881, 24. juuli 2026,
    mis käsitleb ajutist erandit direktiivi 2002/58/EÜ teatavatest sätetest seoses
    tehnoloogiaga, mida numbrivaba isikutevahelise side teenuste osutajad kasutavad
    isikuandmete ja muude andmete töötlemiseks, et võidelda veebis toimuva laste
    seksuaalse kuritarvitamise vastu
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2026/1881, annettu 24 päivänä
    heinäkuuta 2026, tilapäisestä poikkeuksesta direktiivin 2002/58/EY tiettyihin
    säännöksiin siltä osin kuin on kyse teknologioista, joita numeroista riippumattomien
    henkilöiden välisten viestintäpalvelujen tarjoajat käyttävät henkilötietojen
    ja muiden tietojen käsittelyyn verkkovälitteisen lapsiin kohdistuvan seksuaaliväkivallan
    torjumiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2026/1881 ó Pharlaimint na hEorpa agus ón gComhairle
    an 24 Iúil 2026 maidir le maolú sealadach ar fhorálacha áirithe de Threoir
    2002/58/CE a mhéid a bhaineann le húsáid teicneolaíochtaí ag soláthraithe
    seirbhísí cumarsáide idirphearsanta neamhspleách ar uimhir chun sonraí pearsanta
    agus sonraí eile a phróiseáil chun mí-úsáid ghnéasach leanaí ar líne
    a chomhrac
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2026/1881 Europskog parlamenta i Vijeća od 24. srpnja 2026.
    o privremenom odstupanju od određenih odredbi Direktive 2002/58/EZ u pogledu
    tehnologija koje pružatelji brojevno neovisnih interpersonalnih komunikacijskih
    usluga upotrebljavaju za obradu osobnih i drugih podataka u svrhu borbe protiv
    seksualnog zlostavljanja djece na internetu
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2026/1881 rendelete (2026. július
    24.) a 2002/58/EK irányelv bizonyos rendelkezéseitől a technológiáknak a
    számfüggetlen személyközi hírközlési szolgáltatásokat nyújtó szolgáltatók
    által a gyermekek online szexuális bántalmazása elleni küzdelem céljából
    a személyes és egyéb adatok kezelésére történő használata tekintetében
    való ideiglenes eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/1881 del Parlamento europeo e del Consiglio, del
    24 luglio 2026, relativo a una deroga temporanea a talune disposizioni della direttiva
    2002/58/CE per quanto riguarda l'uso di tecnologie da parte dei fornitori di servizi
    di comunicazione interpersonale indipendenti dal numero per il trattamento di
    dati personali e di altro tipo ai fini della lotta contro gli abusi sessuali online
    sui minori
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2026/1881 (2026. gada 24. jūlijs)
    par pagaidu atkāpi no konkrētiem Direktīvas 2002/58/EK noteikumiem attiecībā
    uz tehnoloģiju izmantošanu, ko veic numurneatkarīgu starppersonu sakaru pakalpojumu
    sniedzēji, lai apstrādātu personas datus un citus datus nolūkā apkarot seksuālu
    vardarbību pret bērniem tiešsaistē
  type: main
- language: lt
  script: Latn
  content: 2026 m. liepos 24 d. Europos Parlamento ir Tarybos reglamentas (ES) 2026/1881
    dėl laikinos nukrypti nuo tam tikrų Direktyvos 2002/58/EB nuostatų, kiek tai
    susiję su numeriu nesiejamo asmenų tarpusavio ryšio paslaugų teikėjų naudojamų
    technologijų naudojimo asmens ir kitiems duomenims tvarkyti kovos su seksualine
    prievarta prieš vaikus internete tikslais, leidžiančios nuostatos
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2026/1881 tal-Parlament Ewropew u tal-Kunsill tal-24 ta’
    Lulju 2026 dwar deroga temporanja minn ċerti dispożizzjonijiet tad-Direttiva
    2002/58/KE fir-rigward tal-użu ta’ teknoloġiji minn fornituri tas-servizzi
    tal-komunikazzjonijiet interpersonali indipendenti min-numri għall-ipproċessar
    ta’ data personali u data oħra għall-iskop tal-ġlieda kontra l-abbuż sesswali
    tat-tfal online
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/1881 van het Europees Parlement en de Raad van 24
    juli 2026 betreffende een tijdelijke afwijking van sommige bepalingen van Richtlijn
    2002/58/EG ten aanzien van het gebruik van technologieën door aanbieders van
    nummeronafhankelijke interpersoonlijke communicatiediensten voor de verwerking
    van persoonsgegevens en andere gegevens ten behoeve van de bestrijding van online
    seksueel misbruik van kinderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2026/1881 z dnia 24
    lipca 2026 r. w sprawie tymczasowego odstępstwa od niektórych przepisów dyrektywy
    2002/58/WE w odniesieniu do wykorzystywania technologii przez dostawców usług
    łączności interpersonalnej niewykorzystujących numerów do przetwarzania danych
    osobowych i innych danych do celów niegodziwego traktowania dzieci w celach seksualnych
    w internecie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2026/1881 do Parlamento Europeu e do Conselho, de 24 de
    julho de 2026, relativo a uma derrogação temporária de determinadas disposições
    da Diretiva 2002/58/CE no que respeita à utilização de tecnologias por prestadores
    de serviços de comunicações interpessoais independentes do número para o tratamento
    de dados pessoais e outros para efeitos de combate ao abuso sexual de crianças
    em linha
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/1881 al Parlamentului European și al Consiliului
    din 24 iulie 2026 privind o derogare temporară de la anumite dispoziții ale
    Directivei 2002/58/CE în ceea ce privește utilizarea tehnologiilor de către
    furnizorii de servicii de comunicații interpersonale care nu se bazează pe numere
    pentru prelucrarea datelor cu caracter personal și a altor date în scopul combaterii
    abuzului sexual online asupra copiilor
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2026/1881 z 24. júla 2026
    o dočasnej výnimke z určitých ustanovení smernice 2002/58/ES, pokiaľ ide
    o používanie technológií poskytovateľmi interpersonálnych komunikačných
    služieb nezávislých od číslovania na spracúvanie osobných a iných údajov
    na účely boja proti online sexuálnemu zneužívaniu detí
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2026/1881 Evropskega parlamenta in Sveta z dne 24. julija 2026
    o začasnem odstopanju od nekaterih določb Direktive 2002/58/ES glede uporabe
    tehnologij s strani ponudnikov medosebnih komunikacijskih storitev, neodvisnih
    od številke, za obdelavo osebnih in drugih podatkov za namene boja proti spolni
    zlorabi otrok na spletu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2026/1881 del Parlamento Europeo y del Consejo, de 24 de
    julio de 2026, por el que se establece una excepción temporal a determinadas
    disposiciones de la Directiva 2002/58/CE en lo que respecta al uso de tecnologías
    por proveedores de servicios de comunicaciones interpersonales independientes
    de la numeración para el tratamiento de datos personales y de otro tipo con fines
    de lucha contra los abusos sexuales de menores en línea
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2026/1881 av den 24 juli
    2026 om ett tillfälligt undantag från vissa bestämmelser i direktiv 2002/58/EG
    vad gäller användning av teknik hos tillhandahållare av nummeroberoende interpersonella
    kommunikationstjänster för behandling av personuppgifter och andra uppgifter
    i syfte att bekämpa sexuella övergrepp mot barn på nätet
