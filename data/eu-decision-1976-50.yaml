id: EUDecision197650
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 November 1975 authorizing the French Republic
    not to apply Community treatment to jerseys, pullovers, slip-overs, twinsets,
    cardigans, bed-jackets and jumpers falling within heading No 60.05 of the Common
    Customs Tariff, originating in Taiwan and in free circulation in the Benelux countries.
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 26 novembre 1975, autorisant la République
    française à exclure du traitement communautaire les chandails, pull-overs, slips,
    twin-sets, gilets, vestes et blouses, de la position 60.05 du Tarif douanier commun,
    originaires de Taiwan et mis en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. November 1975, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Trikots, Pullover, Slipover, Twinsets, Westen, Jacken
    und Blusen der Tarifnummer 60.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. november 1975 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage sweatere, pull-overe, slipovere,
    cardigans, cardigansæt, jumpere, trøjer, veste, bluser o.lign., som henhører
    under pos. 60.05 i den fælles toldtarif, har oprindelse i Taiwan og frit kan
    omsættes i Benelux-landene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 novembre 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario maglie, pullovers, slip-overs,
    twinsets, giubbotti, giacche e bluse della voce 60.05 della tariffa doganale comune,
    originari di Taiwan e messi in libera pratica nel Benelux
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 november 1975 waarbij de Franse Republiek
    wordt gemachtigd truien, pullovers, slipovers, jumpers, twinsets, vesten, jasjes
    en blouses van post 60.05 van het gemeenschappelijk douanetarief, van oorsprong
    uit Taiwan en in de Benelux-landen in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
