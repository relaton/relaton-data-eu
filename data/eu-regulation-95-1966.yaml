title:
- language: fr
  script: Latn
  content: Règlement n° 95/66/CEE de la Commission, du 5 mai 1966, portant modification
    du règlement n° 117/65/CEE de la Commission, du 16 juillet 1965, fixant, en
    application de l'article 3 du règlement n° 38/64/CEE du Conseil relatif à la
    libre circulation des travailleurs à l'intérieur de la Communauté, la liste
    des communes des zones frontalières, établies de part et d'autre de la frontière
    commune à certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 95/66/EWG der Kommission vom 5. Mai 1966 zur Änderung der
    Verordnung Nr. 117/65/EWG der Kommission vom 16. Juli 1965, die nach Artikel 3
    der Verordnung Nr. 38/64/EWG des Rates über die Freizügigkeit der Arbeitnehmer
    in der Gemeinschaft jene Gemeinden in einer Liste festhält, die innerhalb der
    Grenzzonen liegen, welche beiderseits gemeinsamer Grenzen von Mitgliedstaaten
    festgelegt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento n. 95/66/CEE della Commissione, del 5 maggio 1966, che modifica
    il regolamento n. 117/65/CEE della Commissione, del 16 luglio 1965, che stabilisce,
    a norma dell'articolo 3 del regolamento n. 38/64/ CEE del Consiglio, relativo
    alla libera circolazione dei lavoratori all'interno della Comunità, l'elenco
    dei comuni delle zone frontaliere costituite da una parte e dall'altra della frontiera
    comune ad alcuni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 95/66/EEG van de Commissie van 5 mei 1966 tot wijziging
    van Verordening Nr. 117/65/EEG van de Commissie van 16 juli 1965 houdende vaststelling
    van de lijst van gemeenten in de grenszones die aan weerszijden van de gemeenschappelijke
    grens tussen een aantal Lid- Staten zijn vastgesteld op grond van artikel 3 van
    Verordening Nr. 38/64/EEG van de Raad met betrekking tot het vrije verkeer van
    werknemers binnen de Gemeenschap
  type: main
