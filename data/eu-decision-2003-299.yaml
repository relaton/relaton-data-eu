    associering mellem De Europæiske Fællesskaber og deres medlemsstater på den
    ene side og Den Slovakiske Republik på den anden side for at tage hensyn til
    resultatet af parternes forhandlinger om yderligere gensidige indrømmelser på
    landbrugsområdet'
  type: main
- language: el
  script: Grek
