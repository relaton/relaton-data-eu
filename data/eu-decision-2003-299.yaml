title:
- language: en
  script: Latn
  content: '2003/299/EC: Council Decision of 14 April 2003 on the conclusion of a
    Protocol adjusting the trade aspects of the Europe Agreement establishing an Association
    between the European Communities and their Member States, of the one part, and
    the Slovak Republic, of the other part, to take account of the outcome of negotiations
    between the parties on new mutual agricultural concessions'
  type: main
- language: fr
  script: Latn
  content: '2003/299/CE: Décision du Conseil du 14 avril 2003 relative à la conclusion
    d''un protocole d''adaptation des aspects commerciaux de l''accord européen établissant
    une association entre les Communautés européennes et leurs États membres, d''une
    part, et la République slovaque, d''autre part, pour tenir compte des résultats
    des négociations entre les parties concernant l''établissement de nouvelles
    concessions agricoles réciproques'
  type: main
- language: de
  script: Latn
  content: '2003/299/EG: Beschluss des Rates vom 14. April 2003 über den Abschluss
    eines Protokolls zur Anpassung der Handelsaspekte des Europa-Abkommens zwischen
    den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits und der
    Slowakischen Republik andererseits zur Berücksichtigung der Ergebnisse der Verhandlungen
    zwischen den Parteien über neue gegenseitige Zugeständnisse in der Landwirtschaft'
  type: main
- language: da
  script: Latn
  content: '2003/299/EF: Rådets afgørelse af 14. april 2003 om indgåelse af en
