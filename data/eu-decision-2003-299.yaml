    assosiaatiosta tehdyn Eurooppa-sopimuksen kauppaa koskevien määräysten mukauttamista
    koskevan pöytäkirjan tekemisestä uusia keskinäisiä maatalousmyönnytyksiä
    koskevien neuvottelujen tulosten huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '2003/299/CE: Decisione del Consiglio, del 14 aprile 2003, relativa alla
