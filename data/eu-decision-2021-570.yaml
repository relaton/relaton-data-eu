  script: Latn
  content: Council Decision (EU) 2021/570 of 24 October 2019 on the signing, on behalf
    of the Union, and provisional application of the Protocol to the Euro-Mediterranean
    Interim Association Agreement on trade and cooperation between the European Community,
    of the one part, and the Palestine Liberation Organization (PLO) for the benefit
    of the Palestinian Authority of the West Bank and the Gaza Strip, of the other
    part, on a Framework Agreement between the European Union and the Palestinian
    Authority of the West Bank and the Gaza Strip on the general principles for its
    participation in Union programmes
  type: main
- language: fr
  script: Latn
