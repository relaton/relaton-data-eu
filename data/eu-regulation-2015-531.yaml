    508/2014 určením nákladů způsobilých pro podporu z Evropského námořního
    a rybářského fondu za účelem zlepšení hygienických, zdravotních, bezpečnostních
    a pracovních podmínek rybářů, ochrany a obnovy mořské biologické rozmanitosti
    a ekosystémů, zmírnění změny klimatu a zvýšení energetické účinnosti
    rybářských plavidel
  type: main
