    опазване и възстановяване на морското биологично
    разнообразие и морските екосистеми, смекчаване
    на изменението на климата и подобряване на
    енергийната ефективност на риболовните кораби
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2015/531 ze dne 24. listopadu
