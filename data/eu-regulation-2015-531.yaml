title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2015/531 of 24 November 2014 supplementing
    Regulation (EU) No 508/2014 of the European Parliament and of the Council by identifying
    the costs eligible for support from the European Maritime and Fisheries Fund in
    order to improve hygiene, health, safety and working conditions of fishermen,
    protect and restore marine biodiversity and ecosystems, mitigate climate change
    and increase the energy efficiency of fishing vessels
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2015/531 de la Commission du 24 novembre 2014
    complétant le règlement (UE) n ° 508/2014 du Parlement européen et du Conseil
    par le recensement des coûts éligibles à l'aide du Fonds européen pour les
    affaires maritimes et la pêche en vue d'améliorer l'hygiène, la santé, la
    sécurité et les conditions de travail des pêcheurs, de protéger et de restaurer
    la biodiversité et les écosystèmes marins, d'atténuer le changement climatique
    et d'améliorer l'efficacité énergétique des navires de pêche
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2015/531 der Kommission vom 24. November 2014
    zur Ergänzung der Verordnung (EU) Nr. 508/2014 des Europäischen Parlaments und
    des Rates mit den ermittelten Kosten, die für eine Unterstützung aus dem Europäischen
    Meeres- und Fischereifonds zur Verbesserung der Hygiene-, Gesundheits-, Sicherheits-
    und Arbeitsbedingungen für Fischer, zum Schutz und zur Wiederherstellung von
    Meeresbiodiversität und Meeresökosystemen, zur Eindämmung des Klimawandels
    und zur Steigerung der Energieeffizienz von Fischereifahrzeugen in Frage kommen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2015/531 на Комисията
