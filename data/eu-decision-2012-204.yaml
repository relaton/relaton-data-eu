id: EUDecision2012204
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2012/204/EU: Commission Implementing Decision of 19 April 2012 amending
    the Annexes to Decision 2003/467/EC as regards the declaration of Latvia as officially
    brucellosis-free Member State and of certain regions of Italy, Poland and Portugal
    as officially tuberculosis-free, brucellosis-free and enzootic-bovine-leukosis-free
    regions (notified under document C(2012) 2451)'
  type: main
- language: fr
  script: Latn
  content: '2012/204/UE: Décision d’exécution de la Commission du 19 avril 2012
    modifiant les annexes de la décision 2003/467/CE en ce qui concerne la déclaration
    de la Lettonie comme État membre officiellement indemne de brucellose, et de
    certaines régions de l’Italie, de la Pologne et du Portugal comme régions
    officiellement indemnes de tuberculose, de brucellose et de leucose bovine enzootique
    [notifiée sous le numéro C(2012) 2451]'
  type: main
- language: de
  script: Latn
  content: '2012/204/EU: Durchführungsbeschluss der Kommission vom 19. April 2012
    zur Änderung der Anhänge der Entscheidung 2003/467/EG hinsichtlich der amtlichen
    Anerkennung Lettlands als von Brucellose freier Mitgliedstaat und bestimmter italienischer,
    polnischer und portugiesischer Regionen als von Tuberkulose, Brucellose und enzootischer
    Rinderleukose freier Regionen (Bekanntgegeben unter Aktenzeichen C(2012) 2451)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/204/ЕС: Решение за изпълнение на Комисията
    от 19 април 2012 година за изменение на приложенията
    към Решение 2003/467/ЕО по отношение на обявяването
    на Латвия за официално свободна от бруцелоза
    държава членка и на определени региони на Италия,
    Полша и Португалия за региони, официално свободни
    от туберкулоза, бруцелоза и ензоотична левкоза
    по говедата (нотифицирано под номер C(2012) 2451)'
  type: main
- language: cs
  script: Latn
  content: '2012/204/EU: Prováděcí rozhodnutí Komise ze dne 19. dubna 2012 , kterým
    se mění přílohy rozhodnutí 2003/467/ES, pokud jde o prohlášení Lotyšska
    za členský stát úředně prostý brucelózy a některých oblastí Itálie,
    Polska a Portugalska za oblasti úředně prosté tuberkulózy, brucelózy a enzootické
    leukózy skotu (oznámeno pod číslem C(2012) 2451)'
  type: main
- language: da
  script: Latn
  content: '2012/204/EU: Kommissionens gennemførelsesafgørelse af 19. april 2012
    om ændring af bilagene til beslutning 2003/467/EF for så vidt angår erklæring
    af Letland som officielt frit for brucellose og af visse regioner i Italien, Polen
    og Portugal som officielt frie for tuberkulose, brucellose og enzootisk kvægleukose
    (meddelt under nummer C(2012) 2451)'
  type: main
- language: el
  script: Grek
  content: '2012/204/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 19ης Απριλίου 2012 , για την τροποποίηση των
    παραρτημάτων της απόφασης 2003/467/ΕΚ όσον αφορά
    την αναγνώριση της Λετονίας ως επισήμως απαλλαγμένο
    από τη βρουκέλωση κράτος μέλος καθώς και την
    αναγνώριση ορισμένων περιφερειών της Ιταλίας,
    της Πολωνίας και της Πορτογαλίας ως περιφέρειες
    επισήμως απαλλαγμένες από τη φυματίωση, τη
    βρουκέλωση και την ενζωοτική λεύκωση των βοοειδών
    [κοινοποιηθείσα υπό τον αριθμό C(2012) 2451]'
  type: main
- language: et
  script: Latn
  content: '2012/204/EL: Komisjoni rakendusotsus, 19. aprill 2012 , millega muudetakse
    otsuse 2003/467/EÜ lisasid seoses Läti kuulutamisega ametlikult brutselloosivabaks
    liikmesriigiks ja teatavate Itaalia, Poola ja Portugali piirkondade kuulutamisega
    ametlikult tuberkuloosivabadeks, brutselloosivabadeks ja veiste ensootilisest
    leukoosist vabadeks piirkondadeks (teatavaks tehtud numbri C(2012) 2451 all)'
  type: main
- language: fi
  script: Latn
  content: '2012/204/EU: Komission täytäntöönpanopäätös, annettu 19 päivänä
    huhtikuuta 2012 , päätöksen 2003/467/EY liitteiden muuttamisesta siltä osin
    kuin on kyse Latvian julistamisesta luomistaudista virallisesti vapaaksi jäsenvaltioksi
    ja tiettyjen Italian, Puolan ja Portugalin alueiden julistamisesta tuberkuloosista,
    luomistaudista ja naudan tarttuvasta leukoosista virallisesti vapaiksi (tiedoksiannettu
    numerolla C(2012) 2451)'
  type: main
- language: hr
  script: Latn
  content: '2012/204/EU: Provedbena odluka Komisije od 19. travnja 2012. o izmjeni
    Priloga Odluci 2003/467/EZ o proglašenju Latvije kao države članice službeno
    slobodne od bruceloze, te određenih regija Italije, Poljske i Portugala kao regija
    službeno slobodnih od tuberkuloze, bruceloze i enzootske leukoze goveda (priopćena
    pod brojem dokumenta C(2012) 2451)'
  type: main
- language: hu
  script: Latn
  content: '2012/204/EU: A Bizottság végrehajtási határozata ( 2012. április
    19. ) a 2003/467/EK határozat mellékleteinek Lettország hivatalosan brucellózismentes
    tagállammá nyilvánítása, valamint Olaszország, Lengyelország és Portugália
    bizonyos régióinak hivatalosan tuberkulózismentessé, brucellózismentessé
    és enzootikus szarvasmarha-leukosistól mentessé nyilvánítása tekintetében
    történő módosításáról (az értesítés a C(2012) 2451. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2012/204/UE: Decisione di esecuzione della Commissione, del 19 aprile
    2012 , che modifica gli allegati della decisione 2003/467/CE per quanto concerne
    la dichiarazione della Lettonia quale Stato membro ufficialmente indenne da brucellosi
    e di determinate regioni dell’Italia, della Polonia e del Portogallo quali regioni
    ufficialmente indenni da tubercolosi, brucellosi e leucosi bovina enzootica [notificata
    con il numero C(2012) 2451]'
  type: main
- language: lv
  script: Latn
  content: '2012/204/ES: Komisijas Īstenošanas lēmums ( 2012. gada 19. aprīlis
    ), ar ko groza Lēmuma 2003/467/EK pielikumus attiecībā uz Latvijas pasludināšanu
    par oficiāli no brucelozes brīvu dalībvalsti un dažu Itālijas, Polijas un
    Portugāles reģionu pasludināšanu par oficiāli no tuberkulozes, brucelozes
    un govju enzootiskās leikozes brīviem reģioniem (izziņots ar dokumenta numuru
    C(2012) 2451)'
  type: main
- language: lt
  script: Latn
  content: '2012/204/ES: 2012 m. balandžio 19 d. Komisijos įgyvendinimo sprendimas,
    kuriuo dėl paskelbimo, kad Latvija yra valstybė narė, kurioje oficialiai nenustatyta
    bruceliozės, ir kad tam tikruose Italijos, Lenkijos ir Portugalijos regionuose
    oficialiai nenustatyta tuberkuliozės, bruceliozės ir enzootinės galvijų leukozės,
    iš dalies keičiami Sprendimo 2003/467/EB priedai (pranešta dokumentu Nr. C(2012)
    2451)'
  type: main
- language: mt
  script: Latn
  content: '2012/204/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tad- 19
    ta’ April 2012 li temenda l-Annessi tad-Deċiżjoni 2003/467/KE fir-rigward
    tad-dikjarazzjoni tal-Latvja bħala Stat Membru uffiċjalment ħieles mill-bruċellożi
    u ta’ ċerti reġjuni tal-Italja, il-Polonja u l-Portugall bħala reġjuni uffiċjalment
    ħielsa mit-tuberkolożi, ħielsa mill-bruċellożi u ħielsa mil-lewkożi enżootika
    bovina (notifikata bid-dokument numru C(2012) 2451)'
  type: main
- language: nl
  script: Latn
  content: '2012/204/EU: Uitvoeringsbesluit van de Commissie van 19 april 2012 tot
    wijziging van de bijlagen bij Beschikking 2003/467/EG wat betreft de erkenning
    van Letland als officieel brucellosevrije lidstaat en van bepaalde regio’s van
    Italië, Polen en Portugal als regio’s die officieel vrij zijn van tuberculose,
    brucellose en zoötische boviene leukose (Kennisgeving geschied onder nummer C(2012)
    2451)'
  type: main
- language: pl
  script: Latn
  content: '2012/204/UE: Decyzja wykonawcza Komisji z dnia 19 kwietnia 2012 r. zmieniająca
    załączniki do decyzji 2003/467/WE w odniesieniu do uznania Łotwy za państwo
    członkowskie oficjalnie wolne od brucelozy oraz niektórych regionów Włoch,
    Polski i Portugalii za oficjalnie wolne od gruźlicy, brucelozy i enzootycznej
    białaczki bydła (notyfikowana jako dokument nr C(2012) 2451)'
  type: main
- language: pt
  script: Latn
  content: '2012/204/UE: Decisão de Execução da Comissão, de 19 de abril de 2012
    , que altera os anexos da Decisão 2003/467/CE relativamente à declaração da
    Letónia como Estado-Membro oficialmente indemne de brucelose e da Itália, da
    Polónia e de Portugal como regiões oficialmente indemnes de tuberculose, brucelose
    e leucose bovina enzoótica [notificada com o número C(2012) 2451]'
  type: main
- language: ro
  script: Latn
  content: '2012/204/UE: Decizia de punere în aplicare a Comisiei din 19 aprilie
    2012 de modificare a anexelor la Decizia 2003/467/CE în ceea ce privește declararea
    Letoniei ca stat membru oficial indemn de bruceloză și declararea anumitor regiuni
    din Italia, Polonia și Portugalia ca fiind regiuni oficial indemne de tuberculoză,
    bruceloză și leucoză enzootică bovină [notificată cu numărul C(2012) 2451]'
  type: main
- language: sk
  script: Latn
  content: '2012/204/EÚ: Vykonávacie rozhodnutie Komisie z 19. apríla 2012 , ktorým
    sa menia a dopĺňajú prílohy k rozhodnutiu 2003/467/ES, pokiaľ ide o úradné
    uznanie Lotyšska za členský štát bez výskytu brucelózy a úradné uznanie
    určitých regiónov Talianska, Poľska a Portugalska za regióny bez výskytu
    tuberkulózy, brucelózy a enzootickej leukózy hovädzieho dobytka [oznámené
    pod číslom C(2012) 2451]'
  type: main
- language: sl
  script: Latn
  content: '2012/204/EU: Izvedbeni sklep Komisije z dne 19. aprila 2012 o spremembi
    prilog k Odločbi 2003/467/ES o priznanju Latvije kot države članice, uradno
    proste bruceloze, ter nekaterih regij v Italiji ter na Poljskem in Portugalskem
    kot regij, uradno prostih tuberkuloze, bruceloze in enzootske goveje levkoze (notificirano
    pod dokumentarno številko C(2012) 2451)'
  type: main
- language: es
  script: Latn
  content: '2012/204/UE: Decisión de Ejecución de la Comisión, de 19 de abril de
    2012 , por la que se modifican los anexos de la Decisión 2003/467/CE en lo que
    respecta a la declaración de Letonia como Estado miembro oficialmente indemne
    de brucelosis y de determinadas regiones de Italia, Polonia y Portugal como oficialmente
    indemnes de tuberculosis, brucelosis y leucosis bovina enzoótica [notificada
    con el número C(2012) 2451]'
  type: main
- language: sv
  script: Latn
  content: '2012/204/EU: Kommissionens genomförandebeslut av den 19 april 2012 om
    ändring av bilagorna till beslut 2003/467/EG vad gäller fastställandet av att
    Lettland är officiellt fritt från brucellos och av att vissa regioner i Italien,
    Polen och Portugal är officiellt fria från tuberkulos, brucellos och enzootisk
    bovin leukos [delgivet med nr C(2012) 2451]'
