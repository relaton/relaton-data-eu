type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1977 of 8 September 2026 laying
    down the final import response on behalf of the Union concerning the future import
    of carbosulfan and of fenthion (ultra-low-volume formulations at or above 640
    g active ingredient/L) pursuant to Regulation (EU) No 649/2012 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1977 de la Commission du 8 septembre
    2026 établissant, au nom de l’Union, la réponse définitive concernant l’importation
    future de carbosulfan et de fenthion (préparations à ultra bas volume contenant
    des concentrations d’ingrédient actif supérieures ou égales à 640 g/L) conformément
    au règlement (UE) no 649/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1977 der Kommission vom 8. September
    2026 über die Einfuhrentscheidung in Form einer endgültigen Antwort im Namen
    der Union bezüglich der künftigen Einfuhr von Carbosulfan und von Fenthion (ULV-Formulierungen
    mit einem Wirkstoffgehalt von 640 g/l oder mehr) gemäß der Verordnung (EU) Nr.
    649/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/1977 на Комисията
    от 8 септември 2026 година за определяне на окончателния
    отговор относно вноса, който се дава от името
    на Съюза по отношение на бъдещия внос на карбосулфан
    и на фентион (формулации със свръхниски обеми
    от или над 640 g активно вещество/L) в съответствие
    с Регламент (ЕС) № 649/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/1977 ze dne 8. září 2026,
    kterým se stanoví konečná odpověď o dovozu jménem Unie týkající se budoucího
    dovozu karbosulfanu a fenthionu (přípravků ve velmi nízkých objemech s obsahem
    účinné látky 640 g/l nebo vyšším) podle nařízení Evropského parlamentu
    a Rady (EU) č. 649/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/1977 af 8. september
    2026 om fastsættelse af det definitive importsvar på Unionens vegne angående
    fremtidig import af carbosulfan og fenthion (formuleringer med ultralav volumen
    på 640 g aktivt stof pr. liter eller derover) i henhold til Europa-Parlamentets
    og Rådets forordning (EU) nr. 649/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/1977 της Επιτροπής,
    της 8ης Σεπτεμβρίου 2026, για τον καθορισμό της
    τελικής απάντησης, εξ ονόματος της Ένωσης,
    για τις μελλοντικές εισαγωγές των carbosulfan (καρβοσουλφάνη)
    και fenthion (φενθείον) (σκευάσματα εξαιρετικά
    χαμηλού όγκου με συγκέντρωση δραστικού συστατικού
    ίση ή μεγαλύτερη από 640 g/L) σύμφωνα με τον κανονισμό
    (ΕΕ) αριθ. 649/2012 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/1977, 8. september 2026, millega kehtestatakse
    liidu nimel lõplik impordivastus karbosulfaani ja fentiooni (üliväikeses koguses
    valmistatavad tooted, mille koostises on toimeainet vähemalt 640 g/l) edaspidise
    importimise kohta vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr
    649/2012
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/1977, annettu 8 päivänä
    syyskuuta 2026, karbosulfaanin ja fentionin (erittäin pieniä määriä sisältävät
    valmisteet, joissa vaikuttavaa ainetta on vähintään 640 g/l) tulevaa tuontia
    koskevien lopullisten tuontivastineiden vahvistamisesta unionin puolesta Euroopan
    parlamentin ja neuvoston asetuksen (EU) N:o 649/2012 mukaisesti
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/1977 ón gCoimisiún an 8 Meán Fómhair
    2026 lena leagtar síos an fhreagairt allmhairíochta chríochnaitheach thar ceann
    an Aontais maidir le carbasulfán agus feintión (foirmlí toirte sárísle ina
    bhfuil 640 g nó os a chionn de chomhábhar gníomhach/L) a allmhairiú amach
    anseo de bhun Rialachán (AE) Uimh. 649/2012 ó Pharlaimint na hEorpa agus ón
    gComhairle
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/1977 оd 8. rujna 2026. o utvrđivanju
    konačnog odgovora o uvozu u ime Unije za budući uvoz karbosulfana i fentiona
    (formulacije vrlo malog obujma s koncentracijom aktivnog sastojka od 640 g/l ili
    više) u skladu s Uredbom (EU) br. 649/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/1977 végrehajtási határozata (2026. szeptember
    8.) a karboszulfán és a fention (ULV-készítmények 640 g/l vagy annál nagyobb
    hatóanyag-tartalommal) jövőbeli behozatalára vonatkozóan az Unió nevében
    adandó végleges behozatali válasznak a 649/2012/EU európai parlamenti és
    tanácsi rendelet szerinti megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/1977 della Commissione, dell’8 settembre
    2026, che stabilisce, a nome dell’Unione, la risposta definitiva sulla futura
    importazione del carbosulfan e del fention (formulazioni a volume ultra-basso
    con principio attivo pari o superiore a 640 g/l) a norma del regolamento (UE)
    n. 649/2012 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/1977 (2026. gada 8. septembris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) Nr. 649/2012 Savienības
    vārdā sniedz galīgo atbildi par karbosulfāna un par fentiona (īpaši mazā
    apjomā lietojamu preparātu, kuros darbīgās vielas saturs ir 640 g/l vai vairāk)
    turpmāko importu
  type: main
- language: lt
  script: Latn
  content: 2026 m. rugsėjo 8 d. Komisijos įgyvendinimo sprendimas (ES) 2026/1977,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 649/2012 nustatomas
    galutinis Sąjungos atsakymas dėl būsimo karbosulfano ir fentiono (labai mažo
    kiekio preparatų, kurių sudėtyje veikliosios medžiagos yra ne mažiau kaip
    640 g/l) importo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/1977 tat-8
    ta’ Settembru 2026 li tistabbilixxi t-tweġiba finali dwar l-importazzjoni f’isem
    l-Unjoni rigward l-importazzjoni futura tal-karbosulfan u tal-fentijon (formulazzjonijiet
    b’volum ultrabaxx ta’ 640 g ta’ ingredjent attiv/L jew aktar) skont ir-Regolament
    (UE) Nru 649/2012 tal-Parlament Ewropew u tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/1977 van de Commissie van 8 september 2026
    tot vaststelling van de definitieve reactie namens de Unie inzake de toekomstige
    invoer van carbosulfan en van fenthion (ULV-formuleringen (Ultra Low Volume) met
    640 g werkzame stof/l of meer) krachtens Verordening (EU) nr. 649/2012 van het
    Europees Parlement en de Raad
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/1977 z dnia 8 września 2026 r. w
    sprawie ostatecznej odpowiedzi dotyczącej przywozu przedstawionej w imieniu Unii
    w odniesieniu do przyszłego przywozu karbosulfanu i fentionu (ultraniskoobjętościowe
    postaci użytkowe o zawartości równej 640 g substancji czynnej/l lub większej)
    na podstawie rozporządzenia Parlamentu Europejskiego i Rady (UE) nr 649/2012
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/1977 da Comissão, de 8 de setembro de
    2026, que estabelece, em nome da União, a resposta final relativa à futura importação
    de carbossulfão e de fentião (formulações aplicadas em volume ultrarreduzido,
    com concentração de ingrediente ativo igual ou superior a 640 g/l) nos termos
    do Regulamento (UE) n.o 649/2012 do Parlamento Europeu e do Conselho
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/1977 a Comisiei din 8 septembrie
    2026 de stabilire a răspunsului definitiv în numele Uniunii privind viitoarele
    importuri de carbosulfan și fention [(preparate cu un volum ultraredus, la un
    nivel echivalent cu sau de peste 640 g de ingredient activ/l) în temeiul Regulamentului
    (UE) nr. 649/2012 al Parlamentului European și al Consiliului
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/1977 z 8. septembra 2026, ktorým
    sa stanovuje konečná odpoveď v mene Únie týkajúca sa budúceho dovozu látok
    karbosulfán a fentión (prípravky s ultranízkoobjemovým obsahom účinnej
    látky na úrovni alebo nad úrovňou 640 g/l) podľa nariadenia Európskeho parlamentu
    a Rady (EÚ) č. 649/2012
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/1977 z dne 8. septembra 2026 o določitvi
    končnega uvoznega odgovora v imenu Unije glede prihodnjega uvoza karbosulfana
    in fentiona (formulacije z zelo majhnim volumnom s koncentracijo aktivne snovi
    640 g/l ali več) v skladu z Uredbo (EU) št. 649/2012 Evropskega parlamenta in
    Sveta
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2026/1977 de la Comisión, de 8 de septiembre
    de 2026, por la que se establece, en nombre de la Unión, la respuesta definitiva
    en lo que respecta a la importación futura de carbosulfán y de fentión (formulaciones
    de volumen ultra bajo en las que la concentración de la sustancia activa es,
    como mínimo, de 640 g/l) de conformidad con el Reglamento (UE) n.o 649/2012 del
    Parlamento Europeo y del Consejo
  type: main
- language: sv
  script: Latn
