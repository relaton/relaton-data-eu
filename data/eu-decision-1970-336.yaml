title:
- language: fr
  script: Latn
  content: Décision du Conseil du 29 juin 1970, donnant décharge à la Commission
    sur l'exécution des budgets de la CEE et des budgets de fonctionnement de la
    CEEA pour les exercices 1966 et 1967, ainsi que sur l'exécution des budgets des
    Communautés européennes pour l'exercice 1968
  type: main
- language: de
  script: Latn
  content: '70/336/EGKS, EWG, Euratom: Beschluß des Rates vom 29. Juni 1970 über
    die Entlastung der Kommission zur Ausführung der Haushaltspläne der Europäischen
    Wirtschaftsgemeinschaft und der Verwaltungshaushaltspläne der Europäischen Atomgemeinschaft
    für die Haushaltsjahre 1966 und 1967 sowie zur Ausführung der Haushaltspläne
    der Europäischen Gemeinschaften für das Haushaltsjahr 1968'
  type: main
- language: it
  script: Latn
  content: '70/336/CECA, CEE, Euratom: Decisione del Consiglio, del 29 giugno 1970,
    che dà atto alla Commissione dell''esecuzione dei bilanci della CEE e dei bilanci
    di funzionamento della CEEA per gli esercizi 1966 e 1967 nonché dell''esecuzione
    dei bilanci delle Comunità europee per l''esercizio 1968'
  type: main
- language: nl
  script: Latn
  content: '70/336/EGKS, EEG, Euratom: Besluit van de Raad van 29 juni 1970 tot het
    verlenen van kwijting aan de Commissie inzake de uitvoering van de begrotingen
    van de Europese Economische Gemeenschap en van de huishoudelijke begrotingen van
    de Europese Gemeenschap voor Atoomenergie voor de begrotingsjaren 1966 en 1967,
    alsmede inzake de uitvoering van de begrotingen van de Europese Gemeenschappen
    voor het begrotingsjaar 1968'
  type: main
