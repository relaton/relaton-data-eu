    οδηγιών 65/65/ΕΟΚ και 75/319/ΕΟΚ και για τη θέσπιση
    πρόσθετων διατάξεων για τα ανοσολογικά φαρμακευτικά
    προϊόντα που συνίστανται σε εμβόλια, τοξίνες,
    ορούς ή αλεργιογόνα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 89/342/ETY, annettu 3 päivänä toukokuuta 1989,
    direktiivien 65/65/ETY ja 75/319/ETY soveltamisalan laajentamisesta ja rokotteita,
    toksiineja tai seerumeja ja allergeeneja sisältäviä immunologisia lääkkeitä
    koskevista lisäsäännöksistä
  type: main
- language: it
  script: Latn
  content: Direttiva 89/342/CEE del Consiglio del 3 maggio 1989 che estende il campo
    di applicazione delle direttive 65/65/CEE e 75/319/CEE e che prevede norme aggiuntive
    per i medicinali immunologici costituiti da vaccini, tossine, sieri o allergeni
  type: main
- language: nl
  script: Latn
  content: Richtlijn 89/342/EEG van de Raad van 3 mei 1989 tot uitbreiding van de
    werkingssfeer van de Richtlijnen 65/65/EEG en 75/319/EEG en tot vaststelling van
    bijkomende bepalingen voor immunologische geneesmiddelen bestaande uit vaccins,
    toxinen, serums of allergenen
  type: main
- language: pt
  script: Latn
  content: Directiva 89/342/CEE do Conselho de 3 de Maio de 1989 que alarga o âmbito
    de aplicação das Directivas 65/65/CEE e 75/319/CEE e que estabelecem disposições
    complementares para os medicamentos imunológicos que consistam em vacinas, toxinas
    ou soros e alergénios
  type: main
- language: es
  script: Latn
