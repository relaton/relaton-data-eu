title:
- language: en
  script: Latn
  content: Council Directive 89/342/EEC of 3 May 1989 extending the scope of Directives
    65/65/EEC and 75/319/EEC and laying down additional provisions for immunological
    medicinal products consisting of vaccines, toxins or serums and allergens
  type: main
- language: fr
  script: Latn
  content: Directive 89/342/CEE du Conseil du 3 mai 1989 élargissant le champ d'application
    des directives 65/65/CEE et 75/319/CEE et prévoyant des dispositions complémentaires
    pour les médicaments immunologiques consistant en vaccins, toxines, sérums ou
    allergènes
  type: main
- language: de
  script: Latn
  content: Richtlinie 89/342/EWG des Rates vom 3. Mai 1989 zur Erweiterung des Anwendungsbereichs
    der Richtlinien 65/65/EWG und 75/319/EWG und zur Festlegung zusätzlicher Vorschriften
    für aus Impfstoffen, Toxinen oder Seren und Allergenen bestehende immunologische
    Arzneimittel
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 89/342/EØF af 3. maj 1989 om udvidelse af anvendelsesområdet
    for direktiv 65/65/EØF og 75/319/EØF og om fastsættelse af supplerende bestemmelser
    for immunologiske lægemidler i form af vacciner, toksiner, sera og allergener
  type: main
- language: el
  script: Grek
  content: Οδηγία 89/342/ΕΟΚ του Συμβουλίου της 3ης Μαΐου
