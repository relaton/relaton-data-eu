title:
- language: en
  script: Latn
  content: '79/1040/EEC: Commission Decision of 23 November 1979 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of sheep''s or lambs''wool
    or of fine animal hair, falling within heading No 53.11 of the Common Customs
    Tariff (NIMEXE codes 53.11-01, 03, 07, 11, 13, 17, 20, 30, 40, 52, 54, 58, 72,
    74, 75, 82, 84, 88, 91, 93, 97) (category 50), originating in Czechoslovakia and
    in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/1040/CEE: Décision de la Commission, du 23 novembre 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tissus de laine ou poils
    fins de la position 53.11 du tarif douanier commun (codes Nimexe: 53.11-01, 03,
    07, 11, 13, 17, 20, 30, 40, 52, 54, 58, 72, 74, 75, 82, 84, 88, 91, 93, 97) (catégorie
    50), originaires de la Tchécoslovaquie et mis en libre pratique dans les autres
    Etats membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/1040/EWG: Entscheidung der Kommission vom 23. November 1979, mit der
    das Vereinigte Königreich ermächtigt wird, aus der Tschechoslowakei stammende
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Wolle
    oder feinen Tierhaaren der Tarifnummer 53.11 des Gemeinsamen Zolltarifs (NIMEXE-
    Kennziffern 53.11-01 ; 03 ; 07 ; 11 ; 13 ; 17 ; 20 ; 30 ; 40 ; 52 ; 54 ; 58 ;
    72 ; 74 ; 75 ; 82 ; 84 ; 88 ; 91 ; 93 ; 97), Kategorie 50, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/1040/EØF: Kommissionens beslutning af 23. november 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage vævet stof
    af uld eller fine dyrehår, som henhører under pos. 53.11 i den fælles toldtarif
    (NIMEXE-nummer 53.11-01, 03, 07, 11, 13, 17, 20, 30, 40, 52, 54, 58, 72, 74, 75,
    82, 84, 88, 91, 93, 97 ; kategori 50), har oprindelse i Tjekkoslovakiet og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/1040/CEE: Decisione della Commissione, del 23 novembre 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario tessuti di lana o di peli
    fini della voce 53.11 della tariffa doganale comune (codici Nimexe: 53.11-01,
    03, 07, 11, 13, 17, 20, 30, 40, 52, 54, 58, 72, 74, 75, 82, 84, 88, 91, 93, 97),
    categoria 50, originari della Cecoslovacchia e messi in libera pratica negli altri
    Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/1040/EEG: Beschikking van de Commissie van 23 november 1979 waarbij
    het Verenigd Koninkrijk wordt gemachtigd weefsels van wol of van fijn haar van
    post 53.11 van het gemeenschappelijk douanetarief (NIMEXE- code 53.11-01, 03,
    07, 11, 13, 17, 20, 30, 40, 52, 54, 58, 72, 74, 75, 82, 84, 88, 91, 93, 97) (categorie
    50), van oorsprong uit Tsjechoslowakije en in de overige Lid- Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Engelse taal is authentiek)'
  type: main
