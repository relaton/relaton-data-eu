    MON 94637, nó atá comhdhéanta di nó a tháirgtear aisti, a chur ar an margadh,
    de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa agus ón gComhairle
    (tugadh fógra faoi leis an doiciméad C(2026) 3549)
  type: main
