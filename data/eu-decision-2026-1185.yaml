    се или произведени от генетично модифицирана
    соя MON 94637, в съответствие с Регламент (ЕО) №
    1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2026) 3549)
  type: main
- language: cs
  script: Latn
