    povolení uvedení produktů, které obsahují geneticky modifikovanou sóju MON
    94637, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení Evropského
    parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2026) 3549)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/1185 af 2. juni 2026
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 94637-sojabønne, i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2026) 3549)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/1185 της Επιτροπής,
    της 2ας Ιουνίου 2026, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένη σόγια
    MON 94637, σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό C(2026) 3549]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/1185, 2. juuni 2026, millega lubatakse
