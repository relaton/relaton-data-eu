    või sellest toodetud tooteid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2026) 3549 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/1185, annettu 2 päivänä
