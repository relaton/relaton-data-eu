    siitä koostuvien tai siitä valmistettujen tuotteiden saattamiseksi markkinoille
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2026) 3549)
  type: main
- language: ga
  script: Latn
