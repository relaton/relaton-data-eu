    MON 94637, od nje se sastoje ili su od nje proizvedeni, u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2026) 3549)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/1185 végrehajtási határozata (2026. június 2.)
    a géntechnológiával módosított MON 94637 szójababot tartalmazó, abból
    álló vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK
    európai parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2026) 3549. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/1185 della Commissione, del 2 giugno
    2026, che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da soia geneticamente modificata MON 94637 in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2026) 3549]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/1185 (2026. gada 2. jūnijs),
