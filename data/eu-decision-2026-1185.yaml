title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/1185 of 2 June 2026 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 94637 pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2026)
    3549)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/1185 de la Commission du 2 juin 2026
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié MON 94637, consistant en ce soja ou produits à partir de celui-ci, conformément
    au règlement (CE) no 1829/2003 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2026) 3549]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/1185 der Kommission vom 2. Juni 2026
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderte
    Sojabohnen der Sorte MON 94637 enthalten, aus ihnen bestehen oder aus ihnen hergestellt
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2026) 3549)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/1185 на Комисията
