---
id: EUDirective197791
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Second Council Directive 77/91/EEC of 13 December 1976 on coordination
    of safeguards which, for the protection of the interests of members and others,
    are required by Member States of companies within the meaning of the second paragraph
    of Article 58 of the Treaty, in respect of the formation of public limited liability
    companies and the maintenance and alteration of their capital, with a view to
    making such safeguards equivalent
  type: main
- language: fr
  script: Latn
  content: Deuxième directive 77/91/CEE du Conseil, du 13 décembre 1976, tendant
    à coordonner pour les rendre équivalentes les garanties qui sont exigées dans
    les États membres des sociétés au sens de l'article 58 deuxième alinéa du
    traité, en vue de la protection des intérêts tant des associés que des tiers,
    en ce qui concerne la constitution de la société anonyme ainsi que le maintien
    et les modifications de son capital
  type: main
- language: de
  script: Latn
  content: Zweite Richtlinie 77/91/EWG des Rates vom 13. Dezember 1976 zur Koordinierung
    der Schutzbestimmungen, die in den Mitgliedstaaten den Gesellschaften im Sinne
    des Artikels 58 Absatz 2 des Vertrages im Interesse der Gesellschafter sowie Dritter
    für die Gründung der Aktiengesellschaft sowie für die Erhaltung und Änderung
    ihres Kapitals vorgeschrieben sind, um diese Bestimmungen gleichwertig zu gestalten
  type: main
- language: bg
  script: Cyrl
  content: Втора Директива на Съвета от 13 декември
    1976 година за съгласуване на гаранциите, които
    се изискват в държавите-членки за дружествата
    по смисъла на член 58, втора алинея от Договора,
    за защита на интересите както на съдружниците,
    така и на трети лица по отношение учредяването
    на акционерни дружества и поддържането и изменението
    на техния капитал с цел тези гаранции да станат
    равностойни
  type: main
- language: cs
  script: Latn
  content: Druhá směrnice Rady ze dne 13. prosince 1976 o koordinaci ochranných
    opatření, která jsou na ochranu zájmů společníků a třetích osob vyžadována
    v členských státech od společností ve smyslu čl. 58 druhého pododstavce
    Smlouvy při zakládání akciových společností a při udržování a změně
    jejich základního kapitálu, za účelem dosažení rovnocennosti těchto opatření
  type: main
- language: da
  script: Latn
  content: Rådets andet direktiv 77/91/EØF af 13. december 1976 om samordning af
    de garantier, der kræves i medlemsstaterne af de i artikel 58, stk. 2, i traktaten
    nævnte selskaber til beskyttelse af såvel selskabsdeltagernes som tredjemands
    interesser, for så vidt angår stiftelsen af aktieselskabet samt bevarelsen af
    og ændringer i dets kapital, med det formål at gøre disse garantier lige byrdefulde
  type: main
- language: el
  script: Grek
  content: Δεύτερη οδηγία 77/91/ΕΟΚ του Συμβουλίου της
    13ης Δεκεμβρίου 1976 περί συντονισμού των εγγυήσεων
    που απαιτούνται στα κράτη μέλη εκ μέρους των
    εταιρειών, κατά την έννοια του άρθρου 58 δεύτερη
    παράγραφος της συνθήκης, για την προστασία
    των συμφερόντων των εταίρων και των τρίτων
    με σκοπό να καταστούν οι εγγυήσεις αυτές ισοδύναμες
    όσον αφορά τη σύσταση της ανωνύμου εταιρείας
    και τη διατήρηση και τις μεταβολές του κεφαλαίου
    της
  type: main
- language: et
  script: Latn
  content: Teine Nõukogu direktiiv, 13. detsember 1976, tagatiste kooskõlastamise
    kohta, mida liikmesriigid äriühingu liikmete ja kolmandate isikute huvide kaitseks
    EMÜ asutamislepingu artikli 58 teises lõigus tähendatud äriühingutelt nõuavad
    seoses aktsiaseltside asutamise ning nende kapitali säilitamise ja muutmisega,
    et muuta sellised tagatised ühenduse kõigis osades võrdväärseteks
  type: main
- language: fi
  script: Latn
  content: Toinen neuvoston direktiivi 77/91/ETY, annettu 13 päivänä joulukuuta
    1976, niiden takeiden yhteensovittamisesta samanveroisiksi, joita jäsenvaltioissa
    vaaditaan perustamissopimuksen 58 artiklan 2 kohdassa tarkoitetuilta yhtiöiltä
    niiden jäsenten sekä ulkopuolisten etujen suojaamiseksi osakeyhtiöitä perustettaessa
    sekä niiden pääomaa säilytettäessä ja muutettaessa
  type: main
- language: hr
  script: Latn
  content: '77/91/EEZ: Druga direktiva Vijeća od 13. prosinca 1976. o koordinaciji
    zaštitnih mehanizama koje, radi zaštite interesa članica i ostalih, države
    članice zahtijevaju od trgovačkih društava u smislu članka 58. stavka 2. Ugovora,
    s obzirom na osnivanje dioničkih društava i održavanje i promjenu njihovog
    kapitala, a s ciljem ujednačavanja tih zaštitnih mehanizama'
  type: main
- language: hu
  script: Latn
  content: A Tanács második irányelve (1976. december 13.) a biztosítékok egyenértékűvé
    tétele céljából a részvénytársaságok alapításának, valamint ezek tőkéje
    fenntartásának és módosításának tekintetében a tagállamok által a társasági
    tagok és harmadik személyek érdekei védelmében a Szerződés 58. cikkének
    (2) bekezdése szerinti társaságoknak előírt biztosítékok összehangolásáról
  type: main
- language: it
  script: Latn
  content: Seconda direttiva 77/91/CEE del Consiglio, del 13 dicembre 1976, intesa
    a coordinare, per renderle equivalenti, le garanzie che sono richieste, negli
    Stati Membri, alle società di cui all'articolo 58, secondo comma, del Trattato,
    per tutelare gli interessi dei soci e dei terzi per quanto riguarda la costituzione
    della società per azioni, nonché la salvaguardia e le modificazioni del capitale
    sociale della stessa
  type: main
- language: lv
  script: Latn
  content: Padomes Otrā direktīva (1976. gada 13. decembris) par to, kā vienādošanas
    nolūkā koordinēt nodrošinājumus, ko saistībā ar akciju sabiedrību veidošanu
    un to kapitāla saglabāšanu un mainīšanu dalībvalstis prasa no sabiedrībām
    Līguma 58. panta otrās daļas nozīmē, lai aizsargātu sabiedrību dalībnieku
    un trešo personu intereses
  type: main
- language: lt
  script: Latn
  content: 1976 m. gruodžio 13 d. Antroji Tarybos Direktyva dėl apsaugos priemonių,
    kurių valstybės narės, siekdamos tokias priemones suvienodinti, reikalauja
    iš Sutarties 58 straipsnio antroje pastraipoje apibrėžtų akcinių bendrovių,
    jų narių ir kitų interesų apsaugai, bendroves steigiant, palaikant ir keičiant
    jų kapitalą, koordinavimo
  type: main
- language: mt
  script: Latn
  content: It-tieni Direttiva tal-Kunsill tat-13 ta' Diċembru ta' l-1976 dwar il-koordinazzjoni
    ta' salvagwardji li, għall-protezzjoni ta' l-interessi ta' membri u oħrajn,
    huma meħtieġa mill-Istati Membri ta` kumpanniji fis-sens tat-tieni paragrafu
    ta' l-Artikolu 58 tat-Trattat, dwar il-formazzjoni ta' kumpanniji pubbliċi ta'
    responsabbilità limitata u ż-żamma u t-tibdil tal-kapital tagħhom, bil-għan
    li jagħmlu dawn is-salvagwardji ekwivalenti
  type: main
- language: nl
  script: Latn
  content: Tweede Richtlijn 77/91/EEG van de Raad van 13 december 1976 strekkende
    tot het coördineren van de waarborgen welke in de Lid-Staten worden verlangd
    van de vennootschappen in de zin van artikel 58, tweede alinea, van het Verdrag,
    om de belangen te beschermen zowel van de deelnemers in deze vennootschappen als
    van derden met betrekking tot de oprichting van de naamloze vennootschap, alsook
    de instandhouding en wijziging van haar kapitaal, zulks ten einde die waarborgen
    gelijkwaardig te maken
  type: main
- language: pl
  script: Latn
  content: Druga Dyrektywa Rady z dnia 13 grudnia 1976 r. w sprawie koordynacji gwarancji,
    jakie są wymagane w Państwach Członkowskich od spółek w rozumieniu art. 58
    akapit drugi Traktatu, w celu uzyskania ich równoważności, dla ochrony interesów
    zarówno wspólników, jak i osób trzecich w zakresie tworzenia spółki akcyjnej,
    jak również utrzymania i zmian jej kapitału
  type: main
- language: pt
  script: Latn
  content: Segunda Directiva 77/91/CEE do Conselho, de 13 de Dezembro de 1976, tendente
    a coordenar as garantias que, para protecção dos interesses dos sócios e de
    terceiros, são exigidas nos Estados-Membros às sociedades, na acepção do segundo
    parágrafo do artigo 58º do Tratado, no que respeita à constituição da sociedade
    anónima, bem como à conservação e às modificações do seu capital social,
    a fim de tornar equivalentes essas garantias em toda a Comunidade
  type: main
- language: ro
  script: Latn
  content: A doua Directivă a Consiliului din 13 decembrie 1976 de coordonare, în
    vederea echivalării, a garanțiilor impuse societăților comerciale în statele
    membre, în înțelesul articolului 58 al doilea paragraf din tratat, pentru protejarea
    intereselor asociaților sau terților, în ceea ce privește constituirea societăților
    comerciale pe acțiuni și menținerea și modificarea capitalului acestora
  type: main
- language: sk
  script: Latn
  content: Druhá smernica Rady z 13. decembra 1976 o koordinácii ochranných opatrení,
    ktoré členské štáty vyžadujú od obchodných spoločností na ochranu záujmov
    spoločníkov a tretích osôb v zmysle druhého odseku článku 58 Zmluvy pokiaľ
    ide o zakladanie akciových spoločností, udržiavanie a zmenu ich základného
    imania, s cieľom dosiahnuť rovnocennosť týchto opatrení
  type: main
- language: sl
  script: Latn
  content: Druga direktiva Sveta z dne 13. decembra 1976 o uskladitvi zaščitnih
    ukrepov za varovanje interesov družbenikov in tretjih oseb, ki jih države članice
    zahtevajo od gospodarskih družb v skladu z drugim odstavkom člena 58 Pogodbe
    glede ustanavljanja delniških družb ter ohranjanja in spreminjanja njihovega
    kapitala, zato da se oblikujejo zaščitni ukrepi z enakim učinkom v vsej Skupnosti
  type: main
- language: es
  script: Latn
  content: Segunda Directiva 77/91/CEE del Consejo, de 13 de diciembre de 1976, tendente
    a coordinar, para hacerlas equivalentes, las garantías exigidas en los Estados
    Miembros a las sociedades, definidas en el párrafo segundo del artículo 58 del
    Tratado, con el fin de proteger los intereses de los socios y terceros, en lo
    relativo a la constitución de la sociedad anónima, así como al mantenimiento
    y modificaciones de su capital
  type: main
- language: sv
  script: Latn
  content: Rådets andra direktiv 77/91/EEG av den 13 december 1976 om samordning
    av de skyddsåtgärder som krävs i medlemsstaterna av de i artikel 58 andra stycket
    i fördraget avsedda bolagen i bolagsmännens och tredje mans intressen när det
    gäller att bilda ett aktiebolag samt att bevara och ändra dettas kapital, i
    syfte att göra skyddsåtgärderna likvärdiga
  type: main
