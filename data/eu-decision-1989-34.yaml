title:
- language: en
  script: Latn
  content: '89/34/EEC: Commission Decision of 22 December 1988 approving the addendum
    to Commission Decision 88/171/EEC of 28 January 1988 approving a programme submitted
    under the common measure for the encouragement of agriculture by improving the
    rearing of beef cattle in certain less- favoured areas of France pursuant to Regulation
    (EEC) No 1400/86 (only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/34/CEE: Décision de la Commission du 22 décembre 1988 concernant
    l''approbation de l''addendum à la décision 88/171/CEE de la Commission, du
    28 janvier 1988, portant approbation du programme s''inscrivant dans l''action
    commune visant à la promotion de l''agriculture par l''amélioration de l''élevage
    bovin de races à viande dans certaines zones défavorisées de la France conformément
    au règlement (CEE) n° 1400/86 du Conseil (Le texte en langue française est
    le seul faisant foi.)'
