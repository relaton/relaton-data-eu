  script: Latn
  content: Commission Delegated Regulation (EU) 2024/450 of 26 October 2023 supplementing
    Regulation (EU) 2021/23 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the minimum elements to be included
    in a business reorganisation plan and the criteria to be fulfilled for its approval
    by the resolution authority
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/450 de la Commission du 26 octobre 2023
    complétant le règlement (UE) 2021/23 du Parlement européen et du Conseil par
    des normes techniques de réglementation précisant les éléments minimaux à
    inclure dans un plan de réorganisation des activités et les critères auxquels
    il doit satisfaire pour être approuvé par l’autorité de résolution
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/450 der Kommission vom 26. Oktober 2023
    zur Ergänzung der Verordnung (EU) 2021/23 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Mindestbestandteile
    eines Reorganisationsplans und der Kriterien, die für die Genehmigung durch die
    Abwicklungsbehörde zu erfüllen sind
  type: main
