title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1697/79 of 24 July 1979 on the post-clearance
    recovery of import duties or export duties which have not been required of the
    person liable for payment on goods entered for a customs procedure involving the
    obligation to pay such duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1697/79 du Conseil du 24 juillet 1979 concernant le
    recouvrement «a posteriori» des droits à l'importation ou des droits à l'exportation
    qui n'ont pas été exigés du redevable pour des marchandises déclarées pour
    un régime douanier comportant l'obligation de payer de tels droits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1697/79 des Rates vom 24. Juli 1979 betreffend die
    Nacherhebung von noch nicht vom Abgabenschuldner angeforderten Eingangs- oder
    Ausfuhrabgaben für Waren, die zu einem Zollverfahren angemeldet worden sind,
    das die Verpflichtung zur Zahlung derartiger Abgaben beinhaltet
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1697/79 af 24. juli 1979 om opkrævning af
    import- og eksportafgifter, der ikke er opkrævet hos debitor for varer, der er
    angivet til en toldprocedure, som medfører en forpligtelse til at betale sådanne
    afgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1697/79 του Συμβουλίου
    της 24ης Ιουλίου 1979 περί της «εκ των υστέρων»
    εισπράξεως εισαγωγικών ή εξαγωγικών δασμών
    που δεν κατέστησαν απαιτητοί από τον φορολογούμενο,
    για εμπορεύματα που διασαφηνίσθηκαν σε τελωνειακό
    καθεστώς συνεπαγόμενο την υποχρέωση καταβολής
    τέτοιων δασμών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1697/79 del Consiglio, del 24 luglio 1979, relativo
    al ricupero a posteriori dei dazi all' importazione o dei dazi all' esportazione
    che non sono stati corrisposti dal debitore per le merci dichiarate per un regime
    doganale comportante l' obbligo di effettuarne il pagamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1697/79 van de Raad van 24 juli 1979 inzake navordering
    van de rechten bij invoer of bij uitvoer die niet van de belastingschuldige zijn
    opgeëist voor goederen welke zijn aangegeven voor een douaneregeling waaruit
    de verplichting tot betaling van dergelijke rechten voortvloeide
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1697/79 do Conselho, de 24 de Julho de 1979, relativo
    à cobrança "a posteriori" dos direitos de importação ou dos direitos de exportação
    que não tenham sido exigidos ao devedor por mercadorias declaradas para um regime
    aduaneiro que implica a obrigação de pagamento dos referidos direitos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1697/79 del Consejo, de 24 de julio de 1979, referente
    a la recaudación a posteriori de los derechos de importación o de los derechos
    de exportación que no hayan sido exigidos al deudor por mercancías declaradas
    en un régimen aduanero que suponga la obligación de pagar tales derechos
  type: main
