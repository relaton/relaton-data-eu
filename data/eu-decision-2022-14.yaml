---
id: EUDecision202214
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/14 of 2 December 2021 on the position to be
    taken on behalf of the European Union at the 22nd meeting of the Contracting Parties
    to the Convention for the Protection of the Marine Environment and the Coastal
    Region of the Mediterranean (Barcelona Convention) and its Protocols as regards
    the adoption of a decision to adopt Regional Plans on Urban Wastewater Treatment
    and Sewage Sludge Management in the framework of Article 15 of the Protocol for
    the Protection of the Mediterranean Sea against Pollution from Land-Based Sources
    and Activities (LBS Protocol)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/14 du Conseil du 2 décembre 2021 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 22e réunion des parties
    contractantes à la convention sur la protection du milieu marin et du littoral
    de la Méditerranée (convention de Barcelone) et à ses protocoles en ce qui
    concerne l’adoption d’une décision d’adopter des plans régionaux sur le
    traitement des eaux urbaines résiduaires et la gestion des boues d’épuration,
    dans le cadre de l’article 15 du protocole relatif à la protection de la mer
    Méditerranée contre la pollution provenant de sources et activités situées
    à terre (protocole tellurique)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/14 des Rates vom 2. Dezember 2021 über den Standpunkt,
    der auf der 22. Tagung der Vertragsparteien des Übereinkommens zum Schutz der
    Meeresumwelt und der Küstengebiete des Mittelmeers (Übereinkommen von Barcelona)
    und seiner Protokolle zu dem Erlass eines Beschlusses, im Rahmen von Artikel 15
    des Protokolls über den Schutz des Mittelmeers vor Verschmutzung vom Lande aus
    und Tätigkeiten (LBS-Protokoll) regionale Pläne über die Behandlung von kommunalem
    Abwasser und über Klärschlammmanagement anzunehmen, im Namen der Union zu vertreten
    ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/14 на Съвета от 2 декември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 22-рата
    среща на договарящите се страни по Конвенцията
    за защита на морската среда и на крайбрежните
    райони в Средиземноморието (Конвенцията от
    Барселона) и протоколите към нея по отношение
    на приемането на решение за приемане на регионални
    планове за пречистването на градски отпадъчни
    води и управлението на утайките от отпадъчни
    води в рамките на член 15 от Протокола за опазване
    на Средиземно море от замърсяване, причинено
    от наземни източници и дейности (Протокол относно
    наземните източници)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/14 ze dne 2. prosince 2021 o postoji, který
    má být zaujat jménem Evropské unie na 22. zasedání smluvních stran Úmluvy
    o ochraně mořského prostředí a pobřežní oblasti Středomoří (Barcelonská
    úmluva) a jejích protokolů, pokud jde o přijetí rozhodnutí, kterým se na
    základě článku 15 Protokolu o ochraně Středozemního moře před znečišťováním
    z pozemních zdrojů a činností (protokol o pozemních zdrojích) přijímají
    regionální plány čištění městských odpadních vod a nakládání s kaly
    z čistíren odpadních vod
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/14 af 2. december 2021 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 22. møde mellem de kontraherende
    parter i konventionen om beskyttelse af Middelhavets havmiljø og kystområder
    (Barcelonakonventionen) og protokollerne hertil, til vedtagelsen af en afgørelse
    om at vedtage regionale planer om rensning af byspildevand og håndtering af spildevandsslam
    inden for rammerne af artikel 15 i protokollen om beskyttelse af Middelhavet mod
    forurening fra landbaserede kilder og aktiviteter (LBS-protokollen)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/14 του Συμβουλίου της 2ας
    Δεκεμβρίου 2021 σχετικά με τη θέση που πρέπει
    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    κατά την 22η σύνοδο των συμβαλλόμενων μερών
    της σύμβασης για την προστασία του θαλάσσιου
    περιβάλλοντος και των παράκτιων περιοχών της
    Μεσογείου (σύμβαση της Βαρκελώνης) και των
    πρωτοκόλλων της όσον αφορά την έκδοση απόφασης
    για την έγκριση των περιφερειακών σχεδίων
    για την επεξεργασία των αστικών λυμάτων και
    τη διαχείριση της λυματολάσπης στο πλαίσιο
    του άρθρου 15 του πρωτοκόλλου για την προστασία
    της Μεσογείου Θαλάσσης από τη ρύπανση από χερσαίες
    πηγές και δραστηριότητες (πρωτόκολλο για τις
    ΧΠ)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/14, 2. detsember 2021, seisukoha kohta, mis võetakse
    Euroopa Liidu nimel Vahemere merekeskkonna ja rannikuala kaitse konventsiooni
    (Barcelona konventsioon) ja selle protokollide osalisriikide 22. istungil vastu
    võetava otsuse suhtes, millega võetakse vastu asulareovee puhastamise ja reoveesetete
    käitlemise piirkondlikud kavad vastavalt maismaalt lähtuva ja maismaal toimuvate
    tegevuste põhjustatud reostuse eest Vahemere kaitsmist käsitleva protokolli
    (maismaalt lähtuva merereostuse eest kaitsmise protokoll) artiklile 15
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/14, annettu 2 päivänä joulukuuta 2021,
    Välimeren merellisen ympäristön ja rannikkoalueiden suojelemista koskevan yleissopimuksen
    (Barcelonan yleissopimus) ja sen pöytäkirjojen sopimuspuolten 22. kokouksessa
    Euroopan unionin puolesta otettavasta kannasta päätökseen hyväksyä Välimeren
    suojelemisesta maalta peräisin olevalta ja maalla tapahtuvan toiminnan aiheuttamalta
    pilaantumiselta tehdyn pöytäkirjan (LBS-pöytäkirja) 15 artiklan puitteissa
    alueellisia suunnitelmia yhdyskuntajätevesien ja puhdistamolietteen käsittelystä
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/14 ón gComhairle an 2 Nollaig 2021 maidir leis an seasamh
    atá le glacadh thar ceann an Aontais Eorpaigh ag an 22ú cruinniú de na Páirtithe
    Conarthacha sa Choinbhinsiún maidir le Cosaint Mhuirthimpeallacht agus Réigiún
    Cósta na Meánmhara (Coinbhinsiún Barcelona) gona Phrótacail a mhéid a bhaineann
    le cinneadh a ghlacadh chun Pleananna Réigiúnacha maidir le Cóireáil Fuíolluisce
    Uirbigh agus le Bainistiú Sloda Séarachais a ghlacadh faoi chuimsiú Airteagal
    15 den Phrótacal maidir le Cosaint na Meánmhara ar Thruailliú ó Fhoinsí agus
    Gníomhaíochtaí ar Talamh (Prótacal LBS)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/14 od 2. prosinca 2021. o stajalištu koje treba
    zauzeti u ime Europske unije na 22. sastanku ugovornih stranaka Konvencije o zaštiti
    morskog okoliša i obalnog područja Sredozemlja (Barcelonska konvencija) i njezinih
    protokola u pogledu donošenja odluke o donošenju regionalnih planova za pročišćavanje
    komunalnih otpadnih voda i gospodarenje kanalizacijskim muljem u okviru članka
    15. Protokola o zaštiti Sredozemnog mora od onečišćenja iz izvora i djelatnosti
    na kopnu (Protokol o onečišćenju iz izvora i djelatnosti na kopnu)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/14 határozata (2021. december 2.) a Földközi-tenger
    tengeri környezetének és partvidékének szennyezés elleni védelméről szóló
    egyezmény (a Barcelonai Egyezmény) és jegyzőkönyvei szerződő feleinek 22.
    ülésén a Földközi-tenger szárazföldi forrásokból és tevékenységekből
    származó szennyezés elleni védelméről szóló jegyzőkönyv (a szárazföldi
    eredetű szennyezésről szóló jegyzőkönyv) 15. cikke szerinti, a települési
    szennyvíz és szennyvíziszap kezelésére vonatkozó regionális tervek elfogadásáról
    szóló határozatra tekintettel az Európai Unió nevében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/14 del Consiglio del 2 dicembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea alla 22a riunione delle parti
    contraenti della convenzione sulla protezione dell’ambiente marino e del litorale
    del Mediterraneo (convenzione di Barcellona) e dei relativi protocolli in merito
    all’adozione, nell’ambito dell’articolo 15 del protocollo per la protezione
    del Mar Mediterraneo dall’inquinamento derivante da fonti e attività terrestri
    (protocollo LBS), di una decisione di adottare piani regionali concernenti il
    trattamento delle acque reflue e la gestione dei fanghi di depurazione
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/14 (2021. gada 2. decembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Konvencijas par Vidusjūras reģiona jūras
    vides un piekrastes aizsardzību (Barselonas konvencija) un tās protokolu Līgumslēdzēju
    pušu 22. sanāksmē attiecībā uz tāda lēmuma pieņemšanu, ar kuru Protokola
    par Vidusjūras aizsardzību pret piesārņojumu no sauszemes avotiem un darbībām
    (LBS protokols) 15. panta satvarā pieņem reģionālos plānus par komunālo
    notekūdeņu attīrīšanu un notekūdeņu dūņu apsaimniekošanu
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/14 2021 m. gruodžio 2 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi 22-ajame Viduržemio jūros
    aplinkos ir pakrančių zonos apsaugos konvencijos (Barselonos konvencijos) ir
    jos protokolų susitariančiųjų šalių susitikime, dėl sprendimo priimti regioninius
    miesto nuotekų valymo ir nuotekų dumblo tvarkymo planus pagal Protokolo dėl
    Viduržemio jūros apsaugos nuo žemyninės kilmės taršos ir veiklos (Protokolo
    dėl žemyninės kilmės taršos) 15 straipsnį priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/14 tat-2 ta’ Diċembru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fit-22 laqgħa tal-Partijiet
    Kontraenti għall-Konvenzjoni għall-Protezzjoni tal-Ambjent tal-Baħar u tar-Reġjun
    Kostali tal-Mediterran (il-Konvenzjoni ta’ Barċellona) u l-Protokolli tagħha
    fir-rigward tal-adozzjoni ta’ deċiżjoni li tadotta Pjanijiet Reġjonali dwar
    it-Trattament tal-Ilma Urban Mormi u l-Ġestjoni tal-Ħama tad-Drenaġġ fil-qafas
    tal-Artikolu 15 tal-Protokoll dwar il-Ħarsien tal-Baħar Mediterran mit-Tniġġis
    ta’ Oriġini u minn Attivitajiet Terrestri (Protokoll LBS)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/14 van de Raad van 2 december 2021 betreffende het standpunt
    dat namens de Europese Unie moet worden ingenomen tijdens de 22e vergadering van
    de partijen bij het Verdrag inzake de bescherming van het mariene milieu en de
    kustgebieden van de Middellandse Zee (Verdrag van Barcelona) en de bijbehorende
    protocollen, wat betreft de vaststelling van een besluit tot aanneming van regionale
    plannen inzake de behandeling van stedelijk afvalwater en het beheer van zuiveringsslib
    in het kader van artikel 15 van het Protocol inzake de bescherming van de Middellandse
    Zee tegen verontreiniging door bronnen en activiteiten op het land (protocol inzake
    verontreiniging vanaf het land)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/14 z dnia 2 grudnia 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej na 22. konferencji Umawiających
    się Stron Konwencji o ochronie środowiska morskiego i regionu przybrzeżnego
    Morza Śródziemnego („konwencja barcelońska”) i protokołów do niej w odniesieniu
    do przyjęcia decyzji o przyjęciu regionalnych planów oczyszczania ścieków
    komunalnych oraz gospodarowania osadami ściekowymi, w ramach art. 15 Protokołu
    dotyczącego ochrony Morza Śródziemnego przed zanieczyszczeniem ze źródeł
    i działalności lądowej
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/14 do Conselho de 2 de dezembro de 2021 relativa à
    posição a tomar em nome da União Europeia na 22.a reunião das Partes Contratantes
    na Convenção sobre a Proteção do Meio Marinho e do Litoral do Mediterrâneo
    («Convenção de Barcelona») e respetivos protocolos no que respeita à adoção
    de uma decisão de adoção de planos regionais para o tratamento de águas residuais
    urbanas e a gestão das lamas de depuração, no âmbito do artigo 15.o do Protocolo
    relativo à Proteção do Mar Mediterrâneo contra a Poluição Proveniente de
    Fontes e Atividades Situadas em Terra
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/14 a Consiliului din 2 decembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, la cea de a 22-a
    reuniune a părților contractante la Convenția privind protejarea mediului marin
    și a zonei de coastă a Mării Mediterane (Convenția de la Barcelona) și la
    protocoalele la aceasta, în ceea ce privește adoptarea deciziei de aprobare
    a planurilor regionale referitoare la tratarea apelor urbane reziduale și gestionarea
    nămolurilor de epurare, în cadrul articolului 15 din Protocolul privind protecția
    Mării Mediterane împotriva poluării din surse și activități terestre (Protocolul
    LBS)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/14 z 2. decembra 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na 22. zasadnutí zmluvných strán Dohovoru
    o ochrane morského prostredia a pobrežných oblastí Stredozemného mora (Barcelonský
    dohovor) a jeho protokolov, pokiaľ ide o prijatie rozhodnutia, ktorým sa na
    základe článku 15 Protokolu o ochrane Stredozemného mora pred znečisťovaním
    zo zdrojov a činností na pevnine (protokol o ZZP) prijímajú regionálne plány
    o čistení komunálnych odpadových vôd a o nakladaní s čistiarenským kalom
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/14 z dne 2. decembra 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 22. zasedanju pogodbenic Konvencije za varstvo morskega
    okolja in obalnega območja Sredozemlja (Barcelonska konvencija) in njenih protokolov
    glede sprejetja sklepa o sprejetju regionalnih načrtov za čiščenje komunalne
    odpadne vode in ravnanje z blatom iz čistilnih naprav v okviru člena 15 Protokola
    za varstvo Sredozemskega morja pred onesnaževanjem iz virov in dejavnosti na
    kopnem (Protokol o virih na kopnem)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/14 del Consejo de 2 de diciembre de 2021 relativa a
    la posición que debe adoptarse en nombre de la Unión en la 22.a reunión de
    las Partes Contratantes en el Convenio para la Protección del Medio Marino y
    de la Región Costera del Mediterráneo (Convenio de Barcelona) y sus Protocolos
    con respecto a la adopción de una decisión por la que se adoptarán planes regionales
    relativos al tratamiento de las aguas residuales urbanas y a la gestión de los
    lodos de depuración en el marco del artículo 15 del Protocolo para la Protección
    del Mar Mediterráneo contra la Contaminación Causada por Fuentes y Actividades
    Situadas en Tierra (Protocolo sobre Fuentes y Actividades en Tierra)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/14 av den 2 december 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar vid det 22:a mötet för de fördragsslutande
    parterna i konventionen om skydd av Medelhavets marina miljö och kustregion (Barcelonakonventionen)
    och dess protokoll vad gäller antagandet av ett beslut om antagande av regionala
    planer för rening av avloppsvatten från tätbebyggelse och hantering av avloppsslam
    inom ramen för artikel 15 i protokollet om skydd av Medelhavet mot förorening
    från landbaserade källor och aktiviteter (LBS-protokollet)
  type: main
