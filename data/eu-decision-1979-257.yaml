id: EUDecision1979257
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/257/EEC: Commission Decision of 21 February 1979 authorizing the French
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain and other kinds
    of pottery, falling within heading No 69.11 and subheadings 69.12 C and D of the
    Common Customs Tariff, originating in the People'' s Republic of China and in
    free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/257/CEE: Décision de la Commission, du 21 février 1979, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine, en faïence ou en autres
    matières céramiques, de la position 69.11 et des sous-positions 69.12 C et D
    du tarif douanier commun, originaires de la République populaire de Chine et
    mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/257/EWG: Entscheidung der Kommission vom 21. Februar 1979, mit der
    die Französische Republik ermächtigt wird, aus der Volksrepublik China stammendes
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts-
    und Toilettengegenstände, aus Porzellan, aus Steingut und aus anderen keramischen
    Stoffen, der Tarifstellen 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/257/EØF: Kommissionens beslutning af 21. februar 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler, af porcelæn eller af andet keramisk materiale,
    som henhører under pos. 69.11 og 69.12 C og D i den fælles toldtarif, har oprindelse
    i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/257/CEE: Decisione della Commissione, del 21 febbraio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il vasellame e
    gli oggetti di uso domestico o da toletta, di porcellana, di terracotta o di altre
    materie ceramiche, della voce 69.11 e delle sottovoci 69.12 C e D della tariffa
    doganale comune, originari della Repubblica popolare cinese e messi in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/257/EEG: Beschikking van de Commissie van 21 februari 1979 waarbij
    de Franse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen
    van porselein, van faience of van andere keramische stoffen, van de posten 69.11
    en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
