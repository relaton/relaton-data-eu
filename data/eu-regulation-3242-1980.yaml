title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3242/80 of 15 December 1980 authorizing
    the conclusion of long-term private storage contracts for grape must and concentrated
    grape must in respect of the 1980/81 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3242/80 de la Commission, du 15 décembre 1980, ouvrant
    la possibilité de conclure des contrats de stockage privé à long terme pour
    des moûts de raisins et des moûts de raisins concentrés pour la campagne 1980/1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3242/80 der Kommission vom 15. Dezember 1980 zur Ermöglichung
    des Abschlusses von Verträgen für die langfristige private Lagerhaltung von
    Traubenmosten und konzentrierten Traubenmosten für das Wirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3242/80 af 15. december 1980 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af druemost og koncentreret
    druemost for produktionsåret 1980/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3242/80 τής Επιτροπής
    τής 15ης Δεκεμβρίου 1980 περί παροχής δυνατότητος
    συνάψεως συμφωνητικών μακροπροθέσμου ιδιωτικής
    αποθεματοποιήσεως γλευκών σταφυλής καί συμπυκνωμένων
    γλευκών σταφυλής γιά τήν περίοδο 1980/81
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3242/80 della Commissione, del 15 dicembre 1980, che
