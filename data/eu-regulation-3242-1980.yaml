    magazzinaggio privato a lungo termine per i mosti di uve e i mosti di uve concentrati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3242/80 van de Commissie van 15 december 1980 betreffende
    het openen van de mogelijkheid tot het sluiten van langlopende contracten voor
    de particuliere opslag van druivemost en geconcentreerde druivemost voor het wijnoogstjaar
    1980/1981
  type: main
