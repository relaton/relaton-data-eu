title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2277/82 of 17 August 1982 re-establishing
    the levying of customs duties on articles of apparel and clothing accessories,
    of leather or of composition leather, falling within subheadings 42.03 A, B II,
    III, C and originating in Uruguay, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2277/82 de la Commission, du 17 août 1982, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    et accessoires du vêtement en cuir naturel, artificiel ou reconstitué, des sous-positions
    42.03 A, B II, III, C du tarif douanier commun, originaires d' Uruguay, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2277/82 der Kommission vom 17. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör aus Leder oder
    Kunstleder der Tarifstellen 42.03 A, B II, III und C, mit Ursprung in Uruguay,
    dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werdent
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2277/82 af 17. august 1982 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil, af læder
    eller kunstlæder, henhørende under pos. 42.03 A, B II, III, C og med oprindelse
    i Uruguay, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2277/82 τής Επιτροπής
    τής 17ης Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά ενδύματα καί εξαρτήματα
    τού ενδύματος εκ δέρματος φυσικού, τεχνητού
    ή ανεσχηματισμένου, τών διακρίσεων 42. 03 Α, Β
    ΙΙ καί ΙΙΙ καί Γ τού Κοινού Δασμολογίου, καταγωγής
    Ουρουγουάης, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2277/82 della Commissione, del 17 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di vestiario
    e loro accessori di cuoio o di pelli, naturali, artificiali o ricostituiti, delle
    sottovoci 42.03 A, B II, B III e C della tariffa doganale comune, originari dell'
    Uruguay, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2277/82 van de Commissie van 17 augustus 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren, van leder of van kunstleder, van postonderverdelingen 42.03
    A, B II, B III en C, van oorsprong uit Uruguay, waarvoor de in Verordening (EEG)
    nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
