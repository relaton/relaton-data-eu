title:
- language: en
  script: Latn
  content: Council Directive 90/487/EEC of 17 September 1990 amending Directive 79/196/EEC
    on the approximation of the laws of the Member States concerning electrical equipment
    for use in potentially explosive atmospheres employing certain types of protection
  type: main
- language: fr
  script: Latn
  content: Directive 90/487/CEE du Conseil du 17 septembre 1990 modifiant la directive
    79/196/CEE concernant le rapprochement des législations des États membres relatives
    au matériel électrique utilisable en atmosphère explosible mettant en oeuvre
    certains modes de protection
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/487/EWG des Rates vom 17. September 1990 zur Änderung der
    Richtlinie 79/196/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    betreffend elektrische Betriebsmittel zur Verwendung in explosibler Atmosphäre,
    die mit bestimmten Zündschutzarten versehen sind
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/487/EØF af 17. september 1990 om ændring af direktiv
    79/196/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning vedrørende
    elektrisk materiel til anvendelse i eksplosionsfarlig atmosfære og om indførsel
    af visse beskyttelsesmåder
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/487/ΕΟΚ του Συμβουλίου της 17ης Σεπτεμβρίου
    1990 για την τροποποίηση της οδηγίας 79/196/ΕΟΚ
    περί προσέγγισης των νομοθεσιών των κρατών
    μελών που αφορούν το ηλεκτρολογικό υλικό που
    δύναται να χρησιμοποιηθεί σε ατμόσφαιρα υπέχουσα
    τον κίνδυνο εκρήξεως και που απαιτεί ορισμένους
    τρόπους προστασίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/487/ETY, annettu 17 päivänä syyskuuta 1990,
    räjähdysvaarallisissa tiloissa käytettäviä, tietyntyyppisellä suojauksella
    varustettuja sähkölaitteita koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun neuvoston direktiivin 79/196/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 90/487/CEE del Consiglio del 17 settembre 1990 che modifica la
    direttiva 79/196/CEE riguardante il ravvicinamento delle legislazioni degli Stati
    Membri relative al materiale elettrico destinato ad essere utilizzato in atsmosfera
    esplosiva, per il quale si applicano taluni metodi di protezione
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/487/EEG van de Raad van 17 september 1990 tot wijziging van
    Richtlijn 79/196/EEG inzake de onderlinge aanpassing van de wetgevingen van de
    Lid- Staten betreffende elektrisch materieel bestemd voor gebruik in explosieve
    omgeving, dat aan bepaalde beveiligingswijzen voldoet
  type: main
- language: pt
  script: Latn
  content: Directiva 90/487/CEE do Conselho de 17 de Setembro de 1990 que altera a
