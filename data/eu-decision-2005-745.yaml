---
id: EUDecision2005745
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2005/745/EC: Commission Decision of 21 October 2005 amending Decision
    2005/734/EC laying down biosecurity measures to reduce the risk of transmission
    of highly pathogenic avian influenza caused by influenza A virus of subtype H5N1
    from birds living in the wild to poultry and other captive birds and providing
    for an early detection system in areas at particular risk (notified under document
    number C(2005) 4199)'
  type: main
- language: fr
  script: Latn
  content: '2005/745/CE: Décision de la Commission du 21 octobre 2005 modifiant la
    décision 2005/734/CE arrêtant des mesures de biosécurité destinées à limiter
    le risque de transmission aux volailles et autres oiseaux captifs, par des oiseaux
    vivant à l’état sauvage, de l’influenza aviaire hautement pathogène causée
    par le sous-type H5N1 du virus de l’influenza A, et établissant un système
    de détection précoce dans les zones particulièrement exposées [notifiée sous
    le numéro C(2005) 4199]'
  type: main
- language: de
  script: Latn
  content: '2005/745/EG: Entscheidung der Kommission vom 21. Oktober 2005 zur Änderung
    der Entscheidung 2005/734/EG mit Biosicherheitsmaßnahmen zur Verringerung des
    Risikos der Übertragung hoch pathogener aviärer Influenza-A-Viren des Subtyps
    H5N1 von Wildvögeln auf Hausgeflügel und andere in Gefangenschaft gehaltene
    Vogelarten und zur Früherkennung der Krankheit in besonders gefährdeten Gebieten
    (Bekannt gegeben unter Aktenzeichen K(2005) 4199)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 21 октомври 2005 година
    за изменение на Решение 2005/734/ЕО за установяването
    на мерки за биосигурност за намаляване на риска
    от пренасяне на високо патогенна инфлуенца
    по птиците, причинена от вирус на инфлуенца
    тип А от подтип Н5N1, от птици, живеещи в дивата
    среда, към домашните птици и други птици, отглеждани
    на закрито и за осигуряване на система за ранно
    откриване в области с особен риск (нотифицирано
    под номер С(2005) 4199)
  type: main
- language: cs
  script: Latn
  content: '2005/745/ES: Rozhodnutí Komise ze dne 21. října 2005, kterým se mění
    rozhodnutí 2005/734/ES, kterým se stanoví opatření biologické bezpečnosti,
    jež mají snížit riziko přenosu vysoce patogenní influenzy ptáků způsobované
    virem influenzy typu A podtypu H5N1 z volně žijících ptáků na drůbež a
    jiné ptáky chované v zajetí, a kterým se stanoví systém včasného odhalení
    v mimořádně ohrožených oblastech (oznámeno pod číslem K(2005) 4199)'
  type: main
- language: da
  script: Latn
  content: '2005/745/EF: Kommissionens beslutning af 21. oktober 2005 om ændring
    af beslutning 2005/734/EF om biosikkerhedsforanstaltninger med henblik på at
    reducere risikoen for overførsel af højpatogen aviær influenza forårsaget
    af influenzatype A, subtype H5N1, fra vildtlevende fugle til fjerkræ og andre
    fugle i fangenskab og om et system for tidlig påvisning i områder med særlig
    risiko (meddelt under nummer K(2005) 4199)'
  type: main
- language: el
  script: Grek
  content: '2005/745/ΕΚ: Απόφαση της Επιτροπής, της 21ης
    Οκτωβρίου 2005, για την τροποποίηση της απόφασης
    2005/734/ΕΚ για τη θέσπιση μέτρων βιοασφάλειας
    με σκοπό τη μείωση του κινδύνου μετάδοσης της
    υψηλής παθογονικότητας γρίπης των πτηνών,
    που προκαλείται από τον υπότυπο H5N1 του ιού
    της γρίπης τύπου A, από τα άγρια πτηνά στα πουλερικά
    και σε άλλα πτηνά σε αιχμαλωσία, καθώς και για
    την πρόβλεψη συστήματος έγκαιρης ανίχνευσης
    στις ιδιαίτερα ευπρόσβλητες περιοχές [κοινοποιηθείσα
    υπό τον αριθμό Ε(2005) 4199]'
  type: main
- language: et
  script: Latn
  content: '2005/745/EÜ: Komisjoni otsus, 21. oktoober 2005, millega muudetakse otsust
    2005/734/EÜ, millega kehtestatakse bio-ohutusmeetmed, et vähendada A-tüüpi
    gripiviiruse alatüübi H5N1 põhjustatud väga patogeense lindude gripi kandumise
    ohtu metslindudelt kodulindudele ja teistele vangistuses elavatele lindudele ning
    rajada väga ohustatud piirkondadesse varajase avastamise süsteem (teatavaks
    tehtud numbri K(2005) 4199 all)'
  type: main
- language: fi
  script: Latn
  content: '2005/745/EY: Komission päätös, tehty 21 päivänä lokakuuta 2005,
    bioturvallisuustoimenpiteistä influenssavirus A:n alatyypin H5N1 aiheuttaman
    erittäin patogeenisen lintuinfluenssan tarttumisvaaran vähentämiseksi luonnonvaraisista
    linnuista siipikarjaan ja muihin vankeudessa pidettäviin lintuihin sekä varhaisen
    havaitsemisen järjestelmästä erityisen vaaralle alttiilla alueilla tehdyn komission
    päätöksen 2005/734/EY muuttamisesta (tiedoksiannettu numerolla K(2005) 4199)'
  type: main
- language: hr
  script: Latn
  content: '2005/745/EZ: Odluka Komisije od 21. listopada 2005. o izmjeni Odluke 2005/734/EZ
    o utvrđivanju biosigurnosnih mjera za smanjenje rizika od prijenosa jako patogene
    influence ptica koju uzrokuje tip A virusa influence podtip H5N1 s ptica koje
    žive u divljini na perad i druge ptice koje se drže u zatočeništvu te o predviđanju
    sustava ranog otkrivanja u područjima koja su u posebnom riziku (priopćena pod
    brojem dokumenta C(2005) 4199)'
  type: main
- language: hu
  script: Latn
  content: '2005/745/EK: A Bizottság határozata (2005. október 21.) a H5N1 altípus
    alá tartozó A típusú influenzavírus által okozott nagy patogenitású madárinfluenzának
    a vadon élő madarakról a baromfira és más, fogságban élő madarakra történő
    átvitele veszélyének csökkentésére irányuló biológiai biztonsági intézkedések
    meghatározásáról és a különös veszélyben lévő területeken korai észlelő
    rendszer biztosításáról szóló 2005/734/EK határozat módosításáról
    (az értesítés a C(2005) 4199. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2005/745/CE: Decisione della Commissione, del 21 ottobre 2005, che modifica
    la decisione 2005/734/CE che istituisce misure di biosicurezza per ridurre il
    rischio di trasmissione dell’influenza aviaria ad alta patogenicità provocata
    dal virus dell’influenza A, sottotipo H5N1, dai volatili che vivono allo stato
    selvatico al pollame e ad altri volatili in cattività, e che prevede un sistema
    di individuazione precoce nelle zone particolarmente a rischio [notificata con
    il numero C(2005) 4199]'
  type: main
- language: lv
  script: Latn
  content: '2005/745/EK: Komisijas Lēmums (2005. gada 21. oktobris), ar kuru groza
    Lēmumu 2005/734/EK, ar ko nosaka biodrošības pasākumus, lai mazinātu risku,
    ka ļoti patogēno putnu gripu, ko izraisa A tipa H5N1 apakštipa gripas vīruss,
    no savvaļas putniem varētu pārnest uz mājputniem un citiem nebrīvē turētiem
    putniem, un ar ko paredz agrīnas konstatācijas sistēmu īpaši apdraudētos
    apgabalos (izziņots ar dokumenta numuru K(2005) 4199)'
  type: main
- language: lt
  script: Latn
  content: '2005/745/EB: 2005 m. spalio 21 d. Komisijos sprendimas, iš dalies keičiantis
    Sprendimą 2005/734/EB, nustatantį biologinio saugumo priemones naminių ir kitų
    nelaisvėje laikomų paukščių užsikrėtimo labai patogenišku paukščių
    gripu, kurį sukelia A gripo viruso H5N1 subtipas, nuo laukinių paukščių pavojui
    sumažinti ir nustatantį ankstyvo ligos aptikimo sistemą ypač pažeidžiamose
    teritorijose (pranešta dokumentu Nr. C(2005) 4199)'
  type: main
- language: mt
  script: Latn
  content: '2005/745/KE: Deċiżjoni tal-Kummissjoni tal- 21 ta’ Ottubru 2005 li
    temenda d-Deċiżjoni 2005/734/KE li tistabbilixxi miżuri ta'' bijosigurtà sabiex
    jitnaqqas ir-riskju ta'' trażmissjoni ta'' l-influwenza tat-tjur b''patoġeniċità
    għolja kkawżata mis-sottotip H5N1 tal- virus A ta'' l-Influwenza minn għasafar
    selvaġġi fl-ambjent naturali tagħhom għal tjur ta'' l-irziezet u għasafar
    oħra mrobbija mill-bniedem u li tipprevedi sistema ta'' ditezzjoni minn kmieni
    f''żoni b''riskju partikolari (innotifikata taħt dokument numru C(2005) 4199)'
  type: main
- language: nl
  script: Latn
  content: '2005/745/EG: Beschikking van de Commissie van 21 oktober 2005 tot wijziging
    van Beschikking 2005/734/EG tot vaststelling van bioveiligheidsmaatregelen ter
    beperking van het risico van overdracht van hoogpathogene aviaire influenza, veroorzaakt
    door het influenza A-virus subtype H5N1, van in het wild levende vogels naar pluimvee
    en andere in gevangenschap gehouden vogels en tot instelling van een systeem voor
    vroege opsporing in risicogebieden (Kennisgeving geschied onder nummer C(2005)
    4199)'
  type: main
- language: pl
  script: Latn
  content: '2005/745/WE: Decyzja Komisji z dnia 21 października 2005 r. zmieniająca
    decyzję 2005/734/WE ustanawiającą środki bezpieczeństwa biologicznego w celu
    zmniejszenia ryzyka przeniesienia wysoce zjadliwej grypy ptaków spowodowanej
    przez wirus grypy A podtyp H5N1 z ptaków dziko żyjących na drób i inne ptaki
    żyjące w niewoli oraz przewidująca system wczesnego wykrywania na obszarach
    szczególnego ryzyka (notyfikowana jako dokument nr C(2005) 4199)'
  type: main
- language: pt
  script: Latn
  content: '2005/745/CE: Decisão da Comissão, de 21 de Outubro de 2005, que altera
    a Decisão 2005/734/CE, que estabelece medidas de biossegurança destinadas a
    reduzir o risco de transmissão da gripe aviária de alta patogenicidade provocada
    pelo vírus da gripe do tipo A, subtipo H5N1, de aves em meio selvagem para aves
    de capoeira e outras aves em cativeiro e que prevê um sistema de detecção precoce
    em zonas de risco especial [notificada com o número C(2005) 4199]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 21 octombrie 2005 de modificare a Deciziei 2005/734/CE
    de stabilire a unor măsuri de biosecuritate destinate limitării riscului de
    transmitere la păsările de curte și la alte păsări ținute în captivitate,
    de la păsările sălbatice vii, a influenței aviare cu patogenitate înaltă
    cauzate de subtipul H5N1 al virusului influenței A și de stabilire a unui sistem
    de depistare timpurie în zonele cu grad ridicat de risc [notificată cu numărul
    C(2005) 4199]
  type: main
- language: sk
  script: Latn
  content: '2005/745/ES: Rozhodnutie Komisie z 21. októbra 2005, ktorým sa mení
    a dopĺňa rozhodnutie 2005/734/ES, ktorým sa ustanovujú opatrenia biologickej
    bezpečnosti na zníženie rizika prenosu vysoko patogénnej vtáčej chrípky
    spôsobovanej vírusom chrípky A podtypu H5N1 z voľne žijúcich vtákov na
    hydinu a iné vtáky chované v zajatí a ktorým sa zavádza systém včasného
    zisťovania v obzvlášť rizikových oblastiach [oznámené pod číslom K(2005)
    4199]'
  type: main
- language: sl
  script: Latn
  content: '2005/745/ES: Odločba Komisije z dne 21. oktobra 2005 o spremembi Odločbe
    2005/734/ES o določitvi ukrepov biološke varnosti za zmanjšanje tveganja prenosa
    visoko patogene aviarne influence, ki jo povzroča virus influence A H5N1, s ptic,
    ki živijo v divjini, na perutnino in druge ptice v ujetništvu ter zagotavljanje
    sistema zgodnjega odkrivanja na območjih z izrazitim tveganjem (notificirano
    pod dokumentarno śtevilko K(2005) 4199)'
  type: main
- language: es
  script: Latn
  content: '2005/745/CE: Decisión de la Comisión, de 21 de octubre de 2005, que
    modifica la Decisión 2005/734/CE por la que se establecen medidas de bioseguridad
    para reducir el riesgo de transmisión de gripe aviar altamente patógena causada
    por el subtipo H5N1 del virus A de la gripe de aves silvestres a aves de corral
    y otras aves cautivas, y se establece un sistema de detección precoz en las zonas
    de especial riesgo [notificada con el número C(2005) 4199]'
  type: main
- language: sv
  script: Latn
  content: '2005/745/EG: Kommissionens beslut av den 21 oktober 2005 om ändring av
    beslut 2005/734/EG om fastställande av åtgärder för biosäkerhet för att
    minska risken för överföring av högpatogen aviär influensa orsakad av influensavirus
    A av subtyp H5N1 från viltlevande fåglar till fjäderfä och andra fåglar i
    fångenskap och om ett system för tidig upptäckt i särskilt riskutsatta områden
    [delgivet med nr K(2005) 4199]'
