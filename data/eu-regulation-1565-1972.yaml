title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1565/72 of the Council of 20 July 1972 laying down,
    for the 1972/73 wine-growing year, the price to be paid for alcohol delivered
    to intervention agencies under the obligation to distil the by-products of wine
    making and the amount of the contribution towards this price by the Guarantee
    Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1565/72 du Conseil, du 20 juillet 1972, déterminant,
    pour la campagne viticole 1972/1973, le prix à payer pour l' alcool livré aux
    organismes d' intervention au titre de la distillation obligatoire des sous-produits
    de la vinification et le montant de l' intervention, dans ce prix, du Fonds européen
    d' orientation et de garantie agricole, section garantie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1565/72 des Rates vom 20. Juli 1972 zur Festlegung
    - für das Weinwirtschaftsjahr 1972/1973 - des von den Interventionsstellen zu
    zahlenden Preises für den Alkohol, der ihnen im Rahmen der vorgesehenen Destillation
    der Nebenerzeugnisse der Weinbereitung geliefert wird, und des dabei vom Europäischen
    Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung Garantie, zu
    übernehmenden Anteils
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1565/72 af 20. juli 1972 om fastsættelse,
    for vinhøståret 1972/1973, af den pris, der skal betales for alkohol leveret
    til interventionsorganerne inden for rammerne af den obligatoriske destillering
    af biprodukter fra vinfremstillingen og af den andel, der skal overtages af Den
    europæiske udviklings- og garantifond for Landbruget, garantisektionen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1565/72 del Consiglio, del 20 luglio 1972, che fissa,
    per la campagna viticola 1972/1973, il prezzo dell' alcole consegnato agli organismi
    d' intervento per la distillazione obbligatoria dei sottoprodotti della vinificazione
    e determina l' importo dell' intervento in tale prezzo del FEAOG, sezione garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1565/72 van de Raad van 20 juli 1972 tot vaststelling,
    voor het wijnoogstjaar 1972/1973, van de prijs die moet worden betaald voor de,
    aan de interventiebureaus uit hoofde van de verplichte distillatie van de bijprodukten
    van de wijnbereiding geleverde alcohol, alsmede van het bedrag van de deelneming
    van het Europees Oriëntatie- en Garantiefonds voor de Landbouw, afdeling Garantie
  type: main
