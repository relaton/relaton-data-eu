title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 7 mars 1969, autorisant la République française,
    en vertu de l'article 115 alinéa 1 du Traité, à percevoir une taxe compensatoire
    à l'importation de "crevettes" de la position n° Ex 16.05 B du TDC originaires
    des pays tiers et mises en libre pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '69/104/EWG: Entscheidung der Kommission vom 7. März 1969, mit der die
    Französische Republik ermächtigt wird, gemäß Artikel 115 Absatz 1 des Vertrages
    bei der Einfuhr von aus dritten Ländern stammenden und in den Beneluxländern
    im freien Verkehr befindlichen "Garnelen" der Tarifnummer ex 16.05 B des Gemeinsamen
    Zolltarifs eine Ausgleichsabgabe zu erheben'
  type: main
- language: it
  script: Latn
  content: '69/104/CEE: Decisione della Commissione, del 7 marzo 1969, che in virtù
    dell''articolo 115, primo capoverso, del trattato, autorizza la Repubblica francese
    a riscuotere una tassa di compensazione sulle importazioni di « gamberetti »
    della voce ex 16.05 B della tariffa doganale comune, originari dei paesi terzi
    ed immessi in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '69/104/EEG: Beschikking van de Commissie van 7 maart 1969 waarbij de Franse
    Republiek wordt gemachtigd om op grond van artikel 115, eerste alinea, van het
    Verdrag een compenserende heffing toe te passen bij de invoer van garnalen van
    post ex 16.05 B van het gemeenschappelijk douanetarief, van oorsprong uit derde
    landen en in de Benelux-landen in het vrije verkeer gebracht'
  type: main
