title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3798/88 of 24 November 1988 laying down
    detailed rules concerning follow-up reports on projects granted financial aid
    in the framework of Community measures to improve and adapt structures in the
    fisheries and aquaculture sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3798/88 de la Commission du 24 novembre 1988 fixant
    les modalités relatives aux rapports de suivi sur les projets bénéficiant d'un
    concours financier dans le cadre d'actions d'aides communautaires pour l'amélioration
    et l'adaptation des structures du secteur de la pêche et de l'aquaculture
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3798/88 der Kommission vom 24. November 1988 mit Vorschriften
    für die Abschlußberichte über die mit Gemeinschaftszuschüssen finanzierten
    Vorhaben im Rahmen der Gemeinschaftsmaßnahmen zur Verbesserung und Anpassung
    der Strukturen im Bereich der Fischerei und der Aquakultur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3798/88 af 24. november 1988 om nærmere
    bestemmelser for udarbejdelse af opfølgningsrapporter vedrørende projekter,
    hvortil der er ydet finansiel støtte som led i fællesskabsforanstaltninger til
    forbedring og tilpasning af fiskeri- og akvakulturstrukturerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3798/88 της Επιτροπής
    της 24ης Νοεμβρίου 1988 για τη θέσπιση λεπτομερών
    κανόνων όσον αφορά τις εκθέσεις πεπραγμένων
    για τα σχέδια που έχουν τύχει χρηματικής ενίσχυσης
    στα πλαίσια των κοινοτικών μέτρων για τη βελτίωση
    και την προσαρμογή των διαρθρώσεων του τομέα
    της αλιείας και της υδατοκαλλιέργειας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3798/88 della Commissione del 24 novembre 1988 che
    fissa le modalità d'applicazione relative alle relazioni di controllo sui progetti
    che hanno beneficiato di un contributo finanziario nell'ambito delle azioni comunitarie
    per il miglioramento e l'adeguamento delle strutture nel settore della pesca e
    dell'acquicoltura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3798/88 van de Commissie van 24 november 1988 houdende
    nadere bepalingen voor de voortgangsverslagen over projecten waarvoor in het raam
    van communautaire acties voor verbetering en aanpassing van de structuur van de
    visserij en de aquicultuur financiële steun is verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3798/88 da Comissão de 24 de Novembro de 1988 que
    estabelece as normas de execução relativas aos relatórios de acompanhamento
    sobre os resultados dos projectos aos quais foi concedida uma ajuda financeira
    no âmbito das acções comunitárias para o melhoramento e a adaptação das
    estruturas do sector da pesca e da aquicultura
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3798/88 de la Comisión de 24 de noviembre de 1988
    por el que se establecen las disposiciones relativas a los informes de seguimiento
    sobre los resultados de los proyectos que se beneficien de una ayuda financiera
    de la Comunidad en el marco de las medidas comunitarias para la mejora y la adaptación
    de las estructuras del sector pesquero y de la acuicultura
  type: main
