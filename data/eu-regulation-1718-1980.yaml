    da applicare alle navi immatricolate nelle isole Faerøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1718/80 van de Raad van 30 juni 1980 tot vaststelling
    voor 1980 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visstand, van toepassing op vaartuigen die op de Faeröer geregistreerd zijn
