  content: Council Regulation (EEC) No 1718/80 of 30 June 1980 laying down for 1980
    certain measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1718/80 du Conseil, du 30 juin 1980, fixant, pour
    l' année 1980, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1718/80 des Rates vom 30. Juni 1980 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für die auf
    den Färöern registrierten Schiffe für 1980
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1718/80 af 30. juni 1980 om fastsættelse
    for 1980 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1718/80 del Consiglio, del 30 giugno 1980, che dispone
