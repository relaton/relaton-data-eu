title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 527/2003 of 17 March 2003 authorising the offer
    and delivery for direct human consumption of certain wines imported from Argentina
    which may have undergone oenological processes not provided for in Regulation
    (EC) No 1493/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 527/2003 du Conseil du 17 mars 2003 autorisant l'offre
    et la livraison à la consommation humaine directe de certains vins importés
    d'Argentine susceptibles d'avoir fait l'objet de pratiques œnologiques non prévues
    par le règlement (CE) n° 1493/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 527/2003 des Rates vom 17. März 2003 zur Genehmigung
    des Anbietens oder der Abgabe zum unmittelbaren menschlichen Verbrauch von bestimmten
    aus Argentinien eingeführten Weinen, bei denen angenommen werden kann, dass sie
    Gegenstand von in der Verordnung (EG) Nr. 1493/1999 nicht vorgesehenen önologischen
    Verfahren waren
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 527/2003 ze dne 17. března 2003, kterým se
    povoluje nabízení nebo dodávání některých vín dovážených z Argentiny,
    u nichž mohlo být použito enologických postupů nestanovených v nařízení
    (ES) č. 1493/1999, k přímé lidské spotřebě
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 527/2003 af 17. marts 2003 om tilladelse til
    udbud og levering til direkte konsum af visse vine, der er importeret fra Argentina,
    og som eventuelt har været genstand for en ønologisk behandling, der ikke er
    fastsat i forordning (EF) nr. 1493/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 527/2003 του Συμβουλίου,
    της 17ης Μαρτίου 2003, που επιτρέπει την προσφορά
    και την παράδοση στην άμεση ανθρώπινη κατανάλωση
    ορισμένων οίνων που εισάγονται από την Αργεντινή
    που μπορεί να έχουν υποβληθεί σε οινολογικές
    πρακτικές που δεν προβλέπονται από τον κανονισμό
    (ΕΚ) αριθ. 1493/1999
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 527/2003, 17. märts 2003, millega lubatakse
    otsetarbimiseks pakkuda ja tarnida teatavaid Argentinast imporditud veine, mille
    puhul võib olla kasutatud määruses (EÜ) nr 1493/1999 sätestamata veinivalmistusviise
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 527/2003, annettu 17 päivänä maaliskuuta 2003,
    eräiden Argentiinasta tuotavien sellaisenaan nautittavaksi tarkoitettujen viinien,
    joiden viininvalmistusmenetelmistä ei säädetä asetuksessa (EY) N:o 1493/1999,
    tarjoamisen ja toimittamisen sallimisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh ón gComhairle an 15 Iúil 2003 a leasaíonn Airteagal 23 den
    Phrótacal ar Reacht na Cúirte Breithiúnais
  type: main
- language: hu
  script: Latn
  content: A Tanács 527/2003/EK rendelete (2003. március 17.) az 1493/1999/EK rendeletben
    nem meghatározott borászati eljárásokkal kezelt egyes Argentínából importált
    borok közvetlen emberi fogyasztásra történő kínálatának és értékesítésének
    engedélyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 527/2003 del Consiglio, del 17 marzo 2003, che autorizza
    l'offerta e la consegna per il consumo umano diretto di taluni vini importati
    dall'Argentina che possono essere stati sottoposti a pratiche enologiche non previste
    dal regolamento (CE) n. 1493/1999
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 527/2003 (2003. gada 17. marts), ar ko atļauj
    piedāvāt un piegādāt tiešam patēriņam pārtikā dažus no Argentīnas ievestus
    vīnus, kuru gatavošanā, iespējams, izmantoti Regulā (EK) Nr. 1493/1999 neparedzēti
    vīndarības procesi
  type: main
- language: lt
  script: Latn
  content: 2003 m. kovo 17 d. Tarybos reglamentas (EB) Nr. 527/2003, suteikiantis
    leidimą tiesioginiam žmonių vartojimui pasiūlyti ir tiekti tam tikrus vynus,
    importuotus iš Argentinos, kuriems galėjo būti taikomi Reglamente (EB) Nr.
    1493/1999 nenumatyti vynininkystės procesai
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (EC) Nru 527/2003 tas-17 ta’ Marzu 2003 li
    jawtorizza l-offerta u l-konsenja għal konsum dirett uman ta’ ċerti nbejjed
    importati mill-Arġentina li setgħu li kienu għaddew minn proċess oenoloġiku
    li ma hemmx provvediment dwaru fir-Regolament (KE) Nru 1493/1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 527/2003 van de Raad van 17 maart 2003 houdende machtiging
    tot het aanbieden en leveren voor rechtstreekse menselĳke consumptie van bepaalde
    uit Argentinië ingevoerde wĳnen waarop oenologische procédés zĳn toegepast
    waarin niet is voorzien bĳ Verordening (EG) nr. 1493/1999
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 527/2003 z dnia 17 marca 2003 r. zezwalające
    na oferowanie i dostarczanie do bezpośredniego spożycia przez ludzi niektórych
    win przywożonych z Argentyny, które mogły być poddane procesom enologicznym
    nieprzewidzianym w rozporządzeniu (WE) nr 1493/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 527/2003 do Conselho, de 17 de Março de 2003, que
    autoriza a oferta e a entrega para consumo humano directo de certos vinhos importados
    da Argentina susceptíveis de terem sido objecto de práticas enológicas não
    previstas no Regulamento (CE) n.° 1493/1999
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 527/2003 zo 17. marca 2003, ktorým sa povoľuje
    ponuka a dodávka niektorých vín dovezených z Argentíny určených na priamu
    ľudskú spotrebu a ktoré pravdepodobne podstúpili enologické procesy nestanovené
    v nariadení (ES) č. 1493/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 527/2003 z dne 17. marca 2003 o dovoljenju za ponudbo
    in dobavo nekaterih iz Argentine uvoženih vin, namenjenih za neposredno prehrano
    ljudi, na katerih so bile opravljene enološke obdelave, ki niso predvidene v
    Uredbi (ES) št. 1493/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 527/2003 del Consejo, de 17 de marzo de 2003, por el
    que se autoriza la oferta y la entrega para el consumo humano directo de determinados
    vinos importados de Argentina que pueden haber sido sometidos a prácticas enológicas
    no previstas en el Reglamento (CE) n° 1493/1999
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 527/2003 av den 17 mars 2003 om tillstånd
    för saluföring och leverans för människors direkta konsumtion av vissa viner
    som importeras från Argentina och som kan ha varit föremål för oenologiska
    metoder som inte föreskrivs i förordning (EG) nr 1493/1999
  type: main
