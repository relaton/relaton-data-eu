title:
- language: en
  script: Latn
  content: '91/59/EEC: Commission Decision of 4 February 1991 terminating the review
    and confirming expiry of the anti-dumping measures applying to imports into the
    Community of self-propelled hydraulic excavators, track- laying or wheeled, of
    a total operating weight exceeding six tonnes but not exceeding 35 tonnes, equipped
    with a single bucket mounted on a boom capable of pivoting through 360 , or intended
    to be so equipped, originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '91/59/CEE: Décision de la Commission du 4 février 1991 portant clôture
    de la procédure de réexamen et confirmant l''expiration des mesures antidumping
    concernant les importations dans la Communauté d''excavateurs hydrauliques automoteurs,
    sur chenilles ou sur roues, d''un poids total supérieur à 6 tonnes mais n''excédant
    pas 35 tonnes, équipés ou destinés à être équipés d''un godet unique, monté
    sur un bras pouvant pivoter sur 360 originaires du Japon'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 4. Februar 1991 über die Einstellung der
    Überprüfung und die Bestätigung des Auslaufens der Antidumpingmaßnahmen betreffend
    die Einfuhren in die Gemeinschaft von hydraulischen Baggern auf Gleisketten oder
    Rädern mit einem Gesamtgewicht von mehr als 6 Tonnen bis einschließlich 35 Tonnen,
    um 360° schwenkbar, mit einem einzigen Kübel mit Ursprung in Japan (91/59/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 4. februar 1991 om afslutning af den fornyede
    undersøgelse og om bekræftelse af ophøret af gyldighedsperioden for antidumpingforanstaltningerne
    vedrørende importen til Fællesskabet af selvbevægende hydrauliske gravemaskiner
    på larvebånd eller hjul, med en totalvægt på mere end seks tons, men højst
    35 tons, udstyret eller forberedt til at blive udstyret med en enkelt ske monteret
    på en bom med en drejeevne på 360°, med oprindelse i Japan (91/59/EØF) #'
  type: main
- language: el
  script: Grek
  content: '91/59/ΕΟΚ: Απόφαση της Επιτροπής της 4ης Φεβρουαρίου
    1991 για την περάτωση της επανεξέτασης και την
    επιβεβαίωση της λήξεως των μέτρων αντιντάμπινγκ
    που έχουν επιβληθεί στις εισαγωγές προς την
    Κοινότητα αυτοπροωθούμενων υδραυλικών εκσκαφέων,
    με ερπύστριες ή τροχούς, συνολικού βάρους μεγαλύτερου
    των έξι τόννων και μέχρι 35 τόννους, εξοπλισμένων
    ή προορισμένων να εξοπλισθούν με ένα μόνο κάδο
    με δυνατότητα περιστροφής 360, καταγωγής Ιαπωνίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 4 febbraio 1991 che chiude la procedura
    di riesame e conferma la scadenza delle misure antidumping applicate alle importazioni
    nella Comunità di escavatori idraulici semoventi, su cingoli o su ruote, il cui
    peso in condizioni d'' esercizio è compreso tra 6 e 35 t, muniti o concepiti
    per essere muniti di un'' unica benna montata su un braccio rotante a 360°, originari
    del Giappone (91/59/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 4 februari 1991 tot beëindiging van het
    nieuwe onderzoek en ter bevestiging van het vervallen van de anti-dumpingmaatregelen
    van toepassing op de invoer in de Gemeenschap van hydraulische excavateurs (emmergravers)
    met eigen beweegkracht, op rupsbanden of op wielen, met een totaal bedrijfsklaar
    gewicht van meer dan 6, doch ten hoogste 35 ton, uitgerust met één, aan een
    360° wendbare giek bevestigde emmer, of die bestemd zijn om hiermede te worden
    uitgerust, van oorsprong uit Japan (91/59/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 4 de Fevereiro de 1991 que encerra o processo
    de reexame e confirma a caducidade de medidas anti-dumping relativas às importações
    na Comunidade de escavadoras hidráulicas autopropulsoras, de lagartas ou de rodas,
    com um peso total superior a seis toneladas mas igual ou inferior a trinta e cinco
    toneladas, equipadas com um único balde montado num braço capaz de rodar 360°,
    ou previsto para ser assim equipado, originárias do Japão (91/59/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 4 de febrero de 1991 por la que se concluye
    la reconsideración y se confirma la expiración de las medidas antidumping aplicables
    a las importaciones en la Comunidad de excavadoras hidráulicas autopropulsadas,
    de orugas o sobre neumáticos, con una carga operativa total superior a 6 toneladas
    e inferior a 35 toneladas, equipadas con una pala única montada sobre un aguilón
    que pueda girar 360°, o preparadas para estar equipadas de esta forma, originarias
    de Japón (91/59/CEE) #'
