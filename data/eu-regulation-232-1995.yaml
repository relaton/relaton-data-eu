title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 232/95 of 3 February 1995 determining the
    extent to which applications lodged in January 1995 for import licences for fresh,
    chilled or frozen beef under the import arrangements provided for in the Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 232/95 DE LA COMMISSION du 3 février 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 1995 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    conclus par la Communauté avec la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 232/95 DER KOMMISSION vom 3. Februar 1995 zur Festsetzung
    des Umfangs, in dem die im Januar 1995 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Abkommen zwischen der
    Gemeinschaft und Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 232/95 af 3. februar 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i januar 1995,
    om importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i aftalerne mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 232/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 3ης Φεβρουαρίου 1995 περί περί καθορισμού
    του ορίου εντός του οποίου δύναται να γίνουν
    αποδεκτές οι αιτήσεις πιστοποιητικών εισαγωγής
    που υποβλήθηκαν τον Ιανουάριο 1995 για τα νωπά,
    διατηρημένα με απλή ψύξη ή κατεψυγμένα βόεια
    κρέατα στα πλαίσια των καθεστώτων εισαγωγής
    που προβλέπονται από τις προσωρινές συμφωνίες
    που συνήφθησαν από την Κοινότητα με τη Βουλγαρία
    και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 232/95, annettu 3 päivänä helmikuuta 1995,
    yhteisön sekä Bulgarian ja Romanian välisissä sopimuksissa määrättyjen
    tuontijärjestelyjen mukaisesti tammikuussa 1995 esitettyjen tuoreen, jäähdytetyn
    tai jäädytetyn naudanlihan tuontilupahakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 232/95 DELLA COMMISSIONE del 3 febbraio 1995 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 1995 per le carni bovine fresche, refrigerate o
    congelate nel quadro dei regimi di importazione previsti dagli accordi conclusi
    tra la Comunità e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 232/95 VAN DE COMMISSIE van 3 februari 1995 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers, gekoeld of bevroren rundvlees, die in januari 1995 zijn ingediend op
    grond van de invoerregelingen die zijn vastgesteld in de door de Gemeenschap met
    Bulgarije en Roemenië gesloten interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 232/95 DA COMISSÃO de 3 de Fevereiro de 1995 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de carne de bovino fresca, refrigerada ou congelada, apresentados em Janeiro de
    1995 ao abrigo dos regimes de importação previstos nos acordos concluídos pela
    Comunidade com a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 232/95 DE LA COMISIÓN de 3 de febrero de 1995 por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de carne fresca, refrigerada o congelada de vacuno presentadas
    en enero de 1995 al amparo de los regímenes de importación establecidos en los
    Acuerdos interinos celebrados entre la Comunidad y Bulgaria y Rumanía
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 232/95 av den 3 februari 1995 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under januari 1995 för
    färskt, kylt eller fryst nötkött i enlighet med den importordning som fastställs
    i avtalen mellan gemenskapen och Bulgarien och Rumänien kan godkännas
