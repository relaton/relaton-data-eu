title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1594/88 of 8 June 1988 re-establishing the
    levying of customs duties on men' s or boys' suits and ensembles, other than knitted
    or crocheted, products of category 16 (order No 40.0160), women' s or girls' dresses,
    products of category 26 (order No 40.0260), women' s or girls' skirts, products
    of category 27 (order No 40.0270), originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1594/88 de la Commission du 8 juin 1988 portant rétablissement
    de la perception des droits de douane applicables aux costumes, complets et ensembles,
    autres que de bonneterie, pour hommes et garçonnets de la catégorie de produits
    n° 16 (numéro d' ordre 40.0160), aux robes pour femmes ou fillettes de la catégorie
    de produits n° 26 (numéro d' ordre 40.0260), aux jupes pour femmes ou fillettes
    de la catégorie de produits n° 27 (numéro d' ordre 40.0270), originaires du
    Pakistan, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1594/88 der Kommission vom 8. Juni 1988 zur Wiedereinführung
    des Zollsatzes für Anzüge und Kombinationen, andere als aus Gewirken, für Männer
    und Knaben, der Warenkategorie Nr. 16 (lfd. Nr. 40.0160), Kleider für Frauen
    und Mädchen, der Warenkategorie Nr. 26 (lfd. Nr. 40.0260), sowie Röcke für
    Frauen und Mädchen, der Warenkategorie Nr. 27 (lfd. Nr. 40.0270), mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1594/88 af 8. juni 1988 om genindførelse
    af opkrævning af toldafgifter for jakkesæt, ikke af trikotage, til mænd og
    drenge (kategori 16, løbenummer 40.0160), kjoler til kvinder og piger (kategori
    26, løbenummer 40.0260) og nederdele til kvinder og piger (kategori 27, løbenummer
    40.0270), som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
