    3783/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1594/88 della Commissione dell' 8 giugno 1988 che
    ripristina la riscossione dei dazi doganali applicabili ai vestiti, completi e
    insiemi, esclusi quelli a maglia, per uomo e per ragazzo, della categoria di prodotti
    n. 16 (codice 40.0160), abiti interi per donna o per ragazza, della categoria
    di prodotti n. 26 (codice 40.0260), gonne, per donna o per ragazza, della categoria
    di prodotti n. 27 (codice 40.0270), originari del Pakistan beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1594/88 van de Commissie van 8 juni 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kostuums
    en combinaties, andere dan van brei- of haakwerk, voor heren en jongens, van de
    categorie van produkten nr. 16 (volgnummer 40.0160), japonnen voor dames en meisjes,
    van de categorie van produkten nr. 26 (volgnummer 40.0260), en rokken voor dames
    en meisjes, van de categorie van produkten nr. 27 (volgnummer 40.0270), van oorsprong
    uit Pakistan, waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1594/88 da Comissão de 8 de Junho de 1988 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos fatos completos e conjuntos,
    excluindo os de malha, para homens e rapazes, da categoria de produtos n.° 16
    (n.° de ordem 40.0160), roupões para senhoras ou raparigas, da categoria de
    produtos n.° 26 (n.° de ordem 40.0260), às saias para senhoras ou raparigas,
    da categoria de produtos n.° 27 (n.° de ordem 40.0270), originários do Paquistão,
    beneficiário das preferências pautais previstas no Regulamento (CEE) n.° 3783/87
    do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1594/88 de la Comisión de 8 de junio de 1988 relativo
    al establecimiento de la recaudación de los derechos arancelarios aplicables
    a los trajes completos y conjuntos, que no sean de punto, para hombres y niños,
    de la categoría de productos n° 16 (número de orden 40.0160), a los vestidos
    para mujeres o niños, de la categoría de productos n° 26 (número de orden
    40.0260), a las faldas, para mujeres de la categoría de productos n° 27 (número
    de orden 40.0270), originarios de Paquistán, beneficiario de las preferencias
    arancelarias previstas por el Reglamento (CEE) n° 3783/87 del Consejo
