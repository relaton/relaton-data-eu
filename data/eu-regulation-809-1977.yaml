title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 809/77 of 21 April 1977 amending Commission
    Regulations (EEC) No 2793/76 and (EEC) No 560/77 as regards the selling prices
    of certain frozen beef made available to the Italian intervention agency under
    Regulation (EEC) No 2453/76
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 809/77 de la Commission, du 21 avril 1977, portant
    modification des règlements (CEE) n° 2793/76 et n° 560/77 en ce qui concerne
    les prix de vente de certaines viandes bovines congelées mises à la disposition
    de l' organisme d' intervention italien en vertu du règlement (CEE) n° 2453/76
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 809/77 der Kommission vom 21. April 1977 zur Änderung
    der Verordnungen (EWG) Nr. 2793/76 und (EWG) Nr. 560/77 bezüglich der Verkaufspreise
    für gefrorenes Rindfleisch, das der italienischen Interventionsstelle auf Grund
    der Verordnung (EWG) Nr. 2453/76 zur Verfügung gestellt wurde
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 809/77 af 21. april 1977 om ændring
    af forordning (EØF) nr. 2793/76 og (EØF) nr. 560/77 for så vidt angår salgspriserne
    vor visse former for frosset oksekød, der er stillet til rådighed for det italienske
    interventionsorgan i henhold til forordning (EØF) nr. 2453/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 809/77 della Commissione, del 21 aprile 1977, che
    modifica i regolamenti (CEE) n. 2793/76 e (CEE) n. 560/77 per quanto concerne
    i prezzi di vendita di determinate carni bovine congelate messe a disposizione
    dell' organismo d' intervento italiano a norma del regolamento (CEE) n. 2453/76
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 809/77 van de Commissie van 21 april 1977 houdende
    wijziging van de Verordeningen (EEG) nr. 2793/76 en (EEG) nr. 560/77 met betrekking
    tot de verkoopprijzen van bepaalde soorten bevroren rundvlees die op grond van
    Verordening (EEG) nr. 2453/76 ter beschikking van het Italiaanse interventiebureau
    zijn gesteld
  type: main
