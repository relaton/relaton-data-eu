title:
- language: en
  script: Latn
  content: '87/439/ECSC: Commission Decision of 29 July 1987 derogating from High
    Authority recommendation No 1-64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries (130th derogation)'
  type: main
- language: fr
  script: Latn
  content: '87/439/CECA: Décision de la Commission du 29 juillet 1987 portant dérogation
    à la recommandation n° 1-64 de la Haute Autorité sur la protection tarifaire
    afin de permettre l'' application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires de pays en voie de développement
    (Cent trentième dérogation)'
  type: main
- language: de
  script: Latn
  content: '87/439/EGKS: Entscheidung der Kommission vom 29. Juli 1987 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über den Außenschutz
    im Hinblick auf die Anwendung der allgemeinen Zollpräferenzen auf bestimmte Stahlerzeugnisse
    mit Ursprung in Entwicklungsländern (130. Ausnahmeentscheidung)'
  type: main
- language: da
  script: Latn
  content: '87/439/EKSF: Kommissionens beslutning af 29. juli 1987 om undtagelse fra
    Den Høje Myndigheds henstilling nr. 1/64 vedrørende toldbeskyttelse med henblik
    på at muliggøre anvendelse af de generelle toldpræferencer på visse jern-
    og stålprodukter med oprindelse i udviklingslandene (130. undtagelse)'
  type: main
- language: el
  script: Grek
  content: '87/439/ΕΚΑΧ: Απόφαση της Επιτροπής της 29ης
    Ιουλίου 1987 για την παρέκκλιση από τη σύσταση
    αριθ. 1—64 της Ανωτάτης Αρχής για τη δασμολογική
    προστασία, προκειμένου να επιτραπεί η εφαρμογή
    των γενικευμένων δασμολογικών προτιμήσεων
    σε ορισμένα προϊόντα της βιομηχανίας σιδήρου
    και χάλυβα που κατάγονται από αναπτυσσόμενες
    χώρες (130ή παρέκκλιση)'
  type: main
- language: it
  script: Latn
  content: '87/439/CECA: Decisione della Commissione del 29 luglio 1987 recante deroga
    alla raccomandazione n. 1-64 dell'' Alta Autorità relativa alla protezione tariffaria
    per consentire l'' applicazione delle preferenze tariffarie generalizzate a taluni
    prodotti siderurgici originari dei paesi in via di sviluppo (130a deroga)'
  type: main
- language: nl
  script: Latn
  content: '87/439/EGKS: Beschikking van de Commissie van 29 juli 1987 houdende afwijking
    van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende de tariefbescherming,
    ten einde voor bepaalde ijzer- en staalprodukten van oorsprong uit ontwikkelingslanden
    de toepassing van algemene tariefpreferenties mogelijk te maken (130e uitzonderingsbeschikking)'
  type: main
- language: pt
  script: Latn
  content: '87/439/CECA: Decisão da Comissão de 29 de Julho de 1987 que derroga
