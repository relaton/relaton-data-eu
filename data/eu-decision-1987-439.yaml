    fim de permitir a aplicação das preferências pautais generalizadas a certos
    produtos originários dos países em vias de desenvolvimento (130 derrogação)'
  type: main
- language: es
  script: Latn
  content: '87/439/CECA: Decisión de la Comisión de 29 de julio de 1987 por la que
