    limitazione provvisoria dell'ammontare massimo della restituzione applicabile
    alle esportazioni verso gli Stati membri di alcuni prodotti trasformati a base
    di cereali
  type: main
- language: nl
  script: Latn
  content: Verordening no. 32/63/EEG van de Commissie van 9 april 1963 houdende verlenging
