    des Höchstbetrages der Erstattung bei der Ausfuhr bestimmter Getreideverarbeitungserzeugnisse
    nach den Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 32/63/CEE della Commissione del 9 aprile 1963 che proroga
