    izvērtētu iespēju piešķirt atbrīvojumu no minētajiem pasākumiem vienam
    Tunisijas ražotājam eksportētājam, ar kuru atceļ antidempinga maksājumu
    šā ražotāja eksportētāja veiktajam importam un paredz reģistrēt šā ražotāja
    eksportētāja veikto importu
  type: main
