    proizvođaču izvozniku, stavljanja izvan snage antidampinške pristojbe s obzirom
    na uvoz od tog proizvođača izvoznika te nametanja obveze evidentiranja njegova
    uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/777 végrehajtási rendelete (2017. május 4.) a
    Kínai Népköztársaságból származó kerékpárok behozatalára kivetett végleges
    dömpingellenes vámnak az Indonéziában, Malajziában, Srí Lankán és Tunéziában
    feladott, akár Indonéziából, Malajziából, Srí Lankáról és Tunéziából
    származóként, akár nem ilyenként bejelentett kerékpárok behozatalára történő
    kiterjesztéséről szóló 501/2013/EU tanácsi végrehajtási rendelet felülvizsgálatának
    a dömpingellenes intézkedések alól egy tunéziai exportáló gyártó számára
    biztosítható mentesség lehetőségének meghatározása céljából történő
    megindításáról, a dömpingellenes vámnak a szóban forgó exportáló gyártótól
    érkező behozatalok tekintetében való hatályon kívül helyezéséről és
    a szóban forgó exportáló gyártótól érkező behozatalokra vonatkozó nyilvántartásbavételi
    kötelezettség megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/777 della Commissione, del 4 maggio
    2017, che apre un riesame del regolamento di esecuzione (UE) n. 501/2013 del Consiglio
    (che estende il dazio antidumping definitivo sulle importazioni di biciclette
    originarie della Repubblica popolare cinese alle importazioni di biciclette spedite
    dall'Indonesia, dalla Malaysia, dallo Sri Lanka e dalla Tunisia, indipendentemente
    dal fatto che siano o no dichiarate originarie dell'Indonesia, della Malaysia,
    dello Sri Lanka e della Tunisia) allo scopo di determinare la possibilità di
    concedere un'esenzione da tali misure a un produttore esportatore tunisino, che
    abroga il dazio antidumping per quanto riguarda le importazioni provenienti da
    detto produttore esportatore e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/777 (2017. gada 4. maijs), ar
