  script: Latn
  content: 2017 m. gegužės 4 d. Komisijos įgyvendinimo reglamentas (ES) 2017/777,
    kuriuo inicijuojama Tarybos įgyvendinimo reglamento (ES) Nr. 501/2013 (kuriuo
    Kinijos Liaudies Respublikos kilmės dviračiams nustatyto galutinio antidempingo
    muito taikymas išplečiamas importuojamiems dviračiams, siunčiamiems iš Indonezijos,
