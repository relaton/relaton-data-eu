    antidempinga maksājumu, kas noteikts Ķīnas Tautas Republikas izcelsmes velosipēdu
    importam, attiecina uz tādu velosipēdu importu, kas nosūtīti no Indonēzijas,
    Malaizijas, Šrilankas un Tunisijas, neatkarīgi no tā, vai šiem velosipēdiem
