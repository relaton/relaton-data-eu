title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/777 of 4 May 2017 initiating
    a review of Council Implementing Regulation (EU) No 501/2013 (extending the definitive
    anti-dumping duty on imports of bicycles originating in the People's Republic
    of China to imports of bicycles consigned from Indonesia, Malaysia, Sri Lanka
    and Tunisia, whether declared as originating in Indonesia, Malaysia, Sri Lanka
    and Tunisia or not) for the purposes of determining the possibility of granting
    an exemption from those measures to one Tunisian exporting producer, repealing
    the anti-dumping duty with regard to imports from that exporting producer and
    making imports from that exporting producer subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/777 de la Commission du 4 mai 2017 portant
    ouverture d'un réexamen du règlement d'exécution (UE) n° 501/2013 du Conseil
    (portant extension du droit antidumping définitif institué sur les importations
    de bicyclettes originaires de la République populaire de Chine aux importations
    de bicyclettes expédiées d'Indonésie, de Malaisie, du Sri Lanka et de Tunisie,
    qu'elles aient ou non été déclarées originaires de ces pays) afin d'étudier
    la possibilité d'accorder une exemption de ces mesures à un producteur-exportateur
    tunisien, abrogeant le droit antidumping pour les importations effectuées par
    ce producteur-exportateur et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
