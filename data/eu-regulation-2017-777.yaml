    minn dak il-produttur esportatur u li l-importazzjonijiet minn dak il-produttur
    esportatur jagħmilhom soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/777 van de Commissie van 4 mei 2017 tot
    opening van een nieuw onderzoek ten aanzien van Uitvoeringsverordening (EU) nr.
    501/2013 van de Raad (tot uitbreiding van het definitieve antidumpingrecht op
    rijwielen van oorsprong uit de Volksrepubliek China tot uit Indonesië, Maleisië,
    Sri Lanka en Tunesië verzonden rijwielen, al dan niet aangegeven als van oorsprong
    uit Indonesië, Maleisië, Sri Lanka en Tunesië) met het oog op de vaststelling
    of één Tunesische producent-exporteur van die maatregelen kan worden vrijgesteld,
    of het antidumpingrecht ten aanzien van de invoer afkomstig van die producent-exporteur
    kan worden ingetrokken en of die invoer moet worden geregistreerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/777 z dnia 4 maja 2017 r.
    w sprawie wszczęcia przeglądu rozporządzenia wykonawczego Rady (UE) nr 501/2013
    (rozszerzającego ostateczne cło antydumpingowe na przywóz rowerów pochodzących
    z Chińskiej Republiki Ludowej na przywóz rowerów wysyłanych z Indonezji, Malezji,
    ze Sri Lanki i z Tunezji, zgłoszonych lub niezgłoszonych jako pochodzące z
    Indonezji, Malezji, ze Sri Lanki i z Tunezji) w celu ustalenia możliwości przyznania
    zwolnienia z tych środków jednemu producentowi eksportującemu z Tunezji, w
    sprawie uchylenia cła antydumpingowego w odniesieniu do towarów przywożonych
    przez tego producenta eksportującego oraz w sprawie objęcia rejestracją towarów
    przywożonych przez tego producenta eksportującego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/777 da Comissão, de 4 de maio de 2017,
    que dá início ao reexame do Regulamento de Execução n.° 501/2013 do Conselho
    (que torna extensivo o direito anti-dumping definitivo instituído sobre as importações
    de bicicletas originárias da República Popular da China às importações de
    bicicletas expedidas da Indonésia, da Malásia, do Sri Lanca e da Tunísia, independentemente
    de serem ou não declaradas originárias da Indonésia, da Malásia, do Sri Lanca
    e da Tunísia) para efeitos de determinar a possibilidade de conceder uma isenção
    dessas medidas a um produtor-exportador tunisino, que revoga o direito anti-dumping
    no que diz respeito às importações provenientes desse produtor-exportador e
    que sujeita as importações desse produtor-exportador a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/777 al Comisiei din 4 mai
    2017 de deschidere a unei reexaminări a Regulamentului de punere în aplicare
    (UE) nr. 501/2013 al Consiliului (de extindere a taxei antidumping definitive
    impuse asupra importurilor de biciclete originare din Republica Populară Chineză
    la importurile de biciclete expediate din Indonezia, Malaysia, Sri Lanka și Tunisia,
    indiferent dacă acestea sunt sau nu declarate ca fiind originare din Indonezia,
    Malaysia, Sri Lanka și Tunisia) pentru a stabili posibilitatea de a acorda o
    scutire de la aceste măsuri unui producător-exportator tunisian, de abrogare
    a taxei antidumping cu privire la importurile provenite de la acest producător-exportator
    și de înregistrare a acestor importuri
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/777 zo 4. mája 2017, ktorým
    sa začína revízne prešetrovanie vykonávacieho nariadenia Rady (EÚ) č. 501/2013
    (ktorým sa konečné antidumpingové clo na dovoz bicyklov s pôvodom v Čínskej
    ľudovej republike rozširuje na dovoz bicyklov odosielaných z Indonézie, Malajzie,
    zo Srí Lanky a z Tuniska bez ohľadu na to, či majú alebo nemajú deklarovaný
    pôvod v Indonézii, Malajzii, na Srí Lanke a v Tunisku) na účely zistenia
    možnosti udelenia výnimky z týchto opatrení jednému tuniskému vyvážajúcemu
    vývozcovi, zrušenia antidumpingového cla na dovoz od tohto vyvážajúceho
    výrobcu a zavedenia registrácie dovozu od tohto vyvážajúceho výrobcu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/777 z dne 4. maja 2017 o začetku pregleda
    Izvedbene uredbe Sveta (EU) št. 501/2013 (o razširitvi dokončne protidampinške
    dajatve na uvoz koles s poreklom iz Ljudske republike Kitajske na uvoz koles,
    poslanih iz Indonezije, Malezije, Šrilanke in Tunizije, ne glede na to, ali so
    deklarirana kot izdelek s poreklom iz Indonezije, Malezije, Šrilanke in Tunizije
    ali ne), da se ugotovi, ali se za določenega tunizijskega proizvajalca izvoznika
    lahko odobri izvzetje iz navedenih ukrepov, odpravijo protidampinške dajatve
    pri uvozu njegovih izdelkov in uvede registracija tega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/777 de la Comisión, de 4 de mayo de
    2017, por el que se inicia una reconsideración del Reglamento de Ejecución (UE)
    n.° 501/2013 del Consejo (por el que se amplía el derecho antidumping definitivo
    sobre las importaciones de bicicletas originarias de la República Popular China
    a las importaciones de bicicletas procedentes de Indonesia, Malasia, Sri Lanka
    y Túnez, hayan sido o no declaradas originarias de Indonesia, Malasia, Sri Lanka
    y Túnez), a fin de decidir sobre la posibilidad de conceder una exención de
    dichas medidas a un productor exportador de Túnez, de derogar el derecho antidumping
    respecto a las importaciones procedentes de dicho productor exportador y de someter
    a registro las importaciones procedentes de dicho productor exportador
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/777 av den 4 maj 2017
    om inledande av en översyn av rådets genomförandeförordning (EU) nr 501/2013
    (om utvidgning av den slutgiltiga antidumpningstull som införts på import av
    cyklar med ursprung i Folkrepubliken Kina till att även omfatta import av cyklar
    som avsänts från Indonesien, Malaysia, Sri Lanka och Tunisien, oavsett om produktens
    deklarerade ursprung är Indonesien, Malaysia, Sri Lanka och Tunisien eller inte)
    i syfte att fastställa om det är möjligt att bevilja en tunisisk exporterande
    tillverkare befrielse från dessa åtgärder, om upphävande av antidumpningstullen
    på import från denna exporterande tillverkare och om registrering av import
    från denna exporterande tillverkare
  type: main
