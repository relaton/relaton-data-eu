    importo teises
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1474/2005 van de Commissie van 9 september 2005 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer voor het in Verordening (EG) nr. 1218/2005 bedoelde contingent
    voor van oorsprong uit Zwitserland met een gewicht van meer dan 160 kg levende
    runderen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1474/2005 z dnia 9 września 2005 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o prawa przywozowe złożone
    dla kwoty taryfowej żywego bydła o wadze przekraczającej 160 kg i pochodzącego
    ze Szwajcarii, przewidzianej w rozporządzeniu (WE) nr 1218/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1474/2005 da Comissão, de 9 de Setembro de 2005,
    que determina em que medida pode ser dado seguimento aos pedidos de direitos de
    importação apresentados relativamente ao contingente de bovinos vivos com um
    peso superior a 160 kg originários da Suiça, previsto pelo Regulamento (CE)
    n.° 1218/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1474/2005 z 9. septembra 2005, ktorým sa určuje,
    do akej miery je možné vyhovieť žiadostiam o dovozné práva, predloženým
    v súvislosti s kvótou pre živý hovädzí dobytok s hmotnosťou vyššou ako
    160 kg a s pôvodom vo Švajčiarsku, ustanovenou v nariadení (ES) č. 1218/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1474/2005 z dne 9. septembra 2005 o določitvi,
