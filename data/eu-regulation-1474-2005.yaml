title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1474/2005 of 9 September 2005 determining
    the extent to which applications for import rights lodged in respect of the quota
    for live bovine animals of a weight exceeding 160 kg and originating in Switzerland,
    provided for in Regulation (EC) No 1218/2005, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1474/2005 de la Commission du 9 septembre 2005 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées pour le contingent de bovins vivants d'un poids excédant 160 kg originaires
    de Suisse, prévu par le règlement (CE) n° 1218/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1474/2005 der Kommission vom 9. September 2005 zur
    Bestimmung des Umfangs, in welchem den Anträgen auf Einfuhrrechte für das gemäß
    der Verordnung (EG) Nr. 1218/2005 vorgesehene Zollkontingent für lebende Rinder
    mit einem Stückgewicht von mehr als 160 kg mit Ursprung in der Schweiz stattgegeben
    werden kann
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1474/2005 ze dne 9. září 2005, kterým se
    stanoví, do jaké míry lze vyhovět žádostem o dovozní práva podaným pro
    kvóty pro pro dovoz živého skotu o hmotnosti vyšší než 160 kg podle nařízení
    (ES) č. 1218/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1474/2005 af 9. september 2005 om fastsættelse
    af, i hvilket omfang ansøgningerne om importrettigheder for import af levende
    kvæg med en vægt på over 160 kg og med oprindelse i Schweiz under det kontingentet,
    som er fastsat i forordning (EF) nr. 1218/2005, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1474/2005 της Επιτροπής,
    της 9ης Σεπτεμβρίου 2005, για τον καθορισμό σε
    ποιο βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για δικαιώματα εισαγωγής που έχουν υποβληθεί
    για την ποσόστωση, βάσει του κανονισμού (ΕΚ)
    αριθ. 1218/2005, στον τομέα των ζώντων βοοειδών
    βάρους άνω των 160 χιλιογράμμων και καταγωγής
    Ελβετίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1474/2005, 9. september 2005, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordiõiguste taotlusi, mis on
    esitatud seoses määruses (EÜ) nr 1218/2005 Šveitsit pärit üle 160 kg kaaluvate
    elusveiste kvoodiga
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1474/2005, annettu 9 päivänä syyskuuta 2005,
    asetuksessa (EY) N:o 1218/2005 säädetyn, yli 160 kilogramman painoisia eläviä
    Sveitsistä peräisin olevia nautaeläimiä koskevan kiintiön mukaisesti jätettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1474/2005/EK rendelete (2005. szeptember 9.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni a 160 kilogrammnál nagyobb tömegű
    élő szarvasmarhafélékre a 1218/2005/EK rendeletben szabályozott kontingensére
    benyújtott behozatali jogok iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1474/2005 della Commissione, del 9 settembre 2005,
    che stabilisce in quale misura possono essere accolte le domande di diritti d'importazione
    presentate per il contingente di bovini vivi di peso superiore a 160 kg originari
    della Svizzera previsto dal regolamento (CE) n. 1218/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1474/2005 (2005. gada 9. septembris), ar ko nosaka,
