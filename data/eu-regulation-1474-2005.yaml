    z Uredbo (ES) št. 1218/2005
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1474/2005 de la Comisión, de 9 de septiembre de 2005,
    por el que se determina en qué medida se podrá dar curso a las solicitudes de
    derechos de importación presentadas en relación con el contingente de animales
    vivos de especie bovina originarios de Suiza de un peso superior a 160 kilogramos
    previsto en el Reglamento (CE) n° 1218/2005
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1474/2005 av den 9 september 2005 om
