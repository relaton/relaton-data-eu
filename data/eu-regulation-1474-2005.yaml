    kuri iesniegti attiecībā uz kvotu dzīviem liellopiem, kuru svars pārsniedz
    160 kg un kuru izcelsme ir Šveicē, kas paredzēta Regulā (EK) Nr. 1218/2005
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 9 d. Komisijos reglamentas (EB) Nr. 1474/2005, nustatantis,
