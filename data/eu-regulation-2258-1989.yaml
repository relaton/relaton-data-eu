    hors tout dépasse huit mètres autorisés à pêcher à l'aide de chaluts à
    perches dans certaines zones côtières de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2258/89 der Kommission vom 26. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 55/87 zur Festlegung der Liste der Schiffe mit einer
    Länge über alles von mehr als 8 m, die in bestimmten Küstengebieten der Gemeinschaft
    mit Baumkurren fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2258/89 af 26. juli 1989 om ændring
