    σε ορισμένες παράκτιες περιοχές της Κοινότητας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2258/89 della Commissione del 26 luglio 1989 recante
    modifica del regolamento (CEE) n. 55/87 che fissa l'elenco dei pescherecci di
