    provenienti dalle scorte d'intervento e destinate alla trasformazione nella Comunità
    e recante abrogazione del regolamento (CEE) n. 3305/84
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 129/85 van de Commissie van 16 januari 1985 inzake
