  content: Commission Regulation (EEC) No 129/85 of 16 January 1985 on the sale at
    prices fixed at a standard rate in advance of certain beef from intervention stocks
    for processing in the Community and repealing Regulation (EEC) No 3305/84
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 129/85 de la Commission, du 16 janvier 1985, relatif
