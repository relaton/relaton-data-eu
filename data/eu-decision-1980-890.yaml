title:
- language: en
  script: Latn
  content: '80/890/EEC: Commission Decision of 24 July 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to woven overcoats, raincoats and other coats, cloaks
    and capes, jackets and blazers, falling within subheading ex 61.02 B II of the
    Common Customs Tariff (category 15 B), originating in Romania and Yugoslavia and
    in free circulation in the other Member States (Only the French and Dutch texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/890/CEE: Décision de la Commission, du 24 juillet 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux, imperméables (y compris
    les capes) et vestes tissés de la sous-position ex 61.02 B II du tarif douanier
    commun (catégorie 15 B), originaires de Roumanie et de Yougoslavie et mis en
    libre pratique dans les autres États membres (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/890/EWG: Entscheidung der Kommission vom 24. Juli 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien und Jugoslawien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus
    Geweben, der Tarifstelle ex 61.02 B II (Kategorie 15 B) des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/890/EØF: Kommissionens beslutning af 24. juli 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage frakker; kapper og slag, jakker og blazere,
    vævede, som henhører under pos. ex 61.02 B II (kategori 15 B) i den fælles
    toldtarif, har oprindelse i Rumænien og Jugoslavien og frit kan omsættes i de
    øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/890/CEE: Decisione della Commissione, del 24 luglio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i cappotti, i soprabiti, mantelli e simili,
    e giacche, tessuti, della sottovoce ex 61.02 B II, della tariffa doganale comune,
    categoria 15 B, originari della Romania e della Iugoslavia e messi in libera pratica
    negli altri Stati membri (Il testi in lingua francese e olandese sono i soli facenti
    fede)'
  type: main
- language: nl
  script: Latn
  content: '80/890/EEG: Beschikking van de Commissie van 24 juli 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd mantels, regenjassen en capes daaronder begrepen, blazers en
    jasjes, geweven, van post ex 61.02 B II van het gemeenschappelijk douanetarief
    (categorie 15 B), van oorsprong uit Roemenië en Joegoslavië en in de overige
    Lid-Staten in het vrije verkeer gebracht van de communautaire behandeling uit
    te sluiten (Slechts de teksten in de Franse en de Nederlandse taal zijn authentiek)'
  type: main
