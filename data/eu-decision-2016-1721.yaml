title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1721 of 26 September 2016 on
    the approval of the Toyota efficient exterior lighting using light emitting diodes
    for the use in non-externally chargeable hybrid electrified vehicles as an innovative
    technology for reducing CO2 emissions from passenger cars pursuant to Regulation
    (EC) No 443/2009 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
