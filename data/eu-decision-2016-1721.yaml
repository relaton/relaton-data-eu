    électriques hybrides non rechargeables de l'extérieur en tant que technologie
    innovante pour la réduction des émissions de CO2 des voitures particulières
    conformément au règlement (CE) n° 443/2009 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
