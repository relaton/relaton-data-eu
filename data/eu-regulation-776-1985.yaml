title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 776/85 of 26 March 1985 introducing a derogation
    from the scheme provided for in Regulation (EEC) No 456/80 on the granting of
    temporary and permanent abandonment premiums in respect of certain areas under
    vines and of premiums for the renunciation of replanting
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 776/85 du Conseil du 26 mars 1985 portant dérogation
    au régime prévu par le règlement (CEE) no 456/80 relatif à l' octroi de primes
    d' abandon temporaire et d' abandon définitif de certaines superficies plantées
    en vigne ainsi que de primes de renonciation à la replantation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 776/85 des Rates vom 26. März 1985 zur Abweichung
    von der in der Verordnung (EWG) Nr. 456/80 über die Gewährung von Prämien für
    die vorübergehende Aufgabe und für die endgültige Aufgabe bestimmter Rebflächen
    sowie von Prämien für den Verzicht auf Wiederbepflanzung vorgesehenen Regelung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 776/85 af 26. marts 1985 om fravigelse af
    den ordning, der er fastsat ved forordning (EØF) nr. 456/80 om ydelse af præmier
    for midlertidig og endelig nedlæggelse af visse vinarealer samt præmier for
    afkald på genbeplantning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 776/85 του Συμβουλίου
    της 26ης Μαρτίου 1985 για παρέκκλιση από το σύστημα
    που προβλέπεται στον κανονισμό (ΕΟΚ) αριθ. 456/80
    περί χορηγήσεως πριμοδοτήσεων προσωρινής
    εγκατάλειψης και οριστικής εγκατάλειψης ορισμένων
    εκτάσεων φυτευμένων με αμπέλους καθώς και
    πριμοδοτήσεων για παραίτηση αναφύτευσης
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 776/85, annettu 26 päivänä maaliskuuta 1985,
    tiettyjen viininviljelmäalojen väliaikaisen ja lopullisen lakkauttamisen palkkioista
    sekä paikkausistutuksen luopumispalkkiosta annetussa asetuksessa (ETY) N:o 456/80
    säädetystä järjestelmästä poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 776/85 del Consiglio del 26 marzo 1985 che deroga
    al regime istituito dal regolamento (CEE) n. 456/80, relativo alla concessione
    di premi di abbandono temporaneo e di abbandono definitivo di talune superfici
    vitate, nonché di premi di rinuncia al reimpianto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 776/85 van de Raad van 26 maart 1985 houdende afwijking
    van de regeling bedoeld in Verordening (EEG) nr. 456/80 inzake de toekenning van
    premies voor tijdelijke stopzetting en definitieve stopzetting van de wijnbouw
    op sommige met wijnstokken beplante oppervlakten alsmede van premies voor het
    afstand doen van het recht op herbeplanting van bepaalde oppervlakten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 776/85 do Conselho, de 26 de Março de 1985, que
    derroga o regime previsto pelo Regulamento (CEE) n° 456/80 relativo à concessão
    de prémios de abandono temporário e de abandono definitivo de certas superfícies
    plantadas com videiras assim como de prémios de renúncia à replantação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 776/85 del Consejo, de 26 de marzo de 1985, por el
    que se establece una excepción al régimen previsto en el Reglamento (CEE) n°
    456/80 relativo a la concesión de las primas por abandono temporal y abandono
    definitivo de determinadas superficies plantadas de vid así como de primas por
    renuncia a la replantación
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 776/85 av den 26 mars 1985 om undantag från
    det system som fastställs i förordning (EEG) nr 456/80 om beviljande av premier
    för tillfällig eller slutgiltig nedläggning av vissa vinodlingsarealer och
    bidrag för avstående från återplantering
  type: main
