    van het gemeenschappelijk douanetarief bij invoer van kleinbloemige rozen van
    oorsprong uit Israël
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 478/89 da Comissão, de 24 de Fevereiro de 1989,
