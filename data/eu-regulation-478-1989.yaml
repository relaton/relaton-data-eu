title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 478/89 of 24 February 1989 suspending the
    preferential customs duties and re-introducing the Common Customs Tariff duty
    on imports of small-flowered roses originating in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 478/89 de la Commission, du 24 février 1989, suspendant
