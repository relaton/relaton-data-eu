    Präferenzzolls und Wiedereinführung des Zolls des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 478/89 af 24. februar 1989 om suspension
    af præferencetolden og genindførelse af tolden ifølge Den Fælles Toldtarif
    ved indførsel af småblomstrede roser med oprindelse i Israel
  type: main
- language: el
  script: Grek
