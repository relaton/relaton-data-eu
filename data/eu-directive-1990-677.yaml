title:
- language: en
  script: Latn
  content: Council Directive 90/677/EEC of 13 December 1990 extending the scope of
    Directive 81/851/EEC on the approximation of the laws of the Member States relating
    to veterinary medicinal products and laying down additional provisions for immunological
    veterinary medicinal products
  type: main
- language: fr
  script: Latn
  content: Directive 90/677/CEE du Conseil, du 13 décembre 1990, élargissant le
    champ d'application de la directive 81/851/CEE concernant le rapprochement des
    législations des États membres relatives aux médicaments vétérinaires et
    prévoyant des dispositions complémentaires pour les médicaments vétérinaires
    immunologiques
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/677/EWG des Rates vom 13. Dezember 1990 zur Erweiterung des
    Anwendungsbereichs der Richtlinie 81/851/EWG zur Angleichung der Rechtsvorschriften
    der Mitgliedstaaten über Tierarzneimittel sowie zur Festlegung zusätzlicher
    Vorschriften für immunologische Tierarzneimittel
  type: main
- language: da
  script: Latn
  content: Rådet direktiv 90/677/EØF af 13. december 1990 om udvidelse af anvendelsesområdet
    for direktiv 81/851/EØF om indbyrdes tilnærmelse af medlemsstaternes lovgivning
    om veterinærmedicinske præparater og om fastsættelse af yderligere bestemmelser
    for immunologiske veterinærmedicinske præparater
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/677/ΕΟΚ του Συμβουλίου της 13ης Δεκεμβρίου
    1990 για την επέκταση του πεδίου εφαρμογής της
    οδηγίας 81/851/ΕΟΚ για την προσέγγιση των νομοθεσιών
    των κρατών μελών σχετικά με τα κτηνιατρικά
    φάρμακα και την πρόβλεψη πρόσθετων διατάξεων
    για τα ανοσολογικά κτηνιατρικά φάρμακα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi, annettu 13 päivänä joulukuuta 1990, eläinlääkkeitä
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun direktiivin
    81/851/ETY soveltamisalan laajentamisesta ja lisäsäännösten säätämisestä
    immunologisille eläinlääkkeille
  type: main
- language: it
  script: Latn
  content: Direttiva 90/677/CEE del Consiglio, del 13 dicembre 1990, che estende il
    campo di applicazione della direttiva 81/851/CEE per il ravvicinamento delle legislazioni
    degli Stati Membri relative ai medicinali veterinari e che stabilisce disposizioni
    complementari per i medicinali veterinari ad azione immunologica
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/677/EEG van de Raad van 13 december 1990 tot uitbreiding van
    de werkingssfeer van Richtlijn 81/851/EEG betreffende de onderlinge aanpassing
    van de wetgevingen der Lid-Staten inzake geneesmiddelen voor diergeneeskundig
    gebruik en houdende aanvullende bepalingen voor immunologische geneesmiddelen
    voor diergeneeskundig gebruik
  type: main
- language: pt
  script: Latn
  content: Directiva 90/677/CEE do Conselho, de 13 de Dezembro de 1990, que alarga
    o âmbito de aplicação da Directiva 81/851/CEE, relativa à aproximação das
    legislações dos Estados-Membros respeitantes aos medicamentos veterinários
    e que estabelece normas adicionais para medicamentos imunológicos veterinários
  type: main
- language: es
  script: Latn
  content: Directiva 90/677/CEE del Consejo, de 13 de diciembre de 1990, por la que
    se amplía el ámbito de aplicación de la Directiva 81/851/CEE relativa a la
    aproximación de las legislaciones de los Estados Miembros sobre medicamentos
    veterinarios y por la que se establecen disposiciones adicionales para medicamentos
    veterinarios inmunológicos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv av den 13 december 1990 som utvidgar räckvidden av direktivet
    81/851/EEG om tillnärmning av medlemsstaternas lagstiftning om veterinärmedicinska
    läkemedel och fastställer ytterligare bestämmelser om immunologiska veterinärmedicinska
    läkemedel
  type: main
