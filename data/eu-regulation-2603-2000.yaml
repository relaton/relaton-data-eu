id: EURegulation26032000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2603/2000 of 27 November 2000 imposing a definitive
    countervailing duty and collecting definitively the provisional duty imposed on
    imports of certain polyethylene terephthalate originating in India, Malaysia and
    Thailand and terminating the anti-subsidy proceeding concerning imports of certain
    polyethylene terephthalate originating in Indonesia, the Republic of Korea and
    Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2603/2000 du Conseil du 27 novembre 2000 instituant
    un droit compensateur définitif, portant perception définitive du droit provisoire
    institué sur les importations de certains types de polyéthylène téréphtalate
    originaires de l'Inde, de Malaisie et de Thaïlande et clôturant la procédure
    antisubventions concernant les importations de certains types de polyéthylène
    téréphtalate originaires d'Indonésie, de la République de Corée et de Taïwan
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2603/2000 des Rates vom 27. November 2000 zur Einführung
    eines endgültigen Ausgleichszolls und zur endgültigen Vereinnahmung des vorläufigen
    Zolls auf die Einfuhren von bestimmtem Polyethylenterephthalat mit Ursprung in
    Indien, Malaysia und Thailand und zur Einstellung des Antisubventionsverfahrens
    gegenüber den Einfuhren von bestimmtem Polyethylenterephthalat mit Ursprung in
    Indonesien, der Republik Korea und Taiwan
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 2603/2000 на Съвета от 27 ноември
    2000 година за налагане на окончателно изравнително
    мито и окончателно събиране на временното
    мито, наложено при вноса на определен полиетилентерефталат
    с произход от Индия, Малайзия и Тайланд, и за
    прекратяване на процедурата за защита срещу
    субсидиран внос на полиетилентерефталат с
    произход от Индонезия, Република Корея и Тайван
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2603/2000 ze dne 27. listopadu 2000, kterým
    se ukládá konečné vyrovnávací clo a konečné vybrání prozatímního cla
    uloženého na dovozy některých polyetyléntereftalátů z Indie, Malajsie a
    Thajska a ukončuje antisubvenční řízení týkající se dovozů některých
    polyetyléntereftalátů pocházejících z Indonésie, Korejské republiky a
    Tchaj-wanu
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2603/2000 af 27. november 2000 om indførelse
    af en endelig udligningstold på visse typer polyethylenterephthalat med oprindelse
    i Indien, Malaysia og Thailand og om endelig opkrævning af den midlertidige told
    samt om afslutning af antisubsidieproceduren vedrørende import af visse typer
    polyethylenterephthalat med oprindelse i Indonesien, Republikken Korea og Taiwan
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2603/2000 του Συμβουλίου,
    της 27ης Νοεμβρίου 2000, για την επιβολή οριστικού
    αντισταθμιστικού δασμού και την οριστική είσπραξη
    του προσωρινού δασμού που επιβλήθηκε στις
    εισαγωγές ορισμένων τύπων τερεφθαλικού πολυαιθυλενίου,
    καταγωγής Ινδίας, Μαλαισίας και Ταϋλάνδης,
    και την περάτωση της διαδικασίας κατά των επιδοτήσεων
    όσον αφορά τις εισαγωγές ορισμένων τύπων τερεφθαλικού
    πολυαιθυλενίου, καταγωγής Ινδονησίας, Δημοκρατίας
    της Κορέας και Ταϊβάν
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2603/2000, 27. november 2000, millega kehtestatakse
    teatava Indiast, Malaisiast ja Taist pärineva polüetüleentereftalaadi impordi
    suhtes lõplik tasakaalustav tollimaks ja nõutakse lõplikult sisse selle suhtes
    kehtestatud ajutine tollimaks ning lõpetatakse subsiidiumidevastane menetlus
    teatava Indoneesiast, Korea Vabariigist ja Taiwanist pärineva polüetüleentereftalaadi
    impordi suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2603/2000, annettu 27 päivänä marraskuuta
    2000, lopullisen tasoitustullin käyttöönotosta Intiasta, Malesiasta ja Thaimaasta
    peräisin olevan tietynlaisen polyeteenitereftalaatin tuonnissa, kyseisessä tuonnissa
    käyttöön otetun väliaikaisen tullin lopullisesta kantamisesta sekä Indonesiasta,
    Korean tasavallasta ja Taiwanista peräisin olevan tietynlaisen polyeteenitereftalaatin
    tuontia koskevan tukien vastaisen menettelyn päättämisestä
  type: main
- language: hu
  script: Latn
  content: A Tanács 2603/2000/EK rendelete (2000. november 27.) az Indiából, Malajziából
    és Thaiföldről származó egyes polietilén-tereftalátok behozatalára végleges
    kiegyenlítő vám kivetéséről és a kivetett ideiglenes vám végleges beszedéséről,
    illetve az Indonéziából, a Koreai Köztársaságból és Tajvanból származó
    bizonyos polietilén-tereftalát behozatalára vonatkozó szubvencióellenes eljárás
    megszüntetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2603/2000 del Consiglio, del 27 novembre 2000, che
    istituisce un dazio compensativo definitivo e stabilisce la riscossione definitiva
    del dazio provvisorio istituito sulle importazioni di alcuni tipi di polietilentereftalato
    originarie dell'India, della Malaysia e della Thailandia e che chiude il procedimento
    antisovvenzioni relativo alle importazioni di alcuni tipi di polietilentereftalato
    originarie dell'Indonesia, della Repubblica di Corea e di Taiwan
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2603/2000 (2000. gada 27. novembris), ar ko nosaka
    galīgu kompensācijas maksājumu un galīgi iekasē pagaidu maksājumu, kurš
    noteikts par dažu Indijas, Malaizijas un Taizemes izcelsmes polietilēna tereftalātu
    importu, un izbeidz antisubsidēšanas procedūru attiecībā uz dažu Indonēzijas,
    Korejas Republikas un Taivānas izcelsmes polietilēna tereftalātu importu
  type: main
- language: lt
  script: Latn
  content: 2000 m. lapkričio 27 d. Tarybos reglamentas (EB) Nr. 2603/2000, įvedantis
    galutinį kompensacinį muitą ir galutinai surenkantis laikinąjį muitą, įvestą
    tam tikram importuojamam Indijos, Malaizijos ir Tailando kilmės polietileno tereftalatui,
    ir nutraukiantis antisubsidinę procedūrą dėl tam tikro Indonezijos, Korėjos
    Respublikos ir Taivanio kilmės polietileno tereftalato importo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2603/2000 tas-27 ta' Novembru 2000 li
    jimponi taxxa kompensatorja u l-ġbir definittiv tad-dazji proviżjonali imposti
    fuq l-importazzjonijiet ta' ċerti tereftalat tal-polietilene li joriġina mill-Indja,
    Malasja u t-Tajlandja u li jtemm il-proċediment kontra s-sussidji fir-rigward
    ta' l-importazzjonijiet ta' ċerti tereftalat tal-polietilene li joriġina mill-Indonesja,
    r-Repubblika tal-Korea u t-Tajwan
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2603/2000 van de Raad van 27 november 2000 tot instelling
    van een definitief compenserend recht en definitieve inning van het voorlopige
    recht op de invoer van polyethyleentereftalaat uit India, Maleisië en Thailand
    en tot beëindiging van de antisubsidieprocedure met betrekking tot de invoer
    van polyethyleentereftalaat uit Indonesië, de Republiek Korea en Taiwan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 2603/2000 z dnia 27 listopada 2000 r. nakładające
    ostateczne cło wyrównawcze i stanowiące o ostatecznym poborze nałożonego
    cła tymczasowego na przywóz określonych rodzajów politereftalanu etylenu pochodzącego
    z Indii, Malezji i Tajlandii oraz kończące postępowanie antysubsydyjne w odniesieniu
    do przywozu określonych rodzajów politereftalanu etylenu pochodzącego z Indonezji,
    Republiki Korei oraz Tajwanu
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2603/2000 do Conselho, de 27 de Novembro de 2000,
    que institui um direito de compensação definitivo e que estabelece a cobrança
    definitiva do direito provisório instituído sobre as importações de um determinado
    tipo de poli(tereftalato de etileno) originário da Índia, da Malásia e da Tailândia
    e que encerra o processo anti-subvenções no que se refere às importações
    de um determinado tipo de poli(tereftalato de etileno) originário da Indonésia,
    da República da Coreia e de Taiwan
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2603/2000 al Consiliului din 27 noiembrie 2000 de
    instituire a unui drept compensatoriu definitiv și de percepere definitivă a
    dreptului provizoriu instituit la importurile anumitor tipuri de polietilenă
    tereftalat originare din India, Malaezia și Thailanda și de închidere a procedurii
    antisubvenții privind importurile anumitor tipuri de polietilenă tereftalat
    originare din Indonezia, Republica Coreea și Taiwan
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2603/2000 z 27. novembra 2000, ktorým sa ukladá
    konečné vyrovnávacie clo a vyberá s konečnou platnosťou dočasné clo uložené
    na dovozy určitých druhov polyetyléntereftalátov, s pôvodom v Indii, Malajzii
    a v Thajsku, a ktorým sa ukončuje antidotačné konanie, týkajúce sa dovozov
    určitých druhov polyetyléntereftalátov, s pôvodom v Indonézii, v Kórejskej
    republike a na Taiwane.
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2603/2000 z dne 27. novembra 2000 o uvedbi dokončnih
    izravnalnih dajatev in o dokončnem pobiranju začasnih dajatev, uvedenih pri
    uvozu določenega polietilen tereftalata s poreklom iz Indije, Malezije in Tajske
    in o ustavitvi protisubvencijskega postopka za uvoz določenega polietilen tereftalata
    s poreklom iz Indonezije, Republike Koreje in Tajvana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2603/2000 del Consejo, de 27 de noviembre de 2000,
    por el que se establece un derecho compensatorio definitivo, se percibe definitivamente
    el derecho provisional establecido sobre las importaciones de determinado politereftalato
    de etileno originarias de la India, Malasia y Tailandia y se da por concluido
    el procedimiento antisubvenciones relativo a las importaciones de determinado
    politereftalato de etileno originarias de Indonesia, la República de Corea y
    Taiwán
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2603/2000 av den 27 november 2000 om införande
    av en slutgiltig utjämningstull och slutgiltigt uttag av den provisoriska tullen
    på import av visst slags polyetentereftalat med ursprung i Indien, Malaysia och
    Thailand samt om avslutande av antisubventionsförfarandet rörande import av
    visst slags polyetentereftalat med ursprung i Indonesien, Republiken Korea och
    Taiwan
