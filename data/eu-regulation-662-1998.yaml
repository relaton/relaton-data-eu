title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 662/98 of 24 March 1998 laying down to what
    extent applications for issue of export licences submitted during March 1998 for
    beef and veal products which may benefit from special import treatment in Canada
    may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 662/98 de la Commission du 24 mars 1998 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois de mars 1998 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation au Canada
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 662/98 der Kommission vom 24. März 1998 über das
    Ausmaß, in dem den im März 1998 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr nach Kanada eine
    besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 662/98 af 24. marts 1998 om fastlæggelse
    af, i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i
    marts 1998 for oksekødsprodukter, der nyder særbehandling ved indførsel til
    Canada, kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 662/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Μαρτίου 1998 για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εξαγωγής που υποβλήθηκαν
    τον Μάρτιο 1998 για τα προϊόντα του τομέα του
    βοείου κρέατος ειδικής μεταχειρίσεως κατά
    την εισαγωγή στον Καναδά
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 662/98, annettu 24 päivänä maaliskuuta 1998,
    Kanadassa erityistuontikohtelun saavien naudanliha-alan tuotteiden maaliskuussa
    1998 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 662/98 della Commissione del 24 marzo 1998 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di marzo 1998 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in Canada
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 662/98 van de Commissie van 24 maart 1998 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in maart 1998 ingediende aanvragen
    om uitvoercertificaten voor producten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in Canada
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 662/98 da Comissão de 24 de Março de 1998 que determina
    em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Março de 1998 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    no Canadá
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 662/98 de la Comisión de 24 de marzo de 1998 por el
    que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de marzo de 1998, para los productos del
    sector de la carne de bovino que se beneficien de un trato especial para su importación
    en Canadá
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 662/98 av den 24 mars 1998 om fastställande
