title:
- language: en
  script: Latn
  content: '79/668/EEC: Commission Decision of 3 July 1979 authorizing Ireland not
    to apply Community treatment to men''s and boys''shirts, woven, of wool, cotton
    or man- made textile fibres, falling within heading No ex 61.03 of the Common
    Customs Tariff (NIMEXE codes 61.03-11, 15, 19) (category 8), originating in Poland
    and in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/668/CEE: Décision de la Commission, du 3 juillet 1979, autorisant
    l''Irlande à exclure du traitement communautaire les chemises et chemisettes
    tissées, pour hommes et garçonnets, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, de la position ex 61.03 du tarif douanier commun
    (codes Nimexe : 61.03- 11, 15, 19) (catégorie 8), originaires de Pologne et mises
    en libre pratique dans les autres Etats membres (Le texte en langue anglaise est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/668/EWG: Entscheidung der Kommission vom 3. Juli 1979, mit der Irland
    ermächtigt wird, aus Polen stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben, für
    Männer und Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen
    Spinnstoffen der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.03-11 ; 15 ; 19), Kategorie 8, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/668/EØF: Kommissionens beslutning af 3. juli 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage vævede skjorter, herunder
    sports- og arbejdsskjorter, til mænd og drenge, af uld, bomuld eller syntetiske
    eller regenererede fibre, som henhører under pos. ex 61.03 i den fælles toldtarif
    (NIMEXE- nummer 61.03-11, 15, 19 ; kategori 8), har oprindelse i Polen og frit
    kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/668/CEE: Decisione della Commissione, del 3 luglio 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario camicie e camicette, tessute,
    per uomo e per ragazzo, di lana, di cotone o di fibre tessili sintetiche o artificiali
    della voce ex 61.03 della tariffa doganale comune (codici Nimexe: 61.03-11, 15,
    19), categoria 8, originarie della Polonia e messe in libera pratica negli altri
    Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/668/EEG: Beschikking van de Commissie van 3 juli 1979 waarbij Ierland
    wordt gemachtigd overhemden en sporthemden, geweven van wol of katoen of van synthetische
    of van kunstmatige textielvezels, van post ex 61.03 van het gemeenschappelijk
    douanetarief (NIMEXE- code 61.03-11, 15, 19) (categorie 8), van oorsprong uit
    Polen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
