title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2600/90 of 7 September 1990 re-establishing
    the levying of customs duties on products falling within CN code 3503 00 10 originating
    in Brazil to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2600/90 de la Commission du 7 septembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3503 00 10 originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2600/90 DER KOMMISSION vom 7. September 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer die Waren des KN-Codes 3503 00 10 mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3896/89 des Rates vorgesehenen
    Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2600/90 af 7. september 1990 om genindførelse
