id: EURegulation5151980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 515/80 of 28 February 1980 re-establishing
    the levying of customs duties on artificial flowers, foliage or fruit and parts
    thereof, falling within heading No 67.02 and originating in developing countries
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 515/80 de la Commission, du 28 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux fleurs,
    feuillages et fruits artificiels et leurs parties, de la position 67.02 du tarif
    douanier commun, originaires des pays en voie de développement bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 515/80 der Kommission vom 28. Februar 1980 zur Wiedereinführung
    des Zollsatzes für künstliche Blumen, Blätter und Früchte sowie Teile davon
    der Tarifnummer 67.02 mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 515/80 af 28. februar 1980 om genindførelse
    af opkrævning af toldafgifter for kunstige blomster, blade og frugter samt dele
    deraf, under pos. 67.02, som har oprindelse i udviklingslande og omfattes af de
    toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 515/80 della Commissione, del 28 febbraio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai fiori, foglie e frutti
    artificiali e loro parti, della voce 67.02 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 515/80 van de Commissie van 28 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor kunstbloemen, kunstloofwerk
    en kunstvruchten, alsmede delen daarvan, van post 67.02, van oorsprong uit de
    ontwikkelingslanden, ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van
    de Raad tariefpreferenties werden geopend
  type: main
