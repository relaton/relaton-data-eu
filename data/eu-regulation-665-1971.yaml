  content: Règlement (CEE) n° 665/71 de la Commission, du 30 mars 1971, portant
    rétablissement des droits de douane applicables aux conserves d'ananas de la
    sous-position EX 20.06 B II du tarif douanier commun, originaires des États partenaires
    de la Communauté de l'Afrique de l'Est
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 665/71 der Kommission vom 30. März 1971 über die
    Wiedereinführung der Zollsätze für Ananaskonserven der Tarifstelle ex 20.06
    B II des Gemeinsamen Zolltarifs mit Ursprung in den Partnerstaaten der Ostafrikanischen
    Gemeinschaft
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 665/71 della Commissione, del 30 marzo 1971, che ristabilisce
    i dazi applicabili alle conserve di ananassi della sottovoce doganale ex 20.06
    B II della tariffa doganale comune, originarie degli Stati consociati della Comunità
    dell'Africa orientale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 665/71 van de Commissie van 30 maart 1971 houdende
    wederinstelling van de douanerechten van toepassing op ananasconserven van post
    ex 20.06 B II van het gemeenschappelijk douanetarief, van oorsprong uit de Partnerstaten
    van de Oostafrikaanse Gemeenschap
