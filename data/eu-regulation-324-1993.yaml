  content: Commission Regulation (EEC) No 324/93 of 12 February 1993 fixing for the
    period 1992/93 certain coefficients applicable to cereals exported in the form
    of certain spirituous beverages
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 324/93 de la Commission, du 12 février 1993, fixant
