title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2146/2001 of 31 October 2001 amending Regulation
    (EC) No 1121/2001 fixing the adjustment coefficients to be applied to each traditional
    operator's reference quantity under the tariff quotas for imports of bananas and
    derogating from Regulation (EC) No 896/2001 as regards the submission of new import
    licence applications
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2146/2001 de la Commission du 31 octobre 2001 modifiant
    le règlement (CE) n° 1121/2001 fixant les coefficients d'adaptation à appliquer
    à la quantité de référence de chaque opérateur traditionnel dans le cadre
    des contingents tarifaires à l'importation de bananes et dérogeant au règlement
    (CE) n° 896/2001 en ce qui concerne l'introduction de nouvelles demandes de certificats
    d'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2146/2001 der Kommission vom 31. Oktober 2001 zur Änderung
    der Verordnung (EG) Nr. 1121/2001 zur Festsetzung der Anpassungskoeffizienten
    für die Referenzmenge der traditionellen Marktbeteiligten im Rahmen der Zollkontingente
    für die Einfuhr von Bananen und zur Abweichung von der Verordnung (EG) Nr. 896/2001
    hinsichtlich der Beantragung neuer Einfuhrlizenzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2146/2001 af 31. oktober 2001 om ændring
    af forordning (EF) nr. 1121/2001 om fastsættelse af justeringskoefficienter til
    multiplikation af referencemængden for de enkelte traditionelle importører under
    importtoldkontingenterne for bananer og om fravigelse af forordning (EF) nr. 896/2001
    for så vidt angår indgivelse af nye ansøgninger om importlicenser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2146/2001 της Επιτροπής,
    της 31ης Οκτωβρίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1121/2001 για τον καθορισμό
    των συντελεστών προσαρμογής που θα εφαρμοστούν
    στην ποσότητα αναφοράς κάθε παραδοσιακού εμπορευομένου
    στο πλαίσιο των δασμολογικών ποσοστώσεων κατά
    την εισαγωγή μπανανών και την παρέκκλιση από
    τον κανονισμό (ΕΚ) αριθ. 896/2001 όσον αφορά την
    υποβολή νέων αιτήσεων πιστοποιητικών εισαγωγής
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2146/2001, annettu 31 päivänä lokakuuta 2001,
    banaanien tuontitariffikiintiöiden kunkin perinteisen toimijan viitemäärään
    sovellettavien mukautuskertoimien vahvistamisesta annetun asetuksen (EY) N:o 1121/2001
    muuttamisesta ja asetuksen (EY) N:o 896/2001 säännöksistä poikkeamisesta uusien
    tuontitodistushakemusten jättämisen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2146/2001 della Commissione, del 31 ottobre 2001, recante
    modifica del regolamento (CE) n. 1121/2001, che fissa i coefficienti di adattamento
    applicabili al quantitativo di riferimento di ogni operatore tradizionale nel
    quadro dei contingenti tariffari per l'importazione di banane, e deroga al regolamento
    (CE) n. 896/2001 in ordine alla presentazione di nuove domande di titoli d'importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2146/2001 van de Commissie van 31 oktober 2001 houdende
    wĳziging van Verordening (EG) nr. 1121/2001 tot vaststelling van de aanpassingscoëfficiënten
    die moeten worden toegepast op de referentiehoeveelheid van elke traditionele
    marktdeelnemer in het kader van de tariefcontingenten voor de invoer van bananen
    en houdende afwĳking van Verordening (EG) nr. 896/2001 ten aanzien van de indiening
    van nieuwe aanvragen voor invoercertificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2146/2001 da Comissão, de 31 de Outubro de 2001,
    que altera o Regulamento (CE) n.° 1121/2001 que fixa os coeficientes de adaptação
    a aplicar à quantidade de referência de cada operador tradicional no âmbito
    dos contingentes pautais de importação de bananas e derroga o Regulamento (CE)
    n.° 896/2001 no respeitante à apresentação de novos pedidos de certificados
    de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2146/2001 de la Comisión, de 31 de octubre de 2001,
    que modifica el Reglamento (CE) n° 1121/2001 por el que se fijan los coeficientes
    de adaptación que deben aplicarse a la cantidad de referencia de cada operador
    tradicional en el marco de los contingentes arancelarios de importación de plátanos
    y se establece una excepción al Reglamento (CE) n° 896/2001 en lo que respecta
    la presentación de nuevas solicitudes de certificados de importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2146/2001 av den 31 oktober 2001 om ändring
    av förordning (EG) nr 1121/2001 om fastställande av justeringskoefficienter
    för den referenskvantitet som skall tilldelas varje traditionell aktör inom
    ramen för tullkvoterna vid import av bananer och om undantag från förordning
    (EG) nr 896/2001 beträffande inlämning av nya ansökningar om importlicens
  type: main
