title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/26 of 12 January 2021 further extending the
    temporary derogation from the Council’s Rules of Procedure introduced by Decision
    (EU) 2020/430, and extended by Decisions (EU) 2020/556, (EU) 2020/702, (EU) 2020/970,
    (EU) 2020/1253 and (EU) 2020/1659, in view of the travel difficulties caused by
    the COVID-19 pandemic in the Union
  type: main
- language: fr
  script: Latn
