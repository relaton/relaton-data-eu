title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 572/91 of 8 March 1991 amending Council
    Regulation (EEC) No 3034/80 fixing the quantities of basic products considered
    to have been used in the manufacture of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 572/91 DE LA COMMISSION du 8 mars 1991 modifiant le
    règlement (CEE) no 3034/80 du Conseil fixant les quantités de produits de base
    considérées comme étant entrées dans la fabrication de marchandises relevant
    du règlement (CEE) no 3033/80 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 572/91 DER KOMMISSION vom 8. März 1991 zur Änderung
    der Verordnung (EWG) Nr. 3034/80 des Rates zur Festlegung der Grunderzeugnismengen,
    von denen unterstellt wird, daß sie zur Herstellung von Waren der Verordnung
    (EWG) Nr. 3033/80 verwendet worden sind #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 572/91 af 8. marts 1991 om ændring
    af Rådets forordning (EØF) nr. 3034/80 om fastsættelse af de mængder basisprodukter,
    der anses som medgået til fremstilling af varer, der henhører under forordning
    (EØF) nr. 3033/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 572/91 της Επιτροπής
    της 8ης Μαρτίου 1991 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3034/80 του Συμβουλίου περί καθορισμού
    των ποσοτήτων προϊόντων βάσης που θεωρούνται
    ότι έχουν χρησιμοποιηθεί στην παρασκευή εμπορευμάτων
    τα οποία υπάγονται στον κανονισμό (ΕΟΚ) αριθ.
    3033/80
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 572/91 DELLA COMMISSIONE dell'' 8 marzo 1991 che
    modifica il regolamento (CEE) n. 3034/80 del Consiglio che fissa i quantitativi
    dei prodotti di base che si considerano entrati nella fabbricazione di merci cui
    si applica il regolamento (CEE) n. 3033/80 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 572/91 VAN DE COMMISSIE van 8 maart 1991 tot wijziging
    van Verordening (EEG) nr. 3034/80 van de Raad tot vaststelling van de hoeveelheden
    basisprodukten die worden geacht bij de vervaardiging van de onder Verordening
    (EEG) nr. 3033/80 vallende goederen te zijn gebruikt #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 572/91 DA COMISSÃO de 8 de Março de 1991 que altera
    o Regulamento (CEE) nº 3034/80 do Conselho, que fixa as quantidades de produtos
    de base consideradas como tendo entrado no fabrico de mercadorias abrangidas pelo
    Regulamento (CEE) nº 3033/80 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 572/91 DE LA COMISIÓN de 8 de marzo de 1991 por el
    que se modifica el Reglamento (CEE) no 3034/80 del Consejo por el que se determinan
    las cantidades de productos de base que se consideran incluidas en la fabricación
    de mercancías reguladas por el Reglamento (CEE) no 3033/80 #'
