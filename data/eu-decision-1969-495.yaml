title:
- language: fr
  script: Latn
  content: '69/495/CEE: Décision du Conseil du 16 décembre 1969 portant dérogation
    à la décision du 9 octobre 1961 relative à l''uniformisation de la durée des
    accords commerciaux, pour l''accord à long terme relatif aux échanges commerciaux
    négocié entre le gouvernement du Royaume de Belgique, le gouvernement du Royaume
    des Pays-Bas et le gouvernement du Grand-Duché du Luxembourg, agissant en commun
    en vertu du Traité instituant l''Union économique Benelux, partie contractante
    d''une part, et le gouvernement de la République socialiste de Roumanie, partie
    contractante d''autre part'
  type: main
- language: de
  script: Latn
  content: '69/495/EWG: Entscheidung des Rates vom 16. Dezember 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen hinsichtlich des zwischen den Regierungen des Königreichs Belgien,
    des Königreichs der Niederlande und des Großherzogtums Luxemburg, die auf Grund
    des Vertrages zur Gründung der Benelux- Wirtschaftsunion als eine Vertragspartei
    auftreten, und der Regierung der Sozialistischen Republik Rumänien geschlossenen
    langfristigen Abkommens über die Handelsbeziehungen'
  type: main
- language: it
  script: Latn
  content: '69/495/CEE: Decisione del Consiglio, del 16 dicembre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali, per quanto concerne l''accordo a lungo termine negoziato
    tra il governo del Regno del Belgio, il governo del Regno dei Paesi Bassi ed il
    governo del Granducato di Lussemburgo, operanti in comune in virtù del trattato
    che istituisce l''Unione economica Benelux, parte contraente da un lato, ed il
    governo della Repubblica socialista di Romania, parte contraente dall''altro,
    concernente gli scambi commerciali'
  type: main
- language: nl
  script: Latn
  content: '69/495/EEG: Beschikking van de Raad van 16 december 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, ten aanzien van het akkoord op lange termijn inzake het
    handelsverkeer tussen de Regering van het Koninkrijk België, de Regering van
    het Koninkrijk der Nederlanden en de Regering van het Groothertogdom Luxemburg,
    die krachtens het Verdrag tot oprichting van de Economische Unie van de Benelux
    gemeenschappelijk optreden, overeenkomstsluitende partij enerzijds, en de Regering
    van de Socialistische Republiek Roemenië, overeenkomstsluitende partij anderzijds'
  type: main
