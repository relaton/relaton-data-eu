  content: Commission Regulation (EEC) No 2380/82 of 31 August 1982 fixing the rates
    of the refunds applicable from 1 September 1982 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2380/82 de la Commission, du 31 août 1982, fixant les
    taux des restitutions applicables, à compter du 1er septembre 1982, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2380/82 der Kommission vom 31. August 1982 zur Festsetzung
    der ab 1. September 1982 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2380/82 af 31. august 1982 om fastsættelse
