title:
- language: en
  script: Latn
  content: '79/397/EEC: Commission Decision of 29 March 1979 extending the period
    of application of the systems of authorization for trade in crude oil and/or petroleum
    products between certain Member States provided for by Decisions 79/126/EEC and
    79/135/EEC (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/397/CEE: Décision de la Commission, du 29 mars 1979, prorogeant les
    systèmes d''autorisation pour les échanges de pétrole brut et/ou de produits
    pétroliers entre certains Etats membres prévus par les décisions 79/126/CEE
    et 79/135/CEE (Les textes en langues française et néerlandaise sont les seuls
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/397/EWG: Entscheidung der Kommission vom 29. März 1979 zur Verlängerung
    der Geltungsdauer des in den Entscheidungen 79/126/EWG und 79/135/EWG vorgesehenen
    Systems automatisch erteilter Genehmigungen von Ausfuhren von Rohöl und/oder
    Erdölerzeugnissen zwischen verschiedenen Mitgliedstaaten (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/397/EØF: Kommissionens beslutning af 29. marts 1979 om forlængelse
    af ordningerne med licenser for samhandelen med mineralolie og/eller mineralolieprodukter
    mellem visse medlemsstater som fastsat i beslutning 79/126/EØF og 79/135/EØF
    (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/397/CEE: Decisione della Commissione, del 29 marzo 1979, che proroga
    i sistemi di autorizzazione per gli scambi di petrolio greggio e/o di prodotti
    petroliferi tra taluni Stati membri previsti dalle decisioni 79/126/CEE e 79/135/CEE
    (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/397/EEG: Beschikking van de Commissie van 29 maart 1979 tot verlenging
    van de stelsels voor het handelsverkeer van ruwe aardolie en/of aardolieprodukten
    tussen bepaalde Lid-Staten neergelegd in de Beschikkingen 79/126/EEG en 79/135/EEG'
  type: main
