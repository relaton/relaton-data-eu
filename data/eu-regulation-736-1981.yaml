    καί μισοφόρια, πλεκτά, εκ συνθετικών υφαντικών
    ινών, τών προϊόντων τής κατηγορίας 69 (κώδικας
    0690), καταγωγής Νοτίου Κορέας, δικαιούχων τών
    προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ. 3320/80
    τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: regolamento (CEE) n. 736/81 della Commissione, del 23 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti e sottogonne a maglia,
    di fibre tessili, della categoria di prodotti n. 69 (codice 0690), originarie
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 736/81 van de Commissie van 23 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op onderjurken
    en onderrokken van breiwerk van synthetische textielvezels van de categorie van
    produkten nr. 69 (codenummer 0690), van oorsprong uit Zuid-Korea, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3320/80
    van de Raad
