title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 736/81 of 23 March 1981 re-establishing
    the levying of customs duties on knitted or crocheted petticoats and slips, of
    synthetic textile fibres, products of category 69 (code 0690), originating in
    South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 736/81 de la Commission, du 23 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux combinaisons
    et jupons de bonneterie, de fibres textiles synthétiques, de la catégorie de
    produits n° 69 (code 0690), originaires de Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 736/81 der Kommission vom 23. März 1981 über die
    Wiedereinführung des Zollsatzes für Unterkleider und Unterröcke aus Gewirken,
    aus synthetischen Spinnstoffen, der Warenkategorie Nr. 69 (Kennziffer 0690), mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 736/81 af 23. marts 1981 om genindførelse
    af opkrævning af toldafgifter for trusser og andre underbenklæder af trikotage,
    af syntetiske fibre, under kategori 69 (kode 0690), som har oprindelse i Sydkorea
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 736/81 τής Επιτροπής
