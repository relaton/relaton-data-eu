title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 573/2001 of 23 March 2001 amending Regulation
    (EC) No 169/2001 and increasing the quantity covered by the standing invitation
    to tender for the resale on the internal market of rice held by the Italian intervention
    agency to 50000 tonnes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 573/2001 de la Commission du 23 mars 2001 modifiant
    le règlement (CE) n° 169/2001 et portant à 50000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur du riz détenu par l'organisme d'intervention
    italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 573/2001 der Kommission vom 23. März 2001 zur Änderung
    der Verordnung (EG) Nr. 169/2001 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von Reis aus Beständen der italienischen
    Interventionsstelle auf 50000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 573/2001 af 23. marts 2001 om ændring
    af forordning (EF) nr. 169/2001 og forhøjelse til 50000 tons af den løbende
    licitation med henblik på at sælge ris, som det italienske interventionsorgan
    ligger inde med, på det indre marked
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 573/2001 της Επιτροπής,
    της 23ης Μαρτίου 2001, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 169/2001 και για αύξηση σε
    50000 τόνους της προκήρυξης δημοπρασίας για τη
    μεταπώληση στην εσωτερική αγορά ρυζιού που
    βρίσκονται στην κατοχή του ιταλικού οργανισμού
    παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 573/2001, annettu 23 päivänä maaliskuuta 2001,
    asetuksen (EY) N:o 169/2001 muuttamisesta ja pysyvän tarjouskilpailun avaamisesta
    Italian interventioelimen hallussa olevan 50000 riisitonnin myymiseksi uudelleen
    sisämarkkinoilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 573/2001 della Commissione, del 23 marzo 2001, che
    modifica il regolamento (CE) n. 169/2001 e porta a 50000 tonnellate la gara permanente
    per la rivendita sul mercato interno di riso detenuto dall'organismo d'intervento
    italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 573/2001 van de Commissie van 23 maart 2001 houdende
    wĳziging van Verordening (EG) nr. 169/2001 en houdende verhoging tot 50000 ton,
    van de hoeveelheid rĳst uit de Italiaanse interventievoorraden waarvoor een permanente
    inschrĳving voor de verkoop op de interne markt gehouden wordt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 573/2001 da Comissão, de 23 de Março de 2001, que
    altera o Regulamento (CE) n.° 169/2001 e que eleva para 50000 toneladas o concurso
    permanente para a venda no mercado interno de arroz na posse do organismo de intervenção
    italiano
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 573/2001 de la Comisión, de 23 de marzo de 2001, que
