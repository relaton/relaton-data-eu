  content: COMMISSION REGULATION (EC) No 1986/96 of 16 October 1996 determining the
    extent to which applications lodged in October 1996 for import certificates for
    certain cheeses covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1986/96 DE LA COMMISSION du 16 octobre 1996 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1996 pour certains fromages dans le cadre du régime prévu par les
    accords européens conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1986/96 DER KOMMISSION vom 16. Oktober 1996 zur Festsetzung
