    medidas destinadas a favorecer el ejercicio efectivo de la libertad de establecimiento
    y de la libre prestación de servicios para las actividades por cuenta propia
    de determinados auxiliares del tansporte y de los agentes de viaje (grupo 718
    CITI) así como de los almacenistas (grupo 720 CITI)
