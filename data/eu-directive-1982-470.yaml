title:
- language: en
  script: Latn
  content: Council Directive 82/470/EEC of 29 June 1982 on measures to facilitate
    the effective exercise of freedom of establishment and freedom to provide services
    in respect of activities of self-employed persons in certain services incidental
    to transport and travel agencies (ISIC Group 718) and in storage and warehousing
    (ISIC Group 720)
  type: main
- language: fr
  script: Latn
  content: Directive 82/470/CEE du Conseil, du 29 juin 1982, relative à des mesures
    destinées à favoriser l'exercice effectif de la liberté d'établissement et
    de la libre prestation des services pour les activités non salariées de certains
    auxiliaires des transports et des agents de voyage (groupe 718 CITI) ainsi que
    des entrepositaires (groupe 720 CITI)
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/470/EWG des Rates vom 29. Juni 1982 über Maßnahmen zur
    Förderung der tatsächlichen Ausübung der Niederlassungsfreiheit und des freien
    Dienstleistungsverkehrs für die selbständigen Tätigkeiten bestimmter Hilfsgewerbetreibender
    des Verkehrs und der Reisevermittler (ISIC-Gruppe 718) sowie der Lagerhalter (ISIC-Gruppe
    720)
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 82/470/EØF af 29. juni 1982 om foranstaltninger til fremme
    af den faktiske udøvelse af etableringsfriheden og den fri udveksling af tjenesteydelser
    ved selvstændig virksomhed inden for visse hjælpeerhverv i forbindelse med transport-
    og rejsebureauvirksomhed (ISIC-gruppe 718) og inden for pakhus og oplagringsvirksomhed
    (ISIC-gruppe 720)
  type: main
- language: el
  script: Grek
  content: Οδηγία 82/470/EOK του Συμβουλίου της 29ης Ιουνίου
    1982 για τα μέτρα που προορίζονται να διευκολύνουν
    την πραγματική άσκηση της ελευθερίας εγκατάστασης
    και της ελεύθερης παροχής υπηρεσιών για τις
    μη μισθωτές δραστηριότητες των απασχολούμενων
    σε ορισμένες βοηθητικές υπηρεσίες των μεταφορών
    και των πρακτόρων ταξιδίων (ομάδα 718 ΔΤΤΒ), καθώς
    και των εναποθηκευτών (ομάδα 720 ΔΤΤΒ)
  type: main
- language: it
  script: Latn
  content: Direttiva 82/470/CEE del Consiglio, del 29 giugno 1982, relativa a misure
    destinate a favorire l'esercizio effettivo della libertà di stabilimento e della
    libera prestazione dei servizi per le attività non salariate di taluni ausiliari
    dei trasporti e dei titolari di agenzie di viaggio (gruppo 718 CITI), nonché
    dei depositari (gruppo 720 CITI)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 82/470/EEG van de Raad van 29 juni 1982 houdende maatregelen
    ter bevordering van de daadwerkelijke uitoefening van het recht van vestiging
    en het vrij verrichten van diensten voor de anders dan in loondienst verrichte
    werkzaamheden van bepaalde tussenpersonen op het gebied van het vervoer en van
    reisbureaubedrijven (groep 718 CITI) alsmede van opslagbedrijven (groep 720 CITI)
  type: main
- language: pt
  script: Latn
  content: Directiva 82/470/CEE do Conselho, de 29 de Junho de 1982, relativa a medidas
    destinadas a favorecer o exercício efectivo da liberdade de estabelecimento e
    da livre prestação de serviços das actividades não assalariadas em determinados
    serviços auxiliares dos transportes e das agências de viagens (grupo 718 CITI)
    bem como nos entrepostos (grupo 720 CITI)
  type: main
- language: es
  script: Latn
