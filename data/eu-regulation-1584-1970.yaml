  content: Règlement (CEE) n° 1584/70 du Conseil, du 27 juillet 1970, relatif à
    l'application du protocole n° 2 annexe à l'accord relatif aux échanges commerciaux
    et du protocole n° 2 annexe à l'accord créant une association entre la CEE
    et la République unie de Tanzanie, la République de l'Ouganda et la République
    du Kenya
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1584/70 des Rates vom 27. Juli 1970 über die Anwendung
    des Protokolls Nr. 2 im Anhang zum Abkommen über den Warenverkehr und des Protokolls
    Nr. 2 im Anhang zum Abkommen zur Gründung einer Assoziation zwischen der Europäischen
    Wirtschaftsgemeinschaft und der Vereinigten Republik Tansania, der Republik Uganda
    und der Republik Kenia
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1584/70 del Consiglio, del 27 luglio 1970, relativo
    all'applicazione del protocollo n. 2 allegato all'Accordo sugli scambi commerciali
    e del protocollo n. 2 allegato all'Accordo che crea un'associazione tra la Comunità
    economica europea e la Repubblica unita di Tanzania, la Repubblica dell'Uganda
    e la Repubblica del Kenya
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1584/70 van de Raad van 27 juli 1970 met betrekking
