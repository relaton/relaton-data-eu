title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1994/81 of 15 July 1981 re-establishing
    the levying of customs duties on outer garments and other articles, products of
    category 75 (code 0750), originating in China, to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1994/81 de la Commission, du 15 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres vêtements
    de dessus et accessoires du vêtement de la catégorie 75 (code 0750), originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1994/81 der Kommission vom 15. Juli 1981 über die
    Wiedereinführung des Zollsatzes für andere Oberkleidung und Bekleidungszubehör
    der Warenkategorie Nr. 75 (Kennziffer 0750), mit Ursprung in China, dem die in
    der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1994/81 af 15. juli 1981 om genindførelse
    af opkrævning af toldafgifter for andre yderbeklædningsgenstande og beklædningsgenstande
    under kategori 75 (kode 0750), som har oprindelse i Kina og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1994/81 τής Επιτροπής
    τής 15ης Ιουλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά έτερα ενδύματα
    εξωτερικά καί συμπληρώματα τής ενδύσεως, τών
    προϊόντων τής κατηγορίας αριθ. 75 (κώδικας 0750),
    καταγωγής Κίνας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1994/81 della Commissione, del 15 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli altri indumenti esterni
    e accessori di abbigliamento, della categoria di prodotti n. 75 (codice 0750),
    originari della Cina, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1994/81 van de Commissie van 15 juli 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere bovenkleding
    en kledingtoebehoren, van de categorie van produkten nr. 75 (codenummer 0750),
    van oorsprong uit China, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
