title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2680/77 of 5 December 1977 amending Regulation
    (EEC) No 834/74 laying down requisite provisions to prevent the sugar market being
    disturbed as a result of the price increase in this sector for the 1974/75 sugar
    marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2680/77 de la Commission, du 5 décembre 1977, modifiant
    le règlement (CEE) n° 834/74 établissant des mesures nécessaires pour éviter
    des perturbations sur le marché du sucre, provoquées par l' augmentation des
    prix dans ce secteur pour la campagne sucrière 1974/1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2680/77 der Kommission vom 5. Dezember 1977 zur Änderung
    der Verordnung (EWG) Nr. 834/74 über notwendige Maßnahmen zur Verhinderung von
    Störungen auf dem Zuckermarkt, hervorgerufen durch Preiserhöhungen in diesem
    Sektor für das Zuckerwirtschaftsjahr 1974/75
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2680/77 af 5. december 1977 om ændring
    af forordning (EØF) nr. 834/74 om fastsættelse af nødvendige foranstaltninger
    til undgåelse af forstyrrelser på sukkermarkedet på grund af prisforhøjelsen
    i denne sektor for sukkerproduktionsåret 1974/1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2680/77 della Commissione, del 5 dicembre 1977, recante
    modifica del regolamento (CEE) n. 834/74 che stabilisce le misure necessarie per
    evitare perturbazioni sul mercato dello zucchero provocate dall' aumento dei prezzi
    in tale settore per la campagna saccarifera 1974/1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2680/77 van de Commissie van 5 december 1977 houdende
    wijziging van Verordening (EEG) nr. 834/74 tot vaststelling van de maatregelen
    welke nodig zijn ter voorkoming van verstoringen van de suikermarkt ten gevolge
    van de prijsverhoging in deze sector voor het verkoopseizoen voor suiker 1974/1975
