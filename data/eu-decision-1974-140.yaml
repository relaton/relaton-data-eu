title:
- language: en
  script: Latn
  content: Commission Decision of 13 March 1974 authorizing the French Republic not
    to apply Community treatment to dehydrated garlic falling within heading No 07.04
    ex B of the Common Customs Tariff, originating in Egypt and Taiwan and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/140/CEE de la Commission, du 13 mars 1974, autorisant la République
    française à exclure du traitement communautaire l'ail déshydraté de la position
    07.04 Ex B du Tarif douanier commun, originaire d'Égypte et de Taiwan et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. März 1974, mit der die Französische
    Republik ermächtigt wird, aus Ägypten und Taiwan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen Knoblauchpuder der Tarifnummer
    07.04 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. marts 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage tørret hvidløg, som henhører
    under position 07.04 ex B i den fælles toldtarif, har oprindelse i Ægypten og
    Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 marzo 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario l'aglio disidratato della voce
    07.04 ex B della tariffa doganale comune, originario dell'Egitto e di Taiwan e
    messo in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 13 maart 1974 waarbij de Franse Republiek
    wordt gemachtigd gedehydreerd look van post 07.04 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit Egypte en Taïwan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
