    gegenüber den Einfuhren von Wolframelektroden mit Ursprung in der Volksrepublik
    China durch aus Indien, Laos und Thailand versandte Einfuhren von Wolframelektroden,
    ob als Ursprungserzeugnisse aus Indien, Laos und Thailand angemeldet oder nicht,
    und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
