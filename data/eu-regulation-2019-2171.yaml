title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/2171 of 17 December 2019 initiating
    an investigation concerning possible circumvention of anti-dumping measures imposed
    by Implementing Regulation (EU) 2019/1267 on imports of tungsten electrodes originating
    in the People’s Republic of China by imports of tungsten electrodes consigned
    from India, Laos and Thailand, whether declared as originating in India, Laos
    and Thailand or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’Exécution (UE) 2019/2171 de la Commission du 17 décembre
    2019 ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2019/1267 sur les importations
    d’électrodes en tungstène originaires de la République populaire de Chine
    par des importations d’électrodes en tungstène expédiées de l’Inde, du
    Laos et de Thaïlande, qu’elles aient ou non été déclarées originaires de
    ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/2171 der Kommission vom 17. Dezember
    2019 zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der
