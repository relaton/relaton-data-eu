  script: Latn
  content: Regolamento di esecuzione (UE) 2019/2171 della Commissione del 17 dicembre
    2019 che apre un’inchiesta relativa alla possibile elusione delle misure antidumping
    stabilite dal regolamento di esecuzione (UE) 2019/1267 che istituisce un dazio
    antidumping definitivo sulle importazioni di elettrodi di tungsteno originari
    della Repubblica popolare cinese, mediante l’importazione di elettrodi di tungsteno
    spediti dall’India, dal Laos e dalla Thailandia, indipendentemente dal fatto
    che siano o no dichiarati originari dell’India, del Laos o della Thailandia,
    e che dispone la registrazione di tali importazioni
  type: main
