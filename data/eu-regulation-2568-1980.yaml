title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2568/80 of 7 October 1980 re-establishing
    the levying of customs duties on watch cases and parts of watch cases, falling
    within heading No 91.09 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2568/80 de la Commission, du 7 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux boîtes
    de montre du n° 91.01 et leurs parties, de la position 91.09 du tarif douanier
    commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2568/80 der Kommission vom 7. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Gehäuse, für Uhren der Tarifnummer 91.01 und Teile davon
    der Tarifnummer 91.09, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2568/80 af 7. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for kasser til de i pos. 91.01 omhandlede ure samt
    dele dertil under pos. 91.09, som har oprindelse i Hongkong og omfattes af de
    toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2568/80 della Commissione, del 7 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle casse per orologi
    della voce n. 91.01 e loro parti, della voce 91.09 della tariffa doganale comune,
    originarie di Hong Kong beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2568/80 van de Commissie van 7 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op kasten voor
    horloges bedoeld bij post 91.01, alsmede delen daarvan, van post 91.09, van oorsprong
    uit Hong-Kong ten behoeve waarvan bij Verordening (EEG) nr. 2789/79 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
