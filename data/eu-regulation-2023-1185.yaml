  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1185 z dnia 10 lutego 2023
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady (UE) 2018/2001 poprzez
    ustanowienie minimalnego progu ograniczenia emisji gazów cieplarnianych w przypadku
    pochodzących z recyklingu paliw węglowych oraz poprzez określenie metodyki
    oceny ograniczenia emisji gazów cieplarnianych, uzyskanego dzięki odnawialnym
    ciekłym i gazowym paliwom transportowym pochodzenia niebiologicznego oraz pochodzącym
    z recyklingu paliwom węglowym
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1185 da Comissão de 10 de fevereiro de
    2023 que completa a Diretiva (UE) 2018/2001 do Parlamento Europeu e do Conselho
    estabelecendo um limiar mínimo de redução das emissões de gases com efeito
    de estufa para os combustíveis de carbono reciclado e especificando uma metodologia
    de avaliação das reduções de emissões de gases com efeito de estufa obtidas
    graças a combustíveis líquidos e gasosos renováveis de origem não biológica
    para os transportes e a combustíveis de carbono reciclado
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1185 al Comisiei din 10 februarie 2023 de
    completare a Directivei (UE) 2018/2001 a Parlamentului European și a Consiliului
    prin stabilirea unui prag minim pentru reducerea emisiilor de gaze cu efect de
    seră generate de combustibilii pe bază de carbon reciclat și prin specificarea
    unei metodologii de evaluare a reducerilor de emisii de gaze cu efect de seră
    obținute de la combustibilii lichizi și gazoși de origine nebiologică produși
    din surse regenerabile și utilizați în transporturi și de la combustibilii
    pe bază de carbon reciclat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1185 z 10. februára 2023, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady (EÚ) 2018/2001 stanovením
    minimálnej prahovej hodnoty pre úspory emisií skleníkových plynov z fosílnych
    palív vyrobených z odpadu a spresnením metodiky posudzovania úspor emisií
    skleníkových plynov z kvapalných a plynných palív v doprave z obnoviteľných
    zdrojov nebiologického pôvodu a z fosílnych palív vyrobených z odpadu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1185 z dne 10. februarja 2023 o dopolnitvi
    Direktive (EU) 2018/2001 Evropskega parlamenta in Sveta z določitvijo minimalnega
    praga za prihranke emisij toplogrednih plinov zaradi uporabe recikliranih ogljičnih
    goriv in z določitvijo metodologije za oceno prihrankov emisij toplogrednih plinov
    zaradi uporabe tekočih in plinastih goriv iz obnovljivih virov nebiološkega
    izvora, namenjenih uporabi v prometu, ter recikliranih ogljičnih goriv
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1185 de la Comisión de 10 de febrero de
    2023 que completa la Directiva (UE) 2018/2001 del Parlamento Europeo y del Consejo
    estableciendo un umbral mínimo para la reducción de las emisiones de gases de
    efecto invernadero aplicable a los combustibles de carbono reciclado y especificando
    una metodología para evaluar la reducción de las emisiones de gases de efecto
    invernadero derivada de los carburantes líquidos y gaseosos renovables de origen
    no biológico y de los combustibles de carbono reciclado
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1185 av den 10 februari
    2023 om komplettering av Europaparlamentets och rådets direktiv (EU) 2018/2001
    genom fastställande av ett minimitröskelvärde för minskningen av växthusgasutsläpp
    från återvunna kolbaserade bränslen och genom specificering av en metod för
    bedömningen av minskningen av växthusgasutsläpp från förnybara flytande och
    gasformiga drivmedel av icke-biologiskt ursprung och från återvunna kolbaserade
    bränslen
