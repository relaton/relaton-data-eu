    чрез определяне на минимален праг за намаление
    на емисиите на парникови газове от рециклирани
    въглеродни горива и определяне на методика
    за оценяване на намалението на емисиите на
    парникови газове от възобновяеми течни и газообразни
    транспортни горива от небиологичен произход
    и от рециклирани въглеродни горива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1185 ze dne 10. února
