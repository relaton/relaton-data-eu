    de Raad door de vaststelling van een minimumdrempel voor broeikasgasemissiereducties
    door brandstoffen op basis van hergebruikte koolstof en door de methode te specificeren
    voor de beoordeling van broeikasgasemissiereducties door hernieuwbare vloeibare
