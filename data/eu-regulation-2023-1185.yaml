title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1185 of 10 February 2023 supplementing
    Directive (EU) 2018/2001 of the European Parliament and of the Council by establishing
    a minimum threshold for greenhouse gas emissions savings of recycled carbon fuels
    and by specifying a methodology for assessing greenhouse gas emissions savings
    from renewable liquid and gaseous transport fuels of non-biological origin and
    from recycled carbon fuels
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1185 de la Commission du 10 février 2023
    complétant la directive (UE) 2018/2001 du Parlement européen et du Conseil en
    établissant un seuil minimal de réduction des émissions de gaz à effet de
    serre pour les carburants à base de carbone recyclé et en précisant la méthode
    d’évaluation des réductions des émissions de gaz à effet de serre réalisées
    grâce aux carburants liquides et gazeux renouvelables destinés aux transports,
    d’origine non biologique, et aux carburants à base de carbone recyclé
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1185 der Kommission vom 10. Februar 2023
    zur Ergänzung der Richtlinie (EU) 2018/2001 des Europäischen Parlaments und
    des Rates durch Festlegung eines Mindestschwellenwertes für die Treibhausgaseinsparungen
    durch wiederverwertete kohlenstoffhaltige Kraftstoffe und einer Methode zur Ermittlung
    der Treibhausgaseinsparungen durch flüssige oder gasförmige erneuerbare Kraftstoffe
    nicht biogenen Ursprungs für den Verkehr sowie durch wiederverwertete kohlenstoffhaltige
    Kraftstoffe
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1185 на Комисията
