  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/1185 ón gCoimisiún an 10 Feabhra 2023
    lena bhforlíontar Treoir (AE) 2018/2001 ó Pharlaimint na hEorpa agus ón gComhairle
    trí íostairseach i gcomhair laghduithe ar astaíochtaí gás ceaptha teasa ó
    bhreoslaí carbóin athchúrsáilte a bhunú agus trí mhodheolaíocht a shonrú
    chun measúnú a dhéanamh ar na laghduithe ar astaíochtaí gás ceaptha teasa
    ó bhreoslaí in-athnuaite iompair leachtacha agus gásacha de thionscnamh neamh-bhitheolaíoch
    agus ó bhreoslaí carbóin athchúrsáilte
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1185 оd 10. veljače 2023. o dopuni
    Direktive (EU) 2018/2001 Europskog parlamenta i Vijeća utvrđivanjem minimalne
    granične vrijednosti za uštede emisija stakleničkih plinova povezanih s gorivima
    iz recikliranog ugljika i metodologije za procjenu ušteda emisija stakleničkih
    plinova povezanih s obnovljivim tekućim i plinovitim gorivima nebiološkog podrijetla
    namijenjenima uporabi u prometu te gorivima iz recikliranog ugljika
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1185 felhatalmazáson alapuló rendelete (2023.
    február 10.) az (EU) 2018/2001 európai parlamenti és tanácsi irányelvnek
    a széntartalom újrahasznosításával nyert üzemanyagok révén elért üvegházhatásúgázkibocsátás-megtakarítás
    minimális küszöbértékének megállapítása, valamint a nem biológiai eredetű,
    folyékony vagy gáznemű, megújuló energiaforrásokból származó közlekedési
    célú üzemanyagok és a széntartalom újrahasznosításával nyert üzemanyagok
    révén elért üvegházhatásúgázkibocsátás-megtakarítás meghatározására
    szolgáló módszertan megállapítása útján történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/1185 della Commissione del 10 febbraio 2023
    che integra la direttiva (UE) 2018/2001 del Parlamento europeo e del Consiglio
    definendo la soglia minima di riduzione delle emissioni di gas a effetto serra
    dei carburanti derivanti da carbonio riciclato e precisando la metodologia di
    valutazione delle riduzioni di emissioni di gas a effetto serra da carburanti
    rinnovabili liquidi e gassosi di origine non biologica per il trasporto e da carburanti
    derivanti da carbonio riciclato
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1185 (2023. gada 10. februāris),
    ar ko Eiropas Parlamenta un Padomes Direktīvu (ES) 2018/2001 papildina, nosakot
    siltumnīcefekta gāzu emisiju aiztaupījuma minimālo robežvērtību reciklēta
    oglekļa degvielām un precizējot metodiku, ar kuru novērtē siltumnīcefekta
    gāzu emisiju aiztaupījumu no nebioloģiskas izcelsmes atjaunīgām šķidrajām
    un gāzveida transporta degvielām un no reciklēta oglekļa degvielām
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1185 2023 m. vasario 10 d.
    kuriuo nustatant minimalią išmetamo šiltnamio efektą sukeliančių dujų kiekio
    sumažėjimo dėl perdirbtos anglies kuro naudojimo ribą ir pateikiant išmetamo
    šiltnamio efektą sukeliančių dujų kiekio sumažėjimo dėl iš atsinaujinančiųjų
    išteklių pagaminto nebiologinės kilmės skystojo ir dujinio transporto kuro
    ir perdirbtos anglies kuro naudojimo vertinimo metodiką papildoma Europos Parlamento
    ir Tarybos direktyva (ES) 2018/2001
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/1185 tal-10 ta’ Frar 2023
    li jissupplimenta d-Direttiva (UE) 2018/2001 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi livell limitu minimu għall-iffrankar tal-emissjonijiet ta’
    gassijiet serra ta’ fjuwils tal-karbonju riċiklat u billi jispeċifika metodoloġija
    għall-valutazzjoni tal-iffrankar tal-emissjonijiet ta’ gassijiet serra minn
    fjuwils rinnovabbli likwidi u gassużi għat-trasport ta’ oriġini mhux bijoloġika
    u minn fjuwils tal-karbonju riċiklat
  type: main
