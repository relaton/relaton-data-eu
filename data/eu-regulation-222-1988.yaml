---
id: EURegulation2221988
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 222/88 of 22 December 1987 amending certain
    measures on the application of the common market organization in the milk and
    milk products sector following the introduction of the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 222/88 de la Commission du 22 décembre 1987 modifiant
    certains actes dans le secteur du lait et des produits laitiers suite à l'instauration
    de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 222/88 der Kommission vom 22. Dezember 1987 zur Änderung
    verschiedener Rechtsakte im Sektor Milch und Milcherzeugnisse infolge der Einführung
    der Kombinierten Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 222/88 на Комисията от 22
    декември 1987 година за изменение на някои мерки
    относно прилагането на общата организация
    на пазара в сектора на млякото и млечните продукти
    вследствие въвеждането на Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 222/88 ze dne 22. prosince 1987, kterým se
    v důsledku zavedení kombinované nomenklatury mění některá opatření pro
    používání společné organizace trhu v odvětví mléka a mléčných výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 222/88 af 22. december 1987 om ændring
    af visse retsakter vedrørende anvendelsen af den fælles markedsordning i sektoren
    for mælk og mælkeprodukter som følge af indførelsen af Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 222/88 της Επιτροπής
    της 22ας Δεκεμβρίου 1987 που τροποποιεί ορισμένες
    κοινοτικές πράξεις όσον αφορά την εφαρμογή
    της κοινής οργάνωσης αγοράς στον τομέα του
    γάλακτος και των γαλακτοκομικών προϊόντων
    λόγω της καθιέρωσης της συνδυασμένης ονοματολογίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 222/88, 22. detsember 1987, millega muudetakse
    teatavaid piima- ja piimatooteturu ühise korralduse meetmeid seoses koondnomenklatuuri
    kehtestamisega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 222/88, annettu 22 päivänä joulukuuta 1987,
    tiettyjen maito- ja maitotuotealan säädösten muuttamisesta yhdistetyn nimikkeistön
    käyttöönoton johdosta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 222/88/EGK rendelete (1987. december 22.) a Kombinált Nómenklatúra
    bevezetését követően a tej- és tejtermékágazatra vonatkozó egyes intézkedések
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 222/88 della Commissione del 22 dicembre 1987 che
    modifica alcuni atti nel settore del latte e dei prodotti lattiero-caseari in
    seguito all'instaurazione della nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 222/88 (1987. gada 22. decembris), kas groza
    noteiktus pasākumus kopējās tirgus organizācijas attiecināšanā uz piena
    un piena produktu nozari pēc kombinētās nomenklatūras ieviešanas
  type: main
- language: lt
  script: Latn
  content: 1987 m. gruodžio 22 d. Komisijos reglamentas (EEB) Nr. 222/88, iš dalies
    keičiantis tam tikras priemones dėl bendro rinkos organizavimo taikymo pieno
    ir pieno produktų sektoriuje patvirtinus Kombinuotąją nomenklatūrą
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 222/88 tat-22 ta' Diċembru 1987
    li jemenda ċerti miżuri dwar l-applikazzjoni tal-organizzazzjoni komuni tas-suq
    fis-settur tal-ħalib u l-prodotti tal-ħalib wara l-introduzzjoni tan-nomenklatura
    magħquda
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 222/88 van de Commissie van 22 december 1987 tot
    wijziging van bepaalde besluiten met betrekking tot de sector melk en zuivelprodukten
    als gevolg van de invoering van de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 222/88 z dnia 22 grudnia 1987 r. zmieniające
    niektóre środki w sprawie stosowania wspólnej organizacji rynku w sektorze
    mleka i przetworów mlecznych w następstwie wprowadzenia Nomenklatury Scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 222/88 da Comissão de 22 de Dezembro de 1987 que
    altera certos actos relativos à aplicação da organização comum de mercado
    no sector do leite e dos produtos lácteos
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 222/88 al Comisiei din 22 decembrie 1987 de modificare
    a unor acte din sectorul laptelui și produselor lactate ca urmare a adoptării
    Nomenclaturii Combinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 222/88 z 22. decembra 1987, ktorým sa menia
    a dopĺňajú niektoré opatrenia pre uplatňovanie spoločnej organizácie trhu
    s mliekom a mliečnymi výrobkami po zavedení kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 222/88 z dne 22. decembra 1987 o spremembi nekaterih
    ukrepov o uporabi skupne ureditve trga v sektorju mleka in mlečnih proizvodov
    po uvedbi kombinirane nomenklature, zlasti Uredbe (EGS) št. 2729/81 (Uradni list
    Evropskih skupnosti L 28, z dne 1. februarja 1988)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 222/88 de la Comisión de 22 de diciembre de 1987
    por el que se modifican determinados actos en el sector de la leche y de los productos
    lácteos como consecuencia de la introducción de la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 222/88 av den 22 december 1988 om ändring
    av vissa rättsakter om tillämpningen av den gemensamma organisationen av marknaden
    för mjölk och mjölkprodukter till följd av införandet av Kombinerade nomenklaturen
  type: main
