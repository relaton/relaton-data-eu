    ittiche applicabili alle navi battenti bandiera del Portogallo nelle acque soggette
    alla sovranità o alla giurisdizione di un Stato membro, esclusi la Spagna e il
    Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 3894/91 van de Raad van 17 december 1991 tot vaststelling,
    voor 1992, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op de vlag van Portugal voerende vaartuigen,
    in de wateren die onder de soevereiniteit of de jurisdictie van een Lid­Staat
    vallen, met uitzondering van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento ( CEE ) n° 3894/91 do Conselho, de 17 de Dezembro de 1991,
