title:
- language: en
  script: Latn
  content: Council Regulation ( EEC ) No 3894/91 of 17 December 1991 fixing, for 1992,
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of Member States, apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement ( CEE ) n° 3894/91 du Conseil, du 17 décembre 1991, fixant,
    pour l' année 1992, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon du Portugal dans les eaux relevant
    de la souveraineté ou de la juridiction d' un Etat membre, à l' exception de
    l' Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung ( EWG ) Nr. 3894/91 des Rates vom 17. Dezember 1991 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder der Gerichtsbarkeit eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    für 1992
  type: main
- language: da
  script: Latn
  content: Rådets forordning ( EØF ) nr. 3894/91 af 17. december 1991 om fastsættelse
    for 1992 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der hører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3894/91 του Συμβουλίου
    της 17ης Δεκεμβρίου 1991 για τον καθορισμό για
    το 1992, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται στα
    σκάφη με πορτογαλική σημαία στα ύδατα που υπάγονται
    στην κυριαρχία ή τη δικαιοδοσία ενός κράτους
    μέλους, εξαιρέσει της Ισπανίας και της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento ( CEE ) n. 3894/91 del Consiglio, del 17 dicembre 1991, che
