title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/991 of 19 June 2015 establishing the position
    to be adopted on behalf of the European Union in the relevant Committees of the
    United Nations Economic Commission for Europe as regards the proposals for amendments
    to UN Regulations Nos 14, 17, 28, 29, 41, 49, 51, 54, 59, 80, 83, 95, 100, 101,
    109, 117, 134 and 135, on a new UN Regulation on electric vehicle safety of category
    L, and on amendments to the Consolidated Resolution on the Construction of Vehicles
    (R.E.3)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/991 du Conseil du 19 juin 2015 établissant la position
