  content: COMMISSION REGULATION (EEC) No 2975/93 of 28 October 1993 re-establishing
    the levying of customs duties on products of categories 22, 29 and 78 (order Nos
    40.0220, 40.0290 and 40.0780), originating in Indonesia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2975/93 de la Commission du 28 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 22, 29 et 78 (numéros d'ordre 40.0220, 40.0290 et 40.0780) originaires
    d'Indonésie, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
