title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2690/84 of 21 September 1984 imposing a
    provisional anti-dumping duty on imports of artificial corundum originating in
    the People' s Republic of China and Czechoslovakia and terminating the proceeding
    in respect of imports of artificial corundum originating in Spain and Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2690/84 de la Commission du 21 septembre 1984 instituant
    un droit antidumping provisoire sur les importations de corindons artificiels,
    originaires de la République populaire de Chine et de Tchécoslovaquie, et portant
    clôture de la procédure à l'égard des importations de corindons artificiels
    originaires d'Espagne et de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2690/84 der Kommission vom 21. September 1984 zur
    Einführung eines vorläufigen Antidumpingzolls auf die Einfuhren von künstlichem
    Korund mit Ursprung in der Volksrepublik China und der Tschechoslowakei und zur
    Einstellung des Verfahrens betreffend die Einfuhren von künstlichem Korund mit
    Ursprung in Spanien und Jugoslawien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2690/84 af 21. september 1984 om indførelse
    af en midlertidig antidumpingtold på importen af kunstig korund med oprindelse
    i Den kinesiske Folkerepublik og Tjekkoslovakiet samt om afslutning af proceduren
    vedrørende importen af kunstig korund med oprindelse i Spanien og Jugoslavien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2690/84 της Επιτροπής
    της 21ης Σεπτεμβρίου 1984 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές τεχνητού
    κορουνδίου καταγωγής Λαϊκής Δημοκρατίας της
    Κίνας και Τσεχοσλοβακίας και για την περάτωση
    της διαδικασίας, όσον αφορά τις εισαγωγές τεχνητού
    κορουνδίου καταγωγής Ισπανίας και Γιουγκοσλαβίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2690/84 della Commissione del 21 settembre 1984 che
    istituisce un dazio antidumping provvisorio sulle importazioni di corindone artificiale
    originario della Repubblica popolare cinese e della Cecoslovacchia e chiude la
    procedura relativa alle importazioni dello stesso prodotto originario della Spagna
    e della Iugoslavia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2690/84 van de Commissie van 21 september 1984 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van kunstkorundum
    van oorsprong uit de Volksrepubliek China en Tsjechoslowakije alsmede beëindiging
    van de procedure betreffende de invoer van kunstkorundum van oorsprong uit Spanje
    en Joegoslavië
