title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2451/95 of 19 October 1995 initiating an
    investigation concerning the circumvention of anti-dumping measures imposed by
    Regulation (EEC) No 2861/93 on imports of certain magnetic disks (3,5" microdisks)
    originating in Japan, Taiwan and the People's Republic of China by imports of
    certain magnetic disks (3,5" microdisks) originating in Canada, Hong Kong, India,
    Indonesia, Macao, Malaysia, the Philippines, Singapore and Thailand, and making
    these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2451/95 de la Commission, du 19 octobre 1995, ouvrant
    une enquête sur le contournement des mesures antidumping instituées par le règlement
    (CEE) n° 2861/93, du 18 octobre 1993, sur les importations de certains disques
    magnétiques (microdisques de 3,5 pouces) originaires du Japon, de Taiwan et de
    République populaire de Chine par les importations de certains disques magnétiques
    (microdisques de 3,5 pouces) originaires du Canada, de Hong-Kong, d'Inde, d'Indonésie,
    de Macao, de Malaysia, des Philippines, de Singapour et de Thaïlande et rendant
    l'enregistrement de ces importations obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2451/95 der Kommission vom 19. Oktober 1995 zur Einleitung
    einer Untersuchung betreffend die Umgehung der mit Verordnung (EWG) Nr. 2861/93
    eingeführten Antidumpingmaßnahmen auf die Einfuhren bestimmter Magnetplatten
    (3,5"-Mikroplatten) mit Ursprung in Japan, Taiwan und der Volksrepublik China
    durch die Einfuhren bestimmter Magnetplatten (3,5"-Mikroplatten) mit Ursprung
    in Kanada, Hongkong, Indien, Indonesien, Macao, Malaysia, den Philippinen, Singapur
    und Thailand und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2451/95 af 19. oktober 1995 om indledning
    af en undersøgelse vedrørende omgåelse af de antidumpingforanstaltninger, der
    ved forordning (EØF) nr. 2861/93 indførtes på importen af visse magnetplader
    (3,5" disketter) med oprindelse i Japan, Taiwan og Den Kinesiske Folkerepublik,
    ved import af visse magnetplader (3,5" disketter) med oprindelse i Canada, Filippinerne,
    Hongkong, Indien, Indonesien, Macao, Malaysia, Singapore og Thailand og om indførelse
    af registrering af denne import
  type: main
- language: el
  script: Grek
