  content: Reglamento (CE) nº 2451/95 de la Comisión, de 19 de octubre de 1995,
    por el que se inicia una investigación relativa a la elusión de las medidas
    antidumping impuestas por el Reglamento (CEE) nº 2861/93 sobre las importaciones
    de determinados discos magnéticos (microdiscos de 3,5 pulgadas) originarios de
    Japón, Taiwán y la República Popular China, por las importaciones de determinados
    discos magnéticos (microdiscos de 3,5) pulgadas originarios de Canadá, Hong
    Kong, India, Indonesia, Macao, Malasia, Filipinas, Singapur y Tailandia que establece
    el registro de estas importaciones
