    pelo Regulamento (CEE) nº 2861/93, sobre as importações de certos discos magnéticos
    (microdiscos de 3,5 polegadas) originários do Japão, de Taiwan e da República
    Popular da China, mediante a importação de certos discos magnéticos (microdiscos
    de 3,5 polegadas) originários do Canadá, de Hong Kong, da Índia, da Indonésia,
    de Macau, da Malásia, das Filipinas, de Singapura e da Tailândia, e que torna
    obrigatório o registo das referidas importações
  type: main
