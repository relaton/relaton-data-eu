type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 136/78 of 24 January 1978 re-establishing
    the levying of customs duties on other made up textile articles (including dress
    patterns) other than of jute, other than textile bast fibres of heading No 57.03
    or coir, falling within heading No ex 62.05 and originating in South Korea, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 136/78 de la Commission, du 24 janvier 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, y compris les patrons de vêtements, à l'exclusion
    des articles en jute ou autres fibres textiles libériennes du n° 57.03, ou en
    coco, de la position tarifaire EX 62.05, originaires de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 136/78 der Kommission vom 24. Januar 1978 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben,
    einschließlich Schnittmuster zum Herstellen von Bekleidung, ausgenommen Waren
    aus Jute oder anderen textilen Bastfasern der Tarifnummer 57.03, oder Kokosfasern
    der Tarifnummer ex 62.05, mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 136/78 af 24. januar 1978 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer (herunder
    snitmønstre), med undtagelse af varer af jute, andre bastfibre henhørende under
    position 57.03 eller kokosfibre under position ex 62.05, som har oprindelse i
    Sydkorea og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 136/78 della Commissione, del 24 gennaio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, compresi i modelli di vestiti, esclusi i manufatti di iuta e di altre
    fibre tessili liberiane della voce 57.03, o di cocco, della voce doganale ex 62.05,
    originari della Corea del Sud, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 136/78 van de Commissie van 24 januari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere geconfectioneerde
    artikelen van weefsels, patronen van kleding daaronder begrepen, met uitzondering
    van artikelen van jute of andere bastvezels van post 57.03 of van kokosvezels,
    van post ex 62.05, van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2706/77 van de Raad
  type: main
