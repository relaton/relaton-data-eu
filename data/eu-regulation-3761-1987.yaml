title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3761/87 of 30 November 1987 fixing for 1988
    certain measures for the conservation and management of fishery resources, applicable
    to vessels flying the flag of Portugal in waters falling under the sovereignty
    or within the jurisdiction of a Member State, apart from Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3761/87 du Conseil du 30 novembre 1987 fixant, pour
    1988, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon du Portugal dans les eaux relevant de
    la souveraineté ou de la juridiction d' un État membre à l' exception de l'
    Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3761/87 des Rates vom 30. November 1987 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    für Schiffe unter portugiesischer Flagge in den Gewässern unter der Hoheitsgewalt
    oder Gerichtsbarkeit eines Mitgliedstaats mit Ausnahme Spaniens und Portugals
    (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3761/87 af 30. november 1987 om fastsættelse
    for 1988 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    der finder anvendelse på fartøjer, som fører portugisisk flag, i de farvande,
    der henhører under medlemsstaternes højhedsområde eller jurisdiktion, med undtagelse
    af spanske og portugisiske farvande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3761/87 του Συμβουλίου
    της 30ής Νοεμβρίου 1987 για τον καθορισμό, για
    το 1988, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται για
    τα σκάφη με πορτογαλική σημαία στα ύδατα που
    υπάγονται στην κυριαρχία ή τη δικαιοδοσία
    κράτους μέλους, εκτός της Ισπανίας και της
    Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3761/87 del Consiglio del 30 novembre 1987 che fissa,
    per il 1988, alcune misure di conservazione e di gestione delle risorse ittiche
    applicabili alle navi battenti bandiera del Portogallo nelle acque soggette alla
    sovranità o alla giurisdizione di uno Stato membro, esclusi la Spagna e il Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3761/87 van de Raad van 30 november 1987 tot vaststelling,
    voor 1988, van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden die van toepassing zijn op de vlag van Portugal voerende vaartuigen,
    in de wateren die onder de soevereiniteit of de jurisdictie van de Lid-Staten
    vallen, met uitzondering van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3761/87 do Conselho de 30 de Novembro de 1987 que
    fixa, para 1988, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de Portugal nas águas sob
    soberania ou jurisdição de um Estado-membro, com excepção de Espanha e de
    Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3761/87 del Consejo de 30 de noviembre de 1987 por
    el que se fijan, para 1988, determinadas medidas de conservación y de gestión
    de los recursos de pesca aplicables a los buques bajo pabellón de Portugal en
    las aguas sometidas a la soberanía o a la jurisdicción de cualquier Estado miembro,
    excepto España y Portugal
  type: main
