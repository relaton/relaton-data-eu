    přípravku Saccharomyces cerevisiae CNCM I-4407 jako doplňkové látky pro odstavená
    selata, prasnice (neboť má přínos pro sající selata) a dojnice a o změně
    nařízení (ES) č. 2148/2004, (ES) č. 1288/2004 a (ES) č. 1811/2005 (držitel
    povolení S.I. Lesaffre)
  type: main
