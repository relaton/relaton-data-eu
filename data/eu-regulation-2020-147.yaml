    на препарат от Saccharomyces cerevisiae CNCM I-4407 като фуражна
    добавка за отбити прасенца, свине майки (с цел
    ползотворно въздействие върху прасенцата
    сукалчета) и млекодайни крави и за изменение
    на регламенти (ЕО) № 2148/2004, (ЕО) № 1288/2004 и (ЕО)
    № 1811/2005 (притежател на разрешението S.I. Lesaffre)
  type: main
