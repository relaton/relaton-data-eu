title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/147 of 3 February 2020 concerning
    the authorisation of the preparation of Saccharomyces cerevisiae CNCM I-4407 as
    a feed additive for weaned piglets, sows (in order to have a benefit for suckling
    piglets) and dairy cows and amending Regulations (EC) No 2148/2004, (EC) No 1288/2004
    and (EC) No 1811/2005 (holder of authorisation S.I. Lesaffre)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’Exécution (UE) 2020/147 de la Commission du 3 février
    2020 concernant l’autorisation de la préparation de Saccharomyces cerevisiae
    CNCM I-4407 en tant qu’additif dans l’alimentation des porcelets sevrés,
    des truies (en vue d’en faire bénéficier les porcelets non sevrés) et des
    vaches laitières et modifiant les règlements (CE) no 2148/2004, (CE) no 1288/2004
    et (CE) no 1811/2005 (titulaire de l’autorisation: S.I. Lesaffre)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/147 der Kommission vom 3. Februar 2020
    zur Zulassung der Zubereitung aus Saccharomyces cerevisiae CNCM I-4407 als Zusatzstoff
    in Futtermitteln für Absetzferkel, Sauen (im Hinblick auf eine positive Auswirkung
    auf Saugferkel) und Milchkühe sowie zur Änderung der Verordnungen (EG) Nr. 2148/2004,
    (EG) Nr. 1288/2004 und (EG) Nr. 1811/2005 (Zulassungsinhaber S.I. Lesaffre)
  type: main
