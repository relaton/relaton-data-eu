title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1304/80 of 29 May 1980 repealing Regulation
    (EEC) No 400/80 on a standing invitation to tender for butter held by intervention
    agencies and intended for export to certain non-member countries and cancelling
    the sixth individual invitation to tender
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1304/80 de la Commission, du 29 mai 1980, abrogeant
    le règlement (CEE) n° 400/80 relatif à une adjudication permanente de beurre
    détenu par les organismes d' intervention et destiné à l' exportation vers
    certains pays tiers et annulant la sixième adjudication particulière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1304/80 der Kommission vom 29. Mai 1980 zur Aufhebung
    der Verordnung (EWG) Nr. 400/80 über eine Dauerausschreibung von Butter aus Beständen
    der Interventionsstellen für die Ausfuhr nach bestimmten Drittländern und zur
    Aufhebung der sechsten Einzelausschreibung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1304/80 af 29. maj 1980 om ophævelse
    af forordning (EØF) nr. 400/80 om en løbende licitation vedrørende smør, som
    interventionsorganerne ligger inde med, og som er bestemt til udførsel til visse
    tredjelande, og om annulering af den sjette særlige licitation
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1304/80 della Commissione, del 29 maggio 1980, che
    abroga il regolamento (CEE) n. 400/80 relativo ad una gara permanente per la vendita
    di burro detenuto dagli organismi d' intervento e destinato all' esportazione
    verso taluni paesi terzi, e recante annullamento della sesta gara particolare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1304/80 van de Commissie van 29 mei 1980 tot intrekking
    van Verordening (EEG) nr. 400/80 inzake een permanente openbare inschrijving voor
    uitvoer naar bepaalde derde landen van boter in het bezit van de interventiebureaus
    en tot annulering van de zesde bijzondere inschrijving
  type: main
