title:
- language: en
  script: Latn
  content: '2001/841/EC: Commission Decision of 27 November 2001 amending Decision
    93/452/EEC authorising the Member States to provide for derogations from certain
    provisions of Council Directive 2000/29/EC, in respect of plants of Chamaecyparis
    Spach, Juniperus L. and Pinus L., respectively, originating in Japan (notified
    under document number C(2001) 3760)'
  type: main
- language: fr
  script: Latn
  content: '2001/841/CE: Décision de la Commission du 27 novembre 2001 modifiant
    la décision 93/452/CEE autorisant les États membres à prévoir des dérogations
    à certaines dispositions de la directive 2000/29/CE du Conseil pour les végétaux
    de Chamaecyparis Spach, de Juniperus L. et de Pinus L., originaires du Japon [notifiée
    sous le numéro C(2001) 3760]'
  type: main
- language: de
