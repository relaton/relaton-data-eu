title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 691/81 of 18 March 1981 reintroducing the
    levying of customs duties applicable to other goat and kid skin leather falling
    within subheading 41.04 B II, originating in India and benefiting from the tariff
    preferences provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 691/81 de la Commission, du 18 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins non dénommées, de la sous-position 41.04 B II du tarif douanier commun,
    originaires de l' Inde, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 691/81 der Kommission vom 18. März 1981 zur Wiedereinführung
    der Erhebung der Zölle für bestimmtes Ziegen- und Zickelleder der Tarifstelle
    41.04 B II mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3322/80
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 691/81 af 18. marts 1981 om genindførelse
    af opkrævning af told for andet læder af gede- og gedeskind, henhørende under
    pos. 41.04 B II, med oprindelse i Indien, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
