    Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2031/93 della Commissione, del 26 luglio 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1993 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi intermedi conclusi
    tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria e la Repubblica
    federativa Ceca e Slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2031/93 van de Commissie van 26 juli 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sectoren eieren en pluimvee, die in juli 1993 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met de Republiek Polen, de Republiek Hongarije
    en de Tsjechische en Slowaakse Federatieve Republiek
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2031/93 da Comissão, de 26 de Julho de 1993, que
