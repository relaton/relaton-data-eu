    e a República Federativa Checa e Eslovaca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2031/93 de la Comisión, de 26 de julio de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos de los sectores de la carne de aves de corral
    y de los huevos presentadas en el mes de julio de 1993, al amparo del régimen
    previsto en los Acuerdos interinos celebrados entre la Comunidad y la República
    de Polonia, la República de Hungría y la República Federativa Checa y Eslovaca
