title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1845/90 of 29 June 1990 fixing for the 1990/91
    marketing year the components intended to ensure protection of the processing
    industry in the cereals and rice sector in trade between Spain and the Community
    of Ten
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1845/90 de la Commission du 29 juin 1990 déterminant
    pour la campagne 1990/1991 les éléments destinés à assurer, dans le secteur
    des céréales et du riz, la protection de l'industrie de transformation applicable
    aux échanges entre l'Espagne et la Communauté à Dix
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1845/90 DER KOMMISSION vom 29. Juni 1990 zur Festsetzung
    der Bestandteile zum Schutz der Verarbeitungsindustrie im Getreide- und Reissektor
    beim Handel zwischen Spanien und der Zehnergemeinschaft fuer das Wirtschaftsjahr
    1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1845/90 af 29. juni 1990 om fastsættelse
    af de elementer for produktionsåret 1990/91, der anvendes i forbindelse med samhandelen
    mellem Spanien og De Ti, og som i korn- og rissektoren skal beskytte forarbejdningsindustrien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1845/90 της Επιτροπής
    της 29ης Ιουνίου 1990 που καθορίζει, για την περίοδο
    1990/91, τα στοιχεία που προορίζονται να εξασφαλίσουν
    στον τομέα των σιτηρών και του ρυζιού την εφαρμοζόμενη
    στις συναλλαγές μεταξύ της Ισπανίας και της
    Κοινότητας των Δέκα προστασία της βιομηχανίας
    μεταποίησης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1845/90 DELLA COMMISSIONE del 29 giugno 1990 che stabilisce,
    per la campagna 1990/1991, gli elementi destinati a garantire, nel settore dei
    cereali e del riso, la protezione dell'industria di trasformazione applicabile
    negli scambi tra la Spagna e la Comunità a dieci
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1845/90 VAN DE COMMISSIE van 29 juni 1990 tot vaststelling
    van de voor het verkoopseizoen 1990/1991 geldende elementen ter bescherming van
    de verwerkende industrie in de sector granen en rijst in het handelsverkeer tussen
    Spanje en de Gemeenschap van de Tien
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 1845/90 DA COMISSAO de 29 de Junho de 1990 que determina,
    para a campanha de 1990/1991, os elementos destinados a assegurar, no sector dos
    cereais e do arroz, a protecçao da industria transformadora aplicavel às trocas
    comerciais entre a Espanha e a Comunidade dos Dez
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1845/90 DE LA COMISION de 29 de junio de 1990 por el
    que se determinan los elementos destinados a asegurar la proteccion de la industria
    de transformacion aplicable a los intercambios entre Espana y la Comunidad de
    los Diez, en el sector de los cereales y del arroz para la campana 1990/91
