type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 680/76 of 26 March 1976 re-establishing
    the levying of customs duties on men's and boys' under garments, including collars,
    shirt fronts and cuffs, of cotton fabric falling within heading No ex 61.03, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 680/76 de la Commission, du 26 mars 1976, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour hommes et garçonnets, etc., en tissus de coton,
    de la position tarifaire EX 61.03, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 680/76 der Kommission vom 26. März 1976 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Männer
    und Knaben, auch Kragen, Vorhemden und Manschetten, aus Baumwolle, der Tarifnummer
    ex 61.03, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3002/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 680/76 af 26. marts 1976 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til mænd og drenge
    (herunder flipper, skortebryster og manchetter), varer af bomuld under position
    ex 61.03, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 680/76 della Commissione, del 26 marzo 1976, che ripristina
    la riscossione dei dazi doganali applicabili alle sottovesti (biancheria da dosso)
    per uomo e per ragazzo, ecc., in tessuti di cotone, della voce doganale n. ex
    61.03, originarie dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3002/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 680/76 van de Commissie van 26 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op herenonderkleding
    en jongensonderkleding, enz., van weefsels van katoen, van tariefpost ex 61.03,
    van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3002/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
