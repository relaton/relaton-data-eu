title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/370 of 23 January 2024 supplementing
    Directive (EU) 2020/2184 of the European Parliament and of the Council by laying
    down conformity assessment procedures for products that come into contact with
    water intended for human consumption and the rules for the designation of conformity
    assessment bodies involved in those procedures
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/370 de la Commission du 23 janvier 2024
    complétant la directive (UE) 2020/2184 du Parlement européen et du Conseil en
    établissant des procédures d’évaluation de la conformité pour les produits
    entrant en contact avec l’eau destinée à la consommation humaine, ainsi que
    des règles relatives à la désignation des organismes d’évaluation de la
    conformité qui participent à ces procédures
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/370 der Kommission vom 23. Januar 2024
    zur Ergänzung der Richtlinie (EU) 2020/2184 des Europäischen Parlaments und
    des Rates durch Festlegung von Konformitätsbewertungsverfahren für Produkte,
    die mit Wasser für den menschlichen Gebrauch in Kontakt kommen, sowie von Vorschriften
    für die Benennung der an diesen Verfahren beteiligten Konformitätsbewertungsstellen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/370 на Комисията
