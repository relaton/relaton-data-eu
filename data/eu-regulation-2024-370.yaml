    (ЕС) 2020/2184 на Европейския парламент и на Съвета
    чрез установяване на процедури за оценяване
    на съответствието на продукти, които влизат
    в контакт с вода, предназначена за консумация
    от човека, и на правила за определяне на органите
    за оценяване на съответствието, участващи
    в тези процедури
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/370 ze dne 23. ledna
