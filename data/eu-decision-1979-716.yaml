title:
- language: en
  script: Latn
  content: '79/716/EEC: Commission Decision of 27 July 1979 authorizing the Kingdom
    of Denmark not to apply Community treatment to tents, falling within heading No
    ex 62.04 of the Common Customs Tariff (NIMEXE codes 62.04-23, 73) (category 91),
    originating in South Korea and in free circulation in the other Member States
    (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/716/CEE: Décision de la Commission, du 27 juillet 1979, autorisant
    le Royaume du Danemark à exclure du traitement communautaire les tentes de la
    position ex 62.04 du tarif douanier commun (codes Nimexe : 62.04-23, 73) (catégorie
    91), originaires de la Corée du Sud et mis en libre pratique dans les autres
    États membres (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/716/EWG: Entscheidung der Kommission vom 27. Juli 1979, mit der das
    Königreich Dänemark ermächtigt wird, aus Südkorea stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Zelte der Tarifnummer ex 62.04 des
    Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 62.04-23, 73) (Katagorie 91) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/716/EØF: Kommissionens beslutning af 27. juli 1979 om bemyndigelse
    af kongeriget Danmark til fra fællesskabsbehandling at undtage telte, som henhører
    under pos. ex 62.04 i den fælles toldtarif (NIMEXE- nummer 62.04-23 ; 73) kategori
    91, har oprindelse i Sydkorea og frit kan omsættes i de øvrige medlemsstater
    (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/716/CEE: Decisione della Commissione, del 27 luglio 1979, che autorizza
    il Regno di Danimarca ad escludere dal trattamento comunitario le tende della
    voce ex 62.04 della tariffa doganale comune (codici Nimexe: 62.04-23, 73), categoria
    91, originarie della Corea del Sud e messe in libera pratica negli Stati membri
    (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/716/EEG: Beschikking van de Commissie van 27 juli 1979 waarbij het
    Koninkrijk Denemarken wordt gemachtigd tenten van post ex 62.04 van het gemeenschappelijk
    douanetarief (NIMEXE-code 62.04-23, 73) (categorie 91), van oorsprong uit Zuid-Korea
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Deense taal is authentiek)'
  type: main
