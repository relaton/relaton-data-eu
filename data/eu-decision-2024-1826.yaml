    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu DP23211, sastāv
    vai ir ražoti no tās (izziņots ar dokumenta numuru C(2024) 4491)
  type: main
- language: lt
  script: Latn
  content: 2024 m. liepos 2 d. Komisijos įgyvendinimo sprendimas (ES) 2024/1826,
