    DP23211, od njega se sastoje ili su od njega proizvedeni, u skladu s Uredbom (EZ)
    br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2024) 4491)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1826 végrehajtási határozata (2024. július 2.)
    a géntechnológiával módosított DP23211 kukoricát tartalmazó, abból álló
    vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2024) 4491. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2024/1826 della Commissione, del 2 luglio
    2024, che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato DP23211 in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2024) 4491]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2024/1826 (2024. gada 2. jūlijs),
