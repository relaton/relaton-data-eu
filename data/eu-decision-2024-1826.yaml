title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2024/1826 of 2 July 2024 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize DP23211 pursuant to Regulation (EC) No 1829/2003 of
    the European Parliament and of the Council (notified under document C(2024) 4491)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2024/1826 de la Commission du 2 juillet 2024
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié DP23211, consistant en ce maïs ou produits à partir de celui-ci, conformément
    au règlement (CE) no 1829/2003 du Parlement européen et du Conseil [notifiée
    sous le numéro C(2024) 4491]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2024/1826 der Kommission vom 2. Juli 2024
    über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais DP23211 enthalten, aus ihm bestehen oder aus ihm hergestellt werden, gemäß
    der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen C(2024) 4491)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2024/1826 на Комисията
    от 2 юли 2024 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица DP23211, в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер С(2024) 4491)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2024/1826 ze dne 2. července 2024
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    DP23211, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2024)
    4491)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2024/1826 af 2. juli 2024
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret DP23211-majs i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2024) 4491)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2024/1826 της Επιτροπής,
    της 2ας Ιουλίου 2024, για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    DP23211 σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003
    του Ευρωπαϊκού Κοινοβουλίου και του Συμβουλίου
    [κοινοποιηθείσα υπό τον αριθμό C(2024) 4491]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2024/1826, 2. juuli 2024, millega lubatakse
