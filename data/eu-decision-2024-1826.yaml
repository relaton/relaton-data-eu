    või sellest toodetud tooteid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2024) 4491 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2024/1826, annettu 2 päivänä
