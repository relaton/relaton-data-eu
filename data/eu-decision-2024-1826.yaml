    DP23211, kurie iš jų sudaryti ar pagaminti (pranešta dokumentu C(2024) 4491)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1826 tat-2
