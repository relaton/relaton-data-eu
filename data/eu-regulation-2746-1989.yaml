    originari dell'' India e quelli originari del Pakistan beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 4257/88 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2746/89 VAN DE COMMISSIE van 12 september 1989 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op handschoenen
    en wanten van leder of van kunstleder van GN-code 4203 29 10, van oorsprong uit
    India en van oorsprong uit Pakistan, waarvoor de in Verordening (EEG) nr. 4257/88
    van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
