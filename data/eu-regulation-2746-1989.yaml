title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2746/89 of 12 September 1989 re-establishing
    the levying of customs duties on gloves, mittens and mitts of leather or composition
    leather falling within CN code 4203 29 10 originating in India and those originating
    in Pakistan to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2746/89 de la Commission du 12 septembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux gants et
    moufles en cuir naturel ou reconstitué, du code NC 4203 29 10, originaires de
    l'Inde, et à ceux originaires du Pakistan, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2746/89 DER KOMMISSION vom 12. September 1989 zur
    Wiedereinführung der Erhebung der Zölle für Handschuhe und Fausthandschuhe
    aus Leder oder rekonstituiertem Leder des KN-Code 4203 29 10 mit Ursprung in Indien
    und mit Ursprung in Pakistan, denen die in der Verordnung (EWG) Nr. 4257/88 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2746/89 af 12. september 1989 om genindførelse
    af opkrævning af told for handsker og vanter af læder eller kunstlæder henhørende
    under KN-kode 4203 29 10 og med oprindelse i Indien og i Pakistan, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2746/89 της Επιτροπής
    της 12ης Σεπτεμβρίου 1989 περί αποκαταστάσεως
    της εφαρμογής των δασμών για γάντια και γάντια
    χωρίς υποδιαίρεση δακτύλων, από δέρμα φυσικό
    ή ανασχηματισμένο, του κωδικού ΣΟ 4203 29 10, καταγωγής
    Ινδίας και Πακιστάν, δικαιούχων των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 4257/88 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2746/89 DELLA COMMISSIONE del 12 settembre 1989 che
