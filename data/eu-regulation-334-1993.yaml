title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 334/93 of 15 February 1993 laying down detailed
    implementing rules for the use of land set aside for the provision of materials
    for the manufacture within the Community of products not primarily intended for
    human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 334/93 de la Commission, du 15 février 1993, portant
    modalités d'application relatives à l'utilisation des terres mises en jachère
    pour la production de matières premières servant à la fabrication, dans la
    Communauté, de produits destinés à des fins principales autres que la consommation
    humaine ou animale
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 334/93 der Kommission vom 15. Februar 1993 mit detaillierten
    Durchführungsbestimmungen für die Nutzung stillgelegter Flächen zur Erzeugung
    von Ausgangserzeugnissen, die in der Gemeinschaft zu nicht in erster Linie für
    Lebens- oder Futtermittelzwecke bestimmten Erzeugnissen verarbeitet werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 334/93 af 15. februar 1993 om gennemførelsesbestemmelser
    for anvendelse af udtagne landbrugsarealer med henblik på tilvejebringelse af
    materialer til fremstilling i Fællesskabet af produkter, som ikke primært er
    bestemt til konsum eller foderbrug
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 334/93 της Επιτροπής
    της 15ης Φεβρουαρίου 1993 περί λεπτομερών κανόνων
    σχετικά με τη χρησιμοποίηση των γαιών που βρίσκονται
    υπό καθεστώς προσωρινής παύσης καλλιέργειας
    για την παραγωγή πρώτων υλών που χρησιμεύουν
    κατά την παρασκευή, στην Κοινότητα, προϊόντων
    προοριζόμενων καταρχήν για άλλους σκοπούς
    εκτός της κατανάλωσης από τον άνθρωπο ή τα
    ζώα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 334/93, annettu 15 päivänä helmikuuta 1993,
    yksityiskohtaisista säännöistä kesannointimaan käytön soveltamisesta yhteisössä
    valmistettavien tuotteiden raaka-aineiden tuottamiseen ensisijaisesti muihin tarkoituksiin
    kuin elintarvikkeiksi tai eläinten ravinnoksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 334/93 della Commissione, del 15 febbraio 1993, recante
    modalità d'applicazione relative all'uso di superfici ritirate dalla produzione
    allo scopo di ottenere materiali per la fabbricazione, nella Comunità, di prodotti
    non destinati in primo luogo al consumo umano o animale
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 334/93 van de Commissie van 15 februari 1993 tot
    vaststelling van uitvoeringsbepalingen betreffende het gebruik van uit produktie
    genomen grond voor de produktie van grondstoffen voor de vervaardiging, in de
    Gemeenschap, van niet specifiek voor voeding of vervoedering bestemde produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 334/93 da Comissão, de 15 de Fevereiro de 1993,
    que estabelece normas de execução para a utilização de terras retiradas para
    a produção de matérias destinadas ao fabrico, na Comunidade, de produtos não
    destinados primariamente ao consumo humano ou animal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 334/93 de la Comisión, de 15 de febrero de 1993,
    por el que se establecen disposiciones de aplicación relativas a la utilización
    de las tierras retiradas de la producción, con vistas a la obtención de materias
    para la fabricación en la Comunidad de productos que no se destinen principalmente
    al consumo humano o animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 334/93 av den 15 februari 1993 om genomförandebestämmelser
