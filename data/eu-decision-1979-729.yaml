id: EUDecision1979729
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '79/729/EEC: Commission Decision of 31 July 1979 authorizing the French
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain or china, of
    earthenware, or other kinds of pottery, falling within heading No 69.11 and subheadings
    69.12 C and D of the Common Customs Tariff, originating in the People''s Republic
    of China and in free circulation in the other Member States (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/729/CEE: Décision de la Commission, du 31 juillet 1979, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine, en faïence ou en autres
    matières céramiques, de la position 69.11 et des sous-positions 69.12 C et 69.12
    D du tarif douanier commun, originaires de la République populaire de Chine et
    mis en libre pratique dans les autres États membres (Le texte en langue française
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/729/EWG: Entscheidung der Kommission vom 31. Juli 1979, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China stammendes
    und in den übrigen Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts-
    und Toilettengegenstände, aus Porzellan, aus Steingut oder aus anderen keramischen
    Stoffen, der Tarifnummern 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/729/EØF: Kommissionens beslutning af 31. juli 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler, af porcelæn, af fajance, af andet keramisk
    materiale, som henhører under pos. 69.11 og 69.12 C og D i den fælles toldtarif,
    har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige
    medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/729/CEE: Decisione della Commissione, del 31 luglio 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il vasellame e
    gli oggetti di uso domestico o da toletta, di percellana, di terracotta fine o
    di altre materie ceramiche, della voce 69.11 e delle sottovoci 69.12 C e D della
    tariffa doganale comune, originari della Repubblica popolare cinese e messi in
    libera pratica negli altri Stati membri (Il testo in lingua francese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/729/EEG: Beschikking van de Commissie van 31 juli 1979 waarbij de Franse
    Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen,
    van porselein, van faience of van andere keramische stoffen, van de posten 69.11
    en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
