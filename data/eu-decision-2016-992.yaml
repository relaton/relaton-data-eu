    ja lõpetamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2016/992, annettu 16 päivänä
    kesäkuuta 2016, LIS-kalastuksen torjumista koskevaan yhteistyöhön osallistumattomia
    kolmansia maita koskevan luettelon laatimisesta laittoman, ilmoittamattoman ja
    sääntelemättömän kalastuksen ehkäisemistä, estämistä ja poistamista koskevasta
    yhteisön järjestelmästä annetun asetuksen (EY) N:o 1005/2008 nojalla annetun
    täytäntöönpanopäätöksen 2014/170/EU muuttamisesta Sri Lankan osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Vijeća (EU) 2016/992 od 16. lipnja 2016. o izmjeni Provedbene
    odluke 2014/170/EU o uspostavljanju popisa nekooperativnih trećih zemalja u borbi
    protiv ribolova NNN na temelju Uredbe (EZ) br. 1005/2008 o uspostavi sustava Zajednice
    za sprečavanje, suzbijanje i zaustavljanje nezakonitog, neprijavljenog i nereguliranog
    ribolova u pogledu Šri Lanke
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2016/992 végrehajtási határozata (2016. június 16.)
    a jogellenes, nem bejelentett és szabályozatlan halászat megelőzésére, megakadályozására
    és felszámolására irányuló közösségi rendszer létrehozásáról szóló
    1005/2008/EK rendelet értelmében a jogellenes halászat felszámolásában nem
    együttműködő harmadik országok listájának összeállításáról szóló
    2014/170/EU végrehajtási határozat Srí Lanka tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2016/992 del Consiglio, del 16 giugno 2016,
    che modifica la decisione di esecuzione 2014/170/UE che stabilisce un elenco di
    paesi terzi non cooperanti nella lotta alla pesca INN ai sensi del regolamento
    (CE) n. 1005/2008 che istituisce un regime comunitario per prevenire, scoraggiare
    ed eliminare la pesca illegale, non dichiarata e non regolamentata per quanto
    riguarda lo Sri Lanka
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas lēmums (ES) 2016/992 (2016. gada 16. jūnijs), ar
    kuru groza Īstenošanas lēmumu 2014/170/ES, ar ko izveido NNN zvejas apkarošanā
    nesadarbīgu trešo valstu sarakstu saskaņā ar Regulu (EK) Nr. 1005/2008, ar
    ko izveido Kopienas sistēmu, lai aizkavētu, novērstu un izskaustu nelegālu,
    nereģistrētu un neregulētu zveju, attiecībā uz Šrilanku
  type: main
- language: lt
  script: Latn
  content: 2016 m. birželio 16 d. Tarybos įgyvendinimo sprendimas (ES) 2016/992,
    kuriuo iš dalies keičiamas Įgyvendinimo sprendimas 2014/170/ES, kuriuo sudaromas
    trečiųjų šalių, nebendradarbiaujančių kovojant su NNN žvejyba, sąrašas
    pagal Reglamentą (EB) Nr. 1005/2008, nustatantį Bendrijos sistemą, kuria siekiama
    užkirsti kelią neteisėtai, nedeklaruojamai ir nereglamentuojamai žvejybai,
    atgrasyti nuo jos ir ją panaikinti
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kunsill (UE) 2016/992 tas-16 ta' Ġunju
    2016 li temenda d-Deċiżjoni ta' Implimentazzjoni 2014/170/UE li tistabbilixxi
    lista ta' pajjiżi terzi li ma jikkooperawx fil-ġlieda kontra s-sajd IUU skont
    ir-Regolament (KE) Nru 1005/2008 li jistabbilixxi sistema Komunitarja sabiex tipprevjeni,
    tiskoraġġixxi u telimina sajd illegali, mhux irrappurtat u mhux irregolat fir-rigward
    ta' Sri Lanka
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2016/992 van de Raad van 16 juni 2016 tot wijziging
    van Uitvoeringsbesluit 2014/170/EU tot vaststelling van een lijst van derde landen
    die niet meewerken bij de bestrijding van IOO-visserij op grond van Verordening
    (EG) nr. 1005/2008 houdende de totstandbrenging van een communautair systeem om
    illegale, ongemelde en ongereglementeerde visserij te voorkomen, tegen te gaan
    en te beëindigen, met betrekking tot Sri Lanka
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2016/992 z dnia 16 czerwca 2016 r. zmieniająca
    w odniesieniu do Sri Lanki decyzję wykonawczą 2014/170/UE ustanawiającą wykaz
    niewspółpracujących państw trzecich w zakresie zwalczania połowów NNN na
    podstawie rozporządzenia (WE) nr 1005/2008 ustanawiającego wspólnotowy system
    zapobiegania nielegalnym, nieraportowanym i nieuregulowanym połowom oraz ich
    powstrzymywania i eliminowania
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2016/992 do Conselho, de 16 de junho de 2016,
    que altera a Decisão de Execução 2014/170/UE que estabelece a lista dos países
    terceiros não cooperantes no âmbito da luta contra a pesca INN, em aplicação
    do Regulamento (CE) n.° 1005/2008 que estabelece um regime comunitário para
    prevenir, impedir e eliminar a pesca ilegal, não declarada e não regulamentada
    no que respeita ao Sri Lanca
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2016/992 a Consiliului din 16 iunie
    2016 de modificare, în ceea ce privește Sri Lanka, a Deciziei de punere în
    aplicare 2014/170/UE de stabilire a unei liste a țărilor terțe necooperante
    în ceea ce privește combaterea activităților de pescuit INN în temeiul Regulamentului
    (CE) nr. 1005/2008 de instituire a unui sistem comunitar pentru prevenirea, descurajarea
    și eliminarea pescuitului ilegal, nedeclarat și nereglementat
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2016/992 zo 16. júna 2016, ktorým
    sa mení vykonávacie rozhodnutie 2014/170/EÚ, ktorým sa vytvára zoznam nespolupracujúcich
    tretích krajín v boji proti nezákonnému, nenahlásenému a neregulovanému
    rybolovu podľa nariadenia (ES) č. 1005/2008, ktorým sa ustanovuje systém Spoločenstva
    na zabraňovanie nezákonnému, nenahlásenému a neregulovanému rybolovu, na
    odrádzanie od neho a jeho odstránenie, pokiaľ ide o Srí Lanku
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2016/992 z dne 16. junija 2016 o spremembi Izvedbenega
    sklepa 2014/170/EU o pripravi seznama nesodelujočih tretjih držav pri boju proti
    nezakonitemu, neprijavljenemu in nereguliranemu ribolovu v skladu z Uredbo (ES)
    št. 1005/2008 o vzpostavitvi sistema Skupnosti za preprečevanje nezakonitega,
    neprijavljenega in nereguliranega ribolova, za odvračanje od njega ter za njegovo
    odpravljanje kar zadeva Šrilanko
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2016/992 del Consejo, de 16 de junio de 2016,
    que modifica la Decisión de Ejecución 2014/170/UE por la que se establece la
    lista de terceros países no cooperantes en la lucha contra la pesca INDNR de
    conformidad con el Reglamento (CE) n.° 1005/2008 por el que se establece un sistema
    comunitario para prevenir, desalentar y eliminar la pesca ilegal, no declarada
    y no reglamentada en relación con Sri Lanka
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2016/992 av den 16 juni 2016 om ändring
    av genomförandebeslut 2014/170/EU om upprättande av en förteckning över icke-samarbetande
    tredjeländer när det gäller bekämpning av IUU-fiske enligt förordning (EG)
    nr 1005/2008 om upprättande av ett gemenskapssystem för att förebygga, motverka
    och undanröja olagligt, orapporterat och oreglerat fiske med avseende på Sri
    Lanka
