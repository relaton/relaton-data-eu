title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2016/992 of 16 June 2016 amending Implementing
    Decision 2014/170/EU establishing a list of non-cooperating third countries in
    fighting IUU fishing pursuant to Regulation (EC) No 1005/2008 establishing a Community
    system to prevent, deter and eliminate illegal, unreported and unregulated fishing
    as regards Sri Lanka
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/992 du Conseil du 16 juin 2016 modifiant
    la décision d'exécution 2014/170/UE établissant une liste des pays tiers non
    coopérants dans le cadre de la lutte contre la pêche INN en application du règlement
    (CE) n° 1005/2008 établissant un système communautaire destiné à prévenir,
    à décourager et à éradiquer la pêche illicite, non déclarée et non réglementée
    concernant Sri Lanka
  type: main
- language: de
  script: Latn
  content: 'Durchführungsbeschluss (EU) 2016/992 des Rates vom 16: Juni 2016 zur
    Änderung des Durchführungsbeschlusses 2014/170/EU zur Aufstellung einer Liste
    nichtkooperierender Drittländer bei der Bekämpfung der IUU-Fischerei gemäß
    der Verordnung (EG) Nr. 1005/2008 über ein Gemeinschaftssystem zur Verhinderung,
    Bekämpfung und Unterbindung der illegalen, nicht gemeldeten und unregulierten
    Fischerei in Bezug auf Sri Lanka'
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2016/992 на Съвета
    от 16 юни 2016 година за изменение на Решение за
    изпълнение 2014/170/ЕС на списъка на несътрудничещи
    трети държави в борбата с ННН риболов съгласно
    Регламент (ЕО) № 1005/2008 за създаване на система
    на Общността за предотвратяване, възпиране
    и премахване на незаконния, недеклариран и
    нерегулиран риболов по отношение на Шри Ланка
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2016/992 ze dne 16. června 2016, kterým
    se mění prováděcí rozhodnutí 2014/170/EU, kterým se zavádí seznam třetích
    zemí nespolupracujících v boji proti nezákonnému, nehlášenému a neregulovanému
    rybolovu podle nařízení (ES) č. 1005/2008, kterým se zavádí systém Společenství
    pro předcházení, potírání a odstranění nezákonného, nehlášeného a
    neregulovaného rybolovu, pokud jde o Šrí Lanku
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2016/992 af 16. juni 2016 om ændring
    af gennemførelsesafgørelse 2014/170/EU om en liste over ikke-samarbejdende tredjelande
    for så vidt angår bekæmpelse af IUU-fiskeri i henhold til forordning (EF) nr.
    1005/2008 om en EF-ordning, der skal forebygge, afværge og standse ulovligt,
    urapporteret og ureguleret fiskeri, for så vidt angår Sri Lanka
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2016/992 του Συμβουλίου,
