    αλιείας όσον αφορά τη Σρι Λάνκα
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2016/992, 16. juuni 2016, millega muudetakse
    rakendusotsust 2014/170/EL, millega kehtestatakse ebaseadusliku, teatamata ja
    reguleerimata kalapüügi vastases võitluses koostööd mittetegevate kolmandate
    riikide nimekiri vastavalt määrusele (EÜ) nr 1005/2008, millega luuakse ühenduse
