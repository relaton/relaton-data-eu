    του καταλόγου μη συνεργαζόμενων τρίτων χωρών
    στην καταπολέμηση της ΠΛΑ αλιείας σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1005/2008 περί δημιουργίας
    κοινοτικού συστήματος πρόληψης, αποτροπής
