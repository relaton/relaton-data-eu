id: EURegulation9751979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 975/79 of 16 May 1979 re-establishing the
    levying of customs duties on woven fabrics of sheep' s or lambs' wool or of fine
    animal hair, falling within heading No 53.11 and originating in Uruguay, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3157/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 975/79 de la Commission, du 16 mai 1979, portant rétablissement
    de la perception des droits de douane applicables aux tissus de laine ou de poils
    fins, de la position 53.11 du tarif douanier commun, originaires de l' Uruguay,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 975/79 der Kommission vom 16. Mai 1979 über die Wiedereinführung
    des Zollsatzes für Gewebe aus Wolle oder feinen Tierhaaren der Tarifnummer 53.11,
    mit Ursprung in Uruguay, dem die in der Verordnung (EWG) Nr. 3157/78 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 975/79 af 16. maj 1979 om genindførelse
    af opkrævning af toldafgiter for vævet stof af uld eller fine dyrehår, henhørende
    under pos. 53.11 i den fælles toldtarif, som har oprindelse i Uruguay og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 975/79 della Commissione, del 16 maggio 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di lana o di
    peli fini, della voce 53.11 della tariffa doganale comune, originari dell' Uruguay
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 975/79 van de Commissie van 16 mei 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van wol, of van fijn haar, van post 53.11, van oorsprong uit Uruguay, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3157/78
    van de Raad
  type: main
