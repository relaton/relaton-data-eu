- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/453 of 2 March 2023 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2017/141
    on imports of certain stainless steel tube and pipe buttwelding fittings, whether
    or not finished, originating in the People’s Republic of China to imports of
    certain stainless steel tube and pipe butt-welding fittings, whether or not finished,
    consigned from Malaysia, whether declared as originating in Malaysia or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/453 de la Commission du 2 mars 2023
    portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) 2017/141 sur les importations de certains accessoires de tuyauterie
    en aciers inoxydables à souder bout à bout, finis ou non, originaires de la
    République populaire de Chine aux importations de certains accessoires de tuyauterie
    en aciers inoxydables à souder bout à bout, finis ou non, expédiés de Malaisie,
    qu’ils aient ou non été déclarés originaires de ce pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/453 der Kommission vom 2. März 2023
    zur Ausweitung des mit der Durchführungsverordnung (EU) 2017/141 eingeführten
    endgültigen Antidumpingzolls auf die Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke
    und Rohrverbindungsstücke aus nicht rostendem Stahl zum Stumpfschweißen, auch
    als Fertigwaren, mit Ursprung in der Volksrepublik China auf aus Malaysia versandte
    Einfuhren bestimmter Rohrformstücke, Rohrverschlussstücke und Rohrverbindungsstücke
    aus nicht rostendem Stahl zum Stumpfschweißen, auch als Fertigwaren, ob als Ursprungserzeugnisse
    Malaysias angemeldet oder nicht
  type: main
