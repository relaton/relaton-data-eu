    and amending Annex I to Council Regulation (EEC) No 2658/87 on the tariff and
    statistical nomenclature and on the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2242/91 DE LA COMMISSION du 26 juillet 1991 modifiant
