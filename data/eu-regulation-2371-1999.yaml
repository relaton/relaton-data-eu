    και για τον καθορισμό των ελάχιστων τιμών κατά
    την εισαγωγή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2371/1999, annettu 8 päivänä marraskuuta 1999,
    Bulgariasta, Unkarista, Puolasta, Romaniasta, Slovakiasta ja Tsekin tasavallasta
    peräisin olevien tiettyjen marjojen vähimmäistuontihintaa koskevan menettelyn
    yksityiskohtaisista soveltamissäännöistä annetun asetuksen (EY) N:o 1599/97
    ja tiettyjen Virosta, Latviasta ja Liettuasta peräisin olevien marjojen vähimmäistuontihintajärjestelmän
    soveltamista koskevista yksityiskohtaisista säännöistä ja vähimmäistuontihinnan
    vahvistamisesta annetun asetuksen (EY) N:o 2479/96 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2371/1999 della Commissione, dell'8 novembre 1999,
    che modifica il regolamento (CE) n. 1599/97 recante modalità di applicazione
    del regime dei prezzi minimi all'importazione per taluni frutti rossi originari
    della Bulgaria, dell'Ungheria, della Polonia, della Romania, della Repubblica
    slovacca e della Repubblica ceca e il regolamento (CE) n. 2479/96 recante modalità
    di applicazione del regime dei prezzi minimi all'importazione per taluni frutti
    rossi originari dell'Estonia, della Lettonia e della Lituania e che fissa i prezzi
    minimi all'importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2371/1999 van de Commissie van 8 november 1999 tot
    wijziging van Verordening (EG) nr. 1599/97 houdende uitvoeringsbepalingen van
    de regeling inzake minimumprijzen bij invoer van bepaalde soorten klein fruit
    van oorsprong uit Bulgarije, Hongarije, Polen, Roemenië, Slowakije en Tsjechië,
    en van Verordening (EG) nr. 2479/96 houdende uitvoeringsbepalingen van de regeling
    inzake minimumprijzen bij invoer van bepaalde soorten rood fruit van oorsprong
    uit Estland, Letland en Litouwen en houdende vaststelling van de minimumprijzen
    bij invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2371/1999 da Comissão, de 8 de Novembro de 1999,
    que altera os Regulamentos (CE) n° 1599/97 que estabelece normas de execução
    do regime do preço mínimo de importação de determinados frutos vermelhos originários
    da Bulgária, da Hungria, da Polónia, da Roménia, da Eslováquia e da República
    Checa e (CE) n° 2479/96 que estabelece normas de execução do regime de preços
    mínimos de importação para determinados frutos vermelhos originários da Estónia,
    da Letónia e da Lituânia e que fixa os preços mínimos de importação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2371/1999 de la Comisión, de 8 de noviembre de 1999,
    que modifica los Reglamentos (CE) nº 1599/97 por el que se establecen las disposiciones
    de aplicación del régimen de precios mínimos de importación de determinados
    frutos rojos originarios de Bulgaria, Hungría, Polonia, Rumanía, Eslovaquia
    y la República Checa y (CE) nº 2479/96 por el que se establecen las disposiciones
    de aplicación del régimen de precios mínimos de importación de determinados
    frutos rojos originarios de Estonia, Letonia y Lituania y por el que se fijan
    los precios mínimos de importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2371/1999 av den 8 november 1999 om ändring
    av förordningarna (EG) nr 1599/97 om tillämpningsföreskrifter för systemet
    med ett lägsta importpris för vissa bärsorter med ursprung i Bulgarien, Polen,
    Rumänien, Slovakien, Tjeckien eller Ungern och (EG) nr 2479/96 om fastställande
    av tillämpningsföreskrifter för systemet med minimipriser vid import av vissa
    bär med ursprung i Estland, Lettland och Litauen och om fastställande av minimipriser
    vid import
  type: main
