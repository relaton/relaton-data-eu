title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2371/1999 of 8 November 1999 amending Regulations
    (EC) No 1599/97 laying down detailed rules for the application of the system of
    minimum import prices for certain soft fruits originating in Bulgaria, Hungary,
    Poland, Romania, Slovakia and the Czech Republic and (EC) No 2479/96 laying down
    detailed rules for the application of the minimum import price system for certain
    soft fruit originating in Estonia, Latvia and Lithuania and fixing the minimum
    import prices
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2371/1999 de la Commission, du 8 novembre 1999, modifiant
    les règlements (CE) nº 1599/97 portant modalités d'application du régime du
    prix minimal à l'importation de certains fruits rouges originaires de Bulgarie,
    de Hongrie, de Pologne, de Roumanie, de Slovaquie et de la République tchèque
    et (CE) nº 2479/96 portant modalités d'application du régime du prix minimal
    à l'importation de certains fruits rouges originaires d'Estonie, de Lettonie
    et de Lituanie et fixant les prix minimaux à l'importation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2371/1999 der Kommission vom 8. November 1999 zur Änderung
    der Verordnung (EG) Nr. 1599/97 mit Durchführungsbestimmungen zu der Mindestpreisregelung
    bei der Einfuhr von bestimmtem Beerenobst mit Ursprung in Bulgarien, Polen, Rumänien,
    der Slowakei, der Tschechischen Republik und Ungarn sowie der Verordnung (EG)
    Nr. 2479/96 mit Durchführungsbestimmungen zu der bei der Einfuhr von Beerenfrüchten
    aus Estland, Lettland und Litauen geltenden Mindestpreisregelung und zur Festsetzung
    der Einfuhrmindestpreise
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2371/1999 af 8. november 1999 om ændring
    af forordning (EF) nr. 1599/97 om gennemførelsesbestemmelser til ordningen med
    minimumsimportpriser for visse bær med oprindelse i Bulgarien, Ungarn, Polen,
    Rumænien, Slovakiet og Tjekkiet og forordning (EF) nr. 2479/96 om gennemførelsesbestemmelser
    for ordningen med minimumsimportpriser for visse bær med oprindelse i Estland,
    Letland og Litauen, og om fastsættelse af minimumsimportpriserne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2371/1999 της Επιτροπής,
    της 8ης Νοεμβρίου 1999, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 1599/97 περί των λεπτομερειών
    εφαρμογής του καθεστώτος ελάχιστης τιμής κατά
    την εισαγωγή ορισμένων ερυθρών φρούτων καταγωγής
    Βουλγαρίας, Ουγγαρίας, Πολωνίας, Ρουμανίας,
    Σλοβακίας και της Τσεχικής Δημοκρατίας και
