    de las pérdidas de renta agrícola provocadas por fluctuaciones monetarias en
    otros Estados miembros
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2611/95 av den 25 oktober 1995 om möjligheten
    att bevilja nationellt kompensationsstöd för förlust av jordbruksinkomster
    förorsakade av valutarörelser i andra medlemsstater
  type: main
