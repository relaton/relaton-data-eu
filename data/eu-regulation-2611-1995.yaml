title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2611/95 of 25 October 1995 establishing the
    possibility of national aid being granted in compensation for losses of agricultural
    income caused by monetary movements in other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2611/95 du Conseil, du 25 octobre 1995, prévoyant
    la possibilité d'octroyer une aide nationale de compensation des pertes de revenus
    agricoles causées par des mouvements monétaires dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2611/95 des Rates vom 25. Oktober 1995 zur etwaigen
    Gewährung einer einzelstaatlichen Beihilfe zum Ausgleich der wegen Währungsänderungen
    in anderen Mitgliedstaaten verursachten landwirtschaftlichen Einkommensverluste
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2611/95 af 25. oktober 1995 om mulighed for
    national støtte til udligning af indkomsttab i landbruget forårsaget af valutabevægelser
    i andre medlemsstater
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2611/95 του Συμβουλίου
    της 25ης Οκτωβρίου 1995 για τη δυνατότητα χορήγησης
    εθνικής αντισταθμιστικής ενίσχυσης για τις
    απώλειες γεωργικών εισοδημάτων που προκλήθηκαν
    από νομισματικές διακυμάνσεις σε άλλα κράτη
    μέλη
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2611/95, annettu 25 päivänä lokakuuta 1995,
    mahdollisuudesta myöntää muissa jäsenvaltioissa tapahtuneista valuuttapoliittisista
    liikkeistä johtuvien maataloustulon menetysten kansallista tasaustukea
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2611/95 del Consiglio, del 25 ottobre 1995, che prevede
    la possibilità di concedere un aiuto nazionale per compensare le perdite di redditi
    agricoli causate da fluttuazioni monetarie in altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2611/95 van de Raad van 25 oktober 1995 inzake de
    mogelijkheid tot toekenning van nationale compenserende steun voor inkomensverliezen
    in de landbouw als gevolg van monetaire schommelingen in andere Lid-Staten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2611/95 do Conselho, de 25 de Outubro de 1995, que
    prevê a possibilidade de concessão de uma ajuda nacional compensatória das
    perdas de rendimento agrícola causadas por movimentos monetários noutros Estados-membros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2611/95 del Consejo, de 25 de octubre de 1995, por
