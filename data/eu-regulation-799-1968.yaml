  content: Règlement (CEE) n° 799/68 du Conseil, du 27 juin 1968, dérogeant, à
    titre temporaire et pour certaines marchandises, aux dispositions du règlement
    n° 160/66/CEE relatives au mode de calcul des montants des éléments mobiles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 799/68 des Rates vom 27. Juni 1968 über eine vorübergehende
    Abweichung, bei bestimmten Waren, von den Bestimmungen der Verordnung Nr. 160/66/EWG,
    welche das Verfahren zur Berechnung der beweglichen Teilbeträge betreffen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 799/68 del Consiglio, del 27 giugno 1968, che deroga,
    a titolo temporaneo e per talune merci, alle disposizioni del regolamento n. 160/66/
    CEE relative al metodo di calcolo degli importi degli elementi mobili
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 799/68 van de Raad van 27 juni 1968 houdende tijdelijke
    afwijking, voor bepaalde goederen, van de bepalingen van Verordening nr. 160/
    66/EEG met betrekking tot de wijze van berekening van de variabele elementen
