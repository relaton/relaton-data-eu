    presentate nel mese di ottobre 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi bilaterali agricoli conclusi
    tra la Comunità, da un lato, e l'Austria e la Finlandia, dall'altro
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2553/94 van de Commissie van 20 oktober 1994 tot vaststelling
