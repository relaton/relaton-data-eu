title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2553/94 of 20 October 1994 determining the
    extent to which applications lodged in October 1994 for import licences for certain
    pigmeat products under the regime provided for by the Bilateral Agreements on
    agriculture concluded between the Community, of the one part, and Austria and
    Finland, of the other part, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2553/94 de la Commission, du 20 octobre 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1994 pour certains produits à base de viande de porc, dans le cadre du
    régime prévu par les accords bilatéraux agricoles conclus entre la Communauté,
    d'une part, et l'Autriche et la Finlande, d'autre part, peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2553/94 der Kommission vom 20. Oktober 1994 über die
    Festsetzung des Umfangs, in dem die im Oktober 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der bilateralen
    landwirtschaftlichen Abkommen zwischen der Gemeinschaft einerseits und Österreich
    sowie Finnland andererseits genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2553/94 af 20. oktober 1994 om fastsættelse
    af, i hvilket omfang det er muligt at imødekomme de ansøgninger, som blev indgivet
    i oktober 1994 om importlicenser for visse svinekødsprodukter i forbindelse med
    den ordning, der er fastsat i de bilaterale landbrugsaftaler, som er indgået
    mellem Fællesskabet på den ene side og Østrig og Finland på den anden
  type: main
- language: el
  script: Grek
