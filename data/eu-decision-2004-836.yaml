title:
- language: en
  script: Latn
  content: '2004/836/EC: Commission Decision of 6 December 2004 amending and correcting
    Decision 2004/4/EC authorising Member States temporarily to take emergency measures
    against the dissemination of Pseudomonas solanacearum (Smith) Smith as regards
    Egypt (notified under document number C(2004) 4602)'
  type: main
- language: fr
  script: Latn
