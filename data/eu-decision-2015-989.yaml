  content: Rådets beslut (EU) 2015/989 av den 15 juni 2015 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i den underkommitté för handel och
    hållbar utveckling som inrättats genom associeringsavtalet mellan Europeiska
    unionen och Europeiska atomenergigemenskapen och deras medlemsstater, å ena sidan,
