    a Moldavskou republikou na strane druhej, pokiaľ ide o prijatie rokovacieho poriadku
    Podvýboru pre obchod a trvalo udržateľný rozvoj a zoznamu osôb, ktoré majú
    zasadať v skupine expertov pre obchod a trvalo udržateľný rozvoj
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2015/989 z dne 15. junija 2015 o stališču, ki se zavzame
    v imenu Unije v Pododboru za trgovino in trajnostni razvoj, ustanovljenem s Pridružitvenim
    sporazumom med Evropsko unijo in Evropsko skupnostjo za atomsko energijo in njunimi
    državami članicam na eni strani ter Republiko Moldavijo na drugi strani, glede
    sprejetja poslovnika Pododbora za trgovino in trajnostni razvoj ter seznama posameznikov,
    ki delujejo kot strokovnjaki v postopkih skupine na področju trgovine in trajnostnega
    razvoja
  type: main
