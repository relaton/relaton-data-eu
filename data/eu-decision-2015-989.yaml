    que se debe adoptar, en nombre de la Unión Europea, en el Subcomité de Comercio
    y Desarrollo Sostenible creado por el Acuerdo de Asociación entre la Unión Europea
    y la Comunidad Europea de la Energía Atómica y sus Estados miembros, por una
    parte, y la República de Moldavia, por otra, en lo que respecta a la adopción
    del reglamento interno del Subcomité de Comercio y Desarrollo Sostenible y la
    lista de personas para actuar como expertos en los procedimientos del Grupo de
    Expertos de Desarrollo Sostenible y tengan la capacidad para ello
  type: main
