title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/989 of 15 June 2015 on the position to be taken
    on behalf of the European Union in the Trade and Sustainable Development Sub-Committee
    established by the Association Agreement between the European Union and the European
    Atomic Energy Community and their Member States, of the one part, and the Republic
    of Moldova, of the other part, as regards the adoption of the rules of procedure
    of the Trade and Sustainable Development Sub-Committee and the list of individuals
    to serve as experts in panel procedures on trade and sustainable development
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/989 du Conseil du 15 juin 2015 relative à la position
    à prendre au nom de l'Union européenne au sein du sous-comité du commerce et
    du développement durable institué par l'accord d'association entre l'Union européenne
    et la Communauté européenne de l'énergie atomique et leurs États membres,
    d'une part, et la République de Moldavie, d'autre part, en ce qui concerne l'adoption
    du règlement intérieur du sous-comité du commerce et du développement durable
    et la liste des personnes qui exerceront les fonctions d'expert dans le cadre
    des procédures du groupe d'experts sur le commerce et le développement durable
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/989 des Rates vom 15. Juni 2015 über den Standpunkt,
    der im Namen der Europäischen Union in dem mit dem Assoziierungsabkommen zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Republik Moldau andererseits eingesetzten Unterausschuss für
    Handel und nachhaltige Entwicklung hinsichtlich der Annahme der Geschäftsordnung
    des Unterausschusses für Handel und nachhaltige Entwicklung sowie der Liste der
    Personen, die als Sachverständige in Panelverfahren über Fragen des Handels
    und der nachhaltigen Entwicklung dienen sollen, zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2015/989 на Съвета от 15 юни 2015 година
    относно позицията, която Съюзът да заеме от
    името на Европейския съюз в рамките на Подкомитета
    по търговия и устойчиво развитие, създаден
    със Споразумението за асоцииране между Европейския
    съюз и Европейската общност за атомна енергия
    и техните държави членки, от една страна, и
    Република Молдова, от друга страна, във връзка
    с приемането на процедурния правилник на Подкомитета
    по търговия и устойчиво развитие и списъка
    на лицата, които да изпълняват функцията на
    експерти в процедурите на експертната комисия
    по търговия и устойчиво развитие
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2015/989 ze dne 15. června 2015 o postoji, který
    má být jménem Evropské unie zaujat v Podvýboru pro obchod a udržitelný
    rozvoj zřízeném Dohodou o přidružení mezi Evropskou unií a Evropským společenstvím
    pro atomovou energii a jejich členskými státy na jedné straně a Moldavskou
    republikou na straně druhé k přijetí jednacího řádu Podvýboru pro obchod
    a udržitelný rozvoj a seznamu osob účastnících se jednání panelu v roli
    odborníků na obchod a udržitelný rozvoj
  type: main
