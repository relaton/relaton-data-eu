  script: Latn
  content: Neuvoston päätös (EU) 2015/989, annettu 15 päivänä kesäkuuta 2015,
    Euroopan unionin, Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden sekä
    Moldovan tasavallan välisellä assosiaatiosopimuksella perustetussa kaupan ja
    kestävän kehityksen alakomiteassa Euroopan unionin puolesta esitettävästä
    kannasta, joka koskee kaupan ja kestävän kehityksen alakomitean työjärjestyksen
    sekä sellaisten henkilöiden, jotka voivat toimia asiantuntijoina paneelin menettelyissä
    kauppaan ja kestävään kehitykseen liittyvissä asioissa, luettelon hyväksymistä
  type: main
