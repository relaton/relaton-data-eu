title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 novembre 1971, portant octroi du concours
    du FSE au bénéfice de la République fédérale d'Allemagne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    la "Bundesanstalt für Arbeit", la "Bundesknappschaft" et les "Bundeslander"
  type: main
- language: de
  script: Latn
  content: '72/48/EWG: Entscheidung der Kommission vom 22. November 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an die Bundesrepublik
    Deutschland zu Aufwendungen für von der Bundesanstalt für Arbeit, der Bundesknappschaft
    und den Bundesländern durchgeführte Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/48/CEE: Decisione della Commissione, del 22 novembre 1971, che concede
    un contributo del FSE alla Repubblica federale di Germania per spese concernenti
    operazioni di riqualificazione effettuate dalla «Bundesanstalt für Arbeit»,
    dalla «Bundesknappschaft» e dai «Bundesländer»'
  type: main
- language: nl
  script: Latn
  content: '72/48/EEG: Beschikking van de Commissie van 22 november 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van de Bondsrepubliek
    Duitsland voor door de "Bundesanstalt für Arbeit", de "Bundesknappschaft" en
    de "Bundesländer" gemaakte herscholingskosten'
  type: main
