title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1968, portant octroi du concours
    du Fonds social européen au bénéfice de la République française pour des
    dépenses relatives à des opérations de rééducation professionnelle effectuées
    par le Ministère des affaires sociales et le Ministère des anciens combattants
    et victimes de la guerre
  type: main
- language: de
  script: Latn
  content: '68/384/EWG: Entscheidung der Kommission vom 30. September 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Frankreich zu Aufwendungen
    für vom "Ministère des Affaires Sociales" und vom "Ministère des Anciens Combattants
    et Victimes de Guerre "durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '68/384/CEE: Decisione della Commissione, del 30 settembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica francese per
    spese concernenti operazioni di rieducazione professionale effettuate dal «Ministero
    degli affari sociali e dal Ministero degli ex combattenti e delle vittime di guerra»'
  type: main
- language: nl
  script: Latn
  content: '68/384/EEG: Beschikking van de Commissie van 30 september 1968 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Franse Republiek
    voor door het "Ministère des Affaires Sociales" en het "Ministère des Anciens
    Combattants et Victimes de Guerre" gemaakte herscholingskosten'
