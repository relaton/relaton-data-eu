  content: Règlement (CEE) n 739/71 de la Commission, du 6 avril 1971, déterminant
    les montants des éléments mobiles rectifiés applicables, à compter du 12 avril
    1971, à l'importation dans la Communauté de certaines marchandises relevant
    du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 739/71 der Kommission vom 6. April 1971 zur Festsetzung
    der Höhe der ab 12. April 1971 bei der Einfuhr für bestimmte unter die Verordnung
    (EWG) Nr. 1059/69 des Rates fallende Waren in die Gemeinschaft anwendbaren berichtigten
    beweglichen Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 739/71 della Commissione, del 6 aprile 1971, che determina
    gli importi degli elementi mobili rettificati applicabili dal 12 aprile 1971 all'importazione
    nella Comunità di talune merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 739/71 van de Commissie van 6 april 1971 tot vaststelling
