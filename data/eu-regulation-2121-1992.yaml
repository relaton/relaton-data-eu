    und entsprechender Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen
    (1992)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2121/92 af 20. juli 1992 om anden ændring
    af forordning (EØF) nr. 3882/91 fastsættelse for 1992 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande samt af visse
    betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
