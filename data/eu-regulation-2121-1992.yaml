title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2121/92 of 20 July 1992 amending, for the second
    time, Regulation (EEC) No 3882/91 fixing, for certain fish stocks and groups of
    fish stocks, the total allowable catches for 1992 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2121/92 du Conseil, du 20 juillet 1992, modifiant
    pour la deuxième fois le règlement (CEE) n° 3882/91 fixant, pour certains stocks
    ou groupes de stocks de poissons, les totaux admissibles des captures pour 1992
    et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2121/92 des Rates vom 20. Juli 1992 zur zweiten Änderung
