    fra Japan af elektroniske regnemaskiner til fire regningsarter, skrivende og ikkeskrivende
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1960/74 della Commissione, del 25 luglio 1974, che
    proroga la validità del regolamento (CEE) n. 2140/73 che istituisce una vigilanza
    comunitaria sulle importazioni di calcolatrici elettroniche numeriche, con o senza
    dispositivo stampatore, in provenienza dal Giappone
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1960/74 van de Commissie van 25 juli 1974 houdende
    verlenging van Verordening (EEG) nr. 2140/73 betreffende de instelling van een
    communautair toezicht op de invoer uit Japan van schrijvende en niet-schrijvende
    elektronische rekenmachines welke de vier hoofdbewerkingen uitvoeren
  type: main
