  content: Regulation (EEC) No 1960/74 of the Commission of 25 July 1974 extending
    the period of validity of Regulation (EEC) No 2140/73 establishing Community surveillance
    over imports from Japan of electronic four-operation calculating machines, printing
    or non-printing
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1960/74 de la Commission, du 25 juillet 1974, prorogeant
    le règlement (CEE) n° 2140/73 portant instauration d'une surveillance communautaire
    des importations en provenance du Japon de machines à calculer électroniques
    à quatre opérations, imprimantes et non imprimantes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1960/74 der Kommission vom 25. Juli 1974 betreffend
    Verlängerung der Verordnung (EWG) Nr. 2140/73 über die Einführung einer gemeinschaftlichen
    Überwachung für die Einfuhr aus Japan von elektronischen Vierspeziesrechenmaschinen,
    druckend und nichtdruckend
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1960/74 af 25. juli 1974 om forlængelse
