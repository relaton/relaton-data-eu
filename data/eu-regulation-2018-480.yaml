    ilgalaikių investicijų fondų pakankamos gyvavimo trukmės, potencialių pirkėjų
    rinkos ir turto, kuris bus parduodamas, vertinimo kriterijų, taip pat neprofesionaliesiems
    investuotojams skirtų priemonių rūšių ir savybių techniniais reguliavimo
    standartais
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2018/480 tal-4 ta' Diċembru 2017
    li jissupplimenta r-Regolament (UE) 2015/760 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji dwar strumenti finanzjarji derivattivi
    li jaqdu biss skopijiet ta' ħħeġġjar, tul suffiċjenti ta' ħajjiet il-fondi
    ta' investiment Ewropej fuq terminu twil, kriterji ta' valutazzjoni tas-suq għal
    xerrejja potenzjali u l-valwazzjoni tal-assi li għandhom jiġu ċeduti, u t-tipi
