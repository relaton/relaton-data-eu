  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2018/480 z dnia 4 grudnia 2017
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2015/760
    w odniesieniu do regulacyjnych standardów technicznych dotyczących finansowych
    instrumentów pochodnych służących jedynie zabezpieczeniu ryzyka, wystarczającej
    długości okresu działalności europejskich długoterminowych funduszy inwestycyjnych,
    kryteriów oceny rynku potencjalnych nabywców i wyceny aktywów przeznaczonych
    do zbycia oraz rodzajów i właściwości rozwiązań dostępnych dla inwestorów
    detalicznych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2018/480 da Comissão, de 4 de dezembro de 2017,
    que complementa o Regulamento (UE) 2015/760 do Parlamento Europeu e do Conselho
    no que diz respeito às normas técnicas de regulamentação relativas aos instrumentos
    financeiros derivados que servem unicamente para fins de cobertura, à duração
    suficiente da vida dos fundos europeus de investimento a longo prazo, aos critérios
    de avaliação do mercado dos potenciais compradores e dos ativos a alienar e
    aos tipos e características dos mecanismos disponíveis para os investidores
    não profissionais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2018/480 al Comisiei din 4 decembrie 2017 de
    completare a Regulamentului (UE) 2015/760 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare referitoare la instrumentele
    financiare derivate utilizate exclusiv în scopul acoperirii riscurilor, durata
    suficientă a ciclului de viață al fondurilor europene de investiții pe termen
    lung, criteriile pentru evaluarea pieței pentru potențialii cumpărători și
    pentru evaluarea activelor care urmează să facă obiectul cesiunii, precum și
    tipurile și caracteristicile structurilor disponibile investitorilor de retail
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2018/480 zo 4. decembra 2017, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2015/760, pokiaľ ide
    o regulačné technické predpisy o finančných derivátových nástrojoch výlučne
    na účely hedžingu, dostatočnej životnosti európskych dlhodobých investičných
    fondov, kritériách na posúdenie trhu pre potenciálnych kupujúcich a na ocenenie
    aktív, ktoré sa majú odpredať, a o typoch a charakteristikách služieb, ktoré
    sú k dispozícii retailovým investorom
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2018/480 z dne 4. decembra 2017 o dopolnitvi
    Uredbe (EU) 2015/760 Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi o izvedenih finančnih instrumentih, ki se uporabljajo izključno za
    namene zavarovanja, dovolj dolgo življenjsko dobo evropskih dolgoročnih investicijskih
    skladov, merili za oceno trga za potencialne kupce in vrednotenje sredstev, ki
    bodo odprodana, ter vrstami in značilnostmi sistemov, ki so na voljo malim vlagateljem
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2018/480 de la Comisión, de 4 de diciembre de
    2017, por el que se completa el Reglamento (UE) 2015/760 del Parlamento Europeo
    y del Consejo en lo relativo a las normas técnicas de regulación sobre los instrumentos
    financieros derivados con fines únicamente de cobertura, la duración suficiente
    de los fondos de inversión a largo plazo europeos, los criterios de evaluación
    del mercado de potenciales compradores y valoración de los activos por enajenar,
    y los tipos y características de los servicios disponibles para los inversores
    minoristas
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2018/480 av den 4 december 2017
    om komplettering av Europaparlamentets och rådets förordning (EU) 2015/760 vad
    gäller tekniska tillsynsstandarder för finansiella derivatinstrument som enbart
    tjänar säkringsändamål, tillräcklig livslängd för europeiska långsiktiga
    investeringsfonder, bedömningskriterier för marknaden för presumtiva köpare
    och värdering av de tillgångar som ska avyttras, samt olika typer av och egenskaper
    hos faciliteter som är tillgängliga för icke-professionella investerare
