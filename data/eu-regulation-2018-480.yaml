  script: Latn
  content: Delegirana uredba Komisije (EU) 2018/480 оd 4. prosinca 2017. o dopuni
    Uredbe (EU) 2015/760 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda o izvedenim financijskim instrumentima koji služe isključivo za zaštitu
    od rizika, dovoljno dugom trajanju europskih fondova za dugoročna ulaganja, kriterijima
    za procjenu tržišta za potencijalne kupce i vrednovanju imovine koja će se
    prodavati te vrstama i obilježjima sustava dostupnih malim ulagateljima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/480 felhatalmazáson alapuló rendelete (2017. december
    4.) az (EU) 2015/760 európai parlamenti és tanácsi rendeletnek a kizárólag
    fedezeti célokat szolgáló származtatott pénzügyi eszközökre, az európai
    hosszú távú befektetési alapok életciklusának megfelelő hosszára, a lehetséges
    vevők piacának felmérésével kapcsolatos kritériumokra és az elidegenítendő
    eszközök értékelésére, valamint a lakossági befektetők rendelkezésére
    álló eszközök típusaira és jellemzőire vonatkozó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2018/480 della Commissione, del 4 dicembre 2017,
    che integra il regolamento (UE) 2015/760 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione sugli strumenti finanziari
    derivati utilizzati a solo scopo di copertura, sulla sufficiente durata del ciclo
    di vita dei fondi di investimento europei a lungo termine, sui criteri di valutazione
    del mercato dei potenziali acquirenti e sulla valutazione delle attività da liquidare,
    e sulle tipologie e caratteristiche degli strumenti a disposizione degli investitori
    al dettaglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2018/480 (2017. gada 4. decembris), ar
