    tal-konsumatur
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2018/480 van de Commissie van 4 december
    2017 tot aanvulling van Verordening (EU) 2015/760 van het Europees Parlement en
