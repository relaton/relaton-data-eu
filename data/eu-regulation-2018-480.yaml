title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/480 of 4 December 2017 supplementing
    Regulation (EU) 2015/760 of the European Parliament and of the Council with regard
    to regulatory technical standards on financial derivative instruments solely serving
    hedging purposes, sufficient length of the life of the European long-term investment
    funds, assessment criteria for the market for potential buyers and valuation of
    the assets to be divested, and the types and characteristics of the facilities
    available to retail investors
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/480 de la Commission du 4 décembre 2017
    complétant le règlement (UE) 2015/760 du Parlement européen et du Conseil par
    des normes techniques de réglementation sur les instruments financiers dérivés
    servant uniquement à des fins de couverture, la durée de vie suffisante des
    fonds européens d'investissement à long terme, les critères à employer pour
    évaluer le marché des acheteurs potentiels et la valorisation des actifs à
    céder, ainsi que sur les types de facilités mises à la disposition des investisseurs
    de détail et leurs caractéristiques
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/480 der Kommission vom 4. Dezember 2017
    zur Ergänzung der Verordnung (EU) 2015/760 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards im Hinblick auf einzig und allein
    der Absicherung dienende Finanzderivate, die ausreichende Länge der Laufzeit
    europäischer langfristiger Investmentfonds, die Kriterien für die Einschätzung
    des potenziellen Käufermarkts und die Bewertung der zu veräußernden Vermögenswerte
    sowie die Arten und Merkmale der den Kleinanlegern zur Verfügung stehenden Einrichtungen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2018/480 на Комисията
