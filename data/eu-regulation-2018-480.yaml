    uz regulatīvajiem tehniskajiem standartiem par atvasinātajiem finanšu instrumentiem,
    kurus izmanto vienīgi risku ierobežošanas nolūkā, Eiropas ilgtermiņa ieguldījumu
    fondu pietiekami ilgu darbības laiku, tirgus novērtēšanas kritērijiem potenciālajiem
    pircējiem un atsavināšanai paredzēto aktīvu vērtēšanu un privātajiem
    ieguldītājiem pieejamo sistēmu veidiem un īpašībām
  type: main
- language: lt
  script: Latn
  content: 2017 m. gruodžio 4 d. Komisijos deleguotasis reglamentas (ES) 2018/480,
