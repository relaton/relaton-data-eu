    (ЕС) 2015/760 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    относно деривативните финансови инструменти,
    които се използват единствено с цел хеджиране,
    достатъчната продължителност на жизнения
    цикъл на европейските фондове за дългосрочни
    инвестиции, критериите за оценка на пазара
    за потенциални купувачи и оценката на активите,
