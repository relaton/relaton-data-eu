    видовете и характеристиките на услугите, които
    са на разположение на непрофесионалните инвеститори
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2018/480 ze dne 4. prosince
    2017, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2015/760,
    pokud jde o regulační technické normy týkající se finančních derivátových
    nástrojů, které slouží výhradně pro účely zajištění, dostatečně
    dlouhé doby trvání evropských fondů dlouhodobých investic, kritérií pro
    hodnocení trhu z hlediska potenciálních kupců a pro ocenění aktiv určených
    k prodeji a typů a náležitostí zařízení pro neprofesionální investory
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2018/480 af 4. december 2017 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2015/760
    for så vidt angår reguleringsmæssige tekniske standarder for finansielle derivater,
