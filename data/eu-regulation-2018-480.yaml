  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2018/480, annettu 4 päivänä joulukuuta
    2017, Euroopan parlamentin ja neuvoston asetuksen (EU) 2015/760 täydentämisestä
    teknisillä sääntelystandardeilla, jotka koskevat ainoastaan suojautumistarkoitukseen
    käytettäviä johdannaisinstrumentteja, eurooppalaisten pitkäaikaissijoitusrahastojen
    riittävän pitkää toiminta-aikaa, mahdollisten ostajien markkinoita koskevassa
    arvioinnissa käytettäviä perusteita ja niiden omaisuuserien arvon määritystä,
    joista aiotaan luopua, sekä yksityissijoittajille tarjolla olevien toimintojen
    tyyppejä ja ominaisuuksia
  type: main
