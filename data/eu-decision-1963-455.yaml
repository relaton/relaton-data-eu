title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 juillet 1963, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer
    le relèvement des droits prévus dans leur tarif douanier vers ceux du Tarif
    douanier commun en ce qui concerne les tabacs fabriqués des sous- positions tarifaires
    24.02 A, B, C et D
  type: main
- language: de
  script: Latn
  content: '63/455/EWG: Entscheidung der Kommission vom 17. Juli 1963, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die Angleichung der in ihrem Zolltarif vorgesehenen Zollsätze
    an diejenigen des Gemeinsamen Zolltarifs für verarbeiteten Tabak der Tarifnummern
    24.02 A, B, C und D aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '63/455/CEE: Decisione della Commissione, del 17 luglio 1963, con cui si
    autorizza il Regno del Belgio, il Granducato del Lussemburgo, e il Regno dei Paesi
    Bassi a differire l''aumento dei dazi previsti nello loro tariffa doganale verso
    quelli della tariffa doganale comune, per quanto concerne i tabacchi lavorati
    di cui alle sottoposizioni tariffarie 24.02 A, B, C e D.'
  type: main
- language: nl
  script: Latn
  content: '63/455/EEG: Beschikking van de Commissie van 17 juli 1963 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden de aanpassing van de in hun douanetarief voorziene invoerrechten aan
    die van het gemeenschappelijk douanetarief voor wat betreft tabaksfabrikaten van
    de tariefonderverdelingen 24.02 A, B, C en D uit te stellen'
  type: main
