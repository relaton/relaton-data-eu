title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2437/74 of the Commission of 26 September 1974 re-establishing
    the levying of the customs duties on fabricated asbestos, falling within heading
    No 68.13, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2437/74 de la Commission, du 26 septembre 1974, portant
    rétablissement de la perception des droits de douane applicables à l'amiante
    travaillé, de la position tarifaire 68.13, originaire de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues prévues par le règlement (CEE) n° 3501/73
    du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2437/74 der Kommission vom 26. September 1974 zur
    Wiedereinführung des Zollsatzes für bearbeiteten Asbest der Tarifnummer 68.13,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73 des Rates
    vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2437/74 af 26. september 1974 om genindførelse
    af opkrævning af toldafgifter for bearbejdede asbestfibre, under position 68.13,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2437/74 della Commissione, del 26 settembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili all'amianto lavorato
    della voce doganale n. 68.13, originario della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre
    1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2437/74 van de Commissie van 26 september 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op bewerkte
    asbestvezels van post 68.13 van oorsprong uit Joegoslavië, ten behoeve waarvan
    bij Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
