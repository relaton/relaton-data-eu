title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2937/93 of 25 October 1993 determining the
    extent to which applications lodged in September 1993 for import licences for
    the remaining quantities of fresh, chilled or preserved beef and veal under the
    import arrangements provided for in the Bilateral Agreement on Agriculture between
    the Community and Sweden can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2937/93 de la Commission, du 25 octobre 1993, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en septembre 1993 pour certaines quantités restantes de viandes bovines
    fraîches ou réfrigérées ou sous forme de conserves dans le cadre du régime
    d'importation prévu dans l'accord bilatéral agricole entre la Communauté et
    la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2937/93 der Kommission vom 25. Oktober 1993 zur Genehmigung
    der im September 1993 für die Einfuhr des restlichen frischen oder gekühlten
    Rindfleisches oder von Rindfleisch in Konserven im Rahmen der Einfuhrregelung
    des zwischen der Gemeinschaft und Schweden geschlossenen bilateralen landwirtschaftlichen
    Abkommens gestellten Anträge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2937/93 af 25. oktober 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i september 1993,
    om importlicenser for restmængderne af oksekød, fersk, kølet, eller frosset
    eller i form af konserves, i forbindelse med den importordning, der er fastsat
    i den bilaterale landbrugsaftale mellem Fællesskabet og Sverige
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2937/93 της Επιτροπής
    της 25ης Οκτωβρίου 1993 για τον καθορισμό του
    ορίου εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    το Σεπτέμβριο 1993 για τις υπόλοιπες ποσότητες
    που αφορούν ορισμένα νωπά ή διατηρημένα με
    απλή ψύξη βόεια κρέατα ή με τη μορφή κονσερβών
    στο πλαίσιο του καθεστώτος εισαγωγής που προβλέπεται
    στη διμερή γεωργική συμφωνία μεταξύ της Κοινότητας
    και της Σουηδίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2937/93 della Commissione, del 25 ottobre 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di settembre 1993 per i quantitativi restanti di talune carni
    bovine fresche o refrigerate o in conserva nel quadro del regime di importazione
    previsto dall'accordo bilaterale agricolo tra la Comunità e la Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2937/93 van de Commissie van 25 oktober 1993 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor de resterende hoeveelheden vers of gekoeld rundvlees of
    rundvleesconserven, die in september 1993 zijn ingediend op grond van de invoerregeling
    die is vastgesteld in de door de Gemeenschap met Zweden gesloten bilaterale landbouwovereenkomst
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2937/93 da Comissão, de 25 de Outubro de 1993, que
    determina em que medida podem ser aceites os pedidos de certificado de importação,
    apresentados em Setembro de 1993, para as quantidades restantes de determinadas
    carnes de bovino frescas, refrigeradas ou sob forma de conservas, ao abrigo do
    regime de importação previsto no Acordo bilateral agrícola entre a Comunidade
    e a Suécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2937/93 de la Comisión, de 25 de octubre de 1993, por
    el que se determina la proporción en que podrán aceptarse las solicitudes de
    liciencias de importación de las cantidades restantes de algunas carnes de vacuno
    frescas, refrigeradas o en conserva presentadas en septiembre de 1993 al amparo
    del régimen de importación establecido en el Acuerdo agrario bilateral celebrado
    entre la Comunidad y Suecia
  type: main
