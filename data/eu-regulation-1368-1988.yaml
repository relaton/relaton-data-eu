title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1368/88 of 18 May 1988 specifying the conditions
    for the inclusion of certain live animals of the domestic bovine species and certain
    meat of the bovine species within the CN codes listed in Annex E to the Additional
    Protocol to the Cooperation Agreement between the European Economic Community
    and the Socialist Federal Republic of Yugoslavia establishing new trade arrangements
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1368/88 de la Commission du 18 mai 1988 déterminant
    les conditions d'admission dans les codes NC, visées dans l'annexe E du protocole
    additionnel à l'accord de coopération entre la Communauté économique européenne
    et la République socialiste fédérative de Yougoslavie établissant un nouveau
    régime commercial, de certains animaux vivants de l'espèce bovine domestique
    et de certaines viandes de l'espèce bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1368/88 der Kommission vom 18. Mai 1988 zur Festlegung
    der Voraussetzungen für die Zulassung zu den Unterpositionen der Kombinierten
    Nomenklatur von bestimmten lebenden Hausrindern und bestimmtem Fleisch von Rindern,
    genannt im Anhang E des Zusatzprotokolls zu dem Kooperationsabkommen zwischen
    der Europäischen Wirtschaftsgemeinschaft und der Sozialistischen Föderativen
    Republik Jugoslawien zur Festlegung einer neuen Handelsregelung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1368/88 af 18. maj 1988 om fastsættelse
    af betingelserne for henførsel af visse levende husdyr (hornkvæg) og visse sorter
    af sådanne dyr under de underpositioner i Den Kombinerede Nomenklatur, der er
    omhandlet i bilag E til tillægsprotokollen til samarbejdsaftalen mellem Det Europæiske
    Økonomiske Fællesskab og Den Socialistiske Føderative Republik Jugoslavien
    om fastsættelse af en ny handelsordning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1368/88 της Επιτροπής
    της 18ης Μαΐου 1988 που καθορίζει τους όρους υπαγωγής
    στις διακρίσεις της συνδυασμένης ονοματολογίας,
    που αναφέρονται στο παράρτημα Ε του πρόσθετου
    πρωτοκόλλου της συμφωνίας συνεργασίας μεταξύ
    της Ευρωπαϊκής Οικονομικής Κοινότητας και
    της Ομοσπονδιακής Σοσιαλιστικής Δημοκρατίας
    της Γιουγκοσλαβίας, για τη θέσπιση ενός νέου
    εμπορικού καθεστώτος, για ορισμένα ζωντανά
    ζώα του είδους των κατοικιδίων βοοειδών και
    ορισμένα κρέατα βοοειδών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1368/88 della Commissione del 18 maggio 1988 che determina
    le condizioni d' ammissione nelle sottovoci della nomenclatura combinata previste
    nell' allegato E del protocollo aggiuntivo all' accordo di cooperazione fra la
    Comunità economica europea e la Repubblica socialista federativa di Iugoslavia
    che stabilisce un nuovo regime commerciale di taluni animali vivi nella specie
    bovina domestica e di talune carni nella specie bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1368/88 van de Commissie van 18 mei 1988 tot vaststelling
    van de voorwaarden en bepalingen voor indeling van bepaalde levende runderen (huisdieren)
    en van bepaalde soorten vlees van runderen onder de onderverdelingen van de gecombineerde
    nomenclatuur, bedoeld in bijlage E van het Aanvullend Protocol bij de Samenwerkingsovereenkomst
    tussen de Europese Economische Gemeenschap en de Socialistische Federatieve Republiek
    Joegoslavië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1368/88 da Comissão de 18 de Maio de 1988 que determina
    as condições de admissão nos códigos da nomenclatura combinada mencionados
    no Anexo E do Protocolo Adicional ao Acordo de Cooperação entre a Comunidade
    Económica Europeia e a República Socialista Federativa da Jugoslávia, que estabelece
    um novo regime comercial de determinados animais vivos da espécie bovina doméstica
    e de determinadas carnes da espécie bovina
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1368/88 de la Comisión de 18 de mayo de 1988 por
    el que se determinan las condiciones de admisión en las subpartidas de la nomenclatura
    combinada indicadas en el Anexo E del Protocolo Adicional al Acuerdo de cooperación
    entre la Comunidad Económica Europea y la República Federativa Socialista de
    Yugoslavia y por el que se establece un nuevo régimen comercial para determinados
    animales vivos de la especie bovina
  type: main
