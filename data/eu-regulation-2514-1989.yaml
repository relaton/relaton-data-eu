    Nr. 2247/89 des Rates und zur Änderung der Verordnung (EWG) Nr. 569/88 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2514/89 af 17. august 1989 om gennemførelsesbestemmelser
