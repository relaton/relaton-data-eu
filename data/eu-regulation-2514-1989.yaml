    αριθ. 569/88
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2514/89 DELLA COMMISSIONE del 17 agosto 1989 che
    stabilisce le modalità della fornitura gratuita di carni bovine alla Polonia,
