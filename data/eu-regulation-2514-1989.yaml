    au règlement (CEE) n° 2247/89 du Conseil et modifiant le règlement (CEE) n°
    569/88
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2514/89 DER KOMMISSION vom 17. August 1989 mit Einzelbestimmungen
