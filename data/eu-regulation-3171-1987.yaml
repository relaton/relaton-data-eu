  content: Commission Regulation (EEC) No 3171/87 of 23 October 1987 re-establishing
    the levying of customs duties on bags, sachets and similar articles, of polyethylene
    falling within subheading 39.07 B V ex d) of the Common Customs Tariff, originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
