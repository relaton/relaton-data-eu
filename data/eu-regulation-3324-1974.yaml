title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3324/74 of the Commission of 20 December 1974 fixing
    for the 1975 fishing year withdrawal prices for the fishery products listed in
    Annex I (A) and (C) to Regulation (EEC) No 2142/70 and for certain products landed
    in areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3324/74 de la Commission, du 20 décembre 1974, fixant,
    pour les produits de la pêche énumérés à l'annexe I sous A et C, ainsi que
    pour certains produits débarqués dans des zones très éloignées des principaux
    centres de consommation de la Communauté, du règlement (CEE) n° 2142/70, les
    prix de retrait valables pour l'année 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3324/74 der Kommission vom 20. Dezember 1974 zur Festsetzung
    der Rücknahmepreise für das Jahr 1975 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 2142/70 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3324/74 af 20. december 1974 om fastsættelse
    af de tilbagetagelsespriser, der er gældende i 1975 for de fiskerivarer, som
    er anført i litra A og C i bilag I, samt for visse varer fra landingsområder,
    der ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre, nævnt i
    forordning (EØF) nr. 2142/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3324/74 della Commissione, del 20 dicembre 1974, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, nonché
    per taluni prodotti sbarcati in zone molto lontane dai principali centri di consumo
    della Comunità del regolamento (CEE) n. 2142/70, i prezzi di ritiro validi per
    l'anno 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3324/74 van de Commissie van 20 december 1974 tot
    vaststelling van de in 1975 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) 2142/70 genoemde visserijprodukten en voor bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
