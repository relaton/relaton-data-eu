title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3668/91 of 11 December 1991 opening a Community
    tariff quota for high-quality fresh, chilled or frozen meat of bovine animals
    falling within CN codes 0201 and 0202 and for products falling with CN codes 0206
    10 95 and 0206 29 91 (1992)
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3668/91 DU CONSEIL du 11 décembre 1991 portant ouverture
    d'' un contingent tarifaire communautaire pour les viandes bovines de haute qualité,
    fraîches, réfrigérées ou congelées, relevant des codes NC 0201 et 0202 ainsi
    que pour les produits relevant des codes NC 0206 10 95 et 0206 29 91 (1992) #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3668/91 DES RATES vom 11. Dezember 1991 zur Eröffnung
