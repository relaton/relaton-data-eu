    Rindfleisch der KN-Codes 0201 und 0202 sowie für Waren der KN-Codes 0206 10 95
    und 0206 29 91 (1992) #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3668/91 af 11. december 1991 om åbning af
    et fællesskabstoldkontingent for fersk, kølet eller frosset oksekød af høj
    kvalitet henhørende under KN-kode 0201 og 0202 samt for produkter henhørende
    under KN-kode 0206 10 95 og 0206 29 91 (1992)
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3668/91 του Συμβουλίου
