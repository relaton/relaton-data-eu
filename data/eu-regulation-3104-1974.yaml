  content: Regulation (EEC) No 3104/74 of the Commission of 10 December 1974 amending
    Regulation (EEC) No 2518/74 on the measures to be taken following the all-round
    increase with effect from 7 October 1974 of agricultural prices
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3104/74 de la Commission, du 10 décembre 1974, modifiant
    le règlement (CEE) n° 2518/74 définissant les mesures à prendre suite au relèvement
    général du niveau des prix dans le secteur agricole avec effet au 7 octobre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3104/74 der Kommission vom 10. Dezember 1974 zur Änderung
    der Verordnung (EWG) Nr. 2518/74 zur Festlegung der im Anschluß an die allgemeine
    Anhebung der Agrarpreise mit Wirkung vom 7. Oktober 1974 zu treffenden Maßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3104/74 af 10. december 1974 om ændring
    af forordning (EØF) nr. 2518/74 om bestemmelse af de foranstaltninger, der skal
    træffes som følge af den almindelige prisstigning inden for landbrugssektoren
    med virkning fra den 7. oktober 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3104/74 della Commissione, del 10 dicembre 1974, recante
    modifica del regolamento (CEE) n. 2518/74, che definisce le misure da adottare
    con decorrenza dal 7 ottobre 1974 in seguito all' aumento generale del livello
    dei prezzi nel settore agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3104/74 van de Commissie van 10 december 1974 houdende
    wijziging van Verordening (EEG) nr. 2518/74 tot vaststelling van de maatregelen
    die moeten worden getroffen in verband met de algemene verhoging van het prijspeil
    in de landbouwsector per 7 oktober 1974
  type: main
