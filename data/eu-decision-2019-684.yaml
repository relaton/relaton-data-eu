title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/684 of 25 April 2019 on the
    recognition of the legal, supervisory and enforcement arrangements of Japan for
    derivatives transactions supervised by the Japan Financial Services Agency as
    equivalent to the valuation, dispute resolution and margin requirements of Article
    11 of Regulation (EU) No 648/2012 of the European Parliament and Council on OTC
    derivatives, central counterparties and trade repositories
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/684 de la Commission du 25 avril 2019
    reconnaissant l'équivalence du cadre juridique et du dispositif de surveillance
    et de mise en œuvre du Japon relatifs aux transactions sur dérivés surveillées
    par l'Agence des services financiers du Japon avec les exigences en matière de
    valorisation, de règlement des différends et de marges visées à l'article
    11 du règlement (UE) n° 648/2012 du Parlement européen et du Conseil sur les
    produits dérivés de gré à gré, les contreparties centrales et les référentiels
    centraux
  type: main
