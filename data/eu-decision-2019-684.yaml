    Services Agency) unterliegende Derivategeschäfte mit den Bewertungs-, Streitbeilegungs-
    und Einschussanforderungen in Artikel 11 der Verordnung (EU) Nr. 648/2012 des
    Europäischen Parlaments und des Rates über OTC-Derivate, zentrale Gegenparteien
    und Transaktionsregister
