title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 366/68 de la Commission, du 28 mars 1968, fixant pour
    chaque État membre, la différence de prix du sucre blanc applicable pour le
    calcul du prélèvement et de la restitution dans le secteur des produits transformés
    à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 366/68 der Kommission vom 28. März 1968 zur Festsetzung
    des auf dem Sektor der Verarbeitungserzeugnisse aus Obst und Gemüse in jedem
    Mitgliedstaat für die Berechnung der Abschöpfung und der Erstattung zugrunde
    zu legenden Preisunterschieds für Weißzucker
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 366/68 della Commissione, del 28 marzo 1968, che fissa,
    per ciascuno degli Stati membri, la differenza di prezzo dello zucchero bianco
    applicabile per il calcolo del prelievo e della restituzione nel settore dei prodotti
    trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 366/68 van de Commissie van 28 maart 1968 betreffende
    de vaststelling voor elke Lid-Staat van het, voor de berekening van de heffing
    en de restitutie in de sector van op basis van groenten en fruit verwerkte produkten
    met toevoeging van suiker, toe te passen prijsverschil voor witte suiker
  type: main
