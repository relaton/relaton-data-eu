  content: Commission Delegated Regulation (EU) 2022/2258 of 9 September 2022 amending
    and correcting Annex III to Regulation (EC) No 853/2004 of the European Parliament
    and of the Council on specific hygiene requirements for food of animal origin
    as regards fishery products, eggs and certain highly refined products, and amending
    Commission Delegated Regulation (EU) 2019/624 as regards certain bivalve molluscs
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2258 de la Commission du 9 septembre 2022
    modifiant et rectifiant l’annexe III du règlement (CE) no 853/2004 du Parlement
    européen et du Conseil relative aux exigences spécifiques en matière d’hygiène
    applicables aux denrées alimentaires d’origine animale en ce qui concerne les
    produits de la pêche, les œufs et certains produits hautement raffinés, et
    modifiant le règlement délégué (UE) 2019/624 de la Commission en ce qui concerne
    certains mollusques bivalves
  type: main
