    für Lebensmittel tierischen Ursprungs in Bezug auf Fischereierzeugnisse, Eier
    und bestimmte hochverarbeitete Erzeugnisse sowie zur Änderung der Delegierten
    Verordnung (EU) 2019/624 der Kommission in Bezug auf bestimmte Muscheln
