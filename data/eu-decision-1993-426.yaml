  script: Latn
  content: '93/426/EEC: Commission Decision of 28 July 1993 granting the second Community
    contribution to the autonomous regions of Azores and Madeira provided for in Council
    Decision 91/315/EEC to compensate for the extra costs of supplying oil to these
    archipelagos in 1991 (balance) and 1992 (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/426/CEE: Décision de la Commission, du 28 juillet 1993, relative à
    l''octroi de la deuxième contribution communautaire en faveur des régions autonomes
    des Açores et de Madère, prévue par la décision 91/315/CEE du Conseil, visant
    à compenser le surcoût d''approvisionnement pétrolier de ces archipels, au
    titre de l''année 1991 (solde) et 1992 (Le texte en langue portugaise est le
    seul faisant foi)'
  type: main
