id: EURegulation17421975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1742/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on other woven fabrics of cotton, other than raw
    cotton, falling within subheading 55.09 A ex I, originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3046/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1742/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux autres tissus
    de coton, autres qu'écrus, de la sous-position tarifaire 55.09 A EX I, originaires
    des pays en voie de développement bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3046/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1742/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für andere als rohe Gewebe aus Baumwolle, der
    Tarifstelle 55.09 A ex I, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3046/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1742/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for andre vævede stoffer af bomuld, andre end
    ublegede, under underposition 55.09 A ex I, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3046/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1742/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli altri tessuti di
    cotone, non greggi, della sottovoce doganale 55.09 A ex I, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3046/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1742/75 van de Commissie van 7 juli 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere weefsels
    van katoen, andere dan ongebleekt, van onderverdeling 55.09 A ex I, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3046/74
    van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
