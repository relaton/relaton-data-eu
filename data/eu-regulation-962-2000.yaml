title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 962/2000 of 5 May 2000 amending Regulation
    (EC) No 925/2000 temporarily suspending the issuing of export licences for certain
    milk products and determining what proportion of the amounts covered by pending
    applications for export licences may be allocated
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 962/2000 de la Commission du 5 mai 2000 modifiant le
    règlement (CE) n° 925/2000 portant suspension temporaire de la délivrance des
    certificats à l'exportation de certains produits laitiers et déterminant la
    mesure dans laquelle peuvent être attribuées les demandes de certificats d'exportation
    en instance
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 962/2000 der Kommission vom 5. Mai 2000 zur Änderung
    der Verordnung (EG) Nr. 925/2000 zur vorläufigen Aussetzung der Erteilung von
    Lizenzen für die Ausfuhr von Milcherzeugnissen und zur Bestimmung des Umfangs,
    in dem nicht erledigten Ausfuhrlizenzanträgen stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 962/2000 af 5. maj 2000 om ændring af
    forordning (EF) nr. 925/2000 om midlertidig suspension af udstedelsen af eksportlicenser
    for visse mejeriprodukter og om fastsættelse af, i hvilket omfang indgivne ansøgninger
    om eksportlicenser kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 962/2000 της Επιτροπής,
    της 5ης Μαΐου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 925/2000 για προσωρινή αναστολή της έκδοσης
    πιστοποιητικών εξαγωγής ορισμένων γαλακτοκομικών
    προϊόντων και για τον καθορισμό του βαθμού
    στον οποίο μπορούν να ικανοποιηθούν οι αιτήσεις
    για πιστοποιητικά εξαγωγής που εκκρεμούν
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 962/2000, annettu 5 päivänä toukokuuta 2000,
    tiettyjä maitotuotteita koskevien vientitodistusten antamisen väliaikaisesta
    keskeyttämisestä ja käsiteltävänä olevien vientitodistushakemusten hyväksyttävyydestä
    annetun asetuksen (EY) N:o 925/2000 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 962/2000 della Commissione, del 5 maggio 2000, recante
    modifica del regolamento (CE) n. 925/2000 che sospende in via temporanea il rilascio
    dei titoli di esportazione di taluni prodotti lattiero-caseari e stabilisce in
    che misura possono essere accolte le domande di titoli di esportazione pendenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 962/2000 van de Commissie van 5 mei 2000 tot wijziging
    van Verordening (EG) nr. 925/2000 houdende tijdelijke schorsing van de afgifte
    van uitvoercertificaten voor bepaalde zuivelproducten en vaststelling van de mate
    waarin op nog niet afgewikkelde aanvragen voor uitvoercertificaten kan worden
    ingegaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 962/2000 da Comissão, de 5 de Maio de 2000, que
    altera o Regulamento (CE) n.° 925/2000 que suspende temporariamente a emissão
    dos certificados de exportação de certos produtos lácteos e determina a medida
    em que podem ser atribuídos os certificados de exportação pendentes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 962/2000 de la Comisión, de 5 de mayo de 2000, que
    modifica el Reglamento (CE) n° 925/2000 por el que se suspende temporalmente
    la expedición de certificados de exportación de determinados productos lácteos
    y se establece en qué medida puede darse curso a las solicitudes de certificados
    de exportación en tramitación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 962/2000 av den 5 maj 2000 om ändring
    av förordning (EG) nr 925/2000 om tillfälligt upphörande med utfärdande av
    exportlicens för vissa mjölkprodukter och om i vilken utsträckning sådana
    kan beviljas
  type: main
