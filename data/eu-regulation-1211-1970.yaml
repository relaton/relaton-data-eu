  content: Règlement (CEE) n° 1211/70 du Conseil, du 29 juin 1970, fixant, pour
    la campagne 1970/1971, les majorations mensuelles des prix des céréales et des
    farines, gruaux semoules de froment ou de seigle
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1211/70 des Rates vom 29. Juni 1970 zur Festsetzung
    der monatlichen Zuschläge der Preise für Getreide und Mehl, Grütze und Grieß
    von Weizen oder Roggen für das Wirtschaftsjahr 1970/1971
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1211/70 del Consiglio, del 29 giugno 1970, che fissa,
    per la campagna 1970/1971, le maggiorazioni mensili dei prezzi dei cereali e delle
    farine, semole e semolini di frumento o di segala
  type: main
- language: nl
  script: Latn
