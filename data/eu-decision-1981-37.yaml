  content: '81/37/EEC: Commission Decision of 15 January 1981 authorizing the Italian
    Republic not to apply Community treatment to crosscountry lorries originating
    in Japan and the USSR (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/37/CEE: Décision de la Commission, du 15 janvier 1981, autorisant
    la République italienne à exclure du traitement communautaire les voitures automobiles
    tout- terrain originaires du Japon et d''Union soviétique (Le texte en langue
    italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/37/EWG: Entscheidung der Kommission vom 15. Januar 1981 zur Ermächtigung
    der Italienischen Republik, aus Japan und der UdSSR stammende Geländekraftwagen
    von der Gemeinschaftsbehandlung auszuschließen (Nur der italienische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/37/EØF: Kommissionens beslutning af 15. januar 1981 om bemyndigelse
