id: EUDecision1978485
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 May 1978 authorizing Ireland not to apply Community
    treatment to women's, girls' and infants' (other than babies') knitted or crocheted
    pyjamas and nightdresses of cotton or synthetic fibres, falling within heading
    No ex 60.04 of the Common Customs Tariff (NIMEXE codes 60.04-21, 25, 51, 53),
    originating in the Philippines and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/485/CEE: Décision de la Commission, du 12 mai 1978, autorisant l''Irlande
    à exclure du traitement communautaire les pyjamas et chemises de nuit, de bonneterie,
    de coton ou de fibres textiles synthétiques pour femmes, fillettes et jeunes
    enfants (autres que bébés), de la position Ex 60.04 (code Nimexe 60.04-21, 25,
    51, 53) du Tarif douanier commun, originaires des Philippines et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Mai 1978, mit der Irland ermächtigt
    wird, aus den Philippinen stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Schlafanzüge und Nachthemden aus Gewirken, aus Baumwolle
    oder aus synthetischen Spinnstoffen für Frauen, Mädchen und Kleinkinder (ausgenommen
    für Säuglinge), der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.04-21, 25, 51, 53) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 12. maj 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage pyjamas og natskjorter af trikotage, bomuld
    eller kemofibre, til kvinder, piger og småbørn (undtagen babyer), som henhører
    under pos. ex 60.04 (NIMEXE-kode 60.04-21, 25, 51, 53) i den fælles toldtarif,
    har oprindelse i Philippinerne og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 maggio 1978, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario i pigiami e le camicie da notte a maglia,
    di cotone o di fibre tessili sintetiche, per donna, per ragazza e per bambini
    diversi dai bambini piccoli (bébés) della voce ex 60.04 della tariffa doganale
    comune (codice Nimexe 60.04-21, 25, 51, 53), originari delle Filippine e messi
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 mei 1978 waarbij Ierland wordt gemachtigd
    pyjama's en nachthemden, van brei- of haakwerk, van katoen of van andere synthetische
    textielvezels voor dames, meisjes en kinderen (andere dan voor baby's), van post
    ex 60.04 (NIMEXE-code 60.04-21, 25, 51, 53) van het gemeenschappelijk douanetarief,
    van oorsprong uit de Filippijnen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
