  script: Latn
  content: Commission Regulation (EEC) No 927/87 of 30 March 1987 re-establishing
    the levying of the customs duties applicable to certain cathode-ray tubes falling
    under subheading 85.21 A ex III, ex V of the Common Customs Tariff originating
    in South Korea benefiting from the tariff preferences provided for by Council
    Regulation (EEC) No 3924/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 927/87 de la Commission du 30 mars 1987 portant rétablissement
