    Sud beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n.
    3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 927/87 van de Commissie van 30 maart 1987 houdende
