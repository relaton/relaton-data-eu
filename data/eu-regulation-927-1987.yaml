    henhørende under pos. 85.21 A ex III, ex V i den fælles toldtarif og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3924/86
  type: main
- language: el
  script: Grek
