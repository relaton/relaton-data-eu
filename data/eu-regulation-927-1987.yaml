    85.21 A ex III und ex V des Gemeinsamen Zolltarifs mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 927/87 af 30. marts 1987 om genindførelse
