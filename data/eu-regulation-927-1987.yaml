    des sous-positions 85.21 A ex III et ex V du tarif douanier commun, originaires
    de Corée du Sud, bénéficiaire des préférences tarifaires prévues par le
    règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
