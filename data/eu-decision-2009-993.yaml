---
id: EUDecision2009993
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 December 2009 amending Decision 2006/133/EC requiring
    Member States temporarily to take additional measures against the dissemination
    of Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (the pine wood
    nematode) as regards areas in Portugal, other than those in which it is known
    not to occur (notified under document C(2009) 10046)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 17 décembre 2009 modifiant la décision
    2006/133/CE exigeant des États membres qu’ils prennent provisoirement des mesures
    supplémentaires contre la propagation de Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al . (nématode du pin) à partir des zones du Portugal autres
    que celles où son absence est attestée [notifiée sous le numéro C(2009) 10046]
  type: main
- language: de
  script: Latn
  content: Beschluss der Kommission vom 17. Dezember 2009 zur Änderung der Entscheidung
    2006/133/EG zur Verpflichtung der Mitgliedstaaten, vorübergehend zusätzliche
    Maßnahmen gegen die Verbreitung von Bursaphelenchus xylophilus (Steiner et Buhrer)
    Nickle et al. (dem Kiefernfadenwurm) gegenüber anderen Gebieten Portugals zu
    treffen als denjenigen, in denen dieser Schadorganismus bekanntermaßen nicht
    vorkommt (Bekannt gegeben unter Aktenzeichen K(2009) 10046)
  type: main
- language: bg
  script: Cyrl
  content: '2009/993/ЕС: Решение на Комисията от 17 декември
    2009 година за изменение на Решение 2006/133/ЕО относно
    изискване към държавите-членки временно да
    вземат допълнителни мерки срещу разпространението
    на Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (нематод
    по боровата дървесина) по отношение на области
    в Португалия, различни от тези, в които е известно,
    че заболяването не се среща (нотифицирано под
    номер C(2009) 10046)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. prosince 2009 , kterým se mění rozhodnutí
    2006/133/ES, kterým se po členských státech žádá dočasné přijetí doplňujících
    opatření proti šíření háďátka Bursaphelenchus xylophilus (Steiner et
    Buhrer) Nickle et al. z oblastí Portugalska, mimo oblasti, v nichž byla potvrzena
    jeho nepřítomnost (oznámeno pod číslem K(2009) 10046)
  type: main
- language: da
  script: Latn
  content: Kommissionens afgørelse af 17. december 2009 om ændring af beslutning
    2006/133/EF om et krav til medlemsstaterne om midlertidigt at træffe supplerende
    foranstaltninger mod spredning af Bursaphelenchus xylophilus (Steiner et Buhrer)
    Nickle et al. (fyrretræsnematoden) for så vidt angår andre områder i Portugal
    end dem, hvor den vides ikke at forekomme (meddelt under nummer K(2009) 10046)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής, της 17ης Δεκεμβρίου
    2009 , για την τροποποίηση της απόφασης 2006/133/ΕΚ
    που απαιτεί από τα κράτη μέλη να λάβουν, προσωρινά,
    συμπληρωματικά μέτρα κατά της εξάπλωσης του
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . [νηματώδης
    σκώληκας των κωνοφόρων (ΝΣΚ)] όσον αφορά ορισμένες
    περιοχές στην Πορτογαλία, εκτός εκείνων στις
    οποίες διαπιστώθηκε ότι δεν έχει εμφανιστεί
    ο ΝΣΚ [κοινοποιηθείσα υπό τον αριθμό Ε(2009) 10046]
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus 17. detsember 2009 , millega muudetakse komisjoni otsust
    2006/133/EÜ, millega kohustatakse liikmesriike võtma ajutiselt haigusetekitaja
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . (männi nematood)
    leviku takistamiseks lisameetmeid Portugali muude alade suhtes kui need, kus kõnealust
    haigustekitajat teadaolevalt ei esine (teatavaks tehtud numbri K(2009) 10046 all)
  type: main
- language: fi
  script: Latn
  content: Komission päätös, annettu 17 päivänä joulukuuta 2009 , jäsenvaltioille
    esitetystä vaatimuksesta toteuttaa väliaikaisia lisätoimenpiteitä Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. -puuntuhoojan (mäntyankeroisen)
    leviämisen estämiseksi muilla kuin sellaisilla Portugalin alueilla, joista tiedetään,
    ettei sitä esiinny niillä, tehdyn päätöksen 2006/133/EY muuttamisesta (tiedoksiannettu
    numerolla K(2009) 10046)
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata ( 2009. december 17. ) a Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (a fenyőfa fonalférge) elterjedése elleni,
    Portugáliának az attól ismerten mentes területein kívüli más területeire
    vonatkozó ideiglenes kiegészítő intézkedéseknek a tagállamok számára
    történő előírásáról szóló 2006/133/EK határozat módosításáról
    (az értesítés a C(2009) 10046. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 dicembre 2009 , recante modifica della
    decisione 2006/133/CE che prescrive agli Stati membri di adottare, a titolo provvisorio,
    misure supplementari contro la propagazione di Bursaphelenchus xylophilus (Steiner
    e Buhrer) Nickle et al. (nematode del pino) per quanto riguarda le regioni del
    Portogallo diverse da quelle notoriamente indenni da questo organismo [notificata
    con il numero C(2009) 10046]
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums ( 2009. gada 17. decembris ), ar kuru groza Lēmumu 2006/133/EK,
    ar ko dalībvalstīm pieprasa veikt īslaicīgus papildu pasākumus pret Bursaphelenchus
    xylophilus ( Steiner et Buhrer ) Nickle et al. (priedes koksnes nematode) izplatību
    tajās Portugāles teritorijās, kurās iespējama tās izplatība (izziņots
    ar dokumenta numuru C(2009) 10046)
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 17 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    2006/133/EB, kuriuo reikalaujama, kad valstybės narės laikinai imtųsi papildomų
    priemonių dėl Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al .
    (pušinio stiebinio nematodo) plitimo Portugalijos rajonuose, išskyrus tuos,
    kuriuose jis nepasitaikė (pranešta dokumentu Nr. C(2009) 10046)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kummissjoni tas- 17 ta’ Diċembru 2009 li temenda d-Deċizjoni
    2006/133/KE li teħtieġ li l-Istati Membri temporanjament jieħdu miżuri kontra
    t-tixrid tal- Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (in-nematodu
    tal-pini) f’dak li jirrigwardja żoni fil-Portugall, apparti minn dawk li fihom
    huwa magħruf li ma teżistix (notifikata bid-dokument numru C(2009) 10046)
  type: main
- language: nl
  script: Latn
  content: Besluit van de Commissie van 17 december 2009 tot wijziging van Beschikking
    2006/133/EG tot tijdelijke verplichting van de lidstaten om ten aanzien van andere
    gebieden in Portugal dan die waarvan bekend is dat Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (het dennenaaltje) er niet voorkomt, aanvullende
    maatregelen te nemen teneinde de verspreiding ervan tegen te gaan (Kennisgeving
    geschied onder nummer C(2009) 10046)
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 17 grudnia 2009 r. zmieniająca decyzję 2006/133/WE
    zobowiązującą państwa członkowskie do tymczasowego podjęcia dodatkowych
    środków przeciwko rozprzestrzenianiu się Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (węgorek sosnowiec) w odniesieniu do obszarów w Portugalii
    innych niż te, na których organizm ten nie występuje (notyfikowana jako dokument
    nr C(2009) 10046)
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 17 de Dezembro de 2009 , que altera a Decisão
    2006/133/CE que requer que os Estados-Membros adoptem temporariamente medidas
    suplementares contra a propagação de Bursaphelenchus xylophilus (Steiner et
    Buhrer) Nickle et al. (nemátodo da madeira do pinheiro) no que diz respeito a
    zonas de Portugal, com excepção daquelas em que a sua ausência é conhecida
    [notificada com o número C(2009) 10046]
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 17 decembrie 2009 de modificare a Deciziei 2006/133/CE
    privind obligația statelor membre de a lua măsuri suplimentare provizorii împotriva
    răspândirii Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al. (nematodul
    lemnului de pin) începând cu zonele Portugaliei, altele decât cele unde este
    atestată absența sa [notificată cu numărul C(2009) 10046]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 17. decembra 2009 , ktorým sa mení a dopĺňa
    rozhodnutie 2006/133/ES, v ktorom sa od členských štátov vyžaduje dočasné
    prijatie ďalších opatrení proti šíreniu Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (háďatko borovicové) v súvislosti s oblasťami v
    Portugalsku okrem oblastí, v ktorých jeho výskyt nie je známy [oznámené
    pod číslom K(2009) 10046]
  type: main
- language: sl
  script: Latn
  content: Sklep Komisije z dne 17. decembra 2009 o spremembi Odločbe 2006/133/ES
    o zahtevi, da države članice začasno sprejmejo dodatne ukrepe proti širjenju
    borove ogorčice Bursaphelenchus xylophilus (Steiner in Buhrer) Nickle et al.
    , na območjih Portugalske, razen območij, kjer je znano, da se ne pojavlja (notificirano
    pod dokumentarno številko C(2009) 10046)
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 17 de diciembre de 2009 , que modifica la
    Decisión 2006/133/CE, por la que se exige a los Estados miembros que adopten,
    con carácter temporal, medidas complementarias contra la propagación de Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. (el nematodo de la madera del pino),
    en lo que respecta a zonas de Portugal distintas de aquellas en las que se haya
    comprobado su ausencia [notificada con el número C(2009) 10046]
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 17 december 2009 om ändring av beslut 2006/133/EG
    om att ålägga medlemsstaterna att tillfälligt vidta ytterligare åtgärder
    mot spridningen av Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al
    . (tallvedsnematoden) när det gäller andra områden i Portugal än sådana där
    det är känt att den inte förekommer [delgivet med nr K(2009) 10046]
  type: main
