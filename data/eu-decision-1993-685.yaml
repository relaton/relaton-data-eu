title:
- language: en
  script: Latn
  content: '93/685/EC: Commission Decision of 16 December 1993 on the eligibility
    of expenditure to be incurred in 1994 by Greece and Ireland for the purpose of
    ensuring compliance with the Community system for the conservation and management
    of fishery resources (Only the English and Greek texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/685/CE: Décision de la Commission du 16 décembre 1993 relative à
    l''éligibilité des dépenses à effectuer par la Grèce et l''Irlande au cours
    de l''année 1994 pour assurer le respect du régime communautaire de conservation
    et de gestion des ressources de pêche (Les textes en langues anglaise et grecque
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
