    Erstattungsfähigkeit von Ausgaben Griechenlands und Irlands im Jahr 1994 zur
    Gewährleistung der Einhaltung der gemeinschaftlichen Regelung für die Erhaltung
    und Bewirtschaftung der Fischereiressourcen (Nur der englische und der griechische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/685/EF: KOMMISSIONENS BESLUTNING af 16. december 1993 om refusionsberettigelsen
