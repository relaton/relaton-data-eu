    den engelske og den græske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '93/685/ΕΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 16ης Δεκεμβρίου
