    a unei taxe antidumping definitive la importurile de alcool furfurilic originare
    din Republica Populară Chineză ca urmare a unei reexaminări privind un nou
    exportator în temeiul articolului 11 alineatul (4) din Regulamentul (CE) nr.
    1225/2009
  type: main
