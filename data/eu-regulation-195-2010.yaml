    antidumping definitivo sulle importazioni di alcool furfurilico originarie della
    Repubblica popolare cinese, in seguito a un riesame nuovi esportatori a norma
    dell'articolo 11, paragrafo 4, del regolamento (CE) n. 1225/2009
  type: main
- language: lv
  script: Latn
