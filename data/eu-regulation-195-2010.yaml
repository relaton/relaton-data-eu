title:
- language: en
  script: Latn
  content: Implementing Regulation of the Council (EU) No 195/2010 of 1 March 2010
    amending Regulation (EU) No 1202/2009 imposing a definitive anti-dumping duty
    on imports of furfuryl alcohol originating in the People’s Republic of China
    following a new exporter review pursuant to Article 11(4) of Regulation (EC) No
    1225/2009
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n o 195/2010 du Conseil du 1 er mars 2010
    modifiant le règlement (UE) n o 1202/2009 instituant un droit antidumping définitif
    sur les importations d'alcool furfurylique originaire de la République populaire
    de Chine à l'issue d'un réexamen au titre de nouvel exportateur effectué en
    vertu de l'article 11, paragraphe 4, du règlement (CE) n o 1225/2009
  type: main
- language: de
