title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2015/1521 of 14 September 2015 repealing Decision
    2013/320/CFSP in support of physical security and stockpile management activities
    to reduce the risk of illicit trade in small arms and light weapons (SALW) and
    their ammunition in Libya and its region
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2015/1521 du Conseil du 14 septembre 2015 abrogeant la
    décision 2013/320/PESC à l'appui des activités de sécurité physique et de
    gestion des stocks visant à réduire le risque de commerce illicite d'armes légères
    et de petit calibre (ALPC) et de leurs munitions en Libye et dans sa région
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2015/1521 des Rates vom 14. September 2015 zur Aufhebung
    des Beschlusses 2013/320/GASP des Rates zur Unterstützung von Maßnahmen zur
    physischen Sicherung und Verwaltung von Lagerbeständen, um die Gefahr des unerlaubten
    Handels mit Kleinwaffen und leichten Waffen und der dazugehörigen Munition in
    Libyen und in der Region zu verringern
  type: main
- language: bg
  script: Cyrl
  content: Решение (ОВППС) 2015/1521 на Съвета от 14 септември
    2015 година за отмяна на Решение 2013/320/ОВППС в
    подкрепа на действията в областта на физическата
    сигурност и управлението на запасите с цел
    намаляване на риска от незаконна търговия
    с малки оръжия и леки въоръжения (МОЛВ) и боеприпаси
    за тях в Либия и в региона
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (SZBP) 2015/1521 ze dne 14. září 2015 o zrušení rozhodnutí
    2013/320/SZBP na podporu činností v oblasti fyzické bezpečnosti a řízení
    zásob střeliva s cílem snížit riziko nedovoleného obchodu s ručními palnými
    a lehkými zbraněmi a střeliva pro ně v Libyi a v okolním regionu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (FUSP) 2015/1521 af 14. september 2015 om ophævelse
    af afgørelse 2013/320/FUSP om aktiviteter til støtte for fysisk sikkerhed og
    lagerforvaltning med henblik på at mindske risikoen for ulovlig handel med håndvåben
    og lette våben (SALW) og ammunition hertil i Libyen og den omkringliggende region
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΚΕΠΠΑ) 2015/1521 του Συμβουλίου, της
    14ης Σεπτεμβρίου 2015, σχετικά με την κατάργηση
    της απόφασης 2013/320/ΚΕΠΠΑ του Συμβουλίου για
    τη στήριξη δραστηριοτήτων που αφορούν την
    υλική ασφάλεια και τη διαχείριση αποθεμάτων
    για τη μείωση του κινδύνου της παράνομης εμπορίας
    φορητών όπλων και ελαφρού οπλισμού (ΦΟΕΟ) και
    των πυρομαχικών τους στη Λιβύη και την ευρύτερη
    περιοχή της
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (ÜVJP) 2015/1521, 14. september 2015, millega tunnistatakse
    kehtetuks otsus 2013/320/ÜVJP füüsilise julgeoleku ja varude haldamisega seotud
    tegevuse toetamiseks, et vähendada Liibüas ja selle piirkonnas väike- ja kergrelvade
    ning nende laskemoonaga ebaseaduslikult kauplemise ohtu
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (YUTP) 2015/1521, annettu 14 päivänä syyskuuta 2015,
    pienaseiden ja kevyiden aseiden sekä niissä käytettävien ampumatarvikkeiden
    laittoman kaupan riskin pienentämiseksi Libyassa ja sen lähialueilla toteutettavien
    fyysiseen turvallisuuteen ja varastojen hallintaan liittyvien toimien tukemisesta
    annetun päätöksen 2013/320/YUTP kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (ZVSP) 2015/1521 od 14. rujna 2015. o stavljanju izvan snage
    Odluke 2013/320/ZVSP o potpori aktivnostima fizičkog osiguranja zaliha i upravljanja
    zalihama kako bi se smanjio rizik od nezakonite trgovine malim i lakim oružjem
    (SALW) te pripadajućim streljivom u Libiji i njezinoj regiji
  type: main
- language: hu
  script: Latn
  content: A Tanács (KKBP) 2015/1521 határozata (2015. szeptember 14.) a Líbiában
