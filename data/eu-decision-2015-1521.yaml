    lőszerek tiltott kereskedelme kockázatának csökkentését célzó fizikai
    biztonsági és készletkezelési tevékenységek támogatásáról szóló 2013/320/KKBP
    határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2015/1521 del Consiglio, del 14 settembre 2015, che abroga
    la decisione 2013/320/PESC a sostegno delle attività connesse alla sicurezza
    fisica e alla gestione delle scorte per la riduzione del rischio di traffico illegale
    di armi leggere e di piccolo calibro (SALW) e relative munizioni in Libia e nella
    sua regione
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (KĀDP) 2015/1521 (2015. gada 14. septembris), ar ko atceļ
    Lēmumu 2013/320/KĀDP, atbalstot fiziskās drošības un krājumu apsaimniekošanas
    pasākumus, lai samazinātu kājnieku ieroču un vieglo ieroču (VIKI) nelikumīgas
    tirdzniecības risku Lībijā un tās reģionā
  type: main
- language: lt
  script: Latn
  content: 2015 m. rugsėjo 14 d. Tarybos sprendimas (BUSP) 2015/1521, kuriuo panaikinamas
    Sprendimas 2013/320/BUSP, kuriuo remiama fizinio saugumo ir atsargų valdymo veikla,
    kad būtų sumažintas neteisėtos prekybos šaulių ir lengvaisiais ginklais
    (ŠLG) bei jų šaudmenimis pavojus Libijoje ir regione
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (PESK) 2015/1521 tal-14 ta' Settembru 2015 li tħassar
    id-Deċiżjoni tal-Kunsill 2013/320/PESK b'appoġġ għas-sigurtà fiżika u l-attivitajiet
    relatati mal-ġestjoni tal-ħażniet biex jitnaqqas ir-riskju tal-kummerċ illeċitu
    fl-armi ħfief u ta' kalibru żgħir (SALW) u l-munizzjon tagħhom fil-Libja u
    r-reġjun tagħha
  type: main
- language: nl
  script: Latn
  content: Besluit (GBVB) 2015/1521 van de Raad van 14 september 2015 tot intrekking
    van Besluit 2013/320/GBVB betreffende activiteiten ter ondersteuning van de fysieke
    beveiliging en het voorraadbeheer met het doel het risico op illegale handel in
    handvuurwapens en lichte wapens (SALW) en de munitie daarvoor in Libië en de
    regio te voorkomen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (WPZiB) 2015/1521 z dnia 14 września 2015 r. uchylająca
    decyzję 2013/320/WPZiB dotyczącą wspierania działań w zakresie bezpieczeństwa
    fizycznego i zarządzania zapasami w celu ograniczenia ryzyka nielegalnego handlu
    bronią strzelecką i lekką (BSiL) oraz amunicją do tych rodzajów broni w Libii
    i regionie
  type: main
- language: pt
  script: Latn
  content: Decisão (PESC) 2015/1521 do Conselho, de 14 de setembro de 2015, que revoga
    a Decisão 2013/320/PESC em apoio às atividades no domínio da segurança física
    e da gestão de arsenais, com vista a reduzir o risco de tráfico de armas ligeiras
    e de pequeno calibre (ALPC) e respetivas munições na Líbia e região circundante
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2015/1521 a Consiliului din 14 septembrie 2015 de abrogare
    a Deciziei 2013/320/PESC de sprijinire a activităților de securitate fizică
    și gestionare a stocurilor pentru reducerea riscului de comerț ilicit cu arme
    de calibru mic și armament ușor (SALW) și muniția aferentă în Libia și
    în regiunea acesteia
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (SZBP) 2015/1521 zo 14. septembra 2015 o zrušení rozhodnutia
    2013/320/SZBP na podporu činností v oblasti fyzickej bezpečnosti a riadenia
    zásob v záujme zníženia rizika nedovoleného obchodovania s ručnými a ľahkými
    zbraňami (RĽZ) a ich muníciou v Líbyi a jej regióne
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (SZVP) 2015/1521 z dne 14. septembra 2015 o razveljavitvi Sklepa
    2013/320/SZVP o podpori dejavnostim fizične zaščite in upravljanja zalog za
    zmanjšanje nevarnosti nedovoljene trgovine z osebnim in lahkim orožjem ter pripadajočim
    strelivom v Libiji in njeni regiji
  type: main
- language: es
  script: Latn
  content: Decisión (PESC) 2015/1521 del Consejo, de 14 de septiembre de 2015, por
    la que se deroga la Decisión 2013/320/PESC en apoyo de las actividades de seguridad
    física y gestión de arsenales a fin de reducir el riesgo de comercio ilícito
    de armas pequeñas y armas ligeras (APAL) y de sus municiones en Libia y su región
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (Gusp) 2015/1521 av den 14 september 2015 om upphävande
