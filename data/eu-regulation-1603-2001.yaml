    à la quantité de référence de chaque opérateur traditionnel dans le cadre
    des contingents tarifaires à l'importation de bananes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1603/2001 der Kommission vom 3. August 2001 zur Änderung
