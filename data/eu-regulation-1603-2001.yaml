    applicabili al quantitativo di riferimento di ogni operatore tradizionale nel
    quadro dei contingenti tariffari per l'importazione di banane
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1603/2001 van de Commissie van 3 augustus 2001 houdende
