    ed il regolamento (CEE) n. 338/79 che stabilisce disposizioni particolari per
    i vini di qualità prodotti in regioni determinate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1303/79 van de Raad van 25 juni 1979 tot wijziging
