    nr. 338/79 om fastlæggelse af særlige regler for kvalitetsvine fra bestemte
    dyrkningsområder
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1303/79 del Consiglio, del 25 giugno 1979, che modifica
