- language: en
  script: Latn
  content: Council Regulation (EEC) No 1303/79 of 25 June 1979 amending Regulation
    (EEC) No 337/79 on the common organization of the market in wine and Regulation
    (EEC) No 338/79 laying down special provisions relating to quality wines produced
    in specified regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1303/79 du Conseil, du 25 juin 1979, modifiant le
    règlement (CEE) n° 337/79 portant organisation commune du marché viti-vinicole
    ainsi que le règlement (CEE) n° 338/79 établissant des dispositions particulières
    relatives aux vins de qualité produits dans des régions déterminées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1303/79 des Rates vom 25. Juni 1979 zur Änderung
    der Verordnung (EWG) Nr. 337/79 über die gemeinsame Marktorganisation für Wein
    sowie der Verordnung (EWG) Nr. 338/79 zur Festlegung besonderer Vorschriften für
    Qualitätsweine bestimmter Anbaugebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1303/79 af 25. juni 1979 om ændring af forordning
