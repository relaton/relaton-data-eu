    les pommes de table importées en provenance des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2566/77 der Kommission vom 22. November 1977 zur Ermächtigung
    des Königreichs Dänemark zur vollen Anwendung des Gemeinsamen Zolltarifs für
    aus Drittländern eingeführte Tafeläpfel
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2566/77 af 22. november 1977 om bemyndigelse
