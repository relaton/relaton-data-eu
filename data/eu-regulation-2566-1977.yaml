  content: Commission Regulation (EEC) No 2566/77 of 22 November 1977 authorizing
    the Kingdom of Denmark to apply in full the Common Customs Tariff to dessert apples
    imported from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2566/77 de la Commission, du 22 novembre 1977, autorisant
