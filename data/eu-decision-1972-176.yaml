title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 avril 1972, autorisant la République
    française à exclure du traitement communautaire certains couteaux, de la position
    Ex 82.09 du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/176/EWG: Entscheidung der Kommission vom 10. April 1972, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Messer der Tarifnummer ex 82.09
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/176/CEE: Decisione della Commissione, del 10 aprile 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario taluni coltelli
    della voce n. ex 82.09 della tariffa doganale comune, originari del Giappone e
    messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/176/EEG: Beschikking van de Commissie van 10 april 1972 waarbij de
    Franse Republiek wordt gemachtigd bepaalde messen, van post ex 82.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
