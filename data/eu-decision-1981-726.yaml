title:
- language: en
  script: Latn
  content: '81/726/EEC: Commission Decision of 4 August 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, originating in the People''s Republic
    of China (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/726/CEE: Décision de la Commission, du 4 août 1981, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée originaire de la République populaire de Chine
    (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/726/EWG: Entscheidung der Kommission vom 4. August 1981 zur Ermächtigung
    der Französischen Republik, aus der Volksrepublik China stammende Handschuhe
    aus Gewirken, weder gummielastisch noch kautschutiert, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/726/EØF: Kommissionens beslutning af 4. august 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer af trikotage, ikke elastisk eller gummeret, med oprindelse i Den kinesiske
    Folkerepublik (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/726/EOK: Απόφαση τής Επιτροπής τής 4ης Αυγούστου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά πλεκτά χειρόκτια, μή ελαστικά ούτε επενδυμένα
    μέ καουτσούκ, καταγωγής Λαϊκής Δημοκρατίας
    τής Κίνας (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/726/CEE: Decisione della Commissione, del 4 agosto 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata originari della Repubblica popolare cinese (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/726/EEG: Beschikking van de Commissie van 4 augustus 1981 houdende
    machtiging van de Franse Republiek om handschoenen, wanten en dergelijke artikelen,
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk van oorsprong uit
    de Volksrepubliek China van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)'
