  script: Latn
  content: COMMISSION REGULATION (EC) No 186/98 of 23 January 1998 determining the
    extent to which applications lodged in January 1998 for import licences for certain
    pigmeat sector products under the regime provided for by Council Regulation (EC)
    No 774/94 opening and providing for the administration of certain Community tariff
    quotas for pigmeat and certain other agricultural products can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 186/98 DE LA COMMISSION du 23 janvier 1998 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1998 pour certains produits du secteur de la viande de porc peuvent être
    acceptées dans le cadre du régime prévu par le règlement (CE) n° 774/94 du
    Conseil portant ouverture et mode de gestion de certains contingents tarifaires
    communautaires pour la viande porcine et certains autres produits agricoles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 186/98 DER KOMMISSION vom 23. Januar 1998 über die
    Festsetzung des Umfangs, in dem die im Januar 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse des Schweinefleischsektors entsprechend der Regelung
    der Verordnung (EG) Nr. 774/94 des Rates zur Eröffnung und Verwaltung gemeinschaftlicher
    Zollkontingente für Schweinefleisch und bestimmte andere landwirtschaftliche
    Erzeugnisse genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 186/98 af 23. januar 1998 om fastsættelse
