  content: Commission Regulation (EEC) No 3457/92 of 30 November 1992 laying down
    detailed rules concerning the inspection certificate for imports from third countries
    into the Community provided for in Council Regulation (EEC) No 2092/91 on organic
    production of agricultural products and indications referring thereto on agricultural
    products and foodstuffs
