    della direttiva 2000/29/CE del Consiglio riguardo alle piante di Vitis L., ad
    eccezione dei frutti, originarie della Svizzera [notificata con il numero C(2001)
    3764]'
  type: main
- language: nl
  script: Latn
  content: '2001/836/EG: Beschikking van de Commissie van 27 november 2001 tot machtiging
