title:
- language: en
  script: Latn
  content: '2001/836/EC: Commission Decision of 27 November 2001 authorising the Member
    States temporarily to provide for derogations from certain provisions of Council
    Directive 2000/29/EC in respect of plants of Vitis L., other than fruits, originating
    in Switzerland (notified under document number C(2001) 3764)'
  type: main
- language: fr
  script: Latn
  content: '2001/836/CE: Décision de la Commission du 27 novembre 2001 autorisant
    les États membres à prévoir à titre temporaire des dérogations à certaines
    dispositions de la directive 2000/29/CE du Conseil pour les végétaux de Vitis
    L., à l''exception des fruits, originaires de Suisse [notifiée sous le numéro
    C(2001) 3764]'
  type: main
- language: de
  script: Latn
  content: '2001/836/EG: Entscheidung der Kommission vom 27. November 2001 zur Ermächtigung
    der Mitgliedstaaten, für Pflanzen von Vitis L., außer Früchten, mit Ursprung
    in der Schweiz vorübergehend Ausnahmen von bestimmten Vorschriften der Richtlinie
    2000/29/EG des Rates zuzulassen (Bekannt gegeben unter Aktenzeichen K(2001) 3764)'
  type: main
- language: da
  script: Latn
  content: '2001/836/EF: Kommissionens beslutning af 27. november 2001 om bemyndigelse
    af medlemsstaterne til midlertidigt at indrømme undtagelser fra visse bestemmelser
    i Rådets direktiv 2000/29/EF for planter af Vitis L., dog ikke frugter, med oprindelse
    i Schweiz (meddelt under nummer K(2001) 3764)'
  type: main
- language: el
  script: Grek
  content: '2001/836/ΕΚ: Απόφαση της Επιτροπής, της 27ης
    Νοεμβρίου 2001, που επιτρέπει στα κράτη μέλη
