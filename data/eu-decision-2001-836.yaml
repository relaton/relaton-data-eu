    διατάξεις της οδηγίας 2000/29/ΕΚ του Συμβουλίου
    σχετικά με τα φυτά Vitis L, με εξαίρεση τους καρπούς,
    καταγωγής Ελβετίας [κοινοποιηθείσα υπό τον
    αριθμό Ε(2001) 3764]'
  type: main
- language: fi
  script: Latn
  content: '2001/836/EY: Komission päätös, tehty 27 päivänä marraskuuta 2001,
    luvan antamisesta jäsenvaltioille säätää tilapäisistä poikkeuksista Sveitsistä
    peräisin olevia muita Vitis L. -suvun kasveja kuin hedelmiä koskeviin neuvoston
    direktiivin 2000/29/EY säännöksiin (tiedoksiannettu numerolla K(2001) 3764)'
  type: main
- language: it
  script: Latn
  content: '2001/836/CE: Decisione della Commissione, del 27 novembre 2001, che autorizza
