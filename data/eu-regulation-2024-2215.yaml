  content: Commission Implementing Regulation (EU) 2024/2215 of 6 September 2024 establishing,
    pursuant to Regulation (EU) 2024/573 of the European Parliament and of the Council,
    minimum requirements for the issuance of certificates to natural and legal persons
    and the conditions for the mutual recognition of such certificates, as regards
    stationary refrigeration, air conditioning and heat pump equipment, organic Rankine
    cycles and refrigeration units of refrigerated trucks, refrigerated trailers,
    refrigerated light-duty vehicles, intermodal containers and train wagons containing
    fluorinated greenhouse gases or their alternatives, and repealing Commission Implementing
    Regulation (EU) 2015/2067
  type: main
- language: fr
