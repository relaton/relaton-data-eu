id: EUDecision198154
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '81/54/EEC: Commission Decision of 19 January 1981 authorizing the French
    Republic not to apply Community treatment to radio receivers, whether or not incorporating
    sound recorders or reproducers originating in South Korea, Hong Kong, Japan and
    Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/54/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    la République française à exclure du traitement communautaire les appareils
    récepteurs de radio, même combinés avec un appareil d''enregistrement ou de
    reproduction du son, originaires de Corée du Sud, de Hong-kong, du Japon et de
    T''ai-wan (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/54/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    der Französischen Republik, aus Südkorea, Hongkong, Japan und Taiwan stammende
    Empfangsgeräte für Rundfunk (einschließlich der kombinierten Empfänger) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/54/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage modtagere til
    radio, også kombineret med lydoptagere eller lydgengivere, med oprindelse i Sydkorea,
    Hongkong, Japan og Taiwan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/54/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Γαλλικής Δημοκρατίας
    νά αποκλείσει από τήν κοινοτική μεταχείριση
    συσκευές λήψεως γιά τή ραδιοφωνία έστω καί
    συνδυασμένες μέ συσκευή εγγραφής ή αναπαραγωγής
    τού ήχου (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/54/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    riceventi per la radiodiffusione, anche combinati con un apparecchio di registrazione
    o di riproduzione del suono, originari della Corea del Sud, di Hong Kong, del
    Giappone e di Taiwan (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/54/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van de Franse Republiek om ontvangtoestellen voor radio-omroep, ook indien met
    ingebouwd toestel voor het opnemen of voor het weergeven van geluid, van oorsprong
    uit Zuid-Korea, Hong-Kong, Japan en Taiwan, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
