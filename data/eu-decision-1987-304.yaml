    der Einfuhren von aus Südkorea stammenden und in der Gemeinschaft im freien Verkehr
    befindlichen Textilwaren (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/304/EØF: Kommissionens beslutning af 12. maj 1987 om bemyndigelse
