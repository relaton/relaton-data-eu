title:
- language: en
  script: Latn
  content: '87/304/EEC: Commission Decision of 12 May 1987 authorizing the Kingdom
    of Denmark to apply intra- Community surveillance to imports of certain textile
    products originating in South Korea which have been put into free circulation
    in the Community (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/304/CEE: Décision de la Commission du 12 mai 1987 autorisant le Royaume
    du Danemark à procéder à une surveillance intracommunautaire des importations
    de certains produits textiles originaires de Corée du Sud et mis en libre pratique
    dans la Communauté (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/304/EWG: Entscheidung der Kommission vom 12. Mai 1987 zur Ermächtigung
