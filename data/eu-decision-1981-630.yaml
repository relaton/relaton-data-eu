type: standard
title:
- language: en
  script: Latn
  content: '81/630/EEC: Commission Decision of 5 June 1981 authorizing the French
    Republic to apply intra-Community surveillance to imports of products originating
    in a non-member country which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/630/CEE: Décision de la Commission, du 5 juin 1981, autorisant la
    République française à instaurer une surveillance intracommunautaire des importations
    de certains produits originaires d''un pays tiers et mis en libre pratique dans
    la Communauté, susceptibles de faire l''objet de mesures de protection au titre
    de l''article 115 du traité (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '81/630/EWG: Entscheidung der Kommission vom 5. Juni 1981 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus einem Drittland stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren, für die Schutzmaßnahmen gemäß Artikel 115 des
    Vertrages ergriffen werden können (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/630/EØF: Kommissionens beslutning af 5. juni 1981 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse produkter, der har oprindelse i et tredjeland og er overgået til fri
    omsætning i Fællesskabet, og som kan gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/630/ΕΟΚ: Απόφαση τής Επιτροπής τής 5ης Ιουνίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών ορισμένων προϊόντων, καταγωγής
    τρίτων χωρών, τά οποία τίθενται σέ ελεύθερη
    κυκλοφορία στήν Κοινότητα καί επί τής εισαγωγής
    τών οποίων δύνανται νά εφαρμοσθούν μέτρα προστασίας
    δυνάμει τού άρθρου 115 τής συνθήκης (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/630/CEE: Decisione della Commissione, del 5 giugno 1981, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di prodotti originari di un paese terzo e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/630/EEG: Beschikking van de Commissie van 5 juni 1981 houdende machtiging
    van de Franse Republiek tot instelling van een intracommunautair toezicht ten
    aanzien van de invoer van produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het EEG-Verdrag (Slechts de tekst in de
    Franse taal is authentiek)'
  type: main
