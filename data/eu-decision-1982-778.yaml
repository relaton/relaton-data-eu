  content: '82/778/EEC: Commission Decision of 4 November 1982 establishing that the
    apparatus described as ''FPS - Array Processor, model AP-120 B'' may not be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/778/CEE: Décision de la Commission, du 4 novembre 1982, constatant
    que l''importation de l''appareil dénommé "FPS - Array Processor, model AP-120
    B" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/778/EWG: Entscheidung der Kommission vom 4. November 1982, mit der
    festgestellt wird, daß das Gerät ,,F.P.S. - Array Processor, model AP-120 B"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
