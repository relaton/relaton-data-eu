title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2128/88 of 18 July 1988 re-establishing
    the levying of customs duties on gloves, mittens and mitts, not knitted or crocheted,
    products of category 87 (order No 40.0870) and wadding of textile materials and
    articles thereof, flock, dust and mill neps, products of category 94 (order No
    40.0940), originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2128/88 de la Commission du 18 juillet 1988 portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    autre qu' en bonneterie de la catégorie de produits n° 87 (numéro d' ordre
    40.0870) et aux ouates de matières textiles et articles de ces ouates, tontisses,
    noeuds et noppes de la catégorie de produits n° 94 (numéro d' ordre 40.0940),
    originaires de la Corée du Sud, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2128/88 der Kommission vom 18. Juli 1988 zur Wiedereinführung
    des Zollsatzes für Handschuhe, andere als aus Gewirken, der Warenkategorie Nr.
    87 (lfd. Nr. 40.0870) und für Watte und Waren daraus, Scherstaub, Knoten und
    Noppen der Warenkategorie Nr. 94 (lfd. Nr. 40.0940) mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2128/88 af 18. juli 1988 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer, ikke af trikotage,
    under varekategori nr. 87 (løbenummer 40.0870) og for vat af tekstilmateriale
    og varer deraf, flok, støv og nopper, under varekategori nr. 94 (løbenummer
    40.0940), som har oprindelse i Sydkorea og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2128/88 της Επιτροπής
    της 18ης Ιουλίου 1988 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για γάντια, εκτός
    από πλεκτά, προϊόντα της κατηγορίας 87 (αύξων
    αριθμός 40.0870), και βάτα από υφαντικές ύλες και
    είδη από βάτα, υφαντικές ίνες, προϊόντα της
    κατηγορίας 94 (αύξων αριθμός 40.0940), καταγωγής
    Νότιας Κορέας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3783/87 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2128/88 della Commissione del 18 luglio 1988 che ripristina
    la riscossione dei dazi doganali applicabili ai guanti, esclusi quelli a maglia,
    della categoria di prodotti n. 87 (numero d' ordine 40.0870) e alle ovatte di
    materie tessili e manufatti di tali ovatte, borre di cimatura, nodi e groppetti
    della categoria di prodotti n. 94 (numero d' ordine 40.0940), originari della
    Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2128/88 van de Commissie van 18 juli 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke, andere dan van brei- of haakwerk, van de categorie van produkten
    nr. 87 (volgnummer 40.0870), en op watten van textielstof en artikelen daarvan,
    scheerhaar en noppen, van de categorie van produkten nr. 94 (volgnummer 40.0940),
    van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3783/87 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2128/88 da Comissão de 18 de Julho de 1988 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis às luvas, com excepção
    das de malha, da categoria de produtos n.° 87 (n.° de ordem 40.0870), e às
    pastas (ouates) de matérias têxteis e respectivas obras, poeiras, nós e borbotos,
    da categoria de produtos n.° 94 (n.° de ordem 40.0940), originários da Coreia
    do Sul, beneficiária das preferências pautais previstas no Regulamento (CEE)
    n.° 3783/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2128/88 de la Comisión de 18 de julio de 1988 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los guantes, que no sean de punto, de la categoría n° 87 (número de orden
    40.0870), a las guatas de materias textiles y artículos de guata, tundiznos,
    nudos y motas, de la categoría n° 94 (número de orden 40.0940), originarios
    de Corea del Sur, beneficiaria de las preferencias arancelarias previstas por
    el Reglamento (CEE) n° 3783/87 del Consejo
  type: main
