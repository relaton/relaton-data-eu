title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 663/78 of 3 April 1978 re-establishing the
    levying of customs duties on other goatskin and kidskin leather, other, falling
    within subheading 41.04 B II and originating in India, to which the preferential
    tariff arrangements set out in Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 663/78 de la Commission, du 3 avril 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, non dénommées, de la sous-position tarifaire 41.04 B II, originaires
    de l'Inde, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 663/78 der Kommission vom 3. April 1978 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder der Tarifstelle 41.04 B
    II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 663/78 af 3. april 1978 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidskind, andre varer,
    underposition 41.04 B II, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 663/78 della Commissione, del 3 aprile 1978, che ripristina
    la riscossione dei dazi doganali applicabili alle altre pelli caprine, non nominate,
    della sottovoce doganale 41.04 B II, originarie dell'India beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 663/78 van de Commissie van 3 april 1978 houdende
    vederinstelling van de heffing van de douanerechten van toepassing op ander geiteleder,
    overige, van post 41.04 B II, van oorsprong uit India, ten behoeve waarvan bij
    Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
