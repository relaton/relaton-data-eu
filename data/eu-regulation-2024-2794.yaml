title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2794 of 31 October 2024 amending
    Implementing Regulation (EU) 2021/1378 as regards the recognition of certain control
    bodies in accordance with Article 46 of Regulation (EU) 2018/848 of the European
    Parliament and of the Council as competent to carry out controls and issue organic
    certificates in third countries for the purpose of imports of organic products
    into the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2794 de la Commission du 31 octobre
    2024 modifiant le règlement d’exécution (UE) 2021/1378 en ce qui concerne
    la reconnaissance, conformément à l’article 46 du règlement (UE) 2018/848
    du Parlement européen et du Conseil, de certains organismes de contrôle comme
    ayant compétence pour effectuer les contrôles et délivrer des certificats biologiques
    dans les pays tiers aux fins des importations de produits biologiques dans l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/2794 der Kommission vom 31. Oktober
    2024 zur Änderung der Durchführungsverordnung (EU) 2021/1378 in Bezug auf die
    Anerkennung bestimmter Kontrollstellen, die für die Durchführung von Kontrollen
    und die Ausstellung von Öko-/Bio-Zertifikaten in Drittländern für die Zwecke
    der Einfuhr ökologischer/biologischer Erzeugnisse in die Union zuständig sind,
    gemäß Artikel 46 der Verordnung (EU) 2018/848 des Europäischen Parlaments und
    des Rates
  type: main
