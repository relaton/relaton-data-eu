title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1358/79 of 29 June 1979 derogating from
    Regulation (EEC) No 3006/78 as regards the calculation of the amount of the reduction
    of import charges for beef and veal products from the African, Caribbean and Pacific
    States for the period beginning 2 July 1979
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1358/79 de la Commission, du 29 juin 1979, portant
    dérogation au règlement (CEE) n° 3006/78 en ce qui concerne le calcul des montants
    de diminution des charges à l' importation de produits du secteur de la viande
    bovine originaires des États d' Afrique, des Caraïbes et du Pacifique pour la
    période débutant le 2 juillet 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1358/79 der Kommission vom 29. Juni 1979 zur Abweichung
    von der Verordnung (EWG) Nr. 3006/78 betreffend die Berechnung der Beträge zur
    Senkung der Einfuhrbelastung für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean für den am 2. Juli 1979
    beginnenden Zeitraum
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1358/79 af 29. juni 1979 om undtagelse
    fra forordning (EØF) nr. 3006/78 med hensyn til beregningen af de beløb, hvormed
    importbelastningerne nedsættes ved indførsel af oksekød fra lande i Afrika,
    Vestindien og Stillehavet i den periode, der begynder den 2. juli 1979
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1358/79 della Commissione, del 29 giugno 1979, recante
    deroga al regolamento (CEE) n. 3006/78 per quanto concerne il calcolo degli importi
    di cui vengono diminuiti gli oneri all' importazione di prodotti del settore delle
    carni bovine, originari degli Stati africani, dei Caraibi e del Pacifico, per
    il periodo che inizia il 2 luglio 1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1358/79 van de Commissie van 29 juni 1979 houdende
    afwijking van Verordening (EEG) nr. 3006/78 ten aanzien van de berekening van
    de met ingang van 2 juli 1979 toe te passen vermindering van de belastingen op
    de invoer van produkten in de sector rundvlees uit de Staten in Afrika, het Caribische
    gebied en de Stille Oceaan
  type: main
