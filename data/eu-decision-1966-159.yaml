title:
- language: fr
  script: Latn
  content: Décision 66/159/CEE de la Commission, du 14 février 1966, portant nouvelle
    modification de sa décision du 10 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, dans la République italienne, de dextrines
    fabriquées à partir de fécule de pommes de terre ainsi que de fécules de pommes
    de terre solubles ou torréfiées, en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '66/159/EWG: Entscheidung der Kommission vom 14. Februar 1966 zur erneuten
    Änderung ihrer Entscheidung vom 10. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Dextrin auf der Grundlage von Kartoffelstärke und von löslicher
    oder gerösteter Kartoffelstärke aus verschiedenen Mitgliedstaaten in die Italienische
    Republik'
  type: main
- language: it
  script: Latn
  content: '66/159/CEE: Decisione della Commissione, del 14 febbraio 1966, che modifica
    nuovamente la decisione del 10 novembre 1964 che autorizza la riscossione di tasse
    di compensazione all''importazione, nella Repubblica italiana, di destrine fabbricate
    con fecola di patate, e cosi pure di fecole di patate solubili o torrefatte provenienti
    di alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/159/EEG: Beschikking van de Commissie van 14 februari 1966 tot nieuwe
    wijziging van haar beschikking van 10 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Italiaanse Republiek van
    dextrine vervaardigd uit aardappelzetmeel, oplosbaar of geroost aardappelzetmeel,
    uit bepaalde Lid- Staten'
  type: main
