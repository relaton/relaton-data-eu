    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van het Koninkrijk België van door de Rijksdienst
    voor Arbeidsvoorziening (R.V.A.) gemaakte herscholings- en verplaatsingskosten'
