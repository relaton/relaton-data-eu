  content: '72/498/CEE: Décision de la Commission du 22 décembre 1972, portant octroi
    du concours du Fonds social européen, prévu à l''article 125 du Traité, au
    bénéfice du Royaume de Belgique, pour des dépenses relatives à des opérations
    de rééducation professionnelle et de réinstallation effectuées par l''Office
    national de l''emploi (ONEM)'
  type: main
- language: de
  script: Latn
  content: '72/498/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an das
    Königreich Belgien zu Aufwendungen für vom "Office National de l''Emploi (ONEM)"
    durchgeführte Berufsumschulungs- und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/498/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore del Regno del Belgio per spese relative ad operazioni
    di riqualificazione professionale e di nuova sistemazione effettuate dall''Office
    national de l''emploi (ONEM)'
  type: main
- language: nl
  script: Latn
