title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 119/2004 of 23 January 2004 establishing
    the extent to which import licences applied for under subquota II for frozen meat
    of bovine animals, as provided for in Regulation (EC) No 780/2003, may be granted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 119/2004 de la Commission du 23 janvier 2004 déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposés pour le sous-contingent II de viandes bovines congelées, prévu par
    le règlement (CE) n° 780/2003
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 119/2004 der Kommission vom 23. Januar 2004 zur Bestimmung
    des Umfangs, in welchem den Anträgen auf Einfuhrlizenzen für das gemäß der
    Verordnung (EG) Nr. 780/2003 vorgesehene Unterkontingent II für gefrorenes Rindfleisch
    stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 119/2004 af 23. januar 2004 om fastsættelse
    af, i hvilket omfang ansøgningerne om importlicenser for frosset oksekød under
    delkontingent II som fastsat i forordning (EF) nr. 780/2003 kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 119/2004 της Επιτροπής,
    της 23ης Ιανουαρίου 2004, ο οποίος προσδιορίζει
    σε ποιο βαθμό μπορούν να ικανοποιηθούν οι αιτήσεις
    πιστοποιητικών εισαγωγής που κατατέθηκαν
    για την υποποσόστωση ΙΙ κατεψυγμένου βοδινού
    κρέατος η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 780/2003
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 119/2004, annettu 23 päivänä tammikuuta 2004,
    asetuksessa (EY) N:o 780/2003 säädetyn jäädytettyä naudanlihaa koskevan osakiintiön
    II osalta jätettyjen tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 119/2004 della Commissione, del 23 gennaio 2004, che
    stabilisce in quale misura possano essere accolte le domande di titoli d'importazione
    presentate per il sottocontingente II di carni bovine congelate previsto dal regolamento
    (CE) n. 780/2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 119/2004 van de Commissie van 23 januari 2004 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen voor
    invoercertificaten voor het in Verordening (EG) nr. 780/2003 bedoelde deelcontingent
    II voor bevroren rundvlees
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 119/2004 da Comissão, de 23 de Janeiro de 2004,
    que determina em que medida pode ser dado seguimento aos pedidos de certificados
    de importação apresentados relativamente ao subcontingente II de carne de bovino
    congelada previsto pelo Regulamento (CE) n.° 780/2003
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 119/2004 de la Comisión, de 23 de enero de 2004, por
    el que se determina en qué medida puede darse curso a las solicitudes de certificado
    de importación presentadas en relación con el subcontingente II de carne de
    vacuno congelada previsto en el Reglamento (CE) n° 780/2003
  type: main
- language: sv
  script: Latn
