title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 413/85 of 18 February 1985 re-establishing
    the levying of the customs duties on footwear, other, falling within subheading
    64.02 B and originating in the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 413/85 de la Commission du 18 février 1985 portant
    rétablissement de la perception des droits de douane applicables aux chaussures,
    autres, de la sous-position 64.02 B du tarif douanier commun, originaires des
    Philippines, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 413/85 der Kommission vom 18. Februar 1985 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe, andere, der Tarifstelle 64.02 B mit Ursprung
    in den Philippinen, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 413/85 af 18. februar 1985 om genindførelse
    af opkrævning af told for fodtøj, andre, henhørende under pos. 64.02 B og med
    oprindelse i Filippinerne, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 413/85 της Επιτροπής
    της 18ης Φεβρουαρίου 1985 περί αποκαταστάσεως
    της εφαρμογής των δασμών για υποδήματα, έτερα,
    της διακρίσεως 64.02 Β του Κοινού Δασμολογίου,
    καταγωγής Φιλιππίνων, δικαιούχων των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 413/85 della Commissione del 18 febbraio 1985 che
    ripristina la riscossione dei dazi doganali applicabili alle calzature, altre,
    della sottovoce 64.02 B della tariffa doganale comune, originarie delle Filippine
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3562/84
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 413/85 van de Commissie van 18 februari 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op schoeisel,
    ander, van post 64.02 B van het gemeenschappelijk douanetarief, van oorsprong
    uit de Filippijnen, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde
    tariefpreferenties zijn verleend
