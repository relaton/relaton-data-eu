title:
- language: en
  script: Latn
  content: '88/395/EEC: Commission Decision of 15 June 1988 requiring Italy to rescind
    the further measures taken to protect itself against the introduction of harmful
    organisms associated with fresh cultivated mushrooms (Only the Italian text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/395/CEE: Décision de la Commission du 15 juin 1988 invitant l''Italie
    à révoquer les nouvelles mesures prises en vue de se préserver contre l''introduction
    d''organismes nuisibles associés à des champignons cultivés frais (Le texte
    en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/395/EWG: Entscheidung der Kommission vom 15. Juni 1988 zur Aufforderung
    Italiens, die weiteren Maßnahmen aufzuheben, die es zum Schutz gegen die Einschleppung
    von Schadorganismen in Verbindung mit frischen Zuchtpilzen getroffen hat (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/395/EØF: Kommissionens beslutning af 15. juni 1988 om krav til Italien
    om at ophæve de yderligere foranstaltninger, landet har truffet for at beskytte
    sig mod indslæbning af skadegørere i forbindelse med friske, dyrkede svampe
    (Kun den italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '88/395/ΕΟΚ: Απόφαση της Επιτροπής της 15ης
    Ιουνίου 1988 με την οποία καλείται η Ιταλία να
    ανακαλέσει τα περαιτέρω μέτρα που έλαβε για
    να προστατευθεί από την εισαγωγή επιβλαβών
    οργανισμών που έχουν σχέση με τα νωπά καλλιεργημένα
    μανιτάρια (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '88/395/CEE: Decisione della Commissione del 15 giugno 1988 che invita
    l''Italia a revocare le nuove misure adottate al fine di premunirsi contro l''introduzione
    di organismi nocivi associati a funghi coltivati freschi (Il testo in lingua italiana
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '88/395/EEG: Beschikking van de Commissie van 15 juni 1988 waarbij Italië
    wordt verzocht de nieuwe beschermende maatregelen tegen het binnenbrengen van
    met verse gekweekte paddestoelen in verband gebrachte schadelijke organismen in
    te trekken (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '88/395/CEE: Decisão da Comissão de 15 de Junho de 1988 que determina
    a revogação pela Itália das medidas adicionais tomadas com vista a proteger-se
    contra a introdução de organismos prejudiciais associados com cogumelos frescos
    cultivados (Apenas faz fé o texto em língua italiana)'
  type: main
- language: es
  script: Latn
  content: '88/395/CEE: Decisión de la Comisión de 15 de junio de 1988 por la que
    se solicita a Italia que revoque las medidas complementarias adoptadas para protegerse
    contra la introducción de organismos nocivos asociados a los champiñones frescos
    (El texto en lengua italiana es el único auténtico)'
