title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2083/82 of 28 July 1982 determining to what
    extent applications for import licences lodged in the month of July 1982 for high-quality
    fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2083/82 de la Commission, du 28 juillet 1982, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d'importation
    déposées au mois de juillet 1982 pour les viandes bovines de haute qualité,
    fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2083/82 der Kommission vom 28. Juli 1982 zur Bestimmung
    des Maßstabs für die Genehmigung der im Monat Juli 1982 eingereichten Anträge
    auf Einfuhrlizenzen für frisches, gekühltes oder gefrorenes Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2083/82 af 28. juli 1982 om fastsættelse
    af i hvilket omfang ansøgninger om importlicenser, som er indgivet i juli måned
    1982 for oksekød af høj kvalitet, fersk, kølet eller frosset, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2083/82 της Επιτροπής
    της 28ης Ιουλίου 1982 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, πού
    έχουν υποβληθεί κατά το μήνα Ιούλιο του 1982,
    για βόειο κρέας υψηλής ποιότητος, νωπό, διατηρημένο
    με απλή ψύξη η κατεψυγμένο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2083/82 della Commissione, del 28 luglio 1982, che
    determina in quale misura possono essere accolte le domande di titoli d'importazione
    presentate nel mese di luglio 1982 per le carni bovine di qualità pregiata, fresche,
    refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2083/82 van de Commissie van 28 juli 1982 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de certificaataanvragen die in
    de maand juli 1982 zijn ingediend voor de invoer van vers, gekoeld of bevroren
    kwaliteitsrundvlees
  type: main
