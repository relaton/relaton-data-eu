title:
- language: fr
  script: Latn
  content: Décision de la Commission du 31 juillet 1963 relative aux recours de la
    République fédérale d'Allemagne à l'article 115 alinéa 1 du Traité, pour
    exclure du traitement communautaire certains produits originaires de pays tiers
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '63/492/EWG: Entscheidung der Kommission vom 31. Juli 1963 über den auf
    Artikel 115 Absatz (1) des Vertrages gestützten Antrag der Bundesrepublik Deutschland,
    einige Erzeugnisse aus dritten Ländern, die sich in den übrigen Mitgliedstaaten
    im freien Verkehr befinden, von der Gemeinschaftsregelung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '63/492/CEE: Decisione della Commissione del 31 luglio 1963 relativa al
    ricorso della Repubblica federale di Germania all''articolo 115, comma 1, del
    Trattato, per escludere dal trattamento comunitario alcuni prodotti originari
    da paesi terzi, immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '63/492/EEG: Beschikking van de Commissie van 31 juli 1963 betreffende
    de verzoeken van de Bondsrepubliek Duitsland om op grond van artikel 115, alinea
    1, van het Verdrag bepaalde produkten die van oorsprong zijn uit derde landen
    en in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
