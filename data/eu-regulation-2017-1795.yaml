  content: Commission Implementing Regulation (EU) 2017/1795 of 5 October 2017 imposing
    a definitive anti-dumping duty on imports of certain hot-rolled flat products
    of iron, non-alloy or other alloy steel originating in Brazil, Iran, Russia and
    Ukraine and terminating the investigation on imports of certain hot-rolled flat
    products of iron, non-alloy or other alloy steel originating in Serbia
  type: main
- language: fr
  script: Latn
