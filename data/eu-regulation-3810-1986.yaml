title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3810/86 of 11 December 1986 opening, allocating
    and providing for the administration of a Community tariff quota for boysenberries,
    preserved by freezing, not containing added sugar, intended for any form of processing
    except for the manufacture of jam entirely from boysenberries, falling within
    subheading ex 08.10 D of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3810/86 du Conseil du 11 décembre 1986 portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire pour
    des "boysenberries", congelées, sans addition de sucre, destinées à toute transformation,
    à l' exception de la fabrication de confiture entièrement de "boysenberries",
    relevant de la sous-position ex 08.10 D du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3810/86 des Rates vom 11. Dezember 1986 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für Boysenbeeren,
    gefroren, ohne Zusatz von Zucker, für jegliche Verarbeitung, ausgenommen zum
    Herstellen von vollständig aus Boysenbeeren bestehender Konfitüre, der Tarifstelle
    ex 08.10 D des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3810/86 af 11. december 1986 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for boysenbær, frosne,
    ikke tilsat sukker, bestemt til al slags forarbejdning med undtagelse af fremstilling
    af marmelade udelukkende af boysenbær, henhørende under pos. ex 08.10 D i den
    fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3810/86 του Συμβουλίου
    της 11ης Δεκεμβρίου 1986 για το άνοιγμα την κατανομή
    και τον τρόπο διαχείρισης μιας κοινοτικής
    δασμολογικής ποσόστωσης για «boysenberries», κατεψυγμένα
    χωρίς προσθήκη ζάχαρης, που προορίζονται για
    οποιαδήποτε μεταποίηση εκτός από την παρασκευή
    μαρμελάδας εξ ολοκλήρου από «boysenberries» της διάκρισης
    ex 08.10 Δ του κοινού δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3810/86 del Consiglio dell' 11 dicembre 1986 recante
    apertura, ripartizione e modalità di gestione di un contingente tariffario comunitario
    per i "boysenberries", congelati, senza aggiunta di zucchero, destinati a tutte
    le trasformazioni eccetto la produzione di marmellata interamente a base di "boysenberries",
    della sottovoce ex 08.10 D della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3810/86 van de Raad van 11 december 1986 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor boysenbessen, bevroren, zonder toegevoegde suiker, bestemd voor elke verwerking
    behalve voor geheel op basis van boysenbessen vervaardigde jam, van post ex 08.10
    D van het gemeenschappelijk douanetarief
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3810/86 do Conselho de 11 de Dezembro de 1986 relativo
