title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/832 of 28 May 2015 initiating
    an investigation concerning the possible circumvention of countervailing measures
    imposed by Council Implementing Regulation (EU) No 1239/2013 on imports of crystalline
    silicon photovoltaic modules and key components (i.e. cells) originating in or
    consigned from the People's Republic of China by imports of crystalline silicon
    photovoltaic modules and key components (i.e. cells) consigned from Malaysia and
    Taiwan, whether declared as originating in Malaysia and Taiwan or not, and making
    such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/832 de la Commission du 28 mai 2015 portant
    ouverture d'une enquête relative à un éventuel contournement des mesures compensatoires
    instituées par le règlement d'exécution (UE) n° 1239/2013 sur les importations
    de modules photovoltaïques en silicium cristallin et leurs composants essentiels
    (cellules) originaires ou en provenance de la République populaire de Chine par
    des importations de modules photovoltaïques en silicium cristallin et leurs composants
    essentiels (cellules) expédiés de Malaisie et de Taïwan, qu'ils aient ou non
    été déclarés originaires de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/832 der Kommission vom 28. Mai 2015
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) Nr. 1239/2013 des Rates eingeführten Ausgleichsmaßnahmen
    gegenüber den Einfuhren von Fotovoltaikmodulen aus kristallinem Silicium und
    Schlüsselkomponenten davon (Zellen) mit Ursprung in oder versandt aus der Volksrepublik
    China durch aus Malaysia und Taiwan versandte Einfuhren von Fotovoltaikmodulen
    aus kristallinem Silicium und Schlüsselkomponenten davon (Zellen), ob als Ursprungserzeugnisse
    Malaysias oder Taiwans angemeldet oder nicht, und zur zollamtlichen Erfassung
    dieser Einfuhren
  type: main
