    (ou seja, células), expedidos da Malásia e de Taiwan, independentemente de serem
    ou não declarados originários da Malásia e de Taiwan, e que torna obrigatório
    o registo dessas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/832 al Comisiei din 28 mai
    2015 de deschidere a unei anchete privind eventuala eludare a măsurilor compensatorii
    instituite prin Regulamentul de punere în aplicare (UE) nr. 1239/2013 al Consiliului
    la importurile de module fotovoltaice pe bază de siliciu cristalin și componentele
    lor cheie (și anume celule) originare sau expediate din Republica Populară Chineză
    prin importuri de module fotovoltaice pe bază de siliciu cristalin și componentele
    lor cheie (și anume celule) expediate din Malaysia și din Taiwan, indiferent
