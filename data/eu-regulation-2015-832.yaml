    għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/832 van de Commissie van 28 mei 2015 tot
    opening van een onderzoek naar de mogelijke ontwijking van de bij Uitvoeringsverordening
    (EU) nr. 1239/2013 van de Raad ingestelde compenserende maatregelen ten aanzien
    van fotovoltaïsche modules van kristallijn silicium en de belangrijkste componenten
    daarvan (cellen), van oorsprong uit of verzonden uit de Volksrepubliek China,
    door de invoer van fotovoltaïsche modules van kristallijn silicium en de belangrijkste
    componenten daarvan (cellen) verzonden uit Maleisië en Taiwan, al dan niet aangegeven
    als van oorsprong uit Maleisië en Taiwan, en tot onderwerping van deze invoer
    aan registratie
  type: main
