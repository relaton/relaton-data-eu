  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/832 z 28. mája 2015, ktorým
    sa začína prešetrovanie týkajúce sa možného obchádzania vyrovnávacích
    opatrení uložených vykonávacím nariadením Rady (EÚ) č. 1239/2013 na dovoz
    fotovoltických modulov na báze kryštalického kremíka a hlavných komponentov
    (t. j. článkov) s pôvodom v Čínskej ľudovej republike alebo odosielaných
    z Čínskej ľudovej republiky prostredníctvom dovozu fotovoltických modulov
    na báze kryštalického kremíka a hlavných komponentov (t. j. článkov) odosielaných
    z Malajzie a Taiwanu, ktoré majú alebo nemajú deklarovaný pôvod v Malajzii
    alebo na Taiwane, a na základe ktorého sa zavádza registrácia takéhoto dovozu
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/832 z dne 28. maja 2015 o začetku
    preiskave glede morebitnega izogibanja izravnalnim ukrepom, uvedenim z Izvedbeno
    uredbo Sveta (EU) št. 1239/2013 na uvoz fotonapetostnih modulov iz kristalnega
    silicija in njihovih ključnih sestavnih delov (tj. celic) s poreklom iz Ljudske
    republike Kitajske ali ki so od tam poslani, z uvozom fotonapetostnih modulov
    iz kristalnega silicija in njihovih ključnih sestavnih delov (tj. celic), poslanih
    iz Malezije in s Tajvana, ne glede na to, ali so deklarirani kot izdelek s poreklom
    iz Malezije in s Tajvana ali ne, in o registraciji takega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/832 de la Comisión, de 28 de mayo de
    2015, por el que se abre una investigación sobre la posible elusión de las medidas
    compensatorias establecidas por el Reglamento de Ejecución (UE) n° 1239/2013
    del Consejo sobre las importaciones de módulos fotovoltaicos de silicio cristalino
    y componentes clave (a saber, células) originarios o procedentes de la República
    Popular China, mediante importaciones de módulos fotovoltaicos de silicio cristalino
