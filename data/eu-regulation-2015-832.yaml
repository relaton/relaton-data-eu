  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/832 av den 28 maj 2015
    om inledande av en undersökning rörande ett eventuellt kringgående av de utjämningsåtgärder
    som infördes genom rådets genomförandeförordning (EU) nr 1239/2013 på import
    av solcellsmoduler av kristallint kisel och väsentliga komponenter (dvs. celler)
    med ursprung i eller avsända från Folkrepubliken Kina genom import av solcellsmoduler
    av kristallint kisel och väsentliga komponenter (dvs. celler) som avsänts från
    Malaysia och Taiwan, oavsett om produktens deklarerade ursprung är Malaysia och
    Taiwan eller inte, och om registrering av sådan import
