    независимо дали е с деклариран произход от
    Малайзия и Тайван, и за въвеждане на регистрационен
    режим по отношение на този внос
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/832 ze dne 28. května 2015 o
    zahájení šetření možného obcházení vyrovnávacích opatření uložených
    prováděcím nařízením Rady (EU) č. 1239/2013 na dovoz krystalických křemíkových
    fotovoltaických modulů a jejich klíčových komponentů (tj. článků) pocházejících
