title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2026/1832 of 28 July 2026 concerning
    the renewal of the authorisation of benzoic acid as a feed additive for weaned
    piglets, pigs for fattening, sows, minor porcine species for fattening, and sows
    and boars of minor porcine species (holder of authorisation: DSM Nutritional Products
    Ltd represented by DSM Nutritional Products Sp. z.o.o.), and repealing Implementing
    Regulations (EU) 2016/900, (EU) 2018/983, (EU) 2018/1550 and (EU) 2020/1031'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2026/1832 de la Commission du 28 juillet
    2026 concernant le renouvellement de l’autorisation de l’acide benzoïque
    en tant qu’additif pour l’alimentation des porcelets sevrés, des porcs d’engraissement,
    des truies, des espèces porcines mineures destinées à l’engraissement et
    des truies et verrats d’espèces porcines mineures (titulaire de l’autorisation:
    DSM Nutritional Products Ltd, représenté par DSM Nutritional Products Sp. z.o.o.),
    et abrogeant les règlements d’exécution (UE) 2016/900, (UE) 2018/983, (UE)
    2018/1550 et (UE) 2020/1031'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2026/1832 der Kommission vom 28. Juli 2026
    zur Verlängerung der Zulassung von Benzoesäure als Zusatzstoff in Futtermitteln
    für Absetzferkel, Mastschweine, Sauen, Mastschweinearten von geringerer wirtschaftlicher
    Bedeutung sowie Sauen und Eber von Schweinearten von geringerer wirtschaftlicher
    Bedeutung (Zulassungsinhaber: DSM Nutritional Products Ltd, vertreten durch DSM
    Nutritional Products Sp. z.o.o.) und zur Aufhebung der Durchführungsverordnungen
    (EU) 2016/900, (EU) 2018/983, (EU) 2018/1550 und (EU) 2020/1031'
  type: main
- language: bg
