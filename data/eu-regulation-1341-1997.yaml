    sotto forma di merci non comprese nell'allegato II del trattato, le modalità
    comuni di applicazione relative alla concessione delle restituzioni all'esportazione
    e i criteri per stabilire il loro importo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1341/97 van de Commissie van 11 juli 1997 houdende
