    maataloustuotteiden vientituen myöntämisjärjestelmän soveltamista koskevista
    yksityiskohtaisista säännöistä ja tuen vahvistamisperusteista annetun asetuksen
    (EY) N:o 1222/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1341/97 della Commissione dell'11 luglio 1997 che modifica
