title:
- language: en
  script: Latn
  content: '93/31/EEC: Commission Decision of 16 December 1992 amending Decision 89/380/EEC
    authorizing certain Member States provisionally to provide for derogations from
    certain provisions of Council Directive 77/93/EEC, in respect of plants of Pinus
    L. originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '93/31/CEE: Décision de la Commission, du 16 décembre 1992, modifiant
    la décision 89/380/CEE autorisant certains Etats membres à prévoir provisoirement
    des dérogations à certaines dispositions de la directive 77/93/CEE du Conseil
    pour les végétaux de Pinus L. originaires du Japon'
  type: main
- language: de
  script: Latn
  content: '93/31/EWG: Entscheidung der Kommission vom 16. Dezember 1992 zur Änderung
    der Entscheidung 89/380/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten,
    für Pflanzen von Pinus L. mit Ursprung in Japan Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen'
  type: main
- language: da
  script: Latn
  content: '93/31/EØF: Kommissionens beslutning af 16. december 1992 om ændring
