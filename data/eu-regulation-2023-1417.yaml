    2-metil-2-pentenojsko kislino, 6-metilhept-5-en-2-on, undekan-2-on, oktan-2-on,
    nonan-2-on, oktan-3-on, tridekan-2-on, 5-metilhept-2-en-4-on, dodekano-1,5-lakton,
    tetradekano-1,5-lakton, 5-metilfurfural, 4-fenilbut-3-en-2-on, p-anizil alkohol,
    4-metoksibenzaldehid, piperonal, vanilin, p-anizil acetat, benzil benzoat, izobutil
    salicilat, izopentil salicilat, benzil salicilat in difenil eter kot krmne dodatke
    za vse živalske vrste
