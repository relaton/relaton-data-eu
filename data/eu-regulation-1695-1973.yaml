title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1695/73 of the Council of 25 June 1973 determining
    to what extent the monetary compensatory amounts applicable to beef and veal by
    reason of the depreciation of a currency may be higher than the charge on imports
    from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1695/73 du Conseil, du 25 juin 1973, déterminant
    dans quelle mesure les montants compensatoires monétaires applicables dans le
    secteur de la viande bovine en raison d'une dépréciation d'une monnaie peuvent
    être supérieurs à la charge à l'importation en provenance des pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1695/73 des Rates vom 25. Juni 1973 zur Bestimmung,
    inwieweit die für Rindfleisch anzuwendenden Währungsausgleichsbeträge wegen
    der niedrigeren Bewertung einer Währung höher sein können als die Belastung
    bei der Einfuhr aus Drittländern
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1695/73 af 25. juni 1973 om bestemmelse af
    i hvilken udstrækning de monetære udligningsbeløb for oksekød som følge af
    en nedskrivning af en valuta kan være højere end importbelastninger ved indførsel
    fra tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1695/73 del Consiglio, del 25 giugno 1973, che determina
    in quale misura gli importi compensativi monetari applicabili nel settore delle
    carni bovine, in seguito ad un deprezzamento di una moneta, possono essere superiori
    all'onere all'importazione in provenienza dai paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1695/73 van de Raad van 25 juni 1973 houdende vaststelling
    van de mate waarin de monetaire compenserende bedragen die in de sector rundvlees
    van toepassing zijn ten gevolge van de waardedaling van een munteenheid hoger
    kunnen zijn dan de belasting bij invoer uit derde landen
  type: main
