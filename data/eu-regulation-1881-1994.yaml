  content: Council Regulation (EC) No 1881/94 of 24 July 1994 amending Regulation
    (EEC) No 2072/92 fixing the target price for milk and the intervention prices
    for butter, skimmed-milk powder and Grana Padano and Parmigiano Reggiano cheeses
    for two annual periods from 1 July 1993 to 30 June 1995
