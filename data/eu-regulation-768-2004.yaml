title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 768/2004 of 23 April 2004 determining to
    what extent applications lodged in April 2004 for the right to import bulls, cows
    and heifers other than for slaughter of certain Alpine and mountain breeds can
    be met
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 768/2004 de la Commission du 23 avril 2004 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois d'avril 2004 pour l'importation de taureaux, vaches et génisses,
    autres que ceux destinés à la boucherie, de certaines races alpines et de montagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 768/2004 der Kommission vom 23. April 2004 zur Bestimmung
    des Umfangs, in welchem den im April 2004 gestellten Anträgen auf Einfuhrrechte
    für die Einfuhr nicht zum Schlachten bestimmter Stiere, Kühe und Färsen bestimmter
    Höhenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 768/2004 af 23. april 2004 om det omfang,
    i hvilket der kan imødekommes ansøgninger om importrettigheder, som er indgivet
    i april 2004 vedrørende import af tyre, køer og kvier af bestemte alpine racer
    og bjergracer, ikke bestemt til slagtning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 768/2004 της Επιτροπής,
    της 23ης Απριλίου 2004, για καθορισμό στο βαθμό
    κατά τον οποίο μπορεί να δοθεί συνέχεια στις
    αιτήσεις δικαιωμάτων εισαγωγής που κατατίθενται
    τον Απρίλιο 2003 για την εισαγωγή ταύρων, αγελάδων
    και δαμάλεων, άλλων πλην των προοριζομένων
    προς σφαγή, ορισμένων αλπικών και ορεσίβιων
    φυλών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 768/2004, annettu 23 päivänä huhtikuuta 2004,
    tiettyihin alppi- ja vuoristorotuihin kuuluvien muiden kuin teuraseläimiksi tarkoitettujen
    sonnien, lehmien ja hiehojen tuonnista huhtikuussa 2004 jätettyjen tuontioikeushakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 768/2004 della Commissione, del 23 aprile 2004, che
    stabilisce in quale misura è possibile accogliere le domande di diritti d'importazione
    presentate nel mese di aprile 2004 per l'importazione di tori, vacche e giovenche,
    diversi da quelli destinati alla macellazione, di alcune razze alpine e di montagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 768/2004 van de Commissie van 23 april 2004 tot vaststelling
    van de aantallen dieren waarvoor gevolg kan worden gegeven aan de aanvragen om
    rechten op invoer die in april 2004 zĳn ingediend voor de invoer van stieren,
    koeien en vaarzen, niet bestemd voor de slacht, van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 768/2004 da Comissão, de 23 de Abril de 2004, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação,
    apresentados em Abril de 2004 para a importação de touros, vacas e novilhas,
    com exclusão dos destinados ao abate, de certas raças alpinas e de montanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 768/2004 de la Comisión, de 23 de abril de 2004, por
    el que se determina cómo se satisfacen las solicitudes de derechos de importación
    presentadas en el mes de abril de 2004 para la importación de toros, vacas y
    novillas no destinados al matadero, de determinadas razas alpinas y de montaña
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 768/2004 av den 23 april 2004 om i vilken
    utsträckning de ansökningar om importrättigheter som inlämnats i april 2004
    kan beviljas för import av tjurar, kor och kvigor av vissa alp- och bergraser
    som inte är slaktboskap
  type: main
