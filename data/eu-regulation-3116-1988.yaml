  content: Commission Regulation (EEC) No 3116/88 of 10 October 1988 re-establishing
    the levying of customs duties on woven fabrics of synthetic filament, sacks and
    bags of a kind used for the packing of goods, products of category 33 (order No
    40.0330), originating in the Philippines, to which the preferential tariff arrangements
    set out in Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3116/88 de la Commission du 10 octobre 1988 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fils de filaments synthétiques, sacs et sachets d' emballage de la catégorie
    de produits n° 33 (numéro d' ordre 40.0330), originaires des Philippines et
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3783/87 du Conseil
  type: main
