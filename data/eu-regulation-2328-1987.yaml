title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2328/87 of 31 July 1987 amending Regulation
    (EEC) No 4100/86 fixing the standard values to be used in calculating the financial
    compensation and the advance pertaining thereto in respect of fishery products
    withdrawn from the market for the 1987 fishery year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2328/87 de la Commission du 31 juillet 1987 modifiant
    le règlement (CEE) n° 4100/86 fixant la valeur forfaitaire des produits de la
    pêche retirés du marché pendant la campagne de pêche 1987, intervenant dans
    le calcul de la compensation financière et de l' avance y afférents
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2328/87 der Kommission vom 31. Juli 1987 zur Änderung
    der Verordnung (EWG) Nr. 4100/86 zur Festsetzung des Pauschalwerts für das Fischwirtschaftsjahr
    1987 für die aus dem Handel genommenen Fischereierzeugnisse, der zur Berechnung
    des finanziellen Ausgleichs und des entsprechenden Vorschusses dient
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2328/87 af 31. juli 1987 om ændring
    af forordning (EØF) nr. 4100/86 om fastsættelse af den ved beregningen af den
    finansielle udligning og det tilsvarende forskud anvendte forudfastsatte værdi
    af fiskerivarer, der tages tilbage fra markedet i fangstsæsonen 1987
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2328/87 της Επιτροπής
    της 31ης Ιουλίου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 4100/86 περί καθορισμού της κατ αποκοπή
    αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την περίοδο αλιείας 1987, η
    οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2328/87 della Commissione del 31 luglio 1987 che modifica
    il regolamento (CEE) n. 4100/86 che fissa, ai fini della compensazione finanziaria
    e dell' anticipo corrispondente, il valore forfettario dei prodotti della pesca
    ritirati dal mercato nella campagna di pesca 1987
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2328/87 van de Commissie van 31 juli 1987 houdende
    wijziging van Verordening (EEG) nr. 4100/86 betreffende de vaststelling van de
    forfaitaire waarde van de in het visseizoen 1987 uit de markt genomen visserijprodukten
    voor de berekening van de financiële vergoeding en het hierop betrekking hebbende
    voorschot
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2328/87 da Comissão de 31 de Julho de 1987 que
    altera o Regulamento (CEE) n.° 4100/86 que fixa para efeitos do cálculo da compensação
    financeira e do adiantamento que lhe diz respeito o valor forfetário dos produtos
    retirados do mercado durante a campanha de pesca de 1987
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2328/87 de la Comisión de 31 de julio de 1987 por
    el que se modifica el Reglamento (CEE) n° 4100/86 por el que se fija el valor
    a tanto alzado de los productos de la pesca retirados del mercado durante la campaña
    pesquera de 1987, que ha de utilizarse en el cálculo de la compensación financiera
    y del anticipo relacionado con ésta
  type: main
