title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2144/74 of the Commission of 13 August 1974 re-establishing
    the levying of customs duties on electric accumulators and lead-acid accumulators,
    falling within subheading 85.04 A, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3501/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2144/74 de la Commission, du 13 août 1974, portant
    rétablissement de la perception des droits de douane applicables aux accumulateurs
    électriques, au plomb, de la sous-position tarifaire 85.04 A, originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires par le règlement (CEE)
    n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2144/74 der Kommission vom 13. August 1974 zur Wiedereinführung
    des Zollsatzes für elektrische Akkumulatoren, Blei-Akkumulatoren, der Tarifstelle
    85.04 A, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3501/73
    des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2144/74 af 13. august 1974 om genindførelse
    af opkrævning af toldafgifter for elektriske akkumulatorer, blyakkumulatorer,
    under underposition 85.04 A, som har oprindelse i Jugoslavien, og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3501/73 af
    18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2144/74 della Commissione, del 13 agosto 1974, che
    ripristina la riscossione dei dazi doganali applicabili agli accumulatori elettrici,
    al piombo, della sottovoce doganale n. 85.04 A originari della Iugoslavia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio,
    del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2144/74 van de Commissie van 13 augustus 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op elektrische
    accumulatoren, met loden platen, van onderverdeling 85.04 A, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van de Raad
    van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
