title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1993/70 de la Commission, du 20 octobre 1970, relatif
    à la constatation qu'il peut être donné suite aux demandes déposées en vue
    de l'obtention de primes à la non-commercialisation du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1993/70 der Kommission vom 2. Oktober 1970 zur Feststellung,
    daß den zur Erlangung der Prämien für die Nichtvermarktung von Milch und Milcherzeugnissen
    eingereichten Anträgen stattgegeben werden kann
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1993/70 della Commissione, del 2 ottobre 1970, che
    constata la possibilità di dar seguito alle domande presentate per ottenere i
    premi alla non commercializzazione del latte e dei prodotti lattiero- caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1993/70 van de Commissie van 2 oktober 1970 met betrekking
    tot de constatering, dat gevolg gegeven kan worden aan de verzoeken die ter verkrijging
    van premies voor het niet in de handel brengen van melk en zuivelprodukten werden
    ingediend
  type: main
