  script: Latn
  content: Commission Regulation (EEC) No 3333/88 of 27 October 1988 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for export, amending Regulation (EEC) No 569/88
    and repealing Regulation (EEC) No 2988/88
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3333/88 de la Commission du 27 octobre 1988 relatif
