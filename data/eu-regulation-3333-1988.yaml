    (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG) Nr. 2988/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3333/88 af 27. oktober 1988 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
