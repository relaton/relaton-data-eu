  script: Latn
  content: Directiva 95/44/CE a Comisiei din 26 iulie 1995 de stabilire a condițiilor
    în care anumite organisme dăunătoare, plante, produse din plante și alte elemente
    enumerate în anexele I-V din Directiva 77/93/CEE a Consiliului pot fi introduse
    și puse în circulație în Comunitate sau în anumite zone protejate ale acesteia,
