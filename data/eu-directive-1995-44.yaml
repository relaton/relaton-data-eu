title:
- language: en
  script: Latn
  content: Commission Directive 95/44/EC of 26 July 1995 establishing the conditions
    under which certain harmful organisms, plants, plant products and other objects
    listed in Annexes I to V to Council Directive 77/93/EEC may be introduced into
    or moved within the Community or certain protected zones thereof, for trial or
    scientific purposes and for work on varietal selections
  type: main
- language: fr
  script: Latn
  content: Directive 95/44/CE de la Commission, du 26 juillet 1995, fixant les conditions
    dans lesquelles certains organismes nuisibles, végétaux, produits végétaux
    et autres objets énumérés aux annexes I à V de la directive 77/93/CEE du Conseil
    peuvent être introduits ou circuler dans la Communauté ou dans certaines zones
    protégées de la Communauté pour des travaux à des fins d'essai ou à des fins
    scientifiques ou pour des travaux sur les sélections variétales
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/44/EG der Kommission vom 26. Juli 1995 mit den Bedingungen,
    unter denen bestimmte Pflanzen, Pflanzenerzeugnisse und andere Gegenstände gemäß
    den Anhängen I bis V der Richtlinie 77/93/EWG des Rates zu Versuchs-, Forschungs-
    und Züchtungszwecken in die Gemeinschaft oder bestimmte Schutzgebiete derselben
    eingeführt oder darin verbracht werden dürfen
  type: main
- language: bg
  script: Cyrl
  content: Директива 95/44/ЕО на Комисията от 26 юли 1995
    година за определяне на условията, при които
    някои вредни организми, растения, растителни
    продукти и други предмети, посочени в приложения
    I—V към Директива 77/93/ЕИО на Съвета могат да
    бъдат въвеждани или придвижвани в рамките
    на Общността или в някои нейни защитени зони
    за опити или научни цели, както и за работа
    по сортови селекции
  type: main
- language: cs
  script: Latn
