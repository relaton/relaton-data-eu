  type: main
- language: it
  script: Latn
  content: Direttiva 95/44/CE della Commissione, del 26 luglio 1995, che stabilisce
    le condizioni alle quali taluni organismi nocivi, vegetali, prodotti vegetali
    e altri prodotti elencati negli allegati I, II, III, IV e V della direttiva 77/93/CEE
    del Consiglio possono essere introdotti o trasferiti da un luogo all'altro nella
    Comunità o in talune sue zone protette per prove o scopi scientifici e per lavori
    di selezione varietale
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva Nr. 95/44/EK (1995. gada 26. jūlijs), ar ko ievieš
    nosacījumus, kurus ievērojot, dažus kaitīgus organismus, augus, augu produktus
    un citus Padomes Direktīvas Nr. 77/93/EEK I līdz V pielikumā uzskaitītos objektus
    drīkst ievest vai pārvietot Kopienā vai dažās tās aizsargātās zonās izmēģinājumu
    vai zinātniskiem mērķiem un šķirņu selekcijas vajadzībām
  type: main
