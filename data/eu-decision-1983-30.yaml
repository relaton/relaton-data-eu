  script: Latn
  content: '83/30/EEC: Council Decision of 24 January 1983 authorizing the automatic
    renewal or continuance in force of certain friendship, trade and navigation treaties
    and similar agreements concluded between Member States and non-member countries'
  type: main
- language: fr
  script: Latn
  content: '83/30/CEE: Décision du Conseil du 24 janvier 1983 autorisant la tacite
    reconduction ou le maintien en vigueur de certains traités d'' amitié, de commerce
    et de navigation et accords similaires conclus par les États membres avec les
    pays tiers'
  type: main
- language: de
  script: Latn
  content: '83/30/EWG: Entscheidung des Rates vom 24. Januar 1983 zur Genehmigung
    der stillschweigenden Verlängerung oder der Beibehaltung bestimmter Freundschafts-,
    Handels- und Schiffahrtsverträge sowie ähnlicher Abkommen zwischen den Mitgliedstaaten
    und dritten Ländern'
  type: main
- language: da
  script: Latn
  content: '83/30/EØF: Rådets beslutning af 24. januar 1983 om bemyndigelse til
    stiltiende videreførelse eller opretholdelse af visse venskabs-, handels- og
    skibsfartstraktater og lignende aftaler, som medlemsstaterne har indgået med
    tredjelande'
  type: main
