    n. 2641/84, consistenti nell'' imposizione, in Giappone, di un diritto di porto
    utilizzato per la costituzione del fondo per la gestione dei porti (92/169/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE COMMISSIE van 9 maart 1992 tot opschorting van de onderzoekprocedure
    in verband met onrechtmatige handelspraktijken in de zin van Verordening (EEG)
    nr. 2641/84 van de Raad bestaande uit een havengeld of havenrecht dat in Japan
    is ingevoerd ten behoeve van een Fonds voor Havenbeheer (92/169/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 9 de Março de 1992 que suspende o processo de
