title:
- language: en
  script: Latn
  content: '92/169/EEC: Commission Decision of 9 March 1992 suspending the examination
    procedure concerning illicit commercial practices within the meaning of Council
    Regulation (EEC) No 2641/84 consisting of the imposition in Japan of a port charge
    or fee used for the creation of a Harbour Management Fund'
  type: main
- language: fr
  script: Latn
  content: '92/169/CEE: Décision de la Commission du 9 mars 1992 portant suspension
    de la procédure d''examen concernant des pratiques commerciales illicites au
    sens du règlement (CEE) n° 2641/84 consistant à imposer au Japon un droit de
    port destiné à la création d''un Harbour Management Fund (fonds de gestion
    portuaire)'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 9. März 1992 über die Aussetzung des Untersuchungsverfahrens
    betreffend unerlaubte Handelspraktiken im Sinne der Verordnung (EWG) Nr. 2641/84,
    die in der Einführung einer Hafengebühr für die Schaffung eines Hafenverwaltungsfonds
    in Japan bestehen (92/169/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 9. marts 1992 om suspension af undersøgelsesproceduren
    vedrørende en uretmæssig handelspraksis i den i Rådets forordning (EØF) nr.
    2641/84 angivne betydning i form af pålæggelse i Japan af en havneafgift eller
    et havnegebyr, hvoraf provenuet anvendes til opbygning af en Harbour Management
    Fund (administrationsfond) (92/169/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/169/ΕΟΚ: Απόφαση της Επιτροπής της 9ης Μαρτίου
    1992 για την αναστολή της διαδικασίας σχετικά
    με αθέμιτη εμπορική πρακτική κατά την έννοια
    του κανονισμού (ΕΟΚ) αριθ. 2641/84 του Συμβουλίου,
    η οποία συνίσταται στην επιβολή στην Ιαπωνία
    λιμενικού τέλους ή επιβάρυνσης με σκοπό τη
    δημιουργία ενός ταμείου διαχείρισης λιμένος'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 9 marzo 1992 che sospende la procedura
