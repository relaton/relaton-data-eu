  content: Commission Decision (EU) 2022/1928 of 11 October 2022 confirming the participation
    of Ireland in Regulation (EU) 2022/585 of the European Parliament and of the Council
    amending Regulations (EU) No 514/2014 laying down general provisions on the Asylum,
    Migration and Integration Fund and on the instrument for financial support for
    police cooperation, preventing and combating crime, and crisis management, (EU)
    No 516/2014 establishing the Asylum, Migration and Integration Fund and (EU) 2021/1147
    establishing the Asylum, Migration and Integration Fund
  type: main
- language: fr
  script: Latn
