    der Gemeinschaft festgestellten Preise fuer ausgewachsene Rinder und zur Ermittlung
    der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1683/90 af 21. juni 1990 om ændring
