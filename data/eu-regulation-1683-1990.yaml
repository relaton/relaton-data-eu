    εντός της Κοινότητας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1683/90 DELLA COMMISSIONE del 21 giugno 1990 recante
    modifica del regolamento (CEE) n. 610/77 relativo alla determinazione dei prezzi
    dei bovini adulti constatati sui mercati rappresentativi della Comunità e al
    rilevamento dei prezzi di taluni altri bovini nella Comunità
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1683/90 VAN DE COMMISSIE van 21 juni 1990 houdende
    wijziging van Verordening (EEG) nr. 610/77 betreffende de vaststelling van de
    op de representatieve markten van de Gemeenschap geconstateerde prijzen voor volwassen
    runderen en betreffende de constatering van de prijzen voor sommige andere runderen
    in de Gemeenschap
  type: main
