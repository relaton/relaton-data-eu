  content: Commission Regulation (EEC) No 1683/90 of 21 June 1990 amending Regulation
    (EEC) No 610/77 on the determination of prices of adult bovine animals on representative
    Community markets and the survey of prices of certain other cattle in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1683/90 de la Commission du 21 juin 1990 portant modification
    du règlement (CEE) n° 610/77 relatif à la détermination des prix des gros
    bovins constatés sur les marchés représentatifs de la Communauté et au relevé
    des prix de certains autres bovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1683/90 DER KOMMISSION vom 21. Juni 1990 zur Aenderung
