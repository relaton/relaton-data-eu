    9113 20 00 und 9113 90 10 der Kombinierten Nomenklatur mit Ursprung in Hongkong,
    der die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
