- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2905/88 of 21 September 1988 re-establishing
    the levying of customs duties on clocks with watch movements falling within CN
    code 9103 and watch-straps, watch-bands and watch-bracelets falling within CN
    codes 9113 20 00 and 9113 90 10, originating in Hong Kong to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2905/88 de la Commission du 21 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux réveils
    et pendulettes, à mouvement de montre, du code NC 9103, et aux bracelets de montres
    des codes NC 9113 20 00 et 9113 90 10, originaires de Hong-Kong et bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2905/88 DER KOMMISSION vom 21. September 1988 zur
