id: EURegulation14531979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1453/79 of 12 July 1979 re-establishing
    the levying of the customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, other, falling within subheading 70.14 B and originating
    in Hong Kong, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1453/79 de la Commission, du 12 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d' éclairage, de signalisation et d' optique commune, autre, de la sous-position
    70.14 B du tarif douanier commun, originaire de Hong-kong, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1453/79 der Kommission vom 12. Juli 1979 zur Wiedereinführung
    des Zollsatzes für andere Glaswaren für Beleuchtung, für Signalvorrichtungen
    oder zu optischen Zwecken, der Tarifstelle 70.14 B, mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1453/79 af 12. juli 1979 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas; refleksglas; optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, i andre tilfælde,
    henhørende under pos. 70.14 B i den fælles toldtarif, som har oprindelse i Hongkong
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1453/79 della Commissione, del 12 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune, altri, della sottovoce 70.14 B della tariffa
    doganale comune, originari di Hong Kong, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1453/79 van de Commissie van 12 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas ; optische elementen van gewoon glas,
    van post 70.14 B, van oorsprong uit Hong-Kong, ten behoeve waarvan bij Verordening
    (EEG) nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
