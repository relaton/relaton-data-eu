title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1459/85 of 31 May 1985 re-establishing the
    levying of the customs duties on other footwear with outer soles of leather or
    composition leather, falling within subheading 64.02 B and originating in India,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1459/85 de la Commission du 31 mai 1985 portant rétablissement
    de la perception des droits de douane applicables aux autres chaussures à semelles
    extérieures en cuir naturel, artificiel ou reconstitué, de la sous-position
    64.02 B du tarif douanier commun, originaires de l' Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1459/85 der Kommission vom 31. Mai 1985 zur Wiedereinführung
    der Erhebung der Zölle für andere Schuhe mit Laufsohlen aus Leder oder Kunstleder,
    der Tarifstelle 64.02 B mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1459/85 af 31. maj 1985 om genindførelse
    af opkrævning af told for andet fodtøj med ydersål af læder eller kunstlæder,
    henhørende under pos. 64.02 B og med oprindelse i Indien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1459/85 της Επιτροπής
    της 31ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των δασμών για έτερα υποδήματα, έχοντα το εξωτερικό
    πέλμα εκ δέρματος φυσικού, τεχνητού ή ανασχηματισμένου,
    της διακρίσεως 64.02 Β του Κοινού Δασμολογίου,
    καταγωγής Ινδίας, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1459/85 della Commissione del 31 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili alle altre calzature con suole esterne
    di cuoio naturale, artificiale o ricostituito, della sottovoce 64.02 B della tariffa
    doganale comune, originarie dell' India beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1459/85 van de Commissie van 31 mei 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander schoeisel
    met buitenzool van leder of van kunstleder, van postonderverdeling 64.02 B, van
    oorsprong uit India, waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
