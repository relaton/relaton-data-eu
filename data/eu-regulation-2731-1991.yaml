title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2731/91 of 13 September 1991 amending the
    List annexed to Regulation (EEC) No 3664/90 establishing, for 1991, the List of
    vessels exceeding eight metres length overall permitted to fish for sole within
    certain areas of the Community using beam trawls whose aggregate length exceeds
    nine metres
  type: main
- language: fr
  script: Latn
  content: REGLEMENT ( CEE ) NO 2731/91 DE LA COMMISSION, DU 13 SEPTEMBRE 1991, MODIFIANT
    LA LISTE ANNEXEE AU REGLEMENT ( CEE ) N0 3664/90 ETABLISSANT, POUR 1991, LA LISTE
    DES BATEAUX DONT LA LONGUEUR HORS TOUT DEPASSE HUIT METRES, QUI SONT AUTORISES
    A PECHER LA SOLE DANS CERTAINES ZONES DE LA COMMUNAUTE A L' AIDE DE CHALUTS A
    PERCHES DONT LA LONGUEUR TOTALE DEPASSE NEUF METRES
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2731/91 DER KOMMISSION VOM 13. SEPTEMBER 1991 ZUR
    AENDERUNG DER LISTE IM ANHANG DER VERORDNUNG ( EWG ) NR. 3664/90 ZUR FESTLEGUNG
    DER LISTE DER SCHIFFE MIT EINER LAENGE UEBER ALLES VON MEHR ALS 8 M, DIE IN BESTIMMTEN
    GEBIETEN DER GEMEINSCHAFT MIT BAUMKURREN, DEREN GESAMTBAUMLAENGE MEHR ALS 9 M
    BETRAEGT, AUF SEEZUNGE FISCHEN DUERFEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2731/91 af 13. september 1991 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 3664/90 om listen
    over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter tunge
    i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl, hvis
    samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2731/91 της Επιτροπής
    της 13ης Σεπτεμβρίου 1991 για την τροποποίηση
    του καταλόγου που είναι προσαρτημένος στον
    κανονισμό (ΕΟΚ) αριθ. 3664/90 για το 1991 για την κατάρτιση
    του καταλόγου των σκαφών συνολικού μήκους
    άνω των 8 μέτρων τα οποία επιτρέπεται να αλιεύουν
    γλώσσες σε ορισμένες περιοχές της Κοινότητας
    χρησιμοποιώντας δοκότρατες των οποίων των
    συνολικό μήκος υπερβαίνει τα 9 μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2731/91 DELLA COMMISSIONE, DEL 13 SETTEMBRE 1991,
    RECANTE MODIFICA DELL' ELENCO ALLEGATO AL REGOLAMENTO ( CEE ) N. 3664/90 CHE FISSA,
    PER IL 1991, L' ELENCO DEI PESCHERECCI DI LUNGHEZZA FUORI TUTTO SUPERIORE A OTTO
    METRI, AUTORIZZATI A PESCARE LA SOGLIOLA IN DETERMINATE ZONE DELLA COMUNITA CON
    RETI A STRASCICO A PALI, DI LUNGHEZZA COMPLESSIVA SUPERIORE A 9 METRI
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 2731/91 VAN DE COMMISSIE VAN 13 SEPTEMBER 1991
    TOT WIJZIGING VAN DE LIJST IN DE BIJLAGE BIJ VERORDENING ( EEG ) NR. 3664/90 TOT
    VASTSTELLING VAN DE LIJST VAN VAARTUIGEN MET EEN LENGTE OVER ALLES VAN MEER DAN
    8 METER EN DIE IN BEPAALDE ZONES VAN DE GEMEENSCHAP MET BOOMKORREN WAARVAN DE
    TOTALE BOOMLENGTE MEER DAN 9 METER BEDRAAGT, OP TONG MOGEN VISSEN
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 2731/91 DA COMISSAO, DE 13 DE SETEMBRO DE 1991,
    QUE ALTERA A LISTA ANEXA AO REGULAMENTO ( CEE ) NO 3664/90 QUE ESTABELECE, PARA
    1991, A LISTA DOS NAVIOS COM MAIS DE OITO METROS DE COMPRIMENTO DE FORA A FORA
    AUTORIZADOS A PESCAR LINGUADO EM DETERMINADAS ZONAS DA COMUNIDADE UTILIZANDO REDES
    DE ARRASTO DE VARA EM QUE O COMPRIMENTO TOTAL DAS VARAS SEJA SUPERIOR A NOVE METROS
  type: main
