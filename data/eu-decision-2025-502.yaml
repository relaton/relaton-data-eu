title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2025/502 of 5 March 2025 authorising
    Greece to introduce a special measure derogating from Articles 218 and 232 of
    Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/502 du Conseil du 5 mars 2025 autorisant
    la Grèce à introduire une mesure particulière dérogatoire aux articles 218
    et 232 de la directive 2006/112/CE relative au système commun de taxe sur la
    valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/502 des Rates vom 5. März 2025 zur Ermächtigung
    Griechenlands, eine von den Artikeln 218 und 232 der Richtlinie 2006/112/EG über
    das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme einzuführen
  type: main
- language: bg
