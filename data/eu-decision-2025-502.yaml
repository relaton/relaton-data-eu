    la articolele 218 și 232 din Directiva 2006/112/CE privind sistemul comun al
    taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2025/502 z 5. marca 2025, ktorým sa
    Grécku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článkov 218
    a 232 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2025/502 z dne 5. marca 2025 o dovoljenju Grčiji,
