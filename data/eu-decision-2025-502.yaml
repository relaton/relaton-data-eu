    218 en 232 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke stelsel
    van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2025/502 z dnia 5 marca 2025 r. w sprawie
    upoważnienia Grecji do wprowadzenia szczególnego środka stanowiącego odstępstwo
    od art. 218 i 232 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od
    wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2025/502 do Conselho, de 5 de março de 2025,
    que autoriza a Grécia a aplicar uma medida especial em derrogação dos artigos
    218.° e 232.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/502 a Consiliului din 5 martie
