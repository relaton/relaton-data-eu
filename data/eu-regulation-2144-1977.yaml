id: EURegulation21441977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2144/77 of 28 September 1977 re-establishing
    the levying of customs duties on knives with cutting blades, serrated or not (including
    pruning knives), other than knives falling within heading No 82.06, falling within
    heading No 82.09, originating developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2144/77 de la Commission, du 28 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux couteaux
    (autres que ceux du n° 82.06) à lame tranchante ou dentelée, y compris les
    serpettes fermantes, de la position tarifaire 82.09, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2144/77 der Kommission vom 28. September 1977 zur
    Wiedereinführung des Zollsatzes für Messer (andere als die der Tarifnummer 82.06)
    mit schneidender oder gezahnter Klinge, einschließlich Klappmesser für den Gartenbau,
    der Tarifnummer 82.09, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2144/77 af 28. september 1977 om genindførelse
    af opkrævning af toldafgifter for knive, der ikke henhører under nogen anden
    position i dette kapitel, med skærende eller savtakket æg (herunder beskærerknive),
    under position 82.09, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2144/77 della Commissione, del 28 settembre 1977,
    che ripristina la riscossione dei dazi doganali applicabili ai coltelli (diversi
    da quelli della voce 82.06) a lama trinciante o dentata, compresi i roncoli chiudibili,
    della voce doganale 82.09 originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2144/77 van de Commissie van 28 september 1977 houdende
    wederinstelling van de heffing van de douanerechten voor messen (andere dan die
    bedoeld bij post 82.06), ook indien getand, zaksnoeimessen daaronder begrepen,
    van post 82.09, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan
    bij Verordening (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
