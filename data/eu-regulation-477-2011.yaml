    pelo Regulamento de Execução (UE) n. ° 511/2010 do Conselho sobre as importações
    de determinados fios de molibdénio originários da República Popular da China
    através de importações de determinados fios de molibdénio expedidos da Malásia
    e da Suíça, independentemente de serem ou não declarados originários da Malásia
    e da Suíça, e que torna obrigatório o registo destas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 477/2011 al Comisiei din 17 mai 2011 de deschidere
    a unei anchete referitoare la o eventuală eludare a măsurilor antidumping instituite
    prin Regulamentul de punere în aplicare (UE) nr. 511/2010 al Consiliului la importurile
    de anumite sârme din molibden originare din Republica Populară Chineză prin
    importuri de anumite sârme din molibden expediate din Malaysia și din Elveția,
    declarate sau nu ca fiind originare din aceste țări, și de supunere a acestor
    importuri înregistrării
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 477/2011 zo 17. mája 2011 , ktorým sa začína
    prešetrovanie týkajúce sa možného obchádzania antidumpingových opatrení
    uložených vykonávacím nariadením Rady (ES) č. 511/2010 na dovoz určitých
    molybdénových drôtov s pôvodom v Čínskej ľudovej republike prostredníctvom
    dovozu určitých molybdénových drôtov odosielaných z Malajzie a Švajčiarska,
    ktoré majú alebo nemajú deklarovaný pôvod v Malajzii a Švajčiarsku, a na
    základe ktorého začína takýto dovoz podliehať registrácii
  type: main
- language: sl
  script: Latn
