title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 477/2011 of 17 May 2011 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Implementing Regulation (EU) No 511/2010 on imports of certain molybdenum wires
    originating in the People’s Republic of China by imports of certain molybdenum
    wires consigned from Malaysia and Switzerland, whether declared as originating
    in Malaysia and Switzerland or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 477/2011 de la Commission du 17 mai 2011 portant ouverture
    d’une enquête sur un éventuel contournement des mesures antidumping instituées
    par le règlement d’exécution (UE) n ° 511/2010 du Conseil sur les importations
    de certains fils en molybdène originaires de la République populaire de Chine
    par des importations de certains fils en molybdène expédiés de Malaisie et
    de Suisse, qu’ils aient ou non été déclarés originaires de ces pays, et
    soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 477/2011 der Kommission vom 17. Mai 2011 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Durchführungsverordnung
    (EU) Nr. 511/2010 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Molybdändrähte mit Ursprung in der Volksrepublik China
    durch die Einfuhren von aus Malaysia und der Schweiz versandten bestimmten Molybdändrähten,
    ob als Ursprungserzeugnis Malaysias und der Schweiz angemeldet oder nicht, und
    zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
