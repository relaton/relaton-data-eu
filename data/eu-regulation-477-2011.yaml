    tuonnin kirjaamisvelvoitteesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 477/2011 od 17. svibnja 2011. o pokretanju ispitnog
    postupka o mogućem izbjegavanju antidampinških mjera uvedenih Provedbenom uredbom
    Vijeća (EU) br. 511/2010 na uvoz određenih žica od molibdena podrijetlom iz
    Narodne Republike Kine, uvozom određenih žica od molibdena poslanih iz Malezije
    i Švicarske, bez obzira na to imaju li deklarirano podrijetlo iz Malezije i Švicarske
    ili ne, te o uvjetovanju takvog uvoza evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság 477/2011/EU rendelete ( 2011. május 17. ) az 511/2010/EU
