    (EU) nr. 511/2010 van de Raad ingestelde antidumpingmaatregelen op de invoer van
    bepaald molybdeendraad van oorsprong uit de Volksrepubliek China door de invoer
    van bepaald molybdeendraad verzonden uit Maleisië en Zwitserland, al dan niet
    aangegeven als van oorsprong uit Maleisië en Zwitserland, en tot registratie
    van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 477/2011 z dnia 17 maja 2011 r. wszczynające
