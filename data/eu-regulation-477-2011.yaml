    rozporządzeniem wykonawczym Rady (UE) nr 511/2010 na przywóz niektórych rodzajów
    drutu molibdenowego pochodzącego z Chińskiej Republiki Ludowej, w drodze przywozu
    niektórych rodzajów drutu molibdenowego wysyłanego z Malezji i Szwajcarii,
    bez względu na to, czy został zgłoszony jako pochodzący z Malezji i Szwajcarii,
