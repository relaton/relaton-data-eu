    glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno uredbo
    Sveta (EU) št. 511/2010 o uvozu nekaterih žic iz molibdena s poreklom iz Ljudske
    republike Kitajske, pri uvozu nekaterih žic iz molibdena, poslanih iz Malezije
    in Švice, ne glede na to, ali je njihovo poreklo deklarirano v Maleziji in Švici
    ali ne, in o registraciji takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 477/2011 de la Comisión, de 17 de mayo de 2011 ,
    por el que se abre una investigación relativa a la posible elusión de las medidas
    antidumping impuestas por el Reglamento de Ejecución (UE) n ° 511/2010 del Consejo
    a las importaciones de determinados alambres de molibdeno originarios de la República
    Popular China a través de las importaciones de determinados alambres de molibdeno
    procedentes de Malasia o de Suiza, hayan sido o no declarados originarios de estos
    últimos países, y por el que se someten dichas importaciones a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 477/2011 av den 17 maj 2011 om inledande
    av en undersökning beträffande ett eventuellt kringgående av antidumpningsåtgärder,
    som genom rådets genomförandeförordning (EU) nr 511/2010 införts beträffande
    import av viss molybdentråd med ursprung i Folkrepubliken Kina, genom import
    av viss molybdentråd som avsänts från Malaysia och Schweiziska edsförbundet,
    oavsett om produktens deklarerade ursprung är Malaysia och Schweiziska edsförbundet
    eller inte, och om registrering av sådan import
