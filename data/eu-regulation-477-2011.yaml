    egyes molibdénhuzalok behozatalára elrendelt dömpingellenes intézkedéseknek
    a Malajziában és Svájcban feladott, Malajziából, illetve Svájcból származóként
    vagy nem ilyenként bejelentett egyes molibdénhuzalok behozatala révén történő
    esetleges kijátszására vonatkozó vizsgálat megindításáról, valamint e
    behozatalok nyilvántartásba vételének elrendeléséről
  type: main
