    οι οποίες ετέθηκαν σε κυκλοφορία στην Κοινότητα,
    στη διάρκεια του 1994, καθώς και για τον καθορισμό
    του ποσού της προκαταβολής για το 1995 και την
    παρέκκλιση από τον κανονισμό (ΕΟΚ) αριθ. 1858/93
