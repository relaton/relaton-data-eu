    des für 1995 zu leistenden Vorschusses und zur Abweichung von der Verordnung
    (EWG) Nr. 1858/93 hinsichtlich der Gewährung des Beihilfesaldos
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 797/95 af 7. april 1995 om fastsættelse
    af udligningsstøtten for EF- bananer, der er markedført i 1994, og af forskuddet
    for 1995 og om undtagelse fra forordning (EØF) nr. 1858/93, for så vidt angår
    fristen for udbetaling af restbeløbet af støtten
  type: main
- language: el
  script: Grek
