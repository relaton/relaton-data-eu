    poikkeamisesta tuen jäljellä olevan osuuden maksumääräajan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 797/95 della Commissione, del 7 aprile 1995, recante
    fissazione dell' importo dell' aiuto compensativo per le banane comunitarie commercializzate
    nel corso del 1994 e dell' importo dell' anticipo per il 1995, nonché deroga
    al regolamento (CEE) n. 1858/93 in ordine al termine di pagamento del saldo dell'
    aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 797/95 van de Commissie van 7 april 1995 tot vaststelling
