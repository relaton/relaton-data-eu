title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 797/95 of 7 April 1995 fixing the compensatory
    aid for Community bananas marketed in 1994 and the advance for 1995 and derogating
    from Regulation (EEC) No 1858/93 as regards the time limit for the payment of
    the balance of aid
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 797/95 de la Commission, du 7 avril 1995, fixant le
    montant de l' aide compensatoire pour les bananes communautaires commercialisées
    au cours de l' année 1994 ainsi que celui de l' avance pour 1995 et dérogeant
    au règlement (CEE) nº 1858/93 en ce qui concerne le délai de paiement du solde
    de l' aide
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 797/95 der Kommission vom 7. April 1995 zur Festsetzung
