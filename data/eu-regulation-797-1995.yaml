    bananen uit de Gemeenschap, en van het bedrag van het voorschot voor 1995, en
    houdende afwijking van Verordening (EEG) nr. 1858/93 voor wat de termijn voor
    de betaling van het steunsaldo betreft
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 797/95 da Comissão, de 7 de Abril de 1995, que fixa
