title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1983/74 of the Commission of 24 July 1974 fixing, for
    the 1974/75 marketing year, in respect of trade within the Community the components
    designed to protect the rice and cereals processing industries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1983/74 de la Commission, du 24 juillet 1974, fixant,
    en ce qui concerne les échanges intracommunautaires pour la campagne de commercialisation
    1974/1975, les éléments destinés à assurer, dans le secteur des céréales
    et du riz, la protection de l'industrie de transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1983/74 der Kommission vom 24. Juli 1974 zur Festsetzung
    des Bestandteils zum Schutz der Verarbeitungsindustrie auf dem Getreide- und Reissektor
    im Hinblick auf den innergemeinschaftlichen Handel für das Wirtschaftsjahr 1974/1975
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1983/74 af 24. juli 1974 om fastsættelse
    for høståret 1974/1975 - for handelen inden for Fællesskabet - af de elementer,
    der for korn og ris har til formål at sikre beskyttelsen af forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1983/74 della Commissione, del 24 luglio 1974, che
    fissa, per quanto riguarda gli scambi intracomunitari nella campagna di commercializzazione
    1974/1975, gli elementi destinati ad assicurare la protezione dell'industria di
    trasformazione nel settore dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1983/74 van de Commissie van 24 juli 1974 tot vaststelling
    van de elementen die dienen om in het verkoopseizoen 1974/1975 in het intracommunautaire
    handelsverkeer in de sector granen en rijst de bescherming van de verwerkende
    industrie te verzekeren
  type: main
