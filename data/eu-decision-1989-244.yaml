title:
- language: en
  script: Latn
  content: '89/244/EEC: Commission Decision of 21 March 1989 authorizing certain Member
    States to provide for exceptions from certain provisions of Directive 77/93/EEC
    in respect of potatoes for human consumption originating in Turkey (Only the French,
    German and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/244/CEE: Décision de la Commission du 21 mars 1989 autorisant certains
