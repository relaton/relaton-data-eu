title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3007/91 of 14 October 1991 re-establishing
    the levying of customs duties on products of category 74 (order No 40.0740), originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3007/91 DE LA COMMISSION du 14 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 74 (numéro d'' ordre 40.0740) originaires de l'' Indonésie,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3007/91 DER KOMMISSION vom 14. Oktober 1991 über
    die Wiedereinführung des Zollsatzes für die Waren der Kategorie 74 (laufende
    Nummer 40.0740) mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3007/91 af 14. oktober 1991 om genindførelse
    af opkrævning af told for varer under kategori nr. 74 (løbenummer 40.0740),
    som har oprindelse i Indonesien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3007/91 της Επιτροπής
