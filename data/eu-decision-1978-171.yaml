---
id: EUDecision1978171
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1977 authorizing the French Republic
    not to apply Community treatment to suits, jackets, blazers and the like, falling
    within heading No ex 61.01 of the Common Customs Tariff, originating in Hong Kong
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/171/CEE: Décision de la Commission, du 17 novembre 1977, autorisant
    la République française à exclure du traitement communautaire les complets,
    costumes, vestes, vestons et articles similaires de la position Ex 61.01 du Tarif
    douanier commun, originaires de Hong-Kong et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1977, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Anzüge, Röcke, Blusen und ähnliche Waren der
    Tarifnummer ex 61.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. november 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage jakkesæt, jakker og lignende
    varer, som henhører under pos. ex 61.01 i den fælles toldtarif, har oprindelse
    Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario vestiti completi, giacche, giacchette
    e affini della voce ex 61.01 della tariffa doganale comune originari di Hong Kong
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1977 waarbij de Franse Republiek
    wordt gemachtigd kostuums voor heren en jongens, combinaties daaronder begrepen,
    colbertjassen, blazers en dergelijke, van post ex 61.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
