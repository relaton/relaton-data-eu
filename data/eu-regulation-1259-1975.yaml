id: EURegulation12591975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1259/75 of the Commission of 14 May 1975 re-establishing
    the levying of the customs duties on illuminating glassware, signalling glassware
    and optical elements of glass, falling within subheading 70.14 B, originating
    in Hong Kong, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1259/75 de la Commission, du 14 mai 1975, portant
    rétablissement de la perception des droits de douane applicables à la verrerie
    d'éclairage, de signalisation et d'optique commune, de la sous-position tarifaire
    70.14 B, originaire de Hong-Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1259/75 der Kommission vom 14. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Glaswaren für Beleuchtung, für Signalvorrichtungen oder
    zu optischen Zwecken, der Tarifstelle 70.14 B, mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1259/75 af 14. maj 1975 om genindførelse
    af opkrævning af toldafgifter for belysningsartikler af glas, refleksglas, optiske
    artikler af glas, hverken optisk bearbejdet eller af optisk glas, under underposition
    70.14 B, som har oprindelse i Hong Kong og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1259/75 della Commissione, del 14 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle vetrerie per illuminazione,
    per segnalazione e per ottica comune della sottovoce doganale 70.14 B originarie
    di Hong Kong beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1259/75 van de Commissie van 14 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op verlichtingsartikelen,
    signaal- en waarschuwingsartikelen, van glas; optische elementen van gewoon glas,
    niet optisch bewerkt, van onderverdeling 70.14 B, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december
    1974 algemene tariefpreferenties werden geopend
  type: main
