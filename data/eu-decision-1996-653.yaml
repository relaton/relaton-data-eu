title:
- language: en
  script: Latn
  content: '96/653/EC: Commission Decision of 11 November 1996 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC'
  type: main
- language: fr
  script: Latn
  content: '96/653/CE: Décision de la Commission du 11 novembre 1996 autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences des directives 66/404/CEE et 71/161/CEE
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '96/653/EG: Entscheidung der Kommission vom 11. November 1996 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinien 66/404/EWG und 71/161/EWG des Rates nicht
    entspricht'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 11 ноември 1996 година
    относно оправомощаване на държавите-членки
    да разрешават временно продажбата на горски
    репродуктивен материал, който не отговаря
    на изискванията на Директиви 66/404/ЕИО и 71/161/ЕИО
    на Съвета
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 11. listopadu 1996, kterým se členské státy
    opravňují dočasně povolit uvádění reprodukčního materiálu lesních dřevin
    nesplňujícího požadavky směrnic Rady 66/404/EHS a 71/161/EHS na trh
  type: main
- language: da
  script: Latn
  content: '96/653/EF: Kommissionens Beslutning af 11. november 1996 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF og 71/161/EØF'
  type: main
- language: el
  script: Grek
  content: '96/653/ΕΚ: Απόφαση της Επιτροπής της 11ης Νοεμβρίου
    1996 που επιτρέπει στα κράτη μέλη να εγκρίνουν
    προσωρινώς την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις των οδηγιών
    66/404/ΕΟΚ και 71/161/ΕΟΚ του Συμβουλίου'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 11. november 1996, millega liikmesriikidel lubatakse kiita
    ajutiselt heaks nõukogu direktiivide 66/404/EMÜ ja 71/161/EMÜ nõuetele mittevastava
    metsapaljundusmaterjali turustamine
  type: main
- language: fi
  script: Latn
  content: '96/653/EY: Komission päätös, tehty 11 päivänä marraskuuta 1996,
    luvan antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivien 66/404/ETY ja 71/161/ETY
    vaatimuksia'
  type: main
- language: hr
  script: Latn
  content: '96/653/EZ: Odluka Komisije od 11. studenoga 1996. o ovlašćivanju država
    članica da privremeno dopuste stavljanje na tržište šumskog reprodukcijskog
    materijala koji ne ispunjava zahtjeve Direktiva Vijeća 66/404/EEZ i 71/161/EEZ'
  type: main
- language: hu
  script: Latn
  content: A Bizottság 96/653/EK határozata (1996. november 11.) a 66/404/EGK és
    71/161/EGK tanácsi irányelvek követelményeinek nem megfelelő erdészeti szaporítóanyagok
    ideiglenes forgalmazásának tagállamok általi engedélyezésére vonatkozó
    felhatalmazásról
  type: main
- language: it
  script: Latn
  content: '96/653/CE: Decisione della Commissione dell''11 novembre 1996 che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalle direttive
    66/404/CEE e 71/161/CEE del Consiglio'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1996. gada 11. novembris), ar ko dalībvalstīm dod
    tiesības uz laiku atļaut tirgot tādu mežsaimniecības pavairojamo materiālu,
    kas neatbilst Padomes Direktīvu 66/404/EEK un 71/161/EEK prasībām
  type: main
- language: lt
  script: Latn
  content: 1996 m. lapkričio 11 d. Komisijos sprendimas, leidžiantis valstybėms
    narėms laikinai leisti prekiauti miško dauginamąja medžiaga, neatitinkančia
    Tarybos direktyvų 66/404/EEB ir 71/161/EEB reikalavimų
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-11 ta’ Novembru 1996 li tawtorizza
    lill-Istati Membri biex temporanjament jippermettu l-marketing ta’ materjal
    riproduttiv tal-foresti li ma jissodisfax il-ħtiġijiet tad-Direttivi tal-Kunsill
    66/404/KEE u 71/161/KEE
  type: main
- language: nl
  script: Latn
  content: '96/653/EG: Beschikking van de Commissie van 11 november 1996 houdende
    machtiging van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal
    dat niet beantwoordt aan de vereisten van de Richtlijnen 66/404/EEG en 71/161/EEG
    van de Raad in de handel wordt gebracht'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 11 listopada 1996 r. upoważniająca Państwa Członkowskie
    do zezwolenia na czasowe dopuszczenie do obrotu leśnego materiału rozmnożeniowego
    niespełniającego wymogów dyrektyw Rady 66/404/EWG i 71/161/EWG
  type: main
- language: pt
  script: Latn
  content: '96/653/CE: Decisão da Comissão de 11 de Novembro de 1996 que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências das Directivas
    66/404/CEE e 71/161/CEE do Conselho'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 11 noiembrie 1996 de autorizare a statelor membre
    să permită temporar comercializarea materialelor forestiere de reproducere care
    nu îndeplinesc cerințele prevăzute de Directivele 66/404/CEE și 71/161/CEE
    ale Consiliului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 11. novembra 1996, ktorým sa členské štáty oprávňujú
    dočasne povoliť uvádzanie reprodukčného materiálu lesných drevín nespĺňajúceho
    požiadavky smerníc Rady 66/404/EHS a 71/161/EHS na trh
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 11. novembra 1996 o pooblastilu državam članicam,
    da začasno dovolijo trženje gozdnega reprodukcijskega materiala, ki ne ustreza
    zahtevam direktiv Sveta 66/404/EGS in 71/161/EGS (96/653/ES)
  type: main
- language: es
  script: Latn
  content: '96/653/CE: Decisión de la Comision de 11 de noviembre de 1996 por la
    que se autoriza a los Estados miembros para permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de las Directivas
    66/404/CEE y 71/161/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '96/653/EG: Kommissionens beslut av den 11 november 1996 om bemyndigande
    för medlemsstaterna att tillfälligt tillåta saluföring av skogsodlingsmaterial
    som inte uppfyller kraven i rådets direktiv 66/404/EEG och 71/161/EEG'
