  content: Regulation (EEC) No 3044/74 of the Council of 18 November 1974 on the temporary
    suspension of the autonomous Common Customs Tariff duty for mechanically propelled
    aircraft of an unladen weight exceeding 15 000 kg, falling within subheading ex
    88.02 B II c)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3044/74 du Conseil, du 18 novembre 1974, portant suspension
