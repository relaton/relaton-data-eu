title:
- language: en
  script: Latn
  content: '79/1042/EEC: Commission Decision of 23 November 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, impregnated or coated with artificial
    plastic materials, falling within heading No ex 60.02 of the Common Customs Tariff
    (NIMEXE code 60.02-40) (category 10), originating in Macao and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/1042/CEE: Décision de la Commission, du 23 novembre 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, imprégnée ou enduite de matières
    plastiques, de la position ex 60.02 du tarif douanier commun (code Nimexe : 60.02-40)
    (catégorie 10), originaire de Macao et mise en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/1042/EWG: Entscheidung der Kommission vom 23. November 1979, mit der
    die Französische Republik ermächtigt wird, aus Macau stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, mit Kunststoff getränkt oder bestrichen, der Tarifnummer
    ex 60.02 des Gemeinsamen Zolltariffs (NIMEXE-Kennziffer 60.02-40), Kategorie 10,
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/1042/EØF: Kommissionens beslutning af 23. november 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, imprægneret eller overtrukket med plast, som henhører under pos.
    ex 60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40 ; kategori 10), har oprindelse
    i Macao og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/1042/CEE: Decisione della Commissione, del 23 novembre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario guanti a maglia
    non elastica né gommata, impregnati o spalmati di materie plastiche della voce
    ex 60.02 della tariffa doganale comune (codice Nimexe: 60.02-40), categoria 10,
    originari di Macao e messi in libera pratica negli altri Stati membri (Il testo
    in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/1042/EEG: Beschikking van de Commissie van 23 november 1979 waarbij
    de Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet-elastisch of van niet-gegummeerd brei- of haakwerk, geïmpregneerd of
    met een deklaag van plastische stoffen, van post ex 60.02 van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.02-40) (categorie 10), van oorsprong uit Macao en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
