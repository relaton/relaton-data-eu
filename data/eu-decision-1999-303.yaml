---
id: EUDecision1999303
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/303/EC: Commission Decision of 12 April 1999 on a common technical
    regulation for connection to the analogue public switched telephone networks (PSTNs)
    of terminal equipment supporting the voice telephony justified case service in
    which network addressing, if provided, is by means of dual tone multi-frequency
    (DTMF) signalling (notified under document number C(1999) 874)'
  type: main
- language: fr
  script: Latn
  content: '1999/303/CE: Décision de la Commission, du 12 avril 1999, portant réglementation
    technique commune concernant la connexion aux réseaux téléphoniques publics
    commutés (RTPC) analogiques des équipements terminaux qui prennent en charge
    la téléphonie vocale dans les cas justifiés, pour lesquels l''adressage de
    réseau éventuel est assuré par signalisation multifréquence bitonale (DTMF)
    [notifiée sous le numéro C(1999) 874]'
  type: main
- language: de
  script: Latn
  content: '1999/303/EG: Entscheidung der Kommission vom 12. April 1999 über eine
    gemeinsame technische Vorschrift für den Anschluß von Endeinrichtungen, die
    Sprachtelefondienste in begründeten Fällen unterstützen und deren Netzadressierung
    gegebenenfalls durch Zeichengabe im Mehrfrequenzwahlverfahren (DTMF) erfolgt,
    an analoge öffentliche Fernsprechnetze (Bekanntgegeben unter Aktenzeichen K(1999)
    874)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 12 април 1999 година
    относно общ технически регламент за свързване
    към аналогови обществени комутируеми телефонни
    мрежи (PSTN) на крайни устройства, поддържащи
    услуга за гласова телефония, при които адресирането
    в мрежата, ако е предвидено, е чрез двутонална
    многочестотна сигнализация (DTMF) (нотифицирано
    под номер C(1999) 874)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 12. dubna 1999 o společném technickém předpisu
    pro připojení koncových zařízení, která zajišťují hlasovou telefonní
    službu v oprávněných případech a ve kterých se síťové adresování,
    je-li zajištěno, provádí dvojtónovou multifrekvenční (DTMF) signalizací,
    k analogovým veřejným komutovaným telefonním sítím (PSTN) (oznámeno pod
    číslem K(1999) 874)
  type: main
- language: da
  script: Latn
  content: '1999/303/EF: Kommissionens beslutning af 12. april 1999 om en fælles
    teknisk forskrift for terminaludstyr, der er konstrueret til begrundet tilfælde-tjenesten
    taletelefoni, skal kobles op på de analoge offentlige telefonnet, og anvender
    DTMF-signalering (Dual Tone Multi Frequency) ved netadressering (meddelt under
    nummer K(1999) 874)'
  type: main
- language: el
  script: Grek
  content: '1999/303/ΕΚ: Απόφαση της Επιτροπής, της 12ης
    Απριλίου 1999, σχετικά με κοινό τεχνικό κανονισμό
    για τη σύνδεση με τα αναλογικά δημόσια τηλεφωνικά
    δίκτυα μεταγωγής (PSTN) τερματικού εξοπλισμού
    που υποστηρίζει την υπηρεσία φωνητικής τηλεφωνίας
    σε αιτιολογημένες περιπτώσεις, στον οποίο
    η διευθυνσιοδότηση δικτύου, εάν παρέχεται,
    εκτελείται με σηματοδοσία πολυσυχνότητας
    διπλού τόνου (DTMF) [κοινοποιηθείσα υπό τον αριθμό
    Ε(1999) 874]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 12. aprill 1999, selliste üldkasutatava kommuteeritava
    analoogtelefonivõrguga ühendatavate põhjendatud juhtudel kõneteenust toetavate
    lõppseadmete ühendamise ühise tehnilise normi kohta, mille puhul võimalik
    võrguadresseerimine toimub toonvalimisega (teatavaks tehtud numbri K(1999) 874
    all)
  type: main
- language: fi
  script: Latn
  content: '1999/303/EY: Komission päätös, tehty 12 päivänä huhtikuuta 1999,
    sellaista perustelluksi tapaukseksi katsottavaa puhelintoimintapalvelua, jossa
    mahdollinen numerovalinta on toteutettu äänitaajuusvalintana (DTMF), tukevien
    yleisiin analogisiin puhelinverkkoihin (PSTN) liitettävien päätelaitteiden
    liitäntävaatimuksia koskevista yhteisistä teknisistä määräyksistä (tiedoksiannettu
    numerolla K(1999) 874)'
  type: main
- language: hr
  script: Latn
  content: '1999/303/EZ: Odluka Komisije od 12. travnja 1999. o zajedničkom tehničkom
    propisu za priključivanje terminalne opreme koja podržava uslugu govorne telefonije
    za opravdane slučajeve na analogne javne komutirane telefonske mreže (PSTN)
    i čije se mrežno adresiranje, ako je predviđeno, izvodi dvotonskom višefrekvencijskom
    (DTMF) signalizacijom (priopćena pod brojem dokumenta C(1999) 874)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1999. április 12.) a hálózati címzéshez
    kéthangú, többfrekvenciás jelzést (DTMF) használó, indokolt esetben hangtelefont
    támogató végberendezések analóg nyilvános kapcsolt telefonhálózathoz (PSTN)
    történő csatlakoztatására vonatkozó közös műszaki szabályokról (az
    értesítés a C(1999) 874. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '1999/303/CE: Decisione della Commissione, del 12 aprile 1999, su una regolamentazione
    tecnica comune relativa ai requisiti di connessione per il collegamento alla rete
    telefonica pubblica commutata (PSTN) delle apparecchiature terminali per il servizio
    di telefonia vocale in casi giustificati in cui l''eventuale indirizzamento di
    rete è effettuato con segnalazione bitonale a più frequenze (DTMF) [notificata
    con il numero C(1999) 874]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1999. gada 12. aprīlis) par kopējiem tehniskiem noteikumiem
    attiecībā uz tādu galiekārtu pieslēgšanu analogajiem publiskajiem komutējamajiem
    telefonu tīkliem (PSTN), kuras attiecīgos gadījumos nodrošina balss telefonijas
    pakalpojumus un kurās tīkla varbūtēja adresācija tiek īstenota, izmantojot
    divtoņu daudzfrekvenču signalizāciju (paziņots ar dokumenta numuru C(1999)
    874)
  type: main
- language: lt
  script: Latn
  content: 1999 m. balandžio 12 d. Komisijos sprendimas dėl bendrojo techninio reglamento,
    skirto galinių įrenginių, palaikančių balso telefonijos pagrįstų atvejų
    paslaugas, prijungimui prie analoginių viešųjų komutuojamų telefono tinklų,
    kai tinklo adresavimas, jei jis teikiamas, atliekamas dvitone daugiadažne (DTMF)
    signalizavimo sistema (pranešta dokumentu Nr. C(1999) 874)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-12 ta' April 1999 dwar regolament tekniku
    komuni għal konnessjoni ma' networks ta' komunikazzjoni pubbliċi bit-telefonija
    analoga u bis-swiċċ (PSTNs) ta' tagħmir terminali li jappoġġa s-servizz ta'
    każi ġustifikati bit-telefonija bil-vuċi li fih is-sistema ta' indirizzar tan-networks,
    jekk provduta, tkun permezz tas-sinjalazzjoni b'ton doppju fuq frekwenza moltiplika
    (DTMF) (notifikat fid-dokument numru C(1999) 874)
  type: main
- language: nl
  script: Latn
  content: '1999/303/EG: Beschikking van de Commissie van 12 april 1999 inzake gemeenschappelijke
    technische voorschriften voor de aansluiting op analoge openbare geschakelde telefoonnetwerken
    (PSTN''s) van eindapparatuur voor de als gerechtvaardigde uitzondering erkende
    spraaktelefoondienst, waarin de netwerkadressering, voorzover daarin is voorzien,
    plaatsvindt door middel van DTMF-signalering (Dual Tone Multi-Frequency) (kennisgeving
    geschied onder nummer C(1999) 874)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 12 kwietnia 1999 r. w sprawie wspólnej regulacji
    technicznej dotyczącej podłączania do analogowych publicznych komutowanych
    sieci telefonicznych (PSTN) urządzeń końcowych wspomagających w określonych
    przypadkach usługi telefonii głosowej, w których adresowanie sieci, jeśli
    jest zapewnione, wykorzystuje wybieranie dwutonowe wieloczęstotliwościowe (DTMF)
    (notyfikowana jako dokument nr C(1999) 874)
  type: main
- language: pt
  script: Latn
  content: '1999/303/CE: Decisão da Comissão, de 12 de Abril de 1999, relativa a
    um regulamento técnico comum para a ligação às redes telefónicas comutadas
    públicas (RTCP) analógicas de equipamentos terminais preparados para o serviço
    telefónico vocal em casos justificados nos quais o endereçamento na rede, caso
    esteja previsto, se faz através de sinalização multifrequências de duas tonalidades
    [notificada com o número C(1999) 874]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 12 aprilie 1999 de stabilire a unei reglementări
    tehnice comune privind conectarea la rețelele telefonice publice comutate (RTPC)
    analogice a echipamentelor terminale care preiau telefonia vocală în cazurile
    justificate, pentru care adresa rețelei eventuale este asigurată prin semnalizarea
    de multifrecvență bitonală (DTMF) [notificată cu numărul C(1999) 874]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 12. apríla 1999 o spoločnom technickom predpise
    pre pripojenie koncových zariadení podporujúcich v oprávnených prípadoch
    hlasovú telefóniu, ktorých prípadné sieťové adresovanie sa uskutočňuje
    pomocou multifrekvenčnej signalizácie (DTMF), k analógovým verejným komutovaným
    telefónnym sieťam (PSTN) (oznámené pod číslom dokumentu C(1999) 874)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 12. aprila 1999 o skupnem tehničnem predpisu za
    povezovanje analognih javnih komutiranih telefonskih omrežij (PSTN) s terminalsko
    opremo, ki podpira storitve govorne telefonije v utemeljenih primerih, ko se povezuje,
    če je to mogoče, z omrežjem z dvotonskim večfrekvenčnim izbiranjem (DTMF)
    (notificirano pod dokumentarno številko K(1999) 874)
  type: main
- language: es
  script: Latn
  content: '1999/303/CE: Decisión de la Comisión, de 12 de abril de 1999, relativa
    a una reglamentación técnica común para la conexión a las redes telefónicas
    públicas conmutadas (RTPC) analógicas de los equipos terminales que soportan
    el servicio de telefonía vocal en caso justificado en los que el direccionamiento
    de red, si se proporciona, se efectúa por medio de la señalización DTMF (multifrecuencia
    bitono) [notificada con el número C(1999) 874]'
  type: main
- language: sv
  script: Latn
  content: '1999/303/EG: Kommissionens beslut av den 12 april 1999 om en gemensam
    teknisk föreskrift för anslutning av terminalutrustning som kan användas för
    taltelefoni, i motiverade fall, till analoga allmänt tillgängliga kopplade telefonnät
    (PSTN) där nätadressering, om sådan finns, sker genom DTMF-signalering (Dual
    Tone Multi Frequency) [delgivet med nr K(1999) 874]'
