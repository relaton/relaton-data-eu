    annetun asetuksen (ETY) N:o 574/72 muuttamisesta
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1249/92 DEL CONSIGLIO del 30 aprile 1992 che modifica
