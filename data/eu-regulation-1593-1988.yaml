- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1593/88 of 8 June 1988 re-establishing the
    levying of customs duties on trunks, suit-cases, vanity cases, executive cases,
    brief cases, school satchels and similar containers falling within CN code ex
    4202 originating in India to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1593/88 de la Commission du 8 juin 1988 portant rétablissement
    de la perception des droits de douane applicables aux malles, valises et mallettes,
    y compris les mallettes de toilette et mallettes porte-documents, serviettes,
    cartables et contenants similaires, du code NC ex 4202, originaires de l' Inde,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1593/88 der Kommission vom 8. Juni 1988 zur Wiedereinführung
    der Erhebung der Zölle für Reisekoffer, Handkoffer, Kosmetikkoffer und Dokumentenkoffer,
    Aktentaschen, Schulranzen und ähnliche Behältnisse der Position ex 4202 der
    Kombinierten Nomenklatur mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1593/88 af 8. juni 1988 om genindførelse
