    Ananaserzeuger zu zahlenden Mindestpreises für das Wirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1971/80 af 22. juli 1980 om fastsættelse
