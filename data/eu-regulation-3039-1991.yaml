title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3039/91 of 15 October 1991 re-establishing
    the levying of customs duties on the products following CN codes 7407 and 7408,
    originating in Poland, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3039/91 DE LA COMMISSION du 15 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 7407 et 7408 originaires de la Pologne, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3039/91 DER KOMMISSION vom 15. Oktober 1991 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 7407 und 7408 mit Ursprung
    in Polen, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3039/91 af 15. oktober 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 7407 og 7408 og med
    oprindelse i Polen, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3039/91 της Επιτροπής
    της 15ης Οκτωβρίου 1991 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα των
    κωδικών ΣΟ 7407 και 7408, καταγωγής Πολωνίας, δικαιούχου
    των προβλεπόμενων στον κανονισμό ( ΕΟΚ ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3039/91 DELLA COMMISSIONE del 15 ottobre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 7407 e 7408, originari della Polonia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3039/91 VAN DE COMMISSIE van 15 oktober 1991 houdende
