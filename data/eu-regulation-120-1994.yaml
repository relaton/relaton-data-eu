title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 120/94 of 25 January 1994 amending Regulation
    (EEC) No 1533/93 laying down certain detailed rules under Council Regulation (EEC)
    No 1766/92 on the granting of export refunds on cereals and the measures to be
    taken in the event of disturbance on the market for cereals, and amending Regulation
    (EEC) No 2131/93 laying down the procedure and conditions for the sale of cereals
    held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 120/94 de la Commission du 25 janvier 1994 modifiant
    le règlement (CEE) n° 1533/93 établissant certaines modalités d'application
    du règlement (CEE) n° 1766/92 du Conseil en ce qui concerne l'octroi des restitutions
    à l'exportation ainsi que les mesures à prendre, en cas de perturbation, dans
    le secteur des céréales, et le règlement (CEE) n° 2131/93 fixant les procédures
    et conditions de la mise en vente des céréales détenues par les organismes
    d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 120/94 der Kommission vom 25. Januar 1994 zur Änderung
    der Verordnung (EWG) Nr. 1533/93 mit Durchführungsbestimmungen zur Verordnung
    (EWG) Nr. 1766/92 des Rates hinsichtlich der Gewährung von Ausfuhrerstattungen
    und zur Festlegung der bei Störungen im Getreidesektor zu treffenden Maßnahmen
    und der Verordnung (EWG) Nr. 2131/93 über das Verfahren und die Bedingungen für
    den Verkauf von Getreide aus Beständen der Interventionsstellen
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 120/94 на Комисията от 25 януари
    1994 година за изменение на Регламент (ЕИО) №
    1533/93 относно определяне на някои подробни правила
    за прилагане на Регламент (ЕИО) № 1766/92 на Съвета
    относно предоставянето на възстановявания
    при износ и мерките, които е небходимо да се
    предприемат в случай на затруднения на пазара
    на зърнените култури, и за изменение на Регламент
    (ЕИО) № 2131/93 относно определяне на процедурата
    и условията за продажба на зърнени култури,
    държани от интервенционни агенции
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 120/94 ze dne 25. ledna 1994, kterým se mění
    nařízení (EHS) č. 1533/93, kterým se stanoví některá prováděcí pravidla
    k nařízení Rady (EHS) č. 1766/92, pokud jde o poskytování vývozních náhrad
    pro obiloviny, jakož i opatření, která se přijmou v případě narušení
    trhu s obilovinami, a nařízení (EHS) č. 2131/93, kterým se stanoví postupy
    a podmínky pro uvedení do prodeje obilovin ze zásob intervenčních agentur
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 120/94 af 25. januar 1994 om ændring
    af forordning (EØF) nr. 1533/93 om visse gennemførelsesbestemmelser til Rådets
    forordning (EØF) nr. 1766/92 for så vidt angår ydelse af eksportrestitutioner
    for korn samt om de foranstaltninger, der skal træffes inden for kornsektoren
    i tilfælde af markedsforstyrrelser, og af forordning (EØF) nr. 2131/93 om procedurer
    og betingelser for salg af korn fra interventionsorganerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 120/94 της Επιτροπής
    της 25ης Ιανουαρίου 1994 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1533/93 περί θεσπίσεως ορισμένων
    λεπτομερών κανόνων εφαρμογής του κανονισμού
    (ΕΟΚ) αριθ. 1766/92 του Συμβουλίου όσον αφορά τη
