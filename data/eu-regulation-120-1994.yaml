    και των όρων διάθεσης των σιτηρών που κατέχουν
    οι οργανισμοί παρέμβασης
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 120/94, 25. jaanuar 1994, millega muudetakse
    määrust (EMÜ) nr 1533/93, millega sätestatakse teravilja eksporditoetuste
    andmist ja teraviljaturu häirete korral võetavaid meetmeid käsitleva nõukogu
    määruse (EMÜ) nr 1766/92 teatavad üksikasjalikud rakenduseeskirjad, ning määrust
    (EMÜ) nr 2131/93, millega sätestatakse sekkumisametite valduses oleva teravilja
    müügi kord ja tingimused
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 120/94, annettu 25 päivänä tammikuuta 1994,
    neuvoston asetuksen (ETY) N:o 1766/92 soveltamista koskevista tietyistä yksityiskohtaisista
    säännöistä vientitukien myöntämisen ja häiriötilanteessa toteutettavien
    toimenpiteiden osalta vilja-alalla annetun asetuksen (ETY) N:o 1533/93 sekä interventioelinten
    hallussaan pitämien viljojen myyntiin saattamisen menettelyistä ja edellytyksistä
    annetun asetuksen (ETY) N:o 2131/93 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: Bizottság 120/94/EK rendelete (1994. január 25.)az 1766/92/EGK tanácsi
    rendelet alapján kiadott, a gabonafélékkel kapcsolatos export-visszatérítések
    nyújtásának és a gabonafélék piacán bekövetkező zavarok esetén hozandó
    intézkedések egyes részletes szabályainak megállapításáról szóló 1533/93/EGK
    bizottsági rendelet, valamint az intervenciós hivatalok birtokában lévő gabonafélék
    értékesítési eljárásának és feltételeinek megállapításáról szóló
    2131/93/EGK bizottsági rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 120/94 della Commissione del 25 gennaio 1994 recante
    modifica del regolamento (CEE) n. 1533/93 che stabilisce modalità d'applicazione
    del regolamento (CEE) n. 1766/92 del Consiglio in relazione alla concessione delle
    restituzioni all'esportazione e le misure da adottare in caso di turbative nel
    settore dei cereali, nonché modifica del regolamento (CEE) n. 2131/93 che fissa
    le procedure e le condizioni per la vendita dei cereali detenuti dagli organismi
    d'intervento
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 120/94 (1994. gada 25. janvāris), ar kuru groza
    Regulu (EEK) Nr. 1533/93, ar ko nosaka dažus sīki izstrādātus noteikumus,
    ievērojot Padomes Regulu (EEK) Nr. 1766/92 par eksporta kompensāciju piešķiršanu
    attiecībā uz labību un par pasākumiem, kas jāpieņem labības tirgus traucējumu
    gadījumā, un Regulu (EEK) Nr. 2131/93, ar ko paredz kārtību un nosacījumus,
    ar kādiem tiek pārdota intervences aģentūru pārziņā esošā labība
  type: main
- language: lt
  script: Latn
  content: 1994 m. sausio 25 d. Komisijos Reglamentas (EB) Nr. 120/94 iš dalies keičiantis
    Reglamentą (EEB) Nr. 1533/93, nustatantį tam tikras išsamias taisykles pagal
    Tarybos reglamentą (EEB) Nr. 1766/92 dėl eksporto grąžinamųjų išmokų skyrimo
    už grūdus ir priemonių, kurių reikia imtis esant grūdų rinkos trikdymams,
    ir iš dalies keičiantis Reglamentą (EEB) Nr. 2131/93, nustatantį intervencinių
    agentūrų turimų grūdų pardavimo tvarką ir sąlygas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 120/94 tal-25 ta' Jannar 1994 li
    jemenda r-Regolament (KEE) Nru 1533/93 li jistabbilixxi ċerti regoli dettaljati
    bis-saħħa tar-Regolament tal-Kunsill (KEE) Nru 1766/92 dwar l-għoti ta'rifużjonijiet
    għall-esportazzjoni taċ-ċereali u l-miżuri li għandhom jittieħdu fil-każ
    ta' disturb fis-suq taċ-ċereali, u li jemenda r-Regolament (KEE) Nru 2131/93
    li jistabbilixxi l-proċedura u l-kondizzjonijiet għall-bejgħ taċ-ċereali
    miżmuma minn aġenziji tal-intervent
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 120/94 van de Commissie van 25 januari 1994 tot wijziging
    van Verordening (EEG) nr. 1533/93 tot vaststelling van toepassingsbepalingen van
    Verordening (EEG) nr. 1766/92 van de Raad voor de toekenning, in de graansector,
    van uitvoerrestituties en van bij verstoring van de graanmarkt te treffen maatregelen,
    en van Verordening (EEG) nr. 2131/93 tot vaststelling van de procedures en de
    voorwaarden voor de verkoop van graan door de interventiebureaus
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) NR 120/94 z dnia 25 stycznia 1994 r. zmieniające
    rozporządzenie (EWG) nr 1533/93 ustanawiające niektóre szczegółowe zasady
    na mocy rozporządzenia Rady (EWG) nr 1766/92 w sprawie przyznawania refundacji
    wywozowych do zbóż oraz środków podejmowanych w przypadku występowania zakłóceń
    na rynku zbóż oraz zmieniające rozporządzenie (EWG) nr 2131/93 ustanawiające
    procedury i warunki sprzedaży zbóż znajdujących się w posiadaniu agencji
    interwencyjnych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 120/94 da Comissão de 25 de Janeiro de 1994 que altera
    o Regulamento (CEE) nº 1533/93 que estabelece normas de execução do Regulamento
    (CEE) nº 1766/92 do Conselho, no que diz respeito à concessão de restituições
    à exportação, bem como às medidas a tomar em caso de perturbação, no sector
    dos cereais, e o Regulamento (CEE) nº 2131/93 que estabelece os processos e condições
    da colocação à venda dos cereais na posse dos organismos de intervenção
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 120/94 al Comisiei din 25 ianuarie 1994 de modificare
    a Regulamentului (CEE) nr. 1533/93 de instituire a anumitor norme de aplicare
    a Regulamentului (CEE) nr. 1766/92 al Consiliului privind acordarea de restituiri
    la exportul de cereale și măsurile ce trebuie luate în cazul dereglării pieței
    cerealelor și de modificare a Regulamentului (CEE) nr. 2131/93 de instituire
    a procedurii și condițiilor pentru vânzarea cerealelor deținute de către
    organismele de intervenție
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 120/94 z 25. januára 1994, ktoré mení a
    dopĺňa nariadenie (EHS) č. 1533/93 stanovujúce niektoré podrobné pravidlá
    podľa nariadenia Rady (EHS) č. 1766/92 o poskytovaní vývozných náhrad na
    obilniny a opatrenia, ktoré je potrebné prijať v prípade narušenia trhu s
    obilninami a ktoré mení a dopĺňa nariadenie (EHS) č. 2131/93 stanovujúce
    postup a podmienky predaja obilnín v držbe intervenčných agentúr
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 120/94 z dne 25. januarja 1994 o spremembi Uredbe
    (EGS) št. 1533/93 o nekaterih podrobnih pravilih za uporabo Uredbe Sveta (EGS)
    št. 1766/92 o dodeljevanju izvoznih nadomestil za žita in o ukrepih, ki jih
    je treba sprejeti v primeru motenj na trgu žit, in o spremembi Uredbe (EGS) št.
    2131/93 o postopku in pogojih za prodajo žit iz zalog intervencijskih agencij
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 120/94 de la Comisión de 25 de enero de 1994 por el
    que se modifica el Reglamento (CEE) n° 1533/93 por el que se establecen las disposiciones
    de aplicación del Reglamento (CEE) n° 1766/92 del Consejo en lo que respecta
    a la concesión de las restituciones por exportación y las medidas que deben
    adoptarse en caso de perturbación en el sector de los cereales, y el Reglamento
    (CEE) n° 2131/93 por el que se establecen los procedimientos y condiciones de
    la puesta en venta de cereales en poder de los organismos de intervención
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 120/94 av den 25 januari 1994 om ändring
    av förordning (EEG) nr 1533/93 om vissa närmare bestämmelser till rådets förordning
    (EEG) nr 1766/92 för beviljande av exportbidrag för spannmål och om de åtgärder
    som skall vidtas vid störningar på marknaden för spannmål, och om ändring
    av förordning (EEG) nr 2131/93 om förfarandet vid och villkoren för försäljning
    av spannmål som innehas av interventionsorgan
  type: main
