    předpisů týkajících se klasifikace, balení a označování nebezpečných
    látek
  type: main
- language: da
  script: Latn
  content: Kommissionens syvende direktiv 86/431/EØF af 24. juni 1986 om tilpasning
    til den tekniske udvikling af Rådets direktiv 67/548/EØF om tilnærmelse af
    lovgivningen om klassificering, emballering og etikettering af farlige stoffer
  type: main
- language: el
  script: Grek
  content: Έβδομη οδηγία 86/431/ΕΟΚ της Επιτροπής της
    24ης Ιουνίου 1986 για την προσαρμογή στην τεχνική
    πρόοδο της οδηγίας 67/548/ΕΟΚ του Συμβουλίου περί
    προσέγγισης των νομοθετικών, κανονιστικών
    και διοικητικών διατάξεων που αφορούν την
    ταξινόμηση, συσκευασία και επισήμανση των
    επικίνδυνων ουσιών
  type: main
- language: et
  script: Latn
  content: Seitsmes komisjoni direktiiv, 24. juuni 1986, millega kohandatakse tehnika
