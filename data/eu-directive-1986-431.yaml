  script: Latn
  content: Seventh Commission Directive 86/431/EEC of 24 June 1986 adapting to technical
    progress Council Directive 67/548/EEC on the approximation of laws, regulations
    and administrative provisions relating to the classification, packaging and labelling
    of dangerous substances
  type: main
- language: fr
  script: Latn
  content: Septième directive 86/431/CEE de la Commission du 24 juin 1986 portant
    adaptation au progrès technique de la directive 67/548/CEE du Conseil concernant
    le rapprochement des dispositions législatives, réglementaires et adminsitratives
    relatives à la classification, l'emballage et l'étiquetage des substances dangereuses
  type: main
- language: de
  script: Latn
  content: Siebte Richtlinie 86/431/EWG der Kommission vom 24. Juni 1986 zur Anpassung
