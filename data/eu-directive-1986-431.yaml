    lakien, asetusten ja hallinnollisten määräysten lähentämisestä annetun neuvoston
    direktiivin 67/548/ETY mukauttamisesta tekniikan kehitykseen
  type: main
- language: hu
  script: Latn
  content: A Bizottság hetedik irányelve (1986. június 24.) a veszélyes anyagok
