    i etykietowania substancji niebezpiecznych
  type: main
- language: pt
  script: Latn
  content: Sétima Directiva 86/431/CEE da Comissão de 24 de Junho de 1986 que adapta
    ao progresso técnico a Directiva 67/548/CEE do Conselho relativa à aproximação
    das disposições legislativas, regulamentares e administrativas respeitantes
    à classificação, embalagem e rotulagem das substâncias perigosas
  type: main
- language: sk
  script: Latn
  content: Siedma smernica Komisie z 24. júna 1986, ktorou sa prispôsobuje technickému
    pokroku smernica Rady 67/548/EHS o aproximácii zákonov, iných právnych predpisov
    a správnych opatrení týkajúcich sa klasifikácie, balenia a označovania nebezpečných
    látok
  type: main
- language: sl
  script: Latn
  content: Sedma Direktiva Komisije z dne 24. junija 1986 o prilagoditvi tehničnemu
