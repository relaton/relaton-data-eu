title:
- language: en
  script: Latn
  content: '81/674/EEC: Commission Decision of 24 July 1981 authorizing the Italian
    Republic not to apply Community treatment to mounted piezo-electric crystals originating
    in Japan (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/674/CEE: Décision de la Commission, du 24 juillet 1981, autorisant
    la République italienne à exclure du traitement communautaire les cristaux piézoélectriques
    montés originaires du Japon (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '81/674/EWG: Entscheidung der Kommission vom 24. Juli 1981 zur Ermächtigung
    der Italienischen Republik, aus Japan stammende gefaßte oder montierte piezoelektrische
    Kristalle von der Gemeinschaftsbehandlung auszuschließen (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/674/EØF: Kommissionens beslutning af 24. juli 1981 om bemyndigelse
    til Den italienske Republik til fra fællesskabsbehandling at undtage monterede
    piezo- elektriske krystaller med oprindelse i Japan (Kun den italienske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/674/ΕΟΚ: Απόφαση τής Επιτροπής τής 24ης
