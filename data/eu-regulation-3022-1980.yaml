  content: Commission Regulation (EEC) No 3022/80 of 24 November 1980 opening an invitation
    to tender for the levy and/or refund for the export of common wheat to countries
    of Zone IV, and amending Regulation (EEC) No 1427/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3022/80 de la Commission, du 24 novembre 1980, relatif
    à l'ouverture d'une adjudication du prélèvement et/ou de la restitution à
    l'exportation de froment tendre vers les pays de la zone IV et modifiant le règlement
    (CEE) n 1427/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3022/80 der Kommission vom 24. November 1980 zur Durchführung
    einer Ausschreibung der Abschöpfung und/oder der Erstattung für die Ausfuhr
    von Weichweizen nach den Ländern der Zone IV und zur Änderung der Verordnung
    (EWG) Nr. 1427/80
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3022/80 af 24. november 1980 om åbning
    af en licitation over afgiften og/eller over restitutionen ved udførsel af blød
    hvede til lande i zone IV og om ændring af forordning (EØF) nr. 1427/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3022/80 della Commissione, del 24 novembre 1980, che
    indice una gara per il prelievo e/o la restituzione all'esportazione di frumento
    tenero verso i paesi della zona IV e che modifica il regolamento (CEE) n. 1427/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3022/80 van de Commissie van 24 november 1980 inzake
    een openbare inschrijving voor de heffing en/of de restitutie bij uitvoer van
    zachte tarwe naar de landen van de zone IV, en tot wijziging van Verordening (EEG)
    nr. 1427/80
