    tas-swaba’ jistgħu jiġu skambjati mar-Renju Unit
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/1729 van de Raad van 24 september 2021 betreffende het
    standpunt dat namens de Europese Unie moet worden ingenomen in het Gespecialiseerd
    Comité voor samenwerking inzake rechtshandhaving en justitie dat is opgericht
    bij de handels- en samenwerkingsovereenkomst tussen de Europese Unie en de Europese
    Gemeenschap voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk van Groot-Brittannië
    en Noord-Ierland, anderzijds, met betrekking tot de verlenging van de in artikel
    540, lid 3, van die overeenkomst bedoelde periode waarin DNA-profielen en vingerafdrukken
    kunnen worden uitgewisseld met het Verenigd Koninkrijk
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/1729 z dnia 24 września 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Specjalnego Komitetu
    ds. Współpracy Organów Ścigania i Wymiarów Sprawiedliwości ustanowionego
    na mocy Umowy o handlu i współpracy między Unią Europejską i Europejską
    Wspólnotą Energii Atomowej, z jednej strony, a Zjednoczonym Królestwem Wielkiej
    Brytanii i Irlandii Północnej, z drugiej strony, w odniesieniu do przedłużenia
    okresu, o którym mowa w art. 540 ust. 3 tej umowy, w którym możliwa jest wymiana
    profili DNA i odcisków palców ze Zjednoczonym Królestwem
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/1729 do Conselho de 24 de setembro de 2021 relativa
    à posição a tomar em nome da União Europeia no âmbito do Comité Especializado
    da Aplicação da Lei e Cooperação Judiciária instituído pelo Acordo de Comércio
    e Cooperação entre a União Europeia e a Comunidade Europeia da Energia Atómica,
    por um lado, e o Reino Unido da Grã-Bretanha e da Irlanda do Norte, por outro,
    no que respeita à prorrogação do período referido no artigo 540.o, n.o 3,
    do Acordo, durante o qual se pode proceder ao intercâmbio de perfis de ADN e
    de impressões digitais com o Reino Unido
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/1729 a Consiliului din 24 septembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Comitetului
    specializat privind cooperarea în materie de asigurare a respectării legii și
    cooperarea judiciară, instituit prin Acordul comercial și de cooperare dintre
    Uniunea Europeană și Comunitatea Europeană a Energiei Atomice, pe de o parte,
    și Regatul Unit al Marii Britanii și Irlandei de Nord, pe de altă parte, în
    ceea ce privește prelungirea perioadei menționate la articolul 540 alineatul
    (3) din acordul menționat în cursul căreia se poate face schimb de profiluri
    ADN și de amprente digitale cu Regatul Unit
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/1729 z 24. septembra 2021 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Osobitnom výbore pre spoluprácu v oblasti
    presadzovania práva a justičnú spoluprácu zriadenom Dohodou o obchode a spolupráci
    medzi Európskou úniou a Európskym spoločenstvom pre atómovú energiu na jednej
    strane a Spojeným kráľovstvom Veľkej Británie a Severného Írska na strane
    druhej, pokiaľ ide o predĺženie lehoty uvedenej v článku 540 ods. 3 tejto
    dohody, počas ktorej si možno so Spojeným kráľovstvom vymieňať profily
    DNA a odtlačky prstov
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/1729 z dne 24. septembra 2021 o stališču, ki se
    v imenu Evropske unije zastopa v Specializiranem odboru za sodelovanje na področju
    kazenskega pregona in pravosodno sodelovanje, ustanovljenem s Sporazumom o trgovini
    in sodelovanju med Evropsko unijo in Evropsko skupnostjo za atomsko energijo na
    eni strani ter Združenim kraljestvom Velika Britanija in Severna Irska na drugi
    strani, glede podaljšanja obdobja iz člena 540(3) navedenega sporazuma, med
    katerim je mogoča izmenjava profilov DNK in prstnih odtisov z Združenim kraljestvom
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/1729 del Consejo de 24 de septiembre de 2021 relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Comité
    Especializado en Cooperación Policial y Judicial establecido por el Acuerdo de
    Comercio y Cooperación entre la Unión Europea y la Comunidad Europea de la Energía
    Atómica, por una parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte,
    por otra, en lo que respecta a la prórroga del período mencionado en el artículo
    540, apartado 3, de dicho Acuerdo durante el cual pueden intercambiarse perfiles
    de ADN e impresiones dactilares con el Reino Unido
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/1729 av den 24 september 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den specialiserade kommitté för
    samarbete inom brottsbekämpning och rättsliga frågor som inrättats genom avtalet
    om handel och samarbete mellan Europeiska unionen och Europeiska atomenergigemenskapen,
    å ena sidan, och Förenade konungariket Storbritannien och Nordirland, å andra
    sidan, beträffande förlängning av den period som avses i artikel 540.3 i det
    avtalet och under vilken DNA-profiler och fingeravtryck kan utbytas med Förenade
    kungariket
