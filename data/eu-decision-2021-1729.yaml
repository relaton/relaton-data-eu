    dwar l-Infurzar tal-Liġi u l-Kooperazzjoni Ġudizzjarja stabbilit mill-Ftehim
    dwar il-Kummerċ u l-Kooperazzjoni bejn l-Unjoni Ewropea u l-Komunità Ewropea
