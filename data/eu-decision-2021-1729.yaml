  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2021/1729 od 24. rujna 2021. o stajalištu koje treba
    zauzeti u ime Europske unije u Posebnom odboru za suradnju u izvršavanju zakonodavstva
    i pravosudnu suradnju osnovanom Sporazumom o trgovini i suradnji između Europske
    unije i Europske zajednice za atomsku energiju, s jedne strane, i Ujedinjene Kraljevine
    Velike Britanije i Sjeverne Irske, s druge strane, u pogledu produljenja razdoblja
    iz članka 540. stavka 3. tog sporazuma tijekom kojeg se profili DNK-a i otisci
    prstiju mogu razmjenjivati s Ujedinjenom Kraljevinom
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/1729 határozata (2021. szeptember 24.) az egyrészről
    az Európai Unió és az Európai Atomenergia-közösség, és másrészről Nagy-Britannia
    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodással létrehozott bűnüldözési és igazságügyi együttműködéssel
    foglalkozó szakbizottságban az említett megállapodás 540. cikkének (3) bekezdésében
    említett – a DNS-profiloknak és az ujjnyomatoknak az Egyesült Királysággal
    történő cseréjére rendelkezésre álló – időtartam meghosszabbításával
    kapcsolatban az Európai Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/1729 del Consiglio del 24 settembre 2021 relativa alla
    posizione da adottare a nome dell’Unione europea nel comitato specializzato
    per la cooperazione delle autorità di contrasto e giudiziarie istituito dall’accordo
    sugli scambi commerciali e la cooperazione tra l’Unione europea e la Comunità
    europea dell’energia atomica, da una parte, e il Regno Unito di Gran Bretagna
    e Irlanda del Nord, dall’altra, per quanto riguarda la proroga del periodo di
