  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2021/1729, annettu 24 päivänä syyskuuta 2021,
    Euroopan unionin ja Euroopan atomienergiayhteisön sekä Ison-Britannian ja Pohjois-Irlannin
    yhdistyneen kuningaskunnan välisellä kauppa- ja yhteistyösopimuksella perustetussa
    lainvalvonta- ja oikeusyhteistyön erityiskomiteassa Euroopan unionin puolesta
