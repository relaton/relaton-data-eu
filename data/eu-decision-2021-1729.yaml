title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1729 of 24 September 2021 on the position to
    be taken on behalf of the European Union in the Specialised Committee on Law Enforcement
    and Judicial Cooperation established by the Trade and Cooperation Agreement between
    the European Union and the European Atomic Energy Community, of the one part,
    and the United Kingdom of Great Britain and Northern Ireland, of the other part,
    regarding the extension of the period referred to in Article 540(3) of that Agreement
    during which DNA profiles and fingerprints can be exchanged with the United Kingdom
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1729 du Conseil du 24 septembre 2021 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité spécialisé
    chargé de la coopération des services répressifs et judiciaires institué par
    l’accord de commerce et de coopération entre l’Union européenne et la Communauté
    européenne de l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne
    et d’Irlande du Nord, d’autre part, en ce qui concerne la prolongation, prévue
    à l’article 540, paragraphe 3, dudit accord, de la période au cours de laquelle
    les profils ADN et les empreintes digitales peuvent être échangés avec le Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1729 des Rates vom 24. September 2021 über den im
    Namen der Europäischen Union im Sonderausschuss für die polizeiliche und justizielle
    Zusammenarbeit, der mit dem Abkommen über Handel und Zusammenarbeit zwischen
    der Europäischen Union und der Europäischen Atomgemeinschaft einerseits und
    dem Vereinigten Königreich Großbritannien und Nordirland andererseits eingerichtet
    wurde, hinsichtlich der Verlängerung der Frist nach Artikel 540 Absatz 3 jenes
    Abkommens, in der DNA-Profile und Fingerabdrücke mit dem Vereinigten Königreich
    ausgetauscht werden können, zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/1729 на Съвета от 24 септември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Специализирания комитет по правоприлагането
    и съдебното сътрудничество, създаден със Споразумението
    за търговия и сътрудничество между Европейския
    съюз и Европейската общност за атомна енергия,
    от една страна, и Обединеното кралство Великобритания
    и Северна Ирландия, от друга страна, във връзка
    с удължаването на периода, предвиден в член
    540, параграф 3 от посоченото Споразумение, по
    време на който могат да се обменят ДНК профили
    и дактилоскопични отпечатъци с Обединеното
    кралство
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/1729 ze dne 24. září 2021 o postoji, který
    má být zaujat jménem Evropské unie ve specializovaném výboru pro spolupráci
    v oblasti prosazování práva a justiční spolupráci zřízeném Dohodou o
    obchodu a spolupráci mezi Evropskou unií a Evropským společenstvím pro atomovou
    energii na jedné straně a Spojeným královstvím Velké Británie a Severního
    Irska na straně druhé, pokud jde o prodloužení období uvedeného v čl. 540
    odst. 3 uvedené dohody, během něhož mohou být se Spojeným královstvím
    vyměňovány údaje o profilech DNA a otiscích prstů
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/1729 af 24. september 2021 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i Specialudvalget om Retshåndhævelse
    og Retligt Samarbejde, der er nedsat ved handels- og samarbejdsaftalen mellem
    Den Europæiske Union og Det Europæiske Atomenergifællesskab på den ene side
    og Det Forenede Kongerige Storbritannien og Nordirland på den anden side, til
    forlængelsen af den frist, jf. nævnte aftales artikel 540, stk. 3, inden for
    hvilken der kan udveksles DNA-profiler og fingeraftryk med Det Forenede Kongerige
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2021/1729 του Συμβουλίου της 24ης
