    να ληφθεί εξ ονόματος της Ευρωπαϊκής Ένωσης
    στην ειδική επιτροπή για τη συνεργασία στον
    τομέα της επιβολής του νόμου και τη δικαστική
    συνεργασία που συστάθηκε με τη συμφωνία εμπορίου
    και συνεργασίας μεταξύ της Ευρωπαϊκής Ένωσης
    και της Ευρωπαϊκής Κοινότητας Ατομικής Ενέργειας,
    αφενός, και του Ηνωμένου Βασιλείου της Μεγάλης
    Βρετανίας και της Βόρειας Ιρλανδίας, αφετέρου,
    όσον αφορά την παράταση της περιόδου που αναφέρεται
    στο άρθρο 540 παράγραφος 3 της εν λόγω συμφωνίας
    κατά την οποία μπορούν να ανταλλάσσονται προφίλ
    DNA και δακτυλικά αποτυπώματα με το Ηνωμένο
