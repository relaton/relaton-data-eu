    economica europea e la Turchia, che fissa, per il periodo 1° novembre 1981 -
    31 ottobre 1982, l' importo aggiuntivo da detrarre dal prelievo applicabile all'
    importazione nella Comunità di olio di oliva non trattato originario della Turchia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3548/81 van de Raad van 3 december 1981 betreffende
