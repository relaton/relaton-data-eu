    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und der Türkei zur Festsetzung des vom 1. November 1981 bis 31. Oktober 1982
    geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht behandeltem
    Olivenöl mit Ursprung in der Türkei von der Abschöpfung abzuziehen ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3548/81 af 3. december 1981 om indgåelse
    af aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og Tyrkiet vedrørende fastsættelse for perioden 1. november 1981 til 31. oktober
    1982 af det tillægsbeløb, som skal fratrækkes den afgift, der anvendes ved
    indførsel af ikke behandlet olivenolie med oprindelse i Tyrkiet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3548/81 τού Συμβουλίου
    τής 3ης Δεκεμβρίου 1981 περί συνάψεως συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ τής
    Ευρωπαϊκής Οικονομικής Κοινότητος καί τής
    Τουρκίας περί καθορισμού, γιά τήν περίοδο από
    1 Νοεμβρίου 1981 έως 31 Οκτωβρίου 1982, τού πρόσθετου
    ποσού πού πρέπει νά αφαιρεθεί από τήν εισφορά
