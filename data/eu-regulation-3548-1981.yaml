  content: Council Regulation (EEC) No 3548/81 of 3 December 1981 on the conclusion
    of the Agreement in the form of an exchange of letters between the European Economic
    Community and Turkey fixing the additional amount to be deducted from the levy
    on imports into the Community of untreated olive oil, originating in Turkey, for
    the period 1 November 1981 to 31 October 1982
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3548/81 du Conseil, du 3 décembre 1981, concernant
    la conclusion de l' accord sous forme d' échange de lettres entre la Communauté
    économique européenne et la Turquie fixant, pour la période du 1er novembre
    1981 au 31 octobre 1982, le montant additionnel à déduire du prélèvement applicable
    à l' importation dans la Communauté d' huile d' olive non traitée originaire
    de Turquie
  type: main
- language: de
  script: Latn
