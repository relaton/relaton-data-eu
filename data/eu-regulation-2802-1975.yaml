title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2802/75 of the Commission of 29 October 1975 derogating
    from Regulation (EEC) No 1492/71 in respect of the minimum quantities of durum
    wheat that may be taken over by the intervention agency in Italy in the 1975/76
    marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2802/75 de la Commission, du 29 octobre 1975, dérogeant
    au règlement (CEE) n° 1492/71 en ce qui concerne la quantité minimale de froment
    dur pouvant être prise en charge par l'organisme d'intervention en Italie pour
    la campagne 1975/1976
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2802/75 der Kommission vom 29. Oktober 1975 zur Änderung
    der Verordnung (EWG) Nr. 1492/71 hinsichtlich der Mindestmenge Hartweizen, die
    von der italienischen Interventionsstelle für das Wirtschaftsjahr 1975/1976 übernommen
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2802/75 af 29. oktober 1975 om afvigelse
    fra forordning (EØF) nr. 1492/71 for så vidt angår den minimumsmængde af hård
    hvede, der kan overtages af interventionsorganerne i Italien for produktionsåret
    1975/1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2802/75 della Commissione, del 29 ottobre 1975, recante
    deroga al regolamento (CEE) n. 1492/71 per quanto riguarda il quantitativo minimo
    di frumento duro che può essere preso in consegna dall'organismo d'intervento
    italiano nella campagna 1975/1976
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2802/75 van de Commissie van 29 oktober 1975 houdende
    afwijking van Verordening (EEG) nr. 1492/71 inzake de minimumhoeveelheid durumtarwe
    die in het verkoopseizoen 1975/1976 door het interventiebureau in Italië kan
    worden overgenomen
  type: main
