title:
- language: fr
  script: Latn
  content: Décision 67/644/CEE de la Commission, du 5 octobre 1967, autorisant la
    République française, en vertu de l'article 115 alinéa 1 du Traité, à percevoir
    une taxe compensatoire à l'importation des "haricots secs non triés" de la position
    n° 07.05 Ex A du Tarif douanier commun originaires de Roumanie et mis en libre
    pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '67/644/EWG: Entscheidung der Kommission vom 5. Oktober 1967, mit der die
    Französische Republik ermächtigt wird, auf die Einfuhr von aus Rumänien stammenden
    und in den Benelux-Ländern im freien Verkehr befindlichen "nichtverlesenen trockenen
    Bohnen" der Tarifnummer 07.05 ex A des Gemeinsamen Zolltarifs eine Ausgleichsabgabe
    zu erheben'
  type: main
- language: it
  script: Latn
  content: '67/644/CEE: Decisione della Commissione, del 5 ottobre 1967, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del Trattato,
    a riscuotere una tassa di compensazione all''importazione dei «fagioli secchi
    non mondati» della voce n. 07.05 ex A della tariffa doganale comune, originari
    della Romania e immessi in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '67/644/EEG: Beschikking van de Commissie van 5 oktober 1967 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea, van het Verdrag
    een compenserende heffing toe te passen bij de invoer van ongesorteerde gedroogde
    bonen van post 07.05 ex A van het gemeenschappelijk douanetarief, die van oorsprong
    zijn uit Roemenië en in de Beneluxlanden in het vrije verkeer zijn gebracht'
  type: main
