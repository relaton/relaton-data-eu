title:
- language: en
  script: Latn
  content: '77/157/EEC: Council Decision of 14 February 1977 amending the list of
    the countries and territories referred to in Decision 76/198/EEC on import arrangements
    for rum, arrack and tafia falling within subheading 22.09 C I of the Common Customs
    Tariff originating in the overseas countries and territories associated with the
    European Economic Community'
  type: main
- language: fr
  script: Latn
  content: '77/157/CEE: Décision du Conseil, du 14 février 1977, modifiant la décision
    76/198/CEE relative à l'' importation du rhum, de l'' arak et du tafia, relevant
    de la sous-position 22.09 C I du tarif douanier commun, originaires des pays et
    territoires d'' outre-mer associés à la Communauté économique européenne,
    en ce qui concerne la liste des pays et territoires'
  type: main
- language: de
  script: Latn
  content: '77/157/EWG: Beschluß des Rates vom 14. Februar 1977 zur Änderung des
    Beschlusses 76/198/EWG über die Einfuhr von Rum, Arrak und Taffia der Tarifstelle
    22.09 C I des Gemeinsamen Zolltarifs mit Ursprung in den mit der Europäischen
    Wirtschaftsgemeinschaft assoziierten überseeischen Ländern und Gebieten hinsichtlich
    der Liste der einbezogenen Länder und Gebiete'
  type: main
- language: da
  script: Latn
  content: '77/157/EØF: Rådets afgørelse af 14. februar 1977 om ændring af afgørelse
    76/198/EØF om en importordning for rom, arrak og tafia henhørende under position
    22.09 C I i den fælles toldtarif og med oprindelse i de oversøiske lande og
    territorier, der er associeret Det europæiske økonomiske Fællesskab med hensyn
    til listen over lande og territorier'
  type: main
- language: it
  script: Latn
  content: '77/157/CEE: Decisione del Consiglio, del 14 febbraio 1977, che modifica
    la decisione 76/198/CEE relativa all'' importazione del rum, dell'' arak e del
    tafia della sottovoce 22.09 C I della tariffa doganale comune, originari dei paesi
    e territori d'' oltremare associati alla Comunità economica europea, per quanto
    riguarda l'' elenco dei paesi e territori'
  type: main
- language: nl
  script: Latn
  content: '77/157/EEG: Besluit van de Raad van 14 februari 1977 tot wijziging van
    Besluit 76/198/EEG inzake de invoerregeling voor rum, arak en tafia van onderverdeling
    22.09 C I van het gemeenschappelijk douanetarief, van oorsprong uit de met de
    Europese Economische Gemeenschap geassocieerde landen en gebieden overzee, voor
    wat betreft de lijst van landen en gebieden'
