id: EUDecision1984633
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '84/633/EEC: Council Decision of 11 December 1984 authorizing the Commission,
    within the context of the voluntary restraint agreements on trade in the sheepmeat
    and goatmeat sector between the Community and 12 non- member States, to convert,
    for the purposes of the smooth operation of trade and within the limits agreed,
    live animal quantities into fresh or chilled meat quantities or such latter quantities
    into the former'
  type: main
- language: fr
  script: Latn
  content: '84/633/CEE: Décision du Conseil du 11 décembre 1984 autorisant la Commission,
    dans le cadre des accords d''autolimitation sur le commerce dans le secteur des
    viandes ovine et caprine conclus entre la Communauté et douze pays tiers, à
    convertir les animaux vivants en viande fraîche au réfrigérée, ou inversement,
    dans les limites des quantités convenues, pour assurer le fonctionnement harmonieux
    des échanges'
  type: main
- language: de
  script: Latn
  content: '84/633/EWG: Beschluß des Rates vom 11. Dezember 1984 zur Ermächtigung
    der Kommission, im Rahmen der zwischen der Gemeinschaft und zwölf Drittländern
    geschlossenen Selbstbeschränkungsabkommen über den Handel mit Erzeugnissen des
    Schaf- und Ziegenfleischsektors im Interesse einer reibungslosen Abwicklung des
    Handels innerhalb der vereinbarten Mengen lebende Tiere in frisches oder gekühltes
    Fleisch und umgekehrt umzurechnen'
  type: main
- language: da
  script: Latn
  content: '84/633/EØF: Rådets afgørelse af 11. december 1984 om bemyndigelse af
    Kommissionen til med henblik på en gnidningsløs samhandel at foretage en konvertering
    fra levende dyr til fersk eller kølet kød eller omvendt for så vidt angår
    de mængder, der omfattes af aftalerne mellem Fællesskabet og 12 tredjelande
    om frivillig begrænsning af eksporten af fåre- og gedekød'
  type: main
- language: el
  script: Grek
  content: '84/633/ΕΟΚ: Απόφαση του Συμβουλίου της 11ης
    Δεκεμβρίου 1984 που εξουσιοδοτεί την Επιτροπή,
    στα πλαίσια των συμφωνιών αυτοπεριορισμού
    στις συναλλαγές στον τομέα του προβείου και
    αιγείου κρέατος μεταξύ της Κοινότητας και
    δώδεκα τρίτων χωρών, να μετατρέπει, εντός των
    συμφωνηθέντων ορίων, ποσότητες ζώντων ζώων
    σε κρέας νωπό ή διατηρημένο με απλή ψύξη ή αντίθετα,
    προκειμένου να εξασφαλίζεται η ομαλή διεξαγωγή
    των συναλλαγών'
  type: main
- language: fi
  script: Latn
  content: '84/633/ETY: Neuvoston päätös, tehty 11 päivänä joulukuuta 1984,
    elävien eläinten määrän sovittujen määrien rajoissa muuttamista tuoreeksi
    tai jäähdytetyksi lihaksi tai päinvastoin koskevien valtuuksien antamisesta
    komissiolle yhteisön ja 12 kolmannen maan välisten lampaan- ja vuohenliha-alan
    kaupan vapaaehtoisia rajoitussopimuksia noudattaen kaupan joustavuuden varmistamiseksi'
  type: main
- language: it
  script: Latn
  content: '84/633/CEE: Decisione del Consiglio dell''11 dicembre 1984 che, ai fini
    di un funzionamento armonioso degli scambi, autorizza la Commissione, nel quadro
    degli accordi di autolimitazione del commercio di carni ovine e caprine tra la
    Comunità e dodici paesi terzi, a convertire, limitatamente ai quantitativi convenuti,
    animali vivi in carne fresca o refrigerata, o viceversa'
  type: main
- language: nl
  script: Latn
  content: '84/633/EEG: Besluit van de Raad van 11 december 1984 waarbij de Commissie
    wordt gemachtigd om in het kader van de tussen de Gemeenschap en twaalf derde
    landen gesloten overeenkomsten inzake vrijwillige beperking van de handel in de
    sector schape- en geitevlees, met het oog op een harmonisch verloop van de handel
    en met inachtneming van de overeengekomen hoeveelheden, levende dieren in vers
    of bevroren vlees of vers of bevroren vlees in levende dieren om te rekenen'
  type: main
- language: pt
  script: Latn
  content: '84/633/CEE: Decisão do Conselho, de 11 de Dezembro de 1984, que autoriza
    a Comissão, no quadro dos acordos de autolimitação sobre o comércio no sector
    das carnes de ovino e de caprino concluídos entre a Comunidade e doze países
    terceiros, a converter os animais vivos em carne fresca ou refrigerada, ou inversamente,
    nos limites das quantidades acordadas, para assegurar o funcionamento harmonioso
    das trocas comerciais'
  type: main
- language: es
  script: Latn
  content: '84/633/CEE: Decisión del Consejo, de 11 de diciembre de 1984, por la
    que se autoriza a la Comisión, en el marco de los Acuerdos de autolimitación
    del comercio en el sector de las carnes de ovino y caprino celebrados entre la
    Comunidad y doce terceros países, a convertir los animales vivos en carne fresca
    o refrigerada, o a la iversa, hasta el límite de las cantidades convenidas, a
    fin de garantizar el funcionamiento equilibrado de los intercambios'
  type: main
- language: sv
  script: Latn
  content: '84/633/EEG: Rådets beslut av den 11 december 1984 om bemyndigande för
    kommissionen att i samband med avtalen om frivilliga exportbegränsningar inom
    får- och getköttssektorn mellan gemenskapen och tolv icke-medlemsländer omvandla
    kvantiteter levande djur till kvantiteter färskt eller kylt kött eller vice
    versa inom ramen för överenskomna kvantiteter, i syfte att handeln skall fungera
    smidigt'
  type: main
