title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 167/79 of 30 January 1979 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain for the period 1 February to 31 March 1979
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 167/79 du Conseil, du 30 janvier 1979, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne pour la période allant du 1er février
    au 31 mars 1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 167/79 des Rates vom 30. Januar 1979 zur Festlegung
    bestimmter Übergangsmaßnahmen für die Zeit vom 1. Februar bis zum 31. März
    1979 zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber Schiffen,
    die die Flagge Spaniens führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 167/79 af 30. januar 1979 om fastsættelse
    af en række midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der sejler under spansk flag, i perioden
    1. februar til 31. marts 1979
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 167/79 del Consiglio, del 30 gennaio 1979, che stabilisce
    talune misure provvisorie per la conservazione e la gestione delle risorse ittiche
    da applicare alle navi battenti bandiera della Spagna per il periodo dal 1° febbraio
    al 31 marzo 1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 167/79 van de Raad van 30 januari 1979 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden die van 1 februari tot en met 31 maart 1979 van toepassing zijn
    op vaartuigen die de vlag van Spanje voeren
  type: main
