    1968/1969 eingelagert und zur Ausfuhr bestimmt sind
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1212/69 del Consiglio, del 26 giugno 1969, che fissa
    un importo compensativo per il frumento duro e l'orzo che si trovano in stock
    alla fine della campagna di commercializzazione 1968/1969 e che sono destinati
    all'esportazione
  type: main
