title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2834/82 of 25 October 1982 amending Regulation
    (EEC) No 2104/75 as regards certain special detailed rules for the application
    of the system of import licences and advance fixing certificates for products
    processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2834/82 de la Commission, du 25 octobre 1982, modifiant
    le règlement (CEE) n° 2104/75 en ce qui concerne certaines modalités particulières
    d' application du régime des certificats d' importation et de préfixation dans
    le secteur des produits transformés à base de fruits et légumeso
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2834/82 der Kommission vom 25. Oktober 1982 zur Änderung
    der Verordnung (EWG) Nr. 2104/75 hinsichtlich einiger besonderer Durchführungsbestimmungen
    für Einfuhrlizenzen und Vorausfestsetzungsbescheinigungen für Verarbeitungserzeugnisse
    aus Obst und Gemüseg
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2834/82 af 25. oktober 1982 om ændring
    af forordning (EØF) nr. 2104/75 for så vidt angår visse særlige gennemførelsesbestemmelser
    for ordningen med importlicenser og forudfastsættelsesattester for produkter
    forarbejdet på basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2834/82 τής Επιτροπής
    τής 25ης Οκτωβρίου 1982 περί τροποποιήσεως τού
