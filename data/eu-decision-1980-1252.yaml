title:
- language: en
  script: Latn
  content: '80/1252/ECSC: Commission Decision of 19 December 1980 authorizing the
    Chamber of Coal Traders of the United Kingdom and the National Coal Board to establish
    an equalization fund to reduce the price of anthracite and anthracite briquettes
    originating from within the Community and from third countries (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1252/CECA: Décision de la Commission, du 19 décembre 1980, autorisant
    la constitution d''une caisse de péréquation par la Chamber of Coal Traders
    du Royaume- Uni et le National Coal Board en vue de réduire les prix de l''anthracite
    et des agglomérés d''anthracite provenant de la Communauté et des pays tiers
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1252/EGKS: Entscheidung der Kommission vom 19. Dezember 1980 über
    die Genehmigung einer von der Chamber of Coal Traders des Vereinigten Königreichs
    und dem National Coal Board eingerichteten Ausgleichskasse zur Verbilligung von
    aus der Gemeinschaft und Drittländern bezogenem Anthrazit und Anthrazitbriketts
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1252/EKSF: Kommissionens beslutning af 19. december 1980 om godkendelse
    af en af Chamber of Coal Traders i Det forenede Kongerige og National Coal Board
    indført udligningskasse til billiggørelse af antracit og antracitbriketter indkøbt
    fra Fællesskabet og tredjelande (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/1252/ΕΚΑΧ : Απόφαση της Επιτροπής, της 19ης
    Δεκεμβρίου 1980, με την οποία επιτρέπεται η δημιουργία
    Ταμείου εξίσωσης από το CHAMBER OF COAL TRADERS του Ηνωμένου
    Βασιλείου και το NATIONAL COAL BOARD ενόψει της μείωσης
    της τιμής του ανθρακίτη και συσσωματωμάτων
    ανθρακίτη προέλευσης Κοινότητας και τρίτων
    χωρών (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/1252/CECA: Decisione della Commissione, del 19 dicembre 1980, relativa
    all''autorizzazione di una cassa di compensazione istituita dalla Chamber of Coal
    Traders del Regno Unito e dal National Coal Board al fine di ribassare il prezzo
    dell''antracite e della bricchetta d''antracite acquistate nella Comunità e nei
    paesi terzi (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1252/EGKS: Beschikking van de Commissie van 19 december 1980 inzake
    de ontheffing van het kartelverbod voor een door de Chamber of Coal Traders van
    het Verenigd Koninkrijk en het National Coal Board opgerichte compensatiekas voor
    het goedkoper maken van uit de Gemeenschap en uit derde landen betrokken antraciet
    en antracietbriketten (Slechts de tekst in de Engelse taal is authentiek)'
