    (ΕΚ) αριθ. 1185/1999 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 475 000 τόνων κριθής που έχει στη διάθεσή
    του ο ισπανικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1465/1999, annettu 5 päivänä heinäkuuta 1999,
    asetuksen (EY) N:o 1185/1999 muuttamisesta ja Espanjan interventioelimen hallussaan
    pitämän ohran vientiä koskevan pysyvän tarjouskilpailun kohteena olevan määrän
    nostamisesta 475 000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1465/1999 della Commissione, del 5 luglio 1999, che
