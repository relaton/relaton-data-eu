    openbare inschrijving voor de uitvoer van gerst uit Spaanse interventievoorraden
    betrekking heeft, tot 475 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1465/1999 da Comissão, de 5 de Julho de 1999, que
