    Ausfuhr von im Besitz der spanischen Interventionsstelle befindlicher Gerste auf
    475 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1465/1999 af 5. juli 1999 om ændring
    af forordning (EF) nr. 1185/1999 og om forhøjelse til 475 000 tons af den løbende
