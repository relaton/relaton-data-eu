    der Liste der Regionen der Gemeinschaft, in denen die Hartweizenbeihilfe gewährt
    wird, sowie zur Festsetzung der Höhe dieser Beihilfen für das Wirtschaftsjahr
    1981/82
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1954/81 af 13. juli 1981 om fastsættelse
