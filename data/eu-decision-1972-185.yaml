title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 avril 1972, complétant la décision,
    du 14 janvier 1972, autorisant le Royaume de Belgique, la République fédérale
    d'Allemagne, la République française et le Royaume des Pays-Bas à admettre
    à la commercialisation des matériels de reproduction de pinus nigra arno var.
    austrica, soumis à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '72/185/EWG: Entscheidung der Kommission vom 19. April 1972 zur Ergänzung
    der Entscheidung vom 14. Januar 1972, mit der das Königreich Belgien, die Bundesrepublik
    Deutschland, die Französische Republik und das Königreich der Niederlande ermächtigt
    werden, Vermehrungsgut von Pinus nigra Arn. var. austriaca mit minderen Anforderungen
    zum gewerbsmäßigen Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '72/185/CEE: Decisione della Commissione, del 19 aprile 1972, che completa
    la decisione del 14 gennaio 1972 che autorizza il Regno del Belgio, la Repubblica
    federale di Germania, la Repubblica francese e il Regno dei Paesi Bassi ad ammettere
    alla commercializzazione dei materiali di moltiplicazione di Pinus nigra Arn.
    var. austriaca, soggetti a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '72/185/EEG: Beschikking van de Commissie van 19 april 1972 houdende aanvulling
    van de beschikking van 14 januari 1972 houdende machtiging van het Koninkrijk
    België, de Bondsrepubliek Duitsland, de Franse Republiek en het Koninkrijk der
    Nederlanden om teeltmateriaal van Pinus nigra Arn. var. austriaca, waaraan minder
    strenge eisen zijn gesteld, tot de handel toe te laten'
  type: main
