  content: '2000/788/EC: Council Decision of 4 December 2000 amending Decision 2000/24/EC
    so as to establish a European Investment Bank special action programme in support
    of the consolidation and intensification of the EC-Turkey customs union'
  type: main
- language: fr
  script: Latn
  content: '2000/788/CE: Décision du Conseil du 4 décembre 2000 modifiant la décision
    2000/24/CE afin de mettre en place un programme d''action spécial de la Banque
    européenne d''investissement pour la consolidation et le resserrement de l''union
    douanière CE-Turquie'
  type: main
- language: de
  script: Latn
