title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3074/95 of 22 December 1995 fixing, for certain
    fish stocks and groups of fish stocks, the total allowable catches for 1996 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3074/95 du Conseil, du 22 décembre 1995, fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1996 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3074/95 des Rates vom 22. Dezember 1995 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechender Fangbedingungen für bestimmte
    Fischbestände oder -bestandsgruppen (1996)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3074/95 af 22. december 1995 om fastsættelse
    for 1996 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Kανονισμός (ΕΚ) αριθ. 3074/95 του Συμβουλίου,
    της 22ας Δεκεμβρίου 1995, περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1996, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3074/95, annettu 22 päivänä joulukuuta 1995,
    tiettyjen kalakantojen ja kalakantaryhmien osalta vuodeksi 1996 vahvistettavista
    suurimmista sallituista saaliista ja niiden pyyntiä koskevista tietyistä edellytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3074/95 del Consiglio, del 22 dicembre 1995, che stabilisce,
    per alcuni stock o gruppi di stock ittici, il totale ammissibile di catture (TAC)
    per il 1996 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3074/95 van de Raad van 22 december 1995 inzake de
    vaststelling van de voor 1996 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden, alsmede bepaalde bij de visserij in acht
    te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3074/95 do Conselho, de 22 de Dezembro de 1995, que
    fixa os totais admissíveis de capturas para 1996 e certas condições em que
    podem ser pescadas determinadas unidades populacionais ou grupos de unidades populacionais
    de peixes
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3074/95 del Consejo, de 22 de diciembre de 1995, por
    el que se fijan los totales admisibles de capturas de determinadas poblaciones
    y grupos de poblaciones de peces para 1996 y determinadas condiciones en las que
    pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3074/95 av den 22 december 1995 om fastställande,
    för vissa fiskbestånd och grupper av fiskbestånd, av totala tillåtna fångstmängder
    under 1996 och av vissa villkor för fångsten
  type: main
