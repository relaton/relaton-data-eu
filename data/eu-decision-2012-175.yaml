---
id: EUDecision2012175
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2012/175/EU: Commission Implementing Decision of 23 March 2012 amending
    Decision 2006/133/EC requiring Member States temporarily to take additional measures
    against the dissemination of Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al. (the pine wood nematode) as regards areas in Portugal, other than those
    in which it is known not to occur (notified under document C(2012) 1844)'
  type: main
- language: fr
  script: Latn
  content: '2012/175/UE: Décision d''exécution de la Commission du 23 mars 2012
    modifiant la décision 2006/133/CE exigeant des États membres qu''ils prennent
    provisoirement des mesures supplémentaires contre la propagation de Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al . (nématode du pin) à partir des
    zones du Portugal autres que celles où son absence est attestée [notifiée sous
    le numéro C(2012) 1844]'
  type: main
- language: de
  script: Latn
  content: '2012/175/EU: Durchführungsbeschluss der Kommission vom 23. März 2012
    zur Änderung der Entscheidung 2006/133/EG zur Verpflichtung der Mitgliedstaaten,
    vorübergehend zusätzliche Maßnahmen gegen die Verbreitung von Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. (dem Kiefernfadenwurm) gegenüber
    anderen Gebieten Portugals zu treffen als denjenigen, in denen dieser Schadorganismus
    bekanntermaßen nicht vorkommt (Bekanntgegeben unter Aktenzeichen C(2012) 1844)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/175/ЕС: Решение за изпълнение на Комисията
    от 23 март 2012 година за изменение на Решение
    2006/133/ЕО относно изискване към държавите-членки
    временно да вземат допълнителни мерки срещу
    разпространението на Bursaphelenchus xylophilus (Steiner et
    Buhrer) Nickle et al. (нематод по боровата дървесина)
    по отношение на области в Португалия, различни
    от тези, в които е известно, че заболяването
    не се среща (нотифицирано под номер C(2012) 1844)'
  type: main
- language: cs
  script: Latn
  content: '2012/175/EU: Prováděcí rozhodnutí Komise ze dne 23. března 2012 ,
    kterým se mění rozhodnutí 2006/133/ES, kterým se po členských státech
    žádá dočasné přijetí doplňujících opatření proti šíření háďátka
    Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . z oblastí Portugalska,
    mimo oblastí, v nichž byla potvrzena jeho nepřítomnost (oznámeno pod číslem
    C(2012) 1844)'
  type: main
- language: da
  script: Latn
  content: '2012/175/EU: Kommissionens gennemførelsesafgørelse af 23. marts 2012
    om ændring af beslutning 2006/133/EF om et krav til medlemsstaterne om midlertidigt
    at træffe supplerende foranstaltninger mod spredning af Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (fyrretræsnematoden) for så vidt angår andre
    områder i Portugal end dem, hvor den vides ikke at forekomme (meddelt under nummer
    C(2012) 1844)'
  type: main
- language: el
  script: Grek
  content: '2012/175/ΕΕ: Εκτελεστική απόφαση της Επιτροπής,
    της 23ης Μαρτίου 2012 , για την τροποποίηση της
    απόφασης 2006/133/ΕΚ που απαιτεί από τα κράτη μέλη
    να λάβουν, προσωρινά, συμπληρωματικά μέτρα
    κατά της εξάπλωσης του Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. [νηματώδης σκώληκας των κωνοφόρων
    (ΝΣΚ)] όσον αφορά ορισμένες περιοχές στην Πορτογαλία,
    εκτός εκείνων στις οποίες διαπιστώθηκε ότι
    δεν έχει εμφανιστεί [κοινοποιηθείσα υπό τον
    αριθμό C(2012) 1844]'
  type: main
- language: et
  script: Latn
  content: '2012/175/EL: Komisjoni rakendusotsus, 23. märts 2012 , millega muudetakse
    otsust 2006/133/EÜ, millega kohustatakse liikmesriike võtma ajutiselt haigusetekitaja
    Bursaphelenchus xylophilu s (Steiner et Buhrer) Nickle et al. (männi nematood)
    leviku takistamiseks lisameetmeid Portugali muude alade suhtes kui need, kus kõnealust
    haigusetekitajat teadaolevalt ei esine (teatavaks tehtud numbri C(2012) 1844 all)'
  type: main
- language: fi
  script: Latn
  content: '2012/175/EU: Komission täytäntöönpanopäätös, annettu 23 päivänä
    maaliskuuta 2012 , jäsenvaltioille esitetystä vaatimuksesta toteuttaa väliaikaisia
    lisätoimenpiteitä Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al.
    -puuntuhoojan (mäntyankeroisen) leviämisen estämiseksi muilla kuin sellaisilla
    Portugalin alueilla, joista tiedetään, ettei sitä esiinny niillä, tehdyn päätöksen
    2006/133/EY muuttamisesta (tiedoksiannettu numerolla C(2012) 1844)'
  type: main
- language: hu
  script: Latn
  content: '2012/175/EU: A Bizottság végrehajtási határozata ( 2012. március
    23. ) a Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle et al . (a fenyőfa
    fonalférge) elterjedése elleni, Portugáliának az attól ismerten mentes területein
    kívüli más területeire vonatkozó ideiglenes kiegészítő intézkedéseknek
    a tagállamok számára történő előírásáról szóló 2006/133/EK határozat
    módosításáról (az értesítés a C(2012) 1844. számú dokumentummal történt)'
  type: main
- language: it
  script: Latn
  content: '2012/175/UE: Decisione di esecuzione della Commissione, del 23 marzo 2012
    , che modifica la decisione 2006/133/CE che prescrive agli Stati membri di adottare,
    a titolo provvisorio, misure supplementari contro la propagazione di Bursaphelenchus
    xylophilus (Steiner e Buhrer) Nickle et al . (nematode del pino) per quanto riguarda
    le regioni del Portogallo diverse da quelle notoriamente indenni da questo organismo
    [notificata con il numero C(2012) 1844]'
  type: main
- language: lv
  script: Latn
  content: '2012/175/ES: Komisijas Īstenošanas lēmums ( 2012. gada 23. marts ),
    ar kuru groza Lēmumu 2006/133/EK, ar ko dalībvalstīm pieprasa veikt īslaicīgus
    papildu pasākumus pret Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al . (priedes koksnes nematode) izplatību tajās Portugāles teritorijās,
    kurās iespējama tās izplatība (izziņots ar dokumenta numuru C(2012) 1844)'
  type: main
- language: lt
  script: Latn
  content: '2012/175/ES: 2012 m. kovo 23 d. Komisijos įgyvendinimo sprendimas, kuriuo
    iš dalies keičiamas Sprendimas 2006/133/EB, kuriuo reikalaujama, kad valstybės
    narės laikinai imtųsi papildomų priemonių dėl Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (pušinio stiebinio nematodo) plitimo Portugalijos
    rajonuose, išskyrus tuos, kuriuose jis nepasitaikė (pranešta dokumentu Nr.
    C(2012) 1844)'
  type: main
- language: mt
  script: Latn
  content: '2012/175/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tat- 23
    ta’ Marzu 2012 li temenda d-Deċizjoni 2006/133/KE li teħtieġ li l-Istati
    Membri temporanjament jieħdu miżuri kontra t-tixrid tal- Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (in-nematodu tal-pini) f’dak li jirrigwardja
    żoni fil-Portugall, apparti minn dawk li fihom huwa magħruf li ma jeżistix
    (notifikata bid-dokument numru C(2012) 1844)'
  type: main
- language: nl
  script: Latn
  content: '2012/175/EU: Uitvoeringsbesluit van de Commissie van 23 maart 2012 tot
    wijziging van Beschikking 2006/133/EG tot tijdelijke verplichting van de lidstaten
    om ten aanzien van andere gebieden in Portugal dan die waarvan bekend is dat Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al. (het dennenaaltje) er niet voorkomt,
    aanvullende maatregelen te nemen teneinde de verspreiding ervan tegen te gaan
    (Kennisgeving geschied onder nummer C(2012) 1844)'
  type: main
- language: pl
  script: Latn
  content: '2012/175/UE: Decyzja wykonawcza Komisji z dnia 23 marca 2012 r. zmieniająca
    decyzję 2006/133/WE zobowiązującą państwa członkowskie do tymczasowego podjęcia
    dodatkowych środków przeciwko rozprzestrzenianiu się Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al . (węgorek sosnowiec) w odniesieniu do obszarów
    w Portugalii innych niż te, na których organizm ten nie występuje (notyfikowana
    jako dokument nr C(2012) 1844)'
  type: main
- language: pt
  script: Latn
  content: '2012/175/UE: Decisão de Execução da Comissão, de 23 de março de 2012
    , que altera a Decisão 2006/133/CE que requer que os Estados-Membros adotem temporariamente
    medidas suplementares contra a propagação de Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (nemátodo do pinheiro) no que diz respeito a zonas de
    Portugal, com exceção daquelas em que a sua ausência é conhecida [notificada
    com o número C(2012) 1844]'
  type: main
- language: ro
  script: Latn
  content: '2012/175/UE: Decizia de punere în aplicare a Comisiei din 23 martie 2012
    de modificare a Deciziei 2006/133/CE privind obligația statelor membre de a lua
    măsuri suplimentare provizorii împotriva răspândirii Bursaphelenchus xylophilus
    (Steiner et Buhrer) Nickle et al. (nematodul lemnului de pin) începând cu zonele
    Portugaliei, altele decât cele unde este atestată absența sa [notificată cu
    numărul C(2012) 1844]'
  type: main
- language: sk
  script: Latn
  content: '2012/175/EÚ: Vykonávacie rozhodnutie Komisie z 23. marca 2012 , ktorým
    sa mení a dopĺňa rozhodnutie 2006/133/ES, v ktorom sa od členských štátov
    vyžaduje dočasné prijatie ďalších opatrení proti šíreniu Bursaphelenchus
    xylophilus (Steiner et Buhrer) Nickle et al . (háďatko borovicové) v súvislosti
    s oblasťami v Portugalsku okrem oblastí, v ktorých jeho výskyt nie je známy
    [oznámené pod číslom C(2012) 1844]'
  type: main
- language: sl
  script: Latn
  content: '2012/175/EU: Izvedbeni sklep Komisije z dne 23. marca 2012 o spremembi
    Odločbe 2006/133/ES o zahtevi, da države članice začasno sprejmejo dodatne
    ukrepe proti širjenju borove ogorčice Bursaphelenchus xylophilus (Steiner in
    Buhrer) Nickle et al. na območjih Portugalske, razen območij, kjer je znano,
    da se ne pojavlja (notificirano pod dokumentarno številko C(2012) 1844)'
  type: main
- language: es
  script: Latn
  content: '2012/175/UE: Decisión de Ejecución de la Comisión, de 23 de marzo de
    2012 , que modifica la Decisión 2006/133/CE de la Comisión, por la que se exige
    a los Estados miembros que adopten, con carácter temporal, medidas complementarias
    contra la propagación de Bursaphelenchus xylophilus (Steiner et Buhrer) Nickle
    et al. (el nematodo de la madera del pino), en lo que respecta a zonas de Portugal
    distintas de aquellas en las que se haya comprobado su ausencia [notificada con
    el número C(2012) 1844]'
  type: main
- language: sv
  script: Latn
  content: '2012/175/EU: Kommissionens genomförandebeslut av den 23 mars 2012 om
    ändring av beslut 2006/133/EG om att ålägga medlemsstaterna att tillfälligt
    vidta ytterligare åtgärder mot spridningen av Bursaphelenchus xylophilus (Steiner
    et Buhrer) Nickle et al. (tallvedsnematoden) när det gäller andra områden i
    Portugal än sådana där det är känt att den inte förekommer [delgivet med
    nr C(2012) 1844]'
