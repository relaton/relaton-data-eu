  content: Council Regulation (EC) No 1169/95 of 22 May 1995 amending Regulation (EC)
    No 2271/94 imposing a definitive countervailing duty on imports of ball bearings
    with a greatest external diameter not exceeding 30 mm, originating in Thailand
    but exported to the Community from another country
  type: main
- language: fr
  script: Latn
