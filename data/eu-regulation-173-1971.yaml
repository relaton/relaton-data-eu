    d' orientation servant comme élément de calcul du prix de retrait pour certains
    produits de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 173/71 des Rates vom 26. Januar 1971 zur Festlegung
