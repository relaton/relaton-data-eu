    orientamento da adottare come elemento di calcolo del prezzo di ritiro per alcuni
    prodotti della pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 173/71 van de Raad van 26 januari 1971 houdende vaststelling
