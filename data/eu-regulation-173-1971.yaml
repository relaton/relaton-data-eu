  content: Regulation (EEC) No 173/71 of the Council of 26 January 1971 laying down
    general rules for determining the percentage of the guide price to be used to
    calculate the withdrawal price for certain fishery products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 173/71 du Conseil, du 26 janvier 1971, établissant
