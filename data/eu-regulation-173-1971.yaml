    der lægges til grund ved beregningen af tilbagetagelsesprisen for visse fiskerivarer
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 173/71 del Consiglio, del 26 gennaio 1971, che stabilisce
