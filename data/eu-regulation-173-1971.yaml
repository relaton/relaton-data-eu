    für bestimmte Fischereierzeugnisse zugrunde zu legenden Hundertsatzes des Orientierungspreises
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 173/71 af 26. januar 1971 om fastsættelse
