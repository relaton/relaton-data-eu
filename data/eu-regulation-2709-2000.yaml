title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2709/2000 of 11 December 2000 suspending
    the preferential customs duties and re-establishing the Common Customs Tariff
    duty on imports of multiflorous (spray) carnations originating in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2709/2000 de la Commission du 11 décembre 2000 suspendant
    le droit de douane préférentiel et réinstaurant le droit du tarif douanier
    commun à l'importation d'oeillets multiflores (spray) originaires d'Israël
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2709/2000 der Kommission vom 11. Dezember 2000 zur
    Aussetzung des bei der Einfuhr von mehrblütigen (Spray) Nelken mit Ursprung in
    Israel zu erhebenden Präferenzzolls und Wiedereinführung des Zolls des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2709/2000 af 11. december 2000 om suspension
    af præferencetolden og genindførelse af tolden ifølge den fælles toldtarif
    ved indførsel af mangeblomstrede nelliker (spray) med oprindelse i Israel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2709/2000 της Επιτροπής,
    της 11ης Δεκεμβρίου 2000, για αναστολή του προτιμησιακού
    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή πολυανθών γαρίφαλων
    (spray) καταγωγής Ισραήλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2709/2000, annettu 11 päivänä joulukuuta 2000,
    Israelista peräisin olevien monikukkaisten neilikoiden (spray) tuonnin etuustullin
    suspendoimisesta ja yhteisen tullitariffin tullin uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2709/2000 della Commissione, dell'11 dicembre 2000,
    che sospende il dazio doganale preferenziale e ripristina il dazio della tariffa
    doganale comune all'importazione di garofani a fiore multiplo (spray) originari
    di Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2709/2000 van de Commissie van 11 december 2000 tot
    schorsing van het preferentiële douanerecht en tot wederinvoering van het recht
    van het gemeenschappelijk douanetarief bij invoer van veelbloemige anjers (tros)
    van oorsprong uit Israël
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2709/2000 da Comissão, de 11 de Dezembro de 2000,
    que suspende o direito aduaneiro preferencial e restabelece o direito da pauta
    aduaneira comum na importação de cravos multifloros (spray) originários de
    Israel
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2709/2000 de la Comisión, de 11 de diciembre de 2000,
