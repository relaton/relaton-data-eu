    που επιτρέπει σε ορισμένα κράτη μέλη να προβλέπουν
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ, όσον αφορά τα φυτά των ειδών Chamaecyparis
    Spach, Juniperus L. και Pinus L., αντίστοιχα, καταγωγής
    Ιαπωνίας'
  type: main
- language: fi
  script: Latn
  content: '94/816/EY: Komission päätös, tehty 14 päivänä joulukuuta 1994, jäsenvaltioiden
