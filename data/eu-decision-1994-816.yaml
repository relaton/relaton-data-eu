title:
- language: en
  script: Latn
  content: '94/816/EC: Commission Decision of 14 December 1994 amending Decision 93/452/EEC
    authorizing the Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC, in respect of plants of Chamaecyparis Spach, Juniperus
    L. and Pinus L., respectively, originating in Japan'
  type: main
- language: fr
  script: Latn
  content: '94/816/CE: Décision de la Commission du 14 décembre 1994 modifiant la
    décision 93/452/CEE autorisant les États membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour les végétaux
    de chamaecyparis Spach, de Juniperus L. et de Pinus L., originaires du Japon'
  type: main
- language: de
  script: Latn
  content: '94/816/EG: Entscheidung der Kommission vom 14. Dezember 1994 zur Änderung
    der Entscheidung 93/452/EWG zur einstweiligen Ermächtigung bestimmter Mitgliedstaaten,
    für Pflanzen von Chamaecyparis Spach, Juniperus L. bzw. Pinus L. mit Ursprung
    in Japan Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates
    vorzusehen'
  type: main
- language: da
  script: Latn
  content: '94/816/EF: Kommissionens beslutning af 14. december 1994 om ændring af
    beslutning 93/452/EØF om bemyndigelse af medlemsstaterne til at undtage planter
