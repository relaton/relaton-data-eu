  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 28. oktoober 1999, millega muudetakse nõukogu direktiivi
    92/118/EMÜ II lisa, milles sätestatakse selliste toodete ühendusesisest kaubandust
    ja ühendusse importimist reguleerivad loomatervishoiu ja terviseohutuse nõuded,
    mille suhtes ei kohaldata direktiivi 89/662/EMÜ ja patogeenide puhul direktiivi
    90/425/EMÜ A lisa I peatükis osutatud ühenduse erieeskirjades sätestatud nõudeid
    (teatavaks tehtud numbri K(1999) 3493 all)
  type: main
- language: fi
  script: Latn
  content: '1999/724/EY: Komission päätös, tehty 28 päivänä lokakuuta 1999,
    eläinten terveyttä ja kansanterveyttä koskevista vaatimuksista sellaisten tuotteiden
    yhteisön sisäisessä kaupassa ja yhteisöön tuonnissa, joita eivät koske direktiivin
    89/662/ETY ja, taudinaiheuttajien osalta, direktiivin 90/425/ETY liitteessä A
    olevassa 1 luvussa mainittujen erityisten yhteisön säädösten kyseiset vaatimukset,
    annetun neuvoston direktiivin 92/118/ETY liitteen II muuttamisesta (tiedoksiannettu
    numerolla K(1999) 3493)'
  type: main
- language: hr
  script: Latn
  content: '1999/724/EZ: Odluka Komisije od 28. listopada 1999. o izmjeni Priloga
    II. Direktivi Vijeća 92/118/EEZ kojom se propisuju zahtjevi zdravlja životinja
    i javnog zdravlja kojima se uređuje trgovina i uvoz u Zajednicu proizvoda koji
    ne podliježu navedenim zahtjevima propisanim posebnim pravilima Zajednice iz
    Priloga A poglavlja I. Direktive 89/662/EEZ i, s obzirom na patogene tvari, iz
    Direktive 90/425/EEZ (priopćena pod brojem dokumenta C(1999) 3493)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1999. október 28.) a 89/662/EGK irányelv, illetve
    a kórokozók tekintetében a 90/425/EGK irányelv A. mellékletének I. pontjában
    felsorolt külön közösségi szabályokban megállapított állat-egészségügyi
    és közegészségügyi követelmények hatálya alá nem tartozó termékek Közösségen
    belüli kereskedelmére és a Közösségbe történő behozatalára irányadó
    állat-egészségügyi és közegészségügyi követelmények megállapításáról
    szóló 92/118/EGK tanácsi irányelv II. mellékletének módosításáról (az
    értesítés a C(1999) 3493. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '1999/724/CE: Decisione della Commissione, del 28 ottobre 1999, che modifica
    l''allegato II della direttiva 92/118/CEE del Consiglio, che stabilisce le condizioni
    sanitarie e di polizia sanitaria per gli scambi e le importazioni nella Comunità
    di prodotti non soggetti, per quanto riguarda tali condizioni, alle normative
    comunitarie specifiche di cui all''allegato A, capitolo I, della direttiva 89/662/CEE
    e, per quanto riguarda i patogeni, alla direttiva 90/425/CEE [notificata con il
    numero C(1999) 3493]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1999. gada 28. oktobris), ar ko groza II pielikumu Padomes
    Direktīvai 92/118/EEK, ar kuru nosaka dzīvnieku veselības un sabiedrības veselības
    aizsardzības prasības, kas reglamentē to produktu tirdzniecību un ievedumus
    Kopienā, kuri nav pakļauti prasībām, kas paredzētas īpašos Kopienas noteikumos,
    kuri minēti Direktīvas 89/662/EEK A pielikuma I daļā un, attiecībā uz patogēniem,
    Direktīvā 90/425/EEK (izziņots ar dokumenta numuru C(1999) 3493)
  type: main
- language: lt
  script: Latn
  content: 1999 m. spalio 28 d. Komisijos sprendimas, iš dalies keičiantis Tarybos
    direktyvos 92/118/EEB, nustatančios gyvūnų sveikatos ir visuomenės sveikatos
    reikalavimus, reglamentuojančius produktų, kuriems netaikomi reikalavimai, nustatyti
    specialiose Bendrijos taisyklėse, nurodytose Direktyvos 89/662/EEB A priedo I
    dalyje ir, ligų sukėlėjų atžvilgiu, Direktyvoje 90/425/EEB, prekybą Bendrijoje
    ir jų importą į Bendriją, II priedą (pranešta dokumentu Nr. C(1999) 3493)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-28 ta' Ottubru 1999 li temenda l-Anness
    II tad-Direttiva tal-Kunsill 92/118/KEE li tistabbilixxi l-ħtiġiet tas-saħħa
    ta' l-annimali u tas-saħħa pubblika li jirregolaw il-kummerċ u l-importazzjoni
    fil-Komunitá ta' prodotti li m'humiex soġġetti għall-ħtiġiet preskritti
    fir-regoli speċifiċi Komunitarji li hemm referenza dwarhom fl-Anness A (I) tad-Direttiva
    89/662/KEE u, rigward il-patoġeni, mad-Direttiva 90/425/KEE. (notifikat permezz
    tad-dokument numru C (1999) 3493)
  type: main
- language: nl
  script: Latn
  content: '1999/724/EG: Beschikking van de Commissie van 28 oktober 1999 tot wijziging
    van bijlage II bij Richtlijn 92/118/EEG van de Raad tot vaststelling van de veterinairrechtelijke
    en de gezondheidsvoorschriften voor het handelsverkeer en de invoer in de Gemeenschap
    van producten waarvoor ten aanzien van deze voorschriften geen specifieke communautaire
    regelgeving geldt als bedoeld in bijlage A, hoofdstuk I, van Richtlijn 89/662/EEG,
    en, wat ziekteverwekkers betreft, van Richtlijn 90/425/EEG (kennisgeving geschied
    onder nummer C(1999) 3493)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 28 października 1999 r. zmieniająca załącznik
    II do dyrektywy Rady 92/118/EWG ustanawiającej warunki zdrowotne zwierząt i
    zdrowia publicznego regulujące handel i przywóz do Wspólnoty produktów nieobjętych
    wyżej wymienionymi warunkami ustanowionymi w szczególnych zasadach wspólnotowych
    określonych w załączniku A pkt I do dyrektywy 89/662/EWG oraz, w odniesieniu
    do czynników chorobotwórczych, do dyrektywy 90/425/EWG (notyfikowana jako dokument
    nr C(1999) 3493)
  type: main
- language: pt
  script: Latn
  content: '1999/724/CE: Decisão da Comissão, de 28 de Outubro de 1999, que altera
    o anexo II da Directiva 92/118/CEE do Conselho que define as condições sanitárias
    e de polícia sanitária que regem o comércio e as importações na Comunidade
    de produtos não sujeitos, no que respeita às referidas condições, às regulamentações
    comunitárias específicas referidas no capítulo I do anexo a da Directiva 89/662/CEE
    e, no que respeita aos agentes patogénicos, da Directiva 90/425/CEE [notificada
    com o número C(1999) 3493]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 28 octombrie 1999 de modificare a anexei II la Directiva
    92/118/CEE a Consiliului din 17 decembrie 1992 de stabilire a condițiilor de
    sănătate publică și animală care reglementează comerțul și importurile
    în Comunitate de produse care nu intră sub incidența condițiilor menționate,
    stabilite de normele comunitare speciale prevăzute la anexa A capitolul I la
    Directiva 89/662/CEE și, în ceea ce privește agenții patogeni, la Directiva
    90/425/CEE [notificată cu numărul C (1999) 3493]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 28. októbra 1999, ktorým sa mení a dopĺňa príloha
    II smernice Rady 92/118/EHS stanovujúca požiadavky týkajúce sa zdravia zvierat
    a zdravia ľudí, ktorými sa riadi obchod v spoločenstve a dovozy do spoločenstva
    tých produktov, ktoré nie sú predmetom daných požiadaviek uvedených v osobitných
    pravidlách spoločenstva uvedených v prílohe A (I) smernice 89/662/EHS, a pokiaľ
    ide o patogény, smernice 90/425/EHS (oznámené pod číslom dokumentu C(1999)
    3493)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 28. oktobra 1999 o spremembi Priloge II k Direktivi
    Sveta 92/118/EGS o zahtevah glede zdravstvenega varstva živali in javno zdravstvenega
    varstva, ki urejajo trgovino in uvoz v Skupnost za proizvode, ki niso predmet
    navedenih zahtev, določenih v posebnih predpisih Skupnosti iz Priloge A (I) k
    Direktivi 89/662/EGS, in, glede povzročiteljev bolezni, k Direktivi 90/425/EGS
    (notificirano pod dokumentarno številko K(1999) 3493)
  type: main
- language: es
  script: Latn
  content: '1999/724/CE: Decisión de la Comisión, de 28 de octubre de 1999, que
    modifica el anexo II de la Directiva 92/118/CEE del Consejo por la que se establecen
    las condiciones de policía sanitaria y sanitarias aplicables a los intercambios
    y a las importaciones en la Comunidad de productos no sometidos, con respecto
    a estas condiciones, a las normativas comunitarias específicas a que se refiere
    el capítulo I del anexo A de la Directiva 89/662/CEE y, por lo que se refiere
    a los patógenos, de la Directiva 90/425/CEE [notificada con el número C(1999)
    3493]'
  type: main
- language: sv
  script: Latn
  content: '1999/724/EG: Kommissionens beslut av den 28 oktober 1999 om ändring av
    bilaga II till rådets direktiv 92/118/EEG om djurhälso- och hygienkrav för
    handel inom gemenskapen med produkter, som inte omfattas av sådana krav i de
    särskilda gemenskapsbestämmelser som avses i bilaga A.1 till direktiv 89/662/EEG
    och, i fråga om patogener, i direktiv 90/425/EEG, samt för import till gemenskapen
    av sådana produkter [delgivet med nr K(1999) 3493]'
