---
id: EUDecision1999724
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '1999/724/EC: Commission Decision of 28 October 1999 amending Annex II
    to Council Directive 92/118/EEC laying down animal health and public health requirements
    governing trade in and imports into the Community of products not subject to the
    said requirements laid down in specific Community rules referred to in Annex A
    (I) to Directive 89/662/EEC and, as regards pathogens, to Directive 90/425/EEC
    (notified under document number C(1999) 3493)'
  type: main
- language: fr
  script: Latn
  content: '1999/724/CE: Décision de la Commission, du 28 octobre 1999, modifiant
    l''annexe II de la directive 92/118/CEE du Conseil définissant les conditions
    de police sanitaire ainsi que les conditions sanitaires régissant les échanges
    et les importations dans la Communauté de produits non soumis, en ce qui concerne
    lesdites conditions, aux réglementations communautaires spécifiques visées
    à l''annexe A, chapitre 1er , de la directive 89/662/CEE et, en ce qui concerne
    les pathogènes, de la directive 90/425/CEE [notifiée sous le numéro C(1999)
    3493]'
  type: main
- language: de
  script: Latn
  content: '1999/724/EG: Entscheidung der Kommission vom 28. Oktober 1999 zur Änderung
    des Anhangs II der Richtlinie 92/118/EWG des Rates über die tierseuchenrechtlichen
    und gesundheitlichen Bedingungen für den Handel mit Erzeugnissen tierischen Ursprungs
    in der Gemeinschaft sowie für die Einfuhr in die Gemeinschaft, soweit sie diesbezüglich
    nicht den spezifischen Gemeinschaftsregelungen nach Anhang A Kapitel I der Richtlinie
    89/662/EWG und - in bezug auf Krankheitserreger - der Richtlinie 90/425/EWG unterliegen
    (Bekanntgegeben unter Aktenzeichen K(1999) 3493)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 28 октомври 1999 година
    за изменение на приложение II към Директива
    92/118/ЕИО на Съвета за определяне на ветеринарно-санитарните
    и здравните изисквания относно търговията
    и вноса в Общността на продукти, които не са
    подчинени, по отношение на посочените изисквания,
    на специалните правила на Общността, посочени
    в глава I от приложение А към Директива 89/662/ЕИО
    и, по отношение на патогените, на Директива
    90/425/ЕИО (нотифицирано под номер C(1999) 3493)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 28. října 1999, kterým se mění příloha
    II směrnice Rady 92/118/EHS o veterinárních a hygienických předpisech pro
    obchod s produkty živočišného původu ve Společenství a jejich dovoz do
    Společenství, pokud se na ně nevztahují zvláštní předpisy Společenství
    uvedené v kapitole I přílohy A směrnice 89/662/EHS, a pokud jde o patogenní
    původce, směrnice 90/425/EHS (oznámeno pod číslem K(1999) 3493)
  type: main
- language: da
  script: Latn
  content: '1999/724/EF: Kommissionens beslutning af 28. oktober 1999 om ændring
    af bilag II til Rådets direktiv 92/118/EØF om dyresundhedsmæssige og sundhedsmæssige
    betingelser for samhandel med og indførsel til Fællesskabet af produkter, der
    for så vidt angår disse betingelser ikke er underlagt specifikke fællesskabsbestemmelser,
    som omhandlet i bilag A, kapitel 1, i direktiv 89/662/EØF, og for så vidt angår
    patogener, i direktiv 90/425/EØF (meddelt under nummer K(1999) 3493)'
  type: main
- language: el
  script: Grek
