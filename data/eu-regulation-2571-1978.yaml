    1978 to 31 January 1979 inclusive, on the importation into the Community of goods
    covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2571/78 de la Commission, du 19 octobre 1978, déterminant
