    saistībā ar dažiem kombinētās nomenklatūras (KN) kodu grozījumiem
  type: main
- language: lt
  script: Latn
  content: 1992 m. gruodžio 18 d. Komisijos reglamentas (EEB) Nr. 3661/92, iš dalies
