title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3661/92 of 18 December 1992 amending measures
    in respect of the application of the common organization of the market in beef
    and veal as a result of the amendment of certain CN codes in the combined nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3661/92 de la Commission, du 18 décembre 1992, modifiant
    certains actes relatifs à l'application de l'organisation commune des marchés
    dans le secteur de la viande bovine en raison de la modification de certains codes
    de la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3661/92 der Kommission vom 18. Dezember 1992 zur Änderung
    bestimmter Rechtsakte mit Durchführungsvorschriften zur gemeinsamen Marktorganisation
    für Rindfleisch aufgrund der Änderung bestimmter KN-Codes der Kombinierten Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕИО) № 3661/92 на Комисията от 18
    декември 1992 година относно изменение на мерките
    по отношение на прилагането на общата организация
    на пазара на говеждо и телешко месо в резултат
    на изменението на някои кодове в Комбинираната
    номенклатура
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EHS) č. 3661/92 ze dne 18. prosince 1992, kterým
    se mění některé právní předpisy týkající se používání společné
    organizace trhu s hovězím a telecím masem v důsledku změny některých kódů
    kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3661/92 af 18. december 1992 om ændring
    af visse retsakter om anvendelse af den fælles markedsordning for oksekød som
    følge af ændringen af visse koder i Den Kombinerede Nomenklatur
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3661/92 της Επιτροπής
    της 18ης Δεκεμβρίου 1992 που τροποποιεί ορισμένες
    πράξεις σχετικά με την εφαρμογή της κοινής
    οργανώσεως αγοράς στον τομέα του βοείου κρέατος
    λόγω αλλαγής ορισμένων κωδικών της συνδυασμένης
    ονοματολογίας
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 3661/92, 18. detsember 1992, millega muudetakse
    kaupade koondnomenklatuuri teatavate koodide muutmise tulemusel veise- ja vasikalihaturu
    ühise korralduse rakendamise suhtes kohaldatavaid meetmeid
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3661/92, annettu 18 päivänä joulukuuta 1992,
    naudanliha-alan yhteisen markkinajärjestelyn soveltamisesta annettujen tiettyjen
    säädösten muuttamisesta yhdistetyn nimikkeistön tiettyjen koodien muuttamiseksi
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EEZ) br. 3661/92 od 18. prosinca 1992. o izmjeni mjera
    u pogledu primjene zajedničke organizacije tržišta goveđeg i telećeg mesa
    kao rezultat izmjene određenih oznaka KN u kombiniranoj nomenklaturi
  type: main
- language: hu
  script: Latn
  content: A Bizottság 3661/92/EGK rendelete (1992. december 18.) a marha- és borjúhúspiac
    közös szervezésének alkalmazására vonatkozó intézkedéseknek a Kombinált
    Nómenklatúra egyes KN-kódjai módosításának eredményeként történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3661/92 della Commissione, del 18 dicembre 1992, che
    modifica taluni atti relativi all'applicazione dell'organizzazione comune dei
    mercati nel settore delle carni bovine in seguito alla modifica di alcuni codici
    della nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 3661/92 (1992. gada 18. decembris), ar ko groza
