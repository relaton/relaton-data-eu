    trhu s hovädzím a teľacím mäsom v dôsledku zmien a doplnení niektorých
    kódov CN kombinovanej nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 3661/92 z dne 18. decembra 1992 ki spreminja
    ukrepe v zvezi z uporabo skupne ureditve trga za goveje in telečje meso kot posledica
    sprememb določenih KN oznak v kombinirani nomenklaturi
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3661/92 de la Comisión, de 18 de diciembre de 1992,
    por el que se modifican algunos actos relativos a la aplicación de la organización
    común de mercados en el sector de la carne de vacuno, debido a la modificación
    de ciertos códigos de la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3661/92 av den 18 december 1992 om ändring
