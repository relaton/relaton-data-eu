    fis-suq taċ-ċanga u tal-vitella bħala riżultat ta’ l-emendi ta’ ċerti
    kodiċi ta’ NM fin-nomenklatura magħquda
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3661/92 van de Commissie van 18 december 1992 houdende
    wijziging van bepaalde besluiten met betrekking tot de toepassing van de gemeenschappelijke
    ordening der markten in de sector rundvlees ten gevolge van de wijziging van bepaalde
    codes van de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 3661/92 z dnia 18 grudnia 1992 r. zmieniające
    środki stosowania wspólnej organizacji rynku wołowiny i cielęciny w wyniku
    zmian niektórych kodów CN w Nomenklaturze Scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3661/92 da Comissão, de 18 de Dezembro de 1992,
    que altera determinados actos relativos à aplicação da organização comum
    de mercado no sector da carne de bovino na sequência da alteração de determinados
    códigos da Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CEE) nr. 3661/92 al Comisiei din 18 decembrie 1992 de modificare
    a unor acte privind instituirea organizării comune a pieței în sectorul cărnii
    de vită și mânzat ca urmare a modificării unor coduri din Nomenclatura Combinată
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 3661/92 z 18. decembra 1992, ktorým sa menia
