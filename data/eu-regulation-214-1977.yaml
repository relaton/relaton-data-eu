title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 214/77 of 24 January 1977 determining the
    amounts of the variable components, compensatory amounts and additional duties
    applicable from 1 February to 30 April 1977 inclusive, on the importation of goods
    covered by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 214/77 de la Commission, du 24 janvier 1977, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant la période du 1er février au 30
    avril 1977 inclus, à l'importation des marchandises relevant du règlement (CEE)
    n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 214/77 der Kommission vom 24. Januar 1977 zur Festsetzung
    der Höhe der vom 1. Februar bis einschließlich 30. April 1977 unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anzuwendenden beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 214/77 af 24. januar 1977 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    indførsel af varer henhørende under forordning (EØF) nr. 1059/69 for perioden
    1. februar til og med 30. april 1977
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 214/77 della Commissione, del 24 gennaio 1977, che
    determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il periodo dal 1 febbraio
    al 30 aprile 1977 incluso, delle merci cui si applica il regolamento (CEE) n.
    1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 214/77 van de Commissie van 24 januari 1977 tot vaststelling
    van het beloop der van 1 februari tot en met 30 april 1977 bij invoer van onder
    Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele elementen,
    compenserende bedragen en aanvullende invoerrechten
