title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1561/2003 of 4 September 2003 derogating
    from Regulation (EC) No 708/98 on the taking over of paddy rice by the intervention
    agencies and fixing the corrective amounts and the price increases and reductions
    to be applied as regards the time limit for delivery into intervention for the
    2002/2003 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1561/2003 de la Commission du 4 septembre 2003 dérogeant
