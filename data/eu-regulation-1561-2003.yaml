    Zu- und Abschläge hinsichtlich der Frist für die Lieferung an die Intervention
    im Wirtschaftsjahr 2002/03
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1561/2003 af 4. september 2003 om fravigelse
