    da parte degli organismi d'intervento e alla fissazione degli importi correttori,
    delle maggiorazioni e delle detrazioni da applicare, per il periodo di consegna
    all'intervento della campagna 2002/03
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1561/2003 van de Commissie van 4 september 2003 tot
