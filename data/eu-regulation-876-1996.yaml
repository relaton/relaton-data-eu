    di importazione e all' apertura di contingenti tariffari nel settore del latte
    e dei prodotti lattiero-caseari e che modifica il regolamento (CE) n. 1474/95
    recante apertura e modalità di gestione nel settore delle uova e per le ovoalbumine
    dei contingenti tariffari derivanti dagli accordi conclusi nel quadro dei negoziati
    commerciali multilaterali dell' Uruguay Round
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 876/96 van de Commissie van 14 mei 1996 tot wijziging
    van Verordening (EG) nr. 1600/95 houdende uitvoeringsbepalingen van de invoerregeling
    en houdende opening van tariefcontingenten in de sector melk en zuivelprodukten
    en van Verordening (EG) nr. 1474/95 houdende opening en vaststelling van de wijze
    van beheer van de tariefcontingenten voor produkten van de sector eieren en voor
    ovoalbumine die voortvloeien uit de in het kader van de multilaterale handelsbesprekingen
    van de Uruguay-Ronde gesloten overeenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 876/96 da Comissão, de 14 de Maio de 1996, que altera
    o Regulamento (CE) nº 1600/95, que estabelece regras de execução do regime
    de importação e que abre contingentes pautais no sector do leite e dos produtos
    lácteos e o Regulamento (CE) nº 1474/95, relativo à abertura e modo de gestão
    de contingentes pautais, no sector dos ovos e para as ovalbuminas, resultantes
    dos acordos concluídos no âmbito das negociações comerciais multilaterais
    do «Uruguay Round»
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 876/96 de la Comisión, de 14 de mayo de 1996, que
    modifica el Reglamento (CE) nº 1600/95 por el que se establecen disposiciones
    de aplicación del régimen de importación y la apertura de contingentes arancelarios
    en el sector de la leche y de los productos lácteos, así como el Reglamento
    (CE) nº 1474/95 por el que se abre, con arreglo a los acuerdos celebrados en
    el marco de las negociaciones comerciales multilaterales de la Ronda Uruguay,
    un contingente arancelario en el sector de los huevos y la ovoalbúmina y se establece
    su método de gestión
  type: main
- language: sv
  script: Latn
  content: 'KOMMISSIONENS FÖRORDNING (EG) nr 876/96 av den 14 maj 1996 om ändring
    av förordning (EG) nr 1600/95 om tillämpningsföreskrifter för importsystemet
    och öppnande av tullkvoter inom sektorn för mjölk och mjölkprodukter och om
    ändring av förordning (EG) nr 1474/95 om öppnande och förvaltning av de tullkvoter
    för ägg och äggalbumin som följer av de avtal som slutits inom ramen för
    de multilaterala handelsförhandlingarna i Uruguayrundan #'
