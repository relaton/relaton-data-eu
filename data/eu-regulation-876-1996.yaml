title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 876/96 of 14 May 1996 amending Regulation
    (EC) No 1600/95 laying down detailed rules for the application of the import arrangements
    and opening tariff quotas for milk and milk products and amending Regulation (EC)
    No 1474/95 opening and providing for the administration of the tariff quotas in
    the egg sector and for egg albumin resulting from the Agreements concluded during
    the Uruguay Round of multilateral trade negotiations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 876/96 de la Commission, du 14 mai 1996, modifiant
    le règlement (CE) nº 1600/95 portant modalités d' application du régime d'
    importation et portant ouverture de contingents tarifaires dans le secteur du
    lait et des produits laitiers et modifiant le règlement (CE) nº 1474/95 portant
    ouverture et mode de gestion dans le secteur des oeufs et pour les ovalbunines
    des contingents tarifaires découlant des accords conclus dans le cadre des négociations
    commerciales multilatérales du cycle d' Uruguay
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 876/96 der Kommission vom 14. Mai 1996 zur Änderung
