    für Milch und Milcherzeugnisse und zur Eröffnung der betreffenden Zollkontingente
    und zur Änderung der Verordnung (EG) Nr. 1474/95 zur Eröffnung und Verwaltung
    der Zollkontingente im Eiersektor und für Albumine im Anschluß an die im Rahmen
    der multilateralen Handelsverhandlungen der Uruguay-Runde geschlossenen Übereinkünfte
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 876/96 af 14. maj 1996 om ændring af
