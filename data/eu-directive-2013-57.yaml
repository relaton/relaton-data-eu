title:
- language: en
  script: Latn
  content: Commission Implementing Directive 2013/57/EU of 20 November 2013 amending
    Directives 2003/90/EC and 2003/91/EC setting out implementing measures for the
    purposes of Article 7 of Council Directive 2002/53/EC and Article 7 of Council
    Directive 2002/55/EC respectively, as regards the characteristics to be covered
    as a minimum by the examination and the minimum conditions for examining certain
    varieties of agricultural plant species and vegetable species
  type: main
- language: fr
  script: Latn
  content: Directive d’exécution 2013/57/UE de la Commission du 20 novembre 2013
    modifiant les directives 2003/90/CE et 2003/91/CE établissant des modalités
    d’application des articles 7 des directives du Conseil 2002/53/CE et 2002/55/CE
    en ce qui concerne les caractères minimaux à prendre en compte et les conditions
    minimales à remplir lors de l’examen de certaines variétés d’espèces de
    plantes agricoles et de légumes
  type: main
- language: de
  script: Latn
  content: Durchführungsrichtlinie 2013/57/EU der Kommission vom 20. November 2013
    zur Änderung der Richtlinien 2003/90/EG und 2003/91/EG mit Durchführungsbestimmungen
    zu Artikel 7 der Richtlinie 2002/53/EG des Rates und Artikel 7 der Richtlinie
    2002/55/EG des Rates hinsichtlich der Merkmale, auf welche sich die Prüfungen
    mindestens zu erstrecken haben, und der Mindestanforderungen für die Prüfung
    bestimmter Sorten landwirtschaftlicher Pflanzenarten und Gemüsearten
  type: main
- language: bg
  script: Cyrl
