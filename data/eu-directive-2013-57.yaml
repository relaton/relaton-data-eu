    Tarybos direktyvų 2002/53/EB 7 straipsnio ir Tarybos direktyvos 2002/55/EB 7
    straipsnio įgyvendinimo priemonės, susijusios su žemės ūkio augalų ir daržovių
    rūšių tam tikrų veislių būtinaisiais tikrintinais požymiais ir būtinosiomis
    tikrinimo sąlygomis
  type: main
- language: mt
  script: Latn
  content: Direttiva ta’ Implimentazzjoni tal-Kummissjoni 2013/57/UE tal- 20 ta’
