    miżuri ta’ implimentazzjoni għall-iskopijiet tal-Artikolu 7 tad-Direttivi
    tal-Kunsill 2002/53/KE u 2002/55/KE rispettivament, fir-rigward tal-karatteristiċi
    li għandhom jiġu koperti bħala minimu mill-eżami u l-kundizzjonijiet minimi
