    7. cikkéhez végrehajtási intézkedéseket megállapító 2003/90/EK és 2003/91/EK
    irányelvnek az egyes mezőgazdasági növényfajok és zöldségfajok fajtáinak
    vizsgálata keretében minimálisan vizsgálandó jellemzők és a vizsgálat
    minimumfeltételei tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva di esecuzione 2013/57/UE della Commissione, del 20 novembre 2013
    , che modifica le direttive della Commissione 2003/90/CE e 2003/91/CE, che stabiliscono
    modalità di applicazione dell’articolo 7 della direttiva del Consiglio 2002/53/CE
    e dell’articolo 7 della direttiva del Consiglio 2002/55/CE per quanto riguarda
    i caratteri minimi sui quali deve vertere l’esame e le condizioni minime per
    l’esame di alcune varietà delle specie di piante agricole e di ortaggi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas direktīva 2013/57/ES ( 2013. gada 20. novembris
    ), ar ko groza Direktīvu 2003/90/EK un Direktīvu 2003/91/EK, nosakot attiecīgi
    Padomes Direktīvas 2002/53/EK 7. panta un Padomes Direktīvas 2002/55/EK 7. panta
    īstenošanas pasākumus attiecībā uz pārbaudāmo pazīmju minimumu un konkrētu
    lauksaimniecības augu sugu šķirņu un dārzeņu sugu šķirņu pārbaudes nosacījumu
    minimumu
  type: main
- language: lt
  script: Latn
  content: 2013 m. lapkričio 20 d. Komisijos įgyvendinimo direktyva 2013/57/ES,
