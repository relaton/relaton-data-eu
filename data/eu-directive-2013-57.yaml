    članka 7. Direktive Vijeća 2002/53/EZ odnosno članka 7. Direktive 2002/55/EZ
    u pogledu minimalnih obilježja koja se moraju obuhvatiti pregledom i minimalnih
    uvjeta za pregled nekih sorti poljoprivrednih biljnih vrsta i vrsta povrća
  type: main
- language: hu
  script: Latn
