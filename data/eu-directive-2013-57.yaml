    ta’ ħxejjex
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsrichtlijn 2013/57/EU van de Commissie van 20 november 2013 tot
    wijziging van de Richtlijnen 2003/90/EG en 2003/91/EG houdende bepalingen ter
    uitvoering van artikel 7 van Richtlijn 2002/53/EG van de Raad, respectievelijk
    artikel 7 van Richtlijn 2002/55/EG van de Raad, met betrekking tot de kenmerken
    waartoe het onderzoek van bepaalde rassen van landbouwgewassen en groentegewassen
    zich ten minste moet uitstrekken, en de minimumeisen voor dat onderzoek
  type: main
- language: pl
  script: Latn
  content: Dyrektywa wykonawcza Komisji 2013/57/UE z dnia 20 listopada 2013 r. zmieniająca
    dyrektywy 2003/90/WE i 2003/91/WE określające środki wykonawcze do celów art.
    7 dyrektywy Rady 2002/53/WE i art. 7 dyrektywy Rady 2002/55/WE w odniesieniu do
    cech minimalnych objętych badaniem oraz minimalnych warunków badania niektórych
    odmian gatunków roślin uprawnych i gatunków warzyw
  type: main
- language: pt
  script: Latn
  content: Diretiva de Execução 2013/57/UE da Comissão, de 20 de novembro de 2013
    , que altera as Diretivas 2003/90/CE e 2003/91/CE que estabelecem regras de execução
    do artigo 7. °da Diretiva 2002/53/CE do Conselho e do artigo 7. °da Diretiva
    2002/55/CE do Conselho, respetivamente, no que diz respeito aos carateres que,
    no mínimo, devem ser apreciados pelo exame e às condições mínimas para o
    exame de determinadas variedades de espécies de plantas agrícolas e de espécies
    hortícolas
  type: main
- language: ro
  script: Latn
  content: Directiva de punere în aplicare 2013/57/UE a Comisiei din 20 noiembrie
    2013 de modificare a Directivelor 2003/90/CE și 2003/91/CE de stabilire a măsurilor
    de punere în aplicare a articolului 7 din Directiva 2002/53/CE a Consiliului
    și, respectiv, a articolului 7 din Directiva 2002/55/CE a Consiliului în ceea
    ce privește caracteristicile minime de analizat și condițiile minime de verificare
    a anumitor soiuri de specii de plante agricole și specii de legume
  type: main
- language: sk
  script: Latn
  content: Vykonávacia smernica Komisie 2013/57/EÚ z 20. novembra 2013 , ktorou
    sa menia smernice 2003/90/ES a 2003/91/ES, ktorými sa ustanovujú vykonávacie
    opatrenia na účely článku 7 smernice Rady 2002/53/ES a článku 7 smernice
    Rady 2002/55/ES týkajúcich sa znakov, ktoré musia byť splnené ako minimum
    pri skúškach, a minimálnych podmienok na skúšanie určitých odrôd poľnohospodárskych
    rastlinných druhov a druhov zelenín
  type: main
- language: sl
  script: Latn
  content: Izvedbena direktiva Komisije 2013/57/EU z dne 20. novembra 2013 o spremembi
    direktiv 2003/90/ES in 2003/91/ES o določitvi izvedbenih ukrepov za člen 7 Direktive
    Sveta 2002/53/ES in člen 7 Direktive Sveta 2002/55/ES glede lastnosti, ki morajo
    biti zajete kot minimum pri preskušanju, in minimalnih pogojev za preskušanje
    nekaterih sort kmetijskih rastlin in zelenjadnic
  type: main
- language: es
  script: Latn
  content: Directiva de Ejecución 2013/57/UE de la Comisión, de 20 de noviembre
    de 2013 , que modifica las Directivas 2003/90/CE y 2003/91/CE, por las que se
    establecen disposiciones de aplicación a los fines del artículo 7 de la Directiva
    2002/53/CE del Consejo y del artículo 7 de la Directiva 2002/55/CE del Consejo,
    respectivamente, en lo que concierne a los caracteres que los exámenes deben
    analizar como mínimo y las condiciones mínimas para examinar determinadas variedades
    de especies de plantas agrícolas y hortícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandedirektiv 2013/57/EU av den 20 november 2013
