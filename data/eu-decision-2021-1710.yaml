  script: Latn
  content: Tarybos sprendimas (ES) 2021/1710 2021 m. rugsėjo 21 d. dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Europos Sąjungos bei Europos
    atominės energijos bendrijos ir Jungtinės Didžiosios Britanijos ir Šiaurės
    Airijos Karalystės prekybos ir bendradarbiavimo susitarimu įsteigtame Specialiajame
    socialinės apsaugos koordinavimo komitete dėl sprendimo iš dalies pakeisti
    Protokolo dėl socialinės apsaugos koordinavimo priedus priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2021/1710 tal-21 ta' Settembru 2021 li tistabbilixxi
