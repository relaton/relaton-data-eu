  script: Latn
  content: Odluka Vijeća (EU) 2021/1710 od 21. rujna 2021. o utvrđivanju stajališta
    koje treba zauzeti u ime Europske unije u Posebnom odboru za koordinaciju socijalne
    sigurnosti koji je osnovan Sporazumom o trgovini i suradnji između Europske unije
    i Europske zajednice za atomsku energiju, s jedne strane, i Ujedinjene Kraljevine
    Velike Britanije i Sjeverne Irske, s druge strane, u pogledu donošenja odluke
    o izmjeni prilogâ Protokolu o koordinaciji socijalne sigurnosti
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/1710 határozata (2021. szeptember 21.) az egyrészről
    az Európai Unió és az Európai Atomenergia-közösség, és másrészről Nagy-Britannia
    és Észak-Írország Egyesült Királysága közötti kereskedelmi és együttműködési
    megállapodással létrehozott, a szociális biztonsági rendszerek koordinációjával
    foglalkozó szakbizottságban a szociális biztonsági rendszerek koordinálásáról
    szóló jegyzőkönyv mellékleteinek módosításáról szóló határozat elfogadása
    tekintetében az Európai Unió által képviselendő álláspont meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/1710 del Consiglio del 21 settembre 2021 che stabilisce
    la posizione da adottare a nome dell'Unione europea in sede di comitato specializzato
    per il coordinamento della sicurezza sociale istituito dall'accordo sugli scambi
    commerciali e la cooperazione tra l'Unione europea e la Comunità europea dell'energia
    atomica, da una parte, e il Regno Unito di Gran Bretagna e Irlanda del Nord, dall'altra,
    per quanto riguarda l'adozione di una decisione che modifica gli allegati del
    protocollo sul coordinamento della sicurezza sociale
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2021/1710 (2021. gada 21. septembris), ar ko nosaka
    nostāju, kas Eiropas Savienības vārdā jāieņem Specializētajā komitejā
    sociālā nodrošinājuma koordinācijas jomā, kura izveidota ar Tirdzniecības
    un sadarbības nolīgumu starp Eiropas Savienību un Eiropas Atomenerģijas kopienu,
    no vienas puses, un Lielbritānijas un Ziemeļīrijas Apvienoto Karalisti, no
    otras puses, attiecībā uz lēmuma pieņemšanu grozīt Protokola par sociālā
    nodrošinājuma koordināciju pielikumus
  type: main
