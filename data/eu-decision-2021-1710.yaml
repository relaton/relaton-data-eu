title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1710 of 21 September 2021 establishing the position
    to be adopted on behalf of the European Union in the Specialised Committee on
    Social Security Coordination established by the Trade and Cooperation Agreement
    between the European Union and the European Atomic Energy Community, of the one
    part, and the United Kingdom of Great Britain and Northern Ireland, of the other
    part, as regards the adoption of a decision to amend the Annexes to the Protocol
    on Social Security Coordination
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1710 du Conseil du 21 septembre 2021 établissant la
    position à prendre au nom de l’Union européenne au sein du comité spécialisé
    chargé de la coordination de la sécurité sociale institué par l’accord de
    commerce et de coopération entre l’Union européenne et la Communauté européenne
    de l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et
    d’Irlande du Nord, d’autre part, en ce qui concerne l’adoption d’une décision
    visant à modifier les annexes du protocole en matière de coordination de la
    sécurité sociale
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1710 des Rates vom 21. September 2021 zur Festlegung
    des im Namen der Europäischen Union in dem durch das Abkommen über Handel und
    Zusammenarbeit zwischen der Europäischen Union und der Europäischen Atomgemeinschaft
    einerseits und dem Vereinigten Königreich Großbritannien und Nordirland andererseits
    eingesetzten Sonderausschuss für die Koordinierung der sozialen Sicherheit im
    Hinblick auf die Annahme eines Beschlusses zur Änderung der Anhänge des Protokolls
    über die Koordinierung der sozialen Sicherheit zu vertretenden Standpunkts
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/1710 на Съвета от 21 септември
    2021 година за определяне на позицията, която
    трябва да се заеме от името на Европейския
    съюз в рамките на Специализирания комитет
    по координация в областта на социалната сигурност,
    създаден със Споразумението за търговия и
    сътрудничество между Европейския съюз и Европейската
    общност за атомна енергия, от една страна, и
    Обединеното кралство Великобритания и Северна
    Ирландия, от друга страна, относно приемането
    на решение за изменение на приложенията към
    Протокола относно координацията в областта
    на социалната сигурност
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/1710 ze dne 21. září 2021 o postoji, který
    má být jménem Evropské unie zaujat ve specializovaném výboru pro koordinaci
    sociálního zabezpečení zřízeném Dohodou o obchodu a spolupráci mezi Evropskou
    unií a Evropským společenstvím pro atomovou energii na jedné straně a Spojeným
    královstvím Velké Británie a Severního Irska na straně druhé, pokud jde
    o přijetí rozhodnutí o změně příloh Protokolu o koordinaci sociálního
    zabezpečení
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/1710 af 21. september 2021 om fastlæggelse
    af den holdning, der skal indtages på Den Europæiske Unions vegne i Specialudvalget
    vedrørende Koordinering af Sociale Sikringsordninger, som er nedsat ved handels-
    og samarbejdsaftalen mellem Den Europæiske Union og Det Europæiske Atomenergifællesskab
    på den ene side og Det Forenede Kongerige Storbritannien og Nordirland på den
    anden side, for så vidt angår vedtagelsen af en afgørelse om ændring af bilagene
    til protokollen om koordinering af sociale sikringsordninger
  type: main
- language: el
  script: Grek
