    biex jiġu emendati l-Annessi tal-Protokoll dwar il-Koordinazzjoni tas-Sigurtà
    Soċjali
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/1710 van de Raad van 21 september 2021 tot vaststelling
    van het standpunt dat namens de Unie moet worden ingenomen in het Gespecialiseerd
    Comité voor coördinatie van de sociale zekerheid dat is opgericht bij de handels-
    en samenwerkingsovereenkomst tussen de Europese Unie en de Europese Gemeenschap
    voor Atoomenergie, enerzijds, en het Verenigd Koninkrijk van Groot-Brittannië
    en Noord-Ierland, anderzijds, met betrekking tot de vaststelling van een besluit
    tot wijziging van de bijlagen bij het Protocol betreffende de coördinatie van
    de sociale zekerheid
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/1710 z dnia 21 września 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Specjalnego Komitetu
    ds. Koordynacji Zabezpieczenia Społecznego ustanowionego na mocy Umowy o handlu
    i współpracy między Unią Europejską i Europejską Wspólnotą Energii Atomowej,
    z jednej strony, a Zjednoczonym Królestwem Wielkiej Brytanii i Irlandii Północnej,
    z drugiej strony, w odniesieniu do przyjęcia decyzji dotyczącej zmiany załączników
    do Protokołu w sprawie koordynacji systemów zabezpieczenia społecznego
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/1710 do Conselho de 21 de setembro de 2021 que estabelece
    a posição a tomar em nome da União Europeia no Comité Especializado da Coordenação
    da Segurança Social criado pelo Acordo de Comércio e Cooperação entre a União
    Europeia e a Comunidade Europeia da Energia Atómica, por um lado, e o Reino Unido
    da Grã-Bretanha e da Irlanda do Norte, por outro, no que respeita à adoção
    de uma decisão de alteração dos anexos do Protocolo relativo à coordenação
    da segurança social
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/1710 a Consiliului din 21 septembrie 2021 de stabilire
    a poziției care urmează să fie adoptată, în numele Uniunii Europene, în
    cadrul Comitetului specializat privind coordonarea sistemelor de securitate socială
    instituit prin Acordul comercial și de cooperare dintre Uniunea Europeană și
    Comunitatea Europeană a Energiei Atomice, pe de o parte, și Regatul Unit al
    Marii Britanii și Irlandei de Nord, pe de altă parte, referitoare la adoptarea
    unei decizii de modificare a anexelor la Protocolul privind coordonarea sistemelor
    de securitate socială
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/1710 z 21. septembra 2021, ktorým sa stanovuje
    pozícia, ktorá sa má v mene Európskej únie prijať v Osobitnom výbore pre
    koordináciu sociálneho zabezpečenia zriadenom Dohodou o obchode a spolupráci
    medzi Európskou úniou a Európskym spoločenstvom pre atómovú energiu na jednej
    strane a Spojeným kráľovstvom Veľkej Británie a Severného Írska na strane
    druhej, pokiaľ ide o prijatie rozhodnutia o zmene príloh k Protokolu o koordinácii
    v oblasti sociálneho zabezpečenia
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/1710 z dne 21. septembra 2021 o določitvi stališča,
    ki se v imenu Evropske unije zastopa v Specializiranem odboru za koordinacijo
    sistemov socialne varnosti, ustanovljenem s Sporazumom o trgovini in sodelovanju
    med Evropsko unijo in Evropsko skupnostjo za atomsko energijo na eni strani ter
    Združenim kraljestvom Velika Britanija in Severna Irska na drugi strani, v zvezi
    s sprejetjem sklepa o spremembi prilog k Protokolu o koordinaciji sistemov socialne
    varnosti
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/1710 del Consejo de 21 de septiembre de 2021 por la
    que se establece la posición que debe adoptarse en nombre de la Unión Europea
    en el Comité Especializado en Coordinación de la Seguridad Social establecido
    por el Acuerdo de Comercio y Cooperación entre la Unión Europea y la Comunidad
    Europea de la Energía Atómica, por una parte, y el Reino Unido de Gran Bretaña
    e Irlanda del Norte, por otra, en lo que respecta a la adopción de una decisión
    que modifica los anexos del Protocolo relativo a la coordinación de la seguridad
    social
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/1710 av den 21 september 2021 om fastställande
    av den ståndpunkt som ska intas på Europeiska unionens vägnar i den specialiserade
    kommitté för samordning av de sociala trygghetssystemen som inrättats genom
    avtalet om handel och samarbete mellan Europeiska unionen och Europeiska atomenergigemenskapen,
    å ena sidan, och Förenade konungariket Storbritannien och Nordirland, å andra
    sidan, vad gäller antagande av ett beslut om att ändra bilagorna till protokollet
    om samordning av de sociala trygghetssystemen
