    Speċjalizzat dwar il-Koordinazzjoni tas-Sigurtà Soċjali stabbilit bil-Ftehim
    dwar il-Kummerċ u l-Kooperazzjoni bejn l-Unjoni Ewropea u l-Komunità Ewropea
    tal-Enerġija Atomika, minn naħa waħda, u r-Renju Unit tal-Gran Brittanja u
