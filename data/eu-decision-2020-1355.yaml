title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2020/1355 of 25 September 2020 granting
    temporary support under Regulation (EU) 2020/672 to Romania to mitigate unemployment
    risks in the emergency following the COVID-19 outbreak
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1355 du Conseil du 25 septembre 2020
    octroyant à la Roumanie un soutien temporaire au titre du règlement (UE) 2020/672
    pour l’atténuation des risques de chômage en situation d’urgence engendrée
    par la propagation de la COVID-19
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1355 des Rates vom 25. September 2020
    zur Gewährung einer vorübergehenden Unterstützung gemäß der Verordnung (EU)
