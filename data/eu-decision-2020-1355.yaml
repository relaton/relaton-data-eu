    2020/672 para atenuar os riscos de desemprego numa situação de emergência na
    sequência do surto de COVID-19
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/1355 a Consiliului din 25 septembrie
