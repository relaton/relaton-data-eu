    rizik nezaměstnanosti v mimořádné situaci v důsledku rozšíření onemocnění
    COVID-19
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2020/1355 af 25. september 2020
    om midlertidig støtte til Rumænien i henhold til forordning (EU) 2020/672 til
