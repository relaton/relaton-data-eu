title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3331/86 of 30 October 1986 amending Regulation
    (EEC) No 1185/86 fixing, for the period 1 March to 31 December 1986, the maximum
    quantity of certain products of the oils and fats sector to be released for consumption
    and imported into Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3331/86 de la Commission du 30 octobre 1986 modifiant
    le règlement (CEE) n° 1185/86 fixant, pour la période allant du 1er mars au
    31 décembre 1986, la quantité maximale de certains produits du secteur des matières
    grasses à mettre à la consommation et à importer en Espagne et au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3331/86 der Kommission vom 30. Oktober 1986 zur Änderung
    der Verordnung (EWG) Nr. 1185/86 zur Festsetzung der Höchstmengen bestimmter
    Erzeugnisse des Fettsektors, die in Spanien und Portugal zum freien Verkehr abzufertigen
    und in diese Länder einzuführen sind, für den Zeitraum vom 1. März bis 31.
    Dezember 1986
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3331/86 af 30. oktober 1986 om ændring
    af forordning (EØF) nr. 1185/86 om fastsættelse for perioden 1. marts til 31.
    december 1986 af den største mængde af visse produkter inden for fedtstofsektoren,
    der kan overgå til frit forbrug i og importeres til Spanien og Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3331/86 της Επιτροπής
    της 30ής Οκτωβρίου 1986 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1185/86 που καθορίζει, για
    την περίοδο από την 1η Μαρτίου έως τις 31 Δεκεμβρίου
    1986, τη μέγιστη ποσότητα ορισμένων προϊόντων
    του τομέα των λιπαρών ουσιών που θα διατεθούν
    στην κατανάλωση και θα εισαχθούν στην Ισπανία
    και την Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3331/86 della Commissione del 30 ottobre 1986 che
    modifica il regolamento (CEE) n. 1185/86 che fissa, per il periodo 1° marzo -
    31 dicembre 1986, la quantità massima di taluni prodotti del settore dei grassi
    da immettere in consumo e da importare in Spagna e Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3331/86 van de Commissie van 30 oktober 1986 tot
    wijziging van Verordening (EEG) nr. 1185/86 tot vaststelling, voor het tijdvak
    van 1 maart tot en met 31 december 1986, van de maximumhoeveelheid van bepaalde
    in Spanje en Portugal in consumptie te brengen of in te voeren produkten van de
    sector oliën en vetten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3331/86 da Comissão de 30 de Outubro de 1986 que
    altera o Regulamento (CEE) n.° 1185/86 que fixa, para um período compreendido
    entre 1 de Março e 31 de Dezembro de 1986, a quantidade máxima de determinados
    produtos do sector das matérias gordas a introduzir no consumo e a importar em
    Espanha e em Portugal
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3331/86 de la Comisión de 30 de octubre de 1986 por
