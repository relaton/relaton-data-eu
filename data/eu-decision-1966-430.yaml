- language: en
  script: Latn
  content: DECISION NO. 60 OF 26 MAY 1966 CONCERNING INTERPRETATION OF THE CONCEPT
    OF " MEMBER OF THE FAMILY " FOR THE PURPOSE OF BENEFITS IN KIND OF MATERNITY ILLNESS
    INSURANCE IN THE EVENT OF TEMPORARY PRESENCE ON THE TERRITORY OF A MEMBER STATE
    OTHER THAN THE STATE RESPONSIBLE UNDER PARAGRAPHS 1, 3 AND 7 OF ARTICLE 19 OF
    REGULATION NO. 3
  type: main
- language: fr
  script: Latn
  content: DECISION NO. 60 DU 26 MAI 1966, CONCERNANT L' INTERPRETATION DE LA NOTION
    DE "MEMBRE DE FAMILLE" POUR LE SERVICE DES PRESTATIONS EN NATURE DE L' ASSURANCE-MALADIE-MATERNITE
    EN CAS DE SEJOUR TEMPORAIRE SUR LE TERRITOIRE D' UN ETAT MEMBRE AUTRE QUE L' ETAT
    COMPETENT CONFORMEMENT AUX PARAGRAPHES 1, 3 ET 7 DE L' ARTICLE 19 DU REGLEMENT
    NO. 3.
  type: main
- language: de
  script: Latn
  content: '66/430/EWG: BESCHLUSS NR. 60 VOM 26. MAI 1966 ZUR AUSLEGUNG DES BEGRIFFS
    " FAMILIENANGEHOERIGER " FUER DIE GEWAEHRUNG VON SACHLEISTUNGEN AUS DER KRANKENVERSICHERUNG
    GEMAESS ARTIKEL 19 ABSAETZE ( 1 ), ( 3 ) UND ( 7 ) DER VERORDNUNG NR. 3 WAEHREND
    EINES VORUEBERGEHENDEN AUFENTHALTS IM HOHEITSGEBIET EINES ANDEREN ALS DES ZUSTAENDIGEN
    MITGLIEDSTAATS'
  type: main
- language: it
  script: Latn
  content: '66/384/CEE: Decisione n. 58, del 20 gennaio 1966, 66/430/CEE: Decisione
    n. 60, del 26 maggio 1966, relativa concernente l'' interpretazione dell'' articolo
    42, paragrafo all'' interpretazione del concetto di " familiare " per la 4, del
    regolamento n. 3 relativo ai supplementi o alle corresponsione delle prestazioni
    in natura dell'' maggiorazioni che alcune legislazioni accordano ai assicurazione
    malattia-maternità in caso di soggiorno beneficiari di pensione o di rendita
    per i figli a carico temporaneo sul territorio di uno Stato membro diverso dallo
    Stato competente in conformità dei paragrafi 1,3 e 7 dell'' articolo 19 del regolamento
    n. 3'
  type: main
- language: nl
  script: Latn
  content: '66/384/EEG: BESLUIT NO. 58 VAN 20 JANUARI 1966 BETREFFENDE 66/430/EEG:
    BESLUIT NO. 60 VAN 26 MEI 1966 BETREFFENDE DE DE INTERPRETATIE VAN ARTIKEL 42,
    LID 4, VAN VERORDENING NO. INTERPRETATIE VAN HET BEGRIP " GEZINSLID " MET HET
    OOG OP 3 INZAKE DOOR BEPAALDE WETTELIJKE REGELINGEN AAN DE HET VERLENEN VAN VERSTREKKINGEN
    VAN DE ZIEKTE- EN RECHTHEBBENDEN OP PENSIOEN OF RENTE TOEGEKENDE VERHOGINGEN MOEDERSCHAPSVERZEKERING
    IN GEVAL VAN EEN TIJDELIJK VERBLIJF OF TOESLAGEN VOOR KINDEREN IN WIER ONDERHOUD
    ZIJ MOETEN OP HET GRONDGEBIED VAN EEN ANDERE LID-STAAT DAN DE BEVOEGDE VOORZIEN
    STAAT, OVEREENKOMSTIG DE LEDEN 1, 3 EN 7 VAN ARTIKEL 19 VAN VERORDENING NO. 3'
