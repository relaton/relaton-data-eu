    εφαρμογής, στον τομέα των οπωροκηπευτικών
    και στον τομέα των μεταποιημένων προϊόντων
    με βάση τα οπωροκηπευτικά, του καθεστώτος που
    προβλέπεται στις συμφωνίες που αφορούν τις
