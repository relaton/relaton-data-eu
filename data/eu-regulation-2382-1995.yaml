    frugter og grøntsager af den ordning, der er fastsat i frihandelsaftalerne mellem
    Fællesskabet på den ene side og Estland, Letland og Litauen på den anden side
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2382/95 της Επιτροπής
