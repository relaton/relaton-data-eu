title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2382/95 of 11 October 1995 laying down detailed
    rules for the application to fruit and vegetables and to products processed from
    fruit and vegetables of the arrangements provided for in the Agreements on free
    trade between the Community, of the one part, and Estonia, Latvia and Lithuania,
    of the other part
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2382/95 de la Commission, du 11 octobre 1995, établissant
    les modalités d'application dans le secteur des fruits et légumes et dans le
    secteur des produits transformés à base de fruits et légumes du régime prévu
    dans les accords sur la libéralisation des échanges entre la Communauté, d'une
    part, et l'Estonie, la Lettonie et la Lituanie, d'autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2382/95 der Kommission vom 11. Oktober 1995 mit den
