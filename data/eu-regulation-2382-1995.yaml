    sopimuksissa määrätyn järjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä hedelmä- ja vihannesalalla sekä hedelmä- ja vihannesjalostealalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2382/95 della Commissione, dell'11 ottobre 1995, che
    stabilisce le modalità d'applicazione, nel settore degli ortofrutticoli e in
    quello dei prodotti trasformati a base di ortofrutticoli, del regime previsto
    dagli accordi sul libero scambio tra la Comunità europea, da una parte, e l'Estonia,
    la Lettonia e la Lituania, dell'altra
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2382/95 van de Commissie van 11 oktober 1995 houdende
