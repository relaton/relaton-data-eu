title:
- language: en
  script: Latn
  content: '92/153/EEC: Council Decision of 3 March 1992 extending the period of application
    of Decision 82/530/EEC authorizing the United Kingdom to permit the Isle of Man
    authorities to apply a system of special import licences to sheepmeat and beef
    and veal'
  type: main
- language: fr
  script: Latn
  content: '92/153/CEE: Décision du Conseil du 3 mars 1992 prorogeant la décision
    82/530/CEE autorisant le Royaume- Uni à permettre aux autorités de l''île de
    Man d''appliquer un système de certificats spéciaux d''importation pour la viande
    ovine et la viande bovine'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DES RATES vom 3. März 1992 zur Verlängerung der Entscheidung
    82/530/EWG zur Ermächtigung des Vereinigten Königreichs, der Regierung der Insel
    Man zu gestatten, bei Schaf- und Rindfleisch eine besondere Einfuhrlizenzregelung
    anzuwenden (92/153/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 3. marts 1992 om forlængelse af anvendelsesperioden
    for beslutning 82/530/EØF om bemyndigelse til Det Forenede Kongerige til at tillade
    myndighederne på øen Man at anvende en ordning med særlige importlicenser for
    fårekød, oksekød og kalvekød (92/153/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/153/ΕΟΚ : Απόφαση του Συμβουλίου της 3ης
    Μαρτίου 1992 για την παράταση της απόφασης 82/530/ΕΟΚ
    περί εξουσιοδοτήσεως του Ηνωμένου Βασιλείου
    να επιτρέψει στις αρχές της Νήσου Μαν την εφαρμογή
    καθεστώτος ειδικών αδειών εισαγωγής προβείου
    και αιγείου κρέατος'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO del 3 marzo 1992 recante proroga della decisione
    82/530/CEE che autorizza il Regno Unito a consentire alle autorità dell'' isola
    di Man di applicare un regime di titoli d'' importazione speciali per le carni
    ovine e bovine (92/153/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE RAAD van 3 maart 1992 tot verlenging van de geldigheidsduur
    van Beschikking 82/530/EEG waarbij het Verenigd Koninkrijk wordt gemachtigd de
    autoriteiten van het eiland Man toe te staan een stelsel van bijzondere invoervergunningen
    toe te passen voor schapevlees en rundvlees (92/153/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DO CONSELHO de 3 de Março de 1992 que prolonga a Decisão 82/530/CEE
    que autoriza o Reino Unido a permitir às autoridades da ilha de Man a aplicação
    de um sistema de certificados especiais de importação para a carne de ovino
    e para a carne de bovino (92/153/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DEL CONSEJO de 3 de marzo de 1992 que prorroga la Decisión
    82/530/CEE por la que se autoriza al Reino Unido a permitir que las autoridades
    de la isla de Man apliquen un sistema de certificados especiales de importación
    para la carne de ovino y la carne de vacuno (92/153/CEE) #'
