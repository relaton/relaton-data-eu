title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 septembre 1969, portant octroi du concours
    du FES au bénéfice de la République française pour des dépenses relatives
    à des opérations de rééducation professionnelle effectuées par le Ministère
    des anciens combattants et victimes de guerre
  type: main
- language: de
  script: Latn
  content: '69/381/EWG: Entscheidung der Kommission vom 30. September 1969 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Frankreich zu Aufwendungen
    für vom "Ministère des Anciens Combattants et Victimes de Guerre" durchgeführte
    Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '69/381/CEE: Decisione della Commissione, del 30 settembre 1969, che concede
    un contributo del FSE alla Repubblica francese per spese concernenti operazioni
    di riqualificazione effettuate dal «Ministère des anciens combattants et victimes
    de guerre»'
  type: main
- language: nl
  script: Latn
  content: '69/381/EEG: Beschikking van de Commissie van 30 september 1969 houdende
    toekenning van een bijdrage uit het E.S.F. ten gunste van de Franse Republiek
    voor door het "Ministère des Anciens Combattants et Victimes de Guerre" gemaakte
    herscholingskosten'
