  script: Latn
  content: Commission Delegated Regulation (EU) 2022/1666 of 13 June 2022 correcting
    the Danish language version of Annex II to Delegated Regulation (EU) 2017/653
    supplementing Regulation (EU) No 1286/2014 of the European Parliament and of the
    Council on key information documents for packaged retail and insurance-based investment
    products (PRIIPs) by laying down regulatory technical standards with regard to
    the presentation, content, review and revision of key information documents and
    the conditions for fulfilling the requirement to provide such documents
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/1666 de la Commission du 13 juin 2022 rectifiant
    la version en langue danoise de l’annexe II du règlement délégué (UE) 2017/653
    complétant le règlement (UE) no 1286/2014 du Parlement européen et du Conseil
    sur les documents d’informations clés relatifs aux produits d’investissement
    packagés de détail et fondés sur l’assurance (PRIIP) par des normes techniques
    de réglementation concernant la présentation, le contenu, le réexamen et la
    révision des documents d’informations clés et les conditions à remplir pour
    répondre à l’obligation de fournir ces documents
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/1666 der Kommission vom 13. Juni 2022 zur
