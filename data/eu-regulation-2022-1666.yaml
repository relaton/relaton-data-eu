  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/1666 de la Comisión de 13 de junio de 2022
    por el que se corrige la versión danesa del anexo II del Reglamento Delegado
    (UE) 2017/653, por el que se completa el Reglamento (UE) n.o 1286/2014 del Parlamento
    Europeo y del Consejo, sobre los documentos de datos fundamentales relativos a
