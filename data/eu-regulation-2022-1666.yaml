  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/1666 av den 13 juni 2022
    om rättelse av den danska språkversionen av bilaga II till delegerad förordning
    (EU) 2017/653 om komplettering av Europaparlamentets och rådets förordning (EU)
