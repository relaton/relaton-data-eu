title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1333/91 of 22 May 1991 re-establishing the
    levying of customs duties on products of category 118 (order No 42.1180), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1333/91 DE LA COMMISSION du 22 mai 1991 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    118 (numéro d'' ordre 42.1180) originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1333/91 DER KOMMISSION vom 22. Mai 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 118 (laufende
    Nummer 42.1180) mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3832/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1333/91 af 22. maj 1991 om genindførelse
    af opkrævning af told vor varer under varekategori nr. 118 (løbenummer 42.1180),
    som har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1333/91 της Επιτροπής
    της 22ας Μαΐου 1991 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    118 ( αύξων αριθ. 42.1180 ) καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1333/91 DELLA COMMISSIONE del 22 maggio 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 118 (numero d'' ordine 42.1180) originari della Cina, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1333/91 VAN DE COMMISSIE van 22 mei 1991 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op de produkten
    van categorie 118 (volgnummer 42.1180), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 1333/91 DA COMISSAO, DE 22 DE MAIO DE 1991, QUE
    RESTABELECE A COBRANCA DOS DIREITOS ADUANEIROS APLICAVEIS AOS PRODUTOS DA CATEGORIA
    118 ( NUMERO DE ORDEM 42.1180 ), ORIGINARIOS DA CHINA, BENEFICIARIOS DAS PREFERENCIAS
