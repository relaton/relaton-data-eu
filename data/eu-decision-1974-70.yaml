title:
- language: en
  script: Latn
  content: Commission Decision of 23 November 1973 granting assistance from the European
    Social Fund, as provided for in Article 125 of the Treaty, to the Republic of
    Italy for expenditure on vocational retraining operations carried out by the Ministry
    of Labour and National Insurance and several other Italian bodies
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 novembre 1973, portant octroi du concours
    du Fonds social européen, prévu à l'article 125 du Traité, au bénéfice de
    la République italienne pour des dépenses relatives à des opérations de rééducation
    professionnelle effectuées par le Ministère du travail et de la prévoyance
    sociale et plusieurs organismes italiens
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. November 1973 über die Gewährung
    des in Artikel 125 des Vertrages vorgesehenen Zuschusses aus dem Europäischen
    Sozialfonds an die Italienische Republik zu Aufwendungen für vom "Ministero del
    Lavoro e della Previdenza sociale" und mehreren italienischen Körperschaften
    durchgeführte Maßnahmen der Berufsumschulung
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. november 1973 om ydelse af det i artikel
    125 i traktaten fastsatte tilskud fra Den europæiske Socialfond til Den italienske
    Republik i forbindelse med omkostninger vedrørende faglig omskoling, som er gennemført
    af »Ministero del Lavoro e della Previdenza sociale« og af flere italienske
    institutioner
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 novembre 1973, recante concessione
    del contributo del Fondo sociale europeo, previsto dall'articolo 125 del trattato,
    a favore della Repubblica italiana per spese concernenti operazioni di riqualificazione
    professionale effettuate dal ministro del lavoro e della previdenza sociale e
    da vari enti italiani
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 november 1973 houdende toekenning van
    een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel 125 van het
    Verdrag ten gunste van de Italiaanse Republiek voor door het ministerie van Arbeid
    en Sociale Voorzorg en verscheidene Italiaanse instellingen gemaakte herscholingskosten
  type: main
