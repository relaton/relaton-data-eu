title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2962/81 of 15 October 1981 fixing, in respect
    of certain maritime areas to the west of Scotland, the exact period, falling between
    1 October 1981 and 31 March 1982, when the use of trawls, Danish seines or similar
    nets as well as purse seines and ring nets, is prohibited
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2962/81 de la Commission, du 15 octobre 1981, fixant,
    dans certaines zones maritimes à l' ouest de l' Écosse, la période exacte s'
    échelonnant du 1er octobre 1981 au 31 mars 1982 pendant laquelle l' utilisation
    de chaluts, de seines danoises ou filets similaires aussi bien que celle de seines
    tournantes ou de filets tournants est interdite
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2962/81 der Kommission vom 15. Oktober 1981 über
    den genauen Zeitraum zwischen dem 1. Oktober 1981 und dem 31. März 1982 in dem
    in bestimmten Fischereigebieten westlich von Schottland die Verwendung von Schleppnetzen,
    Zugnetzen oder ähnlichen Netzen sowie Ringwaden und anderen Ringnetzen verboten
    ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2962/81 af 15. oktober 1981 om fastsættelse
    af den nøjagtige periode for visse havområder vest for Skotland mellem den 1.
    oktober 1981 og den 31. marts 1982, i hvilken trawl, snurrevod eller lignende
    net samt snurpenot og ringnet ikke må anvendes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2962/81 τής Επιτροπής
    τής 15ης Οκτωβρίου 1981 περί καθορισμού τής ακριβούς
    χρονικής περιόδου, μεταξύ τής 1ης Οκτωβρίου
    1981 καί τής 31ης Μαρτίου 1982, κατά τήν οποία απαγορεύεται
    η χρήση γρίπων, δανικών σχοινότρατων ή παρόμοιων
    δικτυών, καθώς καί η χρήση γρί — γρί καί θυλάκων
    σέ ορισμένες αλιευτικές περιοχές δυτικά τής
    Σκωτίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2962/81 della Commissione, del 15 ottobre 1981, che
    determina, in talune zone marittime situate all' ovest della Scozia, il periodo
    preciso, che si estende dal 1° ottobre 1981 al 31 marzo 1982, durante il quale
    è vietato l' impiego di reti a strascico, di ciancioli danesi o reti analoghe
    nonché di ciancioli o di reti da circuizione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2962/81 van de Commissie van 15 oktober 1981 houdende
    vaststelling, voor bepaalde zeegebieden ten westen van Schotland, van de juiste
    periode tussen 1 oktober 1981 en 31 maart 1982 gedurende welke het gebruik van
    trawlnetten, Deense zegennetten (snurrevod) en soortgelijke netten, alsmede van
    ringzegens en andere ringnetten, verboden is
  type: main
