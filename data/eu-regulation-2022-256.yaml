  script: Latn
  content: Commission Delegated Regulation (EU) 2022/256 of 22 February 2022 amending
    Regulation (EU) 2021/953 of the European Parliament and of the Council as regards
    the issuance of certificates of recovery based on rapid antigen tests
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/256 de la Commission du 22 février 2022
    modifiant le règlement (UE) 2021/953 du Parlement européen et du Conseil en
    ce qui concerne la délivrance de certificats de rétablissement basés sur des
    tests rapides de détection d’antigènes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/256 der Kommission vom 22. Februar 2022
    zur Änderung der Verordnung (EU) 2021/953 des Europäischen Parlaments und des
    Rates in Bezug auf die Ausstellung von Genesungszertifikaten auf der Grundlage
    von Antigen-Schnelltests
  type: main
- language: bg
  script: Cyrl
