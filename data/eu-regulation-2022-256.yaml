  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/256 da Comissão de 22 fevereiro 2022 que
    altera o Regulamento (UE) 2021/953 do Parlamento Europeu e do Conselho no que
    diz respeito à emissão de certificados de recuperação com base em testes rápidos
    de antigénio
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/256 al Comisiei din 22 februarie 2022 de
