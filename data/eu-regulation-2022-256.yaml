    pokud jde o vydávání certifikátů o zotavení na základě rychlých testů
    na antigen
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/256 af 22. februar 2022 om
    ændring af Europa-Parlamentets og Rådets forordning (EU) 2021/953 for så vidt
    angår udstedelse af restitutionscertifikater på grundlag af hurtige antigentest
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/256
