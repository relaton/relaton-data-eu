type: standard
title:
- language: en
  script: Latn
  content: '82/396/EEC: Commission Decision of 14 June 1982 authorizing Greece to
    apply intra-Community surveillance to imports of certain products originating
    in third countries which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/396/CEE: Décision de la Commission, du 14 juin 1982, autorisant la
    Grèce à procéder à une surveillance intracommunautaire des importations de
    certains produits originaires des pays tiers et mis en libre pratique dans la
    Communauté, susceptibles de faire l''objet de mesures de protection au titre
    de l''article 115 du traité (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/396/EWG: Entscheidung der Kommission vom 14. Juni 1982 zur Ermächtigung
    Griechenlands zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus Drittländern stammenden und in der Gemeinschaft im freien Verkehr befindlichen
    Waren, für die Schutzmaßnahmen gemäß Artikel 115 des Vertrages ergriffen werden
    können (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/396/EØF: Kommissionens beslutning af 14. juni 1982 om bemyndigelse
    af Grækenland til at foretage tilsyn inden for Fællesskabet med indførsel af
    visse produkter, der har oprindelse i tredjelande og er overgået til fri omsætning
    i Fællesskabet, og som kan gøres til genstand for beskyttelsesforanstaltninger
    i henhold til traktatens artikel 115 (Kun den graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/396/EOK: Απόφαση τής Επιτροπής τής 14ης Ιουνίου
    1982 περί χορηγήσεως αδείας στήν Ελλάδα νά προβεί
    σέ ενδοκοινοτική επιτήρηση τών εισαγωγών ορισμένων
    προϊόντων, καταγωγής τρίτης χώρας, τά οποία
    τίθενται σέ ελεύθερη κυκλοφορία στήν Κοινότητα
    καί τά οποία μπορούν νά αποτελέσουν αντικείμενο
    τών μέτρων προστασίας, δυνάμει τού άρθρου 115
    τής συνθήκης (Το κείμενο στην ελληνική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/396/CEE: Decisione della Commissione, del 14 giugno 1982, che autorizza
    la Grecia a procedere ad una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti originari dei paesi terzi e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattatoa (Il testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/396/EEG: Beschikking van de Commissie van 14 juni 1982 houdende machtiging
    van Griekenland tot toepassing van een intracommunautair toezicht ten aanzien
    van de invoer van bepaalde produkten van oorsprong uit derde landen die in de
    Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het EEG-Verdrag (Slechts
    de tekst in de Griekse taal is authentiek)'
  type: main
