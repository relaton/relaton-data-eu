title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2209/2004 of 21 December 2004 determining
    the extent to which applications lodged in December 2004 for import licences for
    certain egg sector products and poultrymeat pursuant to Regulations (EC) No 593/2004
    and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2209/2004 de la Commission du 21 décembre 2004 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en décembre 2004 pour certains produits du secteur des œufs et de la viande
    de volaille dans le cadre des règlements (CE) n° 593/2004 et (CE) n° 1251/96
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2209/2004 der Kommission vom 21. Dezember 2004 über
    die Festsetzung des Umfangs, in dem die im Dezember 2004 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Produkte des Sektors Eier und Geflügelfleisch
    entsprechend den Verordnungen (EG) Nr. 593/2004 und (EG) Nr. 1251/96 genehmigt
    werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2209/2004 ze dne 21. prosince 2004, kterým
    se stanoví rozsah, v němž mohou být přijímány žádosti o dovozní licence
    na některé výrobky z odvětví vajec a drůbežího masa podané v prosinci
    2004 na základě nařízení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2209/2004 af 21. december 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i december
    2004 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 593/2004 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2209/2004 της Επιτροπής,
    της 21ης Δεκεμβρίου 2004, για καθορισμό ορίων
    εντός των οποίων δύναται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Δεκεμβρίο
    του 2004 για πιστοποιητικά εισαγωγής για ορισμένα
    προϊόντα του τομέα των αυγών και του κρέατος
    πουλερικών στα πλαίσια των κανονισμών (ΕΚ)
    αριθ. 593/2004 και (ΕΚ) αριθ. 1251/96
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2209/2004, 21. detsember 2004, millega määratakse
    kindlaks, millises ulatuses võib heaks kiita määruste (EÜ) nr 593/2004 ja
    (EÜ) nr 1251/96 alusel detsembris 2004 esitatud teatavate muna- ja kodulinnulihasektorite
    toodete impordilitsentsi taotlusi
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2209/2004, annettu 21 päivänä joulukuuta 2004,
    määrättyyn järjestelmään liittyvien joulukuuta 2004 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontitodistushakemusten
    hyväksyttävyydestä asetuksen (EY) N:o 593/2004 ja asetuksen (EY) N:o 1251/96
    mukaisesti
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2209/2004/EK rendelete (2004. december 21.) az 593/2004/EK
    és az 1251/96/EK rendeletben foglalt keretek között, a tojás- és a baromfihús-ágazat
    egyes termékeire vonatkozó behozatali engedélyek iránt 2004 decemberében
    benyújtott kérelmek elfogadhatósága mértékének meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2209/2004 della Commissione, del 21 dicembre 2004,
    che stabilisce entro quali limiti possono essere accettate le domande di titoli
    d'importazione presentate nel mese di dicembre 2004 per taluni prodotti del settore
    delle uova e del pollame nel quadro dei regolamenti (CE) n. 593/2004 e (CE) n.
    1251/96
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2209/2004 (2004. gada 21. decembris), ar ko nosaka
