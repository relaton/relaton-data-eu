    olu nozares produktu importa atļauju pieteikumus, saskaņā ar shēmām, kas
    ir paredzētas Regulās (EK) Nr. 593/2004 un (EK) Nr. 1251/96
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 21 d. Komisijos reglamentas (EB) Nr. 2209/2004, nustatantis
    sąlygas, kuriomis galima priimti importo pažymėjimų prašymus, įvestus 2004
    m. gruodžio mėn. kai kuriems paukštienos ir kiaušinių sektorių produktams
    pagal Reglamentus (EB) Nr. 593/2004 ir (EB) Nr. 1251/96
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2209/2004 van de Commissie van 21 december 2004 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor bepaalde producten in de sectoren eieren en slachtpluimvee,
    die in december 2004 worden ingediend op grond van de Verordeningen (EG) nr. 593/2004
    en (EG) nr. 1251/96
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2209/2004 z dnia 21 grudnia 2004 r. określające
    stopień, w jakim mogą zostać przyjęte wnioski złożone w grudnia 2004 r.
    o pozwolenia na przywóz niektórych produktów z sektorów jaj i mięsa drobiowego
    w ramach rozporządzeń (WE) nr 593/2004 i nr 1251/96
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2209/2004 da Comissão, de 21 de Dezembro de 2004,
    que determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector dos ovos e da carne de aves de capoeira apresentados
    em Dezembro de 2004 ao abrigo dos Regulamentos (CE) n.° 593/2004 e (CE) n.°
    1251/96
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2209/2004 z 21. decembra 2004, ktoré určuje
    rozsah, v ktorom možno prijať žiadosti o dovozné povolenia predložené v
    decembra 2004 na niektoré produkty v sektore vajec a hydinového mäsa v rámci
    nariadení (ES) č. 593/2004 a (ES) č. 1251/96
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2209/2004 z dne 21. decembra 2004 o določitvi
    obsega, v katerem se lahko sprejmejo zahtevki, vloženi decembra 2004 za uvozna
    dovoljenja za nekatere proizvode iz sektorjev jajc in perutninskega mesa v skladu
    z uredbama (ES) št. 593/2004 in (ES) št. 1251/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2209/2004 de la Comisión, de 21 de diciembre de 2004,
