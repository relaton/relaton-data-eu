    Gemeinsamen Zolltarifs mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1026/87 af 9. april 1987 om genindførelse
