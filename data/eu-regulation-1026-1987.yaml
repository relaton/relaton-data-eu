    di orologi tascabili della voce 91.02 della tariffa doganale comune, originari
    di Hong Kong beneficario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1026/87 van de Commissie van 9 april 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op klokjes en
    wekkers, met horloge-uurwerk, van post 91.02 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3924/86 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1026/87 da Comissão de 9 de Abril de 1987 que restabelece
