  script: Latn
  content: Commission Regulation (EEC) No 1026/87 of 9 April 1987 reintroducing the
    levying of the customs duties applicable to clocks with watch movements falling
    under heading No 91.02 originating in Hong Kong, benefiting from the tariff preferences
    provided for by Council Regulation (EEC) No 3924/86
  type: main
- language: fr
  script: Latn
