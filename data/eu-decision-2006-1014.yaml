title:
- language: en
  script: Latn
  content: '2006/1014/EC: Council Decision of 28 November 2006 establishing, in accordance
    with Article 104(8), that the action taken by Poland in response to the Recommendation
    of the Council in accordance with Article 104(7) of the Treaty establishing the
    European Community is proving to be inadequate'
  type: main
- language: fr
  script: Latn
  content: '2006/1014/CE: Décision du Conseil du 28 novembre 2006 établissant, conformément
