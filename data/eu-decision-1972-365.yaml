id: EUDecision1972365
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 28 septembre 1972, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les asperges préparées
    ou conservées sans vinaigre ou acide acétique, de la position 20.02 D du Tarif
    douanier commun, originaires de Taiwan et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. September 1972, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Taiwan stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen Spargel, ohne Essig zubereitet oder haltbar gemacht,
    der Tarifnummer 20.02 D des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 settembre 1972, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario gli asparagi preparati
    o conservati senza aceto o acido acetico della voce n. 20.02 D della tariffa doganale
    comune, originari di Taiwan, e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 september 1972 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd asperges, bereid of verduurzaamd, zonder azijn of azijnzuur,
    van post 20.02 D van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
