title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3562/73 of the Commission of 21 December 1973 fixing
    for the 1974 fishing year withdrawal prices for the fishery products listed in
    Annex (A) and (C) to Regulation (EEC) No 2142/70 and for certain products landed
    in areas very distant from the main areas of consumption in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3562/73 de la Commission, du 21 décembre 1973, fixant,
    pour les produits de la pêche énumérés à l'annexe I sous A et C ainsi que
    pour certains produits débarqués dans des zones très éloignées des principaux
    centres de consommation de la Communauté du règlement (CEE) n° 2142/70, les
    prix de retrait valables pour l'année 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3562/73 der Kommission vom 21. Dezember 1973 zur Festsetzung
    der Rücknahmepreise für das Jahr 1974 für die im Anhang I unter A und C der
    Verordnung (EWG) Nr. 2142/70 aufgeführten Fischereierzeugnisse sowie für bestimmte
    Erzeugnisse aus Anlandezonen, die von den Hauptverbrauchszentren der Gemeinschaft
    sehr weit entfernt liegen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3562/73 af 21. december 1973 om fastsættelse
    af de tilbagetagelsespriser, der er gældende i 1974 for de fiskerivarer, som
    er anført i punkt A og C, bilag I, samt for visse varer fra landingsområder,
    der ligger meget fjernt fra Fællesskabets vigtigste forbrugscentre, nævnt i
    forordning (EØF) nr. 2142/70
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3562/73 della Commissione, del 21 dicembre 1973, che
    fissa, per i prodotti della pesca di cui all'allegato I, lettere A e C, nonché
    per taluni prodotti sbarcati in zone molto lontane dai principali centri di consumo
    della Comunità del regolamento (CEE) n. 2142/70, i prezzi di ritiro validi per
    l'anno 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3562/73 van de Commissie van 21 december 1973 tot
    vaststelling van de in 1974 geldende ophoudprijzen voor de in bijlage I, sub A
    en C, van Verordening (EEG) nr. 2142/70 genoemde visserijprodukten en bepaalde
    produkten die in ver van de voornaamste verbruikscentra van de Gemeenschap gelegen
    gebieden zijn aangevoerd
  type: main
