  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2024/857 da Comissão, de 1 de dezembro de 2023,
    que complementa a Diretiva 2013/36/UE do Parlamento Europeu e do Conselho no respeitante
    às normas técnicas de regulamentação que especificam uma metodologia padrão
    e uma metodologia padrão simplificada para avaliar os riscos resultantes de eventuais
    alterações das taxas de juro que afetem tanto o valor económico do capital
    próprio como os resultados líquidos de juros das atividades não incluídas
    na carteira de negociação de uma instituição
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2024/857 al Comisiei din 1 decembrie 2023 de
    completare a Directivei 2013/36/UE a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare care specifică o metodologie
    standardizată și o metodologie standardizată simplificată pentru evaluarea
    riscurilor care decurg din variațiile potențiale ale ratelor dobânzii care
    afectează atât valoarea economică a capitalului propriu, cât și veniturile
    nete din dobânzi aferente activităților din afara portofoliului de tranzacționare
    ale unei instituții
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2024/857 z 1. decembra 2023, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2013/36/EÚ, pokiaľ ide o
    regulačné technické predpisy, v ktorých sa spresňuje štandardizovaná metodika
    a zjednodušená štandardizovaná metodika na hodnotenie rizík vyplývajúcich
    z možných zmien úrokových sadzieb, ktoré ovplyvňujú ekonomickú hodnotu
    vlastného imania a čisté príjmy z úrokov z činností inštitúcie v neobchodnej
    knihe
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/857 z dne 1. decembra 2023 o dopolnitvi
    Direktive 2013/36/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo standardizirano metodologijo in poenostavljeno standardizirano
    metodologijo za oceno tveganj, izhajajočih iz morebitnih sprememb obrestnih mer,
    ki vplivajo na ekonomsko vrednost lastniškega kapitala in neto prihodke od obresti
    pri dejavnostih iz netrgovalne knjige institucije
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2024/857 de la Comisión, de 1 de diciembre de
    2023, por el que se completa la Directiva 2013/36/UE del Parlamento Europeo y
    del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    una metodología normalizada y una metodología normalizada simplificada para
    evaluar los riesgos derivados de posibles variaciones de los tipos de interés
    que incidan tanto en el valor económico del patrimonio neto como en los ingresos
    netos por intereses procedentes de las actividades de la cartera de inversión
    de una entidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2024/857 av den 1 december 2023
    om komplettering av Europaparlamentets och rådets direktiv 2013/36/EU vad gäller
    tekniska tillsynsstandarder som specificerar en schablonmetod och en förenklad
    schablonmetod för att utvärdera risker till följd av potentiella ränteförändringar
    som påverkar både det ekonomiska värdet på eget kapital och nettoränteintäkter
    från institutets verksamhet utanför handelslagret
