title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2024/857 of 1 December 2023 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards specifying a standardised methodology and a
    simplified standardised methodology to evaluate the risks arising from potential
    changes in interest rates that affect both the economic value of equity and the
    net interest income of an institution’s non-trading book activities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2024/857 de la Commission du 1er décembre 2023
    complétant la directive 2013/36/UE du Parlement européen et du Conseil par des
    normes techniques de réglementation définissant une méthode standard et une
    méthode standard simplifiée pour évaluer les risques découlant d’éventuelles
    variations des taux d’intérêt affectant aussi bien la valeur économique des
    fonds propres que les produits d’intérêts nets des activités hors portefeuille
    de négociation d’un établissement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2024/857 der Kommission vom 1. Dezember 2023
    zur Ergänzung der Richtlinie 2013/36/EU des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung einer standardisierten
    Methode und einer vereinfachten standardisierten Methode zur Bewertung der Risiken,
    die sich aus möglichen Zinsänderungen ergeben und sich sowohl auf den wirtschaftlichen
    Wert des Eigenkapitals als auch auf die Nettozinserträge bei Geschäften des
    Anlagebuchs eines Instituts auswirken
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2024/857 на Комисията
    от 1 декември 2023 година за допълнение на Директива
    2013/36/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на стандартизирана методика
    и опростена стандартизирана методика за оценка
    на рисковете, произтичащи от потенциални промени
    в лихвените проценти, които засягат както икономическата
    стойност на собствения капитал, така и нетния
    доход от лихви от дейностите на институцията
    извън търговския портфейл
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2024/857 ze dne 1. prosince
    2023, kterým se doplňuje směrnice Evropského parlamentu a Rady 2013/36/EU,
    pokud jde o regulační technické normy upřesňující standardizovanou metodiku
    a zjednodušenou standardizovanou metodiku pro hodnocení rizik vyplývajících
    z případných změn v úrokových sazbách, které mají vliv jak na ekonomickou
    hodnotu vlastního kapitálu, tak na čistý úrokový výnos z investičního
    portfolia instituce
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2024/857 af 1. december 2023 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2013/36/EU for
    så vidt angår reguleringsmæssige tekniske standarder, der præciserer en standardmetode
    og en forenklet standardmetode til vurdering af de risici, der opstår som følge
    af potentielle ændringer af rentesatserne, der påvirker både den økonomiske
    værdi af et instituts kapitalgrundlag og nettorenteindtægterne fra et instituts
    ikkehandelsmæssige aktiviteter
  type: main
- language: el
  script: Grek
