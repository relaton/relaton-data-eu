    Raad met technische reguleringsnormen tot vaststelling van een gestandaardiseerde
    methode en van vereenvoudigde gestandaardiseerde methoden voor het beoordelen
    van uit potentiële renteveranderingen voortvloeiende risico’s die van invloed
    zijn op de economische waarde van eigen vermogen en de netto-rente-inkomsten van
    de activiteiten buiten de handelsportefeuille van een instelling
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2024/857 z dnia 1 grudnia 2023
