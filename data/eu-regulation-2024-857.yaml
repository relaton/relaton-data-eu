  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2024/857 оd 1. prosinca 2023. o dopuni
    Direktive 2013/36/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se pobliže određuju standardizirana i pojednostavnjena standardizirana
    metodologija za procjenu rizika koji proizlaze iz mogućih promjena kamatnih stopa
    koje utječu na ekonomsku vrijednost kapitala i neto kamatni prihod od poslova
    institucija koji se vode u knjizi pozicija kojima se ne trguje
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/857 felhatalmazáson alapuló rendelete (2023. december
