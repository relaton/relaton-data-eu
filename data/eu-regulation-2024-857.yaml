    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2024/857 della Commissione, del 1o dicembre 2023,
    che integra la direttiva 2013/36/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che specificano una metodologia
    standardizzata e una metodologia standardizzata semplificata per valutare i rischi
    derivanti da variazioni potenziali dei tassi di interesse che influiscano sia
    sul valore economico del capitale proprio che sui proventi da interessi netti
    delle attività di un ente diverse dalla negoziazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2024/857 (2023. gada 1. decembris), ar
    ko Eiropas Parlamenta un Padomes Direktīvu 2013/36/ES papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, ar kuriem precizē standartizēto metodiku
    un vienkāršotu standartizēto metodiku tādu risku novērtēšanai, kas izriet
    no iespējamām procentu likmju izmaiņām, kuras ietekmē gan pašu kapitāla
    ekonomisko vērtību, gan iestādes netirdzniecības portfeļa darbību neto procentu
    ienākumus
  type: main
- language: lt
  script: Latn
  content: 2023 m. gruodžio 1 d. Komisijos deleguotasis reglamentas (ES) 2024/857,
    kuriuo Europos Parlamento ir Tarybos direktyva 2013/36/ES papildoma techniniais
    reguliavimo standartais, kuriais nustatoma standartizuota ir supaprastinta standartizuota
    rizikos, kylančios dėl galimų palūkanų normų pokyčių, turinčių įtakos
    ir įstaigos nuosavo kapitalo ekonominei vertei, ir ne prekybos knygos veiklos
    grynosioms palūkanų pajamoms, vertinimo metodika
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2024/857 tal-1 ta’ Diċembru
