    teknisten sääntelystandardien osalta, joissa täsmennetään vakiomenetelmä
    ja yksinkertaistettu vakiomenetelmä sellaisista korkojen potentiaalisista muutoksista
    aiheutuvien riskien arvioimiseksi, jotka vaikuttavat sekä oman pääoman taloudelliseen
    arvoon että laitoksen kaupankäyntivarastoon kuulumattomien toimien nettokorkotuloon
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2024/857 ón gCoimisiún an 1 Nollaig 2023 lena
