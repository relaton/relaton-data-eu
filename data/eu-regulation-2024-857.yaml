    le caighdeáin theicniúla rialála lena sonraítear modheolaíocht chaighdeánaithe
    agus modheolaíocht chaighdeánaithe shimplithe chun meastóireacht a dhéanamh
    ar rioscaí a eascraíonn as athruithe féideartha i rátaí úis a dhéanann
