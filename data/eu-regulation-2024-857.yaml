    do regulacyjnych standardów technicznych określających standardową metodykę
    i uproszczoną standardową metodykę w celu oceny ryzyka z tytułu potencjalnych
    zmian stóp procentowych, które wpływają zarówno na wartość ekonomiczną
    kapitału własnego, jak i na wynik odsetkowy netto z działalności w ramach
