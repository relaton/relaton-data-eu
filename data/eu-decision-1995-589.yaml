    Königreichs, der Regierung der Insel Man zu gestatten, bei Schaf- und Rindfleisch
    eine besondere Einfuhrlizenzregelung anzuwenden'
  type: main
- language: da
  script: Latn
  content: '95/589/EF: Rådets beslutning af 22. december 1995 om forlængelse af
