  script: Latn
  content: '95/589/EC: Council Decision of 22 December 1995 extending the period of
    application of Decision 82/530/EEC authorizing the United Kingdom to permit the
    Isle of Man authorities to apply a system of special import licences to sheepmeat
    and beef and veal'
  type: main
- language: fr
  script: Latn
  content: '95/589/CE: Décision du Conseil, du 22 décembre 1995, prorogeant la période
    d'' application de la décision 82/530/CEE autorisant le Royaume-Uni à permettre
    aux autorités de l'' île de Man d'' appliquer un système de certificats spéciaux
    d'' importation pour la viande ovine et la viande bovine'
  type: main
- language: de
  script: Latn
