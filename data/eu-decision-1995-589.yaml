    εισαγωγής προβείου, βοείου και μοσχαρίσιου
    κρέατος'
  type: main
- language: fi
  script: Latn
  content: '95/589/EY: Neuvoston päätös, tehty 22 päivänä joulukuuta 1995, luvan
