    της μεταβλητής πριμοδοτήσεως κατά τη σφαγή
    των προβατοειδών για τη Μεγάλη Βρετανία, και
    των ποσών προς είσπραξη για τα προϊόντα πού
    εξάγονται από την εν λόγω περιοχή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1720/82 della Commissione, del 30 giugno 1982, che
    fissa, per la Gran Bretagna, l'entità del premio variabile alla macellazione
    degli ovini e gli importi da riscuotere all'uscita di determinati prodotti dal
    territorio di detta regione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1720/82 van de Commissie van 30 juni 1982 tot vaststelling,
