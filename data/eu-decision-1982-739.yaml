  content: '82/739/EEC: Council Decision of 26 October 1982 under the Treaties, concerning
    fishery activities in waters under the sovereignty or jurisdiction of Member States
    taken on a temporary basis pending the adoption of permanent Community measures'
  type: main
- language: fr
  script: Latn
  content: '82/739/CEE: Décision du Conseil, du 26 octobre 1982, fondée sur les
    traités, relative aux activités de pêche exercées dans les eaux relevant de
    la souveraineté ou de la juridiction des États membres et prise à titre provisoire
    dans l'' attente de l'' adoption de mesures communautaires définitivesC'
  type: main
- language: de
  script: Latn
