    vlastnictví a Generální radě Světové obchodní organizace k žádosti nejméně
    rozvinutých členských zemí o prodloužení přechodného období podle čl.
    66 odst. 1 Dohody o obchodních aspektech práv k duševnímu vlastnictví ohledně
