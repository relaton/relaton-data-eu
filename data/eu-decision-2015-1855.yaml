  content: Decisione (UE) 2015/1855 del Consiglio, del 13 ottobre 2015, che stabilisce
    la posizione che deve essere adottata a nome dell'Unione europea in sede di Consiglio
    sugli aspetti dei diritti di proprietà intellettuale attinenti al commercio e
    al consiglio generale dell'Organizzazione mondiale del commercio in merito alla
    richiesta dei paesi membri meno avanzati di una proroga del periodo transitorio
    di cui all'articolo 66, paragrafo 1, dell'accordo sugli aspetti dei diritti di
    proprietà intellettuale attinenti al commercio per quanto riguarda determinati
    obblighi relativi ai prodotti farmaceutici e di una deroga agli obblighi di cui
    all'articolo 70, paragrafi 8 e 9, di tale accordo
