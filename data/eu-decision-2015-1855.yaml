  script: Latn
  content: Neuvoston päätös (EU) 2015/1855, annettu 13 päivänä lokakuuta 2015,
    Maailman kauppajärjestön teollis- ja tekijänoikeuksien kauppaan liittyviä
    näkökohtia käsittelevässä neuvostossa ja yleisneuvostossa Euroopan unionin
    puolesta esitettävästä kannasta, joka koskee vähiten kehittyneiden WTO:n jäsenmaiden
    pyyntöä saada pidennys teollis- ja tekijänoikeuksien kauppaan liittyvistä
    näkökohdista tehdyn sopimuksen (TRIPS) 66 artiklan 1 kohdassa tarkoitettuun
    siirtymäkauteen farmaseuttisia tuotteita koskevien tiettyjen velvoitteiden osalta
    sekä poikkeuslupa kyseisen sopimuksen 70 artiklan 8 ja 9 kohdan mukaisista velvollisuuksista
  type: main
