  script: Latn
  content: Odluka Vijeća (EU) 2015/1855 od 13. listopada 2015. o utvrđivanju stajališta
    koje treba zauzeti u ime Europske unije u okviru Vijeća za trgovinske aspekte
    prava intelektualnog vlasništva i Općeg vijeća Svjetske trgovinske organizacije
    u pogledu zahtjeva najmanje razvijenih država članica za produljenje prijelaznog
    razdoblja na temelju članka 66. stavka 1. Sporazuma o trgovinskim aspektima prava
