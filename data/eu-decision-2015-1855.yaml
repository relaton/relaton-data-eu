    Praw Własności Intelektualnej oraz Rady Generalnej Światowej Organizacji Handlu
    w odniesieniu do wniosku członków – krajów najmniej rozwiniętych dotyczącego
    przedłużenia okresu przejściowego na mocy art. 66 ust. 1 Porozumienia w sprawie
    handlowych aspektów praw własności intelektualnej w odniesieniu do niektórych
    zobowiązań dotyczących produktów farmaceutycznych oraz przyznania odstępstwa
    od zobowiązań wynikających z art. 70 ust. 8 i 9 tego Porozumienia
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2015/1855 do Conselho, de 13 de outubro de 2015, que define
    a posição a tomar em nome da União Europeia no âmbito do Conselho para os
    Aspetos dos Direitos de Propriedade Intelectual Relacionados com o Comércio e
    do Conselho Geral da Organização Mundial do Comércio sobre o pedido apresentado
    pelos países membros menos desenvolvidos de prorrogação do período de transição,
    ao abrigo do artigo 66.°, n.° 1, do Acordo sobre os Aspetos dos Direitos de
    Propriedade Intelectual Relacionados com o Comércio em relação a determinadas
    obrigações referentes a produtos farmacêuticos e de derrogação às obrigações,
    ao abrigo do artigo 70.°, n.os 8 e 9, desse Acordo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2015/1855 a Consiliului din 13 octombrie 2015 de stabilire
    a poziției care urmează să fie adoptată, în numele Uniunii Europene, în
    cadrul Consiliului pentru aspectele comerciale ale drepturilor de proprietate
    intelectuală și al Consiliului General al Organizației Mondiale a Comerțului
    în ceea ce privește solicitarea țărilor membre cel mai puțin dezvoltate referitoare
    la o prelungire a perioadei de tranziție prevăzute la articolul 66 alineatul
    (1) din Acordul privind aspectele comerciale ale drepturilor de proprietate intelectuală
    pentru anumite obligații legate de produsele farmaceutice, precum și la o scutire
    de obligațiile prevăzute la articolul 70 alineatele (8) și (9) din acordul
    respectiv
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2015/1855 z 13. októbra 2015 o pozícii, ktorá
    sa má zaujať v mene Európskej únie v Rade pre obchodné aspekty práv duševného
    vlastníctva a Generálnej rade Svetovej obchodnej organizácie, pokiaľ ide o
    žiadosť najmenej rozvinutých členských krajín o predĺženie prechodného
    obdobia podľa článku 66 ods. 1 Dohody o obchodných aspektoch práv duševného
    vlastníctva týkajúce sa určitých povinností súvisiacich s farmaceutickými
    výrobkami a oslobodenie od povinností podľa článku 70 ods. 8 a 9 uvedenej
    dohody
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2015/1855 z dne 13. oktobra 2015 o stališču, ki se zavzame
    v imenu Evropske unije v okviru Sveta za trgovinske vidike pravic intelektualne
    lastnine in Generalnega sveta Svetovne trgovinske organizacije v zvezi z zahtevo
    najmanj razvitih držav članic za podaljšanje prehodnega obdobja na podlagi
    odstavka 1 člena 66 Sporazuma o trgovinskih vidikih pravic intelektualne lastnine
    v zvezi z nekaterimi obveznostmi glede farmacevtskih izdelkov in za odstopanje
    od obveznosti na podlagi odstavkov 8 in 9 člena 70 navedenega sporazuma
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2015/1855 del Consejo, de 13 de octubre de 2015, por la
    que se establece la posición que debe adoptarse en nombre de la Unión Europea
    en el seno del Consejo de los aspectos de los derechos de propiedad intelectual
    relacionados con el comercio y en el Consejo General de la Organización Mundial
    del Comercio en lo que respecta a la petición de los países menos adelantados
    miembros de que se les conceda una prórroga del período de transición de conformidad
    con el artículo 66, apartado 1, del Acuerdo sobre los aspectos de los derechos
    de propiedad intelectual relacionados con el comercio, en relación con determinadas
    obligaciones relativas a los productos farmacéuticos, y una exención de las
    obligaciones del artículo 70, apartados 8 y 9, de dicho Acuerdo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2015/1855 av den 13 oktober 2015 om fastställande
    av den ståndpunkt som ska intas på Europeiska unionens vägnar i rådet för
    handelsrelaterade aspekter av immaterialrätter och i Världshandelsorganisationens
    allmänna råd vad gäller begäran från de minst utvecklade medlemsländerna
    om en förlängning av övergångsperioden enligt artikel 66.1 i avtalet om handelsrelaterade
    aspekter av immaterialrätter i fråga om vissa skyldigheter som rör läkemedelsprodukter,
    och om undantag från skyldigheterna enligt artikel 70.8 och 70.9 i det avtalet
