  script: Latn
  content: Besluit (EU) 2015/1855 van de Raad van 13 oktober 2015 tot vaststelling
    van het namens de Europese Unie in de Raad voor de handelsaspecten van de intellectuele
    eigendom en de Algemene Raad van de Wereldhandelsorganisatie in te nemen standpunt
    over het verzoek van leden die een minst ontwikkeld land zijn om verlenging van
    de overgangsperiode uit hoofde van artikel 66, lid 1, van de Overeenkomst inzake
    de handelsaspecten van de intellectuele eigendom wat bepaalde verplichtingen inzake
    geneesmiddelen betreft en om ontheffing van de uit hoofde van artikel 70, leden
    8 en 9, van die overeenkomst vastgestelde verplichtingen
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2015/1855 z dnia 13 października 2015 r. w sprawie stanowiska,
