title:
- language: en
  script: Latn
  content: Council Decision (EU) 2015/1855 of 13 October 2015 establishing the position
    to be taken on behalf of the European Union within the Council for Trade-Related
    Aspects of Intellectual Property Rights and the General Council of the World Trade
    Organisation as regards the request from least-developed country Members for an
    extension of the transitional period under paragraph 1 of Article 66 of the Agreement
    on Trade-Related Aspects of Intellectual Property Rights concerning certain obligations
    related to pharmaceutical products, and for a waiver of the obligations under
    paragraphs 8 and 9 of Article 70 of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2015/1855 du Conseil du 13 octobre 2015 établissant la
    position à prendre au nom de l'Union européenne au sein du Conseil des aspects
    des droits de propriété intellectuelle qui touchent au commerce et du Conseil
    général de l'Organisation mondiale du commerce au sujet de la demande des pays
    les moins avancés membres relative à une prorogation de la période de transition
    prévue à l'article 66, paragraphe 1, de l'accord sur les aspects des droits
    de propriété intellectuelle qui touchent au commerce pour certaines obligations
    en ce qui concerne les produits pharmaceutiques et à une dérogation aux obligations
    énoncées à l'article 70, paragraphes 8 et 9, dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2015/1855 des Rates vom 13. Oktober 2015 zur Festlegung
    des im Rat für handelsbezogene Aspekte der Rechte des geistigen Eigentums und
    dem Allgemeinen Rat der Welthandelsorganisation im Namen der Europäischen Union
    zu vertretenden Standpunkts hinsichtlich des Antrags der zu den am wenigsten entwickelten
    Ländern zählenden Mitglieder auf eine Verlängerung der Übergangsfrist nach
    Artikel 66 Absatz 1 des Übereinkommens über handelsbezogene Aspekte der Rechte
    des geistigen Eigentums in Bezug auf bestimmte Verpflichtungen auf dem Gebiet
    der Arzneimittel und auf eine Befreiung von Verpflichtungen nach Artikel 70 Absätze
    8 und 9 des genannten Übereinkommens
