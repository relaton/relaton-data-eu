title:
- language: en
  script: Latn
  content: '2011/248/EU: Council Decision of 12 April 2011 on the signing, on behalf
    of the Union, of the Agreement in the form of an Exchange of Letters between the
    European Union, of the one part, and the Palestinian Authority of the West Bank
    and the Gaza Strip, of the other part, providing further liberalisation of agricultural
    products, processed agricultural products and fish and fishery products and amending
    the Euro-Mediterranean Interim Association Agreement on trade and cooperation
    between the European Community, of the one part, and the Palestine Liberation
    Organization (PLO) for the benefit of the Palestinian Authority of the West Bank
    and the Gaza Strip, of the other part'
  type: main
- language: fr
  script: Latn
  content: '2011/248/UE: Décision du Conseil du 12 avril 2011 concernant la signature,
