title:
- language: en
  script: Latn
  content: '74/366/EEC: Commission Decision of 13 June 1974 provisionally authorizing
    the French Republic to prohibit the marketing, in France, of dwarf French bean
    seed of the variety ''sim'' (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '74/366/CEE: Décision de la Commission, du 13 juin 1974, autorisant provisoirement
    la République française à interdire la commercialisation, en France, des semences
    de haricots nains de la variété «Sim» (Le texte en langue française est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
