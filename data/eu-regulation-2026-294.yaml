title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/294 of 9 February 2026 amending
    Implementing Regulation (EU) 2025/1078 as regards the inclusion of Potato virus
    X (non-EU isolates) to the list of specified pests for the introduction into the
    Union territory of unrooted cuttings for planting of Calibrachoa spp., Petunia
    spp. and their hybrids from Guatemala
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/294 de la Commission du 9 février
    2026 modifiant le règlement d’exécution (UE) 2025/1078 en ce qui concerne
    l’inscription du virus X de la pomme de terre (isolats de pays tiers) sur la
    liste des organismes nuisibles spécifiés pour l’introduction sur le territoire
    de l’Union de boutures non racinées destinées à la plantation de Calibrachoa
    spp. et de Petunia spp. et de leurs hybrides en provenance du Guatemala
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/294 der Kommission vom 9. Februar 2026
    zur Änderung der Durchführungsverordnung (EU) 2025/1078 hinsichtlich der Aufnahme
    des Kartoffelvirus X (Nicht-EU-Isolate) in die Liste der spezifizierten Schädlinge
    für das Einführen von zum Anpflanzen bestimmten unbewurzelten Stecklingen von
    Calibrachoa spp., Petunia spp. und ihren Hybriden aus Guatemala in das Gebiet
    der Union
  type: main
