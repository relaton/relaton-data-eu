title:
- language: en
  script: Latn
  content: '93/394/EEC: Council Decision of 12 July 1993 on the conclusion of the
    Agreement in the form of an Exchange of Letters concerning the provisional application
    of the Protocol establishing, for the period 1 June 1993 to 31 May 1996, the fishing
    rights and financial compensation provided for in the Agreement between the European
    Economic Community and the Government of the Democratic Republic of São Tomé
    e Principe on fishing off São Tomé e Principe'
  type: main
- language: fr
  script: Latn
  content: '93/394/CEE: Décision du Conseil du 12 juillet 1993 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République démocratique de São Tomé et Príncipe concernant la pêche
    au large de São Tomé et Príncipe, pour la période du 1er juin 1993 au 31 mai
    1996'
  type: main
