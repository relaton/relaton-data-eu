    mellem de kvantitative lofter for tekstilvarer og beklædningsgenstande med oprindelse
    i Republikken Indien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2598/2001 της Επιτροπής,
    της 28ης Δεκεμβρίου 2001, για την τροποποίηση
