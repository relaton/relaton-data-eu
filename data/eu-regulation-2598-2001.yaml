    the quantitative limits of textiles and clothing products originating in the Republic
    of India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2598/2001 de la Commission du 28 décembre 2001 modifiant
    les règlements (CE) n° 1442/2001 et (CE) n° 1954/2001 en ce qui concerne les
    transferts autorisés entre les limites quantitatives de produits textiles et
    d'habillement originaires de la République de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2598/2001 der Kommission vom 28. Dezember 2001 zur
    Änderung der Verordnungen (EG) Nr. 1442/2001 und (EG) Nr. 1954/2001 im Hinblick
    auf die genehmigten Übertragungen zwischen den Höchstmengen für Textilwaren
    und Bekleidung mit Ursprung in der Republik Indien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2598/2001 af 28. december 2001 om ændring
