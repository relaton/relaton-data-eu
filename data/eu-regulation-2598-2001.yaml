    όσον αφορά τις εγκεκριμένες μεταφορές μεταξύ
    των ποσοτικών ορίων για τα κλωστοϋφαντουργικά
    προϊόντα και τα είδη ένδυσης καταγωγής Δημοκρατίας
    της Ινδίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2598/2001, annettu 28 päivänä joulukuuta 2001,
    luvan antamisesta Intian tasavallasta peräisin olevien tekstiili- ja vaatetustuotteiden
    määrällisten rajoitusten siirroille annettujen asetusten (EY) N:o 1442/2001
    ja (EY) N:o 1954/2001 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2598/2001 della Commissione, del 28 dicembre 2001,
    recante modifica dei regolamenti (CE) n. 1442/2001 e (CE) n. 1954/2001 per quanto
    riguarda i trasferimenti autorizzati tra i limiti quantitativi per i prodotti
    tessili e dell'abbigliamento originari della Repubblica indiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2598/2001 van de Commissie van 28 december 2001 tot
    wĳziging van de Verordeningen (EG) nr. 1442/2001 en (EG) nr. 1954/2001 met betrekking
    tot toegestane overdrachten tussen de kwantitatieve beperkingen voor textiel-
    en kledingproducten van oorsprong uit de Republiek India
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2598/2001 da Comissão, de 28 de Dezembro de 2001,
    que altera os Regulamentos (CE) n.° 1442/2001 e (CE) n.° 1954/2001 no que respeita
    às transferências autorizadas entre os limites quantitativos dos produtos têxteis
    e de vestuário originários da República da Índia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2598/2001 de la Comisión, de 28 de diciembre de 2001,
