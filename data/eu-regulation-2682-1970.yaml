title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2682/70 de la Commission, du 29 décembre 1970, portant
    prorogation de la durée de validité des règlements (CEE) n° 1134/70 et 1275/70
    en ce qui concerne la commercialisation de vins qui ne correspondent pas aux prescriptions
    du règlement (CEE) n 816/70
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2682/70 der Kommission vom 29. Dezember 1970 über
    die Verlängerung der Geltungsdauer der Verordnungen (EWG) Nr. 1134/70 und Nr.
    1275/70 in bezug auf die Vermarktung von Weinen, die nicht den Bestimmungen der
    Verordnung (EWG) Nr. 816/70 entsprechen
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2682/70 della Commissione, del 29 dicembre 1970, recante
    nuova modifica dei regolamenti (CEE) n. 1134/70 e n. 1275/70 per quanto riguarda
    la commercializzazione di vini non conformi alle disposizioni del regolamento
    (CEE) n. 816/70
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2682/70 van de Commissie van 29 december 1970 houdende
    verlenging van de geldigheidsduur van de Verordeningen (EEG) nrs. 1134/70 en 1275/70
    met betrekking tot het in de handel brengen van wijnen die niet beantwoorden aan
    de bepalingen van Verordening (EEG) nr. 816/70
  type: main
