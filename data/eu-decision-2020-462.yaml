    les Communautés européennes et leurs États membres, d’une part, et le Royaume
    du Maroc, d’autre part, concernant l’échange d’informations en vue d’évaluer
    l’impact de l’accord sous forme d’échange de lettres modifiant ledit accord
  type: main
