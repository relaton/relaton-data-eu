title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/462 of 20 February 2020 establishing the position
    to be adopted on behalf of the European Union within the Association Committee
    set up by the Euro-Mediterranean Agreement establishing an association between
    the European Communities and their Member States, of the one part, and the Kingdom
    of Morocco, of the other part, concerning the exchange of information for the
    purpose of evaluating the impact of the Agreement in the form of an Exchange of
    Letters on the amendment of the Euro-Mediterranean Agreement
  type: main
- language: fr
  script: Latn
