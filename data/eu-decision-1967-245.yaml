title:
- language: fr
  script: Latn
  content: Décision 67/245/CEE de la Commission, du 4 avril 1967, autorisant la République
    française, en vertu de l'article 115 alinéa 1 du Traité, à exclure du traitement
    communautaire certaines "matières colorantes organiques synthétiques" de la
    position n° 32.05 Ex A du Tarif douanier commun, originaires du Japon et mises
    en libre pratique dans d'autres États membres
  type: main
- language: de
  script: Latn
  content: '67/245/EWG: Entscheidung der Kommission vom 4. April 1967, mit der die
    Französische Republik gemäß Artikel 115 Absatz (1) ermächtigt wird, synthetische
    organische Farbstoffe der Tarifnummer 32.05 ex A des Gemeinsamen Zolltarifs, mit
    Ursprung in Japan, die sich in den anderen Mitgliedstaaten im freien Verkehr befinden,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/245/CEE: Decisione della Commissione, del 4 aprile 1967, con cui si
    autorizza la Repubblica francese, ai sensi dell''articolo 115, comma 1, del Trattato,
    ad escludere dal trattamento comunitario alcune «sostanze coloranti organiche
    sintetiche» della voce n. 32.05 ex A della tariffa doganale comune, originarie
    del Giappone e ammesse in libera pratica in altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/245/EEG: Beschikking van de Commissie van 4 april 1967 waarbij de Franse
    Republiek wordt gemachtigd om op grond van artikel 115, eerste alinea, van het
    Verdrag bepaalde synthetische organische kleurstoffen van post Nr. 32.05 ex A
    van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de andere
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
