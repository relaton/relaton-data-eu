id: EURegulation18781974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1878/74 of the Council of 15 July 1974 laying down,
    for the 1974/75 wine-growing year, the price to be paid for alcohol delivered
    to intervention agencies under the obligation to distil the by-products of wine
    making, and the maximum amount of the contribution towards this price by the Guarantee
    Section of the European Agricultural Guidance and Guarantee Fund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1878/74 du Conseil, du 15 juillet 1974, déterminant,
    pour la campagne viticole 1974/1975, le prix à payer pour l'alcool livré aux
    organismes d'intervention au titre de la distillation obligatoire des sous-produits
    de la vinification et le montant maximal de l'intervention, dans ce prix, du Fonds
    européen d'orientation et de garantie agricole, section garantie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1878/74 des Rates vom 15. Juli 1974 zur Festlegung
    - für das Weinwirtschaftsjahr 1974/1975 - des von den Interventionsstellen zu
    zahlenden Preises für den Alkohol, der ihnen im Rahmen der Verpflichtung zur
    Destillation der Nebenerzeugnisse der Weinbereitung geliefert wird, und des dabei
    vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung
    Garantie, zu übernehmenden Höchstanteils
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1878/74 af 15. juli 1974 om fastsættelse
    for vinhøståret 1974/1975 af den pris, der skal betales for alkohol, som leveres
    til interventionsorganerne som følge af forpligtelsen til destillering af biprodukter
    ved vinfremstilling samt af det størstebeløb, hvormed Den europæiske Udviklings-
    og Garantifond for Landbruget, garantisektionen skal intervenere med hensyn til
    denne pris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1878/74 del Consiglio, del 15 luglio 1974, che fissa,
    per la campagna viticola 1974/1975, il prezzo dell'alcole consegnato agli organismi
    d'intervento per la distillazione obbligatoria dei sottoprodotti della vinificazione
    e determina l'importo massimo dell'intervento in tale prezzo del Fondo europeo
    agricolo di orientamento e di garanzia, sezione garanzia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1878/74 van de Raad van 15 juli 1974 tot vaststelling,
    voor het wijnoogstjaar 1974/1975, van de prijs die moet worden betaald voor de
    aan de interventiebureaus uit hoofde van de verplichte distillatie van de bijprodukten
    van de wijnbereiding geleverde alcohol, alsmede van het maximum gedeelte van deze
    prijs dat voor rekening komt van het Europees Oriëntatie- en Garantiefonds voor
    de Landbouw, afdeling Garantie
  type: main
