title:
- language: fr
  script: Latn
  content: Décision 65/479/CEE de la Commission, du 12 octobre 1965, portant nouvelle
    modification de sa décision du 21 décembre 1964 autorisant la perception d'une
    taxe compensatoire sur les importations, en République fédérale d'Allemagne,
    de caramels mous, de caramels durs, de dragées ainsi que de pâte à fondant
    en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '65/479/EWG: Entscheidung der Kommission vom 12. Oktober 1965 zu erneuten
    Änderung ihrer Entscheidung vom 21. Dezember 1964 über die Erhebung einer Ausgleichsabgabe
    auf Einfuhren von Hartkaramellen, Weichkaramellen, Dragées und Fondantmasse aus
    den anderen Mitgliedstaaten in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '65/479/CEE: Decisione della Commissione, del 12 ottobre 1965, che modifica
    ulteriormente la decisione del 21 dicembre 1964 che autorizza la riscossione di
    una tassa di compensazione sulle importazioni, nella Repubblica federale di Germania,
    di caramelle tenere, di caramelle dure, di confetti e di pasta per fondente in
    provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/479/EEG: Beschikking van de Commissie van 12 oktober 1965 tot nieuwe
    wijziging van haar beschikking van 21 december 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van zachte karamels, harde karamels, dragees en van fondant uit de overige Lid-
    Staten'
  type: main
