    portoghese per taluni vini in provenienza dalla Comunità nella sua composizione
    al 31 dicembre 1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 499/86 van de Raad van 25 februari 1986 houdende
