  content: Council Regulation (EEC) No 499/86 of 25 February 1986 fixing, for 1986,
    the initial quota that the Portuguese Republic may apply to certain wines coming
    from the Community as constituted on 31 December 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 499/86 du Conseil du 25 février 1986 fixant, pour
    l' année 1986, le contingent initial pouvant être appliqué par la République
    portugaise pour certains vins en provenance de la Communauté dans sa composition
    au 31 décembre 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 499/86 des Rates vom 25. Februar 1986 zur Festsetzung
    des Anfangskontingents für 1986, das die Portugiesische Republik für bestimmte
    Weine mit Herkunft aus der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember
    1985 anwenden kann
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 499/86 af 25. februar 1986 om fastsættelse
    for 1986 af det første kontingent, som republikken Portugal kan anvende for visse
    vine fra Fællesskabet i dets sammensætning pr. 31. december 1985
  type: main
- language: el
  script: Grek
