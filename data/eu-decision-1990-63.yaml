title:
- language: en
  script: Latn
  content: '90/63/EEC: Council Decision of 12 February 1990 amending, for the fourth
    time, Decision 88/303/EEC recognizing certain parts of the territory of the Community
    as being either officially swine-fever free or swine-fever free'
  type: main
- language: fr
  script: Latn
  content: '90/63/CEE: Décision du Conseil du 12 février 1990 portant quatrième
    modification de la décision 88/303/CEE reconnaissant certaines parties du territoire
    de la Communauté comme officiellement indemnes de peste porcine ou indemnes de
    peste porcine'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DES RATES vom 12. Februar 1990 zur vierten Aenderung der Entscheidung
    88/303/EWG des Rates mit der bestimmte Teile der Gemeinschaft als amtlich schweinepestfrei
    oder als schweinepestfrei anerkannt werden (90/63/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS BESLUTNING af 12. februar 1990 om fjerde aendring af beslutning
    88/303/EOEF om erklaering af visse dele af Faellesskabets omraade officielt fri
    for svinepest eller fri for svinepest (90/63/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/63/ΕΟΚ: Απόφαση του Συμβουλίου της 12ης
    Φεβρουαρίου 1990 για την τέταρτη τροποποίηση
    της απόφασης 88/303/ΕΟΚ για την αναγνώριση ορισμένων
    τμημάτων του εδάφους της Κοινότητας ως επίσημα
    απαλλαγμένων από την πανώλη των χοίρων ή ως
    απαλλαγμένων από την πανώλη των χοίρων'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 12 febbraio 1990 recante quarta modifica della
    decisione 88/303/CEE che riconosce come ufficialmente indenni da peste suina o
    indenni da peste suina alcune parti del territorio della Comunità (90/63/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE RAAD van 12 februari 1990 houdende vierde wijziging
    van Beschikking 88/303/EEG waarbij bepaalde delen van het grondgebied van de Gemeenschap
    als officieel vrij van varkenspest of vrij van varkenspest worden erkend (90/63/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 12 de Fevereiro de 1990 que altera pela quarta vez
    a Decisao 88/303/CEE que reconhece determinadas partes do territorio da Comunidade
    como oficialmente indemnes de peste suina ou indemnes de peste suina (90/63/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 12 de febrero de 1990 por la que se modifica, por
    cuarta vez, la Decision 88/303/CEE por la que se reconocen algunas partes del
    territorio de la Comunidad como oficialmente indemnes de peste porcina o indemnes
    de peste porcina (90/63/CEE)
