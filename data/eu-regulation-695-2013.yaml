    antidumping sur les importations de planches à repasser originaires d'Ukraine
    à la suite d'un réexamen au titre de l'expiration des mesures effectué conformément
    à l'article 11, paragraphe 2, et d'un réexamen intermédiaire partiel effectué
    conformément à l'article 11, paragraphe 3, du règlement (CE) n ° 1225/2009
