  content: Council Implementing Regulation (EU) No 695/2013 of 15 July 2013 imposing
    a definitive anti-dumping duty on imports of ironing boards originating in the
    People's Republic of China, and repealing the anti-dumping measures on imports
    of ironing boards originating in Ukraine following an expiry review pursuant to
    Article 11(2) and a partial interim review pursuant to Article 11(3) of Regulation
    (EC) No 1225/2009
  type: main
- language: fr
