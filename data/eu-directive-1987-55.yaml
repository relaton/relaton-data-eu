title:
- language: en
  script: Latn
  content: Council Directive 87/55/EEC of 18 December 1986 amending for the fourth
    time Directive 70/357/EEC on the approximation of the laws of the Member States
    concerning the antioxidants authorized for use in foodstuffs intended for human
    consumption
  type: main
- language: fr
  script: Latn
  content: Directive 87/55/CEE du Conseil du 18 décembre 1986 portant quatrième
    modification de la directive 70/357/CEE relative au rapprochement des législations
    des États membres concernant les substances ayant des effets antioxygènes et
    pouvant être employées dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 87/55/EWG des Rates vom 18. Dezember 1986 zur vierten Änderung
    der Richtlinie 70/357/EWG über die Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für Stoffe mit antioxidierender Wirkung, die in Lebensmitteln verwendet werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 87/55/EØF af 18. december 1986 om fjerde ændring af
    direktiv 70/357/EØF om tilnærmelse af medlemsstaternes lovgivning om antioxidanter,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 87/55/ΕΟΚ του Συμβουλίου της 18ης Δεκεμβρίου
    1986 για την τέταρτη τροποποίηση της οδηγίας
    70/357/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τις ουσίες που έχουν
    αντιοξειδωτικά αποτελέσματα και επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 87/55/ETY, annettu 18 päivänä joulukuuta 1986,
    elintarvikkeissa sallittuja hapettumisenestoaineita koskevan jäsenvaltioiden
    lainsäädännön lähentämisestä annetun direktiivin 70/357/ETY muuttamisesta
    neljännen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 87/55/CEE del Consiglio del 18 dicembre 1986 recante quarta modifica
    della direttiva 70/357/CEE relativa al ravvicinamento delle legislazioni degli
    Stati Membri concernenti le sostanze che hanno effetti antiossidanti che possono
    essere impiegate nei prodotti destinati all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 87/55/EEG van de Raad van 18 december 1986 houdende vierde wijziging
    van Richtlijn 70/357/EEG betreffende de onderlinge aanpassing van de wettelijke
    voorschriften der Lid-Staten inzake oxydatietegengaande stoffen waarvan het gebruik
    in levensmiddelen is toegestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 87/55/CEE do Conselho de 18 Dezembro de 1986 que altera pela
    quarta vez a Directiva 70/357/CEE relativa à aproximação das legislações
    dos Estados- membros respeitantes às substâncias antioxidantes que podem ser
    utilizadas em géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 87/55/CEE del Consejo de 18 de diciembre de 1986 por la que se
    modifica por cuarta vez la Directiva 70/357/CEE relativa a la aproximación de
    las legislaciones de los Estados Miembros referentes a las sustancias con efecto
    antioxidante y que pueden ser empleadas en los productos destinados a la alimentación
    humana
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 87/55/EEG av den 18 december 1986 om den fjärde ändringen
