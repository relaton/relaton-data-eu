    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2615/83 della Commissione del 19 settembre 1983 che
    ripristina la riscossione dei dazi doganali applicabili per la metilammina, dimetilammina
    e trimetilammina e i loro sali, della sottovoce 29.22 A I della tariffa doganale
    comune, originari della Romania beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2615/83 van de Commissie van 19 september 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op methylamine,
    dimethylamine en trimethylamine, alsmede zouten daarvan, van postonderverdeling
    29.22 A I, van oorsprong uit Roemenië, waarvoor de in Verordening (EEG) nr. 3377/82
    van de Raad vermelde tariefpreferenties zijn verleend
