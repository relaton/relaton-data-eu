    διμεθυλαμίνη και τριμεθυλαμίνη και τα άλατα
    αυτών, της διακρίσεως 29.22 Α Ι του Κοινού Δασμολογίου,
    καταγωγής Ρουμανίας, δικαιούχου των προβλεπομένων
