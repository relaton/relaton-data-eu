title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2615/83 of 19 September 1983 re-establishing
    the levying of customs duties on methylamine, dimethylamine and trimethylamine
    and their salts, falling within subheading 29.22 A I and originating in Romania,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2615/83 de la Commission du 19 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux méthylamine,
    diméthylamine et triméthylamine, et leurs sels, de la sous-position 29.22 A
    I du tarif douanier commun, originaires de Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2615/83 der Kommission vom 19. September 1983 zur
    Wiedereinführung der Erhebung der Zölle für Methylamin, Dimethylamin und Trimethylamin
    und ihre Salze der Tarifstelle 29.22 A I mit Ursprung in Rumänien, dem die in
    der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2615/83 af 19. september 1983 om genindførelse
    af opkrævning af told for methylamin, dimethylamin og trimethylamin samt salte
    deraf, henhørende under pos. 29.22 A I og med oprindelse i Rumænien, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
