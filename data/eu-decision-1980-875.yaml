title:
- language: en
  script: Latn
  content: '80/875/EEC: Commission Decision of 17 September 1980 accepting undertakings
    given by Romanian exporters in connection with the anti-dumping proceeding concerning
    imports of certain tubes of iron or steel originating in that country, and terminating
    that proceeding'
  type: main
- language: fr
  script: Latn
  content: '80/875/CEE: Décision de la Commission, du 17 septembre 1980, portant
    acceptation des engagements souscrits par les exportateurs de Roumanie dans le
    cadre de la procédure anti-"dumping" concernant les importations de certains
    tubes en fer ou en acier, originaires de ce pays, et portant clôture de cette
    procédure'
  type: main
- language: de
  script: Latn
  content: '80/875/EWG: Beschluß der Kommission vom 17. September 1980 über die
    Annahme von Verpflichtungserklärungen, die die rumänischen Ausführer im Rahmen
    des Antidumpingverfahrens betreffend bestimmte Rohre aus Eisen oder Stahl mit
    Ursprung in Rumänien eingegangen sind, und über die Einstellung dieses Verfahrens'
  type: main
- language: da
  script: Latn
  content: '80/875/EØF: Kommissionens afgørelse af 17. september 1980 om godtagelse
    af tilsagn afgivet af de rumænske eksportører i forbindelse med antidumpingsproceduren
    vedrørende indførselen af visse rør og røremner af jern og stål med oprindelse
    i Rumænien og om slutning af denne procedure'
  type: main
- language: it
  script: Latn
  content: '80/875/CEE: Decisione della Commissione, del 17 settembre 1980, recante
    accettazione degli impegni assunti dagli esportatori della Romania nell'' ambito
    della procedura antidumping relativa alle importazioni di taluni tubi di ferro
    o di acciaio, originari di questo paese, e recante conclusione di detta procedura'
  type: main
- language: nl
  script: Latn
  content: '80/875/EEG: Besluit van de Commissie van 17 september 1980 houdende aanvaarding
    van de verbintenissen die door de exporteurs van Roemenië zijn aangegaan in het
    kader van de anti-dumpingprocedure betreffende de invoer van bepaalde buizen en
    pijpen van ijzer of van staal, van oorsprong uit dat land, en houdende beëindiging
    van genoemde procedure'
