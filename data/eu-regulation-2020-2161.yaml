  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2161 of 18 December 2020 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2019/915 on imports of certain aluminium
    foil in rolls originating in the People’s Republic of China by imports of certain
    aluminium foil in rolls consigned from Thailand, whether declared as originating
    in Thailand or not, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
