    2020 ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2019/915 sur les importations
    de certaines feuilles d’aluminium en rouleaux originaires de la République
    populaire de Chine par des importations de certaines feuilles d’aluminium en
    rouleaux expédiées de Thaïlande, qu’elles aient ou non été déclarées
    originaires de ce pays, et soumettant ces importations à enregistrement
  type: main
