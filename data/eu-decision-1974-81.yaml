id: EUDecision197481
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 February 1974 authorizing the French Republic
    not to apply Community treatment to toys of wood and other (except motors and
    movement mechanisms for toys and working models used for recreational purposes,
    and parts thereof) falling within heading Nos 97.03 A and ex B of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission 74/81/CEE, du 7 février 1974, autorisant la
    République française à exclure du traitement communautaire les jouets en bois
    et autres (à l'exception des moteurs et mécanismes d'animation pour les jouets
    et modèles réduits ainsi que de leurs pièces détachées), des positions 97.03
    A et Ex B du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. Februar 1974, mit der die Französische
    Republik ermächtigt wird, aus Japan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches Spielzeug aus Holz und anderes (mit Ausnahme der
    Motoren und Bewegungsmechanismen für Spielzeug und Modelle zum Spielen sowie
    deren Ersatzteile), der Tarifnummern 97.03 A und ex B des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 7. februar 1974 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage legetøj af træ eller andre
    materialer (bortset fra motorer og bevægelsesmekanismer til legetøj og modeller
    samt dele hertil) som henhører under positionerne 97.03 A og ex B i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 7 febbraio 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i giocattoli di legno ed altri
    (eccetto i motori ed i meccanismi d'animazione per giocattoli e modelli ridotti
    ed i loro pezzi staccati), delle voci n. 97.03 A ed ex B della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 februari 1974 waarbij de Franse Republiek
    wordt gemachtigd speelgoed van hout en andere (met uitzondering van motoren en
    bewegingsmechanismen voor speelgoed en modellen op schaal alsmede hun onderdelen),
    van de posten 97.03 A en ex B van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
