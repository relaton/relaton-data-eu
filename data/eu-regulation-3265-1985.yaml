title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3265/85 of 21 November 1985 re-establishing
    the levying of customs duties applicable to halogenated, sulphonated, nitrated
    and nitrosated derivatives of toluidines falling within subheading 29.22 D ex
    III, originating in South Korea, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3265/85 de la Commission du 21 novembre 1985 portant
    rétablissement de la perception des droits de douane applicables aux dérivés
    halogénés, sulfonés, nitrés, nitrosés de toluidines de la sous-position 29.22
    D ex III du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3265/85 der Kommission vom 21. November 1985 zur Wiedereinführung
    der Erhebung der Zölle für Halogen-, Sulfo-, Nitro- und Nitrosoderivate von
    Toluidinen der Tarifstelle 29.22 D ex III des Gemeinsamen Zolltarifs mit Ursprung
    in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3265/85 af 21. november 1985 om genindførelse
    af opkrævning af told for halogen-, sulfo-, nitro- og nitrosoderivater af toluidiner,
    henhørende under pos. 29.22 D ex III og med oprindelse i Sydkorea, som præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3265/85 της Επιτροπής
    της 21ης Νοεμβρίου 1985 περί επαναφοράς της εισπράξεως
    των τελωνειακών δασμών για αλογονωμένα, σουλφονωμένα,
    νιτρωμένα, νιτροδωμένα παράγωγα των τολουιδινών,
    της διακρίσεως 29.22 Δ ex ΙΙΙ του κοινού δασμολογίου,
    καταγωγής Νότιας Κορέας, δικαιούχου των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3265/85 della Commissione del 21 novembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili ai derivati alogenati,
    solfonati, nitrati, nitrosi di toluidina, della sottovoce 29.22 D ex III della
    tariffa doganale comune, originari della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3265/85 van de Commissie van 21 november 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op halogeen-,
    sulfo-, nitro- en nitrosoderivaten van toluïdinen van postonderverdeling 29.22
    D ex III, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG) nr. 3562/84
    van de Raad vermelde tariefpreferenties zijn verleend
