id: EUDecision1974422
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 July 1974 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's shirts, of cotton, or of mixed man-made fibres, and
    men's pyjamas, of cotton, falling within heading No ex 61.03 of the Common Customs
    Tariff originating in Romania and put into free circulation in the Federal Republic
    of Germany
  type: main
- language: fr
  script: Latn
  content: Décision 74/422/CEE de la Commission, du 8 juillet 1974, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises d'homme en coton ou en fibres
    textiles artificielles ou synthétiques, mélangées, et les pyjamas d'homme en
    coton, de la position Ex 61.03 du Tarif douanier commun, originaires de Roumanie
    et mis en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Juli 1974, mit der das Königreich Belgien,
    das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt werden,
    aus Rumänien stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Herrenoberhemden aus Baumwolle, gemischten synthetischen oder künstlichen
    Spinnstoffen und Herrenschlafanzüge aus Baumwolle der Tarifnummer ex 61.03 des
    Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. juli 1974 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter til mænd, af bomuld eller kemofibre eller blandinger heraf,
    og pyjamas til mænd, af bomuld, som henhører under position ex 61.03 i den fælles
    toldtarif, har oprindelse i Rumænien og frit kan omsættes i forbundsrepublikken
    Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 luglio 1974, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie per uomo, di cotone o in fibre tessili
    artificiali o sintetiche, miste, e i pigiama per uomo, di cotone della voce ex
    61.03 della tariffa doganale comune, originari della Romania e messi in libera
    pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 juli 1974 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    herenoverhemden van katoen of van gemengde synthetische of van gemengde kunstmatige
    garens, en herenpyama's van katoen van de post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië en in de Bondsrepubliek Duitsland in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
