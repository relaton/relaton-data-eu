id: EUDecision2001751
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2001/751/EC: Commission Decision of 16 October 2001 laying down animal
    health conditions and veterinary certification for imports of live ratites and
    hatching eggs thereof from third countries including animal health measures to
    be applied after such importation, amending Commission Decision 95/233/EC drawing
    up a list of third countries from which the Member States authorise imports of
    live poultry and hatching eggs and amending Commission Decision 96/659/EC on protective
    measures in relation to Crimean Congo haemorrhagic fever (Text with EEA relevance)
    (notified under document number C(2001) 3074)'
  type: main
- language: fr
  script: Latn
  content: '2001/751/CE: Décision de la Commission du 16 octobre 2001 établissant
    les conditions de police sanitaire et la certification vétérinaire requises
    à l''importation de ratites vivants et de leurs œufs à couver en provenance
    de pays tiers, ainsi que les mesures de police sanitaire à appliquer après une
    telle importation, modifiant la décision 95/233/CE établissant une liste de
    pays tiers en provenance desquels les États membres autorisent les importations
    de volailles vivantes et d''œufs à couver et modifiant la décision 96/659/CE
    concernant des mesures de protection relative à la fièvre hémorragique de Crimée
    et du Congo (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le
    numéro C(2001) 3074]'
  type: main
- language: de
  script: Latn
  content: '2001/751/EG: Entscheidung der Kommission vom 16. Oktober 2001 zur Festlegung
    der Veterinärbedingungen und Veterinärbescheinigungen für die Einfuhr lebender
    Laufvögel und ihrer Bruteier aus Drittländern, einschließlich der nach der
    Einfuhr anzuwendenden tierseuchenrechtlichen Maßnahmen, zur Änderung der Entscheidung
    95/233/EG über die Verzeichnisse der Drittländer, aus denen die Mitgliedstaaten
    die Einfuhr von lebendem Geflügel und Bruteiern genehmigen und zur Änderung
    der Entscheidung 96/659/EG über Schutzvorkehrungen gegen die Einschleppung des
    Hämorrhagischen Krim-Kongo-Fiebers (Text von Bedeutung für den EWR) (Bekannt
    gegeben unter Aktenzeichen K(2001) 3074)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 16 октомври 2001 година
    за определяне на ветеринарно-санитарните изисквания
    и ветеринарното сертифициране за вноса на
    живи щраусови птици и яйца за люпене от тях,
    с произход от трети страни, включително ветеринарно-санитарните
    мерки, които трябва да се прилагат след подобен
    внос, и за изменение на Решение 95/233/ЕО на Комисията
    относно съставяне на списък на трети страни,
    от които държавите-членки разрешават внос
    на живи птици и яйца за люпене, и за изменение
    на Решение 96/659/ЕО на Комисията относно защитните
    мерки във връзка с Кримско-конгоанската хеморагична
    треска (нотифицирано под номер C(2001) 3074)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 16. října 2001, kterým se stanoví veterinární
    podmínky a veterinární osvědčení pro dovoz živých ptáků nadřádu běžci
    (ratitae) a jejich násadových vajec ze třetích zemí, včetně veterinárních
    opatření, která se po takovém dovozu použijí, a kterým se mění rozhodnutí
    Komise 95/233/ES, kterým se stanoví seznam třetích zemí, z nichž členské
    státy povolují dovoz živé drůbeže a násadových vajec, a rozhodnutí Komise
    96/659/ES o ochranných opatřeních ohledně krymsko-konžské horečky (oznámeno
    pod číslem K(2001) 3074)
  type: main
- language: da
  script: Latn
  content: '2001/751/EF: Kommissionens beslutning af 16. oktober 2001 om dyresundhedsmæssige
    betingelser og udstedelse af sundhedscertifikat ved import af levende strudsefugle
    og rugeæg deraf fra tredjelande, herunder dyresundhedsforanstaltninger, der skal
    gælde efter importen, om ændring af Kommissionens beslutning 95/233/EF om lister
    over tredjelande, hvorfra medlemsstaterne tillader indførsel af levende fjerkræ
    og rugeæg og om ændring af Kommissionens beslutning 96/659/EF om beskyttelsesforanstaltninger
    mod Krim-Congo hæmoragisk feber (EØS-relevant tekst) (meddelt under nummer K(2001)
    3074)'
  type: main
- language: el
  script: Grek
  content: '2001/751/ΕΚ: Απόφαση της Επιτροπής, της 16ης
    Οκτωβρίου 2001, σχετικά με τον καθορισμό των
    όρων που αφορούν την υγεία των ζώων και των
    κτηνιατρικών πιστοποιητικών για την εισαγωγή
    από τρίτες χώρες ζώντων στρουθιονιδών και
    αυγών στρουθιονιδών προς επώαση, συμπεριλαμβανομένων
    των μέτρων για την υγεία των ζώων που πρέπει
    να εφαρμόζονται μετά την εισαγωγή, σχετικά
    με την τροποποίηση της απόφασης 95/233/ΕΚ της
    Επιτροπής για την κατάρτιση των καταλόγων
    τρίτων χωρών από τις οποίες επιτρέπεται η εισαγωγή
    ζώντων πουλερικών και αυγών επώασης και σχετικά
    με την τροποποίηση της απόφασης 96/659/ΕΚ για
    τα μέτρα προστασίας που αφορούν τον αιμορραγικό
    πυρετό Crimean Congo (Κείμενο που παρουσιάζει ενδιαφέρον
    για τον ΕΟΧ) [κοινοποιηθείσα υπό τον αριθμό
    Ε(2001) 3074]'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 16. oktoober 2001, millega nähakse ette loomatervishoiu
    nõuded ja veterinaarsertifikaadid elusate silerinnaliste lindude ja nende haudemunade
    importimiseks kolmandatest riikidest ning pärast kõnealust importimist kohaldatavad
    loomatervishoiumeetmed; millega muudetakse komisjoni otsust 95/233/EÜ, milles
    esitatakse nende kolmandate riikide loetelu, millest liikmesriigid lubavad importida
    elusaid kodulinde ja haudemune; ja millega muudetakse komisjoni otsust 96/659/EÜ
    kaitsemeetmete kohta seoses Krimmi-Kongo hemorraagilise palavikuga (teatavaks
    tehtud numbri K(2001) 3074 all)
  type: main
- language: fi
  script: Latn
  content: '2001/751/EY: Komission päätös, tehty 16 päivänä lokakuuta 2001,
    eläinten terveyttä koskevista vaatimuksista ja eläinlääkärintodistuksista
    elävien sileälastaisten lintujen ja niiden siitosmunien tuonnissa kolmansista
    maista, mukaan lukien kyseisen tuonnin jälkeiset eläinten terveyttä koskevat
    toimenpiteet, niiden kolmansien maiden luettelosta, joista jäsenvaltiot sallivat
    elävän siipikarjan ja siitosmunien tuonnin, tehdyn päätöksen 95/233/EY muuttamisesta
    ja Krimin/Kongon verenvuotokuumetta koskevista suojatoimenpiteistä tehdyn päätöksen
    96/659/EY muuttamisesta (ETA:n kannalta merkityksellinen teksti) (tiedoksiannettu
    numerolla K(2001) 3074)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2001. október 16.) az élő laposmellű futómadarak
    és azok keltetőtojásainak harmadik országból történő behozatalára vonatkozó
    állat-egészségügyi feltételek és a szükséges állatorvosi bizonyítványok,
    valamint a behozatalt követően elvégzendő állat-egészségügyi intézkedések
    meghatározásáról, a tagállamok által élő baromfi és keltetőtojás behozatalára
    feljogosított harmadik országok jegyzékeinek megállapításáról szóló,
    95/233/EK bizottsági határozat, valamint a krími–kongói haemorrhagiás láz
    elleni védekezési intézkedésekről szóló, 96/659/EK bizottsági határozat
    módosításáról (az értesítés a C(2001) 3074. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2001/751/CE: Decisione della Commissione, del 16 ottobre 2001, relativa
    alle norme di polizia sanitaria e ai certificati veterinari per l''importazione
    dai paesi terzi di ratiti vivi e relative uova da cova, nonché alle misure di
    polizia sanitaria da applicare dopo l''importazione, che modifica la decisione
    95/233/CE che fissa elenchi di paesi terzi da cui gli Stati membri autorizzano
    l''importazione di pollame vivo e uova da cova e che modifica la decisione 96/659/CE
    recante misure di protezione relative alla febbre emorragica del Congo e della
    Crimea (Testo rilevante ai fini del SEE) [notificata con il numero C(2001) 3074]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2001. gada 16. oktobris), ar ko nosaka dzīvnieku veselības
    nosacījumus un veterināro sertifikāciju dzīvu skrējējputnu un to inkubējamo
    olu ievešanai no trešām valstīm, ieskaitot veterināros pasākumus, kuri jāpiemēro
    pēc šādas ievešanas, ar kuru groza Komisijas Lēmumu 95/233/EK, ar ko izveido
    to trešo valstu sarakstu, no kurām dalībvalstīs ir atļauts ievest dzīvus
    mājputnus un inkubējamās olas, un ar kuru groza Komisijas Lēmumu 96/659/EK
    par aizsardzības pasākumiem attiecībā uz Krimas-Kongo hemorāģisko drudzi
    (izziņots ar dokumenta numuru C(2001) 3074)
  type: main
- language: lt
  script: Latn
  content: 2001 m. spalio 16 d. Komisijos sprendimas, nustatantis gyvūnų sveikatos
    reikalavimus ir veterinarinio sertifikavimo reikalavimus importuojant gyvus Ratitae
    genties paukščius ir skirtus perinti jų kiaušinius iš trečiųjų šalių,
    įskaitant importavus taikytinas gyvūnų sveikatos apsaugos priemones, ir iš
    dalies pakeičiantis Komisijos sprendimą 95/233/EB, pateikiantį trečiųjų
    šalių, iš kurių valstybės narės leidžia importuoti naminius paukščius
    ir inkubacinius kiaušinius, sąrašą bei iš dalies keičiantis Komisijos sprendimą
    96/659/EB dėl apsaugos priemonių, taikomų Krymo-Kongo hemoraginei septicemijos
    karštinei (pranešta dokumentu Nr. C(2001) 3074)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-16 ta’ Ottubru 2000 li tistabbilixxi
    l-kondizzjonijiet tas-saħħa ta’ l-animali u ċ-ċertifikazzjoni veterinarji
    għall-importazzjoni tar-ratiti ħajjin u tal-bajd għat-tfaqqis tagħhom ġejjin
    minn pajjiżi terzi li jinkludi l-miżuri tas-saħħa ta’ l-animali li għandhom
    jiġu applikati wara din l-importazzjoni, li Temenda d-Deċiżjoni tal-Kummissjoni
    95/233/KE li tistabbilixxi lista ta’ pajjiżi terżi li minnhom l-Istati Membri
    jistgħu jawtorizzaw l-importazzjoni ta’ tjur ħajjin u ta’ bajd għat-tfaqqis
    u li temenda d-Deċiżjoni tal-Kummissjoni 96/659/KE dwar miżuri protettivi li
    għandhom x’jaqsmu mad-deni tal-emorraġija tal-Krimea u tal-Kongo. (notifikata
    taħt id-dokument nru K (2001) 3074)Test b’rilevanza ŻEE
  type: main
- language: nl
  script: Latn
  content: '2001/751/EG: Beschikking van de Commissie van 16 oktober 2001 houdende
    vaststelling van veterinairrechtelĳke voorschriften en voorschriften inzake veterinaire
    certificering voor de invoer van levende loopvogels en van broedeieren daarvan
    uit derde landen, met inbegrip van de na invoer toe te passen veterinairrechtelĳke
    maatregelen, houdende wĳziging van Beschikking 95/233/EG tot vaststelling van
    lĳsten van derde landen waaruit de lidstaten de invoer van levend pluimvee en
    broedeieren toestaan, en houdende wĳziging van Beschikking 96/659/EG inzake beschermende
    maatregelen in verband met Krim-Kongo hemorragische koorts (Voor de EER relevante
    tekst) (kennisgeving geschied onder nummer C(2001) 3074)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji 2001/751/WE z dnia 16 października 2001 r. ustanawiająca
    wymagania dotyczące zdrowia zwierząt i świadectwa weterynaryjne przy przywozie
    żywych ptaków bezgrzebieniowych i ich jaj wylęgowych z państw trzecich, w
    tym środki zdrowotne stosowane po ich przywozie, zmieniająca decyzję Komisji
    95/233/WE ustalająca wykaz państw trzecich, z których Państwa Członkowskie
    dopuszczają przywóz drobiu i jaj wylęgowych oraz zmieniająca decyzję Komisji
    96/659/WE w sprawie środków ochronnych w odniesieniu do kongijsko-krymskiej
    gorączki krwotocznej (notyfikowana jako dokument nr C(2001) 3074)
  type: main
- language: pt
  script: Latn
  content: '2001/751/CE: Decisão da Comissão, de 16 de Outubro de 2001, que estabelece
    as condições sanitárias e os certificados veterinários para a importação
    de ratites vivas e de ovos para incubação de ratites provenientes de países
    terceiros, incluindo as medidas sanitárias a aplicar após a importação, que
    altera a Decisão 95/233/CE que estabelece listas de países terceiros a partir
    dos quais os Estados-Membros permitem a importação de aves de capoeira e de
    ovos para incubação, e que altera a Decisão 96/659/CE relativa a medidas de
    protecção respeitantes à febre hemorrágica da Crimeia e do Congo (Texto relevante
    para efeitos do EEE) [notificada com o número C(2001) 3074]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 16 octombrie 2001 de stabilire a condițiilor de sănătate
    animală și a certificării veterinare pentru importurile de ratite vii și ouă
    de ratite destinate incubației din țări terțe, inclusiv a măsurilor de sănătate
    animală de aplicat după import, de modificare a Deciziei 95/233/CE a Comisiei
    de stabilire a listei țărilor terțe din care statele membre autorizează importurile
    de păsări de curte vii și de ouă destinate incubației și de modificare a
    Deciziei 96/659/CE a Comisiei privind măsurile de protecție cu privire la febra
    hemoragică de Crimeea – Congo [notificată cu numărul C(2001) 3074]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 16. októbra 2001, ktorým sa ustanovujú podmienky
    týkajúce sa zdravia zvierat a veterinárna certifikácia pre dovozy živých
    vtákov bežcov a ich násadových vajec z tretích krajín, vrátane opatrení
    týkajúcich sa zdravia zvierat, ktoré sa musia uplatňovať po takomto dovoze,
    ktorým sa mení a dopĺňa rozhodnutie Komisie 95/233/ES koncipujúce zoznam
    tretích krajín, z ktorých členské štáty povolia dovozy živej hydiny a
    násadových vajec a ktorým sa mení a dopĺňa rozhodnutie Komisie 96/659/ES
    o ochranných opatreniach vzhľadom na hemoragickú horúčku krymské Kongo (oznámené
    pod číslom dokumentu C(2001) 3074)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 16. oktobra 2001 o pogojih v zvezi z zdravstvenim
    varstvom živali in veterinarskim certificiranjem za uvoz živih ratitov in valilnih
    jajc ratitov iz tretjih držav, vključno z ukrepi za zaščito zdravstvenega
    varstva živali, ki jih je treba izvajati po takšnem uvozu, in o spremembi Odločbe
    Komisije 95/233/ES o sestavi seznama tretjih držav, iz katerih države članice
    odobrijo uvoz žive perutnine in valilnih jajc, ter o spremembi Odločbe Komisije
    96/659/ES o splošnih ukrepih zaščite glede krimsko-kongoške hemoragične mrzlice
    (notificirano pod dokumentarno številko K(2001) 3074)
  type: main
- language: es
  script: Latn
  content: '2001/751/CE: Decisión de la Comisión, de 16 de octubre de 2001, que
    establece las condiciones y los certificados zoosanitarios para la importación
    de terceros países de rátidas vivas y huevos de rátida para incubar, así como
    las medidas zoosanitarias aplicables tras esa importación, y que modifica la
    Decisión 95/233/CE por la que se establecen listas de terceros países a partir
    de los cuales los Estados miembros autorizarán las importaciones de aves de corral
    vivas y de huevos para incubar y la Decisión 96/659/CE sobre las medidas de protección
    contra la fiebre hemorrágica del Congo y de Crimea (Texto pertinente a efectos
    del EEE) [notificada con el número C(2001) 3074]'
  type: main
- language: sv
  script: Latn
  content: '2001/751/EG: Kommissionens beslut av den 16 oktober 2001 om djurhälsovillkor
    och veterinärintyg för import från tredje land av levande strutsfåglar och
    kläckägg, inbegripet djurhälsoåtgärder som skall vidtas efter sådan import,
    om ändring av beslut 95/233/EG om utarbetande av en förteckning över de tredje
    länder från vilka medlemsstaterna medger import av levande fjäderfä och kläckningsägg
    och om ändring av beslut 96/659/EG om skyddsåtgärder mot "Crimean Congo Haemorrhagic
    Fever" (Text av betydelse för EES) [delgivet med nr K(2001) 3074]'
  type: main
