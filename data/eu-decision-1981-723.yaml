    16" non può avvenire in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '81/723/EEG: Beschikking van de Commissie van 21 augustus 1981 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Dionex-Ion Chromatograph, model 16"
    niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief mag
    worden ingevoerd'
  type: main
