title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1292/2007 of 30 October 2007 imposing a definitive
    anti-dumping duty on imports of polyethylene terephthalate (PET) film originating
    in India following an expiry review pursuant to Article 11(2) of Council Regulation
    (EC) No 384/96 and terminating a partial interim review of such imports pursuant
    to Article 11(3) of Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1292/2007 du Conseil du 30 octobre 2007 instituant
    un droit antidumping définitif sur les importations de feuilles en polyéthylène
    téréphtalate (PET) originaires de l’Inde à la suite d’un réexamen du délai
    d’expiration conformément à l’article 11, paragraphe 2, du règlement (CE)
    n° 384/96 du Conseil et mettant un terme au réexamen intermédiaire partiel
    de ces importations conformément à l’article 11, paragraphe 3, du règlement
    (CE) n° 384/96
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1292/2007 des Rates vom 30. Oktober 2007 zur Einführung
