    mit Ursprung in Indien nach einer Überprüfung gemäß Artikel 11 Absatz 2 der
    Verordnung (EG) Nr. 384/96 des Rates und zur Einstellung einer teilweisen Interimsüberprüfung
    dieser Maßnahmen gemäß Artikel 11 Absatz 3 der Verordnung (EG) Nr. 384/96
  type: main
