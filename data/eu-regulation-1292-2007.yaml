    n.° 3 do artigo 11.° do Regulamento (CE) n.° 384/96
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1292/2007 al Consiliului din 30 octombrie 2007 privind
    instituirea unei taxe antidumping definitive la importurile de folii din polietilen
    tereftalat (PET) originare din India, ca urmare a unei reexaminări a măsurilor
    care urmează să expire, în conformitate cu articolul 11 alineatul (2) din Regulamentul
    (CE) nr. 384/96 al Consiliului, și încheierea unei reexaminări intermediare
    parțiale a acestor importuri, în conformitate cu articolul 11 alineatul (3)
    din Regulamentul (CE) nr. 384/96
  type: main
