    med ursprung i Indien, efter en översyn vid giltighetstidens utgång enligt artikel
    11.2 i rådets förordning (EG) nr 384/96 och om avslutande av en partiell interimsöversyn
    av sådan import enligt artikel 11.3 i förordning (EG) nr 384/96
