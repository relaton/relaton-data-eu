    a norma dell’articolo 11, paragrafo 2, del regolamento (CE) n. 384/96 del Consiglio,
    e che conclude il riesame intermedio parziale di tali importazioni a norma dell’articolo
    11, paragrafo 3, del regolamento (CE) n. 384/96
  type: main
- language: lv
  script: Latn
