    (ES) č. 384/96 ukladá konečné antidumpingové clo na dovoz polyetyléntereftalátového
    (PET) filmu s pôvodom v Indii a ukončuje čiastočné predbežné preskúmanie
    takéhoto dovozu podľa článku 11 ods. 3 nariadenia Rady (ES) č. 384/96
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1292/2007 z dne 30. oktobra 2007 o uvedbi dokončne
    protidampinške dajatve na uvoz folije iz polietilen tereftalata (PET) s poreklom
    iz Indije po pregledu zaradi izteka ukrepov v skladu s členom 11(2) Uredbe Sveta
    (ES) št. 384/96 in zaključku delnega vmesnega pregleda v zvezi s takim uvozom
    v skladu s členom 11(3) Uredbe Sveta (ES) št. 384/96
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1292/2007 del Consejo, de 30 de octubre de 2007 , por
    el que se impone un derecho antidumping definitivo a las importaciones de películas
    de tereftalato de polietileno (PET) originarias de la India, tras una reconsideración
    por expiración de conformidad con el artículo 11, apartado 2, del Reglamento
    (CE) n° 384/96, y se da por concluida una reconsideración provisional parcial
    de tales importaciones, de conformidad con el artículo 11, apartado 3, de dicho
    Reglamento
  type: main
