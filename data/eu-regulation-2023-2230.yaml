title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/2230 of 25 October 2023 extending
    the derogation from Council Regulation (EC) No 1967/2006 as regards the minimum
    distance from the coast and depth granted to boat seines fishing for transparent
    goby (Aphia minuta) within the Spanish territorial waters of the Autonomous Community
    of the Region of Murcia
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/2230 de la Commission du 25 octobre
    2023 prolongeant la dérogation au règlement (CE) no 1967/2006 du Conseil en
    ce qui concerne la distance de la côte et la profondeur minimales pour les sennes
    de bateau pêchant le gobie transparent (Aphia minuta) dans les eaux territoriales
    espagnoles de la Communauté autonome de la région de Murcie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/2230 der Kommission vom 25. Oktober
    2023 zur Verlängerung der Ausnahme von der Verordnung (EG) Nr. 1967/2006 des
    Rates hinsichtlich des Mindestabstands von der Küste und der Mindestwassertiefe
    für Glasgrundeln (Aphia minuta) befischende Bootswaden in den spanischen Hoheitsgewässern
    der Autonomen Gemeinschaft Murcia
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/2230 на Комисията
    от 25 октомври 2023 година за удължаване на срока
    на дерогацията от Регламент (ЕО) № 1967/2006 на
    Съвета по отношение на минималното разстояние
    от брега и минималната дълбочина за улов на
    стъкленка (Аphia minuta) с корабни грибове в териториалните
    води на Испания край автономна област Мурсия
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/2230 ze dne 25. října 2023,
    kterým se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud
    jde o minimální vzdálenost od pobřeží a minimální hloubku moře pro lodní
    nevody k lovu hlaváče průsvitného (Aphia minuta) ve španělských teritoriálních
    vodách Autonomní oblasti Regionu Murcie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2023/2230 af 25. oktober 2023
    om forlængelse af den dispensation fra Rådets forordning (EF) nr. 1967/2006
    for så vidt angår mindsteafstanden fra kysten og mindstedybden, der er givet
    med henblik på fiskeri med vod brugt fra fartøjer, der fisker efter glaskutling
    (Aphia minuta) i de spanske territorialfarvande ud for den selvstyrende region
    Murcia
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2023/2230 της Επιτροπής,
    της 25ης Οκτωβρίου 2023, για την παράταση της παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την ελάχιστη απόσταση από την ακτή
    και το ελάχιστο βάθος θάλασσας που οφείλουν
    να τηρούν οι συρόμενοι από σκάφος γρίποι που
    αλιεύουν το είδος γωβιουδάκι άφια (Aphia minuta)
    στα ισπανικά χωρικά ύδατα της αυτόνομης κοινότητας
    της περιφέρειας Μούρθια
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2023/2230, 25. oktoober 2023, millega pikendatakse
    erandit, mis on tehtud nõukogu määrusest (EÜ) nr 1967/2006 seoses Hispaania
    territoriaalvetes Murcia autonoomses piirkonnas väikese plankmudila (Aphia minuta)
    püügil kasutatavate paadinootade lubatud miinimumkaugusega rannikust ja vee
    miinimumsügavusega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2023/2230, annettu 25 päivänä
    lokakuuta 2023, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn, vähimmäisetäisyyttä
    rannikolta ja veden vähimmäissyvyyttä koskevan poikkeuksen jatkamisesta kalastettaessa
    kuultotokkoa (Aphia minuta) alukselta vedettävillä nuotilla Espanjan aluevesillä
    Murcian itsehallintoalueella
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2023/2230 ón gCoimisiún an 25 Deireadh
    Fómhair 2023 lena gcuirtear síneadh leis an maolú ar Rialachán (CE) Uimh.
    1967/2006 ón gComhairle a mhéid a bhaineann leis an bhfad íosta ón gcósta
    agus leis an doimhneacht a dheonaítear do shaighní báid lena ndéantar iascaireacht
    ar an mac siobháin trédhearcach (Aphia minuta) laistigh d’uiscí teorann na
    Spáinne de chuid Phobal Féinrialaitheach Réigiún Murcia
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2023/2230 оd 25. listopada 2023. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu najmanje udaljenosti
    od obale i najmanje dubine koje je dodijeljeno za potegače otvorenog mora koje
    love mliječa ružičnog (Aphia minuta) u španjolskim teritorijalnim vodama Autonomne
    zajednice Murcije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/2230 végrehajtási rendelete (2023. október 25.)
    az 1967/2006/EK tanácsi rendelettől a Murcia régió autonóm közössége spanyol
    felségvizein az üveggéb (Aphia minuta) halászatában alkalmazott, hajóról
    működtetett kerítőhálók parttól számított minimális távolsága és
    telepítésének mélysége tekintetében engedélyezett eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/2230 della Commissione, del 25 ottobre
    2023, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto concerne la distanza minima dalla costa e la profondità minima, concessa
    alle sciabiche da natante utilizzate per la pesca del rossetto (Aphia minuta)
    nelle acque territoriali spagnole della Comunità autonoma della regione di Murcia
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2023/2230 (2023. gada 25. oktobris),
    ar kuru attiecībā uz minimālo attālumu no krasta un minimālo dziļumu, kas
    Spānijas teritoriālajos ūdeņos Mursijas autonomajā apgabalā jāievēro stikla
    jūrasgrunduļa (Aphia minuta) zvejā ar laivas velkamajiem vadiem, pagarina atkāpi
    no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2023 m. spalio 25 d. Komisijos įgyvendinimo reglamentas (ES) 2023/2230,
    kuriuo pratęsiamas nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl minimalaus
    atstumo nuo kranto ir gylio nukrypti leidžiančios nuostatos, suteiktos afijų
    (Aphia minuta) žvejybai laivų traukiamaisiais tinklais Ispanijos Mursijos autonominės
    srities teritoriniuose vandenyse, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/2230 tal-25
    ta’ Ottubru 2023 li jestendi d-deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tad-distanza minima mill-kosta kif ukoll il-fond minimu li jingħataw
    lit-tartaruni li jistadu għall-makku (Aphia minuta) fl-ilmijiet territorjali
    Spanjoli tal-Komunità Awtonoma tar-Reġjun ta’ Murcia
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2023/2230 van de Commissie van 25 oktober 2023
    tot verlenging van de afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft de minimumafstand van de kust en de minimumdiepte voor bootzegens
    voor de visserij op glasgrondel (Aphia minuta) in de Spaanse territoriale wateren
    van de autonome gemeenschap Murcia
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2023/2230 z dnia 25 października
    2023 r. przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006
    w zakresie minimalnych odległości od brzegu i minimalnej głębokości morza
    dla niewodów pełnomorskich do połowu babki przeźroczystej (Aphia minuta) na
    hiszpańskich wodach terytorialnych Wspólnoty Autonomicznej Regionu Murcji
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2023/2230 da Comissão, de 25 de outubro
    de 2023, que prorroga a derrogação ao Regulamento (CE) n.o 1967/2006 do Conselho
    no que respeita à distância mínima da costa e à profundidade mínima concedidas
    para as redes envolventes-arrastantes de alar para bordo utilizadas na pesca do
    caboz-transparente (Aphia minuta) nas águas territoriais espanholas da Comunidade
    Autónoma da Região de Múrcia
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2023/2230 al Comisiei din 25 octombrie
    2023 de prelungire a derogării de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește distanța minimă față de coastă și adâncimea minimă
    pentru năvoadele de navă utilizate pentru pescuitul de guvid alb (Aphia minuta)
    în apele teritoriale spaniole ale Comunității Autonome a Regiunii Murcia
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2023/2230 z 25. októbra 2023, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o minimálnu vzdialenosť od pobrežia a minimálnu hĺbku pridelenú na lov
    afie priesvitnej (Aphia minuta) záťahovými sieťami ovládanými z lode v španielskych
    pobrežných vodách autonómneho spoločenstva Murcia
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2023/2230 z dne 25. oktobra 2023 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede najmanjše oddaljenosti od
    obale in najmanjše morske globine za potegalke odprtega morja, ki lovijo belega
    glavača (Aphia minuta) v španskih teritorialnih vodah avtonomne skupnosti regije
    Murcia
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2023/2230 de la Comisión, de 25 de octubre
    de 2023, por el que se prorroga la excepción a lo dispuesto en el Reglamento
    (CE) n.o 1967/2006 del Consejo en lo concerniente a la distancia mínima de la
    costa y la profundidad mínima permitidas en el caso de las redes de tiro desde
    embarcación para la pesca de chanquete (Aphia minuta) en las aguas territoriales
    españolas de la Comunidad Autónoma de la Región de Murcia
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2023/2230 av den 25 oktober
    2023 om förlängning av undantaget från rådets förordning (EG) nr 1967/2006
    vad gäller minsta avstånd från kusten och minsta djup för fartygsvad/not vid
    fiske efter klarbult (Aphia minuta) i Spaniens territorialvatten i den autonoma
    regionen Murcia
