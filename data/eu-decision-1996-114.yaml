title:
- language: en
  script: Latn
  content: '96/114/EC: Commission Decision of 22 January 1996 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes other than potatoes intended for planting originating
    in the Republic of Slovenia'
  type: main
- language: fr
  script: Latn
  content: '96/114/CE: Décision de la Commission, du 22 janvier 1996, autorisant
    les États membres à prévoir des dérogations à certaines dispositions de la
    directive 77/93/CEE du Conseil pour ce qui concerne les pommes de terre, autres
    que les pommes de terre de semence, originaires de la République de Slovénie'
  type: main
- language: de
  script: Latn
  content: '96/114/EG: Entscheidung der Kommission vom 22. Januar 1996 zur Ermächtigung
    der Mitgliedstaaten, für Kartoffeln/Erdäpfel mit Ursprung in der Republik Slowenien,
    die nicht als Pflanzgut bestimmt sind, Ausnahmen von einigen Vorschriften der
    Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '96/114/EF: Kommissionens beslutning af 22. januar 1996 om bemyndigelse
    af medlemsstaterne til at fastsætte undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for så vidt angår andre kartofler end kartofler til udplantning
    med oprindelse i Republikken Slovenien'
  type: main
- language: el
  script: Grek
  content: '96/114/ΕΚ: Απόφαση της Επιτροπής, της 22ας Ιανουαρίου
    1996, που εξουσιοδοτεί τα κράτη μέλη να προβλέψουν
    εξαιρέσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου όσον αφορά τα γεώμηλα
    άλλα από εκείνα που προορίζονται για φύτευση,
    καταγωγής Δημοκρατίας της Σλοβενίας'
  type: main
- language: fi
  script: Latn
  content: '96/114/EY: Komission päätös, tehty 22 päivänä tammikuuta 1996, jäsenvaltioiden
    oikeuttamisesta sallia poikkeuksia neuvoston direktiivin 77/93/ETY säännöksistä
    Slovenian tasavallasta peräisin olevien muiden kuin istutettaviksi tarkoitettujen
    perunoiden osalta'
  type: main
- language: it
  script: Latn
  content: '96/114/CE: Decisione della Commissione, del 22 gennaio 1996, che autorizza
    gli Stati membri a prevedere deroghe a talune disposizioni della direttiva 77/93/CEE
    del Consiglio per le patate non destinate alla piantagione originarie della Repubblica
    slovena'
  type: main
- language: nl
  script: Latn
  content: '96/114/EG: Beschikking van de Commissie van 22 januari 1996 tot machtiging
    van de Lid-Staten om voor niet voor opplant bestemde aardappelen van oorsprong
    uit de Republiek Slovenië afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '96/114/CE: Decisão da Comissão, de 22 de Janeiro de 1996, que autoriza
    os Estados-membros a prever derrogações de certas disposições da Directiva
    77/93/CEE do Conselho relativamente às batatas, com excepção das destinadas
    à plantação, originárias da República da Eslovénia'
  type: main
- language: es
  script: Latn
  content: '96/114/CE: Decisión de la Comisión, de 22 de enero de 1996, por la que
