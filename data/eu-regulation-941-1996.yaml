title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 941/96 of 28 May 1996 amending Annexes II,
    III, VIII and XI of Council Regulation (EEC) No 3030/93 on common rules for imports
    of certain textile products from third countries and repealing Regulation (EC)
    No 2635/95 introducing prior surveillance of imports of certain textile products
    originating in the United Arab Emirates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 941/96 de la Commission, du 28 mai 1996, modifiant
    les annexes II, III, VIII et XI du règlement (CEE) n° 3030/93 du Conseil relatif
    au régime commun applicable aux importations de certains produits textiles originaires
    des pays tiers et abrogeant le règlement (CE) n° 2635/95 instituant une surveillance
    préalable à l'égard des importations de certains produits textiles originaires
    des Émirats arabes unis
  type: main
