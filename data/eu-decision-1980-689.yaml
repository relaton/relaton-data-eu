id: EUDecision1980689
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/689/EEC: Commission Decision of 26 June 1980 authorizing the French
    Republic not to apply Community treatment to natural honey, falling within heading
    No 04.06 of the Common Customs Tariff, originating in the People''s Republic of
    China, Hungary, Romania, Mexico and Argentina and in free circulation in the other
    Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/689/CEE: Décision de la Commission, du 26 juin 1980, autorisant la
    République française à exclure du traitement communautaire le miel naturel,
    de la position 04.06 du tarif douanier commun, originaire de la République populaire
    de Chine, de Hongrie, de Roumanie, du Mexique et de l''Argentine et mis en libre
    pratique dans les autres États membres (Le texte en langue française est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/689/EWG: Entscheidung der Kommission vom 26. Juni 1980, mit der die
    Französische Republik ermächtigt wird, aus der Volksrepublik China, Ungarn,
    Rumänien, Mexiko und Argentinien stammenden und in den übrigen Mitgliedstaaten
    im freien Verkehr befindlichen natürlichen Honig der Tarifnummer 04.06 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/689/EØF: Kommissionens beslutning af 26. juni 1980 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage naturlig honning,
    som henhører under pos. 04.06 i den fælles toldtarif, har oprindelse i Den kinesiske
    Folkerepublik, Ungarn, Rumænien, Mexico og Argentina og frit kan omsættes i
    de øvrige medlemsstater (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/689/CEE: Decisione della Commissione, del 26 giugno 1980, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario il miele naturale
    della voce 04.06 della tariffa doganale comune, originario della Repubblica popolare
    cinese, dell''Ungheria, della Romania, del Messico e dell''Argentina e messo in
    libera pratica negli altri Stati membri (Il testo in lingua francese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/689/EEG: Beschikking van de Commissie van 26 juni 1980 waarbij de Franse
    Republiek wordt gemachtigd natuurhoning, van post 04.06 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China, Hongarije, Roemenië,
    Mexico en Argentinië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)'
  type: main
