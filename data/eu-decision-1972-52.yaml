title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 novembre 1971, portant octroi du concours
    du FSE au bénéfice du Grand-Duché de Luxembourg pour des dépenses relatives
    à une opération de rééducation professionnelle effectuée par l'Office de
    placement et de rééducation professionnelle des travailleurs handicapés
  type: main
- language: de
  script: Latn
  content: '72/52/EWG: Entscheidung der Kommission vom 22. November 1971 über die
    Gewährung eines Zuschusses aus dem Europäischen Sozialfonds an das Großherzogtum
    Luxemburg zu Aufwendungen für eine vom "Office de placement et de rééducation
    professionnelle des travailleurs handicapés" durchgeführte Maßnahme der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '72/52/CEE: Decisione della Commissione del 22 novembre 1971 che concede
    un contributo del FSE al Granducato del Lussemburgo per spese concernenti un''operazione
    di riqualificazione effettuata dall''Office de placement et de rééducation professionnelle
    des travailleurs handicapés'
  type: main
- language: nl
  script: Latn
  content: '72/52/EEG: Beschikking van de Commissie van 22 november 1971 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds ten gunste van het
    Groothertogdom Luxemburg voor door het "Office de placement et de rééducation
    professionnelle des travailleurs handicapés" gemaakte herscholingskosten'
  type: main
