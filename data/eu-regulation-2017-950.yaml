title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/950 of 2 June 2017 amending
    Implementing Regulation (EU) No 1068/2011 as regards the minimum content of the
    preparation of endo-1,4-beta-xylanase produced by Aspergillus niger (CBS 109.713)
    and endo-1,4-beta-glucanase produced by Aspergillus niger (DSM 18404) as a feed
    additive for chickens reared for laying and all avian species for laying (holder
    of authorisation BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/950 de la Commission du 2 juin 2017
    modifiant le règlement d''exécution (UE) n° 1068/2011 en ce qui concerne la
    teneur minimale de la préparation à base d''endo-1,4-bêta-xylanase produite
    par Aspergillus niger (CBS 109.713) et d''endo-1,4-bêta-glucanase produite par
    Aspergillus niger (DSM 18404) en tant qu''additif destiné à l''alimentation
    des poulettes élevées pour la ponte et de toutes les espèces aviaires destinées
    à la ponte (titulaire de l''autorisation: BASF SE)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2017/950 der Kommission vom 2. Juni 2017
    zur Änderung der Durchführungsverordnung (EU) Nr. 1068/2011 hinsichtlich des
    Mindestgehalts an der Zubereitung aus Endo-1,4-beta-Xylanase, gewonnen aus Aspergillus
    niger (CBS 109.713), und Endo-1,4-beta-Glucanase, gewonnen aus Aspergillus niger
    (DSM 18404), als Zusatzstoff in Futtermitteln für Junghennen und alle Legevögel
    (Zulassungsinhaber: BASF SE)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/950 на Комисията
    от 2 юни 2017 година за изменение на Регламент
    за изпълнение (ЕС) № 1068/2011 по отношение на минималното
    съдържание на препарат от ендо-1,4-бета-ксиланаза,
    получена от Aspergillus niger (CBS 109.713), и ендо-1,4-бета-глюканаза,
    получена от Aspergillus niger (DSM 18404), като фуражна добавка
    за пилета, отглеждани за кокошки носачки, и
    всички видове птици, отглеждани за носачки
    (притежател на разрешителното BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/950 ze dne 2. června 2017, kterým
    se mění prováděcí nařízení (EU) č. 1068/2011, pokud jde o minimální
    obsah přípravku z endo-1,4-beta-xylanázy z Aspergillus niger (CBS 109.713)
    a endo-1,4-beta-glukanázy z Aspergillus niger (DSM 18404) jako doplňkové látky
    pro odchov kuřat a kuřice a snášku všech druhů ptactva (držitel povolení
    BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/950 af 2. juni 2017 om
    ændring af gennemførelsesforordning (EU) nr. 1068/2011 for så vidt angår minimumsindholdet
    af præparatet af endo-1,4-beta-xylanase produceret af Aspergillus niger (CBS
    109.713) og endo-1,4-beta-glucanase produceret af Aspergillus niger (DSM 18404)
    som tilsætningsstof til foder til hønniker og alle fuglearter bestemt til æglægning
    (indehaver af godkendelsen er BASF SE)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2017/950 της Επιτροπής,
