    abil toodetud endo-1,4-β-ksülanaasi ja Aspergillus niger''i (DSM 18404) abil
    toodetud endo-1,4-β-glükanaasi valmistise miinimumsisaldusega selle kasutamisel
    munakanatibude ja kõikide muude munalindude söödalisandina (loa hoidja: BASF
    SE)'
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/950, annettu 2 päivänä
    kesäkuuta 2017, täytäntöönpanoasetuksen (EU) N:o 1068/2011 muuttamisesta
    siltä osin kuin on kyse Aspergillus nigerin (CBS 109.713) tuottamaa endo-1,4-beeta-ksylanaasia
    ja Aspergillus nigerin (DSM 18404) tuottamaa endo-1,4-beeta-glukanaasia sisältävän
    valmisteen vähimmäispitoisuudesta kananuorikoiden ja kaikkien munantuotantoon
    tarkoitettujen lintulajien rehun lisäaineena (hyväksynnän haltija BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2017/950 оd 2. lipnja 2017. o izmjeni
    Provedbene uredbe (EU) br. 1068/2011 u pogledu najmanje količine pripravka endo-1,4-beta-ksilanaze
    dobivenog od Aspergillus niger (CBS 109.713) i endo-1,4-beta-glukanaze dobivenog
    od Aspergillus niger (DSM 18404) kao dodatka hrani za životinje za piliće uzgajane
    za nesenje i sve ptičje vrste za nesenje (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2017/950 végrehajtási rendelete (2017. június 2.)
    az 1068/2011/EU végrehajtási rendeletnek a tojójércék és valamennyi tojó
    madárfaj számára készült takarmány-adalékanyagként felhasznált, az Aspergillus
    niger (CBS 109.713) által termelt endo-1,4-béta-xilanázt és az Aspergillus
    niger (DSM 18404) által termelt endo-1,4-béta-glükanázt tartalmazó készítmény
    minimális tartalma tekintetében történő módosításáról (az engedély
    jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/950 della Commissione, del 2 giugno
    2017, che modifica il regolamento di esecuzione (UE) n. 1068/2011 della Commissione
    per quanto riguarda il tenore minimo del preparato di endo-1,4-beta-xilanasi prodotta
    da Aspergillus niger (CBS 109.713) e di endo-1,4-beta-glucanasi prodotta da Aspergillus
    niger (DSM 18404) come additivo per mangimi destinati a pollastre allevate per
    la produzione di uova e a tutte le specie avicole ovaiole (titolare dell'autorizzazione
    BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/950 (2017. gada 2. jūnijs), ar
    ko Īstenošanas regulu (ES) Nr. 1068/2011 groza attiecībā uz no Aspergillus
    niger (CBS 109.713) iegūtas endo-1,4-beta-ksilanāzes un no Aspergillus niger
    (DSM 18404) iegūtas endo-1,4-beta-glikanāzes preparāta kā barības piedevas
    dējējvistu cāļiem un visu sugu dējējputniem minimālo saturu (atļaujas
    turētājs BASF SE)
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 2 d. Komisijos įgyvendinimo reglamentas (ES) 2017/950,
    kuriuo dėl endo-1,4-beta-ksilanazės, gaunamos iš Aspergillus niger (CBS 109.713),
    ir endo-1,4-beta-gliukanazės, gaunamos iš Aspergillus niger (DSM 18404), preparato,
    naudojamo kaip dedeklinėms vištaitėms ir visų rūšių dedekliniams paukščiams
    skirto pašarų priedo (leidimo turėtojas – bendrovė BASF SE), mažiausio
    kiekio iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr. 1068/2011
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/950 tat-2 ta'
    Ġunju 2017 li jemenda r-Regolament ta' Implimentazzjoni (UE) Nru 1068/2011 fir-rigward
    tal-kontenut minimu tal-preparazzjoni ta' endo-1,4-beta-ksilanażi prodotta minn
    Aspergillus niger (CBS 109.713) u endo-1,4-beta-glukanażi prodotta minn Aspergillus
    niger (DSM 18404) bħala addittiv fl-għalf għal tiġieġ imrobbija għall-bajd
    u għall-ispeċijiet kollha ta' tjur imrobbija għall-bajd (id-detentur tal-awtorizzazzjoni
    BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/950 van de Commissie van 2 juni 2017 tot
