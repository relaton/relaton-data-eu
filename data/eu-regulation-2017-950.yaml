    ao teor mínimo da preparação de endo-1,4-beta-xilanase produzida por Aspergillus
    niger (CBS 109.713) e endo-1,4-beta-glucanase produzida por Aspergillus niger
    (DSM 18404) como aditivo na alimentação de frangas criadas para postura e todas
    as espécies aviárias para postura (detentor da autorização BASF SE)
  type: main
