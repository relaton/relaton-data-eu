    obsah endo-1,4-beta-xylanázy produkovanej hubou Aspergillus niger (CBS 109.713)
    a endo-1,4-beta-glukanázy produkovanej hubou Aspergillus niger (DSM 18404) v
    prípravku ako kŕmnej doplnkovej látky pre kurčatá chované na znášku a
