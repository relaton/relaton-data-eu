    αφορά την ελάχιστη περιεκτικότητα του παρασκευάσματος
    ενδο-1,4-β-ξυλανάσης που παράγεται από Aspergillus
    niger (CBS 109.713) και ενδο-1,4-β-γλυκανάσης που παράγεται
    από Aspergillus niger (DSM 18404) ως πρόσθετης ύλης ζωοτροφών
    για όρνιθες εκτρεφόμενες για ωοπαραγωγή και
    για όλα τα είδη πτηνών για ωοπαραγωγή (κάτοχος
    της άδειας: BASF SE)'
  type: main
- language: et
  script: Latn
