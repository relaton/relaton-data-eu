    în ceea ce privește conținutul minim al preparatului de endo-1,4-beta-xilanază
    produsă de Aspergillus niger (CBS 109.713) și de endo-1,4-beta-glucanază produsă
    de Aspergillus niger (DSM 18404) ca aditiv furajer pentru hrana puicuțelor pentru
    ouat și a tuturor speciilor aviare pentru ouat (titularul autorizației: BASF
    SE)'
  type: main
