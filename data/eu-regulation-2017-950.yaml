    het minimumgehalte van het preparaat van endo-1,4-bèta-xylanase, geproduceerd
    door Aspergillus niger (CBS 109.713), en endo-1,4-bèta-glucanase, geproduceerd
    door Aspergillus niger (DSM 18404), als toevoegingsmiddel voor diervoeding voor
    opfokleghennen en alle vogelsoorten voor legdoeleinden (vergunninghouder BASF
    SE)
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2017/950 z dnia 2 czerwca 2017
    r. zmieniające rozporządzenie wykonawcze Komisji (UE) nr 1068/2011 w odniesieniu
    do minimalnej zawartości preparatu endo-1,4-beta-ksylanazy wytwarzanej przez
    Aspergillus niger (CBS 109.713) i endo-1,4-beta-glukanazy wytwarzanej przez Aspergillus
    niger (DSM 18404) jako dodatku paszowego dla kurcząt odchowywanych na kury nioski
    i wszystkich gatunków ptaków odchowywanych na nioski (posiadacz zezwolenia:
    BASF SE)'
  type: main
