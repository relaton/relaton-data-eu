title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1078/69 de la Commission, du 10 juin 1969, relatif à
    la vente à prix fixé forfaitairement à l'avance de certains produits provenant
    de l'intervention dans le secteur de la viande bovine et détenus par l'organisme
    allemand d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1078/69 der Kommission vom 10. Juni 1969 über den
    Verkauf bestimmter Erzeugnisse, die aus Interventionen auf dem Rindfleischmarkt
    stammen und bei der deutschen Interventionsstelle eingelagert sind, zu einem im
    voraus pauschal festgesetzten Preis
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1078/69 della Commissione, del 10 giugno 1969, relativo
    alla vendita, a un prezzo forfettario fissato in anticipo, di alcuni prodotti
    provenienti dall'intervento nel settore delle carni bovine e in possesso dell'organismo
    d'intervento tedesco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1078/69 van de Commissie van 10 juni 1969 betreffende
    de verkoop voor een vooraf forfaitair vastgestelde prijs van bepaalde produkten
    die afkomstig zijn van interventie in de sector rundvlees en in het bezit zijn
    van het Duitse interventiebureau
  type: main
