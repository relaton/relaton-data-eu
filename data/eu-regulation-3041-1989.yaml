  content: Commission Regulation (EEC) No 3041/89 of 9 October 1989 determining the
    extent to which applications in the beef and veal sector for the issue of import
    licences lodged pursuant to Regulation (EEC) No 2327/89 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3041/89 de la Commission du 9 octobre 1989 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au titre du règlement (CEE) n° 2327/89 dans le secteur
    de la viande bovine
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3041/89 DER KOMMISSION vom 9. Oktober 1989 zur Bestimmung
    des Ausmaßes, in dem den Anträgen auf Erteilung von Einfuhrlizenzen für Rindfleisch
    im Rahmen der Verordnung (EWG) Nr. 2327/89 Rechnung getragen werden kann #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3041/89 af 9. oktober 1989 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicenser i henhold
    til forordning (EØF) nr. 2327/89 for oksekød kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3041/89 της Επιτροπής
    της 9ης Οκτωβρίου 1989 για τον καθορισμό σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που κατατίθενται
    βάσει του κανονισμού (ΕΟΚ) αριθ. 2327/89 στον τομέα
    του βοείου κρέατος
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3041/89 DELLA COMMISSIONE del 9 ottobre 1989 che
