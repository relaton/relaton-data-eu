    на семена от видовете Cedrus libani и Pinus brutia и на
    посадъчен материал, произвеждан от тези семена,
    които не отговарят на изискванията на Директива
    1999/105/ЕО на Съвета (нотифицирано под номер C(2004)
    3138)
  type: main
