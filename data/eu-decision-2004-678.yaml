title:
- language: en
  script: Latn
  content: '2004/678/EC: Commission Decision of 29 September 2004 authorising Member
    States to permit temporarily the marketing of seed of the species Cedrus libani,
    Pinus brutia and planting stock produced from this seed not satisfying the requirements
    of Council Directive 1999/105/EC (notified under document number C(2004) 3138)'
  type: main
- language: fr
  script: Latn
  content: '2004/678/CE: Décision de la Commission du 29 septembre 2004 autorisant
    les États membres à permettre la commercialisation temporaire de semences des
    espèces Cedrus libani et Pinus brutia et de matériel de reproduction issu de
    ces semences, ne satisfaisant pas aux exigences de la directive 1999/105/CE du
    Conseil [notifiée sous le numéro C(2004) 3138]'
  type: main
- language: de
  script: Latn
  content: '2004/678/EG: Entscheidung der Kommission vom 29. September 2004 zur Ermächtigung
    der Mitgliedstaaten, bestimmtes, den Anforderungen der Richtlinie 1999/105/EG
    nicht entsprechendes Saatgut der Arten Cedrus libani, Pinus brutia und daraus
    erzeugtes Pflanzgut vorübergehend zum Verkehr zuzulassen (Bekannt gegeben unter
    Aktenzeichen K(2004) 3138)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 септември 2004
    година за упълномощаване на държавите-членки
