  script: Latn
  content: Regolamento (CE) n. 763/2000 del Consiglio, del 10 aprile 2000, che estende
    il dazio antidumping definitivo istituito con regolamento (CE) n. 584/96 sulle
    importazioni di alcuni accessori per tubi di ferro o di acciaio, originari della
    Repubblica popolare cinese, alle importazioni di alcuni accessori per tubi di
    ferro o di acciaio spediti da Taiwan, indipendentemente dal fatto che siano dichiarati
    originari di Taiwan o meno, e chiude l'inchiesta in merito alle importazioni di
    tre esportatori taiwanesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 763/2000 van de Raad van 10 april 2000 tot uitbreiding
    van het definitief antidumpingrecht dat werd ingesteld bij Verordening (EG) nr.
    584/96 op de invoer van bepaalde hulpstukken voor buisleidingen, van ijzer of
    van staal, van oorsprong uit de Volksrepubliek China tot de invoer van bepaalde
    hulpstukken voor buisleidingen, van ijzer of van staal, verzonden uit Taiwan,
    al dan niet aangegeven als van oorsprong uit Taiwan, en tot beëindiging van het
    onderzoek ten aanzien van de invoer van drie Taiwanese exporteurs
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 763/2000 do Conselho, de 10 de Abril de 2000, que
    torna o direito anti-dumping definitivo instituído pelo Regulamento (CE) n.o
    584/96 sobre as importações de certos acessórios para tubos, de ferro ou aço,
    originários da República Popular da China extensivo às importações de certos
    acessórios para tubos, de ferro ou aço, expedidos via Taiwan, declarados como
    originários de Taiwan ou não, e que encerra o inquérito no que se refere às
    importações provenientes de três exportadores de Taiwan
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 763/2000 del Consejo, de 10 de abril de 2000, por el
    que se amplía el derecho antidumping definitivo impuesto por el Reglamento (CE)
    nº 584/96 sobre las importaciones de determinados accesorios de tubería, de
    hierro o de acero, originarios de la República Popular de China, a las importaciones
    de determinados accesorios de tubería, de hierro o de acero, consignados desde
    Taiwán, tanto si se declaran originarios de Taiwán como si no, y por el que
    se da por concluida la investigación respecto a las importaciones de tres exportadores
    taiwaneses
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 763/2000 av den 10 april 2000 om utvidgning
    av den slutgiltiga antidumpningstull som genom förordning (EG) nr 584/96 införts
    på import av vissa rördelar av järn eller stål med ursprung i Folkrepubliken
    Kina till att avse import av vissa rördelar av järn eller stål som avsänds
    från Taiwan, oavsett om deras deklarerade ursprung är Taiwan eller inte, och
    om avslutande av undersökningen beträffande import av produkter från tre exportörer
    i Taiwan
