title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 763/2000 of 10 April 2000 extending the definitive
    anti-dumping duty, imposed by Regulation (EC) No 584/96 on imports of certain
    tube and pipe fittings, of iron or steel, originating in the People's Republic
    of China to imports of certain tube and pipe fittings, of iron or steel, consigned
    from Taiwan, whether declared as originating in Taiwan or not, and terminating
    the investigation in respect of imports from three Taiwanese exporters
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 763/2000 du Conseil, du 10 avril 2000, portant extension
    du droit antidumping définitif institué par le règlement (CE) nº 584/96 sur
    les importations de certains accessoires de tuyauterie, en fer ou en acier, originaires
    de la République populaire de Chine aux importations de certains accessoires
    de tuyauterie, en fer ou en acier, expédiés de Taïwan, qu'ils aient ou non
    été déclarés originaires de Taïwan, et clôturant l'enquête concernant trois
    exportateurs taïwanais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 763/2000 des Rates vom 10. April 2000 zur Ausweitung
    des mit der Verordnung (EG) Nr. 584/96 auf die Einfuhren bestimmter Rohrformstücke,
    Rohrverschlußstücke und Rohrverbindungsstücke aus Eisen oder Stahl mit Ursprung
    in der Volksrepublik China eingeführten endgültigen Antidumpingzolls auf die
    Einfuhren aus Taiwan versandter bestimmter Rohrformstücke, Rohrverschlußstücke
    und Rohrverbindungsstücke aus Eisen oder Stahl, als Ursprungserzeugnisse Taiwans
    angemeldet oder nicht, und zur Einstellung der Untersuchung gegenüber den Einfuhren
    der Ware von drei taiwanischen Ausführern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 763/2000 af 10. april 2000 om udvidelse af
    den endelige antidumpingtold, der ved forordning (EF) nr. 584/96 indførtes på
    importen af visse rørfittings af jern og stål med oprindelse i Folkerepublikken
    Kina, til også at omfatte importen af visse rørfittings af jern og stål afsendt
    fra Taiwan, uanset om de er angivet med oprindelse i Taiwan, og om afslutning
    af undersøgelsen vedrørende importen fra tre taiwanske eksportører
  type: main
- language: el
  script: Grek
