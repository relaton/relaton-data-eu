---
id: EURegulation20261768
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2026/1768 of the European Parliament and of the Council
    of 14 July 2026 amending Regulation (EU) 2021/2115 as regards a specific type
    of intervention to provide exceptional temporary support under the European Agricultural
    Fund for Rural Development (EAFRD) and the possibility to adapt direct payments
    allocations for calendar year 2027 and Regulation (EU) 2021/2116 as regards more
    flexible rules on payments of advances in response to the increased fertiliser
    prices due to the Middle East crisis
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/1768 du Parlement européen et du Conseil du 14 juillet
    2026 modifiant le règlement (UE) 2021/2115 en ce qui concerne un type spécifique
    d’intervention visant à fournir une aide temporaire exceptionnelle au titre
    du Fonds européen agricole pour le développement rural (Feader) et la possibilité
    d’adapter les dotations destinées aux paiements directs pour l’année civile
    2027, ainsi que le règlement (UE) 2021/2116 en ce qui concerne des règles plus
    flexibles relatives au versement d’avances en réponse à la hausse des prix
    des engrais due à la crise au Moyen-Orient
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/1768 des Europäischen Parlaments und des Rates vom
    14. Juli 2026 zur Änderung der Verordnung (EU) 2021/2115 hinsichtlich einer besonderen
    Interventionskategorie zur Gewährung einer befristeten Sonderunterstützung im
    Rahmen des Europäischen Landwirtschaftsfonds für die Entwicklung des ländlichen
    Raums (ELER) und der Möglichkeit, die Zuweisungen für Direktzahlungen im Kalenderjahr
    2027 anzupassen, sowie zur Änderung der Verordnung (EU) 2021/2116 hinsichtlich
    flexiblerer Vorschriften für Vorschusszahlungen als Reaktion auf die infolge
    der Krise im Nahen Osten gestiegenen Düngemittelpreise
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2026/1768 на Европейския парламент
    и на Съвета от 14 юли 2026 година за изменение
    на Регламент (ЕС) 2021/2115 с оглед на специфичен
    вид интервенция за предоставяне на извънредно
    временно подпомагане по линия на Европейския
    земеделски фонд за развитие на селските райони
    (ЕЗФРСР) и с оглед на възможността за адаптиране
    на разпределените средства за директни плащания
    за календарната 2027 година, както и за изменение
    на Регламент (ЕС) 2021/2116 с оглед на по-гъвкави
    правила за авансовите плащания в отговор на
    увеличението на цените на торовете, предизвикано
    от кризата в Близкия изток
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2026/1768 ze dne 14. července
    2026, kterým se mění nařízení (EU) 2021/2115, pokud jde o zvláštní typ
    intervence pro poskytnutí mimořádné dočasné podpory v rámci Evropského
    zemědělského fondu pro rozvoj venkova (EZFRV) a možnost upravit příděly
    na přímé platby pro kalendářní rok 2027, a nařízení (EU) 2021/2116, pokud
    jde o pružnější pravidla pro vyplácení záloh v reakci na nárůst cen hnojiv
    v důsledku krize na Blízkém východě
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2026/1768 af 14. juli 2026
    om ændring af forordning (EU) 2021/2115 for så vidt angår en særlig interventionstype
    med henblik på at yde ekstraordinær midlertidig støtte fra Den Europæiske
    Landbrugsfond for Udvikling af Landdistrikterne (ELFUL) og muligheden for at justere
    tildelingerne til direkte betalinger for kalenderåret 2027 og om ændring af
    forordning (EU) 2021/2116 for så vidt angår mere fleksible regler om forskudsbetalinger
    som en reaktion på stigningen i gødningspriserne som følge af krisen i Mellemøsten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2026/1768 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 14ης Ιουλίου 2026, για
    την τροποποίηση του κανονισμού (ΕΕ) 2021/2115 όσον
    αφορά συγκεκριμένο είδος παρέμβασης για την
    παροχή έκτακτης προσωρινής στήριξης στο πλαίσιο
    του Ευρωπαϊκού Γεωργικού Ταμείου Αγροτικής
    Ανάπτυξης (ΕΓΤΑΑ) και τη δυνατότητα προσαρμογής
    των κονδυλίων των άμεσων ενισχύσεων το ημερολογιακό
    έτος 2027, καθώς και του κανονισμού (ΕΕ) 2021/2116
    όσον αφορά πιο ευέλικτους κανόνες για τις πληρωμές
    προκαταβολών ως απάντηση στην αύξηση των τιμών
    των λιπασμάτων λόγω της κρίσης στη Μέση Ανατολή
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2026/1768, 14. juuli 2026,
    millega muudetakse määrust (EL) 2021/2115 seoses konkreetsete sekkumisviisidega
    erakorralise ajutise toetuse andmiseks Euroopa Maaelu Arengu Põllumajandusfondist
    (EAFRD) ja võimalusega kohandada otsetoetuste eraldisi 2027. kalendriaastaks
    ning määrust (EL) 2021/2116 seoses paindlikumate normidega ettemaksete tegemiseks,
    et reageerida Lähis-Ida kriisist tingitud väetisehindade tõusule
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2026/1768, annettu 14 päivänä
    heinäkuuta 2026, asetuksen (EU) 2021/2115 muuttamisesta siltä osin kuin on kyse
    erityisestä interventiotyypistä poikkeuksellisen väliaikaisen tuen antamiseksi
    Euroopan maaseudun kehittämisen maatalousrahastosta (maaseuturahasto) ja mahdollisuudesta
    mukauttaa suorien tukien määrärahoja kalenterivuonna 2027 sekä asetuksen (EU)
    2021/2116 muuttamisesta siltä osin kuin on kyse ennakkomaksuja koskevista joustavammista
    säännöistä Lähi-idän kriisin aiheuttaman lannoitteiden hintojen nousun vuoksi
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2026/1768 ó Pharlaimint na hEorpa agus ón gComhairle
    an 14 Iúil 2026 lena leasaítear Rialachán (AE) 2021/2115 a mhéid a bhaineann
    le cineál sonrach idirghabhála chun tacaíocht eisceachtúil shealadach a chur
    ar fáil faoin gCiste Eorpach Talmhaíochta um Fhorbairt Tuaithe (CETFT) agus
    an fhéidearthacht leithdháiltí íocaíochtaí díreacha a oiriúnú don bhliain
    féilire 2027 agus lena leasaítear Rialachán (AE) 2021/2116 a mhéid a bhaineann
    le rialacha níos solúbtha maidir le réamhíocaíochtaí a íoc mar fhreagairt
    ar an méadú ar phraghsanna leasacháin mar gheall ar an ngéarchéim sa Mheánoirthear
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2026/1768 Europskog parlamenta i Vijeća od 14. srpnja 2026.
    o izmjeni Uredbe (EU) 2021/2115 u pogledu posebne vrste intervencije za pružanje
    izvanredne privremene potpore u okviru Europskog poljoprivrednog fonda za ruralni
    razvoj (EPFRR) i mogućnosti prilagodbe dodijeljenih sredstava za izravna plaćanja
    za kalendarsku godinu 2027. te Uredbe (EU) 2021/2116 u pogledu fleksibilnijih
    pravila za isplatu predujmova kao odgovor na povećane cijene gnojiva zbog krize
    na Bliskom istoku
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2026/1768 rendelete (2026. július
    14.) az (EU) 2021/2115 rendeletnek egy az Európai Mezőgazdasági Vidékfejlesztési
    Alapból (EMVA) rendkívüli ideiglenes támogatás nyújtását célzó konkrét
    beavatkozástípus tekintetében, valamint a 2027. naptári évre vonatkozó közvetlen
    kifizetési előirányzatok kiigazításának lehetősége tekintetében, továbbá
    az (EU) 2021/2116 rendeletnek a közel-keleti válság miatt megemelkedett műtrágyaárakra
    válaszul az előlegfizetések teljesítésére vonatkozó szabályok rugalmasabbá
    tétele tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/1768 del Parlamento europeo e del Consiglio, del
    14 luglio 2026, recante modifica del regolamento (UE) 2021/2115 per quanto riguarda
    un tipo specifico di intervento per fornire un sostegno temporaneo eccezionale
    nell’ambito del Fondo europeo agricolo per lo sviluppo rurale (FEASR) e la possibilità
    di adeguare le dotazioni per i pagamenti diretti per l’anno civile 2027 e del
    regolamento (UE) 2021/2116 per quanto riguarda norme più flessibili sui pagamenti
    degli anticipi in risposta all’aumento dei prezzi dei concimi dovuto alla crisi
    in Medio Oriente
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2026/1768 (2026. gada 14. jūlijs),
    ar ko groza Regulu (ES) 2021/2115 attiecībā uz īpaša veida intervenci, kuras
    mērķis ir sniegt ārkārtas pagaidu atbalstu no Eiropas Lauksaimniecības fonda
    lauku attīstībai (ELFLA), un iespēju pielāgot tiešo maksājumu piešķīrumus
    2027. kalendārajam gadam un groza Regulu (ES) 2021/2116 attiecībā uz elastīgākiem
    noteikumiem par avansa maksājumiem, reaģējot uz mēslošanas līdzekļu cenu
    pieaugumu Tuvo Austrumu krīzes dēļ
  type: main
- language: lt
  script: Latn
  content: 2026 m. liepos 14 d. Europos Parlamento ir Tarybos reglamentas (ES) 2026/1768,
    kuriuo dėl konkrečios rūšies intervencinės priemonės, skirtos išimtinei
    laikinai paramai iš Europos žemės ūkio fondo kaimo plėtrai (EŽŪFKP) teikti,
    ir dėl galimybės pritaikyti 2027 kalendorinių metų tiesioginėms išmokoms
    skirtus asignavimus iš dalies keičiamas Reglamentas (ES) 2021/2115 ir dėl lankstesnių
    išankstinio mokėjimo taisyklių reaguojant į dėl Artimųjų Rytų krizės
    išaugusias trąšų kainas iš dalies keičiamas Reglamentas (ES) 2021/2116
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2026/1768 tal-Parlament Ewropew u tal-Kunsill tal-14 ta’
    Lulju 2026 li jemenda r-Regolament (UE) 2021/2115 fir-rigward ta’ tip speċifiku
    ta’ intervent biex jiġi pprovdut appoġġ temporanju eċċezzjonali skont il-Fond
    Agrikolu Ewropew għall-Iżvilupp Rurali (FAEŻR) u l-possibbiltà li jiġu adattati
    l-allokazzjonijiet tal-pagamenti diretti għas-sena kalendarja 2027 u r-Regolament
    (UE) 2021/2116 fir-rigward ta’ regoli aktar flessibbli dwar il-pagamenti bil-quddiem
    b’reazzjoni għaż-żieda fil-prezzijiet tal-fertilizzanti minħabba l-kriżi
    tal-Lvant Nofsani
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/1768 van het Europees Parlement en de Raad van 14
    juli 2026 tot wijziging van Verordening (EU) 2021/2115 wat betreft een specifiek
    interventietype om uitzonderlijke tijdelijke steun te verlenen in het kader van
    het Europees Landbouwfonds voor plattelandsontwikkeling (Elfpo) en de mogelijkheid
    om de toewijzingen voor rechtstreekse betalingen voor het kalenderjaar 2027 aan
    te passen, en van Verordening (EU) 2021/2116 wat betreft flexibelere regels voor
    de betaling van voorschotten in reactie op de gestegen meststoffenprijzen als
    gevolg van de Midden-Oostencrisis
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2026/1768 z dnia 14
    lipca 2026 r. w sprawie zmiany rozporządzenia (UE) 2021/2115 w odniesieniu do
    szczególnego rodzaju interwencji w celu zapewnienia nadzwyczajnego tymczasowego
    wsparcia w ramach Europejskiego Funduszu Rolnego na rzecz Rozwoju Obszarów Wiejskich
    (EFRROW) oraz możliwości dostosowania przydziałów na płatności bezpośrednie
    na rok kalendarzowy 2027, a także zmiany rozporządzenia (UE) 2021/2116 w odniesieniu
    do bardziej elastycznych zasad wypłaty zaliczek w odpowiedzi na wzrost cen nawozów
    spowodowany kryzysem na Bliskim Wschodzie
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2026/1768 do Parlamento Europeu e do Conselho, de 14 de
    julho de 2026, que altera o Regulamento (UE) 2021/2115 no respeitante a um tipo
    específico de intervenção para a concessão de apoio temporário excecional
    no âmbito do Fundo Europeu Agrícola de Desenvolvimento Rural (FEADER) e à possibilidade
    de adaptar as dotações de pagamentos diretos para o ano civil de 2027 e o Regulamento
    (UE) 2021/2116 no respeitante a regras mais flexíveis em matéria de pagamentos
    de adiantamentos em resposta ao aumento dos preços dos adubos devido à crise
    no Médio Oriente
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/1768 al Parlamentului European și al Consiliului
    din 14 iulie 2026 de modificare a Regulamentului (UE) 2021/2115 în ceea ce privește
    un tip specific de intervenție pentru acordarea unui sprijin temporar cu caracter
    excepțional din Fondul european agricol pentru dezvoltare rurală (FEADR) și
    posibilitatea de a adapta alocările pentru plățile directe pentru anul calendaristic
    2027, precum și a Regulamentului (UE) 2021/2116 în ceea ce privește norme mai
    flexibile privind plata avansurilor ca răspuns la creșterea prețurilor îngrășămintelor
    cauzată de criza din Orientul Mijlociu
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2026/1768 zo 14. júla 2026,
    ktorým sa mení nariadenie (EÚ) 2021/2115, pokiaľ ide o osobitný typ intervencie
    na poskytnutie výnimočnej dočasnej podpory v rámci Európskeho poľnohospodárskeho
    fondu pre rozvoj vidieka (EPFRV) a možnosť upraviť alokácie na priame platby
    na kalendárny rok 2027, a nariadenie (EÚ) 2021/2116, pokiaľ ide o flexibilnejšie
    pravidlá vyplácania preddavkov v reakcii na zvýšené ceny hnojív v dôsledku
    krízy na Blízkom východe
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2026/1768 Evropskega parlamenta in Sveta z dne 14. julija 2026
    o spremembi Uredbe (EU) 2021/2115 v zvezi s posebno vrsto intervencije za zagotovitev
    izjemne začasne podpore v okviru Evropskega kmetijskega sklada za razvoj podeželja
    (EKSRP) in možnostjo prilagoditve dodeljenih sredstev za neposredna plačila
    za koledarsko leto 2027 ter Uredbe (EU) 2021/2116 v zvezi s prožnejšimi pravili
    o izplačilih predplačil v odziv na višje cene gnojil zaradi krize na Bližnjem
    vzhodu
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2026/1768 del Parlamento Europeo y del Consejo, de 14 de
    julio de 2026, por el que se modifican el Reglamento (UE) 2021/2115 en lo que
    respecta a un tipo específico de intervención a fin de proporcionar ayuda temporal
    excepcional en el marco del Fondo Europeo Agrícola de Desarrollo Rural (Feader)
    y a la posibilidad de adaptar las asignaciones para pagos directos para el año
    natural 2027 y el Reglamento (UE) 2021/2116 en lo que respecta a normas más flexibles
    sobre el pago de anticipos en respuesta al aumento de los precios de los fertilizantes
    a consecuencia de la crisis de Oriente Próximo
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2026/1768 av den 14 juli
    2026 om ändring av förordning (EU) 2021/2115 vad gäller en särskild interventionstyp
    för att ge exceptionellt tillfälligt stöd inom ramen för Europeiska jordbruksfonden
    för landsbygdsutveckling (Ejflu) och möjligheten att anpassa anslagen för direktstöd
    under kalenderåret 2027 samt förordning (EU) 2021/2116 vad gäller flexiblare
    regler för förskottsutbetalningar till följd av den kraftiga ökningen av priserna
    på gödselmedel på grund av krisen i Mellanöstern
