title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 juillet 1972, autorisant la République
    française à exclure du traitement communautaire les jouets en bois et autres
    (à l'exception des moteurs et mécanismes d'animation pour jouets et modèles
    réduits ainsi que de leurs pièces détachées), des positions 97.03 A et Ex
    B du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/285/EWG: Entscheidung der Kommission vom 18. Juli 1972, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammendes und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches anderes Spielzeug aus Holz (mit
    Ausnahme der Motoren und Bewegungsmechanismen für Spielzeug und Modelle zum Spielen
    sowie deren Ersatzteile), der Tarifnummer 97.03 A und ex B des Gemeinsamen Zolltarifs,
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/285/CEE: Decisione della Commissione, del 18 luglio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i giocattoli di
    legno ed altri (eccetto i motori ed i meccanismi d''animazione per giocattoli
    e modelli ridotti ed i loro pezzi staccati) delle voci n. 97.03 A e ex B della
    tariffa doganale comune, originari di Hong Kong e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/285/EEG: Beschikking van de Commissie van 18 juli 1972 waarbij de Franse
    Republiek wordt gemachtigd speelgoed van hout en andere (met uitzondering van
    motoren en bewegingsmechanismen voor speelgoed en modellen op schaal alsmede hun
    onderdelen) van posten 97.03 A en ex B van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
