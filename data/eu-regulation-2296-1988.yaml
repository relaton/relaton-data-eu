    krenten (basisprodukt) en Moscatel te betalen minimumprijs, alsmede van het bedrag
    van de steun bij de produktie van deze rozijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2296/88 da Comissão de 26 de Julho de 1988 que
