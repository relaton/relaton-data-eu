title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2296/88 of 26 July 1988 fixing for the 1988/89
    marketing year the minimum price to be paid to producers for unprocessed sultanas,
    currants and 'Moscatel' and the amount of production aid for dried grapes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2296/88 de la Commission du 26 juillet 1988 fixant,
    pour la campagne de commercialisation 1988/1989, le prix minimal à payer aux
    producteurs pour les sultanines, les raisins secs de Corinthe et les variétés
    Moscatel non transformés, ainsi que le montant de l' aide à la production pour
    ces raisins secs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2296/88 der Kommission vom 26. Juli 1988 zur Festsetzung
    des den Erzeugern unverarbeiteter Sultaninen, Korinthen und Moscatel zu zahlenden
    Mindestpreises sowie der Produktionsbeihilfe für diese getrockneten Korinthen
    im Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2296/88 af 26. juli 1988 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede sultanas,
    korender og muskateller, samt af producentstøtten for disse tørrede druer i
    produktionsåret 1988/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2296/88 της Επιτροπής
    της 26ης Ιουλίου 1988 που καθορίζει, για την περίοδο
    εμπορίας 1988/89, την ελάχιστη τιμή που καταβάλλεται
    στους παραγωγούς για μη μεταποιημένες σουλτανίνες,
    κορινθιακές σταφίδες και σταφίδες Moscatel, καθώς
    και το ποσό της ενίσχυσης στην παραγωγή για
    τις σταφίδες
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2296/88 della Commissione del 26 luglio 1988 che fissa,
    per la campagna di commercializzazione 1988/1989, il prezzo minimo da pagare ai
    produttori di uva sultanina, di uva secca di Corinto e di Moscatel non trasformate
    e l' importo dell' aiuto alla produzione per le dette uve
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2296/88 van de Commissie van 26 juli 1988 tot vaststelling,
