title:
- language: en
  script: Latn
  content: Commission Decision of 4 June 1976 specifying the extent to which applications
    for import licences lodged from 24 to 28 May 1976 for young bovine animals of
    highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '76/533/CEE: Décision de la Commission, du 4 juin 1976, déterminant dans
    quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées du 24 au 28 mai 1976 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Juni 1976 darüber, inwieweit den vom
    24. bis 28. Mai 1976 gestellten Anträgen auf Einfuhrlizenzen stattgegeben werden
    kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. juni 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i perioden fra den 24. til 28.
    maj 1976 for ungkvæg af alpine racer, bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 giugno 1976, che determina in quale
    misura può essere dato seguito alle domande di titoli d'importazione, presentate
    dal 24 al 28 maggio 1976, per giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 juni 1976 tot vaststelling van de mate
    waarin van 24 tot en met 28 mei 1976 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mestrunderen van Alpenrassen kunnen worden ingewilligd
  type: main
