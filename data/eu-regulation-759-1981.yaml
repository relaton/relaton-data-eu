title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 759/81 of 24 March 1981 re-establishing
    the levying of customs duties on handkerchiefs, products of category 89 (code
    0890), originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 759/81 de la Commission, du 24 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux mouchoirs
    et pochettes, de la catégorie de produits n° 89 (code 0890), originaires de
    Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 759/81 der Kommission vom 24. März 1981 über die
    Wiedereinführung des Zollsatzes für Taschentücher der Warenkategorie Nr. 89
    (Kennziffer 0890), mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr.
    3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 759/81 af 24. marts 1981 om genindførelse
    af opkrævning af toldafgifter for lommetørklæder, under kategori 89 (kode 0890),
    som har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 759/81 τής Επιτροπής
    τής 24ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά ρινόμακτρα
    καί μανδηλάκια θυλακίου, τών προϊόντων τής
    κατηγορίας 89 (κώδικας 0890), καταγωγής Ταϋλάνδης,
    δικαιούχων τών προβλεπομένων στόν κανονισμό
    (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 759/81 della Commissione, del 24 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili ai fazzoletti da naso e da taschino
    della categoria di prodotti n. 89 (codice 0890), originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 759/81 van de Commissie van 24 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op zakdoeken
    van de categorie van produkten nr. 89 (codenummer 0890), van oorsprong uit Thailand,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3320/80 van de Raad
  type: main
