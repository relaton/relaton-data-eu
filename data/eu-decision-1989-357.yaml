title:
- language: en
  script: Latn
  content: '89/357/EEC: Commission Decision of 22 May 1989 amending the Seventh Council
    Decision 85/355/EEC on the equivalence of field inspections carried out in third
    countries on seed-producing crops and the Seventh Council Decision 85/356/EEC
    on the equivalence of seed produced in third countries'
  type: main
- language: fr
  script: Latn
  content: '89/357/CEE: Décision de la Commission du 22 mai 1989 modifiant la septième
    décision 85/355/CEE du Conseil concernant l''équivalence des inspections sur
    pied des cultures productrices de semences effectuées dans des pays tiers, ainsi
    que la septième décision 85/356/CEE du Conseil concernant l''équivalence des
    semences produites dans des pays tiers'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 22. Mai 1989 zur Änderung der siebenten
    Entscheidung 85/355/EWG des Rates über die Gleichstellung von Feldbesichtigungen
    von Saatgutvermehrungsbeständen und der siebenten Entscheidung 85/356/EWG des
    Rates über die Gleichstellung von in dritten Ländern erzeugtem Saatgut (89/357/EWG)
    (89/357/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 22. maj 1989 om ændring af Rådets syvende
    beslutning 85/355/EØF om ligestilling af markinspektioner af arealer til formering
    af udsæd i tredjelande og af Rådets syvende beslutning 85/356/EØF om ligestilling
    af frø produceret i tredjelande (89/357/EØF) (89/357/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/357/EOK: Απόφαση της Επιτροπής της 22ας Μαΐου
    1989 για την τροποποίηση της έβδομης απόφασης
    85/355/ΕΟΚ του Συμβουλίου σχετικά με την ισοδυναμία
    των καλλιεργητικών ελέγχων των σπoροπαραγωγικών
    καλλιεργειών που διενεργούνται στις τρίτες
    χώρες, καθώς και της έβδομης απόφασης 85/357/ΕΟΚ
    του Συμβουλίου σχετικά με την ισοδυναμία των
    σπόρων προς σπορά που παράγονται σε τρίτες
    χώρες'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 22 maggio 1989 che modifica la settima
    decisione 85/355/CEE del Consiglio relativa all'' equivalenza delle ispezioni
    in campo delle colture di sementi effettuate in paesi terzi, nonché la settima
    decisione 85/356/CEE del Consiglio relativa all'' equivalenza delle sementi prodotte
    in paesi terzi (89/357/CEE) (89/357/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 22 mei 1989 tot wijziging van de Zevende
    Beschikking 85/355/EEG van de Raad betreffende de gelijkstelling van in derde
    landen verrichte veldkeuringen van gewassen voor de teelt van zaaizaad en van
    de Zevende Beschikking 85/356/EEG van de Raad betreffende de gelijkstelling van
    in derde landen voortgebracht zaaizaad (89/357/EEG) (89/357/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 22 de Maio de 1989 que altera a sétima Decisao
