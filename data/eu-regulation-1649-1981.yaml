    nel settore dei prodotti trasformati a base di ortofrutticoli e nel settore vitivinicolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1649/81 van de Commissie van 19 juni 1981 tot vaststelling
    van het prijsverschil voor witte suiker dat wordt toegepast bij de berekening
    van de heffing in de sector van op basis van groenten en fruit verwerkte produkten
    en in de wijnsector
