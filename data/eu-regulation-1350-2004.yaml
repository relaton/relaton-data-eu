    krav a jalovic určitých horských plemen, podaným v souladu s nařízením
    (ES) č. 1143/98
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1350/2004 af 23. juli 2004 om fastsættelse
