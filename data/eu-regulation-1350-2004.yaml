    van koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1350/2004 z dnia 23 lipca 2004 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie uprawnień na przywóz
    krów i jałówek niektórych ras górskich, składane z tytułu rozporządzenia
    (WE) nr 1143/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1350/2004 da Comissão, de 23 de Julho de 2004, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
