id: EURegulation13352004
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1335/2004 of 20 July 2004 determining to
    what extent import right applications submitted during the month of July 2004
    for calves weighing not more than 80 kg as part of a tariff quota provided for
    in Regulation (EC) No 1201/2004 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1335/2004 de la Commission du 20 juillet 2004 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites au mois de juillet 2004 pour les veaux n'excédant pas 80 kilogrammes
    dans le cadre d'un contingent tarifaire prévu par le règlement (CE) n° 1201/2004
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1335/2004 der Kommission vom 20. Juli 2004 zur Festsetzung
    des Umfangs, in dem die im Juli 2004 eingereichten Anträge auf Einfuhrlizenzen
    für Kälber mit einem Stückgewicht bis 80 kg im Rahmen eines Zollkontingents
    gemäß der Verordnung (EG) Nr. 1201/2004 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1335/2004 ze dne 20. července 2004, kterým
    se stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních licencí
    na měsíc červenec 2004 telat o hmotnosti nejvýše 80 kg, podaným v rámci
    celní kvóty dle nařízení (ES) č. 1201/2004
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1335/2004 af 20. juli 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicencer for kalve
    på højst 80 kg i forbindelse med et toldkontingent, der er fastsat i forordning
    (EF) nr. 1201/2004
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1335/2004 της Eπιτροπής,
    της 20ής Ιουλίου 2004, για τον καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Ιούλιο του 2004 για μόσχους βάρους
    το πολύ 80 χιλιογράμμων, στο πλαίσιο μιας δασμολογικής
    ποσόστωσης η οποία προβλέπεται από τον κανονισμό
    (ΕΚ) αριθ. 1201/2004
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1335/2004, 20. juuli 2004, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordilitsentside taotlusi juulis,
    mis on esitatud kuni 80 kilogrammiste vasikate kohta määrusega (EÜ) 1201/2004
    ette nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1335/2004, annettu 20 päivänä heinäkuuta
    2004, enintään 80 kg painavia vasikoita koskevien heinäkuussa 2004 jätettyjen
    tuontitodistushakemusten hyväksyttävyydestä asetuksessa (EY) N:o 1201/2004
    määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1335/2004/EK rendelete (2004. július 20.) annak meghatározásáról,
    hogy milyen mértékben lehet helyt adni az 1201/2004/EK rendeletben szabályozott
    vámkontingens keretében, a 80 kilogrammnál nem nagyobb tömegű borjakra vonatkozóan
    2004 júliusában benyújtott importtanúsítvány iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1335/2004 della Commissione, del 20 luglio 2004, che
    stabilisce in che misura possono essere accolte le domande di certificati di importazione
    presentate nel mese di luglio 2004 per i vitelli di peso pari o inferiore a 80
    chilogrammi nel quadro del contingente tariffario previsto dal regolamento (CE)
    n. 1201/2004
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1335/2004 (2004. gada 20. jūlijs), ar ko nosaka,
    cik lielā mērā var pieņemt importa tiesību ievešanas atļauju saņemšanai,
    kuras iesniegtas 2004. gada jūlijā attiecībā uz teļiem, kā svars ir līdz
    80 kg, tarifa kvotas ietvaros, kura paredzēta Regulā (EK) Nr. 1201/2004
  type: main
- language: lt
  script: Latn
  content: 2004 m. liepos 20 d. Komisijos reglamentas (EB) Nr. 1335/2004, nustatantis,
    kokia dalimi galima patenkinti veršelių, kurių svoris yra ne daugiau kaip 80
    kilogramų, importo liceneijoms gauti 2004 m. liepos mėn., pateiktas remiantis
    tarifine kvota, nustatyta Reglamente (EB) Nr. 1201/2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1335/2004 van de Commissie van 20 juli 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen voor invoercertificaten
    voor kalveren met een gewicht van niet meer dan 80 kg, die in juli 2004 zijn ingediend
    op grond van een bij Verordening (EG) nr. 1201/2004 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1335/2004 z dnia 20 lipca 2004 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o wydanie pozwoleń na przywóz
    w miesiącu lipcu 2004 r. cielaków o wadze nieprzekraczającej 80 kg w ramach
    kontyngentu taryfowego przewidzianego w rozporządzeniu (WE) nr 1201/2004
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1335/2004 da Comissão, de 20 de Julho de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina, de peso não superior a 80 quilogramas, apresentados
    no mês de Julho de 2004 ao abrigo de um contingente pautal previsto pelo Regulamento
    (CE) n.° 1201/2004
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1335/2004 z 20. júla 2004, ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií na
    mesiac júl 2004 na teľatá s maximálnou hmotnosťou 80 kg v rámci colnej kvóty
    ustanovenej v nariadení (ES) č. 1201/2004
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1335/2004 z dne 20. julija 2004 o določitvi,
    v kakšnem obsegu se lahko sprejmejo zahtevki za uvozna dovoljenja, vloženi v
    mesecu juliju 2004 za teleta s težo do 80 kg, v okviru tarifne kvote, predvidene
    z Uredbo (ES) št. 1201/2004
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1335/2004 de la Comisión, de 20 de julio de 2004,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    certificados de importación en el mes de julio de 2004 de terneros de peso no
    superior a 80 kilogramos, presentadas dentro de un contingente arancelario establecido
    en el Reglamento (CE) n° 1201/2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1335/2004 av den 20 juli 2004 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under juli 2004 för kalvar
    med en vikt på högst 80 kg inom ramen för den avgiftskvot som fastställts
    i förordning (EG) nr 1201/2004 kan beviljas
  type: main
