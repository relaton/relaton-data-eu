  content: Commission Implementing Regulation (EU) 2023/2090 of 28 September 2023
    laying down rules for the application of Regulation (EU) 2023/1231 of the European
    Parliament and of the Council as regards the content and the model form of the
    plant health label for plants for planting other than seed potatoes, and for machinery
    and vehicles which have been operated for agricultural or forestry purposes, entering
    into Northern Ireland from other parts of the United Kingdom, for placing on the
    market
  type: main
