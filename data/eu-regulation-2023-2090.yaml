    2023 portant modalités d’application du règlement (UE) 2023/1231 du Parlement
    européen et du Conseil en ce qui concerne le contenu et le modèle d’étiquette
    phytosanitaire pour les végétaux destinés à la plantation autres que les plants
    de pommes de terre, ainsi que pour les machines et les véhicules qui ont été
    exploités à des fins agricoles ou forestières et entrant en Irlande du Nord
    à partir d’autres parties du Royaume-Uni, en vue de leur mise sur le marché
