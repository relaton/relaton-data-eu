    της είσπραξης των κανονικών τελωνειακών δασμών
    που εφαρμόζονται σε ορισμένους σωλήνες κάθε
    είδους και είδη με καθορισμένη μορφή κοίλα,
    από σίδηρο ή χάλυβα, καταγωγής των Δημοκρατιών
    της Βοσνίας-Ερζεγοβίνης και της Κροατίας, δικαιούχες
    μιας δασμολογικής οροφής που προβλέπεται από
