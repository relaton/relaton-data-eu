title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2014/98 of 22 September 1998 re-introducing
    normal customs duties on certain tubes, pipes and hollow profiles of iron or steel
    originating in the Republics of Bosnia-Herzegovina and Croatia, for which a tariff
    ceiling was opened by Council Regulation (EC) No 70/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2014/98 de la Commission du 22 septembre 1998 portant
    rétablissement de la perception des droits de douane normaux applicables à certains
    tubes, tuyaux et profilés creux, en fer ou en acier originaires des Républiques
    de Bosnie-Herzégovine et de Croatie, pour lesquels un plafond tarifaire a été
    ouvert par le règlement (CE) nº 70/97 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2014/98 der Kommission vom 22. September 1998 zur Wiedererhebung
    der Regelzölle für bestimmte Rohre und Hohlprofile aus Eisen oder Stahl mit
    Ursprung in den Republiken Bosnien-Herzegowina und Kroatien, denen gemäß der
    Verordnung (EG) Nr. 70/97 des Rates ein Zollplafond gewährt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2014/98 af 22. september 1998 om genindførelse
    af opkrævning af normal told for visse rør og hule profiler af jern og stål
    med oprindelse i Republikken Bosnien-Hercegovina og Republikken Kroatien, for
    hvilke der er indført et toldloft ved Rådets forordning (EF) nr. 70/97
  type: main
- language: el
  script: Grek
