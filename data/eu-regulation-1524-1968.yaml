title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1524/68 de la Commission, du 30 septembre 1968, diminuant
    le montant compensatoire à l'importation des huiles de tournesol, originaires
    ou en provenance de Bulgarie, de Roumanie, de Hongrie, de Yougoslavie et de l'U.R.S.S.
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1524/68 der Kommission vom 30. September 1968 zur
    Herabsetzung des Betrages der Ausgleichsabgabe, der bei der Einfuhr von Sonnenblumenöl
    aus Bulgarien, Rumänien, Ungarn, Jugoslawien und der UdSSR zu erheben ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1524/68 della Commissione, del 30 settembre 1968,
    che diminuisce l'ammontare di compensazione all'importazione di oli di semi di
    girasole originari o in provenienza dalla Bulgaria, dalla Romania, dall'Ungheria,
    dalla Jugoslavia e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1524/68 van de Commissie van 30 september 1968 houdende
    vermindering van het compenserende bedrag bij de invoer van zonnebloemolie van
    oorsprong of van herkomst uit Bulgarije, Roemenië, Hongarije, Joegoslavië en
    de U.S.S.R
  type: main
