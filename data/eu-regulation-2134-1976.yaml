title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2134/76 of 30 August 1976 amending for the
    third time Regulation (EEC) No 2115/75 by postponing until 31 August 1976 the
    final date for the delivery of alcohol obtained from the compulsory distillation
    of the by-products of wine-making
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2134/76 de la Commission, du 30 août 1976, modifiant
    pour la troisième fois le règlement (CEE) n° 2115/75 en prorogeant, jusqu'au
    31 août 1976, le délai pour la livraison de l'alcool obtenu au titre de la distillation
    obligatoire des sous-produits de la vinification
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2134/76 der Kommission vom 30. August 1976 zur dritten
    Änderung der Verordnung (EWG) Nr. 2115/75 und zur Verlängerung der Frist für
    die Ablieferung des aus der vorgeschriebenen Destillierung von Nebenerzeugnissen
    der Weinbereitung gewonnenen Alkohols bis 31. August 1976
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2134/76 af 30. august 1976 om tredje
    ændring af forordning (EØF) nr. 2115/75 ved forlængelse af fristen for levering
    af alkohol, der udvindes ved obligatorisk destillering af biprodukter fra vinfremstilling,
    indtil 31. august 1976
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2134/76 della Commissione, del 30 agosto 1976, recante
    terza modifica del regolamento (CEE) n. 2115/75 prorogando fino al 31 agosto 1976
    il termine di consegna dell'alcole ottenuto a titolo della distillazione obbligatoria
    dei sottoprodotti della vinificazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2134/76 van de Commissie van 30 augustus 1976 houdende
    derde wijziging van Verordening (EEG) nr. 2115/75 door de verlenging tot 31 augustus
    1976 van de termijn voor de levering van de alcohol verkregen bij de verplichte
    distillatie van de bijprodukten van de wijnbereiding
  type: main
