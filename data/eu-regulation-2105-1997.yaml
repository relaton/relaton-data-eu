title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2105/97 of 24 October 1997 determining to
    what extent applications for the right to import for cows and heifers of certain
    mountain breeds lodged under Regulation (EC) No 1940/97 can be met
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2105/97 DE LA COMMISSION du 24 octobre 1997 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits à l'importation
    déposées au titre du règlement (CE) n° 1940/97 relatif à l'importation de
    vaches et génisses de certaines races de montagne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2105/97 DER KOMMISSION vom 24. Oktober 1997 zur Bestimmung
    des Umfangs, in dem den Anträgen auf Einfuhrrechte für Kühe und Färsen bestimmter
    Höhenrassen gemäß der Verordnung (EG) Nr. 1940/97 stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2105/97 af 24. oktober 1997 om fastsættelse
    af, i hvilken udstrækning ansøgninger om importrettigheder for køer og kvier
    af bestemte bjergracer i henhold til forordning (EF) nr. 1940/97 kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2105/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Οκτωβρίου 1997 για να καθορισθεί σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    εκδόσεως πιστοποιητικών εισαγωγής που υποβάλλονται
    βάσει του κανονισμού (ΕΚ) αριθ. 1940/97 όσον αφορά
    την εισαγωγή αγελάδων και δαμάλεων ορισμένων
    ορεσίβιων φυλών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2105/97, annettu 24 päivänä lokakuuta 1997,
    asetuksen (EY) N:o 1940/97 mukaisesti jätettyjen tiettyihin vuoristorotuihin
    kuuluvia lehmiä ja hiehoja koskevien tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2105/97 DELLA COMMISSIONE del 24 ottobre 1997 che stabilisce
    in che misura possono essere accolte le domande di titoli di importazione presentate
    nel quadro del regolamento (CE) n. 1940/97 relativo all'importazione di vacche
    e giovenche di alcune razze di montagna
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2105/97 VAN DE COMMISSIE van 24 oktober 1997 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de ingediende aanvragen voor
    invoerrechten op grond van Verordening (EG) nr. 1940/97 betreffende de invoer
    van koeien en vaarzen van bepaalde bergrassen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2105/97 DA COMISSÃO de 24 de Outubro de 1997 que
