title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2117/68 du Conseil, du 20 décembre 1968, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de ferro-chrome contenant en poids 0,10 % ou moins de carbone et plus de 30 %
    jusqu'à 90 % inclus de chrome (ferro-chrome surrafiné) de la position EX 73.02
    E I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2117/68 des Rates vom 20. Dezember 1968 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und
    an Chrom von mehr als 30, doch nicht mehr als 90 Gewichtshundertteilen (hochraffiniertes
    Ferrochrom) der Tarifnummer ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2117/68 del Consiglio, del 20 dicembre 1968, relativo
    all'apertura, alla suddivisione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e da oltre il 30 % sino al 90 % incluso, di cromo (ferro-cromo superraffinato)
    della voce ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2117/68 van de Raad van 20 december 1968 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van post ex 73.02 E I van het gemeenschappelijk douanetarief
  type: main
