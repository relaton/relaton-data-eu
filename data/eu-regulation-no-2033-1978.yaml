title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2033/78 of 25 August 1978 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 and originating in
    Thailand, to which the preferential tariff arrangements set out in Regulation
    (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2033/78 de la Commission, du 25 août 1978, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastiqué ni caoutchoutée, de la position tarifaire 60.02,
    originaire de Thaïlande, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2033/78 der Kommission vom 25. August 1978 über die
    Wiedereinführung des Zollsatzes für Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02, mit Ursprung in Thailand, dem die in
    der Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2033/78 af 25. august 1978 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastik eller gummeret, under position 60.02, som har oprindelse i Thailand og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2033/78 della Commissione, del 25 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia non
    elastica né gommata, della voce doganale 60.02, originari della Tailandia beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2033/78 van de Commissie van 25 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit Thailand waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 1197/78 van de Raad
  type: main
