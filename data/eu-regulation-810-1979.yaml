    concentrés de tomates et les pruneaux et au prix minimal fixé pour les prunes
    d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 810/79 der Kommission vom 25. April 1979 zur Festsetzung
