title:
- language: en
  script: Latn
  content: '80/984/EEC: Commission Decision of 2 October 1980 laying down the methods
    of control for maintaining the officially tuberculosis free status of bovine herds
    in Denmark (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/984/CEE: Décision de la Commission, du 2 octobre 1980, établissant
    les méthodes de contrôle en vue du maintien du statut de troupeau officiellement
    indemne de tuberculose au Danemark (Le texte en langue danoise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/984/EWG: Entscheidung der Kommission vom 2. Oktober 1980 über Kontrollmethoden
    zur Aufrechterhaltung des amtlich anerkannt tuberkulosefreien Status der Rinderbestände
    in Dänemark (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/984/EØF: Kommissionens beslutning af 2. oktober 1980 om fastsættelse
    af kontrolbestemmelser med henblik på at bevare danske kvægbesætningers status
    som værende officielt fri for tuberkulose (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/984/ΕΟΚ : Απόφαση της Επιτροπής, της 2ας
    Οκτωβρίου 1980, περί καθορισμού των μεθόδων ελέγχου
    ενόψη της διατήρησης του ζωικού πληθυσμού
    που έχει χαρακτηρισθεί επίσημα ως απηλλαγμένος
    φυματίωσης στην Δανία (Το κείμενο στη δανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '80/984/CEE: Decisione della Commissione, del 2 ottobre 1980, che stabilisce
    i metodi di controllo per accertare se gli allevamenti bovini in Danimarca possono
    conservare la qualifica «ufficialmente indenni da tubercolosi» (Il testo in
    lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/984/EEG: Beschikking van de Commissie van 2 oktober 1980 tot vaststelling
    van een controleregeling om de Deense rundveebeslagen verder als officieel tuberculosevrij
    te kunnen erkennen (Slechts de tekst in de Deense taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '80/984/CEE: Decisión de la Comisión, de 2 octubre de 1980, por la que
