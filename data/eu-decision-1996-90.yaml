  script: Latn
  content: '96/90/EC: Council Decision of 22 January 1996 extending the period of
    application of Decision 82/530/EEC authorizing the United Kingdom to permit the
    Isle of Man authorities to apply a system of special import licences to sheepmeat
    and beef and veal'
  type: main
- language: fr
  script: Latn
