title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 2 septembre 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves de
    haricots verts de la position Ex 20.02 du Tarif douanier commun, originaires des
    États-Unis et mises en libre pratique dans les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '70/434/EWG: Entscheidung der Kommission vom 2. September 1970, mit der
    die Bundesrepublik Deutschland ermächtigt wird, die aus den USA stammenden und
    in den Beneluxländern im freien Verkehr befindlichen Konserven von grünen Bohnen
    der Tarifnummer ex 20.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/434/CEE: Decisione della Commissione, del 2 settembre 1970, che autorizza
    la Repubblica federale tedesca ad escludere dal trattamento comunitario le conserve
    di fagiolini della voce ex 20.02 della tariffa doganale comune, originarie degli
    Stati Uniti d''America e messe in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/434/EEG: Beschikking van de Commissie van 2 september 1970 waarbij
    de Bondsrepubliek Duitsland wordt gemachtigd conserven van sla-, spek-, pronk-
    en snijbonen van post ex 20.02 van het gemeenschappelijk douanetarief, van oorsprong
    uit de U.S.A. en in de Benelux-landen in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
