title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 1er décembre 1971, autorisant la République
    française à exclure du traitement communautaire les préparations et conserves
    de baies sylvestres et pulpes de fruits rouges, des positions Ex 08.10, 08.11
    Ex D, 20.06 B II Ex A) 7, 20.06 B II Ex C) 1 CC) du Tarif douanier commun, originaires
    de Roumanie et mises en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/12/EWG: Entscheidung der Kommission vom 1. Dezember 1971, mit der die
    Französische Republik ermächtigt wird, aus Rumänien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Zubereitungen und Konserven von
    Waldbeeren und Fruchtfleisch von roten Früchten der Tarifnummern ex 08.10, 08.11
    ex D, 20.06 B II ex a) 7 und ex c) 1 cc) des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/12/CEE: Decisione della Commissione, del 1 dicembre 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario le preparazioni
    e conserve di bacche silvestri o di polpa di frutti rossi, delle voci nn. ex 08.10,
    08.11 ex D, 20.06 B II ex a) 7 e ex c) 1 cc) della tariffa doganale comune, originarie
    della Romania e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/12/EEG: Beschikking van de Commissie van 1 december 1971 waarbij de
    Franse Republiek wordt gemachtigd bereidingen en conserven van bosbessen en pulp
    van klein fruit, van de posten ex 08.10, 08.11 ex D, 20.06 B II ex a) 7 en ex
    c) 1 cc) van het gemeenschappelijk douanetarief, van oorsprong uit Roemenië en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
