  content: Commission Regulation (EEC) No 1013/86 of 8 April 1986 amending Regulation
    (EEC) No 1677/85 as regards the fixing of the correcting factor to be used to
    calculate the monetary compensatory amounts applicable for certain agricultural
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1013/86 de la Commission du 8 avril 1986 portant modification
    du règlement (CEE) n° 1677/85 en ce qui concerne la fixation du facteur de correction
    à retenir pour le calcul des montants compensatoires monétaires applicables
    pour certains produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1013/86 der Kommission vom 8. April 1986 zur Änderung
    der Verordnung (EWG) Nr. 1677/85 betreffend die Festsetzung des Berichtigungsfaktors,
    der bei der Berechnung der bei bestimmten landwirtschaftlichen Erzeugnissen anwendbaren
    Währungsausgleichsbeträge zu berücksichtigen ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1013/86 af 8. april 1986 om ændring
    af forordning (EØF) nr. 1677/85 for så vidt angår den justeringsfaktor, der
    skal lægges til grund ved beregning af de monetære udligningsbeløb for visse
    landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1013/86 της Επιτροπής
    της 8ης Απριλίου 1986 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1677/85 σχετικά με τον καθορισμό του
    διορθωτικού συντελεστή που λαμβάνεται υπόψη
    για τον υπολογισμό των νομισματικών εξισωτικών
    ποσών που εφαρμόζονται για ορισμένα γεωργικά
    προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1013/86 della Commissione dell' 8 aprile 1986 che
    modifica il regolamento (CEE) n. 1677/85 per quanto riguarda la fissazione del
    coefficiente correttore da applicare in sede di calcolo degli importi compensativi
    monetari per taluni prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1013/86 van de Commissie van 8 april 1986 tot wijziging
    van Verordening (EEG) nr. 1677/85 ten aanzien van de vaststelling van de correctiefactor
    die in aanmerking wordt genomen bij de berekening van de voor bepaalde landbouwprodukten
    toe te passen monetaire compenserende bedragen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1013/86 da Comissão de 8 de Abril de 1986 que altera
    o Regulamento (CEE) n.° 1677/85 no que diz respeito à fixação do factor de
    correcção a tomar em consideração para o cálculo dos montantes compensatórios
    monetários aplicáveis para determinados produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1013/86 de la Comisión de 8 de abril de 1986 por
