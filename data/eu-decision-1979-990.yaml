title:
- language: en
  script: Latn
  content: '79/990/EEC: Commission Decision of 6 November 1979 authorizing the Italian
    Republic not to apply Community treatment to woven fabrics of man-made fibres
    (continuous), including woven fabrics of monofil or strip, falling within heading
    No 51.01 or 51.02 : woven fabrics of regenerated textile fibres (continuous) other
    than those for tyres and those containing elastomeric yarn, falling within subheading
    51.04 B III of the Common Customs Tariff (NIMEXE codes 51.04-56, 58, 62, 64, 66,
    72, 74, 76, 82, 84, 86, 88, 89, 93, 94, 95, 96, 97, 98) (category 36), originating
    in Poland and in free circulation in the other Member States (Only the Italian
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/990/CEE: Décision de la Commission, du 6 novembre 1979, autorisant
    la République italienne à exclure du traitement communautaire les tissus de
    fibres synthétiques et artificielles continues (y compris les tissus de monofils
    ou de lames des n°s 51.01 ou 51.02): tissus de fibres artificielles continues,
    autres que ceux pour pneumatiques et ceux contenant des fils d''élastomères
    de la sous-position 51.04 B III du tarif douanier commun (codes Nimexe: 51.04-56,
    58, 62, 64, 66, 72, 74, 76, 82, 84, 86, 88, 89, 93, 94, 95, 96, 97, 98) (catégorie
    36), originaires de Pologne et mis en libre pratique dans les autres Etats membres
    (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/990/EWG: Entscheidung der Kommission vom 6. November 1979, mit der
    die Italienische Republik ermächtigt wird, aus Polen stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen oder künstlichen
    Spinnfäden (einschließlich Gewebe aus Monofilen oder Streifen der Tarifnummern
    51.01 oder 51.02) : Gewebe aus künstlichen Spinnfäden, andere als Cordgewebe
    für die Reifenherstellung und Gewebe mit Elastomer-Fäden, der Tarifstelle 51.04
    B III des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 51.04-56, 58, 62, 64, 66,
    72, 74, 76, 82, 84, 86, 88, 89, 93, 94, 95, 96, 97, 98) (Kategorie 36) von der
    Gemeinschaftsbehandlung auszuschließen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/990/EØF: Kommissionens beslutning af 6. november 1979 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage vævet stof
    af endeløse kemofibre (herunder stof vævet af monofilamenter eller strimler
    som henhører under pos. 51.01 og 51.02) : vævet stof af endeløse regenererede
    fibre, bortset fra cordvæv til fremstilling af dæk samt stoffer med indhold
    af elastiske monofilamenter, som henhører under pos. 51.04 B III i den fælles
    toldtarif (NIMEXE-nummer 51.04-56, 58, 62, 64, 66, 72, 74, 76, 82, 84, 86, 88,
    89, 93, 94, 95, 96, 97, 98 ; kategori 36), har oprindelse i Polen og frit kan
    omsættes i de øvrige medlemsstater (Kun den italienske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/990/CEE: Decisione della Commissione, del 6 novembre 1979, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario tessuti di fibre
    tessili sintetiche ed artificiali continue (compresi i tessuti di monofili o di
    lamette delle voci 51.01 o 51.02) : tessuti di fibre tessili artificiali continue,
    diversi da quelli per pneumatici e da quelli contenenti filati elastomeri della
    voce 51.04 B III della tariffa doganale comune (codici Nimexe : 51.04-56, 58,
    62, 64, 66, 72, 74, 76, 82, 84, 86, 88, 89, 93, 94, 95, 96, 97, 98), categoria
    36, originari della Polonia e messi in libera pratica negli altri Stati membri
    (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/990/EEG: Beschikking van de Commissie van 6 november 1979 waarbij de
    Italiaanse Republiek wordt gemachtigd weefsels van synthetische of van kunstmatige
    continuvezels (weefsels van monofil en weefsels van strippen of van artikelen
    van dergelijke vorm, bedoeld bij post 51.01 of bij post 51.02, daaronder begrepen);
    weefsels gemaakt van kunstmatige continuvezels, andere dan de voor buitenbanden
    bestemde en de elastomeergarens bevattende weefsels, van post 51.04 B III van
    het gemeenschappelijk douanetarief (NIMEXE-code 51.04-56, 58, 62, 64, 66, 72,
    74, 76, 82, 84, 86, 88, 89, 93, 94, 95, 96, 97, 98) (categorie 36), van oorsprong
    uit Polen en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Italiaanse taal is authentiek)'
