    v dovážejících třetích zemích, které jsou oprávněny vypisovat nabídková
    řízení v odvětví mléka a mléčných výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 657/82 af 19. marts 1982 om fjerde
