title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 657/82 of 19 March 1982 amending for the
    fourth time Regulation (EEC) No 2730/81 establishing a list of agencies in non-member
    importing countries entitled to issue invitations to tender in the milk and milk
    products sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 657/82 de la Commission, du 19 mars 1982, modifiant
    pour la quatrième fois le règlement (CEE) n° 2730/81 établissant la liste
    des organismes dans les pays tiers importateurs d'où peuvent émaner des adjudications
    dans le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 657/82 der Kommission vom 19. März 1982 zur vierten
