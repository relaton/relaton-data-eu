title:
- language: en
  script: Latn
  content: '92/546/EEC: Council Decision of 23 November 1992 authorizing the United
    Kingdom to apply a measure derogating from Article 28e (1) of the Sixth Directive
    77/388/EEC on the harmonization of the laws of the Member States relating to turnover
    taxes'
  type: main
- language: fr
  script: Latn
  content: '92/546/CEE: Décision du Conseil, du 23 novembre 1992, autorisant le Royaume-Uni
    à appliquer une mesure dérogatoire à l'' article 28 sexies paragraphe 1 de
    la sixième directive 77/388/CEE en matière d'' harmonisation des législations
    des Etats membres relatives aux taxes sur le chiffre d'' affaires'
  type: main
- language: de
  script: Latn
  content: '92/546/EWG: Entscheidung des Rates vom 23. November 1992 zur Ermächtigung
    des Vereinigten Königreichs, eine von Artikel 28e Absatz 1 der Sechsten Richtlinie
    77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über
    die Umsatzsteuern abweichende Maßnahme anzuwenden'
  type: main
- language: da
  script: Latn
  content: '92/546/EØF: Rådets beslutning af 23. november 1992 om bemyndigelse af
    Det Forenede Kongerige til at anvende en foranstaltning, der fraviger artikel
    28e, stk. 1, i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes
    lovgivning om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '92/456/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Νοεμβρίου 1992 που επιτρέπει στο Ηνωμένο Βασίλειο
    να εφαρμόσει ένα μέτρο κατά παρέκκλιση του
    άρθρου 28ε παράγραφος 1 της έκτης οδηγίας 77/388/ΕΟΚ
    περί εναρμονίσεως των νομοθεσιών των κρατών
    μελών των σχετικών με τους φόρους κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: '92/546/CEE: Decisione del Consiglio, del 23 novembre 1992, che autorizza
    il Regno Unito ad applicare una misura di deroga all'' articolo 28 sexies, paragrafo
    1 della sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni
    degli Stati membri relative alle imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '92/546/EEG: Beschikking van de Raad van 23 november 1992 waarbij het Verenigd
    Koninkrijk wordt gemachtigd een maatregel toe te passen die afwijkt van artikel
    28 sexies, lid 1, van Zesde Richtlijn 77/388/EEG betreffende de harmonisatie van
    de wetgevingen der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '92/546/CEE: Decisão do Conselho, de 23 de Novembro de 1992, que autoriza
    o Reino Unido a aplicar uma medida derrogatória ao n° 1 do artigo 28° E da
    Sexta Directiva 77/388/CEE, relativa à harmonização das legislações dos Estados-membros
    respeitantes aos impostos sobre o volume de negócios'
  type: main
- language: es
  script: Latn
  content: '92/546/CEE: Decisión del Consejo, de 23 de noviembre de 1992, por la
    que se autoriza al Reino Unido a establecer una excepción a lo dispuesto en el
    apartado 1 del artículo 28 sexto de la sexta Directiva del Consejo (77/388/CEE)
    en materia de armonización de las legislaciones de los Estados miembros relativas
    a los impuestos sobre el volumen de negocios'
