title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2515/97 of 16 December 1997 amending Regulation
    (EC) No 2118/97 determining the extent to which applications lodged in October
    1997 for import licences for certain egg sector products and poultrymeat pursuant
    to Regulations (EC) No 1474/95 and (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2515/97 DE LA COMMISSION du 16 décembre 1997 rectifiant
    le règlement (CE) n° 2118/97 déterminant la mesure dans laquelle les demandes
    de licences d'importation introduites en octobre 1997 pour certains produits du
    secteur des oeufs et de la viande de volaille dans le cadre des règlements (CE)
    n° 1474/95 et (CE) n° 1251/96 peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2515/97 DER KOMMISSION vom 16. Dezember 1997 zur Änderung
    der Verordnung (EG) Nr. 2118/97 über die Festsetzung des Umfangs, in dem die
    im Oktober 1997 gestellten Anträge auf Einfuhrlizenzen für bestimmte Produkte
    des Sektors Eier und Geflügelfleisch entsprechend den Verordnungen (EG) Nr. 1474/95
    und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2515/97 af 16. december 1997 om berigtigelse
    til forordning (EF) nr. 2118/97 om fastsættelse af, i hvilket omfang der kan
    accepteres ansøgninger, der blev indgivet i oktober 1997 om importlicenser for
    visse ægprodukter og fjerkrækød i forbindelse med forordning (EF) nr. 1474/95
    og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2515/97 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 16ης Δεκεμβρίου 1997 περί διορθώσεως του κανονισμού
    (ΕΚ) αριθ. 2118/97 για καθορισμό ορίων εντός των
    οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Οκτώβριο του 1997 για άδειες
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) αριθ. 1251/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2515/97, annettu 16 päivänä joulukuuta 1997,
    määrättyyn järjestelmään liittyvien lokakuussa 1997 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontilupahakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96 mukaisesti annetun asetuksen
    (EY) N:o 2118/97 oikaisemisesta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2515/97 DELLA COMMISSIONE del 16 dicembre 1997 che
    rettifica il regolamento (CE) n. 2118/97 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli d'importazione presentate nel mese di ottobre
    1997 per taluni prodotti del settore delle uova e del pollame nel quadro dei regolamenti
    (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2515/97 VAN DE COMMISSIE van 16 december 1997 houdende
    rectificatie van Verordening (EG) nr. 2118/97 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    producten in de sector eieren en slachtpluimvee die in oktober 1997 worden ingediend
    op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2515/97 DA COMISSÃO de 16 de Dezembro de 1997 que
    rectifica o Regulamento (CE) nº 2118/97 que determina em que medida podem ser
    aceites os pedidos de certificados de importação de determinados produtos do
    sector dos ovos e da carne de aves de capoeira apresentados em Outubro de 1997
    ao abrigo dos Regulamentos (CE) nº 1474/95 e (CE) nº 1251/96
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2515/97 DE LA COMISIÓN de 16 de diciembre de 1997
    que rectifica el Reglamento (CE) n° 2118/97 por el que se determina la proporción
    en que se satisfarán las solicitudes de licencias de importación de algunos
    productos del sector de los huevos y de la carne de aves de corral presentadas
    en el mes de octubre de 1997 al amparo de los Reglamentos (CE) nos 1474/95 y 1251/96
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2515/97 av den 16 december 1997 om ändring
    av förordning (EG) nr 2118/97 om fastställande av i vilken utsträckning de
    ansökningar om importlicens för vissa äggprodukter samt fjäderfäkött som
    ges in under oktober 1997 inom ramen för förordningarna (EG) nr 1474/95 och
    (EG) nr 1251/96 kan godtas
  type: main
