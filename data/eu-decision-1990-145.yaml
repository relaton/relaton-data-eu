  content: '90/145/EEC: Commission Decision of 19 March 1990 on the establishment
    of overall quantities of food aid for 1990 and a list of products to be supplied
    as food aid'
  type: main
- language: fr
  script: Latn
  content: '90/145/CEE: Décision de la Commission du 19 mars 1990 relative à la
    fixation des quantités globales d''aide alimentaire au titre du programme 1990
    et à l''établissement de la liste des produits à fournir à titre d''aide alimentaire'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 19. Maerz 1990 zur Festlegung der Gesamtmengen
    der Nahrungsmittelhilfe im Rahmen des Programms fuer 1990 und zur Erstellung des
    Verzeichnisses der als Nahrungsmittelhilfe zu liefernden Erzeugnisse (90/145/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 19. marts 1990 om fastsaettelse af de samlede
    maengder foedevarehjaelp i henhold til 1990-programmet og af listen over produkter,
    der kan leveres som foedevarehjaelp (90/145/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/145/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
