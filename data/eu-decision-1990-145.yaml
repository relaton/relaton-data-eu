    del programma 1990 (90/145/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 19 maart 1990 tot vaststelling van de totale
    hoeveelheden voedselhulp voor het programma van 1990 en van de lijst van voor
    beschikbaarstelling als voedselhulp in aanmerking komende produkten (90/145/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 19 de Março de 1990 relativa à fixaçao das quantidades
