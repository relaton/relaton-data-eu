    i ndáil le fliú ardphataigineach na n-éan
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/460 оd 16. ožujka 2021. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Ukrajinu na popisu trećih
    zemalja, državnih područja, zona ili kompartmenta iz kojih je dopušten uvoz
    određenih proizvoda od peradi u Uniju ili njihov provoz kroz Uniju, u vezi s
    visokopatogenom influencom ptica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/460 végrehajtási rendelete (2021. március 16.)
    a magas patogenitású madárinfluenza kapcsán a 798/2008/EK rendelet I. mellékletének
    az egyes baromfiáruk Unióba történő behozatala és Unión keresztül történő
    átszállítása céljából engedélyezett harmadik országok, területek, övezetek
    és területi egységek jegyzékének az Ukrajnára vonatkozó bejegyzés tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/460 della Commissione del 16 marzo
    2021 che modifica l’allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa all’Ucraina nell’elenco di paesi terzi, loro territori, zone
    o compartimenti dai quali determinati prodotti a base di pollame possono essere
    importati e transitare nell’Unione in relazione all’influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/460 (2021. gada 16. marts), ar
    ko attiecībā uz ierakstu par Ukrainu to trešo valstu, teritoriju, zonu vai
    nodalījumu sarakstā, no kuriem saistībā ar augsti patogēnisko putnu gripu
    atļauts Savienībā importēt un tranzītā caur to pārvadāt noteiktas mājputnu
    izcelsmes preces, groza Regulas (EK) Nr. 798/2008 I pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/460 2021 m. kovo 16 d. kuriuo
    dėl labai patogeniško paukščių gripo ir su šia liga susijusio Ukrainos įrašo
    trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių galima importuoti
    į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių paukščių
    prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/460 tas-16
    ta’ Marzu 2021 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 fir-rigward
    tal-entrata għall-Ukrajna fil-lista ta’ pajjiżi terzi, territorji, żoni jew
    kumpartimenti li minnhom jistgħu jiġu importati lejn l-Unjoni, u jgħaddu minnha
    bi tranżitu, ċerti prodotti tat-tjur b’rabta mal-influwenza tat-tjur b’patoġeniċità
    għolja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/460 van de Commissie van 16 maart 2021
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de vermelding
