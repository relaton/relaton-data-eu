    koskevan kohdan osalta niiden kolmansien maiden, alueiden, vyöhykkeiden tai erillisalueiden
    luettelossa, joista tiettyjen siipikarjasta saatujen hyödykkeiden tuonti unioniin
    ja kuljettaminen sen kautta on sallittua korkeapatogeenisen lintuinfluenssan yhteydessä
  type: main
- language: ga
  script: Latn
