    waaruit bepaalde pluimveeproducten mogen worden ingevoerd in en doorgevoerd door
    de Unie in verband met hoogpathogene aviaire influenza
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/460 z dnia 16 marca 2021 r.
    zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w odniesieniu do
    wpisu dotyczącego Ukrainy w wykazie państw trzecich, terytoriów, stref lub
    grup, z których dopuszczalny jest przywóz do Unii i tranzyt przez jej terytorium
    niektórych towarów drobiowych, w związku z wysoce zjadliwą grypą ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/460 da Comissão de 16 de março de
    2021 que altera o anexo I do Regulamento (CE) n.o 798/2008 no que se refere à
    entrada relativa à Ucrânia na lista de países terceiros, territórios, zonas
    ou compartimentos a partir dos quais são autorizados a importação e o trânsito
    na União de determinados produtos à base de aves de capoeira, relativamente
    à gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/460 al Comisiei din 16 martie
    2021 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Ucraina din lista țărilor terțe, teritoriilor, zonelor
    sau compartimentelor din care anumite păsări de curte și produse obținute
    de la acestea pot fi importate în Uniune sau pot tranzita Uniunea în contextul
    riscului de gripă aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/460 zo 16. marca 2021, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Ukrajiny v zozname tretích krajín, území, oblastí alebo jednotiek, z ktorých
    možno do Únie dovážať a cez jej územie prevážať určité komodity z hydiny
    v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/460 z dne 16. marca 2021 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Ukrajino na seznamu tretjih
    držav, ozemelj, območij ali kompartmentov, iz katerih sta dovoljena uvoz nekaterega
    perutninskega blaga v Unijo ter njegov tranzit skozi Unijo v zvezi z visokopatogeno
    aviarno influenco
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/460 de la Comisión de 16 de marzo de
    2021 por el que se modifica el anexo I del Reglamento (CE) n.o 798/2008 en lo
    relativo a la entrada correspondiente a Ucrania en la lista de terceros países,
    territorios, zonas o compartimentos desde los que se permite la importación en
    la Unión o el tránsito por esta de determinadas mercancías de aves de corral
    en relación con la influenza aviar de alta patogenicidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/460 av den 16 mars 2021
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Ukraina i förteckningen över tredjeländer, områden, zoner eller delområden
    från vilka vissa varor av fjäderfä får importeras till och transiteras genom
    unionen, i samband med högpatogen aviär influensa
