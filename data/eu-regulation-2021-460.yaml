title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/460 of 16 March 2021 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Ukraine in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into and transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/460 de la Commission du 16 mars 2021
    modifiant l’annexe I du règlement (CE) no 798/2008 en ce qui concerne la mention
    relative à l’Ukraine dans la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l’Union et transiter par celle-ci, pour ce qui est de l’influenza aviaire
    hautement pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/460 der Kommission vom 16. März 2021
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zur Ukraine in der Liste von Drittländern, Gebieten, Zonen und Kompartimenten,
    aus denen bestimmte Geflügelwaren in die Union eingeführt bzw. durch die Union
    durchgeführt werden dürfen, im Zusammenhang mit der hochpathogenen Aviären
    Influenza
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/460 на Комисията
    от 16 март 2021 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Украйна в списъка на трети държави, територии,
    зони или компартменти, от които са разрешени
    вносът и транзитът през Съюза на някои стоки
    от домашни птици, във връзка с високопатогенната
    инфлуенца по птиците
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/460 ze dne 16. března 2021,
    kterým se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku
    pro Ukrajinu na seznamu třetích zemí, území, oblastí nebo jednotek, z nichž
    lze do Unie dovážet a přes její území přepravovat některé drůbeží
    komodity v souvislosti s vysoce patogenní influenzou ptáků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/460 af 16. marts 2021
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Ukraine på listen over tredjelande, områder, zoner og segmenter, hvorfra
    visse fjerkræprodukter kan importeres til og sendes i transit gennem Unionen
    i forbindelse med højpatogen aviær influenza
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/460 της Επιτροπής
