title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3545/87 of 23 November 1987 amending for the
    fourth time Regulation (EEC) No 4034/86 fixing, for certain fish stocks and groups
    of fish stocks, the total allowable catches for 1987 and certain conditions under
    which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3545/87 du Conseil du 23 novembre 1987 portant quatrième
    modification du règlement (CEE) n° 4034/86 fixant, pour certains stocks ou groupes
    de stocks de poissons, les totaux admissibles des captures pour 1987 et certaines
    conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3545/87 des Rates vom 23. November 1987 zur vierten
    Änderung der Verordnung (EWG) Nr. 4034/86 zur Festlegung der zulässigen Gesamtfangmengen
    und bestimmter Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für
    bestimmte Fischbestände oder Bestandsgruppen für 1987
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3545/87 af 23. november 1987 om fjerde ændring
    af forordning (EØF) nr. 4034/86 om fastsættelse for 1987 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande i Fællesskabets
    fiskerizone samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3545/87 του Συμβουλίου
    της 23ης Νοεμβρίου 1987 που τροποποιεί για τέταρτη
    φορά τον κανονισμό (ΕΟΚ) αριθ. 4034/86 για τον καθορισμό,
    για ορισμένα αποθέματα ιχθύων ή ομάδες ιχθύων,
    του συνόλου επιτρεπομένων αλιευμάτων για το
    1987 και ορισμένων όρων υπό τους οποίους μπορούν
    να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3545/87 del Consiglio del 23 novembre 1987 recante
    quarta modifica del regolamento (CEE) n. 4034/86 che fissa, per alcune popolazioni
    o gruppi di popolazioni ittiche, il totale delle catture ammissibile per il 1987
    ed alcune condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3545/87 van de Raad van 23 november 1987 houdende
    vierde wijziging van Verordening (EEG) nr. 4034/86 inzake de vaststelling van
    de voor 1987 geldende totaal toegestane vangsten voor bepaalde visbestanden of
    groepen visbestanden en bepaalde bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3545/87 do Conselho de 23 de Novembro de 1987 que
    altera pela quarta vez o Regulamento (CEE) n.° 4034/86 que fixa, relativamente
    a certas unidades populacionais (stocks) ou grupos de unidades populacionais de
    peixes, os totais admissíveis de capturas para 1987 e certas condições em que
    podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3545/87 del Consejo de 23 de noviembre de 1987 que
    modifica por cuarta vez el Reglamento (CEE) n° 4034/86 por el que se fijan para
    determinadas poblaciones o grupo de poblaciones de peces, los totales admisibles
    de capturas para 1987 y determinadas condiciones en las que pueden pescarse
  type: main
