    den Qualitaetsweinen bestimmter Anbaugebiete gleichgestellten Weine der Tarifnummer
    22.05 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 567/89 af 3. marts 1989 om ændring
