  content: Commission Regulation (EEC) No 567/89 of 3 March 1989 amending Council
    Regulation (EEC) No 482/86 determining the wines produced in Portugal that are
    to be treated as quality wines produced in specified regions falling within heading
    No 22.05 of the common customs tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 567/89 de la Commission du 3 mars 1989 modifiant le
    règlement (CEE) n° 482/86 du Conseil déterminant les vins produits au Portugal
    qui sont assimilés aux vins de qualité produits dans des régions déterminées
    relevant de la position 22.05 du tarif douanier commun
  type: main
- language: de
  script: Latn
