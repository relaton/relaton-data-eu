    des Abkommens in Form eines Briefwechsels betreffend Artikel 9 des Protokolls
    Nr. 1 des Abkommens zwischen der Europäischen Wirtschaftsgemeinschaft und dem
    Staat Israel hinsichtlich der Einfuhr von Fruchtsalaten mit Ursprung in Israel
    in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2679/75 af 11. august 1975 om indgåelse
