    1 to the Agreement between the European Economic Community and the State of Israel
    and concerning the importation into the Community of fruit salads originating
    in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2679/75 du Conseil, du 11 août 1975, portant conclusion
