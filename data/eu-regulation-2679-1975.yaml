    d'Israele, e riguardante l'importazione nella Comunità di macedonie di frutta
    originarie d'Israele
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2679/75 van de Raad van 11 augustus 1975 houdende
    sluiting van de Overeenkomst, in de vorm van een briefwisseling, inzake artikel
