title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4086/88 of 21 December 1988 establishing
    for 1989 the list of vessels exceeding eight metres length overall and permitted
    to use within certain coastal areas of the Community beam trawls whose aggregate
    length exceeds eight metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4086/88 de la Commission du 21 décembre 1988 établissant
    pour 1989 la liste des bateaux dont la longueur hors tout dépasse huit mètres
    autorisés à pêcher dans certaines zones côtières de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse huit mètres
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 4086/88 DER KOMMISSION vom 21. Dezember 1988 zur
    Festlegung der Liste für 1989 der Schiffe mit einer Länge über alles von mehr
    als 8 m, die in bestimmten Küstengebieten der Gemeinschaft mit Baumkurren fischen
    dürfen, deren Gesamtbaumlänge mehr als 8 m beträgt #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4086/88 af 21. december 1988 om listen
    over fartøjer med en længde overalt på over 8 m, der i visse af Fællesskabets
    kystområder har tilladelse til at anvende bomtrawl, hvis samlede bomlængde overstiger
    8 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4086/88 της Επιτροπής
    της 21ης Δεκεμβρίου 1988 που καταρτίζει, για το
    1989, τον κατάλογο των σκαφών συνολικού μήκους
    άνω των οκτώ μέτρων τα οποία επιτρέπεται να
    αλιεύουν σε ορισμένες παράκτιες περιοχές της
    Κοινότητας χρησιμοποιώντας δοκότρατες των
    οποίων το συνολικό μήκος υπερβαίνει τα οκτώ
    μέτρα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 4086/88 DELLA COMMISSIONE del 21 dicembre 1988 che
    fissa per il 1989 l'' elenco dei pescherecci di lunghezza fuori tutto superiore
    a otto metri, autorizzati ad usare, in determinate zone costiere della Comunità,
    reti a strascico a pali, la cui lunghezza complessiva superi gli otto metri #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 4086/88 VAN DE COMMISSIE van 21 december 1988 tot
    vaststelling van de voor 1989 geldende lijst van vaartuigen met een lengte over
    alles van meer dan acht meter en die in bepaalde kustzones van de Gemeenschap
    boomkorren mogen gebruiken waarvan de totale boomlengte meer dan acht meter bedraagt
    #'
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 4086/88 DA COMISSAO de 21 de Dezembro de 1988 que
    estabelece para 1989 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a utilizar em determinadas zonas costeiras da Comunidade
    redes de arrasto de vara em que o comprimento total das varas seja superior a
    oito metros
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 4086/88 DE LA COMISIÓN de 21 de diciembre de 1988
    por el que se establece para 1989 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite faenar dentro de determinadas zonas costeras
    de la Comunidad utilizando artes de arrastre de vara cuya longitud total supere
    los 8 metros #'
