    zur besonderen Regelung der Versorgung der Kanarischen Inseln mit Erzeugnissen
    des Rindfleischsektors bzw. lebenden Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3022/94 af 13. december 1994 om ændring
