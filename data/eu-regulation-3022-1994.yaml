    ζώντα βοοειδή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 3022/94, annettu 13 päivänä joulukuuta 1994,
    Kanariansaarten naudanliha-alan tuotteiden erityisen hankintajärjestelmän soveltamista
    koskevista yksityiskohtaisista säännöistä annetun asetuksen (ETY) N:o 1912/92
    ja elävien nautojen hankintajärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä annetun asetuksen (ETY) N:o 2254/92 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3022/94 della Commissione del 13 dicembre 1994 che
    modifica il regolamento (CEE) n. 1912/92 recante modalità di applicazione del
    regime specifico di approvvigionamento di prodotti del settore delle carni bovine
    per le isole Canarie e il regolamento (CEE) n. 2254/92 recante modalità di applicazione
    del regime di approvvigionamento di bovini vivi per le isole Canarie
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3022/94 van de Commissie van 13 december 1994 tot
