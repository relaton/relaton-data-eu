    de specifieke regeling voor de voorziening van de Canarische eilanden met produkten
    van de sector rundvlees en van Verordening (EEG) nr. 2254/92 houdende bepalingen
    ter uitvoering van de regeling voor de voorziening van de Canarische eilanden
    met levende runderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3022/94 da Comissão de 13 de Dezembro de 1994 que
    altera o Regulamento (CEE) nº 1912/92, que estabelece as normas de execução
    do regime específico de abastecimento das ilhas Canárias em produtos do sector
    da carne de bovino e o Regulamento (CEE) nº 2254/92, que estabelece as normas
    de execução do regime de abastecimento das ilhas Canárias em bovinos vivos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 3022/94 de la Comisión de 13 de diciembre de 1994
    por el que se modifican el Reglamento (CEE) n° 1912/92 por el que se establecen
    las disposiciones de aplicación del régimen de abastecimiento específico de
    productos del sector de la carne de vacuno a las islas Canarias, y el Reglamento
