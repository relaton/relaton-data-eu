  content: Commission Regulation (EC) No 3022/94 of 13 December 1994 amending Regulation
    (EEC) No 1912/92 laying down detailed implementing rules for the specific measures
    for supplying the Canary Islands with products from the beef and veal sector,
    and Regulation (EEC) No 2254/92 on detailed rules for implementing the specific
    measures for supplying the Canary Islands with live bovine animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3022/94 de la Commission du 13 décembre 1994 modifiant
    le règlement (CEE) n° 1912/92 portant modalités d'application du régime spécifique
    pour l'approvisionnement des îles Canaries en produits du secteur de la viande
    bovine ainsi que le règlement (CEE) n° 2254/92 portant modalités d'application
    du régime d'approvisionnement des îles Canaries en bovins vivants
  type: main
- language: de
  script: Latn
