title:
- language: en
  script: Latn
  content: '88/190/EEC: Commission Decision of 17 March 1988 allocating to Portugal
    resources to be charged to the 1988 budget year for the supply of food from intervention
    stocks to designated organizations for distribution to the most deprived persons
    in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/190/CEE: Décision de la Commission du 17 mars 1988 allouant au Portugal
    les crédits imputables à l''exercice 1988 pour la fourniture de denrées alimentaires
    provenant des stocks d''intervention à des organisations désignées pour les
    distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 17. März 1988 über die Bewilligung von
    Mitteln, die im Haushaltsjahr 1988 für die Zurverfügungstellung von Nahrungsmitteln
    aus Interventionsbeständen an bezeichnete Organisationen zur Verteilung an stark
    benachteiligte Personen in der Gemeinschaft zu verbuchen sind, für Portugal (88/190/EWG)
    (88/190/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 17. marts 1988 om tildeling til Portugal af
    midler, der skal opføres på 1988-budgettet for levering af levnedsmidler fra
    interventionslagre til nærmere bestemte organisationer med henblik på uddeling
    til de socialt dårligst stillede personer i Fællesskabet (88/190/EØF) (88/190/EØF)
    #'
  type: main
- language: el
  script: Grek
  content: '88/190/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Μαρτίου 1988 που χορηγεί στην Πορτογαλία πιστώσεις
    που καταλογίζονται στο οικονομικό έτος 1988
    για τη χορήγηση τροφίμων που προέρχονται από
    τα αποθέματα της παρεμβάσεως στους οργανισμούς
    που ορίζονται για τη διανομή τους στους απόρους
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 17 marzo 1988 relativa ad uno stanziamento
