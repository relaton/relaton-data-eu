    openbare inschrijving voor de uitvoer van gerst uit Finse interventievoorraden
    betrekking heeft, tot 105 787 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1367/2000 da Comissão, de 28 de Junho de 2000, que
