    (ΕΚ) αριθ. 1392/1999 και για έναρξη διαρκούς διαγωνισμού
    για εξαγωγή 105 787 τόνων κριθής που έχει στη διάθεσή
    του ο φινλανδικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1367/2000, annettu 28 päivänä kesäkuuta 2000,
    asetuksen (EY) N:o 1392/1999 muuttamisesta ja Suomen interventioelimen hallussaan
    pitämän ohran vientiä koskevan pysyvän tarjouskilpailun kohteena olevan määrän
    nostamisesta 105 787 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1367/2000 della Commissione, del 28 giugno 2000, che
