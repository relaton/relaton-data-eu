    Ausfuhr von im Besitz der finnischen Interventionsstelle befindlicher Gerste auf
    105 787 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1367/2000 af 28. juni 2000 om ændring
