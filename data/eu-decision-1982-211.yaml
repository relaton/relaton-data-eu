title:
- language: en
  script: Latn
  content: '82/211/EEC: Commission Decision of 17 March 1982 establishing that the
    ''Jodon EA-immersion type X-Y micropositionable photographic plate holder, model
    MPH- 45W, with beam splitter attenuator, model UBA-200 and parabolic mirrors''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/211/CEE: Décision de la Commission, du 17 mars 1982, constatant que
    l''importation du "Jodon E.A. immersion type X-Y micropositionable photographic
    plate holder, model MPH-45W, with beam splitter attenuator, model UBA- 200 and
    parabolic mirrors" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/211/EWG: Entscheidung der Kommission vom 17. März 1982, mit der festgestellt
    wird, daß das Gerät ,,Jodon E.A.-Immersion type X-Y micropositionable Photographic
    Plate holder, model MPH-45W, With Beam splitter Attenuator, model UBA-200 and
    Parabolic mirrors" nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/211/EØF: Kommissionens beslutning af 17. marts 1982 om fastslåelse
    af, at indførsel af apparatet "Jodon E.A.-Immersion type X-Y micropositionable
    Photographic Plate holder, model MPH-45W, with Beam splitter Attenuator, model
    UBA-200 and Parabolic mirrors" ikke kan ske med fritagelse for told efter den
    fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/211/EOK: Απόφαση τής Επιτροπής τής 17ης Μαρτίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τού «Jodon
    EA immersion type X-Y micropositionable photographic plate holder, model MPH-45W,
    with beam splitter attenuator, model UBA- 200 and parabolic mirrors» δέν δύναται
    νά πραγματοποιηθεί ατελώς ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/211/CEE: Decisione della Commissione, del 17 marzo 1982, che stabilisce
    che l''importazione del "Jodon EA immersion type X-Y micropositionable photographic
    plate holder, model MPH-45W, with beam splitter attenuator, model UBA-200 and
    parabolic mirrors", non può avvenire in franchigia dai dazi della tariffa doganale
    comune'
  type: main
- language: nl
  script: Latn
  content: '82/211/EEG: Beschikking van de Commissie van 17 maart 1982 waarbij wordt
