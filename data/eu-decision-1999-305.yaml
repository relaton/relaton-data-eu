    που επιτρέπουν στο Ηνωμένο Βασίλειο να περιορίσει
    την εμπορία σπόρων ορισμένων ποικιλιών καλλιεργούμενων
    φυτικών ειδών [κοινοποιηθείσα υπό τον αριθμό
    Ε(1999) 1007]'
  type: main
- language: fi
  script: Latn
  content: '1999/305/EY: Komission päätös, tehty 19 päivänä huhtikuuta 1999,
    sellaisten päätösten kumoamisesta, joissa Yhdistyneelle kuningaskunnalle annetaan
    lupa rajoittaa eräiden viljelykasvien lajikkeiden siementen kaupan pitämistä
    (tiedoksiannettu numerolla K(1999) 1007)'
  type: main
- language: it
  script: Latn
  content: '1999/305/CE: Decisione della Commissione, del 19 aprile 1999, recante
    abrogazione di alcune decisioni che autorizzano il Regno Unito a limitare la commercializzazione
    delle sementi di alcune varietà di specie di piante agricole [notificata con
    il numero C(1999) 1007]'
  type: main
- language: nl
  script: Latn
  content: '1999/305/EG: Beschikking van de Commissie van 19 april 1999 houdende intrekking
    van een aantal beschikkingen tot machtiging van het Verenigd Koninkrijk om de
    handel in zaaizaad van bepaalde rassen van landbouwgewassen te beperken (kennisgeving
    geschied onder nummer C(1999) 1007)'
  type: main
- language: pt
  script: Latn
  content: '1999/305/CE: Decisão da Comissão, de 19 de Abril de 1999, que revoga
    certas decisões que autorizam o Reino Unido a restringir a comercialização
    de sementes de determinadas variedades de espécies de plantas agrícolas [notificada
    com o número C(1999) 1007]'
  type: main
- language: es
  script: Latn
  content: '1999/305/CE: Decisión de la Comisión, de 19 de abril de 1999, que deroga
    determinadas Decisiones por las que se autoriza al Reino Unido a restringir la
    comercialización de las semillas de determinadas variedades de especies de plantas
    agrícolas [notificada con el número C(1999) 1007]'
  type: main
- language: sv
  script: Latn
