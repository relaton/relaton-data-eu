title:
- language: en
  script: Latn
  content: '1999/305/EC: Commission Decision of 19 April 1999 repealing certain decisions
    authorising the United Kingdom to restrict the marketing of seed of certain varieties
    of agricultural plant species (notified under document number C(1999) 1007)'
  type: main
- language: fr
  script: Latn
  content: '1999/305/CE: Décision de la Commission, du 19 avril 1999, abrogeant certaines
    décisions autorisant le Royaume-Uni à restreindre la commercialisation de semences
    de certaines variétés d''espèces de plantes agricoles [notifiée sous le numéro
    C(1999) 1007]'
  type: main
- language: de
  script: Latn
  content: '1999/305/EG: Entscheidung der Kommission vom 19. April 1999 zur Aufhebung
    bestimmter Entscheidungen zur Ermächtigung des Vereinigten Königreichs, den
    Verkehr mit Saatgut einiger Sorten landwirtschaftlicher Pflanzenarten zu beschränken
    (Bekanntgegeben unter Aktenzeichen K(1999) 1007)'
  type: main
- language: da
  script: Latn
  content: '1999/305/EF: Kommissionens beslutning af 19. april 1999 om ophævelse
    af visse beslutninger om bemyndigelse af Det Forenede Kongerige til at begrænse
    handelen med frø af visse sorter af landbrugsplantearter (meddelt under nummer
    K(1999) 1007)'
  type: main
- language: el
  script: Grek
  content: '1999/305/ΕΚ: Απόφαση της Επιτροπής, της 19ης
