  script: Latn
  content: '86/497/CEE: Decisione della Commissione del 7 ottobre 1986 che accetta
    gli impegni assunti nel quadro della procedura antidumping relativi alle importazioni
    di carburo di silicio originario della Repubblica popolare cinese, della Norvegia,
    della Polonia e dell''Unione Sovietica e chiude l''inchiesta relativa alle importazioni
