title:
- language: en
  script: Latn
  content: '86/497/EEC: Commission Decision of 7 October 1986 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of silicon
    carbide originating in the People''s Republic of China, Norway, Poland and the
    USSR, and terminating the investigation regarding imports of that product originating
    in the People''s Republic of China, Norway, Poland, Czechoslovakia, the USSR and
    Yugoslavia'
  type: main
- language: fr
  script: Latn
  content: '86/497/CEE: Décision de la Commission du 7 octobre 1986 portant acceptation
    d''engagements souscrits dans le cadre de la procédure antidumping concernant
    les importations de carbure de silicium originaire de la République populaire
    de Chine, de Norvège, de Pologne et d''Union soviétique et portant clôture
    de l''enquête sur les importations de ce produit originaire de la République
    populaire de Chine, de Norvège, de Pologne, de Tchécoslovaquie, d''Union soviétique
    et de Yougoslavie'
  type: main
- language: de
  script: Latn
  content: '86/497/EWG: Beschluß der Kommission vom 7. Oktober 1986 zur Annahme von
    Verpflichtungen im Rahmen des Antidumping-Verfahrens betreffend die Einfuhren
    von Siliciumcarbid mit Ursprung in der Volksrepublik China, Norwegen, Polen und
    der UdSSR und zur Einstellung der Untersuchung betreffend die Einfuhren dieser
    Waren mit Ursprung in der Volksrepublik China, Norwegen, Polen, der Tschechoslowakei,
    der UdSSR und Jugoslawien'
  type: main
- language: da
  script: Latn
