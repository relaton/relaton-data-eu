id: EUDecision20201179
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/1179 of 6 August 2020 amending
    Annex I to Decision 2009/177/EC as regards the status of the Province of Åland
    in Finland as regards a surveillance programme for viral haemorrhagic septicaemia
    (VHS), of Estonia as regards a surveillance and eradication programme for viral
    haemorrhagic septicaemia (VHS) and infectious haematopoetic necrosis (IHN), of
    Croatia for koi herpes virus (KHV) disease and of certain areas in the United
    Kingdom for infection with Bonamia ostreae (notified under document C(2020) 5303)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/1179 de la Commission du 6 août 2020
    modifiant l’annexe I de la décision 2009/177/CE en ce qui concerne le statut
    de la province de Åland, en Finlande, au regard du programme de surveillance
    de la septicémie hémorragique virale (SHV), le statut de l’Estonie au regard
    du programme de surveillance et d’éradication de la septicémie hémorragique
    virale (SHV) et de la nécrose hématopoïétique infectieuse (NHI), le statut
    de la Croatie au regard de l’herpèsvirose de la carpe koï, ainsi que le statut
    de certaines zones du Royaume-Uni au regard de l’infection à Bonamia ostreae
    [notifiée sous le numéro C(2020) 5303]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/1179 der Kommission vom 6. August 2020
    zur Änderung des Anhangs I der Entscheidung 2009/177/EG betreffend den Status
    der Provinz Åland in Finnland in Bezug auf ein Programm zur Überwachung auf
    die Virale hämorrhagische Septikämie (VHS), Estlands in Bezug auf ein Überwachungs-
    und Tilgungsprogramm hinsichtlich der Viralen hämorrhagischen Septikämie (VHS)
    und der Infektiösen hämatopoetischen Nekrose (IHN), Kroatiens hinsichtlich der
    Koi-Herpes-Viruserkrankung (KHV) und bestimmter Gebiete im Vereinigten Königreich
    hinsichtlich der Infektion mit Bonamia ostreae (Bekannt gegeben unter Aktenzeichen
    C(2020) 5303)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/1179 на Комисията
    от 6 август 2020 година за изменение на приложение
    I към Решение 2009/177/ЕО по отношение на статуса
    на провинция Åland във Финландия във връзка с
    програма за надзор на вирусна хеморагична
    септицемия (VHS), на Естония във връзка с програма
    за надзор и ликвидиране на вирусна хеморагична
    септицемия (VHS) и инфекциозна хематопоетична
    некроза (IHN), на Хърватия във връзка с кой-херпесвирусна
    болест по шарана (KHV) и на някои области в Обединеното
    кралство във връзка със заразяване с Bonamia ostreae
    (нотифицирано под номер С(2020) 5303)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/1179 ze dne 6. srpna 2020, kterým
    se mění příloha I rozhodnutí 2009/177/ES, pokud jde o status provincie Åland
    ve Finsku, pokud jde o program dozoru pro virovou hemoragickou septikémii (VHS),
    Estonska, pokud jde o program dozoru a eradikace pro virovou hemoragickou septikémii
    (VHS) a infekční nekrózu krvetvorné tkáně (IHN), Chorvatska pro herpesvirózu
    koi (KHV) a některých oblastí ve Spojeném království pro bonamiózu (Bonamia
    ostreae) (oznámeno pod číslem C(2020) 5303)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/1179 af 6. august 2020
    om ændring af bilag I til beslutning 2009/177/EF for så vidt angår status for
    Åland i Finland for så vidt angår et overvågningsprogram for egtvedsyge (VHS),
    status for Estland for så vidt angår et overvågnings- og udryddelsesprogram
    for egtvedsyge (VHS) og infektiøs hæmatopoietisk nekrose (IHN), status for Kroatien
    med hensyn til koi herpesvirussygdom (KHV) og status for visse områder i Det
    Forenede Kongerige med hensyn til infektion med Bonamia ostreae (meddelt under
    nummer (2020) 5303)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/1179 της Επιτροπής
