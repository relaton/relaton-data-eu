    παραρτήματος I της απόφασης 2009/177/ΕΚ αναφορικά
    με το καθεστώς της επαρχίας Åland στη Φινλανδία
    όσον αφορά πρόγραμμα επιτήρησης για την ιογενή
    αιμορραγική σηψαιμία (ΙΑΣ), της Εσθονίας όσον
    αφορά πρόγραμμα επιτήρησης και εξάλειψης για
    την ιογενή αιμορραγική σηψαιμία (ΙΑΣ) και τη
    λοιμώδη αιματοποιητική νέκρωση (ΛΑΝ), της Κροατίας
    για τη λοίμωξη του κυπρίνου Koi από ερπητοϊό
    (νόσος KHV) και ορισμένων περιοχών του Ηνωμένου
    Βασιλείου για τη λοίμωξη από Bonamia ostreae [κοινοποιηθείσα
    υπό τον αριθμό C(2020) 5303]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/1179, 6. august 2020, millega muudetakse
    otsuse 2009/177/EÜ I lisa seoses Soome Ahvenamaa maakonna staatusega viirusliku
    hemorraagilise septitseemia (VHS) seireprogrammi suhtes, Eesti staatusega viirusliku
    hemorraagilise septitseemia (VHS) ja nakkusliku vereloomenekroosi (IHN) seire-
    ja likvideerimisprogrammi suhtes, Horvaatia staatusega karpkalade herpesviroosi
    (KHV) suhtes ja teatavate Ühendkuningriigi piirkondade staatusega Bonamia ostreae
    nakkuse suhtes (teatavaks tehtud numbri C(2020) 5303 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/1179, annettu 6 päivänä
    elokuuta 2020, päätöksen 2009/177/EY liitteen I muuttamisesta siltä osin kuin
    on kyse Suomen Ahvenanmaan maakunnan asemasta virusperäisen verenvuotoseptikemian
    (VHS) seurantaohjelman osalta, Viron asemasta virusperäisen verenvuotoseptikemian
    (VHS) ja tarttuvan vertamuodostavan kudoksen kuolion (IHN) seuranta- ja hävittämisohjelman
    osalta, Kroatian asemasta koikarpin herpesviruksen (KHV) osalta ja tiettyjen Yhdistyneen
    kuningaskunnan alueiden asemasta Bonamia ostreae -loisen aiheuttaman tartunnan
    osalta (tiedoksiannettu numerolla C(2020) 5303)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/1179 оd 6. kolovoza 2020. o izmjeni
    Priloga I. Odluci 2009/177/EZ u pogledu statusa pokrajine Åland u Finskoj s obzirom
    na program nadziranja virusne hemoragijske septikemije (VHS), Estonije s obzirom
    na program nadziranja i iskorjenjivanja virusne hemoragijske septikemije (VHS)
    i zarazne hematopoetske nekroze (ZHN), Hrvatske za koi herpes virozu (KHV) i određenih
    područja u Ujedinjenoj Kraljevini za infekciju parazitom Bonamia ostreae (priopćeno
    pod brojem dokumenta C(2020) 5303)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/1179 végrehajtási határozata (2020. augusztus
    6.) a 2009/177/EK határozat I. mellékletének a finnországi Åland tartomány
    járványügyi helyzetének a pisztrángok vírusos vérfertőzésére (VHS) vonatkozó
    felügyeleti program tekintetében, Észtország járványügyi helyzetének a
    pisztrángok vírusos vérfertőzésére (VHS) és a pisztrángfélék fertőző
    vérképzőszervi elhalására (IHN) vonatkozó felügyeleti és felszámolási
    program tekintetében, Horvátország járványügyi helyzetének a koiherpeszvírus
    betegségre (KHV) tekintetében, valamint az Egyesült Királyság egyes területei
    járványügyi helyzetének a Bonamia ostreae-fertőzés tekintetében történő
    módosításáról (az értesítés a C(2020) 5303. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/1179 della Commissione del 6 agosto 2020
    che modifica l’allegato I della decisione 2009/177/CE per quanto riguarda lo
    status della provincia di Åland in Finlandia in merito a un programma di sorveglianza
    della setticemia emorragica virale (VHS), lo status dell’Estonia in merito a
    un programma di sorveglianza e di eradicazione della setticemia emorragica virale
    (VHS) e della necrosi ematopoietica infettiva (IHN), lo status della Croazia in
    merito al virus erpetico (KHV) e lo status di alcune zone del Regno Unito in merito
    all’infezione da Bonamia ostreae [notificata con il numero C(2020) 5303]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/1179 (2020. gada 6. augusts),
    ar ko attiecībā uz Somijas Ālandes provinces statusu saistībā ar virusālās
    hemorāģiskās septicēmijas (VHS) uzraudzības programmu, Igaunijas statusu
    saistībā ar virusālās hemorāģiskās septicēmijas (VHS) un infekciozās
    hematopoētiskās nekrozes (IHN) uzraudzības un izskaušanas programmu, Horvātijas
    statusu saistībā ar koi herpesvīrusu (KHV) un atsevišķu Apvienotās Karalistes
    apgabalu statusu saistībā ar Bonamia ostreae infekciju groza Lēmuma 2009/177/EK
    I pielikumu (izziņots ar dokumenta numuru C(2020) 5303)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/1179 2020 m. rugpjūčio 6
    d. kuriuo dėl Suomijos Alandų provincijos statuso, susijusio su virusinės hemoraginės
    septicemijos (VHS) priežiūros programa, dėl Estijos statuso, susijusio su virusinės
    hemoraginės septicemijos (VHS) ir infekcinės hematopoetinės nekrozės (IHN)
    priežiūros ir likvidavimo programa, dėl Kroatijos statuso, susijusio su koi
    herpeso viruso (KHV) infekcija, ir dėl tam tikrų Jungtinės Karalystės teritorijų
    statuso, susijusio su bonamiozės (Bonamia ostreae) infekcija, iš dalies keičiamas
    Sprendimo 2009/177/EB I priedas (pranešta dokumentu Nr. C(2020) 5303)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/1179 tas-6
    ta’ Awwissu 2020 li temenda l-Anness I tad-Deċiżjoni 2009/177/KE fir-rigward
    tal-istatus tal-Provinċja ta’ Åland fil-Finlandja fir-rigward tal-programm
    ta’ sorveljanza għas-settiċemija emorraġika virali (VHS), tal-Estonja fir-rigward
    tal-programm ta’ sorveljanza u qerda tas-settiċemija emorraġika virali (VHS)
    u n-nekrożi ematopojetika infettiva (IHN), tal-Kroazja għall-marda tal-virus
    tal-erpete tal-koi (KHV) u ta’ ċerti żoni fir-Renju Unit għall-infezzjoni
    bil-Bonamia ostreae (notifikata bid-dokument C(2020) 5303)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/1179 van de Commissie van 6 augustus 2020
    tot wijziging van bijlage I bij Beschikking 2009/177/EG wat betreft de status
    van de provincie Åland in Finland ten aanzien van een bewakingsprogramma voor
    virale hemorragische septikemie (VHS), van Estland ten aanzien van een bewakings-
    en uitroeiingsprogramma voor virale hemorragische septikemie (VHS) en infectieuze
    hematopoëtische necrose (IHN), van Kroatië voor het koiherpesvirus (KHV) en
    van bepaalde gebieden in het Verenigd Koninkrijk voor besmetting met Bonamia ostreae
    (Kennisgeving geschied onder nummer C(2020) 5303)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/1179 z dnia 6 sierpnia 2020 r. zmieniająca
    załącznik I do decyzji 2009/177/WE w odniesieniu do statusu prowincji Åland
    w Finlandii w odniesieniu do programu nadzoru dotyczącego wirusowej posocznicy
    krwotocznej (VHS), statusu Estonii w odniesieniu do programu nadzoru i zwalczania
    wirusowej posocznicy krwotocznej (VHS) i zakaźnej martwicy układu krwiotwórczego
    ryb łososiowatych (IHN), statusu Chorwacji w odniesieniu do zakażenia herpeswirusem
    koi (KHV) oraz statusu niektórych obszarów w Zjednoczonym Królestwie w odniesieniu
    do zakażenia wywoływanego przez Bonamia ostreae (notyfikowana jako dokument
    nr C(2020) 5303)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (EU) 2020/1179 da Comissão de 6 de agosto de 2020
    que altera o anexo I da Decisão 2009/177/CE no que se refere ao estatuto da província
    de Åland, na Finlândia, relativamente a um programa de vigilância da septicemia
    hemorrágica viral (SHV), ao estatuto da Estónia relativamente a um programa
    de vigilância e erradicação da septicemia hemorrágica viral (SHV) e da necrose
    hematopoiética infeciosa (NHI), ao estatuto da Croácia relativamente à herpesvirose
    da carpa-koi (KHV) e ao estatuto de certas zonas do Reino Unido relativamente
    à infeção por Bonamia ostreae [notificada com o número C(2020) 5303]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/1179 a Comisiei din 6 august 2020
    de modificare a anexei I la Decizia 2009/177/CE în ceea ce privește statutul
    provinciei Åland din Finlanda din perspectiva unui program de supraveghere a
    septicemiei hemoragice virale (SHV), al Estoniei din perspectiva unui program
    de supraveghere și de eradicare a septicemiei hemoragice virale (SHV) și a necrozei
    hematopoietice infecțioase (NHI), al Croației din perspectiva virusului herpetic
    al crapului koi (VHK) și al anumitor zone din Regatul Unit din perspectiva infecției
    cu Bonamia ostreae [comunicată cu numărul C(2020) 5303]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/1179 zo 6. augusta 2020, ktorým
    sa mení príloha I k rozhodnutiu 2009/177/ES v súvislosti so štatútom provincie
    Åland vo Fínsku, pokiaľ ide o program dohľadu zameraný na vírusovú hemoragickú
    septikémiu (VHS), Estónska, pokiaľ ide o program dohľadu a eradikácie zameraný
    na vírusovú hemoragickú septikémiu (VHS) a infekčnú hematopoetickú nekrózu
    (IHN), Chorvátska, pokiaľ ide o herpesvirózu kaprov koi (KHV), a určitých
    oblastí Spojeného kráľovstva, pokiaľ ide o bonamiózu (Bonamia ostreae) [oznámené
    pod číslom C(2020) 5303]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/1179 z dne 6. avgusta 2020 o spremembi
    Priloge I k Odločbi 2009/177/ES glede statusa province Åland na Finskem v zvezi
    s programom za nadziranje virusne hemoragične septikemije (VHS), statusa Estonije
    v zvezi s programom za nadziranje in izkoreninjenje virusne hemoragične septikemije
    (VHS) in infekciozne hematopoetske nekroze (IHN), statusa Hrvaške v zvezi z boleznijo,
    ki jo povzroča Koi herpes virus (KHV), in statusa nekaterih območij v Združenem
    kraljestvu v zvezi z okužbo z Bonamia ostreae (notificirano pod dokumentarno
    številko C(2020) 5303)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/1179 de la Comisión de 6 de agosto de
    2020 por la que se modifica el anexo I de la Decisión 2009/177/CE respecto a
    la calificación de la región finlandesa de Åland en relación con un programa
    de vigilancia de la septicemia hemorrágica vírica, la de Estonia en relación
    con un programa de vigilancia y erradicación de la septicemia hemorrágica vírica
    y la necrosis hematopoyética infecciosa, la de Croacia en relación con la herpesvirosis
    koi, y la de determinadas zonas del Reino Unido en relación con la infección
    por Bonamia ostreae
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/1179 av den 6 augusti 2020
    om ändring av bilaga I till beslut 2009/177/EG vad gäller status i landskapet
    Åland i Finland avseende ett övervakningsprogram för viral hemorragisk septikemi
    (VHS), i Estland avseende övervaknings- och utrotningsprogram för viral hemorragisk
    septikemi (VHS) och infektiös hematopoietisk nekros (IHN), i Kroatien avseende
    koiherpesvirus (KHV) samt i vissa områden i Förenade kungariket avseende infektion
    orsakad av Bonamia ostreae [delgivet med nr C(2020) 5303]
