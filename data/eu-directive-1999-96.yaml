---
id: EUDirective199996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Directive 1999/96/EC of the European Parliament and of the Council of 13
    December 1999 on the approximation of the laws of the Member States relating to
    measures to be taken against the emission of gaseous and particulate pollutants
    from compression ignition engines for use in vehicles, and the emission of gaseous
    pollutants from positive ignition engines fuelled with natural gas or liquefied
    petroleum gas for use in vehicles and amending Council Directive 88/77/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 1999/96/CE du Parlement Européen et du Conseil du 13 décembre
    1999 concernant le rapprochement des législations des États membres relatives
    aux mesures à prendre contre les émissions de gaz polluants et de particules
    polluantes provenant des moteurs à allumage par compression destinés à la propulsion
    des véhicules et les émissions de gaz polluants provenant des moteurs à allumage
    commandé fonctionnant au gaz naturel ou au gaz de pétrole liquéfié et destinés
    à la propulsion des véhicules, et modifiant la directive 88/77/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Richtlinie 1999/96/EG des Europäischen Parlaments und des Rates vom 13.
    Dezember 1999 zur Angleichung der Rechtsvorschriften der Mitgliedstaaten über
    Maßnahmen gegen die Emission gasförmiger Schadstoffe und luftverunreinigender
    Partikel aus Selbstzündungsmotoren zum Antrieb von Fahrzeugen und die Emission
    gasförmiger Schadstoffe aus mit Erdgas oder Flüssiggas betriebenen Fremdzündungsmotoren
    zum Antrieb von Fahrzeugen und zur Änderung der Richtlinie 88/77/EWG des Rates
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 1999/96/ES ze dne 13. prosince
    1999 o sbližování právních předpisů členských států týkajících se
    opatření proti emisím plynných znečišťujících látek a znečišťujících
    částic ze vznětových motorů vozidel a emisím plynných znečišťujících
    látek ze zážehových motorů vozidel poháněných zemním plynem nebo zkapalněným
    ropným plynem a o změně směrnice Rady 88/77/EHS
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 1999/96/EF af 13. december 1999
    om indbyrdes tilnærmelse af medlemsstaternes lovgivninger om foranstaltninger
    mod emission af forurenende luftarter og partikler fra motorer med kompressionstænding
    til fremdrift af køretøjer og emission af forurenende luftarter fra køretøjsmotorer
    med styret tænding, som benytter naturgas eller autogas (LPG) som brændstof,
    og om ændring af Rådets direktiv 88/77/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 1999/96/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 13ης Δεκεμβρίου 1999 για
    την προσέγγιση των νομοθεσιών των κρατών μελών
    σχετικά με τα μέτρα που πρέπει να ληφθούν κατά
    των εκπομπών αερίων και σωματιδιακών ρύπων
    από τους κινητήρες ανάφλεξης με συμπίεση που
    χρησιμοποιούνται σε οχήματα, καθώς και κατά
    των εκπομπών αερίων ρύπων από κινητήρες επιβαλλόμενης
    ανάφλεξης που τροφοδοτούνται με φυσικό αέριο
    ή υγραέριο και χρησιμοποιούνται σε οχήματα,
    και σχετικά με την τροποποίηση της οδηγίας
    88/77/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 1999/96/EÜ, 13. detsember 1999,
    liikmesriikide õigusaktide ühtlustamise kohta, mis käsitlevad meetmeid, mida
    võetakse sõidukite diiselmootoritest eralduvate gaasiliste ja tahkete osakeste
    heitmete vastu ning sõidukites kasutatavatest maagaasil või veeldatud naftagaasil
    töötavatest ottomootoritest eralduvate gaasiliste osakeste heitmete vastu, ning
    nõukogu direktiivi 88/77/EMÜ muutmise kohta
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 1999/96/EY, annettu 13 päivänä
    joulukuuta 1999, ajoneuvojen puristussytytysmoottoreiden kaasumaisten ja hiukkasmaisten
    päästöjen sekä ajoneuvoissa käytettävien maa- tai nestekaasulla toimivien
    ottomoottoreiden kaasupäästöjen torjumiseksi toteutettavista toimenpiteistä
    annetun jäsenvaltioiden lainsäädännön lähentämisestä ja neuvoston direktiivin
    88/77/ETY muuttamisesta
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 1999/96/EK irányelve (1999. december
    13.) a járművek hajtására használt sűrítéses gyújtású motorok gázhalmazállapotúszennyezőanyag-
    és légszennyezőrészecskekibocsátása, valamint a járművek hajtására használt,
    földgáz- vagy PB-gázüzemű külső gyújtású motorok gázhalmazállapotúszennyezőanyag-kibocsátása
    elleni intézkedésekre vonatkozó tagállami jogszabályok közelítéséről
    és a 88/77/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 1999/96/CE del Parlamento europeo e del Consiglio del 13 dicembre
    1999 sul ravvicinamento delle legislazioni degli Stati membri relative ai provvedimenti
    da prendere contro l'emissione di inquinanti gassosi e di particolato prodotti
    dai motori ad accensione spontanea destinati alla propulsione di veicoli e l'emissione
    di inquinanti gassosi prodotti dai motori ad accensione comandata alimentati con
    gas naturale o con gas di petrolio liquefatto destinati alla propulsione di veicoli
    e che modifica la direttiva 88/77/CEE del Consiglio
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva (1999. gada 13. decembris) par
    dalībvalstu tiesību aktu tuvināšanu attiecībā uz pasākumiem, kas jāveic,
    lai samazinātu gāzveida un daļiņveida piesārņotāju emisiju no kompresijaizdedzes
    motoriem, kuri paredzēti transportlīdzekļiem, un gāzveida piesārņotāju
    emisiju no dzirksteļaizdedzes motoriem, ko darbina ar dabasgāzi vai sašķidrinātu
    naftas gāzi un kas paredzēti transportlīdzekļiem, un par grozījumiem Padomes
    Direktīvā 88/77/EEK
  type: main
- language: lt
  script: Latn
  content: 1999 m. gruodžio 13 d. Europos Parlamento ir Tarybos direktyva 1999/96/EB
    dėl valstybių narių įstatymų, reglamentuojančių priemones, kurių būtina
    imtis mažinant transporto priemonėse naudojamų uždegimo suspaudimu variklių
    išmetamuosius dujinius bei kietųjų dalelių teršalus ir transporto priemonėse
    naudojamų kibirkštinio uždegimo variklių, kaip kurą vartojančių gamtines
    dujas ir suskystintas naftos dujas, išmetamuosius dujinius teršalus, suderinimo
    ir iš dalies keičianti Tarybos direktyvą 88/77/EEB
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 1999/96/KE tal-Parlament Ewropew u tal-Kunsill tat-13 ta'
    Diċembru 1999 dwar l-approssimazzjoni tal-liġijiet ta' l-Istati Membri f'dawk
    li huma miżuri li għandhom jittieħdu kontra l-ħruġ ta' tniġġis forma ta'
    gass jew partiċelli minn compression ignition engines għall-użu f'inġenji,
    u l-ħruġ ta' gassijiet li jniġġsu minn positive ignition engines li jaħdmu
    b'gass naturali jew gass tal-pitrolju likwidu għall-użu f'inġenji u li jemenda
    id-Direttiva tal-Kunsill 88/77/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 1999/96/EG van het Europees Parlement en de Raad van 13 december
    1999 inzake de onderlinge aanpassing van de wetgevingen der lidstaten met betrekking
    tot maatregelen tegen de emissie van verontreinigende gassen en deeltjes door
    voertuigmotoren met compressieontsteking en de emissie van verontreinigende gassen
    door op aardgas of vloeibaar petroleumgas lopende voertuigmotoren met elektrische
    ontsteking en tot wijziging van Richtlijn 88/77/EEG van de Raad
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 1999/96/WE Parlamentu Europejskiego i Rady z dnia 13 grudnia
    1999 r. w sprawie zbliżenia ustawodawstw Państw Członkowskich odnoszących
    się do działań, jakie mają zostać podjęte przeciwko emisji zanieczyszczeń
    gazowych i pyłowych przez silniki wysokoprężne stosowane w pojazdach oraz emisji
    zanieczyszczeń gazowych z silników z wymuszonym zapłonem napędzanych gazem
    ziemnym lub gazem płynnym stosowanych w pojazdach oraz zmieniająca dyrektywę
    Rady 88/77/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 1999/96/CE do Parlamento Europeu e do Conselho, de 13 de Dezembro
    de 1999, relativa à aproximação das legislações dos Estados-Membros respeitantes
    às medidas a tomar contra a emissão de gases e partículas poluentes provenientes
    dos motores de ignição por compressão utilizados em veículos e a emissão
    de gases poluentes provenientes dos motores de ignição comandada alimentados
    a gás natural ou a gás de petróleo liquefeito utilizados em veículos e que
    altera a Directiva 88/77/CEE do Conselho
  type: main
- language: sk
  script: Latn
  content: Smernica 1999/96/ES Európskeho parlamentu a Rady z 13. decembra 1999 o
    aproximácii právnych predpisov členských štátov vzťahujúcich sa na opatrenia,
    ktoré treba prijať proti emisiám plynných a tuhých znečisťujúcich látok
    zo vznetových motorov určených pre používanie vo vozidlách a proti emisiám
    plynných znečisťujúcich látok zo zážihových motorov poháňaných zemným
    plynom alebo skvapalneným ropným plynom určených pre používanie vo vozidlách,
    ktorou sa mení a dopĺňa smernica Rady 88/77/EEC
  type: main
- language: sl
  script: Latn
  content: Direktiva 1999/96/ES Evropskega parlamenta in Sveta z dne 13. decembra
    1999 o približevanju zakonodaje držav članic v zvezi z ukrepi, ki jih je treba
    sprejeti proti emisijam plinastih snovi in delcev, ki onesnažujejo, iz motorjev
    na kompresijski vžig, ki se uporabljajo v vozilih, ter emisijam plinastih snovi,
    ki onesnažujejo, iz motorjev na prisilni vžig, ki za gorivo uporabljajo zemeljski
    plin ali utekočinjeni naftni plin in se uporabljajo v vozilih, ter o spremembah
    Direktive Sveta 88/77/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 1999/96/CE del Parlamento Europeo y del Consejo de 13 de diciembre
    de 1999 relativa a la aproximación de las legislaciones de los Estados miembros
    sobre las medidas que deben adoptarse contra la emisión de gases y partículas
    contaminantes procedentes de motores diésel destinados a la propulsión de vehículos,
    y contra la emisión de gases contaminantes procedentes de motores de encendido
    por chispa alimentados con gas natural o gas licuado del petróleo destinados
    a la propulsión de vehículos y por la que se modifica la Directiva 88/77/CEE
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 1999/96/EG av den 13 december 1999
    om tillnärmning av medlemsstaternas lagstiftning om åtgärder mot utsläpp av
    gas- och partikelformiga föroreningar från motorer med kompressionständning
    som används i fordon samt mot utsläpp av gasformiga föroreningar från motorer
    med gnisttändning drivna med naturgas eller motorgas (LPG) vilka används i fordon
    och om ändring av rådets direktiv 88/77/EEG
  type: main
