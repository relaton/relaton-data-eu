    Mindestpreises sowie der Produktionsbeihilfe für Verarbeitungserzeugnisse aus
    Tomaten im Wirtschaftsjahr 1989/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2323/89 af 28. juli 1989 om ændring
