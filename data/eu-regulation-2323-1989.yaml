  script: Latn
  content: Commission Regulation (EEC) No 2323/89 of 28 July 1989 amending Regulation
    (EEC) No 1957/89 fixing for the 1989/90 marketing year the minimum price to be
    paid to producers for tomatoes and the amount of production aid for processed
    tomato products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2323/89 de la Commission du 28 juillet 1989 modifiant
    le règlement (CEE) n° 1957/89 fixant, pour la campagne 1989/1990, le prix minimal
    à payer aux producteurs pour les tomates ainsi que le montant de l'aide à la
    production pour les produits transformés à base de tomates
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2323/89 DER KOMMISSION vom 28. Juli 1989 zur Änderung
