title:
- language: en
  script: Latn
  content: Council Regulation (EU) 2026/456 of 26 February 2026 amending Regulation
    (EC) No 2580/2001 on specific restrictive measures directed against certain persons
    and entities with a view to combating terrorism and repealing Implementing Regulation
    (EU) 2025/1578 and Implementing Regulation (EU) 2026/420
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/456 du Conseil du 26 février 2026 modifiant le règlement
    (CE) n° 2580/2001 concernant l’adoption de mesures restrictives spécifiques
    à l’encontre de certaines personnes et entités dans le cadre de la lutte contre
    le terrorisme, et abrogeant le règlement d’exécution (UE) 2025/1578 et le
    règlement d’exécution (UE) 2026/420
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/456 des Rates vom 26. Februar 2026 zur Änderung der
    Verordnung (EG) Nr. 2580/2001 über spezifische, gegen bestimmte Personen und
    Organisationen gerichtete restriktive Maßnahmen zur Bekämpfung des Terrorismus
    und zur Aufhebung der Durchführungsverordnung (EU) 2025/1578 und der Durchführungsverordnung
    (EU) 2026/420
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2026/456 на Съвета от 26 февруари
    2026 година за изменение на Регламент (ЕО) № 2580/2001
    относно специалните ограничителни мерки за
    борба с тероризма, насочени срещу определени
    лица и образувания, и за отмяна на Регламент
    за изпълнение (ЕС) 2025/1578 и на Регламент за изпълнение
    (ЕС) 2026/420
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EU) 2026/456 ze dne 26. února 2026, kterým se mění
    nařízení (ES) č. 2580/2001 o zvláštních omezujících opatřeních namířených
    proti některým osobám a subjektům s cílem bojovat proti terorismu a zrušuje
    prováděcí nařízení (EU) 2025/1578 a (EU) 2026/420
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EU) 2026/456 af 26. februar 2026 om ændring af forordning
    (EF) nr. 2580/2001 om specifikke restriktive foranstaltninger mod visse personer
    og enheder med henblik på at bekæmpe terrorisme og om ophævelse af gennemførelsesforordning
    (EU) 2025/1578 og gennemførelsesforordning (EU) 2026/420
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2026/456 του Συμβουλίου, της
    26ης Φεβρουαρίου 2026, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2580/2001 για τη λήψη ειδικών
    περιοριστικών μέτρων κατά ορισμένων προσώπων
    και οντοτήτων με σκοπό την καταπολέμηση της
    τρομοκρατίας, και για την κατάργηση του εκτελεστικού
    κανονισμού (ΕΕ) 2025/1578 και του εκτελεστικού κανονισμού
    (ΕΕ) 2026/420
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EL) 2026/456, 26. veebruar 2026, millega muudetakse
    määrust (EÜ) nr 2580/2001 teatavate isikute ja üksuste vastu suunatud eripiirangute
    kohta terrorismivastaseks võitluseks ning tunnistatakse kehtetuks rakendusmäärus
    (EL) 2025/1578 ja rakendusmäärus (EL) 2026/420
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EU) 2026/456, annettu 26 päivänä helmikuuta 2026,
    tiettyihin henkilöihin ja yhteisöihin kohdistuvista erityisistä rajoittavista
    toimenpiteistä terrorismin torjumiseksi annetun asetuksen (EY) N:o 2580/2001
    muuttamisesta sekä täytäntöönpanoasetuksen (EU) 2025/1578 ja täytäntöönpanoasetuksen
    (EU) 2026/420 kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2026/456 ón gComhairle an 26 Feabhra 2026 lena leasaítear
    Rialachán (CE) Uimh. 2580/2001 maidir le bearta sriantacha sonracha arna ndíriú
    ar dhaoine agus eintitis áirithe d’fhonn an sceimhlitheoireacht a chomhrac
    agus lena n-aisghairtear Rialachán Cur Chun Feidhme (AE) 2025/1578 agus Rialachán
    Cur Chun Feidhme (AE) 2026/420
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EU) 2026/456 od 26. veljače 2026. o izmjeni Uredbe (EZ)
    br. 2580/2001 o posebnim mjerama ograničavanja protiv određenih osoba i subjekata
    s ciljem borbe protiv terorizma i stavljanju izvan snage Provedbene uredbe (EU)
    2025/1578 i Provedbene uredbe (EU) 2026/420
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2026/456 rendelete (2026. február 26.) a terrorizmus leküzdése
    érdekében egyes személyekkel és szervezetekkel szemben hozott különleges
    korlátozó intézkedésekről szóló 2580/2001/EK rendelet módosításáról,
    valamint az (EU) 2025/1578 végrehajtási rendelet és az (EU) 2026/420 végrehajtási
    rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/456 del Consiglio, del 26 febbraio 2026, che modifica
    il regolamento (CE) n. 2580/2001 relativo a misure restrittive specifiche, contro
    determinate persone e entità, destinate a combattere il terrorismo e che abroga
    il regolamento di esecuzione (UE) 2025/1578 e il regolamento di esecuzione (UE)
    2026/420
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (ES) 2026/456 (2026. gada 26. februāris), ar kuru groza
    Regulu (EK) Nr. 2580/2001 par īpašiem ierobežojošiem pasākumiem, kas terorisma
    apkarošanas nolūkā vērsti pret konkrētām personām un organizācijām, un
    ar kuru atceļ Īstenošanas regulu (ES) 2025/1578 un Īstenošanas regulu (ES)
    2026/420
  type: main
- language: lt
  script: Latn
  content: 2026 m. vasario 26 d. Tarybos reglamentas (ES) 2026/456, kuriuo iš dalies
    keičiamas Reglamentas (EB) Nr. 2580/2001 dėl specialių ribojančių priemonių,
    taikomų tam tikriems asmenims ir subjektams siekiant kovoti su terorizmu, ir
    panaikinami Įgyvendinimo reglamentas (ES) 2025/1578 bei Įgyvendinimo reglamentas
    (ES) 2026/420
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (UE) 2026/456 tas-26 ta’ Frar 2026 li jemenda
    r-Regolament (KE) Nru 2580/2001 dwar miżuri restrittivi speċifiċi diretti kontra
    ċerti persuni u entitajiet bl-għan li jiġi miġġieled t-terroriżmu u li jħassar
    ir-Regolament ta’ Implimentazzjoni (UE) 2025/1578 u r-Regolamenti ta’ Implimentazzjoni
    (UE) 2026/420
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/456 van de Raad van 26 februari 2026 tot wijziging
    van Verordening (EG) nr. 2580/2001 inzake specifieke beperkende maatregelen tegen
    bepaalde personen en entiteiten met het oog op de strijd tegen het terrorisme,
    en tot intrekking van Uitvoeringsverordening (EU) 2025/1578 en Uitvoeringsverordening
    (EU) 2026/420
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (UE) 2026/456 z dnia 26 lutego 2026 r. zmieniające
    rozporządzenie (WE) nr 2580/2001 w sprawie szczególnych środków restrykcyjnych
    skierowanych przeciwko niektórym osobom i podmiotom mających na celu zwalczanie
    terroryzmu i uchylające rozporządzenie wykonawcze (UE) 2025/1578 i rozporządzenie
    wykonawcze (UE) 2026/420
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2026/456 do Conselho, de 26 de fevereiro de 2026, que
    altera o Regulamento (CE) n.° 2580/2001 relativo a medidas restritivas específicas
    de combate ao terrorismo dirigidas contra determinadas pessoas e entidades, e
    que revoga o Regulamento de Execução (UE) 2025/1578 e o Regulamento de Execução
    (UE) 2026/420
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/456 al Consiliului din 26 februarie 2026 de modificare
    a Regulamentului (CE) nr. 2580/2001 privind măsuri restrictive specifice îndreptate
    împotriva anumitor persoane și entități în vederea combaterii terorismului
    și de abrogare a Regulamentului de punere în aplicare (UE) 2025/1578 și a Regulamentului
    de punere în aplicare (UE) 2026/420
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (EÚ) 2026/456 z 26. februára 2026, ktorým sa mení nariadenie
    (ES) č. 2580/2001 o určitých obmedzujúcich opatreniach zameraných proti určitým
    osobám a subjektom s cieľom boja proti terorizmu a ktorým sa zrušuje vykonávacie
    nariadenie (EÚ) 2025/1578 a vykonávacie nariadenie (EÚ) 2026/420
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (EU) 2026/456 z dne 26. februarja 2026 o spremembi Uredbe
    (ES) št. 2580/2001 o posebnih omejevalnih ukrepih za nekatere osebe in subjekte
    zaradi boja proti terorizmu ter razveljavitvi Izvedbene uredbe (EU) 2025/1578
    in Izvedbene uredbe (EU) 2026/420
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2026/456 del Consejo, de 26 de febrero de 2026, por el
    que se modifica el Reglamento (CE) n.° 2580/2001 sobre medidas restrictivas específicas
    dirigidas a determinadas personas y entidades con el fin de luchar contra el terrorismo
    y se derogan el Reglamento de Ejecución (UE) 2025/1578 y el Reglamento de Ejecución
    (UE) 2026/420
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EU) 2026/456 av den 26 februari 2026 om ändring av
    förordning (EG) nr 2580/2001 om särskilda restriktiva åtgärder mot vissa personer
    och enheter i syfte att bekämpa terrorism, och om upphävande av genomförandeförordning
    (EU) 2025/1578 och genomförandeförordning (EU) 2026/420
