title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/2452 of 21 December 2017 renewing
    the authorisation for the placing on the market of products containing, consisting
    of, or produced from genetically modified maize 1507 (DAS-Ø15Ø7-1) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2017) 9044)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/2452 de la Commission du 21 décembre
    2017 renouvelant l'autorisation de mise sur le marché de produits contenant du
    maïs génétiquement modifié 1507 (DAS-Ø15Ø7-1), consistant en ce maïs ou
    produits à partir de celui-ci, en application du règlement (CE) n° 1829/2003
    du Parlement européen et du Conseil [notifiée sous le numéro C(2017) 9044]
  type: main
- language: de
  script: Latn
