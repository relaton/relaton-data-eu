    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu 1507 (DAS-Ø15Ø7-1),
    sastāv vai ir ražoti no tās (izziņots ar dokumenta numuru C(2017) 9044)
  type: main
- language: lt
  script: Latn
  content: 2017 m. gruodžio 21 d. Komisijos įgyvendinimo sprendimas (ES) 2017/2452,
