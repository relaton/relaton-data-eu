    1507 (DAS-Ø15Ø7-1) nos termos do Regulamento (CE) n.° 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2017) 9044]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/2452 a Comisiei din 21 decembrie
    2017 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau din sau sunt fabricate din porumbul modificat genetic 1507 (DAS-Ø15Ø7-1)
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2017) 9044]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/2452 z 21. decembra 2017, ktorým
