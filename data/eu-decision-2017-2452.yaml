    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu 1507 (DAS-Ø15Ø7-1), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2017) 9044]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/2452 z dne 21. decembra 2017 o obnovitvi
