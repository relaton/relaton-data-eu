    mais 1507 (DAS-Ø15Ø7-1) overeenkomstig Verordening (EG) nr. 1829/2003 van het
    Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2017) (9044)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/2452 z dnia 21 grudnia 2017 r. odnawiająca
