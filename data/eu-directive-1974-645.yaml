title:
- language: en
  script: Latn
  content: Council Directive 74/645/EEC of 9 December 1974 extending the period within
    which the Kingdom of Denmark may implement Directive No 72/160/EEC, concerning
    measures to encourage the cessation of farming and the reallocation of utilized
    agricultural area for the purposes of structural improvement
  type: main
- language: fr
  script: Latn
  content: Directive 74/645/CEE du Conseil, du 9 décembre 1974, prorogeant, pour
    le Royaume de Danemark, le délai pour la mise en oeuvre de la directive 72/160/CEE
    concernant l'encouragement à la cessation de l'activité agricole et à l'affectation
    de la superficie agricole utilisée à des fins d'amélioration des structures
  type: main
- language: de
  script: Latn
  content: Richtlinie 74/645/EWG des Rates vom 9. Dezember 1974 zur Verlängerung
    der Frist für das Königreich Dänemark zur Inkraftsetzung der Richtlinie 72/160/EWG
    zur Förderung der Einstellung der landwirtschaftlichen Erwerbstätigkeit und
    der Verwendung der landwirtschaftlich genutzten Fläche für Zwecke der Strukturverbesserung
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 74/645/EØF af 9. december 1974 om forlængelse af fristen
    for gennemførelse af Rådets direktiv 72/160/EØF om støtte til ophør af landbrugsvirksomhed
    og til anvendelse af udnyttet landbrugsareal til strukturforbedringsformål,for
    så vidt angår kongeriget i Danmark
  type: main
- language: el
  script: Grek
  content: Οδηγία 74/645/EOK του Συμβουλίου της 9ης Δεκεμβρίου
    1974 περί παρατάσεως της προθεσμίας για την εφαρμογή
    της οδηγίας 72/160/EOK περί της ενθαρρύνσεως για
    την παύση της γεωργικής δραστηριότητος και
    για τη διάθεση της γεωργικής εκτάσεως που χρησιμοποιείται
    προς βελτίωση των διαρθρώσεων στο Βασίλειο
    της Δανίας
  type: main
- language: it
  script: Latn
  content: Direttiva 74/645/CEE del Consiglio, del 9 dicembre 1974, che proroga, per
    il Regno di Danimarca, il termine per la messa in vigore della direttiva 72/160/CEE,
    concernente l'incoraggiamento alla cessazione dell'attività agricola ed alla
    destinazione della superficie agricola utilizzata a scopi di miglioramento delle
    strutture
  type: main
- language: nl
  script: Latn
  content: Richtlijn 74/645/EEG van de Raad van 9 december 1974 betreffende de verlenging,
    voor het Koninkrijk Denemarken, van de termijn voor de tenuitvoerlegging van Richtlijn
    nr. 72/160/EEG ter bevordering van de bedrijfsbeëindiging in de landbouw en van
    de aanwending van cultuurgrond tot verbetering van de structuur
  type: main
- language: es
  script: Latn
  content: Directiva 74/645/CEE del Consejo, de 9 de diciembre de 1974, por la que
