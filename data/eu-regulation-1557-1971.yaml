title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1557/71 du Conseil, du 19 juillet 1971, prévoient
    des mesures spéciales pour l'attribution des opérations de transformation de
    tomates, de poires et de pêches ayant fait l'objet de mesures d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1557/71 des Rates vom 19. Juli 1971 über Sondermaßnahmen
    für die Vergabe von Aufträgen zur Verarbeitung von Tomaten, Birnen und Pfirsichen,
    die Gegenstand von Interventionsmaßnahmen waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1557/71 del Consiglio, del 19 luglio 1971, che stabilisce
    misure speciali per l'assegnazione delle operazioni di trasformazione di pomodori,
    di pere e di pesche che hanno formato oggetto di misure d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1557/71 van de Raad van 19 juli 1971 houdende vaststelling
    van bijzondere maatregelen voor het aanbesteden van de verwerking van tomaten,
    peren en perziken waarop interventiemaatregelen zijn toegepast
  type: main
