title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2862/81 of 2 October 1981 re-establishing
    the levying of customs duties on methanol (methyl alcohol), falling within subheading
    29.04 A I and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2862/81 de la Commission, du 2 octobre 1981, portant
    rétablissement de la perception des droits de douane applicables au méthanol
    (alcool méthylique) de la sous-position 29.04 A I du tarif douanier commun, originaire
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2862/81 der Kommission vom 2. Oktober 1981 zur Wiedereinführung
    der Erhebung der Zölle für Methanol (Methylalkohol) der Tarifstelle 29.04 A
    I, mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2862/81 af 2. oktober 1981 om genindførelse
    af opkrævning af told for methanol (methylalkohol) henhørende under pos. 29.04
    A I og med oprindelse i Mexico, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
