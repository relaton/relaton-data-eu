    από τόν κανονισμό (EOK) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2862/81 della Commissione, del 2 ottobre 1981, che
    ripristina la riscossione dei dazi doganali applicabili al metanolo (alcole metilico),
    della sottovoce 29.04 A I della tariffa doganale comune, originario del Messico
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
