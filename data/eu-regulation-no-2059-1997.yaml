  content: COMMISSION REGULATION (EC) No 2059/97 of 20 October 1997 determining the
    extent to which applications lodged in October 1997 for import certificates for
    certain cheeses covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2059/97 DE LA COMMISSION du 20 octobre 1997 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1997 pour certains fromages dans le cadre du régime prévu par les
    accords européens conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2059/97 DER KOMMISSION vom 20. Oktober 1997 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im Oktober
    1997 für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Europa-Abkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2059/97 af 20. oktober 1997 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i oktober 1997 for
    visse oste kan imødekommes under den ordning, der er fastsat i Europaaftalerne
    mellem Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
