id: EUDecision197773
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 29 November 1976 authorizing the Federal Republic
    of Germany not to apply Community treatment to certain under garments, knitted
    or crocheted, not elastic or rubberized, of cotton or of other textile materials
    - men's and boys' pyjamas, women's, girls' and infants' pyjamas and nightdresses,
    falling within heading No ex 60.04 of the Common Customs Tariff, originating in
    Hong Kong and in free circulation in the Netherlands
  type: main
- language: fr
  script: Latn
  content: '77/73/CEE: Décision de la Commission, du 29 novembre 1976, autorisant
    la République fédérale d''Allemagne à exclure du traitement communautaire
    certains sous- vêtements de bonneterie non élastique ni caoutchoutée, de coton
    ou d''autres matières textiles, pyjamas pour hommes et garçonnets, pyjamas et
    chemises de nuit pour femmes, fillettes et jeunes enfants, de la position Ex 60.04
    du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique aux
    Pays-Bas'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 29. November 1976, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Hongkong stammende und in den Niederlanden im
    freien Verkehr befindliche verschiedene Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert, aus Baumwolle oder anderen Spinnfasern: Schlafanzüge für
    Männer und Knaben, Schlafanzüge und Nachthemden für Frauen, Mädchen und Kleinkinder,
    der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens Beslutning af 29. november 1976 om bemyndigelse af Forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage følgende underbeklædningsgenstande
    af trikotage, ikke elastisk eller gummeret, af bomuld eller af andre tekstilmaterialer:
    pyjmaser til mænd og drenge samt natbeklædning til kvinder, piger og småbørn,
    som henhører under pos. ex 60.04 i den fælles toldtarif, har oprindelse i Hongkong
    og frit kan omsættes i Nederlandene'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 29 novembre 1976, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario talune sottovesti
    a maglia non elastica né gommata di cotone o di altre materie tessili, pigiami
    per uomo e per ragazzo, pigiami e camicie da notte per donna, per ragazza e per
    bambini, della voce ex 60.04 della tariffa doganale comune, originari di Hong
    Kong e messi in libera pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 29 november 1976 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bepaalde onderkleding van niet-elastisch of van niet-gegummeerd
    brei- of haakwerk, van katoen of van andere textielstoffen: pyama''s voor heren
    en jongens, pyama''s en nachthemden voor dames, meisjes en kinderen, van post
    ex 60.04 van het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en
    in Nederland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
