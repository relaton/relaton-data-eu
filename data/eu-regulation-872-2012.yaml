title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 872/2012 of 1 October 2012 adopting
    the list of flavouring substances provided for by Regulation (EC) No 2232/96 of
    the European Parliament and of the Council, introducing it in Annex I to Regulation
    (EC) No 1334/2008 of the European Parliament and of the Council and repealing
    Commission Regulation (EC) No 1565/2000 and Commission Decision 1999/217/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 872/2012 de la Commission du 1 er octobre
    2012 portant adoption de la liste de substances aromatisantes prévue par le règlement
    (CE) n ° 2232/96 du Parlement européen et du Conseil, introduction de ladite
    liste dans l’annexe I du règlement (CE) n ° 1334/2008 du Parlement européen
    et du Conseil et abrogation du règlement (CE) n ° 1565/2000 de la Commission
    et de la décision 1999/217/CE de la Commission
  type: main
