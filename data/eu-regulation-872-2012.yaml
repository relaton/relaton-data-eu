    2012 zur Festlegung der Liste der Aromastoffe gemäß der Verordnung (EG) Nr.
    2232/96 des Europäischen Parlaments und des Rates, zur Aufnahme dieser Liste
    in Anhang I der Verordnung (EG) Nr. 1334/2008 des Europäischen Parlaments und
    des Rates sowie zur Aufhebung der Verordnung (EG) Nr. 1565/2000 der Kommission
    und der Entscheidung 1999/217/EG der Kommission
