title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2800/79 of 10 December 1979 opening and providing
    for the administration of a Community preferential ceiling for certain petroleum
    products refined in Turkey and establishing Community supervision of imports thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2800/79 du Conseil, du 10 décembre 1979, portant
    ouverture et mode de gestion d' un plafond communautaire préférentiel pour certains
    produits pétroliers raffinés en Turquie et établissant une surveillance communautaire
    des importations de ces produits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2800/79 des Rates vom 10. Dezember 1979 zur Eröffnung
    und Verwaltung eines präferentiellen Gemeinschaftsplafonds für bestimmte in
    der Türkei raffinierte Erdölerzeugnisse und zur Einrichtung einer gemeinschaftlichen
    Überwachung der Einfuhren dieser Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2800/79 af 10. december 1979 om fastsættelse
    og forvaltning af et fællesskabspræferenceloft for visse jordolieprodukter raffineret
    i Tyrkiet og om indførelse af fællesskabstilsyn med indførsler af disse produkter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2800/79 del Consiglio, del 10 dicembre 1979, recante
    apertura e modalità di gestione di un massimale comunitario preferenziale per
    taluni prodotti petroliferi raffinati in Turchia e stabilisce una sorveglianza
    comunitaria sulle importazioni di tali prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2800/79 van de Raad van 10 december 1979 betreffende
    de opening en de wijze van beheer van een preferentieel communautair maximum voor
    bepaalde in Turkije geraffineerde aardolieprodukten, en de instelling van een
    communautair toezicht op de invoer van deze produkten
