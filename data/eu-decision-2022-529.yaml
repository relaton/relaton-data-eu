    stavljanja na tržište proizvoda koji sadržavaju genetski modificiranu uljanu
    repicu 73496 (DP-Ø73496-4) ili se sastoje ili su proizvedeni od nje, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2022) 1868) (Vjerodostojan je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/529 végrehajtási határozata (2022. március 31.)
    a géntechnológiával módosított 73496 olajrepcét (DP-Ø73496-4) tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2022) 1868. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/529 della Commissione del 31 marzo 2022
    che autorizza l’immissione in commercio di prodotti contenenti, costituiti o
    derivati da colza geneticamente modificata 73496 (DP-Ø73496-4) in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2022)1868] (Il testo in lingua neerlandese è il solo facente
    fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/529 (2022. gada 31. marts), ar
    ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu rapsi 73496 (DP-Ø73496-4),
    no tā sastāv vai ir no tā ražoti (izziņots ar dokumenta numuru C(2022) 1868)
    (Autentisks ir tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/529 2022 m. kovo 31 d. kuriuo
