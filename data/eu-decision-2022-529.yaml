    povolení uvedení produktů, které obsahují geneticky modifikovanou řepku
    olejnou 73496 (DP-Ø73496-4), sestávají z ní nebo jsou z ní vyrobeny, na trh
    podle nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno
    pod číslem C(2022) 1868) (Pouze nizozemské znění je závazné)
  type: main
