  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/529 ón gCoimisiún an 31 Márta 2022
    lena n-údaraítear táirgí ina bhfuil, arb í atá iontu nó a tháirgtear as
    ola ráibe ghéinmhodhnaithe 73496 (DP-Ø73496-4) a chur ar an margadh de bhun
    Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na hEorpa agus ón gComhairle (a
