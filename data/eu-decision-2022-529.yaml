title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/529 of 31 March 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified oilseed rape 73496 (DP-Ø73496-4) pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2022) 1868) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/529 de la Commission du 31 mars 2022
    autorisant la mise sur le marché de produits contenant du colza génétiquement
    modifié 73496 (DP-Ø73496-4), consistant en ce colza ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2022) 1868] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/529 der Kommission vom 31. März 2022
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Raps 73496 (DP-Ø73496-4) enthalten, aus ihm bestehen oder aus ihm gewonnen werden,
    gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des
    Rates (Bekannt gegeben unter Aktenzeichen C(2022) 1868) (Nur der niederländische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
