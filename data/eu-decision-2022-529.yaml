    er fremstillet af genetisk modificeret 73496-raps (DP-Ø73496-4), i henhold til
    Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer
    C(2022) 1868) (Kun den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
