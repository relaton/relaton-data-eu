    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų rapsų
    73496 (DP-Ø73496–4) arba kurie iš jų sudaryti ar pagaminti (pranešta dokumentu
    Nr. C(2022) 1868) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
