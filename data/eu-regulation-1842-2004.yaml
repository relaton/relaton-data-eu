    jako chráněné označení původu podle nařízení Rady (EHS) č. 2081/92,
    a nezapsaného názvu „Münster Käse“, označujícího místo v Německu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1842/2004 af 22. oktober 2004 om samtidig
