    съществуване на наименованието „Munster или Munster-Géromé“,
    регистрирано като защитено наименование за
    произход съгласно Регламент (ЕИО) № 2081/92 на
    Съвета и нерегистрираното наименование „Münster
    Käse“, обозначаващо място в Германия
  type: main
