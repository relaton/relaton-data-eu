  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1842/2004 della Commissione, del 22 ottobre 2004, che
    autorizza la coesistenza della denominazione «Munster o Munster-Géromé» registrata
    come denominazione d’origine protetta ai sensi del regolamento (CEE) n. 2081/92
    del Consiglio e della denominazione non registrata Münster Käse che designa
    una località in Germania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1842/2004 (2004. gada 22. oktobris), ar ko atļauj
