    (EEK) Nr. 2081/92 reģistrēts kā aizsargāts cilmes vietas nosaukums, un nereģistrētā
    nosaukuma “Münster Käse” ar vietas norādi Vācijā līdzāspastāvēšanu
  type: main
- language: lt
  script: Latn
  content: 2004 m. spalio 22 d. Komisijos reglamentas (EB) Nr. 1842/2004, leidžiantis
