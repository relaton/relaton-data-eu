title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1842/2004 of 22 October 2004 allowing the
    coexistence of the name ‘Munster or Munster-Géromé’ registered as a Protected
    Designation of Origin under Council Regulation (EEC) No 2081/92 and the unregistered
    name ‘Münster Käse’ designating a place in Germany
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1842/2004 de la Commission du 22 octobre 2004 autorisant
    la coexistence de la dénomination «Munster ou Munster-Géromé» enregistrée
    au titre du règlement (CEE) n° 2081/92 en tant qu’appellation d’origine
    protégée et de la dénomination non enregistrée «Münster Käse» désignant
    un lieu en Allemagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1842/2004 der Kommission vom 22. Oktober 2004 zur Genehmigung
    des gemeinsamen Weiterbestehens der im Rahmen der Verordnung (EWG) Nr. 2081/92
    als geschützte Ursprungsbezeichnung eingetragenen Bezeichnung „Munster ou Munster-Géromé“
    und der nicht eingetragenen, einen Ort in Deutschland bezeichnenden Bezeichnung
    „Münster Käse“
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1842/2004 на Комисията от 22
