title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 611/93 of 15 March 1993 imposing a definitive
    anti-dumping duty on imports into the Community of certain electronic microcircuits
    known as DRAMs originating in the Republic of Korea and exported by companies
    not exempted from this duty, and collecting definitively the provisional anti-dumping
    duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 611/93 du Conseil, du 15 mars 1993, instituant un
    droit antidumping définitif sur les importations dans la Communauté de certains
    microcircuits électroniques dits «DRAM» originaires de la République de Corée
    et exportés par les sociétés non exemptées de ce droit, et portant perception
    définitive du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 611/93 des Rates vom 15. März 1993 zur Einführung
    eines endgültigen Antidumpingzolls auf Einfuhren elektronischer Mikroschaltungen
    ("DRAMs") mit Ursprung in der Republik Korea, die von zollpflichtigen Unternehmen
    exportiert werden, und zur endgültigen Vereinnahmung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 611/93 af 15. marts 1993 om indførelse af
    en endelig antidumpingtold på import i Fællesskabet af visse elektroniske mikrokredsløb,
    såkaldte DRAMs, med oprindelse i Republikken Korea og eksporteret af selskaber,
    der ikke er fritaget for denne told, og om endelig opkrævning af den midlertidige
    antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 611/93 του Συμβουλίου
    της 15ης Μαρτίου 1993 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές στην Κοινότητα
    ορισμένων τύπων ηλεκτρονικών μικροκυκλωμάτων
    γνωστών ως DRAM, καταγωγής Δημοκρατίας της Κορέας
    και εξαγόμενων από εταιρείες που δεν απαλλάσσονται
    από το δασμό αυτό, και περί οριστικής είσπραξης
    του προσωρινού δασμού αντιντάμπινγκ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 611/93, annettu 15 päivänä maaliskuuta 1993,
    lopullisen polkumyyntitullin käyttöön ottamisesta tiettyjen Korean tasavallasta
    peräisin olevien, tästä tullista vapauttamattomien yhtiöiden viemien elektronisten
    mikropiirien, niin sanottujen DRAMien, tuonnissa yhteisöön ja väliaikaisen
    polkumyyntitullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 611/93 del Consiglio, del 15 marzo 1993, che istituisce
    un dazio antidumping definitivo sulle importazioni nella Comunità di alcuni tipi
    di microcircuiti elettronici detti DRAM originari della repubblica di Corea ed
    esportati da società non esenti dal dazio e che decide la riscossione definitiva
    del dazio antidumping provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 611/93 van de Raad van 15 maart 1993 tot instelling
    van een definitief anti-dumpingrecht op de invoer in de Gemeenschap van bepaalde
    soorten elektronische microschakelingen, DRAM's genaamd, van oorsprong uit de
    Republiek Korea, die worden uitgevoerd door ondernemingen welke niet van dit recht
    zijn vrijgesteld, en tot definitieve inning van het voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 611/93 do Conselho, de 15 de Março de 1993, que
    cria um direito anti-dumping definitivo sobre certas importações na Comunidade
    de microcircuitos electrónicos conhecidos por DRAM originários da República
    da Coreia e exportados por empresas não isentas desse direito e que determina
    a cobrança definitiva do direito anti-dumping provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 611/93 del Consejo, de 15 de marzo de 1993, por el
    que se establece un derecho antidumping definitivo sobre las importaciones en
    la Comunidad de determinados tipos de microcircuitos electrónicos denominados
    DRAM, originarios de la República de Corea y exportados por compañías no exentas
    de este derecho y por el que se recauda definitivamente el derecho antidumping
    provisional
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 611/93 av den 15 mars 1993 om införande av
    en slutgiltig antidumpningstull på import till gemenskapen av vissa elektroniska
    mikrokretsar av DRAM-typ med ursprung i Sydkorea och som exporteras av företag
    som inte är befriade från denna tull, samt om slutgiltigt uttag av den preliminära
    antidumpningstullen
  type: main
