  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3019/91 della Commissione, del 15 ottobre 1991, relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'intervento e destinate all'esportazione
    in Unione Sovietica, che modifica il regolamento (CEE) n. 569/88 e che reca abrogazione
    del regolamento (CEE) n. 2363/91
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3019/91 van de Commissie van 15 oktober 1991 betreffende
