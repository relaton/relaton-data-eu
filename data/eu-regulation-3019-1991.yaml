title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3019/91 of 15 October 1991 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for export to the Soviet Union, amending Regulation
    (EEC) No 569/88 and repealing Regulation (EEC) No 2363/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3019/91 de la Commission, du 15 octobre 1991, relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées vers l'Union soviétique, modifiant le règlement (CEE) n
    569/88 et abrogeant le règlement (CEE) n 2363/91
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3019/91 der Kommission vom 15. Oktober 1991 über
    den Verkauf von zur Ausfuhr in die Sowjetunion bestimmtem Rindfleisch aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 2363/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3019/91 af 15. oktober 1991 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på eksport til Sovjetunionen, om ændring af forordning (EØF) nr.
    569/88, og om ophævelse af forordning (EØF) nr. 2363/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3019/91 της Επιτροπής
