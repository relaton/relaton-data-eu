title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 223/76 of 30 January 1976 setting up a system
    linking imports of beef and veal products effected by way of protective measures
    with the sale of preserved beef held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 223/76 de la Commission, du 30 janvier 1976, instituant
    un régime de jumelage de l'importation de produits du secteur de la viande bovine
    au titre de mesures de sauvegarde avec la vente de conserves de viandes bovines
    détenues par les organismes d'intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 223/76 der Kommission vom 30. Januar 1976 zur Einführung
    der Koppelung der Einfuhr von Erzeugnissen des Rindfleischsektors im Rahmen von
    Schutzmaßnahmen mit dem Absatz von Rindfleischkonserven aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 223/76 af 30. januar 1976 om indførelse
    - som beskyttelsesforanstaltning - af en ordning med kobling af indførsel af
    varer henhørende under oksekødsektoren med salg af konserves af oksekød, som
    interventionsorganerne ligger inde med
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 223/76 della Commissione, del 30 gennaio 1976, che
    istituisce un regime di abbinamento tra l'importazione di prodotti del settore
    delle carni bovine nel quadro delle misure di salvaguardia e la vendita di conserve
    di carni bovine detenute dagli organismi d'intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 223/76 van de Commissie van 30 januari 1976 tot instelling
    van een regeling voor de koppeling van de invoer van produkten van de sector rundvlees
    in het kader van de vrijwaringsmaatregelen aan de verkoop van rundvleesconserven
    uit interventievoorraden
  type: main
