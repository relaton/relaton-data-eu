    entre el 1 de noviembre de 1987 y el 31 de diciembre de 1991, el importe adicional
    que habrá de deducirse de la exacción reguladora aplicable a la importación
    de aceite de oliva sin tratar originario de Argelia en la Comunidad (91/161/CEE)
