    Gemeenschap en de Democratische Volksrepubliek Algerije tot vaststelling, voor
    het tijdvak van 1 november 1987 tot en met 31 december 1991, van het aanvullend
    bedrag dat in mindering moet worden gebracht op de heffing die bij invoer in de
