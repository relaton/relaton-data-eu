    Οικονομικής Κοινότητας και της Λαϊκής Δημοκρατίας
    της Αλγερίας που καθορίζει, για την περίοδο
    από 1ης Νοεμβρίου 1987 μέχρι 31 Δεκεμβρίου 1991,
    το πρόσθετο ποσό που πρέπει να αφαιρείται από
