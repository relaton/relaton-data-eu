    καταγωγής Αλγερίας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO del 21 marzo 1991 relativa alla conclusione dell''
    accordo in forma di scambio di lettere tra la Comunità economica europea e la
    Repubblica democratica popolare d'' Algeria, che fissa, per il periodo 1o novembre
    1987 - 31 dicembre 1991, l'' importo aggiuntivo da detrarre dal prelievo applicabile
    all'' importazione nella Comunità di olio d'' oliva non trattato originario dell''
    Algeria (91/161/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE RAAD van 21 maart 1991 betreffende de sluiting van een
