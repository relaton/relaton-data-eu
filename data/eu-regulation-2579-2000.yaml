title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2579/2000 of 17 November 2000 amending Regulation
    (EC) No 2742/1999 fixing, for 2000, the fishing opportunities and associated conditions
    for certain fish stocks and groups of fish stocks applicable in Community waters
    and, for Community vessels, in waters subject to catch limits
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2579/2000 du Conseil du 17 novembre 2000 modifiant
    le règlement (CE) nº 2742/1999 établissant, pour 2000, les possibilités de
    pêche et les conditions associées pour certains stocks halieutiques et groupes
    de stocks halieutiques, applicables dans les eaux communautaires et, pour les
    navires communautaires, dans des eaux soumises à des limitations de capture
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2579/2000 des Rates vom 17. November 2000 zur Änderung
    der Verordnung (EG) Nr. 2742/1999 zur Festlegung - für das Jahr 2000 - der Fangmöglichkeiten
    und Fangbedingungen für bestimmte Fischbestände und Bestandsgruppen in den Gemeinschaftsgewässern
    und für die Gemeinschaftsschiffe in Gewässern mit Fangbeschränkungen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2579/2000 af 17. november 2000 om ændring
    af forordning (EF) nr. 2742/1999 om fastsættelse for år 2000 af fiskerimuligheder
    og dertil knyttede betingelser for visse fiskebestande og grupper af fiskebestande
    gældende for EF-farvande og for EF-fartøjer i andre farvande, som er omfattet
    af fangstbegrænsninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2579/2000 του Συμβουλίου,
    της 17ης Νοεμβρίου 2000, για τροποποίηση του κανονισμού
    (ΕΚ) αριθ. 2742/1999 περί καθορισμού, για το 2000, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των αλιευτικών δυνατοτήτων και συναφών
    όρων στα κοινοτικά ύδατα και, για τα κοινοτικά
    σκάφη, σε άλλα ύδατα όπου απαιτούνται περιορισμοί
    αλιευμάτων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2579/2000, annettu 17 päivänä marraskuuta
    2000, yhteisön vesialueilla ja yhteisön aluksiin sellaisilla muilla vesialueilla,
    joilla sovelletaan saalisrajoituksia, sovellettavien eräiden kalakantojen ja
    kalakantaryhmien kalastusmahdollisuuksien ja niihin liittyvien edellytysten vahvistamisesta
    vuodeksi 2000 annetun asetuksen (EY) N:o 2742/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2579/2000 del Consiglio, del 17 novembre 2000, recante
    modifica del regolamento (CE) n. 2742/1999 che stabilisce, per il 2000, le possibilità
    di pesca e le condizioni ad esse associate per alcuni stock o gruppi di stock
    ittici, applicabili nelle acque comunitarie e, per le navi comunitarie, in altre
    acque dove sono imposti limiti di cattura
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2579/2000 van de Raad van 17 november 2000 houdende
    wijziging van Verordening (EG) nr. 2742/1999 voor het jaar 2000, van de vangstmogelijkheden
    die gelden voor bepaalde visbestanden en groepen visbestanden in de wateren van
    de Gemeenschap en, wat vaartuigen van de Gemeenschap betreft, in andere wateren
    met vangstbeperkingen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2579/2000 do Conselho, de 17 de Novembro de 2000,
    que altera o Regulamento (CE) n.o 2742/1999 que fixa, para 2000, em relação
    a determinadas unidades populacionais de peixes ou grupos de unidades populacionais
    de peixes, as possibilidades de pesca e as respectivas condições aplicáveis
    nas águas comunitárias e, para os navios de pesca comunitários, nas águas
    em que são necessárias limitações das capturas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2579/2000 del Consejo, de 17 de noviembre de 2000,
    que modifica el Reglamento (CE) nº 2742/1999 por el que se establecen, para el
    año 2000, las posibilidades de pesca y las condiciones correspondientes para
    determinadas poblaciones y grupos de poblaciones de peces, aplicables en aguas
    comunitarias y, en el caso de los buques comunitarios, en las demás aguas donde
    sean necesarias limitaciones de capturas
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2579/2000 av den 17 november 2000 om ändring
    av förordning (EG) nr 2742/1999 om fastställande för år 2000 av fiskemöjligheter
    och därmed förbundna villkor för vissa fiskbestånd och grupper av fiskbestånd,
    som skall tillämpas i gemenskapens vatten och, för gemenskapens fartyg, i andra
    vatten där fångstbegränsningar krävs
  type: main
