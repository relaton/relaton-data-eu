id: EUDirective200669
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 2006/69/EC of 24 July 2006 amending Directive 77/388/EEC
    as regards certain measures to simplify the procedure for charging value added
    tax and to assist in countering tax evasion or avoidance, and repealing certain
    Decisions granting derogations
  type: main
- language: fr
  script: Latn
  content: Directive 2006/69/CE du Conseil du 24 juillet 2006 modifiant la directive
    77/388/CEE en ce qui concerne certaines mesures visant à simplifier la perception
    de la taxe sur la valeur ajoutée et à lutter contre la fraude et l’évasion
    fiscales, et abrogeant certaines décisions accordant des dérogations
  type: main
- language: de
  script: Latn
  content: Richtlinie 2006/69/EG des Rates vom 24. Juli 2006 zur Änderung der Richtlinie
    77/388/EWG hinsichtlich bestimmter Maßnahmen zur Bekämpfung der Steuerhinterziehung
    oder -umgehung, zur Vereinfachung der Erhebung der Mehrwertsteuer sowie zur Aufhebung
    bestimmter Entscheidungen über die Genehmigung von Ausnahmeregelungen
  type: main
- language: bg
  script: Cyrl
  content: Директива 2006/69/ЕО на Съвета от 24 юли 2006 година
    за изменение на Директива 77/388/ЕИО по отношение
    на някои мерки за опростяване на процедурата
    за начисляване на данък добавена стойност
    и за подпомагане на борбата срещу избягване
    на данъчно облагане, и за отмяна на някои решения
    за предоставяне на дерогации
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2006/69/ES ze dne 24. července 2006 , kterou se mění
    směrnice 77/388/EHS, pokud jde o některá opatření, která mají zjednodušit
    postup vyměřování daně z přidané hodnoty a napomoci zabránit daňovým
    únikům a vyhýbání se daňovým povinnostem, a kterou se zrušují některá
    rozhodnutí o udělení odchylek
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2006/69/EF af 24. juli 2006 om ændring af direktiv 77/388/EØF
    med hensyn til visse foranstaltninger, der skal forenkle momsopkrævningen og
    bidrage til at bekæmpe svig eller unddragelse og om ophævelse af visse beslutninger
    om at tillade fravigelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 2006/69/ΕΚ του Συμβουλίου, της 24ης Ιουλίου
    2006 , για τροποποίηση της οδηγίας 77/388/ΕΟΚ όσον
    αφορά ορισμένα μέτρα που αποσκοπούν να απλουστεύσουν
    τη διαδικασία επιβολής του φόρου προστιθέμενης
    αξίας και να συνδράμουν στην πάταξη της φοροδιαφυγής
    ή φοροαποφυγής, και για την κατάργηση ορισμένων
    αποφάσεων χορήγησης παρεκκλίσεων
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 2006/69/EÜ, 24. juuli 2006 , millega muudetakse direktiivi
    77/388/EMÜ teatavate meetmete osas, mille eesmärk on lihtsustada käibemaksustamise
    menetlust ja aidata ära hoida maksudest kõrvalehoidumist või maksustamise vältimist
    ning millega tunnistatakse kehtetuks teatavaid erandeid lubavad otsused
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2006/69/EY, annettu 24 päivänä heinäkuuta 2006
    , direktiivin 77/388/ETY muuttamisesta tiettyjen arvonlisäveron kantamisen yksinkertaistamiseen
    ja veropetosten tai veron kiertämisen estämiseen tähtäävien toimenpiteiden
    osalta sekä tiettyjen poikkeuslupapäätösten kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/69/EK irányelve ( 2006. július 24. ) a 77/388/EGK irányelvnek
    a hozzáadottérték-adó kivetésére vonatkozó eljárás egyszerűsítése,
    illetve az adókijátszás vagy adókikerülés megakadályozására szolgáló
    egyes intézkedések tekintetében történő módosításáról, valamint egyes,
    eltéréseket biztosító határozatok hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 2006/69/CE del Consiglio, del 24 luglio 2006 , che modifica la
    direttiva 77/388/CEE per quanto riguarda talune misure aventi lo scopo di semplificare
    la riscossione dell'imposta sul valore aggiunto e di contribuire a contrastare
    la frode o l'evasione fiscale e che abroga talune decisioni che autorizzano misure
    derogatorie
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2006/69/EK ( 2006. gada 24. jūlijs ), ar ko Direktīvu
    77/388/EEK groza attiecībā uz dažiem pasākumiem, lai vienkāršotu pievienotās
    vērtības nodokļa iekasēšanas procedūru un palīdzētu novērst nodokļu
    nemaksāšanu un izvairīšanos no nodokļu maksāšanas, un ar ko atceļ dažus
    lēmumus par atkāpēm
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 24 d. Tarybos direktyva 2006/69/EB, iš dalies keičianti
    Direktyvos 77/388/EEB nuostatas, susijusias su tam tikromis priemonėmis, kuriomis
    siekiama supaprastinti apmokestinimo pridėtinės vertės mokesčiu tvarką ir
    padėti užkirsti kelią mokesčių slėpimui ar vengimui, bei panaikinanti tam
    tikrus sprendimus dėl leidžiančių nukrypti nuostatų
  type: main
- language: mt
  script: Latn
  content: Direttiva tal-Kunsill 2006/69/KE ta' l- 24 ta’ Lulju 2006 li temenda
    d-Direttiva 77/388/KEE fir-rigward ta' ċerti miżuri li jissimplifikaw il-proċedura
    għall-impożizzjoni tat-taxxa fuq il-valur miżjud u li jassistu fil-ġlieda
    kontra l-evażjoni jew l-evitar tat-taxxa, u li tħassar ċerti Deċiżjonijiet
    li jipprovdu derogi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2006/69/EG van de Raad van 24 juli 2006 tot wijziging van Richtlijn
    77/388/EEG wat betreft bepaalde maatregelen ter vereenvoudiging van de btw-heffing
    en ter bestrijding van de belastingfraude en -ontwijking en tot intrekking van
    bepaalde derogatiebeschikkingen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2006/69/WE z dnia 24 lipca 2006 r. zmieniająca dyrektywę
    77/388/EWG w odniesieniu do niektórych środków w celu uproszczenia procedury
    obciążania podatkiem od wartości dodanej i pomocy w zwalczaniu uchylania się
    od opodatkowania lub unikania opodatkowania oraz uchylająca niektóre decyzje
    przyznające odstępstwa
  type: main
- language: pt
  script: Latn
  content: Directiva 2006/69/CE do Conselho, de 24 de Julho de 2006 , que altera a
    Directiva 77/388/CEE no que se refere a certas medidas destinadas a simplificar
    o procedimento de cobrança do imposto sobre o valor acrescentado e a lutar contra
    a fraude ou evasão fiscais e que revoga certas decisões que concedem derrogações
  type: main
- language: ro
  script: Latn
  content: Directiva 2006/69/CE a Consiliului din 24 iulie 2006 de modificare a Directivei
    77/388/CEE în ceea ce privește anumite măsuri vizând simplificarea procedurilor
    de percepere a taxei pe valoarea adăugată pentru a contribui la combaterea evaziunii
    și a fraudei fiscale și de abrogare a anumitor decizii care acordă derogări
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2006/69/ES z 24. júla 2006 , ktorou sa mení a dopĺňa
    smernica 77/388/EHS, pokiaľ ide o určité opatrenia na zjednodušenie postupu
    pri účtovaní dane z pridanej hodnoty a na pomoc v boji proti daňovým únikom
    alebo vyhýbaniu sa dani, a ktorou sa zrušujú určité rozhodnutia udeľujúce
    výnimky
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2006/69/ES z dne 24. julija 2006 o spremembah Direktive
    77/388/EGS v zvezi z nekaterimi ukrepi za poenostavitev postopka za obračunavanje
    davka na dodano vrednost in za pomoč pri preprečevanju davčne utaje ali izogibanja
    davku ter o razveljavitvi nekaterih odločb o odobritvi odstopanj
  type: main
- language: es
  script: Latn
  content: Directiva 2006/69/CE del Consejo, de 24 de julio de 2006 , por la que se
    modifica la Directiva 77/388/CEE en lo relativo a determinadas medidas de simplificación
    del procedimiento de aplicación del impuesto sobre el valor añadido y de contribución
    a la lucha contra la evasión o el fraude fiscales y por la que se derogan determinadas
    Decisiones destinadas a la concesión de excepciones
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2006/69/EG av den 24 juli 2006 om ändring av direktiv
    77/388/EEG när det gäller vissa åtgärder för att förenkla uppbörden av
    mervärdesskatt och för att förhindra skatteflykt eller skatteundandragande
    samt om upphävande av vissa beslut om tillstånd till avvikelser
  type: main
