title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2365/91 of 31 July 1991 laying down the
    conditions for use of the ATA carnet for the temporary importation of goods into
    the customs territory of the Community or their temporary exportation from that
    territory
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2365/91 de la Commission, du 31 juillet 1991, fixant
    les conditions d'utilisation d'un carnet ATA pour l'admission temporaire des marchandises
    dans le territoire douanier de la Communauté ainsi que pour l'exportation temporaire
    des marchandises hors de ce territoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2365/91 der Kommission vom 31. Juli 1991 zur Festlegung
    der Voraussetzungen für die Verwendung eines Carnet ATA für die vorübergehende
    Verwendung von Waren im Zollgebiet der Gemeinschaft sowie für die vorübergehende
    Ausfuhr von Waren aus diesem Gebiet
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2365/91 af 31. juli 1991 om fastsættelse
    af betingelserne for benyttelse af et ATA-carnet for midlertidig indførsel af
    varer til Fællesskabets toldområde samt for midlertidig udførsel af varer fra
    Fællesskabets toldområde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2365/91 της Επιτροπής
    της 31ης Ιουλίου 1991 περί καθορισμού των προϋποθέσεων
    χρησιμοποίησης δελτίου ΑΤΑ για την προσωρινή
    εισαγωγή εμπορευμάτων στο τελωνειακό έδαφος
    της Κοινότητας καθώς και για την προσωρινή
    εξαγωγή εμπορευμάτων εκτός του εν λόγω εδάφους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2365/91 della Commissione, del 31 luglio 1991, che
    stabilisce le condizioni di utilizzazione del carnet ATA per l'ammissione temporanea
    di merci nel territorio doganale della Comunità e per l'esportazione temporanea
    di merci fuori di detto territorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2365/91 van de Commissie van 31 juli 1991 tot vaststelling
    van de voorwaarden voor het gebruik van een carnet ATA voor de tijdelijke invoer
    van goederen in het douanegebied van de Gemeenschap en voor de tijdelijke uitvoer
    van goederen uit dit gebied
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2365/91 da Comissão, de 31 de Julho de 1991, que
    fixa as condições de utilização de um livrete ATA para a importação temporária
    das mercadorias no território aduaneiro da Comunidade, bem como para a exportação
    temporária das mercadorias desse território
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2365/91 de la Comisión, de 31 de julio de 1991, por
    el que se fijan las condiciones de utilización de un cuaderno ATA para la importación
    temporal de mercancías en el territorio aduanero de la Comunidad, así como para
    la exportación temporal de mercancías fuera de este territorio
  type: main
