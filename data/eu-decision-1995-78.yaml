    90/180/Ευρατόμ, ΕΟΚ, με την οποία επιτρέπεται στις
    Κάτω Χώρες να μην λαμβάνουν υπόψη ορισμένες
    κατηγορίες δραστηριοτήτων και να χρησιμοποιούν
    κατά προσέγγιση εκτιμήσεις κατά τον υπολογισμό
    της βάσης των ιδίων πόρων που προέρχονται από
    το φόρο επί της προστιθέμενης αξίας (Το κείμενο
    στην ολλανδική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/78/EY, Euratom: Komission päätös, tehty 13 päivänä maaliskuuta
    1995, luvan antamisesta Alankomaille olla ottamatta huomioon eräitä toimiluokkia
    tai käyttää eräitä likimääräisiä arvioita arvonlisäverosta kertyvien
    omien varojen perustan laskemiseksi tehdyn päätöksen 90/180/Euratom, ETY, muuttamisesta
    (Ainoastaan hollanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/78/CE, Euratom: Decisione della Commissione del 13 marzo 1995 che modifica
