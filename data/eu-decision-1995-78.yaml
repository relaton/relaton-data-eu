title:
- language: en
  script: Latn
  content: '95/78/EC, Euratom: Commission Decision of 13 March 1995 amending Decision
    90/180/Euratom, EEC authorizing the Netherlands not to take into account certain
    categories of transactions and to use certain approximate estimates for the calculation
    of the VAT own resources base (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/78/CE, Euratom: Décision de la Commission du 13 mars 1995 modifiant
    la décision 90/180/Euratom, CEE, autorisant les Pays-Bas à ne pas tenir compte
    de certaines catégories d''opérations ou à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '95/78/EG, Euratom: Entscheidung der Kommission vom 13. März 1995 zur
    Änderung der Entscheidung 90/180/Euratom, EWG, mit der die Niederlande ermächtigt
    werden, bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte
    Gruppen von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten
    anderen Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln (Nur der
    niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/78/EF, Euratom: Kommissionens beslutning af 13. marts 1995 om ændring
    af beslutning 90/180/Euratom, EØF, om bemyndigelse af Nederlandene til at beregne
    grundlaget for Fællesskabernes momsindtægter på basis af en tilnærmelsesvis
    vurdering af momsgrundlaget for visse transaktioner (Kun den nederlandske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
