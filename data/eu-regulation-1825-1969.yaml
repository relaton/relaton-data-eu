  content: Règlement (CEE) n 1825/69 de la Commission, du 16 septembre 1969, fixant
    le montant compensatoire à l'importation des huiles de tournesol originaires
    ou en provenance de Bulgarie, de Hongrie, de Roumanie, d'U.R.S.S. et de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1825/69 der Kommission vom 16. September 1969 zur
    Festsetzung der Ausgleichsabgabe bei der Einfuhr von Sonnenblumenöl mit Ursprung
    in oder Herkunft aus Bulgarien, Jugoslawien, Rumänien, Ungarn und der UdSSR
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1825/69 della Commissione, del 16 settembre 1969,
    che fissa l'ammontare di compensazione applicabile all'importazione degli oli
    di girasole originari o in provenienza dalla Bulgaria, dalla Romania, dalla Jugoslavia,
    dall'Ungheria e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1825/69 van de Commissie van 16 september 1969 tot
    vaststelling van een compenserend bedrag bij de invoer van zonnebloemolie van
    oorsprong of van herkomst uit Bulgarije, Hongarije, Joegoslavië, Roemenië en
    de U.S.S.R.
