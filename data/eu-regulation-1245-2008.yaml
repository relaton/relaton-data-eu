id: EURegulation12452008
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1245/2008 of 12 December 2008 amending Regulation
    (EC) No 1615/2000 derogating from Regulation (EEC) No 2454/93 in respect of the
    definition of the concept of originating products used for the purposes of the
    scheme of generalised preferences to take account of the special situation of
    Nepal regarding certain exports of textiles to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1245/2008 de la Commission du 12 décembre 2008 modifiant
    le règlement (CE) n o 1615/2000 portant dérogation au règlement (CEE) n o 2454/93
    en ce qui concerne la définition de la notion de produits originaires établie
    dans le cadre du schéma de préférences tarifaires généralisées pour tenir
    compte de la situation particulière du Népal en ce qui concerne certains produits
    textiles exportés de ce pays vers la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1245/2008 der Kommission vom 12. Dezember 2008 zur
    Änderung der Verordnung (EG) Nr. 1615/2000 über eine Abweichung von der Bestimmung
    des Begriffs Ursprungserzeugnisse in der Verordnung (EWG) Nr. 2454/93 im Rahmen
    des Schemas allgemeiner Zollpräferenzen zur Berücksichtigung der besonderen
    Lage Nepals bei bestimmten in die Gemeinschaft ausgeführten Textilwaren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 1245/2008 на Комисията от 12
    декември 2008 година за изменение на Регламент
    (ЕО) № 1615/2000 за дерогация от Регламент (ЕИО)
    № 2454/93 във връзка с определението на понятието
    продукти с произход , установено в рамките
    на общата система за преференции, с цел отчитане
    на специалната ситуация на Непал по отношение
    на износа на определени текстилни продукти
    в Общността
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1245/2008 ze dne 12. prosince 2008 , kterým
    se mění nařízení (ES) č. 1615/2000, kterým se stanoví odchylka od nařízení
    (EHS) č. 2454/93, pokud jde o definici pojmu původní produkty používanou
    pro účely systému všeobecných celních preferencí s ohledem na zvláštní
    situaci Nepálu v případě některých textilních výrobků vyvážených z
    této země do Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1245/2008 af 12. december 2008 om ændring
    af forordning (EF) nr. 1615/2000 om en undtagelse fra forordning (EØF) nr. 2454/93,
    hvad angår definitionen af begrebet varer med oprindelsesstatus i henhold til
    den generelle præferenceordning for at tage hensyn til den særlige situation
    i Nepal for visse tekstilvarer, der udføres fra dette land til Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1245/2008 της Επιτροπής,
    της 12ης Δεκεμβρίου 2008 , για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1615/2000 σχετικά με την
    παρέκκλιση από τον κανονισμό (ΕΟΚ) αριθ. 2454/93
    όσον αφορά την έννοια των προϊόντων καταγωγής
    που ορίζεται στο πλαίσιο του συστήματος γενικευμένων
    δασμολογικών προτιμήσεων, προκειμένου να ληφθεί
    υπόψη η ιδιαίτερη κατάσταση του Νεπάλ όσον
    αφορά ορισμένα κλωστοϋφαντουργικά προϊόντα
    που εξάγονται από τη χώρα αυτή προς την Κοινότητα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1245/2008, 12. detsember 2008 , millega muudetakse
    määrust (EÜ) nr 1615/2000, millega sätestatakse üldise soodustuste süsteemi
    raames kehtestatud päritolustaatusega toodete määratluse erandid määrusest
    (EMÜ) nr 2454/93, et võtta arvesse Nepali eriolukorda teatavate tekstiiltoodete
    ühendusse eksportimisel
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1245/2008, annettu 12 päivänä joulukuuta 2008
    , asetuksessa (ETY) N:o 2454/93 osana yleistä tullietuusjärjestelmää annetusta
    alkuperätuotteiden käsitteen määritelmästä poikkeamisesta Nepalin erityistilanteen
    huomioon ottamiseksi tiettyjen tästä maasta yhteisöön vietävien tekstiilituotteiden
    osalta annetun asetuksen (EY) N:o 1615/2000 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1245/2008/EK rendelete ( 2008. december 12. ) a bizonyos textiltermékeknek
    a Közösségbe történő kivitelénél Nepál különleges helyzetének figyelembevétele
    érdekében a 2454/93/EGK rendeletben foglalt és az általános preferenciális
    rendszer keretében használt származó termék fogalom meghatározásától
    történő eltérésről szóló 1615/2000/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1245/2008 della Commissione, del 12 dicembre 2008 ,
    che modifica il regolamento (CE) n. 1615/2000 recante deroga al regolamento (CEE)
    n. 2454/93 per quanto riguarda la definizione della nozione di prodotti originari
    stabilita nell’ambito dello schema di preferenze tariffarie generalizzate per
    tener conto della particolare situazione del Nepal per quanto concerne alcuni
    prodotti tessili esportati da tale paese nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1245/2008 ( 2008. gada 12. decembris ), ar ko
    groza Regulu (EK) Nr. 1615/2000 par atkāpēm no Regulas (EEK) Nr. 2454/93 attiecībā
    uz to, kā definēt noteiktas izcelsmes izstrādājumu jēdzienu izmantošanai
    vispārējo priekšrocību sistēmā, lai ņemtu vērā Nepālas īpašo stāvokli
    attiecībā uz dažu tekstilizstrādājumu eksportu uz Kopienu
  type: main
- language: lt
  script: Latn
  content: 2008 m. gruodžio 12 d. Komisijos reglamentas (EB) Nr. 1245/2008, iš dalies
    keičiantis Reglamentą (EB) Nr. 1615/2000, nukrypstantį nuo Reglamento (EEB)
    Nr. 2454/93 dėl produkto kilmės sąvokos apibrėžimo, naudojamo bendrųjų
    preferencijų schemos tikslams, kad būtų atsižvelgta į ypatingą Nepalo situaciją,
    susijusią su tam tikru tekstilės eksportu į Bendriją
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 1245/2008 tat- 12 ta' Diċembru 2008
    li jemenda r-Regolament (KE) Nru 1615/2000 li jidderoga mir-Regolament (KEE) Nru
    2454/93 f’dak li jirrigwardja d-definizzjoni tal-kunċett ta’ prodotti ta’oriġini,
    użat għall-iskopijiet tal-iskema ta’ preferenzi ġeneralizzati biex jieħu
    in konsiderazzjoni l-qagħda speċjali tan-Nepal rigward ċerti prodotti magħmula
    mit-tessuti esportati lejn il-Komunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1245/2008 van de Commissie van 12 december 2008 tot
    wijziging van Verordening (EG) nr. 1615/2000 houdende afwijking van de in Verordening
    (EEG) nr. 2454/93 opgenomen definitie van het begrip producten van oorsprong in
    het kader van het stelsel van algemene tariefpreferenties in verband met de bijzondere
    situatie van Nepal wat de uitvoer van bepaalde textielproducten naar de Gemeenschap
    betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1245/2008 z dnia 12 grudnia 2008 r. zmieniające
    rozporządzenie (WE) nr 1615/2000 wprowadzające odstępstwo od rozporządzenia
    (EWG) nr 2454/93 w odniesieniu do definicji pojęcia produktów pochodzących
    używanej do celów systemu ogólnych preferencji w celu uwzględnienia szczególnej
    sytuacji Nepalu, dotyczącej wywozu niektórych wyrobów włókienniczych do Wspólnoty
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1245/2008 da Comissão, de 12 de Dezembro de 2008
    , que altera o Regulamento (CE) n. o 1615/2000, que derroga o Regulamento (CEE)
    n. o 2454/93 no que se refere à definição da noção de produtos originários
    estabelecida no âmbito do sistema de preferências pautais generalizadas, a fim
    de ter em conta a situação específica do Nepal no que respeita a determinados
    produtos têxteis exportados deste país para a Comunidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 1245/2008 al Comisiei din 12 decembrie 2008 de modificare
    a Regulamentului (CE) nr. 1615/2000 de derogare de la Regulamentul (CEE) nr. 2454/93
    în ceea ce privește definirea conceptului de produse originare folosit în cadrul
    sistemului de preferințe tarifare generalizate pentru a ține cont de situația
    specială a Nepalului în ceea ce privește anumite produse textile exportate
    către Comunitate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1245/2008 z 12. decembra 2008 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 1615/2000, ktorým sa tvorí výnimka z nariadenia
    (EHS) č. 2454/93 vzhľadom na definíciu pojmu pôvodné výrobky použitú na
    účely schémy všeobecného systému preferencií na zohľadnenie osobitnej
    situácie Nepálu, pokiaľ ide o niektoré vývozy textílií do Spoločenstva
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1245/2008 z dne 12. decembra 2008 o spremembi
    Uredbe (ES) št. 1615/2000, ki ureja odstopanje od Uredbe (EGS) št. 2454/93 glede
    opredelitve pojma izdelki s poreklom, ki se uporablja za splošne sheme preferencialov,
    z namenom da se upošteva posebni položaj Nepala glede izvoza nekaterih tekstilnih
    izdelkov v Skupnost
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1245/2008 de la Comisión, de 12 de diciembre de 2008
    , que modifica el Reglamento (CE) n o 1615/2000 por el que se establece una excepción
    al Reglamento (CEE) n o 2454/93 en lo relativo a la definición del concepto de
    productos originarios establecido con arreglo al plan de preferencias arancelarias
    generalizadas a fin de tener en cuenta la situación particular de Nepal por lo
    que se refiere a determinados productos textiles exportados de este país a la
    Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1245/2008 av den 12 december 2008 om
    ändring av förordning (EG) nr 1615/2000 om undantag från förordning (EEG)
    nr 2454/93 med avseende på definitionen av begreppet ursprungsvaror som fastställs
    inom ramen för systemet för allmän förmånsbehandling för att ta hänsyn
    till Nepals särskilda situation när det gäller vissa textilprodukter som exporteras
    från detta land till gemenskapen
