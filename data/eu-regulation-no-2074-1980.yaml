title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2074/80 of 1 August 1980 re-establishing
    the levying of customs duties on flax or ramie yarn, not put up for retail sale,
    products of category 115 (code 1150), originating in developing countries, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2074/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    lin ou de ramie, non conditionnés pour la vente au détail, de la catégorie
    115 (code 1150), originaires des pays et territoires en voie de développement,
    bénéficaires des préférences tarifaires prévues par le règlement (CEE) n°
    2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2074/80 der Kommission vom 1. August 1980 zur Wiedereinführung
    des Zollsatzes für Leinengarne und Ramiegarne, nicht in Aufmachungen für den
    Einzelverkauf, der Warenkategorie Nr. 115 (Kennziffer 1150), mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2074/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for garn af hør eller ramie, ikke i detailsalgsoplægninger,
    under kategori 115 (kode 1150), som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2074/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di lino o di
    ramiè, non preparati per la vendita al minuto, della categoria di prodotti n.
    115 (codice 1150), originari dei paesi in via di sviluppo, beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2074/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    vlas of van ramee, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 115 (codenummer 1150) van oorsprong uit de ontwikkelingslanden
    en -gebieden, ten behoeve waarvan bij Verordening (EEG) nr. 2894/79 van de Raad
    tariefpreferenties werden geopend
  type: main
