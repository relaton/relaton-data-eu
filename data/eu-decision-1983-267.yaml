title:
- language: en
  script: Latn
  content: '83/267/EEC: Commission Decision of 24 May 1983 establishing that the apparatus
    described as ''Waters - High Pressure Liquid Chromatography System, consisting
    of: System Controller, model 720; Data module, model 730; Solvent Delivery System,
    model 6000A, model M45; Universal Injector model U6K; Refractometer, model 401''
    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/267/CEE: Décision de la Commission du 24 mai 1983 constatant que l''importation
    de l''appareil dénommé "Waters-High Pressure Liquid Chromatography System, consisting
    of: System Controller, model 720; Data module, model 730; Solvent Delivery System,
    model 6000A, model M45; Universal Injector, model U6K; Refractometer, model 401"
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/267/EWG: Entscheidung der Kommission vom 24. Mai 1983, mit der festgestellt
    wird, daß das Gerät ,,Waters - High Pressure Liquid Chromatography System, consisting
    of: System Controller, model 720; Data module, model 730; Solvent Delivery System,
    model 6000 A, model M45; Universal Injector, model U6K, Refractometer, model 401"
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '83/267/EØF: Kommissionens beslutning af 24. maj 1983 om fastslåelse
    af, at indførsel af apparatet "Waters - High Pressure Liquid Chromatography System,
    consisting of: System Controller, model 720; Data module, model 730; Solvent Delivery
    System, model 6000A, model M45; Universal Injector, model U6K; Refractometer,
    model 401" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '83/267/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
    Μαΐου 1983 περί διαπιστώσεως ότι η εισαγωγή της
    συσκευής με την ονομασία «Waters-High pressure liquid chromatography
    system, consisting of: System controller, model 720, Data module, model 730, Solvent
    delivery system, model 6000 A, model M 45, Universal injector, model U6K, Refractometer,
    model 401» δύναται να πραγματοποιηθεί ατελώς ως
    προς τους δασμούς του Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '83/267/CEE: Decisione della Commissione del 24 maggio 1983 che stabilisce
    che l''importazione dell''apparecchio denominato "Waters - High Pressure Liquid
    Chromatography System, consisting of: System Controller, model 720; Data module,
    model 730; Solvent Delivery System, model 6000A, model M45; Universal Injector,
    model U6K; Refractometer, model 401" può avvenire in franchigia dai dazi della
    tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '83/267/EEG: Beschikking van de Commissie van 24 mei 1983 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,Waters-High pressure liquid chromatography
    system, consisting of: System controller, model 720; Data module, model 730; Solvent
    delivery system, model 6000 A, model M 45; Universal injector, model U6K; Refractometer,
    model 401" met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
  type: main
