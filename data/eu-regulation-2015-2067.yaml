title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/2067 of 17 November 2015 establishing,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council, minimum requirements and the conditions for mutual recognition for the
    certification of natural persons as regards stationary refrigeration, air conditioning
    and heat pump equipment, and refrigeration units of refrigerated trucks and trailers,
    containing fluorinated greenhouse gases and for the certification of companies
    as regards stationary refrigeration, air conditioning and heat pump equipment,
    containing fluorinated greenhouse gases
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/2067 de la Commission du 17 novembre
    2015 établissant, conformément au règlement (UE) n° 517/2014 du Parlement
    européen et du Conseil, des prescriptions minimales et les conditions applicables
    à la reconnaissance mutuelle de la certification des personnes physiques en ce
    qui concerne les équipements fixes de réfrigération, de climatisation et de
    pompes à chaleur, et les unités de réfrigération de camions et remorques frigorifiques
    contenant des gaz à effet de serre fluorés, ainsi qu'à la certification des
    entreprises en ce qui concerne les équipements fixes de réfrigération, de climatisation
    et de pompes à chaleur contenant des gaz à effet de serre fluorés
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/2067 der Kommission vom 17. November
    2015 zur Festlegung — gemäß der Verordnung (EU) Nr. 517/2014 des Europäischen
    Parlaments und des Rates — der Mindestanforderungen und der Bedingungen für
    die gegenseitige Anerkennung im Hinblick auf die Zertifizierung von natürlichen
    Personen in Bezug auf fluorierte Treibhausgase enthaltende ortsfeste Kälteanlagen,
    Klimaanlagen und Wärmepumpen sowie Kühlaggregate in Kühlkraftfahrzeugen und
    -anhängern und auf die Zertifizierung von Unternehmen in Bezug auf fluorierte
    Treibhausgase enthaltende ortsfeste Kälteanlagen, Klimaanlagen und Wärmepumpen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/2067 на Комисията
    от 17 ноември 2015 година за установяване, съгласно
    Регламент (ЕС) № 517/2014 на Европейския парламент
    и на Съвета, на минимални изисквания и на условия
    за взаимно признаване на сертифицирането на
    физически лица по отношение на стационарно
    хладилно, климатично и термопомпено оборудване
    и хладилни устройства на хладилни камиони
    и ремаркета, съдържащи флуорсъдържащи парникови
    газове, както и за сертифицирането на дружества
    по отношение на стационарно хладилно, климатично
    и термопомпено оборудване, съдържащо флуорсъдържащи
    парникови газове
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/2067 ze dne 17. listopadu 2015,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) č. 517/2014 zavádějí
    minimální požadavky na certifikaci fyzických osob, pokud jde o stacionární
    chladicí a klimatizační zařízení a tepelná čerpadla a chladicí jednotky
    chladírenských nákladních vozidel a přívěsů obsahující fluorované skleníkové
    plyny, a na certifikaci společností, pokud jde o stacionární chladicí a klimatizační
    zařízení a tepelná čerpadla obsahující fluorované skleníkové plyny,
    a podmínky pro vzájemné uznávání těchto certifikací
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/2067 af 17. november
    2015 om fastsættelse i medfør af Europa-Parlamentets og Rådets forordning (EU)
    nr. 517/2014 af mindstekrav og betingelser for gensidig anerkendelse af autorisation
    af fysiske personer vedrørende stationært køle-, luftkonditionerings- og varmepumpeudstyr,
    og køleenheder på kølelastbiler og -påhængskøretøjer, der indeholder fluorholdige
