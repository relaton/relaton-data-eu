  script: Latn
  content: Regolamento di esecuzione (UE) 2015/2067 della Commissione, del 17 novembre
    2015, che stabilisce, in conformità al regolamento (UE) n. 517/2014 del Parlamento
    europeo e del Consiglio, i requisiti minimi e le condizioni per il riconoscimento
    reciproco della certificazione delle persone fisiche per quanto concerne le apparecchiature
    fisse di refrigerazione e condizionamento d'aria, le pompe di calore fisse e le
    celle frigorifero di autocarri e rimorchi frigorifero contenenti gas fluorurati
    a effetto serra, nonché per la certificazione delle imprese per quanto concerne
    le apparecchiature fisse di refrigerazione e condizionamento d'aria e le pompe
    di calore fisse contenenti gas fluorurati ad effetto serra
  type: main
