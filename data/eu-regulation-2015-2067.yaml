    gaisa kondicionēšanas iekārtām un siltumsūkņu iekārtām, kurās izmanto
    fluorētas siltumnīcefekta gāzes
  type: main
- language: lt
  script: Latn
  content: 2015 m. lapkričio 17 d. Komisijos įgyvendinimo reglamentas (ES) 2015/2067,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 517/2014 nustatomi
