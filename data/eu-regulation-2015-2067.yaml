    Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 517/2014 mukaisesti
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/2067 оd 17. studenoga 2015. o utvrđivanju,
    u skladu s Uredbom (EU) br. 517/2014 Europskog parlamenta i Vijeća, minimalnih
    zahtjeva i uvjeta za uzajamno priznavanje certifikacije fizičkih osoba u pogledu
    nepokretne rashladne i klimatizacijske opreme i dizalica topline te rashladnih
    jedinica kamiona hladnjača i prikolica hladnjača koji sadržavaju fluorirane
    stakleničke plinove, kao i certifikacije poduzeća u pogledu nepokretne rashladne
    i klimatizacijske opreme i dizalica topline koji sadržavaju fluorirane stakleničke
    plinove
  type: main
