    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EL) nr 517/2014 miinimumnõuded,
    mille alusel sertifitseeritakse füüsilisi isikuid seoses fluoritud kasvuhoonegaase
    sisaldavate paiksete jahutus- ja kliimaseadmete ja soojuspumpadega ning külmikveokite
    ja -haagiste külmutusseadmetega ning äriühinguid seoses fluoritud kasvuhoonegaase
    sisaldavate paiksete jahutus- ja kliimaseadmete ja soojuspumpadega, samuti sellise
    sertifitseerimise vastastikuse tunnustamise tingimused
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/2067, annettu 17 päivänä
    marraskuuta 2015, fluorattuja kasvihuonekaasuja sisältävien kiinteästi asennettujen
