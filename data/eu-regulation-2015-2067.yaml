  script: Latn
  content: Uitvoeringsverordening (EU) 2015/2067 van de Commissie van 17 november
    2015 tot vaststelling, ingevolge Verordening (EU) nr. 517/2014 van het Europees
    Parlement en de Raad, van minimumeisen en de voorwaarden voor wederzijdse erkenning
    voor de certificering van natuurlijke personen betreffende stationaire koel-,
    klimaatregelings- en warmtepompapparatuur en koeleenheden op koelwagens en koelaanhangwagens
    die gefluoreerde broeikasgassen bevatten, en voor de certificering van bedrijven
    betreffende stationaire koel-, klimaatregelings- en warmtepompapparatuur die gefluoreerde
    broeikasgassen bevat
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/2067 z dnia 17 listopada 2015
    r. ustanawiające, zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady
    (UE) nr 517/2014, minimalne wymagania i warunki wzajemnego uznawania certyfikacji
    osób fizycznych w odniesieniu do stacjonarnych urządzeń chłodniczych, klimatyzacyjnych
    i pomp ciepła oraz agregatów chłodniczych samochodów ciężarowych i przyczep
    chłodni, zawierających fluorowane gazy cieplarniane, a także certyfikacji przedsiębiorstw
    w odniesieniu do stacjonarnych urządzeń chłodniczych, klimatyzacyjnych i pomp
    ciepła zawierających fluorowane gazy cieplarniane
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/2067 da Comissão, de 17 de novembro
    de 2015, que estabelece, nos termos do Regulamento (UE) n.° 517/2014 do Parlamento
    Europeu e do Conselho, os requisitos mínimos e as condições para o reconhecimento
    mútuo da certificação de pessoas singulares no que respeita aos equipamentos
    de refrigeração fixos, equipamentos de ar condicionado fixos, bombas de calor
    fixas e unidades de refrigeração de camiões e reboques refrigerados que contêm
    gases fluorados com efeito de estufa e para a certificação de empresas no que
    respeita aos equipamentos de refrigeração fixos, equipamentos de ar condicionado
    fixos e bombas de calor fixas que contêm gases fluorados com efeito de estufa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/2067 al Comisiei din 17 noiembrie
    2015 de stabilire, în temeiul Regulamentului (UE) nr. 517/2014 al Parlamentului
    European și al Consiliului, a cerințelor minime și a condițiilor pentru recunoașterea
    reciprocă în scopul certificării persoanelor fizice în ceea ce privește echipamentele
    staționare de refrigerare, de climatizare și pompele de căldură, precum și
    unitățile de refrigerare ale camioanelor și remorcilor frigorifice care conțin
    gaze fluorurate cu efect de seră și în scopul certificării întreprinderilor
    în ceea ce privește echipamentele staționare de refrigerare, de climatizare
    și pompele de căldură care conțin gaze fluorurate cu efect de seră
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/2067 zo 17. novembra 2015, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) č. 517/2014 stanovujú
    minimálne požiadavky a podmienky vzájomného uznávania osvedčení fyzických
    osôb, pokiaľ ide o stacionárne chladiace zariadenia, klimatizačné zariadenia
    a tepelné čerpadlá a chladiace jednotky chladiarenských nákladných automobilov
    a prípojných vozidiel obsahujúce fluórované skleníkové plyny, a osvedčení
    spoločností, pokiaľ ide o stacionárne chladiace zariadenia, klimatizačné
    zariadenia a tepelné čerpadlá obsahujúce fluórované skleníkové plyny
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/2067 z dne 17. novembra 2015 o določitvi
    minimalnih zahtev in pogojev za vzajemno priznavanje za izdajanje spričeval fizičnim
    osebam glede nepremične opreme za hlajenje in klimatizacijo ter toplotnih črpalk
    in hladilnih enot tovornjakov hladilnikov in hladilnih priklopnikov, ki vsebujejo
    fluorirane toplogredne pline, in za izdajanje spričeval podjetjem glede nepremične
    opreme za hlajenje in klimatizacijo ter toplotnih črpalk, ki vsebujejo fluorirane
    toplogredne pline, v skladu z Uredbo (EU) št. 517/2014 Evropskega parlamenta
    in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/2067 de la Comisión, de 17 de noviembre
    de 2015, por el que se establecen, de conformidad con el Reglamento (UE) n° 517/2014
    del Parlamento Europeo y del Consejo, los requisitos mínimos y las condiciones
    de reconocimiento mutuo de la certificación de las personas físicas en lo relativo
    a los aparatos fijos de refrigeración, aparatos fijos de aire acondicionado y
    bombas de calor fijas, y unidades de refrigeración de camiones y remolques frigoríficos,
    que contengan gases fluorados de efecto invernadero, y de la certificación de
    las empresas en lo relativo a los aparatos fijos de refrigeración, aparatos fijos
    de aire acondicionado y bombas de calor fijas que contengan gases fluorados de
    efecto invernadero
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/2067 av den 17 november
    2015 om fastställande, i enlighet med Europaparlamentets och rådets förordning
    (EU) nr 517/2014, av minimikrav och villkor för ömsesidigt erkännande för
    certifiering av fysiska personer vad gäller stationär kyl-, luftkonditionerings-
    och värmepumpsutrustning samt kylenheter i lastbilar och släpfordon med kylaggregat
    som innehåller fluorerade växthusgaser samt för certifiering av företag vad
    gäller stationär kyl-, luftkonditionerings- och värmepumpsutrustning som innehåller
    fluorerade växthusgaser
