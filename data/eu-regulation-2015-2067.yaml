    atzīšanai attiecībā uz stacionārām aukstumiekārtām, gaisa kondicionēšanas
    iekārtām, siltumsūkņu iekārtām un kravas refrižeratorautomobiļu un refrižeratorpiekabju
    aukstumiekārtām, kurās izmanto fluorētas siltumnīcefekta gāzes, un uzņēmumu
