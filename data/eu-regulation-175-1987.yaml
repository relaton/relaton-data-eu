title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 175/87 of 22 January 1987 fixing, for 1987,
    the quotas for imports into Portugal of certain egg and poultrymeat products from
    third countries and certain detailed rules for the application thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 175/87 de la Commission du 22 janvier 1987 fixant,
    pour l' année 1987, les contingents applicables à l' importation au Portugal
    de certains produits des secteurs des oeufs et de la viande de volaille en provenance
    des pays tiers et certaines modalités pour leur application
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 175/87 der Kommission vom 22. Januar 1987 zur Festsetzung
    der 1987 in Portugal anwendbaren Kontingente für die Einfuhr bestimmter Erzeugnisse
    des Sektors Eier und Geflügelfleisch aus Drittländern und diesbezüglicher Durchführungsbestimmungen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 175/87 af 22. januar 1987 om fastsættelse
    for 1987 af kontingenterne for import til Portugal af visse æg- og fjerkrækødprodukter
    fra tredjelande og af visse bestemmelser for deres anvendelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 175/87 της Επιτροπής
    της 22ας Ιανουαρίου 1987 για τον καθορισμό των
    ποσοστώσεων, για το έτος 1987, οι οποίες εφαρμόζονται
    κατά την εισαγωγή στην Πορτογαλία ορισμένων
    προϊόντων του τομέα των αυγών και του κρέατος
    των πουλερικών προέλευσης τρίτων χωρών, και
    για ορισμένες λεπτομέρειες εφαρμογής τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 175/87 della Commissione del 22 gennaio 1987 che fissa
    i contingenti per il 1987 applicabili all' importazione in Portogallo di taluni
    prodotti del settore delle uova e del pollame provenienti dai paesi terzi e talune
    modalità di applicazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 175/87 van de Commissie van 22 januari 1987 tot vaststelling
    van de contingenten voor het jaar 1987 welke door Portugal kunnen worden toegepast
    bij invoer van bepaalde produkten van de sectoren eieren en slachtpluimvee van
    herkomst uit derde landen, en van uitvoeringsbepalingen terzake
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 175/87 da Comissão de 22 de Janeiro de 1987 que
    fixa, para o ano de 1987, os contingentes aplicáveis à importação em Portugal
    de determinados produtos dos sectores dos ovos e da carne de aves de capoeira
    provenientes de países terceiros e determinadas regras para a sua aplicação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 175/87 de la Comisión de 22 de enero de 1987 por
    el que se establecen, para el año 1987, los contingentes aplicables a la importación
    por parte de Portugal de determinados productos de los sectores de los huevos
    y de la carne de aves de corral procedentes de terceros países, así como determinadas
    normas para su aplicación
  type: main
