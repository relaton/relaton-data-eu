- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1830/92 of 3 July 1992 determining for the
    Member States, for the 1992 marketing year, the estimated loss of income and the
    estimated level of the premium payable per ewe and per female goat and fixing
    the first advance payment for this premium and of the specific aid for sheep and
    goat farming in certain less-favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1830/92 de la Commission du 3 juillet 1992 déterminant,
    pour les États membres et pour la campagne 1992, la perte estimée de revenu,
    le montant estimé de la prime payable par brebis et par chèvre, ainsi que fixant
    le montant du premier acompte de cette prise ainsi que celui de l'aide spécifique
    à l'élevage ovin et caprin dans certaines zones défavorisées de la Communauté
  type: main
