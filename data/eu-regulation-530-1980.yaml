id: EURegulation5301980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 530/80 of 29 February 1980 re-establishing
    the levying of customs duties on linoleums and materials prepared on a textile
    base in a similar manner to linoleum, whether or not cut to shape, products of
    category 102 (code 1020), originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 530/80 de la Commission, du 29 février 1980, portant
    rétablissement de la perception des droits de douane applicables aux linoléums
    pour tous usages, découpés ou non, etc., de la catégorie de produits n° 102
    (code 1020), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 530/80 der Kommission vom 29. Februar 1980 über die
    Wiedereinführung des Zollsatzes für Linoleum, auch zugeschnitten, der Warenkategorie
    Nr. 102 (Kennziffer 1020), mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 530/80 af 29. februar 1980 om genindførelse
    af opkrævning af toldafgifter for linoleum med tekstilunderlag til enhver anvendelse,
    også i tilskårne stykker, under varekategori 102 (kode 1020), som har oprindelse
    i Indien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 530/80 della Commissione, del 29 febbraio 1980, che
    ripristina la rsicossione dei dazi doganali applicabili ai linoleum, per qualsiasi
    uso, anche tagliati, ecc., della categoria di prodotti n. 102 (codice 1020), originari
    dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 530/80 van de Commissie van 29 februari 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op linoleum,
    ongeacht het gebruik daarvan, van de categorie van produkten nr. 102 (codenummer
    1020), van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 2894/79 van de Raad
  type: main
