title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2105/90 of 23 July 1990 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    to fruit and vegetables as regards tomatoes, lettuce, broad-leaf endives, carrots,
    table grapes, melons and peaches
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2105/90 de la Commission du 23 juillet 1990 fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges dans le secteur des fruits et légumes en ce qui concerne les tomates,
    les laitues, les chicorées scaroles, les carottes, les raisins de table, les
    melons et les pêches
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2105/90 DER KOMMISSION vom 23. Juli 1990 zur Festsetzung
    zusaetzlicher Bestimmungen zur Anwendung des ergaenzenden Handelsmechanismus im
    Sektor Obst und Gemuese hinsichtlich Tomaten, Salat, Endivie Eskariol, Karotten,
    Tafeltrauben, Melonen und Pfirsichen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2105/90 af 23. juli 1990 om fastsættelse
    af visse yderligere gennemførelsesbestemmelser for den supplerende mekanisme
    for samhandelen i sektoren for frugt og grønsager, for så vidt angår tomater,
    salat, bredbladet endivie, gulerødder, druer til spisebrug, meloner og ferskner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2105/90 της Επιτροπής
    της 23ης Ιουλίου 1990 περί καθορισμού ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών όσον αφορά
    τις τομάτες, τα μαρούλια, τις σκαρόλες, τα καρότα,
    τα επιτραπέζια σταφύλια, τα πεπόνια και τα
    ροδάκινα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2105/90 DELLA COMMISSIONE del 23 luglio 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    applicabile agli scambi nel settore degli ortofrutticoli per quanto riguarda i
    pomodori, le lattughe, le cicorie scarole, le carote, le uve da tavola, i meloni
    e le pesche
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2105/90 VAN DE COMMISSIE van 23 juli 1990 tot vaststelling
    van bijkomende bepalingen voor de toepassing van de aanvullende regeling voor
    het handelsverkeer in de sector groenten en fruit, ten aanzien van tomaten, sla,
    andijvie, wortelen, tafeldruiven, meloenen en perziken
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2105/90 DA COMISSAO de 23 de Julho de 1990 que fixa
    determinadas regras complementares para execuçao do mecanismo complementar aplicavel
    às trocas comerciais no sector das frutas e produtos horticolas, no que se refere
    aos tomates, alfaces, chicorias escarolas, cenouras, uvas de mesa, meloes, e pêssegos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2105/90 DE LA COMISION de 23 de julio de 1990 por el
    que se establecen determinadas disposiciones adicionales de aplicacion del mecanismo
    complementario aplicable a los intercambios en el sector de las frutas y hortalizas
    en lo que se refiere a los tomates, las lechugas, las escarolas de hoja lisa,
    las zanahorias, las uvas de mesa, los melones y los melocotones
