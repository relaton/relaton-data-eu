---
id: EUDecision1977636
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 July 1977 authorizing the French Republic not
    to apply Community treatment to woven fabrics of cotton or of synthetic textile
    fibres, unbleached or bleached, falling within heading No ex 55.09 or subheading
    56.07 ex A of the Common Customs Tariff, originating in Malaysia and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/636/CEE: Décision de la Commission, du 28 juillet 1977, autorisant
    la République française à exclure du traitement communautaire les tissus écrus
    et blanchis de coton ou de fibres textiles synthétiques, des positions Ex 55.09
    et 56.07 Ex A du Tarif douanier commun, originaires de la Malaysia et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juli 1977, mit der die Französische
    Republik ermächtigt wird, aus Malaysia stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche ungebleichte und gebleichte Gewebe aus Baumwolle
    oder synthetischen Spinnfasern der Tarifnummern ex 55.09 und 56.07 ex A des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. juli 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof, ubleget eller
    bleget, af bomuld eller syntetiske fibre, som henhører under pos. ex 55.09 og
    56.07 ex A i den fælles toldtarif, har oprindelse i Malaysia og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 luglio 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i tessuti greggi e imbianchiti
    di cotone o di fibre tessili sintetiche delle voci ex 55.09 e 56.07 ex A della
    tariffa doganale comune originari della Malaisia e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juli 1977 waarbij de Franse Republiek
    wordt gemachtigd ongebleekte en gebleekte weefsels van katoen of van synthetische
    vezels, van de posten ex 55.09 en 56.07 ex A van het gemeenschappelijk douanetarief,
    van oorsprong uit Maleisië en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
