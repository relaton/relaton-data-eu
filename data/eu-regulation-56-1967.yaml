title:
- language: fr
  script: Latn
  content: Règlement n° 56/67/CEE du Conseil, du 21 mars 1967, fixant le montant
    des prélèvements envers les pays tiers pour le porc, la viande de porc et les
    produits à base de viande de porc, pour les importations effectuées durant le
    deuxième trimestre 1967
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 56/67/EWG des Rates vom 21. März 1967 über die Festsetzung
    der Abschöpfungsbeträge gegenüber dritten Ländern für Schweine, Schweinefleisch
    und Schweinefleisch enthaltende Erzeugnisse für Einfuhren im zweiten Vierteljahr
    1967
  type: main
- language: it
  script: Latn
  content: Regolamento n. 56/67/CEE del Consiglio, del 21 marzo 1967, che fissa l'ammontare
    dei prelievi nei confronti dei paesi terzi applicabili ai suini, alle carni suine
    e ai prodotti a base di carni suine per le importazioni effettuate nel secondo
    trimestre 1967
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 56/67/EEG van de Raad van 21 maart 1967 houdende vaststelling
