    de origine preferențială prevăzute în Regulamentul delegat (UE) 2015/2446
    în ceea ce privește preparatele sau conservele de fileuri de ton (crude, fierte
    sau congelate), preparatele sau conservele de fileuri de macrou și preparatele
    sau conservele de fileuri de ton fregată sau de fileuri de ton negru
  type: main
- language: sk
