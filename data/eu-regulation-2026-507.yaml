    i delegeret forordning (EU) 2015/2446 for så vidt angår tilberedte eller konserverede
    fileter og loins af tun (rå, kogt og frosset), tilberedte eller konserverede
    makrelfileter og tilberedte eller konserverede fileter af fregattun eller fregatmakrel
  type: main
- language: el
