title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/507 of 6 March 2026 granting
    Cabo Verde a temporary derogation from the rules on preferential origin laid down
    in Delegated Regulation (EU) 2015/2446, in respect of prepared or preserved fillets
    of tuna and tuna loins (raw, cooked and frozen), prepared or preserved mackerel
    fillets and prepared or preserved frigate tuna or frigate mackerel fillets
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/507 de la Commission du 6 mars 2026
    accordant à Cabo Verde une dérogation temporaire aux règles d’origine préférentielle
    prévues par le règlement délégué (UE) 2015/2446 en ce qui concerne les préparations
    ou conserves de filets de thon et les longes de thon (crues, cuites et congelées),
    les préparations ou conserves de filets de maquereaux et les préparations ou
    conserves de filets d’auxides
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2026/507 der Kommission vom 6. März 2026
    zur Gewährung einer befristeten Abweichung von den Präferenzursprungsregeln
    gemäß der Delegierten Verordnung (EU) 2015/2446 in Bezug auf Thunfischfilets
    und Thunfisch-Loins (roh, gegart und tiefgefroren), zubereitet oder haltbar gemacht,
    Makrelenfilets, zubereitet oder haltbar gemacht, und Filets vom Unechten Bonito
    oder von der Fregattmakrele, zubereitet oder haltbar gemacht, aus Cabo Verde
  type: main
- language: bg
  script: Cyrl
