    fabhrach a leagtar síos i Rialachán Tarmligthe (AE) 2015/2446, i leith filléid
    tuinnín ullmhaithe nó leasaithe agus luanta tuinnín ullmhaithe nó leasaithe
    (amh, cócaráilte agus reoite), filléid ronnach ullmhaithe nó leasaithe agus
