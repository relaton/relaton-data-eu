    reguł pochodzenia określonych w rozporządzeniu delegowanym (UE) 2015/2446 w
    odniesieniu do przetworzonych lub zakonserwowanych filetów z tuńczyka i tzw.
    loins z tuńczyka (surowych, poddanych obróbce cieplnej i zamrożonych), przetworzonych
