    pôvodu stanovených v delegovanom nariadení (EÚ) 2015/2446, pokiaľ ide o pripravené
    alebo konzervované filé z tuniaka a chrbtové filé z tuniaka (surové, varené
    a mrazené), pripravené alebo konzervované filé z makrely a pripravené alebo
    konzervované filé z tuniaka fregatového alebo tuniaka makrelovitého
  type: main
- language: sl
  script: Latn
