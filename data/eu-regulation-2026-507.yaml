    kas izklāstīti Deleģētajā regulā (ES) 2015/2446, attiecībā uz sagatavotu
    vai konservētu tunzivs fileju un tunzivju muguras gabaliem (neapstrādātiem,
    termiski apstrādātiem un saldētiem), sagatavotu vai konservētu makreles fileju
    un sagatavotu vai konservētu fregates tunzivs vai makreļtunzivs fileju
  type: main
- language: lt
  script: Latn
