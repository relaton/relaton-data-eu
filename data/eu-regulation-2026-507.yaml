    de origen preferencial establecidas en el Reglamento Delegado (UE) 2015/2446,
    respecto de las preparaciones o conservas de filetes de atún y lomos de atún
    (crudo, cocido o congelado), de las preparaciones o conservas de filetes de caballa,
    y de las preparaciones o conservas de filetes de melva tazard o melva
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2026/507 av den 6 mars 2026
    om beviljande för Kap Verde av ett tillfälligt undantag från de regler om förmånsberättigande
    ursprung som fastställs i delegerad förordning (EU) 2015/2446, med avseende
    på beredda eller konserverade filéer och loins av tonfisk (råa, kokta eller
    frysta), beredda eller konserverade makrillfiléer och beredda eller konserverade
    fregattmakrill- eller auxidmakrillfiléer
