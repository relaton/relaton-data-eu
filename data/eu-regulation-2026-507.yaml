  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2026/507 ze dne 6. března 2026, kterým
    se Kapverdám povoluje dočasná odchylka od pravidel preferenčního původu
    stanovených v nařízení v přenesené pravomoci (EU) 2015/2446, pokud jde o
    přípravky a konzervy z filé a hřbetů z tuňáka (syrových, vařených a
    zmrazených), přípravky a konzervy z filé z makrely a přípravky a konzervy
    z filé z tuňáka nepravého nebo tuňáka makrelovitého
  type: main
- language: da
  script: Latn
