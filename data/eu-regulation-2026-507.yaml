    Cabo Verdeu privremenog odstupanja od pravila o povlaštenom podrijetlu utvrđenih
    u Delegiranoj uredbi (EU) 2015/2446, u pogledu pripremljenih ili konzerviranih
    fileta tune i traka tune (sirovih, kuhanih i smrznutih), pripremljenih ili konzerviranih
    fileta skuše i pripremljenih ili konzerviranih fileta trupca ili trupa
  type: main
