    začasnega odstopanja od pravil o preferencialnem poreklu iz Delegirane uredbe
    (EU) 2015/2446 Zelenortskim otokom za pripravljene ali konzervirane filete tuna
    in filete tuna loins (surove, kuhane in zamrznjene), pripravljene ali konzervirane
    filete skuše in pripravljene ali konzervirane filete fregatnega trupca ali trupca
  type: main
- language: es
  script: Latn
