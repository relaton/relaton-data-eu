    preferencial estabelecidas no Regulamento Delegado (UE) 2015/2446, no que diz
    respeito às preparações ou conservas de filetes de atum e lombos de atum (crus,
    cozidos e congelados), às preparações ou conservas de filetes de sarda e cavala
    e às preparações ou conservas de filetes de judeu-liso ou judeu
  type: main
- language: ro
  script: Latn
