    és tonhaltörzs, az elkészített vagy konzervált makrélafilé és az elkészített
    vagy konzervált tonmakréla- vagy páncélosmakrahal-filé tekintetében az (EU)
    2015/2446 felhatalmazáson alapuló rendeletben a preferenciális származásra
    vonatkozóan meghatározott szabályok alól a Zöld-foki-szigetek számára biztosítandó
    ideiglenes eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2026/507 della Commissione, del 6 marzo
    2026, che concede a Cabo Verde una deroga temporanea alle norme sull’origine
    preferenziale di cui al regolamento delegato (UE) 2015/2446 per quanto riguarda
    le preparazioni o conserve di filetti di tonno (crudi, cotti e congelati), le
    preparazioni o conserve di filetti di sgombro e le preparazioni o conserve di
    filetti di tombarello
  type: main
- language: lv
