title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 85/89 of 16 January 1989 opening compulsory
    distillation as provided for in article 39 of Council Regulation (EEC) No 822/87
    and derogating for the 1988/89 wine year from certain detailed rules for the application
    thereof
  type: main
- language: fr
  script: Latn
  content: 'Rectificatif au règlement (CEE) no 85/89 de la Commission, du 16 janvier
    1989, ouvrant la distillation obligatoire prévue à l'' article 39 du règlement
    (CEE) no 822/87 du Conseil et dérogeant à certaines modalités d'' application
    y afférentes pour la campagne 1988/1989 (« Journal officiel des Communautés
    européennes » no L 13 du 17 janvier 1989.) #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 85/89 DER KOMMISSION vom 16. Januar 1989 zur Eröffnung
    der obligatorischen Destillation gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87
    des Rates und zur Abweichung von diesbezüglichen Durchführungsbestimmungen für
    das Wirtschaftsjahr 1988/89 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 85/89 af 16. januar 1989 om iværksættelse
    af obligatorisk destillation som omhandlet i artikel 39 i Rådets forordning (EØF)
    nr. 822/87 og om undtagelse fra visse bestemmelser om destillations gennemførelse
    for produktionsåret 1988/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 85/89 της Επιτροπής
    της 16ης Ιανουαρίου 1989 για το άνοιγμα της υποχρεωτικής
    αποστάξεως που προβλέπεται στο άρθρο 39 του
    κανονισμού (ΕΟΚ) αριθ. 822/87 του Συμβουλίου και
    για την παρέκκλιση ορισμένων σχετικών λεπτομερειών
    εφαρμογής για την περίοδο 1988/89
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 85/89 della Commissione, del 16 gennaio 1989, recante
    apertura della distillazione obbligatoria di cui all'articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio e recante deroga ad alcune modalità di applicazione
    ad essa relative per la campagna 1988/1989
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 85/89 VAN DE COMMISSIE van 16 januari 1989 tot instelling
    van de in artikel 39 van Verordening (EEG) nr. 822/87 van de Raad bedoelde verplichte
    distillatie en houdende afwijking van uitvoeringsbepalingen ter zake voor het
    wijnoogstjaar 1988/1989 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 85/89 DA COMISSÃO de 16 de Janeiro de 1989 que
    abre a destilação obrigatória referida no artigo 39º do Regulamento (CEE)
    nº 822/87 do Conselho e que derroga determinadas regras de execução correspondentes,
    para a campanha de 1988/1989 #'
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 85/89 de la Comisión, de 16 de enero de 1989, por
    el que se decide iniciar la destilación obligatoria contemplada en el artículo
    39 del Reglamento (CEE) n° 822/87 del Consejo y se establecen casos de excepción
    a algunas de las normas de aplicación correspondientes durante la campaña de
    1988/89
  type: main
