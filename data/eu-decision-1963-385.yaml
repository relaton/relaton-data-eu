title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 11 juin 1963, portant abrogation de sa décision
    du 5 juillet 1962 autorisant la perception d'une taxe compensatoire sur les importations,
    en République fédérale d'Allemagne, de biscuits et gaufres en provenance du
    Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '63/385/EWG: Entscheidung der Kommission vom 11. Juni 1963 zur Änderung
    ihrer Entscheidung vom 5. Juli 1962 über die Erhebung einer Ausgleichsabgabe
    bei der Einfuhr von Waffeln und Keksen aus dem Königreich der Niederlande in
    die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '63/385/CEE: Decisione della Commissione dell''11 giugno 1963 recante abrogazione
    della propria decisione del 5 luglio 1962 relativa all''autorizzazione a riscuotere
    una tassa di compensazione sulle importazioni nella Repubblica federale di Germania
    di biscotti e cialde in provenienza dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '63/385/EEG: Beschikking van de Commissie van 11 juni 1963 houdende nadere
    wijziging van haar beschikking van 5 juli 1962, houdende machtiging tot het leggen
    van een compenserende heffing bij invoer in de Bondsrepubliek Duitsland van biscuits
    en wafels uit het Koninkrijk der Nederlanden'
