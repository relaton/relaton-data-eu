    Nr. 24 (lfd. Nr. 40.0240) mit Ursprung in Indien, dem die in der Verordnung (EWG)
    Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
