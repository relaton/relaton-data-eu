  content: Commission Regulation (EEC) No 2555/89 of 23 August 1989 re-establishing
    the levying of customs duties on nightshirts, pyjamas, knitted or crocheted, products
    of category No 24 (order No 40.0240), originating in India to which the preferential
    tariff arrangements of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2555/89 de la Commission du 23 août 1989 portant
    rétablissement de la perception des droits de douane applicables aux chemises
    de nuit et pyjamas en bonneterie de la catégorie de produits n° 24 (numéro
    d'ordre 40.0240) originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
