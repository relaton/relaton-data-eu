title:
- language: en
  script: Latn
  content: '2010/163/: Commission Decision of 8 March 2010 amending Decision 2008/22/EC
    laying down rules for the implementation of Decision No 573/2007/EC of the European
    Parliament and of the Council establishing the European Refugee Fund for the period
    2008 to 2013 as part of the General programme Solidarity and Management of Migration
    Flows as regards Member States’ management and control systems, the rules for
    administrative and financial management and the eligibility of expenditure on
    projects co-financed by the Fund (notified under document C(2010) 1210)'
  type: main
- language: fr
  script: Latn
  content: '2010/163/: Décision de la Commission du 8 mars 2010 modifiant la décision
    2008/22/CE fixant les modalités de mise en œuvre de la décision n o 573/2007/CE
    du Parlement européen et du Conseil portant création du Fonds européen pour
    les réfugiés pour la période 2008-2013 dans le cadre du programme général
    Solidarité et gestion des flux migratoires en ce qui concerne les systèmes de
    gestion et de contrôle des États membres, les règles de gestion administrative
    et financière et l’éligibilité des dépenses pour les projets cofinancés
    par le Fonds [notifiée sous le numéro C(2010) 1210]'
  type: main
- language: de
  script: Latn
  content: '2010/163/: Beschluss der Kommission vom 8. März 2010 zur Änderung der
