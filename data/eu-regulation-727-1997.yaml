  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 727/97 della Commissione del 24 aprile 1997 che riporta
    un elenco di prodotti esclusi dal campo d'applicazione del regolamento (CEE) n.
    737/90 del Consiglio indicante le condizioni cui è soggetta l'importazione di
    prodotti agricoli originari di paesi terzi a seguito dell'incidente della centrale
    nucleare di Cernobil
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 727/97 van de Commissie van 24 april 1997 tot vaststelling
