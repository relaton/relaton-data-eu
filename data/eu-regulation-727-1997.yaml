title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 727/97 of 24 April 1997 establishing a list
    of products excluded from the application of Council Regulation (EEC) No 737/90
    on the conditions governing imports of agricultural products originating in third
    countries following the accident at the Chernobyl nuclear power station
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 727/97 de la Commission du 24 avril 1997 établissant
    une liste de produits exclus du champ d'application du règlement (CEE) nº 737/90
    du Conseil, relatif aux conditions d'importation de produits agricoles originaires
    des pays tiers à la suite de l'accident survenu à la centrale nucléaire de
    Tchernobyl
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 727/97 der Kommission vom 24. April 1997 zur Festlegung
    einer Liste von Erzeugnissen, die von der Durchführung der Verordnung (EWG) Nr.
    737/90 des Rates über die Einfuhrbedingungen für landwirtschaftliche Erzeugnisse
    mit Ursprung in Drittländern nach dem Unfall im Kernkraftwerk Tschernobyl ausgenommen
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 727/97 af 24. april 1997 om fastsættelse
    af en fortegnelse over produkter, der undtages fra Rådets forordning (EØF) nr.
    737/90 af 22. marts 1990 om betingelser for indførsel af landbrugsprodukter med
    oprindelse i tredjelande som følge af ulykken på kernekraftværket i Tjernobyl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 727/97 της Επιτροπής
    της 24ης Απριλίου 1997 για την κατάρτιση καταλόγου
    προϊόντων που εξαιρούνται από το πεδίο εφαρμογής
    του κανονισμού (ΕΟΚ) αριθ. 737/90 του Συμβουλίου
    σχετικά με τους όρους που διέπουν τις εισαγωγές
    γεωργικών προϊόντων που προέρχονται από τρίτες
    χώρες μετά το ατύχημα στον πυρηνικό σταθμό
    ηλεκτροπαραγωγής του Τσερνομπίλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 727/97, annettu 24 päivänä huhtikuuta 1997,
