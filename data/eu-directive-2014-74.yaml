title:
- language: en
  script: Latn
  content: Commission Delegated Directive 2014/74/EU of 13 March 2014 amending, for
    the purposes of adapting to technical progress, Annex IV to Directive 2011/65/EU
    of the European Parliament and of the Council as regards an exemption for lead
    used in other than C-press compliant pin connector systems for industrial monitoring
    and control instruments
  type: main
- language: fr
  script: Latn
  content: Directive déléguée 2014/74/UE de la Commission du 13 mars 2014 modifiant,
    aux fins de son adaptation au progrès technique, l'annexe IV de la directive
    2011/65/UE du Parlement européen et du Conseil en ce qui concerne une exemption
    pour le plomb dans les systèmes de connecteurs à broches souples autres que
    du type «C-press» destinés à être utilisés dans les instruments de contrôle
    et de surveillance industriels
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie 2014/74/EU der Kommission vom 13. März 2014 zur
    Änderung — zwecks Anpassung an den technischen Fortschritt — des Anhangs
    IV der Richtlinie 2011/65/EU des Europäischen Parlaments und des Rates hinsichtlich
    einer Ausnahme für Blei zur Verwendung in Einpresssteckverbindern mit flexibler
    Zone (andere als solche des Typs „C-Press“ ) für industrielle Überwachungs-
    und Kontrollinstrumente
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива 2014/74/ЕС на Комисията
    от 13 март 2014 година за изменение, с цел привеждане
    в съответствие с техническия прогрес, на приложение
    IV към Директива 2011/65/ЕС на Европейския парламент
    и на Съвета по отношение на освобождаването
    за олово в различни от C-press съвместимите щифтови
    конекторни системи за промишлени прибори за
    контрол и управление
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise v přenesené pravomoci 2014/74/EU ze dne 13. března
    2014 , kterou se za účelem přizpůsobení technickému pokroku mění příloha
    IV směrnice Evropského parlamentu a Rady 2011/65/EU, pokud jde o výjimku pro
    olovo používané v pružných konektorových systémech jiných než se zalisovanými
    kolíky typu C-press pro průmyslové monitorovací a kontrolní přístroje
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv 2014/74/EU af 13. marts 2014 om ændring
    med henblik på tilpasning til den tekniske udvikling af bilag IV til Europa-Parlamentets
    og Rådets direktiv 2011/65/EU for så vidt angår en undtagelse for bly anvendt
    i andre konnektorsystemer end »C-press« konnektorsystemer med deformerbare ben
    (compliant pins) til industrielle overvågnings- og reguleringsinstrumenter
  type: main
- language: el
  script: Grek
  content: Κατ' εξουσιοδότηση οδηγία 2014/74/ΕΕ της Επιτροπής,
    της 13ης Μαρτίου 2014 , για την τροποποίηση, με
    σκοπό την προσαρμογή στην τεχνική πρόοδο, του
    παραρτήματος IV της οδηγίας 2011/65/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, όσον αφορά
    εξαίρεση για τη χρήση μολύβδου σε συστήματα
    άλλα πέραν των συζευκτήρων με ακίδες ενσφήνωσης
    τύπου C για βιομηχανικά όργανα παρακολούθησης
    και ελέγχου
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud direktiiv 2014/74/EL, 13. märts 2014 , millega
    muudetakse tehnika arenguga kohandamise eesmärgil Euroopa Parlamendi ja nõukogu
    direktiivi 2011/65/EL IV lisa seoses erandiga, mis käsitleb plii kasutamist muudes
    kui „C-pressi” tüüpi painduvate klemmidega ühendussüsteemides tööstuslike
    seire- ja kontrolliseadmete jaoks
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu direktiivi 2014/74/EU, annettu 13 päivänä maaliskuuta
    2014 , Euroopan parlamentin ja neuvoston direktiivin 2011/65/EU liitteen IV muuttamisesta
    sen mukauttamiseksi tekniikan kehitykseen sen poikkeuksen osalta, joka koskee
    lyijyä teollisuuden tarkkailu- ja valvontalaitteiden muissa kuin C-press compliant
    pin -tyyppisissä nastaliitinjärjestelmissä
  type: main
- language: hr
  script: Latn
  content: Delegirana direktiva Komisije 2014/74/EU оd 13. ožujka 2014. o izmjeni,
    u svrhu prilagodbe tehničkom napretku, Priloga IV. Direktivi 2011/65/EU Europskog
    parlamenta i Vijeća u pogledu izuzeća za olovo koje se koristi u usklađenim
    sustavima igličastih priključaka koji nisu vrste C-press za instrumente za praćenje
    i kontrolu u industriji Tekst važan za EGP
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2014/74/EU felhatalmazáson alapuló irányelve ( 2014. március
    13. ) a 2011/65/EU európai parlamenti és tanácsi irányelv IV. mellékletének
    az ipari felügyeleti és vezérlő eszközökben használt, a C-Press rugalmas
    tűs csatlakozórendszereken kívüli rugalmas tűs csatlakozórendszerekben lévő
    ólom mentesítése tekintetében, a műszaki fejlődéshez történő hozzáigazítás
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva delegata 2014/74/UE della Commissione, del 13 marzo 2014 , che
    modifica, adattandolo al progresso tecnico, l'allegato IV della direttiva 2011/65/UE
    del Parlamento europeo e del Consiglio per quanto riguarda un'esenzione relativa
    al piombo in dispositivi diversi dai sistemi di connettori a pin conformi «C-press»
    per strumenti di monitoraggio e controllo industriali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā direktīva 2014/74/ES ( 2014. gada 13. marts ), ar
    ko, pielāgojot zinātnes un tehnikas attīstībai, groza Eiropas Parlamenta un
    Padomes Direktīvas 2011/65/ES IV pielikumu attiecībā uz atbrīvojumu svina
    lietošanai tādās pielāgotiesspējīgu kontakttapu sistēmās, kuras nav C-press
    pielāgotiesspējīgu kontakttapu (kontaktsaderīgu savienotāju) sistēmas un
    kuras izmanto vadītspējas mērīšanai
  type: main
- language: lt
  script: Latn
  content: 2014 m. kovo 13 d. Komisijos deleguotoji direktyva 2014/74/ES, kuria, derinant
    prie technikos pažangos, iš dalies keičiamos Europos Parlamento ir Tarybos
    direktyvos 2011/65/ES IV priedo nuostatos dėl švino naudojimo kitose nei su
    „C-Press“ suderinamose kištukinių jungčių sistemose, skirtose pramoniniams
    stebėjimo ir kontrolės prietaisams, išimties
  type: main
- language: mt
  script: Latn
  content: Direttiva ta' Delega tal-Kummissjoni 2014/74/UE tat- 13 ta' Marzu 2014
    li temenda, għal skopijiet ta' adattament għall-progress tekniku, l-Anness IV
    tad-Direttiva 2011/65/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward ta' eżenzjoni
    għal ċomb użat f'sistemi ta' konnetturi tal-pinnijiet oħra li mhumiex dawk
    konformi mas-C-press għal sistemi ta' monitoraġġ u kontroll industrijali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Richtlijn 2014/74/EU van de Commissie van 13 maart 2014 tot
    wijziging, met het oog op aanpassing aan de technische vooruitgang, van bijlage
    IV bij Richtlijn 2011/65/EU van het Europees Parlement en de Raad wat betreft
    een vrijstelling voor lood in connectorsystemen met buigzame pinnen, andere dan
    van het type C-press, voor industriële meet- en regelapparatuur
  type: main
- language: pl
  script: Latn
  content: Dyrektywa delegowana Komisji 2014/74/UE z dnia 13 marca 2014 r. zmieniająca,
    w celu dostosowania do postępu technicznego, załącznik IV do dyrektywy Parlamentu
    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla ołowiu stosowanego
    w systemach złączy stykowych innych niż zgodne z technologią C-press, wykorzystywanych
    w przyrządach do nadzoru i kontroli w obiektach przemysłowych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada 2014/74/UE da Comissão, de 13 de março de 2014 , que
    altera, para efeitos de adaptação ao progresso técnico, o anexo IV da Diretiva
    2011/65/UE do Parlamento Europeu e do Conselho no respeitante a uma isenção
    para a utilização de chumbo em sistemas de conexão por pinos conformes, diversos
    do tipo C-press, para instrumentos industriais de monitorização e controlo
  type: main
- language: ro
  script: Latn
  content: Directiva delegată 2014/74/UE a Comisiei din 13 martie 2014 de modificare,
    în scopul adaptării la progresul tehnic, a anexei IV la Directiva 2011/65/UE
    a Parlamentului European și a Consiliului în ceea ce privește o derogare pentru
    plumbul utilizat în alte sisteme decât cele de conectori cu pini conformi „C-press”
    pentru instrumente industriale de monitorizare și control
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie 2014/74/EÚ z 13. marca 2014 , ktorým sa
    na účely prispôsobenia technickému pokroku mení príloha IV k smernici Európskeho
    parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku pri používaní olova v
    iných systémoch ako v zodpovedajúcich pin konektoroch typu C-press pre priemyselné
    monitorovacie a kontrolné prístroje
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije 2014/74/EU z dne 13. marca 2014 o spremembi
    Priloge IV k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    pri uporabi svinca v skladnih sistemih pinskih priključkov, razen sistema C-press,
    za instrumente za spremljanje in nadzor za industrijsko uporabo zaradi prilagoditve
    tehničnemu napredku
  type: main
- language: es
  script: Latn
  content: Directiva Delegada 2014/74/UE de la Comisión, de 13 de marzo de 2014 ,
    que modifica, para adaptarlo al progreso técnico, el anexo IV de la Directiva
    2011/65/UE del Parlamento Europeo y del Consejo en lo relativo a una exención
    para el plomo utilizado en sistemas de conectores de pines distintos de los del
    tipo C-press que se ajustan a las normas y destinados a instrumentos industriales
    de vigilancia y control
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv 2014/74/EU av den 13 mars 2014 om ändring,
    för anpassning till den tekniska utvecklingen, av bilaga IV till Europaparlamentets
    och rådets direktiv 2011/65/EU vad gäller undantag för bly använt i andra
    system än ”C-press” -kontaktsystem (press fit) för industriella övervaknings-
    och kontrollinstrument
  type: main
