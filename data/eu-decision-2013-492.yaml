    plomb et le mercure au-delà de la date d’application des valeurs limites pour
    certaines substances chimiques en vertu de l’article 55, deuxième phrase, de
    la directive 2009/48/CE du Parlement européen et du Conseil relative à la sécurité
    des jouets, conformément à l’ordonnance du président du Tribunal du 15 mai
    2013 (affaire T-198/12 R) [notifiée sous le numéro C(2013) 6387]'
