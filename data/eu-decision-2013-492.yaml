  script: Latn
  content: '2013/492/EU: Commission Decision of 7 October 2013 authorising Germany
    to maintain the limit values for antimony, arsenic, barium, lead and mercury beyond
    the entry into application of the limit values for chemical substances according
    to Article 55, 2nd sentence of Directive 2009/48/EC of the European Parliament
    and of the Council on the safety of toys in application of the Order of the President
    of the General Court of 15 May 2013 (T-198/12R) (notified under document C(2013)
    6387)'
  type: main
- language: fr
  script: Latn
  content: '2013/492/UE: Décision de la Commission du 7 octobre 2013 autorisant l’Allemagne
