title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2438/78 of 18 October 1978 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02, originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2438/78 de la Commission, du 18 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée de la position tarifaire 60.02,
    originaire des pays et territoires en voie de développement, bénéficiaires
    de préférences tarifaires prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2438/78 der Kommission vom 18. Oktober 1978 zur Wiedereinführung
    des Zollsatzes fúr Handschuhe aus Gewirken, weder gummielastisch noch kautschutiert,
    der Tarifnummer 60.02, mit Ursprung in Entwicklungslándern, denen die in der
    Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpráferenzen gewáhrt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2438/78 af 18. oktober 1978 om genindførelse
    af toldafgifter for handsker, vanter og luffer af trikotage, ikke elastisk eller
    gummeret, under position 60.02, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2438/78 della Commissione, del 18 ottobre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia non
    elastica né gommata, della voce 60.02 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2438/78 van de Commissie van 18 oktober 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 1197/78 van de Raad tariefpreferenties werden
    geopend
