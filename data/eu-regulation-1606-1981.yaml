title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1606/81 of 16 June 1981 re-establishing
    the levying of customs duties on articles of apparel, gloves and other clothing
    accessories, falling within subheadings 42.03 A, B II and III and C and originating
    in Hong Kong, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1606/81 de la Commission, du 16 juin 1981, portant
    établissement de la perception des droits de douane applicables aux vêtements,
    gants et autres accessoires du vêtement, des sous-positions 42.03 A, 42.03 B
    II, III et 42.03 C du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1606/81 der Kommission vom 16. Juni 1981 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung, Handschuhe und anderes Bekleidungszubehör
    der Tarifstellen 42.03 A, B II, III und C, mit Ursprung in Hongkong, dem die in
    der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1606/81 af 16. juni 1981 om genindførelse
    af opkrævning af told for beklædningsgenstande, handsker og tilbehør til beklædningsgenstande,
    henhørende under pos. 42.03 A, B II, III og C og med oprindelse i Hongkong, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1606/81 τής Επιτροπής
    τής 16ης Ιουνίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά ενδύματα, χειρόκτια
    καί έτερα συμπληρώματα τής ενδύσεως τών δασμολογικών
    διακρίσεων 42. 03 Α, Β ΙΙ, ΙΙΙ, Γ, καταγωγής Χόνγκ
    Κόνγκ, δικαιούχων τών προβλεπομένων από τόν
    κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1606/81 della Commissione, del 16 giugno 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di vestiario,
    guanti e altri accessori per oggetti di vestiario, delle sottovoci doganali 42.03
    A, B II e III e C, originari di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1606/81 van de Commissie van 16 juni 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding, handschoenen
    en ander kledingtoebehoren van postonderverdeling 42.03 A ; B II, III ; C, van
    oorsprong uit Hong-Kong waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad
    vermelde tariefpreferenties zijn verleend
