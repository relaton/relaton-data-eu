title:
- language: en
  script: Latn
  content: Council Directive 96/22/EC of 29 April 1996 concerning the prohibition
    on the use in stockfarming of certain substances having a hormonal or thyrostatic
    action and of ß-agonists, and repealing Directives 81/602/EEC, 88/146/EEC and
    88/299/EEC
  type: main
- language: fr
  script: Latn
  content: Directive 96/22/CE du Conseil, du 29 avril 1996, concernant l'interdiction
    d'utilisation de certaines substances à effet hormonal ou thyréostatique et
    des substances ß-agonistes dans les spéculations animales et abrogeant les directives
    81/602/CEE, 88/146/CEE et 88/299/CEE
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/22/EG des Rates vom 29. April 1996 über das Verbot der Verwendung
    bestimmter Stoffe mit hormonaler bzw. thyreostatischer Wirkung und von ß- Agonisten
    in der tierischen Erzeugung und zur Aufhebung der Richtlinien 81/602/EWG, 88/146/EWG
    und 88/299/EWG
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/22/ЕО на Съвета от 29 април 1996
    година относно забрана на употребата на определени
    субстанции с хормонално или тиреостатично
    действие и на бета-агонисти в животновъдството
    и за отмяна на Директиви 81/602/ЕИО, 88/146/ЕИО и 88/299/ЕИО
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/22/ES ze dne 29. dubna 1996 o zákazu používání některých
    látek s hormonálním nebo tyreostatickým účinkem a beta-sympatomimetik v
    chovech zvířat a o zrušení směrnic 81/602/EHS, 88/146/EHS a 88/299/EHS
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/22/EF af 29. april 1996 om forbud mod anvendelse af
    visse stoffer med hormonal og thyreostatisk virkning og af ß-agonister i husdyrbrug
    og om ophævelse af direktiv 81/602/EØF, 88/146/EØF og 88/299/EØF
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/22/ΕΚ του Συμβουλίου, της 29ης Απριλίου
    1996, για την απαγόρευση της χρησιμοποίησης ορισμένων
    ουσιών με ορμονική ή θυρεοστατική δράση και
    των β- ανταγωνιστικών ουσιών στη ζωική παραγωγή
    για κερδοσκοπικούς λόγους και κατάργησης των
    οδηγιών 81/602/ΕΟΚ, 88/146/ΕΟΚ και 88/299/ΕΟΚ
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/22/EÜ, 29. aprill 1996, mis käsitleb teatavate
    hormonaalse või türostaatilise toimega ainete ja beetaagonistide kasutamise
    keelamist loomakasvatuses ning millega tunnistatakse kehtetuks direktiivid 81/602/EMÜ,
    88/146/EMÜ ja 88/299/EMÜ
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/22/EY, annettu 29 päivänä huhtikuuta 1996, tiettyjen
    hormonaalista tai tyrostaattista vaikutusta omaavien aineiden ja beta-agonistien
    käytön kieltämisestä kotieläintuotannossa ja direktiivien 81/602/ETY, 88/146/ETY
    ja 88/299/ETY kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 96/22/EZ od 29. travnja 1996. o zabrani primjene određenih
    tvari hormonskog ili tireostatskog učinka i beta-agonista na farmskim životinjama
    i o stavljanju izvan snage direktiva 81/602/EEZ, 88/146/EEZ i 88/299/EEZ
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/22/EK irányelve (1996. április 29.) az egyes hormon- vagy
    tireosztatikus hatású anyagoknak és a ß-agonistáknak az állattenyésztésben
    történő felhasználására vonatkozó tilalomról, valamint a 81/602/EGK, 88/146/EGK
    és 88/299/EGK irányelv hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Direttiva 96/22/CE del Consiglio, del 29 aprile 1996, concernente il divieto
    d'utilizzazione di talune sostanze ad azione ormonica, tireostatica e delle sostanze
    ß-agoniste nelle produzioni animali e che abroga le direttive 81/602/CEE, 88/146/CEE
    e 88/299/CEE
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 96/22/EK (1996. gada 29. aprīlis) par noteiktu hormonālas
    vai tireostatiskas iedarbības vielu un beta-agonistu lietošanas aizliegumu lopkopībā
    un par Direktīvu 81/602/EEK, 88/146/EEK un 88/299/EEK atcelšanu
  type: main
- language: lt
  script: Latn
  content: 1996 m. balandžio 29 d. Tarybos direktyva 96/22/EB dėl draudimo vartoti
    gyvulininkystėje tam tikras medžiagas, turinčias hormoninį ar tirostatinį
    poveikį, bei beta antagonistus ir dėl Direktyvų 81/602/EEB, 88/146/EEB ir 88/299/EEB
    panaikinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/22/KE tad-29 ta’April 1996 li tikkonċerna
    l-projbizzjoni ta’ l-użu fl-istockfarming ta’ ċerti sustanzi li jkollhom
    azzjoni ormonika u tyrostatika u ta’ beta-agonists u li tħassar id-Direttivi
    81/602/KEE, 88/146/KEE u 88/299/KEE
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/22/EG van de Raad van 29 april 1996 betreffende het verbod
    op het gebruik, in de veehouderij, van bepaalde stoffen met hormonale werking
    en van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten
    en tot intrekking van de Richtlijnen 81/602/EEG, 88/146/EEG en 88/299/EEG
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/22/WE z dnia 29 kwietnia 1996 r. dotycząca zakazu stosowania
    w gospodarstwach hodowlanych niektórych związków o działaniu hormonalnym,
    tyreostatycznym i ß-agonistycznym i uchylająca dyrektywy 81/602/EWG, 88/146/EWG
    oraz 88/299/EWG
  type: main
- language: pt
  script: Latn
  content: Directiva 96/22/CE do Conselho, de 29 Abril de 1996, relativa à proibição
    de utilização de certas substâncias com efeitos hormonais ou tireostáticos
    e de substâncias ß-agonistas em produção animal e que revoga as Directivas
    81/602/CEE, 88/146/CEE e 88/299/CEE
  type: main
- language: ro
  script: Latn
  content: Directiva 96/22/CE a Consiliului din 29 aprilie 1996 privind interzicerea
    utilizării anumitor substanțe cu efect hormonal sau tireostatic și a substanțelor
    β-agoniste în creșterea animalelor și de abrogare a Directivelor 81/602/CEE,
    88/146/CEE și 88/299/CEE
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/22/ES z 29. apríla 1996 o zákaze používania určitých
    látok s hormonálnym alebo tyrostatickým účinkom a beta-agonistov pri chove
    dobytka, ktorou sa zrušujú smernice 81/602/EHS, 88/146/EHS a 88/299/EHS
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/22/ES z dne 29. aprila 1996 o prepovedi uporabe v živinoreji
    določenih snovi, ki imajo hormonalno ali tirostatično delovanje, in beta-agonistov
    ter o razveljavitvi direktiv 81/602/EGS, 88/146/EGS in 88/299/EGS
  type: main
- language: es
  script: Latn
  content: Directiva 96/22/CE del Consejo, de 29 de abril de 1996, por la que se prohíbe
    utilizar determinadas sustancias de efecto hormonal y tireostático y sustancias
    ß- agonistas en la cría de ganado y por la que se derogan las Directivas 81/602/CEE,
    88/146/CEE y 88/299/CEE
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/22/EG av den 29 april 1996 om förbud mot användning
    av vissa ämnen med hormonell och tyreostatisk verkan samt av ß-agonister vid
    animalieproduktion och om upphävande av direktiv 81/602/EEG, 88/146/EEG och 88/299/EEG
  type: main
