id: EURegulation20152066
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/2066 of 17 November 2015 establishing,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council, minimum requirements and the conditions for mutual recognition for the
    certification of natural persons carrying out installation, servicing, maintenance,
    repair or decommissioning of electrical switchgear containing fluorinated greenhouse
    gases or recovery of fluorinated greenhouse gases from stationary electrical switchgear
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/2066 de la Commission du 17 novembre
    2015 établissant, conformément au règlement (UE) n° 517/2014 du Parlement
    européen et du Conseil, des prescriptions minimales et les conditions applicables
    à la reconnaissance mutuelle de la certification des personnes physiques intervenant
    dans l'installation, l'entretien, la maintenance, la réparation ou la mise hors
    service des appareils de commutation électrique contenant des gaz à effet de
    serre fluorés ou la récupération des gaz à effet de serre fluorés provenant
    des appareils de commutation électrique fixes
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/2066 der Kommission vom 17. November
    2015 zur Festlegung — gemäß der Verordnung (EU) Nr. 517/2014 des Europäischen
    Parlaments und des Rates — der Mindestanforderungen und der Bedingungen für
    die gegenseitige Anerkennung im Hinblick auf die Zertifizierung von natürlichen
    Personen, die fluorierte Treibhausgase enthaltende elektrische Schaltanlagen installieren,
    warten, instand halten, reparieren oder stilllegen oder fluorierte Treibhausgase
    aus ortsfesten elektrischen Schaltanlagen zurückgewinnen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/2066 на Комисията
    от 17 ноември 2015 година за установяване, съгласно
    Регламент (ЕС) № 517/2014 на Европейския парламент
    и на Съвета, на минимални изисквания и на условия
    за взаимно признаване на сертифицирането на
    физически лица, извършващи монтаж, сервизно
    обслужване, поддръжка, ремонт или извеждане
    от експлоатация на електрическа комутационна
    апаратура, съдържаща флуорсъдържащи парникови
    газове, или събиране и съхраняване на флуорсъдържащи
    парникови газове от стационарна електрическа
    комутационна апаратура
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/2066 ze dne 17. listopadu 2015,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) č. 517/2014 zavádějí
    minimální požadavky na certifikaci fyzických osob provádějících instalaci,
    servis, údržbu, opravu nebo vyřazení z provozu elektrických spínacích zařízení
    obsahujících fluorované skleníkové plyny nebo znovuzískávání fluorovaných
    skleníkových plynů ze stacionárních elektrických spínacích zařízení
    a podmínky pro vzájemné uznávání této certifikace
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/2066 af 17. november
    2015 om fastsættelse i medfør af Europa-Parlamentets og Rådets forordning (EU)
    nr. 517/2014 af mindstekrav og betingelser for gensidig anerkendelse i forbindelse
    med autorisation af fysiske personer, som udfører installering, servicering,
    vedligeholdelse, reparation eller nedlukning af elektriske koblingsanlæg, som
    indeholder fluorholdige drivhusgasser, eller genvinding af visse fluorholdige
    drivhusgasser fra stationære elektriske koblingsanlæg
  type: main
- language: el
  script: Grek
