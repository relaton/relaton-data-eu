    asennuksen, kunnossapidon, huollon, korjauksen tai käytöstäpoiston taikka kiinteästi
    asennetuista sähköisistä kytkinlaitteistoista tapahtuvan fluorattujen kaasujen
    talteenoton osalta luonnollisille henkilöille myönnettävän pätevöinnin vähimmäisvaatimusten
    ja vastavuoroisen tunnustamisen edellytysten vahvistamisesta Euroopan parlamentin
    ja neuvoston asetuksen (EU) N:o 517/2014 nojalla
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/2066 оd 17. studenoga 2015. o utvrđivanju,
    u skladu s Uredbom (EU) br. 517/2014 Europskog parlamenta i Vijeća, minimalnih
    zahtjeva i uvjeta za uzajamno priznavanje certifikacije fizičkih osoba koje obavljaju
    ugradnju, servisiranje, održavanje, popravak ili stavljanje izvan pogona električnih
    rasklopnih uređaja koji sadržavaju fluorirane stakleničke plinove, ili prikupljanje
    fluoriranih stakleničkih plinova iz električnih rasklopnih uređaja
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/2066 végrehajtási rendelete (2015. november 17.)
    az 517/2014/EU európai parlamenti és tanácsi rendelet alapján a fluortartalmú
    üvegházhatású gázokat tartalmazó elektromos kapcsolóberendezések telepítését,
    szervizelését, karbantartását, javítását vagy használaton kívül helyezését
    vagy a fluortartalmú üvegházhatású gázok helyhez kötött elektromos kapcsolóberendezésekből
    való visszanyerését végző természetes személyek képesítésére vonatkozó
    minimumkövetelmények és kölcsönös elismerési feltételek meghatározásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/2066 della Commissione, del 17 novembre
    2015, che stabilisce, a norma del regolamento (UE) n. 517/2014 del Parlamento
    europeo e del Consiglio, i requisiti minimi e le condizioni per il riconoscimento
    reciproco della certificazione delle persone fisiche addette all'installazione,
    assistenza, manutenzione, riparazione o disattivazione di commutatori elettrici
    contenenti gas fluorurati ad effetto serra o al recupero di gas fluorurati ad
    effetto serra da commutatori elettrici fissi
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/2066 (2015. gada 17. novembris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (ES) Nr. 517/2014 nosaka
    sertifikācijas prasību minimumu un savstarpējas atzīšanas nosacījumus, ko
    piemēro fiziskām personām, kuras veic tādu elektrosadales iekārtu uzstādīšanu,
    apkalpi, tehnisko apkopi, remontu vai izņemšanu no ekspluatācijas, kurās ir
    fluorētās siltumnīcefekta gāzes, vai fluorēto siltumnīcefekta gāzu rekuperāciju
    no stacionārajām elektrosadales iekārtām
  type: main
- language: lt
  script: Latn
  content: 2015 m. lapkričio 17 d. Komisijos įgyvendinimo reglamentas (ES) 2015/2066,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) Nr. 517/2014 nustatomi
    fizinių asmenų, užsiimančių aukštos įtampos skirstomųjų įrenginių,
    kuriuose yra fluorintų šiltnamio efektą sukeliančių dujų, montavimu, aptarnavimu,
    technine priežiūra, remontu ar eksploatacijos nutraukimu arba fluorintų šiltnamio
    efektą sukeliančių dujų surinkimu iš stacionarių aukštos įtampos skirstomųjų
    įrenginių, būtiniausi sertifikavimo reikalavimai ir abipusio pripažinimo sąlygos
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/2066 tas-17 ta'
    Novembru 2015 li jistabbilixxi, skont ir-Regolament (UE) Nru 517/2014 tal-Parlament
    Ewropew u tal-Kunsill, ir-rekwiżiti minimi u l-kundizzjonijiet għall-għarfien
    reċiproku għaċ-ċertifikazzjoni ta' persuni fiżiċi li jwettqu l-istallazzjoni,
    is-servisjar, il-manutenzjoni, it-tiswija jew id-dekummissjonar ta' tagħmir tat-tqassim
    tal-elettriku li fih gassijiet fluworurati b'effett ta' serra jew l-irkupru ta'
    gassijiet fluworurati b'effett ta' serra minn tagħmir għat-tqassim tal-elettriku
    stazzjonarju
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/2066 van de Commissie van 17 november
    2015 tot vaststelling, ingevolge Verordening (EU) nr. 517/2014 van het Europees
    Parlement en de Raad, van minimumeisen en de voorwaarden voor wederzijdse erkenning
    voor de certificering van natuurlijke personen die gefluoreerde broeikasgassen
    bevattende elektrische schakelinrichtingen installeren, servicen, onderhouden,
    repareren of buiten dienst stellen of gefluoreerde broeikasgassen terugwinnen
    uit stationaire elektrische schakelinrichtingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/2066 z dnia 17 listopada 2015
    r. ustanawiające, zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady
    (UE) nr 517/2014, minimalne wymagania i warunki dotyczące wzajemnego uznawania
    certyfikacji osób fizycznych dokonujących instalacji, serwisowania, konserwacji,
    napraw lub likwidacji rozdzielnic elektrycznych zawierających fluorowane gazy
    cieplarniane bądź dokonujących odzysku fluorowanych gazów cieplarnianych ze
    stacjonarnych rozdzielnic elektrycznych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/2066 da Comissão, de 17 de novembro
    de 2015, que estabelece, nos termos do Regulamento (UE) n.° 517/2014 do Parlamento
    Europeu e do Conselho, os requisitos mínimos e as condições para o reconhecimento
    mútuo da certificação de pessoas singulares que procedam à instalação, assistência
    técnica, manutenção, reparação ou desativação de comutadores elétricos
    que contenham gases fluorados com efeito de estufa ou à recuperação destes
    gases de comutadores elétricos fixos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/2066 al Comisiei din 17 noiembrie
    2015 de stabilire, în temeiul Regulamentului (UE) nr. 517/2014 al Parlamentului
    European și al Consiliului, a cerințelor minime și a condițiilor pentru recunoaștere
    reciprocă în scopul certificării persoanelor fizice care efectuează instalarea,
    asigurarea service-ului, întreținerea, repararea sau scoaterea din funcțiune
    a întrerupătoarelor electrice care conțin gaze fluorurate cu efect de seră
    sau recuperarea gazelor fluorurate cu efect de seră din întrerupătoare electrice
    fixe
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/2066 zo 17. novembra 2015, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (EÚ) č. 517/2014 stanovujú
    minimálne požiadavky a podmienky vzájomného uznávania osvedčení fyzických
    osôb, ktoré vykonávajú inštaláciu, servis, údržbu, opravu alebo vyraďovanie
    z prevádzky elektrických rozvádzačov obsahujúcich fluórované skleníkové
    plyny, alebo zhodnocovanie fluórovaných skleníkových plynov zo stacionárnych
    elektrických rozvádzačov
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/2066 z dne 17. novembra 2015 o določitvi
    minimalnih zahtev in pogojev za vzajemno priznavanje za izdajanje spričeval fizičnim
    osebam, ki nameščajo, servisirajo, vzdržujejo, popravljajo ali razgrajujejo
    električne stikalne mehanizme, ki vsebujejo fluorirane toplogredne pline, ali
    zajemajo fluorirane toplogredne pline iz nepremičnih električnih stikalnih mehanizmov
    v skladu z Uredbo (EU) št. 517/2014 Evropskega parlamenta in Sveta
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/2066 de la Comisión, de 17 de noviembre
    de 2015, por el que se establecen, de conformidad con el Reglamento (UE) n° 517/2014
    del Parlamento Europeo y del Consejo, los requisitos mínimos y las condiciones
    para el reconocimiento mutuo de la certificación de las personas físicas que
    lleven a cabo la instalación, revisión, mantenimiento, reparación o desmontaje
    de los conmutadores eléctricos que contengan gases fluorados de efecto invernadero
    o la recuperación de los gases fluorados de efecto invernadero de los conmutadores
    eléctricos fijos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/2066 av den 17 november
    2015 om fastställande, i enlighet med Europaparlamentets och rådets förordning
    (EU) nr 517/2014, av minimikrav och villkor för ömsesidigt erkännande för
    certifiering av fysiska personer som utför installation, service, underhåll,
    reparation eller nedmontering av elektriska brytare som innehåller fluorerade
    växthusgaser eller återvinning av fluorerade växthusgaser från stationära
    elektriska brytare
