    kasvuhoonegaaside kokkukogumisega tegelevate füüsiliste isikute sertifitseerimise
    miinimumnõuded ja vastastikuse tunnustamise tingimused
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/2066, annettu 17 päivänä
