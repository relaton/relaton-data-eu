  content: COMMISSION REGULATION (EC) No 3596/93 of 21 December 1993 fixing the standard
    values to be used in calculating the financial compensation and the advance pertaining
    thereto in respect of fishery products withdrawn from the market during the 1994
    fishing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3596/93 de la Commission du 21 décembre 1993 fixant
    la valeur forfaitaire des produits de la pêche retirés du marché pendant la
    campagne de pêche 1994 intervenant dans le calcul de la compensation financière
    et de l'avance y afférente
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3596/93 DER KOMMISSION vom 21. Dezember 1993 zur Festsetzung
    des Pauschalwerts für das Fischwirtschaftsjahr 1994 für die aus dem Handel genommenen
    Fischereierzeugnisse, der zur Berechnung des finanziellen Ausgleichs und des entsprechenden
    Vorschusses dient
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3596/93 af 21. december 1993 om fastsættelse
    af den ved beregningen af den finansielle udligning og det tilsvarende forskud
    anvendte forudfastsatte værdi af fiskerivarer, der tages tilbage fra markedet
    i fangstsæsonen 1994
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3596/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Δεκεμβρίου 1993 περί καθορισμού της κατ'
    αποκοπήν αξίας των προϊόντων αλιείας που αποσύρονται
    από την αγορά κατά την αλιευτική περίοδο 1994
    η οποία παρεμβαίνει στον υπολογισμό της χρηματικής
    αντισταθμίσεως και της σχετικής προκαταβολής
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3596/93 DELLA COMMISSIONE del 21 dicembre 1993 che
    fissa, ai fini del calcolo della compensazione finanziaria e dell' anticipo corrispondente,
    il valore forfettario dei prodotti della pesca ritirati dal mercato nella campagna
    di pesca 1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3596/93 VAN DE COMMISSIE van 21 december 1993 betreffende
    de vaststelling van de forfaitaire waarde voor het visseizoen 1994 voor de uit
    de markt genomen visserijprodukten voor de berekening van de financiële vergoeding
    en het hierop betrekking hebbende voorschot
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3596/93 DA COMISSÃO de 21 de Dezembro de 1993 que
    fixa, para efeitos do cálculo da compensação financeira e do adiantamento que
    lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3596/93 DE LA COMISIÓN de 21 de diciembre de 1993
    por el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campaña pesquera de 1994 que ha de utilizarse en el cálculo
    de la compensación financiera y del anticipo relacionado con ésta
