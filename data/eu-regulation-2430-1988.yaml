title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2430/88 of 2 August 1988 re-establishing
    the leving of customs duties on articles of apparel and clothing accessories,
    of leather, falling within CN code 4203 originating in Pakistan to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2430/88 de la Commission du 2 août 1988 portant rétablissement
    de la perception des droits de douane applicables aux vêtements et accessoires
    du vêtement en cuir du code NC 4203, originaires du Pakistan, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2430/88 der Kommission vom 2. August 1988 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör aus Leder der
    Position 4203 der Kombinierten Nomenklatur mit Ursprung in Pakistan, dem die in
    der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2430/88 af 2. august 1988 om genindførelse
    af opkrævning af told for beklædningsgenstande og tilbehør dertil, af læder,
    henhørende under KN-kode 4203 og med oprindelse i Pakistan, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2430/88 της Επιτροπής
    της 2ας Αυγούστου 1988 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ενδύματα και εξαρτήματα
    του ενδύματος από δέρμα, του κωδικού ΣΟ 4203,
    καταγωγής Πακιστάν, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3635/87 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2430/88 della Commissione del 2 agosto 1988 che ripristina
    la riscossione dei dazi doganali applicabili agli oggetti di vestiario e loro
    accessori di cuoio del codice NC 4203 originari del Pakistan beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2430/88 van de Commissie van 2 augustus 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren van leder, van GN-code 4203, van oorsprong uit Pakistan, waarvoor
    de in Verordening (EEG) nr. 3635/87 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2430/88 da Comissão de 2 de Agosto de 1988 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis ao vestuário e seus
    acessórios, de couro, do código 4203 da nomenclatura combinada, originários
    do Paquistão, beneficiário das preferências pautais previstas pelo Regulamento
    (CEE) n.° 3635/87 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2430/88 de la Comisión de 2 de agosto de 1988 relativo
