    (EY) N:o 1081/2000 kumoamisesta annetun neuvoston asetuksen (EY) N:o 798/2004
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1517/2004/EK rendelete (2004. augusztus 25.) a Burmával/Mianmarral
