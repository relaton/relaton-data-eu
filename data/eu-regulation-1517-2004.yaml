  script: Latn
  content: Commission Regulation (EC) No 1517/2004 of 25 August 2004 amending Council
    Regulation (EC) No 798/2004 renewing the restrictive measures in respect of Burma/Myanmar
    and repealing Regulation (EC) No 1081/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1517/2004 de la Commission du 25 août 2004 modifiant
    le règlement (CE) n° 798/2004 du Conseil renouvelant les mesures restrictives
    instituées à l'encontre de la Birmanie/du Myanmar et abrogeant le règlement
    (CE) n° 1081/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1517/2004 der Kommission vom 25. August 2004 zur Änderung
    der Verordnung (EG) Nr. 798/2004 des Rates zur Verlängerung der restriktiven
    Maßnahmen gegen Birma/Myanmar und zur Aufhebung der Verordnung (EG) Nr. 1081/2000
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1517/2004 ze dne 25. srpna 2004, kterým se
