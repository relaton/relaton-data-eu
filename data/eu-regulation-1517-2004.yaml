    uz Birmu/Mjanmu un Regulas (EK) Nr. 1081/2000 atcelšanu
  type: main
- language: lt
  script: Latn
  content: 2004 m. rugpjūčio 25 d. Komisijos reglamentas (EB) Nr. 1517/2004, iš
