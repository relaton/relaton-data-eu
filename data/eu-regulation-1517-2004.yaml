    għal dak li jirrigwarda l-Burma/Myanmar u r-Regolament abrogattiv (KE) Nru 1081/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1517/2004 van de Commissie van 25 augustus 2004 tot
    wijziging van Verordening (EG) nr. 798/2004 van de Raad tot verlenging van de
    beperkende maatregelen ten aanzien van Birma/Myanmar en tot intrekking van Verordening
    (EG) nr. 1081/2000
  type: main
- language: pl
  script: Latn
