    do Birmy/Myanmaru oraz uchylające rozporządzenie (WE) nr 1081/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1517/2004 do Conselho, de 25 de Agosto de 2004, que
