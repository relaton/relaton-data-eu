    vůči Barmě/Myanmaru a kterým se zrušuje nařízení (ES) č. 1081/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1517/2004 af 25. august 2004 om ændring
    af Rådets forordning (EF) nr. 798/2004 om forlængelse af de restriktive foranstaltninger
    over for Burma/Myanmar og om ophævelse af forordning (EF) nr. 1081/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1517/2004 της Επιτροπής,
    της 25ης Αυγούστου 2004, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 798/2004 του Συμβουλίου για
    την ανανέωση των περιοριστικών μέτρων κατά
    της Βιρμανίας/Μυανμάρ και την κατάργηση του
    κανονισμού (ΕΚ) αριθ. 1081/2000
  type: main
- language: et
  script: Latn
