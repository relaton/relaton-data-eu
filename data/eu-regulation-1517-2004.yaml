    opatrenia voči Barme/Mjanmarsku, a ruší sa nariadenie (ES) č. 1081/2000
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1517/2004 z dne 25. avgusta 2004 o spremembi
