    hatályon kívül helyezéséről szóló 798/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1517/2004 della Commissione, del 25 agosto 2004, recante
    modifica del regolamento (CE) n. 798/2004 del Consiglio che proroga le misure
