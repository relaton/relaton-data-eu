    aplicáveis à Birmânia/Mianmar e revoga o Regulamento (CE) n.° 1081/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1517/2004 z 25. augusta 2004, ktorým sa mení
