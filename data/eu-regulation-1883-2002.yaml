title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1883/2002 of 22 October 2002 amending Council
    Regulation (EC) No 1081/2000 prohibiting the sale, supply and export to Burma/Myanmar
    of equipment which might be used for internal repression or terrorism, and freezing
    the funds of certain persons related to important governmental functions in that
    country
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1883/2002 de la Commission du 22 octobre 2002 modifiant
    le règlement (CE) n° 1081/2000 du Conseil concernant l'interdiction de la vente,
    de la fourniture et de l'exportation à la Birmanie/au Myanmar de matériel susceptible
    d'être utilisé à des fins de répression interne ou de terrorisme, et le gel
    des fonds appartenant à certaines personnes ayant un lien avec d'importantes
    fonctions gouvernementales dans ce pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1883/2002 der Kommission vom 22. Oktober 2002 zur Änderung
    der Verordnung (EG) Nr. 1081/2000 des Rates über das Verbot des Verkaufs, der
    Lieferung und der Ausfuhr nach Birma/Myanmar von Ausrüstungen, die zur internen
    Repression oder für terroristische Zwecke benutzt werden können, und über das
    Einfrieren der Gelder bestimmter, mit wichtigen Regierungsfunktionen verbundener
    Personen in diesem Land
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1883/2002 af 22. oktober 2002 om ændring
