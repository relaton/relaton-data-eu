  content: '79/654/EEC: Commission Decision of 16 July 1979 amending Decision 79/277/EEC
    derogating from Decisions 78/693/EEC, 78/694/EEC, 78/695/EEC and 79/238/EEC concerning
    animal health conditions and veterinary certification for imports of fresh meat
    from Argentina, Brazil, Uruguay and Paraguay'
  type: main
- language: fr
  script: Latn
  content: '79/654/CEE: Décision de la Commission, du 16 juillet 1979, modifiant
