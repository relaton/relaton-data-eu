  content: Council Regulation (EEC) No 1606/92 of 15 June 1992 temporarily suspending
    autonomous Common Customs Tariff duties, subject to a specific ceiling, on imports
    into the Canary Islands of certain tobaccos falling within CN codes 2402 and 2403
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1606/92 du Conseil du 15 juin 1992 portant suspension
    temporaire des droits autonomes du tarif douanier commun dans le cadre d'un montant
    fixe lors de l'importation aux îles Canaries de certains tabacs relevant des
    codes NC 2402 et 2403
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1606/92 DES RATES vom 15. Juni 1992 zur zeitweiligen
    Aussetzung der autonomen Zollsätze des Gemeinsamen Zolltarifs im Rahmen einer
    festen Menge bei der Einfuhr bestimmter Tabakerzeugnisse der KN-Codes 2402 und
    2403 auf die Kanarischen Inseln #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 1606/92 af 15. juni 1992 om midlertidig
