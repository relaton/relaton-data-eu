    των αυτόνομων δασμών του κοινού δασμολογίου,
    εντός ορίου σταθερής ποσότητας κατά την εισαγωγή
    στις Καναρίους Νήσους ορισμένων καπνών των
    κωδικών ΣΟ 2402 και 2403
  type: main
- language: it
  script: Latn
