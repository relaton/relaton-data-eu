title:
- language: fr
  script: Latn
  content: Décision 67/287/CEE de la Commission, du 19 avril 1967, autorisant la
    République italienne, au titre de l'article 115 alinéa 1 du Traité, à exclure
    du traitement communautaire certains ferro-alliages de la position n° 37.02 G
    et H du Tarif douanier commun, originaires des pays de l'Est et mis en libre pratique
    dans tous les autres États membres
  type: main
- language: de
  script: Latn
  content: '67/287/EWG: Entscheidung der Kommission vom 19. April 1967, mit der die
    Italienische Republik ermächtigt wird, bestimmte aus den osteuropäischen Ländern
    stammende und in den anderen Mitgliedstaaten im freien Verkehr befindliche Ferrolegierungen
    der Tarifnummer 73.02 G und H des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/287/CEE: Decisione della Commissione, del 19 aprile 1967, che autorizza
    la Repubblica italiana, ai sensi dell''articolo 115, comma 1, del Trattato, ad
    escludere dal trattamento comunitario alcune ferroleghe delle voci 73.02 G e H
    della tariffa doganale comune, originarie dei paesi dell''Est e immesse in libera
    pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/287/EEG: Beschikking van de Commissie van 19 april 1967 waarbij de
    Italiaanse Republiek wordt gemachtigd om, op grond van artikel 115, eerste alinea,
    van het Verdrag, bepaalde ferrolegeringen van post 73.02 G en H van het gemeenschappelijk
    douanetarief, die van oorsprong zijn uit de Oosteuropese landen en in de andere
    Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
