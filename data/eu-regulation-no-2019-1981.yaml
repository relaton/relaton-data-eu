title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2019/81 of 17 July 1981 laying down detailed
    rules implementing the system of aid for the use of concentrated grape must for
    the manufacture in the United Kingdom and Ireland of certain products and fixing
    the amounts of aid for the 1981/82 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2019/81 de la Commission, du 17 juillet 1981, portant
    modalités d' application du régime d' aide à l' utilisation de moûts de raisins
    concentrés en vue de la fabrication de certains produits au Royaume-Uni et en
    Irlande et fixant les montants de l' aide pour la campagne viticole 1981/1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2019/81 der Kommission vom 17. Juli 1981 über Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von konzentriertem Traubenmost zur
    Herstellung bestimmter Erzeugnisse im Vereinigten Königreich und in Irland sowie
    zur Festsetzung eines Beihilfebetrags für das Weinwirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2019/81 af 17. juli 1981 om gennemførelsesbestemmelserne
    for støtteordningen vedrørende anvendelse af koncentreret druemost til fremstilling
    af visse produkter i Det forenede Kongerige og i Irland, samt om fastsættelse
    af støttebeløbene for vinproduktionsåret 1981/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2019/81 τής Επιτροπής
    τής 17ης Ιουλίου 1981 περί λεπτομερειών εφαρμογής
    τού καθεστώτος ενισχύσεων στή χρησιμοποίηση
    συμπυκνωμένου γλεύκους σταφυλής γιά τήν παρασκευή
    ορισμένων προϊόντων στό Ηνωμένο Βασίλειο καί
    τήν Ιρλανδία, καθώς καί περί καθορισμού τού
    ποσού ενισχύσεως γιά τήν αμπελουργική περίοδο
    1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2019/81 della Commissione, del 17 luglio 1981, che
    fissa, per la campagna viticola 1981/1982, le modalità di applicazione del regime
    di aiuti per l' utilizzazione di mosti di uve concentrati a fini di fabbricazione
    di taluni prodotti nel Regno Unito e in Irlanda, nonché l' importo dell' aiuto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2019/81 van de Commissie van 17 juli 1981 houdende
    vaststelling, voor het wijnoogstjaar 1981/1982, van de uitvoeringsbepalingen van
    de steunregeling voor het gebruik van geconcentreerde druivemost met het oog op
    de vervaardiging van bepaalde produkten in het Verenigd Koninkrijk en Ierland,
    alsmede van de steunbedragen
  type: main
