title:
- language: en
  script: Latn
  content: '2013/505/EU: Commission Implementing Decision of 14 October 2013 authorising
    the provisional measure taken by the French Republic in accordance with Article
    129 of Regulation (EC) No 1907/2006 of the European Parliament and of the Council
    concerning the Registration, Evaluation, Authorisation and Restriction of Chemicals
    (REACH) to restrict the use of ammonium salts in cellulose wadding insulation
    materials (notified under document C(2013) 6658)'
  type: main
- language: fr
  script: Latn
  content: '2013/505/UE: Décision d’exécution de la Commission du 14 octobre 2013
    autorisant la mesure provisoire prise par la République française de restreindre
    l’utilisation des sels d’ammonium dans les isolants à base de ouate de cellulose,
    conformément à l’article 129 du règlement (CE) n ° 1907/2006 du Parlement
    européen et du Conseil concernant l’enregistrement, l’évaluation et l’autorisation
    des substances chimiques, ainsi que les restrictions applicables à ces substances
    (REACH) [notifiée sous le numéro C(2013) 6658]'
  type: main
