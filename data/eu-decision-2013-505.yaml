    Bewertung, Zulassung und Beschränkung chemischer Stoffe (REACH) ergriffenen vorläufigen
    Maßnahme zur Beschränkung der Verwendung von Ammoniumsalzen in Isoliermaterialien
    aus Zellstoffwatte (Bekanntgegeben unter Aktenzeichen C(2013) 6658)'
  type: main
