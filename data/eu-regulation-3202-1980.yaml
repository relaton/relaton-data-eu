title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3202/80 of 10 December 1980 amending Regulation
    (EEC) No 2104/75 in respect of certain special detailed rules for implementing
    the system of import licences for products processed from fruit and vegetables
    as a result of the accession of Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3202/80 de la Commission, du 10 décembre 1980, modifiant
    le règlement (CEE) n° 2104/75 en ce qui concerne certaines modalités particulières
    d' application du régime des certificats d' importation dans le secteur des produits
    transformés à base de fruits et légumes suite à l' adhésion de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3202/80 der Kommission vom 10. Dezember 1980 zur Änderung
