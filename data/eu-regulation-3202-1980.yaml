    für Einfuhrlizenzen für Verarbeitungserzeugnisse aus Obst und Gemüse infolge
    des Beitritts Griechenlands
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3202/80 af 10. december 1980 om ændring
    af forordning (EØF) nr. 2104/75 for så vidt angår visse særlige gennemførelsesbestemmelser
    for ordningen med importlicenser for produkter forarbejdet på basis af frugt
    og grønsager som følge af Grækenlands tiltrædelse
  type: main
- language: el
  script: Grek
