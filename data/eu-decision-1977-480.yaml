id: EUDecision1977480
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 May 1977 authorizing the French Republic not to
    apply Community treatment to shirts other than of silk, noil or other waste silk,
    flax or ramie falling within heading No ex 61.03 of the Common Customs Tariff,
    originating in Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/480/CEE: Décision de la Commission, du 5 mai 1977, autorisant la République
    française à exclure du traitement communautaire les chemises et chemisettes
    autres que de soie, de bourre de soie (schappes), bourrette de soie, lin ou ramie,
    de la position Ex 61.03 du Tarif douanier commun, originaires de Hong-Kong et
    mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Mai 1977, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Hemden aller Art aus anderen Spinnstoffen als aus
    Seide, Schappeseide, Bouretteseide, Flachs oder Ramie der Tarifnummer ex 61.03
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. maj 1977 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjorter (herunder sports-
    og arbejdsskjorter) undtagen af natursilke, schappesilke, bourettesilke, hør
    eller ramie, som henhører under pos. 61.03 i den fælles toldtarif, har oprindelse
    i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 maggio 1977, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le camicie e camicette non di
    seta, né di borra di seta, roccadino, lino o ramiè della voce ex 61.03 della
    tariffa doganale comune, originarie di Hong Kong e messe in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 mei 1977 waarbij de Franse Republiek
    wordt gemachtigd overhemden en sporthemden, andere dan van zijde, van vlokzijde,
    van bourrette, van vlas of van ramee, van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
