title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 711/96 of 19 April 1996 laying down to what
    extent applications for issue of export licences submitted during April 1996 for
    beef and veal products which may benefit from special import treatment in a third
    country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 711/96 DE LA COMMISSION du 19 avril 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'avril 1996 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 711/96 DER KOMMISSION vom 19. April 1996 über das
    Ausmaß, in dem den im April 1996 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 711/96 af 19. april 1996 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i april
    1996 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 711/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 19ης Απριλίου 1996 περί καθορισμού σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Απρίλιο 1996 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 711/96, annettu 19 päivänä huhtikuuta 1996,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden huhtikuussa
    1996 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 711/96 DELLA COMMISSIONE del 19 aprile 1996 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di aprile 1996 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in un paese terzo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 711/96 VAN DE COMMISSIE van 19 april 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in april 1996 ingediende aanvragen
    om uitvoercertificaten voor produkten van de sector rundvlees waarvoor een bijzondere
    behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 711/96 DA COMISSÃO de 19 de Abril de 1996 que determina
    em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Abril de 1996 em relação a produtos do
    sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
