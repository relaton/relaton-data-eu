title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1727/73 of the Council of 28 June 1973 amending for
    the sixth time Regulation (EEC) No 1599/71 laying down additional conditions with
    which imported wines for direct human consumption must comply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1727/73 du Conseil, du 28 juin 1973, portant sixième
    modification du règlement (CEE) n° 1599/71 fixant les conditions supplémentaires
    auxquelles doivent répondre les vins importés destinés à la consommation humaine
    directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1727/73 des Rates vom 28. Juni 1973 zur sechsten Änderung
    der Verordnung (EWG) Nr. 1599/71 zur Festsetzung zusätzlicher Bedingungen, denen
    eingeführter Wein, der zum unmittelbaren menschlichen Verbrauch bestimmt ist,
    entsprechen muß
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1727/73 af 28. juni 1973 om den sjette ændring
    af forordning (EØF) nr. 1599/71 om fastsættelse af yderligere betingelser, som
    indført vin, der er bestemt til direkte menneskeligt forbrug, skal opfylde
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1727/73 del Consiglio, del 28 giugno 1973, relativo
    alla 6a modifica del regolamento (CEE) n. 1599/71, che fissa le condizioni supplementari
    cui devono rispondere i vini importati destinati al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1727/73 van de Raad van 28 juni 1973 houdende zesde
    wijziging van Verordening (EEG) nr. 1599/71 tot vaststelling van andere voorwaarden
    waaraan ingevoerde wijn die is bestemd voor rechtstreekse menselijke consumptie,
    moet beantwoorden
  type: main
