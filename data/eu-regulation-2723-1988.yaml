    Maßnahmen für das Wirtschaftsjahr 1987/88
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2723/88 af 31. august 1988 om gennemførelse
    af de supplerende foranstaltninger, der er forbeholdt indehavere af langfristede
    oplagringskontrakter for bordvin for produktionsåret 1987/88
  type: main
- language: el
  script: Grek
