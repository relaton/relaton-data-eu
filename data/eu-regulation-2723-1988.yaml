    μέτρων τα οποία αφορούν τους κατόχους συμφωνητικών
    μακροπρόθεσμης αποθεματοποίησης επιτραπέζιων
    οίνων για την περίοδο εμπορίας 1987/88
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2723/88 della Commissione del 31 agosto 1988 relativo
    all' attuazione delle misure complementari riservate ai titolari di contratti
    di magazzinaggio a lungo termine dei vini da tavola per la campagna 1987/1988
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2723/88 van de Commissie van 31 augustus 1988 houdende
