    wijnoogstjaar 1987/1988 langlopende opslagcontracten voor tafelwijn hebben gesloten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2723/88 da Comissão de 31 de Agosto de 1988 que
