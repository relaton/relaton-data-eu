  content: Commission Regulation (EEC) No 2723/88 of 31 August 1988 implementing additional
    measures applicable to holders of long-term storage contracts for table wine for
    the 1987/88 wine year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2723/88 de la Commission du 31 août 1988 mettant
