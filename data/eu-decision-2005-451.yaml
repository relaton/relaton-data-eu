title:
- language: en
  script: Latn
  content: Council Decision 2005/451/JHA of 13 June 2005 fixing the date of application
    of certain provisions of Regulation (EC) No 871/2004 concerning the introduction
    of some new functions for the Schengen Information System, including in the fight
    against terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2005/451/JAI du Conseil du 13 juin 2005 fixant la date d’application
    de certaines dispositions du règlement (CE) n° 871/2004 concernant l’attribution
    de certaines fonctions nouvelles au système d’information Schengen, y compris
    dans le cadre de la lutte contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2005/451/JI des Rates vom 13. Juni 2005 zur Festlegung des Beginns
    der Anwendung einiger Bestimmungen der Verordnung (EG) Nr. 871/2004 über die
    Einführung neuer Funktionen für das Schengener Informationssystem, auch im Hinblick
    auf die Terrorismusbekämpfung
  type: main
- language: bg
  script: Cyrl
  content: Решение 2005/451/ПВР на Съвета от 13 юни 2005 година
    за определяне на датата на прилагане на някои
    разпоредби на Регламент (ЕО) 871/2004 за въвеждане
    на някои нови функции в Шенгенската информационна
    система, включително в борбата с тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2005/451/SVV ze dne 13. června 2005, kterým se stanoví
    den použitelnosti některých ustanovení nařízení (ES) č. 871/2004 o zavedení
    některých nových funkcí Schengenského informačního systému, také se zřetelem
    k boji proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2005/451/RIA af 13. juni 2005 om fastsættelse af datoen
    for anvendelse af visse bestemmelser i forordning (EF) nr. 871/2004 om indførelse
    af nye funktioner i Schengen-informationssystemet, bl.a. med henblik på terrorismebekæmpelse
  type: main
- language: el
  script: Grek
  content: Απόφαση 2005/451/ΔΕΥ του Συμβουλíου, της 13ης
    Ιουνίου 2005, που ορίζει την ημερομηνία εφαρμογής
    ορισμένων διατάξεων του κανονισμού (ΕΚ) αριθ.
    871/2004 για την εισαγωγή ορισμένων νέων λειτουργιών
    του Συστήματος Πληροφοριών Σένγκεν, συμπεριλαμβανομένης
    της καταπολέμησης της τρομοκρατίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2005/451/JSK, 13. juuni 2005, millega määratakse kindlaks
    määruse (EÜ) nr 871/2004 (mis käsitleb Schengeni infosüsteemi mõningate
    uute toimingute sisseseadmist, sealhulgas terrorismivastases võitluses) teatavate
    sätete kohaldamise kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2005/451/YOS, tehty 13 päivänä kesäkuuta 2005,
    Schengenin tietojärjestelmän eräiden uusien toimintojen käyttöönottamisesta,
    myös terrorismin torjunnassa, annetun asetuksen (EY) N:o 871/2004 tiettyjen säännösten
    soveltamispäivän vahvistamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2005/451/PUP od 13. lipnja 2005. o određivanju datuma početka
    primjene određenih odredbi Uredbe (EZ) br. 871/2004 o uvođenju nekih novih funkcija
    Schengenskog informacijskog sustava, uključujući borbu protiv terorizma
  type: main
- language: hu
  script: Latn
  content: A Tanács 2005/451/IB határozata (2005. június 13.) a terrorizmus elleni
    küzdelem keretében a Schengeni Információs Rendszer egyes új funkcióinak
    bevezetéséről szóló rendelet egyes rendelkezései alkalmazási időpontjának
    meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2005/451/GAI del Consiglio, del 13 giugno 2005, che stabilisce
    la data di applicazione di talune disposizioni del regolamento (CE) n. 871/2004
    relativo all’introduzione di alcune nuove funzioni del sistema d’informazione
    Schengen, compresa la lotta contro il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2005/451/TI (2005. gada 13. jūnijs), ar ko nosaka piemērošanas
    datumu dažiem noteikumiem Regulā (EK) Nr. 871/2004 par dažu jaunu Šengenas
    Informācijas sistēmas funkciju ieviešanu, tostarp terorisma apkarošanas jomā
  type: main
- language: lt
  script: Latn
  content: 2005 m. birželio 13 d. Tarybos sprendimas 2005/451/TVR, nustatantis Reglamento
    (EB) Nr. 871/2004 dėl naujų Šengeno informacinės sistemos funkcijų, įskaitant
    kovą su terorizmu, nustatymo tam tikrų nuostatų taikymo datą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2005/451/ĠAI tat- 13 ta' Ġunju 2005 li tiffissa
    d-data ta' applikazzjoni ta' ċerti dispożizzjonijiet tar-Regolament (KE) Nru
    871/2004 dwar l-introduzzjoni ta' xi funzjonijiet ġodda għas-Sistema ta' Informazzjoni
    ta' Schengen, inkluż fil-ġlieda kontra t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit 2005/451/JBZ van de Raad van 13 juni 2005 tot vaststelling van
    de datum voor de toepassing van enige bepalingen van Verordening (EG) nr. 871/2004
    betreffende de invoering van enkele nieuwe functies in het Schengeninformatiesysteem,
    inclusief bij de bestrijding van terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2005/451/WSiSW z dnia 13 czerwca 2005 r. ustalająca datę
    rozpoczęcia stosowania niektórych przepisów rozporządzenia (WE) nr 871/2004
    dotyczącego wprowadzenia kilku nowych funkcji do Systemu Informacyjnego Schengen,
    w tym związanych z walką z terroryzmem
  type: main
- language: pt
  script: Latn
  content: Decisão 2005/451/JAI do Conselho, de 13 de Junho de 2005, que fixa a data
    de aplicação de determinadas disposições do Regulamento (CE) n.° 871/2004
    relativo à introdução de novas funções no Sistema de Informação de Schengen,
    incluindo o combate ao terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia 2005/451/JAI a Consiliului din 13 iunie 2005 de stabilire a datei
    de punere în aplicare a anumitor dispoziții din Regulamentul (CE) nr. 871/2004
    privind introducerea unor noi funcții ale Sistemului de informații Schengen,
    inclusiv în combaterea terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2005/451/SVV z 13. júna 2005, ktorým sa stanovuje dátum
    uplatňovania niektorých ustanovení nariadenia (ES) č. 871/2004 o zavedení
    niektorých nových funkcií pre Schengenský informačný systém vrátane boja
    proti terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2005/451/PNZ z dne 13. junija 2005 o določitvi datuma uporabe
    nekaterih določb Uredbe (ES) št. 871/2004 o uvedbi nekaterih novih funkcij za
    schengenski informacijski sistem, vključno v zvezi z bojem proti terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión 2005/451/JAI del Consejo, de 13 de junio de 2005, por la que
    se fija la fecha de aplicación de determinadas disposiciones del Reglamento (CE)
    n° 871/2004 relativo a la introducción de nuevas funciones para el Sistema de
    Información de Schengen, inclusive en materia de lucha contra el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2005/451/RIF av den 13 juni 2005 om fastställande av datum
    för tillämpningen av vissa bestämmelser i förordning (EG) nr 871/2004 om införande
    av ett antal nya funktioner för Schengens informationssystem bland annat i kampen
    mot terrorism
