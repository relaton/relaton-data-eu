title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 202/2012 of 8 March 2012 amending
    the Annex to Regulation (EU) No 37/2010 on pharmacologically active substances
    and their classification regarding maximum residue limits in foodstuffs of animal
    origin, as regards the substance pegylated bovine granulocyte colony stimulating
    factor
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 202/2012 de la Commission du 8 mars 2012
    modifiant l’annexe du règlement (UE) n ° 37/2010 relatif aux substances pharmacologiquement
    actives et à leur classification en ce qui concerne les limites maximales de
    résidus dans les aliments d’origine animale, au regard de la substance «facteur
    de croissance des granulocytes bovins pégylés»
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 202/2012 der Kommission vom 8. März
    2012 zur Änderung des Anhangs der Verordnung (EU) Nr. 37/2010 über pharmakologisch
    wirksame Stoffe und ihre Einstufung hinsichtlich der Rückstandshöchstmengen
    in Lebensmitteln tierischen Ursprungs in Bezug auf den pegylierten bovinen Granulozyten-koloniestimulierenden
    Faktor
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 202/2012 на Комисията
    от 8 март 2012 година за изменение на приложението
    към Регламент (ЕС) № 37/2010 относно фармакологичноактивните
    субстанции и тяхната класификация по отношение
    на максимално допустимите стойности на остатъчните
    количества в храните от животински произход
    във връзка със субстанцията стимулиращ фактор
    за пегилирана говежда гранулоцитна колония
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 202/2012 ze dne 8 března 2012
    , kterým se mění příloha nařízení (EU) č. 37/2010 o farmakologicky účinných
    látkách a jejich klasifikaci podle maximálních limitů reziduí v potravinách
    živočišného původu, pokud jde o látku pegylovaný bovinní faktor stimulující
    kolonie granulocytů
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 202/2012 af 8. marts 2012
    om ændring af bilaget til forordning (EU) nr. 37/2010 om farmakologisk virksomme
    stoffer og disses klassifikation med hensyn til maksimalgrænseværdier for restkoncentrationer
    i animalske fødevarer for så vidt angår stoffet pegyleret bovin granulocyt-kolonistimulerende
    faktor
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 202/2012
    της Επιτροπής, της 8ης Μαρτίου 2012 , για την τροποποίηση
    του παραρτήματος του κανονισμού (ΕΕ) αριθ. 37/2010
    σχετικά με φαρμακολογικώς δραστικές ουσίες
    και την ταξινόμησή τους όσον αφορά τα ανώτατα
    όρια καταλοίπων στα τρόφιμα ζωικής προέλευσης,
    σχετικά με την ουσία «πεγκυλιωμένος βόειος
    παράγοντας διέγερσης αποικιών κοκκιοκυττάρων»
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 202/2012, 8. märts 2012 , millega muudetakse
    määruse (EL) nr 37/2010 (mis käsitleb farmakoloogilisi toimeaineid ja nende
    liigitust loomsetes toiduainetes sisalduvate jääkide piirnormide järgi) lisa
    toimeaine „veise granulotsüütide kolooniat stimuleeriva faktori (pegüleeritud)”
    osas
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 202/2012, annettu 8 päivänä
    maaliskuuta 2012 , farmakologisesti vaikuttavista aineista ja niiden eläinperäisissä
    elintarvikkeissa esiintyvien jäämien enimmäismääriä koskevasta luokituksesta
    annetun asetuksen (EU) N:o 37/2010 liitteen muuttamisesta siltä osin kuin on
    kyse pegyloidusta naudan granulosyyttien kasvutekijästä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 202/2012 od 8. ožujka 2012. o izmjeni
    Priloga Uredbi (EU) br. 37/2010 o farmakološki djelatnim tvarima i njihovoj klasifikaciji
    u odnosu na najveće dopuštene količine rezidua u hrani životinjskog podrijetla,
    u dijelu koji se odnosi na čimbenik stimulacije rasta kolonija pegiliranih goveđih
    granulocita
  type: main
- language: hu
  script: Latn
  content: A Bizottság 202/2012/EU végrehajtási rendelete ( 2012. március 8. )
    a farmakológiai hatóanyagokról és az állati eredetű élelmiszerekben előforduló
    maximális maradékanyag-határértékek szerinti osztályozásukról szóló
    37/2010/EU rendelet mellékletének a szarvasmarhákból nyert, pegilált granulocytakolónia-stimuláló
    faktor (PEGbG-CSF) tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 202/2012 della Commissione, dell' 8 marzo
    2012 , che modifica, relativamente alla sostanza fattore bovino di stimolazione
    delle colonie di granulociti pegilato, l'allegato del regolamento (UE) n. 37/2010
    concernente le sostanze farmacologicamente attive e la loro classificazione per
    quanto riguarda i limiti massimi di residui negli alimenti di origine animale
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 202/2012 ( 2012. gada 8. marts
    ), ar ko attiecībā uz vielu pegilēto liellopu granulocītu koloniju stimulētājfaktoru
    groza pielikumu Komisijas Regulai (ES) Nr. 37/2010 par farmakoloģiski aktīvajām
    vielām un to klasifikāciju pēc to atlieku maksimāli pieļaujamā satura
  type: main
- language: lt
  script: Latn
  content: 2012 m. kovo 8 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 202/2012,
    kuriuo dėl medžiagos polietilenglikoliu modifikuoto galvijų granulocitų kolonijas
    stimuliuojančio faktoriaus iš dalies keičiamas Reglamento (ES) Nr. 37/2010
    dėl farmakologiškai aktyvių medžiagų, jų klasifikacijos ir didžiausios
    leidžiamosios koncentracijos gyvūniniuose maisto produktuose priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 202/2012 tat-
    8 ta’ Marzu 2012 li jemenda l-Anness mar-Regolament (UE) Nru 37/2010 dwar is-sustanzi
    farmakoloġikament attivi u l-klassifikazzjoni tagħhom fir-rigward tal-limiti
    massimi ta’ residwu fl-oġġetti tal-ikel li ġejjin mill-annimali, fir-rigward
    tas-sustanza fattur stimolanti tal-kolonja tal-granuloċiti bovini pegilati
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 202/2012 van de Commissie van 8 maart 2012
    tot wijziging van de bijlage bij Verordening (EU) nr. 37/2010 betreffende farmacologisch
    werkzame stoffen en de indeling daarvan op basis van maximumwaarden voor residuen
    in levensmiddelen van dierlijke oorsprong, wat de stof gepegyleerde boviene granulocyt-koloniestimulerende
    factor betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 202/2012 z dnia 8 marca 2012
    r. zmieniające, w odniesieniu do substancji pegylowany bydlęcy czynnik wzrostu
    kolonii granulocytów, załącznik do rozporządzenia (UE) nr 37/2010 w sprawie
    substancji farmakologicznie czynnych i ich klasyfikacji w odniesieniu do maksymalnych
    limitów pozostałości w środkach spożywczych pochodzenia zwierzęcego
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 202/2012 da Comissão, de 8 de março
    de 2012 , que altera o anexo do Regulamento (UE) n. ° 37/2010 relativo a substâncias
    farmacologicamente ativas e respetiva classificação no que respeita aos limites
    máximos de resíduos nos alimentos de origem animal, relativamente à substância
    fator estimulador de colónias de granulócitos bovinos peguilados
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 202/2012 al Comisiei din 8
    martie 2012 de modificare a anexei la Regulamentul (UE) nr. 37/2010 privind substanțele
    active din punct de vedere farmacologic și clasificarea lor în funcție de limitele
    reziduale maxime din produsele alimentare de origine animală, în ceea ce privește
    substanța factor de stimulare a coloniilor de granulocite bovine, pegilat
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 202/2012 z 8. marca 2012 , ktorým
    sa mení a dopĺňa príloha k nariadeniu (EÚ) č. 37/2010 o farmakologicky účinných
    látkach a ich klasifikácii, pokiaľ ide o maximálne limity rezíduí v potravinách
    živočíšneho pôvodu, týkajúce sa látky pegylovaný bovinný faktor stimulujúci
    kolónie granulocytov
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 202/2012 z dne 8. marca 2012 o spremembi
    Priloge k Uredbi (EU) št. 37/2010 o farmakološko aktivnih snoveh in njihovi
    razvrstitvi glede mejnih vrednosti ostankov v živilih živalskega izvora v zvezi
    s snovjo faktor, ki spodbuja nastajanje kolonij pegiliranih govejih granulocitov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 202/2012 de la Comisión, de 8 de marzo
    de 2012 , que modifica en lo que respecta a la sustancia «factor pegilado estimulador
    de colonias de granulocitos bovinos» el anexo del Reglamento (UE) n ° 37/2010
    relativo a las sustancias farmacológicamente activas y su clasificación por
    lo que se refiere a los límites máximos de residuos en los productos alimenticios
    de origen animal
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 202/2012 av den 8 mars 2012
    om ändring av bilagan till förordning (EU) nr 37/2010 om farmakologiskt aktiva
    substanser och deras klassificering med avseende på MRL-värden i animaliska
    livsmedel vad gäller substansen pegylerad bovin granulocytkolonistimulerande
    faktor
