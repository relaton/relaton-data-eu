title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1119/80 of 6 May 1980 re-establishing the
    levying of customs duties on knitted or crocheted fabrics, not elastic or rubberized,
    products of category 65 (code 0650), originating in India, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1119/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux étoffes de bonneterie non
    élastique ni caoutchoutée, en pièces, de la catégorie de produits n° 65 (code
    0650), originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1119/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Gewebe als Meterware, weder gummielastisch noch kautschutiert,
    der Warenkategorie Nr. 65 (Kennziffer 0650), mit Ursprung in Indien, dem die in
    der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1119/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for trikotagestof, ikke elastisk eller gummeret,
    under varekategori 65 (kode 0650), som har oprindelse i Indien og omfattes af
    de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1119/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle stoffe a maglia non
    elastica né gommata, in pezza, della categoria di prodotti n. 65 (codice 0650),
    originarie dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1119/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op breiwerk
    en haakwerk, niet elastisch en niet gegummeerd, aan het stuk, van de categorie
    van produkten nr. 65 (codenummer 0650), van oorsprong uit India waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
