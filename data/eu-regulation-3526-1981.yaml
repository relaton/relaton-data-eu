title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3526/81 of 8 December 1981 re-establishing
    the levying of customs duties on styrene, falling within subheading 29.01 D II
    and originating in Argentina, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3526/81 de la Commission, du 8 décembre 1981, portant
    rétablissement de la perception des droits de douane applicables au styrène,
    de la sous-position 29.01 D II du tarif douanier commun, originaire d' Argentine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3526/81 der Kommission vom 8. Dezember 1981 zur Wiedereinführung
    der Erhebung der Zölle für Styrol der Tarifstelle 29.01 D II, mit Ursprung in
    Argentinien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3526/81 af 8. december 1981 om genindførelse
