    production d'huile d'olive au Portugal
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 452/90 DER KOMMISSION vom 22. Februar 1990 zur Einfuehrung
    von Sondermassnahmen fuer das Wirtschaftsjahr 1989/90 zur Bewilligung der Erzeugerbeihilfe
    fuer Olivenoel in Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 452/90 af 22. februar 1990 om fastsættelse
    for produktionsåret 1989/90 af særlige foranstaltninger for så vidt angår
    ydelse af producentstøtte for olivenolie i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 452/90 της Επιτροπής
    της 22ας Φεβρουαρίου 1990 που προβλέπει ειδικά
    μέτρα για την περίοδο εμπορίας 1989/90 όσον αφορά
    τη χορήγηση ενίσχυσης στην παραγωγή ελαιολάδου
    στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 452/90 DELLA COMMISSIONE del 22 febbraio 1990 che
    prevede, per la campagna 1989/1990, misure speciali per la concessione dell'aiuto
    alla produzione di olio d'oliva in Portogallo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 452/90 VAN DE COMMISSIE van 22 februari 1990 houdende
    bijzondere maatregelen inzake de toekenning van produktiesteun voor olijfolie
    in Portugal voor het verkoopseizoen 1989/1990
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 452/90 DA COMISSAO de 22 de Fevereiro de 1990 que
    estabelece medidas especiais para a campanha de 1989/1990 relativas à concessao
    da ajuda à produçao de azeite em Portugal
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 452/90 DE LA COMISION de 22 de febrero de 1990 por
