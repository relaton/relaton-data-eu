  content: Commission Regulation (EEC) No 452/90 of 22 February 1990 laying down special
    measures for the 1989/90 marketing year for the granting of production aid for
    olive oil in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 452/90 de la Commission du 22 février 1990 prévoyant
