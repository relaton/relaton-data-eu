    et portant perception définitive du droit provisoire institué sur les importations
    d’acide tartrique originaire de la République populaire de Chine, et excluant
    la société Hangzhou Bioking Biochemical Engineering Co., Ltd du champ d’application
    des mesures définitives
  type: main
