  script: Latn
  content: Council Implementing Regulation (EU) No 332/2012 of 13 April 2012 amending
    Regulation (EC) No 130/2006 imposing a definitive anti-dumping duty and collecting
    definitively the provisional duty imposed on imports of tartaric acid originating
    in the People’s Republic of China, and excluding company Hangzhou Bioking Biochemical
    Engineering Co., Ltd from the definitive measures
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 332/2012 du Conseil du 13 avril 2012
