title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2844/78 of 4 December 1978 re-establishing
    the levying of customs duties on woven fabrics of silk, falling within heading
    No 50.09 and originating in South Korea and India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2844/78 de la Commission, du 4 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    soie ou de bourre de soie (schappe), de la position tarifaire 50.09, originaires
    de la Corée du Sud et de l' Inde, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 1197/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2844/78 der Kommission vom 4. Dezember 1978 über
    die Wiedereinfúhrung des Zollsatzes fúr Gewebe aus Seide, Schappeseide oder
    Bourretteseide, der Tarifnummer 50.09, mit Ursprung in Súdkorea und Indien, denen
    die in der Verordnung (EWG) Nr. 1197/78 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2844/78 af 4. december 1978 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke, under position 50.09,
    som har oprindelse i Sydkorea og Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 1197/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2844/78 della Commissione, del 4 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta o di
    borra di seta (schappe), della voce doganale 50.09, originari della Corea del
    Sud e dell' India, beneficiarie delle preferenze tariffarie previste dal regolamento
    (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2844/78 van de Commissie van 4 december 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op weefsels
    van zijde, van vlokzijde of van bourrette, van post 50.09, van oorsprong uit Zuid-Korea
    en India waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 1197/78 van de Raad
