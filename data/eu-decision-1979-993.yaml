title:
- language: en
  script: Latn
  content: '79/993/EEC: Commission Decision of 8 November 1979 authorizing the United
    Kingdom not to apply Community treatment to men''s and boys''outer garments: men''s
    and boys''woven breeches, shorts and trousers (including slacks) of wool, of cotton
    or of man-made textile fibres, falling within heading Nos ex 61.01 and ex 61.02
    of the Common Customs Tariff (NIMEXE codes 61.01-62, 64, 66, 72, 74, 76; 61.02-66,
    68, 72) (category 6), originating in Romania and in free circulation in the other
    Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/993/CEE: Décision de la Commission, du 8 novembre 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire les vêtements de dessus
    pour hommes et garçonnets: culottes, "shorts" et pantalons tissés, pour hommes
    et garçonnets, de laine, de coton ou de fibres textiles synthétiques ou artificielles
    des positions ex 61.01 et ex 61.02 du tarif douanier commun (codes Nimexe: 61.01-62,
    64, 66, 72, 74, 76; 61.02-66, 68, 72) (catégorie 6), originaires de Roumanie
    et mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/993/EWG: Entscheidung der Kommission vom 8. November 1979, mit der
    das Vereinigte Königreich ermächtigt wird, aus Rumänien stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Oberbekleidung für Männer
    und Knaben : Shorts und andere kurze Hosen und lange Hosen, aus Geweben, für
    Männer und Knaben, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen,
    der Tarifnummern ex 61.01 und ex 61.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    61.01-62, 64, 66, 72, 74, 76 und 61.02-66, 68, 72) (Kategorie 6) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/993/EØF: Kommissionens beslutning af 8. november 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage yderbeklædningsgenstande
    til mænd og drenge : shorts og andre korte benklæder til mænd og drenge, vævede
    af uld, bomuld eller syntetiske eller regenererede fibre, som henhører under
    pos. ex 61.01 og ex 61.02 i den fælles toldtarif (NIMEXE-nummer 61.01-62, 64,
    66, 72, 74, 76 ; 61.02-66, 68, 72 ; kategori 6), har oprindelse i Rumænien og
    frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/993/CEE: Decisione della Commissione, dell''8 novembre 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario indumenti esterni per
    uomo e per ragazzo: calzoncini, shorts e pantaloni, tessuti per uomo e per ragazzo,
    di lana, di cotone o di fibre tessili sintetiche o artificiali delle voci ex 61.01
    e ex 61.02 della tariffa doganale comune (codici Nimexe: 61.01-62, 64, 66, 72,
    74, 76; 61.02-66, 68, 72), categoria 6, originari della Romania e messi in libera
    pratica negli altri Stati membri (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '79/993/EEG: Beschikking van de Commissie van 8 november 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd herenbovenkleding en jongensbovenkleding:
    shorts en andere korte broeken, lange broeken, geweven, voor heren en jongens,
    van wol, van katoen of van synthetische of van kunstmatige textielvezels, van
    de posten ex 61.01 en ex 61.02 van het gemeenschappelijk douanetarief (NIMEXE-
    code 61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72) (categorie 6), van oorsprong
    uit Roemenië en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten (Slechts de tekst in de Engelse taal
    is authentiek)'
