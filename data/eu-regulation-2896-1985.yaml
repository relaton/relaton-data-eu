    ayant quitté le Royaume-Uni au cours de la semaine du 30 septembre au 6 octobre
    1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2896/85 der Kommission vom 17. Oktober 1985 zur Festsetzung
    der Beträge, welche im Sektor Rindfleisch auf Erzeugnisse, die das Vereinigte
    Königreich in der Woche vom 30. September bis 6. Oktober 1985 verlassen haben,
    erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2896/85 af 17. oktober 1985 om fastsættelse
