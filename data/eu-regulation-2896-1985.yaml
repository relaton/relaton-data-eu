  content: Commission Regulation (EEC) No 2896/85 of 17 October 1985 fixing the amounts
    to be levied in the beef sector on products which left the United Kingdom during
    the week 30 September to 6 October 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2896/85 de la Commission, du 17 octobre 1985, fixant
