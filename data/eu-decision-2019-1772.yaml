    ir jos Karūnos priklausinių įtraukimo į trečiųjų šalių arba jų dalių,
    iš kurių leidžiama į Sąjungą įvežti tam tikrų mėsos produktų ir apdorotų
    skrandžių, pūslių ir žarnų, skirtų žmonių maistui, siuntas, sąrašą
    iš dalies keičiamas Sprendimo 2007/777/EB II priedas (pranešta dokumentu Nr.
    C(2019) 7642)
  type: main
