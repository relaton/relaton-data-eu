    kráľovstva Veľkej Británie a Severného Írska a jeho korunných dependencií
    do zoznamu tretích krajín alebo ich častí, z ktorých sa povoľuje vstup zásielok
    určitých mäsových výrobkov a opracovaných žalúdkov, mechúrov a čriev
    určených na ľudskú spotrebu do Únie [oznámené pod číslom C(2019) 7642]
  type: main
