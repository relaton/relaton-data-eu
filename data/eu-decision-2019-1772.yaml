    Zjednoczonego Królestwa Wielkiej Brytanii i Irlandii Północnej oraz terytoriów
    zależnych Korony Brytyjskiej do wykazu krajów trzecich lub ich części, z których
    dozwolone jest wprowadzanie do Unii przesyłek niektórych produktów mięsnych
    oraz przetworzonych żołądków, pęcherzy i jelit przeznaczonych do spożycia
    przez ludzi (notyfikowana jako dokument nr C(2019) 7642)
  type: main
