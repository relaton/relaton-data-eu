  content: Komission täytäntöönpanopäätös (EU) 2019/1772, annettu 23 päivänä
    lokakuuta 2019, päätöksen 2007/777/EY liitteen II muuttamisesta Ison-Britannian
    ja Pohjois-Irlannin yhdistyneen kuningaskunnan ja sen kruunun alaisuuteen kuuluvien
    alueiden sisällyttämiseksi sellaisten kolmansien maiden tai niiden osien luetteloon,
    joista ihmisravinnoksi tarkoitettujen tiettyjen lihavalmisteiden ja käsiteltyjen
    mahojen, rakkojen ja suolten lähetysten tuonti unioniin on sallittu (tiedoksiannettu
    numerolla C(2019) 7642)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/1772 оd 23. listopada 2019. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu uvrštenja Ujedinjene Kraljevine Velike
    Britanije i Sjeverne Irske i njezinih krunskih posjeda na popis trećih zemalja
    ili njihovih dijelova iz kojih je odobreno unošenje pošiljaka određenih mesnih
    proizvoda i obrađenih želudaca, mjehura i crijeva za prehranu ljudi u Uniju
    (priopćeno pod brojem dokumenta C(2019)7642)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/1772 végrehajtási határozata (2019. október
    23.) a 2007/777/EK határozat II. mellékletének Nagy-Britannia és Észak-Írország
    Egyesült Királyságának és koronafüggőségeinek emberi fogyasztásra szánt
    bizonyos húskészítmények és kezelt gyomor, hólyag és belek szállítmányainak
    Unióba történő behozatalára engedéllyel rendelkező harmadik országok vagy
    azok részei jegyzékébe való felvétele tekintetében történő módosításáról
    (az értesítés a C(2019) 7642. számú dokumentummal történt)
  type: main
