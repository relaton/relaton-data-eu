    Regatului Unit al Marii Britanii și Irlandei de Nord și a teritoriilor dependente
    ale Coroanei Britanice în lista țărilor terțe sau a părților acestora care
    sunt autorizate pentru introducerea în Uniune de transporturi de anumite produse
    din carne și de stomacuri, vezici și intestine tratate destinate consumului
    uman [notificată cu numărul C(2019) 7642]
  type: main
- language: sk
