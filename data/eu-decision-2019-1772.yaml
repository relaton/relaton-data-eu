    om ändring av bilaga II till beslut 2007/777/EG vad gäller upptagandet av Förenade
    konungariket Storbritannien och Nordirland och dess kronbesittningar i förteckningen
    över tredjeländer eller delar därav från vilka sändningar av vissa köttprodukter
    och behandlade magar, blåsor och tarmar avsedda att användas som livsmedel får
    föras in till unionen [delgivet med nr C(2019) 7642]
