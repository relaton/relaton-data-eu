    do Reino Unido da Grã-Bretanha e da Irlanda do Norte e das dependências da Coroa
    na lista de países terceiros ou partes destes autorizados a introduzir na União
    remessas de determinados produtos à base de carne e estômagos, bexigas e intestinos
    tratados para consumo humano [notificada com o número C(2019) 7642]
  type: main
