    van het Verenigd Koninkrijk van Groot-Brittannië en Noord-Ierland en zijn van
    de Kroon afhankelijke gebieden in de lijst van derde landen of delen daarvan,
    waaruit zendingen van bepaalde vleesproducten en behandelde magen, blazen en darmen
    voor menselijke consumptie in de Unie mogen worden binnengebracht (Kennisgeving
    geschied onder nummer C(2019) 7642)
  type: main
