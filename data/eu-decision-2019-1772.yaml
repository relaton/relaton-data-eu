  script: Latn
  content: Decisione Di Esecuzione (UE) 2019/1772 della Commissione del 23 ottobre
    2019 che modifica l'allegato II della decisione 2007/777/CE per quanto riguarda
    l'inclusione del Regno Unito di Gran Bretagna e Irlanda del Nord e delle dipendenze
    della Corona nell'elenco dei paesi terzi o parti dei paesi terzi autorizzati a
    introdurre nell'Unione partite di prodotti a base di carne e stomaci, vesciche
    e intestini trattati destinati al consumo umano [notificata con il numero C(2019)
    7642]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/1772 (2019. gada 23. oktobris),
