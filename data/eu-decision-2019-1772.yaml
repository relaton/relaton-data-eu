    un tās atkarīgo teritoriju iekļaušanu to trešo valstu vai to daļu sarakstā,
    no kurām Savienībā atļauts ievest lietošanai pārtikā paredzētu noteiktu
    gaļas produktu un apstrādātu kuņģu, pūšļu un zarnu sūtījumus, groza
    Lēmuma 2007/777/EK II pielikumu (izziņots ar dokumenta numuru C(2019) 7642)
  type: main
- language: lt
  script: Latn
