    tal-inklużjoni tar-Renju Unit tal-Gran Brittanja u l-Irlanda ta’ Fuq u tad-Dipendenzi
    tal-Kuruna tiegħu fil-lista ta’ pajjiżi terzi jew partijiet minnhom awtorizzati
    għall-introduzzjoni fl-Unjoni ta’ kunsinni ta’ ċerti prodotti tal-laħam
    u ta’ stonkijiet, bżieżaq tal-awrina u msaren ittrattati għall-konsum mill-bniedem
    (notifikata bid-dokument C(2019)7642)
  type: main
