title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2012/2000 of 21 September 2000 amending Annex
    4 to Protocol No 9 to the 1994 Act of Accession and Regulation (EC) No 3298/94
    with regard to the system of ecopoints for heavy goods vehicles transiting through
    Austria
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2012/2000 du Conseil du 21 septembre 2000 modifiant
    l'annexe 4 du protocole nº 9 de l'acte d'adhésion de 1994 et le règlement (CE)
    nº 3298/94 en ce qui concerne le système des écopoints pour les camions de
    marchandises en transit à travers l'Autriche
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2012/2000 des Rates vom 21. September 2000 zur Änderung
