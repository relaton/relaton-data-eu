title:
- language: fr
  script: Latn
  content: Décision 67/515/CEE de la Commission, du 5 juillet 1967, autorisant le
    Royaume des Pays-Bas à augmenter, au cours de la campagne laitière 1967/1968,
    le prix de seuil spécial pour le lait en poudre destiné à l'alimentation du
    bétail
  type: main
- language: de
  script: Latn
  content: '67/515/EWG: Entscheidung der Kommission vom 5. Juli 1967, durch die das
    Königreich der Niederlande ermächtigt wird, während des Milchwirtschaftsjahres
    1967/1968 den besonderen Schwellenpreis für Milchpulver für Futterzwecke zu
    erhöhen'
  type: main
- language: it
  script: Latn
  content: '67/515/CEE: Decisione della Commissione, del 5 luglio 1967, che autorizza
    il Regno dei Paesi Bassi ad aumentare, durante la campagna lattiera 1967/1968,
    il prezzo di entrata particolare per il latte in polvere destinato all''alimentazione
    del bestiame'
  type: main
- language: nl
  script: Latn
  content: '67/515/EEG: Beschikking van de Commissie van 5 juli 1967 waarbij het Koninkrijk
    der Nederlanden wordt gemachtigd, in de loop van het melkprijsjaar 1967/1968 de
    bijzondere drempelprijs voor melkpoeder voor voederdoeleinden te verhogen'
  type: main
