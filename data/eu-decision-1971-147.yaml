  content: Décision de la Commission, du 17 mars 1971, autorisant le Royaume de Belgique
    et la République française à admettre, jusqu'au 31 mai 1971, la commercialisation
    de semences certifiées de lin textile soumises à des exigences réduites
  type: main
- language: de
  script: Latn
  content: '71/147/EWG: Entscheidung der Kommission vom 17. März 1971 zur Ermächtigung
    des Königreichs Belgien und der Französischen Republik, bis zum 31. Mai 1971
    einschließlich zertifiziertes Saatgut von Faserlein mit minderen Anforderungen
    zum Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '71/147/CEE: Decisione della Commissione, del 17 marzo 1971, che autorizza
    il Regno del Belgio e la Repubblica francese ad ammettere, fino al 31 maggio 1971
    incluso, la commercializzazione di sementi certificate di lino tessile soggette
    a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '71/147/EEG: Beschikking van de Commissie van 17 maart 1971 tot machtiging
    van het Koninkrijk België en van de Franse Republiek om tot en met 31 met 1971
    gecertificeerd zaad waaraan minder strenge eisen zijn gesteld, tot de handel toe
    te laten'
