type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 July 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to blouses and shirt-blouses, knitted or crocheted (not elastic
    or rubberized) or woven, for women, girls and infants, of wool, of cotton or of
    man-made textile fibres, falling within subheading ex 60.05 A II or ex 61.02 B
    (NIMEXE codes 60.05-22, 23, 24, 25; 61.02-78, 82, 84) of the Common Customs Tariff,
    originating in Bulgaria and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/607/CEE: Décision de la Commission, du 5 juillet 1978, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemisiers, blouses- chemisiers et
    blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, des sous-positions Ex 60.05 A II et Ex 61.02 B du Tarif douanier
    commun (codes Nimexe : 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originaires de
    Bulgarie et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. Juli 1978, mit der das Königreich Belgien,
    das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt werden,
    aus Bulgarien stammende und in den übrigen Migliedstaaten im freien Verkehr befindliche
    Blusen und Hemdblusen aus Gewirken (weder gummielastisch noch kautschutiert) oder
    Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen
    oder künstlichen Spinnstoffen der Tarifnummern ex 60.05 A II und ex 61.02 B des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-22; 23; 24; 25 - 61.02-78; 82;
    84) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 5. juli 1978 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter, skjortebluser og bluser af trikotage (ikke - elastisk eller
    gummeret) eller vævede, til kvinder, piger og småbørn, af uld, bomuld eller
    syntetiske eller regenererede fibre, som henhører under pos. ex 60.05 A II og
    ex 61.02 B (NIMEXE-kode: 60.05-22, 23, 24, 25 - 61.02-78, 82, 84) i den fælles
    toldtarif, har oprindelse i Bulgarien og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 luglio 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario camicie, camicette e bluse a maglia (non elastica
    né gommata) o tessute, per donna, per ragazza e per bambini, di lana, di cotone
    o di fibre tessili sintetiche o artificiali, delle sottovoci ex 60.05 A II o ex
    61.02 B della tariffa doganale comune (codice Nimexe 60.05-22, 23, 24, 25; 61.02-78,
    82, 84), originari della Bulgaria e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 juli 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    blouses, overhemdblouses, van brei- of van haakwerk, (niet-elastisch, niet-gegummeerd)
    of geweven, voor dames, meisjes en kinderen, van wol, van katoen of van synthetische
    of van kunstmatige textielvezels van de posten ex 60.05 A II en ex 61.02 B van
    het gemeenschappelijk douanetarief (NIMEXE-code 60.05-22, 23, 24, 25 - 61.02-78,
    82, 84), van oorsprong uit Bulgarije en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
