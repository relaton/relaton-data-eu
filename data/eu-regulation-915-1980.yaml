title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 915/80 of 15 April 1980 amending Regulation
    (EEC) No 801/80 fixing the quantities of high-quality fresh, chilled or frozen
    beef and veal which may be imported on special conditions for the second quarter
    of 1980
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 915/80 de la Commission, du 15 avril 1980, modifiant
    le règlement (CEE) n° 801/80 fixant les quantités de viandes bovines de haute
    qualité fraîches, réfrigérées ou congelées pouvant être importées à des
    conditions spéciales pour le deuxième trimestre de 1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 915/80 der Kommission vom 15. April 1980 zur Änderung
    der Verordnung (EWG) Nr. 801/80 zur Festsetzung der Mengen frischen, gekühlten
    oder gefrorenen Qualitätsrindfleisches, die für das zweite Vierteljahr 1980
    unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 915/80 af 15. april 1980 om ændring
    af forordning (EØF) nr. 801/80 om fastsættelse af de mængder fersk, kølet
    eller frosset oksekød af høj kvalitet, der kan indføres på særlige betingelser,
    for andet kvartal af 1980
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 915/80 della Commissione, del 15 aprile 1980, recante
    modifica del regolamento (CEE) n. 801/80 che fissa le quantità di carni bovine
    di qualità pregiata, fresche, refrigerate o congelate, che possono essere importate
    a condizioni speciali per il secondo trimestre 1980
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 915/80 van de Commissie van 15 april 1980 tot wijziging
    van Verordening (EEG) nr. 801/80 tot vaststelling van de hoeveelheid vers, gekoeld
    of bevroren kwaliteitsrundvlees dat in het tweede kwartaal van 1980 op bijzondere
    voorwaarden kan worden ingevoerd
  type: main
