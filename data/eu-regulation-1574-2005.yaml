    certificeringsordning for international handel med uslebne diamanter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1574/2005 της Επιτροπής,
    της 28ης Σεπτεμβρίου 2005, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 2368/2002 του Συμβουλίου
    για την εφαρμογή του συστήματος πιστοποίησης
