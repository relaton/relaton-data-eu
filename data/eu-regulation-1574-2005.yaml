    ακατέργαστων διαμαντιών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1574/2005, 28. september 2005, millega muudetakse
    nõukogu määrust (EÜ) nr 2368/2002 Kimberley protsessi sertifitseerimissüsteemi
    rakendamise kohta töötlemata teemantide rahvusvahelises kaubanduses
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1574/2005, annettu 28 päivänä syyskuuta 2005,
    raakatimanttien kansainväliseen kauppaan sovellettavasta Kimberleyn prosessin
    sertifiointijärjestelmästä annetun neuvoston asetuksen (EY) N:o 2368/2002 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1574/2005/EK rendelete (2005. szeptember 28.) a nyers gyémántok
    nemzetközi kereskedelmében a kimberleyi folyamat tanúsítási rendszere végrehajtásáról
    szóló 2368/2002/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1574/2005 della Commissione, del 28 settembre 2005,
    che modifica il regolamento (CE) n. 2368/2002 del Consiglio relativo all'attuazione
    del sistema di certificazione del processo di Kimberley per il commercio internazionale
    di diamanti grezzi
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1574/2005 (2005. gada 28. septembris), ar ko
    groza Padomes Regulu (EK) Nr. 2368/2002 par Kimberli procesa sertifikācijas sistēmas
    īstenošanu starptautiskajā tirdzniecībā ar neapstrādātiem dimantiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugsėjo 28 d. Komisijos reglamentas (EB) Nr. 1574/2005, iš dalies
    keičiantis Tarybos reglamentą (EB) Nr. 2368/2002, įgyvendinantį Kimberley
    proceso sertifikavimo schemą dėl tarptautinės prekybos neapdorotais deimantais
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1574/2005 van de Commissie van 28 september 2005 tot
    wijziging van Verordening (EG) nr. 2368/2002 van de Raad tot uitvoering van de
    Kimberleyprocescertificering voor de internationale handel in ruwe diamant
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1574/2005 z dnia 28 września 2005 r. zmieniające
    rozporządzenie Rady (WE) nr 2368/2002 wprowadzające w życie system certyfikacji
    Procesu Kimberley dla handlu międzynarodowego surowcem diamentowym
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1574/2005 da Comissão, de 28 de Setembro de 2005,
    que altera o Regulamento (CE) n.° 2368/2002 do Conselho relativo à aplicação
    do sistema de certificação do Processo de Kimberley para o comércio internacional
    de diamantes em bruto
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1574/2005 z 28. septembra 2005, ktorým sa
