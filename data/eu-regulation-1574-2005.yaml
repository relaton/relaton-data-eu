  script: Latn
  content: Commission Regulation (EC) No 1574/2005 of 28 September 2005 amending Council
    Regulation (EC) No 2368/2002 implementing the Kimberley Process certification
    scheme for the international trade in rough diamonds
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1574/2005 de la Commission du 28 septembre 2005 modifiant
    le règlement (CE) n° 2368/2002 du Conseil mettant en œuvre le système de certification
    du processus de Kimberley pour le commerce international des diamants bruts
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1574/2005 der Kommission vom 28. September 2005 zur
