title:
- language: en
  script: Latn
  content: '2000/373/EC: Commission Decision of 26 May 2000 concerning the request
    by France to maintain pursuant to Article 18(3) of Directive 1999/5/EC of the
    European Parliament and of the Council (the ''R&TTE Directive'') a requirement
    for telecommunications terminal equipment intended for connection to the analogue
    public switched telephone network of France Telecom (notified under document number
    C(2000) 1390) (Text with EEA relevance) (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '2000/373/CE: Décision de la Commission du 26 mai 2000 concernant la demande
    de la France de maintenir, conformément à l''article 18, paragraphe 3, de la
    directive 1999/5/CE du Parlement européen et du Conseil (directive «terminaux»),
    des exigences en matière d''équipements terminaux de télécommunications destinés
    à être raccordés au réseau téléphonique public commuté de France Télécom
    [notifiée sous le numéro C(2000) 1390] (Texte présentant de l''intérêt pour
    l''EEE) (Le texte en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '2000/373/EG: Entscheidung der Kommission vom 26. Mai 2000 über den Antrag
    Frankreichs, im Einklang mit Artikel 18 Absatz 3 der Richtlinie 1999/5/EG des
    Europäischen Parlaments und des Rates (Richtlinie über Funkanlagen und Telekommunikationsendeinrichtungen)
    eine Vorschrift für Telekommunikationsendeinrichtungen, die für den Anschluß
    an das analoge öffentliche Fernsprechwählnetz von France Telecom bestimmt sind,
    beizubehalten (Bekanntgegeben unter Aktenzeichen K(2000) 1390) (Text von Bedeutung
    für den EWR) (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '2000/373/EF: Kommissionens beslutning af 26. maj 2000 om Frankrigs anmodning
    om i medfør af artikel 18, stk. 3, i Europa-Parlamentets og Rådets direktiv
    1999/5/EF (direktivet om radio- og teleterminaludstyr) fortsat at kunne stille
    særlige krav til teleterminaludstyr beregnet til tilslutning til France Telecoms
    analoge offentlige telefonnet (meddelt under nummer K(2000) 1390) (EØS-relevant
    tekst) (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '2000/373/ΕΚ: Απόφαση της Επιτροπής, της 26ης
    Μαΐου 2000, σχετικά με το αίτημα της Γαλλίας να
