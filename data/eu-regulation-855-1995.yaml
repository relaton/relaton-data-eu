    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i Europaaftalerne mellem Fællesskabet og Republikken
    Polen, Republikken Ungarn, Den Tjekkiske Republik og Den Slovakiske Republik
  type: main
