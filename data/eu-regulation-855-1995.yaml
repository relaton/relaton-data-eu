- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 855/95 of 19 April 1995 determining the extent
    to which applications lodged in April 1995 for import licences for certain milk
    products and products covered by the arrangements provided for in the Europe Agreements
    concluded by the Community with the Republic of Poland and the Republic of Hungary,
    the Czech Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 855/95 DE LA COMMISSION du 19 avril 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    avril 1995 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords européens conclus par la Communauté
    avec la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 855/95 DER KOMMISSION vom 19. April 1995 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im April 1995 für
    die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen und der Republik Ungarn geschlossenen Europa-Abkommen sowie
    dem mit der Tschechischen Republik und der Slowakischen Republik beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 855/95 af 19. april 1995 om fastsættelse
