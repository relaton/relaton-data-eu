title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 861/76 of 12 April 1976 re-establishing
    the levying of customs duties on melamine falling within subheading 29.35 ex Q,
    originating in South Korea, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 861/76 de la Commission, du 12 avril 1976, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position tarifaire EX 29.35 Q, originaire de la Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil
    du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 861/76 der Kommission vom 12. April 1976 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 861/76 af 12. april 1976 om genindførelse
    af opkrævning af toldafgifter for melamin under underposition 29.35 ex Q, som
    har oprindelse i Sydkorea og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 861/76 della Commissione, del 12 aprile 1976, che
    ripristina la riscossione dei dazi doganali applicabili alla melamina, della sottovoce
    doganale 29.35 ex Q, originaria della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre
    1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 861/76 van de Commissie van 12 april 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op melamine,
    van onderverdeling 29.35 ex Q, van oorsprong uit Zuid-Korea, ten behoeve waarvan
    bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november 1975 algemene tariefpreferenties
    werden geopend
  type: main
