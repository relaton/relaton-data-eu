  content: Cinneadh (AE) 2015/1890 ón gComhairle an 20 Meitheamh 2014 maidir le síniú,
    thar ceann an Aontais Eorpaigh agus a chuid Ballstát, agus maidir le cur i bhfeidhm
    sealadach an Phrótacail a ghabhann leis an gComhaontú Cobhsaíochta agus Comhlachais
    idir na Comhphobail Eorpacha agus a mBallstáit, de pháirt amháin, agus Poblacht
    Iar-Iúgslavach na Macadóine, den pháirt eile, chun aontachas Phoblacht na Cróite
    leis an Aontas Eorpach a chur san áireamh
