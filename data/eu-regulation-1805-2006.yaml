title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1805/2006 of 7 December 2006 amending Annex
    I to Council Regulation (EEC) No 2377/90 laying down a Community procedure for
    the establishment of maximum residue limits of veterinary medicinal products in
    foodstuffs of animal origin, as regards thiamphenicol, fenvalerate and meloxicam
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1805/2006 de la Commission du 7 décembre 2006 modifiant
    l'annexe I du règlement (CEE) n o 2377/90 du Conseil établissant une procédure
    communautaire pour la fixation des limites maximales de résidus de médicaments
    vétérinaires dans les aliments d'origine animale en ce qui concerne le thiamphénicol,
    le fenvalérate et le méloxicam
  type: main
- language: de
  script: Latn
