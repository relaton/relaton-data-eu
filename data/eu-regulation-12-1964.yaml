title:
- language: fr
  script: Latn
  content: Règlement n° 12/64/CEE de la Commission, du 18 février 1964, fixant
    les conditions précisant la situation manifeste de sous-emploi prolongé au sens
    de l'article 2 alinéa 3 (a) du règlement n° 9 du Conseil concernant le Fonds
    social européen
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 12/64/EWG der Kommission vom 18. Februar 1964 zur Festsetzung
    der Voraussetzungen einer offensichtlichen Unterbeschäftigung während längerer
    Zeit im Sinne des Artikels 2 Absatz 3 a) der Verordnung Nr. 9 des Rats über den
    Europäischen Sozialfonds
  type: main
- language: it
  script: Latn
  content: Regolamento n. 12/64/CEE della Commissione, del 18 febbraio 1964, che fissa
    le condizioni di manifesta e prolungata sottoccupazione ai sensi dell'articolo
    2, comma 3 (a), del regolamento n. 9 del Consiglio concernente il Fondo sociale
    europeo
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 12/64/EEG van de Commissie van 18 februari 1964 houdende
    een nadere omschrijving van het begrip "het zich kennelijk bij voortduring in
    een toestand van onvoldoende tewerkstelling bevinden" in de zin van artikel 2,
    derde lid sub a, van Verordening Nr. 9 van de Raad betreffende het Europees Sociaal
    Fonds
