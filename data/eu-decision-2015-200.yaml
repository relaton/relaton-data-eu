title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2015/200 of 26 January 2015 amending
    Implementing Decision 2014/170/EU establishing a list of non-cooperating third
    countries in fighting IUU fishing pursuant to Regulation (EC) No 1005/2008 establishing
    a Community system to prevent, deter and eliminate illegal, unreported and unregulated
    fishing as regards Sri Lanka
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/200 du Conseil du 26 janvier 2015 modifiant
    la décision d'exécution 2014/170/UE établissant une liste des pays tiers non
    coopérants dans le cadre de la lutte contre la pêche INN en application du règlement
    (CE) n ° 1005/2008 établissant un système communautaire destiné à prévenir,
    à décourager et à éradiquer la pêche illicite, non déclarée et non réglementée,
    en ce qui concerne le Sri Lanka
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/200 des Rates vom 26. Januar 2015 zur
