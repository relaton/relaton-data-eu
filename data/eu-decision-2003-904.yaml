    в неодобрени зони, по отношение на вирусна
    хеморагична септицемия (ВХС) и епизоотична
    хематопоетична некроза (ЕХН) при рибите, и за
    изменение на приложения I и II към Решение 2003/634/ЕО
    (нотифицирано под номер С(2003) 4727)
  type: main
- language: cs
  script: Latn
