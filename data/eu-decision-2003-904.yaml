title:
- language: en
  script: Latn
  content: '2003/904/EC: Commission Decision of 15 December 2003 approving programmes
    for the purpose of obtaining the status of approved zones and of approved farms
    in non-approved zones with regard to viral haemorrhagic septicaemia (VHS) and
    infectious haematopoietic necrosis (IHN) in fish, and amending Annexes I and II
    to Decision 2003/634/EC (Text with EEA relevance) (notified under document number
    C(2003) 4727)'
  type: main
- language: fr
  script: Latn
  content: '2003/904/CE: Décision de la Commission du 15 décembre 2003 approuvant
    des programmes visant à obtenir le statut de zones agréées et de fermes d''élevage
    agréées situées dans des zones non agréées au regard des maladies des poissons
    que sont la septicémie hémorragique virale (SHV) et la nécrose hématopoïétique
    infectieuse (NHI) et modifiant les annexes I et II de la décision 2003/634/CE
    (Texte présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2003)
    4727]'
  type: main
- language: de
  script: Latn
  content: '2003/904/EG: Entscheidung der Kommission vom 15. Dezember 2003 zur Genehmigung
    von Programmen zur Erlangung des Status zugelassener Gebiete und zugelassener
    Betriebe in nicht zugelassenen Gebieten hinsichtlich der Fischseuchen virale hämorrhagische
    Septikämie (VHS) und infektiöse hämatopoetische Nekrose (IHN) sowie zur Änderung
    der Anhänge I und II der Entscheidung 2003/634/EG (Text von Bedeutung für den
    EWR) (Bekannt gegeben unter Aktenzeichen K(2003) 4727)'
  type: main
