title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2098/90 of 23 July 1990 determining the
    extent to which applications lodged until 10 July 1990 for the issue of import
    licences in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2098/90 de la Commission, du 23 juillet 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées jusqu'au 10 juillet 1990 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2098/90 der Kommission vom 23. Juli 1990 über den
    Umfang, in dem den bis zum 10. Juli 1990 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2098/90 af 23. juli 1990 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    indtil 10. juli 1990 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2098/90 της Επιτροπής
    της 23ης Ιουλίου 1990 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν έως τις 10 Ιουλίου 1990, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2098/90 della Commissione, del 23 luglio 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate fino al 10 luglio 1990 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2098/90 van de Commissie van 23 juli 1990 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de tot en met 10 juli
    1990 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2098/90 da Comissão, de 23 de Julho de 1990, que
    determina em que medida pode ser dado seguimento aos pedidos de concessão de
    certificados de importação entregues até 10 de Julho de 1990 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2098/90 de la Comisión, de 23 de julio de 1990, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación, presentadas hasta el 10 de julio de 1990 para las
    carnes de vacuno congeladas destinadas a la transformación
  type: main
