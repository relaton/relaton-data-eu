type: standard
title:
- language: en
  script: Latn
  content: '88/621/EEC: Commission Decision of 2 December 1988 making an initial allocation
    to Italy of part of the resources to be charged to the 1989 budget year for the
    supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/621/CEE: Décision de la Commission du 2 décembre 1988 allouant à
    l''Italie une première tranche des ressources imputables à l''exercice 1989
    pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 2. Dezember 1988 ueber die anfaengliche
    Bewilligung eines Teils der im Haushaltsjahr 1989 fuer die Zurverfuegungstellung
    von Nahrungsmitteln aus Interventionsbestaenden an bezeichnete Organisationen
    zur Verteilung an beduerftige Personen in der Gemeinschaft zu verbuchenden Mittel
    fuer Italien (88/621/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 2. december 1988 om en foerste tildeling til
    Italien af en del af de midler, der skal opfoeres paa 1989-budgettet for levering
    af levnedsmidler fra interventionslagre til naermere bestemte organisationer med
    henblik paa uddeling til de socialt daarligst stillede personer i Faellesskabet
    (88/621/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 2ας Δεκεμβρίου
    1988 για τη χορήγηση στην Ιταλία μιας πρώτης
    μερίδας πόρων που καταλογίζονται στο οικονομικό
    έτος 1989 για την προμήθεια τροφίμων που προέρχονται
    από τα αποθέματα της παρεμβάσεως στους οργανισμούς
    που έχουν ορισθεί για να τα διανείμουν στους
    απόρους της Κοινότητας ( 88/621/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 2 dicembre 1988 concernente un primo stanziamento
    all'Italia di parte delle risorse da imputare all'anno di bilancio 1989 per la
    fornitura a talune organizzazioni di derrate alimentari provenienti dalle scorte
    d'intervento e destinate ad essere distribuite agli indigenti nella Comunità
    (88/621/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 2 december 1988 houdende een eerste toewijzing
    aan Italië van een deel van voor het begrotingsjaar 1989 te boeken financiële
    middelen voor de levering van voedsel uit interventievoorraden aan organisaties
    die zijn aangewezen voor de verstrekking ervan aan behoeftigen in de Gemeenschap
    (88/621/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 2 de Dezembro de 1988 relativa à afectaçao à
    Italia de parte dos recursos a imputar ao exercicio orçamental de 1989 para o
    fornecimento de alimentos provenientes das existências de intervençao às organizaçoes
    designadas para distribuiçao às pessoas mais necessitadas na Comunidade (88/621/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 2 de diciembre de 1988 por la que se adjudica
    inicialmente a Italia parte de los recursos con cargo al presupuesto del ejercicio
    1989 destinados al suministro de alimentos procedentes de las existencias de intervencion
    a determinadas organizaciones para su distribucion entre las personas mas necesitadas
    de la Comunidad (88/621/CEE)
  type: main
