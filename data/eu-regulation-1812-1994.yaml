title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1812/94 of 22 July 1994 determining the extent
    to which applications lodged in July 1994 for import certificates for certain
    cheeses covered by the arrangements provided for in the Interim Agreements concluded
    by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1812/94 de la Commission, du 22 juillet 1994, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1994 pour certains fromages dans le cadre du régime prévu par les
    accords intérimaires conclus par la Communauté avec la Bulgarie et la Roumanie
    peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1812/94 der Kommission vom 22. Juli 1994 zur Festsetzung
    des Umfangs, in dem die Lizenzanträge genehmigt werden können, die im Juli 1994
    für die Einfuhr von bestimmten Käsesorten gemäß den zwischen der Gemeinschaft
    und Bulgarien und Rumänien geschlossenen Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1812/94 af 22. juli 1994 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i juli 1994 for visse
    oste kan imødekommes under den ordning, der er fastsat i interimsaftalerne mellem
    Fællesskabet og Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1812/94 της Επιτροπής
    της 22ας Ιουλίου 1994 για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    πιστοποιητικών εισαγωγής που υποβάλλονται
    τον Ιούλιο 1994 για ορισμένα τυριά στα πλαίσια
    του καθεστώτος που προβλέπεται από τις προσωρινές
    συμφωνίες που έχουν συναφθεί από την Κοινότητα
    με τη Βουλγαρία και τη Ρουμανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1812/94 della Commissione, del 22 luglio 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di certificati
    di importazione presentate nel mese di luglio 1994 per taluni formaggi nel quadro
    del regime previsto dagli accordi interinali conclusi tra la Comunità e la Bulgaria
    e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1812/94 van de Commissie van 22 juli 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde kaassoorten, die in juli 1994 zijn ingediend op grond van de regeling
    die is vastgesteld in de door de Gemeenschap met Bulgarije en Roemenië gesloten
    Interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1812/94 da Comissão, de 22 de Julho de 1994, que
    determina a medida em que podem ser aceites os pedidos de certificados de importação,
    apresentados em Julho de 1994, para determinados queijos, no âmbito do regime
    previsto nos acordos concluídos pela Comunidade com a Bulgária e a Románia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1812/94 de la Comisión, de 22 de julio de 1994, por
    el que se determina la proporción en que se satisfarán las solicitudes de certificados
    de importación presentadas en julio de 1994 de algunos quesos al amparo del régimen
    previsto en los Acuerdos interinos celebrados entre la Comunidad y Bulgaria y
    Rumanía
  type: main
