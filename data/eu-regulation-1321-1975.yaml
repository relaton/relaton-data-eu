title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1321/75 of the Commission of 23 May 1975 re-establishing
    the levying of customs duties on wrought plates, sheets and strip, of aluminium,
    falling within heading No 76.03, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1321/75 de la Commission, du 23 mai 1975, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en aluminium, d'une épaisseur de plus de 0,20 millimètres,
    de la position tarifaire 76.03, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1321/75 der Kommission vom 23. Mai 1975 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Aluminium, mit einer
    Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1321/75 af 23. maj 1975 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af aluminium under position
    76.03, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1321/75 della Commissione, del 23 maggio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri, di alluminio, di spessore superiore a 0,20 mm, della voce doganale
    n. 76.03, originari della Jugoslavia, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1321/75 van de Commissie van 23 mei 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op platen, bladen
    en strippen, van aluminium, met een dikte van meer dan 0,20 mm, van post 76.03,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties werden geopend
  type: main
