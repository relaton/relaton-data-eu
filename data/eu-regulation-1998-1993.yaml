    Destillationen gemäß den Artikeln 35 und 36 der Verordnung (EWG) Nr. 822/87
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1998/93 af 23. juli 1993 om undtagelsesbestemmelser
