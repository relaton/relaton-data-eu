title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2121/68 du Conseil, du 20 décembre 1968, modifiant
    le tarif douanier commun ainsi que les annexes I et II du règlement n° 83/67/CEE
    et dérogeant, pour certaines marchandises relevant de la position 18.06 de ce
    tarif, à l'article 16 du règlement n° 160/66/CEE
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2121/68 des Rates vom 20. Dezember 1968 zur Änderung
    des Gemeinsamen Zolltarifs und der Anhänge I und II der Verordnung Nr. 83/67/
    EWG sowie über die Abweichung von Artikel 16 der Verordnung Nr. 160/66/ EWG in
    bezug auf bestimmte Waren der Tarifnummer 18.06 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2121/68 del Consiglio, del 20 dicembre 1968, che modifica
    la tariffa doganale comune nonché gli allegati I e II del regolamento n. 83/67/CEE
    e deroga, per alcune merci di cui alla voce 18.06 di detta tariffa all'articolo
    16 del regolamento n. 160/66/CEE
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2121/68 van de Raad van 20 december 1968 tot wijziging
    van het gemeenschappelijk douanetarief, alsook van de bijlagen I en II van Verordening
    nr. 83/67/EEG, en houdende afwijking, voor bepaalde goederen van post 18.06 van
    dit tarief, van artikel 16 van Verordening nr. 160/66/EEG
  type: main
