  content: Commission Regulation (EEC) No 2130/76 of 30 August 1976 fixing the rates
    of the refunds applicable from 1 September 1976 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2130/76 de la Commission, du 30 août 1976, fixant les
    taux des restitutions applicables, à compter du 1er septembre 1976, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2130/76 der Kommission vom 30. August 1976 zur Festsetzung
