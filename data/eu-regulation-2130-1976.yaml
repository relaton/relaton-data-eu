    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2130/76 af 30. august 1976 om fastsættelse
