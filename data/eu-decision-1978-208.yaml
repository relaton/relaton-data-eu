---
id: EUDecision1978208
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 January 1978 authorizing the French Republic
    not to apply Community treatment to bed linen, table linen, toilet linen and kitchen
    linen, falling within heading No ex 62.02 of the Common Customs Tariff, originating
    in the People's Republic of China and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '78/208/CEE: Décision de la Commission, du 27 janvier 1978, autorisant
    la République française à exclure du traitement communautaire le linge de table,
    de lit, de toilette, d''office ou de cuisine, de la position Ex 62.02 du Tarif
    douanier commun, originaire de la République populaire de Chine et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Januar 1978, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Bettwäsche, Tischwäsche, Wäsche
    zur Körperpflege und andere Haushaltswäsche der Tarifnummer ex 62.02 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. januar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage sengelinned, dækketøj, håndklæder,
    vaskeklude og viskestykker, som henhører under pos. ex 62.02 i den fælles toldtarif,
    har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario la biancheria da letto, da tavola,
    da toletta, da servizio o da cucina della voce ex 62.02 della tariffa doganale
    comune, originaria della Repubblica popolare cinese e messa in libera pratica
    negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd tafel-, bedde- en huishoudlinnen van post ex 62.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
