  script: Latn
  content: COMMISSION REGULATION (EC) No 112/95 of 25 January 1995 determining the
    extent to which applications lodged in January 1995 licences for certain eggs
    and poultrymeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 112/95 DE LA COMMISSION du 25 janvier 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1995 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
