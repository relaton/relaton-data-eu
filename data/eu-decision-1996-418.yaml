    del artículo 8 de la Directiva 92/81/CEE, a introducir o mantener exenciones
    o reducciones del impuesto especial aplicable a ciertos hidrocarburos destinados
    a fines específicos'
  type: main
- language: sv
  script: Latn
  content: '96/418/EG: Rådets beslut av den 27 juni 1996 om tillstånd för en medlemsstat
