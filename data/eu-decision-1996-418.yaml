title:
- language: en
  script: Latn
  content: '96/418/EC: Council Decision of 27 June 1996 authorizing a Member State,
    in accordance with Article 8 (4) of Directive 92/81/EEC, to introduce or continue
    to apply exemptions from, or reductions in, excise duties on certain mineral oils
    used for specific purposes'
  type: main
- language: fr
  script: Latn
  content: '96/418/CE: Décision du Conseil du 27 juin 1996 autorisant un État membre,
    conformément à l''article 8 paragraphe 4 de la directive 92/81/CEE, à introduire
    ou continuer d''appliquer des exonérations ou des réductions d''accises sur
    certaines huiles minérales utilisées à des fins spécifiques'
  type: main
- language: de
  script: Latn
  content: '96/418/EG: Entscheidung des Rates vom 27. Juni 1996 zur Ermächtigung
    eines Mitgliedstaats, gemäß dem Verfahren in Artikel 8 Absatz 4 der Richtlinie
    92/81/EWG für Mineralöle mit bestimmten Verwendungszwecken Verbrauchsteuerbefreiungen
    oder -ermäßigungen einzuführen oder beizubehalten'
  type: main
- language: da
  script: Latn
  content: '96/418/EF: Rådets Beslutning af 27. juni 1996 om bemyndigelse af en medlemsstat
    til i overensstemmelse med artikel 8, stk. 4, i direktiv 92/81/EØF at indføre
    eller fortsat anvende punktafgiftsfritagelser eller - lempelser for visse typer
    mineralolier, der anvendes til særlige formål'
  type: main
- language: el
  script: Grek
  content: '96/418/ΕΚ: Απόφαση του Συμβουλίου της 27ης
    Ιουνίου 1996 με την οποία εξουσιοδοτείται ένα
    κράτος μέλος, σύμφωνα με το άρθρο 8 παράγραφος
    4 της οδηγίας 92/81/ΕΟΚ, να θεσπίσει ή να συνεχίσει
    να εφαρμόζει απαλλαγές ή μειώσεις όσον αφορά
    τους ειδικούς φόρους κατανάλωσης με ορισμένα
    πετρελαιοειδή που χρησιμοποιούνται για συγκεκριμένους
    σκοπούς'
  type: main
- language: fi
  script: Latn
  content: '96/418/EY: Neuvoston päätös, tehty 27 päivänä kesäkuuta 1996, jäsenvaltion
    valtuuttamisesta direktiivin 92/81/ETY 8 artiklan 4 kohdan mukaisesti ottamaan
    käyttöön vapautuksia tai alennuksia tiettyihin erityistarkoituksiin käytettäviin
    kivennäisöljyihin sovellettavista valmisteveroista tai jatkamaan tällaisten
    verovapautusten tai veronalennusten soveltamista'
  type: main
- language: it
  script: Latn
  content: '96/418/CE: Decisione del Consiglio del 27 giugno 1996 che autorizza uno
    Stato membro, a norma dell''articolo 8, paragrafo 4 della direttiva 92/81/CEE,
    ad applicare o a continuare ad applicare a determinati oli minerali utilizzati
    per fini specifici riduzioni delle aliquote d''accisa od esenzioni dall''accisa'
  type: main
- language: nl
  script: Latn
  content: '96/418/EG: Beschikking van de Raad van 27 juni 1996 waarbij aan een Lid-Staat
    toestemming wordt verleend, overeenkomstig artikel 8, lid 4, van Richtlijn 92/81/EEG,
    om verlaagde accijnstarieven of vrijstellingen van accijnzen te blijven toepassen
    op bepaalde minerale oliën die voor bijzondere doeleinden worden gebruikt'
  type: main
