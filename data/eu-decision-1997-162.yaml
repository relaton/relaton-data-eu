    Πολιτειών της Αμερικής για τα κλωστοϋφαντουργικά
    προϊόντα, που έχει ως συνέπεια την άρνηση της
    αναγνώρισης κοινοτικής καταγωγής σε ορισμένα
    μεταποιημένα προϊόντα στην Ευρωπαϊκή Κοινότητα'
  type: main
