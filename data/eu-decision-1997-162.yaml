title:
- language: en
  script: Latn
  content: '97/162/EC: Commission Decision of 18 February 1997 on the initiation of
    international consultation and dispute settlement procedures concerning changes
    to United States rules of origin for textile products resulting in the non-conferral
    of Community origin on certain products processed in the European Community'
  type: main
- language: fr
  script: Latn
  content: '97/162/CE: Décision de la Commission du 18 février 1997 relative à
    l''ouverture d''une procédure internationale de consultation et de règlement
    des différends concernant le changement des règles d''origine des États-Unis
    d''Amérique pour les produits textiles, qui a pour effet de refuser l''origine
    communautaire à certains produits transformés dans la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '97/162/EG: Beschluß der Kommission vom 18. Februar 1997 über die Einleitung
    eines internationalen Konsultations- und Streitbeilegungsverfahrens betreffend
    die Änderung der Ursprungsregeln der Vereinigten Staaten von Amerika für Textilwaren
    und die sich daraus ergebende Nichtanerkennung des Gemeinschaftsursprungs bestimmter
    in der Europäischen Gemeinschaft verarbeiteter Waren'
  type: main
- language: da
  script: Latn
  content: '97/162/EF: Kommissionens afgørelse af 18. februar 1997 om indledning
    af en international procedure for konsultation og bilæggelse af uoverensstemmelser
    vedrørende den ændring af oprindelsesreglerne i Amerikas Forenede Stater for
    tekstilvarer, som har til følge, at visse varer, der er forarbejdet i Det Europæiske
    Fællesskab, nægtes fællesskabsoprindelse'
  type: main
- language: el
