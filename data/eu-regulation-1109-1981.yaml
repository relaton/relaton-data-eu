title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1109/81 of 28 April 1981 reintroducing the
    levying of the customs duties applicable to salicylic acid falling under subheading
    29.16 B I a), originating in Romania and benefiting from the tariff preferences
    provided for by Council Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1109/81 de la Commission, du 28 avril 1981, portant
    rétablissement de la perception des droits de douane applicables à l' acide
    salicylique de la sous-position 29.16 B I a) du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1109/81 der Kommission vom 28. April 1981 zur Wiedereinführung
    der Erhebung der Zölle für Salicylsäure der Tarifstelle 29.16 B I a), mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1109/81 af 28. april 1981 om genindførelse
    af opkrævning af told for salicylsyre, henhørende under pos. 29.16 B I a) med
    oprindelse i Rumænien, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1109/81 τής Επιτροπής
