    τής δασμολογικής διακρίσεως 29. 16 Β Ι α) καταγωγής
    Ρουμανίας, δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1109/81 della Commissione, del 28 aprile 1981, che
    ripristina la riscossione dei dazi doganali applicabili all' acido salicilico
    della sottovoce 29.16 B I a) della tariffa doganale comune, originario della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1109/81 van de Commissie van 28 april 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op salicylzuur
    van tariefpostonderverdeling 29.16 B I a), van oorsprong uit Roemenië, waarvoor
    de in Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn
    verleend
