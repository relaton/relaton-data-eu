schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 March 1994 authorizing the Member States to permit
    temporarily the marketing of seed of swede rape not satisfying the requirements
    of Council Directive 69/208/EEC
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 8 mars 1994 autorisant les États membres
    à permettre temporairement la commercialisation de semences de colza ne satisfaisant
    pas aux exigences de la directive 69/208/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 8. März 1994 zur Ermächtigung der Mitgliedstaaten,
    vorübergehend Saatgut von Raps zum Verkehr zuzulassen, das den Anforderungen
    der Richtlinie 69/208/EWG des Rates nicht entspricht
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 8. marts 1994 om bemyndigelse af medlemsstaterne
    til midlertidigt at tillade handel med rapsfrø, der ikke opfylder kravene i Rådets
    direktiv 69/208/EØF
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 8ης Μαρτίου 1994
    που χορηγεί άδεια στα κράτη μέλη να επιτρέψουν
    προσωρινά την εμπορία σπόρων προς σπορά ελαιοκράμβης
    που δεν ανταποκρίνονται στις απαιτήσεις της
    οδηγίας 69/208/ΕΟΚ του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE dell' 8 marzo 1994 che autorizza gli Stati
    membri ad ammettere temporaneamente la commercializzazione di sementi di colza
    che non soddisfano ai requisiti della direttiva 69/208/CEE del Consiglio
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 8 maart 1994 tot machtiging van de Lid-Staten
    om tijdelijk toe te staan dat koolzaad in de handel wordt gebracht dat niet voldoet
    aan de eisen van Richtlijn 69/208/EEG van de Raad
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 8 de Março de 1994 que autoriza os Estados-membros
    a permitir temporariamente a comercialização de sementes de colza que não satisfaçam
    as exigências da Directiva 69/208/CEE do Conselho
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 8 de marzo de 1994 por la que se autoriza
    a los Estados miembros para permitir temporalmente la comercialización de semillas
    de colza que no reúnan las condiciones establecidas en la Directiva 69/208/CEE
    del Consejo
  type: main
