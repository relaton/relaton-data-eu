title:
- language: fr
  script: Latn
  content: Décision 68/54/CEE de la Commission, du 22 décembre 1967, autorisant
    la République française, en vertu de l'article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire les "autres jouets, modèles réduits pour
    le divertissement" de la position 97.03 du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '68/54/EWG: Entscheidung der Kommission vom 22. Dezember 1967, mit der
    die Französische Republik gemäß Artikel 115 Absatz 1 des Vertrages ermächtigt
    wird, "anderes Spielzeug, Modelle zum Spielen" der Tarifnummer 97.03 des Gemeinsamen
    Zolltarifs, die aus Japan stammen und sich in den übrigen Mitgliedstaaten im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '68/54/CEE: Decisione della Commissione, del 22 dicembre 1967, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del trattato,
    ad escludere dal trattamento comunitario gli «altri giocattoli, modelli ridotti
    per divertimento» della voce 97.03 della tariffa doganale comune, originari del
    Giappone e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '68/54/EEG: Beschikking van de Commissie van 22 december 1967 houdende
    machtiging van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag ander speelgoed, modellen op schaal voor ontspanning, van post
    97.03 van het gemeenschappelijk douanetarief, die van oorsprong zijn uit Japan
    en in andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
