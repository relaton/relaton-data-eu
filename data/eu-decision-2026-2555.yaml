title:
- language: en
  script: Latn
  content: Council Decision (EU) 2026/2555 of 9 November 2026 on the position to be
    taken on behalf of the European Union within the EU-Central America Association
    Council concerning an amendment to Decision No 2/2020 of the EU-Central America
    Association Council to replace the Explanatory Note to Article 19 of Annex II
    to the Agreement establishing an Association between the European Union and its
    Member States, on the one hand, and Central America on the other and to insert
    Explanatory Notes to Articles 22 and 27 of Annex II to that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/2555 du Conseil du 9 novembre 2026 relative à la position
    à prendre, au nom de l’Union européenne, au sein du conseil d’association
    UE-Amérique centrale concernant une modification de la décision n° 2/2020 du
    conseil d’association UE-Amérique centrale, afin de remplacer la note explicative
    relative à l’article 19 de l’annexe II de l’accord établissant une association
    entre l’Union européenne et ses États membres, d’une part, et l’Amérique
    centrale, d’autre part, et d’insérer des notes explicatives relatives aux
    articles 22 et 27 de l’annexe II dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2026/2555 des Rates vom 9. November 2026 über den im Namen
