    des Beschlusses Nr. 2/2020 des Assoziationsrates EU-Zentralamerika zur Ersetzung
    der Erläuterung zu Artikel 19 des Anhangs II des Abkommens zur Gründung einer
    Assoziation zwischen der Europäischen Union und ihren Mitgliedstaaten einerseits
    und Zentralamerika andererseits sowie zur Einfügung von Erläuterungen zu den
    Artikeln 22 und 27 des Anhangs II des genannten Abkommens zu vertretenden Standpunkt
  type: main
