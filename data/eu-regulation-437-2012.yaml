  script: Latn
  content: Verordening (EU) nr. 437/2012 van de Commissie van 23 mei 2012 tot opening
    van een onderzoek naar de mogelijke ontwijking van de bij Uitvoeringsverordening
    (EU) nr. 791/2011 van de Raad ingestelde antidumpingmaatregelen ten aanzien van
    de invoer van bepaalde open weefsels van glasvezels, van oorsprong uit de Volksrepubliek
