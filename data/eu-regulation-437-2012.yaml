    Taiwan en Thailand, al dan niet aangegeven als van oorsprong uit Taiwan en Thailand,
    en tot registratie van deze invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 437/2012 z dnia 23 maja 2012 r. wszczynające
