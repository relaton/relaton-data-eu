  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 437/2012 della Commissione, del 23 maggio 2012 , che
    apre un'inchiesta sulla possibile elusione delle misure antidumping istituite
    dal regolamento di esecuzione (UE) n. 791/2011 del Consiglio sulle importazioni
    di alcuni tessuti in fibra di vetro a maglia aperta originari della Repubblica
    popolare cinese mediante le importazioni di alcuni tessuti in fibra di vetro a
    maglia aperta spediti da Taiwan e dalla Thailandia, indipendentemente dal fatto
    che siano dichiarati o no originari di tali paesi, e che dispone la registrazione
    di dette importazioni
  type: main
- language: lv
  script: Latn
