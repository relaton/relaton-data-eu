    Īstenošanas regulu (ES) Nr. 791/2011 noteikti konkrētu Ķīnas Tautas Republikas
    izcelsmes stikla šķiedras sieta audumu importam, ko veic, tos nosūtot no Taivānas
    un Taizemes un deklarējot vai nedeklarējot kā Taivānas un Taizemes izcelsmes
    ražojumus, un par šāda importa reģistrāciju
  type: main
