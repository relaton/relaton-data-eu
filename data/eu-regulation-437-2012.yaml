    glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno uredbo
    Sveta (EU) št. 791/2011 na uvoz nekaterih tkanin z odprto mrežno strukturo iz
    steklenih vlaken s poreklom iz Ljudske republike Kitajske pri uvozu nekaterih
