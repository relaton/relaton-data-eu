title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 437/2012 of 23 May 2012 initiating an investigation
    concerning the possible circumvention of anti-dumping measures imposed by Council
    Implementing Regulation (EU) No 791/2011 on imports of certain open mesh fabrics
    of glass fibres originating in the People's Republic of China by imports of certain
    open mesh fabrics of glass fibres consigned from Taiwan and Thailand, whether
    declared as originating in Taiwan and Thailand or not, and making such imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 437/2012 de la Commission du 23 mai 2012 portant ouverture
    d’une enquête sur le contournement éventuel des mesures antidumping instituées
    par le règlement d’exécution (UE) n ° 791/2011 du Conseil sur les importations
    de certains tissus de fibre de verre à maille ouverte originaires de la République
    populaire de Chine par des importations de certains tissus de fibre de verre à
    maille ouverte expédiés de Taïwan et de Thaïlande, qu’ils aient ou non été
    déclarés originaires de ces pays, et soumettant ces importations à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 437/2012 der Kommission vom 23. Mai 2012 zur Einleitung
    einer Untersuchung betreffend die mutmaßliche Umgehung der mit der Durchführungsverordnung
    (EU) Nr. 791/2011 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter offenmaschiger Gewebe aus Glasfasern mit Ursprung in der
    Volksrepublik China durch aus Taiwan oder Thailand versandte Einfuhren bestimmter
    offenmaschiger Gewebe aus Glasfasern, ob als Ursprungserzeugnisse Taiwans oder
    Thailands angemeldet oder nicht, und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
