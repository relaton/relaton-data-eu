    Vijeća (EU) br. 791/2011 na uvoz određene pređe otvorene mrežne strukture
    od staklenih vlakana podrijetlom iz Narodne Republike Kine, uvozom određene pređe
    otvorene mrežne strukture od staklenih vlakana koja se otprema iz Tajvana i Tajlanda,
    neovisno o tome je li njihovo podrijetlo deklarirano u Tajvanu i Tajlandu ili
    nije, te o uvjetovanju takvog uvoza evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság 437/2012/EU rendelete ( 2012. május 23. ) a 791/2011/EU tanácsi
    végrehajtási rendelettel a Kínai Népköztársaságból származó egyes üvegszál
    szitaszövetek behozatalával szemben bevezetett dömpingellenes intézkedéseknek
    a Tajvanban és Thaiföldön feladott – akár Tajvanból és Thaiföldről származóként,
    akár nem ilyenként bejelentett – egyes üvegszál szitaszövetek behozatala
