    poddające ten przywóz rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 437/2012 da Comissão, de 23 de maio de 2012 , que
    inicia um inquérito sobre a eventual evasão às medidas anti-dumping instituídas
    pelo Regulamento de Execução (UE) n. ° 791/2011 do Conselho sobre as importações
    de determinados tecidos de fibra de vidro de malha aberta originários da República
