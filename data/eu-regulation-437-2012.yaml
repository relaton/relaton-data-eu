    stiklo pluošto audiniams, vengimo importuojant tam tikrus iš Taivano ir Tailando
    siunčiamus tinklinius stiklo pluošto audinius, deklaruojamus kaip Taivano ir
    Tailando kilmės arba ne, tyrimo inicijavimo ir įpareigojimo registruoti tokius
    importuojamus produktus
  type: main
