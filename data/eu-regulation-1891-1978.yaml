title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1891/78 of 2 August 1978 re-establishing
    the levying of the customs duties on other kinds of leather, falling within subheading
    41.05 B II and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1891/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux peaux préparées
    d'autres animaux, non dénommées, de la sous-position 41.05 B II du tarif douanier
    commun, originaires de Yougoslavie, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1891/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für anderes Leder aus Häuten oder Fellen von anderen Tieren der
    Tarifstelle 41.05 B II mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1891/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for andre dyrehuder og dyreskind, under underposition
    41.05 B II, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1891/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli preparate
    di altri animali, non nominate, della sottovoce doganale 41.05 B II, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1891/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op overige
    voorgelooide huiden en vellen, van andere dieren, van post 41.05 B II, van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
