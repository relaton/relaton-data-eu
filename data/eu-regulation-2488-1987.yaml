  script: Latn
  content: Commission Regulation (EEC) No 2488/87 of 17 August 1987 re-establishing
    the levying of customs duties on alkaloids of cinchona, falling within subheading
    29.42 B of the Common Customs Tariff originating in Indonesia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2488/87 de la Commission du 17 août 1987 portant
    rétablissement de la perception des droits de douane applicables aux alcaloïdes
    du quinquina, de la sous-position 29.42 B du tarif douanier commun, originaires
    d' Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
