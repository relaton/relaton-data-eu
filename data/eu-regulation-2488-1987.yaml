    Zolltarifs mit Ursprung in Indonesien, dem die in der Verordnung (EWG) Nr. 3924/86
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2488/87 af 17. august 1987 om genindførelse
