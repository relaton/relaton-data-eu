title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1094/97 of 16 June 1997 amending Regulation
    (EC) No 795/97 derogating from Regulation (EC) No 1223/94 laying down special
    detailed rules for the application of the system of advance- fixing certificates
    for certain agricultural products exported in the form of goods not covered by
    Annex II to the Treaty, and derogating from Regulation (EEC) No 3665/87 laying
    down common detailed rules for the application of the system of export refunds
    on agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1094/97 de la Commission du 16 juin 1997 modifiant
    le règlement (CE) nº 795/97 dérogeant au règlement (CE) nº 1223/94 portant
    modalités particulières d'application du régime des certificats de préfixation
    pour certains produits agricoles exportés sous forme de marchandises ne relevant
    pas de l'annexe II du traité, et dérogeant au règlement (CEE) nº 3665/87 portant
    modalités communes d'application du régime des restitutions à l'exportation
    pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1094/97 der Kommission vom 16. Juni 1997 zur Änderung
    der Verordnung (EG) Nr. 795/97 in Abweichung von der Verordnung (EG) Nr. 1223/94
    über besondere Durchführungsvorschriften für Vorausfestsetzungsbescheinigungen
    für bestimmte landwirtschaftliche Erzeugnisse, die in Form von nicht unter Anhang
    II des Vertrags fallenden Waren ausgeführt werden, sowie in Abweichung von der
    Verordnung (EWG) Nr. 3665/87 über gemeinsame Durchführungsvorschriften für
    Ausfuhrerstattungen bei landwirtschaftlichen Erzeugnissen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1094/97 af 16. juni 1997 om ændring
    af forordning (EF) nr. 795/97 om undtagelse fra forordning (EF) nr. 1223/94 om
    de særlige gennemførelsesbestemmelser for ordningen med forudfastsættelsesattester
    for visse landbrugsprodukter, som ikke omfattes af traktatens bilag II, og om
    undtagelse fra forordning (EØF) nr. 3665/87 om fælles gennemførelsesbestemmelser
    for eksportrestitutioner for landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1094/97 της Επιτροπής
    της 16ης Ιουνίου 1997 περί τροποποιήσεως του κανονισμού
    (ΕΚ) αριθ. 795/97 για παρέκκλιση από τον κανονισμό
    (ΕΚ) αριθ. 1223/94, περί των ειδικών λεπτομερών
    κανόνων εφαρμογής του καθεστώτος πιστοποιητικών
    προκαθορισμού για ορισμένα γεωργικά προϊόντα
    εισαγόμενα υπό μορφή εμπορευμάτων μη υπαγομένων
    στο παράρτημα ΙΙ της συνθήκης, και για παρέκκλιση
    από τον κανονισμό (ΕΟΚ) αριθ. 3665/87, περί κοινών
    ρυθμίσεων εφαρμογής του καθεστώτος επιστροφών
    κατά την εξαγωγή γεωργικών προϊόντων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1094/97, annettu 16 päivänä kesäkuuta 1997,
    tiettyjen perustamissopimuksen liitteeseen II kuulumattomina tavaroina vietävien
    maataloustuotteiden ennakkovahvistustodistusten järjestelmän soveltamista koskevista
    erityisistä yksityiskohtaisista säännöistä annetusta asetuksesta (EY) N:o
    1223/94 ja maataloustuotteiden vientitukien järjestelmän soveltamista koskevista
    yhteisistä yksityiskohtaisista säännöistä annetusta asetuksesta (ETY) N:o
    3665/87 poikkeamisesta annetun asetuksen (EY) N:o 795/97 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1094/97 della Commissione del 16 giugno 1997 che modifica
    il regolamento (CE) n. 795/97 che deroga al regolamento (CE) n. 1223/94 che stabilisce
    le modalità particolari di applicazione del regime dei titoli di fissazione anticipata
    per determinati prodotti agricoli esportati sotto forma di merci non comprese
    nell'allegato II del trattato, e che deroga al regolamento (CEE) n. 3665/87 recante
    modalità comuni di applicazione del regime delle restituzioni all'esportazione
    per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1094/97 van de Commissie van 16 juni 1997 tot wijziging
    van Verordening (EG) nr. 795/97 houdende afwijking van Verordening (EG) nr. 1223/94
    houdende bijzondere uitvoeringsbepalingen inzake het stelsel van voorfixatiecertificaten
    voor bepaalde landbouwproducten die worden uitgevoerd in de vorm van goederen
    die niet onder bijlage II van het Verdrag vallen, alsmede afwijking van Verordening
    (EEG) nr. 3665/87 houdende gemeenschappelijke uitvoeringsbepalingen van het stelsel
    van restituties bij uitvoer voor landbouwproducten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1094/97 da Commissão de 16 de Junho de 1997 que altera
    o Regulamento (CE) nº 795/97 que institui derrogações ao Regulamento (CE) nº
    1223/94 que estabelece normas especiais de execução do regime dos certificados
    de prefixação para certos produtos agrícolas exportados sob a forma de mercadorias
    não abrangidas pelo anexo II do Tratado e ao Regulamento (CEE) nº 3665/87 que
    estabelece regras comuns de execução do regime das restituições à exportação
    para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1094/97 de la Comisión de 16 de junio de 1997 por
    el que se modifica el Reglamento (CE) nº 795/97 por el que se introduce una excepción
    al Reglamento (CE) nº 1223/94 por el que se establecen modalidades especiales
    de aplicación del régimen de los certificados de fijación anticipada para determinados
    productos agrícolas exportados en forma de mercancías no incluidas en el Anexo
    II del Tratado y por el que se introduce una excepción al Reglamento (CEE) nº
    3665/87 por el que se establecen las modalidades comunes de aplicación del régimen
    de restituciones a la exportación de productos agrícolas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1094/97 av den 16 juni 1997 om ändring
    av förordning (EG) nr 795/97 om undantag från förordning (EG) nr 1223/94 om
    särskilda tillämpningsföreskrifter för systemet med förutfastställelselicenser
    för vissa jordbruksprodukter som exporteras i form av varor som inte omfattas
    av bilaga II till fördraget och om undantag från förordning (EEG) nr 3665/87
    om gemensamma tillämpningsföreskrifter för systemet med exportbidrag för jordbruksprodukter
  type: main
