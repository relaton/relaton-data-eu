title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2836/85 of 9 October 1985 re-establishing
    the levying of the customs duties applicable to certain radiotelegraphic and radiotelephonic
    transmission and reception apparatus; parts falling within subheadings 85.15 A
    III b) and 85.15 C II c) of the Common Customs Tariff, originating in Malaysia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2836/85 de la Commission du 9 octobre 1985 portant
    rétablissement de la perception des droits de douane applicables à certains
    appareils de transmission et de réception pour la radiotéléphonie et la radiotélégraphie,
    et leurs parties et pièces détachées, des sous-positions 85.15 A III b) et
    C II c) du tarif douanier commun, originaires de Malaysia, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2836/85 der Kommission vom 9. Oktober 1985 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Sende- und Empfangsgeräte für den Funksprech-
    oder Funktelegraphieverkehr; Teile, der Tarifstelle 85.15 A III b) und C II c)
    des Gemeinsamen Zolltarifs mit Ursprung in Malaysia, dem die in der Verordnung
    (EWG) Nr. 3562/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2836/85 af 9. oktober 1985 om genindførelse
    af opkrævning af told for bestemte sendere og modtagere til radiotelegrafi og
    radiotelefoni, dele, henhørende under pos. 85.15 A III b), C II c), og med oprindelse
    i Malaysia, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3562/84
  type: main
- language: el
  script: Grek
