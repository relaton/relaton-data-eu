  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2836/85 della Commissione del 9 ottobre 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni apparecchi di trasmissione
    e di ricezione per la radiotelefonia e la radiotelegrafia, parti e pezzi staccati,
    della sottovoce 85.15 A III b), C II c) della tariffa doganale comune, originari
    della Malesia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2836/85 van de Commissie van 9 oktober 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op sommige zend-
    en ontvangtoestellen voor radiotelefonie of voor radiotelegrafie; delen en onderdelen,
    van postonderverdelingen 85.15 A III b) en C II c), van oorsprong uit Maleisië
