    taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2023/1551 van de Raad van 25 juli 2023 waarbij
    Duitsland wordt gemachtigd een bijzondere maatregel in te voeren die afwijkt van
    de artikelen 218 en 232 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke
    stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2023/1551 z dnia 25 lipca 2023 r. w sprawie
    upoważnienia Niemiec do wprowadzenia szczególnego środka stanowiącego odstępstwo
    od art. 218 i 232 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku od
    wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/1551 do Conselho de 25 de julho de 2023
    que autoriza a Alemanha a aplicar uma medida especial em derrogação dos artigos
    218.o e 232.o da Diretiva 2006/112/CE relativa ao sistema comum do imposto sobre
    o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/1551 a Consiliului din 25 iulie
    2023 de autorizare a Germaniei să introducă o măsură specială de derogare
    de la articolele 218 și 232 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2023/1551 z 25. júla 2023, ktorým
    sa Nemecku povoľuje zaviesť osobitné opatrenie odchyľujúce sa od článkov
    218 a 232 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2023/1551 z dne 25. julija 2023 o dovoljenju
    Nemčiji, da uvede posebni ukrep, ki odstopa od členov 218 in 232 Direktive 2006/112/ES
    o skupnem sistemu davka na dodano vrednost
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2023/1551 del Consejo de 25 de julio de 2023
