  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2023/1551, annettu 25 päivänä
    heinäkuuta 2023, luvan antamisesta Saksalle ottaa käyttöön yhteisestä arvonlisäverojärjestelmästä
    annetun direktiivin 2006/112/EY 218 ja 232 artiklasta poikkeava erityistoimenpide
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/1551 ón gComhairle an 25 Iúil 2023
