title:
- language: en
  script: Latn
  content: Council Implementing Decision (EU) 2023/1551 of 25 July 2023 authorising
    Germany to introduce a special measure derogating from Articles 218 and 232 of
    Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1551 du Conseil du 25 juillet 2023 autorisant
    l’Allemagne à introduire une mesure particulière dérogatoire aux articles
    218 et 232 de la directive 2006/112/CE relative au système commun de taxe sur
    la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1551 des Rates vom 25. Juli 2023 zur
    Ermächtigung Deutschlands, eine von den Artikeln 218 und 232 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Sondermaßnahme einzuführen
  type: main
- language: bg
  script: Cyrl
