    artikel 218 og 232 i direktiv 2006/112/EF om det fælles merværdiafgiftssystem
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/1551 του Συμβουλίου
    της 25ης Ιουλίου 2023 με την οποία επιτρέπεται
    στη Γερμανία να εισαγάγει ειδικό μέτρο παρέκκλισης
    από τα άρθρα 218 και 232 της οδηγίας 2006/112/ΕΚ σχετικά
    με το κοινό σύστημα φόρου προστιθέμενης αξίας
  type: main
- language: et
  script: Latn
  content: Nõukogu rakendusotsus (EL) 2023/1551, 25. juuli 2023, millega antakse
