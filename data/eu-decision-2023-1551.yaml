    от членове 218 и 232 от Директива 2006/112/ЕО относно
    общата система на данъка върху добавената
    стойност
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Rady (EU) 2023/1551 ze dne 25. července 2023,
    kterým se Německu povoluje zavést zvláštní opatření odchylující se od
    článků 218 a 232 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2023/1551 af 25. juli 2023 om at
