    al sistema común del impuesto sobre el valor añadido
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandebeslut (EU) 2023/1551 av den 25 juli 2023 om bemyndigande
    för Tyskland att införa en särskild åtgärd som avviker från artiklarna 218
    och 232 i direktiv 2006/112/EG om ett gemensamt system för mervärdesskatt
