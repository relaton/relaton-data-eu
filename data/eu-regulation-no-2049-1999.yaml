title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2049/1999 of 27 September 1999 amending Regulation
    (EC) No 2450/98 imposing a definitive countervailing duty on imports of stainless
    steel bars originating in India and collecting definitively the provisional duty
    imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2049/1999 du Conseil, du 27 septembre 1999, modifiant
    le règlement (CE) nº 2450/98 instituant un droit compensateur définitif sur
    les importations de barres en acier inoxydable originaires de l'Inde et portant
    perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2049/1999 des Rates vom 27. September 1999 zur Änderung
    der Verordnung (EG) Nr. 2450/98 zur Einführung eines endgültigen Ausgleichszolls
    auf die Einfuhren von Stabstahl aus nichtrostendem Stahl mit Ursprung in Indien
    und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2049/1999 af 27. september 1999 om ændring
    af forordning (EF) nr. 2450/98 om indførelse af en endelig udligningstold på
    importen af stænger af rustfrit stål med oprindelse i Indien og om endelig opkrævning
    af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2049/1999 του Συμβουλίου,
    της 27ης Σεπτεμβρίου 1999, περί τροποποιήσεως
    του κανονισμού (ΕΚ) αριθ. 2450/98 για την επιβολή
    οριστικού αντισταθμιστικού δασμού στις εισαγωγές
    ράβδων ανοξείδωτου χάλυβα, καταγωγής Ινδίας,
    και την οριστική είσπραξη του επιβληθέντος
    προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2049/1999, annettu 27 päivänä syyskuuta 1999,
    lopullisen tasoitustullin käyttöön ottamisesta Intiasta peräisin olevien ruostumattomasta
    teräksestä valmistettujen tankojen tuonnissa ja väliaikaisen tullin lopullisesta
    kantamisesta annetun asetuksen (EY) N:o 2450/98 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2049/1999 del Consiglio, del 27 settembre 1999, recante
    modifica del regolamento (CE) n. 2450/98 che impone un dazio compensativo definitivo
    sulle importazioni di barre di acciaio inossidabile originarie dell'India e decide
    la riscossione definitiva del dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2049/1999 van de Raad van 27 september 1999 tot wijziging
    van Verordening (EG) nr. 2450/98 tot instelling van een definitief compenserend
    recht op de invoer van roestvrij stalen staven van oorsprong uit India en tot
    definitieve invordering van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2049/1999 do Conselho, de 27 de Setembro de 1999,
    que altera o Regulamento (CE) n° 2450/98 que institui um direito de compensação
    definitivo sobre as importações de barras de aço inoxidável originárias da
    Índia e que determina a cobrança definitiva do direito provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2049/1999 del Consejo, de 27 de septiembre de 1999,
    que modifica el Reglamento (CE) nº 2450/98 por el que se establece un derecho
    compensatorio definitivo sobre las importaciones de barras de acero inoxidable
    originarias de la India y por el que se percibe definitivamente el derecho provisional
    establecido
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2049/1999 av den 27 september 1999 om ändring
    av förordning (EG) nr 2450/98 om införande av en slutgiltig utjämningstull
    på import av stänger av rostfritt stål med ursprung i Indien och om slutgiltigt
    uttag av den provisoriska tullen
  type: main
