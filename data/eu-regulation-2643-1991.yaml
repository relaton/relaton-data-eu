title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2643/91 of 4 September 1991 amending Regulation
    (EEC) No 1562/85 laying down detailed rules for the application of measures to
    encourage the processing of certain citrus fruit and the marketing of products
    processed from lemons
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2643/91 DE LA COMMISSION du 4 septembre 1991 modifiant
    le règlement (CEE) no 1562/85 portant modalités d'' application des mesures
    vivant à promouvoir la transformation de certains agrumes et la commercialisation
    des produits transformés à base de citrons #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2643/91 DER KOMMISSION vom 4. September 1991 zur
    Änderung der Verorderung (EWG) Nr. 1562/85 mit Durchführungsbestimmungen zu
    den Maßnahmen zur Förderung der Verarbeitung bestimmter Zitrusfrüchte und der
    Vermarktung von Verarbeitungserzeugnissen aus Zitronen #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2643/91 af 4. september 1991 om ændring
    af forordning (EØF) nr. 1562/85 om gennemførelsesbestemmelser til foranstaltningerne
    til fremme af forarbejdning af visse citrusfrugter og afsætning af produkter
    forarbejdet på basis af citroner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2643/91 της Επιτροπής
    της 4ης Σεπτεμβρίου 1991 για τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1562/85 περί λεπτομερειών
    εφαρμογής των μέτρων για την προώθηση της μεταποίησης
    ορισμένων εσπεριδοειδών και της εμπορίας των
    μεταποιημένων προϊόντων με βάση τα λεμόνια
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2643/91 DELLA COMMISSIONE del 4 settembre 1991 recante
    modifiche del regolamento (CEE) n. 1562/85 che stabilisce le modalità di applicazione
    delle misure intese a promuovere la trasformazione di taluni agrumi e la commercializzazione
    di prodotti trasformati a base di limoni #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2643/91 VAN DE COMMISSIE van 4 september 1991 tot
    wijziging van Verordening (EEG) nr. 1562/85 houdende uitvoeringsbepalingen ten
    aanzien van de maatregelen ter bevordering van de verwerking van bepaalde citrusvruchten
    en de afzet van produkten op basis van citroenen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2643/91 DA COMISSÃO de 4 de Setembro de 1991 que
    altera o Regulamento (CEE) no 1562/85 que estabelece normas de execução das
    medidas destinadas a promover a transformação de determinados citrinos e a comercialização
    dos produtos transformados à base de limões #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2643/91 DE LA COMISIÓN de 4 de septiembre de 1991
    por el que se modifica el Reglamento (CEE) no 1562/85 por el que se establecen
    las modalidades de aplicación de las medidas destinadas a promover la transformación
    de determinados cítricos y la comercialización de los productos transformados
    a base de limones #'
