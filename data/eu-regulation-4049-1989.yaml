    UND IN DER FISCHEREIZONE UM JAN MAYEN FISCHENDE FISCHEREIFAHRZEUGE AUF DIE MITGLIEDSTAATEN
    ( 1990 )
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4049/89 af 19. december 1989 om fordeling
