- language: en
  script: Latn
  content: Commission Regulation (EC) No 330/2004 of 26 February 2004 derogating,
    for 2004, from Regulation (EC) No 1396/98 laying down procedures for applying
    in the poultrymeat sector Council Regulation (EC) No 779/98 on the import into
    the Community of agricultural products originating in Turkey, repealing Regulation
    (EEC) No 4115/86 and amending Regulation (EC) No 3010/95
  type: main
- language: fr
  script: Latn
