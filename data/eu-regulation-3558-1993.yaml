  content: COMMISSION REGULATION (EC) No 3558/93 of 22 December 1993 amending Regulation
    (EEC) No 2697/93 laying down detailed rules for the period 1 July 1993 to 30 June
    1994 for the application of the import arrangements for fresh, chilled or frozen
    beef provided for in the Additional Protocols to the Interim Association Agreements
    between the Community and the Republic of Poland, the Republic of Hungary and
    the former Czech and Slovak Federal Republic
  type: main
