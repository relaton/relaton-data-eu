  content: Règlement (CE) n° 3558/93 de la Commission du 22 décembre 1993 modifiant
    le règlement (CEE) n° 2697/93 établissant pour la période du 1er juillet 1993
    au 30 juin 1994 les modalités d'application des régimes d'importation de viandes
    bovines fraîches, réfrigérées ou congelées, prévus dans les protocoles additionnels
    aux accords intérimaires d'association entre la Communauté et la République
    de Pologne, la République de Hongrie et l'ancienne République fédérative tchèque
    et slovaque
  type: main
