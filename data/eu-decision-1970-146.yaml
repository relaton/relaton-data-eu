title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 février 1970, portant prorogation de
    la décision du 14 avril 1965 autorisant la République italienne à exclure du
    traitement communautaire les piles électriques de la position 85.03 du Tarif
    douanier commun, originaires du Japon et mises en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '70/146/EWG: Entscheidung der Kommission vom 4. Februar 1970 zur Verlängerung
    der Entscheidung vom 14. April 1965, mit der die Italienische Republik ermächtigt
    worden war, Primärelemente und Primärbatterien (Tarifnummer 85.03 des Gemeinsamen
    Zolltarifs) japanischen Ursprungs, die sich in den anderen Mitgliedstaaten im
    freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/146/CEE: Decisione della Commissione, del 4 febbraio 1970, con cui
    si proroga la decisione del 14 aprile 1965 che autorizza la Repubblica italiana
    ad escludere dal trattamento comunitario le pile elettriche, voce 85.03 della
    tariffa doganale comune, originarie del Giappone ed immesse in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/146/EEG: Beschikking van de Commissie van 4 februari 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd om elektrische elementen en elektrische
    batterijen van post 85.03 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de andere Lid-Staten in het vrije verkeer gebracht van de communautaire
    behandeling uit te sluiten'
  type: main
