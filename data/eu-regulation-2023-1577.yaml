title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/1577 of 20 April 2023 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards on the calculation of the own funds requirements
    for market risk for non-trading book positions subject to foreign exchange risk
    or commodity risk and the treatment of those positions for the purposes of the
    regulatory back-testing requirements and the profit and loss attribution requirement
    under the alternative internal model approach
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/1577 de la Commission du 20 avril 2023
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation relatives au calcul des exigences
    de fonds propres pour risque de marché pour les positions hors portefeuille de
    négociation exposées au risque de change ou au risque sur matières premières
    et au traitement de ces positions aux fins des exigences prudentielles de contrôles
    a posteriori et de l’exigence d’attribution des profits et pertes dans le
    cadre de l’approche alternative fondée sur les modèles internes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/1577 der Kommission vom 20. April 2023
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards für die Berechnung der Eigenmittelanforderungen
    für das Marktrisiko bezüglich Anlagebuchpositionen, die dem Fremdwährungs-
    oder dem Warenpositionsrisiko unterliegen, und für die Behandlung dieser Positionen
    für die Zwecke der Anforderungen für Rückvergleiche und die Gewinn- und Verlustzuweisung
    im Rahmen des alternativen auf einem internen Modell basierenden Ansatzes
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/1577 на Комисията
    от 20 април 2023 година за допълнение на Регламент
    (ЕС) № 575/2013 на Европейския парламент и на Съвета
    с регулаторни технически стандарти за изчисляване
    на капиталовите изисквания за пазарен риск
    при изложените на валутен или стоков риск позиции
    в банковия портфейл и за третиране на тези
    позиции с оглед на регулаторните изисквания
    за бек-тестове и за разпределяне на печалбата
    и загубата при алтернативния подход на вътрешните
    модели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/1577 ze dne 20. dubna
    2023, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    575/2013, pokud jde o regulační technické normy pro výpočet kapitálových
    požadavků k tržnímu riziku u pozic v investičním portfoliu vystavených
    měnovému nebo komoditnímu riziku a pro zacházení s těmito pozicemi pro účely
    regulačních požadavků na zpětné testování a požadavku na přiřazování
    zisků a ztrát podle přístupu založeného na alternativních interních modelech
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/1577 af 20. april 2023 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013
    for så vidt angår reguleringsmæssige tekniske standarder for beregning af kapitalgrundlagskravene
    vedrørende markedsrisiko for positioner uden for handelsbeholdningen, der er
    udsat for valutakursrisiko eller råvarerisiko, og behandlingen af disse positioner
    med henblik på de reguleringsmæssige »backtesting«-krav og kravet vedrørende
    fordeling af overskud og tab efter den alternative metode med interne modeller
  type: main
