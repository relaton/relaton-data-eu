    skont l-approċċ alternattiv tal-mudell intern
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/1577 van de Commissie van 20 april 2023
    tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement en
    de Raad met technische reguleringsnormen voor de berekening van de eigenvermogensvereisten
    voor marktrisico voor posities in de niet-handelsportefeuille waaraan een wisselkoersrisico
    of grondstoffenrisico is verbonden, en de behandeling van die posities ten behoeve
    van de wettelijke backtestingvereisten en het vereiste inzake de toeschrijving
    van winsten en verliezen in het kader van de alternatieve internemodellenbenadering
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/1577 z dnia 20 kwietnia 2023
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 575/2013
    w odniesieniu do regulacyjnych standardów technicznych dotyczących obliczania
    wymogów w zakresie funduszy własnych z tytułu ryzyka rynkowego mających zastosowanie
    do pozycji portfela bankowego obciążonych ryzykiem walutowym lub ryzykiem cen
    towarów oraz sposobów traktowania tych pozycji na potrzeby wymogu dotyczącego
    regulacyjnej weryfikacji historycznej oraz wymogu dotyczącego przypisania zysków
    i strat z zastosowaniem alternatywnej metody modeli wewnętrznych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/1577 da Comissão de 20 de abril de 2023
    que complementa o Regulamento (UE) n.o 575/2013 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação sobre o cálculo dos
    requisitos de fundos próprios relativos ao risco de mercado de posições extracarteira
    de negociação sujeitas a risco cambial ou a risco de mercadorias e sobre o tratamento
    dessas posições para efeitos dos requisitos regulamentares de verificações
    a posteriori e do requisito de atribuição de lucros e perdas de acordo com o
    método alternativo dos modelos internos
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/1577 al Comisiei din 20 aprilie 2023 de
    completare a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al
    Consiliului în ceea ce privește standardele tehnice de reglementare referitoare
    la calcularea cerințelor de fonduri proprii pentru riscul de piață aferent
    pozițiilor din afara portofoliului de tranzacționare care prezintă un risc
    valutar sau un risc de marfă și la tratamentul pozițiilor respective în sensul
    cerințelor de reglementare în materie de testare ex post și al cerinței privind
    atribuirea profitului și a pierderii în cadrul abordării bazate pe modele interne
    alternative
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/1577 z 20. apríla 2023, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ
    ide o regulačné technické predpisy týkajúce sa výpočtu požiadaviek na
    vlastné zdroje pre trhové riziko v súvislosti s pozíciami v neobchodnej knihe,
    ktoré podliehajú devízovému riziku alebo komoditnému riziku, a zaobchádzania
    s týmito pozíciami na účely regulačných požiadaviek na spätné testovanie
    a požiadavky na pridelenie ziskov a strát podľa alternatívneho prístupu interného
    modelu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1577 z dne 20. aprila 2023 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi za izračun kapitalskih zahtev za tržno tveganje za pozicije
    iz netrgovalne knjige, izpostavljene valutnemu ali blagovnemu tveganju, in za
    obravnavo teh pozicij za namene regulativnih zahtev glede testiranja za nazaj
    ter zahteve po pripisu dobičkov in izgub v okviru alternativnega pristopa notranjih
    modelov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/1577 de la Comisión de 20 de abril de 2023
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación relativas
    al cálculo de los requisitos de fondos propios por riesgo de mercado respecto
    de las posiciones de la cartera de inversión sujetas al riesgo de tipo de cambio
    o de materias primas y al tratamiento de dichas posiciones a efectos de los requisitos
    en materia de pruebas retrospectivas obligatorias y del requisito en materia de
    atribución de pérdidas y ganancias con arreglo al método de modelos internos
    alternativos
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/1577 av den 20 april 2023
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska standarder för tillsyn för beräkning av kapitalbaskrav
    för marknadsrisk för positioner utanför handelslagret som omfattas av valutarisk
    eller råvarurisk och behandlingen av dessa positioner vid tillämpning av det
    lagstadgade kravet på utfallstest och kravet avseende resultatanalys enligt den
    alternativa internmodellmetoden
