  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/1577, 20. aprill 2023, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 575/2013 seoses
    regulatiivsete tehniliste standarditega, mis käsitlevad valuutariskile või kaubariskile
    avatud kauplemisportfelliväliste positsioonide tururiski omavahendite nõuete
    arvutamist ja nende positsioonide käsitlemist regulatiivsete järeltestimise
    nõuete kohaldamisel ning kasumi ja kahjumi tekkeallikate määramise nõude kohaldamisel
    alternatiivse sisemudeli meetodi alusel
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/1577, annettu 20 päivänä huhtikuuta
    2023, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 575/2013 täydentämisestä
    siltä osin kuin on kyse teknisistä sääntelystandardeista, jotka koskevat markkinariskiä
    koskevien omien varojen vaatimusten laskemista vaihtoehtoisten sisäisten mallien
    menetelmän mukaisesti sellaisten kaupankäyntivaraston ulkopuolisten positioiden
    osalta, joihin kohdistuu valuuttakurssiriski tai hyödykeriski, ja näiden positioiden
    kohtelua lakisääteisten toteutumatestausvaatimusten ja voittojen ja tappioiden
    tarkastelua koskevan vaatimuksen soveltamiseksi
  type: main
