  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/1577 оd 20. travnja 2023. o dopuni
    Uredbe (EU) br. 575/2013 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda o izračunu kapitalnih zahtjeva za tržišni rizik za pozicije
    iz knjige pozicija kojima se ne trguje koje su podložne valutnom riziku ili robnom
    riziku i o tretmanu tih pozicija za potrebe regulatornih zahtjeva za retroaktivno
    testiranje i zahtjeva za raspodjelu dobiti i gubitka u skladu s alternativnim
    pristupom internih modela
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1577 felhatalmazáson alapuló rendelete (2023.
    április 20.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek a devizaárfolyam-kockázatnak
    vagy árukockázatnak kitett nem kereskedési könyvi pozíciók tekintetében
    a piaci kockázat szavatolótőke-követelményeinek kiszámítására, valamint
    e pozícióknak az alternatív belső modellen alapuló módszer szerinti kötelező
    utótesztelési követelmény és eredményvizsgálatra vonatkozó követelmény
    alkalmazása céljából történő kezelésére vonatkozó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/1577 della Commissione del 20 aprile 2023
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione sul calcolo dei requisiti
    di fondi propri per il rischio di mercato delle posizioni esterne al portafoglio
    di negoziazione soggette al rischio di cambio o al rischio di posizione in merci
    e sul trattamento di tali posizioni ai fini dei requisiti relativi ai test retrospettivi
    regolamentari e al requisito relativo all’assegnazione di profitti e perdite
    nell’ambito del metodo alternativo dei modelli interni
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/1577 (2023. gada 20. aprīlis),
    ar ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 575/2013 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem par to, kā aprēķināt pašu kapitāla
    prasības attiecībā uz tirgus risku netirdzniecības portfeļa pozīcijām,
    kuras pakļautas ārvalstu valūtas riskam vai preču riskam, un par šīm pozīcijām
    piemērojamo režīmu regulatīvo atpakaļejošo pārbaužu prasību un peļņas
    un zaudējumu attiecinājuma prasības vajadzībām saskaņā ar alternatīvo
    iekšējā modeļa pieeju
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/1577 2023 m. balandžio 20
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas
    techniniais reguliavimo standartais, susijusiais su nuosavų lėšų reikalavimų
    rinkos rizikai padengti apskaičiavimu ne prekybos knygos pozicijoms, kurioms
    kyla užsienio valiutos kurso rizika arba biržos prekių kainos rizika, ir tų
    pozicijų traktavimu taikant reguliuojamojo grįžtamojo patikrinimo reikalavimus
    ir pelno ir nuostolio priskyrimo reikalavimą pagal alternatyvų vidaus modelių
    metodą
  type: main
