title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 946/2001 of 15 May 2001 derogating from Regulation
    (EC) No 2316/1999 laying down detailed rules for the application of Council Regulation
    (EC) No 1251/1999 establishing a support system for producers of certain arable
    crops, with regard to set-aside
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 946/2001 de la Commission du 15 mai 2001 dérogeant
    en ce qui concerne le gel des terres au règlement (CE) n° 2316/1999 portant
    modalités d'application du règlement (CE) n° 1251/1999 du Conseil instituant
    un régime de soutien aux producteurs de certaines cultures arables
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 946/2001 der Kommission vom 15. Mai 2001 zur Abweichung
    — hinsichtlich der Flächenstilllegung — von der Verordnung (EG) Nr. 2316/1999
    mit Durchführungsbestimmungen zur Verordnung (EG) Nr. 1251/1999 des Rates zur
    Einführung einer Stützungsregelung für Erzeuger bestimmter landwirtschaftlicher
    Kulturpflanzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 946/2001 af 15. maj 2001 om fravigelse,
    for så vidt angår jordudtagning, af forordning (EF) nr. 2316/1999 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1251/1999 om indførelse af en støtteordning
    for producenter af visse markafgrøder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 946/2001 της Επιτροπής,
    της 15ης Μαΐου 2001, για παρέκκλιση όσον αφορά
    την παύση καλλιέργειας των γαιών από τον κανονισμό
    (ΕΚ) αριθ. 2316/1999 σχετικά με τις λεπτομέρειες
    εφαρμογής του κανονισμού (ΕΚ) αριθ. 1251/1999 του
    Συμβουλίου για τη θέσπιση καθεστώτος στήριξης
    των παραγωγών ορισμένων αροτραίων καλλιεργειών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 946/2001, annettu 15 päivänä toukokuuta 2001,
    tukijärjestelmästä tiettyjen peltokasvien viljelijöille annetun neuvoston
    asetuksen (EY) N:o 1251/1999 soveltamista koskevista yksityiskohtaisista säännöistä
    annetun asetuksen (EY) N:o 2316/1999 muuttamisesta kesannoinnin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 946/2001 della Commissione, del 15 maggio 2001, che
    deroga, per quanto riguarda il ritiro dei terreni dalla produzione, al regolamento
    (CE) n. 2316/1999, recante modalità di applicazione del regolamento (CE) n. 1251/1999
    del Consiglio, che istituisce un regime di sostegno a favore dei coltivatori di
    taluni seminativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 946/2001 van de Commissie van 15 mei 2001 tot afwĳking,
    ten aanzien van de braaklegging, van Verordening (EG) nr. 2316/1999 houdende uitvoeringsbepalingen
    van Verordening (EG) nr. 1251/1999 van de Raad tot instelling van een steunregeling
    voor producenten van bepaalde akkerbouwgewassen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 946/2001 da Comissão, de 15 de Maio de 2001, que
    estabelece uma derrogação, no que diz respeito à retirada das terras da produção,
    do Regulamento (CE) n.° 2316/1999 que estabelece normas de execução do Regulamento
    (CE) n.° 1251/1999 do Conselho que institui um sistema de apoio aos produtores
    de determinadas culturas arvenses
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 946/2001 de la Comisión, de 15 de mayo de 2001, por
    el que se introduce una excepción, con respecto a la retirada de tierras, en
    el Reglamento (CE) n° 2316/1999 que establece las disposiciones de aplicación
    del Reglamento (CE) n° 1251/1999 del Consejo por el que se establece un régimen
    de apoyo a los productores de determinados cultivos herbáceos
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 946/2001 av den 15 maj 2001 om undantag
