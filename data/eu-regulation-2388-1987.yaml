title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2388/87 of 6 August 1987 re-establishing
    the levying of customs duties on mounted piezo-electric crystals falling within
    subheading 85.21 C, originating in Malaysia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2388/87 de la Commission du 6 août 1987 portant rétablissement
    de la perception des droits de douane applicables aux cristaux piézo-électriques
    montés, de la sous-position 85.21 C du tarif douanier commun, originaires de
    Malaysia, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2388/87 der Kommission vom 6. August 1987 zur Wiedereinführung
