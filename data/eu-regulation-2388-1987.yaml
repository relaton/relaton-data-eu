    der Tarifstelle 85.21 C des Gemeinsamen Zolltarifs mit Ursprung in Malaysia, dem
    die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2388/87 af 6. august 1987 om genindførelse
