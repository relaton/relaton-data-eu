    (AC 299263), DE 570 (Florasulam), Fluazolat (JV 485), Coniothyrium minitans und
    Benzoesäure in Anhang I der Richtlinie 91/414/EWG des Rates über das Inverkehrbringen
    von Pflanzenschutzmitteln eingereicht wurden (Bekanntgegeben unter Aktenzeichen
    K(1998) 3514)'
