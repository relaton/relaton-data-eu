title:
- language: en
  script: Latn
  content: '98/676/EC: Commission Decision of 17 November 1998 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of KIF 3535 (mepanipyrim), imazamox (AC 299263), DE 570
    (florasulam), fluazolat (JV 485), Coniothyrium minitans and benzoic acid in Annex
    I to Council Directive 91/414/EEC concerning the placing of plant-protection products
    on the market (notified under document number C(1998) 3514)'
  type: main
- language: fr
  script: Latn
  content: '98/676/CE: Décision de la Commission du 17 novembre 1998 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription du KIF 3535 (mépanipyrim), de l''imazamox (AC 299263), du DE
    570 (florasulam), du fluazolat (JV 485), du Coniothyrium minitans et de l''acide
    benzoïque dans l''annexe I de la directive 91/414/CEE du Conseil concernant la
    mise sur le marché des produits phytopharmaceutiques [notifiée sous le numéro
    C(1998) 3514]'
  type: main
- language: de
  script: Latn
