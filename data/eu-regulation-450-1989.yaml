title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 450/89 of 20 February 1989 imposing a definitive
    anti-dumping duty on imports of urea originating in the United States of America
    or Venezuela and adjusting the definitive anti-dumping duty for Saudi Arabia laid
    down by Regulation (EEC) No 3339/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 450/89 du Conseil du 20 février 1989 instituant un
    droit antidumping définitif sur les importations d'urée originaire des États-Unis
    d'Amérique et du Venezuela et adaptant le droit antidumping définitif pour l'Arabie
    saoudite prévu par le règlement (CEE) n° 3339/87
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 450/89 DES RATES vom 20. Februar 1989 zur Einführung
