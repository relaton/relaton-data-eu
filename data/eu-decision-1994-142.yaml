id: EUDecision1994142
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 February 1994 in accordance with Council Decision
    94/4/EC determining the United States of America as a country to the companies
    or other legal persons of which legal protection of topographies of semiconductor
    products is extended
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 25 février 1994 prise conformément à la
    décision 94/4/CE du Conseil et reconnaissant les États-Unis d'Amérique comme
    pays dont les sociétés ou autres personnes morales bénéficient de la protection
    des topographies de produits semi- conducteurs
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 25. Februar 1994 gemäß der Entscheidung
    94/4/EG des Rates zur Bestimmung der Vereinigten Staaten von Amerika als Land,
    auf dessen Unternehmen oder sonstige juristische Personen der Rechtsschutz für
    Topographien von Halbleitererzeugnissen ausgedehnt wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 25. februar 1994 i overensstemmelse med Rådets
    beslutning 94/4/EF om udvidelse af den retlige beskyttelse af halvlederprodukters
    topografi til at omfatte selskaber og andre juridiske personer fra Amerikas Forenede
    Stater
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 25ης Φεβρουαρίου
    1994 ληφθείσα σύμφωνα με την απόφαση 94/4/ΕΚ του
    Συμβουλίου με την οποία οι Ηνωμένες Πολιτείες
    της Αμερικής ορίζονται ως χώρα στην οποία επεκτείνεται
    η νομική προστασία των τοπογραφιών προϊόντων
    ημιαγωγών σε εταιρείες ή άλλα νομικά πρόσωπα
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 25 febbraio 1994 in conformità con la
    decisione 94/4/CE del Consiglio che definisce gli Stati Uniti d' America quale
    paese alle cui imprese od altre persone giuridiche è estesa la tutela delle topografie
    dei prodotti a semiconduttori
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 25 februari 1994 houdende toepassing van
    Beschikking 94/4/EG van de Raad en tot vaststelling dat de Verenigde Staten van
    Amerika een land zijn tot de vennootschappen of andere rechtspersonen waarvan
    de rechtsbescherming van topografieën van halfgeleiderprodukten wordt uitgebreid
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 25 de Fevereiro de 1994 nos termos da Decisão
    94/4/CE do Conselho que declara os Estados Unidos da América como um país relativamente
    a cujas empresas ou outras pessoas colectivas é alargada a protecção jurídica
    das topografias de produtos semicondutores
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 25 de febrero de 1994 con arreglo a la Decisión
    94/4/CE del Consejo relativa a la ampliación de la protección jurídica de las
    topografías de los productos semiconductores a las empresas y otras personas
    jurídicas de Estados Unidos de América
  type: main
