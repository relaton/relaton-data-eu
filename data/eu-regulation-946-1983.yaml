title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 946/83 of 21 April 1983 amending Regulation
    (EEC) No 1573/80 laying down provisions for the implementation of Article 5 (2)
    of Council Regulation (EEC) No 1697/79 on the post-clearance recovery of import
    duties or export duties which have not been required of the person liable for
    payment on goods entered for a customs procedure involving the obligation to pay
    such duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 946/83 de la Commission du 21 avril 1983 modifiant
    le règlement (CEE) no 1573/80 fixant les dispositions d' application de l' article
    5 paragraphe 2 du règlement (CEE) no 1697/79 du Conseil concernant le recouvrement
    "a posteriori" des droits à l' importation ou à l' exportation qui n' ont pas
    été exigés du redevable pour des marchandises déclarées pour un régime douanier
    comportant l' obligation de payer de tels droits
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 946/83 der Kommission vom 21. April 1983 zur Änderung
    der Verordnung (EWG) Nr. 1573/80 zur Durchführung von Artikel 5 Absatz 2 der
    Verordnung (EWG) Nr. 1697/79 des Rates betreffend die Nacherhebung von nicht vom
    Abgabenschuldner angeforderten Eingangs- oder Ausfuhrabgaben für Waren, die zu
    einem Zollverfahren angemeldet worden sind, das die Verpflichtung zur Zahlung
    derartiger Abgaben beinhaltet
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 946/83 af 21. april 1983 om ændring
    af forordning (EØF) nr. 1573/80 om gennemførelsesbestemmelserne til artikel
    5, stk. 2, i Rådets forordning (EØF) nr. 1697/79 om efteropkrævning af import-
    eller eksportafgifter, der ikke er opkrævet hos debitor for varer, der er angivet
    til en toldprocedure, som medfører en forpligtelse til at betale sådanne afgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 946/83 της Επιτροπής
    της 21ης Απριλίου 1983 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1573/80 περί καθορισμού των διατάξεων
    εφαρμογής του άρθρου 5 παράγραφος 2 του κανονισμού
    (ΕΟΚ) αριθ. 1697/79 του Συμβουλίου περί της εισπράξεως,
    εκ των υστέρων, εισαγωγικών ή εξαγωγικών δασμών
    που δεν είχαν απαιτηθεί από τον οφειλέτη, για
    εμπορεύματα δηλωθέντα για τελωνειακό καθεστώς
    που συνεπάγεται υποχρέωση καταβολής τέτοιου
    είδους δασμών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 946/83 della Commissione del 21 aprile 1983 che modifica
    il regolamento (CEE) n. 1573/80 che stabilisce le disposizioni d' applicazione
    dell' articolo 5, paragrafo 2, del regolamento (CEE) n. 1697/79 del Consiglio,
    relativo al ricupero a posteriori dei dazi all' importazione o dei dazi all' esportazione
    che non sono stati corrisposti dal debitore per le merci dichiarate per un regime
    doganale comportante l' obbligo di effettuarne il pagamento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 946/83 van de Commissie van 21 april 1983 tot wijziging
    van Verordening (EEG) nr. 1573/80 tot vaststelling van de uitvoeringsbepalingen
    van artikel 5, lid 2, van Verordening (EEG) nr. 1697/79 van de Raad inzake navordering
    van de rechten bij invoer of bij uitvoer die niet van de belastingschuldige zijn
    opgeëist voor goederen welke zijn aangegeven voor een douaneregeling waaruit
    de verplichting tot betaling van dergelijke rechten voortvloeide
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 946/83 da Comissão, de 21 de Abril de 1983, que
    altera o Regulamento (CEE) n.° 1573/80, que fixa as disposições de aplicação
    do n.° 2 do artigo 5.° do Regulamento (CEE) n.° 1697/79 do Conselho relativo
    à cobrança "a posteriori" dos direitos de importação ou dos direitos de exportação
    que não tenham sido exigidos ao devedor por mercadorias declaradas para um regime
    aduaneiro que implica a obrigação de pagamento dos referidos direitos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 946/83 de la Comisión, de 21 de abril de 1983, por
    el que se modifica el Reglamento (CEE) n° 1573/80, por el que se fijan las disposiciones
    de aplicación del apartado 2 del artículo 5 del Reglamento (CEE) n° 1697/79
    del Consejo, referente a la recaudación a posteriori de los derechos de importación
    o de los derechos de exportación que no hayan sido exigidos al deudor por mercancías
    declaradas en un régimen aduanero que suponga la obligación de pagar tales derechos
