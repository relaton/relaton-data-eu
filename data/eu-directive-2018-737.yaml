    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia w przypadku
    zastosowania ołowiu w lutach do lutowania dotyczącego wielowarstwowych kondensatorów
    ceramicznych z matrycą dyskową i planarną z otworami przelotowymi
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2018/737 da Comissão, de 27 de fevereiro de 2018,
