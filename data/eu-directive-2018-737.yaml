    direttiva 2011/65/UE del Parlamento europeo e del Consiglio per quanto riguarda
    l'esenzione relativa all'uso del piombo nelle paste saldanti impiegate per la
    saldatura di reti capacitive multistrato ceramiche realizzate con fori passanti
    metallizzati sia di tipo discoidale che di tipo planare
  type: main
- language: lv
  script: Latn
