    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu par svinu
    lodmetālos, ko izmanto dobas diskveida un plakanas matricas keramikas daudzslāņu
    kondensatoru ražošanai
  type: main
