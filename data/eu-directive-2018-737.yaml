    derogare pentru plumbul din aliajele de sudură pentru condensatoarele ceramice
    multistrat de formă discoidală sau plană, prelucrate prin străpungere
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2018/737 z 27. februára 2018, ktorou
