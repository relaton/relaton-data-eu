    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no que respeita
    a uma isenção aplicável ao chumbo em soldas para soldadura a condensadores
    cerâmicos multicamadas, de forma discoide ou em matriz plana, maquinados por
    orifício
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2018/737 a Comisiei din 27 februarie 2018 de modificare,
