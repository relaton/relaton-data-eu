title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 779/84 of 27 March 1984 determining the
    extent to which applications lodged in March 1984 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 779/84 de la Commission, du 27 mars 1984, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de mars 1984 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 779/84 der Kommission vom 27. März 1984 über den
    Umfang, in dem den im Monat März 1984 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 779/84 af 27. marts 1984 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i marts måned 1984, for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 779/84 της Επιτροπής
    της 27ης Μαρτίου 1984 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Μάρτιο του 1984, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 779/84 della Commissione, del 27 marzo 1984, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di marzo 1984 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 779/84 van de Commissie van 27 maart 1984 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand maart
    1984 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
