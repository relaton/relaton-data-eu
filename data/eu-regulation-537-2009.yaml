    certains produits agricoles obtenus selon le mode de production biologique doivent
    être originaires pour pouvoir être commercialisés dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 537/2009 der Kommission vom 19. Juni 2009 zur Änderung
