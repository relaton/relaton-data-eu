title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 537/2009 of 19 June 2009 amending Regulation
    (EC) No 1235/2008, as regards the list of third countries from which certain agricultural
    products obtained by organic production must originate to be marketed within the
    Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 537/2009 de la Commission du 19 juin 2009 modifiant
