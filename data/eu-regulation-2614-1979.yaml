- language: en
  script: Latn
  content: Council Regulation (EEC) No 2614/79 of 23 November 1979 increasing the
    Community tariff quota opened for 1979 by Regulations (EEC) No 2470/78 and (EEC)
    No 1738/79 for certain plywoods of coniferous species falling within heading No
    ex 44.15 of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2614/79 du Conseil, du 23 novembre 1979, portant augmentation
    du volume du contingent tarifaire communautaire ouvert, pour l' année 1979, par
    les règlements (CEE) n° 2470/78 et (CEE) n° 1738/79 pour certains bois contre-plaqués
    de conifères de la position ex 44.15 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2614/79 des Rates vom 23. November 1979 zur Aufstockung
    des durch die Verordnungen (EWG) Nr. 2470/78 und (EWG) Nr. 1738/79 für das Jahr
    1979 eröffneten Gemeinschaftszollkontingents für bestimmtes Sperrholz aus Nadelholz
    der Tarifnummer ex 44.15 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2614/79 af 23. november 1979 om forhøjelse
    af det ved forordning (EØF) nr. 2470/78 og (EØF) nr. 1738/79 åbnede fællesskabstoldkontingent
    for visse typer krydsfiner af nåletræ henhørende under pos. ex 44.15 i den
    fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2614/79 del Consiglio, del 23 novembre 1979, che aumenta
    il volume del contingente tariffario comunitario aperto per il 1979 dai regolamenti
    (CEE) n. 2470/78 e (CEE) n. 1738/79 per alcuni legni compensati di conifere della
    voce ex 44.15 della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2614/79 van de Raad van 23 november 1979 houdende
    verhoging van het communautaire tariefcontingent dat geopend is voor het jaar
    1979 bij de Verordeningen (EEG) nr. 2470/78 en (EEG) nr. 1738/79, voor bepaalde
    soorten duplex-, triplex- en multiplexhout, van naaldbomen, van post ex 44.15
    van het gemeenschappelijk douanetarief
