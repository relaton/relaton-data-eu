title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1027/78 of 19 May 1978 concerning the sale
    for export at prices fixed at a standard rate in advance of beef held by the intervention
    agencies and repealing Regulation (EEC) No 2320/74 and amending Regulations (EEC)
    No 1687/76 and (EEC) No 571/78
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1027/78 de la Commission, du 19 mai 1978, relatif
    à la vente à prix fixé forfaitairement à l' avance de viande bovine détenue
    par les organismes d' intervention et destinée à être exportée, abrogeant
    le règlement (CEE) n° 2320/74 et modifiant les règlements (CEE) n° 1687/76
    et (CEE) n° 571/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1027/78 der Kommission vom 19. Mai 1978 über den
    Verkauf für die Ausfuhr von im Besitz der Interventionsstellen befindlichem bestimmtem
    Rindfleisch zu pauschal im voraus festgesetzten Preisen, zur Aufhebung der Verordnung
    (EWG) Nr. 2320/74 und zur Änderung der Verordnungen (EWG) Nr. 1687/76 und (EWG)
    Nr. 571/78
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1027/78 af 19. maj 1978 om salg til
    forudfastsatte priser, med henblik på udførsel af oksekød, som interventionsorganerne
    ligger inde med, om ophævelse af forordning (EØF) nr. 2320/74 og om ændring
    af forordning (EØF) nr. 1687/76 og (EØF) nr. 571/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1027/78 della Commissione, del 19 maggio 1978, relativo
    alla vendita, ad un prezzo fissato forfettariamente in anticipo, di carni detenute
    dagli organismi d' intervento e destinate all' esportazione, e recante abrogazione
    del regolamento (CEE) n. 2320/74 nonché modifica dei regolamenti (CEE) n. 1687/76
    e (CEE) 571/78
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1027/78 van de Commissie van 19 mei 1978 betreffende
    de verkoop voor uitvoer van rundvlees uit interventievoorraden tegen vooraf forfaitair
    vastgestelde prijzen, tevens houdende intrekking van Verordening (EEG) nr. 2320/74
    en wijziging van de Verordeningen (EEG) nr. 1687/76 en (EEG) nr. 571/78
  type: main
