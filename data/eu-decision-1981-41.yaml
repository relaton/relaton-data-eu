title:
- language: en
  script: Latn
  content: '81/41/EEC: Commission Decision of 19 January 1981 authorizing Ireland
    not to apply Community treatment to men''s and boys''woven breeches, shorts and
    trousers (including slacks); women''s, girls''and infants''woven trousers and
    slacks originating in Hong Kong (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/41/CEE: Décision de la Commission, du 19 janvier 1981, autorisant
    l''Irlande à exclure du traitement communautaire les culottes, "shorts" et pantalons
    tissés pour hommes et garçonnets, et les pantalons tissés pour femmes, fillettes
    et jeunes enfants, originaires de Hong-kong (Le texte en langue anglaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/41/EWG: Entscheidung der Kommission vom 19. Januar 1981 zur Ermächtigung
    Irlands, aus Hongkong stammende Shorts und andere kurze Hosen und lange Hosen,
    aus Geweben für Männer und Knaben; lange Hosen aus Geweben für Frauen, Mädchen
    und Kleinkinder von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/41/EØF: Kommissionens beslutning af 19. januar 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    til mænd og drenge, vævede, lange benklæder til kvinder, piger og småbørn,
    vævede, med oprindelse i Hongkong (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/41/ΕΟΚ: Απόφαση τής Επιτροπής τής 19ης Ιανουαρίου
    1981 περί εξουσιοδοτήσεως τής Ιρλανδίας νά αποκλείσει
    από τήν κοινοτική μεταχείριση κυλότες, κοντά
    πανταλόνια, περισκελίδες, υφασμένα, γιά άνδρες
    καί παιδιά, περισκελίδες υφασμένες γιά γυναίκες,
    κορασίδες καί παιδιά, καταγόμενα από τό Χόνγκ
    Κόνγκ (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/41/CEE: Decisione della Commissione, del 19 gennaio 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i calzolcini, shorts e pantaloni,
    originari di Hong Kong (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/41/EEG: Beschikking van de Commissie van 19 januari 1981 houdende machtiging
    van Ierland om shorts en andere korte broeken, geweven, voor heren en jongens,
    en lange broeken, geweven, voor dames, meisjes en kinderen, van oorsprong uit
    Hong-Kong van de communautaire behandeling uit te sluiten (Slechts de tekst in
