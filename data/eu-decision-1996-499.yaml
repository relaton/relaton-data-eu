type: standard
title:
- language: en
  script: Latn
  content: '96/499/EC: Commission Decision of 19 July 1996 amending Decision 95/357/EC
    drawing up a list of border inspection posts agreed for veterinary checks on products
    and animals from third countries, detailed rules concerning the checks to be carried
    out by the veterinary experts of the Commission and repealing Decision 94/24/EC'
  type: main
- language: fr
  script: Latn
  content: '96/499/CE: Décision de la Commission du 19 juillet 1996 modifiant la
    décision 95/357/CE établissant une liste des postes d''inspection frontaliers
    agréés pour les contrôles vétérinaires sur les produits et animaux en provenance
    des pays tiers, définissant les modalités des contrôles à effectuer par les
    experts vétérinaires de la Commission et abrogeant la décision 94/24/CE'
  type: main
- language: de
  script: Latn
  content: '96/499/EG: Entscheidung der Kommission vom 19. Juli 1996 zur Änderung
    der Entscheidung 95/357/EG zur Festlegung eines Verzeichnisses der für die Veterinärkontrollen
    von Erzeugnissen und Tieren aus Drittländern zugelassenen Grenzkontrollstellen,
    zur Festlegung genauer Bestimmungen über die von den tierärztlichen Sachverständigen
    der Kommission durchzuführenden Kontrollen sowie zur Aufhebung der Entscheidung
    94/24/EG'
  type: main
- language: da
  script: Latn
  content: '96/499/EF: Kommissionens beslutning af 19. juli 1996 om ændring af beslutning
    95/357/EF om en liste over grænsekontrolsteder, der er godkendt til at føre
    veterinærkontrol med produkter og dyr fra tredjelande, om nærmere regler for
    den kontrol, som Kommissionens veterinærsagkyndige skal føre, og om ophævelse
    af beslutning 94/24/EF'
  type: main
- language: el
  script: Grek
  content: '96/499/ΕΚ: Απόφαση της Επιτροπής της 19ης Ιουλίου
    1996 περί τροποποιήσεως της απόφασης 95/357/ΕΚ για
    κατάρτιση καταλόγου μεθοριακών σταθμών επιθεώρησης
    που είναι εγκεκριμένοι για τη διενέργεια κτηνιατρικών
    ελέγχων σε προϊόντα και ζώα από τρίτες χώρες,
    για καθορισμό λεπτομερών κανόνων όσον αφορά
    τους ελέγχους που πρέπει να διενεργούνται
    από τους εμπειρογνώμονες κτηνιάτρους της Επιτροπής,
    και για ακύρωση της απόφασης 94/24/ΕΚ'
  type: main
- language: fi
  script: Latn
  content: '96/499/EY: Komission päätös, tehty 19 päivänä heinäkuuta 1996,
    kolmansista maista tuotavien tuotteiden ja eläinten eläinlääkäritarkastuksia
    varten hyväksyttyjen rajatarkastusasemien luettelosta, komission eläinlääkintäasiantuntijoiden
    suorittamia tarkastuksia koskevista yksityiskohtaisista säännöistä ja päätöksen
    94/24/EY kumoamisesta tehdyn päätöksen 95/357/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '96/499/CE: Decisione della Commissione del 19 luglio 1996 recante modifica
    della decisione 95/357/CE che stabilisce l''elenco dei posti di ispezione frontalieri
    riconosciuti ai fini dei controlli veterinari sui prodotti e sugli animali provenienti
    dai paesi terzi, che definisce le modalità d''applicazione dei controlli che
    debbono essere effettuati dagli esperti veterinari della Commissione e che abroga
    la decisione 94/24/CE'
  type: main
- language: nl
  script: Latn
  content: '96/499/EG: Beschikking van de Commissie van 19 juli 1996 houdende wijziging
    van Beschikking 95/357/EG tot vaststelling van de lijst van inspectieposten aan
    de grens die zijn erkend voor de veterinaire controles van produkten en dieren
    uit derde landen, tot vaststelling van uitvoeringsbepalingen inzake de door de
    veterinaire deskundigen van de Commissie te verrichten controles en tot intrekking
    van Beschikking 94/24/EG'
  type: main
- language: pt
  script: Latn
  content: '96/499/CE: Decisão da Comissão de 19 de Julho de 1996 que altera a Decisão
    95/357/CE que estabelece uma lista de postos de inspecção fronteiriços aprovados
    para a realização de controlos veterinários de produtos e animais provenientes
    de países terceiros e as regras de execução dos controlos a efectuar pelos
    peritos veterinários da Comissão e que revoga a Decisão 94/24/CE'
  type: main
- language: es
  script: Latn
  content: '96/499/CE: Decisión de la Comisión de 19 de julio de 1996 que modifica
    la Decisión 95/357/CE por la que se establece una lista de puestos de inspección
    fronterizos autorizados para efectuar los controles veterinarios de los productos
    y animales de terceros países, así como disposiciones específicas referentes
    a los controles que deben llevar a cabo los expertos veterinarios de la Comisión,
    y por la que se deroga la Decisión 94/24/CE'
  type: main
- language: sv
  script: Latn
  content: '96/499/EG: Kommissionens beslut av den 19 juli 1996 om ändring av beslut
    95/357/EG om upprättande av en förteckning över gränskontrollstationer för
    veterinärbesiktning av produkter och djur från tredje land och om närmare föreskrifter
    för de inspektioner som kommissionens veterinärexperter skall utföra samt om
    upphävande av beslut 94/24/EG'
  type: main
