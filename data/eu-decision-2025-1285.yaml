title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/1285 of 20 June 2025 on the position to be taken
    on behalf of the European Union within the International Maritime Organization’s
    Maritime Safety Committee at its 110th session as regards the adoption of amendments
    to the International Convention for the Safety of Life at Sea (SOLAS), 1974, the
    1994 International Code of Safety for High-Speed Craft (1994 HSC Code) and the
    2000 International Code of Safety for High-Speed Craft (2000 HSC Code)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1285 du Conseil du 20 juin 2025 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité de la sécurité
    maritime de l’Organisation maritime internationale, lors de sa 110e session,
    en ce qui concerne l’adoption d’amendements à la convention internationale
    de 1974 pour la sauvegarde de la vie humaine en mer (SOLAS), au recueil international
    de règles de sécurité applicables aux engins à grande vitesse de 1994 (recueil
    HSC de 1994) et au recueil international de règles de sécurité applicables
    aux engins à grande vitesse de 2000 (recueil HSC de 2000)
  type: main
- language: de
  script: Latn
