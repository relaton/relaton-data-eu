    Seeschifffahrtsorganisation in Bezug auf die Annahme von Änderungen des Internationalen
    Übereinkommens zum Schutz des menschlichen Lebens auf See (SOLAS) von 1974, des
    Internationalen Codes für die Sicherheit von Hochgeschwindigkeitsfahrzeugen von
    1994 (HSC-Code 1994) und des Internationalen Codes für die Sicherheit von Hochgeschwindigkeitsfahrzeugen
    von 2000 (HSC-Code 2000) zu vertretenden Standpunkt
  type: main
