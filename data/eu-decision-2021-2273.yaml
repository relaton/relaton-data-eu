id: EUDecision20212273
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/2273 of 20 December 2021 amending
    Implementing Decision (EU) 2019/1956 as regards harmonised standards for laser
    products, adjustable speed electrical power drive systems, power electronic converter
    systems and equipment, luminaires, low-voltage switchgear and control gear, uninterruptible
    power systems (UPS) and certain other electrical equipment designed for use within
    certain voltage limits
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/2273 de la Commission du 20 décembre
    2021 modifiant la décision d’exécution (UE) 2019/1956 en ce qui concerne les
    normes harmonisées applicables aux appareils à laser, aux entraînements électriques
    de puissance à vitesse variable, aux systèmes et matériels électroniques de
    conversion de puissance, aux luminaires, à l’appareillage à basse tension,
    aux alimentations sans interruption (ASI) et à certains autres matériels électriques
    destinés à être employés dans certaines limites de tension
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/2273 der Kommission vom 20. Dezember
    2021 zur Änderung des Durchführungsbeschlusses (EU) 2019/1956 hinsichtlich harmonisierter
    Normen für Lasereinrichtungen, elektrische Leistungsantriebssysteme mit einstellbarer
    Drehzahl, Leistungshalbleiter-Umrichtersysteme und -betriebsmittel, Leuchten,
    Niederspannungsschaltgeräte, unterbrechungsfreie Stromversorgungssysteme (USV)
    und bestimmte andere elektrische Betriebsmittel zur Verwendung innerhalb bestimmter
    Spannungsgrenzen
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2021/2273 на Комисията
    от 20 декември 2021 година за изменение на Решение
    за изпълнение (ЕС) 2019/1956 по отношение на хармонизираните
    стандарти за лазерни съоръжения, електрозадвижващи
    системи с регулиране на честотата на въртене,
    силови електронни преобразувателни системи
    и съоръжения, осветители, комутационни апарати
    за ниско напрежение, непрекъсваеми захранващи
    системи (UPS), както и някои други електрически
    съоръжения, предназначени за използване в
    определени граници на напрежението
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/2273 ze dne 20. prosince 2021,
    kterým se mění prováděcí rozhodnutí (EU) 2019/1956, pokud jde o harmonizované
    normy pro laserová zařízení, systémy elektrického pohonu s nastavitelnou
    rychlostí, systémy a zařízení výkonových elektronických měničů, svítidla,
    spínací a řídicí přístroje nízkého napětí, zdroje nepřerušovaného
    napájení (UPS) a určitá jiná elektrická zařízení určená pro používání
    v určitých mezích napětí
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/2273 af 20. december
    2021 om ændring af gennemførelsesafgørelse (EU) 2019/1956 for så vidt angår
    harmoniserede standarder for laserprodukter, elektriske motordrev med variabel
    hastighed, effektelektroniske konvertersystemer og -udstyr, belysningsarmaturer,
    koblingsudstyr til lavspænding, UPS-anlæg og visse andre typer af elektrisk
    materiel bestemt til anvendelse inden for visse spændingsgrænser
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (EE) 2021/2273 της Επιτροπής
    της 20ης Δεκεμβρίου 2021 για την τροποποίηση της
    εκτελεστικής απόφασης (ΕΕ) 2019/1956 όσον αφορά
    τα εναρμονισμένα πρότυπα για τα προϊόντα λέιζερ,
    τα ηλεκτρικά συστήματα οδήγησης μετατροπής
    ισχύος ρυθμιζόμενης ταχύτητας, τα ηλεκτρονικά
    συστήματα και εξοπλισμό μετατροπής ισχύος,
    τα φωτιστικά σώματα, τις διατάξεις διακοπής
    και ελέγχου χαμηλής τάσης, τα συστήματα αδιάλειπτης
    παροχής ισχύος (UPS) και άλλο ηλεκτρολογικό υλικό
    που προορίζεται να χρησιμοποιηθεί εντός ορισμένων
    ορίων τάσης
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/2273, 20. detsember 2021, millega muudetakse
    rakendusotsust (EL) 2019/1956 seoses harmoneeritud standarditega, mis käsitlevad
    lasertooteid, reguleeritava kiirusega elektriajamisüsteeme, jõupooljuht-muundussüsteeme
    ja -muundusseadmeid, valgusteid, madalpingelisi lülitusaparaate, katkematu toite
    süsteeme ja teatavaid muid elektriseadmeid, mis on ette nähtud kasutamiseks
    teatavates pingevahemikes
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/2273, annettu 20 päivänä
    joulukuuta 2021, täytäntöönpanopäätöksen (EU) 2019/1956 muuttamisesta siltä
    osin kuin on kyse yhdenmukaistetuista standardeista, jotka koskevat laserlaitteita,
    nopeussäädettyjä sähkökäyttöjä, tehoelektronisia muuttajia ja muuttajajärjestelmiä,
    valaisimia, pienjännitekytkinlaitteita, keskeytymättömän tehonsyötön järjestelmiä
    (UPS) sekä tiettyjä muita tietyllä jännitealueella toimivia sähkölaitteita
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2021/2273 ón gCoimisiún an 20 Nollaig
    2021 lena leasaítear Cinneadh Cur Chun Feidhme (AE) 2019/1956 a mhéid a bhaineann
    le caighdeáin chomhchuibhithe maidir le táirgí léasair, córais tiomána cumhachta
    leictrí le luas inchoigeartaithe, córais tiontairí leictreonacha cumhachta,
    fearais solais, lascghiar agus giar rialaithe ísealvoltais, córais chumhachta
    dhobhriste (UPS) agus trealamh áirithe eile leictreach a dheartar lena úsáid
    laistigh de theorainneacha áirithe voltais
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/2273 оd 20. prosinca 2021. o izmjeni
    Provedbene odluke (EU) 2019/1956 s obzirom na usklađene norme za laserske proizvode,
    elektromotorne sustave prilagodljive brzine, sustave elektroničkih energetskih
    pretvarača i opreme, svjetiljke, niskonaponsku sklopnu aparaturu, energetske
    sustave neprekidnog napajanja (UPS) i određenu ostalu električnu opremu namijenjenu
    za uporabu unutar određenih naponskih granica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/2273 végrehajtási határozata (2021. december
    20.) az (EU) 2019/1956 végrehajtási határozatnak a lézertermékekre, a szabályozható
    fordulatszámú villamos hajtásrendszerekre, az erősáramú elektronikai átalakító
    rendszerekre és berendezésekre, a lámpatestekre, a kisfeszültségű kapcsoló-
    és vezérlőkészülékekre, a szünetmentes energiaellátó rendszerekre (UPS),
    valamint egyes más, meghatározott feszültséghatáron belüli használatra
    tervezett elektromos berendezésekre vonatkozó harmonizált szabványok tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/2273 della Commissione del 20 dicembre
    2021 che modifica la decisione di esecuzione (UE) 2019/1956 per quanto riguarda
    le norme armonizzate per prodotti laser, azionamenti elettrici a velocità variabile,
    convertitori elettronici di potenza, apparecchi di illuminazione, apparecchiature
    a bassa tensione, sistemi statici di continuità (UPS) e determinato altro materiale
    elettrico destinato a essere adoperato entro taluni limiti di tensione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/2273 (2021. gada 20. decembris),
    ar ko Īstenošanas lēmumu (ES) 2019/1956 groza attiecībā uz saskaņotajiem
    standartiem par lāzeriekārtām, elektropiedziņas sistēmām ar maināmu rotācijas
    ātrumu, elektronisko enerģijas pārveidotāju sistēmām un iekārtām, gaismekļiem,
    zemsprieguma komutācijas un vadības ierīcēm, nepārtrauktās elektroapgādes
    sistēmām (UPS) un dažām citām elektroiekārtām, kas paredzētas lietošanai
    noteiktās sprieguma robežās
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/2273 2021 m. gruodžio 20
    d. kuriuo dėl lazerinių gaminių, reguliuojamojo greičio elektrinių galios
    pavarų sistemų, elektroninių galios keitiklių sistemų ir įrangos, šviestuvų,
    žemos įtampos perjungimo įrenginių ir valdymo įrenginių, nepertraukiamojo
    maitinimo sistemų (NMS) ir tam tikrų kitų tam tikrose įtampos ribose skirtų
    naudoti elektros įrenginių darniųjų standartų iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2019/1956
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/2273 tal-20
    ta’ Diċembru 2021 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2019/1956
    fir-rigward tal-istandards armonizzati għall-prodotti bil-lejżer, għas-sistemi
    ta’ enerġija elettrika b’veloċità varjabbli, għas-sistemi u t-tagħmir
    ta’ konvertituri tal-enerġija, għal-luminarji, għall-kommutaturi u t-tagħmir
    ta’ kontroll ta’ vultaġġ baxx, għas-sistemi tal-enerġija mingħajr interruzzjoni
    (UPS) u għal ċertu tagħmir elettriku ieħor iddisinjat għall-użu fi ħdan
    ċerti limiti tal-vultaġġ
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/2273 van de Commissie van 20 december 2021
    tot wijziging van Uitvoeringsbesluit (EU) 2019/1956 wat betreft geharmoniseerde
    normen voor laserproducten, regelbare elektrische aandrijfsystemen, elektronische
    vermogensomzetsystemen en -apparatuur, verlichtingsarmaturen, laagspanningsschakel-
    en verdeelinrichtingen, niet-onderbreekbare voedingen (UPS) en ander elektrisch
    materiaal bestemd voor gebruik binnen bepaalde spanningsgrenzen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/2273 z dnia 20 grudnia 2021 r. zmieniająca
    decyzję wykonawczą (UE) 2019/1956 w odniesieniu do norm zharmonizowanych dotyczących
    urządzeń laserowych, elektrycznych układów napędowych mocy o regulowanej
    prędkości, systemów zasilania i urządzeń z przekształtnikami półprzewodnikowymi,
    opraw oświetleniowych, aparatury rozdzielczej i sterowniczej niskonapięciowej,
    systemów bezprzerwowego zasilania (UPS) oraz niektórych innych urządzeń elektrycznych
    przewidzianych do stosowania w określonych granicach napięcia
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/2273 da Comissão de 20 de dezembro de
    2021 que altera a Decisão de Execução (UE) 2019/1956 no que diz respeito às
    normas harmonizadas para equipamentos laser, sistemas de acionamento elétrico
    de potência a velocidade variável, sistemas e equipamento de conversão eletrónica
    de potência, luminárias, aparelhagem de baixa tensão, sistemas de alimentação
    sem interrupção (UPS) e outro material elétrico destinado a ser utilizado dentro
    de certos limites de tensão
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/2273 a Comisiei din 20 decembrie
    2021 de modificare a Deciziei de punere în aplicare (UE) 2019/1956 în ceea ce
    privește standardele armonizate pentru produsele laser, acționările electrice
    de putere cu viteză variabilă, sistemele și echipamentele electronice de conversie
    a puterii, corpurile de iluminat, întrerupătoarele pentru tensiune scăzută
    și tablourile electrice, sistemele de alimentare neîntreruptibilă (UPS) și
    anumite alte echipamente electrice proiectate pentru a fi utilizate în cadrul
    anumitor limite de tensiune
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/2273 z 20. decembra 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/1956, pokiaľ ide o harmonizované
    normy pre laserové zariadenia, systémy elektrických výkonových pohonov s
    nastaviteľnou rýchlosťou, výkonové systémy polovodičových meničov, svietidlá,
    nízkonapäťové spínacie a riadiace zariadenia, systémy neprerušovaného
    napájania (UPS) a niektoré ďalšie elektrické zariadenia určené na používanie
    v rámci určitých limitov napätia
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/2273 z dne 20. decembra 2021 o spremembi
    Izvedbenega sklepa (EU) 2019/1956 glede harmoniziranih standardov za laserske
    izdelke, električne pogonske sisteme z regulacijo hitrosti, močnostno elektroniko
    pretvorniških sistemov in opremo, svetilke, nizkonapetostna stikala in krmilne
    naprave, sisteme z neprekinjenim napajanjem in nekatero drugo električno opremo,
    zasnovano za uporabo znotraj določenih napetostnih mej
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/2273 de la Comisión de 20 de diciembre
    de 2021 por la que se modifica la Decisión de Ejecución (UE) 2019/1956 en lo
    que respecta a las normas armonizadas aplicables a productos láser, accionamientos
    eléctricos de potencia de velocidad variable, sistemas y equipos de conversión
    de potencia de semiconductores, luminarias, aparamenta de baja tensión, sistemas
    de alimentación ininterrumpida (SAI) y otro material eléctrico destinado a utilizarse
    con determinados límites de tensión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2021/2273 av den 20 december 2021
    om ändring av genomförandebeslut (EU) 2019/1956 vad gäller harmoniserade standarder
    för laserprodukter, varvtalsstyrda elektriska drivsystem, utrustning och system
    med halvledarströmriktare, ljusarmatur, kopplingsapparater för högst 1000 V,
    utrustning för avbrottsfri elförsörjning (UPS) samt viss annan elektrisk utrustning
    avsedd för användning inom vissa spänningsgränser
  type: main
