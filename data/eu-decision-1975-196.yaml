---
id: EUDecision1975196
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 25 February 1975 authorizing the French Republic
    not to apply Community treatment to tableware and other articles of a kind commonly
    used for domestic or toilet purposes, of porcelain or other kinds of pottery,
    other than common pottery and stoneware, falling within headings No 69.11 and
    69.12 C and D of the Common Customs Tariff, originating in Japan, and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/196/CEE: Décision de la Commission, du 25 février 1975, autorisant
    la République française à exclure du traitement communautaire la vaisselle
    et les articles de ménage ou de toilette en porcelaine ou en matières céramiques
    autres que la terre commune ou le grès, des position 69.11 et sous-positions
    69.12 C et D du Tarif douanier commun, originaires du Japon et mis en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 25. Februar 1975, mit der die Französische
    Republik ermächtigt wird, aus Japan stammendes und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliches Geschirr sowie Haushalts- und Toilettengegenstände,
    aus Porzellan oder aus anderen keramischen Stoffen als aus gewöhnlichem Ton oder
    aus Steinzeug, der Tarifnummern 69.11 und 69.12 C und D des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 25. februar 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage bordservice samt husholdnings
    og toiletartikler, af porcelæn og af andet keramisk materiale (dog ikke af almindeligt
    ler og stentøj), som henhører under position 69.11 og 69.12 C og D i den fælles
    toldtarif, har oprindelse i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 25 febbraio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il vasellame e gli oggetti di
    uso domestico o da toeletta di porcellana o di materie ceramiche diverse da quelle
    di terracotta o di gres, della voce 69.11 e delle sottovoci 69.12 C e D della
    tariffa doganale comune, originari del Giappone, e messi in libera pratica negli
    altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 25 februari 1975 waarbij de Franse Republiek
    wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen, van porselein
    of van andere keramische stoffen dan van gewoon aardewerk of van gres, van posten
    69.11 en 69.12 C en D van het gemeenschappelijk douanetarief, van oorsprong uit
    Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
