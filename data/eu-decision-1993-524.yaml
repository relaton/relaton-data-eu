    Italiens für die vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft
    (EAGFL), Abteilung Garantie, im Haushaltsjahr 1989 finanzierten Ausgaben (Nur
    der italienische und der spanische Text sind verbindlich)'
  type: main
- language: da
