title:
- language: en
  script: Latn
  content: '93/524/EEC: Commission Decision of 27 September 1993 amending Decision
    92/491/EEC on the clearance of the accounts presented by Spain and Italy in respect
    of the expenditure for 1989 of the EAGGF, Guarantee Section (Only the Spanish
    and Italian texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/524/CEE: Décision de la Commission du 27 septembre 1993 modifiant
