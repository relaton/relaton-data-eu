type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 May 1974 authorizing the Federal Republic of
    Germany not to apply Community treatment to woven fabrics of synthetic textile
    fabrics falling within CCT heading No 56.07 A, originating in Taiwan, and in free
    circulation in the Netherlands
  type: main
- language: fr
  script: Latn
  content: Décision 74/273/CEE de la Commission, du 21 mai 1974, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les tissus de fibres
    textiles synthétiques discontinues, de la position 56.07 A du Tarif douanier
    commun, originaires de Taiwan et mis en libre pratique aux Pays-Bas
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Mai 1974, mit der die Bundesrepublik
    Deutschland ermächtigt wird, aus Taiwan stammende und in den Niederlanden im
    freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern der Tarifnummer
    56.07 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. maj 1974 om bemyndigelse for forbundsrepublikken
    Tyskland til fra fællesskabsbehandling at undtage vævet stof af syntetiske fibre,
    som henhører under position 56.07 A i den fælles toldtarif, har oprindelse i
    Taiwan og frit kan omsættes i Nederlandene
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 maggio 1974, che autorizza la Repubblica
    federale di Germania ad escludere dal trattamento comunitario i tessuti di fibre
    tessili sintetiche, della voce n. 56.07 A della tariffa doganale comune, originari
    di Taiwan e messi in libera pratica nei Paesi Bassi
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 mei 1974 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd weefsels van synthetische vezels van post 56.07 A van
    het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in Nederland in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
