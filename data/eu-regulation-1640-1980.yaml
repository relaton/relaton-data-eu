title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1640/80 of 24 June 1980 concerning the application
    of Decision No 3/80 of the ACP-EEC Council of Ministers derogating from the concept
    of originating products to take account of the special situation of Malawi and
    Kenya with regard to certain items of fishing tackle (fishing flies)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1640/80 du Conseil, du 24 juin 1980, concernant l'
    application de la décision n° 3/80 du Conseil des ministres ACP-CEE portant
    dérogation à la définition de la notion de produits originaires, pour tenir
    compte de la situation particulière du Malawi et du Kenya, en ce qui concerne
    certains articles de pêche (mouches pour la pêche)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1640/80 des Rates vom 24. Juni 1980 zur Durchführung
    des Beschlusses Nr. 3/80 des AKP-EWG-Ministerrates über die Abweichung von der
    Bestimmung des Begriffs ,,Ursprungswaren' ' , um der besonderen Lage Malawis und
    Kenias in bezug auf bestimmte Angelgeräte (künstliche Fliegen zum Flugangeln)
    Rechnung zu tragen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1640/80 af 24. juni 1980 om gennemførelse
    nr. 3/80 truffet af AVS/EØF-Ministerrådet om undtagelse fra definitionen af
    begrebet "varer med oprindelsestatus" for at tage hensyn til den særlige situation
    i Malawi og Kenya for så vidt angår visse typer fiskegrej (fluer til fiskeri)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1640/80 del Consiglio, del 24 giugno 1980, relativo
    all' applicazione della decisione n. 3/80 del Consiglio dei ministri ACP-CEE,
    che deroga alla definizione della nozione di prodotti originari per tener conto
    della situazione particolare del Malawi e del Kenia per quanto concerne taluni
    articoli da pesca (Mosche per la pesca)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1640/80 van de Raad van 24 juni 1980 betreffende
    de toepassing van Besluit nr. 3/80 van de ACS - EEG-Raad van Ministers houdende
    afwijking van de definitie van het begrip ,,produkten van oorsprong' ' in verband
    met de bijzondere situatie van Malawi en Kenia voor wat betreft bepaalde visserijartikelen
    (kunstvliegen voor de visserij)
