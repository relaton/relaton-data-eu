title:
- language: en
  script: Latn
  content: '90/556/EEC: Commission Decision of 31 October 1990 making an initial allocation
    to France of part of the resources to be charged to the 1991 budget year for the
    supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '90/556/CEE: Décision de la Commission du 31 octobre 1990 allouant à
    la France une première tranche des ressources imputables à l''exercice 1991
    pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 31. Oktober 1990 ueber die anfaengliche
    Bewilligung eines Teils der im Haushaltsjahr 1991 fuer die zur Verfuegungstellung
    von Nahrungsmitteln aus Interventionsbestaenden an bezeichnete Organisationen
    zur Verteilung an beduerftige Personen in der Gemeinschaft zu verbuchenden Mittel
    fuer Frankreich (90/556/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 31. oktober 1990 om en foerste tildeling til
    Frankrig af en del af de midler, der skal opfoeres paa 1991-budgettet for levering
    af levnedsmidler fra interventionslagre til naermere bestemte organisationer med
    henblik paa uddeling til de socialt daarligst stillede personer i Faellesskabet
    (90/556/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/556/ΕΟΚ: Απόφαση της Επιτροπής της 31ης
    Οκτωβρίου 1990 για τη χορήγηση στη Γαλλία μιας
    πρώτης μερίδας πόρων που καταλογίζονται στο
    οικονομικό έτος 1991 για την προμήθεια τροφίμων
    που προέρχονται από τα αποθέματα της παρέμβασης
    στους οργανισμούς που έχουν οριστεί για να
    τα διανείμουν στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 31 ottobre 1990 concernente un primo stanziamento
    alla Francia di parte delle risorse da imputare all'anno di bilancio 1991 per
    la fornitura a talune organizzazioni di derrate alimentari provenienti dalle scorte
    d'intervento e destinate ad essere distribuite agli indigenti nella Comunità
    (90/556/CEE)
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 31 oktober 1990 houdende een eerste toewijzing
    aan Frankrijk van een deel van voor het begrotingsjaar 1991 te boeken financiële
    middelen voor de levering van voedsel uit interventievoorraden aan organisaties
    die zijn aangewezen voor de verstrekking ervan aan behoeftigen in de Gemeenschap
    (90/556/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 31 de Outubro de 1990 relativa à afectaçao inicial
    à França de parte dos recursos a imputar ao exercicio orçamental de 1991 para
    o fornecimento de alimentos provenientes de existências de intervençao às organizaçoes
    designadas para distribuiçao às pessoas mais necessitadas na Comunidade (90/556/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 31 de octubre de 1990 por la que se adjudica
    inicialmente a Francia parte de los recursos con cargo al presupuesto del ejercicio
    1991 destinados al suministro de alimentos procedentes de las existencias de intervencion
    a determinadas organizaciones para su distribucion entre las personas mas necesitadas
    de la Comunidad (90/556/CEE)
  type: main
