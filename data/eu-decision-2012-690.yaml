title:
- language: en
  script: Latn
  content: '2012/690/EU: Commission Implementing Decision of 6 November 2012 amending
    Decision 2010/381/EU on emergency measures applicable to consignments of aquaculture
    products imported from India and intended for human consumption and repealing
    Decision 2010/220/EU on emergency measures applicable to consignments of farmed
    fishery products imported from Indonesia and intended for human consumption (notified
    under document C(2012) 7637)'
  type: main
- language: fr
  script: Latn
  content: '2012/690/UE: Décision d’exécution de la Commission du 6 novembre 2012
    modifiant la décision 2010/381/UE relative à des mesures d’urgence applicables
    aux lots de produits de l’aquaculture importés d’Inde et destinés à la
    consommation humaine et abrogeant la décision 2010/220/UE sur les mesures d’urgence
    applicables aux lots de produits de la pêche issus de l’aquaculture, importés
    d’Indonésie et destinés à la consommation humaine [notifiée sous le numéro
    C(2012) 7637]'
  type: main
- language: de
  script: Latn
  content: '2012/690/EU: Durchführungsbeschluss der Kommission vom 6. November 2012
    zur Änderung des Beschlusses 2010/381/EU über Sofortmaßnahmen für aus Indien
    eingeführte Sendungen mit zum menschlichen Verkehr bestimmten Aquakulturerzeugnissen
    und zur Aufhebung des Beschlusses 2010/220/EU über Sofortmaßnahmen für aus
    Indonesien eingeführte Sendungen mit zum menschlichen Verzehr bestimmten Zuchtfischereierzeugnissen
    (Bekanntgegeben unter Aktenzeichen C(2012) 7637)'
  type: main
- language: bg
  script: Cyrl
  content: '2012/690/ЕС: Решение за изпълнение на Комисията
