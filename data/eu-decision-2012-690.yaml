    пратки с продукти от аквакултури, внесени от
    Индия и предназначени за консумация от човека,
    и за отмяна на Решение 2010/220/ЕС относно спешните
    мерки, приложими към пратки с продукти от аквакултури,
    внесени от Индонезия и предназначени за консумация
    от човека (нотифицирано под номер C(2012) 7637)'
  type: main
- language: cs
  script: Latn
