title:
- language: en
  script: Latn
  content: '90/409/EEC: Council Decision of 27 July 1990 on the conclusion of the
    Agreement in the form of an exchange of letters on the provisional application
    of the Protocol establishing, for the period from 3 May 1990 to 2 May 1992, the
    fishing opportunities and financial compensation provided for in the Agreement
    between the European Economic Community and the Government of the People''s Republic
    of Angola on fishing off Angola'
  type: main
- language: fr
  script: Latn
  content: '90/409/CEE: Décision du Conseil du 27 juillet 1990 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la participation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République populaire d''Angola sur la pêche au large de l''Angola, pour
    la période du 3 mai 1990 au 2 mai 1992'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 27. Juli 1990 ueber den Abschluss des Abkommens
    in Form eines Briefwechsels ueber die vorlaeufige Anwendung des Protokolls zur
    Festlegung der Fangmoeglichkeiten und des finanziellen Ausgleichs nach dem Abkommen
    zwischen der Europaeischen Wirtschaftsgemeinschaft und der Regierung der Volksrepublik
    Angola ueber die Fischerei vor der Kueste Angolas fuer die Zeit vom 3. Mai 1990
    bis zum 2. Mai 1992 (90/409/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 27. juli 1990 om indgaaelse af aftalen i form af
    brevveksling om midlertidig anvendelse af protokollen om fastsaettelse af de fiskerimuligheder
    og den finansielle godtgoerelse, der er omhandlet i aftalen mellem Det Europaeiske
    OEkonomiske Faellesskab og regeringen for Folkerepublikken Angola om fiskeri ud
    for Angola, for perioden 3. maj 1990 til 2. maj 1992 (90/409/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/409/ΕΟΚ: Απόφαση του Συμβουλίου της 27ης
    Ιουλίου 1990 για τη σύναψη συμφωνίας υπό μορφή
    ανταλλαγής επιστολών, σχετικά με την προσωρινή
    εφαρμογή του πρωτοκόλλου που καθορίζει τις
    αλιευτικές δυνατότητες και τη χρηματική συμμετοχή
    που προβλέπονται στη συμφωνία μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της κυβέρνησης
    της Λαϊκής Δημοκρατίας της Αγκόλα όσον αφορά
    την αλιεία στα ανοικτά της Αγκόλα, για την περίοδο
    από 3 Μαΐου 1990 έως 2 Μαΐου 1992'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 27 luglio 1990 concernente la conclusione dell'accordo
    in forma di scambio di lettere sull'applicazione provvisoria del protocollo che
    fissa le possibilità di pesca e la compensazione finanziaria previste nell'accordo
    tra la Comunità economica europea ed il governo della Repubblica popolare dell'Angola
    sulla pesca al largo dell'Angola, per il periodo dal 3 maggio 1990 al 2 maggio
    1992 (90/409/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE RAAD van 27 juli 1990 betreffende de sluiting van de Overeenkomst
    in de vorm van een briefwisseling inzake de voorlopige toepassing van het Protocol
    tot vaststelling van de voor de periode van 3 mei 1990 tot en met 2 mei 1992 geldende
    vangstmogelijkheden en de financiële compensatie, als bedoeld in de Overeenkomst
    tussen de Europese Economische Gemeenschap en de Regering van de Volksrepubliek
    Angola inzake de visserij voor de kust van Angola (90/409/EEG)
  type: main
- language: pt
  script: Latn
