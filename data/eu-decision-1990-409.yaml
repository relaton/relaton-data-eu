    2 de mayo de 1992 las posibilidades de pesca y la participacion financiera previstas
    en el Acuerdo entre la Comunidad Economica Europea y el Gobierno de la Republica
    Popular de Angola sobre la pesca frente a las costas de Angola (90/409/CEE)
