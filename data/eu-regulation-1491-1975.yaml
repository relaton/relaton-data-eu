title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1491/75 of the Commission of 11 June 1975 re-establishing
    the levying of customs duties on sheep- and lamb-skin leather, falling within
    subheading 41.03 B II, originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1491/75 de la Commission, du 11 juin 1975, portant
    rétablissement des droits de douane applicables aux peaux d'ovins, préparées,
    de la sous- position tarifaire 41.03 B II, originaires de l'Inde, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1491/75 der Kommission vom 11. Juni 1975 zur Wiedereinführung
    des Zollsatzes für Schaf- und Lammleder der Tarifstelle 41.03 B II, mit Ursprung
    in Indien, dem die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember
    1974 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1491/75 af 11. juni 1975 om genindførelse
    af opkrævning af toldafgifter for læder af fåre- og lammeskind, under underposition
    41.03 B II, som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1491/75 della Commissione, dell'11 giugno 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle pelli ovine della
    sottovoce doganale 41.03 B II, originarie dell'India, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre
    1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1491/75 van de Commissie van 11 juni 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op schapeleder,
    voorgelooid, van onderverdeling 41.03 B II, van oorsprong uit India, ten behoeve
    waarvan bij Verordening (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene
    tariefpreferenties werden geopend
  type: main
