title:
- language: en
  script: Latn
  content: '93/397/EEC: Commission Decision of 14 July 1993 amending for the fourth
    time Decision 93/242/EEC of 30 April 1993 concerning the importation into the
    Community of certain live animals and their products originating in certain European
    countries in relation to foot-and-mouth disease'
  type: main
- language: fr
  script: Latn
  content: '93/397/CEE: Décision de la Commission du 14 juillet 1993 modifiant pour
    la quatrième fois la décision 93/242/CEE concernant l''importation dans la Communauté
    de certains animaux vivants et de leurs produits originaires de certains pays
    d''Europe, en cas de fièvre aphteuse'
  type: main
- language: de
  script: Latn
  content: '93/397/EWG: ENTSCHEIDUNG DER KOMMISSION vom 14. Juli 1993 zur vierten
    Änderung der Entscheidung 93/242/EWG über die Einfuhr bestimmter lebender Tiere
    und ihrer Erzeugnisse aus bestimmten europäischen Ländern in die Gemeinschaft
    im Zusammenhang mit der Maul- und Klauenseuche'
  type: main
- language: da
  script: Latn
  content: '93/397/EØF: KOMMISSIONENS BESLUTNING af 14. juli 1993 om fjerde ændring
    af beslutning 93/242/EØF om indførsel til Fællesskabet af visse levende dyr
    og produkter heraf med oprindelse i visse europæiske lande på baggrund af mund-
    og klovesygesituationen'
  type: main
- language: el
  script: Grek
  content: '93/397/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 14ης
    Ιουλίου 1993 για την τέταρτη τροποποίηση της
    απόφασης 93/242/ΕΟΚ για την εισαγωγή στην Κοινότητα
    ορισμένων ζώντων ζώων και των προϊόντων τους,
    καταγωγής ορισμένων ευρωπαϊκών χωρών, σε ό,τι
    αφορά τον αφθώδη πυρετό'
  type: main
- language: it
  script: Latn
  content: '93/397/CEE: DECISIONE DELLA COMMISSIONE del 14 luglio 1993 recante quarta
    modifica della decisione 93/242/CEE relativa all'' importazione nella Comunità
    di animali vivi e loro prodotti originari di alcuni paesi europei, in considerazione
    dell'' afta epizootica'
  type: main
- language: nl
  script: Latn
  content: '93/397/EEG: BESCHIKKING VAN DE COMMISSIE van 14 juli 1993 houdende vierde
    wijziging van Beschikking 93/242/EEG inzake de invoer in de Gemeenschap van bepaalde
    levende dieren en produkten daarvan uit bepaalde Europese landen, met betrekking
    tot mond- en klauwzeer'
  type: main
- language: pt
  script: Latn
  content: '93/397/CEE: DECISÃO DA COMISSÃO de 14 de Julho de 1993 que altera pela
    quarta vez a Decisão 93/242/CEE, relativa à importação na Comunidade de determinados
    animais vivos e dos seus produtos, originários de certos países europeus, atendendo
    à ocorrência de febre aftosa'
  type: main
- language: es
  script: Latn
  content: '93/397/CEE: DECISIÓN DE LA COMISIÓN de 14 de julio de 1993 que modifica
    por cuarta vez la Decisión 93/242/CEE por la que se regula, a los efectos de
    la fiebre aftosa, la importación en la Comunidad de ciertos animales vivos y
    de los productos derivados de ellos originarios de determinados países europeos'
