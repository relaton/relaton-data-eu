  content: Commission Regulation (EC) No 826/94 of 13 April 1994 amending Regulations
    (EEC) No 2385/91 and (EEC) No 3567/92 and laying down certain detailed rules for
    the application of Council Regulation (EEC) No 3013/89 as regards the incorporation
    of rights exceeding the limits of 500 and 1 000 animals into individual limits
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 826/94 de la Commission, du 13 avril 1994, modifiant
    les règlements (CEE) n° 2385/91 et (CEE) n° 3567/92 et portant certaines modalités
    d'application du règlement (CEE) n° 3013/89 du Conseil en ce qui concerne l'incorporation
    des droits supérieurs aux plafonds de 1 000/500 têtes dans les limites individuelles
  type: main
