    zur Verordnung (EWG) Nr. 3013/89 des Rates betreffend die Einbeziehung der über
    die Obergrenzen von 1 000 bzw. 500 Tieren je Erzeuger hinausgehenden Prämienansprüche
  type: main
- language: da
  script: Latn
