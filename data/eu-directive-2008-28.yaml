    ανατίθενται στην Επιτροπή
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu direktiiv 2008/28/EÜ, 11. märts 2008 ,
    millega komisjoni rakendusvolituste osas muudetakse direktiivi 2005/32/EÜ, mis
    käsitleb raamistiku kehtestamist energiat tarbivate toodete ökodisaini nõuete
    sätestamiseks, ja samuti nõukogu direktiivi 92/42/EMÜ ning direktiive 96/57/EÜ
    ja 2000/55/EÜ
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2008/28/EY, annettu 11 päivänä
    maaliskuuta 2008 , energiaa käyttävien tuotteiden ekologiselle suunnittelulle
    asetettavien vaatimusten puitteista annetun direktiivin 2005/32/EY sekä neuvoston
    direktiivin 92/42/ETY ja direktiivien 96/57/EY ja 2000/55/EY muuttamisesta komissiolle
    siirretyn täytäntöönpanovallan osalta
  type: main
- language: hr
  script: Latn
  content: Direktiva 2008/28/EZ Europskog parlamenta i Vijeća od 11. ožujka 2008.
