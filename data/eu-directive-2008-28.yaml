title:
- language: en
  script: Latn
  content: Directive 2008/28/EC of the European Parliament and of the Council of 11
    March 2008 amending Directive 2005/32/EC establishing a framework for the setting
    of ecodesign requirements for energy-using products, as well as Council Directive
    92/42/EEC and Directives 96/57/EC and 2000/55/EC, as regards the implementing
    powers conferred on the Commission
  type: main
- language: fr
  script: Latn
  content: Directive 2008/28/CE du Parlement européen et du Conseil du 11 mars 2008
    modifiant la directive 2005/32/CE établissant un cadre pour la fixation d’exigences
    en matière d’écoconception applicables aux produits consommateurs d’énergie,
    ainsi que la directive 92/42/CEE du Conseil et les directives 96/57/CE et 2000/55/CE
    du Parlement européen et du Conseil, en ce qui concerne les compétences d’exécution
    conférées à la Commission
  type: main
- language: de
  script: Latn
  content: Richtlinie 2008/28/EG des Europäischen Parlaments und des Rates vom 11.
    März 2008 zur Änderung der Richtlinie 2005/32/EG zur Schaffung eines Rahmens
    für die Festlegung von Anforderungen an die umweltgerechte Gestaltung energiebetriebener
    Produkte und zur Änderung der Richtlinie 92/42/EWG des Rates sowie der Richtlinien
    96/57/EG und 2000/55/EG im Hinblick auf die der Kommission übertragenen Durchführungsbefugnisse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2008/28/ЕО на Европейския парламент
    и на Съвета от 11 март 2008 година за изменение
    на Директива 2005/32/ЕО за създаване на рамка за
    определяне на изискванията за екодизайн към
    енергоемките продукти, както и Директива 92/42/ЕИО
    на Съвета и директиви 96/57/ЕО и 2000/55/ЕО, по отношение
    на изпълнителните правомощия, предоставени
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2008/28/ES ze dne 11. března 2008
    , kterou se mění směrnice 2005/32/ES o stanovení rámce pro určení požadavků
    na ekodesign energetických spotřebičů a směrnice Rady 92/42/EHS a směrnice
    96/57/ES a 2000/55/ES, pokud jde o prováděcí pravomoci svěřené Komisi
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets direktiv 2008/28/EF af 11. marts 2008 om
    ændring af direktiv 2005/32/EF om rammerne for fastlæggelse af krav til miljøvenligt
    design af energiforbrugende produkter og om ændring af Rådets direktiv 92/42/EØF
    og Europa-Parlamentets og Rådets direktiv 96/57/EF og 2000/55/EF, for så vidt
    angår de gennemførelsesbeføjelser, der tillægges Kommissionen
  type: main
- language: el
  script: Grek
  content: Οδηγία 2008/28/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
