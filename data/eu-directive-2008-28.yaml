    ekološki dizajn proizvoda koji koriste energiju i o izmjeni Direktive Vijeća
    92/42/EEZ te direktiva 96/57/EZ i 2000/55/EZ u pogledu provedbenih ovlasti dodijeljenih
    Komisiji
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2008/28/EK irányelve ( 2008. március
    11. ) az energiafelhasználó termékek környezetbarát tervezésére vonatkozó
    követelmények megállapításának kereteiről, valamint a 92/42/EGK tanácsi,
    illetve a 96/57/EK és a 2000/55/EK irányelv módosításáról szóló 2005/32/EK
    irányelvnek a Bizottságra ruházott végrehajtási hatáskörök gyakorlása
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2008/28/CE del Parlamento europeo e del Consiglio, dell’ 11
    marzo 2008 , che modifica la direttiva 2005/32/CE relativa all’istituzione di
    un quadro per l’elaborazione di specifiche per la progettazione ecocompatibile
    dei prodotti che consumano energia, nonché la direttiva 92/42/CEE del Consiglio
    e le direttive del Parlamento europeo e del Consiglio 96/57/CE e 2000/55/CE, per
    quanto riguarda le competenze di esecuzione conferite alla Commissione
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2008/28/EK ( 2008. gada 11. marts
    ), ar kuru attiecībā uz Komisijai piešķirtajām ieviešanas pilnvarām groza
    Direktīvu 2005/32/EK, ar ko izveido sistēmu, lai noteiktu ekodizaina prasības
    attiecībā uz enerģiju patērējošiem ražojumiem, kā arī Padomes Direktīvu
    92/42/EEK un Direktīvas 96/57/EK un 2000/55/EK
  type: main
- language: lt
  script: Latn
  content: 2008 m. kovo 11 d. Europos Parlamento ir Tarybos direktyva 2007/28/EB,
    iš dalies keičianti Direktyvą 2005/32/EB, nustatančią ekologinio projektavimo
    reikalavimų energiją vartojantiems gaminiams nustatymo sistemą, taip pat Tarybos
    direktyvą 92/42/EEB bei direktyvų 96/57/EB ir 2000/55/EB nuostatas, susijusias
    su Komisijai suteiktais įgyvendinimo įgaliojimais
  type: main
- language: mt
  script: Latn
  content: Direttiva 2008/28/KE tal-Parlament Ewropew u tal-Kunsill tal- 11 ta’
