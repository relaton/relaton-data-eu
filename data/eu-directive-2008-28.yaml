    την τροποποίηση της οδηγίας 2005/32/ΕΚ για θέσπιση
    πλαισίου για τον καθορισμό απαιτήσεων οικολογικού
    σχεδιασμού όσον αφορά τα προϊόντα που καταναλώνουν
    ενέργεια και για τροποποίηση της οδηγίας 92/42/ΕΟΚ
