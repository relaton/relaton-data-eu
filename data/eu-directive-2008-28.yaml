    tar-rekwiżiti għall-eko-disinn ta’ prodotti li jużaw l-enerġija, kif ukoll
    id-Direttiva tal-Kunsill 92/42/KEE u d-Direttivi 96/57/KE u 2000/55/KE, rigward
    il-proċeduri għall-eżerċizzju tas-setgħat ta’ implimentazzjoni konferiti
    lill-Kummissjoni
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2008/28/EG van het Europees Parlement en de Raad van 11 maart
    2008 tot wijziging van Richtlijn 2005/32/EG betreffende de totstandbrenging van
    een kader voor het vaststellen van eisen inzake ecologisch ontwerp voor energieverbruikende
    producten, en tot wijziging van Richtlijn 92/42/EEG van de Raad en van Richtlijnen
    96/57/EG en 2000/55/EG van het Europees Parlement en de Raad, wat de aan de Commissie
    verleende uitvoeringsbevoegdheden betreft
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Parlamentu Europejskiego i Rady 2008/28/WE z dnia 11 marca 2008
    r. zmieniająca dyrektywę 2005/32/WE ustanawiającą ogólne zasady ustalania
    wymogów dotyczących ekoprojektu dla produktów wykorzystujących energię, dyrektywę
    Rady 92/42/EWG oraz dyrektywy 96/57/WE i 2000/55/WE, w odniesieniu do uprawnień
    wykonawczych przyznanych Komisji
  type: main
- language: pt
  script: Latn
  content: Directiva 2008/28/CE do Parlamento Europeu e do Conselho, de 11 de Março
    de 2008 , que altera a Directiva 2005/32/CE relativa à criação de um quadro
    para definir os requisitos de concepção ecológica dos produtos que consomem
    energia, bem como a Directiva 92/42/CEE do Conselho e as Directivas 96/57/CE e
    2000/55/CE, no que diz respeito às competências de execução atribuídas à
    Comissão
  type: main
- language: ro
  script: Latn
  content: Directiva 2008/28/CE a Parlamentului European și a Consiliului din 11
    martie 2008 de modificare a Directivei 2005/32/CE de instituire a unui cadru pentru
    stabilirea cerințelor în materie de proiectare ecologică aplicabile produselor
    consumatoare de energie, precum și a Directivei 92/42/CEE a Consiliului și a
    Directivelor 96/57/CE și 2000/55/CE, în ceea ce privește competențele de executare
    conferite Comisiei
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2008/28/ES z 11. marca 2008 , ktorou
    sa mení a dopĺňa smernica 2005/32/ES o vytvorení rámca na stanovenie požiadaviek
    na ekodizajn výrobkov využívajúcich energiu, ako aj smernica Rady 92/42/EHS
    a smernice 96/57/ES a 2000/55/ES, pokiaľ ide o vykonávacie právomoci prenesené
    na Komisiu
  type: main
- language: sl
  script: Latn
  content: Direktiva 2008/28/ES Evropskega parlamenta in Sveta z dne 11. marca 2008
    o spremembi Direktive 2005/32/ES o vzpostavitvi okvira za določanje zahtev za
    okoljsko primerno zasnovo izdelkov, ki rabijo energijo, in o spremembi Direktive
    Sveta 92/42/EGS ter direktiv 96/57/ES in 2000/55/ES glede Komisiji podeljenih
    izvedbenih pooblastil
  type: main
- language: es
  script: Latn
  content: Directiva 2008/28/CE del Parlamento Europeo y del Consejo, de 11 de marzo
    de 2008 , que modifica la Directiva 2005/32/CE, por la que se instaura un marco
    para el establecimiento de requisitos de diseño ecológico aplicables a los productos
    que utilizan energía, así como la Directiva 92/42/CEE del Consejo y las Directivas
    96/57/CE y 2000/55/CE por lo que se refiere a las competencias de ejecución atribuidas
    a la Comisión
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2008/28/EG av den 11 mars 2008
    om ändring av direktiv 2005/32/EG om upprättande av en ram för att fastställa
    krav på ekodesign för energianvändande produkter och av rådets direktiv 92/42/EEG
    samt Europaparlamentets och rådets direktiv 96/57/EG och 2000/55/EG, vad gäller
    kommissionens genomförandebefogenheter
