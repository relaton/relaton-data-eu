title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1962/84 of 10 July 1984 re-establishing
    the levying of customs duties on other woven fabrics of cotton, unbleached or
    bleached, products of category ex 2 (code 0023), originating in Sri Lanka, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1962/84 de la Commission du 10 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux autres tissus
    de coton, écrus ou blanchis, de la catégorie ex 2 (code 0023), originaires du
    Sri Lanka, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1962/84 der Kommission vom 10. Juli 1984 über die
    Wiedereinführung des Zollsatzes für andere Gewebe aus Baumwolle, roh oder gebleicht,
    der Warenkategorie Nr. ex 2 (Kennziffer 0023) mit Ursprung in Sri Lanka, dem die
    in der Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1962/84 af 10. juli 1984 om genindførelse
    af opkrævning af toldafgifter for andre vævede stoffer af bomuld, ublegede og
    blegede under varekategori nr. ex 2 (kode 0023), som har oprindelse i Sri Lanka
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1962/84 της Επιτροπής
    της 10ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για έτερα υφάσματα
    βαμβακηρά, αλεύκαστα ή λελευκασμένα, προϊόντα
    της κατηγορίας ex 2 (κωδικός 0023), καταγωγής Σρι
    Λάνκα, δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1962/84 della Commissione del 10 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili agli altri tessuti di cotone, greggi
    o imbianchiti, della categoria di prodotti n. ex 2 (codice 0023), originari dello
    Sri Lanka beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1962/84 van de Commissie van 10 juli 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geweven
    weefsels van katoen, ongebleekt of gebleekt, van de categorie van produkten nr.
    ex 2 (codenummer 0023), van oorsprong uit Sri Lanka, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
