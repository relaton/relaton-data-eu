    invista ta’ l-inklużjoni possibli ta’ BAS 620H (tepraloxydim), S-metolachlor
    u SZX 0722 (iprovalicarb) fl-Anness I tad-Direttiva tal-Kunsill 91/414/KEE dwar
    it-tqegħid ta’ prodotti ta’ protezzjoni tal-pjanti fis-suq (kif notifikat
    fid-dokument Nru C(1998) 2368)Test b’relevanża ghaż-ŻEE
  type: main
- language: nl
  script: Latn
  content: '98/512/EG: Beschikking van de Commissie van 29 juli 1998 waarbij in beginsel
    wordt erkend dat de dossiers die zijn ingediend voor een grondig onderzoek met
    het oog op de eventuele opneming van BAS 620H (tepraloxydim), S-metalochloor en
    SZX 0722 (iprovalicarb) in bijlage I van Richtlijn 91/414/EEG van de Raad betreffende
    het op de markt brengen van gewasbeschermingsmiddelen, volledig zijn (kennisgeving
    geschied onder nummer C(1998) 2368)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 lipca 1998 r. uznająca zasadniczo kompletność
