    BAS 620H (tepraloksydim), S-metolachloru i SZX 0722 (iprowalikarb) do załącznika
    I do dyrektywy Rady 91/414/EWG dotyczącej wprowadzania do obrotu środków ochrony
    roślin (notyfikowana jako dokument nr C(1998) 2368)
  type: main
- language: pt
  script: Latn
  content: '98/512/CE: Decisão da Comissão de 29 de Julho de 1998 que reconhece,
