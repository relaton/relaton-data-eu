type: standard
title:
- language: en
  script: Latn
  content: '98/512/EC: Commission Decision of 29 July 1998 recognising in principle
    the completeness of the dossiers submitted for detailed examination in view of
    the possible inclusion of BAS 620H (tepraloxydim), S-metolachlor and SZX 0722
    (iprovalicarb) in Annex I to Council Directive 91/414/EEC concerning the placing
    of plant-protection products on the market (notified under document number C(1998)
    2368)'
  type: main
- language: fr
  script: Latn
  content: '98/512/CE: Décision de la Commission du 29 juillet 1998 reconnaissant
    en principe la conformité des dossiers transmis pour examen détaillé en vue
    de l''inscription du BAS 620H (tépraloxydim), du S-métolachlor et du SZX 0722
    (iprovalicarb) dans l''annexe I de la directive 91/414/CEE du Conseil concernant
    la mise sur le marché des produits phytopharmaceutiques [notifiée sous le numéro
    C(1998) 2368]'
  type: main
- language: de
  script: Latn
  content: '98/512/EG: Entscheidung der Kommission vom 29. Juli 1998 über die grundsätzliche
    Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden Prüfung
    im Hinblick auf eine etwaige Aufnahme von BAS 620H (Tepraloxydim), S-Metolachlor
    und SZX 0722 (Iprovalicarb) in Anhang I der Richtlinie 91/414/EWG des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln eingereicht wurden (Bekanntgegeben
    unter Aktenzeichen K(1998) 2368)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 юли 1998 година
    относно признаване по принцип пълнотата на
    досиетата, представени за подробна проверка
    с оглед евентуалното включване на BAS 620H (тепралоксидим),
    S-метолахлор и SZX 0722 (ипроваликарб) в приложение
    I към Директива 91/414/ЕИО на Съвета относно пускането
    на пазара на продукти за растителна защита
    (нотифицирано под номер C(1998) 2368)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. července 1998, kterým se v zásadě uznává
    úplnost dokumentací předložených k podrobnému zkoumání s ohledem na možné
    zařazení BAS 620H (tepraloxydim), Smetolachloru a SZX 0722 (iprovalikarb) do
    přílohy I směrnice Rady 91/414/EHS o uvádění přípravků na ochranu rostlin
    na trh (oznámeno pod číslem K(1998) 2368)
  type: main
- language: da
  script: Latn
  content: '98/512/EF: Kommissionens beslutning af 29. juli 1998 om principiel anerkendelse
    af, at det dossier, som er forelagt til grundig behandling med på eventuel optagelse
    af BAS 620H (tepraloxydim), S-metolachlor og SZX 0722 (iprovalicarb) i bilag I
    til Rådets direktiv 91/414/EØF om markedsføring af plantebeskyttelsesmidler,
    er fuldstændigt (meddelt under nummer K(1998) 2368)'
  type: main
- language: el
  script: Grek
