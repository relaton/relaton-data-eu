    e do SZX 0722 (oprovalicarbe) no anexo I da Directiva 91/414/CEE do Conselho relativa
    à colocação dos produtos fitofarmacêuticos no mercado [notificada com o número
    C(1998) 2368]'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 29 iulie 1998 de recunoaștere în principiu a conformității
    dosarelor prezentate pentru examinare detaliată în vederea eventualei includeri
    a BAS 620H (tepraloxydim), S-metolachlor și SZX 0722 (iprovalicarb) în anexa
    I la Directiva 91/414/CEE a Consiliului privind introducerea pe piață a produselor
    fitosanitare [notificată cu numărul C(1998) 2368]
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. júla 1998, ktorým sa v zásade uznáva úplnosť
    dokumentácie predloženej na podrobné preskúmanie kvôli možnému zaradeniu
    BAS 620H (tepraloxydim), S-metolachlóru a SZX 0722 (iprovalikarb) do prílohy
    I k smernici Rady 91/414/EHS o uvádzaní prípravkov na ochranu rastlín na trh
    (oznámené pod číslom dokumentu C(1998) 2368)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. julija 1998 o načelnem priznavanju popolnosti
