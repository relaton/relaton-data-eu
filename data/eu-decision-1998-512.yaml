  script: Latn
  content: '98/512/EZ: Odluka Komisije od 29. srpnja 1998. o načelnom priznavanju
    cjelovitosti dokumentacije dostavljene na detaljno razmatranje s ciljem mogućeg
    uvrštenja BAS 620H (tepraloksidima), S-metolaklora i SZX 0722 (iprovalikarba)
    u Prilog I. Direktivi Vijeća 91/414/EEZ o stavljanju sredstava za zaštitu bilja
    na tržište (priopćeno pod brojem dokumenta C(1998) 2368)'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1998. július 29.) a BAS 620H-nak (tepraloxidim),
    az S-metolaklórnak és az SZX 0722-nek (iprovalikarb) a növényvédő szerek
    forgalomba hozataláról szóló 91/414/EGK tanácsi irányelv I. mellékletébe
    történő lehetséges felvétele céljából részletes vizsgálatra benyújtott
    dokumentációk teljességének elvi elismeréséről (az értesítés a C(1998)
    2368. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '98/512/CE: Decisione della Commissione del 29 luglio 1998 che riconosce
    in linea di massima la conformità dei fascicoli trasmessi per un esame dettagliato
    in vista di un eventuale inserimento di BAS 620H (tepraloxydim), S-metolachlor
    e SZX 0722 (iprovalicarb) nell''allegato I della direttiva 91/414/CEE del Consiglio,
    relativa all''immissione in commercio dei prodotti fitosanitari [notificata con
    il numero C(1998) 2368]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1998. gada 29. jūlijs), ar ko principā atzīst par
    pilnīgu dokumentāciju, kas iesniegta sīkākai pārbaudei saistībā ar BAS
    620H (tepraloksidīmu), S-metalohloru un SZX-0722 (iprovalikarbu) iespējamu iekļaušanu
    I pielikumā Padomes Direktīvai 91/414/EEK par augu aizsardzības līdzekļu
    laišanu tirgū (izziņots ar dokumentu numuru C(1998) 2368)
  type: main
- language: lt
  script: Latn
  content: 1998 m. liepos 29 d. Komisijos sprendimas, iš esmės pripažįstantis
    dokumentų, pateiktų nuodugniai patikrinti dėl BAS 620H (tepraloksidimo), S-metolachloro
    ir SZX 0722 (iprovalikarbo) galimo įrašymo į Tarybos direktyvos 91/414/EEB
    dėl augalų apsaugos produktų pateikimo į rinką I priedą, išsamumą (pranešta
    dokumentu Nr. C(1998) 2368)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta’ Lulju 1998 li tirrikonoxxi
