  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. juuli 1998, millega tunnistatakse põhimõtteliselt
    täielikuks üksikasjaliku läbivaatuse jaoks esitatud toimikud, pidades silmas
    BAS 620H (tepraloksüdiim), metolahloor-S ja SZX 0722 (inprovalikarb) lisamist
    taimekaitsevahendite turuleviimist käsitleva nõukogu direktiivi 91/414/EMÜ
