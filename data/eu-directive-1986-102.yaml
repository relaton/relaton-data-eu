title:
- language: en
  script: Latn
  content: Council Directive 86/102/EEC of 24 March 1986 amending for the fourth time
    Directive 74/329/EEC on the approximation of the laws of the Member States relating
    to emulsifiers, stabilizers, thickeners and gelling agents for use in foodstuffs
  type: main
- language: fr
  script: Latn
  content: Directive 86/102/CEE du Conseil du 24 mars 1986 portant quatrième modification
    de la directive 74/329/CEE relative au rapprochement des législations des États
    membres concernant les agents émulsifiants, stabilisants, épaississants et gélifiants
    pouvant être employés dans les denrées alimentaires
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/102/EWG des Rates vom 24. März 1986 zur vierten Änderung
    der Richtlinie 74/329/EWG zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    für Emulgatoren, Stabilisatoren, Verdickungs- und Geliermittel, die in Lebensmitteln
    verwendet werden dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 86/102/EØF af 24. marts 1986 om fjerde ændring af direktiv
    74/329/EØF om tilnærmelse af medlemsstaternes lovgivninger om emulgatorer, stabilisatorer,
    fortyknings- og geleringsmidler, der må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/102/ΕΟΚ του Συμβουλίου της 24ης Μαρτίου
    1986 για την τέταρτη τροποποίηση της οδηγίας
    74/329/ΕΟΚ περί προσεγγίσεως των νομοθεσιών των
    κρατών μελών σχετικά με τους γαλακτωματοποιητές,
    σταθεροποιητές, τα πυκνωτικά και πηκτικά μέσα
    που επιτρέπεται να χρησιμοποιηθούν στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 86/102/ETY, annettu 24 päivänä maaliskuuta 1986,
    elintarvikkeissa sallittuja emulgointi-, stabilointi-, sakeuttamis- ja hyytelöimisaineita
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun neuvoston
    direktiivin 74/329/ETY muuttamisesta neljännen kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 86/102/CEE del Consiglio del 24 marzo 1986 recante quarta modifica
    della direttiva 74/329/CEE relativa al ravvicinamento delle legislazioni degli
    Stati Membri concernenti gli emulsionanti, gli stabilizzanti, gli addensanti ed
    i gelificanti che possono essere impiegati nei prodotti alimentari
  type: main
- language: nl
  script: Latn
  content: Richtlijn 86/102/EEG van de Raad van 24 maart 1986 houdende vierde wijziging
    van Richtlijn 74/329/EEG betreffende de onderlinge aanpassing van de wettelijke
    voorschriften der Lid-Staten inzake de emulgatoren, stabilisatoren, verdikkingsmiddelen
    en geleermiddelen waarvan het gebruik in levensmiddelen is toegestaan
  type: main
- language: pt
  script: Latn
  content: Directiva 86/102/CEE do Conselho de 24 de Março de 1986 que estabelece
    a quarta alteração à Directiva 74/329/CEE relativa à aproximação das legislações
    dos Estados- membros no que diz respeito aos agentes emulsificantes, estabilizantes,
    espessantes e gelificantes que podem ser utilizados nos géneros alimentícios
  type: main
- language: es
  script: Latn
  content: Directiva 86/102/CEE del Consejo de 24 de marzo de 1986 por la que se modifica
