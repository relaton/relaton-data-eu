    citronellal, 2,6-dimetylhept-5-enal, citronellsyra, citronellylacetat, citronellylbutyrat,
    citronellylformiat, citronellylpropionat, 1-etoxi-1-(3-hexenyloxi)etan och hex-3-enylisovalerat
    som fodertillsatser för alla djurarter
