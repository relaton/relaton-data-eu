  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/1208, 21. juuni 2023, millega lubatakse
    lasta turule geneetiliselt muundatud maisi MON 95379 sisaldavaid, sellest koosnevaid
    või sellest toodetud tooteid vastavalt Euroopa Parlamendi ja nõukogu määrusele
    (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2023) 3936 all) (Ainult hollandikeelne
    tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2023/1208, annettu 21 päivänä
    kesäkuuta 2023, luvan antamisesta muuntogeenistä maissia MON 95379 sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden saattamiseksi markkinoille
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2023) 3936) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/1208 ón gCoimisiún an 21 Meitheamh
    2023 lena n-athnuaitear an t-údarú chun táirgí a chur ar an margadh, ar táirgí
    iad ina bhfuil arbhar Indiach géinmhodhnaithe MON 95379, nó atá comhdhéanta
    de, nó a tháirgtear as de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint
    na hEorpa agus ón gComhairle (tugadh fógra faoi leis an doiciméad C(2023) 3936)
