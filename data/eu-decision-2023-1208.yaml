title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/1208 of 21 June 2023 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MON 95379 pursuant to Regulation (EC) No 1829/2003
    of the European Parliament and of the Council (notified under document C(2023)
    3936) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/1208 de la Commission du 21 juin 2023
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MON 95379, consistant en ce maïs ou produits à partir de celui-ci,
    en application du règlement (CE) no 1829/2003 du Parlement européen et du Conseil
    [notifiée sous le numéro C(2023) 3936] (Le texte en langue néerlandaise est
    le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/1208 der Kommission vom 21. Juni 2023
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais MON 95379 enthalten, aus ihm bestehen oder aus ihm hergestellt werden, gemäß
    der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments und des Rates (Bekannt
    gegeben unter Aktenzeichen C(2023) 3936) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/1208 на Комисията
    от 21 юни 2023 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица MON 95379, в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2023) 3936) (само текстът
    на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/1208 ze dne 21. června 2023
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    MON 95379, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2023)
    3936) (Pouze nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/1208 af 21. juni 2023
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret MON 95379-majs, i henhold til Europa-Parlamentets
    og Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2023) 3936) (Kun
    den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/1208 της Επιτροπής
    της 21ης Ιουνίου 2023 για την έγκριση της διάθεσης
    στην αγορά προϊόντων που περιέχουν, αποτελούνται
    ή παράγονται από γενετικώς τροποποιημένο αραβόσιτο
    MON 95379 σύμφωνα με τον κανονισμό (ΕΚ) αριθ. 1829/2003
