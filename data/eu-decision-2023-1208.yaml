    fihom il-qamħirrum immodifikat ġenetikament MON 95379, li jkunu jikkonsistu
    minnu jew li jkunu prodotti minnu skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill (notifikata bid-dokument C(2023) 3936) (It-test bl-Olandiż
