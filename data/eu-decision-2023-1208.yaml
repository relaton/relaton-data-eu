  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/1208 оd 21. lipnja 2023. o odobrenju
    za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    MON 95379, sastoje se ili su proizvedeni od njega, u skladu s Uredbom (EZ) br.
    1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2023)
    3936) (Vjerodostojan je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/1208 végrehajtási határozata (2023. június 21.)
    a géntechnológiával módosított MON 95379 kukoricát tartalmazó, abból álló
    vagy abból előállított termékek forgalomba hozatalának az 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2023) 3936. számú dokumentummal történt) (Csak a holland nyelvű szöveg
    hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (EU) 2023/1208 della Commissione del 21 giugno
    2023 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato MON 95379 in conformità al regolamento
    (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata con il numero
    C(2023) 3936] (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/1208 (2023. gada 21. jūnijs),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu MON 95379,
    sastāv vai ir ražoti no tās (izziņots ar dokumenta numuru C(2023) 3936) (Autentisks
    ir tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2023/1208 2023 m. birželio 21
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MON 95379, kurie iš jų sudaryti arba kurie iš jų pagaminti (pranešta dokumentu
    Nr. C(2023) 3936) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/1208 tal-21
