    dei costi supplementari che incidono sullo smercio di taluni prodotti della pesca
    originari delle Azzorre, di Madera, delle Isole Canarie e dei dipartimenti francesi
    della Guiana e della Riunione, a causa del carattere ultraperiferico di queste
    regioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 579/2002 van de Raad van 25 maart 2002 houdende wĳziging
