    af visse fiskerivarer fra Azorerne, Madeira, De Kanariske Øer og de franske oversøiske
    departementer Guyana og Réunion, der er en følge af disse områders beliggenhed
    i Fællesskabets yderste periferi
  type: main
- language: el
  script: Grek
