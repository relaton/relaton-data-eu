title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 579/2002 of 25 March 2002 amending Regulation
    (EC) No 1587/98 introducing a scheme to compensate for the additional costs incurred
    in the marketing of certain fishery products from the Azores, Madeira, the Canary
    Islands and the French departments of Guiana and Réunion as a result of those
    regions' remoteness
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 579/2002 du Conseil du 25 mars 2002 modifiant le règlement
    (CE) n° 1587/98 instituant un régime de compensation des surcoûts induits par
    l'ultrapériphéricité pour l'écoulement de certains produits de la pêche des
    Açores, de Madère, des îles Canaries et des départements français de la Guyane
    et de la Réunion
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 579/2002 des Rates vom 25. März 2002 zur Änderung
    der Verordnung (EG) Nr. 1587/98 über eine Regelung zum Ausgleich der durch die
    äußerste Randlage bedingten Mehrkosten bei der Verarbeitung bestimmter Fischereierzeugnisse
    der Azoren, Madeiras, der Kanarischen Inseln und der französischen Departements
    Guayana und Réunion
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 579/2002 af 25. marts 2002 om ændring af forordning
