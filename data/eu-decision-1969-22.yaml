    de l'emploi (ONEM)
  type: main
- language: de
  script: Latn
  content: '69/22/EWG: Entscheidung der Kommission vom 19. Dezember 1968 über die
    Gewährung eines Zuschusses aus dem ESF an das Königreich Belgien zu Aufwendungen
    für vom "Office National de l''Emploi (ONEM)" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '69/22/CEE: Decisione della Commissione, del 19 dicembre 1968, relativa
    alla concessione di un contributo del FSE a favore del Regno del Belgio per spese
    concernenti operazioni di rieducazione professionale effettuate dall''«Office
    national de l''emploi (ONEM)»'
  type: main
- language: nl
  script: Latn
  content: '69/22/EEG: Beschikking van de Commissie van 19 december 1968 houdende
