title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 338/86 of 14 February 1986 imposing a definitive
    anti-dumping duty on imports of roller chains for cycles originating in the People'
    s Republic of China and definitively collecting the provisional anti-dumping duty
    imposed on those imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 338/86 du Conseil du 14 février 1986 instituant un
    droit antidumping définitif sur les importations de chaînes à rouleaux pour
    cycles originaires de la République populaire de Chine et portant perception
    définitive du droit antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 338/86 des Rates vom 14. Februar 1986 zur Einführung
    eines endgültigen Antidumpingzolls auf Einfuhren von Rollenketten für Fahrräder
    mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmung des
    auf diese Einfuhren erhobenen vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 338/86 af 14. februar 1986 om indførelse
    af en endelig antidumpingtold på importen af rullekæder til cykler med oprindelse
    i Den kinesiske Folkerepublik og om endelig opkrævning af den midlertidige antidumpingtold
    på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 338/86 του Συμβουλίου
    της 14ης Φεβρουαρίου 1986 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές αλυσίδων
    σε κυλίνδρους για ποδήλατα καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας και για την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που έχει επιβληθεί στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 338/86 del Consiglio del 14 febbraio 1986 che istituisce
    un dazio antidumping definitivo sulle importazioni di catene a rulli per bicicletta
    originarie della Repubblica popolare cinese e riscuote definitivamente i dazi
    provvisori antidumping istituiti su dette importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 338/86 van de Raad van 14 februari 1986 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van rolkettingen
    voor rijwielen van oorsprong uit de Volksrepubliek China, en houdende definitieve
    inning van het op deze invoer ingestelde voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 338/86 do Conselho de 14 de Fevereiro de 1986 que
    cria um direito "anti-dumping" definitivo sobre as importações de correntes
    de roletes para bicicletas originárias da República Popular da China e estabelece
    a cobrança definitiva do direito "anti-dumping" provisório sobre estas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 338/86 del Consejo de 14 de febrero de 1986 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    cadenas de rodillos para bicicletas originarias de la República Popular de China
    y por el que se percibe con carácter definitivo el derecho antidumping provisional
    sobre estas importaciones
  type: main
