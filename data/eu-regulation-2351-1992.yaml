title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2351/92 of 7 August 1992 re-establishing
    the levying of customs duties on products of categories 26 and 28 (order Nos 40.0260
    and 40.0280), originating in India, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2351/92 de la Commission du 7 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    nos 26 et 28 (numéros d'ordre 40.0260 et 40.0280) originaires de l'Inde, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2351/92 DER KOMMISSION vom 7. August 1992 zur Wiedereinführung
