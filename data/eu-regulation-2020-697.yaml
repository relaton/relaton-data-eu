title:
- language: en
  script: Latn
  content: Regulation (EU) 2020/697 of the European Parliament and of the Council
    of 25 May 2020 amending Regulation (EU) 2017/352, so as to allow the managing
    body of a port or the competent authority to provide flexibility in respect of
    the levying of port infrastructure charges in the context of the COVID-19 outbreak
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2020/697 du Parlement européen et du Conseil du 25 mai
    2020 modifiant le règlement (UE) 2017/352 afin de permettre au gestionnaire d’un
    port ou à l’autorité compétente de faire preuve de flexibilité en ce qui
    concerne la perception de redevances d’infrastructure portuaire dans le contexte
    de la propagation de la COVID-19
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2020/697 des Europäischen Parlaments und des Rates vom
