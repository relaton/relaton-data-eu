id: EUDecision197642
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to infants' jackets of woven fabrics of mixed synthetic textile
    fibres falling within subheading 61.02 ex B, originating in Taiwan and in free
    circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 17 novembre 1975, autorisant le Royaume de
    Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à exclure
    du traitement communautaire les vestes de tissus de fibres textiles synthétiques
    mélangées pour jeunes enfants, de la position Ex 61.02 B du Tarif douanier commun,
    originaires de Taiwan et mises en libre pratique en République fédérale d'Allemagne
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Taiwan stammende und in der Bundesrepublik Deutschland im freien Verkehr
    befindliche Jacken für Kleinkinder, aus Geweben aus gemischten synthetischen
    Spinnstoffen, der Tarifnummer 61.02 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. november 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage jakker til småbørn, af blandede syntetiske fibre, som henhører under
    pos. 61.02 ex B i den fælles toldtarif, har oprindelse i Taiwan og frit kan omsættes
    i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le giacche in tessuti di fibre tessili sintetiche
    miste per bambini, della voce 61.02 ex B della tariffa doganale comune, originarie
    di Taiwan e messi in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd kinderjasjes van weefsel van gemengde synthetische garens van post
    61.02 ex B van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en
    in de Bondsrepubliek Duitsland in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
