title:
- language: en
  script: Latn
  content: '84/566/EEC: Commission Decision of 16 November 1984 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain textile products,
    originating in Turkey and Czechoslovakia, which have been put into free circulation
    in the Community (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/566/CEE: Décision de la Commission du 16 novembre 1984 autorisant
    le Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de certains produits textiles originaires de Turquie et de Tchécoslovaquie et
    mis en libre pratique dans la Communauté (Le texte en langue anglaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/566/EWG: Entscheidung der Kommission vom 16. November 1984 mit der
    das Vereinigte Königreich ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren bestimmter aus der Türkei und der Tschechoslowakei stammender und
    sich in der Gemeinschaft im freien Verkehr befindlicher Textilwaren einzuführen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/566/EØF: Kommissionens beslutning af 16. november 1984 om bemyndigelse
    af Det forenede Kongerige til at udføre tilsyn inden for Fællesskabet med indførsel
    i Fællesskabet af visse tekstilvarer, som har oprindelse i Tyrkiet og Tjekkoslovakiet
    og er overgået til fri omsætning i Fællesskabet (Kun den engelske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/566/ΕΟΚ: Απόφαση της Επιτροπής της 16ης
    Νοεμβρίου 1984 για την παροχή άδειας στο Ηνωμένο
    Βασίλειο να προβεί σε ενδοκοινοτική επίβλεψη
    των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής Τουρκίας και Τσεχοσλοβακίας
    τα οποία τίθενται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/566/CEE: Decisione della Commissione del 16 novembre 1984 che autorizza
    il Regno Unito ad applicare misure di sorveglianza intracomunitaria sulle importazioni
    di taluni prodotti tessili originari della Turchia e della Cecoslovacchia e immessi
    in libera pratica nella Comunità (Il testo in lingua inglese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '84/566/EEG: Beschikking van de Commissie van 16 november 1984 waarbij
    het Verenigd Koninkrijk machtiging wordt verleend tot instelling van een intracommunautair
    toezicht op de invoer van bepaalde textielprodukten van oorsprong uit Turkije
    en Tsjechoslowakije die in de Gemeenschap in het vrije verkeer worden gebracht
    (Slechts de tekst in de Engelse taal is authentiek)'
