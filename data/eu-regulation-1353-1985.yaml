title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1353/85 of 23 May 1985 re-establishing the
    levying of customs duties on certain women' s, girls' and infants' woven overcoats,
    raincoats and other coats, cloaks and capes, jackets and blazers, products of
    category 15 B (code 40.0155), originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1353/85 de la Commission du 23 mai 1985 portant rétablissement
    de la perception des droits de douane applicables à certains manteaux, imperméables
    et vestes, tissés pour femmes, fillettes et jeunes enfants, de la catégorie
    de produits no 15 B (code 40.0155), originaires du Pakistan, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1353/85 der Kommission vom 23. Mai 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Mäntel, Umhänge und Jacken aus
    Geweben, für Frauen, Mädchen und Kleinkinder, der Warenkategorie Nr. 15 B (Kennziffer
    40.0155) mit Ursprung in Pakistan, dem die in der Verordnung (EWG) Nr. 3563/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1353/85 af 23. maj 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte frakker, kapper og slag, jakker og
    blazere, vævede til kvinder, piger og småbørn under varekategori nr. 15 B (kode
    40.0155) som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1353/85 της Επιτροπής
    της 23ης Μαΐου 1985 περί αποκαταστάσεως της εφαρμογής
    των τελωνειακών δασμών για ορισμένα επανωφόρια,
    αδιάβροχα και σακάκια, υφασμένα, για γυναίκες,
    κορασίδες και μικρά παιδιά, προϊόντα της κατηγορίας
    15 Β (κωδικός 40.0155), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3563/84 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1353/85 della Commissione del 23 maggio 1985 che ripristina
    la riscossione dei dazi doganali applicabili ad alcuni cappotti, soprabiti, mantelli
    e giacche, tessuti per donna, per ragazza e per bambini, della categoria di prodotti
    n. 15 B (codice 40.0155), originari del Pakistan beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1353/85 van de Commissie van 23 mei 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    mantels, regenjassen en capes daaronder begrepen, blazers en jasjes, geweven,
    voor dames, meisjes en kinderen, van de categorie van produkten nr. 15 B (codenummer
    40.0155), van oorsprong uit Pakistan, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3563/84 van de Raad
  type: main
