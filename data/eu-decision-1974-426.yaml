id: EUDecision1974426
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 5 August 1974 authorizing the French Republic not
    to apply Community treatment to certain articles made of cotton falling within
    heading Nos ex 61.01, ex 61.02, and ex 61.03 of the Common Customs Tariff, originating
    in Mexico and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/426/CEE de la Commission, du 5 août 1974, autorisant la République
    française à exclure du traitement communautaire certains vêtements en coton,
    des positions Ex 61.01, Ex 61.02 et Ex 61.03 du Tarif douanier commun, originaires
    du Mexique et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 5. August 1974, mit der die Französische
    Republik ermächtigt wird, aus Mexiko stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung aus Baumwolle der Tarifnummern ex 61.01,
    ex 61.02 und ex 61.03 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 5. august 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage visse tekstilvarer af bomuld,
    som henhører under position ex 61.01, ex 61.02 og ex 61.03 i den fælles toldtarif,
    har oprindelse i Mexico og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 5 agosto 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario diversi manufatti confezionati
    di cotone, delle voci n. ex 61.01, ex 61.02 e ex 61.03 della tariffa doganale
    comune e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 5 augustus 1974 waarbij de Franse Republiek
    wordt gemachtigd zekere geconfectioneerde artikelen van katoen van posten ex 61.01,
    ex 61.02 en ex 61.03, van het gemeenschappelijk douanetarief, van oorsprong uit
    Mexico en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
