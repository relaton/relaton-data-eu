    να λάβει ορισμένα μέτρα διασφαλίσεως βάσει
    του άρθρου 108 παράγραφος 3 της συνθήκης (Το κείμενο
    στη γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '68/406/CEE: Decisione della Commissione, del 4 dicembre 1968, che autorizza
    la Repubblica francese ad adottare talune misure di salvaguardia ai sensi dell''articolo
    108, paragrafo 3, del trattato (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '68/406/EEG: Beschikking van de Commissie van 4 december 1968 houdende
    machtiging van de Franse Republiek om op grond van artikel 108, lid 3, van het
