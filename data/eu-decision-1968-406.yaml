title:
- language: en
  script: Latn
  content: '68/406/EEC: Commission Decision of 4 December 1968 authorizing the French
    Republic to take certain protective measures in accordance with Article 108 (3)
    of the Treaty (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '68/406/CEE: Décision de la Commission, du 4 décembre 1968, autorisant
    la République française à prendre certaines mesures de sauvegarde conformément
    à l''article 108 paragraphe 3 du traité (Le texte en langue française est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '68/406/EWG: Entscheidung der Kommission vom 4. Dezember 1968, mit der
    die Französische Republik ermächtigt wird, gemäß Artikel 108 Absatz 3 des
    Vertrages bestimmte Schutzmaßnahmen zu treffen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '68/406/EØF: Kommissionens beslutning af 4. december 1968 om bemyndigelse
    af Den Franske Republik til at træffe beskyttelsesforanstaltninger i overensstemmelse
    med traktatens artikel 108, stk. 3 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '68/406/ΕΟΚ: Απόφαση της Επιτροπής της 4ης Δεκεμβρίου
