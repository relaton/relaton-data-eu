title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2124/77 of 27 September 1977 re-establishing
    the levying of customs duties on basketwork, wickerwork, etc., falling within
    heading No 46.03, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2124/77 de la Commission, du 27 septembre 1977, portant
    rétablissement de la perception des droits de douane applicables aux ouvrages
    de vannerie, etc., de la position tarifaire 46.03, originaires de Yougoslavie,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2124/77 der Kommission vom 27. September 1977 zur
    Wiedereinführung des Zollsatzes für Korbmacherwaren usw. der Tarifnummer 46.03,
    mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3021/76 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2124/77 af 27. september 1977 om genindførelse
    af opkrævning af toldafgifter for kurvemagerarbejder etc., under position 46.03,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2124/77 della Commissione, del 27 settembre 1977,
    che ripristina la riscossione dei dazi doganali applicabili ai lavori di panieraio,
    ecc., della voce doganale 46.03, originari della Iugoslavia, beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2124/77 van de Commissie van 27 september 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op mandenmakerswerk,
    vervaardigd van vlechtstoffen, enz., van post 46.03, van oorsprong uit Joegoslavië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
