  script: Latn
  content: COMMISSION REGULATION (EEC) No 1644/93 of 28 June 1993 amending Regulation
    (EEC) No 3734/92 as regards the time limit for notification to the Commission
    of quantities of fruit and vegetables originating in Greece covered by admissible
    applications
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1644/93 de la Commission du 28 juin 1993 modifiant
    le règlement (CEE) n° 3734/92 en ce qui concerne le délai de communication
    à la Commission des quantités de fruits et légumes originaires de Grèce faisant
    l'objet de demandes recevables
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1644/93 DER KOMMISSION vom 28. Juni 1993 zur Änderung
    der Verordnung (EWG) Nr. 3734/92 hinsichtlich der Frist für die Mitteilung der
    Mengen an Obst und Gemüse mit Ursprung in Griechenland, für die gültige Anträge
    gestellt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1644/93 af 28. juni 1993 om ændring
    af forordning (EØF) nr. 3734/92, for så vidt angår fristen for meddelelse til
    Kommissionen af, hvilke mængder frugt og grønsager med oprindelse i Grækenland
    der er omfattet af ansøgninger, som kan antages
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1644/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Ιουνίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3734/92 όσον αφορά την προθεσμία
    για την ανακοίνωση στην Επιτροπή των ποσοτήτων
    οπωροκηπευτικών καταγωγής Ελλάδας για τα οποία
    έγιναν παραδεκτές οι αιτήσεις
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1644/93 DELLA COMMISSIONE del 28 giugno 1993 che modifica
    il regolamento (CEE) n. 3734/92 in ordine al termine di comunicazione alla Commissione
    dei quantitativi di ortofrutticoli originari della Grecia oggetto di domande ammissibili
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1644/93 VAN DE COMMISSIE van 28 juni 1993 tot wijziging
    van Verordening (EEG) nr. 3734/92 wat betreft de termijn voor de melding aan de
    Commissie van de hoeveelheden groenten en fruit, van oorsprong uit Griekenland,
    waarvoor ontvankelijke aanvragen zijn ingediend
  type: main
- language: pt
