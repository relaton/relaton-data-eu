- language: en
  script: Latn
  content: Council Decision (EU) 2024/3025 of 21 November 2024 on the position to
    be adopted on behalf of the European Union within the Joint Committee established
    by the Euro-Mediterranean Interim Association Agreement on trade and cooperation
    between the European Community, of the one part, and the Palestinian Liberation
    Organisation (PLO) for the benefit of the Palestinian Authority of the West Bank
    and Gaza Strip, of the other part, with regard to a decision establishing the
    general requirements for proofs of origin issued electronically under Article
    17(4) of Appendix A to Protocol 3 to that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3025 du Conseil du 21 novembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité mixte
    institué par l’accord d’association euro-méditerranéen intérimaire relatif
    aux échanges et à la coopération entre la Communauté européenne, d’une
    part, et l’Organisation de libération de la Palestine (OLP), agissant pour
    le compte de l’Autorité palestinienne de la Cisjordanie et de la bande de Gaza,
    d’autre part, en ce qui concerne une décision établissant les conditions générales
    applicables aux preuves de l’origine délivrées par voie électronique au titre
    de l’article 17, paragraphe 4, de l’appendice A du protocole n° 3 dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/3025 des Rates vom 21. November 2024 über den Standpunkt,
