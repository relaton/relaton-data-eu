    Europa-Mittelmeer-Interimsassoziationsabkommen über Handel und Zusammenarbeit
    zwischen der Europäischen Gemeinschaft einerseits und der Palästinensischen
    Befreiungsorganisation (PLO) zugunsten der Palästinensischen Behörde für das
    Westjordanland und den Gaza-Streifen andererseits eingerichtet wurde, hinsichtlich
    eines Beschlusses zur Festlegung der allgemeinen Anforderungen für elektronisch
    ausgestellte Ursprungsnachweise gemäß Anlage A Artikel 17 Absatz 4 des Protokolls
    Nr. 3 zum genannten Abkommen zu vertreten ist
