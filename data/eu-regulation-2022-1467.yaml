  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1467 of 5 September 2022 amending
    Implementing Regulation (EU) 2015/2378 as regards the standard forms and computerised
    formats to be used in relation to Council Directive 2011/16/EU and the list of
    statistical data to be provided by Member States for the purposes of evaluating
    that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1467 de la Commission du 5 septembre
    2022 modifiant le règlement d’exécution (UE) 2015/2378 en ce qui concerne
    les formulaires types et les formats informatisés à utiliser en relation avec
    la directive 2011/16/UE du Conseil et la liste des données statistiques à fournir
    par les États membres aux fins de l’évaluation de ladite directive
  type: main
- language: de
  script: Latn
