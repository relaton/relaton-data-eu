    UND AENDERUNG DES PROTOKOLLS NR. 3 UEBER DIE BESTIMMUNG DES BEGRIFFS " ERZEUGNISSE
    MIT URSPRUNG IN " ODER " URSPRUNGSERZEUGNISSE " UND UEBER DIE METHODEN DER ZUSAMMENARBEIT
    DER VERWALTUNGEN SOWIE DES BESCHLUSSES NR. 2/74 DES GEMISCHTEN AUSSCHUSSES EWG-PORTUGAL
    ZUR EINFUEHRUNG EINES VEREINFACHTEN VERFAHRENS FUER DIE AUSSTELLUNG DER WARENVERKEHRSBESCHEINIGUNGEN
    EUR.
  type: main
