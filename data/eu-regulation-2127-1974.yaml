  content: Regulation (EEC) No 2127/74 of the Council of 6 August 1974 on the application
    of Decision No 1/74 of the EEC - Portugal Joint Committee supplementing and amending
    protocol No 3 concerning the definition of the concept of "originating products"
    and methods of administrative cooperation and Decision No 2/74 of the EEC - Portugal
    Joint Committee establishing a simplified procedure for the issue of Eur. 1 movement
    certificates
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2127/74 du Conseil, du 6 août 1974, concernant l'application
    de la décision n° 1/74 du Comité mixte CEE-Portugal complétant et modifiant
    le protocole n° 3 relatif à la définition de la notion de "produits originaires"
    et aux méthodes de coopération administrative et de la décision n° 2/74 du
    Comité mixte CEE-Portugal instituant une procédure simplifiée de délivrance
    des certificats de circulation des marchandises EUR.1
  type: main
