title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2217/1999 of 19 October 1999 reintroducing
    normal customs duties on certain flat-rolled products of iron or non-alloy steel,
    originating in the former Yugoslav Republic of Macedonia, for which a tariff ceiling
    was opened by Regulation (EC) No 273/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2217/1999 de la Commission, du 19 octobre 1999, portant
    rétablissement de la perception des droits de douane normaux applicables à certains
    produits laminés plats en fer ou en aciers non alliés, originaires de l'ancienne
    République yougoslave de Macédoine, pour lesquels un plafond tarifaire a été
    ouvert par le règlement (CE) nº 273/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2217/1999 der Kommission vom 19. Oktober 1999 zur Wiedererhebung
    der Regelzölle für bestimmte flachgewalzte Erzeugnisse aus Eisen oder nichtlegiertem
    Stahl mit Ursprung in der ehemaligen jugoslawischen Republik Mazedonien, denen
    gemäß der Verordnung (EG) Nr. 273/98 ein Zollplafond gewährt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2217/1999 af 19. oktober 1999 om genindførelse
    af opkrævning af normal told på visse fladvalsede produkter, af jern og ulegeret
    stål, med oprindelse i Den Tidligere Jugoslaviske Republik Makedonien, for hvilke
    der er indført et toldloft ved forordning (EF) nr. 273/98
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2217/1999 της Επιτροπής,
    της 19ης Οκτωβρίου 1999, σχετικά με την επαναφορά
    της είσπραξης των κανονικών τελωνειακών δασμών
    που εφαρμόζονται σε ορισμένα πλατέα προϊόντα
    έλασης, από σίδηρο ή από όχι σε κράμα χάλυβες,
    καταγωγής Πρώην Γιουγκοσλαβικής Δημοκρατίας
    της Μακεδονίας, για τα οποία ανοίχθηκε δασμολογική
    οροφή από τον κανονισμό (ΕΚ) αριθ. 273/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2217/1999, annettu 19 päivänä lokakuuta 1999,
    tiettyjen entisestä Jugoslavian tasavallasta Makedoniasta peräisin olevien asetuksessa
    (EY) N:o 273/98 säädettyjen tariffikattojen soveltamisalaan kuuluvien raudasta
    tai seostamattomasta teräksestä valmistettujen levyvalmisteiden tavanomaisten
    tullien uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2217/1999 della Commissione, del 19 ottobre 1999, che
    ripristina la riscossione dei dazi doganali normali applicabili a taluni prodotti
    laminati piatti, di ferro o di acciai non legati, originari dell'ex Repubblica
    iugoslava di Macedonia, che beneficiano di un massimale tariffario previsto dal
    regolamento (CE) n. 273/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2217/1999 van de Commissie van 19 oktober 1999 tot
    wederinstelling van de heffing van de normale douanerechten voor bepaalde gewalste
    platte producten, van ijzer of van niet-gelegeerd staal, van oorsprong uit de
    voormalige Joegoslavische Republiek Macedonië, waarvoor een tariefplafond geopend
    werd bij Verordening (EG) nr. 273/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2217/1999 da Comissão, de 19 de Outubro de 1999,
    que restabelece a cobrança dos direitos aduaneiros normais aplicáveis a determinados
    produtos laminados planos, de ferro ou aço não ligado, originários da antiga
    República Jugoslava da Macedónia, beneficiários de um limite máximo pautal
    previsto no Regulamento (CE) n° 273/98
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2217/1999 de la Comisión, de 19 de octubre de 1999,
    por el que se restablece la percepción de los derechos de aduana normales aplicables
    a determinados productos laminados planos de hierro o de acero sin alear, originarios
    de la antigua República Yugoslava de Macedonia, beneficiarios de un límite máximo
    arancelario previsto por el Reglamento (CE) nº 273/98
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2217/1999 av den 19 oktober 1999 om återinförande
