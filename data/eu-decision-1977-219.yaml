  content: Commission Decision of 3 March 1977 revoking Commission Decision 74/365/EEC
    provisionally authorizing the French Republic to prohibit the marketing in France
    of dwarf french bean seed of the variety 'Midas'
  type: main
- language: fr
  script: Latn
  content: '77/219/CEE: Décision de la Commission, du 3 mars 1977, abrogeant la décision
