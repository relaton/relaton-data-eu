  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2025/505, 19. märts 2025, millega muudetakse
    rakendusmäärust (EL) 2022/632, pikendades ajutisi meetmeid seoses Argentinast,
    Brasiiliast, Lõuna-Aafrikast, Uruguayst ja Zimbabwest pärit määratletud puuviljadega,
    et hoida ära taimekahjustaja Phyllosticta citricarpa (McAlpine) Van der Aa liitu
    sissetoomine ja liidu territooriumil levimine
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2025/505, annettu 19 päivänä
    maaliskuuta 2025, täytäntöönpanoasetuksen (EU) 2022/632 muuttamisesta siltä
    osin kuin on kyse tiettyjen Argentiinasta, Brasiliasta, Etelä-Afrikasta, Uruguaysta
    ja Zimbabwesta peräisin olevia hedelmiä koskevien väliaikaisten toimenpiteiden
    jatkamisesta tuhoojan Phyllosticta citricarpa (McAlpine) Van der Aa unioniin kulkeutumisen
    ja siellä leviämisen estämiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2025/505 ón gCoimisiún an 19 Márta
    2025 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2022/632 a mhéid a bhaineann
    le fadú a chur le bearta sealadacha i leith torthaí sonraithe de thionscnamh
    na hAirgintíne, na Brasaíle, na hAfraice Theas, Uragua agus na Siombáibe chun
    tabhairt isteach na lotnaide Phyllosticta citricarpa (McAlpine) Van der Aa i gcríoch
    an Aontais, agus a scaipeadh laistigh di, a chosc
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2025/505 оd 19. ožujka 2025. o izmjeni
    Provedbene uredbe (EU) 2022/632 u pogledu produljenja privremenih mjera za navedene
    plodove podrijetlom iz Argentine, Brazila, Južne Afrike, Urugvaja i Zimbabvea
    radi sprečavanja unošenja u Uniju i širenja unutar Unije štetnog organizma
    Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/505 végrehajtási rendelete (2025. március 19.)
    az (EU) 2022/632 végrehajtási rendeletnek a Phyllosticta citricarpa (McAlpine)
    Van der Aa károsító Unió területére történő behurcolásának és Unión
    belüli elterjedésének megelőzése érdekében az Argentínából, Brazíliából,
    Dél-Afrikából, Uruguayból és Zimbabwéből származó meghatározott gyümölcsökre
    vonatkozó ideiglenes intézkedések meghosszabbítása tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2025/505 della Commissione, del 19 marzo
    2025, che modifica il regolamento di esecuzione (UE) 2022/632 per quanto riguarda
    la proroga delle misure temporanee in relazione a frutti specificati originari
    dell’Argentina, del Brasile, del Sud Africa, dell’Uruguay e dello Zimbabwe
    per impedire l’introduzione e la diffusione nel territorio dell’Unione dell’organismo
    nocivo Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2025/505 (2025. gada 19. marts), ar
    ko attiecībā uz Argentīnas, Brazīlijas, Dienvidāfrikas, Urugvajas un Zimbabves
    izcelsmes norādītajiem augļiem noteikto pagaidu pasākumu pagarināšanu nolūkā
    nepieļaut kaitīgā organisma Phyllosticta citricarpa (McAlpine) Van der Aa ievešanu
    un izplatīšanos Savienības teritorijā groza Īstenošanas regulu (ES) 2022/632
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 19 d. Komisijos įgyvendinimo reglamentas (ES) 2025/505, kuriuo
    dėl nurodytiesiems Argentinos, Brazilijos, Pietų Afrikos, Urugvajaus ir Zimbabvės
    kilmės vaisiams taikomų laikinųjų priemonių, kuriomis siekiama neleisti patekti
    į Sąjungos teritoriją kenkėjui citrusinei filostiktai (Phyllosticta citricarpa
    (McAlpine) Van der Aa) ir joje išplisti, pratęsimo iš dalies keičiamas Įgyvendinimo
    reglamentas (ES) 2022/632
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/505 tad-19
    ta’ Marzu 2025 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2022/632
    fir-rigward tal-prolongazzjoni tal-miżuri temporanji fir-rigward ta’ frott
    speċifikat li joriġina mill-Arġentina, mill-Brażil, mill-Afrika t’Isfel,
    mill-Urugwaj u miż-Żimbabwe biex jipprevjenu l-introduzzjoni fit-territorju
    tal-Unjoni tal-pest Phyllosticta citricarpa (Mc Alpine) Van der Aa u t-tixrid
    tiegħu
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2025/505 van de Commissie van 19 maart 2025
    tot wijziging van Uitvoeringsverordening (EU) 2022/632 tot verlenging van de tijdelijke
    maatregelen met betrekking tot bepaalde vruchten van oorsprong uit Argentinië,
    Brazilië, Zuid-Afrika, Uruguay en Zimbabwe om het binnenbrengen in en de verspreiding
    binnen het grondgebied van de Unie van het plaagorganisme Phyllosticta citricarpa
    (McAlpine) Van der Aa te voorkomen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2025/505 z dnia 19 marca 2025 r.
    zmieniające rozporządzenie wykonawcze (UE) 2022/632 tymczasowe środki w odniesieniu
    do określonych owoców pochodzących z Argentyny, Brazylii, Republiki Południowej
    Afryki, Urugwaju i Zimbabwe w celu zapobieżenia wprowadzeniu na terytorium Unii
    i rozprzestrzenianiu się na nim agrofaga Phyllosticta citricarpa (McAlpine) Van
    der Aa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2025/505 da Comissão, de 19 de março de
    2025, que altera o Regulamento de Execução (UE) 2022/632 relativamente ao prolongamento
    das medidas temporárias no que diz respeito a frutos especificados originários
    da África do Sul, da Argentina, do Brasil, do Uruguai e do Zimbabué a fim de
    impedir a introdução e propagação no território da União da praga Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2025/505 al Comisiei din 19 martie
    2025 de modificare a Regulamentului de punere în aplicare (UE) 2022/632 al Comisiei
    în ceea ce privește măsurile temporare privind fructele specificate originare
    din Argentina, Brazilia, Africa de Sud, Uruguay și Zimbabwe pentru a preveni
    introducerea și răspândirea în Uniune a organismului dăunător Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2025/505 z 19. marca 2025, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2022/632, pokiaľ ide o predĺženie dočasných
    opatrení týkajúcich sa špecifikovaných ovocných plodov s pôvodom v Argentíne,
    Brazílii, Južnej Afrike, Uruguaji a Zimbabwe na zabránenie zavlečeniu škodlivého
    organizmu Phyllosticta citricarpa (Mc Alpine) Van der Aa na územie Únie a jeho
    šíreniu na tomto území
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2025/505 z dne 19. marca 2025 o spremembi
    Izvedbene uredbe (EU) 2022/632 glede podaljšanja začasnih ukrepov v zvezi z
    opredeljenim sadjem s poreklom iz Argentine, Brazilije, Južne Afrike, Urugvaja
    in Zimbabveja za preprečitev vnosa škodljivega organizma Phyllosticta citricarpa
    (Mc Alpine) Van der Aa na ozemlje Unije in njegovega širjenja na ozemlju Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2025/505 de la Comisión, de 19 de marzo
    de 2025, por el que se modifica el Reglamento de Ejecución (UE) 2022/632 en lo
    relativo a la prórroga de las medidas temporales respecto a los frutos especificados
    originarios de Argentina, Brasil, Sudáfrica, Uruguay y Zimbabue para prevenir
    la introducción y propagación en el territorio de la Unión de la plaga de Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2025/505 av den 19 mars 2025
    om ändring av genomförandeförordning (EU) 2022/632 vad gäller förlängning
    av de tillfälliga åtgärderna i fråga om angivna frukter med ursprung i Argentina,
    Brasilien, Sydafrika, Uruguay och Zimbabwe för att förhindra introduktion i
    och spridning inom unionens territorium av skadegöraren Phyllosticta citricarpa
    (McAlpine) Van der Aa
