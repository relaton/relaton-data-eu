title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/505 of 19 March 2025 amending
    Implementing Regulation (EU) 2022/632 as regards the prolongation of the temporary
    measures concerning specified fruits originating in Argentina, Brazil, South Africa,
    Uruguay and Zimbabwe to prevent the introduction into and the spread within the
    Union territory of the pest Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/505 de la Commission du 19 mars 2025
    modifiant le règlement d’exécution (UE) 2022/632 en ce qui concerne la prolongation
    des mesures temporaires à l’égard de certains fruits originaires d’Argentine,
    du Brésil, d’Afrique du Sud, d’Uruguay et du Zimbabwe visant à éviter l’introduction
    et la propagation sur le territoire de l’Union de l’organisme nuisible Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/505 der Kommission vom 19. März 2025
    zur Änderung der Durchführungsverordnung (EU) 2022/632 hinsichtlich der Verlängerung
    der befristeten Maßnahmen für spezifizierte Früchte mit Ursprung in Argentinien,
    Brasilien, Südafrika, Uruguay und Simbabwe zum Schutz des Unionsgebiets gegen
    die Einschleppung und Ausbreitung des Schädlings Phyllosticta citricarpa (McAlpine)
    Van der Aa
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2025/505 на Комисията
    от 19 март 2025 година за изменение на Регламент
    за изпълнение (ЕС) 2022/632 по отношение на удължаването
    на срока на действие на временните мерки относно
    посочените плодове с произход от Аржентина,
    Бразилия, Южна Африка, Уругвай и Зимбабве с
    цел предотвратяване на въвеждането и разпространението
    на територията на Съюза на вредителя Phyllosticta
    citricarpa (McAlpine) Van der Aa
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2025/505 ze dne 19. března 2025,
    kterým se mění prováděcí nařízení (EU) 2022/632, pokud jde o prodloužení
    platnosti dočasných opatření proti zavlékání škodlivého organismu Phyllosticta
    citricarpa (McAlpine) Van der Aa do Unie a proti jeho rozšiřování na území
    Unie, pokud jde o dotčené plody pocházející z Argentiny, Brazílie, Jižní
    Afriky, Uruguaye a Zimbabwe
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2025/505 af 19. marts 2025
    om ændring af gennemførelsesforordning (EU) 2022/632 om forlængelse af de midlertidige
    foranstaltninger med hensyn til bestemte frugter med oprindelse i Argentina, Brasilien,
    Sydafrika, Uruguay og Zimbabwe for at hindre indslæbning og spredning af skadegøreren
    Phyllosticta citricarpa (McAlpine) Van der Aa i Unionen
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2025/505 της Επιτροπής,
    της 19ης Μαρτίου 2025, για την τροποποίηση του
    εκτελεστικού κανονισμού (ΕΕ) 2022/632 όσον αφορά
    την παράταση της ισχύος των προσωρινών μέτρων
    σχετικά με συγκεκριμένους καρπούς καταγωγής
    Αργεντινής, Βραζιλίας, Νότιας Αφρικής, Ουρουγουάης
    και Ζιμπάμπουε με σκοπό την αποτροπή της εισαγωγής
