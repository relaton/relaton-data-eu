title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 1236/2012 of 19 December 2012 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 511/2010 on imports of certain
    molybdenum wires originating in the People’s Republic of China by imports of
    certain slightly modified molybdenum wires, containing by weight 97 % or more
    but less than 99,95 % of molybdenum, originating in the People’s Republic of
    China, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1236/2012 de la Commission du 19 décembre 2012 portant
    ouverture d’une enquête sur un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) n ° 511/2010 du Conseil sur
    les importations de certains fils en molybdène originaires de la République
    populaire de Chine par des importations de certains fils en molybdène légèrement
    modifiés, contenant, en poids, 97 % ou plus mais moins de 99,95 % de molybdène,
    originaires de la République populaire de Chine, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 1236/2012 der Kommission vom 19. Dezember 2012 zur
    Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit der
    Durchführungsverordnung (EU) Nr. 511/2010 des Rates eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren bestimmter Molybdändrähte mit Ursprung in der Volksrepublik
    China durch Einfuhren bestimmter geringfügig veränderter Molybdändrähte mit
    einem Molybdängehalt von 97 GHT oder mehr, aber weniger als 99,95 GHT, mit Ursprung
    in der Volksrepublik China und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 1236/2012 на Комисията от 19
