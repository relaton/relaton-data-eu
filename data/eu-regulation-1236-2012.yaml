    da República Popular da China, e que torna obrigatório o registo destas importações
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 1236/2012 al Comisiei din 19 decembrie 2012 de deschidere
    a unei anchete referitoare la o eventuală eludare a măsurilor antidumping instituite
    prin Regulamentul de punere în aplicare (UE) nr. 511/2010 al Consiliului la importurile
    de anumite sârme din molibden originare din Republica Populară Chineză prin
    importuri de anumite sârme din molibden cărora li s-au adus mici modificări,
    având în greutate minimum 97 %, dar mai puțin de 99,95 % molibden, și de supunere
    a acestor importuri înregistrării
  type: main
- language: sk
  script: Latn
