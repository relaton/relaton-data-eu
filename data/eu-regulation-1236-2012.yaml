  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 1236/2012 tad- 19 ta’ Diċembru 2012
    li jniedi investigazzjoni dwar iċ-ċirkomvenzjoni possibbli ta’ miżuri anti-dumping
    imposti bir-Regolament ta’ Implimentazzjoni tal-Kunsill (UE) Nru 511/2010 fuq
    importazzjonijiet ta’ ċerti wajers tal-molibdenu li joriġinaw fir-Repubblika
    Popolari taċ-Ċina bl-importazzjonijiet ta’ ċerti wajers tal-molibdenu kemxejn
