    preiskave glede možnega izogibanja protidampinškim ukrepom, uvedenim z Izvedbeno
    uredbo Sveta (EU) št. 511/2010 na uvoz nekaterih žic iz molibdena s poreklom
    iz Ljudske republike Kitajske, z uvozom nekaterih nekoliko spremenjenih žic iz
    molibdena, ki vsebujejo 97 mas. % ali več, vendar manj kot 99,95 mas. % molibdena,
    s poreklom iz Ljudske republike Kitajske, in o registraciji takšnega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 1236/2012 de la Comisión, de 19 de diciembre de 2012
    , por el que se abre una investigación sobre la posible elusión de las medidas
    antidumping impuestas por el Reglamento de Ejecución (UE) n ° 511/2010 del Consejo
    a las importaciones de determinados alambres de molibdeno originarios de la República
    Popular China mediante importaciones de determinados alambres de molibdeno ligeramente
    modificados, con un contenido igual o superior al 97 % e inferior al 99,95 % en
    peso de molibdeno, originarios de la República Popular China, y por el que se
    someten dichas importaciones a registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 1236/2012 av den 19 december 2012 om
    inledande av en undersökning beträffande ett eventuellt kringgående av de antidumpningsåtgärder
    som infördes genom rådets genomförandeförordning (EU) nr 511/2010 på import
    av viss molybdentråd med ursprung i Folkrepubliken Kina genom att viss, något
    ändrad molybdentråd innehållande minst 97 viktprocent men högst 99,95 viktprocent
    molybden, med ursprung i Folkrepubliken Kina har importerats och om registrering
    av sådan import
