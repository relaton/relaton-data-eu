    egyes molibdénhuzalok behozatalára elrendelt dömpingellenes intézkedéseknek
    a Kínai Népköztársaságból származó egyes, enyhén módosított, legalább
    97, azonban nem több mint 99,95 tömegszázalék molibdént tartalmazó molibdénhuzalok
