    tuonnissa neuvoston täytäntöönpanoasetuksella (EU) N:o 511/2010 käyttöön
    otettujen polkumyynnin vastaisten toimenpiteiden mahdollista kiertämistä tietynlaisten
    hieman muutettujen, Kiinan kansantasavallasta peräisin olevien molybdeenilankojen,
    joissa on vähintään 97 mutta alle 99,95 painoprosenttia molybdeeniä, tuonnilla
    koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
