  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 1236/2012 da Comissão, de 19 de dezembro de 2012
    , que inicia um inquérito sobre a eventual evasão às medidas anti-dumping instituídas
    pelo Regulamento de Execução (UE) n. ° 511/2010 do Conselho sobre as importações
    de determinados fios de molibdénio originários da República Popular da China
