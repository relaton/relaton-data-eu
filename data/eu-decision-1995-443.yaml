title:
- language: en
  script: Latn
  content: '95/443/EC: Commission Decision of 18 October 1995 amending Decision 93/402/EEC
    concerning animal health conditions and veterinary certification for imports of
    fresh meat from South American countries, to take account of certain meat from
    Uruguay'
  type: main
- language: fr
  script: Latn
  content: '95/443/CE: Décision de la Commission, du 18 octobre 1995, modifiant la
    décision 93/402/CEE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays d''Amérique du Sud, pour tenir compte de certaines viandes provenant
    d''Uruguay'
  type: main
- language: de
  script: Latn
  content: '95/443/EG: Entscheidung der Kommission vom 18. Oktober 1995 zur Änderung
    der Entscheidung 93/402/EWG zur Festlegung der veterinärrechtlichen Bedingungen
    und der Veterinärzeugnisse für die Einfuhr von frischem Fleisch aus einigen
    südamerikanischen Ländern unter besonderer Berücksichtigung von bestimmtem
    Fleisch aus Uruguay'
  type: main
- language: da
  script: Latn
  content: '95/443/EF: Kommissionens beslutning af 18. oktober 1995 om ændring af
    beslutning 93/402/EØF om sundhedsmæssige betingelser og udstedelse af sundhedscertifikat
    ved indførsel af fersk kød fra bestemte lande i Sydamerika med hensyn til kød
    fra Uruguay'
  type: main
- language: el
  script: Grek
  content: '95/443/ΕΚ: Απόφαση της Επιτροπής της 18ης Οκτωβρίου
    1995 για την τροποποίηση της απόφασης 93/402/ΕΟΚ
    περί των υγειονομικών όρων και της κτηνιατρικής
    πιστοποίησης που απαιτούνται για την εισαγωγή
    νωπών κρεάτων προερχόμενων από ορισμένες χώρες
    της Νότιας Αμερικής, έτσι ώστε να ληφθούν υπόψη
    ορισμένα κρέατα που προέρχονται από την Ουρουγουάη'
  type: main
- language: fi
  script: Latn
  content: '95/443/EY: Komission päätös, tehty 18 päivänä lokakuuta 1995, eläinten
    terveyttä koskevista edellytyksistä ja eläinlääkärintodistuksista tuoreen
    lihan tuonnissa tietyistä Etelä-Amerikan maista tehdyn päätöksen 93/402/ETY
    muuttamisesta tietyn Uruguaysta peräisin olevan lihan huomioon ottamiseksi'
  type: main
- language: it
  script: Latn
  content: '95/443/CE: Decisione della Commissione, del 18 ottobre 1995, che modifica
    la decisione 93/402/CEE relativa alle condizioni di polizia sanitaria ed alla
    certificazione veterinaria cui è subordinata l''importazione di carni fresche
    provenienti da taluni paesi dell''America del Sud, per tener conto di carni provenienti
    dall''Uruguay'
  type: main
- language: nl
  script: Latn
  content: '95/443/EG: Beschikking van de Commissie van 18 oktober 1995 houdende wijziging
    van Beschikking 93/402/EEG betreffende veterinairrechtelijke voorschriften en
    veterinaire certificering voor de invoer van vers vlees uit landen van Zuid-Amerika,
    om rekening te houden met bepaalde soorten vlees uit Uruguay'
  type: main
- language: pt
  script: Latn
  content: '95/443/CE: Decisão da Comissão, de 18 de Outubro de 1995, que altera
    a Decisão 93/402/CEE relativa às condições de polícia sanitária e à certificação
    veterinária requeridas para a importação de carne fresca proveniente de determinados
    países da América do Sul, com vista a ter em conta determinadas carnes provenientes
    do Uruguai'
  type: main
- language: es
  script: Latn
  content: '95/443/CE: Decisión de la Comisión, de 18 de octubre de 1995, por la
