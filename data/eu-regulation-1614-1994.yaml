title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1614/94 of 1 July 1994 re- etablishing the
    levying of the customs duties applicable to products falling within CN code 8509
    originating in China, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1614/94 de la Commission du 1er juillet 1994 portant
