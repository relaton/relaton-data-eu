title:
- language: en
  script: Latn
  content: Decision (EU) 2017/684 of the European Parliament and of the Council of
    5 April 2017 on establishing an information exchange mechanism with regard to
    intergovernmental agreements and non-binding instruments between Member States
    and third countries in the field of energy, and repealing Decision No 994/2012/EU
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2017/684 du Parlement européen et du Conseil du 5 avril
    2017 établissant un mécanisme d'échange d'informations en ce qui concerne les
    accords intergouvernementaux et les instruments non contraignants conclus entre
    des États membres et des pays tiers dans le domaine de l'énergie, et abrogeant
    la décision n° 994/2012/UE
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2017/684 des Europäischen Parlaments und des Rates vom
    5. April 2017 zur Einrichtung eines Mechanismus für den Informationsaustausch
    über zwischenstaatliche Abkommen und nicht verbindliche Instrumente zwischen
    Mitgliedstaaten und Drittländern im Energiebereich, und zur Aufhebung des Beschlusses
    Nr. 994/2012/EU
  type: main
