    за Бахрейн и Ливан в списъка на трети страни
    и части от тях, от които е разрешено въвеждането
    в Европейския съюз на живи еднокопитни и на
    сперма, яйцеклетки и ембриони от еднокопитни
    (нотифицирано под номер C(2011) 5863)'
  type: main
