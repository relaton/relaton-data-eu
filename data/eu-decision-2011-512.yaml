title:
- language: en
  script: Latn
  content: '2011/512/EU: Commission Implementing Decision of 18 August 2011 amending
    Annex I to Decision 2004/211/EC as regards the entries for Bahrain and Lebanon
    in the list of third countries and parts thereof from which the introduction into
    the Union of live equidae and semen, ova and embryos of the equine species are
    authorised (notified under document C(2011) 5863)'
  type: main
- language: fr
  script: Latn
  content: '2011/512/UE: Décision d’exécution de la Commission du 18 août 2011
    modifiant l’annexe I de la décision 2004/211/CE en ce qui concerne les mentions
    relatives à Bahreïn et au Liban figurant dans la liste des pays tiers et des
    parties de ces pays en provenance desquels l’introduction dans l’Union européenne
    d’équidés vivants et de sperme, d’ovules et d’embryons de l’espèce
    équine est autorisée [notifiée sous le numéro C(2011) 5863]'
  type: main
- language: de
  script: Latn
  content: '2011/512/EU: Durchführungsbeschluss der Kommission vom 18. August 2011
    zur Änderung des Anhangs I der Entscheidung 2004/211/EG hinsichtlich der Einträge
    zu Bahrain und zum Libanon in der Liste von Drittländern und Teilen von Drittländern,
    aus denen die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen
    und -embryonen in die Europäische Union zugelassen ist (Bekannt gegeben unter
    Aktenzeichen K(2011) 5863)'
  type: main
- language: bg
