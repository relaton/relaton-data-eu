    se Bahrajnu a Libanonu v seznamu třetích zemí a jejich částí, ze kterých
    je povolen dovoz živých koňovitých a spermatu, vajíček a embryí druhů
    koňovitých do Unie (oznámeno pod číslem K(2011) 5863)'
