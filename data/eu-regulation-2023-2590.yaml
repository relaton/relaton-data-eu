  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/2590 de la Comisión, de 13 de julio de 2023,
    por el que se completa el Reglamento (UE) 2019/2144 del Parlamento Europeo y del
    Consejo mediante el establecimiento de normas de desarrollo relativas a los procedimientos
    de ensayo y los requisitos técnicos específicos para la homologación de tipo
    de determinados vehículos de motor en lo que respecta a sus sistemas avanzados
    de advertencia de distracciones del conductor, y por el que se modifica dicho
    Reglamento
  type: main
