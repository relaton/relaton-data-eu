title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/2590 of 13 July 2023 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of certain motor vehicles with regard to their advanced
    driver distraction warning systems and amending that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/2590 de la Commission du 13 juillet 2023
    complétant le règlement (UE) 2019/2144 du Parlement européen et du Conseil
    en établissant des règles détaillées relatives aux procédures d’essai et
    aux prescriptions techniques spécifiques pour la réception par type des véhicules
    à moteur en ce qui concerne leurs systèmes avancés d’avertissement de distraction
    du conducteur et modifiant ledit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/2590 der Kommission vom 13. Juli 2023 zur
    Ergänzung der Verordnung (EU) 2019/2144 des Europäischen Parlaments und des
    Rates durch Festlegung detaillierter Vorschriften für die spezifischen Prüfverfahren
    und technischen Anforderungen für die Typgenehmigung von bestimmten Kraftfahrzeugen
    hinsichtlich ihrer hochentwickelten Warnsysteme bei nachlassender Konzentration
    des Fahrers sowie zur Änderung der genannten Verordnung
  type: main
- language: bg
  script: Cyrl
