    (ЕС) 2019/2144 на Европейския парламент и на Съвета
    чрез определяне на подробни правила относно
    специфичните процедури за изпитване и техническите
    изисквания за одобряването на типа на определени
    моторни превозни средства по отношение на
    усъвършенстваните им предупредителни системи
    за отклонено внимание на водача и за изменение
    на посочения регламент
  type: main
