id: EUDecision1978495
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 24 May 1978 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of cotton (other than gauze, terry
    fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle and other
    net fabrics), unbleached, falling within heading No ex 55.09 of the Common Customs
    Tariff (NIMEXE code 55.09-74), originating in Hungary and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/495/CEE: Décision de la Commission, du 24 mai 1978, autorisant la
    République italienne à exclure du traitement communautaire les tissus de coton
    (autres que les tissus à point de gaze, boucles du genre éponge, rubanerie,
    velours, peluches, tissus bouclés, tissus de chenille, tulles et tissus à mailles
    nouées) écrus, de la position Ex 55.09 du Tarif douanier commun (code Nimexe
    55.09-74), originaires de Hongrie et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 24. Mai 1978, mit der die Italienische
    Republik ermächtigt wird, aus Ungarn stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Gewebe aus Baumwolle (andere als Drehergewebe, Schlingengewebe
    [Frottiergewebe], Bänder, Samt, Plüsch, Schlingengewebe, Chenillegewebe, Tülle
    und geknüpfte Netzstoffe), roh, der Tarifnummer ex 55.09 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffer 55.09-74) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 24. maj 1978 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af bomuld (bortset
    fra drejervævet stof af bomuld, frotterstof, vævede bånd, fløjls-, plys- og
    chenillestoffer, tyl og knyttede netstoffer), ublegede, som henhører under pos.
    ex 55.09 (NIMEXE-kode 55.09-74) i den fælles toldtarif, har oprindelse i Ungarn
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 24 maggio 1978, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di cotone (diversi
    da quelli a punto di garza, ricci del tipo spugna, passamaneria, velluti, felpe,
    tessuti di ciniglia, tulli e tessuti a maglie annodate) greggi, della voce ex
    55.09 della tariffa doganale comune (codice Nimexe 55.09-74), originari dell'Ungheria
    e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 24 mei 1978 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van katoen (andere dan weefsels met gaasbinding, bad-
    of frotteerstof (lussendoek), lint, fluweel, pluche, lussenweefsel, chenilleweefsel,
    tule en filetweefsels), ongebleekt, van post ex 55.09 van het gemeenschappelijk
    douanetarief (NIMEXE-code 55.09-74), van oorsprong uit Hongarije en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
