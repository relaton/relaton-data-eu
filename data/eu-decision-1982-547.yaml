title:
- language: en
  script: Latn
  content: '82/547/EEC: Commission Decision of 27 July 1982 establishing that the
    apparatus described as ''PSI - Pressure Measurement System, consisting of: - Electronically
    Scanned Pressure Sensor, model ESP 32, - Digital Pressure Measurement System,
    model 780 B'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/547/CEE: Décision de la Commission, du 27 juillet 1982, constatant
    que l''importation de l''appareil dénommé "P.S.I. - Pressure Measurement System,
    consisting of: - Electronicaly Scanned Pressure Sensor, model ESP 32; - Digital
    Pressure Measurement System, model 780 B" ne peut être faite en franchise des
    droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/547/EWG: Entscheidung der Kommission vom 27. Juli 1982, mit der festgestellt
    wird, daß das Gerät ,,P.S.I. - Pressure Measurement System, bestehend aus: Electronically
    Scanned Pressure Sensor, model ESP32, - Digital Pressure measurement System, model
    780B" , nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt
    werden kann'
  type: main
- language: da
  script: Latn
  content: '82/547/EØF: Kommissionens beslutning af 27. juli 1982 om fastslåelse
    af, at indførsel af apparatet "P.S.I. - Pressure Measurement System, consisting
    of: Electronically Scanned Pressure Sensor, model ESP32 - Digital Pressure Measurement
    System, model 780B" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/547/EOK: Απόφαση τής Επιτροπής τής 27ης Ιουλίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «P. S. I. — Pressure Measurement System, consisting
    of: — Electronically Scanned Pressure Sensor, model ESP 32, — Digital Pressure
    Measurement System, model 780 B» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/547/CEE: Decisione della Commissione, del 27 luglio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "PSI - Pressure Measurement System,
    consisting of: - Electronically Scanned Pressure Sensor, model ESP 32 - Digital
    Pressure Measurement System, model 780 B" non può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/547/EEG: Beschikking van de Commissie van 27 juli 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,PSI - Pressure Measurement System, consisting
    of: - Electronically Scanned Pressure Sensor, model ESP 32, - Digital Pressure
    Measurement System, model 780 B" niet met vrijstelling van de rechten van het
    gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
