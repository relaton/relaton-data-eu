title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2014/93 of 23 July 1993 determining the
    extent to which applications lodged in July 1993 for import licences for certain
    pigmeat products under the regime provided for by the Bilateral Agreements on
    agriculture concluded between the Community, of the one part, and Austria and
    Finland, of the other part, can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2014/93 de la Commission, du 23 juillet 1993, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1993 pour certains produits à base de viande de porc, dans le cadre du
    régime prévu par les accords bilatéraux agricoles conclus entre la Communauté,
    d'une part, et l'Autriche et la Finlande, d'autre part, peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2014/93 der Kommission vom 23. Juli 1993 über die
    Festsetzung des Umfangs, in dem die im Juli 1993 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der bilateralen
    landwirtschaftlichen Abkommen zwischen der Gemeinschaft einerseits und Österreich
    sowie Finnland andererseits genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2014/93 af 23. juli 1993 om fastsættelse
    af, i hvilket omfang det er muligt at imødekomme de ansøgninger, som blev indgivet
    i juli 1993 om importlicenser for visse svinekødsprodukter i forbindelse med
    den ordning, der er fastsat i de bilaterale landbrugsaftaler, som er indgået
    mellem Fællesskabet på den ene side og Østrig og Finland på den anden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2014/93 της Επιτροπής
    της 23ης Ιουλίου 1993 περί καθορισμού ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές αιτήσεις
    που υποβλήθηκαν τον Ιούλιο του 1993 για άδειες
    εισαγωγής χοιρείου κρέατος βάσει του καθεστώτος
    που προβλέπεται από τις διμερείς γεωργικές
    συμφωνίες, οι οποίες συνήφθηκαν μεταξύ της
    Κοινότητας, αφενός, και της Αυστρίας και της
    Φινλανδίας, αφετέρου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2014/93 della Commissione, del 23 luglio 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1993 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi bilaterali agricoli conclusi
    tra la Comunità, da un lato, e l'Austria e la Finlandia, dall'altro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2014/93 van de Commissie van 23 juli 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in juli 1993 worden ingediend
    op grond van de regeling die is vastgesteld in de bilaterale landbouwovereenkomsten
    tussen enerzijds de Gemeenschap en anderzijds respectievelijk Oostenrijk en Finland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2014/93 da Comissão, de 23 de Julho de 1993, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Julho de
    1993 ao abrigo do regime previsto nos acordos bilaterais agrícolas concluídos
    entre, por um lado, a Comunidade, por outro, a Áustria e a Finlândia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2014/93 de la Comisión, de 23 de julio de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de julio de 1993, al amparo del régimen previsto en los Acuerdos agrarios
    bilaterales celebrados entre la Comunidad por una parte, y Austria y Finlandia,
    por otra
