title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2016/1217 of 22 July 2016 authorising
    the placing on the market of products containing, consisting of, or produced from
    genetically modified soybean MON 87705 × MON 89788 (MON-877Ø5-6 × MON-89788-1)
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2016) 4582)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2016/1217 de la Commission du 22 juillet 2016
