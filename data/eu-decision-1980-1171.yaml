title:
- language: en
  script: Latn
  content: '80/1171/EEC: Commission Decision of 1 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the United Kingdom of expenditure incurred
    during 1979 on annuities relating to measures to encourage the cessation of farming
    and the reallocation of utilized agricultural area for the purpose of structural
    improvement (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1171/CEE: Décision de la Commission, du 1er décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume-Uni des dépenses effectuées pendant
    l''année 1979 pour les indemnités relatives à l''encouragement à la cessation
    de l''activitité agricole et à l''affectation de la superficie agricole utilisée
    à des fins d''amélioration des structures (Le texte en langue anglaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/1171/EWG: Entscheidung der Kommission vom 1. Dezember 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genutzten Flächen für Zwecke der Strukturverbesserung
    durch den EAGFL, Abteilung Ausrichtung, an das Vereinigte Königreich (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1171/EØF: Kommissionens beslutning af 1. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til Det forenede Kongerige af de udgifter,
    som er afholdt i løbet af året 1979 til godtgørelser vedrørende støtte til
    ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til
    strukturforbedringsformål (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1171/CEE: Decisione della Commissione, del 1 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno Unito delle spese
    effettuate nel 1979 per le indennità concernenti l''incoraggiamento alla cessazione
    dell''attività agricola e alla destinazione della superficie agricola utilizzata
    a scopi di miglioramento delle strutture (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1171/EEG: Beschikking van de Commissie van 1 december 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de in het jaar 1979 door
    het Verenigd Koninkrijk gedane uitgaven voor uitkeringen ter bevordering van de
    bedrijfsbeëindiging in de landbouw en van de aanwending van cultuurgrond tot
    verbetering van de structuur (Slechts de tekst in de Engelse taal is authentiek)'
