    mnaqqsin ta' VAT lil ċerti servizzi ta' xogħol intensiv
  type: main
- language: nl
  script: Latn
  content: Richtlĳn 2004/15/EG van de Raad van 10 februari 2004 tot wĳziging van
    Richtlĳn 77/388/EEG ter verlenging van de termĳn tĳdens welke de lidstaten
    kunnen worden gemachtigd een verlaagd BTW-tarief toe te passen op bepaalde arbeidsintensieve
    diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 2004/15/WE z dnia 10 lutego 2004 r. zmieniająca dyrektywę
    nr 388/77/EWG w celu rozszerzenia możliwości stosowania przez Państwa Członkowskie
    obniżonej stawki podatku VAT do niektórych pracochłonnych usług
  type: main
- language: pt
  script: Latn
  content: Directiva 2004/15/CE do Conselho, de 10 de Fevereiro de 2004, que altera
    a Directiva 77/388/CEE a fim de prolongar a possibilidade de autorizar os Estados-Membros
    a aplicar taxas de IVA reduzidas a certos serviços de grande intensidade do factor
    trabalho
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 2004/15/ES z 10. februára 2004, ktorou sa mení a dopĺňa
    smernica 77/388/EHS s cieľom predĺžiť členským štátom možnosť uplatňovať
    znížené sadzby dane z pridanej hodnoty na určité služby s vysokým podielom
    ľudskej práce
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 2004/15/ES z dne 10. februarja 2004 o spremembi Direktive
    77/388/EGS za podaljšanje možnosti, ki državam članicam omogoča uporabo nižjih
    stopenj DDV za nekatere delovno intenzivne storitve
  type: main
- language: es
  script: Latn
  content: Directiva 2004/15/CE del Consejo, de 10 de febrero de 2004, por la que
    se modifica la Directiva 77/388/CEE con el fin de prorrogar la facultad de autorizar
    a los Estados miembros a aplicar un tipo reducido de IVA a algunos servicios de
    gran intensidad de mano de obra
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 2004/15/EG av den 10 februari 2004 om ändring av direktiv
