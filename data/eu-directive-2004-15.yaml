title:
- language: en
  script: Latn
  content: Council Directive 2004/15/EC of 10 February 2004 amending Directive 77/388/EEC
    to extend the facility allowing Member States to apply reduced rates of VAT to
    certain labour-intensive services
  type: main
- language: fr
  script: Latn
  content: Directive 2004/15/CE du Conseil du 10 février 2004 modifiant la directive
    77/388/CEE en vue de proroger la faculté d'autoriser les États membre à appliquer
    des taux réduits de TVA pour certains services à forte intensité de main-d'œuvre
  type: main
- language: de
  script: Latn
  content: Richtlinie 2004/15/EG des Rates vom 10. Februar 2004 zur Änderung der
    Richtlinie 77/388/EWG mit dem Ziel der Verlängerung der Möglichkeit, die Mitgliedstaaten
    zur Anwendung ermäßigter MwSt.-Sätze für bestimmte arbeitsintensive Dienstleistungen
    zu ermächtigen
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 2004/15/ES ze dne 10. února 2004, kterou se mění směrnice
    77/388/EHS a prodlužuje se možnost členských států uplatňovat snížené
    sazby DPH na určité služby s vysokým podílem lidské práce
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 2004/15/EF af 10. februar 2004 om ændring af direktiv
    77/388/EØF til forlængelse af muligheden for at bemyndige medlemsstaterne til
    at anvende en nedsat momssats for visse arbejdskraftintensive tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 2004/15/ΕΚ του Συμβουλίου, της 10ης Φεβρουαρίου
    2004, για την τροποποίηση της οδηγίας 77/388/ΕΟΚ
    με σκοπό να παραταθεί η δυνατότητα να επιτρέπεται
    στα κράτη μέλη να εφαρμόζουν μειωμένους συντελεστές
    ΦΠΑ σε ορισμένες υπηρεσίες υψηλής έντασης
    εργατικού δυναμικού
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 2004/15/EÜ, 10. veebruar 2004, millega muudetakse direktiivi
    77/388/EMÜ, et anda liikmesriikidele võimalus jätkata vähendatud käibemaksumäärade
    kohaldamist teatavate töömahukate teenuste suhtes
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 2004/15/EY, annettu 10 päivänä helmikuuta 2004,
    direktiivin 77/388/ETY muuttamisesta tarkoituksin jatkaa mahdollisuutta sallia
    jäsenvaltioiden soveltaa alennettuja arvonlisäverokantoja tiettyihin erityisen
    työvaltaisiin palveluihin
  type: main
- language: hu
  script: Latn
  content: A Tanács 2004/15/EK irányelve (2004. február 10.) az egyes munkaigényes
    szolgáltatásokra a tagállamok részéről kedvezményes hozzáadottértékadó-mérték
    alkalmazását megengedő lehetőség meghosszabbítása céljából a 77/388/EGK
    irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2004/15/CE del Consiglio, del 10 febbraio 2004, che modifica
