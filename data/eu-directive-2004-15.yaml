    membri ad applicare un'aliquota IVA ridotta su taluni servizi ad alta intensità
    di lavoro
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 2004/15/EK (2004. gada 10. februāris), ar ko groza
