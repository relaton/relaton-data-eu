title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 octobre 1972, portant octroi du concours
    du FSE, prévu à l'article 125 du Traité, au bénéfice de la République fédérale
    d'Allemagne pour des dépenses relatives à des opérations de rééducation professionnelle
    effectuées par la "Bundesanstalt für Arbeit", la "Bundesknappschaft", les "Berufsgenossenschaften"
    et les organismes d'assurances sociales des travailleurs
  type: main
- language: de
  script: Latn
  content: '72/387/EWG: Entscheidung der Kommission vom 17. Oktober 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an die
    Bundesrepublik Deutschland zu Aufwendungen für von der Bundesanstalt für Arbeit,
    der Bundesknappschaft, den Berufsgenossenschaften und den Arbeiterrentenversicherungsträgern
    durchgeführte Berufsumschulungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/387/CEE: Decisione della Commissione, del 17 ottobre 1972, recante
    concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, alla Repubblica federale di Germania, per spese concernenti
    operazioni di riqualificazione professionale effettuate dalla «Bundesanstalt
    für Arbeit», dalla «Bundesknappschaft», dalle «Berufsgenossenschaften» e
    dagli enti di assicurazione sociale dei lavoratori'
  type: main
- language: nl
  script: Latn
  content: '72/387/EEG: Beschikking van de Commissie van 17 oktober 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van de Bondsrepubliek Duitsland voor door de "Bundesanstalt
    für Arbeit", de "Bundesknappschaft", de "Berufsgenossenschaften" en de uitvoeringsorganen
    van de sociale werknemersverzekeringen gemaakte herscholingskosten'
  type: main
