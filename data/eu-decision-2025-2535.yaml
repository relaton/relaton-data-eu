id: EUDecision20252535
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2025/2535 of 27 November 2025 supplementing Decision
    (EU) 2020/2059 and establishing the position to be taken on behalf of the European
    Union within the Trade Committee established under the Interim Partnership Agreement
    between the European Community, of the one part, and the Pacific States, of the
    other part, as regards the amendment of certain provisions of Protocol II concerning
    the definition of the concept of ‘originating products’ and methods of administrative
    cooperation, as regards cumulation with neighbouring developing countries
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/2535 du Conseil du 27 novembre 2025 complétant la
    décision (UE) 2020/2059 et établissant la position à prendre, au nom de l’Union
    européenne, au sein du comité «Commerce» institué par l’accord de partenariat
    intérimaire entre la Communauté européenne, d’une part, et les États du
    Pacifique, d’autre part, en ce qui concerne la modification de certaines dispositions
    du protocole II concernant la définition de la notion de «produits originaires»
    et les méthodes de coopération administrative, pour ce qui est du cumul dans
    les pays en développement voisins
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2025/2535 des Rates vom 27. November 2025 zur Ergänzung
    des Beschlusses (EU) 2020/2059 und zur Festlegung des im Namen der Europäischen
    Union im durch das Interims-Partnerschaftsabkommen zwischen der Europäischen
    Gemeinschaft einerseits und den Pazifik-Staaten andererseits eingesetzten Handelsausschuss
    betreffend die Annahme der Änderung bestimmter Bestimmungen des Protokolls II
    über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“ oder „Ursprungserzeugnisse“
    und über die Methoden der Zusammenarbeit der Verwaltungen zu vertretenden Standpunkts
    hinsichtlich der Kumulierung mit benachbarten Entwicklungsländern
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2025/2535 на Съвета от 27 ноември
    2025 година за допълнение на Решение (ЕС) 2020/2059
    и за определяне на позицията, която трябва
    да се заеме от името на Европейския съюз в рамките
    на Комитета по търговия, създаден по силата
    на Временното споразумение за партньорство
    между Европейската общност, от една страна,
    и държавите от Тихоокеанския басейн, от друга
    страна, във връзка с изменението на някои разпоредби
    на протокол II относно определението на понятието
    „продукти с произход“ и методите на административно
    сътрудничество, по отношение на кумулацията
    със съседните развиващи се държави
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2025/2535 ze dne 27. listopadu 2025, kterým se doplňuje
    rozhodnutí (EU) 2020/2059 a stanoví postoj, který má být zaujat jménem Evropské
    unie ve Výboru pro obchod zřízeném na základě Prozatímní dohody o partnerství
    mezi Evropským společenstvím na jedné straně a tichomořskými státy na
    straně druhé, pokud jde o změnu některých ustanovení Protokolu II o definici
    pojmu „původní produkty“ a o metodách správní spolupráce, pokud jde
    o kumulaci se sousedními rozvojovými zeměmi
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2025/2535 af 27. november 2025 om supplering af
    afgørelse (EU) 2020/2059 og om fastlæggelse af den holdning, der skal indtages
    på Den Europæiske Unions vegne i Handelsudvalget, der er nedsat i henhold til
    den foreløbige partnerskabsaftale mellem Det Europæiske Fællesskab på den
    ene side og Stillehavslandene på den anden side, til ændringerne af visse bestemmelser
    i protokol II om definition af begrebet »produkter med oprindelsesstatus« og
    metoderne for administrativt samarbejde for så vidt angår kumulation med naboudviklingslande
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2025/2535 του Συμβουλίου, της 27ης
    Νοεμβρίου 2025, για τη συμπλήρωση της απόφασης
    (ΕΕ) 2020/2059 και για τη θέση που πρέπει να ληφθεί,
    εξ ονόματος της Ευρωπαϊκής Ένωσης, στο πλαίσιο
    της επιτροπής εμπορίου που συστάθηκε με την
    ενδιάμεση συμφωνία εταιρικής σχέσης μεταξύ
    της Ευρωπαϊκής Κοινότητας, αφενός, και των
    κρατών του Ειρηνικού, αφετέρου, όσον αφορά
    την τροποποίηση ορισμένων διατάξεων του πρωτοκόλλου
    II σχετικά με τον ορισμό της έννοιας «καταγόμενα
    προϊόντα» ή «προϊόντα καταγωγής» και τις μεθόδους
    διοικητικής συνεργασίας, όσον αφορά τη σώρευση
    με γειτονικές αναπτυσσόμενες χώρες
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2025/2535, 27. november 2025, millega täiendatakse
    otsust (EL) 2020/2059 ja määratakse kindlaks Euroopa Liidu nimel võetav seisukoht
    ühelt poolt Euroopa Ühenduse ja teiselt poolt Vaikse ookeani piirkonna riikide
    vahelise majanduspartnerluse vahelepingu alusel moodustatud kaubanduskomitees
    seoses II protokolli („päritolustaatusega toodete“ mõiste ja halduskoostöö
    meetodite kohta) teatavate sätete muutmisega kumulatsiooni osas seoses naaberarengumaadega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2025/2535, annettu 27 päivänä marraskuuta 2025,
    päätöksen (EU) 2020/2059 täydentämisestä sekä Euroopan yhteisön ja Tyynenmeren
    valtioiden välisellä väliaikaisella kumppanuussopimuksella perustetussa kauppakomiteassa
    Euroopan unionin puolesta otettavasta kannasta käsitteen ”alkuperätuotteet”
    määrittelyä ja hallinnollisen yhteistyön menetelmiä koskevan pöytäkirjan
    II tiettyjen määräysten muuttamiseen siltä osin kuin on kyse kumulaatiosta
    naapureina olevien kehitysmaiden kanssa
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2025/2535 ón gComhairle an 27 Samhain 2025 lena bhforlíontar
    Cinneadh (AE) 2020/2059 agus lena mbunaítear an seasamh atá le glacadh thar
    ceann an Aontais Eorpaigh sa Choiste um Thrádáil arna bhunú faoin gComhaontú
    Comhpháirtíochta Eatramhach idir an Comhphobal Eorpach, de pháirt, agus na
    Stáit san Aigéan Ciúin, den pháirt eile, a mhéid a bhaineann le forálacha
    áirithe de Phrótacal II a leasú maidir le sainmhíniú an choincheapa ‘táirgí
    tionscnaimh’ agus modhanna comhair riaracháin, a mhéid a bhaineann le carnadh
    le tíortha comharsanacha atá i mbéal forbartha
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2025/2535 od 27. studenog 2025. o dopuni Odluke (EU)
    2020/2059 i o utvrđivanju stajališta koje treba zauzeti u ime Europske unije
    u okviru Odbora za trgovinu osnovanog na temelju Privremenog sporazuma o partnerstvu
    između Europske zajednice, s jedne strane, i pacifičkih država, s druge strane,
    u pogledu izmjene određenih odredaba Protokola II. o definiciji pojma „proizvodi
    s podrijetlom” i metodama administrativne suradnje, u pogledu kumulacije sa
    susjednim zemljama u razvoju
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2025/2535 határozata (2025. november 27.) az (EU) 2020/2059
    határozat kiegészítéséről és az egyrészről az Európai Közösség, másrészről
    a csendes-óceáni államok közötti átmeneti partnerségi megállapodással
    létrehozott kereskedelmi bizottságban a „származó termék” fogalmának
    meghatározásáról és a közigazgatási együttműködés módszereiről szóló
    II. jegyzőkönyv egyes rendelkezéseinek módosítása tekintetében az Európai
    Unió által képviselendő álláspont meghatározásáról a szomszédos fejlődő
    országokkal való kumuláció tekintetében
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2025/2535 del Consiglio, del 27 novembre 2025, che integra
    la decisione (UE) 2020/2059 e stabilisce la posizione da adottare a nome dell’Unione
    europea in sede di comitato per il commercio istituito dall’accordo di partenariato
    interinale tra la Comunità europea, da una parte, e gli Stati del Pacifico, dall’altra,
    in relazione alla modifica di talune disposizioni del protocollo II relativamente
    alla definizione della nozione di «prodotti originari» e ai metodi di cooperazione
    amministrativa, per quanto riguarda il cumulo con i paesi in via di sviluppo vicini
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2025/2535 (2025. gada 27. novembris), ar ko papildina
    Lēmumu (ES) 2020/2059 un nosaka nostāju, kas Eiropas Savienības vārdā jāieņem
    Tirdzniecības komitejā, kura izveidota saskaņā ar Partnerattiecību pagaidu
    nolīgumu starp Eiropas Kopienu, no vienas puses, un Klusā okeāna valstīm,
    no otras puses, par konkrētu noteikumu grozīšanu nolīguma II protokolā par
    jēdziena “noteiktas izcelsmes ražojumi” definīciju un administratīvās
    sadarbības metodēm attiecībā uz kumulāciju ar kaimiņos esošajām jaunattīstības
    valstīm
  type: main
- language: lt
  script: Latn
  content: 2025 m. lapkričio 27 d. Tarybos sprendimas (ES) 2025/2535, kuriuo papildomas
    Sprendimas (ES) 2020/2059 ir nustatoma pozicija, kurios Europos Sąjungos vardu
    turi būti laikomasi Prekybos komitete, įsteigtame Europos bendrijos ir Ramiojo
    vandenyno valstybių laikinuoju partnerystės susitarimu, dėl tam tikrų II protokolo
    „Dėl sąvokos „produktų kilmė“ apibrėžties ir administracinio bendradarbiavimo
    būdų“ nuostatų pakeitimo, dėl kumuliacijos su kaimyninėmis besivystančiomis
    šalimis
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2025/2535 tas-27 ta’ Novembru 2025 li tissupplimanta
    d-Deċiżjoni (UE) 2020/2059 u li tistabbilixxi l-pożizzjoni li għandha tittieħed
    f’isem l-Unjoni Ewropea fi ħdan il-Kumitat tal-Kummerċ stabbilit mill-Ftehim
    Interim ta’ Sħubija bejn il-Komunità Ewropea minn naħa waħda, u l-Istati
    tal-Paċifiku, min-naħa l-oħra, rigward l-emendar ta’ ċerti dispożizzjonijiet
    tal-Protokoll II dwar id-definizzjoni tal-kunċett ta’ “prodotti oriġinarji”
    u l-metodi ta’ kooperazzjoni amministrattiva, fir-rigward tal-akkumulazzjoni
    ma’ pajjiżi ġirien li qed jiżviluppaw
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2025/2535 van de Raad van 27 november 2025 tot aanvulling
    van Besluit (EU) 2020/2059 en tot vaststelling van het namens de Europese Unie
    in te nemen standpunt in het Handelscomité dat is opgericht krachtens de tussentijdse
    partnerschapsovereenkomst tussen de Europese Gemeenschap, enerzijds, en de staten
    in de Stille Oceaan, anderzijds, met betrekking tot de wijziging van een aantal
    bepalingen van Protocol II betreffende de definitie van het begrip “producten
    van oorsprong” en methoden van administratieve samenwerking, wat cumulatie met
    naburige ontwikkelingslanden betreft
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2025/2535 z dnia 27 listopada 2025 r. w sprawie uzupełnienia
    decyzji (UE) 2020/2059 i określenia stanowiska, które ma być zajęte w imieniu
    Unii Europejskiej w ramach Komitetu ds. Handlu ustanowionego na mocy Umowy przejściowej
    o partnerstwie między Wspólnotą Europejską, z jednej strony, a państwami
    Pacyfiku, z drugiej strony, w odniesieniu do zmiany niektórych postanowień protokołu
    II dotyczącego definicji pojęcia „produkty pochodzące” oraz metod współpracy
    administracyjnej, odnoszących się do kumulacji z sąsiadującymi krajami rozwijającymi
    się
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2025/2535 do Conselho, de 27 de novembro de 2025, que complementa
    a Decisão (UE) 2020/2059 do Conselho e define a posição a tomar em nome da
    União Europeia no âmbito do Comité de Comércio criado ao abrigo do Acordo
    de Parceria provisório entre a Comunidade Europeia, por um lado, e os Estados
    do Pacífico, por outro, no que diz respeito à alteração de certas disposições
    do Protocolo II relativo à definição da noção de «produtos originários»
    e métodos de cooperação administrativa, no que se refere à acumulação com
    países vizinhos em desenvolvimento
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2025/2535 a Consiliului din 27 noiembrie 2025 de completare
    a Deciziei (UE) 2020/2059 și de stabilire a poziției care urmează să fie adoptată
    în numele Uniunii Europene în cadrul Comitetului pentru comerț înființat
    prin Acordul interimar de parteneriat dintre Comunitatea Europeană, pe de o parte,
    și statele din Pacific, pe de altă parte, în ceea ce privește modificarea
    anumitor dispoziții din protocolul II privind definirea noțiunii de „produse
    originare” și metodele de cooperare administrativă, în ceea ce privește
    cumulul cu țările în curs de dezvoltare învecinate
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2025/2535 z 27. novembra 2025, ktorým sa nahrádza
    rozhodnutie (EÚ) 2020/2059 a stanovuje pozícia, ktorá sa má v mene Európskej
    únie zaujať vo Výbore pre obchod zriadenom Dočasnou dohodou o partnerstve
    medzi Európskym spoločenstvom na jednej strane a tichomorskými štátmi na
    druhej strane, pokiaľ ide o zmenu určitých ustanovení Protokolu II týkajúceho
    sa vymedzenia pojmu „výrobky s pôvodom“ a metód administratívnej spolupráce,
    pokiaľ ide o kumuláciu so susednými rozvojovými krajinami
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/2535 z dne 27. novembra 2025 o dopolnitvi Sklepa
    (EU) 2020/2059 in o določitvi stališča, ki se v imenu Evropske unije zastopa
    v Odboru za trgovino, ustanovljenem z Začasnim sporazumom o partnerstvu med Evropsko
    skupnostjo na eni strani in pacifiškimi državami na drugi strani, glede sprememb
    nekaterih določb Protokola II o opredelitvi pojma „izdelki s poreklom“ in
    načinu upravnega sodelovanja, kar zadeva kumulacijo s sosednjimi državami v
    razvoju
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/2535 del Consejo, de 27 de noviembre de 2025, por la
    que se completa la Decisión (UE) 2020/2059 y por la que se establece la posición
    que debe adoptarse, en nombre de la Unión Europea, en el Comité de Comercio
    creado en virtud del Acuerdo de Asociación Interino entre la Comunidad Europea,
    por una parte, y los Estados del Pacífico, por otra, con respecto a la modificación
    de determinadas disposiciones del Protocolo II relativo a la definición del concepto
    de «productos originarios» y a los métodos de cooperación administrativa,
    en lo relativo a la acumulación con países en desarrollo vecinos
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/2535 av den 27 november 2025 om komplettering
    av beslut (EU) 2020/2059 och om fastställande av den ståndpunkt som ska intas
    på Europeiska unionens vägnar i den handelskommitté som inrättats genom interimsavtalet
    om partnerskap mellan Europeiska gemenskapen, å ena sidan, och Stillahavsstaterna,
    å andra sidan, beträffande ändringen av vissa bestämmelser i protokoll II
    om definition av begreppet ursprungsprodukter och metoder för administrativt
    samarbete, vad gäller kumulation med angränsande utvecklingsländer
  type: main
