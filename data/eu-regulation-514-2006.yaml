    dos cereais para intervenção em determinados Estados-Membros na campanha de
    2005/2006
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 514/2006 z 30. marca 2006 , ktorým sa ustanovuje
    výnimka z nariadenia (ES) č. 824/2000, pokiaľ ide o termín dodávky obilnín
    na intervenciu v niektorých členských štátoch v hospodárskom roku 2005/2006
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 514/2006 z dne 30. marca 2006 o odstopanju od
