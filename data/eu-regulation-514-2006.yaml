title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 514/2006 of 30 March 2006 derogating from
    Regulation (EC) No 824/2000 as regards the period for delivering cereals into
    intervention in some Member States in the 2005/06 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 514/2006 de la Commission du 30 mars 2006 dérogeant
    au règlement (CE) n o 824/2000 en ce qui concerne le délai de livraison des
    céréales à l’intervention dans certains États membres pour la campagne 2005/2006
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 514/2006 der Kommission vom 30. März 2006 zur Abweichung
