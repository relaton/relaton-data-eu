    do agencji interwencyjnych w niektórych państwach członkowskich w roku gospodarczym
    2005/2006
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 514/2006 da Comissão, de 30 de Março de 2006 ,
