    dei cereali all’intervento in taluni Stati membri per la campagna 2005/2006
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 514/2006 ( 2006. gada 30. marts ), ar ko 2005./2006.
