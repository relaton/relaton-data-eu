id: EUDirective198276
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 82/76/EEC of 26 January 1982 amending Directive 75/362/EEC
    concerning the mutual recognition of diplomas, certificates and other evidence
    of formal qualifications in medicine, including measures to facilitate effective
    exercise of the right of establishment and freedom to provide services and Directive
    75/363/EEC concerning the coordination of provisions laid down by law, regulation
    or administrative action in respect of activities of doctors
  type: main
- language: fr
  script: Latn
  content: Directive 82/76/CEE du Conseil, du 26 janvier 1982, modifiant la directive
    75/362/CEE visant à la reconnaissance mutuelle des diplômes, certificats et
    autres titres de médecin et comportant des mesures destinées à faciliter l'exercice
    effectif du droit d'établissement et de libre prestation de services, ainsi que
    de la directive 75/363/CEE visant à la coordination des dispositions législatives,
    réglementaires et administratives concernant les activités du médecin
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/76/EWG des Rates vom 26. Januar 1982 zur Änderung der Richtlinie
    75/362/EWG für die gegenseitige Anerkennung der Diplome, Prüfungszeugnisse und
    sonstigen Befähigungsnachweise des Arztes und für Maßnahmen zur Erleichterung
    der tatsächlichen Ausübung des Niederlassungsrechts und des Rechts auf freien
    Dienstleistungsverkehr sowie der Richtlinie 75/363/EWG zur Koordinierung der Rechts-
    und Verwaltungsvorschriften für die Tätigkeiten des Arztes
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 82/76/EØF af 26. januar 1982 om ændring af direktiv
    75/362/EØF om gensidig anerkendelse af eksamensbeviser, certifikater og andre
    kvalifikationsbeviser, som skal lette den faktiske udøvelse af retten til etablering
    og fri udveksling af tjenesteydelser, og om ændring af direktiv 75/363/EØF om
    samordning af de administrativt eller ved lov fastsatte bestemmelser om virksomhed
    som læge
  type: main
- language: el
  script: Grek
  content: Οδηγία 82/76/EOK του Συμβουλίου της 26ης Ιανουαρίου
    1982 περί τροποποιήσεως της οδηγίας 75/362/EOK περί
    αμοιβαίας αναγνωρίσεως των διπλωμάτων, πιστοποιητικών
    και άλλων τίτλων ιατρικής, και περί των μέτρων
    προς διευκόλυνση της πραγματικής ασκήσεως
    του δικαιώματος εγκαταστάσεως και του δικαιώματος
    της ελεύθερης παροχής υπηρεσιών, καθώς και
    της οδηγίας 75/363/EOK περί του συντονισμού των
    νομοθετικών, κανονιστικών και διοικητικών
    διατάξεων που αφορούν τις δραστηριότητες των
    ιατρών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 82/76/ETY, annettu 26 päivänä tammikuuta 1982,
    lääketieteen tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta
    osoittavien asiakirjojen vastavuoroisesta tunnustamisesta sekä toimenpiteistä
    sijoittautumisvapauden ja palvelujen tarjoamisen vapauden tehokkaan käyttämisen
    helpottamiseksi annetun direktiivin 75/362/ETY ja lääkärintointa koskevien
    lakien, asetusten ja hallinnollisten määräysten yhteensovittamisesta annetun
    direktiivin 75/363/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Direttiva 82/76/CEE del Consiglio, del 26 gennaio 1982, che modifica la
    direttiva 75/362/CEE concernente il reciproco riconoscimento dei diplomi, certificati
    ed altri titoli di medico e comportante misure destinate ad agevolare l'esercizio
    effettivo del diritto di stabilimento e di libera prestazione dei servizi e la
    direttiva 75/363/CEE concernente il coordinamento delle disposizioni legislative,
    regolamentari ed amministrative per le attività di medico
  type: main
- language: nl
  script: Latn
  content: Richtlijn 82/76/EEG van de Raad van 26 januari 1982 tot wijziging van Richtlijn
    75/362/EEG inzake de onderlinge erkenning van de diploma' s, certificaten en andere
    titels van de arts, tevens houdende maatregelen tot vergemakkelijking van de daadwerkelijke
    uitoefening van het recht van vestiging en vrij verrichten van diensten, alsmede
    van Richtlijn 75/363/EEG inzake de coördinatie van de wettelijke en bestuursrechtelijke
    bepalingen betreffende de werkzaamheden van de arts
  type: main
- language: pt
  script: Latn
  content: Directiva 82/76/CEE do Conselho, de 26 de Janeiro de 1982, que altera a
    Directiva 75/362/CEE que tem por objectivo o reconhecimento mútuo dos diplomas,
    certificados e outros títulos de médico e que inclui medidas destinadas a facilitar
    o exercício efectivo do direito de estabelecimento e da livre prestação de
    serviços, bem como a Directiva 75/363/CEE que tem por objectivo a coordenação
    das disposições legislativas, regulamentares e administrativas relativas às
    actividades de médico
  type: main
- language: es
  script: Latn
  content: Directiva 82/76/CEE del Consejo, de 26 de enero de 1982, por la que se
    modifica la Directiva 75/362/CEE referente al reconocimiento mutuo de diplomas,
    certificados y otros títulos de médico, y en la que se establecen medidas destinadas
    a facilitar el ejercicio efectivo del derecho de establecimiento y de libre prestación
    de servicios, así como la Directiva 75/363/CEE referente a la coordinación de
    las disposiciones legales, reglamentarias y administrativas relativas a las actividades
    de los médicos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 82/76/EEG av den 26 januari 1982 om ändring av direktiv
    75/362/EEG om ömsesidigt erkännande av utbildnings-, examens- och andra behörighetsbevis
    för läkare inklusive åtgärder för att underlätta det faktiska utövandet
    av etableringsrätten och friheten att tillhandahålla tjänster samt av direktiv
    75/363/EEG om samordning av bestämmelserna i lagar och andra författningar om
    verksamhet som läkaren
  type: main
