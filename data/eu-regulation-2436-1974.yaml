title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2436/74 of the Commission of 26 September 1974 re-establishing
    the levying of the customs duties on hydraulic cements, falling within heading
    No 25.23, originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2436/74 de la Commission, du 26 septembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux ciments
    hydrauliques, de la position tarifaire 25.23, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3501/73 du Conseil
    du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2436/74 der Kommission vom 26. September 1974 zur
    Wiedereinführung des Zollsatzes für Zement (einschließlich Zementklinker),
    auch gefärbt, der Tarifnummer 25.23, mit Ursprung in Jugoslawien, dem die in
    der Verordnung (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2436/74 af 26. september 1974 om genindførelse
    af opkrævning af toldafgifter for hydraulisk cement under position 25.23, som
    har oprindelse i Jugoslavien og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2436/74 della Commissione, del 26 settembre 1974,
    che ripristina la riscossione dei dazi doganali applicabili ai cementi idraulici
    della voce doganale n. 25.23, originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre
    1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2436/74 van de Commissie van 26 september 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op hydraulisch
    cement van post 25.23 van oorsprong uit Joegoslavië, ten behoeve waarvan bij
    Verordening (EEG) nr. 3501/73 van de Raad van 18 december 1973 algemene tariefpreferenties
    werden geopend
  type: main
