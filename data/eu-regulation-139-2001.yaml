    de productos del sector de la carne de porcino durante el período comprendido
    entre el 1 de enero y el 31 de marzo de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 139/2001 av den 24 januari 2001 om den
