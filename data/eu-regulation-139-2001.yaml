    apresentados em Janeiro de 2001 ao abrigo dos contingentes pautais de importação
    para determinados produtos no sector da carne de suíno, para o período compreendido
    entre 1 de Janeiro e 31 de Março de 2001
  type: main
- language: es
  script: Latn
