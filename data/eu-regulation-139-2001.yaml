title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 139/2001 of 24 January 2001 determining the
    extent to which applications lodged in January 2001 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 January to 31 March 2001 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 139/2001 de la Commission du 24 janvier 2001 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2001 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er janvier au 31 mars 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 139/2001 der Kommission vom 24. Januar 2001 über die
    Festsetzung des Umfangs für die im Januar 2001 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    Januar bis zum 31. März 2001
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 139/2001 af 24. januar 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i januar
    2001 om importlicenser for toldkontingenter for indførsel af bestemte svinekødsprodukter
    for perioden 1. januar til 31. marts 2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 139/2001 της Επιτροπής,
    της 24ης Ιανουαρίου 2001, για καθορισμό ορίων
    εντός των οποίων δύνανται να γίνουν αποδεκτές
    οι αιτήσεις που υποβλήθηκαν τον Ιανουάριο
    2001 για άδειες εισαγωγής, βάσει των καθεστώτων
    δασμολογικών ποσοστώσεων εισαγωγής για ορισμένα
    προϊόντα του τομέα του χοιρείου κρέατος, για
    την περίοδο από την 1η Ιανουαρίου έως τις 31
    Μαρτίου 2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 139/2001, annettu 24 päivänä tammikuuta 2001,
    tammikuussa 2001 jätettyjen tuontitodistushakemusten hyväksyttävyydestä koskien
    tuontitariffikiintiöiden avaamista ja hallintaa sianliha-alalla tiettyjen tuotteiden
    osalta 1 päivän tammikuuta ja 31 päivän maaliskuuta 2001 välisellä kaudella
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 139/2001 della Commissione, del 24 gennaio 2001, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di gennaio 2001 nel quadro dei contingenti tariffari d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° gennaio
    al 31 marzo 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 139/2001 van de Commissie van 24 januari 2001 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten, die in januari 2001 worden ingediend op grond van de tariefcontingenten
    voor de invoer van bepaalde producten in de varkensvleessector voor de periode
    van 1 januari tot en met 31 maart 2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 139/2001 da Comissão, de 24 de Janeiro de 2001,
