    ja maltakeelne tekst on autentsed)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/553, annettu 29 päivänä
    maaliskuuta 2021, poikkeuksien myöntämisestä Kreikalle, Espanjalle ja Maltalle
    siltä osin kuin on kyse tilastojen toimittamisesta energiatilastoista annetun
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1099/2008 nojalla (tiedoksiannettu
    numerolla C(2021) 1937) (Ainoastaan englannin-, espanjan-, kreikan- ja maltankieliset
    tekstit ovat todistusvoimaiset)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/553 оd 29. ožujka 2021. o odobravanju
    odstupanja Grčkoj, Španjolskoj i Malti u pogledu dostavljanja statističkih
    podataka u skladu s Uredbom (EZ) br. 1099/2008 Europskog parlamenta i Vijeća
    o energetskoj statistici (priopćeno pod brojem dokumenta C(2021) 1937) (Vjerodostojan
    je samo tekst na engleskom, grčkom, malteškom i španjolskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/553 végrehajtási határozata (2021. március 29.)
    az energiastatisztikáról szóló 1099/2008/EK európai parlamenti és tanácsi
    rendeletben előírt statisztikai adatszolgáltatási kötelezettségek tekintetében
    Görögországnak, Spanyolországnak és Máltának engedélyezett eltérésekről
    (az értesítés a C(2021) 1937. számú dokumentummal történt) (Csak az angol,
    a görög, a máltai és a spanyol nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/553 della Commissione del 29 marzo 2021
    che accorda deroghe a Grecia, Spagna e Malta per quanto riguarda la trasmissione
    di statistiche a norma del regolamento (CE) n. 1099/2008 del Parlamento europeo
    e del Consiglio relativo alle statistiche dell’energia [notificata con il numero
    C(2021) 1937] (I testi in lingua greca, inglese, maltese e spagnola sono i soli
    facenti fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/553 (2021. gada 29. marts), ar
    ko Grieķijai, Spānijai un Maltai piešķir atkāpes attiecībā uz statistikas
    datu sniegšanu saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1099/2008
    par enerģētikas statistiku (izziņots ar dokumenta numuru C(2021) 1937) (Autentisks
    ir tikai teksts angļu, grieķu, maltiešu un spāņu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/553 2021 m. kovo 29 d. kuriuo
    Graikijai, Ispanijai ir Maltai leidžiama taikyti nukrypti leidžiančias nuostatas
    dėl statistinių duomenų teikimo pagal Europos Parlamento ir Tarybos reglamentą
    (EB) Nr. 1099/2008 dėl energetikos statistikos (pranešta dokumentu Nr. C(2021)
    1937) (Tekstas autentiškas tik anglų, graikų, maltiečių ir ispanų kalbomis)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/553 tad-29
    ta’ Marzu 2021 li tagħti derogi lill-Greċja, lil Spanja u lil Malta fir-rigward
    tal-provvediment tal-istatistika skont ir-Regolament (KE) Nru 1099/2008 tal-Parlament
    Ewropew u tal-Kunsill dwar l-istatistika dwar l-enerġija (notifikata bid-dokument
    C(2021) 1937) (It-testi bl-Ingliż, bil-Grieg, bil-Malti u bl-Ispanjol biss huma
    awtentiċi)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/553 van de Commissie van 29 maart 2021 waarbij
    aan Griekenland, Spanje en Malta afwijkingen worden toegestaan ten aanzien van
    de indiening van statistieken overeenkomstig Verordening (EG) nr. 1099/2008 van
    het Europees Parlement en de Raad betreffende energiestatistieken (Kennisgeving
    geschied onder nummer C(2021) 1937) (Slechts de teksten in de Engelse, de Griekse,
    de Maltese en de Spaanse taal zijn authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/553 z dnia 29 marca 2021 r. w sprawie
    przyznania Grecji, Hiszpanii i Malcie odstępstw dotyczących dostarczania danych
    statystycznych zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (WE)
    nr 1099/2008 w sprawie statystyki energii (notyfikowana jako dokument nr C(2021)
    1937) (Jedynie teksty w językach angielskim, greckim, maltańskim i hiszpańskim
    są autentyczne)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/553 da Comissão de 29 de março de 2021
