  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/553, 29. märts 2021, millega Kreekale,
    Hispaaniale ja Maltale tehakse erand Euroopa Parlamendi ja nõukogu määruse
    (EÜ) nr 1099/2008 (energiastatistika kohta) alusel statistika esitamise kohustusest
