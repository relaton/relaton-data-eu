title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/553 of 29 March 2021 granting
    derogations to Greece, Spain and Malta as regards the provision of statistics
    pursuant to Regulation (EC) No 1099/2008 of the European Parliament and of the
    Council on energy statistics (notified under document C(2021) 1937) (Only the
    English, Greek, Maltese and Spanish texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/553 de la Commission du 29 mars 2021
    accordant à la Grèce, à l’Espagne et à Malte des dérogations en ce qui
    concerne la communication de statistiques conformément au règlement (CE) no
    1099/2008 du Parlement européen et du Conseil concernant les statistiques de
    l’énergie [notifiée sous le numéro C(2021) 1937] (Les textes en langues anglaise,
    espagnole, grecque et maltaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/553 der Kommission vom 29. März 2021
    zur Gewährung von Ausnahmen für Griechenland, Spanien und Malta bezüglich der
    Bereitstellung von Statistiken gemäß der Verordnung (EG) Nr. 1099/2008 des Europäischen
    Parlaments und des Rates über die Energiestatistik (Bekannt gegeben unter Aktenzeichen
    C(2021) 1937) (Nur der englische, der griechische, der maltesische und der spanische
    Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/553 на Комисията
    от 29 март 2021 година за предоставяне на дерогации
    на Гърция, Испания и Малта по отношение на предаването
    на статистически данни по реда на Регламент
    (ЕО) № 1099/2008 на Европейския парламент и на Съвета
    относно статистиката за енергийния сектор
    (нотифицирано под номер С(2021) 1937) (само текстовете
    на английски, гръцки, малтийски и испански
    език са автентични)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/553 ze dne 29. března 2021,
    kterým se Řecku, Španělsku a Maltě udělují výjimky týkající se poskytování
    statistik podle nařízení Evropského parlamentu a Rady (ES) č. 1099/2008 o
    energetické statistice (oznámeno pod číslem C(2021) 1937) (Pouze anglické,
    maltské, řecké a španělské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/553 af 29. marts 2021
