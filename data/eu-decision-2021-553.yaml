    angår indberetning af statistikker i henhold til Europa-Parlamentets og Rådets
    forordning (EF) nr. 1099/2008 om energistatistik (meddelt under nummer C(2021)
    1937) (Kun den engelske, den græske, den maltesiske og den spanske udgave er
    autentiske)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/553 της Επιτροπής
    της 29ης Μαρτίου 2021 για τη χορήγηση παρεκκλίσεων
    στην Ελλάδα, την Ισπανία και τη Μάλτα όσον αφορά
    την υποβολή στατιστικών σύμφωνα με τον κανονισμό
    (ΕΚ) αριθ. 1099/2008 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου για τις στατιστικές ενέργειας
