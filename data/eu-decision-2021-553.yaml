    à transmissão de estatísticas nos termos do Regulamento (CE) n.o 1099/2008
    do Parlamento Europeu e do Conselho relativo às estatísticas da energia [notificada
    com o número C(2021) 1937] (Apenas fazem fé os textos nas línguas inglesa,
    grega, maltesa e espanhola)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/553 a Comisiei din 29 martie 2021
    de acordare a unor derogări Greciei, Spaniei și Maltei în ceea ce privește
    furnizarea de statistici în temeiul Regulamentului (CE) nr. 1099/2008 al Parlamentului
    European și al Consiliului privind statisticile în domeniul energiei [notificată
    cu numărul C(2021) 1937] (Numai textele în limbile engleză, greacă, malteză
    și spaniolă sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/553 z 29. marca 2021, ktorým
    sa Grécku, Španielsku a Malte udeľujú výnimky, pokiaľ ide o poskytovanie
    štatistiky podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1099/2008
    o energetickej štatistike [oznámené pod číslom C(2021) 1937] (Iba anglické,
    grécke, maltské a španielske znenie je autentické)
  type: main
