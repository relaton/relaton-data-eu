  content: Commission Regulation (EU) No 351/2010 of 23 April 2010 implementing Regulation
    (EC) No 862/2007 of the European Parliament and of the Council on Community statistics
    on migration and international protection as regards the definitions of the categories
    of the groups of country of birth, groups of country of previous usual residence,
    groups of country of next usual residence and groups of citizenship
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n o 351/2010 de la Commission du 23 avril 2010 mettant
