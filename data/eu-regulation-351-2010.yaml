    relatif aux statistiques communautaires sur la migration et la protection internationale
    en ce qui concerne la définition des catégories des groupes de pays de naissance,
    groupes de pays de résidence habituelle précédente, groupes de pays de prochaine
    résidence habituelle et groupes de nationalité
