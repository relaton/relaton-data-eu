    και των φόρων κατά την εξαγωγή για τα γεωργικά
    προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 645/75 della Commissione, del 13 marzo 1975, che stabilisce
    modalità comuni d' applicazione dei prelievi e delle tasse all' esportazione
    per i prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 645/75 van de Commissie van 13 maart 1975 houdende
