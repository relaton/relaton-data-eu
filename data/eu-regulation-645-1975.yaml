title:
- language: en
  script: Latn
  content: Regulation (EEC) No 645/75 of the Commission of 13 March 1975 laying down
    common detailed rules for the application of the export levies and charges on
    agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 645/75 de la Commission, du 13 mars 1975, établissant
    les modalités communes d' application des prélèvements et des taxes à l' exportation
    pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 645/75 der Kommission vom 13. März 1975 zur Festlegung
    der gemeinsamen Durchführungsvorschriften für die Ausfuhrabschöpfungen und
    -abgaben für landwirtschaftliche Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 645/75 af 13. marts 1975 om fælles
    gennemførelsesbestemmelser for eksportafgifter for landbrugsprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 645/75 της Επιτροπής
