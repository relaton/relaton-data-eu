    en belastingen bij de uitvoer van landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 645/75 da Comissão, de 13 de Março de 1975, que
    estabelece as regras comuns de aplicação de direitos niveladores e de encargos
    na exportação para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 645/75 de la Comisión, de 13 de marzo de 1975, por
