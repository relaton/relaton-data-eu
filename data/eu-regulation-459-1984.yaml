title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 459/84 of 22 February 1984 re-establishing
    the levying of customs duties on woven fabrics of synthetic fibres, unbleached
    or bleached, products of category ex 3 (code 0033), originating in Brazil, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 459/84 de la Commission du 22 février 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    tissus de fibres textiles synthétiques, écrus ou blanchis, de la catégorie
    ex 3 (code 0033), originaires du Brésil, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 459/84 der Kommission vom 22. Februar 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Gewebe aus synthetischen oder
    künstlichen Spinnfasern, roh oder gebleicht, der Warenkategorie Nr. ex 3 (Kennziffer
    0033), mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3570/83
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 459/84 af 22. februar 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte vævede stoffer af korte kemofibre
    af syntetiske fibre, ublegede og blegede, under varekategori nr. ex 3 (kode 0033),
    som har oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 459/84 της Επιτροπής
    της 22ας Φεβρουαρίου 1984 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    υφάσματα εκ συνθετικών ινών αλεύκαστα ή λευκασμένα,
    προϊόντα της κατηγορίας ex 3 (κωδικός 0033), καταγωγής
    Βραζιλίας, δικαιούχου των προβλεπομένων στον
    κανονισμό (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 459/84 della Commissione del 22 febbraio 1984 che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili
    sintetiche ed artificiali in fiocco, della categoria di prodotti n. ex 3 (codice
    0033), originari del Brasile beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 459/84 van de Commissie van 22 februari 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige stapelvezels, ongebleekt of gebleekt, van
    de categorie van produkten nr. ex 3 (codenummer 0033), van oorsprong uit Brazilië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3570/83 van de Raad
  type: main
