title:
- language: en
  script: Latn
  content: '80/1296/EEC: Commission Decision of 22 December 1980 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of the Netherlands of expenditure
    incurred during 1979 on annuities relating to measures to encourage the cessation
    of farming and the reallocation of utilized agricultural areas for the purpose
    of structural improvement (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1296/CEE: Décision de la Commission, du 22 décembre 1980, relative
    au remboursement par le Fonds européen d''orientation et de garantie agricole
    (FEOGA), section "orientation", au Royaume des Pays-Bas des dépenses effectuées
    pendant l''année 1979 pour les indemnités relatives à l''encouragement à la
    cessation de l''activité agricole et à l''affectation de la superficie agricole
    utilisée à des fins d''amélioration des structures (Le texte en langue néerlandaise
    est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1296/EWG: Entscheidung der Kommission vom 22. Dezember 1980 über die
    Rückvergütung der während des Jahres 1979 getätigten Ausgaben zur Förderung
    der Einstellung der landwirtschaftlichen Erwerbstätigkeit und der Verwendung
    der landwirtschaftlich genützten Flächen für Zwecke der Strukturverbesserung
    durch den EAGFL, Abteilung Ausrichtung, an das Königreich der Niederlande (Nur
    der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1296/EØF: Kommissionens beslutning af 22. december 1980 om refusion
    gennem EUGFL, udviklingssektionen, til kongeriget Nederlandene af de udgifter,
    som er afholdt i løbet af året 1979 til godtgørelser vedrørende støtte til
    ophør af landbrugsvirksomhed og til anvendelse af udnyttet landbrugsareal til
    strukturforbedringsformål (Kun den nederlandske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1296/CEE: Decisione della Commissione, del 22 dicembre 1980, relativa
    al rimborso da parte del FEAOG, sezione orientamento, al Regno dei Paesi Bassi,
    delle spese effettuate nel 1979 per le indennità concernenti l''incoraggiamento
    alla cessazione dell''attività agricola e alla destinazione della superficie
    agricola utilizzata a scopi di miglioramento delle strutture (Il testo in lingua
    olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1296/EEG: Beschikking van de Commissie van 22 december 1980 betreffende
    de vergoeding door het EOGFL, afdeling Oriëntatie, van de in het jaar 1979 door
    het Koninkrijk der Nederlanden gedane uitgaven voor uitkeringen ter bevordering
    van de bedrijfsbeëindiging in de landbouw en van de aanwending van cultuurgrond
    tot verbetering van de structuur (Slechts de tekst in de Nederlandse taal is authentiek)'
  type: main
