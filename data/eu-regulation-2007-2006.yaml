    przywozu i tranzytu niektórych produktów pośrednich otrzymanych z surowca kategorii
    3 do wykorzystania w celach technicznych w wyrobach medycznych, diagnostyce in
    vitro i odczynnikach laboratoryjnych oraz zmieniające wymienione rozporządzenie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2007/2006 da Comissão, de 22 de Dezembro de 2006
    , relativo à execução do Regulamento (CE) n. o 1774/2002 do Parlamento Europeu
    e do Conselho, no que respeita à importação e ao trânsito de determinados
    produtos intermédios derivados de matérias da categoria 3 destinados a utilizações
    técnicas em dispositivos médicos, produtos utilizados para diagnóstico in vitro
    e reagentes de laboratório, e que altera o referido regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2007/2006 al Comisiei din 22 decembrie 2006 de punere
    în aplicare a Regulamentului (CE) nr. 1774/2002 al Parlamentului European și
    al Consiliului în ceea ce privește importul și tranzitul anumitor produse intermediare
    derivate din materiale de categoria 3 destinate utilizării în scopuri tehnice
    în dispozitive medicale, în produse pentru diagnostic in vitro și reactivi
    de laborator și de modificare a acestui regulament
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2007/2006 z 22. decembra 2006 , ktorým sa
