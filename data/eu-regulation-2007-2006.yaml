  script: Latn
  content: A Bizottság 2007/2006/EK rendelete ( 2006. december 22. ) egyes orvostechnikai
    eszközökben, in vitro diagnózishoz és laboratóriumi reagensekben történő
    ipari felhasználásra szánt, 3. kategóriába tartozó anyagból nyert köztes
    termékek behozatala és tranzitforgalma tekintetében az 1774/2002/EK európai
    parlamenti és tanácsi rendelet végrehajtásáról és módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2007/2006 della Commissione, del 22 dicembre 2006 ,
    recante attuazione e modifica del regolamento (CE) n. 1774/2002 del Parlamento
    europeo e del Consiglio per quanto riguarda l’importazione e il transito di
    taluni prodotti intermedi derivati da materiali di categoria 3 destinati ad usi
    tecnici per la fabbricazione di dispositivi medici, prodotti per la diagnosi in
    vitro e reagenti di laboratorio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2007/2006 ( 2006. gada 22. decembris ), ar ko
    īsteno Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1774/2002 attiecībā uz
    dažu tādu no trešās kategorijas materiāla iegūtu starpproduktu ievešanu
    un tranzītu, kurus paredzēts izmantot tehniskiem mērķiem medicīnas ierīcēs,
    in vitro diagnostikā un laboratorijas reaģentos, un ar ko groza minēto regulu
  type: main
- language: lt
  script: Latn
  content: 2006 gruodžio 22 d. Komisijos reglamentas (EB) Nr. 2007/2006, įgyvendinantis
    Europos Parlamento ir Tarybos reglamento (EB) Nr. 1774/2002 nuostatas dėl tam
    tikrų tarpinių produktų, gautų iš techninės paskirties 3 kategorijos medžiagų,
    skirtų medicinos prietaisams, in vitro diagnostikoje naudojamiems produktams
    ir laboratoriniams reagentams gaminti, importo ir tranzito, ir iš dalies keičiantis
    tą reglamentą
  type: main
- language: mt
  script: Latn
