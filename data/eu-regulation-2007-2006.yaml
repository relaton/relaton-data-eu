    fir-rigward ta’ l-importazzjoni u t-tranżitu ta’ ċerti prodotti intermedjarji
    li huma derivati minn materjal mill-Kategorija 3 intenzjonat għall-użu tekniku
    fit-tagħmir mediku, fid-dijanjostiċi in vitro u fir-reaġenti tal-laboratorju
    u li jemenda lil dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2007/2006 van de Commissie van 22 december 2006 ter
