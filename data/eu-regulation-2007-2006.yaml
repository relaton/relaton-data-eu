    ide o dovoz a tranzit polotovarov z materiálu kategórie 3 určených na technické
    použitie v lekárskych prístrojoch, na in vitro diagnostiku a v laboratórnych
    reagenciách, a ktorým sa mení a dopĺňa toto nariadenie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2007/2006 z dne 22. decembra 2006 o izvajanju
    Uredbe (ES) št. 1774/2002 Evropskega parlamenta in Sveta v zvezi z uvozom in
    tranzitom nekaterih vmesnih proizvodov, pridobljenih iz snovi kategorije 3 in
    namenjenih za tehnično uporabo v medicinskih pripomočkih, in vitro diagnostičnih
    medicinskih pripomočkih in laboratorijskih reagentih, ter o spremembi te uredbe
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2007/2006 de la Comisión, de 22 de diciembre de 2006
    , por el que se aplica el Reglamento (CE) n o 1774/2002 del Parlamento Europeo
    y del Consejo, con respecto a la importación y el tránsito de determinados productos
    intermedios derivados de material de la categoría 3, destinados a usos técnicos
    en productos sanitarios, productos para el diagnóstico in vitro y reactivos de
    laboratorio, y se modifica dicho Reglamento
  type: main
