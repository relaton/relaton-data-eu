title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2007/2006 of 22 December 2006 implementing
    Regulation (EC) No 1774/2002 of the European Parliament and of the Council as
    regards the importation and transit of certain intermediate products derived from
    Category 3 material intended for technical uses in medical devices, in vitro diagnostics
    and laboratory reagents and amending that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2007/2006 de la Commission du 22 décembre 2006 portant
    application du règlement (CE) n o 1774/2002 du Parlement européen et du Conseil
    en ce qui concerne l’importation et le transit de certains produits intermédiaires
    dérivés de matières de catégorie 3 destinés à des utilisations techniques
    dans des dispositifs médicaux, des produits pour diagnostic in vitro et des réactifs
    de laboratoire et modifiant ce règlement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2007/2006 der Kommission vom 22. Dezember 2006 zur
    Durchführung der Verordnung (EG) Nr. 1774/2002 des Europäischen Parlaments und
    des Rates hinsichtlich der Einfuhr und Durchfuhr bestimmter aus Material der Kategorie
    3 gewonnener Zwischenerzeugnisse für technische Verwendungszwecke in Medizinprodukten,
    In-vitro-Diagnostika und Laborreagenzien sowie zur Änderung der genannten Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 2007/2006 на Комисията от 22
    декември 2006 година за прилагане на Регламент
    (ЕО) № 1774/2002 на Европейския парламент и на Съвета
    относно вноса и транзита на някои междинни
    продукти, получени от материали от категория
    3, предназначени за техническа употреба в медицински
    устройства, ин витро диагностика и лабораторни
    реактиви, и за изменение на посочения регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2007/2006 ze dne 22. prosince 2006 o provádění
    nařízení Evropského parlamentu a Rady (ES) č. 1774/2002, pokud jde o dovoz
    a tranzit některých meziproduktů z materiálů kategorie 3 určených k technickému
    použití ve zdravotnických prostředcích, in vitro diagnostikách a laboratorních
    činidlech, a o změně uvedeného nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2007/2006 af 22 december 2006 om gennemførelse
