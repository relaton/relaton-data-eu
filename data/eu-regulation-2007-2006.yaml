    import og transit af visse mellemprodukter fremstillet af kategori 3-materiale
    til teknisk brug i medicinsk udstyr, in vitro-diagnostika og laboratoriereagenser
    og om ændring af nævnte forordning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2007/2006 της Επιτροπής,
