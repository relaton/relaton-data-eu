  content: '94/436/EC: Commission Decision of 13 June 1994 determining the amount
    of VAT own resources payable by the Federal Republic of Germany for 1991 in respect
    of transactions covered by the 20th Council Directive 85/361/EEC of 16 July 1985
    on the harmonization of the laws of the Member States relating to turnover taxes
    - Common system of value added tax: derogations in connection with the special
    aids granted to certain farmers to compensate for the dismantlement of monetary
    compensatory amounts applying to certain agricultural products (Only the German
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/436/CE: Décision de la Commission du 13 juin 1994 fixant le montant
    des ressources propres TVA dont la République fédérale d''Allemagne est redevable
    pour l''exercice 1991 et relatif aux opérations visées à la vingtième directive
    85/361/CEE du Conseil, du 16 juillet 1985, en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires ¯ Système
    commun de taxe sur la valeur ajoutée: dérogations relatives aux aides spéciales
    accordées à certains agriculteurs en compensation du démantèlement des montants
    compensatoires monétaires applicables à certains produits agricoles (Le texte
    en langue allemande est le seul faisant foi.)'
  type: main
