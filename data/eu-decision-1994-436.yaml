  script: Latn
  content: '94/436/CE: DECISÃO DA COMISSÃO de 13 de Junho de 1994 que fixa o montante
    dos recursos próprios do imposto sobre o valor acrescentado (IVA) de que a República
    Federal da Alemanha é devedora para o exercício de 1991 e relativo às operações
    referidas na vigésima Directiva 85/361/CEE do Conselho, de 16 de Julho de 1985,
    em matéria de harmonização das legislações dos Estados-membros respeitantes
    aos impostos sobre o volume de negócios ¯ sistema comum de imposto sobre o valor
    acrescentado: derrogações relativas às ajudas especiais concedidas a certos
    agricultores em compensação do desmantelamento dos montantes compensatórios
    monetários aplicáveis a determinados produtos agrícolas (Apenas faz fé o texto
    em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '94/436/CE: DECISIÓN DE LA COMISIÓN de 13 de junio de 1994 por la que
    se fija la cuantía de los recursos propios IVA debida por la República Federal
    de Alemania por el ejercicio 1991 y relativa a las operaciones contempladas en
    la vigésima Directiva 85/361/CEE del Consejo, de 16 de julio de 1985, en materia
    de armonización de las legislaciones de los Estados miembros relativas a los
    impuestos sobre el volumen de negocios ¯ Sistema común del impuesto sobre el
    valor añadido: excepciones relativas a las ayudas especiales concedidas a determinados
    agricultores en compensación al desmantelamiento de los montantes compensatorios
    monetarios aplicables a determinados productos agrícolas (El texto en lengua
    alemana es el único auténtico)'
