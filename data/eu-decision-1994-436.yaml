    mit den in der Zwanzigsten Richtlinie genannten Umsätzen geschuldeten Betrags
    der MwSt.-Eigenmittel (Zwanzigste Richtlinie 85/361/EWG des Rates vom 16. Juli
    1985 zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern
    ¯ gemeinsames Mehrwertsteuersystem: Ausnahmeregelung im Zusammenhang mit den
    Sonderbeihilfen, die bestimmten Landwirten als Ausgleich für den Abbau der Währungsausgleichsbeträge
