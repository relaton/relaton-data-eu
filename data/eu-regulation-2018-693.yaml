    d'Azur)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2018/693 оd 7. svibnja 2018. o uvođenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu zabrane ribolova iznad
    zaštićenih staništa, minimalne udaljenosti od obale i minimalne dubine mora
    za mreže potegače vrste „gangui” koje love u određenim teritorijalnim vodama
    Francuske (Provence – Alpes – Côte d'Azur)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2018/693 végrehajtási rendelete (2018. május 7.) az
    1967/2006/EK tanácsi rendelettől a Franciaország egyes felségvizein (Provence-Alpes-Côte
    d'Azur) „gangui” vonóhálót üzemeltető hajók vonatkozásában a védett
    élőhelyek feletti halászati tilalom, a hálók legkisebb merítési mélysége
    és használatuk parttól számított legkisebb távolsága tekintetében történő
    eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2018/693 della Commissione, del 7 maggio
    2018, recante deroga al regolamento (CE) n. 1967/2006 del Consiglio per quanto
    riguarda il divieto di pescare al di sopra di habitat protetti, la distanza minima
    dalla costa e la profondità minima per i pescherecci da traino provvisti dell'attrezzo
    denominato «gangui» operanti in talune acque territoriali della Francia (Provenza-Alpi-Costa
    Azzurra)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2018/693 (2018. gada 7. maijs), ar
    ko attiecībā uz aizliegumu zvejot virs aizsargājamām dzīvotnēm un minimālo
    attālumu no krasta un minimālo jūras dziļumu, kas jāievēro kuģiem, kuri
    noteiktos Francijas (Provansas–Alpu–Kotdazīras) teritoriālajos ūdeņos
    zvejo ar gangui tipa trali, paredz atkāpi no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2018 m. gegužės 7 d. Komisijos įgyvendinimo reglamentas (ES) 2018/693,
    kuriuo nustatoma nuo Tarybos reglamente (EB) Nr. 1967/2006 nustatytų žvejybos
    virš saugomų buveinių draudimo ir minimalaus atstumo nuo kranto bei minimalaus
    jūros gylio reikalavimų nukrypti leidžianti nuostata, taikoma tam tikruose
    Prancūzijos teritoriniuose vandenyse (Provanso-Alpių-Žydrojo Kranto regione)
    „gangui“ tipo tralais žvejojantiems traleriams
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/693 tas-7 ta'
    Mejju 2018 li jistabbilixxi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tal-projbizzjoni tas-sajd f'ħabitats protetti, id-distanza minima
    mill-kosta u l-fond minimu tal-baħar għal bastimenti tat-tkarkir “gangui”
    li jistadu f'ċertu ilmijiet territorjali ta' Franza (Provence-Alpes-Côte d'Azur)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2018/693 van de Commissie van 7 mei 2018 houdende
    afwijking van Verordening (EG) nr. 1967/2006 van de Raad, wat betreft het verbod
    om boven beschermde habitats te vissen, de minimumafstand van de kust en de minimumzeediepte
    voor de „gangui”-trawlers in bepaalde territoriale wateren van Frankrijk (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2018/693 z dnia 7 maja 2018 r.
    wprowadzające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w odniesieniu
    do zakazu połowów nad chronionymi siedliskami, minimalnych odległości od brzegu
    i minimalnej głębokości morza dla trawlerów stosujących sieci typu „gangui”
    prowadzących połowy na niektórych wodach terytorialnych Francji (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2018/693 da Comissão, de 7 de maio de 2018,
    que derroga ao Regulamento (CE) n.° 1967/2006 do Conselho no que respeita à
    proibição de pesca em habitats protegidos, à distância mínima da costa e
    à profundidade mínima para os arrastões gangui que pescam em determinadas águas
    territoriais de França (Provence-Alpes-Côte d'Azur)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2018/693 al Comisiei din 7 mai
    2018 de stabilire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește interzicerea pescuitului deasupra habitatelor protejate,
    distanța minimă față de coastă și adâncimea minimă a mării pentru traulerele
    „gangui” care pescuiesc în anumite ape teritoriale ale Franței (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2018/693 zo 7. mája 2018, ktorým
    sa stanovuje výnimka z nariadenia Rady (ES) č. 1967/2006, pokiaľ ide o zákaz
    lovu nad chránenými biotopmi a o minimálnu vzdialenosť od pobrežia a minimálnu
    hĺbku mora v prípade lovu plavidlami s vlečnými sieťami typu gangui v určitých
    pobrežných vodách Francúzska (Provence-Alpes-Côte d'Azur)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2018/693 z dne 7. maja 2018 o odstopanju
    od Uredbe Sveta (ES) št. 1967/2006 glede prepovedi ribolova nad zaščitenimi
    habitati, najmanjše oddaljenosti od obale in najmanjše morske globine za plovila
    z vlečnimi mrežami tipa „gangui“, ki lovijo v določenih teritorialnih vodah
    Francije (Provansa – Alpe – Azurna obala)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2018/693 de la Comisión, de 7 de mayo de
    2018, por el que se establece una excepción al Reglamento (CE) n.° 1967/2006
    del Consejo en lo relativo a la prohibición de faenar por encima de hábitats
    protegidos, la distancia mínima de la costa y la profundidad marina mínima para
    los arrastreros que pescan con «gangui» en determinadas aguas territoriales
    de Francia (Provenza-Alpes-Costa Azul)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2018/693 av den 7 maj 2018
    om undantag från rådets förordning (EG) nr 1967/2006 vad gäller förbudet
    mot fiske ovanför skyddade livsmiljöer samt minimiavståndet från kusten och
    minimidjupet för fiske med trålare av ”gangui-typ” i vissa territorialvatten
    i Frankrike (Provence-Alpes-Côte d'Azur)
