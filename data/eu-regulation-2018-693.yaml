    в определени териториални води на Франция
    (Provence-Alpes-Côte d'Azur)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2018/693 ze dne 7. května 2018, kterým
    se stanoví odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde o zákaz
    rybolovu nad chráněnými stanovišti, minimální vzdálenost od pobřeží
    a minimální hloubku moře pro traulery typu gangui lovící v některých teritoriálních
    vodách Francie (Provence-Alpes-Côte d'Azur)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2018/693 af 7. maj 2018 om
    fravigelse af Rådets forordning (EF) nr. 1967/2006 for så vidt angår forbuddet
    mod fiskeri hen over beskyttede habitater, mindsteafstanden fra kysten og mindstedybden
    for fiskeri med gangui-trawlere i visse franske territorialfarvande (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2018/693 της Επιτροπής,
