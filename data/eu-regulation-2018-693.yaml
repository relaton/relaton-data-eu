title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/693 of 7 May 2018 establishing
    the derogation from Council Regulation (EC) No 1967/2006 as regards the prohibition
    to fish above protected habitats, the minimum distance from the coast and the
    minimum sea depth for the ‘gangui’ trawlers fishing in certain territorial
    waters of France (Provence-Alpes-Côte d'Azur)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/693 de la Commission du 7 mai 2018 portant
    dérogation au règlement (CE) n° 1967/2006 du Conseil en ce qui concerne l'interdiction
    de la pêche au-dessus des habitats protégés ainsi que la distance minimale
    de la côte et la profondeur minimale pour les chalutiers équipés de chaluts
    de type «gangui» pêchant dans certaines eaux territoriales de la France (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/693 der Kommission vom 7. Mai 2018 zur
    Gewährung einer Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates hinsichtlich
    des Verbots der Fischerei über geschützten Lebensräumen, der Mindestentfernung
    von der Küste und der Mindestwassertiefe für die „Gangui“-Trawler beim Fischfang
    in bestimmten Hoheitsgewässern Frankreichs (Provence-Alpes-Côte d'Azur)
  type: main
- language: bg
  script: Cyrl
