title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2318/95 of 27 September 1995 imposing a provisional
    anti-dumping duty on imports of certain tube or pipe fittings, of iron or steel,
    originating in the People' s Republic of China, Croatia and Thailand and terminating
    the anti-dumping proceeding in respect of imports of these fittings, originating
    in the Slovak Republic and Taiwan
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2318/95 de la Commission du 27 septembre 1995 instituant
    un droit antidumping provisoire sur les importations de certains accessoires de
    tuyauterie, en fer ou acier, originaires de République populaire de Chine, de
    Croatie et de Thaïlande et portant clôture de la procédure antidumping concernant
    les importations de ces accessoires originaires de République slovaque et de
    T'ai-wan
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2318/95 DER KOMMISSION vom 27. September 1995 zur Einführung
    eines vorläufigen Antidumpingzolls auf die Einfuhren bestimmter Rohrformstücke,
    Rohrverschlußstücke und Rohrverbindungsstücke aus Eisen oder Stahl mit Ursprung
    in der Volksrepublik China, Kroatien und Thailand und zur Einstellung des Antidumpingverfahrens
    gegenüber den Einfuhren dieser Formstücke mit Ursprung in der Slowakischen Republik
    und in Taiwan
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2318/95 af 27. september 1995 om indførelse
    af en midlertidig antidumpingtold på importen af visse rørfittings af jern og
    stål med oprindelse i Den Kinesiske Folkerepublik, Kroatien og Thailand og om
    afslutning af antidumpingproceduren vedrørende importen af disse fittings med
    oprindelse i Den Slovakiske Republik og Taiwan
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2318/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Σεπτεμβρίου 1995 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    εξαρτημάτων σωληνώσεων, από σίδηρο ή χάλυβα,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, Κροατίας
    και Ταϊλάνδης, και για την περάτωση της διαδικασίας
    αντιντάμπινγκ αναφορικά με τις εισαγωγές των
    εν λόγω εξαρτημάτων καταγωγής Σλοβακικής Δημοκρατίας
    και Ταϊβάν
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2318/95, annettu 27 päivänä syyskuuta 1995,
    väliaikaisen polkumyyntitullin käyttöön otosta Kiinan kansantasavallasta,
    Kroatiasta ja Thaimaasta peräisin olevien tiettyjen raudasta tai teräksestä
    valmistettujen putkien liitososien tuonnissa ja polkumyynnin vastaisen menettelyn
    päättämisestä Slovakian tasavallasta ja Taiwanista peräisin olevien samojen
    liitososien tuonnissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2318/95 DELLA COMMISSIONE del 27 settembre 1995 che
    istituisce un dazio antidumping provvisorio sulle importazioni di alcuni accessori
    per tubi di ferro o di acciaio, originari della Repubblica popolare cinese, della
    Croazia e della Tailandia e che chiude il procedimento antidumping relativo alle
    importazioni di siffatti prodotti originari della Repubblica slovacca e di Taiwan
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2318/95 VAN DE COMMISSIE van 27 september 1995 tot
    instelling van een voorlopig anti-dumpingrecht op de invoer van bepaalde hulpstukken
    voor buisleidingen, van ijzer of van staal, van oorsprong uit de Volksrepubliek
    China, uit Kroatië en uit Thailand en tot beëindiging van de anti-dumpingprocedure
    betreffende de invoer van deze hulpstukken van oorsprong uit de Slowaakse Republiek
    en uit Taiwan
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2318/95 DA COMISSÃO de 27 de Setembro de 1995 que
    cria um direito anti-dumping provisório sobre as importações de certos acessórios
    para tubos, de ferro ou aço, originários da República Popular da China, da
    Croácia e da Tailândia e que encerra o processo anti-dumping no que respeita
    às importações destes acessórios originários da República Eslovaca e de
    Taiwan
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2318/95 DE LA COMISIÓN de 27 de septiembre de 1995
    por el que se establece un derecho antidumping provisional sobre las importaciones
    de determinados accesorios de tubería, de hierro o de acero, originarios de la
    República Popular de China, Croacia y Tailandia y por el que se da por concluido
    el procedimiento antidumping por lo que se refiere a las importaciones de estos
    accesorios originarios de la República Eslovaca y de Taiwán
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2318/95 av den 27 september 1995 om införande
    av en tillfällig antidumpningstull på import av vissa rördelar av järn eller
    stål med ursprung i Folkrepubliken Kina, Kroatien och Thailand och om avslutande
    av antidumpningsförfarandet i fråga om import av sådana delar med ursprung
