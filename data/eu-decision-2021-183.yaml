title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/183 of 12 February 2021 amending
    Implementing Decision (EU) 2017/2453 as regards the authorisation holder and its
    representative in the Union for the placing on the market of products containing,
    consisting of or produced from certain genetically modified oilseed rapes (notified
    under document C(2021) 823) (Only the Dutch and German texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/183 de la Commission du 12 février
    2021 modifiant la décision d’exécution (UE) 2017/2453 en ce qui concerne le
    titulaire de l’autorisation et son représentant dans l’Union pour la mise
    sur le marché de produits contenant certains colzas génétiquement modifiés,
    consistant en ces colzas ou produits à partir de ceux-ci [notifiée sous le numéro
    C(2021) 823] (Les textes en langues allemande et néerlandaise sont les seuls
    faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/183 der Kommission vom 12. Februar 2021
