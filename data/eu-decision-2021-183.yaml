    wprowadzanie do obrotu produktów zawierających niektóre rodzaje genetycznie
    zmodyfikowanego rzepaku, składających się z niego lub z niego wyprodukowanych
    oraz jego przedstawiciela w Unii (notyfikowana jako dokument nr C(2021) 832) (Jedynie
    teksty w języku niemieckim i niderlandzkim są autentyczne)
  type: main
