    il titolare dell’autorizzazione e il suo rappresentante nell’Unione per l’immissione
    in commercio di prodotti contenenti, costituiti o derivati da alcuni tipi di colza
    geneticamente modificata [notificata con il numero C(2021) 823] (I testi in lingua
    neerlandese e tedesca sono i soli facenti fede)
  type: main
