    на разрешението и неговия представител в Съюза
    за пускането на пазара на продукти, съдържащи,
    състоящи се или произведени от някои видове
    генетично модифицирана маслодайна рапица
    (нотифицирано под номер С(2021) 823) (само текстовете
    на нидерландски и немски език са автентични)
  type: main
