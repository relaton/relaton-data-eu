    bizonyos olajrepcefajtákat tartalmazó, azokból álló vagy azokból előállított
    termékek forgalomba hozatalára vonatkozó engedély jogosultja és uniós képviselője
    tekintetében történő módosításáról (az érteítés a C(2021) 823. számú
    dokumentummal történt) (Csak a holland és a német nyelvű szöveg hiteles)
