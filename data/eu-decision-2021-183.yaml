    2021 que altera a Decisão de Execução (UE) 2017/2453 no que diz respeito ao
    detentor da autorização e ao seu representante na União para a colocação
    no mercado de produtos que contenham, sejam constituídos por ou sejam produzidos
    a partir de determinadas colzas geneticamente modificadas [notificada com o número
    C(2021) 823] (Apenas fazem fé os textos nas línguas alemã e neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/183 a Comisiei din 12 februarie
    2021 de modificare a Deciziei de punere în aplicare (UE) 2017/2453 în ceea ce
    privește titularul autorizației și reprezentantul său în Uniune pentru introducerea
    pe piață a produselor care conțin, constau în sau sunt fabricate din anumite
    soiuri de rapiță modificată genetic [notificată cu numărul C(2021) 823] (Numai
    textele în limbile neerlandeză și germană sunt autentice)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/183 z 12. februára 2021, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2017/2453, pokiaľ ide o držiteľa povolenia
    a jeho zástupcu v Únii na umiestnenie na trh výrobkov, ktoré obsahujú určitú
    geneticky modifikovanú repku olejnú, sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2021) 823] (Iba holandské a nemecké znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/183 z dne 12. februarja 2021 o spremembi
    Izvedbenega sklepa (EU) 2017/2453 glede imetnika odobritve za dajanje na trg proizvodov,
    ki vsebujejo nekatere gensko spremenjene oljne ogrščice, so iz njih sestavljeni
    ali proizvedeni, in njegovega zastopnika v Uniji (notificirano pod dokumentarno
    številko C(2021) 823) (Besedilo v nizozemskem in nemškem jeziku je edino verodostojno)
  type: main
