    und seines Vertreters in der Union für das Inverkehrbringen von Erzeugnissen,
    die genetisch veränderten Raps enthalten, aus ihm bestehen oder aus ihm hergestellt
    werden (Bekannt gegeben unter Aktenzeichen C(2021) 823) (Nur der deutsche und
    der niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
