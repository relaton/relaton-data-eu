id: EURegulation3992000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 399/2000 of 22 February 2000 determining
    the extent to which import rights applications submitted in February 2000 under
    the tariff quotas for beef provided for by Regulation (EC) No 1272/1999 for Estonia,
    Latvia, and Lithuania may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 399/2000 de la Commission, du 22 février 2000, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites en février 2000 pour les contingents tarifaires de la viande bovine
    prévus par le règlement (CE) n° 1272/1999 pour l'Estonie, la Lettonie et la
    Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 399/2000 der Kommission vom 22. Februar 2000 zur Bestimmung
    des Ausmaßes, in dem den im Februar 2000 gestellten Anträgen auf Erteilung von
    Einfuhrrechte im Rahmen der in der Verordnung (EG) Nr. 1272/1999 für Litauen,
    Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 399/2000 af 22. februar 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder indgivet
    i februar 2000 for de toldkontingenter i oksekødssektoren, der er fastsat i forordning
    (EF) nr. 1272/1999 for Estland, Letland og Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 399/2000 της Επιτροπής,
    της 22ας Φεβρουαρίου 2000, για τον καθορισμό σε
    ποιο βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως δικαιωμάτων εισαγωγής που υποβλήθηκαν
    τον Φεβρουάριο 2000 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται από τον
    κανονισμό (ΕΚ) αριθ. 1272/1999 για την Εσθονία, τη
    Λετονία και τη Λιθουανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 399/2000, annettu 22 päivänä helmikuuta 2000,
    asetuksessa (EY) N:o 1272/1999 määrättyjen naudanlihan tariffikiintiöitä
    koskevien, helmikuussa 2000 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
    Viron, Latvian ja Liettuan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 399/2000 della Commissione, del 22 febbraio 2000, che
    stabilisce in che misura possono essere accolte le domande di diritti di importazione
    presentate nel febbraio 2000 per i contingenti tariffari di carni bovine previsti
    dal regolamento (CE) n. 1272/1999 per l'Estonia, la Lettonia e la Lituania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 399/2000 van de Commissie van 22 februari 2000 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de in februari 2000
    ingediende aanvragen om rechten tot invoer voor de tariefcontingenten voor rundvlees
    op grond van Verordening (EG) nr. 1272/1999 voor Estland, Letland en Litouwen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 399/2000 da Comissão, de 22 de Fevereiro de 2000,
    que determina em que medida podem ser aceites os pedidos dos direitos de importação
    apresentados em Fevereiro de 2000 para os contingentes pautais de carne de bovino
    previstos no Regulamento (CE) n.° 1272/1999 para a Estónia, a Letónia e a Lituânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 399/2000 de la Comisión, de 22 de febrero de 2000,
    por el que se determina la proporción en que podrán aceptarse las solicitudes
    de derechos de importación, presentadas en febrero de 2000, correspondientes
    a los contingentes arancelarios de carne de vacuno establecidos por el Reglamento
    (CE) n° 1272/1999 para Lituania, Letonia y Estonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 399/2000 av den 22 februari 2000 om i
    vilken utsträckning ansökningar om importrättigheter kan godkännas som har
    inlämnats under februari 2000 för de tullkvoter för nötkött som föreskrivs
    i förordning (EG) nr 1272/1999 för Estland, Lettland och Litauen
  type: main
