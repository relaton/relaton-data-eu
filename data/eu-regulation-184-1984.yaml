    διακρίσεως 29.38 Β IV του Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου των προβλεπομένων από τον
    κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 184/84 della Commissione del 25 gennaio 1984 che ripristina
    la riscossione dei dazi doganali applicabili alla vitamina C, della sottovoce
    29.38 B IV della tariffa doganale comune, originaria della Cina beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 184/84 van de Commissie van 25 januari 1984 houdende
