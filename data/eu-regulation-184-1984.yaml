title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 184/84 of 25 January 1984 re-establishing
    the levying of customs duties on vitamin C, falling within subheading 29.38 B
    IV and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 184/84 de la Commission du 25 janvier 1984 portant
    rétablissement de la perception des droits de douane applicables à la vitamine
    C, de la sous-position 29.38 B IV du tarif douanier commun, originaire de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 184/84 der Kommission vom 25. Januar 1984 zur Wiedereinführung
    der Erhebung der Zölle für Vitamin C der Tarifstelle 29.38 B IV mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 184/84 af 25. januar 1984 om genindførelse
    af opkrævning af told for vitamin C, henhørende under pos. 29.38 B IV og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 184/84 της Επιτροπής
