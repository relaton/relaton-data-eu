    δασμού και επαναφορά του δασμού του κοινού
    δασμολογίου κατά την εισαγωγή τριαντάφυλλων
    με μικρό άνθος καταγωγής Ισραήλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 35/2001, annettu 8 päivänä tammikuuta 2001,
