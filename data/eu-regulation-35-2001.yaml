title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 35/2001 of 8 January 2001 suspending the
    preferential customs duties and re-establishing the Common Customs Tariff duty
    on imports of small-flowered roses originating in Israel
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 35/2001 de la Commission du 8 janvier 2001 suspendant
