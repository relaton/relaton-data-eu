  content: Council Regulation (EEC) No 797/76 of 6 April 1976 authorizing Member States
    to grant a premium on the slaughter of certain adult bovine animals intended for
    slaughter during the 1976/77 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 797/76 du Conseil, du 6 avril 1976, autorisant les
    États membres à accorder une prime en cas d'abattage de certains gros bovins
    de boucherie pendant la campagne 1976/1977
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 797/76 des Rates vom 6. April 1976 zur Ermächtigung
    der Mitgliedstaaten, im Wirtschaftsjahr 1976/1977 eine Prämie bei der Schlachtung
    bestimmter ausgewachsener Schlachtrinder zu gewähren
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 797/76 af 6. april 1976 om bemyndigelse til
