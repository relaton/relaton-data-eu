  script: Latn
  content: '96/624/EC: Commission Decision of 17 October 1996 amending Council Decision
    79/542/EEC drawing up a list of third countries from which the Member States authorize
    imports of bovine animals, swine, equidae, sheep and goats, fresh meat and meat
    products'
  type: main
- language: fr
  script: Latn
  content: '96/624/CE: Décision de la Commission du 17 octobre 1996 modifiant la
    décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l''importation des animaux des espèces
    bovine, porcine, des équidés, des ovins et des caprins, des viandes fraîches
    et des produits à base de viande'
  type: main
- language: de
