title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 492/2003 of 18 March 2003 supplementing the
    Annex to Regulation (EC) No 2400/96 on the entry of certain names in the "Register
    of protected designations of origin and protected geographical indications" provided
    for in Council Regulation (EEC) No 2081/92 on the protection of geographical indications
    and designations of origin for agricultural products and foodstuffs (Soprèssa
    Vicentina, Asparago verde di Altedo, Pêra Rocha do Oeste)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 492/2003 de la Commission du 18 mars 2003 complétant
    l'annexe du règlement (CE) n° 2400/96 relatif à l'inscription de certaines
    dénominations dans le "Registre des appellations d'origine protégées et des
    indications géographiques protégées" prévu au règlement (CEE) n° 2081/92
    du Conseil relatif à la protection des indications géographiques et des appellations
    d'origine des produits agricoles et des denrées alimentaires (Soprèssa Vicentina,
    Asparago verde di Altedo, Pêra Rocha do Oeste)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 492/2003 der Kommission vom 18. März 2003 zur Ergänzung
