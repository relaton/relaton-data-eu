  type: main
- language: hu
  script: Latn
  content: A Bizottság 492/2003/EK rendelete (2003. március 18.) az egyes elnevezéseknek
    a mezőgazdasági termékek és élelmiszerek földrajzi jelzéseinek és eredetmegjelöléseinek
    oltalmáról szóló 2081/92/EGK tanácsi rendeletben előírt „Oltalom alatt
    álló eredetmegjelölések és földrajzi jelzések nyilvántartása” elnevezésű
    nyilvántartásba való bejegyzéséről szóló 2400/96/EK rendelet mellékletének
    kiegészítéséről (Soprèssa Vicentina, Asparago verde di Altedo, Pêra Rocha
    do Oeste)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 492/2003 della Commissione, del 18 marzo 2003, che
    completa l'allegato del regolamento (CE) n. 2400/96 relativo all'iscrizione di
    alcune denominazioni nel Registro delle denominazioni di origine protette e delle
    indicazioni geografiche protette di cui al regolamento (CEE) n. 2081/92 del Consiglio
    relativo alla protezione delle indicazioni geografiche e delle denominazioni di
    origine dei prodotti agricoli e alimentari (Sopressa Vicentina, Asparago verde
    di Altedo, Pêra Rocha do Oeste)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 492/2003 (2003. gada 18. marts), ar kuru papildina
    pielikumu Regulai (EK) Nr. 2400/96 par dažu nosaukumu ierakstīšanu Aizsargāto
    cilmes vietu nosaukumu un aizsargāto ģeogrāfiskās izcelsmes norāžu reģistrā,
    kas paredzēts Padomes Regulā (EEK) Nr. 2081/92 par lauksaimniecības produktu
    un pārtikas produktu ģeogrāfiskās izcelsmes norāžu un cilmes vietu nosaukumu
    aizsardzību (Soprèssa Vicentina, Asparago verde di Altedo, Pêra Rocha do Oeste)
  type: main
- language: lt
  script: Latn
  content: 2003 m. kovo 18 d. Komisijos reglamentas (EB) Nr. 492/2003, papildantis
    Reglamento (EB) Nr. 2400/96 dėl tam tikrų pavadinimų įrašymo į Reglamente
    (EEB) Nr. 2081/92 dėl žemės ūkio produktų ir maisto produktų geografinių
    nuorodų ir kilmės vietos nuorodų apsaugos numatytą „Saugomų kilmės vietos
    nuorodų ir saugomų geografinių nuorodų registrą“ priedą (Soprèssa Vicentina,
    Asparago verde di Altedo, Pêra Rocha do Oeste)
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) Nru 492/2003 tat-18 ta’ Marzu 2003
    li jissupplementa l-Anness tar-Regolament (KE) Nru 2400/96 dwar id-dħul ta’
    ċerti ismijiet fir-“Reġistru ta’ l-ismijiet ta’ l-oriġini u l-indikazzjonijiet
