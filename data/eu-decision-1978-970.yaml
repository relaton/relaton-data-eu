title:
- language: en
  script: Latn
  content: '78/970/EEC: Commission Decision of 14 November 1978 authorizing the United
    Kingdom not to apply Community treatment to cotton tea-towels falling within heading
    No ex 62.02 of the Common Customs Tariff, originating in the People'' s Republic
    of China and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/970/CEE: Décision de la Commission, du 14 novembre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les serviettes de cuisine
    en coton de la position ex 62.02 du tarif douanier commun, originaires de la République
    populaire de Chine et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/970/EWG: Entscheidung der Kommission vom 14. November 1978, mit der
    das Vereinigte Königreich ermáchtigt wird, aus der Volksrepublik China stammende
    und in den úbrigen Mitgliedstaaten im freien Verkehr befindliche Kúchenhandtúcher
    aus Baumwolle der Tarifnummer ex 62.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/970/EØF: Kommissionens beslutning af 14. november 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage viskestykker
    af bomuld, som henhører under pos. ex 62.02 i den fælles toldtarif, har oprindelse
    i Den kinesiske Folkerepublik og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/970/CEE: Decisione della Commissione, del 14 novembre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario strofinacci di cucina,
    di cotone, della voce ex 62.02 della tariffa doganale comune, originari della
    Repubblica popolare cinese e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/970/EEG: Beschikking van de Commissie van 14 november 1978 waarbij
    het Verenigd Koninkrijk wordt gemachtigd keukenhanddoeken van katoen, van post
    ex 62.02 van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
