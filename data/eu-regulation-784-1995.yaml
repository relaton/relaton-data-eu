  content: COMMISSION REGULATION (EC) No 784/95 of 5 April 1995 amending Regulation
    (EC) No 2558/94 re-establishing the levying of customs duties on certain industrial
    products originating in China, Brazil, Singapore, Thailand and Indonesia, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3831/90
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 784/95 de la Commission du 5 avril 1995 modifiant le
    règlement (CE) n° 2558/94 portant rétablissement de la perception des droits
    de douane applicables à certains produits industriels originaires de Chine, du
    Brésil, de Singapour, de Thaïlande et d'Indonésie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 784/95 DER KOMMISSION vom 5. April 1995 zur Änderung
    der Verordnung (EG) Nr. 2558/94 zur Wiedereinführung der Erhebung der Zölle
    für bestimmte gewerbliche Waren mit Ursprung in China, Brasilien, Singapur, Thailand
    und Indonesien, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
