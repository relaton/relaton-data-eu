    oleviin teollisuustuotteisiin, joihin sovelletaan neuvoston asetuksen (ETY) N:o
    3831/90 mukaisia tullietuusjärjestelyjä, sovellettavien tullien kantamisen uudelleen
    aloittamisesta annetun asetuksen (EY) N:o 2558/94 muuttamisesta
  type: main
- language: it
  script: Latn
