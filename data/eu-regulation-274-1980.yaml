title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 274/80 of 6 February 1980 amending Regulation
    (EEC) No 2479/79 as regards the dates set for the approval of contracts relating
    to the distillation for the 1979/80 wine year of wines suitable for producing
    certain potable spirits obtained from wine with a registered designation of origin
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 274/80 de la Commission, du 6 février 1980, modifiant
    le règlement (CEE) n° 2479/79 en ce qui concerne les dates prévues pour l'
    agrément des contrats relatifs à la distillation des vins aptes à produire
    certaines eaux-de-vie de vin à appellation d' origine pour la campagne 1979/1980
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 274/80 der Kommission vom 6. Februar 1980 zur Änderung
    der Verordnung (EWG) Nr. 2479/79 hinsichtlich der für die Genehmigung der Verträge
    über die Destillation der Weine, die zur Herstellung bestimmter Branntweine aus
    Wein mit Ursprungsbezeichnung geeignet sind, für das Wirtschaftsjahr 1979/80
    vorgesehenen Termine
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 274/80 af 6. februar 1980 om ændring
    af forordning (EØF) nr. 2479/79 for så vidt angår datoerne for godkendelse
    af kontrakter om destillation af vine, der er egnet til fremstilling af visse
    brændevine med oprindelsesbetegnelse, i produktionsåret 1979/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 274/80 della Commissione, del 6 febbraio 1980, recante
    modifica del regolamento (CEE) n. 2479/79 per quanto concerne le date previste
    per l' approvazione dei contratti relativi alla distillazione, per la campagna
    1979/1980, dei vini atti a produrre talune acquaviti con denominazione d' origine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 274/80 van de Commissie van 6 februari 1980 houdende
    wijziging van Verordening (EEG) nr. 2479/79 ten aanzien van de data voor de goedkeuring
    van de contracten betreffende de distillatie van wijn die geschikt is voor de
    verwerking tot bepaalde soorten gedistilleerd van wijn met oorsprongsbenaming,
    voor het wijnoogstjaar 1979/1980
  type: main
