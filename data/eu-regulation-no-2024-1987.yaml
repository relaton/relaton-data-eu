title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2024/87 of 8 July 1987 re-establishing the
    levying of customs duties on jerseys, pullovers, etc., products of category 5
    (code 40.0050), parka' s, anoraks, etc., products of category 21 (code 40.0210),
    women' s or girls' nightdresses, pyjamas, etc., products of category 24 (code
    40.0240) and track suits, products of category 73 (code 40.0730) originating in
    Indonesia to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2024/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux chandails,
    pullovers, etc., de la catégorie 5 (code 40.0050), aux parkas, anoraks, etc.,
    de la catégorie 21 (code 40.0210), aux chemises de nuit, pyjamas, etc., de la
    catégorie 24 (code 40.0240) et aux survêtements de sport de la catégorie 73
    (code 40.0730), originaires de l' Indonésie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2024/87 der Kommission vom 8. Juli 1987 zur Wiedereinführung
    des Slipover für Pullover, Slipover usw. der Warenkategorie Nr. 5 (Kennziffer
    40.0050), Parkas, Anoraks usw. der Warenkategorie Nr. 21 (Kennziffer 40.0210),
    Nachthemden, Schlafanzüge usw. der Warenkategorie Nr. 24 (Kennziffer 40.0240)
    und Trainingsanzüge der Warenkategorie Nr. 73 (Kennziffer 40.0730) mit Ursprung
    in Indonesien, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
