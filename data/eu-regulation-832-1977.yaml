title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 832/77 of 25 April 1977 re-establishing
    the levying of customs duties on other sheep and lambskin leather, falling within
    subheading 41.03 B II originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 832/77 de la Commission, du 25 avril 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, préparées, non dénommées, de la sous-position tarifaire 41.03 B II,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 832/77 der Kommission vom 25. April 1977 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 832/77 af 25. april 1977 om genindførelse
    af opkrævning af toldafgifter for andre varer og læder af fåre- og lammeskind,
    der henhører under underposition 41.03 B II, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 832/77 della Commissione, del 25 aprile 1977, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    preparate, non nominate, della sottovoce doganale 41.03 B II, originarie dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 832/77 van de Commissie van 25 april 1977 houdende
    wederinstelling van de heffing van de douanerechten voor ander schapeleder, alsmede
    voorgelooide huiden en vellen, van schapen, andere, overige, van post 41.03 B
    II, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad tariefpreferenties werden geopend
  type: main
