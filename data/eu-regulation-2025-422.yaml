    s okolišem
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/422 felhatalmazáson alapuló rendelete (2024. december
    17.) az (EU) 2023/1114 európai parlamenti és tanácsi rendeletnek az éghajlatra
    gyakorolt káros hatásokkal és a környezettel kapcsolatos egyéb káros hatásokkal
    kapcsolatos fenntarthatósági mutatókra vonatkozó információk tartalmát,
