    uz regulatīvajiem tehniskajiem standartiem, kuros precizē tādas informācijas
    saturu, metodiku un izklāstu, kas attiecas uz ilgtspējas rādītājiem saistībā
    ar nelabvēlīgu ietekmi uz klimatu un citu ar vidi saistītu nelabvēlīgu ietekmi
  type: main
- language: lt
  script: Latn
  content: 2024 m. gruodžio 17 d. Komisijos deleguotasis reglamentas (ES) 2025/422,
