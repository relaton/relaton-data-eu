    tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/422 della Commissione, del 17 dicembre 2024,
    che integra il regolamento (UE) 2023/1114 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano il contenuto,
    le metodologie e la presentazione delle informazioni in relazione agli indicatori
    di sostenibilità per quanto riguarda gli impatti negativi sul clima e altri effetti
    negativi connessi all’ambiente
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/422 (2024. gada 17. decembris),
