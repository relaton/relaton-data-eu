- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/422 of 17 December 2024 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the content, methodologies and presentation
    of information in respect of sustainability indicators in relation to adverse
    impacts on the climate and other environment-related adverse impacts
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/422 de la Commission du 17 décembre 2024
    complétant le règlement (UE) 2023/1114 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant le contenu, les méthodes
    de préparation et la présentation des informations sur les indicateurs de durabilité
    relatifs aux incidences négatives sur le climat et aux autres incidences négatives
    liées à l’environnement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/422 der Kommission vom 17. Dezember 2024
    zur Ergänzung der Verordnung (EU) 2023/1114 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Präzisierung des Inhalts,
    der Methoden und der Darstellung von Informationen über Nachhaltigkeitsindikatoren
    in Bezug auf nachteilige Auswirkungen auf das Klima und andere umweltbezogene
    nachteilige Auswirkungen
  type: main
