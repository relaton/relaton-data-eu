title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/739 of 27 March 2026 revoking
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize MON 87419 and repealing Implementing
    Decision (EU) 2023/2134 (notified under document C(2026) 1997)
  type: main
- language: fr
  script: Latn
