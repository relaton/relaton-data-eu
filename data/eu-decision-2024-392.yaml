    et de coopération entre l’Union européenne et la Communauté européenne de
    l’énergie atomique, d’une part, et le Royaume-Uni de Grande-Bretagne et d’Irlande
    du Nord, d’autre part, en ce qui concerne l’adoption des protocoles I et II
    et la modification de son annexe 47
  type: main
