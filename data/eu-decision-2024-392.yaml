title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/392 of 15 November 2023 on the position to be
    taken on behalf of the European Union within the Specialised Committee on Participation
    in Union Programmes established by the Trade and Cooperation Agreement between
    the European Union and the European Atomic Energy Community, of the one part,
    and the United Kingdom of Great Britain and Northern Ireland, of the other part,
    as regards the adoption of Protocols I and II and the amendment of Annex 47 thereto
  type: main
- language: fr
  script: Latn
