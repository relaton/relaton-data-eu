  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1017 of 26 May 2025 on temporary
    emergency measures for Spain derogating from certain provisions of Regulation
    (EU) 2021/2115 of the European Parliament and of the Council and from Commission
    Delegated Regulation (EU) 2022/126, to resolve specific problems in the fruit
    and vegetables and wine sectors caused by severe adverse meteorological events
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1017 de la Commission du 26 mai 2025
    relatif à des mesures d’urgence temporaires en faveur de l’Espagne dérogeant
    à certaines dispositions du règlement (UE) 2021/2115 du Parlement européen
    et du Conseil et du règlement délégué (UE) 2022/126 de la Commission en vue
    de résoudre des problèmes spécifiques dans le secteur des fruits et légumes
    et le secteur vitivinicole provoqués par des graves phénomènes météorologiques
    défavorables
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1017 der Kommission vom 26. Mai 2025
    über befristete Sofortmaßnahmen für Spanien zur Abweichung von bestimmten Vorschriften
