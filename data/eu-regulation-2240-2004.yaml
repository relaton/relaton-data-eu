  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 15 d. Europos Parlamento ir Tarybos reglamentas (EB)
    Nr. 2240/2004, iš dalies keičiantis Tarybos reglamentą (EB) Nr. 975/1999, nustatantį
    reikalavimus dėl vystymąsi remiančio bendradarbiavimo veiksmų programų, kurios
    padeda siekti bendrojo tikslo – plėtoti ir įtvirtinti demokratiją ir teisinę
