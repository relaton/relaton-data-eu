    požadavky pro provádění rozvojové spolupráce, která přispívá k obecnému
    cíli rozvoje a upevnění demokracie a právního státu, jakož i k dodržování
    lidských práv a základních svobod
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 2240/2004 af 15. december
    2004 om ændring af Rådets forordning (EF) nr. 975/1999 om kravene til gennemførelsen
    af udviklingssamarbejdsaktioner, der bidrager til de generelle mål om udvikling
    og befæstelse af demokratiet og af retsstaten samt respekt for menneskerettighederne
    og de grundlæggende frihedsrettigheder
  type: main
