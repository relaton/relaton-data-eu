    prawa oraz poszanowania praw człowieka i podstawowych wolności
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2240/2004 do Parlamento Europeu e do Conselho, de
    15 de Dezembro de 2004, que altera o Regulamento (CE) n.° 975/1999 do Conselho
    que estabelece os requisitos para a execução das acções de cooperação para
    o desenvolvimento que contribuem para o objectivo geral de desenvolvimento e consolidação
    da democracia e do Estado de direito, bem como para o objectivo do respeito dos
    direitos do Homem e das liberdades fundamentais
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (ES) č. 2240/2004 z 15. decembra
    2004, ktorým sa mení a dopĺňa nariadenie Rady (ES) č. 975/1999, ktorým sa
    stanovujú podmienky vykonávania opatrení rozvojovej spolupráce, ktoré prispievajú
    k všeobecnému cieľu rozvoja a upevňovaniu demokracie a právneho štátu,
    ako aj k dodržiavaniu ľudských práv a základných slobôd
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 2240/2004 Evropskega parlamenta in Sveta z dne 15. decembra
