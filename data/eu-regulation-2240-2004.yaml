    de cooperación al desarrollo que contribuyan a alcanzar el objetivo general de
    desarrollar y consolidar la democracia y el Estado de Derecho, así como el de
    respetar los derechos humanos y las libertades fundamentales
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 2240/2004 av den 15
