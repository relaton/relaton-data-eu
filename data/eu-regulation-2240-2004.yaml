  script: Latn
  content: Regulation (EC) No 2240/2004 of the European Parliament and of the Council
    of 15 December 2004 amending Council Regulation (EC) No 975/1999 laying down the
    requirements for the implementation of development cooperation operations which
    contribute to the general objective of developing and consolidating democracy
    and the rule of law and to that of respecting human rights and fundamental freedoms
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2240/2004 du Parlement européen et du Conseil du 15
    décembre 2004 portant modification du règlement (CE) n° 975/1999 du Conseil
    fixant les exigences pour la mise en œuvre des actions de coopération au développement
    qui contribuent à l'objectif général du développement et de la consolidation
    de la démocratie et de l'État de droit ainsi qu'à celui du respect des droits
    de l'homme et des libertés fondamentales
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2240/2004 des Europäischen Parlaments und des Rates
    vom 15. Dezember 2004 zur Änderung der Verordnung (EG) Nr. 975/1999 des Rates
    zur Festlegung der Bedingungen für die Durchführung von Maßnahmen auf dem Gebiet
    der Entwicklungszusammenarbeit, die zu dem allgemeinen Ziel der Fortentwicklung
    und Festigung der Demokratie und des Rechtsstaats sowie zur Wahrung der Menschenrechte
    und Grundfreiheiten beitragen
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 2240/2004 ze dne 15.
