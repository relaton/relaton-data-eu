  script: Latn
  content: Verordening (EG) nr. 2240/2004 van het Europees Parlement en de Raad van
    15 december 2004 tot wijziging van Verordening (EG) nr. 975/1999 van de Raad tot
    vaststelling van de voorwaarden voor de uitvoering van acties op het gebied van
    de ontwikkelingssamenwerking die een bijdrage leveren tot de verwezenlijking van
    de algemene doelstelling van ontwikkeling en consolidatie van de democratie en
    de rechtsstaat, alsmede van de doelstelling van eerbiediging van de mensenrechten
    en de fundamentele vrijheden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie (WE) nr 2240/2004 Parlamentu Europejskiego i Rady z dnia
