  script: Latn
  content: Regolamento (CE) n 2240/2004 del Parlamento europeo e del Consiglio, del
    15 dicembre 2004, recante modifica del regolamento (CE) n. 975/1999 del Consiglio
    che fissa le modalità di attuazione delle azioni di cooperazione allo sviluppo,
    che contribuiscono all'obiettivo generale di sviluppo e consolidamento della democrazia
    e dello stato di diritto nonché a quello del rispetto dei diritti dell'uomo e
    delle libertà fondamentali
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 2240/2004 (2004. gada 15.
    decembris), ar ko groza Padomes Regulu (EK) Nr. 975/1999, ar kuru paredz prasības
    attiecībā uz to, kā īstenot sadarbību attīstības veicināšanas jomā,
    kas palīdz sasniegt vispārēju mērķi – attīstīt un nostiprināt demokrātiju
