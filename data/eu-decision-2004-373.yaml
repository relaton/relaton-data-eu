  script: Latn
  content: '2004/373/EC: Commission Decision of 13 April 2004 amending Annexes I and
    II to Decision 2002/308/EC establishing lists of approved zones and approved farms
    with regard to one or more of the fish diseases viral haemorrhagic septicaemia
    (VHS) and infectious haematopoietic necrosis (IHN) (Text with EEA relevance) (notified
    under document number C(2004) 1309)'
  type: main
- language: fr
  script: Latn
  content: '2004/373/CE: Décision de la Commission du 13 avril 2004 modifiant les
    annexes I et II de la décision 2002/308/CE établissant les listes des zones
    et des exploitations piscicoles agréées au regard de la septicémie hémorragique
    virale (SHV) ou de la nécrose hématopoïétique infectieuse (NHI), ou de ces
    deux maladies (Texte présentant de l''intérêt pour l''EEE) [notifiée sous
    le numéro C(2004) 1309]'
  type: main
