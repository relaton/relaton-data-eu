    1987/88 und der geschätzten Erzeugung, der Anpassung der garantierten Höchstmenge
    und der Kürzung der Beihilfe für das Wirtschaftsjahr 1988/89
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2727/88 af 31. august 1988 om fastsættelse
    for ikke-egreneret bomuld for produktionsåret 1987/88 af den faktiske produktion
    og for produktionsåret 1988/89 af den anslåede produktion, justering af den
    maksimale garantimængde og nedsættelse af støttebeløbet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2727/88 της Επιτροπής
