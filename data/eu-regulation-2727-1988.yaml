    production, the adjustment in the maximum guaranteed quantity and the reduction
    in the aid for the 1988/89 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2727/88 de la Commission du 31 août 1988 fixant,
