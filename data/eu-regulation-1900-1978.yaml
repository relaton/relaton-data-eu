title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1900/78 of 2 August 1978 re-establishing
    the levying of the customs duties on primary cells and primary batteries, falling
    within heading No 85.03 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1900/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux piles électriques,
    de la position 85.03 du tarif douanier commun, originaires de Hong-Kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1900/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Primärelemente und Primärbatterien der Tarifnummer 85.03
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1900/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for primærelementer og primærbatterier, under
    position 85.03, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1900/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle pile elettriche della
    voce doganale 85.03, originarie di Hong Kong beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1900/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op elektrische
    elementen en elektrische batterijen, van post 85.03, van oorsprong uit Hong-Kong,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
