  script: Latn
  content: Commission Regulation (EC) No 904/96 of 21 May 1996 correcting, for the
    second time, Regulation (EC) No 1802/95 amending the Regulations that fixed, prior
    to 1 February 1995, certain prices and amounts in the market in milk and milk
    products of which the value in ecus was adapted as a result of the abolition of
    the correcting factor for agricultural conversion rates
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 904/96 de la Commission, du 21 mai 1996, rectifiant,
