id: EURegulation20161096
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/1096 of 6 July 2016 amending
    Regulation (EC) No 1251/2008 as regards the requirements for placing on the market
    of consignments of certain fish species intended for the Member States or parts
    thereof with national measures for salmonid alphavirus (SAV) approved by Decision
    2010/221/EU
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/1096 de la Commission du 6 juillet 2016
    modifiant le règlement (CE) n° 1251/2008 en ce qui concerne les exigences applicables
    à la mise sur le marché de lots de certaines espèces de poissons destinés
    à des États membres ou parties d'États membres faisant l'objet de mesures nationales
    concernant l'alphavirus des salmonidés (SAV) approuvées par la décision 2010/221/UE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/1096 der Kommission vom 6. Juli 2016
    zur Änderung der Verordnung (EG) Nr. 1251/2008 hinsichtlich der Vorschriften
    für das Inverkehrbringen von Sendungen mit bestimmten Fischarten, die für Mitgliedstaaten
    oder Teile von Mitgliedstaaten bestimmt sind, in denen mit dem Beschluss 2010/221/EU
    genehmigte nationale Maßnahmen in Bezug auf das Lachs-Alphavirus (SAV) gelten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/1096 на Комисията
    от 6 юли 2016 година за изменение на Регламент
    (ЕО) № 1251/2008 по отношение на изискванията за
    пускане на пазара на пратки с някои видове
    риба, предназначени за държавите членки или
    части от тях, в които се прилагат национални
    мерки във връзка с алфавирус по пъстървовите
    риби (SAV), одобрени с Решение 2010/221/ЕС
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/1096 ze dne 6. července 2016,
    kterým se mění nařízení (ES) č. 1251/2008, pokud jde o požadavky pro uvádění
    na trh zásilek některých druhů ryb určených pro členské státy nebo jejich
    části, kde existují vnitrostátní opatření týkající se alfaviru lososovitých
    (SAV) schválená rozhodnutím 2010/221/EU
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/1096 af 6. juli 2016
    om ændring af forordning (EF) nr. 1251/2008 for så vidt angår betingelser for
    markedsføring af sendinger af visse fiskearter bestemt til medlemsstater eller
    dele af medlemsstater, der er omfattet af nationale foranstaltninger vedrørende
    salmonid alfavirus (SAV) godkendt ved afgørelse 2010/221/EU
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/1096 της Επιτροπής,
    της 6ης Ιουλίου 2016, σχετικά με την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1251/2008 όσον αφορά τις
    απαιτήσεις για τη διάθεση στην αγορά αποστολών
    ορισμένων ειδών ψαριών που προορίζονται για
    κράτη μέλη ή τμήματα αυτών τα οποία προβλέπουν
    εθνικά μέτρα σχετικά με τον ιό άλφα των σαλμονιδών
    [salmonid alphavirus (SAV)] τα οποία έχουν εγκριθεί με την
    απόφαση 2010/221/ΕΕ
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/1096, 6. juuli 2016, millega muudetakse
    määrust (EÜ) nr 1251/2008 seoses teatavate kalaliikide turule laskmise nõuetega,
    mis on ette nähtud sellistes liikmesriikides või nende osades, kus on kehtestatud
    otsusega 2010/221/EL heaks kiidetud riiklikud meetmed lõheliste alfaviiruse (SAV)
    suhtes
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/1096, annettu 6 päivänä
    heinäkuuta 2016, asetuksen (EY) N:o 1251/2008 muuttamisesta sellaisiin jäsenvaltioihin
    tai niiden osiin tarkoitettujen tiettyjen kalalajien lähetysten markkinoille
    saattamista koskevien vaatimusten osalta, joissa toteutetaan päätöksellä 2010/221/EU
    hyväksyttyjä lohikalojen alfavirusta (SAV) koskevia kansallisia toimenpiteitä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/1096 оd 6. srpnja 2016. o izmjeni
    Uredbe (EZ) br. 1251/2008 u pogledu zahtjeva za stavljanje na tržište pošiljki
    određenih ribljih vrsta namijenjenih državama članicama ili njihovim dijelovima
    s nacionalnim mjerama u pogledu salmonidnog alfavirusa (SAV) odobrenima Odlukom
    2010/221/EU
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/1096 végrehajtási rendelete (2016. július 6.)
    az 1251/2008/EK rendeletnek a salmonid alfavírus (SAV) tekintetében a 2010/221/EU
    határozattal jóváhagyott nemzeti intézkedések hatálya alá tartozó tagállamokba
    vagy azok egyes részeibe szánt, bizonyos halfajokból álló szállítmányok
    forgalomba hozatalára vonatkozó követelmények tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/1096 della Commissione, del 6 luglio
    2016, che modifica il regolamento (CE) n. 1251/2008 per quanto riguarda le prescrizioni
    per l'immissione sul mercato di partite di determinate specie di pesci destinate
    agli Stati membri, o parti degli stessi, che applicano misure nazionali relative
    all'alfavirus dei salmonidi (SAV) approvate a norma della decisione 2010/221/UE
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/1096 (2016. gada 6. jūlijs),
    ar ko Regulu (EK) Nr. 1251/2008 groza attiecībā uz prasībām par dažu sugu
    zivju sūtījumu laišanu tirgū dalībvalstīs vai to daļās, kurās tiek īstenoti
    ar Lēmumu 2010/221/ES apstiprināti valsts pasākumi attiecībā uz lašu dzimtas
    zivju alfavīrusu (SAV)
  type: main
- language: lt
  script: Latn
  content: 2016 m. liepos 6 d. Komisijos įgyvendinimo reglamentas (ES) 2016/1096,
    kuriuo dėl tam tikrų rūšių žuvų siuntų teikimo rinkai reikalavimų, skirtų
    valstybėms narėms arba jų dalims, kuriose taikomos Sprendimu 2010/221/ES patvirtintos
    nacionalinės priemonės dėl lašišinių alfa viruso (LAV), iš dalies keičiamas
    Reglamentas (EB) Nr. 1251/2008
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/1096 tas-6 ta'
    Lulju 2016 li jemenda r-Regolament (KE) Nru 1251/2008 rigward ir-rekwiżiti għat-tqegħid
    fis-suq ta' kunsinni ta' ċerti speċijiet ta' ħut maħsuba għall-Istati Membri
    jew għal partijiet tagħhom li għandhom miżuri nazzjonali rigward l-alfavirus
    tas-salmonidi (SAV) approvati bid-Deċiżjoni 2010/221/UE
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/1096 van de Commissie van 6 juli 2016
    tot wijziging van Verordening (EG) nr. 1251/2008 wat betreft de voorschriften
    voor het in de handel brengen van zendingen van bepaalde vissoorten bestemd voor
    lidstaten of delen daarvan waarvoor nationale maatregelen betreffende het salmonid
    alphavirus (SAV) zijn goedgekeurd bij Besluit 2010/221/EU
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/1096 z dnia 6 lipca 2016 r.
    zmieniające rozporządzenie (WE) nr 1251/2008 w zakresie wymagań dotyczących
    wprowadzania do obrotu przesyłek pewnych gatunków ryb przeznaczonych dla państw
    członkowskich lub części państw członkowskich, w których obowiązują środki
    krajowe w odniesieniu do alfawirusa ryb łososiowatych (SAV) zatwierdzone decyzją
    2010/221/UE
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/1096 da Comissão, de 6 de julho de
    2016, que altera o Regulamento (CE) n.° 1251/2008 no que diz respeito aos requisitos
    em matéria de colocação no mercado de remessas de determinadas espécies de
    peixes destinadas a Estados-Membros ou partes destes com medidas nacionais relativas
    ao alfavírus dos salmonídeos (SAV) aprovadas pela Decisão 2010/221/UE
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/1096 al Comisiei din 6 iulie
    2016 de modificare a Regulamentului (CE) nr. 1251/2008 în ceea ce privește cerințele
    pentru introducerea pe piață a transporturilor de anumite specii de pești destinate
    statelor membre sau părților acestora în care se aplică măsuri naționale
    privind alphavirusul salmonidelor (SAV), aprobate prin Decizia 2010/221/UE
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/1096 zo 6. júla 2016, ktorým
    sa mení nariadenie (ES) č. 1251/2008, pokiaľ ide o uvádzanie na trh zásielok
    určitých druhov rýb určených do členských štátov alebo ich častí, v
    ktorých platia vnútroštátne opatrenia týkajúce sa alfavírusu lososovitých
    rýb (SAV) schválené rozhodnutím 2010/221/EÚ
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/1096 z dne 6. julija 2016 o spremembi
    Uredbe (ES) št. 1251/2008 v zvezi z zahtevami za dajanje na trg pošiljk nekaterih
    vrst rib, namenjenih državam članicam ali njihovim delom z nacionalnimi ukrepi
    proti salmonidnemu alfavirusu (SAV), odobrenimi s Sklepom 2010/221/EU
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/1096 de la Comisión, de 6 de julio
    de 2016, por el que modifica el Reglamento (CE) n.° 1251/2008 en lo que respecta
    a los requisitos de comercialización aplicables a las partidas de determinadas
    especies de peces destinadas a Estados miembros o partes de ellos que cuentan
    con medidas nacionales en relación con el alfavirus de los salmónidos (AVS)
    aprobadas mediante la Decisión 2010/221/UE
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/1096 av den 6 juli 2016
    om ändring av förordning (EG) nr 1251/2008 vad gäller krav för utsläppande
    på marknaden av sändningar av vissa fiskarter som är avsedda för medlemsstater
    eller delar av dessa med nationella åtgärder avseende salmonid alfavirus (SAV)
    som godkänts genom beslut 2010/221/EU
