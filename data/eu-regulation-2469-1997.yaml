  content: Commission Regulation (EC) No 2469/97 of 11 December 1997 amending Regulations
    (EEC) No 1964/82 laying down the conditions for granting special export refunds
    on certain cuts of boned meat of bovine animals, (EEC) No 3846/87 establishing
