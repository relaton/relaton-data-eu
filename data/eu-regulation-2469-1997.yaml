  script: Latn
  content: A Bizottság 2469/97/EK rendelete (1997. december 11.) a szarvasmarhafélék
    kicsontozott húsának egyes darabjaira nyújtott különleges export-visszatérítésekre
    vonatkozó feltételek megállapításáról szóló 1964/82/EGK rendelet, az
