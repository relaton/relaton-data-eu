    létrehozásáról szóló 3846/87/EGK rendelet és a marha- és borjúhúságazatban
    a behozatali és kiviteli engedélyekre vonatkozó alkalmazási szabályokról
    szóló 1445/95/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2469/97 della Commissione dell'11 dicembre 1997 che
    modifica i regolamenti (CEE) n. 1964/82, che stabilisce le condizioni per la concessione
