  content: '83/272/EEC: Commission Decision of 24 May 1983 establishing that the apparatus
    described as ''Reactor - Pneumatic Transfer System, model Flexo-Rabbit'' may not
    be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/272/CEE: Décision de la Commission du 24 mai 1983 constatant que l''importation
    de l''appareil dénommé "Reactor - Pneumatic Transfer System, model Flexo- Rabbit"
    ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/272/EWG: Entscheidung der Kommission vom 24. Mai 1983, mit der festgestellt
    wird, daß das Gerät ,,Reactor - Pneumatic Transfer System, model Flexo-Rabbit"
    nicht unter Befreiung von Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '83/272/EØF: Kommissionens beslutning af 24. maj 1983 om fastslåelse
    af, at indførsel af apparatet "Reactor- Pneumatic Transfer System, model Flexo-Rabbit"
    ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
