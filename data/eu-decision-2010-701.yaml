    съюз в рамките на Съвета за стабилизиране и
    асоцииране, създаден със Споразумението за
    стабилизиране и асоцииране между Европейските
    общности и техните държави-членки, от една
    страна, и бившата югославска република Македония,
    от друга страна, по отношение на приемането
    на разпоредби относно координацията на системите
    за социална сигурност
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 21. října 2010 o postoji, který má Evropská
    unie zaujmout v Radě stabilizace a přidružení zřízené Dohodou o stabilizaci
    a přidružení mezi Evropskými společenstvími a jejich členskými státy
    na jedné straně a Bývalou jugoslávskou republikou Makedonií na straně druhé
    k přijetí opatření pro koordinaci systémů sociálního zabezpečení
  type: main
- language: da
  script: Latn
