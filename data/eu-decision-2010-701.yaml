title:
- language: en
  script: Latn
  content: Council Decision of 21 October 2010 on the position to be taken by the
    European Union within the Stabilisation and Association Council established by
    the Stabilisation and Association Agreement between the European Communities and
    their Member States, of the one part, and the former Yugoslav Republic of Macedonia,
    of the other part, with regard to the adoption of provisions on the coordination
    of social security systems
  type: main
- language: fr
  script: Latn
  content: Décision du Conseil du 21 octobre 2010 relative à la position à adopter
    par l’Union européenne au sein du conseil de stabilisation et d’association
    institué par l’accord de stabilisation et d’association entre les Communautés
    européennes et leurs États membres, d’une part, et l’ancienne République
    yougoslave de Macédoine, d’autre part, concernant l’adoption de dispositions
    sur la coordination des systèmes de sécurité sociale
  type: main
- language: de
  script: Latn
  content: Beschluss des Rates vom 21. Oktober 2010 über den Standpunkt der Europäischen
    Union im Stabilitäts- und Assoziationsrat, der gemäß dem Stabilisierungs- und
    Assoziierungsabkommen zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten
    einerseits und der ehemaligen jugoslawischen Republik Mazedonien andererseits
    eingerichtet worden ist, zur Annahme von Bestimmungen über die Koordinierung
    der Systeme der sozialen Sicherheit
  type: main
- language: bg
  script: Cyrl
