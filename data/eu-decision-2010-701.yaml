    érdekében elfogadásra kerülő rendelkezésekkel kapcsolatosan képviselendő
    európai uniós álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 21 ottobre 2010, relativa alla posizione che
    l’Unione europea deve adottare nell’ambito del Consiglio di stabilizzazione
    e di associazione istituito dall’accordo di stabilizzazione e di associazione
    tra le Comunità europee e i loro Stati membri, da una parte, e l’ex Repubblica
    iugoslava di Macedonia, dall’altra, per quanto riguarda l’adozione di disposizioni
    sul coordinamento dei sistemi di sicurezza sociale
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (2010. gada 21. oktobris) par nostāju, kas Eiropas Savienībai
    jāieņem Stabilizācijas un asociācijas padomē, kura izveidota ar Stabilizācijas
    un asociācijas nolīgumu starp Eiropas Kopienām un to dalībvalstīm, no vienas
    puses, un Bijušo Dienvidslāvijas Maķedonijas Republiku, no otras puses, attiecībā
