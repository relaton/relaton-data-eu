    i henhold til stabiliserings- og associeringsaftalen mellem De Europæiske Fællesskaber
    og deres medlemsstater på den ene side og Den Tidligere Jugoslaviske Republik
    Makedonien på den anden side, om vedtagelse af bestemmelser om koordinering af
    sociale sikringsordninger
  type: main
- language: el
  script: Grek
