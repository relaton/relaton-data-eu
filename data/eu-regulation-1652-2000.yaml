title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1652/2000 of 26 July 2000 determining the
    extent to which applications submitted in July 2000 for import licences for the
    tariff quota for beef and veal provided for in the European Agreement between
    the Community and the Republic of Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1652/2000 de la Commission du 26 juillet 2000 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 2000 pour le contingent tarifaire de viandes bovines prévu
    par l'accord européen entre la Communauté et la République de Slovénie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1652/2000 der Kommission vom 26. Juli 2000 zur Bestimmung
    des Prozentsatzes, zu dem den im Juli 2000 gestellten Anträgen auf Erteilung
    von Lizenzen für die Einfuhr von Rindfleisch im Rahmen des Zollkontingents gemäß
    dem zwischen der Gemeinschaft und der Republik Slowenien geschlossenen Europa-Abkommen
    stattgegeben wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1652/2000 af 26. juli 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i juli 2000 om importlicenser
    for kød i forbindelse med det toldkontingent for oksekød, der er fastsat ved
    Europaaftalen mellem EF og Republikken Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1652/2000 της Επιτροπής,
    της 26ης Ιουλίου 2000, για τον καθορισμό του βαθμού
    στον οποίο μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 2000 για τη δασμολογική ποσόστωση
    βοείου κρέατος που προβλέπεται από την ευρωπαϊκή
    συμφωνία μεταξύ της Κοινότητας και της Δημοκρατίας
    της Σλοβενίας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1652/2000, annettu 26 päivänä heinäkuuta
    2000, heinäkuussa 2000 esitettyjen tuontitodistushakemusten hyväksyttävyydestä
    yhteisön sekä Slovenian tasavallan välisessä Eurooppa-sopimuksessa määrätyn
    naudanlihaa koskevan tariffikiintiön osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1652/2000 della Commissione, del 26 luglio 2000, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel luglio 2000 per i contingenti tariffari supplementari di carni
    bovine previsti dall'accordo europeo tra la Comunità e la Repubblica di Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1652/2000 van de Commissie van 26 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 2000 ingediende aanvragen
    om invoercertificaten voor het tariefcontingent voor rundvlees dat bij de Europaovereenkomst
    tussen de Gemeenschap en de Republiek Slovenië is vastgesteld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1652/2000 da Comissão, de 26 de Julho de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Julho de 2000 para o contingente pautal de carne de bovino previsto
    no acordo europeu entre a Comunidade e a República da Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1652/2000 de la Comisión, de 26 de julio de 2000,
    por el que se determina la proporción en que podrán aceptarse las solicitudes
    de certificados de importación presentadas en julio de 2000, correspondientes
    al contingente arancelario de carne de vacuno establecido en el Acuerdo europeo
    entre la Comunidad y la República de Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1652/2000 av den 26 juli 2000 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under juli 2000 för den
    tullkvot för nötkött som föreskrivs i Europaavtalet mellan gemenskapen och
    Republiken Slovenien kan godkännas
