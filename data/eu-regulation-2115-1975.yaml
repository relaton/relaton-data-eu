title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2115/75 of the Commission of 12 August 1975 laying
    down in respect of the 1975/76 wine-growing year detailed rules for applying the
    obligation to distil the by-products of wine-making and repealing Regulation (EEC)
    No 2179/74
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2115/75 de la Commission, du 12 août 1975, relatif
    aux modalités d'application de l'obligation de distiller les sous-produits de
    la vinification pour la campagne 1975/1976 et abrogeant le règlement (CEE) n°
    2179/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2115/75 der Kommission vom 12. August 1975 über Durchführungsbestimmungen
    für die Verpflichtung zur Destillation von Nebenerzeugnissen der Weinbereitung
    im Wirtschaftsjahr 1975/1976 und zur Aufhebung der Verordnung (EWG) Nr. 2179/74
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2115/75 af 12. august 1975 om gennemførelsesbestemmelser
    for forpligtelsen til at destillere biprodukter ved vinfremstilling i produktionsåret
    1975/1976 og om ophævelse af forordning (EØF) nr. 2179/74
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2115/75 della Commissione, del 12 agosto 1975, che
    stabilisce le modalità di applicazione dell'obbligo di distillare i sottoprodotti
    della vinificazione per la campagna viticola 1975/1976 e abroga il regolamento
    (CEE) n. 2179/74
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2115/75 van de Commissie van 12 augustus 1975 houdende
    uitvoeringsbepalingen inzake de verplichte distillatie van de bijprodukten van
    de wijnbereiding in het wijnoogstjaar 1975/1976 en houdende intrekking van Verordening
    (EEG) nr. 2179/74
