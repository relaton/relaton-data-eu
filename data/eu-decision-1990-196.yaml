title:
- language: en
  script: Latn
  content: '90/196/EEC: Commission Decision of 10 April 1990 terminating the anti-dumping
    proceeding concerning imports of methenamine (hexamethylenetetramine) originating
    in Hungary and Yugoslavia and accepting undertakings offered in connection with
    the proceeding concerning imports of methenamine (hexamethylenetetramine) originating
    in Bulgaria, Czechoslovakia, Poland and Romania'
  type: main
- language: fr
  script: Latn
  content: '90/196/CEE: Décision de la Commission du 10 avril 1990 portant clôture
    de la procédure antidumping concernant les importations de méthénamine (hexaméthylènetétramine)
    originaire de Hongrie et de Yougoslavie, et portant acceptation d''engagements
    souscrits dans le cadre de la procédure concernant les importations de méthénamine
    (hexaméthylènetétramine) originaire de Bulgarie, de Pologne, de Roumanie et
    de Tchécoslovaquie'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 10. April 1990 zur Einstellung des Antidumpingverfahrens
    betreffend die Einfuhren von Methenamin (Hexamethylentetramin) mit Ursprung in
    Jugoslawien und Ungarn und zur Annahme von Verpflichtungen im Zusammenhang mit
    dem Verfahren betreffend die Einfuhren von Methenamin (Hexamethylentetramin) mit
    Ursprung in Bulgarien, Polen, Rumaenien und der Tschechoslowakei (90/196/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 10. april 1990 om afslutning af antidumpingproceduren
    vedroerende importen af methenamin (hexamethylentetramin) med oprindelse i Jugoslavien
    og Ungarn og om godtagelse af tilsagn i forbindelse med proceduren vedroerende
    importen af methenamin (hexamethylentetramin) med oprindelse i Bulgarien, Polen,
    Rumaenien og Tjekkoslovakiet (90/196/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/196/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Απριλίου 1990 για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές μεθεναμίνης
    (εξαμεθυλενοτετραμίνης) καταγωγής Ουγγαρίας
    και Γιουγκοσλαβίας και για την αποδοχή των
    αναλήψεων υποχρεώσεων που προτείνονται στο
    πλαίσιο της διαδικασίας όσον αφορά τις εισαγωγές
    μεθαναμίνης ( εξαμεθυλενοτετραμίνης ) καταγωγής
    Βουλγαρίας, Πολωνίας, Ρουμανίας και Τσεχοσλοβακίας'
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 10 aprile 1990 recante chiusura del procedimento
    antidumping relativo alle importazioni di metenamina (esametilentetrammina) originaria
    dell'Ungheria e della Iugoslavia, e accettazione degli impegni offerti in merito
    alle importazioni dello stesso prodotto originario della Bulgaria, della Cecoslovacchia,
    della Polonia e della Romania (90/196/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE COMMISSIE van 10 april 1990 tot beëindiging van het anti-dumpingonderzoek
    met betrekking tot de invoer van methenamine (hexamethyleentetramine), van oorsprong
    uit Hongarije en Joegoslavië, en tot aanvaarding van de in verband met het onderzoek
    naar de invoer van methenamine (hexamethyleentetramine), van oorsprong uit Bulgarije,
    Polen, Roemenië en Tsjechoslowakije, aangeboden verbintenissen (90/196/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 10 de Abril de 1990 que encerra o processo anti-dumping
    relativo às importaçoes de metenamina (hexametilenotetramina) originaria da
    Hungria e da Jugoslavia e que aceita compromissos oferecidos no âmbito do processo
    relativo às importaçoes de metenamina (hexametilenotetramina) originaria da
    Bulgaria, da Checoslovaquia, da Polonia e da Roménia (90/196/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DE LA COMISION de 10 de abril de 1990 por la que se da por concluido
    el procedimiento antidumping relativo a las importaciones de metenamina (hexametilentetramina)
    originarias de Hungria y Yugoslavia y por la que se aceptan los compromisos ofrecidos
    en relacion con el procedimiento referente a las importaciones de metenamina (hexametilentetramina)
    originarias de Bulgaria, Checoslovaquia, Polonia y Rumania (90/196/CEE)
  type: main
