title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2161/75 of the Commission of 19 August 1975 determining
    for the marketing year 1975/76 the variety of long grain rice representative of
    Community production, the difference in value between this variety and the variety
    of round grain rice corresponding to the standard quality and the threshold prices
    for long grain husked rice and for milled rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2161/75 de la Commission, du 19 août 1975, fixant,
    pour la campagne 1975/1976, la variété de riz à grains longs représentative
    de la production communautaire, la différence de valeur entre celle-ci et la
    variété de riz à grains ronds correspondant à la qualité type, le prix de
    seuil du riz décortiqué à grains longs et les prix de seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2161/75 der Kommission vom 19. August 1975 zur Festsetzung
    der für die Gemeinschaftsproduktion repräsentativen langkörnigen Reissorte,
    des Wertunterschieds zwischen dieser Sorte und der der Standardqualität entsprechenden
    rundkörnigen Reissorte, des Schwellenpreises für geschälten langkörnigen Reis
    und der Schwellenpreise für vollständig geschliffenen Reis für das Wirtschaftsjahr
    1975/1976
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2161/75 af 19. august 1975 om fastsættelse
    for høståret 1975/1976 af den langkornede rissort, der er repræsentativ for
    produktionen i Fællesskabet, af værdiforskellen mellem denne sort og den rundkornede
    rissort, der svarer til standardkvaliteten, af tærskelprisen for afskallet langkomet
    ris og tærskelprisen for sleben ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2161/75 della Commissione, del 19 agosto 1975, che
    fissa, per la campagna 1975/1976, la varietà di riso a grani lunghi rappresentativa
    della produzione comunitaria, la differenza di valore tra quest'ultima e la varietà
    di riso a grani tondi corrispondente alla qualità tipo, il prezzo d'entrata del
    riso semigreggio a grani lunghi ed i prezzi d'entrata del riso lavorato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2161/75 van de Commissie van 19 augustus 1975 tot
    vaststelling voor het verkoopseizoen 1975/1976 van de variëteit langkorrelige
    rijst die representatief is voor de communautaire produktie, het waardeverschil
    tussen deze variëteit en de variëteit rondkorrelige rijst die met de standaardkwaliteit
    overeenkomt, de drempelprijs voor langkorrelige gedopte rijst en de drempelprijzen
    voor volwitte rijst
  type: main
