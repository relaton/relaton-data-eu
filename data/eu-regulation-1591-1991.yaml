    kategori nr. 26 (løbenummer 40.0260) og kategori nr. 37 (løbenummer 40.0370),
    som har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
