title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1591/91 of 12 June 1991 re-establishing
    the levying of customs duties on products of categories 22, 26 and 37 (order Nos
    40.0220, 40.0260 and 40.0370), originating in Pakistan, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1591/91 de la Commission, du 12 juin 1991, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 22 (numéro d' ordre 40.0220), 26 (numéro d' ordre 40.0260) et
    37 (numéro d' ordre 40.0370), originaires du Pakistan, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) nº 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1591/91 der Kommission vom 12. Juni 1991 über die
    Wiedereinführung des Zollsatzes für die Waren der Kategorie Nr. 22 (laufende
    Nummer 40.0220), der Kategorie Nr. 26 (laufende Nummer 40.0260) und der Kategorie
    Nr. 37 (laufende Nummer 40.0370) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1591/91 af 12. juni 1991 om genindførelse
