title:
- language: fr
  script: Latn
  content: Décision 65/582/CEE du Conseil du 29 décembre 1965, portant prorogation
    de l'autorisation accordée à la République fédérale d'Allemagne de suspendre,
    à l'égard des pays tiers, les droits de son tarif applicables aux maisons en
    bois, démontables, de la position Ex 44.23 et à certains ouvrages de la position
    Ex 68.11 du Tarif douanier commun
  type: main
- language: de
  script: Latn
  content: '65/582/EWG: Entscheidung des Rates vom 29. Dezember 1965 zur Verlängerung
    der Ermächtigung der Bundesrepublik Deutschland, die Zollsätze ihres Zolltarifs
    für zerlegbare Holzhäuser der Tarifnummer ex 44.23 und für bestimmte Waren
    der Tarifnummer ex 68.11 des Gemeinsamen Zolltarifs gegenüber dritten Ländern
    auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/582/CEE: Decisione del Consiglio, del 29 dicembre 1965, che proroga
    l''autorizzazione concessa alla Repubblica federale di Germania di sospendere,
    nei confronti dei paesi terzi, i dazi fissati nella sua tariffa per le costruzioni
    smontabili in legno di cui alla voce ex 44.23 ed a taluni lavori di cui alla voce
    ex 68.11 della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '65/582/EEG: Beschikking van de Raad van 29 december 1965 houdende verlenging
    van de aan de Bondsrepubliek Duitsland verleende machtiging om ten opzichte van
    derde landen de rechten van haar tarief voor montagehuizen van hout, van post
    ex 44.23 en voor sommige werken van post ex 68.11 van het gemeenschappelijk douanetarief,
    te schorsen'
  type: main
