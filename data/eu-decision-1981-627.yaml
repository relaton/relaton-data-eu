title:
- language: en
  script: Latn
  content: '81/627/EEC: Commission Decision of 15 July 1981 amending Decisions 81/91/EEC
    and 81/92/EEC as regards the lists of establishments in the Argentine Republic
    and in the Republic of Uruguay approved for the purposes of the importation of
    fresh beef and veal, sheepmeat and meat of domestic solipeds into the Community'
  type: main
- language: fr
  script: Latn
  content: '81/627/CEE: Décision de la Commission, du 15 juillet 1981, modifiant
    les décisions 81/91/CEE et 81/92/CEE en ce qui concerne les listes des établissements
    de la République argentine et de la République d''Uruguay agréés pour l''importation
    dans la Communauté de viandes fraîches bovine, ovine ainsi que de solipèdes
    domestiques'
  type: main
- language: de
  script: Latn
  content: '81/627/EWG: Entscheidung der Kommission vom 15. Juli 1981 zur Änderung
    der Entscheidungen 81/91/EWG und 81/92/EWG hinsichtlich der Listen der Betriebe
    der Republik Argentinien und der Republik Uruguay, aus denen die Einfuhr von frischem
    Fleisch von Rindern und Schafen sowie von Einhufern (Haustieren) in die Gemeinschaft
    zugelassen ist'
  type: main
- language: da
  script: Latn
  content: '81/627/EØF: Kommissionens beslutning af 15. juli 1981 om ændring af
    beslutning 81/91/EØF og 81/92/EØF for så vidt angår listerne over de virksomheder
    i republikken Argentina og republikken Uruguay, der er godkendt for indførsel
    til Fællesskabet af fersk kød af kvæg, får og enhovede husdyr'
  type: main
- language: el
  script: Grek
  content: '81/627/ΕΟΚ: Απόφαση τής Επιτροπής τής 15ης
    Ιουλίου 1981 περί τροποποιήσεως τών αποφάσεων
    81/91/ΕΟΚ καί 81/92/ΕΟΚ περί τού καταλόγου τών εγκεκριμένων
    εγκαταστάσεων τής Δημοκρατίας τής Αργεντινής
    καί τής Δημοκρατίας τής Ουρουγουάης γιά τήν
    εισαγωγή στήν Κοινότητα νωπού βοείου καί προβείου
    κρέατος καθώς καί κατοικιδίων μονύχων'
  type: main
- language: it
  script: Latn
  content: '81/627/CEE: Decisione della Commissione, del 15 luglio 1981, recante modifica
    delle decisioni 81/91/CEE e 81/92/CEE relative all'' elenco degli stabilimenti
    della Repubblica argentina e della Repubblica d'' Uruguay in provenienza dai quali
    è autorizzata l'' importazione nella Comunità di carni fresche di bovini, di
    ovini e di solipedi domestici'
  type: main
- language: nl
  script: Latn
  content: '81/627/EEG: Beschikking van de Commissie van 15 juli 1981 tot wijziging
    van de Beschikkingen 81/91/EEG en 81/92/EEG voor wat betreft de lijst van inrichtingen
    in de Argentijnse Republiek, respectievelijk in de Republiek Uruguay die erkend
    zijn voor de invoer in de Gemeenschap van vers vlees van runderen, schapen en
    eenhoevige landbouwhuisdieren'
  type: main
