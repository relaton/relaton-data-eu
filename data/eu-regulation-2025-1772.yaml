title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1772 of 1 September 2025 amending
    Annexes V, XIV and XV to Implementing Regulation (EU) 2021/404 as regards the
    entries for Argentina and the United States in the lists of third countries, territories
    or zones thereof authorised for the entry into the Union of consignments of poultry
    and germinal products of poultry and of fresh meat of poultry, and of meat products
    from poultry
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1772 de la Commission du 1er septembre
    2025 modifiant les annexes V, XIV et XV du règlement d’exécution (UE) 2021/404
    en ce qui concerne les mentions relatives à l’Argentine et aux États-Unis
    dans les listes des pays tiers et territoires ou des zones de pays tiers ou territoire
    en provenance desquels l’entrée dans l’Union d’envois de volailles et de
    produits germinaux de volailles ainsi que de viandes fraîches de volailles et
    de produits à base de viande de volailles est autorisée
  type: main
- language: de
  script: Latn
