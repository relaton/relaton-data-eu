    2021/404 hinsichtlich der Einträge für Argentinien und die Vereinigten Staaten
    in den Listen der Drittländer, Gebiete oder Zonen derselben, aus denen der Eingang
    von Sendungen von Geflügel und Zuchtmaterial von Geflügel sowie frischem Fleisch
    von Geflügel und Fleischerzeugnissen von Geflügel in die Union zulässig ist
  type: main
