    Cur Chun Feidhme (AE) 2021/404 a mhéid a bhaineann leis na hiontrálacha a bhaineann
    leis an Airgintín agus leis na Stáit Aontaithe ar na liostaí de thríú tíortha,
    de chríocha nó de chriosanna de thríú tír nó de chríoch atá údaraithe
    maidir le coinsíneachtaí d’éanlaith chlóis agus de tháirgí geirmeacha
