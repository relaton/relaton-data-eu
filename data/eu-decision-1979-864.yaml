title:
- language: en
  script: Latn
  content: '79/864/EEC: Commission Decision of 3 October 1979 authorizing Ireland
    not to apply Community treatment to undergarments, knitted or crocheted, not elastic
    or rubberized, women''s, girls''and infants''(other than babies'') knitted or
    crocheted pyjamas and night dresses, of cotton or synthetic fibres, falling within
    subheading ex 60.04 B IV of the Common Customs Tariff (NIMEXE codes 60.04-51,
    53, 81, 83) (category 25), originating in Brazil and in free circulation in the
    other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/864/CEE: Décision de la Commission, du 3 octobre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les sous-vêtements de bonneterie
    non élastique ni caoutchoutée: pyjamas et chemises de nuit de bonneterie, de
    coton ou de fibres textiles synthétiques pour femmes, fillettes et jeunes enfants
    (autres que bébés), de la sous-position ex 60.04 B IV du tarif douanier commun
    (codes Nimexe: 60.04-51, 53, 81, 83) (catégorie 25), originaires du Brésil et
    mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/864/EWG: Entscheidung der Kommission vom 3. Oktober 1979, mit der Irland
    ermächtigt wird, aus Brasilien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Unterkleidung aus Gewirken, weder gummielastisch
    noch kautschutiert : Schlafanzüge und Nachthemden aus Gewirken, aus Baumwolle
    oder aus synthetischen Spinnstoffen, für Frauen, Mädchen und Kleinkinder (ausgenommen
    Säuglinge), der Tarifstelle ex 60.04 B IV des Gemeinsamen Zolltarifs (NIMEXE-
    Kennziffern 60.04-51 ; 53 ; 81 ; 83) (Kategorie 25) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/864/EØF: Kommissionens beslutning af 3. oktober 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage underbeklædningsgenstande
    af trikotage, ikke elastisk eller gummeret, pyjamas og natskjorter af trikotage,
    bomuld eller kemofibre til kvinder, piger og småbørn (undtagen spædbørn),
    som henhører under pos. ex 60.04 B IV i den fælles toldtarif (NIMEXE-nummer
    60.04- 51, 53, 81, 83) kategori 25, har oprindelse i Brasilien og frit kan omsættes
    i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/864/CEE: Decisione della Commissione, del 3 ottobre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i pigiami e le camicie da
    notte a maglia, di cotone o di fibre tessili sintetiche, per donna, per ragazza
    e per bambini, diversi dai bambini piccoli (bébés), della sottovoce ex 60.04
    B IV della tariffa doganale comune (codici Nimexe: 60.04-51, 53, 81, 83), categoria
    25, originari del Brasile e messi in libera pratica negli altri Stati membri (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/864/EEG: Beschikking van de Commissie van 3 oktober 1979 waarbij Ierland
    wordt gemachtigd onderkleding van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk: pyjama''s en nachthemden voor dames, meisjes en kinderen (andere
    dan die voor baby''s) van brei- of haakwerk, van katoen of van synthetische vezels,
    van post ex 60.04 B IV van het gemeenschappelijk douanetarief (NIMEXE-code 60.04-51,
    53, 81, 83) (categorie 25), van oorsprong uit Brazilië en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
