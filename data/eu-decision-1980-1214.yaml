title:
- language: en
  script: Latn
  content: Commission Decision of 10 December 1980 authorizing the French Republic
    not to apply Community treatment to cotton yarn, not put up for retail sale, originating
    in Brazil (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 10 décembre 1980, autorisant la République
    française à exclure du traitement communautaire les fils de coton non conditionnés
    pour la vente au détail, originaires du Brésil (Le texte en langue française
    est le seul faisant foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. Dezember 1980 zur Ermächtigung der
    Französischen Republik, aus Brasilien stammende Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, von der Gemeinschaftsbehandlung auszuschließen (Nur der
    französische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 10. december 1980 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage garn af bomuld, ikke i detailsalgsoplægninger,
    med oprindelse i Brasilien (Kun den franske udgave er autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 dicembre 1980, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i filati di cotone non preparati
    per la vendita al minuto originari del Brasile (Il testo in lingua francese è
    il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 december 1980 houdende machtiging van
    de Franse Republiek om garens van katoen, niet gereed voor de verkoop in het klein,
    van oorsprong uit Brazilië, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Franse taal is authentiek)
