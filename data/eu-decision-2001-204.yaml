  type: main
- language: nl
  script: Latn
  content: '2001/204/EG: Beschikking van de Raad van 8 maart 2001 tot aanvulling van
    Richtlĳn 90/219/EEG ten aanzien van de criteria om vast te stellen of typen genetisch
    gemodificeerde micro-organismen veilig voor de gezondheid van de mens en het milieu
    zĳn'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 8 marca 2001 r. uzupełniająca dyrektywę 90/219/EWG
    w zakresie kryteriów określania stopnia bezpieczeństwa dla zdrowia ludzi i
    dla środowiska w odniesieniu do typów mikroorganizmów zmodyfikowanych genetycznie
  type: main
- language: pt
  script: Latn
  content: '2001/204/CE: Decisão do Conselho, de 8 de Março de 2001, que completa
    a Directiva 90/219/CEE no que respeita aos critérios destinados a determinar
    a segurança para a saúde humana e o ambiente de alguns tipos de microrganismos
    geneticamente modificados'
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 8 martie 2001 de completare a Directivei 90/219/CEE
    în ceea ce privește criteriile de evaluare a siguranței, pentru sănătatea
    umană și mediu, a tipurilor de microorganisme modificate genetic
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 8. marca 2001 ktorým sa dopĺňa smernica 90/219/EHS
    pokiaľ ide o kritériá stanovenia bezpečnosti — z hľadiska ľudského zdravia
    a životného prostredia — určitých druhov geneticky modifikovaných mikroorganizmov
  type: main
- language: sl
  script: Latn
  content: Odločba Sveta z dne 8. marca 2001 o dopolnitvi Direktive 90/219/EGS glede
