    liikide ohutus inimeste tervisele ja keskkonnale
  type: main
- language: fi
  script: Latn
  content: '2001/204/EY: Neuvoston päätös, tehty 8 päivänä maaliskuuta 2001,
    direktiivin 90/219/ETY täydentämisestä niiden perusteiden osalta, joilla arvioidaan,
    ovatko geneettisesti muunnetut mikro-organismit turvallisia ihmisten terveydelle
    ja ympäristölle'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (2001. március 8.) a 90/219/EK irányelvnek az emberi
