title:
- language: en
  script: Latn
  content: '2001/204/EC: Council Decision of 8 March 2001 supplementing Directive
    90/219/EEC as regards the criteria for establishing the safety, for human health
    and the environment, of types of genetically modified micro-organisms'
  type: main
- language: fr
  script: Latn
  content: '2001/204/CE: Décision du Conseil du 8 mars 2001 complétant la directive
    90/219/CEE en ce qui concerne les critères permettant d''établir l''innocuité
    pour la santé humaine et l''environnement de types de micro-organismes génétiquement
    modifiés'
  type: main
- language: de
  script: Latn
  content: '2001/204/EG: Entscheidung des Rates vom 8. März 2001 zur Ergänzung der
    Richtlinie 90/219/EWG hinsichtlich der Kriterien für die Feststellung, ob Typen
    genetisch veränderter Mikroorganismen sicher für die menschliche Gesundheit
    und die Umwelt sind'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 8 март 2001 година за
