    zdravje ljudi in okolje
  type: main
- language: es
  script: Latn
  content: '2001/204/CE: Decisión del Consejo, de 8 de marzo de 2001, por la que
    se completa la Directiva 90/219/CEE con respecto a los criterios por los que se
    establece la inocuidad de los microorganismos modificados genéticamente para
    la salud humana y el medio ambiente'
  type: main
- language: sv
  script: Latn
  content: '2001/204/EG: Rådets beslut av den 8 mars 2001 om komplettering av direktiv
    90/219/EEG vad gäller kriterier för att fastställa om en genetiskt modifierad
    mikroorganism är ofarlig för människors hälsa och för miljön'
