    на някои видове генетично модифицирани микроорганизми
    за човешкото здраве и околната среда
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 8. března 2001, kterým se doplňuje směrnice
    90/219/EHS o kritéria pro stanovení bezpečnosti typů geneticky modifikovaných
    mikroorganismů pro lidské zdraví a životní prostředí
  type: main
- language: da
  script: Latn
  content: '2001/204/EF: Rådets beslutning af 8. marts 2001 om supplering af direktiv
    90/219/EØF for så vidt angår kriterierne for fastsættelse af, om typer af
    genetisk modificerede mikroorganismer er sikre for menneskers sundhed og for miljøet'
  type: main
- language: el
  script: Grek
  content: '2001/204/ΕΚ: Απόφαση του Συμβουλίου, της 8ης
    Μαρτίου 2001, για την τροποποίηση της οδηγίας
    90/219/ΕΟΚ όσον αφορά τα κριτήρια αξιολόγησης
    της ασφάλειας για την ανθρώπινη υγεία και το
    περιβάλλον ορισμένων τύπων γενετικώς τροποποιημένων
    μικροοργανισμών'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 8. märts 2001, mis täiendab direktiivi 90/219/EMÜ seoses
