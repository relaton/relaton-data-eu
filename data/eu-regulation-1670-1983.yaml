- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1670/83 of 22 June 1983 fixing the difference
    in white sugar prices to be used in calculating the levy for processed fruit and
    vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1670/83 de la Commission, du 22 juin 1983, fixant la
    différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1670/83 der Kommission vom 22. Juni 1983 zur Festsetzung
    des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse aus Obst
    und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds zwischen
    Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1670/83 af 22. juni 1983 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1670/83 της Επιτροπής
    της 22ας Ιουνίου 1983 περί καθορισμού της διαφοράς
    των τιμών της λευκής ζάχαρης η οποία λαμβάνεται
    υπόψη για τον υπολογισμό της εισφοράς στον
    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά και στον αμπελοοινικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1670/83 della Commissione, del 22 giugno 1983, che
