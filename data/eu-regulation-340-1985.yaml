title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 340/85 of 7 February 1985 re-establishing
    the levying of customs duties on certain women' s, girls' and infants' woven overcoats,
    raincoats and other coats, products of category 15 B (code 40.0155) originating
    in Thailand, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 340/85 de la Commission du 7 février 1985 portant
    rétablissement de la perception des droits de douane applicables à certains
    manteaux, imperméables et vestes, tissés, pour femmes, fillettes et jeunes enfants,
    de la catégorie 15 B (code 40.0155), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 340/85 der Kommission vom 7. Februar 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Mäntel, Umhänge und Jacken,
    aus Geweben, für Frauen, Mädchen und Kleinkinder der Warenkategorie Nr. 15 B
    (Kennziffer 40.0155) mit Ursprung in Thailand, dem die in der Verordnung (EWG)
    Nr. 3563/84 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 340/85 af 7. februar 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte frakker, kapper og slag, jakker, vævede,
    til kvinder, piger og småbørn under varekategori nr. 15 B (kode 40.0155), som
    har oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 340/85 της Επιτροπής
    της 7ης Φεβρουαρίου 1985 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    επανωφόρια, αδιάβροχα και σακκάκια, υφασμένα,
    για γυναίκες, κορασίδες και μικρά παιδιά, της
    κατηγορίας προϊόντων αριθ. 15 Β (κωδικός 40.0155),
    καταγωγής Ταϋλάνδης, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 340/85 della Commissione del 7 febbraio 1985 che ripristina
    la riscossione dei dazi doganali applicabili a cappotti, soprabiti, mantelli e
    simili, e giacche, tessuti per donna, per ragazza e per bambini, della categoria
    di prodotti 15 B (codice 40.0155) originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 340/85 van de Commissie van 7 februari 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    mantels, regenjassen en capes, geweven, voor dames, meisjes en kinderen, van de
    categorie van produkten nr. 15 B (codenummer 40.0155), van oorsprong uit Thailand,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3563/84 van de Raad
