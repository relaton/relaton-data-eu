title:
- language: en
  script: Latn
  content: Council Decision 2009/1004/CFSP of 22 December 2009 updating the list of
    persons, groups and entities subject to Articles 2, 3 and 4 of Common Position
    2001/931/CFSP on the application of specific measures to combat terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2009/1004/PESC du Conseil du 22 décembre 2009 portant mise à
    jour de la liste des personnes, groupes et entités auxquels s'appliquent les
    articles 2, 3 et 4 de la position commune 2001/931/PESC relative à l'application
    de mesures spécifiques en vue de lutter contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2009/1004/GASP des Rates vom 22. Dezember 2009 zur Aktualisierung
    der Liste der Personen, Vereinigungen und Körperschaften, auf die die Artikel
    2, 3 und 4 des Gemeinsamen Standpunkts 2001/931/GASP über die Anwendung besonderer
    Maßnahmen zur Bekämpfung des Terrorismus Anwendung finden
  type: main
- language: bg
