    2001/931/ÜVJP (terrorismivastaste erimeetmete rakendamise kohta) artikleid 2,
    3 ja 4
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2009/1004/YUTP, annettu 22 päivänä joulukuuta 2009
