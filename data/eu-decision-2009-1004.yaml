    postoje 2001/931/SZBP o uplatnění zvláštních opatření k boji proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2009/1004/FUSP af 22. december 2009 om ajourføring
    af listen over de personer, grupper og enheder, som er omfattet af artikel 2,
    3 og 4 i fælles holdning 2001/931/FUSP om anvendelse af specifikke foranstaltninger
    til bekæmpelse af terrorisme
  type: main
- language: el
