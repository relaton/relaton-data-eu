title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3365/88 of 28 October 1988 determining the
    extent to which applications lodged in October 1988 for the issue of import licences
    in respect of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3365/88 de la Commission, du 28 octobre 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importations déposées au mois d'octobre 1988 pour les viandes bovines congelées
    destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3365/88 der Kommission vom 28. Oktober 1988 über
    den Umfang, in dem den im Monat Oktober 1988 eingereichten Anträgen auf Einfuhrlizenzen
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3365/88 af 28. oktober 1988 om fastsættelse
    af, i hvilken udstrækning anmodninger om udstedelse af importlicens, indgivet
    i oktober måned 1988 for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3365/88 της Επιτροπής
    της 28ης Οκτωβρίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1988, για τα κατεψυγμένα
    βόεια κρέατα που προορίζονται για μεταποίηση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3365/88 della Commissione, del 28 ottobre 1988, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1988 per le carni bovine congelate destinate alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3365/88 van de Commissie van 28 oktober 1988 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan tijdens de maand oktober
    1988 ingediende aanvragen om afgifte van invoercertificaten voor bevroren rundvlees
    bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3365/88 da Comissão, de 28 de Outubro de 1988, que
