    certificados de importação entregues no mês de Outubro de 1988 para as carnes
    de bovino congeladas e destinadas à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3365/88 de la Comisión, de 28 de octubre de 1988, que
