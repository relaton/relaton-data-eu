title:
- language: en
  script: Latn
  content: '81/754/EEC: Commission Decision of 7 August 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, originating in Hong Kong (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/754/CEE: Décision de la Commission, du 7 août 1981, autorisant la
    République française à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, originaire de Hong-kong (Le texte en langue française
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/754/EWG: Entscheidung der Kommission vom 7. August 1981 zur Ermächtigung
    der Französischen Republik, aus Hongkong stammende Handschuhe aus Gewirken, weder
    gummielastisch noch kautschutiert, von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/754/EØF: Kommissionens beslutning af 7. august 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer af trikotage, ikke elastisk eller gummeret, med oprindelse i Hongkong
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/754/EOK: Απόφαση τής Επιτροπής τής 7ης Αυγούστου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά πλεκτά χειρόκτια μή ελαστικά ούτε επενδεδυμένα
    μέ καουτσούκ, καταγωγής Χόνγκ Κόνγκ (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/754/CEE: Decisione della Commissione, del 7 agosto 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata originari di Hong Kong (Il testo in lingua francese è
    il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/754/EEG: Beschikking van de Commissie van 7 augustus 1981 houdende
