title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 380/82 of 15 February 1982 laying down certain
    interim measures for the conservation and management of fishery resources applicable
    to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 380/82 du Conseil, du 15 février 1982, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 380/82 des Rates vom 15. Februar 1982 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    auf den Färöern registrierte Fischereifahrzeuge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 380/82 af 15. februar 1982 om fastsættelse
    af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 380/82 τού Συμβουλίου
