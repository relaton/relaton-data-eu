    μέτρων διατηρήσεως καί διαχειρίσεως τών αλιευτικών
    πόρων πού εφαρμόζονται στά σκάφη πού είναι
    νηολογημένα στίς Νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 380/82 del Consiglio, del 15 febbraio 1982, che stabilisce
    talune misure provvisorie di conservazione e di gestione delle risorse ittiche,
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 380/82 van de Raad van 15 februari 1982 tot vaststelling
    van bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van
    de visbestanden, van toepassing op vaartuigen die op de Faeröer geregistreerd
    zijn
  type: main
