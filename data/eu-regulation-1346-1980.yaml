  content: Commission Regulation (EEC) No 1346/80 of 30 May 1980 fixing the coefficients
    to be applied to production aid for tomato concentrates and prunes and to the
    minimum price for dried plums (prunes d' Ente)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1346/80 de la Commission, du 30 mai 1980, fixant les
