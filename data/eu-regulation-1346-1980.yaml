    de tomates et les pruneaux et au prix minimal fixé pour les prunes d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1346/80 der Kommission vom 30. Mai 1980 zur Festsetzung
    der Koeffizienten, mit denen der für Tomatenmark und Trockenpflaumen festgesetzte
    Betrag der Produktionsbeihilfe und der für getrocknete Pflaumen (prunes d' Ente)
    festgesetzte Mindestpreis zu multiplizieren sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1346/80 af 30. maj 1980 om fastsættelse
    af de koefficienter, hvormed producentstøtten for tomatkoncentrater og svesker
    samt minimumsprisen for tørrede blommer ("prunes d' Ente") skal multipliceres
  type: main
