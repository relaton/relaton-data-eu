title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3018/81 of 19 October 1981 implementing in
    the Community revised amounts for the documentary requirements in Protocol 2 concerning
    the definition of the concept of originating products and methods of administrative
    cooperation to the Interim Agreement between the European Economic Community and
    the Socialist Federal Republic of Yugoslavia on trade and cooperation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3018/81 du Conseil, du 19 octobre 1981, relatif à
    la mise en application dans la Communauté des montants révisés applicables
    aux preuves documentaires prévues au protocole n° 2 relatif à la définition
    de la notion de "produits originaires" et aux méthodes de coopération administrative
    de l'accord intérimaire entre la Communauté économique européenne et la République
    socialiste fédérative de Yougoslavie relatif aux échanges commerciaux et à
    la coopération commerciale
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3018/81 des Rates vom 19. Oktober 1981 über die Anwendung
    in der Gemeinschaft der berichtigten Beträge für die Nachweise gemäß dem Protokoll
    Nr. 2 über die Bestimmung des Begriffs ,,Waren mit Ursprung in' ' oder ,,Ursprungswaren'
    ' und über die Methoden der Zusammenarbeit der Verwaltungen des Interimsabkommens
    zwischen der Europäischen Wirtschaftsgemeinschaft und der Sozialistischen Föderativen
    Republik Jugoslawien betreffend den Handelsverkehr und die handelspolitische Zusammenarbeit
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3018/81 af 19. oktober 1981 om anvendelse
    i Fællesskabet af de reviderede beløb, der gælder i forbindelse med dokumentation
    i henhold til protokol nr. 2 vedrørende definitionen af begrebet "varer med oprindelsesstatus"
    og vedrørende metoderne for administrativt samarbejde, der er knyttet til interimsaftalen
    mellem Det europæiske økonomiske Fællesskab og Den socialistiske føderative
    republik Jugoslavien om samhandel og handelssamarbejde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3018/81 τού Συμβουλίου
