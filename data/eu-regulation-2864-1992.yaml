title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2864/92 of 30 September 1992 amending Regulation
    (EEC) No 1780/89 laying down detailed rules for the disposal of alcohol obtained
    from the distillation operations referred to in Articles 35, 36 und 39 of Council
    Regulation (EEC) No 822/87 and held by intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2864/92 de la Commission, du 30 septembre 1992, modifiant
    le règlement (CEE) n° 1780/89 établissant les modalités d' application relatives
    à l' écoulement des alcools obtenus au titre des distillations visées aux articles
    35, 36 et 39 du règlement (CEE) n° 822/87 du Conseil et détenus par les organismes
    d' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2864/92 der Kommission vom 30. September 1992 zur
    Änderung der Verordnung (EWG) Nr. 1780/89 mit Durchführungsbestimmungen für
    den Absatz von Alkohol aus der Destillation nach den Artikeln 35, 36 und 39 der
    Verordnung (EWG) Nr. 822/87 aus Beständen der Interventionsstellen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2864/92 af 30. september 1992 om ændring
    af forordning (EØF) nr. 1780/89 om gennemførelsesbestemmelser for afsætning
    af alkohol, der er fremstillet i henhold til de i artikel 35, 36 og 39 i Rådets
    forordning (EØF) nr. 822/87 omhandlede destillationer, og om interventionsorganerne
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2864/92 της Επιτροπής
