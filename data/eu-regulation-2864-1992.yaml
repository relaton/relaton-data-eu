    d' applicazione relative allo smercio degli alcoli ottenuti dalle distillazioni
    di cui agli articoli 35, 36 e 39 del regolamento (CEE) n. 822/87 e detenuti dagli
    organismi d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2864/92 van de Commissie van 30 september 1992 tot
    wijziging van Verordening (EEG) nr. 1780/89 tot vaststelling van de uitvoeringsbepalingen
    voor de afzet van alcohol die is verkregen bij distillatie als bedoeld in de artikelen
    35, 36 en 30 van Verordening (EEG) nr. 822/87 en die in het bezit is van de interventiebureaus
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2864/92 da Comissão, de 30 de Setembro de 1992,
    que altera o Regulamento (CEE) n° 1780/89, que estabelece as regras de execução
    relativas ao escoamento dos álcoois provenientes das destilações referidas
