  script: Latn
  content: Commission Implementing Decision (EU) 2020/2112 of 16 December 2020 amending
    the Annexes to Decisions 93/455/EEC, 1999/246/EC and 2007/24/EC as regards the
    approval of the contingency plans of the United Kingdom in respect of Northern
    Ireland for the control of foot-and-mouth disease, classical swine fever, avian
    influenza and Newcastle disease (notified under document C(2020) 9307)
  type: main
