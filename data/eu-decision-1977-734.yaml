id: EUDecision1977734
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 July 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to shirts other than of silk, noil or other waste silk, flax
    or ramie, for men and boys, falling within heading No ex 61.03 of the Common Customs
    Tariff, originating in the Republic of Korea and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '77/734/CEE: Décision de la Commission, du 15 juillet 1977, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises et chemisettes autres que
    de soie, de bourre de soie (schappe), bourrette de soie, lin ou ramie pour hommes
    et garçonnets, de la position Ex 61.03 du Tarif douanier commun, originaires
    de la République de Corée et mises en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Juli 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Republik Korea stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Hemden aller Art aus anderen Spinnstoffen als aus Seide,
    Schappeseide, Bourretteseide, Flachs oder Ramie, für Männer und Knaben, der
    Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 15. juli 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter (herunder sports- og arbejdsskjorter), undtagen af natursilke,
    schappesilke, bourettesilke, hør eller ramie, til mænd og drenge, som henhører
    under position ex 61.03 i den fælles toldtarif, har oprindelse i republikken
    Korea og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 15 luglio 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie e camicette non di seta, né di borra di
    seta, roccadino, lino o ramiè per uomo e per ragazzo della voce ex 61.03 della
    tariffa doganale comune, originarie della Repubblica di Corea e messe in libera
    pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 juli 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    overhemden en sporthemden voor heren en jongens andere dan van zijde, van vlokzijde
    of van bourrette of van vlas of ramee van post ex 61.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Republiek Korea en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
