title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2158/70 de la Commission, du 23 octobre 1970, fixant
    les taux des restitutions applicables, à compter du 1er novembre 1970, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2158/70 der Kommission vom 23. Oktober 1970 zur Festsetzung
    der ab 1. November 1970 geltenden Erstattungssätze bei der Ausfuhr von Eiern
    und Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2158/70 della Commissione, del 23 ottobre 1970, che
    fissa i tassi delle restituzioni applicabili a decorrere dal 1 novembre 1970 alle
    uova e ai tuorli d'uovo esportati sotto forma di merci non comprese nell'allegato
    II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2158/70 van de Commissie van 23 oktober 1970 houdende
    vaststelling van de restituties die met ingang van 1 november 1970 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
