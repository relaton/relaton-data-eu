title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1701/80 of 30 June 1980 laying down the
    scope of the export refunds on cereals and on certain categories of wheat or rye
    flour, groats and meal fixed by Regulations (EEC) No 289/80, (EEC) No 487/80,
    (EEC) No 576/80, (EEC) No 741/80 and (EEC) No 1006/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1701/80 de la Commission, du 30 juin 1980, précisant
    le champ d' application des restitutions à l' exportation des céréales et de
    certaines catégories de farines, gruaux et semoules de froment tendre ou de seigle,
    fixées par les règlements (CEE) n° 289/80, (CEE) n° 487/80, (CEE) n° 576/80,
    (CEE) n° 741/80 et (CEE) n° 1006/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1701/80 der Kommission vom 30. Juni 1980 zur Abgrenzung
