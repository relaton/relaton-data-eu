    (EWG) Nr. 576/80, (EWG) Nr. 741/80 und (EWG) Nr. 1006/80 festgesetzten Ausfuhrerstattungen
    für Getreide und bestimmte Kategorien von Mehlen, Grobgrieß und Feingrieß von
    Weizen oder Roggen
  type: main
- language: da
  script: Latn
