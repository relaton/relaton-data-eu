  content: Commission Implementing Directive (EU) 2019/1813 of 29 October 2019 amending
    Implementing Directive 2014/96/EU on the requirements for the labelling, sealing
    and packaging of fruit plant propagating material and fruit plants intended for
    fruit production, falling within the scope of Council Directive 2008/90/EC as
