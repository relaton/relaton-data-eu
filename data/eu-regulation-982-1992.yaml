title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 982/92 of 21 April 1992 amending Regulation
    (EEC) No 981/92 opening for 1992 and laying dow detailed rules for the application
    of an import quota for live bovine animals weighing between 160 and 300 kilograms,
    originating in and coming from the Republic of Poland, the Republic of Hungary
    and the Czech and Slovak Federal Republic
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 982/92 de la Commission du 21 avril 1992 modifiant
    le règlement (CEE) n° 981/92 portant ouverture pour l'année 1992, et établissant
    les modalités d'application d'un quota d'importation d'animaux vivants de l'espèce
    bovine d'un poids de 160 à 300 kilogrammes, originaires et en provenance de la
    République de Pologne, de la République de Hongrie et de la République fédérative
    tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 982/92 DER KOMMISSION vom 21. April 1992 zur Änderung
    der Verordnung (EWG) Nr. 981/92 zur Eröffnung eines Kontingents für die Einfuhr
    von Lebendrindern mit einem Stückgewicht von 160 bis 300 kg mit Ursprung in und
    Herkunft aus der Republik Polen, der Tschechischen und Slowakischen Föderativen
    Republik und der Republik Ungarn für das Jahr 1992 sowie mit den entsprechenden
    Durchführungsbestimmungen #'
  type: main
- language: da
  script: Latn
