    med hensyn til et importkontingent for levende kvæg af en vægt på 160-300 kg
    med oprindelse i Republikken Polen, Republikken Ungarn og Den Tjekkiske og Slovakiske
    Føderative Republik #'
  type: main
- language: el
  script: Grek
