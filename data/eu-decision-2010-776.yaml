  content: '2010/776/UE: Decisione della Commissione, del 15 dicembre 2010 , che modifica
    la decisione 2004/211/CE per quanto concerne le voci relative al Brasile, al Kuwait
    e alla Siria figuranti nell’elenco dei paesi terzi e delle parti di paesi terzi
    da cui sono autorizzate le importazioni nell’Unione europea di equidi vivi nonché
    di sperma, ovuli ed embrioni della specie equina [notificata con il numero C(2010)
    8950]'
  type: main
