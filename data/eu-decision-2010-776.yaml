title:
- language: en
  script: Latn
  content: '2010/776/EU: Commission Decision of 15 December 2010 amending Decision
    2004/211/EC as regards the entries for Brazil, Kuwait and Syria in the list of
    third countries and parts thereof from which the introduction into the European
    Union of live equidae and semen, ova and embryos of the equine species are authorised
    (notified under document C(2010) 8950)'
  type: main
- language: fr
  script: Latn
  content: '2010/776/UE: Décision de la Commission du 15 décembre 2010 modifiant
    la décision 2004/211/CE en ce qui concerne les mentions relatives au Brésil,
    au Koweït et à la Syrie figurant sur la liste des pays tiers et des parties
    de pays tiers en provenance desquels l’introduction dans l’Union européenne
    d’équidés vivants et de sperme, d’ovules et d’embryons de l’espèce
    équine est autorisée [notifiée sous le numéro C(2010) 8950]'
  type: main
- language: de
  script: Latn
  content: '2010/776/EU: Beschluss der Kommission vom 15. Dezember 2010 zur Änderung
    der Entscheidung 2004/211/EG hinsichtlich der Einträge zu Brasilien, Kuwait und
    Syrien in der Liste von Drittländern und Teilen von Drittländern, aus denen
    die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    in die Europäische Union zugelassen ist (Bekannt gegeben unter Aktenzeichen K(2010)
    8950)'
  type: main
- language: bg
  script: Cyrl
  content: '2010/776/ЕС: Решение на Комисията от 15 декември
    2010 година за изменение на Решение 2004/211/ЕО по
