    Kuvajtu a Sýrie v seznamu třetích zemí a jejich částí, ze kterých je povolen
    dovoz živých koňovitých a spermatu, vajíček a embryí druhů koňovitých
    do Evropské unie (oznámeno pod číslem K(2010) 8950)'
  type: main
