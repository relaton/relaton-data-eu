    Сирия в списъка на трети страни и части от тях,
    от които е разрешено въвеждането в Европейския
    съюз на живи еднокопитни и сперма, яйцеклетки
    и ембриони от еднокопитни (нотифицирано под
    номер C(2010) 8950)'
  type: main
- language: cs
  script: Latn
