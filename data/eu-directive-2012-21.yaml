    76/768/ΕΟΚ του Συμβουλίου σχετικά με τα καλλυντικά
    προϊόντα, με σκοπό την προσαρμογή των παραρτημάτων
    II και III στην τεχνική πρόοδο
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusdirektiiv 2012/21/EL, 2. august 2012 , millega muudetakse
