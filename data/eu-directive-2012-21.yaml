  script: Latn
  content: Commission Implementing Directive 2012/21/EU of 2 August 2012 amending,
    for the purpose of adaptation to technical progress, Annexes II and III to Council
    Directive 76/768/EEC relating to cosmetic products
  type: main
- language: fr
  script: Latn
  content: Directive d'exécution 2012/21/UE de la Commission du 2 août 2012 modifiant,
