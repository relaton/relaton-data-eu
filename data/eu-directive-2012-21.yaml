    liitteiden II ja III muuttamisesta niiden mukauttamiseksi tekniikan kehitykseen
  type: main
- language: hr
  script: Latn
  content: Provedbena direktiva Komisije 2012/21/EU od 2. kolovoza 2012. o izmjeni
