    II u III mad-Direttiva tal-Kunsill 76/768/KEE rigward prodotti kosmetiċi
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsrichtlijn 2012/21/EU van de Commissie van 2 augustus 2012 tot
    wijziging, met het oog op aanpassing aan de vooruitgang van de techniek, van de
    bijlagen II en III bij Richtlijn 76/768/EEG van de Raad inzake cosmetische producten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa wykonawcza Komisji 2012/21/UE z dnia 2 sierpnia 2012 r. zmieniająca
    załączniki II i III do dyrektywy Rady 76/768/EWG dotyczącej produktów kosmetycznych
    w celu dostosowania ich do postępu technicznego
  type: main
- language: pt
  script: Latn
  content: Diretiva de Execução 2012/21/UE da Comissão, de 2 de agosto de 2012
    , que altera, para fins de adaptação ao progresso técnico, os anexos II e III
    da Diretiva 76/768/CEE do Conselho relativa aos produtos cosméticos
  type: main
- language: ro
  script: Latn
  content: Directiva de punere în aplicare 2012/21/UE a Comisiei din 2 august 2012
    de modificare, în scopul adaptării la progresul tehnic, a anexelor II și III
    la Directiva 76/768/CEE a Consiliului cu privire la produsele cosmetice
  type: main
- language: sk
  script: Latn
  content: Vykonávacia smernica Komisie 2012/21/EÚ z 2. augusta 2012 , ktorou sa
    mení a dopĺňa smernica Rady 76/768/EHS o kozmetických výrobkoch s cieľom
    prispôsobiť jej prílohy II a III technickému pokroku
  type: main
- language: sl
  script: Latn
  content: Izvedbena direktiva Komisije 2012/21/EU z dne 2. avgusta 2012 o spremembi
