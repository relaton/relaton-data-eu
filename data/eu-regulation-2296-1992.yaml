title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2296/92 of 31 July 1992 laying down certain
    rules of application of the use of land set aside for the provision of materials
    for the manufacture within the Community of products not primarily intended for
    human or animal consumption
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2296/92 de la Commission du 31 juillet 1992 portant
    modalités d'application relatives à l'utilisation des terres mises en jachère
    pour la production de matières servant à la fabrication dans la Communauté
    de produits destinés à des fins principales autres que la consommation humaine
    ou animale
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2296/92 DER KOMMISSION vom 31. Juli 1992 mit Durchführungsbestimmungen
    für die Nutzung stillgelegter Flächen zur Erzeugung von Rohstoffen, die in der
    Gemeinschaft zu nicht in erster Linie für Lebensmittel- oder Futtermittelzwecke
    bestimmten Erzeugnissen verarbeitet werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2296/92 af 31. juli 1992 om gennemførelsesbestemmelser
    for anvendelse af udtagne arealer med henblik på tilvejebringelse af materialer
    til fremstilling i Fællesskabet af produkter, som ikke primært er bestemt til
    konsum eller foderbrug #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2296/92 της Επιτροπής
    της 31ης Ιουλίου 1992 που θεσπίζει ορισμένους
    κανόνες εφαρμογής για τη χρησιμοποίηση της
    γης η οποία ευρίσκεται υπό το καθεστώς προσωρινής
    παύσης στην παραγωγή υλών για την παρασκευή,
    εντός της Κοινότητας, προϊόντων που δεν προορίζονται
    κυρίως για τη διατροφή του ανθρώπου ή των ζώων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2296/92 DELLA COMMISSIONE del 31 luglio 1992 che stabilisce
    talune modalità di applicazione per l'utilizzazione di superfici ritirate dalla
    produzione al fine di ottenere materiali per la fabbricazione, nella Comunità,
    di prodotti non destinati in primo luogo al consumo umano o animale
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2296/92 VAN DE COMMISSIE van 31 juli 1992 houdende
    vaststelling van uitvoeringsbepalingen betreffende het gebruik van uit produktie
    genomen grond voor de produktie van grondstoffen voor de vervaardiging, in de
    Gemeenschap, van niet specifiek voor voeding of vervoedering bestemde produkten
    #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2296/92 DA COMISSÃO de 31 de Julho de 1992 que estabelece
    certas regras de execução para a utilização de terras retiradas para a produção
    de matérias destinadas ao fabrico, na Comunidade, de produtos não destinados
    primariamente ao consumo humano ou animal #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2296/92 DE LA COMISIÓN de 31 de julio de 1992 por
    el que se establecen ciertas disposiciones de aplicación para la utilización
    de las tierras retiradas de la producción en las que se obtengan materias para
    la elaboración en la Comunidad de productos no destinados principalmente al consumo
    humano o animal #'
