    πριμοδότηση που καταβάλλεται στους παραγωγούς
    αμύλου γεωμήλων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 1711/93, annettu 30 päivänä kesäkuuta 1993,
    yksityiskohtaisista säännöistä neuvoston asetuksen (ETY) N:o 1766/92 soveltamisesta
    perunan tuottajille maksettavan vähimmäishinnan ja korvauksen osalta sekä neuvoston
    asetuksen (ETY) N:o 1543/93 soveltamisesta perunatärkkelyksen tuottajille maksettavan
    palkkion osalta
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1711/93 DELLA COMMISSIONE del 30 giugno 1993 recante
    le modalità di applicazione dei regolamenti (CEE) n. 1766/92 e (CEE) n. 1766/92
    del Consiglio riguardo al prezzo minimo e ai pagamenti compensativi per i produttori
    di patate, nonché del regolamento (CEE) n. 1543/93 del Consiglio relativo al
    pagamento di un premio ai produttori di fecola di patate
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1711/93 VAN DE COMMISSIE van 30 juni 1993 tot vaststelling
    van de toepassingsbepalingen van Verordening (EEG) nr. 1766/92 van de Raad wat
    de regeling inzake de aan de aardappeltelers te betalen minimumprijs en compensatiebedrag
    betreft en die van Verordening (EEG) nr. 1543/93 van de Raad wat de premie voor
    aardappelzetmeelfabrikanten betreft
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1711/93 DA COMISSÃO de 30 de Junho de 1993 que fixa
    normas de execução do Regulamento (CEE) no 1766/92 do Conselho no que respeita
    ao preço mínimo e ao pagamento compensatório aos produtores de batata bem como
    do Regulamento (CEE) no 1543/93 do Conselho no que respeita ao prémio a pagar
    aos produtores de fécula de batata
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1711/93 DE LA COMISIÓN de 30 de junio de 1993 por
    el que se fijan las disposiciones de aplicación del Reglamento (CEE) no 1766/92
    del Consejo en lo que respecta al régimen del precio mínimo y del pago compensatorio
    que deberá abonarse a los productores de patatas y del Reglamento (CEE) no 1543/93
    del Consejo en la que respecta a la prima que debe pagarse a los productores de
    fécula de patata
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 1711/93 av den 30 juni 1993 om tillämpningsföreskrifter
    till rådets förordning (EEG) nr 1766/92 vad avser det minimipris och den kompensationsbetalning
    som skall utbetalas till potatisodlare, och till rådets förordning (EEG) nr
    1543/93 om utbetalning av ett bidrag till producenter av potatisstärkelse
