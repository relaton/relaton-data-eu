title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1711/93 of 30 June 1993 laying down detailed
    rules for the application of Council Regulation (EEC) No 1766/92 as regards the
    minimum price and compensatory payment to be paid to potato producers, and of
    Council Regulation (EEC) No 1543/93 on the payment of a premium to manufacturers
    of potato starch
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1711/93 de la Commission du 30 juin 1993 fixant les
    modalités d'application du règlement (CEE) n° 1766/92 du Conseil en ce qui
    concerne le prix minimal et le paiement compensatoire à payer aux producteurs
    de pommes de terre ainsi que du règlement (CEE) n° 1543/93 du Conseil concernant
    la prime à verser aux producteurs de fécule de pommes de terre
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1711/93 DER KOMMISSION vom 30. Juni 1993 mit Durchführungsbestimmungen
    zu der Verordnung (EWG) Nr. 1766/92 des Rates hinsichtlich der Mindestpreise und
    Ausgleichszahlungen für Kartoffelerzeuger sowie zu der Verordnung (EWG) Nr. 1543/93
    des Rates hinsichtlich einer den Herstellern von Kartoffelstärke zu gewährenden
    Prämie
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1711/93 af 30. juni 1993 om fastsættelse
    af gennemførelsesbestemmelserne til Rådets forordning (EØF) nr. 1766/92 for
    så vidt angår den minimumspris og det udligningbeløb, der skal betales kartoffelavlere,
    samt til Rådets forordning (EØF) nr. 1543/93 om præmier til producenter af
    kartoffelstivelse
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1711/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 30ής Ιουνίου 1993 περί λεπτομερών κανόνων
    εφαρμογής του κανονισμού (ΕΟΚ) αριθ. 1766/92 του
    Συμβουλίου όσον αφορά την ελάχιστη τιμή και
    την εξισωτική πληρωμή που καταβάλλεται στους
