title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1897/78 of 2 August 1978 re-establishing
    the levying of the customs duties on tubes and pipes and blanks therefor, of copper;
    falling within heading No 74.07 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1897/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris leurs ébauches) et barres creuses, en cuivre, de la position
    74.07 du tarif douanier commun, originaires de Yougoslavie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1897/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07 mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG)
    Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1897/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber,
    under position 74.07, som har oprindelse i Jugolavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1897/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai tubi (compresi i loro
    sbozzi) e barre forate, di rame, della voce doganale 74.07, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1897/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op buizen en
    pijpen (ook indien niet afgewerkt) en holle staven, van koper, van post 74.07,
    van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr.
    2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
