    per quanto concerne il pagamento delle restituzioni per il burro, esportato sotto
    forma di talune merci non comprese nell' allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 349/86 van de Commissie van 18 februari 1986 tot
