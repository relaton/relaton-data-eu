title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 349/86 of 18 February 1986 suspending the
    application of certain provisions of Regulation (EEC) No 1760/83 as regards the
    payment of refunds in respect of butter exported in the form of certain products
    not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 349/86 de la Commission du 18 février 1986 suspendant
    l' application de certaines dispositions du règlement (CEE) n° 1760/83 en ce
    qui concerne le paiement des restitutions pour le beurre exporté sous forme de
    certaines marchandises ne relevant pas de l' annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 349/86 der Kommission vom 18. Februar 1986 zur Aussetzung
    bestimmter Vorschriften der Verordnung (EWG) Nr. 1760/83 über die Zahlung der
    Erstattungen für Butter, ausgeführt in Form von bestimmten, nicht unter Anhang
    II des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 349/86 af 18. februar 1986 om suspension
    af anvendelsen af visse bestemmelser i forordning (EØF) nr. 1760/83 for så vidt
    angår betaling af restitutionerne for smør, der udføres i form af visse varer,
    som ikke omfattes af traktatens bilag II.
  type: main
