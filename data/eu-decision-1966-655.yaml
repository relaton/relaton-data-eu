title:
- language: fr
  script: Latn
  content: Décision 66/655/CEE de la Commission, du 26 octobre 1966, portant prorogation
    de sa décision du 5 mai 1965 relative à l'autorisation accordée à la République
    italienne d'adopter des mesures de sauvegarde pour certains produits du chapitre
    50 du tarif douanier italien (soie et déchets de soie)
  type: main
- language: de
  script: Latn
  content: '66/655/EWG: Entscheidung der Kommission vom 26. Oktober 1966 über die
    Verlängerung ihrer Entscheidung vom 5. Mai 1965 betreffend die Ermächtigung
    der Italienischen Republik, für einige Waren des Kapitels 50 des italienischen
    Zolltarifs (Seide und Schappeseide) Schutzmaßnahmen zu erlassen'
  type: main
- language: it
  script: Latn
  content: '66/655/CEE: Decisione della Commissione, del 26 ottobre 1966, che proroga
    la propria decisione del 5 maggio 1965 relativa all''autorizzazione accordata
    alla Repubblica italiana ad adottare misure di salvaguardia per alcuni prodotti
    del capitolo 50 della tariffa doganale italiana (seta e cascami di seta)'
  type: main
- language: nl
  script: Latn
  content: '66/655/EEG: Beschikking van de Commissie van 26 oktober 1966 houdende
    verlenging van haar beschikking van 5 mei 1965 betreffende de aan de Italiaanse
    Republiek verleende machtiging om vrijwaringsmaatregelen te treffen voor enige
    produkten vallende onder hoofdstuk 50 van het Italiaanse douanetarief (zijde en
    afval van zijde)'
  type: main
