    de abastecimento dos departamentos franceses ultramarinos no sector dos cereais
    e dos produtos transformados à base de frutos e produtos hortícolas, bem como
    às estimativas de abastecimento da Madeira nos sectores dos óleos vegetais,
    dos produtos transformados à base de frutos e produtos hortícolas, do leite
    e produtos lácteos e da carne de suíno
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1796/2004 z 15. októbra 2004, ktorým sa mení,
    dopĺňa a opravuje nariadenie (ES) č. 14/2004, pokiaľ ide o predbežnú bilanciu
    zásobovania francúzskych zámorských departementov v sektore obilnín a spracovaných
    výrobkov na báze ovocia a zeleniny a predbežné bilancie zásobovania Madeiry
    v sektore rastlinných olejov, spracovaných výrobkov na báze ovocia a zeleniny,
    mlieka a mliečnych výrobkov a bravčového mäsa
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1796/2004 z dne 15. oktobra 2004 o spremembi
