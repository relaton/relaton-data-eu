    d'approvisionnement des départements français d'outre-mer pour le secteur des
    céréales et des produits transformés à base de fruits et légumes et les bilans
    prévisionnels d’approvisionnements de Madère pour les secteurs des huiles
    végétales, des produits transformés à base de fruits et légumes, du lait
    et produits laitiers, et de la viande porcine
  type: main
