    labības un augļu un dārzeņu pārstrādes produktu nozarē un attiecībā uz
    piegādes bilanci Madeirai augu eļļas, augļu un dārzeņu pārstrādes, piena
    un piena produktu un cūkgaļas nozarē
  type: main
