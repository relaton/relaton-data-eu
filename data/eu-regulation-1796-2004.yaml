    previsionale d’approvvigionamento dei dipartimenti francesi d’oltremare per
    il settore dei cereali e dei prodotti trasformati a base di ortofrutticoli e i
    bilanci previsionali d’approvvigionamento di Madera per i settori degli oli
    vegetali, dei prodotti trasformati a base di ortofrutticoli, del latte e dei prodotti
    lattiero-caseari e delle carni suine
  type: main
