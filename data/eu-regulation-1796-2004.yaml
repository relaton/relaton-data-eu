    prekomorskih departmajev za sektor žit proizvodov iz predelanega sadja in zelenjave
    in predvidenih bilanc oskrbe Madeire za sektorje rastlinskih olj in proizvodov
    iz predelanega sadja in zelenjave, mleka in mlečnih proizvodov ter prašičjega
    mesa
  type: main
