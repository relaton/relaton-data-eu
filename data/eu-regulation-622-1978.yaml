title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 622/78 of 30 March 1978 amending Regulation
    (EEC) No 3376/75 as regards the calculation of the amounts by which import charges
    on beef and veal products originating in the African, Caribbean and Pacific States
    are reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 622/78 de la Commission, du 30 mars 1978, modifiant
    le règlement (CEE) n° 3376/75 en ce qui concerne le calcul des montants de diminution
    des charges à l' importation de produits du secteur de la viande bovine originaires
    des États d' Afrique, des Caraïbes et du Pacifique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 622/78 der Kommission vom 30. März 1978 zur Änderung
    der Verordnung (EWG) Nr. 3376/75 in bezug auf die Berechnung der Beträge zur
    Senkung der Einfuhrbelastung für Rindfleischerzeugnisse mit Ursprung in den Staaten
    in Afrika, im karibischen Raum und im Pazifischen Ozean
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 622/78 af 30. marts 1978 om ændring
    af forordning (EØF) nr. 3376/75 for så vidt angår beregningen af de beløb,
    hvormed importbelastningerne for oksekødsprodukter med oprindelse i staterne
    i Afrika, Vestindien og Stillehavet skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 622/78 della Commissione, del 30 marzo 1978, che modifica
    il regolamento (CEE) n. 3376/75 per quanto riguarda il calcolo degli importi di
    riduzione degli oneri all' importazione di prodotti del settore delle carni bovine
    originari degli Stati africani, dei Caraibi e del Pacifico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 622/78 van de Commissie van 30 maart 1978 tot wijziging
    van Verordening (EEG) nr. 3376/75 ten aanzien van de berekening van de bedragen
    van de vermindering van de belastingen op de invoer van produkten van de sector
    rundvlees van oorsprong uit de Staten in Afrika, het Caribische gebied en de Stille
    Oceaan
  type: main
