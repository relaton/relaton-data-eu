title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2860/89 of 22 September 1989 amending Regulation
    (EEC) No 2727/75 of the Council on the common organization of the market in cereals
    as regards the list of products in Annex B on which export refunds may be granted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2860/89 de la Commission du 22 septembre 1989 modifiant
    le règlement (CEE) n° 2727/75 du Conseil portant organisation commune des marchés
    dans le secteur des céréales en ce qui concerne les produits de l'annexe B pouvant
    bénéficier d'une restitution à l'exportation
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2860/89 DER KOMMISSION vom 22. September 1989 zur
    Änderung der Verordnung (EWG) Nr. 2727/75 des Rates über die gemeinsame Marktorganisation
    für Getreide hinsichtlich der in Anhang B aufgeführten Erzeugnisse, für die
    eine Ausfuhrerstattung gewährt werden kann #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2860/89 af 22. september 1989 om ændring
    af Rådets forordning (EØF) nr. 2727/75 om den fælles markedsordning for korn
    for så vidt angår produkter i bilag B, hvortil der kan ydes eksportrestitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2860/89 της Επιτροπής
    της 22ας Σεπτεμβρίου 1989 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 2727/75 του Συμβουλίου
    για την κοινή οργάνωση της αγοράς στον τομέα
    των σιτηρών όσον αφορά τα προϊόντα του παραρτήματος
    Β τα οποία μπορούν να επωφελούνται από επιστροφή
    κατά την εξαγωγή
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2860/89 DELLA COMMISSIONE del 22 settembre 1989 che
    modifica il regolamento (CEE) n. 2727/75 relativo al'' organizzazione comune dei
    mercati nel settore dei cereali, per quanto riguarda i prodotti dell'' allegato
    B che possono fruire di restituzione all'' esportazione #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2860/89 VAN DE COMMISSIE van 22 september 1989 tot
    wijziging van Verordening (EEG) nr. 2727/75 van de Raad houdende een gemeenschappelijke
    ordening der markten in de sector granen, ten aanzien van de produkten van bijlage
    B die in aanmerking komen voor een uitvoerrestitutie #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2860/89 DA COMISSÃO de 22 de Setembro de 1989 que
    altera o Regulamento (CEE) nº 2727/75 do Conselho, que restabelece a organização
    comum de mercado no sector dos cereais, no que respeita aos produtos constantes
    do anexo B que podem beneficiar de uma restituição à exportação #'
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2860/89 DE LA COMISION de 22 de septiembre de 1989
    que modifica el Reglamento (CEE) no 2727/75 del Consejo, por el que se establece
    la organizacion comun de mercados en el sector de los cereales, en lo que se refiere
    a los productos del Anexo B que pueden optar a restitucion por exportacion
