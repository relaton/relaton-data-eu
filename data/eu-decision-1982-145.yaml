title:
- language: en
  script: Latn
  content: '82/145/EEC: Commission Decision of 5 February 1982 establishing that the
    apparatus described as ''PAR-OMA 2 system'' may be imported free of Common Customs
    Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/145/CEE: Décision de la Commission, du 5 février 1982, constatant
    que l''importation de l''appareil dénommé "P.A.R. - OMA 2 System" peut être
    faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/145/EWG: Entscheidung der Kommission vom 5. Februar 1982, mit der festgestellt
    wird, daß das Gerät ,,P.A.R.- OMA 2 System" unter Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/145/EØF: Kommissionens beslutning af 5. februar 1982 om fastslåelse
    af, at indførsel af apparatet "P.A.R. - OMA 2 System" kan ske med fritagelse
    for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/145/EOK: Απόφαση τής Επιτροπής τής 5ης Φεβρουαρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «PAR-OMA 2 System» δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/145/CEE: Decisione della Commissione, del 5 febbraio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "PAR-OMA 2 system" può avvenire
    in franchigia dai dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/145/EEG: Beschikking van de Commissie van 5 februari 1982 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,P.A.R.-OMA 2 System" met vrijstelling van
    de rechten van het gemeenschappelijk douanetarief mag worden ingevoerd'
  type: main
