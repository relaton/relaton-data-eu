id: EUDecision198565
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '85/65/EEC: Commission Decision of 18 December 1984 authorizing the United
    Kingdom to extend intra-Community surveillance in respect of imports of bananas
    originating in certain third countries and put into free circulation in the other
    Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/65/CEE: Décision de la Commission du 18 décembre 1984 autorisant
    le Royaume-Uni à proroger les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres États membres (Le texte en langue anglaise est le seul
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/65/EWG: Entscheidung der Kommission vom 18. Dezember 1984 zur Ermächtigung
    des Vereinigten Königreichs zur Verlängerung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Bananen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/65/EØF: Kommissionens beslutning af 18. december 1984 om bemyndigelse
    af Det forenede Kongerige til at forlænge foranstaltninger med henblik på tilsyn
    inden for Fællesskabet med indførsel af bananer, der har oprindelse i visse
    tredjelande, og som er overgået til fri omsætning i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/65/ΕΟΚ: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1984 περί χορηγήσεως αδείας στο Ηνωμένο Βασίλειο
    να παρατείνει την ενδοκοινοτική επιτήρηση
    όσον αφορά τις εισαγωγές μπανανών καταγωγής
    ορισμένων τρίτων χωρών οι οποίες τίθενται
    σε ελεύθερη κυκλοφορία στα άλλα κράτη μέλη
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/65/CEE: Decisione della Commissione del 18 dicembre 1984 che autorizza
    il Regno Unito a prorogare le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/65/EEG: Beschikking van de Commissie van 18 december 1984 waarbij het
    Verenigd Koninkrijk wordt gemachtigd maatregelen inzake intracommunautair toezicht
    te verlengen ten aanzien van bananen van oorsprong uit bepaalde derde landen en
    in de andere Lid-Staten in het vrije verkeer gebracht (Slechts de tekst in de
    Engelse taal is authentiek)'
  type: main
