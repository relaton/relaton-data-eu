id: EURegulation2023439
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2023/439 of 16 December 2022 amending
    the Annex to Regulation (EU) No 609/2013 of the European Parliament and of the
    Council to allow the use of nicotinamide riboside chloride as a source of niacin
    in food for special medical purposes and total diet replacement for weight control
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2023/439 de la Commission du 16 décembre 2022
    modifiant l’annexe du règlement (UE) no 609/2013 du Parlement européen et
    du Conseil pour autoriser l’utilisation du chlorure de nicotinamide riboside
    comme source de niacine dans les denrées alimentaires destinées à des fins
    médicales spéciales et les substituts de la ration journalière totale pour
    contrôle du poids
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2023/439 der Kommission vom 16. Dezember 2022
    zur Änderung des Anhangs der Verordnung (EU) Nr. 609/2013 des Europäischen Parlaments
    und des Rates zwecks Zulassung der Verwendung von Nicotinamid-Ribosidchlorid als
    Niacinquelle in Lebensmitteln für besondere medizinische Zwecke und Tagesrationen
    für gewichtskontrollierende Ernährung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2023/439 на Комисията
    от 16 декември 2022 година за изменение на приложението
    към Регламент (ЕС) № 609/2013 на Европейския парламент
    и на Съвета с цел разрешаване на употребата
    на никотинамид рибозид хлорид като източник
    на ниацин в храните за специални медицински
    цели и заместителите на целодневния хранителен
    прием за регулиране на телесното тегло
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2023/439 ze dne 16. prosince
    2022, kterým se mění příloha nařízení Evropského parlamentu a Rady (EU)
    č. 609/2013 s cílem umožnit používání nikotinamidu ribosidu chloridu jako
    zdroje niacinu v potravinách pro zvláštní lékařské účely a náhradě
    celodenní stravy pro regulaci hmotnosti
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2023/439 af 16. december 2022
    om ændring af bilaget til Europa-Parlamentets og Rådets forordning (EU) nr.
    609/2013 om tilladelse til at anvende nicotinamidribosidchlorid som en kilde til
    niacin i fødevarer til særlige medicinske formål og kosterstatning til vægtkontrol
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2023/439
    της Επιτροπής της 16ης Δεκεμβρίου 2022 για την
    τροποποίηση του παραρτήματος του κανονισμού
    (ΕΕ) αριθ. 609/2013 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου ώστε να επιτραπεί η χρήση
    του χλωριούχου ριβοζυλονικοτιναμιδίου ως
    πηγή νιασίνης σε τρόφιμα που προορίζονται
    για ειδικούς ιατρικούς σκοπούς και σε υποκατάστατα
    του συνόλου του διαιτολογίου για τον έλεγχο
    του σωματικού βάρους
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2023/439, 16. detsember 2022, millega
    muudetakse Euroopa Parlamendi ja nõukogu määruse (EL) nr 609/2013 lisa, et
    lubada kasutada nikotiinamiidribosiidkloriidi niatsiiniallikana meditsiinilisel
    näidustusel kasutamiseks ettenähtud toidus ja kehakaalu alandamiseks ettenähtud
    päevase toidu asendajates
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2023/439, annettu 16 päivänä joulukuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 609/2013 liitteen muuttamisesta
    nikotiiniamidiribosidikloridin käytön sallimiseksi niasiinin lähteenä erityisiin
    lääkinnällisiin tarkoituksiin tarkoitetuissa elintarvikkeissa ja painonhallintaan
    tarkoitetuissa ruokavalionkorvikkeissa
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2023/439 ón gCoimisiún an 16 Nollaig 2022
    lena leasaítear an Iarscríbhinn a ghabhann le Rialachán (AE) Uimh. 609/2013
    ó Pharlaimint na hEorpa agus ón gComhairle chun cead a thabhairt clóiríd riobóisíde
    nicitíonaimíde a úsáid mar fhoinse niaicine i mbia chun críoch speisialta
    míochaine agus in ionadach ar an aiste bia iomlán chun meáchan a rialú
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/439 оd 16. prosinca 2022. o izmjeni
    Priloga Uredbi (EU) br. 609/2013 Europskog parlamenta i Vijeća kako bi se dopustila
    uporaba nikotinamid ribozid klorida kao izvora niacina u hrani za posebne medicinske
    potrebe i zamjeni za cjelodnevnu prehranu pri redukcijskoj dijeti
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/439 felhatalmazáson alapuló rendelete (2022. december
    16.) a 609/2013/EU európai parlamenti és tanácsi rendelet mellékletének a
    nikotinamid-ribozid-klorid speciális gyógyászati célra szánt élelmiszerekben,
    valamint testtömeg-szabályozás céljára szolgáló, teljes napi étrendet
    helyettesítő élelmiszerekben niacinforrásként történő felhasználásának
    engedélyezése céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2023/439 della Commissione del 16 dicembre 2022
    che modifica l’allegato del regolamento (UE) n. 609/2013 del Parlamento europeo
    e del Consiglio per consentire l’uso del nicotinamide riboside cloruro quale
    fonte di niacina negli alimenti a fini medici speciali e nei sostituti dell’intera
    razione alimentare giornaliera per il controllo del peso
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2023/439 (2022. gada 16. decembris),
    ar ko nolūkā atļaut nikotīnamīda ribozīda hlorīdu izmantot par niacīna
    avotu īpašiem medicīniskiem nolūkiem paredzētā pārtikā un svara kontrolei
    paredzētos pilnīgos uztura aizstājējos groza Eiropas Parlamenta un Padomes
    Regulas (ES) Nr. 609/2013 pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2023/439 2022 m. gruodžio 16 d.
    kuriuo dėl leidimo naudoti nikotinamido ribozido chloridą kaip niacino šaltinį
    specialiosios medicininės paskirties maisto produktuose ir viso paros raciono
    pakaitaluose svoriui kontroliuoti iš dalies keičiamas Europos Parlamento ir
    Tarybos reglamento (ES) Nr. 609/2013 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2023/439 tas-16 ta’ Diċembru
    2022 li jemenda l-Anness tar-Regolament (UE) Nru 609/2013 tal-Parlament Ewropew
    u tal-Kunsill biex jippermetti l-użu tal-klorur tan-nikotinammidribosid bħala
    sors ta’ niaċina fl-ikel għal skopijiet mediċi speċjali u bħala sostitut
    tad-dieta kollha għall-kontroll tal-piż
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2023/439 van de Commissie van 16 december
    2022 tot wijziging van de bijlage bij Verordening (EU) nr. 609/2013 van het Europees
    Parlement en de Raad om het gebruik van nicotinamideribosidechloride als bron
    van niacine in voeding voor medisch gebruik en de dagelijkse voeding volledig
    vervangende producten voor gewichtsbeheersing toe te staan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2023/439 z dnia 16 grudnia 2022
    r. zmieniające załącznik do rozporządzenia Parlamentu Europejskiego i Rady
    (UE) nr 609/2013 w celu zezwolenia na stosowanie chlorku rybozydu nikotynamidu
    jako źródła niacyny w żywności specjalnego przeznaczenia medycznego i środkach
    spożywczych zastępujących całodzienną dietę, do kontroli masy ciała
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2023/439 da Comissão de 16 de dezembro de 2022
    que altera o anexo do Regulamento (UE) n.o 609/2013 do Parlamento Europeu e do
    Conselho a fim de permitir a utilização do cloreto de nicotinamida-ribósido
    como fonte de niacina em alimentos destinados a fins medicinais específicos e
    substitutos integrais da dieta para controlo do peso
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2023/439 al Comisiei din 16 decembrie 2022 de
    modificare a anexei la Regulamentul (UE) nr. 609/2013 al Parlamentului European
    și al Consiliului pentru a permite utilizarea clorurii de ribozid-nicotinamidă
    ca sursă de niacină în alimentele destinate unor scopuri medicale speciale
    și în înlocuitorii totali ai dietei destinați controlului greutății
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2023/439 zo 16. decembra 2022, ktorým
    sa mení príloha k nariadeniu Európskeho parlamentu a Rady (EÚ) č. 609/2013
    s cieľom umožniť používanie nikotínamidribozid-chloridu ako zdroja niacínu
    v potravinách na osobitné lekárske účely a v celkovej náhrade stravy na
    účely regulácie hmotnosti
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2023/439 z dne 16. decembra 2022 o spremembi
    Priloge k Uredbi (EU) št. 609/2013 Evropskega parlamenta in Sveta, da se dovoli
    uporaba nikotinamid ribozid klorida kot vira niacina v živilih za posebne zdravstvene
    namene in popolnih prehranskih nadomestkih za nadzor nad telesno težo
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2023/439 de la Comisión de 16 de diciembre de
    2022 por el que se modifica el anexo del Reglamento (UE) n.o 609/2013 del Parlamento
    Europeo y del Consejo a fin de permitir el uso de cloruro de nicotinamida ribósido
    como fuente de niacina en alimentos para usos médicos especiales y sustitutivos
    de la dieta completa para el control de peso
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2023/439 av den 16 december 2022
    om ändring av bilagan till Europaparlamentets och rådets förordning (EU) nr
    609/2013 för att tillåta att nikotinamidribosidklorid används som niacinkälla
    i livsmedel för speciella medicinska ändamål och i komplett kostersättning
    för viktkontroll
