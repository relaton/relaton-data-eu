  content: Council Decision (EU) 2024/1667 of 30 May 2024 on the position to be taken
    on behalf of the European Union at the 16th meeting of the Committee of the Parties
    to the Council of Europe Convention on preventing and combating violence against
    women and domestic violence on the adoption of a recommendation and conclusions
    addressed to five State Parties on their implementation of that Convention, with
    regard to matters related to institutions and public administration of the Union
  type: main
- language: fr
