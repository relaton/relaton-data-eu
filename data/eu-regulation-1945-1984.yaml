title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1945/84 of 6 July 1984 re-establishing the
    levying of customs duties on diodes, transistors and similar parts, falling within
    subheading 85.21 D and E and originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1945/84 de la Commission du 6 juillet 1984 portant
    rétablissement de la perception des droits de douane applicables aux diodes,
    transistors et dispositifs similaires ainsi qu' aux parties et pièces détachées,
    des sous-positions 85.21 D et E du tarif douanier commun originaires du Brésil,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1945/84 der Kommission vom 6. Juli 1984 zur Wiedereinführung
    der Erhebung der Zölle für Dioden, Transistoren und ähnliche Halbleiter und
    Teile der Tarifstellen 85.21 D und E mit Ursprung in Brasilien, dem die in der
    Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1945/84 af 6. juli 1984 om genindførelse
    af opkrævning af told for dioder, transistorer og lignende halvlederkomponenter
    og dele henhørende under pos. 85.21 D og E og med oprindelse i Brasilien, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1945/84 της Επιτροπής
    της 6ης Ιουλίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για διόδους, κρυσταλλολυχνίες
    και παρόμοιες διατάξεις καθώς και για μέρη
    και μεμονωμένα τεμάχια, των διακρίσεων 85.21
    Δ και Ε του Κοινού Δασμολογίου, καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1945/84 della Commissione del 6 luglio 1984 che ripristina
    la riscossione dei dazi doganali applicabili ai diodi, transistori e simili dispositivi,
    nonché alle parti e pezzi staccati, delle sottovoci 85.21 D ed E della tariffa
    doganale comune, originari del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1945/84 van de Commissie van 6 juli 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op dioden, transistors
    en dergelijke halfgeleiderelementen, en delen en onderdelen, van de posten 85.21
    D en E, van oorsprong uit Brazilië, waarvoor de in Verordening (EEG) nr. 3569/83
    van de Raad vermelde tariefpreferenties zijn verleend
  type: main
