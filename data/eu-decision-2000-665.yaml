  script: Latn
  content: '2000/665/EC: Council Decision of 23 October 2000 extending the period
    of application of Decision 82/530/EEC authorising the United Kingdom to permit
    the Isle of Man authorities to apply a system of special import licences to sheepmeat
    and beef and veal'
  type: main
- language: fr
  script: Latn
  content: '2000/665/CE: Décision du Conseil du 23 octobre 2000 prorogeant la période
    d''application de la décision 82/530/CEE autorisant le Royaume-Uni à permettre
    aux autorités de l''île de Man d''appliquer un système de certificats spéciaux
    d''importation pour la viande ovine et la viande bovine'
  type: main
- language: de
  script: Latn
