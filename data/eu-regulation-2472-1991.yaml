    in ihrer Zusammensetzung vom 31. Dezember 1985 anwendbaren Ausgleichsbeträge
    für das Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2472/91 af 12. august 1991 om fastsættelse
