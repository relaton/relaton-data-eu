  content: Commission Regulation (EEC) No 2472/91 of 12 August 1991 fixing the regulatory
    amounts applicable in 1991/92 to imports of certain wine-sector products from
    Spain into the Community as constituted at 31 December 1985
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2472/91 DE LA COMMISSION du 12 août 1991 fixant,
