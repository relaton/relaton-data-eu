    heks-2(trans)-enal, alil heksanoat, alil heptanoat, linalool, 2-metil-1-fenilpropan-2-ol,
    alfa-ionon, beta-damaskon, nootkaton, beta-ionon, alfa-železo, beta-damaskenon,
    (E)-beta-damaskon, pentadekano-1,15-lakton, 2-feniletan-1-ol, fenetil izovalerat,
    4-(p-hidroksifenil)butan-2-on, 2-metoksinaftalen, 2-izopropil-4-metiltiazol in
    valencen kot krmni dodatki za vse živalske vrste
