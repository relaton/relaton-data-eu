title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2862/82 of 27 October 1982 re-establishing
    the levying of customs duties on other vitamins, falling within subheading 29.38
    B V and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2862/82 de la Commission, du 27 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables aux autres vitamines
    de la sous-position 29.38 B V du tarif douanier commun, originaires de Chine,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3601/81 du Conseil0
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2862/82 der Kommission vom 27. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für andere Vitamine der Tarifstelle 29.38 B V, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2862/82 af 27. oktober 1982 om genindførelse
    af opkrævning af told for andre vitaminer henhørende under pos. 29.38 B V og
    med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81g
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2862/82 τής Επιτροπής
    τής 27ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τίς έτερες βιταμίνες
    τής διακρίσεως 29. 38 B V τού Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2862/82 della Commissione, del 27 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili alle altre vitamine, della
    sottovoce 29.38 B V della tariffa doganale comune, originarie della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2862/82 van de Commissie van 27 oktober 1982 houdende
