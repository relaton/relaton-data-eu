id: EURegulation20072000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2007/2000 of 18 September 2000 introducing exceptional
    trade measures for countries and territories participating in or linked to the
    European Union's Stabilisation and Association process, amending Regulation (EC)
    No 2820/98, and repealing Regulations (EC) No 1763/1999 and (EC) No 6/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2007/2000 du Conseil du 18 septembre 2000 introduisant
    des mesures commerciales exceptionnelles en faveur des pays et territoires participants
    et liés au processus de stabilisation et d'association mis en oeuvre par l'Union
    européenne, modifiant le règlement (CE) nº 2820/98 et abrogeant les règlements
    (CE) nº 1763/1999 et (CE) nº 6/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2007/2000 des Rates vom 18. September 2000 zur Einführung
    besonderer Handelsmaßnahmen für die am Stabilisierungs- und Assoziierungsprozess
    der Europäischen Union teilnehmenden oder damit verbundenen Länder und Gebiete
    sowie zur Änderung der Verordnung (EG) Nr. 2820/98 und zur Aufhebung der Verordnungen
    (EG) Nr. 1763/1999 und (EG) Nr. 6/2000
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕO) № 2007/2000 на Съвета от 18 септември
    2000 година относно въвеждане на изключителни
    търговски мерки в полза на страни и територии,
    участващи или свързани с процеса на стабилизиране
    и асоцииране, осъществяван от Европейския
    съюз, за изменение на Регламент (ЕО) № 2820/98 и
    за отмяна на Регламенти (ЕО) № 1763/1999 и (ЕО) №
    6/2000
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 2007/2000 ze dne 18. září 2000, kterým se
    zavádějí mimořádná obchodní opatření pro země a území účastnící
    se procesu stabilizace a přidružení zavedeného Evropskou unií či s tímto
    procesem spjaté, kterým se mění nařízení (ES) č. 2820/98 a kterým se
    zrušují nařízení (ES) č. 1763/1999 a (ES) č. 6/2000
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2007/2000 af 18. september 2000 om exceptionelle
    handelsforanstaltninger for lande og territorier, der deltager i eller er knyttet
    til Den Europæiske Unions stabiliserings- og associeringsproces samt om ændring
    af forordning (EF) nr. 2820/98 og ophævelse af forordning (EF) nr. 1763/1999
    og forordning (EF) nr. 6/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2007/2000 του Συμβουλίου,
    της 18ης Σεπτεμβρίου 2000, για την εισαγωγή εκτάκτων
    εμπορικών μέτρων για χώρες και εδάφη που συμμετέχουν
    ή συνδέονται με τη διαδικασία σταθεροποίησης
    και σύνδεσης της Ευρωπαϊκής Ένωσης, για την
    τροποποίηση του κανονισμού (ΕΚ) αριθ. 2820/98 και
    την κατάργηση των κανονισμών (ΕΚ) αριθ. 1763/1999
    και 6/2000
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 2007/2000, 18. september 2000, millega kehtestatakse
    erandlikud kaubandusmeetmed Euroopa Liidu stabiliseerimis- ja assotsieerimisprotsessis
    osalevate või sellega seotud maade ja territooriumide suhtes, muudetakse määrust
    (EÜ) nr 2820/98 ja tunnistatakse kehtetuks määrused (EÜ) nr 1763/1999 ja (EÜ)
    nr 6/2000
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2007/2000, annettu 18 päivänä syyskuuta 2000,
    poikkeuksellisten kaupan toimenpiteiden käyttöönotosta Euroopan unionin vakautus-
    ja assosiaatioprosessiin osallistuville tai siihen yhteydessä oleville maille
    ja alueille sekä asetuksen (EY) N:o 2820/98 muuttamisesta ja asetusten (EY) N:o
    1763/1999 ja (EY) N:o 6/2000 kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2007/2000/EK rendelete (2000. szeptember 18.) az Európai Unió
    stabilizációs és társulási folyamatában részt vevő vagy ahhoz kapcsolódó
    országokra és területekre kivételes kereskedelmi intézkedések bevezetéséről,
    a 2820/98/EK rendeletet módosításáról, illetve az 1763/1999/EK és a 6/2000/EK
    rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2007/2000 del Consiglio, del 18 settembre 2000, recante
    misure commerciali eccezionali applicabili ai paesi e territori che partecipano
    o sono legati al processo di stabilizzazione e di associazione dell'Unione europea,
    e recante modificazione del regolamento (CE) n. 2820/98, nonché abrogazione del
    regolamento (CE) n. 1763/1999 e del regolamento (CE) n. 6/2000
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 2007/2000 (2000. gada 18. septembris), ar kuru
    gan ievieš ārkārtas pasākumus tirdzniecībā ar tām valstīm un teritorijām,
    kas piedalās Eiropas Savienības asociācijas un stabilizācijas procesā vai
    ir ar to saistītas, gan groza Regulu (EK) Nr. 2820/98, gan arī atceļ Regulu
    (EK) Nr. 1763/1999 un Regulu (EK) Nr. 6/2000
  type: main
- language: lt
  script: Latn
  content: 2000 m. rugsėjo 18 d. Tarybos reglamentas (EB) Nr. 2007/2000 įvedantis
    išskirtines prekybos priemones, skirtas Europos Sąjungos stabilizavimo ir asocijavimo
    procese dalyvaujančioms arba su juo susijusioms šalims ir teritorijoms, iš
    dalies keičiantis Reglamentą (EB) Nr. 2820/98 ir panaikinantis Reglamentus (EB)
    Nr. 1763/1999 ir (EB) Nr. 6/2000
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kunsill (KE) Nru 2007/2000 tat-18 ta' Settembru 2000
    li jintroduċi ċerti miżuri kummerċjali ta'eċċezzjoni għal pajjiżi u territorji
    li jipparteċipaw fi, jew li huma marbutin mal-proċess ta' Stabilizzazzjoni u
    Assoċjazzjoni ta' l-Unjoni Ewropea, u li jemenda r-Regolament (KE) Nru 2820/98,
    u jħassar ir-Regolament (KE) Nru 1763/1999 u (KE) Nru 6/2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2007/2000 van de Raad van 18 september 2000 tot vaststelling
    van uitzonderlijke handelsmaatregelen ten behoeve van de landen en gebieden die
    deelnemen aan of verbonden zijn met het stabilisatie- en associatieproces van
    de Europese Unie, tot wijziging van Verordening (EG) nr. 2820/98 en tot intrekking
    van de Verordeningen (EG) nr. 1763/1999 en (EG) nr. 6/2000
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 2007/2000 z dnia 18 września 2000 r. wprowadzające
    nadzwyczajne środki handlowe dla krajów i terytoriów uczestniczących lub powiązanych
    z procesem stabilizacji i stowarzyszania Unii Europejskiej, zmieniające rozporządzenie
    (WE) nr 2820/98 oraz uchylające rozporządzenia (WE) nr 1763/1999 i (WE) nr 6/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2007/2000 do Conselho, de 18 de Setembro de 2000,
    que adopta medidas comerciais excepcionais em favor dos países e territórios
    que participam ou estão ligados ao processo de estabilização e associação
    da União Europeia, que altera o Regulamento (CE) n.o 2820/98 e que revoga os
    Regulamentos (CE) n.os 1763/1999 e 6/2000
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 2007/2000 al Consiliului din 18 septembrie 2000 privind
    introducerea de măsuri comerciale excepționale în favoarea țărilor și teritoriilor
    participante și legate de procesul de stabilizare și asociere pus în aplicare
    de către Uniunea Europeană de modificare a Regulamentului (CE) nr. 2820/98 și
    de abrogare a Regulamentelor (CE) nr. 1763/1999 și (CE) nr. 6/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 2007/2000 z 18. septembra 2000, ktorým sa zavádzajú
    výnimočné obchodné opatrenia pre krajiny a územia zúčastňujúce sa na
    procese stabilizácie a pristúpenia k Európskej únii alebo sú s týmto procesom
    spojené a ktorým sa mení a dopĺňa nariadenie (ES) č. 2820/98 a rušia sa
    nariadenia (ES) č. 1763/1999 a (ES) č. 6/2000
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 2007/2000 z dne 18. septembra 2000 o uvedbi izjemnih
    trgovinskih ukrepov za države in ozemlja, ki sodelujejo ali so povezana s stabilizacijsko-pridružitvenim
    procesom Evropske unije, o spremembi Uredbe (ES) št. 2820/98 ter o razveljavitvi
    uredb (ES) št. 1763/1999 in (ES) št. 6/2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2007/2000 del Consejo, de 18 de septiembre de 2000,
    por el que se introducen medidas comerciales excepcionales para los países y
    territorios participantes o vinculados al Proceso de estabilización y asociación
    de la Unión Europea y vinculados al mismo, se modifica el Reglamento (CE) nº
    2820/98 y se derogan los Reglamentos (CE) nº 1763/1999 y (CE) nº 6/2000
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2007/2000 av den 18 september 2000 om införande
    av särskilda handelsåtgärder för länder och territorier som deltar i eller
    är knutna till Europeiska unionens stabiliserings- och associeringsprocess samt
    om ändring av förordning (EG) nr 2820/98 och om upphävande av förordningarna
    (EG) nr 1763/1999 och (EG) nr 6/2000
  type: main
