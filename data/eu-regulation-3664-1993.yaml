title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3664/93 of 22 December 1993 imposing a definitive
    anti-dumping duty on imports into the Community of photo albums in bookbound form
    originating in the People's Republic of China and collecting definitively the
    provisional anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3664/93 du Conseil, du 22 décembre 1993, instituant
    un droit antidumping définitif sur les importations dans la Communauté d'albums
    de photographies à reliure «livre» originaires de la République populaire
    de Chine et portant perception définitive du droit antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3664/93 des Rates vom 22. Dezember 1993 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von buchgebundenen Fotoalben
    mit Ursprung in der Volksrepublik China in die Gemeinschaft und zur endgültigen
    Vereinnahmung des vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3664/93 af 22. december 1993 om indførelse
    af en endelig antidumpingtold på importen til Fællesskabet af fotoalbum, indbundne
    som bøger, med oprindelse i Den Kinesiske Folkerepublik og om endelig opkrævning
    af den midlertidige antidumpingtold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3664/93 του Συμβουλίου
    της 22ας Δεκεμβρίου 1993 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές στην Κοινότητα
    ορισμένων λευκωμάτων φωτογραφιών καταγωγής
    Λαϊκής Δημοκρατίας της Κίνας και για την οριστική
    είσπραξη των προσωρινών δασμών αντιντάμπινγκ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3664/93, annettu 22 päivänä joulukuuta 1993,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta
    peräisin olevien kirjan muotoon sidottujen valokuvakansioiden tuonnissa ja väliaikaisen
    polkumyyntitullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3664/93 del Consiglio, del 22 dicembre 1993, che istituisce
    un dazio antidumping definitivo sulle importazioni nella Comunità di album per
    fotografie legati a libro originari della Repubblica popolare cinese e che decide
    la riscossione definitiva del dazio antidumping provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3664/93 van de Raad van 22 december 1993 tot instelling
    van een definitief anti-dumpingrecht op de invoer in de Gemeenschap van in boekvorm
    ingebonden fotoalbums van oorsprong uit de Volksrepubliek China en tot definitieve
    invordering van het voorlopige anti- dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3664/93 do Conselho, de 22 de Dezembro de 1993, que
    cria um direito anti-dumping definitivo sobre as importações na Comunidade de
    certos álbuns para fotografias encadernados originários da República Popular
    da China e determina a cobrança definitiva do direito anti-dumping provisório
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3664/93 del Consejo, de 22 de diciembre de 1993, por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    en la Comunidad de álbumes de fotos encuadernados originarios de la República
    Popular de China y por el que se percibe definitivamente el derecho antidumping
    provisional
  type: main
- language: sv
