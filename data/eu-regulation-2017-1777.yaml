  content: Commission Regulation (EU) 2017/1777 of 29 September 2017 amending Annexes
    II, III and IV to Regulation (EC) No 396/2005 of the European Parliament and of
    the Council as regards maximum residue levels for Bacillus amyloliquefaciens strain
    FZB24, Bacillus amyloliquefaciens strain MBI 600, clayed charcoal, dichlorprop-P,
    ethephon, etridiazole, flonicamid, fluazifop-P, hydrogen peroxide, metaldehyde,
    penconazole, spinetoram, tau-fluvalinate and Urtica spp. in or on certain products
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/1777 de la Commission du 29 septembre 2017 modifiant
    les annexes II, III et IV du règlement (CE) n° 396/2005 du Parlement européen
    et du Conseil en ce qui concerne les limites maximales applicables aux résidus
    de Bacillus amyloliquefaciens, souche FZB24, de Bacillus amyloliquefaciens, souche
    MBI 600, de charbon argileux, de dichlorprop-P, d'éthéphon, d'étridiazole,
