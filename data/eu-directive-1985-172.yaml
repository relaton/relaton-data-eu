title:
- language: en
  script: Latn
  content: Council Directive 85/172/EEC of 28 February 1985 amending for the 23rd
    time Directive 64/54/EEC on the approximation of the laws of the Member States
    concerning the preservatives authorized for use in foodstuffs intended for human
    consumption
  type: main
- language: fr
  script: Latn
  content: Directive 85/172/CEE du Conseil du 28 février 1985 portant vingt-troisième
    modification de la directive 64/54/CEE relative au rapprochement des législations
    des États membres concernant les agents conservateurs pouvant être employés
    dans les denrées destinées à l'alimentation humaine
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/172/EWG des Rates vom 28. Februar 1985 zur dreiundzwanzigsten
    Änderung der Richtlinie 64/54/EWG zur Angleichung der Rechtsvorschriften der
    Mitgliedstaaten für konservierende Stoffe, die in Lebensmitteln verwendet werden
    dürfen
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 85/172/EØF af 28. februar 1985 om 23. ændring af direktiv
    64/54/EØF om tilnærmelse af medlemsstaternes lovgivning om konserveringsstoffer,
    som må anvendes i levnedsmidler
  type: main
- language: el
  script: Grek
  content: Οδηγία 85/172/ΕΟΚ του Συμβουλίου της 28ης Φεβρουαρίου
    1985 για την 23η τροποποίηση της οδηγίας 64/54/ΕΟΚ
    περί προσεγγίσεως των νομοθεσιών των κρατών
    μελών σχετικά με τα συντηρητικά που επιτρέπεται
    να χρησιμοποιούνται στα τρόφιμα
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 85/172/ETY, annettu 28 päivänä helmikuuta 1985,
    elintarvikkeissa sallittuja säilöntäaineita koskevan jäsenvaltioiden lainsäädännön
    lähentämisestä annetun direktiivin 64/54/ETY muuttamisesta kahdennenkymmenennenkolmannen
    kerran
  type: main
- language: it
  script: Latn
  content: Direttiva 85/172/CEE del Consiglio del 28 febbraio 1985 recante ventitreesima
    modifica della direttiva 64/54/CEE per il ravvicinamento delle legislazioni degli
    Stati Membri sui conservativi che possono essere impiegati nelle derrate destinate
    all'alimentazione umana
  type: main
- language: nl
  script: Latn
  content: Richtlijn 85/172/EEG van de Raad van 28 februari 1985 houdende drieëntwintigste
    wijziging van Richtlijn 64/54/EEG betreffende de aanpassing van de wetgevingen
    van de Lid-Staten inzake conserveermiddelen die mogen worden gebruikt in voor
    menselijke voeding bestemde waren
  type: main
- language: pt
  script: Latn
  content: Directiva 84/172/CEE do Conselho, de 28 de Fevereiro de 1985, que altera
    pela vigésima terceira vez a Directiva 64/54/CEE relativa à aproximação das
    legislações dos Estados-Membros respeitantes aos conservantes que podem ser
    utilizados nos géneros destinados à alimentação humana
  type: main
- language: es
  script: Latn
  content: Directiva 84/172/CEE del Consejo, de 28 de febrero de 1985, con la vigesimotercera
    modificación de la Directiva 64/54/CEE relativa a la aproximación de las legislaciones
    de los Estados Miembros referente a los agentes conservadores que se pueden emplear
    en los productos destinados a la alimentación humana
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 85/172/EEG av den 28 februari 1985 om ändring för tjugotredje
