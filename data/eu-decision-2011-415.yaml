title:
- language: en
  script: Latn
  content: '2011/415/EU: Commission Decision of 14 July 2011 correcting Directive
    2010/19/EU amending, for the purposes of adaptation to technical progress in the
    field of spray-suppression systems of certain categories of motor vehicles and
    their trailers, Council Directive 91/226/EEC, and Directive 2007/46/EC of the
    European Parliament and of the Council as regards the amendment of the Annexes
    to Directive 2007/46/EC'
  type: main
- language: fr
  script: Latn
  content: '2011/415/UE: Décision de la Commission du 14 juillet 2011 rectifiant
    la directive 2010/19/UE modifiant la directive 91/226/CEE du Conseil et la directive
    2007/46/CE du Parlement européen et du Conseil afin de les adapter aux progrès
    techniques dans le domaine des systèmes antiprojections de certaines catégories
    de véhicules à moteur et de leurs remorques, en ce qui concerne la modification
    des annexes de la directive 2007/46/CE'
  type: main
- language: de
  script: Latn
  content: '2011/415/EU: Beschluss der Kommission vom 14. Juli 2011 zur Berichtigung
    der Richtlinie 2010/19/EU zur Änderung der Richtlinie 91/226/EG des Rates und
    der Richtlinie 2007/46/EG des Europäischen Parlaments und des Rates zum Zwecke
    der Anpassung der Vorschriften über Spritzschutzsysteme für bestimmte Klassen
    von Kraftfahrzeugen und Kraftfahrzeuganhängern an den technischen Fortschritt
    hinsichtlich der Änderung der Anhänge der Richtlinie 2007/46/EG'
  type: main
