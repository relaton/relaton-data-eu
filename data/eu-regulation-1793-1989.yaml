title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1793/89 of 22 June 1989 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain intervention
    agencies and intended for export, amending Regulation (EEC) No 569/88 and repealing
    Regulation (EEC) No 1045/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1793/89 de la Commission du 22 juin 1989 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées, modifiant le règlement (CEE) n° 569/88 et abrogeant le
    règlement (CEE) n 1045/89
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1793/89 DER KOMMISSION vom 22. Juni 1989 über den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch aus Beständen einiger Interventionsstellen
    nach dem Verfahren der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung
    (EWG) Nr. 569/88 und zur Aufhebung der Verordnung (EWG) Nr. 1045/89 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1793/89 af 22. juni 1989 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på udførsel og om ændring af forordning (EØF) nr. 569/88 og om
    ophævelse af forordning (EØF) nr. 1045/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1793/89 της Επιτροπής
    της 22ας Ιουνίου 1989 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, βοείου κρέατος που κρατείται
    από ορισμένους οργανισμούς παρέμβασης και
    προορίζεται για εξαγωγή καθώς και σχετικά
    με την τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    1045/89
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1793/89 DELLA COMMISSIONE del 22 giugno 1989 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate all''
    esportazione, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 1045/89 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1793/89 VAN DE COMMISSIE van 22 juni 1989 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees,
    houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking van
    Verordening (EEG) nr. 1045/89 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 1793/89 DA COMISSÃO de 22 de Junho de 1989 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) nº 2539/84, de
    carne de bovino detida por certos organismos de intervenção e destinada a ser
    exportada, que altera o Regulamento (CEE) nº 569/88 e que revoga o Regulamento
    (CEE) nº 1045/89 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1793/89 DE LA COMISIÓN de 22 de junio de 1989 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno en poder de determinados organismos de intervención y destinadas
    a ser exportadas, por el que se modifica el Reglamento (CEE) no 569/88 y por el
    que se deroga el Reglamento (CEE) no 1045/89 #'
  type: main
