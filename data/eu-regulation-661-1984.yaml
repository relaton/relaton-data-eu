  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 661/84 del Consiglio del 13 marzo 1984 relativo alla
    conclusione dell' accordo sotto forma di scambio di lettere tra la Comunità economica
    europea e il Regno del Marocco, che fissa, per il periodo 1o novembre 1983 - 31
    ottobre 1984, l' importo aggiuntivo da detrarre dal prelievo applicabile all'
    importazione nella Comunità di olio d' oliva non trattato originario del Marocco
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 661/84 van de Raad van 13 maart 1984 houdende sluiting
