  content: Council Regulation (EEC) No 661/84 of 13 March 1984 on the conclusion of
    the Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1983 to 31 October 1984
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 661/84 du Conseil du 13 mars 1984 concernant la conclusion
    de l'accord sous forme d'échange de lettres entre la Communauté économique
    européenne et le Royaume du Maroc fixant, pour la période du 1er novembre 1983
    au 31 octobre 1984, le montant additionnel à déduire du prélèvement applicable
    à l'importation dans la Communauté d'huile d'olive non traitée originaire du
    Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 661/84 des Rates vom 13. März 1984 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Marokko zur Festsetzung des vom 1. November 1983 bis 31. Oktober
    1984 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht
    behandeltem Olivenöl mit Ursprung in Marokko von der Abschöpfung abzuziehen
    ist
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 661/84 af 13. marts 1984 om indgåelse af
    aftalen i form af brevveksling mellem Det europæiske økonomiske Fællesskab
    og kongeriget Marokko vedrørende fastsættelse for perioden 1. november 1983
    til 31. oktober 1984 af det tillægsbeløb, som skal fratrækkes den afgift, der
    anvendes ved indførsel til Fællesskabet af ikke behandlet olivenolie med oprindelse
    i Marokko
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 661/84 του Συμβουλίου
    της 13ης Μαρτίου 1984 περί συνάψεως συμφωνίας
    υπό μορφή ανταλλαγής επιστολών μεταξύ της
    Ευρωπαϊκής Οικονομικής Κοινότητας και του
    Βασιλείου του Μαρόκου περί καθορισμού, για
    την περίοδο από 1ης Νοεμβρίου 1983 μέχρι 31ης Οκτωβρίου
