    Gemeenschap en het Koninkrijk Marokko tot vaststelling, voor het tijdvak van 1
    november 1983 tot en met 31 oktober 1984, van het aanvullend bedrag dat in mindering
    moet worden gebracht op de heffing die bij invoer in de Gemeenschap van toepassing
    is op niet-behandelde olijfolie van oorsprong uit Marokko
