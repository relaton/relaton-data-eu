---
id: EURegulation20262309
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2026/2309 of 16 October 2026 amending the Annex
    to Regulation (EU) No 231/2012 laying down specifications for food additives listed
    in Annexes II and III to Regulation (EC) No 1333/2008 of the European Parliament
    and of the Council, as regards specifications for enzymatically produced steviol
    glycosides to include rebaudioside M produced via enzymatic conversion of highly
    purified rebaudioside A stevia leaf extract (E 960c(ii)) using the genetically
    modified yeast K. phaffii CGMCC 7539
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2026/2309 de la Commission du 16 octobre 2026 modifiant
    l’annexe du règlement (UE) no 231/2012 établissant les spécifications des
    additifs alimentaires énumérés aux annexes II et III du règlement (CE) no
    1333/2008 du Parlement européen et du Conseil en ce qui concerne les spécifications
    des glycosides de stéviol produits par voie enzymatique de façon à inclure
    le rébaudioside M produit par conversion enzymatique de rébaudioside A issu
    d’extraits hautement purifiés de feuilles de Stevia [E 960c (ii)] à l’aide
    de la levure génétiquement modifiée K. phafﬁi CGMCC 7539
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2026/2309 der Kommission vom 16. Oktober 2026 zur Änderung
    des Anhangs der Verordnung (EU) Nr. 231/2012 mit Spezifikationen für die in den
    Anhängen II und III der Verordnung (EG) Nr. 1333/2008 des Europäischen Parlaments
    und des Rates aufgeführten Lebensmittelzusatzstoffe hinsichtlich der Spezifikationen
    für enzymatisch hergestellte Steviolglycoside dahin gehend, dass Rebaudiosid
    M hergestellt durch enzymatische Konversion von hochreinem Rebaudiosid A aus Blattextrakt
    der Steviapflanze (E 960c(ii)) unter Verwendung der genetisch veränderten Hefe
    K. phaffii (CGMCC 7539) aufgenommen wird
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2026/2309 на Комисията от 16 октомври
    2026 година за изменение на приложението към
    Регламент (ЕС) № 231/2012 за определяне на спецификации
    на добавките в храните, включени в списъците
    в приложения II и III към Регламент (ЕО) № 1333/2008
    на Европейския парламент и на Съвета, по отношение
    на спецификациите на eнзимно получени стевиолови
    гликозиди, така че да включват ребаудиозид
    М, получен чрез ензимно превръщане на високо
    пречистен ребаудиозид А от екстракт от листа
    на стевия (E 960c (ii)) с използване на генетично
    модифицирани дрожди K. phaffii CGMCC 7539
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2026/2309 ze dne 16. října 2026, kterým se mění
    příloha nařízení (EU) č. 231/2012, kterým se stanoví specifikace pro potravinářské
    přídatné látky uvedené v přílohách II a III nařízení Evropského parlamentu
    a Rady (ES) č. 1333/2008, pokud jde o specifikace enzymaticky produkovaných
    steviol-glykosidů tak, aby zahrnovaly rebaudiosid M produkovaný enzymatickou
    konverzí vysoce purifinovaného extraktu rebaudiosidu A z listů stévie (E 960c(ii)),
    s použitím geneticky modifikovaných kvasinek K. phaffii CGMCC 7539
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2026/2309 af 16. oktober 2026 om ændring
    af bilaget til forordning (EU) nr. 231/2012 om specifikationer for fødevaretilsætningsstoffer
    opført i bilag II og III til Europa-Parlamentets og Rådets forordning (EF) nr.
    1333/2008 for så vidt angår specifikationer for enzymatisk fremstillede steviolglycosider
    med henblik på at medtage rebaudiosid M fremstillet via enzymatisk konversion
    af stærkt renset rebaudiosid A fra ekstrakt af steviablade (E 960c(ii)), ved
    anvendelse af den genetisk modificerede gær K. phaffii CGMCC 7539
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2026/2309 της Επιτροπής, της
    16ης Οκτωβρίου 2026, για την τροποποίηση του παραρτήματος
    του κανονισμού (ΕΕ) αριθ. 231/2012 σχετικά με τη
    θέσπιση προδιαγραφών για τα πρόσθετα τροφίμων
    που αναφέρονται στα παραρτήματα II και III του
    κανονισμού (ΕΚ) αριθ. 1333/2008 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, όσον αφορά τις προδιαγραφές
    για τους ενζυμικά παραγόμενους γλυκοζίτες
    στεβιόλης ώστε να συμπεριληφθεί ο ρεβαουδιοζίτης
    Μ που παράγεται μέσω ενζυμικής μετατροπής
    ρεβαουδιοζίτη Α από κεκαθαρμένα εκχυλίσματα
    φύλλων στέβιας [E 960c(ii)] με τη χρήση του γενετικώς
    τροποποιημένου ζυμομύκητα K. phaffii CGMCC 7539
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) 2026/2309, 16. oktoober 2026, millega muudetakse
    määruse (EL) nr 231/2012 (millega kehtestatakse Euroopa Parlamendi ja nõukogu
    määruse (EÜ) nr 1333/2008 II ja III lisas loetletud toidu lisaainete spetsifikatsioonid)
    lisa seoses ensümaatiliselt toodetud stevioolglükosiidide spetsifikatsioonidega,
    et lisada Stevia lehtedest ekstraheeritud kõrge puhtusastmega A-rebaudiosiidi
    ensümaatilise muundamise teel (geneetiliselt muundatud pärmseene K. phaffii
    CGMCC 7539 abil) toodetud M-rebaudiosiid (E 960c(ii))
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) 2026/2309, annettu 16 päivänä lokakuuta 2026,
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1333/2008 liitteissä II
    ja III lueteltujen elintarvikelisäaineiden eritelmien vahvistamisesta annetun
    asetuksen (EU) N:o 231/2012 liitteen muuttamisesta entsymaattisesti tuotettujen
    stevioliglykosidien eritelmien osalta sisällyttämällä niihin rebaudiosidi
    M, joka on tuotettu hyvin puhdistetusta stevianlehtiuutteesta saatavasta rebaudiosidi
    A:sta entsymaattisen konversion avulla (E 960c(ii)) käyttäen muuntogeenistä
    hiivaa K. phaffii CGMCC 7539
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2026/2309 ón gCoimisiún an 16 Deireadh Fómhair 2026
    lena leasaítear an Iarscríbhinn a ghabhann le Rialachán (AE) Uimh. 231/2012
    lena leagtar síos sonraíochtaí le haghaidh breiseáin bhia a liostaítear in
    Iarscríbhinní II agus III a ghabhann le Rialachán (CE) Uimh. 1333/2008 ó Pharlaimint
    na hEorpa agus ón gComhairle, a mhéid a bhaineann le sonraíochtaí le haghaidh
    gliocóisídí steibhióil a tháirgtear go heinsímeach chun ribidióisíd M
    a tháirgtear trí thiontú einsímeach a dhéanamh ar eastóscáin duilleog stevia
    ribidióisíde A ardíonaithe (E 960c(ii)) trí úsáid á bhaint as giosta géinmhodhnaithe
    K. phaffii CGMCC 7539 a chur leis an Iarscríbhinn sin
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) 2026/2309 оd 16. listopada 2026. o izmjeni Priloga
    Uredbi (EU) br. 231/2012 o utvrđivanju specifikacija za prehrambene aditive navedene
    u prilozima II. i III. Uredbi (EZ) br. 1333/2008 Europskog parlamenta i Vijeća
    u pogledu specifikacija za enzimski proizvedene steviol glikozide radi uvrštavanja
    rebaudiozida M proizvedenog enzimskom konverzijom visoko pročišćenih ekstrakata
    rebaudiozida A iz listova stevije (E 960c(ii)) upotrebom genetski modificiranog
    kvasca K. phaffii CGMCC 7539
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/2309 rendelete (2026. október 16.) az 1333/2008/EK
    európai parlamenti és tanácsi rendelet II. és III. mellékletében felsorolt
    élelmiszer-adalékanyagok specifikációinak meghatározásáról szóló 231/2012/EU
    rendelet mellékletének az enzimesen előállított szteviol-glikozidok specifikációi
    tekintetében, a nagymértékben tisztított rebaudiozid A sztévialevél-kivonatok
    enzimes átalakításával, a géntechnológiával módosított K. phaffii CGMCC
    7539 élesztő felhasználásával előállított rebaudiozid M (E 960c(ii)) felvétele
    céljából történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2026/2309 della Commissione, del 16 ottobre 2026, recante
    modifica dell’allegato del regolamento (UE) n. 231/2012 che stabilisce le specifiche
    degli additivi alimentari elencati negli allegati II e III del regolamento (CE)
    n. 1333/2008 del Parlamento europeo e del Consiglio, per quanto riguarda le specifiche
    dei glicosidi steviolici prodotti enzimaticamente al fine di includere il rebaudioside
    M prodotto mediante conversione enzimatica di rebaudioside A da estratti altamente
    purificati di foglie di Stevia [E 960c (ii)] utilizzando il lievito geneticamente
    modificato K. phaffii CGMCC 7539
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2026/2309 (2026. gada 16. oktobris), ar ko groza
    Regulas (ES) Nr. 231/2012 pielikumu, kurā ir noteiktas Eiropas Parlamenta un
    Padomes Regulas (EK) Nr. 1333/2008 II un III pielikumā iekļauto pārtikas piedevu
    specifikācijas, attiecībā uz enzimātiski producētu steviolglikozīdu specifikācijām,
    lai iekļautu rebaudiozīdu M, kas ražots ļoti attīrīta rebaudiozīda A stēvijas
    lapu ekstrakta fermentatīvā pārvēršanā (E 960c(ii)), kurā izmantota ģenētiski
    modificēta rauga sēne K. phaffii CGMCC 7539
  type: main
- language: lt
  script: Latn
  content: 2026 m. spalio 16 d. Komisijos reglamentas (ES) 2026/2309, kuriuo dėl
    fermentiškai pagamintų steviolio glikozidų specifikacijų iš dalies keičiamas
    Reglamento (ES) Nr. 231/2012, kuriuo nustatomos Europos Parlamento ir Tarybos
    reglamento (EB) Nr. 1333/2008 II ir III prieduose išvardytų maisto priedų specifikacijos,
    priedas, kad būtų įtrauktas rebaudiozidas M, pagamintas iš labai išgryninto
    rebaudiozido A stevijos lapų ekstrakto (E 960c(ii)) fermentinės konversijos
    būdu, naudojant genetiškai modifikuotas mieles K. phaffii CGMCC 7539
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2026/2309 tas-16 ta’ Ottubru 2026 li
    jemenda l-Anness tar-Regolament (UE) Nru 231/2012 li jistabbilixxi l-ispeċifikazzjonijiet
    għall-addittivi tal-ikel elenkati fl-Annessi II u III tar-Regolament (KE) Nru
    1333/2008 tal-Parlament Ewropew u tal-Kunsill, fir-rigward tal-ispeċifikazzjonijiet
    għall-glikosidi tal-istevjol prodotti b’mod enżimatiku biex jinkludu r-rebawdjosidu
    M prodott permezz tal-konverżjoni enżimatika tal-estratti tar-rebawdjosidu A
    ppurifikati ħafna mill-weraq tal-istevja (E 960c(ii)) bl-użu tal-ħmira ġenetikament
    modifikata K. phaffii CGMCC 7539
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2026/2309 van de Commissie van 16 oktober 2026 tot wijziging
    van de bijlage bij Verordening (EU) nr. 231/2012 tot vaststelling van de specificaties
    van de in de bijlagen II en III bij Verordening (EG) nr. 1333/2008 van het Europees
    Parlement en de Raad opgenomen levensmiddelenadditieven, wat betreft de specificaties
    van enzymatisch geproduceerde steviolglycosiden, teneinde rebaudioside M, geproduceerd
    via enzymatische omzetting van sterk gezuiverde rebaudioside A van extracten van
    steviabladeren (E 960c(ii)) met behulp van de genetisch gemodificeerde gist K.
    phaffii CGMCC 7539, erin op te nemen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) 2026/2309 z dnia 16 października 2026 r.
    zmieniające załącznik do rozporządzenia (UE) nr 231/2012 ustanawiającego
    specyfikacje dla dodatków do żywności wymienionych w załącznikach II i III
    do rozporządzenia Parlamentu Europejskiego i Rady (WE) nr 1333/2008 w odniesieniu
    do specyfikacji dla glikozydów stewiolowych wytwarzanych enzymatycznie w celu
    włączenia rebaudiozydu M otrzymywanego w drodze enzymatycznej konwersji wysoko
    oczyszczonych ekstraktów z liści stewii zawierających rebaudiozyd A (E 960c(ii)
    przy użyciu genetycznie zmodyfikowanych drożdży K. phaffii CGMCC 7539
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2026/2309 da Comissão, de 16 de outubro de 2026, que
    altera o anexo do Regulamento (UE) n.o 231/2012 que estabelece especificações
    para os aditivos alimentares enumerados nos anexos II e III do Regulamento (CE)
    n.o 1333/2008 do Parlamento Europeu e do Conselho, no que diz respeito às especificações
    para os glicosídeos de esteviol produzidos por via enzimática, a fim de incluir
    o rebaudiósido M produzido através da conversão enzimática de extratos altamente
    purificados de rebaudiósido A obtidos de folhas de estévia [E 960c(ii)] utilizando
    a levedura geneticamente modificada K. phaffii CGMCC 7539
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2026/2309 al Comisiei din 16 octombrie 2026 de modificare
    a anexei la Regulamentul (UE) nr. 231/2012 de stabilire a specificațiilor pentru
    aditivii alimentari enumerați în anexele II și III la Regulamentul (CE) nr.
    1333/2008 al Parlamentului European și al Consiliului în ceea ce privește specificațiile
    pentru glicozidele steviolice produse enzimatic pentru a include rebaudiozida
    M produsă prin conversia enzimatică a rebaudiozidei A înalt purificate extrase
    din frunze de stevia [E 960c (ii)] utilizând drojdiile modificate genetic K.
    phaffii CGMCC 7539
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) 2026/2309 zo 16. októbra 2026, ktorým sa mení
    príloha k nariadeniu (EÚ) č. 231/2012, ktorým sa ustanovujú špecifikácie
    prídavných látok uvedených v prílohách II a III k nariadeniu Európskeho
    parlamentu a Rady (ES) č. 1333/2008, pokiaľ ide o špecifikácie enzymaticky
    vyrábaných glykozidov steviolu, s cieľom zahrnúť rebaudiozid M vyrobený
    enzymatickou konverziou vysoko purifikovaného extraktu rebaudiozidu A z listov
    stévie [E 960cii)] použitím geneticky modifikovaných kvasiniek K. phaffii
    CGMCC 7539
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) 2026/2309 z dne 16. oktobra 2026 o spremembi Priloge
    k Uredbi (EU) št. 231/2012 o določitvi specifikacij za aditive za živila, navedene
    v prilogah II in III k Uredbi (ES) št. 1333/2008 Evropskega parlamenta in Sveta,
    glede specifikacij za encimsko proizvedene steviol glikozide, da se vključi rebaudiozid
    M, proizveden z encimsko pretvorbo visoko prečiščenega ekstrakta rebaudiozida
    A iz listov stevie (E 960c(ii)) z gensko spremenjeno kvasovko K. phaffii CGMCC
    7539
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2026/2309 de la Comisión, de 16 de octubre de 2026, que
    modifica el anexo del Reglamento (UE) n.o 231/2012, por el que se establecen especificaciones
    para los aditivos alimentarios que figuran en los anexos II y III del Reglamento
    (CE) n.o 1333/2008 del Parlamento Europeo y del Consejo, en lo referente a las
    especificaciones relativas a los glucósidos de esteviol producidos enzimáticamente
    para incluir el rebaudiósido M producido mediante conversión enzimática del
    rebaudiósido A muy purificado a partir de extractos de hojas de estevia [E 960c(ii)]
    utilizando la levadura modificada genéticamente K. phaffii CGMCC 7539
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) 2026/2309 av den 16 oktober 2026 om ändring
    av bilagan till förordning (EU) nr 231/2012 om fastställande av specifikationer
    för de livsmedelstillsatser som förtecknas i bilagorna II och III till Europaparlamentets
    och rådets förordning (EG) nr 1333/2008 vad gäller specifikationerna för enzymatiskt
    framställda steviolglykosider för att inkludera rebaudiosid M framställd genom
    enzymatisk omvandling av rebaudiosid A från höggradigt renat extrakt av steviablad
    (E 960c (ii)) med användning av den genetiskt modifierade jästen K. phaffii
    CGMCC 7539
