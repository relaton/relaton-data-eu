title:
- language: en
  script: Latn
  content: '82/722/EEC: Commission Decision of 15 October 1982 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of gloves of leather
    or of composition leather originating in the People''s Republic of China which
    have been put into free circulation in the Community (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/722/CEE: Décision de la Commission, du 15 octobre 1982, autorisant
    le Royaume-Uni à procéder à une surveillance intracommunautaire des importations
    de gants en cuir naturel, artificiel ou reconstitué originaires de la République
    populaire de Chine et mis en libre pratique dans la Communauté (Le texte en langue
    anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '82/722/EWG: Entscheidung der Kommission vom 15. Oktober 1982 zur Ermächtigung
    des Vereinigten Königreichs zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus der Volksrepublik China stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen Handschuhen aus Leder oder Kunstleder (Nur der
    englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/722/EØF: Kommissionens beslutning af 15. oktober 1982 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med indførsel
    af handsker af læder eller kunstlæder med oprindelse i Den kinesiske Folkerepublik
    til fri omsætning i Fællesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/722/EOK: Απόφαση τής Επιτροπής τής 15ης Οκτωβρίου
    1982 περί χορηγήσεως αδείας στό Ηνωμένο Βασίλειο
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών χειροκτίων εκ δέρματος φυσικού,
    τεχνητού ή ανεσχηματισμένου, καταγωγής Λαϊκής
    Δημοκρατίας τής Κίνας, τά οποία ευρίσκονται
    σέ ελεύθερη κυκλοφορία στήν Κοινότητα (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/722/CEE: Decisione della Commissione, del 15 ottobre 1982, che autorizza
    il Regno Unito ad istituire una sorveglianza intracomunitaria delle importazioni
    di guanti di cuoio o di pelli, naturali, artificiali o ricostituiti originari
    della Repubblica popolare cinese e messi in libera pratica nella Comunità (Il
    testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/722/EEG: Beschikking van de Commissie van 15 oktober 1982 houdende
    machtiging van het Verenigd Koninkrijk tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van handschoenen van leder of van kunstleder,
    van oorsprong uit de Volksrepubliek China, die in de Gemeenschap in het vrije
    verkeer zijn gebracht (Slechts de tekst in de Engelse taal is authentiek)'
