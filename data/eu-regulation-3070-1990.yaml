  script: Latn
  content: Council Regulation (EEC) No 3070/90 of 22 October 1990 again amending articles
    6 and 17 of the Protocol concerning the concept of 'originating products' and
    methods of administrative Cooperation to the Cooperation Agreement between the
    European economic community and the Hashemite Kingdom of Jordan
  type: main
- language: fr
  script: Latn
