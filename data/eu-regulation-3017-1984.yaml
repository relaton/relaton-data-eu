title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3017/84 of 26 October 1984 re-establishing
    the levying of customs duties on certain receivers, and parts, falling within
    subheadings 85.15 A III b) and C II c) and originating in Malaysia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3569/83
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3017/84 de la Commission du 26 octobre 1984 portant
    rétablissement de la perception des droits de douane applicables à certains
    appareils récepteurs; parties et pièces détachées, des sous-positions 85.15
    A III b) et C II c) du tarif douanier commun, originaires de Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3017/84 der Kommission vom 26. Oktober 1984 zur Wiedereinführung
    der Erhebung der Zölle für bestimmte Empfangsgeräte und Teile der Tarifstelle
    85.15 A III b), C II c) mit Ursprung in Malaysia, dem die in der Verordnung (EWG)
    Nr. 3569/83 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3017/84 af 26. oktober 1984 om genindførelse
    af opkrævning af told for bestemte modtagere, dele henhørende under pos. 85.15
    A III b) og C II c) og med oprindelse i Malaysia, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3017/84 της Επιτροπής
    της 26ης Οκτωβρίου 1984 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ορισμένες συσκευές
    λήψεως μέρη και μεμονωμένα τεμάχια, των διακρίσεων
    85.15 Α ΙΙΙ β) και Γ ΙΙ γ) του Κοινού Δασμολογίου,
    καταγωγής Μαλαισίας, δικαιούχου των προβλεπόμενων
    από τον κανονισμό (ΕΟΚ) αριθ. 3569/83 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3017/84 della Commissione del 26 ottobre 1984 che
    ripristina la riscossione dei dazi doganali applicabili ad alcuni apparecchi riceventi,
    parti e pezzi staccati, delle sottovoci 85.15 A III b), C II c) della tariffa
    doganale comune, originari della Malaysia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3017/84 van de Commissie van 26 oktober 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde ontvangtoestellen,
    delen en onderdelen, van de postonderverdelingen 85.15 A III b) en C II c), van
    oorsprong uit Maleisië, waarvoor de in Verordening (EEG) nr. 3569/83 van de Raad
    vermelde tariefpreferenties zijn verleend
  type: main
