    instituées à l’encontre de certaines personnes, et de certains groupes, entreprises
    et entités au regard de la situation en Afghanistan
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss 2012/809/GASP des Rates vom 20. Dezember 2012 zur
    Durchführung des Beschlusses 2011/486/GASP über restriktive Maßnahmen gegen
    bestimmte Personen, Gruppen, Unternehmen und Einrichtungen angesichts der Lage
    in Afghanistan
