title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3073/90 of 22 October 1990 again amending articles
    6 and 17 of the protocol concerning the concept of "originating products" and
    methods of administrative cooperation to the cooperation agreement between the
    European Economic Community and the Socialist Federal Republic of Yugoslavia
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3073/90 du Conseil, du 22 octobre 1990, modifiant
    une nouvelle fois les articles 6 et 17 du protocole relatif à la définition
    de la notion de "produits originaires" et aux méthodes de coopération administrative
    de l'accord de coopération entre la Communauté économique européenne et la
    République socialiste fédérative de Yougoslavie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 3073/90 DES RATES VOM 22. OKTOBER 1990 ZUR ERNEUTEN
    AENDERUNG DER ARTIKEL 6 UND 17 DES PROTOKOLLS UEBER DIE BESTIMMUNG DES BEGRIFFS
    " ERZEUGNISSE MIT URSPRUNG IN " ODER " URSPRUNGSERZEUGNISSE " UND UEBER DIE METHODEN
    DER ZUSAMMENARBEIT DER VERWALTUNGEN ZUM KOOPERATIONSABKOMMEN ZWISCHEN DER EUROPAEISCHEN
    WIRTSCHAFTSGEMEINSCHAFT UND DER SOZIALISTISCHEN FOEDERATIVEN REPUBLIK JUGOSLAWIEN
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3073/90 af 22. oktober 1990 om en ny ændring
    af artikel 6 og 17 i protokollen vedrørende definitionen af begrebet "varer med
    oprindelsesstatus" og vedrørende metoderne for administrativt samarbejde til
    samarbejdsaftalen mellem Det Europæiske Økonomiske Fællesskab og den socialistiske
    føderative republik Jugoslavien
  type: main
- language: el
  script: Grek
