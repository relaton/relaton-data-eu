title:
- language: en
  script: Latn
  content: '88/644/EEC: Council Decision of 21 December 1988 on the conclusion of
    the Agreement in the form of an exchange of letters between the European Economic
    Community and the Kingdom of Morocco fixing the additional amount to be deducted
    from the levy on imports into the Community of untreated olive oil, originating
    in Morocco, for the period 1 November 1987 to 31 December 1990'
  type: main
- language: fr
  script: Latn
  content: '88/644/CEE: Décision du Conseil du 21 décembre 1988 concernant la conclusion
    de l''accord sous forme d''échange de lettres entre la Communauté économique
    européenne et le Royaume du Maroc fixant, pour la période du 1er novembre 1987
    au 31 décembre 1990, le montant additionnel à déduire du prélèvement applicable
    à l''importation, dans la Communauté, d''huile d''olive non traitée originaire
    du Maroc'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DES RATES vom 21. Dezember 1988 über den Abschluß des Abkommens
    in Form eines Briefwechsels zwischen der Europäischen Wirtschaftsgemeinschaft
    und dem Königreich Marokko zur Festsetzung des vom 1. November 1987 bis 31. Dezember
    1990 geltenden Zusatzbetrags, der bei der Einfuhr in die Gemeinschaft von nicht
    behandeltem Olivenöl mit Ursprung in Marokko von der Abschöpfung abzuziehen
    ist (88/644/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS AFGØRELSE af 21. december 1988 om indgåelse af aftalen i form
    af brevveksling mellem Det Europæiske Økonomiske Fællesskab og Kongeriget Marokko
    om fastsættelse for perioden 1. november 1987 til 31. december 1990 af det tillægsbeløb,
    som skal fratrækkes den afgift, der anvendes ved indførsel til Fællesskabet
    af ikke-behandlet olivenolie med oprindelse i Marokko (88/644/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 21ης Δεκεμβρίου
    1988 για τη σύναψη της συμφωνίας υπό μορφή ανταλλαγής
    επιστολών μεταξύ της Ευρωπαϊκής Οικονομικής
    Κοινότητας και του Βασιλείου του Μαρόκου που
    καθορίζει, για την περίοδο από 1ης Νοεμβρίου
    1987 μέχρι 31 Δεκεμβρίου 1990, το πρόσθετο ποσό που
    πρέπει να αφαιρείται από την εισφορά που εφαρμόζεται
    κατά την εισαγωγή στην Κοινότητα μη επεξεργασμένου
    ελαιολάδου, καταγωγής Μαρόκου ( 88/644/ΕΟΚ )
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO del 21 dicembre 1988 relativa alla conclusione
    dell'' accordo in forma di scambio di lettere tra la Comunità economica europea
    e il Regno del Marocco, che fissa, per il periodo 1o novembre 1987-31 dicembre
    1990, l'' importo aggiuntivo da detrarre dal prelievo applicabile all'' importazione
    nella Comunità di olio d'' oliva non trattato originario del Marocco (88/644/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESLUIT VAN DE RAAD van 21 december 1988 houdende sluiting van de Overeenkomst
    in de vorm van een briefwisseling tussen de Europese Economische Gemeenschap en
    het Koninkrijk Marokko tot vaststelling, voor het tijdvak van 1 november 1987
    tot en met 31 december 1990, van het aanvullend bedrag dat in mindering moet worden
    gebracht op de heffing die bij invoer in de Gemeenschap van toepassing is op niet-behandelde
    olijfolie van oorsprong uit Marokko (88/644/EEG) #'
  type: main
- language: pt
  script: Latn
  content: '88/644/CEE: Decisão do Conselho de 21 de Dezembro de 1988 relativa à
    celebração do Acordo sob forma de Troca de Cartas entre a Comunidade Económica
    Europeia e o Reino de Marrocos, que fixa, para o período compreendido entre 1
    de Novembro de 1987 e 31 de Dezembro de 1990, o montante adicional a deduzir do
    direito nivelador aplicável à importação, na Comunidade, de azeite não tratado
    originário de Marrocos'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DEL CONSEJO de 21 de dicembre 1988 relativa a la celebración
    del Acuerdo en forma de canje de notas entre la Comunidad Económica Europea y
    el Reino de Marruecos que fija, para el período comprendido entre el 1 de noviembre
    de 1987 y el 31 de diciembre de 1990, el importe adicional que habrá de deducirse
    de la exacción reguladora aplicable a la importación de aceite de oliva sin
    tratar originario de Marruecos en la Comunidad (88/644/CEE) #'
