title:
- language: en
  script: Latn
  content: '81/719/EEC: Commission Decision of 18 August 1981 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''shirts, woven, originating in
    Bulgaria (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/719/CEE: Décision de la Commission, du 18 août 1981, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises et chemisettes tissées, pour
    hommes et garçonnets, originaires de la Bulgarie (Les textes en langues française
    et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '81/719/EWG: Entscheidung der Kommission vom 18. August 1981 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande, aus Bulgarien stammende Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, für Männer und Knaben von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/719/EØF: Kommissionens beslutning af 18. august 1981 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede skjorter (herunder sports- og
    arbejdsskjorter) til mænd og drenge med oprindelse i Bulgarien (Kun den franske
    og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '81/719/EOK: Απόφαση τής Επιτροπής τής 18ης Αυγούστου
    1981 περί χορηγήσεως αδείας στό Βασίλειο τού
    Βελγίου, στό Μεγάλο Δουκάτο τού Λουξεμβούργου
    καί στό Βασίλειο τών Κάτω Χωρών νά εξαιρέσουν
    από τήν κοινοτική μεταχείριση τά υφασμένα
    υποκάμισα καί υποκαμισάκια δι άνδρας καί παίδας,
    καταγωγής Βουλγαρίας (Τα κείμενα στην γαλλική
    και ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '81/719/CEE: Decisione della Commissione, del 18 agosto 1981, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie e camicette, tessute, per
    uomo e per ragazzo, originarie della Bulgaria (Il testi in lingua francese e olandese
    sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '81/719/EEG: Beschikking van de Commissie van 18 augustus 1981 houdende
    machtiging van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk
    der Nederlanden om overhemden en sporthemden, geweven, van oorsprong uit Bulgarije
    van de communautaire behandeling uit te sluiten (Slechts de teksten in de Franse
    en de Nederlandse taal zijn authentiek)'
