  content: Regulation (EEC) No 3353/75 of the Commission of 23 December 1975 establishing
    Community surveillance on the importation of certain live plants and floricultural
    products originating in various countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3353/75 de la Commission, du 23 décembre 1975, portant
