id: EUDecision1978389
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 March 1978 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to jerseys, pullovers, slip-overs, twinsets, cardigans, bed-jackets
    and jumpers, knitted or crocheted, not elastic or rubberized, of wool, cotton
    or man-made textile fibres, falling within subheading ex 60.05 A of the Common
    Customs Tariff, originating in Yugoslavia and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '78/389/CEE: Décision de la Commission, du 21 mars 1978, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chandails, "pull-overs", "slip-overs",
    "twinsets" et vestes de bonneterie non élastique ni caoutchoutée de la sous-position
    Ex 60.05 A du Tarif douanier commun, originaires de Yougoslavie et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. März 1978, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten im freien
    Verkehr befindliche Pullover, Slipover, Twinsets, Westen und dergleichen aus Gewirken,
    aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen (weder gummielastisch
    noch kautschutiert) der Tarifstelle ex 60.05 A des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 21. marts 1978 om bemyndigelse af kongeriget
    Belgien, storthertugdømmet Luxembourg og kongeriger Nederlandene til fra fællesskabsbehandling
    at undtage sweatere, pullovere, slipovere, cardigansæt, veste og trøjer af uld,
    bomuld eller syntetiske eller regenererede fibre, som henhører under pos. ex
    60.05 A i den fælles toldtarif, har oprindelse i Jugoslavien, og frit kan omsættes
    i de andre medlemstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 marzo 1978, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario maglie, pullover, slip-over, twinset, giubbotti, giacche
    e bluse, a maglia, non elastica né gommata, di lana, di cotone o di fibre sintetiche
    o artificiali, della sottovoce ex 60.05 A della tariffa doganale comune, originari
    della Iugoslavia e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 maart 1978 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden gemachtigd
    truien, jumpers, pullovers en slipovers, twinsets, vesten en jasjes van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van post ex 60.05 A van het gemeenschappelijk
    douanetarief, van oorsprong uit Joegoslavië en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
