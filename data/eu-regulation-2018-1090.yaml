    Επιτροπής, της 31ης Ιουλίου 2018, σχετικά με τη
    χορήγηση άδειας για τη χρήση παρασκευάσματος
    ενδο-1,4-β-ξυλανάσης και ενδο-1,3(4) -β-γλυκανάσης
