    и видове свине с по-малко стопанско значение
    (отбити) (притежател на разрешението Kaesler Nutrition
    GmbH)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2018/1090 ze dne 31. července 2018
    o povolení přípravku z endo-1,4-beta-xylanázy a endo-1,3(4)-beta-glukanázy
    z Komagataella pastoris (CBS 25376) a Komagataella pastoris (CBS 26469) jako doplňkové
    látky pro výkrm kuřat, odchov kuřat a kuřice, výkrm krůt, kuřice nebo
    odchov všech druhů ptactva, odstavená selata a menšinové druhy prasat (po
    odstavu) (držitel povolení Kaesler Nutrition GmbH)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2018/1090 af 31. juli 2018
