    heinäkuuta 2018, Komagataella pastorisin (CBS 25376) ja Komagataella pastorisin
    (CBS 26469) tuottaman endo-1,4-beeta-ksylanaasi- ja endo-1,3(4)-beeta-glukanaasivalmisteen
    hyväksymisestä broilerien, kananuorikoiden, lihakalkkunoiden, kaikkien munintaan
    tai siitoseläimiksi kasvatettavien lintulajien, vieroitettujen porsaiden ja toissijaisten
    sikaeläinten (vieroitettujen) rehun lisäaineena (hyväksynnän haltija Kaesler
    Nutrition GmbH)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2018/1090 оd 31. srpnja 2018. o odobrenju
    pripravka od endo-1,4-beta-ksilanaze i endo-1,3(4)-beta-glukanaze proizvedene
    od Komagataella pastoris (CBS 25376) i Komagataella pastoris (CBS 26469) kao dodatka
    hrani za piliće za tov, kokoši nesilice, purane za tov, sve ptičje vrste koje
