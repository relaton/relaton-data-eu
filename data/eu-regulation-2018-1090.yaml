    termelt endo-1,4-béta-xilanázt és endo-1,3(4)-béta-glükanázt tartalmazó
    készítmény brojlercsirkék, tojójércék, hízópulykák, az összes tojó-
    vagy tenyésztés céljából nevelt madárfaj, elválasztott malacok és kevésbé
