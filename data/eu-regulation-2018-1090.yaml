title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2018/1090 of 31 July 2018 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase and endo-1,3(4)-beta-glucanase
    produced by Komagataella pastoris (CBS 25376) and Komagataella pastoris (CBS 26469)
    as a feed additive for chickens for fattening, chickens reared for laying, turkeys
    for fattening, all avian species reared for laying or for breeding purposes, weaned
    piglets and minor porcine species (weaned) (holder of the authorisation Kaesler
    Nutrition GmbH)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2018/1090 de la Commission du 31 juillet
    2018 concernant l''autorisation d''une préparation d''endo-1,4-bêta-xylanase
    et d''endo-1,3(4)-bêta-glucanase produite par Komagataella pastoris (CBS 25376)
    et Komagataella pastoris (CBS 26469) en tant qu''additif pour l''alimentation
    des poulets d''engraissement, des poulettes destinées à la ponte, des dindes
    d''engraissement, de toutes les espèces aviaires destinées à la ponte ou à
    la reproduction, des porcelets sevrés et des espèces porcines mineures (sevrées)
    (titulaire de l''autorisation: Kaesler Nutrition GmbH)'
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2018/1090 der Kommission vom 31. Juli 2018
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase und Endo-1,3(4)-beta-Glucanase,
    gewonnen aus Komagataella pastoris (CBS 25376) und Komagataella pastoris (CBS
    26469), als Futtermittelzusatzstoff für Masthühner, Junghennen, Masttruthühner,
    alle Vogelarten für Lege- oder Zuchtzwecke, Absetzferkel und Schweinearten von
    geringerer wirtschaftlicher Bedeutung (entwöhnt) (Zulassungsinhaber Kaesler Nutrition
    GmbH)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2018/1090 на Комисията
    от 31 юли 2018 година за разрешаване на употребата
    на препарат от ендо-1,4-бета-ксиланаза и ендо-1,3(4)-бета-глюканаза,
    получени от Komagataella pastoris (CBS 25376) и Komagataella pastoris
    (CBS 26469), като фуражна добавка за пилета за угояване,
    пилета, отглеждани за кокошки носачки, пуйки
