    en endo-1,3(4)-bèta-glucanase geproduceerd door Komagataella pastoris (CBS 25376)
    en Komagataella pastoris (CBS 26469) als toevoegingsmiddel voor diervoeding voor
    mestkippen, opfokleghennen, mestkalkoenen, alle vogelsoorten die worden opgefokt
