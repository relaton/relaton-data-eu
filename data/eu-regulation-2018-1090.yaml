    μικρά είδη χοίρων (απογαλακτισμένα) (κάτοχος
    της άδειας: Kaesler Nutrition GmbH)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2018/1090, 31. juuli 2018, milles käsitletakse
    loa andmist Komagataella pastoris'e (CBS 25376) ja Komagataella pastoris'e (CBS
    26469) abil toodetud endo-1,4-β-ksülanaasi ja endo-1,3(4)-β-glükanaasi preparaadi
    kasutamiseks broilerkanade, noorkanade, broilerkalkunite, kõigi linnuliikide
    munalindudeks ja aretuseks kasvatatavate noorlindude, võõrutatud põrsaste ning
    vähem tähtsate sealiikide (võõrutatud) söödalisandina (loa hoidja Kaesler
    Nutrition GmbH)
  type: main
- language: fi
  script: Latn
