    produceret af Komagataella pastoris (CBS 25376) og Komagataella pastoris (CBS
    26469) som tilsætningsstof til foder til slagtekyllinger, hønniker, slagtekalkuner,
    alle fuglearter opdrættet til æglægning eller avl, fravænnede smågrise og
    mindre udbredte svinearter (fravænnede) (indehaver af godkendelsen er Kaesler
    Nutrition GmbH)
  type: main
- language: el
  script: Grek
