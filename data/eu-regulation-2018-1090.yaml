    endo-1,3(4)-beta-glucanasi prodotto da Komagataella pastoris (CBS 25376) e Komagataella
    pastoris (CBS 26469) come additivo per mangimi destinati a polli da ingrasso,
    pollastre allevate per la produzione di uova, tacchini da ingrasso, tutte le specie
    avicole allevate per la produzione di uova o per la riproduzione, suinetti svezzati
