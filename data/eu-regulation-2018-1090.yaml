    Kaesler Nutrition GmbH)
  type: main
- language: lt
  script: Latn
  content: 2018 m. liepos 31 d. Komisijos įgyvendinimo reglamentas (ES) 2018/1090
    dėl leidimo naudoti endo-1,4-beta-ksilanazės ir endo-1,3(4)-beta-gliukanazės,
    gautų iš Komagataella pastoris (CBS 25376) ir Komagataella pastoris (CBS 26469),
    preparatą kaip mėsinių viščiukų, dedeklinių vištaičių, mėsinių kalakutų,
    visų rūšių dedeklinių arba veislei auginamų paukščių, nujunkytų paršelių
    ir retesnių rūšių (nujunkytų) kiaulių pašarų priedą (leidimo turėtojas
    – „Kaesler Nutrition GmbH“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2018/1090 tal-31 ta'
    Lulju 2018 li jikkonċerna l-awtorizzazzjoni ta' preparazzjoni ta' endo-1,4-beta-ksilanażi
    u endo-1,3(4)-beta-glukanażi prodotta minn Komagataella pastoris (CBS 25376)
    u Komagataella pastoris (CBS 26469) bħala addittiv fl-għalf għat-tiġieġ tas-simna,
    għat-tiġieġ imrobbija għall-bajd, għad-dundjani tas-simna, għall-ispeċijiet
    kollha tat-tjur imrobbija għall-bajd jew għat-tgħammir, għall-ħnienes miftuma
    u għall-ispeċijiet minuri tal-porċini (miftuma) (id-detentur tal-awtorizzazzjoni
    Keasler Nutrition GmbH)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2018/1090 van de Commissie van 31 juli 2018
