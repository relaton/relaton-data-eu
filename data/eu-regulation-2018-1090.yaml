  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2018/1090 (2018. gada 31. jūlijs)
    par atļauju no Komagataella pastoris (CBS 25376) un Komagataella pastoris (CBS
    26469) iegūtas endo-1,4-beta-ksilanāzes un endo-1,3(4)-beta-glikanāzes preparātu
    izmantot par barības piedevu gaļas cāļiem, dējējvistu cāļiem, gaļas tītariem,
    visu sugu putniem, kas audzēti dēšanai vai vaislai, atšķirtiem sivēniem
