  script: Latn
  content: Commission Regulation (EC) No 553/2007 of 22 May 2007 amending for the
    77th time Council Regulation (EC) No 881/2002 imposing certain specific restrictive
    measures directed against certain persons and entities associated with Usama bin
    Laden, the Al-Qaida network and the Taliban, and repealing Council Regulation
    (EC) No 467/2001
  type: main
- language: fr
  script: Latn
