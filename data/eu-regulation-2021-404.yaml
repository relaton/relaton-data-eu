title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/404 of 24 March 2021 laying
    down the lists of third countries, territories or zones thereof from which the
    entry into the Union of animals, germinal products and products of animal origin
    is permitted in accordance with Regulation (EU) 2016/429 of the European Parliament
    and the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/404 de la Commission du 24 March 2021
    établissant les listes des pays tiers, territoires et zones de pays tiers et
    territoires en provenance desquels l’entrée dans l’Union d’animaux, de
    produits germinaux et de produits d’origine animale est autorisée conformément
    au règlement (UE) 2016/429 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/404 der Kommission vom 24. März 2021
    zur Festlegung der Listen von Drittländern, Gebieten und Zonen derselben, aus
    denen der Eingang in die Union von Tieren, Zuchtmaterial und Erzeugnissen tierischen
    Ursprungs gemäß der Verordnung (EU) 2016/429 des Europäischen Parlaments und
    des Rates zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/404 на Комисията
    от 24 март 2021 година за установяване на списъци
