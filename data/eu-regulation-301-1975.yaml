id: EURegulation3011975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 301/75 of the Commission of 6 February 1975 re-establishing
    the levying of the customs duties on image projectors (other than cinematographic
    projectors); photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09, originating in Singapore, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December 1974
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 301/75 de la Commission, du 6 février 1975, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixé, appareils d'agrandissement ou de réduction photographiques,
    de la position tarifaire 90.09, originaires de Singapour, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 301/75 der Kommission vom 6. Februar 1975 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer; photographische Vergrößerungsoder Verkleinerungsapparate,
    der Tarifnummer 90.09, mit Ursprung in Singapur, dem die in der Verordnung (EWG)
    Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 301/75 af 6. februar 1975 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske) under position 90.09, som har
    oprindelse i Singapore og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 301/75 della Commissione, del 6 febbraio 1975, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa, apparecchi fotografici d'ingrandimento o di riduzione, della voce doganale
    n. 90.09, originari di Singapore, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 301/75 van de Commissie van 6 februari 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op projectietoestellen
    voor niet bewegende beelden, vergrotings- en verkleiningstoestellen voor de fotografie
    van post 90.09 van oorsprong uit Singapoer ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
