title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2106/72 of the Commission of 2 October 1972 amending
    Regulation (EEC) No 1600/72 amending the Annex to Regulation (EEC) No 1373/70
    on common detailed rules for the application of the system of import and export
    licences and advance fixing certificates for agricultural products subject to
    a single price system
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2106/72 de la Commission, du 2 octobre 1972, modifiant
    le règlement (CEE) n° 1600/72 qui modifie l' annexe du règlement (CEE) n°
    1373/70, portant modalités communes d' application du régime de certificats
    d' importation, d' exportation et de préfixation pour les produits agricoles
    soumis à un régime de prix unique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2106/72 der Kommission vom 2. Oktober 1972 zur Änderung
    der Verordnung (EWG) Nr. 1600/72 zur Änderung des Anhangs der Verordnung (EWG)
    Nr. 1373/70 über gemeinsame Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen
    sowie Voraussetzungsbescheinigungen für landwirtschaftliche Erzeugnisse, die
    einem System gemeinsamer Preise unterliegen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2106/72 af 2. oktober 1972 om ændring
    af forordning (EØF) nr. 1600/72 om ændring af bilaget til forordning (EØF)
    nr. 1373/70 om fælles gennemførelsesbestemmelser for import- og eksportlicenser
    samt forudfastsættelsesattester for de landbrugsvarer, for hvilke der gælder
    en ordning med fællespriser
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2106/72 della Commissione, del 2 ottobre 1972, che
    modifica il regolamento (CEE) n. 1600/72, recante modifica dell' allegato del
    regolamento (CEE) n. 1373/70, che stabilisce modalità comuni di applicazione
    per il regime dei titoli d' importazione e di esportazione e dei certificati di
    fissazione anticipata relativi a prodotti agricoli soggetti ad un regime di prezzo
    unico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2106/72 van de Commissie van 2 oktober 1972 houdende
    wijziging van Verordening (EEG) nr. 1600/72 tot wijziging van de bijlage van Verordening
    (EEG) nr. 1373/70 houdende gemeenschappelijke uitvoeringsbepalingen inzake het
    stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
    waarvoor een stelsel van gemeenschappelijke prijzen geldt
