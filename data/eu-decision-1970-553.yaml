title:
- language: fr
  script: Latn
  content: Décision du Conseil du 17 décembre 1970, modifiant la décision, du 5
    mai 1966, relative à la définition de la notion de "produits originaires" et
    aux méthodes de coopération administrative pour l'application de la décision
    du 25 février 1964, relative à l'association des pays et territoires d'outre-mer
    à la CEE (envois postaux)
  type: main
- language: de
  script: Latn
  content: '70/553/EWG: Entscheidung des Rates vom 17. Dezember 1970 zur Änderung
    der Entscheidung vom 5. Mai 1966 über die Begriffsbestimmung für "Erzeugnisse
    mit Ursprung in..." oder "Ursprungserzeugnisse" und über die Methoden der Zusammenarbeit
    der Verwaltungen hinsichtlich der Anwendung des Beschlusses vom 25. Februar 1964
    über die Assoziation der überseeischen Länder und Gebiete mit der Europäischen
    Wirtschaftsgemeinschaft (Postsendungen)'
  type: main
- language: it
  script: Latn
  content: '70/553/CEE: Decisione del Consiglio, del 17 dicembre 1970, che modifica
    la decisione del 5 maggio 1966 relativa alla definizione della nozione di «prodotti
    originari» e ai metodi di cooperazione amministrativa ai fini dell''applicazione
    della decisione del 25 febbraio 1964 relativa all''associazione dei paesi e territori
    d''oltremare alla Comunità economica europea (spedizioni postali)'
  type: main
- language: nl
  script: Latn
  content: '70/553/EEG: Beschikking van de Raad van 17 december 1970 houdende wijziging
    van de beschikking van 5 mei 1966 met betrekking tot de definitie van het begrip
    "produkten van oorsprong", alsmede met betrekking tot de methoden van administratieve
    samenwerking voor de toepassing van het besluit van 25 februari 1964 inzake de
    associatie van de landen en gebieden overzee met de Europese Economische Gemeenschap
    (postzendingen)'
