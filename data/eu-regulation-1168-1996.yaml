title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1168/96 of 25 June 1996 laying down for 1996
    certain conservation and management measures for fishery resources in the Convention
    Area as defined in the Convention on Future Multilateral Cooperation in North-East
    Atlantic Fisheries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1168/96 du Conseil du 25 juin 1996 fixant, pour 1996,
    certaines mesures techniques de conservation et de gestion des ressources halieutiques
    dans la zone de la convention définie par la convention sur la future coopération
    multilatérale dans les pêches de l'Atlantique du Nord-Est
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1168/96 des Rates vom 25. Juni 1996 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischereiressourcen im Regelungsbereich
    des Übereinkommens über die künftige multilaterale Zusammenarbeit auf dem Gebiet
    der Fischerei im Nordostatlantik (1996)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1168/96 af 25. juni 1996 om fastsættelse for
    1996 af foranstaltninger til bevarelse og forvaltning af fiskeressourcer i konventionsområdet
    som defineret i konventionen om det fremtidige multilaterale samarbejde vedrørende
    fiskeriet i det nordøstlige Atlanterhav
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1168/96 του Συμβουλίου
    της 25ης Ιουνίου 1996 για τη θέσπιση, για το 1996,
    ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων στη ζώνη της σύμβασης,
    ως ορίζεται στη σύμβαση για τη μελλοντική πολυμερή
    συνεργασία στο Βορειοανατολικό Ατλαντικό
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1168/96, annettu 25 päivänä kesäkuuta 1996,
    Koillis-Atlantilla harjoitettavaan kalastukseen liittyvää tulevaa monenkeskistä
    yhteistyötä koskevassa yleissopimuksessa määritetyn yleissopimusalueen kalavarojen
    tietyistä vuonna 1996 sovellettavista säilyttämis- ja hoitotoimenpiteistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1168/96 del Consiglio del 25 giugno 1996 che stabilisce,
    per il 1996, talune misure di conservazione e di gestione delle risorse alieutiche
    della zona definita dalla convenzione sulla futura cooperazione multilaterale
    per la pesca nell'Atlantico nordorientale
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1168/96 van de Raad van 25 juni 1996 tot vaststelling
    voor 1996, van bepaalde maatregelen voor de instandhouding en het beheer van visbestanden
    in het gebied zoals omschreven in het Verdrag inzake toekomstige multilaterale
    samenwerking op visserijgebied in het noordoostelijk deel van de Atlantische Oceaan
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1168/96 do Conselho de 25 de Junho de 1996 que estabelece,
    para 1996, determinadas medidas de conservação e de gestão dos recursos haliêuticos
    da área da convenção definida na Convenção sobre a futura cooperação multilateral
    nas pescas do Atlântico Nordeste
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1168/96 del Consejo de 25 de junio de 1996 por el que
