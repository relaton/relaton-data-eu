title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2693/79 of 29 November 1979 re-establishing
    the levying of customs duties on carpets, whether tufted or not, other than of
    jute or other textile bast fibres of heading No 57.03 or coir, falling within
    subheading 58.02 ex A and originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2693/79 de la Commission, du 29 novembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux tapis même
    "tufted" autres que de jute ou d'autres fibres textiles libériennes de la position
    57.03, ou de coco, de la sous-position 58.02 EX à du tarif douanier commun, originaires
    des pays et territoires en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2693/79 DER KOMMISSION VOM 29. NOVEMBER 1979 ZUR
    WIEDEREINFUEHRUNG DES ZOLLSATZES FUER TEPPICHE, AUCH NADELFLORTEPPICHE, AUSGENOMMEN
    AUS JUTE ODER ANDEREN TEXTILEN BASTFASERN DER TARIFNUMMER 57.03 ODER KOKOSFASERN,
    DER TARIFSTELLE 58.02 EX A MIT URSPRUNG IN ENTWICKLUNGSLAENDERN, DENEN DIE IN
    DER VERORDNUNG ( EWG ) NR. 1195/79 DES RATES VORGESEHENEN ZOLLPRAEFERENZEN GEWAEHRT
    WERDEN
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2693/79 af 29. november 1979 om genindførelse
    af opkrævning af toldafgifter for tæpper, også tuftede varer, bortset fra jutetæpper
    eller andre bastfibre henhørende under position 57.03 eller kokosfibre under
    underposition 58.02 ex A, som har oprindelse i udviklingslande og omfattes af
    de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2693/79 DELLA COMMISSIONE, DEL 29 NOVEMBRE 1979,
    CHE RIPRISTINA LA RISCOSSIONE DEI DAZI DOGANALI APPLICABILI AI TAPPETI, ANCHE
    " TUFTED ", ESCLUSI QUELLI DI IUTA E DI ALTRE FIBRE TESSILI LIBERIANE DELLA VOCE
    57.03 E DI COCCO, DELLA SOTTOVOCE DOGANALE 58.02 EX A, ORIGINARI DEI PAESI IN
    VIA DI SVILUPPO BENEFICIARI DELLE PREFERENZE TARIFFARIE PREVISTE DAL REGOLAMENTO
    ( CEE ) N. 1195/79 DEL CONSIGLIO
  type: main
- language: nl
  script: Latn
  content: Verordening ( EEG ) nr. 2693/79 van de Commissie van 29 november 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op tapijten,
    ook zogenaamde " tufted " -tapijten, met uitzondering van die van jute of van
    andere bastvezels van post 57.03, of van kokosvezels van post 58.02 ex A, van
    oorsprong uit de ontwikkelingslanden en -gebieden ten behoeve waarvan bij Verordening
    ( EEG ) nr. 1195/79 van de Raad tariefpreferenties werden geopend
  type: main
