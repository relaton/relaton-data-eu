type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission du 6 février 1970, autorisant la République
    italienne à exclure du traitement communautaire les machines à coudre (les tissus,
    les cuirs, les chaussures, etc.) et leurs parties et pièces détachées, à l'exclusion
    des meubles pour machines à coudre, de la position Ex 84.41 A du Tarif douanier
    commun, originaires du Japon et des pays de l'Est et mises en libre pratique dans
    les autres États membres
  type: main
- language: de
  script: Latn
  content: '70/154/EWG: Entscheidung der Kommission vom 6. Februar 1970, mit der die
    Italienische Republik ermächtigt wird, die aus Japan und den Ostblockländern
    stammenden und in den übrigen Mitgliedstaaten im freien Verkehr befindlichen
    Nähmaschinen (z. B. zum Nähen von Spinnstoffwaren, Leder oder Schuhen), einschließlich
    Teile davon, ausgenommen Möbel zum Einbau von Nähmaschinen, der Tarifnummer
    ex 84.41 A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/154/CEE: Decisione della Commissione, del 6 febbraio 1970, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le macchine per
    cucire (destinate alla cucitura di tessuti, cuoio, calzature, ecc.) e le loro
    parti e pezzi staccati, ad esclusione dei mobili per dette macchine, della voce
    ex 84.41 A della tariffa doganale comune, originarie del Giappone e dei paesi
    dell''Est e messe in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '70/154/EEG: Beschikking van de Commissie van 6 februari 1970 waarbij de
    Italiaanse Republiek wordt gemachtigd naaimachines (voor weefsels, voor leder,
    voor schoeisel, enz.), alsmede delen en onderdelen daarvan, met uitzondering van
    meubelen voor naaimachines, van post ex 84.41 A van het gemeenschappelijk douanetarief,
    van oorsprong uit Japan en de Oostelijke landen en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
