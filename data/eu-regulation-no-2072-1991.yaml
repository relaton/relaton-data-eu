    Wiederverkauf auf dem Binnenmarkt auf 40 000 Tonnen Gerste aus Beständen der
    griechischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2072/91 af 15. juli 1991 om ændring
