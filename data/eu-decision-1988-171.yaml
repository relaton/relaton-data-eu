title:
- language: en
  script: Latn
  content: '88/171/EEC: Commission Decision of 28 January 1988 approving a programme
    submitted under the common measure for the encouragement of agriculture by improving
    the rearing of beef cattle in certain less-favoured areas of France pursuant to
    Council Regulation (EEC) No 1400/86 (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/171/CEE: Décision de la Commission du 28 janvier 1988 portant approbation
    du programme s''inscrivant dans l''action commune visant à la promotion de l''agriculture
    par l''amélioration de l''élevage bovin de races à viande dans certaines zones
    défavorisées de la France conformément au règlement (CEE) n° 1400/86 du Conseil
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '88/171/EWG: Entscheidung der Kommission vom 28. Januar 1988 zur Genehmigung
    des Programms im Rahmen der gemeinsamen Maßnahme zur Förderung der Landwirtschaft
    durch Verbesserung der Zucht von Fleischrinderrassen in bestimmten benachteiligten
    Gebieten Frankreichs gemäß der Verordnung (EWG) Nr. 1400/86 des Rates (Nur der
    französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '88/171/EØF: Kommissionens beslutning af 28. januar 1988 om godkendelse
    af et program, der indgår i den fælles foranstaltning til fremme af landbruget
    i visse ugunstigt stillede områder i Frankrig ved forbedring af vilkårene for
    opdræt af kødkvægracer i henhold til Rådets forordning (EØF) nr. 1400/86
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
