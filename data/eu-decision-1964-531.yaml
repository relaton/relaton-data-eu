title:
- language: fr
  script: Latn
  content: Décision 64/531/CEE du Conseil du 22 septembre 1964, prorogeant l'autorisation
    donnée le 30 juillet 1964, à la République italienne de suspendre, à l'égard
    des pays tiers, ses droits applicables aux viandes de l'espèce bovine domestique,
    congelées, destinées, sous contrôle douanier, à la transformation, de la position
    Ex 02.01 A II
  type: main
- language: de
  script: Latn
  content: '64/531/EWG: Entscheidung des Rates vom 22. September 1964 zur Verlängerung
    der Gültigkeitsdauer der Entscheidung vom 30. Juli 1964, mit der die Italienische
    Republik ermächtigt wurde, ihre Zollsätze auf Fleisch von Hausrindern, gefroren,
    zur Verarbeitung unter Zollaufsicht bestimmt, der Tarifnummer ex 02.01 A II, gegenüber
    dritten Ländern auszusetzen'
  type: main
- language: it
  script: Latn
  content: '64/531/CEE: Decisione del Consiglio, del 22 settembre 1964, con cui si
    proroga l''autorizzazione concessa il 30 luglio 1964 alla Repubblica italiana
    di sospendere, nei confronti dei paesi terzi, i suoi dazi applicabili alle carni
    della specie bovina domestica, congelate, destinate, sotto controllo doganale,
    alla trasformazione, della voce ex 02.01 A II'
  type: main
- language: nl
  script: Latn
  content: '64/531/EEG: Beschikking van de Raad van 22 september 1964 tot verlenging
    van de op 30 juli 1964 aan de Italiaanse Republiek verleende machtiging om haar
    douanerechten ten opzichte van derde landen op bevroren vlees van runderen (huisdieren),
    bestemd voor verwerking onder douanecontrole, te schorsen (post ex 02.01 A II)'
  type: main
