type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 June 1978 authorizing the French Republic not
    to apply Community treatment to women's, girls' and infants' woven overcoats,
    raincoats and other coats, cloaks and capes, jackets and blazers other than coats
    of impregnated, coated, covered or laminated woven fabric falling within heading
    No 59.08, 59.11 or 59.12, of wool, of cotton or of man-made textile fibres, falling
    within subheading ex 61.02 B (NIMEXE code 61.02-31, 32, 33, 35, 36, 37, 39, 40)
    of the Common Customs Tariff, originating in Yugoslavia and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/575/CEE: Décision de la Commission, du 27 juin 1978, autorisant la
    République française à exclure du traitement communautaire les manteaux, imperméables
    (y compris les capes), tissés, pour femmes, fillettes et jeunes enfants (autres
    que manteaux de tissus imprégnés, enduits ou recouverts, des positions 59.08,
    59.11 ou 59.12 du Tarif douanier commun), de coton, de laine ou de fibres textiles
    synthétiques ou artificielles, de la sous-position Ex 61.02 B du Tarif douanier
    commun (codes Nimexe : 61.02-31, 32, 33, 35, 36, 37, 39, 40), originaires de Yougoslavie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. Juni 1978, mit der die Französische
    Republik ermächtigt wird, aus Jugoslawien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Mäntel, Umhänge und Jacken aus Geweben, für Frauen,
    Mädchen und Kleinkinder, andere als Mäntel aus getränkten, bestrichenen oder
    überzogenen Geweben der Tarifnummern 59.08, 59.11 oder 59.12, aus Wolle, Baumwolle
    oder synthetischen oder künstlichen Spinnstoffen der Tarifnummer ex 61.02 B des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.02-31; 32; 33; 35; 36; 37; 39; 40)
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 27. juni 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker
    og blazere, vævede, til kvinder, piger og småbørn, andre end frakker af tekstilstoffer,
    imprægneret, overtrukket eller lamineret, i henhold til tarifnumrene 59.08, 59.11
    og 59.12 af uld, bomuld eller kemofibre, som henhører under pos. ex 61.02 B (NIMEXE-kode
    61.02-31, 32, 33, 35, 36, 37, 39, 40) i den fælles toldtarif, har oprindelse
    i Jugoslavien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 27 giugno 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli
    e simili e giacche, tessuti per donna, per ragazza e per bambini (diversi dai
    soprabiti di tessuti impregnati, spalmati o ricoperti, delle voci 59.08, 59.11
    o 59.12 della tariffa doganale comune), di lana, di cotone o di fibre tessili
    sintetiche o artificiali, della sottovoce ex 61.02 B (codice Nimexe: 61.02-31;
    32; 33; 35; 36; 37; 39; 40) della tariffa doganale comune, originari della Iugoslavia
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 juni 1978 waarbij de Franse Republiek
    wordt gemachtigd mantels, regenjassen en andere jassen, capes, blazers en jasjes,
    geweven, andere dan mantels, regenjassen daaronder begrepen, van geïmpregneerde,
    van een deklaag voorziene of beklede weefsels - post 59.08, 59.11 of 59.12 van
    het gemeenschappelijk douanetarief - van wol, van katoen of van synthetische of
    van kunstmatige textielvezels, van post ex 61.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 61.02-31, 32, 33, 35, 36, 37, 39, 40), van oorsprong uit Joegoslavië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
