  content: Regulation (EEC) No 1103/73 of the Commission of 18 April 1973 fixing the
    rates of the refunds applicable from 1 May 1973 to eggs and egg yolks exported
    in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1103/73 de la Commission, du 18 avril 1973, fixant les
    taux des restitutions applicables, à compter du 1er mai 1973, aux oeufs et aux
    jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1103/73 der Kommission vom 18. April 1973 zur Festsetzung
