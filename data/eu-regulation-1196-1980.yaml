title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1196/80 of 12 May 1980 re-establishing the
    levying of customs duties on acrylonitrile, falling within heading No ex 29.27
    and originating in Brazil, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1196/80 de la Commission, du 12 mai 1980, portant
    rétablissement de la perception des droits de douane applicables à l' acrylonitrile,
    de la position ex 29.27 du tarif douanier commun, originaire du Brésil, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1196/80 der Kommission vom 12. Mai 1980 zur Wiedereinführung
    des Zollsatzes für Acrylnitril der Tarifnummer ex 29.27, mit Ursprung in Brasilien,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1196/80 af 12. maj 1980 om genindførelse
    af opkrævning af toldafgifter for acrylonitril, under pos. ex 29.27, som har
    oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1196/80 della Commissione, del 12 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili all' acrilonitrile della
    voce ex 29.27 della tariffa doganale comune, originario del Brasile, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1196/80 van de Commissie van 12 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op acrylonitril,
    van post ex 29.27, van oorsprong uit Brazilië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
