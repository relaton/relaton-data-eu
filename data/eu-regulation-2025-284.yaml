---
id: EURegulation2025284
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/284 of 12 February 2025 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase produced
    with Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glucanase produced with Trichoderma
    reesei MUCL 49754 and polygalacturonase produced with Aspergillus fijiensis CBS
    589.94 as a feed additive for weaned piglets and the authorisation of that preparation
    as a feed additive for suckling piglets (holder of authorisation: AVEVE BV) and
    repealing Implementing Regulation (EU) No 527/2011'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/284 de la Commission du 12 février
    2025 concernant le renouvellement de l’autorisation d’une préparation à
    base d’endo-1,4-β-xylanase produite à l’aide de Trichoderma reesei MUCL
    49755, d’endo-1,3(4)-β-glucanase produite à l’aide de Trichoderma reesei
    MUCL 49754 et de polygalacturonase produite à l’aide d’Aspergillus fijiensis
    CBS 589.94 en tant qu’additif pour l’alimentation des porcelets sevrés, concernant
    l’autorisation de cette préparation en tant qu’additif pour l’alimentation
    des porcelets non sevrés (titulaire de l’autorisation: AVEVE BV) et abrogeant
    le règlement d’exécution (UE) no 527/2011'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/284 der Kommission vom 12. Februar
    2025 zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase,
    gewonnen aus Trichoderma reesei MUCL 49755, Endo-1,3(4)-beta-Glucanase, gewonnen
    aus Trichoderma reesei MUCL 49754, und Polygalacturonase, gewonnen aus Aspergillus
    fijiensis CBS 589.94, als Futtermittelzusatzstoff für abgesetzte Ferkel und zur
    Zulassung dieser Zubereitung als Futtermittelzusatzstoff für Saugferkel (Zulassungsinhaber:
    AVEVE BV) sowie zur Aufhebung der Durchführungsverordnung (EU) Nr. 527/2011'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2025/284 на Комисията
    от 12 февруари 2025 година за подновяване на разрешението
    за употреба на препарат от ендо-1,4-бета-ксиланаза,
    получена с Trichoderma reesei MUCL 49755, ендо-1,3(4)-бета-глюканаза,
    получена с Trichoderma reesei MUCL 49754, и полигалактуроназа,
    получена с Aspergillus fijiensis CBS 589.94, като фуражна
    добавка за отбити прасенца и разрешаване на
    употребата на посочения препарат като фуражна
    добавка за прасенца сукалчета (притежател
    на разрешението: AVEVE BV) и за отмяна на Регламент
    за изпълнение (ЕС) № 527/2011'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2025/284 ze dne 12. února 2025 o
    obnovení povolení přípravku z endo-1,4-beta-xylanázy z Trichoderma reesei
    MUCL 49755, endo-1,3(4)-beta-glukanázy z Trichoderma reesei MUCL 49754 a polygalakturonázy
    z Aspergillus fijiensis CBS 589.94 jako doplňkové látky pro odstavená selata
    a o povolení uvedeného přípravku jako doplňkové látky pro sající selata
    (držitel povolení: AVEVE BV) a o zrušení prováděcího nařízení (EU) č.
    527/2011'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2025/284 af 12. februar 2025
    om forlængelse af godkendelsen af et præparat af endo-1,4-beta-xylanase fremstillet
    med Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glucanase fremstillet med
    Trichoderma reesei MUCL 49754 og polygalacturonase fremstillet med Aspergillus
    fijiensis CBS 589.94 som fodertilsætningsstof til fravænnede smågrise, om godkendelse
    af det pågældende præparatet som fodertilsætningsstof til pattegrise (indehaver
    af godkendelsen: AVEVE BV) og om ophævelse af gennemførelsesforordning (EU)
    nr. 527/2011'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2025/284 της Επιτροπής,
    της 12ης Φεβρουαρίου 2025, σχετικά με την ανανέωση
    της άδειας χρήσης παρασκευάσματος ενδο-1,4-β-ξυλανάσης
    που παράγεται από Trichoderma reesei MUCL 49755, ενδο-1,3(4)-β-γλυκανάσης
    που παράγεται από Trichoderma reesei MUCL 49754 και πολυγαλακτουρονάσης
    που παράγεται από Aspergillus fijiensis CBS 589.94 ως πρόσθετης
    ύλης ζωοτροφών για απογαλακτισμένα χοιρίδια
    και τη χορήγηση άδειας χρήσης του εν λόγω παρασκευάσματος
    ως πρόσθετης ύλης ζωοτροφών για θηλάζοντα
    χοιρίδια (κάτοχος της άδειας: AVEVE BV), και για
    την κατάργηση του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 527/2011'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2025/284, 12. veebruar 2025, milles käsitletakse
    Trichoderma reesei MUCL 49755 abil toodetud endo-1,4-β-ksülanaasi, Trichoderma
    reesei MUCL 49754 abil toodetud endo-1,3(4)-β-glükanaasi ja Aspergillus fijiensis
    CBS 589.94 abil toodetud polügalakturonaasi preparaadi võõrdepõrsaste söödalisandina
    kasutamise loa kehtivuse pikendamist ning loa andmist kõnealuse preparaadi kasutamiseks
    piimapõrsaste söödalisandina (loa hoidja: AVEVE BV) ja millega tunnistatakse
    kehtetuks rakendusmäärus (EL) nr 527/2011'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2025/284, annettu 12 päivänä
    helmikuuta 2025, Trichoderma reesei MUCL 49755 -organismin avulla tuotettua endo-1,4-beeta-ksylanaasia,
    Trichoderma reesei MUCL 49754 -organismin avulla tuotettua endo-1,3(4)-beeta-glukanaasia
    ja Aspergillus fijiensis CBS 589.94 -organismin avulla tuotettua polygalakturonaasia
    sisältävän valmisteen hyväksynnän uusimisesta vieroitettujen porsaiden rehun
    lisäaineena ja kyseisen valmisteen hyväksymisestä imevien porsaiden rehun lisäaineena
    (hyväksynnän haltija: AVEVE BV) sekä täytäntöönpanoasetuksen (EU) N:o 527/2011
    kumoamisesta'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2025/284 ón gCoimisiún an 12 Feabhra
    2025 maidir le húdarú ullmhóide arb é atá inti ion-1,4-béite-xiolanáis
    arna táirgeadh le Trichoderma reesei MUCL 49755, ion-1,3(4) béite-ghlúcanáis
    arna táirgeadh le Trichoderma reesei MUCL 49754 agus polagalachtúrónáis arna
    táirgeadh le Aspergillus fijiensis CBS 589.94 a athnuachan mar bhreiseán beathaithe
    le haghaidh bainbh scoite agus maidir le húdarú na hullmhóide sin mar bhreiseán
    beathaithe le haghaidh bainbh diúil (sealbhóir an údaraithe: AVEVE BV) agus
    lena n-aisghairtear Rialachán Cur Chun Feidhme (AE) Uimh. 527/2011'
  type: main
- language: hr
  script: Latn
  content: 'Provedbena uredba Komisije (EU) 2025/284 оd 12. veljače 2025. o produljenju
    odobrenja pripravka endo-1,4-beta-ksilanaze dobivene s Trichoderma reesei MUCL
    49755, endo-1,3(4)-beta-glukanaze dobivene s Trichoderma reesei MUCL 49754 i poligalakturonaze
    dobivene s Aspergillus fijiensis CBS 589.94 kao dodatka hrani za odbijenu prasad,
    odobrenju tog pripravka kao dodatka hrani za sisajuću prasad (nositelj odobrenja:
    AVEVE BV) i stavljanju izvan snage Provedbene uredbe (EU) br. 527/2011'
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2025/284 végrehajtási rendelete (2025. február 12.)
    a Trichoderma reesei (MUCL 49755) által termelt endo-1,4-béta-xilanázt, a Trichoderma
    reesei (MUCL 49754) által termelt endo-1,3(4)-béta-glükanázt és az Aspergillus
    fijiensis (CBS 589.94) által termelt poligalakturonázt tartalmazó készítmény
    elválasztott malacok takarmány-adalékanyagaként történő engedélyezésének
    megújításáról és az említett készítmény szopós malacok takarmány-adalékanyagaként
    történő engedélyezéséről (az engedély jogosultja: AVEVE BV), továbbá
    az 527/2011/EU végrehajtási rendelet hatályon kívül helyezéséről'
  type: main
- language: it
  script: Latn
  content: 'Regolamento di esecuzione (UE) 2025/284 della Commissione, del 12 febbraio
    2025, relativo al rinnovo dell’autorizzazione di un preparato di endo-1,4-beta-xilanasi
    prodotta con Trichoderma reesei MUCL 49755, di endo-1,3(4)-beta-glucanasi prodotta
    con Trichoderma reesei MUCL 49754 e di poligalatturonasi prodotta con Aspergillus
    fijiensis CBS 589.94 come additivo per mangimi destinati a suinetti svezzati e
    all’autorizzazione di tale preparato come additivo per mangimi destinati a suinetti
    lattanti (titolare dell’autorizzazione: AVEVE BV), e che abroga il regolamento
    di esecuzione (UE) n. 527/2011'
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2025/284 (2025. gada 12. februāris),
    ar ko atjauno atļauju ar Trichoderma reesei MUCL 49755 ražotas endo-1,4-beta-ksilanāzes,
    ar Trichoderma reesei MUCL 49754 ražotas endo-1,3(4)-beta-glikanāzes un ar Aspergillus
    fijiensis CBS 589.94 ražotas poligalakturonāzes preparātu lietot par atšķirtu
    sivēnu barības piedevu un atļauju minēto preparātu lietot par zīdāmu sivēnu
    barības piedevu (atļaujas turētājs: uzņēmums AVEVE BV) un ar ko atceļ Īstenošanas
    regulu (ES) Nr. 527/2011'
  type: main
- language: lt
  script: Latn
  content: 2025 m. vasario 12 d. Komisijos įgyvendinimo reglamentas (ES) 2025/284
    dėl leidimo naudoti endo-1,4-beta-ksilanazės, gautos iš Trichoderma reesei
    MUCL 49755, endo-1,3(4)-beta-gliukanazės, gautos iš Trichoderma reesei MUCL
    49754, ir poligalakturonazės, gautos iš Aspergillus fijiensis CBS 589.94, preparatą
    kaip nujunkytų paršelių pašarų priedą atnaujinimo ir leidimo naudoti šį
    preparatą kaip žindomų paršelių pašarų priedą (leidimo turėtoja – bendrovė
    AVEVE BV) ir kuriuo panaikinamas Įgyvendinimo reglamentas (ES) Nr. 527/2011
  type: main
- language: mt
  script: Latn
  content: 'Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2025/284 tat-12
    ta’ Frar 2025 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparat ta’ endo-1,4-beta-ksilanażi
    prodotta mit-Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glukanażi prodotta
    mit-Trichoderma reesei MUCL 49754 u poligalatturonażi prodotta mill-Aspergillus
    fijiensis CBS 589.94 bħala addittiv tal-għalf għall-ħnienes miftuma u l-awtorizzazzjoni
    ta’ dak il-preparat bħala addittiv tal-għalf għall-ħnienes mhux miftuma
    (detentur tal-awtorizzazzjoni: AVEVE BV) u li jħassar ir-Regolament ta’ Implimentazzjoni
    (UE) Nru 527/2011'
  type: main
- language: nl
  script: Latn
  content: 'Uitvoeringsverordening (EU) 2025/284 van de Commissie van 12 februari
    2025 tot verlenging van de vergunning voor een preparaat van endo-1,4-β-xylanase,
    geproduceerd door Trichoderma reesei MUCL 49755, endo-1,3(4)-β-glucanase, geproduceerd
    door Trichoderma reesei MUCL 49754, en polygalacturonase, geproduceerd door Aspergillus
    fijiensis CBS 589.94, als toevoegingsmiddel voor diervoeding voor gespeende biggen,
    en tot verlening van een vergunning voor dat preparaat als toevoegingsmiddel voor
    diervoeding voor speenvarkens (vergunninghouder: AVEVE BV), en tot intrekking
    van Uitvoeringsverordening (EU) nr. 527/2011'
  type: main
- language: pl
  script: Latn
  content: 'Rozporządzenie wykonawcze Komisji (UE) 2025/284 z dnia 12 lutego 2025
    r. dotyczące przedłużenia zezwolenia na stosowanie preparatu endo-1,4-beta-ksylanazy
    wytwarzanej przez Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glukanazy wytwarzanej
    przez Trichoderma reesei MUCL 49754 oraz poligalakturonazy wytwarzanej przez Aspergillus
    fijiensis CBS 589.94 jako dodatku paszowego dla prosiąt odsadzonych od maciory
    (posiadacz pozwolenia: AVEVE BV) oraz udzielenia zezwolenia na stosowanie tego
    preparatu jako dodatku paszowego dla prosiąt ssących, uchylające rozporządzenie
    wykonawcze (UE) nr 527/2011'
  type: main
- language: pt
  script: Latn
  content: 'Regulamento de Execução (UE) 2025/284 da Comissão, de 12 de fevereiro
    de 2025, relativo à renovação da autorização de uma preparação de endo-1,4-beta-xilanase
    produzida com Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glucanase produzida
    com Trichoderma reesei MUCL 49754 e poligalacturonase produzida com Aspergillus
    fijiensis CBS 589.94 como aditivo em alimentos para leitões desmamados e à autorização
    dessa preparação como aditivo em alimentos para leitões não desmamados (detentor
    da autorização: AVEVE BV) e que revoga o Regulamento de Execução (UE) n.o
    527/2011'
  type: main
- language: ro
  script: Latn
  content: 'Regulamentul de punere în aplicare (UE) 2025/284 al Comisiei din 12 februarie
    2025 privind reînnoirea autorizației unui preparat conținând endo-1,4-beta-xilanază
    produsă de Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glucanază produsă
    de Trichoderma reesei MUCL 49754 și poligalacturonază produsă de Aspergillus
    fijiensis CBS 589.94 ca aditiv pentru hrana purceilor înțărcați și autorizarea
    preparatului respectiv ca aditiv pentru hrana purceilor de lapte (titularul autorizației:
    AVEVE BV) și abrogarea Regulamentului de punere în aplicare (UE) nr. 527/2011'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie nariadenie Komisie (EÚ) 2025/284 z 12. februára 2025 o
    obnovení povolenia prípravku s obsahom endo-1,4-β-xylanázy produkovanej mikroorganizmom
    Trichoderma reesei MUCL 49755, endo-1,3(4)-β-glukanázy produkovanej mikroorganizmom
    Trichoderma reesei MUCL 49754 a polygalakturonázy produkovanej mikroorganizmom
    Aspergillus fijiensis CBS 589.94 ako kŕmnej doplnkovej látky pre odstavené
    prasiatka, o povolení uvedeného prípravku ako kŕmnej doplnkovej látky pre
    ciciaky (držiteľ povolenia: AVEVE BV) a o zrušení vykonávacieho nariadenia
    (EÚ) č. 527/2011'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbena uredba Komisije (EU) 2025/284 z dne 12. februarja 2025 o podaljšanju
    dovoljenja za pripravek iz endo-1,4-beta-ksilanaze, proizvedene s Trichoderma
    reesei MUCL 49755, endo-1,3(4)-beta-glukanaze, proizvedene s Trichoderma reesei
    MUCL 49754, in poligalakturonaze, proizvedene z Aspergillus fijiensis CBS 589.94,
    kot krmni dodatek za tekače in o dovoljenju za navedeni pripravek kot krmni dodatek
    za sesne pujske (imetnik dovoljenja: AVEVE BV) ter razveljavitvi Izvedbene uredbe
    (EU) št. 527/2011'
  type: main
- language: es
  script: Latn
  content: 'Reglamento de Ejecución (UE) 2025/284 de la Comisión, de 12 de febrero
    de 2025, relativo a la renovación de la autorización de un preparado de endo-1,4-beta-xilanasa
    producida con Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glucanasa producida
    con Trichoderma reesei MUCL 49754 y poligalacturonasa producida con Aspergillus
    fijiensis CBS 589.94 como aditivo para piensos destinado a lechones destetados
    y a la autorización de dicho preparado como aditivo para piensos destinado a
    lechones lactantes (titular de la autorización: AVEVE BV) y por el que se deroga
    el Reglamento de Ejecución (UE) n.o 527/2011'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandeförordning (EU) 2025/284 av den 12 februari
    2025 om förlängning av godkännandet av ett preparat av endo-1,4-beta-xylanas
    framställt med Trichoderma reesei MUCL 49755, endo-1,3(4)-beta-glukanas framställt
    med Trichoderma reesei MUCL 49754 och polygalakturonas framställt med Aspergillus
    fijiensis CBS 589.94 som fodertillsats för avvanda smågrisar och om godkännande
    av det preparatet som fodertillsats för diande smågrisar (innehavare av godkännandet:
    AVEVE BV) samt om upphävande av genomförandeförordning (EU) nr 527/2011'
  type: main
