title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2225/85 of 2 August 1985 providing for the
    grant of private storage aid fixed at a standard rate in advance in respect of
    carcases, half-carcases, hindquarters and forequarters from adult male bovine
    animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2225/85 de la Commission, du 2 août 1985, prévoyant
    l'octroi d'une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant de gros bovins mâles, fixée forfaitairement à
    l'avance
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2225/85 der Kommission vom 2. August 1985 zur Gewährung
    einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung von
    Schlachtkörpern, halben Schlachtkörpern, Hinter- und Vordervierteln von ausgewachsenen
    männlichen Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2225/85 af 2. august 1985 om ydelse
    af skønsmæssigt forudfastsat støtte til privat oplagring af hele kroppe, halve
    kroppe og bag- og forfjerdinger af voksne handyr i oksekødssektoren
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2225/85 της Επιτροπής
    της 2ας Αυγούστου 1985 για την πρόβλεψη χορήγησης
    ενίσχυσης που προκαθορίζεται κατ' αποκοπή
    στην ιδιωτική αποθεματοποίηση σφαγίων, ημιμορίων
    σφαγίου και οπισθίων και εμπροσθίων τεταρτημορίων
    αρσενικών χονδρών βοοειδών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2225/85 della Commissione, del 2 agosto 1985, recante
    concessione di un aiuto fissato forfettariamente in anticipo all'ammasso privato
    di carcasse, mezzene, quarti posteriori e quarti anteriori di animali adulti maschi
    della specie bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2225/85 van de Commissie van 2 augustus 1985 inzake
    de toekenning van een vooraf forfaitair vastgesteld steunbedrag voor de particuliere
    opslag van hele geslachte dieren, halve geslachte dieren, achtervoeten en voorvoeten
    van volwassen mannelijke runderen
