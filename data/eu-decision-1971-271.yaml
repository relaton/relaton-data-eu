title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 juin 1971, autorisant la République
    française à exclure du traitement communautaire les microscopes optiques, de
    la position 90.12 du Tarif douanier commun, originaires du Japon et mis en libre
    pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/271/EWG: Entscheidung der Kommission vom 30. Juni 1971, mit der die
    Französische Republik ermächtigt wird, die aus Japan stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen optischen Mikroskope der Tarifnummer
    90.12 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/271/CEE: Decisione della Commissione, del 30 giugno 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i microscopi ottici,
    della voce 90.12 della tariffa doganale comune, originari del Giappone e messi
    in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/271/EEG: Beschikking van de Commissie van 30 juni 1971 waarbij de Republiek
    Frankrijk wordt gemachtigd optische microscopen van de post 90.12 van het gemeenschappelijk
    douanetarief van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
