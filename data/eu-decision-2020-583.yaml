    gemäß Artikel 16.1 Absatz 4 Buchstabe d — der Artikel 10.17 und 10.22 jenes
    Freihandelsabkommens in Bezug auf Änderungen des Schutzes geografischer Angaben
    für in Singapur eingetragene Weine, Spirituosen, landwirtschaftliche Erzeugnisse
    und Lebensmittel zu vertretenden Standpunkt
