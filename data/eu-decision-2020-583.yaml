  script: Latn
  content: Council Decision (EU) 2020/583 of 25 March 2020 on the position to be taken
    on behalf of the European Union within the Trade Committee of the Free Trade Agreement
    between the European Union and the Republic of Singapore on the interpretation,
    pursuant to Article 16.1(4)(d), of Articles 10.17 and 10.22 of that Agreement
    as regards changes to the protection of geographical indications for wines, spirits,
    agricultural products and foodstuffs registered in Singapore
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2020/583 du Conseil du 25 mars 2020 relative à la position
    à prendre, au nom de l’Union européenne, au sein du comité «Commerce» de
    l’accord de libre-échange entre l’Union européenne et la République de
    Singapour, sur l’interprétation, en vertu de l’article 16.1, paragraphe 4,
    point d), des articles 10.17 et 10.22 dudit accord en ce qui concerne les modifications
    apportées à la protection des indications géographiques des vins, spiritueux,
    produits agricoles et denrées alimentaires enregistrées à Singapour
  type: main
- language: de
  script: Latn
