- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/1296 of 4 August 2021 amending
    and correcting Regulation (EU) No 965/2012 as regards the requirements for fuel/energy
    planning and management, and as regards requirements on support programmes and
    psychological assessment of flight crew, as well as testing of psychoactive substances
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/1296 de la Commission du 4 août 2021
    modifiant et rectifiant le règlement (UE) no 965/2012 en ce qui concerne les
    exigences relatives à la planification et à la gestion du carburant/de l’énergie,
    ainsi que les exigences relatives aux programmes de soutien, à l’évaluation
    psychologique des membres de l’équipage de conduite et au dépistage de substances
    psychotropes
  type: main
