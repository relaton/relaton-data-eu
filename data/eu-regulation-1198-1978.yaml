title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1198/78 of 30 May 1978 amending Regulation
    (EEC) No 706/76 on the arrangements applicable to agricultural products and certain
    goods resulting from the processing of agricultural products originating in the
    African, Caribbean and Pacific States or in the overseas countries and territories,
    as regards the list of the countries and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1198/78 du Conseil, du 30 mai 1978, modifiant le règlement
    (CEE) n° 706/76 relatif au régime agricole applicable à des produits agricoles
    et à certaines marchandises résultant de la transformation de produits agricoles
    originaires des États d' Afrique, des Caraïbes et du Pacifique ou des pays et
    territoires d' outre-mer, en ce qui concerne la liste des pays et territoires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1198/78 des Rates vom 30. Mai 1978 zur Änderung der
    Verordnung (EWG) Nr. 706/76 über die Regelung für landwirtschaftliche Erzeugnisse
    und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren mit Ursprung
    in den Staaten in Afrika, im karibischen Raum und im Pazifischen Ozean oder in
    den überseeischen Ländern und Gebieten hinsichtlich der Liste dieser Länder
    und Gebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1198/78 af 30. maj 1978 om ændring af forordning
    (EØF) nr. 706/76 om den ordning, der skal gælde for landbrugsvarer og visse
    varer fremstillet af landbrugsprodukter med oprindelse i staterne i Afrika, Vestindien
    og Stillehavet eller i de oversøiske lande og territorier for så vidt angår
    fortegnelsen over lande og territorier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1198/78 del Consiglio, del 30 maggio 1978, che modifica
    il regolamento (CEE) n. 706/76 relativo al regime applicabile a taluni prodotti
    agricoli e a talune merci risultanti dalla trasformazione di prodotti agricoli
    originari degli Stati dell' Africa, dei Caraibi e del Pacifico o dei paesi e territori
    d' oltremare, per quanto riguarda l' elenco dei paesi e territori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1198/78 van de Raad van 30 mei 1978 tot wijziging
    van Verordening (EEG) nr. 706/76 inzake de regeling die geldt voor landbouwprodukten
    en bepaalde door verwerking van landbouwprodukten verkregen goederen, van oorsprong
    uit de Staten in Afrika, het Caribische gebied en de Stille Oceaan of uit de landen
    en gebieden overzee voor wat betreft de lijst van de landen en gebieden
  type: main
