title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1624/80 of 26 June 1980 amending for the
    fifth time Regulation (EEC) No 610/77 on the determination of prices of adult
    bovine animals on representative Community markets and the survey of prices of
    certain other cattle in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1624/80 de la Commission, du 26 juin 1980, portant
    cinquième modification du règlement (CEE) n° 610/77 relatif à la détermination
    des prix des gros bovins constatés sur les marchés représentatifs de la Communauté
    et au relevé des prix de certains autres bovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1624/80 der Kommission vom 26. Juni 1980 zur fünften
    Änderung der Verordnung (EWG) Nr. 610/77 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für ausgewachsene Rinder und
    zur Ermittlung der Preise einiger anderer Rinder in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1624/80 af 26. juni 1980 om femte ændring
    af forordning (EØF) nr. 610/77 om bestemmelse af de priser for voksent kvæg,
    der konstateres på Fællesskabets repræsentative markeder, og om registrering
    af priserne for visse andre kvægkategorier i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1624/80 της Επιτροπής
    της 26ης Ιουνίου 1980 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 610/77 «περί του καθορισμού των τιμών
    των χονδρών βοοειδών οι οποίες διαπιστώθηκαν
    στις αντιπροσωπευτικές αγορές της Κοινότητος
    και της καταγραφής των τιμών ορισμένων άλλων
    βοοειδών στην Κοινότητα»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1624/80 della Commissione, del 26 giugno 1980, che
    reca quinta modifica del regolamento (CEE) n. 610/77 relativo alla determinazione
    dei prezzi dei bovini adulti constatati sui mercati rappresentativi della Comunità
    e al rilevamento dei prezzi di taluni altri bovini nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1624/80 van de Commissie van 26 juni 1980 houdende
    vijfde wijziging van Verordening (EEG) nr. 610/77 betreffende de vaststelling
    van de op de representatieve markten van de Gemeenschap geconstateerde prijzen
    voor volwassen runderen en betreffende de constatering van de prijzen voor sommige
    andere runderen in de Gemeenschap
  type: main
