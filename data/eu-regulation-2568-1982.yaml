title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2568/82 of 17 September 1982 imposing a
    provisional anti-dumping duty on imports of polyvinyl chloride resins and compounds
    originating in Czechoslovakia, and accepting undertakings and terminating the
    proceeding in respect of imports of such products originating in Romania, the
    German Democratic Republic and Hungary
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2568/82 de la Commission, du 17 septembre 1982, instituant
    un droit anti-"dumping" provisoire sur les chlorures de polyvinyle et leurs composés,
    originaires de Tchécoslovaquie, portant acceptation des engagements souscrits
    au sujet de l' importation des chlorures de polyvinyle et de leurs composés originaires
    de Roumanie, de la République démocratique allemande et de Hongrie et clôturant
    cette dernière procédure
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2568/82 der Kommission vom 17. September 1982 über
    die Einführung eines vorläufigen Antidumpingzolls auf Polyvinylchloridharze
    und -verbindungen mit Ursprung in der Tschechoslowakei, sowie über die Annahme
    von Verpflichtungen betreffend die Einfuhr von Polyvinylchloridharzen und -verbindungen
    mit Ursprung in Rumänien, der Deutschen Demokratischen Republik und Ungarn sowie
    die Einstellung letzterer Verfahren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2568/82 af 17. september 1982 om indførelse
    af en midlertidig antidumpingtold på polyvinylchlorid, harpikser og sammensætninger,
    med oprindelse i Tjekkoslovakiet samt om godtagelse af tilsagn afgivet i forbindelse
    med importen af polyvinylchlorid, harpikser og sammensætninger, med oprindelse
    i Rumænien, Den tyske demokratiske Republik og Ungarn og om afslutning af denne
    procedure
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2568/82 τής Επιτροπής
    τής 17ης Σεπτεμβρίου 1982 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στίς εισαγωγές ρητινών
    καί ενώσεων χλωριούχου πολυβινυλίου καταγωγής
    Τσεχοσλοβακίας καί περί αποδοχής αναλήψεως
    υποχρεώσεων καί περατώσεως τής διαδικασίας
    αντιντάμπινγκ σχετικά μέ τίς εισαγωγές ρητινών
    καί ενώσεων χλωριούχου πολυβινυλίου καταγωγής
    Ρουμανίας, Λαϊκής Δημοκρατίας τής Γερμανίας
    καί Ουγγαρίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2568/82 della Commissione, del 17 settembre 1982,
    che istituisce un dazio provvisorio antidumping sulle resine e sui composti di
    cloruro di polivinile originari della Cecoslovacchia, accetta gli impegni assunti
    riguardo alle importazioni di resine e di composti di cloruro di polivinile originari
    della Repubblica democratica tedesca, della Romania, nonché dell' Ungheria, e
    conclude detta procedura
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2568/82 van de Commissie van 17 september 1982 houdende
    instelling van een voorlopig anti-dumpingrecht op harsen en verbindingen van polyvinylchloride
    van oorsprong uit Tsjechoslowakije, de aanvaarding van verbintenissen betreffende
    de invoer van harsen en verbindingen van polyvinylchloride afkomstig uit Roemenië,
    de Duitse Democratische Republiek en Hongarije alsmede de beëindiging van de
    procedure ten aanzien van laatstgenoemde landen
  type: main
