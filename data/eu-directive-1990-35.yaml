title:
- language: en
  script: Latn
  content: Commission Directive 90/35/EEC of 19 December 1989 defining in accordance
    with Article 6 of Directive 88/379/EEC the categories of preparations the packaging
    of which must be fitted with child-resistant fastenings and/or carry a tactile
    warning of danger
  type: main
- language: fr
  script: Latn
  content: Directive 90/35/CEE de la Commission, du 19 décembre 1989, définissant
    en application de l'article 6 de la directive 88/379/CEE les catégories de préparations
    dont les emballages doivent être munis de fermeture de sécurité pour les enfants
    et/ou d'une indication de danger détectable au toucher
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/35/EWG der Kommission vom 19. Dezember 1989 zur Festlegung
    gemäß Artikel 6 der Richtlinie 88/379/EWG der Kategorien von Zubereitungen,
    deren Verpackungen mit kindergesicherten Verschlüssen versehen sein und/oder
    ein fühlbares Warnzeichen tragen müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 90/35/EØF af 19. december 1989 om fastlæggelse
    i medfør af artikel 6 i direktiv 88/379/EØF af de kategorier af præparater,
    hvis emballage skal være forsynet med børnesikrede lukninger og/eller en fareangivelse,
    der kan opfattes ved berøring
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/35/ΕΟΚ της Επιτροπής της 19ης Δεκεμβρίου
    1989 για τον προσδιορισμό, κατ’εφαρμογή του
    άρθρου 6 της οδηγίας 88/379/ΕΟΚ, των κατηγοριών
    των παρασκευασμάτων των οποίων οι συσκευασίες
    πρέπει να είναι εφοδιασμένες με σύστημα ασφαλείας
    για τα παιδιά ή/και με ανάγλυφη προειδοποίηση
    του κινδύνου
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 90/35/ETY, annettu 19 päivänä joulukuuta 1989,
    määrittelemisestä direktiivin 88/379/ETY 6 artiklan mukaisesti niiden valmisteiden
    luokat, joiden pakkausten sulkimien on oltava lapsille turvallisia ja joiden pakkauksissa
    on oltava näkövammaisille tarkoitettu vaaratunnus
  type: main
- language: it
  script: Latn
  content: Direttiva 90/35/CEE della Commissione, del 19 dicembre 1989, che definisce,
    in applicazione dell'articolo 6 della direttiva 88/379/CEE, le categorie di preparati
    i cui imballaggi devono essere muniti di chiusura di sicurezza per bambini e/o
    di un'indicazione di pericolo avvertibile al tatto
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/35/EEG van de Commissie van 19 december 1989 tot vaststelling,
    in toepassing van artikel 6 van Richtlijn 88/379/EEG, van de categorieën preparaten
    waarvan de verpakking van een kinderveilige sluiting en/of een bij aanraking waarneembare
    gevaarsaanduiding moet zijn voorzien
  type: main
- language: pt
  script: Latn
  content: Directiva 90/35/CEE da Comissão, de 19 de Dezembro de 1989, que define
    nos termos do artigo 6º da Directiva 88/379/CEE as categorias de preparados cujas
    embalagens devem ser munidas de um fecho de segurança para crianças e/ou de
    uma indicação de perigo detectável ao tacto
  type: main
- language: es
  script: Latn
  content: Directiva 90/35/CEE de la Comisión, de 19 de diciembre de 1989, por la
    que se definen, de conformidad con el artículo 6 de la Directiva 88/379/CEE del
    Consejo, las categorías de preparados cuyos envases deben ir provistos de un
    cierre de seguridad para niños y/o de una indicación de peligro que sea detectable
    al tacto
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 90/35/EEG av den 19 december 1989 om fastställande
    i enlighet med artikel 6 i direktiv 88/379/EEG av de typer av preparat (beredningar)
    vilkas förpackningar måste vara försedda med barnsäkra förslutningsanordningar
    och/eller med varningsmärkning som kan uppfattas vid beröring
  type: main
