---
id: EUDecision1978303
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 January 1978 authorizing the French Republic
    not to apply Community treatment to imports of woven fabrics of jute or of other
    textile bast fibres falling within heading No 57.10 of the Common Customs Tariff
    and new sacks and bags, of a kind used for the packing of goods, of jute or of
    other textile bast fibres, falling within subheading 62.03 ex A of the Common
    Customs Tariff, originating in the People's Republic of Bangladesh and in free
    circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/303/CEE: Décision de la Commission, du 16 janvier 1978, autorisant
    la République française à exclure du traitement communautaire les importations
    de tissus de jute ou d''autres fibres textiles libériennes de la position 57.10
    du Tarif douanier commun et les sacs et sachets d''emballage neufs en tissus de
    jute ou d''autres fibres textiles libériennes de la sous-position 62.03 Ex A
    du Tarif douanier commun, originaires de la République populaire du Bangladesh
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Januar 1978, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik Bangladesch stammende und in
    den anderen Mitgliedstaaten im freien Verkehr befindliche Säcke und Beutel zu
    Verpackungszwecken, neu, aus Jutegeweben oder aus Geweben aus anderen textilen
    Bastfasern, der Tarifstelle 62.03 ex A des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 16. januar 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævet stof af jute eller andre
    bastfibre henhørende under pos. 57.10 i den fælles toldtarif og nye sække og
    poser til emballage af jute eller andre bastfibre henhørende under pos. 62.03
    ex A i den fælles toldtarif, som har oprindelse i folkerepublikken Bangladesh
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 gennaio 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario le importazioni di tessuti di
    iuta o di altre fibre tessili liberiane della voce 57.10 della tariffa doganale
    comune e di sacchi e sacchetti da imballaggio nuovi di tessuti di iuta o di altre
    fibre tessili liberiane della voce 62.03 ex A della tariffa doganale comune, originari
    della Repubblica popolare del Bangladesh e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 januari 1978 waarbij de Franse Republiek
    wordt gemachtigd weefsels van jute of van andere bastvezels, van post 57.10 van
    het gemeenschappelijk douanetarief, alsmede nieuwe zakken voor verpakkingsdoeleinden,
    van weefsels van jute of van andere bastvezels, van post 62.03 ex A van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek Bangla Desh en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
