title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 204/2009 of 16 March 2009 amending Council
    Regulation (EC) No 32/2000 as regards the extension of the Community tariff quotas
    for jute and coconut-fibre products and to take account of amendments to Council
    Regulation (EEC) No 2658/87 on the tariff and statistical nomenclature and on
    the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 204/2009 de la Commission du 16 mars 2009 modifiant
    le règlement (CE) n o 32/2000 du Conseil en ce qui concerne la prolongation des
    contingents tarifaires communautaires ouverts pour les produits manufacturés
    de jute et de coco afin de tenir compte des modifications apportées au règlement
    (CEE) n o 2658/87 du Conseil relatif à la nomenclature tarifaire et statistique
    et au tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 204/2009 der Kommission vom 16. März 2009 zur Änderung
    der Verordnung (EG) Nr. 32/2000 des Rates hinsichtlich der Verlängerung der Gemeinschaftszollkontingente
    für Jute- und Kokoserzeugnisse sowie zur Berücksichtigung von Änderungen der
    Verordnung (EWG) Nr. 2658/87 des Rates über die zolltarifliche und statistische
    Nomenklatur sowie den Gemeinsamen Zolltarif
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 204/2009 на Комисията от 16
    март 2009 година за изменение на Регламент (ЕО)
    № 32/2000 на Съвета по отношение на удължаването
    на срока на тарифните квоти на Общността за
    изделия от юта и кокосови влакна и с цел отчитане
    на измененията в Регламент (ЕИО) № 2658/87 на Съвета
    относно тарифната и статистическа номенклатура
    и Общата митническа тарифа
  type: main
- language: cs
  script: Latn
