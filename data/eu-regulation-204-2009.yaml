  script: Latn
  content: Kommissionens förordning (EG) nr 204/2009 av den 16 mars 2009 om ändring
    av rådets förordning (EG) nr 32/2000 när det gäller förlängningen av giltighetstiden
    för gemenskapens tullkvoter för produkter tillverkade av jute och kokosfibrer
    för att beakta ändringar av rådets förordning (EEG) nr 2658/87 om tulltaxe-
