    se mění nařízení Rady (ES) č. 32/2000, pokud jde o prodloužení platnosti
    celních kvót Společenství pro výrobky z juty a kokosových vláken, a s ohledem
    na změny nařízení Rady (EHS) č. 2658/87 o celní a statistické nomenklatuře
    a o společném celním sazebníku
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 204/2009 af 16. marts 2009 om ændring
    af Rådets forordning (EF) nr. 32/2000 for så vidt angår videreførelse af fællesskabstoldkontingenterne
    for varer af jute og kokos og med henblik på at tage højde for ændringerne
    af Rådets forordning (EØF) nr. 2658/87 om told- og statistiknomenklaturen og
    den fælles toldtarif
  type: main
- language: el
  script: Grek
