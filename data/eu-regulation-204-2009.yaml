    dwar in-nomenklatura tat-tariffa u l-istatistika u dwar it-Tariffa Doganali Komuni
    ta' Dwana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 204/2009 van de Commissie van 16 maart 2009 tot wijziging
    van Verordening (EG) nr. 32/2000 van de Raad om de tariefcontingenten voor jute-
    en kokosproducten te verlengen en om rekening te houden met de wijzigingen op
    Verordening (EEG) nr. 2658/87 met betrekking tot de tarief- en statistieknomenclatuur
    en het gemeenschappelijk douanetarief
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 204/2009 z dnia 16 marca 2009 r. zmieniające
    rozporządzenie Rady (WE) nr 32/2000 w odniesieniu do przedłużenia obowiązywania
    wspólnotowych kontyngentów taryfowych na produkty z juty i włókna kokosowego
    oraz uwzględnienia zmian do rozporządzenia Rady (EWG) nr 2658/87 w sprawie nomenklatury
    taryfowej i statystycznej oraz w sprawie Wspólnej Taryfy Celnej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 204/2009 da Comissão, de 16 de Março de 2009 ,
    que altera o Regulamento (CE) n. o 32/2000 do Conselho no que respeita à prorrogação
    dos contingentes pautais comunitários para os produtos manufacturados de juta
    e de fibras de coco, a fim de ter em conta as alterações do Regulamento (CEE)
    n. o 2658/87 do Conselho relativo à nomenclatura pautal e estatística e à pauta
    aduaneira comum
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 204/2009 al Comisiei din 16 martie 2009 de modificare
    a Regulamentului (CE) nr. 32/2000 al Consiliului în ceea ce privește prelungirea
    contingentelor tarifare comunitare pentru produse din iută și fibre de nucă
    de cocos și pentru a se lua în considerare modificările aduse Regulamentului
    (CEE) nr. 2658/87 privind Nomenclatura tarifară și statistică și Tariful Vamal
    Comun
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 204/2009 zo 16. marca 2009 , ktorým sa mení
    a dopĺňa nariadenie Rady (ES) č. 32/2000, pokiaľ ide o predĺženie colných
    kvót Spoločenstva na výrobky z juty a kokosových vlákien, s cieľom zohľadniť
    zmeny a doplnenia nariadenia Rady (EHS) č. 2658/87 o colnej a štatistickej nomenklatúre
    a o Spoločnom colnom sadzobníku
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 204/2009 z dne 16. marca 2009 o spremembi Uredbe
    Sveta (ES) št. 32/2000 v zvezi s podaljšanjem tarifnih kvot Skupnosti za izdelke
    iz jute in kokosovih vlaken ter zaradi upoštevanja sprememb Uredbe Sveta (EGS)
    št. 2658/87 o tarifni in statistični nomenklaturi ter skupni carinski tarifi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 204/2009 de la Comisión, de 16 de marzo de 2009 ,
    por el que se modifica el Reglamento (CE) n o 32/2000 del Consejo por lo que se
    refiere a la prórroga de los contingentes arancelarios comunitarios para los
    productos manufacturados de yute y fibras de coco, y a fin de tener en cuenta
