    kókuszrostból készült termékekre vonatkozó közösségi vámkontingensek
    meghosszabbítása tekintetében és a vám- és statisztikai nómenklatúráról,
    valamint a Közös Vámtarifáról szóló 2658/87/EGK tanácsi rendelet módosításainak
    figyelembevétele érdekében a 32/2000/EK tanácsi rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 204/2009 della Commissione, del 16 marzo 2009 , recante
    modifica del regolamento (CE) n. 32/2000 del Consiglio con riguardo alla proroga
    dei contingenti tariffari comunitari per i prodotti manufatti di iuta e di cocco
    e al fine di tenere conto delle modifiche apportate al regolamento (CEE) n. 2658/87
    del Consiglio relativo alla nomenclatura tariffaria e statistica e alla tariffa
    doganale comune
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 204/2009 ( 2009. gada 16. marts ), ar ko groza
    Padomes Regulu (EK) Nr. 32/2000 attiecībā uz džutas un kokosšķiedru izstrādājumiem
    noteikto Kopienas tarifu kvotu režīma pagarināšanu, lai ņemtu vērā grozījumus
    Padomes Regulā (EEK) Nr. 2658/87 par tarifu un statistikas nomenklatūru un kopējo
    muitas tarifu
  type: main
- language: lt
  script: Latn
  content: 2009 m. kovo 16 d. Komisijos reglamentas (EB) Nr. 204/2009, iš dalies
