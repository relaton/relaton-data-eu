    de fibras textiles sintéticas crudos o blanqueados de la categoría de productos
    n° ex 3 (código 40.0033) originarios de Brasil, beneficiario de las preferencias
    arancelarias previstas por el Reglamento (CEE) n° 3925/86 del Consejo
