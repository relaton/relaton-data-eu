title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2354/87 of 31 July 1987 re-establishing
    the levying of customs duties on woven fabrics of synthetic textile fibres, unbleached
    or bleached, products of category No ex 3 (code 40.0033), originating in Brazil
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2354/87 de la Commission du 31 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles synthétiques écrus ou blanchis, de la catégorie de produits
    n° ex 3 (code 40.0033), originaires du Brésil, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2354/87 der Kommission vom 31. Juli 1987 zur Wiedereinführung
    des Zollsatzes für Gewebe aus synthetischen oder künstlichen Spinnfasern, roh
    oder gebleicht, der Warenkategorie Nr. ex 3 (Kennziffer 40.0033) mit Ursprung
    in Brasilien, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2354/87 af 31. juli 1987 om genindførelse
    af opkrævning af toldafgifter for stoffer, vævet af syntetiske kemofibre, ublegede
    og blegede, henhørende under varekategori nr. ex 3 (kode 40.0033) i den fælles
    toldtarif, som har oprindelse i Brasilien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2354/87 της Επιτροπής
    της 31ης Ιουλίου 1987 περί αποκαταστάσεως της
    εφαρμογής των δασμών για τα υφάσματα εκ συνθετικών
    ινών ή λελευκασμένα, προϊόντα της κατηγορίας
    ex 3 (κωδικός 40.0033) καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3925/86 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2354/87 della Commissione del 31 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche,
    greggi o imbianchiti della categoria di prodotti ex 3 (codice 40.0033), originari
    del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2354/87 van de Commissie van 31 juli 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige stapelvezels, ongebleekt of gebleekt, van
    de categorie van produkten ex 3 (codenummer 40.0033), van oorsprong uit Brazilië,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2354/87 da Comissão de 31 de Julho de 1987 que
