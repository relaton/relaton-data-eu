title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 492/87 of 18 February 1987 amending Regulation
    (EEC) No 548/86 laying down detailed rules for the application of accession compensatory
    amounts and Regulation (EEC) No 594/86 laying down detailed rules for the application
    of accession compensatory amounts applicable to trade in products covered by Regulations
    (EEC) No 3033/80 and (EEC) No 3035/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 492/87 de la Commission du 18 février 1987 modifiant
    le règlement (CEE) n° 548/86 portant modalités d' application des montants
    compensatoires "adhésion" et le règlement (CEE) n° 594/86 portant modalités
    d' application des montants compensatoires "adhésion" applicables aux échanges
    de marchandises relevant des règlements (CEE) n° 3033/80 et (CEE) n° 3035/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 492/87 der Kommission vom 18. Februar 1987 zur Änderung
    der Verordnung (EWG) Nr. 548/86 über Durchführungsvorschriften für die Beitrittsausgleichsbeträge
    sowie der Verordnung (EWG) Nr. 594/86 mit Durchführungsbestimmungen für die
    anwendbaren Beitrittsausgleichsbeträge im Handel mit unter die Verordnungen (EWG)
    Nr. 3033/80 und (EWG) Nr. 3035/80 fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 492/87 af 18. februar 1987 om ændring
    af forordning (EØF) nr. 548/86 om gennemførelsesbestemmelser vedrørende tiltrædelsesudligningsbeløb
    og forordning (EØF) nr. 594/86 om nærmere bestemmelser for anvendelse af tiltrædelsesudligningsbeløb
    ved samhandel med varer, der er omfattet af forordning (EØF) nr. 3033/80 og (EØF)
    nr. 3035/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 492/87 της Επιτροπής
    της 18ης Φεβρουαρίου 1987 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 548/86 σχετικά με τις λεπτομέρειες
    εφαρμογής των εξισωτικών ποσών προσχώρησης
    και τον κανονισμό (ΕΟΚ) αριθ. 594/86 σχετικά με
    λεπτομέρειες εφαρμογής των εξισωτικών ποσών
    προσχώρησης που εφαρμόζονται στις συναλλαγές
    εμπορευμάτων που υπόκεινται στους κανονισμούς
    (ΕΟΚ) αριθ. 3033/80 και (ΕΟΚ) αριθ. 3035/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 492/87 della Commissione del 18 febbraio 1987 che
    modifica il regolamento (CEE) n. 548/86 che stabilisce le modalità d' applicazione
    degli importi compensativi adesione e il regolamento (CEE) n. 594/86 recante modalità
    di applicazione degli importi compensativi adesione applicabili agli scambi di
    merci disciplinate dai regolamenti (CEE) n. 3033/80 e (CEE) n. 3035/80
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 492/87 van de Commissie van 18 februari 1987 tot
    wijziging van Verordening (EEG) nr. 548/86 houdende nadere bepalingen voor de
    toepassing van de compenserende bedragen ,,toetreding" en van Verordening (EEG)
    nr. 594/86 houdende uitvoeringsbepalingen inzake de compenserende bedragen ,,toetreding"
    die van toepassing zijn in het handelsverkeer van goederen die onder de Verordeningen
    (EEG) nr. 3033/80 en (EEG) nr. 3035/80 vallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 492/87 da Comissão de 18 de Fevereiro de 1987 que
    altera o Regulamento (CEE) n.° 548/86 relativo às modalidades de aplicação
    dos montantes compensatórios de adesão e o Regulamento (CEE) n.° 594/86 que
    estabelece as regras de execução dos montantes compensatórios de adesão aplicáveis
    às trocas comerciais de mercadorias que são objecto dos Regulamentos (CEE) n.°
    3033/80 e (CEE) n.° 3035/80
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 492/87 de la Comisión de 18 de febrero de 1987 por
    el que se modifican los Reglamentos (CEE) n° 548/86, relativo a las modalidades
    de aplicación de los montantes compensatorios de adhesión, y n° 594/86, por
    el que se establecen las modalidades de aplicación de los montantes compensatorios
    de adhesión aplicables a los intercambios de mercancías a que se refieren los
    Reglamentos (CEE) n° 3033/80 y n° 3035/80
  type: main
