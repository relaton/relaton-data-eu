  content: Council Regulation (EC) No 1223/98 of 4 June 1998 amending Regulation (EEC)
    No 1408/71 on the application of social security schemes to employed persons,
    to self-employed persons and to members of their families moving within the Community
    and Regulation (EEC) No 574/72 laying down the procedure for implementing Regulation
    (EEC) No 1408/71
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1223/98 du Conseil du 4 juin 1998 modifiant le règlement
