title:
- language: en
  script: Latn
  content: Council Decision (EU) 2020/245 of 17 February 2020 on the position to be
    taken on behalf of the European Union within the Partnership Council established
    by the Comprehensive and Enhanced Partnership Agreement between the European Union
    and the European Atomic Energy Community and their Member States, of the one part,
    and the Republic of Armenia, of the other part, as regards the adoption of the
    Rules of Procedure of the Partnership Council and those of the Partnership Committee,
    subcommittees and other bodies set up by the Partnership Council, and the establishment
    of the list of Sub‐Committees, for the application of that Agreement with the
    exception of Title II thereof
  type: main
