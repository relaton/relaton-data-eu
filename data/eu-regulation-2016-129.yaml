---
id: EURegulation2016129
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/129 of 1 February 2016 amending
    Regulation (EU) No 37/2010 as regards the substance ‘Purified semi-solid extract
    from Humulus lupulus L. containing approximately 48 % of beta acids (as potassium
    salts)’
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/129 de la Commission du 1er février
    2016 modifiant le règlement (UE) n° 37/2010 en ce qui concerne la substance
    «extrait semi-solide purifié de Humulus lupulus L. contenant approximativement
    48 % de béta-acides (tels que des sels de potassium)»
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/129 der Kommission vom 1. Februar 2016
    zur Änderung der Verordnung (EU) Nr. 37/2010 hinsichtlich des Stoffs „Gereinigter
    halbfester Extrakt aus Humulus lupulus L. mit ca. 48 % Betasäuren (als Kaliumsalze)“
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/129 на Комисията
    от 1 февруари 2016 година за изменение на Регламент
    (ЕС) № 37/2010 по отношение на субстанцията „пречистен
    полутвърд екстракт от Humulus lupulus L., съдържащ
    приблизително 48 % бета-горчиви киселини (като
    калиеви соли)“
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/129 ze dne 1. února 2016, kterým
    se mění nařízení (EU) č. 37/2010, pokud jde o látku „přečištěný
    polotuhý výtažek z Humulus lupulus L. obsahující přibližně 48 % β-hořkých
    kyselin (jako draselné soli)“
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/129 af 1. februar 2016
    om ændring af forordning (EU) nr. 37/2010 for så vidt angår stoffet »renset,
    halvfast ekstrakt fra Humulus lupulus L. med et indhold af ca. 48 % betasyrer
    (som kaliumsalte)«
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/129 της Επιτροπής,
    της 1ης Φεβρουαρίου 2016, για την τροποποίηση
    του κανονισμού (ΕΕ) αριθ. 37/2010 όσον αφορά την
    ουσία «κεκαθαρμένο ημιστερεό εκχύλισμα από
    Humulus lupulus L. περιεκτικότητας περίπου 48 % σε βήτα
    οξέα (ως άλατα καλίου)»
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/129, 1. veebruar 2016, millega muudetakse
    määrust (EL) nr 37/2010 seoses toimeainega „Taime Humulus lupulus L. puhastatud
    pooltahke ekstrakt, mis sisaldab ligikaudu 48 % beetahappeid (kaaliumsooladena)”
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2016/129, annettu 1 päivänä
    helmikuuta 2016, asetuksen (EU) N:o 37/2010 muuttamisesta siltä osin kuin kyse
    on aineesta ”puhdistettu puolikiinteä Humulus lupulus L. -uute, joka sisältää
    arviolta 48 prosenttia beetahappoja (kaliumsuoloina)”
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/129 оd 1. veljače 2016. o izmjeni
    Uredbe (EU) br. 37/2010 u pogledu tvari „pročišćeni polukruti ekstrakt biljke
    Humulus lupulus L. koji sadržava oko 48 % beta kiselina (kao što su kalijeve
    soli)”
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/129 végrehajtási rendelete (2016. február 1.)
    a 37/2010/EU rendeletnek a „Tisztított félkemény Humulus lupulus L. kivonat,
    amely körülbelül 48 % béta-savat tartalmaz (káliumsók formájában)” anyag
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/129 della Commissione, del 1° febbraio
    2016, che modifica il regolamento (UE) n. 37/2010 per quanto riguarda la sostanza
    «Estratto purificato semisolido di Humulus lupulus L. contenente approssimativamente
    il 48 % di acidi beta (come sali di potassio)»
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/129 (2016. gada 1. februāris),
    ar ko attiecībā uz vielu “attīrīts pusciets Humulus lupulus L. ekstrakts,
    kura sastāvā ir aptuveni 48 % beta skābju (kālija sāļu veidā)”, groza
    Regulu (ES) Nr. 37/2010
  type: main
- language: lt
  script: Latn
  content: 2016 m. vasario 1 d. Komisijos įgyvendinimo reglamentas (ES) 2016/129,
    kuriuo dėl medžiagos – išgryninto puskiečio Humulus lupulus L. ekstrakto,
    kurio sudėtyje yra apie 48 % beta rūgščių (kalio druskų), iš dalies keičiamas
    Reglamentas (ES) Nr. 37/2010
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/129 tal-1 ta'
    Frar 2016 li jemenda r-Regolament (UE) Nru 37/2010 f'dak li għandu x'jaqsam mas-sustanza
    “Estratt semisolidu purifikat minn Humulus lupulus L. li fih madwar 48 % ta'
    aċidi beta (bħala melħ tal-potassju)”
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/129 van de Commissie van 1 februari 2016
    tot wijziging van Verordening (EU) nr. 37/2010 wat de stof „gezuiverd pasteus
    extract van Humulus lupulus L. met ongeveer 48 % bètazuren (zoals kaliumzouten)”
    betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/129 z dnia 1 lutego 2016 r.
    zmieniające rozporządzenie (UE) nr 37/2010 w odniesieniu do substancji „oczyszczony
    wyciąg o konsystencji półstałej z Humulus lupulus L. zawierający około 48
    % beta-kwasów (w postaci soli potasowych)”
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/129 da Comissão, de 1 de fevereiro
    de 2016, que altera o Regulamento (UE) n.° 37/2010 no que se refere à substância
    «Extrato semissólido purificado de Humulus lupulus L. contendo aproximadamente
    48 % de ácidos beta (sob a forma de sais de potássio)»
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/129 al Comisiei din 1 februarie
    2016 de modificare a Regulamentului (UE) nr. 37/2010 în ceea ce privește substanța
    „extras purificat semisolid de Humulus lupulus L. care conține aproximativ
    48 % beta acizi (sub formă de săruri de potasiu)”
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/129 z 1. februára 2016, ktorým
    sa mení nariadenie (EÚ) č. 37/2010, pokiaľ ide o látku „Purifikovaný polotuhý
    výťažok z Humulus lupulus L. s obsahom približne 48 % betakyselín (vo forme
    draselných solí)“
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/129 z dne 1. februarja 2016 o spremembi
    Uredbe (EU) št. 37/2010 glede snovi „prečiščeni, poltekoči ekstrakt navadnega
    hmelja (Humulus lupulus L.), ki vsebuje približno 48 % beta kislin (v obliki
    kalijevih soli)“
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/129 de la Comisión, de 1 de febrero
    de 2016, por el que se modifica el Reglamento (UE) n° 37/2010 en lo que respecta
    a la sustancia «Extracto semisólido purificado de Humulus lupulus L. que contenga
    aproximadamente un 48 % de ácidos beta (como sales de potasio)»
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/129 av den 1 februari
    2016 om ändring av förordning (EU) nr 37/2010 vad gäller substansen renat,
    halvfast extrakt från Humulus lupulus L. som innehåller ungefär 48 procent
    betasyra (som kaliumsalt)
  type: main
