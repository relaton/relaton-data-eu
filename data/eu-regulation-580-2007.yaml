    az 1994. évi Általános Vám- és Kereskedelmi Egyezmény (1994. évi GATT)
    XXVIII. cikkének megfelelően kölcsönösen elfogadott jegyzőkönyv formájában
    létrejött megállapodások végrehajtásáról, továbbá a vám- és a statisztikai
