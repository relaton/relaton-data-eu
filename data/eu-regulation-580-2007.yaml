title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 580/2007 of 29 May 2007 concerning the implementation
    of Agreements in the form of Agreed Minutes between the European Community and
    Brazil, and between the European Community and Thailand pursuant to Article XXVIII
    of General Agreement on Tariffs and Trade 1994 (GATT 1994), amending and supplementing
    Annex I to Regulation (EEC) No 2658/87 on the tariff and statistical nomenclature
    and on the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 580/2007 du Conseil du 29 mai 2007 concernant la mise
    en œuvre des accords sous forme de procès-verbaux agréés entre la Communauté
    européenne et le Brésil, et entre la Communauté européenne et la Thaïlande
    en vertu de l'article XXVIII de l'accord général sur les tarifs douaniers et
    le commerce (GATT 1994) et modifiant et complétant l'annexe I du règlement (CEE)
    n o 2658/87 relatif à la nomenclature tarifaire et statistique et au tarif douanier
    commun
  type: main
- language: de
