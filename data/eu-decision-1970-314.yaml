title:
- language: en
  script: Latn
  content: '70/314/EEC: Commission Decision of 3 June 1970 authorizing the Federal
    Republic of Germany to approve for marketing seed of Pseudotsuga menziesii (Mirb.)
    Franco., Picea sitchensis Trautv. and May., and Pinus strobus L., satisfying less
    stringent requirements (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/314/CEE: Décision de la Commission, du 3 juin 1970, autorisant la
    République fédérale d''Allemagne à admettre à la commercialisation des semences
    de Pseudotsuga menziesii (Mirb.) Franco., de Picea sitchensis Trautv. et Mey.,
    et de Pinus strobus L., soumises à des exigences réduites (Le texte en langue
    allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/314/EWG: Entscheidung der Kommission vom 3. Juni 1970, mit der die
    Bundesrepublik Deutschland ermächtigt wird, Saatgut von Pseudotsuga menziesii
    (Mirb.) Franco., von Picea sitchensis Trautv. und Mey. und von Pinus strobus L.
    mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen (Nur der deutsche
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '70/314/EØF: Kommissionens beslutning af 3. juni 1970 om bemyndigelse
    af Forbundsrepublikken Tyskland til at tillade handel med frø af Pseudotsuga
    menziesii (Mirb.) Franco., og af Picea sitchensis, Trautv. og Mey., og af Pinus
    strobus L., der opfylder mindre strenge krav (Kun den tyske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '70/314/CEE: Decisione della Commissione, del 3 giugno 1970, che autorizza
