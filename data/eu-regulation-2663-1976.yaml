title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2663/76 of 29 October 1976 re-establishing
    the levying of customs duties on cotton yarn, not put up for retail sale, multiple
    or cabled, finished, etc., falling within subheading 55.05 A, originating in developing
    countries to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3002/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2663/76 de la Commission, du 29 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux fils de
    coton non conditionnés pour la vente au détail, retors ou câblés, apprêtés,
    etc., de la sous-position 55.05 A du tarif douanier commun, originaires des pays
    en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3002/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2663/76 der Kommission vom 29. Oktober 1976 über
    die Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen
    für den Einzelverkauf, gezwirnt und appretiert, usw., der Tarifstelle 55.05 A,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3002/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2663/76 af 29. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for garn af bomuld, ikke i detailsalgsoplægninger,
    garn, flertrådet eller kabelslået, appreteret, etc., under underposition 55.05
    A, som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der
    er fastsat i Rådets forordning (EØF) nr. 3002/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2663/76 della Commissione, del 29 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai filati di cotone non
    preparati per la vendita al minuto, ritorti o ritorti su ritorto (cablés), ecc.,
    della sottovoce doganale 55.05 A, originari dei paesi in via di sviluppo, beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3002/75 del Consiglio,
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2663/76 van de Commissie van 29 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op garens van
    katoen, niet gereed voor de verkoop in het klein, getwijnd of gekabeld, geappreteerd,
    enz., van tariefpost 55.05 A, van oorsprong uit de ontwikkelingslanden ten behoeve
    waarvan bij Verordening (EEG) nr. 3002/75 van de Raad van 17 november 1975 algemene
    tariefpreferenties werden geopend
  type: main
