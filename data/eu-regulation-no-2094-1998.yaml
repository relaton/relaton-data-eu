  script: Latn
  content: Commission Regulation (EC) No 2094/98 of 30 September 1998 amending Regulation
    (EC) No 1501/95 laying down certain detailed rules for the application of Council
    Regulation (EEC) No 1766/92 on the granting of export refunds on cereals and the
    measures to be taken in the event of disturbance on the market for cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2094/98 de la Commission du 30 septembre 1998 modifiant
    le règlement (CE) nº 1501/95 établissant certaines modalités d'application
    du règlement (CEE) nº 1766/92 du Conseil en ce qui concerne l'octroi des restitutions
    à l'exportation ainsi que les mesures à prendre, en cas de perturbation, dans
    le secteur des céréales
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2094/98 der Kommission vom 30. September 1998 zur Änderung
    der Verordnung (EG) Nr. 1501/95 mit Durchführungsbestimmungen zur Verordnung
    (EWG) Nr. 1766/92 des Rates hinsichtlich der Gewährung von Ausfuhrerstattungen
    und zur Festlegung der bei Störungen im Getreidesektor zu treffenden Maßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2094/98 af 30. september 1998 om ændring
