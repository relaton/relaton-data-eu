title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1906/70 de la Commission, du 22 septembre 1970, déterminant
    les montants des éléments mobiles et les droits additionnels applicables, pendant
    le quatrième trimestre de l'année 1970, à l'importation dans la Communauté
    des marchandises relevant du règlement (CEE) n 1059/69 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1906/70 der Kommission vom 22. September 1970 zur
    Festsetzung der Höhe der im vierten Vierteljahr 1970 bei der Einfuhr der unter
    die Verordnung (EWG) Nr. 1059/69 des Rates fallenden Waren in die Gemeinschaft
    anwendbaren beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1906/70 della Commissione, del 22 settembre 1970,
    che determina gli importi degli elementi mobili e i dazi addizionali applicabili
    durante il quarto trimestre 1970 all'importazione nella Comunità delle merci
    cui si applica il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1906/70 van de Commissie van 22 september 1970 tot
    vaststelling van bedragen der gedurende het vierde kwartaal van 1970 bij invoer
    in de Gemeenschap van onder Verordening (EEG) nr. 1059/69 van de Raad vallende
    goederen toe te passen variabele elementen en aanvullende invoerrechten
  type: main
