title:
- language: en
  script: Latn
  content: '83/299/EEC: Commission Decision of 7 June 1983 repealing Decision 81/628/EEC
    on the duty-free importation of goods intended to be distributed or made available
    free of charge to victims of the earthquake which occurred in June 1981 in Sicily
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/299/CEE: Décision de la Commission du 7 juin 1983 portant abrogation
    de la décision 81/628/CEE relative à l''admission en franchise des droits à
    l''importation de marchandises destinées à être distribuées ou mises gratuitement
    à la disposition des victimes du tremblement de terre survenu en Sicile en juin
    1981 (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/299/EWG: Entscheidung der Kommission vom 7. Juni 1983 zur Aufhebung
    der Entscheidung 81/628/EWG der Kommission über die Befreiung von Eingangsabgaben
    für bestimmte Waren, die an die von dem im Juni 1981 in Sizilien aufgetretenen
    Erdbeben betroffenen Opfer unentgeltlich verteilt oder ihnen unentgeltlich zur
    Verfügung gestellt werden sollen (Nur der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/299/EØF: Kommissionens beslutning af 7. juni 1983 om ophævelse af
    Kommissionens beslutning 81/628/EØF om fritagelse for told ved indførsel af
    varer, der er bestemt til gratis udlevering til eller gratis bliver stillet til
    rådighed for ofrene for jordskælvene i juni 1981 på Sicilien (Kun den italienske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/299/ΕΟΚ: Απόφαση της Επιτροπής της 7ης Ιουνίου
    1983 περί καταργήσεως της αποφάσεως 81/628/ΕΟΚ περί
    της εισαγωγής, με ατέλεια δασμών, των εμπορευμάτων
    τα οποία προορίζονται να διανεμηθούν ή να διατεθούν
    δωρεάν στα θύματα του σεισμού που έπληξε τη
    Σικελία τον Ιούνιο του 1981 (Το κείμενο στην ιταλική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/299/CEE: Decisione della Commissione del 7 giugno 1983 recante abrogazione
    della decisione 81/628/CEE relativa all''ammissione in franchigia dai diritti
    all''importazione di merci destinate ad essere distribuite o messe gratuitamente
    a disposizione delle vittime del terremoto avvenuto in Sicilia nel giugno 1981
    (Il testo in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/299/EEG: Beschikking van de Commissie van 7 juni 1983 houdende intrekking
    van Beschikking 81/628/EEG betreffende de invoer met vrijstelling van rechten
    bij invoer van goederen, bestemd om gratis te worden verstrekt of ter beschikking
    gesteld aan de slachtoffers van de in juni 1981 voorgevallen aardbeving op Sicilië
    (Slechts de tekst in de Italiaanse taal is authentiek)'
