    de gebruiksdoeleinden van bepaalde stoffen die worden gebruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1533/2000 z dnia 13 lipca 2000 r. zmieniające
    rozporządzenie (WE) nr 1485/96 ustanawiające szczegółowe zasady wykonania
    dyrektywy Rady 92/109/EWG w zakresie składania przez klientów oświadczeń dotyczących
    specjalnego wykorzystania niektórych substancji używanych do nielegalnego wytwarzania
    środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1533/2000 da Comissão, de 13 de Julho de 2000, que
    altera o Regulamento (CE) n.o 1485/96 que estabelece normas de execução da Directiva
    92/109/CEE do Conselho no que respeita à declaração de clientes quanto aos
    fins específicos de determinadas substâncias utilizadas na produção ilegal
    de estupefacientes e psicotrópicos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1533/2000 z 13. júla 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1485/96, ktorým sa ustanovujú podrobné pravidlá
    uplatňovania smernice Rady 92/109/EHS so zreteľom na vyhlásenia zákazníkov
    o použití určitých látok používaných pri nedovolenej výrobe omamných
    látok a psychotropných látok
  type: main
