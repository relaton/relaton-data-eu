    ta' Direttiva tal-Kunsill 92/109/KEE, fejn għandhom x'jaqsmu dikjarazzjonijiet
    ta' użu speċifiku li għandhom x'jaqsmu ma' ċerti sustanzi użati fil-manifattura
    illeċità ta' drogi narkotiċi u sustanzi psikotropiċi (Test b'rilevanza ŻEE)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1533/2000 van de Commissie van 13 juli 2000 houdende
