title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1533/2000 of 13 July 2000 amending Regulation
    (EC) No 1485/96 laying down detailed rules for the application of Council Directive
    92/109/EEC, as regards customer declarations of specific use relating to certain
    substances used in the illicit manufacture of narcotic drugs and psychotropic
    substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1533/2000 de la Commission du 13 juillet 2000 modifiant
    le règlement (CE) nº 1485/96 portant modalités d'application de la directive
    92/109/CEE du Conseil en ce qui concerne les déclarations du client qui spécifient
    les usages de certaines substances utilisées dans la fabrication illicite de
    stupéfiants et de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1533/2000 der Kommission vom 13. Juli 2000 zur Änderung
    der Verordnung (EG) Nr. 1485/96 über Durchführungsverordnungen zur Richtlinie
    92/109/EWG des Rates betreffend Erklärungen des Kunden über den Verwendungszweck
    von Stoffen, die zur unerlaubten Herstellung von Suchtstoffen und psychotropen
    Stoffen verwendet werden
  type: main
- language: cs
  script: Latn
