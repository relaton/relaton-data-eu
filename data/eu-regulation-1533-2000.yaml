  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1533/2000 (2000. gada 13. jūlijs), ar kuru groza
    Regulu (EK) Nr. 1485/96, ar ko nosaka sīki izstrādātus noteikumus Padomes Direktīvas
    92/109/EEK piemērošanai attiecībā uz klientu deklarācijām par dažu tādu
    vielu konkrētu izmantošanu, kuras lieto narkotisko un psihotropo vielu nelikumīgai
    izgatavošanai
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 13 d. Komisijos reglamentas (EB) Nr. 1533/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 1485/96, nustatantį išsamias Tarybos direktyvos
    92/109/EEB taikymo taisykles dėl pirkėjo deklaracijos apie konkretų tam tikrų
    medžiagų, naudojamų neteisėtai narkotinių ir psichotropinių medžiagų gamybai,
    panaudojimą pateikimo
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru. 1533/2000 tat-13 ta' Lulju 2000
