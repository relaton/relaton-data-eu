    (CE) n. 1251/1999 del Consiglio che istituisce un regime di sostegno ai produttori
    di taluni seminativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1796/2000 van de Commissie van 22 augustus 2000 houdende
