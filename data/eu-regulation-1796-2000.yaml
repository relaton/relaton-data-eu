    nº 2316/1999 portant modalités d'application du règlement (CE) nº 1251/1999
    du Conseil, instituant un régime de soutien aux producteurs de certaines cultures
    arables
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1796/2000 der Kommission vom 22. August 2000 zur Abweichung
