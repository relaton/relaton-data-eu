title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1796/2000 of 22 August 2000 derogating, with
    regard to set-aside in Sweden, from Regulation (EC) No 2316/1999 laying down detailed
    rules for the application of Council Regulation (EC) No 1251/1999 establishing
    a support system for producers of certain arable crops
  type: main
- language: fr
  script: Latn
