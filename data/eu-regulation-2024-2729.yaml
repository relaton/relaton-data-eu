- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2729 of 22 October 2024 authorising
    an exemption pursuant to Regulation (EU) 2024/573 of the European Parliament and
    of the Council, with regard to the use of fluorinated greenhouse gases in certain
    environmental simulation devices, laboratory spray-drying or freeze-drying equipment,
    and laboratory centrifuges
  type: main
- language: fr
  script: Latn
