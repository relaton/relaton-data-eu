    2024 autorisant une exemption conformément au règlement (UE) 2024/573 du Parlement
    européen et du Conseil en ce qui concerne l’utilisation de gaz à effet de
    serre fluorés dans certains dispositifs de simulation environnementale, dans
    les équipements de séchage par pulvérisation ou de lyophilisation en laboratoire
    et dans les centrifugeuses de laboratoire
  type: main
- language: de
  script: Latn
