- language: en
  script: Latn
  content: Regulation (EEC) No 3566/73 of the Commission of 20 December 1973 determining
    the amounts of the variable components and compensatory amounts, and the additional
    duties applicable, during the first quarter of 1974 on importation of goods covered
    by Regulation (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3566/73 de la Commission, du 20 décembre 1973, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le premier trimestre de l'année
    1974, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3566/73 der Kommission vom 20. Dezember 1973 zur Festsetzung
    der Höhe der im ersten Vierteljahr 1974 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3566/73 af 20. december 1973 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    varer henhørende under forordning (EØF) nr. 1059/69 i første kvartal 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3566/73 della Commissione, del 20 dicembre 1973, che
    determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabli all'importazione, per il primo trimestre 1974, delle
    merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3566/73 van de Commissie van 20 december 1973 tot
    vaststelling van de bedragen der gedurende het eerste kwartaal van 1974 bij invoer
    van onder Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele
    elementen en compenserende heffingen alsmede aanvullende invoerrechten
