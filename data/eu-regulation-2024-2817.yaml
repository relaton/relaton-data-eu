    Amerike na seznamih tretjih držav, njihovih ozemelj ali območij, s katerih je
    dovoljen vstop pošiljk perutnine, zarodnega materiala perutnine ter svežega
    mesa perutnine in pernate divjadi v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/2817 de la Comisión, de 29 de octubre
