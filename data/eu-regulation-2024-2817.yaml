    ide o zápisy týkajúce sa Spojených štátov amerických v zoznamoch tretích
    krajín, území alebo ich pásiem, z ktorých sa povoľuje vstup zásielok hydiny,
    zárodočných produktov hydiny a čerstvého mäsa z hydiny a pernatej zveri
    do Únie
  type: main
- language: sl
  script: Latn
