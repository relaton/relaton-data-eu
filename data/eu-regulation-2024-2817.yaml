    valstu, teritoriju vai to zonu sarakstos, no kurām Savienībā atļauts ievest
    mājputnu un mājputnu reproduktīvo produktu un svaigas mājputnu un medījamo
    putnu gaļas sūtījumus, groza Īstenošanas regulas (ES) 2021/404 V un XIV pielikumu
  type: main
