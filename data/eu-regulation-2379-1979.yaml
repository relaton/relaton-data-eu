  content: Council Regulation (EEC) No 2379/79 of 29 October 1979 fixing for the 1979/80
    marketing year the representative market price and the threshold price for olive
    oil and the percentage of the consumption aid intended to promote the consumption
    of olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2379/79 du Conseil, du 29 octobre 1979, fixant, pour
    la campagne de commercialisation 1979/1980, le prix représentatif de marché
    et le prix de seuil de l' huile d' olive, ainsi que le pourcentage de l' aide
    à la consommation destinée à la promotion de la consommation d' huile d' olive
  type: main
- language: de
  script: Latn
