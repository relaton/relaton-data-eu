    des Prozentsatzes der Verbrauchsbeihilfe zur Förderung des Olivenölverbrauchs
    für das Wirtschaftsjahr 1979/80
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2379/79 af 29. oktober 1979 om fastsættelse
