    gewonnen aus Trichoderma citrinoviride Bisset (IM SD142), als Zusatzstoff in Futtermitteln
    für Masthühner, Mastgeflügelarten von geringerer wirtschaftlicher Bedeutung
    sowie für Absetzferkel und zur Änderung der Verordnungen (EG) Nr. 2148/2004
    und (EG) Nr. 1520/2007 (Zulassungsinhaber: Huvepharma NV)'
