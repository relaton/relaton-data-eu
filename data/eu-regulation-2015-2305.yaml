title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/2305 of 10 December 2015 concerning
    the authorisation of a preparation of endo-1,4-beta-glucanase (EC 3.2.1.4) produced
    by Trichoderma citrinoviride Bisset (IM SD142) as a feed additive for chickens
    for fattening, minor poultry species for fattening and weaned piglets, and amending
    Regulations (EC) No 2148/2004 and (EC) No 1520/2007 (holder of authorisation Huvepharma
    NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2015/2305 de la Commission du 10 décembre
    2015 concernant l''autorisation de la préparation d''endo-1,4-bêta-glucanase
    (EC 3.2.1.4) produite par Trichoderma citrinoviride Bisset (IM SD142) en tant
    qu''additif pour l''alimentation des poulets d''engraissement, des espèces mineures
    de volailles destinées à l''engraissement et des porcelets sevrés, et modifiant
    les règlements (CE) n° 2148/2004 et (CE) n° 1520/2007 (titulaire de l''autorisation:
    Huvepharma NV)'
  type: main
