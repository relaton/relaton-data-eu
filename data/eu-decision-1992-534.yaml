title:
- language: en
  script: Latn
  content: '92/534/EEC: Commission Decision of 17 November 1992 adopting the 1993
    plan allocating to the Member States resources to be charged to the 1993 budget
    year for the supply of food from intervention stocks for the benefit of the most
    deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '92/534/CEE: Décision de la Commission, du 17 novembre 1992, adoptant
    le plan de 1993 portant attribution aux Etats membres de ressources imputables
    à l'' exercice 1993 pour l'' exécution des fournitures de denrées alimentaires
    provenant des stocks d'' intervention au bénéfice des personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '92/534/EWG: Entscheidung der Kommission vom 17. November 1992 zur Annahme
    des Plans für 1993 über die Bewilligung von Mitteln, die den Mitgliedstaaten
    für die Lieferung von Nahrungsmitteln aus Interventionsbeständen zur Verteilung
    an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr 1993 zu verbuchen
    sind'
  type: main
- language: da
  script: Latn
  content: '92/534/EØF: Kommissionens beslutning af 17. november 1992 om vedtagelse
    af 1993-planen for tildeling til medlemsstaterne af midler, der skal afholdes
    over 1993-budgettet, og som skal dække udgifterne til levering af levnedsmidler
    fra interventionslagre til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '92/534/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
    Νοεμβρίου 1992 για την έγκριση του προγράμματος
    1993 για την κατανομή στα κράτη μέλη των πόρων
    που θα καταλογισθούν στο έτος προϋπολογισμού
    1993, για την παροχή τροφίμων που προέρχονται
    από τα αποθέματα παρέμβασης στα πιο άπορα άτομα
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '92/534/CEE: Decisione della Commissione, del 17 novembre 1992, che approva
    per il 1993 il piano di ripartizione agli Stati membri delle risorse da imputare
    all'' esercizio finanziario 1993 per l'' esecuzione delle forniture di derrate
    alimentari provenienti dalle scorte d'' intervento a favore degli indigenti nella
    Comunità'
  type: main
- language: nl
  script: Latn
  content: '92/534/EEG: Beschikking van de Commissie van 17 november 1992 tot vaststelling
