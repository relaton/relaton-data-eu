    1993 te boeken financiële middelen voor de levering van levensmiddelen uit interventievoorraden
    aan de meest hulpbehoevenden in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '92/534/CEE: Decisão do Comissão, de 17 de Novembro de 1992, que adopta
    o plano para 1993 que atribui aos Estados-membros recursos, a incluir no exercício
    orçamental de 1993, para o fornecimento de géneros alimentícios provenientes
    das existências de intervenção a favor das pessoas mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '92/534/CEE: Decisión de la Comisión, de 17 de noviembre de 1992, por
