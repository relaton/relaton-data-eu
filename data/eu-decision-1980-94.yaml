title:
- language: en
  script: Latn
  content: '80/94/EEC: Commission Decision of 18 December 1979 on the granting by
    the Guidance Section of the EAGGF to the French Republic of a payment on account
    in respect of expenditure incurred during 1978 on aids and premiums relating to
    the modernization of farms (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/94/CEE: Décision de la Commission, du 18 décembre 1979, relative
    au versement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", à la République française d''un acompte sur les dépenses
    effectuées pendant l''année 1978 pour les aides et primes relatives à la modernisation
    des exploitations agricoles (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/94/EWG: Entscheidung der Kommission vom 18. Dezember 1979 über die
    Zahlung eines Abschlags durch den EAGFL, Abteilung Ausrichtung, für die im Jahr
    1978 zur Modernisierung landwirtschaftlicher Betriebe an Beihilfen und Prämien
    getätigten Ausgaben an die Französische Republik (Nur der französische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/94/EØF: Kommissionens beslutning af 18. december 1979 om udbetaling
    gennem EUGFL, udviklingssektionen, til Den franske Republik af et acontobeløb
    for de udgifter, som er afholdt i løbet af året 1978 til støtte og præmier
    vedrørende modernisering af landbrugsbedrifter (Kun den franske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/94/CEE: Decisione della Commissione, del 18 dicembre 1979, relativa
    al versamento da parte del FEAOG, sezione orientamento, alla Repubblica francese
    di un acconto sulle spese effettuate durante il 1978 per gli aiuti ed i premi
    relativi all''ammodernamento delle aziende agricole (Il testo in lingua francese
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/94/EEG: Beschikking van de Commissie van 18 december 1979 inzake de
    betaling door het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van een
    voorschot in verband met de gedurende het jaar 1978 gedane uitgaven voor de steun
    en premies met betrekking tot de modernisering van landbouwbedrijven (Slechts
    de tekst in de Franse taal is authentiek)'
