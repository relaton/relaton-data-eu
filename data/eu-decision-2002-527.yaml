    történt)
  type: main
- language: it
  script: Latn
  content: '2002/527/CE: Decisione della Commissione, del 27 giugno 2002, che modifica,
    per l''ex Repubblica iugoslava di Macedonia, la decisione 97/252/CE che fissa
    gli elenchi provvisori di stabilimenti di paesi terzi dai quali gli Stati membri
    autorizzano le importazioni di latte e di prodotti a base di latte destinati al
    consumo umano (Testo rilevante ai fini del SEE) [notificata con il numero C(2002)
    2301]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2002. gada 27. jūnijs), ar kuru attiecībā uz bijušo
    Dienvidslāvijas Maķedonijas Republiku groza Lēmumu 97/252/EK, ar ko izveido
    to trešo valstu uzņēmumu pagaidu sarakstus, no kuriem dalībvalstis atļauj
    importēt pienu un piena produktus, kas paredzēti lietošanai pārtikā (izziņots
    ar dokumenta numuru C(2002) 2301)
  type: main
- language: lt
  script: Latn
  content: 2002 m. birželio 27 d. Komisijos sprendimas, iš dalies keičiantis Sprendimo
    97/252/EB, pateikiančio laikinus trečiųjų šalių įmonių, iš kurių valstybės
    narės leidžia importuoti žmonėms vartoti skirtą pieną ir pieno produktus,
    sąrašus, taikymą Buvusiajai Jugoslavijos Respublikai Makedonijai (praneštas
    dokumentu Nr. C(2002) 2301)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-27 ta’ Ġunju 2002 li temenda d-Deċiżjoni
