title:
- language: en
  script: Latn
  content: '2002/527/EC: Commission Decision of 27 June 2002 amending Decision 97/252/EC
    drawing up provisional lists of third country establishments from which the Member
    States authorise imports of milk and milk products for human consumption, with
    respect to the former Yugoslav Republic of Macedonia (Text with EEA relevance)
    (notified under document number C(2002) 2301)'
  type: main
- language: fr
  script: Latn
  content: '2002/527/CE: Décision de la Commission du 27 juin 2002 modifiant la décision
    97/252/CE établissant les listes provisoires d''établissements de pays tiers
    en provenance desquels les États membres autorisent les importations de lait
    et de produits à base de lait destinés à la consommation humaine, en ce qui
    concerne l''ancienne République yougoslave de Macédoine (Texte présentant de
    l''intérêt pour l''EEE) [notifiée sous le numéro C(2002) 2301]'
  type: main
- language: de
  script: Latn
  content: '2002/527/EG: Entscheidung der Kommission vom 27. Juni 2002 zur Änderung
    der Entscheidung 97/252/EG zur Aufstellung der vorläufigen Listen der Drittlandsbetriebe,
