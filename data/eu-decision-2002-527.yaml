    auf Milchbasis zulassen, hinsichtlich der ehemaligen jugoslawischen Republik Mazedonien
    (Text von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2002)
    2301)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 27 юни 2002 година
    за изменение на Решение 97/252/EО относно съставяне
    на временни списъци на предприятия от трети
    страни, от които държавите-членки разрешават
    вноса на мляко и млечни продукти за консумация
    от човека по отношение на Бивша югославска
    република Македония (нотифицирано под номер
    C(2002) 2301)
  type: main
- language: cs
  script: Latn
