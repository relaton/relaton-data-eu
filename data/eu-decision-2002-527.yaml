    li minnhom l-Istati Membri jawtorizzaw l-importazzjonijiet ta’ ħalib u prodotti
    tal-ħalib għall-konsum tal-bniedem, fir-rigward tal-ex-Repubblika Jugoslava
    tal-Maċedonja (notifikata taħt dokument numru K(2002)2301)
  type: main
