id: EUDecision1977653
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1977 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's shirts of mixed synthetic textile fibres and cotton
    falling within heading No ex 61.03 of the Common Customs Tariff, originating in
    Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '77/653/CEE: Décision de la Commission, du 28 juin 1977, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises pour hommes de fibres textiles
    synthétiques mélangées et de coton, de la position Ex 61.03 du Tarif douanier
    commun, originaires de Hong-Kong et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juni 1977, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Hongkong stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Männeroberhemden aus gemischten synthetischen Spinnstoffen und Baumwolle,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 28. juni 1977 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage skjorter til mænd (herunder sports- og arbejdsskjorter) af blandede
    syntetiske fibre og bomuld, som henhører under pos. ex 61.03 i den fælles toldtarif,
    har oprindelse i Hongkong og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 28 giugno 1977, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le camicie da uomo di fibre tessili sintetiche miste
    e di cotone della voce ex 61.03 della tariffa doganale comune, originarie di Hong
    Kong e messe in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juni 1977 waarbij het Koninkrijk België,
    het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden, worden gemachtigd
    herenoverhemden van gemengde synthetische textielvezels en van katoen van post
    ex 61.03 van het gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
