title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2733/94 of 9 November 1994 authorizing the
    United Kingdom to permit an additional increase in the alcoholic strength of table
    wines and of quality wines produced in a specified region
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2733/94 de la Commission du 9 novembre 1994 autorisant
    le Royaume-Uni à permettre une augmentation supplémentaire du titre alcoométrique
    des vins de table et des vins de qualité produits dans une région déterminée
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2733/94 DER KOMMISSION vom 9. November 1994 zur Ermächtigung
    des Vereinigten Königreichs, eine zusätzliche Erhöhung des Alkoholgehalts bei
    Tafelwein und Qualitätswein bestimmter Anbaugebiete zu gestatten
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2733/94 af 9. november 1994 om bemyndigelse
    af Det Forenede Kongerige til under visse omstændigheder at tillade en yderligere
    forhøjelse af alkoholindholdet i bordvine og i kvalitetsvine fra et bestemt dyrkningsområde
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2733/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 9ης Νοεμβρίου 1994 που εξουσιοδοτεί το Ηνωμένο
    Βασίλειο να επιτρέπει, συμπληρωματική αύξηση
    του αλκοολικού τίτλου των επιτραπέζιων οίνων
    και οίνων ποιότητος που παράγονται σε καθορισμένες
    περιοχές
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2733/94, annettu 9 päivänä marraskuuta 1994,
    luvan antamisesta Yhdistyneelle kuningaskunnalle sallia määritetyllä alueella
    tuotettujen pöytäviinien ja laatuviinien alkoholipitoisuuden lisäkohottaminen
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2733/94 DELLA COMMISSIONE del 9 novembre 1994 che autorizza
    il Regno Unito a permettere un aumento supplementare della gradazione alcolometrica
    dei vini da tavola e dei vini di qualità prodotti in una regione determinata
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2733/94 VAN DE COMMISSIE van 9 november 1994 waarbij
    het Verenigd Koninkrijk wordt gemachtigd een extra verhoging van het alcoholgehalte
    van tafelwijnen en in bepaalde gebieden voortgebrachte kwaliteitswijn toe te staan
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2733/94 DA COMISSÃO de 9 de Novembro de 1994 que
    autoriza o Reino Unido a permitir um aumento suplementar do título alcoométrico
    dos vinhos de mesa e dos vinhos de qualidade produzidos numa região determinada
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 2733/94 DE LA COMISIÓN de 9 de noviembre de 1994 por
    el que se autoriza al Reino Unido para que permita un aumento suplementario del
    grado alcohólico de los vinos de mesa y de los vinos de calidad producidos en
    una región determinada
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2733/94 av den 9 november 1994 om bemyndigande
