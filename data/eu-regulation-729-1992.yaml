  script: Latn
  content: Council Regulation (EEC) No 729/92 of 16 March 1992 imposing a definitive
    anti-dumping duty on imports of certain thermal paper originating in Japan and
    definitively collecting the provisional anti-dumping duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 729/92 du Conseil, du 16 mars 1992, instituant un
