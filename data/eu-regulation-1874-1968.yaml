title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1874/68 du Conseil, du 26 novembre 1968, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de raisins
    secs, de la sous-position 08.04 B du tarif douanier commun, présentés en emballages
    immédiats d'un contenu net inférieur ou égal à 15 Kg
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1874/68 des Rates vom 26. November 1968 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete
    Weintrauben der Tarifstelle 08.04 B des Gemeinsamen Zolltarifs, in Umschließungen
    mit einem Gewicht des Inhalts von 15 kg oder weniger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1874/68 del Consiglio, del 26 novembre 1968, relativo
    all'apertura, alla ripartizione e al modo di gestione del contingente tariffario
    comunitario di uve secche, della sottovoce 08.04 B della tariffa doganale comune,
    presentate in imballaggi immediati di un contenuto netto inferiore o uguale a
    15 kg
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1874/68 van de Raad van 26 november 1968 houdende
    opening, verdeling en wijze van beheer van het communautaire tariefcontingent
    voor rozijnen en krenten, van onderverdeling 08.04 B van het gemeenschappelijk
    douanetarief, in verpakkingen met een netto-inhoud per onmiddellijke verpakking
    van 15 kilogram of minder
  type: main
