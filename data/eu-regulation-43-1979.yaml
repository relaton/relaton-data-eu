title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 43/79 of 10 January 1979 fixing for the
    1978/79 marketing year the maximum amount of the contribution to storage costs
    which sugar manufacturers may require of beet and cane producers when sugar is
    carried forward
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 43/79 de la Commission, du 10 janvier 1979, fixant,
    pour la campagne sucrière 1978/1979, le montant pour la participation aux frais
    de stockage que les fabricants de sucre peuvent, en cas de report, exiger des
    producteurs de betteraves et de cannes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 43/79 der Kommission vom 10. Januar 1979 zur Festsetzung
    des Höchstbetrags, den die Zuckerhersteller im Zuckerwirtschaftsjahr 1978/79
    bei Übertragungen von den Zuckerrüben- und Zuckerrohrerzeugern als Beteiligung
    an den Lagerkosten fordern können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 43/79 af 10. januar 1979 om fastsættelse
    for sukkerproduktionsåret 1978/79 af den maksimale andel af lageromkostningerne,
    som sukkerfabrikanterne i tilfælde af overførsel kan kræve af producenterne
    af sukkerroer og sukkerrør
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 43/79 della Commissione, del 10 gennaio 1979, che
    fissa, per la campagna 1978/1979, l' importo massimo di partecipazione alle spese
    di magazzinaggio che i fabbricanti di zucchero, in caso di riporto, possono esigere
    dai produttori di barbabietole e di canna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 43/79 van de Commissie van 10 januari 1979 tot vaststelling
    voor het verkoopseizoen voor suiker 1978/1979 van het maximumbedrag van het aandeel
    in de opslagkosten dat de suikerfabrikanten in geval van overbrenging kunnen eisen
    van de suikerbieten- en suikerrietproducenten
  type: main
