  script: Latn
  content: Commission Regulation (EC) No 342/2006 of 24 February 2006 initiating a
    new exporter review of Council Regulation (EC) No 428/2005 imposing a definitive
    anti-dumping duty on imports of synthetic staple fibres of polyesters originating,
    inter alia , in the People’s Republic of China, repealing the duty with regard
    to imports from one exporter in this country and making these imports subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 342/2006 de la Commission du 24 février 2006 portant
