title:
- language: en
  script: Latn
  content: '2001/195/EC: Commission Decision of 5 March 2001 prolonging for the fifth
    time the validity of Decision 1999/815/EC concerning measures prohibiting the
    placing on the market of toys and childcare articles intended to be placed in
    the mouth by children under three years of age made of soft PVC containing certain
    phthalates (Text with EEA relevance) (notified under document number C(2001) 501)'
  type: main
- language: fr
  script: Latn
  content: '2001/195/CE: Décision de la Commission du 5 mars 2001 prolongeant pour
    la cinquième fois la validité de la décision 1999/815/CE concernant des mesures
    qui interdisent la mise sur le marché de jouets et articles de puériculture
    destinés à être mis en bouche par des enfants de moins de trois ans, fabriqués
    en PVC souple contenant certains phtalates (Texte présentant de l''intérêt
    pour l''EEE) [notifiée sous le numéro C(2001) 501]'
  type: main
- language: de
  script: Latn
  content: '2001/195/EG: Entscheidung der Kommission vom 5. März 2001 über eine
    fünfte Verlängerung der Geltungsdauer der Entscheidung 1999/815/EG über Maßnahmen
    zur Untersagung des Inverkehrbringens von Spielzeug- und Babyartikeln, die dazu
    bestimmt sind, von Kindern unter drei Jahren in den Mund genommen zu werden, und
    aus Weich-PVC bestehen, das bestimmte Weichmacher enthält (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 501)'
  type: main
- language: da
  script: Latn
  content: '2001/195/EF: Kommissionens beslutning af 5. marts 2001 om femte forlængelse
    af gyldigheden af beslutning 1999/815/EF om forbud mod markedsføring af legetøj
    og småbørnsartikler, der er beregnet til at blive puttet i munden af børn under
    tre år, og som er fremstillet af blød pvc indeholdende visse phthalater (EØS-relevant
    tekst) (meddelt under nummer K(2001) 501)'
  type: main
- language: el
  script: Grek
  content: '2001/195/ΕΚ: Απόφαση της Επιτροπής, της 5ης
    Μαρτίου 2001, για την παράταση για πέμπτη φορά
    της ισχύος της απόφασης 1999/815/ΕΚ σχετικά με
    τα μέτρα που απαγορεύουν τη διάθεση στην αγορά
    παιχνιδιών και προϊόντων παιδικής φροντίδας
    κατασκευασμένων από μαλακό PVC που περιέχει
    ορισμένους φθαλικούς εστέρες τα οποία κατά
    τη χρήση μπαίνουν στο στόμα παιδιών ηλικίας
    μικρότερης από τριών ετών (Κείμενο που παρουσιάζει
    ενδιαφέρον για τον ΕΟΧ) [κοινοποιηθείσα υπό
    τον αριθμό Ε(2001) 501]'
  type: main
- language: fi
  script: Latn
  content: '2001/195/EY: Komission päätös, tehty 5 päivänä maaliskuuta 2001,
    toimenpiteistä, joilla kielletään tiettyjä ftalaatteja sisältävien, pehmeästä
    PVC:stä valmistettujen, alle kolmivuotiaiden lasten suuhun pantavaksi tarkoitettujen
    lelujen ja lastentarvikkeiden markkinoille saattaminen, tehdyn päätöksen 1999/815/EY
    voimassaoloajan pidentämisestä viidennen kerran (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2001) 501)'
  type: main
- language: it
  script: Latn
  content: '2001/195/CE: Decisione della Commissione, del 5 marzo 2001, che proroga
    per la quinta volta la validità della decisione 1999/815/CE riguardante provvedimenti
    che vietano l''immissione sul mercato di giocattoli e articoli di puericultura
    destinati ad essere messi in bocca da bambini d''età inferiore a tre anni e fabbricati
    in PVC morbido contenente taluni ftalati (Testo rilevante ai fini del SEE) [notificata
    con il numero C(2001) 501]'
  type: main
- language: nl
  script: Latn
  content: '2001/195/EG: Beschikking van de Commissie van 5 maart 2001 tot vĳfde
    verlenging van de geldigheidsduur van Beschikking 1999/815/EG betreffende maatregelen
    houdende verbod op het op de markt brengen van speelgoed- en kinderverzorgingsartikelen
    die bestemd zĳn om door kinderen jonger dan drie jaar in de mond te worden gestopt
    en vervaardigd zĳn van zacht PVC dat bepaalde ftalaten bevat (Voor de EER relevante
    tekst) (kennisgeving geschied onder nummer C(2001) 501)'
  type: main
- language: pt
  script: Latn
  content: '2001/195/CE: Decisão da Comissão, de 5 de Março de 2001, que prorroga
    pela quinta vez o período de validade da Decisão 1999/815/CE relativa a medidas
    de proibição da colocação no mercado de brinquedos e artigos de puericultura
    destinados a ser introduzidos na boca por crianças com menos de três anos de
    idade, fabricados em PVC maleável que contenha determinados ftalatos (Texto relevante
    para efeitos do EEE) [notificada com o número C(2001) 501]'
  type: main
- language: es
  script: Latn
  content: '2001/195/CE: Decisión de la Comisión, de 5 de marzo de 2001, por la
    que se prolonga por quinta vez la validez de la Decisión 1999/815/CE sobre medidas
    relivas a la prohibición de la comercialización de determinados juguetes y artículos
    de puericultura destinados a ser introducidos en la boca por niños menores de
    tres años y fabricados con PVC blando que contenga ciertos ftalatos (Texto pertinente
    a efectos del EEE) [notificada con el número C(2001) 501]'
  type: main
- language: sv
  script: Latn
  content: '2001/195/EG: Kommissionens beslut av den 5 mars 2001 om förlängning
    för femte gången av beslut 1999/815/EG om åtgärder för att förbjuda utsläppandet
    på marknaden av leksaker och barnavårdsartiklar som är avsedda att stoppas
    i munnen av barn under tre års ålder, tillverkade i mjuk PVC-plast som innehåller
    vissa ftalater (Text av betydelse för EES) [delgivet med nr K(2001) 501]'
