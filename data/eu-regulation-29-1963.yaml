title:
- language: fr
  script: Latn
  content: Règlement n° 29/63/CEE de la Commission du 26 mars 1963 portant adaptation
    et fixation des prix d'écluse pour les oeufs de volaille en coquille et les volailles
    vivantes et abattues et fixation du montant des prélèvements envers les pays
    tiers pour les oeufs de volaille en coquille, les volailles vivantes d'un poids
    n'excédant pas 185 grammes et les volailles abattues pour la période du 1er
    avril au 30 juin 1963
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 29/63/EWG der Kommission vom 26. März 1963 über die Anpassung
    und Festsetzung der Einschleusungspreise für Eier in der Schale von Hausgeflügel,
    lebendes und geschlachtetes Hausgeflügel sowie über die Festsetzung der Abschöpfungsbeträge
    gegenüber dritten Ländern für Eier in der Schale von Hausgeflügel, lebendes
    Hausgeflügel mit einem Gewicht von höchstens 185 Gramm und geschlachtetes Hausgeflügel
    für die Zeit vom 1. April bis 30. Juni 1963
  type: main
- language: it
  script: Latn
  content: Regolamento n. 29/63/CEE della Commissione del 26 marzo 1963 che adatta
    e fissa i prezzi limite applicabili alle uova in guscio di volatili, ai volatili
    vivi e macellati e che fissa i prelievi nei confronti dei paesi terzi applicabili
    alle uova in guscio di volatili, ai volatili da cortile vivi di peso non superiore
    a 185 grammi e per i volatili da cortile macellati, applicabili nel periodo dal
    1 aprile al 30 giugno 1963
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 29/63/EEG van de Commissie van 26 maart 1963 houdende aanpassing
    en vaststelling van de sluisprijzen voor eieren in de schaal van pluimvee, levend
    pluimvee en geslacht pluimvee alsmede houdende vaststelling van de heffingen ten
    opzichte van derde landen voor eieren in de schaal van pluimvee, levend pluimvee
    dat niet meer dan 185 gram weegt en geslacht pluimvee voor de periode van 1 april
    tot en met 30 juni 1963
  type: main
