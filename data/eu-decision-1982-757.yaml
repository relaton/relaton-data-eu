    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend Decabromdiphenyläther
    mit Ursprung in den Vereinigten Staaten von Amerika und über die Einstellung
    des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '82/757/EØF: Kommissionens afgørelse af 11. november 1982 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende decabromdiphenylether
    med oprindelse i Amerikas Forenede Stater og om afslutning af denne procedure'
  type: main
