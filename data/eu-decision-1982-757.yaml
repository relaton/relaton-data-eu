  content: '82/757/EEC: Commission Decision of 11 November 1982 accepting undertakings
    given in connection with the anti-dumping procedure concerning decabromodiphenylether
    originating in the United States of America and terminating the procedure'
  type: main
- language: fr
  script: Latn
  content: '82/757/CEE: Décision de la Commission, du 11 novembre 1982, portant acceptation
    des engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    les importations de décabromodiphényléther originaire des États-Unis d'' Amérique
    et portant clôture de la procédurer'
  type: main
