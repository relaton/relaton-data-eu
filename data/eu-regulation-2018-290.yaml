  script: Latn
  content: Commission Regulation (EU) 2018/290 of 26 February 2018 amending Regulation
    (EC) No 1881/2006 as regards maximum levels of glycidyl fatty acid esters in vegetable
    oils and fats, infant formula, follow-on formula and foods for special medical
    purposes intended for infants and young children
  type: main
- language: fr
  script: Latn
