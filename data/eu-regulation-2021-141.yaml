---
id: EURegulation2021141
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/141 of 5 February 2021 extending
    a derogation from Council Regulation (EC) No 1967/2006 as regards the prohibition
    to fish above protected habitats, the minimum distance from the coast and the
    minimum sea depth for the ‘gangui’ trawlers fishing in certain territorial
    waters of France (Provence-Alpes-Côte d’Azur)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/141 de la Commission du 5 février
    2021 portant prolongation de la dérogation au règlement (CE) no 1967/2006 du
    Conseil en ce qui concerne l’interdiction de la pêche au-dessus des habitats
    protégés ainsi que la distance minimale de la côte et la profondeur minimale
    pour les chalutiers équipés de chaluts de type «gangui» pêchant dans certaines
    eaux territoriales de la France (Provence-Alpes-Côte d’Azur)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/141 der Kommission vom 5. Februar 2021
    zur Gewährung einer Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Verbots der Fischerei über geschützten Lebensräumen, der Mindestentfernung
    von der Küste und der Mindestwassertiefe für die „Gangui“-Trawler beim Fischfang
    in bestimmten Hoheitsgewässern Frankreichs (Provence-Alpes-Côte d’Azur)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/141 на Комисията
    от 5 февруари 2021 година за удължаване на срока
    на дерогация от Регламент (ЕО) № 1967/2006 на Съвета
    по отношение на забраната за риболов над защитени
    местообитания, минималното разстояние от брега
    и минималната дълбочина за риболов с траулери
    с мрежи „gangui“ в определени териториални води
    на Франция (Provence-Alpes-Côte d’Azur)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/141, ze dne 5. února 2021, kterým
    se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde o zákaz
    rybolovu nad chráněnými stanovišti, minimální vzdálenost od pobřeží
    a minimální hloubku moře pro traulery typu gangui lovící v některých teritoriálních
    vodách Francie (Provence-Alpes-Côte d’Azur)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/141 af 5. februar 2021
    om forlængelse af en fravigelse af Rådets forordning (EF) nr. 1967/2006 for
    så vidt angår forbuddet mod fiskeri hen over beskyttede habitater, mindsteafstanden
    fra kysten og mindstedybden for fiskeri med gangui-trawlere i visse franske territorialfarvande
    (Provence-Alpes-Côte d'Azur)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/141 της Επιτροπής
    της 5ης Φεβρουαρίου 2021 για την παράταση της
    παρέκκλισης από τον κανονισμό (ΕΚ) αριθ. 1967/2006
    του Συμβουλίου όσον αφορά την απαγόρευση της
    αλιείας επάνω από προστατευόμενα ενδιαιτήματα,
    την ελάχιστη απόσταση από την ακτή και το ελάχιστο
    βάθος θάλασσας που οφείλουν να τηρούν οι μηχανότρατες
    με ζευγαρωτά σκάφη («gangui») οι οποίες αλιεύουν
    σε ορισμένα χωρικά ύδατα της Γαλλίας (Προβηγκία-Άλπεις-Κυανή
    Ακτή)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/141, 5. veebruar 2021, millega laiendatakse
    erandit nõukogu määrusest (EÜ) nr 1967/2006 seoses keeluga püüda kala kaitstud
    elupaikade kohal, gangui-traaleritega püügi miinimumkaugusega rannikust ja minimaalse
    meresügavusega selle püügi korral teatavates Prantsusmaa (Provence-Alpes-Côte
    d’Azur) territoriaalvetes
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/141, annettu 5 päivänä
    helmikuuta 2021, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn, suojeltavien
    luontotyyppien yläpuolella tapahtuvan kalastuksen kieltämistä, vähimmäisetäisyyttä
    rannikolta ja veden vähimmäissyvyyttä koskevan poikkeuksen jatkamisesta kalastettaessa
    gangui-troolareilla tietyillä Ranskan aluevesillä (Provence-Alpes-Côte d’Azur)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/141 ón gCoimisiún an 5 Feabhra
    2021 lena gcuirtear síneadh leis an maolú ó Rialachán (CE) Uimh. 1967/2006
    ón gComhairle a mhéid a bhaineann leis an toirmeasc ar iascaireacht os cionn
    gnáthóga faoi chosaint, an fad íosta ón gcósta agus doimhneacht íosta na
    mara le haghaidh na dtrálaer “gangui” a bhíonn ag iascaireacht in uiscí
    teorann áirithe na Fraince (Provence-Alpes-Côte d’Azur)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/141 оd 5. veljače 2021. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu zabrane ribolova iznad
    zaštićenih staništa, minimalne udaljenosti od obale i minimalne dubine mora
    za mreže potegače vrste „gangui” koje love u određenim teritorijalnim vodama
    Francuske (Provence – Alpes – Côte d’Azur)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/141 végrehajtási rendelete (2021. február 5.)
    az 1967/2006/EK tanácsi rendelettől a Franciaország egyes felségvizein (Provence-Alpes-Côte
    d’Azur) „gangui” vonóhálót üzemeltető hajók vonatkozásában a védett
    élőhelyek feletti halászati tilalom, a hálók legkisebb merítési mélysége
    és használatuk parttól számított legkisebb távolsága tekintetében történő
    eltérés meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/141 della Commissione del 5 febbraio
    2021 che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda il divieto di pescare al di sopra di habitat protetti, la distanza
    minima dalla costa e la profondità minima per i pescherecci da traino provvisti
    dell’attrezzo denominato «gangui» operanti in talune acque territoriali francesi
    (Provence-Alpes-Côte d’Azur)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/141 (2021. gada 5. februāris),
    ar ko attiecībā uz aizliegumu zvejot virs aizsargājamām dzīvotnēm un minimālo
    attālumu no krasta un minimālo jūras dziļumu, kas jāievēro kuģiem, kuri
    noteiktos Francijas (Provansas–Alpu–Kotdazīras) teritoriālajos ūdeņos
    zvejo ar gangui tipa trali, pagarina atkāpi no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/141 2021 m. vasario 5 d.
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamente
    (EB) Nr. 1967/2006 nustatytų žvejybos virš saugomų buveinių draudimo ir minimalaus
    atstumo nuo kranto bei minimalaus jūros gylio reikalavimų, taikomos tam tikruose
    Prancūzijos teritoriniuose vandenyse (Provanso-Alpių-Žydrojo Kranto regione)
    „gangui“ tipo tralais žvejojantiems traleriams, galiojimas
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/141 tal-5
    ta’ Frar 2021 li jistabbilixxi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tal-projbizzjoni tas-sajd f’ħabitats protetti, id-distanza minima
    mill-kosta u l-fond minimu tal-baħar għall-bastimenti tat-tkarkir “gangui”
    li jistadu f’ċertu ilmijiet territorjali ta’ Franza (Provence-Alpes-Côte
    d’Azur)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/141 van de Commissie van 5 februari 2021
    tot verlenging van een afwijking van Verordening (EG) nr. 1967/2006 van de Raad,
    wat betreft het verbod om boven beschermde habitats te vissen, de minimumafstand
    van de kust en de minimumzeediepte voor de “gangui”-trawlers in bepaalde territoriale
    wateren van Frankrijk (Provence-Alpes-Côte d’Azur)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/141 z dnia 5 lutego 2021 r.
    przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w odniesieniu
    do zakazu połowów nad chronionymi siedliskami, minimalnych odległości od brzegu
    i minimalnej głębokości morza dla trawlerów stosujących sieci typu „gangui”
    prowadzących połowy na niektórych wodach terytorialnych Francji (Provence-Alpes-Côte
    d’Azur)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/141 da Comissão de 5 de fevereiro
    de 2021 que prorroga a derrogação ao Regulamento (CE) n.o 1967/2006 do Conselho
    no que respeita à proibição de pesca em habitats protegidos, à distância
    mínima da costa e à profundidade mínima para os arrastões gangui que pescam
    em determinadas águas territoriais de França (Provence-Alpes-Côte d’Azur)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/141 al Comisiei din 5 februarie
    2021 de prelungire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește interzicerea pescuitului deasupra habitatelor protejate,
    distanța minimă de coastă și adâncimea minimă a mării pentru traulerele
    echipate cu traule de tip „gangui” care pescuiesc în anumite ape teritoriale
    ale Franței (Provence-Alpes-Côte d’Azur)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/141 z 5. februára 2021, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o zákaz lovu nad chránenými biotopmi a o minimálnu vzdialenosť od pobrežia
    a minimálnu hĺbku mora v prípade lovu plavidlami vybavenými vlečnými sieťami
    typu gangui v určitých pobrežných vodách Francúzska (Provence-Alpes-Côte
    d’Azur)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/141 z dne 5. februarja 2021 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede prepovedi ribolova nad zaščitenimi
    habitati, najmanjše oddaljenosti od obale in najmanjše morske globine za plovila
    z vlečnimi mrežami tipa „gangui“, ki lovijo v določenih teritorialnih vodah
    Francije (Provansa - Alpe - Azurna obala)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/141 de la Comisión de 5 de febrero
    de 2021 por el que se amplía una excepción al Reglamento (CE) n.o 1967/2006
    del Consejo en lo relativo a la prohibición de faenar por encima de hábitats
    protegidos, la distancia mínima de la costa y la profundidad marina mínima para
    los arrastreros que pescan con «gangui» en determinadas aguas territoriales
    de Francia (Provenza-Alpes-Costa Azul)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2021/141 av den 5 februari
    2021 om förlängning av ett undantag från rådets förordning (EG) nr 1967/2006
    vad gäller förbudet mot fiske ovanför skyddade livsmiljöer samt minimiavståndet
    från kusten och minimidjupet för fiske med trålare av ”gangui-typ” i vissa
    territorialvatten i Frankrike (Provence-Alpes-Côte d’Azur)
  type: main
