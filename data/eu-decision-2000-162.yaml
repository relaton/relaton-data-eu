    hevoseläinten, lampaiden, vuohien, tuoreen lihan ja lihavalmisteiden tuonnin
    tehdyn neuvoston päätöksen 79/542/ETY muuttamisesta (tiedoksiannettu numerolla
    K(2000) 287)'
  type: main
