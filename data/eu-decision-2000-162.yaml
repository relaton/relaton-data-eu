    καταλόγου τρίτων χωρών από τις οποίες τα κράτη
    μέλη επιτρέπουν τις εισαγωγές βοοειδών, χοιροειδών,
    ιπποειδών, αιγοπροβάτων, νωπού κρέατος και
    προϊόντων με βάση το κρέας [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 287]'
  type: main
