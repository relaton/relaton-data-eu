title:
- language: en
  script: Latn
  content: '2000/162/EC: Commission Decision of 14 February 2000 amending Council
    Decision 79/542/EEC drawing up a list of third countries from which the Member
    States authorise imports of bovine animals, swine, equidae, sheep and goats, fresh
    meat and meat products (notified under document number C(2000) 287)'
  type: main
- language: fr
  script: Latn
  content: '2000/162/CE: Décision de la Commission, du 14 février 2000, modifiant
    la décision 79/542/CEE du Conseil établissant une liste des pays tiers en provenance
    desquels les États membres autorisent l''importation d''animaux des espèces
    bovine, porcine, équine, ovine et caprine, de viandes fraîches et de produits
    à base de viande [notifiée sous le numéro C(2000) 287]'
  type: main
- language: de
  script: Latn
  content: '2000/162/EG: Entscheidung der Kommission vom 14. Februar 2000 zur Änderung
