id: EUDecision1972266
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 juillet 1972, autorisant la République
    française à exclure du traitement communautaire les appareils récepteurs de
    radio, même combinés avec un appareil d'enregistrement ou de reproduction du
    son, de la position 85.12 A III du Tarif douanier commun, originaires de Hong-Kong
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/266/EWG: Entscheidung der Kommission vom 4. Juli 1972, mit der die
    Französische Republik ermächtigt wird, aus Hongkong stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte für Rundfunk, auch
    mit einem Tonaufnahme- oder Tonwiedergabegerät kombiniert, der Tarifnummer 85.15
    A III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/266/CEE: Decisione della Commissione, del 4 luglio 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    radioriceventi anche combinati con un apparecchio di registrazione o di riproduzione
    del suono, della voce n. 85.15 A III della tariffa doganale comune, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/266/EEG: Beschikking van de Commissie van 4 juli 1972 waarbij de Franse
    Republiek wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook indien
    met ingebouwd toestel voor het opnemen of voor het weergeven van geluid van post
    85.15 A III van het gemeenschappelijk douanetarief, van oorsprong uit Hong- Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
