  script: Latn
  content: Commission Implementing Regulation (EU) 2018/788 of 30 May 2018 amending
    Implementing Regulation (EU) 2017/1993 imposing a definitive anti-dumping duty
    on imports of certain open mesh fabrics of glass fibres originating in the People's
    Republic of China as extended to imports of certain open mesh fabrics of glass
    fibres consigned from India, Indonesia, Malaysia, Taiwan and Thailand, whether
    declared as originating in these countries or not following an expiry review pursuant
    to Article 11(2) of Regulation (EU) 2016/1036 of the European Parliament and of
    the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2018/788 de la Commission du 30 mai 2018 modifiant
    le règlement d'exécution (UE) 2017/1993 instituant un droit antidumping définitif
    sur les importations de certains tissus de fibre de verre à maille ouverte originaires
    de la République populaire de Chine tel qu'étendu aux importations de certains
    tissus de fibre de verre à maille ouverte expédiés de l'Inde, de l'Indonésie,
    de la Malaisie, de Taïwan et de la Thaïlande, qu'ils aient ou non été déclarés
    originaires de ces pays, à l'issue d'un réexamen de mesures parvenant à expiration
    effectué conformément à l'article 11, paragraphe 2, du règlement (UE) 2016/1036
    du Parlement européen et du Conseil
  type: main
