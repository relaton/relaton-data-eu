id: EUDecision1976923
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 26 October 1976 authorizing the Italian Republic
    not to apply Community treatment to half-boots with uppers of rubber falling within
    heading No ex 64.01 of the Common Customs Tariff, originating in Czechoslovakia
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/923/CEE: Décision de la Commission, du 26 octobre 1976, autorisant
    la République italienne à exclure du traitement communautaire les demi-bottes
    à dessus en caoutchouc, de la position Ex 64.01 du Tarif douanier commun, originaires
    de Tchécoslovaquie et mises en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 26. Oktober 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Tschechoslowakei stammende und in den anderen
    Mitgliedstaaten im freien Verkehr befindliche Halbschäfter mit Oberteil aus Kautschuk
    der Tarifnummer ex 64.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 26. oktober 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage halvstøvler med overdel af
    gummi, som henhører under pos. ex 64.01 i den fælles toldtarif, har oprindelse
    i Tjekkoslovakiet og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 26 ottobre 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario gli stivali di gomma della voce
    ex 64.01 della tariffa doganale comune originari di Cecoslovacchia e messi in
    libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 26 oktober 1976 waarbij de Italiaanse
    Republiek wordt gemachtigd halflaarzen met bovendeel van rubber, van post ex 64.01
    van het gemeenschappelijk douanetarief, van oorsprong uit Tsjechoslowakije en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten
  type: main
