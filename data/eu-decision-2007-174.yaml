    oblastí Itálie za úředně prosté tuberkulózy skotu, brucelózy a enzootické
    leukózy skotu a prohlášení oblasti Polska za úředně prostou enzootické
    leukózy skotu (oznámeno pod číslem K(2007) 1201)'
  type: main
