title:
- language: en
  script: Latn
  content: '2007/174/EC: Commission Decision of 20 March 2007 amending Decision 2003/467/EC
    as regards the declaration that certain provinces or regions of Italy are officially
    free of bovine tuberculosis, bovine brucellosis and enzootic bovine leukosis and
    that a region of Poland is officially free of enzootic bovine leukosis (notified
    under document number C(2007) 1201)'
  type: main
- language: fr
  script: Latn
  content: '2007/174/CE: Décision de la Commission du 20 mars 2007 modifiant la décision
    2003/467/CE en ce qui concerne la déclaration selon laquelle certaines provinces
    ou régions d''Italie sont officiellement indemnes de tuberculose bovine, de brucellose
    bovine et de leucose bovine enzootique et la déclaration selon laquelle une région
    de Pologne est officiellement indemne de leucose bovine enzootique [notifiée
    sous le numéro C(2007) 1201]'
  type: main
- language: de
  script: Latn
  content: '2007/174/EG: Entscheidung der Kommission vom 20. März 2007 zur Änderung
    der Entscheidung 2003/467/EG hinsichtlich der Erklärung, dass bestimmte Provinzen
    oder Regionen Italiens amtlich frei von Rindertuberkulose, Rinderbrucellose und
    enzootischer Rinderleukose sind und dass eine Region Polens amtlich frei von enzootischer
    Rinderleukose ist (Bekannt gegeben unter Aktenzeichen K(2007) 1201)'
  type: main
- language: bg
