id: EURegulation1651990
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 165/90 of 23 January 1990 imposing a provisional
    anti-dumping duty on imports of certain types of electronic microcircuits known
    as drams (dynamic random access memories) originating in Japan, accepting undertakings
    offered by certain exporters in connection with the anti-dumping proceeding concerning
    imports of these products and terminating the investigation in their respect
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 165/90 de la Commission du 23 janvier 1990 instituant
    un droit antidumping provisoire sur les importations de certains types de microstructures
    électroniques dites "DRAM" (dynamic random access memories) originaires du Japon,
    portant acceptation d'engagements offerts par certains exportateurs dans le cadre
    de la procédure antidumping concernant les importations de ces produits et portant
    clôture de l'enquête en ce qui concerne les exportateurs en cause
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 165/90 DER KOMMISSION vom 23. Januar 1990 zur Einfuehrung
    eines vorlaeufigen Antidumpingzolls auf die Einfuhren bestimmter elektronischer
    Mikroschaltungen, sogenanter DRAMs (Dynamische Schreib-Lesespeicher), mit Ursprung
    in Japan und zur Annahme der Verpflichtungsangebote bestimmter Ausfuehrer im Rahmen
    des Antidumpingverfahrens betreffend die Einfuhren dieser Waren und zur Einstellung
    des Verfahrens gegenueber diesen Ausfuehrern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 165/90 af 23. januar 1990 om indførelse
    af en midlertidig antidumping på importen af visse typer elektroniske mikrokredsløb,
    såkaldte DRAMs (Dynamiske Random Access Memories), med oprindelse i Japan, om
    godtagelse af tilsagn afgivet af visse eksportører i forbindelse med antidumpingproceduren
    vedrørende importen af disse varer og om afslutning af undersøgelsen herfor
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 165/90 της Επιτροπής
    της 23ης Ιανουαρίου 1990 για την επιβολή προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές ορισμένων
    τύπων ηλεκτρονικών μικροκυκλωμάτων γνωστών
    ως DRAM ( δυναμικές μνήμες τυχαίας προσπέλασης
    ) καταγωγής Ιαπωνίας, για την αποδοχή αναλήψεων
    υποχρεώσεων που έχουν προταθεί εκ μέρους ορισμένων
    εξαγωγέων σχετικά με τη διαδικασία αντιντάμπινγκ
    όσον αφορά τις εισαγωγές αυτών των προϊόντων
    και για την περάτωση της σχετικής έρευνας
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 165/90 DELLA COMMISSIONE del 23 gennaio 1990 recante
    istituzione di un dazio antidumping provvisorio sulle importazioni di alcuni tipi
    di microcircuiti elettronici, detti DRAM (memorie dinamiche ad accesso casuale),
    originari del Giappone, ed accettazione degli impegni offerti da alcuni esportatori
    nell'ambito del procedimento antidumping relativo alle importazioni degli stessi
    prodotti, nonché chiusura dell'inchiesta nei confronti di tali esportatori
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 165/90 VAN DE COMMISSIE van 23 januari 1990 tot instelling
    van een voorlopig anti-dumpingrecht op de invoer van bepaalde soorten elektronische
    microschakelingen, bekend als DRAM's (dynamic random access memories), van oorsprong
    uit Japan, aanvaarding van door bepaalde exporteurs aangeboden verbintenissen
    in verband met de anti-dumpingprocedure betreffende de invoer van deze produkten,
    en beëindiging van het onderzoek dienaangaande
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 165/90 DA COMISSAO de 23 de Janeiro de 1990 que institui
    um direito anti-dumping provisorio sobre as importaçoes de certos tipos de microcircuitos
    electronicos conhecidos por memorias DRAM (memorias dinâmicas de acesso directo),
    originarias do Japao, que aceita compromissos oferecidos por certos exportadores
    no âmbito do processo anti-dumping relativo às importaçoes destes produtos
    e que encerra o inquérito relativamente a estes exportadores
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 165/90 DE LA COMISION de 23 de enero de 1990 por el
    que se establece un derecho antidumping sobre las importaciones de determinados
    tipos de microcircuitos electronicos denominados DRAM (memorias dinamicas de acceso
    aleatorio) originarios de Japon, por el que se aceptan los compromisos ofrecidos
    por determinados exportadores en relacion con el procedimiento antidumping sobre
    las importaciones de dichos productos y por el que se da por concluida la investigacion
    con respecto a estos exportadores
  type: main
