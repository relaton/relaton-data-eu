  content: Commission Regulation (EEC) No 1266/83 of 20 May 1983 amending for the
    third time Regulation (EEC) No 2657/80 on the determination of prices of fresh
    or chilled sheep carcases on representative Community markets and the survey of
    prices of certain other qualities of sheep carcases in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1266/83 de la Commission du 20 mai 1983 portant troisième
    modification du règlement (CEE) no 2657/80 relatif à la détermination des prix
    des carcasses d' ovins fraîches ou réfrigérées constatés sur les marchés
    représentatifs de la Communauté et au relevé des prix de certaines autres qualités
    de carcasses d' ovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1266/83 der Kommission vom 20. Mai 1983 zur dritten
    Änderung der Verordnung (EWG) Nr. 2657/80 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für frische oder gekühlte Tierkörper
    von Schafen und zur Ermittlung der Preise einiger anderer Qualitäten von Tierkörpern
    von Schafen in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1266/83 af 20. maj 1983 om tredje ændring
    af forordning (EØF) nr. 2657/80 om bestemmelse af priserne for ferske eller kølede
    fårekroppe, der konstateres på Fællesskabets repræsentative markeder, og om
    registrering af priserne for visse andre fårekroppekvaliteter i Fællesskabet
  type: main
- language: el
  script: Grek
