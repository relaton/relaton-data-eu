  script: Latn
  content: Directive 2006/122/EC of the European Parliament and of the Council of
    12 December 2006 amending for the 30th time Council Directive 76/769/EEC on the
    approximation of the laws, regulations and administrative provisions of the Member
    States relating to restrictions on the marketing and use of certain dangerous
    substances and preparations (perfluorooctane sulfonates)
  type: main
- language: fr
  script: Latn
