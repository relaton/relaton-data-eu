title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 929/93 of 19 April 1993 opening for 1993, as
    an autonomous measure, a special import quota for high-quality, fresh, chilled
    or frozen beef and veal falling within CN codes 0201 and 0202 and for products
    falling within CN codes 0206 10 95 and 0206 29 91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 929/93 du Conseil, du 19 avril 1993, portant ouverture,
    pour l' année 1993, à titre autonome, d' un quota exceptionnel d' importation
    de viandes bovines de haute qualité, fraîches, réfrigérées ou congelées,
    relevant des codes NC 0201 et 0202, ainsi que des produits relevant des codes
    NC 0206 10 95 et 0206 29 91
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 929/93 des Rates vom 19. April 1993 zur Eröffnung
    eines außerordentlichen autonomen Kontingents für die Einfuhr von hochwertigem,
    frischem, gekühltem oder gefrorenem Rindfleisch der KN-Codes 0201 und 0202 sowie
    von Erzeugnissen der KN-Codes 0206 10 95 und 0206 29 91 für 1993
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 929/93 af 19. april 1993 om autonom åbning
    for 1993 af et særligt importkontingent for oksekød af høj kvalitet, fersk,
    kølet eller frosset, henhørende under KN-kode 0201 og 0202 samt produkter henhørende
    under KN-kode 0206 10 95 og 0206 29 91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 929/93 του Συμβουλίου
    της 19ης Απριλίου 1993 που ανοίγει για το έτος
    1993 και με τρόπο αυτόνομο, μια έκτακτη ποσόστωση
    για εισαγωγή βοείων κρεάτων εκλεκτής ποιότητας,
    νωπών, διατηρημένων με απλή ψύξη ή κατεψηγμένων
    των κωδικών ΣΟ 0201 και 0202, καθώς και των προϊόντων
    των κωδικών ΣΟ 0206 10 95 και 0206 29 91
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 929/93 del Consiglio, del 19 aprile 1993, relativo
    all' apertura, per il 1993, a titolo autonomo, di un contingente eccezionale di
    importazioni di carni bovine di qualità pregiata, fresche, refrigerate o congelate
    dei codici NC 0201 e 0202 come pure di prodotti dei codici NC 0206 10 95 e 0206
    29 91
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 929/93 van de Raad van 19 april 1993 betreffende
    de opening, voor 1993, van een autonoom en uitzonderlijk tariefcontingent voor
    de invoer van vers, gekoeld of bevroren rundvlees van hoge kwaliteit van de GN-
    codes 0201 en 0202, alsmede van produkten van de GN-codes 0206 10 95 en 0206 29
    91
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 929/93 do Conselho, de 19 de Abril de 1993, relativo
    à abertura, para 1993 e a título autónomo, de um contingente excepcional de
    importação de carne de bovino de alta qualidade, fresca, refrigerada ou congelada,
    dos códigos NC 0201 e 0202 e de produtos dos códigos NC 0206 10 95 e 0206 29
    91
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 929/93 del Consejo, de 19 de abril de 1993, por el
