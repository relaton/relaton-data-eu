title:
- language: en
  script: Latn
  content: '93/358/EEC: Council Decision of 26 May 1993 authorizing the Member States
    to provide for derogations from certain provisions of Directive 77/93/EEC in respect
    of wood of conifers (Coniferales) other than of Thuja L., Pinus L., and mixtures
    with Pinus L., originating in Canada'
  type: main
- language: fr
  script: Latn
  content: '93/358/CEE: Décision du Conseil du 26 mai 1993 autorisant les États
    membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE en ce qui concerne les bois de conifères (Coniferales) autres que Thuja
    L., Pinus L. et les mélanges comprenant Pinus L., originaires du Canada'
  type: main
- language: de
  script: Latn
  content: '93/358/EWG: ENTSCHEIDUNG DES RATES vom 26. Mai 1993 zur Ermächtigung
    der Mitgliedstaaten, für Holz von Koniferen (Coniferales) mit Ursprung in Kanada
    - außer Holz von Thuja L. und Pinus L. sowie Pinus L. enthaltende Mischungen
    - Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG vorzusehen'
  type: main
- language: da
  script: Latn
  content: '93/358/EØF: RÅDETS BESLUTNING af 26. maj 1993 om bemyndigelse af medlemsstaterne
    til at indrømme undtagelser fra visse bestemmelser i direktiv 77/93/EØF for
    så vidt angår træ af nåletræer (Coniferales), bortset fra træ af Thuja L.,
    Pinus L. og blandinger med Pinus L., med oprindelse i Canada'
  type: main
- language: el
  script: Grek
  content: '93/358/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 26ης
    Μαΐου 1993 που επιτρέπει στα κράτη μέλη να προβλέπουν
    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ όσον αφορά την ξυλεία κωνοφόρων (Coniferales),
    εκτός από την ξυλεία της Thuja L., του Pinus L. και
    τα μείγματα με Pinus L., καταγωγής Καναδά'
  type: main
- language: it
  script: Latn
  content: '93/358/CEE: DECISIONE DEL CONSIGLIO del 26 maggio 1993 che autorizza gli
    Stati membri a derogare a determinate disposizioni della direttiva 77/93/CEE per
    quanto riguarda il legname di conifere (Coniferales), ad eccezione di Thuja L.,
    Pinus L. e miscugli contenenti Pinus L, originario del Canada'
  type: main
- language: nl
  script: Latn
  content: '93/358/EEG: BESCHIKKING VAN DE RAAD van 26 mei 1993 tot machtiging van
    de Lid-Staten om afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG toe
    te staan voor hout van Coniferae, andere dan Thuja L., Pinus L. en gemengde partijen
    met Pinus L., van oorsprong uit Canada'
  type: main
- language: pt
  script: Latn
  content: '93/358/CEE: DECISÃO DO CONSELHO de 26 de Maio de 1993 que autoriza os
    Estados-membros a estabelecer derrogações em relação a determinadas disposições
    da Directiva 77/93/CEE no que diz respeito às madeiras de coníferas (Coniferales),
    com excepção da de Thuja L., Pinus L. e das misturas contendo Pinus L., originárias
    do Canadá'
  type: main
- language: es
  script: Latn
  content: '93/358/CEE: DECISIÓN DEL CONSEJO de 26 de mayo de 1993 por la que se
    autoriza a los Estados miembros para establecer excepciones a determinadas disposiciones
    de la Directiva 77/93/CEE del Consejo en lo que respecta a la madera de coníferas
    (Coniferales), salvo de las variedades Thuja L. y Pinus L. y las mezclas que contengan
    Pinus L., originaria de Canadá'
