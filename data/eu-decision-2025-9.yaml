  content: Council Decision (EU) 2025/9 of 12 December 2024 on the position to be
    taken on behalf of the European Union within the Joint Monitoring and Review Committee
    established by the Voluntary Partnership Agreement between the European Union
    and the Co-operative Republic of Guyana on forest law enforcement, governance
    and trade in timber products to the European Union, regarding the establishment
    of the rules of procedure of the Joint Monitoring and Review Committee and the
    working procedures for arbitration
  type: main
- language: fr
