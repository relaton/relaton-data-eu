title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1957/78 of 10 August 1978 re-establishing
    the levying of customs duties on tableware and other articles of a kind commonly
    used for domestic or toilet purposes, falling within heading No 69.11, originating
    in Yugoslavia to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1957/78 de la Commission, du 10 août 1978, portant
    rétablissement de la perception des droits de douane applicables à la vaisselle
    et aux articles de ménage ou de toilette en porcelaine, de la position tarifaire
    69.11, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1957/78 der Kommission vom 10. August 1978 zur Wiedereinführung
    des Zollsatzes für Geschirr, Haushalts- und Toilettengegenstände, aus Porzellan,
    der Tarifnummer 69.11, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1957/78 af 10. august 1978 om genindførelse
    af opkrævning af toldafgifter for bordservice samt husholdnings- og toiletartikler,
    af porcelæn, under position 69.11, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1957/78 della Commissione, del 10 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili al vasellame e oggetti
    di uso domestico o da toletta, di porcellana, della voce doganale 69.11, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1957/78 van de Commissie van 10 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op vaatwerk,
    huishoudelijke artikelen en toiletartikelen, van porselein, van post 69.11, van
    oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77
    van de Raad algemene tariefpreferenties werden geopend
  type: main
