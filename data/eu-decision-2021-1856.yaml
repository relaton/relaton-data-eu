  script: Latn
  content: Rådets beslut (EU) 2021/1856 av den 18 oktober 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det associeringsråd som inrättats
    genom Europa–Medelhavsavtalet om upprättande av en associering mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Republiken Tunisien,
    å andra sidan, vad gäller en förlängning av giltighetstiden för de strategiska
    prioriteringarna EU–Tunisien fram till dess att nya uppdaterade strategiska
    prioriteringar antas av associeringsrådet
