title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1856 of 18 October 2021 on the position to be
    taken on behalf of the European Union within the Association Council set up by
    the Euro-Mediterranean Agreement establishing an Association between the European
    Communities and their Member States, of the one part, and the Republic of Tunisia,
    of the other part, as regards the extension of the validity of the EU-Tunisia
    strategic priorities until new updated strategic priorities are adopted by the
    Association Council
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1856 du Conseil du 18 octobre 2021 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    la Communauté européenne et ses États membres, d’une part, et la République
    tunisienne, d’autre part, concernant la prorogation de la validité des priorités
    stratégiques UE-Tunisie jusqu’à l’adoption par le Conseil d’association
    de nouvelles priorités stratégiques actualisées
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1856 des Rates vom 18. Oktober 2021 über den Standpunkt,
