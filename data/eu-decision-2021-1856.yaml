    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación instituido por el Acuerdo euromediterráneo por el que se crea
    una asociación entre las Comunidades Europeas y sus Estados miembros, por una
    parte, y la República de Túnez, por otra, en lo que respecta a la prórroga
    de la validez de las prioridades estratégicas UE-Túnez hasta que el Consejo
    de Asociación adopte nuevas prioridades estratégicas actualizadas
  type: main
