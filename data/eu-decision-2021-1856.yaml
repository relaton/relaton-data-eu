    ihren Mitgliedstaaten einerseits und der Tunesischen Republik andererseits eingesetzten
    Assoziationsrat zu der Verlängerung der Gültigkeit der strategischen Prioritäten
    EU-Tunesien bis zur Annahme neuer aktualisierter strategischer Prioritäten durch
    den Assoziationsrat zu vertreten ist
  type: main
