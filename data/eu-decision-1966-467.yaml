  content: Décision 66/647/CEE de la Commission, du 29 juillet 1966, portant nouvelle
    modification de sa décision du 7 février 1966 autorisant la perception de taxes
    compensatoires sur les importations, en République fédérale d'Allemagne, de
    biscuits et gaufres en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '66/467/EWG: Entscheidung der Kommission vom 29. Juli 1966 über die erneute
    Änderung ihrer Entscheidung vom 7. Februar 1966 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Waffeln und Keksen aus den anderen Mitgliedstaaten in die Bundesrepublik
    Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/467/CEE: Decisione della Commissione del 29 luglio 1966 che modifica
    nuovamente la decisione del 7 febbraio 1966, che autorizza la riscossione di tasse
    di compensazione sulle importazioni, nella Repubblica federale di Germania, di
    biscotti e cialde in provenienza dagli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/467/EEG: Beschikking van de Commissie van 29 juli 1966 tot nieuwe wijziging
    van haar beschikking van 7 februari 1966 houdende machtiging tot het leggen van
    compenserende heffingen op de invoer in de Bondsrepubliek Duitsland van biscuits
    en wafels uit de overige Lid-Staten'
