title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1590/95 of 30 June 1995 amending Regulation
    (EEC) No 1727/92 laying down detailed rules for implementation of the specific
    arrangements for the supply of cereal products to the Azores and Madeira and establishing
    the forecast balance, and amending Regulation (EC) No 2883/94 establishing a forecast
    balance for the supply to the Canary Islands of agricultural products covered
    by the specifc measures provided for in Articles 2, 3, 4 and 5 of Council Regulation
    (EEC) No 1601/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1590/95 de la Commission, du 30 juin 1995, modifiant,
    d' une part, le règlement (CEE) nº 1727/92 portant modalités d' application
    du régime spécifique pour l' approvisionnement en produits céréaliers des
    Açores et de Madère et établissant le bilan prévisionnel d' approvisionnement
    et, d' autre part, le règlement (CE) nº 2883/94 établissant le bilan prévisionnel
    d' approvisionnement des îles Canaries pour les produits agricoles qui bénéficient
    du régime spécifique prévu aux articles 2 à 5 du règlement (CEE) nº 1601/92
    du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1590/95 der Kommission vom 30. Juni 1995 zur Änderung
    der Verordnung (EWG) Nr. 1727/92 mit besonderen Durchführungsbestimmungen zur
    Versorgung der Azoren und Madeiras mit Getreideerzeugnissen und zur Erstellung
    der vorläufigen Versorgungsbilanz sowie zur Änderung der Verordnung (EG) Nr.
    2883/94 mit der Bedarfsvorausschätzung für die Kanarischen Inseln für die landwirtschaftlichen
    Erzeugnisse, die unter die Sonderregelung gemäß den Artikeln 2 bis 5 der Verordnung
    (EWG) Nr. 1601/92 des Rates fallen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1590/95 af 30. juni 1995 om ændring
    af forordning (EØF) nr. 1727/92 om gennemførelsesbestemmelser for den særlige
    forsyningsordning for Azorerne og Madeira vedrørende kornprodukter og om udarbejdelse
    af opgørelsen over forsyningsbehovene og af forordning (EF) nr. 2883/94 om den
    foreløbige forsyningsopgørelse for De Kanariske Øer for de landbrugsprodukter,
    der er omfattet af den ordning, som er fastsat i artikel 2-5 i Rådets forordning
    (EØF) nr. 1601/92
  type: main
- language: el
  script: Grek
