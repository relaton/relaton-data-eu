  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1590/95, annettu 30 päivänä kesäkuuta 1995,
    Azoreiden ja Madeiran viljatuotteiden erityistä hankintajärjestelmää koskevista
    yksityiskohtaisista säännöistä ja arvioidun hankintataseen vahvistamisesta
    annetun asetuksen (ETY) N:o 1727/92 muuttamisesta sekä Kanariansaarten arvioidun
    hankintataseen vahvistamisesta neuvoston asetuksen (ETY) N:o 1601/92 2-5 artiklassa
    säädettyyn erityiseen järjestelmään kuuluvien maataloustuotteiden osalta
    annetun asetuksen (EY) N:o 2883/94 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1590/95 della Commissione, del 30 giugno 1995, che
    modifica il regolamento (CEE) n. 1727/92 relativo alle modalità di applicazione
    del regime specifico per l' approvvigionamento cerealicolo delle Azzorre e di
    Madera e al bilancio previsionale di approvvigionamento, nonché il regolamento
    (CE) n. 2883/94 che stabilisce il bilancio previsionale di approvvigionamento
    delle isole Canarie per i prodotti agricoli che beneficiano del regime specifico
    previsto dagli articoli da 2 a 5 del regolamento (CEE) n. 1601/92 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1590/95 van de Commissie van 30 juni 1995 houdende
    wijziging van enerzijds Verordening (EEG) nr. 1727/92 houdende bepalingen ter
    uitvoering van de specifieke regeling voor de voorziening van de Azoren en Madeira
    met graanprodukten, en tot vaststelling van de voorzieningsbalans, en anderzijds
    Verordening (EG) nr. 2883/94 tot vaststelling van een geraamde balans voor de
    voorziening van de Canarische eilanden met landbouwprodukten waarvoor de in de
    artikelen 2 tot en met 5 van Verordening (EEG) nr. 1601/92 van de Raad bedoelde
    specifieke regeling geldt
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1590/95 da Comissão, de 30 de Junho de 1995, que
    altera, por um lado, o Regulamento (CEE) nº 1727/92 que estabelece normas de
    execução do regime específico para o abastecimento em produtos cerealíferos
    dos Açores e da Madeira e que estabelece a estimativa das necessidades de abastecimento,
    e, por outro, o Regulamento (CE) nº 2883/94, que estabelece a estimativa das
    necessidades de abastecimento das Ilhas Canárias em produtos agrícolas que beneficiam
    do regime específico previsto nos artigos 2º a 5º do Regulamento (CEE) nº
    1601/92 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1590/95 de la Comisión, de 30 de junio de 1995, por
    el que se modifica, por una parte, el Reglamento (CEE) nº 1727/92, por el que
    se establecen las disposiciones de aplicación del régimen específico para el
    abastecimiento de productos del sector de los cereales a las Azores y Madeira
    y el plan de previsiones de abastecimiento, y, por otra, el Reglamento (CE) nº
    2883/94, por el que se establece el plan de previsiones de abastecimiento a las
    islas Canarias de productos agrícolas acogidos al régimen específico establecido
    en los artículos 2, 3, 4, y 5 del Reglamento (CEE) nº 1601/92 del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1590/95 av den 30 juni 1995 om ändring
    dels av förordning (EEG) nr 1727/92 om fastställande av närmare bestämmelser
    för tillämpning av den särskilda ordningen för tillförsel av spannmålsprodukter
    till Azorerna och Madeira och om upprättande av den prognostiserade försörjningsbalansen
    för dessa produkter och dels av förordning (EG) nr 2883/94 om upprättande av
    en prognostiserad försörjningsbalans för försörjningen av Kanarieöarna med
    de jordbruksprodukter som omfattas av den särskilda ordningen som föreskrivs
    i artiklarna 2, 3, 4 och 5 i rådets förordning (EEG) nr 1601/92
