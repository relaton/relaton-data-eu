  script: Latn
  content: Commission Regulation (EC) No 1021/2008 of 17 October 2008 amending Annexes
    I, II and III to Regulation (EC) No 854/2004 of the European Parliament and of
    the Council laying down specific rules for the organisation of official controls
    on products of animal origin intended for human consumption and Regulation (EC)
    No 2076/2005 as regards live bivalve molluscs, certain fishery products and staff
    assisting with official controls in slaughterhouses
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1021/2008 de la Commission du 17 octobre 2008 modifiant
