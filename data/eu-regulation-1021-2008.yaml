    et du Conseil fixant les règles spécifiques d’organisation des contrôles
    officiels concernant les produits d’origine animale destinés à la consommation
    humaine et le règlement (CE) n o 2076/2005 en ce qui concerne les mollusques
    bivalves vivants, certains produits de la pêche et le personnel prenant part
    aux contrôles officiels dans les abattoirs
  type: main
