title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1073/86 of 14 April 1986 re-establishing
    the levying of customs duties on gramophone records and other sound or similar
    recordings, falling within heading No 92.12, originating in South Korea, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3599/85
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1073/86 de la Commission du 14 avril 1986 portant
    rétablissement de la perception des droits de douane applicables aux supports
    de son pour les appareils du numéro 92.11 ou pour enregistrements analogues,
    de la position 92.12 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1073/86 der Kommission vom 14. April 1986 zur Wiedereinführung
    der Erhebung der Zölle für Tonträger und andere Aufzeichnungsträger, für
    Geräte der Tarifnummer 92.11 oder für ähnliche Aufnahmeverfahren der Tarifnummer
    92.12 des Gemeinsamen Zolltarifs mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1073/86 af 14. april 1986 om genindførelse
    af opkrævning af told for grammofonplader og andre lydoptagelser eller lignende
    optagelser henhørende under position 92.12 i den fælles toldtarif og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3599/85
  type: main
- language: el
  script: Grek
