    režimą, numatytą susitarimuose tarp Bendrijos ir Bulgarijos ir Rumunijos
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1704/2005 van de Commissie van 18 oktober 2005 tot
