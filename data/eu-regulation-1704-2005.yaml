    v zaří 2005 pro některé produkty z vepřového masa v rámci režimu stanoveného
    dohodami uzavřenými mezi Společenstvím a Bulharskem a Rumunskem
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1704/2005 af 18. oktober 2005 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i september
    2005 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1704/2005 της Επιτροπής,
    της 18ης Οκτωβρίου 2005, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Σεπτεμβρίου 2005
