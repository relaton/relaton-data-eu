title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1704/2005 of 18 October 2005 determining
    the extent to which applications lodged in September 2005 for import licences
    for certain pigmeat products under the regime provided for by the Agreements concluded
    by the Community with the Republic of Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1704/2005 de la Commission du 18 octobre 2005 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2005 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la Bulgarie
    et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1704/2005 der Kommission vom 18. Oktober 2005 über
    die Festsetzung des Umfangs, in dem die im September 2005 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Schweinefleischerzeugnisse entsprechend der
    Regelung der Abkommen zwischen der Gemeinschaft und Bulgarien und Rumänien genehmigt
    werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1704/2005 ze dne 18. října 2005, kterým
