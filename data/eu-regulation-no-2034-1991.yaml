title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2034/91 of 11 July 1991 fixing for the 1991/92
    marketing year the production aid for tinned pineapple and the minimum price to
    be paid to pineapple producers
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2034/91 DE LA COMMISSION du 11 juillet 1991 fixant
    pour la campagne 1991/1992, le montant de l'' aide à la production pour les conserves
    d'' ananas ainsi que le prix minimal à payer aux producteurs d'' ananas #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2034/91 DER KOMMISSION vom 11. Juli 1991 zur Festsetzung
    der Beihilfe zur Erzeugung von Ananaskonserven und des den Ananaserzeugern zu
    zahlenden Mindestpreises für das Wirtschaftsjahr 1991/92 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2034/91 af 11. juli 1991 om fastsættelse
    for produktionsåret 1991/92 af producentstøtten for ananaskonserves og den minimumspris,
    der skal betales ananasproducenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2034/91 της Επιτροπής
    της 11ης Ιουλίου 1991 που καθορίζει, για το εμπορικό
    έτος 1991/92, την ενίσχυση στην παραγωγή για τις
    κονσέρβες ανανά και την ελάχιστη τιμή που θα
    πληρωθεί στους παραγωγούς ανανά
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2034/91 DELLA COMMISSIONE dell'' 11 luglio 1991 che
    fissa, per la campagna di commercializzazione 1991/1992, l'' aiuto alla produzione
    per le conserve di ananassi ed il prezzo minimo da pagare ai produttori di ananassi
    #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2034/91 VAN DE COMMISSIE van 11 juli 1991 tot vaststelling,
    voor het verkoopseizoen 1991/1992 van het bedrag van de steun voor de produktie
    van ananasconserven en van de minimumprijs die aan de ananasproducenten moet worden
    betaald #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2034/91 DA COMISSÃO de 11 de Julho de 1991 que fixa,
    para a campanha de comercialização de 1991/1992, o montante da ajuda à produção
    para as conservas de ananás e o preço mínimo a pagar aos produtores de ananás
    #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2034/91 DE LA COMISIÓN de 11 de julio de 1991 por
    el que se fijan, para la campaña 1991/92, la ayuda a la producción para las
    conservas de piña y el precio mínimo que habrá de pagarse a los productores
    de piña #'
  type: main
