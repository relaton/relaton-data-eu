title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1522/2000 of 10 July 2000 imposing a definitive
    anti-dumping duty on imports of synthetic staple fibres of polyester originating
    in Australia, Indonesia and Thailand and collecting definitively the provisional
    duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1522/2000 du Conseil du 10 juillet 2000 instituant
    un droit antidumping définitif sur les importations de fibres synthétiques discontinues
    de polyesters originaires d'Australie, d'Indonésie et de Thaïlande, et portant
    perception définitive du droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1522/2000 des Rates vom 10. Juli 2000 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren synthetischer Spinnfasern
    aus Polyester mit Ursprung in Australien, Indonesien und Thailand und zur endgültigen
    Vereinnahmung des vorläufigen Zolls
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1522/2000 ze dne 10. července 2000 o uložení
    konečného antidumpingového cla z dovozu syntetických střižových vláken
    polyesterů pocházejících z Austrálie, Indonésie a Thajska a o konečném
    výběru uloženého prozatímního cla
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1522/2000 af 10. juli 2000 om indførelse af
    endelig antidumpingtold på import af korte syntetiske fibre af polyester med
    oprindelse i Australien, Indonesien og Thailand og om endelig opkrævning af den
    midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1522/2000 του Συμβουλίου,
    της 10ης Ιουλίου 2000, για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές συνθετικών
    μη συνεχών ινών από πολυεστέρες, καταγωγής
    Αυστραλίας, Ινδονησίας και Ταϊλάνδης και την
    οριστική είσπραξη του επιβληθέντος προσωρινού
    δασμού
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1522/2000, 10. juuli 2000, millega kehtestatakse
    Austraaliast, Indoneesiast ja Taist pärinevate polüestrist sünteesstaapelkiudude
    impordi suhtes lõplik dumpinguvastane tollimaks ja nõutakse lõplikult sisse
    kõnealuse impordi suhtes kehtestatud ajutine tollimaks
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1522/2000, annettu 10 päivänä heinäkuuta
    2000, lopullisen polkumyyntitullin käyttöönotosta Australiasta, Indonesiasta
    ja Thaimaasta peräisin olevien polyesterikatkokuitujen tuonnissa ja käyttöön
    otetun väliaikaisen tullin lopullisesta kantamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1522/2000/EK rendelete (2000. július 10.) az Ausztráliából,
    Indonéziából és Thaiföldről származó szintetikus vágott poliészter szálak
    behozatalára vonatkozó végleges dömpingellenes vám kivetéséről és a kivetett
    ideiglenes vámok végleges beszedéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1522/2000 del Consiglio, del 10 luglio 2000, che istituisce
    un dazio antidumping definitivo sulle importazioni di fibre sintetiche in fiocco
    di poliesteri originarie dell'Australia, dell'Indonesia e della Thailandia e che
    riscuote definitivamente i dazi provvisori
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1522/2000 (2000. gada 10. jūlijs), ar ko piemēro
