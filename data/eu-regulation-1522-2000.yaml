    u li jiġbor id-dazju provviżorju impost
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1522/2000 van de Raad van 10 juli 2000 tot instelling
    van een definitief antidumpingrecht op de invoer van synthetische stapelvezels
    van polyester uit Australië, Indonesië en Thailand en tot definitieve inning
    van het voorlopige recht
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1522/2000 z dnia 10 lipca 2000 r. nakładające
    ostateczne cło antydumpingowe na przywóz syntetycznych włókien odcinkowych
    z poliestru pochodzących z Australii, Indonezji i Tajlandii i stanowiące o ostatecznym
    poborze nałożonego cła tymczasowego
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1522/2000 do Conselho, de 10 de Julho de 2000, que
    institui um direito anti-dumping definitivo sobre as importações de fibras sintéticas,
    descontínuas, de poliéster originárias da Austrália, da Indonésia e da Tailândia
    e que estabelece a cobrança definitiva do direito provisório
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1522/2000 z 10. júla 2000, ktoré ukladá konečné
    antidumpingové clo na dovozy syntetickej polyesterovej striže s pôvodom v Austrálii,
    Indonézii a Thajsku a vyberá s konečnou platnosťou uložené dočasné clo
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1522/2000 z dne 10. julija 2000 o uvedbi dokončne
