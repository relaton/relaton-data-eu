    poliestera sintētisko štāpeļšķiedru importu un galīgi iekasē uzlikto pagaidu
    maksājumu
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 10 d. Tarybos Reglamentas (EB) Nr. 1522/2000 įvedantis
