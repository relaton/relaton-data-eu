  content: Commission Regulation (EEC) No 2824/79 of 13 December 1979 amending Regulation
    (EEC) No 2568/79 on the sale at a price fixed in advance of boned beef and veal
    held by the Irish intervention agency and intended for export
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2824/79 de la Commission, du 13 décembre 1979, modifiant
