title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 1294/2009 of 22 December 2009 imposing
    a definitive anti-dumping duty on imports of certain footwear with uppers of leather
    originating in Vietnam and originating in the People's Republic of China, as extended
    to imports of certain footwear with uppers of leather consigned from the Macao
    SAR, whether declared as originating in the Macao SAR or not, following an expiry
    review pursuant to Article 11(2) of Council Regulation (EC) No 384/96
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n o 1294/2009 du Conseil du 22 décembre 2009
    instituant un droit antidumping définitif sur les importations de certaines chaussures
    à dessus en cuir originaires du Viêt Nam et de la République populaire de Chine,
    étendu aux importations de certaines chaussures à dessus en cuir expédiées
    de la RAS de Macao, qu'elles aient ou non été déclarées originaires de la
    RAS de Macao, à la suite d'un réexamen au titre de l'expiration des mesures
    mené conformément à l'article 11, paragraphe 2, du règlement (CE) n o 384/96
    du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1294/2009 des Rates vom 22. Dezember
    2009 zur Einführung eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter
    Schuhe mit Oberteil aus Leder mit Ursprung in Vietnam und in der Volksrepublik
    China, ausgeweitet auf aus der Sonderverwaltungsregion Macau versandte Einfuhren
    bestimmter Schuhe mit Oberteil aus Leder, ob als Ursprungserzeugnisse der Sonderverwaltungsregion
    Macau angemeldet oder nicht, nach einer Auslaufüberprüfung nach Artikel 11 Absatz
    2 der Verordnung (EG) Nr. 384/96 des Rates
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 1294/2009 на
    Съвета от 22 декември 2009 година за налагане
    на окончателно антидъмпингово мито върху вноса
    на някои обувки с горна част от естествена
    кожа с произход от Виетнам и с произход от Китайската
    народна република, приложимо и към вноса на
    някои обувки с горна част от естествена кожа,
    доставяни от Административен район със специален
    статут Макао, декларирани или не с произход
    от Административен район със специален статут
    Макао, след преразглеждане с оглед изтичане
    на срока на действие съгласно член 11, параграф
    2 от Регламент (ЕО) № 384/96 на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Rady (EU) č. 1294/2009 ze dne 22. prosince 2009
    o uložení konečného antidumpingového cla na dovoz některé obuvi se svrškem
    z usně pocházející z Vietnamu a Čínské lidové republiky rozšířeného
    na dovoz některé obuvi se svrškem z usně zasílané ze zvláštní administrativní
    oblasti ČLR Macao bez ohledu na to, zda je u něj deklarován původ ze zvláštní
    administrativní oblasti ČLR Macao, na základě přezkumu před pozbytím platnosti
    podle čl. 11 odst. 2 nařízení (ES) č. 384/96
  type: main
