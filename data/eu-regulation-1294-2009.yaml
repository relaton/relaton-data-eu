    ta’ ċertu xedd tas-saqajn bil-parti ta’ fuq tal-ġilda li ġej mill-Vjetnam
    u li joriġina fir-Repubblika tal-Poplu taċ-Ċina, kif estiż għal importazzjonijiet
    ta’ ċertu tipi ta’ xedd tas-saqajn bil-parti ta’ fuq tal-ġilda kkunsinnati
    mill-Makaw SAR, sew jekk dikjarati li joriġinaw fil-Makaw SAR sew jekk le, wara
    reviżjoni tal-iskadenza skont l-Artikolu 11(2) tar-Regolament tal-Kunsill (KE)
    Nru 384/96
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 1294/2009 van de Raad van 22 december 2009
    tot instelling van een definitief antidumpingrecht op bepaald schoeisel met bovendeel
    van leder van oorsprong uit Vietnam en van oorsprong uit de Volksrepubliek China,
    zoals uitgebreid tot bepaald schoeisel met bovendeel van leder verzonden vanuit
    de SAR Macau, al dan niet aangegeven als van oorsprong uit de SAR Macau, naar
    aanleiding van een nieuw onderzoek bij het vervallen van maatregelen op grond
    van artikel 11, lid 2, van Verordening (EG) nr. 384/96 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Rady (UE) nr 1294/2009 z dnia 22 grudnia 2009
