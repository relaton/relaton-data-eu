    kehtestatakse teatavate Vietnamist ja Hiina Rahvavabariigist pärit nahast pealsetega
    jalatsite impordi suhtes lõplik dumpinguvastane tollimaks, mida laiendatakse
    Aomeni erihalduspiirkonnast lähetatud teatavate nahast pealsetega jalatsite impordi
    suhtes, olenemata sellest, kas need on deklareeritud Aomeni erihalduspiirkonnast
    pärinevatena või mitte
  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanoasetus (EU) N:o 1294/2009, annettu 22 päivänä
    joulukuuta 2009 , Vietnamista ja Kiinan kansantasavallasta peräisin olevien tiettyjen
    jalkineiden, joiden päälliset ovat nahkaa, tuonnissa käyttöön otettavasta
    lopullisesta polkumyyntitullista, sellaisena kuin se on laajennettuna koskemaan
    Macaon erityishallintoalueelta lähetettyjen tiettyjen jalkineiden, joiden päälliset
    ovat nahkaa, tuontia riippumatta siitä, onko niiden alkuperämaaksi ilmoitettu
    Macaon erityishallintoalue, asetuksen (EY) N:o 384/96 11 artiklan 2 kohdan mukaisen
    toimenpiteiden voimassaolon päättymistä koskevan tarkastelun seurauksena
  type: main
- language: hu
  script: Latn
  content: A Tanács 1294/2009/EU végrehajtási rendelete ( 2009. december 22. )
    a 384/96/EK tanácsi rendelet 11. cikkének (2) bekezdése szerinti, az intézkedések
    lejárati felülvizsgálatot követően a Vietnamból és a Kínai Népköztársaságból
    származó, egyes bőr felsőrésszel rendelkező lábbelik behozatalára vonatkozó,
    a Makaó Különleges Közigazgatási Területről szállított – a Makaóból
    való származás bejelentésére tekintet nélkül –, egyes bőr felsőrésszel
    rendelkező lábbelik behozatalára kiterjesztett – végleges dömpingellenes
    vám kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 1294/2009 del Consiglio, del 22 dicembre
    2009 , che istituisce un dazio antidumping definitivo sulle importazioni di alcuni
    tipi di calzature con tomaie di cuoio originarie del Vietnam e della Repubblica
    popolare cinese esteso alle importazioni di alcuni tipi di calzature con tomaie
    di cuoio spedite dalla RAS di Macao, a prescindere che siano dichiarate o no originarie
    della RAS di Macao, in seguito ad un riesame in previsione della scadenza a norma
    dell'articolo 11, paragrafo 2, del regolamento (CE) n. 384/96 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Padomes Īstenošanas regula (ES) Nr. 1294/2009 ( 2009. gada 22. decembris
    ), ar ko pēc termiņa beigu pārskatīšanas, kuru veica saskaņā ar Regulas
    (EK) Nr. 384/96 11. panta 2. punktu, uzliek galīgo antidempinga maksājumu, ko
    piemēro dažu tādu Vjetnamas un Ķīnas Tautas Republikas izcelsmes apavu importam,
    kuriem ir ādas virsa, un ko attiecina arī uz šā paša ražojuma importu no
    Makao īpašās pārvaldes apgabala, neatkarīgi no tā, vai ražojumi ir vai
    nav deklarēti ar izcelsmi Makao īpašās pārvaldes apgabalā
  type: main
- language: lt
  script: Latn
  content: 2009 m. gruodžio 22 d. Tarybos įgyvendinimo reglamentas (ES) Nr. 1294/2009,
    kuriuo, pagal Tarybos reglamento (EB) Nr. 384/96 11 straipsnio 2 dalį atlikus
    priemonių galiojimo termino peržiūrą, tam tikrai importuojamai Vietnamo ir
    Kinijos Liaudies Respublikos kilmės avalynei su batviršiais iš odos nustatomas
    galutinis antidempingo muitas, kurio taikymas išplėstas tam tikrai importuojamai
    iš Ypatingojo Administracinio Kinijos Regiono Makao siunčiamai avalynei su batviršiais
    iš odos, deklaruojamai kaip Ypatingojo Administracinio Kinijos Regiono Makao
    kilmės arba ne
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni (KE) Nru 1294/2009 tal-Kunsill tat- 22
