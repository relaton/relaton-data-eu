    cholewkami wysyłanego ze Specjalnego Regionu Administracyjnego Makau, zgłoszonego
    lub niezgłoszonego jako pochodzące ze Specjalnego Regionu Administracyjnego
    Makau, w następstwie przeglądu wygaśnięcia zgodnie z art. 11 ust. 2 rozporządzenia
    (WE) nr 384/96
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. o 1294/2009 do Conselho, de 22 de Dezembro
    de 2009 , que institui um direito anti-dumping definitivo sobre as importações
    de determinado tipo de calçado com a parte superior de couro natural originário
    do Vietname e da República Popular da China, tornado extensivo às importações
    de determinado tipo de calçado com a parte superior de couro natural expedido
    da RAE de Macau, quer seja ou não declarado originário da RAE de Macau, na sequência
    de um reexame da caducidade nos termos do n. o 2 do artigo 11. o do Regulamento
    (CE) n. o 384/96 do Conselho
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 1294/2009 al Consiliului din
    22 decembrie 2009 de instituire a unei taxe antidumping definitive la importurile
    de anumite tipuri de încălțăminte cu fețe din piele originare din Vietnam
    și din Republica Populară Chineză, astfel cum a fost extinsă la importurile
    de anumite tipuri de încălțăminte cu fețe din piele expediate din RAS Macao,
    indiferent dacă acestea sunt declarate ca originare din RAS Macao sau nu, în
    urma unei reexaminări în perspectiva expirării măsurilor, în temeiul articolului
    11 alineatul (2) din Regulamentul (CE) nr. 384/96
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Rady (EÚ) č. 1294/2009 z 22. decembra 2009 ,
    ktorým sa ukladá konečné antidumpingové clo na dovoz určitej obuvi so zvrškom
    z usne s pôvodom vo Vietname a v Čínskej ľudovej republike, rozšírené na
    dovoz určitej obuvi so zvrškom z usne zasielanej z OAO Macao, ktorá má, alebo
    nemá deklarovaný pôvod v OAO Macao, na základe preskúmania pred uplynutím
    platnosti v súlade s článkom 11 ods. 2 nariadenia Rady (ES) č. 384/96
  type: main
- language: sl
  script: Latn
  content: Izvedbena Uredba Sveta (EU) št. 1294/2009 z dne 22. decembra 2009 o uvedbi
    dokončne protidampinške dajatve na uvoz določene obutve z zgornjim delom iz
    usnja s poreklom iz Vietnama in s poreklom iz Ljudske Republike Kitajske, kakor
    je bila razširjena na uvoz določene obutve z zgornjim delom iz usnja, poslane
    iz Posebne upravne regije Macao, ne glede na to, ali je deklarirana kot izdelek
    s poreklom iz Posebne upravne regije Macao ali ne, na osnovi pregleda zaradi izteka
    ukrepov na podlagi člena 11(2) Uredbe Sveta (ES) št. 384/96
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n o 1294/2009 del Consejo, de 22 de diciembre
    de 2009 , por el que se establece un derecho antidumping definitivo sobre las
    importaciones de determinado calzado con parte superior de cuero originario de
    Vietnam y originario de la República Popular China, y ampliado a las importaciones
    del mismo producto procedentes de la RAE de Macao, independientemente de que el
    origen declarado sea o no la RAE de Macao, a raíz de una reconsideración por
    expiración, de conformidad con el artículo 11, apartado 2, del Reglamento (CE)
    n o 384/96
  type: main
- language: sv
  script: Latn
  content: Rådets genomförandeförordning (EU) nr 1294/2009 av den 22 december 2009
    om införande av en slutgiltig antidumpningstull på import av vissa skodon med
    överdelar av läder med ursprung i Vietnam och Folkrepubliken Kina, utvidgad
    till att omfatta import av vissa skodon med överdelar av läder som avsänds
    från den särskilda administrativa regionen Macao, oavsett om produktens deklarerade
    ursprung är den särskilda administrativa regionen Macao eller inte, efter en
    översyn vid giltighetstidens utgång enligt artikel 11.2 i förordning (EG) nr
    384/96
