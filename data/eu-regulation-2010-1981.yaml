title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2010/81 of 13 July 1981 amending Regulation
    (EEC) No 471/76 as regards the period of suspension of the application of the
    condition on prices governing the importation into the Community of fresh lemons
    originating in certain Mediterranean countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2010/81 du Conseil, du 13 juillet 1981, modifiant
    le règlement (CEE) n° 471/76 en ce qui concerne la période de suspension de
    l' application de la condition en matière de prix à laquelle est soumise l'
    importation dans la Communauté de citrons frais originaires de certains pays
    du bassin Méditerranéen
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2010/81 des Rates vom 13. Juli 1981 zur Änderung
    der Verordnung (EWG) Nr. 471/76 hinsichtlich der Dauer der Aussetzung der Anwendung
    der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung in einigen
    Ländern des Mittelmeerraums in die Gemeinschaft unterliegt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2010/81 af 13. juli 1981 om ændring af forordning
    (EØF) nr. 471/76 for så vidt angår suspensionsperioden for den vedrørende
    priserne gældende betingelse for indførsel til Fællesskabet af friske citroner
    med oprindelse i visse middelhavslande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2010/81 τού Συμβουλίου
    τής 13ης Ιουλίου 1981 περί τροποποιήσεως τού κανονισμού
    (ΕΟΚ) αριθ. 471/76 «περί τής περιόδου αναστολής
    τής εφαρμογής τού όρου σχετικά μέ τήν τιμή
    στήν οποία υπόκειται η εισαγωγή στήν Κοινότητα
    νωπών λεμονιών καταγωγής ορισμένων χωρών τής
    λεκάνης τής Μεσογείου»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2010/81 del Consiglio, del 13 luglio 1981, che modifica
    il regolamento (CEE) n. 471/76 per quanto riguarda il periodo durante il quale
    è sospesa l' applicazione della condizione in materia di prezzi cui è soggetta
    l' importazione nella Comunità di limoni freschi originari di taluni paesi del
    bacino mediterraneo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2010/81 van de Raad van 13 juli 1981 tot wijziging
    van Verordening (EEG) nr. 471/76 met betrekking tot de periode waarin de toepassing
    van de voorwaarde ten aanzien van de prijs waaraan de invoer in de Gemeenschap
    van verse citroenen van oorsprong uit sommige landen van het Middellandse-Zeegebied
    is onderworpen wordt geschorst
