title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/485 of 27 February 2026 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize NK603 pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2026) 1227)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/485 de la Commission du 27 février
    2026 renouvelant l’autorisation de mise sur le marché de produits contenant
    du maïs génétiquement modifié NK603, consistant en ce maïs ou produits à
    partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2026) 1227]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/485 der Kommission vom 27. Februar 2026
    zur Erneuerung der Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte NK603 enthalten, daraus bestehen oder hergestellt
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2026) 1227)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2026/485 на Комисията
    от 27 февруари 2026 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    царевица NK603, в съответствие с Регламент (ЕО)
    № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2026) 1227)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/485 ze dne 27. února 2026 o
    obnovení povolení pro uvádění produktů, které obsahují geneticky modifikovanou
    kukuřici NK603, sestávají z ní nebo jsou z ní vyrobeny, na trh podle nařízení
    Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2026)
    1227)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/485 af 27. februar 2026
    om forlængelse af tilladelsen til markedsføring af produkter, der indeholder,
    består af eller er fremstillet af genetisk modificeret NK603-majs, i henhold
    til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt under
    nummer C(2026) 1227)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/485 της Επιτροπής,
    της 27ης Φεβρουαρίου 2026, για την ανανέωση της
    έγκρισης της διάθεσης στην αγορά προϊόντων
    που περιέχουν, αποτελούνται ή παράγονται από
    γενετικώς τροποποιημένο αραβόσιτο NK603 σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1829/2003 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου [κοινοποιηθείσα
    υπό τον αριθμό C(2026) 1227]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2026/485, 27. veebruar 2026, millega pikendatakse
    geneetiliselt muundatud maisi NK603 sisaldavate, sellest koosnevate või sellest
    toodetud toodete turuleviimise loa kehtivust vastavalt Euroopa Parlamendi ja nõukogu
    määrusele (EÜ) nr 1829/2003 (teatavaks tehtud numbri C(2026) 1227 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2026/485, annettu 27 päivänä
    helmikuuta 2026, muuntogeenistä maissia NK603 sisältävien, siitä koostuvien
    tai siitä valmistettujen tuotteiden markkinoille saattamista koskevan luvan uusimisesta
    Euroopan parlamentin ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu
    numerolla C(2026) 1227)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2026/485 ón gCoimisiún an 27 Feabhra 2026
    lena n-athnuaitear an t-údarú chun táirgí a chur ar an margadh, ar táirgí
    iad ina bhfuil arbhar Indiach géinmhodhnaithe NK603, nó atá comhdhéanta de
    nó a tháirgtear as, de bhun Rialachán (CE) Uimh. 1829/2003 ó Pharlaimint na
    hEorpa agus ón gComhairle (tugadh fógra faoi leis an doiciméad C(2026) 1227)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2026/485 оd 27. veljače 2026. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani
    kukuruz NK603, od njega se sastoje ili su od njega proizvedeni, u skladu s Uredbom
    (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem dokumenta
    C(2026) 1227)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/485 végrehajtási határozata (2026. február 27.)
    a géntechnológiával módosított NK603 kukoricát tartalmazó, abból álló
    vagy abból előállított termékek forgalomba hozatalára vonatkozó engedély
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2026) 1227. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/485 della Commissione, del 27 febbraio
    2026, che rinnova l’autorizzazione all’immissione in commercio di prodotti
    contenenti, costituiti o derivati da granturco geneticamente modificato NK603
    in conformità al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2026) 1227]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2026/485 (2026. gada 27. februāris),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu NK603,
    sastāv vai ir ražoti no tās (izziņots ar dokumenta numuru C(2026) 1227)
  type: main
- language: lt
  script: Latn
  content: 2026 m. vasario 27 d. Komisijos įgyvendinimo sprendimas (ES) 2026/485,
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 atnaujinamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų NK603, kurie iš jų sudaryti arba pagaminti (pranešta dokumentu Nr.
    C(2026) 1227)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2026/485 tas-27
    ta’ Frar 2026 li ġġedded l-awtorizzazzjoni għall-introduzzjoni fis-suq ta’
    prodotti li fihom il-qamħirrum ġenetikament modifikat NK603, li jikkonsistu
    minnu, jew li huma prodotti minnu, skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament
    Ewropew u tal-Kunsill (notifikata bid-dokcument C(2026) 1227)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2026/485 van de Commissie van 27 februari 2026
    tot verlenging van de vergunning voor het in de handel brengen van producten die
    geheel of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais NK603 overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement
    en de Raad (Kennisgeving geschied onder nummer C(2026) 1227)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/485 z dnia 27 lutego 2026 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    kukurydzę NK603, składających się z niej lub z niej wyprodukowanych (notyfikowana
    jako dokument nr C(2026) 1227)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2026/485 da Comissão, de 27 de fevereiro de
    2026, que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por ou sejam produzidos a partir de milho geneticamente modificado
    NK603 nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento Europeu e do
    Conselho [notificada com o número C(2026) 1227]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2026/485 a Comisiei din 27 februarie
    2026 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din porumbul modificat genetic NK603 în
    temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2026) 1227]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/485 z 27. februára 2026, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu NK603, sú z nej zložené alebo vyrobené [oznámené pod číslom C(2026)
    1227]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2026/485 z dne 27. februarja 2026 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo NK603,
    so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo (ES) št. 1829/2003 Evropskega
    parlamenta in Sveta (notificirano pod dokumentarno številko C(2026) 1227)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2026/485 de la Comisión, de 27 de febrero
    de 2026, por la que se renueva la autorización de comercialización de productos
    que contengan o estén compuestos por maíz modificado genéticamente NK603 o
    hayan sido producidos a partir de él, con arreglo al Reglamento (CE) n.o 1829/2003
    del Parlamento Europeo y del Consejo [notificada con el número C(2026) 1227]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2026/485 av den 27 februari 2026
    om förlängning av godkännandet för utsläppande på marknaden av produkter
    som innehåller, består av eller har framställts av den genetiskt modifierade
    majsen NK603 i enlighet med Europaparlamentets och rådets förordning (EG) nr
    1829/2003 [delgivet med nr C(2026) 1227]
