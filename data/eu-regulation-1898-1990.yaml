title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1898/90 of 4 July 1990 specifying the extent
    to which applications lodged in June 1990 for import licences in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1898/90 de la Commission, du 4 juillet 1990, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de juin 1990 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1898/90 der Kommission vom 4. Juli 1990 über das
    Ausmaß, in dem den im Juni 1990 eingereichten Anträgen auf Einfuhrlizenzen für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1898/90 af 4. juli 1990 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet 1 juni
    1990 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1898/90 της Επιτροπής
    της 4ης Ιουλίου 1990 περί καθορισμού σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    την έκδοση πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούνιο 1990 για τα νεαρά άρρενα βοοειδή που
    προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1898/90 della Commissione, del 4 luglio 1990, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di giugno 1990 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1898/90 van de Commissie van 4 juli 1990 tot bepaling
    van de mate waarin de in juni 1990 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mannelijke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1898/90 da Comissão, de 4 de Julho de 1990, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apresentados no mês de Junho de 1990 para os bovinos machos jovens
    destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1898/90 de la Comisión, de 4 de julio de 1990, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de junio de 1990 para los machos
    jóvenes de la especie bovina destinados al engorde
  type: main
