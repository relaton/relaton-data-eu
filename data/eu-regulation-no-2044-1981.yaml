  content: Commission Regulation (EEC) No 2044/81 of 20 July 1981 derogating for the
    1981/82 marketing year from the time limit for lodging contracts to castor seeds
    laid down in Regulation (EEC) No 2081/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2044/81 de la Commission, du 20 juillet 1981, dérogeant,
