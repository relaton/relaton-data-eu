title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1289/2005 of 4 August 2005 initiating an
    investigation concerning the possible circumvention of anti-dumping measures imposed
    by Council Regulation (EC) No 408/2002 on imports of certain zinc oxides originating
    in the People's Republic of China by imports of certain zinc oxides consigned
    from Kazakhstan, whether declared as originating in Kazakhstan or not, and making
    such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1289/2005 de la Commission du 4 août 2005 portant
    ouverture d'une enquête sur le contournement possible des mesures antidumping
    instituées par le règlement (CE) n° 408/2002 du Conseil sur les importations
    de certains oxydes de zinc originaires de la République populaire de Chine par
    des importations de certains oxydes de zinc expédiés du Kazakhstan, qu'ils aient
    ou non été déclarés originaires de ce pays, et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1289/2005 der Kommission vom 4. August 2005 zur Einleitung
