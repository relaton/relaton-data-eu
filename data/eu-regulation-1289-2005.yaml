    (EG) Nr. 408/2002 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Zinkoxide mit Ursprung in der Volksrepublik China durch die
    Einfuhren bestimmter aus Kasachstan versandter Zinkoxide, ob als Ursprungserzeugnisse
    Kasachstans angemeldet oder nicht, und zur zollamtlichen Erfassung der letztgenannten
    Einfuhren
  type: main
