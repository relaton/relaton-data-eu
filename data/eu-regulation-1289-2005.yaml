  type: main
- language: hu
  script: Latn
  content: A Bizottság 1289/2005/EK rendelete (2005. augusztus 4.) a Kínai Népköztársaságból
    származó egyes cink-oxidok behozatalára vonatkozó végleges dömpingellenes
    vámok kivetéséről szóló 408/2002/EK tanácsi rendelet által kivetett dömpingellenes
    intézkedéseknek a Kazahsztánból feladott, akár Kazahsztánból származóként,
    akár nem ilyenként megjelölt, egyes cink-oxidok behozatala által megvalósuló
    esetleges kijátszására vonatkozó vizsgálat kezdeményezéséről és az ilyen
    behozatalok nyilvántartásba vételének elrendeléséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1289/2005 della Commissione, del 4 agosto 2005, che
    avvia un’inchiesta sulla possibile elusione delle misure antidumping istituite
    dal regolamento (CE) n. 408/2002 del Consiglio sulle importazioni di alcuni ossidi
    di zinco originari della Repubblica popolare cinese tramite importazioni di ossidi
    di zinco spediti dal Kazakstan, indipendentemente dal fatto che siano dichiarati
    o meno originari di tale paese, e che dispone la registrazione di dette importazioni
  type: main
