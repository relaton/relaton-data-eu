    Regulu (EK) Nr. 408/2002 piemēroti dažu Ķīnas Tautas Republikas izcelsmes
    cinka oksīdu importam, ko veic, nosūtot tos no Kazahstānas un deklarējot vai
    nedeklarējot kā Kazahstānas izcelsmes ražojumus, un par šāda importa reģistrāciju
  type: main
