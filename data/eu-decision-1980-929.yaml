id: EUDecision1980929
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/929/EEC: Commission Decision of 12 September 1980 authorizing the Italian
    Republic not to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats,
    twinsets, cardigans, bed-jackets and jumpers, falling within subheading ex 60.05
    A of the Common Customs Tariff (category 5), originating in South Korea and in
    free circulation in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/929/CEE: Décision de la Commission, du 12 septembre 1980, autorisant
    la République italienne à exclure du traitement communautaire les chandails,
    "pullovers", "twinsets", gilets et vestes, de la sous-position ex 60.05 A du tarif
    douanier commun (catégorie 5), originaires de Corée du Sud et mis en libre pratique
    dans les autres Etats membres (Le texte en langue italienne est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '80/929/EWG: Entscheidung der Kommission vom 12. September 1980 mit der
    die Italienische Republik ermächtigt wird, aus Südkorea stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Pullover, Slipover, Twinsets,
    Westen und Strickjacken der Tarifstelle ex 60.05 A des Gemeinsamen Zolltarifs
    (Kategorie 5) von der Gemeinschaftsbehandlung auszuschließen (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/929/EØF: Kommissionens beslutning af 12. september 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage sweatere,
    pullovere, slipovere, cardigans, cardigansæt, jumpere, trøjer og veste, som
    henhører under pos. ex 60.05 A i den fælles toldtarif (kategori 5), har oprindelse
    i Sydkorea og frit kan omsættes i de øvrige medlemsstater (Kun den italienske
    udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/929/CEE: Decisione della Commissione, del 12 settembre 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario le maglie e i
    pullover, con o senza maniche, slip-over, twinsets, giubbetti e giacche, della
    sottovoce ex 60.05 A della tariffa doganale comune, categoria 5, originari della
    Corea del Sud e messi in libera pratica negli altri Stati membri (Il testo in
    lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/929/EEG: Beschikking van de Commissie van 12 september 1980 waarbij
    de Italiaanse Republiek wordt gemachtigd truien, jumpers, pullovers, slipovers,
    twinsets, vesten en jasjes van post ex 60.05 A van het gemeenschappelijk douanetarief
    (categorie 5), van oorsprong uit Zuid-Korea en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de tekst in de Italiaanse taal is authentiek)'
  type: main
