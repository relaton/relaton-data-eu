title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2428/2000 of 31 October 2000 granting Portugal
    a derogation for the 2000/01 marketing year from Articles 1(1) and 20(1) of Regulation
    (EC) No 2366/98 laying down detailed rules for the application of the system of
    production aid for olive oil
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2428/2000 de la Commission du 31 octobre 2000 dérogeant
    pour le Portugal à l'article 1er , paragraphe 1, et à l'article 20, paragraphe
    1, du règlement (CE) nº 2366/98 portant modalités d'application du régime
    d'aide à la production d'huile d'olive pour la campagne de commercialisation
    2000/2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2428/2000 der Kommission vom 31. Oktober 2000 über
    die Abweichung Portugals von Artikel 1 Absatz 1 und Artikel 20 Absatz 1 der Verordnung
    (EG) Nr. 2366/98 mit Durchführungsbestimmungen zur Beihilferegelung für die
    Erzeugung von Olivenöl im Wirtschaftsjahr 2000/01
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2428/2000 af 31. oktober 2000 om fravigelse
    for Portugals vedkommende af artikel 1, stk. 1 og artikel 20, stk. 1, i forordning
    (EF) nr. 2366/98 om gennemførelsesbestemmelser for ordningen for produktionsstøtte
    for olivenolie for produktionsåret 2000/01
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2428/2000 της Επιτροπής,
    της 31ης Οκτωβρίου 2000, σχετικά με την παρέκκλιση
    για την Πορτογαλία από το άρθρο 1 παράγραφος
    1 και το άρθρο 20 παράγραφος 1 του κανονισμού
    (ΕΚ) αριθ. 2366/98 για τις λεπτομέρειες εφαρμογής
    του καθεστώτος ενίσχυσης στην παραγωγή ελαιολάδου
    για την περίοδο εμπορίας 2000/01
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2428/2000, annettu 31 päivänä lokakuuta 2000,
    oliiviöljyn tuotantotukijärjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä markkinointivuodeksi 2000/2001 annetun asetuksen (EY) N:o 2366/98
    1 artiklan 1 kohdasta ja 20 artiklan 1 kohdasta poikkeamisesta Portugalin osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2428/2000 della Commissione, del 31 ottobre 2000, che
    deroga, per il Portogallo, all'articolo 1, paragrafo 1, e all'articolo 20, paragrafo
    1, del regolamento (CE) n. 2366/98 recante modalità di applicazione del regime
    di aiuto alla produzione di olio di oliva per la campagna di commercializzazione
    2000/2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2428/2000 van de Commissie van 31 oktober 2000 tot
    afwijking, voor Portugal, van artikel 1, lid 1, en artikel 20, lid 1, van Verordening
    (EG) nr. 2366/98 houdende uitvoeringsbepalingen van de productiesteunregeling
    voor olijfolie voor het verkoopseizoen 2000/2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2428/2000 da Comissão, de 31 de Outubro de 2000,
    que introduz uma derrogação, aplicável a Portugal, do n.o 1 do artigo 1.o e
    do n.o 1 do artigo 20.o do Regulamento (CE) n.o 2366/98, que estabelece as normas
    de execução do regime de ajuda à produção de azeite para a campanha de comercialização
    de 2000/2001
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2428/2000 de la Comisión, de 31 de octubre de 2000,
    que establece, con respecto a Portugal, excepciones a lo dispuesto en el apartado
    1 del artículo 1 y en el apartado 1 del artículo 20 del Reglamento (CE) nº
    2366/98 por el que se establecen disposiciones de aplicación del régimen de
    ayuda a la producción de aceite de oliva para la campaña de comercialización
    2000/01
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2428/2000 av den 31 oktober 2000 om undantag
    för Portugal från artikel 1.1 och artikel 20.1 i förordning (EG) nr 2366/98
    om tillämpningsföreskrifter för systemet med produktionsstöd för olivolja
    för regleringsåret 2000/01
