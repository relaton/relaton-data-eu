title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2267/92 of 3 August 1992 re-establishing
    the levying of customs duties on products falling within CN codes 3903, ex 3915
    and ex 3920, originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2267/92 de la Commission du 3 août 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits des codes NC 3903,
    ex 3915 et ex 3920 originaires du Brésil, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2267/92 DER KOMMISSION vom 3. August 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 3903, ex 3915 und ex 3920
    mit Ursprung in Brasilien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 2267/92 af 3. august 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3903, ex 3915 og ex
    3920 og med oprindelse i Brasilien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2267/92 της Επιτροπής
    της 3ης Αυγούστου 1992 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα προϊόντα
    των κωδικών ΣΟ 3903, ex 3915 και ex 3920, καταγωγής Βραζιλίας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2267/92 DELLA COMMISSIONE del 3 agosto 1992 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti dei codici NC 3903, ex
    3915 e ex 3920 originari del Brasile, beneficiario delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2267/92 VAN DE COMMISSIE van 3 augustus 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 3903, ex 3915 en ex 3920, van oorsprong uit Brazilië, waarvoor
    de in Verordening (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn
    verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2267/92 DA COMISSÃO de 3 de Agosto de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos dos códigos NC 3903,
    ex 3915 e ex 3920, originários do Brasil, beneficiários das preferências pautais
    previstas no Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2267/92 DE LA COMISIÓN de 3 de agosto de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos de los códigos NC 3903, ex 3915 y ex 3920 originarios de Brasil, beneficiarios
    de las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90
    del Consejo #'
