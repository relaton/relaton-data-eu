    yhteydessä
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2016/39 оd 14. siječnja 2016. o izmjeni
    Priloga I. Uredbi (EZ) br. 798/2008 u pogledu unosa za Meksiko na popisu trećih
    zemalja, državnih područja, zona ili kompartmenta iz kojih je dozvoljen uvoz
    u Uniju i provoz kroz nju određenih proizvoda od peradi u vezi s visokopatogenom
    influencom ptica
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2016/39 végrehajtási rendelete (2016. január 14.)
    az erősen patogén madárinfluenza kapcsán a 798/2008/EK rendelet I. mellékletének
    az egyes baromfiáruk Unióba történő behozatala vagy Unión keresztül történő
    átszállítása céljából engedélyezett harmadik országok, területek, övezetek
    és területi egységek jegyzékének a Mexikóra vonatkozó bejegyzés tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2016/39 della Commissione, del 14 gennaio
    2016, che modifica l'allegato I del regolamento (CE) n. 798/2008 per quanto riguarda
    la voce relativa al Messico nell'elenco di paesi terzi, loro territori, zone o
    compartimenti da cui determinati prodotti ottenuti dal pollame possono essere
    importati o transitare nell'Unione in relazione all'influenza aviaria ad alta
    patogenicità
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2016/39 (2016. gada 14. janvāris),
    ar ko Regulas (EK) Nr. 798/2008 I pielikumu groza attiecībā uz ierakstu par
    Meksiku to trešo valstu, teritoriju, zonu vai nodalījumu sarakstā, no kuriem
    saistībā ar augstas patogenitātes putnu gripu atļauts Savienībā importēt
    vai tranzītā caur to pārvadāt konkrētas mājputnu izcelsmes preces
  type: main
- language: lt
  script: Latn
  content: 2016 m. sausio 14 d. Komisijos įgyvendinimo reglamentas (ES) 2016/39,
    kuriuo dėl labai patogeniško paukščių gripo ir su šia liga susijusio Meksikos
    įrašo trečiųjų šalių, teritorijų, zonų ar skyrių, iš kurių galima
    importuoti į Sąjungą ir vežti tranzitu per Sąjungą tam tikras naminių paukščių
    prekes, sąraše iš dalies keičiamas Reglamento (EB) Nr. 798/2008 I priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2016/39 tal-14 ta'
    Jannar 2016 li jemenda l-Anness I tar-Regolament (KE) Nru 798/2008 fir-rigward
    tal-entrata għall-Messiku fil-lista ta' pajjiżi terzi, territorji, żoni jew
    kumpartimenti li minnhom jistgħu jiġu importati lejn l-Unjoni, jew jgħaddu
    mill-Unjoni bi tranżitu, ċerti prodotti tat-tjur b'rabta mal-influwenza tat-tjur
    b'patoġeniċità għolja
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2016/39 van de Commissie van 14 januari 2016
    tot wijziging van bijlage I bij Verordening (EG) nr. 798/2008 wat betreft de vermelding
    voor Mexico in de lijst van derde landen, gebieden, zones of compartimenten waaruit
    bepaalde pluimveeproducten mogen worden ingevoerd in en doorgevoerd door de Unie
    in verband met hoogpathogene aviaire influenza
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2016/39 z dnia 14 stycznia 2016
    r. zmieniające załącznik I do rozporządzenia (WE) nr 798/2008 w zakresie wpisu
    dotyczącego Meksyku w wykazie państw trzecich, terytoriów, stref lub grup,
    z których dopuszczalny jest przywóz do Unii i tranzyt przez jej terytorium niektórych
    towarów drobiowych w związku z wysoce zjadliwą grypą ptaków
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2016/39 da Comissão, de 14 de janeiro de
    2016, que altera o anexo I do Regulamento (CE) n.° 798/2008 no que se refere
    à entrada relativa ao México na lista de países terceiros, territórios, zonas
    ou compartimentos a partir dos quais são autorizados a importação e o trânsito
    na União de determinados produtos à base de aves de capoeira, relativamente
    à gripe aviária de alta patogenicidade
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2016/39 al Comisiei din 14 ianuarie
    2016 de modificare a anexei I la Regulamentul (CE) nr. 798/2008 în ceea ce privește
    rubrica referitoare la Mexic din lista țărilor terțe, teritoriilor, zonelor
    sau compartimentelor din care anumite produse obținute de la păsări de curte
    pot fi importate în Uniune sau pot tranzita Uniunea în contextul riscului de
    gripă aviară înalt patogenă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2016/39 zo 14. januára 2016, ktorým
    sa mení príloha I k nariadeniu (ES) č. 798/2008, pokiaľ ide o položku týkajúcu
    sa Mexika v zozname tretích krajín, území, oblastí alebo jednotiek, z ktorých
    možno do Únie dovážať alebo cez jej územie prevážať určité komodity
    z hydiny v súvislosti s vysokopatogénnou vtáčou chrípkou
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2016/39 z dne 14. januarja 2016 o spremembi
    Priloge I k Uredbi (ES) št. 798/2008 glede vnosa za Mehiko na seznamu tretjih
    držav, ozemelj, območij ali kompartmentov, iz katerih sta dovoljena uvoz nekaterega
    perutninskega blaga v Unijo ter njegov tranzit skozi Unijo v zvezi z visokopatogeno
    aviarno influenco
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2016/39 de la Comisión, de 14 de enero de
    2016, que modifica el anexo I del Reglamento (CE) n° 798/2008 en lo referente
    a la entrada relativa a México en la lista de terceros países, territorios,
    zonas o compartimentos desde los cuales están permitidos la importación en la
    Unión o el tránsito por la misma de determinadas mercancías de aves de corral,
    en relación con la influenza aviar de alta patogenicidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2016/39 av den 14 januari 2016
    om ändring av bilaga I till förordning (EG) nr 798/2008 vad gäller uppgifterna
    om Mexiko i förteckningen över tredjeländer, områden, zoner eller delområden
    från vilka vissa varor av fjäderfä får importeras till eller transiteras genom
    unionen i samband med högpatogen aviär influensa
