    με την υψηλής παθογονικότητας γρίπη των πτηνών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2016/39, 14. jaanuar 2016, millega muudetakse
    seoses kõrge patogeensusega linnugripiga määruse (EÜ) nr 798/2008 I lisas
    esitatud kannet Mehhiko kohta loetelus, milles on esitatud need kolmandad riigid,
