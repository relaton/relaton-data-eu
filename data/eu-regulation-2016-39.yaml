title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/39 of 14 January 2016 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Mexico in the
    list of third countries, territories, zones or compartments from which certain
    poultry commodities may be imported into or transit through the Union in relation
    to highly pathogenic avian influenza
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/39 de la Commission du 14 janvier 2016
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives au Mexique sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci, quant à l'influenza aviaire hautement
    pathogène
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/39 der Kommission vom 14. Januar 2016
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich des
    Eintrags zu Mexiko in der Liste der Drittländer, Gebiete, Zonen und Kompartimente,
    aus denen mit Blick auf die hochpathogene Aviäre Influenza die Einfuhr bestimmter
    Geflügelwaren in die Union und ihre Durchfuhr durch die Union zugelassen ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2016/39 на Комисията
    от 14 януари 2016 година за изменение във връзка
    с високопатогенна инфлуенца по птиците на
    приложение I към Регламент (ЕО) № 798/2008 по отношение
    на вписването за Мексико в списъка на трети
    държави, територии, зони или компартменти,
    от които могат да бъдат внасяни или да преминават
    транзитно през територията на Съюза определени
    стоки, получени от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2016/39 ze dne 14. ledna 2016, kterým
    se mění příloha I nařízení (ES) č. 798/2008, pokud jde o položku pro
    Mexiko na seznamu třetích zemí, území, oblastí nebo jednotek, z nichž lze
    do Unie dovážet nebo přes její území přepravovat určité drůbeží komodity
    v souvislosti s vysoce patogenní influenzou ptáků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2016/39 af 14. januar 2016
    om ændring af bilag I til forordning (EF) nr. 798/2008 for så vidt angår oplysningerne
    om Mexico i listen over tredjelande, områder, zoner og segmenter, hvorfra import
    til eller transit gennem Unionen af visse fjerkræprodukter er tilladt i forbindelse
    med højpatogen aviær influenza
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2016/39 της Επιτροπής,
    της 14ης Ιανουαρίου 2016, για την τροποποίηση
    του παραρτήματος I του κανονισμού (ΕΚ) αριθ.
    798/2008 όσον αφορά την καταχώριση του Μεξικού
    στον κατάλογο τρίτων χωρών, εδαφών, ζωνών ή
    διαμερισμάτων από τα οποία επιτρέπεται να
