title:
- language: en
  script: Latn
  content: '84/49/EEC: Commission Decision of 17 January 1984 authorizing the French
    Republic to introduce intra- Community surveillance in respect of imports of certain
    slippers and other indoor footwear and certain beach slippers originating in the
    People''s Republic of China (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/49/CEE: Décision de la Commission du 17 janvier 1984 autorisant la
    République française à instaurer une surveillance intracommunautaire à l''égard
    des importations de certaines pantoufles et autres chaussures d''intérieur et
    certaines espadrilles originaires de la République populaire de Chine (Le texte
    en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '84/49/EWG: Entscheidung der Kommission vom 17. Januar 1984 zur Ermächtigung
    der Französischen Republik, eine innergemeinschaftliche Überwachung der Einfuhren
    von bestimmten Pantoffeln und anderen Hausschuhen sowie bestimmten Schuhen des
    Typs ,,Espadrilles''''mit Ursprung in der Volksrepublik China einzuführen (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/49/EØF: Kommissionens beslutning af 17. januar 1984 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med importen
    af visse typer hjemmefodtøj og visse strandsandaler med oprindelse i Den kinesiske
    Folkerepublik (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/49/ΕΟΚ: Απόφαση της Επιτροπής της 17ης Ιανουαρίου
    1984 για την παροχή αδείας στη Γαλλική Δημοκρατία
    να θεσπίσει ενδοκοινοτική επιτήρηση για τις
    εισαγωγές ορισμένων παντοφλών και ετέρων υποδημάτων
    δωματίου και ορισμένων υποδημάτων με εξωτερικό
    πέλμα από σχοινί, καταγωγής Λαϊκής Δημοκρατίας
