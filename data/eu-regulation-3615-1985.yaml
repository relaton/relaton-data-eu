    1985 e da riportare all' esercizio 1986
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3615/85 van de Commissie van 20 december 1985 tot
    wijziging van Verordening (EEG) nr. 3375/85 betreffende de vaststelling van de
    prijzen die in aanmerking moeten worden genomen voor de berekening van de waarde
