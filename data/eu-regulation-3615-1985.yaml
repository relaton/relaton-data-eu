    Berechnung des Wertes der am 30. November 1985 bei der Intervention eingelagerten
    und auf das Haushaltsjahr 1986 zu übertragenden Agrarerzeugnisse zu berücksichtigen
    sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3615/85 af 20. december 1985 om ændring
