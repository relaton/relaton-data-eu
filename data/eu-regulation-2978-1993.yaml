  content: COMMISSION REGULATION (EEC) No 2978/93 of 28 October 1993 amending Regulation
    (EEC) No 3900/92 laying down the special rules of application for the Community
    import arrangements for certain species of preserved tuna, bonito and sardines
    and fixing the quantities of those products which may be imported during 1993
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2978/93 de la Commission du 28 octobre 1993 modifiant
    le règlement (CEE) n° 3900/92 établissant les modalités d'application particulières
    du régime communautaire d'importation de conserves de thon, de bonites et de
    sardines et fixant les quantités de ces produits admises à l'importation pour
    1993
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2978/93 DER KOMMISSION vom 28. Oktober 1993 zur Änderung
    der Verordnung (EWG) Nr. 3900/92 mit besonderen Durchführungsbestimmungen zu
    der Einfuhrregelung für bestimmte Thunfisch-, Bonito- und Sardinenkonserven und
    zur Festsetzung der zugelassenen Einfuhrmengen für 1993
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2978/93 af 28. oktober 1993 om ændring
    af forordning (EØF) nr. 3900/92 om særlige gennemførelsesbestemmelser for Fællesskabets
    importordning for konserves af visse arter af tunfisk, bonit og sardin og om fastsættelse
    af de mængder af samme produkter, der kan indføres i 1993
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2978/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 28ης Οκτωβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3900/92 για τη θέσπιση των
    ειδικών λεπτομερειών εφαρμογής του κοινοτικού
    καθεστώτος εισαγωγής κονσερβών τόνου, παλαμίδας
    και σαρδέλας και για τον καθορισμό των ποσοτήτων
    αυτών των προϊόντων που γίνονται αποδεκτά
    για εξαγωγή για το 1993
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2978/93 DELLA COMMISSIONE del 28 ottobre 1993 recante
    modifica del regolamento (CEE) n. 3900/92 che stabilisce le modalità particolari
    di applicazione del regime comunitario di importazione per le conserve di talune
    specie di tonno, di palamita e di sardine e che fissa i quantitativi di tali prodotti
    ammessi all' importazione per il 1993
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2978/93 VAN DE COMMISSIE van 28 oktober 1993 tot
    wijziging van Verordening (EEG) nr. 3900/92 houdende uitvoeringsbepalingen van
    de communautaire invoerregeling voor conserven van bepaalde soorten tonijn, boniet
    en sardines, alsmede van de hoeveelheden van deze produkten die in 1993 mogen
    worden ingevoerd
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2978/93 DA COMISSÃO de 28 de Outubro de 1993 que
    altera o Regulamento (CEE) nº 3900/92, que estabelece as normas de execução
    específicas do regime comunitário de importação de conservas de determinadas
    espécies de atum, de bonito e de sardinha e fixa as quantidades destes produtos
    admitidas para importação em 1993
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) Nº 2978/93 DE LA COMISIÓN de 28 de octubre de 1993 por
    el que se modifica el Reglamento (CEE) nº 3900/92 de la Comisión, por el que
    se establecen las disposiciones especiales de aplicación del régimen comunitario
    de importación de conservas de determinadas especies de atún, bonito y sardinas
    y por el que se fijan las cantidades de estos productos que se admiten para importación
    en 1993
