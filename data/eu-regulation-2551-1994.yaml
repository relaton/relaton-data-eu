  content: Commission Regulation (EC) No 2551/94 of 20 October 1994 determining the
    extent to which application lodged in October 1994 for import licences for certain
    pigmeat products under the regime provided for by the Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    and Slovak Federal Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2551/94 de la Commission, du 20 octobre 1994, déterminant
