title:
- language: en
  script: Latn
  content: '79/833/EEC: Commission Decision of 7 September 1979 laying down, for the
    purposes of the survey on the structure of agricultural holdings for 1979/80,
    the Community outline of the schedule of tables, the standard code and the detailed
    rules for the transcription on to magnetic tape of the data contained in such
    tables'
  type: main
- language: fr
  script: Latn
  content: '79/833/CEE: Décision de la Commission, du 7 septembre 1979, fixant, en
    vue de l'' enquête sur la structure des exploitations agricoles en 1979/1980,
    le schéma communautaire d'' un programme de tableaux, le code uniforme et les
    modalités d'' application pour la transcription sur bande magnétique des données
    de ces tableaux'
  type: main
- language: de
  script: Latn
  content: '79/833/EWG: Entscheidung der Kommission vom 7. September 1979 zur Festlegung
    eines nach dem Gemeinschaftsschema erstellten Tabellenprogramms, eines einheitlichen
    Kodes sowie der Durchführungsbestimmungen für die Übertragung der Daten aus
    den genannten Tabellen auf Magnetbänder zum Zweck der Durchführung einer Erhebung
    über die Struktur der landwirtschaftlichen Betriebe 1979/1980'
  type: main
- language: da
  script: Latn
  content: '79/833/EØF: Kommissionens beslutning af 7. september 1979 om fastsættelse
    med henblik på undersøgelsen af landbrugsbedrifternes struktur i 1979/80 af
    fællesskabsmodellen for et tabelprogram, standardkoden og gennemførelsesbestemmelserne
    for overførelsen på magnetbånd af oplysninger i disse tabeller'
  type: main
- language: el
  script: Grek
  content: '79/833/EOK: Απόφαση της Επιτροπής της 7ης Σεπτεμβρίου
    1979 περί καθορισμού, για τους σκοπούς της μελέτης
    για τη δομή των γεωργικών επιχειρήσεων για
    το 1979/1980, του κοινοτικού σχήματος προγράμματος
    πινάκων, του ενιαίου κώδικος και των τρόπων
    εφαρμογής για τημεταγραφή σε μαγνητοταινία
    των στοιχείων που περιέχονται σε τέτοιους
    πίνακες'
  type: main
- language: it
  script: Latn
  content: '79/833/CEE: Decisione della Commissione, del 7 settembre 1979, che stabilisce,
    ai fini dell'' indagine sulla struttura delle aziende agricole 1979/1980, lo schema
    comunitario di un programma di tabelle, il codice uniforme e le modalità di applicazione
    per la trascrizione dei dati su nastro magnetico'
  type: main
- language: nl
  script: Latn
  content: '79/833/EEG: Beschikking van de Commissie van 7 september 1979 houdende
    vaststelling, voor de enquête inzake de structuur van de landbouwbedrijven 1979/1980,
    van het communautaire schema voor een tabellenprogramma en de uniforme code en
    de wijze van toepassing voor het opnemen van de gegevens van deze tabellen op
    magneetbanden'
  type: main
- language: pt
  script: Latn
  content: '79/833/CEE: Decisão da Comissão, de 7 de Setembro de 1979, que fixa,
    tendo em vista o inquérito sobre a estrutura das explorações agrícolas em
    1979/1980, o esquema comunitário de um programa de quadros, o código uniforme
    e as regras de aplicação para a transcrição em banda magnética dos dados
    destes quadros'
  type: main
- language: es
  script: Latn
  content: '79/833/CEE: Decisión de la Comisión, de 7 de septiembre de 1979, por
    la que se establecen, con vistas a la encuesta sobre la estructura de las explotaciones
    agrícolas en 1979/80, el esquema comunitario de un programa de cuadros, el código
    uniforme y las modalidades de aplicación para la transcripción en cinta magnética
    de los datos de dichos cuadros'
  type: main
