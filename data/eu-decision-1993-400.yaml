    for så vidt angår indførsel fra tredjelande af plantemateriale og formeringsmateriale
    af grønsagsplanter bortset fra frø'
  type: main
- language: el
  script: Grek
  content: '93/400/ΕΟΚ: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 16ης
