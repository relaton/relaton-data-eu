    hinsichtlich der Einfuhr von aus Drittländern stammendem Gemüsepflanzgut und
    Gemüsevermehrungsmaterial mit Ausnahme von Saatgut'
  type: main
- language: da
  script: Latn
  content: '93/400/EØF: KOMMISSIONENS BESLUTNING af 16. juni 1993 om udsættelse
