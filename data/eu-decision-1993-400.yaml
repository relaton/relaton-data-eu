  script: Latn
  content: '93/400/EEC: Commission Decision of 16 June 1993 deferring, as regards
    the import of vegetable propagating and planting material, other than seed, from
    third countries, the date referred to in Article 16 (2) of Directive 92/33/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/400/CEE: Décision de la Commission du 16 juin 1993 prorogeant, en
    ce qui concerne les importations de plants de légumes et de matériels de multiplication
    des légumes, autres que les semences, en provenance de pays tiers, le délai
    fixé à l''article 16 paragraphe 2 de la directive 92/33/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '93/400/EWG: ENTSCHEIDUNG DER KOMMISSION vom 16. Juni 1993 zur Verlängerung
