    Trinidad ja Tobagosta ja Amerikan yhdysvalloista peräisin olevien urean ja ammoniumnitraatin
    seosten tuonnissa täytäntöönpanoasetuksella (EU) 2019/1688 käyttöön otettuja
    lopullisia polkumyyntitulleja
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/2070 ón gCoimisiún an 26 Deireadh
    Fómhair 2022 na dleachtanna frithdhumpála cinntitheacha ar allmhairí meascáin
    d’úire agus níotráit amóiniam de thionscnamh na Rúise, Oileán na Tríonóide
    agus Tobága agus Stáit Aontaithe Mheiriceá arna bhforchur le Rialachán Cur
    Chun Feidhme (AE) 2019/1688, gan na dleachtanna sin a chur ar fionraí
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/2070 оd 26. listopada 2022. o nesuspendiranju
    konačne antidampinške pristojbe na uvoz smjese uree i amonijeva nitrata podrijetlom
    iz Rusije, Trinidada i Tobaga te Sjedinjenih Američkih Država uvedene Provedbenom
    uredbom Komisije (EU) 2019/1688
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2070 végrehajtási határozata (2022. október
    26.) az (EU) 2019/1688 végrehajtási rendelettel az Oroszországból, a Trinidad
    és Tobagóból, valamint az Amerikai Egyesült Államokból származó karbamid–ammónium-nitrát
    keverékek behozatalára kivetett végleges dömpingellenes vám felfüggesztésének
    elutasításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/2070 della Commissione del 26 ottobre
    2022 che stabilisce di non sospendere i dazi antidumping definitivi sulle importazioni
    di miscugli di urea e nitrato di ammonio originari della Russia, di Trinidad e
    Tobago e degli Stati Uniti d'America istituiti dal regolamento di esecuzione (UE)
    2019/1688
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/2070 (2022. gada 26. oktobris)
    neapturēt galīgos antidempinga maksājumus, kas ar Īstenošanas regulu (ES)
    2019/1688 noteikti Krievijas, Trinidādas un Tobāgo un Amerikas Savienoto Valstu
    izcelsmes urīnvielas un amonija nitrāta maisījuma importam
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/2070 2022 m. spalio 26 d.
