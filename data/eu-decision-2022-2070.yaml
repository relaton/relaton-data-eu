    l-importazzjonijiet ta’ taħlitiet ta’ urea u nitrat tal-ammonju li joriġinaw
    mir-Russja, minn Trinidad u Tobago u mill-Istati Uniti tal-Amerka imposti bir-Regolament
    ta’ Implimentazzjoni (UE) 2019/1688
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/2070 van de Commissie van 26 oktober 2022
    tot niet-schorsing van de bij Uitvoeringsverordening (EU) 2019/1688 ingestelde
    definitieve antidumpingrechten op mengsels van ureum en ammoniumnitraat van oorsprong
    uit Rusland, Trinidad en Tobago en de Verenigde Staten van Amerika
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/2070 z dnia 26 października 2022
    r. o niezawieszaniu ostatecznych ceł antydumpingowych nałożonych rozporządzeniem
    wykonawczym (UE) 2019/1688 na przywóz mieszanin mocznika i azotanu amonu pochodzących
    z Rosji, Trynidadu i Tobago oraz Stanów Zjednoczonych Ameryki
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/2070 da Comissão de 26 de outubro de
    2022 de não suspender os direitos anti-dumping definitivos sobre as importações
    de misturas de ureia com nitrato de amónio originárias da Rússia, de Trindade
    e Tobago e dos Estados Unidos da América, instituídos pelo Regulamento de Execução
    (UE) 2019/1688
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/2070 a Comisiei din 26 octombrie
    2022 de a nu suspenda taxele antidumping definitive la importurile de amestecuri
    de uree și de azotat de amoniu originare din Rusia, Trinidad și Tobago și Statele
    Unite ale Americii instituite prin Regulamentul de punere în aplicare (UE) 2019/1688
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/2070 z 26. októbra 2022 o
    nepozastavení konečných antidumpingových ciel na dovoz zmesi močoviny a dusičnanu
    amónneho s pôvodom v Rusku, na Trinidade a Tobagu a v Spojených štátoch amerických
    uložených vykonávacím nariadením (EÚ) 2019/1688
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/2070 z dne 26. oktobra 2022 o neopustitvi
    dokončnih protidampinških dajatev na uvoz mešanice sečnine in amonijevega
    nitrata s poreklom iz Rusije, Trinidada in Tobaga ter Združenih držav Amerike,
    uvedenih z Izvedbeno uredbo (EU) 2019/1688
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/2070 de la Comisión de 26 de octubre
