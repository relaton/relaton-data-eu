title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/2070 of 26 October 2022 to not
    suspend the definitive anti-dumping duties on imports of mixture of urea and ammonium
    nitrate originating in Russia, Trinidad and Tobago and the United States of America
    imposed by Implementing Regulation (EU) 2019/1688
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2070 de la Commission du 26 octobre
    2022 de ne pas suspendre les droits antidumping définitifs sur les importations
    de mélanges d’urée et de nitrate d’ammonium originaires de Russie, de Trinité-et-Tobago
    et des États-Unis d’Amérique institués par le règlement d’exécution (UE)
    2019/1688
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/2070 der Kommission vom 26. Oktober 2022
    über die Nichtaussetzung der mit der Durchführungsverordnung (EU) 2019/1688
    eingeführten endgültigen Antidumpingzölle auf die Einfuhren von Mischungen
    von Harnstoff und Ammoniumnitrat mit Ursprung in Russland, Trinidad und Tobago
    und den Vereinigten Staaten von Amerika
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2022/2070 на Комисията
    от 26 октомври 2022 година с цел да не се спира
    действието на окончателните антидъмпингови
    мита върху вноса на смеси от карбамид и амониев
    нитрат с произход от Русия, Тринидад и Тобаго
    и Съединените американски щати, наложени с
    Регламент за изпълнение (ЕС) 2019/1688
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/2070 ze dne 26. října 2022
    o nepozastavení konečného antidumpingového cla uloženého prováděcím nařízením
    (EU) 2019/1688 na dovoz směsí močoviny a dusičnanu amonného pocházejících
    z Ruska, Trinidadu a Tobaga a ze Spojených států amerických
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/2070 af 26. oktober 2022
    om ikke at suspendere den endelige antidumpingtold på importen af blandinger
    af urinstof og ammoniumnitrat med oprindelse i Rusland, Trinidad og Tobago samt
    Amerikas Forenede Stater, der indførtes ved gennemførelsesforordning (EU) 2019/1688
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/2070 της Επιτροπής
    της 26ης Οκτωβρίου 2022 για τη μη αναστολή των
    οριστικών δασμών αντιντάμπινγκ στις εισαγωγές
    μείγματος ουρίας και νιτρικού αμμωνίου καταγωγής
    Ρωσίας, Τρινιδάδ και Τομπάγκο και Ηνωμένων
    Πολιτειών της Αμερικής που επιβλήθηκαν με
    τον εκτελεστικό κανονισμό (ΕΕ) 2019/1688
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/2070, 26. oktoober 2022, mitte peatada
