    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от вида Malus domestica и на
    някои растения за засаждане от вида Berberis thunbergii
    с произход от Турция и за изменение на Регламент
    за изпълнение (ЕС) 2020/1213 по отношение на фитосанитарните
    мерки за въвеждането на растенията за засаждане
    от вида Malus domestica на територията на Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1162 ze dne 22. dubna 2024, kterým
    se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé rostliny
    k pěstování druhu Malus domestica a některé rostliny k pěstování druhu
    Berberis thunbergii pocházející z Turecka, a kterým se mění prováděcí
    nařízení (EU) 2020/1213, pokud jde o fytosanitární opatření pro dovoz rostlin
    druhu Malus domestica k pěstování na území Unie
  type: main
