    huhtikuuta 2024, asetuksen (EU) 2018/2019 muuttamisesta tiettyjen Turkista peräisin
    olevien istutettaviksi tarkoitettujen Malus domestica- ja Berberis thunbergii
    -lajin kasvien osalta ja täytäntöönpanoasetuksen (EU) 2020/1213 muuttamisesta
    siltä osin kuin on kyse istutettaviksi tarkoitettujen Malus domestica -lajin
    kasvien tuomista unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/1162 ón gCoimisiún an 22 Aibreán
    2024 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe Malus domestica le haghaidh plandú agus plandaí áirithe
    Berberis thunbergii le haghaidh plandú de thionscnamh na Tuirce agus lena leasaítear
    Rialachán Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann leis na bearta
    fíteashláintíochta chun plandaí Malus domestica le haghaidh plandú a thabhairt
    isteach i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1162 оd 22. travnja 2024. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrste Malus
    domestica i određenog bilja za sadnju vrste Berberis thunbergii podrijetlom iz
    Turske te o izmjeni Provedbene uredbe (EU) 2020/1213 u pogledu fitosanitarnih
    mjera za unos bilja za sadnju vrste Malus domestica na područje Unije
  type: main
