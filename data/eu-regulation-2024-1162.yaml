    thunbergii egyes Törökországból származó, ültetésre szánt növényei,
    valamint az (EU) 2020/1213 végrehajtási rendeletnek a Malus domestica ültetésre
    szánt növényei Unióba való behozatalára vonatkozó növényegészségügyi
    intézkedések tekintetében történő módosításáról
  type: main
