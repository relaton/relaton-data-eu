    určené na výsadbu druhu Malus Domestica a určité rastliny určené na výsadbu
    druhu Berberis Thunbergii pochádzajúce z Turecka, a ktorým sa mení vykonávacie
    nariadenie (EÚ) 2020/1213, pokiaľ ide o rastlinolekárske opatrenia v súvislosti
    so vstupom rastlín druhu Malus domestica určených na výsadbu na územie Únie
  type: main
