  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1162 al Comisiei din 22 aprilie
    2024 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante destinate plantării din specia Malus domestica
    și anumite plante destinate plantării din specia Berberis thunbergii originare
    din Turcia și de modificare a Regulamentului de punere în aplicare (UE) 2020/1213
    în ceea ce privește măsurile fitosanitare vizând introducerea plantelor destinate
