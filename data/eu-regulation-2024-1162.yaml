    roślin przeznaczonych do sadzenia gatunku Malus domestica i niektórych roślin
    przeznaczonych do sadzenia gatunku Berberis thunbergii pochodzących z Turcji
    i zmieniające rozporządzenie wykonawcze (UE) 2020/1213 w odniesieniu do środków
