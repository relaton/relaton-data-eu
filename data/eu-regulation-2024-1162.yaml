title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1162 of 22 April 2024 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Malus domestica and certain plants for planting of Berberis thunbergii originating
    in Türkiye and amending Implementing Regulation (EU) 2020/1213 as regards the
    phytosanitary measures for the introduction of the Malus domestica plants for
    planting into the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1162 de la Commission du 22 avril 2024
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation appartenant à l’espèce Malus domestica
    et certains végétaux destinés à la plantation appartenant à l’espèce Berberis
    thunbergii, originaires de Turquie, et modifiant le règlement d’exécution
    (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires préalables à l’introduction
    sur le territoire de l’Union des végétaux destinés à la plantation appartenant
    à l’espèce Malus domestica
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1162 der Kommission vom 22. April 2024
    zur Änderung der Durchführungsverordnung (EU) 2018/2019 hinsichtlich einiger
    zum Anpflanzen bestimmter Pflanzen der Art Malus domestica und einiger zum Anpflanzen
    bestimmter Pflanzen der Art Berberis thunbergii mit Ursprung in der Türkei sowie
    zur Änderung der Durchführungsverordnung (EU) 2020/1213 hinsichtlich der Pflanzenschutzmaßnahmen
    für das Einführen der zum Anpflanzen bestimmten Pflanzen der Art Malus domestica
    in das Gebiet der Union
  type: main
- language: bg
  script: Cyrl
