    a determinados vegetales para plantación de Berberis thunbergii originarios de
    Turquía y el Reglamento de Ejecución (UE) 2020/1213 en lo que respecta a las
    medidas fitosanitarias para la introducción de los vegetales para plantación
    de Malus domestica en el territorio de la Unión
