id: EURegulation18921978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1892/78 of 2 August 1978 re-establishing
    the levying of customs duties on gloves, including mittens and mitts, protective
    for all trades, falling within subheading 42.03 B I and originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1892/78 de la Commission, du 2 août 1978, portant
    rétablissement de la perception des droits de douane applicables aux gants, y
    compris les moufles, de protection pour tous métiers, de la sous-position 42.03
    B I du tarif douanier commun, originaires des pays en voie de développement,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1892/78 der Kommission vom 2. August 1978 zur Wiedereinführung
    des Zollsatzes für Handschuhe, einschließlich Fausthandschuhe, Schutzhandschuhe
    für alle Berufe der Tarifstelle 42.03 B I mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1892/78 af 2. august 1978 om genindførelse
    af opkrævning af toldafgifter for handsker (herunder vanter), såvel syede som
    kun tilskårne, beskyttelseshandsker til erhvervsmæssig brug (arbejdshandsker),
    under underposition 42.03 B I, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1892/78 della Commissione, del 2 agosto 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti, comprese le
    muffole, di protezione per qualunque mestiere, della sottovoce doganale 42.03
    B I, originari dei paesi in via di sviluppo beneficiari delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1892/78 van de Commissie van 2 augustus 1978 houdende
    wederinstelling van de heffing van de douanerechten voor handschoenen en wanten,
    werkhandschoenen en -wanten, van post 42.03 B I, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties
    werden geopend
  type: main
