title:
- language: fr
  script: Latn
  content: '67/645/CEE: Décision de la Commission, du 5 octobre 1967, autorisant
    la République française, en vertu de l''article 115 alinéa 1 du Traité, à
    exclure du traitement communautaire les "microscopes" de la position 90.12 du
    Tarif douanier commun, originaires du Japon et mis en libre pratique dans d''autres
    États membres'
  type: main
- language: de
  script: Latn
  content: '67/645/EWG: Entscheidung der Kommission vom 5. Oktober 1967, mit der die
    Französische Republik ermächtigt wird, gemäß Artikel 115 Absatz (1) des Vertrages
    aus Japan stammende und in anderen Mitgliedstaaten im freien Verkehr befindliche
    "Mikroskope" der Tarifnummer 90.12 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '67/645/CEE: Decisione della Commissione, del 5 ottobre 1967, che autorizza
    la Repubblica francese, in virtù dell''articolo 115, primo capoverso, del Trattato,
    ad escludere dal trattamento comunitario i «microscopi» della voce 90.12 della
    tariffa doganale comune, originari del Giappone e immessi in libera pratica in
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '67/645/EEG: Beschikking van de Commissie van 5 oktober 1967 houdende machtiging
    van de Franse Republiek om op grond van artikel 115, eerste alinea, van het Verdrag
    microscopen van post 90.12 van het gemeenschappelijk douanetarief, die van oorsprong
    zijn uit Japan en in andere Lid-Staten in het vrije verkeer zijn gebracht, van
    de communautaire behandeling uit te sluiten'
  type: main
