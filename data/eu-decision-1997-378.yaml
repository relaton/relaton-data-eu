title:
- language: en
  script: Latn
  content: '97/378/EC: Council Decision of 27 January 1997 concerning the conclusion
    on behalf of the European Community of an Echange of Letters recording the common
    understanding on the principles of international cooperation on research and development
    activities in the domain of intelligent manufacturing systems between the European
    Community and the United States of America, Japan, Australia, Canada and the EFTA
    countries of Norway and Switzerland'
  type: main
- language: fr
  script: Latn
  content: '97/378/CE: Décision du Conseil du 27 janvier 1997 concernant la conclusion
    au nom de la Communauté européenne d''un échange de lettres rendant compte
    de l''entente dégagée à propos des principes de coopération internationale
    en matière d''activités de recherche et de développement dans le domaine des
    systèmes de fabrication intelligents entre la Communauté européenne et les
    États-Unis d''Amérique, le Japon, l''Australie, le Canada et les pays AELE de
    Norvège et de Suisse'
  type: main
- language: de
  script: Latn
  content: '97/378/EG: Beschluß des Rates vom 27. Januar 1997 hinsichtlich des Abschlusses
    - im Namen der Europäischen Gemeinschaft - eines Briefwechsels zur Protokollierung
    der Verständigung über die Grundsätze der internationalen Zusammenarbeit bei
    Forschung und Entwicklung im Bereich der intelligenten Fertigungssysteme zwischen
    der Europäischen Gemeinschaft und den Vereinigten Staaten von Amerika, Japan,
    Australien, Kanada und den EFTA-Ländern Norwegen und der Schweiz'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 27 януари 1997 година
    относно сключването от името на Европейската
    общност на размяна на писма, която отразява
    общото разбирателство относно принципите
    на международно сътрудничество в научноизследователската
    и развойна дейност в областта на интелигентните
    производствени системи между Европейската
    общност и Съединените американски щати, Япония,
    Австралия, Канада и страните от ЕАСТ Норвегия
    и Швейцария
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 27. ledna 1997, kterým se jménem Evropského
    společenství uzavírá výměna dopisů zaznamenávající společnou shodu
    na zásadách mezinárodní spolupráce ve výzkumu a vývoji v oblasti inteligentních
    výrobních systémů mezi Evropským společenstvím a Spojenými státy americkými,
    Japonskem, Austrálií, Kanadou a zeměmi ESVO Norskem a Švýcarskem
  type: main
- language: da
  script: Latn
  content: '97/378/EF: Rådets afgørelse af 27. januar 1997 vedrørende indgåelsen
    på det Europæiske Fællesskabs vegne af en brevveksling om bekræftelse af den
    fælles forståelse af principperne for internationalt forsknings- og udviklingssamarbejde
    inden for intelligente fremstillingssystemer mellem det Europæiske Fællesskab
    og Amerikas Forenede Stater, Japan, Australien, Canada og EFTA-landene Norge og
    Schweiz'
  type: main
- language: el
  script: Grek
