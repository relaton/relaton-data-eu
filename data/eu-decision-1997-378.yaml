    η οποία καταγράφει τη διευθέτηση επί των αρχών
    της διεθνούς συνεργασίας για τις δραστηριότητες
    έρευνας και ανάπτυξης στον τομέα των «ευφυών
    συστημάτων βιομηχανικής παραγωγής», μεταξύ
