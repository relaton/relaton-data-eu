    tutkimus- ja kehitystoimintaa koskevan kansainvälisen yhteistyön periaatteista
    älykkäiden valmistusjärjestelmien alalla Euroopan yhteisön sekä Amerikan
    yhdysvaltojen, Japanin, Australian, Kanadan ja EFTA-maiden Norjan ja Sveitsin
    välillä'
  type: main
- language: hr
  script: Latn
  content: '97/378/EZ: Odluka Vijeća od 27. siječnja 1997. o sklapanju u ime Europske
    zajednice razmjene pisama kojom se utvrđuje zajednički dogovor o načelima međunarodne
    suradnje u istraživačkim i razvojnim aktivnostima u području inteligentnih
    proizvodnih sustava između Europske zajednice i Sjedinjenih Američkih Država,
    Japana, Australije i Kanade te Norveške i Švicarske kao zemalja EFTA-e'
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1997. január 27.) az Európai Közösség és az
    Amerikai Egyesült Államok, Japán, Ausztrália, Kanada, valamint az EFTA-tagország
    Norvégia és Svájc közötti, az intelligens gyártási rendszerek területén
    a nemzetközi kutatási és fejlesztési együttműködés elveiben való közös
    megegyezés rögzítéséről szóló levélváltás Európai Közösségek nevében
    történő elfogadásáról
  type: main
- language: it
  script: Latn
  content: '97/378/CE: Decisione del Consiglio del 27 gennaio 1997 riguardante la
    conclusione per conto della Comunità europea di uno scambio di lettere che documenta
    l''approccio comune sui principi di cooperazione internazionale nelle attività
    di ricerca e sviluppo nel settore dei «sistemi intelligenti di fabbricazione»
    (Intelligenti Manufacturing Systems - IMS) tra la Comunità europea e gli Stati
    Uniti d''America, il Giappone, l''Australia, il Canada e i paesi dell''Efta Norvegia
    e Svizzera'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1997. gada 27. janvāris) par vēstuļu apmaiņas noslēgšanu
    Eiropas Kopienas vārdā, kurā ir fiksēta vienota izpratne par starptautiskas
    sadarbības zinātnē un attīstībā darbību principiem automatizētu ražošanas
    sistēmu (IMS) jomā starp Eiropas Kopienu un Amerikas Savienotajām Valstīm,
    Austrāliju, Japānu, Kanādu un EBTA valstīm Norvēģiju un Šveici
  type: main
- language: lt
  script: Latn
  content: 1997 m. sausio 27 d. Tarybos sprendimas dėl pasikeitimo raštais, fiksuojančio
    tarpusavio supratimą dėl Europos bendrijos ir Jungtinių Amerikos Valstijų,
    Japonijos, Australijos, Kanados bei ELPA šalių Norvegijos ir Šveicarijos tarptautinio
    bendradarbiavimo principų mokslinių tyrimų ir taikomojoje veikloje intelektualių
    gamybos sistemų srityje, sudarymo Europos bendrijos vardu
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-27 ta' Jannar li tikkonċerna l-konklużjoni
    f' isem il-Komunità Ewropea ta' Skambju ta' Ittri li jirreġistra l-ftehim komuni
    dwar il-priniċipji ta' koperazzjoni internazzjonali dwar attivitajiet ta' riċerka
    u żvilupp fil-qasam ta' sistemi intelliġenti ta' fabbrikazzjoni bejn il-Komunità
    Ewropea u l-Istati Uniti ta' l-Amerika, il-Ġappun, l-Awstralja, il-Kanada u l-pajjiżi
    ta' l-EAKĦ tan-Norveġja u l-Isvizzera
  type: main
- language: nl
  script: Latn
  content: '97/378/EG: Besluit van de Raad van 27 januari 1997 betreffende de sluiting
    namens de Gemeenschap van een briefwisseling waarbij de gemeenschappelijke overeenstemming
    wordt vastgelegd over de beginselen van internationale samenwerking bij het onderzoek-
    en ontwikkelingswerk op het gebied van intelligente productiesystemen tussen de
    Europese Gemeenschap en de Verenigde Staten van Amerika, Japan, Australië, Canada,
    en de EVA-landen Noorwegen en Zwitserland'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 27 stycznia 1997 r. w sprawie zatwierdzenia w imieniu
    Wspólnoty Europejskiej wymiany listów stanowiącej zapis wspólnych ustaleń
    w sprawie zasad współpracy międzynarodowej obejmującej działalność w zakresie
    badań i rozwoju w dziedzinie inteligentnych systemów produkcji między Wspólnotą
    Europejską a Stanami Zjednoczonymi Ameryki, Japonią, Australią, Kanadą oraz
    państwami EFTA – Norwegią i Szwajcarią
  type: main
- language: pt
  script: Latn
  content: '97/378/CE: Decisão do Conselho de 27 de Janeiro de 1997 relativa à conclusão,
    em nome da Comunidade Europeia, de uma Troca de Cartas que estabelece o entendimento
    comum sobre os princípios de cooperação internacional em actividades de investigação
    e desenvolvimento no domínio dos sistemas inteligentes de fabrico entre a Comunidade
    Europeia e os Estados Unidos da América, o Japão, a Austrália, o Canadá e
    a Noruega e a Suíça, países da EFTA'
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 27 ianuarie 1997 privind încheierea, în numele
    Comunității Europene, a unui schimb de scrisori care consemnează înțelegerea
    privind principiile de cooperare internațională în activitățile de cercetare
    și de dezvoltare din domeniul sistemelor de fabricație inteligente între Comunitatea
    Europeană și Statele Unite ale Americii, Japonia, Australia, Canada și țările
    membre ale AELS, Norvegia și Elveția
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 27. januára 1997, ktorým sa v mene Európskeho spoločenstva
    uzatvára výmena listov zaznamenávajúca spoločnú zhodu na zásadách medzinárodnej
    spolupráce vo výskumných a rozvojových činnostiach v oblasti inteligentných
    výrobných systémov medzi Európskym spoločenstvom a Spojenými štátmi americkými,
    Japonskom, Austráliou, Kanadou a krajinami EZVO, Nórskom a Švajčiarskom
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 27. januarja 1997 o zaključku izmenjave pisem v imenu
    Evropske skupnosti o skupnem dogovoru o načelih mednarodnega sodelovanja pri
    raziskovalnih in razvojnih dejavnostih na področju inteligentnih proizvodnih
    sistemov med Evropsko skupnostjo in Združenimi državami Amerike, Japonsko, Avstralijo,
    Kanado ter državama članicama Efte Norveško in Švico
  type: main
- language: es
  script: Latn
  content: '97/378/CE: Decisión del Consejo de 27 de enero de 1997 relativa a la
    conclusión en nombre de la Comunidad Europea de un Canje de Notas por el que
    se establece el acuerdo común sobre los principios de cooperación internacional
    en actividades de investigación y desarrollo en el ámbito de los sistemas inteligentes
    de fabricación entre la Comunidad Europea y los Estados Unidos de América, Japón,
    Australia, Canadá y los países de la AELC Noruega y Suiza'
  type: main
- language: sv
  script: Latn
  content: '97/378/EG: Rådets beslut av den 27 januari 1997 rörande antagande på
    Europeiska gemenskapens vägnar av en skriftväxling som redovisar den samstämmiga
    uppfattningen rörande principen för internationellt samarbete om aktiviteter
    för forskning och utveckling på området för intelligenta tillverkningssystem
    mellan Europeiska gemenskapen och Amerikas förenta stater, Japan, Australien,
    Kanada samt EFTA-länderna Norge och Schweiz'
