    az újszerű öngyújtók forgalomba hozatalát tiltó, tagállamok által meghozandó
    intézkedések előírásáról szóló 2006/502/EK határozat érvényességének
    meghosszabbításáról (az értesítés a C(2012) 370. számú dokumentummal
    történt)'
  type: main
- language: it
  script: Latn
  content: '2012/53/UE: Decisione di esecuzione della Commissione, del 27 gennaio
    2012 , che proroga la validità della decisione 2006/502/CE la quale fa obbligo
    agli Stati membri di adottare provvedimenti atti a garantire che vengano commercializzati
    solo accendini a prova di bambino e che sia proibita la commercializzazione di
    accendini fantasia [notificata con il numero C(2012) 370]'
  type: main
- language: lv
  script: Latn
  content: '2012/53/ES: Komisijas Īstenošanas lēmums ( 2012. gada 27. janvāris
    ), ar kuru pagarina spēkā esības termiņu Lēmumam 2006/502/EK, ar ko dalībvalstīm
    pieprasa veikt pasākumus, kas atļautu tirgot tikai bērniem drošas šķiltavas
    un aizliegtu tirgot jaunrades šķiltavas (izziņots ar dokumenta numuru C(2012)
    370)'
  type: main
- language: lt
  script: Latn
  content: '2012/53/ES: 2012 m. sausio 27 d. Komisijos įgyvendinimo sprendimas, kuriuo
    pratęsiamas Sprendimo 2006/502/EB, reikalaujančio, kad valstybės narės imtųsi
    priemonių, siekdamos užtikrinti, jog rinkoje būtų platinami tik apsaugą nuo
    vaikų turintys žiebtuvėliai ir uždrausti pateikti į rinką suvenyrinius žiebtuvėlius,
    galiojimas (pranešta dokumentu Nr. C(2012) 370)'
  type: main
- language: mt
  script: Latn
  content: '2012/53/UE: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni tas- 27
    ta’ Jannar 2012 li testendi l-validità tad-Deċiżjoni 2006/502/KE li tirrikjedi
    li l-Istati Membri jieħdu miżuri sabiex jiżguraw li l-lajters li jitqiegħdu
    fis-suq ikunu biss dawk reżistenti għat-tfal u li jipprojbixxu t-tqegħid fis-suq
    tal-lajters magħrufa bħala novelty lighters (notifikata bid-dokument numru C(2012)
    370)'
  type: main
- language: nl
  script: Latn
  content: '2012/53/EU: Uitvoeringsbesluit van de Commissie van 27 januari 2012 tot
    verlenging van de geldigheidsduur van Beschikking 2006/502/EG waarbij de lidstaten
    worden verplicht maatregelen te treffen om ervoor te zorgen dat uitsluitend kinderveilige
    aanstekers op de markt worden gebracht en dat het op de markt brengen van novelty
    lighters wordt verboden (Kennisgeving geschied onder nummer C(2012) 370)'
  type: main
- language: pl
  script: Latn
  content: '2012/53/UE: Decyzja wykonawcza Komisji z dnia 27 stycznia 2012 r. przedłużająca
    obowiązywanie decyzji 2006/502/WE zobowiązującej państwa członkowskie do
    podjęcia środków w celu zapewnienia, by na rynek wprowadzane były wyłącznie
    zapalniczki zabezpieczone przed uruchomieniem przez dzieci, oraz w celu zakazania
    wprowadzania na rynek zapalniczek-gadżetów (notyfikowana jako dokument nr C(2012)
    370)'
  type: main
- language: pt
  script: Latn
  content: '2012/53/UE: Decisão de Execução da Comissão, de 27 de janeiro de 2012
    , que prorroga a validade da Decisão 2006/502/CE que obriga os Estados-Membros
    a tomar as medidas necessárias para garantir que no mercado apenas se colocam
    isqueiros seguros para as crianças e proibir a colocação no mercado de isqueiros
    novidade ( «novelty lighters» ) [notificada com o número C(2012) 370]'
  type: main
- language: ro
  script: Latn
  content: '2012/53/UE: Decizia de punere în aplicare a Comisiei din 27 ianuarie
    2012 de prelungire a valabilității Deciziei 2006/502/CE de obligare a statelor
    membre să adopte măsuri prin care să se asigure că nu se pot introduce pe
    piață decât brichete cu caracteristici de siguranță pentru copii și să
    interzică introducerea pe piață a brichetelor fantezie [notificată cu numărul
    C(2012) 370]'
  type: main
- language: sk
  script: Latn
  content: '2012/53/EÚ: Vykonávacie rozhodnutie Komisie z 27. januára 2012 , ktorým
    sa predlžuje platnosť rozhodnutia 2006/502/ES, ktorým sa členské štáty
    vyzývajú prijať opatrenia s cieľom zabezpečiť, aby sa na trh uvádzali iba
    zapaľovače, ktoré sú zabezpečené proti použitiu deťmi, a zakázať uvádzanie
    zábavných zapaľovačov na trh [oznámené pod číslom K(2012) 370]'
  type: main
- language: sl
  script: Latn
  content: '2012/53/EU: Izvedbeni sklep Komisije z dne 27. januarja 2012 o podaljšanju
    veljavnosti Odločbe 2006/502/ES o zahtevi, da države članice sprejmejo ukrepe
    za zagotovitev, da se dajo na trg samo vžigalniki, ki so varni za otroke, in
    za prepoved dajanja neobičajnih vžigalnikov na trg (notificirano pod dokumentarno
    številko C(2012) 370)'
  type: main
- language: es
  script: Latn
  content: '2012/53/UE: Decisión de Ejecución de la Comisión, de 27 de enero de
    2012 , que prolonga la validez de la Decisión 2006/502/CE, por la que se requiere
    a los Estados miembros que adopten medidas para garantizar que solo se comercialicen
    encendedores con seguridad para niños y que prohíban la comercialización de
    encendedores de fantasía [notificada con el número C(2012) 370]'
  type: main
- language: sv
  script: Latn
  content: '2012/53/EU: Kommissionens genomförandebeslut av den 27 januari 2012 om
    förlängning av giltighetstiden för beslut 2006/502/EG om en förpliktelse för
    medlemsstaterna att förbjuda att icke barnsäkra eller leksaksliknande tändare
    släpps ut på marknaden [delgivet med nr K(2012) 370]'
