title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1963/81 of 10 July 1981 fixing for the 1981/82
    marketing year the minimum price to be paid to producers and the amount of production
    aid for certain products processed from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1963/81 de la Commission, du 10 juillet 1981, fixant,
    pour la campagne 1981/1982, le prix minimal à payer aux producteurs ainsi que
    le montant de l' aide à la production pour certains produits transformés à
    base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1963/81 der Kommission vom 10. Juli 1981 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe
    für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse für das Wirtschaftsjahr
    1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1963/81 af 10. juli 1981 om fastsættelse
    for produktionsåret 1981/82 af producentstøtten og den minimumspris, der skal
    betales til producenterne, for visse produkter forarbejdet på basis af frugt
    og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1963/81 τής Επιτροπής
