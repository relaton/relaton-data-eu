    τιμής πού πρέπει νά πληρώνεται στούς παραγωγούς
    καθώς καί τού ποσού ενισχύσεως στήν παραγωγή
    γιά ορισμένα μεταποιημένα προϊόντα μέ βάση
    τά οπωροκηπευτικά, γιά τήν περίοδο 1981/82
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1963/81 della Commissione, del 10 luglio 1981, che
    fissa, per la campagna 1981/1982, il prezzo minimo da pagare ai produttori nonché
    l' importo dell' aiuto alla produzione per taluni prodotti trasformati a base
    di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1963/81 van de Commissie van 10 juli 1981 tot vaststelling,
