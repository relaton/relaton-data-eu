---
id: EUDirective200041
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Directive 2000/41/EC of 19 June 2000 postponing for a second
    time the date after which animal tests are prohibited for ingredients or combinations
    of ingredients of cosmetic products
  type: main
- language: fr
  script: Latn
  content: Directive 2000/41/CE de la Commission du 19 juin 2000 reportant pour la
    seconde fois la date à partir de laquelle des expérimentations sur des animaux
    sont interdites pour des ingrédients ou des combinaisons d'ingrédients de produits
    cosmétiques
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/41/EG der Kommission vom 19. Juni 2000 zur zweiten Aufschiebung
    des Termins, ab dem Tierversuche für Bestandteile oder Kombinationen von Bestandteilen
    kosmetischer Mittel untersagt sind
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/41/EO на Комисията от 19 юни 2000
    година относно отлагането за втори път на датата,
    след която се забраняват експериментите на
    съставки или комбинации от съставки за козметични
    продукти върху животни
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/41/ES ze dne 19. června 2000, kterou se podruhé
    odkládá termín, po němž budou zakázány zkoušky na zvířatech pro přísady
    nebo pro kombinace přísad kosmetických prostředků
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/41/EF af 19. juni 2000 om anden udsættelse
    af datoen for forbud mod afprøvning af kosmetiske midlers bestanddele eller forbindelser
    heraf på dyr
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/41/ΕΚ της Επιτροπής, της 19ης Ιουνίου
    2000, για τη δεύτερη μετάθεση της ημερομηνίας
    έναρξης της απαγόρευσης των πειραμάτων σε
    ζώα με συστατικά ή συνδυασμούς συστατικών
    καλλυντικών προϊόντων
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/41/EÜ, 19. juuni 2000, millega lükatakse teist
    korda edasi kuupäev, mille möödudes on keelatud teha loomkatseid kosmeetikatoodete
    koostisainete või koostisainete kombinatsioonide testimiseks
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/41/EY, annettu 19 päivänä kesäkuuta 2000,
    sen määräajan lykkäämisestä toisen kerran, jonka jälkeen on kiellettyä
    käyttää eläinkokeita kosmeettisten valmisteiden ainesosien tai niiden yhdistelmien
    testaamiseen
  type: main
- language: hr
  script: Latn
  content: Direktiva Komisije 2000/41/EZ od 19. lipnja 2000. o drugoj odgodi datuma
    nakon kojeg se zabranjuju ispitivanja na životinjama za sastojke ili kombinacije
    sastojaka kozmetičkih proizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/41/EK irányelve (2000. június 19.) a kozmetikai termékek
    összetevőivel vagy összetevő-kombinációival kapcsolatos állatkísérletek
    betiltása időpontjának másodszori elhalasztásáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/41/CE della Commissione, del 19 giugno 2000, che rinvia
    per la seconda volta il termine per il divieto della sperimentazione animale di
    ingredienti o miscele di ingredienti per prodotti cosmetici
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/41/EK (2000. gada 19. jūnijs), ar ko otrreiz
    atliek termiņu, pēc kura aizliedz kosmētikas līdzekļu sastāvdaļu vai sastāvdaļu
    savienojumu izmēģinājumus ar dzīvniekiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. birželio 19 d. Komisijos Direktyva 2000/41/EB antrą kartą atidedanti
    datą, nuo kurios draudžiama daryti bandymus su gyvūnais tiriant kosmetikos
    gaminių ingredientus arba jų derinius
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kummissjoni 2000/41/ke tad-19 ta' Ġunju 2000 li tipposponi
    għat-tieni darba d-data li warajha testijiet fuq l-annimali huma pprojbiti għall-ingredjenti
    jew it-taħlit ta' ingredjenti ta' prodotti kosmetiċi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/41/EG van de Commissie van 19 juni 2000 tot hernieuwd uitstel
    van de ingangsdatum voor het verbod op dierproeven met ingrediënten of combinaties
    van ingrediënten van cosmetische producten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/41/WE z dnia 19 czerwca 2000 r. odraczająca po
    raz drugi termin wprowadzenia zakazu przeprowadzenia na zwierzętach testów dotyczących
    składników oraz kombinacji składników produktów kosmetycznych
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/41/CE da Comissão, de 19 de Junho de 2000, que adia pela
    segunda vez a data a partir da qual são proibidos os testes em animais relativamente
    a ingredientes ou combinações de ingredientes para produtos cosméticos
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/41/CE a Comisiei din 19 iunie 2000 de amânare pentru a
    doua oară a datei de la care testările pe animale sunt interzise pentru ingredientele
    sau combinațiile de ingrediente ale produselor cosmetice
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/41/ES z 19. júna 2000, ktorou sa po druhý krát
    odkladá termín, po ktorom sú zakázané testy na zvieratách na prísady alebo
    kombinácie prísad kozmetických výrobkovText s významom pre Európsky hospodársky
    priestor.
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2000/41/ES z dne 19. junija 2000 o drugem odlogu roka,
    po katerem so poskusi na živalih prepovedani za sestavine ali kombinacije sestavin
    kozmetičnih izdelkov
  type: main
- language: es
  script: Latn
  content: Directiva 2000/41/CE de la Comisión, de 19 de junio de 2000, por la que
    se aplaza por segunda vez la fecha a partir de la cual quedan prohibidos los experimentos
    con animales para ingredientes o combinaciones de ingredientes de productos cosméticos
  type: main
- language: sv
  script: Latn
  content: Kommissionens direktiv 2000/41/EG av den 19 juni 2000 om att för andra
    gången senarelägga det datum efter vilket djurförsök är förbjudna för beståndsdelar
    och kombinationer av beståndsdelar som ingår i kosmetiska produkter
  type: main
