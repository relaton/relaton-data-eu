  script: Latn
  content: '75/578/EEC: Commission Decision of 30 June 1975 authorizing the Grand
    Duchy of Luxembourg to restrict the marketing of seed of certain varieties of
    agricultural plant species (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '75/578/CEE: Décision de la Commission, du 30 juin 1975, autorisant le
    grand-duché de Luxembourg à restreindre la commercialisation des semences de
