    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '75/578/EWG: Entscheidung der Kommission vom 30. Juni 1975 zur Ermächtigung
    des Großherzogtums Luxemburg, den Verkehr mit Saatgut einiger Sorten landwirtschaftlicher
    Pflanzenarten zu beschränken (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '75/578/EØF: Kommissionens Beslutning af 30. juni 1975 om at bemyndige
