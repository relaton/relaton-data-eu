    ja niiden asennusta koskevan jäsenvaltioiden lainsäädännön lähentämisestä
    annetun direktiivin 80/780/ETY mukauttamisesta Kreikan liittymisen vuoksi
  type: main
- language: it
  script: Latn
  content: Direttiva 80/1272/CEE del Consiglio, del 22 dicembre 1980, che adegua,
    a seguito dell'adesione della Grecia, la direttiva 80/780/CEE per il ravvicinamento
    delle legislazioni degli Stati Membri relative ai retrovisori dei veicoli a motore
    a due ruote, con o senza "carrozzetta", ed al loro montaggio su tali veicoli
  type: main
- language: nl
  script: Latn
  content: Richtlijn 80/1272/EEG van de Raad van 22 december 1980 houdende aanpassing,
    ingevolge de toetreding van Griekenland, van Richtlijn 80/780/EEG inzake de onderlinge
    aanpassing van de wetgevingen van de Lid- Staten betreffende achteruitkijkspiegels
    van tweewielige motorvoertuigen, met of zonder zijspan, en de bevestiging ervan
    op deze voertuigen
  type: main
- language: pt
  script: Latn
