title:
- language: en
  script: Latn
  content: Council Directive 80/1272/EEC of 22 December 1980 on the adaptation, consequent
    on the accession of Greece, of Directive 80/780/EEC on the approximation of the
    laws of the Member States relating to rear-view mirrors for two- wheeled motor
    vehicles with or without a side-car and to their fitting on such vehicles
  type: main
- language: fr
  script: Latn
  content: '80/1272/CEE: Directive du Conseil, du 22 décembre 1980, portant adaptation,
    à la suite de l''adhésion de la Grèce, de la directive 80/780/CEE concernant
    le rapprochement des législations des États membres relatives aux rétroviseurs
    des véhicules à moteur à deux roues, avec ou sans "side-car" et à leur montage
    sur ces véhicules'
  type: main
- language: de
  script: Latn
  content: Richtlinie 80/1272/EWG des Rates vom 22. Dezember 1980 zur Anpassung aufgrund
    des Beitritts Griechenlands der Richtlinie 80/780/EWG zur Angleichung der Rechtsvorschriften
    der Mitgliedstaaten über die Rückspiegel von Zweiradmotorfahrzeugen mit oder
    ohne Beiwagen und ihren Anbau an diese Fahrzeuge
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 80/1272/EØF af 22. december 1980 om tilpasning, som følge
    af Grækenlands tiltrædelse, af direktiv 80/780/EØF om indbyrdes tilnærmelse
    af medlemsstaternes lovgivning om førerspejle til tohjulede motorkøretøjer,
    med eller uden sidevogn, og om deres montering på disse køretøjer
  type: main
- language: el
  script: Grek
  content: Οδηγία 80/1272/ΕΟΚ του Συμβουλίου της 22ας Δεκεμβρίου
    1980 περί προσαρμογής, λόγω της προσχωρήσεως
    της Ελλάδος, της οδηγίας 80/780/ΕΟΚ περί προσεγγίσεως
    των νομοθεσιών των κρατών μελών που αφορούν
    τα κάτοπτρα οδηγήσεως των διτρόχων οχημάτων
    με κινητήρα, με ή χωρίς «side-car» και στην τοποθέτησή
    τους επί των οχημάτων αυτών
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 80/1272/ETY, annettu 22 päivänä joulukuuta 1980,
