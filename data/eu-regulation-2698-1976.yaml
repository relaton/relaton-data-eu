title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2698/76 of 5 November 1976 re-establishing
    the levying of the customs duties on other sewing machines; furniture specially
    designed for sewing machines, falling within subheading 84.41 A I b), originating
    in Yugoslavia to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2698/76 de la Commission, du 5 novembre 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres machines
    à coudre, y compris les meubles pour machines à coudre, de la sous-position
    tarifaire 84.41 A I b), originaires de la Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil, du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2698/76 der Kommission vom 5. November 1976 zur Wiedereinführung
    des Zollsatzes für andere Nähmaschinen, einschließlich Möbel zum Einbau von
    Nähmaschinen, der Tarifstelle 84.41 A I b), mit Ursprung in Jugoslawien, dem
    die in der Verordnung (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2698/76 af 5. november 1976 om genindførelse
    af opkrævning af toldafgifter for symaskiner; møbler specielt indrettet til
    symaskiner, under underposition 84.41 A I b), som har oprindelse i Jugoslavien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2698/76 della Commissione, del 5 novembre 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre macchine per
    cucire, compresi i mobili per dette macchine, della sottovoce doganale 84.41 A
    I b), originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2698/76 van de Commissie van 5 november 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere naaimachines,
    meubelen voor naaimachines daaronder begrepen, van post 84.41 A I b), van oorsprong
    uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de
    Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
