title:
- language: en
  script: Latn
  content: '81/868/EEC: Commission Decision of 23 July 1981 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, originating in the Philippines and Taiwan
    (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/868/CEE: Décision de la Commission, du 23 juillet 1981, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée originaire des Philippines et de T''ai-wan
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/868/EWG: Entscheidung der Kommission vom 23. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus den Philippinen und Taiwan stammende Handschuhe
    aus Gewirken, weder gummielastisch noch kautschutiert, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/868/EØF: Kommissionens beslutning af 23. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, ikke elastisk eller gummeret, med oprindelse i Filippinerne og Taiwan
    (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/868/EOK: Απόφαση τής Επιτροπής τής 23ης Ιουλίου
    1981 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά πλεκτά χειρόκτια μή ελαστικά ούτε επενδυμένα
    μέ καουτσούκ, καταγωγής Φιλιππίνων καί Ταϊβάν
    (Το κείμενο στην γαλλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/868/CEE: Decisione della Commissione, del 23 luglio 1981, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, originari delle Filippine e di Taiwan (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/868/EEG: Beschikking van de Commissie van 23 juli 1981 houdende machtiging
    van de Franse Republiek om handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van oorsprong uit de Filippijnen en
    Taiwan van de communautaire behandeling uit te sluiten (Slechts de tekst in de
    Franse taal is authentiek)'
