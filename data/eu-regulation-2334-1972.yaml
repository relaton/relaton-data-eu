title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2334/72 de la Commission, du 6 novembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux lampes et tubes à incandescence pour l'éclairage de la sous-position tarifaire
    85.20 A, originaires de Hong- Kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2334/72 der Kommission vom 6. November 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Glühlampen für elektrische Beleuchtung
    der Tarifstelle 85.20 A, mit Ursprung in Hongkong, dem die in der Verordnung (EWG)
    Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2334/72 della Commissione, del 6 novembre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    lampade e tubi a incandescenza per l'illuminazione, della sottovoce doganale n.
    85.20 A originarie di Hong Kong, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2334/72 van de Commissie van 6 november 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op elektrische gloeilampen en -buizen, voor verlichtingsdoeleinden,
    van onderverdeling 85.20 A, van oorsprong uit Hong-Kong, ten behoeve waarvan bij
    Verordening (EEG) nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend
  type: main
