title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/1161 of 22 April 2024 concerning
    the renewal of the authorisation of a preparation of Enterococcus lactis NCIMB
    10415 as a feed additive for certain animal species, the authorisation of that
    preparation as a feed additive for certain other animal species (holder of authorisation:
    DSM Nutritional Products Ltd.), amending Implementing Regulation (EU) No 1061/2013
    and repealing Implementing Regulations (EU) No 361/2011, (EU) 2015/518 and (EU)
    2019/11'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/1161 de la Commission du 22 avril
    2024 concernant le renouvellement de l’autorisation d’une préparation d’Enterococcus
    lactis NCIMB 10415 en tant qu’additif dans l’alimentation de certaines espèces
    animales et l’autorisation de cette préparation en tant qu’additif dans l’alimentation
    de certaines autres espèces animales (titulaire de l’autorisation: DSM Nutritional
    Products Ltd.), modifiant le règlement d’exécution (UE) no 1061/2013 et abrogeant
    les règlements d’exécution (UE) no 361/2011, (UE) 2015/518 et (UE) 2019/11'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2024/1161 der Kommission vom 22. April 2024
    zur Verlängerung der Zulassung einer Zubereitung aus Enterococcus lactis NCIMB
    10415 als Futtermittelzusatzstoff für bestimmte Tierarten, zur Zulassung dieser
    Zubereitung als Futtermittelzusatzstoff für bestimmte andere Tierarten (Zulassungsinhaber:
    DSM Nutritional Products Ltd.), zur Änderung der Durchführungsverordnung (EU)
    Nr. 1061/2013 und zur Aufhebung der Durchführungsverordnungen (EU) Nr. 361/2011,
    (EU) 2015/518 und (EU) 2019/11'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2024/1161 на Комисията
    от 22 април 2024 година за подновяване на разрешението
    за употреба на препарат от Enterococcus lactis NCIMB 10415
    като фуражна добавка за някои видове животни,
    разрешаването на посочения препарат като фуражна
    добавка за някои други животински видове (притежател
    на разрешението: DSM Nutritional Products Ltd.), за изменение
    на регламент за изпълнение (ЕС) № 1061/2013 и за
    отмяна на регламенти за изпълнение (ЕС) № 361/2011,
    (ЕС) 2015/518 и (ЕС) 2019/11'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2024/1161 ze dne 22. dubna 2024 o
    obnovení povolení přípravku Enterococcus lactis NCIMB 10415 jako doplňkové
    látky pro určité druhy zvířat, o povolení uvedeného přípravku jako doplňkové
    látky pro některé jiné druhy zvířat (držitel povolení: DSM Nutritional
    Products Ltd.), o změně prováděcího nařízení (EU) č. 1061/2013 a zrušení
    prováděcích nařízení (EU) č. 361/2011, (EU) 2015/518 a (EU) 2019/11'
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1161 af 22. april 2024
    om forlængelse af godkendelsen af et præparat af Enterococcus lactis NCIMB 10415
    som fodertilsætningsstof til visse dyrearter og godkendelse af præparatet som
    fodertilsætningsstof til visse andre dyrearter (indehaver af godkendelsen er
    DSM Nutritional Products Ltd.), om ændring af gennemførelsesforordning (EU)
    nr. 1061/2013 og om ophævelse af gennemførelsesforordning (EU) nr. 361/2011,
    (EU) 2015/518 og (EU) 2019/11
  type: main
