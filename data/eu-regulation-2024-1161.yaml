    nekatere živalske vrste, dovoljenju za navedeni pripravek kot krmni dodatek za
    nekatere druge živalske vrste (imetnik dovoljenja: DSM Nutritional Products Ltd.),
    spremembi Izvedbene uredbe (EU) št. 1061/2013 ter razveljavitvi izvedbenih uredb
    (EU) št. 361/2011, (EU) 2015/518 in (EU) 2019/11'
