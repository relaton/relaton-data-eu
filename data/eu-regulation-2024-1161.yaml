    tiettyjen eläinlajien rehun lisäaineena, kyseisen valmisteen hyväksymisestä
    tiettyjen muiden eläinlajien rehun lisäaineena (hyväksynnän haltija: DSM Nutritional
    Products Ltd.), täytäntöönpanoasetuksen (EU) N:o 1061/2013 muuttamisesta sekä
