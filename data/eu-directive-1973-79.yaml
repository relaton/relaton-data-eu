title:
- language: en
  script: Latn
  content: Council Directive 73/79/EEC of 9 April 1973 varying the field of application
    of the reduced rate of capital duty provided for in respect of certain company
    reconstruction operations by Article 7 (1) (b) of the Directive concerning indirect
    taxes on the raising of capital
  type: main
- language: fr
  script: Latn
  content: Directive 73/79/CEE du Conseil, du 9 avril 1973, modifiant le champ d'application
    du taux réduit du droit d'apport prévu, en faveur de certaines opérations de
    restructuration de sociétés, par l'article 7 paragraphe 1 sous b) de la directive
    concernant les impôts indirects frappant les rassemblements de capitaux
  type: main
- language: de
  script: Latn
  content: Richtlinie 73/79/EWG des Rates vom 9. April 1973 zur Änderung des Anwendungsbereichs
    des ermäßigten Satzes der Gesellschaftsteuer, der zugunsten bestimmter Umstrukturierungen
    von Gesellschaften in Artikel 7 Absatz 1 Buchstabe b) der Richtlinie betreffend
    die indirekten Steuern auf die Ansammlung von Kapital vorgesehen ist
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 73/79/EØF af 9. april 1973 om ændring af anvendelsesområdet
    for den nedsatte sats for kapitaltilførselsafgiften der for bestemte dispositioner
    med henblik på omstrukturering af selskaber er fastsat i artikel 7, stk 1, litra
    b) i direktivet om kapitaltilførselsafgifter
  type: main
- language: el
  script: Grek
