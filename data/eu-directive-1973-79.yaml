    του μειωμένου συντελεστού του φόρου εισφοράς,
    του προβλεπομένου υπέρ ορισμένων πράξεων αναδιαρθρώσεως
    εταιρειών στο άρθρο 7 παράγραφος 1 περίπτωση
    β) της οδηγίας περί εμμέσων φόρων, των επιβαλλομένων
    επί των συγκεντρώσεων κεφαλαίων
  type: main
- language: it
  script: Latn
  content: Direttiva 73/79/CEE del Consiglio, del 9 aprile 1973, che modifica il campo
    d'applicazione dell'aliquota ridotta dell'imposta sui conferimenti, prevista in
    favore di talune operazioni di ristrutturazione di società, all'articolo 7, paragrafo
    1, lettera b), della direttiva concernente le imposte indirette sulla raccolta
    di capitali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 73/79/EEG van de Raad van 9 april 1973 tot wijziging van de werkingssfeer
    van het in artikel 7, lid 1, sub b), van de Richtlijn betreffende de indirecte
    belastingen op het bijeenbrengen van kapitaal bedoelde verlaagde tarief van het
    kapitaalrecht voor bepaalde verrichtingen tot hergroepering van vennootschappen
  type: main
- language: pt
  script: Latn
  content: Directiva 73/79/CEE do Conselho, de 9 de Abril de 1973, que altera o âmbito
