- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/963 of 7 June 2017 concerning
    the authorisation of the preparation of endo-1,3(4)-beta-glucanase produced by
    Aspergillus aculeatinus (formerly classified as Aspergillus aculeatus) (CBS 589.94),
    endo-1,4-beta-glucanase produced by Trichoderma reesei (formerly classified as
    Trichoderma longibrachiatum) (CBS 592.94), alpha-amylase produced by Bacillus
    amyloliquefaciens (DSM 9553), endo-1,4-beta-xylanase produced by Trichoderma viride
    (NIBH FERM BP4842) and bacillolysin produced by Bacillus amyloliquefaciens (DSM
    9554) as a feed additive for all avian species and weaned piglets and amending
    Regulations (EC) No 358/2005 and (EU) No 1270/2009 (holder of the authorisation
    Kemin Europa NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/963 de la Commission du 7 juin 2017
    concernant l''autorisation de la préparation d''endo-1,3(4)-bêta-glucanase produite
    par Aspergillus aculeatinus (anciennement classé en tant qu''Aspergillus aculeatus)
    (CBS 589.94), d''endo-1,4-bêta-glucanase produite par Trichoderma reesei (anciennement
    classé en tant que Trichoderma longibrachiatum) (CBS 592.94), d''alpha-amylase
    produite par Bacillus amyloliquefaciens (DSM 9553), d''endo-1,4-bêta-xylanase
    produite par Trichoderma viride (NIBH FERM BP4842) et de bacillolysine produite
    par Bacillus amyloliquefaciens (DSM 9554) en tant qu''additif destiné à l''alimentation
    de toutes les espèces aviaires et des porcelets sevrés, et modifiant les règlements
    (CE) n° 358/2005 et (UE) n° 1270/2009 (titulaire de l''autorisation: Kemin Europa
    NV)'
