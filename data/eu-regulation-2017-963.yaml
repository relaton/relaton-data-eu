    592.94), alfa-amylas framställt av Bacillus amyloliquefaciens (DSM 9553), endo-1,4-beta-xylanas
    framställt av Trichoderma viride (NIBH FERM BP4842) och bacillolysin framställt
    av Bacillus amyloliquefaciens (DSM 9554) som fodertillsats till alla fågelarter
    och avvanda smågrisar och om ändring av förordningarna (EG) nr 358/2005 och
    (EU) nr 1270/2009 (innehavare av godkännandet: Kemin Europa NV)'
