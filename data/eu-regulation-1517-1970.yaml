title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1517/70 de la Commission, du 20 juillet 1970, fixant
    les taux des restitutions applicables, à compter du 1er août 1970, aux oeufs
    et aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de
    l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1517/70 der Kommission vom 20. Juli 1970 zur Festsetzung
    der ab 1. August 1970 geltenden Erstattungssätze bei der Ausfuhr von Eiern und
    Eigelb in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1517 della Commissione, del 20 luglio 1970, che fissa
    i tassi delle restituzioni applicabili a decorrere dal 1 agosto 1970 alle uova
    e ai tuorli d'uovo esportati sotto forma di merci non comprese nell'allegato II
    del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1517/70 van de Commissie van 20 juli 1970 houdende
    vaststelling van de restituties die met ingang van 1 augustus 1970 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
