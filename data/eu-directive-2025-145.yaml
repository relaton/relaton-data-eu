    virus, a Pucciniastrum minimum (Schweinitz) Arthur és a füge mozaik ágens (Fig
    mosaic agent) uniós vizsgálatköteles nemzárlati károsítók tekintetében
    történő módosításáról és az említett végrehajtási irányelvnek a Candidatus
    Phytoplasma prunorum Seemüller & Schneider károsítóra vonatkozóan meghatározott
    intézkedések tekintetében történő helyesbítéséről
  type: main
