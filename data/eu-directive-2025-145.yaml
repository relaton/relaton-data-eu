    Tomato ringspot virus, Pucciniastrum minimum (Schweinitz) Arthur et l’agent
    de la mosaïque du figuier et rectifiant ladite directive d’exécution en ce
    qui concerne les mesures relatives à Candidatus Phytoplasma prunorum Seemüller
    & Schneider
  type: main
