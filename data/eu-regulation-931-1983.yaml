title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 931/83 of 19 April 1983 re-establishing
    the levying of customs duties on vitamin C, falling within subheading 29.38 B
    IV and originating in China, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 931/83 de la Commission du 19 avril 1983 portant rétablissement
    de la perception des droits de douane applicables à la vitamine C, de la sous-position
    29.38 B IV du tarif douanier commun, originaire de Chine, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 931/83 der Kommission vom 19. April 1983 zur Wiedereinführung
    der Erhebung der Zölle für Vitamin C der Tarifstelle 29.38 B IV, mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 931/83 af 19. april 1983 om genindførelse
    af opkrævning af told for vitamin C henhørende under pos. 29.38 B IV og med
    oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
