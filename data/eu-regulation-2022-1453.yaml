title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1453 of 1 September 2022 concerning
    the authorisation of 6-phytase produced by Komagataella pastoris (DSM 23036) as
    a feed additive for all avian species and for all pigs and repealing Implementing
    Regulation (EU) No 98/2012 (holder of authorisation Huvepharma EOOD)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2022/1453 de la Commission du 1er septembre
    2022 concernant l’autorisation de la 6-phytase produite par Komagataella pastoris
    (DSM 23036) en tant qu’additif pour l’alimentation de toutes les espèces
    aviaires et de tous les porcs et abrogeant le règlement d’exécution (UE) no
    98/2012 (titulaire de l’autorisation: Huvepharma EOOD)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2022/1453 der Kommission vom 1. September
    2022 zur Zulassung von 6-Phytase aus Komagataella pastoris (DSM 23036) als Futtermittelzusatzstoff
    für alle Vogelarten und alle Schweine sowie zur Aufhebung der Durchführungsverordnung
    (EU) Nr. 98/2012 (Zulassungsinhaber: Huvepharma EOOD)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1453 на Комисията
    от 1 септември 2022 година за разрешаване на употребата
    на 6-фитаза, получена от Komagataella pastoris (DSM 23036),
    като фуражна добавка за всички видове птици
    и всички свине и за отмяна на Регламент за изпълнение
    (ЕС) № 98/2012 (притежател на разрешението Huvepharma
    EOOD)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1453 ze dne 1. září 2022 o
    povolení 6-fytázy z Komagataella pastoris (DSM 23036) jako doplňkové látky
    pro všechny druhy ptáků a pro všechna prasata a o zrušení prováděcího
    nařízení (EU) č. 98/2012 (držitel povolení Huvepharma EOOD)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1453 af 1. september
    2022 om godkendelse af 6-fytase produceret af Komagataella pastoris (DSM 23036)
    som tilsætningsstof til foder til alle fuglearter og til alle svin og om ophævelse
    af gennemførelsesforordning (EU) nr. 98/2012 (indehaver af godkendelsen er Huvepharma
    EOOD)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2022/1453 της
    Επιτροπής της 1ης Σεπτεμβρίου 2022 σχετικά με
    τη χορήγηση άδειας για τη χρήση της 6-φυτάσης
    που παράγεται από Komagataella pastoris (DSM 23036) ως πρόσθετης
    ύλης ζωοτροφών για όλα τα είδη πτηνών και για
    όλους τους χοίρους και για την κατάργηση του
    εκτελεστικού κανονισμού (ΕΕ) αριθ. 98/2012 (κάτοχος
    της άδειας: Huvepharma EOOD)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1453, 1. september 2022, millega lubatakse
    kasutada Komagataella pastoris’e (DSM 23036) abil saadud 6-fütaasi kõigi linnuliikide
    ja kõigi sigade söödalisandina ning millega tunnistatakse kehtetuks rakendusmäärus
    (EL) nr 98/2012 (loa hoidja Huvepharma EOOD)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1453, annettu 1 päivänä
    syyskuuta 2022, Komagataella pastoris (DSM 23036) -organismin tuottaman 6-fytaasin
    hyväksymisestä kaikkien lintulajien ja kaikkien sikojen rehun lisäaineena sekä
    täytäntöönpanoasetuksen (EU) N:o 98/2012 kumoamisesta (hyväksynnän haltija
    Huvepharma EOOD)
  type: main
- language: ga
  script: Latn
