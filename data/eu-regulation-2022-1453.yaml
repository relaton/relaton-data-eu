    pastoris (DSM 23036) jako dodatku paszowego dla wszystkich gatunków ptaków i
    dla wszystkich świń oraz uchylające rozporządzenie wykonawcze (UE) nr 98/2012
    (posiadacz zezwolenia Huvepharma EOOD)
  type: main
