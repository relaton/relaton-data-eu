    2022 maidir le húdarú 6-fíotáis arna táirgeadh ag Komagataella pastoris (DSM
    23036) mar bhreiseán beathaithe le haghaidh gach speicis éanúil agus le haghaidh
    gach muc agus lena n-aisghairtear Rialachán Cur Chun Feidhme (AE) Uimh. 98/2012
    (sealbhóir an údaraithe Huvepharma EOOD)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1453 оd 1. rujna 2022. o odobrenju
    6-fitaze dobivene od Komagataella pastoris (DSM 23036) kao dodatka hrani za sve
    ptičje vrste i za sve svinje i o stavljanju izvan snage Provedbene uredbe (EU)
    br. 98/2012 (nositelj odobrenja Huvepharma EOOD)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1453 végrehajtási rendelete (2022. szeptember
    1.) a Komagataella pastoris (DSM 23036) által termelt 6-fitáz valamennyi madárfaj
    és valamennyi sertés takarmány-adalékanyagaként történő engedélyezéséről,
    valamint a 98/2012/EU végrehajtási rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1453 della Commissione del 1o settembre
    2022 relativo all’autorizzazione della 6-fitasi prodotta da Komagataella pastoris
    (DSM 23036) come additivo per mangimi destinati a tutte le specie avicole e a
    tutti i suini e che abroga il regolamento di esecuzione (UE) n. 98/2012 (titolare
    dell’autorizzazione Huvepharma EOOD)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1453 (2022. gada 1. septembris)
    par atļauju Komagataella pastoris (DSM 23036) producētu 6-fitāzi izmantot par
    barības piedevu visu sugu putniem un visām cūkām un ar ko atceļ Īstenošanas
    regulu (ES) Nr. 98/2012 (atļaujas turētājs Huvepharma EOOD)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1453 2022 m. rugsėjo 1 d.
    dėl leidimo naudoti 6-fitazę, gautą iš Komagataella pastoris (DSM 23036),
    kaip visų rūšių paukščių ir visų kiaulių pašarų priedą, kuriuo panaikinamas
    Įgyvendinimo reglamentas (ES) Nr. 98/2012 (leidimo turėtojas – „Huvepharma
    EOOD“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1453 tal-1
    ta’ Settembru 2022 li jikkonċerna l-awtorizzazzjoni ta’ 6-fitażi prodotta
    mill-Komagataella pastoris (DSM 23036) bħala addittiv fl-għalf għall-ispeċijiet
    kollha tat-tjur u għall-ħnieżer kollha u li jħassar ir-Regolament ta’ Implimentazzjoni
    (UE) Nru 98/2012 (id-detentur tal-awtorizzazzjoni huwa Huvepharma EOOD)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1453 van de Commissie van 1 september
    2022 tot verlening van een vergunning voor 6-fytase geproduceerd door Komagataella
    pastoris (DSM 23036) als toevoegingsmiddel voor diervoeding voor alle vogelsoorten
    en voor alle varkens en tot intrekking van Uitvoeringsverordening (EU) nr. 98/2012
    (vergunninghouder Huvepharma EOOD)
  type: main
- language: pl
  script: Latn
