  script: Latn
  content: Commission Implementing Regulation (EU) 2017/660 of 6 April 2017 concerning
    a coordinated multiannual control programme of the Union for 2018, 2019 and 2020
    to ensure compliance with maximum residue levels of pesticides and to assess the
    consumer exposure to pesticide residues in and on food of plant and animal origin
  type: main
- language: fr
  script: Latn
