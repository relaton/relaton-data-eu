title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1205/81 of 5 May 1981 re-establishing the
    levying of customs duties on elastic fabrics and trimmings (other than knitted
    or crocheted), products of category 105 (code 1050), originating in Thailand,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 3320/80
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1205/81 de la Commission, du 5 mai 1981, portant rétablissement
    de la perception des droits de douane applicables aux tissus (autres que de bonneterie)
    élastiques de la catégorie 105 (code 1050), originaires de Thaïlande, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1205/81 der Kommission vom 5. Mai 1981 über die Wiedereinführung
    des Zollsatzes für gummielastische Gewebe, ausgenommen Gewirke, der Warenkategorie
    Nr. 105 (Kennziffer 1050), mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1205/81 af 5. maj 1981 om genindførelse
    af opkrævning af toldafgifter for elastiske tekstilstoffer (undtagen trikotagestof)
    under varekategori nr. 105 (kode 1050), som har oprindelse i Thailand, og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1205/81 τής Επιτροπής
    τής 5ης Μαΐου 1981 περί αποκαταστάσεως τής εφαρμογής
    τελωνειακών δασμών γιά υφάσματα (πλήν τών πλεκτών)
    ελαστικά, τών προϊόντων τής κατηγορίας 105 (κώδικας
    1050) καταγωγής Ταϋλάνδης, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1205/81 della Commissione, del 5 maggio 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti (diversi da
    quelli a maglia) elastici, della categoria di prodotti n. 105 (codice 1050), originari
    della Tailandia, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1205/81 van de Commissie van 5 mei 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elastische
    weefsels (met uitzondering van brei- en haakwerk), van categorie van produkten
    105 (codenummer 1050), van oorsprong uit Thailand, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
