  content: Commission Regulation (EEC) No 943/92 of 14 April 1992 reducing the quantities
    of table wine covered by approved contracts and declarations for distillation
    as provided for in Regulation (EEC) No 3721/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 943/92 de la Commission du 14 avril 1992 portant réduction
    des quantités de vin de table figurant dans les contrats et déclarations agréés
    au titre de la distillation ouverte par le règlement (CEE) n 3721/91
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 943/92 DER KOMMISSION vom 14. April 1992 zur Kürzung
    der in den für die Destillation gemäß der Verordnung (EWG) Nr. 3721/91 genehmigten
    Verträgen und Erklärungen angegebenen Tafelweinmengen #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 943/92 af 14. april 1992 om nedsættelse
    af de mængder bordvin, der er anført i de kontrakter og angivelser, der godkendes
    i henhold til destillationen i forordning (EØF) nr. 3721/91 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 943/92 της Επιτροπής
    της 14ης Απριλίου 1992 για τη μείωση των ποσοτήτων
    επιτραπέζιου οίνου που αναφέρονται στις συμβάσεις
    και στις δηλώσεις που έχουν εγκριθεί δυνάμει
    της αποστάξεως που άρχισε με τον κανονισμό
    (ΕΟΚ) αριθ. 3721/91
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 943/92 DELLA COMMISSIONE del 14 aprile 1992 relativo
    alla riduzione dei quantitativi di vini da tavola che figurano nei contratti e
    nelle dichiarazioni approvati a titolo della distillazione aperta dal regolamento
    (CEE) n. 3721/91 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 943/92 VAN DE COMMISSIE van 14 april 1992 tot verlaging
    van de hoeveelheden tafelwijn in de contracten en aangiften die worden goedgekeurd
    in het kader van de bij Verordening (EEG) nr. 3721/91 geopende mogelijkheid tot
    distillatie #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 943/92 DA COMISSÃO de 14 de Abril de 1992 que reduz
