    i talibanima te o stavljanju izvan snage Uredbe Vijeća (EZ) br. 467/2001
  type: main
- language: hu
  script: Latn
  content: A Bizottság 667/2004/EK rendelete (2004. április 7.) az Oszáma bin Ládennel,
    az Al-Qaida hálózattal és a Tálibánnal összeköttetésben álló egyes személyekkel
    és szervezetekkel szemben meghatározott szigorító intézkedések bevezetéséről
    és a 467/2001/EK tanácsi rendelet hatályon kívül helyezéséről szóló
    881/2002/EK rendelet harminckettedik alkalommal történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 667/2004 della Commissione, del 7 aprile 2004, recante
    trentaduesima modifica del regolamento (CE) n. 881/2002 che impone specifiche
    misure restrittive nei confronti di determinate persone ed entità associate a
    Osama bin Laden, alla rete Al-Qaeda e ai Talibani e abroga il regolamento (CE)
    n. 467/2001 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 667/2004 (2004. gada 7. aprīlis), ar kuru 32.
    reizi groza Padomes Regulu (EK) Nr. 881/2002, ar ko nosaka konkrētus, īpašus,
    ierobežojošus, pret noteiktām personām un organizācijām, kuras saistītas
