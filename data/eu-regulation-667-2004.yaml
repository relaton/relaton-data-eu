    ограничителни мерки, насочени срещу определени
    физически и юридически лица, свързани с Осама
    бен Ладен, мрежата на Ал Кайда и талибаните
    и за отмяна на Регламент (ЕО) № 467/2001 на Съвета
  type: main
- language: cs
  script: Latn
