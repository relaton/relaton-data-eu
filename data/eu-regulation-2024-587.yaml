  script: Latn
  content: Commission Implementing Regulation (EU) 2024/587 of 12 February 2024 providing
    for a derogation from Regulation (EU) 2021/2115 of the European Parliament and
    of the Council as regards the application of the standard for good agricultural
    and environmental conditions of land (GAEC standard) 8, dates of eligibility of
    expenditure for contribution from the EAGF and rules concerning amendments of
    CAP Strategic Plans for modifications of certain eco-schemes for claim year 2024
  type: main
- language: fr
  script: Latn
