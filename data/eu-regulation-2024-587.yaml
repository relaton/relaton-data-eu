    2024 prévoyant une dérogation au règlement (UE) 2021/2115 du Parlement européen
    et du Conseil en ce qui concerne l’application de la norme relative aux bonnes
    conditions agricoles et environnementales des terres (norme BCAE 8), les dates
    d’éligibilité des dépenses admissibles au bénéfice d’une contribution
    du FEAGA et les règles concernant les modifications des plans stratégiques relevant
    de la PAC liées aux modifications de certains éco-régimes pour l’année de
    demande 2024
  type: main
