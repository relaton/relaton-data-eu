title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1386/82 of 4 June 1982 amending the Annex
    to Regulation (EEC) No 532/75 concerning the recovery on exportation of aids granted
    in respect of skimmed-milk powder for use as feed and in respect of skimmed milk
    processed into compound feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1386/82 de la Commission, du 4 juin 1982, modifiant
    l' annexe du règlement (CEE) n° 532/75 relatif à la récupération des aides
    pour le lait écrémé en poudre destiné à l' alimentation des animaux et le
    lait écrémé transformé en aliments composés lors de l' exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1386/82 der Kommission vom 4. Juni 1982 zur Änderung
    des Anhangs der Verordnung (EWG) Nr. 532/75 über die Wiedereinziehung der Beihilfen
    für Magermilchpulver für Futterzwecke und zu Mischfutter verarbeitete Magermilch
    bei der Ausfuhr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1386/82 af 4. juni 1982 om ændring
    af bilaget til forordning (EØF) nr. 532/75 om tilbagebetaling, ved udførsel,
    af støtte til skummetmælkspulver til foderbrug og skummetmælk, der forarbejdes
    til foderblandinger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1386/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί τροποποιήσεως τού παραρτήματος
    τού κανονισμού (EOK) αριθ. 532/75 περί τής ανακτήσεως
    τών ενισχύσεων γιά τό αποκορυφωμένο γάλα σέ
    σκόνη, τό προοριζόμενο γιά τή διατροφή ζώων,
    καί γιά τό αποκορυφωμένο γάλα πού μεταποιείται
    σέ σύνθετες τροφές κατά τήν εξαγωγή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1386/82 della Commissione, del 4 giugno 1982, che
    modifica l' allegato del regolamento (CEE) n. 532/75 relativo al recupero, all'
