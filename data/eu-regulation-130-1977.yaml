title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 130/77 of 24 January 1977 re-establishing
    the levying of customs duties on melamine falling within subheading 29.35 ex Q,
    originating in South Korea to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 130/77 de la Commission, du 24 janvier 1977, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position tarifaire 29.35 EX Q, originaire de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 130/77 der Kommission vom 24. Januar 1977 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q mit Ursprung in Südkorea,
    dem die in der Verordnung (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 130/77 af 24. januar 1977 om genindførelse
    af opkrævning af toldafgifter for melamin, under underposition 29.35 ex Q, som
    har oprindelse i Sydkorea, og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 130/77 della Commissione, del 24 gennaio 1977, che
    ripristina la riscossione dei dazi doganali applicabili alla melarumina della
    sottovoce doganale 29.35 ex Q, originaria della Corea del Sud beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 130/77 van de Commissie van 24 januari 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op melamine
    van post 29.35 ex Q, van oorsprong uit Zuid-Korea, ten behoeve waarvan bij Verordening
    (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties werden geopend
  type: main
