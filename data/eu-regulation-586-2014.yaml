title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 586/2014 of 2 June 2014 derogating
    from Council Regulation (EC) No 1967/2006 as regards the prohibition to fish above
    protected habitats and the minimum distance from the coast and depth for the ‘gangui’
    trawlers fishing in certain territorial waters of France (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 586/2014 de la Commission du 2 juin 2014
    portant dérogation au règlement (CE) n ° 1967/2006 du Conseil en ce qui concerne
    l'interdiction de la pêche au-dessus des habitats protégés ainsi que la distance
    minimale de la côte et la profondeur minimale pour les chalutiers équipés de
    chaluts de type «gangui» pêchant dans certaines eaux territoriales de la France
    (Provence-Alpes-Côte d'Azur)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 586/2014 der Kommission vom 2. Juni 2014
    zur Abweichung von der Verordnung (EG) Nr. 1967/2006 des Rates hinsichtlich des
    Verbots der Fischerei über geschützten Lebensräumen, der Mindestentfernung
    von der Küste und der Mindestwassertiefe für die „Gangui“ -Trawler beim
    Fischfang in bestimmten Hoheitsgewässern Frankreichs (Provence-Alpes-Côte d'Azur)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 586/2014 на Комисията
    от 2 юни 2014 година за дерогация от Регламент
    (ЕО) № 1967/2006 на Съвета по отношение на забраната
    за риболов над защитени местообитания, минималното
    разстояние от брега и дълбочината за риболов
    с траулери с мрежи „gangui“ в определени териториални
    води на Франция (Provence-Alpes-Côte d'Azur)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 586/2014 ze dne 2. června 2014
    , kterým se stanoví odchylka od nařízení Rady (ES) č. 1967/2006, pokud jde
    o zákaz rybolovu nad chráněnými stanovišti a o minimální vzdálenost od
    pobřeží a minimální hloubku moře pro traulery typu gangui lovící v některých
    teritoriálních vodách Francie (Provence-Alpes-Côte d'Azur)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 586/2014 af 2. juni 2014
    om fravigelse af Rådets forordning (EF) nr. 1967/2006 for så vidt angår forbuddet
    mod fiskeri hen over beskyttede habitater, mindsteafstanden fra kysten og mindstedybden
    for fiskeri med gangui-trawlere i visse franske territorialfarvande (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 586/2014
