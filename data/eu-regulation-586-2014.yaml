  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 586/2014 оd 2. lipnja 2014 . o odstupanju
    od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu zabrane ribolova iznad zaštićenih
    staništa te minimalne udaljenosti od obale i dubine za mreže potegače vrste
    „gangui” koje love u određenim teritorijalnim vodama Francuske (Provence
    – Alpes – Côte d'Azur)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 586/2014/EU végrehajtási rendelete ( 2014. június 2. )
    Franciaország egyes felségvizein (Provence-Alpes-Côte d'Azur) a „gangui”
    vonóhálós halászatban a védett élőhelyek feletti halászat tilalma, továbbá
    a hálók merítési mélysége és a parttól számított távolsága tekintetében
    az 1967/2006/EK tanácsi rendelettől történő eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 586/2014 della Commissione, del 2 giugno
    2014 , che deroga al regolamento (CE) n. 1967/2006 del Consiglio per quanto riguarda
    il divieto di pescare al di sopra di habitat protetti nonché la distanza minima
    dalla costa e la profondità minima per pescherecci da traino provvisti dell'attrezzo
    denominato «gangui» operanti in talune acque territoriali della Francia (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 586/2014 ( 2014. gada 2. jūnijs
    ), ar ko paredz atkāpi no Padomes Regulas (EK) Nr. 1967/2006 attiecībā uz aizliegumu
    zvejot virs aizsargājamām dzīvotnēm un minimālo attālumu no krasta un minimālo
    dziļumu, kas jāievēro kuģiem, kuri zvejo ar gangui tipa trali, noteiktos Francijas
    (Provansas–Alpu–Kotdazīras) teritoriālajos ūdeņos
  type: main
- language: lt
  script: Latn
  content: 2014 m. birželio 2 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 586/2014,
    kuriuo nukrypstama nuo Tarybos reglamento (EB) Nr. 1967/2006 nuostatų dėl draudimo
    vykdyti žvejybą virš saugomų buveinių bei minimalaus atstumo nuo kranto ir
    minimalaus jūros gylio reikalavimų žvejojant Prancūzijos teritoriniuose vandenyse
    (Provansas-Alpės-Žydrasis Krantas) „gangui“ tipo tralais
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) Nru 586/2014 tat-
    2 ta' Ġunju 2014 li jidderoga mir-Regolament tal-Kunsill (KE) Nru 1967/2006 fejn
    jidħlu l-projbizzjoni tas-sajd f'ħabitats protetti u d-distanza minima mill-kosta
    u l-fond għal bastimenti tat-tkarkir “gangui” li jistadu f'ċertu ilmijiet
    territorjali ta' Franza (Provenzja-Alpi-Côte d'Azur)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 586/2014 van de Commissie van 2 juni 2014
    tot afwijking van Verordening (EG) nr. 1967/2006 van de Raad betreffende het verbod
    om boven beschermde habitats te vissen en betreffende de minimumafstand van de
    kust en de minimumzeediepte voor de „gangui” -trawlers in bepaalde territoriale
    wateren van Frankrijk (Provence-Alpes-Côte d'Azur)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 586/2014 z dnia 2 czerwca 2014
    r. wprowadzające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w odniesieniu
    do zakazu połowów nad chronionymi siedliskami oraz minimalnych odległości
    od brzegu i minimalnej głębokości morza dla trawlerów stosujących sieci typu
    „gangui” prowadzących połowy na niektórych wodach terytorialnych Francji
    (Provence-Alpes- Côte d'Azur)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 586/2014 da Comissão, de 2 de junho
    de 2014 , que derroga o Regulamento (CE) n. ° 1967/2006 do Conselho no que respeita
    à proibição de pesca em habitats protegidos e à distância mínima da costa
    e profundidade para os arrastões gangui que pescam em determinadas águas territoriais
    da França (Provence-Alpes-Côte d'Azur)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 586/2014 al Comisiei din 2
    iunie 2014 de derogare de la Regulamentul (CE) nr. 1967/2006 al Consiliului în
    ceea ce privește interzicerea pescuitului deasupra habitatelor protejate și
    distanța minimă față de coastă și adâncimea pentru traulerele „gangui”
    care pescuiesc în anumite ape teritoriale ale Franței (Provence-Alpes-Côte
    d'Azur)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 586/2014 z 2. júna 2014 , ktorým
    sa udeľuje výnimka z nariadenia Rady (ES) č. 1967/2006, pokiaľ ide o zákaz
    lovu nad chránenými biotopmi a o minimálnu vzdialenosť od pobrežia a hĺbku
    v prípade lovu plavidlami s vlečnými sieťami typu gangui v určitých pobrežných
    vodách Francúzska (Provence-Alpes-Côte d'Azur)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 586/2014 z dne 2. junija 2014 o odstopanju
    od Uredbe Sveta (ES) št. 1967/2006 glede prepovedi lovljenja nad zaščitenimi
    habitati, najmanjše oddaljenosti od obale in globine za vlečne mreže tipa „gangui“
    , ki lovijo v določenih teritorialnih vodah Francije (Provence-Alpes-Côte d'Azur)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n °586/2014 de la Comisión, de 2 de junio
    de 2014 , por el que se establece una excepción al Reglamento (CE) n ° 1967/2006
    del Consejo en lo que respecta a la prohibición de faenar por encima de hábitats
    protegidos y a la distancia mínima de la costa y la profundidad de los arrastreros
    «gangui» que pescan en determinadas aguas territoriales de Francia (Provenza
    — Alpes — Costa Azul)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 586/2014 av den 2 juni 2014
    om undantag från rådets förordning (EG) nr 1967/2006 vad gäller förbudet
    mot fiske ovanför skyddade livsmiljöer samt minimiavståndet från kusten och
    minimidjupet för fiske med trålare av ”gangui-typ” i vissa territorialvatten
    i Frankrike (Provence-Alpes-Côte d'Azur)
