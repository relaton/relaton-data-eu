title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1569/81 of 1 June 1981 laying down for 1981
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1569/81 du Conseil, du 1er juin 1981, fixant, pour
    1981, certaines mesures de conservation et de gestion des ressources de pêche
    applicables aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1569/81 des Rates vom 1. Juni 1981 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge für 1981
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1569/81 af 1. juni 1981 om fastsættelse
    for 1981 af en række foranstaltninger til bevarelse og forvaltning af fiskeresourcerne,
    som skal finde anvendelse på fartøjer, der fører spansk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1569/81 τού Συμβουλίου
    τής 1ης Ιουνίου 1981 περί καθορισμού, γιά τό 1981,
    ορισμένων μέτρων διατηρήσεως καί διαχειρίσεως
    τών αλιευτικών πόρων, πού εφαρμόζονται σέ σκάφη
    υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1569/81 del Consiglio, del 1° giugno 1981, che dispone
    per il 1981 talune misure di conservazione e di gestione delle risorse di pesca
    da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1569/81 van de Raad van 1 juni 1981 tot vaststelling
    voor 1981 van bepaalde maatregelen voor de instandhouding en het beheer van de
    visbestanden ten aanzien van vaartuigen die de vlag van Spanje voeren
  type: main
