title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1548/78 of 4 July 1978 re-establishing the
    levying of customs duties on household utensils of wood, falling within heading
    No 44.24, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1548/78 de la Commission, du 4 juillet 1978, portant
    rétablissement de la perception des droits de douane applicables aux ustensiles
    de ménage en bois, de la position tarifaire 44.24, originaires des pays en voie
    de développement bénéficiaires des préférences tarifaires prévues par le
    règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1548/78 der Kommission vom 4. Juli 1978 zur Wiedereinführung
    des Zollsatzes für Haushaltsgeräte aus Holz der Tarifstelle 44.24, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2705/77 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1548/78 af 4. juli 1978 om genindførelse
    af opkrævning af toldafgifter for husholdningsartikler af træ, under position
    44.24, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1548/78 della Commissione, del 4 luglio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di uso domestico
    di legno della sottovoce doganale 44.24, originari dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1548/78 van de Commissie van 4 juli 1978 houdende
    wederinstelling van de heffing van de douanerechten voor huishoudelijke artikelen
    van hout, van post 44.24, van oorsprong uit de ontwikkelingslanden, ten behoeve
    waarvan bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties werden
    geopend
  type: main
