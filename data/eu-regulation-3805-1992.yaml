title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3805/92 of 23 December 1992 establishing,
    for 1993, the list of vessels exceeding eight metres length overall and permitted
    to fish for sole within certain areas of the Community using beam trawls whose
    aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3805/92 de la Commission, du 23 décembre 1992, établissant
    pour 1993 la liste des bateaux dont la longueur hors tout dépasse huit mètres,
    autorisés à pêcher la sole dans certaines zones de la Communauté à l' aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3805/92 der Kommission vom 23. Dezember 1992 zur Festlegung
    der Liste für 1993 der Schiffe mit einer Länge über alles von mehr als 8 m,
    die in bestimmten Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge
    mehr als 9 m beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3805/92 af 23. december 1992 om listen
    for 1993 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3805/92 της Επιτροπής
    της 23ης Δεκεμβρίου 1992 που καταρτίζει, για το
    1993, τον κατάλογο των σκαφών μήκους άνω των οκτώ
    μέτρων τα οποία επιτρέπεται να αλιεύουν γλώσσες
    σε ορισμένες περιοχές της Κοινότητας χρησιμοποιώντας
    δοκότρατες των οποίων το συνολικό μήκος υπερβαίνει
    τα εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3805/92 della Commissione, del 23 dicembre 1992, che
    fissa l' elenco per il 1993 dei pescherecci di lunghezza fuori tutto superiori
    a 8 metri, autorizzati a pescare la sogliola in determinate zone della Comunità,
    utilizzando reti a strascico a pali, la cui lunghezza complessiva superi i 9 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3805/92 van de Commissie van 23 december 1992 tot
    vaststelling voor 1993 van de lijst van vaartuigen met een lengte over alles van
    meer dan 8 meter en die in bepaalde zones van de Gemeenschap met boomkorren waarvan
    de totale boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3805/92 da Comissão, de 23 de Dezembro de 1992,
    que estabelece para 1993 a lista dos navios com mais de oito metros de comprimento
    de fora a fora autorizados a pescar linguado em determinadas zonas da Comunidade,
    utilizando redes de arrasto de vara em que o comprimento total das varas seja
    superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3805/92 de la Comisión, de 23 de diciembre de 1992,
    por el que se establece para 1993 la lista de barcos cuya eslora total excede
    los ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
