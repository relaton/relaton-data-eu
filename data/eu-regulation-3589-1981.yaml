    für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung in Spanien in die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3589/81 af 7. december 1981 om ændring af
