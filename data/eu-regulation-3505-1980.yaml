  content: Council Regulation (EEC) No 3505/80 of 22 December 1980 making the importation
    into Greece of certain jute products originating in Bangladesh or India subject
    to quantitative limitation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3505/80 du Conseil, du 22 décembre 1980, soumettant
    les importations en Grèce de certains produits de jute originaires du Bangladesh
    et de l' Inde à des limitations quantitatives
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3505/80 des Rates vom 22. Dezember 1980 zur Einführung
    mengenmäßiger Beschränkungen für die Einfuhren bestimmter Juteerzeugnisse
    mit Ursprung in Bangladesch und Indien nach Griechenland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3505/80 af 22. december 1980 om kvantitative
