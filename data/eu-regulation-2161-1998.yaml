    di carni bovine detenute da taluni organismi d'intervento e destinate ad essere
    esportate verso determinate destinazioni e recante abrogazione del regolamento
    (CE) n. 788/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2161/98 van de Commissie van 7 oktober 1998 betreffende
    de verkoop, voor uitvoer, naar bepaalde bestemmingen, volgens de bij Verordening
    (EEG) nr. 2539/84 vastgestelde procedure, van rundvlees uit de voorraden van bepaalde
    interventiebureaus en tot intrekking van Verordening (EG) nr. 788/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2161/98 da Comissão de 7 de Outubro de 1998 relativo
