title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2161/98 of 7 October 1998 on the sale, by
    means of the procedure laid down in Regulation (EEC) No 2539/84, of beef held
    by certain intervention agencies and intended for export to certain destinations
    and repealing Regulation (EC) No 788/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2161/98 de la Commission du 7 octobre 1998 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) nº 2539/84
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être exportées vers certaines destinations et abrogeant le règlement (CE)
    nº 788/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2161/98 der Kommission vom 7. Oktober 1998 über den
