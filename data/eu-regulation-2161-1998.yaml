    vietäväksi tarkoitetun naudanlihan myynnistä asetuksessa (ETY) N:o 2539/84
    määritellyn menettelyn mukaisesti ja asetuksen (EY) N:o 788/98 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2161/98 della Commissione del 7 ottobre 1998 relativo
