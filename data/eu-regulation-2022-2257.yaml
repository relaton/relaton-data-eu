  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2257 оd 11. kolovoza 2022. o dopuni
    Uredbe (EU) br. 575/2013 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda kojima se utvrđuju metode izračuna bruto iznosa iznenadnog
    nastanka statusa neispunjavanja obveza za izloženosti dužničkim i vlasničkim
    instrumentima te za izloženosti riziku nastanka statusa neispunjavanja obveza
    koje proizlaze iz određenih izvedenih instrumenata, kojom se utvrđuju zamišljeni
    iznosi instrumenata koji nisu instrumenti iz članka 325.w stavka 4. Uredbe (EU)
    br. 575/2013
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2257 felhatalmazáson alapuló rendelete (2022.
    augusztus 11.) az 575/2013/EU európai parlamenti és tanácsi rendeletnek a hitelviszonyt
    megtestesítő instrumentumokkal és a tulajdoni részesedést megtestesítő
    instrumentumokkal szembeni kitettségek, valamint egyes származtatott instrumentumokból
    eredő nemteljesítési kockázatnak való kitettségek bruttó váratlan nemteljesítési
    összegei számítási módszereinek, valamint az 575/2013/EU rendelet 325w. cikkének
    (4) bekezdésében említett instrumentumoktól eltérő instrumentumok névleges
    összegei meghatározásának részletes meghatározásáról szóló szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2257 della Commissione dell'11 agosto 2022
    che integra il regolamento (UE) n. 575/2013 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i metodi
    di calcolo degli importi lordi del default improvviso e inatteso per le esposizioni
    verso strumenti di debito e di capitale e per le esposizioni al rischio di default
    risultanti da taluni strumenti derivati, e che specificano la determinazione degli
    importi nozionali di strumenti diversi rispetto a quelli di cui all’articolo
    325 quatervicies, paragrafo 4, del regolamento (UE) n. 575/2013
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2257 (2022. gada 11. augusts), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 575/2013 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, ar kuriem precizē pēkšņas saistību
    neizpildes bruto summu aprēķināšanas metodes riska darījumiem ar parāda
    un kapitāla vērtspapīru instrumentiem un riska darījumiem ar saistību neizpildes
    risku, kas izriet no konkrētiem atvasinātajiem instrumentiem, un precizē tādu
    instrumentu nosacīto summu noteikšanu, kas nav Regulas (ES) Nr. 575/2013 325.w
    panta 4. punktā minētie instrumenti
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2257 2022 m. rugpjūčio 11
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 575/2013 papildomas
    techniniais reguliavimo standartais, kuriais nustatomi skolos ir nuosavybės finansinių
    priemonių pozicijų ir įsipareigojimų neįvykdymo rizikos pozicijų, atsirandančių
    dėl tam tikrų išvestinių finansinių priemonių, bendrųjų staigaus įsipareigojimų
    neįvykdymo rizikos sumų apskaičiavimo metodai ir patikslinamas kitų finansinių
    priemonių nei nurodytosios Reglamento (ES) Nr. 575/2013 325w straipsnio 4 dalyje
    tariamųjų sumų nustatymas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2257 tal-11 ta’ Awwissu
    2022 li jissupplimenta r-Regolament (UE) Nru 575/2013 tal-Parlament Ewropew u
    tal-Kunsill fir-rigward tal-istandards tekniċi regolatorji li jispeċifikaw il-metodi
    ta’ kalkolu tal-ammonti grossi ta’ inadempjenza immedjata għal skoperturi
    għal strumenti ta’ dejn u ekwità u għal skoperturi għar-riskju ta’ inadempjenza
    li jirriżultaw minn ċerti strumenti derivattivi, u li jispeċifika l-iffissar
    tal-ammonti nozzjonali ta’ strumenti għajr l-istrumenti msemmija fl-Artikolu
    325w(4) tar-Regolament (UE) Nru 575/2013
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2257 van de Commissie van 11 augustus
    2022 tot aanvulling van Verordening (EU) nr. 575/2013 van het Europees Parlement
    en de Raad met betrekking tot ontwerpen van technische reguleringsnormen ter bepaling
    van de berekeningsmethoden van bruto “jump to default”-bedragen voor blootstellingen
    aan schuld- of eigenvermogensinstrumenten en voor blootstellingen aan wanbetalingsrisico’s
    die voortvloeien uit bepaalde derivaten en ter bepaling van de vaststelling van
    notionele bedragen van andere instrumenten dan die genoemd in artikel 325 quatervicies,
    lid 4, van Verordening (EU) nr. 575/2013
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2257 z dnia 11 sierpnia 2022
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 575/2013
    w odniesieniu do regulacyjnych standardów technicznych określających sposoby
    obliczania kwot z tytułu niespodziewanego niewykonania zobowiązania dla ekspozycji
    na instrumenty dłużne i kapitałowe oraz dla ekspozycji na ryzyko niewykonania
    zobowiązania wynikające z niektórych instrumentów pochodnych, a także określających
    sposób obliczania kwot referencyjnych instrumentów innych niż instrumenty,
    o których mowa w art. 325w ust. 4 rozporządzenia (UE) nr 575/2013
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2257 da Comissão de 11 de agosto de 2022
    que completa o Regulamento (UE) n.o 575/2013 do Parlamento Europeu e do Conselho
    por normas técnicas de regulamentação que especificam os métodos de cálculo
    dos montantes brutos por incumprimento súbito das exposições a instrumentos
    de dívida ou de capital e das exposições ao risco de incumprimento decorrente
    de determinados instrumentos derivados, bem como a forma de determinar os montantes
    nocionais de instrumentos distintos daqueles a que se refere o artigo 325.o-W,
    n.o 4, do Regulamento (UE) n.o 575/2013
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2257 al Comisiei din 11 august 2022 de completare
    a Regulamentului (UE) nr. 575/2013 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează metodele
    de calcul al cuantumurilor brute ale trecerii bruște în starea de nerambursare
    pentru expunerile la instrumente de datorie și de capital și pentru expunerile
    la riscul de nerambursare care decurg din anumite instrumente financiare derivate
    și de specificare a determinării valorilor noționale ale altor instrumente
    decât cele menționate la articolul 325w alineatul (4) din Regulamentul (UE)
    nr. 575/2013
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2257 z 11. augusta 2022, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 575/2013, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa stanovujú metódy výpočtu
    hrubých súm náhleho zlyhania pre expozície voči dlhovým a kapitálovým
    nástrojom a pre expozície voči riziku zlyhania vyplývajúcemu z určitých
    derivátových nástrojov, ako aj pomyselné hodnoty iných nástrojov, ako sú
    tie, ktoré sú uvedené v článku 325w ods. 4 nariadenia (EÚ) č. 575/2013
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2257 z dne 11. avgusta 2022 o dopolnitvi
    Uredbe (EU) št. 575/2013 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki določajo metode za izračun bruto zneskov skokovitega
    naraščanja neplačila za izpostavljenosti iz naslova dolžniških in lastniških
    instrumentov ter izpostavljenosti tveganju neplačila, ki nastanejo iz določenih
    izvedenih finančnih instrumentov, ter določitev hipotetičnih zneskov instrumentov,
    ki niso instrumenti iz člena 325w(4) Uredbe (EU) št. 575/2013
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2257 de la Comisión de 11 de agosto de 2022
    por el que se completa el Reglamento (UE) n.o 575/2013 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación que especifican
    los métodos de cálculo de los importes brutos de impago súbito para las exposiciones
    a instrumentos de deuda y de renta variable y para las exposiciones al riesgo
    de impago resultantes de determinados instrumentos derivados, y por el que se
    concreta la determinación de los importes nocionales de instrumentos distintos
    de los contemplados en el artículo 325 quatervicies, apartado 4, del Reglamento
    (UE) n.o 575/2013
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2257 av den 11 augusti 2022
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 575/2013
    vad gäller tekniska tillsynsstandarder för att specificera metoderna att beräkna
    bruttobelopp vid plötsligt fallissemang för exponeringar mot skuld- och aktieinstrument
    och för exponeringar mot fallissemangsrisk som härrör från vissa derivatinstrument,
    samt för att specificera fastställandet av teoretiska belopp för andra instrument
    än de som avses i artikel 325w.4 i förordning (EU) nr 575/2013
