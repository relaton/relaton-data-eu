  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/2257, 11. august 2022, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) nr 575/2013 seoses
    regulatiivsete tehniliste standarditega, millega määratakse kindlaks ootamatult
    makseviivitusse sattumise brutosummade arvutamise meetodid võla- ja kapitaliinstrumentidest
    tulenevate riskipositsioonide ning teatavatest tuletisinstrumentidest tulenevate
    makseviivituse riski positsioonide puhul ning see, kuidas määratakse kindlaks
    muude instrumentide kui määruse (EL) nr 575/2013 artikli 325w lõikes 4 osutatud
    instrumentide tinglik väärtus
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/2257, annettu 11 päivänä elokuuta
    2022, Euroopan parlamentin ja neuvoston asetuksen (EU) N:o 575/2013 täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään äkillisestä maksukyvyttömyydestä
    aiheutuvien bruttomäärien laskentamenetelmät vieraan ja oman pääoman ehtoisiin
    instrumentteihin liittyville vastuille ja tiettyihin johdannaissopimuksiin liittyvästä
    maksukyvyttömyysriskistä syntyville vastuille ja täsmennetään, miten muiden
    kuin asetuksen (EU) N:o 575/2013 325 w artiklan 4 kohdassa tarkoitettujen instrumenttien
    nimellismäärät määritetään
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/2257 ón gCoimisiún an 11 Lúnasa 2022
    lena bhforlíontar Rialachán (AE) Uimh. 575/2013 ó Pharlaimint na hEorpa agus
    ón gComhairle maidir le caighdeáin theicniúla rialála lena sonraítear modhanna
    ríofa ollmhéideanna mainneachtana gan choinne le haghaidh risíochtaí ar ionstraimí
    fiachais agus cothromais agus le haghaidh risíochtaí ar phriacal mainneachtana
