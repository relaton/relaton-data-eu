title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2257 of 11 August 2022 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the calculation methods of
    gross jump-to-default amounts for exposures to debt and equity instruments and
    for exposures to default risk arising from certain derivative instruments, and
    specifying the determination of notional amounts of instruments other than the
    instruments referred to in Article 325w(4) of Regulation (EU) No 575/2013
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2257 de la Commission du 11 août 2022
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant les méthodes de calcul
    des montants bruts de défaillance soudaine pour les expositions à des instruments
    de créance et de fonds propres et pour les expositions au risque de défaut découlant
    de certains instruments dérivés, et précisant la détermination des montants
    notionnels d’instruments autres que ceux mentionnés à l’article 325 quatervicies,
    paragraphe 4, du règlement (UE) no 575/2013
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2257 der Kommission vom 11. August 2022
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der Methoden zur
    Berechnung der Jump-to-Default-Bruttobeträge für Risikopositionen in Schuldtiteln
    und Eigenkapitalinstrumenten und für Risikopositionen mit Ausfallrisiko in bestimmten
    Derivaten und zur Bestimmung des Nominalbetrags anderer als der in Artikel 325w
    Absatz 4 der Verordnung (EU) Nr. 575/2013 genannten Instrumente
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/2257 на Комисията
    от 11 август 2022 година за допълнение на Регламент
    (ЕС) № 575/2013 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на методите за изчисляване на
    брутните суми, изложени на риск от внезапно
    неизпълнение, за експозициите към дългови
    и капиталови инструменти и за експозициите
    към риск от неизпълнение, произтичащ от някои
    дериватни инструменти, и за определяне на условната
    стойност на инструментите, различни от посочените
    в член 325ц, параграф 4 от Регламент (ЕС) № 575/2013
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/2257 ze dne 11. srpna
    2022, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    575/2013, pokud jde o regulační technické normy upřesňující metody výpočtu
    hrubých výší rizika náhlého selhání pro expozice vůči dluhovým a kapitálovým
    nástrojům a pro expozice vůči riziku selhání vyplývající z některých
    derivátových nástrojů, jakož i pomyslné hodnoty jiných nástrojů než
    nástrojů uvedených v čl. 325w odst. 4 nařízení (EU) č. 575/2013
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/2257 af 11. august 2022 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 575/2013
    for så vidt angår reguleringsmæssige tekniske standarder, som præciserer beregningsmetoderne
    for bruttobeløbene for pludselig misligholdelse for eksponeringer mod gælds-
    og aktieinstrumenter og for eksponeringer mod misligholdelsesrisici, der hidrører
    fra visse derivatinstrumenter, og som præciserer fastlæggelsen af den nominelle
    værdi af andre instrumenter end de i artikel 325w, stk. 4, i forordning (EU)
    nr. 575/2013 omhandlede
  type: main
