title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1586/70 du Conseil, du 27 juillet 1970, portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de figues
    sèches, présentées en emballages immédiats d'un contenu net inférieur ou
    égal à 15 Kg, de la position EX 08.03 B du tarif douanier commun, originaires
    d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1586/70 des Rates vom 27. Juli 1970 über die Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für getrocknete Feigen,
    in unmittelbaren Umschließungen mit einem Gewicht des Inhalts von 15 kg oder
    weniger, der Tarifstelle ex 08.03 B des Gemeinsamen Zolltarifs, mit Ursprung in
    Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1586/70 del Consiglio, del 27 luglio 1970, relativo
    all'apertura, alla ripartizione e alle modalità di gestione del contingente tariffario
    comunitario di fichi secchi, presentati in imballaggi immediati di contenuto netto
    di 15 kg o meno, della voce ex 08.03 B della tariffa doganale comune, originari
    della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1586/70 van de Raad van 27 juli 1970 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor gedroogde vijgen, in verpakkingen met een netto-inhoud per onmiddellijke
    verpakking van 15 kg of minder, van postonderverdeling ex 08.03 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Spanje
