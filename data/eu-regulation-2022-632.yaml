    uit Argentinië, Brazilië, Zuid-Afrika, Uruguay en Zimbabwe om het binnenbrengen
    in en de verspreiding binnen het grondgebied van de Unie van het plaagorganisme
    Phyllosticta citricarpa (McAlpine) Van der Aa te voorkomen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/632 z dnia 13 kwietnia 2022
