    Afrike, Urugvaja i Zimbabvea radi sprečavanja unošenja u Uniju i širenja unutar
    Unije štetnog organizma Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/632 végrehajtási rendelete (2022. április 13.)
    a Phyllosticta citricarpa (McAlpine) Van der Aa károsító Unió területére
    történő behurcolásának és az Unió területén belüli elterjedésének
    megelőzését célzó átmeneti intézkedéseknek az Argentínából, Brazíliából,
    Dél-Afrikából, Uruguayból és Zimbabwéből származó meghatározott gyümölcsök
    tekintetében történő megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/632 della Commissione del 13 aprile
    2022 che stabilisce misure temporanee per quanto concerne frutti specificati originari
    dell’Argentina, del Brasile, del Sud Africa, dell’Uruguay e dello Zimbabwe
    per impedire l’introduzione e la diffusione nel territorio dell’Unione dell’organismo
    nocivo Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/632 (2022. gada 13. aprīlis),
    ar ko attiecībā uz norādītajiem augļiem, kuru izcelsme ir Argentīna, Brazīlija,
    Dienvidāfrika, Urugvaja un Zimbabve, nosaka pagaidu pasākumus, kas veicami,
    lai nepieļautu kaitīgā organisma Phyllosticta citricarpa (Mc Alpine) Van der
    Aa ievešanu un izplatīšanos Savienības teritorijā
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/632 2022 m. balandžio 13
