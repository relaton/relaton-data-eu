    établissant des mesures temporaires à l’égard de certains fruits originaires
    d’Argentine, du Brésil, d’Afrique du Sud, d’Uruguay et du Zimbabwe visant
    à éviter l’introduction et la propagation sur le territoire de l’Union de
    l’organisme nuisible Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/632 der Kommission vom 13. April 2022
    mit befristeten Maßnahmen für spezifizierte Früchte mit Ursprung in Argentinien,
    Brasilien, Südafrika, Uruguay und Simbabwe zum Schutz des Unionsgebiets gegen
    die Einschleppung und Ausbreitung des Schädlings Phyllosticta citricarpa (McAlpine)
    Van der Aa
  type: main
- language: bg
  script: Cyrl
