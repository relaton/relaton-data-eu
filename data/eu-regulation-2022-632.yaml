    a fim de impedir a introdução e propagação no território da União da praga
    Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/632 al Comisiei din 13 aprilie
    2022 de stabilire a unor măsuri temporare privind fructele specificate originare
    din Argentina, Brazilia, Africa de Sud, Uruguay și Zimbabwe pentru a preveni
    introducerea și răspândirea în Uniune a organismului dăunător Phyllosticta
    citricarpa (Mc Alpine) Van der Aa
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/632 z 13. apríla 2022, ktorým
    sa stanovujú dočasné opatrenia týkajúce sa špecifikovaných ovocných plodov
    s pôvodom v Argentíne, Brazílii, Južnej Afrike, Uruguaji a Zimbabwe na zabránenie
    zavlečeniu škodlivého organizmu Phyllosticta citricarpa (Mc Alpine) Van der
    Aa na územie Únie a jeho šíreniu na tomto území
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/632 z dne 13. aprila 2022 o določitvi
    začasnih ukrepov v zvezi z opredeljenim sadjem s poreklom iz Argentine, Brazilije,
    Južne Afrike, Urugvaja in Zimbabveja za preprečitev vnosa škodljivega organizma
    Phyllosticta citricarpa (Mc Alpine) Van der Aa na ozemlje Unije in njegovega širjenja
    na ozemlju Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/632 de la Comisión de 13 de abril de
