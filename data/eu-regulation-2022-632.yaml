    li joriġina mill-Arġentina, mill-Brażil, mill-Afrika t’Isfel, mill-Urugwaj
    u miż-Żimbabwe biex jipprevjenu l-introduzzjoni fit-territorju tal-Unjoni tal-pest
    Phyllosticta citricarpa (Mc Alpine) Van der Aa u t-tixrid tiegħu
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/632 van de Commissie van 13 april 2022
