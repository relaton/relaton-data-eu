title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/632 of 13 April 2022 setting
    out temporary measures in respect of specified fruits originating in Argentina,
    Brazil, South Africa, Uruguay and Zimbabwe to prevent the introduction into, and
    the spread within, the Union territory of the pest Phyllosticta citricarpa (McAlpine)
    Van der Aa
  type: main
- language: fr
  script: Latn
