    z Argentyny, Brazylii, Republiki Południowej Afryki, Urugwaju i Zimbabwe w celu
    zapobieżenia wprowadzeniu na terytorium Unii i rozprzestrzenianiu się na nim
    agrofaga Phyllosticta citricarpa (McAlpine) Van der Aa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/632 da Comissão de 13 de abril de
