    ir Zimbabvės kilmės vaisiams taikomos laikinosios priemonės, kuriomis siekiama
    neleisti patekti į Sąjungos teritoriją kenkėjui Phyllosticta citricarpa (McAlpine)
    Van der Aa (citrusinei filostiktai) ir joje išplisti
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/632 tat-13
