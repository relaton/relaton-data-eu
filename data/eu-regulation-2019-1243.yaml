---
id: EURegulation20191243
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EU) 2019/1243 of the European Parliament and of the Council
    of 20 June 2019 adapting a number of legal acts providing for the use of the regulatory
    procedure with scrutiny to Articles 290 and 291 of the Treaty on the Functioning
    of the European Union
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/1243 du Parlement européen et du Conseil du 20 juin
    2019 adaptant aux articles 290 et 291 du traité sur le fonctionnement de l’Union
    européenne une série d’actes juridiques prévoyant le recours à la procédure
    de réglementation avec contrôle
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2019/1243 des Europäischen Parlaments und des Rates vom
    20. Juni 2019 zur Anpassung von Rechtsakten, in denen auf das Regelungsverfahren
    mit Kontrolle Bezug genommen wird, an Artikel 290 und 291 des Vertrags über die
    Arbeitsweise der Europäischen Union
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2019/1243 на Европейския парламент
    и на Съвета от 20 юни 2019 година за адаптиране
    на редица правни актове, предвиждащи използване
    на процедурата по регулиране с контрол, към
    членове 290 и 291 от Договора за функционирането
    на Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (EU) 2019/1243 ze dne 20. června
    2019, kterým se řada právních aktů stanovujících použití regulativního
    postupu s kontrolou přizpůsobuje článkům 290 a 291 Smlouvy o fungování
    Evropské unie
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EU) 2019/1243 af 20. juni 2019
    om tilpasning af en række retsakter, der indeholder bestemmelser om brug af forskriftsproceduren
    med kontrol, til artikel 290 og 291 i traktaten om Den Europæiske Unions funktionsmåde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) 2019/1243 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 20ής Ιουνίου 2019, για
    την προσαρμογή διαφόρων νομικών πράξεων οι
    οποίες προβλέπουν τη χρήση της κανονιστικής
    διαδικασίας με έλεγχο στα άρθρα 290 και 291 της
    Συνθήκης για τη λειτουργία της Ευρωπαϊκής
    Ένωσης
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EL) 2019/1243, 20. juuni 2019,
    millega kohandatakse Euroopa Liidu toimimise lepingu artiklitele 290 ja 291 teatavaid
    õigusakte, mis näevad ette kontrolliga regulatiivmenetluse kasutamise
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EU) 2019/1243, annettu 20 päivänä
    kesäkuuta 2019, eräiden säädösten, joissa säädetään valvonnan käsittävän
    sääntelymenettelyn käyttämisestä, mukauttamisesta Euroopan unionin toiminnasta
    tehdyn sopimuksen 290 ja 291 artiklaan
  type: main
- language: ga
  script: Latn
  content: Rialachán (AE) 2019/1243 ó Pharlaimint na hEorpa agus ón gComhairle
    an 20 Meitheamh 2019 lena ndéantar roinnt gníomhartha dlí lena ndéantar foráil
    maidir le húsáid an nós imeachta rialúcháin lena ngabhann grinnscrúdú a
    oiriúnú d’Airteagail 290 agus 291 den Chonradh ar Fheidhmiú an Aontais Eorpaigh
  type: main
- language: hr
  script: Latn
  content: Uredba (EU) 2019/1243 Europskog parlamenta i Vijeća od 20. lipnja 2019.
    o prilagodbi člancima 290. i 291. Ugovora o funkcioniranju Europske unije niza
    pravnih akata kojima se predviđa primjena regulatornog postupka s kontrolom
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács (EU) 2019/1243 rendelete (2019. június
    20.) az ellenőrzéssel történő szabályozási bizottsági eljárás alkalmazását
    előíró egyes jogi aktusoknak az Európai Unió működéséről szóló szerződés
    290. és 291. cikkéhez történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2019/1243 del Parlamento europeo e del Consiglio, del
    20 giugno 2019, che adatta agli articoli 290 e 291 del trattato sul funzionamento
    dell’Unione europea una serie di atti giuridici che prevedono il ricorso alla
    procedura di regolamentazione con controllo
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (ES) 2019/1243 (2019. gada 20. jūnijs),
    ar ko vairākus tiesību aktus, kuros paredzēta regulatīvās kontroles procedūras
    izmantošana, pielāgo Līguma par Eiropas Savienības darbību 290. un 291. pantam
  type: main
- language: lt
  script: Latn
  content: 2019 m. birželio 20 d. Europos Parlamento ir Tarybos reglamentas (ES)
    2019/1243, kuriuo prie Sutarties dėl Europos Sąjungos veikimo 290 ir 291 straipsnių
    pritaikomi keletas teisės aktų, kuriuose numatytas reguliavimo procedūros su
    tikrinimu taikymas
  type: main
- language: mt
  script: Latn
  content: Regolament (UE) 2019/1243 tal-Parlament Ewropew u tal-Kunsill tal-20 ta’
    Ġunju 2019 li jadatta għadd ta’ atti legali li jipprevedu l-użu tal-proċedura
    regolatorja bi skrutinju mal-Artikoli 290 u 291 tat-Trattat dwar il-Funzjonament
    tal-Unjoni Ewropea
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) 2019/1243 van het Europees Parlement en de Raad van 20
    juni 2019 tot aanpassing van een aantal rechtshandelingen die voorzien in het
    gebruik van de regelgevingsprocedure met toetsing, aan de artikelen 290 en 291
    van het Verdrag betreffende de werking van de Europese Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (UE) 2019/1243 z dnia 20
    czerwca 2019 r. dostosowujące niektóre akty prawne przewidujące stosowanie
    procedury regulacyjnej połączonej z kontrolą do art. 290 i 291 Traktatu o funkcjonowaniu
    Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) 2019/1243 do Parlamento Europeu e do Conselho, de 20 de
    junho de 2019, que adapta aos artigos 290.o e 291.° do Tratado sobre o Funcionamento
    da União Europeia uma série de atos jurídicos que preveem a aplicação do
    procedimento de regulamentação com controlo
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) 2019/1243 al Parlamentului European și al Consiliului
    din 20 iunie 2019 de adaptare la articolele 290 și 291 din Tratatul privind funcționarea
    Uniunii Europene a unei serii de acte juridice care prevăd utilizarea procedurii
    de reglementare cu control
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (EÚ) 2019/1243 z 20. júna 2019,
    ktorým sa viacero právnych aktov stanovujúcich použitie regulačného postupu
    s kontrolou prispôsobuje článkom 290 a 291 Zmluvy o fungovaní Európskej únie
  type: main
- language: sl
  script: Latn
  content: Uredba (EU) 2019/1243 Evropskega parlamenta in Sveta z dne 20. junija 2019
    o prilagoditvi več zakonodajnih aktov, v katerih je določena uporaba regulativnega
    postopka s pregledom, členoma 290 in 291 Pogodbe o delovanju Evropske unije
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2019/1243 del Parlamento Europeo y del Consejo, de 20 de
    junio de 2019, por el que se adapta a los artículos 290 y 291 del Tratado de
    Funcionamiento de la Unión Europea una serie de actos jurídicos que prevén
    el recurso al procedimiento de reglamentación con control
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EU) 2019/1243 av den 20 juni
    2019 om anpassning till artiklarna 290 och 291 i fördraget om Europeiska unionens
    funktionssätt av ett antal rättsakter som föreskriver tillämpning av det föreskrivande
    förfarandet med kontroll
  type: main
