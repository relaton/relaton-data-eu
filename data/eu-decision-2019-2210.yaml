    w sprawie wspólnego systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/2210 do Conselho de 19 de dezembro de
    2019 que altera a Decisão de Execução 2013/677/UE que autoriza o Luxemburgo
    a aplicar uma medida especial em derrogação ao artigo 285.o da Diretiva 2006/112/CE
    relativa ao sistema comum do imposto sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de Punere în Aplicare (UE) 2019/2210 a Consiliului din 19 decembrie
    2019 de modificare a Deciziei de punere în aplicare 2013/677/UE de autorizare
    a Luxemburgului în vederea aplicării unei măsuri speciale de derogare de la
    articolul 285 din Directiva 2006/112/CE privind sistemul comun al taxei pe valoarea
    adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie Rozhodnutie Rady (EÚ) 2019/2210 z 19. decembra 2019, ktorým
