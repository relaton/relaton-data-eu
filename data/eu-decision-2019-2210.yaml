    arvonlisäverojärjestelmästä annetun direktiivin 2006/112/EY 285 artiklasta
    poikkeava erityistoimenpide annetun täytäntöönpanopäätöksen 2013/677/EU
    muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena Odluka Vijeća (EU) 2019/2210 od 19. prosinca 2019. o izmjeni
