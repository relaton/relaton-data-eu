    een bijzondere maatregel in te voeren die afwijkt van artikel 285 van Richtlijn
    2006/112/EG betreffende het gemeenschappelijke stelsel van belasting over de toegevoegde
    waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja Wykonawcza Rady (UE) 2019/2210 z dnia 19 grudnia 2019 r. zmieniająca
