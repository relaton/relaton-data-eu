    zaviesť osobitné opatrenie odchyľujúce sa od článku 285 smernice 2006/112/ES
    o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni Sklep Sveta (EU) 2019/2210 z dne 19. decembra 2019 o spremembi
