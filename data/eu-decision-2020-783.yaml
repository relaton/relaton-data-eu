title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/783 of 12 June 2020 amending
    Decision 2012/757/EU as regards measures to adapt the frequency of periodic medical
    examination of railway staff undertaking safety-critical tasks other than train
    drivers due to the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/783 de la Commission du 12 juin 2020
    modifiant la décision 2012/757/UE en ce qui concerne des mesures d’adaptation
    de la fréquence de l’examen médical périodique à subir par le personnel
    des chemins de fer chargé de tâches critiques pour la sécurité autre que les
    conducteurs de train en raison de la pandémie de COVID-19
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/783 der Kommission vom 12. Juni 2020
    zur Änderung des Beschlusses 2012/757/EU der hinsichtlich Maßnahmen zur Anpassung
    der Häufigkeit der periodischen medizinischen Untersuchung von Eisenbahnpersonal
    mit sicherheitsrelevanten Aufgaben mit Ausnahme von Triebfahrzeugführern aufgrund
    der COVID-19-Pandemie
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/783 на Комисията
    от 12 юни 2020 година за изменение на Решение 2012/757/ЕС
    по отношение на мерки за адаптиране на честотата
    на периодичните медицински прегледи на железопътни
    служители, изпълняващи задачи от критично
    значение за безопасността и различни от машинисти,
    поради пандемията от COVID-19
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/783 ze dne 12. června 2020,
    kterým se mění rozhodnutí 2012/757/EU, pokud jde o opatření pro přizpůsobení
    četnosti pravidelných lékařských prohlídek u zaměstnanců železnic plnících
    úkoly důležité pro bezpečnost, s výjimkou strojvedoucích vlaků, s ohledem
    na pandemii COVID-19
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/783 af 12. juni 2020
