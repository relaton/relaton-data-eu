    tilpasning af hyppigheden af periodiske helbredsundersøgelser af jernbanepersonale,
    der udfører sikkerhedskritiske opgaver, ud over lokomotivførere på grund af
    covid-19-pandemien
  type: main
- language: el
  script: Grek
