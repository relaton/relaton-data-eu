    adaptar a frequência dos exames médicos periódicos do pessoal ferroviário
    que exerce funções críticas de segurança, com exceção dos maquinistas, devido
    à pandemia de COVID-19
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/783 a Comisiei din 12 iunie 2020
    de modificare a Deciziei 2012/757/UE în ceea ce privește măsurile de adaptare
    a frecvenței controlului medical periodic al personalului feroviar care îndeplinește
    sarcini critice pentru siguranță, în afara mecanicilor de locomotivă, în
    contextul pandemiei de COVID-19
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/783 z 12. júna 2020, ktorým
    sa mení rozhodnutie Komisie 2012/757/EÚ, pokiaľ ide o opatrenia na prispôsobenie
    periodicity pravidelných lekárskych prehliadok železničného personálu vykonávajúceho
    úlohy rozhodujúce z hľadiska bezpečnosti, s výnimkou rušňovodičov, v dôsledku
    pandémie COVID-19
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/783 z dne 12. junija 2020 o spremembi
