    la frequenza degli accertamenti sanitari periodici del personale ferroviario addetto
    alle mansioni di sicurezza essenziali, diverso dai macchinisti, in seguito alla
    pandemia di Covid-19
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/783 (2020. gada 12. jūnijs),
