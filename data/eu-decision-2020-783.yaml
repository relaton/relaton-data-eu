    medidas para adaptar la frecuencia de los reconocimientos médicos periódicos
    del personal ferroviario distinto de los maquinistas que realiza tareas críticas
    para la seguridad ferroviaria, debido a la pandemia de COVID-19
  type: main
- language: sv
  script: Latn
