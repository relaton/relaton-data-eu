    pregledov železniškega osebja, ki opravlja za varnost pomembne naloge, razen
    strojevodij, zaradi pandemije COVID-19
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/783 de la Comisión de 12 de junio de
