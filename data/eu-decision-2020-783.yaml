    de periodiciteit van periodieke medische keuringen van spoorwegpersoneel dat is
    belast met veiligheidskritieke taken, met uitzondering van machinisten, als gevolg
    van de COVID-19-pandemie
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/783 z dnia 12 czerwca 2020 r. zmieniająca
    decyzję 2012/757/UE w odniesieniu do środków mających na celu dostosowanie
    częstotliwości okresowych badań lekarskich pracowników kolei podejmujących
    czynności o istotnym znaczeniu dla bezpieczeństwa, innych niż maszyniści,
    ze względu na pandemię COVID-19
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/783 da Comissão de 12 de junho de 2020
