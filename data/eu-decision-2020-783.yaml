    pandēmijas dēļ pielāgo periodisko medicīnisko pārbaužu biežumu personālam,
    kas veic drošībai būtiskus uzdevumus, izņemot mašīnistiem
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/783 2020 m. birželio 12 d.
