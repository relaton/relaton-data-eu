    du beurre au Luxembourg
  type: main
- language: de
  script: Latn
  content: '64/601/EWG: Entscheidung der Kommission vom 29. Oktober 1964 über die
    Festsetzung des Höchstbetrags der Ausgleichsabgabe bei der Ausfuhr von Butter
    aus Luxemburg und des Betrages der Subvention bei der Einfuhr von Butter nach
    Luxemburg'
  type: main
- language: it
  script: Latn
  content: '64/601/CEE: Decisione della Commissione, del 29 ottobre 1964, relativa
    alla fissazione dell''ammontare massimo degli importi di compensazione all''esportazione
    di burro in provenienza dal Lussemburgo e dell''ammontare della sovvenzione all''importazione
    di burro verso il Lussemburgo'
  type: main
- language: nl
