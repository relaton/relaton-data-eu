    compatte integrali (CFL-i) originarie della Repubblica popolare cinese in seguito
    a un riesame in previsione della scadenza a norma dell’articolo 11, paragrafo
    2, del regolamento (CE) n. 384/96 e li estende alle importazioni dello stesso
    prodotto spedite dalla Repubblica socialista del Vietnam, dalla Repubblica islamica
    del Pakistan e dalla Repubblica delle Filippine
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1205/2007 ( 2007. gada 15. oktobris ), ar ko pēc
