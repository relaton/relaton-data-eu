title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1205/2007 of 15 October 2007 imposing anti-dumping
    duties on imports of integrated electronic compact fluorescent lamps (CFL-i) originating
    in the People’s Republic of China following an expiry review pursuant to Article
    11(2) of Council Regulation (EC) No 384/96 and extending to imports of the same
    product consigned from the Socialist Republic of Vietnam, the Islamic Republic
    of Pakistan and the Republic of the Philippines
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1205/2007 du Conseil du 15 octobre 2007 instituant
    des droits antidumping sur les importations de lampes fluorescentes à ballast
    électronique intégré (CFL-i) originaires de la République populaire de Chine,
    à la suite d’un réexamen au titre de l’expiration des mesures, effectué
    conformément à l’article 11, paragraphe 2, du règlement (CE) n° 384/96,
    et étendant ces mesures aux exportations du même produit expédiées de la République
    socialiste du Viêt Nam, de la République islamique du Pakistan et de la République
    des Philippines
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1205/2007 des Rates vom 15. Oktober 2007 zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren integrierter elektronischer Kompakt-Leuchtstofflampen
    (CFL-i) mit Ursprung in der Volksrepublik China nach einer Überprüfung wegen
    des bevorstehenden Außerkrafttretens der Maßnahmen gemäß Artikel 11 Absatz
    2 der Verordnung (EG) Nr. 384/96 und zur Ausweitung der Antidumpingzölle auf
    die Einfuhren derselben aus der Sozialistischen Republik Vietnam, der Islamischen
    Republik Pakistan und der Republik der Philippinen versandten Ware
  type: main
