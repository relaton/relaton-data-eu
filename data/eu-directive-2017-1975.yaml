title:
- language: en
  script: Latn
  content: Commission Delegated Directive (EU) 2017/1975 of 7 August 2017 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for cadmium in colour converting light-emitting diodes (LEDs) for
    use in display systems
  type: main
- language: fr
  script: Latn
