    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru cadmiul din diodele emițătoare de lumină (leduri) cu schimb
    de culoare destinate utilizării în sistemele de afișare
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2017/1975 zo 7. augusta 2017, ktorou
