    des Rates hinsichtlich einer Ausnahme für Cadmium in farbkonvertierenden Leuchtdioden
    (LED) zur Verwendung in Display-Systemen
  type: main
- language: bg
  script: Cyrl
  content: Делегирана директива (ЕС) 2017/1975 на Комисията
