    mění příloha III směrnice Evropského parlamentu a Rady 2011/65/EU, pokud
    jde o výjimku pro použití kadmia v určitých barvu konvertujících diodách
    vyzařujících světlo (LED) v systémech vizualizace
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede direktiv (EU) 2017/1975 af 7. august 2017 om ændring
