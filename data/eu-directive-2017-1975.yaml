    aux fins de son adaptation au progrès scientifique et technique, l'annexe III
    de la directive 2011/65/UE du Parlement européen et du Conseil en ce qui concerne
    une exemption relative au cadmium dans les diodes électroluminescentes (DEL)
    destinées à être utilisées dans les systèmes d'affichage
  type: main
- language: de
  script: Latn
  content: Delegierte Richtlinie (EU) 2017/1975 der Kommission vom 7. August 2017
    zur Änderung — zwecks Anpassung an den wissenschaftlichen und technischen Fortschritt
