    на приложение III към Директива 2011/65/ЕС на Европейския
    парламент и на Съвета, относно освобождаване
    от ограничение за кадмий в някои променящи
    цвета си светодиоди за използване в дисплейни
    системи
  type: main
- language: cs
  script: Latn
