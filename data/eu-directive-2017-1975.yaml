    Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dla kadmu w diodach
    elektroluminescencyjnych (LED) dokonujących konwersji długości fali światła
    w systemach wyświetlania
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2017/1975 da Comissão, de 7 de agosto de 2017,
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no que diz
    respeito a uma isenção relativa à utilização de cádmio em díodos emissores
    de luz (LED) de conversão de cor para sistemas de visualização
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2017/1975 a Comisiei din 7 august 2017 de modificare,
