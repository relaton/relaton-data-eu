    Direktīvas 2011/65/ES III pielikumu groza attiecībā uz atbrīvojumu kadmija
    izmantošanai krāsu mainošās gaismas diodēs (LED), ko lieto displeju sistēmās
  type: main
- language: lt
  script: Latn
  content: 2017 m. rugpjūčio 7 d. Komisijos deleguotoji direktyva (ES) 2017/1975,
