title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 638/86 of 28 February 1986 laying down detailed
    rules for the management of the quotas applicable in respect of imports into Portugal
    and Spain of certain fruit and vegetables from the Community as constituted at
    31 December 1985
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 638/86 de la Commission du 28 février 1986 déterminant
    les modalités d' application relatives à la gestion des contingents à l' importation
    en Espagne et au Portugal de certains fruits et légumes en provenance de la Communauté
    dans sa composition au 31 décembre 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 638/86 der Kommission vom 28. Februar 1986 mit Durchführungsbestimmungen
    über die Verwaltung der Kontingente für die Einfuhr von bestimmtem Obst und
    Gemüse aus der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985 nach
    Spanien und Portugal
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 638/86 af 28. februar 1986 om gennemførelsesbestemmelser
    for forvaltningen af importkontingenter i Spanien og Portugal for visse frugter
    og grønsager fra Fællesskabet i dets sammensætning pr. 31. december 1985
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 638/86 της Επιτροπής
    της 28ης Φεβρουαρίου 1986 που καθορίζει τις λεπτομέρειες
    εφαρμογής όσον αφορά τη διαχείριση των ποσοστώσεων
    εισαγωγής στην Ισπανία και την Πορτογαλία
    ορισμένων οπωροκηπευτικών με προέλευση την
    Κοινότητα στη σύνθεσή της στις 31 Δεκεμβρίου
    1985
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 638/86 della Commissione del 28 febbraio 1986 che
    stabilisce le modalità di applicazione relative alla gestione dei contingenti
    all' importazione in Spagna e in Portogallo di taluni ortofrutticoli provenienti
    dalla Comunità nella sua composizione al 31 dicembre 1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 638/86 van de Commissie van 28 februari 1986 tot
