id: EURegulation6072000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 607/2000 of 20 March 2000 suspending, for a
    limited period, Regulation (EC) No 2151/1999 imposing a ban on flights between
    the territories of the Community and the Federal Republic of Yugoslavia other
    than the Republic of Montenegro or the Province of Kosovo and amending Regulations
    (EC) No 1294/1999 and (EC) No 2111/1999 as regards payments and supplies in relation
    to flights during the period of suspension
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 607/2000 du Conseil, du 20 mars 2000, suspendant, pour
    une période limitée, le règlement (CE) nº 2151/1999 concernant l'interdiction
    des vols entre les territoires de la Communauté et de la République fédérale
    de Yougoslavie, à l'exception de la République du Monténégro et de la province
    du Kosovo, et modifiant les règlements (CE) nº 1294/1999 et (CE) nº 2111/1999
    en ce qui concerne les paiements et les approvisionnements effectués en relation
    avec les vols durant la période de suspension
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 607/2000 des Rates vom 20. März 2000 zur zeitlich
    begrenzten Aussetzung der Verordnung (EG) Nr. 2151/1999 zur Verhängung eines
    Flugverbots zwischen dem Gebiet der Gemeinschaft und dem Gebiet der Bundesrepublik
    Jugoslawien mit Ausnahme der Teilrepublik Montenegro und der Provinz Kosovo und
    zur Änderung der Verordnungen (EG) Nr. 1294/1999 und (EG) Nr. 2111/1999 betreffend
    Zahlungen und Lieferungen im Zusammenhang mit dem Flugverkehr während der sechsmonatigen
    Aussetzung
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 607/2000 af 20. marts 2000 om suspension i
    en begrænset periode af forordning (EF) nr. 2151/1999 om forbud mod flyvninger
    mellem Fællesskabets område og Forbundsrepublikken Jugoslaviens område, bortset
    fra Republikken Montenegro og Kosovo-provinsen og om ændring af forordning (EF)
    nr. 1294/1999 og (EF) nr. 2111/1999, hvad angår betalinger og leverancer i tilknytning
    til flyvninger i suspensionsperioden
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 607/2000 του Συμβουλίου,
    της 20ής Μαρτίου 2000, για την αναστολή, για περιορισμένη
    χρονική περίοδο, του κανονισμού (ΕΚ) αριθ. 2151/1999
    σχετικά με την απαγόρευση πτήσεων μεταξύ των
    εδαφών της Κοινότητας και της Ομοσπονδιακής
    Δημοκρατίας της Γιουγκοσλαβίας, εκτός από
    τη Δημοκρατία του Μαυροβουνίου και την επαρχία
    του Κοσσυφοπεδίου, και για την τροποποίηση
    των κανονισμών (ΕΚ) αριθ. 1294/1999 και (ΕΚ) αριθ.
    2111/1999 σχετικά με τις πληρωμές και τις προμήθειες
    που αφορούν πτήσεις κατά την περίοδο της αναστολής
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 607/2000, annettu 20 päivänä maaliskuuta 2000,
    lentokiellon käyttöönottamisesta Euroopan yhteisön ja Jugoslavian liittotasavallan
    alueiden välillä Montenegron tasavaltaa ja Kosovon maakuntaa lukuun ottamatta
    asetuksen (EY) N:o 2151/1999 täytäntöönpanon lykkäämisestä rajoitetuksi
    ajaksi ja asetusten (EY) N:o 1294/1999 ja (EY) N:o 2111/1999 muuttamisesta tämän
    soveltamisen keskeyttämisen aikana tehtäviin lentoihin liittyvien maksujen ja
    toimitusten osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 607/2000 del Consiglio, del 20 marzo 2000, che sospende
    per un periodo limitato il regolamento (CE) n. 2151/1999 che impone un divieto
    di volo tra i territori della Comunità e della Repubblica federale di Iugoslavia
    ad esclusione della Repubblica di Montenegro e della provincia del Kosovo e modifica
    i regolamenti (CE) n. 1294/1999 e (CE) n. 2111/1999 per quanto riguarda i pagamenti
    e le forniture in relazione ai voli durante il periodo di sospensione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 607/2000 van de Raad van 20 maart 2000 tot schorsing
    voor een beperkte periode, van Verordening (EG) nr. 2151/1999 houdende een verbod
    op vluchten tussen het grondgebied van de Gemeenschap en het grondgebied van de
    Federale Republiek Joegoslavië, met uitzondering van de Republiek Montenegro
    en de provincie Kosovo en tot wijziging van de Verordeningen (EG) nr. 1294/1999
    en (EG) nr. 2111/1999 ten aanzien van de betalingen en leveringen met betrekking
    tot vluchten tijdens de schorsingsperiode
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 607/2000 do Conselho, de 20 de Março de 2000, que
    suspende, por um período limitado, o Regulamento (CE) n.o 2151/1999 relativo
    à proibição de voos entre os territórios da Comunidade e da República Federativa
    da Jugoslávia, com excepção da República do Montenegro e da província do
    Kosovo e que altera os Regulamentos (CE) n.o 1294/1999 e (CE) n.o 2111/1999 no
    que respeita aos pagamentos e fornecimentos relativos aos voos durante o período
    de suspensão
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 607/2000 del Consejo, de 20 de marzo de 2000, que suspende,
    durante un período determinado, el Reglamento (CE) nº 2151/1999 por el que se
    prohíben los vuelos entre los territorios de la Comunidad y el territorio de
    la República Federativa de Yugoslavia excepto la República de Montenegro y la
    provincia de Kosovo, y por el que se modifican los Reglamentos (CE) nos 1294/1999
    y 2111/1999 en lo relativo a los pagos y suministros en relación con los vuelos
    durante el período de suspensión
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 607/2000 av den 20 mars 2000 om att tillfälligt
    upphäva, under en begränsad period, rådets förordning (EG) nr 2151/1999 om
    införande av ett förbud mot flygningar mellan gemenskapens och Förbundsrepubliken
    Jugoslaviens territorier med undantag av Republiken Montenegro och Kosovoprovinsen,
    och om att ändra rådets förordningar (EG) nr 1294/1999 och (EG) nr 2111/1999
    med avseende på betalningar och leveranser som hänför sig till flygningar under
    tiden för det tillfälliga upphävandet
  type: main
