title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2444/83 of 29 August 1983 imposing a provisional
    anti-dumping duty on certain imports of hardboard originating in Czechoslovakia,
    Poland and Sweden and re-opening the anti-dumping proceedings concerning these
    imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2444/83 de la Commission du 29 août 1983 portant institution
    d' un droit anti-"dumping" provisoire à l' égard de certaines importations de
    panneaux durs, originaires de Pologne, de Suède et de Tchécoslovaquie, et portant
    réouverture des procédures anti-"dumping" concernant ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2444/83 der Kommission vom 29. August 1983 zur Festsetzung
    eines vorläufigen Antidumpingzolls auf bestimmte Einfuhren von Hartplatten mit
    Ursprung in Polen, Schweden und der Tschechoslowakei sowie zur Wiedereröffnung
    der Antidumpingverfahren betreffend diese Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2444/83 af 29. august 1983 om indførelse
    af en midlertidig antidumpingtold på importen af visse typer hårde plader med
    oprindelse i Polen, Sverige og Tjekkoslovakiet og om genoptagelse af antidumpingproceduren
    vedrørende importen af disse varer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2444/83 της Επιτροπής
    της 29ης Αυγούστου 1983 περί επιβολής προσωρινού
    δασμού αντιντάμπινγκ στις εισαγωγές οικοδομικών
    πλακών—διαφραγμάτων εξ ινών (hardboard) καταγωγής
    Πολωνίας, Σουηδίας και Τσεχοσλοβακίας, και
    εκ νέου κινήσεως σχετικής διαδικασίας αντιντάμπινγκ
    στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2444/83 della Commissione del 29 agosto 1983 che istituisce
    un dazio antidumping provvisorio su talune importazioni di cartone di fibra compresso
    originarie della Cecoslovacchia, della Polonia e della Svezia, e riapre la procedura
    antidumping nei confronti di dette importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2444/83 van de Commissie van 29 augustus 1983 houdende
    instelling van een voorlopig anti-dumpingrecht op sommige invoer van hardboard
    van oorsprong uit Polen, Tsjechoslowakije en Zweden, en heropening van de anti-dumpingprocedure
    met betrekking tot deze invoer
  type: main
