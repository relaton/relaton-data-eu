    Bacillus velezensis NRRL B-50509 und Bacillus subtilis NRRL B-50510 als Zusatzstoff
    in Futtermitteln für Mastschweine aller Suidae-Arten und Absetzferkel von Suidae-Arten
    von geringerer wirtschaftlicher Bedeutung (Zulassungsinhaber: Genencor International
    B.V.)'
  type: main
