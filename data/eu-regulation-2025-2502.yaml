title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/2502 of 11 December 2025
    concerning the authorisation of a preparation of protease produced with Bacillus
    subtilis CBS 148232 and viable spores of Bacillus velezensis NRRL B-50508, Bacillus
    velezensis NRRL B-50509 and Bacillus subtilis NRRL B-50510 as a feed additive
    for pigs for fattening of all Suidae species and weaned piglets of minor Suidae
    species (holder of authorisation: Genencor International B.V.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/2502 de la Commission du 11 décembre
    2025 concernant l’autorisation d’une préparation de protéase produite avec
    Bacillus subtilis CBS 148232 et de spores viables de Bacillus velezensis NRRL
    B-50508, de Bacillus velezensis NRRL B-50509 et de Bacillus subtilis NRRL B-50510
    en tant qu’additif pour l’alimentation des porcs d’engraissement de toutes
    les espèces de suidés et des porcelets sevrés d’espèces mineures de suidés
    (titulaire de l’autorisation: Genencor International B.V.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/2502 der Kommission vom 11. Dezember
