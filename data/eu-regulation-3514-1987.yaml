    percevoir dans les cas où le prix minimal à l' importation, applicable aux raisins
    secs, n' est pas respecté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3514/87 der Kommission vom 23. November 1987 zur Änderung
