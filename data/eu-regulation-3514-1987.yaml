    getrocknete Weintrauben und der im Falle der Nichteinhaltung dieses Preises zu
    erhebenden Ausgleichsabgabe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3514/87 af 23. november 1987 om ændring
