title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3315/73 of the Commission of 6 December 1973 re-establishing
    Common Customs Tariff duties on sheep- and lamb-skin leather, falling within subheading
    No 41.03 B II, originating in developing countries to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December 1972
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3315/73 de la Commission, du 6 décembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux peaux d' ovins de la sous-position tarifaire 41.03 B II originaires des pays
    en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2762/72 du Conseil du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3315/73 der Kommission vom 6. Dezember 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Schaf- und Lammleder, der Tarifstelle
    41.03 B II, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3315/73 af 6. december 1973 om genindførelse
    af told ifølge den fælles toldtarif for læder af fåre- og lammeskind, under
    position 41.03 B II, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3315/73 della Commissione, del 6 dicembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    pelli ovine della sottovoce doganale n. 41.03 B II, originarie dei paesi in via
    di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2762/72 del Consiglio, del 19 dicembre 1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3315/73 van de Commissie van 6 december 1973 houdende
    wederinstelling van de heffing van de rechten van het gemeenschappelijk douanetarief
    voor schapeleder van onderverdeling 41.03 B II, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 tariefpreferenties werden geopend
  type: main
