    στην Πορτογαλία να χρησιμοποιεί στατιστικά
    δεδομένα προγενέστερα εκείνων του προτελευταίου
    έτους κατά τον υπολογισμό της βάσης των ιδίων
    πόρων που προέρχονται από το φόρο της προστιθέμενης
    αξίας (Το κείμενο στην πορτογαλική γλώσσα είναι
