title:
- language: en
  script: Latn
  content: '96/501/EC, Euratom: Commission Decision of 24 July 1996 amending Decision
    96/159/Euratom, EC authorizing Portugal to use statistics for years earlier than
    the last year but one for the calculation of the VAT own resources base (Only
    the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/501/CE, Euratom: Décision de la Commission du 24 juillet 1996 modifiant
    la décision 96/159/Euratom, CE autorisant le Portugal à utiliser des données
    statistiques antérieures à la pénultième année pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '96/501/EG, Euratom: Entscheidung der Kommission vom 24. Juli 1996 zur
    Änderung der Entscheidung 96/159/Euratom, EG, mit der Portugal ermächtigt wird,
    statistische Angaben aus Jahren vor dem vorletzten Jahr vor dem betreffenden Haushaltsjahr
    bei der Berechnung der Grundlage für die MwSt.-Eigenmittel zu verwenden (Nur
    der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '96/501/EF, Euratom: Kommissionens beslutning af 24. juli 1996 om ændring
    af beslutning 96/159/Euratom, EF, om bemyndigelse af Portugal til at beregne grundlaget
    for Fællesskabernes momsindtægter på basis af statistiske oplysninger hidrørende
    fra år, der ligger længere tilbage end det næstsidste år (Kun den portugisiske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
