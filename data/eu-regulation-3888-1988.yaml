- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3888/88 of 14 December 1988 re-establishing
    the levying of customs duties on silicides, falling within CN code 2850 00 70,
    originating in Brazil, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3888/88 de la Commission du 14 décembre 1988 portant
