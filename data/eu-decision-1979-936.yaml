    Sorten gezahlten Prämien durch den EAGFL, Abteilung Ausrichtung, an das Königreich
    Belgien (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/936/EØF: Kommissionens beslutning af 22. oktober 1979 om refusion
