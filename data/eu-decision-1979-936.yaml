  script: Latn
  content: '79/936/EEC: Commission Decision of 22 October 1979 on the reimbursement
    by the Guidance Section of the EAGGF to the Kingdom of Belgium of the premiums
    paid during 1978 for grubbing apple trees and pear trees of certain varieties
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/936/CEE: Décision de la Commission, du 22 octobre 1979, relative au
    remboursement par le Fonds européen d''orientation et de garantie agricole (FEOGA),
    section "orientation", au Royaume de Belgique des primes versées pendant l''année
    1978 pour l''arrachage de pommiers et de poiriers de certaines variétés (Les
    textes en langues française et néerlandaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/936/EWG: Entscheidung der Kommission vom 22. Oktober 1979 über die
