id: EUDecision2015321
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/321 of 26 February 2015 amending
    Decision 2008/989/EC authorising Member States, in accordance with Council Directive
    1999/105/EC, to take decisions on the equivalence of the guarantees afforded by
    forest reproductive material to be imported from certain third countries (notified
    under document C(2015) 1045)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/321 de la Commission du 26 février 2015
    modifiant la décision 2008/989/CE autorisant les États membres, conformément
    à la directive 1999/105/CE du Conseil, à décider de l'équivalence des garanties
    offertes par les matériels forestiers de reproduction destinés à être importés
    de certains pays tiers [notifiée sous le numéro C(2015) 1045]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/321 der Kommission vom 26. Februar 2015
    zur Änderung der Entscheidung 2008/989/EG zur Ermächtigung der Mitgliedstaaten,
    im Einklang mit der Richtlinie 1999/105/EG des Rates Entscheidungen darüber zu
    treffen, ob aus bestimmten Drittländern einzuführendes forstliches Vermehrungsgut
    die gleiche Gewähr bietet wie forstliches Vermehrungsgut aus der Gemeinschaft
    (Bekanntgegeben unter Aktenzeichen C(2015) 1045)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/321 на Комисията
    от 26 февруари 2015 година за изменение на Решение
    2008/989/ЕО за разрешаване на държавите членки
    да вземат решения относно еквивалентността
    на гаранциите, давани от горския репродуктивен
    материал, внасян от някои трети страни, в съответствие
    с Директива 1999/105/ЕО на Съвета (нотифицирано
    под номер С(2015) 1045)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/321 ze dne 26. února 2015 ,
    kterým se mění rozhodnutí 2008/989/ES, kterým se členské státy opravňují
    k přijetí rozhodnutí v souladu se směrnicí Rady 1999/105/ES o stejných zárukách
    poskytovaných ve vztahu k reprodukčnímu materiálu lesních dřevin, který
    má být dovezen z určitých třetích zemí (oznámeno pod číslem C(2015)
    1045)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/321 af 26. februar 2015
    om ændring af beslutning 2008/989/EF om bemyndigelse af medlemsstaterne, i henhold
    til Rådets direktiv 1999/105/EF, til at træffe afgørelser om, hvorvidt forstligt
    formeringsmateriale, der skal importeres fra visse tredjelande, frembyder samme
    sikkerhed som forstligt formeringsmateriale produceret i Fællesskabet (meddelt
    under nummer C(2015) 1045)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/321 της Επιτροπής,
    της 26ης Φεβρουαρίου 2015 , για την τροποποίηση
    της απόφασης 2008/989/ΕΚ που επιτρέπει στα κράτη
    μέλη, σύμφωνα με την οδηγία 1999/105/ΕΚ του Συμβουλίου,
    να λάβουν αποφάσεις για την ισοδυναμία των
    εγγυήσεων που παρέχονται από το δασικό πολλαπλασιαστικό
    υλικό προς εισαγωγή από ορισμένες τρίτες χώρες
    [κοινοποιηθείσα υπό τον αριθμό C(2015) 1045]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/321, 26. veebruar 2015 , millega muudetakse
    otsust 2008/989/EÜ, millega liikmesriikidel lubatakse vastavalt nõukogu direktiivile
    1999/105/EÜ teha otsuseid teatavatest kolmandatest riikidest imporditavale metsapaljundusmaterjalile
    antavate tagatiste samaväärsuse kohta (teatavaks tehtud numbri C(2015) 1045
    all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/321, annettu 26 päivänä
    helmikuuta 2015 , luvan antamisesta jäsenvaltioille tehdä päätöksiä neuvoston
    direktiivin 1999/105/EY mukaisesti tietyistä kolmansista maista tuotavaa metsänviljelyaineistoa
    koskevien takeiden vastaavuudesta tehdyn päätöksen 2008/989/EY muuttamisesta
    (tiedoksiannettu numerolla C(2015) 1045)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/321 оd 26. veljače 2015. o izmjeni
    Odluke Komisije 2008/989/EZ kojom se, u skladu s Direktivom Vijeća 1999/105/EZ,
    ovlašćuju države članice da odlučuju o ekvivalenciji jamstava koja se pružaju
    za šumski reprodukcijski materijal koji se uvozi iz određenih trećih zemalja
    (priopćeno pod brojem dokumenta C(2015) 1045)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/321 végrehajtási határozata ( 2015. február
    26. ) az egyes harmadik országokból behozandó erdészeti szaporítóanyagok
    tekintetében nyújtott biztosítékokra vonatkozó határozatok meghozatalának
    a tagállamok számára az 1999/105/EK tanácsi irányelvvel összhangban történő
    engedélyezéséről szóló 2008/989/EK határozat módosításáról (az értesítés
    a C(2015) 1045. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/321 della Commissione, del 26 febbraio
    2015 , recante modifica della decisione 2008/989/CE che autorizza gli Stati membri,
    in conformità della direttiva 1999/105/CE del Consiglio, a prendere decisioni
    in merito all'equivalenza delle garanzie fornite da materiali forestali di moltiplicazione
    importati da determinati paesi terzi [notificata con il numero C(2015) 1045]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/321 ( 2015. gada 26. februāris
    ), ar kuru groza Lēmumu 2008/989/EK, ar ko saskaņā ar Padomes Direktīvu 1999/105/EK
    pilnvaro dalībvalstis pieņemt lēmumus par tāda meža reproduktīvā materiāla
    sniegto garantiju ekvivalenci, kas jāimportē no dažām trešām valstīm (izziņots
    ar dokumenta numuru C(2015) 1045)
  type: main
- language: lt
  script: Latn
  content: 2015 m. vasario 26 d. Komisijos įgyvendinimo sprendimas (ES) 2015/321,
    kuriuo iš dalies keičiamas Sprendimas 2008/989/EB, kuriuo valstybėms narėms
    pagal Tarybos direktyvą 1999/105/EB leidžiama priimti sprendimus dėl garantijų,
    suteiktų iš tam tikrų trečiųjų šalių importuotinai miško dauginamajai
    medžiagai, atitikimo (pranešta dokumentu C(2015) 1045)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/321 tas- 26
    ta' Frar 2015 li temenda d-Deċiżjoni 2008/989/KE li tawtorizza lill-Istati Membri,
    skont id-Direttiva tal-Kunsill 1999/105/KE, biex jieħdu deċiżjonijiet dwar
    l-ekwivalenza tal-garanziji mogħtija permezz tal-materjal riproduttiv għall-foresti
    li għandu jiġi importat minn ċerti pajjiżi terzi (notifikata bid-dokument
    C(2015) 1045)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/321 van de Commissie van 26 februari 2015
    tot wijziging van Beschikking 2008/989/EG tot machtiging van de lidstaten, overeenkomstig
    Richtlijn 1999/105/EG van de Raad, om besluiten te nemen over de gelijkwaardigheid
    van de door uit derde landen in te voeren bosbouwkundig teeltmateriaal geboden
    waarborgen (Kennisgeving geschied onder nummer C(2015) 1045)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/321 z dnia 26 lutego 2015 r. zmieniająca
    decyzję 2008/989/WE upoważniającą państwa członkowskie, zgodnie z dyrektywą
    Rady 1999/105/WE, do podjęcia decyzji odnośnie do równoważności gwarancji
    dostarczanych w odniesieniu do leśnego materiału rozmnożeniowego przywożonego
    z określonych krajów trzecich (notyfikowana jako dokument nr C(2015) 1045)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/321 da Comissão, de 26 de fevereiro de
    2015 , que altera a Decisão 2008/989/CE que autoriza os Estados-Membros, em conformidade
    com a Diretiva 1999/105/CE do Conselho, a tomar decisões sobre a equivalência
    das garantias oferecidas pelos materiais florestais de reprodução a importar
    de certos países terceiros [notificada com o número C(2015) 1045]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/321 a Comisiei din 26 februarie
    2015 de modificare a Deciziei 2008/989/CE de autorizare a statelor membre, în
    conformitate cu Directiva 1999/105/CE a Consiliului, să adopte decizii privind
    echivalența garanțiilor oferite de materialul forestier de reproducere provenind
    din anumite țări terțe [notificată cu numărul C(2015) 1045]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/321 z 26. februára 2015 ,
    ktorým sa mení rozhodnutie 2008/989/ES, ktorým sa v súlade so smernicou Rady
    1999/105/ES členským štátom povoľuje rozhodovať o rovnocennosti záruk poskytnutých
    na množiteľský materiál lesných kultúr, ktorý sa má dovážať z určitých
    tretích krajín [oznámené pod číslom C(2015) 1045]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/321 z dne 26. februarja 2015 o spremembi
    Odločbe 2008/989/ES o pooblastilu državam članicam za odločanje v skladu z
    Direktivo Sveta 1999/105/ES o enakovrednosti jamstev za gozdni reprodukcijski
    material, ki se uvaža iz nekaterih tretjih držav (notificirano pod dokumentarno
    številko C(2015) 1045)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/321 de la Comisión, de 26 de febrero
    de 2015 , que modifica la Decisión 2008/989/CE por la que se autoriza a los Estados
    miembros, con arreglo a la Directiva 1999/105/CE del Consejo, a tomar decisiones
    sobre la equivalencia de las garantías ofrecidas por los materiales forestales
    de reproducción que hayan de importarse de determinados terceros países [notificada
    con el número C(2015) 1045]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/321 av den 26 februari 2015
    om ändring av beslut 2008/989/EG om bemyndigande för medlemsstaterna i enlighet
    med rådets direktiv 1999/105/EG att fatta beslut om huruvida skogsodlingsmaterial
    som ska importeras från vissa tredjeländer ger samma garantier som skogsodlingsmaterial
    som producerats i gemenskapen [delgivet med nr C(2015) 1045]
