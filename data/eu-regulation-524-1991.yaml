    DE TOEPASSING VAN BESLUIT NR. 1/91 VAN DE ACS-EEG-RAAD VAN MINISTERS HOUDENDE
    VERLENGING VAN BESLUIT NR. 2/90 BETREFFENDE DE OVERGANGSMAATREGELEN DIE GELDEN
    VANAF 1 MAART 1990
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 524/91 DO CONSELHO de 27 de Fevereiro de 1991 respeitante
    à aplicação da Decisão nº 1/91 do Conselho dos Ministros ACP-CEE que prorroga
    a Decisão nº 2/90 relativa às medidas transitórias válidas a partir de 1
    de Março de 1990 #O CONSELHO DAS COMUNIDADES EUROPEIAS, # Tendo em conta o Tratado
    que institui a Comunidade Económica Europeia e, nomeadamente, os seus artigos
    113º e 235º, # Tendo em conta a proposta da Comissão, # Tendo em conta o parecer
    do Parlamento Europeu (1), # Considerando que a Terceira Convenção ACP-CEE,
    assinada em Lomé em 8 de Dezembro de 1984, expirou em 28 de Fevereiro de 1990;
    # Considerando que a Quarta Convenção ACP-CEE, assinada em Lomé em 15 de Dezembro
    de 1989, ainda não entrou em vigor; # Considerando que a aplicação da Decisão
    nº 2/90 do Conselho dos Ministros ACP-CEE está limitada a 28 de Fevereiro de
    1991; # Considerando que a aplicação da Decisão nº 1/91 do Conselho dos Ministros
    ACP-CEE prorrogou aquela decisão até à entrada em vigor da Quarta Convenção
    ACP-CEE mas, o mais tardar, até 30 de Junho de 1991; # Considerando que é necessário
    tomar as medidas decorrentes da execução da Decisão nº 1/91, # ADOPTOU O PRESENTE
    REGULAMENTO: Artigo 1º A Decisão nº 1/91 do Conselho dos Ministros ACP-CEE
    é aplicável na Comunidade a partir de 1 de Março de 1991 até à entrada em
    vigor da Quarta Convenção ACP-CEE mas, o mais tardar, até 30 de Junho de 1991,
    sem prejuízo das disposições autónomas mais favoráveis a tomar pela Comunidade
    no que diz respeito ao regime das importações dos produtos ACP. # O texto da
    decisão vem no anexo ao presente regulamento. Artigo 2º O presente regulamento
    entra em vigor na data da sua publicação no Jornal Oficial das Comunidades Europeias.
    # É aplicável a partir de 1 de Março de 1991. O presente regulamento é obrigatório
    em todos os seus elementos e directamente aplicável em todos os Estados-membros.
    # Feito em Bruxelas, em 27 de Fevereiro de 1991. Pelo Conselho # O Presidente
    # J.-C. JUNCKER (1) Parecer emitido em 22 de Fevereiro de 1991 (ainda não publicado
    no Jornal Oficial). DECISÃO Nº 1/91 DO CONSELHO DE MINISTROS ACP-CEE de 27 de
    Fevereiro de 1991 que prorroga a Decisão nº 2/90 do Conselho dos Ministros ACP-CEE
    relativa às medidas transitórias válidas a partir de 1 de Março de 1990 #O
    COMITÉ DOS EMBAIXADORES ACP-CEE, # Tendo em conta a Terceira Convenção ACP-CEE,
    assinada em Lomé em 8 de Dezembro de 1984 e, nomeadamente, o terceiro parágrafo
    do seu artigo 291º, # Tendo em conta a Decisão nº 1/90 do Conselho dos Ministros
    ACP-CEE, de 22 de Fevereiro de 1990, que estabelece a delegação de competência
    no Comité dos Embaixadores ACP-CEE no que diz respeito à adopção de medidas
    transitórias no termo da vigência da Terceira Convenção ACP-CEE, # Considerando
    que a Quarta Convenção ACP-CEE, assinada em Lomé em 15 de Dezembro de 1989,
    ainda não entrou em vigor; # Considerando que a aplicação da Decisão nº 2/90
    do Conselho ACP-CEE termina em 28 de Fevereiro de 1991; que, por conseguinte,
    a fim de evitar uma descontinuidade nas relações entre os Estados ACP e a Comunidade,
    convém prorrogar esta decisão, # DECIDE: Artigo 1º A Decisão nº 2/90 do Conselho
    dos Ministros ACP-CEE é prorrogada até à data de entrada em vigor da Quarta
    Convenção ACP-CEE mas, o mais tardar, até 30 de Junho de 1991. Artigo 2º A
    presente decisão entra em vigor em 1 de Março de 1991. Feito em Bruxelas, em
    27 de Fevereiro de 1991. Pelo Conselho dos Ministros ACP-CEE # Pelo Comité dos
    Embaixadores ACP-CEE # O Presidente # J. WEYLAND BM391R0539REGULAMENTO (CEE) Nº
    539/91 DA COMISSÃO de 5 de Março de 1991 relativo aos pedidos de certificados
    de exportação para os produtos do código NC 1101 00 00, que compreendem a fixação
    prévia da restituição #'
