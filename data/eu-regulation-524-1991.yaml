  script: Latn
  content: 'REGOLAMENTO (CEE) N. 524/91 DEL CONSIGLIO del 27 febbraio 1991 relativo
    all'' applicazione della decisione n. 1/91 del Consiglio dei ministri ACP-CEE
    che proroga la decisione n. 2/90 relativa alle misure transitorie valide a decorrere
    dal 1o marzo 1990 #IL CONSIGLIO DELLE COMUNITÀ EUROPEE, # visto il trattato che
    istituisce la Comunità economica europea, in particolare gli articoli 113 e 235,
    # vista la proposta della Commissione, # visto il parere del Parlamento europeo
    (1), # considerando che la terza convenzione ACP-CEE, firmata a Lomé l'' 8 dicembre
    1984, è scaduta il 28 febbraio 1990; # considerando che la quarta convenzione
    ACP-CEE, firmata a Lomé il 15 dicembre 1989, non è ancora entrata in vigore;
    # considerando che l'' applicazione della decisione n. 2/90 del Consiglio dei
    ministri ACP-CEE è limitata al 28 febbraio 1991; # considerando che la decisione
    n. 1/91 del Consiglio dei ministri ACP-CEE proroga l'' applicazione della decisione
    n. 2/90 fino all'' entrata in vigore della quarta convenzione ACP-CEE, ma al più
    tardi fino al 30 giugno 1991; # considerando che occorre prendere le misure necessarie
    all'' esecuzione della decisione n. 1/91, # HA ADOTTATO IL PRESENTE REGOLAMENTO:
    Articolo 1 # Fatte salve le disposizioni autonome più favorevoli che la Comunità
    adotterà per quanto riguarda il regime delle importazioni dei prodotti ACP, è
    applicabile nella Comunità dal 1o marzo 1991 fino all'' entrata in vigore della
    quarta convenzione ACP-CEE, ma al più tardi fino al 30 giugno 1991, la decisione
    n. 1/91 del Consiglio dei ministri ACP-CEE. # Il testo della decisione è accluso
    al presente regolamento. Articolo 2 # Il presente regolamento entra in vigore
    il giorno della pubblicazione nella Gazzetta ufficiale delle Comunità europee.
    # Esso è applicabile a decorrere dal 1o marzo 1991. Il presente regolamento è
    obbligatorio in tutti i suoi elementi e direttamente applicabile in ciascuno degli
    Stati membri. # Fatto a Bruxelles, addì 27 febbraio 1991. Per il Consiglio #
    Il Presidente # J.-C. JUNCKER (1) Parere reso il 22 febbraio 1991 (non ancora
    pubblicato nella Gazzetta ufficiale). DECISIONE N. 1/91 DEL CONSIGLIO DEI MINISTRI
    ACP-CEE del 27 febbraio 1991 che proroga la decisione n. 2/90 del Consiglio dei
    ministri ACP-CEE relativa alle misure transitorie valide a decorrere dal 1o marzo
    1990 #IL COMITATO DEGLI AMBASCIATORI ACP-CEE, # vista la terza convenzione ACP-CEE,
    firmata a Lomé l'' 8 dicembre 1984, in particolare l'' articolo 291, terzo comma,
    # vista la decisione n. 1/90 del Consiglio dei ministri ACP-CEE, del 22 febbraio
    1990, che delega al Comitato degli ambasciatori ACP-CEE le competenze per l''
    adozione di misure transitorie allo scadere della terza convenzione ACP-CEE, #
    considerando che la quarta convenzione ACP-CEE, firmata a Lomé il 15 dicembre
    1989, non è ancora entrata in vigore; # considerando che l'' applicazione della
    decisione n. 2/90 del Consiglio ACP-CEE è limitata al 28 febbraio 1991; che occorre
    pertanto prorogare detta decisione per evitare una discontinuità nelle relazioni
    tra gli Stati ACP e la Comunità, # DECIDE: Articolo 1 # La decisione n. 2/90
    del Consiglio dei ministri ACP-CEE è prorogata fino alla data di entrata in vigore
    della quarta convenzione ACP-CEE, ma al più tardi fino al 30 giugno 1991. Articolo
    2 # La presente decisione entra in vigore il 1o marzo 1991. Fatto a Bruxelles,
    addì 27 febbraio 1991. Per il Consiglio dei ministri ACP-CEE # Per il Comitato
    degli ambasciatori ACP-CEE # Il Presidente # J. WEYLAND BM391R0539REGOLAMENTO
    (CEE) N. 539/91 DELLA COMMISSIONE del 5 marzo 1991 relativo alle domande di titoli
    d'' esportazione comportanti fissazione anticipata della restituzione, per i prodotti
    di cui al codice NC 1101 00 00 #'
  type: main
