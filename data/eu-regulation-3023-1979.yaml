id: EURegulation30231979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3023/79 of 20 December 1979 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessles flying the flag of certain non-member countries in the 200 nautical-mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3023/79 du Conseil, du 20 décembre 1979, fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de certains pays tiers dans la zone de 200 milles située
    au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3023/79 des Rates vom 20. Dezember 1979 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände in
    der 200-Meilen-Zone vor der Küste des französischen Departements Guyana gegenüber
    Schiffen, die die Flagge von Drittländern führen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3023/79 af 20. december 1979 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    gældende for fartøjer, der fører visse tredjelandes flag, i 200 sømilezonen
    ud for Guyanas kyster
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3023/79 del Consiglio, del 20 dicembre 1979, che stabilisce
    talune misure per la conservazione e la gestione delle risorse ittiche da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia nautiche
    situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3023/79 van de Raad van 20 december 1979 tot vaststelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de visbestanden
    welke, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    van toepassing zijn in de zone van 200 zeemijl voor de kust van het Franse departement
    Guyana
  type: main
