id: EUDecision1978577
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 28 June 1978 authorizing Ireland not to apply Community
    treatment to certain outer garments and clothing accessories and women's, girls'
    and infants' (other than babies') woven and knitted or crocheted dresses, of wool,
    of cotton or of man-made textile fibres, falling within subheading ex 60.05 A
    II or 61.02 B (NIMEXE codes 60.05-41, 42, 43, 44; 61.02-48, 52, 53, 54) of the
    Common Customs Tariff, originating in India and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: '78/577/CEE: Décision de la Commission, du 28 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire certains vêtements de dessus et accessoires
    du vêtement, les robes tissées et robes de bonneterie, pour femmes, fillettes
    et jeunes enfants (autres que bébés), de laine, de coton ou de fibres textiles
    synthétiques ou artificielles, des sous- positions Ex 60.05 A II et Ex 61.02
    B du Tarif douanier commun (codes Nimexe : 60.05-41, 42, 43, 44 - 61.02-48, 52,
    53, 54), originaires de l''Inde et mis en libre pratique dans les autres États
    membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 28. Juni 1978, mit der Irland ermächtigt
    wird, aus Indien stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche bestimmte Oberkleidung und Bekleidungszubehör und Kleider aus Geweben
    und aus Gewirken, für Frauen, Mädchen und Kleinkinder (ausgenommen Säuglinge),
    aus Wolle, Baumwolle oder aus synthetischen oder künstlichen Spinnstoffen der
    Tarifnummern ex 60.05 A II und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern
    60.05-41; 42; 43; 44 - 61.02-48; 52; 53; 54) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 28. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage visse yderbeklædningsgenstande og tilbehør
    til beklædningsgenstande og vævede kjoler og kjoler af trikotage til kvinder,
    piger og småborn (undtagen spædbørn), af uld, bomuld eller kemofibre, som henhører
    under pos. ex 60.05 A II og ex 61.02 B (NIMEXE-kode 60.05-41, 42, 43, 44; 61.02-48,
    52, 53, 54) i den fælles toldtarif, har oprindelse i Indien og frit kan omsættes
    i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 28 giugno 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario taluni indumenti esterni e accessori
    di abbigliamento e gli abiti interi tessuti ed a maglia per donna, per ragazza
    e per bambini, diversi dai bambini piccoli (bébés), di lana, di cotone o di
    fibre tessili sintetiche o artificiali, delle sottovoci ex 60.05 A II ed ex 61.02
    B della tariffa doganale comune (codice Nimexe: 60.05-41; 42; 43; 44 - 61.02-48;
    52; 53; 54), originari dell''India e messi in libera pratica negli altri Stati
    membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 28 juni 1978 waarbij Ierland wordt gemachtigd
    sommige bovenkleding en kledingtoebehoren en japonnen voor dames, meisjes en kinderen
    (andere dan die voor baby's), geweven en van brei- of haakwerk, van wol, van katoen
    of van synthetische of kunstmatige vezels, van de posten ex 60.05 A II en ex 61.02
    B van het gemeenschappelijk douanetarief (NIMEXE-code 60.05-41, 42, 43, 44; 61.02-48,
    52, 53, 54), van oorsprong uit India en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
