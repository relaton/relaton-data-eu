  script: Latn
  content: Council Regulation (EC) No 963/2002 of 3 June 2002 laying down transitional
    provisions concerning anti-dumping and anti-subsidy measures adopted pursuant
    to Commission Decisions No 2277/96/ECSC and No 1889/98/ECSC as well as pending
    anti-dumping and anti-subsidy investigations, complaints and applications pursuant
    to those Decisions
  type: main
