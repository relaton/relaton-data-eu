  script: Latn
  content: '2010/199/CFSP: Council Decision 2010/199/CFSP of 22 March 2010 on the
    signing and conclusion of the Agreement between the European Union and Montenegro
    on the participation of Montenegro in the European Union military operation to
    contribute to the deterrence, prevention and repression of acts of piracy and
    armed robbery off the Somali coast (Operation Atalanta)'
  type: main
- language: fr
  script: Latn
