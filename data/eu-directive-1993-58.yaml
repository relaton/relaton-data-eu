title:
- language: en
  script: Latn
  content: Council Directive 93/58/EEC of 29 June 1993 amending Annex II to Directive
    76/895/EEC relating to the fixing of maximum levels for pesticide residues in
    and on fruit and vegetables and the Annex to Directive 90/642/EEC relating to
    the fixing of maximum levels for pesticide residues in and on certain products
    of plant origin, including fruit and vegetables, and providing for the establishment
    of a first list of maximum levels
  type: main
- language: fr
  script: Latn
  content: Directive 93/58/CEE du Conseil du 29 juin 1993 modifiant l'annexe II de
    la directive 76/895/CEE concernant la fixation de teneurs maximales pour les résidus
    de pesticides sur et dans les fruits et légumes ainsi que l'annexe de la directive
    90/642/CEE concernant la fixation de teneurs maximales pour les résidus de pesticides
    sur ou dans certains produits d'origine végétale, y compris les fruits et légumes
    et prévoyant l'établissement d'une première liste de teneurs maximales
  type: main
- language: de
  script: Latn
  content: Richtlinie 93/58/EWG des Rates vom 29. Juni 1993 zur Änderung von Anhang
    II der Richtlinie 76/895/EWG über die Festsetzung von Höchstgehalten an Rückständen
    von Schädlingsbekämpfungsmitteln auf und in Obst und Gemüse sowie zur Änderung
    des Anhangs der Richtlinie 90/642/EWG über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse, sowie zur Erstellung
    einer ersten Liste von Höchstgehalten
  type: main
- language: bg
  script: Cyrl
  content: Директива 93/58/ЕИО на Съвета от 29 юни 1993 година
    за изменение на приложение II към Директива
    76/895/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    плодове и зеленчуци и на приложението към Директива
    90/642/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    някои продукти от растителен произход, включително
    плодове и зеленчуци, и разпореждаща утвърждаването
    на първи списък на максимални количества
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 93/58/EHS ze dne 29. června 1993, kterou se mění příloha
    II směrnice 76/895/EHS o stanovení maximálních limitů reziduí pesticidů
    v ovoci a zelenině a na jejich povrchu a příloha směrnice 90/642/EHS o stanovení
    maximálních limitů reziduí pesticidů v některých produktech rostlinného
    původu, včetně ovoce a zeleniny, a na jejich povrchu a kterou se stanoví první
    seznam maximálních limitů
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 93/58/EØF af 29. juni 1993 om ændring af bilag II til
    direktiv 76/895/EØF om fastsættelse af maksimalgrænseværdier for pesticidrester
    på og i frugt og grønsager, om ændring af bilaget til direktiv 90/642/EØF
    om fastsættelse af maksimalgrænseværdier for pesticidrester på og i visse
    produkter af vegetabilsk oprindelse, herunder frugt og grønsager, samt om opstilling
    af en første fortegnelse over maksimalgrænseværdier
  type: main
- language: el
  script: Grek
  content: Οδηγία 93/58/ΕΟΚ του Συμβουλίου της 29ης Ιουνίου
    1993 για την τροποποίηση του παραρτήματος ΙΙ
    της οδηγίας 76/895/ΕΟΚ περί του καθορισμού της
    μεγίστης περιεκτικότητας σε κατάλοιπα των
    φυτοφαρμάκων επί και εντός των οπωροκηπευτικών
    και του παραρτήματος της οδηγίας 90/642/ΕΟΚ που
    αφορά τον καθορισμό των ανωτάτων περιεκτικοτήτων
    για τα κατάλοιπα φυτοφαρμάκων επάνω ή μέσα
    σε ορισμένα προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών και για τον καθορισμό
    ενός πρώτου καταλόγου μέγιστων ορίων
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 93/58/EMÜ, 29. juuni 1993, millega muudetakse direktiivi
    76/895/EMÜ (puu- ja köögiviljas sisalduvate ja nende pinnal esinevate pestitsiidide
    jääkide piirnormide kehtestamise kohta) II lisa ja direktiivi 90/642/EMÜ (teatavates
    taimset päritolu saadustes, sealhulgas puu- ja köögiviljas sisalduvate ja nende
    pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise kohta) lisa
    ning sätestatakse esimese piirnormide loetelu koostamine
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 93/58/ETY, annettu 29 päivänä kesäkuuta 1993,
    hedelmien ja vihannesten torjunta-ainejäämien enimmäismäärien vahvistamisesta
    annetun direktiivin 76/895/ETY liitteen II ja torjunta-ainejäämien enimmäismäärien
    vahvistamisesta tietyille kasvikunnasta peräisin oleville tuotteille, mukaan
    lukien hedelmät ja vihannekset, annetun direktiivin 90/642/ETY liitteen muuttamisesta
    sekä ensimmäisen enimmäismääriä koskevan luettelon laatimisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 93/58/EGK irányelve (1993. június 29.) a gyümölcsökben és
    zöldségekben, illetve azok felszínén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 76/895/EGK
    irányelv II. mellékletének módosításáról és az egyes növényi eredetű
    termékekben – többek között a gyümölcsökben és zöldségekben –, illetve
    azok felületén található peszticid-szermaradványok megengedett legmagasabb
    mértékének meghatározásáról szóló 90/642/EGK irányelv mellékletének
    módosításáról, valamint a legmagasabb mértékeket tartalmazó első lista
    létrehozásáról
  type: main
- language: it
  script: Latn
  content: Direttiva 93/58/CEE del Consiglio del 29 giugno 1993 recante modifica dell'allegato
    II della direttiva 76/895/CEE che fissa le quantità massime di residui di antiparassitari
    consentite sugli e negli ortofrutticoli, nonché dell'allegato della direttiva
    90/642/CEE che fissa le percentuali massime di residui di antiparassitari su e
    in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli, e che fissa
    un primo elenco di quantità massime
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 93/58/EEK (1993. gada 29. jūnijs), ar ko groza II pielikumu
    Direktīvai 76/895/EEK par pesticīdu atlieku maksimāli pieļaujamo daudzumu
    noteikšanu augļos un dārzeņos un uz tiem un pielikumu Direktīvai 90/642/EEK
    par pesticīdu atlieku maksimāli pieļaujamo daudzumu noteikšanu dažos augu
    izcelsmes produktos, to skaitā augļos un dārzeņos un uz tiem, un kura paredz
    maksimāli pieļaujamo daudzumu pirmā saraksta izstrādi
  type: main
- language: lt
  script: Latn
  content: 1993 m. birželio 29 d. Tarybos direktyva 93/58/EEB, iš dalies keičianti
    Tarybos direktyvos 76/895/EEB dėl didžiausių pesticidų likučių koncentracijų
    vaisiuose bei daržovėse ir ant jų nustatymo II priedą ir Direktyvos 90/642/EEB
    dėl didžiausių pesticidų likučių koncentracijų tam tikruose augalinės
    kilmės produktuose, įskaitant vaisius ir daržoves, ir ant jų nustatymo priedą
    ir numatanti sudaryti pirmąjį didžiausių koncentracijų sąrašą
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 93/58/KEE tad-29 ta’ Ġunju 1993 li temenda
    l-Anness II għad-Direttiva 76/895/KEE li tirrigwarda l-iffissar ta' livelli massimi
    ta’ residwi ta’pestiċidi fi jew fuq frott u ħxejjex u l-Anness II għad-Direttiva
    90/642/KEE li jirrigwarda l-iffissar ta’ livelli massimi għar-residwi ta’
    pestiċidi fi u fuq ċerti prodotti li joriġinaw minn pjanti, inkluż l-frott
    u l-ħxejjex, u li jipprovdu għall-istabbiliment ta’ lista ta’ livelli massimi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 93/58/EEG van de Raad van 29 juni 1993 houdende wijziging van
    bijlage II bij Richtlijn 76/895/EEG betreffende de vaststelling van de maximale
    hoeveelheden residuen van bestrijdingsmiddelen in en op groenten en fruit en van
    de bijlage bij Richtlijn 90/642/EEG tot vaststelling van maximumgehalten aan residuen
    van bestrijdingsmiddelen in en op bepaalde produkten van plantaardige oorsprong,
    met inbegrip van groenten en fruit, en houdende vaststelling van een eerste lijst
    van maximumgehalten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 93/58/EWG z dnia 29 czerwca 1993 r. zmieniająca załącznik
    II do dyrektywy 76/895/EWG odnoszącej się do ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w owocach i warzywach oraz na ich powierzchni
    oraz Załącznik do dyrektywy 90/642/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w niektórych produktach pochodzenia roślinnego,
    w tym owocach i warzywach, oraz na ich powierzchni oraz ustanawiająca pierwszy
    wykaz najwyższych dopuszczalnych poziomów
  type: main
- language: pt
  script: Latn
  content: Directiva 93/58/CEE do Conselho de 29 de Junho de 1993 que altera o anexo
    II da Directiva 76/895/CEE relativa à fixação de teores máximos de resíduos
    de pesticidas nas e sobre as frutas e produtos hortícolas e o anexo da Directiva
    90/642/CEE relativa à fixação de teores máximos de resíduos de pesticidas
    nos e sobre determinados produtos de origem vegetal, incluindo frutas e produtos
    hortícolas, e que estabelece uma primeira lista de teores máximos
  type: main
- language: ro
  script: Latn
  content: Directiva 93/58/CEE a Consiliului din 29 iunie 1993 de modificare a anexei
    II la Directiva 76/895/CEE privind stabilirea conținuturilor maxime de reziduuri
    de pesticide din și de pe fructe și legume, precum și a anexei la Directiva
    90/642/CEE de stabilire a conținuturilor maxime de reziduuri de pesticide din
    și de pe anumite produse de origine vegetală, inclusiv fructe și legume, precum
    și de stabilire a unei prime liste de conținuturi maxime
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 93/58/EHS z 29. júna 1993, ktorou sa mení a dopĺňa príloha
    II k smernici 76/895/EHS, týkajúca sa stanovovania maximálnych limitov rezíduí
    pesticídov v a na ovocí a zelenine a príloha k smernici 90/642/EHS, ktorá
    sa týka stanovovania maximálnych limitov rezíduí pesticídov v a na určitých
    produktoch rastlinného pôvodu - vrátane ovocia a zeleniny - a ktorá ukladá
    povinnosť vypracovať prvý zoznam maximálnych limitov
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 93/58/EGS z dne 29. junija 1993 o spremembi Priloge II
    k Direktivi 76/895/EGS o določitvi mejnih vrednosti ostankov pesticidov v in
    na sadju in zelenjavi ter Priloge k Direktivi 90/642/EGS o določitvi mejnih vrednosti
    ostankov pesticidov v in na nekaterih rastlinskih proizvodih, vključno s sadjem
    in zelenjavo, in o izdelavi prvega seznama mejnih vrednosti
  type: main
- language: es
  script: Latn
  content: Directiva 93/58/CEE del Consejo de 29 de junio de 1993 por la que se modifican
    el Anexo II de la Directiva 76/895/CEE relativa a la fijación de los contenidos
    máximos de residuos de plaguicidas en las frutas y hortalizas, el Anexo de la
    Directiva 90/642/CEE relativa a la fijación de los contenidos máximos de residuos
    de plaguicidas en determinados productos de origen vegetal, incluidas las frutas
    y hortalizas, y por la que se establece una primera lista de contenidos máximos
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 93/58/EEG av den 29 juni 1993 om ändring av bilaga 2
    till direktiv 76/895/EEG om fastställande av gränsvärden för bekämpningsmedelsrester
    i och på frukt och grönsaker och bilagan till direktiv 90/642/EEG om fastställande
    av gränsvärden för bekämpningsmedelsrester i och på produkter av vegetabiliskt
    ursprung inklusive frukt och grönsaker, samt om upprättandet av en första lista
    av gränsvärden
  type: main
