title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1061/77 of 18 May 1977 re-establishing the
    levying of customs duties on terry towelling and similar terry fabrics of cotton,
    falling within heading No 55.08, originating in Yugoslavia to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1061/77 de la Commission, du 18 mai 1977 , portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    coton bouclés du genre éponge, de la position tarifaire 55.08, originaires de
    la Yougoslavie bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1061/77 der Kommission vom 18. Mai 1977 zur Wiedereinführung
    des Zollsatzes für Schlingengewebe (Frottiergewebe) aus Baumwolle, der Tarifnummer
    55.08, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3022/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1061/77 af 18. maj 1977 om genindførelse
    af opkrævning af toldafgifter for håndklædefrotterstof og lignende frotterstof
    af bomuld, under position 55.08, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1061/77 della Commissione, del 18 maggio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di cotone ricci
    del tipo spugna, della voce doganale 55.08, originari della Iugoslavia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1061/77 van de Commissie van 18 mei 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op bad- of
    frotteerstof (lussendoek) van katoen, van post 55.08, van oorsprong uit Joegoslavië
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3022/76 van de Raad
  type: main
