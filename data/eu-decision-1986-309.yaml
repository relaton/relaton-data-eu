title:
- language: en
  script: Latn
  content: '86/309/EEC: Commission Decision of 11 June 1986 on the clearance of the
    accounts presented by the Kingdom of Denmark in respect of premium for homogenization
    of cereals declared as expenditure chargeable to the European Agricultural Guidance
    Guarantee Fund, Guarantee Section, for 1981 and amending Decision 85/451/EEC (Only
    the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '86/309/CEE: Décision de la Commission du 11 juin 1986 relative à l''apurement
    des comptes présentés par le Royaume de Danemark au titre des dépenses déclarées
    comme prime d''homogénéisation des céréales et financées par le Fonds européen
    d''orientation et de garantie agricole, section "garantie", pour l''exercice financier
    1981, et modifiant la décision 85/451/CEE (Le texte en langue danoise est le
    seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '86/309/EWG: Entscheidung der Kommission vom 11. Juni 1986 über den vom
    Königreich Dänemark vorgelegten Rechnungsabschluß für die vom Europäischen
    Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung Garantie, für
    das Haushaltsjahr 1981 bezüglich der als Prämie für die Homogenisierung von
    Getreide deklarierten Ausgaben und zur Berichtigung der Entscheidung 85/451/EWG
    (Nur der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '86/309/EØF: Kommissionens beslutning af 11. juni 1986 om afslutning af
    de af kongeriget Danmark forelagte regnskaber over de udgifter for regnskabsåret
    1981, der er anmeldt som præmie for homogenisering af korn, og som er finansieret
    gennem Den europæiske udviklings- og garantifond for Landbruget, garantisektionen,
    og om ændring af beslutning 85/451/EØF (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '86/309/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Ιουνίου 1986 σχετικά με την εκκαθάριση των λογαριασμών
    που υπέβαλε το Βασίλειο της Δανίας όσον αφορά
    τις δαπάνες που έχουν δηλωθεί σαν πριμοδότηση
    ομογενοποίησης των σιτηρών και έχουν χρηματοδοτηθεί
    από το Ευρωπαϊκό Γεωργικό Ταμείο Προσανατολισμού
    και Εγγυήσεων, τμήμα Εγγυήσεων, για το οικονομικό
    έτος 1981, και την τροποποίηση της απόφασης 85/451/ΕΟΚ
    (Το κείμενο στη δανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '86/309/CEE: Decisione della Commissione dell''11 giugno 1986 relativa
    alla liquidazione dei conti presentati dal Regno di Danimarca per le spese dell''esercizio
    1981 dichiarate come premio di omogeneizzazione dei cereali e finanziate dal Fondo
    europeo agricolo di orientamento e di garanzia, sezione "garanzia", e recanti
    modifica della decisione 85/451/CEE (Il testo in lingua danese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '86/309/EEG: Beschikking van de Commissie van 11 juni 1986 betreffende
