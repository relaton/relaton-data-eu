    1981 ingediende rekeningen voor de door het Europees Oriëntatie- en Garantiefonds
    voor de Landbouw, afdeling Garantie, voor de premie voor de homogenisering van
    granen gefinancierde uitgaven, en tot wijziging van Beschikking 85/451/EEG (Slechts
    de tekst in de Deense taal is authentiek)'
  type: main
