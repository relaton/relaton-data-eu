    der Anwendung der Bedingung für die Einfuhr bestimmter Zitrusfrüchte mit Ursprung
    in Spanien in die Gemeinschaft gemäß dem Abkommen zwischen der Gemeinschaft
    und Spanien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2925/78 af 12. december 1978 om suspension
