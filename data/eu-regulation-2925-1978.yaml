  content: Council Regulation (EEC) No 2925/78 of 12 December 1978 suspending application
    of the condition to which the importation into the Community of certain types
    of citrus fruit originating in Spain is subject by virtue of the Agreement between
    the Community and that country
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2925/78 du Conseil, du 12 décembre 1978, portant
