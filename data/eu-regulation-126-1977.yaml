  content: Council Regulation (EEC) No 126/77 of 18 January 1977 extending the period
    of validity of Regulations (EEC) No 1509/76 and (EEC) No 1522/76 on imports into
    the Community of prepared and preserved sardines originating in Tunisia and Morocco
    respectively
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 126/77 du Conseil, du 18 janvier 1977, prorogeant
    les règlements (CEE) n° 1509/76 et (CEE) n° 1522/76 relatifs à l'importation
    dans la Communauté de préparations et conserves de sardines originaires respectivement
    de Tunisie et du Maroc
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 126/77 des Rates vom 18. Januar 1977 zur Verlängerung
    der Verordnungen (EWG) Nr. 1509/76 und (EWG) Nr. 1522/76 über die Einfuhr von
    Sardinenzubereitungen oder -konserven mit Ursprung in Tunesien bzw. Marokko in
    die Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 126/77 af 18. januar 1977 om forlængelse
