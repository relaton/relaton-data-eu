    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3783/87 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1645/88 della Commissione del 13 giugno 1988 che ripristina
    la riscossione del dazi doganali applicabili alla biancheria da letto, esclusa
    quella a maglia della categoria di prodotti 20 (numero d' ordine 40.0200) e ai
    tessuti di fibre artificali in fiocco della categoria di prodotti n. 37 (numero
    d' ordine 40.0370), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1645/88 van de Commissie van 13 juni 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op beddelinnen,
    ander dan van brei- of haakwerk, van de categorie van produkten nr. 20 (volgnummer
    40.0200) en weefsels van kunstmatige stapelvezels van de categorie van produkten
    nr. 37 (volgnummer 40.0370), van oorsprong uit Thailand, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3783/87 van de
    Raad
  type: main
- language: pt
