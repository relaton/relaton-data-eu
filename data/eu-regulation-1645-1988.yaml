title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1645/88 of 13 June 1988 re-establishing
    the levying of customs duties on bed linen, other than knitted or crocheted, products
    of category 20 (order No 40.0200) and woven fabrics of artificial staple fibres,
    products of category 37 (order No 40.0370), originating in Thailand, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3783/87
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1645/88 de la Commission du 13 juin 1988 portant rétablissement
    de la perception des droits de douane applicables au linge de lit, autre qu' en
    bonneterie, de la catégorie 20 (numéro d' ordre 40.0200), aux tissus de fibres
    artificielles discontinues de la catégorie 37 (numéro d' ordre 40.0370), originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1645/88 der Kommission vom 13. Juni 1988 zur Wiedereinführung
    des Zollsatzes für Bettwäsche, andere als aus Gewirken, der Warenkategorie Nr.
    20 (lfd. Nr. 40.0200) sowie Gewebe aus künstlichen Spinnfasern der Warenkategorie
    Nr. 37 (lfd. Nr. 40.0370) mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1645/88 af 13. juni 1988 om genindførelse
    af opkrævning af toldafgifter for sengelinned, ikke af trikotage (kategori 20,
    løbenummer 40.0200) og vævet stof af korte regenererede fibre (kategori 37,
    løbenummer 40.0370), som har oprindelse i Thailand og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3783/87
  type: main
- language: el
  script: Grek
