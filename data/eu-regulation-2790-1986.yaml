    artificiali in fiocco della categoria di prodotti n. 37 (codice 40.0370), originari
    del Pakistan beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3600/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2790/86 van de Commissie van 9 september 1986 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige stapelvezels, van de categorie van produkten
    nr. 37 (codenummer 40.0370), van oorsprong uit Pakistan, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3600/85 van de
    Raad
  type: main
