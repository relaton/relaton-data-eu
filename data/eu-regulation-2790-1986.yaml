    εκ τεχνητών υφαντικών ινών, μη συνεχών, προϊόντα
    της κατηγορίας 37 (κωδικός αριθμός 40.0370), καταγωγής
    Πακιστάν, δικαιούχου των προβλεπόμενων στον
