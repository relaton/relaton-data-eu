title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2790/86 of 9 September 1986 re-establishing
    the levying of customs duties on woven fabrics of man-made fibres (discontinuous
    or waste), products of category 37 (code 40.0370), originating in Pakistan, to
    which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3600/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2790/86 de la Commission du 9 septembre 1986 portant
    rétablissement de la perception des droits de douane applicables aux tissus de
    fibres textiles artificielles discontinues de la catégorie n° 37 (code 40.0370),
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3600/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2790/86 der Kommission vom 9. September 1986 über
    die Wiedereinführung des Zollsatzes für Gewebe aus synthetischen oder künstlichen
    Spinnfasern der Warenkategorie Nr. 37 (Kennziffer 40.0370) mit Ursprung in Pakistan,
    dem die in der Verordnung (EWG) Nr. 3600/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2790/86 af 9. september 1986 om genindførelse
    af opkrævning af toldafgifter for vævet stof af korte kemofibre eller af affald
    af kemofibre, henhørende under varekategori nr. 37 (kode 40.0370), som har oprindelse
    i Pakistan og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3600/85
  type: main
- language: el
  script: Grek
