title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1536/82 of 8 June 1982 opening, allocating
    and providing for the administration of a Community tariff quota for certain fish
    of the species Sardinops sagax or ocellata, whole or headless, intended for processing,
    falling within subheading ex 03.01 B I q) of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1536/82 du Conseil, du 8 juin 1982, portant ouverture,
    répartition et mode de gestion d' un contingent tarifaire communautaire pour
    certains poissons des espèces "Sardinops sagax" ou "ocellata", entiers ou décapités,
    destinés à la transformation, de la sous-position ex 03.01 B I q) du tarif douanier
    commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1536/82 des Rates vom 8. Juni 1982 zur Eröffnung,
    Aufteilung und Verwaltung eines Gemeinschaftszollkontingents für bestimmte Heringsfische
    der Art Sardinops sagax oder ocellata (sogenannte ,,Pilchards' ' ), ganz oder
    ohne Kopf, für die Verarbeitung, der Tarifstelle ex 03.01 B I q) des Gemeinsamen
    Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1536/82 af 8. juni 1982 om åbning, fordeling
    og forvaltning af et fællesskabstoldkontingent for fisk af arterne Sardinops
    sagax eller ocellata, hele eller uden hoved, bestemt til forarbejdning, henhørende
    under pos. ex 03.01 B I q) i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1536/82 τού Συμβουλίου
    τής 8ης Ιουνίου 1982 περί ανοίγματος, διανομής
    καί τρόπου διαχειρίσεως μιάς κοινοτικής δασμολογικής
    ποσοστώσεως γιά οριμένους ιχθύς τών ειδών
    «Sardinops sagax» ή «ocellata», ολόκληρους ή αποκεφαλισμένους,
    προοριζόμενους γιά μεταποίηση, τής διακρίσεως
    ex 03. 01 B I π) τού Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1536/82 del Consiglio, dell' 8 giugno 1982, recante
