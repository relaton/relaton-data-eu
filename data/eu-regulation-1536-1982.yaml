    per taluni pesci delle specie Sardinops sagax o ocellata, interi o decapitati,
    destinati alla trasformazione, della sottovoce ex 03.01 B I q) della tariffa doganale
    comunea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1536/82 van de Raad van 8 juni 1982 betreffende de
    opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
