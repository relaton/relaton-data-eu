  content: Council Regulation (EC) No 2192/2003 of 8 December 2003 amending Regulation
    (EC) No 2341/2002 as regards the fishing opportunities and associated conditions
    for certain fish stocks and groups of fish stocks, applicable in Community waters
    and, for Community vessels, in waters where catch limitations are required
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2192/2003 du Conseil du 8 décembre 2003 modifiant
