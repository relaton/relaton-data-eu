title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1454/2000 of 3 July 2000 amending Regulation
    (EC) No 2316/1999 as regards the regional base areas applicable under the support
    system for producers of certain arable crops established by Council Regulation
    (EC) No 1251/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1454/2000 de la Commission du 3 juillet 2000 modifiant
    le règlement (CE) nº 2316/1999 en ce qui concerne les superficies de base régionales
    applicables dans le cadre du régime de soutien aux producteurs de certaines cultures
    arables institué par le règlement (CE) nº 1251/1999 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1454/2000 der Kommission vom 3. Juli 2000 zur Änderung
    der Verordnung (EG) Nr. 2316/1999 hinsichtlich der regionalen Grundflächen im
    Rahmen der Stützungsregelung für Erzeuger bestimmter landwirtschaftlicher Kulturpflanzen
    gemäß der Verordnung (EG) Nr. 1251/1999 des Rates
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1454/2000 ze dne 3. července 2000, kterým
    se mění nařízení (ES) č. 2316/1999, pokud jde o regionální základní
    plochy použitelné v rámci režimu podpor pro producenty některých plodin
    na orné půdě stanoveného nařízením Rady (ES) č. 1251/1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1454/2000 af 3. juli 2000 om ændring
    af forordning (EF) nr. 2316/1999 for så vidt angår de regionale basisarealer
    i forbindelse med den støtteordning for producenter af visse markafgrøder, der
    indføres ved Rådets forordning (EF) nr. 1251/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1454/2000 της Επιτροπής,
    της 3ης Ιουλίου 2000, για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 2316/1999 όσον αφορά τις περιφερειακές
    βασικές εκτάσεις που εφαρμόζονται στο πλαίσιο
    του καθεστώτος στήριξης των παραγωγών ορισμένων
    αροτραίων καλλιεργειών που θεσπίστηκε από
    τον κανονισμό (ΕΚ) αριθ. 1251/1999 του Συμβουλίου
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1454/2000, 3. juuli 2000, millega muudetakse
    määrust (EÜ) nr 2316/1999 seoses teatavate põllukultuuride tootjatele nõukogu
    määrusega (EÜ) nr 1251/1999 kehtestatud toetussüsteemi raames kohaldatavate
    piirkondlike baaskülvipindadega
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1454/2000, annettu 3 päivänä heinäkuuta 2000,
    asetuksen (EY) N:o 2316/1999 muuttamisesta alueellisten perusalojen osalta, joita
    sovelletaan neuvoston asetuksella (EY) N:o 1251/1999 Käyttöön otetun tiettyjen
    peltokasvien viljelijöitä koskevan tukijärjestelmän puitteissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1454/2000/EK rendelete (2000. július 3.) az 1251/1999/EK
    tanácsi rendelettel létrehozott egyes szántóföldi növények termelőire
    vonatkozó támogatási rendszer alapján alkalmazandó regionális bázisterületek
    tekintetében a 2316/1999/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1454/2000 della Commissione, del 3 luglio 2000, che
    modifica il regolamento (CE) n. 2316/1999 per quanto riguarda le superfici di
    base regionali applicabili nell'ambito del regime di sostegno a favore dei coltivatori
    di taluni seminativi istituito dal regolamento (CE) n. 1251/1999 del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1454/2000 (2000. gada 3. jūlijs), ar ko groza
    Regulu (EK) Nr. 2316/1999 attiecībā uz reģionālajām pamatplatībām, ko piemēro
    saskaņā ar atbalsta sistēmu noteiktu laukaugu audzētājiem, kura izveidota
    ar Padomes Regulu (EK) Nr. 1251/1999
  type: main
- language: lt
  script: Latn
  content: 2000 m. liepos 3 d. Komisijos reglamentas (EB) Nr. 1454/2000, iš dalies
    keičiantis Reglamentą (EB) Nr. 2316/1999 dėl regioninių bazinių plotų, taikytinų
    pagal tam tikrų lauko kultūrų augintojų paramos sistemą, nustatytą Tarybos
    reglamentu (EB) Nr. 1251/1999
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament Tal-kummissjoni (KE) Nru 1454/2000 tat-3 ta’ Lulju 2000
    li jemenda r-Regolament (KE) Nru 2316/1999 dwar iż-żoni bażi reġjonali applikabbli
    taħt is-sistema ta’ għajnuna għall-produtturi ta’ ċerti uċuħ tar-raba
    maħrut stabbiliti mir-Regolament tal-Kunsill
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1454/2000 van de Commissie van 3 juli 2000 tot wijziging
    van Verordening (EG) nr. 2316/1999 wat betreft de regionale basisarealen die van
    toepassing zijn in het kader van de steunregeling voor producenten van bepaalde
    akkerbouwgewassen die is ingesteld bij Verordening (EG) nr. 1251/1999 van de Raad
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1454/2000 z dnia 3 lipca 2000 r. zmieniające
    rozporządzenie (WE) nr 2316/1999 w odniesieniu do regionalnych obszarów bazowych
    objętych systemem wsparcia dla producentów niektórych roślin uprawnych ustanowionym
    rozporządzeniem Rady (WE) nr 1251/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 1454/2000 da Comissão, de 3 de Julho de 2000, que
    altera o Regulamento (CE) n.o 2316/1999 no que respeita às superfícies de base
    regionais aplicáveis no âmbito do sistema de apoio aos produtores de determinadas
    culturas arvenses instituído pelo Regulamento (CE) n.o 1251/1999 do Conselho
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1454/2000 z 3. júla 2000, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2316/1999 týkajúce sa regionálnych základných
    plôch podľa systému podpory pre pestovateľov niektorých poľnohospodárskych
    plodín zavedený nariadením Rady (ES) č. 1251/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1454/2000 z dne 3. julija 2000 ki spreminja Uredbo
    (ES) št. 2316/1999 glede osnovnih regionalnih površin, uporabljenih v sistemu
    podpore za pridelovalce določenih poljščin, uvedenem z Uredbo Sveta (ES) št.
    1251/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1454/2000 de la Comisión, de 3 de julio de 2000, por
    el que se modifica el Reglamento (CE) nº 2316/1999 en lo que respecta a las superficies
    básicas regionales aplicables en el contexto del régimen de apoyo a los productores
    de determinados cultivos herbáceos creado por el Reglamento (CE) nº 1251/1999
    del Consejo
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1454/2000 av den 3 juli 2000 om ändring
    av förordning (EG) nr 2316/1999 när det gäller de regionala basarealer som
    skall tillämpas inom ramen för stödsystemet för producenter av vissa jordbruksgrödor
    enligt rådets förordning (EG) 1251/1999
