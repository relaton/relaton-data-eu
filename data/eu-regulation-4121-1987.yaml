title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 4121/87 of 21 December 1987 suspending for
    the 1988 fishing year the duties applicable to fresh fishery products originating
    in Morocco and coming from joint fisheries ventures set up between natural or
    legal persons from Portugal and Morocco, on the direct landing of such products
    in Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4121/87 de la Commission du 21 décembre 1987 portant
    pour la campagne 1988 suspension des droits applicables aux produits de la pêche
    fraîche originaires du Maroc et provenant des entreprises communes de pêche
    constituées entre personnes physiques ou morales du Portugal et du Maroc, à
    l' occasion de leur débarquement direct au Portugal
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4121/87 der Kommission vom 21. Dezember 1987 zur Aussetzung
    der bei der Direktanlandung in Portugal anzuwendenden Zölle auf frische Fischereierzeugnisse
    mit Ursprung in Marokko von gemeinsamen Fischereiunternehmen zwischen natürlichen
    oder juristischen Personen Portugals und Marokkos für das Wirtschaftsjahr 1988
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4121/87 af 21. december 1987 om suspension
    for fangstsæsonen 1988 af tolden på ferske fiskerivarer med oprindelse i Marokko
    og hidrørende fra fællesforetagender, der er oprettet mellem fysiske eller juridiske
    personer i Portugal og i Marokko, i anledning af sådanne varers direkte landing
    i Portugal
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4121/87 της Επιτροπής
    της 21ης Δεκεμβρίου 1987 για την αναστολή, για
    την περίοδο εμπορίας 1988, των δασμών που εφαρμόζονται
    σε νωπά προϊόντα αλιείας καταγωγής Μαρόκου
    τα οποία προέρχονται από κοινές αλιευτικές
    επιχειρήσεις που έχουν συσταθεί μεταξύ φυσικών
    ή νομικών προσώπων της Πορτογαλίας και του
    Μαρόκου, κατά την απευθείας εκφόρτωση αυτών
    των προϊόντων στην Πορτογαλία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4121/87 della Commissione del 21 dicembre 1987 che
    sospende per la campagna 1988 i dazi applicabili ai prodotti freschi della pesca
    originari del Marocco e provenienti da imprese comuni di pesca costituite tra
    persone fisiche o giuridiche del Portogallo e del Marocco, all' atto del loro
    sbarco diretto in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4121/87 van de Commissie van 21 december 1987 tot
    schorsing voor het visseizoen 1988 van de rechten voor verse visserijprodukten
    van oorsprong uit Marokko en afkomstig van gemeenschappelijke visserijondernemingen
    van natuurlijke of rechtspersonen uit Portugal en uit Marokko, bij rechtstreekse
    aanvoer in Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4121/87 da Comissão de 21 de Dezembro de 1987 que
    suspende para a campanha de 1988 os direitos aplicáveis aos produtos da pesca
    fresca originários de Marrocos e provenientes das empresas comuns de pesca constituídas
    entre pessoas singulares ou colectivas de Portugal e de Marrocos, aquando do seu
    desembarque directo em Portugal
  type: main
- language: es
  script: Latn
