title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2459/2001 of 14 December 2001 amending Regulation
    (EC) No 28/97 and assessing requirements for the supply of certain vegetable oils
    (other than olive oil) for the processing industry in the French departments
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2459/2001 de la Commission du 14 décembre 2001 modifiant
    le règlement (CE) n° 28/97 et établissant le bilan prévisionnel d'approvisionnement
    en certaines huiles végétales (excepté l'huile d'olive) destinées à l'industrie
    de transformation pour les départements français d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2459/2001 der Kommission vom 14. Dezember 2001 zur
    Änderung der Verordnung (EG) Nr. 28/97 und zur Erstellung der vorläufigen Versorgungsbilanz
    für das für die verarbeitende Industrie in den französischen überseeischen
    Departements bestimmte Pflanzenöl außer Olivenöl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2459/2001 af 14. december 2001 om ændring
    af forordning (EF) nr. 28/97 og om fastsættelse af den foreløbige forsyningsopgørelse
    for visse vegetabilske olier (undtagen olivenolie) til forarbejdningsindustrien
    for de franske oversøiske departementer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2459/2001 της Επιτροπής,
    της 14ης Δεκεμβρίου 2001, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 28/97 και την κατάρτιση
    προβλέψεων εφοδιασμού με ορισμένα φυτικά έλαια
    (εκτός του ελαιολάδου) που προορίζονται για
    τη βιομηχανία μεταποίησης στα γαλλικά υπερπόντια
    διαμερίσματα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2459/2001, annettu 14 päivänä joulukuuta 2001,
    asetuksen (EY) N:o 28/97 muuttamisesta ja Ranskan merentakaisten departementtien
    jalostusteollisuuteen tarkoitettujen tiettyjen kasviöljyjen (oliiviöljyä lukuun
    ottamatta) arvioidun hankintataseen vahvistamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2459/2001 della Commissione, del 14 dicembre 2001,
    recante modifica del regolamento (CE) n. 28/97 e fissazione del bilancio previsionale
    di approvvigionamento dei dipartimenti francesi d'oltremare in taluni oli vegetali
    (escluso l'olio d'oliva) destinati all'industria di trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2459/2001 van de Commissie van 14 december 2001 tot
    wĳziging van Verordening (EG) nr. 28/97 en tot vaststelling van de balans voor
    de voorziening van de Franse overzeese departementen met bepaalde plantaardige
    oliën (met uitzondering van olĳfolie) voor de verwerkende industrie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2459/2001 da Comissão, de 14 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 28/97 e estabelece a estimativa das necessidades
    de abastecimento dos departamentos franceses ultramarinos em óleos vegetais (com
    excepção do azeite), destinados à indústria de transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2459/2001 de la Comisión, de 14 de diciembre de 2001,
    por el que se modifica el Reglamento (CE) n° 28/97 y se establece el plan de
    previsiones de abastecimiento a los departamentos franceses de Ultramar de determinados
    aceites vegetales (excepto el de oliva) destinados a la industria de transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2459/2001 av den 14 december 2001 om
    ändring av förordning (EG) nr 28/97 och om upprättande av en prognostiserad
    försörjningsbalans för vissa vegetabiliska oljor (utom olivolja) avsedda för
    bearbetningsindustrin i de utomeuropeiska franska departementen
  type: main
