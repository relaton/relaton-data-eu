  script: Latn
  content: Council Regulation (EC) No 920/2005 of 13 June 2005 amending Regulation
    No 1 of 15 April 1958 determining the language to be used by the European Economic
    Community and Regulation No 1 of 15 April 1958 determining the language to be
    used by the European Atomic Energy Community and introducing temporary derogation
    measures from those Regulations
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 920/2005 du Conseil du 13 juin 2005 modifiant le règlement
