    économique européenne et le règlement n° 1 du 15 avril 1958 portant fixation
    du régime linguistique de la Communauté européenne de l’énergie atomique
    et introduisant des mesures dérogatoires temporaires à ces règlements
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 920/2005 des Rates vom 13. Juni 2005 zur Änderung
