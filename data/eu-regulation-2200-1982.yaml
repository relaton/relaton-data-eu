title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2200/82 of 6 August 1982 re-establishing
    the levying of customs duties on aniline and its salts, falling within subheading
    29.22 D ex I and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 applyr
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2200/82 de la Commission, du 6 août 1982, portant
    rétablissement de la perception des droits de douane applicables à l' aniline
    et ses sels, de la sous-position 29.22 D ex I, du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2200/82 der Kommission vom 6. August 1982 zur Wiedereinführung
    der Erhebung der Zölle für Anilin und seine Salze der Tarifstelle 29.22 D ex
    I, mit Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3601/81 des
    Rates vorgesehenen Zollpräferenzen gewährt werdenn
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2200/82 af 6. august 1982 om genindførelse
    af opkrævning af told for anilin samt salte deraf, henhørende under pos. 29.22
    D ex I og med oprindelse i Rumænien, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81a
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2200/82 τής Επιτροπής
    τής 6ης Αυγούστου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τήν ανιλίνη καί τά
    άλατα αυτής τής διακρίσεως 29. 22 Δ ex I τού Κοινού
    Δασμολογίου, καταγωγής Ρουμανίας, δικαιούχου
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3601/81 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2200/82 della Commissione, del 6 agosto 1982, che
    ripristina la riscossione dei dazi doganali applicabili all' anilina e suoi sali,
    della sottovoce 29.22 D ex I della tariffa doganale comune, originari della Romania
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2200/82 van de Commissie van 6 augustus 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op aniline en
    zouten daarvan, van tariefpostonderverdeling 29.22 D ex I, van oorsprong uit Roemenië,
    waarvor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties
    zijn verleendg
  type: main
