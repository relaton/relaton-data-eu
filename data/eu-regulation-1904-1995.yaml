title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1904/95 of 1 August 1995 authorizing the
    payment in advance to producers in certain regions of compensatory payments for
    the 1995/96 marketing year for cereals, protein crops and linseed as well as compensation
    for compulsory set-aside
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1904/95 de la Commission, du 1er août 1995, autorisant
    le paiement à l'avance, aux producteurs de certaines régions, de paiements compensatoires,
    au titre de la campagne de commercialisation 1995/1996, pour les céréales, les
    protéagineux et les graines de lin oléagineux ainsi que de la compensation pour
    le gel des terres obligatoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1904/95 der Kommission vom 1. August 1995 zur Genehmigung
    der Zahlung von Vorschüssen auf den Ausgleich, der den Erzeugern in mehreren
    Gebieten im Wirtschaftsjahr 1995/96 für Getreide, Ölsaaten und Öllein sowie
    für die vorgeschriebene Flächenstillegung zu gewähren ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1904/95 af 1. august 1995 om bemyndigelse
    til at forudbetale udligningsgodtgørelser for produktionsåret 1995/96 til producenter
    i bestemte områder for korn, proteinafgrøder og oliehørfrø samt godtgørelsen
    for obligatorisk jordudtagning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1904/95 της Επιτροπής
    της 1ης Αυγούστου 1995 που επιτρέπει την προκαταβολή,
    σε παραγωγούς ορισμένων περιφερειών, αντισταθμιστικών
    πληρωμών, βάσει της περιόδου 1995/96, για τα σιτηρά,
    τα πρωτεϊνούχα προϊόντα και τους λιναρόσπορους
    καθώς και της αντιστάθμισης για την υποχρέωση
    της προσωρινής παύσης καλλιέργειας γαιών
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1904/95, annettu 1 päivänä elokuuta 1995,
    luvan antamisesta viljojen, valkuaiskasvien ja öljypellavan siementen tasausmaksun
    sekä pakollisesta pellonpoistosta maksettavan korvauksen maksamiseen ennakolta
    tiettyjen alueiden viljelijöille markkinointivuoden 1995/96 osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1904/95 della Commissione, del 1ºagosto 1995, che
    autorizza il pagamento anticipato, ai produttori di talune regioni, dei pagamenti
    compensativi a titolo della campagna di commercializzazione 1995/1996 per i cereali,
    la piante proteiche e i semi di lino, nonché la compensazione per il ritiro obbligatorio
    dei terreni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1904/95 van de Commissie van 1 augustus 1995 houdende
    machtiging om voor het verkoopseizoen 1995/1996 aan producenten in bepaalde regio's
    compensatiebedragen voor granen, eiwithoudende gewassen en lijnzaad en de compensatie
    voor de verplichte braaklegging vervroegd uit te betalen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1904/95 da Comissão, de 1 de Agosto de 1995, que
