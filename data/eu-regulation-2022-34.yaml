title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/34 of 22 December 2021 amending
    Annexes III, VIII, IX and XI to Implementing Regulation (EU) 2021/405 as regards
    the lists of third countries or regions thereof authorised for the entry into
    the Union of certain wild game birds intended for human consumption, of consignments
    of certain bivalve molluscs, echinoderms, tunicates and marine gastropods, of
    certain fishery products, and of frogs’ legs and snails, and repealing Decision
    2007/82/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/34 de la Commission du 22 décembre
    2021 modifiant les annexes III, VIII, IX et XI du règlement d’exécution (UE)
    2021/405 en ce qui concerne les listes des pays tiers ou régions de pays tiers
    en provenance desquels l’entrée dans l’Union de certains gibiers à plumes
    sauvages destinés à la consommation humaine, d’envois de certains mollusques
    bivalves, échinodermes, tuniciers et gastéropodes marins, de certains produits
    de la pêche, ainsi que de cuisses de grenouilles et d’escargots est autorisée,
    et abrogeant la décision 2007/82/CE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/34 der Kommission vom 22. Dezember 2021
    zur Änderung der Anhänge III, VIII, IX und XI der Durchführungsverordnung (EU)
    2021/405 hinsichtlich der Listen der Drittländer oder Drittlandsgebiete, aus
    denen der Eingang von bestimmtem Federwild für den menschlichen Verzehr, von
    Sendungen mit bestimmten Muscheln, Stachelhäutern, Manteltieren und Meeresschnecken,
    von bestimmten Fischereierzeugnissen und von Sendungen mit Froschschenkeln und
    Schnecken in die Union zulässig ist, sowie zur Aufhebung der Entscheidung 2007/82/EG
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/34 на Комисията
    от 22 декември 2021 година за изменение на приложения
    III, VIII, IX и XI към Регламент за изпълнение (ЕС)
    2021/405 по отношение на списъците на трети държави
    или региони от тях, от които е разрешено въвеждането
    в Съюза на определени видове пернат дивеч,
    предназначен за консумация от човека, на пратки
    с определени видове двучерупчести мекотели,
    бодлокожи, мантийни и морски коремоноги, на
    определени рибни продукти и на пратки с жабешки
    бутчета и с охлюви, и за отмяна на Решение 2007/82/ЕО
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/34 ze dne 22. prosince 2021,
    kterým se mění přílohy III, VIII, IX a XI prováděcího nařízení (EU)
    2021/405, pokud jde o seznamy třetích zemí nebo regionů třetích zemí, z
    nichž je povolen vstup určité volně žijící pernaté zvěře určené k
    lidské spotřebě, zásilek určitých mlžů, ostnokožců, pláštěnců a
    mořských plžů, určitých produktů rybolovu a žabích stehýnek a hlemýžďů
    do Unie, a zrušuje rozhodnutí 2007/82/ES
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/34 af 22. december 2021
    om ændring af bilag III, VIII, IX og XI til gennemførelsesforordning (EU) 2021/405
    for så vidt angår listerne over tredjelande eller regioner heri, hvorfra det
    er tilladt at indføre visse typer vildtlevende fjervildt til konsum, af sendinger
    af visse toskallede bløddyr, pighuder, sækdyr og havsnegle og af visse fiskevarer
    og af frølår og snegle til Unionen og om ophævelse af beslutning 2007/82/EF
  type: main
- language: el
  script: Grek
