    aplicare (UE) 2021/405 în ceea ce privește listele cu țările terțe sau regiunile
    din acestea autorizate pentru introducerea în Uniune a anumitor păsări din
    categoria vânatului sălbatic cu pene destinate consumului uman, a transporturilor
    de anumite moluște bivalve, echinoderme, tunicate și gasteropode marine, de
    anumite produse pescărești, precum și de pulpe de pui de baltă și de melci,
    și de abrogare a Deciziei 2007/82/CE
  type: main
