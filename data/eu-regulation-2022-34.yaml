    trećih zemalja ili njihovih regija iz kojih je odobren ulazak u Uniju određene
    pernate divljači namijenjene prehrani ljudi, pošiljaka određenih školjkaša,
    bodljikaša, plaštenjaka i morskih puževa, određenih proizvoda ribarstva i
    žabljih krakova i puževa te o stavljanju izvan snage Odluke 2007/82/EZ
  type: main
