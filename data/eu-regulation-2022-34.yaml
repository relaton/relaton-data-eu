  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/34 della Commissione del 22 dicembre
    2021 che modifica gli allegati III, VIII, IX e XI del regolamento di esecuzione
    (UE) 2021/405 per quanto riguarda gli elenchi dei paesi terzi o loro regioni da
    cui è autorizzato l'ingresso nell'Unione di determinata selvaggina di penna destinata
    al consumo umano, di partite di determinati molluschi bivalvi, echinodermi, tunicati
    e gasteropodi marini, di determinati prodotti della pesca e di cosce di rana e
    lumache, e che abroga la decisione 2007/82/CE
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/34 (2021. gada 22. decembris),
