    attiecībā uz sarakstiem ar trešām valstīm vai to reģioniem, no kuriem atļauts
    Savienībā ievest noteiktus lietošanai pārtikā paredzētus savvaļas medījamos
    putnus, noteiktu gliemeņu, adatādaiņu, tunikātu un jūras gliemežu, noteiktu
