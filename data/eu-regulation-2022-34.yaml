    držav ali njihovih regij, iz katerih je dovoljen vstop nekatere pernate divjadi,
    namenjene za prehrano ljudi, pošiljk nekaterih školjk, iglokožcev, plaščarjev
    in morskih polžev, nekaterih ribiških proizvodov ter žabjih krakov in polžev
