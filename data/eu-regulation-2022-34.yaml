    riikide või nende piirkondade loeteludega, kust on lubatud liitu tuua teatavaid
    inimtoiduks ettenähtud looduslikke uluklinde, teatavate karpide, okasnahksete,
    mantelloomade ja meritigude saadetisi, teatavate kalandustoodete saadetisi ning
    konnakoibade ja tigude saadetisi, ning tunnistatakse kehtetuks otsus 2007/82/EÜ
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/34, annettu 22 päivänä
    joulukuuta 2021, täytäntöönpanoasetuksen (EU) 2021/405 liitteiden III, VIII,
    IX ja XI muuttamisesta siltä osin kuin on kyse niiden kolmansien maiden tai kolmansien
    maiden alueiden luetteloista, joista tiettyjen ihmisravinnoksi tarkoitettujen
    luonnonvaraisten riistalintujen, tiettyjen simpukoiden, piikkinahkaisten, vaippaeläinten
    ja merikotiloiden, tiettyjen kalastustuotteiden sekä sammakonreisien ja etanoiden
    lähetysten tulo unioniin on sallittua, ja päätöksen 2007/82/EY kumoamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/34 ón gCoimisiún an 22 Nollaig
