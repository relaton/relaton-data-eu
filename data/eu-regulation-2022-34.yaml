    (EU) 2021/405 vad gäller förteckningarna över tredjeländer eller regioner
    i tredjeländer från vilka visst frilevande fjädervilt avsett att användas
    som livsmedel, sändningar av vissa musslor, tagghudingar, manteldjur och marina
    snäckor, vissa fiskeriprodukter samt grodlår och snäckor får föras in till
    unionen, och om upphävande av beslut 2007/82/EG
