    2021/405 no que se refere às listas de países terceiros ou regiões de países
    terceiros autorizados para a entrada na União de determinadas aves de caça selvagens
    destinadas ao consumo humano, de remessas de determinados moluscos bivalves, equinodermes,
    tunicados e gastrópodes marinhos, de determinados produtos da pesca e de coxas
    de rã e caracóis, e que revoga a Decisão 2007/82/CE
  type: main
