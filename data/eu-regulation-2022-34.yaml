    Cur Chun Feidhme (AE) 2021/405 a mhéid a bhaineann leis na liostaí de thríú
    tíortha nó réigiúin sna tíortha sin a údaraítear i dtaobh éin ghéim fhiáin
    áirithe a bheartaítear lena gcaitheamh ag an duine, coinsíneachtaí de mhoilisc
    dhébhlaoscacha áirithe, eicínideirmigh, túinicigh agus gastrapóid mhuirí,
    táirgí iascaigh áirithe, agus cos froganna agus seilidí a theacht isteach
    san Aontas, agus lena n-aisghairtear Cinneadh 2007/82/CE
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/34 оd 22. prosinca 2021. o izmjeni
