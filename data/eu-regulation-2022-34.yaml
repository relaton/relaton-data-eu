    sa menia prílohy III, VIII, IX a XI k vykonávaciemu nariadeniu (EÚ) 2021/405,
    pokiaľ ide o zoznamy tretích krajín alebo ich regiónov, z ktorých sa povoľuje
    vstup určitej voľne žijúcej pernatej zveri určenej na ľudskú spotrebu,
    ako aj zásielok určitých lastúrnikov, ostnatokožcov, plášťovcov a morských
    ulitníkov, určitých produktov rybolovu, žabích stehienok a slimákov do Únie,
    a ktorým sa zrušuje rozhodnutie 2007/82/ES
  type: main
