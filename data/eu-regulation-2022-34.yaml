    továbbá a bizonyos halászati termékeket, valamint a békacombot és csigát
    tartalmazó szállítmányok Unióba történő beléptetése tekintetében engedélyezett
    harmadik országok vagy harmadik országbeli régiók jegyzékei tekintetében
