    de 2021 por el que se modifican los anexos III, VIII, IX y XI del Reglamento de
    Ejecución (UE) 2021/405 en lo que respecta a las listas de terceros países o
    regiones de los mismos autorizados a introducir en la Unión determinadas aves
    de caza silvestre destinadas al consumo humano, partidas de moluscos bivalvos,
    equinodermos, tunicados y gasterópodos marinos, determinados productos de la
    pesca, así como ancas de rana y caracoles, y por el que se deroga la Decisión
    2007/82/CE
  type: main
