id: EURegulation20211958
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1958 of 23 June 2021 supplementing
    Regulation (EU) 2019/2144 of the European Parliament and of the Council by laying
    down detailed rules concerning the specific test procedures and technical requirements
    for the type-approval of motor vehicles with regard to their intelligent speed
    assistance systems and for the type-approval of those systems as separate technical
    units and amending Annex II to that Regulation
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1958 de la Commission du 23 juin 2021 complétant
    le règlement (UE) 2019/2144 du Parlement européen et du Conseil en établissant
    des règles détaillées relatives aux procédures d’essai et aux prescriptions
    techniques spécifiques pour la réception par type des véhicules à moteur en
    ce qui concerne leurs systèmes d’adaptation intelligente de la vitesse et pour
    la réception par type de ces systèmes en tant qu’entités techniques distinctes
    et modifiant l’annexe II dudit règlement
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1958 der Kommission vom 23. Juni 2021 zur
    Ergänzung der Verordnung (EU) 2019/2144 des Europäischen Parlaments und des
    Rates durch Festlegung detaillierter Vorschriften für die spezifischen Prüfverfahren
    und technischen Anforderungen für die Typgenehmigung von Kraftfahrzeugen hinsichtlich
    ihrer intelligenten Geschwindigkeitsassistenten und für die Typgenehmigung von
    intelligenten Geschwindigkeitsassistenten als selbstständige technische Einheiten
    sowie zur Änderung von Anhang II der genannten Verordnung
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1958 на Комисията
    от 23 юни 2021 година за допълнение на Регламент
    (ЕС) 2019/2144 на Европейския парламент и на Съвета
    чрез определяне на подробни правила относно
    специфичните процедури за изпитване и техническите
    изисквания за одобряване на типа на моторни
    превозни средства по отношение на техните
    системи за интелигентно регулиране на скоростта
    и за одобряването на тези системи като отделни
    технически възли и за изменение на приложение
    II към посочения регламент
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1958 ze dne 23. června
    2021, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2019/2144
    stanovením podrobných pravidel týkajících se zvláštních zkušebních postupů
    a technických požadavků pro schvalování typu motorových vozidel z hlediska
    jejich systémů inteligentní regulace rychlosti a pro schvalování typu těchto
    systémů jako samostatných technických celků a kterým se mění příloha
    II uvedeného nařízení
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1958 af 23. juni 2021 til
    supplering af Europa-Parlamentets og Rådets forordning (EU) 2019/2144 med nærmere
    regler vedrørende de specifikke prøvningsprocedurer og tekniske krav til typegodkendelse
    af motorkøretøjer for så vidt angår intelligente farttilpasningssystemer samt
    til typegodkendelse af sådanne systemer som separate tekniske enheder og om ændring
    af bilag II til nævnte forordning
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/1958
