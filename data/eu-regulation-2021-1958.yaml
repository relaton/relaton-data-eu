  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/1958, 23. juuni 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu määrust (EL) 2019/2144 üksikasjalike
    eeskirjadega mootorsõidukite tüübikinnituse konkreetsete katsemenetluste ja
    tehniliste nõuete kohta seoses arukate kiirusekontrollisüsteemidega ja nende
    süsteemide kui eraldi seadmestike tüübikinnitusega ning muudetakse kõnealuse
    määruse II lisa
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/1958, annettu 23 päivänä kesäkuuta
    2021, Euroopan parlamentin ja neuvoston asetuksen (EU) 2019/2144 täydentämisestä
    vahvistamalla tyyppihyväksyttäessä moottoriajoneuvoja älykkäiden nopeusavustinjärjestelmien
    osalta ja tyyppihyväksyttäessä näitä järjestelmiä erillisinä teknisinä
    yksiköinä sovellettavia erityisiä testausmenettelyjä ja teknisiä vaatimuksia
    koskevat yksityiskohtaiset säännöt sekä kyseisen asetuksen liitteen II muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/1958 ón gCoimisiún an 23 Meitheamh 2021
    lena bhforlíontar Rialachán (AE) 2019/2144 ó Pharlaimint na hEorpa agus ón
    gComhairle trí rialacha mionsonraithe a leagan síos maidir leis na nósanna
    imeachta sonracha tástála agus na ceanglais shonracha theicniúla i ndáil le
    cineálcheadú mótarfheithiclí i dtaca lena gcórais chliste um chúnamh luais
    agus i ndáil le cineálcheadú na gcóras sin mar aonaid theicniúla ar leithligh
    agus lena leasaítear Iarscríbhinn II a ghabhann leis an Rialachán sin
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1958 оd 23. lipnja 2021. o dopuni
    Uredbe (EU) 2019/2144 Europskog parlamenta i Vijeća utvrđivanjem detaljnih pravila
    o posebnim ispitnim postupcima i tehničkim zahtjevima za homologaciju tipa motornih
    vozila s obzirom na inteligentne sustave za pomoć pri kontroli brzine i za homologaciju
    tipa tih sustava kao zasebnih tehničkih jedinica te o izmjeni Priloga II. toj
    uredbi
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1958 felhatalmazáson alapuló rendelete (2021.
    június 23.) az (EU) 2019/2144 európai parlamenti és tanácsi rendeletnek a
    gépjárműveknek az intelligens sebességszabályozó rendszerei tekintetében
    történő típusjóváhagyására, valamint e rendszerek önálló műszaki egységként
    történő típusjóváhagyására vonatkozó egyedi vizsgálati eljárásokra
    és műszaki követelményekre vonatkozó részletes szabályok megállapítása
    tekintetében történő kiegészítéséről, valamint az említett rendelet
    II. mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1958 della Commissione del 23 giugno 2021
    che integra il regolamento (UE) 2019/2144 del Parlamento europeo e del Consiglio
    stabilendo norme dettagliate in merito alle procedure di prova e ai requisiti
    tecnici specifici per l’omologazione dei veicoli a motore per quanto riguarda
    i sistemi di adattamento intelligente della velocità e per l’omologazione di
    tali sistemi come entità tecniche indipendenti, e che ne modifica l’allegato
    II
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1958 (2021. gada 23. jūnijs), ar
    ko papildina Eiropas Parlamenta un Padomes Regulu (ES) 2019/2144, nosakot detalizētus
    noteikumus par specifiskām testa procedūrām un tehniskajām prasībām mehānisko
    transportlīdzekļu tipa apstiprināšanai attiecībā uz intelektiskas ātruma
    pielāgošanas sistēmām un šo sistēmu kā atsevišķu tehnisko vienību tipa
    apstiprināšanu, un ar ko groza minētās regulas II pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/1958 2021 m. birželio 23
    d. kuriuo Europos Parlamento ir Tarybos reglamentas (ES) 2019/2144 papildomas
    nustatant išsamias motorinių transporto priemonių tipo patvirtinimo, atsižvelgiant
    į jų išmaniąsias greičio palaikymo pagalbines sistemas, ir tų sistemų,
    kaip atskirų techninių mazgų, tipo patvirtinimo konkrečių bandymo procedūrų
    ir techninių reikalavimų taisykles ir iš dalies keičiamas to reglamento II
    priedas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/1958 tat-23 ta’ Ġunju 2021
    li jissupplimenta r-Regolament (UE) 2019/2144 tal-Parlament Ewropew u tal-Kunsill
    billi jistabbilixxi regoli dettaljati dwar il-proċeduri ta’ ttestjar speċifiċi
    u r-rekwiżiti tekniċi għall-approvazzjoni tat-tip ta’ vetturi bil-mutur fir-rigward
    tas-sistemi tagħhom ta’ assistenza intelliġenti tal-veloċità u għall-approvazzjoni
    tat-tip ta’ dawk is-sistemi bħala unitajiet tekniċi separati u li jemenda
    l-Anness II ta’ dak ir-Regolament
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/1958 van de Commissie van 23 juni 2021
    tot aanvulling van Verordening (EU) 2019/2144 van het Europees Parlement en de
    Raad met uitvoeringsbepalingen voor de specifieke testprocedures en technische
    voorschriften voor de typegoedkeuring van motorvoertuigen wat de systemen voor
    intelligente snelheidsondersteuning betreft en voor de typegoedkeuring van die
    systemen als technische eenheden en tot wijziging van bijlage II bij die verordening
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/1958 z dnia 23 czerwca 2021
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) 2019/2144
    poprzez określenie szczegółowych przepisów dotyczących konkretnych procedur
    badań i wymogów technicznych w zakresie homologacji typu pojazdów silnikowych
    w odniesieniu do systemów inteligentnego asystenta kontroli prędkości i homologacji
    typu tych systemów jako oddzielnych zespołów technicznych oraz zmieniające
    załącznik II do tego rozporządzenia
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1958 da Comissão de 23 de junho de 2021
    que complementa o Regulamento (UE) 2019/2144 do Parlamento Europeu e do Conselho
    estabelecendo normas de execução relativas aos procedimentos de ensaio específicos
    e aos requisitos técnicos para a homologação de veículos a motor no que respeita
    aos seus sistemas de adaptação inteligente da velocidade e para a homologação
    desses sistemas enquanto unidades técnicas e que altera o anexo II desse regulamento
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1958 al Comisiei din 23 iunie 2021 de completare
    a Regulamentului (UE) 2019/2144 al Parlamentului European și al Consiliului prin
    stabilirea unor norme detaliate privind procedurile specifice de încercare și
    cerințele tehnice pentru omologarea de tip a autovehiculelor în ceea ce privește
    sistemele de asistență inteligentă pentru controlul vitezei și pentru omologarea
    de tip a acestor sisteme ca unități tehnice separate și de modificare a anexei
    II la regulamentul menționat
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1958 z 23. júna 2021, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2019/2144 stanovením
    podrobných pravidiel týkajúcich sa osobitných skúšobných postupov a technických
    požiadaviek na typové schvaľovanie motorových vozidiel vzhľadom na systémy
    inteligentného prispôsobenia rýchlosti a na typové schvaľovanie týchto systémov
    ako samostatných technických jednotiek a ktorým sa mení príloha II k uvedenému
    nariadeniu
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1958 z dne 23. junija 2021 o dopolnitvi
    Uredbe (EU) 2019/2144 Evropskega parlamenta in Sveta z določitvijo podrobnih
    pravil v zvezi s posebnimi preizkusnimi postopki in tehničnimi zahtevami za homologacijo
    motornih vozil glede njihovih inteligentnih sistemov za uravnavanje hitrosti in
    za homologacijo teh sistemov kot samostojnih tehničnih enot ter o spremembi Priloge
    II k navedeni uredbi
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1958 de la Comisión de 23 de junio de 2021
    por el que se completa el Reglamento (UE) 2019/2144 del Parlamento Europeo y del
    Consejo mediante el establecimiento de normas detalladas sobre los procedimientos
    de ensayo y los requisitos técnicos específicos para la homologación de tipo
    de los vehículos de motor en lo que respecta a sus sistemas de asistente de velocidad
    inteligente y para la homologación de tipo de tales sistemas como unidades técnicas
    independientes, y por el que se modifica el anexo II de dicho Reglamento
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1958 av den 23 juni 2021
    om komplettering av Europaparlamentets och rådets förordning (EU) 2019/2144
    genom fastställande av närmare bestämmelser om särskilda provningsförfaranden
    och tekniska krav för typgodkännandet av motorfordon med avseende på system
    för intelligent hastighetsstöd och för typgodkännandet av dessa system som
    separata tekniska enheter och om ändring av bilaga II till den förordningen
  type: main
