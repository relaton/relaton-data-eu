  content: Commission Regulation (EEC) No 3507/89 of 23 November 1989 amending Regulation
    (EEC) No 3137/82 laying down detailed rules for the granting of financial compensation
    in respect of certain fishery products and Regulation (EEC) No 3321/82 laying
    down detailed rules for the granting of a carry-over premium for certain fishery
    products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3507/89 de la Commission du 23 novembre 1989 modifiant
