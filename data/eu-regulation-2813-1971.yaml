    die im Zuckerwirtschaftsjahr 1970/1971 oberhalb der Grundquote erzeugt wurden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2813/71 della Commissione, del 23 dicembre 1971, che
    fissa l'importo che i fabbricanti di zucchero devono pagare ai venditori di barbabietole
    prodotte in eccedenza della quota di base nella campagna saccarifera 1970/1971
  type: main
- language: nl
  script: Latn
