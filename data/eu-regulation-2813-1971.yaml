  content: Règlement (CEE) n° 2813/71 de la Commission, du 23 décembre 1971, fixant
    le montant à payer par les fabricants de sucre aux vendeurs de betteraves produites
    hors du quota de base pendant la campagne sucrière 1970/1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2813/71 der Kommission vom 23. Dezember 1971 zur Festsetzung
