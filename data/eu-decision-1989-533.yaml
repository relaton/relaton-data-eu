title:
- language: en
  script: Latn
  content: '89/533/EEC: Council Decision of 11 April 1989 authorizing the United Kingdom
    to apply a measure derogating from Article 21 (1) (a) of the Sixth Directive 77/388/EEC
    on the harmonization of the laws of the Member States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '89/533/CEE: Décision du Conseil du 11 avril 1989 autorisant le Royaume-Uni
    à appliquer une mesure dérogatoire à l''article 21 paragraphe 1 point a) de
    la sixième directive 77/388/CEE en matière d''harmonisation des législations
    des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DES RATES vom 11. April 1989 zur Ermächtigung des Vereinigten
    Königreichs zur Anwendung einer Sondermaßnahme in Abweichung von Artikel 21
    Absatz 1 Buchstabe a) der Sechsten Richtlinie 77/388/EWG zur Harmonisierung der
    Rechtsvorschriften der Mitgliedstaaten über die Umsatzsteuern (89/533/EWG) (89/533/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS BESLUTNING af 11. april 1989 om bemyndigelse af Det Forenede Kongerige
    til at anvende en foranstaltning, der fraviger artikel 21, stk. 1, litra a), i
    sjette direktiv (77/388/EØF) om harmonisering af medlemsstaternes lovgivning
    om omsætningsafgifter (89/533/EØF) (89/533/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/533/ΕΟΚ: Απόφαση του Συμβουλίου της 11ης
    Απριλίου 1989 με την οποία επιτρέπεται στο Ηνωμένο
    Βασίλειο να εφαρμόσει ένα μέτρο παρέκκλισης
    από το άρθρο 21 παράγραφος 1 στοιχείο α) της έκτης
    οδηγίας 77/388/ΕΟΚ περί εναρμονίσεως των νομοθεσιών
    των κρατών μελών των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DEL CONSIGLIO dell'' 11 aprile 1989 che autorizza il Regno Unito
    ad applicare una misura derogatoria all'' articolo 21, paragrafo 1, lettera a)
    della sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni
    degli Stati membri relative alle imposte sulla cifra d'' affari (89/533/CEE) (89/533/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE RAAD van 11 april 1989 waarbij het Verenigd Koninkrijk
    wordt gemachtigd een maatregel toe te passen die afwijkt van artikel 21, punt
    1, onder a), van de Zesde Richtlijn 77/388/EEG betreffende de harmonisatie van
    de wetgevingen der Lid-Staten inzake omzetbelasting (89/533/EEG) (89/533/EEG)
    #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 11 de Abril de 1989 que autoriza o Reino Unido a
    aplicar uma medida derrogatoria do n* 1, alinea a), do artigo 21* da sexta Directiva
    77/388/CEE, relativa à harmonizaçao das legislaçoes dos Estados-membros respeitantes
    aos impostos sobre o volume de negocios (89/533/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DEL CONSEJO de 11 de abril de 1989 por la que se autoriza al
    Reino Unido a que aplique una excepción a la letra a) del apartado 1 del artículo
    21 de la sexta Directiva 77/388/CEE en materia de armonización de las legislaciones
    de los Estados miembros relativas a los impuestos sobre el volumen de negocios
    (89/533/CEE) (89/533/CEE) #'
