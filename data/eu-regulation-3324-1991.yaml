title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3324/91 of 13 November 1991 re-establishing
    the levying of customs duties on products falling within CN code 2523, originating
    in Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3324/91 DE LA COMMISSION du 13 novembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2523 originaires de la Roumanie, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3324/91 DER KOMMISSION vom 13. November 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 2523 mit
    Ursprung in Rumänien, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3324/91 af 13. november 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2523 og med oprindelse
    i Rumænien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
