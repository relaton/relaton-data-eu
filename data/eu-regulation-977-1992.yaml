  content: Commission Regulation (EEC) No 977/92 of 21 April 1992 fixing for the 1992
    marketing year the Community offer prices for peaches including nectarines applicable
    with regard to Spain and Portugal
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 977/92 de la Commission du 21 avril 1992 fixant, pour
    la campagne 1992, les prix d'offre communautaires des pêches, y compris les brugnons
    et nectarines, applicables vis-à-vis de l'Espagne et du Portugal
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 977/92 DER KOMMISSION vom 21. April 1992 zur Festsetzung
    der für das Wirtschaftsjahr 1992 auf Spanien und Portugal anwendbaren gemeinschaftlichen
    Angebotspreise für Pfirsiche einschließlich Brugnolen und Nektarinen #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 977/92 af 21. april 1992 om fastsættelse
    for høståret 1992 af Fællesskabets tilbudspriser for ferskner, herunder blodferskner
    og nektariner, gældende over for Spanien og Portugal #'
  type: main
- language: el
  script: Grek
