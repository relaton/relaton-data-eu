    περίοδο 1992, των κοινοτικών τιμών προσφοράς
    ροδακίνων, συμπεριλαμβανομένων των brugnons και
    των νεκταρινιών, που εφαρμόζονται έναντι της
    Ισπανίας και της Πορτογαλίας
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 977/92 DELLA COMMISSIONE del 21 aprile 1992 che fissa
