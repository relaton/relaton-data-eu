title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1617/83 of 15 June 1983 fixing the marketing
    year 1983/84 for cherries in syrup and providing derogations from certain provisions
    laid down in Regulation (EEC) No 1530/78 in respect of the system of aid in respect
    of certain products from fruit and vegetables
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1617/83 de la Commission du 15 juin 1983 fixant la
    campagne de commercialisation pour les cerises au sirop et prévoyant des dérogations
    pour certaines dispositions, contenues dans le règlement (CEE) no 1530/78, sur
    le régime d' aide pour certains produits transformés à base de fruits et légumes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1617/83 der Kommission vom 15. Juni 1983 zur Festlegung
    des Wirtschaftsjahres 1983/84 für Kirschen in Sirup und von Ausnahmeregelungen
    zu der Verordnung (EWG) Nr. 1530/78 betreffend die Beihilferegelung für Verarbeitungserzeugnisse
    aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1617/83 af 15. juni 1983 om fastsættelse
    af produktionsåret 1983/84 for kirsebær i sukkeropløsning og om undtagelse
    fra visse bestemmelser i forordning (EØF) nr. 1530/78 for så vidt angår støtteordningen
    for visse produkter forarbejdet på basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1617/83 της Επιτροπής
    της 15ης Ιουνίου 1983 που καθορίζει την περίοδο
    εμπορίας 1983/84 για τα κεράσια με σιρόπι και προβλέπει
    παρεκκλίσεις από ορισμένες διατάξεις του κανονισμού
    (ΕΟΚ) αριθ. 1530/78 σχετικά με το σύστημα ενίσχυσης
    για ορισμένα μεταποιημένα προϊόντα με βάση
    τα οπωροκηπευτικά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1617/83 della Commissione del 15 giugno 1983 che fissa
    la campagna di commercializzazione 1983/1984 per le ciliegie sciroppate e deroga
    a talune disposizioni del regolamento (CEE) n. 1530/78 per quanto riguarda il
    regime di aiuto relativo a taluni prodotti trasformati a base di ortofrutticoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1617/83 van de Commissie van 15 juni 1983 tot vaststelling
    van het verkoopseizoen 1983/1984 voor kersen op siroop en houdende afwijking van
    sommige bepalingen van Verordening (EEG) nr. 1530/78 houdende uitvoeringsbepalingen
    van de steunregeling voor sommige op basis van groenten en fruit verwerkte produkten
  type: main
