    N:o 638/2003 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2120/2005/EK rendelete ( 2005. december 22. ) az afrikai,
    karibi és csendes-óceáni államokból (AKCS-államok), illetve a tengerentúli
    országokból és területekről (TOT) származó rizs behozatalára alkalmazandó
    szabályok tekintetében a 2286/2002/EK tanácsi rendelet és a 2001/822/EK tanácsi
    határozat részletes alkalmazási szabályainak megállapításáról szóló
    638/2003/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2120/2005 della Commissione, del 22 dicembre 2005 ,
    recante modifica del regolamento (CE) n. 638/2003 recante modalità di applicazione
    del regolamento (CE) n. 2286/2002 del Consiglio e della decisione 2001/822/CE
    del Consiglio per quanto riguarda il regime applicabile all’importazione di
    riso originario degli Stati dell’Africa, dei Caraibi e del Pacifico (Stati ACP)
    e dei paesi e territori d’oltremare (PTOM)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2120/2005 ( 2005. gada 22. decembris ), ar kuru
    groza Regulu (EK) Nr. 638/2003, ar ko nosaka sīki izstrādātus noteikumus Padomes
    Regulas (EK) Nr. 2286/2002 un Padomes Lēmuma 2001/822/EK piemērošanai attiecībā
    uz režīmu, kas piemērojams Āfrikas, Karību jūras reģiona un Klusā okeāna
    valstu (ĀKK valstis) un aizjūras zemju un teritoriju (AZT) izcelsmes rīsu ievedumiem
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 22 d. Komisijos reglamentas (EB) Nr. 2120/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 638/2003, nustatantį išsamias Tarybos reglamento
    (EB) Nr. 2286/2002 ir Tarybos sprendimo 2001/822/EB taikymo taisykles dėl Afrikos,
    Karibų jūros ir Ramiojo vandenyno valstybių (AKR valstybių) bei užjūrio
    šalių ir teritorijų (UŠT) kilmės ryžių importui taikomos tvarkos
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2120/2005 van de Commissie van 22 december 2005 houdende
    wijziging van Verordening (EG) nr. 638/2003 tot vaststelling van uitvoeringsbepalingen
    van Verordening (EG) nr. 2286/2002 van de Raad en Besluit 2001/822/EG van de Raad
    ten aanzien van de invoerregeling voor rĳst van oorsprong uit de staten in Afrika,
    het Caribische gebied en de Stille Oceaan (de ACS-staten) en uit de landen en
    gebieden overzee (LGO)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2120/2005 z dnia 22 grudnia 2005 r. zmieniające
    rozporządzenie (WE) nr 638/2003 ustanawiające szczegółowe zasady stosowania
    rozporządzenia Rady (WE) nr 2286/2002 i decyzji Rady 2001/822/WE w odniesieniu
    do uzgodnień mających zastosowanie do przywozu ryżu pochodzącego z Państw
    Afryki, Karaibów i Pacyfiku (Państw AKP) oraz z krajów i terytoriów zamorskich
    (KTZ)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2120/2005 da Comissão, de 22 de Dezembro de 2005
    , que altera o Regulamento (CE) n. o 638/2003, que estabelece as regras de execução
    do Regulamento (CE) n. o 2286/2002 do Conselho e da Decisão 2001/822/CE do Conselho
    no respeitante ao regime aplicável à importação de arroz originário dos Estados
    de África, das Caraíbas e do Pacífico (ACP) e dos países e territórios ultramarinos
    (PTU)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2120/2005 z 22. decembra 2005 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 638/2003, ktorým sa ustanovujú podrobné
    pravidlá na uplatňovanie nariadenia Rady (ES) č. 2286/2002 a rozhodnutia Rady
    2001/822/ES, pokiaľ ide o opatrenia uplatniteľné na dovoz ryže s pôvodom
    v afrických, karibských a tichomorských štátoch (štáty AKT) a zámorských
    krajinách a územiach (ZKÚ)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2120/2005 z dne 22. decembra 2005 o spremembi
    Uredbe (ES) št. 638/2003 o podrobnih pravilih za uporabo Uredbe Sveta (ES) št.
    2286/2002 in Sklepa Sveta 2001/822/ES glede dogovorov, ki se uporabljajo za uvoze
    riža s poreklom iz afriških, karibskih in pacifiških držav (države AKP) ter
    čezmorskih držav in ozemelj (ČDO)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2120/2005 de la Comisión, de 22 de diciembre de 2005
    , que modifica el Reglamento (CE) n o 638/2003 por el que se establecen disposiciones
    de aplicación del Reglamento (CE) n o 2286/2002 del Consejo y de la Decisión
    2001/822/CE del Consejo en lo referente al régimen aplicable a las importaciones
    de arroz originario de los Estados de África, del Caribe y del Pacífico (ACP)
    y de los países y territorios de Ultramar (PTU)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2120/2005 av den 22 december 2005 om
    ändring av förordning (EG) nr 638/2003 om tillämpningsföreskrifter för rådets
    förordning (EG) nr 2286/2002 och rådets beslut 2001/822/EG vad beträffar ordningen
