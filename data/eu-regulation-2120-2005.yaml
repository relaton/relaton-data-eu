    af forordning (EF) nr. 638/2003 om gennemførelsesbestemmelser til Rådets forordning
    (EF) nr. 2286/2002 og Rådets afgørelse 2001/822/EF for så vidt angår ordningen
    for indførsel af ris med oprindelse i stater i Afrika, Vestindien og Stillehavet
    (AVS) og oversøiske lande og territorier (OLT)
  type: main
