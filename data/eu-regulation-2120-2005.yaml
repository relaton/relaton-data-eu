title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2120/2005 of 22 December 2005 amending Regulation
    (EC) No 638/2003 laying down detailed rules for applying Council Regulation (EC)
    No 2286/2002 and Council Decision 2001/822/EC as regards the arrangements applicable
    to imports of rice originating in the African, Caribbean and Pacific States (ACP
    States) and the overseas countries and territories (OCT)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2120/2005 de la Commission du 22 décembre 2005 modifiant
    le règlement (CE) n o 638/2003 portant modalités d'application du règlement
    (CE) n o 2286/2002 du Conseil et de la décision 2001/822/CE du Conseil en ce
    qui concerne le régime applicable à l'importation de riz originaire des États
    d'Afrique, des Caraïbes et du Pacifique (ACP) et des pays et territoires d'outre-mer
    (PTOM)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2120/2005 der Kommission vom 22. Dezember 2005 zur
    Änderung der Verordnung (EG) Nr. 638/2003 mit Durchführungsbestimmungen zur
    Verordnung (EG) Nr. 2286/2002 des Rates und zum Beschluss 2001/822/EG des Rates
    hinsichtlich der Einfuhrregelung für Reis mit Ursprung in den Staaten in Afrika,
    im karibischen Raum und im Pazifischen Ozean (AKP-Staaten) sowie in den überseeischen
    Ländern und Gebieten (ÜLG)
  type: main
- language: cs
  script: Latn
