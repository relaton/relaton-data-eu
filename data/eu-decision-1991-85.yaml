title:
- language: en
  script: Latn
  content: '91/85/EEC, Euratom: Commission Decision of 4 February 1991 amending Decision
    90/183/Euratom, EEC authorizing Ireland not to take into account certain categories
    of transactions and to use certain approximate estimates for the calculation of
    the VAT own resources base (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '91/85/CEE, Euratom: Décision de la Commission du 4 février 1991 modifiant
    la décision 90/183/Euratom, CEE autorisant l''Irlande à ne pas tenir compte
    de certaines catégories d''opérations et à utiliser certaines estimations approximatives
    pour le calcul de la base des ressources propres provenant de la taxe sur la valeur
    ajoutée (Le texte en langue anglaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '91/85/EWG, Euratom: Entscheidung der Kommission vom 4. Februar 1991 zur
    Änderung der Entscheidung 90/183/Euratom, EWG, mit der Irland ermächtigt wird,
    bei der Berechnung der Grundlage für die MwSt.-Eigenmittel bestimmte Gruppen
    von Umsätzen nicht zu berücksichtigen und die Grundlage bei bestimmten anderen
    Gruppen von Umsätzen anhand näherer Schätzungen zu ermitteln (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '91/85/EØF, Euratom: Kommissionens beslutning af 4. februar 1991 om ændring
    af beslutning 90/183/Euratom, EØF om bemyndigelse af Irland til at beregne grundlaget
    for Fællesskabernes momsindtægter uden hensyntagen til visse transaktioner og,
    for andre transaktioners vedkommende, på basis af en tilnærmelsesvis vurdering
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '91/85/ΕΟΚ, Ευρατόμ: Απόφαση της Επιτροπής
    της 4ης Φεβρουαρίου 1991 για την τροποποίηση
    της απόφασης 90/183/Ευρατόμ, ΕΟΚ, με την οποία
    επιτρέπεται στην Ιρλανδία να μη λαμβάνει υπόψη
    ορισμένες κατηγορίες δραστηριοτήτων και να
    χρησιμοποιεί κατά προσέγγιση εκτιμήσεις κατά
    τον υπολογισμό της βάσης των ιδίων πόρων που
    προέρχονται από το φόρο επί της προστιθεμένης
    αξίας'
  type: main
- language: it
  script: Latn
  content: '91/85/CEE, Euratom: Decisione della Commissione del 4 febbraio 1991 che
    modifica la decisione 90/183/Euratom, CEE che autorizza l''Irlanda a non tener
    conto di determinate categorie di operazioni e a ricorrere a talune valutazioni
    approssimative per il calcolo della base delle risorse proprie provenienti dall''imposta
    sul valore aggiunto (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '91/85/EEG, Euratom: Beschikking van de Commissie van 4 februari 1991 tot
    wijziging van Beschikking 90/183/Euratom, EEG, waarbij Ierland wordt gemachtigd
    geen rekening te houden met bepaalde categorieën handelingen en gebruik te maken
    van ramingen voor de berekening van de grondslag van de eigen middelen uit de
    belasting over de toegevoegde waarde (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '91/85/CEE, Euratom: Decisão da Comissão de 4 de Fevereiro de 1991 que
    altera a Decisão 90/183/Euratom, CEE, que autoriza a Irlanda a não ter em conta
    determinadas categorias de operações e a utilizar determinadas estimativas aproximativas
    para o cálculo da matéria colectável dos recursos próprios provenientes do
    Imposto sobre o Valor Acrescentado (Apenas faz fé o texto em língua inglesa)'
  type: main
- language: es
  script: Latn
  content: '91/85/CEE, Euratom: Decisión de la Comisión de 4 de febrero de 1991
    por la que se modifica la Decisión 90/183/Euratom, CEE, por la que se autoriza
    a Irlanda a no tomar en consideración determinadas categorías de operaciones
    y a utilizar estimaciones aproximadas para el cálculo de la base de los recursos
    propios procedentes del Impuesto sobre el Valor Añadido (El texto en lengua inglesa
    es el único auténtico)'
  type: main
