title:
- language: en
  script: Latn
  content: '82/963/EEC: Commission Decision of 30 December 1982 establishing that
    the apparatus described as ''Canberra - Multichannel Analyzing Computer System,
    model Scorpio System 3204'' may not be imported free of Common Customs Tariff
    duties'
  type: main
- language: fr
  script: Latn
  content: '82/963/CEE: Décision de la Commission, du 30 décembre 1982, constatant
    que l''importation de l''appareil dénommé "Canberra - Multichannel Analyzing
    Computer System, model Scorpio System 3204" ne peut être faite en franchise des
    droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/963/EWG: Entscheidung der Kommission vom 30. Dezember 1982, mit der
    festgestellt wird, daß das Gerät ,,Canberra - Multichannel Analyzing Computer
    System, model Scorpio System 3204" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/963/EØF: Kommissionens beslutning af 30. december 1982 om fastslåelse
    af, at indførsel af apparatet "Canberra - Multichannel Analyzing Computer System,
    model Scorpio System 3204" ikke kan ske med fritagelse for told efter den fælles
    toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/963/EOK: Απόφαση τής Επιτροπής τής 30ής Δεκεμβρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Canberra — Multichannel Analyzing Computer System,
    model Scorpio System 3204» δέν δύναται νά πραγματοποιηθεί
    ατελώς ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/963/CEE: Decisione della Commissione, del 30 dicembre 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Canberra - Multichannel Analyzing
    Computer System, model Scorpio System 3204" non può avvenire in franchigia dai
    dazi della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/963/EEG: Beschikking van de Commissie van 30 december 1982 waarbij
