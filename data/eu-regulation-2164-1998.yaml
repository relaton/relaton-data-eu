title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2164/98 of 5 October 1998 imposing a definitive
    countervailing duty on imports of certain broad spectrum antibiotics originating
    in India and collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2164/98 du Conseil du 5 octobre 1998 instituant un
    droit compensateur définitif sur les importations de certains antibiotiques à
    large spectre originaires de l'Inde et portant perception définitive du droit
    provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2164/98 des Rates vom 5. Oktober 1998 zur Einführung
    eines endgültigen Ausgleichszolls auf die Einfuhren bestimmter Breitband-Antibiotika
    mit Ursprung in Indien und zur endgültigen Vereinnahmung des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2164/98 af 5. oktober 1998 om indførelse af
    en endelig udligningstold på importen af visse bredspektrede antibiotika med
    oprindelse i Indien og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2164/98 του Συμβουλίου
    της 5ης Οκτωβρίου 1998 για την επιβολή οριστικού
    αντισταθμιστικού δασμού στις εισαγωγές ορισμένων
    αντιβιοτικών ευρέος φάσματος καταγωγής Ινδίας
    και την οριστική είσπραξη του επιβληθέντος
    προσωρινού δασμού
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2164/98, annettu 5 päivänä lokakuuta 1998,
    lopullisen tasoitustullin käyttöön ottamisesta tiettyjen Intiasta peräisin
    olevien laajavaikutteisten antibioottien tuonnissa ja väliaikaisen tullin lopullisesta
    kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2164/98 del Consiglio del 5 ottobre 1998 che impone
    un dazio compensativo definitivo sulle importazioni di alcuni antibiotici ad ampio
    spettro originari dell'India e che decide la riscossione definitiva del dazio
    provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2164/98 van de Raad van 5 oktober 1998 tot instelling
    van een definitief compenserend recht op de invoer van bepaalde breedspectrumantibiotica
    uit India en tot definitieve inning van het voorlopige recht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2164/98 do Conselho de 5 de Outubro de 1998 que institui
    um direito de compensação definitivo sobre as importações de determinados
    antibióticos de largo espectro originárias da Índia que cobra definitivamente
    o direito provisório instituído
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2164/98 del Consejo de 5 de octubre de 1998 por el
    que se establece un derecho compensatorio definitivo sobre las importaciones de
    determinados antibióticos de amplio espectro originarios de la India y por el
    que se percibe definitivamente el derecho provisional impuesto
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2164/98 av den 5 oktober 1998 om införande
    av en slutgiltig utjämningstull på import av vissa bredspektrumantibiotika med
    ursprung i Indien och om slutgiltigt uttag av den införda provisoriska tullen
  type: main
