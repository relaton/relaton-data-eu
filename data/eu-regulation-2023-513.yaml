- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/513 of 8 March 2023 amending
    Annexes XV and XIX to Implementing Regulation (EU) 2021/404 as regards the list
    of third countries, territories or zones thereof authorised for the entry into
    the Union of meat products from ungulates, poultry and game birds and of eggs
    and egg products
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/513 de la Commission du 8 mars 2023
    modifiant les annexes XV et XIX du règlement d’exécution (UE) 2021/404 en
    ce qui concerne la liste des pays tiers et territoires, ou des zones de pays tiers
    ou territoire, en provenance desquels l’entrée dans l’Union de produits à
    base de viande d’ongulés, de volailles et de gibier à plumes ainsi que d’œufs
    et d’ovoproduits est autorisée
  type: main
- language: de
  script: Latn
