    hinsichtlich der Liste von Drittländern, Gebieten und Zonen derselben, aus denen
    der Eingang von Fleischerzeugnissen von Huftieren, Geflügel und Federwild sowie
    von Eiern und Eiprodukten in die Union zulässig ist
  type: main
