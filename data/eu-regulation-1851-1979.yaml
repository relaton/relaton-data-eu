title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1851/79 of 20 August 1979 re-establishing
    the levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 and originating in
    developing countries, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 1195/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1851/79 de la Commission, du 20 août 1979, portant
    rétablissement de la perception des droits de douane applicables à la ganterie
    de bonneterie non élastique ni caoutchoutée, de la position 60.02 du tarif douanier
    commun, originaire des pays et territoires en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 1195/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1851/79 der Kommission vom 20. August 1979 zur Wiedereinführung
    des Zollsatzes für Handschuhe aus Gewirken weder gummielastisch noch kautschutiert,
    der Tarifnummer 60.02, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 1195/79 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1851/79 af 20. august 1979 om genindførelse
    af opkrævning af toldafgifter for handsker, vanter og luffer af trikotage, ikke
    elastisk eller gummeret, henhørende under pos. 60.02 i den fælles toldtarif,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 1195/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1851/79 della Commissione, del 20 agosto 1979, che
    ripristina la riscossione dei dazi doganali applicabili ai guanti a maglia non
    elastica né gommata, della voce 60.02 della tariffa doganale comune, originari
    dei paesi in via di sviluppo beneficiari delle preferenze tariffarie previste
    dal regolamento (CEE) n. 1195/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1851/79 van de Commissie van 20 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op handschoenen,
    wanten en dergelijke artikelen, van niet-elastisch of van niet-gegummeerd brei-
    of haakwerk, van post 60.02, van oorsprong uit de ontwikkelingslanden ten behoeve
    waavan bij Verordening (EEG) nr. 1195/79 van de Raad tariefpreferenties werden
    geopend
  type: main
