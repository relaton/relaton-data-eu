title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 47/81 of 1 January 1981 fixing, for Greece,
    the guide price applicable for dried fodder and the level of the fixed rate production
    aid for dried potatoes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 47/81 du Conseil, du 1er janvier 1981, fixant, pour
    la Grèce, le prix d' objectif applicable dans le secteur des fourrages séchés
    ainsi que le niveau de l' aide forfaitaire à la production pour les pommes de
    terre déshydratées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 47/81 des Rates vom 1. Januar 1981 zur Festlegung
    des für Trockenfutter geltenden Zielpreises und der Höhe der Pauschalbeihilfe
    für die Erzeugung künstlich getrockneter Kartoffeln in Griechenland
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 47/81 af 1. januar 1981 om fastsættelse
    af den målpris, der skal gælde i Grækenland for tørret foder samt om størrelsen
    af støtten til produktionen af tørrede kartofler
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 47/81 του Συμβουλίου
