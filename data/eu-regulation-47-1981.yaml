    Ελλάδα, της τιμής στόχου που εφαρμόζεται στον
    τομέα των αποξηραμένων ζωοτροφών, καθώς και
    του ύψους της κατ’αποκοπή ενισχύσεως στην
    παραγωγή για τα αφυδατωμένα γεώμηλα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 47/81 del Consiglio, del 1° gennaio 1981, che fissa
