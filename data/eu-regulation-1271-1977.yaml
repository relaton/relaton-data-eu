title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1271/77 of 13 June 1977 re-establishing
    the levying of customs duties on medium oils, for other purposes, falling within
    subheading 27.10 B III, originating in Libya to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3021/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1271/77 de la Commission, du 13 juin 1977, portant
    rétablissement de la perception des droits de douane applicables aux huiles de
    pétrole moyennes, destinées à d'autres usages, de la sous-position tarifaire
    27.10 B III, originaires de la Libye, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1271/77 der Kommission vom 13. Juni 1977 zur Wiedereinführung
    des Zollsatzes für mittelschwere Öle, zu anderer Verwendung, der Tarifstelle
    27.10 B III, mit Ursprung in Libyen, dem die in der Verordnung (EWG) Nr. 3021/76
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1271/77 af 13. juni 1977 om genindførelse
    af opkrævning af toldafgifter for middelsvære olier, til anden anvendelse, under
    underposition 27.10 B III, som har oprindelse i Libyen og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1271/77 della Commissione, del 13 giugno 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli oli di petrolio medi,
    destinati ad altri usi, della sottovoce doganale 27.10 B III, originari della
    Libia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1271/77 van de Commissie van 13 juni 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op halfzware
    oliën, bestemd voor ander gebruik, van post 27.10 B III, van oorsprong uit Libië,
    ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad algemene tariefpreferenties
    werden geopend
  type: main
