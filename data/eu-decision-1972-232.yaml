title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 juin 1972, autorisant la République française
    à exclure du traitement communautaire les appareils de reproduction du son (lecteurs
    de cassettes), de la position 92.11 A Ex II du Tarif douanier commun, originaires
    du Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/232/EWG: Entscheidung der Kommission vom 5. Juni 1972, mit der die
    Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Tonwiedergabegeräte (Kassetten-Wiedergabegeräte)
    der Tarifnummer 92.11 A ex II des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/232/CEE: Decisione della Commissione, del 5 giugno 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    di riproduzione del suono (lettori di cassette) della voce n. 92.11 A ex II della
    tariffa doganale comune, originari del Giappone e messi in libera pratica negli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/232/EEG: Beschikking van de Commissie van 5 juni 1972 waarbij de Franse
    Republiek wordt gemachtigd toestellen voor het weergeven van geluid (cassette-lezers)
    van post 92.11 A ex II van het gemeenschappelijk douanetarief, van oorsprong uit
    Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
