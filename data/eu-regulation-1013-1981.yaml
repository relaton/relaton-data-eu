title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1013/81 of 17 February 1981 on the conclusion
    of the Agreement in the form of an exchange of letters relating to the Agreement
    between the European Economic Community and the Republic of Austria on the simplification
    of formalities in respect of goods traded between the European Economic Community,
    on the one hand, and Greece and Turkey, on the other hand, when the said goods
    are forwarded from Austria and concerning the implementation in the Community
    of Decisions No 1/80, No 2/80 and No 3/80 of the EEC-Austria Joint Committee -
    Community transit - amending the Agreement between the European Economic Community
    and the Republic of Austria on the application of the rules on Community transit
    and the Appendices thereto
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1013/81 du Conseil, du 17 février 1981, concernant
    la conclusion de l'accord sous forme d'échange de lettres relatif à l'amendement
    de l'accord entre la Communauté économique européenne et la République d'Autriche
    sur la simplification des formalités dans les échanges de marchandises entre
    la Communauté économique européenne, d'une part, et la Grèce et la Turquie,
    d'autre part, en cas de réexpédition desdites marchandises à partir de l'Autriche,
    et concernant l'application dans la Communauté des décisions n° 1/80, n 2/80
    et n 3/80 de la Commission mixte CEE-Autriche "transit communautaire" modifiant
    l'accord entre la Communauté économique européenne et la République d'Autriche
    sur l'application de la réglementation relative au transit communautaire ainsi
    que ses appendices
