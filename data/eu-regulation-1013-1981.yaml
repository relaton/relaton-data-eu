  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1013/81 del Consiglio, del 17 febbraio 1981, per la
    conclusione dell' accordo sotto forma di scambio di lettere relativo all' emendamento
    dell' accordo tra la Comunità economica europea e la Repubblica d' Austria che
    semplifica le formalità negli scambi di merci tra la Comunità economica europea,
    da un lato, e la Grecia e la Turchia, dall' altro, in caso di rispedizione di
    dette merci dall' Austria, e concernente l' applicazione nella Comunità delle
    decisioni n. 1/80, n. 2/80 e n. 3/80 della commissione mista CEE-Austria (transito
    comunitario) che modificano l' accordo tra la Comunità economica europea e la
    Repubblica d' Austria sull' applicazione della normativa relativa al transito
    comunitario, nonché le sue appendici
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1013/81 van de Raad van 17 februari 1981 inzake de
    sluiting van de Overeenkomst in de vorm van een briefwisseling betreffende de
    wijziging van de Overeenkomst tussen de Europese Economische Gemeenschap en de
    Republiek Oostenrijk inzake de vereenvoudiging van de formaliteiten bij het goederenverkeer
    tussen de Europese Economische Gemeenschap, enerzijds, en Griekenland en Turkije,
    anderzijds, wanneer de goederen vanuit Oostenrijk worden doorverzonden, en betreffende
    de toepassing binnen de Gemeenschap van de Besluiten nr. 1/80, nr. 2/80 en nr.
    3/80 van de Gemengde Commissie EEG-Oostenrijk - communautair douanevervoer - houdende
    wijziging van de Overeenkomst tussen de Europese Economische Gemeenschap en de
    Republiek Oostenrijk over de toepassing van de voorschriften inzake communautair
    douanevervoer, alsmede van de daarbij behorende aanhangsels
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 1013/81 do Conselho, de 17 de Fevereiro de 1981,
    relativo à conclusão do Acordo sob forma de Troca de Cartas relativo à alteração
    do Acordo entre a Comunidade Económica Europeia e a República da Áustria sobre
    a simplificação das formalidades nas trocas de mercadorias entre a Comunidade
    Económica Europeia, por um lado, e a Grécia e a Turquia, por outro lado, no
    caso de reexpedição das referidas mercadorias a partir da Áustria e respeitante
    à aplicação na Comunidade das Decisões n.° 1/80, n.° 2/80 e n.° 3/80 da
    Comissão Mista CEE-Áustria - trânsito comunitário - que alteram o Acordo entre
    a Comunidade Económica Europeia e a República da Áustria sobre a aplicação
    da regulamentação relativa ao trânsito comunitário assim como os seus apêndices
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1013/81 del Consejo, de 17 de febrero de 1981, relativo
    a la celebración del Acuerdo en forma de Canje de Notas por el que se modifica
    el Acuerdo entre la Comunidad Económica Europea y la República de Austria sobre
    simplificación de las formalidades en los intercambios de mercancías entre la
    Comunidad Económica Europea, por una parte, y Grecia y Turquía, por otra, en
    caso de reexpedición de tales mercancías desde Austria, y relativo a la aplicación
    de las Decisiones n° 1/80, n° 2/80 y n° 3/80 de la Comisión mixta CEE-Suiza
    -tránsito comunitario- por las que se modifica el Acuerdo entre la Comunidad
    Económica Europea y la República de Austria sobre aplicación de la normativa
    en materia de tránsito comunitario así como sus Apéndices
