id: EUDecision1978766
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 7 September 1978 authorizing Ireland not to apply
    Community treatment to gloves, mittens and mitts, knitted or crocheted, not elastic
    or rubberized, impregnated or coated with artificial plastic materials or of wool,
    of cotton or of man-made textile fibres, falling within heading No ex 60.02 of
    the Common Customs Tariff (NIMEXE codes 60.02-40; 50; 60; 70), originating in
    Hong Kong and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/766/CEE: Décision de la Commission, du 7 septembre 1978, autorisant
    l''Irlande à exclure du traitement communautaire la ganterie de bonneterie non
    élastique ni caoutchoutée, imprégnée ou enduite de matières plastiques ou
    de laine, de coton ou de fibres textiles synthétiques ou artificielles, de la
    position Ex 60.02 du Tarif douanier commun (codes Nimexe : 60.02-40, 50, 60, 70),
    originaire de Hong-Kong et mise en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 7. September 1978, mit der Irland ermächtigt
    wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Handschuhe aus Gewirken, weder gummielastisch noch kautschutiert,
    mit Kunststoff getränkt oder bestrichen oder aus Wolle, Baumwolle oder synthetischen
    oder künstlichen Spinnstoffen, der Tarifnummer ex 60.02 des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 60.02-40; 50; 60; 70) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 7. september 1978 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage handsker, vanter og luffer af trikotage,
    ikke elastisk eller gummeret, imprægneret eller overtrukket med plast, eller
    af uld, bomuld eller syntetiske eller regenererede fibre, som henhører under
    pos. ex 60.02 i den fælles toldtarif (NIMEXE-kode 60.02-40, 50, 60, 70), har
    oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 7 settembre 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario i guanti a maglia non elastica né gommata,
    impregnati o ricoperti di materie plastiche, di lana, di cotone o di fibre tessili
    sintetiche o artificiali, della voce ex 60.02 della tariffa doganale comune (codice
    Nimexe: 60.02-40, 50, 60, 70), originari di Hong Kong e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 7 september 1978 waarbij Ierland wordt
    gemachtigd handschoenen, wanten en dergelijke artikelen, van niet-elastisch of
    van niet-gegummeerd brei- of haakwerk, geïmpregneerd of met een deklaag van plastische
    stoffen of van wol, katoen of van synthetische of kunstmatige textielvezels, van
    post ex 60.02 van het gemeenschappelijk douanetarief (NIMEXE-code 60.02-40, 50,
    60, 70), van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
