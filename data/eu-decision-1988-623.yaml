  content: '88/623/EEC: Commission Decision of 12 December 1988 accepting undertakings
    given in connection with the anti-dumping review concerning imports of oxalic
    acid originating in China or Czechoslovakia and terminating the review'
  type: main
- language: fr
  script: Latn
  content: '88/623/CEE: Décision de la Commission du 12 décembre 1988 portant acceptation
    des engagements souscrits, dans le cadre de la procédure de réexamen concernant
    les importations d''acide oxalique originaire de Chine et de Tchécoslovaquie
    et clôture de l''enquête de réexamen y afférente'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DER KOMMISSION vom 12. Dezember 1988 ueber die Annahme von Verpflichtungen
    im Rahmen des Ueberpruefungsverfahrens betreffend die Einfuhren von Oxalsaeuren
    mit Ursprung in China und der Tschechoslowakei und ueber die Einstellung des Untersuchungsverfahrens
    (88/623/EWG)
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS AFGOERELSE af 12. december 1988 om godtagelse af tilsagn
