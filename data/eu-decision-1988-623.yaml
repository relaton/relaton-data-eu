    med oprindelse i Kina og Tjekkoslovakiet og om afslutning af den fornyede undersoegelse
    (88/623/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 12ης Δεκεμβρίου
    1988 για την αποδοχή των υποχρεώσεων που έχουν
    αναληφθεί στα πλαίσια της διαδικασίας επανεξέτασης
    που αφορά τις εισαγωγές οξαλικού οξέος καταγωγής
    Κίνας και Τσεχοσλοβακίας και για την περάτωση
    της σχετικής διαδικασίας ( 88/623/ΕΟΚ )
  type: main
- language: it
