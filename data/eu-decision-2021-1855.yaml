    zur Gründung einer Assoziation zwischen der Europäischen Gemeinschaft und ihren
    Mitgliedstaaten einerseits und der Libanesischen Republik andererseits eingesetzten
    Assoziationsrat im Hinblick auf eine Verlängerung der Gültigkeit der Partnerschaftsprioritäten
    EU-Libanon bis zur Annahme neuer aktualisierter gemeinsamer Dokumente durch den
    Assoziationsrat zu vertreten ist
