    de Asociación creado por el Acuerdo Euromediterráneo de Asociación entre la
    Comunidad Europea y sus Estados miembros, por una parte, y la República Libanesa,
    por otra, en lo que respecta a la prórroga de la validez de las prioridades de
    la Asociación UE-Líbano hasta que el Consejo de Asociación adopte nuevos documentos
    conjuntos actualizados
  type: main
