  script: Latn
  content: Council Decision (EU) 2021/1855 of 18 October 2021 on the position to be
    taken on behalf of the European Union within the Association Council set up by
    the Euro-Mediterranean Agreement establishing an Association between the European
    Community and its Member States, of the one part, and the Republic of Lebanon,
    of the other part, as regards the extension of the validity of the EU-Lebanon
    Partnership Priorities until new updated joint documents are adopted by the Association
    Council
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1855 du Conseil du 18 octobre 2021 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    établi par l’accord euro-méditerranéen instituant une association entre la
    Communauté européenne et ses États membres, d’une part, et la République
    libanaise, d’autre part, concernant la prorogation de la validité des priorités
    du partenariat UE-Liban jusqu’à l’adoption par le Conseil d’association
    de nouveaux documents conjoints actualisés
  type: main
