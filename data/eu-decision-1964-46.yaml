    1961 à la République italienne pour le soufre, pour le sulfure de carbone et
    pour le sulfure de sodium
  type: main
- language: de
  script: Latn
  content: '64/46/EWG: Entscheidung der Kommission vom 17. Dezember 1963 betreffend
    Verlängerung und Änderung der am 27. Juli 1961 für die Italienische Republik
    genehmigten Schutzmaßnahmen bei Schwefel, Schwefelkohlenstoff und Natriumsulfid'
  type: main
- language: it
  script: Latn
  content: '64/46/CEE: Decisione della Commissione, del 17 dicembre 1963, che proroga
    e modifica le misure di salvaguardia accordate il 27 luglio 1961 alla Repubblica
    italiana per lo zolfo, per il solfuro di carbonio e per il solfuro di sodio'
  type: main
- language: nl
  script: Latn
  content: '64/46/EEG: Beschikking van de Commissie van 17 december 1963 houdende
    verlenging en wijziging van de vrijwaringsmaatregelen voor zwavel, zwavelkoolstof
    en natriumsulfide, tot de toepassing waarvan de Italiaanse Republiek op 27 juli
    1961 werd gemachtigd'
