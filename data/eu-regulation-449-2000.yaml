  content: Commission Regulation (EC) No 449/2000 of 28 February 2000 imposing a provisional
    anti-dumping duty on imports of malleable cast iron tube or pipe fittings originating
    in Brazil, the Czech Republic, Japan, the People's Republic of China, the Republic
    of Korea and Thailand and accepting an undertaking offered by an exporting producer
    in the Czech Republic
