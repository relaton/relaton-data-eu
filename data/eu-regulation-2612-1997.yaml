id: EURegulation26121997
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2612/97 of 15 December 1997 amending Regulation
    (EEC) No 1873/84 authorizing the offer or disposal for direct human consumption
    of certain imported wines which may have undergone oenological processes not provided
    for in Regulation (EEC) No 822/87
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2612/97 du Conseil du 15 décembre 1997 modifiant le
    règlement (CEE) n° 1873/84 autorisant l'offre et la livraison à la consommation
    humaine directe de certains vins importés susceptibles d'avoir fait l'objet de
    pratiques oenologiques non prévues par le règlement (CEE) n° 822/87
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2612/97 des Rates vom 15. Dezember 1997 zur Änderung
    der Verordnung (EWG) Nr. 1873/84 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten eingeführten Weinen,
    bei denen angenommen werden kann, daß sie Gegenstand von in der Verordnung (EWG)
    Nr. 822/87 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2612/97 af 15. december 1997 om ændring af
    forordning (EØF) nr. 1873/84 om tilladelse til udbud eller afsætning til direkte
    konsum af visse indførte vine, som eventuelt har været underkastet andre ønologiske
    fremgangsmåder end de i forordning (EØF) nr. 822/87 omhandlede
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2612/97 του Συμβουλίου
    της 15ης Δεκεμβρίου 1997 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 1873/84 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων εισαγομένων οίνων δυναμένων
    να αποτελέσουν το αντικείμενο οινολογικών
    πρακτικών που δεν προβλέπονται από τον κανονισμό
    (ΕΟΚ) αριθ. 822/87
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2612/97, annettu 15 päivänä joulukuuta 1997,
    sellaisilla enologisilla käytännöillä, joista ei ole säädetty asetuksessa
    (ETY) N:o 822/87, mahdollisesti käsiteltyjen tiettyjen tuontiviinien tarjoamisen
    ja toimittamisen sallimisesta nautittavaksi annetun asetuksen (ETY) N:o 1873/84
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2612/97 del Consiglio del 15 dicembre 1997 che modifica
    il regolamento (CEE) n. 1873/84 che autorizza l'offerta e la consegna per il consumo
    umano diretto di taluni vini importati che possono essere stati sottoposti a pratiche
    enologiche non previste dal regolamento (CEE) n. 822/87
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 2612/97 van de Raad van 15 december 1997 tot wijziging
    van Verordening (EEG) nr. 1873/84 houdende machtiging tot aanbieding of levering
    voor rechtstreekse menselijke consumptie van bepaalde ingevoerde wijnen waarop
    oenologische procédés kunnen zijn toegepast waarin niet is voorzien bij Verordening
    (EEG) nr. 822/87
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2612/97 do Conselho de 15 de Dezembro de 1997 que
    altera o Regulamento (CEE) nº 1873/84 que autoriza a oferta e o fornecimento
    para consumo humano directo de certos vinhos importados susceptíveis de ter sido
    objecto de práticas enológicas não previstas no Regulamento (CEE) nº 822/87
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2612/97 del Consejo de 15 de diciembre de 1997 que
    modifica el Reglamento (CEE) n° 1873/84 por el que se autoriza la oferta y la
    entrega al consumo humano directo de determinados vinos importados que pueden
    haber sido sometidos a prácticas enológicas no previstas en el Reglamento (CEE)
    n° 822/87
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2612/97 av den 15 december 1997 om ändring
    av förordning (EEG) nr 1873/84 om tillstånd att bjuda ut till försäljning
    eller avsätta för direkt konsumtion vissa importerade viner som kan ha genomgått
    andra enologiska processer än de som föreskrivs i förordning (EEG) nr 822/87
  type: main
