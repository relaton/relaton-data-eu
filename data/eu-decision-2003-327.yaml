title:
- language: en
  script: Latn
  content: '2003/327/EC: Commission Decision of 12 May 2003 on transitional measures
    under Regulation (EC) No 1774/2002 as regards the low capacity incineration or
    co-incineration plants which do not incinerate or co-incinerate specified risk
    material or carcases containing them (Text with EEA relevance) (notified under
    document number C(2003) 1501)'
  type: main
- language: fr
  script: Latn
  content: '2003/327/CE: Décision de la Commission du 12 mai 2003 portant mesures
    transitoires, en vertu du règlement (CE) n° 1774/2002, en ce qui concerne les
    usines d''incinération ou de coïncinération de faible capacité qui n''incinèrent
    ou ne coïncinèrent pas de matériels à risques spécifiés ou de carcasses
    contenant de tels matériels (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2003) 1501]'
  type: main
- language: de
  script: Latn
  content: '2003/327/EG: Entscheidung der Kommission vom 12. Mai 2003 betreffend Übergangsmaßnahmen
