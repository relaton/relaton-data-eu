    mit geringer Kapazität, in denen keine spezifizierten Risikomaterialien oder
    Schlachtkörper, die solche enthalten, verbrannt oder mitverbrannt werden (Text
    von Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2003) 1501)'
  type: main
- language: da
  script: Latn
  content: '2003/327/EF: Kommissionens beslutning af 12. maj 2003 om overgangsforanstaltninger
