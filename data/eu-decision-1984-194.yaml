  content: '84/194/EEC: Commission Decision of 22 March 1984 establishing that the
    apparatus described as ''NAC - High Speed Camera, model 16 HD'' may be imported
    free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '84/194/CEE: Décision de la Commission du 22 mars 1984 constatant que
    l''importation de l''appareil dénommé "NAC - High Speed Camera, model 16 HD"
    peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
