  content: Commission Regulation (EEC) No 3027/91 of 14 October 1991 amending the
    list annexed to Regulation (EEC) No 55/87 establishing the list of vessels exceeding
    eight metres length overall permitted to us beam trawls within certain areas of
    the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3027/91 de la Commission du 14 octobre 1991 modifiant
    la liste annexée au règlement (CEE) n° 55/87 établissant la liste des bateaux,
    dont la longueur hors tout dépasse huit mètres, autorisés à pêcher à l'aide
    de chaluts à perches dans certaines zones de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3027/91 der Kommission vom 14. Oktober 1991 zur Änderung
