  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3027/91 della Commissione del 14 ottobre 1991 recante
    modifica dell'elenco allegato al regolamento (CEE) n. 55/87 che fissa l'elenco
    dei pescherecci di lunghezza fuori tutto superiore a 8 m, autorizzati ad usare
    reti a strascico a pali in determinate zone della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3027/91 van de Commissie van 14 oktober 1991 tot
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 55/87 tot vaststelling
    van de lijst van vaartuigen met een lengte over alles van meer dan 8 meter en
    die in bepaalde zones van de Gemeenschap mogen vissen met de boomkor
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3027/91 da Comissão de 14 de Outubro de 1991 que
