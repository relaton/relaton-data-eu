    navios com mais de oito metros de comprimento de fora a fora autorizados a utilizar
    redes de arrasto de vara em determinadas zonas de Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3027/91 de la Comisión de 14 de octubre de 1991 que
