title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1178/79 of 12 June 1979 laying down for 1979
    certain interim measures for the conservation and management of fishery resources
    applicable to vessels registered in the Faroe Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1178/79 du Conseil, du 12 juin 1979, fixant, pour
    l' année 1979, certaines mesures intérimaires de conservation et de gestion
    des ressources de pêche applicables aux navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1178/79 des Rates vom 12. Juni 1979 zur Festlegung
    von Interimsmaßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für
    die auf den Färöern registrierten Schiffe für 1979
  type: main
- language: da
  script: Latn
  content: Rådets forordning EØF nr. 1178/79 af 12. juni 1979 om fastsættelse for
    1979 af visse midlertidige foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, som er registreret på Færøerne
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1178/79 del Consiglio, del 12 giugno 1979, che dispone
    per il 1979 talune misure di conservazione e di gestione delle risorse di pesca,
    da applicare alle navi immatricolate nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1178/79 van de Raad van 12 juni 1979 tot vaststelling
    voor 1979 van bepaalde tussentijdse maatregelen voor de instandhouding en het
    beheer van de visstand, van toepassing op op de Faeröer geregistreerde vaartuigen
  type: main
