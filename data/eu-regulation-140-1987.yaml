  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 140/87 della Commissione del 19 gennaio 1987 che modifica
    il regolamento (CEE) n. 1184/86 che stabilisce le modalità di applicazione del
    regime di controllo dei quantitativi di taluni prodotti del settore dei grassi
    immessi in consumo in Portogallo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 140/87 van de Commissie van 19 januari 1987 tot wijziging
