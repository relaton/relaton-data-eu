id: EURegulation621967
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement n° 62/67/CEE du Conseil, du 21 mars 1967, portant nouvelle
    prorogation du règlement n° 110/66/CEE autorisant la République italienne à
    suspendre totalement les droits de douane et les prélèvements applicables aux
    importations, en provenance des pays tiers, d'animaux vivants de l'espèce bovine,
    des espèces domestiques, autres, d'un poids unitaire n'excédant pas 300 kilogrammes,
    de la position EX 01.02 à II
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 62/67/EWG des Rates vom 21. März 1967 zur nochmaligen Verlängerung
    der Geltungsdauer der Verordnung Nr. 110/66/EWG zur Ermächtigung der Italienischen
    Republik, ihre Zollsätze und Abschöpfungen auf Einfuhren aus dritten Ländern
    von Rindern, lebend, Hausrindern, anderen, mit einem Stückgewicht von höchstens
    300 kg, der Tarifnummer ex 01.02 A II, vollständig auszusetzen
  type: main
- language: it
  script: Latn
  content: Regolamento n. 62/67/CEE del Consiglio, del 21 marzo 1967, recante nuova
    proroga del regolamento n. 110/66/CEE che autorizza la Repubblica italiana a sospendere
    totalmente i dazi doganali e i prelievi applicabili alle importazioni, in provenienza
    dai paesi terzi, di animali vivi della specie bovina, delle specie domestiche,
    altri, di peso unitario non superiore a 300 chilogrammi, della voce ex 01.02 A
    II
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 62/67/EEG van de Raad van 21 maart 1967 houdende nieuwe
    verlenging van Verordening Nr. 110/66/EEG waarbij de Italiaanse Republiek wordt
    gemachtigd de douanerechten en heffingen op de invoer uit derde landen van levende
    runderen, huisdieren, andere, die per stuk niet meer wegen dan 300 kilogram, van
    post ex 01.02 A II, volledig te schorsen
  type: main
