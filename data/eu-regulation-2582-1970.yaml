  content: Règlement (CEE) n° 2582/70 du Conseil, du 17 décembre 1970, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de 30.000 tonnes de thons, frais, réfrigérés ou congelés, entiers, décapités
    ou tronçonnés destinés à l'industrie de la conserve, de la sous-position 03.01
    B I c) du tarif douanier commun (année 1971)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2582/70 des Rates vom 17. Dezember 1970 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents von 30
    000 Tonnen für Thunfische, frisch, gekühlt oder gefroren, ganz, ohne Kopf oder
    zerteilt, für die Konservenindustrie, der Tarifstelle 03.01 B I c) 1 des Gemeinsamen
    Zolltarifs (1971)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2582/70 del Consiglio, del 17 dicembre 1970, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di 30.000 tonnellate di tonni freschi, refrigerati o congelati,
    interi, decapitati o in pezzi, destinati all'industria conserviera, della sottovoce
    03.01 B I c) 1 della tariffa doganale comune (anno 1971)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2582/70 van de Raad van 17 december 1970 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    van 30.000 ton tonijn, vers, gekoeld of bevroren, ook indien ontdaan van kop of
    in moten gesneden, bestemd voor de conservenindustrie, van onderverdeling 03.01
    B I c) 1 van het gemeenschappelijk douanetarief (1971)
