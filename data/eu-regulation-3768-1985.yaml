---
id: EURegulation37681985
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3768/85 of 20 December 1985 adapting, on account
    of the accession of Spain and Portugal, certain agricultural acts as regards the
    voting procedure of the Committees
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3768/85 du Conseil du 20 décembre 1985 portant adaptation,
    en raison de l'adhésion de l'Espagne et du Portugal, de certains actes agricoles
    en ce qui concerne la procédure de vote des comités
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3768/85 des Rates vom 20. Dezember 1985 zur Anpassung
    bestimmter Rechtsakte des Agrarsektors hinsichtlich des Abstimmungsverfahrens
    der Ausschüsse infolge des Beitritts Spaniens und Portugals
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3768/85 af 20. december 1985 om tilpasning,
    for så vidt angår forvaltningskomiteernes afstemningsprocedure, af visse retsforskrifter
    på landbrugsområdet som følge af Spaniens og Portugals tiltrædelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3768/85 του Συμβουλίου
    της 20ής Δεκεμβρίου 1985 για την προσαρμογή ορισμένων
    πράξεων του γεωργικού τομέα, όσον αφορά τη
    διαδικασία της ψηφοφορίας, λόγω της προσχώρησης
    της Ισπανίας και της Πορτογαλίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3768/85, annettu 20 päivänä joulukuuta 1985,
    tiettyjen maataloussäädösten mukauttamisesta komiteoiden äänestysmenettelyn
    osalta Espanjan ja Portugalin liittymisen vuoksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3768/85 del Consiglio del 20 dicembre 1985 che adegua,
    a seguito dell'adesione della Spagna e del Portogallo, taluni atti agricoli per
    quanto concerne la procedura di voto dei comitati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3768/85 van de Raad van 20 december 1985 houdende
    aanpassing, wat de stemprocedure van de comités betreft, van een aantal besluiten
    in de landbouwsector, in verband met de toetreding van Spanje en Portugal
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3768/85 do Conselho, de 20 de Dezembro de 1985, que
    adapta, em razão da adesão de Espanha e de Portugal, certos actos agrícolas
    no que diz respeito ao processo de votação nos comités
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3768/85 del Consejo, de 20 de diciembre de 1985, por
    el que se adaptan, como consecuencia de la adhesión de España y de Portugal,
    determinados actos agrícolas en lo que se refiere al procedimiento de votación
    de los Comités
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 3768/85 av den 20 december 1985 om ändring
    med anledning av Spaniens och Portugals anslutning av vissa rättsakter rörande
    jordbruket vad avser röstningsförfarandet i kommittéerna
  type: main
