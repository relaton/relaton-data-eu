    που εξουσιοδοτεί τα κράτη μέλη να επιτρέπουν
    προσωρινά την εμπορία δασικών φυτών προς φύτευση
    τα οποία δεν πληρούν τους όρους της οδηγίας
    66/404/ΕΟΚ του Συμβουλίου'
  type: main
