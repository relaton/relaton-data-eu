  script: Latn
  content: '89/131/EEC: Commission Decision of 1 February 1989 amending Decision 88/557/EEC
    authorizing Member States to permit temporarily the marketing of forest reproductive
    material not satisfying the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '89/131/CEE: Décision de la Commission du 1er février 1989 modifiant
    la décision 88/557/CEE autorisant les États membres à admettre temporairement
    la commercialisation de matériels forestiers de reproduction ne répondant pas
    aux exigences de la directive 66/404/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 1. Februar 1989 zur Änderung der Entscheidung
    88/557/EWG zur Ermächtigung der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut
    zum Verkehr zuzulassen, das den Anforderungen der Richtlinie 66/404/EWG des Rates
    nicht entspricht (89/131/EWG) (89/131/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 1. februar 1989 om ændring af beslutning
    88/557/EØF om bemyndigelse af medlemsstaterne til midlertidigt at tillade handel
    med forstligt formeringsmateriale, der ikke opfylder kravene i Rådets direktiv
    66/404/EØF (89/131/EØF) (89/131/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/131/ΕΟΚ: Απόφαση της Επιτροπής της 1ης Φεβρουαρίου
