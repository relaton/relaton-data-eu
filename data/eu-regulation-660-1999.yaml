    pro sklizně 1999, 2000 a 2001
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 660/1999 af 22. marts 1999 om ændring af forordning
    (EØF) nr. 2075/92 og om fastsættelse af præmier og garantitærskler for tobak
    i blade pr. sortsgruppe og pr. medlemsstat for 1999-, 2000- og 2001-høsten
  type: main
- language: el
  script: Grek
