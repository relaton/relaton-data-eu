title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 660/1999 of 22 March 1999 amending Regulation
    (EEC) No 2075/92 and fixing the premiums and guarantee thresholds for leaf tobacco
    by variety group and Member State for the 1999, 2000 and 2001 harvests
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 660/1999 du Conseil du 22 mars 1999 modifiant le règlement
    (CEE) nº 2075/92 et fixant les primes et les seuils de garantie pour le tabac
    en feuilles par groupe de variétés et par État membre pour les récoltes 1999,
    2000 et 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 660/1999 des Rates vom 22. März 1999 zur Änderung
    der Verordnung (EWG) Nr. 2075/92 und zur Festsetzung der Prämien und Garantieschwellen
    für Tabakblätter nach Sortengruppen und Mitgliedstaaten für die Ernten 1999,
    2000 und 2001
  type: main
