  content: Council Regulation (EEC) No 2999/87 of 5 October 1987 amending Regulation
    (EEC) No 4034/86 fixing, for certain fish stocks and groups of fish stocks, the
    total allowable catches for 1987 and certain conditions under which they may be
    fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2999/87 du Conseil du 5 octobre 1987 modifiant le
    règlement (CEE) n° 4034/86 fixant, pour certains stocks ou groupes de stocks
    de poissons, les totaux admissibles des captures pour 1987 et certaines conditions
    dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
