    und bestimmter Fangbedingungen hinsichtlich der zulässigen Gesamtfangmengen für
    bestimmte Fischbestände oder Bestandsgruppen für 1987
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2999/87 af 5. oktober 1987 om ændring af
    forordning (EØF) nr. 4034/86 om fastsættelse for 1987 af de samlede tilladte
    fangstmængder for visse fiskebestande og grupper af fiskebestande i Fællesskabets
    fiskerizone samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
