  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2999/87 del Consiglio del 5 ottobre 1987 recante modifica
    del regolamento (CEE) n. 4034/86 che fissa, per alcune popolazioni o gruppi di
    popolazioni ittiche, il totale delle catture ammissibile per il 1987 ed alcune
    condizioni cui è soggetta la pesca del totale delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2999/87 van de Raad van 5 oktober 1987 tot wijziging
    van Verordening (EEG) nr. 4034/86 inzake de vaststelling van de voor 1987 geldende
    totaal toegestane vangsten voor bepaalde visbestanden of groepen visbestanden
    en bepaalde bij de visserij in het kader van de totaal toegestane vangsten in
    acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2999/87 do Conselho de 5 de Outubro de 1987 que
    altera o Regulamento (CEE) n.° 4034/86, que fixa, relativamente a certas unidades
    populacionais (stocks) ou grupos de unidades populacionais de peixes, os totais
    admissíveis de capturas para 1987 e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2999/87 del Consejo de 5 de octubre de 1987 que modifica
