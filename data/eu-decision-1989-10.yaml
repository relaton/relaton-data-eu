title:
- language: en
  script: Latn
  content: '89/10/EEC: Commission Decision of 14 December 1988 on a concerted measure
    for the grant of a standby indemnity to fishermen from certain Member States of
    the Community who have had to suspend their fishing activities in waters under
    the sovereignty or jurisdiction of Morocco (only the Spanish and Portuguese texts
    are authentic)'
  type: main
- language: fr
  script: Latn
  content: '89/10/CEE: Décision de la Commission du 14 décembre 1988 relative à
    une action concertée pour l''octroi d''une indemnité d''attente destinée aux
    pêcheurs de certains États membres de la Communauté ayant dû suspendre leurs
    activités de pêche dans les eaux sous souveraineté ou juridiction du Maroc
    (Les textes en langues espagnole et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 14. Dezember 1988 über eine konzertierte
    Maßnahme für die Gewährung einer Überliegeentschädigung zugunsten von Fischern
    bestimmter Mitgliedstaaten der Gemeinschaft, die ihre Fangtätigkeit in den Gewässern
    unter der Hoheit oder der Gerichtsbarkeit Marokkos einstellen mußten (Nur der
    spanische und der portugiesische Text sind verbindlich) (89/10/EWG) (89/10/EWG)
    #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 14. december 1988 om en samordnet foranstaltning
    til ydelse af ventegodtgørelse til de fiskere i visse medlemsstater i Fællesskabet,
    der har måttet indstille deres fiskeri i farvandene under Marokkos højhedsområde
    eller jurisdiktion (Kun den spanske og den portugisiske udgave er autentisk) (89/10/EØF)
    (89/10/EØF) #'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 14ης Δεκεμβρίου
    1988 σχετικά με συντονισμένη δράση για τη χορήγηση
    αποζημίωσης " αναμονής " στους αλιείς ορισμένων
    κρατών μελών της Κοινότητας οι οποίοι αναγκάστηκαν
    να αναστείλουν τις αλιευτικές τους δραστηριότητες
    στα ύδατα που βρίσκονται υπό την κυριαρχία
    ή τη δικαιοδοσία του Μαρόκου
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 14 dicembre 1988 relativa ad un'' azione
    concertata per la concessione di un'' indennità d'' attesa destinata ai pescatori
    di alcuni Stati membri della Comunità che hanno dovuto sospendere le attività
    di pesca nelle acque soggette alla sovranità o alla giurisdizione del Marocco
    (I testi in lingua spagnola e portoghese sono i soli facenti fede) (89/10/CEE)
    (89/10/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 14 december 1988 inzake een in onderling
    overleg uit te voeren actie voor de toekenning van een wachtvergoeding ten behoeve
    van de vissers van bepaalde Lid-Staten van de Gemeenschap die hun visserijactiviteit
    in de wateren onder de soevereiniteit of de jurisdictie van Marokko hebben moeten
    stopzetten (Slechts de teksten in de Spaanse en de Portugese taal zijn authentiek)
    (89/10/EEG) (89/10/EEG) #'
  type: main
