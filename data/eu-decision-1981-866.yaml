    per la televisione a colori, originari del Giappone e di Taiwan (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/866/EEG: Beschikking van de Commissie van 17 juli 1981 houdende machtiging
