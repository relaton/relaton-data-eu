title:
- language: en
  script: Latn
  content: '81/866/EEC: Commission Decision of 17 July 1981 authorizing the French
    Republic not to apply Community treatment to colour television sets originating
    in Japan and Taiwan (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/866/CEE: Décision de la Commission, du 17 juillet 1981, autorisant
    la République française à exclure du traitement communautaire les récepteurs
    de télévision en couleurs originaires du Japon et de T''ai-wan (Le texte en
    langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/866/EWG: Entscheidung der Kommission vom 17. Juli 1981 zur Ermächtigung
    der Französischen Republik, aus Japan und Taiwan stammende Farbfernsehempfangsgeräte
    von der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/866/EØF: Kommissionens beslutning af 17. juli 1981 om bemyndigelse
    til Den franske Republik til fra fællesskabsbehandling at undtage farvefjernsynsmodtagere
    med oprindelse i Japan og Taiwan (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/866/EOK: Απόφαση τής Επιτροπής τής 17ης Ιουλίου
