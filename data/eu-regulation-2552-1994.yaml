title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2552/94 of 20 October 1994 determining the
    extent to which applications lodged in October 1994 for import licences for certain
    pigmeat products under the regime provided for by the Intermediate Agreements
    concluded by the Community with Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2552/94 de la Commission, du 20 octobre 1994, déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1994 pour certains produits à base de viande de porc dans le cadre du
    régime prévu par les accords intérimaires conclus par la Communauté avec la
    Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2552/94 der Kommission vom 20. Oktober 1994 über die
    Festsetzung des Umfangs, in dem die im Oktober 1994 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Interimsabkommen
    zwischen der Gemeinschaft und Bulgarien sowie Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2552/94 af 20. oktober 1994 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1994 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de interimsaftaler, som Fællesskabet har indgået med Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2552/94 της Επιτροπής
    της 20ής Οκτωβρίου 1994 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Οκτώβριο του
    1994 για άδειες εισαγωγής χοιρείου κρέατος βάσει
    του καθεστώτος που προβλέπεται από τις ενδιάμεσες
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2552/94 della Commissione, del 20 ottobre 1994, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1994 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dagli accordi intermedi conclusi tra la Comunità
    e la Bulgaria e la Romania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2552/94 van de Commissie van 20 oktober 1994 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector varkensvlees, die in oktober 1994 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Interimovereenkomsten met Bulgarije en Roemenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2552/94 da Comissão, de 20 de Outubro de 1994, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Outubro
    de 1994 ao abrigo do regime previsto nos acordos provisórios concluídos pela
    Comunidade com a Bulgária e a Roménia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 2552/94 de la Comisión, de 20 de octubre de 1994, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de la carne de porcino presentadas
    en el mes de octubre de 1994, al amparo del régimen previsto en los Acuerdos
    interinos celebrados entre la Comunidad y Bulgaria y Rumanía
  type: main
