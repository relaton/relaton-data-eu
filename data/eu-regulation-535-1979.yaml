id: EURegulation5351979
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 535/79 of 21 March 1979 temporarily suspending
    Regulation (EEC) No 2900/77 laying down detailed rules for the sale of beef held
    by the intervention agencies to enable the import with total suspension of the
    levy of frozen beef and veal intended for processing, and also certain provisions
    of Regulation (EEC) No 571/78
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 535/79 de la Commission, du 21 mars 1979, portant
    suspension temporaire du règlement (CEE) n° 2900/77 portant modalités de la
    vente de viandes bovines détenues par les organismes d' intervention, afin de
    permettre l' importation, en suspension totale du prélèvement, de viandes bovines
    congelées destinées à la transformation, et de certaines modalités du règlement
    (CEE) n° 571/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 535/79 der Kommission vom 21. März 1979 zur zeitweiligen
    Aussetzung der Anwendung der Verordnung (EWG) Nr. 2900/77 über die Modalitäten
    für den Verkauf von Rindfleisch aus Beständen der Interventionsstellen zur Ermöglichung
    der Einfuhr von zur Verarbeitung bestimmtem gefrorenem Rindfleisch mit vollständiger
    Aussetzung der Abschöpfung sowie von Durchführungsbestimmungen zur Verordnung
    (EWG) Nr. 571/78
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 535/79 af 21. marts 1979 om midlertidig
    suspension af forordning (EØF) nr. 2900/77 om gennemførelsesbestemmelser for
    salg af oksekød, som interventionsorganerne ligger inde med, med henblik på
    at tillade indførsel af frosset oksekød til forarbejdning med fuld suspension
    af importafgifter, samt af visse bestemmelser i forordning (EØF) nr. 571/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 535/79 della Commissione, del 21 marzo 1979, recante
    sospensione temporanea del regolamento (CEE) n. 2900/77 recante modalità per
    la vendita di carni bovine detenute dagli organismi d' intervento onde consentire
    l' importazione, con sospensione totale del prelievo, di carni bovine congelate
    destinate alla trasformazione, e di talune modalità del regolamento (CEE) n.
    571/78
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 535/79 van de Commissie van 21 maart 1979 houdende
    tijdelijke schorsing van Verordening (EEG) nr. 2900/77 houdende bepalingen betreffende
    de verkoop van rundvlees dat in het bezit is van de interventiebureaus, ten einde
    de invoer, met totale schorsing van de heffing, van bevroren rundvlees bestemd
    voor de verwerking mogelijk te maken en van sommige bepalingen van Verordening
    (EEG) nr. 571/78
  type: main
