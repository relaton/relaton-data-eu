---
id: EURegulation4412013
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 441/2013 of 7 May 2013 amending
    or repealing certain regulations on the classification of goods in the Combined
    Nomenclature
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 441/2013 de la Commission du 7 mai
    2013 modifiant ou abrogeant certains règlements relatifs au classement de marchandises
    dans la nomenclature combinée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 441/2013 der Kommission vom 7. Mai 2013
    zur Änderung oder Aufhebung bestimmter Verordnungen zur Einreihung von Waren
    in die Kombinierte Nomenklatur
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 441/2013 на Комисията
    от 7 май 2013 година за изменение или отмяна на
    някои регламенти относно класирането на стоки
    в Комбинираната номенклатура
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 441/2013 ze dne 7. května 2013
    , kterým se mění nebo zrušují některá nařízení o zařazení zboží
    do kombinované nomenklatury
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 441/2013 af 7. maj 2013
    om ændring eller ophævelse af visse forordninger om tarifering af varer i den
    kombinerede nomenklatur
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 441/2013
    της Επιτροπής, της 7ης Μαΐου 2013 , για την τροποποίηση
    ή την κατάργηση ορισμένων κανονισμών για την
    κατάταξη εμπορευμάτων στη Συνδυασμένη Ονοματολογία
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 441/2013, 7. mai 2013 , millega muudetakse
    või tunnistatakse kehtetuks teatavad määrused kaupade klassifitseerimise kohta
    kombineeritud nomenklatuuris
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 441/2013, annettu 7 päivänä
    toukokuuta 2013 , tavaroiden luokittelusta yhdistettyyn nimikkeistöön annettujen
    tiettyjen asetusten muuttamisesta tai kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 441/2013 od 7. svibnja 2013. o izmjeni
    ili o stavljanju izvan snage određenih uredaba o razvrstavanju robe u kombiniranu
    nomenklaturu
  type: main
- language: hu
  script: Latn
  content: A Bizottság 441/2013/EU végrehajtási rendelete ( 2013. május 7. ) az
    áruk Kombinált Nómenklatúra szerinti besorolásáról szóló egyes rendeletek
    módosításáról, illetve hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 441/2013 della Commissione, del 7 maggio
    2013 , che modifica o abroga alcuni regolamenti relativi alla classificazione
    delle merci nella nomenclatura combinata
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 441/2013 ( 2013. gada 7. maijs
    ), ar ko groza vai atceļ dažas regulas par preču klasifikāciju kombinētajā
    nomenklatūrā
  type: main
- language: lt
  script: Latn
  content: 2013 m. gegužės 7 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 441/2013,
    kuriuo iš dalies keičiami arba panaikinami tam tikri reglamentai dėl prekių
    klasifikavimo Kombinuotojoje nomenklatūroje
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 441/2013 tas-
    7 ta’ Mejju 2013 li jemenda jew iħassar ċertu regolamenti dwar il-klassifikazzjoni
    tal-oġġetti fin-Nomenklatura Magħquda
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 441/2013 van de Commissie van 7 mei 2013
    tot wijziging of intrekking van bepaalde verordeningen betreffende de indeling
    van goederen in de gecombineerde nomenclatuur
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 441/2013 z dnia 7 maja 2013
    r. zmieniające lub uchylające niektóre rozporządzenia dotyczące klasyfikacji
    towarów według Nomenklatury scalonej
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 441/2013 da Comissão, de 7 de maio
    de 2013 , que altera ou revoga certos regulamentos relativos à classificação
    de mercadorias na Nomenclatura Combinada
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 441/2013 al Comisiei din 7
    mai 2013 de modificare sau de abrogare a anumitor regulamente privind clasificarea
    mărfurilor în Nomenclatura combinată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 441/2013 zo 7. mája 2013 , ktorým
    sa menia alebo zrušujú určité nariadenia o zatrieďovaní tovaru do kombinovanej
    nomenklatúry
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 441/2013 z dne 7. maja 2013 o spremembi
    ali razveljavitvi nekaterih uredb o uvrstitvi blaga v kombinirano nomenklaturo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 441/2013 de la Comisión, de 7 de mayo
    de 2013 , por el que se modifican o derogan determinados reglamentos relativos
    a la clasificación de las mercancías en la nomenclatura combinada
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 441/2013 av den 7 maj 2013
    om ändring eller upphävande av vissa förordningar om klassificering av varor
    i Kombinerade nomenklaturen
  type: main
