title:
- language: en
  script: Latn
  content: '2000/202/EC: Council Decision of 14 February 2000 on the conclusion of
    an Agreement in the form of an Exchange of Letters between the European Community
    and Ukraine extending the double-checking system without quantitative limits in
    respect of the export of certain steel products covered by the EC an ECSC Treaties
    from Ukraine to the European Community for the period from 1 January 2000 to 31
    December 2001'
  type: main
- language: fr
  script: Latn
  content: '2000/202/CE: Décision du Conseil, du 14 février 2000, relative à la
    conclusion d''un accord sous forme d''échange de lettres entre la Communauté
    européenne et l''Ukraine prorogeant pour la période du 1er janvier 2000 au 31
    décembre 2001 le système de double contrôle sans limite quantitative à l''exportation
    de certains produits sidérurgiques couverts par les traités CE et CECA de l''Ukraine
    dans la Communauté européenne'
  type: main
- language: de
  script: Latn
  content: '2000/202/EG: Beschluß des Rates vom 14. Februar 2000 über den Abschluß
    des Abkommens in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft
    und der Ukraine zur Verlängerung des Systems der doppelten Kontrolle ohne Höchstmengen
    für die Ausfuhr bestimmter unter den EG- und den EGKS-Vertrag fallender Eisen-
    und Stahlerzeugnisse aus der Ukraine in die Europäische Gemeinschaft für den
    Zeitraum vom 1. Januar 2000 bis zum 31. Dezember 2001'
  type: main
- language: da
  script: Latn
  content: '2000/202/EF: Rådets afgørelse af 14. februar 2000 om indgåelse af aftalen
    i form af brevveksling mellem Det Europæiske Fællesskab og Ukraine om forlængelse
    af ordningen med dobbeltkontrol uden kvantitative lofter i forbindelse med udførsel
    fra Ukraine til Det Europæiske Fællesskab af visse stålprodukter, der er omfattet
    af EF- og EKSF-traktaterne, for perioden 1. januar 2000 til 31. december 2001'
  type: main
- language: el
  script: Grek
  content: '2000/202/ΕΚ: Απόφαση του Συμβουλίου, της 14ης
    Φεβρουαρίου 2000, για τη σύναψη συμφωνίας υπό
    μορφήν ανταλλαγής επιστολών μεταξύ της Ευρωπαϊκής
    Κοινότητας και της Ουκρανίας για την παράταση
    ισχύος του συστήματος διπλού ελέγχου χωρίς
    ποσοτικά όρια όσον αφορά την εξαγωγή ορισμένων
    προϊόντων χάλυβα, καλυπτόμενων από τις συνθήκες
    ΕΚ και ΕΚΑΧ, από την Ουκρανία προς την Ευρωπαϊκή
    Κοινότητα, για το χρονικό διάστημα από την
    1η Ιανουαρίου 2000 έως τις 31 Δεκεμβρίου 2001'
  type: main
- language: fi
  script: Latn
  content: '2000/202/EY: Neuvoston päätös, tehty 14 päivänä helmikuuta 2000,
    Euroopan yhteisön ja Ukrainan sopimuksen tekemisestä kirjeenvaihtona tiettyjen
    Euroopan yhteisön ja Euroopan hiili- ja teräsyhteisön perustamissopimusten
    alaan kuuluvien terästuotteiden vientiä Ukrainasta Euroopan yhteisöön koskevan
    ilman määrällisiä rajoituksia olevan kaksinkertaisen tarkkailun järjestelmän
    soveltamisen jatkamisesta 1 päivästä tammikuuta 2000 aina 31 päivään joulukuuta
    2001'
  type: main
- language: it
  script: Latn
  content: '2000/202/CE: Decisione del Consiglio, del 14 febbraio 2000, relativa alla
    conclusione di un accordo in forma di scambio di lettere tra la Comunità europea
    e l''Ucraina che proroga per il periodo compreso tra il 1o gennaio 2000 e il 31
    dicembre 2001 il sistema di duplice controllo senza limiti quantitativi per le
    esportazioni di taluni prodotti di acciaio contemplati dai trattati CE e CECA
    dall''Ucraina nella Comunità europea'
  type: main
- language: nl
  script: Latn
  content: '2000/202/EG: Besluit van de Raad van 14 februari 2000 betreffende de sluiting
    van een Overeenkomst in de vorm van een briefwisseling tussen de Europese Gemeenschap
    en Oekraïne tot verlenging van het systeem voor dubbele controle zonder kwantitatieve
    beperkingen voor de uitvoer van bepaalde onder het EG-Verdrag en het EGKS-Verdrag
    vallende ijzer- en staalproducten uit Oekraïne naar de Europese Gemeenschap voor
    de periode van 1 januari 2000 tot en met 31 december 2001'
  type: main
- language: pt
  script: Latn
  content: '2000/202/CE: Decisão do Conselho, de 14 de Fevereiro de 2000, relativa
    à celebração de um Acordo sob forma de troca de cartas entre a Comunidade Europeia
    e a Ucrânia que prorroga o sistema de duplo controlo sem limites quantitativos
    aplicável à exportação de certos produtos siderúrgicos abrangidos pelos Tratados
    CECA e CE da Ucrânia para a Comunidade Europeia durante o período compreendido
    entre 1 de Janeiro de 2000 e 31 de Dezembro de 2001'
  type: main
- language: es
  script: Latn
  content: '2000/202/CE: Decisión del Consejo, de 14 de febrero de 2000, relativa
    a la celebración de un Acuerdo en forma de Canje de Notas entre la Comunidad
    Europea y Ucrania por el que se prorroga el sistema de doble control sin límites
    cuantitativos con respecto a las exportaciones de determinados productos siderúrgicos
    incluidos en los Tratados CE y CECA de Ucrania a la Comunidad Europea en el período
    comprendido entre el 1 de enero de 2000 y del 31 de diciembre de 2001'
  type: main
- language: sv
  script: Latn
  content: '2000/202/EG: Rådets beslut av den 14 februari 2000 om att ingå ett avtal
    genom skriftväxling mellan Europeiska gemenskapen och Ukraina om förlängning
    av giltighetstiden för dubbelkontrollsystemet utan kvantitativa begränsningar
    med avseende på export från Ukraina till Europeiska gemenskapen av vissa stålprodukter
    som omfattas av EG- och EKSG-fördragen till att omfatta perioden 1 januari 2000-31
    december 2001'
