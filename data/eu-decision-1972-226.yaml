title:
- language: fr
  script: Latn
  content: '72/226/CEE: Décision de la Commission, du 25 mai 1972, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les gants de protection pour tous métiers,
    en cuir naturel, artificiel ou reconstitué, de la position 42.03 B I du Tarif
    douanier commun, originaires de la République populaire de Chine et mis en libre
    pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '72/226/EWG: Entscheidung der Kommission vom 25. Mai 1972, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Schutzhandschuhe für alle Berufe,
    aus Leder oder Kunstleder, der Tarifnummer 42.03 B I des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/226/CEE: Decisione della Commissione, del 25 maggio 1972, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario i guanti di protezione per qualunque
    mestiere della voce n. 42.03 B I della tariffa doganale comune, originari della
    Repubblica popolare cinese e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/226/EEG: Beschikking van de Commissie van 25 mei 1972 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd werkhandschoenen van leder of van kunstleder van post 42.03 B I van
    het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek China
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
