  script: Latn
  content: Commission Regulation (EC) No 1027/97 of 6 June 1997 determining, for the
    1997 marketing year, the estimated loss of income and the estimated level of the
    premium payable per ewe and per female goat and fixing the first advance payment
    for this premium and an advance payment of the specific aid for sheep and goat
    farming in certain less favoured areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1027/97 de la Commission du 6 juin 1997 déterminant,
