id: EUDecision2014691
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2014/691/EU: Council Decision of 29 September 2014 amending Decision 2014/668/EU
    on the signing, on behalf of the European Union, and provisional application of
    the Association Agreement between the European Union and the European Atomic Energy
    Community and their Member States, of the one part, and Ukraine, of the other
    part, as regards Title III (with the exception of the provisions relating to the
    treatment of third-country nationals legally employed as workers in the territory
    of the other Party) and Titles IV, V, VI and VII thereof, as well as the related
    Annexes and Protocols'
  type: main
- language: fr
  script: Latn
  content: '2014/691/UE: Décision du Conseil du 29 septembre 2014 modifiant la décision
    2014/668/UE relative à la signature, au nom de l''Union européenne, et à l''application
    provisoire de l''accord d''association entre l''Union européenne et la Communauté
    européenne de l''énergie atomique et leurs États membres, d''une part, et l''Ukraine,
    d''autre part, en ce qui concerne son titre III (à l''exclusion des dispositions
    relatives au traitement des ressortissants des pays tiers employés légalement
    sur le territoire de l''autre partie) et ses titres IV, V, VI et VII, ainsi que
    les annexes et protocoles correspondants'
  type: main
- language: de
  script: Latn
  content: '2014/691/EU: Beschluss des Rates vom 29. September 2014 zur Änderung
    des Beschlusses 2014/668/EU über die Unterzeichnung — im Namen der Europäischen
    Union — und die vorläufige Anwendung des Assoziierungsabkommens zwischen der
    Europäischen Union, der Europäischen Atomgemeinschaft und ihren Mitgliedstaaten
    einerseits und der Ukraine andererseits hinsichtlich des Titels III (mit Ausnahme
    der Bestimmungen über die Behandlung von Drittstaatsangehörigen, die als Arbeitnehmer
    im Hoheitsgebiet der anderen Vertragspartei legal beschäftigt sind) und der Titel
    IV, V, VI und VII des Abkommens sowie der diesbezüglichen Anhänge und Protokolle'
  type: main
- language: bg
  script: Cyrl
  content: '2014/691/ЕС: Решение на Съвета от 29 септември
    2014 година за изменение на Решение 2014/668/ЕС за
    подписване, от името на Европейския съюз, и
    временно прилагане на Споразумението за асоцииране
    между Европейския съюз и Европейската общност
    за атомна енергия и техните държави-членки,
    от една страна, и Украйна, от друга страна, по
    отношение на дял III (с изключение на разпоредбите
    относно третирането на граждани на трети държави,
    които са законно наети като работници на територията
    на другата страна) и дялове IV, V, VI и VII от него,
    както и на свързаните приложения и протоколи'
  type: main
- language: cs
  script: Latn
  content: '2014/691/EU: Rozhodnutí Rady ze dne 29. září 2014 o změně rozhodnutí
    2014/668/EU o podpisu jménem Evropské unie a prozatímním provádění Dohody
    o přidružení mezi Evropskou unií a Evropským společenstvím pro atomovou
    energii a jejich členskými státy na jedné straně a Ukrajinou na straně druhé,
    pokud jde o hlavu III (s výjimkou ustanovení o zacházení s pracovníky, kteří
    jsou státními příslušníky třetích zemí a jsou legálně zaměstnáni
    na území druhé strany) a hlavy IV, V, VI a VII dohody a související přílohy
    a protokoly'
  type: main
- language: da
  script: Latn
  content: '2014/691/EU: Rådets afgørelse af 29. september 2014 om ændring af afgørelse
    2014/668/EU om undertegnelse på Den Europæiske Unions vegne og midlertidig anvendelse
    af associeringsaftalen mellem Den Europæiske Union og Det Europæiske Atomenergifælleskab
    og deres medlemsstater på den ene side og Ukraine på den anden side, for så
    vidt angår afsnit III (med undtagelse af de bestemmelser, der vedrører behandling
    af tredjelandsstatsborgere, der er lovligt beskæftigede arbejdstagere på den
    anden parts område) og afsnit IV, V, VI og VII deri samt de tilhørende bilag
    og protokoller'
  type: main
- language: el
  script: Grek
  content: '2014/691/EΕ: Απόφαση του Συμβουλίου, της 29ης
    Σεπτεμβρίου 2014 , για την τροποποίηση της απόφασης
    2014/668/ΕΕ για την υπογραφή, εξ ονόματος της Ευρωπαϊκής
    Ένωσης, και την προσωρινή εφαρμογή της συμφωνίας
    σύνδεσης μεταξύ της Ευρωπαϊκής Ένωσης και
    της Ευρωπαϊκής Κοινότητας Ατομικής Ενέργειας
    και των κρατών μελών τους, αφενός, και της Ουκρανίας,
    αφετέρου, όσον αφορά τον τίτλο III (με την εξαίρεση
    των διατάξεων που αφορούν τη μεταχείριση των
    υπηκόων τρίτων χωρών που απασχολούνται νόμιμα
    ως εργαζόμενοι στο έδαφος του άλλου μέρους)
    και τους τίτλους IV, V, VI και VII, καθώς και τα συναφή
    παραρτήματα και πρωτόκολλα'
  type: main
- language: et
  script: Latn
  content: '2014/691/EL: Nõukogu otsus, 29. september 2014 , millega muudetakse otsust
    2014/668/EL ühelt poolt Euroopa Liidu ja Euroopa Aatomienergiaühenduse ning
    nende liikmesriikide ja teiselt poolt Ukraina vahelise assotsieerimislepingu Euroopa
    Liidu nimel allkirjastamise ja ajutise kohaldamise kohta selle III jaotise (välja
    arvatud sätted teise lepinguosalise territooriumil seaduslikult töötavate kolmandate
    riikide kodanike kohtlemise kohta) ning IV, V, VI ja VII jaotise ning seotud lisade
    ja protokollide osas'
  type: main
- language: fi
  script: Latn
  content: '2014/691/EU: Neuvoston päätös, annettu 29 päivänä syyskuuta 2014
    , Euroopan unionin ja Euroopan atomienergiayhteisön ja niiden jäsenvaltioiden
    sekä Ukrainan välisen assosiaatiosopimuksen allekirjoittamisesta Euroopan unionin
    puolesta III osaston (lukuun ottamatta määräyksiä, jotka liittyvät työntekijöinä
    toisen osapuolen alueella laillisesti työskentelevien kolmansien maiden kansalaisten
    kohteluun) ja IV, V, VI ja VII osaston sekä niitä koskevien liitteiden ja pöytäkirjojen
    osalta, ja sopimuksen väliaikaisesta soveltamisesta annetun päätöksen 2014/668/EU
    muuttamisesta'
  type: main
- language: hr
  script: Latn
  content: '2014/691/EU: Odluka Vijeća od 29. rujna 2014. o izmjeni Odluke 2014/668/EU
    o potpisivanju, u ime Europske unije, i privremenoj primjeni Sporazuma o pridruživanju
    između Europske unije i Europske zajednice za atomsku energiju te njihovih država
    članica, s jedne strane, i Ukrajine, s druge strane, u pogledu glave III. (uz
    iznimku odredbi koje se odnose na postupanje prema državljanima trećih zemalja
    koji su zakonito zaposleni kao radnici na državnom području druge stranke) i
    glava IV., V., VI. i VII. Sporazuma, kao i povezanih priloga i protokola'
  type: main
- language: hu
  script: Latn
  content: '2014/691/EU: A Tanács határozata ( 2014. szeptember 29. ) az egyrészről
    az Európai Unió, az Európai Atomenergia-közösség és tagállamaik, másrészről
    Ukrajna közötti társulási megállapodásnak a megállapodás III. címe (a
    harmadik országoknak a másik fél területén jogszerűen, munkavállalóként
    foglalkoztatott állampolgáraival kapcsolatos bánásmódra vonatkozó rendelkezések
    kivételével), valamint IV., V., VI. és VII. címe és a vonatkozó mellékletek
    és jegyzőkönyvek tekintetében az Európai Unió nevében történő aláírásáról
    és ideiglenes alkalmazásáról szóló 2014/668/EU határozat módosításáról'
  type: main
- language: it
  script: Latn
  content: '2014/691/UE: Decisione del Consiglio, del 29 settembre 2014 , che modifica
    la decisione 2014/668/UE relativa alla firma, a nome dell''Unione europea, e all''applicazione
    provvisoria dell''accordo di associazione tra l''Unione europea e la Comunità
    europea dell''energia atomica e i loro Stati membri, da una parte, e l''Ucraina,
    dall''altra, per quanto riguarda il titolo III (fatta eccezione per le disposizioni
    relative al trattamento di cittadini di paesi terzi legalmente assunti come lavoratori
    subordinati nel territorio dell''altra parte) e i titoli IV, V, VI e VII dello
    stesso, nonché i relativi allegati e protocolli'
  type: main
- language: lv
  script: Latn
  content: '2014/691/ES: Padomes Lēmums ( 2014. gada 29. septembris ), ar ko groza
    Lēmumu 2014/668/ES par to, lai Eiropas Savienības vārdā parakstītu un provizoriski
    piemērotu Asociācijas nolīgumu starp Eiropas Savienību un Eiropas Atomenerģijas
    kopienu un to dalībvalstīm, no vienas puses, un Ukrainu, no otras puses, attiecībā
    uz tā III sadaļu (izņemot noteikumus par attieksmi pret trešo valstu valstspiederīgajiem,
    kas kā darba ņēmēji likumīgi nodarbināti otras Puses teritorijā) un IV,
    V, VI un VII sadaļu, kā arī saistītajiem pielikumiem un protokoliem'
  type: main
- language: lt
  script: Latn
  content: '2014/691/ES: 2014 m. rugsėjo 29 d. Tarybos sprendimas, kuriuo iš dalies
    keičiamas Sprendimas 2014/668/ES dėl Europos Sąjungos, Europos atominės energijos
    bendrijos bei jų valstybių narių ir Ukrainos asociacijos susitarimo pasirašymo
    Europos Sąjungos vardu ir laikino taikymo, kiek tai susiję su jo III antraštine
    dalimi (išskyrus nuostatas dėl vienodo požiūrio į kitos Šalies teritorijoje
    teisėtai dirbančius trečiųjų šalių piliečius), IV, V, VI bei VII antraštinėmis
    dalimis ir susijusiais priedais bei protokolais'
  type: main
- language: mt
  script: Latn
  content: '2014/691/UE: Deċiżjoni tal-Kunsill tad- 29 ta'' Settembru 2014 li temenda
    d-Deċiżjoni 2014/668/UE dwar l-iffirmar f''isem l-Unjoni Ewropea, u l-applikazzjoni
    proviżorja tal-Ftehim ta'' Assoċjazzjoni bejn l-Unjoni Ewropea u l-Komunità
    Ewropea dwar l-Enerġija Atomika u l-Istati Membri tagħhom, minn naħa, u l-Ukraina
    min-naħa l-oħra, fir-rigward tat-Titolu III (bl-eċċezzjoni tad-dispożizzjonijiet
    relatati mat-trattament ta'' ċittadini ta'' pajjiżi terzi legalment impjegati
    bħala ħaddiema fit-territorju tal-Parti l-oħra) u t-Titoli IV, V, VI u VII
    tagħha, kif ukoll l-Annessi u l-Protokolli relatati'
  type: main
- language: nl
  script: Latn
  content: '2014/691/EU: Besluit van de Raad van 29 september 2014 tot wijziging van
    Besluit 2014/668/EU van de Raad inzake de ondertekening, namens de Europese Unie,
    en de voorlopige toepassing van de Associatieovereenkomst tussen de Europese Unie
    en de Europese Gemeenschap voor Atoomenergie en hun lidstaten, enerzijds, en Oekraïne,
    anderzijds, met betrekking tot titel III (met uitzondering van de bepalingen betreffende
    de behandeling van onderdanen van derde landen die legaal als werknemer op het
    grondgebied van de andere partij verblijven), en de titels IV, V, VI en VII, alsmede
    de bijbehorende bijlagen en protocollen'
  type: main
- language: pl
  script: Latn
  content: '2014/691/UE: Decyzja Rady z dnia 29 września 2014 r. zmieniająca decyzję
    2014/668/UE w sprawie podpisania, w imieniu Unii Europejskiej, oraz tymczasowego
    stosowania Układu o stowarzyszeniu między Unią Europejską i Europejską Wspólnotą
    Energii Atomowej oraz ich państwami członkowskimi, z jednej strony, a Ukrainą,
    z drugiej strony, w odniesieniu do jego tytułu III (z wyjątkiem postanowień
    dotyczących traktowania pracowników będących obywatelami państw trzecich
    legalnie zatrudnionych na terytorium drugiej Strony) oraz tytułów IV, V, VI
    i VII, jak również powiązanych załączników i protokołów'
  type: main
- language: pt
  script: Latn
  content: '2014/691/UE: Decisão do Conselho, de 29 de setembro de 2014 , que altera
    a Decisão 2014/668/UE relativa à assinatura, em nome da União Europeia, e à
    aplicação provisória do Acordo de Associação entre a União Europeia e a
    Comunidade Europeia da Energia Atómica e os seus Estados-Membros, por um lado,
    e a Ucrânia, por outro, no que respeita ao Título III (com exceção das disposições
    relativas ao tratamento concedido aos nacionais de países terceiros legalmente
    empregados no território da outra Parte) e aos Títulos IV, V, VI e VII, bem
    como aos anexos e protocolos correspondentes'
  type: main
- language: ro
  script: Latn
  content: '2014/691/UE: Decizia Consiliului din 29 septembrie 2014 de modificare
    a Deciziei 2014/668/UE privind semnarea, în numele Uniunii Europene, și aplicarea
    cu titlu provizoriu a Acordului de asociere dintre Uniunea Europeană și Comunitatea
    Europeană a Energiei Atomice și statele membre ale acestora, pe de o parte,
    și Ucraina, pe de altă parte, în ceea ce privește titlul III (cu excepția
    dispozițiilor referitoare la tratamentul aplicat resortisanților țărilor terțe
    care lucrează cu forme legale pe teritoriul celeilalte părți) și titlurile
    IV, V, VI și VII din acord, precum și a anexelor și protocoalelor aferente'
  type: main
- language: sk
  script: Latn
  content: '2014/691/EÚ: Rozhodnutie Rady z 29. septembra 2014 , ktorým sa mení
    rozhodnutie 2014/668/EÚ o podpise v mene Európskej únie a predbežnom vykonávaní
    Dohody o pridružení medzi Európskou úniou a Európskym spoločenstvom pre
    atómovú energiu a ich členskými štátmi na jednej strane a Ukrajinou na strane
    druhej, pokiaľ ide o jej hlavu III (okrem ustanovení týkajúcich sa zaobchádzania
    so štátnymi príslušníkmi tretích krajín, ktorí sú na území druhej zmluvnej
    strany legálne zamestnaní ako pracovníci) a hlavy IV, V, VI a VII, ako aj súvisiace
    prílohy a protokoly'
  type: main
- language: sl
  script: Latn
  content: '2014/691/EU: Sklep Sveta z dne 29. septembra 2014 o spremembi Sklepa 2014/668/EU
    o podpisu Sporazuma o pridružitvi med Evropsko unijo in Evropsko skupnostjo za
    atomsko energijo in njunimi državami članicami na eni strani ter Ukrajino na
    drugi strani, v imenu Evropske unije in o njegovi začasni uporabi, kar zadeva
    naslov III (razen določb v zvezi z obravnavo državljanov tretjih držav, ki
    so zakonito zaposleni kot delavci na ozemlju druge pogodbenice) ter naslove IV,
    V, VI in VII Sporazuma ter z njim povezanih prilog in protokolov'
  type: main
- language: es
  script: Latn
  content: '2014/691/UE: Decisión del Consejo, de 29 de septiembre de 2014 , por
    la que se modifica la Decisión 2014/668/UE relativa a la firma, en nombre de
    la Unión Europea, y a la aplicación provisional del Acuerdo de Asociación entre
    la Unión Europea y la Comunidad Europea de la Energía Atómica y sus Estados
    miembros, por una parte, y Ucrania, por otra, en lo que se refiere al título
    III (con excepción de las disposiciones relativas al tratamiento de los nacionales
    de terceros países legalmente empleados como trabajadores en el territorio de
    la otra Parte) y títulos IV, V, VI y VII del mismo, así como los anexos y Protocolos
    conexos'
  type: main
- language: sv
  script: Latn
  content: '2014/691/EU: Rådets beslut av den 29 september 2014 om ändring av beslut
    2014/668/EU om undertecknande på Europeiska unionens vägnar och om provisorisk
    tillämpning av associeringsavtalet mellan Europeiska unionen och Europeiska atomenergigemenskapen
    och deras medlemsstater, å ena sidan, och Ukraina, å andra sidan, vad gäller
    avdelning III (med undantag för bestämmelserna om behandling av arbetstagare
    som är tredjelandsmedborgare och lagligen anställda på den andra partens territorium)
    och avdelningarna IV, V, VI och VII i avtalet, samt därtill hörande bilagor
    och protokoll'
