title:
- language: en
  script: Latn
  content: '94/392/EC: Council Decision of 27 June 1994 approving the Agreement in
    the form of an Exchange of Letters between the European Community and Romania
    amending the Interim Agreement on trade and trade-related matters between the
    European Economic Community and the European Coal and Steel Community, of the
    one part, and Romania, of the other part, and the Europe Agreement establishing
    an association between the European Communities and their Member States, of the
    one part, and Romania, of the other part, both as amended by the Additional Protocol
    signed on 21 December 1993'
  type: main
- language: fr
  script: Latn
  content: '94/392/CE: Décision du Conseil du 27 juin 1994 approuvant l''accord sous
    forme d''échange de lettres entre la Communauté européenne et la Roumanie modifiant
    l''accord intérimaire pour le commerce et les mesures d''accompagnement entre
    la Communauté économique européenne et la Communauté européenne du charbon
    et de l''acier, d''une part, et la Roumanie, d''autre part, ainsi que l''accord
    européen établissant une association entre les Communautés européennes et
    leurs États membres, d''une part, et la Roumanie, d''autre part, dans leur version
    modifiée par le protocole additionnel signé le 21 décembre 1993'
  type: main
- language: de
  script: Latn
  content: '94/392/EG: BESCHLUSS DES RATES vom 27. Juni 1994 zur Genehmigung des Abkommens
    in Form eines Briefwechsels zwischen der Europäischen Gemeinschaft und Rumänien
    zur Änderung des Interimsabkommens über Handel und Handelsfragen zwischen der
    Europäischen Wirtschaftsgemeinschaft und der Europäischen Gemeinschaft für
    Kohle und Stahl einerseits und Rumänien andererseits und zur Änderung des Europaabkommens
    zwischen den Europäischen Gemeinschaften und ihren Mitgliedstaaten einerseits
    und Rumänien andererseits, in der jeweils durch das am 21. Dezember 1993 unterzeichnete
    Zusatzprotokoll geänderten Fassung'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 27. června 1994 o schválení dohody ve formě
    výměny dopisů mezi Evropským společenstvím a Rumunskem, kterou se mění
    Prozatímní dohoda o obchodu a obchodních záležitostech mezi Evropským hospodářským
    společenstvím a Evropským společenstvím uhlí a oceli na jedné straně a
    Rumunskem na straně druhé a Evropská dohoda zakládající přidružení mezi
    Evropskými společenstvími a jejich členskými státy na jedné straně a Rumunskem
    na straně druhé, obě ve znění dodatkového protokolu podepsaného dne 21.
    prosince 1993
  type: main
- language: da
  script: Latn
  content: '94/392/EF: Rådets afgørelse af 27. juni 1994 om godkendelse af aftalen
    i form af brevveksling mellem Det Europæiske Fællesskab og Rumænien om ændring
    af interimsaftalen om handel og handelsanliggender mellem Det Europæiske Økonomiske
    Fællesskab og Det Europæiske Kul- og Stålfællesskab, på den ene side, og
    Rumænien, på den anden side, og Europaaftalen om oprettelse af en associering
    mellem De Europæiske Fællesskaber og deres medlemsstater, på den ene side,
    og Rumænien, på den anden side, begge ændret ved tillægsprotokol undertegnet
    den 21. december 1993'
  type: main
- language: el
  script: Grek
