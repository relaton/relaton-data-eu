    και των κρατών μελών τους, αφενός, και της Ρουμανίας,
    αφετέρου, όπως τροποποιήθηκαν από το πρόσθετο
    πρωτόκολλο που υπογράφηκε στις 21 Δεκεμβρίου
    1993'
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus, 27. juuni 1994, Euroopa Ühenduse ja Rumeenia vahelise
    kirjade vahetuse teel sõlmitud kokkuleppe heakskiitmise kohta, millega muudeti
    kaubandust ja kaubandusküsimusi käsitlevat vahelepingut ühelt poolt Euroopa
    Majandusühenduse ning Euroopa Söe- ja Teraseühenduse ja teiselt poolt Rumeenia
    vahel ning Euroopa ühenduste ja nende liikmesriikide ning Rumeenia vahelist assotsieerumislepingut
    (Euroopa lepingut), mõlemad muudetud 21. detsembril 1993 allkirjastatud lisaprotokolliga
  type: main
- language: hu
  script: Latn
  content: A Tanács határozata (1994. június 27.) az Európai Közösség és a
    Románia között az 1993. december 21-én aláírt kiegészítő jegyzőkönyv
    által módosított, egyrészről az Európai Gazdasági Közösség és az Európai
    Szén- és Acélközösség, másrészről a Románia között létrejött, a
    kereskedelemről és a kereskedelemmel kapcsolatos ügyekről szóló ideiglenes
    megállapodás, valamint az ugyanazon jegyzőkönyv által módosított, egyrészről
    az Európai Közösségek és azok tagállamai, másrészről a Románia között
    társulás létesítéséről szóló Európa-megállapodás módosításáról
    szóló levélváltás jóváhagyásáról
  type: main
- language: it
  script: Latn
  content: '94/392/CE: Decisione del Consiglio del 27 giugno 1994 che approva l''accordo
    in forma di scambio di lettere recante modifica dell''accordo interinale sugli
    scambi e sulle questioni commerciali tra la Comunità economica europea e la Comunità
    europea del carbone e dell''acciaio, da una parte, e la Romania dall''altra, e
    dell''accordo europeo che istituisce un''associazione tra le Comunità europee
    e i loro Stati membri, da una parte, e la Romania dall''altra, entrambi modificati
    dal protocollo aggiuntivo firmato il 21 dicembre 1993'
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (1994. gada 27. jūnijs), ar ko apstiprina Eiropas Kopienas
    un Rumānijas nolīgumu vēstuļu apmaiņas veidā, ar kuru groza Pagaidu nolīgumu
    par tirdzniecību un ar to saistītajiem jautājumiem starp Eiropas Ekonomikas
    kopienu un Eiropas Ogļu un tērauda kopienu, no vienas puses, un Rumāniju, no
    otras puses, un Eiropas nolīgumu, ar ko izveido asociāciju starp Eiropas Kopienām
    un to dalībvalstīm, no vienas puses, un Rumāniju, no otras puses, abi līgumi
    grozīti ar 1993. gada 21. decembrī parakstīto Papildprotokolu
  type: main
- language: lt
  script: Latn
  content: 1994 m. birželio 27 d. Tarybos sprendimas patvirtinantis Europos bendrijos
    ir Rumunijos susitarimą pasikeičiant raštais, iš dalies pakeičiantį Laikinąjį
    Europos ekonominės bendrijos bei Europos anglių ir plieno bendrijos ir Rumunijos
    susitarimą dėl prekybos ir su prekyba susijusių klausimų ir Europos susitarimą,
    įsteigiantį asociaciją tarp Europos Bendrijų bei jų valstybių narių ir
    Rumunijos, abu su pakeitimais, padarytais Papildomuoju protokolu, pasirašytu
    1993 m. gruodžio 21 d.
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kunsill tas-27 ta' Ġunju 1994 li tapprova bdil ta'
    ittri bejn il-Komunità u r-Repubblika tar-Rumanija li temenda l-Ftehim Interim
    fuq il-kummerċ u affarijiet relatati mal-kummerċ bejn il-Komunità Ekonomika
    Ewropea u l-Komunità Ewropea tal-Faħam u l-Azzar, min- naħa l-waħda, u r-Repubblika
    tar-Rumanija, min-naħa l-oħra, u l-Ftehim Ewropew li jistabbilixxi assoċjazzjoni
    bejn il-Komunitajiet Ewropej u l-Istati Membri tagħhom, min-naħa l-waħda, u
    r-Repubblika tar-Rumanija, min-naħa l-oħra, it-tnejn kif emendati mill-Protokoll
    Addizzjonali ffirmat fil-21 ta' Diċembru 1993
  type: main
- language: nl
  script: Latn
  content: '94/392/EG: Besluit van de Raad van 27 juni 1994 tot goedkeuring van de
    briefwisseling tot wijziging van de Interimovereenkomst betreffende de handel
    en aanverwante zaken tussen de Europese Economische Gemeenschap en de Europese
    Gemeenschap voor Kolen en Staal, enerzijds, en Roemenië, anderzijds, en de Europa-Overeenkomst
    waarbij een associatie tot stand wordt gebracht tussen de Europese Gemeenschappen
    en haar Lid-Staten, enerzijds, en Roemenië, anderzijds, beide zoals gewijzigd
    bij het Aanvullend Protocol dat op 21 december 1993 werd ondertekend'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 27 czerwca 1994 r. w sprawie zatwierdzenia Porozumienia
    w formie wymiany listów między Wspólnotą Europejską a Rumunią zmieniającego
    Umowę przejściową w sprawie handlu i kwestii związanych z handlem między
    Europejską Wspólnotą Gospodarczą i Europejską Wspólnotą Węgla i Stali,
    z jednej strony, a Rumunią, z drugiej strony, oraz Układ Europejski ustanawiający
    stowarzyszenie między Wspólnotami Europejskimi i ich Państwami Członkowskimi,
    z jednej strony, a Rumunią, z drugiej strony, zmienione Protokołem dodatkowym,
    podpisanym dnia 21 grudnia 1993 r.
  type: main
- language: pt
  script: Latn
  content: '94/392/CE: Decisão do Conselho de 27 de Junho de 1994 que aprova o Acordo
    sob forma de troca de cartas entre a Comunidade Europeia e a Roménia que altera
    o Acordo provisório sobre comércio e matérias conexas entre a Comunidade Económica
    Europeia e a Comunidade Europeia do Carvão e do Aço, por um lado, e a Roménia,
    por outro, e o acordo europeu que cria uma associação entre as Comunidades Europeias
    e os seus Estados-membros, por um lado, e a Roménia, por outro, alterados pelo
    protocolo complementar de 21 de Dezembro de 1993'
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady z 27. júna 1994, ktorým sa schvaľuje dohoda vo forme
    výmeny listov medzi Európskym spoločenstvom a Rumunskom, ktorou sa mení a
    dopĺňa Dočasná dohoda o obchode a obchodných záležitostiach medzi Európskym
    hospodárskym spoločenstvom a Európskym spoločenstvom uhlia a ocele na jednej
    strane a Rumunskom na druhej strane a Európska dohoda ustanovujúca pridruženie
    Európskych spoločenstiev a ich členských štátov na jednej strane a Rumunska
    na druhej strane, ktoré boli zmenené a doplnené dodatočným protokolom podpísaným
    21. decembra 1993
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 27. junija 1994 o odobritvi Sporazuma v obliki izmenjave
    pisem med Evropsko skupnostjo in Romunijo o spremembi Začasnega sporazuma o trgovini
    in trgovinskih zadevah med Evropsko gospodarsko skupnostjo in Evropsko skupnostjo
    za premog in jeklo na eni strani in Romunijo na drugi strani ter Evropskega sporazuma
    o pridružitvi med Evropskimi skupnostmi in njihovimi državami članicami na
    eni strani in Romunijo na drugi strani, kakor sta bila spremenjena z Dodatnim
    protokolom, podpisanim 21. decembra 1993
  type: main
- language: es
  script: Latn
  content: '94/392/CE: Decisión del Consejo de 27 de junio de 1994 por la que se
    aprueba el Acuerdo en forma de canje de notas entre la Comunidad Europea y Rumania
    por el que se modifica el Acuerdo interino sobre comercio y medidas de acompañamiento
    entre la Comunidad Económica Europea y la Comunidad Europea del Carbón y del
    Acero, por una parte, y Rumania, por otra parte, así como el Acuerdo europeo
    por el que se establece una asociación entre la Comunidad Europea y sus Estados
    miembros, por una parte y Rumania, por otra parte, modificados ambos por el Protocolo
    adicional firmado el 21 de diciembre de 1993'
