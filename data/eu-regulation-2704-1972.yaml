title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2704/72 de la Commission, du 22 décembre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux ouvrages en amiante-ciment, cellulose-ciment et similaires, de la position
    tarifaire 68.12, originaires de la Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre
    1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2704/72 der Kommission vom 22. Dezember 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Waren aus Asbestzement, Zellulosezement
    oder dergleichen, der Tarifnummern 68.12, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2704/72 della Commissione, del 22 dicembre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    lavori di amianto-cemento, cellulosa-cemento e simili, della voce doganale n.
    68.12 originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2704/72 van de Commissie van 22 december 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op waren van asbestcement, van cellulosecement en dergelijke van
    post 68.12, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2795/71 van de Raad van 20 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
