title:
- language: en
  script: Latn
  content: Council Directive 96/53/EC of 25 July 1996 laying down for certain road
    vehicles circulating within the Community the maximum authorized dimensions in
    national and international traffic and the maximum authorized weights in international
    traffic
  type: main
- language: fr
  script: Latn
  content: Directive 96/53/CE du Conseil du 25 juillet 1996 fixant, pour certains
    véhicules routiers circulant dans la Communauté, les dimensions maximales autorisées
    en trafic national et international et les poids maximaux autorisés en trafic
    international
  type: main
- language: de
  script: Latn
  content: Richtlinie 96/53/EG des Rates vom 25. Juli 1996 zur Festlegung der höchstzulässigen
    Abmessungen für bestimmte Straßenfahrzeuge im innerstaatlichen und grenzüberschreitenden
    Verkehr in der Gemeinschaft sowie zur Festlegung der höchstzulässigen Gewichte
    im grenzüberschreitenden Verkehr
  type: main
- language: bg
  script: Cyrl
  content: Директива 96/53/ЕО на Съвета от 25 юли 1996 година
    относно максимално допустимите размери в националния
    и международен трафик на някои пътни превозни
    средства, които се движат на територията на
    Общността, както и максимално допустимите
    маси в международния трафик
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 96/53/ES ze dne 25. července 1996, kterou se pro určitá
    silniční vozidla provozovaná v rámci Společenství stanoví maximální přípustné
    rozměry pro vnitrostátní a mezinárodní provoz a maximální přípustné
    hmotnosti pro mezinárodní provoz
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 96/53/EF af 25. juli 1996 om fastsættelse af de største
    tilladte dimensioner i national og international trafik og største tilladte vægt
    i international trafik for visse vejkøretøjer i brug i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Οδηγία 96/53/ΕΚ του Συμβουλίου της 25ης Ιουλίου
    1996 σχετικά με τον καθορισμό, για ορισμένα οδικά
    οχήματα που κυκλοφορούν στην Κοινότητα, των
    μέγιστων επιτρεπόμενων διαστάσεων στις εθνικές
    και διεθνείς μεταφορές και των μέγιστων επιτρεπόμενων
    βαρών στις διεθνείς μεταφορές
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 96/53/EÜ, 25. juuli 1996, millega kehtestatakse teatavatele
    ühenduses liikuvatele maanteesõidukitele siseriiklikus ja rahvusvahelises liikluses
    lubatud maksimaalmõõtmed ning rahvusvahelises liikluses lubatud täismass
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 96/53/EY, annettu 25 päivänä heinäkuuta 1996,
    tiettyjen yhteisössä liikkuvien tieliikenteen ajoneuvojen suurimmista kansallisessa
    ja kansainvälisessä liikenteessä sallituista mitoista ja suurimmista kansainvälisessä
    liikenteessä sallituista painoista
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 96/53/EZ od 25. srpnja 1996. o utvrđivanju najvećih
    dopuštenih dimenzija u unutarnjem i međunarodnom prometu te najveće dopuštene
    mase u međunarodnom prometu za određena cestovna vozila koja prometuju unutar
    Zajednice
  type: main
- language: hu
  script: Latn
  content: A Tanács 96/53/EK irányelve (1996. június 25.) a Közösségen belül
    közlekedő egyes közúti járművek nemzeti és a nemzetközi forgalomban megengedett
    legnagyobb méreteinek, valamint a nemzetközi forgalomban megengedett legnagyobb
    össztömegének megállapításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 96/53/CE del Consiglio del 25 luglio 1996 che stabilisce, per
    taluni veicoli stradali che circolano nella Comunità, le dimensioni massime autorizzate
    nel traffico nazionale e internazionale e i pesi massimi autorizzati nel traffico
    internazionale
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva Nr. 96/53/EK (1996. gada 25. jūlijs), ar kuru paredz
    noteiktu Kopienā izmantotu transportlīdzekļu maksimālos pieļaujamos gabarītus
    iekšzemes un starptautiskajā satiksmē, kā arī šo transportlīdzekļu maksimālo
    pieļaujamo svaru starptautiskajā satiksmē
  type: main
- language: lt
  script: Latn
  content: 1996 m. liepos 25 d., Tarybos direktyva 96/53/EB nustatanti tam tikrų
    Bendrijoje nacionaliniam ir tarptautiniam vežimui naudojamų kelių transporto
    priemonių didžiausius leistinus matmenis ir tarptautiniam vežimui naudojamų
    kelių transporto priemonių didžiausią leistiną masę
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 96/53/KE tal-25 ta' Lulju 1996 li tistabbilixxi
    għal ċerti vetturi tat-triq li jiċċirkolaw fi ħdan il-Komunità id-dimensjonijiet
    massimi awtorizzati fit-traffiku nazzjonali u internazzjonali u l-piżijiet massimi
    awtorizzati fit-traffiku internazzjonali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 96/53/EG van de Raad van 25 juli 1996 houdende vaststelling,
    voor bepaalde aan het verkeer binnen de Gemeenschap deelnemende wegvoertuigen,
    van de in het nationale en het internationale verkeer maximaal toegestane afmetingen,
    en van de in het internationale verkeer maximaal toegestane gewichten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 96/53/WE z dnia 25 lipca 1996 r. ustanawiająca dla niektórych
    pojazdów drogowych poruszających się na terytorium Wspólnoty maksymalne dopuszczalne
    wymiary w ruchu krajowym i międzynarodowym oraz maksymalne dopuszczalne obciążenia
    w ruchu międzynarodowym
  type: main
- language: pt
  script: Latn
  content: Directiva 96/53/CE do Conselho de 25 de Julho de 1996 que fixa as dimensões
    máximas autorizadas no tráfego nacional e internacional e os pesos máximos
    autorizados no tráfego internacional para certos veículos rodoviários em circulação
    na Comunidade
  type: main
- language: ro
  script: Latn
  content: Directiva 96/53/CE a Consiliului din 25 iulie 1996 de stabilire, pentru
    anumite vehicule rutiere care circulă în interiorul Comunității, a dimensiunilor
    maxime autorizate în traficul național și internațional și a greutății
    maxime autorizate în traficul internațional
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 96/53/ES z 25. júla 1996, ktorou sa v spoločenstve stanovujú
    najväčšie prípustné rozmery niektorých vozidiel vo vnútroštátnej a medzinárodnej
    cestnej doprave a najväčšia povolená hmotnosť v medzinárodnej cestnej doprave
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 96/53/ES z dne 25. julija 1996 o določitvi največjih
    dovoljenih mer določenih cestnih vozil v Skupnosti v notranjem in mednarodnem
    prometu in največjih dovoljenih tež v mednarodnem prometu
  type: main
- language: es
  script: Latn
  content: Directiva 96/53/CE del Consejo de 25 de julio de 1996 por la que se establecen,
    para determinados vehículos de carretera que circulan en la Comunidad, las dimensiones
    máximas autorizadas en el tráfico nacional e internacional y los pesos máximos
    autorizados en el tráfico internacional
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 96/53/EG av den 25 juli 1996 om största tillåtna dimensioner
    i nationell och internationell trafik och högsta tillåtna vikter i internationell
    trafik för vissa vägfordon som framförs inom gemenskapen
  type: main
