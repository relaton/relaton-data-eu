title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 864/87 of 23 March 1987 imposing a definitive
    anti-dumping duty on imports of standardized multi-phase electric motors having
    an output of more than 0,75 kW but not more than 75 kW, originating in Bulgaria,
    Czechoslovakia, the German Democratic Republic, Hungary, Poland and the Soviet
    Union, and definitively collecting the amounts secured as provisional duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 864/87 du Conseil du 23 mars 1987 instituant un droit
    antidumping définitif à l' égard des importations de moteurs électriques polyphasés
    normalisés, d' une puissance de plus de 0,75 à 75 kilowatts inclus, originaires
    de Bulgarie, de Hongrie, de Pologne, de la République démocratique allemande,
    de Tchécoslovaquie et d' Union soviétique, et portant perception définitive
    des montants garantis à titre de droit provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 864/87 des Rates vom 23. März 1987 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von standardisierten Mehrphasen-Wechselstrommotoren
    mit einer Leistung von mehr als 0,75 bis 75 kW mit Ursprung in Bulgarien, Ungarn,
    Polen, der Deutschen Demokratischen Republik, der Tschechoslowakei und der Sowjetunion
    und zur endgültigen Vereinnahmung der als Sicherheit für den vorläufigen Zoll
    hinterlegten Beträge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 864/87 af 23. marts 1987 om indførelse af
    en endelig antidumpingtold på importen af standardiserede elektriske motorer,
    flerfasede, med effekt på over 0,75 kW, men højst 75 kW, med oprindelse i Bulgarien,
    Den tyske demokratiske Republik, Polen, Sovjetunionen, Tjekkoslovakiet og Ungarn,
    og om endelig opkrævning af de beløb, for hvilke der er stillet sikkerhed i
    form af midlertidig told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 864/87 του Συμβουλίου
    της 23ης Μαρτίου 1987 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές τυποποιημένων
    πολυφασικών ηλεκτρικών κινητήρων, ισχύος μεγαλύτερης
    από 0,75 kilowatts έως και 75 kilowatts, καταγωγής Βουλγαρίας,
    Ουγγαρίας, Πολωνίας, Λαϊκής Δημοκρατίας της
    Γερμανίας, Τσεχοσλοβακίας και Σοβιετικής Ένωσης,
    και για την οριστική είσπραξη των ποσών που
    έχουν κατατεθεί ως εγγύηση μέσω του προσωρινού
    δασμού
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 864/87 del Consiglio del 23 marzo 1987 che istituisce
    un dazio antidumping definitivo nei confronti delle importazioni di motori elettrici
    polifase normalizzati di potenza superiore a 0,75 kW e inferiore o pari a 75 kW,
    originari della Bulgaria, della Cecoslovacchia, della Polonia, della Repubblica
    democratica tedesca, dell' Ungheria e dell' Unione Sovietica, e che fissa la riscossione
    definitiva degli importi costituiti in garanzia a titolo di dazio provvisorio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 864/87 van de Raad van 23 maart 1987 houdende instelling
    van een definitief anti-dumpingrecht op de invoer van gestandaardiseerde meerfasige
    elektromotoren met een vermogen van meer dan 0,75 kilowatt tot en met 75 kilowatt,
    van oorsprong uit Bulgarije, de Duitse Democratische Republiek, Hongarije, Polen,
