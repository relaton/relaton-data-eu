    waarborg voor het voorlopige recht zijn gesteld
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 864/87 do Conselho de 23 de Março de 1987 que institui
    um direito anti-dumping definitivo sobre as importações de motores eléctricos
    polifásicos normalizados, de potência de mais de 0,75 até 75 quilovátios,
    inclusive, originários da Bulgária, da Checoslováquia, da Hungria, da Polónia,
