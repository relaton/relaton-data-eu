title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1720/2003 of 29 September 2003 determining
    the extent to which applications lodged in September 2003 for import licences
    under the regime provided for by tariff quotas for certain products in the pigmeat
    sector for the period 1 October to 31 December 2003 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1720/2003 de la Commission du 29 septembre 2003 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en septembre 2003 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er octobre au 31 décembre 2003
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1720/2003 der Kommission vom 29. September 2003 über
    die Festsetzung des Umfangs für die im September 2003 gestellten Anträge auf
    Einfuhrlizenzen für bestimmte Erzeugnisse im Sektor Schweinefleisch für den
    Zeitraum vom 1. Oktober bis zum 31. Dezember 2003
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1720/2003 af 29. september 2003 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i september
    2003 om importlicenser for toldkontingenter for indførsel af bestemte svinekødsprodukter
    for perioden 1. oktober til 31. december 2003
  type: main
- language: el
  script: Grek
