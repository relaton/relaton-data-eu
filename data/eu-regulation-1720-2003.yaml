    προϊόντα του τομέα του χοιρείου κρέατος, για
    την περίοδο από την 1η Οκτωβρίου έως τις 31 Δεκεμβρίου
    2003
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1720/2003, annettu 29 päivänä syyskuuta 2003,
