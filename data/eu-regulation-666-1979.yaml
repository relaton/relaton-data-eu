type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 666/79 of 4 April 1979 re-establishing the
    levying of customs duties on nets and netting made of twine, cordage or rope,
    etc., falling within heading No 59.05 and originating in developing countries,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3157/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 666/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux filets,
    fabriqués à l' aide des matières reprises au n° 59.04, en nappes, en pièces
    ou en forme, etc., de la position 59.05 du tarif douanier commun, originaires
    des pays et territoires en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3157/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 666/79 der Kommission vom 4. April 1979 zur Wiedereinführung
    des Zollsatzes für Netze aus Waren der Tarifnummer 59.04, in Stücken, als Meterware
    oder abgepaßt; usw., der Tarifnummer 59.05, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3157/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionnens forordning (EØF) nr. 666/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for knyttede netstoffer af sejlgarn, reb og tovværk,
    også i tilskårne stykker eller konfektionerede ; etc., under pos. 59.04 og 59.05,
    som har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er
    fastsat i Rådets forordning (EØF) nr. 3157/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 666/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili alle reti, ottenute con l' impiego
    di manufatti previsti dalla voce 59.04, in strisce, in pezza o in forme determinate,
    ecc., della voce doganale 59.05, originarie dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3157/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 666/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op netten,
    vervaardigd van produkten bedoeld bij post 59.04, in banen, aan het stuk of in
    bepaalde vorm, enz., van post 59.05, van oorsprong uit de ontwikkelingslanden
    en -gebieden, ten behoeve waarvan bij Verordening (EEG) nr. 3157/78 van de Raad
    tariefpreferenties werden geopend
  type: main
