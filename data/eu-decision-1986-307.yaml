title:
- language: en
  script: Latn
  content: '86/307/EEC: Commission Decision of 11 June 1986 on the clearance of the
    accounts presented by the Kingdom of Belgium in respect of premium for leaf tobacco
    declared as expenditure chargeable to the European Agricultural Guidance and Guarantee
    Fund, Guarantee Section, for 1981 and amending Decision 85/449/EEC'
  type: main
- language: fr
  script: Latn
  content: '86/307/CEE: Décision de la Commission du 11 juin 1986 relative à l''apurement
    des comptes présentés par le Royaume de Belgique au titre des dépenses déclarées
    comme prime au tabac en feuilles et financées par le Fonds européen d''orientation
    et de garantie agricole, section "garantie", pour l''exercice financier 1981,
    et modifiant la décision 85/449/CEE'
  type: main
- language: de
  script: Latn
  content: '86/307/EWG: Entscheidung der Kommission vom 11. Juni 1986 über den vom
    Königreich Belgien vorgelegten Rechnungsabschluß für die vom Europäischen
    Ausrichtungs- und Garantiefonds für die Landwirtschaft, Abteilung Garantie, für
    das Haushaltsjahr 1981 bezüglich der als Prämien für Tabakblätter deklarierten
    Ausgaben und zur Berichtigung der Entscheidung 85/449/EWG'
  type: main
- language: da
  script: Latn
  content: '86/307/EØF: Kommissionens beslutning af 11. juni 1986 om afslutning af
    de af kongeriget Belgien forelagte regnskaber over anmeldte udgifter til præmier
    for tobak i blade for regnskabsåret 1981, der er finansieret gennem Den europæiske
    udviklings- og garantifond for Landbruget, garantisektionen, og om ændring af
    beslutning 85/449/EØF'
  type: main
- language: el
  script: Grek
  content: '86/307/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Ιουνίου 1986 σχετικά με την εκκαθάριση των λογαριασμών
    που υπέβαλε το Βασίλειο του Βελγίου όσον αφορά
    τις δαπάνες που έχουν δηλωθεί σαν πριμοδότηση
    για τον καπνό υπό μορφή φύλλων και που έχουν
    χρηματοδοτηθεί από το Ευρωπαϊκό Γεωργικό Ταμείο
    Προσανατολισμού και Εγγυήσεων, τμήμα Εγγυήσεων,
    για το οικονομικό έτος 1981, και την τροποποίηση
    της απόφασης 85/449/ΕΟΚ'
  type: main
