title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3244/89 of 27 October 1989 specifying the
    extent to which applications lodged in October 1989 for import licences in respect
    of young male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3244/89 de la Commission, du 27 octobre 1989, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois d'octobre 1989 pour les jeunes bovins mâles
    destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3244/89 der Kommission vom 27. Oktober 1989 über
    das Ausmaß, in dem den im Oktober 1989 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3244/89 af 27. oktober 1989 om det
    omfang, i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet
    i oktober 1989 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3244/89 της Επιτροπής
    της 27ης Οκτωβρίου 1989 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν τον Οκτώβριο του 1989, για τα νεαρά
    άρρενα βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3244/89 della Commissione, del 27 ottobre 1989, che
    stabilisce in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di ottobre 1989 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3244/89 van de Commissie van 27 oktober 1989 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in oktober 1989 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3244/89 da Comissão, de 27 de Outubro de 1989, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apesentados no mês de Outubro de 1989 para os bovinos machos
    jovens destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 3244/89 de la Comisión, de 27 de octubre de 1989, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de octubre de 1989 respecto
    a los jóvenes bovinos machos destinados al engorde
  type: main
