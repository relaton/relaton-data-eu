title:
- language: en
  script: Latn
  content: Commission Decision of 4 December 1980 authorizing the French Republic
    not to apply Community treatment to men's and boys'shirts, woven, originating
    in Taiwan (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 4 décembre 1980, autorisant la République
    française à exclure du traitement communautaire les chemises et chemisettes
    tissées originaires de T'ai-wan (Le texte en langue française est le seul faisant
    foi)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Dezember 1980 zur Ermächtigung der
    Französischen Republik, aus Taiwan stammende Oberhemden, auch Sport- und Arbeitshemden,
    aus Geweben, von der Gemeinschaftsbehandlung auszuschließen (Nur der französische
    Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 4. december 1980 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage vævede skjorter, (herunder
    sports- og arbejdsskjorter), med oprindelse i Taiwan (Kun den franske udgave er
    autentisk)
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 dicembre 1980, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario camicie e camicette, tessute,
    originarie di Taiwan (Il testo in lingua francese è il solo facente fede)
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 december 1980 houdende machtiging van
    de Franse Republiek om overhemden en sporthemden, geweven, van oorsprong uit Taiwan,
    van de communautaire behandeling uit te sluiten (Slechts de tekst in de Franse
    taal is authentiek)
