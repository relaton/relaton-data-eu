title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1979/93 of 22 July 1993 determining the
    extent to which applications lodged in July 1993 for import licences for fresh,
    chilled or frozen beef under the import arrangements provided for in the Interim
    Agreements concluded by the Community with the Republic of Poland, the Republic
    of Hungary and the Czech and Slovak Federal Republic (CSFR) can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1979/93 de la Commission, du 22 juillet 1993, déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en juillet 1993 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    intérimaires conclus par la Communauté avec la république de Pologne, la république
    de Hongrie et la République fédérative tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1979/93 der Kommission vom 22. Juli 1993 zur Festsetzung
    des Umfangs, in dem die im Juli 1993 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Interimsabkommen zwischen
    der Gemeinschaft und der Republik Polen, der Republik Ungarn und der Tschechischen
    und Slowakischen Föderativen Republik (CSFR) genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1979/93 af 22. juli 1993 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i juli 1993, om
    importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i interimsaftalerne mellem Fællesskabet og Republikken Polen,
    Republikken Ungarn og Den Tjekkiske og Slovakiske Føderative Republik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1979/93 της Επιτροπής
    της 22ας Ιουλίου 1993 περί καθορισμού του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 1993 για τα νωπά, διατηρημένα με απλή
    ψύξη ή κατεψυγμένα βόεια κρέατα στα πλαίσια
    των καθεστώτων εισαγωγής που προβλέπονται
    από τις προσωρινές συμφωνίες που συνήφθησαν
    από την Κοινότητα με τη Δημοκρατία της Πολωνίας,
    τη Δημοκρατία της Ουγγαρίας και την Τσεχική
    και Σλοβακική Ομοσπονδιακή Δημοκρατία (ΤΣΟΔ)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1979/93 della Commissione, del 22 luglio 1993, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1993 per le carni bovine fresche, refrigerate o
    congelate nel quadro dei regimi di importazione previsti dagli accordi interinali
    conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica di Ungheria
    e la Repubblica Federativa Ceca e Slovacca (RFCS)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1979/93 van de Commissie van 22 juli 1993 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor vers, gekoeld of bevroren rundvlees, die in juli 1993 zijn ingediend op grond
    van de invoerregelingen die zijn vastgesteld in de door de Gemeenschap met de
    Republiek Polen, de Republiek Hongarije en de Tsjechische en Slowaakse Federatieve
    Republiek (TSFR) gesloten interimovereenkomsten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1979/93 da Comissão, de 22 de Julho de 1993, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de carne de bovino fresca, refrigerada ou congelada, apresentados em Julho de
    1993 ao abrigo dos regimes de importação previstos nos acordos provisórios
    concluídos pela Comunidade com a República da Polónia, a República da Hungria
    e a República Federativa Checa e Eslovaca (RFCE)
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 1979/93 de la Comisión, de 22 de julio de 1993, por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de carne fresca, refrigerada o congelada de vacuno presentadas
    en julio de 1993, al amparo de los regímenes de importación establecidos en
    los Acuerdos interinos celebrados entre la Comunidad y la República de Polonia,
    la República de Hungría y la República Federativa Checa y Eslovaca (RFCE)
