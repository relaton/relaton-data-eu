    modifiant, en ce qui concerne la localisation du centre de surveillance de la
    sécurité Galileo, la décision d'exécution (UE) 2016/413 déterminant la localisation
    de l'infrastructure au sol du système issu du programme Galileo et prévoyant
    les mesures nécessaires pour assurer son fonctionnement, et abrogeant la décision
    d'exécution 2012/117/UE
  type: main
