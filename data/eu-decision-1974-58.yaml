title:
- language: en
  script: Latn
  content: '74/58/EEC: Commission Decision of 21 December 1973 on financial contribution
    by the Community towards expenditure arising from the grant to producers in certain
    regions of the Federal Republic of Germany who keep not less than five but not
    more than ten dairy cows of premiums for the conversion of dairy herds to meat
    production'
  type: main
- language: fr
  script: Latn
  content: '74/58/CEE: Décision de la Ctière qui, par l''octroi de la prime aux
    producteurs détenant, dans certaines régions, de 5 à 10 vaches laitières,
    en résultent pour la République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: '74/58/EWG: Entscheidung der Kommission vom 21. Dezember 1973 über die
    finanzielle Beteiligung der Gemeinschaft an den Kosten der Prämienregelung zur
    Umstellung von Milchkuhbeständen auf Bestände zur Fleischerzeugung, die durch
    die Gewährung der Prämie an Erzeuger, die in bestimmten Gebieten 5 bis 10 Milchkühe
    halten, in der Bundesrepublik Deutschland entstehen'
  type: main
- language: da
  script: Latn
  content: '74/58/EØF: Kommissionens Beslutning af 21. december 1973 om Fællesskabets
    bidrag til finansiering af de omkostninger, som opstår i Forbundsrepublikken
    Tyskland i forbindelse med præmieordningen for omlægning af besætninger af
    malkekvæg til kødproduktion, ved ydelse af en præmie til producenter, som holder
    mellem 5 og 10 malkekøer i bestemte områder'
  type: main
- language: it
  script: Latn
  content: '74/58/CEE: Decisione della Commissione, del 21 dicembre 1973, relativa
    alla partecipazione finanziaria della Comunità ai costi del regime di premio
    per la riconversione di mandrie bovine ad orientamento lattiero verso la produzione
    di carne derivante per la Repubblica federale di Germania dalla concessione del
    premio ai produttori che detengono in talune regioni da 5 a 10 vacche da latte'
  type: main
- language: nl
  script: Latn
  content: '74/58/EEG: Beschikking van de Commissie van 21 december 1973 betreffende
    de financiële deelneming van de Gemeenschap in de kosten van het stelsel van
    premies voor de omschakeling van de melkveestapel op de rundvleesproduktie, die
    in de Bondsrepubliek Duitsland worden gemaakt door de toekenning van de premie
    aan de producenten die in bepaalde gebieden 5 tot 10 melkkoeien houden'
