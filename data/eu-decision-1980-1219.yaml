title:
- language: en
  script: Latn
  content: Commission Decision of 11 December 1980 to take no action on the tenders
    submitted by 11 December 1980 in response to the invitation to tender for the
    export of barley issued in Regulation (EEC) No 3025/80
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 11 décembre 1980 de ne pas donner suite
    aux offres déposées pour l'exportation d'orge, le 11 décembre 1980, dans le
    cadre de l'adjudication visée au règlement (CEE) n° 3025/80
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 11. Dezember 1980, die zum 11 . Dezember
    1980 im Rahmen der Ausschreibung gemäß der Verordnung (EWG) Nr. 3025/80 eingereichten
    Angebote für die Ausfuhr von Gerste nicht zu berücksichtigen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 11. december 1980 om at de bud for udførsel
    af byg, der er indgivet den 11. december 1980, inden for rammerne af den i forordning
    (EØF) nr. 3025/80 omhandlede licitation skal være uden virkning
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE dell' 11 dicembre 1980 di non dar seguito alle
    offerte presentate per l' 11 dicembre 1980 nell'ambito della gara per l'esportazione
    d'orzo di cui al regolamento (CEE) n. 3025/80
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 11 december 1980 waarbij wordt besloten
    geen gevolg te geven aan de offertes voor de uitvoer van gerst die voor 11 december
    1980 zijn ingediend in het kader van de openbare inschrijving bedoeld in Verordening
    (EEG) nr. 3025/80
