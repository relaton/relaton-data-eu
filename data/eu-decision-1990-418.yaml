  content: '90/418/CEE: Decisão da Comissão de 1 de Agosto de 1990 que fixa o montante
    dos recursos proprios do imposto sobre o valor acrescentado (IVA) de que a Republica
    Federal da Alemanha é devedora para o exercicio de 1988 e relativo às operaçoes
    referidas na vigésima Directiva 85/361/CEE do Conselho em matéria de harmonizaçao
    das legislaçoes dos Estados-membros respeitantes aos impostos sobre o volume
    de negocios _ sistema comum de imposto sobre o valor acrescentado: derrogaçoes
    relativas às ajudas especiais concedidas a certos agricultores em compensaçao
