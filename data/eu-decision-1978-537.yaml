id: EUDecision1978537
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 8 June 1978 authorizing the French Republic not
    to apply Community treatment to women's, girls' and infants' outer garments; blouses
    and shirt blouses, knitted or crocheted (not elastic or rubberized), or woven,
    for women, girls and infants, of wool, of cotton or of man-made textile fibres,
    falling within subheadings ex 60.05 A II or ex 61.02 B (NIMEXE codes 60.05-22,
    23, 24, 25 - 61.02-78, 82, 84) of the Common Customs Tariff, originating in Thailand
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/537/CEE: Décision de la Commission, du 8 juin 1978, autorisant la
    République française à exclure du traitement communautaire les vêtements de
    dessus pour femmes, fillettes et jeunes enfants, chemisiers, blouses-chemisiers
    et blouses de bonneterie (non élastique ni caoutchoutée) ou tissés, pour femmes,
    fillettes et jeunes enfants, de laine, de coton ou de fibres textiles synthétiques
    ou artificielles, des sous- positions Ex 60.05 A II et Ex 61.02 B du Tarif douanier
    commun (codes Nimexe : 60.05-22, 23, 24, 25; 61.02-78, 82, 84), originaires de
    Thaïlande et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 8. Juni 1978, mit der die Französische
    Republik ermächtigt wird, aus Thailand stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberkleidung für Frauen, Mädchen und Kleinkinder:
    Blusen und Hemdblusen aus Gewirken (weder gummielastisch noch kautschutiert) oder
    Geweben, für Frauen, Mädchen und Kleinkinder, aus Wolle, Baumwolle, synthetischen
    oder künstlichen Spinnstoffen der Tarifnummern ex 60.05 A II und ex 61.02 B des
    Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-22; 23; 24; 25 - 61.02-78; 82;
    84) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 8. juni 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage yderbeklædningsgenstande til
    kvinder, piger og småbørn: skjorter, skjortebluser og bluser, af trikotage (ikke
    elastisk eller gummeret) eller vævede, til kvinder, piger og småbørn, af uld,
    bomuld eller syntetiske eller regenererede fibre, som henhører under pos. ex
    60.05 A II og ex 61.02 B (NIMEXE-kode: 60.05-22, 23, 24, 25; 61.02-78, 82, 84)
    i den fælles toldtarif, har oprindelse i Thailand og frit kan omsættes i de
    andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, dell'8 giugno 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario indumenti esterni per donna,
    per ragazza e per bambini, camicie, camicette e bluse a maglia (non elastica né
    gommata) o tessute, per donna, per ragazza e per bambini di lana, di cotone o
    di fibre tessili sintetiche o artificiali delle voci ex 60.05 A II e ex 61.02
    B della tariffa doganale comune (codice Nimexe 60.05-22, 23, 24, 25; 61.02-78,
    82, 84), originari della Tailandia e messi in libera pratica negli altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 8 juni 1978 waarbij de Franse Republiek
    wordt gemachtigd bovenkleding voor dames, meisjes en kinderen, blouses, overhemdblouses,
    van brei- of haakwerk (niet-elastisch, niet-gegummeerd) of geweven, voor dames,
    meisjes en kinderen, van wol, van katoen, of van synthetische of van kunstmatige
    textielvezels, van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.05-22, 23, 24, 25; 61.02-78, 82, 84), van oorsprong
    uit Thailand en in de overige Lid-Staten in het vrije verkeer gebracht, van de
    communautaire behandeling uit te sluiten
  type: main
