    der Verordnung (EWG) Nr. 516/77 vorgesehenen Ausfuhrerstattungen für Verarbeitungserzeugnisse
    aus Obst und Gemüse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 960/81 af 8. april 1981 om ændring
