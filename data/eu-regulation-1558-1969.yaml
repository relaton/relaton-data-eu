  content: Verordnung (EWG) Nr. 1558/69 der Kommission vom 5. August 1969 zur Änderung
    der Verordnung (EWG) Nr. 1525/69 zur Festsetzung der ab 1. August 1969 geltenden
    Erstattungssätze bei der Ausfuhr bestimmter Getreide- und Reiserzeugnisse in
    Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1558/69 della Commissione, del 5 agosto 1969, che
    modifica il regolamento (CEE) n. 1525/69 che fissa i tassi delle restituzioni
    applicabili, a decorrere dal 1 agosto 1969, a taluni prodotti dei settori dei
    cereali e del riso esportati sotto forma di merci non comprese nell'allegato II
    del trattato
  type: main
- language: nl
  script: Latn
