    wijziging van Verordening (EEG) nr. 1525/69 houdende vaststelling van de restituties
    welke vanaf 1 augustus 1969 van toepassing zijn op bepaalde produkten in de sector
    granen en rijst, uitgevoerd in de vorm van niet in de bijlage II van het Verdrag
    vermelde goederen
