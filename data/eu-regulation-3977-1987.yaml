    oder Bestandsgruppen (1988)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3977/87 af 21. december 1987 om fastsættelse
    for 1988 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
