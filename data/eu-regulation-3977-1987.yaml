    να αλιευθούν
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3977/87 del Consiglio del 21 dicembre 1987 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche, il totale delle catture
    ammissibile per il 1988 e alcune condizioni cui è soggetta la pesca del totale
    delle catture ammissibile
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3977/87 van de Raad van 21 december 1987 inzake de
