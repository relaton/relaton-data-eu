title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 888/92 of 8 April 1992 amending for a second
    time Regulation (EEC) No 1327/89 authorizing Spain not to apply in certain areas
    the measures provided for in Council Regulation (EEC) No 1442/88 on the granting,
    for the 1989/90 to 1995/96 wine years, of permanent abandonment premiums in respect
    of wine-growing areas
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 888/92 de la Commission du 8 avril 1992 modifiant
    pour la deuxième fois le règlement (CEE) n 1327/89 autorisant l'Espagne à ne
    pas appliquer dans certaines zones les mesures prévues au règlement (CEE) n
    1442/88 du Conseil, relatif à l'octroi de primes d'abandon définitif de superficies
    viticoles, pour les campagnes viticoles 1989/1990 à 1995/1996
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 888/92 DER KOMMISSION vom 8. April 1992 zur zweiten
    Änderung der Verordnung (EWG) Nr. 1327/89 zur Ermächtigung Spaniens, in bestimmten
    Gebieten die mit der Verordnung (EWG) Nr. 1442/88 des Rates über die Gewährung
    von Prämien zur endgültigen Aufgabe von Rebflächen vorgesehenen Maßnahmen
    in den Weinwirtschaftsjahren 1989/90 bis 1995/96 nicht anzuwenden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 888/92 af 8. april 1992 om anden ændring
    af forordning (EØF) nr. 1327/89 om bemyndigelse af Spanien til i visse zoner
    ikke at anvende foranstaltningerne i forordning (EØF) nr. 1442/88 om ydelse for
    produktionsårene 1989/90 til 1995/96 af præmier for endelig nedlæggelse af
    vinarealer #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 888/92 της Επιτροπής
    της 8ης Απριλίου 1992 για την τροποποίηση για
    δεύτερη φορά του κανονισμού (ΕΟΚ) αριθ. 1327/89
    που επιτρέπει στην Ισπανία να μην εφαρμόσει
    σε ορισμένες ζώνες τα μέτρα που προβλέπονται
    στον κανονισμό (ΕΟΚ) αριθ. 1442/88 του Συμβουλίου
    για τη χορήγηση, για τις αμπελουργικές περιόδους
    1989/90 έως 1995/96, πριμοδοτήσεων για οριστική εγκατάλειψη
    αμπελουργικών εκτάσεων
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 888/92, annettu 8 päivänä huhtikuuta 1992,
    luvan antamisesta Espanjalle olla noudattamatta tietyillä alueilla lopullista
    viininviljelyaloista luopumista koskevan palkkion myöntämisestä viinivuosiksi
    1988/1989-1995/1996 annetussa neuvoston asetuksessa (ETY) N:o 1442/88 säädettyjä
    toimenpiteitä annetun asetuksen (ETY) N:o 1327/89 muuttamisesta toisen kerran
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 888/92 DELLA COMMISSIONE dell'' 8 aprile 1992 recante
    secondo modifica del regolamento (CEE) n. 1327/89 che autorizza la Spagna a non
    applicare in alcune zone le misure di cui al regolamento (CEE) n. 1442/88 del
    Consiglio, relativo alla concessione, per le campagne viticole 1989/1990 - 1995/1996,
    di premi di abbandono definitivo di superfici viticole #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 888/92 VAN DE COMMISSIE van 8 april 1992 tot tweede
    wijziging van Verordening (EEG) nr. 1327/89 waarbij Spanje gemachtigd wordt in
    bepaalde gebieden de maatregelen als bedoeld in Verordening (EEG) nr. 1442/88
    van de Raad inzake de toekenning van premies voor definitieve stopzetting van
    de wijnbouw op wijnbouwareaal in de wijnoogstjaren 1989/1990 tot en met 1995/1996
    niet toe te passen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 888/92 DA COMISSÃO de 8 de Abril de 1992 que altera
    pela segunda vez o Regulamento (CEE) no 1327/89, que autoriza a Espanha a não
    aplicar, em certas zonas, as medidas previstas no Regulamento (CEE) no 1442/88
    do Conselho, relativo à concessão, para as campanhas vitícolas de 1989/1990
    a 1995/1996, de prémios de abandono definitivo de superfícies vitícolas #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 888/92 DE LA COMISIÓN de 8 de abril de 1992 que modifica
    por segunda vez el Reglamento (CEE) no 1327/89 por el que se autoriza a España
    para no aplicar en algunas zonas las medidas establecidas en el Reglamento (CEE)
    no 1442/88 del Consejo sobre la concesión, para las campañas vitivinícolas
    de 1988/89 a 1995/96, de la prima por abandono definitivo de superficies vitícolas
    #'
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 888/92 av den 8 april 1992 om ändring
    för andra gången av förordning (EEG) nr 1327/89 om bemyndigande för Spanien
    att inom vissa områden inte tillämpa de åtgärder som föreskrivs i förordning
    (EEG) nr 1442/88 om beviljande för produktionsåren 1989/1990-1995/1996 av bidrag
    för slutgiltig nedläggning av vinodlingsarealer
