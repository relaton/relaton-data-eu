    opatření pro toto odvětví a mění nařízení (EHS) č. 878/77 o přepočítacích
    koeficientech používaných v zemědělství
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2580/78 af 31. oktober 1978 om forlængelse
