title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2580/78 of 31 October 1978 extending the 1977/78
    marketing year for olive oil, providing for special measures for this sector,
    and amending Regulation (EEC) No 878/77 as regards the exchange rates to be applied
    in agriculture
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2580/78 du Conseil, du 31 octobre 1978, prolongeant
    la campagne de commercialisation 1977/1978 pour l'huile d'olive, prévoyant des
    mesures particulières dans ce secteur et modifiant le règlement (CEE) n° 878/77
    relatif aux taux de change à appliquer dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2580/78 des Rates vom 31. Oktober 1978 zur Verlängerung
    des Wirtschaftsjahres 1977/78 für Olivenöl, über Sondermaßnahmen auf diesem
    Sektor und zur Änderung der Verordnung (EWG) Nr. 878/77 über die in der Landwirtschaft
    anzuwendenden Umrechnungskurse
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (EHS) č. 2580/78 ze dne 31. října 1978, kterým se
