title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1358/2000 of 27 June 2000 determining the
    extent to which applications lodged in June 2000 for import rights in respect
    of frozen beef intended for processing may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1358/2000 de la Commission du 27 juin 2000 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juin 2000 pour les viandes bovines congelées destinées
    à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1358/2000 der Kommission vom 27. Juni 2000 über den
    Umfang, in dem den im Monat Juni 2000 eingereichten Anträgen auf Einfuhrrechte
    für zur Verarbeitung bestimmtes gefrorenes Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1358/2000 af 27. juni 2000 om fastsættelse
    af, i hvilken udstrækning anmodninger om importrettigheder, indgivet i juni 2000
    for frosset oksekød til forarbejdning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1358/2000 της Επιτροπής,
    της 27ης Ιουνίου 2000, ο οποίος καθορίζει σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    δικαιώματος εισαγωγής που κατατέθηκαν τον
    Ιούνιο του 2000 για τα κατεψυγμένα βόεια κρέατα
    που προορίζονται για μεταποίηση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1358/2000, annettu 27 päivänä kesäkuuta 2000,
    kesäkuussa 2000 jätetyistä, jalostettavaksi tarkoitettua jäädytettyä naudanlihaa
    koskevista tuontioikeushakemuksista
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1358/2000 della Commissione, del 27 giugno 2000, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto di
    importazione presentate nel mese di giugno 2000 per le carni bovine congelate
    destinate alla trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1358/2000 van de Commissie van 27 juni 2000 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in juni 2000 ingediende
    aanvragen om invoerrechten voor bevroren rundvlees, bestemd voor verwerking
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1358/2000 da Comissão, de 27 de Junho de 2000, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados em Junho de 2000 para carne de bovino congelada destinada à transformação
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1358/2000 de la Comisión, de 27 de junio de 2000,
    por el que se determina en qué medida podrá darse curso a las solicitudes de
    derechos de importación presentadas hasta el mes de junio de 2000 para las carnes
    de vacuno congeladas destinadas a la transformación
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1358/2000 av den 27 juni 2000 om i vilken
    utsträckning ansökningar om importavgifter som lämnats in under juni 2000 för
    fruset nötkött för bearbetning kan godkännas
  type: main
