title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3540/84 of 17 December 1984 re-establishing
    the levying of customs duties on certain hat-forms, plateaux and manchons of felt,
    of fur felt or felt of wool and fur, falling within subheading 65.01 A, originating
    in Brazil, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3569/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3540/84 de la Commission du 17 décembre 1984 portant
    rétablissement de la perception des droits de douane applicables à certaines
    cloches non dressées, plateaux et manchons pour chapeaux en feutre de poils ou
    de laine et poils, de la sous-position 65.01 A du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3569/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3540/84 der Kommission vom 17. Dezember 1984 zur Wiedereinführung
    der Erhebung der Zölle für Hutstumpen aus Filz, nicht geformt; Hutplatten, Bandeaux,
    aus Haarfilz oder aus Woll-Haarfilz, der Tarifstelle 65.01 A, mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 3569/83 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3540/84 af 17. december 1984 om genindførelse
    af opkrævning af told for bestemte hattestumper af filt, plane og cylindriske
    hatteemner, af hårfilt eller en blanding af hårfilt og uldfilt, henhørende
    under pos. 65.01 A og med oprindelse i Brasilien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3569/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3540/84 της Επιτροπής
    της 17ης Δεκεμβρίου 1984 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για κώδωνες, δίσκους και
    κυλίνδρους διά πίλους, εκ πιλήματος εκ τριχών
    ή εξ ερίου και τριχών, της διακρίσεως 65.01 Α του
    Κοινού Δασμολογίου, καταγωγής Βραζιλίας, δικαιούχου
    των προβλεπομένων από τον κανονισμό (ΕΟΚ) αριθ.
    3569/83 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3540/84 della Commissione del 17 dicembre 1984 che
    ripristina la riscossione dei dazi doganali applicabili alle campane non formate,
    né cerchiate, dischi o piatti, manicotti o cilindri anche tagliati nel senso
    dell' altezza, di feltro, per cappelli di feltro di peli o di lana e peli, della
    sottovoce 65.01 A della tariffa doganale comune, originari del Brasile beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3569/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3540/84 van de Commissie van 17 december 1984 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op bepaalde hoedvormen,
    schijfvormige ,,plateaux' ' en cilindervormige ,,manchons' ' , van vilt voor hoeden,
    van haarvilt of van vilt uit haar en wol, van post 65.01 A van het gemeenschappelijk
    douanetarief, van oorsprong uit Brazilië, waarvoor de in Verordening (EEG) nr.
    3569/83 van de Raad vermelde tariefpreferenties zijn verleend
