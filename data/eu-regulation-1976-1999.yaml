title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1976/1999 of 13 September 1999 amending Regulation
    (EEC) No 2717/93 imposing a definitive anti-dumping duty on imports of ferro-chrome
    with a carbon content by weight of maximum 0,5 % (low carbon ferro-chrome), originating
    in Kazakhstan, Russia and Ukraine
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1976/1999 du Conseil, du 13 septembre 1999, modifiant
    le règlement (CEE) nº 2717/93 instituant un droit antidumping définitif sur
    les importations de ferrochrome d'une teneur maximale en carbone de 0,5 % en poids
    (ferrochrome à faible teneur en carbone), originaire du Kazakhstan, de Russie
    et d'Ukraine
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1976/1999 des Rates vom 13. September 1999 zur Änderung
    der Verordnung (EWG) Nr. 2717/93 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Ferrochrom mit einem Kohlenstoffgehalt von 0,5 GHT oder
    weniger (kohlenstoffarmes Ferrochrom) mit Ursprung in Kasachstan, Rußland und
    der Ukraine
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1976/1999 af 13. september 1999 om ændring
    af forordning (EØF) nr. 2717/93 om indførelse af en endelig antidumpingtold
    på importen af ferrochrom med et kulstofindhold på højst 0,5 vægtprocent (ferrochrom
    med lavt kulstofindhold) med oprindelse i Kasakhstan, Rusland og Ukraine
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1976/1999 του Συμβουλίου,
    της 13ης Σεπτεμβρίου 1999, για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 2717/93 για την επιβολή
    οριστικού δασμού αντιντάμπινγκ στις εισαγωγές
    σιδηροχρωμίου με μέγιστη περιεκτικότητα κατά
    βάρος σε άνθρακα 0,5 % (σιδηροχρώμιο χαμηλής
    περιεκτικότητας σε άνθρακα) καταγωγής Καζακστάν,
    Ρωσίας και Ουκρανίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1976/1999, annettu 13 päivänä syyskuuta 1999,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kazakstanista, Venäjältä
    ja Ukrainasta peräisin olevan hiilipitoisuudeltaan enintään 0,5-painoprosenttisen
    ferrokromin (matalahiilipitoisen ferrokromin) tuonnissa anntetun asetuksen (ETY)
    N:o 2717/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1976/1999 del Consiglio, del 13 settembre 1999, che
    modifica il regolamento (CEE) n. 2717/93 che istituisce un dazio antidumping definitivo
    sulle importazioni di ferrocromo con un tenore massimo di carbonio dello 0,5 %
    in peso (ferrocromo a basso tenore di carbonio) originario del Kazakistan, della
    Russia e dell'Ucraina
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1976/1999 van de Raad van 13 september 1999 tot wijziging
    van Verordening (EEG) nr. 2717/93 tot instelling van een definitief antidumpingrecht
    op de invoer van ferrochroom met een koolstofgehalte van ten hoogste 0,5 gewichtspercent
    (ferrochroom met laag koolstofgehalte), van oorsprong uit Kazachstan, de Oekraïne
    en Rusland
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1976/1999 do Conselho, de 13 de Setembro de 1999,
    que altera o Regulamento (CEE) n° 2717/93 que institui um direito anti-dumping
    definitivo sobre as importações de ferro-crómio com um teor máximo de carbono
    de 0,5 %, em peso, (ferro-crómio com baixo teor de carbono) originário do Cazaquistão,
    da Rússia e da Ucrânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1976/1999 del Consejo, de 13 de septiembre de 1999,
    que modifica el Reglamento (CEE) nº 2717/93 por el que se establece un derecho
    antidumping definitivo sobre las importaciones de ferrocromo con un contenido
    de carbono en peso no superior al 0,5 % (ferrocromo con bajo contenido de carbono)
