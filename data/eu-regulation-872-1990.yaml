title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 872/90 of 3 April 1990 amending the list
    annexed to Regulation (EEC) No 3699/89 establishing for 1990 the list of vessels
    exceeding eight metres length overall permitted to fish for sole in certain of
    the Community areas using beam trawls whose aggregate length exceeds nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 872/90 de la Commission du 3 avril 1990 modifiant
    la liste annexée au règlement (CEE) n° 3699/89 établissant pour 1990 la liste
    des bateaux dont la longueur hors tout dépasse huit mètres, autorisés à pêcher
    la sole dans certaines zones de la Communauté à l'aide de chaluts à perches
    dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 872/90 DER KOMMISSION vom 3. April 1990 zur Aenderung
    der Liste im Anhang der Verordnung (EWG) Nr. 3699/89 zur Festlegung der Liste
    fuer 1990 der Schiffe mit einer Laenge ueber alles von mehr als 8 m, die in bestimmten
    Zonen der Gemeinschaft beim Seezungenfang Baumkurren verwenden duerfen, deren
    Gesamtbaumlaenge mehr als 9 m betraegt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 872/90 af 3. april 1990 om ændring
    af den liste, der er knyttet som bilag til forordning (EØF) nr. 3699/89 om listen
    for 1990 over fartøjer med en længde overalt på over 8 m, der ved fiskeri efter
    tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 m
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 872/90 της Επιτροπής
    της 3ης Απριλίου 1990 για την τροποποίηση του
    καταλόγου που είναι προσαρτημένος στον κανονισμό
    (ΕΟΚ) αριθ. 3699/89 για την κατάρτιση για το 1990 του
    καταλόγου των σκαφών συνολικού μήκους άνω
    των οκτώ μέτρων, τα οποία επιτρέπεται να χρησιμοποιούν,
    για την αλιεία γλώσσας σε ορισμένες περιοχές
    της Κοινότητας, δοκοτράτες, το συνολικό μήκος
    των οποίων υπερβαίνει τα εννέα μέτρα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 872/90 DELLA COMMISSIONE del 3 aprile 1990 recante
    modifica dell'elenco allegato al regolamento (CEE) n. 3699/89 che fissa per il
    1990 l'elenco dei pescherecci di lunghezza fuori tutto superiore a otto metri,
    autorizzati a pescare la sogliola in determinate zone della Comunità con reti
    a strascico a pali di lunghezza complessiva superiore a nove metri
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 872/90 VAN DE COMMISSIE van 3 april 1990 houdende
    wijziging van de lijst in de bijlage bij Verordening (EEG) nr. 3699/89 tot vaststelling
    van de voor 1990 geldende lijst van vaartuigen met een lengte over alles van meer
    dan 8 meter en die in bepaalde zones van de Gemeenschap op tong mogen vissen met
    boomkorren waarvan de totale boomlengte meer dan 9 meter bedraagt
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 872/90 DA COMISSAO de 3 de Abril de 1990 que altera
    a lista anexa ao Regulamento (CEE) n* 3699/89 que estabelece, para 1990, a lista
    dos navios com mais de oito metros de comprimento de fora a fora autorizados a
    pescar o linguado em determinadas zonas da Comunidade com redes de arrasto de
    vara em que o comprimento total das varas seja superior a nove metros
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 872/90 DE LA COMISION de 3 de abril de 1990 que modifica
    la lista aneja al Reglamento (CEE) no 3699/89 por el que se establece para 1990
    la lista de barcos cuya eslora total exceda los ocho metros y a los que se permite
    pescar el lenguado en determinadas zonas de la Comunidad utilizando artes de arrastre
    de vara cuya longitud total supere los nueve metros
  type: main
