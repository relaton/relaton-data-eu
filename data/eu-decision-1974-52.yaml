title:
- language: en
  script: Latn
  content: "(74/52/EEC): * Commission Decision of 21 December 1973 authorizing the French Republic to postpone the application of the Common Customs Tariff to seed potatoes"
  type: main
- language: fr
  script: Latn
  content: Décision 74/52/CEE de la Commission, du 21 décembre 1973, autorisant
    la République française à différer l'application des droits du Tarif douanier
    commun en ce qui concerne les pommes de terre de semence
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1973, mit der die Französische
    Republik ermächtigt wird, die Anwendung der Zollsätze des Gemeinsamen Zolltarifs
    für Saatkartoffeln aufzuschieben
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1973 om bemyndigelse for Den franske
    Republik til at afstå fra anvendelse af satserne i den fælles toldtarif med
    hensyn til læggekartofler
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1973, che autorizza la Repubblica
    francese a differire l'applicazione dei dazi della tariffa doganale comune per
    le patate da semina
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1973 waarbij de Franse Republiek
    wordt gemachtigd om voor pootaardappelen de toepassing van de rechten van het
    gemeenschappelijk douanetarief uit te stellen
  type: main
