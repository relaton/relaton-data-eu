title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2271/94 of 19 September 1994 amending Regulation
    (EEC) No 1781/93 imposing a definitive countervailing duty on imports of ball
    bearings with a greatest external diameter not exceeding 30 mm, originating in
    Thailand but exported to the Community from another country
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2271/94 du Conseil, du 19 septembre 1994, modifiant
    le règlement (CEE) n° 1781/93 instituant un droit compensateur définitif sur
    les importations de roulements à billes dont le plus grand diamètre extérieur
    n'excède pas 30 millimètres, originaires de Thaïlande, mais exportés vers
    la Communauté à partir d'un autre pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2271/94 des Rates vom 19. September 1994 zur Änderung
    der Verordnung (EWG) Nr. 1781/93 zur Einführung eines endgültigen Ausgleichszolls
    auf die Einfuhren von Kugellagern mit einem größten äußeren Durchmesser von
    30 mm oder weniger mit Ursprung in Thailand, aber aus einem anderen Land in die
    Gemeinschaft ausgeführt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 2271/94 af 19. september 1994 om ændring af
    forordning (EØF) nr. 1781/93 om indførelse af en endelig udligningstold på
    importen af kuglelejer med største udvendige diameter på ikke over 30 mm med
    oprindelse i Thailand, men eksporteret til Fællesskabet fra et andet land
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2271/94 του Συμβουλίου
    της 19ης Σεπτεμβρίου 1994 για την τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 1781/93 για την επιβολή
    οριστικού αντισταθμιστικού δασμού στις εισαγωγές
    ένσφαιρων τριβέων με μεγίστη εξωτερική διάμετρο
    που δεν υπερβαίνει τα 30 χιλιοστά, καταγωγής
    Ταϊλάνδης που ωστόσο εξάγονται στην Κοινότητα
    από άλλη χώρα
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2271/94, annettu 19 päivänä syyskuuta 1994,
    lopullisen tasoitustullin käyttöön ottamisesta Thaimaasta peräisin olevien
    yhteisöön muusta kolmannesta maasta vietyjen kuulalaakerien, joiden suurin ulkohalkaisija
    on enintään 30 millimetriä, tuonnissa annetun asetuksen (ETY) N:o 1781/93 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2271/94 del Consiglio, del 19 settembre 1994, che modifica
    il regolamento (CEE) n. 1781/93 del Consiglio che istituisce un dazio compensativo
    definitivo sulle importazioni di cuscinetti a sfera il cui maggior diametro esterno
    è inferiore o uguale a 30 mm, di origine tailandese ma esportati nella Comunità
    da un altro paese terzo
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2271/94 van de Raad van 19 september 1994 tot wijziging
    van Verordening (EEG) nr. 1781/93 tot instelling van een definitief compenserend
    recht op de invoer van kogellagers met een grootste externe diameter van niet
    meer dan 30 mm, van oorsprong uit Thailand doch naar de Gemeenschap uit een ander
    land uitgevoerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2271/94 do Conselho, de 19 de Setembro de 1994, que
    altera o Regulamento (CEE) nº 1781/93, que institui um direito de compensação
    definitivo sobre as importações de rolamentos de esferas cujo maior diâmetro
    exterior não exceda 30 milímetros, originários da Tailândia mas exportados
    para a Comunidade a partir de outro país
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2271/94 del Consejo, de 19 de septiembre de 1994, por
    el que se modifica el Reglamento (CEE) nº 1781/93 por el que se establece un
    derecho compensatorio definitivo sobre las importaciones de rodamientos de bolas
    cuyo mayor diámetro exterior no exceda de 30 mm, originarios de Tailandia pero
    exportados a la Comunidad desde otro país
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2271/94 av den 19 september 1994 om ändring
    av förordning (EEG) nr 1781/93 om införande av en slutgiltig utjämningstull
    på import av kullager med en största yttre diameter på högst 30 mm med ursprung
    i Thailand, men som exporteras till gemenskapen från ett annat land
  type: main
