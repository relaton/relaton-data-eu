    und 40.0180) mit Ursprung in Pakistan, für die die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1510/93 af 18. juni 1993 om genindførelse
    af opkrævning af told for varer under kategori 6 og 18 (løbenummer 40.0060 og
    40.0180), som har oprindelse i Pakistan og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
