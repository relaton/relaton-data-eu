  content: COMMISSION REGULATION (EEC) No 1510/93 of 18 June 1993 re-establishing
    the levying of customs duties on products of categories 6 and 18 (order Nos 40.0060
    and 40.0180), originating in Pakistan, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1510/93 de la Commission du 18 juin 1993 portant rétablissement
    de la perception des droits de douane applicables aux produits des catégories
    6 et 18 (numéros d'ordre 40.0060 et 40.0180) originaires du Pakistan, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1510/93 DER KOMMISSION vom 18. Juni 1993 zur Wiedereinführung
