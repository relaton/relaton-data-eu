title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 1218/2014 of 13 November 2014
    amending Annexes I and II to Regulation (EU) No 206/2010 as regards animal health
    requirements for Trichinella in the model of veterinary certificate for imports
    into the Union of domestic porcine animals intended for breeding, production or
    slaughter, and of fresh meat thereof
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 1218/2014 de la Commission du 13 novembre
    2014 modifiant les annexes I et II du règlement (UE) n ° 206/2010 en ce qui
    concerne les exigences de police sanitaire liées à la présence de Trichinella
    prévues dans le modèle des certificats vétérinaires relatifs aux importations
    dans l'Union de porcins domestiques destinés à l'élevage, à la rente ou à
    l'abattage ainsi que de viandes fraîches de tels animaux
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 1218/2014 der Kommission vom 13. November
    2014 zur Änderung der Anhänge I und II der Verordnung (EU) Nr. 206/2010 hinsichtlich
    der Tiergesundheitsanforderungen in Bezug auf Trichinen in der Muster-Veterinärbescheinigung
    für Einfuhren von Hausschweinen für Zuchtzwecke, Nutzzwecke oder zur Schlachtung
    sowie frischen Fleisches von Hausschweinen in die Union
  type: main
- language: bg
  script: Cyrl
