    riguarda le condizioni di polizia sanitaria relative alla presenza di Trichine
    nel modello di certificato veterinario per le importazioni nell'Unione di suini
    domestici destinati all'allevamento, alla produzione o alla macellazione, e delle
    loro carni fresche
  type: main
