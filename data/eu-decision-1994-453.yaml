id: EUDecision1994453
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '94/453/EC: Commission Decision of 29 June 1994 amending or repealing some
    detailed rules concerning the animal health and public health conditions required
    for imports of certain live animals and animal products from Austria, Finland,
    Norway and Sweden in application of the European Economic Area Agreement'
  type: main
- language: fr
  script: Latn
  content: '94/453/CE: Décision de la Commission du 29 juin 1994 modifiant ou abrogeant
    certaines modalités d''application concernant les conditions de santé animale
    et santé publique requises pour l''importation de certains animaux vivants et
    produits d''origine animale en provenance d''Autriche, de Finlande, de Norvège
    et de Suède en application de l''accord sur l''Espace économique européen'
  type: main
- language: de
  script: Latn
  content: '94/453/EG: Entscheidung der Kommission vom 29. Juni 1994 zur Abänderung
    und Aufhebung einzelner Regeln bezüglich der tierseuchenrechtlichen und gesundheitlichen
    Bedingungen für die Einfuhr bestimmter lebender Tiere und Erzeugnisse tierischer
    Herkunft aus Österreich, Finnland, Norwegen und Schweden in Anwendung des Abkommens
    über den Europäischen Wirtschaftsraum'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 29 юни 1994 година
    за изменение или отмяна на някои подробни правила
    относно ветеринарно-санитарните и здравните
    изисквания за вноса на определени живи животни
    и животински продукти от Австрия, Финландия,
    Норвегия и Швеция при прилагане на Споразумението
    за Европейското икономическо пространство
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 29. června 1994, kterým se mění nebo zrušují
    některá prováděcí pravidla týkající se veterinárních a hygienických
    podmínek pro dovoz některých živých zvířat a produktů živočišného
    původu z Finska, Norska, Rakouska a Švédska v důsledku provádění Dohody
    o Evropském hospodářském prostoru
  type: main
- language: da
  script: Latn
  content: '94/453/EF: Kommissionens beslutning af 29. juni 1994 om ændring eller
    ophævelse af visse nærmere bestemmelser vedrørende de dyresundhedsmæssige
    og sundhedsmæssige betingelser for indførsel af visse levende dyr og animalske
    produkter fra Finland, Norge, Sverige og Østrig i henhold til aftalen om Det
    Europæiske Økonomiske Samarbejdsområde'
  type: main
- language: el
  script: Grek
  content: '94/453/ΕΚ: Απόφαση της Επιτροπής της 29ης Ιουνίου
    1994 σχετικά με την τροποποίηση ή κατάργηση ορισμένων
    λεπτομερών διατάξεων όσον αφορά τους όρους
    υγειονομικού κτηνιατρικού ελέγχου καθώς και
    τους υγειονομικούς όρους που απαιτούνται για
    τις εισαγωγές ορισμένων ζώντων ζώων και προϊόντων
    ζωικής προέλευσης από την Αυστρία, τη Φινλανδία,
    τη Νορβηγία και τη Σουηδία κατ'' εφαρμογή της
    συμφωνίας σχετικά με τον Ευρωπαϊκό Οικονομικό
    Χώρο'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 29. juuni 1994, millega muudetakse või tunnistatakse
    kehtetuks mõningad üksikasjalikud eeskirjad seoses loomatervishoiu ja tervisekaitse
    nõuetega, mis kehtivad teatavate elusloomade ja loomsete saaduste impordil Austriast,
    Soomest, Norrast ja Rootsist vastavalt Euroopa Majanduspiirkonna lepingule
  type: main
- language: hr
  script: Latn
  content: '94/453/EZ: Odluka Komisije od 29. lipnja 1994. o izmjeni ili stavljanju
    izvan snage nekih detaljnih pravila o uvjetima zdravlja životinja i javnog zdravlja
    potrebnima za uvoz određenih živih životinja i životinjskih proizvoda iz Austrije,
    Finske, Norveške i Švedske u primjeni Sporazuma o Europskom gospodarskom prostoru'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (1994. június 29.) az Európai Gazdasági Térség
    Megállapodás alkalmazásában az Ausztriából, Finnországból, Norvégiából
    és Svédországból származó egyes élő állatok és állati termékek behozatalára
    előírt állat-egészségügyi és közegészségügyi feltételeket érintő
    egyes részletes szabályok módosításáról vagy hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: '94/453/CE: Decisione della Commissione del 29 giugno 1994 che modifica
    o revoca alcune disposizioni concernenti le condizioni sanitarie e di polizia
    zoosanitaria per l''importazione di animali vivi e prodotti di origine animale
    provenienti dall''Austria, dalla Finlandia, dalla Norvegia e dalla Svezia, in
    applicazione dell''accordo sullo Spazio economica europeo'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (1994. gada 29. jūnijs), ar ko groza vai atceļ dažus
    sīki izstrādātus noteikumus par dzīvnieku veselības un sabiedrības veselības
    aizsardzības nosacījumiem attiecībā uz konkrētu dzīvu dzīvnieku un dzīvnieku
    valsts produktu ievešanu no Austrijas, Somijas, Norvēģijas un Zviedrijas, piemērojot
    Eiropas Ekonomikas zonas līgumu
  type: main
- language: lt
  script: Latn
  content: 1994 m. birželio 29 d. Komisijos Sprendimas iš dalies keičiantis arba
    panaikinantis tam tikras išsamias taisykles, susijusias su gyvūnų sveikatos
    ir visuomenės sveikatos reikalavimais, taikomais importuojant tam tikrus gyvus
    gyvūnus ir gyvūninės kilmės produktus iš Austrijos, Suomijos Norvegijos ir
    Švedijos taikant Europos ekonominės erdvės susitarimą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tad-29 ta' Ġunju 1994 li temenda jew tħassar
    uħud mir-regoli ddettaljati dwar il-kondizzjonijiet tas-saħħa ta' l-annimali
    u tas-saħħa pubblika meħtieġa għall-importazzjonijiet ta' ċerti bhejjem
    ħajjin u prodotti mill-bhejjem mill-Awstrija, il-Finlandja, in-Norveġja u l-Isvezja
    fl-applikazzjoni tal-Ftehim dwar Iż-Żona Ekonomika Ewropea
  type: main
- language: nl
  script: Latn
  content: '94/453/EG: Beschikking van de Commissie van 29 juni 1994 houdende wijziging
    of intrekking van enkele bepalingen betreffende de veterinairrechtelijke voorschriften
    en de gezondheidsvoorschriften voor de invoer van bepaalde levende dieren en dierlijke
    produkten uit Oostenrijk, Finland, Noorwegen en Zweden, ter uitvoering van de
    Overeenkomst betreffende de Europese Economische Ruimte'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 29 czerwca 1994 r. zmieniająca lub uchylająca
    poszczególne szczegółowe przepisy dotyczące warunków zdrowotnych zwierząt
    i warunków zdrowia publicznego przy przywozie niektórych żywych zwierząt oraz
    produktów zwierzęcych z Austrii, Finlandii, Norwegii i Szwecji w zastosowaniu
    Porozumienia o Europejskim Obszarze Gospodarczym
  type: main
- language: pt
  script: Latn
  content: '94/453/CE: Decisão da Comissão de 29 de Junho de 1994 que altera ou
    que revoga determinadas normas de execução relativas às condições sanitárias
    e de polícia sanitária exigidas na importação de determinados animais vivos
    e produtos de origem animal da Ãustria, Finlândia, Noruega e Suécia, em aplicação
    do Acordo sobre o Espaço Económico Europeu'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 29 iunie 1994 de modificare sau de abrogare a unor
    norme de aplicare în ceea ce privește condițiile de sănătate publică și
    animală necesare la importul anumitor animale vii și produse de origine animală
    provenind din Austria, Finlanda, Norvegia și Suedia în aplicarea Acordului privind
    Spațiul Economic European
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 29. júna 1994, ktorým sa menia a dopĺňajú alebo
    rušia niektoré podrobné pravidlá týkajúce sa podmienok na zdravie zvierat
    a zdravie ľudí vyžadovaných v súvislosti s dovozmi určitých živých zvierat
    a živočíšnych produktov z Rakúska, Fínska, Nórska a Švédska pri uplatňovaní
    Dohody o Európskom hospodárskom priestore
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 29. junija 1994 o spremembi ali razveljavitvi nekaterih
    podrobnih pravil o pogojih zdravstvenega varstva živali in ljudi, potrebnih za
    uvoz nekaterih živih živali in proizvodov živalskega izvora iz Avstrije, Finske,
    Norveške in Švedske pri uporabi Sporazuma o Evropskem gospodarskem prostoru
  type: main
- language: es
  script: Latn
  content: '94/453/CE: Decisión de la Comisión de 29 de junio de 1994 por la que
    se modifican o derogan determinadas disposiciones referidas a las condiciones
    zoo sanitarias y de salubridad aplicables a las importaciones de algunos animales
    vivos y productos animales procedentes de Austria, Finlandia, Noruega y Suecia,
    en aplicación del Acuerdo sobre el Espacio Económico Europeo'
  type: main
