    βοείου κατεψυγμένου κρέατος οι οποίες προορίζονται
    για μεταποίηση και είναι δυνατόν να εισαχθούν
    υπό ειδικούς όρους το τρίτο τρίμηνο του 1982
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1655/82 della Commissione, del 25 giugno 1982, che
    fissa le quantità di carni bovine congelate, destinate alla trasformazione, che
    possono essere importate a condizioni speciali per il terzo trimestre 1982
  type: main
- language: nl
