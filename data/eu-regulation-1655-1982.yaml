  content: Commission Regulation (EEC) No 1655/82 of 25 June 1982 fixing the quantities
    of frozen beef intended for processing which may be imported on special conditions
    for the third quarter of 1982
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1655/82 de la Commission, du 25 juin 1982, fixant les
    quantités de viandes bovines congelées destinées à la transformation pouvant
    être importées à des conditions spéciales pour le troisième trimestre de
    1982
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1655/82 der Kommission vom 25. Juni 1982 zur Festsetzung
    der zur Verarbeitung bestimmten Mengen gefrorenen Rindfleisches, die für das
    dritte Vierteljahr 1982 unter Sonderbedingungen eingeführt werden dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1655/82 af 25. juni 1982 om fastsættelse
    af de mængder frosset oksekød til forarbejdning, der kan indføres på særlige
    vilkår i tredje kvartal af 1982
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1655/82 της Επιτροπής
