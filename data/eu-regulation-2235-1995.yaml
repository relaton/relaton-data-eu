title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2235/95 of 21 September 1995 determining
    to what extent licence applications submitted during August 1995 for live bovine
    animals weighing between 160 and 300 kg as part of a tariff quota provided for
    under European agreements concluded between the Community and the Republic of
    Poland, the Republic of Hungary, the Czech Republic and Slovakia may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2235/95 DE LA COMMISSION du 21 septembre 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en août 1995 pour les animaux vivants de l'espèce bovine d'un poids
    de 160 à 300 kilogrammes dans le cadre d'un contingent tarifaire prévu par les
    accords européens conclus par la Communauté avec la république de Pologne,
    la république de Hongrie, la République tchèque et la Slovaquie
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2235/95 DER KOMMISSION vom 21. September 1995 zur Festsetzung
    des Umfangs, in dem die im August 1995 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder im Rahmen von Zollkontingenten gemäß den Europa-Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik und der Slowakei beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2235/95 af 21. september 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i august 1995 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et toldkontingent, der er fastsat i Europaaftalerne mellem Fællesskabet og
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik og Den Slovakiske
    Republik
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2235/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Σεπτεμβρίου 1995 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Αύγουστο 1995 για ζωντανά ζώα του
    βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας δασμολογικής ποσόστωσης η
    οποία προβλέπεται από τις ευρωπαϊκές συμφωνίες
    που έχουν συναφθεί μεταξύ, αφενός, της Κοινότητας
    και, αφετέρου, της Δημοκρατίας της Πολωνίας,
    της Δημοκρατίας της Ουγγαρίας, της Τσεχικής
    Δημοκρατίας και της Σλοβακίας
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2235/95, annettu 21 päivänä syyskuuta 1995,
    eläviä 160@300 kilogrammaa painavia nautaeläimiä koskevien elokuussa 1995
    jätettyjen tuontilupahakemusten hyväksyttävyydestä yhteisön ja Puolan tasavallan,
