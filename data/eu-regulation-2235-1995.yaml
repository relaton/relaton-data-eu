    sopimuksissa määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2235/95 DELLA COMMISSIONE del 21 settembre 1995 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di agosto 1995 per gli animali vivi della specie bovina, dai
    160 ai 300 chilogrammi, nel quadro del contingente tariffario previsto dagli accordi
    europei conclusi dalla Comunità con la Repubblica di Polonia, la Repubblica d'Ungheria,
    la Repubblica Ceca e la Slovacchia
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2235/95 VAN DE COMMISSIE van 21 september 1995 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor levende runderen met een gewicht van 160 tot 300 kg, die
    in augustus 1995 zijn ingediend op grond van een tariefcontingent dat is vastgesteld
    in de door de Gemeenschap met de Republiek Polen, de Republiek Hongarije, de Tsjechische
    Republiek en Slowakije gesloten Europa-Overeenkomsten
  type: main
