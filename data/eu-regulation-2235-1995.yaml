  script: Latn
  content: REGLAMENTO (CE) N° 2235/95 DE LA COMISIÓN de 21 de septiembre de 1995
    por el que se determina la proporción en que se satisfarán las solicitudes de
    licencias de importación de animales vivos de la especie bovina con un peso entre
    160 y 300 kilogramos, presentadas en agosto de 1995 dentro de un contingente arancelario
