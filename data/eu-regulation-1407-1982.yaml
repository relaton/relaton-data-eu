title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1407/82 of 4 June 1982 re-establishing the
    levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18 and originating in Singapore, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1407/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixes, variables ou ajustables, de la position 85.18 du tarif douanier
    commun, originaires de Singapour, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1407/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für elektrische Festkondensatoren, Drehkondensatoren
    und andere einstellbare Kondensatoren der Tarifnummer 85.18, mit Ursprung in Singapur,
    dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1407/82 af 4. juni 1982 om genindførelse
    af opkrævning af told for elektriske kondensatorer, faste eller variable, henhørende
    under pos. 85.18 og med oprindelse i Singapore, som er præferenceberettiget i
    henhold til Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1407/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά ηλεκτρικούς πυκνωτές,
    σταθερούς, μεταβλητούς ή ρυθμιζόμενους τής
    κλάσεως 85. 18 τού Κοινού Δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1407/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce 85.18 della tariffa doganale comune,
    originari di Singapore, beneficiario delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1407/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op elektrische
    condensatoren (vaste condensatoren, draaicondensatoren en regelbare of instelbare
    condensatoren) van tariefpost 85.18, van oorsprong uit Singapore, waarvoor de
    in Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
