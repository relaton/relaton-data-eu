title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1722/92 of 30 June 1992 postponing the date
    for the take-over of beef and veal offered for sale by the intervention agencies
    pursuant to Regulation (EEC) No 2848/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1722/92 de la Commission du 30 juin 1992 reportant
    la date de prise en charge de la viande bovine mise en vente par les organismes
    d'intervention au titre du règlement (CEE) n° 2848/89
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1722/92 DER KOMMISSION vom 30. Juni 1992 zur Verschiebung
    des Übernahmetermins für von den Interventionsstellen nach der Verordnung (EWG)
    Nr. 2848/89 zum Verkauf angebotenes Rindfleisch #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1722/92 af 30. juni 1992 om anvendelse
    af senere overtagelsesdato på kød udbudt til salg af interventionsorganerne
    i henhold til forordning (EØF) nr. 2848/89 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1722/92 της Επιτροπής
    της 30ής Ιουνίου 1992 περί μεταφοράς της ημερομηνίας
    του βοείου κρέατος που τέθηκε προς πώληση από
    τους οργανισμούς παρέμβασης δυνάμει του κανονισμού
    (ΕΟΚ) αριθ. 2848/89
  type: main
- language: it
  script: Latn
  content: "#REGOLAMENTO (CEE) N. 1722/92 DELLA COMMISSIONE del 30 giugno 1992 che rinvia la data di presa in consegna delle carni bovine messe in vendita dagli organismi d' intervento a titolo del regolamento (CEE) n. 2848/89 #"
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1722/92 VAN DE COMMISSIE van 30 juni 1992 houdende
    verschuiving van de overnamedatum voor door de interventiebureaus krachtens Verordening
    (EEG) nr. 2848/89 te koop aangeboden rundvlees #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1722/92 DA COMISSÃO de 30 de Junho de 1992 que adia
    a data da tomada a cargo da carne de bovino posta à venda pelos organismos de
    intervenção ao abrigo do Regulamento (CEE) no 2848/89 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1722/92 DE LA COMISIÓN de 30 de junio de 1992 por
    el que se retrasa la fecha en que los organismos de intervención se han hecho
    cargo de la carne de vacuno puesta a la venta por los organismos de intervención
    en virtud del Reglamento (CEE) no 2848/89 #'
  type: main
