title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1143/80 of 6 May 1980 re-establishing the
    levying of customs duties on woven fabrics of silk, products of category 136 (code
    1360), originating in India, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1143/80 de la Commission, du 6 mai 1980, portant rétablissement
    de la perception des droits de douane applicables aux tissus de soie de la catégorie
    de produits n° 136 (code 1360), originaires de l' Inde, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1143/80 der Kommission vom 6. Mai 1980 über die Wiedereinführung
    des Zollsatzes für Gewebe aus Seide der Warenkategorie Nr. 136 (Kennziffer 1360),
    mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1143/80 af 6. maj 1980 om genindførelse
    af opkrævning af toldafgifter for vævet stof af natursilke, under varekategori
    136 (kode 1360), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1143/80 della Commissione, del 6 maggio 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti di seta della
    categoria di prodotti n. 136 (codice 1360), originari dell' India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1143/80 van de Commissie van 6 mei 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van zijde, van de categorie van produkten nr. 136 (codenummer 1360), van oorsprong
    uit India waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening
    (EEG) nr. 2894/79 van de Raad
  type: main
