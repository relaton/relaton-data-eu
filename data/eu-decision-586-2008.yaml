---
id: EUDecision5862008
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Decision No 586/2008/EC of the European Parliament and of the Council of
    17 June 2008 amending Decision No 896/2006/EC establishing a simplified regime
    for the control of persons at the external borders based on the unilateral recognition
    by the Member States of certain residence permits issued by Switzerland and Liechtenstein
    for the purpose of transit through their territory
  type: main
- language: fr
  script: Latn
  content: Décision n o 586/2008/CE du Parlement européen et du Conseil du 17 juin
    2008 modifiant la décision n o 896/2006/CE établissant un régime simplifié
    de contrôle des personnes aux frontières extérieures, fondé sur la reconnaissance
    unilatérale par les États membres, aux fins de transit par leur territoire,
    de certains titres de séjour délivrés par la Suisse et le Liechtenstein
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 586/2008/EG des Europäischen Parlaments und des Rates
    vom 17. Juni 2008 zur Änderung der Entscheidung Nr. 896/2006/EG zur Einführung
    einer vereinfachten Regelung für die Personenkontrollen an den Außengrenzen,
    die darauf beruht, dass die Mitgliedstaaten bestimmte von der Schweiz und von
    Liechtenstein ausgestellte Aufenthaltserlaubnisse für die Zwecke der Durchreise
    durch ihr Hoheitsgebiet einseitig anerkennen
  type: main
- language: bg
  script: Cyrl
  content: Решение № 586/2008/ЕО на Европейския парламент
    и на Съвета от 17 юни 2008 година за изменение
    на Решение № 896/2006/ЕО за създаване на опростен
    режим за контрол на лица на външните граници,
    който се основава на едностранното признаване
    от страна на държавите-членки на определени
    разрешения за пребиваване, които се издават
    от Швейцария и Лихтенщайн за транзитно преминаване
    през тяхната територия
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 586/2008/ES ze dne 17. června
    2008 , kterým se mění rozhodnutí č. 896/2006/ES, kterým se zavádí zjednodušený
    režim kontrol osob na vnějších hranicích vycházející z jednostranného
    uznávání některých povolení k pobytu vydaných Švýcarskem a Lichtenštejnskem
    členskými státy za účelem průjezdu přes jejich území
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 586/2008/EF af 17. juni 2008
    om ændring af beslutning nr. 896/2006/EF om indførelse af en forenklet ordning
    for personkontrol ved de ydre grænser på grundlag af medlemsstaternes ensidige
    anerkendelse af visse opholdstilladelser udstedt af Schweiz og Liechtenstein i
    forbindelse med transit gennem deres område
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 586/2008/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 17ης Ιουνίου 2008 , για
    τροποποίηση της απόφασης αριθ. 896/2006/ΕΚ σχετικά
    με τη θέσπιση απλουστευμένου καθεστώτος για
    τον έλεγχο των προσώπων στα εξωτερικά σύνορα
    βασιζόμενου στη μονομερή αναγνώριση από τα
    κράτη μέλη ορισμένων τίτλων παραμονής που
    εκδίδουν η Ελβετία και το Λιχτενστάιν για τη
    διέλευση από το έδαφός τους
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 586/2008/EÜ, 17. juuni 2008 ,
    millega muudetakse otsust nr 896/2006/EÜ, millega kehtestatakse välispiiridel
    isikute kontrollimise lihtsustatud kord, mille alusel liikmesriigid tunnustavad
    ühepoolselt teatavaid Šveitsi ja Liechtensteini välja antud elamislubasid oma
    territooriumilt läbisõiduks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 586/2008/EY, tehty 17 päivänä
    kesäkuuta 2008 , yksinkertaistetusta menettelystä henkilötarkastuksissa ulkorajoilla
    siten, että jäsenvaltiot hyväksyvät kauttakulussa alueidensa läpi yksipuolisesti
    tietyt Sveitsin ja Liechtensteinin myöntämät oleskeluluvat, tehdyn päätöksen
    N:o 896/2006/EY muuttamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka br. 586/2008/EZ Europskog parlamenta i Vijeća od 17. lipnja 2008.
    o izmjeni Odluke br. 896/2006/EZ o uspostavi pojednostavnjenog režima za kontrolu
    osoba na vanjskim granicama koji se temelji na jednostranom priznavanju određenih
    boravišnih dozvola koje su izdale Švicarska i Lihtenštajn, od strane država
    članica za potrebe tranzita preko njihova državnog područja
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 586/2008/EK határozata ( 2008. június
    17. ) a személyek külső határokon történő, Svájc és Liechtenstein által
    a területükön történő átutazás céljából kiadott egyes tartózkodási
    engedélyeknek a tagállamok által történő egyoldalú elismerésén alapuló
    ellenőrzése egyszerűsített rendszerének bevezetéséről szóló 896/2006/EK
    határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 586/2008/CE del Parlamento Europeo e del Consiglio, del 17 giugno
    2008 , recante modifica della decisione n. 896/2006/CE che introduce un regime
    semplificato per il controllo delle persone alle frontiere esterne basato sul
    riconoscimento unilaterale, da parte degli Stati membri, ai fini del transito
    nel loro territorio, di determinati documenti di soggiorno rilasciati dalla Svizzera
    e dal Liechtenstein
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 586/2008/EK ( 2008. gada 17.
    jūnijs ), ar kuru groza Lēmumu Nr. 896/2006/EK, ar ko ievieš vienkāršotu
    režīmu personu kontrolei uz ārējām robežām, kas balstīts uz dažu Šveices
    un Lihtenšteinas izdotu uzturēšanās atļauju vienpusēju atzīšanu dalībvalstīs
    tranzīta vajadzībām to teritorijā
  type: main
- language: lt
  script: Latn
  content: 2008 m. birželio 17 d. Europos Parlamento ir Tarybos sprendimas Nr. 586/2008/EB,
    iš dalies keičiantis Sprendimą Nr. 896/2006/EB, nustatantį supaprastintą
    asmenų kontrolės prie išorės sienų režimą, grindžiamą vienašališku
    valstybių narių tam tikrų Šveicarijos ir Lichtenšteino išduotų leidimų
    gyventi pripažinimu tranzito per jų teritoriją tikslu
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni Nru 586/2008/KE tal-Parlament Ewropew u tal-Kunsill tas- 17
    ta’ Ġunju 2008 li temenda d-Deċiżjoni Nru 896/2006/KE li tistabbilixxi reġim
    simplifikat għall-kontroll ta’ persuni fuq il-fruntieri esterni li jkun ibbażat
    fuq ir-rikonoxximent unilaterali mill-Istati Membri ta’ ċerti permessi ta’
    residenza maħruġa mill-Iżvizzera u mil-Liechtenstein għall-finijiet ta’
    tranżitu mit-territorji tagħhom
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 586/2008/EG van het Europees Parlement en de Raad van 17
    juni 2008 tot wijziging van Beschikking nr. 896/2006/EG tot instelling van een
    vereenvoudigde regeling voor de controle van personen aan de buitengrenzen, gebaseerd
    op de eenzijdige erkenning door de lidstaten, met het oog op doorreis over hun
    grondgebied, van bepaalde door Zwitserland en Liechtenstein afgegeven verblijfstitels
  type: main
- language: pl
  script: Latn
  content: Decyzja Parlamentu Europejskiego i Rady nr 586/2008/WE z dnia 17 czerwca
    2008 r. zmieniająca decyzję nr 896/2006/WE wprowadzającą uproszczony system
    kontroli osób na granicach zewnętrznych oparty na jednostronnym uznawaniu przez
    państwa członkowskie niektórych zezwoleń na pobyt wydawanych przez Szwajcarię
    i Liechtenstein do celów przejazdu tranzytem przez ich terytorium
  type: main
- language: pt
  script: Latn
  content: Decisão n. o 586/2008/CE do Parlamento Europeu e do Conselho, de 17 de
    Junho de 2008 , que altera a Decisão n. o 896/2006/CE que estabelece um regime
    simplificado de controlo de pessoas nas fronteiras externas, baseado no reconhecimento
    unilateral pelos Estados-Membros para efeitos de trânsito pelos seus territórios
    de determinadas autorizações de residência emitidas pela Suíça e pelo Listenstaine
  type: main
- language: ro
  script: Latn
  content: Decizia nr. 586/2008/CE a Parlamentului European și a Consiliului din
    17 iunie 2008 de modificare a Deciziei nr. 896/2006/CE de stabilire a unui regim
    simplificat de control al persoanelor la frontierele externe, bazat pe recunoașterea
    unilaterală de către statele membre a anumitor permise de ședere eliberate
    de Elveția și de Liechtenstein în scopul tranzitului pe teritoriul lor
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 586/2008/ES zo 17. júna
    2008 , ktorým sa mení a dopĺňa rozhodnutie č. 896/2006/ES, ktorým sa zavádza
    zjednodušený režim kontroly osôb na vonkajších hraniciach založený na
    tom, že členské štáty na účely tranzitu cez ich územie jednostranne uznávajú
    niektoré povolenia na pobyt vydané Švajčiarskom a Lichtenštajnskom
  type: main
- language: sl
  script: Latn
  content: Odločba št. 586/2008/ES Evropskega parlamenta in Sveta z dne 17. junija
    2008 o spremembi Odločbe št. 896/2006/ES o vzpostavitvi poenostavljenega režima
    kontrole oseb na zunanjih mejah na podlagi enostranskega priznanja določenih
    dovoljenj za prebivanje, ki jih izdata Švica in Lihtenštajn, s strani držav
    članic za namen tranzita preko njihovih ozemelj
  type: main
- language: es
  script: Latn
  content: Decisión n o 586/2008/CE del Parlamento Europeo y del Consejo, de 17 de
    junio de 2008 , que modifica la Decisión n o 896/2006/CE, por la que se establece
    un régimen simplificado de control de las personas en las fronteras exteriores
    basado en el reconocimiento unilateral por los Estados miembros de determinados
    permisos de residencia expedidos por Suiza y Liechtenstein para fines de tránsito
    por sus territorios
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 586/2008/EG av den 17 juni 2008
    om ändring av beslut nr 896/2006/EG om en förenklad ordning för personkontroller
    vid de yttre gränserna på grundval av ett unilateralt erkännande av medlemsstaterna
    av vissa uppehållstillstånd utfärdade av Schweiz och Liechtenstein för genomresa
    via deras territorier
  type: main
