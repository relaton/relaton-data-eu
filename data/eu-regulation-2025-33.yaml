    z uporabo fluoriranih toplogrednih plinov s potencialom globalnega segrevanja
    150 ali več v omarah za hitro hlajenje in zamrzovanje, strojih za pripravo obrtniškega
    sladoleda, ledomatih, vozičkih za shranjevanje in regeneracijo hrane, vzhajalnikih
