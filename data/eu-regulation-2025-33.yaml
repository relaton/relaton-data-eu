title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/33 of 13 January 2025 authorising
    an exemption pursuant to Regulation (EU) 2024/573 of the European Parliament and
    of the Council, with regard to the use of fluorinated greenhouse gases with a
    GWP of 150 or more in blast cabinets, artisanal gelato ice cream makers, ice makers,
    trolleys for preserving and regenerating food, retarder prover cabinets, frozen
    drinks dispensers and cold cream dispensers
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/33 de la Commission du 13 janvier 2025
    autorisant une exemption en vertu du règlement (UE) 2024/573 du Parlement européen
    et du Conseil en ce qui concerne l’utilisation de gaz à effet de serre fluorés
    dont le PRP est supérieur ou égal à 150 dans les cellules de refroidissement
    et de congélation rapides, les machines à crème glacée italienne artisanale,
    les machines à glace, les chariots pour la conservation et la régénération
    des denrées alimentaires, les armoires de fermentation, les machines à granité
    et les distributeurs de crème froide
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/33 der Kommission vom 13. Januar 2025
    zur Gewährung einer Ausnahme gemäß der Verordnung (EU) 2024/573 des Europäischen
    Parlaments und des Rates hinsichtlich der Verwendung fluorierter Treibhausgase
    mit einem Treibhauspotenzial von 150 oder mehr in Schnellkühlern/-frostern, Eiscremebereitern
    für handwerklich hergestelltes Speiseeis, Eismaschinen, Transportwagen zur Konservierung
    und Regenerierung von Speisen, Gärschränken sowie Slush- und Softeismaschinen
  type: main
- language: bg
  script: Cyrl
