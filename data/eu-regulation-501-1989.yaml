  content: Council Regulation (EEC) No 501/89 of 27 February 1989 imposing a definitive
    anti-dumping duty on imports of certain video cassette recorders originating in
    Japan and the Republic of Korea and definitively collecting the provisional duty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 501/89 du Conseil du 27 février 1989 instituant un
    droit antidumping définitif sur les importations de certains magnétoscopes originaires
    du Japon et de la République de Corée, et portant perception définitive du
    droit provisoire
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 501/89 DES RATES vom 27. Februar 1989 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Videokassettengeräte
    mit Ursprung in Japan und der Republik Korea und zur endgültigen Vereinnahmung
    des vorläufigen Zolls #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 501/89 af 27. februar 1989 om indførelse
