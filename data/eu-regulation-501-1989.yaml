    της 27ης Φεβρουαρίου 1989 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ σε ορισμένες εισαγωγές
    μαγνητοσκοπίων εγγραφής με κασέτα, καταγωγής
    Ιαπωνίας και Δημοκρατίας της Κορέας, και για
    την οριστική είσπραξη του προσωρινού δασμού
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 501/89 DEL CONSIGLIO del 27 febbraio 1989 che istituisce
    un dazio antidumping definitivo sulle importazioni di videoregistratori originari
    del Giappone e della Repubblica di Corea e che decide la riscossione definitiva
    del dazio provvisorio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 501/89 VAN DE RAAD van 27 februari 1989 houdende
