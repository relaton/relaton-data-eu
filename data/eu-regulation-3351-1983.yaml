    delle merci EUR 1 e la compilazione dei formulari EUR 2, previsto dalle disposizioni
    relative agli scambi preferenziali tra la Comunità economica europea e alcuni
    paesi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3351/83 van de Raad van 14 november 1983 betreffende
    de regeling ter vergemakkelijking van de afgifte van certificaten inzake goederenverkeer
    EUR 1 en het opstellen van formulieren EUR 2 in het kader van de bepalingen die
    voor het preferentiële handelsverkeer tussen de Europese Economische Gemeenschap
    en sommige landen gelden
  type: main
