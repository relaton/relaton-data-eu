title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3351/83 of 14 November 1983 on the procedure
    to facilitate the issue of movement certificates EUR.1 and the making out of forms
    EUR.2 under the provisions governing preferential trade between the European Economic
    Community and certain countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 3351/83 du Conseil, du 14 novembre 1983, relatif à
    la procédure destinée à faciliter la délivrance de certificats de circulation
    des marchandises EUR 1 et l'établissement de formulaires EUR 2 prévue par les
    dispositions régissant les échanges préférentiels entre la Communauté économique
    européenne et certains pays
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3351/83 des Rates vom 14. November 1983 über das
    Verfahren zur Erleichterung der Erteilung von Warenverkehrsbescheinigungen EUR
    1 und der Ausstellung von Formblättern EUR 2 gemäß den Vorschriften über den
    präferenzbegünstigten Warenverkehr zwischen der Europäischen Wirtschaftsgemeinschaft
    und bestimmten Ländern
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3351/83 af 14. november 1983 om en fremgangsmåde,
    der skal lette udstedelsen af varecertifikat EUR 1 og udfærdigelsen af certifikat
    EUR 2 i henhold til bestemmelserne for den præferentielle samhandel mellem Det
    europæiske økonomiske Fællesskab og visse lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3351/83 του Συμβουλίου
    της 14ης Νοεμβρίου 1983 σχετικά με τη διαδικασία
    για τη διευκόλυνση της έκδοσης των πιστοποιητικών
    κυκλοφορίας EUR. 1 και τη σύνταξη των εντύπων
    EUR. 2 σύμφωνα με τις διατάξεις που διέπουν τις
    προτιμησιακές συναλλαγές μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και ορισμένων χωρών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 3351/83, annettu 14 päivänä marraskuuta 1983,
    Euroopan talousyhteisön ja tiettyjen maiden välistä etuuskohteluun oikeutettua
    kauppaa koskevissa säännöksissä vahvistetusta menettelystä EUR.1-tavaratodistusten
    antamisen ja EUR.2-lomakkeiden laatimisen helpottamiseksi
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3351/83 del Consiglio, del 14 novembre 1983, relativo
