title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2936/80 of 11 November 1980 extending the
    period of applicability of Regulation (EEC) No 2819/79 making the imports of certain
    textile products from certain third countries subject to Community surveillance
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2936/80 de la Commission, du 11 novembre 1980, prorogeant
    le règlement (CEE) n° 2819/79 soumettant à un régime de surveillance communautaire
    les importations de certains produits textiles originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2936/80 der Kommission vom 11. November 1980 zur Verlängerung
    der Verordnung (EWG) Nr. 2819/79, mit der die Einfuhr bestimmter Textilwaren aus
    bestimmten Drittländern einer Gemeinschaftsüberwachung unterworfen wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2936/80 af 11. november 1980 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 2819/79 om indførelse af fællesskabstilsyn
    med indførselen af visse tekstilvarer fra en række tredjelande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2936/80 τής Επιτροπής
    τής 11ης Νοεμβρίου 1980 περί παρατάσεως τής ισχύος
    τού κανονισμού αριθ. 2819/79 «περί θέσεως σέ καθεστώς
    κοινοτικής επιβλέψεως τών εισαγωγών ορισμένων
    κλωστοϋφαντουργικών προϊόντων καταγωγής ορισμένων
    τρίτων χωρών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2936/80 della Commissione, dell' 11 novembre 1980,
    che proroga il regolamento (CEE) n. 2819/79 che sottopone a sorveglianza comunitaria
    le importazioni di taluni prodotti tessili originari di alcuni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2936/80 van de Commissie van 11 november 1980 tot
    verlenging van de geldigheidsduur van Verordening (EEG) nr. 2819/79 houdende plaatsing
    onder communautair toezicht van de invoer van bepaalde textielprodukten uit enkele
    derde landen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2936/80 da Comissão, de 11 de Novembro de 1980,
    que prorroga o Regulamento (CEE) n.° 2819/79 que submete a um regime de vigilância
    comunitária as importações de certos produtos têxteis originários de certos
    países terceiros
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2936/80 de la Comisión, de 11 de noviembre de 1980,
    por el que se prorroga el Reglamento (CEE) n° 2819/79 por el que se someten a
    un régimen de vigilancia comunitaria las importaciones de determinados productos
    textiles originarios de determinados terceros países
  type: main
