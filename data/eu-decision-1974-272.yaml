---
id: EUDecision1974272
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 10 April 1974 authorizing the Italian Republic not
    to apply Community treatment to ball, roller or needle bearings falling within
    CCT heading No 84.62, originating in Japan, and in free circulation in the other
    Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/272/CEE de la Commission, du 10 avril 1974, autorisant la
    République italienne à exclure du traitement communautaire les roulements de
    tous genres, de la position 84.62 du Tarif douanier commun, originaires du Japon
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 10. April 1974, mit der die Italienische
    Republik ermächtigt wird, aus Japan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Wälzlager aller Art der Tarifnummer 84.62 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 10. april 1974 om bemyndigelse for Den italienske
    Republik til fra fællesskabsbehandling at undtage kugle- og rullelejer, alle
    slags, som henhører under position 84.62 i den fælles toldtarif, har oprindelse
    i Japan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 10 aprile 1974, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i cuscinetti a rotolamento,
    di ogni specie, della voce n. 84.62 della tariffa doganale comune, originari del
    Giappone e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 10 april 1974 waarbij de Italiaanse Republiek
    wordt gemachtigd kogellagers, naaldlagers en rollagers van post 84.62 van het
    gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
