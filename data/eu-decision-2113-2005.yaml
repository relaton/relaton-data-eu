title:
- language: en
  script: Latn
  content: Decision No 2113/2005/EC of the European Parliament and of the Council
    of 14 December 2005 amending Decision No 2256/2003/EC with a view to extension
    of the programme in 2006 for the dissemination of good practices and monitoring
    of the take-up of information and communication technologies (ICTs)
  type: main
- language: fr
  script: Latn
  content: Décision n o 2113/2005/CE du Parlement européen et du Conseil du 14 décembre
    2005 modifiant la décision n o 2256/2003/CE en vue de la prolongation en 2006
    du programme pour la diffusion des bonnes pratiques et le suivi de l'adoption
    des technologies de l'information et de la communication (TIC)
  type: main
- language: de
  script: Latn
  content: Entscheidung Nr. 2113/2005/EG des Europäischen Parlaments und des Rates
    vom 14. Dezember 2005 zur Änderung der Entscheidung Nr. 2256/2003/EG im Hinblick
    auf eine Verlängerung des Programms bis 2006 zur Verbreitung empfehlenswerter
    Verfahren und Beobachtung der Einführung von Informations- und Kommunikationstechnologien
    (IKT)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Evropského parlamentu a Rady č. 2113/2005/ES ze dne 14. prosince
    2005 , kterým se mění rozhodnutí č. 2256/2003/ES s ohledem na prodloužení
    programu pro šíření správných postupů a monitorování zavádění informačních
    a komunikačních technologií na rok 2006
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets beslutning nr. 2113/2005/EF af 14. december
    2005 om ændring af beslutning nr. 2256/2003/EF med henblik på forlængelse af
    programmet i 2006 til støtte for formidling af god praksis og overvågning af
    indførelsen af informations- og kommunikationsteknologi (IKT)
  type: main
- language: el
  script: Grek
  content: Απόφαση αριθ. 2113/2005/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου, της 14ης Δεκεμβρίου 2005 ,
    για τροποποίηση της απόφασης αριθ. 2256/2003/ΕΚ
    ενόψει της παράτασης του προγράμματος, κατά
    το 2006, για τη διάδοση ορθής πρακτικής και την
    παρακολούθηση της αφομοίωσης των τεχνολογιών
    των πληροφοριών και των επικοινωνιών (ΤΠΕ)
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu otsus nr 2113/2005/EÜ, 14. detsember 2005
    , millega muudetakse otsust nr 2256/2003/EÜ eesmärgiga pikendada heade tavade
    levitamise ning info- ja kommunikatsioonitehnoloogia (IKT) tulemuslikkuse järelevalve
    programmi 2006. aastaks
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston päätös N:o 2113/2005/EY, tehty 14
    päivänä joulukuuta 2005 , päätöksen N:o 2256/2003/EY muuttamisesta hyvien
    toimintatapojen levittämistä ja tieto- ja viestintätekniikan käyttöönoton
    seurantaa koskevan ohjelman pidentämiseksi vuoteen 2006
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2113/2005/EK határozata ( 2005. december
    14. ) a 2256/2003/EK határozat a helyes gyakorlat terjesztésére és az információs
    és kommunikációs technológiák (IKT) átvételének figyelemmel kísérésére
    szolgáló program 2006 végéig való meghosszabbítása tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione n. 2113/2005/CE del Parlamento europeo e del Consiglio, del 14
    dicembre 2005 , recante modifica della decisione n. 2256/2003/CE al fine di prorogare
    a tutto il 2006 il programma per la diffusione delle buone prassi e il monitoraggio
    dell’adozione delle tecnologie dell’informazione e della comunicazione (TIC)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Lēmums Nr. 2113/2005/EK ( 2005. gada 14.
    decembris ), ar kuru groza Lēmumu Nr. 2256/2003/EK, ņemot vērā programmas
    pagarināšanu līdz 2006. gadam, lai izplatītu labu praksi un informācijas
    un komunikācijas tehnoloģiju ieviešanas uzraudzību
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 14 d. Europos Parlamento ir Tarybos sprendimas Nr. 2113/2005/EB,
