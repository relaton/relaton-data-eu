    galiojimą 2006 m., kad būtų galima paskleisti gerą praktiką ir stebėti informacinių
    ir ryšių technologijų (IRT) diegimą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni Nru 2113/2005/KE tal-Parlament Ewropew u tal-Kunsill ta’
    l- 14 ta’ Diċembru 2005 li temenda d-Deċiżjoni Nru 2256/2003/KE bil-ħsieb
    li jiġi estiż il-programm fl-2006 għad-disseminazzjoni ta’ prattiki tajbin
    u l-monitoraġġ ta’ l-adozzjoni tat-Teknoloġiji ta’ l-Informazzjoni u tat-Telekomunikazzjoni
    (ICTs)
  type: main
- language: nl
  script: Latn
  content: Beschikking nr. 2113/2005/EG van het Europees Parlement en de Raad van
    14 december 2005 tot wijziging van Beschikking nr. 2256/2003/EG met het oog op
    de verlenging tot en met 2006 van het programma voor de verspreiding van goede
    praktijken en de monitoring van de acceptatie van informatie- en communicatietechnologieën
    (ICT's)
  type: main
- language: pl
  script: Latn
  content: Decyzja nr 2113/2005/WE Parlamentu Europejskiego i Rady z dnia 14 grudnia
    2005 r. zmieniająca decyzję nr 2256/2003/WE celem przedłużenia na rok 2006
    programu rozpowszechniania dobrych praktyk i monitorowania wdrażania technologii
    teleinformatycznych (ICT)
  type: main
- language: pt
  script: Latn
  content: Decisão n. o 2113/2005/CE do Parlamento Europeu e do Conselho, de 14 de
    Dezembro de 2005 , que altera a Decisão n. o 2256/2003/CE com vista à extensão
    até ao final de 2006 do programa para a difusão das boas práticas e o acompanhamento
    da adopção das tecnologias da informação e da comunicação (TIC)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Európskeho parlamentu a Rady č. 2113/2005/ES zo 14. decembra
    2005 , ktorým sa mení a dopĺňa rozhodnutie č. 2256/2003/ES na účely predĺženia
    programu na rozširovanie správnej praxe a monitorovanie zavádzania informačných
    a komunikačných technológií (IKT) na rok 2006
  type: main
- language: sl
  script: Latn
  content: Odločba Evropskega parlamenta in Sveta št. 2113/2005/ES z dne 14. decembra
    2005 o spremembah Odločbe št. 2256/2003/ES za podaljšanje programa za razširjanje
    dobrih praks in spremljanja vzpostavitve informacijskih in komunikacijskih tehnologij
    (IKT) v leto 2006
  type: main
- language: es
  script: Latn
  content: Decisión n o 2113/2005/CE del Parlamento Europeo y del Consejo, de 14
    de diciembre de 2005 , por la que se modifica la Decisión n o 2256/2003/CE con
    el fin de prorrogar el programa en 2006 para la difusión de las buenas prácticas
    y el seguimiento de la asimilación de las tecnologías de la información y de
    las comunicaciones (TIC)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets beslut nr 2113/2005/EG av den 14 december
    2005 om ändring av beslut nr 2256/2003/EG i syfte att förlänga programmet över
    2006 för spridning av goda rutiner och övervakning av införandet av informations-
    och kommunikationsteknik (IKT)
