title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 juillet 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les conserves de
    haricots verts, de la position Ex 20.02 du Tarif douanier commun, originaires
    de la République populaire de Chine et mises en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: '70/378/EWG: Entscheidung der Kommission vom 6. Juli 1970, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die aus der Volksrepublik China stammenden
    und in den Beneluxländern im freien Verkehr befindlichen Bohnenkonserven der
    Tarifnummer ex 20.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/378/CEE: Decisione della Commissione, del 6 luglio 1970, che autorizza
    la Repubblica federale tedesca ad escludere dal trattamento comunitario le conserve
    di fagiolini della voce ex 20.02 della tariffa doganale comune, originarie della
    Repubblica popolare cinese e messe in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/378/EEG: Beschikking van de Commissie van 6 juli 1970 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd conserven van sla-, spek-, pronk- en snijbonen van
    post ex 20.02 van het gemeenschappelijk douanetarief, van oorsprong uit de Volksrepubliek
    China en in de Benelux- landen in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
