title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2526/97 of 16 December 1997 laying down rates
    of compensatory interest applicable during the first half of 1998 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2526/97 de la Commission du 16 décembre 1997 fixant
    les taux d'intérêts compensatoires applicables en cas de naissance d'une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'état
    (régime du perfectionnement actif, système de la suspension et régime de l'admission
    temporaire) pendant le premier semestre de 1998
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2526/97 der Kommission vom 16. Dezember 1997 mit Sätzen
    von Ausgleichszinsen, die im ersten Halbjahr 1998 bei Entstehung einer Zollschuld
    für Veredelungserzeugnisse oder unveredelte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2526/97 af 16. december 1997 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i første halvår af 1998
  type: main
- language: el
  script: Grek
