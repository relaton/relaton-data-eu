title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/1649 of 21 August 2023 initiating
    an investigation concerning possible circumvention of the anti-dumping measures
    imposed by Implementing Regulation (EU) 2021/1930 on imports of birch plywood
    originating in Russia, by imports of birch plywood consigned from Türkiye and
    Kazakhstan, whether or not declared as originating in Türkiye and Kazakhstan,
    and making imports of birch plywood consigned from Türkiye and Kazakhstan subject
    to registration
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2023/1649 de la Commission du 21 août 2023
    ouvrant une enquête concernant un éventuel contournement des mesures antidumping
    instituées par le règlement d’exécution (UE) 2021/1930 sur les importations
    de contreplaqué de bouleau originaire de Russie, par les importations de contreplaqué
    de bouleau expédié de Turquie et du Kazakhstan, qu’il ait ou non été déclaré
    originaire de Turquie et du Kazakhstan, et soumettant à enregistrement les importations
    de contreplaqué de bouleau expédié de Turquie et du Kazakhstan
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2023/1649 der Kommission vom 21. August 2023
    zur Einleitung einer Untersuchung betreffend die mutmaßliche Umgehung der mit
    der Durchführungsverordnung (EU) 2021/1930 eingeführten Antidumpingmaßnahmen
    gegenüber den Einfuhren von Birkensperrholz mit Ursprung in Russland durch aus
    der Türkei und Kasachstan versandte Einfuhren von Birkensperrholz, ob als Ursprungserzeugnisse
    der Türkei oder Kasachstans angemeldet oder nicht, und zur zollamtlichen Erfassung
    der aus der Türkei und Kasachstan versandten Einfuhren von Birkensperrholz
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/1649 на Комисията
    от 21 август 2023 година за започване на разследване
    във връзка с възможно заобикаляне на антидъмпинговите
    мерки, наложени с Регламент за изпълнение (ЕС)
    2021/1930 върху вноса на брезов шперплат с произход
