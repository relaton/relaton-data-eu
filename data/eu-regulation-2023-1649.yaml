  content: Komission täytäntöönpanoasetus (EU) 2023/1649, annettu 21 päivänä
    elokuuta 2023, Venäjältä peräisin olevan koivuvanerin tuonnissa täytäntöönpanoasetuksella
    (EU) 2021/1930 käyttöön otettujen polkumyynnin vastaisten toimenpiteiden mahdollista
    kiertämistä koivuvanerin Turkista tai Kazakstanista lähetetyllä tuonnilla
    riippumatta siitä, onko sen alkuperämaaksi ilmoitettu Turkki tai Kazakstan,
