  content: A Bizottság (EU) 2023/1649 végrehajtási rendelete (2023. augusztus 21.)
    az Oroszországból származó nyírfa rétegelt lemezek behozatalára vonatkozóan
    az (EU) 2021/1930 végrehajtási rendelettel bevezetett dömpingellenes intézkedéseknek
    a Törökországban és Kazahsztánban feladott nyírfa rétegelt lemezek –
    függetlenül attól, hogy azokat Törökországból és Kazahsztánból származóként
    jelentették-e be vagy sem – behozatala általi esetleges kijátszására vonatkozó
    vizsgálat megindításáról, valamint a Törökországban és Kazahsztánban
    feladott nyírfa rétegelt lemezek behozatalára vonatkozó nyilvántartásbavételi
    kötelezettség bevezetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/1649 della Commissione del 21 agosto
    2023 che apre un’inchiesta relativa alla possibile elusione delle misure antidumping
    istituite dal regolamento di esecuzione (UE) 2021/1930 sulle importazioni di legno
    compensato di betulla originario della Russia mediante importazioni di legno compensato
