    apiešanu, kas notiek, importējot no Turcijas un Kazahstānas nosūtītu bērza
    saplāksni, neatkarīgi no tā, vai tam ir deklarēta Turcijas un Kazahstānas
    izcelsme, un uz bērza saplākšņa, kas nosūtīts no Turcijas un Kazahstānas,
