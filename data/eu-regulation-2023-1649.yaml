  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2023/1649 ón gCoimisiún an 21 Lúnasa
    2023 lena dtionscnaítear imscrúdú a bhaineann le himchéimniú féideartha
    na mbeart frithdhumpála a fhorchuirtear le Rialachán Cur Chun Feidhme (AE) 2021/1930
    ón gCoimisiún maidir le hallmhairí sraithadhmaid beithe de thionscnamh na Rúise,
    trí allmhairí sraithadhmaid beithe a chuirtear chun bealaigh ón Tuirc agus
    ón gCasacstáin, bíodh sé dearbhaithe gur de thionscnamh na Tuirce agus na
    Casacstáine iad nó ná bíodh, agus lena gcuirtear allmhairí sraithadhmaid
    beithe ón Tuirc agus ón gCasacstáin faoi réir a gcláraithe.
  type: main
