    на брезов шперплат, изпращан от Турция и Казахстан
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/1649 ze dne 21. srpna 2023 o
    zahájení šetření možného obcházení antidumpingových opatření uložených
    prováděcím nařízením (EU) 2021/1930 na dovoz březové překližky pocházející
    z Ruska dovozem březové překližky zasílané z Turecka a Kazachstánu, bez
