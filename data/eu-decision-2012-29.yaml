  script: Latn
  content: '2012/29/UE: Décision d’exécution de la Commission du 13 janvier 2012
    relative à la conformité de la norme EN 60065:2002/A12:2011 «Appareils audio,
    vidéo et appareils électroniques analogues — Exigence de sécurité» et de
    la norme EN 60950-1:2006/A12:2011 «Matériel de traitement de l’information
