  script: Latn
  content: '2012/29/EU: Commission Implementing Decision of 13 January 2012 on the
    compliance of standard EN 60065:2002/A12:2011 ‘Audio, video and similar electronic
    apparatus — Safety requirements’ and of standard EN 60950-1:2006/A12:2011
    ‘Information technology equipment — Safety — Part 1: General requirements’
    with the general safety requirement of Directive 2001/95/EC of the European Parliament
    and of the Council and on the publication of the references of those standards
    in the Official Journal of the European Union (notified under document C(2012)
    55)'
  type: main
