title:
- language: en
  script: Latn
  content: '80/285/EEC: Commission Decision of 18 February 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''woven overcoats,
    raincoats and other coats, cloaks and capes, jackets and blazers, other than garments
    of category 15 A, of wool, of cotton or of man- made textile fibres, falling within
    subheading ex 61.02 B of the Common Customs Tariff (category 15 B), originating
    in Yugoslavia and in free circulation in the other Member States (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/285/CEE: Décision de la Commission, du 18 février 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les manteaux, imperméables (y compris
    les capes) et vestes tissés, pour femmes, fillettes et jeunes enfants, autres
    que les vêtements de la catégorie 15 A, de laine, de coton ou de fibres textiles
    synthétiques ou artificielles de la sous- position ex 61.02 B du tarif douanier
    commun (catégorie 15 B), originaires de Yougoslavie et mis en libre pratique
    dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/285/EWG: Entscheidung der Kommission vom 18. Februar 1980, mit der
    das Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der
    Niederlande ermächtigt werden, aus Jugoslawien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Mäntel, Umhänge und Jacken, aus
    Geweben, für Frauen, Mädchen und Kleinkinder, andere als Kleidung der Kategorie
    15 A, der Tarifstelle ex 61.02 B des Gemeinsamen Zolltarifs, Kategorie 15 B, von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische und niederländische
    Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/285/EØF: Kommissionens beslutning af 18. februar 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage frakker, kapper og slag, jakker og blazere,
    vævede, til kvinder, piger og småbørn, andre end de under kategori 15 A hørende
    varer af uld, bomuld eller kemofibre, som henhører under pos. ex 61.02 B i den
    fælles toldtarif (kategori 15 B), har oprindelse i Jugoslavien og frit kan omsættes
    i de øvrige medlemsstater (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/285/CEE: Decisione della Commissione, del 16 febbraio 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario cappotti, soprabiti, mantelli e simili,
    e giacche, tessuti, per donna, per ragazza e per bambini, diversi dagli indumenti
    della categoria 15 A, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della sottovoce ex 61.02 B della tariffa doganale comune, categoria 15 B, originari
    della Iugoslavia e messi in libera pratica negli altri Stati membri (Il testi
    in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/285/EEG: Beschikking van de Commissie van 18 februari 1980 waarbij
    het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd mantels, regenjassen en andere jassen, capes, blazers en jasjes,
    geweven, andere dan de kledingstukken van categorie 15 A, van wol, van katoen
    of van synthetische of kunstmatige textielvezels, van post ex 61.02 B van het
    gemeenschappelijk douanetarief (categorie 15 B), van oorsprong uit Joegoslavië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
