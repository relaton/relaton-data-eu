title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1687/71 de la Commission, du 30 juillet 1971, modifiant
    les annexes du règlement (CEE) n 1014/71 en ce qui concerne les montants compensatoires
    applicables dans le secteur agricole à la suite de l'élargissement temporaire
    des marges de fluctuation des monnaies de certains États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1687/71 der Kommission vom 30. Juli 1971 zur Änderung
    der Anhänge zur Verordnung (EWG) Nr. 1014/71 betreffend die Ausgleichsbeträge
    in der Landwirtschaft im Anschluß an die vorübergehende Erweiterung der Bandbreiten
    der Währungen einiger Mitgliedstaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1687/71 della Commissione, del 30 luglio 1971, che
    modifica gli allegati del regolamento (CEE) n. 1014/71 per quanto riguarda gli
    importi di compensazione applicabili nel settore agricolo in seguito all'ampliamento
    temporaneo dei margini di fluttuazione delle monete di taluni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1687/71 van de Commissie van 30 juli 1971 houdende
    wijziging van de bijlagen van Verordening (EEG) nr. 1014/71 voor wat betreft de
    compenserende bedragen die van toepassing zijn in de landbouwsector naar aanleiding
    van de tijdelijke verruiming van de fluctuatiemarges van de valuta's van sommige
    Lid-Staten
  type: main
