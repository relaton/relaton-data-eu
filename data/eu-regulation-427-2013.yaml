  script: Latn
  content: Commission Implementing Regulation (EU) No 427/2013 of 8 May 2013 concerning
    the authorisation of selenomethionine produced by Saccharomyces cerevisiae NCYC
    R646 as a feed additive for all animal species and amending Regulations (EC) No
    1750/2006, (EC) No 634/2007 and (EC) No 900/2009 as regards the maximum supplementation
    with selenised yeast
  type: main
- language: fr
  script: Latn
