    der Kanarischen Inseln) in die Zehnergemeinschaft zu erhebenden Berichtigungsbetrags
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2691/90 af 19. september 1990 om indførelse
    af korrektionsbeløb, der skal opkræves ved indførsel til De Ti af friske citroner
    fra Spanien (med undtagelse af De Kanariske Øer)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2691/90 της Επιτροπής
