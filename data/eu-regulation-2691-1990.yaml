    citroenen van herkomst uit Spanje (met uitzondering van de Canarische eilanden)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2691/90 da Comissão, de 19 de Setembro de 1990,
    que institui um montante corrector a cobrar aquando da importação na Comunidade
