    ποσού που πρέπει να εισπράττεται κατά την εισαγωγή,
    στην Κοινότητα των Δέκα, νωπών λεμονιών από
    την Ισπανία (εκτός των Καναρίων Νήσων)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2691/90 della Commissione, del 19 settembre 1990,
    che istituisce un importo correttore da riscuotere all'importazione nella Comunità
    dei dieci di limoni freschi in provenienza dalla Spagna (escluse le isole Canarie)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2691/90 van de Commissie van 19 september 1990 houdende
