  content: Commission Regulation (EEC) No 2691/90 of 19 September 1990 introducing
    a corrective amount on the import of fresh lemons into the Community of Ten from
    Spain (except the Canary Islands)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2691/90 de la Commission, du 19 septembre 1990, instituant
