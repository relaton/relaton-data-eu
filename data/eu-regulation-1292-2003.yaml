    Verordening (EG) nr. 2604/2000 van de Raad tot instelling van een definitief antidumpingrecht
    op polyethyleentereftalaat uit, onder meer, Thailand, tot intrekking van het recht
    ten aanzien van een Thaise producent/exporteur en tot registratie van de invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1292/2003 z dnia 18 lipca 2003 r. wszczynające
    przegląd pod kątem nowych eksporterów rozporządzenia Rady (WE) nr 2604/2000
    nakładającego ostateczne cło antydumpingowe na przywóz niektórych tereftalatów
    polietylenowych pochodzących między innymi z Tajlandii, uchylające cło w odniesieniu
    do przywozu od jednego eksportera w tym kraju i poddające ten przywóz wymogowi
    rejestracji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1292/2003 da Comissão, de 18 de Julho de 2003, que
    inicia um reexame sobre um "novo exportador" no âmbito do Regulamento (CE) n.°
    2604/2000 do Conselho, que institui direitos anti-dumping definitivos sobre as
    importações de poli(tereftalato de etileno) originário, nomeadamente da Tailândia,
    e que revoga o direito sobre as importações de um exportador tailandês, sujeitando-as
    a registo
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie (ES) č. 1292/2003 z 18. júla 2003, ktorým sa dáva
    podnet na preskúmanie nového vývozcu podľa nariadenia Rady (ES) č. 2604/2000,
    ktorým sa ukladá konečné antidumpingové clo na dovozy určitého polyetylénového
    tereftalátu (PET) s pôvodom okrem iného v Thajsku a ktorým sa zrušuje clo,
    pokiaľ ide o dovozy od jedného vyvážajúceho vývozcu v tejto krajine a ktorým
    sa tieto dovozy stávajú predmetom registrácie
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1292/2003 z dne 18. julija 2003 o začetku pregleda
    zaradi novega izvoznika Uredbe Sveta (ES) št. 2604/2000 o uvedbi dokončnih protidampinških
    dajatev pri uvozu nekaterih polietilnih tereftalatov (PET), med drugim s poreklom
    iz Tajske, odpravi dajatve pri uvozu enega izvoznika v tej državi in uvedbi registracije
    tega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1292/2003 de la Comisión, de 18 de julio de 2003,
    por el que se inicia un procedimiento de reconsideración para "un nuevo exportador"
    del Reglamento (CE) n° 2604/2000 del Consejo, por el que se establece un derecho
    antidumping definitivo sobre las importaciones de determinado politereftalato
    de etileno originarias, entre otros países de Tailandia, y por el que se deroga
    el derecho aplicable a las importaciones de un productor exportador de ese país
    y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1292/2003 av den 18 juli 2003 om inledande
