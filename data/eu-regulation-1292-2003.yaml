title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1292/2003 of 18 July 2003 initiating a "new
    exporter" review of Council Regulation (EC) No 2604/2000 imposing a definitive
    anti-dumping duty on imports of certain polyethylene terephtalate (PET) originating,
    inter alia, in Thailand, repealing the duty with regard to imports from one exporting
    exporter in this country and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1292/2003 de la Commission du 18 juillet 2003 portant
    ouverture d'un réexamen au titre de "nouvel exportateur" du règlement (CE) n°
    2604/2000 du Conseil instituant un droit antidumping définitif sur les importations
    de certains types de polyéthylène téréphtalate (PET) originaires, entre autres,
    de Thaïlande, abrogeant le droit en ce qui concerne les produits d'un producteur
    exportateur de ce pays et soumettant les importations de ces produits à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1292/2003 der Kommission vom 18. Juli 2003 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 2604/2000 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von bestimmtem Polyethylenterephthalat
    mit Ursprung unter anderem in Thailand (Überprüfung für einen neuen Ausführer),
    zur Aufhebung des Zolls auf die Einfuhren eines ausführenden Herstellers in diesem
    Land und zur zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: cs
  script: Latn
