  type: main
- language: hu
  script: Latn
  content: A Bizottság 1292/2003/EK Rendelete (2003. július 18.) a többek között
    Thaiföldről származó meghatározott polietilén-tereftalát (PET) behozatalára
    vonatkozó végleges dömpingellenes vám kivetéséről szóló 2604/2000/EK
    tanácsi rendelet új exportőrre vonatkozó felülvizsgálatának megindításáról,
    a vámnak egy thaiföldi exportőr behozatala tekintetében történő hatályon
    kívül helyezéséről és e behozatal nyilvántartásba vételének kötelezővé
    tételéről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1292/2003 della Commissione, del 18 luglio 2003, che
    avvia un riesame relativo ai "nuovi esportatori" del regolamento (CE) n. 2604/2000
    del Consiglio che istituisce un dazio antidumping definitivo sulle importazioni
    di alcuni tipi di polietilentereftalato (PET) originarie, tra l'altro, della Thailandia,
    abroga il dazio per quanto riguarda le importazioni di un produttore esportatore
    di questo paese e stabilisce che tali importazioni siano soggette a registrazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1292/2003 (2003. gada 18. jūlijs), ar kuru attiecībā
    uz jaunu eksportētāju sāk pārskatīt Padomes Regulu (EK) Nr. 2604/2000, ar
    ko piemēro galīgo antidempinga maksājumu dažu veidu polietilēna tereftalāta
    (PET) importam, kura izcelsme cita starpā ir Taizeme, un atceļ maksājumu attiecībā
    uz importu no viena ražotāja eksportētāja minētajā valstī, un attiecina
    uz šo importu reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2003 liepos 18 d. Komisijos Reglamentas (EB) Nr. 1292/2003 inicijuojantis
    Tarybos reglamento (EB) Nr. 2604/2000, nustatančio polietileno tereftalato (PET),
    kurio kilmės šalis, inter alia, yra Tailandas, galutinį antidempingo muitą,
    peržiūrą dėl naujojo eksportuotojo, panaikinantis tą muitą vieno eksportuojančio
    eksportuotojo šioje šalyje importo atžvilgiu ir nurodantis registruoti tokį
    importą
  type: main
- language: mt
  script: Latn
  content: Ir-regolament tal-kummissjoni (KE) Nru 1292/2003 tat-18 ta' Lulju 2003
    li jagħti bidu għal reviżjoni esportatur ġdid tar-Regolament tal-Kunsill (KE)
    Nru 2604/2000 li jimponi dazju definittiv kontra r-rimi fuq importazzjonijiet
    ta' ċertu polyethylene terephtalate (PET) li joriġina, inter alia, mit-Tajlandja,
    wara li jitneħħa d-dazju fuq importazzjonijiet minn esportatur wieħed li jesporta
