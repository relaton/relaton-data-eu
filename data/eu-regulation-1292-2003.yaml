    o uložení konečného antidumpingového cla z dovozu některého polyethylentereftalátu
    (PET) pocházejícího mimo jiné z Thajska, kterým se zrušuje clo ohledně
    dovozů jednoho vyvážejícího výrobce z této země a kterým se zavádí
    celní evidence těchto dovozů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1292/2003 af 18. juli 2003 om indledning
    af en fornyet undersøgelse vedrørende en ny eksportør af Rådets forordning
    (EF) nr. 2604/2000 om indførelse af en endelig antidumpingtold på importen af
    visse former for polyethylenterephthalat med oprindelse i bl.a. Thailand, og om
    ophævelse af tolden for så vidt angår importen fra en eksporterende producent
    i dette land og om at gøre denne import til genstand for registrering
  type: main
