title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3008/91 of 14 October 1991 re-establishing
    the levying of customs duties on products of category 97 (order No 40.0970), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3008/91 DE LA COMMISSION du 14 octobre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 97 (numéro d'' ordre 40.0970) originaires de la Chine, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
