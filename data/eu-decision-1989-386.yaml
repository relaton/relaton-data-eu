    China einer innergemeinschaftlichen Überwachung zu unterwerfen (Nur der dänische
    Text ist verbindlich) (89/386/EWG) (89/386/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 17. maj 1989 om bemyndigelse af Kongeriget
    Danmark til at indføre tilsyn inden for Fællesskabet med indførslen af visse
    cykler med oprindelse i Den Kinesiske Folkerepublik (Kun den danske udgave er
    autentisk) (89/386/EØF) (89/386/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/386/ΕΟΚ: Απόφαση της Επιτροπής της 17ης
