    de certaines bicyclettes originaires de la République populaire de Chine (Le
    texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 17. Mai 1989 zur Ermächtigung des Königreichs
