    προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 571/87 della Commissione del 26 febbraio 1987 che
    fissa forfettariamente i tassi del finanziamento, da parte del Fondo europeo agricolo
    di orientamento e di garanzia, sezione garanzia, delle spese risultanti dalla
    distribuzione gratuita dei prodotti acquistati dagli organismi d' intervento nel
    settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 571/87 van de Commissie van 26 februari 1987 houdende
    voorschriften voor de forfaitaire financiering door het Europees Oriëntatie-
    en Garantiefonds voor de Landbouw, afdeling Garantie, van de uitgaven in verband
    met de gratis uitreiking van produkten die zijn aangekocht door de interventiebureaus
    in de sector melk en zuivelprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 571/87 da Comissão de 26 de Fevereiro de 1987 que
    determina, de modo forfetário, o financiamento pelo Fundo Europeu de Orientação
    e de Garantia Agrícola, secção "Garantia", das despesas que resultam de distribuição
    gratuita dos produtos comprados pelos organismos de intervenção no sector do
    leite e dos produtos lácteos
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 571/87 de la Comisión de 26 de febrero de 1987 por
