  script: Latn
  content: Commission Regulation (EEC) No 571/87 of 24 February 1987 laying down standard
    rates for the financing by the European Agricultural Guidance and Guarantee Fund,
    Guarantee Section, of expenditure resulting from the free distribution of milk
    products bought in by the intervention agencies
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 571/87 de la Commission du 26 février 1987 déterminant,
    de façon forfaitaire, le financement par le Fonds européen d' orientation et
    de garantie agricole, section "garantie", des dépenses résultant de la distribution
    gratuite des produits achetés par les organismes d' intervention dans le secteur
    du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 571/87 der Kommission vom 26. Februar 1987 zur Festsetzung
    der vom Europäischen Ausrichtungs- und Garantiefonds für die Landwirtschaft,
    Abteilung Garantie, pauschal zu finanzierenden Ausgaben im Zusammenhang mit der
    kostenlosen Verteilung der von den Interventionsstellen angekauften Erzeugnisse
    des Sektors Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 571/87 af 26. februar 1987 om fastsættelse
    af faste satser for finansiering gennem Den europæiske udviklings- og garantifond
    for Landbruget, garantisektionen, af udgifterne til gratis uddeling af mejeriprodukter
    opkøbt af interventionsorganerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 571/87 της Επιτροπής
