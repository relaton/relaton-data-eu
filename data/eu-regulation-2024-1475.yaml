  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1475 of 30 May 2024 imposing
    a definitive anti-dumping duty on imports of certain seamless pipes and tubes
    of stainless steel originating in the People’s Republic of China following an
    expiry review pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
