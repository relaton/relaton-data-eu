    o messe gratuitamente a disposizione delle vittime del terremoto avvenuto nella
    Repubblica ellenica nel febbraio 1981 (Il testo in lingua greca è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '81/265/EEG: Beschikking van de Commissie van 27 maart 1981 betreffende
