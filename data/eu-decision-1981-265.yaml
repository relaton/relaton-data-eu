title:
- language: en
  script: Latn
  content: '81/265/EEC: Commission Decision of 27 March 1981 on the duty-free importation
    of goods intended to be distributed or made available free of charge to victims
    of the earthquake which occurred in February 1981 in the Hellenic Republic (Only
    the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/265/CEE: Décision de la Commission, du 27 mars 1981, relative à l''admission
    en franchise des droits à l''importation de marchandises destinées à être
    distribuées ou mises à la disposition gratuitement des victimes du tremblement
    de terre survenu en Grèce en février 1981 (Le texte en langue grecque est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/265/EWG: Entscheidung der Kommission vom 27. März 1981 über die Befreiung
    von Eingangsabgaben für bestimmte Waren, die an die von dem im Februar 1981 in
    Griechenland aufgetretenen Erdbeben betroffenen Opfer unentgeltlich verteilt oder
    ihnen unentgeltlich zur Verfügung gestellt werden sollen (Nur der griechische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/265/EØF: Kommissionens beslutning af 27. marts 1981 om fritagelse
    for told ved indførsel af varer, der er bestemt til gratis udlevering til eller
    gratis bliver stillet til rådighed for ofrene for jordskælvene i februar 1981
    i Den græske Republik (Kun den graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/265/ΕΟΚ: Απόφαση τής Επιτροπής τής 27ης
    Μαρτίου 1981 περί τής εισαγωγής, μέ ατέλεια δασμών,
    τών εμπορευμάτων τά οποία προορίζονται νά
    διανεμηθούν ή νά διατεθούν δωρεάν στά θύματα
    τού σεισμού πού έπληξε τήν Ελληνική Δημοκρατία
    τόν Φεβρουάριο τού 1981 (Το κείμενο στην ελληνική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/265/CEE: Decisione della Commissione, del 27 marzo 1981, relativa all''ammissione
