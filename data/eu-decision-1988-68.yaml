title:
- language: en
  script: Latn
  content: '88/68/EEC: Commission Decision of 22 December 1987 making an initial allocation
    to Denmark of part of the resources to be charged to the 1988 budget year for
    the supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/68/CEE: Décision de la Commission du 22 décembre 1987 allouant au
    Danemark une première tranche des crédits imputables à l'' exercice 1988 pour
    la fourniture de denrées alimentaires provenant des stocks d'' intervention à
    des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/68/EWG: Entscheidung der Kommission vom 22. Dezember 1987 über die
    anfängliche Bewilligung für Dänemark eines Teils der Mittel, die im Haushaltsjahr
    1988 für die zur Verfügungstellung von Nahrungsmitteln aus Interventionsbeständen
    an bezeichnete Organisationen zur Verteilung an stark benachteiligte Personen
    in der Gemeinschaft zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '88/68/EØF: Kommissionens beslutning af 22. december 1987 om en første
    tildeling til Danmark af en del af de midler, der skal opføres på 1988-budgettet
    for levering af levnedsmidler fra interventionslagre til nærmere bestemte organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/68/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1987 που χορηγεί στη Δανία μια πρώτη μερίδα πιστώσεων
    που καταλογίζονται στο οικονομικό έτος 1988
    για την χορήγηση τροφίμων που προέρχονται
    από τα αποθέματα της παρεμβάσεως στους οργανισμούς
    που ορίζονται για τη διανομή τους στους απόρους
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/68/CEE: Decisione della Commissione del 22 dicembre 1987 relativa ad
    uno stanziamento iniziale alla Danimarca di parte delle risorse da imputare all''
    esercizio finanziario 1988 per la fornitura di derrate alimentari provenienti
    dalle scorte d'' intervento agli organismi incaricati di distribuirle agli indigenti
    nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/68/EEG: Beschikking van de Commissie van 22 december 1987 houdende
    een eerste toewijzing aan Denemarken van de op het begrotingsjaar 1988 te boeken
    middelen voor de levering van voedsel uit interventievoorraden aan bepaalde organisaties
    voor de bedeling aan behoeftigen in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/68/CEE: Decisão da Comissão de 22 de Dezembro de 1987 relativa à
    afectação inicial à Dinamarca de parte dos recursos a imputar ao exercício
    orçamental de 1988 para o fornecimento de alimentos provenientes de existências
    de intervenção às organizações designadas para distribuição às pessoas
    mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/68/CEE: Decisión de la Comisión de 22 de diciembre de 1987 por la
    que se establece una asignación inicial a Dinamarca de parte de los recursos
    con cargo al presupuesto de 1988 para el suministro de alimentos procedentes de
    las existencias de intervención a las organizaciones encargadas de su distribución
    a las personas más necesitadas de la Comunidad'
