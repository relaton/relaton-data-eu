    «ελεύθερο στά σύνορα» πού εφαρμόζονται κατά
    τήν εισαγωγή οίνων από τίς 16 Δεκεμβρίου 1981
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 18/82 della Commissione, del 6 gennaio 1982, che fissa
    i prezzi franco frontiera di riferimento applicabili alle importazioni di vini
    dall' Algeria a decorrere dal 1° luglio 1981 e che modifica il regolamento (CEE)
    n. 3483/81, che fissa i prezzi franco frontiera di riferimento applicabili all'
    importazione dei vini a decorrere dal 16 dicembre 1981
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 18/82 van de Commissie van 6 januari 1982 tot vaststelling
