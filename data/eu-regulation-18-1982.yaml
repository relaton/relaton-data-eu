title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 18/82 of 6 January 1982 fixing the free-at-frontier
    reference prices applicable to imports of wines from Algeria from 1 July 1981
    and amending Regulation (EEC) No 3483/81 fixing the free-at-frontier reference
    prices applicable to wine imports from 16 December 1981
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 18/82 de la Commission, du 6 janvier 1982, fixant
    les prix franco frontière de référence applicables aux importations de vins
    d' Algérie à partir du 1er juillet 1981 et modifiant le règlement (CEE) n°
    3483/81 fixant les prix franco frontière de référence applicables à l' importation
    des vins à partir du 16 décembre 1981
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 18/82 der Kommission vom 6. Januar 1982 zur Festsetzung
    der am 1. Juli 1981 auf Einfuhren von Wein aus Algerien anwendbaren Referenzpreise
    frei Grenze und zur Änderung der Verordnung (EWG) Nr. 3483/81 zur Festsetzung
    der ab 16. Dezember 1981 bei der Einfuhr von Wein anzuwendenden Referenzpreise
    frei Grenze
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 18/82 af 6. januar 1982 om fastsættelse
    af referenceprisen franko grænse ved indførsel af vin fra Algeriet fra den 1.
    juli 1981 og om ændring af forordning (EØF) nr. 3483/81 om fastsættelse af
    referenceprisen franko grænse ved indførsel af vin fra den 16. december 1981
  type: main
- language: el
  script: Grek
