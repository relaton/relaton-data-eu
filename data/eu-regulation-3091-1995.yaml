title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 3091/95 of 22 December 1995 laying down for
    1996 certain measures for the conservation and management of fishery resources
    applicable in vessels flying the flag of certain non- member countries in the
    200-nautical-mile-zone off the coast of the French department of Guiana
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3091/95 du Conseil, du 22 décembre 1995, fixant, pour
    l'année 1996, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de certains pays tiers dans
    la zone de 200 milles située au large des côtes du département français de
    la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3091/95 des Rates vom 22. Dezember 1995 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer (1996)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3091/95 af 22. december 1995 om fastsættelse
    for 1996 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    gældende for fartøjer, der fører visse tredjelandes flag i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Kανονισμός (ΕΚ) αριθ. 3091/95 του Συμβουλίου,
    της 22ας Δεκεμβρίου 1995, για τον καθορισμό, για
    το 1996, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων για σκάφη υπό σημαία ορισμένων
    τρίτων χωρών εντός της ζώνης 200 μιλίων στα ανοικτά
    του γαλλικού διαμερίσματος της Γουιάνας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3091/95, annettu 22 päivänä joulukuuta 1995,
    tiettyjen kolmansien maiden lipun alla purjehtiviin aluksiin sovellettavista kalavarojen
    säilyttämis- ja hoitotoimenpiteistä vuodeksi 1996 200 meripeninkulman kalastusvyöhykkeellä,
    joka sijaitsee Ranskan Guayanan departementin rannikon edustalla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3091/95 del Consiglio, del 22 dicembre 1995, che stabilisce,
    per il 1996, talune misure di conservazione e di gestione delle risorse ittiche,
    da applicare alla navi battenti bandiera di taluni paesi terzi nella zona di 200
    miglia situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3091/95 van de Raad van 22 december 1995 houdende
    maatregelen, voor 1996, voor de instandhouding en het beheer van de visbestanden
    die, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    in de 200-mijlszone voor de kust van het Franse departement Guyana van toepassing
    zijn
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3091/95 do Conselho, de 22 de Dezembro de 1995, que
    fixa, para 1996, certas medidas de conservação e de gestão dos recursos da
    pesca aplicáveis aos navios que arvoram pavilhão de certos países terceiros
    na zona de 200 milhas situada no largo do departamento francês da Guiana
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 3091/95 del Consejo, de 22 de diciembre de 1995, por
    el que se establecen, para 1996, determinadas medidas de conservación y de gestión
    de los recursos pesqueros aplicables a los buques que enarbolen pabellón de determinados
    países terceros en la zona de 200 millas situada frente a las costas del departamento
    francés de Guyana
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 3091/95 av den 22 december 1995 om fastställande
    för 1996 av vissa åtgärder som syftar till bevarande och förvaltning av fiskeresurserna
    och som är tillämpliga på fartyg som för vissa tredje länders flagg i 200-sjömilszonen
    utanför det franska departementet Guyanas kust
