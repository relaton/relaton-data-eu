title:
- language: en
  script: Latn
  content: '84/448/EEC: Commission Decision of 10 September 1984 concerning the zones
    referred to in Article 2 (3) of Regulation (EEC) No 2616/80 instituting a specific
    Community regional development measure contributing to overcoming constraints
    on the development of new economic activities in certain zones adversely affected
    by restructuring of the steel industry (Only the Dutch text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/448/CEE: Décision de la Commission du 10 septembre 1984 relative aux
    zones visées à l''article 2 paragraphe 3 du règlement (CEE) no 2616/80 instituant
    une action communautaire spécifique de développement régional contribuant à
    l''élimination des obstacles au développement de nouvelle activités économiques
    dans certaines zones affectées par la restructuration de l''industrie sidérurgique
    (Le texte en langue néerlandaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/448/EWG: Entscheidung der Kommission vom 10. September 1984 bezüglich
    der Gebiete gemäß Artikel 2 Absatz 3 der Verordnung (EWG) Nr. 2616/80 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige in
    bestimmten von der Umstrukturierung der Eisen- und Stahlindustrie betroffenen
    Gebieten (Nur der niederländische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/448/EØF: Kommissionens beslutning af 10. september 1984 om de områder,
    der er omhandlet i artikel 2, stk. 3, i forordning (EØF) nr. 2616/80 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i jern- og stålindustrien (Kun
    den nederlandske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/448/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Σεπτεμβρίου 1984 για τις ζώνες οι οποίες αναφέρονται
    στο άρθρο 2 παράγραφος 3 του κανονισμού (ΕΟΚ)
    αριθ. 2616/80 περί ανάληψης ειδικής κοινοτικής
    ενέργειας περιφερειακής αναπτύξεως για τη
    συμβολή στην εξάλειψη των εμποδίων στην ανάπτυξη
    νέων οικονομικών δραστηριοτήτων σε ορισμένες
    ζώνες που θίγονται από την αναδιάρθρωση της
    βιομηχανίας σιδήρου και χάλυβα (Το κείμενο
    στην ολλανδική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/448/CEE: Decisione della Commissione del 10 settembre 1984 relativa
    alle zone di cui all''articolo 2, paragrafo 3, del regolamento (CEE) n. 2616/80
    che istituisce un''azione comunitaria specifica di sviluppo regionale per contribuire
    ad eliminare gli ostacoli allo sviluppo di nuove attività economiche in talune
    zone colpite dalla ristrutturazione dell''industria siderurgica (Il testo in lingua
    olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/448/EEG: Beschikking van de Commissie van 10 september 1984 betreffende
    de gebieden als bedoeld in artikel 2, lid 3, van Verordening (EEG) nr. 2616/80
    tot instelling van een specifieke communautaire actie voor regionale ontwikkeling
    om bij te dragen tot de uitschakeling van de hinderpalen voor de ontwikkeling
    van nieuwe economische activiteiten in sommige door de herstructurering van de
    ijzer- en staalindustrie getroffen zones (Slechts de tekst in de Nederlandse taal
    is authentiek)'
