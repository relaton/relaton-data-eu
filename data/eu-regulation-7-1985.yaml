  content: Council Regulation (EEC) No 7/85 of 19 December 1984 laying down for 1985
    certain measures for the conservation and management of fishery resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 7/85 du Conseil du 19 décembre 1984 fixant, pour 1985,
    certaines mesures de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 7/85 des Rates vom 19. Dezember 1984 zur Festlegung
    bestimmter Maßnahmen zur Erhaltung und Bewirtschaftung der Fischereiressourcen
    gegenüber Schiffen unter spanischer Flagge für 1985
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 7/85 af 19. december 1984 om fastsættelse
    for 1985 af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som skal finde anvendelse på fartøjer, der fører spansk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 7/85 του Συμβουλίου
