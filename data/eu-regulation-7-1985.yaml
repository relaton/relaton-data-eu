    το 1985, ορισμένων μέτρων διατηρήσεως και διαχειρίσεως
    των αλιευτικών πόρων που εφαρμόζονται σε σκάφη
    υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 7/85 del Consiglio del 19 dicembre 1984 che dispone,
    per il 1985, talune misure di conservazione e di gestione delle risorse di pesca
    da applicare alle navi battenti bandiera della Spagna
  type: main
- language: nl
