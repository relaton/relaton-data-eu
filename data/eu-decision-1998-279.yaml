  script: Latn
  content: '98/279/EC: Commission Decision of 5 December 1997 on the procedure for
    attesting the conformity of construction products pursuant to Article 20(2) of
    Council Directive 89/106/EEC as regards non load-bearing permanent shuttering
    kits/systems based on hollow blocks or panels of insulating materials and, sometimes,
    concrete'
  type: main
- language: fr
  script: Latn
  content: '98/279/CE: Décision de la Commission du 5 décembre 1997 relative à
    la procédure d''attestation de conformité des produits de construction conformément
    à l''article 20 paragraphe 2 de la directive 89/106/CEE du Conseil, en ce qui
    concerne les systèmes ou ensembles de coffrage permanents non porteurs composés
    de blocs creux ou de panneaux isolants, et éventuellement de béton'
  type: main
- language: de
  script: Latn
