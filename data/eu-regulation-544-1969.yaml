title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 544/69 de la Commission, du 21 mars 1969, fixant les
    taux des restitutions applicables, à compter du 1er avril 1969, aux oeufs et
    aux jaunes d'oeufs exportés sous forme de marchandises ne relevant pas de l'annexe
    II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 544/69 der Kommission vom 21. März 1969 zur Festsetzung
    der ab 1. April 1969 geltenden Erstattungen bei der Ausfuhr von Eiern und Eigelb
    in Form von nicht unter Anhang II des Vertrages fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 544/69 della Commissione, del 21 marzo 1969, che fissa
    i tassi delle restituzioni applicabili a decorrere dal 1 aprile 1969 alle uova
    e ai tuorli d'uovo esportati sotto forma di merci non comprese nell'allegato II
    del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 544/69 van de Commissie van 21 maart 1969 houdende
    vaststelling van de restituties die met ingang van 1 april 1969 worden toegepast
    voor eieren en eigeel, uitgevoerd in de vorm van niet in bijlage II van het Verdrag
    vermelde goederen
  type: main
