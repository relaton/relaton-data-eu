title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 295/68 de la Commission, du 12 mars 1968, modifiant
    les règlements ayant fixé les prélèvements applicables en janvier et février
    1968 à l'importation des produits transformés à base de céréales et de riz,
    y compris les aliments composés pour les animaux
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 295/68 der Kommission vom 12. März 1968 zur Änderung
    der Verordnungen über die Festsetzung der auf die Einfuhren von Getreide- und
    Reisverarbeitungserzeugnissen einschließlich Getreide-Mischfuttermittel anzuwendenden
    Abschöpfungen für Januar und Februar 1968
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 295/68 della Commissione, del 12 marzo 1968, che modifica
    i regolamenti che hanno fissato i prelievi applicabili in gennaio e febbraio 1968
    all'importazione dei prodotti trasformati a base di cereali e di riso, compresi
    gli alimenti composti per gli animali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 295/68 van de Commissie van 12 maart 1968 houdende
    wijziging van de verordeningen, waarbij de heffingen bij invoer in januari en
    februari 1968 van de op basis van granen en rijst verwerkte produkten met inbegrip
    van mengvoeders zijn vastgesteld
  type: main
