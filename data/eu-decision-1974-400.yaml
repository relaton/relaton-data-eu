id: EUDecision1974400
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 23 July 1974 authorizing the French Republic not
    to apply Community treatment to clothing in textiles other than cotton, umbrellas
    and sunshades, falling within heading Nos ex 61.01, ex 61.02, ex 61.03 and ex
    66.01 of the Common Customs Tariff, originating in Hong Kong and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: Décision 74/400/CEE de la Commission, du 23 juillet 1974, autorisant la
    République française à exclure du traitement communautaire les vêtements en
    tissus autres que le coton et les parapluies et ombrelles, des positions Ex 61.01,
    Ex 61.02, Ex 61.03 et Ex 66.01 du Tarif douanier commun, originaires de Hong-Kong
    et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 23. Juli 1974, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Bekleidung aus anderen Spinnstoffen als aus Baumwolle,
    Regenschirme und Sonnenschirme der Tarifnummern ex 61.01, ex 61.02, ex 61.03 und
    ex 66.01 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 23. juli 1974 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage beklædningsgenstande af tekstilstoffer
    undtagen bomuld, paraplyer og parasoller, som henhører under position ex 61.01,
    ex 61.02, ex 61.03 og ex 66.01 i den fælles toldtarif, med oprindelse i Hong
    Kong og som frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 23 luglio 1974, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario gli indumenti esterni e le sottovesti,
    di materie tessili diverse dal cotone, gli ombrelli da pioggia a da sole, delle
    voci n. ex 61.01, n, ex 61.02, n. ex 61.03 e n. ex 66.01 della tariffa doganale
    comune, originari di Hong Kong e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 23 juli 1974 waarbij de Franse Republiek
    wordt gemachtigd kleding uit textielstoffen andere dan katoen, paraplu's en parasols,
    van posten ex 61.01, ex 61.02, ex 61.03 en ex 66.01 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
