title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 36/2005 of 12 January 2005 amending Annexes
    III and X to Regulation (EC) No 999/2001 of the European Parliament and of the
    Council as regards epidemio-surveillance for transmissible spongiform encephalopathies
    in bovine, ovine and caprine animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 36/2005 de la Commission du 12 janvier 2005 modifiant
