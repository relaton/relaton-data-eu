  content: Commission Regulation (EEC) No 2546/79 of 16 November 1979 amending Regulations
    (EEC) No 2187/79 and (EEC) No 2281/79 on the application of the additional measures
    applicable to holders of long-term storage contracts for certain table wines for
    the 1978/79 wine-growing year and derogating from Regulation (EEC) No 2186/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2546/79 de la Commission, du 16 novembre 1979, modifiant
    les règlements (CEE) n° 2187/79 et (CEE) n° 2281/79 relatifs à l' application
    des mesures complémentaires réservées aux détenteurs de contrats de stockage
    à long terme de certains vins de table pour la campagne 1978/1979 et dérogeant
    au règlement (CEE) n° 2186/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2546/79 der Kommission vom 16. November 1979 zur Änderung
    der Verordnungen (EWG) Nr. 2187/79 und (EWG) Nr. 2281/79 über die Durchführung
    der ergänzenden Maßnahmen für das Wirtschaftsjahr 1978/79, die Inhabern langfristiger
    Lagerverträge für Tafelweine vorbehalten sind, und zur Abweichung von der Verordnung
    (EWG) Nr. 2186/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2546/79 af 16. november 1979 om ændring
