title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 52/78 of 10 January 1978 re-establishing
    the levying of customs duties on tarpaulins, sails, awnings, sunblinds, tents
    and camping goods falling within heading No 62.04, originating in South Korea
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 52/78 de la Commission, du 10 janvier 1978, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d'embarcations, stores d'extérieur, tentes et articles de campement, de
    la position tarifaire 62.04, originaires de la Corée du Sud, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 52/78 der Kommission vom 10. Januar 1978 über die
    Wiedereinführung des Zollsatzes für Planen, Segel, Markisen, Zelte und Zeltlagerausrüstungen,
    der Tarifnummer 62.04, mit Ursprung in Südkorea, dem die in der Verordnung (EWG)
    Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 52/78 af 10. januar 1978 om genindførelse
    af opkrævning af toldafgifter for presenninger, sejl, markiser, telte og lejrudstyr,
    under position 62.04, som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 52/78 della Commissione, del 10 gennaio 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai copertoni, vele per
    imbarcazioni, tende per l'esterno, tende ed oggetti per campeggio, della voce
    doganale 62.04, originari della Corea del Sud, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 52/78 van de Commissie van 10 januari 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op dekkleden,
    scheepszeilen, zonneschermen voor winkelpuien en dergelijke, tenten en kampeerartikelen,
    van post 62.04, van oorsprong uit Zuid-Korea, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 2706/77 van de Raad
  type: main
