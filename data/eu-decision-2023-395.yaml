  script: Latn
  content: Commission Implementing Decision (EU) 2023/395 of 20 February 2023 establishing
    the equivalence, for the purpose of facilitating the right to free movement within
    the Union, of COVID-19 certificates issued by the Republic of Azerbaijan to the
    certificates issued in accordance with Regulation (EU) 2021/953 of the European
    Parliament and Council
  type: main
- language: fr
  script: Latn
