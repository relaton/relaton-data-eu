  content: '98/740/EC: Commission Decision of 14 December 1998 amending Decision 96/333/EC
    establishing health certification of live bivalve molluscs, echinoderms, tunicates
    and marine gastropods from third countries which are not covered by a specific
    decision (notified under document number C(1998) 4046)'
