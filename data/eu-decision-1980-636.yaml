title:
- language: en
  script: Latn
  content: '80/636/EEC: Commission Decision of 16 June 1980 authorizing the Irish
    Government to grant certain exemptions in respect of national road transport operations
    from Community social legislation relating to road transport (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/636/CEE: Décision de la Commission, du 16 juin 1980, autorisant le
    gouvernement irlandais à déroger, pour les transports nationaux par route, aux
    règlements communautaires en matière sociale dans le domaine des transports
    par route (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/636/EWG: Entscheidung der Kommission vom 16. Juni 1980 zur Ermächtigung
    der irischen Regierung im innerstaatlichen Straßenverkehr Ausnahmen von den Sozialvorschriften
    der Gemeinschaft auf dem Gebiet des Straßenverkehrs zuzulassen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/636/EØF: Kommissionens beslutning af 16. juni 1980 om bemyndigelse
