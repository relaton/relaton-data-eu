    fravige fællesskabsforordningerne på det sociale område inden for landevejstransport
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '80/636/ΕΟΚ : Απόφαση της Επιτροπής, της 16ης
