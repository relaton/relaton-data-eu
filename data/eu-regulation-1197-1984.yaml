title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1197/84 of 30 April 1984 re-establishing
    the levying of customs duties on certain babies' knitted outer garments, products
    of category 71 (code 0710), originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3570/83 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1197/84 de la Commission du 30 avril 1984 portant rétablissement
    de la perception des droits de douane applicables à certains vêtements de dessus
    pour bébés, de la catégorie 71 (code 0710), originaires de Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3570/83 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1197/84 der Kommission vom 30. April 1984 über die
    Wiedereinführung des Zollsatzes für bestimmte Oberkleidung für Säuglinge der
    Warenkategorie Nr. 71 (Kennziffer 0710) mit Ursprung in Malaysia, dem die in der
    Verordnung (EWG) Nr. 3570/83 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1197/84 af 30. april 1984 om genindførelse
    af opkrævning af toldafgifter for bestemte yderbeklædningsgenstande til spædbørn,
    under varekategori nr. 71 (kode 0710), som har oprindelse i Malaysia og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3570/83
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1197/84 της Επιτροπής
    της 30ής Απριλίου 1984 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένα
    εξωτερικά ενδύματα για βρέφη, προϊόντα της
    κατηγορίας 71 (κωδικός 0710), καταγωγής Μαλαισίας,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3570/83 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1197/84 della Commissione del 30 aprile 1984 che ripristina
    la riscossione dei dazi doganali applicabili a taluni indumenti esterni per bambini,
    della categoria di prodotti n. 71 (codice 0710), originari della Malaysia, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3570/83 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1197/84 van de Commissie van 30 april 1984 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sommige
    bovenkleding van brei- of haakwerk voor baby' s, van de categorie van produkten
    nr. 71 (codenummer 0710), van oorsprong uit Maleisië, waarvoor de algemene tariefpreferenties
    gelden als bepaald bij Verordening (EEG) nr. 3570/83 van de Raad
