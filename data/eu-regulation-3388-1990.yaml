  content: Commission Regulation (EEC) No 3388/90 of 26 November 1990 re-establishing
    the levying of customs duties on products of categories 65 (order No 40.0650),
    74 order No 40.0740 and 75 (order No 40.0750), originating in China, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3388/90 de la Commission du 26 novembre 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories n° 65 (numéro d'ordre 40.0650), n 74 (numéro d'ordre 40.0740)
    et n° 75 (numéro d'ordre 40.0750) originaires de la Chine, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3388/90 DER KOMMISSION vom 26. November 1990 ueber
    die Wiedereinfuehrung des Zollsatzes fuer die Waren der Warenkategorie Nr. 65
    (laufende Nummer 40.0650), der Warenkategorie Nr. 74 (laufende Nummer 40.0740)
    und der Warenkategorie Nr. 75 (laufende Nummer 40.0750) mit Ursprung in China,
    dem die in der Verordnung (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen
    gewaehrt werden
  type: main
- language: da
  script: Latn
