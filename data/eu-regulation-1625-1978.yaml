    από ένα οργανισμό παρεμβάσεως»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1625/78 della Commissione, del 12 luglio 1978, che
    modifica il regolamento (CEE) n. 1722/77 recante modalità comuni di applicazione
    del regolamento (CEE) n. 1055/77 relativo al magazzinaggio ed ai movimenti dei
    prodotti acquistati da un organismo d' intervento
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1625/78 van de Commissie van 12 juli 1978 houdende
    wijziging van Verordening (EEG) nr. 1722/77 tot vaststelling van gemeenschappelijke
    uitvoeringsbepalingen van Verordening (EEG) nr. 1055/77 betreffende de opslag
    en het verkeer van door interventiebureaus aangekochte produkten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1625/78 da Comissão, de 12 de Julho de 1978, que
    altera o Regulamento (CEE) n.° 1722/77 que estabelece as modalidades comuns de
    aplicação do Regulamento (CEE) n.° 1055/77 relativo à armazenagem e aos movimentos
    dos produtos comprados por um organismo de intervenção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1625/78 de la Comisión, de 12 de julio de 1978, por
