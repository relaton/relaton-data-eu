title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1625/78 of 12 July 1978 amending Regulation
    (EEC) No 1722/77 laying down common detailed rules for the application of Regulation
    (EEC) No 1055/77 on the storage and movement of products bought in by an intervention
    agency
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1625/78 de la Commission, du 12 juillet 1978, modifiant
    le règlement (CEE) n° 1722/77 portant modalités communes d' application du
    règlement (CEE) n° 1055/77 relatif au stockage et aux mouvements des produits
    achetés par un organisme d' intervention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1625/78 der Kommission vom 12. Juli 1978 zur Änderung
    der Verordnung (EWG) Nr. 1722/77 über gemeinsame Durchführungsbestimmungen zur
    Verordnung (EWG) Nr. 1055/77 über die Lagerung und das Verbringen der von Interventionsstellen
    gekauften Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1625/78 af 12. juli 1978 om ændring
    af forordning (EØF) nr. 1722/77 om fælles gennemførelsesbestemmelser til forordning
    (EØF) nr. 1055/77 om oplagring og flytning af varer opkøbt af et intervenventionsorgan
  type: main
- language: el
  script: Grek
