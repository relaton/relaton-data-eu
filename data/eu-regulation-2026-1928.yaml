title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1928 of 7 August 2026 imposing
    a definitive countervailing duty on imports of certain woven and/or stitched glass
    fibre fabrics originating in the People’s Republic of China and the Arab Republic
    of Egypt as extended to imports brought to offshore installations, to imports
    consigned from the Kingdom of Morocco whether declared as originating in the Kingdom
    of Morocco or not, and to imports consigned from Türkiye whether declared as
    originating in Türkiye or not following an expiry review pursuant to Article
    18 of the Regulation (EU) 2016/1037 of the European Parliament and the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2026/1928 de la Commission du 7 août 2026
    instituant un droit compensateur définitif sur les importations de certains tissus
    en fibres de verre tissées et/ou cousues originaires de la République populaire
    de Chine et de la République arabe d’Égypte, étendu aux importations acheminées
    vers des installations offshore, aux importations expédiées du Royaume du Maroc,
    qu’elles aient ou non été déclarées originaires de ce pays, et aux importations
    expédiées de Turquie, qu’elles aient ou non été déclarées originaires
    de ce pays, à l’issue d’un réexamen au titre de l’expiration des mesures
    effectué conformément à l’article 18 du règlement (UE) 2016/1037 du Parlement
    européen et du Conseil
  type: main
- language: de
  script: Latn
