    C(2022) 8694) (Only the French text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/2358 de la Commission du 1er décembre
    2022 concernant la mesure française introduisant une limitation de l’exercice
