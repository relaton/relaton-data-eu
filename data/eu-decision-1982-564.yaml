title:
- language: en
  script: Latn
  content: '82/564/EEC: Commission Decision of 2 August 1982 authorizing Greece to
    apply intra-Community surveillance to imports of hazelnuts originating in Turkey,
    which have been put into free circulation in the Community (Only the Greek text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/564/CEE: Décision de la Commission, du 2 août 1982, autorisant la
    Grèce à procéder à une surveillance intracommunautaire des importations de
    noisettes originaires de Turquie et mises en libre pratique dans la Communauté
    (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/564/EWG: Entscheidung der Kommission vom 2. August 1982 zur Ermächtigung
    Griechenlands zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus der Türkei stammenden und in der Gemeinschaft im freien Verkehr befindlichen
    Haselnüssen (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/564/EØF: Kommissionens beslutning af 2. august 1982 om bemyndigelse
    af Grækenland til at indføre tilsyn inden for Fællesskabet med indførsel af
    hasselnødder med oprindelse i Tyrkiet og overgået til fri omsætning i Fællesskabet
    (Kun den graeske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/564/EOK: Απόφαση τής Επιτροπής τής 2ας Αυγούστου
    1982 περί χορηγήσεως αδείας στήν Ελληνική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών λεπτοκαρύων καταγωγής Τουρκίας
    τά οποία ευρίσκονται σέ ελεύθερη κυκλοφορία
    στήν Κοινότητα (Το κείμενο στην ελληνική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/564/CEE: Decisione della Commissione, del 2 agosto 1982, che autorizza
    la Grecia ad istituire una sorveglianza intracomunitaria delle importazioni di
    nocciole originarie della Turchia e messe in libera pratica nella Comunità (Il
    testo in lingua greca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/564/EEG: Beschikking van de Commissie van 2 augustus 1982 houdende
    machtiging van Griekenland tot toepassing van een intracommunautair toezicht ten
    aanzien van de invoer van hazelnoten, van oorsprong uit Turkije, die in de Gemeenschap
    in het vrije verkeer zijn gebracht (Slechts de tekst in de Griekse taal is authentiek)'
