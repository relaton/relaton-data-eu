title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1981/88 of 5 July 1988 amending Regulation
    (EEC) No 296/86 on the implementation of the arrangements for inward processing,
    outward processing and processing under customs control in trade between Member
    States of the Community as constituted on 31 December 1985 and Spain and Portugal
    and also trade between the two new Member States for such time as customs duties
    are levied in such trade
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1981/88 de la Commission du 5 juillet 1988 modifiant
    le règlement (CEE) n° 296/86 relatif à l' application des régimes de perfectionnement
    actif, de perfectionnement passif et de la transformation sous douane dans les
    échanges entre les États membres de la Communauté dans sa composition au 31
    décembre 1985, d' une part, et l' Espagne ou le Portugal, d' autre part, ainsi
    que dans les échanges entre les deux nouveaux États membres, pendant la période
    durant laquelle des droits de douane sont perçus lors de ces échanges
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1981/88 der Kommission vom 5. Juli 1988 zur Änderung
    der Verordnung (EWG) Nr. 296/86 über die Durchführung des aktiven und passiven
    Veredelungsverkehrs und des Umwandlungsverkehrs im Handel zwischen den Mitgliedstaaten
    der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985 einerseits und
    Spanien und Portugal andererseits sowie im Handel zwischen den beiden neuen Mitgliedstaaten,
    solange in diesem Handel Zölle erhoben werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1981/88 af 5. juli 1988 om ændring
    af forordning (EØF) nr. 296/86 om anvendelse af procedurerne for aktiv forædling,
    passiv forædling og forarbejdning af varer under toldkontrol i samhandelen mellem
    medlemsstaterne i Fællesskabet i dets sammensætning den 31. december 1985 på
    den ene side og Spanien og Portugal på den anden side, samt i samhandelen mellem
    de to nye medlemsstater, så længe der opkræves told i denne samhandel
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1981/88 της Επιτροπής
    της 5ης Ιουλίου 1988 για την τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 296/86 σχετικά με την εφαρμογή των καθεστώτων
