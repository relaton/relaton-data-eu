    los regímenes de perfeccionamiento activo, de perfeccionamiento pasivo y de transformación
    bajo control aduanero a los intercambios entre los Estados miembros de la Comunidad
    en su composición de 31 de diciembre de 1985, por una parte, y España o Portugal,
    por otra parte, así como a los intercambios entre los dos nuevos Estados miembros,
    durante el período en que se perciban derechos de aduana con ocasión de tales
    intercambios
