  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1981/88 della Commissione del 5 luglio 1988 che modifica
    il regolamento (CEE) n. 296/86 relativo all' applicazione dei regimi di perfezionamento
    attivo, di perfezionamento passivo e della trasformazione sotto controllo doganale
    negli scambi tra gli Stati membri della Comunità nella sua composizione al 31
    dicembre 1985, da una parte, e la Spagna e il Portogallo, dall' altra, e negli
    scambi tra i due nuovi Stati membri nel periodo in cui su tali scambi sono riscossi
    dazi doganali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1981/88 van de Commissie van 5 juli 1988 tot wijziging
    van Verordening (EEG) nr. 296/86 inzake de toepassing van de regelingen ,,actieve
    veredeling", ,,passieve veredeling" en ,,behandeling onder douanetoezicht" in
    het handelsverkeer tussen de Lid-Staten van de Gemeenschap in haar samenstelling
    van 31 december 1985, enerzijds, en Spanje of Portugal, anderzijds, alsmede in
    het handelsverkeer tussen de twee nieuwe Lid-Staten gedurende de periode waarin
    in dat verkeer douanerechten worden geheven
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1981/88 da Comissão de 5 de Julho de 1988 que altera
    o Regulamento (CEE) n.° 296/86, relativo à aplicação dos regimes de aperfeiçoamento
    activo, de aperfeiçoamento passivo e da transformação sob controlo aduaneiro
    nas trocas comerciais entre os Estados-membros da Comunidade, na sua composição
    em 31 de Dezembro de 1985, e a Espanha ou Portugal, bem como nas trocas comerciais
    entre os dois novos Estados-membros, durante o período em que os direitos aduaneiros
    são cobrados por ocasião dessas trocas
  type: main
- language: es
