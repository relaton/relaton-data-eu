id: EUDecision1980526
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/526/EEC: Commission Decision of 12 May 1980 authorizing Ireland not
    to apply Community treatment to outer garments, falling within subheading ex 60.05
    A II of the Common Customs Tariff (category 83), originating in Hong Kong and
    in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/526/CEE: Décision de la Commission, du 12 mai 1980, autorisant l''Irlande
    à exclure du traitement communautaire les vêtements de dessus, de la sous- position
    ex 60.05 A II du tarif douanier commun (catégorie 83), originaires de Hong-kong
    et mis en libre pratique dans les autres Etats membres (Le texte en langue anglaise
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/526/EWG: Entscheidung der Kommission vom 12. Mai 1980, mit der Irland
    ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Oberkleidung der Tarifstelle ex 60.05 A II des Gemeinsamen
    Zolltarifs (Kategorie 83) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/526/EØF: Kommissionens beslutning af 12. maj 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage yderbeklædningsgenstande,
    som henhører under pos. ex 60.05 A II i den fælles toldtarif (kategori 83),
    har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater (Kun
    den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/526/CEE: Decisione della Commissione, del 12 maggio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario gli indumenti esterni della
    sottovoce ex 60.05 A II della tariffa doganale comune, categoria 83, originari
    di Hong Kong e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/526/EEG: Beschikking van de Commissie van 12 mei 1980 waarbij Ierland
    wordt gemachtigd bovenkleding, van post ex 60.05 A II van het gemeenschappelijk
    douanetarief (categorie 83), van oorsprong uit Hong-Kong en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
