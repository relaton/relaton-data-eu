    PROVVISORIA DEL PROTOCOLLO CHE FISSA LE POSSIBILITA DI PESCA E LA COMPENSAZIONE
    FINANZIARIA PREVISTE DALL'' ACCORDO TRA LA COMUNITA ECONOMICA EUROPEA E IL GOVERNO
    DELLA REPUBBLICA DEMOCRATICA DI SAO TOME E PRINCIPE PER IL PERIODO DAL 1 GIUGNO
    1990 AL 31 MAGGIO 1993'
  type: main
