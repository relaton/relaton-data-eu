    PROTOCOLO POR EL QUE SE FIJAN LAS POSIBILIDADES DE PESCA Y LA COMPENSACION FINANCIERA
    ESTABLECIDAS EN EL ACUERDO ENTRE LA COMUNIDAD ECONOMICA EUROPEA Y EL GOBIERNO
    DE LA REPUBLICA DEMOCRATICA DE SANTO TOME Y PRINCIPE SOBRE LA PESCA EN AGUAS DE
    SANTO TOME Y PRINCIPE, DURANTE EL PERIODO COMPRENDIDO ENTRE EL 1 DE JUNIO DE 1990
