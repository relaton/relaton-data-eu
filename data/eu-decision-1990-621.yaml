title:
- language: en
  script: Latn
  content: '90/621/EEC: Council Decision of 22 October 1990 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of the protocol establishing, for the period 1 June 1990 to 31 May 1993, the fishing
    rights and financial compensation provided for in the Agreement between the European
    Economic Community and the government of the Democratic Republic of Sao Tome e
    Principe on fishing off Sao Tome e Principe'
  type: main
- language: fr
  script: Latn
  content: '90/621/CEE: Décision du Conseil du 22 octobre 1990, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pèche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République démocratique de São Tomé et Príncipe concernant la pèche
    au large de São Tomé et Príncipe, pour la période du 1er juin 1990 au 31 mai
    1993'
  type: main
- language: de
  script: Latn
  content: '90/621/EWG: BESCHLUSS DES RATES VOM 22. OKTOBER 1990 UEBER DEN ABSCHLUSS
    DES ABKOMMENS IN FORM EINES BRIEFWECHSELS UEBER DIE VORLAEUFIGE ANWENDUNG DES
    PROTOKOLLS ZUR FESTLEGUNG DER FANGMOEGLICHKEITEN UND DES FINANZIELLEN AUSGLEICHS
    NACH DEM ABKOMMEN ZWISCHEN DER EUROPAEISCHEN WIRTSCHAFTSGEMEINSCHAFT UND DER REGIERUNG
    DER DEMOKRATISCHEN REPUBLIK SAO TOME UND PRINCIPE UEBER DIE FISCHEREI VOR DER
    KUESTE VON SAO TOME UND PRINCIPE FUER DIE ZEIT VOM 1. JUNI 1990 BIS ZUM 31. MAI
    1993'
  type: main
- language: da
  script: Latn
  content: '90/621/EOEF: RAADETS AFGOERELSE AF 22. OKTOBER 1990 OM INDGAAELSE AF AFTALEN
    I FORM AF BREVVEKSLING OM MIDLERTIDIG ANVENDELSE AF PROTOKOLLEN OM FASTSAETTELSE
    AF DE FISKERIMULIGHEDER OG DEN FINANSIELLE GODTGOERELSE, DER ER OMHANDLET I AFTALEN
    MELLEM DET EUROPAEISKE OEKONOMISKE FAELLESSKAB OG REGERINGEN FOR DEN DEMOKRATISKE
    REPUBLIK SAO TOME OG PRINCIPE OM FISKERI UD FOR SAO TOME OG PRINCIPES KYSTER,
    FOR PERIODEN FRA 1. JUNI 1990 TIL 31. MAJ 1993'
  type: main
- language: el
  script: Grek
  content: '90/621/ΕΟΚ: Απόφαση του Συμβουλίου της 22ας
    Οκτωβρίου 1990 σχετικά με τη σύναψη της συμφωνίας
    υπό μορφή ανταλλαγής επιστολών για την προσωρινή
    εφαρμογή του πρωτοκόλλου που καθορίζει τις
    δυνατότητες αλιείας και τη χρηματική αντιστάθμιση
    που προβλέπονται στη συμφωνία μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της κυβέρνησης
    της Λαϊκής Δημοκρατίας του Sao Tome και Principe όσον
    αφορά την αλιεία στα ανοικτά του Sao Tome και Principe
    για την περίοδο από την 1η Ιουνίου 1990 έως τις
    31 Μαΐου 1991'
  type: main
- language: it
  script: Latn
  content: '90/621/CEE: DECISIONE DEL CONSIGLIO, DEL 22 OTTOBRE 1990, RELATIVA ALLA
