id: EURegulation17231973
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1723/73 of the Commission of 28 June 1973 re-establishing
    Common Customs Tariff duties on illuminating glassware, signalling glassware and
    optical elements of glass, not optically worked nor of optical glass, other, falling
    within subheading No 70.14 B, originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1723/73 de la Commission, du 28 juin 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    à la verrerie d' éclairage, de signalisation et d' optique commune, autres,
    de la sous-position tarifaire 70.14 B, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1723/73 der Kommission vom 28. Juni 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Glaswaren für Beleuchtung, für
    Signalvorrichtungen oder zu optischen Zwecken, nicht aus optischem Glas, nicht
    optisch bearbeitet, andere, der Tarifstelle 70.14 B, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2762/72 des Rates vom 19. Dezember 1972 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1723/73 af 28. juni 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for belysningsartikler af glas ; refleksglas
    ; optiske artikler af glas ; hverken optisk bearbejdet eller af optisk glas, i
    andre tilfælde under position 70.14 B, som har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2762/72
    af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1723/73 della Commissione, del 28 giugno 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    vetrerie per illuminazione, per segnalazione e per ottica comune, altri, della
    sottovoce doganale n. 70.14 B originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1723/73 van de Commissie van 28 juni 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op verlichtingsartikelen, signaal- en waarschuwingsartikelen, van
    glas; optische elementen van gewoon glas, niet optisch bewerkt, en andere van
    onderverdeling 70.14 B, van oorsprong uit Joegoslavië, ten behoeve waarvan bij
    Verordening (EEG) nr. 2762/72 van de Raad van 19 december 1972 algemene tariefpreferenties
    werden geopend
  type: main
