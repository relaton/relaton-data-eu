- language: en
  script: Latn
  content: Council Regulation (EEC) No 995/87 of 23 March 1987 on the application
    of Decision No 3/86 of the EEC- Switzerland Joint Committee supplementing and
    amending Protocol No 3 concerning the definition of the concept of ' originating
    products' and methods of administrative cooperation with a view to simplifying
    the documentation relating to evidence of origin
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 995/87 du Conseil du 23 mars 1987 concernant l' application
    de la décision nº 3/86 du comité mixte CEE-Suisse complétant et modifiant
    le protocole nº 3 relatif à la définition de la notion de «produits originaires»
    et aux méthodes de coopération administrative, aux fins de simplifier la documentation
    relative à la preuve de l' origine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 995/87 des Rates vom 23. März 1987 zur Anwendung
    des Beschlusses Nr. 3/86 des Gemischten Ausschusses EWG-Schweiz zur Ergänzung
    und Änderung des Protokolls Nr. 3 über die Bestimmung des Begriffs "Erzeugnisse
    mit Ursprung in" oder "Ursprungserzeugnisse" und über die Methoden der Zusammenarbeit
    der Verwaltungen zwecks Vereinfachung der Belege zum Nachweis des Ursprungs
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 995/87 af 23. marts 1987 om gennemførelse
    af afgørelse nr. 3/86, truffet af Den blandede Komité EØF-Schweiz, om supplering
    og ændring af protokol nr. 3 angående definitionen af begrebet »varer med oprindelsesstatus«
    og angående metoderne for administrativt samarbejde med henblik på at forenkle
    dokumentationen for oprindelsesstatus
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 995/87 του Συμβουλίου
    της 23ης Μαρτίου 1987 για την εφαρμογή της απόφασης
    αριθ. 3/86 της Μεικτής Επιτροπής ΕΟΚ-Ελβετίας
    που συμπληρώνει και τροποποιεί το πρωτόκολλο
    αριθ. 3 περί του ορισμού της εννοίας «καταγόμενα
    προϊόντα» ή «προϊόντα καταγωγής» και περί
    των μεθόδων διοικητικής συνεργασίας, με σκοπό
    να απλουστευθεί η τεκμηρίωση σχετικά με την
    απόδειξη της καταγωγής
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 995/87 del Consiglio del 23 marzo 1987 relativo all'
    applicazione della decisione n. 3/86 del Comitato misto CEE-Svizzera che completa
    e modifica il protocollo n. 3 relativo alla definizione della nozione di «prodotti
    originari» ed ai metodi cooperazione amministrativa, al fine di semplificare
    la documentazione relativa alla prova dell' origine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 995/87 van de Raad van 23 maart 1987 betreffende
    de toepassing van Besluit nr. 3/86 van het Gemengd Comité EEG-Zwitserland houdende
    aanvulling en wijziging van Protocol nr. 3 betreffende de definitie van het begrip
    "produkten van oorsprong" en de methoden van administratieve samenwerking, ten
    einde de documenten betreffende het bewijs van de oorsprong te vereenvoudigen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 995/87 do Conselho de 23 de Março de 1987 relativo
