title:
- language: en
  script: Latn
  content: '90/112/EEC: Commission Decision of 19 February 1990 amending Decision
    88/324/EEC establishing the amendments to be made in respect of potatoes, to the
    measures taken by Denmark to protect itself against the introduction of Corynebacterium
    sepedonicum (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/112/CEE: Décision de la Commission du 19 février 1990 modifiant la
    décision 88/324/CEE fixant les modifications à apporter, pour les pommes de
    terre, aux mesures prises par le Danemark pour se protéger contre l''introduction
    de Corynebacterium sepedonicum (Le texte en langue danoise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '90/112/EWG: Entscheidung der Kommission vom 19. Februar 1990 zur Änderung
    der Entscheidung 88/324/EWG ueber Änderungen zu den Schutzmaßnahmen Dänemarks
    gegen die Einschleppung von bakterieller Ringfaeule bei Kartoffeln (Nur der dänische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/112/EØF: Kommissionens beslutning af 19. februar 1990 om ændring
    af beslutning 88/324/EØF om ændringer af de foranstaltninger, som Danmark har
    truffet med hensyn til kartofler for at beskytte sig imod indslaebning af Corynebacterium
    sepedonicum (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/112/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Φεβρουαρίου 1990 για την τροποποίηση της απόφασης
    88/324/ΕΟΚ που καθορίζει τις τροποποιήσεις που
    πρέπει να επέλθουν όσον αφορά τα γεώμηλα στα
    μέτρα που έλαβε η Δανία προκειμένου να προστατευθεί
    από την εισαγωγή του cοrynebacterium sepedonicum στο έδαφός
    της (Το κείμενο στην δανική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/112/CEE: Decisione della Commissione del 19 febbraio 1990 che modifica
    la decisione 88/324/CEE relativa alle modifiche da apportare alle misure adottate
    dalla Danimarca nel settore delle patate per prevenire l''introduzione nel paese
    del "Corynebacterium sepedonicum" (Il testo in lingua danese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '90/112/EEG: Beschikking van de Commissie van 19 februari 1990 tot wijziging
    van Beschikking 88/324/EEG houdende vaststelling van de wijzigingen die voor aardappelen
    moeten worden aangebracht in de maatregelen die Denemarken heeft vastgesteld om
    zich te beschermen tegen het binnenbrengen van Corynebacterium sepedonicum (Slechts
    de tekst in de Deense taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/112/CEE: Decisão da Comissão de 19 de Fevereiro de 1990 que altera
    a Decisao 88/324/CEE que estabelece as alteraçoes a introduzir, relativamente
    às batatas, nas medidas adoptadas pela Dinamarca para se proteger contra a introduçao
    de Corynebacterium sepedonicum (Apenas faz fé o texto em língua dinamarquesa)'
  type: main
- language: es
  script: Latn
  content: '90/112/CEE: Decisión de la Comisión de 19 de febrero de 1990 que modifica
