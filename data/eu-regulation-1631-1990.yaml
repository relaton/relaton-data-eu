title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1631/90 of 15 June 1990 re-establishing
    the levying of customs duties on prepared unrecorded media falling within CN codes
    8523 and 8524, originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1631/90 de la Commission du 15 juin 1990 portant rétablissement
    de la perception des droits de douane applicables aux supports des codes NC 8523
    et 8524, originaires de Chine, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
