title:
- language: en
  script: Latn
  content: Regulation (EEC) No 521/70 of the Council of 17 March 1970 on exceptional
    measures in respect of imports into the French overseas departments of certain
    agricultural products originating in the Associated African States and Madagascar
    or in the Overseas Countries and Territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 521/70 du Conseil, du 17 mars 1970, prévoyant des
    mesures dérogatoires en ce qui concerne les importations dans les départements
    français d'outre- mer de certains produits agricoles originaires des États africains
    et malgache associés ou des pays et territoires d'outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 521/70 des Rates vom 17. März 1970 über Ausnahmebestimmungen
    bei der Einfuhr bestimmter landwirtschaftlicher Erzeugnisse mit Ursprung in den
    assoziierten afrikanischen Staaten und Madagaskar oder den überseeischen Ländern
    und Gebieten in die französischen überseeischen Departements
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 521/70 af 17. marts 1970 om fastsættelse
    af undtagelsesbestemmelser for indførsel i de franske oversøiske departementer
    af visse landbrugsvarer med oprindelse i de associerede afrikanske stater og Madagascar
    eller i de oversøiske lande og territorier
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 521/70 del Consiglio, del 17 marzo 1970, che prevede
    misure di deroga per quanto concerne le importazioni nei dipartimenti francesi
    d'oltremare di taluni prodotti agricoli originari degli Stati africani e malgascio
    associati o dei paesi e territori d'oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 521/70 van de Raad van 17 maart 1970 houdende afwijkende
    maatregelen voor de invoer in de Franse overzeese departementen van sommige landbouwprodukten
    van oorsprong uit de geassocieerde Afrikaanse Staten en Madagaskar of de landen
    en gebieden overzee
  type: main
