  content: Council Directive 1999/85/EC of 22 October 1999 amending Directive 77/388/EEC
    as regards the possibility of applying on an experiment basis a reduced VAT rate
    on labour-intensive services
  type: main
- language: fr
  script: Latn
  content: Directive 1999/85/CE du Conseil, du 22 octobre 1999, modifiant la directive
    77/388/CEE en ce qui concerne la possibilité d'appliquer à titre expérimental
    un taux de TVA réduit sur les services à forte intensité de main-d'oeuvre
  type: main
- language: de
  script: Latn
