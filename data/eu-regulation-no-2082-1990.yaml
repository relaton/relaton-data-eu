title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2082/90 of 20 July 1990 fixing for the 1990/91
    marketing year the minimum price to be paid to producers for unprocessed dried
    figs and the amount of production aid for dried figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2082/90 de la Commission du 20 juillet 1990 fixant,
    pour la campagne 1990/1991, le prix minimal à payer aux producteurs pour les
    figues sèches non transformées ainsi que le montant de l'aide à la production
    pour les figues sèches
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2082/90 DER KOMMISSION vom 20. Juli 1990 zur Festsetzung
    des den Erzeugern unverarbeiteter getrockneter Feigen zu zahlenden Mindestpreises
    sowie der Produktionsbeihilfe fuer getrocknete Feigen im Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2082/90 af 20. juli 1990 om fastsættelse
    af den minimumspris, der skal betales producenten for uforarbejdede tørrede figner
    i produktionsåret 1990/91
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2082/90 της Επιτροπής
    της 20ής Ιουλίου 1990 σχετικά με τον καθορισμό,
    για την περίοδο εμπορίας 1991/91, της ελάχιστης
    τιμής που καταβάλλεται στους παραγωγούς για
    τα μη μεταποιημένα ξηρά σύκα και του ποσού
    της ενίσχυσης στην παραγωγή για τα ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2082/90 DELLA COMMISSIONE del 20 luglio 1990 che fissa,
    per la campagna di commercializzazione 1990/1991, il prezzo minimo da pagare ai
    produttori di fichi secchi non trasformati e l'importo dell'aiuto alla produzione
    per i fichi secchi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2082/90 VAN DE COMMISSIE van 20 juli 1990 tot vaststelling,
    voor het verkoopseizoen 1990/1991, van de voor niet verwerkte gedroogde vijgen
    aan de telers te betalen minimumprijs, alsmede van het bedrag van de produktiesteun
    voor gedroogde vijgen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2082/90 DA COMISSAO de 20 de Julho de 1990 que fixa,
    para a campanha de comercializaçao de 1990/1991, o preço minimo a pagar aos
    produtores para os figos secos nao transformados e o montante da ajuda à produçao
    para os figos secos
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2082/90 DE LA COMISION de 20 de julio de 1990 por el
    que se establece el precio minimo que debe pagarse a los productores de higos
    secos no transformados y el importe de la ayuda a la produccion de higos secos
    para la campana de 1990/91
  type: main
