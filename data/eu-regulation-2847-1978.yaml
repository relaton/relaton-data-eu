title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2847/78 of 4 December 1978 re-establishing
    the levying of customs duties on electrical capacitors, fixed or variable, falling
    within heading No 85.18 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2847/78 de la Commission, du 4 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux condensateurs
    électriques, fixes, variables ou ajustables, de la position tarifaire 85.18,
    originaires de Yougoslavie, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2847/78 der Kommission vom 4. Dezember 1978 zur Wiedereinführung
    des Zollsatzes fúr elektrische Festkondensatoren, Drehkondensatoren und andere
    einstellbare Kondensatoren der Tarifnummer 85.18, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2705/77 des Rates vorgesehenen Zollpráferenzen
    gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2847/78 af 4. december 1978 om genindførelse
    af opkrævning af toldafgifter for elektriske kondensatorer, faste eller variable,
    under position 85.18, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2847/78 della Commissione, del 4 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili ai condensatori elettrici,
    fissi, variabili o regolabili, della voce doganale 85.18, originari della Iugoslavia,
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2705/77
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2847/78 van de Commissie van 4 december 1978 houdende
    wederinstelling van de douanerechten van toepassing op elektronische condensatoren
    (vaste condensatoren, draaicondensatoren en regelbare of instelbare condensatoren),
    van post 85.18, van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening
    (EEG) nr. 2705/77 van de Raad algemene tariefpreferenties werden geopend
  type: main
