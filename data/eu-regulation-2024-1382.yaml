    Ακτή)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2024/1382, 23. mai 2024, millega laiendatakse
    erandit nõukogu määrusest (EÜ) nr 1967/2006 seoses keeluga püüda kala kaitstud
    elupaikade kohal, gangui-traaleritega püügi miinimumkaugusega rannikust ja minimaalse
    meresügavusega selle püügi korral teatavates Prantsusmaa (Provence-Alpes-Côte
    d’Azur) territoriaalvetes
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2024/1382, annettu 23 päivänä
    toukokuuta 2024, neuvoston asetuksesta (EY) N:o 1967/2006 myönnetyn, suojeltavien
    luontotyyppien yläpuolella tapahtuvan kalastuksen kieltämistä, vähimmäisetäisyyttä
    rannikolta ja veden vähimmäissyvyyttä koskevan poikkeuksen jatkamisesta kalastettaessa
    gangui-troolareilla tietyillä Ranskan aluevesillä (Provence-Alpes-Côte d’Azur)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2024/1382 ón gCoimisiún an 23 Bealtaine
    2024 lena gcuirtear síneadh leis an maolú ar Rialachán (CE) Uimh. 1967/2006
    ón gComhairle a mhéid a bhaineann leis an toirmeasc ar iascaireacht os cionn
    gnáthóga faoi chosaint, an fad íosta ón gcósta agus doimhneacht íosta na
    mara le haghaidh na dtrálaer gangui a bhíonn ag iascaireacht in uiscí teorann
    áirithe de chuid na Fraince (Provence-Alpes-Côte d’Azur)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2024/1382 оd 23. svibnja 2024. o produljenju
    odstupanja od Uredbe Vijeća (EZ) br. 1967/2006 u pogledu zabrane ribolova iznad
    zaštićenih staništa, minimalne udaljenosti od obale i minimalne dubine mora
    za plovila s mrežama potegačama vrste gangui u određenim teritorijalnim vodama
    Francuske (Provansa-Alpe-Azurna obala)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2024/1382 végrehajtási rendelete (2024. május 23.)
    az 1967/2006/EK tanácsi rendelettől a Franciaország egyes felségvizein (Provence-Alpes-Côte
    d’Azur) gangui vonóhálót üzemeltető hajók vonatkozásában a védett élőhelyek
    feletti halászati tilalom, a hálók legkisebb merítési mélysége és használatuk
    parttól számított legkisebb távolsága tekintetében történő eltérés
    meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2024/1382 della Commissione, del 23 maggio
    2024, che proroga la deroga al regolamento (CE) n. 1967/2006 del Consiglio per
    quanto riguarda il divieto di pescare al di sopra di habitat protetti, la distanza
    minima dalla costa e la profondità minima per i pescherecci da traino provvisti
    dell'attrezzo denominato gangui operanti in talune acque territoriali francesi
    (Provence-Alpes-Côte d'Azur)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2024/1382 (2024. gada 23. maijs), ar
    ko attiecībā uz aizliegumu zvejot virs aizsargājamām dzīvotnēm un minimālo
    attālumu no krasta un minimālo jūras dziļumu, kas jāievēro kuģiem, kuri
    noteiktos Francijas (Provansas-Alpu-Kotdazīras) teritoriālajos ūdeņos zvejo
    ar gangui tipa trali, pagarina atkāpi no Padomes Regulas (EK) Nr. 1967/2006
  type: main
- language: lt
  script: Latn
  content: 2024 m. gegužės 23 d. Komisijos įgyvendinimo reglamentas (ES) 2024/1382,
    kuriuo pratęsiamas nuostatos, leidžiančios nukrypti nuo Tarybos reglamente
    (EB) Nr. 1967/2006 nustatytų žvejybos virš saugomų buveinių draudimo ir minimalaus
    atstumo nuo kranto bei minimalaus jūros gylio reikalavimų, taikomos tam tikruose
    Prancūzijos teritoriniuose vandenyse (Provanso-Alpių-Žydrojo Kranto regione)
    gangui tipo tralais žvejojantiems traleriams, galiojimas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2024/1382 tat-23
    ta’ Mejju 2024 li jistabbilixxi deroga mir-Regolament tal-Kunsill (KE) Nru 1967/2006
    fir-rigward tal-projbizzjoni tas-sajd f’ħabitats protetti, id-distanza minima
    mill-kosta u l-fond minimu tal-baħar għall-bastimenti tat-tkarkir gangui li
    jistadu f’ċertu ilmijiet territorjali ta’ Franza (Provence-Alpes-Côte d’Azur)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2024/1382 van de Commissie van 23 mei 2024
    tot verlenging van een afwijking van Verordening (EG) nr. 1967/2006 van de Raad
    wat betreft het verbod om boven beschermde habitats te vissen, de minimumafstand
    van de kust en de minimumzeediepte voor gangui-trawlers in bepaalde territoriale
    wateren van Frankrijk (Provence-Alpes-Côte d’Azur)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2024/1382 z dnia 23 maja 2024 r.
    przedłużające odstępstwo od rozporządzenia Rady (WE) nr 1967/2006 w odniesieniu
    do zakazu połowów nad chronionymi siedliskami, minimalnych odległości od brzegu
    i minimalnej głębokości morza dla trawlerów stosujących sieci typu gangui,
    prowadzących połowy na niektórych wodach terytorialnych Francji (Provence-Alpes-Côte
    d’Azur)
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2024/1382 da Comissão, de 23 de maio de
    2024, que prorroga a derrogação ao Regulamento (CE) n.o 1967/2006 do Conselho
    no respeitante à proibição de pesca em habitats protegidos, à distância mínima
    da costa e à profundidade mínima para os arrastões gangui que pescam em determinadas
    águas territoriais de França (Provence-Alpes-Côte d’Azur)
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2024/1382 al Comisiei din 23 mai
    2024 de prelungire a unei derogări de la Regulamentul (CE) nr. 1967/2006 al Consiliului
    în ceea ce privește interzicerea pescuitului deasupra habitatelor protejate,
    distanța minimă față de coastă și adâncimea minimă a mării pentru traulerele
    echipate cu traule de tip gangui care pescuiesc în anumite ape teritoriale ale
    Franței (Provence-Alpes-Côte d’Azur)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2024/1382 z 23. mája 2024, ktorým
    sa predlžuje platnosť výnimky z nariadenia Rady (ES) č. 1967/2006, pokiaľ
    ide o zákaz lovu nad chránenými biotopmi, minimálnu vzdialenosť od pobrežia
    a minimálnu hĺbku mora v prípade lovu plavidlami s vlečnými sieťami typu
    gangui v určitých pobrežných vodách Francúzska (Provence-Alpes-Côte d’Azur)
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2024/1382 z dne 23. maja 2024 o podaljšanju
    odstopanja od Uredbe Sveta (ES) št. 1967/2006 glede prepovedi ribolova nad zaščitenimi
    habitati, najmanjše oddaljenosti od obale in najmanjše morske globine za plovila
    z vlečnimi mrežami tipa gangui, ki lovijo v določenih teritorialnih vodah Francije
    (Provansa - Alpe - Azurna obala)
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2024/1382 de la Comisión, de 23 de mayo
    de 2024, por el que se prorroga una excepción al Reglamento (CE) n.o 1967/2006
    del Consejo en lo que respecta a la prohibición de pescar por encima de hábitats
    protegidos, la distancia mínima de la costa y la profundidad marina mínima para
    los arrastreros que pescan con gangui en determinadas aguas territoriales de Francia
    (Provenza-Alpes-Costa Azul)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2024/1382 av den 23 maj 2024
    om förlängning av ett undantag från rådets förordning (EG) nr 1967/2006 vad
    gäller förbudet mot fiske ovanför skyddade livsmiljöer samt minimiavståndet
    från kusten och minimidjupet för fiske med trålare av gangui-typ i vissa territorialvatten
    i Frankrike (Provence-Alpes-Côte d’Azur)
