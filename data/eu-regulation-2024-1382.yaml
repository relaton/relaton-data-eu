title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2024/1382 of 23 May 2024 extending
    a derogation from Council Regulation (EC) No 1967/2006 as regards the prohibition
    to fish above protected habitats, the minimum distance from the coast and the
    minimum sea depth for the gangui trawlers fishing in certain territorial waters
    of France (Provence-Alpes-Côte d’Azur)
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/1382 de la Commission du 23 mai 2024
    portant prolongation de la dérogation au règlement (CE) no 1967/2006 du Conseil
    en ce qui concerne l’interdiction de la pêche au-dessus des habitats protégés
    ainsi que la distance minimale de la côte et la profondeur minimale pour les
    chalutiers équipés de chaluts de type gangui pêchant dans certaines eaux territoriales
    de la France (Provence-Alpes-Côte d’Azur)
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2024/1382 der Kommission vom 23. Mai 2024
    zur Gewährung einer Ausnahme von der Verordnung (EG) Nr. 1967/2006 des Rates
    hinsichtlich des Verbots der Fischerei über geschützten Lebensräumen, der Mindestentfernung
    von der Küste und der Mindestwassertiefe für die Gangui-Trawler beim Fischfang
    in bestimmten Hoheitsgewässern Frankreichs (Provence-Alpes-Côte d’Azur)
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2024/1382 на Комисията
    от 23 май 2024 година за удължаване на срока на
    дерогация от Регламент (ЕО) № 1967/2006 на Съвета
    по отношение на забраната за риболов над защитени
    местообитания, минималното разстояние от брега
    и минималната дълбочина за риболов с траулери
    с мрежи gangui в определени териториални води
    на Франция (Provence-Alpes-Côte d’Azur)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2024/1382 ze dne 23. května 2024,
    kterým se prodlužuje odchylka od nařízení Rady (ES) č. 1967/2006, pokud
    jde o zákaz rybolovu nad chráněnými stanovišti, minimální vzdálenost od
    pobřeží a minimální hloubku moře pro traulery typu gangui lovící v některých
    teritoriálních vodách Francie (Provence-Alpes-Côte d'Azur)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2024/1382 af 23. maj 2024
    om forlængelse af en fravigelse af Rådets forordning (EF) nr. 1967/2006 for
    så vidt angår forbuddet mod fiskeri hen over beskyttede habitater, mindsteafstanden
    fra kysten og mindstedybden for fiskeri med gangui-trawlere i visse franske territorialfarvande
    (Provence-Alpes-Côte d'Azur)
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2024/1382 της Επιτροπής,
    της 23ης Μαΐου 2024, για την παράταση της παρέκκλισης
    από τον κανονισμό (ΕΚ) αριθ. 1967/2006 του Συμβουλίου
    όσον αφορά την απαγόρευση της αλιείας πάνω
