id: EURegulation12841996
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1284/96 of 3 July 1996 initiating a 'new
    exporter' review of Council Regulation (EEC) No 830/92 concerning the imposition
    of definitive anti-dumping duties on imports of certain polyester yarns (man-made
    staple fibres) originating, inter alia, in Turkey, repealing the duty with regard
    to imports from an exporter in this country and making these imports subject to
    registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1284/96 de la Commission du 3 juillet 1996 portant
    ouverture d'un réexamen pour un nouvel exportateur du règlement (CEE) nº 830/92
    du Conseil, instituant un droit antidumping définitif sur les importations de
    certains fils de polyesters (fibres synthétiques ou artificielles discontinues)
    originaires, entre autres, de Turquie, abrogeant le droit pour les importations
    en provenance d'un exportateur dans ce pays et soumettant ces importations à
    enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1284/96 der Kommission vom 3. Juli 1996 zur Einleitung
    einer Überprüfung der Verordnung (EWG) Nr. 830/92 des Rates zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren bestimmter Polyestergarne
    (Spinnfasern) mit Ursprung unter anderem in der Türkei, zur Aufhebung des Zolls
    auf die Einfuhren eines Ausführers in der Türkei und zur zollamtlichen Erlassung
    dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1284/96 af 3. juli 1996 om indledning
    af en fornyet undersøgelse (»ny eksportør«) af Rådets forordning (EØF) nr.
    830/92 om indførelse af en endelig antidumpingtold på importen af visse garner
    (korte kemofibre) med oprindelse i bl.a. Tyrkiet, om ophævelse af tolden for
    så vidt angår importen fra en eksportør i dette land og om indførelse af registrering
    af denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1284/96 της Επιτροπής
    της 3ης Ιουλίου 1996 σχετικά με την έναρξη επανεξέτασης
    ως προς νέους εξαγωγείς του κανονισμού (ΕΟΚ)
    αριθ. 830/92 του Συμβουλίου, για την επιβολή οριστικών
    δασμών αντιντάμπινγκ στις εισαγωγές ορισμένων
    νημάτων από πολυεστέρα (συνθετικές μη συνεχείς
    ίνες) καταγωγής, μεταξύ άλλων, Τουρκίας, καθώς
    και σχετικά με την κατάργηση του δασμού προκειμένου
    για τις εισαγωγές που προέρχονται από έναν
    εξαγωγέα της εν λόγω χώρας και με την υπαγωγή
    των συγκεκριμένων εισαγωγών σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: 'Komission asetus (EY) N:o 1284/96,#annettu 3 päivänä heinäkuuta 1996,#lopullisen
    polkumyyntitullin käyttöön ottamisesta tiettyjen muun muassa Turkista peräisin
    olevien polyesterilankojen (katkottujen tekokuitujen) tuonnissa ja väliaikaisen
    polkumyyntitullin lopullisesta kantamisesta annetun neuvoston asetuksen (ETY)
    N:o 830/92 mukaisen "uuden viejän" uudelleentarkastelun vireille panemisesta
    ja tällaisen tuonnin rekisteröimisen edellyttämisestä #'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1284/96 della Commissione del 3 luglio 1996 che avvia
    un riesame relativo ai «nuovi esportatori» del regolamento (CEE) n. 830/92 del
    Consiglio, che istituisce un dazio antidumping definitivo sulle importazioni di
    alcuni tipi di filati di poliesteri (fibre artificiali in fiocco) originarie,
    tra l'altro, della Turchia e che abroga il dazio per quanto riguarda le importazioni
    di un esportatore in questo paese e stabilisce che le importazioni siano soggette
    a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1284/96 van de Commissie van 3 juli 1996 tot opening
    van een nieuw onderzoek voor "een nieuwe exporteur" van Verordening (EEG) nr.
    830/92 van de Raad betreffende de instelling van een definitief anti-dumpingrecht
    op de invoer van bepaalde garens van polyester (kunstmatige stapelvezels) van
    oorsprong uit ondermeer Turkije, waarbij het recht voor de invoer van een importeur
    in dit land wordt ingetrokken en deze invoer moet worden geregistreerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1284/96 da Comissão de 3 de Julho de 1996 relativo
    ao início de um reexame, respeitante a um «novo exportador», do Regulamento
    (CEE) nº 830/92 do Conselho, que cria um direito anti-dumping definitivo sobre
    as importações de certos fios de poliéster (fibras sintéticas ou artificiais
    descontínuas), originárias, inter alia, da Turquia, que revoga o direito em
    vigor no que respeita às importações provenientes de um exportador deste país
    e que sujeita estas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1284/96 de la Comisión de 3 de julio de 1996 por el
    que se abre una reconsideración, para un nuevo exportador, del Reglamento (CEE)
    nº 830/92 del Consejo, por el que se establece un derecho antidumping definitivo
    sobre las importaciones de determinados hilados de poliéster (fibras sintéticas
    discontinuas) originarias, entre otros países, de Turquía, por el que se deroga
    el derecho aplicable a las importaciones de un exportador de este país y por
    el que se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens förordning (EG) nr 1284/96 av den 3 juli 1996 om inledande
    av en "ny exportör"-översyn av rådets förordning (EEG) nr 830/92 avseende
    införandet av slutgiltiga antidumpningstullar på import av vissa polyestergarner
    (syntetstapelfibrer) med ursprung i bland annat Turkiet, om upphävande av tullen
    på import från en exportör i detta land och om registrering av denna import
    #'
