  content: '82/374/EEC: Commission Decision of 19 May 1982 establishing that the apparatus
    described as ''Hewlett- Packard - Gas Chromatograph, model 5880A'' may not be
    imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/374/CEE: Décision de la Commission, du 19 mai 1982, constatant que
    l''importation de l''appareil dénommé "Hewlett Packard - Gas Chromatograph,
    model 5880A" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
