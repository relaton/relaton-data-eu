    maidir le caighdeáin theicniúla rialála lena sonraítear na gnéithe nach mór
    d’eintiteas airgeadais a chinneadh agus measúnú a dhéanamh orthu agus seirbhísí
    TFC lena dtacaítear le feidhmeanna criticiúla nó tábhachtacha á gcur amach
