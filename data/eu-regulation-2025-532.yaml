title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/532 of 24 March 2025 supplementing
    Regulation (EU) 2022/2554 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the elements that a financial entity
    has to determine and assess when subcontracting ICT services supporting critical
    or important functions
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/532 de la Commission du 24 mars 2025 complétant
    le règlement (UE) 2022/2554 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les éléments qu’une entité financière
    doit déterminer et évaluer lorsqu’elle sous-traite des services TIC qui soutiennent
    des fonctions critiques ou importantes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/532 der Kommission vom 24. März 2025 zur
    Ergänzung der Verordnung (EU) 2022/2554 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Präzisierung der Aspekte, die
    ein Finanzunternehmen bei der Untervergabe von IKT-Dienstleistungen zur Unterstützung
    kritischer oder wichtiger Funktionen bestimmen und bewerten muss
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/532 на Комисията
    от 24 март 2025 година за допълнение на Регламент
    (ЕС) 2022/2554 на Европейския парламент и на Съвета
    с регулаторни технически стандарти, с които
    се уточняват елементите, които финансовият
    субект трябва да определи и оцени при възлагането
    на подизпълнител на услуги в областта на ИКТ,
    поддържащи критични или важни функции
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/532 ze dne 24. března
    2025, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) 2022/2554,
    pokud jde o regulační technické normy upřesňující prvky, které musí finanční
    subjekt určit a posoudit při subdodávkách služeb IKT podporujících zásadní
    nebo důležité funkce
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/532 af 24. marts 2025 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) 2022/2554
    for så vidt angår reguleringsmæssige tekniske standarder, der præciserer de
    elementer, som en finansiel enhed skal fastlægge og vurdere, når den giver IKT-tjenester,
    der understøtter kritiske eller vigtige funktioner, i underentreprise
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2025/532
    της Επιτροπής, της 24ης Μαρτίου 2025, για τη συμπλήρωση
    του κανονισμού (ΕΕ) 2022/2554 του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τα ρυθμιστικά
    τεχνικά πρότυπα για τον προσδιορισμό των στοιχείων
    τα οποία πρέπει να καθορίζει και να αξιολογεί
