    tehniskajiem standartiem, kuros precizēti elementi, kas finanšu vienībai ir
    jānosaka un jānovērtē, slēdzot apakšuzņēmuma līgumus par IKT pakalpojumiem,
    kuri atbalsta kritiski svarīgas vai svarīgas funkcijas
  type: main
- language: lt
  script: Latn
  content: 2025 m. kovo 24 d. Komisijos deleguotasis reglamentas (ES) 2025/532, kuriuo
    Europos Parlamento ir Tarybos reglamentas (ES) 2022/2554 papildomas techniniais
    reguliavimo standartais, kuriais patikslinami elementai, kuriuos finansų sektoriaus
    subjektas turi nustatyti ir įvertinti, sudarydamas IRT paslaugų, kuriomis palaikomos
    ypatingos svarbos arba svarbios funkcijos, subrangos sutartis
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/532 tal-24 ta’ Marzu 2025
