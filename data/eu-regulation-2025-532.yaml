  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/532 оd 24. ožujka 2025. o dopuni
    Uredbe (EU) 2022/2554 Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuju elementi koje financijski subjekt mora utvrditi
    i procijeniti pri podugovaranju IKT usluga kojima se podupiru ključne ili važne
    funkcije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/532 felhatalmazáson alapuló rendelete (2025. március
    24.) az (EU) 2022/2554 európai parlamenti és tanácsi rendeletnek a kritikus
    vagy fontos funkciókat támogató IKT-szolgáltatások alvállalkozásba adásakor
    a pénzügyi szervezetek által meghatározandó és értékelendő elemeket pontosító
    szabályozástechnikai standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/532 della Commissione, del 24 marzo 2025,
    che integra il regolamento (UE) 2022/2554 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano gli
    elementi che l’entità finanziaria deve determinare e valutare quando subappalta
    servizi TIC a supporto di funzioni essenziali o importanti
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/532 (2025. gada 24. marts), ar ko
