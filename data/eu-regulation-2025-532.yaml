    w odniesieniu do regulacyjnych standardów technicznych określających elementy,
    które podmiot finansowy musi określić i ocenić, zlecając podwykonawstwo usług
    ICT wspierających krytyczne lub istotne funkcje
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/532 da Comissão, de 24 de março de 2025,
    que complementa o Regulamento (UE) 2022/2554 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação que especificam os elementos
    que uma entidade financeira tem de determinar e avaliar ao subcontratar serviços
    de TIC que apoiem funções críticas ou importantes
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/532 al Comisiei din 24 martie 2025 de completare
    a Regulamentului (UE) 2022/2554 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează elementele
    pe care o entitate financiară trebuie să le stabilească și să le evalueze
    atunci când subcontractează servicii TIC care sprijină funcții critice sau
    importante
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/532 z 24. marca 2025, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) 2022/2554, pokiaľ
    ide o regulačné technické predpisy, v ktorých sa bližšie špecifikujú prvky,
    ktoré musí finančný subjekt určiť a posúdiť pri využívaní subdodávateľov
    v prípade IKT služieb podporujúcich kritické alebo dôležité funkcie
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/532 z dne 24. marca 2025 o dopolnitvi
