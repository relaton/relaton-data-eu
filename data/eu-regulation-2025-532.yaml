    entiteit bij het uitbesteden van kritieke of belangrijke functies ondersteunende
    ICT-diensten te bepalen en te beoordelen elementen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/532 z dnia 24 marca 2025 r.
