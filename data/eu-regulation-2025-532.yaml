    teknisillä sääntelystandardeilla, joissa täsmennetään finanssiyhteisön
    määritettäväksi ja arvioitavaksi kuuluvat seikat sen teettäessä kriittisiä
    tai tärkeitä toimintoja tukevia TVT-palveluja alihankintana
  type: main
- language: ga
  script: Latn
