title:
- language: en
  script: Latn
  content: '94/179/Euratom: Council Decision of 21 March 1994 amending Decision 77/270/Euratom,
    to authorize the Commission to contract Euratom borrowings in order to contribute
    to the financing required for improving the degree of safety and efficiency of
    nuclear power stations in certain non- member countries'
  type: main
- language: fr
  script: Latn
  content: '94/179/Euratom: Décision du Conseil du 21 mars 1994 modifiant la décision
    77/270/Euratom en vue d''habiliter la Commission à contracter des emprunts Euratom
    pour contribuer au financement de l''amélioration du degré de sûreté et d''efficacité
    du parc nucléaire de certains pays tiers'
  type: main
- language: de
  script: Latn
  content: '94/179/Euratom: Beschluß des Rates vom 21. März 1994 zur Änderung des
    Beschlusses 77/270/Euratom zwecks Ermächtigung der Kommission, im Hinblick auf
    einen Finanzbeitrag zur Verbesserung der Sicherheit und des Wirkungsgrads von
    Kernkraftanlagen in bestimmten Drittländern Euratom-Anleihen aufzunehmen'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Съвета от 21 март 1994 година за
    изменение на Решение 77/270/Евратом за упълномощаване
    на Комисията да отпуска заеми по Евратом с
    цел подпомагане финансирането, необходимо
    за повишаване на безопасността и ефективността
    на атомните електроцентрали в определени страни,
    които не са държави-членки
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady ze dne 21. března 1994, kterým se mění rozhodnutí
