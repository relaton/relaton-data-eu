    půjčky s cílem přispět na financování nezbytné pro zvýšení stupně
    bezpečnosti a účinnosti jaderných elektráren v některých třetích zemích
  type: main
- language: da
  script: Latn
  content: '94/179/Euratom: Rådets afgørelse af 21. marts 1994 om ændring af afgørelse
