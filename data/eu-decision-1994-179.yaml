  type: main
- language: nl
  script: Latn
  content: '94/179/Euratom: Besluit van de Raad van 21 maart 1994 tot wijziging van
    Besluit 77/270/Euratom ten einde de Commissie te machtigen tot het aangaan van
    Euratom- leningen om aldus een bijdrage te leveren aan de financiering van de
    verbetering van de efficiëntie en de veiligheid van kerncentrales in bepaalde
    derde landen'
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady z dnia 21 marca 1994 r. zmieniająca decyzję 77/270/Euratom,
    upoważniającą Komisję do zaciągania pożyczek Euratomu w celu przyczynienia
    się do finansowania wymaganego dla poprawy stopnia bezpieczeństwa i wydajności
    elektrowni atomowych w niektórych państwach trzecich
  type: main
- language: pt
  script: Latn
  content: '94/179/Euratom: Decisão do Conselho de 21 de Março de 1994 que altera
    a Decisão 77/270/Euratom, com vista a habilitar a Comissão a contrair empréstimos
    Euratom com o objectivo de contribuir para o financiamento da melhoria do grau
    de segurança e de eficácia do parque nuclear de certos países terceiros'
  type: main
- language: ro
  script: Latn
  content: Decizia Consiliului din 21 martie 1994 de modificare a Deciziei 77/720/Euratom,
    în vederea autorizării Comisiei să contracteze împrumuturi Euratom pentru
    a contribui la finanțarea necesară pentru ameliorarea nivelului de siguranță
    și eficiență al centralelor nucleare din anumite țări nemembre
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady z 21. marca 1994, ktoré mení a dopĺňa rozhodnutie
    77/270/Euratom a poveruje Komisiu uzatváraním pôžičiek Euratomu s cieľom
    prispieť na financovanie potrebné na zlepšenie stupňa bezpečnosti a účinnosti
    jadrových elektrární v určitých nečlenských krajinách
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta z dne 21. marca 1994 o spremembah Sklepa 77/270/Euratom o pooblastitvi
    Komisije za dodelitev Euratom posojil zaradi prispevanja k financiranju, ki je
    potrebno za izboljšanje stopnje varnosti in učinkovitosti nuklearnih elektrarn
    v nekaterih državah nečlanicah
  type: main
- language: es
  script: Latn
  content: '94/179/Euratom: Decisión del Consejo de 21 de marzo de 1994 por la que
    se modifica la Decisión 77/270/Euratom con objeto de habilitar a la Comisión
    a contraer empréstitos Euratom para contribuir a la financiación de la mejora
    del grado de seguridad y eficacia del parque nuclear de determinados terceros
    países'
  type: main
- language: sv
  script: Latn
  content: '94/179/Euratom: Rådets beslut av den 21 mars 1994 om ändring av beslut
    77/270/Euratom som ger kommissionen befogenhet att ta upp Euratom-lån i syfte
    att bidra till den finansiering som krävs för att förbättra säkerheten och
    effektiviteten i kärnkraftverk i vissa icke-medlemsstater'
