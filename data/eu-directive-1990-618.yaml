title:
- language: en
  script: Latn
  content: Council Directive 90/618/EEC of 8 November 1990 amending, particularly
    as regards motor vehicle liability insurance, Directive 73/239/EEC and Directive
    88/357/EEC which concern the coordination of laws, regulations and administrative
    provisions relating to direct insurance other than life assurance
  type: main
- language: fr
  script: Latn
  content: Directive 90/618/CEE du Conseil du 8 novembre 1990 modifiant, en ce qui
    concerne plus particulièrement l'assurance de la responsabilité civile résultant
    de la circulation des véhicules automoteurs, les directives 73/239/CEE et 88/357/CEE
    qui portent coordination des dispositions législatives, réglementaires et administratives
    concernant l'assurance directe autre que l'assurance sur la vie
  type: main
- language: de
  script: Latn
  content: Richtlinie 90/618/EWG des Rates vom 8. November 1990 zur Änderung der
    Richtlinie 73/239/EWG und der Richtlinie 88/357/EWG zur Koordinierung der Rechts-
    und Verwaltungsvorschriften für die Direktversicherung (mit Ausnahme der Lebensversicherung),
    insbesondere bezüglich der Kraftfahrzeug-Haftpflichtversicherung
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 8 ноември 1990 година
    за изменение на Директива 73/239/ЕИО и Директива
    88/357/ЕИО относно координирането на законовите,
    подзаконовите и административните разпоредби
    за прякото застраховане, с изключение на животозастраховането,
    особено по отношение застраховането на отговорността,
    свързана с моторните превозни средства
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 8. listopadu 1990, kterou se mění směrnice 73/239/EHS
    a směrnice 88/357/EHS o koordinaci právních a správních předpisů členských
    států týkajících se přímého pojištění jiného než životního, zejména
    ve vztahu k pojištění občanskoprávní odpovědnosti z provozu motorových
    vozidel
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 90/618/EØF af 8. november 1990 om ændring, navnlig med
    hensyn til ansvarsforsikring for motorkøretøjer, af direktiv 73/239/EØF og
    direktiv 88/357/EØF, som begge angår samordning af love og administrative bestemmelser
    vedrørende direkte forsikringsvirksomhed bortset fra livsforsikring
  type: main
- language: el
  script: Grek
  content: Οδηγία 90/618/ΕΟΚ του Συμβουλίου της 8ης Νοεμβρίου
    1990 για την τροποποίηση, ιδιαίτερα όσον αφορά
    την ασφάλιση της ευθύνης από αυτοκίνητα, των
    οδηγιών 73/239/ΕΟΚ και 88/357/ΕΟΚ που αφορούν το συντονισμό
    των νομοθετικών, κανονιστικών και διοικητικών
    διατάξεων σχετικά με την πρωτασφάλιση, εκτός
    της ασφάλειας ζωής
  type: main
- language: et
  script: Latn
  content: Nõukogu Direktiiv, 8. november 1990, millega muudetakse eelkõige mootorsõiduki
    valdaja vastutuskindlustuse osas direktiivi 73/239/EMÜ ja direktiivi 88/357/EMÜ,
    mis käsitlevad otsekindlustustegevusega, välja arvatud elukindlustustegevusega
    seotud õigus- ja haldusnormide kooskõlastamist
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 90/618/ETY, annettu 8 päivänä marraskuuta 1990,
    muuta ensivakuutusta kuin henkivakuutusta koskevien lakien, asetusten ja hallinnollisten
    määräysten yhteensovittamisesta annettujen direktiivin 73/239/ETY ja direktiivin
    88/357/ETY muuttamisesta erityisesti moottoriajoneuvojen vastuuvakuutuksen osalta
  type: main
- language: hr
  script: Latn
  content: '90/618/EEZ: Direktiva Vijeća od 8. studenoga 1990. o izmjeni, posebice
    u pogledu osiguranja od odgovornosti za upotrebu motornih vozila, Direktive 73/239/EEZ
    i Direktive 88/357/EEZ o usklađivanju zakona i drugih propisa o izravnom osiguranju
    osim životnog osiguranja'
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1990. november 8.) az életbiztosítás körén kívül
    eső közvetlen biztosítási tevékenységekre vonatkozó törvényi, rendeleti
    és közigazgatási rendelkezések összehangolásáról szóló 73/239/EGK és
    88/357/EGK irányelvnek elsősorban a gépjármű-felelősségbiztosítás tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 90/618/CEE del Consiglio dell'8 novembre 1990 che modifica, in
    particolare, per quanto riguarda l'assicurazione della responsabilità civile
    risultante dalla circolazione di autoveicoli, la direttiva 73/239/CEE e la direttiva
    88/357/CEE che coordinano le disposizioni legislative, regolamentari ed amministrative
    riguardanti l'assicurazione diretta diversa dell'assicurazione sulla vita
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1990. gada 8. novembris), ar ko groza, jo īpaši attiecībā
    uz mehānisko transportlīdzekļu īpašnieku civiltiesiskās atbildības apdrošināšanu,
    Direktīvu 73/239/EEK un Direktīvu 88/357/EEK par normatīvo un administratīvo
    aktu koordināciju attiecībā uz tiešo apdrošināšanu, kas nav dzīvības
    apdrošināšana
  type: main
- language: lt
  script: Latn
  content: 1990 m. lapkričio 8 d. Tarybos Direktyva iš dalies keičianti, pirmiausia
    dėl motorinių transporto priemonių civilinės atsakomybės draudimo, Direktyvą
    73/239/EEB ir Direktyvą 88/357/EEB dėl įstatymų ir kitų teisės aktų, susijusių
    su tiesioginiu draudimu, išskyrus gyvybės draudimą, derinimo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tat-8 ta' Novembru 1990 li temenda, b’mod partikolari
    fir-rigward ta’ assigurazzjoni ta’ responsabbiltà ta’ vetturi bil-mutur,
    id-Direttiva 73/239/KEE u d-Direttiva 88/357/KEE dwar il-koordinazzjoni ta’
    liġijiet, regolamenti u dispożizzjonijiet amministrattivi li jirrelataw għall-assigurazzjoni
    diretta barra minn assigurazzjoni tal-ħajja
  type: main
- language: nl
  script: Latn
  content: Richtlijn 90/618/EEG van de Raad van 8 november 1990 tot wijziging, met
    name wat de wettelijke aansprakelijkheidsverzekering motorrijtuigen betreft, van
    Richtlijn 73/239/EEG en Richtlijn 88/357/EEG tot coördinatie van de wettelijke
    en bestuursrechtelijke bepalingen betreffende het directe verzekeringsbedrijf,
    met uitzondering van de levensverzekeringsbranche
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 8 listopada 1990 r. zmieniająca, w szczególności
    w zakresie ubezpieczenia odpowiedzialności cywilnej posiadaczy pojazdów mechanicznych,
    dyrektywę 73/239/EWG i dyrektywę 88/357/EWG, które dotyczą koordynacji przepisów
    ustawowych, wykonawczych i administracyjnych odnoszących się do ubezpieczeń
    bezpośrednich innych niż ubezpieczenia na życie
  type: main
- language: pt
  script: Latn
  content: Directiva 90/618/CEE do Conselho de 8 de Novembro de 1990 que altera, em
    especial no que respeita ao seguro de responsabilidade civil automóvel, a Directiva
    73/239/CEE e a Directiva 88/357/CEE, relativas à coordenação das disposições
    legislativas, regulamentares e administrativas respeitantes ao seguro directo
    nao vida
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 8 noiembrie 1990 de modificare, în special în
    ceea ce privește asigurarea de răspundere civilă auto, a Directivelor 73/239/CEE
    și 88/357/CEE de coordonare a actelor cu putere de lege și a actelor administrative
    privind asigurarea generală directă
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 8. novembra 1990, ktorou sa mení a dopĺňa smernica 73/239/EHS
    a smernica 88/357/EHS o koordinácii zákonov, iných právnych predpisov a správnych
    opatrení týkajúcich sa priameho poistenia s výnimkou životného poistenia,
    najmä pokiaľ ide o poistenie zodpovednosti za škodu spôsobenú prevádzkou
    motorových vozidiel
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 8. novembra 1990 o spremembah Direktive 73/239/EGS
    in Direktive 88/357/EGS o uskladitvi zakonov in drugih predpisov o neposrednem
    zavarovanju razen življenjskega zavarovanja, zlasti glede zavarovanja avtomobilske
    odgovornosti
  type: main
- language: es
  script: Latn
  content: Directiva 90/618/CEE del Consejo de 8 de noviembre de 1990 que modifica,
    en particular por lo que se refiere al seguro de responsabilidad civil resultante
    de la circulación de vehículos automóviles, las Directivas 73/239/CEE y 88/357/CEE
    referentes a la coordinación de las disposiciones legales, reglamentarias y administrativas
    relativas al seguro directo distinto del seguro de vida
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 90/618/EEG av den 8 november 1990 om ändring, särskilt
    såvitt avser ansvarsförsäkring för motorfordon, av direktiv 73/239/EEG och
    direktiv 88/357/EEG, vilka avser samordning av lagar och andra författningar
    angående annan direkt försäkring än livförsäkring
