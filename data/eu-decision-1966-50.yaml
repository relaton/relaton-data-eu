title:
- language: fr
  script: Latn
  content: Décision 66/50/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République fédérale d'Allemagne, de
    biscuits et gaufres en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '66/50/EWG: Entscheidung der Kommission vom 14. Dezember 1965 über die
    erneute Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von
    Ausgleichsabgaben auf Einfuhren von Waffeln und Keksen aus verschiedenen Mitgliedstaaten
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/50/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    nuovamente la decisione del 6 novembre 1964 con cui si autorizza la riscossione
    di una tassa di compensazione sull''importazione di biscotti e cialde nella Repubblica
    federale di Germania da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/50/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van biscuits en wafels uit sommige Lid-Staten'
  type: main
