    74 (numero d' ordine 40.0740) originari del Pakistan, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2972/93 VAN DE COMMISSIE van 28 oktober 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 74 (volgnummer 40.0740), van oorsprong uit Pakistan, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90
    van de Raad
  type: main
