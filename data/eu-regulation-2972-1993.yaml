title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2972/93 of 28 October 1993 re-establishing
    the levying of customs duties on products of category 74 (order No 40.0740), originating
    in Pakistan, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2972/93 de la Commission du 28 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 74 (numéro d'ordre 40.0740) originaires du Pakistan, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2972/93 DER KOMMISSION vom 28. Oktober 1993 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 74 (laufende Nummer 40.0740) mit Ursprung
    in Pakistan, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2972/93 af 28. oktober 1993 om genindførelse
    af opkrævning af told for varer under kategori 74 (løbenummer 40.0740), som
    har oprindelse i Pakistan og omfattes af de toldpræferencer, som er fastsat i
    Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2972/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
