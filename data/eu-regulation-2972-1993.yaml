    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    74 (αύξων αριθμός 40.0740), καταγωγής Πακιστάν, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2972/93 DELLA COMMISSIONE del 28 ottobre 1993 che
