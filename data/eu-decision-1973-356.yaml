title:
- language: en
  script: Latn
  content: Council Decision of 16 July 1973 on the conclusion of the Agreement in
    the form of an exchange of letters modifying the Convention between the European
    Economic Community and the United Nations Relief and Works Agency for Palestine
    refugees concerning aid to refugees in the countries of the Middle East as far
    as the quantities of certain contributions for the second year of application
    (1973/74) are concerned
  type: main
- language: fr
  script: Latn
  content: '73/356/CEE: Décision du Conseil du 16 juillet 1973, portant conclusion
    de l''accord, sous forme d''échange de lettres, modifiant la convention entre
    la Communauté économique européenne et l''Office de secours et de travaux des
    Nations Unies pour les réfugiés de Palestine relative à l''assistance aux réfugiés
    des pays du Moyen- Orient en ce qui concerne, pour la deuxième année d''application
    (1973/1974), les quantités de certaines contributions'
  type: main
- language: de
  script: Latn
  content: Beschluß des Rates vom 16. Juli 1973 über den Abschluß des Abkommens
    - in Form eines Briefwechsels - zur Änderung des Abkommens zwischen der Europäischen
    Wirtschaftsgemeinschaft und dem Hilfswerk der Vereinten Nationen für die Palästinaflüchtlinge
    im Nahen Osten über Hilfsmaßnahmen für Flüchtlinge in den Nahostländern hinsichtlich
    der für das zweite Jahr der Durchführung (1973/1974) vorgesehenen Mengen bestimmter
    Spenden
  type: main
- language: da
  script: Latn
  content: Rådets Afgørelse af 16. juli 1973 om indgåelse af aftalen i form af
    brevveksling om ændring af aftalen mellem Det europæiske økonomiske Fællesskab
    og De forenede Nationers hjælpeorganisation for Palæstina-flygtninge (UNRWA)
    vedrørende hjælp til flygtningene fra landene i Mellemøsten for så vidt angår
    mængderne for visse ydelser for andet anvendelsesår (1973/1974)
  type: main
- language: it
  script: Latn
  content: Decisione del Consiglio, del 16 luglio 1973, relativa alla conclusione
    dell'accordo, sotto forma di scambio di lettere, che modifica la Convenzione tra
    la Comunità economica europea e l'Ente soccorso e lavori delle Nazioni Unite
    per i profughi della Palestina, per l'assistenza ai profughi dei paesi del Medio
    Oriente per quanto riguarda, per il secondo anno di applicazione (1973/1974),
    i quantitativi di taluni contributi
  type: main
- language: nl
  script: Latn
  content: Besluit van de Raad van 16 juli 1973 houdende sluiting van de Overeenkomst,
    in de vorm van een briefwisseling tot wijziging van de Overeenkomst tussen de
    Europese Economische Gemeenschap en de United Nations Relief and Works Agency
    for Palestine refugees betreffende bijstand aan vluchtelingen uit de landen van
    het Midden-Oosten, voor wat betreft de omvang van bepaalde bedragen voor het tweede
    jaar van toepassing (1973-1974)
