- language: en
  script: Latn
  content: Council Decision (EU) 2024/832 of 4 March 2024 on the position to be taken
    on behalf of the European Union in the 67th session of the Commission on Narcotic
    Drugs on the scheduling of substances under the Single Convention on Narcotic
    Drugs of 1961, as amended by the 1972 Protocol, and the Convention on Psychotropic
    Substances of 1971
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/832 du Conseil du 4 mars 2024 relative à la position
    à prendre, au nom de l’Union européenne, lors de la soixante-septième session
    de la Commission des stupéfiants, en ce qui concerne l’inscription de substances
    aux tableaux annexés à la Convention unique sur les stupéfiants de 1961, modifiée
    par le protocole de 1972, et à la Convention sur les substances psychotropes
    de 1971
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/832 des Rates vom 4. März 2024 über den im Namen
