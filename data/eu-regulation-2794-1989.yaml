title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2794/89 of 14 September 1989 adjusting in
    accordance with the agricultural conversion rates in force the amounts of the
    final aid and the final export refund for rape seed and sunflower seed harvested
    in Greece fixed before 1 February 1989 for the months of February to June 1989
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2794/89 de la Commission, du 14 septembre 1989, ajustant
