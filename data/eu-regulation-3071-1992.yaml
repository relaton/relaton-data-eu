title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3071/92 of 26 October 1992 re- establishing
    the levying of customs duties on products of category 12 (order No 40.0120), originating
    in Mexico, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3071/92 de la Commission, du 26 octobre 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 12 (numéro d' ordre 40.0120) originaires du Mexique, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
