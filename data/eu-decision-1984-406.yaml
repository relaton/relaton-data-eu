title:
- language: en
  script: Latn
  content: '84/406/EEC: Commission Decision of 10 August 1984 accepting undertakings
    given in connection with the anti-dumping proceeding concerning imports of horticultural
    glass and certain drawn glass originating in Czechoslovakia, the German Democratic
    Republic, Hungary, Poland, Romania and the USSR, and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '84/406/CEE: Décision de la Commission du 10 août 1984 portant acceptation
    d'' engagements souscrits dans le cadre de la procédure anti-dumping concernant
    les importations de verre dit "d'' horticulture" et d'' un certain verre étiré,
    originaires de Tchéchoslovaquie, de la République démocratique allemande, de
    Hongrie, de Pologne, de Roumanie et d'' Union soviétique et portant clôture
    de la procédure'
  type: main
- language: de
  script: Latn
  content: '84/406/EWG: Beschluß der Kommission vom 10. August 1984 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Gartenglas und bestimmtem gezogenem Glas mit Ursprung in der Deutschen Demokratischen
    Republik, Polen, Rumänien, der UdSSR, der Tschechoslowakei und Ungarn und über
    die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '84/406/EØF: Kommissionens afgørelse af 10. august 1984 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af gatnerglas
    og visse typer trukket glas med oprindelse i Tjekkoslovakiet, Den tyske demokratiske
    Republik, Ungarn, Polen, Rumænien og Sovjetunionen og om afslutning af denne
    procedure'
  type: main
- language: el
  script: Grek
  content: '84/406/ΕΟΚ: Απόφαση της Επιτροπής της 10ης
    Αυγούστου 1984 για την αποδοχή αναλήψεων υποχρεώσεων
    που έχουν προταθεί όσον αφορά τη διαδικασία
    αντιντάμπινγκ σχετικά με τις εισαγωγές υάλων
    κηπουρικής και ορισμενων υάλων κεχρωσμένων
    στη μάζα ή με στρώση απορροφητική ή αντανακλαστική,
    καταγωγής Τσεχοσλοβακίας, Λαϊκής Δημοκρατίας
    της Γερμανίας, Ουγγαρίας, Πολωνίας, Ρουμανίας
    και ΕΣΣΔ και για την περάτωση της διαδικασίας
