  type: main
- language: it
  script: Latn
  content: '84/406/CEE: Decisione della Commissione del 10 agosto 1984 che accetta
    gli impegni offerti nell'' ambito della procedura antidumping relativa alle importazioni
    di vetro detto "di orticoltura" e di alcuni tipi di vetro tirato originari della
    Cecoslovacchia, della Repubblica democratica tedesca, dell'' Ungheria, della Polonia,
    della Romania e dell'' USSR e che chiude detta procedura'
  type: main
- language: nl
  script: Latn
  content: '84/406/EEG: Besluit van de Commissie van 10 augustus 1984 tot aanvaarding
    van verbintenissen in het kader van de anti-dumpingprocedure betreffende de invoer
    van glas voor de tuinbouw en bepaalde soorten getrokken glas van oorsprong uit
    Tsjechoslowakije, de Duitse Democratische Republiek, Hongarije, Polen, Roemenië
    en de USSR, en tot beëindiging van die procedure'
