title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 684/82 of 24 March 1982 fixing the difference
    in white sugar prices to be used in calculating the levy for processed fruit and
    vegetable products and for wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 684/82 de la Commission, du 24 mars 1982, fixant la
    différence de prix du sucre blanc applicable pour le calcul du prélèvement
    dans le secteur des produits transformés à base de fruits et légumes et dans
    le secteur viti-vinicole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 684/82 der Kommission vom 24. März 1982 zur Festsetzung
    des bei der Berechnung der Abschöpfung für Verarbeitungserzeugnisse aus Obst
    und Gemüse und auf dem Weinsektor zu berücksichtigenden Unterschieds zwischen
    Weißzuckerpreisen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 684/82 af 24. marts 1982 om fastsættelse
    af den prisforskel for hvidt sukker, som anvendes ved afgiftsberegningen for produkter
    forarbejdet på basis af frugt og grønsager og for vin
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 684/82 της Επιτροπής
    της 24ης Μαρτίου 1982 περί καθορισμού της διαφοράς
    των τιμών λευκής ζάχαρης η οποία λαμβάνεται
    υπόψη για τον υπολογισμό της εισφοράς στον
    τομέα των μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά και στον αμπελοοινικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 684/82 della Commissione, del 24 marzo 1982, che fissa
