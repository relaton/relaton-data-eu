    mm uit India en tot beëindiging van de procedure ten aanzien van de invoer van
    roestvrij staaldraad met een diameter van minder dan 1 mm uit de Republiek Korea
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1601/1999 z dnia 12 lipca 1999 r. nakładające
