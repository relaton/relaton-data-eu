    ocele s priemerom menším ako 1 mm s pôvodom v Kórejskej republike
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1601/1999 z dne 12. julija 1999 o uvedbi dokončnih
