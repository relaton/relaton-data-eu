  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1601/1999 del Consiglio del 12 luglio 1999 che istituisce
    un dazio compensativo definitivo e dispone la riscossione definitiva del dazio
    provvisorio istituito sul filo di acciaio inossidabile di diametro inferiore a
    1 mm originario dell'India e chiude il procedimento relativo alle importazioni
    di filo di acciaio inossidabile di diametro inferiore a 1 mm originario della
    Repubblica di Corea
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1601/1999 (1999. gada 12. jūlijs), ar kuru nosaka
    galīgu kompensācijas maksājumu un galīgi iekasē pagaidu maksājumu, kas noteikts
    par Indijas izcelsmes nerūsējošā tērauda stieplēm, kuru diametrs ir mazāks
