title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 670/79 of 4 April 1979 re-establishing the
    levying of customs duties on spoons, forks, etc., of stainless steel, falling
    within subheading 82.14 A and originating in developing countries, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3156/78
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 670/79 de la Commission, du 4 avril 1979, portant
    rétablissement de la perception des droits de douane applicables aux cuillers,
    louches, fourchettes, etc., en acier inoxydable, de la sous-position 82.14 A du
    tarif douanier commun, originaires des pays en voie de développement, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 670/79 der Kommission vom 4. April 1979 zur Wiedereinführung
    des Zollsatzes für Löffel, Schöpfkellen, Gabeln, usw., aus rostfreiem Stahl,
    der Tarifstelle 82.14 A, mit Ursprung in Entwicklungsländern, denen die in der
    Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 670/79 af 4. april 1979 om genindførelse
    af opkrævning af toldafgifter for skeer, gafler, fiskeknive, etc., af rustfri
    stål, under underposition 82.14 A som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 670/79 della Commissione, del 4 aprile 1979, che ripristina
    la riscossione dei dazi doganali applicabili ai cucchiai, cucchiaioni, forchette,
    ecc., di acciaio inossidabile, della sottovoce doganale 82.14 A, originari dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 670/79 van de Commissie van 4 april 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor lepels, pollepels, vorken,
    taartscheppen, vismessen en botermesjes, suikertangen en dergelijke artikelen,
    van roestvrij staal, van post 82.14 A, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties
    werden geopend
  type: main
