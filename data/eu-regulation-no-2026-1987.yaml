    40.0290), Kostüme für Frauen der Warenkategorie Nr. 74 (Kennziffer 40.0740)
    und Anzüge für Männer der Warenkategorie Nr. 75 (Kennziffer 40.0750) mit Ursprung
    in Thailand, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
