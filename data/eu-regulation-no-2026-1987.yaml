title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2026/87 of 8 July 1987 re-establishing the
    levying of customs duties on underpants, etc., products of category 13 (code 40.0130),
    raincoats, products of category 15 (code 40.0150), men' s suits, products of category
    16 (code 40.0160), handkerchiefs, products of category 19 (code 40.0190), women'
    s suits, products of category 29 (code 40.0290), women' s suits, products of category
    74 (code 40.0740) and men' s suits, products of category 75 (code 40.0750) originating
    in Thailand to which the preferential tariff arrangements of Council Regulation
    (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2026/87 de la Commission du 8 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux slips, etc.,
    de la catégorie 13 (code 40.0130), aux manteaux imperméables de la catégorie
    15 (code 40.0150), aux costumes hommes de la catégorie 16 (code 40.0160), aux
    mouchoirs et pochettes de la catégorie 19 (code 40.0190), aux tailleurs femmes
    de la catégorie 29 (code 40.0290), aux tailleurs femmes de la catégorie 74 (code
    40.0740) et aux costumes hommes de la catégorie 75 (code 40.0750), originaires
    de Thaïlande, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
