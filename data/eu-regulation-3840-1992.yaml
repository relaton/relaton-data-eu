title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3840/92 of 28 December 1992 laying down
    certain additional detailed rules for the application of the supplementary trade
    mechanism (STM) to trade in fruit and vegetables between Spain and the Community
    as constituted on 31 December 1985 as regards tomatoes, artichokes and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3840/92 de la Commission, du 28 décembre 1992, fixant
    certaines modalités additionnelles pour l' application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l' Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les artichauts et les melons
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3840/92 der Kommission vom 28. Dezember 1992 mit zusätzlichen
    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Artischocken und Melonen zwischen Spanien und der Gemeinschaft in
    ihrer Zusammensetzung am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3840/92 af 28. december 1992 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    (SMS) mellem Spanien og Fællesskabet i dets sammensætning pr. 31. december 1985
    inden for frugt- og grønsagssektoren, for så vidt angår tomater, artiskokker
    og meloner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3840/92 της Επιτροπής
    της 28ης Δεκεμβρίου 1992 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών (ΣΜΣ) μεταξύ
    της Ισπανίας και της Κοινότητας με τη σύνθεσή
    της στις 31 Δεκεμβρίου 1985 όσον αφορά τις τομάτες,
    τις αγκινάρες και τα πεπόνια
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3840/92 della Commissione, del 28 dicembre 1992, che
    stabilisce le modalità complementari di applicazione del meccanismo complementare
    agli scambi (MCS) nel settore degli ortofrutticoli fra la Spagna e la Comunità
    nella sua composizione al 31 dicembre 1985 per quanto riguarda i pomodori, i carciofi
    e i meloni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3840/92 van de Commissie van 28 december 1992 tot
    vaststelling van bijkomende bepalingen voor de toepassing van de aanvullende regeling
    voor het handelsverkeer (ARH) in de sector groenten en fruit tussen Spanje en
    de Gemeenschap in haar samenstelling op 31 december 1985, ten aanzien van tomaten,
    artisjokken en meloenen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 3840/92 da Comissão, de 28 de Dezembro de 1992,
    que fixa determinadas normas adicionais de execução do mecanismo complementar
    aplicável às trocas comerciais (MCT) no sector das frutas e produtos hortícolas
    entre Espanha e a Comunidade, na sua composição em 31 de Dezembro de 1985, no
    que diz respeito aos tomates, às alcachofras e aos melões
  type: main
- language: es
  script: Latn
