title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2372/78 of 10 October 1978 amending Regulation
    (EEC) No 2898/77 maintaining in force the rules whereby imports into Italy of
    electric filament lamps originating in certain European State-trading countries
    are subject to import authorizations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2372/78 du Conseil, du 10 octobre 1978, modifiant
    le règlement (CEE) n° 2898/77 portant maintien du régime d' autorisation d'
    importation en Italie de lampes à incandescence originaires de certains pays
    européens à commerce d' État
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2372/78 des Rates vom 10. Oktober 1978 zur Änderung
    der Verordnung (EWG) Nr. 2898/77 zur Aufrechterhaltung der Genehmigungspflicht
    für die Einfuhr von Glühlampen mit Ursprung in verschiedenen europäischen Staatshandelsländern
    nach Italien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2372/78 af 10. oktober 1978 om ændring af
