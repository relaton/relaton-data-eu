  type: main
- language: nl
  script: Latn
  content: '94/530/EG: Beschikking van de Commissie van 6 december 1993 inzake de
    toekenning van bijstand uit het cohesie- financieringsinstrument voor de groep
    projectfasen - rioolnet van Kolymvari (Chania) - Rioolnet (tweede fase) en behandeling
    van afvalwater (tweede fase) van Kerkyra - definitieve sanering van de stortplaats
    van Ano Liossia - definitieve sanering van de oude stortplaats van Schisto - installaties
    voor de behandeling van afvalwater in de toeristische zone van Thessaloniki -
    aanleg van een hygiënisch verantwoorde stortplaats op Zakinthos - in Griekenland
    - Nr. CF: 93/09/61/025 - 93/09/61/028 - 93/09/61/034 - 93/09/61/043 - 93/09/61/047
    - (Slechts de tekst in de Griekse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '94/530/CE: Decisão da Comissão de 6 de Dezembro de 1993 relativa à
    concessão de uma contribuição do instrumento financeiro de coesão para os
    projectos de rede de esgotos da zona de Kolymari em Xania, de rede de esgotos
    (2º fase) e tratamento de efluentes (2º fase) em Corfu, de recuperação definitiva
    do local de descarga de Ano Liossia, de recuperação definitiva do antigo local
    de descarga de Schisto, de instalações de tratamento de efluentes na zona turística
    de Salónica e de construção de um aterro sanitário de detritos em Zanthe,
    na Grécia - nº FC: 93/09/61/025 - 93/09/61/028 - 93/09/61/034 - 93/09/61/043
    - 93/09/61/047 - (Apenas faz fé o texto em língua grega)'
