title:
- language: en
  script: Latn
  content: '94/530/EC: Commission Decision of 6 December 1993 granting assistance
    from the cohesion financial instrument for the following projects - sewerage in
    the Kolimvari area of the province of Khania, sewerage (second phase) and sewage
    treatment (second phase) on Corfu, final restoration of a waste disposal site
    at Ano Liosia, final restoration of former waste disposal sites at Skhisto, sewage
    treatment installations for the Thessaloniki tourist area, installation of a sanitary
    waste burial site on Zakinthos in Greece - Nos CF: 93/09/61/025 - 93/09/61/028
    - 93/09/61/034 - 93/09/61/043 - 93/09/61/047 (Only the Greek text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/530/CE: Décision de la Commission du 6 décembre 1993 relative à
    l''octroi d''un concours de l''instrument financier de cohésion pour des projets
    concernant - le réseau d''égouts de la zone de Kolymvari à La Canée - le réseau
    d''égouts (deuxième phase) et le traitement des effluents (deuxième phase)
    à Corfou - la réhabilitation définitive du site de la décharge d''Ano Liossia
    - la réhabilitation définitive du site de l''ancienne décharge de Schisto -
    des installations de traitement des effluents dans la zone touristique de Thessalonique
    et - la construction d''une installation d''enfouissement sanitaire des déchets
    à Zante en Grèce - nº FC: 93/09/61/025 - 93/09/61/028 - 93/09/61/034 - 93/09/61/043
    - 93/09/61/047 - (Le texte en langue grecque est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/530/EG: Entscheidung der Kommission vom 6. Dezember 1993 über die
    Gewährung einer Unterstützung aus dem Kohäsions-Finanzinstrument für die Serie
    von Vorhaben - Kanalisationsnetz im Gebiet von Kolimvari in Chania - Kanalisationsnetz
    (zweite Phase) und Abwasserbehandlung (zweite Phase) auf Korfu - endgültige Sanierung
    des Geländes der Mülldeponie von Ano Liossia - endgültige Sanierung des Geländes
    der ehemaligen Mülldeponie von Schisto - Abwasserbehandlungsanlagen im Fremdenverkehrsgebiet
    von Saloniki - Bau einer Anlage für die gesundheitlich unbedenkliche Abfallentsorgung
    in Sakinthos S in Griechenland. - Nr. F.C.: 93/09/61/025 - 93/09/61/028 - 93/09/61/034
    - 93/09/61/043 - 93/09/61/047 - (Nur der griechische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/530/EF: Kommissionens Beslutning af 6. december 1993 om støtte fra
    det finansielle samhørighedsinstrument til et projekt i Grækenland vedrørende
    - kloaknet i Kolimbari-området ved Chania - kloaknet (anden fase) og spildevandsbehandling
    (anden fase) på Korfu - endelig renovering af lossepladsen i Ano Liosia - endelig
    renovering af den tidligere losseplads i Schisto - anlæg til behandling af spildevand
    i turistområdet i Thessaloniki - anlæggelse af en losseplads i Zakinthos - F.C.
    nr.: 93/09/61/025 - 93/09/61/028 - 93/09/61/034 - 93/09/61/043 - 93/09/61/047
    - (Kun den græske udgave er autentisk)'
