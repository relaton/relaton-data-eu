title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 899/80 of 11 April 1980 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors); photographic (except cinematographic) enlargers and reducers, falling
    within heading No 90.09 and originating in developing countries, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 2789/79
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 899/80 de la Commission, du 11 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixe, appareils d' agrandissement et/ou de réduction photographiques,
    de la position 90.09 du tarif douanier commun, originaires des pays en voie de
    développement bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 899/80 der Kommission vom 11. April 1980 zur Wiedereinführung
    des Zollsatzes für Stehbildwerfer; photographische Vergrößerungs- oder Verkleinerungsapparate,
    der Tarifnummer 90.09 mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 899/80 af 11. april 1980 om genindførelse
    af opkrævning af toldafgifter for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), under pos. 90.09, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 899/80 della Commissione, dell' 11 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi di proiezione
    fissa e apparecchi fotografici d' ingrandimento o di riduzione, della voce 90.09
    della tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 899/80 van de Commissie van 11 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor projectietoestellen voor
    niet bewegende beelden; vergrotings- en verkleiningstoestellen voor de fotografie,
    van post 90.09, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij
    Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
