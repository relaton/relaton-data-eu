title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1188 of 8 July 2022 amending
    Annexes I and II to Implementing Decision (EU) 2021/260 as regards Member States
    or parts thereof for which national measures for certain diseases of aquatic animals
    are approved in accordance with Article 226(3) of Regulation (EU) 2016/429 of
    the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1188 de la Commission du 8 juillet 2022
    modifiant les annexes I et II de la décision d’exécution (UE) 2021/260 en
    ce qui concerne les États membres ou parties d’États membres dont les mesures
    nationales relatives à certaines maladies des animaux aquatiques sont approuvées
    conformément à l’article 226, paragraphe 3, du règlement (UE) 2016/429 du
    Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1188 der Kommission vom 8. Juli 2022
    zur Änderung der Anhänge I und II des Durchführungsbeschlusses (EU) 2021/260
    in Bezug auf Mitgliedstaaten oder Teile von Mitgliedstaaten, für die gemäß
    Artikel 226 Absatz 3 der Verordnung (EU) 2016/429 des Europäischen Parlaments
    und des Rates nationale Maßnahmen in Bezug auf bestimmte Wassertierseuchen genehmigt
    werden
  type: main
