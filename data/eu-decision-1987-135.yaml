  content: '87/135/EEC: Commission Decision of 23 February 1987 accepting an undertaking
    given by Kyocera Corporation in connection with the anti-dumping proceeding concerning
    imports of plain paper photocopiers originating in Japan and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '87/135/CEE: Décision de la Commission du 23 février 1987 portant acceptation
    de l'' engagement souscrit par Kyocera Corporation dans le cadre de la procédure
    antidumping concernant les importations de photocopieurs à papier ordinaire originaires
    du Japon et portant clôture de l'' enquête'
  type: main
- language: de
  script: Latn
  content: '87/135/EWG: Beschluß der Kommission vom 23. Februar 1987 über die Annahme
    einer von Kyocera Corporation angebotenen Verpflichtung im Rahmen des Antidumpingverfahrens
    betreffend die Einfuhren von Photokopierapparaten mit Ursprung in Japan und über
    die Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '87/135/EØF: Kommissionens afgørelse af 23. februar 1987 om godtagelse
    af tilsagn afgivet af Kyocera Corporation i forbindelse med antidumpingproceduren
    vedrørende importen af PPC-fotokopieringsmaskiner med oprindelse i Japan og om
    afslutning af undersøgelsen'
  type: main
- language: el
  script: Grek
  content: '87/135/ΕΟΚ: Απόφαση της Επιτροπής της 23ης
    Φεβρουαρίου 1987 για την αποδοχή της ανάληψης
    υποχρέωσης που πρότεινε η Kyocera Corporation όσον αφορά
    τη διαδικασία αντιντάμπινγκ σχετικά με τις
    εισαγωγές μηχανημάτων φωτοαντιγραφής που
    χρησιμοποιούν συνηθισμένο χαρτί καταγωγής
    Ιαπωνίας και για την περάτωση της έρευνας'
  type: main
- language: it
  script: Latn
  content: '87/135/CEE: Decisione della Commissione del 23 febbraio 1987 che accetta
    un impegno offerto dalla Kyocera Corporation nell'' ambito della procedura antidumping
    relativa alle importazioni di alcuni tipi di fotocopiatrici originarie del Giappone
    e che conclude la procedura'
  type: main
- language: nl
  script: Latn
  content: '87/135/EEG: Besluit van de Commissie van 23 februari 1987 tot aanvaarding
