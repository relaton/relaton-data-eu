title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 619/90 of 14 March 1990 amending Regulation
    (EEC) No 2405/89 laying down special detailed rules for the application of the
    system of import licences and advance fixing certificates for products processed
    from fruit and vegetables as regards certain CN codes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 619/90 de la Commission du 14 mars 1990 modifiant
    le règlement (CEE) n° 2405/89, portant modalités particulières d'application
    du régime des certificats d'importation et de préfixation dans le secteur des
    produits transformés à base de fruits et légumes en ce qui concerne certains
    codes NC
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 619/90 DER KOMMISSION vom 14. Maerz 1990 zur Aenderung
    der Verordnung (EWG) Nr. 2405/89 mit besonderen Durchfuehrungsbestimmungen fuer
    Einfuhrlizenzen und Vorausfestsetzungsbescheinigungen fuer Verarbeitungserzeugnisse
    aus Obst und Gemuese hinsichtlich bestimmter KN-Code
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 619/90 af 14. marts 1990 om ændring
    af forordning (EØF) nr. 2405/89 om særlige gennemførelsesbestemmelser for ordningen
    med importlicenser og forudfastsættelsesattester for produkter forarbejdet på
    basis af frugt og grønsager
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 619/90 της Επιτροπής
