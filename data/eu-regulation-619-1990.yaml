  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 619/90 DELLA COMMISSIONE del 14 marzo 1990 che modifica
    il regolamento (CEE) n. 2405/89, recante modalità particolari d'applicazione
    del regime dei titoli di importazione e di fissazione anticipata nel settore dei
    prodotti trasformati a base di ortofrutticoli per quanto riguarda alcune voci
    della nomenclatura combinata
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 619/90 VAN DE COMMISSIE van 14 maart 1990 tot wijziging
    van Verordening (EEG) nr. 2405/89 houdende bijzondere uitvoeringsbepalingen inzake
    het stelsel van invoer- en voorfixatiecertificaten in de sector van op basis van
    groenten en fruit verwerkte produkten, ten aanzien van een aantal GN-codes
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 619/90 DA COMISSAO de 14 de Março de 1990 que altera
