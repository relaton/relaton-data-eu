title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/876 of 31 May 2021 laying
    down rules for the application of Regulation (EC) No 1907/2006 as regards applications
    for authorisation and review reports for the uses of substances in the production
    of legacy spare parts and in the repair of articles and complex products no longer
    produced and amending Regulation (EC) No 340/2008
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/876 de la Commission du 31 mai 2021
    portant modalités d’application du règlement (CE) no 1907/2006 en ce qui concerne
    les demandes d’autorisation et les rapports de révision ayant trait aux utilisations
    de substances dans la production de pièces de rechange originales et dans la
    réparation d’articles et de produits complexes qui ne sont plus produits, et
    modifiant le règlement (CE) no 340/2008
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/876 der Kommission vom 31. Mai 2021
