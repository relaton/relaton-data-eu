title:
- language: en
  script: Latn
  content: '80/697/EEC: Commission Decision of 27 June 1980 authorizing the Italian
    Republic not to apply Community treatment to motor-coaches, falling within subheading
    ex 87.02 B of the Common Customs Tariff, originating in Japan and in free circulation
    in the other Member States (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/697/CEE: Décision de la Commission, du 27 juin 1980, autorisant la
    République italienne à exclure du traitement communautaire les autocars, de
    la sous- position ex 87.02 B du tarif douanier commun, originaires du Japon et
    mis en libre pratique dans les autres Etats membres (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/697/EWG: Entscheidung der Kommission vom 27. Juni 1980, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Reisebusse der Tarifstelle ex 87.02
    B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen (Nur
    der italienische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/697/EØF: Kommissionens beslutning af 27. juni 1980 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage rutebiler,
    som henhører under pos. ex 87.02 B i den fælles toldtarif, har oprindelse i
    Japan og frit kan omsættes i de øvrige medlemsstater (Kun den italienske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/697/CEE: Decisione della Commissione, del 27 giugno 1980, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli autocarri
    della sottovoce ex 87.02 B della tariffa doganale comune, originari del Giappone
    e messi in libera pratica negli altri Stati membri (Il testo in lingua italiana
    è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/697/EEG: Beschikking van de Commissie van 27 juni 1980 waarbij de Italiaanse
    Republiek wordt gemachtigd touringcars, van post ex 87.02 B van het gemeenschappelijk
    douanetarief, van oorsprong uit Japan en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Italiaanse taal is authentiek)'
  type: main
