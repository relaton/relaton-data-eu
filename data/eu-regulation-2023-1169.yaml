title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2023/1169 of 15 June 2023 concerning
    the authorisation of a preparation of endo-1,4-beta-xylanase, endo-1,4-beta-glucanase
    and xyloglucan-specific endo-beta-1,4-glucanase produced by Trichoderma citrinoviride
    DSM 33578 as a feed additive for poultry for fattening, poultry reared for laying
    and reared for breeding, and ornamental birds (holder of authorisation: Huvepharma
    EOOD)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/1169 de la Commission du 15 juin 2023
    concernant l’autorisation d’une préparation d’endo-1,4-bêta-xylanase,
    d’endo-1,4-bêta-glucanase et d’endo-bêta-1,4-glucanase xyloglucane-spécifique
    produites par Trichoderma citrinoviride DSM 33578 en tant qu’additif pour l’alimentation
    des volailles d’engraissement, des volailles élevées pour la ponte et la reproduction,
    et des oiseaux d’ornement (titulaire de l’autorisation: Huvepharma EOOD'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/1169 der Kommission vom 15. Juni 2023
    zur Zulassung einer Zubereitung aus Endo-1,4-beta-xylanase, Endo-1,4-beta-glucanase
    und xyloglucanspezifischer Endo-beta-1,4-glucanase, gewonnen aus Trichoderma citrinoviride
    DSM 33578, als Futtermittelzusatzstoff für Mastgeflügel, Junggeflügel für
    Lege- und Zuchtzwecke sowie Ziervögel (Zulassungsinhaber: Huvepharma EOOD)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2023/1169 на Комисията
    от 15 юни 2023 година за разрешаване на употребата
    на препарат от ендо-1,4-бета-ксиланаза, ендо-1,4-бета-глюканаза
    и ксилоглюкан-специфична ендо-бета-1,4-глюканаза,
    получени от Trichoderma citrinoviride DSM 33578, като фуражна
    добавка за домашни птици за угояване, домашни
    птици, отглеждани за носачки и за разплод, и
    декоративни птици (притежател на разрешението:
    Huvepharma EOOD)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2023/1169 ze dne 15. června 2023
    o povolení přípravku z endo-1,4-beta-xylanázy, endo-1,4-beta-glukanázy a
    xyloglukan-specifické endo-beta-1,4-glukanázy z Trichoderma citrinoviride DSM
    33578 jako doplňkové látky pro výkrm drůbeže, odchov drůbeže a pro okrasné
    ptactvo (držitel povolení: Huvepharma EOOD)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2023/1169 af 15. juni 2023
    om godkendelse af et præparat af endo-1,4-beta-xylanase, endo-1,4-beta-glucanase
    og xyloglucan-specific endo-beta-1,4-glucanase produceret af Trichoderma citrinoviride
    DSM 33578 som fodertilsætningsstof til slagtefjerkræ, hønniker, fjerkræ opdrættet
