    endo-1,4-beeta-ksylanaasia, endo-1,4-beeta-glukanaasia ja ksyloglukaanille spesifistä
    endo-beeta-1,4-glukanaasia sisältävän valmisteen hyväksymisestä lihantuotantoa
    varten, munantuotantoa varten ja siitoseläimiksi kasvatettavan siipikarjan sekä
    koristetarkoituksessa pidettävien lintujen rehun lisäaineena (hyväksynnän
    haltija: Huvepharma EOOD)'
  type: main
- language: ga
  script: Latn
  content: 'Rialachán Cur Chun Feidhme (AE) 2023/1169 ón gCoimisiún an 15 Meitheamh
