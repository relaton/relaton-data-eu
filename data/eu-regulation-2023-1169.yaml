    agus in-béite-1,4-glúcanáise a ghníomhaíonn go sonrach ar xileaglúcan arna
    táirgeadh ag Trichoderma citrinoviride DSM 33578 a údarú mar bhreiseán beathaithe
    le haghaidh éanlaith chlóis lena ramhrú, éanlaith chlóis a thógtar le bheith
    ina mbéaróga agus a thógtar le haghaidh pórúcháin, agus éin ornáideacha
