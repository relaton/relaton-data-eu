    ενδο-1,4-β-ξυλανάσης, ενδο-1,4-β-γλυκανάσης και
    ενδο-β-1,4-γλυκανάσης ειδικής για ξυλογλυκάνη
    που παράγονται από Trichoderma citrinoviride DSM 33578 ως πρόσθετης
