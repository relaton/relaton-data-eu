    της άδειας: Huvepharma EOOD)'
  type: main
- language: et
  script: Latn
  content: 'Komisjoni rakendusmäärus (EL) 2023/1169, 15. juuni 2023, milles käsitletakse
    loa andmist Trichoderma citrinoviride DSM 33578 abil toodetud endo-1,4-β-ksülanaasi,
    endo-1,4-β-glükanaasi ja ksüloglükaanispetsiifilise endo-β-1,4-glükanaasi
    preparaadi kasutamiseks nuumlindude, munemiseks ja aretuseks kasvatatavate noorlindude
    ning dekoratiivlindude söödalisandina (loa hoidja: Huvepharma EOOD)'
  type: main
- language: fi
  script: Latn
  content: 'Komission täytäntöönpanoasetus (EU) 2023/1169, annettu 15 päivänä
