title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2959/80 of 14 November 1980 re-establishing
    the levying of customs duties on lead borosilicates, falling within subheading
    32.08 ex B, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2959/80 de la Commission, du 14 novembre 1980, portant
    rétablissement de la perception des droits de douane applicables aux borosilicates
    de plomb, de la sous-position 32.08 ex B du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2959/80 der Kommission vom 14. November 1980 zur Wiedereinführung
    des Zollsatzes für Bleiborosilicate der Tarifstelle 32.08 ex B mit Ursprung in
    Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2959/80 af 14. november 1980 om genindførelse
    af opkrævning af toldafgifter for flyborosilicaten under pos. 32.08 ex B, som
    har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2959/80 della Commissione, del 14 novembre 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai borosilicati di piombo,
    della sottovoce doganale 32.08 ex B, originari dei paesi in via di sviluppo beneficiari
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2959/80 van de Commissie van 14 november 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor loodborosilicaten, van
    post 32.08 ex B, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
