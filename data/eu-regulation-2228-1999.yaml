    apresentados em Outubro de 1999 ao abrigo dos contingentes pautais de importação
    para determinados produtos no sector da carne de suíno, para o período compreendido
    entre 1 de Outubro e 31 de Dezembro de 1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2228/1999 de la Comisión, de 20 de octubre de 1999,
