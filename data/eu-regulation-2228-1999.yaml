    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Οκτώβριο 1999 για
    άδειες εισαγωγής, βάσει των καθεστώτων δασμολογικών
    ποσοστώσεων εισαγωγής για ορισμένα προϊόντα
    του τομέα του χοιρείου κρέατος, για την περίοδο
    από την 1η Οκτωβρίου έως τις 31 Δεκεμβρίου 1999
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2228/1999, annettu 20 päivänä lokakuuta 1999,
    lokakuussa 1999 jätettyjen tuontitodistushakemusten hyväksyttävyydestä koskien
    tuontitariffikiintiöiden avaamista ja hallintaa sianliha-alalla tiettyjen tuotteiden
    osalta 1 päivän lokakuuta ja 31 päivän joulukuuta 1999 välisellä kaudella
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2228/1999 della Commissione, del 20 ottobre 1999, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1999 nel quadro dei contingenti tariffari d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° ottobre
    1999 al 31 dicembre 1999
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2228/1999 van de Commissie van 20 oktober 1999 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten, die in oktober 1999 worden ingediend op grond van de tariefcontingenten
    voor de invoer van bepaalde producten in de varkensvleessector voor de periode
    van 1 oktober tot en met 31 december 1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 2228/1999 da Comissão, de 20 de Outubro de 1999,
