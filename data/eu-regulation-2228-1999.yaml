    licencias de importación presentadas en octubre de 1999 de contingentes arancelarios
    de importación de productos del sector de la carne de porcino durante el período
    comprendido entre el 1 de octubre y el 31 de diciembre de 1999
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2228/1999 av den 20 oktober 1999 om den
