title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2228/1999 of 20 October 1999 determining
    the extent to which applications lodged in October 1999 for import licences under
    the regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 October to 31 December 1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2228/1999 de la Commission, du 20 octobre 1999, déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en octobre 1999 peuvent être acceptées dans le cadre des contingents tarifaires
    d'importation pour certains produits dans le secteur de la viande de porc pour
    la période du 1er octobre au 31 décembre 1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2228/1999 der Kommission vom 20. Oktober 1999 über
    die Festsetzung des Umfangs für die im Oktober 1999 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    Oktober 1999 bis zum 31. Dezember 1999
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2228/1999 af 20. oktober 1999 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1999 om importlicenser for toldkontingenter for indførsel af bestemte svinekødsprodukter
    for perioden 1. oktober til 31. december 1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2228/1999 της Επιτροπής,
