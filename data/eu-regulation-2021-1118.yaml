---
id: EURegulation20211118
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2021/1118 of 26 March 2021 supplementing
    Directive 2014/59/EU of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the methodology to be used by resolution
    authorities to estimate the requirement referred to in Article 104a of Directive
    2013/36/EU of the European Parliament and of the Council and the combined buffer
    requirement for resolution entities at the resolution group consolidated level
    where the resolution group is not subject to those requirements under that Directive
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2021/1118 de la Commission du 26 mars 2021 complétant
    la directive 2014/59/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation précisant la méthode à utiliser par les autorités de résolution
    pour estimer l’exigence visée à l’article 104 bis de la directive 2013/36/UE
    du Parlement européen et du Conseil et l’exigence globale de coussin de fonds
    propres pour les entités de résolution au niveau consolidé du groupe de résolution
    lorsque le groupe de résolution n’est pas soumis à ces exigences en vertu
    de cette seconde directive
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2021/1118 der Kommission vom 26. März 2021
    zur Ergänzung der Richtlinie 2014/59/EU des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Methode zur Abschätzung
    der Anforderung nach Artikel 104a der Richtlinie 2013/36/EU des Europäischen
    Parlaments und des Rates und der kombinierten Kapitalpufferanforderung für Abwicklungseinheiten
    auf konsolidierter Basis auf Ebene der Abwicklungsgruppe, sofern die Abwicklungsgruppe
    nicht selbst den Anforderungen nach jener Richtlinie unterliegt
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2021/1118 на Комисията
    от 26 март 2021 година за допълнение на Директива
    2014/59/ЕС на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за определяне на методиката, която органите
    за преструктуриране да използват за оценка
    на изискването, посочено в член 104а от Директива
    2013/36/ЕС на Европейския парламент и на Съвета,
    и на комбинираното изискване за буфер за субектите
    за преструктуриране на консолидираното равнище
    на групата за преструктуриране, когато тези
    изисквания не се прилагат по отношение на групата
    за преструктуриране съгласно посочената директива
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2021/1118 ze dne 26. března
    2021, kterým se doplňuje směrnice Evropského parlamentu a Rady 2014/59/EU,
    pokud jde o regulační technické normy upřesňující metodiku, již mají
    používat orgány příslušné k řešení krize k odhadu požadavku uvedeného
    v článku 104a směrnice Evropského parlamentu a Rady 2013/36/EU a požadavku
    kombinovaných kapitálových rezerv pro subjekty řešící krizi na konsolidované
    úrovni skupiny řešící krizi v případech, kdy se na skupinu řešící krizi
    tyto požadavky podle uvedené směrnice nevztahují
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2021/1118 af 26. marts 2021 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2014/59/EU for
    så vidt angår reguleringsmæssige tekniske standarder, der præciserer den metode,
    som afviklingsmyndigheder skal anvende til at skønne det krav, der er omhandlet
    i artikel 104a i Europa-Parlamentets og Rådets direktiv 2013/36/EU, og det kombinerede
    bufferkrav for afviklingsenheder på konsolideret afviklingskoncernniveau, hvis
    afviklingskoncernen ikke er omfattet af disse krav i henhold til nævnte direktiv
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2021/1118
    της Επιτροπής της 26ης Μαρτίου 2021 για τη συμπλήρωση
    της οδηγίας 2014/59/ΕΕ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου όσον αφορά τα ρυθμιστικά
    τεχνικά πρότυπα για τον προσδιορισμό της μεθοδολογίας
    που χρησιμοποιούν οι αρχές εξυγίανσης προκειμένου
    να εκτιμήσουν τις απαιτήσεις που αναφέρονται
    στο άρθρο 104α της οδηγίας 2013/36/ΕΕ του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου και τη συνδυασμένη
    απαίτηση αποθέματος ασφαλείας για τις οντότητες
    εξυγίανσης σε ενοποιημένο επίπεδο ομίλου εξυγίανσης,
    όπου ο όμιλος εξυγίανσης δεν υπόκειται αυτός
    καθ’ εαυτόν στις σχετικές απαιτήσεις δυνάμει
    της εν λόγω οδηγίας
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2021/1118, 26. märts 2021, millega
    täiendatakse Euroopa Parlamendi ja nõukogu direktiivi 2014/59/EL regulatiivsete
    tehniliste standarditega, millega määratakse kindlaks metoodika, mida kriisilahendusasutused
    kasutavad, et hinnata Euroopa Parlamendi ja nõukogu direktiivi 2013/36/EL artiklis
    104a osutatud nõuet ja kombineeritud puhvri nõuet kriisilahendussubjektide puhul
    kriisilahendusaluse grupi konsolideeritud tasandil, kui kriisilahendusaluse grupi
    suhtes ei kohaldata neid nõudeid kõnealuse direktiivi kohaselt
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2021/1118, annettu 26 päivänä maaliskuuta
    2021, Euroopan parlamentin ja neuvoston direktiivin 2014/59/EU täydentämisestä
    teknisillä sääntelystandardeilla, joissa täsmennetään menetelmät, joita
    kriisinratkaisuviranomaisten on käytettävä, kun ne arvioivat kriisinratkaisun
    kohteena olevia yhteisöjä koskevaa Euroopan parlamentin ja neuvoston direktiivin
    2013/36/EU 104 a artiklassa tarkoitettua vaatimusta ja yhteenlaskettua puskurivaatimusta
    kriisinratkaisun kohteena olevan konsernin konsolidoidulla tasolla, jos kriisinratkaisun
    kohteena olevaan konserniin ei sovelleta kyseisiä vaatimuksia mainitun direktiivin
    nojalla
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2021/1118 ón gCoimisiún an 26 Márta 2021
    lena bhforlíontar Treoir 2014/59/AE ó Pharlaimint na hEorpa agus ón gComhairle
    maidir le caighdeáin theicniúla rialála lena sonrófar an mhodheolaíocht atá
    le húsáid ag údaráis réitigh chun an ceanglas dá dtagraítear in Airteagal
    104a de Threoir 2013/36/AE ó Pharlaimint na hEorpa agus ón gComhairle agus an
    ceanglas maoláin chomhcheangailte a mheas i dtaca le heintitis réitigh ar leibhéal
    comhdhlúite an ghrúpa réitigh i gcás nach mbíonn an grúpa réitigh faoi
    réir na gceanglas sin per se de bhun na Treorach réamhráite
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1118 оd 26. ožujka 2021. o dopuni
    Direktive 2014/59/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se utvrđuje metodologija koju sanacijska tijela upotrebljavaju
    za procjenu zahtjeva iz članka 104.a Direktive 2013/36/EU Europskog parlamenta
    i Vijeća i zahtjeva za kombinirani zaštitni sloj za subjekte u sanaciji na konsolidiranoj
    razini sanacijske grupe ako sanacijska grupa ne podliježe tim zahtjevima na temelju
    te direktive
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/1118 felhatalmazáson alapuló rendelete (2021.
    március 26.) a 2014/59/EU európai parlamenti és tanácsi irányelvnek a szanálási
    hatóságok által a szanálás alá vonható csoport konszolidált szintjén
    a szanálás alá vonható szervezetekre vonatkozó, a 2013/36/EU európai parlamenti
    és tanácsi irányelv 104a. cikkében említett követelmények és a kombinált
    pufferkövetelmények becsléséhez – amennyiben az említett irányelv értelmében
    maga a szanálás alá vonható csoport nem tartozik az említett követelmények
    hatálya alá – alkalmazandó módszereket részletesen meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2021/1118 della Commissione del 26 marzo 2021
    che integra la direttiva 2014/59/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che specificano la metodologia
    che le autorità di risoluzione devono utilizzare per stimare il requisito di
    cui all’articolo 104 bis della direttiva 2013/36/UE del Parlamento europeo e
    del Consiglio e il requisito combinato di riserva di capitale per le entità soggette
    a risoluzione a livello del gruppo soggetto a risoluzione su base consolidata
    se il gruppo soggetto a risoluzione non è soggetto a detti requisiti a norma
    della medesima direttiva
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2021/1118 (2021. gada 26. marts), ar
    ko Eiropas Parlamenta un Padomes Direktīvu 2014/59/ES papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem, kuros precizētas metodes, ko noregulējuma
    iestādes izmanto, lai aplēstu Eiropas Parlamenta un Padomes Direktīvas 2013/36/ES
    104.a pantā minēto prasību un apvienoto rezervju prasību noregulējuma vienībām
    noregulējuma grupas konsolidētajā līmenī, ja uz noregulējuma grupu minētās
    prasības saskaņā ar minēto direktīvu neattiecas
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2021/1118 2021 m. kovo 26 d. kuriuo
    Europos Parlamento ir Tarybos direktyva 2014/59/ES papildoma techniniais reguliavimo
    standartais, kuriais nustatoma metodika, kurią pertvarkymo institucijos turi
    taikyti nustatydamos Europos Parlamento ir Tarybos direktyvos 2013/36/ES 104a
    straipsnyje nurodytą reikalavimą ir jungtinio rezervo reikalavimą pertvarkytiniems
    subjektams konsoliduotu pertvarkytinos grupės lygmeniu, kai pertvarkytinai grupei
    pagal tą direktyvą tie reikalavimai netaikomi
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2021/1118 tas-26 ta’ Marzu 2021
    li jissupplimenta d-Direttiva 2014/59/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    ta’ standards tekniċi regolatorji li jispeċifikaw il-metodoloġija li għandha
    tintuża mill-awtoritajiet ta’ riżoluzzjoni biex jiġi stmat ir-rekwiżit imsemmi
    fl-Artikolu 104a tad-Direttiva 2013/36/UE tal-Parlament Ewropew u tal-Kunsill
    u r-rekwiżit ta’ riżerva kombinat għal entitajiet ta’ riżoluzzjoni fil-livell
    konsolidat tal-grupp ta’ riżoluzzjoni fejn il-grupp ta’ riżoluzzjoni mhuwiex
    soġġett għal dawk ir-rekwiżiti skont dik id-Direttiva
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2021/1118 van de Commissie van 26 maart 2021
    tot aanvulling van Richtlijn 2014/59/EU van het Europees Parlement en de Raad
    met betrekking tot technische reguleringsnormen tot nadere bepaling van de door
    afwikkelingsautoriteiten te gebruiken methode voor het ramen van het in artikel
    104 bis van Richtlijn 2013/36/EU van het Europees Parlement en de Raad bedoelde
    vereiste en het gecombineerde buffervereiste voor af te wikkelen entiteiten op
    het geconsolideerde niveau van de af te wikkelen groep, ingeval de af te wikkelen
    groep niet onderworpen is aan die vereisten uit hoofde van die richtlijn
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2021/1118 z dnia 26 marca 2021
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2014/59/UE w odniesieniu
    do regulacyjnych standardów technicznych określających metodę, która ma być
    stosowana przez organy ds. restrukturyzacji i uporządkowanej likwidacji do szacowania
    wymogu, o którym mowa w art. 104a dyrektywy Parlamentu Europejskiego i Rady 2013/36/UE,
    oraz wymogu połączonego bufora dla podmiotów restrukturyzacji i uporządkowanej
    likwidacji na poziomie skonsolidowanej grupy restrukturyzacji i uporządkowanej
    likwidacji, jeżeli grupa restrukturyzacji i uporządkowanej likwidacji nie podlega
    tym wymogom wspomnianej dyrektywy
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2021/1118 da Comissão de 26 de março de 2021
    que completa a Diretiva 2014/59/UE do Parlamento Europeu e do Conselho no respeitante
    a normas técnicas de regulamentação que especifiquem a metodologia a utilizar
    pelas autoridades de resolução para estimar o requisito a que se refere o artigo
    104.o-A da Diretiva 2013/36/UE do Parlamento Europeu e do Conselho e o requisito
    combinado de reservas de fundos próprios para as entidades de resolução a nível
    do grupo de resolução em base consolidada, caso o grupo de resolução não
    esteja sujeito a esses requisitos nos termos dessa diretiva
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2021/1118 al Comisiei din 26 martie 2021 de completare
    a Directivei 2014/59/UE a Parlamentului European și a Consiliului în ceea ce
    privește standardele tehnice de reglementare care precizează metodologia de
    utilizat de către autoritățile de rezoluție pentru a estima cerința menționată
    la articolul 104a din Directiva 2013/36/UE a Parlamentului European și a Consiliului
    și cerința amortizorului combinat în privința entităților de rezoluție,
    la nivelul consolidat al grupului de rezoluție, în cazul în care grupul de
    rezoluție nu face obiectul respectivelor cerințe în temeiul directivei menționate
    anterior
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2021/1118 z 26. marca 2021, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2014/59/EÚ, pokiaľ ide o
    regulačné technické predpisy, v ktorých sa upresňuje metodika, ktorú majú
    orgány pre riešenie krízových situácií používať s cieľom odhadnúť
    požiadavku uvedenú v článku 104a smernice Európskeho parlamentu a Rady 2013/36/EÚ
    a požiadavku na kombinovaný vankúš pre subjekty, ktorých krízová situácia
    sa rieši, na konsolidovanej úrovni skupiny, ktorej krízová situácia sa rieši,
    ak skupina, ktorej krízová situácia sa rieši, nepodlieha požiadavkám uvedenej
    smernice
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2021/1118 z dne 26. marca 2021 o dopolnitvi
    Direktive 2014/59/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi, ki določajo metodologijo, ki jo morajo organi za reševanje uporabiti
    pri oceni zahteve iz člena 104a Direktive 2013/36/EU Evropskega parlamenta in
    Sveta in zahteve po skupnem blažilniku za subjekte v postopku reševanja na konsolidirani
    ravni skupine v postopku reševanja, kadar za skupino v postopku reševanja ne
    veljajo navedene zahteve iz navedene direktive
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2021/1118 de la Comisión de 26 de marzo de 2021
    por el que se completa la Directiva 2014/59/UE del Parlamento Europeo y del Consejo
    en lo que respecta a las normas técnicas de regulación que especifican la metodología
    que deben utilizar las autoridades de resolución para estimar el requisito a
    que se refiere el artículo 104 bis de la Directiva 2013/36/UE del Parlamento
    Europeo y del Consejo y los requisitos combinados de colchón para las entidades
    de resolución a nivel del grupo de resolución consolidado cuando el grupo de
    resolución no esté sujeto a dichos requisitos en virtud de dicha Directiva
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2021/1118 av den 26 mars 2021
    om komplettering av Europaparlamentets och rådets direktiv 2014/59/EU vad gäller
    tekniska tillsynsstandarder som specificerar den metod som resolutionsmyndigheterna
    ska använda för att beräkna det krav som avses i artikel 104a i Europaparlamentets
    och rådets direktiv 2013/36/EU och det kombinerade buffertkravet för resolutionsenheter
    på konsoliderad resolutionsgruppnivå, om resolutionsgruppen i sig inte omfattas
    av dessa krav enligt det direktivet
  type: main
