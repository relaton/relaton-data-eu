title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2969/88 of 27 September 1988 re-establishing
    the levying of customs duties on electric motors and generators, falling within
    CN code 8501, originating in Hong Kong, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3635/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2969/88 de la Commission du 27 septembre 1988 portant
    rétablissement de la perception des droits de douane applicables aux moteurs
    et machines génératrices électriques, du code 8501 de la nomenclature combinée,
    originaires de Hong-kong, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3635/87 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2969/88 DER KOMMISSION vom 27. September 1988 zur
    Wiedereinführung der Erhebung der Zölle für Elektromotoren und elektrische
    Generatoren der Position 8501 der Kombinierten Nomenklatur mit Ursprung in Hongkong,
    dem die in der Verordnung (EWG) Nr. 3635/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2969/88 af 27. september 1988 om genindførelse
    af opkrævning af told for elektriske motorer og generatorer henhørende under
    KN-kode 8501 og med oprindelse i Hongkong, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3635/87
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2969/88 της Επιτροπής
    της 27ης Σεπτεμβρίου 1988 περί αποκαταστάσεως
    της εφαρμογής των δασμών για ηλεκτροκινητήρες
    και ηλεκτρογεννήτριες του κωδικού ΣΟ 8501 καταγωγής
    Χονγκ Κονγκ δικαιούχου των προβλεπόμενων στον
    κανονισμό (ΕΟΚ) αριθ. 3635/87 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2969/88 DELLA COMMISSIONE del 27 settembre 1988 che
    ripristina la riscossione dei dazi doganali applicabili ai motori e generatori
    elettrici del codice NC 8501, originari di Hong Kong beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3635/87 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2969/88 VAN DE COMMISSIE van 27 september 1988 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op elektromotoren
    en elektrische generatoren van GN-code 8501, van oorsprong uit Hong-Kong, waarvoor
    de in Verordening (EEG) nr. 3635/87 van de Raad vermelde tariefpreferenties zijn
    verleend #'
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2969/88 da Comissão de 27 de Setembro de 1988 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis aos motores e geradores
    eléctricos, do código NC 8501, originários de Hong Kong, beneficiário das
    preferências pautais previstas pelo Regulamento (CEE) n.° 3635/87 do Conselho
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2969/88 DE LA COMISIÓN de 27 de septiembre de 1988
    relativo al restablecimiento de la percepción de los derechos de aduana aplicables
    a motores y generadores eléctricos del código NC 8501, beneficiario de las preferencias
    arancelarias previstas por el Reglamento (CEE) no 3635/87 del Consejo #'
