    autres que les centres principaux, et les prix d'intervention dérivés qui y
    sont applicables
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1479/71 der Kommission vom 12. Juli 1971 zur Festlegung
