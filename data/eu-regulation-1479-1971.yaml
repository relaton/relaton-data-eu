    und der dort geltenden abgeleiteten Interventionspreise
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1479/71 delle Commissione, del 12 luglio 1971, che
    determina i centri d'intervento per i semi oleosi, diversi dai centri principali,
    ed i prezzi d'intervento derivati in essi applicabili
  type: main
- language: nl
  script: Latn
