  script: Latn
  content: '96/113/EC: Commission Decision of 19 January 1996 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes other than potatoes intended for planting originating
    in the Czech Republic'
  type: main
- language: fr
  script: Latn
  content: '96/113/CE: Décision de la Commission, du 19 janvier 1996, autorisant
