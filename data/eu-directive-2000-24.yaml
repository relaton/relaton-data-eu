    προϊόντα φυτικής προέλευσης, συμπεριλαμβανομένων
    των οπωροκηπευτικών
  type: main
- language: et
  script: Latn
  content: Komisjoni direktiiv 2000/24/EÜ, 28. aprill 2000, millega muudetakse nõukogu
    direktiivide 76/895/EMÜ, 86/362/EMÜ, 86/363/EMÜ ja 90/642/EMÜ (vastavalt teraviljas,
    loomses toidus ja teatavates taimset päritolu saadustes, sealhulgas puu- ja köögiviljas,
    sisalduvate ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise
    kohta) lisasid
  type: main
- language: fi
  script: Latn
  content: Komission direktiivi 2000/24/EY, annettu 28 päivänä huhtikuuta 2000,
    hedelmien ja vihannesten torjunta-ainejäämien enimmäismäärien vahvistamisesta
    annetun neuvoston direktiivin 76/895/ETY, viljojen torjunta-ainejäämien enimmäismääristä
    annetun neuvoston direktiivin 86/362/ETY, eläinkunnasta peräisin olevissa elintarvikkeissa
    ja niiden pinnassa olevien torjunta-ainejäämien enimmäismäärien vahvistamisesta
    annetun neuvoston direktiivin 86/363/ETY ja torjunta-ainejäämien enimmäismäärien
    vahvistamisesta tietyille kasvikunnasta peräisin oleville tuotteille, mukaan
    lukien hedelmät ja vihannekset, annetun neuvoston direktiivin 90/642/ETY liitteiden
    muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2000/24/EK irányelve (2000. április 28.) a gabonafélékben,
    az állati eredetű élelmiszerekben, illetőleg az egyes növényi eredetű termékekben
    – többek között a gyümölcsökben és zöldségekben –, illetve azok felületén
    található peszticid-szermaradványok megengedett legmagasabb mértékének meghatározásáról
    szóló 76/895/EGK, 86/362/EGK, 86/363/EGK, illetőleg 90/642/EGK tanácsi irányelv
    mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2000/24/CE della Commissione, del 28 aprile 2000, recante modifica
    degli allegati delle direttive 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE
    del Consiglio, che fissano le quantità massime di residui di antiparassitari
    rispettivamente sui e nei cereali, sui e nei prodotti alimentari di origine animale
    e su e in alcuni prodotti di origine vegetale, compresi gli ortofrutticoli
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2000/24/EK, (2000. gada 28. aprīlis), ar kuru groza
    pielikumus Padomes Direktīvās 76/895/EEK, 86/362/EEK, 86/363/EEK un 90/642/EEK
    par pesticīdu atliekvielu maksimāli pieļaujamo daudzumu noteikšanu attiecīgi
    labībā un uz tās, dzīvnieku izcelsmes pārtikas produktos un uz tiem, un dažos
    augu izcelsmes produktos, tajā skaitā augļos un dārzeņos, un uz tiem
  type: main
- language: lt
  script: Latn
  content: 2000 m. balandžio 28 d. Komisijos direktyva 2000/24/EB, iš dalies keičianti
    Tarybos direktyvų 76/895/EEB, 86/362/EEB, 86/363/EEB ir 90/642/EEB dėl pesticidų
    likučių didžiausių koncentracijų atitinkamai grūduose, gyvūninės kilmės
    maisto produktuose ir tam tikruose augalinės kilmės produktuose ir ant jų,
    įskaitant vaisius ir daržoves, nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 2000/24/KE tat-28 ta' April 2000 li temenda l-Annessi
    tad-Direttivi tal-Kunsill 76/895/KEE, 86/362/KEE, 86/363/KEE u 90/642/KEE dwar
    l-iffissar ta' livelli massimi għar-residwi tal-pestiċidi fiċ-ċereali, oġġetti
    ta’ l-ikel ta' oriġini mill-annimali u ċerti prodotti ta' oriġini mill-pjanti,
    inklużi l-frott u l-ħxejjex rispettivament
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2000/24/EG van de Commissie van 28 april 2000 houdende wijziging
    van de bijlagen van de Richtlijnen 76/895/EEG, 86/362/EEG, 86/363/EEG en 90/642/EEG
    van de Raad tot vaststelling van maximumgehalten aan residuen van bestrijdingsmiddelen
    in en op respectievelijk granen, levensmiddelen van dierlijke oorsprong en bepaalde
    producten van plantaardige oorsprong, met inbegrip van groenten en fruit
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Komisji 2000/24/WE z dnia 28 kwietnia 2000 r. zmieniająca załączniki
    do dyrektyw Rady 76/895/EWG, 86/362/EWG, 86/363/EWG oraz 90/642/EWG w sprawie
    ustalania najwyższych dopuszczalnych poziomów pozostałości pestycydów w zbożach,
    środkach spożywczych pochodzenia zwierzęcego i niektórych produktach pochodzenia
    roślinnego, w tym odpowiednio owocach i warzywach, oraz na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 2000/24/CE da Comissão, de 28 de Abril de 2000, que altera os
    anexos das Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE e 90/642/CEE relativas
    à fixação de teores máximos para os resíduos de pesticidas à superfície
    e no interior dos cereais, dos géneros alimentícios de origem animal e de determinados
    produtos de origem vegetal, incluindo frutas e produtos hortícolas, respectivamente
  type: main
- language: ro
  script: Latn
  content: Directiva 2000/24/CE a Comisiei din 28 aprilie 2000 de modificare a anexelor
    la Directivele 76/895/CEE, 86/362/CEE, 86/363/CEE și 90/642/CEE ale Consiliului
    de stabilire a conținuturilor maxime de reziduuri de pesticide din și de pe
    cereale, produse alimentare de origine animală și anumite produse de origine
    vegetală, inclusiv fructele și legumele
  type: main
- language: sk
  script: Latn
  content: Smernica Komisie 2000/24/ES z 28. apríla 2000, ktorou sa menia a dopĺňajú
    prílohy k smerniciam Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení
    maximálnych úrovní rezíduí pesticídov v a na obilninách, potravinách živočíšneho
    pôvodu a určitých výrobkoch rastlinného pôvodu, vrátane ovocia respektíve
    zeleniny
  type: main
- language: sl
  script: Latn
  content: Direktiva Komisije 2000/24/ES z dne 28. aprila 2000 o spremembi prilog
    k direktivam Sveta 76/895/EGS, 86/363/EGS in 90/642/EGS o določanju mejnih vrednosti
    ostankov pesticidov v in na žitih, živilih živalskega izvora in nekaterih proizvodih
    rastlinskega izvora, vključno s sadjem in zelenjavo
  type: main
- language: es
  script: Latn
  content: Directiva 2000/24/CE de la Comisión, de 28 de abril de 2000, por la que
    se modifican los anexos de las Directivas 76/895/CEE, 86/362/CEE, 86/363/CEE y
    90/642/CEE del Consejo, relativas a la fijación de los contenidos máximos de
    residuos de plaguicidas sobre y en los cereales, sobre y en los productos alimenticios
    de origen animal y en determinados productos de origen vegetal, incluidas las
    frutas y hortalizas, respectivamente
  type: main
