title:
- language: en
  script: Latn
  content: Commission Directive 2000/24/EC of 28 April 2000 amending the Annexes to
    Council Directives 76/895/EEC, 86/362/EEC, 86/363/EEC and 90/642/EEC on the fixing
    of maximum levels for pesticide residues in and on cereals, foodstuffs of animal
    origin and certain products of plant origin, including fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/24/CE de la Commission du 28 avril 2000 modifiant les annexes
    des directives 76/895/CEE, 86/362/CEE, 86/363/CEE et 90/642/CEE du Conseil concernant
    la fixation de teneurs maximales pour les résidus de pesticides sur et dans les
    céréales, les denrées alimentaires d'origine animale et certains produits d'origine
    végétale, y compris les fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/24/EG der Kommission vom 28. April 2000 zur Änderung der
    Anhänge der Richtlinien 76/895/EWG, 86/362/EWG, 86/363/EWG und 90/642/EWG des
    Rates über die Festsetzung von Höchstgehalten an Rückständen von SchädIingsbekämpfungsmitteln
    in und auf Getreide, Lebensmitteln tierischen Ursprungs und bestimmten Erzeugnissen
    pflanzlichen Ursprungs, einschließlich Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/24/EО на Комисията от 28 април
    2000 година за изменение на приложенията към
    Директиви 76/895/EИО, 86/362/EИО, 86/363/EИО и 90/642/EИО на
    Съвета относно определянето на максимални
    количества на остатъци от пестициди във и върху
    зърнените храни, храните от животински произход
    и някои продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/24/ES ze dne 28. dubna 2000, kterou se mění přílohy
    směrnic Rady 76/895/EHS, 86/362/EHS, 86/363/EHS a 90/642/EHS o stanovení maximálních
    limitů reziduí pesticidů v obilovinách, v potravinách živočišného původu
    a v některých produktech rostlinného původu, včetně ovoce a zeleniny, a
    na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/24/EF af 28. april 2000 om ændring af bilagene
    til Rådets direktiv 76/895/EØF, 86/362/EØF, 86/363/EØF og 90/642/EØF om fastsættelse
    af maksimalgrænseværdier for pesticidrester i og på korn, levnedsmidler af
    animalsk oprindelse og visse produkter af vegetabilsk oprindelse, herunder frugt
    og grøntsager
  type: main
- language: el
  script: Grek
  content: Οδηγία 2000/24/ΕΚ της Επιτροπής, της 28ης Απριλίου
