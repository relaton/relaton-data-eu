    του Συμβουλίου 76/895/ΕΟΚ, 86/362/ΕΟΚ, 86/363/ΕΟΚ και
    90/642/ΕΟΚ που αφορούν, αντιστοίχως, τον καθορισμό
    των ανωτάτων περιεκτικοτήτων για τα υπολείμματα
    φυτοφαρμάκων πάνω και μέσα στα σιτηρά, στα
