title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2022/2005 of 12 December 2005 amending Regulation
    (EC) No 14/2004 as regards the forecast supply balances for various agricultural
    products for the outermost regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 2022/2005 de la Commission du 12 décembre 2005 modifiant
    le règlement (CE) n o 14/2004 en ce qui concerne le bilan d'approvisionnement
    prévisionnel des régions ultrapériphériques pour différents produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2022/2005 der Kommission vom 12. Dezember 2005 zur
    Änderung der Verordnung (EG) Nr. 14/2004 hinsichtlich der Bedarfsvorausschätzungen
    für die Versorgung der Regionen in äußerster Randlage mit verschiedenen landwirtschaftlichen
    Erzeugnissen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2022/2005 ze dne 12. prosince 2005 , kterým
    se mění nařízení (ES) č. 14/2004, pokud jde o předběžný odhad dodávek
    různých zemědělských produktů do nejvzdálenějších regionů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2022/2005 af 12. december 2005 om ændring
    af forordning (EF) nr. 14/2004 for så vidt angår de foreløbige forsyningsopgørelser
    over forskellige landbrugsprodukter til regionerne i den yderste periferi
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2022/2005 της Επιτροπής,
    της 12ης Δεκεμβρίου 2005 , σχετικά με την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 14/2004 όσον αφορά την
    κατάρτιση των ισοζυγίων προβλέψεων εφοδιασμού
    των άκρως απόκεντρων περιφερειών με διάφορα
    γεωργικά προϊόντα
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 2022/2005, 12. detsember 2005 , millega muudetakse
    määrust (EÜ) nr 14/2004 äärepoolseimate piirkondade teatavate põllumajandussaaduste
    prognoositava tarnebilansi osas
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2022/2005, annettu 12 päivänä joulukuuta 2005
    , asetuksen (EY) N:o 14/2004 muuttamisesta syrjäisimpien alueiden eri maataloustuotteiden
    alustavien hankintataseiden osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 2022/2005/EK rendelete ( 2005. december 12. ) a legkülső
    régióknak szánt egyes mezőgazdasági termékek előzetes ellátási mérlegei
    tekintetében a 14/2004/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2022/2005 della Commissione, del 12 dicembre 2005 ,
    che modifica il regolamento (CE) n. 14/2004 per quanto riguarda la definizione
    dei bilanci previsionali per l’approvvigionamento di alcuni prodotti agricoli
    alle regioni ultraperiferiche
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 2022/2005 ( 2005. gada 12. decembris ), ar ko
    groza Regulu (EK) Nr. 14/2004 attiecībā uz dažādu lauksaimniecības produktu
    prognozējamo piegāžu bilancēm attālākajiem Kopienas reģioniem
  type: main
- language: lt
  script: Latn
  content: 2005 m. gruodžio 12 d. Komisijos reglamentas (EB) Nr. 2022/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 14/2004 dėl numatomo įvairių žemės ūkio
    produktų tiekimo balanso atokiausiems regionams
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2022/2005 van de Commissie van 12 december 2005 tot
    wijziging van Verordening (EG) nr. 14/2004, wat betreft de geraamde voorzieningsbalansen
    voor verschillende landbouwproducten ten behoeve van de ultraperifere regio's
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 2022/2005 z dnia 12 grudnia 2005 r. zmieniające
    rozporządzenie (WE) nr 14/2004 w odniesieniu do prognozy bilansu dostaw różnych
    produktów rolnych dla regionów najbardziej oddalonych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 2022/2005 da Comissão, de 12 de Dezembro de 2005
    , que altera o Regulamento (CE) n. o 14/2004 no que respeita às estimativas para
    o abastecimento de vários produtos agrícolas às regiões ultraperiféricas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 2022/2005 z 12. decembra 2005 , ktorým sa
    mení a dopĺňa nariadenie (ES) č. 14/2004 pokiaľ ide o predpokladané bilancie
    zásobovania rôznymi poľnohospodárskymi produktmi najvzdialenejších regiónov
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 2022/2005 z dne 12. decembra 2005 o spremembi
    Uredbe (ES) št. 14/2004 glede predvidenih bilanc oskrbe za razne kmetijske proizvode
    najbolj oddaljenim regijam
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 2022/2005 de la Comisión, de 12 de diciembre de 2005
    , por el que se modifica el Reglamento (CE) n o 14/2004 en lo referente al plan
    de previsiones de abastecimiento de varios productos agrícolas a las regiones
    ultraperiféricas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2022/2005 av den 12 december 2005 om
    ändring av förordning (EG) nr 14/2004 när det gäller de prognostiserade försörjningsbalanserna
    för olika jordbruksprodukter i de yttersta randområdena
  type: main
