title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1421/83 of 2 June 1983 re-establishing the
    levying of customs duties on certain stockings, understockings, socks, etc., products
    of category 12 (code 0120), originating in Malaysia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1421/83 de la Commission du 2 juin 1983 portant rétablissement
    de la perception des droits de douane applicables à certains bas, sous-bas, chaussettes,
    etc., de la catégorie 12 (code 0120), originaires de la Malaysia, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1421/83 der Kommission vom 2. Juni 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Strümpfe, Unterziehstrümpfe,
    Socken usw. der Warenkategorie Nr. 12 (Kennziffer 0120), mit Ursprung in Malaysia,
    dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1421/83 af 2. juni 1983 om genindførelse
    af opkrævning af toldafgifter for bestemte strømper, understrømper, sokker,
    osv., under kategori nr. 12 (kode 0120), som har oprindelse i Malaysia og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1421/83 της Επιτροπής
    της 2ας Ιουνίου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για ορισμένες
    περικνημίδες, περιπόδια, περιπόδια κοντά (σοσόνια)
    κλπ., της κατηγορίας 12 (κωδικός αριθμός 0120),
    καταγωγής Μαλαισίας, δικαιούχων των προβλεπομένων
    στον κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1421/83 della Commissione del 2 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili a talune calze, sottocalze, calzini,
    ecc., della categoria di prodotti n. 12 (codice 0120), originari della Malaysia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3378/82
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1421/83 van de Commissie van 2 juni 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    kousen, onderkousen, sokken, enz., van de categorie van produkten nr. 12 (codenummer
    0120), van oorsprong uit Maleisië, waarvoor de algemene tariefpreferenties gelden
    als bepaald bij Verordening (EEG) nr. 3378/82 van de Raad
