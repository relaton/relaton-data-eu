    concerne l’intervention publique par voie d’adjudication pour l’achat de
    blé dur ou de riz paddy, et modifiant les règlements (CE) n o 428/2008 et (CE)
    n o 687/2008
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 670/2009 der Kommission vom 24. Juli 2009 mit Durchführungsbestimmungen
