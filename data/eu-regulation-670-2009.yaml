  script: Latn
  content: Commission Regulation (EC) No 670/2009 of 24 July 2009 laying down detailed
    rules for the application of Council Regulation (EC) No 1234/2007 as regards public
    intervention by invitation to tender for the purchase of durum wheat or paddy
    rice, and amending Regulations (EC) No 428/2008 and (EC) No 687/2008
  type: main
- language: fr
  script: Latn
