    ceea ce privește intervenția publică prin intermediul licitațiilor pentru
    achiziționarea grâului dur sau a orezului nedecorticat și de modificare a Regulamentelor
    (CE) nr. 428/2008 și (CE) nr. 687/2008
  type: main
