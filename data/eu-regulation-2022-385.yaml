  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/385 tas-7 ta’
    Marzu 2022 li jikkoreġi r-Regolament ta’ Implimentazzjoni (UE) 2021/421 dwar
    l-awtorizzazzjoni tat-tintura dderivata mill-Artemisia vulgaris L. (tintura tal-artemisja)
    bħala addittiv tal-għalf għall-ispeċijiet tal-annimali kollha, ir-Regolament
    ta’ Implimentazzjoni (UE) 2021/485 dwar l-awtorizzazzjoni bħala addittivi fl-għalf
    taż-żejt essenzjali tal-ġinġer miż-Zingiber officinale Roscoe għall-ispeċijiet
    kollha tal-annimali, l-oleoreżina tal-ġinġer miż-Zingiber officinale Roscoe
    għat-tiġieġ tas-simna, it-tiġieġ tal-bajd, id-dundjani tas-simna, il-qżieqeż,
    il-ħnieżer tas-simna, il-ħnieżer nisa, il-baqar tal-ħalib, l-għoġġiela
    tas-simna (sostituti tal-ħalib), il-bhejjem tal-ifrat tas-simna, in-nagħaġ,
    il-mogħoż, iż-żwiemel, il-fniek, il-ħut u l-annimali tad-dar u tat-tintura
    tal-ġinġer miż-Zingiber officinale Roscoe għaż-żwiemel u l-klieb, u r-Regolament
    ta’ Implimentazzjoni (UE) 2021/551 dwar l-awtorizzazzjoni tal-estratt taż-żagħfran
    tal-Indja, iż-żejt taż-żagħfran tal-Indja, l-oleoreżina taż-żagħfran
    tal-Indja mir-riżoma tal-Curcuma longa L. bħala addittiv fl-għalf għall-ispeċijiet
    kollha tal-annimali u tat-tintura taż-żagħfran tal-Indja mir-riżoma tal-Curcuma
    longa L. bħala addittiv fl-għalf għaż-żwiemel u l-klieb
