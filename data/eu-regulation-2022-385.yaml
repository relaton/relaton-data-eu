  content: 'Rozporządzenie wykonawcze Komisji (UE) 2022/385 z dnia 7 marca 2022 r.
    w sprawie sprostowania rozporządzenia wykonawczego (UE) 2021/421 dotyczącego
    zezwolenia na stosowanie nalewki z Artemisia vulgaris L. (nalewki z bylicy pospolitej)
    jako dodatku paszowego dla wszystkich gatunków zwierząt, rozporządzenia wykonawczego
    (UE) 2021/485 dotyczącego zezwolenia na stosowanie jako dodatków paszowych:
    olejku eterycznego imbiru otrzymywanego z Zingiber officinale Roscoe dla wszystkich
    gatunków zwierząt, oleożywicy imbirowej otrzymywanej z Zingiber officinale
    Roscoe dla kurcząt rzeźnych, kur niosek, indyków rzeźnych, prosiąt, tuczników,
    loch, krów mlecznych, cieląt (w preparatach mlekozastępczych), bydła opasowego,
    owiec, kóz, koni, królików, ryb i zwierząt domowych oraz nalewki z imbiru
    otrzymywanej z Zingiber officinale Roscoe dla koni i psów oraz rozporządzenia
    wykonawczego (UE) 2021/551 dotyczącego zezwolenia na stosowanie ekstraktu z kurkumy,
    olejku z kurkumy, oleożywicy z kurkumy otrzymywanych z kłączy Curcuma longa
    L. jako dodatków paszowych dla wszystkich gatunków zwierząt oraz nalewki z
    kurkumy otrzymywanej z kłączy Curcuma longa L. jako dodatku paszowego dla koni
    i psów'
