  content: Vykonávacie nariadenie Komisie (EÚ) 2022/385 zo 7. marca 2022, ktorým
    sa opravuje vykonávacie nariadenie (EÚ) 2021/421 o povolení tinktúry získanej
    z Artemisia vulgaris L. (tinktúra z paliny) ako kŕmnej doplnkovej látky pre
    všetky druhy zvierat, vykonávacie nariadenie (EÚ) 2021/485 o povolení zázvorového
    éterického oleja z rastliny Zingiber officinale Roscoe pre všetky druhy zvierat,
    zázvorového oleorezínu z rastliny Zingiber officinale Roscoe pre kurčatá
    vo výkrme, nosnice, morky vo výkrme, prasiatka, ošípané vo výkrme, prasnice,
    dojnice, teľatá (náhradky mlieka), hovädzí dobytok vo výkrme, ovce, kozy,
    kone, králiky, ryby a spoločenské zvieratá a zázvorovej tinktúry z rastliny
    Zingiber officinale Roscoe pre kone a psy ako kŕmnych doplnkových látok a vykonávacie
    nariadenie (EÚ) 2021/551 o povolení kurkumového extraktu, kurkumového oleja
    a kurkumovej olejoživice z pakoreňa Curcuma longa L. ako kŕmnych doplnkových
    látok pre všetky druhy zvierat a kurkumovej tinktúry z pakoreňa Curcuma longa
    L. ako kŕmnej doplnkovej látky pre kone a psy
