  content: Regulamentul de punere în aplicare (UE) 2022/385 al Comisiei din 7 martie
    2022 de rectificare a Regulamentului de punere în aplicare (UE) 2021/421 privind
    autorizarea tincturii derivate din Artemisia vulgaris L. (tinctură de pelinariță)
    ca aditiv pentru hrana tuturor speciilor de animale, a Regulamentului de punere
    în aplicare (UE) 2021/485 privind autorizarea ca aditivi furajeri a uleiului
    esențial de ghimbir din Zingiber officinale Roscoe pentru toate speciile de animale,
    a oleorășinii de ghimbir din Zingiber officinale Roscoe destinate puilor pentru
    îngrășare, găinilor ouătoare, curcanilor pentru îngrășare, purceilor,
    porcilor pentru îngrășare, scroafelor, vacilor de lapte, vițeilor de lapte
    (înlocuitori de lapte), bovinelor pentru îngrășare, ovinelor, caprinelor,
    cailor, iepurilor, peștilor și animalelor de companie și a tincturii de ghimbir
    din Zingiber officinale Roscoe pentru cai și câini și a Regulamentului de punere
    în aplicare (UE) 2021/551 privind autorizarea extractului de curcuma, a uleiului
    de curcuma, a oleorășinii de curcuma din rizomul de Curcuma longa L. ca aditivi
    furajeri pentru toate speciile de animale și a tincturii de curcuma din rizomul
    de Curcuma longa L. ca aditiv furajer pentru cai și câini
