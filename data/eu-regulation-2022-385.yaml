  content: Uitvoeringsverordening (EU) 2022/385 van de Commissie van 7 maart 2022
    tot rectificatie van Uitvoeringsverordening (EU) 2021/421 tot verlening van een
    vergunning voor van Artemisia vulgaris L. afgeleide tinctuur (tinctuur van bijvoet)
    als toevoegingsmiddel voor diervoeding voor alle diersoorten, Uitvoeringsverordening
    (EU) 2021/485 tot verlening van een vergunning als toevoegingsmiddel voor diervoeding
    voor etherische gemberolie van Zingiber officinale Roscoe voor alle diersoorten,
    gember-oleohars van Zingiber officinale Roscoe voor mestkippen, legkippen, mestkalkoenen,
    biggen, mestvarkens, zeugen, melkkoeien, mestkalveren (melkvervangers), mestrunderen,
    schapen, geiten, paarden, konijnen, vissen en gezelschapsdieren, en gembertinctuur
    van Zingiber officinale Roscoe voor paarden en honden, en Uitvoeringsverordening
    (EU) 2021/551 tot verlening van een vergunning voor extract van kurkuma, olie
    van kurkuma en oleohars van kurkuma uit Curcuma longa L. rizoom als toevoegingsmiddelen
    voor diervoeding voor alle diersoorten, en voor tinctuur van kurkuma van Curcuma
    longa L. rizoom als toevoegingsmiddel voor diervoeding voor paarden en honden
  type: main
