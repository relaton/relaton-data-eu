  content: Regulamento de Execução (UE) 2022/385 da Comissão de 7 de março de
    2022 que retifica o Regulamento de Execução (UE) 2021/421 relativo à autorização
    de tintura derivada de Artemisia vulgaris L. (tintura de artemísia) como aditivo
    em alimentos para animais de todas as espécies, o Regulamento de Execução (UE)
    2021/485 relativo à autorização como aditivos em alimentos de óleo essencial
    de gengibre de Zingiber officinale Roscoe para todas as espécies animais, de
    oleorresina de gengibre de Zingiber officinale Roscoe para frangos de engorda,
    galinhas poedeiras, perus de engorda, leitões, porcos de engorda, porcas, vacas
    leiteiras, vitelos (substitutos do leite), bovinos de engorda, ovinos, caprinos,
    cavalos, coelhos, peixes e animais de companhia e de tintura de gengibre de Zingiber
    officinale Roscoe para cavalos e cães, e o Regulamento de Execução (UE) 2021/551
    relativo à autorização de extrato de curcuma, óleo de curcuma e oleorresina
    de curcuma de rizomas de Curcuma longa L. como aditivos em alimentos para animais
    de todas as espécies e de tintura de curcuma de rizomas de Curcuma longa L. como
    aditivo em alimentos para cavalos e cães
