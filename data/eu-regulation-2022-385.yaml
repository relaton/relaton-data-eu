  content: Reglamento de Ejecución (UE) 2022/385 de la Comisión de 7 de marzo de
    2022 por el que se corrige el Reglamento de Ejecución (UE) 2021/421 relativo
    a la autorización de tintura derivada de Artemisia vulgaris L. (tintura de artemisa)
    como aditivo en piensos para todas las especies animales, el Reglamento de Ejecución
    (UE) 2021/485 relativo a la autorización como aditivos para piensos del aceite
    esencial de jengibre (Zingiber officinale Roscoe) para todas las especies animales,
    de la oleorresina de jengibre (Zingiber officinale Roscoe) para pollos de engorde,
    gallinas ponedoras, pavos de engorde, lechones, cerdos de engorde, cerdas, vacas
    lecheras, terneros (sustitutivos de la leche), bovinos de engorde, ovinos, caprinos,
    caballos, conejos, peces y animales de compañía, y de la tintura de jengibre
    (Zingiber officinale Roscoe) para caballos y perros y el Reglamento de Ejecución
    (UE) 2021/551 relativo a la autorización de extracto de cúrcuma, aceite de cúrcuma
    y oleorresina de cúrcuma obtenidos de rizomas de Curcuma longa L. como aditivos
    para piensos para todas las especies animales, y de tintura de cúrcuma obtenida
    de rizomas de Curcuma longa L. como aditivo para piensos para caballos y perros
