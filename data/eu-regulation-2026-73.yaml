id: EURegulation202673
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2026/73 of 4 July 2025 amending Delegated
    Regulation (EU) 2021/2178 as regards the simplification of the content and presentation
    of information to be disclosed concerning environmentally sustainable activities
    and Delegated Regulations (EU) 2021/2139 and (EU) 2023/2486 as regards simplification
    of certain technical screening criteria for determining whether economic activities
    cause no significant harm to environmental objectives
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2026/73 de la Commission du 4 juillet 2025 modifiant
    le règlement délégué (UE) 2021/2178 en ce qui concerne la simplification du
    contenu et de la présentation des informations à publier sur les activités
    durables sur le plan environnemental et les règlements délégués (UE) 2021/2139
    et (UE) 2023/2486 en ce qui concerne la simplification de certains critères d’examen
    technique permettant de déterminer si des activités économiques ne causent
    de préjudice important à aucun des objectifs environnementaux
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2026/73 der Kommission vom 4. Juli 2025 zur
    Änderung der Delegierten Verordnung (EU) 2021/2178 im Hinblick auf die Vereinfachung
    des Inhalts und der Darstellung der in Bezug auf ökologisch nachhaltige Tätigkeiten
    offenzulegenden Informationen und der Delegierten Verordnungen (EU) 2021/2139
    und (EU) 2023/2486 im Hinblick auf die Vereinfachung bestimmter technischer Bewertungskriterien
    zur Feststellung, ob Wirtschaftstätigkeiten erhebliche Beeinträchtigungen der
    Umweltziele vermeiden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2026/73 на Комисията
    от 4 юли 2025 година за изменение на Делегиран
    регламент (ЕС) 2021/2178 с цел опростяване на съдържанието
    и представянето на информацията, която трябва
    да бъде оповестявана по отношение на екологично
    устойчивите дейности, и на делегирани регламенти
    (ЕС) 2021/2139 и (ЕС) 2023/2486 с цел опростяване на някои
    технически критерии за проверка за определяне
    дали икономическите дейности не нанасят значителни
    вреди във връзка с постигането на екологичните
    цели
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2026/73 ze dne 4. července
    2025, kterým se mění nařízení v přenesené pravomoci (EU) 2021/2178, pokud
    jde o zjednodušení obsahu a struktury informací, které mají být zveřejněny
    v souvislosti s environmentálně udržitelnými činnostmi, a nařízení v přenesené
    pravomoci (EU) 2021/2139 a (EU) 2023/2486, pokud jde o zjednodušení určitých
    technických screeningových kritérií pro určení toho, zda hospodářské
    činnosti významně nepoškozují environmentální cíle
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2026/73 af 4. juli 2025 om ændring
    af delegeret forordning (EU) 2021/2178 for så vidt angår forenkling af indholdet
    og præsentationen af de oplysninger, der skal fremlægges vedrørende miljømæssigt
    bæredygtige aktiviteter, og delegeret forordning (EU) 2021/2139 og (EU) 2023/2486
    for så vidt angår forenkling af visse tekniske screeningskriterier til bestemmelse
    af, om økonomiske aktiviteter er til væsentlig skade for miljømål
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2026/73
    της Επιτροπής, της 4ης Ιουλίου 2025, για την τροποποίηση
    του κατ’ εξουσιοδότηση κανονισμού (ΕΕ) 2021/2178
    όσον αφορά την απλούστευση του περιεχομένου
    και της παρουσίασης των πληροφοριών που πρέπει
    να δημοσιοποιούνται σχετικά με περιβαλλοντικά
    βιώσιμες δραστηριότητες και των κατ’ εξουσιοδότηση
    κανονισμών (ΕΕ) 2021/2139 και (ΕΕ) 2023/2486 όσον αφορά
    την απλούστευση ορισμένων τεχνικών κριτηρίων
    ελέγχου για τον προσδιορισμό του κατά πόσον
    οι οικονομικές δραστηριότητες δεν βλάπτουν
    σημαντικά τους περιβαλλοντικούς στόχους
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2026/73, 4. juuli 2025, millega muudetakse
    delegeeritud määrust (EL) 2021/2178 seoses keskkonnasäästlike tegevuste kohta
    avalikustatava teabe sisu ja esitusviisi lihtsustamisega ning delegeeritud määrusi
    (EL) 2021/2139 ja (EL) 2023/2486 seoses teatavate selliste tehniliste sõelumiskriteeriumide
    lihtsustamisega, mille alusel tehakse kindlaks, et majandustegevus ei kahjusta
    oluliselt keskkonnaeesmärke
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2026/73, annettu 4 päivänä heinäkuuta
    2025, delegoidun asetuksen (EU) 2021/2178 muuttamisesta ympäristön kannalta
    kestävistä toiminnoista annettavien tietojen sisällön ja esitystavan yksinkertaistamiseksi
    sekä delegoitujen asetusten (EU) 2021/2139 ja (EU) 2023/2486 muuttamisesta tiettyjen
    sellaisten teknisten arviointikriteerien yksinkertaistamiseksi, joilla määritetään,
    aiheuttavatko taloudelliset toiminnat merkittävää haittaa ympäristötavoitteille
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2026/73 ón gCoimisiún an 4 Iúil 2025 lena
    leasaítear Rialachán Tarmligthe (AE) 2021/2178 a mhéid a bhaineann le hábhar
    agus cur i láthair na faisnéise atá le nochtadh maidir le gníomhaíochtaí
    atá inbhuanaithe ó thaobh an chomhshaoil de a shimpliú agus Rialacháin Tharmligthe
    (AE) 2021/2139 agus (AE) 2023/2486 a mhéid a bhaineann le critéir scagtha theicniúla
    áirithe chun a chinneadh cé acu a dhéantar nó nach ndéantar dochar suntasach
    le gníomhaíochtaí eacnamaíocha do chuspóirí comhshaoil a shimpliú
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2026/73 оd 4. srpnja 2025. o izmjeni Delegirane
    uredbe (EU) 2021/2178 u pogledu pojednostavnjenja sadržaja i prikaza informacija
    o okolišno održivim ekonomskim djelatnostima koje se objavljuju te delegiranih
    uredaba (EU) 2021/2139 i (EU) 2023/2486 u pogledu pojednostavnjenja određenih
    kriterija tehničke provjere na temelju kojih se određuje nanose li ekonomske
    djelatnosti bitnu štetu okolišnim ciljevima
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2026/73 felhatalmazáson alapuló rendelete (2025. július
    4.) az (EU) 2021/2178 felhatalmazáson alapuló rendeletnek a környezeti szempontból
    fenntartható tevékenységekre vonatkozóan közzéteendő információk tartalmának
    és megjelenítésének egyszerűsítése tekintetében, valamint az (EU) 2021/2139
    és az (EU) 2023/2486 felhatalmazáson alapuló rendeletnek a környezeti célkitűzéseket
    jelentősen nem sértő gazdasági tevékenységekkel szemben támasztott követelmények
    meghatározásához szükséges technikai vizsgálati kritériumok egyszerűsítése
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2026/73 della Commissione, del 4 luglio 2025,
    che modifica il regolamento delegato (UE) 2021/2178 per quanto riguarda la semplificazione
    del contenuto e della presentazione delle informazioni da comunicare in merito
    alle attività ecosostenibili e i regolamenti delegati (UE) 2021/2139 e (UE) 2023/2486
    per quanto riguarda la semplificazione di determinati criteri di vaglio tecnico
    che consentono di determinare se le attività economiche non arrecano un danno
    significativo agli obiettivi ambientali
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2026/73 (2025. gada 4. jūlijs), ar ko
    Deleģēto regulu (ES) 2021/2178 groza attiecībā uz tās informācijas satura
    un noformējuma vienkāršošanu, kura jāatklāj par vides ziņā ilgtspējīgām
    darbībām, un Deleģētās regulas (ES) 2021/2139 un (ES) 2023/2486 groza attiecībā
    uz noteiktu tehniskās pārbaudes kritēriju vienkāršošanu, pēc kuriem nosaka,
    vai saimnieciskās darbības nenodara būtisku kaitējumu vidiskajiem mērķiem
  type: main
- language: lt
  script: Latn
  content: 2025 m. liepos 4 d. Komisijos deleguotasis reglamentas (ES) 2026/73, kuriuo
    dėl atskleistinos informacijos apie aplinkos atžvilgiu tvarią veiklą turinio
    ir pateikimo supaprastinimo iš dalies keičiamas Deleguotasis reglamentas (ES)
    2021/2178 ir dėl tam tikrų techninės analizės kriterijų, pagal kuriuos nustatoma,
    ar ekonominė veikla nedaro reikšmingos žalos aplinkos tikslams, supaprastinimo
    iš dalies keičiami deleguotieji reglamentai (ES) 2021/2139 ir (ES) 2023/2486
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2026/73 tal-4 ta’ Lulju 2025
    li jemenda r-Regolament Delegat (UE) 2021/2178 fir-rigward tas-simplifikazzjoni
    tal-kontenut u l-preżentazzjoni tal-informazzjoni li għandha tiġi divulgata
    fir-rigward ta’ attivitajiet ambjentalment sostenibbli u r-Regolamenti Delegati
    (UE) 2021/2139 u (UE) 2023/2486 fir-rigward tas-simplifikazzjoni ta’ ċerti
    kriterji tekniċi ta’ skrinjar għad-determinazzjoni ta’ jekk l-attivitajiet
    ekonomiċi jikkawżawx ħsara sinifikanti għall-objettivi ambjentali
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2026/73 van de Commissie van 4 juli 2025
    tot wijziging van Gedelegeerde Verordening (EU) 2021/2178 wat betreft de vereenvoudiging
    van de inhoud en de presentatie van te rapporteren informatie betreffende ecologisch
    duurzame activiteiten en Gedelegeerde Verordeningen (EU) 2021/2139 en (EU) 2023/2486
    wat betreft de vereenvoudiging van bepaalde technische screeningcriteria om uit
    te maken of economische activiteiten geen ernstige afbreuk doen aan milieudoelstellingen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2026/73 z dnia 4 lipca 2025 r.
    zmieniające rozporządzenie delegowane (UE) 2021/2178 w odniesieniu do uproszczenia
    treści i prezentacji informacji dotyczących zrównoważonej środowiskowo działalności,
    które mają być ujawniane, oraz rozporządzenia delegowane (UE) 2021/2139 i
    (UE) 2023/2486 w odniesieniu do uproszczenia niektórych technicznych kryteriów
    kwalifikacji służących określeniu, czy działalność gospodarcza nie wyrządza
    poważnych szkód względem celów środowiskowych
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2026/73 da Comissão, de 4 de julho de 2025,
    que altera o Regulamento Delegado (UE) 2021/2178 no respeitante à simplificação
    do teor e da apresentação das informações a divulgar relativamente às atividades
    sustentáveis do ponto de vista ambiental e os Regulamentos Delegados (UE) 2021/2139
    e (UE) 2023/2486 no respeitante à simplificação de determinados critérios
    técnicos de avaliação para determinar se as atividades económicas não prejudicam
    significativamente os objetivos ambientais
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2026/73 al Comisiei din 4 iulie 2025 de modificare
    a Regulamentului delegat (UE) 2021/2178 în ceea ce privește simplificarea conținutului
    și a modului de prezentare a informațiilor care trebuie furnizate în ceea ce
    privește activitățile durabile din punctul de vedere al mediului și a Regulamentelor
    delegate (UE) 2021/2139 și (UE) 2023/2486 în ceea ce privește simplificarea
    anumitor criterii tehnice de examinare pentru a stabili dacă activitățile economice
    nu aduc prejudicii semnificative obiectivelor de mediu
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2026/73 zo 4. júla 2025, ktorým
    sa mení delegované nariadenie (EÚ) 2021/2178, pokiaľ ide o zjednodušenie
    obsahu a prezentácie informácií, ktoré sa majú zverejňovať v súvislosti
    s environmentálne udržateľnými činnosťami, a delegované nariadenia (EÚ)
    2021/2139 a (EÚ) 2023/2486, pokiaľ ide o zjednodušenie určitých technických
    kritérií preskúmania na určenie toho, či hospodárske činnosti výrazne
    nenarúšajú plnenie environmentálnych cieľov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2026/73 z dne 4. julija 2025 o spremembi
    Delegirane uredbe (EU) 2021/2178 glede poenostavitve vsebine in prikaza informacij,
    ki jih je treba razkriti v zvezi z okoljsko trajnostnimi dejavnostmi, ter delegiranih
    uredb (EU) 2021/2139 in (EU) 2023/2486 glede poenostavitve nekaterih tehničnih
    meril za pregled za ugotavljanje, ali gospodarske dejavnosti ne škodujejo bistveno
    okoljskim ciljem
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2026/73 de la Comisión, de 4 de julio de 2025,
    por el que se modifican el Reglamento Delegado (UE) 2021/2178 en lo que respecta
    a la simplificación del contenido y de la presentación de la información que
    debe divulgarse sobre las actividades medioambientalmente sostenibles y los Reglamentos
    Delegados (UE) 2021/2139 y (UE) 2023/2486 en lo que respecta a la simplificación
    de determinados criterios técnicos de selección para determinar si las actividades
    económicas no causan un perjuicio significativo a los objetivos medioambientales
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2026/73 av den 4 juli 2025 om
    ändring av delegerad förordning (EU) 2021/2178 vad gäller förenkling av innehållet
    i och presentationen av de upplysningar som ska lämnas om miljömässigt hållbara
    verksamheter och delegerade förordningar (EU) 2021/2139 och (EU) 2023/2486 vad
    gäller förenkling av vissa tekniska granskningskriterier för att avgöra om
    ekonomiska verksamheter inte orsakar någon betydande skada för miljömål
  type: main
