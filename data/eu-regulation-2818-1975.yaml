id: EURegulation28181975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2818/75 of the Commission of 30 October 1975 amending,
    as regards the proof to be furnished in certain cases before refund is made, Regulation
    (EEC) No 192/75 laying down detailed rules for the application of export refunds
    in respect of agricultural products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2818/75 de la Commission, du 30 octobre 1975, modifiant
    le règlement (CEE) n° 192/75 portant modalités d' application des restitutions
    à l' exportation pour les produits agricoles en ce qui concerne les preuves à
    apporter, dans certains cas, pour le paiement des restitutions
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2818/75 der Kommission vom 30. Oktober 1975 zur Änderung
    der Verordnung (EWG) Nr. 192/75 über Durchführungsvorschriften für Ausfuhrerstattungen
    bei landwirtschaftlichen Erzeugnissen betreffend die in bestimmten Fällen für
    die Zahlung der Erstattung vorzulegenden Nachweise
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2818/75 af 30. oktober 1975 om ændring
    af forordning (EØF) nr. 192/75 om gennemførelsesbestemmelser for eksportrestriktioner
    for landbrugsprodukter, for så vidt angår beviser, der i visse tilfælde skal
    føres for betalingen af restitutioner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2818/75 τής Επιτροπής
    τής 30ής Οκτωβρίου 1975 περί τροποποιήσεως τού
    κανονισμού (ΕΟΚ) αριθ. 192/75 «περί τών λεπτομερειών
    εφαρμογής τών επιστροφών κατά τίς εξαγωγές
    τών γεωργικών προϊόντων, όσον αφορά τίς αποδείξεις
    πού πρέπει νά προσκομίζονται σέ ορισμένες
    περιπτώσεις γιά τήν καταβολή τών επιστροφών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2818/75 della Commissione, del 30 ottobre 1975, che
    modifica, per quanto riguarda le prove da fornire in determinati casi ai fini
    del pagamento delle restituzioni, il regolamento (CEE) n. 192/75 che stabilisce
    le modalità d' applicazione delle restituzioni all' esportazione per i prodotti
    agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2818/75 van de Commissie van 30 oktober 1975 waarbij
    Verordening (EEG) nr. 192/75 houdende uitvoeringsbepalingen inzake de restituties
    bij uitvoer voor landbouwprodukten wordt gewijzigd ten aanzien van de bewijzen
    die in bepaalde gevallen moeten worden geleverd voor de betaling van de restituties
  type: main
