title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1496/75 of the Council of 11 June 1975 on the implementation
    of the provisions adopted under the association between the European Economic
    Community and Greece in respect of the movement of goods consequent on the extension
    of the association to the new Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1496/75 du Conseil, du 11 juin 1975, relatif à l'
    application des dispositions adoptées dans le cadre de l' association entre la
    Communauté économique européenne et la Grèce concernant la circulation des
    marchandises, en raison de l' extension de l' association aux nouveaux États
    membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1496/75 des Rates vom 11. Juni 1975 zur Durchführung
    der Vorschriften über den Warenverkehr im Rahmen der Assoziation zwischen der
    Europäischen Wirtschaftsgemeinschaft und Griechenland, die infolge der Ausdehnung
    der Assoziation auf die neuen Mitgliedstaaten erlassen wurden
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1496/75 af 11. juni 1975 om anvendelse af
    de bestemmelser, der er vedtaget inden for rammerne af associeringen mellem Det
    europæiske økonomiske Fællesskab og Grækenland om handel med varer som følge
    af udvidelsen af associeringen til også at omfatte de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1496/75 del Consiglio, dell' 11 giugno 1975, relativo
    all' applicazione delle disposizioni adottate nel quadro dell' associazione tra
    la Comunità economica europea e la Grecia riguardo alla circolazione delle merci
    a seguito dell' estensione dell' associazione ai nuovi Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1496/75 van de Raad van 11 juni 1975 betreffende
    de toepassing van de in het kader van de Associatie tussen de Europese Economische
    Gemeenschap en Griekenland vastgestelde bepalingen betreffende het verkeer van
    goederen, vanwege de uitbreiding van de Associatie tot de nieuwe Lid-Staten
