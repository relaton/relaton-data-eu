  content: Règlement (CEE) n° 2605/71 de la Commission, du 7 décembre 1971, abrogeant
    le règlement (CEE) n° 2543/71 portant application du droit du tarif douanier
    commun aux importations de mandarines, satsumas, clémentines, tangerines et autres
    hybrides similaires d'agrumes originaires d'Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2605/71 der Kommission vom 7. Dezember 1971 zur Aufhebung
    der Verordnung (EWG) Nr. 2543/71 zur Anwendung des Zollsatzes des Gemeinsamen
    Zolltarifs auf Einfuhren von Mandarinen, Satsumas, Clementinen, Tangerinen und
    anderen ähnlichen Kreuzungen von Zitrusfrüchten mit Ursprung in Spanien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2605/71 della Commissione, del 7 dicembre 1971, che
    abroga il regolamento (CEE) n. 2543/71 relativo all'applicazione del dazio della
    tariffa doganale comune alle importazioni di mandarini, satsuma, clementine, tangerini
    e altri ibridi similari originari della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2605/71 van de Commissie van 7 december 1971 tot
    intrekking van Verordening (EEG) nr. 2543/71 houdende toepassing van het recht
    van het gemeenschappelijk douanetarief op de invoer van mandarijnen, satsuma's,
    clementines, tangerines en andere dergelijke kruisingen van citrusvruchten van
    oorsprong uit Spanje
  type: main
