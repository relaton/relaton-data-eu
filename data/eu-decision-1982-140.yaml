  content: '82/140/EEC: Commission Decision of 5 February 1982 establishing that the
    apparatus described as ''Perkin Elmer fluorescence spectrophotometer, model MPF-44A''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/140/CEE: Décision de la Commission, du 5 février 1982, constatant
    que l''importation de l''appareil dénommé "Perkin Elmer - Fluorescence Spectrophotometer,
    model MPF-44A" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/140/EWG: Entscheidung der Kommission vom 5. Februar 1982, mit der festgestellt
    wird, daß das Gerät ,,Perkin Elmer-Fluorescence Spectrophotometer, model MPF-44A"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '82/140/EØF: Kommissionens beslutning af 5. februar 1982 om fastslåelse
    af, at indførsel af apparatet "PERKIN ELMER - Fluorescence Spectrophotometer,
    model MPF-44A" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
