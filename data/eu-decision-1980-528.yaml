title:
- language: en
  script: Latn
  content: '80/528/EEC: Commission Decision of 12 May 1980 finding that the conditions
    required for the admission free of Common Customs Tariff duties of the scientific
    apparatus described as ''Varian-Automated Auger Microprobe, model 981-2850'' ,
    are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/528/CEE: Décision de la Commission, du 12 mai 1980, constatant que
    les conditions requises pour l'' admission en franchise des droits du tarif douanier
    commun de l'' appareil scientifique dénommé "VARIAN-Automated Auger Microprobe,
    model 981-2850" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/528/EWG: Entscheidung der Kommission vom 12. Mai 1980 zur Feststellung,
    daß die Voraussetzungen für die Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    für das wissenschaftliche Gerät ,,Varian-Automated Auger Microprobe, model 981-2850''
    '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/528/EØF: Kommissionens beslutning af 12. maj 1980 om konstatering
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat "Varian-Automated Auger Microprobe, model 981-2850"
    ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/528/ΕΟΚ: Απόφαση τής Επιτροπής τής 12ης
    Μαΐου 1980 περί διαπιστώσεως ότι οι απαιτούμενοι
    όροι γιά τήν παροχή ατελείας ως πρός τούς δασμούς
    τού Κοινού Δασμολογίου στήν επιστημονική συσκευή
    μέ τήν ονομασία «Varian—Automated Auger Microprobe, model 981/2850»
    δέν πληρούνται'
  type: main
- language: it
  script: Latn
  content: '80/528/CEE: Decisione della Commissione, del 12 maggio 1980, che stabilisce
    che le condizioni richieste per l'' ammissione in franchigia dai dazi della tariffa
    doganale comune dell'' apparecchio scientifico denominato "Varian-Automated Auger
    Microprobe, model 981-2850" non sono soddisfatte'
  type: main
- language: nl
  script: Latn
  content: '80/528/EEG: Beschikking van de Commissie van 12 mei 1980 vaststellende
