  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/24 van de Commissie van 13 januari 2020
    tot verlening van een vergunning voor uitbreiding van het gebruik van chiazaden
    (Salvia hispanica) als nieuw voedingsmiddel en de wijziging van de gebruiksvoorwaarden
