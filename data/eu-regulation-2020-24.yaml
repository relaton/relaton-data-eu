    Regulamento de Execução (UE) 2017/2470 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2020/24 al Comisiei din 13 ianuarie
    2020 de autorizare a unei prelungiri a utilizării semințelor de chia (Salvia
    hispanica) ca aliment nou și a modificării condițiilor de utilizare și a cerințelor
    specifice de etichetare pentru semințele de chia (Salvia hispanica), în temeiul
    Regulamentului (UE) 2015/2283 al Parlamentului European și al Consiliului, precum
    și de modificare a Regulamentului de punere în aplicare (UE) 2017/2470 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2020/24 z 13. januára 2020, ktorým
