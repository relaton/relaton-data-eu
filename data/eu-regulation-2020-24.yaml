  script: Latn
  content: Commission Implementing Regulation (EU) 2020/24 of 13 January 2020 authorising
    an extension of use of chia seeds (Salvia hispanica) as a novel food and the change
    of the conditions of use and the specific labelling requirements of chia seeds
    (Salvia hispanica) under Regulation (EU) 2015/2283 of the European Parliament
    and of the Council and amending Commission Implementing Regulation (EU) 2017/2470
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/24 de la Commission du 13 janvier 2020
    autorisant une extension de l’utilisation des graines de chia (Salvia hispanica)
    en tant que nouvel aliment et la modification des conditions d’utilisation et
    des exigences spécifiques d’étiquetage des graines de chia (Salvia hispanica)
    en application du règlement (UE) 2015/2283 du Parlement européen et du Conseil
    et modifiant le règlement d’exécution (UE) 2017/2470 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/24 der Kommission vom 13. Januar 2020
    zur Genehmigung einer Erweiterung der Verwendungszwecke von Chiasamen (Salvia
    hispanica) als neuartiges Lebensmittel sowie der Änderung der Verwendungsbedingungen
    und der spezifischen Kennzeichnungsvorschriften für Chiasamen (Salvia hispanica)
    gemäß der Verordnung (EU) 2015/2283 des Europäischen Parlaments und des Rates
    und zur Änderung der Durchführungsverordnung (EU) 2017/2470 der Kommission
  type: main
