    ako novej potraviny a zmena podmienok používania semien šalvie aztéckej (Salvia
    hispanica) a špecifických požiadaviek na ich označovanie podľa nariadenia
    Európskeho parlamentu a Rady (EÚ) 2015/2283 a ktorým sa mení vykonávacie
    nariadenie Komisie (EÚ) 2017/2470
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2020/24 z dne 13. januarja 2020 o odobritvi
