    como nuevo alimento y el cambio de las condiciones de uso y de los requisitos
    de etiquetado específicos de tales semillas con arreglo al Reglamento (UE) 2015/2283
    del Parlamento Europeo y del Consejo, y que modifica el Reglamento de Ejecución
    (UE) 2017/2470 de la Comisión
  type: main
