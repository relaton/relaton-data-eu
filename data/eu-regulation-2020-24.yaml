    felhasználásának az (EU) 2015/2283 európai parlamenti és tanácsi rendelet
    szerinti engedélyezéséről, az aztékzsályamag (Salvia hispanica) felhasználási
    feltételeinek és különös címkézési követelményeinek az említett rendelet
    szerinti módosításáról, valamint az (EU) 2017/2470 bizottsági végrehajtási
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di Esecuzione (UE) 2020/24 della Commissione del 13 gennaio
    2020 che autorizza l’ampliamento dell’uso dei semi di chia (Salvia hispanica)
    quale nuovo alimento e la modifica delle condizioni d’uso e dei requisiti specifici
    di etichettatura dei semi di chia (Salvia hispanica) a norma del regolamento (UE)
    2015/2283 del Parlamento europeo e del Consiglio e che modifica il regolamento
    di esecuzione (UE) 2017/2470 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2020/24 (2020. gada 13. janvāris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (ES) 2015/2283 atļauj
    paplašināt čia (Salvia hispanica) sēklu kā jauna pārtikas produkta lietojumu
    un mainīt tā lietošanas nosacījumus un īpašās marķēšanas prasības un
    ar ko groza Komisijas Īstenošanas regulu (ES) 2017/2470
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2020/24 2020 m. sausio 13 d. kuriuo
