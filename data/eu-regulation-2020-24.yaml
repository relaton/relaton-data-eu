    нова храна, както и на промяната на условията
    за употреба и специфичните изисквания за етикетиране
    на семена от чиа (Salvia hispanica) съгласно Регламент
    (ЕС) 2015/2283 на Европейския парламент и на Съвета,
    и за изменение на Регламент за изпълнение (ЕС)
    2017/2470 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí Nařízení Komise (EU) 2020/24 ze dne 13. ledna 2020, kterým
    se povoluje rozšíření použití semen chia (Salvia hispanica) jako nové potraviny
    a změna podmínek použití a zvláštních požadavků na označování semen
    chia (Salvia hispanica) podle nařízení Evropského parlamentu a Rady (EU) 2015/2283
