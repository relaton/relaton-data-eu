title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1521/2001 of 25 July 2001 determining the
    extent to which import rights applications submitted in July 2001 under the tariff
    quotas for beef provided for by Regulation (EC) No 1216/2001 for Estonia, Latvia,
    and Lithuania may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1521/2001 de la Commission du 25 juillet 2001 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites en juillet 2001 pour les contingents tarifaires de la viande bovine
    prévus par le règlement (CE) n° 1216/2001 pour l'Estonie, la Lettonie et la
    Lituanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1521/2001 der Kommission vom 25. Juli 2001 zur Bestimmung
    des Ausmaßes, in dem den im Juli 2001 gestellten Anträgen auf Erteilung von
    Einfuhrrechten im Rahmen der in der Verordnung (EG) Nr. 1216/2001 für Litauen,
    Lettland und Estland vorgesehenen Zollkontingente für Rindfleisch stattgegeben
    werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1521/2001 af 25. juli 2001 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importrettigheder indgivet
    i juli 2001 for de toldkontingenter i oksekødssektoren, der er fastsat i forordning
    (EF) nr. 1216/2001 for Estland, Letland og Litauen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1521/2001 της Επιτροπής,
    της 25ης Ιουλίου 2001, για τον καθορισμό σε ποιο
    βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως δικαιωμάτων εισαγωγής που υποβλήθηκαν
    τον Ιούλιο 2001 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται από τον
    κανονισμό (ΕΚ) αριθ. 1216/2001 για την Εσθονία, τη
    Λετονία και τη Λιθουανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1521/2001, annettu 25 päivänä heinäkuuta
    2001, asetuksessa (EY) N:o 1216/2001 määrättyjen naudanlihan tariffikiintiöitä
    koskevien, heinäkuussa 2001 jätettyjen tuontioikeushakemusten hyväksyttävyydestä
    Viron, Latvian ja Liettuan osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1521/2001 della Commissione, del 25 luglio 2001, che
    stabilisce in che misura possono essere accolte le domande di diritti di importazione
    presentate nel luglio 2001 per i contingenti tariffari di carni bovine previsti
    dal regolamento (CE) n. 1216/2001 per l'Estonia, la Lettonia e la Lituania
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1521/2001 van de Commissie van 25 juli 2001 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in juli 2001 ingediende aanvragen
    om rechten tot invoer voor de tariefcontingenten voor rundvlees op grond van Verordening
    (EG) nr. 1216/2001 voor Estland, Letland en Litouwen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1521/2001 da Comissão, de 25 de Julho de 2001, que
    determina em que medida podem ser aceites os pedidos dos direitos de importação
    apresentados em Julho de 2001 para os contingentes pautais de carne de bovino
    previstos no Regulamento (CE) n.° 1216/2001 para a Estónia, a Letónia e a Lituânia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1521/2001 de la Comisión, de 25 de julio de 2001,
    por el que se determina la proporción en que podrán aceptarse las solicitudes
    de derechos de importación, presentadas en julio de 2001, correspondientes a
    los contingentes arancelarios de carne de vacuno establecidos por el Reglamento
    (CE) n° 1216/2001 para Lituania, Letonia y Estonia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1521/2001 av den 25 juli 2001 om i vilken
    utsträckning ansökningar om importrättigheter kan godkännas som har inlämnats
    under juli 2001 för de tullkvoter för nötkött som föreskrivs i förordning
    (EG) nr 1216/2001 för Estland, Lettland och Litauen
  type: main
