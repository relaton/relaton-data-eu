title:
- language: en
  script: Latn
  content: '2003/506/EC: Commission Decision of 3 July 2003 amending Decisions 2001/881/EC
    drawing up a list of border inspection posts agreed for veterinary checks on animals
    and animal products from third countries, and 2002/459/EC listing the units in
    the ANIMO computer network'
  type: main
- language: fr
  script: Latn
  content: '2003/506/CE: Décision de la Commission du 3 juillet 2003 modifiant les
    décisions 2001/881/CE de la Commission établissant une liste de postes d''inspection
    frontaliers agréés pour les contrôles vétérinaires sur les animaux et les
    produits animaux en provenance des pays tiers, et 2002/459/CE de la Commission
    fixant la liste des unités du réseau informatisé ANIMO'
  type: main
- language: de
  script: Latn
  content: '2003/506/EG: Entscheidung der Kommission vom 3. Juli 2003 zur Änderung
    der Entscheidung 2001/881/EG zur Festlegung eines Verzeichnisses der für die
    Veterinärkontrollen von aus Drittländern eingeführten Tieren und tierischen
    Erzeugnissen zugelassenen Grenzkontrollstellen und der Entscheidung 2002/459/EG
    zur Festlegung der Liste der Einheiten des informatisierten Netzes "ANIMO"'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 3 юли 2003 година
    за изменение на Решение 2001/881/ЕО относно определяне
    на списък на граничните инспекционни пунктове,
    одобрени да извършват ветеринарни проверки
    на животни и животински продукти с произход
    от трети страни, и Решение 2002/459/ЕО относно определяне
    на списъка със звената на компютърната система
    „Анимо“
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 3. července 2003, kterým se mění rozhodnutí
    2001/881/ES, kterým se stanoví seznam stanovišť hraniční kontroly schválených
    pro veterinární kontroly zvířat a živočišných produktů ze třetích zemí,
    a rozhodnutí 2002/459/ES, kterým se zřizuje seznam jednotek v počítačové
    síti ANIMO
  type: main
- language: da
  script: Latn
  content: '2003/506/EF: Kommissionens beslutning af 3. juli 2003 om ændring af beslutning
    2001/881/EF om en liste over grænsekontrolsteder, der er godkendt til at føre
    veterinærkontrol med dyr og animalske produkter fra tredjelande, og beslutning
    2002/459/EF om fastsættelse af listen over enheder i edb-nettet ANIMO'
  type: main
- language: el
  script: Grek
  content: '2003/506/ΕΚ: Απόφαση της Επιτροπής, της 3ης
    Ιουλίου 2003, για την τροποποίηση της απόφασης
    2001/881/ΕΚ για την κατάρτιση καταλόγου μεθοριακών
    σταθμών επιθεώρησης που έχουν συμφωνηθεί για
    τη διενέργεια κτηνιατρικών ελέγχων σε ζώα
    και ζωικά προϊόντα από τρίτες χώρες και της
    απόφασης 2002/459/EΚ για την κατάρτιση του καταλόγου
    των μονάδων του δικτύου πληροφορικής ANIMO'
  type: main
- language: et
  script: Latn
  content: Komisjoni otsus, 3. juuli 2003, millega muudetakse otsust 2001/881/EÜ,
    milles koostatakse kolmandatest riikidest pärit loomade ja loomsete toodete veterinaarkontrolliks
    heakskiidetud piiripunktide loetelu, ja otsust 2002/459/EÜ, milles loetletakse
    ANIMO-arvutivõrgu üksused
  type: main
- language: fi
  script: Latn
  content: '2003/506/EY: Komission päätös, tehty 3 päivänä heinäkuuta 2003,
    kolmansista maista tulevien eläinten ja eläintuotteiden eläinlääkärintarkastuksia
    varten hyväksyttyjen rajatarkastusasemien luettelosta tehdyn päätöksen 2001/881/EY
    ja ANIMO-tietokoneverkon yksiköitä koskevasta luettelosta tehdyn päätöksen
    2002/459/EY muuttamisesta'
  type: main
- language: hu
  script: Latn
  content: A Bizottság határozata (2003. július 3.) a harmadik országból behozott
    állatok és állati termékek állat-egészségügyi ellenőrzésére jóváhagyott
    állat-egészségügyi határállomások jegyzékének összeállításáról
    szóló 2001/881/EK határozat és az ANIMO számítógépes hálózat egységeinek
    felsorolásáról szóló 2002/459/EK határozat módosításáról
  type: main
- language: it
  script: Latn
  content: '2003/506/CE: Decisione della Commissione, del 3 luglio 2003, recante modifica
    della decisione 2001/881/CE che stabilisce l''elenco dei posti d''ispezione frontalieri
    riconosciuti ai fini dei controlli veterinari sui prodotti e sugli animali provenienti
    dai paesi terzi e della decisione 2002/459/CE che stabilisce l''elenco delle unità
    della rete informatizzata ANIMO'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2003. gada 3. jūlijs), ar kuru groza Lēmumu 2001/881/EK,
    ar ko izstrādā to robežkontroles punktu sarakstu, kas apstiprināti veterinārajai
    kontrolei attiecībā uz dzīvniekiem un dzīvnieku izcelsmes produktiem no trešām
    valstīm, un Lēmumu 2002/459/EK, kurā uzskaitītas ANIMO datortīkla vienības
  type: main
- language: lt
  script: Latn
  content: 2003 m. liepos 3 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
    2001/881/EB, nustatantį kontrolės postų, patvirtintų atlikti gyvūnų ir gyvūninės
    kilmės produktų iš trečiųjų šalių veterinarinius patikrinimus, sąrašą,
    ir Sprendimą 2002/459/EB, pateikiantį ANIMO kompiuterių tinklo vienetų sąrašą
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tat-3 ta’ Lulju 2003 li temenda d-Deċiżjoni
    Nru 2001/881/KE li tistipola elenku ta’ postijiet ta’ spezzjoni fil-fruntieri
    miftehma għall-kontroll veterinarju ta’ annimali u prodotti ta’ l-annimali
    minn pajjizi terzi, u 2002/459/KE li telenka l-unitajiet fin-network tal-komputer
    ta’ l-ANIMO
  type: main
- language: nl
  script: Latn
  content: '2003/506/EG: Beschikking van de Commissie van 3 juli 2003 tot wĳziging
    van Beschikking 2001/881/EG tot vaststelling van een lĳst van grensinspectieposten
    die zĳn erkend voor de veterinaire controles van dieren en dierlĳke producten
    uit derde landen en van Beschikking 2002/459/EG tot vaststelling van de lĳst
    van de eenheden van het computernetwerk ANIMO'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 3 lipca 2003 r. zmieniająca decyzję 2001/881/WE
    ustanawiającą wykaz punktów kontroli granicznej do celów przeprowadzania kontroli
    weterynaryjnej zwierząt i produktów zwierzęcych z państw trzecich oraz decyzję
    2002/459/WE wymieniającą jednostki systemu komputerowego ANIMO
  type: main
- language: pt
  script: Latn
  content: '2003/506/CE: Decisão da Comissão, de 3 de Julho de 2003, que altera
    as Decisões 2001/881/CE que estabelece uma lista dos postos de inspecção fronteiriços
    aprovados para a realização dos controlos veterinários de animais vivos e produtos
    animais provenientes de países terceiros e 2002/459/CE que estabelece a lista
    das unidades da rede informatizada "ANIMO"'
  type: main
- language: ro
  script: Latn
  content: Decizia Comisiei din 3 iulie 2003 de modificare a Deciziei 2001/881/CE
    a Comisiei de stabilire a listei punctelor de control la frontieră desemnate
    pentru controalele veterinare ale animalelor și ale produselor animale din țări
    terțe și a Deciziei 2002/459/CE a Comisiei de stabilire a listei unităților
    din rețeaua informatizată ANIMO
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie Z 3. JÚLA 2003, ktorým sa mení a dopĺňa rozhodnutie
    2001/881/ES, ktorým sa zostavuje zoznam hraničných inšpekčných staníc schválených
    na veterinárne kontroly zvierat a živočíšnych produktov z tretích krajín,
    a rozhodnutie 2002/459/ES, ktorým sa zostavuje zoznam jednotiek v počítačovej
    sieti ANIMO
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 3. julija 2003 o spremembi Odločbe 2001/881/ES
