id: EUDecision1977167
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1976 authorizing Ireland not to apply
    Community treatment to footwear other than with uppers of leather falling within
    subheading 64.02 B of the Common Customs Tariff, originating in Taiwan and in
    free circulation in the United Kingdom
  type: main
- language: fr
  script: Latn
  content: '77/167/CEE: Décision de la Commission, du 21 décembre 1976, autorisant
    l''Irlande à exclure du traitement communautaire les chaussures autres que à
    dessus en cuir naturel, de la position 64.02 B du Tarif douanier commun, originaires
    de Taiwan et mises en libre pratique au Royaume-Uni'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1976, mit der Irland ermächtigt
    wird, aus Taiwan stammende und im Vereinigten Königreich im freien Verkehr befindliche
    Schuhe (andere als mit Oberteil aus Leder) der Tarifstelle 64.02 B des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1976 om bemyndigelse af Irland
    til fra fællesskabsbehandling at undtage fodtøj, bortset fra fodtøj med overdel
    af læder, som henhører under position 64.02 B i den fælles toldtarif, har oprindelse
    i Taiwan og frit kan omsættes i Det forenede Kongerige
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1976, che autorizza l'Irlanda
    ad escludere dal trattamento comunitario le calzature diverse da quelle con tomaia
    di cuoio naturale comprese nella sottovoce 64.02 B della tariffa doganale comune,
    originarie di Taiwan e messe in libera pratica nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1976 waarbij Ierland wordt
    gemachtigd schoeisel, ander dan met bovendeel van leder, van post 64.02 B van
    het gemeenschappelijk douanetarief, van oorsprong uit Taiwan en in het Verenigd
    Koninkrijk in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
