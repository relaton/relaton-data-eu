type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 600/74 of the Commission of 15 March 1974 re-establishing
    the levying of the customs duties on tubes and pipes and blanks therefor, of copper;
    hollow bars of copper, falling within heading No 74.07 originating in Yugoslavia
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3501/73 of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 600/74 de la Commission, du 15 mars 1974, portant
    rétablissement de la perception des droits de douane applicables aux tubes et
    tuyaux (y compris ébauches) et barres creuses, en cuivre, de la position tarifaire
    74.07, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 600/74 der Kommission vom 15. März 1974 zur Wiedereinführung
    des Zollsatzes für Rohre (einschließlich Rohlinge) und Hohlstangen, aus Kupfer,
    der Tarifnummer 74.07, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 600/74 af 15. marts 1974 om genindførelse
    af opkrævning af toldafgifter for rør, røremner og hule stænger, af kobber
    under position 74.07 som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 600/74 della Commissione, del 15 marzo 1974, che ripristina
    la riscossione dei dazi doganali applicabili ai tubi (compresi i loro sbozzi)
    e barre forate, di rame, della voce doganale n. 74.07 originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3501/73
    del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 600/74 van de Commissie van 15 maart 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op buizen en
    pijpen (ook indien niet afgewerkt) en holle staven, van koper, van post 74.07
    van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 3501/73
    van de Raad van 18 december 1973 algemene tariefpreferenties werden geopend
  type: main
