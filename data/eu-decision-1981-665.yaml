title:
- language: en
  script: Latn
  content: '81/665/EEC: Commission Decision of 24 April 1981 authorizing Ireland not
    to apply Community treatment to jerseys, pullovers, slip-overs, waistcoats, twinsets,
    cardigans, bed jackets and jumpers, originating in Taiwan (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/665/CEE: Décision de la Commission, du 24 avril 1981, autorisant l''Irlande
    à exclure du traitement communauaire les chandails, "pullovers", "twinsets",
    gilets et vestes originaires de T''ai-wan (Le texte en langue anglaise est le
    seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/665/EWG: Entscheidung der Kommission vom 24. April 1981 zur Ermächtigung
    Irlands, aus Taiwan stammende Pullover, Slipover, Twinsets, Westen und Strickjacken
    von der Gemeinschaftsbehandlung auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/665/EØF: Kommissionens beslutning af 24. april 1981 om bemyndigelse
    til Irland til fra fællesskabsbehandling at undtage sweatere, pullovere, slipovere,
    cardigans, cardigansæt, jumpere, trøjer og veste med oprindelse i Taiwan (Kun
    den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/665/ΕΟΚ: Απόφαση τής Επιτροπής τής 24ης
    Απριλίου 1981 μέ τήν οποία η Ιρλανδία εξουσιοδοτείται
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά chandails, pullovers, twinsets, γιλέκα καί σακάκια καταγωγής
    Ταϊβάν (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/665/CEE: Decisione della Commissione, del 24 aprile 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario maglie, pullover, con o senza
    maniche, slip-over, twinset, giubbetti e giacche originari di Taiwan (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/665/EEG: Beschikking van de Commissie van 24 april 1981 houdende machtiging
