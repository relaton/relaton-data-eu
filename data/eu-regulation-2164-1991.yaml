title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2164/91 of 23 July 1991 laying down provisions
    for the implementation of Article 5 (2) of Council Regulation (EEC) No 1697/79
    on the post-clearance recovery of import duties or export duties which have not
    been required of the person liable for payment on goods entered for a customs
    procedure involving the obligation to pay such duties
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2164/91 DE LA COMMISSION du 23 juillet 1991 fixant
    les dispositions d'' application de l'' article 5 paragraphe 2 du règlement (CEE)
    no 1697/79 du Conseil concernant le recouvrement a posteriori des droits à l''
    importation ou des droits à l'' exportation qui n'' ont pas été exigés du
    redevable pour des marchandises déclarées pour un régime douanier comportant
    l'' obligation de payer de tels droits #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2164/91 DER KOMMISSION vom 23. Juli 1991 zur Durchführung
    des Artikels 5 Absatz 2 der Verordnung (EWG) Nr. 1697/79 des Rates betreffend
    die Nacherhebung von noch nicht vom Abgabenschuldner angeforderten Eingangs- oder
    Ausfuhrabgaben für Waren, die zu einem Zollverfahren angemeldet worden sind,
    das die Verpflichtung zur Zahlung derartiger Abgaben beinhaltet #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2164/91 af 23. juli 1991 om gennemførelsesbestemmelser
    til artikel 5, stk. 2, i Rådets forordning (EØF) nr. 1697/79 om efteropkrævning
    af import- eller eksportafgifter, der ikke er opkrævet hos debitor for varer,
    der er angivet til en toldprocedure, som medfører en forpligtelse til at betale
    sådanne afgifter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2164/91 της Επιτροπής
    της 23ης Ιουλίου 1991 περί καθορισμού των διατάξεων
    εφαρμογής του άρθρου 5 παράγραφος 2 του κανονισμού
    (ΕΟΚ) αριθ. 1697/79 του Συμβουλίου περί της εκ των
    υστέρων εισπράξεως εισαγωγικών ή εξαγωγικών
    δασμών που δεν κατέστησαν απαιτητοί από τον
    φορολογούμενο, για εμπορεύματα που διασαφίστηκαν
    σε τελωνειακό καθεστώς, συνεπαγόμενο την υποχρέωση
    καταβολής τέτοιων δασμών
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 2164/91 DELLA COMMISSIONE del 23 luglio 1991 che
    stabilisce le disposizioni di applicazione dell'' articolo 5, paragrafo 2 del
    regolamento (CEE) n. 1697/79 del Consiglio relativo al recupero « a posteriori
    » dei dazi all'' importazione o dei dazi all'' esportazione che non sono stati
    corrisposti dal debitore per le merci dichiarate per un regime doganale comportante
    l'' obbligo di effettuare il pagamento #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2164/91 VAN DE COMMISSIE van 23 juli 1991 tot vaststelling
    van de uitvoeringsbepalingen van artikel 5, lid 2, van Verordening (EEG) nr. 1697/79
    van de Raad inzake navordering van de rechten bij invoer of bij uitvoer die niet
    van de belastingschuldige zijn opgeëist voor goederen welke zijn aangegeven voor
    een douaneregeling waaruit de verplichting tot betaling van dergelijke rechten
    voortvloeide #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 2164/91 DA COMISSÃO de 23 de Julho de 1991 que fixa
    as regras de execução do no 2 do artigo 5o do Regulamento (CEE) no 1697/79 do
    Conselho relativo à cobrança a posteriori dos direitos de importação ou dos
    direitos de exportação que não tenham sido exigidos ao devedor por mercadorias
    declaradas para um regime aduaneiro que implica a obrigação de pagamento dos
    referidos direitos #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 2164/91 DE LA COMISIÓN de 23 de julio de 1991 por
    el que se establecen las disposiciones de aplicación del apartado 2 del artículo
    5 del Reglamento (CEE) no 1697/79 del Consejo referente a la recaudación a posteriori
    de los derechos de importación o de los derechos de exportación que no hayan
    sido exigidos al deudor por mercancías declaradas en un régimen aduanero que
    suponga la obligación de pagar tales derechos #'
