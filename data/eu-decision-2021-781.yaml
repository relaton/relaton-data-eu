  script: Latn
  content: Commission Implementing Decision (EU) 2021/781 of 10 May 2021 on the publication
    of a list indicating certain CO2 emissions values per manufacturer as well as
    average specific CO2 emissions of all new heavy-duty vehicles registered in the
    Union and reference CO2 emissions pursuant to Regulation (EU) 2019/1242 of the
    European Parliament and of the Council for the reporting period of the year 2019
    (notified under document C(2021) 3109) (Only the Dutch, English, French, German,
    Italian and Swedish text are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/781 de la Commission du 10 mai 2021
    relative à la publication d’une liste indiquant certaines valeurs d’émissions
    de CO2 par constructeur ainsi que les émissions spécifiques moyennes de CO2
    de tous les véhicules utilitaires lourds neufs immatriculés dans l’Union et
    les émissions de CO2 de référence conformément au règlement (UE) 2019/1242
    du Parlement européen et du Conseil pour la période de communication des rapports
    de 2019 [notifiée sous le numéro C(2021) 3109] (Les textes en langues allemande,
    anglaise, française, italienne, néerlandaise et suédoise sont les seuls faisant
    foi.)
