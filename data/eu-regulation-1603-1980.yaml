title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1603/80 of 24 June 1980 re-establishing
    the levying of customs duties on primary cells and primary batteries, falling
    within heading No 85.03 and originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1603/80 de la Commission, du 24 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux piles électriques,
    de la position 85.03 du tarif douanier commun, originaires de Hong-kong, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1603/80 der Kommission vom 24. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Primärelemente und Primärbatterien, der Tarifnummer 85.03,
    mit Ursprung in Hongkong, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1603/80 af 24. juni 1980 om genindførelse
    af opkrævning af toldafgifter for primærelementer og primærbatterier, under
    pos. 85.03, som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1603/80 della Commissione, del 24 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle pile elettriche,
    della voce 85.03 della tariffa doganale comune, originarie di Hong Kong, beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1603/80 van de Commissie van 24 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    elementen en elektrische batterijen, van post 85.03 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong-Kong ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
