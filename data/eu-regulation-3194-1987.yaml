    66.01 e 97.03 della tariffa doganale comune, originari di Singapore beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3194/87 van de Commissie van 26 oktober 1987 houdende
