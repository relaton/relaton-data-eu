title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3194/87 of 26 October 1987 re-establishing
    the levying of customs duties on umbrellas and sunshades and to other toys, working
    models of a kind, used for recreational purposes falling within headings 66.01
    and 97.03, originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3194/87 de la Commission du 26 octobre 1987 portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles et aux autres jouets; modèles réduits pour le divertissement,
    des positions 66.01 et 97.03 du tarif douanier commun, originaires de Singapour,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3194/87 der Kommission vom 26. Oktober 1987 zur Wiedereinführung
