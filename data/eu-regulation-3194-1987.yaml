    i Den Fælles Toldtarif, og for andet legetøj, modeller til legebrug, henhørende
    under pos. 97.03 i Den Fælles Toldtarif og med oprindelse i Singapore, som er
    præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
