    Modelle zum Spielen der Tarifnummern 66.01 und 97.03 mit Ursprung in Singapur,
    denen die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3194/87 af 26. oktober 1987 om genindførelse
