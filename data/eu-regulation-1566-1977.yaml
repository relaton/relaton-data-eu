title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1566/77 of 12 July 1977 making the importation
    into the Community or certain Member States of cotton yarn and garments originating
    in certain third countries subject to authorization
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1566/77 de la Commission, du 12 juillet 1977, soumettant
    à autorisation les importations dans la Communauté ou dans quelques États membres
    des fils de coton et de vêtements originaires de certains pays tiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1566/77 der Kommission vom 12. Juli 1977 mit der die
    Einfuhren von Baumwollgarnen und Bekleidung mit Ursprung in bestimmten Drittländern
    in die Gemeinschaft oder in einige Mitgliedstaaten von einer Genehmigung abhängig
    gemacht werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1566/77 af 12. juli 1977 om indførelse
    af en bevillingsordning for indførsel til Fællesskabet eller nogle medlemsstater
    af garn af bomuld samt af beklædningsgenstande med oprindelse i visse tredjelande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1566/77 della Commissione, del 12 luglio 1977, che
    subordina a licenza le importazioni nella Comunità o in alcuni Stati membri dei
    filati di cotone e di indumenti originari di taluni paesi terzi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1566/77 van de Commissie van 12 juli 1977 waarbij
    de invoer in de Gemeenschap of in enige Lid-Staten van garens van katoen en kleding
    van oorsprong uit bepaalde derde landen aan invoervergunningen wordt onderworpen
  type: main
