    lastbilars och tunga bussars koldioxidutsläpp och bränsleförbrukning och införande
    av fordon som drivs med vätgas och annan ny teknik och om ändring av förordning
    (EU) nr 582/2011 vad gäller tillämpliga regler om bestämning av koldioxidutsläpp
    och bränsleförbrukning i syfte att uppnå ett utvidgande till ett EU-typgodkännande
