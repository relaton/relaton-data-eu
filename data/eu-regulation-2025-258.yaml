    kuorma-autojen ja raskaiden linja-autojen hiilidioksidipäästöjen ja polttoaineenkulutuksen
    määrittämisestä ja vetyä ja muita uusia teknologioita käyttävien ajoneuvojen
    ottamisesta huomioon sekä asetuksen (EU) N:o 582/2011 muuttamisesta siltä osin
    kuin on kyse hiilidioksidipäästöjen ja polttoaineenkulutuksen määrittämiseen
    sovellettavista säännöistä EU-tyyppihyväksynnän laajennuksen saamiseksi
  type: main
