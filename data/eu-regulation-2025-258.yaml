    Regulu (ES) 2017/2400 attiecībā uz vidēji smago un smago kravas automobiļu
    un autobusu CO2 emisiju un degvielas patēriņa noteikšanu un ar ūdeņradi darbināmu
    transportlīdzekļu un citu jaunu tehnoloģiju iekļaušanu un ar ko groza Regulu
    (ES) Nr. 582/2011 attiecībā uz attiecināmajiem noteikumiem par CO2 emisiju
    un degvielas patēriņa noteikšanu, lai iegūtu ES tipa apstiprinājuma paplašinājumu
  type: main
- language: lt
  script: Latn
  content: 2025 m. vasario 7 d. Komisijos reglamentas (ES) 2025/258, kuriuo dėl vidutinių
    ir sunkiųjų sunkvežimių bei sunkiųjų autobusų išmetamo CO2 kiekio ir degalų
    sąnaudų nustatymo ir vandeniliu bei kitomis naujomis technologijomis varomų
    transporto priemonių įtraukimo iš dalies keičiamas Reglamentas (ES) 2017/2400
    ir iš dalies keičiamos Reglamento (ES) Nr. 582/2011 nuostatos dėl išmetamo
    CO2 kiekio ir degalų sąnaudų nustatymo taisyklių, taikomų siekiant išplėsti
    ES tipo patvirtinimo taikymo sritį
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) 2025/258 tas-7 ta’ Frar 2025 li jemenda
    r-Regolament (UE) 2017/2400 fir-rigward tad-determinazzjoni tal-emissjonijiet
    ta’ CO2 u tal-konsum tal-fjuwil ta’ trakkijiet medji u tqal u ta’ karozzi
    tal-linja tqal u l-inklużjoni ta’ vetturi li jaħdmu bl-idroġenu u teknoloġiji
    ġodda oħra u li jemenda r-Regolament (UE) Nru 582/2011 fir-rigward tar-regoli
    applikabbli dwar id-determinazzjoni tal-emissjonijiet tas-CO2 u tal-konsum tal-fjuwil
    sabiex tinkiseb estensjoni għal approvazzjoni tat-tip tal-UE
  type: main
