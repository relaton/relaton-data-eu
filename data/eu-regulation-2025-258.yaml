    stredne ťažkých a ťažkých nákladných vozidiel a ťažkých autobusov a
    zahrnutie vozidiel na vodíkový pohon a iných nových technológií, a ktorým
    sa mení nariadenie (EÚ) č. 582/2011, pokiaľ ide o uplatniteľné pravidlá
    určovania emisií CO2 a spotreby paliva na získanie rozšírenia typového schválenia
    EÚ
  type: main
