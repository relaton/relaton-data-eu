  script: Latn
  content: Regulamento (UE) 2025/258 da Comissão, de 7 de fevereiro de 2025, que
    altera o Regulamento (UE) 2017/2400 no respeitante à determinação das emissões
    de CO2 e ao consumo de combustível dos camiões médios e pesados e dos autocarros
    pesados, bem como à inclusão de veículos movidos a hidrogénio e outras novas
    tecnologias, e que altera o Regulamento (UE) n.o 582/2011 no respeitante às regras
    aplicáveis à determinação das emissões de CO2 e ao consumo de combustível
    para obter uma extensão de uma homologação UE
  type: main
