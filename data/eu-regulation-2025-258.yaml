  script: Latn
  content: Regulamentul (UE) 2025/258 al Comisiei din 7 februarie 2025 de modificare
    a Regulamentului (UE) 2017/2400 în ceea ce privește determinarea emisiilor de
    CO2 și a consumului de combustibil ale camioanelor medii și grele și ale autobuzelor
    grele și includerea vehiculelor care funcționează pe bază de hidrogen și
    de alte tehnologii noi și de modificare a Regulamentului (UE) nr. 582/2011 în
    ceea ce privește normele aplicabile privind determinarea emisiilor de CO2 și
    a consumului de combustibil pentru a obține o extindere a omologării UE de tip
  type: main
