title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2025/258 of 7 February 2025 amending Regulation
    (EU) 2017/2400 as regards the determination of the CO2 emissions and fuel consumption
    of medium and heavy lorries and heavy buses and the inclusion of vehicles running
    on hydrogen and other new technologies and amending Regulation (EU) No 582/2011
    as regards the applicable rules on the determination of CO2 emissions and fuel
    consumption in order to obtain an extension to an EU type-approval
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2025/258 de la Commission du 7 février 2025 modifiant
    le règlement (UE) 2017/2400 en ce qui concerne la détermination des émissions
    de CO2 et de la consommation de carburant des camions moyens et lourds et des
    autobus lourds et l’introduction de véhicules fonctionnant à l’hydrogène
    et d’autres nouvelles technologies, et modifiant le règlement (UE) no 582/2011
    en ce qui concerne les règles applicables à la détermination des émissions
    de CO2 et de la consommation de carburant afin d’obtenir l’extension d’une
    réception UE par type
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2025/258 der Kommission vom 7. Februar 2025 zur Änderung
    der Verordnung (EU) 2017/2400 hinsichtlich der Bestimmung der CO2-Emissionen und
    des Kraftstoffverbrauchs von mittelschweren Lastkraftwagen, schweren Lastkraftwagen
    und schweren Bussen, zur Einbeziehung von mit Wasserstoff betriebenen Fahrzeugen
    und anderen neuen Technologien sowie zur Änderung der Verordnung (EU) Nr. 582/2011
    hinsichtlich der geltenden Vorschriften für die Bestimmung von CO2-Emissionen
    und des Kraftstoffverbrauchs zur Erlangung einer Erweiterung der EU-Typgenehmigung
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2025/258 на Комисията от 7 февруари
    2025 година за изменение на Регламент (ЕС) 2017/2400
    по отношение на определянето на емисиите на
    CO2 и разхода на гориво на камиони със средна
    товароподемност, тежкотоварни камиони и тежки
    автобуси и за включване на превозни средства,
    задвижвани с водород и други нови технологии
    и за изменение на Регламент (ЕС) № 582/2011 по отношение
    на приложимите правила относно определянето
    на емисиите на CO2 и разхода на гориво с цел получаване
    на разширение на ЕС одобрение на типа
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (EU) 2025/258 ze dne 7. února 2025, kterým se mění
    nařízení (EU) 2017/2400, pokud jde o stanovení emisí CO2 a spotřeby paliva
    u středně těžkých a těžkých nákladních vozidel a těžkých autobusů
    a zahrnutí vozidel poháněných vodíkem a dalších nových technologií, a
    kterým se mění nařízení (EU) č. 582/2011, pokud jde o použitelná pravidla
    pro stanovení emisí CO2 a spotřeby paliva za účelem získání rozšíření
    EU schválení typu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) 2025/258 af 7. februar 2025 om ændring af
    forordning (EU) 2017/2400 for så vidt angår bestemmelse af CO2-emissioner og
    brændstofforbrug for mellemstore og tunge lastbiler og tunge busser og for at
