    paliwa przez średnie i ciężkie samochody ciężarowe oraz ciężkie autobusy
    oraz w celu uwzględnienia pojazdów napędzanych wodorem i innych nowych technologii,
    a także zmieniające rozporządzenie (UE) nr 582/2011 w odniesieniu do obowiązujących
    przepisów dotyczących określania emisji CO2 i zużycia paliwa w celu uzyskania
    rozszerzenia homologacji typu UE
  type: main
