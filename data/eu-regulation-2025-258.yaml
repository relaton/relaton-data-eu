  script: Latn
  content: Uredba Komisije (EU) 2025/258 z dne 7. februarja 2025 o spremembi Uredbe
    (EU) 2017/2400 glede določitve emisij CO2 in porabe goriva pri srednjih in težkih
    tovornih vozilih in težkih avtobusih, o vključitvi vozil na vodik in na druge
    nove tehnologije ter o spremembi Uredbe (EU) št. 582/2011 glede pravil, ki se
    uporabljajo za določanje emisij CO2 in porabe goriva, za pridobitev razširitve
    EU-homologacije
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) 2025/258 de la Comisión, de 7 de febrero de 2025, por
    el que se modifica el Reglamento (UE) 2017/2400 en lo que respecta a la determinación
    de las emisiones de CO2 y el consumo de combustible de los camiones pesados y
    medios y los autobuses pesados, y a la inclusión de los vehículos que funcionan
    con hidrógeno y otras nuevas tecnologías, y por el que se modifica el Reglamento
    (UE) n.o 582/2011 en lo que respecta a las normas aplicables para la determinación
    de las emisiones de CO2 y el consumo de combustible a fin de obtener una extensión
    a una homologación de tipo UE
  type: main
