  script: Latn
  content: Uredba Komisije (EU) 2025/258 оd 7. veljače 2025. o izmjeni Uredbe (EU)
    2017/2400 s obzirom na utvrđivanje emisija CO2 i potrošnje goriva srednjih i
    teških kamiona i teških autobusa i uključivanja vozila s pogonom na vodik i
    drugih novih tehnologija te o izmjeni Uredbe (EU) br. 582/2011 s obzirom na primjenjiva
    pravila za utvrđivanje emisija CO2 i potrošnje goriva radi dobivanja proširenja
    EU homologacije tipa
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2025/258 rendelete (2025. február 7.) az (EU) 2017/2400
    rendeletnek a közepes és nehéz tehergépjárművek és nehéz autóbuszok CO2-kibocsátásának
    és tüzelőanyag-fogyasztásának meghatározása, valamint a hidrogénnel és
    más új technológiákkal működő járművek bevezetése tekintetében történő
    módosításáról, valamint az 582/2011/EU rendeletnek a CO2-kibocsátás és
    a tüzelőanyag-fogyasztás EU-típusjóváhagyás kiterjesztése érdekében
    történő meghatározására alkalmazandó szabályok tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (EU) 2025/258 della Commissione, del 7 febbraio 2025, che modifica
    il regolamento (UE) 2017/2400 per quanto riguarda la determinazione delle emissioni
    di CO2 e del consumo di carburante degli autocarri medi e pesanti e degli autobus
    pesanti e l’inclusione dei veicoli alimentati a idrogeno e altre nuove tecnologie
    e il regolamento (UE) n. 582/2011 per quanto riguarda le norme applicabili alla
    determinazione delle emissioni di CO2 e del consumo di carburante al fine di ottenere
    l’estensione di un’omologazione UE
  type: main
- language: lv
  script: Latn
