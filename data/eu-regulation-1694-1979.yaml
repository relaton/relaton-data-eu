title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1694/79 of 31 July 1979 re-establishing
    the levying of customs duties on lead-acid accumulators, falling within subheading
    85.04 A and originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1694/79 de la Commission, du 31 juillet 1979, portant
    rétablissement de la perception des droits de douane applicables aux accumulateurs
    électriques au plomb, de la sous-position 85.04 A du tarif douanier commun, originaires
    des pays en voie de développement, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1694/79 der Kommission vom 31. Juli 1979 zur Wiedereinführung
    des Zollsatzes für elektrische Blei-Akkumulatoren der Tarifstelle 85.04 A, mit
    Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3156/78
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1694/79 af 31. juli 1979 om genindførelse
    af opkrævning for elektriske blyakkumulatorer under underposition 85.04 A, som
    har oprindelse i udviklingslande og omfattes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1694/79 della Commissione, del 31 luglio 1979, che
    ripristina la riscossione dei dazi doganali applicabili agli accumulatori elettrici
    al piombo, della sottovoce 85.04 A della tariffa doganale comune, originari dei
    paesi in via di sviluppo beneficiari delle preferenze tariffarie previste dal
    regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1694/79 van de Commissie van 31 juli 1979 houdende
    wederinstelling van de heffing van de invoerrechten voor elektrische accumulatoren
    met loden platen, van post 85.04 A, van oorsprong uit de ontwikkelingslanden ten
    behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de Raad tariefpreferenties
    werden geopend
  type: main
