title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/1250 of 22 July 2019 making
    certain imports of tubes and pipes of ductile cast iron (also known as spheroidal
    graphite cast iron) originating in India subject to registration following the
    re-opening of the investigation in order to implement the judgments of 10 April
    2019, in cases T-300/16 and T-301/16, with regard to Implementing Regulations
    (EU) 2016/387 and (EU) 2016/388 imposing a definitive countervailing duty and
    a definitive anti-dumping duty on imports of tubes and pipes of ductile cast iron
    (also known as spheroidal graphite cast iron) originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/1250 de la Commission du 22 juillet 2019
    soumettant à enregistrement certaines importations de tubes et de tuyaux en fonte
    ductile (également dénommée «fonte à graphite sphéroïdal») originaires
    de l'Inde, à la suite de la réouverture de l'enquête afin de mettre en œuvre
    les arrêts du 10 avril 2019 dans les affaires T-300/16 et T-301/16 en ce qui
    concerne les règlements d'exécution (UE) 2016/387 et (UE) 2016/388 instituant
    un droit compensateur définitif et un droit antidumping définitif sur les importations
    de tubes et de tuyaux en fonte ductile (également dénommée «fonte à graphite
    sphéroïdal») originaires de l'Inde
  type: main
