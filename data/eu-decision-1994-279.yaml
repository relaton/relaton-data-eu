    n. 1, definito dal regolamento (CEE) n. 2052/88 del Consiglio, per il periodo
    1994-1999'
  type: main
- language: nl
  script: Latn
  content: '94/279/EG: Beschikking van de Commissie van 26 april 1994 tot vaststelling,
