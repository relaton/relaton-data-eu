title:
- language: en
  script: Latn
  content: '94/279/EC: Commission Decision of 26 April 1994 establishing the indicative
    allocation by Member State of the commitment appropriations from the Structural
    Funds for the agricultural part of Objective 5a except for those fields covered
    by Objective 1 as defined in Council Regulation (EEC) No 2052/88 for the period
    1994 to 1999'
  type: main
- language: fr
  script: Latn
  content: '94/279/CE: Décision de la Commission, du 26 avril 1994, établissant,
    pour la période 1994-1999, la répartition indicative par État membre des crédits
    d''engagement des Fonds structurels pour la partie agricole de l''objectif n°
    5 a) hors de l''objectif n° 1 tel que défini par le règlement (CEE) n° 2052/88
    du Conseil'
  type: main
- language: de
  script: Latn
  content: '94/279/EG: Entscheidung der Kommission vom 26. April 1994 mit Richtgrößen
    für die Aufteilung der Verpflichtungsermächtigungen der Strukturfonds auf die
    einzelnen Mitgliedstaaten im Rahmen des nicht unter Ziel 1 fallenden landwirtschaftlichen
    Teils von Ziel 5a, wie in der Verordnung (EWG) Nr. 2052/88 des Rates definiert,
    im Zeitraum 1994-1999'
  type: main
- language: da
  script: Latn
  content: '94/279/EF: Kommissionens beslutning af 26. april 1994 om fastsættelse
    for perioden 1994-1999 af den vejledende fordeling på medlemsstaterne af strukturfondenes
    forpligtelsesbevillinger for landbrugsdelen af mål nr. 5a i regioner uden for
    mål nr. 1 som fastlagt ved Rådets forordning (EØF) nr. 2052/88'
  type: main
- language: el
  script: Grek
  content: '94/279/ΕΚ: Απόφαση της Επιτροπής της 26ης Απριλίου
    1994 για τον καθορισμό, για την περίοδο 1994-1999,
    της ενδεικτικής κατανομής ανά κράτος μέλος
    των πιστώσεων ανάληψης υποχρεώσεων των διαρθρωτικών
    ταμείων για το γεωργικό μέρος του στόχου αριθ.
    5α) εκτός στόχου αριθ. 1, όπως έχει καθοριστεί
    από τον κανονισμό (ΕΟΚ) αριθ. 2052/88 του Συμβουλίου'
  type: main
- language: fi
