title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2036/90 of 16 July 1990 imposing a definitive
    anti-dumping duty on imports of ferroboron originating in Japan and definitively
    collecting the provisional anti-dumping duties imposed on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2036/90 du Conseil, du 16 juillet 1990, instituant un
    droit antidumping définitif sur les importations de ferrobore originaire du Japon
    et portant perception définitive du droit antidumping provisoire institué sur
    ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2036/90 des Rates vom 16. Juli 1990 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Ferrobor mit Ursprung
    in Japan und zur endgültigen Vereinnahmung der vorläufigen Zölle auf diese
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2036/90 af 16. juli 1990 om indførelse af
    en endelig antidumpingtold på importen af ferrobor med oprindelse i Japan og
    endelig opkrævning af den midlertidige antidumpingtold, der er indført på sådan
    import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2036/90 του Συμβουλίου
    της 16ης Ιουλίου 1990 για την επιβολή δασμού αντιντάμπινγκ
    στις εισαγωγές σιδηροβορίου καταγωγής Ιαπωνίας
    και για την οριστική είσπραξη των προσωρινών
    δασμών αντιντάμπινγκ που έχουν επιβληθεί σε
    αυτές τις εισαγωγές
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 2036/90, annettu 16 päivänä heinäkuuta 1990,
    lopullisen polkumyyntitullin käyttöön ottamisesta Japanista peräisin olevan
    ferroboorin tuonnissa ja tässä tuonnissa käyttöön otetun väliaikaisen polkumyyntitullin
    lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2036/90 del Consiglio, del 16 luglio 1990, che istituisce
    un dazio antidumping definitivo sulle importazioni di ferroboro originario del
    Giappone e che decide la riscossione definitiva dei dazi antidumping provvisori
    imposti su tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2036/90 van de Raad van 16 juli 1990 tot instelling
    van een definitief anti-dumpingrecht op de invoer van ferroboor van oorsprong
    uit Japan en tot definitieve inning van het op deze invoer ingestelde voorlopige
    anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2036/90 do Conselho, de 16 de Julho de 1990, que
    institui um direito anti-dumping definitivo sobre as importações de ferro-boro
    originário do Japão e que determina a cobrança definitiva do direito anti-
    dumping provisório instituído sobre aquelas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 2036/90 del Consejo, de 16 de julio de 1990, por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    ferroboro originario de Japón y por el que se perciben definitivamente los derechos
    antidumping provisionales establecidos sobre dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EEG) nr 2036/90 av den 16 juli 1990 om införande
    av en slutgiltig antidumpningstull för import av ferrobor med ursprung i Japan
    och om slutgiltigt uttag av den preliminära antidumpningstull som införts för
    sådan import
