title:
- language: en
  script: Latn
  content: '85/106/EEC: Commission Decision of 21 December 1984 authorizing the United
    Kingdom to apply intra-Community surveillance to imports of certain products falling
    within headings No 69.11 and No ex 69.12 of the Common Customs Tariff, originating
    in Romania (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/106/CEE: Décision de la Commission du 21 décembre 1984 autorisant
    le Royaume-Uni à instaurer une surveillance intracommunautaire de certains produits
    des positions 69.11 et ex 69.12 du tarif douanier commun originaires de Roumanie
    (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '85/106/EWG: Entscheidung der Kommission vom 21. Dezember 1984 mit der
    das Vereinigte Königreich ermächtigt wird, eine innergemeinschaftliche Überwachung
    der Einfuhren bestimmter aus Rumänien stammender Waren der Tarifnummern 69.11
    und ex 69.12 des Gemeinsamen Zolltarifs einzuführen (Nur der englische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/106/EØF: Kommissionens beslutning af 21. december 1984 om bemyndigelse
    af Det forenede Kongerige til at indføre tilsyn inden for Fællesskabet med visse
    varer, henhørende under pos. 69.11 og ex 69.12 i den fælles toldtarif, med oprindelse
    i Rumænien (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/106/ΕΟΚ: Απόφαση της Επιτροπής της 21ης
    Δεκεμβρίου 1984 για τη χορήγηση άδειας στο Ηνωμένο
    Βασίλειο να εφαρμόσει ενδοκοινοτική επίβλεψη
    των εισαγωγών ορισμένων προϊόντων των κλάσεων
    69.11 και ex 69.12 του Κοινού Δασμολογίου, καταγωγής
    Ρουμανίας (Το κείμενο στην αγγλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/106/CEE: Decisione della Commissione del 21 dicembre 1984 che autorizza
    il Regno Unito ad applicare misure di sorveglianza intracomunitaria a taluni prodotti
    delle voci 69.11 e ex 69.12 della tariffa doganale comune, originari della Romania
    (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/106/EEG: Beschikking van de Commissie van 21 december 1984 waarbij
    het Verenigd Koninkrijk machtiging wordt verleend tot instelling van een intracommunautair
    toezicht op bepaalde produkten van de posten 69.11 en ex 69.12 van het gemeenschappelijk
    douanetarief, van oorsprong uit Roemenië (Slechts de tekst in de Engelse taal
    is authentiek)'
  type: main
