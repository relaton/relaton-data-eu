id: EURegulation11871978
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1187/78 of 19 May 1978 repealing Regulation
    (EEC) No 2865/73 amending Regulation (EEC) No 1770/72 and drawing up the lists
    of agencies and laboratories which are empowered to issue the document accompanying
    wines for direct human consumption imported from third countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1187/78 de la Commission, du 19 mai 1978, abrogeant
    le règlement (CEE) n° 2865/73 modifiant le règlement (CEE) n° 1770/72 et établissant
    les listes des organismes et des laboratoires habilités à établir le document
    accompagnant les vins importés des pays tiers destinés à la consommation humaine
    directe
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1187/78 der Kommission vom 19. Mai 1978 zur Aufhebung
    der Verordnung (EWG) Nr. 2865/73 zur Änderung der Verordnung (EWG) Nr. 1770/72
    und zur Aufstellung der Verzeichnisse der Stellen und Laboratorien, die zur Ausstellung
    des Dokuments befugt sind, das aus Drittländern eingeführten und zum unmittelbaren
    menschlichen Verbrauch bestimmten Wein begleiten muß
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1187/78 af 19. maj 1978 om ophævelse
    af forordning (EØF) nr. 2865/73 om ændring af forordning (EØF) nr. 1770/72
    om oprettelse af lister over de organer og laboratorier, som er berettigede til
    at udstede den attest, der skal ledsage vin, der fra tredjelande er indført til
    direkte menneskeligt forbrug
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1187/78 della Commissione, del 19 maggio 1978, che
    abroga il regolamento (CEE) n. 2865/73 che modifica il regolamento (CEE) n. 1770/72
    e stabilisce gli elenchi degli organismi e dei laboratori abilitati ad emettere
    il documento che accompagna i vini importati in provenienza dai paesi terzi destinati
    al consumo umano diretto
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1187/78 van de Commissie van 19 mei 1978 tot intrekking
    van Verordening (EEG) nr. 2865/73 houdende wijziging van Verordening (EEG) nr.
    1770/72 en houdende vaststelling van de lijsten der instanties en laboratoria
    die bevoegd zijn om het document op te stellen dat uit derde landen ingevoerde
    wijn bestemd voor rechtstreekse menselijke consumptie vergezelt
  type: main
