title:
- language: en
  script: Latn
  content: '89/562/EEC: Commission Decision of 18 October 1989 making an initial allocation
    to France of part of the resources to be charged to the 1990 budget year for the
    supply of food from intervention stocks to designated organizations for distribution
    to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '89/562/CEE: Décision de la Commission du 18 octobre 1989 allouant à
    la France une première tranche des ressources imputables à l''exercice 1990
    pour la fourniture de denrées alimentaires provenant des stocks d''intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 18. Oktober 1989 über die anfängliche
    Bewilligung eines Teils der im Haushaltsjahr 1990 für die Zurverfügungstellung
    von Nahrungsmitteln aus Interventionsbeständen an bezeichnete Organisationen
    zur Verteilung an bedürftige Personen in der Gemeinschaft zu verbuchenden Mittel
    für Frankreich (89/562/EWG) (89/562/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 18. oktober 1989 om en første tildeling til
    Frankrig af en del af de midler, der skal opføres på 1990-budgettet for levering
    af levnedsmidler fra interventionslagre til nærmere bestemte organisationer med
    henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet
    (89/562/EØF) (89/562/EØF) #'
  type: main
- language: el
  script: Grek
  content: '89/562/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Οκτωβρίου 1989 για τη χορήγηση στη Γαλλία μιας
    πρώτης μερίδας πόρων που καταλογίζονται στο
    οικονομικό έτος 1990 για την προμήθεια τροφίμων
    που προέρχονται από τα αποθέματα της παρέμβασης
    στους οργανισμούς που έχουν οριστεί για να
    τα διανείμουν στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 18 ottobre 1989 concernente un primo stanziamento
    alla Francia di parte delle risorse da imputare all'' anno di bilancio 1990 per
    la fornitura a talune organizzazioni di derrate alimentari provenienti dalle scorte
    d'' intervento e destinate ad essere distribuite agli indigenti nella Comunità
    (89/562/CEE) (89/562/CEE) #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 18 oktober 1989 houdende een eerste toewijzing
    aan Frankrijk van een deel van voor het begrotingsjaar 1990 te boeken financiële
    middelen voor de levering van voedsel uit interventievoorraden aan organisaties
    die zijn aangewezen voor de verstrekking ervan aan behoeftigen in de Gemeenschap
    (89/562/EEG) (89/562/EEG) #'
  type: main
- language: pt
  script: Latn
  content: DECISAO DA COMISSAO de 18 de Outubro de 1989 relativa à afectaçao inicial
    à França de parte dos recursos a imputar ao exercicio orçamental de 1990 para
    o fornecimento de alimentos provenientes de existências de intervençao às organizaçoes
    designadas para distribuiçao às pessoas mais necessitadas na Comunidade (89/562/CEE)
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 18 de octubre de 1989 por la que se adjudica
    inicialmente a Francia parte de los recursos con cargo al presupuesto del ejercicio
    1990 destinados al suministro de alimentos procedentes de las existencias de intervención
    a determinadas organizaciones para su distribución entre las personas más necesitadas
    de la Comunidad (89/562/CEE) (89/562/CEE) #'
