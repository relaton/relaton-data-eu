    des fils, ficelles, cordes ou cordages, de la catégorie de produits n° 98 (numéro
    d' ordre 40.0980), originaires de Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
