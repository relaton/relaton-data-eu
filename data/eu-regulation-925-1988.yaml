  content: Commission Regulation (EEC) No 925/88 of 6 April 1988 re-establishing the
    levying of customs duties on articles made from yarn, twine, cordage, rope or
    cables, products of category 98 (order number 40.0980), originating in South Korea
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 925/88 de la Commission du 6 avril 1988 portant rétablissement
