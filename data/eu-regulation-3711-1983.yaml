    Ausfuhr von im Besitz der deutschen Interventionsstelle befindlichem Brotweizen
    auf 400 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3711/83 af 23. december 1983 om ændring
