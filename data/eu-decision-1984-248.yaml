title:
- language: en
  script: Latn
  content: '84/248/EEC: Commission Decision of 24 April 1984 authorizing the Federal
    Republic of Germany to adopt, when introducing into its territory plants or plant
    products, special plant health provisions laid down for home-grown production
    of certain fruit plants intended for planting (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/248/CEE: Décision de la Commission du 24 avril 1984 autorisant la
    République fédérale d''Allemagne à arrêter, lors de l''introduction sur son
    territoire de végétaux ou de produits végétaux, des dispositions phytosanitaires
    fixées pour la production indigène de certains végétaux d''espèces fruitières
    destinés à être plantés (Le texte en langue allemande est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '84/248/EWG: Entscheidung der Kommission vom 24. April 1984 zur Ermächtigung
    der Bundesrepublik Deutschland, beim Verbringen von Pflanzen oder Pflanzenerzeugnissen
    in ihr Gebiet besondere Pflanzenschutzmaßnahmen zu treffen, die für die einheimische
    Erzeugung von einigen zum Anpflanzen bestimmten Obstpflanzen vorgesehen sind (Nur
    der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/248/EØF: Kommissionens beslutning af 24. april 1984 om bemyndigelse
    af Forbundsrepublikken Tyskland til for planter og planteprodukter, der indføres
    på dens område, at anvende de særlige plantesundhedsbestemmelser, som er gældende
    for den indenlandske produktion af visse frugtbærende planter bestemt til udplantning
    (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '84/248/ΕΟΚ: Απόφαση της Επιτροπής της 24ης
    Απριλίου 1984 με την οποία εξουσιοδοτείται η
    Ομοσπονδιακή Δημοκρατία της Γερμανίας να θεσπίσει,
    κατά την εισαγωγή στο έδαφός της φυτών και
    φυτικών προϊόντων, φυτοϋγειονομικά μέτρα που
    έχουν θεσπισθεί για την εγχώρια παραγωγή ορισμένων
    οπωροφόρων που προορίζονται για φύτευση (Το
    κείμενο στην γερμανική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '84/248/CEE: Decisione della Commissione del 24 aprile 1984 che autorizza
    la Repubblica federale di Germania ad adottare, all''atto dell''introduzione nel
    suo territorio di vegetali o prodotti vegetali, disposizioni fitosanitarie particolari
    previste per la produzione locale di determinati vegetali da frutto destinati
    alla piantagione (Il testo in lingua tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '84/248/EEG: Beschikking van de Commissie van 24 april 1984 tot machtiging
    van de Bondsrepubliek Duitsland om, bij het binnenbrengen op zijn grondgebied
    van planten of plantaardige produkten, de bijzondere fytosanitaire maatregelen
    toe te passen, die voor de binnenlandse produktie van plantgoed van bepaalde,
    voor opplant bestemde fruitgewassen gelden (Slechts de tekst in de Duitse taal
    is authentiek)'
  type: main
- language: es
  script: Latn
  content: '84/248/CEE: Decisión de la Comisión de 24 de abril de 1984 por la que
    se autoriza a la República Federal de Alemania a adoptar, en el momento de la
    introducción en su territorio de vegetales o de productos vegetales, disposiciones
    fitosanitarias establecidas para la producción autóctona de determinados vegetales
    de especies frutales destinados a ser plantados (El texto en lengua tedesca es
    el único auténtico)'
