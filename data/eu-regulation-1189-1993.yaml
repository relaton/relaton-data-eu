  content: Council Regulation (EEC) No 1189/93 of 14 May 1993 imposing definitive
    anti-dumping duties on imports of certain seamless pipes and tubes, of iron or
    non-alloy steel, originating in Hungary, Poland and the Republic of Croatia and
    definitively collecting provisional anti- dumping duties
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1189/93 du Conseil, du 14 mai 1993, instituant des
    droits antidumping définitifs sur les importations de certains tubes et tuyaux
    sans soudure, en fer ou en acier non allié, originaires de Hongrie, de Pologne
    et de la République de Croatie, et portant perception définitive des droits
    antidumping provisoires
  type: main
