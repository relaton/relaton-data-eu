title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2516/83 of 7 September 1983 fixing for the
    1983/84 marketing year the Community offer prices for sweet oranges applicable
    as regards Greece and the coefficients to be used to calculate the offer prices
    for Greek oranges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2516/83 de la Commission du 7 septembre 1983 fixant,
    pour la campagne 1983/1984, le prix d' offre communautaire des oranges douces
    applicable vis-à-vis de la Grèce ainsi que les coefficients à appliquer pour
    le calcul du prix d' offre du produit grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2516/83 der Kommission vom 7. September 1983 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Süßorangen gegenüber Griechenland
    sowie der zur Berechnung des Angebotspreises für das griechische Erzeugnis anzuwendenden
    Koeffizienten für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2516/83 af 7. september 1983 om fastsættelse
    for høståret 1983/84 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på appelsiner samt af koefficienterne for beregningen af tilbudsprisen på det
    græske produkt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2516/83 της Επιτροπής
    της 7ης Σεπτεμβρίου 1983 περί καθορισμού, για
    την περίοδο εμπορίας 1983/84, κοινοτικής τιμής
    προσφοράς για τα γλυκά πορτοκάλια η οποία εφαρμόζεται
    έναντι της Ελλάδας, καθώς και των συντελεστών
    που πρέπει να εφαρμόζονται για τον υπολογισμό
    της τιμής προσφοράς του ελληνικού προϊόντος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2516/83 della Commissione del 7 settembre 1983 che
    fissa, per la campagna 1983/1984, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per le arance dolci, nonché i coefficienti da utilizzare
    per il calcolo del prezzo d' offerta del prodotto ellenico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2516/83 van de Commissie van 7 september 1983 tot
    vaststelling, voor het verkoopseizoen 1983/1984, van de ten aanzien van Griekenland
    toe te passen communautaire aanbiedingsprijs voor zoete sinaasappelen en van de
    voor de berekening van de aanbiedingsprijs van het Griekse produkt toe te passen
    coëfficiënten
