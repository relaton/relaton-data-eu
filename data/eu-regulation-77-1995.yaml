title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 77/95 of 18 January 1995 determining the
    extent to which applications lodged in January 1995 for import licences for certain
    milk products and products covered by the arrangements provided for in the Europe
    Agreements concluded by the Community with the Republic of Poland and the Republic
    of Hungary and the Interim Agreement concluded with the Czech Republic and the
    Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 77/95 DE LA COMMISSION du 18 janvier 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    janvier 1995 pour certains produits dans le secteur du lait et des produits laitiers
    dans le cadre du régime prévu par les accords européens conclus par la Communauté
    avec la république de Pologne, la république de Hongrie et par l'accord intérimaire
    conclu avec la République tchèque et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 77/95 DER KOMMISSION vom 18. Januar 1995 zur Festsetzung
    des Umfangs, in dem die Lizenzen genehmigt werden können, die im Januar 1995
    für die Einfuhr von Milch und Milcherzeugnissen gemäß den zwischen der Gemeinschaft
    und der Republik Polen und der Republik Ungarn geschlossenen Europa-Abkommen sowie
    dem mit der Tschechischen Republik und der Slowakischen Republik geschlossenen
    Interimsabkommen beantragt wurden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 77/95 af 18. januar 1995 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser indsendt i januar 1995 for
    visse produkter i sektoren for mælk og mejeriprodukter kan imødekommes under
    den ordning, der er fastsat i Europaaftalerne mellem Fællesskabet og Republikken
    Polen, Republikken Ungarn og i interimsaftalerne med Den Tjekkiske Republik og
    Den Slovakiske Republik
  type: main
