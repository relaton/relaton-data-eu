    Eslovaca
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 77/95 av den 18 januari 1995 om fastställande
    av i vilken utsträckning det är möjligt att godkänna ansökningar, som har
    lämnats in i januari 1995, om importlicenser för vissa mjölkprodukter och produkter
