  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 77/95 DE LA COMISIÓN de 18 de enero de 1995 por el
    que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación presentadas en enero de 1995 de algunos productos del sector de
    la leche y los productos lácteos al amparo del régimen previsto en los Acuerdos
