    directive 68/193/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '98/99/EG: Entscheidung der Kommission vom 26. Januar 1998 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend Vermehrungsgut von Reben zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 68/193/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '98/99/EF: Kommissionens beslutning af 26. januar 1998 om bemyndigelse
