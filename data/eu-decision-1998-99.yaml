    της αμπέλου που δεν πληροί τις απαιτήσεις της
    οδηγίας 68/193/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '98/99/EY: Komission päätös, tehty 26 päivänä tammikuuta 1998, luvan
