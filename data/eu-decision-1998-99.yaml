title:
- language: en
  script: Latn
  content: '98/99/EC: Commission Decision of 26 January 1998 authorising the Member
    States to permit temporarily the marketing of vine propagating material not satisfying
    the requirements of Council Directive 68/193/EEC'
  type: main
- language: fr
  script: Latn
  content: '98/99/CE: Décision de la Commission du 26 janvier 1998 autorisant les
