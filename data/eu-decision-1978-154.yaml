title:
- language: en
  script: Latn
  content: '78/154/EEC: Commission Decision of 22 December 1977 authorizing the United
    Kingdom to take certain protective measures under Article 108 (3) of the EEC Treaty
    and repealing Decision 75/487/EEC (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '78/154/CEE: Décision de la Commission, du 22 décembre 1977, autorisant
    le Royaume-Uni à prendre certaines mesures de sauvegarde au titre de l''article
    108 paragraphe 3 du traité CEE et abrogeant la décision 75/487/CEE (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '78/154/EWG: Entscheidung der Kommission vom 22. Dezember 1977 zur Ermächtigung
    des Vereinigten Königreichs, bestimmte Schutzmaßnahmen nach Artikel 108 Absatz
    3 des EWG-Vertrags zu treffen, und zur Aufhebung der Entscheidung 75/487/EWG (Nur
    der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '78/154/EØF: Kommissionens beslutning af 22. december 1977 om bemyndigelse
    til Det Forenede Kongerige til at træffe visse beskyttelsesforanstaltninger i
    henhold til traktatens artikel 108, stk. 3, og om ophævelse af beslutning 75/487/EØF
    (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '78/154/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Δεκεμβρίου 1977 περί παροχής αδείας στο Ηνωμένο
    Βασίλειο να λάβει ορισμένα μέτρα διασφαλίσεως
    βάσει του άρθρου 108 παράγραφος 3 της συνθήκης
    ΕΟΚ και περί καταργήσεως της αποφάσεως 75/487/ΕΟΚ
    (Το κείμενο στην αγγλική γλώσσα είναι το μόνο
    αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '78/154/CEE: Decisione della Commissione, del 22 dicembre 1977, che sostituisce
    la decisione del 23 luglio 1975 ed autorizza il Regno Unito a prendere talune
    misure di salvaguardia ai sensi dell''articolo 108, paragrafo 3, del trattato
    CEE (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '78/154/EEG: Beschikking van de Commissie van 22 december 1977 tot machtiging
    van het Verenigd Koninkrijk bepaalde vrijwaringsmaatregelen te nemen overeenkomstig
    artikel 108, lid 3, van het Verdrag en tot intrekking van Beschikking 75/487/EEG
    (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
- language: es
  script: Latn
  content: '78/154/CEE: Decisión de la Comisión, de 22 de diciembre de 1977, por
    la que se autoriza al Reino Unido a adoptar determinadas medidas de salvaguardia
    con arreglo al apartado 3 del artículo 108 del Tratado de la CEE y por la que
    se deroga la Decisión 75/487/CEE (El texto en lengua inglesa es el único auténtico)'
