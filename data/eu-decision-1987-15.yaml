title:
- language: en
  script: Latn
  content: '87/15/EEC: Commission Decision of 19 February 1986 on the compatibility
    with the common market of aid under the German Federal/Land Government Joint Regional
    Aid Programme (Joint Programme for the improvement of regional economic structures)
    in six labour market regions (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/15/CEE: Décision de la Commission du 19 février 1986 sur la compatibilité
    avec le marché commun de l''octroi d''aides régionales dans six bassins d''emploi
    cités au titre de la tâche d''intérêt commun «Amélioration des structures
    économiques régionales» (Le texte en langue allemande est le seul faisant foi)'
  type: main
- language: de
  script: Latn
