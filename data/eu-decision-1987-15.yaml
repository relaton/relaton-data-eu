    Vereinbarkeit der Vergabe von regionalen Beihilfen mit dem Gemeinsamen Markt in
    sechs nach der Gemeinschaftsaufgabe "Verbesserung der regionalen Wirtschaftsstruktur"
    geförderten Arbeitsmarktregionen (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/15/EØF: Kommissionens beslutning af 19. februar 1986 om foreneligheden
