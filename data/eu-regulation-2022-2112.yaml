    no que diz respeito às normas técnicas de regulamentação que especificam os
    requisitos e as disposições relativos ao pedido de autorização como prestador
    de serviços de financiamento colaborativo
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2112 al Comisiei din 13 iulie 2022 de completare
    a Regulamentului (UE) 2020/1503 al Parlamentului European și al Consiliului în
    ceea ce privește standardele tehnice de reglementare care precizează cerințele
    și modalitățile pentru cererea de autorizare ca furnizor de servicii de finanțare
    participativă
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2112 z 13. júla 2022, ktorým
