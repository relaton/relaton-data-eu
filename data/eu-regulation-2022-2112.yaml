    standardi, v katerih so določeni zahteve in pogoji za vlogo za pridobitev dovoljenja
    kot ponudnik storitev množičnega financiranja
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2112 de la Comisión de 13 de julio de 2022
