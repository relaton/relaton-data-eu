    w odniesieniu do regulacyjnych standardów technicznych określających wymogi
    i zasady dotyczące wniosku o udzielenie zezwolenia na prowadzenie działalności
    jako dostawca usług finansowania społecznościowego
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2112 da Comissão de 13 de julho de 2022
