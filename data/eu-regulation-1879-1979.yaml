title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1879/79 of 24 August 1979 re-establishing
    the levying of customs duties on locks and padlocks (key, combination or electrically
    operated), etc., falling within heading No 83.01 and originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1879/79 de la Commission, du 24 août 1979, portant
    rétablissement de la perception des droits de douane applicables aux serrures
    (y compris les fermoirs et montures-fermoirs comportant une serrure, etc. de la
    position 83.01 du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1879/79 der Kommission vom 24. August 1979 zur Wiedereinführung
    des Zollsatzes für Schlösser (einschließlich Verschlüsse und Verschlußbügel
    mit Schloß) usw., der Tarifnummer 83.01, mit Ursprung in Singapur, dem die in
    der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1879/79 af 24. august 1979 om genindførelse
    af opkrævning af toldafgifter for nøglelåse (herunder spænder og taskebøjler
    med sådanne låse), etc., under pos. 83.01, som har oprindelse i Singapore og
    omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr.
    3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1879/79 della Commissione, del 24 agosto 1979, che
    repristina la riscossione dei dazi doganali applicabili alle serrature (compresi
    i fermagli e le montature a fermaglio comportanti una serratura), ecc., della
    voce 83.01 della tariffa doganale comune, originarie di Singapore beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1879/79 van de Commissie van 24 augustus 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sloten (van
    een slot voorziene sluitingen en sluitbeugels daaronder begrepen) enz., van post
    83.01, van oorsprong uit Singapore ten behoeve waarvan bij Verordening (EEG) nr.
    3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
