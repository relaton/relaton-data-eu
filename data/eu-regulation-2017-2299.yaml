    (ES) č. 2036/2005, (ES) č. 1200/2005 a prováděcího nařízení (EU) č. 413/2013
    (držitel povolení společnost Danstar Ferment AG, zastoupená společností
    Lallemand SAS)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/2299 af 12. december
    2017 om godkendelse af et præparat af Pediococcus acidilactici CNCM MA 18/5M
    som tilsætningsstof til foder til slagtesvin, mindre udbredte svinearter (fravænnede
