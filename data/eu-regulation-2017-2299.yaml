  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/2299 на Комисията
    от 12 декември 2017 година за разрешаване на препарат
    от Pediococcus acidilactici CNCM MA 18/5M като фуражна добавка
    за прасета за угояване, видове свине с по-малко
    стопанско значение, отбити и за угояване, пилета
