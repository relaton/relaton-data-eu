    носачки, за разрешаване на посочената фуражна
    добавка за употреба във вода за пиене и за изменение
    на регламенти (ЕО) № 2036/2005, (ЕО) № 1200/2005 и Регламент
    за изпълнение (ЕС) № 413/2013 (притежател на разрешението
    Danstar Ferment AG, представлявано от Lallemand SAS)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/2299 ze dne 12. prosince 2017
    o povolení přípravku Pediococcus acidilactici CNCM MA 18/5M jako doplňkové
    látky pro výkrm prasat, menšinové druhy prasat (po odstavu a na výkrm), výkrm
    kuřat, výkrm menšinových druhů drůbeže, nosnice menšinových druhů drůbeže,
