title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/2299 of 12 December 2017 concerning
    the authorisation of a preparation of Pediococcus acidilactici CNCM MA 18/5M as
    a feed additive for pigs for fattening, minor porcine species (weaned and for
    fattening), chickens for fattening, minor poultry species for fattening and minor
    poultry species for laying, the authorisation of that feed additive for use in
    water for drinking and amending Regulations (EC) No 2036/2005, (EC) No 1200/2005
    and Implementing Regulation (EU) No 413/2013 (holder of authorisation Danstar
    Ferment AG represented by Lallemand SAS)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2017/2299 de la Commission du 12 décembre
    2017 concernant l''autorisation d''une préparation de Pediococcus acidilactici
    CNCM MA 18/5M en tant qu''additif pour l''alimentation des porcs d''engraissement,
    des espèces porcines mineures (sevrées et destinées à l''engraissement), des
    poulets d''engraissement, des espèces aviaires mineures destinées à l''engraissement
    et des espèces aviaires mineures élevées pour la ponte, concernant l''autorisation
    de ladite préparation en tant qu''additif pour l''alimentation animale à utiliser
    dans l''eau destinée à l''abreuvement, et modifiant les règlements (CE) n°
    2036/2005 et (CE) n° 1200/2005 et le règlement d''exécution (UE) n° 413/2013
    (titulaire de l''autorisation: Danstar Ferment AG, représenté par Lallemand
    SAS)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2017/2299 der Kommission vom 12. Dezember
    2017 zur Zulassung einer Zubereitung aus Pediococcus acidilactici CNCM MA 18/5M
    als Zusatzstoff in Futtermitteln für Mastschweine, Schweinearten von geringerer
    wirtschaftlicher Bedeutung (abgesetzt und für die Mast), Masthühner, Mast- und
    Legegeflügelarten von geringerer wirtschaftlicher Bedeutung, zur Zulassung dieses
    Futtermittelzusatzstoffs für die Verwendung in Tränkwasser sowie zur Änderung
    der Verordnungen (EG) Nr. 2036/2005, (EG) Nr. 1200/2005 und der Durchführungsverordnung
    (EU) Nr. 413/2013 (Zulassungsinhaber: Danstar Ferment AG, vertreten durch Lallemand
    SAS)'
  type: main
