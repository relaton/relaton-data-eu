  content: Commission Regulation (EEC) No 1707/93 of 30 June 1993 amending Regulations
    (EEC) No 131/92, (EEC) No 1695/92 and (EEC) No 1696/92 as regards the operative
    event for the agricultural conversion rate applicable to the specific measures
    for the supply of products to the French overseas departments, the Canary Islands
    and the Azores and Madeira
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1707/93 de la Commission du 30 juin 1993 modifiant
    les règlements (CEE) n° 131/92, (CEE) n 1695/92 et (CEE) n° 1696/92 en ce qui
    concerne le fait générateur du taux de conversion agricole applicable dans le
    cadre des régimes d'approvisionnement spécifiques des départements français
    d'outre-mer, des îles Canaries, et des Açores et de Madère
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1707/93 der Kommission vom 30. Juni 1993 zur Änderung
    der Verordnungen (EWG) Nr. 131/92, (EWG) Nr. 1695/92 und (EWG) Nr. 1696/92 in
    Bezug auf den maßgeblichen Tatbestand für den anwendbaren landwirtschaftlichen
    Umrechnungskurs im Rahmen der Sonderversorgungsregelungen für die französischen
    überseeischen Departements, die Kanarischen Inseln, die Azoren und Madeira
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1707/93 af 30. juni 1993 om ændring
    af forordning (EØF) nr. 131/92, (EØF) nr. 1695/92 og (EØF) nr. 1696/92 for
    så vidt angår den udløsende begivenhed for den landbrugsomregningskurs, der
    finder anvendelse på de særlige forsyningsordning for de oversøiske franske
    departementer, De Kanariske Øer, Azorerne og Madeira
  type: main
- language: el
  script: Grek
