    Ranskan merentakaisten departementtien, Kanariansaarten sekä Azorien ja Madeiran
    erityisissä hankintajärjestelmissä sovellettavan maatalouden muuntokurssin
    määräytymisperusteen osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1707/93 della Commissione del 30 giugno 1993 che modifica
    i regolamenti (CEE) n. 131/92, (CEE) n. 1695/92 e (CEE) n. 1696/92 per quanto
    riguarda il fatto generatore del tasso di conversione agricolo applicabile nell'ambito
    dei regimi d'approvvigionamento specifici dei dipartimenti francesi d'oltremare,
    delle isole Canarie e delle Azzorre e Madera
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1707/93 van de Commissie van 30 juni 1993 tot wijziging
