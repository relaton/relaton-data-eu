    de Azoren en Madeira geldende landbouwomrekeningskoers
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1707/93 da Comissão de 30 de Junho de 1993 que altera
    os regulamentos (CEE) nº 131/92, (CEE) nº 1695/92 e (CEE) nº 1696/92 no que
    se refere ao facto gerador da taxa de conversão agrícola aplicável no âmbito
    dos regimes específicos de abastecimento dos departamentos franceses ultramarinos,
    das ilhas Canárias e dos Açores e da Madeira
  type: main
