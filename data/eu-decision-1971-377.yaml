title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 5 novembre 1971, autorisant la République
    française à exclure du traitement communautaire les lampes électriques portatives
    destinées à fonctionner au moyen de leur propre source d'énergie (à piles,
    à accumulateurs, électromagnétiques, etc.) de la position 85.10 B du Tarif
    douanier commun, originaires de Hong-Kong et mises en libre pratique dans les
    autres États membres
  type: main
- language: de
  script: Latn
  content: '71/377/EWG: Entscheidung der Kommission vom 5. November 1971 zur Ermächtigung
    der Französischen Republik, tragbare elektrische Leuchten zum Betrieb mit eigener
    Stromquelle (z.B. mit Primärbatterien, Akkumulatoren oder Dynamo) der Tarifnummer
    85.10 B des Gemeinsamen Zolltarifs mit Ursprung in Hongkong, die sich in den übrigen
    Mitgliedstaaten im freien Verkehr befinden, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/377/CEE: Decisione della Commissione, del 5 novembre 1971, con cui
    si autorizza la Repubblica francese a escludere dal trattamento comunitario le
    lampade elettriche portatili destinate a funzionare a mezzo di una propria sorgente
    di energia la pile, ad accumulatori, elettromagnetiche, ecc.), della voce 85.10
    B della tariffa doganale comune, originarie di Hong Kong e messe in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/377/EEG: Beschikking van de Commissie van 5 november 1971 waarbij de
    Franse Republiek wordt gemachtigd draagbare elektrische lampen, bestemd om met
    eigen energiebron te werken (met elementen of batterijen, met accumulatoren, met
    ingebouwde dynamo, enz.) van post 85.10 B van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
