title:
- language: en
  script: Latn
  content: '83/523/EEC: Commission Decision of 11 October 1983 authorizing the French
    Republic to apply intra-Community surveillance to imports of certain woven fabrics
    of synthetic textile fibres, originating in Indonesia, which have been put into
    free circulation in the Community (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/523/CEE: Décision de la Commission du 11 octobre 1983 autorisant la
    République française à procéder à une surveillance intracommunautaire des
    importations de certains tissus de fibres textiles synthétiques originaires d''Indonésie
    et mis en libre pratique dans la Communauté (Le texte en langue française est
    le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '83/523/EWG: Entscheidung der Kommission vom 11. Oktober 1983 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren bestimmter aus Indonesien stammender und in der Gemeinschaft im
    freien Verkehr befindlicher Gewebe aus synthetischen Spinnfasern (Nur der französische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/523/EØF: Kommissionens beslutning af 11. oktober 1983 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførslen
    af visse vævede stoffer af syntetiske fibre, der har oprindelse i Indonesien
    og er overgået til fri omsætning i Fællesskabet (Kun den franske udgave er
    autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/523/ΕΟΚ: Απόφαση της Επιτροπής της 11ης
    Οκτωβρίου 1983 για τη χορήγηση άδειας στη Γαλλική
    Δημοκρατία να προβεί σε ενδοκοινοτική επιτήρηση
    των εισαγωγών ορισμένων υφασμάτων εκ συνθετικών
    υφαντικών ινών, καταγωγής Ινδονησίας, που τίθενται
    σε ελεύθερη κυκλοφορία στην Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/523/CEE: Decisione della Commissione dell''11 ottobre 1983 che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni tessuti di fibre tessili sintetiche originari dell''Indonesia e messi
    in libera pratica nella Comunità (Il testo in lingua francese è il solo facente
    fede)'
  type: main
- language: nl
  script: Latn
  content: '83/523/EEG: Beschikking van de Commissie van 11 oktober 1983 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van bepaalde weefsels van synthetische stapelvezels
    van oorsprong uit Indonesië die in de Gemeenschap in het vrije verkeer zijn gebracht
    (Slechts de tekst in de Franse taal is authentiek)'
  type: main
