title:
- language: en
  script: Latn
  content: '81/320/EEC: Commission Decision of 29 April 1981 establishing that the
    apparatus described as ''ORTEC- economical energy dispersive spectrometer, model
    EEDS II, with Si (Li) X-ray detector, model 7880-S-449'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/320/CEE: Décision de la Commission, du 29 avril 1981, constatant que
    l''importation de l''appareil dénommé "Ortec-Economical Energy Dispersive Spectrometer,
    model EEDS II, with Si (Li) X-ray detector, model 7880-S-449" ne peut être faite
    en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
