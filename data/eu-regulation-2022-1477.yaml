title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1477 of 6 September 2022 extending
    the definitive anti-dumping duty imposed by Implementing Regulation (EU) 2020/492,
    as amended by Implementing Regulation (EU) 2020/776, on imports of certain woven
    and/or stitched glass fibre fabrics originating in the People’s Republic of
    China and Egypt to imports of certain woven and/or stitched glass fibre fabrics
    consigned from Turkey, whether declared as originating in Turkey or not
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1477 de la Commission du 6 septembre
    2022 portant extension du droit antidumping définitif institué par le règlement
    d’exécution (UE) 2020/492, tel que modifié par le règlement d’exécution
    (UE) 2020/776, sur les importations de certains tissus en fibres de verre tissées
    et/ou cousues originaires de la République populaire de Chine et d’Égypte
    aux importations de certains tissus en fibres de verre tissées et/ou cousues
    expédiés de Turquie, qu’ils aient ou non été déclarés originaires de ce
    pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1477 der Kommission vom 6. September
    2022 zur Ausweitung des mit der Durchführungsverordnung (EU) 2020/492 in der
    durch die Durchführungsverordnung (EU) 2020/776 geänderten Fassung eingeführten
    endgültigen Antidumpingzolls gegenüber den Einfuhren bestimmter gewebter und/oder
    genähter Erzeugnisse aus Glasfasern mit Ursprung in der Volksrepublik China und
    Ägypten auf die aus der Türkei versandten Einfuhren bestimmter gewebter und/oder
    genähter Erzeugnisse aus Glasfasern, ob als Ursprungserzeugnisse der Türkei
    angemeldet oder nicht
  type: main
