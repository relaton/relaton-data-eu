title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2604/71 of the Commission of 6 December 1971 amending
    for the second time Regulation (EEC) No 1013/71 as regards the observance of certain
    import prices in connection with the application of compensatory amounts introduced
    in agriculture following the monetary measures taken by certain Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2604/71 de la Commission, du 6 décembre 1971, portant
    deuxième modification du règlement (CEE) n° 1013/71 en ce qui concerne le respect
    de certains prix à l'importation lors de l'application de montants compensatoires
    instaurés dans le secteur agricole à la suite des mesures monétaires de certains
    États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2604/71 der Kommission vom 6. Dezember 1971 zur zweiten
    Änderung der Verordnung (EWG) Nr. 1013/71 über die Einhaltung bestimmter Einfuhrpreise
    bei der Anwendung von Ausgleichsbeträgen in der Landwirtschaft im Anschluß an
    die Währungsmaßnahmen einiger Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2604/71 af 6. december 1971 om anden
    ændring af forordning (EØF) nr. 1013/71 for så vidt angår opretholdelse af
    visse importpriser ved anvendelse af udligningsbeløb inden for landbruget i tilslutning
    til visse medlemsstaters monetære forholdsregler
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2604/71 della Commissione, del 6 dicembre 1971, recante
    seconda modifica del regolamento (CEE) n. 1013/71 per quanto concerne l'osservanza
    di alcuni prezzi all'importazione in sede di applicazione di importi di compensazione
    istituiti nel settore agricolo in seguito a misure monetarie di alcuni Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2604/71 van de Commissie van 6 december 1971 houdende
    tweede wijziging van Verordening (EEG) nr. 1013/71 voor wat betreft de inachtneming
    van bepaalde prijzen bij de invoer in het kader van de toepassing van de compenserende
    bedragen die in de landbouwsector naar aanleiding van de monetaire maatregelen
    van sommige Lid-Staten zijn ingevoerd
  type: main
