title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1999/2005 of 7 December 2005 fixing the quantities
    for which applications for import licences can be lodged in respect of the period
    from 1 January to 30 June 2006 under the tariff quotas for beef and veal provided
    for in Council Regulation (EC) No 1279/98 for Bulgaria and Romania
  type: main
- language: fr
  script: Latn
