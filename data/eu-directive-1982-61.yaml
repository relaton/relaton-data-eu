title:
- language: en
  script: Latn
  content: Council Directive 82/61/EEC of 26 January 1982 amending Directive 64/432/EEC
    as regards the period of validity of the derogations relating to brucellosis guarantees
    in trade in certain bovine animals as provided for in point E of Article 7 (1)
    thereof
  type: main
- language: fr
  script: Latn
  content: Directive 82/61/CEE du Conseil, du 26 janvier 1982, modifiant la directive
    64/432/CEE en ce qui concerne la période de validité des dérogations concernant
    les garanties relatives à la brucellose dans les échanges de certains animaux
    de l'espèce bovine, conformément à l'article 7 paragraphe 1 point E de ladite
    directive
  type: main
- language: de
  script: Latn
  content: Richtlinie 82/61/EWG des Rates vom 26. Januar 1982 zur Änderung der Richtlinie
    64/432/EWG hinsichtlich der Geltungsdauer der in Artikel 7 Absatz 1 Buchstabe
    E vorgesehenen Abweichungsmöglichkeit betreffend die Brucellose-Garantien im
    Handel mit bestimmten Rindern
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 82/61/EØF af 26. januar 1982 om ændring af direktiv
    64/432/EØF for så vidt angår gyldighedsperioden for de undtagelsesbestemmelser,
    der er fastsat i nævnte direktivs artikel 7, stk. 1, litra E, vedrørende forholdsregler
    over for brucellose ved handel med visse kategorier af kvæg
  type: main
- language: el
  script: Grek
  content: Οδηγία 82/61/EOK του Συμβουλίου της 26ης Ιανουαρίου
    1982 περί τροποποίησης της οδηγίας 64/432/EOK όσον
    αφορά την περίοδο ισχύος των παρεκκλίσεων
    που αναφέρονται στα μέτρα σχετικά με τη βρουκέλλωση
    κατά τις συναλλαγές ορισμένων βοοειδών, σύμφωνα
    με το άρθρο 7 παράγραφος 1 σημείο Ε της εν λόγω
    οδηγίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 82/61/ETY, annettu 26 päivänä tammikuuta 1982,
    direktiivin 64/432/ETY muuttamisesta direktiivin 7 artiklan 1 kohdan E alakohdassa
    tarkoitettujen luomistautia koskevista takeista tiettyjen nautaeläinten kaupassa
    myönnettävien poikkeuslupien voimassaoloajan osalta
  type: main
- language: it
  script: Latn
  content: Direttiva 82/61/CEE del Consiglio, del 26 gennaio 1982, che modifica la
    direttiva 64/432/CEE per quanto concerne il periodo di validità delle deroghe
    alle misure contro la brucellosi negli scambi di taluni animali della specie bovina
    previste all'articolo 7, paragrafo 1, lettera E, della stessa
  type: main
- language: nl
  script: Latn
  content: Richtlijn 82/61/EEG van de Raad van 26 januari 1982 tot wijziging van Richtlijn
    64/432/EEG met betrekking tot de geldigheidsduur van de afwijkende bepalingen
    inzake de gezondheidsgaranties ten aanzien van brucellose bij het handelsverkeer
    in bepaalde soorten runderen, als bedoeld in artikel 7, lid 1, sub E, van die
    Richtlijn
  type: main
- language: pt
  script: Latn
  content: Directiva 82/61/CEE do Conselho, de 26 de Janeiro de 1982, que altera a
    Directiva 64/432/CEE no que diz respeito ao prazo de validade das derrogações
    respeitantes às garantias relativas à brucelose no comércio de certos animais
    da espécie bovina, nos termos do n. 1, ponto E, do artigo 7. da citada Directiva
  type: main
- language: es
  script: Latn
  content: Directiva 82/61/CEE del Consejo, de 26 de enero de 1982, por la que se
    modifica la Directiva 64/432/CEE en lo que concierne al periodo de validez de
    las excepciones referentes a las garantías relativas a la brucelosis en los intercambios
    de ciertos animales de la especie bovina, en conformidad con el punto E del apartado
    1 del artículo 7 de dicha Directiva
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 82/61/EEG av den 26'januari 1982 om ändring av direktiv
    64/432/EEG vad gäller giltighetstiden för de avvikelser som rör brucellosgarantier
    vid handel med vissa nötkreatur enligt artikel 7.1 E i det direktivet
  type: main
