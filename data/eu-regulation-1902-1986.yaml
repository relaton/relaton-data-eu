  content: Commission Regulation (EEC) No 1902/86 of 17 June 1986 laying down detailed
    rules for the application of Council Regulation (EEC) No 758/86 on the import
    system applicable in 1986 to products falling within subheading 07.06 A of the
    Common Customs Tariff and originating in third countries which are not members
    of GATT, consequent upon the increase in the quota
  type: main
- language: fr
  script: Latn
