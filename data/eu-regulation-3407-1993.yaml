title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3407/93 of 13 December 1993 amending Regulation
    (EEC) No 3554/90 adopting provisions for the establishment of the list of vessels
    exceeding eight metres length overall which are permitted to fish for sole within
    certain areas of the Community using beam trawls whose aggregate length exceeds
    nine metres
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3407/93 de la Commission du 13 décembre 1993 modifiant
    le règlement (CEE) n° 3554/90 établissant les modalités pour l'établissement
    de la liste des bateaux dont la longueur hors tout dépasse huit mètres, qui
    sont autorisés à pêcher la sole dans certaines zones de la Communauté à l'aide
    de chaluts à perches dont la longueur totale dépasse neuf mètres
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3407/93 der Kommission vom 13. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 3554/90 zur Festlegung der Vorschriften zur Erstellung
    der Liste der Schiffe mit einer Länge über alles von mehr als 8 m, die in bestimmten
    Gebieten der Gemeinschaft mit Baumkurren, deren Gesamtbaumlänge mehr als 9 m
    beträgt, auf Seezunge fischen dürfen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3407/93 af 13. december 1993 om ændring
    af forordning (EØF) nr. 3554/90 om fastlæggelse af reglerne for udarbejdelsen
    af listen over fartøjer med en længde overalt på over 8 meter, der ved fiskeri
    efter tunge i visse af Fællesskabets områder har tilladelse til at anvende bomtrawl,
    hvis samlede bomlængde overstiger 9 meter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3407/93 της Επιτροπής
    της 13ης Δεκεμβρίου 1993 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3554/90 για τις λεπτομέρειες
    για την κατάρτιση του καταλόγου των σκαφών
    συνολικού μήκους άνω των οκτώ μέτρων τα οποία
    επιτρέπεται να χρησιμοποιούν δοκότρατες των
    οποίων το συνολικό μήκος υπερβαίνει τα εννέα
    μέτρα
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 3407/93, annettu 13 päivänä joulukuuta 1993,
    yksityiskohtaisista säännöistä luettelon laatimiseksi kokonaispituudeltaan
    kahdeksan metriä ylittävistä aluksista, joilla on lupa kalastaa kielikampelaa
    tietyillä yhteisön vyöhykkeillä kokonaispituudeltaan yhdeksän metriä ylittävien
    puomitroolien avulla, annetun asetuksen (ETY) 3554/90 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3407/93 della Commissione del 13 dicembre 1993 recante
    modificazione del regolamento (CEE) n. 3554/90 che fissa le modalità di redazione
    dell'elenco dei pescherecci di lunghezza fuori tutto superiore a 8 metri, autorizzati
    a pescare la sogliola in determinate zone della Comunità con reti a strascico
    a pali, di lunghezza complessiva superiore a 9 metri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3407/93 van de Commissie van 13 december 1993 tot
    wijziging van Verordening (EEG) nr. 3554/90 houdende nadere bepalingen voor de
    vaststelling van de lijst van vaartuigen met een lengte over alles van meer dan
    8 meter die in bepaalde zones van de Gemeenschap met boomkorren waarvan de totale
    boomlengte meer dan 9 meter bedraagt, op tong mogen vissen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3407/93 da Comissão de 13 de Dezembro de 1993 que
    altera o Regulamento (CEE) nº 3554/90 que estabelece as regras de composição
    da lista dos navios com mais de oito metros de comprimento de fora a fora autorizados
    a pescar linguado em determinadas zonas da Comunidade utilizando redes de arrasto
    de vara em que o comprimento total das varas seja superior a nove metros
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 3407/93 de la Comisión de 13 de diciembre de 1993
    por el que se modifica el Reglamento (CEE) n° 3554/90 por el que se establece
    el procedimiento para la elaboración de la lista de barcos cuya eslora total
    excede de ocho metros y a los que se permite la pesca del lenguado dentro de determinadas
    zonas de la Comunidad utilizando artes de arrastre de vara cuya longitud total
    supere los nueve metros
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3407/93 av den 13 december 1993 om ändring
    av förordning (EEG) nr 3554/90 om fastställande av bestämmelser för förteckningen
    över fartyg med en största längd som överstiger åtta meter vilka vid fiske
    efter tunga inom vissa av gemenskapens områden har tillstånd att använda bomtrålar
    vars sammanlagda bomlängd överstiger nio meter
  type: main
