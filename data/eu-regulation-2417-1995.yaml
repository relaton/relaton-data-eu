    lednem 1995 stanovila některé ceny a částky, jejichž hodnoty v ECU byly upraveny
    v důsledku zrušení opravného faktoru pro zemědělské přepočítací koeficienty
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2417/95 af 13. oktober 1995 om ajourføring
