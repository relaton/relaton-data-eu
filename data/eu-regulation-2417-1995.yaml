    на регламентите в сектора на говеждо месо,
    които фиксират преди 1 февруари 1995 г. определени
    цени и суми, чиито стойности в екю са били променени
    поради отменянето на коригиращия фактор на
    земеделските обменни курсове
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 2417/95 ze dne 13. října 1995, kterým se
