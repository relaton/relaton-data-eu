title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1995/90 of 12 July 1990 fixing the conversion
    rates used for the calculation of monetary compensatory amounts and to be applied
    for certain amounts in the agricultural sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1995/90 de la Commission, du 12 juillet 1990, fixant
    les taux de conversion retenus pour le calcul des montants compensatoires monétaires
    et à appliquer pour certains montants dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1995/90 der Kommission vom 12. Juli 1990 zur Festsetzung
    der Umrechnungskurse, die für die Berechnung der Währungsausgleichsbeträge
    und für bestimmte Beträge im Agrarsektor angewendet werden müssen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1995/90 af 12. juli 1990 om fastsættelse
    af de omregningskurser, der skal lægges til grund ved beregning af de monetære
    udligningsbeløb
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1995/90 της Επιτροπής
    της 12ης Ιουλίου 1990 για τον καθορισμό των ισοτιμιών
    που θα ληφθούν υπόψη για τον υπολογισμό των
    νομισματικών εξισωτικών ποσών και που θα εφαρμοσθούν
    σε ορισμένα ποσά στο γεωργικό τομέα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1995/90 della Commissione, del 12 luglio 1990, che
    fissa i tassi di conversione stabiliti per il calcolo degli importi compensativi
    monetari e da applicare a taluni importi nel settore agricolo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1995/90 van de Commissie van 12 juli 1990 tot vaststelling
    van de voor de berekening van de monetaire compenserende bedragen en op bepaalde
    bedragen in de landbouwsector toe te passen omrekeningskoersen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.º 1995/90 da Comissão, de 12 de Julho de 1990, que
    fixa as taxas de conversão adoptadas para o cálculo dos montantes compensatórios
    monetários e a aplicar em relação a determinados montantes no sector agrícola
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1995/90 de la Comisión, de 12 de julio de 1990, por
    el que se fijan los tipos de conversión adoptados para calcular los montantes
