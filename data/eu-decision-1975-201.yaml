title:
- language: en
  script: Latn
  content: Commission Decision of 9 April 1975 repealing the safeguard measures applicable
    to the exportation form the Community of durum wheat and of flour, groats and
    meals of durum wheat of Italian origin
  type: main
- language: fr
  script: Latn
  content: '75/201/CEE: Décision de la Commission, du 9 avril 1975, abrogeant les
    mesures de sauvegarde applicables à l''exportation de froment dur ainsi que de
    farine, de gruaux et semoules de froment dur d''origine italienne hors de la Communauté'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. April 1975 zur Aufhebung der Schutzmaßnahmen
    bei der Ausfuhr von Hartweizen sowie von Mehl, Grob- und Feingrieß von Hartweizen
    mit Ursprung in Italien aus der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 9. april 1975 om ophævelse af de beskyttelsesforanstaltninger,
    som anvendes ved udførsel fra Fællesskabet af hård hvede samt mel, grove og
    fine gryn af hård hvede af italiensk oprindelse
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 aprile 1975, che abroga le misure di
    salvaguardia applicabili all'esportazione fuori della Comunità di frumento duro,
    nonché di farina, semole e semolini di frumento duro d'origine italiana
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 april 1975 houdende intrekking van de
    vrijwaringsmaatregelen ten aanzien van de uitvoer uit de Gemeenschap van durum
    tarwe alsmede meel, gries en griesmeel van durum tarwe van oorsprong uit Italië
  type: main
