  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2023/1012, 15. mai 2023, millega antakse luba alustada
    läbirääkimisi Peruu Vabariigiga Euroopa Liidu ja Peruu Vabariigi vahelise lepingu
    üle, mis käsitleb isikuandmete vahetamist Euroopa Liidu Õiguskaitsekoostöö
