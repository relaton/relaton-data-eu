  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2023/1012, annettu 15 päivänä toukokuuta 2023,
    luvan antamisesta aloittaa neuvottelut Perun tasavallan kanssa Euroopan unioninlainvalvontayhteistyöviraston
    (Europol) ja vakavan rikollisuuden ja terrorismin torjunnasta vastaavien Perun
    toimivaltaisten viranomaisten välistä henkilötietojen vaihtoa koskevan Euroopan
    unionin ja Perun tasavallan välisen sopimuksen tekemiseksi
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2023/1012 ón gComhairle an 15 Bealtaine 2023 lena n-údaraítear
    tús a chur le caibidlíocht le Poblacht Pheiriú le haghaidh comhaontú idir
    an tAontas Eorpach agus Poblacht Pheiriú maidir le sonraí pearsanta a mhalartú
    idir Gníomhaireacht an Aontais Eorpaigh i ndáil le Comhar i bhForfheidhmiú
    an Dlí (Europol) agus údaráis Phoblacht Pheiriú atá inniúil chun coireacht
    thromchúiseach agus sceimhlitheoireacht a chomhrac
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2023/1012 od 15. svibnja 2023. o odobravanju otvaranja
    pregovora s Republikom Peruom o sporazumu između Europske unije i Republike Perua
    o razmjeni osobnih podataka između Agencije Europske unije za suradnju tijela
    za izvršavanje zakonodavstva (Europol) i peruanskih tijela nadležnih za borbu
    protiv teških kaznenih djela i terorizma
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2023/1012 határozata (2023. május 15.) az Európai Unió
    és a Perui Köztársaság közötti, a személyes adatoknak a Bűnüldözési
    Együttműködés Európai Uniós Ügynöksége (Europol), valamint a súlyos
    bűncselekmények és a terrorizmus elleni küzdelem terén illetékes perui hatóságok
    közötti cseréjéről szóló megállapodásra irányuló, a Perui Köztársasággal
    folytatandó tárgyalások megkezdésére való felhatalmazásról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2023/1012 del Consiglio del 15 maggio 2023 che autorizza
    l’avvio di negoziati con la Repubblica del Perù per un accordo tra l’Unione
    europea e la Repubblica del Perù sullo scambio di dati personali tra l’Agenzia
    dell’Unione europea per la cooperazione nell’attività di contrasto (Europol)
    e le autorità peruviane competenti per la lotta contro le forme gravi di criminalità
    e il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2023/1012 (2023. gada 15. maijs), ar ko pilnvaro sākt
    sarunas ar Peru Republiku par nolīgumu starp Eiropas Savienību un Peru Republiku
    par personas datu apmaiņu starp Eiropas Savienības Aģentūru tiesībaizsardzības
    sadarbībai (Eiropolu) un Peru iestādēm, kuru kompetencē ir smago noziegumu
    un terorisma apkarošana
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2023/1012 2023 m. gegužės 15 d. kuriuo suteikiami
    įgaliojimai pradėti derybas su Peru Respublika dėl Europos Sąjungos ir Peru
    Respublikos susitarimo dėl Europos Sąjungos teisėsaugos bendradarbiavimo agentūros
    (Europolo) ir Peru kompetentingų kovos su sunkiais nusikaltimais ir terorizmu
    institucijų keitimosi asmens duomenimis
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2023/1012 tal-15 ta’ Mejju 2023 li tawtorizza
    l-ftuħ ta’ negozjati mar-Repubblika tal-Perù għal ftehim bejn l-Unjoni Ewropea
    u r-Repubblika tal-Perù dwar l-iskambju ta’ data personali bejn l-Aġenzija
    tal-Unjoni Ewropea għall-Kooperazzjoni fl-Infurzar tal-Liġi (Europol) u l-awtoritajiet
    Peruvjani kompetenti fil-ġlieda kontra l-kriminalità serja u t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2023/1012 van de Raad van 15 mei 2023 tot machtiging tot het
    openen van onderhandelingen met de Republiek Peru over een overeenkomst tussen
    de Europese Unie en de Republiek Peru op het gebied van de uitwisseling van persoonsgegevens
    tussen het Agentschap van de Europese Unie voor samenwerking op het gebied van
    rechtshandhaving (Europol) en de Peruaanse autoriteiten die bevoegd zijn voor
    de bestrijding van zware criminaliteit en terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2023/1012 z dnia 15 maja 2023 r. w sprawie upoważnienia
    do podjęcia negocjacji z Republiką Peru dotyczących umowy między Unią Europejską
    a Republiką Peru w sprawie wymiany danych osobowych między Agencją Unii Europejskiej
    ds. Współpracy Organów Ścigania (Europol) i organami peruwiańskimi właściwymi
    do zwalczania poważnej przestępczości i terroryzmu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2023/1012 do Conselho de 15 de maio de 2023 que autoriza
    a abertura de negociações com a República do Peru tendo em vista a celebração
    de um acordo entre a União Europeia e a República do Peru sobre o intercâmbio
    de dados pessoais entre a Agência da União Europeia para a Cooperação Policial
    (Europol) e as autoridades peruanas competentes em matéria de luta contra a criminalidade
    grave e o terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2023/1012 a Consiliului din 15 mai 2023 de autorizare a începerii
    negocierilor cu Republica Peru în vederea unui acord între Uniunea Europeană
    și Republica Peru privind schimbul de date cu caracter personal între Agenția
    Uniunii Europene pentru Cooperare în Materie de Aplicare a Legii (Europol) și
    autoritățile peruane cu competențe în materie de combatere a criminalității
    grave și a terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2023/1012 z 15. mája 2023 o poverení začať rokovania
    s Peruánskou republikou o dohode medzi Európskou úniou a Peruánskou republikou
    o výmene osobných údajov medzi Agentúrou Európskej únie pre spoluprácu
    v oblasti presadzovania práva (Europol) a orgánmi Peru príslušnými pre boj
    proti závažnej trestnej činnosti a terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2023/1012 z dne 15. maja 2023 o pooblastilu za začetek
    pogajanj z Republiko Peru o sporazumu med Evropsko unijo in Republiko Peru o izmenjavi
    osebnih podatkov med Agencijo Evropske unije za sodelovanje na področju preprečevanja,
    odkrivanja in preiskovanja kaznivih dejanj (Europol) in perujskimi organi, pristojnimi
    za boj proti hudim kaznivim dejanjem in terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/1012 del Consejo de 15 de mayo de 2023 por la que se
    autoriza la apertura de negociaciones con la República del Perú para la celebración
    de un Acuerdo entre la Unión Europea y la República del Perú sobre el intercambio
    de datos de carácter personal entre la Agencia de la Unión Europea para la Cooperación
    Policial (Europol) y las autoridades peruanas competentes en materia de lucha
    contra la delincuencia grave y el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/1012 av den 15 maj 2023 om bemyndigande att inleda
    förhandlingar med Republiken Peru om ett avtal mellan Europeiska unionen och
    Republiken Peru om utbyte av personuppgifter mellan Europeiska unionens byrå
    för samarbete inom brottsbekämpning (Europol) och behöriga myndigheter i Peru
    med ansvar för bekämpning av grov brottslighet och terrorism
