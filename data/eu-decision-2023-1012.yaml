title:
- language: en
  script: Latn
  content: Council Decision (EU) 2023/1012 of 15 May 2023 authorising the opening
    of negotiations with the Republic of Peru for an agreement between the European
    Union and the Republic of Peru on the exchange of personal data between the European
    Union Agency for Law Enforcement Cooperation (Europol) and the Peruvian authorities
    competent for fighting serious crime and terrorism
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2023/1012 du Conseil du 15 mai 2023 autorisant l’ouverture
    de négociations avec la République du Pérou en vue d’un accord entre l’Union
    européenne et la République du Pérou sur l’échange de données à caractère
    personnel entre l’Agence de l’Union européenne pour la coopération des services
    répressifs (Europol) et les autorités péruviennes compétentes pour lutter
    contre les formes graves de criminalité et le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2023/1012 des Rates vom 15. Mai 2023 über die Ermächtigung
    zur Aufnahme von Verhandlungen mit der Republik Peru über ein Abkommen zwischen
    der Europäischen Union und der Republik Peru über den Austausch personenbezogener
    Daten zwischen der Agentur der Europäischen Union für die Zusammenarbeit auf
    dem Gebiet der Strafverfolgung (Europol) und den für die Bekämpfung von schwerer
    Kriminalität und Terrorismus zuständigen peruanischen Behörden
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2023/1012 на Съвета от 15 май 2023 година
    за разрешаване на започването на преговори
    с Република Перу по споразумение между Европейския
    съюз и Република Перу относно обмена на лични
    данни между Агенцията на Европейския съюз
    за сътрудничество в областта на правоприлагането
    (Европол) и перуанските органи, компетентни
    в областта на борбата с тежките престъпления
    и тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2023/1012 ze dne 15. května 2023 o zmocnění k
    zahájení jednání s Peruánskou republikou o dohodě mezi Evropskou unií a
    Peruánskou republikou o výměně osobních údajů mezi Agenturou Evropské
    unie pro spolupráci v oblasti prosazování práva (Europol) a peruánskými
    orgány příslušnými pro boj proti závažné trestné činnosti a terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2023/1012 af 15. maj 2023 om bemyndigelse til at
    indlede forhandlinger med Republikken Peru om en aftale mellem Den Europæiske
    Union og Republikken Peru om udveksling af personoplysninger mellem Den Europæiske
    Unions Agentur for Retshåndhævelsessamarbejde (Europol) og de peruvianske kompetente
    myndigheder for bekæmpelse af grov kriminalitet og terrorisme
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2023/1012 του Συμβουλίου της 15ης
