    на Ауески относно допълнителните гаранции
    за свинете, предназначени за териториите на
    Белгия и Нидерландия и за изменение на Решения
    93/244/ЕИО и 2001/618/ЕО (нотифицирано под № С(2001)4384)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 18. prosince 2001, kterým se schvaluje program
    eradikace Aujeszkyho choroby předložený Belgií a Nizozemskem, kterým se stanoví
    doplňkové záruky u prasat určených pro území Belgie a Nizozemska a kterým
    se mění rozhodnutí 93/244/EHS a 2001/618/ES (oznámeno pod číslem K(2001)
    4384)
  type: main
- language: da
