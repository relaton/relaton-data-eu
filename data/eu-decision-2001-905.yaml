  script: Latn
  content: '2001/905/EC: Commission Decision of 18 December 2001 approving the Aujeszky''s
    disease eradication programme presented by Belgium and the Netherlands, concerning
    additional guarantees for pigs destined for the territory of Belgium and the Netherlands
    and amending Decisions 93/244/EEC and 2001/618/EC (notified under document number
    C(2001) 4384)'
  type: main
- language: fr
  script: Latn
  content: '2001/905/CE: Décision de la Commission du 18 décembre 2001 portant approbation
    du programme d''éradication de la maladie d''Aujeszky présenté par la Belgique
    et les Pays-Bas, relatif aux garanties supplémentaires pour les porcs destinés
    à la Belgique et aux Pays-Bas, et modifiant les décisions 93/244/CEE et 2001/618/CE
    [notifiée sous le numéro C(2001) 4384]'
  type: main
- language: de
  script: Latn
  content: '2001/905/EG: Entscheidung der Kommission vom 18. Dezember 2001 zur Genehmigung
    des von Belgien und den Niederlanden vorgelegten Programms zur Tilgung der Aujeszkyschen
    Krankheit, über ergänzende Garantien für Schweine, die für das Hoheitsgebiet
    Belgiens und der Niederlande bestimmt sind, und zur Änderung der Entscheidungen
    93/244/EWG und 2001/618/EG (Bekannt gegeben unter Aktenzeichen K(2001) 4384)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 18 декември 2001 година
