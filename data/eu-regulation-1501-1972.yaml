  content: Règlement (CEE) n 1501/72 de la Commission, du 13 juillet 1972, déterminant
    les montants des éléments mobiles rectifiés applicables, à compter du 15 juillet
    1972, à l'importation dans la Communauté de certaines marchandises relevant
    du règlement (CEE) n 1059/69 du Conseil fabriquées à partir de riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1501/72 der Kommission vom 13. Juli 1972 zur Festsetzung
    der Höhe der berichtigten beweglichen Teilbeträge, die ab 15. Juli 1972 bei
    der Einfuhr der unter die Verordnung (EWG) Nr. 1059/69 des Rates fallenden, aus
    Reis hergestellten Waren gelten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1501/72 della Commissione, del 13 luglio 1972, che
    determina gli importi degli elementi mobili rettificati applicabili dal 15 luglio
    1972 all'importazione nella Comunità di talune merci fabbricate con riso alle
    quali si applica il regolamento (CEE) n. 1059/69 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1501/72 van de Commissie van 13 juli 1972 tot vaststelling
