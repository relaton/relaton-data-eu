---
id: EUDecision1976692
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 16 July 1976 authorizing the French Republic not
    to apply Community treatment to shirts, T-shirts, under vests and the like, falling
    within heading No ex 60.04 of the Common Customs Tariff, originating in Hong Kong
    and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/692/CEE: Décision de la Commission, du 16 juillet 1976, autorisant
    la République française à exclure du traitement communautaire les chemises
    et chemisettes, sous-pulls, T-shirts, gilets de corps et articles similaires de
    la position Ex 60.04 du Tarif douanier commun, originaires de Hongkong, et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 16. Juli 1976, mit der die Französische
    Republik ermächtigt wird, aus Hongkong stammende und in den anderen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, Unterziehpullover,
    T-Shirts, Unterjacken und dergleichen, der Tarifnummer ex 60.04 des Gemeinsamen
    Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 16. juli 1976 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage skjorter, undertrøjer, T-shirts,
    sportsundertrøjer og lignende varer, som henhører under pos. ex 60.04 i den
    fælles toldtarif, har oprindelse i Hongkong og frit kan omsættes i de andre
    medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 16 luglio 1976, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario camicie e camicette, maglioncini,
    camicie a T, canottiere e simili della voce ex 60.04 della tariffa doganale comune
    originari di Hong Kong ed immessi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 16 juli 1976 waarbij de Franse Republiek
    wordt gemachtigd de hemden en halfhemden, ondertruien, T-shirts, borstrokken en
    soortgelijke artikelen van post ex 60.04 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hong-Kong en in de overige Lid-Staten in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten
  type: main
