title:
- language: en
  script: Latn
  content: '97/310/EC: Commission Decision of 12 February 1997 concerning the granting
    of additional implementation periods to Portugal for the implementation of Commission
    Directives 90/388/EEC and 96/2/EC as regards full competition in the telecommunications
    markets (Only the Portuguese text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/310/CE: Décision de la Commission du 12 février 1997 concernant l''octroi
    au Portugal de délais supplémentaires pour la mise en oeuvre des directives
    90/388/CEE et 96/2/CE en ce qui concerne la pleine concurrence dans les marchés
    des télécommunications (Le texte en langue portugaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/310/EG: Entscheidung der Kommission vom 12. Februar 1997 über Zusatzfristen,
