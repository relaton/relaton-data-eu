title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 129/93 of 26 January 1993 opening compulsory
    distillation as provided for in Article 30 of Council Regulation (EEC) N° 822/87
    and derogating for the 1992/93 wine year from certain detailed rules for the application
    thereof
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 129/93 de la Commission, du 26 janvier 1993, ouvrant
    la distillation obligatoire prévue à l' article 39 du règlement (CEE) n° 822/87
    du Conseil et dérogeant à certaines modalités d' application y afférentes
    pour la campagne 1992/1993
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 129/93 der Kommission vom 26. Januar 1993 zur Eröffnung
    der obligatorischen Destillation gemäß Artikel 39 der Verordnung (EWG) Nr. 822/87
    des Rates und zur Abweichung von diesbezüglichen Durchführungsbestimmungen für
    das Wirtschaftsjahr 1992/93
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 129/93 af 26. januar 1993 om iværksættelse
    af obligatorisk destillation som omhandlet i artikel 39 i Rådets forordning (EØF)
    nr. 822/87 og om undtagelse fra visse bestemmelser om destillationens gennemførelse
    for produktionsåret 1992/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 129/93 της Επιτροπής
    της 26ης Ιανουαρίου 1993 για το άνοιγμα υποχρεωτικής
    αποστάξεως που προβλέπεται στο άρθρο 39 του
    κανονισμού (ΕΟΚ) αριθ. 822/87 του Συμβουλίου και
    για την παρέκκλιση ορισμένων σχετικών λεπτομερειών
    εφαρμογής για την περίοδο 1992/93
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 129/93 della Commissione, del 26 gennaio 1993, recante
    apertura della distillazione obbligatoria di cui all' articolo 39 del regolamento
    (CEE) n. 822/87 del Consiglio e recante deroga ad alcune modalità di applicazione
    ad essa relative per la campagna 1992/1993
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 129/93 van de Commissie van 26 januari 1993 tot instelling
    van de in artikel 39 van Verordening (EEG) nr. 822/87 van de Raad bedoelde verplichte
    distillatie en houdende afwijking van uitvoeringsbepalingen ter zake voor het
    wijnoogstjaar 1992/1993
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 129/93 da Comissão, de 26 de Janeiro de 1993, que
    abre a destilação obrigatória referida no artigo 39° do Regulamento (CEE)
    n° 822/87 do Conselho e que derroga determinadas regras de execução correspondentes
    para a campanha de 1992/1993
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 129/93 de la Comisión, de 26 de enero de 1993, por
    el que se decide iniciar la destilación obligatoria contemplada en el artículo
    39 del Reglamento (CEE) n° 822/87 del Consejo y se establecen casos de excepción
    a algunas de las normas de aplicación correspondientes durante la campaña 1992/93
  type: main
