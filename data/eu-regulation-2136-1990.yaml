    der Produktionsbeihilfe fuer diese Birnen in Sirup und/oder natuerlichem Fruchtsaft
    im Wirtschaftsjahr 1990/91
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2136/90 af 24. juli 1990 om fastsættelse
