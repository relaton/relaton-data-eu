title:
- language: en
  script: Latn
  content: '88/504/EEC: Council Decision of 26 September 1988 extending the period
    of application of Decision 82/530/EEC authorizing the United Kingdom to permit
    the Isle of Man authorities to apply a system of special import licences to sheepmeat
    and beef and veal'
  type: main
- language: fr
  script: Latn
  content: '88/504/CEE: Décision du Conseil du 26 septembre 1988 prorogeant la décision
    82/530/CEE autorisant le Royaume-Uni à permettre aux autorités de l'' île de
    Man d'' appliquer un système de certificats spéciaux d'' importation pour la
    viande ovine et la viande bovine'
  type: main
- language: de
  script: Latn
  content: '88/504/EWG: Entscheidung des Rates vom 26. September 1988 zur Verlängerung
    der Entscheidung 82/530/EWG zur Ermächtigung des Vereinigten Königreichs, der
    Regierung der Insel Man zu gestatten, bei Schaf- und Rindfleisch eine besondere
    Einfuhrlizenzregelung anzuwenden'
  type: main
- language: da
  script: Latn
  content: '88/504/EØF: Rådets beslutning af 26. september 1988 om forlængelse
    af anvendelsesperioden for beslutning 82/530/EØF om bemyndigelse til Det Forenede
    Kongerige til at tillade myndighederne på øen Man at anvende en ordning med
    særlige importlicenser for fårekød, oksekød og kalvekød'
  type: main
- language: el
  script: Grek
  content: '88/504/ΕΟΚ: Απόφαση του Συμβουλίου της 26ης
    Σεπτεμβρίου 1988 για την παράταση της απόφασης
    82/530/ΕΟΚ περί εξουσιοδοτήσεως του Ηνωμένου
    Βασιλείου να επιτρέψει στις αρχές της Νήσου
    Μαν την εφαρμογή καθεστώτος ειδικών αδειών
    εισαγωγής προβείου και βοείου κρέατος'
  type: main
- language: it
  script: Latn
  content: '88/504/CEE: Decisione del Consiglio del 26 settembre 1988 recante proroga
    della decisione 82/530/CEE che autorizza il Regno Unito a consentire alle autorità
    dell'' isola di Man di applicare un regime di titoli d'' importazione speciali
    per le carni ovine e bovine'
  type: main
- language: nl
  script: Latn
  content: '88/504/EEG: Beschikking van de Raad van 26 september 1988 tot verlenging
