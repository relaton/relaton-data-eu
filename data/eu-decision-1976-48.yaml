id: EUDecision197648
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 17 November 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to men's socks falling within heading No ex 60.03 of the Common
    Customs Tariff, originating in Hungary and in free circulation in the other Member
    States
  type: main
- language: fr
  script: Latn
  content: '76/48/CEE: Décision de la Commission, du 17 novembre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chaussettes pour hommes, de la position
    Ex 60.03 du Tarif douanier commun, originaires de Hongrie et mises en libre pratique
    en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. November 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus Ungarn stammende und in den anderen Mitgliedstaaten im freien Verkehr
    befindliche Socken für Männer der Tarifnummer ex 60.03 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 17. november 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage sokker til mænd, som henhører under pos. ex 60.03 i den fælles toldtarif,
    har oprindelse i Ungarn og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 17 novembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo ed il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario i calzini da uomo della voce ex 60.03 della tariffa
    doganale comune, originari dell'Ungheria e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 17 november 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd herensokken van post ex 60.03 van het gemeenschappelijk douanetarief,
    van oorsprong uit Hongarije, en in de Bondsrepubliek Duitsland in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
