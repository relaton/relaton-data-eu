    vedrørende ydelse af støtte til skummetmælkspulver til foderbrug og skummetmælk,
    der forarbejdes til foderblandinger
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2481/72 della Commissione, del 28 novembre 1972, che
    modifica il regolamento (CEE) n. 757/71 relativo a modalità d' applicazione particolari
    concernenti la concessione di aiuti per il latte scremato in polvere destinato
    all' alimentazione degli animali e per il latte scremato trasformato in alimenti
    composti, al momento dell' esportazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2481/72 van de Commissie van 28 november 1972 houdende
    wijziging van Verordening (EEG) nr. 757/71 betreffende bijzondere uitvoeringsbepalingen
    met betrekking tot steunverlening bij uitvoer voor magere-melkpoeder bestemd voor
    voederdoeleinden en tot mengvoeder verwerkte ondermelk
