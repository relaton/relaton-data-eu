  script: Latn
  content: Regulation (EEC) No 2481/72 of the Commission of 28 November 1972 amending
    Regulation (EEC) No 757/71 on special rules of application for granting aid for
    exports of skimmed milk powder for use as feed and skimmed milk processed into
    compound feedingstuffs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2481/72 de la Commission, du 28 novembre 1972, modifiant
    le règlement (CEE) n° 757/71 relatif à des modalités particulières concernant
    l' octroi d' aides pour le lait écrémé en poudre destiné à l' alimentation
    des animaux et le lait écrémé transformé en aliments composés lors de l'
    exportation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2481/72 der Kommission vom 28. November 1972 zur Änderung
