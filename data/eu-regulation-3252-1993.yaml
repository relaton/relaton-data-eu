    21 00 mit Ursprung in Indonesien, für die die in der Verordnung (EWG) Nr. 3831/90
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 3252/93 af 25. november 1993 om genindførelse
