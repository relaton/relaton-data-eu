  script: Latn
  content: COMMISSION REGULATION (EC) No 3252/93 of 25 November 1993 re-establishing
    the levying of customs duties on products falling within CN code 3923 21 00, originating
    in Indonesia, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3252/93 de la Commission du 25 novembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3923 21 00 originaires d'Indonésie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3252/93 DER KOMMISSION vom 25. November 1993 zur Wiedereinführung
