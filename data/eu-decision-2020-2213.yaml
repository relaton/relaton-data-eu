  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/2213, 22. detsember 2020, millega muudetakse
    otsuse 2007/777/EÜ II lisa Ühendkuningriiki ja teatavaid Briti krooni sõltkondi
    käsitlevate kannete osas selliste kolmandate riikide või nende osade loetelus,
    kust on lubatud liitu importida teatavate inimtoiduks ettenähtud lihatoodete
    ja töödeldud magude, põite ja soolte saadetisi (teatavaks tehtud numbri C(2020)
    9547 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/2213, annettu 22 päivänä
    joulukuuta 2020, päätöksen 2007/777/EY liitteen II muuttamisesta siltä osin
    kuin on kyse Yhdistynyttä kuningaskuntaa ja sen kruunun alaisuuteen kuuluvia
    alueita koskevista kohdista sellaisten kolmansien maiden tai niiden osien luettelossa,
    joista ihmisravinnoksi tarkoitettujen tiettyjen lihavalmisteiden sekä käsiteltyjen
    mahojen, rakkojen ja suolten tuonti unionin alueelle on sallittua (tiedoksiannettu
    numerolla C(2020) 9547)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/2213 оd 22. prosinca 2020. o izmjeni
    Priloga II. Odluci 2007/777/EZ u pogledu unosa za Ujedinjenu Kraljevinu i krunskih
    posjeda na popisu trećih zemalja ili njihovih dijelova iz kojih je odobren uvoz
    pošiljaka određenih mesnih proizvoda i obrađenih želudaca, mjehura i crijeva
    za prehranu ljudi u Uniju (priopćeno pod brojem dokumenta C(2020) 9547)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2213 végrehajtási határozata (2020. december
    22) a 2007/777/EK határozat II. mellékletének az Egyesült Királyságnak és
    koronafüggőségeinek az emberi fogyasztásra szánt bizonyos húskészítmények
    és kezelt gyomor, hólyag és belek szállítmányainak az Unióba történő
    behozatalára engedéllyel rendelkező harmadik országok vagy azok részeinek
    jegyzékébe való bejegyzése tekintetében történő módosításáról (az
    értesítés a C(2020) 9547. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/2213 della Commissione del 22 dicembre
    2020 che modifica l’allegato II della decisione 2007/777/CE per quanto riguarda
    le voci relative al Regno Unito e alle dipendenze della Corona nell’elenco dei
    paesi terzi o parti dei paesi terzi da cui è autorizzata l’importazione nell’Unione
    di partite di determinati prodotti a base di carne e di stomaci, vesciche e intestini
    trattati destinati al consumo umano [notificata con il numero C(2020) 9547]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/2213 (2020. gada 22. decembris),
    ar ko Lēmuma 2007/777/EK II pielikumu groza attiecībā uz ierakstiem par Apvienoto
    Karalisti un tās atkarīgajām teritorijām to trešo valstu vai to daļu sarakstā,
    no kurām Savienībā atļauts importēt lietošanai pārtikā paredzētu noteiktu
    gaļas produktu un apstrādātu kuņģu, pūšļu un zarnu sūtījumus (izziņots
    ar dokumenta numuru C(2020) 9547)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/2213 2020 m. gruodžio 22
    d. kuriuo dėl Jungtinės Karalystės ir Didžiosios Britanijos Karūnos priklausinių
    įrašų trečiųjų šalių arba jų dalių, iš kurių leidžiama importuoti
    į Sąjungą tam tikrų mėsos produktų ir apdorotų skrandžių, pūslių ir
    žarnų, skirtų žmonių maistui, siuntas, sąraše iš dalies keičiamas Sprendimo
    2007/777/EB II priedas (pranešta dokumentu Nr. C(2020) 9547)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2020/2213 tat-22
    ta’ Diċembru 2020 li temenda l-Anness II tad-Deċiżjoni 2007/777/KE fir-rigward
    tal-entrati għar-Renju Unit u d-Dipendenzi tal-Kuruna fil-lista ta’ pajjiżi
    terzi jew partijiet minnhom awtorizzati għall-importazzjonijiet fl-Unjoni ta’
    kunsinni ta’ ċerti prodotti tal-laħam u ta’ stonkijiet, bżieżaq tal-awrina
    u msaren ittrattati għall-konsum mill-bniedem (notifikata bid-dokument C(2020)
    9547)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/2213 van de Commissie van 22 december 2020
    tot wijziging van bijlage II bij Beschikking 2007/777/EG wat betreft de vermelding
    van het Verenigd Koninkrijk en de van de Kroon afhankelijke gebieden in de lijst
    van derde landen of delen daarvan waaruit zendingen van bepaalde vleesproducten
    en van behandelde magen, blazen en darmen voor menselijke consumptie in de Unie
    mogen worden ingevoerd (Kennisgeving geschied onder nummer C(2020) 9547)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/2213 z dnia 22 grudnia 2020 r. zmieniająca
    załącznik II do decyzji 2007/777/WE w odniesieniu do wpisów dotyczących Zjednoczonego
    Królestwa i terytoriów zależnych Korony Brytyjskiej w wykazie krajów trzecich
    lub ich części, z których dozwolony jest przywóz do Unii przesyłek niektórych
    produktów mięsnych oraz przetworzonych żołądków, pęcherzy i jelit do spożycia
    przez ludzi (notyfikowana jako dokument nr C(2020) 9547)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/2213 da Comissão de 22 de dezembro de
    2020 que altera o anexo II da Decisão 2007/777/CE no que diz respeito às entradas
    do Reino Unido e das dependências da Coroa na lista de países terceiros ou partes
    de países terceiros autorizados para as importações, na União, de remessas
    de determinados produtos à base de carne e estômagos, bexigas e intestinos tratados
    para consumo humano [notificada com o número C(2020) 9547]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2213 a Comisiei din 22 decembrie
    2020 de modificare a anexei II la Decizia 2007/777/CE în ceea ce privește rubricile
    referitoare la Regatul Unit și la dependențele Coroanei britanice din lista
    țărilor terțe sau a părților acestora care sunt autorizate pentru importul
    în Uniune de transporturi de anumite produse din carne și de stomacuri, vezici
    și intestine tratate destinate consumului uman [notificată cu numărul C(2020)
    9547]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/2213 z 22. decembra 2020, ktorým
    sa mení príloha II k rozhodnutiu 2007/777/ES, pokiaľ ide o položky týkajúce
    sa Spojeného kráľovstva a korunných dependencií v zozname tretích krajín
    alebo ich častí, z ktorých sa povoľuje dovoz zásielok určitých mäsových
    výrobkov a opracovaných žalúdkov, mechúrov a čriev určených na ľudskú
    spotrebu do Únie [oznámené pod číslom C(2020) 9547]
  type: main
- language: sl
  script: Latn
  content: Delegirani sklep Komisije (EU) 2020/2213 z dne 22. decembra 2020d o spremembi
    Priloge II k Odločbi 2007/777/ES glede vnosov za Združeno kraljestvo in kronska
    odvisna ozemlja na seznamu tretjih držav ali njihovih delov, iz katerih je dovoljen
    uvoz pošiljk nekaterih mesnih izdelkov in obdelanih želodcev, mehurjev in črev
    za prehrano ljudi v Unijo (notificirano pod dokumentarno številko C(2020) 9547)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/2213 de la Comisión de 22 de diciembre
    de 2020 por la que se modifica el anexo II de la Decisión 2007/777/CE en lo relativo
    a la incorporación del Reino Unido y de las dependencias de la Corona a la lista
    de terceros países o partes de ellos autorizados a importar en la Unión partidas
    de determinados productos cárnicos y de estómagos, vejigas e intestinos tratados
    que estén destinados al consumo humano [notificada con el número C(2020) 9547]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/2213 av den 22 december 2020
    om ändring av bilaga II till beslut 2007/777/EG vad gäller införande av Förenade
    kungariket och dess kronbesittningar i förteckningen över tredjeländer eller
    delar av tredjeländer från vilka sändningar av vissa köttprodukter och behandlade
    magar, blåsor och tarmar avsedda att användas som livsmedel får importeras
    till unionen (delgivet med nr C(2020) 9547)
