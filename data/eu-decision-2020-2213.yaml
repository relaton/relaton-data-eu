title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/2213 of 22 December 2020 amending
    Annex II to Decision 2007/777/EC as regards the entries for the United Kingdom
    and the Crown Dependencies in the list of third countries or parts thereof authorised
    for imports into the Union of consignments of certain meat products and treated
    stomachs, bladders and intestines for human consumption (notified under document
    C(2020) 9547)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2213 de la Commission du 22 décembre
    2020 modifiant l’annexe II de la décision 2007/777/CE en ce qui concerne les
    mentions relatives au Royaume-Uni et aux dépendances de la Couronne dans la liste
    des pays tiers ou parties de pays tiers en provenance desquels l’importation
    dans l’Union de lots de certains produits à base de viande et d’estomacs,
    vessies et boyaux traités destinés à la consommation humaine est autorisée
    [notifiée sous le numéro C(2020) 9547]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2213 der Kommission vom 22. Dezember
    2020 zur Änderung des Anhangs II der Entscheidung 2007/777/EG im Hinblick auf
    die Einträge für das Vereinigte Königreich Großbritannien und Nordirland und
    die unmittelbar der englischen Krone unterstehenden Gebiete in der Liste der Drittländer
    bzw. Teile von Drittländern, aus denen die Einfuhr von Sendungen mit bestimmten
    Fleischerzeugnissen und mit behandelten Mägen, Blasen und Därmen für den menschlichen
    Verzehr in die Union zugelassen ist (Bekannt gegeben unter Aktenzeichen C(2020)
    9547)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/2213 на Комисията
    от 22 декември 2020 година за изменение на приложение
    II към Решение 2007/777/ЕО по отношение на вписванията
    за Обединеното кралство и подчинените на Британската
    корона територии в списъка на трети страни
    или части от тях, от които е разрешен вносът
    в Съюза на пратки от определени месни продукти
    и обработени стомаси, пикочни мехури и черва
    за консумация от човека (нотифицирано под номер
    С(2020) 9547)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/2213, ze dne 22. prosince 2020,
    kterým se mění příloha II rozhodnutí 2007/777/ES, pokud jde o položky týkající
    se Spojeného království a jeho závislých území v seznamu třetích zemí
    nebo jejich částí, ze kterých je povolen dovoz zásilek některých masných
    výrobků a opracovaných žaludků, močových měchýřů a střev určených
    k lidské spotřebě na území Unie (oznámeno pod číslem C(2020) 9547)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/2213 af 22. december
    2020 om ændring af bilag II til beslutning 2007/777/EF for så vidt angår oplysninger
    om Det Forenede Kongerige og kronbesiddelserne på listen over tredjelande eller
    dele af tredjelande, hvorfra det er tilladt at indføre visse kødprodukter og
    behandlede maver, blærer og tarme til konsum til Unionen (meddelt under nummer
    C(2020) 9547)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/2213 της Επιτροπής
