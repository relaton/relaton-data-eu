title:
- language: en
  script: Latn
  content: Council Implementing Regulation (EU) No 906/2011 of 2 September 2011 amending
    Regulation (EC) No 193/2007 imposing a definitive countervailing duty on imports
    of polyethylene terephthalate originating in India, and amending Regulation (EC)
    No 192/2007 imposing a definitive anti-dumping duty on imports of certain polyethylene
    terephthalate originating in, inter alia, India
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 906/2011 du Conseil du 2 septembre
    2011 modifiant le règlement (CE) n ° 193/2007 instituant un droit compensateur
    définitif sur les importations de certains types de polyéthylène téréphtalate
    originaires de l’Inde ainsi que le règlement (CE) n ° 192/2007 instituant
    un droit antidumping définitif sur les importations de certains types de polyéthylène
    téréphtalate originaires, entre autres, de l’Inde
