  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 906/2011 del Consiglio, del 2 settembre
    2011 , che modifica il regolamento (CE) n. 193/2007 che istituisce un dazio compensativo
    definitivo sulle importazioni di polietilene tereftalato originarie dell’India
    e il regolamento (CE) n. 192/2007 che impone un dazio antidumping definitivo alle
    importazioni di alcuni tipi di polietilentereftalato originario, tra l’altro,
    dell’India
  type: main
