title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2351/78 of 9 October 1978 re-establishing
    the levying of customs duties on tarpaulins, sails, awnings, sunblinds, tents
    and camping goods, falling within heading No 62.04, originating in South Korea,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 1197/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2351/78 de la Commission, du 9 octobre 1978, portant
    rétablissement de la perception des droits de douane applicables aux bâches,
    voiles d' embarcations, stores d' extérieur, tentes et articles de campement,
    de la position 62.04 du tarif douanier commun, originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 1197/78
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2351/78 der Kommission vom 9. Oktober 1978 über die
