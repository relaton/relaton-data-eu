    der Tarifnummer 62.04, mit Ursprung in Súdkorea, dem die in der Verordnung (EWG)
    Nr. 1197/78 des Rates vorgesehenen Zollpráferenzen gewáhrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2351/78 af 9. oktober 1978 om genindførelse
