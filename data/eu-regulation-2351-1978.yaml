    imbarcazioni, tende per l' esterno, tende ed oggetti per campeggio, della voce
    doganale 62.04, originari della Corea del Sud beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 1197/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2351/78 van de Commissie van 9 oktober 1978 houdende
