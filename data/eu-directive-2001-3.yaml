    irányelvnek, valamint a kerekes mezőgazdasági vagy erdészeti traktorokba szerelt
    külső gyújású motorok által előidézett rádiózavarok szűréséről szóló
    75/322/EGK tanácsi irányelvnek a műszaki fejlődéshez történő hozzáigazításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/3/CE della Commissione, dell'8 gennaio 2001, che adegua
    al progresso tecnico la direttiva 74/150/CEE del Consiglio relativa all'omologazione
    dei trattori agricoli o forestali a ruote e la direttiva 75/322/CEE del Consiglio,
    relativa alla soppressione dei disturbi radioelettrici provocati dai trattori
    agricoli o forestali a ruote
  type: main
- language: lv
  script: Latn
  content: Komisijas Direktīva 2001/3/EK (2001. gada 8. janvāris), ar ko tehnikas
    attīstībai pielāgo Padomes Direktīvu 74/150/EEK par lauksaimniecības un mežsaimniecības
    riteņtraktoru tipa apstiprinājumu un Padomes Direktīvu 75/322/EEK par lauksaimniecības
