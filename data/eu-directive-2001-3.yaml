  script: Latn
  content: Commission Directive 2001/3/EC of 8 January 2001 adapting to technical
    progress Council Directive 74/150/EEC relating to the type-approval of wheeled
    agricultural or forestry tractors and Council Directive 75/322/EEC relating to
    the suppression of radio interference produced by spark-ignition engines fitted
    to wheeled agricultural or forestry tractors
  type: main
- language: fr
  script: Latn
