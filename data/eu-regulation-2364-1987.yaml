    originari del Brasile beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2364/87 van de Commissie van 4 augustus 1987 houdende
