title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2364/87 of 4 August 1987 re-establishing
    the levying of customs duties on oxalic acid and its salts and esters falling
    within subheading 29.15 A I, originating in Brazil, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2364/87 de la Commission du 4 août 1987 portant rétablissement
    de la perception des droits de douane applicables à l' acide oxalique, ses sels
    et ses esters, de la sous-position 29.15 A I du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2364/87 der Kommission vom 4. August 1987 zur Wiedereinführung
    der Erhebung der Zölle für Oxalsäure, ihre Salze und Ester, der Tarifstelle
    29.15 A I des Gemeinsamen Zolltarifs mit Ursprung in Brasilien, dem die in der
    Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2364/87 af 4. august 1987 om genindførelse
    af opkrævning af told for oxalsyre samt salte og estere deraf, henhørende under
    29.15 A I, i den fælles toldtarif, og med oprindelse i Brasilien, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
