  content: COMMISSION REGULATION (EC) No 3095/93 of 9 November 1993 re-establishing
    the levying of customs duties on products of category 124 (order No 42.1240),
    originating in Belarus, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3095/93 de la Commission du 9 novembre 1993 portant
