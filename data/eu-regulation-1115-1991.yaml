  content: Council Regulation (EEC) No 1115/91 of 29 April 1991 imposing definitive
    anti-dumping duties in connection with the review of anti-dumping measures concerning
    imports of ferro-silicon originating in Brazil
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1115/91 DU CONSEIL du 29 avril 1991 instituant des
    droits antidumping définitifs dans le cadre de la procédure de réexamen des
    mesures antidumping applicables aux importations de ferrosilicium originaires
    du Brésil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1115/91 DES RATES vom 29. April 1991 zur Einführung
