---
id: EURegulation2017731
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2017/731 of 25 April 2017 amending
    model veterinary certificates BOV-X, BOV-Y, BOV and OVI set out in Annexes I and
    II to Regulation (EU) No 206/2010, the model certificates GEL, COL, RCG and TCG
    set out in Annex II to Implementing Regulation (EU) 2016/759 and the model certificate
    for composite products set out in Annex I to Regulation (EU) No 28/2012 in relation
    to the rules for the prevention, control and eradication of certain transmissible
    spongiform encephalopathies
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2017/731 de la Commission du 25 avril 2017
    modifiant les modèles des certificats vétérinaires BOV-X, BOV-Y, BOV et OVI,
    aux annexes I et II du règlement (UE) n° 206/2010, les modèles des certificats
    GEL, COL, RCG et TCG, à l'annexe II du règlement d'exécution (UE) 2016/759,
    et le modèle de certificat pour les produits composés, à l'annexe I du règlement
    (UE) n° 28/2012, en ce qui concerne les règles visant à prévenir, combattre
    et éradiquer certaines encéphalopathies spongiformes transmissibles
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2017/731 der Kommission vom 25. April 2017
    zur Änderung der Muster der Veterinärbescheinigungen BOV-X, BOV-Y, BOV und OVI
    in den Anhängen I und II der Verordnung (EU) Nr. 206/2010 sowie der Musterbescheinigungen
    GEL, COL, RCG und TCG in Anhang II der Durchführungsverordnung (EU) 2016/759
    und der Musterbescheinigung für zusammengesetzte Erzeugnisse in Anhang I der
    Verordnung (EU) Nr. 28/2012 hinsichtlich der Vorschriften zur Verhütung, Kontrolle
    und Tilgung bestimmter transmissibler spongiformer Enzephalopathien
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2017/731 на Комисията
    от 25 април 2017 година за изменение на образците
    на ветеринарни сертификати BOV-X, BOV-Y, BOV и OVI, установени
    в приложения I и II към Регламент (ЕС) № 206/2010,
    на образците на ветеринарни сертификати GEL,
    COL, RCG и TCG, установени в приложение II към Регламент
    за изпълнение (ЕС) 2016/759, и на образеца на сертификат
    за съставни продукти, установен в приложение
    I към Регламент (ЕС) № 28/2012, по отношение на правилата
    за превенция, контрол и ликвидиране на някои
    трансмисивни спонгиформни енцефалопатии
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2017/731 ze dne 25. dubna 2017, kterým
    se mění vzory veterinárních osvědčení BOV-X, BOV-Y, BOV a OVI stanovené
    v přílohách I a II nařízení (EU) č. 206/2010, vzory osvědčení GEL, COL,
    RCG a TCG stanovené v příloze II prováděcího nařízení (EU) 2016/759 a
    vzor osvědčení pro směsné produkty stanovený v příloze I nařízení (EU)
    č. 28/2012, pokud jde o pravidla pro prevenci, tlumení a eradikaci některých
    přenosných spongiformních encefalopatií
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2017/731 af 25. april 2017
    om ændring af standardveterinærcertifikaterne BOV-X, BOV-Y, BOV og OVI i bilag
    I og II til forordning (EU) nr. 206/2010, standardcertifikaterne GEL, COL, RCG
    og TCG i bilag II til gennemførelsesforordning (EU) 2016/759 og standardcertifikatet
    for sammensatte produkter i bilag I til forordning (EU) nr. 28/2012 for så vidt
    angår reglerne for forebyggelse af, kontrol med og udryddelse af visse transmissible
    spongiforme encephalopatier
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2017/731 της Επιτροπής,
    της 25ης Απριλίου 2017, για την τροποποίηση των
    υποδειγμάτων κτηνιατρικών πιστοποιητικών
    BOV-X, BOV-Y, BOV και OVI που περιέχονται στα παραρτήματα
    I και II του κανονισμού (ΕΕ) αριθ. 206/2010, των υποδειγμάτων
    πιστοποιητικών GEL, COL, RCG και TCG που περιέχονται
    στο παράρτημα II του εκτελεστικού κανονισμού
    (ΕΕ) 2016/759 και του υποδείγματος πιστοποιητικού
    για τα σύνθετα προϊόντα που περιέχεται στο
    παράρτημα I του κανονισμού (ΕΕ) αριθ. 28/2012 όσον
    αφορά τους κανόνες πρόληψης, καταπολέμησης
    και εξάλειψης ορισμένων μεταδοτικών σπογγωδών
    εγκεφαλοπαθειών
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2017/731, 25. aprill 2017, millega muudetakse
    seoses teatavate transmissiivsete spongioossete entsefalopaatiate vältimise,
    kontrolli ja likvideerimise eeskirjadega määruse (EL) nr 206/2010 I ja II lisas
    esitatud veterinaarsertifikaatide BOV-X, BOV-Y, BOV ja OVI näidiseid, rakendusmääruse
    (EL) 2016/759 II lisas esitatud näidissertifikaate GEL, COL, RCG ja TCG ning
    määruse (EL) nr 28/2012 I lisas esitatud liittoodete näidissertifikaati
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2017/731, annettu 25 päivänä
    huhtikuuta 2017, asetuksen (EU) N:o 206/2010 liitteissä I ja II esitettyjen eläinlääkärintodistuksen
    mallien BOV-X, BOV-Y, BOV ja OVI, täytäntöönpanoasetuksen (EU) 2016/759 liitteessä
    II esitettyjen todistusmallien GEL, COL, RCG ja TCG sekä asetuksen (EU) N:o 28/2012
    liitteessä I esitetyn elintarvikesekoituksia koskevan todistusmallin muuttamisesta
    siltä osin kuin kyse on tiettyjen tarttuvien spongiformisten enkefalopatioiden
    ehkäisyä, valvontaa ja hävittämistä koskevista säännöistä
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Komisije (EU) 2017/731 оd 25. travnja 2017. o izmjeni
    obrazaca veterinarskih certifikata BOV-X, BOV-Y, BOV i OVI utvrđenih u prilozima
    I. i II. Uredbi (EU) br. 206/2010, obrazaca certifikata GEL, COL, RCG i TCG utvrđenih
    u Prilogu II. Provedbenoj uredbi (EU) 2016/759 i obrasca certifikata za mješovite
    proizvode utvrđenog u Prilogu I. Uredbi (EU) br. 28/2012 u pogledu pravila za
    sprečavanje, kontrolu i iskorjenjivanje određenih transmisivnih spongiformnih
    encefalopatija
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/731 végrehajtási rendelete (2017. április 25.)
    a 206/2010/EU rendelet I. és II. mellékletében található BOV-X, BOV-Y, BOV
    és OVI állategészségügyi bizonyítványmintáknak, az (EU) 2016/759/EU végrehajtási
    rendelet II. mellékletében található GEL, COL, RCG és TCG bizonyítványmintáknak,
    valamint a 28/2012/EU rendelet I. mellékletében található, az összetett élelmiszer-készítményekre
    vonatkozó bizonyítványmintának az egyes fertőző szivacsos agyvelőbántalmak
    megelőzésére, az ellenük való védekezésre és a felszámolásukra vonatkozó
    szabályok tekintetében való módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2017/731 della Commissione, del 25 aprile
    2017, che modifica i modelli di certificati veterinari BOV-X, BOV-Y, BOV e OVI
    di cui agli allegati I e II del regolamento (UE) n. 206/2010, i modelli di certificati
    GEL, COL, RCG e TCG di cui all'allegato II del regolamento di esecuzione (UE)
    2016/759 e il modello di certificato per i prodotti composti di cui all'allegato
    I del regolamento (UE) n. 28/2012 per quanto riguarda le disposizioni per la prevenzione,
    il controllo e l'eradicazione di alcune encefalopatie spongiformi trasmissibili
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2017/731 (2017. gada 25. aprīlis),
    ar ko attiecībā uz noteikumiem par dažu transmisīvo sūkļveida encefalopātiju
    profilaksi, kontroli un izskaušanu groza Regulas (ES) Nr. 206/2010 I un II pielikumā
    sniegtos veterināro sertifikātu paraugus “BOV-X”, “BOV-Y”, “BOV”
    un “OVI”, Īstenošanas regulas (ES) 2016/759 II pielikumā sniegtos sertifikātu
    paraugus “GEL”, “COL”, “RCG” un “TCG”, kā arī Regulas (ES) Nr.
    28/2012 I pielikumā sniegto saliktiem produktiem paredzētā sertifikāta paraugu
  type: main
- language: lt
  script: Latn
  content: 2017 m. balandžio 25 d. Komisijos įgyvendinimo reglamentas (ES) 2017/731,
    kuriuo dėl tam tikrų užkrečiamųjų spongiforminių encefalopatijų prevencijos,
    kontrolės ir likvidavimo taisyklių iš dalies keičiami Reglamento (ES) Nr.
    206/2010 I ir II prieduose pateikti veterinarijos sertifikatų pavyzdžiai BOV-X,
    BOV-Y, BOV ir OVI, Įgyvendinimo reglamento (ES) 2016/759 II priede pateikti sertifikatų
    pavyzdžiai GEL, COL, RCG ir TCG ir Reglamento (ES) Nr. 28/2012 I priede pateikti
    sudėtinių produktų sertifikatų pavyzdžiai
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/731 tal-25 ta'
    April 2017 li jemenda l-mudell taċ-ċertifikati veterinarji BOV-X, BOV-Y, BOV
    u OVI stabbiliti fl-Annessi I u II tar-Regolament (UE) Nru 206/2010, il-mudelli
    taċ-ċertifikati GEL, COL, RCG u TCG stabbiliti fl-Anness II tar-Regolament ta'
    Implimentazzjoni (UE) 2016/759 u ċ-ċertifikat mudell għal prodotti komposti
    stabbilit fl-Anness I tar-Regolament (UE) Nru 28/2012 fir-rigward tar-regoli għall-prevenzjoni,
    il-kontroll u l-qerda ta' ċerti enċefalopatiji sponġiformi trażmissibbli
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2017/731 van de Commissie van 25 april 2017
    tot wijziging van de modellen van veterinaire certificaten BOV-X, BOV-Y, BOV en
    OVI in de bijlagen I en II bij Verordening (EU) nr. 206/2010, de modelcertificaten
    GEL, COL, RCG en TCG in bijlage II bij Uitvoeringsverordening (EU) 2016/759 en
    het modelcertificaat voor samengestelde producten in bijlage I bij Verordening
    (EU) nr. 28/2012 wat betreft de voorschriften inzake preventie, bestrijding en
    uitroeiing van bepaalde overdraagbare spongiforme encefalopathieën
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2017/731 z dnia 25 kwietnia 2017
    r. zmieniające wzory świadectw weterynaryjnych BOV-X, BOV-Y, BOV i OVI określone
    w załącznikach I i II do rozporządzenia (UE) nr 206/2010, wzory świadectw
    GEL, COL, RCG i TCG określone w załączniku II do rozporządzenia wykonawczego
    (UE) 2016/759 i wzór świadectwa dotyczącego produktów złożonych określony
    w załączniku I do rozporządzenia (UE) nr 28/2012 w odniesieniu do zasad dotyczących
    zapobiegania niektórym pasażowalnym encefalopatiom gąbczastym oraz ich kontroli
    i zwalczania
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2017/731 da Comissão, de 25 de abril de
    2017, que altera os modelos de certificados veterinários BOV-X, BOV-Y, BOV e
    OVI estabelecidos nos anexos I e II do Regulamento (UE) n.° 206/2010, os modelos
    de certificados GEL, COL, RCG e TCG estabelecidos no anexo II do Regulamento de
    Execução (UE) 2016/759 e o modelo de certificado para produtos compostos estabelecido
    no anexo I do Regulamento (UE) n.° 28/2012 no que se refere às regras para a
    prevenção, o controlo e a erradicação de determinadas encefalopatias espongiformes
    transmissíveis
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2017/731 al Comisiei din 25 aprilie
    2017 de modificare a modelelor de certificate sanitar-veterinare BOV-X, BOV-Y,
    BOV și OVI din anexele I și II la Regulamentul (UE) nr. 206/2010, a modelelor
    de certificate GEL, COL, RCG și TCG din anexa II la Regulamentul de punere în
    aplicare (UE) 2016/759 și a modelului de certificat pentru produsele compuse
    din anexa I la Regulamentul (UE) nr. 28/2012 în ceea ce privește normele pentru
    prevenirea, controlul și eradicarea anumitor forme de encefalopatii spongiforme
    transmisibile
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2017/731 z 25. apríla 2017, ktorým
    sa menia vzory veterinárnych osvedčení BOV-X, BOV-Y, BOV a OVI stanovené v
    prílohách I a II k nariadeniu (EÚ) č. 206/2010, vzory certifikátov GEL, COL,
    RCG a TCG stanovené v prílohe II k vykonávaciemu nariadeniu (EÚ) 2016/759
    a vzory osvedčení pre zložené produkty stanovené v prílohe I k nariadeniu
    (EÚ) č. 28/2012 vo vzťahu k pravidlám prevencie, kontroly a eradikácie niektorých
    transmisívnych spongiformných encefalopatií
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2017/731 z dne 25. aprila 2017 o spremembi
    vzorcev veterinarskih spričeval BOV-X, BOV-Y, BOV in OVI v prilogah I in II k
    Uredbi (EU) št. 206/2010, vzorcev veterinarskih spričeval GEL, COL, RCG in TCG
    v Prilogi II k Izvedbeni uredbi (EU) 2016/759 in vzorca veterinarskega spričevala
    za sestavljene proizvode v Prilogi I k Uredbi (EU) št. 28/2012 v zvezi s pravili
    za preprečevanje, nadzor in izkoreninjenje nekaterih transmisivnih spongiformnih
    encefalopatij
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2017/731 de la Comisión, de 25 de abril
    de 2017, que modifica los modelos de certificado veterinario BOV-X, BOV-Y, BOV
    y OVI que figuran en los anexos I y II del Reglamento (UE) n.° 206/2010, los
    modelos de certificado GEL, COL, RCG y TCG que figuran en el anexo II del Reglamento
    de Ejecución (UE) 2016/759 y el modelo de certificado para productos compuestos
    que figura en el anexo I del Reglamento (UE) n.° 28/2012 en relación con las
    normas para la prevención, el control y la erradicación de determinadas encefalopatías
    espongiformes transmisibles
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2017/731 av den 25 april 2017
    om ändring av förlagorna till veterinärintygen BOV-X, BOV-Y, BOV och OVI i
    bilagorna I och II till förordning (EU) nr 206/2010, förlagorna till intygen
    GEL, COL, RCG och TCG i bilaga II till genomförandeförordning (EU) 2016/759
    samt förlagan till intyg för sammansatta produkter i bilaga I till förordning
    (EU) nr 28/2012 med avseende på bestämmelserna för förebyggande, kontroll
    och utrotning av vissa typer av transmissibel spongiform encefalopati
