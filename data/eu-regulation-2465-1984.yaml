title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2465/84 of 27 August 1984 determining the
    actual production of unginned cotton for the 1983/84 marketing year and fixing
    the percentage of the aid to be paid by Member States for the 1984/85 marketing
    year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2465/84 de la Commission du 27 août 1984 établissant
    la production effective de coton non égrené de la campagne 1983/1984 ainsi que
    le pourcentage de l' aide que les États membres versent au titre de la campagne
    1984/1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2465/84 der Kommission vom 27. August 1984 zur Festlegung
    der tatsächlichen Erzeugung von nicht entkörnter Baumwolle im Wirtschaftsjahr
    1983/84 sowie des Prozentsatzes der von den Mitgliedstaaten für das Wirtschaftsjahr
    1984/85 zu zahlenden Beihilfe
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2465/84 af 27. august 1984 om fastsættelse
    af den faktiske produktion af ikke-egreneret bomuld i produktionsåret 1983/84
    samt den procentdel af støtten, som medlemsstaterne skal udbetale for produktionsåret
    1984/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2465/84 της Επιτροπής
    της 27ης Αυγούστου 1984 περί καθορισμού της πραγματικής
    παραγωγής του μη εκκοκκισμένου βάμβακος της
    περιόδου 1983/84 καθώς και του ποσοστού της ενισχύσεως
    που καταβάλλουν τα κράτη μέλη για την περίοδο
    1984/85
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2465/84 della Commissione del 27 agosto 1984 che fissa
    la produzione effettiva di cotone non sgranato della campagna 1983/1984, nonché
    la percentuale dell' aiuto che gli Stati membri versano a titolo della campagna
    1984/1985
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2465/84 van de Commissie van 27 augustus 1984 tot
    bepaling van de feitelijke produktie van niet-geëgreneerde katoen voor het verkoopseizoen
    1983/1984 alsmede van het steunpercentage dat de Lid-Staten voor het verkoopseizoen
    1984/1985 uitkeren
