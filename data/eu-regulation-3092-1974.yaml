id: EURegulation30921974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3092/74 of the Commission of 6 December 1974 re-establishing
    the levying of customs duties on portland cement, ciment fondu, slag cement, supersulphate
    cement and similar hydraulic cements, whether or not coloured in the form of clinker,
    falling within heading No 25.23, originating in developing countries to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3501/73
    of 18 December 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3092/74 de la Commission, du 6 décembre 1974, portant
    rétablissement de la perception des droits de douane applicables aux ciments
    hydrauliques (y compris les ciments non pulvérisés dits "clinkers"), même colorés,
    de la position tarifaire 25.23, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3501/73 du Conseil du 18 décembre 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3092/74 der Kommission vom 6. Dezember 1974 zur Wiedereinführung
    des Zollsatzes für Zement (einschließlich Zementklinker), auch gefärbt, der
    Tarifnummer 25.23, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3501/73 des Rates vom 18. Dezember 1973 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3092/74 af 6. december 1974 om genindførelse
    af opkrævning af toldafgifter for portlandcement, aluminatcement, slaggecement
    og lignende hydraulisk cement, også farvet eller i form af klinker under position
    25.23, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3501/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3092/74 della Commissione, del 6 dicembre 1974, che
    ripristina la riscossione dei dazi doganali applicabili ai cementi idraulici (compresi
    i cementi non polverizzati detti «clinkers»), anche colorati, della voce doganale
    n. 25.23, originari dei paesi in via di sviluppo beneficiari delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3501/73 del Consiglio, del 18 dicembre
    1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3092/74 van de Commissie van 6 december 1974 houdende
    wederinstelling van de heffing van de douanerechten voor hydraulisch cement (cementklinker
    daaronder begrepen), ook indien gekleurd van post 25.23, van oorsprong uit de
    ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3501/73 van
    de Raad van 18 december 1973 tariefpreferenties werden geopend
  type: main
