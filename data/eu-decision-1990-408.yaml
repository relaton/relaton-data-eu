title:
- language: en
  script: Latn
  content: '90/408/EEC: Council Decision of 27 July 1990 on the conclusion of the
    Agreement in the form of an exchange of letters concerning the provisional application
    of Protocol No 2 establishing for the period 1 April 1990 to 31 March 1991 the
    crawfish fishing opportunities and the corresponding financial compensation provided
    for in the Agreement on relations in the sea fisheries sector between the European
    Economic Community and the Kingdom of Morocco'
  type: main
- language: fr
  script: Latn
  content: '90/408/CEE: Décision du Conseil du 27 juillet 1990 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole n° 2 fixant les possibilités de pêche à la langouste et la compensation
    financière correspondante prévues dans l''accord sur les relations en matière
    de pêches maritimes entre la Communauté économique européenne et le Royaume
    du Maroc, pour la période du 1er avril 1990 au 31 mars 1991'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 27. Juli 1990 ueber den Abschluss des Abkommens
    in Form eines Briefwechsels ueber die vorlaeufige Anwendung des Protokolls Nr.
    2 zur Festsetzung der Fangmoeglichkeiten fuer die Langustenfischerei und des finanziellen
    Ausgleichs nach dem Abkommen ueber die Fischereibeziehungen zwischen der Europaeischen
    Wirtschaftsgemeinschaft und dem Koenigreich Marokko fuer die Zeit vom 1. April
    1990 bis zum 31. Maerz 1991 (90/408/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 27. juli 1990 om indgaaelse af aftalen 1 form af
    brevveksling om midlertidig anvendelse af protokol nr. 2 om fastsaettelse af mulighederne
    for fiskeri efter jomfruhummer og af den finansielle godtgoerelse, der er omhandlet
    i aftalen om forbindelserne mellem Det Europaeiske OEkonomiske Faellesskab og
    Kongeriget Marokko paa havfiskeriomraadet, for perioden 1. april 1990 til 31.
    marts 1991 (90/408/EOEF)
  type: main
- language: el
  script: Grek
  content: '90/408/ΕΟΚ: Απόφαση του Συμβουλίου της 27ης
    Ιουλίου 1990 σχετικά με τη σύναψη συμφωνίας υπό
    μορφή ανταλλαγής επιστολών όσον αφορά την
    προσωρινή εφαρμογή του πρωτοκόλλου αριθ. 2
    το οποίο καθορίζει τις δυνατότητες αλιείας
    αστακού και την αντίστοιχη χρηματοδοτική αντιστάθμιση
    οι οποίες προβλέπονται στη συμφωνία για τις
    σχέσεις στον τομέα της θαλάσσιας αλιείας μεταξύ
    της Ευρωπαϊκής Οικονομικής Κοινότητας και
    του Βασιλείου του Μαρόκου για την περίοδο από
    1ης Απριλίου 1990 έως 31 Μαρτίου 1991'
  type: main
- language: it
  script: Latn
  content: DECISIONE DEL CONSIGLIO del 27 luglio 1990 concernente la conclusione dell'accordo
    in forma di scambio di lettere relativo all'applicazione provvisoria del protocollo
    n. 2 che fissa le possibilità di pesca dell'aragosta e la compensazione finanziaria
    corrispondente previste nell'accordo sulle relazioni in materia di pesca marittima
    tra la Comunità economica europea ed il Regno del Marocco, per il periodo dal
    1o aprile 1990 al 31 marzo 1991 (90/408/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE RAAD van 27 juli 1990 betreffende de sluiting van de Overeenkomst
    in de vorm van een briefwisseling inzake de voorlopige toepassing van Protocol
    nr. 2 tot vaststelling van de voor de periode van 1 april 1990 tot en met 31 maart
    1991 geldende visserijrechten voor langoest en de financiële compensatie, als
    bedoeld in de Overeenkomst inzake de betrekkingen tussen de Europese Economische
    Gemeenschap en het Koninkrijk Marokko op het gebied van de zeevisserij (90/408/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 27 de Julho de 1990 relativa à celebraçao do Acordo
    sob forma de Troca de Cartas relativo à aplicaçao provisoria do Protocolo que
    fixa as possibilidades de pesca à lagosta e a compensaçao financeira correspondente
    previstas no Acordo sobre as relaçoes em matéria de pescas maritimas entre a
    Comunidade Economica Europeia e o Reino de Marrocos, para o periodo compreendido
    entre 1 de Abril de 1990 e 31 de Março de 1991 (90/408/CEE)
  type: main
- language: es
  script: Latn
  content: DECISION DEL CONSEJO de 27 de julio de 1990 relativa a la celebracion del
    Acuerdo en forma de Canje de Notas sobre la aplicacion provisional del Protocolo
    no 2 que fija las posibilidades de pesca de langosta y la compensacion financiera
    correspondiente previstas en el Acuerdo sobre las relaciones en materia de pesca
    maritima entre la Comunidad Economica Europea y el Reino de Marruecos durante
    el periodo comprendido entre el 1 de abril de 1990 y el 31 de marzo de 1991 (90/408/CEE)
