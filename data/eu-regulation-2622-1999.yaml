    van de specifieke regeling voor de voorziening van de Franse overzeese departementen
    (DOM) met graanproducten en tot vaststelling van de voorzieningsbalans
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2622/1999 da Comissão, de 10 de Dezembro de 1999,
