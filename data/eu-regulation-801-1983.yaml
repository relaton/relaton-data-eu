title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 801/83 of 6 April 1983 amending Regulation
    (EEC) No 1570/78 with regard to proof of utilization of maize groats and meal,
    quellmehl and broken rice in a Member State other than that required to pay the
    production refund
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 801/83 de la Commission du 6 avril 1983 modifiant le
    règlement (CEE) no 1570/78 en ce qui concerne la preuve de l' utilisation de
    gruaux et semoules de maïs, de "quellmehl" et de brisures de riz dans un État
    membre autre que celui qui est appelé à verser la restitution à la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 801/83 der Kommission vom 6. April 1983 zur Änderung
    der Verordnung (EWG) Nr. 1570/78 hinsichtlich des Nachweises der Verwendung von
    Grobgrieß und Feingrieß aus Mais, Quellmehl und Bruchreis in einem anderen Mitgliedstaat
    als dem, der die Erstattung bei der Erzeugung zu zahlen hat
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 801/83 af 6. april 1983 om ændring
    af forordning (EØF) nr. 1570/78 for så vidt angår beviset for anvendelse af
    grove og fine gryn af majs, kvældemel eller brudris i en anden medlemsstat end
    den, der skal betale produktionsrestitutionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 801/83 της Επιτροπής
    της 6ης Απριλίου 1983 για τροποποίηση του κανονισμού
    (ΕΟΚ) αριθ. 1570/78 όσον αφορά την απόδειξη χρήσεως
    πλιγουριών και σιμιγδαλιών αραβόσιτου, quellmehl
    και θραυσμάτων ορύζης σε Κράτος μέλος διαφορετικό
    από εκείνο που καλείται να καταβάλει την επιστροφή
    στην παραγωγή
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 801/83 della Commissione del 6 aprile 1983 che modifica
    il regolamento (CEE) n. 1570/78 per quanto concerne la prova dell' utilizzazione
    di semole e semolini di granturco, di quellmehl e di rotture di riso in uno Stato
    membro diverso da quello tenuto a versare la restituzione alla produzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 801/83 van de Commissie van 6 april 1983 tot wijziging
    van Verordening (EEG) nr. 1570/78 ten aanzien van het bewijs van het gebruik van
    gries en griesmeel van maïs, quellmehl of breukrijst in een andere Lid-Staat
    dan die welke de produktierestitutie moet betalen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 801/83 da Comissão, de 6 de Abril de 1983, que
    altera o Regulamento (CEE) n.° 1570/78 no que respeita à comprovação da utilização
    de sémulas e sémulas grossas de milho, de "quellmehl" e de trincas de arroz
    num Estado-membro que não seja o que é chamado a conceder a restituição à
    produção
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 801/83 de la Comisión, de 6 de abril de 1983, por
    el que se modifica el Reglamento (CEE) n° 1570/78 en lo que se refiere a la prueba
    de la utilización de grañones y sémolas de maíz, de "quellmehl" y de partidos
    de arroz en un Estado miembro que no sea aquél designado a pagar la restitución
    a la producción
  type: main
