    Eintrags zu den Vereinigten Staaten in der Liste von Drittländern, Gebieten,
    Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren in die Union eingeführt
    bzw. durch die Union durchgeführt werden dürfen, in Bezug auf die hochpathogene
    aviäre Influenza nach weiteren Ausbrüchen in diesem Land
  type: main
- language: bg
  script: Cyrl
