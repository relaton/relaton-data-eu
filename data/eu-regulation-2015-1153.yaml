title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/1153 of 14 July 2015 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for the United States
    in the list of third countries, territories, zones or compartments from which
    certain poultry commodities may be imported into or transit through the Union
    in relation to highly pathogenic avian influenza following further outbreaks in
    that country
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/1153 de la Commission du 14 juillet 2015
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives aux États-Unis sur la liste des pays tiers, territoires, zones ou compartiments
    en provenance desquels certains produits de volailles peuvent être importés
    dans l'Union ou transiter par celle-ci, pour ce qui est de l'influenza aviaire
    hautement pathogène, à la suite de l'apparition de nouveaux foyers dans ce pays
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/1153 der Kommission vom 14. Juli 2015
