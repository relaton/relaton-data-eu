title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1062/78 of 22 May 1978 re-establishing the
    levying of customs duties on other cotton yarn, not up for retail sale, falling
    within subheading 55.05 B I and originating in India, to which the preferential
    tariff arrangements set out in Regulation (EEC) No 2706/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1062/78 de la Commission, du 22 mai 1978, portant
    rétablissement de la perception des droits de douane applicables aux autres fils
    de coton, non conditionnées pour la vente au détail, de la sous- position tarifaire
    55.05 B I, originaires de l'Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2706/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1062/78 der Kommission vom 22. Mai 1978 über die
    Wiedereinführung des Zollsatzes für Baumwollgarne, nicht in Aufmachungen für
    den Einzelverkauf, der Tarifstelle 55.05 B I, mit Ursprung in Indien, dem die
    in der Verordnung (EWG) Nr. 2706/77 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1062/78 af 22. maj 1978 om genindførelse
    af opkrævning af toldafgifter for andet garn af bomuld, ikke i detailsalgsoplægninger,
    under underposition 55.05 B I, som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2706/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1062/78 della Commissione, del 22 maggio 1978, che
    ripristina la riscossione dei dazi doganali applicabili agli altri filati di cotone
    non preparati per la vendita al minuto, della sottovoce doganale 55.05 B I, originari
    dell'India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2706/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1062/78 van de Commissie van 22 mei 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere garens
    van katoen, niet gereed voor de verkoop in het klein, van post 55.05 B I, van
    oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 2706/77 van de Raad
  type: main
