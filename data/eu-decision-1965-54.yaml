title:
- language: fr
  script: Latn
  content: Décision 65/54/CEE de la Commission, du 21 décembre 1964, portant modification
    de sa décision du 6 novembre 1964, autorisant la perception de taxes compensatoires
    sur les importations en République française de sucreries sans cacao, ne contenant
    pas de liqueur alcoolique, en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: '65/54/EWG: Entscheidung der Kommission vom 21. Dezember 1964 zur Änderung
    ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Zuckerwaren ohne Kakaogehall, nicht alkoholhaltig, aus verschiedenen
    Mitgliedstaaten in die Französische Republik'
  type: main
- language: it
  script: Latn
  content: '65/54/CEE: Decisione della Commissione, del 21 dicembre 1964, che modifica
    la decisione del 6 novembre 1964, che autorizza la riscossione di tasse di compensazione
    sulle importazioni nella Repubblica francese di prodotti a base di zuccheri senza
    cacao, non contenenti sostanze alcoliche, in provenienza da alcuni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/54/EEG: Beschikking van de Commissie van 21 december 1964 tot wijziging
    van haar beschikking van 6 november 1964, houdende machtiging tot het leggen van
    een compenserende heffing op de invoer in de Franse Republiek van suikerwerk zonder
    cacao, geen likeur bevattend, uit bepaalde Lid-Staten'
  type: main
