title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1703/91 of 13 June 1991 introducing a temporary
    set-aside scheme for arable land for the 1991/92 marketing year and laying down
    special measures for that marketing year under the set-aside scheme provided for
    in Regulation (EEC) No 797/85
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 1703/91 DU CONSEIL du 13 juin 1991 introduisant un
    régime de retrait temporaire des terres arables pour la campagne 1991/1992 et
    prévoyant pour cette campagne des mesures spéciales dans le cadre du régime
    de retrait des terres prévu par le règlement (CEE) no 797/85 #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1703/91 DES RATES vom 13. Juni 1991 zur Einführung
    einer Regelung zur vorübergehenden Flächenstillegung im Wirtschaftsjahr 1991/92
    und zum Erlaß von Sondermaßnahmen für dieses Wirtschaftsjahr im Rahmen der
    Flächenstillegung nach der Verordnung (EWG) Nr. 797/85 #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1703/91 af 13. juni 1991 om indførelse af
    en ordning med midlertidig udtagning af landbrugsarealer for produktionsåret
    1991/92 og om fastsættelse for dette produktionsår af særforanstaltninger inden
    for rammerne af den i forordning (EØF) nr. 797/85 fastsatte ordning med udtagning
    af landbrugsarealer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1703/91 του Συμβουλίου
    της 13ης Ιουνίου 1991 που θεσπίζει το καθεστώς
    προσωρινής παύσης της καλλιέργειας αρόσιμων
    γαιών για την περίοδο 1991/92 και προβλέπει ειδικά
    μέτρα για την περίοδο αυτή στα πλαίσια του
    καθεστώτος παύσης της καλλιέργειας γαιών που
    προβλέπει ο κανονισμός (ΕΟΚ) αριθ. 797/85
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1703/91 DEL CONSIGLIO del 13 giugno 1991 che istituisce
    un regime di ritiro temporaneo dei seminativi dalla produzione per la campagna
    1991/1992 e che prevede, per detta campagna, misure speciali nell'' ambito del
    regime di ritiro dei seminativi dalla produzione previsto nel regolamento (CEE)
    n. 797/85 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1703/91 VAN DE RAAD van 13 juni 1991 tot invoering
    van een regeling voor het tijdelijk uit produktie nemen van bouwland voor het
    verkoopseizoen 1991/1992 en tot vaststelling van bijzondere maatregelen voor dat
    verkoopseizoen in het kader van de in Verordening (EEG) nr. 797/85 bedoelde regeling
    voor het uit produktie nemen van bouwland #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No. 1703/91 DO CONSELHO de 13 de Junho de 1991 que introduz
    um regime de retirada temporária das terras aráveis para a campanha de 1991/1992
    e prevê, para essa campanha, medidas especiais no âmbito do regime de retirada
    das terras previsto no Regulamento (CEE) no. 797/85 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1703/90 DEL CONSEJO de 13 de junio de 1991 por el
    que se crea un régimen de retirada temporal de tierras de cultivos herbáceos
    para la campaña 1991/92 y por el que se establecen para esta campaña medidas
    especiales en el marco del régimen de retirada de tierras previsto por el Reglamento
    (CEE) no 797/85 #'
