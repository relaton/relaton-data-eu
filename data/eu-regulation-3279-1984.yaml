title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3279/84 of 22 November 1984 opening, allocating
    and providing for the administration of a Community tariff quota for ferro-chromium
    containing not more than 0,10 % by weight of carbon and more than 30 % but not
    more than 90 % by weight of chromium (super-refined ferro-chromium), falling within
    subheading ex 73.02 E I of the Common Customs Tariff (1985)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3279/84 du Conseil du 22 novembre 1984 portant ouverture,
    répartition et mode de gestion du contingent tarifaire communautaire de ferrochrome
    contenant en poids 0,10 % ou moins de carbone et plus de 30 %, jusqu' à 90 %
    inclus, de chrome (ferrochrome surraffiné) de la sous-position ex 73.02 E I du
    tarif douanier commun (1985)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3279/84 des Rates vom 22. November 1984 zur Eröffnung,
    Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom mit
    einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und an
    Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs (1985)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3279/84 af 22. november 1984 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for ferrochrom med et
    kulstofindhold på 0,10 vægtprocent eller derunder og med et indhold af chrom
    (raffineret ferrochrom) på over 30 %, men højst 90 %, henhørende under pos.
    ex 73.02 E I i den fælles toldtarif (1985)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3279/84 του Συμβουλίου
    της 22ας Νοεμβρίου 1984 περί ανοίγματος, κατανομής
    και τρόπου διαχειρίσεως κοινοτικής δασμολογικής
    ποσοστώσεως για το σιδηροχρώμιο, που περιέχει
    κατά βάρος 0,10 ή λιγότερο άνθρακα και πλέον
    του 30 μέχρι 90 περιλαμβανομένου χρώμιο (σιδηροχρώμιο
    επαναδιυλισμένο), της διακρίσεως ex 73.02 Ε Ι του
    Κοινού Δασμολογίου (1985)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3279/84 del Consiglio del 22 novembre 1984 relativo
    all' apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e oltre il 30 % sino al 90 % incluso di cromo (ferro-cromo superraffinato),
    della sottovoce ex 73.02 E I della tariffa doganale comune (1985)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3279/84 van de Raad van 22 november 1984 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van post ex 73.02 E I van het gemeenschappelijk douanetarief (1985)
