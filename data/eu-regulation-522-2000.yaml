    ja muna-alan tuotteiden määrän määrittämisestä asetuksen (EY) N:o 1866/95
    mukaisesti
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 522/2000 della Commissione, del 10 marzo 2000, che
    stabilisce la quantità di taluni prodotti del settore delle uova e del pollame
    disponibile nel corso del secondo trimestre 2000 nel quadro del regolamento (CE)
    n. 1866/95
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 522/2000 van de Commissie van 10 maart 2000 tot vaststelling
