    Geflügelfleisch und Eier im Rahmen der Verordnung (EG) Nr. 1866/95
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 522/2000 af 10. marts 2000 om fastsættelse
    af den mængde, der er til rådighed for andet kvartal af 2000 for visse produkter
    fra sektoren for fjerkrækød og æg i forbindelse med forordning (EF) nr. 1866/95
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 522/2000 της Επιτροπής,
