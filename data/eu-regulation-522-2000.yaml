    ποσότητας για το δεύτερο τρίμηνο του 2000 για
    ορισμένα προϊόντα του τομέα του κρέατος πουλερικών
    και των αυγών στα πλαίσια του κανονισμού (ΕΚ)
    αριθ. 1866/95
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 522/2000, annettu 10 päivänä maaliskuuta 2000,
