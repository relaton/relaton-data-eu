  script: Latn
  content: Commission Regulation (EC) No 522/2000 of 10 March 2000 establishing the
    quantity of certain poultrymeat and eggs sector products available for the second
    quarter of 2000 pursuant to Regulation (EC) No 1866/95
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 522/2000 de la Commission, du 10 mars 2000, déterminant
