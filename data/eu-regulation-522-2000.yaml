    die, op grond van Verordening (EG) nr. 1866/95, beschikbaar is voor het tweede
    kwartaal van 2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 522/2000 da Comissão, de 10 de Março de 2000, que
    determina a quantidade disponível de determinados produtos do sector dos ovos
    e da carne de aves de capoeira, para o segundo trimestre de 2000, no âmbito do
    Regulamento (CE) n.° 1866/95
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 522/2000 de la Comisión, de 10 de marzo de 2000, por
