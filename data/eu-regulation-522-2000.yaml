    du secteur de la viande de volaille et des oeufs dans le cadre du règlement (CE)
    n° 1866/95
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 522/2000 der Kommission vom 10. März 2000 zur Festsetzung
