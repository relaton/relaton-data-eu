    für Vorausfestsetzungsbescheinigungen für bestimmte landwirtschaftliche Erzeugnisse,
    die in Form von nicht unter Anhang II des Vertrages fallenden Waren ausgeführt
    werden, hinsichtlich der Geltungsdauer der Vorausfestsetzungsbescheinigungen für
    Milcherzeugnisse
  type: main
- language: da
  script: Latn
