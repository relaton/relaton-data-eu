title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2155/98 of 7 October 1998 derogating from
    Regulation (EC) No 1223/94 laying down special detailed rules for the application
    of the system of advance-fixing certificates for certain agricultural products
    exported in the form of goods not covered by Annex II to the Treaty as regards
    the period of validity of the advance-fixing certificates for milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2155/98 de la Commission du 7 octobre 1998 dérogeant
    au règlement (CE) nº 1223/94 portant modalités particulières d'application
    du régime des certificats de préfixation pour certains produits agricoles exportés
    sous forme de marchandises ne relevant pas de l'annexe II du traité en ce qui
    concerne la durée de validité des certificats de préfixation pour les produits
    laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2155/98 der Kommission vom 7. Oktober 1998 zur Abweichung
