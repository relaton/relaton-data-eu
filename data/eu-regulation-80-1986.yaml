    Beträge, die auf die das Gebiet 5 verlassenden Erzeugnisse zu erheben sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 80/86 af 16. januar 1986 om fastsættelse
