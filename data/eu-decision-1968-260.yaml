title:
- language: fr
  script: Latn
  content: Décision du Conseil du 18 juin 1968, portant suspension temporaire du
    droit du Tarif douanier commun applicable aux aminés, de constitution chimique
    non définie, de la position Ex 38.19 Q IV, et aux résines époxydes, sous forme
    liquide ou pâteuse ou en poudres, de la position Ex 39.01 C IV, destinées à
    la construction d'avions
  type: main
- language: de
  script: Latn
  content: '68/260/EWG: Entscheidung des Rates vom 18. Juni 1968 über die zeitweilige
    Aussetzung des Zollsatzes des Gemeinsamen Zolltarifs für Amine, chemisch nicht
    einheitlich, der Tarifstelle ex 38.19 Q IV sowie für zum Bau von Flugzeugen bestimmte
    Epoxyharze, flüssig, teigförmig oder als Pulver, der Tarifstelle ex 39.01 C
    IV'
  type: main
- language: it
  script: Latn
  content: '68/260/CEE: Decisione del Consiglio, del 18 giugno 1968, relativa alla
    sospensione temporanea del dazio della tariffa doganale comune applicabile alle
    ammine, di costituzione chimica non definita, della voce ex 38.19 Q IV ed alle
    resine epossidiche sotto forma liquida o pastosa, o in polveri della voce ex 39.01
    C IV destinate alla costruzione di aerei'
  type: main
- language: nl
  script: Latn
  content: '68/260/EEG: Beschikking van de Raad van 18 juni 1968 houdende tijdelijke
    schorsing van het recht van het gemeenschappelijk douanetarief voor aminen, van
    chemisch niet welbepaalde verbindingen, van post ex 38.19 Q IV, en voor epoxyharsen,
    vloeibaar, in pastavorm of in poeder, van post ex 39.01 C IV, die zijn bestemd
    voor de bouw van vliegtuigen'
