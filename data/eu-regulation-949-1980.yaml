title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 949/80 of 17 April 1980 re-establishing
    the levying of the customs duties on wrought plates, sheets and strips, of aluminium,
    falling within heading No 76.03 and originating in Yugoslavia, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 949/80 de la Commission, du 17 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux tôles,
    planches, feuilles et bandes en aluminium, d' une épaisseur de plus de 0,20 millimètre,
    de la position 76.03 du tarif douanier commun, originaires de Yougoslavie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 949/80 der Kommission vom 17. April 1980 zur Wiedereinführung
    des Zollsatzes für Bleche, Platten, Tafeln und Bänder, aus Aluminium, mit einer
    Dicke von mehr als 0,20 mm, der Tarifnummer 76.03, mit Ursprung in Jugoslawien,
    dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 949/80 af 17. april 1980 om genindførelse
    af opkrævning af toldafgifter for plader og bånd af aluminium under pos. 76.03,
    som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 949/80 della Commissione, del 17 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle lamiere, lastre,
    fogli e nastri, di alluminio, di spessore superiore a 0,20 mm, della voce 76.03
    della tariffa doganale comune, originari della Iugoslavia beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2789/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 949/80 van de Commissie van 17 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op platen,
    bladen en strippen, van aluminium, met een dikte van meer dan 0,20 mm, van post
    76.03, van oorsprong uit Joegoslavië, ten behoeve waarvan bij Verordening (EEG)
    nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
