    arklinių šeimos gyvūnus ir arklių rūšių spermą, kiaušialąstes ir embrionus,
    sąrašą ir iš dalies pakeičiantis Sprendimus 93/195/EEB ir 94/63/EB (pranešta
    dokumentu Nr. C(2003) 5242)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-6 ta' Jannar 2004 li tistabbilixxi l-lista
