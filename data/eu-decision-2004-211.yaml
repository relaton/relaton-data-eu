    behozatalára feljogosított harmadik országok és azok részei jegyzékének
    megállapításáról, valamint a 93/195/EGK és a 94/63/EK határozat módosításáról
    (az értesítés a C(2003) 5242. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: '2004/211/CE: Decisione della Commissione, del 6 gennaio 2004, che stabilisce
    l''elenco dei paesi terzi e delle parti di territorio dei paesi terzi da cui gli
    Stati membri autorizzano le importazioni di equidi vivi nonché di sperma, ovuli
    ed embrioni della specie equina e che modifica le decisioni 93/195/CEE e 94/63/CE
    [notificata con il numero C(2003) 5242]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2004. gada 6. janvāris), kurā izstrādāts to trešo
    valstu un ar tām saistīto teritoriju daļu saraksts, no kurām dalībvalstis
    atļauj ievest dzīvus zirgu dzimtas dzīvniekus un to spermu, olšūnas un embrijus,
    un ar ko groza Lēmumus 93/195/EEK un 94/63/EK (izziņots ar dokumenta numuru
    C(2003) 5242)
  type: main
- language: lt
  script: Latn
  content: 2004 m. sausio 6 d. Komisijos sprendimas, nustatantis trečiųjų šalių
