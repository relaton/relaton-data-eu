    Membri jawtorizzaw l-importazzjoni ta' equidae ħajjin u ta' semen, ova u embrijoni
    ta' l-ispeċi ekwina, u li temenda d-Deċiżjonijiet Nru 93/195/KEE u 94/63/KE
    (notifikata bid-dokument numru K(2003) 5242)
  type: main
