title:
- language: en
  script: Latn
  content: '2004/211/EC: Commission Decision of 6 January 2004 establishing the list
    of third countries and parts of territory thereof from which Member States authorise
    imports of live equidae and semen, ova and embryos of the equine species, and
    amending Decisions 93/195/EEC and 94/63/EC (notified under document number C(2003)
    5242)'
  type: main
- language: fr
  script: Latn
  content: '2004/211/CE: Décision de la Commission du 6 janvier 2004 établissant
    la liste des pays tiers et des parties de territoires de ces pays en provenance
    desquels les États membres autorisent les importations d''équidés vivants et
    de sperme, d''ovules et d''embryons de l''espèce équine, et modifiant les décisions
    93/195/CEE et 94/63/CE [notifée sous le numéro C(2003) 5242]'
  type: main
- language: de
  script: Latn
  content: '2004/211/EG: Entscheidung der Kommission vom 6. Januar 2004 zur Erstellung
    der Liste von Drittländern und Teilen von Drittländern, aus denen die Mitgliedstaaten
    die Einfuhr von lebenden Equiden sowie von Equidensperma, -eizellen und -embryonen
    zulassen, und zur Änderung der Entscheidungen 93/195/EWG und 94/63/EG (Bekannt
    gegeben unter Aktenzeichen K(2003) 5242)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 6 януари 2004 година
    относно установяване на списъка на трети страни
    и части от техните територии, от които държавите-членки
    разрешават вноса на живи еднокопитни и на сперма,
    яйцеклетки и ембриони от еднокопитни и за изменение
    на Решения 93/195/ЕИО и 94/63/ЕО (нотифицирано под
    номер С(2003)5242)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 6. ledna 2004, kterým se stanoví seznam třetích
    zemí a částí jejich území, ze kterých členské státy povolují dovoz
    živých koňovitých a spermatu, vajíček a embryí druhů koňovitých, a kterým
    se mění rozhodnutí 93/195/EHS a 94/63/ES (oznámeno pod číslem K(2003) 5242)
  type: main
- language: da
  script: Latn
  content: '2004/211/EF: Kommissionens beslutning af 6. januar 2004 om listen over
    tredjelande og dele af tredjelande, hvorfra medlemsstaterne tillader import af
    levende dyr af hestefamilien samt sæd, æg og embryoner fra dyr af hestefamilien,
    og om ændring af beslutning 93/195/EØF og 94/63/EF (meddelt under nummer K(2003)
    5242)'
  type: main
- language: el
  script: Grek
  content: '2004/211/ΕΚ: Απόφαση της Επιτροπής, της 6ης
    Ιανουαρίου 2004, για την κατάρτιση καταλόγου
    των τρίτων χωρών και των περιοχών τους από
    τις οποίες τα κράτη μέλη εγκρίνουν τις εισαγωγές
    ζώντων ιπποειδών και σπέρματος, ωαρίων και
    εμβρύων ιπποειδών και για την τροποποίηση
    των αποφάσεων 93/195/ΕOΚ και 94/63/ΕΚ [κοινοποιηθείσα
