title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2225/72 de la Commission, du 19 octobre 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux autres carreaux, pavés et dalles de pavement ou de revêtement de la position
    tarifaire 69.08 originaires de la Corée du Sud, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre
    1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2225/72 der Kommission vom 19. Oktober 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Fliesen, gebrannte Pflastersteine,
    Boden- und Wandplatten, glasiert, der Tarifnummer 69.08, mit Ursprung in Süd-Korea,
    dem die in der Verordnung (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2225/72 della Commissione, del 19 ottobre 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili alle
    altre piastrelle, blocchetti e lastre da pavimentazione o da rivestimento della
    voce doganale n. 69.08 originari della Corea del Sud, beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre
    1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2225/72 van de Commissie van 19 oktober 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op andere plavuizen en andere vloer- en wandtegels van post 69.08,
    van oorsprong uit Korea (Zuid-), ten behoeve waarvan bij Verordening (EEG) nr.
    2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties werden geopend
  type: main
