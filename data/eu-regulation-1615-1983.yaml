title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1615/83 of 15 June 1983 amending Regulation
    (EEC) No 1602/82 fixing the coefficients to be applied to the production aid for
    tomato concentrates and prunes and to the minimum price for dried plums (prunes
    d' Ente)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1615/83 de la Commission du 15 juin 1983 modifiant
    le règlement (CEE) no 1602/82 fixant les coefficients à appliquer au montant
    de l' aide à la production pour les concentrés de tomates et les pruneaux et
    au prix minimal fixé pour les prunes d' Ente séchées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1615/83 der Kommission vom 15. Juni 1983 zur Änderung
    der Verordnung (EWG) Nr. 1602/82 zur Festsetzung der Koeffizienten, mit denen
    der für Tomatenmark und Trockenpflaumen festgesetzte Betrag der Produktionsbeihilfe
    und der für getrocknete Pflaumen (prunes d' Ente) festgesetzte Mindestpreis zu
    multiplizieren sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1615/83 af 15. juni 1983 om ændring
    af forordning (EØF) nr. 1602/82 om fastsættelse af de koefficienter, hvormed
    producentstøtten for tomatkoncentrater og svesker samt minimumsprisen for tørrede
    blommer ("prune d' Ente") skal multipliceres
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1615/83 της Επιτροπής
    της 15ης Ιουνίου 1983 περί τροποποιήσεως του κανονισμού
    (ΕΟΚ) αριθ. 1602/82 περί καθορισμού των συντελεστών
    που πρέπει να εφαρμοσθούν στο ποσό της ενισχύσεως
    στην παραγωγή για τον τοματοπολτό και τα αποξηραμένα
    δαμάσκηνα καθώς και στην ελάχιστη τιμή που
    καθορίζεται για τα αποξηραμένα δαμάσκηνα d'
    Ente
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1615/83 della Commissione del 15 giugno 1983 che modifica
    il regolamento (CEE) n. 1602/82, che stabilisce i coefficienti da applicare all'
    aiuto alla produzione per i concentrati di pomodori e per le prugne secche ed
    al prezzo minimo fissato per le susine da innesto (prunes d' Ente)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1615/83 van de Commissie van 15 juni 1983 houdende
    wijziging van Verordening (EEG) nr. 1602/82 tot vaststelling van de coëfficiënten
    die moeten worden toegepast op het bedrag van de steun bij de produktie die voor
    tomatenconcentraat en pruimedanten en op de voor gedroogde geënte pruimen (,,Prunes
    d' Ente' ' ) vastgestelde minimumprijs
  type: main
