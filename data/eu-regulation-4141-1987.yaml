  script: Latn
  content: Commission Regulation (EEC) No 4141/87 of 9 December 1987 determining the
    conditions under which goods for certain categories of aircraft and ships are
    eligible on import for a favourable tariff arrangement by reason of their sub-use
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4141/87 de la Commission du 9 décembre 1987 déterminant
    les conditions d' admission de produits destinés à certaines catégories d'
    aéronefs ou de bateaux au bénéfice d' un régime tarifaire favorable à l'
    importation en raison de leur destination particulière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4141/87 der Kommission vom 9. Dezember 1987 zur Festlegung
    der Voraussetzungen für die Zulassung von Waren, die für bestimmte Arten von
    Luft- und Wasserfahrzeugen bestimmt sind, zur abgabenbegünstigten Einfuhr aufgrund
    ihrer besonderen Verwendung
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 4141/87 af 9. december 1987 om fastsættelse
    af betingelserne for adgang til toldlempelse ved indførsel af varer, bestemt
    til visse fly- eller skibskategorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4141/87 της Επιτροπής
    της 9ης Δεκεμβρίου 1987 για τον καθορισμό των
    όρων υπαγωγής προϊόντων που προορίζονται για
    ορισμένες κατηγορίες αεροσκαφών ή πλοίων σε
    ευνοϊκό δασμολογικό καθεστώς κατά την εισαγωγή
    λόγω του ειδικού προορισμού τους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 4141/87 della Commissione del 9 dicembre 1987 che
    determina le condizioni per l' ammissione di taluni prodotti destinati a talune
    categorie di aeromobili o di navi al beneficio di un regime tariffario favorevole
    all' importazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 4141/87 van de Commissie van 9 december 1987 tot
    vaststelling van de voorwaarden en bepalingen waaraan voor produkten die voor
    bepaalde categorieën vliegtoestellen of schepen zijn bestemd, bij invoer, de
    toepassing van een gunstige tariefregeling in verband met de bijzondere bestemming
    van die produkten is onderworpen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 4141/87 da Comissão de 9 de Dezembro de 1987, que
    determina as condições a que se subordina a admissão de produtos destinados
    a determinadas categorias de aeródinos ou de embarcações ao benefício de um
    regime pautal favorável à importação em função do fim especial a que se
    destinam
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 4141/87 de la Comisión de 9 de diciembre de 1987
    por el que se determinan las condiciones de admisión de productos destinados
    a determinadas categorías de aeronaves o de buques a los beneficios de un régimen
    arancelario de importación favorable, en razón de su destino especial
  type: main
