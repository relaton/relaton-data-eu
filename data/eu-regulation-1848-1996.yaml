    της 25ης Σεπτεμβρίου 1996 για τον καθορισμό σε
    ποιό βαθμό μπορούν να γίνουν αποδεκτές οι αιτήσεις
    χορηγήσεως πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Σεπτέμβριο 1996 για τις δασμολογικές ποσοστώσεις
    για το βόειο κρέας που προβλέπονται στις συμφωνίες
    ελεύθερων συναλλαγών μεταξύ της Κοινότητας,
    αφενός, και της Εσθονίας, της Λετονίας και της
    Λιθουανίας, αφετέρου
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1848/96, annettu 25 päivänä syyskuuta 1996,
    yhteisön sekä Viron, Latvian ja Liettuan välisissä vapaakauppasopimuksissa
    määrättyjä naudanlihan tariffikiintiöitä koskevien, syyskuussa 1996 jätettyjen
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1848/96 DELLA COMMISSIONE del 25 settembre 1996 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel settembre 1996 per i contingenti tariffari di carni bovine previsti
    dagli accordi di liberalizzazione degli scambi tra la Comunità, da un lato, e
    l'Estonia, la Lettonia e la Lituania, dall'altro
  type: main
- language: nl
