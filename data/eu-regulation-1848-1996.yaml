title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1848/96 of 25 September 1996 determining
    the extent to which import licence applications submitted in September 1996 under
    the tariff quotas for beef provided for in the Agreements on free trade between
    the Community, of the one part, and Lithuania, Latvia, and Estonia, of the other
    part, may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1848/96 DE LA COMMISSION du 25 septembre 1996 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en septembre 1996 pour les contingents tarifaires de la viande bovine
    prévus dans les accords sur la libéralisation des échanges entre la Communauté,
    d'une part, et l'Estonie, la Lettonie et la Lituanie, d'autre part
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1848/96 DER KOMMISSION vom 25. September 1996 zur Bestimmung
    des Ausmaßes, in dem den im September 1996 gestellten Anträgen auf Erteilung
    von Einfuhrlizenzen im Rahmen der in den Freihandelsabkommen zwischen der Gemeinschaft
    einerseits und Litauen, Lettland und Estland andererseits vorgesehenen Zollkontingente
    für Rindfleisch stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1848/96 af 25. september 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om importlicenser indgivet
    i september 1996 for de toldkontingenter i oksekødssektoren, der er fastsat i
    frihandelsaftalerne mellem Fællesskabet på den ene side og Estland, Letland
    og Litauen på den anden side
  type: main
- language: el
  script: Grek
