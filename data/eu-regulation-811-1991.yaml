  content: Council Regulation (EEC) No 811/91 of 27 March 1991 amending for the third
    time Regulation (EEC) No 2340/90 preventing trade by the Community as regards
    Iraq and Kuwait
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 811/91 DU CONSEIL du 27 mars 1991 modifiant, pour
    la troisième fois, le règlement (CEE) no 2340/90 empêchant les échanges de
    la Communauté concernant l'' Irak et le Koweït #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 811/91 DES RATES vom 27. März 1991 zur dritten Änderung
    der Verordnung (EWG) Nr. 2340/90 zur Verhinderung des Irak und Kuwait betreffenden
    Handelsverkehrs der Gemeinschaft #'
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 811/91 af 27. marts 1991 om tredje ændring
    af forordning (EØF) nr. 2340/90 om forhindring af Fællesskabets samhandel for
    så vidt angår Irak og Kuwait
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 811/91 του Συμβουλίου
