    φορά, τον κανονισμό (ΕΟΚ) αριθ. 2340/90 που παρεμποδίζει
    τις συναλλαγές της Κοινότητας που αφορούν
    το Ιράκ και το Κουβέιτ
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (ETY) N:o 811/91, annettu 27 päivänä maaliskuuta 1991,
    yhteisön Irakin ja Kuwaitin kanssa käymän kaupan estämiseksi annetun asetuksen
    (ETY) N:o 2340/90 muuttamisesta kolmannen kerran
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 811/91 DEL CONSIGLIO del 27 marzo 1991 recante terza
    modifica del regolamento (CEE) n. 2340/90 che impedisce gli scambi della Comunità
    per quanto riguarda l'' Iraq e il Kuwait #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 811/91 VAN DE RAAD van 27 maart 1991 houdende derde
