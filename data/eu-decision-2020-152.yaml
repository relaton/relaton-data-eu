---
id: EUDecision2020152
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/152 of 3 February 2020 prohibiting
    Romania to repeat granting authorisations under Article 53(1) of Regulation (EC)
    No 1107/2009 for the plant protection products containing the active substance
    clothianidin or imidacloprid for use on Brassica napus against Phyllotreta spp.
    or Psylliodes spp. (notified under document C(2020) 458) (Only the Romanian text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/152 de la Commission du 3 février 2020
    interdisant à la Roumanie de renouveler l’octroi d’autorisations au titre
    de l’article 53, paragraphe 1, du règlement (CE) no 1107/2009 pour les produits
    phytopharmaceutiques contenant les substances actives clothianidine ou imidaclopride
    en vue de leur utilisation sur Brassica napus afin de lutter contre Phyllotreta
    spp. ou Psylliodes spp. [notifiée sous le numéro C(2020) 458] (Le texte en langue
    roumaine est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/152 der Kommission vom 3. Februar 2020
    über ein Verbot, mit dem Rumänien die erneute Erteilung von Zulassungen gemäß
    Artikel 53 Absatz 1 der Verordnung (EG) Nr. 1107/2009 für Pflanzenschutzmittel
    mit dem Wirkstoff Clothianidin oder Imidacloprid zur Anwendung bei Brassica napus
    gegen Phyllotreta spp. oder Psylliodes spp. untersagt wird (Bekannt gegeben unter
    Aktenzeichen C(2020) 458) (Nur der rumänische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/152 на Комисията
    от 3 февруари 2020 година с което се забранява
    на Румъния да издава отново разрешения съгласно
    член 53, параграф 1 от Регламент (ЕО) № 1107/2009 за
    продукти за растителна защита, съдържащи активното
    вещество клотианидин или имидаклоприд, за
    употреба върху Brassica napus срещу Phyllotreta spp. или
    Psylliodes spp. (нотифицирано под номер С(2020) 458) (само
    текстът на румънски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/152 ze dne 3. února 2020, kterým
    se Rumunsku zakazuje opakovaně udělovat povolení podle čl. 53 odst. 1 nařízení
    (ES) č. 1107/2009 pro přípravky na ochranu rostlin obsahující účinnou látku
    klothianidin nebo imidakloprid pro použití u plodiny Brassica napus proti škodlivým
    organismům Phyllotreta spp. nebo Psylliodes spp. (oznámeno pod číslem C(2002)
    458) (Pouze rumunské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/152 af 3. februar 2020
    om forbud mod, at Rumænien igen udsteder godkendelser i henhold til artikel 53,
    stk. 1, i forordning (EF) nr. 1107/2009 af plantebeskyttelsesmidler, der indeholder
    aktivstoffet clothianidin eller imidacloprid, til anvendelse på Brassica napus
    mod Phyllotreta spp. eller Psylliodes spp. (meddelt under nummer C(2020) 458)
    (Kun den rumænske tekst er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση 2020/152 της Επιτροπής
    της 3ης Φεβρουαρίου 2020 η οποία απαγορεύει στη
    Ρουμανία να επαναλάβει τη χορήγηση αδειών
    σύμφωνα με το άρθρο 53 παράγραφος 1 του κανονισμού
    (ΕΚ) αριθ. 1107/2009 στα φυτοπροστατευτικά προϊόντα
    που περιέχουν τη δραστική ουσία clothianidin (κλοθειανιδίνη)
    ή imidacloprid (ιμιδακλοπρίδη) για χρήση σε φυτά Brassica
    napus ενάντια στους επιβλαβείς οργανισμούς Phyllotreta
    spp. ή Psylliodes spp. [κοινοποιηθείσα υπό τον αριθμό
    C(2020) 458] (Το κείμενο στη ρουμανική γλώσσα είναι
    το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/152, 3. veebruar 2020, millega keelatakse
    Rumeenial anda kooskõlas määruse (EÜ) nr 1107/2009 artikli 53 lõikega 1 uuesti
    luba toimeainet klotianidiini või imidaklopriidi sisaldavate taimekaitsevahendite
    kasutamiseks Brassica napus’e puhul Phyllotreta spp. või Psylliodes spp. vastu
    (teatavaks tehtud numbri C(2020) 458 all) (Ainult rumeeniakeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/152, annettu 3 päivänä
    helmikuuta 2020, Romanialle osoitettavasta kiellosta toistaa asetuksen (EY) N:o
    1107/2009 53 artiklan 1 kohdan nojalla myönnettäviä lupia tehoainetta klotianidi
    tai imidaklopridi sisältäville kasvinsuojeluaineille käytettäväksi Brassica
    napus -kasvin pinnalla tuholaisten Phyllotreta spp. tai Psylliodes spp. torjuntaan
    (tiedoksiannettu numerolla C(2020) 458) (Ainoastaan romaniankielinen teksti on
    todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena Odluka Komisije (EU) 2020/152 оd 3. veljače 2020. o zabrani
    Rumunjskoj da ponovno izdaje odobrenja iz članka 53. stavka 1. Uredbe (EZ) br.
    1107/2009 za sredstva za zaštitu bilja koja sadržavaju aktivnu tvar klotianidin
    ili imidakloprid za uporabu na Brassica napus protiv Phyllotreta spp. ili Psylliodes
    spp. (priopćeno pod brojem dokumenta C(2020) 458) (Vjerodostojan je samo tekst
    na rumunjskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/152 végrehajtási határozata (2020. február 3.)
    a klotianidin vagy imidakloprid hatóanyagot tartalmazó, a Brassica napus esetében
    a Phyllotreta spp. vagy a Psylliodes spp. ellen használt növényvédő szerekre
    vonatkozó, az 1107/2009/EK rendelet 53. cikkének (1) bekezdése szerinti engedélyek
    Románia általi ismételt megadásának megtiltásáról (az értesítés a C(2020)
    458. számú dokumentummal történt) (Csak a román nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/152 della Commissione del 3 febbraio
    2020 che vieta alla Romania di ripetere la concessione di autorizzazioni a norma
    dell’articolo 53, paragrafo 1, del regolamento (CE) n. 1107/2009 per i prodotti
    fitosanitari contenenti la sostanza attiva clothianidin o imidacloprid per l’uso
    su Brassica napus contro Phyllotreta spp o Psylliodes spp [notificata con il numero
    C(2020) 458] (Il testo in lingua rumena è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/152 (2020. gada 3. februāris),
    ar ko atbilstīgi Regulas (EK) Nr. 1107/2009 53. panta 1. punktam Rumānijai aizliedz
    atkārtoti piešķirt atļaujas augu aizsardzības līdzekļiem, kuri satur darbīgo
    vielu klotianidīnu vai imidakloprīdu, lietošanai attiecībā uz Brassica napus
    pret Phyllotreta spp. vai Psylliodes spp. (izziņots ar dokumenta numuru C(2020)
    458) (Dokuments attiecas uz EEZ) (Autentisks ir tikai teksts rumāņu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Sprendimas (ES) 2020/152 2020 m. vasario 3 d. kuriuo
    Rumunijai draudžiama pagal Reglamento (EB) Nr. 1107/2009 53 straipsnio 1 dalį
    perregistruoti augalų apsaugos produktus, kurių sudėtyje yra veikliųjų medžiagų
    klotianidino arba imidakloprido ir kurie skirti Brassica napus apsaugoti nuo Phyllotreta
    spp. arba Psylliodes spp. (pranešta dokumentu Nr. C(2020) 458) (Tekstas autentiškas
    tik rumunų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/152 tat-3
    ta’ Frar 2020 li tipprojbixxi lir-Rumanija milli terġa’ tagħti l-awtorizzazzjonijiet
    skont l-Artikolu 53(1) tar-Regolament (KE) Nru 1107/2009 għall-prodotti għall-protezzjoni
    tal-pjanti li fihom is-sustanza attiva clothianidin jew imidacloprid għall-użu
    fuq Brassica napus kontra Phyllotreta spp. jew Psylloides spp. (notifikata bid-dokument
    C(2020) 458) (It-test Rumen biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/152 van de Commissie van 3 februari 2020 betreffende
    een verbod voor Roemenië om op grond van artikel 53, lid 1, van Verordening (EG)
    nr. 1107/2009 opnieuw toelatingen te verlenen voor gewasbeschermingsmiddelen met
    de werkzame stof clothianidin of imidacloprid ter bestrijding van Phyllotreta
    spp. en/of Psylliodes spp. op Brassica napus (Kennisgeving geschied onder nummer
    C(2020) 458) (Slechts de tekst in de Roemeense taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/152 z dnia 3 lutego 2020 r. zakazująca
    Rumunii ponownego udzielania zezwoleń, zgodnie z art. 53 ust. 1 rozporządzenia
    (WE) nr 1107/2009, na środki ochrony roślin zawierające substancję czynną
    klotianidyna lub imidachlopryd do stosowania w odniesieniu do Brassica napus przeciwko
    Phyllotreta spp. lub Psylliodes spp. (notyfikowana jako dokument nr C(2020) 458)
    (Jedynie tekst w języku rumuńskim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/152 da Comissão de 3 de fevereiro de
    2020 que proíbe a Roménia de repetir a concessão de autorizações ao abrigo
    do artigo 53.o, n.o 1, do Regulamento (CE) n.o 1107/2009 para os produtos fitofarmacêuticos
    que contenham as substâncias ativas clotianidina ou imidaclopride para utilização
    em Brassica napus contra Phyllotreta spp. ou Psylliodes spp. [notificada com o
    número C(2020) 458] (Apenas faz fé o texto em língua romena)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/152 a Comisiei din 3 februarie
    2020 prin care se interzice României să repete acordarea de autorizații în
    temeiul articolului 53 alineatul (1) din Regulamentul (CE) nr. 1107/2009 pentru
    produsele de protecție a plantelor care conțin substanța activă clotianidin
    sau imidacloprid pentru utilizare pe Brassica napus împotriva Phyllotreta spp.
    sau Psilliodes spp. [notificată cu numărul C(2020) 458] (Numai textul în limba
    română este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie Rozhodnutie Komisie (EÚ) 2020/152 z 3. februára 2020, ktorým
    sa Rumunsku zakazuje opakovane udeľovať autorizácie podľa článku 53 ods.
    1 nariadenia (ES) č. 1107/2009 pre prípravky na ochranu rastlín s obsahom účinnej
    látky klotianidín alebo imidakloprid na použitie pri plodine Brassica napus
    proti škodcom Phyllotreta spp. alebo Psylliodes spp. [oznámené pod číslom
    C(2020) 458] (Iba rumunské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2020/152 z dne 3. februarja 2020 o prepovedi
    Romuniji, da na podlagi člena 53(1) Uredbe (ES) št. 1107/2009 ponovno izda registracije
    fitofarmacevtskih sredstev, ki vsebujejo aktivno snov klotianidin ali imidakloprid,
    za uporabo na Brassica napus proti Phyllotreta spp. ali Psylliodes spp. (notificirano
    pod dokumentarno številko C(2020) 458) (Besedilo v romunskem jeziku je edino
    verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/152 de la Comisión de 3 de febrero de
    2020 por la que se prohíbe a Rumanía la concesión repetida de autorizaciones
    con arreglo al artículo 53, apartado 1, del Reglamento (CE) n.o 1107/2009 en
    relación con productos fitosanitarios que contienen las sustancias activas clotianidina
    o imidacloprid para su uso en Brassica napus contra Phyllotreta spp. o Psylliodes
    spp. [notificada con el número C(2020) 458] (El texto en lengua rumana es el
    único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/152 av den 3 februari 2020
    om förbud för Rumänien att upprepa beviljandet av godkännanden enligt artikel
    53.1 i förordning (EG) nr 1107/2009 av växtskyddsmedel som innehåller det verksamma
    ämnet klotianidin eller imidiakloprid för användning på Brassica napus mot
    Phyllotreta spp. eller Psylliodes spp. [delgivet med nr C(2020) 458] (Endast den
    rumänska texten är giltig)
