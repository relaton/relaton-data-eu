  content: Commission Regulation (EC) No 894/94 of 21 April 1994 re-establishing the
    levying of customs duties on certain textile products originating in Indonesia,
    India and China, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 894/94 de la Commission du 21 avril 1994 portant rétablissement
    de la perception des droits de douane applicables à certains produits textiles
    originaires d'Indonésie, d'Inde et de Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 894/94 DER KOMMISSION vom 21. April 1994 über die
    Wiedereinführung des Zollsatzes für bestimmte Textilwaren mit Ursprung in Indonesien,
    Indien und China, für die die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 894/94 af 21. april 1994 om genindførelse
