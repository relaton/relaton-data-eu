title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2675/88 of 29 August 1988 providing for
    the grant of private storage aid fixed at a standard rate in advance in respect
    of carcases, half-carcases, hindquarters and forequarters from adult male bovine
    animals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2675/88 de la Commission, du 29 août 1988, prévoyant
    l'octroi d'une aide au stockage privé de carcasses, de demi-carcasses, de quartiers
    arrière et de quartiers avant de gros bovins mâles, fixée forfaitairement à
    l'avance
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2675/88 der Kommission vom 29. August 1988 zur Gewährung
    einer im voraus pauschal festgesetzten Beihilfe zur privaten Lagerhaltung von
    Schlachtkörpern, halben Schlachtkörpern, Hinter- und Vordervierteln von ausgewachsenen
    männlichen Rindern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2675/88 af 29. august 1988 om ydelse
    af en skønsmæssigt forudfastsat støtte til privat oplagring af hele kroppe,
    halve kroppe og bag- og forfjerdinger af voksne handyr
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2675/88 της Επιτροπής
    της 29ης Αυγούστου 1988 για την πρόβλεψη χορήγησης
    ενίσχυσης που προκαθορίζονται κατ' αποκοπή
    στην ιδιωτική αποθεματοποίηση σφαγίων, ημιμορίων
    σφαγίου και οπισθίων και εμπροσθίων τεταρτημορίων
    χονδρών αρσενικών βοοειδών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2675/88 della Commissione, del 29 agosto 1988, recante
    concessione di un aiuto fissato forfettariamente in anticipo all'ammasso privato
    di carcasse, quarti posteriori e quarti anteriori di animali adulti maschi della
    specie bovina
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2675/88 van de Commissie van 29 augustus 1988 inzake
    de toekenning van een vooraf forfaitair vastgesteld steunbedrag voor de particuliere
    opslag van hele geslachte dieren, halve geslachte dieren, achtervoeten en voorvoeten
    van volwassen mannelijke runderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 2675/88 da Comissão, de 29 de Agosto de 1988, que
    prevê a concessão de uma ajuda à armazenagem privada de carcaças, de meias
    carcaças, de quartos traseiros e de quartos dianteiros de bovinos adultos machos
    fixada forfetária e antecipadamente
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 2675/88 de la Comisión, de 29 de agosto de 1988, por
