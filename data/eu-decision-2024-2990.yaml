    kura izveidota ar Stabilizācijas un asociācijas nolīgumu starp Eiropas Kopienām
    un to dalībvalstīm, no vienas puses, un Bosniju un Hercegovinu, no otras puses,
    attiecībā uz lēmumu, ar ko nosaka vispārīgās prasības elektroniski izdotiem
    izcelsmes apliecinājumiem saskaņā ar minētā nolīguma 2. protokola A papildinājuma
    17. panta 4. punktu
  type: main
- language: lt
