    taryboje, įsteigtoje Europos Bendrijų bei jų valstybių narių ir Bosnijos
    ir Hercegovinos stabilizacijos ir asociacijos susitarimu, dėl sprendimo, kuriuo
    nustatomi bendrieji kilmės įrodymų, išduodamų elektroniniu būdu pagal to
    susitarimo 2 protokolo A priedėlio 17 straipsnio 4 dalį, reikalavimai
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/2990 tal-21 ta’ Novembru 2024 dwar
    il-pożizzjoni li għandha tiġi adottata f’isem l-Unjoni Ewropea fi ħdan il-Kunsill
    ta’ Stabbilizzazzjoni u Assoċjazzjoni stabbilit bil-Ftehim ta’ Stabilizzazzjoni
    u Assoċjazzjoni bejn il-Komunitajiet Ewropej u l-Istati Membri tagħhom, minn
    naħa waħda, u l-Bożnija-Ħerzegovina, min-naħa l-oħra, fir-rigward ta’
    deċiżjoni li tistabbilixxi r-rekwiżiti ġenerali għall-provi tal-oriġini
    maħruġa b’mod elettroniku skont l-Artikolu 17(4) tal-Appendiċi A tal-Protokoll
    2 ta’ dak il-Ftehim
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2024/2990 van de Raad van 21 november 2024 over het namens
    de Europese Unie in de Stabilisatie- en associatieraad die is opgericht bij de
    Stabilisatie- en associatieovereenkomst tussen de Europese Gemeenschappen en hun
    lidstaten, enerzijds, en Bosnië en Herzegovina, anderzijds, in te nemen standpunt
    ten aanzien van een beslissing tot vaststelling van de algemene voorwaarden met
    betrekking tot elektronisch afgegeven bewijzen van oorsprong uit hoofde van artikel
    17, lid 4, van aanhangsel A van Protocol 2 bij die overeenkomst
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2024/2990 z dnia 21 listopada 2024 r. w sprawie stanowiska,
    które ma być zajęte w imieniu Unii Europejskiej w ramach Rady Stabilizacji
    i Stowarzyszenia ustanowionej na mocy Układu o stabilizacji i stowarzyszeniu
    między Wspólnotami Europejskimi i ich państwami członkowskimi, z jednej strony,
    a Bośnią i Hercegowiną, z drugiej strony, w odniesieniu do decyzji w sprawie
    ustanowienia wymogów ogólnych dotyczących dowodów pochodzenia wystawianych
    w formie elektronicznej na podstawie art. 17 ust. 4 dodatku A do protokołu 2
    do tego układu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2024/2990 do Conselho, de 21 de novembro de 2024, relativa
    à posição a tomar em nome da União Europeia no âmbito do Conselho de Estabilização
    e de Associação criado pelo Acordo de Estabilização e de Associação entre
    as Comunidades Europeias e os seus Estados-Membros, por um lado, e a Bósnia-Herzegovina,
    por outro, no que diz respeito a uma decisão que estabelece os requisitos gerais
    para as provas de origem emitidas por via eletrónica ao abrigo do artigo 17.°,
    n.° 4, do apêndice A do Protocolo n.° 2 do referido Acordo
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2024/2990 a Consiliului din 21 noiembrie 2024 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul Consiliului
    de stabilizare și de asociere înființat prin Acordul de stabilizare și de
    asociere dintre Comunitățile Europene și statele membre ale acestora, pe de
    o parte, și Bosnia și Herțegovina, pe de altă parte, cu privire la o decizie
    de stabilire a cerințelor generale privind dovezile de origine emise pe cale
    electronică în temeiul articolului 17 alineatul (4) din apendicele A la Protocolul
    nr. 2 la respectivul acord
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/2990 z 21. novembra 2024 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Rade pre stabilizáciu a pridruženie
    zriadenej Dohodou o stabilizácii a pridružení medzi Európskymi spoločenstvami
    a ich členskými štátmi na jednej strane a Bosnou a Hercegovinou na strane
    druhej, pokiaľ ide o rozhodnutie, ktorým sa stanovujú všeobecné požiadavky
    na dôkazy o pôvode vydávané elektronicky podľa článku 17 ods. 4 dodatku
    A k protokolu 2 k uvedenej dohode
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/2990 z dne 21. novembra 2024 o stališču, ki se
    v imenu Evropske unije zastopa v Stabilizacijsko-pridružitvenem svetu, ustanovljenem
    s Stabilizacijsko-pridružitvenim sporazumom med Evropskima skupnostma in njunimi
    državami članicami na eni strani ter Bosno in Hercegovino na drugi strani, v
    zvezi s sklepom o določitvi splošnih zahtev za elektronsko izdana dokazila o
    poreklu iz člena 17(4) Dodatka A k Protokolu 2 k navedenemu sporazumu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/2990 del Consejo, de 21 de noviembre de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Estabilización y Asociación creado por el Acuerdo de Estabilización y Asociación
    entre las Comunidades Europeas y sus Estados miembros, por una parte, y Bosnia
    y Herzegovina, por otra, por lo que respecta a una decisión por la que se establecen
    las condiciones generales de las pruebas de origen expedidas por medios electrónicos
    en virtud del artículo 17, apartado 4, del apéndice A del Protocolo n.° 2 de
    dicho Acuerdo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/2990 av den 21 november 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det stabiliserings- och associeringsråd
    som inrättats genom stabiliserings- och associeringsavtalet mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Bosnien och Hercegovina,
    å andra sidan, vad gäller ett beslut om fastställande av allmänna villkor
    för ursprungsbevis som utfärdas elektroniskt i enlighet med artikel 17.4 i tillägg
    A till protokoll 2 till det avtalet
