title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/2990 of 21 November 2024 on the position to
    be adopted on behalf of the European Union within the Stabilisation and Association
    Council established by the Stabilisation and Association Agreement between the
    European Communities and their Member States, of the one part, and Bosnia and
    Herzegovina, of the other part, with regard to a decision establishing the general
    requirements for proofs of origin issued electronically under Article 17(4) of
    Appendix A to Protocol 2 to that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/2990 du Conseil du 21 novembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du conseil de stabilisation
    et d’association institué par l’accord de stabilisation et d’association
    entre les Communautés européennes et leurs États membres, d’une part, et
    la Bosnie-Herzégovine, d’autre part, en ce qui concerne une décision établissant
    les conditions générales applicables aux preuves de l’origine délivrées
    par voie électronique au titre de l’article 17, paragraphe 4, de l’appendice
    A du protocole n° 2 dudit accord
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/2990 des Rates vom 21. November 2024 über den Standpunkt,
    der im Namen der Europäischen Union im Stabilitäts- und Assoziationsrat, der
    gemäß dem Stabilisierungs- und Assoziierungsabkommen zwischen den Europäischen
    Gemeinschaften und ihren Mitgliedstaaten einerseits und Bosnien und Herzegowina
    andererseits eingesetzt wurde, hinsichtlich eines Beschlusses zur Festlegung der
    allgemeinen Anforderungen für elektronisch ausgestellte Ursprungsnachweise gemäß
    Anlage A Artikel 17 Absatz 4 des Protokolls Nr. 2 zum genannten Abkommen zu vertreten
    ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/2990 на Съвета от 21 ноември
    2024 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвета за стабилизиране и асоцииране, създаден
    със Споразумението за стабилизиране и асоцииране
    между Европейските общности и техните държави
    членки, от една страна, и Босна и Херцеговина,
    от друга страна, във връзка с решението за установяване
    на общите изисквания за доказателствата за
    произход, издавани по електронен път съгласно
    член 17, параграф 4 от допълнение А към Протокол
    2 към посоченото споразумение
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/2990 ze dne 21. listopadu 2024 o postoji, který
    má být zaujat jménem Evropské unie v Radě stabilizace a přidružení zřízené
    Dohodou o stabilizaci a přidružení mezi Evropskými společenstvími a jejich
    členskými státy na jedné straně a Bosnou a Hercegovinou na straně druhé,
    pokud jde o rozhodnutí o stanovení obecných požadavků na doklady o původu
    vystavované elektronicky podle čl. 17 odst. 4 dodatku A k protokolu 2 k uvedené
    dohodě
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2024/2990 af 21. november 2024 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i det stabiliserings- og associeringsråd,
    der er nedsat ved stabiliserings- og associeringsaftalen mellem De Europæiske
    Fællesskaber og deres medlemsstater på den ene side og Bosnien-Hercegovina på
    den anden side, til en afgørelse om fastsættelse af de generelle betingelser
    for oprindelsesbeviser, der udstedes elektronisk i henhold til artikel 17, stk.
    4, i tillæg A til protokol 2 til nævnte aftale
  type: main
- language: el
  script: Grek
