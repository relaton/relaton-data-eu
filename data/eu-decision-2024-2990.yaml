    seisukoha kohta ühelt poolt Euroopa ühenduste ja nende liikmesriikide ning teiselt
    poolt Bosnia ja Hertsegoviina vahelise stabiliseerimis- ja assotsieerimislepinguga
    loodud stabiliseerimis- ja assotsieerimisnõukogus seoses otsusega, millega kehtestatakse
    üldnõuded nimetatud lepingu protokolli nr 2 A liite artikli 17 lõike 4 kohaselt
    elektrooniliselt välja antavatele päritolutõenditele
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2024/2990, annettu 21 päivänä marraskuuta 2024,
    Euroopan yhteisöjen ja niiden jäsenvaltioiden sekä Bosnia ja Hertsegovinan
    välisellä vakautus- ja assosiaatiosopimuksella perustetussa vakautus- ja assosiaationeuvostossa
    Euroopan unionin puolesta esitettävästä kannasta päätökseen kyseisen sopimuksen
    pöytäkirjassa N:o 2 olevassa lisäyksessä A olevan 17 artiklan 4 kohdan mukaisia
    sähköisesti annettavia alkuperäselvityksiä koskevien yleisten vaatimusten
    vahvistamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2024/2990 ón gComhairle an 21 Samhain 2024 maidir leis an
