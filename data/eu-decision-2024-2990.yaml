    agus Comhlachais arna bunú leis an gComhaontú Cobhsaíochta agus Comhlachais
    idir na Comhphobail Eorpacha agus a mBallstáit, de pháirt, agus an Bhoisnia
    agus an Heirseagaivéin, den pháirt eile, i ndáil le cinneadh lena mbunaítear
    na ceanglais ghinearálta maidir le cruthúnais tionscnaimh a eisítear go leictreonach
    i gcomhréir le hAirteagal 17(4) d’Fhoscríbhinn A a ghabhann le Prótacal 2
    a ghabhann leis an gComhaontú sin
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2024/2990 od 21. studenoga 2024. o stajalištu koje
    treba zauzeti u ime Europske unije u okviru Vijeća za stabilizaciju i pridruživanje
    osnovanog Sporazumom o stabilizaciji i pridruživanju između Europskih zajednica
    i njihovih država članica, s jedne strane, i Bosne i Hercegovine, s druge strane,
    u pogledu odluke o utvrđivanju općih zahtjeva za dokaze o podrijetlu izdane
    elektroničkim putem u skladu s člankom 17. stavkom 4. Dodatka A Protokolu 2.
    uz taj sporazum
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2024/2990 határozata (2024. november 21.) az egyrészről
    az Európai Közösségek és tagállamaik, másrészről Bosznia-Hercegovina
    közötti stabilizációs és társulási megállapodás által létrehozott stabilizációs
    és társulási tanácsban az említett megállapodás 2. jegyzőkönyve A. függeléke
    17. cikkének (4) bekezdése értelmében elektronikus úton kiállított származási
    igazolásokra vonatkozó általános követelményeket megállapító határozattal
    kapcsolatban az Európai Unió által képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/2990 del Consiglio, del 21 novembre 2024, relativa
    alla posizione da adottare a nome dell’Unione europea in sede di consiglio di
    stabilizzazione e di associazione istituito dall’accordo di stabilizzazione
    e di associazione tra le Comunità europee e i loro Stati membri, da una parte,
    e la Bosnia-Erzegovina, dall’altra, in relazione a una decisione che stabilisce
    i requisiti generali relativi alle prove dell’origine rilasciate elettronicamente
    a norma del protocollo n. 2, appendice A, articolo 17, paragrafo 4, di tale accordo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2024/2990 2024. gada 21. novembris par nostāju, kas
