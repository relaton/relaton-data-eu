    istituite dal regolamento (CE) n. 408/2002 del Consiglio sulle importazioni di
    alcuni ossidi di zinco originari della Repubblica popolare cinese mediante importazioni
    di alcuni altri ossidi di zinco originari della Repubblica popolare cinese ed
    importazioni di alcuni ossidi di zinco spediti dal Vietnam, e che dispone la registrazione
    di tali importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2261/2002 van de Commissie van 18 december 2002 tot
    opening van een onderzoek naar de vermeende ontwĳking van het bĳ Verordening
    (EG) nr. 408/2002 van de Raad ingestelde antidumpingrecht op de invoer van bepaalde
    soorten zinkoxiden van oorsprong uit de Volksrepubliek China door de invoer van
    bepaalde andere zinkoxiden uit de Volksrepubliek China en de verlegging van de
    invoer van bepaalde zinkoxiden via Vietnam en tot instelling van een registratieregeling
    voor deze invoer
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2261/2002 da Comissão, de 18 de Dezembro de 2002,
    que dá início a um inquérito sobre a alegada evasão das medidas anti-dumping
    instituídas pelo Regulamento (CE) n.° 408/2002 do Conselho sobre as importações
    de determinados óxidos de zinco originários da República Popular da China por
    importações de outros óxidos de zinco originários da República Popular da
    China e por importações de determinados óxidos de zinco expedidos via Vietname,
    e que torna obrigatório o registo destas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2261/2002 de la Comisión, de 18 de diciembre de 2002,
