title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2261/2002 of 18 December 2002 on initiating
    an investigation concerning the alleged circumvention of anti-dumping measures
    imposed by Council Regulation (EC) No 408/2002 on imports of certain zinc oxides
    originating in the People's Republic of China by imports of certain other zinc
    oxides originating in the People's Republic of China and by imports of certain
    zinc oxides consigned from Vietnam, and making such imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2261/2002 de la Commission du 18 décembre 2002 ouvrant
    une enquête sur le prétendu contournement des mesures antidumping instituées
    par le règlement (CE) n° 408/2002 du Conseil sur les importations de certains
    types d'oxyde de zinc originaires de la République populaire de Chine par des
    importations de certains autres types d'oxyde de zinc originaires de la République
    populaire de Chine et par des importations de certains types d'oxyde de zinc expédiés
    du Viêt Nam, et rendant obligatoire l'enregistrement de ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2261/2002 der Kommission vom 18. Dezember 2002 zur
    Einleitung einer Untersuchung betreffend die angebliche Umgehung der mit der Verordnung
    (EG) Nr. 408/2002 des Rates eingeführten Antidumpingmaßnahmen gegenüber den
    Einfuhren bestimmter Zinkoxide aus der Volksrepublik China durch die Einfuhren
    bestimmter Zinkoxide mit Ursprung in der Volksrepublik China und durch die Einfuhren
    bestimmter aus Vietnam versandter Zinkoxide und zur zollamtlichen Erfassung dieser
    Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2261/2002 af 18. december 2002 om indledning
    af en undersøgelse vedrørende påstået omgåelse af antidumpingforanstaltninger,
    der er indført ved Rådets forordning (EF) nr. 408/2002 på importen af visse
    typer zinkoxid med oprindelse i Folkerepublikken Kina, ved import af visse andre
    typer zinkoxid med oprindelse i Folkerepublikken Kina og ved import af visse typer
    zinkoxid afsendt fra Vietnam samt om registrering af denne import
  type: main
- language: el
  script: Grek
