  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2261/2002, annettu 18 päivänä joulukuuta 2002,
    tiettyjen Kiinan kansantasavallasta peräisin olevien sinkkioksidien tuonnissa
    neuvoston asetuksella (EY) N:o 408/2002 käyttöön otettujen polkumyyntitoimenpiteiden
    väitettyä kiertämistä tiettyjen muiden Kiinan kansantasavallasta peräisin
    olevien sinkkioksidien tuonnilla ja Vietnamista lähetettyjen tiettyjen sinkkioksidien
    tuonnilla koskevan tutkimuksen vireillepanosta ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
