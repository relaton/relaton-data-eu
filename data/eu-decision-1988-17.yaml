    amtlich als schweinepestfrei anerkannt werden (Nur der französische Text ist
    verbindlich) (88/17/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 21. december 1987 om ændring af beslutning
