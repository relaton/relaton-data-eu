  content: '88/17/EEC: Commission Decision of 21 December 1987 amending Decision 87/361/EEC
    recognizing certain parts of the territory of the French Republic as being officially
    swine-fever-free (only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '88/17/CEE: Décision de la Commission du 21 décembre 1987 portant modification
    de la décision 87/361/CEE reconnaissant certaines parties du territoire de la
    République française comme officiellement indemnes de peste porcine (Le texte
    en langue française est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
