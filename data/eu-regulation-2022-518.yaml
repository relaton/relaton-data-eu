    chuid forálacha idirthréimhseacha maidir le feithiclí áirithe talmhaíochta
    agus foraoiseachta atá feistithe le hinnill sa raon cumhachta idir 56kW nó níos
    mó ná sin, agus níos lú ná 130 kW, chun aghaidh a thabhairt ar thionchar
    ghéarchéim COVID-19
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/518 оd 13. siječnja 2022. o izmjeni
    Delegirane uredbe (EU) 2018/985 u pogledu njezinih prijelaznih odredaba za određena
    vozila za poljoprivredu i šumarstvo opremljena motorima snage unutar raspona
    od najmanje 56 kW do manje od 130 kW radi ublažavanja posljedica krize uzrokovane
    bolešću COVID-19
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/518 felhatalmazáson alapuló rendelete (2022. január
    13.) a Covid19-válság hatásainak kezelése érdekében az (EU) 2018/985 felhatalmazáson
    alapuló rendeletnek az 56 kW vagy annál nagyobb és 130 kW-nál kisebb teljesítménytartományba
    tartozó motorokkal felszerelt egyes mezőgazdasági és erdészeti járművekre
    vonatkozó átmeneti rendelkezések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/518 della Commissione del 13 gennaio 2022
    che modifica il regolamento delegato (UE) 2018/985 per quanto riguarda le disposizioni
    transitorie per determinati veicoli agricoli e forestali dotati di motori nell’intervallo
    di potenza pari o superiore a 56 kW e inferiore a 130 kW al fine di fare fronte
    agli effetti della crisi dovuta alla COVID-19
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/518 (2022. gada 13. janvāris),
    ar ko, nolūkā risināt Covid-19 krīzes ietekmi, attiecībā uz pārejas noteikumiem
    konkrētiem lauksaimniecības un mežsaimniecības transportlīdzekļiem, kas
    aprīkoti ar motoriem, kuru jauda ir 56 kW vai lielāka un mazāka par 130 kW,
    groza Deleģēto regulu (ES) 2018/985
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/518 2022 m. sausio 13 d. kuriuo,
    siekiant atsižvelgti į COVID-19 krizės poveikį, iš dalies keičiamos Deleguotojo
    reglamento (ES) 2018/985 pereinamojo laikotarpio nuostatos, taikomos tam tikroms
    žemės ir miškų ūkio transporto priemonėms su 56 kW ir didesnės galios ir
    mažesnės kaip 130 kW galios varikliais
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/518 tat-13 ta’ Jannar 2022
    li jemenda r-Regolament Delegat (UE) 2018/985 fir-rigward tad-dispożizzjonijiet
    tranżizzjonali tiegħu għal ċerti vetturi għall-agrikoltura u għall-forestrija
    mgħammra b’magni fil-medda tal-potenza daqs 56 kW jew akbar, u inqas minn 130
    kW sabiex jiġi indirizzat l-impatt tal-kriżi tal-COVID-19
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/518 van de Commissie van 13 januari
    2022 tot wijziging van Gedelegeerde Verordening (EU) 2018/985 wat betreft de overgangsbepalingen
    voor bepaalde landbouw- en bosbouwmachines die zijn uitgerust met motoren in de
    vermogensgroep tussen 56 kW en 130 kW, met het oog op het aanpakken van de gevolgen
    van de COVID-19-crisis
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/518 z dnia 13 stycznia 2022
    r. zmieniające rozporządzenie delegowane (UE) 2018/985 w odniesieniu do jego
    przepisów przejściowych dotyczących niektórych pojazdów rolniczych i leśnych
    wyposażonych w silniki o zakresach mocy co najmniej 56 kW i nie większym niż
    130 kW w celu zaradzenia skutkom kryzysu związanego z COVID-19
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/518 da Comissão de 13 de janeiro de 2022
    que altera o Regulamento Delegado (UE) 2018/985 no que diz respeito às suas disposições
    transitórias para determinados tratores agrícolas e florestais equipados com
    motores na gama de potências igual ou superior a 56 kW e inferior a 130 kW, a
    fim de fazer face ao impacto da crise da COVID-19
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/518 al Comisiei din 13 ianuarie 2022 de
    modificare a Regulamentului delegat (UE) 2018/985 în ceea ce privește dispozițiile
    sale tranzitorii pentru anumite vehicule agricole și forestiere echipate cu motoare
    cu puterea mai mare sau egală cu 56 kW și mai mică de 130 kW pentru a aborda
    impactul crizei provocate de pandemia de COVID-19
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/518 z 13. januára 2022, ktorým
    sa mení delegované nariadenie (EÚ) 2018/985, pokiaľ ide o jeho prechodné
    ustanovenia pre určité poľnohospodárske a lesné vozidlá vybavené motormi
    v rozsahu výkonu minimálne 56 kW a menej ako 130 kW s cieľom riešiť vplyv
    krízy spôsobenej ochorením COVID-19
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/518 z dne 13. januarja 2022 o spremembi
    Delegirane uredbe (EU) 2018/985 v zvezi z njenimi prehodnimi določbami za nekatera
    kmetijska in gozdarska vozila, opremljena z motorji v razponu moči večji ali
    enaki 56 kW in manjši od 130 kW, za obravnavo posledic krize zaradi COVID-19
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/518 de la Comisión de 13 de enero de 2022
    por el que se modifica el Reglamento Delegado (UE) 2018/985 en lo que respecta
    a sus disposiciones transitorias aplicables a determinados vehículos agrícolas
    y forestales equipados con motores en la gama de potencia superior o igual a 56
    kW e inferior a 130 kW, con el fin de hacer frente al impacto de la crisis de
    la COVID-19
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/518 av den 13 januari 2022
    om ändring av delegerad förordning (EU) 2018/985 vad gäller övergångsbestämmelser
    för vissa jordbruks- och skogsbruksfordon utrustade med motorer i ett effektintervall
    som är större än eller lika med 56 kW och mindre än 130 kW för att hantera
    konsekvenserna av covid-19-krisen
