title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/518 of 13 January 2022 amending
    Delegated Regulation (EU) 2018/985 as regards its transitional provisions for
    certain agricultural and forestry vehicles fitted with engines in the power range
    greater than or equal to 56 kW and less than 130 kW in order to address the impact
    of the COVID-19 crisis
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/518 de la Commission du 13 janvier 2022
    modifiant le règlement délégué (UE) 2018/985 en ce qui concerne ses dispositions
    transitoires applicables à certains véhicules agricoles et forestiers équipés
    de moteurs dans la plage de puissance supérieure ou égale à 56 kW et inférieure
    à 130 kW afin de faire face aux conséquences de la crise de la COVID-19
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/518 der Kommission vom 13. Januar 2022
    zur Änderung der Delegierten Verordnung (EU) 2018/985 hinsichtlich ihrer Übergangsbestimmungen
    für bestimmte land- und forstwirtschaftliche Fahrzeuge, die mit Motoren im Leistungsbereich
    von mindestens 56 kW und weniger als 130 kW ausgestattet sind, um den Auswirkungen
    der COVID-19-Krise zu begegnen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/518 на Комисията
    от 13 януари 2022 година за изменение на Делегиран
    регламент (ЕС) 2018/985 по отношение на неговите
    преходни разпоредби за някои земеделски и
    горски превозни средства, оборудвани с двигатели
    с мощност в диапазон, по-голям или равен на
    56 kW и по-малък от 130 kW, с цел справяне с въздействието
    на кризата с COVID-19
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/518 ze dne 13. ledna
    2022, kterým se mění nařízení v přenesené pravomoci (EU) 2018/985, pokud
    jde o přechodná ustanovení pro některá zemědělská a lesnická vozidla
    vybavená motory s rozsahem výkonu alespoň 56 kW, avšak méně než 130 kW,
    s cílem řešit dopad krize COVID-19
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/518 af 13. januar 2022 om
    ændring af delegeret forordning (EU) 2018/985 for så vidt angår overgangsbestemmelserne
    for visse landbrugs- og skovbrugskøretøjer udstyret med motorer i effektområderne
    større end eller lig med 56 kW og mindre end 130 kW for at imødegå virkningen
    af covid-19-krisen
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/518
    της Επιτροπής της 13ης Ιανουαρίου 2022 για την
    τροποποίηση του κατ’ εξουσιοδότηση κανονισμού
    (ΕΕ) 2018/985 όσον αφορά τις μεταβατικές διατάξεις
    του για ορισμένα γεωργικά και δασικά οχήματα
    που είναι εξοπλισμένα με κινητήρες ισχύος
    μεγαλύτερης των 56 kW και μικρότερης των 130 kW,
    προκειμένου να αντιμετωπιστούν οι επιπτώσεις
    της κρίσης COVID-19
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/518, 13. jaanuar 2022, millega
    muudetakse delegeeritud määrust (EL) 2018/985 seoses üleminekusätetega, mis
    käsitlevad teatavaid põllu- ja metsamajanduses kasutatavaid sõidukeid, mis
    on varustatud mootoriga, mille võimsus on vähemalt 56 kW, kuid mitte üle 130
    kW, et leevendada COVID-19 kriisi mõju
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/518, annettu 13 päivänä tammikuuta
    2022, delegoidun asetuksen (EU) 2018/985 muuttamisesta sen tiettyjä tehoalueeltaan
    vähintään 56 kW:n mutta alle 130 kW:n moottoreilla varustettuja maa- ja metsätaloudessa
    käytettäviä ajoneuvoja koskevien siirtymäsäännösten osalta covid-19-kriisin
    vaikutusten huomioon ottamiseksi
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/518 ón gCoimisiún an 13 Eanáir 2022
