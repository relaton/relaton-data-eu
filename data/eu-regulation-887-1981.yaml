    ecc., esclusi quelli a maglia, della categoria di prodotti n. 84 (codice 0840),
    originari dell' India beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 887/81 van de Commissie van 1 april 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op sjaals,
    sjerpen, enz., andere dan van brei- of haakwerk, van categorie van produkten 84
    (codenummer 0840), van oorsprong uit India, waarvoor de algemene tariefpreferenties
