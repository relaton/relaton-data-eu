title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 887/81 of 1 April 1981 re-establishing the
    levying of customs duties on shawls, scarves, etc., other than knitted or crocheted,
    products of category 84 (code 0840), originating in India, to which the preferential
    tariff arrangements of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 887/81 de la Commission, du 1er avril 1981, portant
    rétablissement de la perception des droits de douane applicables aux châles,
    écharpes, etc., autres qu' en bonneterie, de la catégorie de produits n° 84
    (code 0840), originaires de l' Inde, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 887/81 der Kommission vom 1. April 1981 über die
    Wiedereinführung des Zollsatzes für Schals, Umschlagtücher, usw., andere als
    Wirkwaren, der Warenkategorie Nr. 84 (Kennziffer 0840), mit Ursprung in Indien,
    dem die in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 887/81 af 1. april 1981 om genindførelse
    af opkrævning af toldafgifter for sjaler, tørklæder, etc., bortset fra varer
    af trikotage, under kategori 84 (kode 0840), som har oprindelse i Indien og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
