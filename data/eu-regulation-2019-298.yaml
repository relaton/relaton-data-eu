title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2019/298 of 20 February 2019 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entries for Belarus, Bosnia
    and Herzegovina and Japan in the list of third countries, territories, zones or
    compartments from which certain poultry commodities may be imported into or transit
    through the Union
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/298 de la Commission du 20 février 2019
    modifiant l'annexe I du règlement (CE) n° 798/2008 en ce qui concerne les mentions
    relatives à la Biélorussie, à la Bosnie-Herzégovine et au Japon sur la liste
    des pays tiers, territoires, zones ou compartiments en provenance desquels certains
    produits de volailles peuvent être importés dans l'Union ou transiter par celle-ci
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2019/298 der Kommission vom 20. Februar 2019
    zur Änderung des Anhangs I der Verordnung (EG) Nr. 798/2008 hinsichtlich der
    Einträge zu Belarus, Bosnien und Herzegowina sowie Japan in der Liste von Drittländern,
    Gebieten, Zonen und Kompartimenten, aus denen bestimmte Geflügelwaren in die
    Union eingeführt bzw. durch die Union durchgeführt werden dürfen
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2019/298 на Комисията
    от 20 февруари 2019 година за изменение на приложение
    I към Регламент (ЕО) № 798/2008 по отношение на вписванията
    за Беларус, Босна и Херцеговина и Япония в списъка
    на трети държави, територии, зони или компартменти,
    от които са разрешени вносът и транзитът през
    Съюза на някои стоки от домашни птици
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2019/298 ze dne 20. února 2019, kterým
