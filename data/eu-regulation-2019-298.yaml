    i Japan na popisu trećih zemalja, državnih područja, zona ili kompartmenta
    iz kojih je dopušten uvoz određenih proizvoda od peradi u Uniju i njihov provoz
    kroz Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/298 végrehajtási rendelete (2019. február 20.)
