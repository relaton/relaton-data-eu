    terzi, loro territori, zone o compartimenti da cui sono consentiti le importazioni
    o il transito nell'Unione di determinati prodotti a base di pollame
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2019/298 (2019. gada 20. februāris),
