  script: Latn
  content: Council Regulation (EU) No 1360/2013 of 2 December 2013 fixing the production
    levies in the sugar sector for the 2001/2002, 2002/2003, 2003/2004, 2004/2005
    and 2005/2006 marketing years, the coefficient required for calculating the additional
    levy for the 2001/2002 and 2004/2005 marketing years and the amount to be paid
    by sugar manufacturers to beet sellers in respect of the difference between the
    maximum levy and the levy to be charged for the 2002/2003, 2003/2004 and 2005/2006
    marketing years
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 1360/2013 du Conseil du 2 décembre 2013 fixant les
    cotisations à la production dans le secteur du sucre pour les campagnes de commercialisation
    2001/2002, 2002/2003, 2003/2004, 2004/2005 et 2005/2006, le coefficient nécessaire
    au calcul de la cotisation complémentaire pour les campagnes de commercialisation
    2001/2002 et 2004/2005 et les montants à payer par les fabricants de sucre aux
    vendeurs de betteraves en raison de la différence entre la cotisation maximale
    et la cotisation à percevoir pour les campagnes de commercialisation 2002/2003,
    2003/2004 et 2005/2006
