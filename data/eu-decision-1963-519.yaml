title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 août 1963, autorisant la République
    italienne à maintenir la mesure relative à l'extension aux importations de blé
    tendre du grade manitoba 3 des mesures de sauvegarde applicables aux importations
    de certaines variétés de blé tendre
  type: main
- language: de
  script: Latn
  content: '63/519/EWG: Entscheidung der Kommission vom 30. August 1963, mit der die
    Italienische Republik ermächtigt wird, die Maßnahme im Zusammenhang mit der
    Ausdehnung der Schutzmaßnahmen bei der Einfuhr bestimmter Arten von Weichweizen
    auf die Einfuhr von Weichweizen der Sorte Manitoba 3 beizubehalten'
  type: main
- language: it
  script: Latn
  content: '63/519/CEE: Decisione della Commissione del 30 agosto 1963 che autorizza
    la Repubblica italiana a mantenere la misura che estende alle importazioni di
    grano tenero della varietà Manitoba 3, le misure di salvaguardia applicabili
    alle importazioni di alcune varietà di grano tenero'
  type: main
- language: nl
  script: Latn
  content: '63/519/EEG: Beschikking van de Commissie van 30 augustus 1963 houdende
    machtiging van de Italiaanse Republiek tot handhaving van de uitbreiding van de
    vrijwaringsmaatregelen ten aanzien van de invoer van bepaalde variëteiten van
    zachte tarwe tot de invoer van zachte tarwe van de variëteit Manitoba 3'
  type: main
