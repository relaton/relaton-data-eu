title:
- language: en
  script: Latn
  content: '92/545/EEC: Council Decision of 23 November 1992 authorizing the Kingdom
    of the Netherlands to apply a measure derogating from Article 21 of the Sixth
    Directive 77/388/EEC on the harmonization of the laws of the Member States relating
    to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '92/545/CEE: Décision du Conseil, du 23 novembre 1992, autorisant le Royaume
    des Pays-Bas à appliquer une mesure dérogatoire à l''article 21 de la sixième
    directive 77/388/CEE en matière d''harmonisation des législations des États
    membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '92/545/EWG: Entscheidung des Rates vom 23. November 1992 zur Ermächtigung
    des Königreichs der Niederlande, eine von Artikel 21 der Sechsten Richtlinie
    77/388/EWG zur Harmonisierung der Rechtsvorschriften der Mitgliedstaaten über
    die Umsatzsteuern abweichende Maßnahme anzuwenden'
  type: main
- language: da
  script: Latn
  content: '92/545/EØF: Rådets beslutning af 23. november 1992 om bemyndigelse af
    Kongeriget Nederlandene til at anvende en foranstaltning, der fraviger artikel
    21 i sjette direktiv 77/388/EØF om harmonisering af medlemsstaternes lovgivning
    om omsætningsafgifter'
  type: main
- language: el
  script: Grek
  content: '92/545/ΕΟΚ: Απόφαση του Συμβουλίου της 23ης
    Νοεμβρίου 1992 με την οποία επιτρέπεται στο Βασίλειο
    των Κάτω Χωρών να εφαρμόσει μέτρο παρέκκλισης
    από το άρθρο 21 της έκτης οδηγίας 77/388/ΕΟΚ περί
    εναρμονίσεως των νομοθεσιών των κρατών μελών
    των σχετικών με τους κύκλους φόρου εργασιών'
  type: main
- language: it
  script: Latn
  content: '92/545/CEE: Decisione del Consiglio, del 23 novembre 1992, che autorizza
    il Regno dei Paesi Bassi ad applicare una misura di deroga all'' articolo 21 della
    sesta direttiva 77/388/CEE in materia di armonizzazione delle legislazioni degli
    Stati membri relative alle imposte sulla cifra d'' affari'
  type: main
- language: nl
  script: Latn
  content: '92/545/EEG: Beschikking van de Raad van 23 november 1992 waarbij het Koninkrijk
    der Nederlanden wordt gemachtigd een maatregel toe te passen die afwijkt van artikel
    21 van Zesde Richtlijn 77/388/EEG betreffende de harmonisatie van de wetgevingen
    der Lid-Staten inzake omzetbelasting'
  type: main
- language: pt
  script: Latn
  content: '92/545/CEE: Decisão do Conselho, de 23 de Novembro de 1992, que autoriza
    o Reino dos Países Baixos a aplicar uma medida derrogatória ao n° 1, alínea
    a), do artigo 21° da Sexta Directiva 77/388/CEE, relativa à harmonização das
    legislações dos Estados-membros respeitantes aos impostos sobre o volume de
    negócios'
  type: main
- language: es
  script: Latn
  content: '92/545/CEE: Decisión del Consejo, de 23 de noviembre de 1992, por la
    que se autoriza al Reino de los Países Bajos a establecer una excepción al artículo
    21 de la sexta Directiva (77/388/CEE) en materia de armonización de las legislaciones
    de los Estados miembros relativas al impuesto sobre el volumen de negocios'
