    d' intervention et à reporter à l' exercice 1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3248/84 der Kommission vom 21. November 1984 zur Festsetzung
    der Preise, die bei der Berechnung des Wertes der in Interventionslagerbeständen
    befindlichen und auf das Haushaltsjahr 1985 zu übertragenden landwirtschaftlichen
    Erzeugnisse zugrunde zu legen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3248/84 af 21. november 1984 om fastsættelse
