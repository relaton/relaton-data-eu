title:
- language: en
  script: Latn
  content: '82/338/EEC: Commission Decision of 7 May 1982 authorizing Member States
    to permit temporarily the marketing of forest reproductive material not satisfying
    the requirements of Council Directive 66/404/EEC'
  type: main
- language: fr
  script: Latn
  content: '82/338/CEE: Décision de la Commission, du 7 mai 1982, autorisant les
    États membres à admettre temporairement la commercialisation de matériels forestiers
    de reproduction ne répondant pas aux exigences de la directive 66/404/CEE du
    Conseil'
  type: main
- language: de
  script: Latn
  content: '82/338/EWG: Entscheidung der Kommission vom 7. Mai 1982 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinie 66/404/EWG des Rates nicht entspricht'
  type: main
- language: da
  script: Latn
  content: '82/338/EØF: Kommissionens beslutning af 7. maj 1982 om bemyndigelse af
    medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF'
  type: main
- language: el
  script: Grek
  content: '82/338/EOK: Απόφαση τής Επιτροπής τής 7ης Μαΐου
