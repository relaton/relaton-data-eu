    προσωρινά τήν εμπορία δασικού πολλαπλασιαστικού
    υλικού τό οποίο δέν ανταποκρίνεται στίς απαιτήσεις
    τής οδηγίας 66/404/EOK'
  type: main
- language: it
  script: Latn
  content: '82/338/CEE: Decisione della Commissione, del 7 maggio 1982, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    di moltiplicazione di alcune specie forestali che non corrispondono alle esigenze
    della direttiva 66/404/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '82/338/EEG: Beschikking van de Commissie van 7 mei 1982 houdende machtiging
