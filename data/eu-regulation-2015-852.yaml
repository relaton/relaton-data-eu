  script: Latn
  content: Commission Delegated Regulation (EU) 2015/852 of 27 March 2015 supplementing
    Regulation (EU) No 508/2014 of the European Parliament and of the Council as regards
    the cases of non-compliance and the cases of serious non-compliance with the rules
    of the Common Fisheries Policy that may lead to an interruption of a payment deadline
    or suspension of payments under the European Maritime and Fisheries Fund
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2015/852 de la Commission du 27 mars 2015 complétant
    le règlement (UE) n° 508/2014 du Parlement européen et du Conseil en ce qui
    concerne les cas de manquement et les cas de manquement grave aux règles de la
    politique commune de la pêche qui peuvent entraîner l'interruption du délai
    de paiement ou la suspension des paiements dans le cadre du Fonds européen pour
    les affaires maritimes et la pêche
  type: main
