    applicables à l'importation dans la République fédérale de pain et de pâte
    à fondant en provenance d'autres États membres
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission zur Verlängerung der Entscheidung der Kommission
    vom 28. Juni 1961 zur Festlegung von Schutzmaßnahmen bei der Einfuhr von Brot
    und Fondantmasse aus anderen Mitgliedstaaten in die Bundesrepublik Deutschland,
    hier betreffend Fondantmasse
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione relativa alla proroga, nei riguardi della pasta
    per fondente, della decisione della Commissione del 28 giugno 1961 che stabilisce
    le misure di salvaguardia applicabili alla importazione nella Repubblica Federale
    di Germania del pane e della pasta per fondente in provenienza da altri Stati
    membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie tot verlenging, ten aanzien van fondant, van
