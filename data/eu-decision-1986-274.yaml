title:
- language: en
  script: Latn
  content: '86/274/EEC: Commission Decision of 27 May 1986 concerning the zones referred
    to in Article 2 (3) of Regulation (EEC) No 2616/80 instituting a specific Community
    regional development measure contributing to overcoming constraints on the development
    of new economic activities in certain zones adversely affected by restructuring
    of the steel industry'
  type: main
- language: fr
  script: Latn
  content: '86/274/CEE: Décision de la Commission du 27 mai 1986 relative aux zones
    visées à l''article 2 paragraphe 3 du règlement (CEE) n° 2616/80 instituant
    une action communautaire spécifique de développement régional contribuant à
    l''élimination des obstacles au développement de nouvelles activités économiques
    dans certaines zones affectées par la restructuration de l''industrie sidérurgique'
  type: main
- language: de
  script: Latn
  content: '86/274/EWG: Entscheidung der Kommission vom 27. Mai 1986 bezüglich der
    Gebiete gemäß Artikel 2 Absatz 3 der Verordnung (EWG) Nr. 2616/80 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Beseitigung von Entwicklungshemmnissen für neue Wirtschaftszweige in
    bestimmten von der Umstrukturierung der Eisen- und Stahlindustrie betroffenen
    Gebieten'
  type: main
- language: da
  script: Latn
  content: '86/274/EØF: Kommissionens beslutning af 27. maj 1986 om de områder,
    der er omhandlet i artikel 2, stk. 3, i forordning (EØF) nr. 2616/80 om gennemførelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at fjerne hindringerne for udviklingen af nye økonomiske aktiviteter i visse
    områder, der er berørt af strukturomlægningen i jern- og stålindustrien'
  type: main
- language: el
  script: Grek
  content: '86/274/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
