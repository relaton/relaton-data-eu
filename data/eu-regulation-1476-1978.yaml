  content: Commission Regulation (EEC) No 1476/78 of 29 June 1978 fixing the rates
    of the refunds applicable from 1 July 1978 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1476/78 de la Commission, du 29 juin 1978, fixant les
    taux des restitutions applicables, à compter du 1er juillet 1978, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1476/78 der Kommission vom 29. Juni 1978 zur Festsetzung
    der ab 1. Juli 1978 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1476/78 af 29. juni 1978 om fastsættelse
    af de restitutionssatser, det fra 1. juli 1978 skal anvendes for visse produkter
    fra korn og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1476/78 della Commissione, del 29 giugno 1978, che
