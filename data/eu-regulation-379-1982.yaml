title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 379/82 of 15 February 1982 laying down for
    the period 15 February to 30 April 1982 certain interim measures for the conservation
    and management of fishery resources applicable to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 379/82 du Conseil, du 15 février 1982, fixant, pour
    la période du 15 février au 30 avril 1982, certaines mesures intérimaires de
    conservation et de gestion des ressources de pêche applicables aux navires battant
    pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 379/82 des Rates vom 15. Februar 1982 zur Festlegung
    zeitweiliger Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge für die Zeit vom 15. Februar bis zum 30. April
    1982
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 379/82 af 15. februar 1982 om fastsættelse
    for perioden fra den 15. februar til den 30. april 1982 af en række foreløbige
    foranstaltninger til bevarelse og forvaltning af fiskeressourcerne, som skal finde
    anvendelse på fartøjer, der fører spansk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 379/82 τού Συμβουλίου
    τής 15ης Φεβρουαρίου 1982 περί καθορισμού γιά
    τήν περίοδο από 15 Φεβρουαρίου μέχρι 30 Απριλίου
    1982 ορισμένων ενδιάμεσων μέτρων διατηρήσεως
    καί διαχειρίσεως τών αλιευτικών πόρων πού
    εφαρμόζονται σέ σκάφη υπό ισπανική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 379/82 del Consiglio, del 15 febbraio 1982, che dispone,
    per il periodo dal 15 febbraio al 30 aprile 1982, alcune misure provvisorie di
    conservazione e di gestione delle risorse di pesca da applicare alle navi battenti
    bandiera della Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 379/82 van de Raad van 15 februari 1982 tot vaststelling,
    voor de periode van 15 februari tot en met 30 april 1982, van bepaalde tussentijdse
    maatregelen voor de instandhouding en het beheer van de visbestanden ten aanzien
    van vaartuigen die de vlag van Spanje voeren
  type: main
