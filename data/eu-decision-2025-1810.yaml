    2025 modifiant la décision d’exécution (UE) 2022/1668 en ce qui concerne les
    normes harmonisées relatives aux équipements d’application pour produits de
    revêtement, aux installations d’alimentation et de circulation de produits
    de revêtement liquide, aux systèmes de suppression d’explosion et aux systèmes
    automatiques d’application électrostatique de matériaux de revêtement inflammables
  type: main
- language: de
  script: Latn
