    κανονισμό (ΕΟΚ) αριθ. 3378/82 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1060/83 della Commissione del 29 aprile 1983 che ripristina
    la riscossione dei dazi doganali applicabili a taluni cappotti, soprabiti, mantelli
    e simili, tessuti, della categoria di prodotti n. 14 B (codice 0145), originari
    dell' India, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1060/83 van de Commissie van 29 april 1983 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    overjassen, regenjassen, van de categorie van produkten nr. 14 B (codenummer 0145),
    van oorsprong uit India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3378/82 van de Raad
