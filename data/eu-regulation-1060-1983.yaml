title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1060/83 of 29 April 1983 re-establishing
    the levying of customs duties on certain woven overcoats, raincoats and other
    coats, products of category 14 B (code 0145), originating in India, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3378/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1060/83 de la Commission du 29 avril 1983 portant
    rétablissement de la perception des droits de douane applicables à certains
    pardessus, imperméables et autres manteaux tissés de la catégorie 14 B (code
    0145), originaires de l' Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1060/83 der Kommission vom 29. April 1983 über die
    Wiedereinführung des Zollsatzes für bestimmte Mäntel und Umhänge aus Geweben
    der Warenkategorie Nr. 14 B (Kennziffer 0145), mit Ursprung in Indien, dem die
    in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1060/83 af 29. april 1983 om genindførelse
    af opkrævning af toldafgifter for frakker, kapper og slag, vævede, under kategori
    14 B (kode 0145), som har oprindelse i Indien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
