id: EURegulation14871977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1487/77 of 1 July 1977 re-establishing the
    levying of customs duties on sacks and bags, of a kind used for the packing of
    goods, falling within subheading 62.03 B I a) ex b) ex II, originating in Pakistan
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3022/76 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1487/77 de la Commission, du 1er juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux sacs et
    sachets d'emballage, de la sous-position tarifaire 62.03 B I a), EX b), EX II,
    originaires du Pakistan, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3022/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1487/77 der Kommission vom 1. Juli 1977 über die
    Wiedereinführung des Zollsatzes für Säcke und Beutel zu Verpackungszwecken,
    der Tarifstelle 62.03 B I a) ex b) ex II, mit Ursprung in Pakistan, dem die in
    der Verordnung (EWG) Nr. 3022/76 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1487/77 af 1. juli 1977 om genindførelse
    af opkrævning af toldafgifter for sække og poser til emballage, under underposition
    62.03 B I a) ex b) ex II, som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3022/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1487/77 della Commissione, del 1 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi e sacchetti
    da imballaggio della sottovoce doganale 62.03 B I a) ex b) ex II, originari del
    Pakistan beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3022/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1487/77 van de Commissie van 1 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op zakken voor
    verpakkingsdoeleinden, van post 62.03 B I a) ex b) ex II, van oorsprong uit Pakistan,
    waarvoor de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG)
    nr. 3022/76 van de Raad
  type: main
