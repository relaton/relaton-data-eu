    le dichiarazioni delle spese e delle entrate e le condizioni di rimborso delle
    spese nell’ambito del FEAGA e del FEASR
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 482/2009 ( 2009. gada 8. jūnijs ), ar kuru groza
    Komisijas Regulu (EK) Nr. 1974/2006, ar ko paredz sīki izstrādātus piemērošanas
    noteikumus Padomes Regulai (EK) Nr. 1698/2005 par atbalstu lauku attīstībai
    no Eiropas Lauksaimniecības fonda lauku attīstībai (ELFLA), un Regulu (EK)
    Nr. 883/2006, ar ko nosaka piemērošanas kārtību Padomes Regulai (EK) Nr. 1290/2005
    attiecībā uz maksājumu aģentūru uzskaiti, izdevumu un ieņēmumu deklarācijām
    un izdevumu atmaksājumu nosacījumiem saistībā ar ELGF un ELFLA
  type: main
