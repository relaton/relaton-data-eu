  script: Latn
  content: Komisjoni määrus (EÜ) nr 482/2009, 8. juuni 2009 , millega muudetakse
    määrust (EÜ) nr 1974/2006, milles sätestatakse nõukogu määruse (EÜ) nr
    1698/2005 (Maaelu Arengu Euroopa Põllumajandusfondist (EAFRD) antavate maaelu
    arengu toetuste kohta) kohaldamise üksikasjalikud eeskirjad, ja määrust (EÜ)
