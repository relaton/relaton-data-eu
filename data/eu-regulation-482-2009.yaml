    (EB) Nr. 1698/2005 dėl Europos žemės ūkio fondo kaimo plėtrai (EŽŪFKP)
    paramos kaimo plėtrai taikymo taisykles, ir Reglamentą (EB) Nr. 883/2006, nustatantį
