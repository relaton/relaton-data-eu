  script: Latn
  content: A Bizottság 482/2009/EK rendelete ( 2009. június 8. ) az Európai Mezőgazdasági
    Vidékfejlesztési Alapból (EMVA) nyújtandó vidékfejlesztési támogatásról
    szóló 1698/2005/EK tanácsi rendelet részletes alkalmazási szabályainak megállapításáról
    szóló 1974/2006/EK rendelet, valamint az 1290/2005/EK tanácsi rendeletnek az
    EMGA és az EMVA keretében a kifizető ügynökségek számlavezetésére, a
    kiadásigazoló és a bevételi nyilatkozatokra, valamint a kiadások visszatérítési
    feltételeire vonatkozó részletes alkalmazási szabályairól szóló 883/2006/EK
    rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 482/2009 della Commissione, dell' 8 giugno 2009 , che
    modifica il regolamento (CE) n. 1974/2006 recante disposizioni di applicazione
    del regolamento (CE) n. 1698/2005 del Consiglio sul sostegno allo sviluppo rurale
    da parte del Fondo europeo agricolo per lo sviluppo rurale (FEASR) e il regolamento
    (CE) n. 883/2006 recante modalità d’applicazione del regolamento (CE) n. 1290/2005
