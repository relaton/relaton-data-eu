  script: Cyrl
  content: Регламент (ЕО) № 482/2009 на Комисията от 8 юни
    2009 година за изменение на Регламент (ЕО) № 1974/2006
    за определянето на подробни правила за прилагане
    на Регламент (ЕО) № 1698/2005 на Съвета относно
    подпомагане на развитието на селските райони
    от Европейския земеделски фонд за развитие
    на селските райони (ЕЗФРСР) и за изменение на
    Регламент (ЕО) № 883/2006 за формулирането на подробни
    правила за прилагане на Регламент (ЕО) № 1290/2005
    на Съвета по отношение на воденето на счетоводство
    от разплащателните агенции, декларациите за
    разходи и приходи и условията за възстановяване
    на разходите по линия на Европейския фонд за
    гарантиране на земеделието (ЕФГЗ) и Европейския
    земеделски фонд за развитие на селските райони
    (ЕЗФРСР)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 482/2009 ze dne 8. června 2009 o změně nařízení
    (ES) č. 1974/2006, kterým se stanoví podrobná pravidla pro použití nařízení
    Rady (ES) č. 1698/2005 o podpoře pro rozvoj venkova z Evropského zemědělského
    fondu pro rozvoj venkova (EZFRV), a nařízení (ES) č. 883/2006, kterým se
    stanoví prováděcí pravidla k nařízení Rady (ES) č. 1290/2005, pokud jde
    o vedení účtů platebních agentur, výkazy výdajů a příjmů a podmínky
    následné úhrady výdajů v rámci EZZF a EZFRV
  type: main
