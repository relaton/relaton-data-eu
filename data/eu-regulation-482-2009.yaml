title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 482/2009 of 8 June 2009 amending Regulation
    (EC) No 1974/2006 laying down detailed rules for the application of Council Regulation
    (EC) No 1698/2005 on support for rural development by the European Agricultural
    Fund for Rural Development (EAFRD) and Regulation (EC) No 883/2006 laying down
    detailed rules for the application of Council Regulation (EC) No 1290/2005 as
    regards the keeping of accounts by the paying agencies, declarations of expenditure
    and revenue and the conditions for reimbursing expenditure under the EAGF and
    the EAFRD
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 482/2009 de la Commission du 8 juin 2009 modifiant
    le règlement (CE) n o 1974/2006 portant modalités d’application du règlement
    (CE) n o 1698/2005 du Conseil concernant le soutien au développement rural par
    le Fonds européen agricole pour le développement rural (Feader) et le règlement
    (CE) n o 883/2006 portant modalités d’application du règlement (CE) n o 1290/2005
    du Conseil, en ce qui concerne la tenue des comptes des organismes payeurs, les
    déclarations de dépenses et de recettes et les conditions de remboursement des
    dépenses dans le cadre du FEAGA et du Feader
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 482/2009 der Kommission vom 8. Juni 2009 zur Änderung
    der Verordnung (EG) Nr. 1974/2006 mit Durchführungsbestimmungen zur Verordnung
    (EG) Nr. 1698/2005 des Rates über die Förderung der Entwicklung des ländlichen
    Raums durch den Europäischen Landwirtschaftsfonds für die Entwicklung des ländlichen
    Raums (ELER) und der Verordnung (EG) Nr. 883/2006 mit Durchführungsvorschriften
    zur Verordnung (EG) Nr. 1290/2005 des Rates hinsichtlich der Buchführung der
    Zahlstellen, der Ausgaben- und Einnahmenerklärungen und der Bedingungen für
    die Erstattung der Ausgaben im Rahmen des EGFL und des ELER
  type: main
