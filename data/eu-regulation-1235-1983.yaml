title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1235/83 of 18 May 1983 re-establishing the
    levying of customs duties applicable to musk xylene, falling within subheading
    29.03 B ex II and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1235/83 de la Commission du 18 mai 1983 portant rétablissement
    de la perception des droits de douane applicables au muscxylène, de la sous-position
    29.03 B ex II du tarif douanier commun, originaires de Chine, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1235/83 der Kommission vom 18. Mai 1983 zur Wiedereinführung
