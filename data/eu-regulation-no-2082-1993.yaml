    osalta toisaalta keskenään ja toisaalta Euroopan investointipankin toiminnan
    ja muiden rahoitusvälineiden kanssa annetun asetuksen (ETY) N:o 4253/88 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2082/93 del Consiglio del 20 luglio 1993 che modifica
