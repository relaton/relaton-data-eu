    Fondi strutturali, da un lato, e tra tali interventi e quelli della Banca europea
    per gli investimenti e degli altri strumenti finanziari esistenti, dall'altro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2082/93 van de Raad van 20 juli 1993 houdende wijziging
