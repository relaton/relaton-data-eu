  content: Council Regulation (EEC) No 2082/93 of 20 July 1993 amending Regulation
    (EEC) No 4253/88 laying down provisions for implementing Regulation (EEC) No 2052/88
    as regards coordination of the activities of the different Structural Funds between
    themselves and with the operations of the European Investment Bank and the other
    existing financial instruments
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2082/93 du Conseil du 20 juillet 1993 modifiant le
    règlement (CEE) n° 4253/88 portant dispositions d'application du règlement
    (CEE) n° 2052/88 en ce qui concerne la coordination entre les interventions des
    différents Fonds structurels, d'une part, et entre celles-ci et celles de la
    Banque européenne d'investissement et des autres instruments financiers existants,
    d'autre part
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2082/93 des Rates vom 20. Juli 1993 zur Änderung
    der Verordnung (EWG) Nr. 4253/88 zur Durchführung der Verordnung (EWG) Nr. 2052/88
    hinsichtlich der Koordinierung der Interventionen der verschiedenen Strukturfonds
    einerseits und zwischen diesen und den Interventionen der Europäischen Investitionsbank
    und der sonstigen vorhandenen Finanzinstrumente andererseits
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EØF) Nr. 2082/93 af 20. juli 1993 om ændring af forordning
