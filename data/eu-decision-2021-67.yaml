id: EUDecision202167
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2021/67 of 22 January 2021 renewing
    the authorisation for the placing on the market of products containing, consisting
    of or produced from genetically modified maize MON 88017 (MON-88Ø17-3) pursuant
    to Regulation (EC) No 1829/2003 of the European Parliament and of the Council
    (notified under document C(2021) 286) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2021/67 de la Commission du 22 janvier 2021
    renouvelant l’autorisation de mise sur le marché de produits contenant du maïs
    génétiquement modifié MON 88017 (MON-88Ø17-3), consistant en ce maïs ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
    européen et du Conseil [notifiée sous le numéro C(2021) 286] (Le texte en langue
    néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2021/67 der Kommission vom 22. Januar 2021
    zur Erneuerung der Zulassung für das Inverkehrbringen von Erzeugnissen, die genetisch
    veränderten Mais der Sorte MON 88017 (MON-88Ø17-3) enthalten, aus ihm bestehen
    oder aus ihm hergestellt werden, gemäß der Verordnung (EG) Nr. 1829/2003 des
    Europäischen Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2021)
    286) (Nur der niederländische Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2021/67 на Комисията
    от 22 януари 2021 година за подновяване на разрешението
    за пускане на пазара на продукти, съдържащи,
    състоящи се или произведени от генетично модифицирана
    царевица MON 88017 (MON-88Ø17-3), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2021) 286) (само текстът
    на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2021/67, ze dne 22. ledna 2021 o obnovení
    povolení pro uvádění produktů, které obsahují geneticky modifikovanou kukuřici
    MON 88017 (MON-88Ø17-3), sestávají z ní nebo jsou z ní vyrobeny, na trh podle
    nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem
    C(2021) 286) (Pouze nizozemské znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2021/67 af 22. januar 2021
    om forlængelse af tilladelsen til markedsføring af produkter, der indeholder,
    består af eller er fremstillet af genetisk modificeret MON 88017-majs (MON-88Ø17-3),
    i henhold til Europa-Parlamentets og Rådets forordning (EF) nr. 1829/2003 (meddelt
    under nummer (C2021) 286) (Kun den nederlandske udgave er autentisk)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2021/67 της Επιτροπής
    της 22ας Ιανουαρίου 2021 για την ανανέωση της
    έγκρισης της διάθεσης στην αγορά προϊόντων
    που περιέχουν, αποτελούνται ή παράγονται από
    γενετικώς τροποποιημένο αραβόσιτο της σειράς
    MON 88017 (MON-88Ø17-3) σύμφωνα με τον κανονισμό (ΕΚ)
