  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2021/67, 22. jaanuar 2021, millega pikendatakse
    geneetiliselt muundatud maisi MON 88017 (MON-88Ø17-3) sisaldavate, sellest koosnevate
    või sellest toodetud toodete turulelaskmise luba vastavalt Euroopa Parlamendi
    ja nõukogu määrusele (EÜ) nr 1829/2003 (teatavaks tehtud numbri(2021) 286
    all) (Ainult hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2021/67, annettu 22 päivänä
    tammikuuta 2021, muuntogeenistä maissia MON 88017 (MON-88Ø17-3) sisältävien,
    siitä koostuvien tai siitä valmistettujen tuotteiden markkinoille saattamista
    koskevan luvan uusimisesta Euroopan parlamentin ja neuvoston asetuksen (EY) N:o
    1829/2003 mukaisesti (tiedoksiannettu numerolla C(2021) 286) (Ainoastaan hollanninkielinen
    teksti on todistusvoimainen)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2021/67 оd 22. siječnja 2021. o produljenju
    odobrenja za stavljanje na tržište proizvoda koji sadržavaju genetski modificirani
    kukuruz MON 88017 (MON-88Ø17-3), sastoje se ili su proizvedeni od njega, u skladu
    s Uredbom (EZ) br. 1829/2003 Europskog parlamenta i Vijeća (priopćeno pod brojem
    dokumenta C(2021) 286) (Vjerodostojan je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/67 végrehajtási határozata (2021. január 22.)
    a géntechnológiával módosított MON 88017 (MON-88Ø17-3) kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalára vonatkozó
    engedély 1829/2003/EK európai parlamenti és tanácsi rendelet szerinti megújításáról
    (az értesítés a C(2021) 286. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2021/67 della Commissione del 22 gennaio 2021
    che rinnova l'autorizzazione all'immissione in commercio di prodotti contenenti,
    costituiti o derivati dal granturco geneticamente modificato MON 88017 (MON-88Ø17-3)
    a norma del regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio
    [notificata con il numero C(2021) 286] (Il testo in lingua neerlandese è il solo
    facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2021/67 (2021. gada 22. janvāris),
    ar ko atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atjauno
    atļauju laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MON
    88017 (MON-88Ø17-3), no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta
    numuru C(2021) 286) (Autentisks ir tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2021/67 2021 m. sausio 22 d. kuriuo
    pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 pratęsiamas
    leidimas pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų
    kukurūzų MON 88017 (MON-88Ø17-3), kurie iš jų sudaryti arba pagaminti (pranešta
    dokumentu Nr. C(2021) 286) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2021/67 tat-22
    ta’ Jannar 2021 li ġġedded l-awtorizzazzjoni għat-tqegħid fis-suq ta’
    prodotti li jkun fihom il-qamħirrum ġenetikament modifikat MON 88017 (MON-88Ø17-3),
    li jkunu jikkonsistu, jew li jkunu magħmulin minnu, skont ir-Regolament (KE)
    Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata bid-dokument C(2021)
