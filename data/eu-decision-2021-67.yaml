  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2021/67 van de Commissie van 22 januari 2021 tot
    verlenging van de vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met de genetisch gemodificeerde
    mais MON 88017 (MON-88ø17-3) overeenkomstig Verordening (EG) nr. 1829/2003 van
    het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2021)
    286) (Slechts de tekst in de Nederlandse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2021/67 z dnia 22 stycznia 2021 r. odnawiająca
    zezwolenie na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003
    Parlamentu Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną
    kukurydzę MON 88017 (MON-88Ø17-3), składających się z niej lub z niej wyprodukowanych
    (notyfikowana jako dokument nr C(2021) 285) (Jedynie tekst w języku niderlandzkim
    jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2021/67 da Comissão de 22 de janeiro de 2021
    que renova a autorização de colocação no mercado de produtos que contenham,
    sejam constituídos por, ou sejam produzidos a partir de milho geneticamente modificado
    MON 88017 (MON-88Ø17-3) nos termos do Regulamento (CE) n.o 1829/2003 do Parlamento
    Europeu e do Conselho [notificada com o número C(2021) 286] (Apenas faz fé o
    texto em língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2021/67 a Comisiei din 22 ianuarie
    2021 de reînnoire a autorizației de introducere pe piață a produselor care
    conțin, constau în sau sunt fabricate din porumb modificat genetic MON 88017
    (MON-88Ø17-3), în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului
    European și al Consiliului [notificată cu numărul C(2021) 286] (Numai textul
    în limba neerlandeză este autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2021/67 z 22. januára 2021, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 obnovuje
    povolenie umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú
    kukuricu MON 88017 (MON-88Ø17-3), sú z nej zložené alebo vyrobené [oznámené
    pod číslom C(2021) 286] (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2021/67 z dne 22. januarja 2021 o obnovitvi
    odobritve dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo MON
    88017 (MON-88Ø17-3), so iz nje sestavljeni ali proizvedeni, v skladu z Uredbo
    (ES) št. 1829/2003 Evropskega parlamenta in Sveta (notificirano pod dokumentarno
    številko C(2021) 286) (Besedilo v nizozemskem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2021/67 de la Comisión de 22 de enero de
    2021 por la que se renueva la autorización de comercialización de los productos
    que contengan maíz modificado genéticamente MON 88017 (MON-88Ø17-3), se compongan
    de dicho maíz o se hayan producido a partir de él, con arreglo al Reglamento
    (CE) n.o 1829/2003 del Parlamento Europeo y del Consejo [notificada con el número
    C(2021) 286] (El texto en lengua neerlandesa es el único auténtico)
  type: main
