    kæmmede eller på anden måde beredt til spidning, under varekategori 55 (løbenummer
    40.0550), som har oprindelse i Mexico og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 4259/88
  type: main
