title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3342/89 of 7 November 1989 re-establishing
    the levying of customs duties on synthetic staple fibres, including waste, carded
    or combed or otherwise processed for spinning, products of category 55 (order
    No 40.0550), originating in Mexico, to which the preferential tariff arrangements
    of Council Regulation (EEC) No 4259/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3342/89 de la Commission du 7 novembre 1989 portant
    rétablissement de la perception des droits de douane applicables aux fibres synthétiques
    discontinues, y compris les déchets, cardées ou peignées ou autrement transformées
    pour la filature, de la catégorie de produits n° 55 (numéro d'ordre 40.0550)
    originaires du Mexique, bénéficiaire des préférences tarifaires prévues par
    le règlement (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3342/89 DER KOMMISSION vom 7. November 1989 zur Wiedereinführung
    des Zollsatzes für synthetische Spinnfasern und Abfälle, gekrempelt, gekämmt
    oder anders für die Spinnerei vorbereitet der Warenkategorie Nr. 55 (lfd. Nr.
    40.0550) mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 4259/88 des
    Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3342/89 af 7. november 1989 om genindførelse
