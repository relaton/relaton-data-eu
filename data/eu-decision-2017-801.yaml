title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/801 of 8 May 2017 amending Implementing
    Decision (EU) 2016/715 setting out measures in respect of certain fruits originating
    in certain third countries to prevent the introduction into and the spread within
    the Union of the harmful organism Phyllosticta citricarpa (McAlpine) Van der Aa
    (notified under document C(2017) 2894)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/801 de la Commission du 8 mai 2017 modifiant
    la décision d'exécution (UE) 2016/715 établissant des mesures à l'égard de
    certains fruits originaires de certains pays tiers visant à éviter l'introduction
    et la propagation dans l'Union de l'organisme nuisible Phyllosticta citricarpa
    (McAlpine) Van der Aa [notifiée sous le numéro C(2017) 2894]
  type: main
