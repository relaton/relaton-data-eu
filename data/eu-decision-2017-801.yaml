    che stabilisce misure per quanto concerne taluni frutti originari di taluni paesi
    terzi per impedire l'introduzione e la diffusione nell'Unione dell'organismo nocivo
    Phyllosticta citricarpa (McAlpine) Van der Aa [notificata con il numero C(2017)
    2894]
