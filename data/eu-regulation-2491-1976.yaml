title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2491/76 of 13 October 1976 terminating the
    temporary prohibition on the importation of frozen hake and saithe and fillets
    thereof and of fresh, chilled or frozen whole cod
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2491/76 de la Commission, du 13 octobre 1976, portant
    abrogation de la suspension des importations de merlus et lieus noirs congelés
    entiers ou en filets, de cabillauds frais ou réfrigérés, ainsi que de cabillauds
    entiers congelés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2491/76 der Kommission vom 13. Oktober 1976 zur Aufhebung
    der Aussetzung der Einfuhren von gefrorenen Seehechten und Köhler sowie deren
    Filets, von frischem oder gekühltem Kabeljau sowie von gefrorenem ganzen Kabeljau
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2491/76 af 13. oktober 1976 om ophævelse
    af suspensionen af indførselen af frosne kulmuler og sej, hele eller fileter,
    ferske eller kølede torsk samt hele frosne torsk
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2491/76 della Commissione, del 13 ottobre 1976, che
    abroga la sospensione delle importazioni di naselli e merluzzi carbonari congelati
    interi o in filetti, di merluzzi bianchi freschi o refrigerati e merluzzi bianchi
    interi congelati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2491/76 van de Commissie van 13 oktober 1976 houdende
    opheffing van de schorsing van de invoer van bevroren heek en koolvis, in gehele
    staat of in filets, van verse of gekoelde kabeljauw in gehele staat, en van bevroren
    kabeljauw in gehele staat
  type: main
