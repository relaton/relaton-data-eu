title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1635/77 of 20 July 1977 re-establishing
    the levying of the customs duties on other articles for electrical lighting fittings
    falling within subheading 70.14 A II, originating in Yugoslavia, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3021/76
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1635/77 de la Commission, du 20 juillet 1977, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    pour l'équipement des appareils d'éclairage électrique, de la sous-position
    tarifaire 70.14 A II, originaires de la Yougoslavie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3021/76 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1635/77 der Kommission vom 20. Juli 1977 zur Wiedereinführung
    des Zollsatzes für andere Waren zum Ausstatten von elektrischen Beleuchtungskörpern
    der Tarifstelle 70.14 A II, mit Ursprung in Jugoslawien, dem die in der Verordnung
    (EWG) Nr. 3021/76 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1635/77 af 20. juli 1977 om genindførelse
    af opkrævning af toldafgifter for andre glasartikler, der anvendes som udstyr
    til elektriske belysningsartikler under underposition 70.14 A II, som har oprindelse
    i Jugoslavien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3021/76
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1635/77 della Commissione, del 20 luglio 1977, che
    ripristina la riscossione dei dazi doganali applicabili agli altri oggetti per
    completare gli apparecchi d'illuminazione elettrica della sottovoce doganale 70.14
    A II, originari della Iugoslavia beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3021/76 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1635/77 van de Commissie van 20 juli 1977 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op andere uitrustingsstukken
    voor elektrische verlichtingsartikelen, van post 70.14 A II, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 3021/76 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
