  content: Council Regulation (EC) No 258/2005 of 14 February 2005 amending the anti-dumping
    measures imposed by Regulation (EC) No 348/2000 on imports of certain seamless
    pipes and tubes of iron or non-alloy steel originating in Croatia and Ukraine
  type: main
- language: fr
  script: Latn
