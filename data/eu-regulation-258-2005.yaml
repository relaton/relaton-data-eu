    mesures antidumping instituées par le règlement (CE) n° 348/2000 sur les importations
    de certains tubes et tuyaux sans soudure, en fer ou en acier non allié, originaires
    de Croatie et d'Ukraine
  type: main
- language: de
  script: Latn
