    des catégories 69 et 91 (numéro d' ordre 40.0690 et 40.0910) originaires de
    Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
