  script: Latn
  content: Commission Regulation (EEC) No 1474/92 of 4 June 1992 re- establishing
    the levying of customs duties on products of categories 69 and 91 (order Nos 40.0690
    and 40.0910), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1474/92 de la Commission, du 4 juin 1992, portant
