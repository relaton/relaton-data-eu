  content: Commission Regulation (EEC) No 257/77 of 4 February 1977 correcting Regulations
    (EEC) No 1896/73 and (EEC) No 582/76 as regards beef which may be bought into
    intervention in Ireland, and coefficients in the beef sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 257/77 de la Commission, du 4 février 1977, rectifiant
    les règlements (CEE) n° 1896/73 et (CEE) n° 582/76 en ce qui concerne les produits
    pouvant faire l' objet d' achats à l' intervention en Irlande ainsi que leurs
    coefficients dans le secteur de la viande bovine
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 257/77 der Kommission vom 4. Februar 1977 zur Berichtigung
    der Verordnungen (EWG) Nr. 1896/73 und (EWG) Nr. 582/76 bezüglich der Erzeugnisse
    des Rindfleischsektors, die Gegenstand von Interventionskäufen in Irland sein
    können, sowie ihrer Koeffizienten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 257/77 af 4. februar 1977 om berigtigelse
