title:
- language: en
  script: Latn
  content: '97/604/EC: Commission Decision of 5 August 1997 modifying Commission Decision
    95/199/EC and approving a modification of the single programming document for
    Community structural measures for improving the processing and marketing conditions
    for agricultural products in Hessen (Germany), in respect of Objective 5 (a),
    covering the period between 1994 and 1999 (Only the German version is authentic)'
  type: main
- language: fr
  script: Latn
  content: '97/604/CE: Décision de la Commission du 5 août 1997 modifiant la décision
    95/199/CE et portant approbation d''une modification du document unique de programmation
    pour les interventions structurelles communautaires relatives à l''amélioration
    des conditions de transformation et de commercialisation des produits agricoles
    en Hesse (République fédérale d''Allemagne), au titre de l''objectif n° 5
    a), couvrant la période entre 1994 et 1999 (Le texte en langue allemande est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '97/604/EG: Entscheidung der Kommission vom 5. August 1997 zur Änderung
    der Entscheidung 95/199/EG und zur Genehmigung einer Änderung des den Zeitraum
    1994 bis 1999 betreffenden einzigen Programmplanungsdokuments zu den strukturellen
    Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs- und Vermarktungsbedingungen
    landwirtschaftlicher Erzeugnisse im Rahmen der Zielvorgabe 5a in Hessen (Bundesrepublik
    Deutschland) (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '97/604/EF: Kommissionens beslutning af 5. august 1997 om ændring af beslutning
    95/199/EF og godkendelse af en ændring af enhedsprogrammeringsdokumentet for
    EF''s strukturinterventioner vedrørende forarbejdning og afsætning af landbrugsprodukter
    i Hessen (Tyskland) for mål nr. 5a for perioden 1994 til 1999 (Kun den tyske
    udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '97/604/ΕΚ: Απόφαση της Επιτροπής της 5ης Αυγούστου
    1997 για την τροποποίηση της απόφασης 95/199/ΕΚ
    της Επιτροπής και την έγκριση μιας τροποποίησης
    του ενιαίου εγγράφου προγραμματισμού για κοινοτικές
    διαρθρωτικές παρεμβάσεις σχετικά με τη βελτίωση
    των συνθηκών μεταποίησης και εμπορίας γεωργικών
    προϊόντων στο Hessen (Γερμανία), όσον αφορά το
    στόχο 5 α), που καλύπτει την περίοδο μεταξύ 1994
    και 1999 (Το κείμενο στη γερμανική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '97/604/EY: Komission päätös, tehty 5 päivänä elokuuta 1997, Hessenin
    (Saksan liittotasavalta) maataloustuotteiden jalostamisen ja kaupan pitämisen
    edellytysten parantamiseen liittyviä yhteisön rakenteellisia interventioita
    koskevan ohjelma-asiakirjan hyväksymisestä tavoitteen 5 a mukaisesti vuosien
    1994 ja 1999 väliseksi ajaksi tehdyn päätöksen 95/199/EY muuttamisesta (Ainoastaan
    saksankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
