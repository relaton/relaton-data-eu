    natürliche oder künstliche Weise kleinwüchsig gehaltenen, zum Anpflanzen bestimmten
    Pflanzen von Chamaecyparis Spach, Juniperus L. und bestimmten Arten von Pinus
    L. mit Ursprung in Japan und zur Aufhebung der Durchführungsverordnung (EU) 2020/1217
