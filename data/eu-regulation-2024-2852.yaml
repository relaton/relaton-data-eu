  script: Latn
  content: Commission Implementing Regulation (EU) 2024/2852 of 11 November 2024 establishing
    a derogation from Implementing Regulation (EU) 2019/2072 as regards the requirements
    for the introduction into the Union territory of naturally or artificially dwarfed
    plants for planting of Chamaecyparis Spach, Juniperus L. and certain species of
    Pinus L., originating in Japan and repealing Implementing Regulation (EU) 2020/1217
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2024/2852 de la Commission du 11 novembre
    2024 établissant une dérogation au règlement d’exécution (UE) 2019/2072
    en ce qui concerne les exigences relatives à l’introduction sur le territoire
    de l’Union de végétaux dont la croissance est inhibée naturellement ou artificiellement,
    destinés à la plantation, de Chamaecyparis Spach, de Juniperus L. et de certaines
    espèces de Pinus L., originaires du Japon, et abrogeant le règlement d’exécution
    (UE) 2020/1217
  type: main
