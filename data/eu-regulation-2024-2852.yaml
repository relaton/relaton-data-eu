    fajaihoz tartozó, természetes úton vagy mesterségesen törpésített, Japánból
    származó, ültetésre szánt növényeknek az Unió területére történő
    behozatala tekintetében az (EU) 2019/2072 végrehajtási rendelettől való eltérés
    bevezetéséről és az (EU) 2020/1217 végrehajtási rendelet hatályon kívül
    helyezéséről
