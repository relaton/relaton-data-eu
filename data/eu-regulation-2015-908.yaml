    I към Регламент (ЕО) № 798/2008 по отношение на вписването
    за Канада в списъка на трети държави, територии,
    зони или компартменти, от които могат да бъдат
    внасяни и да преминават транзитно през територията
    на Съюза определени стоки, получени от домашни
    птици
  type: main
- language: cs
  script: Latn
