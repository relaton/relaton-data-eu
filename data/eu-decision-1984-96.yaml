    Eichenholz mit Ursprung in den Vereinigten Staaten von Amerika Ausnahmen von bestimmten
    Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der französische,
    deutsche, italienische, niederländische und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/96/EØF: Kommissionens beslutning af 10. februar 1984 om ændring af
    beslutning 83/78/EØF om bemyndigelse af visse medlemsstater til at undtage egetræ
    med oprindelse i USA fra visse bestemmelser i Rådets direktiv 77/93/EØF (Kun
    den franske, tyske, italienske, nederlandske og udgave er danske autentiske)'
  type: main
- language: el
  script: Grek
  content: '84/96/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Φεβρουαρίου
    1984 για τροποποίηση της απόφασης 83/78/ΕΟΚ που
    επιτρέπει σε ορισμένα κράτη μέλη να παρεκκλίνουν
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά το ξύλο βελανιδιάς
    καταγωγής Ηνωμένων Πολιτειών Αμερικής (Τα
