title:
- language: en
  script: Latn
  content: '84/96/EEC: Commission Decision of 10 February 1984 amending Decision 83/78/EEC
    authorizing certain Member States to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of oak wood originating in the United
    States of America (Only the French, German, Italian, Dutch and Danish texts are
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/96/CEE: Décision de la Commission du 10 février 1984 modifiant la
    décision 83/78/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour le bois de
    chêne originaire des Etats-Unis d''Amérique (Les textes en langues française,
    allemande, italienne, néerlandaise et danoise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/96/EWG: Entscheidung der Kommission vom 10. Februar 1984 zur Änderung
