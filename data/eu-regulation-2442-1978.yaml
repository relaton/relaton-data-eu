  content: Commission Regulation (EEC) No 2442/78 of 18 October 1978 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A, originating in developing countries, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 2705/77 apply
  type: main
