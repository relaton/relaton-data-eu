    tubes à incandescence pour l' éclairage, de la sous-position tarifaire 85.20
    A, originaires des pays en voie de développement, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77 du Conseil
  type: main
