type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2032/76 of 13 August 1976 re-establishing
    the levying of customs duties on other sheep and lambskin leather, falling within
    subheading 41.03 B II originating in developing countries to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2032/76 de la Commission, du 13 août 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins, préparées, non dénommées, de la sous-position tarifaire 41.03 B II,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2032/76 der Kommission vom 13. August 1976 zur Wiedereinführung
    des Zollsatzes für bestimmtes Schaf- und Lammleder der Tarifstelle 41.03 B II,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 3010/75
    des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2032/76 af 13. august 1976 om genindførelse
    af opkrævning af toldafgifter for andre varer af læder af fåre- og lammeskind,
    under underposition 41.03 B II, som har oprindelse i udviklingslande og omfattes
    af de toldpræferencer, der er fastsat i Rådets forordning (EØF) nr. 3010/75
    af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2032/76 della Commissione, del 13 agosto 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine,
    preparate, non nominate, della sottovoce doganale 41.03 B II originarie dei paesi
    in via di sviluppo beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3010/75 del Consiglio del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2032/76 van de Commissie van 13 augustus 1976 houdende
    wederinstelling van de heffing van de douanerechten voor ander schapeleder, alsmede
    voorgelooide huiden en vellen, van schapen, overige, van onderverdeling 41.03
    B II, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 3010/75 van de Raad van 17 november 1975 tariefpreferenties werden geopend
  type: main
