    2017/176, pokiaľ ide o obdobie platnosti kritérií environmentálnej značky
    EÚ a súvisiacich požiadaviek na posudzovanie a overovanie pre textilné výrobky,
    posteľné matrace, nábytok, obuv a podlahové krytiny na báze dreva, korku
    a bambusu [oznámené pod číslom C(2025) 9163]
