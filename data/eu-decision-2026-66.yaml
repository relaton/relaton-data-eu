    obdobja veljavnosti meril za podelitev znaka EU za okolje ter z njimi povezanih
    zahtev za ocenjevanje in preverjanje za tekstilne izdelke, posteljne vložke,
    pohištvo, obutvene izdelke ter talne obloge na osnovi lesa, plute in bambusa
    (notificirano pod dokumentarno številko C(2025) 9163)
