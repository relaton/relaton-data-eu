title:
- language: en
  script: Latn
  content: Commission Decision (EU) 2026/66 of 23 December 2025 amending Decisions
    2014/350/EU, 2014/391/EU, (EU) 2016/1332, (EU) 2016/1349 and (EU) 2017/176 as
    regards the period of validity of the EU Ecolabel criteria and the related assessment
    and verification requirements for textile products, bed mattresses, furniture,
    footwear and wood-, cork- and bamboo-based floor coverings (notified under document
    C(2025) 9163)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2026/66 de la Commission du 23 décembre 2025 modifiant
    les décisions 2014/350/UE, 2014/391/UE, (UE) 2016/1332, (UE) 2016/1349 et (UE)
    2017/176 en ce qui concerne la période de validité des critères du label écologique
    de l’UE et des exigences d’évaluation et de vérification s’y rapportant
    pour les produits textiles, les matelas de lit, les produits d’ameublement,
    les articles chaussants et les revêtements de sol à base de bois, de liège
    et de bambou [notifiée sous le numéro C(2025) 9163]
  type: main
- language: de
  script: Latn
