    2017/176 in Bezug auf den Geltungszeitraum der Kriterien für die Vergabe des
    EU-Umweltzeichens sowie der damit verbundenen Beurteilungs- und Prüfanforderungen
    für Textilerzeugnisse, Bettmatratzen, Möbel, Schuhe und Bodenbeläge auf Holz-,
    Kork- und Bambusbasis (Bekannt gegeben unter Aktenzeichen C(2025) 9163)
  type: main
