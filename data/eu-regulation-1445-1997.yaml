title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1445/97 of 24 July 1997 setting the level
    of the Community quantitative limit on re-importation into the European Community
    of textile products of category 13 originating in the People's Republic of China
    after economic outward processing operations in that country and amending Council
    Regulation (EEC) No 3030/93
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1445/97 de la Commission du 24 juillet 1997 fixant
    le niveau de la limite quantitative communautaire à la réimportation dans la
    Communauté européenne des produits textiles de la catégorie 13 originaires
    de la République populaire de Chine à l'issue d'opérations de perfectionnement
    passif économique effectuées dans ce pays et modifiant le règlement (CEE) n°
    3030/93 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1445/97 der Kommission vom 24. Juli 1997 zur Festsetzung
    der Höchstmengen der Gemeinschaft für die Wiedereinfuhr von Textilwaren der
    Kategorie 13 mit Ursprung in und nach wirtschaftlicher passiver Veredelung in
    der Volksrepublik China in die Europäische Gemeinschaft und zur Änderung der
    Verordnung (EWG) Nr. 3030/93 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1445/97 af 24. juli 1997 om fastsættelse
    af kvantitative fællesskabslofter for genindførsel i Det Europæiske Fællesskab
    af tekstilvarer i kategori 13 med oprindelse i Folkerepublikken Kina efter økonomisk
    passiv forædling i dette land og om ændring af Rådets forordning (EØF) nr.
    3030/93
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1445/97 της Επιτροπής
    της 24ης Ιουλίου 1997 που ορίζει το επίπεδο του
    κοινοτικού ποσοτικού ορίου για επανεισαγωγή
    στην Ευρωπαϊκή Κοινότητα κλωστοϋφαντουργικών
    προϊόντων της κατηγορίας 13, καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας, μετά την πραγματοποίηση
    τελειοποίησης προς επανεισαγωγή στην εν λόγω
    χώρα, και που τροποποιεί τον κανονισμό (ΕΟΚ)
    αριθ. 3030/93 του Συμβουλίου
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1445/97, annettu 24 päivänä heinäkuuta 1997,
    yhteisön määrällisen rajoituksen vahvistamisesta Kiinan kansantasavallasta
    peräisin olevien luokkaan 13 kuuluvien tekstiilituotteiden jälleentuonnissa
    Euroopan yhteisöön Kiinan kansantasavallassa suoritettujen taloudellisesti vaikuttavien
    ulkoisten jalostustoimintojen jälkeen ja neuvoston asetuksen (ETY) N:o 3030/93
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1445/97 della Commissione del 24 luglio 1997 che fissa
    i limiti quantitativi comunitari per la reimportazione nella Comunità europea
    dei prodotti tessili della categoria 13 originari della Repubblica popolare cinese
    sottoposti ad operazioni di perfezionamento passivo economico in tale paese e
    che modifica il regolamento (CEE) n. 3030/93 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1445/97 van de Commissie van 24 juli 1997 tot vaststelling
    van het niveau van de communautaire kwantitatieve maxima voor de wederinvoer in
    de Europese Gemeenschap van textielproducten van categorie 13 uit de Volksrepubliek
    China na economische passieve veredeling in dit land en tot wijziging van Verordening
    (EEG) nr. 3030/93 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1445/97 da Comissão de 24 de Julho de 1997 que fixa
    o nível dos limites quantitativos comunitários para a reimportação na Comunidade
    Europeia dos produtos têxteis da categoria 13 originários da República Popular
    da China após operações de aperfeiçoamento passivo económico realizadas neste
    país e que altera o Regulamento (CE) nº 3030/93 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1445/97 de la Comisión de 24 de julio de 1997 por
    el que se establece el nivel del límite cuantitativo comunitario a la reimportación
    en la Comunidad Europea de productos textiles de la categoría 13 originarios
    de la República Popular de China después de operaciones de perfeccionamiento
    pasivo económico efectuadas en ese país y por el que se modifica el Reglamento
    (CEE) nº 3030/93 del Consejo
  type: main
- language: sv
