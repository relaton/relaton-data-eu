title:
- language: en
  script: Latn
  content: '80/278/EEC: Commission Decision of 14 February 1980 authorizing Ireland
    not to apply Community treatment to men''s and boys''shirts, woven, falling within
    heading No ex 61.03 of the Common Customs Tariff (category 8), originating in
    Hong Kong and in free circulation in the other Member States (Only the English
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/278/CEE: Décision de la Commission, du 14 février 1980, autorisant
    l''Irlande à exclure du traitement communautaire les chemises et chemisettes
    tissées de la position ex 61.03 du tarif douanier commun (catégorie 8), originaires
    de Hong-kong et mises en libre pratique dans les autres Etats membres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '80/278/EWG: Entscheidung der Kommission vom 14. Februar 1980, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, auch Sport- und Arbeitshemden, aus Geweben,
    der Tarifnummer ex 61.03 des Gemeinsamen Zolltarifs, Kategorie 8, von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/278/EØF: Kommissionens beslutning af 14. februar 1980 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage vævede skjorter (herunder
    sports- og arbejdsskjorter), som henhører under pos. ex 61.03 i den fælles toldtarif
    (kategori 8), har oprindelse i Hongkong og frit kan omsættes i de øvrige medlemsstater
    (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/278/CEE: Decisione della Commissione, del 14 febbraio 1980, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario camicie e camicette, tessute,
    della voce ex 61.03 della tariffa doganale comune, categoria 8, originarie di
    Hong Kong e messe in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/278/EEG: Beschikking van de Commissie van 14 februari 1980 waarbij
    Ierland wordt gemachtigd overhemden en sporthemden, geweven, van post ex 61.03
    van het gemeenschappelijk douanetarief (categorie 8), van oorsprong uit Hong-Kong
    en in de overige Lid-Staten in het vrije verkeer gebracht van de communautaire
    behandeling uit te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
