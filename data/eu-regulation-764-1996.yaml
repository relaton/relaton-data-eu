    van beheer van in de GATT geconsolideerde communautaire tariefcontingenten voor
    bepaalde landbouw-, industrie- en visserijprodukten en de vaststelling van modaliteiten
    voor de wijziging of aanpassing van die contingenten
  type: main
- language: pt
  script: Latn
