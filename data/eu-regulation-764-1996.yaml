title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 764/96 of 22 April 1996 amending Regulation
    (EC) No 1808/95 opening and providing for the administration of Community tariff
    quotas bound in GATT for certain agricultural, industrial and fisheries products
    and establishing the detailed provisions for adapting these quotas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 764/96 du Conseil, du 22 avril 1996, modifiant le règlement
    (CE) n° 1808/95 portant ouverture et mode de gestion de contingents tarifaires
    communautaires consolidés au GATT pour certains produits agricoles, industriels
    et de la pêche, et définissant les modalités d'amendement ou d'adaptation desdits
    contingents
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 764/96 des Rates vom 22. April 1996 zur Änderung der
    Verordnung (EG) Nr. 1808/95 zur Eröffnung und Verwaltung von im GATT gebundenen
    Gemeinschaftszollkontingenten für einige landwirtschaftliche und gewerbliche
    Erzeugnisse sowie Fischereierzeugnisse und zur Einführung eines Verfahrens zur
    Änderung oder Anpassung dieser Zollkontingente
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 764/96 af 22. april 1996 om ændring af forordning
    (EF) nr. 1808/95 om åbning og forvaltning af GATT-bundne fællesskabstoldkontingenter
    for visse landbrugsprodukter, industri- og fiskerivarer og om visse gennemførelsesbestemmelser
    for så vidt angår tilpasning af disse kontingenter
  type: main
- language: el
  script: Grek
