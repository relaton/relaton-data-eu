    tai mukauttamista koskevista yksityiskohtaisista säännöistä annetun asetuksen
    (EY) N:o 1808/95 muuttamisesta #'
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 764/96 del Consiglio, del 22 aprile 1996, che modifica
    il regolamento (CE) n. 1808/95 recante apertura e modalità di gestione di contingenti
    tariffari comunitari consolidati al GATT per taluni prodotti agricoli, industriali
    e della pesca e che definisce le modalità di rettifica e di adattamento dei suddetti
    contingenti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 764/96 van de Raad van 22 april 1996 tot wijziging
