    (ΕΚ) αριθ. 1808/95 σχετικά με το άνοιγμα και τον
    τρόπο διαχείρισης των παγιωμένων στη Γενική
    Συμφωνία Δασμών και Εμπορίου (ΓΣΔΕ) κοινοτικών
    δασμολογικών ποσοστώσεων για ορισμένα γεωργικά,
    βιομηχανικά και αλιευτικά προϊόντα, και σχετικά
    με τον καθορισμό της μεθόδου τροποποίησης
    ή προσαρμογής των εν λόγω ποσοστώσεων
  type: main
- language: fi
  script: Latn
  content: 'Neuvoston asetus (EY) N:o 764/96,#annettu 22 päivänä huhtikuuta 1996,#GATTiin
