title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1518/77 of 6 July 1977 enabling short-term
    private storage contracts to be concluded for table wines closely related economically
    to the R I type of table wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1518/77 de la Commission, du 6 juillet 1977, étendant
    la possibilité de conclure des contrats de stockage privé à court terme aux
    vins de table se trouvant dans une relation économique étroite avec les vins
    de table du type R I
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1518/77 der Kommission vom 6. Juli 1977 zur Ausdehnung
    der Möglichkeit des Abschlusses von Verträgen für die kurzfristige private
    Lagerhaltung auf Tafelweine, die in engem wirtschaftlichem Zusammenhang mit den
    Tafelweinen der Art R I stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1518/77 af 6. juli 1977 om udvidelse
    af muligheden til at indgå kontrakter om privat oplagring på kort sigt af bordvine,
    der står i nær økonomisk forbindelse med bordvine af type R I
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1518/77 della Commissione, del 6 luglio 1977, che
    estende la possibilità di concludere contratti di magazzinaggio privato a breve
    termine per i vini da tavola che si trovano in stretta relazione economica coi
    vini da tavola del tipo R I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1518/77 van de Commissie van 6 juli 1977 tot uitbreiding
    van de mogelijkheid om kortlopende contracten te sluiten voor de particuliere
    opslag van tafelwijn die in nauw economisch verband staat met tafelwijn van soort
    R I
  type: main
