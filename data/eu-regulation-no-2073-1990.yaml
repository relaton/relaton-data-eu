title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2073/90 of 16 July 1990 Regulation (EEC) No
    3905/89 opening and providing for the administration of autonomous Community tariff
    quotas for an agricultural and a chemical product (1990)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2073/90 du Conseil du 16 juillet 1990 modifiant, en
    ce qui concerne les cerises acides, conservées dans de l'alcool, le règlement
    (CEE) n° 3905/89 portant ouverture et mode de gestion de contingents tarifaires
    communautaires autonomes pour un produit agricole et un produit chimique (1990)
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2073/90 DES RATES vom 16. Juli 1990 zur Aenderung
    der Verordnung (EWG) Nr. 3905/89 zur Eroeffnung und Verwaltung autonomer Gemeinschaftszollkontingente
    fuer eine landwirtschaftliche und eine chemische Ware (1990) hinsichtlich Sauerkirschen,
    in Alkohol eingelegt
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2073/90 af 16. juli 1990 om ændring, for
    så vidt angår surkirsebær tilsat alkohol, af forordning (EØF) nr. 3905/89
    om åbning og forvaltning af autonome fællesskabstoldkontingenter for en landbrugsvare
    og et kemisk produkt (1990)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2073/90 του Συμβουλίου
    της 16ης Ιουλίου 1990 για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 3905/89 για το άνοιγμα και
    τον τρόπο διαχείρισης αυτόνομων κοινοτικών
    δασμολογικών ποσοστώσεων για ένα γεωργικό
    και ένα χημικό προϊόν ( 1990 ), όσον αφορά τα βύσσινα
    που διατηρούνται εντός αλκοόλης
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2073/90 DEL CONSIGLIO del 16 luglio 1990 che modifica
    il regolamento (CEE) n. 3905/89 recante apertura e modalità di gestione di taluni
    contingenti tariffari comunitari autonomi per un prodotto chimico e per un prodotto
    agricolo (1990), per quanto concerne le ciliegie acide conservate in alcole
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2073/90 VAN DE RAAD van 16 juli 1990 tot wijziging
    van Verordening (EEG) nr. 3905/89 betreffende de opening en de wijze van beheer
    van communautaire tariefcontingenten voor een bepaald landbouwprodukt en voor
    een bepaald chemisch produkt (1990), voor wat betreft zure kersen op alcohol
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) Nº 2073/90 DO CONSELHO de 16 de Julho de 1990 que altera,
    no que respeita às ginjas conservadas em alcool, o Regulamento (CEE) n* 3905/89
    relativo à abertura e modo de gestao de contingentes pautais comunitarios autonomos
    para um produto agricola e um produto quimico (1990)
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2073/90 DEL CONSEJO de 16 de julio de 1990 por el que
    se modifica, en lo que se refiere a las guindas conservadas en alcohol, el Reglamento
    (CEE) no 3905/89 relativo a la apertura y modo de gestion de contingentes arancelarios
    comunitarios autonomos de un producto agricola y un producto quimico (1990)
  type: main
