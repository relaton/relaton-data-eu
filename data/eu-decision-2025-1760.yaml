title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/1760 of 19 August 2025 determining
    under Article 41(1) of Directive 2014/53/EU of the European Parliament and of
    the Council whether a measure taken by France with respect to Apple iPhone 12
    A2403 is justified (notified under document C(2025) 5736)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/1760 de la Commission du 19 août 2025
