    zda je opatření přijaté Francií ve vztahu k telefonu Apple iPhone 12 A2403
    oprávněné (oznámeno pod číslem C(2025) 5736)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/1760 af 19. august 2025
