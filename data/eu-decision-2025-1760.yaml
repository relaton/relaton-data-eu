    2014/53/UE del Parlamento europeo e del Consiglio, se una misura adottata dalla
    Francia nei confronti dell’iPhone 12 A2403 di Apple sia giustificata [notificata
    con il numero C(2025) 5736]
  type: main
- language: lv
  script: Latn
