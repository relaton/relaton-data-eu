    do Parlamento Europeu e do Conselho se uma medida adotada pela França relativamente
    ao Apple iPhone 12 A2403 é justificada [notificada com o número C(2025) 5736]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2025/1760 a Comisiei din 19 august
    2025 de stabilire, în temeiul articolului 41 alineatul (1) din Directiva 2014/53/UE
    a Parlamentului European și a Consiliului, dacă măsura luată de Franța în
    ceea ce privește Apple iPhone 12 A2403 este justificată [notificată cu numărul
    C(2025) 5736]
  type: main
- language: sk
  script: Latn
