    Parlaments und des Rates zu der Frage, ob eine Maßnahme Frankreichs im Hinblick
    auf das Apple iPhone 12 A2403 gerechtfertigt ist (Bekannt gegeben unter Aktenzeichen
    C(2025) 5736)
  type: main
- language: bg
  script: Cyrl
