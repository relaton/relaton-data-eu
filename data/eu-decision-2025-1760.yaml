    Parlement en de Raad wordt bepaald of een door Frankrijk ten aanzien van Apple
    iPhone 12 A2403 genomen maatregel gerechtvaardigd is (Kennisgeving geschied onder
    nummer C(2025) 5736)
  type: main
- language: pl
  script: Latn
