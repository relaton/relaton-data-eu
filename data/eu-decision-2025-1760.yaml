    megalapozottságának a 2014/53/EU európai parlamenti és tanácsi irányelv
    41. cikkének (1) bekezdése alapján történő megállapításáról (az értesítés
    a C(2025) 5736. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2025/1760 della Commissione, del 19 agosto
