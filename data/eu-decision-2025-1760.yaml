    czy środek zastosowany przez Francję w odniesieniu do telefonu iPhone 12 A2403
    przedsiębiorstwa Apple jest uzasadniony (notyfikowana jako dokument nr C(2025)
    5736)
  type: main
- language: pt
  script: Latn
