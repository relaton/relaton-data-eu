    2014/53/UE du Parlement européen et du Conseil, si une mesure prise par la France
    à l’égard de l’iPhone 12 A2403 d’Apple est justifiée [notifiée sous
    le numéro C(2025) 5736]
  type: main
- language: de
  script: Latn
