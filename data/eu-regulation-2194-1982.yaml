title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2194/82 of 6 August 1982 fixing for the
    1982/83 marketing year the minimum price payable to producers, the production
    aid and the storage aid together with the coefficients applicable to the minimum
    price and the storage aid and to the production aid for dried grapes and dried
    figs
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2194/82 de la Commission, du 6 août 1982, fixant,
    pour la campagne 1982/1983, pour les raisins secs et les figues sèches, le prix
    minimal à payer aux producteurs, les montants de l' aide à la production et
    de l' aide au stockage ainsi que les coefficients à appliquer au prix minimal
    et à l' aide au stockage ainsi qu' à l' aide à la production
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2194/82 der Kommission vom 6. August 1982 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises, der Beträge der Produktionsbeihilfe
    und der Lagerhaltungsbeihilfe sowie der auf den Mindestpreis, die Lagerhaltungsbeihilfe
    und die Produktionsbeihilfe anzuwendenden Koeffizienten für getrocknete Weintrauben
    und getrocknete Feigen für das Wirtschaftsjahr 1982/83
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2194/82 af 6. august 1982 om fastsættelse
    for produktionsåret 1982/83 af den minimumspris, der skal betales til producenterne,
    af producentstøtten og oplagringsstøtten samt af de koefficienter, der skal
    anvendes på minimumsprisen og oplagringsstøtten samt på producentstøtten for
    tørrede druer og tørrede figner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2194/82 τής Επιτροπής
    τής 6ης Αυγούστου 1982 περί καθορισμού, γιά τήν
    περίοδο εμπορίας 1982/83, τής ελάχιστης τιμής
    πού καταβάλλεται στούς παραγωγούς, τών ποσών
    τής ενισχύσεως κατά τήν παραγωγή, τού ποσού
    τής ενισχύσεως κατά τήν αποθεματοποίηση, καθώς
    καί τών συντελεστών πού πρέπει νά εφαρμόζονται
    στήν ελάχιστη τιμή καί στήν ενίσχυση αποθεματοποιήσεως,
    καθώς καί στήν ενίσχυση κατά τήν παραγωγή,
    γιά τίς σταφίδες καί τά ξηρά σύκα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2194/82 della Commissione, del 6 agosto 1982, che
    fissa, per la campagna 1982/1983, il prezzo minimo da pagare ai produttori, l'
    importo dell' aiuto alla produzione e dell' aiuto all' ammasso, nonché i coefficienti
    da applicare al prezzo minimo, all' aiuto all' ammasso ed all' aiuto alla produzione,
    per l' uva secca ed i fichi secchi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2194/82 van de Commissie van 6 augustus 1982 tot
    vaststelling voor het verkoopseizoen 1982/1983 voor rozijnen en krenten en gedroogde
    vijgen van de aan de producenten te betalen minimumprijs, de bedragen van de produktiesteun
    en de steun bij opslag alsmede van de coëfficiënten die op de minimumprijs en
    op de bedragen van de produktiesteun en de steun bij opslag moeten worden toegepast
  type: main
