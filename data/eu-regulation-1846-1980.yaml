title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1846/80 of 11 July 1980 re-establishing
    the levying of customs duties on melamine, falling within subheading 29.35 ex
    Q and originating in developing countries, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1846/80 de la Commission, du 11 juillet 1980, portant
    rétablissement de la perception des droits de douane applicables à la mélamine,
    de la sous-position 29.35 ex Q du tarif douanier commun, originaire des pays en
    voie de développement bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1846/80 der Kommission vom 11. Juli 1980 zur Wiedereinführung
    des Zollsatzes für Melamin der Tarifstelle 29.35 ex Q mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1846/80 af 11. juli 1980 om genindførelse
    af opkrævning af toldafgifter for melamin, under underpos. 29.35 ex Q, som har
    oprindelse i udviklingslande og omfat1764tes af de toldpræferencer, der er fastsat
    i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1846/80 della Commissione, dell' 11 luglio 1980, che
    ripristina la riscossione dei dazi doganali applicabili alla melammina della sottovoce
    29.35 ex Q della tariffa doganale comune, originaria dei paesi in via di sviluppo
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1846/80 van de Commissie van 11 juli 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor melamine, van post 29.35
    ex Q, van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
