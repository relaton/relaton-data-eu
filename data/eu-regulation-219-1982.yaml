title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 219/82 of 29 January 1982 fixing the rates
    of the refunds applicable from 1 February 1982 to certain cereal and rice products
    exported in the form of goods not covered by Annex II to the Treaty
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 219/82 de la Commission, du 29 janvier 1982, fixant
    les taux des restitutions applicables, à compter du 1er février 1982, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 219/82 der Kommission vom 29. Januar 1982 zur Festsetzung
    der ab 1. Februar 1982 geltenden Erstattungssätze bei der Ausfuhr bestimmter
    Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 219/82 af 29. januar 1982 om fastsættelse
    af de restitutionssatser, der fra 1. februar 1982 skal anvendes for visse produkter
    fra korn- og rissektoren, der udføres i form af varer, som ikke omfattes af traktatens
    bilag II
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 219/82 της Επιτροπής
