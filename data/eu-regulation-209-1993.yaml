title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 209/93 of 1 February 1993 amending and correcting
    Regulation (EEC) No 3717/91 drawing up the list of goods which may benefit from
    the arrangements permitting goods to be processed under customs control before
    being put into free circulation
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 209/93 de la Commission, du 1er février 1993, modifiant
    et rectifiant le règlement (CEE) n° 3717/91 établissant la liste de marchandises
    qui peuvent bénéficier du régime permettant la transformation sous douane de
    marchandises avant leur mise en libre pratique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 209/93 der Kommission vom 1. Februar 1993 zur Änderung
    und Berichtigung der Verordnung (EWG) Nr. 3717/91 über das Verzeichnis von Waren,
    auf die das Verfahren der Umwandlung von Waren unter zollamtlicher Überwachung
    vor ihrer Überführung in den zollrechtlich freien Verkehr anwendbar ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 209/93 af 1. februar 1993 om ændring
    og berigtigelse af forordning (EØF) nr. 3717/91 om opstilling af listen over
    de varer, der kan henføres under ordningen med bevilling til under Toldkontrol
    af forarbejde varer, før de bringes i fri omsætning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 209/93 της Επιτροπής
    της 1ης Φεβρουαρίου 1993 για την τροποποίηση
    και διόρθωση του κανονισμού (ΕΟΚ) αριθ. 3717/91
    για την κατάρτιση του καταλόγου προϊόντων
    που μπορούν να υπόκεινται στο καθεστώς που
    επιτρέπει τη μεταποίηση υπό τελωνειακό έλεγχο
    των εμπορευμάτων, πριν από τη θέση τους σε ελεύθερη
    κυκλοφορία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 209/93 della Commissione, del 1° febbraio 1993, recante
    modificazione e rettificativo dell' elenco allegato al regolamento (CEE) n. 3717/91
    che stabilisce l' elenco delle merci che possono beneficiare del regime che ne
    consente la trasformazione sotto controllo doganale prima dell' immissione in
    libera pratica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 209/93 van de Commissie van 1 februari 1993 tot wijziging
    en rectificering van Verordening (EEG) nr. 3717/91 tot vaststelling van de lijst
    van goederen die in aanmerking komen voor de regeling volgens welke goederen onder
    douanetoezicht kunnen worden behandeld alvorens zij in het vrije verkeer worden
    gebracht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 209/93 da Comissão, de 1 de Fevereiro de 1993, que
    altera e rectifica a lista em anexo ao Regulamento (CEE) n° 3717/91 que estabelece
    a lista de mercadorias susceptíveis de beneficiarem do regime que permite a transformação
    sob controlo aduaneiro de mercadorias antes da sua introdução em livre prática
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 209/93 de la Comisión, de 1 de febrero de 1993, por
    el que se modifica y rectifica el Reglamento (CEE) n° 3717/91 por el que se establece
    la lista de mercancías que pueden beneficiarse del régimen que autoriza la transformación
    de las mercancías bajo control aduanero antes de su despacho a libre práctica
  type: main
