    per il consumo umano diretto di taluni vini importati dall’Argentina che possono
    essere stati sottoposti a pratiche enologiche non previste dal regolamento (CE)
    n. 1493/1999
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1912/2005 ( 2005. gada 23. novembris ), ar kuru
