    patēriņam pārtikā dažus no Argentīnas ievestus vīnus, kuru gatavošanā,
    iespējams, izmantoti Regulā (EK) Nr. 1493/1999 neparedzēti vīndarības procesi
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 23 d. Tarybos reglamentas (EB) Nr. 1912/2005, iš dalies
    keičiantis Reglamentą (EB) Nr. 527/2003, suteikiantį leidimą tiesioginiam
    žmonių vartojimui pasiūlyti ir tiekti tam tikrus vynus, importuotus iš Argentinos,
    kuriems galėjo būti taikomi Reglamente (EB) Nr. 1493/1999 nenumatyti vynininkystės
    procesai
  type: main
- language: mt
  script: Latn
  content: '1912/2005/KE: Regolament tal-Kunsill (KE) Nru 1912/2005 tat- 23 ta’
    Novembru 2005 li jemenda r-Regolament (KE) Nru 527/2003 li jawtorizza l-offerta
    u l-konsenja għal konsum dirett uman ta’ ċerti nbejjed importati mill-Arġentina
    li setgħu għaddew minn proċess enoloġiku li ma hemmx provvediment dwaru fir-Regolament
    (KE) Nru 1493/1999'
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1912/2005 van de Raad van 23 november 2005 tot wijziging
    van Verordening (EG) nr. 527/2003 houdende machtiging tot het aanbieden en leveren
    voor rechtstreekse menselijke consumptie van bepaalde uit Argentinië ingevoerde
    wijnen waarop oenologische procédés zijn toegepast waarin niet is voorzien bij
    Verordening (EG) nr. 1493/1999
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1912/2005 z dnia 23 listopada 2005 r. zmieniające
    rozporządzenie (WE) nr 527/2003 zezwalające na oferowanie i dostarczanie do
    bezpośredniego spożycia przez ludzi niektórych win przywożonych z Argentyny,
    które mogły być poddane procesom enologicznym nieprzewidzianym w rozporządzeniu
    (WE) nr 1493/1999
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1912/2005 do Conselho, de 23 de Novembro de 2005
    , que altera o Regulamento (CE) n. o 527/2003 que autoriza a oferta e a entrega
    para consumo humano directo de certos vinhos importados da Argentina susceptíveis
    de terem sido objecto de práticas enológicas não previstas no Regulamento (CE)
    n. o 1493/1999
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1912/2005 z 23. novembra 2005 , ktorým sa mení
    a dopĺňa nariadenie (ES) č. 527/2003, ktorým sa povoľuje ponuka a dodávka
    niektorých vín dovezených z Argentíny určených na priamu ľudskú spotrebu
    a ktoré pravdepodobne podstúpili enologické procesy nestanovené v nariadení
    (ES) č. 1493/1999
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1912/2005 z dne 23. novembra 2005 o spremembi Uredbe
    (ES) št. 527/2003 o dovoljenju za ponudbo in dobavo nekaterih iz Argentine uvoženih
    vin, namenjenih za neposredno prehrano ljudi, na katerih so bile opravljene enološke
    obdelave, ki niso predvidene v Uredbi (ES) št. 1493/1999
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1912/2005 del Consejo, de 23 de noviembre de 2005 ,
    que modifica el Reglamento (CE) n o 527/2003 por el que se autoriza la oferta
    y la entrega para el consumo humano directo de determinados vinos importados de
    Argentina que pueden haber sido sometidos a prácticas enológicas no previstas
    en el Reglamento (CE) n o 1493/1999
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1912/2005 av den 23 november 2005 om ändring
    av förordning (EG) nr 527/2003 om tillstånd för saluföring och leverans för
    människors direkta konsumtion av vissa viner som importeras från Argentina och
    som kan ha varit föremål för oenologiska metoder som inte föreskrivs i förordning
    (EG) nr 1493/1999
