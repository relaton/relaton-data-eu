title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1912/2005 of 23 November 2005 amending Regulation
    (EC) No 527/2003 authorising the offer and delivery for direct human consumption
    of certain wines imported from Argentina which may have undergone oenological
    processes not provided for in Regulation (EC) No 1493/1999
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1912/2005 du Conseil du 23 novembre 2005 modifiant
    le règlement (CE) n o 527/2003 autorisant l’offre et la livraison à la consommation
    humaine directe de certains vins importés d’Argentine susceptibles d’avoir
    fait l’objet de pratiques œnologiques non prévues par le règlement (CE) n
    o 1493/1999
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1912/2005 des Rates vom 23. November 2005 zur Änderung
    der Verordnung (EG) Nr. 527/2003 zur Genehmigung des Anbietens oder der Abgabe
    zum unmittelbaren menschlichen Verbrauch von bestimmten aus Argentinien eingeführten
    Weinen, bei denen angenommen werden kann, dass sie Gegenstand von in der Verordnung
    (EG) Nr. 1493/1999 nicht vorgesehenen önologischen Verfahren waren
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 1912/2005 ze dne 23. listopadu 2005 , kterým
    se mění nařízení (ES) č. 527/2003, kterým se povoluje nabízení nebo dodávání
    některých vín dovážených z Argentiny, u nichž mohlo být použito enologických
    postupů nestanovených v nařízení (ES) č. 1493/1999, k přímé lidské spotřebě
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1912/2005 af 23. november 2005 om ændring
    af forordning (EF) nr. 527/2003 om tilladelse til udbud og levering til direkte
    konsum af visse vine, der er importeret fra Argentina, og som eventuelt har været
    genstand for en ønologisk behandling, der ikke er fastsat i forordning (EF) nr.
    1493/1999
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1912/2005 του Συμβουλίου,
    της 23ης Νοεμβρίου 2005 , για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 527/2003 που επιτρέπει την
    προσφορά και την παράδοση στην άμεση ανθρώπινη
    κατανάλωση ορισμένων οίνων που εισάγονται
    από την Αργεντινή που μπορεί να έχουν υποβληθεί
    σε οινολογικές πρακτικές που δεν προβλέπονται
    από τον κανονισμό (ΕΚ) αριθ. 1493/1999
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1912/2005, 23. november 2005 , millega muudetakse
    määrust (EÜ) nr 527/2003, millega lubatakse otsetarbimiseks pakkuda ja tarnida
    teatavaid Argentinast imporditud veine, mille puhul võib olla kasutatud määruses
    (EÜ) nr 1493/1999 sätestamata veinivalmistusviise
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1912/2005, annettu 23 päivänä marraskuuta
    2005 , eräiden Argentiinasta tuotavien sellaisenaan nautittavaksi tarkoitettujen
    viinien, joiden viininvalmistusmenetelmistä ei säädetä asetuksessa (EY) N:o
    1493/1999, tarjoamisen ja toimittamisen sallimisesta annetun asetuksen (EY) N:o
    527/2003 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1912/2005/EK rendelete ( 2005. november 23. ) az 1493/1999/EK
    rendeletben nem meghatározott borászati eljárásokkal kezelt egyes Argentínából
    importált borok közvetlen emberi fogyasztásra történő kínálatának és
    értékesítésének engedélyezéséről szóló 527/2003/EK rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1912/2005 del Consiglio, del 23 novembre 2005 , recante
