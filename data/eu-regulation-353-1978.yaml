title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 353/78 of 20 February 1978 temporarily and
    partially suspending the autonomous Common Customs Tariff duty on sardinops sagax
    or ocellata (pilchards), fresh, chilled or frozen, whole, headless or in pieces,
    intended for the processing industry, falling within subheading ex 03.01 B I q)
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 353/78 du Conseil, du 20 février 1978, portant suspension
    temporaire et partielle du droit autonome du tarif douanier commun sur les "sardinops
    sagax ou ocellata" dits "pilchards", frais, réfrigérés ou congelés, entiers,
    décapités ou tronçonnés, destinés à l'industrie de la transformation, de
    la sous-position EX 03.01 B I q)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 353/78 des Rates vom 20. Februar 1978 zur zeitweiligen
    und teilweisen Aussetzung des autonomen Zollsatzes des Gemeinsamen Zolltarifs
    für Heringsfische der Art Sardinops sagax oder ocellata (sogenannte "Pilchards"),
    frisch, gekühlt oder gefroren, ganz, ohne Kopf oder zerteilt, für die Verarbeitungsindustrie,
    der Tarifstelle ex 03.01 B I q)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 353/78 af 20. februar 1978 om midlertidig
    og delvis suspension af den autonome told i den fælles toldtarif for Sardinops
    sagax eller ocellata (kaldet »pilchards«), fersk, kølet eller frosset, hel,
    uden hoved, renset eller skåret, bestemt til forarbejdningsindustrien, henhørende
    under pos. ex 03.01 B I q)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 353/78 del Consiglio, del 20 febbraio 1978, recante
    sospensione temporanea e parziale del dazio autonomo della tariffa doganale comune
    per le sarde della specie sardinops sagax o ocellata (dette «Pilchards»), fresche,
    refrigerate o congelate, intere, decapitate o in pezzi, destinate all'industria
    di trasformazione, della sottovoce ex 03.01 B I q)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 353/78 van de Raad van 20 februari 1978 houdende
    gedeeltelijke en tijdelijke schorsing van het autonome recht van het gemeenschappelijk
    douanetarief voor sardinops sagax of ocellata (zogenaamde Pilchards), vers, gekoeld
    of bevroren, in gehele staat, ook indien ontdaan van kop of in moten gesneden,
    bestemd voor de verwerkende industrie, van onderverdeling ex 03.01 B I q)
  type: main
