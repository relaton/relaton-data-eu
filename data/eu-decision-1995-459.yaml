    2, lettera c) della direttiva 70/156/CEE del Consiglio concernente il ravvicinamento
    delle legislazioni degli Stati membri relative all''omologazione dei veicoli a
    motore e dei loro rimorchi (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/459/EG: Beschikking van de Commissie van 19 oktober 1995 inzake een
