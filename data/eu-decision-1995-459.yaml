title:
- language: en
  script: Latn
  content: '95/459/EC: Commission Decision of 19 October 1995 concerning a request
    for exemption lodged by the United Kingdom pursuant to Article 8 (2) (c) of Council
    Directive 70/156/EEC on the approximation of the laws of the Member States relating
    to the type-approval of motor vehicles and their trailers (Only the English text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/459/CE: Décision de la Commission, du 19 octobre 1995, concernant
    une demande de dérogation introduite par le Royaume-Uni en vertu de l''article
    8 paragraphe 2 point c) de la directive 70/156/CEE du Conseil concernant le rapprochement
    des législations des États membres relatives à la réception des véhicules
    à moteur et de leurs remorques (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '95/459/EG: Entscheidung der Kommission vom 19. Oktober 1995 betreffend
    einen vom Vereinigten Königreich gemäß Artikel 8 Absatz 2 Buchstabe c) der
    Richtlinie 70/156/EWG des Rates zur Angleichung der Rechtsvorschriften der Mitgliedstaaten
    über die Betriebserlaubnis für Kraftfahrzeuge und Kraftfahrzeuganhänger eingereichten
    Antrag auf Ausnahmeregelung (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/459/EF: Kommissionens beslutning af 19. oktober 1995 om en dispensationsanmodning
