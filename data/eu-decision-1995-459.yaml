    direktiv 70/156/EØF om tilnærmelse af medlemsstaternes lovgivning om godkendelse
    af motordrevne køretøjer og påhængskøretøjer dertil (Kun den engelske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/459/ΕΚ: Απόφαση της Επιτροπής της 19ης Οκτωβρίου
    1995 σχετικά με μια αίτηση παρέκκλισης που υπέβαλε
    το Ηνωμένο Βασίλειο βάσει του άρθρου 8 παράγραφος
    2 στοιχείο γ) της οδηγίας 70/156/ΕΟΚ του Συμβουλίου
    για την προσέγγιση των νομοθεσιών των κρατών
    μελών σχετικά με την έγκριση τύπου των μηχανοκινήτων
    οχημάτων και των ρυμουλκουμένων τους (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/459/EY: Komission päätös, tehty 19 päivänä lokakuuta 1995, Yhdistyneen
    kuningaskunnan tekemästä moottoriajoneuvojen ja niiden perävaunujen tyyppihyväksyntää
    koskevan jäsenvaltioiden lainsäädännön lähentämisestä annetun direktiivin
    70/156/ETY 8 artiklan 2 kohdan c alakohdan mukaista poikkeusta koskevasta pyynnöstä
    (Ainoastaan englanninkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/459/CE: Decisione della Commissione, del 19 ottobre 1995, riguardante
