title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1650/83 of 17 June 1983 re-establishing
    the levying of customs duties on chromium oxides and hydroxides, falling within
    heading No 28.21 and originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1650/83 de la Commission du 17 juin 1983 portant rétablissement
    de la perception des droits de douane applicables aux oxydes et hydroxydes de
    chrome, de la position 28.21 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1650/83 der Kommission vom 17. Juni 1983 zur Wiedereinführung
    der Erhebung der Zölle für Chromoxide und -hydroxide der Tarifnummer 28.21,
    mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1650/83 af 17. juni 1983 om genindførelse
    af opkrævning af told for oxider og hydroxider af chrom henhørende under pos.
    28.21 og med oprindelse i Kina, som præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1650/83 της Επιτροπής
    της 17ης Ιουνίου 1983 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για οξείδια και υδροξείδια
    χρωμίου της κλάσεως 28.21 του Κοινού Δασμολογίου,
    καταγωγής Κίνας, δικαιούχου των προβλεπομένων
    από τον κανονισμό (ΕΟΚ) αριθ. 3377/82 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1650/83 della Commissione del 17 giugno 1983 che ripristina
    la riscossione dei dazi doganali applicabili agli ossidi e idrossidi di cromo
    della voce 28.21 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3377/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1650/83 van de Commissie van 17 juni 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op chroomoxyden
    en chroomhydroxyden van tariefpost 28.21, van oorsprong uit China, waarvoor de
    in Verordening (EEG) nr. 3377/82 van de Raad vermelde tariefpreferenties zijn
    verleend
