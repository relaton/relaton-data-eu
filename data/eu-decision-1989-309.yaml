  content: '89/309/EEC: Commission Decision of 28 April 1989 accepting an undertaking
    relating to the anti-dumping proceeding concerning certain plain paper photocopiers
    assembled or produced in the Community by Sharp Manufacturing (UK) Ltd'
  type: main
- language: fr
  script: Latn
  content: '89/309/CEE: Décision de la Commission du 28 avril 1989 portant acceptation
    d''un engagement dans le cadre de la procédure antidumping concernant certains
    photocopieurs à papier ordinaire assemblés ou produits dans la Communauté par
    Sharp Manufacturing (UK) Ltd'
  type: main
- language: de
  script: Latn
  content: 'BESCHLUSS DER KOMMISSION vom 28. April 1989 über die Annahme einer Verpflichtung
    im Rahmen des Antidumpingverfahrens betreffend bestimmte Normalpapierkopierer,
    die in der Gemeinschaft von Sharp Manufacturing (UK) Ltd montiert oder hergestellt
    werden (89/309/EWG) (89/309/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS AFGØRELSE af 28. april 1989 om godtagelse af tilsagn i
