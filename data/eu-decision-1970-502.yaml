title:
- language: en
  script: Latn
  content: '70/502/EEC: Commission Decision of 5 November 1970 amending the decision
    of 3 June 1970 authorizing the kingdom of the Netherlands to approve, for marketing
    purposes, seed of pseudotsuga menziesii ( mirb. ) franco and picea sitchensis
    trautv. and mey., satisfying less stringent conditions (Only the Dutch text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '70/502/CEE: Décision de la Commission, du 5 novembre 1970, modifiant
    la décision, du 3 juin 1970, autorisant le Royaume des Pays-Bas à admettre,
    à la commercialisation, des semences de pseudotsuga menziesii (mirb.) franco
    e de picea sitchensis trautv. et mey., soumises à des exigences (Le texte en
    langue néerlandaise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '70/502/EWG: Entscheidung der Kommission vom 5. November 1970 zur Änderung
    der Entscheidung vom 3. Juni 1970, mit der das Königreich der Niederlande ermächtigt
    wird, Saatgut von pseudotsuga menziesii ( mirb. ) franco und von picea sitchensis
    trautv. und mey. mit minderen Anforderungen zum gewerbsmäßigen Verkehr zuzulassen
    (Nur der niederländische Text ist verbindlich)'
  type: main
- language: it
  script: Latn
  content: '70/502/CEE: Decisione della Commissione, del 5 novembre 1970, che modifica
    la decisione del 3 giugno 1970 che autorizza il regno dei paesi bassi ad ammettere
    alla commercializzazione le sementi di pseudotsuga menziesii ( mirb. ) franco
    e di picea sitchensis trautv. e mey., sottoposte a requisiti ridotti (Il testo
    in lingua olandese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '70/502/EEG: Beschikking van de Commissie van 5 november 1970 tot wijziging
    van de beschikking van 3 juni 1970 houdende machtiging van het koninkrijk der
    Nederlanden om zaden van pseudotsuga menziesii ( mirb. ) franco en van picea sitchensis
    trautv. en mey., waaraan minder strenge eisen zijn gesteld, tot de handel toe
    te laten (Slechts de tekst in de Nederlandse taal is authentiek)'
  type: main
