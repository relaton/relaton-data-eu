title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3486/80 of 22 December 1980 extending the period
    of validity of Regulation (EEC) No 435/80 on the arrangements applicable to agricultural
    products and certain goods resulting from the processing of agricultural products
    originating in the African, Caribbean and Pacific States or in the overseas countries
    and territories
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3486/80 du Conseil, du 22 décembre 1980, prorogeant
    l' application du règlement (CEE) n° 435/80 relatif au régime applicable à
    des produits agricoles et à certaines marchandises résultant de la transformation
    de produits agricoles originaires des États d' Afrique, des Caraïbes et du Pacifique
    ou des pays et territoires d' outre-mer
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3486/80 des Rates vom 22. Dezember 1980 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 435/80 über die Regelung für landwirtschaftliche
    Erzeugnisse und bestimmte aus landwirtschaftlichen Erzeugnissen hergestellte Waren
    mit Ursprung in den Staaten in Afrika, im karibischen Raum und im Pazifischen
    Ozean oder in den überseeischen Ländern und Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3486/80 af 22. december 1980 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 435/80 om den ordning, der skal
    gælde for landbrugsprodukter og visse varer fremstillet af landbrugsprodukter
    med oprindelse i staterne i Afrika, Vestindien og Stillehavet eller i de oversøiske
    lande og territorier
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3486/80 τού Συμβουλίου
    τής 22ας Δεκεμβρίου 1980 περί παρατάσεως τής εφαρμογής
    τού κανονισμού (ΕΟΚ) αριθ. 435/80 «περί τού καθεστώτος
    πού εφαρμόζεται στά γεωργικά προϊόντα καί
    σέ ορισμένα εμπορεύματα προερχόμενα από τή
    μεταποίηση γεωργικών προϊόντων καταγωγής
    τών Κρατών τής Αφρικής, τής Καραϊβικής καί
    τού Ειρηνικού ή τών υπερποντίων χωρών καί εδαφών»
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3486/80 del Consiglio, del 22 dicembre 1980, che proroga
    l' applicazione del regolamento (CEE) n. 435/80 relativo al regime applicabile
    a taluni prodotti agricoli e a talune merci risultanti dalla trasformazione di
    prodotti agricoli, originari degli Stati dell' Africa, dei Caraibi e del Pacifico
    o dei paesi e territori d' oltremare
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3486/80 van de Raad van 22 december 1980 houdende
    verlenging van de geldigheidsduur van Verordening (EEG) nr. 435/80 inzake de regeling
    voor landbouwprodukten en bepaalde door verwerking van landbouwprodukten verkregen
    goederen, van oorsprong uit de Staten in Afrika, het Caribische gebied en de Stille
    Oceaan of uit de landen en gebieden overzee
  type: main
