title:
- language: en
  script: Latn
  content: COUNCIL REGULATION (EC) No 3676/93 of 21 December 1993 fixing, for certain
    fish stock and groups of fish stocks, the total allowable catches for 1994 and
    certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3676/93 du Conseil du 21 décembre 1993 fixant, pour
    certains stocks et groupes de stocks de poissons, les totaux admissibles des captures
    pour 1994 et certaines conditions dans lesquelles ils peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3676/93 DES RATES vom 21. Dezember 1993 zur Festlegung
    der zulässigen Gesamtfangmengen und entsprechender Fangbedingungen für bestimmte
    Fischbestände oder Bestandsgruppen für 1994
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 3676/93 af 21. december 1993 om fastsættelse
    for 1994 af de samlede tilladte fangstmængder for visse fiskebestande og grupper
    af fiskebestande samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3676/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 21ης Δεκεμβρίου 1993 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων, των συνολικών επιτρεπομένων αλιευμάτων
    (TAC) για το 1994, καθώς και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3676/93 DEL CONSIGLIO del 21 dicembre 1993 che stabilisce,
    per alcuni stock o gruppi di stock ittici, il totale ammissibile di catture (TAC)
    per il 1994 e talune condizioni cui è soggetta la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3676/93 VAN DE RAAD van 21 december 1993 inzake de
    vaststelling van de voor 1994 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen van visbestanden, alsmede de bij de visserij in het kader
    van de totaal toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3676/93 DO CONSELHO de 21 de Dezembro de 1993 que
    fixa, relativamente a determinadas unidades populacionais ou grupos de unidades
    populacionais de peixes, os totais admissíveis de capturas para 1994 e certas
    condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3676/93 DEL CONSEJO de 21 de diciembre de 1993 por
    el que se fijan, para determinadas poblaciones y grupos de poblaciones de peces,
    los totales admisibles de capturas para 1994 y determinadas condiciones en las
    que pueden pescarse
  type: main
