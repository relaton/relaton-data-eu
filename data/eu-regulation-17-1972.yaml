id: EURegulation171972
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 17/72 de la Commission, du 31 décembre 1971, fixant
    les montants compensatoires valables à partir du 3 janvier 1972 dans le secteur
    agricole à la suite de l'élargissement temporaire des marges de fluctuation
    des monnaies de certains États membres, à l'exclusion des montants valables
    pour les marchandises relevant du règlement (CEE) n° 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 17/72 der Kommission vom 31. Dezember 1971 zur Festsetzung
    der ab 3. Januar 1972 geltenden Ausgleichsbeträge in der Landwirtschaft im Anschluß
    an die vorübergehende Erweiterung der Bandbreiten der Währungen einiger Mitgliedstaaten,
    ausgenommen die Beträge für die unter die Verordnung (EWG) Nr. 1059/69 fallenden
    Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 17/72 della Commissione, del 31 dicembre 1971, che
    fissa gli importi di compensazione valevoli a partire dal 3 gennaio 1972 nel settore
    agricolo in seguito all'ampliamento temporaneo dei margini di fluttuazione delle
    monete di alcuni Stati membri, esclusi gli importi valevoli per le merci comprese
    nel regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 17/72 van de Commissie van 31 december 1971 houdende
    vaststelling van de compenserende bedragen, geldig met ingang van 3 januari 1972
    in de landbouwsector naar aanleiding van de tijdelijke verruiming van de fluctuatiemarges
    van de valuta's van sommige Lid-Staten, met uitzondering van de bedragen die gelden
    voor de produkten vallende onder Verordening (EEG) nr. 1059/69
  type: main
