id: EUDecision1975217
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 19 March 1975 authorizing the French Republic to
    permit the marketing of seed of monoecious hemp and sunflower, for a period which
    expires on 31 July 1975, not complying with the requirements set out in the Council
    Directive on the marketing of seed of oil and fibre plants
  type: main
- language: fr
  script: Latn
  content: '75/217/CEE: Décision de la Commission, du 19 mars 1975, autorisant la
    République française à admettre, pour une période expirant le 31 juillet 1975,
    la commercialisation de semences de chanvre monoïque et de tournesol ne répondant
    pas aux exigences de la directive du Conseil concernant la commercialisation de
    semences de plantes oléagineuses et à fibres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 19. März 1975 zur Ermächtigung der Französischen
    Republik, für einen Zeitraum, der am 31. Juli 1975 abläuft, Saatgut von monözischem
    Hanf und von Sonnenblumen zum gewerbsmäßigen Verkehr zuzulassen, das den Anforderungen
    der Richtlinie des Rates über den Verkehr mit Saatgut von Öl- und Faserpflanzen
    nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 19. marts 1975 om bemyndigelse til Den franske
    Republik til at tillade, at frø af enbo hamp og solsikke, der ikke opfylder kravene
    i Rådets direktiv om handel med frø af olie- og spindplanter, bringes i handelen
    i et tidsrum, der udløber den 31. juli 1975
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 19 marzo 1975, che autorizza la Repubblica
    francese ad ammettere, per un periodo che scade il 31 luglio 1975, la commercializzazione
    di sementi di canapa monoica e di girasole che non soddisfano alle norme della
    direttiva del Consiglio relativa alla commercializzazione delle sementi di piante
    oleaginose e da fibra
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 19 maart 1975 tot machtiging van de Franse
    Republiek en voor een periode eindigend op 31 juli 1975, zaaizaad van eenhuizige
    hennep en zonnebloem, dat niet beantwoordt aan de eisen van de richtlijn van de
    Raad betreffende het in de handel brengen van zaaizaad van oliehoudende planten
    en vezelgewassen, tot de handel toe te laten
  type: main
