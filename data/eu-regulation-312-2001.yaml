    от Тунис и относно дерогация от някои разпоредби
    на Регламенти (EО) № 1476/95 и (EО) № 1291/2000
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 312/2001 ze dne 15. února 2001, kterým se
    stanoví prováděcí pravidla pro dovoz olivového oleje pocházejícího z Tuniska
    a odchylka od některých ustanovení nařízení (ES) č. 1476/95 a č. 1291/2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 312/2001 af 15. februar 2001 om gennemførelsesbestemmelser
    for indførsel af olivenolie med oprindelse i Tunesien og om fravigelse af visse
    bestemmelser i forordning (EF) nr. 1476/95 og (EF) nr. 1291/2000
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 312/2001 της Επιτροπής,
    της 15ης Φεβρουαρίου 2001, περί λεπτομερειών εφαρμογής
    για την εισαγωγή ελαιολάδου καταγωγής Τυνησίας
    και περί παρεκκλίσεων από ορισμένες διατάξεις
    των κανονισμών (ΕΚ) αριθ. 1476/95 και (ΕΚ) αριθ. 1291/2000
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 312/2001, 15. veebruar 2001, milles sätestatakse
    Tuneesiast pärit oliiviõli impordi üksikasjalikud rakenduseeskirjad ning erandid
    teatavatest määruste (EÜ) nr 1476/95 ja (EÜ) nr 1291/2000 sätetest
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 312/2001, annettu 15 päivänä helmikuuta 2001,
