    rendelkezésektől való eltérésről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 312/2001 della Commissione, del 15 febbraio 2001, che
    stabilisce le modalità d'applicazione per l'importazione di olio d'oliva originario
    della Tunisia e deroga a talune disposizioni dei regolamenti (CE) n. 1476/95 e
    (CE) n. 1291/2000
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 312/2001 (2001. gada 15. februāris), ar ko paredz
