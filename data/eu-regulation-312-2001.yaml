title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 312/2001 of 15 February 2001 laying down
    detailed rules of application for the importation of olive oil originating in
    Tunisia and derogating from certain provisions of Regulations (EC) No 1476/95
    and (EC) No 1291/2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 312/2001 de la Commission du 15 février 2001 portant
    modalités d'application pour l'importation d'huile d'olive originaire de Tunisie
    et dérogeant à certaines dispositions des règlements (CE) n° 1476/95 et (CE)
    n° 1291/2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 312/2001 der Kommission vom 15. Februar 2001 mit Durchführungsbestimmungen
    für die Einfuhr von Olivenöl mit Ursprung in Tunesien und zur Abweichung von
    einigen Vorschriften der Verordnungen (EG) Nr. 1476/95 und (EG) Nr. 1291/2000
  type: main
- language: bg
  script: Cyrl
  content: Регламент (EО) № 312/2001 на Комисията от 15 февруари
