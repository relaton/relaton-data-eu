    și de derogare de la anumite dispoziții din Regulamentele (CE) nr. 1476/95 și
    (CE) nr. 1291/2000
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 312/2001 z 15. februára 2001, ktorým sa ustanovujú
