    en (EG) nr. 1291/2000
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 312/2001 z dnia 15 lutego 2001 r. ustanawiające
    szczegółowe zasady wnioskowania o przywóz oliwy z oliwek pochodzącej z Tunezji
    oraz uchylające niektóre przepisy rozporządzeń (WE) nr 1476/95 oraz (WE) nr
    1291/2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 312/2001 da Comissão, de 15 de Fevereiro de 2001,
    que estabelece normas de execução para a importação de azeite originário
    da Tunísia e derroga a certas disposições dos Regulamentos (CE) n.° 1476/95
    e (CE) n.° 1291/2000
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 312/2001 al Comisiei din 15 februarie 2001 de stabilire
