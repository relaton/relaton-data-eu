    de alimentos provenientes de existências de intervenção às organizações
    designadas para distribuição às pessoas mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/145/CEE: Decisión de la Comisión de 8 de marzo de 1988 por la que
