title:
- language: en
  script: Latn
  content: '88/145/EEC: Commission Decision of 8 March 1988 allocating to Luxembourg
    resources to be charged to the 1988 budget year for the supply of food from intervention
    stocks to designated organizations for distribution to the most deprived persons
    in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/145/CEE: Décision de la Commission du 8 mars 1988 allouant au Luxembourg
    les crédits imputables à l'' exercice 1988 pour la fourniture de denrées alimentaires
    provenant des stocks d'' intervention à des organisations désignées pour les
    distribuer aux personnes les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/145/EWG: Entscheidung der Kommission vom 8. März 1988 über die Bewilligung
    von Mitteln, die im Haushaltsjahr 1988 für die Zurverfügungstellung von Nahrungsmitteln
    aus Interventionsbeständen an bezeichnete Organisationen zur Verteilung an stark
    benachteiligte Personen in der Gemeinschaft zu verbuchen sind, für Luxemburg'
  type: main
- language: da
  script: Latn
  content: '88/145/EØF: Kommissionens beslutning af 8. marts 1988 om tildeling til
    Luxembourg af midler, der skal opføres på 1988-budgettet for levering af levnedsmidler
    fra interventionslagre til nærmere bestemte organisationer med henblik på uddeling
    til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/145/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Μαρτίου
    1988 που χορηγεί στο Λουξεμβούργο πιστώσεις
    που καταλογίζονται στο οικονομικό έτος 1988
    για τη χορήγηση τροφίμων που προέρχονται από
    τα αποθέματα της παρεμβάσεως στους οργανισμούς
    που ορίζονται για τη διανομή τους στους απόρους
    της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/145/CEE: Decisione della Commissione dell'' 8 marzo 1988 relativa ad
    uno stanziamento al Lussemburgo di risorse da imputare all'' esercizio finanziario
    1988 per la fornitura di derrate alimentari provenienti dalle scorte d'' intervento
    agli organismi incaricati di distribuirle agli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/145/EEG: Beschikking van de Commissie van 8 maart 1988 houdende toewijzing
    aan Luxemburg van voor het begrotingsjaar 1988 te boeken financiële middelen
    voor de levering van voedsel uit interventievoorraden aan organisaties die zijn
    aangewezen voor de verstrekking ervan aan behoeftigen in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/145/CEE: Decisão da Comissão de 8 de Março de 1988 relativa à afectação
