title:
- language: en
  script: Latn
  content: Commission Decision of 17 March 1994 amending Decision 93/484/EEC adopting
    the plan allocating to the Member States resources to be charged to the 1994 budget
    year for the supply of food from intervention stocks for the benefit of the most
    deprived persons in the Community
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 17 mars 1994 modifiant la décision 93/484/CEE
    adoptant le plan portant attribution aux États membres de ressources imputables
    à l'exercice 1994 pour l'exécution des fournitures de denrées alimentaires
    provenant des stocks d'intervention au bénéfice des personnes les plus démunies
    de la Communauté
  type: main
- language: de
  script: Latn
  content: ENTSCHEIDUNG DER KOMMISSION vom 17. März 1994 zur Änderung der Entscheidung
    93/484/EWG zur Annahme des Plans über die Bewilligung von Mitteln, die den Mitgliedstaaten
    für die Lieferung von Nahrungsmitteln aus Interventionsbeständen zur Verteilung
    an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr 1994 zu verbuchen
    sind
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 17. marts 1994 om ændring af beslutning 93/484/EØF
    om vedtagelse af planen for tildeling til medlemsstaterne af midler, der skal
    afholdes over 1994-budgettet, og som skal dække udgifterne til levering af levnedsmidler
    fra interventionslagre til de socialt dårligst stillede personer i Fællesskabet
  type: main
- language: el
  script: Grek
  content: ΑΠΟΦΑΣΗ ΤΗΣ ΕΠΙΤΡΟΠΗΣ της 17ης Μαρτίου 1994
    που τροποποιεί την απόφαση 93/484/ΕΟΚ για την
    έγκριση του προγράμματος για την κατανομή
    στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1994 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στους απόρους της Κοινότητας
  type: main
- language: it
  script: Latn
  content: DECISIONE DELLA COMMISSIONE del 17 marzo 1994 che modifica la decisione
    93/484/CEE che approva il piano di ripartizione agli Stati membri delle risorse
    da imputare all' esercizio finanziario 1994 per l' esecuzione delle forniture
    di derrate alimentari provenienti dalle scorte d' intervento a favore degli indigenti
    nella Comunità
  type: main
- language: nl
  script: Latn
  content: BESCHIKKING VAN DE COMMISSIE van 17 maart 1994 tot wijziging van Beschikking
    93/484/EEG tot vaststelling van het jaarplan voor de toewijzing aan de Lid-Staten
    van voor het begrotingsjaar 1994 te boeken financiële middelen voor de levering
    van levensmiddelen uit interventievoorraden aan de meest hulpbehoevenden in de
    Gemeenschap
  type: main
- language: pt
  script: Latn
  content: DECISÃO DA COMISSÃO de 17 de Março de 1994 que altera a Decisão 93/484/CEE,
    que adopta o plano que atribui aos Estados-membros recursos a incluir no exercício
    orçamental de 1994 para o fornecimento de géneros alimentícios provenientes
    das existências de intervenção a favor das pessoas mais necessitadas na Comunidade
  type: main
- language: es
  script: Latn
  content: DECISIÓN DE LA COMISIÓN de 17 de marzo de 1994 por la que se modifica
    la Decisión 93/484/CEE por la que se adopta el plan que establece la asignación
    a los Estados miembros de recursos imputables al ejercicio presupuestario de 1994
    para el suministro de alimentos procedentes de las existencias de intervención
    en beneficio de las personas más necesitadas de la Comunidad
  type: main
