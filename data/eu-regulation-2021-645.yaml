    des pays tiers ou parties de pays tiers à partir desquels l’introduction dans
    l’Union européenne de lots de lait cru, de produits laitiers, de colostrum
    et de produits à base de colostrum est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/645 der Kommission vom 15. April 2021
