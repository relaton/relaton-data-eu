title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/645 of 15 April 2021 amending
    Annex I to Regulation (EU) No 605/2010 as regards the list of third countries
    or parts thereof from which the introduction into the European Union of consignments
    of raw milk, dairy products, colostrum and colostrum-based products is authorised
  type: main
- language: fr
  script: Latn
