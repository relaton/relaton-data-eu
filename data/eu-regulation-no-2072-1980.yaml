title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2072/80 of 1 August 1980 re-establishing
    the levying of customs duties on woven pneumatic mattresses, products of category
    110 (code 1100), originating in South Korea, to which the preferential tarif arrangements
    set out in Council Regulation (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2072/80 de la Commission, du 1er août 1980, portant
    rétablissement de la perception des droits de douane applicables aux matelas
    pneumatiques, tissés, de la catégorie 110 (code 1100), originaires de Corée
    du Sud, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2072/80 der Kommission vom 1. August 1980 über die
    Wiedereinführung des Zollsatzes für Luftmatratzen aus Geweben, der Warenkategorie
    Nr. 110 (Kennziffer 1100), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 2894/79 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2072/80 af 1. august 1980 om genindførelse
    af opkrævning af toldafgifter for luftmadrasser, vævede, under kategori 110
    (kode 1100), som har oprindelse i Sydkorea og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2072/80 della Commissione, del 1° agosto 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai materassi pneumatici,
    tessuti, della categoria di prodotti n. 110 (codice 1100), originari della Corea
    del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2072/80 van de Commissie van 1 augustus 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op geweven
    luchtbedden, van de categorie van produkten nr. 110 (codenummer 1100) van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 2894/79 van de Raad
  type: main
