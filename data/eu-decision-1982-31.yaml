title:
- language: en
  script: Latn
  content: '82/31/EEC: Commission Decision of 14 January 1982 accepting undertakings
    in connection with the anti-dumping proceeding concerning imports of fluid cracking
    catalysts originating in the United States of America and terminating that proceeding'
  type: main
- language: fr
  script: Latn
  content: '82/31/CEE: Décision de la Commission, du 14 janvier 1982, portant acceptation
    des engagements souscrits, dans le cadre de la procédure anti-"dumping", concernant
    les importations de catalyseurs fluidifiés pour le craquage, originaires des
    États-Unis d'' Amérique et portant clôture de cette procédure à leur égard'
  type: main
- language: de
  script: Latn
  content: '82/31/EWG: Beschluß der Kommission vom 14. Januar 1982 zur Annahme von
    Verpflichtungen im Zusammenhang mit einem Antidumpingverfahren aus Anlaß der
    Einfuhr fluidisierter Krackkatalysatoren mit Ursprung in den Vereinigten Staaten
    von Amerika und zur Einstellung des Verfahrens'
  type: main
- language: da
  script: Latn
  content: '82/31/EØF: Kommissionens afgørelse af 14. januar 1982 om godtagelse
    af tilsagn i forbindelse med antidumpingproceduren vedrørende importen af fluidiserbare
    krakningskatalysatorer med oprindelse i Amerikas Forenede Stater og om afslutning
    af denne procedure'
  type: main
- language: el
  script: Grek
  content: '82/31/EOK: Απόφαση τής Επιτροπής τής 14ηέ Ιανουαρίου
