title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 557/94 of 14 March 1994 laying down a transitional
    measure regarding the total acidity content of the table wine produced in Spain
    and Portugal and released to the markets in those Member States for 1994
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 557/94 de la Commission du 14 mars 1994 portant mesure
    transitoire en matière d'acidité totale des vins de table produits en Espagne
    et au Portugal et mis à la consommation sur le marché de ces États membres
    pour l'année 1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 557/94 DER KOMMISSION vom 14. März 1994 mit den 1994
    bezüglich des Gesamtsäuregehalts von in Spanien und Portugal erzeugtem und dort
    in Verkehr gebrachtem Tafelwein anzuwendenden Übergangsmaßnahmen
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 557/94 af 14. marts 1994 om en overgangsforanstaltning
    for 1994 vedrørende det totale syreindhold i bordvine, der er produceret i Spanien
    og Portugal, og som overgår til frit forbrug i disse medlemsstater
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 557/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 14ης Μαρτίου 1994 για μεταβατικό μέτρο όσον
    αφορά την ολική οξύτητα οίνων που παράγονται
    στην Ισπανία και την Πορτογαλία και διατίθενται
    προς κατανάλωση στην αγορά των κρατών μελών
    για το 1994
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 557/94 DELLA COMMISSIONE del 14 marzo 1994 recante
    misure transitorie in materia di acidità totale dei vini da tavola prodotti in
    Spagna e in Portogallo e messi in consumo sul mercato di tali Stati membri nel
    1994
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 557/94 VAN DE COMMISSIE van 14 maart 1994 tot vaststelling,
    voor het jaar 1994, van een overgangsmaatregel met betrekking tot het totale zuurgehalte
    van in Spanje en Portugal vervaardigde tafelwijn die op de markt van deze Lid-Staten
    ter consumptie wordt aangeboden
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 557/94 DA COMISSÃO de 14 de Março de 1994 que estabelece
    uma medida transitória em matéria de acidez total dos vinhos de mesa produzidos
    em Espanha e em Portugal e introduzidos no consumo no mercado destes Estados-membros
    em 1994
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 557/94 DE LA COMISIÓN de 14 de marzo de 1994 por el
    que se establece una medida transitoria en materia de acidez total de los vinos
    de mesa producidos en España y Portugal despachados al consumo en el mercado
    de dichos Estados miembros durante el año 1994
  type: main
