id: EURegulation36241983
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3624/83 of 20 December 1983 fixing, for certain
    fish stocks and groups of fish stocks occurring in the Community' s fishing zone,
    total allowable catches for 1983, the share of these catches available to the
    Community, the allocation of that share between the Member States and the conditions
    under which the total allowable catches may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3624/83 du Conseil du 20 décembre 1983 fixant, pour
    certains stocks ou groupes de stocks de poissons se trouvant dans la zone de pêche
    de la Communauté, les totaux admissibles des captures pour 1983, la part de ces
    captures attribuées à la Communauté, la répartition de cette part entre les
    États membres et les conditions dans lesquelles les totaux admissibles des captures
    peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3624/83 des Rates vom 20. Dezember 1983 zur Festlegung
    der zulässigen Gesamtfangmenge und des für die Gemeinschaft verfügbaren Anteils,
    der Aufteilung dieses Anteils auf die Mitgliedstaaten sowie der Fangbedingungen
    hinsichtlich der zulässigen Gesamtfangmengen für bestimmte Fischbestände oder
    Bestandsgruppen in der Fischereizone der Gemeinschaft für 1983
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3624/83 af 20. december 1983 om fastsættelse
    for 1983 af den samlede tilladte fangstmængde for visse fiskebestande og grupper
    af fiskebestande i Fællesskabets fiskerizone samt af Fællesskabets andel af
    disse fangster, af dennes fordeling blandt medlemsstaterne og af bestemmelserne
    for fiskeri efter den samlede tilladte fangstmængde
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3624/83 του Συμβουλίου
    της 20ής Δεκεμβρίου 1983 περί καθορισμού, για
    ορισμένα αποθέματα ιχθύων και ομάδες αποθεμάτων
    ιχθύων που συναντώνται στην αλιευτική ζώνη
    της Κοινότητας, του συνόλου επιτρεπομένων
    αλιευμάτων για το 1983, του μεριδίου των αλιευμάτων
    που χορηγείται στην Κοινότητα, της κατανομής
    του μεριδίου αυτού στα κράτη μέλη και των όρων
    υπό τους οποίους πραγματοποιείται το σύνολο
    επιτρεπομένων αλιευμάτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3624/83 del Consiglio del 20 dicembre 1983 che fissa,
    per alcune popolazioni o gruppi di popolazioni ittiche presenti nelle zone di
    pesca della Comunità, il totale delle catture ammesse per il 1983 e la parte
    di queste catture disponibile per la Comunità, la ripartizione di detta parte
    tra gli Stati membri, nonché le condizioni cui è soggetta la pesca del totale
    delle catture ammesse
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3624/83 van de Raad van 20 december 1983 inzake de
    vaststelling van de voor 1983 geldende totaal toegestane vangsten voor bepaalde
    visbestanden of groepen visbestanden in de visserijzone van de Gemeenschap, het
    voor de Gemeenschap beschikbare gedeelte van deze vangsten, de verdeling van dit
    gedeelte over de Lid-Staten en de bij de visserij in het kader van de totaal toegestane
    vangsten in acht te nemen voorschriften
  type: main
