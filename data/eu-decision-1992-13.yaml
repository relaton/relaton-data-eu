title:
- language: en
  script: Latn
  content: Commission Decision of 18 December 1991 amending Decision 90/505/EEC authorizing
    certain Member States to provide for derogations from certain provisions of Council
    Directive 77/93/EEC in respect of sawn wood of conifers originating in Canada
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 18 décembre 1991, modifiant la décision
    90/505/CEE autorisant certains Etats membres à prévoir des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil en ce qui concerne le bois scié
    de conifères originaire du Canada
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 18. Dezember 1991 zur Änderung der Entscheidung
    90/505/EWG zur Ermächtigung bestimmter Mitgliedstaaten, für Nadelschnittholz
    mit Ursprung in Kanada Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG
    des Rates vorzusehen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 18. december 1991 om ændring af beslutning
    90/505/EØF om bemyndigelse af visse medlemsstater til at indrømme undtagelser
    fra visse bestemmelser i Rådets direktiv 77/91/EØF for opskåret nåletræ med
    oprindelse i Canada
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 18ης Δεκεμβρίου
    1991 για την τροποποίηση της απόφασης 90/505/ΕΟΚ
    η οποία επιτρέπει σε ορισμένα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου όσον αφορά
    την πριστή ξυλεία κωνοφόρων, καταγωγής Καναδά
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 18 dicembre 1991, recante modifica della
    decisione 90/505/CEE, che autorizza alcuni Stati membri a prevedere deroghe a
    determinate disposizioni della direttiva 77/93/CEE del Consiglio per quanto riguarda
    il legname di conifere originario del Canada
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 18 december 1991 tot wijziging van Beschikking
    90/505/EEG tot machtiging van een aantal Lid­Staten om voor gezaagd naaldhout
    van oorsprong uit Canada afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG
    van de Raad toe te staan
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão, de 18 de Dezembro de 1991, que altera a Decisão
    90/505/CEE, que autoriza certos Estados­membros a estabelecer derrogações de
    determinadas disposições da Directiva 77/93/CEE do Conselho em relação à
    madeira serrada de coníferas originária do Canadá
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión, de 18 de diciembre de 1991, que modifica la
    Decisión 90/505/CEE, por la que se autoriza a algunos Estados miembros para establecer
    excepciones a determinadas disposiciones de la Directiva 77/93/CEE del Consejo
    respecto de la madera aserrad de coníferas originaria de Canadá
  type: main
