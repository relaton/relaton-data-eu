title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 71/2013 of 25 January 2013 amending
    Regulation (EU) No 206/2010 as regards the entry for Uruguay in the list of third
    countries, territories or parts thereof authorised for the introduction of fresh
    meat into the Union and correcting that Regulation as regards the model veterinary
    certificate for ovine and caprine animals intended for breeding or production
    after importation
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 71/2013 de la Commission du 25 janvier
    2013 modifiant le règlement (UE) n ° 206/2010 en ce qui concerne l’entrée
    relative à l’Uruguay figurant sur la liste des pays tiers, territoires ou parties
    de pays tiers ou territoires en provenance desquels l’introduction dans l’Union
    européenne de viandes fraîches est autorisée et rectifiant ce règlement en
    ce qui concerne le modèle de certificat vétérinaire pour les animaux des espèces
    ovine et caprine destinés à l’élevage ou à la rente après importation
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 71/2013 der Kommission vom 25. Januar
    2013 zur Änderung der Verordnung (EU) Nr. 206/2010 bezüglich des Eintrags für
    Uruguay in der Liste der Drittländer, Gebiete und Teile davon, aus denen das
    Verbringen bestimmten frischen Fleisches in die Europäische Union zulässig ist,
    sowie zur Berichtigung der genannten Verordnung bezüglich des Musters der Veterinärbescheinigung
    für Schafe und Ziegen, die nach der Einfuhr für Zucht- oder Nutzzwecke bestimmt
    sind
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 71/2013 на Комисията
    от 25 януари 2013 година за изменение на Регламент
    (ЕС) № 206/2010 по отношение на вписването за Уругвай
    в списъка на третите страни, територии или
    части от тях, от които е разрешено въвеждането
    на прясно месо в Съюза, и за поправка на посочения
    регламент по отношение на образеца на ветеринарен
    сертификат за животни от рода на овцете и козите,
    предназначени за разплод или отглеждане след
    вноса
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 71/2013 ze dne 25. ledna 2013
    , kterým se mění nařízení (EU) č. 206/2010, pokud jde o položku týkající
    se Uruguaye na seznamu třetích zemí, území nebo jejich částí, z nichž
    je povolen vstup čerstvého masa do Unie, a opravuje se uvedené nařízení,
    pokud jde o vzor veterinárního osvědčení pro ovce a domácí kozy určené
    k chovu a/nebo produkci po dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 71/2013 af 25. januar
    2013 om ændring af forordning (EU) nr. 206/2010 for så vidt angår oplysningerne
    om Uruguay i listen over tredjelande, tredjelandsområder og dele heraf, som er
    godkendt med hensyn til indførsel af fersk kød til EU, og om berigtigelse af
    samme forordning for så vidt angår standardveterinærcertifikatet for får og
    geder til avl og/eller levebrug efter import
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 71/2013
    της Επιτροπής, της 25ης Ιανουαρίου 2013 , για την
