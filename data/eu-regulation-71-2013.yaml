  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) nr 71/2013, 25. jaanuar 2013 , millega
    muudetakse määrust (EL) nr 206/2010 seoses Uruguayd käsitleva kandega nende
    kolmandate riikide, territooriumide või nende osade loetelus, kust on lubatud
    Euroopa Liitu tuua värsket liha, ning parandatakse seda määrust seoses veterinaarsertifikaadi
    näidisega impordijärgselt aretamiseks või tootmiseks ette nähtud lammaste
    ja kitsede kohta
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 71/2013, annettu 25 päivänä
    tammikuuta 2013 , asetuksen (EU) N:o 206/2010 muuttamisesta siltä osin kuin on
    kyse Uruguayta koskevasta kohdasta sellaisten kolmansien maiden ja alueiden tai
    niiden osien luettelossa, joista on sallittua tuoda Euroopan unionin alueelle
    tuoretta lihaa, sekä kyseisen asetuksen oikaisemisesta jalostukseen tai tuotantoon
    tuonnin jälkeen tarkoitettuja lammas- ja vuohieläimiä koskevan eläinlääkärintodistuksen
    mallin osalta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) br. 71/2013 od 25. siječnja 2013. o izmjeni
    Uredbe (EU) br. 206/2010 o uvrštavanju Urugvaja na popis trećih zemalja, državnih
    područja ili njihovih dijelova iz kojih je dozvoljen uvoz svježeg mesa u Uniju
    i o ispravku te Uredbe u vezi s obrascem veterinarskog certifikata za ovce i koze
    namijenjene za rasplod ili proizvodnju nakon uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság 71/2013/EU végrehajtási rendelete ( 2013. január 25. )
    Uruguaynak a friss húsnak az Európai Unióba való behozatalára engedéllyel
    rendelkező harmadik országok, e harmadik országok területei vagy területeinek
    részei jegyzékébe való felvétele tekintetében a 206/2010/EU rendelet módosításáról,
    valamint az említett rendeletnek a behozatal után tenyésztésre vagy termelésre
    szánt juhfélék és kecskefélék állat-egészségügyi bizonyítványmintáinak
    tekintetében történő helyesbítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 71/2013 della Commissione, del 25 gennaio
    2013 , che modifica il regolamento (UE) n. 206/2010 per quanto riguarda la voce
    relativa all’Uruguay nell’elenco di paesi terzi, territori o loro parti in
    provenienza dai quali è autorizzata l’introduzione di carni fresche nell’Unione
    e che rettifica tale regolamento per quanto riguarda il modello di certificato
    veterinario per gli ovini e i caprini destinati all’allevamento o alla produzione
    dopo l’importazione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 71/2013 ( 2013. gada 25. janvāris
    ), ar ko groza Regulu (ES) Nr. 206/2010 attiecībā uz ierakstu par Urugvaju sarakstā
    ar tām trešām valstīm, to teritorijām vai daļām, no kurām atļauts Savienībā
    ievest svaigu gaļu, un labo minēto regulu attiecībā uz veterinārā sertifikāta
    paraugu aitu un kazu sugu dzīvniekiem, kas pēc importēšanas paredzēti vaislai
    vai audzēšanai
  type: main
- language: lt
  script: Latn
  content: 2013 m. sausio 25 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 71/2013,
    kuriuo Reglamentas (ES) Nr. 206/2010 iš dalies keičiamas dėl Urugvajaus įrašo
    trečiųjų šalių, teritorijų arba jų dalių, iš kurių leidžiama įvežti
    šviežią mėsą į Sąjungą, sąraše ir taisomas dėl veisimui arba gamybai
    po importo skirtų avių ir ožkų veterinarijos sertifikato pavyzdžio
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 71/2013 tal-
    25 ta’ Jannar 2013 li jemenda r-Regolament (UE) Nru 206/2010 rigward id-dħul
    tal-Urugwaj fil-lista ta’ pajjiżi terzi, territorji jew partijiet minnhom li
    huma awtorizzati biex idaħħlu l-laħam frisk fl-Unjoni u li jsewwi lil dan ir-Regolament
    fejn għandu x’jaqsam mal-mudell taċ-ċertifikat veterinarju għall-annimali
    ovini u kaprini maħsubin għat-tgħammir jew għall-produzzjoni wara li jiġu
    importati
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 71/2013 van de Commissie van 25 januari
    2013 tot wijziging van Verordening (EU) nr. 206/2010 wat betreft de gegevens voor
    Uruguay in de lijst van derde landen en gebieden, of delen daarvan, waaruit vers
    vlees in de Unie mag worden binnengebracht en tot rectificatie van die verordening
    wat betreft het model van het veterinair certificaat voor schapen en geiten bestemd
    voor fok- of gebruiksdoeleinden na invoer
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 71/2013 z dnia 25 stycznia 2013
    r. w sprawie zmiany rozporządzenia (UE) nr 206/2010 w odniesieniu do wpisu dotyczącego
    Urugwaju w wykazie krajów trzecich, ich terytoriów lub części, upoważnionych
    do wprowadzania do Unii świeżego mięsa oraz w sprawie sprostowania tego rozporządzenia
    w zakresie świadectw weterynaryjnych dla owiec i kóz przeznaczonych do hodowli
    lub produkcji po przywozie
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 71/2013 da Comissão, de 25 de janeiro
    de 2013 , que altera o Regulamento (UE) n. ° 206/2010 no que diz respeito à
    entrada relativa ao Uruguai na lista de países terceiros, territórios ou partes
    destes autorizados para a introdução de carne fresca na União e que retifica
    esse regulamento no que diz respeito ao modelo de certificado veterinário para
    ovinos e caprinos destinados a reprodução ou rendimento após importação
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 71/2013 al Comisiei din 25
    ianuarie 2013 de modificare a Regulamentului (UE) nr. 206/2010 în ceea ce privește
    rubrica referitoare la Uruguay din lista de țări terțe, teritorii sau părți
    ale acestora autorizate să introducă în Uniune carne proaspătă și de corectare
    a regulamentului respectiv în ceea ce privește modelul de certificat veterinar
    pentru ovinele și caprinele destinate reproducției sau producției după import
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 71/2013 z 25. januára 2013 ,
    ktorým sa mení a dopĺňa nariadenie (EÚ) č. 206/2010, pokiaľ ide o položku
    týkajúcu sa Uruguaja v zozname tretích krajín, území alebo ich častí,
    z ktorých sa povoľuje vstup čerstvého mäsa do Únie, a ktorým sa opravuje
    uvedené nariadenie, pokiaľ ide o vzor veterinárneho osvedčenia pre ovce a
    kozy určené na chov alebo produkciu po dovoze
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 71/2013 z dne 25. januarja 2013 o spremembi
    Uredbe (EU) št. 206/2010 glede vnosa za Urugvaj na seznamu tretjih držav, njihovih
    ozemelj ali delov, iz katerih se odobri vnos svežega mesa v Unijo, in o popravku
    navedene uredbe glede vzorca veterinarskega spričevala za ovce in koze, namenjene
    za vzrejo ali proizvodnjo po uvozu
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 71/2013 de la Comisión, de 25 de enero
    de 2013 , por el que se modifica el Reglamento (UE) n ° 206/2010 en lo que concierne
    a la entrada correspondiente a Uruguay en la lista de de terceros países, territorios
    o bien partes de terceros países o territorios autorizados a introducir carne
    fresca en la Unión y por el que se corrige dicho Reglamento en lo que concierne
    al modelo de certificado veterinario para ganado ovino y caprino destinado a la
    cría o a la producción después de la importación
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 71/2013 av den 25 januari
    2013 om ändring av förordning (EU) nr 206/2010 vad gäller posten för Uruguay
    i förteckningen över tredjeländer, områden eller delar därav från vilka
    det är tillåtet att föra in färskt kött till unionen och om rättelse av
    den förordningen vad gäller förlagan till veterinärintyg för får och getter
    avsedda för avel eller produktion efter import
  type: main
