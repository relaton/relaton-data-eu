title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1613/83 of 15 June 1983 imposing a provisional
    anti-dumping duty on imports of unwrought nickel, not alloyed, in the form of
    cathodes produced by electrolysis, either uncut or cut into squares, originating
    in the Soviet Union
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1613/83 de la Commission du 15 juin 1983 instituant
    un droit anti-"dumping" provisoire sur les importations de nickel brut non allié,
    sous forme de cathodes produites par électrolyse, non découpées ou de section
    carrée, originaire d' Union soviétique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1613/83 der Kommission vom 15. Juni 1983 zur Einführung
    eines vorläufigen Antidumpingzolls auf Einfuhren von Rohnickel, nicht legiert,
    in Form von elektrolytisch hergestellten Kathoden, auch quadratisch zugeschnitten,
    mit Ursprung in der UdSSR
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1613/83 af 15. juni 1983 om indførelse
    af en midlertidig antidumpingtold på importen af ubearbejdet, ikke-legeret nikkel
    i form af katoder fremstillet ved elektrolyse, utilskårne eller tilskårne i
    kvadrater, med oprindelse i Sovjetunionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1613/83 της Επιτροπής
    της 15ης Ιουνίου 1983 σχετικά με την επιβολή προσωρινού
    δασμού αντιντάμπινγκ για τις εισαγωγές ακατέργαστου
    νικελίου, όχι εις κράμα, υπό τη μορφή καθόδων
    παραγομένων με ηλεκτρόλυση, είτε μη κομμένων
    είτε κομμένων σε σχήμα τετραγώνου, καταγωγής
    Σοβιετικής Ένωσης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1613/83 della Commissione del 15 giugno 1983 che impone
    un dazio provvisorio antidumping sulle importazioni di nichel grezzo non in lega,
    sotto forma di catodi prodotti per elettrolisi, tagliati o no in forma quadrata,
    originari dell' Unione Sovietica
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1613/83 van de Commissie van 15 juni 1983 houdende
    instelling van een voorlopig anti-dumpingrecht op de invoer van niet-gelegeerd
    ruw nikkel in de vorm van kathoden verkregen door elektrolyse, niet of in vierkante
    platen gesneden, van oorsprong uit de Sovjetunie
  type: main
