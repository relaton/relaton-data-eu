title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2500/82 of 15 September 1982 authorizing
    the conclusion of short-term private storage contracts for grape must, concentrated
    grape must and rectified concentrated grape must
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2500/82 de la Commission, du 15 septembre 1982, ouvrant
    la possibilité de conclure des contrats de stockage privé à court terme pour
    les moûts de raisins, les moûts de raisins concentrés et les moûts de raisins
    concentrés rectifiés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2500/82 der Kommission vom 15. September 1982 über
    die Möglichkeit des Abschlusses kurzfristiger Verträge zur privaten Lagerhaltung
    von Traubenmost, konzentriertem Traubenmost und rektifiziertem Traubenmostkonzentrat
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2500/82 af 15. september 1982 om indgåelse
    af kortfristede kontrakter om privat oplagring af druemost, koncentreret druemost
    og rektificeret koncentreret druemost
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2500/82 τής Επιτροπής
    τής 15ης Σεπτεμβρίου 1982 περί παροχής δυνατότητας
    υπογραφής βραχυπρόθεσμων συμφωνητικών ιδιωτικής
    αποθεματοποιήσεως, όσον αφορά τά γλεύκη σταφυλών,
    τά συμπυκνωμένα γλεύκη σταφυλών καί τά ανακαθαρισμένα
    συμπυκνωμένα γλεύκη σταφυλών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2500/82 della Commissione, del 15 settembre 1982,
    che accorda la facoltà di concludere contratti di magazzinaggio privato a breve
    termine per i mosti di uve, i mosti di uve concentrati e i mosti di uve concentrati
    rettificati
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2500/82 van de Commissie van 15 september 1982 houdende
    opening van de mogelijkheid kortlopende contracten te sluiten voor de particuliere
    opslag van druivemost, geconcentreerde druivemost en gerectificeerde geconcentreerde
    druivemost
  type: main
