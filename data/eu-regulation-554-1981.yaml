  content: Council Regulation (EEC) No 554/81 of 27 February 1981 fixing certain interim
    measures for the conservation and management of fisheries resources applicable
    to vessels flying the flag of Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 554/81 du Conseil, du 27 février 1981, fixant certaines
    mesures intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 554/81 des Rates vom 27. Februar 1981 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber
    Schiffen unter spanischer Flagge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 554/81 af 27. februar 1981 om fastsættelse
