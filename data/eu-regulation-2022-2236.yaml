    Parlaments und des Rates in Bezug auf die technischen Anforderungen an in unbegrenzter
    Serie hergestellte Fahrzeuge, an in kleiner Serie hergestellte Fahrzeuge, an in
    kleiner Serie hergestellte vollautomatisierte Fahrzeuge und an Fahrzeuge mit besonderer
    Zweckbestimmung sowie in Bezug auf die Softwareaktualisierung
  type: main
