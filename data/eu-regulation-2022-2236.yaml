    europeo e del Consiglio per quanto riguarda le prescrizioni tecniche per i veicoli
    prodotti in serie illimitata, i veicoli prodotti in piccole serie, i veicoli totalmente
    automatizzati prodotti in piccole serie e i veicoli per uso speciale, e per quanto
    riguarda gli aggiornamenti del software
