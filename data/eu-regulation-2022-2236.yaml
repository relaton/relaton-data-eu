  content: Commission Delegated Regulation (EU) 2022/2236 of 20 June 2022 amending
    Annexes I, II, IV and V to Regulation (EU) 2018/858 of the European Parliament
    and of the Council as regards the technical requirements for vehicles produced
    in unlimited series, vehicles produced in small series, fully automated vehicles
    produced in small series and special purpose vehicles, and as regards software
    update
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2236 de la Commission du 20 juin 2022 modifiant
    les annexes I, II, IV et V du règlement (UE) 2018/858 du Parlement européen
    et du Conseil en ce qui concerne les prescriptions techniques applicables aux
    véhicules produits en séries illimitées, aux véhicules produits en petites
    séries, aux véhicules entièrement automatisés produits en petites séries
    et aux véhicules à usage spécial, et en ce qui concerne la mise à jour des
    éléments logiciels
  type: main
