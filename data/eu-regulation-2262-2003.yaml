    d'importazione presentate nel mese di dicembre 2003 nel quadro dei contingenti
    tariffari d'importazione per taluni prodotti del settore delle carni suine per
    il periodo dal 1° gennaio al 31 marzo 2004
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2262/2003 van de Commissie van 22 december 2003 tot
