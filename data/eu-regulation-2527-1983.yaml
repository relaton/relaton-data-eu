title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2527/83 of 7 September 1983 re-establishing
    the levying of customs duties on carbonates of sodium, falling within subheading
    28.42 A II and originating in Romania, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2527/83 de la Commission du 7 septembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux carbonates
    de sodium, de la sous-position 28.42 A II du tarif douanier commun, originaires
    de Roumanie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2527/83 der Kommission vom 7. September 1983 zur Wiedereinführung
    der Erhebung der Zölle für Natriumcarbonat der Tarifstelle 28.42 A II, mit Ursprung
    in Rumänien, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2527/83 af 7. september 1983 om genindførelse
    af opkrævning af told for carbonater af natrium henhørende under pos. 28.42
    A II og med oprindelse i Rumænien som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
