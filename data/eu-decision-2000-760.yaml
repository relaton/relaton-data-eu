  script: Latn
  content: '2000/760/EC: Commission Decision of 30 May 2000 on aid measures put in
    place by the Irish authorities to alleviate the situation of livestock farmers
    whose production was affected by adverse weather conditions in summer and autumn
    1998 (notified under document number C(2000) 1604) (Text with EEA relevance) (Only
    the English text is authentic)'
  type: main
- language: fr
  script: Latn
