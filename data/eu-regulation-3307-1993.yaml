  content: COMMISSION REGULATION (EC) No 3307/93 of 30 November 1993 re-establishing
    the levying of customs duties on products of category 43 (order No 40.0430), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
