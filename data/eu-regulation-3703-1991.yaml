title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3703/91 of 18 December 1991 re-establishing
    the levying of customs duties on products of category 13 (order No 40.0130), originating
    in Pakistan, to which the preferential tariff arrangement set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3703/91 DE LA COMMISSION du 18 décembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    de la catégorie 13 (numéro d'' ordre 40.0130) originaires du Pakistan, bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) no 3832/90 du Conseil
    #'
  type: main
- language: de
  script: Latn
