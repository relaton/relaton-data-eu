  script: Latn
  content: '2008/456/EC: Commission Decision of 5 March 2008 laying down rules for
    the implementation of Decision No 574/2007/EC of the European Parliament and of
    the Council establishing the External Borders Fund for the period 2007 to 2013
    as part of the General programme Solidarity and Management of Migration Flows
    as regards Member States'' management and control systems, the rules for administrative
    and financial management and the eligibility of expenditure on projects co-financed
    by the Fund (notified under document number C(2008) 789)'
  type: main
- language: fr
  script: Latn
