title:
- language: fr
  script: Latn
  content: Décision du Conseil du 17 octobre 1969, portant dérogation à la décision,
    du 9 octobre 1961, relative à l'uniformisation de la durée des accords commerciaux,
    pour l'accord à long terme relatif aux échanges commerciaux négocié entre
    les gouvernements de la République italienne et de la République socialiste
    de Roumanie
  type: main
- language: de
  script: Latn
  content: '69/361/EWG: Entscheidung des Rates vom 17. Oktober 1969 über eine Abweichung
    von der Entscheidung vom 9. Oktober 1961 zur Vereinheitlichung der Laufzeit von
    Handelsabkommen hinsichtlich des zwischen den Regierungen der Italienischen Republik
    und der Sozialistischen Republik Rumänien ausgehandelten langfristigen Abkommens
    über die Handelsbeziehungen'
  type: main
- language: it
  script: Latn
  content: '69/361/CEE: Decisione del Consiglio, del 17 ottobre 1969, recante deroga
    alla decisione del 9 ottobre 1961, relativa all''uniformazione della durata degli
    accordi commerciali, per quanto concerne l''accordo a lungo termine negoziato
    tra i governi della Repubblica italiana e della Repubblica socialista di Romania
    concernente gli scambi commerciali tra i due paesi'
  type: main
- language: nl
  script: Latn
  content: '69/361/EEG: Beschikking van de Raad van 17 oktober 1969 houdende afwijking
    van de beschikking van 9 oktober 1961 inzake de eenmaking van de geldigheidsduur
    van handelsakkoorden, ten aanzien van het akkoord op lange termijn inzake het
    handelsverkeer tussen de Regering van de Italiaanse Republiek en de Regering van
    de Socialistische Republiek Roemenië'
  type: main
