title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2021/2096 of 29 November 2021
    concerning the authorisation of endo-1,4-beta-xylanase produced by Trichoderma
    reesei CBS 143953 as a feed additive for all poultry species, pigs for fattening,
    piglets and all minor porcine species (holder of the authorisation: Danisco (UK)
    Ltd, represented in the Union by Genencor International B.V.)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2021/2096 de la Commission du 29 novembre
    2021 concernant l’autorisation de l’endo-1,4-β-xylanase produite par Trichoderma
    reesei CBS 143953 en tant qu’additif dans l’alimentation de toutes les espèces
    de volailles, des porcs d’engraissement, des porcelets et de toutes les espèces
    porcines mineures [titulaire de l’autorisation: Danisco (UK) Ltd représenté
    dans l’Union par Genencor International B.V.]'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2021/2096 der Kommission vom 29. November
