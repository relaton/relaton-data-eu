title:
- language: en
  script: Latn
  content: Commission Decision of 4 June 1975 specifying the extent to which applications
    for import licences lodged in May 1975 for young bovine animals of alpine breeds
    for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: '75/382/CEE: Décision de la Commission, du 4 juin 1975, déterminant dans
    quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d''importation déposées au mois de mai 1975 pour les jeunes bovins de races
    alpines destinés à l''engraissement'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Juni 1974 zur Bestimmung, inwieweit
    den im Monat Mai 1975 gestellten Anträgen auf Erteilung von Einfuhrlizenzen für
    zum Mästen bestimmte Jungrinder der Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. juni 1975 om i hvilket omfang ansøgninger
    om udstedelse af importlicenser, som er indgivet i maj 1975 for ungkvæg af alpine
    racer bestemt til opfedning, kan efterkommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 giugno 1975, che determina in quale
    misura può essere dato seguito alle domande di titoli d'importazione, presentate
    nel mese di maggio 1975, per giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 juni 1975 tot vaststelling van de mate
    waarin de in mei 1975 ingediende aanvragen om afgifte van invoercertificaten voor
    jonge mestrunderen van alpenrassen kunnen worden ingewilligd
  type: main
