    direktiivissä 92/118/ETY tarkoitettujen tuotteiden tuonnin, tehdyn päätöksen
    94/278/EY muuttamisesta hunajan tuonnin osalta (ETA:n kannalta merkityksellinen
    teksti) (tiedoksiannettu numerolla K(2001) 2666)'
  type: main
- language: hu
  script: Latn
