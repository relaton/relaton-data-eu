    noteiktus produktus, ņemot vērā Padomes Direktīvu 92/118/EEK, attiecībā
    uz medus ievešanu (izziņots ar dokumenta Nr. C(2001) 2666)
  type: main
- language: lt
  script: Latn
  content: 2001 m. rugsėjo 17 d. Komisijos sprendimas, iš dalies keičiantis Sprendimą
