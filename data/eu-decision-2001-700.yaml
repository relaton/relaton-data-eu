title:
- language: en
  script: Latn
  content: '2001/700/EC: Commission Decision of 17 September 2001 amending Decision
    94/278/EC drawing up a list of third countries from which Member States authorise
    imports of certain products subject to Council Directive 92/118/EEC, with respect
    to imports of honey (Text with EEA relevance) (notified under document number
    C(2001) 2666)'
  type: main
- language: fr
  script: Latn
  content: '2001/700/CE: Décision de la Commission du 17 septembre 2001 modifiant
    la décision 94/278/CE établissant la liste des pays tiers en provenance desquels
    les États membres autorisent l''importation de certains produits visés par la
    directive 92/118/CEE du Conseil, en ce qui concerne les importations de miel (Texte
    présentant de l''intérêt pour l''EEE) [notifiée sous le numéro C(2001) 2666]'
  type: main
- language: de
  script: Latn
  content: '2001/700/EG: Entscheidung der Kommission vom 17. September 2001 zur Änderung
    der Entscheidung 94/278/EG der Kommission zur Festlegung der Listen von Drittländern,
    aus denen die Mitgliedstaaten die Einfuhr von bestimmten Erzeugnissen der Richtlinie
    92/118/EWG des Rates zulassen, im Hinblick auf die Einfuhr von Honig (Text von
    Bedeutung für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 2666)'
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 17. září 2001, kterým se mění rozhodnutí
