    importuoti tam tikrus Tarybos direktyvos 92/118/EEB reglamentuojamus produktus,
    sąrašą dėl medaus importo (pranešta dokumentu Nr. C(2001) 2666)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tas-17 ta’ Settembru 2001 li temenda d-Deċiżjoni
    94/278/KE li tistabbilixxi lista tal- pajjiżi terzi li minnhom l-Istati Membri
    jawtoriżżaw l-importazzjoni ta’ xi prodotti msemmija fid-Direttiva tal-Kunsill
    92/118/KEE, rigward l-importazzjoni tal-għasel (notifikata bin-numru tad-dokument
    C(2001) 2666)
  type: main
- language: nl
  script: Latn
  content: '2001/700/EG: Beschikking van de Commissie van 17 september 2001 houdende
    wĳziging van Beschikking 94/278/EG van de Commissie tot vaststelling van de lĳst
    van derde landen waaruit de lidstaten de invoer van bepaalde producten als bedoeld
    bĳ Richtlĳn 92/118/EEG van de Raad toestaan, met betrekking tot de invoer van
    honing (Voor de EER relevante tekst) (kennisgeving geschied onder nummer C(2001)
    2666)'
  type: main
- language: pl
  script: Latn
  content: Decyzja Komisji z dnia 17 września 2001 r. zmieniająca decyzję 94/278/WE
    ustalającą wykaz państw trzecich, z których Państwa Członkowskie dopuszczają
    przywóz niektórych produktów objętych dyrektywą Rady 92/118/EWG, w odniesieniu
    do miodu (notyfikowana jako dokument nr C(2001) 2666)
  type: main
- language: pt
  script: Latn
  content: '2001/700/CE: Decisão da Comissão, de 17 de Setembro de 2001, que altera
    a Decisão 94/278/CE que estabelece uma lista de países terceiros dos quais os
    Estados-Membros autorizam a importação de determinados produtos abrangidos pela
    Directiva 92/118/CEE do Conselho, no que diz respeito às importações de mel
    (Texto relevante para efeitos do EEE) [notificada com o número C(2001) 2666]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie zo 17. septembra 2001, ktorým sa mení a dopĺňa
    rozhodnutie 94/278/ES, stanovujúce zoznam tretích krajín, z ktorých členské
    štáty povoľujú dovozy určitých produktov, na základe smernice Rady 92/118/EHS,
    čo sa týka dovozov medu (oznámené pod číslom dokumentu C(2001) 2666)
  type: main
- language: sl
  script: Latn
  content: Odločba Komisije z dne 17. septembra 2001 o spremembi Odločbe 94/278/ES
    o sestavi seznama tretjih držav, iz katerih države članice dovolijo uvoz nekaterih
    proizvodov, ki so predmet Direktive Sveta 92/118/EGS, v zvezi z uvozom medu (notificirano
    pod dokumentno številko K(2001) 2666)
  type: main
- language: es
  script: Latn
  content: '2001/700/CE: Decisión de la Comisión, de 17 de septiembre de 2001, que
    modifica la Decisión 94/278/CE por la que se establece la lista de los terceros
    países desde los que los Estados miembros deben autorizar la importación de
    ciertos productos contemplados en la Directiva 92/118/CEE del Consejo, en lo que
    se refiere a las importaciones de miel (Texto pertinente a efectos del EEE) [notificada
    con el número C(2001) 2666]'
  type: main
- language: sv
  script: Latn
  content: '2001/700/EG: Kommissionens beslut av den 17 september 2001 om ändring
    av beslut 94/278/EG om upprättande av en förteckning över de tredje länder
    från vilka medlemsstater får importera vissa produkter som omfattas av rådets
    direktiv 92/118/EEG när det gäller import av honung (Text av betydelse för
    EES) [delgivet med nr K(2001) 2666]'
