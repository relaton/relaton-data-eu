  content: Commission Regulation (EC) No 2069/2003 of 25 November 2003 correcting
    Regulation (EC) No 2058/2003 fixing the maximum export refund on wholly milled
    medium grain and long grain A rice to be exported to certain third countries in
    connection with the invitation to tender issued in Regulation (EC) No 1876/2003
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2069/2003 de la Commission du 25 novembre 2003 rectifiant
