    all'esportazione di riso lavorato a grani medi e lunghi A a destinazione di alcuni
    paesi terzi nell'ambito della gara indetta dal regolamento (CE) n. 1876/2003
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2069/2003 van de Commissie van 25 november 2003 houdende
