title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 738/81 of 23 March 1981 re-establishing
    the levying of customs duties on other made up textile articles, woven, products
    of category 112 (code 1120), originating in Hong Kong, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 738/81 de la Commission, du 23 mars 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    confectionnés en tissus, de la catégorie de produits n° 112 (code 1120), originaires
    de Hong-kong, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 738/81 der Kommission vom 23. März 1981 über die
    Wiedereinführung des Zollsatzes für andere konfektionierte Waren aus Geweben
    der Warenkategorie Nr. 112 (Kennziffer 1120), mit Ursprung in Hongkong, dem die
    in der Verordnung (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 738/81 af 23. marts 1981 om genindførelse
    af opkrævning af toldafgifter for andre konfektionerede tekstilvarer under kategori
    112 (kode 1120), som har oprindelse i Hongkong og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 738/81 τής Επιτροπής
    τής 23ης Μαρτίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών, γιά έτερα είδη,
    έτοιμα, εξ υφασμάτων, τών προϊόντων τής κατηγορίας
    112 (κώδικας 1120), καταγωγής Χόνγκ Κόνγκ, δικαιούχων
    τών προβλεπομένων στόν κανονισμό (ΕΟΚ) αριθ.
    3320/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 738/81 della Commissione, del 23 marzo 1981, che ripristina
    la riscossione dei dazi doganali applicabili agli altri manufatti confezionati
    di tessuti, della categoria di prodotti n. 112 (codice 1120), originari di Hong
    Kong, beneficiario delle preferenze tariffarie previste dal regolamento (CEE)
    n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 738/81 van de Commissie van 23 maart 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op andere geconfectioneerde
    artikelen van weefsels van de categorie van produkten nr. 112 (codenummer 1120),
    van oorsprong uit Hong-Kong, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3320/80 van de Raad
  type: main
