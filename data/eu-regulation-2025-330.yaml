  content: Commission Implementing Regulation (EU) 2025/330 of 19 February 2025 amending
    Annexes VIII and XI to Implementing Regulation (EU) 2021/620 as regards the approval
    or withdrawal of the disease-free status of certain Member States or zones thereof
    as regards certain listed diseases and the approval of eradication programmes
    for certain listed diseases
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/330 de la Commission du 19 février
    2025 modifiant les annexes VIII et XI du règlement d’exécution (UE) 2021/620
    en ce qui concerne l’approbation ou le retrait du statut indemne de maladie
    de certains États membres ou de zones de ceux-ci au regard de certaines maladies
    répertoriées et l’approbation de programmes d’éradication de certaines
    maladies répertoriées
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/330 der Kommission vom 19. Februar 2025
    zur Änderung der Anhänge VIII und XI der Durchführungsverordnung (EU) 2021/620
    hinsichtlich der Genehmigung und der Aberkennung des Status seuchenfrei für bestimmte
    Mitgliedstaaten oder Zonen dieser Mitgliedstaaten in Bezug auf bestimmte gelistete
    Seuchen und hinsichtlich der Genehmigung von Tilgungsprogrammen für bestimmte
    gelistete Seuchen
  type: main
