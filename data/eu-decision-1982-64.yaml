title:
- language: en
  script: Latn
  content: '82/64/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''Varian- Leed/Auger optics, model 981-0127, with Leed/Auger
    electron gun, model 981-2125, power module, model 981- 2145 and Leed module, model
    981-2148'' may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/64/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "Varian-Leed/Auger Optics, model 981-0127,
    with Leed/Auger Electron Gun, model 981-2125, Power Module, model 981-2145 and
    Leed model 981-2148" peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
- language: de
  script: Latn
  content: '82/64/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,VARIAN- LEED/Auger Optics, model 981-0127,
    with LEED/Auger Electron Gun, model 981-2125, Power Module, model 981- 2145 and
    LEED Module, model 981-2148" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/64/EØF: Kommissionens beslutning af 21. december 1981 om fastslåelse
    af, at indførsel af apparatet "Varian- Leed/Auger Optics, model 981-0127, with
    Leed/Auger Electron Gun, model 981-2125, Power Module, model 981- 2145 and Leed
    Module, model 981-2148" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/64/EOK: Απόφαση τής Επιτροπής τής 21ης Δεκεμβρίου
    1981 περί δαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Varian-Leed/Auger optics, model 981-0127, with
    Leed/Auger electron gun, model 981-2125, power module, model 981/2145 and Leed
    module, model 981-2148» δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/64/CEE: Decisione della Commissione, del 21 dicembre 1981, che stabilisce
    che l''importazione dell''apparecchio denominato "Varian-Leed/Auger Optics, model
    981-0127, with Leed/Auger Electron Gun, model 981-2125, Power Module, model 981-2145
    and Leed Module, model 981-2148" può avvenire in franchigia dai dazi della tariffa
    doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/64/EEG: Beschikking van de Commissie van 21 december 1981 waarbij wordt
    vastgesteld dat het apparaat genaamd ,,VARIAN-LEED/Auger Optics, model 981-0127,
    with LEED/Auger Electron Gun, model 981-2125, Power module, model 981-2145 and
    LEED Module, model 981-2148" met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
