title:
- language: en
  script: Latn
  content: '82/774/EEC: Commission Decision of 22 July 1982 on a Belgian Government
    aid scheme concerning the setting-up of a new factory by a soft drinks manufacturer
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/774/CEE: Décision de la Commission, du 22 juillet 1982, concernant
    une aide que le gouvernement belge projette d''accorder en faveur de la nouvelle
    implantation d''une entreprise fabriquant des boissons rafraîchissantes non alcoolisées
    (Les textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/774/EWG: Entscheidung der Kommission vom 22. Juli 1982 über das Vorhaben
    der belgischen Regierung, einem Unternehmen, das alkoholfreie Erfrischungsgetränke
    herstellt, eine Beihilfe für eine neue Betriebsanlage zu gewähren (Nur der französische
    und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/774/EØF: Kommissionens beslutning af 22. juli 1982 vedrørende støtte,
    som den belgiske regering har til hensigt at yde til et nyt fabriksanlæg opført
    af en virksomhed, der fremstiller alkoholfri læskedrikke (Kun de franske og nederlandske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/774/EOK: Απόφαση της Επιτροπής της 22ας Ιουλίου
    1982 περί της ενίσχυσης που σχεδιάζει να χορηγήσει
    η βελγική κυβέρνηση για τη νέα εγκατάσταση
    επιχείρησης που παρασκευάζει μη οινοπνευματώδη
    αναψυκτικά ποτά (Τα κείμενα στη γαλλική και
    ολλανδική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/774/CEE: Decisione della Commissione, del 22 luglio 1982, concernente
    un aiuto che il governo belga intende accordare a favore del nuovo insediamento
    di un''impresa produttrice di bibite analcoliche (I testi in lingua francese e
    olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/774/EEG: Beschikking van de Commissie van 22 juli 1982 betreffende
