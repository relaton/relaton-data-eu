    vestiging van een onderneming die frisdranken produceert (Slechts de teksten in
    de Franse en de Nederlandse taal zijn authentiek)'
  type: main
- language: es
  script: Latn
  content: '82/774/CEE: Decisión de la Comisión, de 22 de julio de 1982, relativa
