  content: Council Regulation (EEC) No 803/85 of 26 March 1985 amending for the second
    time Regulation (EEC) No 5/85 laying down for 1985 certain measures for the conservation
    and management of fishery resources applicable to vessels registered in the Faroe
    Islands
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 803/85 du Conseil du 26 mars 1985 portant deuxième
    modification du règlement (CEE) no 5/85 fixant, pour l' année 1985, certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires immatriculés aux îles Féroé
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 803/85 des Rates vom 26. März 1985 zur zweiten Änderung
    der Verordnung (EWG) Nr. 5/85 zur Festlegung von Maßnahmen zur Erhaltung und
    Bewirtschaftung der Fischbestände für auf den Färöern registrierte Schiffe
    für 1985
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 803/85 af 26. marts 1985 om anden ændring
    af forordning (EØF) nr. 5/85 om fastsættelse for 1985 af visse foranstaltninger
    til bevarelse og forvaltning af fiskeressourcerne, som skal finde anvendelse på
    fartøjer, der er registreret på Færøerne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 803/85 του Συμβουλίου
    της 26ης Μαρτίου 1985 για δεύτερη τροποποίηση
    του κανονισμού (ΕΟΚ) αριθ. 5/85 για τον καθορισμό,
    για το έτος 1985, ορισμένων μέτρων διατηρήσεως
    και διαχειρίσεως των αλιευτικών πόρων που
    εφαρμόζονται στα σκάφη που είναι νηολογημένα
    στις νήσους Φερόε
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 803/85 del Consiglio del 26 marzo 1985 recante seconda
    modifica del regolamento (CEE) n. 5/85, che stabilisce per il 1985 talune misure
    di conservazione e di gestione delle risorse ittiche da applicare alle navi immatricolate
    nelle isole Færøer
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 803/85 van de Raad van 26 maart 1985 houdende tweede
