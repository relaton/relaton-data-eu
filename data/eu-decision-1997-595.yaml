title:
- language: en
  script: Latn
  content: '97/595/EC: Commission Decision of 14 August 1997 amending Decision 96/687/EC
    adopting the plan allocating to the Member States resources to be charged to the
    1997 budget year for the supply of food from intervention stocks for the benefit
    of the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '97/595/CE: Décision de la Commission du 14 août 1997 modifiant la décision
    96/687/CE adoptant le plan portant attribution aux États membres de ressources
    imputables à l''exercice 1997 pour l''exécution des fournitures de denrées
    alimentaires provenant des stocks d''intervention au bénéfice des personnes
    les plus démunies de la Communauté'
  type: main
- language: de
  script: Latn
  content: '97/595/EG: Entscheidung der Kommission vom 14. August 1997 zur Änderung
    der Entscheidung 96/687/EG mit dem Programm zur Bewilligung von Mitteln, die den
    Mitgliedstaaten für die Lieferung von Nahrungsmitteln aus Interventionsbeständen
    zur Verteilung an Bedürftige in der Gemeinschaft zuzuteilen und im Haushaltsjahr
    1997 zu verbuchen sind'
  type: main
- language: da
  script: Latn
  content: '97/595/EF: Kommissionens beslutning af 14. august 1997 om ændring af
    beslutning 96/687/EF om vedtagelse af planen for tildeling til medlemsstaterne
    af midler, der kan afholdes over 1997-budgettet, og som skal dække udgifterne
    til levering af levnedsmidler fra interventionslagre til de socialt dårligst
    stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '97/595/ΕΚ: Απόφαση της Επιτροπής της 14ης Αυγούστου
    1997 για τροποποίηση της απόφασης 96/687/ΕΚ για
    την έγκριση του προγράμματος για την κατανομή
    στα κράτη μέλη των πόρων που θα καταλογισθούν
    στο έτος προϋπολογισμού 1997 για την παροχή τροφίμων
    που προέρχονται από τα αποθέματα παρέμβασης
    στα άπορα άτομα της Κοινότητας'
  type: main
- language: fi
  script: Latn
  content: '97/595/EY: Komission päätös, tehty 14 päivänä elokuuta 1997, varainhoitovuodelle
    1997 kirjattavien varojen jakamista jäsenvaltioille koskevan suunnitelman hyväksymisestä
    interventiovarastoista peräisin olevien elintarvikkeiden toimittamiseksi yhteisön
    vähävaraisimmille henkilöille tehdyn päätöksen 96/687/EY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '97/595/CE: Decisione della Commissione del 14 agosto 1997 recante modifica
    della decisione 96/687/CE che approva il piano di ripartizione tra gli Stati membri
    delle risorse da imputare all''esercizio finanziario 1997 per l''esecuzione delle
    forniture di derrate alimentari provenienti dalle scorte d''intervento a favore
    degli indigenti nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '97/595/EG: Beschikking van de Commissie van 14 augustus 1997 houdende
    wijziging van Beschikking 96/687/EG tot vaststelling van het jaarplan voor de
    toewijzing aan de lidstaten van voor het begrotingsjaar 1997 te boeken financiële
    middelen voor de levering van levensmiddelen uit interventievoorraden aan de meest
    hulpbehoevenden in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '97/595/CE: Decisão da Comissão de 14 de Agosto de 1997 que altera a
    Decisão 96/687/CE que adopta o plano que atribui aos Estados-membros recursos
    a imputar ao exercício de 1997 para o fornecimento de géneros alimentícios
    provenientes das existências de intervenção a favor das pessoas mais necessitadas
    na Comunidade'
  type: main
- language: es
