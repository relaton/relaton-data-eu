  script: Latn
  content: '90/227/EEC: Council Decision of 7 May 1990 on the conclusion of the Agreement
    in the form of an exchange of letters concerning the provisional application of
    the protocol establishing, for the period from 1 January 1990 to 31 December 1991,
    the fishing rights and financial compensation provided for in the Agreement between
    the European Economic Community and the government of the Republic of Guinea on
    fishing off the Guinean coast'
  type: main
- language: fr
  script: Latn
  content: '90/227/CEE: Décision du Conseil du 7 mai 1990, concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pèche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République de Guinée concernant la pèche au large de la côte guinéenne,
    pour la période du 1er janvier 1990 au 31 décembre 1991'
