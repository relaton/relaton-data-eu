title:
- language: fr
  script: Latn
  content: Décision 66/289/CEE de la Commission, du 2 mai 1966, autorisant la République
    italienne à suspendre partiellement à l'égard des pays tiers ses droits de
    douane applicables à l'importation de certaines viandes bovines congelées, destinées,
    sous contrôle douanier, à la transformation
  type: main
- language: de
  script: Latn
  content: '66/289/EWG: Entscheidung der Kommission vom 2. Mai 1966 zur Ermächtigung
    an die Italienische Republik, die bei der Einfuhr einiger zur Verarbeitung unter
    Zollaufsicht bestimmter Arten von gefrorenem Rindfleisch erhobenen Zollsätze
    gegenüber dritten Ländern teilweise auszusetzen'
  type: main
- language: it
  script: Latn
  content: '66/289/CEE: Decisione della Commissione, del 2 maggio 1966, con cui si
    autorizza la Repubblica italiana a sospendere parzialmente nei confronti dei paesi
    terzi i suoi dazi doganali applicabili all''importazione di talune carni bovine
    congelate destinate alla trasformazione sotto controllo doganale'
  type: main
- language: nl
  script: Latn
  content: '66/289/EEG: Beschikking van de Commissie van 2 mei 1966 waarbij de Italiaanse
    Republiek wordt gemachtigd haar douanerechten ten opzichte van derde landen bij
    de invoer van bepaalde soorten bevroren rundvlees, bestemd voor verwerking onder
    douanetoezicht, gedeeltelijk te schorsen'
  type: main
