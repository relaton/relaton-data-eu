title:
- language: en
  script: Latn
  content: '2010/403/: Commission Decision of 14 July 2010 exempting the production
    and wholesale of electricity in Italy’s Macro-zone North and the retail of electricity
    to end customers connected to the medium, high and very high voltage grid in Italy,
    from the application of Directive 2004/17/EC of the European Parliament and of
    the Council coordinating the procurement procedures of entities operating in the
    water, energy, transport and postal services sectors (notified under document
    C(2010) 4740)'
  type: main
- language: fr
  script: Latn
  content: '2010/403/: Décision de la Commission du 14 juillet 2010 exemptant la
    production et le commerce en gros d’électricité dans la macrozone nord de
    l’Italie et la vente au détail d’électricité aux clients finals connectés
    au réseau à moyenne, haute et très haute tension en Italie de l’application
    de la directive 2004/17/CE du Parlement européen et du Conseil portant coordination
    des procédures de passation des marchés dans les secteurs de l’eau, de l’énergie,
    des transports et des services postaux [notifiée sous le numéro C(2010) 4740]'
  type: main
