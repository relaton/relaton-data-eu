title:
- language: fr
  script: Latn
  content: Décision 65/320/CEE du Conseil du 22 juin 1965, autorisant la République
    fédérale d'Allemagne à suspendre partiellement à l'égard des pays tiers ses
    droits de douane applicables aux vaches vivantes, de l'espèce bovine, des espèces
    domestiques, de la sous-position Ex 01.02 A II
  type: main
- language: de
  script: Latn
  content: '65/320/EWG: Entscheidung des Rates vom 22. Juni 1965 zur Ermächtigung
    der Bundesrepublik Deutschland, ihre Zollsätze für Kühe, lebend, der Rasse
    Hausrinder, der Tarifstelle ex 01.02 A II, gegenüber Drittländern teilweise
    auszusetzen'
  type: main
- language: it
  script: Latn
  content: '65/320/CEE: Decisione del Consiglio, del 22 giugno 1965, che autorizza
    la Repubblica federale di Germania a sospendere parzialmente i dazi doganali applicabili
    alle importazioni dai paesi terzi di vacche vive della specie bovina, delle specie
    domestiche, della sottovoce ex 01.02 A II'
  type: main
- language: nl
  script: Latn
  content: '65/320/EEG: Beschikking van de Raad van 22 juni 1965 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd, ten aanzien van derde landen haar douanerechten op
    levende koeien, runderen, huisdieren, van de onderverdeling ex 01.02 A II, gedeeltelijk
    te schorsen'
  type: main
