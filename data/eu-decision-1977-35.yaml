title:
- language: en
  script: Latn
  content: Commission Decision of 21 December 1976 on the granting by the Guidance
    Section of the EAGGF to the French Republic of a payment on account in respect
    of expenditure incurred from 1973 to 1975 on aids relating to the provision of
    socio-economic guidance for and the acquisition of occupational skills by persons
    engaged in agriculture
  type: main
- language: fr
  script: Latn
  content: '77/35/CEE: Décision de la Commission, du 21 décembre 1976, relative
    au versement par le FEOGA, section orientation, à la République française d''un
    acompte sur les dépenses effectuées pendant les années 1973 à 1975 pour les
    aides relatives à l''information socio- économique et à la qualification professionnelle
    des personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 21. Dezember 1976 über die Zahlung eines
    Abschlags durch den EAGFL, Abteilung Ausrichtung, für die in den Jahren 1973/1975
    für die sozio-ökonomische Information und die berufliche Qualifikation der in
    der Landwirtschaft tätigen Personen geleisteten Ausgaben an die Französische
    Republik
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 21. december 1976 om udbetaling gennem EUGFL,
    udviklingssektionen, til Den franske Republik, af et a contobeløb for de udgifter,
    som er afholdt i løbet af årene 1973/1975 til støtte vedrørende social og
    erhvervsmæssig vejledning og faglige kvalifikationer hos de personer, som arbejder
    i landbruget
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 21 dicembre 1976, relativa al versamento
    da parte del FEAOG, sezione orientamento, alla Repubblica francese di un anticipo
    sulle spese effettuate durante il periodo dal 1973 al 1975 per gli aiuti concernenti
    l'informazione socio-economica e la qualificazione professionale delle persone
    che lavorano nell'agricoltura
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 21 december 1976 inzake de betaling door
    het EOGFL, afdeling Oriëntatie, aan de Franse Republiek van een voorschot voor
    de gedurende de jaren 1973 tot en met 1975 gedane uitgaven voor de steun met betrekking
    tot de sociaal-economische voorlichting en de scholing van de personen die in
    de landbouw werkzaam zijn
  type: main
