title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1535/87 of 2 June 1987 re-establishing the
    levying of customs duties on woven fabrics of synthetic fibres (discontinuous
    or waste), other than unbleached or bleached, products of category 3a (code 40.0034),
    originating in Pakistan, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1535/87 de la Commission du 2 juin 1987 portant rétablissement
    de la perception des droits de douane applicables aux tissus de fibres synthétiques
    discontinues autres qu' écrus ou blanchis, de la catégorie de produits n° 3
    a) (code 40.0034), originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1535/87 der Kommission vom 2. Juni 1987 zur Wiedereinführung
    des Zollsatzes für Gewebe aus synthetischen oder künstlichen Spinnfasern, andere
    als roh oder gebleicht, der Warenkategorie Nr. 3 a) (Kennziffer 40.0034) mit Ursprung
    in Pakistan, dem die in der Verordnung (EWG) Nr. 3925/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1535/87 af 2. juni 1987 om genindførelse
    af opkrævning af toldafgifter for vævet stof af korte kemofibre eller af affald
    af kemofibre, bortset fra stoffer ublegede og blegede, under varekategori nr.
    3 a) (kode 40.0034), som har oprindelse i Pakistan og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1535/87 της Επιτροπής
    της 2ας Ιουνίου 1987 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για υφάσματα
    εκ συνθετικών ινών, έτερα αλεύκαστων ή λευκασμένων
    της κατηγορίας προϊόντων αριθ. 3 α) (κωδικός
    40.0034), καταγωγής Πακιστάν, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3925/86 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1535/87 della Commissione del 2 giugno 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai tessuti di fibre tessili sintetiche
    in fiocco diversi dai greggi o imbianchiti della categoria di prodotti 3 a) (codice
    40.0034) originari del Pakistan beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3925/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1535/87 van de Commissie van 2 juni 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    van synthetische of van kunstmatige stapelvezels, van de categorie van produkten
    nr. 3 a) (codenummer 40.0034), van oorsprong uit Pakistan, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3925/86 van de
    Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1535/87 da Comissão de 2 de Junho de 1987 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos tecidos de fibras sintéticas
    descontínuas, com excepção dos crus e branqueados, da categoria de produtos
    n.° 3 a) (código 40.0034), originários do Paquistão, beneficiário das preferências
    pautais previstas no Regulamento (CEE) n.° 3925/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1535/87 de la Comisión de 2 de junio de 1987 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    tejidos de fibras textiles sintéticas discontinuas, que no sean crudos ni blanqueados
    de la categoría de productos 3 a) (código 40.0034) originarios de Pakistán,
    beneficiario de las preferencias arancelarias previstas por el Reglamento (CEE)
    n° 3925/86 del Consejo
