title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2310/73 of the Commission of 24 August 1973 re-establishing
    Common Customs Tariff duties on standard lamps, table lamps and other lighting
    fittings, of wood, articles of wood for personal use or adornment, etc, falling
    within heading No 44.27, originating in the Philippines, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 2762/72 of 19 December
    1972 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2310/73 de la Commission, du 24 août 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux ouvrages de tabletterie et de petite ébénisterie, objets d' ornement, etc.,
    de la position tarifaire 44.27, originaires des Philippines, bénéficiaires des
    préférences tarifaires prévues par le règlement (CEE) n° 2762/72 du Conseil
    du 19 décembre 1972
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2310/73 der Kommission vom 24. August 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Lampen und andere Beleuchtungskörper
    aus Holz; Innenausstattungsgegenstände aus Holz usw., der Tarifnummer 44.27,
    mit Ursprung in den Philippinen, denen die in der Verordnung (EWG) Nr. 2762/72
    des Rates vom 19. Dezember 1972 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2310/73 af 24. august 1973 om genindførelse
    af tolden ifølge den fælles toldtarif for standerlamper, bordlamper og andet
    belysningsudstyr af træ, artikler af træ til personlig brug eller pynt, osv.,
    under position 44.27, som har oprindelse i Philippinerne og omfattes af de toldpræferencer
    som er fastsat i Rådets forordning (EØF) nr. 2762/72 af 19. december 1972
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2310/73 della Commissione, del 24 agosto 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    lavori da stipettaio e di piccola ebanisteria, oggetti da ornamento ecc., della
    voce doganale n. 44.27, originari delle Filippine, beneficiarie delle preferenze
    tariffarie previste dal regolamento (CEE) n. 2762/72 del Consiglio, del 19 dicembre
    1972
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2310/73 van de Commissie van 24 augustus 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op kleine artikelen van hout, zijnde produkten van de kunstschrijnnijverheid
    en klein meubelmakerswerk etc., van post 44.27, van oorsprong uit de Filippijnen,
    ten behoeve waarvan bij Verordening (EEG) nr. 2762/72 van de Raad van 19 december
    1972 algemene tariefpreferenties werden geopend
  type: main
