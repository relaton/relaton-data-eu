title:
- language: en
  script: Latn
  content: Council Decision (EU) 2022/9 of 2 December 2021 on the position to be taken
    on behalf of the European Union at the 22nd meeting of the Contracting Parties
    to the Convention for the Protection of the Marine Environment and the Coastal
    Region of the Mediterranean (Barcelona Convention) and its Protocols as regards
    the adoption of a decision to amend the Annex to the Protocol for the Prevention
    and Elimination of Pollution of the Mediterranean Sea by Dumping from Ships and
    Aircraft or Incineration at Sea (Dumping Protocol)
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2022/9 du Conseil du 2 décembre 2021 relative à la position
    à prendre, au nom de l’Union européenne, lors de la 22e réunion des parties
    contractantes à la convention sur la protection du milieu marin et du littoral
    de la Méditerranée (convention de Barcelone) et à ses protocoles en ce qui
    concerne l’adoption d’une décision modifiant l’annexe du protocole relatif
    à la prévention et à l’élimination de la pollution de la mer Méditerranée
    par les opérations d’immersion effectuées par les navires et aéronefs ou
    d’incinération en mer (protocole «immersions»)
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2022/9 des Rates vom 2. Dezember 2021 über den Standpunkt,
    der auf der 22. Tagung der Vertragsparteien des Übereinkommens zum Schutz der
    Meeresumwelt und der Küstengebiete des Mittelmeers (Übereinkommen von Barcelona)
    und seiner Protokolle zu dem Erlass eines Beschlusses zur Änderung des Anhangs
    des Protokolls zur Verhütung und Beseitigung der Verschmutzung des Mittelmeers
    durch das Einbringen durch Schiffe und Luftfahrzeuge oder Verbrennung auf See
    (Protokoll über das Einbringen) im Namen der Europäischen Union zu vertreten
    ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2022/9 на Съвета от 2 декември
    2021 година относно позицията, която трябва да
    се заеме от името на Европейския съюз на 22-рата
    среща на договарящите се страни по Конвенцията
    за защита на морската среда и на крайбрежните
    райони в Средиземноморието (Конвенцията от
    Барселона) и протоколите към нея по отношение
    на приемането на решение за изменение на приложението
    към Протокола относно предотвратяване и премахване
    на замърсяването на Средиземно море от изхвърляния
    от кораби и въздухоплавателни средства или
    изгаряне в морето („Протоколът относно изхвърлянията“)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2022/9 ze dne 2. prosince 2021 o postoji, který
    má být zaujat jménem Evropské unie na 22. zasedání smluvních stran Úmluvy
    o ochraně mořského prostředí a pobřežní oblasti Středomoří (Barcelonská
    úmluva) a jejích protokolů, pokud jde o přijetí rozhodnutí o změně přílohy
    Protokolu o ochraně Středozemního moře před znečišťováním způsobeným
    odpady shazovanými z plavidel a letadel nebo spalováním na moři (protokol
    o shazování odpadů)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2022/9 af 2. december 2021 om den holdning, der
    skal indtages på Den Europæiske Unions vegne på det 22. møde mellem de kontraherende
    parter i konventionen om beskyttelse af Middelhavets havmiljø og kystområder
    (Barcelonakonventionen) og protokollerne hertil, til vedtagelsen af en afgørelse
    om ændring af bilaget til protokollen om forebyggelse og eliminering af forurening
    af Middelhavet forårsaget af dumpning fra skibe og luftfartøjer og afbrænding
    til havs (protokollen om dumpning)
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2022/9 του Συμβουλίου της 2ας Δεκεμβρίου
    2021 σχετικά με τη θέση που πρέπει να ληφθεί εξ
    ονόματος της Ευρωπαϊκής Ένωσης κατά την 22η
    σύνοδο των συμβαλλόμενων μερών της σύμβασης
    για την προστασία του θαλάσσιου περιβάλλοντος
    και των παράκτιων περιοχών της Μεσογείου (σύμβαση
    της Βαρκελώνης) και των πρωτοκόλλων της όσον
    αφορά την έκδοση απόφασης για την τροποποίηση
    του παραρτήματος του πρωτοκόλλου για την πρόληψη
    και την εξάλειψη της ρύπανσης της Μεσογείου
    Θαλάσσης από απορρίψεις από πλοία και αεροσκάφη
    ή από αποτέφρωση στη θάλασσα (πρωτόκολλο για
    τις απορρίψεις)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2022/9, 2. detsember 2021, seisukoha kohta, mis võetakse
    Euroopa Liidu nimel Vahemere merekeskkonna ja rannikuala kaitse konventsiooni
    (Barcelona konventsioon) ja selle protokollide osalisriikide 22. istungil vastu
    võetava otsuse suhtes, millega muudetakse laevadest ning õhusõidukitest pärit
    jäätmete kaadamisest või merel põletamisest tuleneva Vahemere reostuse vältimise
    ja likvideerimise protokolli (kaadamist käsitlev protokoll) lisa
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2022/9, annettu 2 päivänä joulukuuta 2021,
    Välimeren merellisen ympäristön ja rannikkoalueiden suojelemista koskevan yleissopimuksen
    (Barcelonan yleissopimus) ja sen pöytäkirjojen sopimuspuolten 22. kokouksessa
    Euroopan unionin puolesta otettavasta kannasta aluksista ja ilma-aluksista tapahtuvan
    jätteen mereen laskemisen tai merellä tapahtuvan jätteen polttamisen aiheuttaman
    Välimeren pilaantumisen ehkäisemisestä ja lopettamisesta tehdyn pöytäkirjan
    (mereen laskemista koskeva pöytäkirja) liitteen muuttamista koskevan päätöksen
    hyväksymiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2022/9 ón gComhairle an 2 Nollaig 2021 maidir leis an seasamh
    atá le glacadh thar ceann an Aontais Eorpaigh ag an 22ú cruinniú de na Páirtithe
    Conarthacha sa Choinbhinsiún maidir le Cosaint Mhuirthimpeallacht agus Réigiún
    Cósta na Meánmhara (Coinbhinsiún Barcelona) gona Phrótacail a mhéid a bhaineann
    le cinneadh a ghlacadh lena leasaítear an Iarscríbhinn a ghabhann leis an bPrótacal
    maidir le Truailliú na Meánmhara trí Dhumpáil ó Longa agus ó Aerárthaí
    nó trí Loscadh ar Muir a Chosc agus a Dhíothú (Prótacal Dumpála)
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2022/9 od 2. prosinca 2021. o stajalištu koje treba
    zauzeti u ime Europske unije na 22. sastanku ugovornih stranaka Konvencije o zaštiti
    morskog okoliša i obalnog područja Sredozemlja (Barcelonska konvencija) i njezinih
    protokola u pogledu donošenja odluke o izmjenama Priloga Protokolu o sprečavanju
    i uklanjanju onečišćenja Sredozemnog mora potapanjem otpadnih i drugih tvari
    s brodova i iz zrakoplova ili spaljivanjem na moru (Protokol o potapanju)
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2022/9 határozata (2021. december 2.) a Földközi-tenger
    tengeri környezetének és partvidékének szennyezés elleni védelméről szóló
    egyezmény (a Barcelonai Egyezmény) és jegyzőkönyvei szerződő feleinek 22.
    ülésén a Földközi-tenger hulladékok hajókról és légi járművekről
    történő kiengedéséből, illetve tengeren történő elégetéséből eredő
    szennyezésének megelőzéséről és kiküszöböléséről szóló jegyzőkönyv
    (a kidobással okozott szennyezés megelőzéséről szóló jegyzőkönyv) mellékletét
    módosító határozat elfogadására tekintettel az Európai Unió nevében képviselendő
    álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2022/9 del Consiglio del 2 dicembre 2021 relativa alla posizione
    da adottare a nome dell’Unione europea alla 22a riunione delle parti contraenti
    della convenzione sulla protezione dell’ambiente marino e del litorale del Mediterraneo
    (convenzione di Barcellona) e dei relativi protocolli in merito all’adozione
    di una decisione volta a modificare l’allegato del protocollo sulla prevenzione
    e sull’eliminazione dell’inquinamento del Mar Mediterraneo dovuto allo scarico
    di rifiuti da parte di navi e di aeromobili o all’incenerimento in mare (protocollo
    Scarichi)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2022/9 (2021. gada 2. decembris) par nostāju, kas
    Eiropas Savienības vārdā jāieņem Konvencijas par Vidusjūras reģiona jūras
    vides un piekrastes aizsardzību (Barselonas konvencija) un tās protokolu Līgumslēdzēju
    pušu 22. sanāksmē attiecībā uz tāda lēmuma pieņemšanu, ar kuru groza
    pielikumu Protokolā par tāda piesārņojuma novēršanu un izskaušanu Vidusjūrā,
    ko rada kuģi un lidaparāti vai sadedzināšana jūrā (DSAI protokols)
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (ES) 2022/9 2021 m. gruodžio 2 d. dėl pozicijos, kurios
    Europos Sąjungos vardu turi būti laikomasi 22-ajame Viduržemio jūros aplinkos
    ir pakrančių zonos apsaugos konvencijos (Barselonos konvencijos) ir jos protokolų
    susitariančiųjų šalių susitikime, dėl sprendimo iš dalies pakeisti Protokolo
    dėl Viduržemio jūros taršos, sukeliamos atliekų, išmetamų iš laivų ir
    orlaivių, ar susidarančios dėl atliekų deginimo jūroje, prevencijos ir šalinimo
    (Protokolo dėl išmetamų atliekų) priedą priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2022/9 tat-2 ta’ Diċembru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fit-22 laqgħa tal-Partijiet
    Kontraenti għall-Konvenzjoni għall-Protezzjoni tal-Ambjent tal-Baħar u tar-Reġjun
    Kostali tal-Mediterran (Konvenzjoni ta’ Barċellona) u l-Protokolli tagħha
    fir-rigward tal-adozzjoni ta’ deċiżjoni li temenda l-Anness tal-Protokoll
    għall-Prevenzjoni u l-Eliminazzjoni tat-Tniġġis tal-Baħar Mediterran bir-Rimi
    tal-Iskart minn Bastimenti u Inġenji tal-Ajru jew l-Inċinerazzjoni fuq il-Baħar
    (Protokoll dwar ir-Rimi tal-Iskart)
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2022/9 van de Raad van 2 december 2021 betreffende het namens
    de Europese Unie in te nemen standpunt tijdens de 22e vergadering van de partijen
    bij het Verdrag inzake de bescherming van het mariene milieu en de kustgebieden
    van de Middellandse Zee (Verdrag van Barcelona) en de bijbehorende protocollen,
    wat betreft de vaststelling van een besluit tot wijziging van de bijlage bij het
    Protocol inzake de voorkoming en beëindiging van verontreiniging van de Middellandse
    Zee door storten vanuit schepen en luchtvaartuigen of door verbranding op zee
    (stortprotocol)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2022/9 z dnia 2 grudnia 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej na 22. posiedzeniu Umawiających
    się Stron Konwencji o ochronie środowiska morskiego i regionu przybrzeżnego
    Morza Śródziemnego („konwencja barcelońska”) i protokołów do niej, w
    odniesieniu do przyjęcia decyzji o zmianie załącznika do Protokołu w sprawie
    zapobiegania zanieczyszczaniu Morza Śródziemnego przez zatapianie odpadów ze
    statków i statków powietrznych lub spalanie na morzu oraz w sprawie usuwania
    skutków takiego zanieczyszczania („protokół w sprawie zatapiania odpadów”)
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/9 do Conselho de 2 de dezembro de 2021 relativa à posição
    a tomar em nome da União Europeia na 22.a reunião das Partes Contratantes na
    Convenção sobre a Proteção do Meio Marinho e do Litoral do Mediterrâneo («Convenção
    de Barcelona») e respetivos protocolos, no que respeita à adoção de uma decisão
    relativa à alteração do anexo do Protocolo relativo à Prevenção e à Eliminação
    da Poluição do Mar Mediterrâneo causada por Operações de Imersão efetuadas
    por Navios e Aeronaves ou pela Incineração no Mar («Protocolo relativo às
    Operações de Imersão»)
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/9 a Consiliului din 2 decembrie 2021 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, la cea de a 22-a
    reuniune a părților contractante la Convenția privind protejarea mediului marin
    și a zonei de coastă a Mării Mediterane (Convenția de la Barcelona) și la
    protocoalele la aceasta, în ceea ce privește adoptarea unei decizii de modificare
    a anexei la Protocolul privind prevenirea și eliminarea poluării Mării Mediterane
    prin operațiunile de descărcare efectuate de nave și aeronave sau de incinerare
    pe mare (Protocolul privind operațiunile de descărcare)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/9 z 2. decembra 2021 o pozícii, ktorá sa
    má v mene Európskej únie zaujať na 22. zasadnutí zmluvných strán Dohovoru
    o ochrane morského prostredia a pobrežných oblastí Stredozemného mora (Barcelonský
    dohovor) a jeho protokolov, pokiaľ ide o prijatie rozhodnutia o zmene prílohy
    k Protokolu na prevenciu a elimináciu znečisťovania Stredozemného mora odpadom
    zhadzovaným z lodí a lietadiel alebo spaľovaným na mori (protokol o zhadzovaní)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/9 z dne 2. decembra 2021 o stališču, ki se v imenu
    Evropske unije zastopa na 22. zasedanju pogodbenic Konvencije za varstvo morskega
    okolja in obalnega območja Sredozemlja (Barcelonska konvencija) in njenih protokolov
    glede sprejetja sklepa o spremembi Priloge k Protokolu za preprečevanje in odpravo
    onesnaževanja Sredozemskega morja zaradi odmetavanja z ladij in zrakoplovov ali
    sežiganja na morju (Protokol o odmetavanju)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/9 del Consejo de 2 de diciembre de 2021 relativa a
    la posición que debe adoptarse en nombre de la Unión Europea en la 22.a reunión
    de las Partes Contratantes en el Convenio para la Protección del Medio Marino
    y de la Región Costera del Mediterráneo (Convenio de Barcelona) y sus Protocolos,
    con respecto a la adopción de una decisión por la que se modificará el anexo
    del Protocolo para la Prevención y Eliminación de la Contaminación del Mar
    Mediterráneo Causada por el Vertido desde Buques y Aeronaves o la Incineración
    en el Mar (Protocolo sobre Vertidos)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/9 av den 2 december 2021 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar vid det 22:a mötet för de fördragsslutande
    parterna i konventionen om skydd av Medelhavets marina miljö och kustregion (Barcelonakonventionen)
    och dess protokoll vad gäller antagandet av ett beslut om ändring av bilagan
    till protokollet om förebyggande och eliminering av förorening av Medelhavet
    vid dumpning från fartyg och flygplan eller förbränning till havs (dumpningsprotokollet)
  type: main
