    di importazione e di esportazione, nonché alla fissazione in via anticipata dei
    prelievi e delle restituzioni per alcune categorie di alimenti composti
  type: main
- language: nl
  script: Latn
  content: Verordening no. 194/64/EEG van de Commissie van 21 december 1964 houdende
