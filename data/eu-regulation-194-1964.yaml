    sowie über die Vorausfestsetzung der Abschöpfungs- und Erstattungsbeträge für
    bestimmte Mischfutterarten
  type: main
- language: it
  script: Latn
  content: Regolamento n. 194/64/CEE della Commissione, del 21 dicembre 1964, relativo
