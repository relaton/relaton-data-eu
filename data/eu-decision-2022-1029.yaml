    normy týkající se základních údajů o malých plavidlech, pohonných soustav
    na zkapalněný ropný plyn pro lodě, jachty a jiná plavidla a stanovení maximálního
    jmenovitého výkonu pohonu na základě manévrovací rychlosti pro plavidla
    o délce trupu mezi 8 a 24 m
  type: main
- language: da
  script: Latn
