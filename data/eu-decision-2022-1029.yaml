    le caighdeáin chomhchuibhithe maidir le príomhshonraí i ndáil le hárthaí
    beaga, córais tiomána gáis peitriliam leachtaithe do bháid, luaimh agus árthaí
    uisce eile, agus cinneadh na huasrátála cumhachta tiomána- agus an luas ionramhála
    á úsáid i ndáil le hárthaí a bhfuil fad a gcabhlach idir 8 m agus 24 m
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1029 od 28. lipnja 2022. o izmjeni
    Provedbene odluke (EU) 2019/919 u pogledu usklađenih normi za osnovne podatke
    za mala plovila, pogonske sustave na UNP za brodove, jahte i ostala plovila i
    određivanje najveće porivne snage pri manevarskoj brzini za plovila duljine
    trupa između 8 m i 24 m
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1029 végrehajtási határozata (2022. június 28.)
    az (EU) 2019/919 végrehajtási határozatnak a kishajók fő adataira, a csónakok,
    jachtok és más vízi járművek LPG-üzemű hajtórendszereire, valamint a 8
    és 24 m közötti hosszúságú kishajók maximális hajtásteljesítményének
    a manőverezési sebesség használatával történő meghatározására vonatkozó
    harmonizált szabványok tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1029 della Commissione del 28 giugno
    2022 che modifica la decisione di esecuzione (UE) 2019/919 per quanto riguarda
    le norme armonizzate relative ai dati principali delle unità di piccole dimensioni,
    i sistemi di propulsione a GPL per imbarcazioni, yacht e altre unità e la determinazione
    della massima potenza di propulsione utilizzando la velocità di manovra per le
    unità con scafo di lunghezza compresa tra 8 m e 24 m
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1029 (2022. gada 28. jūnijs),
    ar ko Īstenošanas lēmumu (ES) 2019/919 groza attiecībā uz saskaņotajiem
    standartiem par mazizmēra kuģu pamatdatiem, sašķidrinātās naftas gāzes
    vilces sistēmām laivām, jahtām un citiem peldlīdzekļiem un maksimālā dzinējspēka
    noteikšanu, izmantojot manevrēšanas ātrumu kuģiem, kuru korpusa garums ir
    no 8 m līdz 24 m
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1029 2022 m. birželio 28
    d. kuriuo dėl darniųjų standartų, taikomų mažųjų laivų pagrindiniams
    duomenims, valčių, jachtų ir kitokių laivų suskystintų naftos dujų varytuvams
    ir laivų, kurių korpuso ilgis nuo 8 m iki 24 m, didžiausios vardinės varomosios
    galios nustatymui naudojant manevravimo greitį, iš dalies keičiamas Įgyvendinimo
    sprendimas (ES) 2019/919
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1029 tat-28
    ta’ Ġunju 2022 li temenda d-Deċiżjoni ta’ Implimentazzjoni (UE) 2019/919
    fir-rigward tal-istandards armonizzati għad-data prinċipali għall-inġenji
    żgħar, is-sistemi ta’ propulsjoni ta’ gass likwifikat miż-żejt għad-dgħajjes,
    jottijiet u inġenji tal-ilma oħra, u d-determinazzjoni tal-klassifikazzjoni
    tal-potenza massima tal-propulsjoni bl-użu tal-veloċità tal-immanuvrar għall-inġenji
    b’tul tal-buq ta’ bejn 8 m u 24 m
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1029 van de Commissie van 28 juni 2022 tot
    wijziging van Uitvoeringsbesluit (EU) 2019/919 wat betreft geharmoniseerde normen
    voor belangrijkste gegevens voor kleine vaartuigen, lpg-voorstuwingssystemen voor
    boten, jachten en andere vaartuigen, en bepaling van het maximale voortstuwingsvermogen
    met behulp van de manoeuvreersnelheid voor vaartuigen met een romplengte tussen
    8 m en 24 m
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1029 z dnia 28 czerwca 2022 r. zmieniająca
    decyzję wykonawczą (UE) 2019/919 w odniesieniu do norm zharmonizowanych dotyczących
    danych podstawowych dla małych statków, układów napędowych LPG do łodzi,
    jachtów i innych jednostek pływających oraz określania maksymalnej mocy znamionowej
    napędu przy prędkości manewrowej dla statków o długości kadłuba pomiędzy
    8 a 24 m
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1029 da Comissão de 28 de junho de 2022
    que altera a Decisão de Execução (UE) 2019/919 no que diz respeito às normas
    harmonizadas relativas às características principais para embarcações pequenas,
    sistemas de propulsão a gás de petróleo liquefeito para embarcações, iates
    e outros navios, e à determinação da potência máxima de propulsão usando
    a velocidade de manobra para embarcações com comprimento do casco entre 8 m
    e 24 m
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1029 a Comisiei din 28 iunie 2022
    de modificare a Deciziei de punere în aplicare (UE) 2019/919 în ceea ce privește
    standardele armonizate pentru datele principale referitoare la navele mici, sistemele
    de propulsie cu gaz petrolier lichefiat pentru nave, iahturi și alte motovehicule
    nautice și determinarea puterii maxime de propulsie utilizând viteza de manevră
    pentru navele cu o lungime a corpului între 8 m și 24 m
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1029 z 28. júna 2022, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/919, pokiaľ ide o harmonizované
    normy týkajúce sa hlavných údajov o malých plavidlách, hnacích systémov
    na skvapalnený ropný plyn pre člny, jachty a iné plavidlá a určenia maximálneho
    pomeru propulzného výkonu a rýchlosti manévrovania pre plavidlá s dĺžkou
    trupu od 8 m do 24 m
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1029 z dne 28. junija 2022 o spremembi
    Izvedbenega sklepa (EU) 2019/919 glede harmoniziranih standardov za osnovne podatke
    za mala plovila, pogonske sisteme na utekočinjeni naftni plin za čolne, jahte
    in druga plovila ter za določitev največje dovoljene moči pogona s hitrostjo
    manevriranja za plovila z dolžino trupa med 8 m in 24 m
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1029 de la Comisión de 28 de junio de
    2022 por la que se modifica la Decisión de Ejecución (UE) 2019/919 en lo que
    respecta a las normas armonizadas relativas a los datos principales de las pequeñas
    embarcaciones, los sistemas de propulsión de gases licuados de petróleo para
    barcos, yates y otras embarcaciones, y la determinación de la potencia máxima
    de propulsión utilizando la velocidad de maniobra para las embarcaciones con
    una eslora comprendida entre 8 m y 24 m
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2022/1029 av den 28 juni 2022 om
