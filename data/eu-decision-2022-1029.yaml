title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1029 of 28 June 2022 amending
    Implementing Decision (EU) 2019/919 as regards harmonised standards for principal
    data for small craft, liquefied petroleum gas propulsion systems for boats, yachts
    and other watercraft, and determination of maximum propulsion power rating using
    manoeuvring speed for craft with a length of hull between 8 m and 24 m
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1029 de la Commission du 28 juin 2022
    modifiant la décision d’exécution (UE) 2019/919 en ce qui concerne les normes
    harmonisées relatives aux données principales pour les petits navires, les systèmes
    de propulsion GPL des bateaux, yachts et autres navires, et la détermination
    de la puissance maximale de propulsion en utilisant la vitesse de manœuvre pour
    les bateaux d’une longueur de coque comprise entre 8 m et 24 m
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1029 der Kommission vom 28. Juni 2022
    zur Änderung des Durchführungsbeschlusses (EU) 2019/919 im Hinblick auf harmonisierte
    Normen für die Hauptdaten für kleine Wasserfahrzeuge, Flüssiggasantriebssysteme
    für Boote, Jachten und andere Wasserfahrzeuge und die Bestimmung der maximalen
    Vortriebsleistung unter Anwendung der Manövriergeschwindigkeit für Wasserfahrzeuge
    mit einer Rumpflänge zwischen 8 m und 24 m
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1029 на Комисията
