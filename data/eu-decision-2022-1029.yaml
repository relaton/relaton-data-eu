  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1029, 28. juuni 2022, millega muudetakse
    rakendusotsust (EL) 2019/919 harmoneeritud standardite osas, mis käsitlevad väikelaevade
    põhiandmeid, veeldatud naftagaasil töötavaid paatide, jahtide ja muude veesõidukite
    jõuseadmeid ning 8–24 m pikkuste veesõidukite maksimaalse koguvõimsuse kindlaksmääramist
    manööverdamiskiiruse põhjal
  type: main
- language: fi
  script: Latn
