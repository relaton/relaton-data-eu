    om ændring af gennemførelsesafgørelse (EU) 2019/919 for så vidt angår harmoniserede
    standarder for hoveddata vedrørende mindre skibe, LPG-fremdrivningssystemer til
    både, yachter og andre fartøjer samt bestemmelse af maksimal fremdrivningseffekt
    ved manøvrefart for fartøjer med en skroglængde mellem 8 m og 24 m
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2022/1029 της Επιτροπής
