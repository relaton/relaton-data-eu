    osin kuin on kyse yhdenmukaistetuista standardeista, jotka koskevat veneiden perustietoja,
    veneiden, laivojen ja muiden alusten nestekaasua käyttäviä propulsiolaitteita
    sekä runkopituudeltaan 8–24 metrin veneiden suurimman propulsiokonetehon määritystä
    liikenopeutta käyttämällä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1029 ón gCoimisiún an 28 Meitheamh
