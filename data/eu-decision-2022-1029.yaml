    стандарти за основните данни за малки плавателни
    съдове, системи за задвижване с втечнен нефтен
    газ за лодки, яхти и други плавателни съдове
    и определяне на максималната задвижваща мощност,
    необходима при скорост за маневриране за плавателни
    средства с дължина на корпуса между 8 m и 24 m
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1029 ze dne 28. června 2022,
