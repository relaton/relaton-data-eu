title:
- language: fr
  script: Latn
  content: Décision 64/289/CEE de la Commission, du 6 mai 1964, autorisant le Royaume
    de Belgique, le Grand-Duché de Luxembourg, la République fédérale d'Allemagne
    et la République française à percevoir un montant compensatoire à l'importation
    de certains catégories d'aliments pour animaux contenant du lait
  type: main
- language: de
  script: Latn
  content: '64/289/EWG: Entscheidung der Kommission vom 6. Mai 1964, mit der dem Königreich
    Belgien, dem Großherzogtum Luxemburg, der Bundesrepublik Deutschland und der
    Französischen Republik die Genehmigung erteilt wird, bei der Einfuhr bestimmter
    Milch enthaltender Futtermittelarten einen Ausgleichsbetrag zu erheben'
  type: main
- language: it
  script: Latn
  content: '64/289/CEE: Decisione della Commissione, del 6 maggio 1964, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo, la Repubblica federale di
    Germania e la Repubblica francese a riscuotere un ammontare compensativo all''importazione
    di alcune categorie di alimenti per animali, contenenti latte'
  type: main
- language: nl
  script: Latn
  content: '64/289/EEG: Beschikking van de Commissie van 6 mei 1964 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg, de Bondsrepubliek Duitsland
    en de Franse Republiek een compenserend bedrag te heffen op de invoer van sommige
    soorten melk bevattende veevoeder'
  type: main
