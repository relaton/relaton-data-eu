title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/490 of 25 March 2022 amending
    Implementing Regulation (EU) 2018/2019 as regards certain plants for planting
    of Juglans regia L., Nerium oleander L. and Robinia pseudoacacia L. originating
    in Turkey, and amending Implementing Regulation (EU) 2020/1213 as regards the
    phytosanitary measures for the introduction of those plants for planting into
    the Union territory
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/490 de la Commission du 25 mars 2022
    modifiant le règlement d’exécution (UE) 2018/2019 en ce qui concerne certains
    végétaux destinés à la plantation des espèces Juglans regia L., Nerium oleander
    L. et Robinia pseudoacacia L. originaires de Turquie, et modifiant le règlement
    d’exécution (UE) 2020/1213 en ce qui concerne les mesures phytosanitaires applicables
    à l’introduction de ces végétaux destinés à la plantation sur le territoire
    de l’Union
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/490 der Kommission vom 25. März 2022
    zur Änderung der Durchführungsverordnung (EU) 2018/2019 in Bezug auf bestimmte
    zum Anpflanzen bestimmte Pflanzen der Arten Juglans regia L., Nerium oleander
    L. und Robinia pseudoacacia L. mit Ursprung in der Türkei und zur Änderung der
    Durchführungsverordnung (EU) 2020/1213 in Bezug auf die pflanzenschutzrechtlichen
    Maßnahmen für das Einführen dieser zum Anpflanzen bestimmten Pflanzen in das
    Gebiet der Union
  type: main
- language: bg
  script: Cyrl
