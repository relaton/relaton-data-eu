    Juglans regia L., Nerium oleander L. ja Robinia pseudoacacia L. kuuluvate istutamiseks
    ettenähtud taimedega ning rakendusmäärust (EL) 2020/1213 seoses kõnealuste
    istutamiseks ettenähtud taimede liidu territooriumile sissetoomisel kehtivate
    fütosanitaarmeetmetega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/490, annettu 25 päivänä
    maaliskuuta 2022, asetuksen (EU) 2018/2019 muuttamisesta tiettyjen Turkista peräisin
    olevien istutettaviksi tarkoitettujen Juglans regia L.-, Nerium oleander L.- ja
    Robinia pseudoacacia L. -kasvien osalta ja täytäntöönpanoasetuksen (EU) 2020/1213
    muuttamisesta siltä osin kuin on kyse kyseisten istutettaviksi tarkoitettujen
    kasvien tuomista unionin alueelle koskevista kasvinsuojelutoimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/490 ón gCoimisiún an 25 Márta
    2022 lena leasaítear Rialachán Cur Chun Feidhme (AE) 2018/2019 a mhéid a bhaineann
    le plandaí áirithe atá le cur de Juglans regia L., Nerium oleander L. agus
    Robinia pseudoacacia L. de thionscnamh na Tuirce agus lena leasaítear Rialachán
    Cur Chun Feidhme (AE) 2020/1213 a mhéid a bhaineann leis na bearta fíteashláintíochta
    chun na plandaí sin atá le cur a thabhairt isteach i gcríoch an Aontais
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/490 оd 25. ožujka 2022. o izmjeni
    Provedbene uredbe (EU) 2018/2019 u pogledu određenog bilja za sadnju vrsta Juglans
    regia L., Nerium oleander L. i Robinia pseudoacacia L. podrijetlom iz Turske te
    o izmjeni Provedbene uredbe (EU) 2020/1213 u pogledu fitosanitarnih mjera za unos
    tog bilja za sadnju na područje Unije
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/490 végrehajtási rendelete (2022. március 25.)
    az (EU) 2018/2019 végrehajtási rendeletnek a Juglans regia L., a Nerium oleander
    L. és a Robinia pseudoacacia L. egyes Törökországból származó, ültetésre
    szánt növényei, valamint az (EU) 2020/1213 végrehajtási rendeletnek az említett,
    ültetésre szánt növények Unióba való behozatalára vonatkozó növényegészségügyi
    intézkedések tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/490 della Commissione del 25 marzo
    2022 che modifica il regolamento di esecuzione (UE) 2018/2019 per quanto riguarda
    alcune piante da impianto di Juglans regia L., Nerium oleander L. e Robinia pseudoacacia
    L., originarie della Turchia, e il regolamento di esecuzione (UE) 2020/1213 per
    quanto riguarda le misure fitosanitarie per l'introduzione di tali piante da impianto
    nel territorio dell'Unione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/490 (2022. gada 25. marts), ar
    ko attiecībā uz dažiem stādāmiem Turcijas izcelsmes Juglans regia L., Nerium
    oleander L. un Robinia pseudoacacia L. augiem groza Īstenošanas regulu (ES)
    2018/2019 un attiecībā uz fitosanitārajiem pasākumiem, kurus piemēro minēto
    stādāmo augu ievešanai Savienības teritorijā, groza Īstenošanas regulu
    (ES) 2020/1213
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/490 2022 m. kovo 25 d. kuriuo
    dėl tam tikrų Turkijos kilmės sodinti skirtų Juglans regia L., Nerium oleander
    L. ir Robinia pseudoacacia L. augalų iš dalies keičiamas Reglamentas (ES) 2018/2019
    ir dėl fitosanitarinių priemonių, taikomų tiems į Sąjungos teritoriją įvežamiems
    sodinti skirtiems augalams, iš dalies keičiamas Įgyvendinimo reglamentas (ES)
    2020/1213
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/490 tal-25
    ta’ Marzu 2022 li jemenda r-Regolament ta’ Implimentazzjoni (UE) 2018/2019
    fir-rigward ta’ ċerti pjanti għat-tħawwil tal-Juglans regia L., tan-Nerium
    oleander L. u tar-Robinia pseudoacacia L. li joriġinaw fit-Turkija, u li jemenda
    r-Regolament ta’ Implimentazzjoni (UE) 2020/1213 fir-rigward tal-miżuri fitosanitarji
    għall-introduzzjoni ta’ dawk il-pjanti għat-tħawwil fit-territorju tal-Unjoni
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/490 van de Commissie van 25 maart 2022
    tot wijziging van Uitvoeringsverordening (EU) 2018/2019 wat betreft bepaalde uit
    Turkije afkomstige voor opplant bestemde planten van de soorten Juglans regia
    L., Nerium oleander L. en Robinia pseudoacacia L. en tot wijziging van Uitvoeringsverordening
    (EU) 2020/1213 wat betreft de fytosanitaire maatregelen voor het binnenbrengen
    van die voor opplant bestemde planten op het grondgebied van de Unie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/490 z dnia 25 marca 2022 r.
    zmieniające rozporządzenie wykonawcze (UE) 2018/2019 w odniesieniu do niektórych
    roślin przeznaczonych do sadzenia gatunków Juglans regia L., Nerium oleander
    L. i Robinia pseudoacacia L. pochodzących z Turcji i zmieniające rozporządzenie
    wykonawcze (UE) 2020/1213 w odniesieniu do środków fitosanitarnych do celów
    wprowadzania tych roślin przeznaczonych do sadzenia na terytorium Unii
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/490 da Comissão de 25 de março de
    2022 que altera o Regulamento de Execução (UE) 2018/2019 no que diz respeito
    a certos vegetais para plantação de Juglans regia L., Nerium oleander L. e Robinia
    pseudoacacia L. originários da Turquia e que altera o Regulamento de Execução
    (UE) 2020/1213 no que se refere às medidas fitossanitárias para a introdução
    desses vegetais para plantação no território da União
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/490 al Comisiei din 25 martie
    2022 de modificare a Regulamentului de punere în aplicare (UE) 2018/2019 în
    ceea ce privește anumite plante aparținând speciilor Juglans regia L., Nerium
    oleander L. și Robinia pseudoacacia L. destinate plantării, originare din Turcia,
    și de modificare a Regulamentului de punere în aplicare (UE) 2020/1213 în ceea
    ce privește măsurile fitosanitare pentru introducerea acestor plante destinate
    plantării pe teritoriul Uniunii
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/490 z 25. marca 2022, ktorým
    sa mení vykonávacie nariadenie (EÚ) 2018/2019, pokiaľ ide o určité rastliny
    určené na výsadbu druhov Juglans regia L., Nerium oleander L. a Robinia pseudoacacia
    L. pochádzajúce z Turecka, a ktorým sa mení vykonávacie nariadenie (EÚ)
    2020/1213, pokiaľ ide o rastlinolekárske opatrenia v súvislosti so vstupom
    uvedených rastlín určených na výsadbu na územie Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/490 z dne 25. marca 2022 o spremembi
    Izvedbene uredbe (EU) 2018/2019 glede nekaterih rastlin za saditev Juglans regia
    L., Nerium oleander L. in Robinia pseudoacacia L. s poreklom iz Turčije ter spremembi
    Izvedbene uredbe (EU) 2020/1213 glede fitosanitarnih ukrepov za vnos navedenih
    rastlin za saditev na ozemlje Unije
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/490 de la Comisión de 25 de marzo de
    2022 por el que se modifican el Reglamento de Ejecución (UE) 2018/2019 en lo
    que respecta a determinados vegetales para plantación de Juglans regia L., Nerium
    oleander L. y Robinia pseudoacacia L. originarios de Turquía y el Reglamento
    de Ejecución (UE) 2020/1213 en lo que respecta a las medidas fitosanitarias para
    la introducción de dichos vegetales para plantación en el territorio de la Unión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/490 av den den 25 mars
    2022 om ändring av genomförandeförordning (EU) 2018/2019 vad gäller vissa
    växter för plantering av Juglans regia L., Nerium oleander L. och Robinia pseudoacacia
    L. med ursprung i Turkiet, och om ändring av genomförandeförordning (EU) 2020/1213
    vad gäller växtskyddsåtgärder för införsel av dessa växter för plantering
    till unionens territorium
