    planter til plantning af Juglans regia L., Nerium oleander L. og Robinia pseudoacacia
    L med oprindelse i Tyrkiet og om ændring af gennemførelsesforordning (EU) 2020/1213
    for så vidt angår de plantesundhedsmæssige foranstaltninger for indførsel
    til Unionen af disse planter til plantning
  type: main
