    от 25 март 2022 година за изменение на Регламент
    за изпълнение (ЕС) 2018/2019 по отношение на някои
    растения за засаждане от видовете Juglans regia L.,
    Nerium oleander L. и Robinia pseudoacacia L. с произход от Турция
    и за изменение на Регламент за изпълнение (ЕС)
    2020/1213 по отношение на фитосанитарните мерки
    за въвеждането на тези растения за засаждане
    на територията на Съюза
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/490 ze dne 25. března 2022,
    kterým se mění prováděcí nařízení (EU) 2018/2019, pokud jde o některé
    rostliny Juglans regia L., Nerium oleander L. a Robinia pseudoacacia L. k pěstování
    pocházející z Turecka, a kterým se mění prováděcí nařízení (EU) 2020/1213,
    pokud jde o fytosanitární opatření pro dovoz uvedených rostlin k pěstování
    na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/490 af 25. marts 2022
