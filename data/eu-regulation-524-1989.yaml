    licitation med henblik på videresalg af hård hvede, som det italienske interventionsorgan
    ligger inde med
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 524/89 της Επιτροπής
    της 28ης Φεβρουαρίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 3662/88 και ορίζει σε 250 000 τόνους τη
    διαρκή δημοπρασία για τη μεταπώληση μαλακού
    σίτου που έχει στη διάθεσή του ο ιταλικός οργανισμός
    παρεμβάσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 524/89 della Commissione, del 28 febbraio 1989, che
    modifica il regolamento (CEE) n. 3662/88 e che porta a 250 000 t il quantitativo
    globale oggetto della gara permanente per la vendita di frumento duro detenuto
    dall'organismo d'intervento italiano
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 524/89 van de Commissie van 28 februari 1989 tot
