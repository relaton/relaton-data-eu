title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 524/89 of 28 February 1989 amending Regulation
    (EEC) No 3662/88 and increasing to 250 000 tonnes the amount of durum wheat held
    by the Italian intervention agency for which a standing invitation to tender for
    resale has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 524/89 de la Commission, du 28 février 1989, modifiant
    le règlement (CEE) n 3662/88 et portant à 250 000 tonnes l'adjudication permanente
    pour la revente de froment dur détenu par l'organisme d'intervention italien
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 524/89 der Kommission vom 28. Februar 1989 zur Änderung
    der Verordnung (EWG) Nr. 3662/88 und zur Erweiterung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt auf 250 000 Tonnen Hartweizen aus Beständen
    der italienischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 524/89 af 28. februar 1989 om ændring
