    και Σλοβακική Ομοσπονδιακή Δημοκρατία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3016/92 della Commissione, del 20 ottobre 1992, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'
    importazione presentate nel mese di ottobre 1992 per le carni bovine fresche,
    refrigerate o congelate nel quadro dei regimi di importazione previsti dagli accordi
    interinali conclusi tra la Comunità e la Repubblica di Polonia, la Repubblica
    di Ungheria e la Repubblica federativa ceca e slovacca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3016/92 van de Commissie van 20 oktober 1992 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor vers, gekoeld of bevroren rundvlees, die in oktober 1992
    zijn ingediend op grond van de invoerregelingen die zijn vastgesteld in de door
