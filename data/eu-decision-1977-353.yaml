title:
- language: en
  script: Latn
  content: Commission Decision of 4 May 1977 amending the Commission Decision of 23
    March 1977 authorizing Ireland to take protective measures in respect of certain
    processed agricultural products under Article 135 of the Act concerning the conditions
    of Accession and the Adjustments to the Treaties
  type: main
- language: fr
  script: Latn
  content: '77/353/CEE: Décision de la Commission, du 4 mai 1977, modifiant la décision
    de la Commission, du 23 mars 1977, autorisant l''Irlande à adopter des mesures
    de sauvegarde pour certains produits agricoles transformés au titre de l''article
    135 de l''Acte relatif aux conditions d''adhésion et aux adaptations des Traités'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. Mai 1977 zur Änderung der Entscheidung
    der Kommission vom 23. März 1977, mit der Irland ermächtigt wird, für einige
    landwirtschaftliche Verarbeitungserzeugnisse Schutzmaßnahmen gemäß Artikel
    135 der Akte über die Beitrittsbedingungen und die Anpassungen der Verträge
    zu treffen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. maj 1977 om ændring af Kommissionens beslutning
    af 23. marts 1977 om bemyndigelse til Irland til at træffe beskyttelsesforanstaltninger
    for visse forædlede landbrugsprodukters vedkommende i medfør af artikel 135
    i akten vedrørende tiltrædelsesvilkårene og tilpasningerne af traktaterne
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 maggio 1977, che modifica la decisione
    della Commissione, del 23 marzo 1977, che autorizza l'Irlanda ad attuare misure
    di salvaguardia per taluni prodotti agricoli trasformati a norma dell'articolo
    135 dell'atto relativo alle condizioni di adesione e agli adattamenti dei trattati
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 mei 1977 tot wijziging van de beschikking
    van de Commissie van 23 maart 1977 waarbij Ierland wordt gemachtigd voor bepaalde
    verwerkte landbouwprodukten vrijwaringsmaatregelen te nemen op grond van artikel
    135 van de Akte betreffende de toetredingsvoorwaarden en de aanpassing der Verdragen
  type: main
