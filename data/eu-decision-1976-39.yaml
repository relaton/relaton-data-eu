id: EUDecision197639
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 4 November 1975 authorizing the Kingdom of Belgium,
    the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not to apply
    Community treatment to imports of toilet linen and kitchen linen of cotton falling
    within subheading 62.02 ex B, originating in the People's Republic of China and
    in free circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '76/39/CEE: Décision de la Commission, du 4 novembre 1975, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les importations de linge de toilette,
    d''office ou de cuisine en coton de la sous- position Ex 62.02 B du Tarif douanier
    commun, originaires de la République populaire de Chine et mises en libre pratique
    en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 4. November 1975, mit der das Königreich
    Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande ermächtigt
    werden, aus der Volksrepublik China stammende und in der Bundesrepublik Deutschland
    im freien Verkehr befindliche Wäsche zur Körperpflege und andere Haushaltswäsche,
    aus Baumwolle, der Tarifnummer 62.02 ex B des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 4. november 1975 om bemyndigelse af kongeriget
    Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene til fra fællesskabsbehandling
    at undtage indførsel af håndklæder, vaskeklude og viskestykker af bomuld, som
    henhører under pos. 62.02 ex B i den fælles toldtarif, har oprindelse i folkerepublikken
    Kina og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 4 novembre 1975, che autorizza il Regno
    del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi ad escludere
    dal trattamento comunitario le importazioni di biancheria da toletta, da servizio
    e da cucina, in cotone, della sottovoce 62.02 ex B della tariffa doganale comune,
    originarie della Repubblica popolare cinese e messe in libera pratica nella Repubblica
    federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 4 november 1975 waarbij het Koninkrijk
    België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden worden
    gemachtigd huishoudlinnen van katoen van post 62.02 ex B van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de Bondsrepubliek
    Duitsland in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten
  type: main
