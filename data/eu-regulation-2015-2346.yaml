  script: Latn
  content: Commission Implementing Regulation (EU) 2015/2346 of 15 December 2015 initiating
    an investigation concerning the possible circumvention of anti-dumping measures
    imposed by Council Implementing Regulation (EU) No 1008/2011, as amended by Council
    Implementing Regulation (EU) No 372/2013, on imports of hand pallet trucks and
    their essential parts originating in the People's Republic of China by imports
    of slightly modified hand pallet trucks originating in the People's Republic of
    China, and making such imports subject to registration
  type: main
- language: fr
