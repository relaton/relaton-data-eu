    til Det forenede Kongerige af sække og poser af vævede polyolefinstoffer med
    oprindelse i republikken Korea
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 551/77 del Consiglio, del 14 marzo 1977, che modifica
    il regolamento (CEE) n. 1631/76, il quale mantiene in vigore il regime che assoggetta
    ad autorizzazione le importazioni nel Regno Unito di sacchi e borse di tessuto
    di poliolefine, originari della Repubblica di Corea
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 551/77 van de Raad van 14 maart 1977 tot wijziging
