title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 551/77 of 14 March 1977 amending Regulation
    (EEC) No 1631/76 maintaining in effect the rules whereby imports into the United
    Kingdom of sacks and bags of woven polyolefin fabrics originating in the Republic
    of Korea are subject to import authorizations
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 551/77 du Conseil, du 14 mars 1977, modifiant le règlement
    (CEE) n° 1631/76 portant maintien du régime d'autorisation d'importation au
    Royaume-Uni de sacs et sachets en tissus de polyoléfine originaires de la République
    de Corée
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 551/77 des Rates vom 14. März 1977 zur Änderung
    der Verordnung (EWG) Nr. 1631/76 zur Verlängerung der Genehmigungspflicht für
    die Einfuhr in das Vereinigte Königreich von Säcken und Beuteln aus Polyolefin-Geweben
    mit Ursprung in der Republik Korea
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 551/77 af 14. marts 1977 om ændring af forordning
