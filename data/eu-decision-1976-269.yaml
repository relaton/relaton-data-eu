title:
- language: en
  script: Latn
  content: Commission Decision of 20 February 1976 specifying the extent to which
    applications for import licences lodged in February 1976 for young bovine animals
    of highland breeds for fattening can be accepted
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 20 février 1976, déterminant dans quelle
    mesure il peut être donné suite aux demandes de délivrance de certificats d'importation
    déposées au mois de février 1976 pour les jeunes bovins de races alpines destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Februar 1976 darüber, inwieweit den
    im Februar 1976 gestellten Anträgen auf Einfuhrlizenzen für Mastjungrinder der
    Alpenrassen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 20. februar 1976 om det omfang, hvori ansøgninger
    om udstedelse af importlicenser, som er indgivet i februar 1976 for ungkvæg af
    alpine racer bestemt til opfedning, kan imødekommes
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 20 febbraio 1976, che determina in quale
    misura può essere dato seguito alle domande di titoli d'importazione, presentate
    nel mese di febbraio 1976, per i giovani bovini di razze alpine destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 20 februari 1976 tot vaststelling van
    de mate waarin de in februari 1976 ingediende aanvragen om afgifte van invoercertificaten
    voor jonge mestrunderen van alpenrassen kunnen worden ingewilligd
  type: main
