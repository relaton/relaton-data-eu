    κτηνιατρικών πιστοποιητικών BOV-X και BOV-Y και
    τις καταχωρίσεις για το Ισραήλ, τη Νέα Ζηλανδία
    και την Παραγουάη στους καταλόγους τρίτων
    χωρών, περιοχών ή τμημάτων τους από τα οποία
