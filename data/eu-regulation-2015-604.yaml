  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2015/604, 16. aprill 2015 , millega muudetakse
    määruse (EL) nr 206/2010 I ja II lisa seoses veterinaarsertifikaatide näidistes
    BOV-X ja BOV-Y veiste tuberkuloosi suhtes kehtivate loomatervishoiu nõuetega
    ning seoses Iisraeli, Uus-Meremaa ja Paraguay kohta tehtud kannetega loeteludes,
    kus on esitatud need kolmandad riigid, nende territooriumid ja osad, kust on lubatud
    liitu tuua elusloomi ja värsket liha
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2015/604, annettu 16 päivänä
    huhtikuuta 2015 , asetuksen (EU) N:o 206/2010 liitteiden I ja II muuttamisesta
    siltä osin kuin on kyse eläinten terveyttä koskevista vaatimuksista nautatuberkuloosin
    osalta eläinlääkärintodistusten malleissa BOV-X ja BOV-Y sekä Israelia, Uutta-Seelantia
    ja Paraguayta koskevista kohdista luetteloissa kolmansista maista ja alueista
    tai niiden osista, joista elävien eläinten ja tuoreen lihan tuonti unioniin
    on sallittua
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2015/604 оd 16. travnja 2015. o izmjeni
    priloga I. i II. Uredbi (EU) br. 206/2010 u pogledu uvjeta zdravlja životinja
    za tuberkulozu goveda u obrascima veterinarskih certifikata BOV-X i BOV-Y i unosima
    za Izrael, Novi Zeland i Paragvaj na popisu trećih zemalja, državnih područja
    ili njihovih dijelova odobrenih za unos živih životinja i svježeg mesa u Uniju
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/604 végrehajtási rendelete ( 2015. április 16.
    ) a 206/2010/EU rendelet I. és II. mellékletének a BOV-X és BOV-Y állat-egészségügyi
    bizonyítványmintákban a szarvasmarha-tuberkulózisra előírt állat-egészségügyi
    követelmények, valamint az elő állatoknak és a friss húsnak az Európai
    Unióba való behozatalára engedéllyel rendelkező harmadik országok, területeik
    és részeik jegyzékének Izraelre, Paraguayra és Új-Zélandra vonatkozó bejegyzései
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2015/604 della Commissione, del 16 aprile
    2015 , che modifica gli allegati I e II del regolamento (UE) n. 206/2010 per quanto
    riguarda le condizioni di polizia sanitaria per la tubercolosi bovina nei modelli
    di certificati veterinari BOV-X e BOV-Y e le voci relative a Israele, Nuova Zelanda
    e Paraguay negli elenchi di paesi terzi, territori o loro parti autorizzati a
    introdurre nell'Unione europea animali vivi e carni fresche
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2015/604 ( 2015. gada 16. aprīlis
    ), ar ko Regulas (ES) Nr. 206/2010 I un II pielikumu groza attiecībā uz veterināro
    sertifikātu paraugos “BOV-X” un “BOV-Y” noteiktajām dzīvnieku veselības
    prasībām attiecībā uz govju tuberkulozi un ierakstiem par Izraēlu, Jaunzēlandi
    un Paragvaju to trešo valstu, to teritoriju vai daļu sarakstos, no kurām Savienībā
    atļauts ievest dzīvus dzīvniekus un svaigu gaļu
  type: main
- language: lt
  script: Latn
  content: 2015 m. balandžio 16 d. Komisijos įgyvendinimo reglamentas (ES) 2015/604,
    kuriuo dėl veterinarijos sertifikatų pavyzdžiuose BOV-X ir BOV-Y nustatytų
    gyvūnų sveikatos reikalavimų, susijusių su galvijų tuberkulioze, ir dėl
    Izraelio, Naujosios Zelandijos ir Paragvajaus įrašų trečiųjų šalių, teritorijų
    arba jų dalių, iš kurių į Sąjungą leidžiama įvežti gyvus gyvūnus ir
    šviežią mėsą, sąrašuose iš dalies keičiami Reglamento (ES) Nr. 206/2010
    I ir II priedai
  type: main
- language: mt
  script: Latn
  content: Regolament ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/604 tas- 16 ta'
    April 2015 li jemenda l-Annessi I u II tar-Regolament (UE) Nru 206/2010 fir-rigward
    tar-rekwiżiti tas-saħħa tal-annimali għat-tuberkolożi bovina fil-mudelli
    taċ-ċertifikati veterinarji BOV-X u BOV-Y u l-entrati għal Iżrael, New Zealand
    u l-Paragwaj fil-lista ta' pajjiżi terzi, territorji jew partijiet tagħhom li
    minnhom hija awtorizzata l-introduzzjoni fl-Unjoni ta' annimali ħajjin u laħam
    frisk
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2015/604 van de Commissie van 16 april 2015
    tot wijziging van de bijlagen I en II bij Verordening (EU) nr. 206/2010 wat betreft
    de veterinairrechtelijke voorschriften voor rundertuberculose in de modellen van
    de veterinaire certificaten BOV-X en BOV-Y en de gegevens voor Israël, Nieuw-Zeeland
    en Paraguay in de lijst van derde landen en gebieden, of delen daarvan, waaruit
    het binnenbrengen in de Europese Unie van levende dieren en vers vlees wordt toegestaan
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2015/604 z dnia 16 kwietnia 2015
    r. zmieniające załączniki I i II do rozporządzenia (UE) nr 206/2010 w odniesieniu
    do warunków dotyczących zdrowia zwierząt odnoszących się do gruźlicy bydła
    we wzorach świadectw weterynaryjnych BOV-X i BOV-Y oraz w odniesieniu do wpisów
    dotyczących Izraela, Nowej Zelandii i Paragwaju w wykazach krajów trzecich,
    ich terytoriów lub części, upoważnionych do wprowadzania do Unii żywych zwierząt
    lub świeżego mięsa
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2015/604 da Comissão, de 16 de abril de
    2015 , que altera os anexos I e II do Regulamento (UE) n. ° 206/2010 no que diz
    respeito aos requisitos de saúde animal em matéria de tuberculose bovina incluídos
    nos modelos de certificados veterinários BOV-X e BOV-Y e às entradas relativas
    a Israel, à Nova Zelândia e ao Paraguai nas listas de países terceiros, territórios
    ou partes destes a partir dos quais é autorizada a introdução na União de
    animais vivos e carne fresca
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2015/604 al Comisiei din 16 aprilie
    2015 de modificare a anexelor I și II la Regulamentul (UE) nr. 206/2010 în ceea
    ce privește cerințele de sănătate animală pentru tuberculoza bovină în
    modelele de certificate sanitar-veterinare BOV-X și BOV-Y și rubricile referitoare
    la Israel, Noua Zeelandă și Paraguay din lista țărilor terțe, a teritoriilor
    sau a părților acestora din care este autorizată introducerea în Uniune de
    animale vii și de carne proaspătă
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2015/604 zo 16. apríla 2015 , ktorým
    sa menia prílohy I a II k nariadeniu (EÚ) č. 206/2010, pokiaľ ide o požiadavky
    na zdravie zvierat týkajúce sa tuberkulózy hovädzieho dobytka vo vzoroch veterinárnych
    osvedčení BOV-X a BOV-Y a položky týkajúce sa Izraela, Nového Zélandu a
    Paraguaja v zozname tretích krajín, území alebo ich častí, z ktorých sa
    povoľuje vstup živých zvierat a čerstvého mäsa do Únie
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2015/604 z dne 16. aprila 2015 o spremembi
    prilog I in II k Uredbi (EU) št. 206/2010 glede pogojev v zvezi z zdravjem živali
    za govejo tuberkulozo v vzorcih veterinarskih spričeval BOV-X in BOV-Y ter glede
    vnosov za Izrael, Novo Zelandijo in Paragvaj na seznamih tretjih držav, njihovih
    ozemelj ali delov, iz katerih je dovoljen vnos živih živali in svežega mesa
    v Unijo
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2015/604 de la Comisión, de 16 de abril
    de 2015 , que modifica los anexos I y II del Reglamento (UE) n ° 206/2010 por
    lo que respecta a los requisitos zoosanitarios relativos a la tuberculosis bovina
    contenidos en los modelos de los certificados veterinarios BOV-X y BOV-Y y a las
    entradas correspondientes a Israel, Nueva Zelanda y Paraguay de las listas de
    terceros países, territorios o partes de terceros países o territorios desde
    los que está autorizada la introducción en la Unión de animales vivos y carne
    fresca
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2015/604 av den 16 april 2015
    om ändring av bilagorna I och II till förordning (EU) nr 206/2010 vad gäller
    djurhälsokrav avseende bovin tuberkulos i förlagorna till veterinärintygen
    BOV-X och BOV-Y samt uppgifterna om Israel, Nya Zeeland och Paraguay i förteckningarna
    över tredjeländer, områden eller delar därav från vilka det är tillåtet
    att föra in levande djur och färskt kött till unionen
