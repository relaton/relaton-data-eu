type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2015/604 of 16 April 2015 amending
    Annexes I and II to Regulation (EU) No 206/2010 as regards animal health requirements
    for bovine tuberculosis in the models of veterinary certificates BOV-X and BOV-Y
    and the entries for Israel, New Zealand and Paraguay in the lists of third countries,
    territories or parts thereof from which the introduction into the Union of live
    animals and fresh meat is authorised
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2015/604 de la Commission du 16 avril 2015
    modifiant les annexes I et II du règlement (UE) n ° 206/2010 en ce qui concerne
    les exigences de police sanitaire relatives à la tuberculose bovine dans les
    modèles de certificats vétérinaires BOV-X et BOV-Y, ainsi que les mentions
    relatives à Israël, à la Nouvelle-Zélande et au Paraguay dans les listes des
    pays tiers, territoires ou parties de pays tiers ou territoires en provenance
    desquels l'introduction dans l'Union européenne de certains animaux et viandes
    fraîches est autorisée
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2015/604 der Kommission vom 16. April 2015
    zur Änderung der Anhänge I und II der Verordnung (EU) Nr. 206/2010 hinsichtlich
    der tierseuchenrechtlichen Vorschriften für Rindertuberkulose in den Mustern
    der Veterinärbescheinigungen BOV-X und BOV-Y und der Einträge für Israel, Neuseeland
    und Paraguay in den Listen der Drittländer, Gebiete oder Teile davon, aus denen
    die Einfuhr von lebenden Tieren und frischen Fleisch in die Union zulässig ist
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2015/604 на Комисията
    от 16 април 2015 година за изменение на приложения
    I и II към Регламент (ЕС) № 206/2010 по отношение
    на ветеринарно-санитарните изисквания за туберкулоза
    по говедата в образците на ветеринарни сертификати
    BOV-X и BOV-Y и вписванията за Израел, Нова Зеландия
    и Парагвай в списъците на трети страни, територии
    или части от тях, от които е разрешено въвеждането
    в Съюза на живи животни и прясно месо
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2015/604 ze dne 16. dubna 2015 , kterým
    se mění přílohy I a II nařízení (EU) č. 206/2010, pokud jde o veterinární
    požadavky týkající se tuberkulózy skotu ve vzorech veterinárních osvědčení
    BOV-X a BOV-Y a o položky pro Izrael, Nový Zéland a Paraguay v seznamech třetích
    zemí, území nebo jejich částí, z nichž je povolen vstup živých zvířat
    a čerstvého masa na území Unie
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2015/604 af 16. april 2015
    om ændring af bilag I og II til forordning (EU) nr. 206/2010 for så vidt angår
    dyresundhedsmæssige krav vedrørende kvægtuberkulose i standardveterinærcertifikaterne
    BOV-X og BOV-Y og af oplysningerne om Israel, New Zealand og Paraguay på listerne
    over tredjelande, tredjelandsområder og dele heraf, hvorfra indførsel til Unionen
    af levende dyr og fersk kød er tilladt
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2015/604 της Επιτροπής,
    της 16ης Απριλίου 2015 , για την τροποποίηση των
