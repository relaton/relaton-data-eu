    sur les dépenses effectuées pendant l''année 1975 pour les aides et primes
    relatives à la modernisation des exploitations agricoles'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 8. Oktober 1976 über die Zahlung eines
