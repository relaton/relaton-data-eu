    das Königreich Dänemark
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 8. oktober 1976 om udbetaling gennem EUGFL,
    udviklingssektionen, til kongeriget Danmark af et a contobeløb for de udgifter,
