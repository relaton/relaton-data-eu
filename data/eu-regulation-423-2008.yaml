title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 423/2008 of 8 May 2008 on laying down certain
    detailed rules for implementing Council Regulation (EC) No 1493/1999 and establishing
    a Community code of oenological practices and processes (Codified version)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 423/2008 de la Commission du 8 mai 2008 fixant certaines
    modalités d'application du règlement (CE) n o 1493/1999 du Conseil et instituant
    un code communautaire des pratiques et traitements œnologiques (version codifiée)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 423/2008 der Kommission vom 8. Mai 2008 mit Durchführungsbestimmungen
    zur Verordnung (EG) Nr. 1493/1999 des Rates und zur Einführung eines Gemeinschaftskodex
    der önologischen Verfahren und Behandlungen (kodifizierte Fassung)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 423/2008 на Комисията от 8 май
    2008 година относно определяне на някои подробни
    правила за прилагане на Регламент (ЕО) № 1493/1999
    на Съвета и установяване на кодекс на Общността
    на енологичните практики и обработки (кодифицирана
    версия)
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 423/2008 ze dne 8. května 2008 , kterým se
    stanoví některá prováděcí pravidla k nařízení Rady (ES) č. 1493/1999
    a kterým se zavádí kodex Společenství pro enologické postupy a ošetření
    (kodifikované znění)
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 423/2008 af 8. maj 2008 om visse gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1493/1999 og om en EF-kodeks for ønologiske fremgangsmåder
    og behandlingsmetoder (kodificeret udgave)
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 423/2008 της Επιτροπής,
    της 8ης Μαΐου 2008 , για τον καθορισμό ορισμένων
    λεπτομερειών εφαρμογής του κανονισμού (ΕΚ)
    αριθ. 1493/1999 του Συμβουλίου και για την καθιέρωση
    κοινοτικού κώδικα των οινολογικών πρακτικών
    και επεξεργασιών (Κωδικοποιημένη έκδοση)
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 423/2008, 8. mai 2008 , milles sätestatakse
    nõukogu määruse (EÜ) nr 1493/1999 üksikasjalikud rakenduseeskirjad ning kehtestatakse
    ühenduse eeskiri veinivalmistustavade ja -menetluste kohta (kodifitseeritud versioon)
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 423/2008, annettu 8 päivänä toukokuuta 2008
    , neuvoston asetuksen (EY) N:o 1493/1999 soveltamista koskevista yksityiskohtaisista
    säännöistä sekä viininvalmistusmenetelmiä ja -käsittelyjä koskevista yhteisön
    säännöistä (Kodifioitu toisinto)
  type: main
- language: hu
  script: Latn
  content: A Bizottság 423/2008/EK rendelete ( 2008. május 8. ) az 1493/1999/EK
    tanácsi rendelet végrehajtása egyes részletes szabályainak megállapításáról,
    valamint a borászati eljárások és kezelések közösségi kódexének létrehozásáról
    (kodifikált változat)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 423/2008 della Commissione, dell' 8 maggio 2008 , che
    fissa talune modalità d'applicazione del regolamento (CE) n. 1493/1999 del Consiglio
    che istituisce un codice comunitario delle pratiche e dei trattamenti enologici
    (Versione codificata)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 423/2008 ( 2008. gada 8 maijs ), ar ko nosaka
    konkrētus sīki izstrādātus Padomes Regulas (EK) Nr. 1493/1999 īstenošanas
    noteikumus un ar ko izveido Kopienas enoloģiskās prakses un procesu kodeksu
    (Kodificēta versija)
  type: main
- language: lt
  script: Latn
  content: 2008 m. gegužės 8 d. Komisijos reglamentas (EB) Nr. 423/2008, nustatantis
    tam tikras išsamias Tarybos reglamento (EB) Nr. 1493/1999 įgyvendinimo taisykles
    ir nustatantis Bendrijos vynininkystės metodų bei procesų kodeksą (kodifikuota
    redakcija)
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (KE) Nru 423/2008 tat- 8 ta’ Mejju 2008 li
    jistabbilixxi r-regoli dettaljati għall-implimentazzjoni tar-Regolament tal-Kunsill
    (KE) Nru 1493/1999 u li jistabbilixxi kodiċi tal-Komunità ta’ prattiċi u
    proċessi enoloġiċi (Verżjoni kodifikata)
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 423/2008 van de Commissie van 8 mei 2008 tot vaststelling
    van uitvoeringsbepalingen van Verordening (EG) nr. 1493/1999 van de Raad en tot
    instelling van een communautaire regeling inzake oenologische procedés en behandelingen
    (Gecodificeerde versie)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 423/2008 z dnia 8 maja 2008 r. ustanawiające
    niektóre szczegółowe zasady wykonania rozporządzenia Rady (WE) nr 1493/1999
    oraz wspólnotowy kodeks praktyk i procesów enologicznych (Wersja skodyfikowana)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 423/2008 da Comissão, de 8 de Maio de 2008 , que
    estabelece determinadas normas de execução do Regulamento (CE) n. o 1493/1999
    do Conselho e constitui um código comunitário das práticas e tratamentos enológicos
    (Versão codificada)
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 423/2008 al Comisiei din 8 mai 2008 de stabilire
    a anumitor norme de aplicare a Regulamentului (CE) nr. 1493/1999 al Consiliului
    și de stabilire a unui cod comunitar al practicilor și tratamentelor oenologice
    (versiune codificată)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 423/2008 z 8. mája 2008 ustanovujúce niektoré
    podrobné pravidlá na uplatňovanie nariadenia Rady (ES) č. 1493/1999 a ustanovujúce
    Zákonník Spoločenstva pre vinárske (oenologické) postupy a procesy (kodifikované
    znenie)
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 423/2008 z dne 8. maja 2008 o določitvi nekaterih
    podrobnih pravil za izvajanje Uredbe Sveta (ES) št. 1493/1999 in vzpostavitvi
    kodeksa Skupnosti na področju enoloških postopkov in obdelav (Kodificirana različica)
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 423/2008 de la Comisión, de 8 de mayo de 2008 , por
    el que se establecen determinadas disposiciones de aplicación del Reglamento
    (CE) n o 1493/1999 del Consejo y se introduce un código comunitario de prácticas
    y tratamientos enológicos (Versión codificada)
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 423/2008 av den 8 maj 2008 om vissa tillämpningsföreskrifter
