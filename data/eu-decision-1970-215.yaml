title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 19 mars 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de pommes des positions Ex 20.05 et Ex 20.06 du Tarif douanier commun,
    originaires de la République populaire de Chine et mises en libre pratique dans
    les pays du Benelux
  type: main
- language: de
  script: Latn
  content: '70/215/EWG: Entscheidung der Kommission vom 19. März 1970, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die aus der Volksrepublik China stammenden
    und in den Beneluxländern im freien Verkehr befindlichen Zubereitungen und Konserven
    von Äpfeln der Tarifnummern ex 20.05 und ex 20.06 des Gemeinsamen Zolltarifs
    von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/215/CEE: Decisione della Commissione, del 19 marzo 1970, che autorizza
    la Repubblica federale di Germania ad escludere dal trattamento comunitario le
    preparazioni e conserve di mele delle voci ex 20.05 e ex 20.06 della tariffa doganale
    comune, originarie della Repubblica popolare cinese e messe in libera pratica
    nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/215/EEG: Beschikking van de Commissie van 19 maart 1970 waarbij de
    Bondsrepubliek Duitsland wordt gemachtigd bereide of verduurzaamde appelen van
    de posten ex 20.05 en ex 20.06 van het gemeenschappelijk douanetarief, van oorsprong
    uit de Volksrepubliek China, en in de Benelux-landen in het vrije verkeer gebracht,
    van de communautaire behandeling uit te sluiten'
  type: main
