  content: COMMISSION REGULATION (EC) No 659/95 of 28 March 1995 determining the extent
    to which applications lodged in March 1995 licences for certain eggs and poultrymeat
    products under the regime provided for by the Agreements concluded by the Community
    with the Republic of Poland, the Republic of Hungary, the Czech Republic and the
    Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 659/95 DE LA COMMISSION du 28 mars 1995 déterminant
