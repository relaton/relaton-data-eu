title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3638/85 of 17 December 1985 instituting a specific
    Community regional development measure contributing to the development of new
    economic activities in certain zones affected by the implementation of the Community
    fisheries policy
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3638/85 du Conseil du 17 décembre 1985 instituant
    une action communautaire spécifique de développement régional contribuant au
    développement de nouvelles activités économiques dans certaines zones affectées
    par la mise en oeuvre de la politique communautaire de la pêche
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3638/85 des Rates vom 17. Dezember 1985 zur Einführung
    einer spezifischen Gemeinschaftsmaßnahme zur regionalen Entwicklung im Hinblick
    auf die Förderung neuer Wirtschaftszweige in bestimmten von der Einführung der
    gemeinsamen Fischereipolitik betroffenen Gebieten
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3638/85 af 17. december 1985 om iværksættelse
    af en særlig fællesskabsaktion med henblik på regionaludvikling, der skal bidrage
    til at udvikle nye økonomiske aktiviteter i visse områder, der er berørt af
    iværksættelsen af den fælles fiskeripolitik
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3638/85 του Συμβουλίου
    της 17ης Δεκεμβρίου 1985 για την ανάληψη ειδικής
    κοινοτικής ενέργειας περιφερειακής ανάπτυξης
    η οποία συμβάλλει στην εξάλειψη των εμποδίων
    στην ανάπτυξη νέων οικονομικών δραστηριοτήτων
    σε ορισμένες ζώνες που θίγονται από την εφαρμογή
    της κοινοτικής πολιτικής αλιείας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3638/85 del Consiglio del 17 dicembre 1985 che istituisce
    un' azione comunitaria specifica di sviluppo regionale per contribuire allo sviluppo
    di nuove attività economiche in talune zone colpite dall' attuazione della politica
    comunitaria della pesca
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3638/85 van de Raad van 17 december 1985 tot instelling
    van een specifieke communautaire actie voor regionale ontwikkeling om bij te dragen
    tot de ontwikkeling van nieuwe economische activiteiten in sommige door de tenuitvoerlegging
    van het communautaire visserijbeleid getroffen zones
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3638/85 do Conselho, de 17 de Dezembro de 1985,
    que institui uma acção comunitária específica de desenvolvimento regional
    para contribuir para o desenvolvimento de novas actividades económicas em certas
    zonas afectadas pela execução da política comunitária da pesca
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3638/85 del Consejo de 17 de diciembre de 1985, por
    el que se establece una acción comunitaria específica de desarrollo regional
    que contribuya al desarrollo de nuevas actividades económica en determinadas
    zonas afectadas por la realización de la política comunitaria de la pesca
  type: main
