  script: Latn
  content: '94/202/EG: Kommissionens beslut av den 9 mars 1994 om godtagande av åtaganden
    som har erbjudits i förbindelse med antidumpningsförfarande vid import av kiselkarbid
    med ursprung i Kina, Norge, Polen och f.d. Sovjetunionen och avbrytande av förfarande
