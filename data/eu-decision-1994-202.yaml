title:
- language: en
  script: Latn
  content: '94/202/EC: Commission Decision of 9 March 1994 accepting undertakings
    offered in connection with the anti-dumping proceeding concerning imports of silicon
    carbide originating in the People''s Republic of China, Norway, Poland and the
    former USSR and terminating the proceeding against imports originating in Norway
    and several republics previously part of the former USSR'
  type: main
- language: fr
  script: Latn
  content: '94/202/CE: Décision de la Commission, du 9 mars 1994, portant acceptation
    des engagements offerts dans le cadre de la procédure antidumping concernant
    les importations de carbure de silicium originaires de la République populaire
    de Chine, de Norvège, de Pologne et de l''ancienne Union soviétique, et portant
    clôture de la procédure concernant les importations originaires de Norvège
    et de plusieurs Républiques ayant appartenu à l''ancienne Union soviétique'
  type: main
- language: de
  script: Latn
  content: '94/202/EG: Beschluß der Kommission vom 9. März 1994 über die Annahme
    von Verpflichtungen im Rahmen des Antidumpingverfahrens betreffend die Einfuhren
    von Siliciumcarbid mit Ursprung in der Volksrepublik China, Norwegen, Polen und
    der ehemaligen UdSSR und über die Einstellung des Verfahrens betreffend die Einfuhren
    mit Ursprung in Norwegen und mehreren Republiken auf dem Gebiet der ehemaligen
    UdSSR'
  type: main
- language: da
  script: Latn
  content: '94/202/EF: Kommissionens afgørelse af 9. marts 1994 om godtagelse af
    tilsagn afgivet i forbindelse med antidumpingproceduren vedrørende importen af
    siliciumcarbid med oprindelse i Den Kinesiske Folkerepublik, Norge, Polen og det
    tidligere Sovjetunionen og om afslutning af proceduren vedrørende importen af
    varer med oprindelse i Norge og flere republikker i det tidligere Sovjetunionen'
  type: main
- language: el
  script: Grek
  content: '94/202/ΕΚ: Απόφαση της Επιτροπής της 9ης Μαρτίου
    1994 για την αποδοχή αναλήψεων υποχρεώσεων που
    προτάθηκαν στο πλαίσιο της διαδικασίας αντιντάμπινγκ
    σχετικά με τις εισαγωγές καρβιδίου πυριτίου,
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, Νορβηγίας,
    Πολωνίας και ΕΣΣΔ, και την περάτωση της διαδικασίας
    σχετικά με τις εισαγωγές καταγωγής Νορβηγίας
    και ορισμένων δημοκρατιών της πρώην ΕΣΣΔ'
  type: main
- language: fi
  script: Latn
  content: '94/202/EY: Komission päätös, tehty 9 päivänä maaliskuuta 1994, Kiinan
    kansantasavallasta, Norjasta, Puolasta ja entisestä Neuvostoliitosta peräisin
    olevan piikarbidin tuontia koskevassa polkumyyntimenettelyssä tarjottujen sitoumusten
    hyväksymisestä ja menettelyn päätökseen saattamisesta Norjasta ja useista
    entisen Neuvostoliiton tasavalloista peräisin olevan tuonnin osalta'
  type: main
- language: it
  script: Latn
  content: '94/202/CE: Decisione della Commissione, del 9 marzo 1994, che accetta
    un impegno offerto nell''ambito del procedimento antidumping relativo alle importazioni
    di carburo di silicio originario della Repubblica popolare cinese, della Norvegia,
    della Polonia e dell''ex Unione Sovietica e che chiude il procedimento riguardante
    le importazioni originarie della Norvegia e di alcune repubbliche dell''ex Unione
    Sovietica'
  type: main
- language: nl
  script: Latn
  content: '94/202/EG: Besluit van de Commissie van 9 maart 1994 tot aanvaarding van
    verbintenissen, aangeboden in verband met de anti-dumpingprocedure betreffende
    de invoer van siliciumcarbide van oorsprong uit, respectievelijk, de Volksrepubliek
    China, Noorwegen, Polen en de voormalige Sowjetunie en tot beëindiging van de
    procedure betreffende de invoer uit Noorwegen en een aantal republieken die eertijds
    deel uitmaakten van de voormalige Sowjetunie'
  type: main
- language: pt
  script: Latn
  content: '94/202/CE: Decisão da Comissão, de 9 de Março de 1994, que aceita compromissos
    oferecidos no âmbito do processo anti-dumping relativo às importações de carboneto
    de silício originário da República Popular da China, da Noruega, da Polónia
    e da antiga União Soviética e que encerra o processo relativo às importações
    originárias da Noruega e de diversas repúblicas da antiga União Soviética'
  type: main
- language: es
  script: Latn
  content: '94/202/CE: Decisión de la Comisión, de 9 de marzo de 1994, por la que
    se aceptan los compromisos ofrecidos en el marco del procedimiento antidumping
    relativo a las importaciones de carburo de silicio originario de la República
    Popular de China, Noruega, Polonia y la antigua Unión Soviética y por el que
