title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2027/76 of 27 July 1976 amending Regulation
    (EEC) No 836/76 derogating from Regulation (EEC) No 2750/75 in respect of mobilization
    procedures for cereals and rice to be supplied to the Office of the United Nations
    High Commissioner for Refugees as food aid for the sections of the population
    affected by the events in Cyprus
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2027/76 du Conseil, du 27 juillet 1976, modifiant
    le règlement (CEE) n° 836/76 portant dérogation au règlement (CEE) n° 2750/75
    en ce qui concerne la procédure de mobilisation des céréales et du riz destinés
    au Haut Commissariat des Nations Unies pour les réfugiés, à titre d'aide alimentaire
    en faveur des populations affectées par les événements de Chypre
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2027/76 des Rates vom 27. Juli 1976 zur Änderung
    der Verordnung (EWG) Nr. 836/76 zur Abweichung von der Verordnung (EWG) Nr. 2750/75
    hinsichtlich des Verfahrens zur Bereitstellung von Getreide und Reis an das Amt
    des Hohen Flüchtlingskommissars der Vereinten Nationen als Nahrungsmittelhilfe
    für die von den Ereignissen in Zypern betroffenen Bevölkerungsteile
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 2027/76 af 27. juli 1976 om ændring af forordning
    (EØF) nr. 836/76 om afvigelse fra forordning (EØF) nr. 2750/75, for så vidt
    angår fremgangsmåden for tilvejebringelse af korn og ris til De forenede Nationers
    Højkommissariat for Flygtninge som fødevarehjælp til fordel for de befolkningsgrupper,
    der er berørt af begivenhederne på Cypern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2027/76 del Consiglio, del 27 luglio 1976, che modifica
    il regolamento (CEE) n. 836/76 che deroga al regolamento (CEE) n. 2750/75 per
    quanto si riferisce alle procedure di mobilitazione dei cereali e del riso destinati
    all'Alto Commissariato delle Nazioni Unite per i profughi, a titolo di aiuto alimentare
    a favore delle popolazioni colpite dagli eventi di Cipro
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2027/76 van de Raad van 27 juli 1976 tot wijziging
    van Verordening (EEG) nr. 836/76 houdende afwijking van Verordening (EEG) nr.
    2750/75 voor wat betreft de procedures voor de beschikbaarstelling aan het Hoge
    Commissariaat van de Verenigde Naties voor Vluchtelingen van graan en rijst als
    voedselhulp ten behoeve van de door de gebeurtenissen op Cyprus getroffen bevolkingsgroepen
  type: main
