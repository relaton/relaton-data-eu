title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1345/80 of 30 May 1980 fixing for the 1980/81
    marketing year the amount of production aid for certain products processed from
    fruit and vegetables and the minimum price to be paid to producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1345/80 de la Commission, du 30 mai 1980, fixant,
    pour la campagne 1980/1981, le montant de l' aide à la production pour certains
    produits transformés à base de fruits et légumes ainsi que le prix minimal
    à payer aux producteurs
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1345/80 der Kommission vom 30. Mai 1980 zur Festsetzung
    der Produktionsbeihilfe für bestimmte Verarbeitungserzeugnisse aus Obst und Gemüse
    für das Wirtschaftsjahr 1980/81 sowie des den Erzeugern zu zahlenden Mindestpreises
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1345/80 af 30. maj 1980 om fastsættelse
    for produktionsåret 1980/81 af producentstøtte for forarbejdningsprodukter på
    basis af frugt og grønsager og den minimumspris, der betales producenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 1345/80 της Επιτροπής,
