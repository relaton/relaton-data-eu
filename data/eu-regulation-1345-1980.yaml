    prodotti trasformati a base di ortofrutticoli nonché il prezzo minimo da pagare
    ai produttori
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1345/80 van de Commissie van 30 mei 1980 tot vaststelling
