    puhul ning määrust (EÜ) nr 1342/2003 seoses tariifikvoodi alusel imporditava
    teravilja ja riisi litsentsidest tulenevate õiguste loovutamisega
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) N:o 418/2012, annettu 16 päivänä
