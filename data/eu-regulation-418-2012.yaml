  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 418/2012 tas-
    16 ta’ Mejju 2012 li jemenda r-Regolament (KE) Nru 376/2008 dwar l-obbligazzjonijiet
    ta’ liċenzji għal ċerti prodotti agrikoli u li jemenda r-Regolament (KE)
    Nru 1342/2003 dwar it-trasferiment tad-drittijiet li jirriżultaw mil-liċenzji
    taċ-ċereali u r-ross importati taħt kwoti tariffarji
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) nr. 418/2012 van de Commissie van 16 mei 2012
    tot wijziging van Verordening (EG) nr. 376/2008 wat betreft de certificaatverplichtingen
    voor bepaalde landbouwproducten, en tot wijziging van Verordening (EG) nr. 1342/2003
    wat betreft de overdracht van de rechten die voortvloeien uit de certificaten
    voor in het kader van tariefcontingenten geïmporteerde granen en geïmporteerde
    rijst
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 418/2012 z dnia 16 maja 2012
    r. zmieniające rozporządzenie (WE) nr 376/2008 w zakresie obowiązku stosowania
    systemu pozwoleń dotyczących niektórych produktów rolnych i zmieniające rozporządzenie
    (WE) nr 1342/2003 w zakresie przenoszenia praw wynikających z pozwoleń na przywóz
    zbóż i ryżu w ramach kontyngentów taryfowych
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) n. ° 418/2012 da Comissão, de 16 de maio
    de 2012 , que altera o Regulamento (CE) n. ° 376/2008 no que respeita às obrigações
    em matéria de certificados para certos produtos agrícolas, e que altera o Regulamento
    (CE) n. ° 1342/2003 no que respeita à transmissão de direitos decorrentes dos
    certificados de importação no setor dos cereais e do arroz importados ao abrigo
    de contingentes pautais
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) nr. 418/2012 al Comisiei din 16
    mai 2012 de modificare a Regulamentului (CE) nr. 376/2008 în ceea ce privește
    obligațiile privind licențele pentru anumite produse agricole și de modificare
    a Regulamentului (CE) nr. 1342/2003 în ceea ce privește transferul drepturilor
    care decurg din licențele pentru orezul și cerealele importate în cadrul contingentelor
    tarifare
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 418/2012 zo 16. mája 2012 ,
    ktorým sa mení a dopĺňa nariadenie (ES) č. 376/2008, pokiaľ ide o povinnosť
    predkladať povolenia pre určité poľnohospodárske výrobky, a ktorým sa mení
    a dopĺňa nariadenie (ES) č. 1342/2003, pokiaľ ide o prevod práv vyplývajúcich
    z povolení pre obilniny a ryžu, dovezené v rámci colných kvót
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 418/2012 z dne 16. maja 2012 o spremembi
    Uredbe (ES) št. 376/2008 v zvezi z obveznostmi pridobitve dovoljenj za nekatere
    kmetijske proizvode ter spremembi Uredbe (ES) št. 1342/2003 v zvezi s prenosom
    pravic, ki izhajajo iz dovoljenj za žita in riž, uvožena v okviru tarifnih
    kvot
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 418/2012 de la Comisión, de 16 de mayo
    de 2012 , que modifica el Reglamento (CE) n ° 376/2008 en lo que atañe a las
    obligaciones de certificado para determinados productos agrícolas, y el Reglamento
    (CE) n ° 1342/2003 en lo que atañe a la transferencia de derechos derivados
    de los certificados para los cereales y el arroz importados en el marco de contingentes
    arancelarios
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 418/2012 av den 16 maj 2012
    om ändring av förordning (EG) nr 376/2008 vad gäller licensskyldighet för
    vissa jordbruksprodukter och om ändring av förordning (EG) nr 1342/2003 vad
    gäller överlåtelse av rättigheter som följer med licenser för spannmål
    och ris som importerats inom ramen för tullkvoter
