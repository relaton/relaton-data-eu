title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 418/2012 of 16 May 2012 amending
    Regulation (EC) No 376/2008 as regards licence obligations for certain agricultural
    products, and amending Regulation (EC) No 1342/2003 as regards the transfer of
    rights deriving from licences for cereals and rice imported under tariff quotas
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) n ° 418/2012 de la Commission du 16 mai
    2012 modifiant le règlement (CE) n ° 376/2008 en ce qui concerne les obligations
    en matière de certificats pour certains produits agricoles et modifiant le règlement
    (CE) n ° 1342/2003 en ce qui concerne le transfert de droits découlant de certificats
    pour les céréales et le riz importés dans le cadre de contingents tarifaires
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 418/2012 der Kommission vom 16. Mai 2012
    zur Änderung der Verordnung (EG) Nr. 376/2008 in Bezug auf die Lizenzverpflichtungen
    für bestimmte landwirtschaftliche Erzeugnisse sowie der Verordnung (EG) Nr. 1342/2003
    in Bezug auf die Übertragung von Rechten aus Lizenzen für Getreide- und Reiseinfuhren
    im Rahmen von Zollkontingenten
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) № 418/2012 на Комисията
    от 16 май 2012 година за изменение на Регламент
    (ЕО) № 376/2008 по отношение на задълженията за
    лицензии за някои селскостопански продукти
    и за изменение на Регламент (ЕО) № 1342/2003 по отношение
    на прехвърляне на права, произтичащи от лицензиите
    за зърнени култури и ориз, внасяни в рамките
    на тарифни квоти
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) č. 418/2012 ze dne 16. května 2012
    , kterým se mění nařízení (ES) č. 376/2008, pokud jde o licenční povinnost
    u některých zemědělských produktů, a kterým se mění nařízení (ES)
    č. 1342/2003, pokud jde o převod práv vyplývajících z licencí na obiloviny
    a rýži, které byly dovezeny v rámci celních kvót
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) nr. 418/2012 af 16. maj 2012
    om ændring af forordning (EF) nr. 376/2008 for så vidt angår licenskrav for
    visse landbrugsprodukter og om ændring af forordning (EF) nr. 1342/2003 for så
    vidt angår overdragelsen af rettigheder i forbindelse med licenser for korn og
    ris, der importeres under toldkontingenter
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) αριθ. 418/2012
    της Επιτροπής, της 16ης Μαΐου 2012 , για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 376/2008 όσον αφορά την
    υποχρέωση προσκόμισης πιστοποιητικών για
