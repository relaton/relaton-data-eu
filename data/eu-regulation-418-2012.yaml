    proizvode i o izmjeni Uredbe (EZ) br. 1342/2003 u pogledu prijenosa prava koji
    proizlaze iz dozvola za žitarice i rižu koje se uvoze u okviru carinskih kvota
  type: main
- language: hu
  script: Latn
  content: A Bizottság 418/2012/EU végrehajtási rendelete ( 2012. május 16. )
    a 376/2008/EK rendeletnek az egyes mezőgazdasági termékekre vonatkozó engedélykötelezettségek
    tekintetében, valamint az 1342/2003/EK rendeletnek a vámkontingensek keretében
    importált gabonafélékre és rizsre vonatkozó engedélyekből eredő jogok
    átruházása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 418/2012 della Commissione, del 16 maggio
    2012 , che modifica il regolamento (CE) n. 376/2008 in ordine agli obblighi in
    materia di titoli per taluni prodotti agricoli e il regolamento (CE) n. 1342/2003
    in ordine al trasferimento dei diritti derivanti dai titoli d’importazione dei
    cereali e del riso nell’ambito dei contingenti tariffari
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 418/2012 ( 2012. gada 16. maijs
    ), ar ko Regulu (EK) Nr. 376/2008 groza attiecībā uz pienākumu uzrādīt licences
    par dažiem lauksaimniecības produktiem un Regulu (EK) Nr. 1342/2003 – attiecībā
    uz to tiesību nodošanu, kuras izriet no licencēm par labību un rīsiem, ko
    importē saskaņā ar tarifa kvotām
  type: main
- language: lt
  script: Latn
  content: 2012 m. gegužės 16 d. Komisijos įgyvendinimo reglamentas (ES) Nr. 418/2012,
    kuriuo iš dalies keičiamos Reglamento (EB) Nr. 376/2008 nuostatos dėl reikalavimo
