    részletes szabályok megállapításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1595/98 della Commissione del 23 luglio 1998 che modifica
    il regolamento (CE) n. 2603/97 recante modalità d'applicazione per l'importazione
    di riso originario degli Stati ACP e dei paesi e territori d'oltremare (PTOM)
    e che stabilisce talune modalità specifiche per il rimborso parziale dei dazi
    all'importazione riscossi per il riso originario degli Stati ACP
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1595/98 (1998. gada 23. jūlijs), ar ko groza
    Regulu (EK) Nr. 2603/97, kurā izklāstīti sīki izstrādāti izpildes noteikumi,
    lai importētu rīsus, kuru izcelsme ir ĀKK valstīs, kā arī aizjūras zemēs
    un teritorijās (AZT), un paredz īpašus sīki izstrādātus noteikumus daļējai
    to ievedmuitas nodokļu atmaksāšanai, ko iekasē par rīsiem, kuru izcelsme
    ir ĀKK valstīs
  type: main
- language: lt
  script: Latn
  content: 1998 m. liepos 23 d. Komisijos reglamentas (EB) Nr. 1595/98, iš dalies
    keičiantis Reglamentą (EB) Nr. 2603/97, nustatantį išsamias AKR šalių arba
    užjūrio šalių ir teritorijų (UŠT) kilmės ryžių importo įgyvendinimo
    taisykles, ir nustatantis specialias išsamias AKR šalių kilmės ryžių importo
    mokesčių dalies kompensavimo taisykles
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KE) Nru 1595/98 tat-23 ta’ Lulju 1998
    li jemenda r-Regolament (KE) Nru 2603/97 li jippreskrivi regoli dettaljati ta’
    implimentazzjoni għall-importazzjoni ta’ ross li joriġina fil-pajjiżi ACP
    jew fil-pajjiżi u territorji ta’ barra (OCT) u li jippreskrivi regoli dettaljati
    u speċifiċi fuq ir-rifużjonijiet ta’ dazji parzjali ta’ importazzjoni imposti
    fuq ir-ross li joriġina minn pajjiżi ACP
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1595/98 van de Commissie van 23 juli 1998 tot wijziging
    van Verordening (EG) nr. 2603/97 houdende uitvoeringsbepalingen voor de invoer
    van rijst van oorsprong uit de ACS-staten en uit de landen en gebieden overzee
    (LGO) en tot vaststelling van bepaalde specifieke bepalingen voor de gedeeltelijke
    terugbetaling van de voor rijst van oorsprong uit de ACS-staten geïnde invoerrechten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1595/98 z dnia 23 lipca 1998 r. zmieniające
    rozporządzenie (WE) nr 2603/97 ustanawiające szczegółowe zasady dotyczące
    przywozu ryżu pochodzącego z krajów AKP lub z krajów i terytoriów zamorskich
    (KTZ) oraz ustanawiające określone warunki dotyczące częściowego zwrotu należności
    przywozowych nałożonych na ryż pochodzący z krajów AKP
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1595/98 da Comissão de 23 de Julho de 1998 que altera
    o Regulamento (CE) nº 2603/97 que estabelece as normas de execução para a importação
    de arroz originário dos Estados de África, das Caraíbas e do Pacífico (ACP)
    e dos países e territórios ultramarinos (PTU) e que adopta certas modalidades
    específicas para o reembolso parcial dos direitos de importação cobrados pelo
    arroz originário dos Estados ACP
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1595/98 z 23. júla 1998, ktorým sa mení
    a dopĺňa nariadenie (ES) č. 2603/97 stanovujúce podrobné vykonávacie predpisy
    na dovozy ryže pochádzajúcej z krajín AKT alebo zo zámorských krajín a
    teritórií (ZKT) a stanovujúce osobitné podrobné pravidlá pre čiastočnú
    náhradu dovozných ciel uvalených na ryžu pochádzajúcu z krajín AKT
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1595/98 z dne 23. julija 1998 o spremembi Uredbe
    (ES) št. 2603/97 o določitvi podrobnih izvedbenih pravil za uvoz riža s poreklom
    iz držav AKP ali čezmorskih držav in ozemelj (ČDO) in določitvi posebnih
    podrobnih pravil o delnih povračilih uvoznih dajatvah za riž s poreklom iz držav
    AKP
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1595/98 de la Comisión de 23 de julio de 1998 que
    modifica el Reglamento (CE) nº 2603/97 por el que se establecen las disposiciones
    de aplicación para la importación de arroz originario de los Estados ACP y de
    los países y territorios de Ultramar (PTU) que establece determinadas disposiciones
    especiales para el reembolso parcial de los derechos de importación percibidos
    por el arroz originario de los Estados ACP
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1595/98 av den 23 juli 1998 om ändring
