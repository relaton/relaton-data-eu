  script: Latn
  content: Commission Regulation (EC) No 1595/98 of 23 July 1998 amending Regulation
    (EC) No 2603/97 laying down the detailed implementing rules for imports of rice
    originating in the ACP countries or the overseas countries and territories (OCT)
    and laying down specific detailed rules on the partial reimbursement of import
    duties levied on rice originating in the ACP countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1595/98 de la Commission du 23 juillet 1998 modifiant
    le règlement (CE) nº 2603/97 fixant les modalités d'application pour l'importation
    de riz originaire des États ACP ainsi que pour l'importation de riz originaire
    des pays et territoires d'outre-mer (PTOM) et arrêtant certaines modalités spécifiques
    pour le remboursement partiel des droits à l'importation perçus pour le riz
    originaire des États ACP
  type: main
- language: de
  script: Latn
