    pro dovoz rýže původem ze států AKT, jakož i pro dovoz rýže původem ze
    zámořských zemí a území, a kterým se stanoví zvláštní pravidla pro
    částečnou úhradu dovozních cel vybraných za rýži původem ze států AKT
  type: main
