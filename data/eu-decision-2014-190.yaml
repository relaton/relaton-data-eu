---
id: EUDecision2014190
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: "(2014/190/EU): Commission Implementing Decision of 3 April 2014 setting out the annual breakdown by Member State of global resources for the European Regional Development Fund, the European Social Fund and the Cohesion Fund under the Investment for growth and jobs goal and the European territorial cooperation goal, the annual breakdown by Member State of resources from the specific allocation for the Youth Employment Initiative together with the list of eligible regions, and the amounts to be transferred from each Member State's Cohesion Fund and Structural Funds allocations to the Connecting Europe Facility and to aid for the most deprived for the period 2014-2020 (notified under document number C(2014) 2082)"
  type: main
- language: fr
  script: Latn
  content: "(2014/190/UE): Décision d'exécution de la Commission du 3 avril 2014 établissant la ventilation annuelle par État membre des ressources globales pour le Fonds européen de développement régional, le Fonds social européen et le Fonds de cohésion au titre de l'objectif «Investissement pour la croissance et l'emploi» et de l'objectif «Coopération territoriale européenne» , la ventilation annuelle par État membre des ressources de la dotation spécifique allouée à l'initiative pour l'emploi des jeunes, accompagnée de la liste des régions éligibles, ainsi que les montants à transférer de la dotation de chaque État membre bénéficiaire du Fonds de cohésion et des Fonds structurels au mécanisme pour l'interconnexion en Europe et à l'aide aux plus démunis pour la période 2014-2020 [notifiée sous le numéro C(2014) 2082]"
  type: main
- language: de
  script: Latn
  content: "(2014/190/EU): Durchführungsbeschluss der Kommission vom 3. April 2014 zur Festlegung der jährlichen Aufteilung der Gesamtmittel nach Mitgliedstaat für den Europäischen Fonds für regionale Entwicklung, den Europäischen Sozialfonds und den Kohäsionsfonds im Rahmen des Ziels „Investitionen in Wachstum und Beschäftigung“ und des Ziels „Europäische territoriale Zusammenarbeit“ , der jährlichen Aufteilung der Mittel aus der besonderen Mittelzuweisung zugunsten der Beschäftigungsinitiative für junge Menschen nach Mitgliedstaat, zusammen mit dem Verzeichnis der förderungsberechtigten Regionen sowie der von den Kohäsionsfonds- und den Strukturfondszuweisungen der Mitgliedstaaten auf die Fazilität „Connecting Europe“ und die Hilfe für die am stärksten benachteiligten Personen zu übertragenden Beträge im Zeitraum 2014-2020 (Bekanntgegeben unter Aktenzeichen C(2014) 2082)"
  type: main
- language: bg
  script: Cyrl
  content: "(2014/190/ЕС): Решение за изпълнение на Комисията от 3 април 2014 година за определяне на годишното разпределение на глобалните средства по държава членка за Европейския фонд за регионално развитие, Европейския социален фонд и Кохезионния фонд по цели „Инвестиции за растеж и работни места“ и „Европейско териториално сътрудничество“ , и на годишното разпределение на специално разпределените средства за инициативата за младежка заетост по държава членка, както и списъка на допустимите региони и размера на средствата, които да се прехвърлят от разпределените на всяка държава членка средства по Кохезионния фонд и структурните фондове към Механизма за свързване на Европа и за подпомагане на най-нуждаещите се лица за периода 2014—2020 година (нотифицирано под номер С(2014) 2082)"
  type: main
- language: cs
  script: Latn
  content: "(2014/190/EU): Prováděcí rozhodnutí Komise ze dne 3. dubna 2014 , kterým se stanoví roční rozpis, podle členských států, celkových finančních zdrojů pro Evropský fond pro regionální rozvoj, Evropský sociální fond a Fond soudržnosti v rámci cíle Investice pro růst a zaměstnanost a cíle Evropská územní spolupráce, roční rozpis, podle členských států, zdrojů ze zvláštního přídělu pro Iniciativu na podporu zaměstnanosti mladých lidí, společně se seznamem způsobilých regionů, a částky, které se mají převést z přídělů z Fondu soudržnosti a strukturálních fondů pro jednotlivé členské státy do Nástroje pro propojení Evropy a na pomoc nejchudším osobám pro období 2014–2020 (oznámeno pod číslem C(2014) 2082)"
  type: main
- language: da
  script: Latn
  content: "(2014/190/EU): Kommissionens gennemførelsesafgørelse af 3. april 2014 om fastsættelse af den årlige fordeling af de samlede midler pr. medlemsstat til Den Europæiske Fond for Regionaludvikling, Den Europæiske Socialfond og Samhørighedsfonden under målet om investeringer i vækst og beskæftigelse og målet om europæisk territorialt samarbejde, den årlige fordeling af midler fra den specifikke tildeling til ungdomsbeskæftigelsesinitiativet pr. medlemsstat, sammen med listen over støtteberettigede regioner, og de beløb, der skal overføres fra hver medlemsstats samhørighedsfondstildeling og strukturfondstildeling til Connecting Europe-faciliteten og til bistand til de socialt dårligst stillede for perioden 2014-2020 (meddelt under nummer C(2014) 2082)"
  type: main
- language: el
  script: Grek
  content: "(2014/190/EE): Εκτελεστική απόφαση της Επιτροπής, της 3ης Απριλίου 2014 , που ορίζει την ετήσια κατανομή των συνολικών πόρων ανά κράτος μέλος για το Ευρωπαϊκό Ταμείο Περιφερειακής Ανάπτυξης, το Ευρωπαϊκό Κοινωνικό Ταμείο και το Ταμείο Συνοχής στο πλαίσιο του στόχου «Επενδύσεις στην ανάπτυξη και την απασχόληση» και του στόχου «Ευρωπαϊκή εδαφική συνεργασία» , την ετήσια κατανομή των πόρων ανά κράτος μέλος από το ειδικό κονδύλιο που διατίθεται για την πρωτοβουλία «Απασχόληση των νέων» μαζί με τον κατάλογο των επιλέξιμων περιφερειών, καθώς και τα ποσά που πρόκειται να μεταφερθούν από τα κονδύλια κάθε κράτους μέλους από το Ταμείο Συνοχής και τα διαρθρωτικά ταμεία για τη διευκόλυνση «Συνδέοντας την Ευρώπη» και την ενίσχυση προς τους απόρους για την περίοδο 2014-2020 [κοινοποιηθείσα υπό τον αριθμό C(2014) 2082]"
  type: main
- language: et
  script: Latn
  content: "(2014/190/EL): Komisjoni rakendusotsus, 3. aprill 2014 , milles sätestatakse Euroopa Regionaalarengu Fondile, Euroopa Sotsiaalfondile ja Ühtekuuluvusfondile majanduskasvu ja tööhõivesse investeerimise eesmärgi ning Euroopa territoriaalse koostöö eesmärgi kohaselt ette nähtud koguvahendite iga-aastane jaotus liikmesriikide vahel, noorte tööhõive algatuse jaoks ette nähtud sihtotstarbelise eraldise iga-aastane jaotus liikmesriikide vahel ja rahastamiskõlblike piirkondade loetelu ning summad, mis kantakse igale liikmesriigile Ühtekuuluvusfondist ja struktuurifondidest tehtud eraldistest üle Euroopa Ühendamise Rahastule ja enim puudust kannatavate isikute abistamiseks ajavahemikus 2014–2020 (teatavaks tehtud numbri C(2014) 2082 all)"
  type: main
- language: fi
  script: Latn
  content: "(2014/190/EU): Komission täytäntöönpanopäätös, annettu 3 päivänä huhtikuuta 2014 , Euroopan aluekehitysrahaston, Euroopan sosiaalirahaston ja koheesiorahaston Investoinnit kasvuun ja työpaikkoihin -tavoitteen ja Euroopan alueellinen yhteistyö -tavoitteen mukaisten kokonaismäärärahojen jäsenvaltiokohtaisen vuosijakauman, nuorisotyöllisyysaloitteen erityismäärärahojen jäsenvaltiokohtaisen vuosijakauman ja tukikelpoisten alueiden luettelon sekä kunkin jäsenvaltion koheesio- ja rakennerahastomäärärahoista Verkkojen Eurooppa -välineelle ja vähävaraisimmille suunnattuun apuun siirrettävien määrien vahvistamisesta kaudelle 2014–2020 (tiedoksiannettu numerolla C(2014) 2082)"
  type: main
- language: hr
  script: Latn
  content: "(2014/190/EU): Provedbena odluka Komisije оd 3. travnja 2014. o određivanju godišnje raščlambe ukupnih sredstava po državi članici za Europski fond za regionalni razvoj, Europski socijalni fond i Kohezijski fond u okviru cilja „Ulaganje za rast i radna mjesta” , godišnje raščlambe sredstava posebne dodjele za Inicijativu za zapošljavanje mladih po državi članici zajedno s popisom prihvatljivih regija, te iznosa koje je potrebno prenijeti iz dodijeljenih sredstava Kohezijskog fonda i strukturnih fondova svake države članice u Instrument za povezivanje Europe i pomoć za najpotrebitije za razdoblje 2014.–2020. (priopćeno pod brojem dokumenta C(2014) 2082)"
  type: main
- language: hu
  script: Latn
  content: "(2014/190/EU): A Bizottság végrehajtási határozata ( 2014. április 3. ) a 2014–2020 közötti időszakra a beruházás a növekedésbe és munkahelyteremtésbe célkitűzés és az európai területi együttműködési célkitűzés keretében az Európai Regionális Fejlesztési Alap, az Európai Szociális Alap és a Kohéziós Alap számára biztosított globális források tagállamok szerinti éves bontásának megállapításáról, az ifjúsági és foglalkoztatási kezdeményezéshez rendelt egyedi forrásból származó összegek tagállamok szerinti éves bontásának és a támogatásra jogosult régiók jegyzékének, valamint az egyes tagállamok Kohéziós Alapból és strukturális alapokból származó támogatásából az Európai Hálózatfinanszírozási Eszköz részére és a leginkább rászoruló személyek támogatására átcsoportosítandó összegek megállapításáról (az értesítés a C(2014) 2082. számú dokumentummal történt)"
  type: main
- language: it
  script: Latn
  content: "(2014/190/UE): Decisione di esecuzione della Commissione, del 3 aprile 2014 , che fissa la ripartizione annuale per Stato membro delle risorse globali per il Fondo europeo di sviluppo regionale, il Fondo sociale europeo e il Fondo di coesione a titolo dell'obiettivo Investimenti in favore della crescita e dell'occupazione e dell'obiettivo Cooperazione territoriale europea, la ripartizione annuale per Stato membro delle risorse della dotazione specifica per l'iniziativa a favore dell'occupazione giovanile e l'elenco delle regioni ammissibili nonché gli importi da trasferire dalle dotazioni del Fondo di coesione e dei fondi strutturali di ciascuno Stato membro al meccanismo per collegare l'Europa e agli aiuti agli indigenti per il periodo 2014-2020 [notificata con il numero C(2014) 2082]"
  type: main
- language: lv
  script: Latn
  content: "(2014/190/ES): Komisijas Īstenošanas lēmums ( 2014. gada 3. aprīlis ), ar ko nosaka kopējo resursu gada sadalījumu pa dalībvalstīm Eiropas Reģionālās attīstības fondam, Eiropas Sociālajam fondam un Kohēzijas fondam atbilstīgi mērķim “Investīcijas izaugsmei un nodarbinātībai” un mērķim “Eiropas teritoriālā sadarbība” , Jaunatnes nodarbinātības iniciatīvai atvēlētā īpašā piešķīruma resursu gada sadalījumu pa dalībvalstīm kopā ar atbalsttiesīgo reģionu sarakstu un summas, kas jāpārvieto no katras dalībvalsts Kohēzijas fonda un struktūrfondu piešķīrumiem uz Eiropas infrastruktūras savienošanas instrumentu un uz atbalstu vistrūcīgākajām personām, laikposmam no 2014. līdz 2020. gadam (izziņots ar dokumenta numuru C(2014) 2082)"
  type: main
- language: lt
  script: Latn
  content: "(2014/190/ES): 2014 m. balandžio 3 d. Komisijos įgyvendinimo sprendimas, kuriuo nustatomas 2014–2020 m., siekiant investicijų į ekonomikos augimą ir darbo vietų kūrimą tikslo ir Europos teritorinio bendradarbiavimo tikslo, Europos regioninės plėtros fondui, Europos socialiniam fondui ir Sanglaudos fondui skirtų visų lėšų metinis paskirstymas valstybėms narėms, specialaus asignavimo Jaunimo užimtumo iniciatyvai lėšų metinis paskirstymas valstybėms narėms ir reikalavimus atitinkančių regionų sąrašas, taip pat suma, iš kiekvienos valstybės narės Sanglaudos fondo ir struktūrinių fondų asignavimų perkeltina Europos infrastruktūros tinklų priemonei ir pagalbai labiausiai skurstantiems asmenims (pranešta dokumentu Nr. C(2014) 2082)"
  type: main
- language: mt
  script: Latn
  content: "(2014/190/UE): Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni tat- 3 ta' April 2014 li tistabbilixxi t-tqassim annwali, skont l-Istat Membru, tar-riżorsi globali għall-Fond Ewropew għall-Iżvilupp Reġjonali, il-Fond Soċjali Ewropew u l-Fond ta' Koeżjoni fil-qafas tal-Investiment għall-mira tat-tkabbir u l-impjiegi u l-mira tal-kooperazzjoni territorjali Ewropea, it-tqassim annwali, skont l-Istat Membru, tar-riżorsi mill-allokazzjoni speċifika għall-Inizjattiva favur l-Impjieg taż-Żgħażagħ, flimkien mal-lista ta' reġjuni eliġibbli u l-ammonti li għandhom jiġu ttrasferiti mill-allokazzjonijiet tal-Fond ta' Koeżjoni u tal-Fondi Strutturali ta' kull Stat Membru għall-Faċilità Nikkollegaw l-Ewropa u għall-għajnuna maħsuba għall-persuni l-aktar fil-bżonn, għall-perjodu 2014-2020 (notifikata bid-dokument C(2014) 2082)"
  type: main
- language: nl
  script: Latn
  content: "(2014/190/EU): Uitvoeringsbesluit van de Commissie van 3 april 2014 tot vaststelling van de jaarlijkse verdeling per lidstaat van de totale middelen voor het Europees Fonds voor regionale ontwikkeling, het Europees Sociaal Fonds en het Cohesiefonds in het kader van de doelstelling „investeren in groei en werkgelegenheid” en de doelstelling „Europese territoriale samenwerking” , de jaarlijkse verdeling per lidstaat van de middelen uit de specifieke toewijzing voor het werkgelegenheidsinitiatief voor jongeren samen met de lijst van in aanmerking komende regio's, en de bedragen die uit de toewijzingen van het Cohesiefonds en de structuurfondsen aan elke lidstaat moeten worden overgedragen aan de financieringsfaciliteit voor Europese verbindingen en voor hulp aan de meest behoeftigen voor de periode 2014-2020 (Kennisgeving geschied onder nummer C(2014) 2082)"
  type: main
- language: pl
  script: Latn
  content: "(2014/190/UE): Decyzja wykonawcza Komisji z dnia 3 kwietnia 2014 r. w sprawie rocznego podziału między państwa członkowskie zasobów ogólnych przydzielonych na Europejski Fundusz Rozwoju Regionalnego, Europejski Fundusz Społeczny oraz Fundusz Spójności w ramach celu „Inwestycje na rzecz wzrostu i zatrudnienia” i celu „Europejska współpraca terytorialna” , a także rocznego podziału między państwa członkowskie zasobów ze szczególnej alokacji na Inicjatywę na rzecz zatrudnienia ludzi młodych, wraz z wykazem kwalifikujących się regionów oraz kwotami, które mają zostać przeniesione z alokacji Funduszu Spójności i funduszy strukturalnych dla każdego państwa członkowskiego do instrumentu „Łącząc Europę” oraz na pomoc najbardziej potrzebującym na okres 2014–2020 (notyfikowana jako dokument nr C(2014) 2082)"
  type: main
- language: pt
  script: Latn
  content: "(2014/190/UE): Decisão de Execução da Comissão, de 3 de abril de 2014 , que estabelece a repartição anual, por Estado-Membro, dos recursos globais para o Fundo Europeu de Desenvolvimento Regional, o Fundo Social Europeu e o Fundo de Coesão, no âmbito do objetivo de Investimento no Crescimento e no Emprego e do objetivo da Cooperação Territorial Europeia, a repartição anual dos recursos da dotação específica para a Iniciativa Emprego dos Jovens, por Estado-Membro, juntamente com a lista de regiões elegíveis, e os montantes a transferir das dotações de cada Estado-Membro do Fundo de Coesão e dos fundos estruturais, para o Mecanismo Interligar a Europa e para o auxílio às pessoas mais carenciadas, para o período de 2014-2020 [notificada com o número C(2014) 2082]"
  type: main
- language: ro
  script: Latn
  content: "(2014/190/UE): Decizia de punere în aplicare a Comisiei din 3 aprilie 2014 de stabilire a repartizării anuale a resurselor globale pentru fiecare stat membru din Fondul european de dezvoltare regională, Fondul social european și Fondul de coeziune în cadrul obiectivului privind investițiile pentru creștere economică și ocuparea forței de muncă și al obiectivului de cooperare teritorială europeană, a repartizării anuale a resurselor pentru fiecare stat membru din alocările specifice pentru inițiativa privind ocuparea forței de muncă în rândul tinerilor, împreună cu lista regiunilor eligibile, precum și a sumelor care urmează să fie transferate din alocările fiecărui stat membru din Fondul de coeziune și din fondurile structurale către Mecanismul pentru Interconectarea Europei și către ajutorul pentru cele mai defavorizate persoane pentru perioada 2014-2020 [notificată cu numărul C(2014) 2082]"
  type: main
- language: sk
  script: Latn
  content: "(2014/190/EÚ): Vykonávacie rozhodnutie Komisie z 3. apríla 2014 , ktorým sa stanovuje ročné rozdelenie celkových zdrojov podľa členských štátov pre Európsky fond regionálneho rozvoja, Európsky sociálny fond a Kohézny fond v rámci cieľa Investovanie do rastu a zamestnanosti a cieľa Európska územná spolupráca, ročné rozdelenie zdrojov podľa členských štátov, pokiaľ ide o zdroje z osobitných rozpočtových prostriedkov pridelených na iniciatívu na podporu zamestnanosti mladých ľudí, spolu so zoznamom oprávnených regiónov, ako aj sumy, ktoré majú byť presunuté z rozpočtových prostriedkov každého členského štátu pridelených na Kohézny fond a na štrukturálne fondy do Nástroja na prepájanie Európy a na pomoc pre najodkázanejšie osoby v období rokov 2014 – 2020 [oznámené pod číslom C(2014) 2082]"
  type: main
- language: sl
  script: Latn
  content: "(2014/190/EU): Izvedbeni Sklep Komisije z dne 3. aprila 2014 o letni razdelitvi skupnih virov po državah članicah za Evropski sklad za regionalni razvoj, Evropski socialni sklad in Kohezijski sklad v okviru cilja „naložbe za rast in delovna mesta“ ter cilja „evropsko teritorialno sodelovanje“ , letni razdelitvi virov iz posebne dodelitve za pobudo za zaposlovanje mladih po državah članicah, skupaj s seznamom upravičenih regij, ter o zneskih, ki se iz Kohezijskega sklada in strukturnih skladov vsake države članice prenesejo na instrument za povezovanje Evrope ter pomoč najbolj ogroženim za obdobje 2014–2020 (notificirano pod dokumentarno številko C(2014) 2082)"
  type: main
- language: es
  script: Latn
  content: "(2014/190/UE): Decisión de Ejecución de la Comisión, de 3 de abril de 2014 , por la que se establecen el desglose anual por Estado miembro de los recursos totales del Fondo Europeo de Desarrollo Regional, el Fondo Social Europeo y el Fondo de Cohesión en el marco del objetivo de inversión en crecimiento y empleo y del objetivo de cooperación territorial europea, el desglose anual por Estado miembro de los recursos de la asignación específica para la Iniciativa sobre Empleo Juvenil, junto con la lista de regiones que pueden optar a financiación, así como los importes que deben transferirse de las asignaciones de los Fondos Estructurales y el Fondo de Cohesión de cada Estado miembro al Mecanismo «Conectar Europa» y a la ayuda a las personas más desfavorecidas para el período 2014-2020 [notificada con el número C(2014) 2082]"
  type: main
- language: sv
  script: Latn
  content: "(2014/190/EU): Kommissionens genomförandebeslut av den 3 april 2014 om fastställande av den årliga fördelningen per medlemsstat av de samlade medlen för Europeiska regionala utvecklingsfonden, Europeiska socialfonden och Sammanhållningsfonden inom målet Investering för tillväxt och sysselsättning och målet Europeiskt territoriellt samarbete, av den årliga fördelningen per medlemsstat av medel från det särskilda anslaget för sysselsättningsinitiativet för unga, med en förteckning över stödberättigade regioner, samt av de belopp som ska överföras från Sammanhållningsfondens och strukturfondernas anslag för varje medlemsstat till Fonden för ett sammanlänkat Europa och till bistånd till dem som har det sämst ställt under perioden 2014–2020 [delgivet med nr C(2014) 2082]"
  type: main
