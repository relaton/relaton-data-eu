title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3175/83 of 10 November 1983 re-establishing
    the levying of customs duties on other hand tools, falling within heading No 82.04
    and originating in China, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3175/83 de la Commission du 10 novembre 1983 portant
    rétablissement de la perception des droits de douane applicables aux autres outils
    et outillage à main, de la position 82.04 du tarif douanier commun, originaires
    de Chine, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3175/83 der Kommission vom 10. November 1983 zur Wiedereinführung
    der Erhebung der Zölle für anderes Handwerkszeug der Tarifnummer 82.04 mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3175/83 af 10. november 1983 om genindførelse
    af opkrævning af told for håndværktøj og håndredskaber, henhørende under
    pos. 82.04 og med oprindelse i Kina, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
