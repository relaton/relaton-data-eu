    het gemeenschappelijk douanetarief van herkomst uit de Gemeenschap in haar samenstelling
    per 31 december 1985, en van uitvoeringsbepalingen van Verordening (EEG) nr. 493/86
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 620/86 da Comissão de 28 de Fevereiro de 1986 que
