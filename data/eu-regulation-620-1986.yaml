    Schale mit Herkunft aus der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember
    1985 sowie mit Durchführungsbestimmungen zu der Verordnung (EWG) Nr. 493/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 620/86 af 28. februar 1986 om fastsættelse
