    Common Customs Tariff subheading 04.05 1 I b) from the Community as constituted
    at 31 December 1985 and laying down certain detailed rules for applying Council
    Regulation (EEC) No 493/86
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 620/86 de la Commission du 28 février 1986 fixant
