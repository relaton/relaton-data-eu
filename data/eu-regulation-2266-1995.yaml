- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2266/95 of 27 September 1995 determining
    the extent to which applications lodged in September 1995 for licences for certain
    eggs and poultrymeat products under the regime provided for by the Interim Agreements
    concluded by the Community with the Republic of Poland, the Republic of Hungary,
    the Czech Republic and Slovakia can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2266/95 DE LA COMMISSION du 27 septembre 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    septembre 1995 pour certains produits des secteurs de la viande de volaille et
    des oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque
    et la Slovaquie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2266/95 DER KOMMISSION vom 27. September 1995 über
    die Festsetzung des Umfangs, in dem die im September 1995 gestellten Anträge
    auf Einfuhrlizenzen für bestimmte Eier und für Geflügelfleisch entsprechend
    der Regelung der Abkommen zwischen der Gemeinschaft und der Republik Polen, der
    Republik Ungarn, der Tschechischen Republik und der Slowakischen Republik genehmigt
    werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2266/95 af 27. september 1995 om fastsættelse
