    tiettyjä siipikarjanliha- ja muna-alan tuotteita koskevien tuontilupahakemusten
    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2266/95 DELLA COMMISSIONE del 27 settembre 1995 che
