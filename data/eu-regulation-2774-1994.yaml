title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2774/94 of 14 November 1994 re-establishing
    the levying of the customs duties applicable to products falling within CN code
    8544 originating in China, to which the preferential tariff arrangements of Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2774/94 de la Commission du 14 novembre 1994 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 8544 originaires de Chine, bénéficiaires des préférences tarifaires
    prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2774/94 DER KOMMISSION vom 14. November 1994 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 8544 mit Ursprung in China,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2774/94 af 14. november 1994 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 8544 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2774/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 14ης Νοεμβρίου 1994 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για ορισμένα προϊόντα του
    κωδικού ΣΟ 8544, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2774/94 DELLA COMMISSIONE del 14 novembre 1994 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 8544 originari della Cina, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2774/94 VAN DE COMMISSIE van 14 november 1994 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 8544, van oorsprong uit China, waarvoor de in Verordening (EEG) nr.
    3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
