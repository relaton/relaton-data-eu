title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 795/88 of 25 March 1988 specifying the extent
    to which applications lodged in March 1988 for import licences in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 795/88 de la Commission, du 25 mars 1988, déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'importation déposées au mois de mars 1988 pour les jeunes bovins mâles destinés
    à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 795/88 der Kommission vom 25. März 1988 über das
    Ausmaß, in dem den im März 1988 eingereichten Anträgen auf Einfuhrlizenzen
    für zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 795/88 af 25. marts 1988 om det omfang,
    i hvilket ansøgninger om udstedelse af importlicenser, som er indgivet i marts
    1988 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 795/88 της Επιτροπής
    της 25ης Μαρτίου 1988 περί καθορισμού σε ποιο
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εισαγωγής, που
    υποβλήθηκαν το Μάρτιο του 1988, για τα νεαρά άρρενα
    βοοειδή που προορίζονται για πάχυνση
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 795/88 della Commissione, del 25 marzo 1988, che stabilisce
    in quale misura può essere dato seguito alle domande di titoli d'importazione
    presentate nel mese di marzo 1988 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 795/88 van de Commissie van 25 maart 1988 waarbij
    wordt bepaald in welke mate gevolg kan worden gegeven aan de in maart 1988 ingediende
    aanvragen om afgifte van invoercertificaten voor jonge mannelijke mestrunderen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 795/88 da Comissão, de 25 de Março de 1988, que
    determina em que medida pode ser dado seguimento aos pedidos de emissão de certificados
    de importação apesentados no mês de Março de 1988 para os bovinos machos jovens
    destinados à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n 795/88 de la Comisión, de 25 de marzo de 1988, que
    determina en qué medida podrá darse curso a las solicitudes de expedición de
    certificados de importación presentadas en el mes de marzo de 1988 respecto a
    los jóvenes bovinos machos destinados al engorde
  type: main
