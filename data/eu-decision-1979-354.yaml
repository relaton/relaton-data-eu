title:
- language: en
  script: Latn
  content: '79/354/EEC: Commission Decision of 20 March 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to women''s, girls''and infants''(other than babies'')
    woven and knitted or crocheted dresses, of wool, cotton or man-made textile fibres,
    falling within subheadings ex 60.05 A II and ex 61.02 B of the Common Customs
    Tariff (NIMEXE codes 60.05-41, 42, 43, 44 ; 61.02-48, 52, 53, 54) (category 26),
    originating in Poland and in free circulation in the other Member States (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/354/CEE: Décision de la Commission, du 20 mars 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les robes tissées et robes de bonneterie,
    pour femmes, fillettes et jeunes enfants (autres que bébés), de laine, de coton
    ou de fibres textiles synthétiques ou artificielles des sous- positions ex 60.05
    A II et ex 61.02 B du tarif douanier commun (codes Nimexe: 60.05-41, 42, 43, 44;
    61.02-48, 52, 53, 54) catégorie 26, originaires de Pologne et mises en libre
    pratique dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/354/EWG: Entscheidung der Kommission vom 20. März 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Polen stammende und in den übrigen Mitgliedstaaten im
    freien Verkehr befindliche Kleider aus Geweben und aus Gewirken, für Frauen,
    Mädchen und Kleinkinder (ausgenommen Säuglinge), aus Wolle, Baumwolle oder aus
    synthetischen oder künstlichen Spinnstoffen, der Tarifstellen ex 60.05 A II und
    ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 60.05-41; 42; 43; 44
    und 61.02-48; 52; 53; 54) (Kategorie 26) von der Gemeinschaftsbehandlung auszuschließen
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/354/EØF: Kommissionens beslutning af 20. marts 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage vævede kjoler og kjoler af trikotage
    til kvinder, piger og småbørn (undtagen spædbørn), af uld, bomuld eller kemofibre,
    som henhører under pos. ex 60.05 A II og 61.02 B i den fælles toldtarif (NIMEXE-nummer
    60.05-41, 42, 43, 44 ; 61.02- 48, 52, 53, 54 ; kategori 26), har oprindelse i
    Polen og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/354/CEE: Decisione della Commissione, del 20 marzo 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario abiti interi tessuti ed a maglia, per
    donna, per ragazza e per bambini, diversi dai bambini piccoli (bébés), di lana,
    di cotone o di fibre tessili sintetiche o artificiali delle sottovoci ex 60.05
    A II e ex 61.02 B della tariffa doganale comune (codice Nimexe 60.05-41, 42, 43,
    44; 61.02-48, 52, 53, 54), categoria 26, originari della Polonia e messi in libera
    pratica negli altri Stati membri (I testi in lingua francese e olandese sono i
    soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/354/EEG: Beschikking van de Commissie van 20 maart 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd japonnen voor dames, meisjes en kinderen (andere dan die voor
    baby''s), geweven en van brei- of haakwerk, van wol, van katoen of van synthetische
    of van kunstmatige vezels, van de posten ex 60.05 A II en ex 61.02 B van het gemeenschappelijk
    douanetarief (NIMEXE- code 60.05-41, 42, 43, 44 en 61.02-48, 52, 53, 54) (categorie
    26), van oorsprong uit Polen en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten (Slechts de teksten
    in de Franse en de Nederlandse taal zijn authentiek)'
