title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1112/81 of 28 April 1981 determining to
    what extent applications for import licences lodged during the second quarter
    of 1981 for high-quality fresh, chilled or frozen beef and veal can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1112/81 de la Commission, du 28 avril 1981, déterminant
    dans quelle mesure il peut être donné suite aux demandes de certificats d' importation
    déposées pendant le deuxième trimestre 1981 pour les viandes bovines de haute
    qualité, fraîches, réfrigérées ou congelées
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1112/81 der Kommission vom 28. April 1981 zur Bestimmung
    des Maßstabs für die Genehmigung der während des zweiten Vierteljahres 1981
    eingereichten Anträge auf Einfuhrlizenzen für frisches, gekühltes oder gefrorenes
    Qualitätsrindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1112/81 af 28. april 1981 om fastsættelse
    af, i hvilket omfang ansøgninger om importlicenser, som er indgivet i andet kvartal
    af 1981 for oksekød af høj kvalitet, fersk, kølet eller frosset, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1112/81 τής Επιτροπής
    τής 28ης Απριλίου 1981 περί καθορισμού μέχρι ποιού
    μέτρου ειναι δυνατόν νά δοθεί συνέχεια στίς
    αιτήσεις εκδόσεως πιστοποιητικών εισαγωγής,
    πού έχουν υποβληθεί κατά τό δεύτερο τρίμηνο
    τού 1981, γιά βόειο κρέας υψηλής ποιότητος, νωπό,
    διατηρημένο μέ απλή ψύξη ή κατεψυγμένο
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1112/81 della Commissione, del 28 aprile 1981, che
    determina in quale misura possono essere accolte le domande di titoli d' importazione
    presentate durante il secondo trimestre 1981 per le carni bovine di qualità pregiata,
    fresche, refrigerate o congelate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1112/81 van de Commissie van 28 april 1981 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de certificaataanvragen die gedurende
    het tweede kwartaal van 1981 zijn ingediend voor de invoer van vers, gekoeld of
    bevroren kwaliteitsrundvlees
