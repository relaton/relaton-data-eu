title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2417/2001 of 11 December 2001 amending Regulation
    (EC) No 1500/2001 increasing to 100000 tonnes the quantity of barley held by the
    Finnish intervention agency for which a standing invitation to tender for export
    has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2417/2001 de la Commission du 11 décembre 2001 modifiant
    le règlement (CE) n° 1500/2001 et portant à 100000 tonnes l'adjudication permanente
    pour l'exportation d'orge détenue par l'organisme d'intervention finlandais
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2417/2001 der Kommission vom 11. Dezember 2001 zur
    Änderung der Verordnung (EG) Nr. 1500/2001 und zur Erhöhung der Dauerausschreibung
    zur Ausfuhr von im Besitz der finnischen Interventionsstelle befindlicher Gerste
    auf 100000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2417/2001 af 11. december 2001 om ændring
    af forordning (EF) nr. 1500/2001 og om forhøjelse til 100000 tons af den løbende
    licitation med henblik på eksport af byg, som er i det finske interventionsorgans
    besiddelse
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2417/2001 της Επιτροπής,
    της 11ης Δεκεμβρίου 2001, για την τροποποίηση
    του κανονισμού (ΕΚ) αριθ. 1500/2001 και για έναρξη
    διαρκούς διαγωνισμού για εξαγωγή 100000 τόνων
    κριθής που έχει στη διάθεσή του ο φινλανδικός
    οργανισμός παρέμβασης
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2417/2001, annettu 11 päivänä joulukuuta 2001,
    asetuksen (EY) N:o 1500/2001 muuttamisesta ja Suomen interventioelimen hallussaan
    pitämän ohran vientiä koskevan pysyvän tarjouskilpailun kohteena olevan määrän
    nostamisesta 100000 tonniin
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2417/2001 della Commissione, dell'11 dicembre 2001,
    che modifica il regolamento (CE) n. 1500/2001 e che porta a 100000 tonnellate
    il quantitativo globale oggetto della gara permanente per l'esportazione di orzo
    detenuto dall'organismo d'intervento finlandese
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2417/2001 van de Commissie van 11 december 2001 tot
    wĳziging van Verordening (EG) nr. 1500/2001, teneinde de hoeveelheid waarop de
    permanente openbare inschrĳving voor de uitvoer van gerst uit Finse interventievoorraden
    betrekking heeft, tot 100000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 2417/2001 da Comissão, de 11 de Dezembro de 2001,
    que altera o Regulamento (CE) n.° 1500/2001 e eleva a 100000 toneladas o concurso
    permanente para a exportação de cevada detida pelo organismo de intervenção
    finlandês
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2417/2001 de la Comisión, de 11 de diciembre de 2001,
    por el que se modifica el Reglamento (CE) n° 1500/2001 y se eleva a 100000 toneladas
    la licitación permanente para la exportación de cebada en poder del organismo
    de intervención finlandés
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2417/2001 av den 11 december 2001 om
