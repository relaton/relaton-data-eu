title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2538/90 of 31 August 1990 reintroducing
    the levying of the customs duties applicable to products of CN codes 3904 10 00,
    3904 21 00 and 3904 22 00 originating in Mexico, to which the preferential arrangements
    of Council Regulation (EEC) No 3896/89 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2538/90 de la Commission du 31 août 1990 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 3904 10 00, 3904 21 00 et 3904 22 00 originaires du Mexique, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3896/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2538/90 DER KOMMISSION vom 31. August 1990 zur Wiedereinfuehrung
    der Erhebung der Zoelle fuer Waren der KN-Codes 3904 10 00, 3904 21 00 und 3904
    22 00 mit Ursprung in Mexiko, dem die in der Verordnung (EWG) Nr. 3896/89 des
    Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2538/90 af 31. august 1990 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3904 10 00, 3904 21
    00 og 3904 22 00 og med oprindelse i Mexico, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3896/89
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2538/90 της Επιτροπής
    της 31ης Αυγούστου 1990 περί αποκαταστάσεως της
    εφαρμογής των δασμών για προϊόντα των κωδικών
    ΣΟ 3904 10 00, 3904 21 00 και 3904 22 00, καταγωγής Μεξικού,
    δικαιούχου των προβλεπόμενων από τον κανονισμό
    (ΕΟΚ) αριθ. 3896/89 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2538/90 DELLA COMMISSIONE del 31 agosto 1990 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti dei codici NC 3904 10
    00, 3904 21 00 e 3904 22 00 originari del Messico, beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3896/89 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2538/90 VAN DE COMMISSIE van 31 augustus 1990 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 3904 10 00, 3904 21 00 en 3904 22 00 van oorsprong uit Mexico,
    waarvoor de in Verordening (EEG) nr. 3896/89 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2538/90 DA COMISSAO de 31 de Agosto de 1990 que restabelece
    a cobrança dos direitos aduaneiros aplicaveis aos produtos dos codigos NC 3904
    10 00, 3904 21 00 e 3904 22 00 originarios do México, beneficiario das preferências
    pautais pelo Regulamento (CEE) n* 3896/89 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2538/90 DE LA COMISION de 31 de agosto de 1990 relativo
