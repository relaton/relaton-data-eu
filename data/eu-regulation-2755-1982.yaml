title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2755/82 of 14 October 1982 re-establishing
    the levying of customs duties on bags, sachets and similar articles of polyethylene,
    falling within subheading 39.07 B V ex d) and originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3601/81
    applyl
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2755/82 de la Commission, du 14 octobre 1982, portant
    rétablissement de la perception des droits de douane applicables aux sacs, sachets
    et articles similaires en polyéthylène, de la sous-position 39.07 B V ex d)
    du tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2755/82 der Kommission vom 14. Oktober 1982 zur Wiedereinführung
    der Erhebung der Zölle für Säcke, Beutel und ähnliche Waren aus Polyäthylen
    der Tarifstelle 39.07 B V ex d), mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2755/82 af 14. oktober 1982 om genindførelse
    af opkrævning af told for sække, poser o. l. henhørende under pos. 39.07 B
    V ex d) og med oprindelse i Hongkong, som er præferenceberettiget i henhold til
    Rådets forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2755/82 τής Επιτροπής
    τής 14ης Οκτωβρίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά σάκκους, σακκίδια
    καί παρόμοια είδη εκ πολυαιθυλενίου τής διακρίσεως
    39. 07 B V ex δ) τού Κοινού Δασμολογίου, καταγωγής
    Χόνγκ Κόνγκ, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2755/82 della Commissione, del 14 ottobre 1982, che
    ripristina la riscossione dei dazi doganali applicabili ai sacchi, sacchetti ed
    altri simili contenitori di polietilene, della sottovoce 39.07 B V ex d) della
    tariffa doganale comune, originari di Hong Kong beneficiario delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2755/82 van de Commissie van 14 oktober 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op zakken, zakjes
    en dergelijke, van polyethyleen van postonderverdeling 39.07 B V ex d), van oorsprong
    uit Hong-Kong, waarvoor de in Verordening (EEG) nr. 3601/81 van de Raad vermelde
    tariefpreferenties zijn verleendt
  type: main
