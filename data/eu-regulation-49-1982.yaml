    à utilização dos velhos formulários de certificados de importação, de exportação
    e de prefixação para os produtos agrícolas
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 49/82 de la Comisión, de 11 de enero de 1982, por
