    τού κανονισμού (EOK) αριθ. 3183/80 όσον αφορά τή χρήση
    τών παλαιών τύπων πιστοποιητικών εισαγωγής,
    εξαγωγής καί προκαθορισμού γιά τά γεωργικά
    προϊόντα
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 49/82 della Commissione, dell' 11 gennaio 1982, recante
    quarta modifica del regolamento (CEE) n. 3183/80 per quanto concerne l' utilizzazione
    dei vecchi formulari per i titoli d' importazione, di esportazione e di fissazione
    anticipata relativi ai prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 49/82 van de Commissie van 11 januari 1982 tot vierde
    wijziging van Verordening (EEG) nr. 3183/80 ten aanzien van het gebruik van de
    oude formulieren voor de invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 49/82 da Comissão, de 11 de Janeiro de 1982, que
