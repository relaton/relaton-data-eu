    utilisation des anciens formulaires de certificats d' importation, d' exportation
    et de préfixation pour les produits agricoles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 49/82 der Kommission vom 11. Januar 1982 zur vierten
    Änderung der Verordnung (EWG) Nr. 3183/80 hinsichtlich der Verwendung der früheren
    Lizenzformulare für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen
    für landwirtschaftliche Erzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 49/82 af 11. januar 1982 om fjerde
    ændring af forordning (EØF) nr. 3183/80 for så vidt angår anvendelsen af gamle
    formularer for import- og eksportlicenser samt forudfastsættelsesattester for
    landbrugsvarer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 49/82 τής Επιτροπής τής
