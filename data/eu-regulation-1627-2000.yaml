title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1627/2000 of 24 July 2000 amending Regulation
    (EC) No 1661/1999 laying down detailed rules for the application of Council Regulation
    (EEC) No 737/90 on the conditions governing imports of agricultural products originating
    in third countries following the accident at the Chernobyl nuclear power station
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1627/2000 de la Commission du 24 juillet 2000 portant
    modification du règlement (CE) nº 1661/1999 portant modalités d'application
    du règlement (CEE) nº 737/90 du Conseil relatif aux conditions d'importation
    de produits agricoles originaires des pays tiers à la suite de l'accident survenu
    à la centrale nucléaire de Tchernobyl
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1627/2000 der Kommission vom 24. Juli 2000 zur Änderung
