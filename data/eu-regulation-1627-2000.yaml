    der Verordnung (EWG) Nr. 737/90 des Rates über die Einfuhrbedingungen für landwirtschaftliche
    Erzeugnisse mit Ursprung in Drittländern nach dem Unfall im Kernkraftwerk Tschernobyl
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1627/2000 af 24. juli 2000 om ændring
    af forordning (EF) nr. 1661/1999 om gennemførelsesbestemmelser til Rådets forordning
    (EØF) nr. 737/90 om betingelser for indførsel af landbrugsprodukter med oprindelse
    i tredjelande som følge af ulykken på kernekraftværket i Tjernobyl
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1627/2000 της Επιτροπής,
