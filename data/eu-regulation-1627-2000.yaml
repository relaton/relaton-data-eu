    (ΕΚ) αριθ. 1661/1999 της Επιτροπής για τη θέσπιση
    λεπτομερών κανόνων εφαρμογής του κανονισμού
    (ΕΟΚ) αριθ. 737/90 του Συμβουλίου σχετικά με τους
    όρους εισαγωγής γεωργικών προϊόντων καταγωγής
    τρίτων χωρών μετά το ατύχημα στον πυρηνικό
    σταθμό του Τσερνομπίλ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1627/2000, annettu 24 päivänä heinäkuuta
    2000, yksityiskohtaisista säännöistä kolmansista maista peräisin olevien
    maataloustuotteiden tuontiedellytyksistä Tsernobylin ydinvoimalaonnettomuuden
    jälkeen annetun neuvoston asetuksen (ETY) N:o 737/90 soveltamiseksi annetun asetuksen
    (EY) N:o 1661/1999 muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1627/2000 della Commissione, del 24 luglio 2000, recante
    emendamento del regolamento (CE) n. 1661/1999 che determina le modalità di applicazione
    del regolamento (CEE) n. 737/90 del Consiglio relativo alle condizioni di importazione
    di prodotti agricoli originari di paesi terzi a seguito dell'incidente verificatosi
    nella centrale nucleare di Cernobil
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1627/2000 van de Commissie van 24 juli 2000 tot wijziging
    van Verordening (EG) nr. 1661/1999 houdende uitvoeringsbepalingen van Verordening
    (EEG) nr. 737/90 van de Raad betreffende de voorwaarden voor de invoer van landbouwproducten
    van oorsprong uit derde landen ingevolge het ongeluk in de kerncentrale van Tsjernobyl
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 1627/2000 da Comissão, de 24 de Julho de 2000, que
    altera o Regulamento (CE) n° 1661/1999 que estabelece as regras de execução
    do Regulamento (CEE) n° 737/90 do Conselho relativo às condições de importação
    de produtos agrícolas originários de países terceiros na sequência do acidente
    ocorrido na central nuclear de Chernobil
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 1627/2000 de la Comisión, de 24 de julio de 2000,
    que modifica el Reglamento (CE) nº 1661/1999 por el que se establecen las disposiciones
    de aplicación del Reglamento (CEE) nº 737/90 del Consejo relativo a las condiciones
