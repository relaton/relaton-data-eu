  content: Commission Regulation (EEC) No 1204/86 of 24 April 1986 amending, for the
    second time Regulation (EEC) No 585/86 laying down the level of the accession
    compensatory amounts for milk and milk products in trade with Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1204/86 de la Commission du 24 avril 1986 portant
    deuxième modification du règlement (CEE) n° 585/86 arrêtant dans le secteur
    du lait et des produits laitiers le niveau des montants compensatoires "adhésion"
    dans les échanges avec l' Espagne
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1204/86 der Kommission vom 24. April 1986 zur zweiten
    Änderung der Verordnung (EWG) Nr. 585/86 zur Festsetzung der Beitrittsausgleichsbeträge
    im Sektor Milch und Milcherzeugnisse im Handel mit Spanien
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1204/86 af 24. april 1986 om anden
    ændring af forordning (EØF) nr. 585/86 om fastsættelse af tiltrædelsesudligningsbeløbene
    for mælk og mejeriprodukter i samhandelen med Spanien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1204/86 της Επιτροπής
