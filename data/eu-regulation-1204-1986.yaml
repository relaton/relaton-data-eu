    προσχωρήσεως στις συναλλαγές με την Ισπανία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1204/86 della Commissione del 24 aprile 1986 che modifica
    per la seconda volta il regolamento (CEE) n. 585/86 che fissa, nel settore del
    latte e dei prodotti lattiero-caseari, il livello degli importi compensativi adesione
    negli scambi con la Spagna
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1204/86 van de Commissie van 24 april 1986 houdende
    tweede wijziging van Verordening (EEG) nr. 585/86 tot vaststelling in de sector
    melk en zuivelprodukten van het niveau van de compenserende bedragen toetreding
    in het handelsverkeer met Spanje
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1204/86 da Comissão de 24 de Abril de 1986 que
    altera pela segunda vez o Regulamento (CEE) n.° 585/86 que adopta, no sector
    do leite e dos produtos lácteos, o nível dos montantes compensatórios de adesão
    nas trocas comerciais com Espanha
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1204/86 de la Comisión de 24 de abril de 1986 que
    modifica, por segunda vez, el Reglamento (CEE) n° 585/86, por el que se adopta
    en el sector de la leche y de los productos lácteos el nivel de los montantes
    compensatorios de adhesión en los intercambios con España
  type: main
