  script: Latn
  content: '98/446/EC: Council Decision of 14 April 1997 on the conclusion of an Agreement
    in the form of an Exchange of Letters between the European Community and the Republic
    of Georgia amending the Agreement between the European Economic Community and
    the Republic of Georgia on trade in textile products to take into account the
    accession of the Republic of Austria, the Republic of Finland and the Kingdom
    of Sweden to the European Union'
  type: main
- language: fr
  script: Latn
  content: '98/446/CE: Décision du Conseil du 14 avril 1997 concernant la conclusion
