id: EURegulation15661980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1566/80 of 23 June 1980 re-establishing
    the levying of customs duties on textile fabrics and textile articles of a kind
    commonly used in machinery or plant, products of category 114 (code 1140), originating
    in Mexico, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 2894/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1566/80 de la Commission, du 23 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux tissus et
    articles pour usages techniques en matières textiles, de la catégorie 114 (code
    1140), originaires du Mexique, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2894/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1566/80 der Kommission vom 23. Juni 1980 über die
    Wiedereinführung des Zollsatzes für technische Gewebe und Gegenstände des technischen
    Bedarfs, aus Spinnstoffen, der Warenkategorie Nr. 114 (Kennziffer 1140), mit Ursprung
    in Mexiko, dem die in der Verordnung (EWG) Nr. 2894/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1566/80 af 23. juni 1980 om genindførelse
    af opkrævning af toldafgifter for tekstilafgifter for tekstilstoffer og artikler
    af tekstil, til teknisk brug under kategori 114 (kode 1140), som har oprindelse
    i Mexico og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 2894/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1566/80 della Commissione, del 23 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti e manufatti
    per usi tecnici, di materie tessili della categoria di prodotti n. 114 (codice
    1140), originari del Messico, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2894/79 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1566/80 van de Commissie van 23 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op weefsels
    en artikelen, voor technisch gebruik, van textielstoffen, van de categorie van
    produkten nr. 114 (codenummer 1140), van oorsprong uit Mexico waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 2894/79 van de
    Raad
  type: main
