    Αυγούστου 2001, για την τροποποίηση της απόφασης
    1999/283/ΕΚ όσον αφορά τους όρους υγειονομικού
    ελέγχου και κτηνιατρικών πιστοποιητικών που
    απαιτούνται για την εισαγωγή νωπών κρεάτων
    με προέλευση ορισμένες αφρικανικές χώρες,
    ώστε να ληφθεί υπόψη η υγειονομική κατάσταση
    στη Νότια Αφρική και τη Σουαζιλάνδη (Κείμενο
