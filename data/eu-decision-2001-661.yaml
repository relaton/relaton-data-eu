title:
- language: en
  script: Latn
  content: '2001/661/EC: Commission Decision of 7 August 2001 amending Decision 1999/283/EC
    concerning the animal health conditions and veterinary certification for imports
    of fresh meat from certain African countries to take account of the animal health
    situation in South Africa and Swaziland (Text with EEA relevance) (notified under
    document number C(2001) 2481)'
  type: main
- language: fr
  script: Latn
  content: '2001/661/CE: Décision de la Commission du 7 août 2001 modifiant la décision
    1999/283/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays africains pour tenir compte de la situation zoosanitaire en Afrique
    du Sud et au Swaziland (Texte présentant de l''intérêt pour l''EEE) [notifiée
    sous le numéro C(2001) 2481]'
  type: main
- language: de
  script: Latn
  content: '2001/661/EG: Entscheidung der Kommission vom 7. August 2001 zur Änderung
    der Entscheidung 1999/283/EG über die Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von frischem Fleisch aus bestimmten afrikanischen Ländern im
    Zusammenhang mit der Tierseuchenlage in Südafrika und Swasiland (Text von Bedeutung
    für den EWR) (Bekannt gegeben unter Aktenzeichen K(2001) 2481)'
  type: main
- language: da
  script: Latn
  content: '2001/661/EF: Kommissionens beslutning af 7. august 2001 om ændring af
