  script: Latn
  content: '2001/661/EY: Komission päätös, tehty 7 päivänä elokuuta 2001, eläinten
    terveysvaatimuksista ja eläinlääkärintodistuksesta tuoreen lihan tuonnissa
    tietyistä Afrikan maista tehdyn päätöksen 1999/283/EY muuttamisesta eläinten
    terveystilanteen huomioon ottamiseksi Etelä-Afrikassa ja Swazimaassa (ETA:n kannalta
    merkityksellinen teksti) (tiedoksiannettu numerolla K(2001) 2481)'
  type: main
- language: it
  script: Latn
  content: '2001/661/CE: Decisione della Commissione, del 7 agosto 2001, che modifica
