    ved indførsel af fersk kød fra visse afrikanske lande for at tage hensyn til
    dyresundhedssituationen i Sydafrika og Swaziland (EØS-relevant tekst) (meddelt
    under nummer K(2001) 2481)'
  type: main
- language: el
  script: Grek
