  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1477 of 21 May 2025 supplementing
    Regulation (EU) 2024/1735 of the European Parliament and of the Council by specifying
    the rules on the identification of authorised oil and gas producers who are required
    to contribute to the objective of reaching the Union target for available CO2
    injection capacity by 2030, on the calculation of their respective contributions,
    and on their reporting obligations
  type: main
- language: fr
  script: Latn
