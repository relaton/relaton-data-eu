    le règlement (UE) 2024/1735 du Parlement européen et du Conseil afin de préciser
    les règles régissant le recensement des producteurs de pétrole et de gaz autorisés
    tenus de contribuer à l’objectif de capacité d’injection de CO2 disponible
    à l’échelle de l’Union d’ici à 2030, le calcul de leurs contributions
    respectives et leurs obligations de déclaration
  type: main
- language: de
  script: Latn
