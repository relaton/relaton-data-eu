    und Gasproduzenten, die zum Ziel der Erreichung des Unionsziels der verfügbaren
    CO2-Injektionskapazität bis 2030 beitragen müssen, für die Berechnung ihrer
    jeweiligen Beiträge und für ihre Berichterstattungspflichten
