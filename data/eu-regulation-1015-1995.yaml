  content: COMMISSION REGULATION (EC) No 1015/95 of 5 May 1995 laying down the extent
    to which applications lodged on 1 and 2 May 1995 for certificates for the advance-fixing
    of the export refund for certain poultrymeat products may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1015/95 DE LA COMMISSION du 5 mai 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats de
    préfixation de la restitution à l'exportation de certains produits du secteur
    de la viande de volaille introduites les 1er et 2 mai 1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1015/95 DER KOMMISSION vom 5. Mai 1995 zur Bestimmung
