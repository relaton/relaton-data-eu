    koskevien 1 ja 2 päivänä toukokuuta 1995 jätettyjen hakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1015/95 DELLA COMMISSIONE del 5 maggio 1995 che stabilisce
    in quale misura possano essere accettate le domande di titoli di prefissazione
    della restituzione all'esportazione di taluni prodotti del settore del pollame
    presentate il 1° e 2 maggio 1995
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1015/95 VAN DE COMMISSIE van 5 mei 1995 tot vaststelling
