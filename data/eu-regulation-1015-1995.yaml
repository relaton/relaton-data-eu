    des Geflügelfleischsektors gestellten Vorausfestsetzungsbescheinigungsanträgen
    stattgegeben wird
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1015/95 af 5. maj 1995 om fastsættelse
