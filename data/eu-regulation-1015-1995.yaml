    for visse produkter fra sektoren for fjerkrækød, indgivet den 1. og 2. maj 1995,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1015/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 5ης Μαΐου 1995 για τον καθορισμό του ορίου
    εντός του οποίου δύνανται να είναι αποδεκτές
    οι αιτήσεις για έκδοση πιστοποιητικού προκαθορισμού
    της επιστροφής κατά την εξαγωγή ορισμένων
