title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 566/2006 of 6 April 2006 amending and derogating
    from Regulation (EC) No 2014/2005 on licences under the arrangements for importing
    bananas into the Community in respect of bananas released into free circulation
    at the common customs tariff rate of duty and amending Regulation (EC) No 219/2006
    opening and providing for the administration of the tariff quota for bananas falling
    under CN code 08030019 originating in ACP countries for the period 1 March to
    31 December 2006
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 566/2006 de la Commission du 6 avril 2006 modifiant
    le règlement (CE) n o 2014/2005 relatif aux certificats dans le cadre du régime
    à l’importation de bananes dans la Communauté pour les bananes mises en libre
    pratique au taux du droit de douane du tarif douanier commun, dérogeant audit
    règlement et modifiant le règlement (CE) n o 219/2006 relatif à l'ouverture
    et au mode de gestion du contingent tarifaire pour l’importation de bananes
    du code NC 08030019 originaires des pays ACP pour la période allant du 1 er mars
    au 31 décembre 2006
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 566/2006 der Kommission vom 6. April 2006 zur Änderung
