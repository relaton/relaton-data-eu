    għall-importazzjoni tal-banana lejn il-Komunità f'dak li jirrigwarda l-banana
    li tkun tqiegħdet fiċ-ċirkulazzjoni ħielsa bir-rata tad-dazju tat-tariffa
    doganali komuni u li jemenda r-Regolament (KE) Nru 219/2006 dwar l-istabbiliment
    u l-amministrazzjoni tal-kwota tariffarja għall-importazzjoni tal-banana tal-kodiċi
    NM 0803 00 19 li toriġina mill-pajjiżi AKP għall-perjodu mill- 1 ta' Marzu
    sal- 31 ta' Diċembru 2006
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 566/2006 van de Commissie van 6 april 2006 houdende
    afwijking en wijziging van Verordening (EG) nr. 2014/2005 met betrekking tot de
    certificaten in het kader van de regeling voor de invoer in de Gemeenschap van
    bananen die in het vrije verkeer zijn gebracht met toepassing van het in het gemeenschappelijk
    douanetarief vastgestelde invoertarief, en houdende wijziging van Verordening
