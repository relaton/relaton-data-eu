    der Einfuhrregelung der Gemeinschaft für zum Zollsatz des Gemeinsamen Zolltarifs
    in den freien Verkehr überführte Bananen und zur Änderung der Verordnung (EG)
    Nr. 219/2006 zur Eröffnung und Verwaltung des Zollkontingents für die Einfuhr
    von Bananen des KN-Codes 08030019 mit Ursprung in den AKP-Staaten für die Zeit
    vom 1. März bis zum 31. Dezember 2006
  type: main
