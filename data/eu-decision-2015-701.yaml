    Europejskiego i Rady, żywności i paszy zawierających genetycznie zmodyfikowany
    rzepak oleisty GT73, składających się z niego lub z niego wyprodukowanych (notyfikowana
    jako dokument nr C(2015) 2786)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2015/701 da Comissão, de 24 de abril de 2015,
    que autoriza a colocação no mercado de géneros alimentícios que contenham
    ou sejam constituídos por colza geneticamente modificada GT73 ou de géneros
    alimentícios e alimentos para animais produzidos a partir desse organismo geneticamente
    modificado nos termos do Regulamento (CE) n.° 1829/2003 do Parlamento Europeu
    e do Conselho [notificada com o número C(2015) 2786]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/701 a Comisiei din 24 aprilie
    2015 de autorizare a introducerii pe piață a produselor alimentare care conțin
    sau constau din rapiță modificată genetic GT73 sau a produselor alimentare
    și a furajelor produse din respectivele organisme modificate genetic în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2015) 2786]
  type: main
