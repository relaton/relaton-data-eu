    overeenkomstig Verordening (EG) nr. 1829/2003 van het Europees Parlement en de
    Raad (Kennisgeving geschied onder nummer C(2015) 2786)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/701 z dnia 24 kwietnia 2015 r. zezwalająca
