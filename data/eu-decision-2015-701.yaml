  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/701 ze dne 24. dubna 2015, kterým
    se povoluje uvedení potravin, které obsahují geneticky modifikovanou řepku
    olejnou GT73 nebo z ní sestávají, nebo potravin a krmiv z tohoto geneticky
    modifikovaného organismu vyrobených na trh podle nařízení Evropského parlamentu
    a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2015) 2786)
  type: main
- language: da
  script: Latn
