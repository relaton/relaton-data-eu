    a géntechnológiával módosított GT73 olajrepcét tartalmazó vagy abból álló
    élelmiszerek, vagy az ezen géntechnológiával módosított szervezetből előállított
    élelmiszerek és takarmányok forgalomba hozatalának az 1829/2003/EK európai
    parlamenti és tanácsi rendelet szerinti engedélyezéséről (az értesítés
    a C(2015) 2786. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/701 della Commissione, del 24 aprile
    2015, che autorizza l'immissione sul mercato di alimenti contenenti o costituiti
    da colza geneticamente modificata GT73, o alimenti e mangimi prodotti a partire
    da tale organismo geneticamente modificato di cui al regolamento (CE) n. 1829/2003
    del Parlamento europeo e del Consiglio [notificata con il numero C(2015) 2786]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/701 (2015. gada 24. aprīlis),
    ar kuru atbilstīgi Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū pārtiku, kas satur ģenētiski modificēto eļļas rapsi GT73 vai
    sastāv no tā, vai pārtiku un lopbarību, kas ražota no šā ģenētiski modificētā
    organisma (izziņots ar dokumenta numuru C(2015) 2786)
  type: main
