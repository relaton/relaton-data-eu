    genetisk modificeret GT73-raps, eller fødevarer og foderstoffer, der er fremstillet
    af denne genetisk modificerede organisme, i henhold til Europa-Parlamentets og
    Rådets forordning (EF) nr. 1829/2003 (meddelt under nummer C(2015) 2786)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/701 της Επιτροπής,
