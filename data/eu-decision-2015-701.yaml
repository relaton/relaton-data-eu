title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/701 of 24 April 2015 authorising
    the placing on the market of food containing or consisting of genetically modified
    oilseed rape GT73, or food and feed produced from that genetically modified organism
    pursuant to Regulation (EC) No 1829/2003 of the European Parliament and of the
    Council (notified under document C(2015) 2786)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/701 de la Commission du 24 avril 2015
    autorisant la mise sur le marché de denrées alimentaires contenant le colza
    génétiquement modifié GT73 ou consistant en ce colza, ou de denrées alimentaires
    et d'aliments pour animaux produits à partir de cet organisme génétiquement
    modifié, en application du règlement (CE) n° 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2015) 2786]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/701 der Kommission vom 24. April 2015
    über die Zulassung des Inverkehrbringens von Lebensmitteln, die den genetisch
    veränderten Raps GT73 enthalten oder daraus bestehen, sowie von Lebensmitteln
    und Futtermitteln, die aus diesem genetisch veränderten Organismus hergestellt
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekanntgegeben unter Aktenzeichen C(2015) 2786)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/701 на Комисията
    от 24 април 2015 година за разрешаване на пускането
    на пазара на храни, съдържащи или състоящи
    се от генетично модифицирана маслодайна рапица
    GT73, или на храни и фуражи, произведени от този
    генетично модифициран организъм, съгласно
    Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета (нотифицирано под номер С(2015) 2786)
  type: main
