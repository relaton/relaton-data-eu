title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3249/75 of the Commission of 12 December 1975 authorizing
    the United Kingdom to suspend in part the component for protection of the processing
    industry as regards certain products of the cereals and rice sectors
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3249/75 de la Commission, du 12 décembre 1975, autorisant
    le Royaume-Uni à suspendre l' élément destiné à assurer la protection de
    l' industrie de transformation pour certains produits relevant des secteurs des
    céréales et du riz
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3249/75 der Kommission vom 12. Dezember 1975 zur Ermächtigung
    des Vereinigten Königreichs, den Bestandteil zum Schutz der Verarbeitungsindustrie
    für bestimmte Erzeugnisse der Sektoren Getreide und Reis teilweise auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3249/75 af 12. december 1975 om bemyndigelse
    af Det forenede Kongerige til, for visse produkter inden for kornsektoren og rissektoren,
    delvis at suspendere det element, der har til formål at sikre beskyttelsen af
    forarbejdningsindustrien
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3249/75 della Commissione, del 12 dicembre 1975, che
    autorizza il Regno Unito a sospendere parzialmente l' elemento destinato ad assicurare
    la protezione dell' industria di trasformazione per alcuni prodotti dei settori
    dei cereali e del riso
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3249/75 van de Commissie van 12 december 1975 houdende
    machtiging van het Verenigd Koninkrijk tot gedeeltelijke schorsing van het element
    ter bescherming van de verwerkende industrie voor bepaalde produkten van de sectoren
    granen en rijst
  type: main
