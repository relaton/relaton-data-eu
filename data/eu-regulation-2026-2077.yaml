  content: 'Commission Implementing Regulation (EU) 2026/2077 of 17 September 2026
    concerning the renewal of the authorisation of a preparation of benzoic acid,
    thymol, eugenol and piperine as a feed additive for chickens for fattening, chickens
    reared for laying, minor poultry species for fattening and minor poultry species
    reared for laying, the authorisation of that preparation as a feed additive for
