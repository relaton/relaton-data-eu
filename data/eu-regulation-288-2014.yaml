    al Parlamentului European și al Consiliului de stabilire a unor dispoziții comune
    privind Fondul european de dezvoltare regională, Fondul social european, Fondul
    de coeziune, Fondul european agricol pentru dezvoltare rurală și Fondul european
    pentru pescuit și afaceri maritime, precum și de stabilire a unor dispoziții
    generale privind Fondul european de dezvoltare regională, Fondul social european,
    Fondul de coeziune și Fondul european pentru pescuit și afaceri maritime cu
    privire la modelul pentru programele operaționale în cadrul obiectivului privind
    investițiile pentru creștere economică și locuri de muncă și în temeiul
    Regulamentului (UE) nr. 1299/2013 al Parlamentului European și al Consiliului
    privind dispoziții specifice pentru sprijinul din partea Fondului european de
    dezvoltare regională pentru obiectivul de cooperare teritorială europeană cu
    privire la modelul pentru programele de cooperare în cadrul obiectivului de cooperare
    teritorială europeană
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) č. 288/2014 z 25. februára 2014
    , ktorým sa stanovujú pravidlá podľa nariadenia Európskeho parlamentu a Rady
    (EÚ) č. 1303/2013, ktorým sa stanovujú spoločné ustanovenia o Európskom
    fonde regionálneho rozvoja, Európskom sociálnom fonde, Kohéznom fonde, Európskom
    poľnohospodárskom fonde pre rozvoj vidieka a Európskom námornom a rybárskom
    fonde a ktorým sa stanovujú všeobecné ustanovenia o Európskom fonde regionálneho
    rozvoja, Európskom sociálnom fonde, Kohéznom fonde a Európskom námornom a
    rybárskom fonde, pokiaľ ide o vzor operačných programov v rámci cieľa Investovanie
    do rastu a zamestnanosti, a podľa nariadenia Európskeho parlamentu a Rady (EÚ)
    č. 1299/2013 o osobitných ustanoveniach na podporu cieľa Európska územná
    spolupráca z Európskeho fondu regionálneho rozvoja, pokiaľ ide o vzor programov
    spolupráce v rámci cieľa Európska územná spolupráca
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) št. 288/2014 z dne 25. februarja 2014 o
    pravilih v skladu z Uredbo (EU) št. 1303/2013 Evropskega parlamenta in Sveta
    o skupnih določbah o Evropskem skladu za regionalni razvoj, Evropskem socialnem
    skladu, Kohezijskem skladu, Evropskem kmetijskem skladu za razvoj podeželja in
    Evropskem skladu za pomorstvo in ribištvo ter o splošnih določbah o Evropskem
    skladu za regionalni razvoj, Evropskem socialnem skladu, Kohezijskem skladu in
    Evropskem skladu za pomorstvo in ribištvo v zvezi vzorcem za operativne programe
    v okviru cilja „naložbe za rast in delovna mesta“ ter v skladu z Uredbo (EU)
    št. 1299/2013 Evropskega parlamenta in Sveta o posebnih določbah za podporo
    cilju „evropsko teritorialno sodelovanje“ iz Evropskega sklada za regionalni
    razvoj v zvezi z vzorcem za programe sodelovanja v okviru cilja „evropsko teritorialno
    sodelovanje“
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) n ° 288/2014 de la Comisión, de 25 de febrero
    de 2014 , que establece normas con arreglo al Reglamento (UE) n ° 1303/2013 del
    Parlamento Europeo y del Consejo, por el que se establecen disposiciones comunes
    relativas al Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al
    Fondo de Cohesión, al Fondo Europeo Agrícola de Desarrollo Rural y al Fondo
    Europeo Marítimo y de la Pesca, y por el que se establecen disposiciones generales
    relativas al Fondo Europeo de Desarrollo Regional, al Fondo Social Europeo, al
    Fondo de Cohesión y al Fondo Europeo Marítimo y de la Pesca, en relación con
    el modelo para los programas operativos en el marco del objetivo de inversión
    en crecimiento y empleo, y con arreglo al Reglamento (UE) n ° 1299/2013 del Parlamento
    Europeo y del Consejo, por el que se establecen disposiciones específicas relativas
    al apoyo del Fondo Europeo de Desarrollo Regional al objetivo de cooperación
    territorial europea, en relación con el modelo para los programas de cooperación
    en el marco del objetivo de cooperación territorial europea
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) nr 288/2014 av den 25 februari
    2014 om fastställande av regler i enlighet med Europaparlamentets och rådets
    förordning (EU) nr 1303/2013 om fastställande av gemensamma bestämmelser för
    Europeiska regionala utvecklingsfonden, Europeiska socialfonden, Sammanhållningsfonden,
    Europeiska jordbruksfonden för landsbygdsutveckling och Europeiska havs- och
    fiskerifonden och om fastställande av allmänna bestämmelser för Europeiska
    regionala utvecklingsfonden, Europeiska socialfonden, Sammanhållningsfonden och
    Europeiska havs- och fiskerifonden när det gäller mallen för operativa program
    inom målet Investering för tillväxt och sysselsättning och i enlighet med
    Europaparlamentets och rådets förordning (EU) nr 1299/2013 om särskilda bestämmelser
    för stöd från Europeiska regionala utvecklingsfonden till målet Europeiskt
    territoriellt samarbete när det gäller mallen för samarbetsprogram inom målet
    Europeiskt territoriellt samarbete
