    van de in artikel 8 van Richtlijn 91/496/EEG van de Raad bedoelde veterinaire
    controles te vergemakkelijken en tot intrekking van Beschikking 92/501/EEG'
  type: main
- language: pt
  script: Latn
  content: '93/79/CEE: Decisão da Comissão, de 22 de Dezembro de 1992, que estabelece
    determinadas medidas transitórias necessárias para facilitar a passagem para
    o novo regime relativo à organização de controlos veterinários referidos no
    artigo 8° da Directiva 91/496/CEE do Conselho e que revoga a Decisão 92/501/CEE'
  type: main
- language: es
  script: Latn
  content: '93/79/CEE: Decisión de la Comisión, de 22 de diciembre de 1992, por
    la que se establecen determinadas medidas transitorias necesarias para facilitar
    el paso el nuevo régimen relativo a la organización de los controles veterinarios
    mencionados en el artículo 8 de la Directiva 91/496/CEE del Consejo y por la
    que se deroga la Decisión 92/501/CEE'
