title:
- language: en
  script: Latn
  content: '93/79/EEC: Commission Decision of 22 December 1992 laying down certain
    transitional measures to facilitate transition to the new arrangements for the
    organization of veterinary checks provided for in Article 8 of Council Directive
    91/496/EEC and repealing Decision 92/501/EEC'
  type: main
- language: fr
  script: Latn
  content: '93/79/CEE: Décision de la Commission, du 22 décembre 1992, fixant certaines
    mesures transitoires nécessaires pour faciliter le passage au nouveau régime
    relatif à l'' organisation de contrôles vétérinaires visés à l'' article
    8 de la directive 91/496/CEE du Conseil et abrogeant la décision 92/501/CEE'
  type: main
- language: de
  script: Latn
  content: '93/79/EWG: Entscheidung der Kommission vom 22. Dezember 1992 mit Übergangsmaßnahmen
    zur Erleichterung der Umstellung auf die neue Regelung für die Veterinärkontrollen
    gemäß Artikel 8 der Richtlinie 91/496/EWG des Rates und zur Aufhebung der Entscheidung
    92/501/EWG'
  type: main
- language: da
  script: Latn
  content: '93/79/EØF: Kommissionens beslutning af 22. december 1992 om overgangsforanstaltninger
    for at lette overgangen til den nye ordning for veterinærkontrol som omhandlet
    i artikel 8 i Rådets direktiv 91/496/EØF og om ophævelse af beslutning 92/501/EØF'
  type: main
- language: el
  script: Grek
  content: '93/79/ΕΟΚ: Απόφαση της Επιτροπής της 22ας Δεκεμβρίου
    1992 για τον καθορισμό ορισμένων αναγκαίων μεταβατικών
    μέτρων για τη διευκόλυνση της υπαγωγής στο
    νέο καθεστώς σχετικά με την οργάνωση των κτηνιατρικών
    ελέγχων που αναφέρονται στο άρθρο 8 της οδηγίας
    91/496/ΕΟΚ του Συμβουλίου και για την κατάργηση
    της απόφασης 92/501/ΕΟΚ'
  type: main
- language: it
  script: Latn
  content: '93/79/CEE: Decisione della Commissione, del 22 dicembre 1992, che stabilisce
    talune misure transitorie necessarie ad agevolare il passaggio alla nuova disciplina
    dei controlli veterinari di cui all'' articolo 8 della direttiva 91/496/CEE del
    Consiglio e che abroga la decisione 92/501/CEE'
  type: main
- language: nl
  script: Latn
  content: '93/79/EEG: Beschikking van de Commissie van 22 december 1992 tot vaststelling
