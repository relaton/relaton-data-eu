  content: Commission Delegated Regulation (EU) 2023/2908 of 12 October 2023 amending
    Council Regulation (EC) No 32/2000 as regards the volumes of food preparations,
    processed shrimp of the species Pandalus borealis and certain plywood of coniferous
    species that may be imported under tariff quotas 09.0013, 09.0047, 09.0088 and
    09.0096
  type: main
- language: fr
  script: Latn
