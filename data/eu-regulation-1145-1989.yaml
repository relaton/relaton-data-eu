title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1145/89 of 28 April 1989 amending Regulation
    (EEC) No 643/86 laying down detailed rules for the application of the supplementary
    trade mechanism to the live plants and floriculture products imported into Portugal
    concerning the target ceilings for ornamental plants for 1989
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1145/89 de la Commission du 28 avril 1989 modifiant
    le règlement (CEE) n° 643/86 de la Commission déterminant les modalités d'application
    du mécanisme complémentaire aux échanges pour les produits du secteur des plantes
    vivantes et de la floriculture importés au Portugal, en ce qui concerne les plafonds
    indicatifs fixés pour les plantes ornementales, pour l'année 1989
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1145/89 DER KOMMISSION vom 28. April 1989 zur Aenderung
    der Verordnung (EWG) Nr. 643/86 mit Durchfuehrungsbestimmungen zum ergaenzenden
    Handelsmechanismus fuer die nach Portugal eingefuehrten Erzeugnisse des Sektors
    lebende Pflanzen und Waren des Blumenhandels betreffend die Richtplafonds fuer
    Zierpflanzen fuer das Jahr 1989
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1145/89 af 28. april 1989 om ændring
    af forordning (EØF) nr. 643/86 om gennemførelsesbestemmelser til den supplerende
    mekanisme for samhandelen med levende planter og blomsterdyrkningens produkter
    importeret i Portugal vedrørende de vejledende lofter for 1989 for prydplanter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1145/89 της Επιτροπής
    της 28ης Απριλίου 1989 που τροποποιεί τον κανονισμό
    (ΕΟΚ) αριθ. 643/86 που καθορίζει τις λεπτομέρειες
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές για τα προϊόντα του τομέα των
    ζωντανών φυτών και της ανθοκομίας που εισάγονται
    στην Πορτογαλία σε ότι αφορά τα ενδεικτικά
    όρια για το έτος 1989
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1145/89 DELLA COMMISSIONE del 28 aprile 1989 che modifica
    il golamento (CEE) n. 643/86 della Commissione, del 28 febbraio 1986, che fissa
    le modalità d'applicazione del meccanismo complementare applicabile agli scambi
    per i prodotti appartenenti al settore delle piante vive e della floricoltura
    importati in Portogallo per quanto riguarda i massimali indicativi per le piante
    ornamentali per l'anno 1989
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1145/89 VAN DE COMMISSIE van 28 april 1989 houdende
    wijziging van Verordening (EEG) nr. 643/86 tot vaststelling van de uitvoeringsbepalingen
    inzake de aanvullende regeling voor het handelsverkeer voor produkten van de sector
    levende planten en produkten van de bloementeelt ingevoerd in Portugal wat betreft
    de indicatieve plafonds voor sierplanten voor 1989
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 1145/89 DA COMISSAO de 28 de Abril de 1989 que altera
    o Regulamento (CEE) n* 643/86 da Comissao que determina as regras de execuçao
    do mecanismo complementar às trocas comerciais para os produtos do sector das
    plantas vivas e produtos de floricultura, importados em Portugal, no que se refere
    aos limites indicativos previstos para o ano de 1989 para as plantas ornamentais
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1145/89 DE LA COMISION de 28 de abril de 1989 que modifica
    el Reglamento (CEE) no 643/86, por el que se establecen normas para la aplicacion
    del mecanismo complementario aplicable a los intercambios para los productos del
    sector de las plantas vivas y de la floricultura importados en Portugal en lo
    que concierne a los limites maximos indicativos para el ano 1989
  type: main
