    00 med oprindelse i Polen, der drager fordel af toldlofter fastsat i Rådets forordning
    (EØF) nr. 3918/92
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2835/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Οκτωβρίου 1993 περί αποκαταστάσεως της
