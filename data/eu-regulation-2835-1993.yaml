    των κωδικών ΣΟ 3102 30 και 3102 80 00, καταγωγής Πολωνίας,
    δικαιούχου των προβλεπόμενων οροφών στον κανονισμό
    (ΕΟΚ) αριθ. 3918/92 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2835/93 DELLA COMMISSIONE del 18 ottobre 1993 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti dei codici
    NC 3102 30 e 3102 80 00, originari della Polonia, beneficiari di massimali tariffari
    previsti dal regolamento (CEE) n. 3918/92 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2835/93 VAN DE COMMISSIE van 18 oktober 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van de GN-codes 3102 30 en 3102 80 00, van oorsprong uit Polen, waarvoor de in
    Verordening (EEG) nr. 3918/92 van de Raad vermelde tariefmaxima zijn verleend
  type: main
- language: pt
