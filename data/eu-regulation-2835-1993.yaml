  content: COMMISSION REGULATION (EEC) No 2835/93 of 18 October 1993 re-establishing
    the levying of customs duties on products falling within CN codes 3102 30 and
    3102 80 00, originating in Poland, to which the tariff ceilings set out in Council
    Regulation (EEC) No 3918/92 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2835/93 de la Commission du 18 octobre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes NC 3102 30 et 3102 80 00 originaires de Pologne, bénéficiaires de
    plafonds tarifaires prévus par le règlement (CEE) n° 3918/92 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2835/93 DER KOMMISSION vom 18. Oktober 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren der KN-Codes 3102 30 und 3102 80 00 mit
    Ursprung in Polen, für die die in der Verordnung (EWG) Nr. 3918/92 des Rates
    vorgesehenen Zollplafonds gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2835/93 af 18. oktober 1993 om genindførelse
