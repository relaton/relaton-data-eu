    recante deroga al regolamento (CEE) n. 2637/70 per quanto concerne la durata di
    validità dei titoli d' importazione del riso originario e in provenienza da alcuni
    paesi lontani
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1167/72 van de Commissie van 5 juni 1972 tot wijziging
    van Verordening (EEG) nr. 2196/71 van de Commissie van 13 oktober 1971 houdende
    afwijking van Verordening (EEG) nr. 2637/70 ten aanzien van de geldigheidsduur
    van de invoercertificaten voor rijst van oorsprong en van herkomst uit bepaalde
    verafgelegen landen
