  content: Regulation (EEC) No 1167/72 of the Commission of 5 June 1972 amending Regulation
    (EEC) No 2196/71 of 13 October 1971 on a derogation from Regulation (EEC) No 2637/70
    as regards the period of validity of import licences for rice originating in and
    coming from certain distant countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1167/72 de la Commission, du 5 juin 1972, modifiant
    le règlement (CEE) n° 2196/71 de la Commission, du 13 octobre 1971, portant
    dérogation au règlement (CEE) n° 2637/70 en ce qui concerne la durée de validité
    des certificats d' importation pour le riz originaire et en provenance de certains
    pays éloignés
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1167/72 der Kommission vom 5. Juni 1972 zur Änderung
    der Verordnung (EWG) Nr. 2196/71 der Kommission vom 13. Oktober 1971 über eine
    Abweichung von der Verordnung (EWG) Nr. 2637/70 hinsichtlich der Geltungsdauer
    der Einfuhrlizenzen für Reis mit Ursprung in und Herkunft aus bestimmten entfernten
    Ländern
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1167/72 af 5. juni 1972 om ændring
    af Kommissionens forordning (EØF) nr. 2196/71 af 13. oktober 1971 om en undtagelse
    fra bestemmelserne i forordning (EØF) nr. 2637/70 med hensyn til gyldighedsfristen
    for importlicenser for ris, der har oprindelse i og som kommer fra visse fjerntliggende
    lande
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1167/72 della Commissione, del 5 giugno 1972, che
