title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2622/79 of 23 November 1979 laying down certain
    technical measures for the conservation of fishery resources applicable to vessels
    flying the flag of a Member State and fishing in the Regulatory Area defined in
    the NAFO Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2622/79 du Conseil, du 23 novembre 1979, fixant certaines
    mesures techniques de conservation des ressources de pêche applicables aux navires
    battant pavillon d' un État membre et pêchant dans la zone de réglementation
    définie par la convention NAFO
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2622/79 des Rates vom 23. November 1979 zur Festlegung
    bestimmter technischer Maßnahmen zur Erhaltung der Fischbestände für Fischereifahrzeuge
    unter der Flagge eines Mitgliedstaats, die im Regelungsbereich des NAFO-Übereinkommens
    fischen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2622/79 af 23. november 1979 om fastsættelse
    af visse tekniske foranstaltninger til bevarelse af fiskeressourcerne, der skal
    gælde for fartøjer, som fører en medlemsstats flag, og som udøver fiskeri
    i det regulerede område, der er defineret i NAFO-konventionen
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2622/79 τού Συμβουλίου
    τής 23ης Νοεμβρίου 1979 περί καθορισμού ορισμένων
    τεχνικών μέτρων διατηρήσεως τών αλιευτικών
    πόρων πού εφαρμόζονται στά σκάφη πού φέρουν
    σημαία ενός τών Κρατών μελών καί αλιεύουν στή
    ζώνη διακανονισμού πού καθορίζεται από τή
    σύμβαση NAFO
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2622/79 del Consiglio, del 23 novembre 1979, che stabilisce
    talune misure tecniche di conservazione delle risorse della pesca applicabili
    ai pescherecci battenti bandiera di uno Stato membro, che operano nella zona di
    regolamentazione definita nella convenzione NAFO
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2622/79 van de Raad van 23 november 1979 tot vaststelling
    van bepaalde technische maatregelen voor de instandhouding van de visbestanden
    van toepassing op vaartuigen die de vlag voeren van een Lid-Staat en vissen in
    de bij het NAFO-Verdrag vastgestelde reglementaire gebieden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2622/79 do Conselho, de 23 de Novembro de 1979,
    que fixa certas medidas técnicas de conservação dos recursos de pesca aplicáveis
    aos navios arvorando pavilhão de um Estado-membro e que pesquem na zona de regulamentação
    definida pela Convenção NAFO
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2622/79 del Consejo, de 23 de noviembre de 1979, por
    el que se establecen determinadas medidas técnicas de conservación de los recursos
    pesqueros aplicables a los buques con bandera de un Estado miembro y que faenen
    en la zona de reglamentación definida por el Convenio NAFO
