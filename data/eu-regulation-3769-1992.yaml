    kurių reikia imtis siekiant užkirsti kelią panaudoti tam tikras medžiagas
    neteisėtai narkotinių ir psichotropinių medžiagų gamybai
  type: main
- language: mt
  script: Latn
  content: Ir-Regolament tal-Kummissjoni (KEE) nru 3769/92 tal-21 ta’ Diċembru
    1992 li jimplimenta u jemenda r-Regolament tal-Kunsill (KEE) Nru 3677/90 li jistabilixxi
    miżuri li għandhom jittieħdu sabiex jiskoraġġixxu d-diverżjoni ta’ ċerti
    sustanzi lejn il-manifattura illegali ta’ drogi narkotiċi u sustanzi psikotropiċi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3769/92 van de Commissie van 21 december 1992 ter
    uitvoering en tot wijziging van Verordening (EEG) nr. 3677/90 van de Raad houdende
    maatregelen om te voorkomen dat bepaalde stoffen worden misbruikt voor de illegale
    vervaardiging van verdovende middelen en psychotrope stoffen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (EWG) nr 3769/92 z dnia 21 grudnia 1992 r. wykonujące
    i zmieniające rozporządzenie Rady (EWG) nr 3677/90 ustanawiające środki, które
    powinny być podjęte w celu uniemożliwiania wykorzystywania niektórych substancji
    do nielegalnego wytwarzania środków odurzających i substancji psychotropowych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 3769/92 da Comissão, de 21 de Dezembro de 1992,
    relativo à execução do Regulamento (CEE) nº 3677/90 que estabelece as medidas
    a adoptar para evitar o desvio de determinadas substâncias para o fabrico de
    estupefacientes e de substâncias psicotrópicas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EHS) č. 3769/92 z 21. decembra 1992, ktorým sa vykonáva,
    mení a dopĺňa nariadenie (EHS) č. 3677/90, ktorým sa stanovujú opatrenia,
    ktoré je potrebné prijať, aby sa zabránilo zneužívaniu určitých látok
    na nedovolenú výrobu omamných látok a psychotropných látok
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EGS) št. 3769/92 z dne 21. decembra 1992 o izvajanju
    in spremembah Uredbe Komisije (EGS) št. 3677/90 o določitvi ukrepov, sprejetih
    za preprečevanje zlorabe nekaterih snovi za nezakonito proizvodnjo mamil in drugih
    psihotropnih snovi
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 3769/92 de la Comisión, de 21 de diciembre de 1992,
    por el que se aplica y modifica el Reglamento (CEE) nº 3677/90 del Consejo relativo
    a las medidas que deben adoptarse para impedir el desvío de determinadas sustancias
    para la fabricación ilícita de estupefacientes y sustancias psicotrópicas
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EEG) nr 3769/92 av den 21 december 1992 om tillämpning
