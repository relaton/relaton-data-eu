title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3769/92 of 21 December 1992 implementing
    and amending Council Regulation (EEC) No 3677/90 laying down measures to be taken
    to discourage the diversion of certain substances to the illicit manufacture of
    narcotic drugs and psychotropic substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3769/92 de la Commission, du 21 décembre 1992, portant
    application et modification du règlement (CEE) n° 3677/90 du Conseil relatif
    aux mesures à prendre afin d'empêcher le détournement de certaines substances
    pour la fabrication illicite de stupéfiants ou de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3769/92 der Kommission vom 21. Dezember 1992 zur Durchführung
    und Änderung der Verordnung (EWG) Nr. 3677/90 des Rates über Maßnahmen gegen
    die Abzweigung bestimmter Stoffe zur unerlaubten Herstellung von Suchtstoffen
    und psychotropen Stoffen
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 3769/92 ze dne 21. prosince 1992, kterou se
    provádí a mění nařízení (EHS) č. 3677/90 o opatřeních, která mají
    být přijata za účelem zamezení zneužívání určitých látek k nedovolené
    výrobě omamných a psychotropních látek
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3769/92 af 21. december 1992 om gennemførelsesbestemmelser
    til og ændring af Rådets forordning (EØF) nr. 3677/90 om foranstaltninger til
    modvirkning af ulovlig anvendelse af visse stoffer til fremstilling af narkotika
    og psykotrope stoffer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3769/92 της Επιτροπής
    της 21ης Δεκεμβρίου 1992 για την εφαρμογή και
    τροποποίηση του κανονισμού (ΕΟΚ) αριθ. 3677/90
    του Συμβουλίου για τη θέσπιση μέτρων για την
    πρόληψη της διοχέτευσης ορισμένων ουσιών στην
    παράνομη παρασκευή ναρκωτικών και ψυχοτρόπων
    ουσιών
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EMÜ) nr 3769/92, 21. detsember 1992, millega rakendatakse
    ja muudetakse määrust (EMÜ) nr 3677/90, millega kehtestatakse meetmed, et tõkestada
    narkootiliste ja psühhotroopsete ainete ebaseaduslikuks valmistamiseks kasutatavate
    ainete levikut
  type: main
- language: fi
  script: Latn
  content: Komission asetus (ETY) N:o 3769/92, annettu 21 päivänä joulukuuta 1992,
    toimenpiteistä tiettyjen aineiden kulkeutumisen estämiseksi huumausaineiden
    tai psykotrooppisten aineiden laittomaan valmistukseen annetun neuvoston asetuksen
    (ETY) N:o 3677/90 soveltamisesta ja muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 3769/92/EGK rendelete (1992. december 21.) az egyes anyagok
    kábítószerek és pszichotróp anyagok tiltott előállítására való eltérítésének
    megakadályozására irányuló intézkedések megállapításáról szóló 3677/90/EGK
    rendelet végrehajtásáról és módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3769/92 della Commissione, del 21 dicembre 1992, concernente
    l'esecuzione e la modificazione del regolamento (CEE) n. 3677/90 del Consiglio,
    recante misure intese a scoraggiare la diversione di talune sostanze verso la
    fabbricazione illecita di stupefacenti o di sostanze psicotrope
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EEK) Nr. 3769/92 (1992. gada 21. decembris), ar ko īsteno
    un groza Padomes Regulu (EEK) Nr. 3677/90, ar kuru paredz pasākumus, kas jāveic,
    lai novērstu dažu vielu novirzīšanu narkotisko un psihotropo vielu nelikumīgai
    izgatavošanai
  type: main
- language: lt
  script: Latn
  content: Komisijos Reglamentas (EEB) Nr. 3769/92 1992 m. gruodžio 21 d. įgyvendinantis
