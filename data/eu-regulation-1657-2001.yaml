title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1657/2001 of 10 August 2001 amending Regulation
    (EC) No 603/1999 imposing a definitive anti-dumping duty on imports of polypropylene
    binder or baler twine originating in Poland, the Czech Republic and Hungary, and
    collecting definitively the provisional duty imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1657/2001 du Conseil du 10 août 2001 modifiant le
    règlement (CE) n° 603/1999 instituant un droit antidumping définitif sur les
    importations de ficelle lieuse ou botteleuse en polypropylène originaire de Pologne,
    de République tchèque et de Hongrie et portant perception définitive du droit
    antidumping provisoire
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1657/2001 des Rates vom 10. August 2001 zur Änderung
    der Verordnung (EG) Nr. 603/1999 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Binde- und Pressengarnen aus Polypropylen mit Ursprung in
    Polen, der Tschechischen Republik und Ungarn und zur endgültigen Vereinnahmung
    des vorläufigen Zolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1657/2001 af 10. august 2001 om ændring af
    forordning (EF) nr. 603/1999 om indførelse af en endelig antidumpingtold på
