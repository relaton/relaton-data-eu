  content: Commission Regulation (EEC) No 905/92 of 9 April 1992 adopting definitive
    measures on the issuing of STM licences for milk and milk products in regard to
    Spain
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 905/92 de la Commission du 9 avril 1992 arrêtant
    les mesures définitives concernant la délivrance des certificats «MCE» dans
    le secteur du lait et des produits laitiers en ce qui concerne l'Espagne
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 905/92 DER KOMMISSION vom 9. April 1992 zur Festlegung
    der zur Erteilung von EHM-Lizenzen für Milch und Milcherzeugnisse für Spanien
    zu treffenden endgültigen Maßnahmen#
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 905/92 af 9. april 1992 om fastsættelse
    af endelige foranstaltninger vedrørende udstedelse af SMS-licenser for mælk
    og mejeriprodukter for så vidt angår Spanien #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 905/92 της Επιτροπής
