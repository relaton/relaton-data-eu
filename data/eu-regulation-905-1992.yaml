    μέτρων ως προς την έκδοση των πιστοποιητικών
    ΣΜΣ στον τομέα του γάλακτος και των γαλακτοκομικών
    προϊόντων, όσον αφορά την Ισπανία
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 905/92 DELLA COMMISSIONE del 9 aprile 1992 recante
    misure definitive in materia di rilascio dei titoli MCS nel settore del latte
    e dei prodotti lattiero-caseari relativamente alla Spagna #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 905/92 VAN DE COMMISSIE van 9 april 1992 tot vaststelling
    van definitieve maatregelen betreffende de afgifte van ARH-certificaten in de
    sector melk en zuivelprodukten ten aanzien van Spanje #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 905/92 DA COMISSÃO de 9 de Abril de 1992 que adopta
    as medidas definitivas respeitantes à emissão de certificados « MCT » no sector
    do leite e dos produtos lácteos no que se refere a Espanha #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 905/92 DE LA COMISIÓN de 9 de abril de 1992 por el
    que se establecen las medidas definitivas relativas a la expedición de los certificados
    « MCI » en el sector de la leche y productos lácteos en lo que se refiere a
    España #'
