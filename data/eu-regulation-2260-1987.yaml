title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2260/87 of 29 July 1987 re-establishing
    the levying of customs duties on artificial flowers, foliage or fruit and parts
    thereof falling within heading 67.02 of the Common Customs Tariff originating
    in Hong Kong to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3924/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2260/87 de la Commission du 29 juillet 1987 portant
    rétablissement de la perception des droits de douane applicables aux fleurs,
    feuillages et fruits artificiels, et leurs parties, de la position 67.02 du tarif
    douanier commun, originaires de Hong-kong, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 3924/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2260/87 der Kommission vom 29. Juli 1987 zur Wiedereinführung
    der Erhebung der Zölle für künstliches Blattwerk, künstliche Blumen und Früchte
    sowie Teile davon der Tarifnummer 67.02 des Gemeinsamen Zolltarifs mit Ursprung
    in Hongkong, dem die in der Verordnung (EWG) Nr. 3924/86 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2260/87 af 29. juli 1987 om genindførelse
    af opkrævning af told for kunstige blomster, blade og frugter samt dele deraf
    henhørende under pos. 67.02 i den fælles toldtarif og med oprindelse i Hongkong,
    som er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3924/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2260/87 της Επιτροπής
    της 29ης Ιουλίου 1987 περί επαναφοράς της εισπράξεως
    τελωνειακών δασμών για άνθη, φυλλώματα, καρπούς,
    τεχνητά, και μέρη αυτών της κλάσεως 67.02 του
    κοινού δασμολογίου, καταγωγής Χονγκ Κονγκ,
    δικαιούχου των προβλεπομένων στον κανονισμό
    (ΕΟΚ) αριθ. 3924/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2260/87 della Commissione del 29 luglio 1987 che ripristina
    la riscossione dei dazi doganali applicabili ai fiori, foglie e frutti artificiali,
    e loro parti, della voce 67.02 della tariffa doganale comune, originari di Hong
    Kong beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n.
    3924/86 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2260/87 van de Commissie van 29 juli 1987 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kunstbloemen,
    kunstloofwerk en kunstvruchten, alsmede delen daarvan, van post 67.02 van het
    gemeenschappelijk douanetarief, van oorsprong uit Hong-Kong, waarvoor de in Verordening
    (EEG) nr. 3924/86 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2260/87 da Comissão de 29 de Julho de 1987 que
    restabelece a cobrança dos direitos aduaneiros aplicáveis a flores, folhagem
    e frutos, artificiais, e respectivas partes, da posição 67.02 da pauta aduaneira
    comum, originários de Hong Kong, beneficiário das preferências pautais previstas
    no Regulamento (CEE) n.° 3924/86 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2260/87 de la Comisión de 29 de julio de 1987 relativo
