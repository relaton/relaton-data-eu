    Tanacetum cinerariifolium ekstrahiranog ugljikovodičnim otapalima kao aktivne
    tvari za uporabu u biocidnim proizvodima vrste 19 u skladu s Uredbom (EU) br.
    528/2012 Europskog parlamenta i Vijeća
  type: main
- language: hu
  script: Latn
