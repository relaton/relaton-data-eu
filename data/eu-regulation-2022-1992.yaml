    19. produkta veida biocīdos lietojamu aktīvo vielu apstiprina Chrysanthemum
    cinerariaefolium ekstraktu, kas no atvērtiem un nogatavinātiem Tanacetum cinerariifolium
    ziediem iegūts ar šķīdinātājiem uz ogļūdeņraža bāzes
  type: main
