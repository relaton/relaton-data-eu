    blomster af Tanacetum cinerariifolium udvundet med kulbrinteopløsningsmidler
    som et aktivstof til anvendelse i biocidholdige produkter af produkttype 19, jf.
    Europa-Parlamentets og Rådets forordning (EU) nr. 528/2012
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1992 της Επιτροπής
