    a Tanacetum cinerariifolium kinyílt, érett virágaiból, szénhidrogén-oldószerrel
    kinyert Chrysanthemum cinerariaefolium-kivonat 19. terméktípusba tartozó biocid
    termékek hatóanyagaként történő felhasználásának az 528/2012/EU európai
    parlamenti és tanácsi rendelet szerinti jóváhagyásáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1992 della Commissione del 20 ottobre
