    от Chrysanthemum cinerariaefolium от разтворени и напълно
    развити цветове от Tanacetum cinerariifolium, извлечен
    с въглеводородни разтворители, като активно
    вещество за употреба в биоциди от продуктов
    тип 19 в съответствие с Регламент (ЕС) № 528/2012
    на Европейския парламент и на Съвета
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1992 ze dne 20. října 2022,
    kterým se schvaluje Chrysanthemum cinerariaefolium, výtažek z otevřených
    a zralých květů Tanacetum cinerariifolium, získaný uhlovodíkovými rozpouštědly
    jako účinná látka pro použití v biocidních přípravcích typu 19 v souladu
    s nařízením Evropského parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1992 af 20. oktober 2022
