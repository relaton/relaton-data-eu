    aus Aspergillus oryzae DSM 33700 als Zusatzstoff in Futtermitteln für Mastgeflügel,
    Absetzferkel, Mastschweine, laktierende Sauen und Legehennen, zur Änderung der
    Zulassungsbedingungen und zur Zulassung neuer Verwendungen dieser Zubereitung
    als Zusatzstoff in Futtermitteln für alle Geflügelarten und alle Suidae (Zulassungsinhaber:
    DSM Nutritional Products Ltd, vertreten durch DSM Nutritional Products Sp. z o.o.)
    und zur Aufhebung der Durchführungsverordnungen (EU) Nr. 1206/2012, (EU) 2020/995
    und (EU) 2020/1034'
