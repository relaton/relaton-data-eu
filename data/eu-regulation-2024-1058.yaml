title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2024/1058 of 10 April 2024 concerning
    the renewal of the authorisation of a preparation of endo–1,4-beta-xylanase
    produced by Aspergillus oryzae DSM 33700 as a feed additive for poultry for fattening,
    weaned piglets, pigs for fattening, lactating sows and laying hens, the change
    of the terms of the authorisation and authorisation of new uses of that preparation
    as a feed additive for all poultry species and all Suidae (holder of authorisation:
    DSM Nutritional Products Ltd, represented by DSM Nutritional Products Sp. z o.o.)
    and repealing Implementing Regulations (EU) No 1206/2012, (EU) No 2020/995 and
    (EU) 2020/1034'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2024/1058 de la Commission du 10 avril
    2024 concernant le renouvellement de l’autorisation d’une préparation d’endo–1,4-bêta-xylanase
    produite par Aspergillus oryzae DSM 33700 en tant qu’additif pour l’alimentation
    des volailles d’engraissement, des porcelets sevrés, des porcs d’engraissement,
    des truies allaitantes et des poules pondeuses, la modification des conditions
    de l’autorisation et l’autorisation de nouvelles utilisations de cette préparation
    en tant qu’additif pour l’alimentation de toutes les espèces de volailles
    et de tous les suidés (titulaire de l’autorisation: DSM Nutritional Products
    Ltd, représenté par DSM Nutritional Products Sp. z o.o.), et abrogeant les règlements
    d’exécution (UE) no 1206/2012, (UE) 2020/995 et (UE) 2020/1034'
  type: main
- language: de
  script: Latn
