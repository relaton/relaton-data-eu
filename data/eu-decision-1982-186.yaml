title:
- language: en
  script: Latn
  content: '82/186/EEC: Commission Decision of 26 February 1982 establishing that
    the apparatus described as ''Du Pont - automatic superspeed refrigerated centrifuge,
    model RC- 5B'' may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/186/CEE: Décision de la Commission, du 26 février 1982, constatant
    que l''importation de l''appareil dénommé "Du Pont-Automatic Superspeed Refrigerated
    Centrifuge, model RC-5B" ne peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/186/EWG: Entscheidung der Kommission vom 26. Februar 1982, mit der
    festgestellt wird, daß das Gerät ,,DU PONT-Automatic Superspeed Refrigerated
    Centrifuge, model RC-5B" nicht unter Befreiung von den Zöllen des Gemeinsamen
    Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/186/EØF: Kommissionens beslutning af 26. februar 1982 om fastslåelse
    af, at indførsel af apparatet "DU PONT - Automatic Superspeed Refrigerated Centrifuge,
    model RC- 5B" ikke kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: el
  script: Grek
  content: '82/186/EOK: Απόφαση τής Επιτροπής τής 26ης Φεβρουαρίου
    1982 περί διαπιστώσεως ότι η εισαγωγή τής συσκευής
    μέ τήν ονομασία «Du Pont automatic superspeed refrigerated centrifuge,
    model RC-5B» δέν δύναται νά πραγματοποιηθεί ατελώς
    ως πρός τούς δασμούς τού Κοινού Δασμολογίου'
  type: main
- language: it
  script: Latn
  content: '82/186/CEE: Decisione della Commissione, del 26 febbraio 1982, che stabilisce
    che l''importazione dell''apparecchio denominato "Du Pont automatic superspeed
    refrigerated centrifuge, model RC-5B" non può avvenire in franchigia dai dazi
    della tariffa doganale comune'
  type: main
- language: nl
  script: Latn
  content: '82/186/EEG: Beschikking van de Commissie van 26 februari 1982 waarbij
    wordt vastgesteld dat het apparaat genaamd ,,Du Pont - Automatic Superspeed Refrigerated
    Centrifuge, model RC-5B" niet met vrijstelling van de rechten van het gemeenschappelijk
    douanetarief mag worden ingevoerd'
  type: main
