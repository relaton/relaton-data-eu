  content: Council Regulation (EEC) No 2139/85 of 25 July 1985 amending Regulation
    (EEC) No 3247/81 on the financing by the European Agricultural Guidance and Guarantee
    Fund, Guarantee Section, of certain intervention measures, particularly those
    involving the buying in, storage and sale of agricultural products by intervention
    agencies
  type: main
- language: fr
  script: Latn
