---
id: EUDecision20241011
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/1011 of 25 March 2024 on the position to be
    taken on behalf of the Union within the GNSS EU/ASECNA Committee set up by the
    Cooperation Agreement between the European Union and the Agency for Aerial Navigation
    Safety in Africa and Madagascar (ASECNA) on the development of satellite navigation
    and the provision of associated services in ASECNA’s area of competence for
    the benefit of civil aviation, as regards the adoption of the rules of procedure
    of that Committee
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/1011 du Conseil du 25 mars 2024 relative à la position
    à prendre, au nom de l’Union, au sein du comité GNSS UE/ASECNA institué par
    l’accord de coopération entre l’Union européenne et l’Agence pour la sécurité
    de la navigation aérienne en Afrique et à Madagascar (ASECNA) relatif au développement
    de la radionavigation par satellite et à la fourniture des services associés
    dans la zone de compétence de l’ASECNA au profit de l’aviation civile, en
    ce qui concerne l’adoption du règlement intérieur dudit comité
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/1011 des Rates vom 25. März 2024 über den von der
    Union in dem durch das Kooperationsabkommen zwischen der Europäischen Union einerseits
    und der Agentur für die Sicherheit des Flugverkehrs in Afrika und Madagaskar
    (ASECNA) andererseits über die Entwicklung der Satellitennavigation und die Erbringung
    der damit verbundenen Dienste für die Zivilluftfahrt im Zuständigkeitsbereich
    der ASECNA eingerichteten GNSS-Ausschuss EU/ASECNA in Bezug auf die Annahme der
    Geschäftsordnung dieses Ausschusses zu vertretenden Standpunkt
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/1011 на Съвета от 25 март 2024
    година относно позицията, която трябва да се
    заеме от името на Съюза в рамките на комитета
    GNSS UE/ASECNA, създаден със Споразумението за сътрудничество
    между Европейския съюз и Агенцията за сигурност
    на въздухоплаването в Африка и Мадагаскар
    (ASECNA) относно развитието на спътниковата навигация
    и за предоставяне на свързаните с нея услуги
    в областта на компетентност на ASECNA, в полза
    на гражданското въздухоплаване във връзка
    с приемането на процедурния правилник на този
    комитет
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/1011 ze dne 25. března 2024 o postoji, který
    má Unie zaujmout ve Výboru GNSS EU/ASECNA zřízeném Dohodou o spolupráci
    mezi Evropskou unií a Agenturou pro bezpečnost letového provozu v Africe a
    na Madagaskaru (ASECNA) na vývoji družicové navigace a poskytování souvisejících
    služeb v oblasti působnosti ASECNA ve prospěch civilního letectví, pokud
    jde o přijetí jednacího řádu tohoto výboru
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2024/1011 af 25. marts 2024 om den holdning, der
    skal indtages på Unionens vegne i GNSS-udvalget EU/ASECNA, der er oprettet ved
    samarbejdsaftalen mellem Den Europæiske Union og Kontoret for Luftfartssikkerhed
    i Afrika og Madagaskar (ASECNA) om udvikling af satellitbaseret radionavigation
    og om levering af tilknyttede tjenester i ASECNA's kompetenceområde til fordel
    for den civile luftfart, til vedtagelsen af nævnte udvalgs forretningsorden
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2024/1011 του Συμβουλίου, της 25ης
    Μαρτίου 2024, σχετικά με τη θέση που πρέπει να
    ληφθεί εξ ονόματος της Ένωσης στο πλαίσιο της
    επιτροπής GNSS ΕΕ/ASECNA, που συστάθηκε με τη συμφωνία
    συνεργασίας μεταξύ της Ευρωπαϊκής Ένωσης,
    και του Οργανισμού για την Ασφάλεια της Αεροναυτιλίας
    στην Αφρική και τη Μαδαγασκάρη (ASECNA), σχετικά
    με την ανάπτυξη της δορυφορικής ραδιοπλοήγησης
    και την παροχή συναφών υπηρεσιών εντός της
    ζώνης αρμοδιότητας του ASECNA προς όφελος της
    πολιτικής αεροπορίας όσον αφορά την έγκριση
    του εσωτερικού κανονισμού της εν λόγω επιτροπής
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2024/1011, 25. märts 2024, liidu nimel võetava seisukoha
    kohta Euroopa Liidu ning Aafrika ja Madagaskari Lennuohutusameti (ASECNA) vahelise
    koostöölepinguga (mis käsitleb satelliitnavigatsiooni arendamist ja sellega
    seotud teenuste osutamist ASECNA pädevuspiirkonnas tsiviillennunduse huvides)
    moodustatud ELi/ASECNA GNSSi komitees seoses komitee kodukorra vastuvõtmisega
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2024/1011, annettu 25 päivänä maaliskuuta 2024,
    Euroopan unionin ja Afrikan ja Madagaskarin lentoturvallisuusviraston (ASECNA)
    välisellä satelliittinavigoinnin kehittämistä ja siihen liittyvien palvelujen
    tarjoamista siviili-ilmailua varten ASECNAn vastuualueella koskevalla yhteistyösopimuksella
    perustetussa EU:n ja ASECNAn GNSS-komiteassa unionin puolesta otettavasta kannasta
    kyseisen komitean työjärjestyksen hyväksymiseen
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2024/1011 ón gComhairle an 25 Márta 2024 maidir leis an
    seasamh atá le glacadh thar ceann an Aontais i gCoiste GNSS AE/ASECNA, arna bhunú
    faoin gComhaontú Comhair idir an tAontas Eorpach agus an Ghníomhaireacht um
    Shábháilteacht na hAerloingseoireachta san Afraic agus i Madagascar (ASECNA)
    maidir le forbairt na loingseoireachta satailíte agus soláthar seirbhísí gaolmhara
    i réimse inniúlachta ASECNA ar mhaithe leis an eitlíocht shibhialta, a mhéid
    a bhaineann le Rialacha Nós Imeachta an Choiste sin a ghlacadh
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2024/1011 od 25. ožujka 2024. o stajalištu koje treba
    zauzeti u ime Unije u okviru Odbora za GNSS EU-ASECNA osnovanog Sporazumom o suradnji
    između Europske unije i Agencije za sigurnost zračne plovidbe u Africi i Madagaskaru
    (ASECNA) u pogledu razvoja satelitske navigacije i pružanja povezanih usluga
    u području nadležnosti ASECNA-e u korist civilnog zrakoplovstva u vezi s donošenjem
    poslovnika Odbora za GNSS EU-ASECNA
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2024/1011 határozata (2024. március 25.) az Unió által
    az Európai Unió és az afrikai és madagaszkári léginavigációs biztonsággal
    foglalkozó ügynökség (ASECNA) közötti, az ASECNA illetékességi területén
    a polgári légi közlekedés javára a műholdas navigáció fejlesztéséről
    és a kapcsolódó szolgáltatások nyújtásáról szóló együttműködési
    megállapodással létrehozott EU/ASECNA GNSS-bizottságban az említett bizottság
    eljárási szabályzatának elfogadása tekintetében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/1011 del Consiglio, del 25 marzo 2024, relativa alla
    posizione da adottare, a nome dell’Unione, in sede di comitato GNSS UE/ASECNA
    istituito dall’accordo di cooperazione tra l’Unione europea, da una parte,
    e l’Agenzia per la sicurezza della navigazione aerea in Africa e Madagascar
    (ASECNA), dall’altra, relativo allo sviluppo della navigazione satellitare e
    alla fornitura dei servizi associate nella zona di competenza dell’ASECNA a
    beneficio dell’aviazione civile riguardo all’adozione del suo regolamento
    interno
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2024/1011 (2024. gada 25. marts) par nostāju, kas
    Savienības vārdā jāieņem ES un ASECNA GNSS komitejā, kura izveidota ar Sadarbības
    nolīgumu starp Eiropas Savienību un Aeronavigācijas drošības aģentūru Āfrikā
    un Madagaskarā (ASECNA) par satelītnavigācijas attīstību un saistīto pakalpojumu
    sniegšanu ASECNA kompetences zonā par labu civilajai aviācijai, attiecībā
    uz minētās komitejas reglamenta pieņemšanu
  type: main
- language: lt
  script: Latn
  content: 2024 m. kovo 25 d. Tarybos sprendimas (ES) 2024/1011 dėl pozicijos, kurios
    Sąjunga turi laikytis ES ir ASECNA GNSS komitete, įsteigtame Europos Sąjungos
    ir Oro navigacijos saugos Afrikoje ir Madagaskare agentūros (ASECNA) bendradarbiavimo
    susitarimu dėl palydovinės navigacijos plėtros ir susijusių paslaugų teikimo
    ASECNA kompetencijos teritorijoje civilinės aviacijos reikmėms, dėl minėto
    komiteto darbo tvarkos taisyklių priėmimo
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/1011 tal-25 ta’ Marzu 2024 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni fil-Kumitat GNSS UE/ASECNA stabbilit
    bil-Ftehim ta’ Kooperazzjoni bejn l-Unjoni Ewropea u l-Aġenzija għas-Sigurtà
    tan-Navigazzjoni bl-Ajru fl-Afrika u f’Madagascar (ASECNA) dwar l-iżvilupp
    tar-radjunavigazzjoni bis-satellita u l-għoti ta’ servizzi relatati fil-qasam
    ta’ kompetenza tal-ASECNA għall-benefiċċju tal-avjazzjoni ċivili, fir-rigward
    tal-adozzjoni tar-regoli ta’ proċedura ta’ dak il-Kumitat
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2024/1011 van de Raad van 25 maart 2024 betreffende het door
    de Unie in te nemen standpunt in het GNSS-comité EU/ASECNA dat is opgericht bij
    de Samenwerkingsovereenkomst tussen de Europese Unie en het Agentschap voor luchtvaartveiligheid
    in Afrika en Madagaskar (ASECNA) inzake de ontwikkeling van satellietnavigatie
    en de verlening van bijbehorende diensten ten behoeve van de burgerluchtvaart
    in het bevoegdheidsgebied van het ASECNA, over de vaststelling van het reglement
    van orde van dat comité
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2024/1011 z dnia 25 marca 2024 r. w sprawie stanowiska,
    jakie powinno zostać zajęte w imieniu Unii w ramach Komitetu UE/ASECNA ds. GNSS
    ustanowionego umową o współpracy między Unią Europejską a Agencją Bezpieczeństwa
    Lotniczego w Afryce i na Madagaskarze (ASECNA), dotyczącą rozwoju nawigacji
    satelitarnej oraz zapewniania na rzecz lotnictwa cywilnego powiązanych służb
    w zakresie kompetencji ASECNA, w odniesieniu do przyjęcia regulaminu wewnętrznego
    komitetu
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2024/1011 do Conselho, de 25 de março de 2024, sobre a posição
    a tomar em nome da União no âmbito do Comité criado pelo Acordo de Cooperação
    entre a União Europeia e a Agência para a Segurança da Navegação Aérea em
    África e em Madagáscar (ASECNA) relativo ao desenvolvimento da navegação por
    satélite e à prestação de serviços conexos na zona de competência da ASECNA,
    em benefício da aviação civil, no que diz respeito à adoção do regulamento
    interno desse comité
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2024/1011 a Consiliului din 25 martie 2024 privind poziția
    care urmează să fie adoptată, în numele Uniunii, în cadrul Comitetului GNSS
    UE/ASECNA instituit prin Acordul de cooperare dintre Uniunea Europeană și Agenția
    pentru Siguranța Navigației Aeriene în Africa și Madagascar (ASECNA) privind
    dezvoltarea sistemelor de radionavigație prin satelit și furnizarea de servicii
    conexe în zona de competență a ASECNA în beneficiul aviației civile, în
    ceea ce privește adoptarea regulamentului de procedură al comitetului respectiv
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/1011 z 25. marca 2024 o pozícii, ktorá sa
    má v mene Únie zaujať vo Výbore EÚ/ASECNA pre GNSS zriadenom Dohodou o spolupráci
    medzi Európskou úniou a Agentúrou pre bezpečnosť leteckej prevádzky v Afrike
    a na Madagaskare (ASECNA) týkajúcou sa rozvoja satelitnej navigácie a poskytovania
    súvisiacich služieb v oblasti pôsobnosti agentúry ASECNA v prospech civilného
    letectva, pokiaľ ide o prijatie rokovacieho poriadku uvedeného výboru
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/1011 z dne 25. marca 2024 o stališču, ki se v imenu
    Unije zastopa v Odboru za GNSS EU/ASECNA, ustanovljenem s Sporazumom o sodelovanju
    med Evropsko unijo in Agencijo za varnost letalske navigacije v Afriki in na Madagaskarju
    (ASECNA) v zvezi z razvojem satelitske navigacije in zagotavljanjem povezanih
    storitev na območju pristojnosti Agencije ASECNA za civilno letalstvo, glede
    sprejetja njegovega poslovnika
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/1011 del Consejo, de 25 de marzo de 2024, relativa
    a la posición que debe adoptarse, en nombre de la Unión, en el Comité de los
    GNSS UE/ASECNA creado por el Acuerdo de cooperación entre la Unión Europea y
    la Agencia para la Seguridad de la Navegación Aérea en África y Madagascar
    (ASECNA) relativo al desarrollo de la radionavegación por satélite y a la prestación
    de los servicios conexos en la zona de competencia de la ASECNA en beneficio de
    la aviación civil, en lo que respecta a la adopción del reglamento interno de
    dicho Comité
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/1011 av den 25 mars 2024 om den ståndpunkt som
    ska intas på unionens vägnar i GNSS-kommittén EU/ASECNA, som inrättades genom
    samarbetsavtalet mellan Europeiska unionen och byrån för flygtrafiksäkerhet
    i Afrika och Madagaskar (ASECNA) om utveckling av satellitnavigering och tillhandahållande
    av tilläggstjänster för civil flygtrafik inom ASECNA:s behörighetsområde,
    vad gäller antagandet av gemensamma kommitténs arbetsordning
  type: main
