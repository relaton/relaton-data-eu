  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2001/19/EG av den 14 maj 2001 om
    ändring av rådets direktiv 89/48/EEG och 92/51/EEG om den generella ordningen
    för erkännande av yrkeskvalifikationer och av rådets direktiv 77/452/EEG, 77/453/EEG,
