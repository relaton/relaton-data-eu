title:
- language: en
  script: Latn
  content: Directive 2001/19/EC of the European Parliament and of the Council of 14
    May 2001 amending Council Directives 89/48/EEC and 92/51/EEC on the general system
    for the recognition of professional qualifications and Council Directives 77/452/EEC,
    77/453/EEC, 78/686/EEC, 78/687/EEC, 78/1026/EEC, 78/1027/EEC, 80/154/EEC, 80/155/EEC,
    85/384/EEC, 85/432/EEC, 85/433/EEC and 93/16/EEC concerning the professions of
    nurse responsible for general care, dental practitioner, veterinary surgeon, midwife,
    architect, pharmacist and doctor (Text with EEA relevance.) - Statements
  type: main
- language: fr
  script: Latn
  content: Directive 2001/19/CE du Parlement européen et du Conseil du 14 mai 2001
    modifiant les directives 89/48/CEE et 92/51/CEE du Conseil concernant le système
    général de reconnaissance des qualifications professionnelles, et les directives
    77/452/CEE, 77/453/CEE, 78/686/CEE, 78/687/CEE, 78/1026/CEE, 78/1027/CEE, 80/154/CEE,
    80/155/CEE, 85/384/CEE, 85/432/CEE, 85/433/CEE et 93/16/CEE du Conseil concernant
    les professions d'infirmier responsable des soins généraux, de praticien de
    l'art dentaire, de vétérinaire, de sage-femme, d'architecte, de pharmacien et
    de médecin (Texte présentant de l'intérêt pour l'EEE.) - Déclarations
  type: main
- language: de
  script: Latn
  content: Richtlinie 2001/19/EG des Europäischen Parlaments und des Rates vom 14.
    Mai 2001 zur Änderung der Richtlinien 89/48/EWG und 92/51/EWG des Rates über
    eine allgemeine Regelung zur Anerkennung beruflicher Befähigungsnachweise und
    der Richtlinien 77/452/EWG, 77/453/EWG, 78/686/EWG, 78/687/EWG, 78/1026/EWG, 78/1027/EWG,
    80/154/EWG, 80/155/EWG, 85/384/EWG, 85/432/EWG, 85/433/EWG und 93/16/EWG des Rates
    über die Tätigkeiten der Krankenschwester und des Krankenpflegers, die für
    die allgemeine Pflege verantwortlich sind, des Zahnarztes, des Tierarztes, der
    Hebamme, des Architekten, des Apothekers und des Arztes (Text von Bedeutung für
    den EWR.) - Erklärung
  type: main
- language: bg
  script: Cyrl
  content: Директива 2001/19/ЕО на Европейския парламент
    и на Съвета от 14 май 2001 година за изменение
    на Директиви 89/48/ЕИО и 92/51/ЕИО на Съвета относно
    общата система за признаване на професионални
    квалификации и Директиви 77/452/ЕИО, 77/453/ЕИО, 78/686/ЕИО,
    78/687/ЕИО, 78/1026/ЕИО, 78/1027/ЕИО, 80/154/ЕИО, 80/155/ЕИО, 85/384/ЕИО,
    85/432/ЕИО, 85/433/ЕИО и 93/16/ЕИО на Съвета относно
    се професиите на медицинска сестра, отговаряща
    за общомедицински грижи, на практикуващ стоматолог,
    на ветеринарен лекар, на акушерка, на архитект,
    на фармацевт и на лекар
  type: main
- language: cs
  script: Latn
  content: Směrnice Evropského parlamentu a Rady 2001/19/ES ze dne 14. května 2001,
    kterou se mění směrnice Rady 89/48/EHS a 92/51/EHS o obecném systému pro
    uznávání odborných kvalifikací a směrnice Rady 77/452/EHS, 77/453/EHS, 78/686/EHS,
    78/687/EHS, 78/1026/EHS, 78/1027/EHS, 80/154/EHS, 80/155/EHS, 85/384/EHS, 85/432/EHS,
    85/433/EHS a 93/16/EHS o povolání zdravotní sestry odpovědné za všeobecnou
    péči (ošetřovatele odpovědného za všeobecnou péči), zubního lékaře,
    veterinárního lékaře, porodní asistentky, architekta, farmaceuta a lékaře
  type: main
- language: da
  script: Latn
  content: 'Europa-Parlamentets og Rådets direktiv 2001/19/EF af 14. maj 2001 om
    ændring af Rådets direktiv 89/48/EØF og 92/51/EØF om den generelle ordning
    for anerkendelse af erhvervsuddannelser og om ændring af Rådets direktiv 77/452/EØF,
    77/453/EØF, 78/686/EØF, 78/687/EØF, 78/1026/EØF, 78/1027/EØF, 80/154/EØF,
    80/155/EØF, 85/384/EØF, 85/432/EØF, 85/433/EØF og 93/16/EØF om følgende
    erhverv: sygeplejersker med ansvar for den almene sundheds- og sygepleje, tandlæger,
    dyrlæger, jordemødre, arkitekter, farmaceuter og læger (EØS-relevant tekst)
    - Erklæringer'
  type: main
- language: el
  script: Grek
  content: Οδηγία 2001/19/ΕΚ του Ευρωπαϊκού Κοινοβουλίου
    και του Συμβουλίου της 14ης Μαΐου 2001 που τροποποιεί
    τις οδηγίες 89/48/ΕΟΚ και 92/51/ΕΟΚ του Συμβουλίου
    σχετικά με ένα γενικό σύστημα αναγνώρισης
    των επαγγελματικών προσόντων καθώς και τις
    οδηγίες 77/452/ΕΟΚ, 77/453/ΕΟΚ, 78/686/ΕΟΚ, 78/687/ΕΟΚ, 78/1026/ΕΟΚ,
    78/1027/ΕΟΚ, 80/154/ΕΟΚ, 80/155/ΕΟΚ, 85/384/ΕΟΚ, 85/432/ΕΟΚ, 85/433/ΕΟΚ
    και 93/16/ΕΟΚ του Συμβουλίου που αφορούν το επάγγελμα
    του νοσηλευτού υπεύθυνου για γενικές φροντίδες,
    του οδοντιάτρου, του κτηνιάτρου, της μαίας,
    του αρχιτέκτονα, του φαρμακοποιού και του ιατρού
    (Κείμενο που παρουσιάζει ενδιαφέρον για τον
    ΕΟΧ) - Δηλώσεις
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi Ja Nõukogu direktiiv 2001/19/EÜ, 14. mai 2001, millega
    muudetakse nõukogu direktiive 89/48/EMÜ ja 92/51/EMÜ kutsekvalifikatsiooni
    tunnustamise üldsüsteemi kohta ja nõukogu direktiive 77/452/EMÜ, 77/453/EMÜ,
    78/686/EMÜ, 78/687/EMÜ, 78/1026/EMÜ, 78/1027/EMÜ, 80/154/EMÜ, 80/155/EMÜ,
    85/384/EMÜ, 85/432/EMÜ, 85/433/EMÜ ja 93/16/EMÜ, mis käsitlevad üldõdede,
    hambaarstide, veterinaaride, ämmaemandate, arhitektide, farmatseutide ja arstide
    kutsealasid
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston direktiivi 2001/19/EY, annettu 14 päivänä
    toukokuuta 2001, ammatillisen koulutuksen tunnustamista koskevasta yleisestä
    järjestelmästä annettujen neuvoston direktiivien 89/48/ETY ja 92/51/ETY sekä
    yleissairaanhoidosta vastaavien sairaanhoitajien, hammaslääkäreiden, eläinlääkäreiden,
    kätilöiden, arkkitehtien, farmasian alan ja lääkäreiden toimintaa koskevien
    direktiivien 77/452/ETY, 77/453/ETY, 78/686/ETY, 78/687/ETY, 78/1026/ETY, 78/1027/ETY,
    80/154/ETY, 80/155/ETY, 85/384/ETY, 85/432/ETY, 85/433/ETY ja 93/16/ETY muuttamisesta
    (ETA:n kannalta merkityksellinen teksti.) - Lausumat
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 2001/19/EK irányelve (2001. május
    14.) a szakképesítések elismerésének általános rendszeréről szóló 89/48/EGK
    és 92/51/EGK tanácsi irányelv, valamint az általános ápolói, a fogorvosi,
    az állatorvosi, a szülésznői, az építészmérnöki, a gyógyszerészi és
    az orvosi hivatásról szóló 77/452/EGK, 77/453/EGK, 78/686/EGK, 78/687/EGK,
    78/1026/EGK, 78/1027/EGK, 80/154/EGK, 80/155/EGK, 85/384/EGK, 85/432/EGK, 85/433/EGK
    és 93/16/EGK tanácsi irányelv módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 2001/19/CE del Parlamento europeo e del Consiglio, del 14 maggio
    2001, che modifica le direttive 89/48/CEE e 92/51/CEE del Consiglio relative al
    sistema generale di riconoscimento delle qualifiche professionali e le direttive
    77/452/CEE, 77/453/CEE, 78/686/CEE, 78/687/CEE, 78/1026/CEE, 78/1027/CEE, 80/154/CEE,
    80/155/CEE, 85/384/CEE, 85/432/CEE, 85/433/CEE e 93/16/CEE del Consiglio concernenti
    le professioni di infermiere responsabile dell'assistenza generale, dentista,
    veterinario, ostetrica, architetto, farmacista e medico (Testo rilevante ai fini
    del SEE) - Dichiarazioni
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta Un Padomes Direktīva 2001/19/EK (2001. gada 14. maijs),
    ar kuru groza Padomes Direktīvu 89/48/EEK un Padomes Direktīvu 92/51/EEK par
    vispārēju sistēmu profesionālo kvalifikāciju atzīšanai, kā arī Padomes
    Direktīvu 77/452/EEK, Padomes Direktīvu 77/453/EEK, Padomes Direktīvu 78/686/EEK,
    Padomes Direktīvu 78/687/EEK, Padomes Direktīvu 78/1026/EEK, Padomes Direktīvu
    78/1027/EEK, Padomes Direktīvu 80/154/EEK, Padomes Direktīvu 80/155/EEK, Padomes
    Direktīvu 85/384/EEK, Padomes Direktīvu 85/432/EEK, Padomes Direktīvu 85/433/EEK
    un Padomes Direktīvu 93/16/EEK attiecībā uz vispārējās aprūpes māsu, zobārstu,
    veterinārārstu, vecmāšu, arhitektu, farmaceitu un ārstu profesijām (Dokuments
    attiecas uz Eiropas ekonomisko zonu)
  type: main
- language: lt
  script: Latn
  content: 2001 m. gegužės 14 d. Europos Parlamento Ir Tarybos Direktyva 2001/19/Eb
    iš dalies keičianti Tarybos direktyvas 89/48/EEB ir 92/51/EEB dėl profesinių
    kvalifikacijų pripažinimo bendrosios sistemos ir Tarybos direktyvas 77/452/EEB,
    77/453/EEB, 78/686/EEB, 78/687/EEB, 78/1026/EEB, 78/1027/EEB, 80/154/EEB, 80/155/EEB,
    85/384/EEB, 85/432/EEB, 85/433/EEB ir 93/16/EEB dėl bendrosios praktikos slaugytojo,
    dantų gydytojo, veterinarijos gydytojo, akušerio, architekto, vaistininko ir
    gydytojo profesijų
  type: main
- language: mt
  script: Latn
  content: Id-direttiva 2001/19/KE Tal-parlament Ewropew U Tal-kunsill ta’ l-14
    ta’ Mejju 2001 li temenda d-Direttivi tal-Kunsill 89/48/KEE u 92/51/KEE dwar
    is-sistema ġenerali ta’ rikonoxximent ta’ kwalifiki professjonali u d-Direttivi
    tal-Kunsill 77/452/KEE, 77/453/KEE, 78/686/KEE, 78/687/KEE, 78/1026/KEE, 78/1027/KEE,
    80/154/KEE, 80/155/KEE, 85/384/KEE, 85/432/KEE, 85/433/KEE u 93/16/KEE li jikkonċernaw
    il-professjonijiet ta’ l-infermier responsabbli mill-kura ġenerali, tad-dentist,
    tal-kirurgu veterinarju, tal-qabla, ta’ l-arkitett, tal-farmaċista u tat-tabib
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2001/19/EG van het Europees Parlement en de Raad van 14 mei 2001
    tot wijziging van de Richtlijnen 89/48/EEG en 92/51/EEG van de Raad betreffende
    het algemeen stelsel van erkenning van beroepskwalificaties en de Richtlijnen
    77/452/EEG, 77/453/EEG, 78/686/EEG, 78/687/EEG, 78/1026/EEG, 78/1027/EEG, 80/154/EEG,
    80/155/EEG, 85/384/EEG, 85/432/EEG, 85/433/EEG en 93/16/EEG van de Raad betreffende
