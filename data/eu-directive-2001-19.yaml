  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2001/19/ES zo 14. mája 2001, ktorou
    sa menia a dopĺňajú smernice Rady 89/48/EHS a 92/51/EHS o všeobecnom systéme
    uznávania odborných kvalifikácií a smernice Rady 77/452/EHS, 77/453/EHS, 78/686/EHS,
    78/687/EHS, 78/1026/EHS, 78/1027/EHS, 80/154/EHS, 80/155/EHS, 85/384/EHS, 85/432/EHS,
    85/433/EHS a 93/16/EHS, týkajúce sa povolaní zdravotná sestra zodpovedná
