    farmacêutico e médico (Texto relevante para efeitos do EEE) - Declarações
  type: main
- language: ro
  script: Latn
  content: Directiva 2001/19/CE a Parlamentului European și a Consiliului din 14
    mai 2001 de modificare a directivelor 89/48/CEE și 92/51/CEE ale Consiliului
    privind sistemul general de recunoaștere a calificărilor profesionale și a
    directivelor 77/452/CEE, 77/453/CEE, 78/686/CEE, 78/687/CEE, 78/1026/CEE, 78/1027/CEE,
