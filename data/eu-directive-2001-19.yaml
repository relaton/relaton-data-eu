    architekt, farmaceut a lekár
  type: main
- language: sl
  script: Latn
  content: Direktiva 2001/19/ES Evropskega parlamenta in Sveta z dne 14. maja 2001,
    o spremembah Direktiv Sveta 89/48/EGS in 92/51/EGS o splošnem sistemu priznavanja
    poklicnih kvalifikacij in Direktiv Sveta 77/452/EGS, 77/453/EGS, 78/686/EGS, 78/687/EGS,
    78/1026/EGS, 78/1027/EGS, 80/154/EGS, 80/155/EGS, 85/384/EGS, 85/432/EGS, 85/433/EGS
