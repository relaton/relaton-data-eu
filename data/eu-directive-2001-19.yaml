    de EER relevante tekst.) - Verklaringen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2001/19/WE Parlamentu Europejskiego i Rady z dnia 14 maja 2001
    r. zmieniająca dyrektywy Rady 89/48/EWG i 92/51/EWG w sprawie ogólnego systemu
    uznawania kwalifikacji zawodowych oraz dyrektywy Rady 77/452/EWG/, 77/453/EWG,
    78/686/EWG, 78/687/EWG, 78/1026/EWG, 78/1027/EWG, 80/154/EWG, 80/155/EWG, 85/384/EWG,
    85/432/EWG, 85/433/EWG i 93/16/EWG dotyczące zawodów pielęgniarki ogólnej,
    lekarza dentysty, lekarza weterynarii, położnej, architekta, farmaceuty i lekarza
  type: main
- language: pt
  script: Latn
  content: Directiva 2001/19/CE do Parlamento Europeu e do Conselho, de 14 de Maio
    de 2001, que altera as Directivas 89/48/CEE e 92/51/CEE, relativas ao sistema
    geral de reconhecimento das formações profissionais, e as Directivas 77/452/CEE,
    77/453/CEE, 78/686/CEE, 78/687/CEE, 78/1026/CEE, 78/1027/CEE, 80/154/CEE, 80/155/CEE,
    85/384/CEE, 85/432/CEE, 85/433/CEE e 93/16/CEE relativas às profissões de enfermeiro
