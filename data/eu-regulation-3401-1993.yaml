title:
- language: en
  script: Latn
  content: COUNCIL REGULATION (EC) No 3401/93 of 7 December 1993 amending, with respect
    to sprats and cod, Regulation (EEC) No 3919/92 fixing, for certain fish stocks
    and groups of fish stocks, the total allowable catches for 1993 and certain conditions
    under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3401/93 du Conseil du 7 décembre 1993 modifiant, en
    ce qui concerne le sprat et le cabillaud, le règlement (CEE) n° 3919/92 fixant,
    pour certains stocks ou groupes de stocks de poissons, les totaux admissibles
    des captures pour 1993 et certaines conditions dans lesquelles ils peuvent être
    pêchés
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 3401/93 DES RATES vom 7. Dezember 1993 zur Änderung
    der Verordnung (EWG) Nr. 3919/92 zur Festlegung der zulässigen Gesamtfangmengen
    (TAC) und entsprechender Fangbedingungen für bestimmte Fischbestände oder Bestandsgruppen
    für 1993 hinsichtlich Sprotten und Dorschen
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 3401/93 af 7. december 1993 om ændring for
    så vidt angår brisling og torsk af forordning (EØF) nr. 3919/92 om fastsættelse
    for 1993 af de samlede fangstmængder for visse fiskebestande og grupper af fiskebestande
    samt af visse betingelser for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 3401/93 ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ
    της 7ης Δεκεμβρίου 1993 για την τροποποίηση όσον
    αφορά τη σαρδελόρεγγα και το γάδο, του κανονισμού
    (ΕΟΚ) αριθ. 3919/92 για τον καθορισμό, για ορισμένα
    αποθέματα ιχθύων ή ομάδες αποθεμάτων ιχθύων,
    του συνόλου επιτρεπομένων αλιευμάτων για το
    1993 και ορισμένων όρων υπό τους οποίους μπορούν
    να αλιευθούν
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 3401/93 DEL CONSIGLIO del 7 dicembre 1993 recante modifica,
    per quanto concerne lo spratto ed il merluzzo bianco, del regolamento (CEE) n.
    3919/92 che stabilisce, per alcune popolazioni o gruppi di popolazioni ittiche,
    il totale ammissibile di catture per il 1993 e talune condizioni a cui è soggetta
    la pesca di detto totale
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 3401/93 VAN DE RAAD van 7 december 1993 houdende wijziging,
    voor sprot en kabeljauw, van Verordening (EEG) nr. 3919/92 inzake de vaststelling
    van de voor 1993 geldende totaal toegestane vangsten (TAC' s) voor bepaalde visbestanden
    of groepen visbestanden, alsmede de bij de visserij in het kader van de totaal
    toegestane vangsten in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 3401/93 DO CONSELHO de 7 de Dezembro de 1993 que altera,
    no que respeita à espadilha e ao bacalhau, o Regulamento (CEE) nº 3919/92, que
    fixa, relativamente a determinadas unidades populacionais ou grupos de unidades
    populacionais de peixes, os totais admissíveis de capturas (TAC) para 1993 e
    certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) Nº 3401/93 DEL CONSEJO de 7 de diciembre de 1993 que modifica,
    respecto del espadín y del bacalao, el Reglamento (CEE) nº 3919/92 por el que
    se fijan, para determinadas poblaciones y grupos de poblaciones de peces, los
    totales admisibles de capturas para 1993 y determinadas condiciones en las que
    pueden pescarse
  type: main
