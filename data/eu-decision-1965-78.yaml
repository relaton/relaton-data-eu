title:
- language: fr
  script: Latn
  content: Décision 65/78/CEE de la Commission, du 22 janvier 1965, portant nouvelle
    modification de sa décision du 30 novembre 1964, autorisant la perception de
    taxes compensatoires à l'importation, dans la République française, de glucose
    (dextrose) en provenance de certains États membres
  type: main
- language: de
  script: Latn
  content: '65/78/EWG: Entscheidung der Kommission vom 22. Januar 1965 zur erneuten
    Änderung ihrer Entscheidung vom 30. November 1964 über die Erhebung einer Ausgleichsabgabe
    bei der Einfuhr von Glukose (Dextrose) aus verschiedenen Mitgliedstaaten in die
    Französische Republik'
  type: main
- language: it
  script: Latn
  content: '65/78/CEE: Decisione della Commissione, del 22 gennaio 1965, recante nuova
    modifica della decisione della Commissione del 30 novembre 1964 che autorizza
    la riscossione di tasse di compensazione all''importazione nella Repubblica francese
    di glucosio (destrosio) in provenienza da taluni Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/78/EEG: Beschikking van de Commissie van 22 januari 1965 tot hernieuwde
    wijziging van haar beschikking van 30 november 1964, houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Franse Republiek van glucose
    (dextrose) uit bepaalde Lid-Staten'
  type: main
