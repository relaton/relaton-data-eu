title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2160/75 of the Commission of 19 August 1975 amending
    Regulation (EEC) No 2805/73 as regards the list of white quality wines produced
    in specified regions and of imported white quality wines containing a certain
    percentage of sulphur dioxide
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2160/75 de la Commission, du 19 août 1975, modifiant
    le règlement (CEE) n° 2805/73 qui établit la liste des vins blancs de qualité
    produits dans des régions déterminées et des vins blancs de qualité importés
    ayant une teneur en anhydride sulfureux particulière
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2160/75 der Kommission vom 19. August 1975 zur Änderung
    der Verordnung (EWG) Nr. 2805/73 hinsichtlich des Verzeichnisses der in bestimmten
    Anbaugebieten erzeugten weißen Qualitätsweine und der eingeführten weißen
    Qualitätsweine mit einem außergewöhnlichen Schwefeldioxidgehalt
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2160/75 af 19. august 1975 om ændring
    af forordning (EØF) nr. 2805/73, for så vidt angår listen over hvide kvalitetsvine
    fra bestemte dyrkningsområder og indførte hvide kvalitetsvine, som har et særligt
    svovldioxydindhold
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2160/75 της Επιτροπής
    της 19ης Αυγούστου 1975 περί τροποποιήσεως του
    κανονισμού (ΕΟΚ) αριθ. 2805/73 περί καταρτίσεως
    του πίνακα λευκών οίνων ποιότητος, παραγομένων
    εντός καθορισμένων περιοχών, και εισαγομένων
    λευκών οίνων ποιότητος οι οποίοι έχουν διακριτική
    περιεκτικότητα σε θειώδη ανυδρίτη
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2160/75 della Commissione, del 19 agosto 1975, recante
    modifica del regolamento (CEE) n. 2805/73, per quanto riguarda l' elenco dei vini
    bianchi di qualità prodotti in regioni determinate e dei vini bianchi di qualità
    importati aventi un tenore particolare di anidride solforosa, nonché alcune disposizioni
    transitorie relative al tenore di anidride solforosa dei vini prodotti anteriormente
    al 1° ottobre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2160/75 van de Commissie van 19 augustus 1975 tot
    wijziging van Verordening (EEG) nr. 2805/73 met betrekking tot de lijst van in
    bepaalde gebieden voortgebrachte witte kwaliteitswijnen en ingevoerde kwaliteitswijnen
    met een bijzonder gehalte aan zwaveldioxyde
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2160/75 da Comissão, de 19 de Agosto de 1975, que
    altera o Regulamento (CEE) n.° 2805/73 que estabelece a lista dos vinhos brancos
    de qualidade produzidos em regiões determinadas e dos vinhos brancos de qualidade
    importados com teor em anidrido sulfuroso especial
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2160/75 de la Comisión, de 19 de agosto de 1975,
    por el que se modifica el Reglamento (CEE) n° 2805/73 que establece la lista
    de los vinos blancos de calidad producidos en regiones determinadas y de los vinos
    blancos de calidad importados con un contenido particular de anhídrido sulfuroso
  type: main
