title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3602/82 of 21 December 1982 fixing coefficients
    for calculating levies on pigmeat products other than pig carcases, amending the
    Annex to Council Regulation (EEC) No 950/68 on the Common Customs Tariff and repealing
    Regulation (EEC) No 747/79
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3602/82 de la Commission, du 21 décembre 1982, portant
    fixation des coefficients pour le calcul des prélèvements applicables aux produits
    du secteur de la viande de porc autres que le porc abattu, modifiant l' annexe
    du règlement (CEE) n° 950/68 du Conseil relatif au tarif douanier commun et
    abrogeant le règlement (CEE) n° 747/79
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3602/82 der Kommission vom 21. Dezember 1982 zur Feststellung
    der Koeffizienten zur Berechnung der Abschöpfungen für Schweinefleischerzeugnisse
    mit Ausnahme von geschlachteten Schweinen, zur Änderung des Anhangs der Verordnung
    (EWG) Nr. 950/68 des Rates über den Gemeinsamen Zolltarif und zur Aufhebung der
    Verordnung (EWG) Nr. 747/79
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3602/82 af 21. december 1982 om fastsættelse
    af koefficienter for beregning af importafgifter for svinekødsprodukter med undtagelse
    af slagtede svin, om ændring af bilaget til Rådets forordning (EØF) nr. 950/68
    om den fælles toldtarif og om ophævelse af forordning (EØF) nr. 747/79
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3602/82 τής Επιτροπής
    τής 21ης Δεκεμβρίου 1982 περί καθορισμού τών συντελεστών
    γιά τόν υπολογισμό τών εισφορών πού επιβάλλονται
    στά προϊόντα τού τομέα τού χοιρείου κρέατος
    εκτός τών εσφαγμένων χοίρων, περί τροποποιήσεως
    τού παραρτήματος τού κανονισμού (EOK) αριθ. 950/68
    περί τού Κοινού Δασμολογίου, καί περί καταργήσεως
    τού κανονισμού (EOK) αριθ. 747/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3602/82 della Commissione, del 21 dicembre 1982, che
    fissa i coefficienti per il calcolo dei prelievi applicabili ai prodotti del settore
    delle carni suine diversi dai suini macellati, che modifica l' allegato del regolamento
    (CEE) n. 950/68 del Consiglio relativo alla tariffa doganale comune e che abroga
    il regolamento (CEE) n. 747/798
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3602/82 van de Commissie van 21 december 1982 houdende
    vaststelling van de coëfficiënten voor de berekening van de heffingen die van
    toepassing zijn op de produkten in de sector varkensvlees, andere dan geslachte
    varkens, tot wijziging van de bijlage van Verordening (EEG) nr. 950/68 van de
    Raad betreffende het gemeenschappelijk douanetarief en tot intrekking van Verordening
    (EEG) nr. 747/79
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3602/82 da Comissão, de 21 de Dezembro de 1982,
    que fixa coeficientes para o cálculo dos direitos niveladores aplicáveis aos
    produtos do sector da carne de porco, excluindo as carcaças de porco, que altera
    o anexo do Regulamento (CEE) n.° 950/68 do Conselho relativo à pauta aduaneira
    comum e que revoga o Regulamento (CEE) n.° 747/79
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3602/82 de la Comisión, de 21 de diciembre de 1982,
    por el que se fijan los coeficientes para el cálculo de las exacciones reguladoras
    aplicables a los productos del sector de la carne de porcino distintos del cerdo
    sacrificado, se modifica el Anexo del Reglamento (CEE) n° 950/68 del Consejo
    relativo al arancel aduanero común y se deroga el Reglamento (CEE) n° 747/79
  type: main
