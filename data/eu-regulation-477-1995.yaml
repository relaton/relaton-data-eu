  content: Council Regulation (EC) No 477/95 of 16 January 1995 amending the definitive
    anti-dumping measures applying to imports into the Community of urea originating
    in the former USSR and terminating the anti-dumping measures applying to imports
    into the Community of urea originating in the former Czechoslovakia
  type: main
- language: fr
