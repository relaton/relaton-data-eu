    de pêche applicables aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1717/80 des Rates vom 27. Juni 1980 zur Festlegung
    von Maßnahmen zur Erhaltung und Bewirtschaftung der Fischbestände für Schiffe
    unter norwegischer Flagge für 1980
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1717/80 af 27. juni 1980 om fastsættelse
