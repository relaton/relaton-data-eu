---
id: EURegulation20221251
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1251 of 19 July 2022 renewing
    the approval of the active substances Straight Chain Lepidopteran Pheromones (acetates)
    as low-risk active substances, and Straight Chain Lepidopteran Pheromones (aldehydes
    and alcohols) in accordance with Regulation (EC) No 1107/2009 of the European
    Parliament and of the Council, and amending the Annex to Commission Implementing
    Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1251 de la Commission du 19 juillet
    2022 renouvelant l’approbation des substances actives «phéromones de lépidoptères
    à chaîne linéaire (acétates)» en tant que substances actives à faible risque
    et «phéromones de lépidoptères à chaîne linéaire (aldéhydes ou alcools)»,
    conformément au règlement (CE) no 1107/2009 du Parlement européen et du Conseil,
    et modifiant l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1251 der Kommission vom 19. Juli 2022
    zur Erneuerung der Genehmigung der Wirkstoffe „geradkettige Lepidopterenpheromone“
    (Acetate) als Wirkstoffe mit geringem Risiko sowie der Wirkstoffe „geradkettige
    Lepidopterenpheromone“ (Aldehyde und Alkohole) gemäß der Verordnung (EG) Nr.
    1107/2009 des Europäischen Parlaments und des Rates und zur Änderung des Anhangs
    der Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/1251 на Комисията
    от 19 юли 2022 година за подновяване на одобрението
    на активните вещества феромони на люспокрили
    с прави вериги (ацетати) като активни вещества
    с нисък риск, както и феромони на люспокрили
    с прави вериги (алдехиди и алкохоли) в съответствие
    с Регламент (ЕО) № 1107/2009 на Европейския парламент
    и на Съвета, и за изменение на приложението
    към Регламент за изпълнение (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1251 ze dne 19. července 2022,
    kterým se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009
    obnovuje schválení účinných látek motýlí feromony s rovným řetězcem
    (acetáty) jako účinných látek představujících nízké riziko a motýlí
    feromony s rovným řetězcem (aldehydy a alkoholy) a mění příloha prováděcího
    nařízení Komise (EU) č. 540/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/1251 af 19. juli 2022
    om forlængelse af godkendelsen af aktivstofferne ligekædede sommerfugleferomoner
    (acetater) som lavrisikoaktivstoffer og ligekædede sommerfugleferomoner (aldehyder
    og alkoholer) jf. Europa-Parlamentets og Rådets forordning (EF) nr. 1107/2009,
    og om ændring af bilaget til Kommissionens gennemførelsesforordning (EU) nr.
    540/2011
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2022/1251 της Επιτροπής
    της 19ης Ιουλίου 2022 για την ανανέωση της έγκρισης
    των δραστικών ουσιών «φερομόνες λεπιδοπτέρων
    ευθείας αλύσου (οξικές ενώσεις)» ως δραστικών
    ουσιών χαμηλού κινδύνου και «φερομόνες λεπιδοπτέρων
    ευθείας αλύσου (αλδεΰδες και αλκοόλες)», σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, και για την
    τροποποίηση του παραρτήματος του εκτελεστικού
    κανονισμού (ΕΕ) αριθ. 540/2011 της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2022/1251, 19. juuli 2022, millega pikendatakse
    kooskõlas Euroopa Parlamendi ja nõukogu määrusega (EÜ) nr 1107/2009 toimeainete
    liblikaliste hargnemata ahelaga feromoonide (atsetaatide) heakskiitu madala riskiastmega
    toimeainetena ja liblikaliste hargnemata ahelaga feromoonide (aldehüüdide ja
    alkoholide) heakskiitu ning muudetakse komisjoni rakendusmääruse (EL) nr 540/2011
    lisa
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/1251, annettu 19 päivänä
    heinäkuuta 2022, tehoaineiden suoraketjuiset perhosten feromonit (asetaatit)
    hyväksynnän uusimisesta vähäriskisinä tehoaineina ja tehoaineiden suoraketjuiset
    perhosten feromonit (aldehydit ja alkoholit) hyväksynnän uusimisesta Euroopan
    parlamentin ja neuvoston asetuksen (EY) N:o 1107/2009 mukaisesti sekä komission
    täytäntöönpanoasetuksen (EU) N:o 540/2011 liitteen muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/1251 ón gCoimisiún an 19 Iúil
    2022 lena ndéantar an formheas ar na substaintí gníomhacha Fearamóin Léipidipteire
    Slabhra Dhírigh (aicéatáití) mar shubstaintí gníomhacha ísealriosca, agus
    Fearamóin Léipidipteire Slabhra Dhírigh (aildéid agus alcóil) a athnuachan
    i gcomhréir le Rialachán (CE) Uimh. 1107/2009 ó Pharlaimint na hEorpa agus
    ón gComhairle, agus lena leasaítear an Iarscríbhinn a ghabhann le Rialachán
    Cur Chun Feidhme (AE) Uimh. 540/2011 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/1251 оd 19. srpnja 2022. o produljenju
    odobrenja aktivnih tvari ravnolančani feromoni za leptire (red Lepidoptera) (acetati)
    kao aktivnih tvari niskog rizika i ravnolančani feromoni za leptire (red Lepidoptera)
    (aldehidi i alkoholi) u skladu s Uredbom (EZ) br. 1107/2009 Europskog parlamenta
    i Vijeća te o izmjeni Priloga Provedbenoj uredbi Komisije (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1251 végrehajtási rendelete (2022. július 19.)
    az egyenes láncú lepkeferomonok (acetátok) mint kis kockázatú hatóanyagok,
    valamint az egyenes láncú lepkeferomonok (aldehidek és alkoholok) mint hatóanyagok
    1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyásának
    meghosszabbításáról, továbbá az 540/2011/EU bizottsági végrehajtási rendelet
    mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1251 della Commissione del 19 luglio
    2022 che rinnova l’approvazione delle sostanze attive feromoni di lepidotteri
    a catena lineare (acetati) come sostanze attive a basso rischio, e feromoni di
    lepidotteri a catena lineare (aldeidi e alcoli), in conformità al regolamento
    (CE) n. 1107/2009 del Parlamento europeo e del Consiglio, e che modifica l’allegato
    del regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/1251 (2022. gada 19. jūlijs),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 atjauno
    darbīgo vielu taisnās ķēdes lepidopterān-feromonu (acetātu) kā zema riska
    darbīgo vielu un taisnās ķēdes lepidopterān-feromonu (aldehīdu un spirtu)
    apstiprinājumu un groza Komisijas Īstenošanas regulas (ES) Nr. 540/2011 pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2022/1251 2022 m. liepos 19 d.
    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 pratęsiamas
    veikliųjų medžiagų drugių (Lepidoptera) būrio atstovų linijinės grandinės
    feromonų (acetatų), kaip nedidelės rizikos veikliųjų medžiagų, ir drugių
    (Lepidoptera) būrio atstovų linijinės grandinės feromonų (aldehidų ir alkoholių)
    patvirtinimo galiojimas ir iš dalies keičiamas Komisijos įgyvendinimo reglamento
    (ES) Nr. 540/2011 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1251 tad-19
    ta’ Lulju 2022 li jġedded l-approvazzjoni tas-sustanzi attivi Feromoni tal-Lepidopteri
    ta’ Katina Dritta (aċetati) bħala sustanzi attivi b’riskju baxx, u Feromoni
    tal-Lepidopteri ta’ Katina Dritta (aldeidi u alkoħols) f’konformità mar-Regolament
    (KE) Nru 1107/2009 tal-Parlament Ewropew u tal-Kunsill, u li jemenda l-Anness
    tar-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/1251 van de Commissie van 19 juli 2022
    tot verlenging van de goedkeuring van de werkzame stoffen onvertakte vlinderferomonen
    (acetaten) als werkzame stoffen met een laag risico, en onvertakte vlinderferomonen
    (aldehyden en alcoholen) overeenkomstig Verordening (EG) nr. 1107/2009 van het
    Europees Parlement en de Raad, en tot wijziging van de bijlage bij Uitvoeringsverordening
    (EU) nr. 540/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/1251 z dnia 19 lipca 2022
    r. w sprawie odnowienia zatwierdzenia substancji czynnych feromony łuskoskrzydłych
    o łańcuchach prostych (octany) jako substancji czynnej niskiego ryzyka i feromony
    łuskoskrzydłych o łańcuchach prostych (aldehydy i alkohole), zgodnie z rozporządzeniem
    Parlamentu Europejskiego i Rady (WE) nr 1107/2009, oraz w sprawie zmiany załącznika
    do rozporządzenia wykonawczego Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/1251 da Comissão de 19 de julho de
    2022 que renova a aprovação das substâncias ativas feromonas de cadeia linear
    de lepidópteros (acetatos) como substâncias ativas de baixo risco e feromonas
    de cadeia linear de lepidópteros (aldeídos e álcoois), em conformidade com
    o Regulamento (CE) n.o 1107/2009 do Parlamento Europeu e do Conselho, e que altera
    o anexo do Regulamento de Execução (UE) n.o 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/1251 al Comisiei din 19 iulie
    2022 de reînnoire a aprobării substanțelor active feromoni de lepidoptere cu
    catenă liniară (acetați) ca substanțe active cu risc redus și feromoni de
    lepidoptere cu catenă liniară (aldehide și alcooli), în conformitate cu Regulamentul
    (CE) nr. 1107/2009 al Parlamentului European și al Consiliului, și de modificare
    a anexei la Regulamentul de punere în aplicare (UE) nr. 540/2011 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/1251 z 19. júla 2022, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 obnovuje
    schválenie účinných látok lineárne motýlie feromóny (acetáty) ako účinné
    látky s nízkym rizikom a lineárne motýlie feromóny (aldehydy a alkoholy)
    a ktorým sa mení príloha k vykonávaciemu nariadeniu Komisie (EÚ) č. 540/2011
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/1251 z dne 19. julija 2022 o obnovitvi
    odobritve aktivnih snovi feromoni z nerazvejano verigo iz reda Lepidoptera (acetati)
    kot aktivnih snovi z majhnim tveganjem in feromoni z nerazvejano verigo iz reda
    Lepidoptera (aldehidi in alkoholi) v skladu z Uredbo (ES) št. 1107/2009 Evropskega
    parlamenta in Sveta ter o spremembi Priloge k Izvedbeni uredbi Komisije (EU) št.
    540/2011
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/1251 de la Comisión de 19 de julio
    de 2022 por el que se renueva la aprobación de las sustancias activas feromonas
    de cadena lineal de lepidópteros (acetatos) como sustancias activas de bajo riesgo
    y las feromonas de cadena lineal de lepidópteros (aldehídos y alcoholes) con
    arreglo al Reglamento (CE) n.o 1107/2009 del Parlamento Europeo y del Consejo,
    y se modifica el anexo del Reglamento de Ejecución (UE) n.o 540/2011 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/1251 av den 19 juli 2022
    om förnyelse av godkännandet av de verksamma ämnena fjärilsferomoner med raka
    kolkedjor (acetater) som ämnen med låg risk och fjärilsferomoner med raka kolkedjor
    (aldehyder och alkoholer) i enlighet med Europaparlamentets och rådets förordning
    (EG) nr 1107/2009, och om ändring av bilagan till kommissionens genomförandeförordning
    (EU) nr 540/2011
