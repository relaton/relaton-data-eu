title:
- language: en
  script: Latn
  content: '94/744/EC: Council Decision of 10 November 1994 on the conclusion of an
    Agreement in the form of an Exchange of Letters on the provisional application
    of the Protocol defining, for the period 6 September 1994 to 5 September 1997,
    the fishing rights and the financial compensation provided for by the Agreement
    between the European Economic Community and the Republic of Cape Verde on fishing
    off the coast of Cape Verde'
  type: main
- language: fr
  script: Latn
  content: '94/744/CE: Décision du Conseil du 10 novembre 1994 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la compensation financière
    prévues dans l''accord entre la Communauté économique européenne et la République
    du Cap-Vert concernant la pêche au large du Cap-Vert pour la période du 6 septembre
    1994 au 5 septembre 1997'
  type: main
- language: de
  script: Latn
  content: '94/744/EG: BESCHLUSS DES RATES vom 10. November 1994 über den Abschluß
    des Abkommens in Form eines Briefwechsels über die vorläufige Anwendung des
    Protokolls zur Festlegung der Fangmöglichkeiten und der finanziellen Gegenleistung
    nach dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Republik
    Kap Verde über die Fischerei vor der Küste Kap Verdes für die Zeit vom 6. September
    1994 bis zum 5. September 1997'
  type: main
- language: da
  script: Latn
  content: '94/744/EF: Rådets afgørelse af 10. november 1994 om indgåelse af aftalen
    i form af brevveksling om midlertidig anvendelse af protokollen om fastsættelse
    af de fiskerimuligheder og den finansielle godtgørelse, der er omhandlet i aftalen
    mellem Det Europæiske Økonomiske Fællesskab og Republikken Kap Verde om fiskeri
    ud for Kap Verde for perioden 6. september 1994 til 5. september 1997'
  type: main
- language: el
  script: Grek
  content: '94/744/ΕΚ: ΑΠΟΦΑΣΗ ΤΟΥ ΣΥΜΒΟΥΛΙΟΥ της 10ης
    Νοεμβρίου 1994 για τη σύναψη της συμφωνίας υπό
    μορφήν ανταλλαγής επιστολών σχετικά με την
    προσωρινή εφαρμογή του πρωτοκόλλου που καθορίζει
    τις δυνατότητες αλιείας και τη χρηματική αντιστάθμιση
    που προβλέπονται στη συμφωνία μεταξύ της Ευρωπαϊκής
    Οικονομικής Κοινότητας και της Δημοκρατίας
    του Πράσινου Ακρωτηρίου όσον αφορά την αλιεία
    στα ανοικτά των ακτών του Πρασίνου Ακρωτηρίου
    για την περίοδο από τις 6 Σεπτεμβρίου 1994 έως
    τις 5 Σεπτεμβρίου 1997'
  type: main
- language: fi
  script: Latn
  content: '94/744/EY: Neuvoston päätös, tehty 10 päivänä marraskuuta 1994,
    Euroopan talousyhteisön ja Kap Verden tasavallan välisessä Kap Verden edustalla
    harjoitettavaa kalastusta koskevassa sopimuksessa määrättyjen kalastusmahdollisuuksien
    ja taloudellisen korvauksen vahvistamista koskevan pöytäkirjan väliaikaista
    soveltamista 6 päivän syyskuuta 1994 ja 5 päivän syyskuuta 1997 väliseksi
    ajanjaksoksi koskevan sopimuksen tekemisestä kirjeenvaihtona'
  type: main
- language: it
  script: Latn
  content: '94/744/CE: Decisione del Consiglio del 10 novembre 1994 relativa alla
