    pokud jde o některé metody, kritérium bezpečnosti potravin pro Listeria monocytogenes
    v naklíčených semenech a kritérium hygieny výrobního procesu a kritérium
    bezpečnosti potravin pro nepasterizované ovocné a zeleninové šťávy (určené
    k přímé spotřebě)
  type: main
