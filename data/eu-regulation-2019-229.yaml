  content: Regulamentul (UE) 2019/229 al Comisiei din 7 februarie 2019 de modificare
    a Regulamentului (CE) nr. 2073/2005 privind criteriile microbiologice pentru produsele
    alimentare în ceea ce privește anumite metode, criteriul de siguranță alimentară
    pentru Listeria monocytogenes în semințele germinate, precum și criteriul de
    igienă a procedeelor și criteriul de siguranță alimentară pentru sucurile
    de fructe și legume nepasteurizate (gata pentru consum)
  type: main
