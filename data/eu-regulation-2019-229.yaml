  script: Latn
  content: Uredba Komisije (EU) 2019/229 оd 7. veljače 2019. o izmjeni Uredbe (EZ)
    br. 2073/2005 o mikrobiološkim kriterijima za hranu u pogledu određenih metoda,
    kriterija sigurnosti hrane za bakteriju Listeria monocytogenes u klicama i kriterija
    higijene procesa te kriterija sigurnosti hrane za nepasterizirane sokove od voća
    i povrća (gotova hrana)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/229 rendelete (2019. február 7.) az élelmiszerek
    mikrobiológiai kritériumairól szóló 2073/2005/EK rendeletnek az egyes módszerek,
    a csíráztatott magvakban előforduló Listeria monocytogenes esetében alkalmazandó
    élelmiszer-biztonsági kritérium, valamint a pasztörizálatlan gyümölcs-
    és zöldséglevekre vonatkozó technológiai higiéniai kritérium és élelmiszer-biztonsági
    kritérium tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) 2019/229 della Commissione, del 7 febbraio 2019, che modifica
    il regolamento (CE) n. 2073/2005 sui criteri microbiologici applicabili ai prodotti
    alimentari per quanto riguarda alcuni metodi, il criterio di sicurezza alimentare
    relativo alla presenza di Listeria monocytogenes nei semi germogliati e il criterio
    di igiene del processo e il criterio di sicurezza alimentare applicabili ai succhi
    di frutta e di ortaggi non pastorizzati (pronti al consumo)
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) 2019/229 (2019. gada 7. februāris), ar ko attiecībā
