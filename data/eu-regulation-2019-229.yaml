    monocytogenes diedzētās sēklās un procesa higiēnas kritēriju un pārtikas
    nekaitīguma kritēriju nepasterizētām augļu un dārzeņu sulām (gatavām
    lietošanai cilvēka uzturā) groza Regulu (EK) Nr. 2073/2005 par pārtikas produktu
    mikrobioloģiskajiem kritērijiem
  type: main
- language: lt
  script: Latn
  content: 2019 m. vasario 7 d. Komisijos reglamentas (ES) 2019/229, kuriuo dėl tam
    tikrų metodų, maisto saugos kriterijaus, susijusio su bakterijomis Listeria
    monocytogenes daigintose sėklose, ir nepasterizuotų vaisių ir daržovių sulčių
    (gatavų produktų) gamybos proceso higienos kriterijaus bei maisto saugos kriterijaus
    iš dalies keičiamas Reglamentas (EB) Nr. 2073/2005 dėl maisto produktų mikrobiologinių
    kriterijų
  type: main
