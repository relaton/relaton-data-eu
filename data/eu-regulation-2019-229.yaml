    så vidt angår visse metoder, fødevaresikkerhedskriteriet for Listeria monocytogenes
    i spirer samt proceshygiejnekriteriet og fødevaresikkerhedskriteriet for upasteuriseret
    frugt- og grøntsagssaft (drikkeklar)
  type: main
