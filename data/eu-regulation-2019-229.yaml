title:
- language: en
  script: Latn
  content: Commission Regulation (EU) 2019/229 of 7 February 2019 amending Regulation
    (EC) No 2073/2005 on microbiological criteria for foodstuffs as regards certain
    methods, the food safety criterion for Listeria monocytogenes in sprouted seeds,
    and the process hygiene criterion and food safety criterion for unpasteurised
    fruit and vegetable juices (ready-to-eat)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2019/229 de la Commission du 7 février 2019 modifiant
    le règlement (CE) n° 2073/2005 concernant les critères microbiologiques applicables
    aux denrées alimentaires en ce qui concerne certaines méthodes, le critère
    de sécurité des denrées alimentaires relatif à la présence de Listeria monocytogenes
    dans les graines germées, ainsi que le critère d'hygiène du procédé et le
    critère de sécurité des denrées alimentaires pour les jus de fruits et de
    légumes non pasteurisés (prêts à être consommés)
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) 2019/229 der Kommission vom 7. Februar 2019 zur Änderung
    der Verordnung (EG) Nr. 2073/2005 über mikrobiologische Kriterien für Lebensmittel
    im Hinblick auf bestimmte Verfahren, das Lebensmittelsicherheitskriterium in Bezug
    auf Listeria monocytogenes in Keimlingen sowie das Prozesshygienekriterium und
    das Lebensmittelsicherheitskriterium für nicht pasteurisierte Obst- und Gemüsesäfte
    (verzehrfertig)
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) 2019/229 на Комисията от 7 февруари
    2019 година за изменение на Регламент (ЕО) № 2073/2005
    относно микробиологичните критерии за хранителните
    продукти по отношение на някои методи, критерия
    за безопасност на храните за Listeria monocytogenes в
    покълнали семена и критериите за хигиена на
    процеса и за безопасност на храните за непастьоризирани
    плодови и зеленчукови сокове (готови за консумация)
  type: main
