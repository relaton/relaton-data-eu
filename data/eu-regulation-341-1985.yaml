title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 341/85 of 7 February 1985 re-establishing
    the levying of customs duties on certain women' s, girls' and infants' woven suits
    and costumes, products of category 29 (code 40.0290) originating in Thailand,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3563/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 341/85 de la Commission du 7 février 1985 portant
    rétablissement de la perception des droits de douane applicables à certains
    costumes-tailleurs, tissés, pour femmes, fillettes et jeunes enfants, de la catégorie
    29 (code 40.0290), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) no 3563/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 341/85 der Kommission vom 7. Februar 1985 über die
    Wiedereinführung des Zollsatzes für bestimmte Kostüme und Hosenanzüge, aus
    Geweben, für Frauen, Mädchen und Kleinkinder der Warenkategorie Nr. 29 (Kennziffer
    40.0290) mit Ursprung in Thailand, dem die in der Verordnung (EWG) Nr. 3563/84
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 341/85 af 7. februar 1985 om genindførelse
    af opkrævning af toldafgifter for bestemte dragter og kostumer, vævede, til
    kvinder, piger og småbørn under varekategori nr. 29 (kode 40.0290), som har
    oprindelse i Thailand og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3563/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 341/85 της Επιτροπής
    της 7ης Φεβρουαρίου 1985 περί αποκαταστάσεως
    της εφαρμογής τελωνειακών δασμών για ορισμένα
    κοστούμια—ταγιέρ, υφασμένα, για γυναίκες,
    κορασίδες και μικρά παιδιά, της κατηγορίας
    προϊόντων αριθ. 29 (κωδικός 40.0290), καταγωγής Ταϋλάνδης,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3563/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 341/85 della Commissione del 7 febbraio 1985 che ripristina
    la riscossione dei dazi doganali applicabili a certi abiti a giacca e completi,
    tessuti, per donna, per ragazza e per bambini, della categoria di prodotti 29
    (codice 40.0290), originari della Tailandia beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3563/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 341/85 van de Commissie van 7 februari 1985 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op bepaalde
    geweven mantelpakken en broekpakken voor dames, meisjes en kinderen, van de categorie
    van produkten nr. 29 (codenummer 40.0290), van oorsprong uit Thailand, waarvoor
    de algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3563/84
    van de Raad
