title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 543/76 of 11 March 1976 re-establishing
    the levying of customs duties on other goat and kidskin leather falling within
    subheading 41.04 B II, originating in India, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November 1975
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 543/76 de la Commission, du 11 mars 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    de caprins, préparées, non dénommées, de la sous-position tarifaire 41.04
    B II, originaires de l'Inde, bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 543/76 der Kommission vom 11. März 1976 zur Wiedereinführung
    des Zollsatzes für bestimmtes Ziegen- und Zickelleder der Tarifstelle 41.04 B
    II, mit Ursprung in Indien, dem die in der Verordnung (EWG) Nr. 3010/75 des Rates
    vom 17. November 1975 vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 543/76 af 11. marts 1976 om genindførelse
    af opkrævning af toldafgifter for læder af gede- og gedekidskind under underposition
    41.04 B II som har oprindelse i Indien og omfattes af de toldpræferencer, som
    er fastsat i Rådets forordning (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 543/76 della Commissione, dell'11 marzo 1976, che
    ripristina la riscossione dei dazi doganali applicabili alle pelli caprine, preparate,
    non nominate, della sottovoce doganale 41.04 B II originarie dell'India beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75 del Consiglio
    del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 543/76 van de Commissie van 11 maart 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op ander geiteleder,
    alsmede voorgelooide huiden en vellen, overige, van onderverdeling 41.04 B II,
    van oorsprong uit India, ten behoeve waarvan bij Verordening (EEG) nr. 3010/75
    van de Raad van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
