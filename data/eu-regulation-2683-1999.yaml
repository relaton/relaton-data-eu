title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2683/1999 of 17 December 1999 amending Regulation
    (EC) No 1524/98 laying down detailed rules for the application of the specific
    measures adopted in respect of fruit and vegetables, plants and flowers for the
    benefit of the French overseas departments and determining the forecast supply
    balance for 2000
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2683/1999 de la Commission, du 17 décembre 1999, modifiant
    le règlement (CE) nº 1524/98 portant modalités d'application relatives aux
    mesures spécifiques arrêtées en faveur des départements français d'outre-mer
    dans les secteurs des fruits et légumes, des plantes et des fleurs et déterminant
    le bilan prévisionnel d'approvisionnement pour l'année 2000
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2683/1999 der Kommission vom 17. Dezember 1999 zur
    Änderung der Verordnung (EG) Nr. 1524/98 mit Durchführungsbestimmungen zu den
    Sondermaßnahmen zugunsten der französischen überseeischen Departements in den
    Sektoren Obst und Gemüse, Pflanzen und Blumen und zur Erstellung der Bedarfsvorausschätzung
    für 2000
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2683/1999 af 17. december 1999 om ændring
    af forordning (EF) nr. 1524/98 om gennemførelsesbestemmelser for særlige foranstaltninger
    for frugt, grøntsager, planter og blomster til fordel for de oversøiske franske
    departementer og om foreløbig forsyningsopgørelse for år 2000
  type: main
- language: el
  script: Grek
