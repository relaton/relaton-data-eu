    του κανονισμού (ΕΚ) αριθ. 1524/98 όσον αφορά τις
    λεπτομέρειες εφαρμογής σχετικά με τα ειδικά
    μέτρα τα οποία ελήφθησαν υπέρ των γαλλικών
    υπερποντίων διαμερισμάτων στους τομείς των
    οπωροκηπευτικών, των φυτών και ανθέων και τον
    καθορισμό του προβλεπόμενου για το έτος 2000
    ισοζυγίου εφοδιασμού
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2683/1999, annettu 17 päivänä joulukuuta 1999,
