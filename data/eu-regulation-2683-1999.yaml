    departementtien hyväksi annettujen erityistoimenpiteiden soveltamista koskevista
    yksityiskohtaisista säännöistä annetun asetuksen (EY) N:o 1524/98 muuttamisesta
    ja arvioidun hankintataseen määrittämisestä vuodeksi 2000
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2683/1999 della Commissione, del 17 dicembre 1999,
    recante modifica del regolamento (CE) n. 1524/98 che stabilisce modalità di applicazione
    delle misure specifiche adottate a favore dei dipartimenti francesi d'oltremare
    nei settori degli ortofrutticoli, delle piante e dei fiori e che fissa il bilancio
    previsionale di approvvigionamento per il 2000
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2683/1999 van de Commissie van 17 december 1999 tot
    wijziging van Verordening (EG) nr. 1524/98 houdende bepalingen ter uitvoering
    van de ten behoeve van de Franse overzeese departementen (DOM) vastgestelde specifieke
    maatregelen voor de sectoren groenten en fruit, bloemen en planten, en tot vaststelling
    van de geraamde voorzieningsbalans voor het jaar 2000
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2683/1999 da Comissão, de 17 de Dezembro de 1999,
    que altera o Regulamento (CE) n.o 1524/98 que fixa as regras de execução relativos
    às medidas específicas decididas a favor dos departamentos franceses ultramarinos
    nos sectores das frutas e produtos hortícolas, das plantas e das flores e determina
    a estimativa de abastecimento para 2000
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2683/1999 de la Comisión, de 17 de diciembre de 1999,
    que modifica el Reglamento (CE) nº 1524/98 por el que se establecen las disposiciones
    de aplicación relativas a las medidas específicas adoptadas en favor de los
    departamentos franceses de Ultramar en los sectores de las frutas y hortalizas,
    las plantas y las flores, y por el que se establece el plan de previsiones de
    abastecimiento para 2000
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2683/1999 av den 17 december 1999 om
