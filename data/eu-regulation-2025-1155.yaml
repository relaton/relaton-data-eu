    по отношение на регулаторните технически стандарти
    за определяне на входните и изходните данни
    на системите за консолидирани данни, синхронизирането
    на бизнес часовниците и преразпределянето
    на приходите от страна на доставчика на консолидирани
    данни за акции и борсово търгувани фондове,
    и за отмяна на Делегиран регламент (ЕС) 2017/574
    на Комисията
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2025/1155 ze dne 12. června
    2025, kterým se doplňuje nařízení Evropského parlamentu a Rady (EU) č.
    600/2014, pokud jde o regulační technické normy upřesňující vstupní a
    výstupní údaje konsolidovaných obchodních informací, synchronizaci obchodních
    hodin a přerozdělování výnosů poskytovatelem konsolidovaných obchodních
    informací pro akcie a fondy obchodované v obchodním systému, a kterým se
    zrušuje nařízení Komise v přenesené pravomoci (EU) 2017/574
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2025/1155 af 12. juni 2025 om
    supplerende regler til Europa-Parlamentets og Rådets forordning (EU) nr. 600/2014
    for så vidt angår reguleringsmæssige tekniske standarder, som præciserer de
    input- og outputdata, der indgår i konsoliderede løbende handelsinformationer,
    synkroniseringen af forretningsurer og CTP'ens omfordeling af indtægter for aktier
    og ETF'er og om ophævelse af Kommissionens delegerede forordning (EU) 2017/574
  type: main
