title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1155 of 12 June 2025 supplementing
    Regulation (EU) No 600/2014 of the European Parliament and of the Council with
    regard to regulatory technical standards specifying the input and output data
    of consolidated tapes, the synchronisation of business clocks and the revenue
    redistribution by the consolidated tape provider for shares and ETFs, and repealing
    Commission Delegated Regulation (EU) 2017/574
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1155 de la Commission du 12 juin 2025 complétant
    le règlement (UE) no 600/2014 du Parlement européen et du Conseil par des normes
    techniques de réglementation précisant les données d’entrée et de sortie
    des systèmes consolidés de publication, la synchronisation des horloges professionnelles
    et la redistribution des recettes par le fournisseur de système consolidé de
    publication pour les actions et les fonds cotés, et abrogeant le règlement délégué
    (UE) 2017/574 de la Commission
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/1155 der Kommission vom 12. Juni 2025 zur
    Ergänzung der Verordnung (EU) Nr. 600/2014 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards zur Festlegung der Input- und Outputdaten
    konsolidierter Datenticker, der Synchronisierung von im Geschäftsverkehr verwendeten
    Uhren und der Umverteilung der Einnahmen durch den Bereitsteller konsolidierter
    Datenticker für Aktien und börsengehandelte Fonds und zur Aufhebung der Delegierten
    Verordnung (EU) 2017/574 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2025/1155 на Комисията
