    bemeneti és kimeneti adatait, az üzleti órák összehangolását, továbbá
    a bevételeknek a részvények és tőzsdén kereskedett alapok esetében illetékes
    összesítettadat-szolgáltató általi újraelosztását meghatározó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről, valamint az (EU) 2017/574
    felhatalmazáson alapuló bizottsági rendelet hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2025/1155 della Commissione, del 12 giugno 2025,
    che integra il regolamento (UE) n. 600/2014 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione che specificano i dati
    di input e di output dei sistemi consolidati di pubblicazione, la sincronizzazione
    degli orologi e la ridistribuzione dei ricavi da parte del fornitore di un sistema
    consolidato di pubblicazione per azioni e fondi indicizzati quotati, e che abroga
    il regolamento delegato (UE) 2017/574
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2025/1155 (2025. gada 12. jūnijs), ar
    ko Eiropas Parlamenta un Padomes Regulu (ES) Nr. 600/2014 papildina attiecībā
    uz regulatīvajiem tehniskajiem standartiem, kuros precizē konsolidēto datu
    lenšu ievaddatus un izvaddatus, uzņēmējdarbības pulksteņu sinhronizāciju
    un ienākumu pārdali, ko veic akcijām un biržā tirgotiem fondiem paredzētie
    konsolidētu datu lentes nodrošinātāji, un ar ko atceļ Komisijas Deleģēto
    regulu (ES) 2017/574
  type: main
- language: lt
  script: Latn
