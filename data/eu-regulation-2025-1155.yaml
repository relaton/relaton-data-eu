    kuriuo Europos Parlamento ir Tarybos reglamentas (ES) Nr. 600/2014 papildomas
    techniniais reguliavimo standartais, kuriais nustatomi konsoliduotos informacinės
    juostos įvesties ir išvesties duomenys, verslo laikrodžių sinchronizavimas
    ir akcijų bei biržinių fondų konsoliduotos informacinės juostos teikėjo
    atliekamas pajamų perskirstymas, ir panaikinamas Komisijos deleguotasis reglamentas
    (ES) 2017/574
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2025/1155 tat-12 ta’ Ġunju 2025
    li jissupplimenta r-Regolament (UE) Nru 600/2014 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward ta’ standards tekniċi regolatorji li jispeċifikaw id-data ta’
    input u ta’ output ta’ tapes konsolidati, is-sinkronizzazzjoni tal-arloġġi
    tan-negozju u r-ridistribuzzjoni tad-dħul mill-fornitur ta’ tape konsolidat
    għall-ishma u għall-ETFs, u li jħassar ir-Regolament Delegat tal-Kummissjoni
    (UE) 2017/574
  type: main
