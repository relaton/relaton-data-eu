    tot aanvulling van Verordening (EU) nr. 600/2014 van het Europees Parlement en
    de Raad met betrekking tot technische reguleringsnormen tot nadere bepaling van
    de input- en outputgegevens van consolidated tapes, de synchronisatie van beursklokken
    en de herverdeling van de inkomsten door de verstrekker van consolidated tape
    voor aandelen en ETF’s, en tot intrekking van Gedelegeerde Verordening (EU)
    2017/574 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2025/1155 z dnia 12 czerwca 2025
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 600/2014
    w odniesieniu do regulacyjnych standardów technicznych określających dane wejściowe
    i wyjściowe systemów publikacji informacji skonsolidowanych, synchronizację
    zegarów służbowych i redystrybucję dochodów przez dostawcę informacji skonsolidowanych
    dla akcji i funduszy inwestycyjnych typu ETF oraz uchylające rozporządzenie
    delegowane Komisji (UE) 2017/574
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2025/1155 da Comissão, de 12 de junho de 2025,
    que complementa o Regulamento (UE) n.o 600/2014 do Parlamento Europeu e do Conselho
    no que respeita às normas técnicas de regulamentação que especificam os dados
    de entrada e de saída dos sistemas de prestação de informação consolidada,
    a sincronização dos relógios profissionais e a redistribuição de receitas
    pelo prestador de informação consolidada para ações e ETF, e que revoga o
    Regulamento Delegado (UE) 2017/574 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2025/1155 al Comisiei din 12 iunie 2025 de completare
    a Regulamentului (UE) nr. 600/2014 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează datele
    de intrare și de ieșire ale sistemelor centralizate de raportare, sincronizarea
    ceasurilor profesionale și redistribuirea veniturilor de către furnizorul de
    sisteme centralizate de raportare pentru acțiuni și fonduri tranzacționate
    la bursă și de abrogare a Regulamentului delegat (UE) 2017/574 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2025/1155 z 12. júna 2025, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 600/2014, pokiaľ
    ide o regulačné technické predpisy, ktorými sa spresňujú vstupné a výstupné
    údaje konsolidovaných informačných systémov, synchronizácia obchodných
    hodín a prerozdeľovanie príjmov poskytovateľom konsolidovaného informačného
    systému pre akcie a ETF, a ktorým sa zrušuje delegované nariadenie Komisie
    (EÚ) 2017/574
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/1155 z dne 12. junija 2025 o dopolnitvi
    Uredbe (EU) št. 600/2014 Evropskega parlamenta in Sveta v zvezi z regulativnimi
    tehničnimi standardi, ki določajo vhodne in izhodne podatke sistemov stalnih
    informacij, uskladitev poslovnih ur in prerazdelitev prihodkov s strani ponudnika
    stalnih informacij za delnice in ETF, ter o razveljavitvi Delegirane uredbe Komisije
    (EU) 2017/574
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2025/1155 de la Comisión, de 12 de junio de 2025,
    por el que se completa el Reglamento (UE) n.o 600/2014 del Parlamento Europeo
    y del Consejo en lo que respecta a las normas técnicas de regulación en las
    que se especifican los datos de entrada y de salida de los sistemas de información
    consolidada, la sincronización de los relojes comerciales y la redistribución
    de ingresos por parte del proveedor de información consolidada para acciones
    y fondos cotizados, y por el que se deroga el Reglamento Delegado (UE) 2017/574
    de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2025/1155 av den 12 juni 2025
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 600/2014
    vad gäller tekniska tillsynsstandarder som specificerar indata och utdata för
    konsoliderad handelsinformation, synkronisering av affärsklockor och vidarefördelning
    av intäkter från tillhandahållare av konsoliderad handelsinformation för aktier
    och börshandlade fonder och om upphävande av kommissionens delegerade förordning
    (EU) 2017/574
