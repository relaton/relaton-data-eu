    agus ETFanna, agus lena n-aisghairtear Rialachán Tarmligthe (AE) 2017/574 ón
    gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2025/1155 оd 12. lipnja 2025. o dopuni
    Uredbe (EU) br. 600/2014 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda kojima se određuju ulazni i izlazni podaci za konsolidirane
    podatke, usklađivanje satova poslovanja i preraspodjela prihoda koju provodi
    pružatelj konsolidiranih podataka za dionice i ETF-ove i o stavljanju izvan snage
    Delegirane uredbe Komisije (EU) 2017/574
  type: main
- language: hu
  script: Latn
