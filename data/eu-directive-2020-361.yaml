    el anexo III de la Directiva 2011/65/UE del Parlamento Europeo y del Consejo,
    en lo que respecta a una exención relativa al cromo hexavalente como protección
    anticorrosiva para los sistemas de refrigeración de acero al carbono en frigoríficos
    de absorción
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade direktiv (EU) 2020/361 av den 17 december 2019
