    III k smernici Európskeho parlamentu a Rady 2011/65/EÚ, pokiaľ ide o výnimku
    pre šesťmocný chróm ako protikorózneho činidla chladiarenských systémov
    z uhlíkovej ocele v absorpčných chladničkách
  type: main
- language: sl
  script: Latn
  content: Delegirana direktiva Komisije (EU) 2020/361 z dne 17. decembra 2019 o spremembi
    Priloge III k Direktivi 2011/65/EU Evropskega parlamenta in Sveta glede izjeme
    za šestvalentni krom kot protikorozijsko sredstvo hladilnega sistema iz ogljikovega
