    Parlamentu Europejskiego i Rady 2011/65/UE w odniesieniu do wyłączenia dotyczącego
    sześciowartościowego chromu jako środka antykorozyjnego układów chłodniczych
    wykonanych ze stali węglowej w chłodziarkach absorpcyjnych
  type: main
- language: pt
  script: Latn
  content: Diretiva Delegada (UE) 2020/361 da Comissão de 17 de dezembro de 2019
    que altera, para efeitos de adaptação ao progresso científico e técnico, o
    anexo III da Diretiva 2011/65/UE do Parlamento Europeu e do Conselho no respeitante
    a uma isenção aplicável à utilização de crómio hexavalente como agente
    anticorrosivo nos sistemas de arrefecimento de aço-carbono dos frigoríficos
    de absorção
  type: main
- language: ro
  script: Latn
  content: Directiva delegată (UE) 2020/361 a Comisiei din 17 decembrie 2019 de modificare,
    în scopul adaptării la progresul științific și tehnic, a anexei III la Directiva
    2011/65/UE a Parlamentului European și a Consiliului în ceea ce privește o
    derogare pentru utilizarea cromului hexavalent ca agent anticoroziv în sistemul
    de răcire din oțel nealiat al refrigeratoarelor cu absorbție
  type: main
- language: sk
  script: Latn
  content: Delegovaná smernica Komisie (EÚ) 2020/361 zo 17. decembra 2019, ktorou
