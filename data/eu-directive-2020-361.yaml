  script: Latn
  content: Commission Delegated Directive (EU) 2020/361 of 17 December 2019 amending,
    for the purposes of adapting to scientific and technical progress, Annex III to
    Directive 2011/65/EU of the European Parliament and of the Council as regards
    an exemption for hexavalent chromium as an anticorrosion agent of the carbon steel
    cooling system in absorption refrigerators
  type: main
- language: fr
  script: Latn
