    Nummern 40.0580 und 40.1140) mit Ursprung in China, für die die in der Verordnung
    (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2527/93 af 13. september 1993 om genindførelse
