  content: COMMISSION REGULATION (EEC) No 2527/93 of 13 September 1993 re-establishing
    the levying of customs duties on products of categories 58 and 144 (order Nos
    40.0580 and 40.140), originating in China, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2527/93 de la Commission du 13 septembre 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 58 et 114 (numéros d'ordre 40.0580 et 40.1140), originaires de
    Chine, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
