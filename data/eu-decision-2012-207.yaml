  type: main
- language: it
  script: Latn
  content: '2012/207/UE: Decisione delegata della Commissione, dell'' 8 febbraio 2012
    , che modifica l’allegato III della decisione n. 1080/2011/UE del Parlamento
    europeo e del Consiglio che accorda alla Banca europea per gli investimenti una
    garanzia dell’Unione in caso di perdite dovute a prestiti e garanzie sui prestiti
