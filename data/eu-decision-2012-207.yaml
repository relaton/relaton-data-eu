    Ewropew u tal-Kunsill li tagħti garanzija tal-UE lill-Bank Ewropew tal-Investiment
    kontra telf minn self u garanziji għal self għal proġetti ’l barra mill-Unjoni
    u li tħassar id-Deċiżjoni Nru 633/2009/KE, fir-rigward tas-Sirja'
  type: main
- language: nl
  script: Latn
  content: '2012/207/EU: Gedelegeerd Besluit van de Commissie van 8 februari 2012
