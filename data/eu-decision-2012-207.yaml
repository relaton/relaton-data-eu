    633/2009/WE w odniesieniu do Syrii'
  type: main
- language: pt
  script: Latn
  content: '2012/207/UE: Decisão Delegada da Comissão, de 8 de fevereiro de 2012
    , que altera o anexo III da Decisão n. ° 1080/2011/UE do Parlamento Europeu
    e do Conselho que concede uma garantia da UE ao Banco Europeu de Investimento
    em caso de perdas resultantes de empréstimos e de garantias de empréstimos para
    projetos realizados fora da União e que revoga a Decisão n. ° 633/2009/CE,
    no que diz respeito à Síria'
  type: main
- language: ro
  script: Latn
  content: '2012/207/UE: Decizia delegată a Comisiei din 8 februarie 2012 de modificare,
    în ceea ce privește Siria, a anexei III la Decizia nr. 1080/2011/UE a Parlamentului
    European și a Consiliului de acordare a unei garanții a UE Băncii Europene
    de Investiții pentru pierderile rezultate din împrumuturi și garanții la împrumuturi
    pentru proiecte din afara Uniunii și de abrogare a Deciziei nr. 633/2009/CE'
  type: main
- language: sk
  script: Latn
  content: '2012/207/EÚ: Delegované rozhodnutie Komisie z 8. februára 2012 , ktorým
