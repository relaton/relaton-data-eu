    n. 633/2009/CE, per quanto riguarda la Siria'
  type: main
- language: lv
  script: Latn
  content: '2012/207/ES: Komisijas Deleģētais lēmums ( 2012. gada 8. februāris
    ), ar kuru attiecībā uz Sīriju groza III pielikumu Eiropas Parlamenta un Padomes
    Lēmumam Nr. 1080/2011/ES, ar ko Eiropas Investīciju bankai piešķir ES garantiju
