    č. 1080/2011/EU o poskytnutí záruky EU na případné ztráty Evropské investiční
    banky z úvěrů a úvěrových záruk na projekty mimo Unii a o zrušení rozhodnutí
    č. 633/2009/ES, pokud jde o Sýrii'
  type: main
- language: da
  script: Latn
  content: '2012/207/EU: Kommissionens delegerede afgørelse af 8. februar 2012 om
