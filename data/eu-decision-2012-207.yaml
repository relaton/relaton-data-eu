    и на Съвета за предоставяне на гаранция от
    ЕС на Европейската инвестиционна банка за
    загуби по заеми и гаранции по заеми за проекти,
    осъществявани извън Съюза, и за отмяна на Решение
    № 633/2009/ЕО по отношение на Сирия'
  type: main
- language: cs
  script: Latn
