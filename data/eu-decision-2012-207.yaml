    van Besluit nr. 633/2009/EG, wat Syrië betreft'
  type: main
- language: pl
  script: Latn
  content: '2012/207/UE: Decyzja delegowana Komisji z dnia 8 lutego 2012 r. zmieniająca
    załącznik III do decyzji Parlamentu Europejskiego i Rady nr 1080/2011/UE w sprawie
    udzielenia gwarancji UE dla Europejskiego Banku Inwestycyjnego na pokrycie strat
    poniesionych w związku z pożyczkami i gwarancjami udzielonymi na zabezpieczenie
