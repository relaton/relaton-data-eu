    1080/2011/EÚ, ktorým sa Európskej investičnej banke poskytuje záruka EÚ
    na pokrytie straty z úverov a zo záruk za úvery na projekty mimo Únie a ktorým
    sa zrušuje rozhodnutie č. 633/2009/ES, pokiaľ ide o Sýriu'
  type: main
- language: sl
  script: Latn
  content: '2012/207/EU: Delegirani sklep Komisije z dne 8. februarja 2012 o spremembi
    Priloge III k Sklepu št. 1080/2011/EU Evropskega parlamenta in Sveta o odobritvi
    jamstva EU Evropski investicijski banki za izgube pri posojilih in jamstvih za
    posojila za projekte zunaj Unije in o razveljavitvi Sklepa št. 633/2009/ES v
    zvezi s Sirijo'
  type: main
- language: es
  script: Latn
  content: '2012/207/UE: Decisión Delegada de la Comisión, de 8 de febrero de 2012
    , que modifica, en lo que se refiere a Siria, el anexo III de la Decisión n °
    1080/2011/UE del Parlamento Europeo y del Consejo, por la que se concede al Banco
    Europeo de Inversiones una garantía de la UE frente a las pérdidas que se deriven
