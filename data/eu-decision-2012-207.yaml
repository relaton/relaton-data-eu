title:
- language: en
  script: Latn
  content: '2012/207/EU: Commission Delegated Decision of 8 February 2012 amending
    Annex III to Decision No 1080/2011/EU of the European Parliament and of the Council
    granting an EU guarantee to the European Investment Bank against losses under
    loans and loan guarantees for projects outside the Union and repealing Decision
    No 633/2009/EC, as regards Syria'
  type: main
- language: fr
  script: Latn
  content: '2012/207/UE: Décision déléguée de la Commission du 8 février 2012
    modifiant, en ce qui concerne la Syrie, l’annexe III de la décision n ° 1080/2011/UE
    du Parlement européen et du Conseil accordant une garantie de l’Union européenne
    à la Banque européenne d’investissement en cas de pertes résultant de prêts
    et de garanties de prêts en faveur de projets réalisés en dehors de l’Union
    et abrogeant la décision n ° 633/2009/CE'
  type: main
- language: de
  script: Latn
  content: '2012/207/EU: Delegierter Beschluss der Kommission vom 8. Februar 2012
    zur Änderung von Anhang III des Beschlusses Nr. 1080/2011/EU des Europäischen
    Parlaments und des Rates über eine Garantieleistung der Europäischen Union für
    etwaige Verluste der Europäischen Investitionsbank aus Darlehen und Darlehensgarantien
    für Vorhaben außerhalb der Union und zur Aufhebung des Beschlusses Nr. 633/2009/EG
    hinsichtlich Syriens'
  type: main
- language: bg
  script: Cyrl
  content: '2012/207/ЕС: Делегирано решение на Комисията
