  content: Commission Regulation (EEC) No 2253/82 of 12 August 1982 laying down for
    the 1982/83 and 1983/84 wine-growing years conditions of use of ion exchange resins
    and detailed implementing rules for the preparation of rectified concentrated
    grape must
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2253/82 de la Commission, du 12 août 1982, déterminant
    pour les campagnes viticoles 1982/1983 et 1983/1984 les conditions d' utilisation
    des résines échangeuses d' ions et fixant les modalités d' application pour
    l' élaboration de moût de raisins concentré rectifié
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2253/82 der Kommission vom 12. August 1982 zur Festlegung
    der Verwendungsbedingungen für Ionenaustauschharze und der Durchführungsbestimmungen
    für die Bereitung von rektifiziertem Traubenmostkonzentrat für die Weinwirtschaftsjahre
    1982/83 und 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2253/82 af 12. august 1982 om betingelserne
    for anvendelse af ionbyttende harpikser og om gennemførelsesbestemmelserne for
    fremstilling af rektificeret koncentreret druemost for vinproduktionsåret 1982/83
    og 1983/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2253/82 τής Επιτροπής
