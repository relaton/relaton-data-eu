    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3322/74 af 27. december 1974 om fastsættelse
