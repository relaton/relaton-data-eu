    les droits additionnels applicables, pendant le premier trimestre de l'année
    1975, à l'importation des marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3322/74 der Kommission vom 27. Dezember 1974 zur Festsetzung
