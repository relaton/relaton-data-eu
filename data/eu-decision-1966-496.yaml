title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 3 août 1966, autorisant le Royaume de Belgique,
    le Grand-Duché de Luxembourg et le Royaume des Pays-Bas à différer le relèvement
    des droits de leur tarif douanier vers ceux du Tarif douanier commun pour les
    boudins, disques et rondelles en liège aggloméré ("plugs") destinés à la
    fabrication de bouchons-couronnes
  type: main
- language: de
  script: Latn
  content: '66/496/EWG: Entscheidung der Kommission vom 3. August 1966, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, die Angleichung der Zollsätze ihres Zolltarifs an die Sätze
    des Gemeinsamen Zolltarifs für Rundstäbe, Scheiben und Rondelle aus Preßkork
    ("plugs") zur Herstellung von Kronenkorken aufzuschieben'
  type: main
- language: it
  script: Latn
  content: '66/496/CEE: Decisione della Commissione, del 3 agosto 1966, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    a differire l''aumento dei dazi della loro tariffa doganale verso quelli della
    tariffa doganale comune per nastri, dischetti e dischi di sughero agglomerato
    («plugs») destinati alla fabbricazione di turaccioli corona'
  type: main
- language: nl
  script: Latn
  content: '66/496/EEG: Beschikking van de Commissie van 3 augustus 1966 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd om de verhoging van de rechten van hun douanetarief naar het
    peil van het gemeenschappelijk douanetarief voor kurkrollen, schijfjes en rondellen
    van geperste kurk ("plugs") voor de vervaardiging van kroonstoppen (kroonkurken)
    uit te stellen'
  type: main
