id: EUDecision199247
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '92/47/EEC: Commission Decision of 10 January 1992 recognizing Belgium
    as an officially swine fever free Member State within the context of eradication,
    and amending for the sixth time Decision 81/400/EEC establishing the status of
    Member States as regards classical swine fever with a view to its eradication'
  type: main
- language: fr
  script: Latn
  content: '92/47/CEE: Décision de la Commission, du 10 janvier 1992, reconnaissant
    la Belgique comme État membre officiellement indemne de peste porcine dans le
    cadre de l''éradication et portant sixième modification de la décision 81/400/CEE
    établissant le statut des États membres en ce qui concerne la peste porcine
    classique en vue de son éradication'
  type: main
- language: de
  script: Latn
  content: '92/47/EWG: Entscheidung der Kommission vom 10. Januar 1992 zur Anerkennung
    Belgiens als amtlich schweinepestfrei im Rahmen der Seuchentilgung und zur sechsten
    Änderung der Entscheidung 81/400/EWG über die Festlegung des Status der Mitgliedstaaten
    hinsichtlich der Ausmerzung der klassischen Schweinepest'
  type: main
- language: da
  script: Latn
  content: '92/47/EØF: Kommissionens beslutning af 10. januar 1992 om anerkendelse
    af Belgien som værende officielt fri for svinepest i forbindelse med udryddelsen
    af denne sygdom og om sjette ændring af beslutning 81/400/EØF om fastlæggelse
    af medlemsstaternes status i forbindelse med udryddelsen af klassisk svinepest'
  type: main
- language: el
  script: Grek
  content: '92/47/ΕΟΚ: Απόφαση της Επιτροπής της 10ης Ιανουαρίου
    1992 για την αναγνώριση του Βελγίου ως κράτους
    μέλους επίσημα απαλλαγμένου από την πανώλη
    των χοίρων στο πλαίσιο του προγράμματος εξάλειψης
    της ασθένειας αυτής, και για την έκτη τροποποίηση
    της απόφασης 81/400/ΕΟΚ περί καθορισμού του καθεστώτος
    των κρατών μελών όσον αφορά την κλασική πανώλη
    των χοίρων με στόχο την εξάλειψή της'
  type: main
- language: fi
  script: Latn
  content: '92/47/ETY: Komission päätös, tehty 10 päivänä tammikuuta 1992, Belgian
    vahvistamisesta virallisesti sikarutosta vapaaksi jäsenvaltioksi taudin hävittämisen
    yhteydessä ja jäsenvaltioiden aseman vahvistamisesta klassisen sikaruton hävittämisen
    yhteydessä tehdyn päätöksen 81/400/ETY muuttamisesta kuudennen kerran'
  type: main
- language: it
  script: Latn
  content: '92/47/CEE: Decisione della Commissione, del 10 gennaio 1992, che nel contesto
    del piano di eradicazione riconosce ufficialmente indenne dalla peste suina il
    territorio del Belgio e modifica per la sesta volta la decisione 81/400/CEE, che
    stabilisce lo status degli Stati nei confronti della peste suina classica in vista
    dell''eradicazione di tale malattia'
  type: main
- language: nl
  script: Latn
  content: '92/47/EEG: Beschikking van de Commissie van 10 januari 1992 waarbij België
    als officieel vrij van varkenspest wordt erkend in het kader van de uitroeiing
    van die ziekte en houdende zesde wijziging van Beschikking 81/400/EEG houdende
    vaststelling van de status van de Lid­Staten ten aanzien van de uitroeiing van
    klassieke varkenspest'
  type: main
- language: pt
  script: Latn
  content: '92/47/CEE: Decisão da Comissão, de 10 de Janeiro de 1992, que reconhece
    a Bélgica como um Estado-membro oficialmente indemne de peste suína, no contexto
    da erradicação da doença, e altera pela sexta vez a Decisão 81/400/CEE que
    estabelece o estatuto dos Estados-membros relativo à peste suína clássica para
    erradicação desta'
  type: main
- language: es
  script: Latn
  content: '92/47/CEE: Decisión de la Comisión, de 10 de enero de 1992, por la que,
    en el marco de un plan de erradicación, se reconoce a Bélgica como Estado miembro
    oficialmente indemne de peste porcina y se modifica por sexta vez la Decisión
    81/400/CEE por la que se establece el estatuto de los Estados miembros en lo que
    respecta a la peste porcina clásica a fin de lograr su erradicación'
  type: main
- language: sv
  script: Latn
  content: '92/47/EEG: Kommissionens beslut av den 10 januari 1992 om att förklara
    Belgien officiellt fritt från svinpest i samband med bekämpningen av denna sjukdom
    samt om sjätte ändringen av beslut 81/400/EEG om fastställande av medlemsstaternas
    status i fråga om bekämpning av klassisk svinpest'
  type: main
