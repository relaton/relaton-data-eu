id: EUDecision1980899
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '80/899/EEC: Commission Decision of 1 August 1980 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to shirts, T-shirts, lightweight fine knit roll,
    polo or turtle necked jumpers and pullovers, undervests and the like, falling
    within heading No ex 60.04 of the Common Customs Tariff (category 4), originating
    in Romania and in free circulation in the other Member States (Only the French
    and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/899/CEE: Décision de la Commission, du 1er août 1980, autorisant
    le Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les chemises, chemisettes, "T- shirts",
    sous-"pulls", maillots de corps et articles similaires de la position ex 60.04
    du tarif douanier commun (catégorie 4), originaires de Roumanie et mis en libre
    pratique dans les autres États membres (Les textes en langues française et néerlandaise
    sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/899/EWG: Entscheidung der Kommission vom 1. August 1980, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Oberhemden, T-Shirts, Unterziehpullis, Unterhemden
    und dergleichen der Tarifnummer ex 60.04 des Gemeinsamen Zolltarifs (Kategorie
    4) von der Gemeinschaftsbehandlung auszuschließen (Nur der französische und
    niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/899/EØF: Kommissionens beslutning af 1. august 1980 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage skjorter, herunder sports- og arbejdsskjorter,
    T-shirts, T-shirts med rullekrave, undertrøjer og lignende, som henhører under
    pos. ex 60.04 i den fælles toldtarif (kategori 4), har oprindelse i Rumænien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '80/899/CEE: Decisione della Commissione, del 1 agosto 1980, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le camicie, camicette, T- shirts, magliette
    a collo alto, camiciole e articoli affini della voce ex 60.04 della tariffa doganale
    comune, categoria 4, originari della Romania e messi in libera pratica negli altri
    Stati membri (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/899/EEG: Beschikking van de Commissie van 1 augustus 1980 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd overhemden en sporthemden, T-shirts, hemdtruien (sous-pulls),
    tricotpakken, maillots de corps en dergelijke artikelen van post ex 60.04 van
    het gemeenschappelijk douanetarief (categorie 4), van oorsprong uit Roemenië
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten (Slechts de teksten in de Franse en de Nederlandse
    taal zijn authentiek)'
  type: main
