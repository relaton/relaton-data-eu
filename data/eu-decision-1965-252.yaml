title:
- language: fr
  script: Latn
  content: Décision 65/252/CEE de la Commission, du 6 avril 1965, relative à un
    recours de la République française à l'article 115 alinéa 1 du Traité pour
    exclure du traitement communautaire les "autres antibiotiques à l'exclusion de
    l'auréomycine", originaires du Japon et mis en libre pratique dans les autres
    États membres
  type: main
- language: de
  script: Latn
  content: '65/252/EWG: Entscheidung der Kommission vom 6. April 1965 betreffend den
    Antrag der Französischen Republik gemäß Artikel 115 Absatz (1) des Vertrages,
    um aus Japan stammende und in den übrigen Mitgliedstaaten im freien Verkehr befindliche
    "andere Antibiotika, ausgenommen Aureomyzin" von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/252/CEE: Decisione della Commissione, del 6 aprile 1965, relativa a
    un ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    inteso ad escludere dal trattamento comunitario gli «altri antibiotici, tranne
    l''aureomicina», originari del Giappone ed immessi in libera pratica negli altri
    Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/252/EEG: Beschikking van de Commissie van 6 april 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag andere antibiotica, met uitzondering van aureomycine, die van
    oorsprong zijn uit Japan en in de andere Lid- Staten in het vrije verkeer zijn
    gebracht, van de communautaire behandeling uit te sluiten'
  type: main
