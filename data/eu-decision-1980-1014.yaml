type: standard
title:
- language: en
  script: Latn
  content: '80/1014/EEC: Commission Decision of 22 September 1980 authorizing the
    Kingdom of Denmark not to apply Community treatment to blouses and shirt-blouses,
    knitted, crocheted or woven, falling within subheadings ex 60.05 A II and ex 61.02
    B II of the Common Customs Tariff (category 7), originating in India and in free
    circulation in the other Member States (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/1014/CEE: Décision de la Commission, du 22 septembre 1980, autorisant
    le Royaume de Danemark à exclure du traitement communautaire les chemisiers,
    blouses- chemisiers et blouses de bonneterie, ou tissés, des sous-positions ex
    60.05 A II et ex 61.02 B II du tarif douanier commun (catégorie 7), originaires
    de l''Inde et mis en libre pratique dans les autres États membres (Le texte en
    langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '80/1014/EWG: Entscheidung der Kommission vom 22. September 1980, mit der
    das Königreich Dänemark ermächtigt wird, aus Indien stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Blusen und Hemdblusen aus Gewirken
    oder Geweben der Tarifstellen ex 60.05 A II und ex 61.02 B II des Gemeinsamen
    Zolltarifs (Kategorie 7) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der dänische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/1014/EØF: Kommissionens beslutning af 22. september 1980 om bemyndigelse
    af kongeriget Danmark til fra fællesskabsbehandling at undtage skjorter, skjortebluser
    og bluser af trikotage eller vævede, som henhører under pos. ex 60.05 A II og
    ex 61.02 B II i den fælles toldtarif (kategori 7), har oprindelse i Indien og
    frit kan omsættes i de øvrige medlemsstater (Kun den danske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '80/1014/CEE: Decisione della Commissione, del 22 settembre 1980, che autorizza
    il Regno di Danimarca ad escludere dal trattamento comunitario le camicie, le
    camicette e le bluse a maglia o tessute, delle sottovoci ex 60.05 A II ed ex 61.02
    B II della tariffa doganale comune, categoria 7, originarie dell''India e messe
    in libera pratica negli altri Stati membri (Il testo in lingua danese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '80/1014/EEG: Beschikking van de Commissie van 22 september 1980 waarbij
    het Koninkrijk Denemarken wordt gemachtigd blouses en hemdblouses, van brei- of
    haakwerk of geweven, van de posten ex 60.05 A II en ex 61.02 B II van het gemeenschappelijk
    douanetarief (categorie 7), van oorsprong uit India en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
    (Slechts de tekst in de Deense taal is authentiek)'
  type: main
