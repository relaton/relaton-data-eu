title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 848/81 of 27 March 1981 laying down certain
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of certain non-member countries in the 200 nautical mile
    zone off the coast of the French department of Guyana
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 848/81 du Conseil, du 27 mars 1981, fixant certaines
    mesures de conservation et de gestion des ressources de pêche applicables aux
    navires battant pavillon de certains pays tiers dans la zone de 200 milles située
    au large des côtes du département français de la Guyane
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 848/81 des Rates vom 27. März 1981 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände in der 200-Meilen-Zone vor
    der Küste des französischen Departements Guyana gegenüber Schiffen unter der
    Flagge bestimmter Drittländer
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 848/81 af 27. marts 1981 om fastsættelse
    af en række foranstaltninger til bevarelse og forvaltning af fiskeressourcerne
    gældende for fartøjer, der fører visse tredjelandes flag, i 200-sømilezonen
    ud for det franske departement Guyanas kyster
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 848/81 τού Συμβουλίου
    τής 27ης Μαρτίου 1981 περί καθορισμού ορισμένων
    μέτρων διατηρήσεως καί διαχειρίσεως τών αλιευτικών
    πόρων τά οποία εφαρμόζονται στά σκάφη υπό σημαία
    ορισμένων τρίτων χωρών εντός τής ζώνης 200 μιλίων,
    η οποία ευρίσκεται στά ανοικτά τών ακτών τού
    γαλλικού διαμερίσματος τής Γουϊάνας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 848/81 del Consiglio, del 27 marzo 1981, che stabilisce
    talune misure di conservazione e di gestione delle risorse ittiche da applicare
    alle navi battenti bandiera di taluni paesi terzi nella zona di 200 miglia nautiche
    situata al largo delle coste del dipartimento francese della Guiana
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 848/81 van de Raad van 27 maart 1981 tot vaststelling
    van bepaalde maatregelen voor de instandhouding en het beheer van de visbestanden,
    welke, ten aanzien van vaartuigen die de vlag van bepaalde derde landen voeren,
    van toepassing zijn in de 200-mijlszone voor de kust van het Franse departement
    Guyana
  type: main
