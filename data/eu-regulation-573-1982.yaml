title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 573/82 of 11 March 1982 re-establishing
    the levying of customs duties on image projectors (other than cinematographic
    projectors) and photographic (except cinematographic) enlargers and reducers,
    falling within heading No 90.09 and originating in Singapore, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 573/82 de la Commission, du 11 mars 1982, portant
    rétablissement de la perception des droits de douane applicables aux appareils
    de projection fixe et aux appareils d' agrandissement ou de réduction photographiques,
    de la position 90.09 du tarif douanier commun, originaires de Singapour, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 573/82 der Kommission vom 11. März 1982 zur Wiedereinführung
    der Erhebung der Zölle für Stehbildwerfer und photographische Vergrößerungs-
    oder Verkleinerungsapparate der Tarifnummer 90.09, mit Ursprung in Singapur, dem
    die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 573/82 af 11. marts 1982 om genindførelse
    af opkrævning af told for lysbilledapparater, forstørrelses- og formindskelsesapparater
    til fotografisk brug (undtagen kinematografiske), henhørende under pos. 90.09
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 573/82 τής Επιτροπής τής
    11ης Μαρτίου 1982 περί αποκαταστάσεως τής εφαρμογής
    τών δασμών γιά τά μηχανήματα ακινήτου προβολής
    καί τά μηχανήματα φωτογραφικών μεγεθύνσεων
    ή σμικρύνσεων, τής δασμολογικής κλάσεως 90.
    09, καταγωγής Σιγκαπούρης, δικαιούχων τών προβλεπομένων,
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου,
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 573/82 della Commissione, dell' 11 marzo 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli apparecchi da proiezione
    fissa e agli apparecchi fotografici d' ingrandimento o di riduzione, della voce
    90.09 della tariffa doganale comune, originari di Singapore beneficiario delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 573/82 van de Commissie van 11 maart 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op projectietoestellen
    voor niet bewegende beelden en vergrotings- en verkleiningstoestellen voor de
    fotografie van tariefpost 90.09, van oorsprong uit Singapore, waarvoor de in Verordening
    (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
