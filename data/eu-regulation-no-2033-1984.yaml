  content: Commission Regulation (EEC) No 2033/84 of 13 July 1984 laying down detailed
    rules implementing the system of aid for the use of grapes, grape must and concentrated
    grape must for the manufacture of grape juice and fixing the amounts of aid for
    the 1984/85 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2033/84 de la Commission du 13 juillet 1984 portant
    modalités d' application du régime d' aide à l' utilisation de raisins, de
    moûts de raisins et de moûts de raisins concentrés en vue de l' élaboration
    du jus de raisin et fixant les montants de l' aide pour la campagne viticole 1984/1985
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2033/84 der Kommission vom 13. Juli 1984 über Durchführungsbestimmungen
    zu der Beihilferegelung für die Verwendung von Trauben, Traubenmost und konzentriertem
    Traubenmost zur Herstellung von Traubensaft und zur Festsetzung des Beihilfebetrags
    für das Weinwirtschaftsjahr 1984/85
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2033/84 af 13. juli 1984 om gennemførelsesbestemmelserne
    for støtteordningen vedrørende anvendelse af druer, druemost og koncentreret
    druemost med henblik på forarbejdning til druesaft samt om fastsættelse af støttebeløbene
    for vinproduktionsåret 1984/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2033/84 της Επιτροπής
