- language: en
  script: Latn
  content: Council Decision (EU) 2025/1295 of 17 June 2025 establishing the position
    to be taken on behalf of the European Union in the Partnership Council established
    by the Trade and Cooperation Agreement between the European Union and the European
    Atomic Energy Community, of the one part, and the United Kingdom of Great Britain
    and Northern Ireland, of the other part, as regards a joint declaration of the
    Union and the United Kingdom in the Partnership Council of that Agreement
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2025/1295 du Conseil du 17 juin 2025 établissant la position
