    care urmează să fie adoptată în numele Uniunii Europene în cadrul Consiliului
    de parteneriat constituit prin Acordul comercial și de cooperare dintre Uniunea
    Europeană și Comunitatea Europeană a Energiei Atomice, pe de o parte, și Regatul
    Unit al Marii Britanii și Irlandei de Nord, pe de altă parte, în ceea ce privește
    o declarație comună a Uniunii și a Regatului Unit în cadrul Consiliului de
    parteneriat al acordului menționat
  type: main
