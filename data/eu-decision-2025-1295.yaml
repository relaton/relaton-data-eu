    zriadenej Dohodou o obchode a spolupráci medzi Európskou úniou a Európskym
    spoločenstvom pre atómovú energiu na jednej strane a Spojeným kráľovstvom
    Veľkej Británie a Severného Írska na strane druhej, pokiaľ ide o spoločné
    vyhlásenie Únie a Spojeného kráľovstva v Rade pre partnerstvo uvedenej dohody
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2025/1295 z dne 17. junija 2025 o določitvi stališča,
    ki se v imenu Evropske unije zastopa v Partnerskem svetu, ustanovljenem s Sporazumom
    o trgovini in sodelovanju med Evropsko unijo in Evropsko skupnostjo za atomsko
    energijo na eni strani ter Združenim kraljestvom Velika Britanija in Severna
    Irska na drugi strani, glede skupne izjave Unije in Združenega kraljestva v Partnerskem
    svetu po navedenem sporazumu
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2025/1295 del Consejo, de 17 de junio de 2025, por la que
    se establece la posición que debe adoptarse, en nombre de la Unión Europea,
    en el Consejo de Asociación establecido por el Acuerdo de Comercio y Cooperación
    entre la Unión Europea y la Comunidad Europea de la Energía Atómica, por una
    parte, y el Reino Unido de Gran Bretaña e Irlanda del Norte, por otra, con respecto
    a una declaración conjunta de la Unión y del Reino Unido ante dicho Consejo
    de Asociación
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2025/1295 av den 17 juni 2025 om fastställande av
    den ståndpunkt som ska intas på Europeiska unionens vägnar i det partnerskapsråd
    som inrättats genom avtalet om handel och samarbete mellan Europeiska unionen
    och Europeiska atomenergigemenskapen, å ena sidan, och Förenade konungariket
    Storbritannien och Nordirland, å andra sidan, vad gäller en gemensam förklaring
    av unionen och Förenade kungariket i det avtalets partnerskapsråd
