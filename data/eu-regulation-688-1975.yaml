title:
- language: en
  script: Latn
  content: Regulation (EEC) No 688/75 of the Commission of 14 March 1975 re-establishing
    the levying of the customs duties on angles, shapes and sections, of iron or steel,
    hot-rolled, etc., falling within subheadings 73.11 A II, III, IV a) 2, b), originating
    in Romania, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3054/74 of 2 December 1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 688/75 de la Commission, du 14 mars 1975, portant
    rétablissement de la perception des droits de douane applicables aux profilés
    en fer ou en acier, laminés ou filés à chaud, etc., des sous-positions tarifaires
    73.11 A II, III et IV a) 2 et b), originaires de Roumanie, bénéficiaire des
    préférences tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil
    du 2 décembre 1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 688/75 der Kommission vom 14. März 1975 zur Wiedereinführung
    des Zollsatzes für Profile aus Stahl, warm gewalzt, warm stranggepreßt usw.,
    der Tarifstellen 73.11 A II, III, IV a) 2, b), mit Ursprung in Rumänien, dem
    die in der Verordnung (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 688/75 af 14. marts 1975 om genindførelse
    af opkrævning af toldafgifter for profiler af jern og stål, varmtvalsede, etc.,
    under underpositionerne 73.11 A II, III, IV a) 2 b), som har oprindelse i Rumænien
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 688/75 della Commissione, del 14 marzo 1975, che ripristina
    la riscossione dei dazi doganali applicabili ai profilati di ferro o di acciaio,
    laminati o estrusi a caldo, fucinati, oppure ottenuti o rifiniti a freddo, palancole
    di ferro o di acciaio, anche forate o fatte di elementi riuniti, delle sottovoci
    doganali n. 73.11 A II, III, IV a) 2, b), originari della Romania, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3054/74 del Consiglio,
    del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 688/75 van de Commissie van 14 maart 1975 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op profielijzer
    en profielstaal, warm gewalst of warm geperst, enz., van de onderverdelingen 73.11
    A II, III, IV a) 2 b), van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening
    (EEG) nr. 3054/74 van de Raad van 2 december 1974 algemene tariefpreferenties
    werden geopend
  type: main
