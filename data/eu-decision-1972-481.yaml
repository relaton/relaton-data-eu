title:
- language: en
  script: Latn
  content: Commission Decision of 22 December 1972 authorizing France to apply protective
    measures to live sheep, falling within subheading 01.04 A I b) of the Common Customs
    Tariff, and mutton and lamb falling within subheading 02.01 A ex IV of the Common
    Customs Tariff, originating in third countries and in free circulation in the
    other Member States
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1972, autorisant la République
    française à appliquer des mesures de protection pour les animaux vivants de
    l'espèce ovine, position 01.04 A I B) du Tarif douanier commun, et la viande
    ovine de la position 02.01 A Ex IV du Tarif douanier commun, originaires des pays
    tiers et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/481/EWG: Entscheidung der Kommission vom 22. Dezember 1972, mit der
    die Französische Republik ermächtigt wird, Schutzmaßnahmen anzuwenden für
    lebende Schafe der Tarifnummer 01.04 A I b) des Gemeinsamen Zolltarifs und Fleisch
    von Schafen der Tarifnummer 02.01 A ex IV des Gemeinsamen Zolltarifs mit Ursprung
    in dritten Ländern, die sich in den anderen Mitgliedstaaten im freien Verkehr
    befinden'
  type: main
- language: it
  script: Latn
  content: '72/481/CEE: Decisione della Commissione, del 22 dicembre 1972, con cui
    si autorizza la Repubblica francese ad applicare delle misure di protezione per
    gli animali vivi della specie ovina (voce della tariffa doganale comune 01.04
    A I b)) e la carne ovina (voce della tariffa doganale comune 02.01 A ex IV), originari
    dei paesi terzi e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/481/EEG: Beschikking van de Commissie van 22 december 1972 waarbij
    de Franse Republiek wordt gemachtigd beschermende maatregelen te nemen voor levende
    schapen van post 01.04 A 1 b) van het gemeenschappelijk douanetarief en schapenvlees
    van post 02.01 A ex IV van het gemeenschappelijk douanetarief, van oorsprong uit
    derde landen en in andere Lid-Staten in het vrije verkeer gebracht'
  type: main
