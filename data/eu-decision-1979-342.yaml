title:
- language: en
  script: Latn
  content: '79/342/EEC: Council Decision of 26 March 1979 amending Decision 76/557/EEC
    regarding the inclusion of certain disaster-stricken communes in Italy among the
    mountain areas within the meaning of Directive 75/268/EEC on mountain and hill
    farming and farming in certain less-favoured areas'
  type: main
- language: fr
  script: Latn
  content: '79/342/CEE: Décision du Conseil, du 26 mars 1979, modifiant la décision
    76/557/CEE concernant l'' assimilation de certaines communes sinistrées en Italie
    aux zones de montagne, au sens de la directive 75/268/CEE sur l'' agriculture
    de montagne et de certaines zones défavorisées'
  type: main
- language: de
  script: Latn
