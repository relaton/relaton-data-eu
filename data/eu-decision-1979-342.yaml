    Gemeinden in Italien mit den Berggebieten im Sinne der Richtlinie 75/268/EWG über
    die Landwirtschaft in Berggebieten und in bestimmten benachteiligten Gebieten'
  type: main
- language: da
  script: Latn
  content: '79/342/EØF: Rådets beslutning af 26. marts 1979 om ændring af beslutning
