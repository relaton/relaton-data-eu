  script: Latn
  content: '86/68/EEC: Commission Decision of 19 February 1986 amending Regulation
    (EEC) No 3419/83 with a view to extending the list of products originating in
    Romania which have been liberalized at Community level'
  type: main
- language: fr
  script: Latn
  content: '86/68/CEE: Décision de la Commission du 19 février 1986 modifiant le
    règlement (CEE) n° 3419/83 en vue de l''élargissement de la liste des produits
    originaires de Roumanie libérés au niveau de la Communauté'
  type: main
- language: de
