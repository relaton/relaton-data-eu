title:
- language: en
  script: Latn
  content: '2006/389/EC: Council Decision of 15 May 2006 authorising the Republic
    of Lithuania to apply a measure derogating from Article 11 and Article 28e of
    the Sixth Directive 77/388/EEC on the harmonisation of the laws of the Member
    States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '2006/389/CE: Décision du Conseil du 15 mai 2006 autorisant la République
    de Lituanie à appliquer une mesure dérogatoire à l’article 11 et à l’article
    28 sexies de la sixième directive 77/388/CEE en matière d’harmonisation des
    législations des États membres relatives aux taxes sur le chiffre d’affaires'
  type: main
- language: de
  script: Latn
  content: '2006/389/EG: Entscheidung des Rates vom 15. Mai 2006 zur Ermächtigung
