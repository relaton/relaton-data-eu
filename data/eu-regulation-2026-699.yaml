  content: Commission Delegated Regulation (EU) 2026/699 of 23 March 2026 amending
    Regulation (EU) 2018/858 of the European Parliament and of the Council as regards
    the standardised access to vehicle on-board diagnostics information and repair
    and maintenance information, and the requirements and procedures for secure access
    to on-board diagnostic information
  type: main
- language: fr
  script: Latn
