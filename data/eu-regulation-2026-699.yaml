    l’accès normalisé aux informations du système de diagnostic embarqué des
    véhicules et aux informations sur la réparation et l’entretien, et les prescriptions
    et procédures pour l’accès sécurisé aux informations du système de diagnostic
    embarqué
  type: main
- language: de
  script: Latn
