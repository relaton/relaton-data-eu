id: EUDecision1975495
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 15 May 1975 authorizing the French Republic not
    to apply Community treatment to natural honey falling within heading No 04.06
    of the Common Customs Tariff, originating in Czechoslovakia and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/495/CEE: Décision de la Commission, du 15 mai 1975, autorisant la
    République française à exclure du traitement communautaire le miel naturel,
    de la position 04.06 du Tarif douanier commun, originaire de Tchécoslovaquie
    et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Mai 1975, mit der die Französische
    Republik ermächtigt wird, aus der Tschechoslowakei stammenden und in den übrigen
    Mitgliedstaaten im freien Verkehr befindlichen natürlichen Honig der Tarifnummer
    04.06 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 15. maj 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage naturlig honning, som henhører
    under position 04.06 i den fælles toldtarif, har oprindelse i Tjekkoslovakiet,
    og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 15 maggio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario il miele naturale della voce
    n. 04.06 della tariffa doganale comune, originario della Cecoslovacchia e messo
    in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 mei 1975 waarbij de Franse Republiek
    wordt gemachtigd natuurhonig van post 04.06 van het gemeenschappelijk douanetarief,
    van oorsprong uit Tsjechoslowakije en in de overige Lid-Staten in het vrije verkeer
    gebracht, van de communautaire behandeling uit te sluiten
  type: main
