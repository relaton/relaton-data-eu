    odstępstwo od art. 285 dyrektywy 2006/112/WE w sprawie wspólnego systemu podatku
    od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução do Conselho, de 15 de Outubro de 2010 , que autoriza
    a República Italiana a aplicar uma medida especial em derrogação ao artigo
    285. o da Directiva 2006/112/CE relativa ao sistema comum do imposto sobre o valor
    acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare a Consiliului din 15 octombrie 2010 de autorizare
    a Republicii Italiene pentru continuarea aplicării unei măsuri speciale de derogare
    de la articolul 285 din Directiva 2006/112/CE privind sistemul comun al taxei
    pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady z 15. októbra 2010 , ktorým sa Talianskej
    republike povoľuje naďalej uplatňovať osobitné opatrenie odchyľujúce sa
    od článku 285 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta z dne 15. oktobra 2010 o dovoljenju Italijanski republiki,
