  script: Latn
  content: Council Implementing Decision of 15 October 2010 authorising the Italian
    Republic to continue to apply a special measure derogating from Article 285 of
    Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution du Conseil du 15 octobre 2010 autorisant la République
