    bei dėl Bendrojo muitų tarifo I priedą
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 880/2009 tas- 7 ta’ Settembru 2009 dwar
    l-implimentazzjoni tal-Ftehim fil-forma ta’ Skambju ta’ Ittri bejn il-Komunità
    Ewropea u l-Brażil skont l-Artikolu XXIV:6 u l-Artikolu XXVIII tal-Ftehim Ġenerali
    dwar it-Tariffi u l-Kummerċ (GATT) 1994 relattivament għall-modifika ta’ konċessjonijiet
    fl-iskedi tar-Repubblika tal-Bulgarija u r-Rumanija matul l-adeżjoni tagħhom
    mal-Unjoni Ewropea, li jemenda u jissupplimenta l-Anness I tar-Regolament (KEE)
    Nru 2658/87 dwar in-nomenklatura tat-tariffa u l-istatistika u dwar it-Tariffa
    Doganali Komuni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 880/2009 van de Raad van 7 september 2009 betreffende
    de tenuitvoerlegging van de Overeenkomst in de vorm van een briefwisseling tussen
    de Europese Gemeenschap en Brazilië uit hoofde van artikel XXIV, lid 6, en artikel
    XXVIII van de Algemene Overeenkomst inzake Tarieven en Handel (GATT) 1994 betreffende
    de wijziging van de concessies die vervat zijn in de lijsten van verbintenissen
    van de Republiek Bulgarije en Roemenië, in verband met hun toetreding tot de
    Europese Unie, houdende wijziging en aanvulling van bijlage I bij Verordening
    (EEG) nr. 2658/87 met betrekking tot de tarief- en statistieknomenclatuur en het
    gemeenschappelijk douanetarief
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 880/2009 z dnia 7 września 2009 r. dotyczące
    wdrożenia Porozumienia w formie wymiany listów między Wspólnotą Europejską
    a Brazylią na podstawie art. XXIV ust. 6 i art. XXVIII Układu Ogólnego w sprawie
    Taryf Celnych i Handlu (GATT) z 1994 r. odnoszące się do zmian list koncesyjnych
    Republiki Bułgarii i Rumunii, w ramach ich przystąpienia do Unii Europejskiej,
    oraz zmieniające i uzupełniające załącznik I do rozporządzenia (EWG) nr
    2658/87 w sprawie nomenklatury taryfowej i statystycznej oraz w sprawie Wspólnej
    Taryfy Celnej
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 880/2009 do Conselho, de 7 de Setembro de 2009 ,
    relativo à execução do Acordo sob forma de troca de cartas entre a Comunidade
    Europeia e o Brasil, nos termos do n. o 6 do artigo XXIV e do artigo XXVIII do
    Acordo Geral sobre Pautas Aduaneiras e Comércio de 1994 (GATT), no que respeita
    à alteração de concessões previstas nas listas da República da Bulgária
    e da Roménia, no contexto da adesão destes países à União Europeia, e que
    altera e completa o anexo I do Regulamento (CEE) n. o 2658/87 do Conselho relativo
    à nomenclatura pautal e estatística e à pauta aduaneira comum
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 880/2009 al Consiliului din 7 septembrie 2009 privind
    punerea în aplicare a Acordului sub forma unui schimb de scrisori între Comunitatea
    Europeană și Brazilia în temeiul articolului XXIV alineatul (6) și al articolului
    XXVIII din Acordul General pentru Tarife și Comerț (GATT) 1994 privind modificarea
    concesiilor din listele de angajamente ale Republicii Bulgaria și ale României
    în cadrul procesului lor de aderare la Uniunea Europeană, de modificare și
    completare a anexei I la Regulamentul (CEE) nr. 2658/87 privind Nomenclatura tarifară
    și statistică și Tariful Vamal Comun
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 880/2009 zo 7. septembra 2009 o vykonávaní Dohody
    vo forme výmeny listov medzi Európskym spoločenstvom a Brazíliou v zmysle
    článku XXIV ods. 6 a článku XXVIII Všeobecnej dohody o clách a obchode (GATT)
    z roku 1994, ktorá sa týka zmeny úľav v zoznamoch záväzkov Bulharskej republiky
    a Rumunska v rámci ich pristúpenia k Európskej únii, ktorým sa mení a dopĺňa
    príloha I k nariadeniu (EHS) č. 2658/87 o colnej a štatistickej nomenklatúre
    a o Spoločnom colnom sadzobníku
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 880/2009 z dne 7. septembra 2009 o izvajanju Sporazuma
    v obliki izmenjave pisem med Evropsko skupnostjo in Brazilijo v skladu s členom
    XXIV:6 in členom XXVIII Splošnega sporazuma o tarifah in trgovini (GATT) 1994
    glede spremembe ugodnosti na seznamih ugodnosti Republike Bolgarije in Romunije
    v okviru njunega pristopa k Evropski uniji ter o spremembi in dopolnitvi Priloge
    I k Uredbi (EGS) št. 2658/87 o tarifni in statistični nomenklaturi ter skupni
    carinski tarifi
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 880/2009 del Consejo, de 7 de septiembre de 2009 ,
    relativo a la aplicación del Acuerdo en forma de Canje de Notas entre la Comunidad
    Europea y Brasil de conformidad con el artículo XXIV, apartado 6, y el artículo
    XXVIII del Acuerdo General sobre Aranceles Aduaneros y Comercio (GATT) de 1994,
    sobre la modificación de las concesiones en las listas de la República de Bulgaria
    y Rumanía en el contexto de su adhesión a la Unión Europea, por el que se modifica
    y completa el anexo I del Reglamento (CEE) n o 2658/87, relativo a la nomenclatura
    arancelaria y estadística y al arancel aduanero común
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 880/2009 av den 7 september 2009 om genomförande
    av avtalet genom skriftväxling mellan Europeiska gemenskapen och Förbundsrepubliken
    Brasilien enligt artikel XXIV.6 och artikel XXVIII i allmänna tull- och handelsavtalet
    (GATT) 1994 om ändring av medgivanden i Republiken Bulgariens och Rumäniens
    bindningslistor i samband med anslutningen till Europeiska unionen och om ändring
    och komplettering av bilaga I till förordning (EEG) nr 2658/87 om tulltaxe- och
