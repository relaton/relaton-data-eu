  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 880/2009, annettu 7 päivänä syyskuuta 2009
    , Euroopan yhteisön ja Brasilian välisen, vuoden 1994 tullitariffeja ja kauppaa
    koskevan yleissopimuksen (GATT-sopimus) XXIV artiklan 6 kohdan ja XXVIII artiklan
    mukaisesti Bulgarian tasavallan ja Romanian myönnytysluetteloissa mainittavien
    myönnytysten muuttamisesta niiden Euroopan unioniin liittymisen vuoksi kirjeenvaihtona
    tehdyn sopimuksen täytäntöönpanosta sekä tariffi- ja tilastonimikkeistöstä
    ja yhteisestä tullitariffista annetun asetuksen (ETY) N:o 2658/87 liitteen I
    muuttamisesta ja täydentämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 880/2009 od 7. rujna 2009. o provedbi Sporazuma
    u obliku razmjene pisama između Europske zajednice i Brazila na temelju članka
    XXIV:6 i članka XXVIII. Općeg sporazuma o carinama i trgovini (GATT) iz 1994.
    u vezi s izmjenom povlastica u rasporedima za Republiku Bugarsku i Rumunjsku prilikom
    njihovog pristupanja Europskoj uniji te o izmjeni Priloga I. Uredbi (EEZ) br.
    2658/87 o tarifnoj i statističkoj nomenklaturi i o Zajedničkoj carinskoj tarifi
  type: main
- language: hu
  script: Latn
  content: A Tanács 880/2009/EK rendelete ( 2009. szeptember 7. ) az Európai Közösség
    és Brazília között, az 1994. évi Általános Vám- és Kereskedelmi Egyezmény
    (GATT) XXIV. cikkének 6. pontja, valamint XXVIII. cikke alapján, a Bolgár Köztársaság
    és Románia engedményes listáin szereplő engedményeknek ezen országok Európai
    Közösséghez való csatlakozása során történő módosítására vonatkozóan
    levélváltás formájában létrejött megállapodás végrehajtásáról, továbbá
    a vám- és a statisztikai nómenklatúráról, valamint a Közös Vámtarifáról
    szóló 2658/87/EGK rendelet I. mellékletének módosításáról és kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 880/2009 del Consiglio, del 7 settembre 2009 , concernente
    l’attuazione dell’accordo in forma di scambio di lettere tra la Comunità
    europea e il Brasile ai sensi dell’articolo XXIV, paragrafo 6, e dell’articolo
    XXVIII dell’accordo generale sulle tariffe doganali e sul commercio (GATT) 1994
    per la modifica di concessioni negli elenchi della Repubblica di Bulgaria e della
    Romania, nel corso del loro processo di adesione all’Unione europea, che modifica
    e completa l’allegato I del regolamento (CEE) n. 2658/87 relativo alla nomenclatura
    tariffaria e statistica e alla tariffa doganale comune
  type: main
- language: lv
  script: Latn
