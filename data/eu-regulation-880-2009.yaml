title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 880/2009 of 7 September 2009 concerning the
    implementation of the Agreement in the form of an Exchange of Letters between
    the European Community and Brazil pursuant to Article XXIV:6 and Article XXVIII
    of the General Agreement on Tariffs and Trade (GATT) 1994 relating to the modification
    of concessions in the schedules of the Republic of Bulgaria and Romania in the
    course of their accession to the European Union, amending and supplementing Annex
    I to Regulation (EEC) No 2658/87 on the tariff and statistical nomenclature and
    on the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 880/2009 du Conseil du 7 septembre 2009 concernant
    la mise en œuvre de l’accord sous forme d’échange de lettres entre la Communauté
    européenne et le Brésil au titre de l’article XXIV, paragraphe 6, et de l’article
    XXVIII de l’accord général sur les tarifs douaniers et le commerce (GATT)
    de 1994 concernant la modification de concessions sur les listes d’engagements
    de la République de Bulgarie et de la Roumanie, dans le cadre de leur adhésion
    à l’Union européenne, modifiant et complétant l’annexe I du règlement
    (CEE) n o 2658/87 relatif à la nomenclature tarifaire et statistique et au tarif
    douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 880/2009 des Rates vom 7. September 2009 über die
    Durchführung des Abkommens in Form eines Briefwechsels zwischen der Europäischen
    Gemeinschaft und Brasilien gemäß Artikel XXIV Absatz 6 und Artikel XXVIII des
    Allgemeinen Zoll- und Handelsabkommens (GATT) 1994 über die Änderung der Zugeständnisse
    in den Listen der spezifischen Verpflichtungen der Republik Bulgarien und Rumäniens
    im Zuge ihres Beitritts zur Europäischen Union und zur Änderung und Ergänzung
    des Anhangs I der Verordnung (EWG) Nr. 2658/87 über die zolltarifliche und statistische
    Nomenklatur sowie den Gemeinsamen Zolltarif
  type: main
