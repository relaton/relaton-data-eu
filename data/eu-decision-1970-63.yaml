    à prix réduit du beurre de stock sous forme de beurre concentré
  type: main
- language: de
  script: Latn
  content: '70/63/EWG: Entscheidung der Kommission vom 30. Dezember 1969 zur Änderung
    der Entscheidung der Kommission vom 14. November 1969, durch die das Königreich
    Belgien ermächtigt wird, Lagerbutter in Form von Butterfett zu herabgesetzten
    Preisen zu verkaufen'
  type: main
- language: it
  script: Latn
