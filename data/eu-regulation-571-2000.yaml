    keskeyttämisestä ja käsiteltävänä olevien vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 571/2000 della Commissione, del 16 marzo 2000, che
