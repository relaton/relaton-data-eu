title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 1879/93 of 12 July 1993 re-establishing
    the levying of customs duties on products falling within CN code 3817, originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1879/93 de la Commission du 12 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 3817, originaires de Corée du Sud, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1879/93 DER KOMMISSION vom 12. Juli 1993 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3817 mit Ursprung in Südkorea,
    für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1879/93 af 12. juli 1993 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3817 og med oprindelse
    i Sydkorea, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 1879/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 12ης Ιουλίου 1993 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3817, καταγωγής Νότιας Κορέας,
    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 1879/93 DELLA COMMISSIONE del 12 luglio 1993 che ripristina
    la riscossione dei dazi doganali applicabili ai prodotti del codice NC 3817 originari
    della Corea del Sud, beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3831/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1879/93 VAN DE COMMISSIE van 12 juli 1993 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3817, van oorsprong uit Zuid-Korea, waarvoor de in Verordening (EEG)
    nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 1879/93 DA COMISSÃO de 12 de Julho de 1993 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 3817,
    originários da Coreia do Sul, beneficiários das preferências pautais previstas
    no Regulamento (CEE) no 3831/90 do Conselho
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 1879/93 DE LA COMISIÓN de 12 de julio de 1993 relativo
