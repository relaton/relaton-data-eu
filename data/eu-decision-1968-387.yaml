  content: Décision de la Commission, du 30 septembre 1968, portant octroi du concours
    du Fonds social européen au bénéfice de la République italienne pour des dépenses
    relatives à des opérations de rééducation professionnelle effectuées par
    la "Cassa per le opere straordinarie di pubblico interesse nell'Italia meridionale
    (cassa per il mezzogiorno)"
  type: main
- language: de
  script: Latn
  content: '68/387/EWG: Entscheidung der Kommission vom 30. September 1968 über die
    Gewährung eines Zuschusses aus dem ESF an die Republik Italien zu Aufwendungen
    für von der "Cassa per le opere straordinarie di pubblico interesse nell''Italia
    Meridionale (Cassa per il Mezzogiorno)" durchgeführte Maßnahmen der Berufsumschulung'
  type: main
- language: it
  script: Latn
  content: '68/387/CEE: Decisione della Commissione, del 30 settembre 1968, relativa
    alla concessione di un contributo del FSE a favore della Repubblica italiana per
    spese concernenti operazioni di riqualificazione effettuate dalla «Cassa per
    le opere straordinarie di pubblico interesse nell''Italia meridionale (Cassa per
    il Mezzogiorno)»'
  type: main
- language: nl
  script: Latn
