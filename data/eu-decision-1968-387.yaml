    toekenning van een bijdrage uit het E.S.F. ten gunste van de Italiaanse Republiek
    voor door de "Cassa per le opere straordinarie di pubblico interesse nell''Italia
    meridionale (Cassa per il Mezzogiorno)" gemaakte herscholingskosten'
