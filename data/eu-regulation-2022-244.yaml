    rezerves summa K-faktora “sniegtās tīrvērtes drošības rezerves” (K-CMG)
    aprēķināšanai
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/244 2021 m. rugsėjo 24 d.
