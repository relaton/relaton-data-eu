    no que respeita às normas técnicas de regulamentação que especificam o montante
    da margem total para efeitos de cálculo do fator K relativo à «margem de compensação
    concedida» (K-CMG)
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/244 al Comisiei din 24 septembrie 2021 de
    completare a Regulamentului (UE) 2019/2033 al Parlamentului European și al Consiliului
    în ceea ce privește standardele tehnice de reglementare care precizează cuantumul
    marjei totale pentru calcularea factorului K aferent „marjei de compensare date”
    (K-CMG)
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/244 z 24. septembra 2021, ktorým
