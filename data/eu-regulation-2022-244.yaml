    standardi za določitev zneska skupnega kritja za izračun „zagotovljenega klirinškega
    kritja“ faktorja K (K-CMG)
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/244 de la Comisión de 24 de septiembre de
