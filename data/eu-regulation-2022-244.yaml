    w odniesieniu do regulacyjnych standardów technicznych określających kwotę
    całkowitego depozytu zabezpieczającego na potrzeby obliczania współczynnika
    K „wniesiony depozyt zabezpieczający” (K-CMG)
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/244 da Comissão de 24 de setembro de 2021
