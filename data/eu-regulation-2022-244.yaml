    en de Raad met technische reguleringsnormen tot nadere bepaling van het bedrag
    van de totale marge voor de berekening van de K-factor “verleende clearingmarge”
    (K-CMG)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/244 z dnia 24 września 2021
