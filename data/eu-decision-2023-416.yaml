title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/416 of 22 February 2023 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified oilseed rape MON 94100 (MON-941ØØ-2) pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2023) 1135) (Only the Dutch text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/416 de la Commission du 22 février
    2023 autorisant la mise sur le marché de produits contenant du colza génétiquement
    modifié MON 94100 (MON-941ØØ-2), consistant en ce colza ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2023) 1135] (Le texte en langue néerlandaise
    est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/416 der Kommission vom 22. Februar 2023
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Raps MON 94100 (MON-941ØØ-2) enthalten, aus ihm bestehen oder aus ihm hergestellt
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2023) 1135) (Nur der niederländische
    Text ist verbindlich)
  type: main
