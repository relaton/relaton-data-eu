  content: COMMISSION REGULATION (EEC) No 1873/93 of 12 July 1993 re-establishing
    the levying of customs duties on products of categories 19 and 68 (order Nos 40.0190
    and 40.0680), originating in Thailand, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1873/93 de la Commission du 12 juillet 1993 portant
    rétablissement de la perception des droits de douane applicables aux produits
    des catégories 19 et 68 (numéros d'ordre 40.0190 et 40.0680) originaires de
    Thaïlande, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1873/93 DER KOMMISSION vom 12. Juli 1993 zur Wiedereinführung
