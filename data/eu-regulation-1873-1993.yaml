    und 40.0680) mit Ursprung in Thailand, für die die in der Verordnung (EWG) Nr.
    3832/90 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1873/93 af 12. juli 1993 om genindførelse
