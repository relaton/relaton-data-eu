title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 203/85 of 25 January 1985 establishing the
    list of products processed from fruit and vegetables the granting of import licences
    for which is covered by special rules
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 203/85 de la Commission du 25 janvier 1985 établissant
    la liste des produits transformés à base de fruits et légumes pour lesquels
    l' octroi des certificats d' importation est soumis à des conditions particulières
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 203/85 der Kommission vom 25. Januar 1985 zur Aufstellung
    des Verzeichnisses der Verarbeitungserzeugnisse aus Obst und Gemüse, bei denen
    die Erteilung der Einfuhrlizenzen besonderen Bedingungen unterliegt
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 203/85 af 25. januar 1985 om listen
    over produkter, der er forarbejdet på basis af frugt og grønsager, og for hvilke
    udstedelse af importlicenser sker på særlige betingelser
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 203/85 της Επιτροπής
    της 25ης Ιανουαρίου 1985 για την την κατάρτιση
    του πίνακα μεταποιημένων προϊόντων με βάση
    τα οπωροκηπευτικά για τα οποία η χορήγηση πιστοποιητικών
    εισαγωγής υπόκειται σε ειδικούς όρους
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 203/85 della Commissione del 25 gennaio 1985 che stabilisce
    l' elenco dei prodotti trasformati a base di ortofrutticoli per i quali la concessione
    dei titoli di importazione è subordinata a condizioni particolari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 203/85 van de Commissie van 25 januari 1985 tot vaststelling
    van de lijst van op basis van groenten en fruit verwerkte produkten ten aanzien
    waarvan bijzondere voorwaarden gelden voor de toekenning van invoercertificaten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 203/85 da Comissão, de 25 de Janeiro de 1985, que
    estabelece a lista dos produtos transformados à base de frutas e produtos hortícolas
    para os quais a concessão dos certificados de importação está sujeita a condições
    especiais
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 203/85 de la Comisión, de 25 de enero de 1985, por
    el que se establece la lista de los productos transformados a base de frutas y
    hortalizas para los que se somete a condiciones especiales la concesión de certificados
    de importación
  type: main
