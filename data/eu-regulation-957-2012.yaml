  content: Commission Implementing Regulation (EU) No 957/2012 of 17 October 2012
    amending Annex I to Regulation (EU) No 605/2010 as regards the deletion of the
    entry for the Netherlands Antilles in the list of third countries from which the
    introduction into the Union of consignments of raw milk and dairy products is
    authorised
  type: main
- language: fr
  script: Latn
