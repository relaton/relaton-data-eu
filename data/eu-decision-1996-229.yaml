title:
- language: en
  script: Latn
  content: '96/229/EC: Commission Decision of 11 March 1996 approving the single programming
    document for Community structural measures for improving the processing and marketing
    conditions for agricultural and forestry products in Sweden (with the exception
    of Objective 6 regions), in respect of Objective 5 (a), covering the period between
    1995 and 1999 (Only the Swedish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '96/229/CE: Décision de la Commission, du 11 mars 1996, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en Suède (à l''exception des régions de
    l''objectif n° 6, au titre de l''objectif n° 5 a), couvrant la période entre
    1995 et 1999 (Le texte en langue suédoise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '96/229/EG: Entscheidung der Kommission vom 11. März 1996 zur Genehmigung
    des den Zeitraum 1995 bis 1999 betreffenden einzigen Programmplanungsdokuments
    für strukturelle Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen für land- und forstwirtschaftliche Produkte in Schweden
    (mit Ausnahme der Gebiete der Zielvorgabe 6) im Rahmen der Zielvorgabe 5a (Nur
    der schwedische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
