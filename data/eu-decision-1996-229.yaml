    og afsætning af landbrugs- og skovbrugsprodukter i Sverige (med undtagelse af
    mål 6-områder) for mål nr. 5a for perioden 1995 til 1999 (Kun den svenske udgave
    er autentisk)'
  type: main
- language: el
  script: Grek
  content: '96/229/ΕΚ: Απόφαση της Επιτροπής, της 11ης Μαρτίου
    1996, σχετικά με την έγκριση του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις που αφορούν τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών προϊόντων
    στη Σουηδία (με εξαίρεση τις περιφέρειες του
    στόχου αριθ. 6), στο πλαίσιο του στόχου αριθ.
