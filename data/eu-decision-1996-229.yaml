  type: main
- language: fi
  script: Latn
  content: '96/229/EY: Komission päätös, tehty 11 päivänä maaliskuuta 1996,
    Ruotsin alueen (lukuun ottamatta tavoitteeseen N:o 6 kuuluvaa aluetta) maa- ja
    metsätaloustuotteiden jalostamisen ja kaupan pitämisen edellytysten parantamiseen
    liittyviä yhteisön rakenteellisia tukitoimenpiteitä koskevan yhden ohjelma-asiakirjan
    hyväksymisestä tavoitteen N:o 5a mukaisesti vuosien 1995 ja 1999 väliseksi
    ajaksi (Ainoastaan ruotsinkielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '96/229/CE: Decisione della Commissione, dell''11 marzo 1996, recante approvazione
