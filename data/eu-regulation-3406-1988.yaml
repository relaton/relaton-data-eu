    für bestimmte Getreide- und Reiserzeugnisse in Form von nicht unter Anhang II
    des Vertrages fallenden Waren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3406/88 af 31. oktober 1988 om ophævelse
