title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 6 juillet 1970, autorisant la République
    fédérale d'Allemagne à exclure du traitement communautaire les préparations
    et conserves de pommes, des positions Ex 20.05 du Tarif douanier commun, originaires
    du Japon et mises en libre pratique au Benelux
  type: main
- language: de
  script: Latn
  content: '70/377/EWG: Entscheidung der Kommission vom 6. Juli 1970, mit der die
    Bundesrepublik Deutschland ermächtigt wird, die aus Japan stammenden und in den
    Beneluxländern im freien Verkehr befindlichen Zubereitungen und Konserven von
    Äpfeln der Tarifnummern ex 20.05 und ex 20.06 des Gemeinsamen Zolltarifs von
    der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '70/377/CEE: Decisione della Commissione, del 6 luglio 1970, che autorizza
    la Repubblica federale tedesca ad escludere dal trattamento comunitario le preparazioni
    e conserve di mele, delle voci ex 20.05 e ex 20.06 della tariffa doganale comune,
    originarie del Giappone e messe in libera pratica nei paesi del Benelux'
  type: main
- language: nl
  script: Latn
  content: '70/377/EEG: Beschikking van de Commissie van 6 juli 1970 waarbij de Bondsrepubliek
    Duitsland wordt gemachtigd bereidingen en conserven van appelen van post ex 20.05
    en ex 20.06 van het gemeenschappelijk douanetarief, van oorsprong uit Japan en
    in de Benelux-landen in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten'
  type: main
