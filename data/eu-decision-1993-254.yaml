  script: Latn
  content: '93/254/EEC: Commission Decision of 9 December 1992 on Italian Decree-Law
    No 14 of 21 January 1992 relating, inter alia, to the overall refinancing of the
    aid measures provided for by Law No 64 of 1 March 1986 on special aid to the Mezzogiorno
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/254/CEE: Décision de la Commission, du 9 décembre 1992, relative
    au décret-loi italien n° 14, du 21 janvier 1992, concernant notamment le refinancement
    global des mesures d''aide prévues par la loi n° 64 du 1er mars 1986 régissant
    l''intervention extraordinaire en faveur du Mezzogiorno (Le texte en langue italienne
    est le seul faisant foi)'
  type: main
