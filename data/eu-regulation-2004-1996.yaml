title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2004/96 of 18 October 1996 laying down to
    what extent applications for issue of export licences submitted during October
    1996 for beef and veal products which may benefit from special import treatment
    in a third country may be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2004/96 DE LA COMMISSION du 18 octobre 1996 déterminant
    dans quelle mesure il peut être donné suite aux demandes de délivrance de certificats
    d'exportation déposées au mois d'octobre 1996 pour les produits du secteur de
    la viande bovine bénéficiant d'un traitement spécial à l'importation dans
    un pays tiers
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2004/96 DER KOMMISSION vom 18. Oktober 1996 über das
    Ausmaß, in dem den im Oktober 1996 eingereichten Anträgen auf Ausfuhrlizenzen
    für Erzeugnisse des Rindfleischsektors, denen bei der Einfuhr in ein Drittland
    eine besondere Behandlung zugute kommt, stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2004/96 af 18. oktober 1996 om fastlæggelse
    af i hvilket omfang ansøgninger om udstedelse af eksportlicenser indgivet i oktober
    1996 for oksekødsprodukter, der nyder særbehandling ved indførsel til et tredjeland,
    kan imødekommes
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2004/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 18ης Οκτωβρίου 1996 για καθορισμό σε ποιό
    βαθμό μπορεί να δοθεί συνέχεια στις αιτήσεις
    για την έκδοση πιστοποιητικών εξαγωγής που
    υποβλήθηκαν τον Οκτώβριο 1996 για τα προϊόντα
    του τομέα του βοείου κρέατος ειδικής μεταχειρίσεως
    κατά την εισαγωγή σε τρίτη χώρα
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2004/96, annettu 18 päivänä lokakuuta 1996,
    kolmannessa maassa erityistuontikohtelun saavien naudanliha-alan tuotteiden lokakuussa
    1996 esitettyjen vientitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2004/96 DELLA COMMISSIONE del 18 ottobre 1996 che stabilisce
    in quale misura può essere dato seguito alle domande di titoli di esportazione
    presentate nel mese di ottobre 1996 per i prodotti del settore delle carni bovine
    che beneficiano di un trattamento speciale all'importazione in un paese terzo
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2004/96 VAN DE COMMISSIE van 18 oktober 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in oktober 1996 ingediende
    aanvragen om uitvoercertificaten voor produkten van de sector rundvlees waarvoor
    een bijzondere behandeling geldt bij invoer in een derde land
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2004/96 DA COMISSÃO de 18 de Outubro de 1996 que
    determina em que medida pode ser dado seguimento aos pedidos de entrega de certificados
    de exportação depositados no mês de Outubro de 1996 em relação a produtos
    do sector da carne de bovino que beneficiam de um tratamento especial na importação
    num país terceiro
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2004/96 DE LA COMISIÓN de 18 de octubre de 1996 por
    el que se determina en qué medida podrá darse curso a las solicitudes de certificados
    de exportación, presentados en el mes de octubre de 1996, para los productos
    del sector de la carne de bovino que se beneficien de un trato especial para su
    importación en un país tercero
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2004/96 av den 18 oktober 1996 om fastställande
    av i vilken utsträckning ansökningar som lämnats in under oktober månad 1996
    om exportlicens för nötköttsprodukter som berättigar till särskild behandling
    vid import till tredje land får godkännas
