title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2818/91 of 23 September 1991 imposing a
    provisional anti-dumping duty on imports of cotton yarn originating in Brazil,
    Egypt and Turkey and terminating the anti-dumping proceeding in respect of cotton
    yarn originating in India and Thailand
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 2818/91 DE LA COMMISSION du 23 septembre 1991 instituant
    un droit antidumping provisoire sur les importations de fils de coton originaires
    du Brésil, d'' Égypte et de Turquie, et clôturant la procédure relative aux
    fils de coton originaires d'' Inde et de Thaïlande #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2818/91 DER KOMMISSION vom 23. September 1991 zur
    Einführung eines vorläufigen Antidumpingzolls auf die Einfuhren von Baumwollgarn
    mit Ursprung in Brasilien, Ägypten und der Türkei und zur Einstellung des Antidumpingverfahrens
    betreffend Baumwollgarn mit Ursprung in Indien und Thailand #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2818/91 af 23. september 1991 om indførelse
    af en midlertidig antidumpingtold på importen af garn af bomuld med oprindelse
    i Brasilien, Egypten og Tyrkiet og om afslutning af antidumpingproceduren vedrørende
    garn af bomuld med oprindelse i Indien og Thailand
  type: main
- language: el
  script: Grek
