    (DCI) (hexaméthylènetétramine), de la sous-position 29.26 B II a) du tarif
    douanier commun, originaire de Chine, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
