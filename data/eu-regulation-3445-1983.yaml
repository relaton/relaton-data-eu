  content: Commission Regulation (EEC) No 3445/83 of 5 December 1983 re-establishing
    the levying of customs duties on methenamine (INN) (hexamethylenetetramine), falling
    within subheading 29.26 B II a) and originating in China, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3377/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3445/83 de la Commission du 5 décembre 1983 portant
