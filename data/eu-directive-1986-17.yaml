  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 86/17/ETY, annettu 27 päivänä tammikuuta 1986,
    tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta osoittavien
    asiakirjojen vastavuoroisesta tunnustamisesta arkkitehtuurin alalla sekä toimenpiteistä
    sijoittautumisoikeuden ja palvelujen tarjoamisen vapauden tehokkaan käyttämisen
    helpottamiseksi annetun direktiivin 85/384/ETY muuttamisesta Portugalin liittymisen
    vuoksi
  type: main
- language: hu
  script: Latn
  content: A Tanács irányelve (1986. január 27.) az építészmérnöki oklevelek,
    bizonyítványok és a képesítés megszerzéséről szóló egyéb tanúsítványok
    kölcsönös elismeréséről, valamint a letelepedés és a szolgáltatásnyújtás
    szabadságának tényleges gyakorlását elősegítő intézkedésekről szóló
    85/384/EGK irányelvnek Portugália csatlakozása következtében szükségessé
    vált módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 86/17/CEE del Consiglio del 27 gennaio 1986 che modifica, a seguito
    dell'adesione del Portogallo, la direttiva 85/384/CEE concernente il reciproco
    riconoscimento dei diplomi, certificati ed altri titoli del settore dell'architettura
    e comportante misure destinate ad agevolare l'esercizio effettivo del diritto
    di stabilimento e di libera prestazione di servizi
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1986. gada 27. janvāris), ar ko groza, ņemot vērā
    Portugāles pievienošanos, Direktīvu Nr. 85/384/EEK par arhitektu diplomu, sertifikātu
    un citu kvalifikāciju apliecinošu dokumentu savstarpēju atzīšanu, tostarp
    par pasākumiem, kas palīdz sekmīgi īstenot tiesības veikt uzņēmējdarbību
    un brīvību sniegt pakalpojumus
  type: main
- language: lt
  script: Latn
  content: 1986 m. sausio 27 d. Tarybos Direktyva dėl Portugalijos įstojimo, iš
    dalies keičianti Direktyvą 85/384/EEB dėl architektūros diplomų, pažymėjimų
    ir kitų oficialią kvalifikaciją patvirtinančių dokumentų abipusio pripažinimo,
    įskaitant priemones, padedančias veiksmingai naudotis įsisteigimo teise ir
    laisve teikti paslaugas
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill tas-27 ta’ Jannar 1986 li temenda, minħabba
    l-adeżjoni tal-Portugall, id-Direttiva 85/384/KEE dwar ir-rikonoxximent reċiproku
    tad-diplomi, iċ-ċertifikati u l-provi l-oħra ta’ kwalifiki formali fl-arkitettura,
    inklużi miżuri li jiffaċilitaw l-eżerċizzju effettiv tad-dritt ta’ stabbiliment
    u tal-libertà li jipprovdu servizzi
  type: main
- language: nl
  script: Latn
  content: Richtlijn 86/17/EEG van de Raad van 27 januari 1986 tot wijziging, in verband
    met de toetreding van Portugal, van Richtlijn 85/384/EEG inzake de onderlinge
    erkenning van de diploma's, certificaten en andere titels op het gebied van de
    architectuur, tevens houdende maatregelen tot vergemakkelijking van de daadwerkelijke
    uitoefening van het recht van vestiging en vrij verrichten van diensten
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 27 stycznia 1986 r. zmieniająca, w związku z przystąpieniem
    Portugalii, dyrektywę Rady 85/384/EWG w sprawie wzajemnego uznawania dyplomów,
    świadectw i innych dowodów posiadania kwalifikacji w dziedzinie architektury,
    łącznie ze środkami ułatwiającymi skuteczne korzystanie z prawa przedsiębiorczości
    i swobody świadczenia usług
  type: main
- language: pt
  script: Latn
  content: Directiva 86/17/CEE do Conselho de 27 de Janeiro de 1986 que altera, em
    função da adesão de Portugal, a Directiva 85/384/CEE, que tem como objectivo
    o reconhecimento mútuo dos diplomas, certificados e outros títulos do domínio
    da arquitectura e que inclui medidas destinadas a facilitar o exercício efectivo
    do direito de estabelecimento e da livre prestação de serviços
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 27 ianuarie 1986 de modificare, în vederea aderării
    Portugaliei, a Directivei 85/384/CEE privind recunoașterea reciprocă a diplomelor,
    certificatelor și altor titluri oficiale de calificare în domeniul arhitecturii,
    inclusiv a măsurilor de facilitare a exercitării efective a dreptului de stabilire
    și a libertății de a presta servicii
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 27. januára 1986 ktorou sa v dôsledku pristúpenia Portugalska
    mení a dopĺňa smernica 85/384/EHS o vzájomnom uznávaní diplomov, osvedčení
    a iných dokladov o formálnych kvalifikáciách v oblasti architektúry a o opatreniach
    na uľahčenie účinného uplatňovania práva usadiť sa a slobody poskytovať
    služby
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 27. januarja 1986 o spremembah Direktive 85/384/EGS
    o vzajemnem priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah
    v arhitekturi, skupaj z ukrepi za učinkovito uresničevanje pravice do ustanavljanja
    podjetij in svobode opravljanja storitev, zaradi pristopa Portugalske
  type: main
- language: es
  script: Latn
  content: Directiva 86/17/CEE del Consejo de 27 de enero de 1986 por la que se modifica,
    con motivo de la adhesión de Portugal, la Directiva 85/384/CEE para el reconocimiento
    mutuo de diplomas, certificados y otros títulos en el sector de la arquitectura,
    y que incluye medidas destinadas a facilitar el ejercicio efectivo del derecho
    de establecimiento y de la libre prestación de servicios
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 86/17/EEG av den 27 januari 1986 om ändring, på grund
    av Portugals anslutning, av direktiv 85/384/EEG om det ömsesidiga erkännandet
    av utbildnings-, examens- och andra behörighetsbevis på arkitekturområdet,
    däribland åtgärder för att underlätta ett effektivt utövande av etableringsrätten
    och friheten att tillhandahålla tjänster
  type: main
