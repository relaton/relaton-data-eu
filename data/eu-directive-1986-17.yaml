title:
- language: en
  script: Latn
  content: Council Directive 86/17/EEC of 27 January 1986 amending, on account of
    the accession of Portugal, Directive 85/384/EEC on the mutual recognition of diplomas,
    certificates and other evidence of formal qualifications in architecture, including
    measures to facilitate the effective exercise of the right of establishment and
    freedom to provide services
  type: main
- language: fr
  script: Latn
  content: Directive 86/17/CEE du Conseil du 27 janvier 1986 modifiant, en raison
    de l'adhésion du Portugal, la directive 85/384/CEE visant à la reconnaissance
    mutuelle des diplômes, certificats et autres titres du domaine de l'architecture
    et comportant des mesures destinées à faciliter l'exercice effectif du droit
    d'établissement et de la libre prestation de services
  type: main
- language: de
  script: Latn
  content: Richtlinie 86/17/EWG des Rates vom 27. Januar 1986 zur durch den Beitritt
    Portugals bedingten Änderung der Richtlinie 85/384/EWG für die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstigen Befähigungsnachweise
    auf dem Gebiet der Architektur und für Maßnahmen zur Erleichterung der tatsächlichen
    Ausübung des Niederlassungsrechts und des Rechts auf freien Dienstleistungsverkehr
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 27 януари 1986 година
    за изменение, във връзка с присъединяването
    на Португалия, на Директива 85/384/ЕИО относно
    взаимното признаване на дипломи, удостоверения
    и други официални документи за професионална
    квалификация в областта на архитектурата и
    за мерките за улесняване ефективното упражняване
    на правото на установяване и свободното предоставяне
    на услуги
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 27. ledna 1986, kterou se v důsledku přistoupení
    Portugalska mění směrnice 85/384/EHS o vzájemném uznávání diplomů, osvědčení
    a jiných dokladů o dosažené kvalifikaci v oboru architektury obsahující
    opatření k usnadnění účinného výkonu práva usazování a volného pohybu
    služeb
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 86/17/EØF af 27. januar 1986 om ændring, som følge
    af Portugals tiltrædelse, af direktiv 85/384/EØF om gensidig anerkendelse af
    eksamensbeviser, certifikater og andre kvalifikationsbeviser inden for arkitekturområdet,
    herunder om foranstaltninger, som skal lette den faktiske udøvelse af retten
    til etablering og fri udveksling af tjenesteydelser
  type: main
- language: el
  script: Grek
  content: Οδηγία 86/17/ΕΟΚ του Συμβουλίου της 27ης Ιανουαρίου
