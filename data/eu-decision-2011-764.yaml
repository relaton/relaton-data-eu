title:
- language: en
  script: Latn
  content: Council Decision 2011/764/CFSP of 28 November 2011 repealing Decision 2011/210/CFSP
    on a European Union military operation in support of humanitarian assistance operations
    in response to the crisis situation in Libya (EUFOR Libya)
  type: main
- language: fr
  script: Latn
  content: Décision 2011/764/PESC du Conseil du 28 novembre 2011 abrogeant la décision
    2011/210/PESC relative à une opération militaire de l’Union européenne à
    l’appui d’opérations d’aide humanitaire en réponse à la situation de
    crise en Libye (opération EUFOR Libye)
  type: main
- language: de
  script: Latn
  content: Beschluss 2011/764/GASP des Rates vom 28. November 2011 zur Aufhebung des
    Beschlusses 2011/210/GASP über eine Militäroperation der Europäischen Union
    zur Unterstützung humanitärer Hilfseinsätze als Reaktion auf die Krisensituation
    in Libyen ( „EUFOR Libya“ )
  type: main
- language: bg
  script: Cyrl
  content: Решение 2011/764/ОВППС на Съвета от 28 ноември
    2011 година за отмяна на Решение 2011/210/ОВППС относно
    военна операция на Европейския съюз в подкрепа
    на операциите за хуманитарна помощ, в отговор
    на кризисното положение в Либия ( „EUFOR Libya“
    )
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2011/764/SZBP ze dne 28. listopadu 2011 , kterým se zrušuje
    rozhodnutí 2011/210/SZBP o vojenské operaci Evropské unie na podporu operací
    humanitární pomoci v reakci na krizovou situaci v Libyi (EUFOR Libya)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2011/764/FUSP af 28. november 2011 om ophævelse af
    afgørelse 2011/210/FUSP om Den Europæiske Unions militæroperation som støtte
    til humanitære bistandsoperationer som reaktion på krisesituationen i Libyen
    ( »EUFOR Libyen« )
  type: main
- language: el
  script: Grek
  content: Απόφαση 2011/764/ΚΕΠΠΑ του Συμβουλίου, της
    28ης Νοεμβρίου 2011 , για την κατάργηση της απόφασης
    2011/210/ΚΕΠΠΑ σχετικά με στρατιωτική επιχείρηση
    της Ευρωπαϊκής Ένωσης για την υποστήριξη επιχειρήσεων
    ανθρωπιστικής βοήθειας προς ανταπόκριση στην
    κατάσταση κρίσης που επικρατεί στη Λιβύη (
    «EUFOR Libya» )
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2011/764/ÜVJP, 28. november 2011 , millega tunnistatakse
    kehtetuks otsus 2011/210/ÜVJP Euroopa Liidu sõjalise operatsiooni kohta, mis
    viiakse läbi Liibüa kriisiolukorrale reageerimiseks, et toetada humanitaarabioperatsioone
    (EUFOR Libya)
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2011/764/YUTP, annettu 28 päivänä marraskuuta 2011
    , humanitaarisia avustusoperaatioita tukevasta Euroopan unionin sotilasoperaatiosta
    Libyan kriisitilantilanteen vuoksi (EUFOR Libya) annetun päätöksen 2011/210/YUTP
    kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2011/764/KKBP határozata ( 2011. november 28. ) a Líbiában
    kialakult válsághelyzet miatt szükségessé vált humanitárius segítségnyújtásra
    irányuló európai uniós katonai műveletekről ( „EUFOR Libya” ) szóló
    2011/210/KKBP határozat hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Decisione 2011/764/PESC del Consiglio, del 28 novembre 2011 , che abroga
    la decisione 2011/210/PESC relativa all’operazione militare dell’Unione europea
    a sostegno di operazioni di assistenza umanitaria in risposta alla situazione
    di crisi in Libia (EUFOR Libia)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2011/764/KĀDP ( 2011. gada 28. novembris ), ar ko atceļ
    Lēmumu 2011/210/KĀDP par Eiropas Savienības militāro operāciju, lai atbalstītu
    humānās palīdzības operācijas, reaģējot uz krīzes situāciju Lībijā
    ( EUFOR Libya )
  type: main
- language: lt
  script: Latn
  content: 2011 m. lapkričio 28 d. Tarybos sprendimas 2011/764/BUSP, kuriuo panaikinamas
    Sprendimas 2011/210/BUSP dėl Europos Sąjungos karinės operacijos humanitarinės
    pagalbos operacijoms remti reaguojant į krizę Libijoje (EUFOR Libya)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2011/764/PESK tat- 28 ta’ Novembru 2011 li tħassar
    id-Deċiżjoni 2011/210/PESK dwar operazzjoni militari tal-Unjoni Ewropea sabiex
    tappoġġa operazzjonijiet ta’ assistenza umanitarja bħala risposta għas-sitwazzjoni
    ta’ kriżi fil-Libja (EUFOR Libya)
  type: main
- language: nl
  script: Latn
  content: Besluit 2011/764/GBVB van de Raad van 28 november 2011 tot intrekking van
    Besluit 2011/210/GBVB inzake een militaire operatie van de Europese Unie ter ondersteuning
    van humanitaire hulpoperaties naar aanleiding van de crisissituatie in Libië
    (EUFOR Libië)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2011/764/WPZiB z dnia 28 listopada 2011 r. uchylająca decyzję
    2011/210/WPZiB w sprawie operacji wojskowej Unii Europejskiej służącej wsparciu
    operacji pomocy humanitarnej w odpowiedzi na sytuację kryzysową w Libii (EUFOR
    Libya)
  type: main
- language: pt
  script: Latn
  content: Decisão 2011/764/PESC do Conselho, de 28 de Novembro de 2011 , que revoga
    a Decisão 2011/210/PESC sobre uma operação militar da União Europeia de apoio
    às operações de ajuda humanitária em resposta à situação de crise na Líbia
    ( «EUFOR Líbia» )
  type: main
- language: ro
  script: Latn
  content: Decizia 2011/764/PESC a Consiliului din 28 noiembrie 2011 de abrogare a
    Deciziei 2011/210/PESC privind o operație militară a Uniunii Europene în sprijinul
    operațiilor de asistență umanitară ca urmare a situației de criză din Libia
    (EUFOR Libia)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2011/764/SZBP z 28. novembra 2011 , ktorým sa zrušuje
    rozhodnutie 2011/210/SZBP o vojenskej operácii Európskej únie na podporu operácií
    humanitárnej pomoci v reakcii na krízovú situáciu v Líbyi (EUFOR Libya)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2011/764/SZVP z dne 28. novembra 2011 o razveljavitvi Sklepa
    2011/210/SZVP o vojaški operaciji Evropske unije v podporo operacijam humanitarne
    pomoči v odziv na krizne razmere v Libiji (EUFOR Libya)
  type: main
- language: es
  script: Latn
  content: Decisión 2011/764/PESC del Consejo, de 28 de noviembre de 2011 , por la
    que se deroga la Decisión 2011/210/PESC sobre una operación militar de la Unión
    Europea en apoyo de las operaciones de asistencia humanitaria como respuesta a
    la situación de crisis existente en Libia ( «EUFOR Libia» )
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2011/764/Gusp av den 28 november 2011 om upphävande av
    beslut 2011/210/Gusp om Europeiska unionens militära operation till stöd för
    humanitära biståndsoperationer med anledning av krissituationen i Libyen (Eufor
    Libyen)
