title:
- language: en
  script: Latn
  content: '79/17/EEC: Commission Decision of 5 December 1978 authorizing the Italian
    Republic not to apply Community treatment to tableware and other articles of a
    kind commonly used for domestic or toilet purposes, of porcelain or china (including
    biscuit porcelain and parian), falling within heading No 69.11 of the Common Customs
    Tariff, originating in Japan and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/17/CEE: Décision de la Commission, du 5 décembre 1978, autorisant
    la République italienne à exclure du traitement communautaire la vaisselle et
    les articles de ménage ou de toilette en porcelaine de la position 69.11 du tarif
    douanier commun, originaires du Japon et mis en libre pratique dans les autres
    États membres'
  type: main
- language: de
  script: Latn
  content: '79/17/EWG: Entscheidung der Kommission vom 5. Dezember 1978, mit der die
    Italienische Republik ermächtigt wird, aus Japan stammendes und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliches Geschirr, Haushalts- und Toilettengegenstände,
    aus Porzellan, der Tarifnummer 69.11 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/17/EØF: Kommissionens beslutning af 5. december 1978 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage bordservice
    samt husholdnings- og toiletartikler, af porcelæn, som henhører under pos. 69.11
    i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes i de øvrige
    medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/17/CEE: Decisione della Commissione, del 5 dicembre 1978, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario vasellame e oggetti
    di uso domestico o da toletta, di porcellana, della voce 69.11 della tariffa doganale
    comune, originari del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/17/EEG: Beschikking van de Commissie van 5 december 1978 waarbij de
    Italiaanse Republiek wordt gemachtigd vaatwerk, huishoudelijke artikelen en toiletartikelen
    van porselein van post 69.11 van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
