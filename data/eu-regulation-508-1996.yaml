title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 508/96 of 25 March 1996 determining the extent
    to which applications lodged in March 1996 for licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with the Republic of Poland, the Republic of Hungary, the Czech
    Republic and the Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 508/96 DE LA COMMISSION du 25 mars 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    mars 1996 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 508/96 DER KOMMISSION vom 25. März 1996 über die
    Festsetzung des Umfangs, in dem die im März 1996 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn, der Tschechischen
    Republik und der Slowakischen Republik genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 508/96 af 25. marts 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i marts
    1996 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Republikken Polen, Republikken Ungarn, Den Tjekkiske Republik og Den Slovakiske
    Republik
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 508/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Μαρτίου 1996 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνει αποδεκτή η αίτηση
    που υποβλήθηκε το Μάρτιο του 1996 για άδειες
    εισαγωγής αυγών και κρέατος πουλερικών βάσει
    του καθεστώτος που προβλέπεται από τις συμφωνίες,
