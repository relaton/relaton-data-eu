    hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 508/96 DELLA COMMISSIONE del 25 marzo 1996 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di marzo 1996 per taluni prodotti del settore delle uova e
    del pollame nel quadro del regime previsto dagli accordi conclusi tra la Comunità
