    την Τσεχική Δημοκρατία και τη Σλοβακική Δημοκρατία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 508/96, annettu 25 päivänä maaliskuuta 1996,
    yhteisön sekä Puolan, Unkarin, Tsekin tasavallan ja Slovakian tasavallan välisissä
    väliaikaisissa sopimuksissa määrättyyn järjestelmään liittyvien maaliskuussa
