    kollha mrobbija għall-bajd u li jħassar ir-Regolamenti (UE) Nru 1117/2010 u
    (UE) Nru 849/2012 (id-detentur tal-awtorizzazzjoni Vetagro SpA)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/2119 van de Commissie van 16 december
