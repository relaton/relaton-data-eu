    ċitriku, l-aċidu sorbiku, it-timol u l-vanillina bħala addittiv fl-għalf għall-ispeċijiet
    porċini kollha (miftuma), it-tiġieġ tas-simna, it-tiġieġ imrobbija għall-bajd,
