    izmantot par barības piedevu visiem atšķirtiem cūku sugas dzīvniekiem, gaļas
    cāļiem, dējējvistu cāļiem, visiem retāk audzētu sugu gaļas putniem un
    visiem retāk audzētu sugu putniem, kurus audzē dēšanai, un atceļ Regulu
    (ES) Nr. 1117/2010 un (ES) Nr. 849/2012 (atļaujas turētājs – Vetagro SpA)
  type: main
