    2020 relativo al rinnovo dell’autorizzazione di un preparato di acido citrico,
    acido sorbico, timolo e vanillina come additivo per mangimi destinati a tutte
    le specie suine (svezzate), polli da ingrasso, pollastre allevate per la produzione
    di uova, tutte le specie avicole minori da ingrasso e allevate per la produzione
    di uova e che abroga i regolamenti (UE) n. 1117/2010 e (UE) n. 849/2012 (titolare
    dell’autorizzazione Vetagro SpA)
  type: main
- language: lv
  script: Latn
