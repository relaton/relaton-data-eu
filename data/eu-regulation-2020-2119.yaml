    valmisteen hyväksynnän uusimisesta kaikkien sikaeläinlajien (vieroitetut),
    broilerien, kananuorikoiden ja kaikkien lihantuotantoa varten kasvatettavien ja
    munivien toissijaisten lintulajien rehun lisäaineena (hyväksynnän haltija Vetagro
    SpA) sekä asetusten (EU) N:o 1117/2010 ja (EU) N:o 849/2012 kumoamisesta
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2020/2119 оd 16. prosinca 2020. o produljenju
