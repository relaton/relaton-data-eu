    kao dodatka hrani za sve vrste svinja (odbijene), piliće za tov, piliće uzgajane
    za nesenje, sve manje značajne vrste ptica za tov i sve manje značajne vrste
    ptica uzgajane za nesenje te o stavljanju izvan snage uredaba (EU) br. 1117/2010
    i (EU) br. 849/2012 (nositelj odobrenja Vetagro SpA)
  type: main
