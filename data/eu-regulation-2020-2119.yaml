    (elválasztott) sertésféle, brojlercsirkék, tojójércék és valamennyi kevésbé
    jelentős hízó- és tojómadárfaj takarmány-adalékanyagaként történő
    engedélyezésének megújításáról, valamint az 1117/2010/EU és a 849/2012/EU
