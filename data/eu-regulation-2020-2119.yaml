    pikendatakse luba kasutada sidrunhappe, sorbiinhappe, tümooli ja vanilliini preparaati
    kõigi (võõrutatud) sealiikide, broilerkanade, noorkanade, kõigi vähemlevinud
    linnuliikide nuum- ja noorlindude söödalisandina ning millega tunnistatakse
    kehtetuks määrused (EL) nr 1117/2010 ja (EL) nr 849/2012 (loa hoidja Vetagro
    SpA)
