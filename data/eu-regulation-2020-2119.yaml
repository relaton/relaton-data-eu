title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2119 of 16 December 2020 concerning
    the renewal of the authorisation of the preparation of citric acid, sorbic acid,
    thymol and vanillin as a feed additive for all porcine species (weaned), chickens
    for fattening, chickens reared for laying, all minor avian species for fattening
    and all minor avian species reared for laying and repealing Regulations (EU) No
    1117/2010 and (EU) No 849/2012 (holder of authorisation Vetagro SpA)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/2119 de la Commission du 16 décembre
    2020 concernant le renouvellement de l’autorisation d’une préparation d’acide
    citrique, d’acide sorbique, de thymol et de vanilline en tant qu’additif pour
    l’alimentation de toutes les espèces porcines (sevrées), des poulets d’engraissement,
    des poulettes destinées à la ponte, de toutes les espèces aviaires mineures
    destinées à l’engraissement et de toutes les espèces aviaires mineures élevées
    pour la ponte, et abrogeant les règlements (UE) no 1117/2010 et (UE) no 849/2012
    (titulaire de l’autorisation: Vetagro SpA)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2020/2119 der Kommission vom 16. Dezember
    2020 zur Verlängerung der Zulassung einer Zubereitung aus Zitronensäure, Sorbinsäure,
    Thymol und Vanillin als Zusatzstoff in Futtermitteln für alle (entwöhnten) Schweinearten,
    Masthühner, Junghennen, alle Vogelarten von geringerer wirtschaftlicher Bedeutung
    für die Mast und Jungtiere aller Vogelarten geringerer wirtschaftlicher Bedeutung
    für Legezwecke sowie zur Aufhebung der Verordnungen (EU) Nr. 1117/2010 und (EU)
    Nr. 849/2012 (Zulassungsinhaber: Vetagro S.p.A.)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/2119 на Комисията
    от 16 декември 2020 година за подновяване на разрешението
    за употреба на препарат от лимонена киселина,
    сорбинова киселина, тимол и ванилин като фуражна
    добавка за всички видове свине (отбити), пилета,
    отглеждани за угояване, пилета, отглеждани
    за носачки, всички видове птици с по-малко стопанско
    значение, отглеждани за угояване и всички видове
    птици с по-малко стопанско значение, отглеждани
    за носачки, и за отмяна на регламенти (ЕС) №
    1117/2010 и (ЕС) № 849/2012 (притежател на разрешението
    Vetagro S.p.A)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/2119, ze dne 16. prosince 2020
    o obnovení povolení přípravku z kyseliny citronové, kyseliny sorbové, thymolu
    a vanilinu jako doplňkové látky pro všechny druhy prasat (po odstavu), výkrm
    kuřat, odchov kuřat a kuřice a výkrm a kuřice všech menšinových druhů
    ptactva a o zrušení nařízení (EU) č. 1117/2010 a (EU) č. 849/2012 (držitel
    povolení Vetagro SpA)
  type: main
- language: da
  script: Latn
