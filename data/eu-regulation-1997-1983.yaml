  content: Commission Regulation (EEC) No 1997/83 of 18 July 1983 fixing, for the
    1983/84 marketing year, the minimum price to be paid to producers and the amount
    of production aid for Williams pears in syrup
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1997/83 de la Commission du 18 juillet 1983 fixant
    pour la campagne 1983/1984 le prix minimal à payer aux producteurs ainsi que
    le montant de l' aide à la production pour les poires Williams au sirop
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1997/83 der Kommission vom 18. Juli 1983 zur Festsetzung
    des den Erzeugern zu zahlenden Mindestpreises sowie des Betrages der Produktionsbeihilfe
    für Williamsbirnen in Sirup für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1997/83 af 18. juli 1983 om fastsættelse
    for produktionsåret 1983/84 af den minimumspris, der skal betales producenterne,
    samt af producentstøtten for Williams-pærer i sukkeropløsning
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1997/83 της Επιτροπής
