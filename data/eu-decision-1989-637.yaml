  content: Décision de la Commission du 31 octobre 1989 concernant l'établissement
    des cadres communautaires d'appui pour les interventions structurelles communautaires
    dans les régions françaises concernées par l'objectif n° 1, à savoir les
    départements français d'outre-mer (DOM) et la Corse (Le texte en langue française
    est le seul faisant foi)
  type: main
- language: de
  script: Latn
