    Foerderkonzepte fuer die Strukturinterventionen der Gemeinschaft in den franzoesischen
    Regionen, die unter das Ziel Nr. 1 fallen, d. h.: die franzoesischen ueberseeischen
    Departements (DOM) und Korsika'
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS BESLUTNING af 31. oktober 1989 om fastlaeggelse af faellesskabsstoetterammer
