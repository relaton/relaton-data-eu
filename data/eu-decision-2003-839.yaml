  script: Latn
  content: '2003/839/EC: Commission Decision of 21 November 2003 amending Annexes
    I and II to Decision 2002/308/EC establishing lists of approved zones and approved
    farms with regard to one or more of the fish diseases viral haemorrhagic septicaemia
    (VHS) and infectious haematopoietic necrosis (IHN) (Text with EEA relevance) (notified
    under document number C(2003) 4313)'
  type: main
- language: fr
  script: Latn
  content: '2003/839/CE: Décision de la Commission du 21 novembre 2003 modifiant
    les annexes I et II de la décision 2002/308/CE établissant les listes des zones
    et des exploitations piscicoles agréées au regard de la septicémie hémorragique
    virale (SHV) ou de la nécrose hématopoïétique infectieuse (NHI), ou de ces
    deux maladies (Texte présentant de l''intérêt pour l''EEE) [notifiée sous
    le numéro C(2003) 4313]'
  type: main
- language: de
  script: Latn
  content: '2003/839/EG: Entscheidung der Kommission vom 21. November 2003 zur Änderung
    der Anhänge I und II der Entscheidung 2002/308/EG zur Festlegung der Verzeichnisse
    der hinsichtlich der Viralen Hämorrhagischen Septikämie (VHS) und/oder der Infektiösen
    Hämatopoetischen Nekrose (IHN) zugelassenen Gebiete und Fischzuchtbetriebe in
    nicht zugelassenen Gebieten (Text von Bedeutung für den EWR) (Bekannt gegeben
    unter Aktenzeichen K(2003) 4313)'
  type: main
- language: cs
  script: Latn
