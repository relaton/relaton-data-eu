    listas de zonas y piscifactorías autorizadas en relación con la septicemia hemorrágica
    viral (SHV) y la necrosis hematopoyética infecciosa (NHI) (Texto pertinente a
    efectos del EEE) [notificada con el número C(2003) 4313]'
  type: main
