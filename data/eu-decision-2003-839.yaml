    di allevamento ittico riconosciute per quanto concerne la setticemia emorragica
    virale (VHS) e la necrosi ematopoietica infettiva (IHN) (Testo rilevante ai fini
    del SEE) [notificata con il numero C(2003) 4313]'
  type: main
- language: lv
  script: Latn
  content: Komisijas Lēmums (2003. gada 21. novembris), ar kuru groza I un II pielikumu
    Lēmumam 2002/308/EK, ar ko nosaka apstiprināto zonu un apstiprināto audzētavu
    sarakstu attiecībā uz vienu vai vairākām zivju slimībām – vīrusu hemorāģisko
    septicēmiju (VHS) un infekciozo hematopoētisko nekrozi (IHN) (izziņots ar dokumenta
    numuru C(2003) 4313)
  type: main
- language: lt
  script: Latn
  content: 2003 m. lapkričio 21 d. Komisijos sprendimas, iš dalies keičiantis Sprendimo
    2002/308/EB, nustatančio patvirtintų zonų ir patvirtintų ūkių, atsižvelgiant
    į vienos ar kelių žuvų ligų – virusinės hemoraginės septicemijos (VHS)
    arba infekcinės hemotopoetinės nekrozės (IHN) – paplitimą, sąrašus, I
    ir II priedus (pranešta dokumentu Nr. C(2003) 4313)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni tal-Kummissjoni tal-21 ta' Novembru 2003 li temenda l-Annessi
    I u II għad-Deċiżjoni 2002/308/KE li tistabbilixxi l-listi ta' nħawi u rziezet
    approvati b'rabta ma' waħda jew aktar mill-mard tal-ħut tas-settiċemija emorraġika
    tad-demm (VHS) u tan-nekrożi emapojetika infettiva (IHN) (notifikata bid-dokument
    numru K(2003) 4313)
  type: main
- language: nl
  script: Latn
  content: '2003/839/EG: Beschikking van de Commissie van 21 november 2003 tot wĳziging
    van de bĳlagen I en II van Beschikking 2002/308/EG tot vaststelling van de lĳsten
    van erkende gebieden en erkende viskwekerĳen ten aanzien van virale hemorragische
    septikemie (VHS), van infectieuze hematopoïetische necrose (IHN) of van beide
    visziekten (Voor de EER relevante tekst) (kennisgeving geschied onder nummer C(2003)
    4313)'
  type: main
- language: pl
  script: Latn
  content: 'Decyzja Komisji z dnia 21 listopada 2003 r. zmieniająca załączniki
    I i II do decyzji 2002/308/WE ustanawiającej wykaz zatwierdzonych stref i zatwierdzonych
    hodowli w odniesieniu do jednej lub więcej chorób ryb: wirusowej posocznicy
    krwotocznej (VHS) i zakaźnej martwicy układu krwiotwórczego (IHN) (notyfikowana
    jako dokument nr C(2003) 4313)'
  type: main
- language: pt
  script: Latn
  content: '2003/839/CE: Decisão da Comissão, de 21 de Novembro de 2003, que altera
    os anexos I e II da Decisão 2002/308/CE que estabelece as listas das zonas aprovadas
    e das explorações aprovadas no que diz respeito a uma ou mais doenças dos peixes,
    nomeadamente a septicemia hemorrágica viral (SHV) e a necrose hematopoética
    infecciosa (NHI) (Texto relevante para efeitos do EEE) [notificada com o número
    C(2003) 4313]'
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Komisie z 21. novembra 2003, ktorým sa menia a dopĺňajú
    prílohy I a II k rozhodnutiu 2002/308/ES, ktorým sa ustanovujú zoznamy schválených
    zón a schválených fariem, pokiaľ ide o ochorenie rýb na vírusovú hemoragickú
    septikémiu (VHS) a infekčnú hematopoetickú nekrózu (IHN), alebo pokiaľ ide
    o obidve tieto ochorenia (oznámené pod číslom dokumentu C(2003) 4313)
  type: main
