    rybích hospodářství, pokud jde o virovou hemoragickou septikémii (VHS) a
    infekční nekrózu krvetvorné tkáně (IHN) nebo o obě tyto nákazy (oznámeno
    pod číslem K(2003) 4313)
  type: main
