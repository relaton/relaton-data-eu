title:
- language: en
  script: Latn
  content: '78/911/EEC: Commission Decision of 18 October 1978 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of cotton, other than
    gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle
    and other net fabrics falling within heading No 55.09 of the Common Customs Tariff
    (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29,
    31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65,
    66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93,
    97) originating in Peru and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/911/CEE: Décision de la Commission, du 18 octobre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tissus de coton autres
    que tissus à point de gaze, bouclés du genre éponge, rubanerie, velours, peluches,
    tissus bouclés, tissus de chenille, tulles et tissus à mailles nouées de la
    position ex 55.09 du tarif douanier commun (codes Nimexe: 55.09-01; 02; 03; 04;
    05; 11; 12; 13; 14; 15; 16; 17; 19; 21; 29; 31; 33; 35; 37; 38; 39; 41; 49; 51;
    52; 53; 54; 55; 56; 57; 59; 61; 63; 64; 65; 66; 67; 68; 69; 70; 71; 72; 73; 74;
    76; 77; 78; 81; 82; 83; 84; 86; 87; 92; 93; 97), originaires du Pérou et mis
    en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/911/EWG: Entscheidung der Kommission vom 18. Oktober 1978, mit der
    das Vereinigte Königreich ermächtigt wird, aus Peru stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere als
    Drehergewebe, Schlingengewebe (Frottiergewebe), Bänder, Samt, Plüsch, Schlingengewebe,
    Chenillegewebe, Tülle und geknüpfte Netzstoffe, der Tarifnummer 55.09 des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 55.09-01; 02; 03; 04; 05; 11; 12; 13; 14; 15; 16;
    17; 19; 21; 29; 31; 33; 35; 37; 38; 39; 41; 49; 51; 52; 53; 54; 55; 56; 57; 59;
    61; 63; 64; 65; 66; 67; 68; 69; 70; 71; 72; 73; 74; 76; 77; 78; 81; 82; 83; 84;
    86; 87; 92; 93; 97) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/911/EØF: Kommissionens beslutning af 18. oktober 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld, bortset fra drejervævet stof af bomuld, frotterstof, vævede bånd,
    fløjls-, plys- og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos. 55.09 i den fælles toldtarif (NIMEXE-kode 55.09-01, 02, 03, 04, 05,
    11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52,
    53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76,
    77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97), har oprindelse i Peru og frit kan
    omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/911/CEE: Decisione della Commissione, del 18 ottobre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i tessuti di cotone, diversi
    da quelli a punto di garza, ricci del tipo spugna, passamaneria, velluti, felpe,
    tessuti di ciniglia, tulli e tessuti a maglie annodate, della voce 55.09 della
    tariffa doganale comune (codice Nimexe: 55.09-01, 02, 03, 04, 05, 11, 12, 13,
    14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55,
    56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81,
    82, 83, 84, 86, 87, 92, 93, 97), originari del Perù e messi in libera pratica
    negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/911/EEG: Beschikking van de Commissie van 18 oktober 1978 waarbij het
    Verenigd Koninkrijk wordt gemachtigd weefsels van katoen, andere dan weefsels
    met gaasbinding, bad- of frotteerstof (lussendoek) lint, fluweel, pluche, lussenweefsel,
    chenilleweefsel, tule en filet-weefsels, van post 55.09 van het gemeenschappelijk
