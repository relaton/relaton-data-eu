title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2648/95 of 14 November 1995 determining to
    what extent licence applications submitted during October 1995 for live bovine
    animals weighing between 160 and 300 kg as part of a tariff quota provided for
    pursuant to Regulation (EC) No 2465/95
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2648/95 DE LA COMMISSION du 14 novembre 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en octobre 1995 pour les animaux vivants de l'espèce bovine d'un
    poids de 160 à 300 kilogrammes dans le cadre d'un contingent tarifaire prévu
    par le règlement (CE) n° 2465/95
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2648/95 DER KOMMISSION vom 14. November 1995 zur Festsetzung
    des Umfangs, in dem die im Oktober 1995 für die Einfuhr lebender, 160 bis 300
    kg schwerer Rinder im Rahmen von Zollkontingenten gemäß der Verordnung (EG)
    Nr. 2465/95 beantragten Lizenzen genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2648/95 af 14. november 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i oktober 1995 om
    importlicenser for levende kvæg af en vægt på 160 til 300 kg i forbindelse
    med et toldkontingent, der er fastsat i forordning (EF) nr. 2465/95
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2648/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 14ης Νοεμβρίου 1995 για τον καθορισμό του
    βαθμού στον οποίο είναι δυνατόν να γίνουν αποδεκτές
    οι αιτήσεις πιστοποιητικών εισαγωγής που έχουν
    υποβληθεί τον Οκτώβριο 1995 για ζωντανά ζώα του
    βοείου είδους, βάρους από 160 έως 300 χιλιόγραμμα,
    στο πλαίσιο μιας δασμολογικής ποσόστωσης η
    οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    2465/95
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2648/95, annettu 14 päivänä marraskuuta 1995,
    eläviä 160@300 kilogrammaa painavia nautaeläimiä koskevien lokakuussa 1995
    jätettyjen tuontilupahakemusten hyväksyttävyydestä asetuksessa (EY) N:o 2465/95
    määriteltyjen tariffikiintiöiden rajoissa
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2648/95 DELLA COMMISSIONE del 14 novembre 1995 che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di ottobre 1995 per gli animali vivi della specie bovina,
    dai 160 ai 300 chilogrammi, nel quadro del contingente tariffario previsto dal
    regolamento (CE) n. 2465/95
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2648/95 VAN DE COMMISSIE van 14 november 1995 tot
    vaststelling van de mate waarin gevolg kan worden gegeven aan de aanvragen om
    invoercertificaten voor levende runderen met een gewicht van 160 tot 300 kg, die
    in oktober 1995 zijn ingediend op grond van een tariefcontingent dat is vastgesteld
    bij Verordening (EG) nr. 2465/95
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2648/95 DA COMISSÃO de 14 de Novembro de 1995 que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de animais vivos da espécie bovina com peso compreendido entre 160 e 300 quilogramas,
    apresentados em Outubro de 1995 ao abrigo de um contingente tarifário previsto
    pelo Regulamento (CE) nº 2465/95
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CE) N° 2648/95 DE LA COMISIÓN de 14 de noviembre de 1995
    por el que se determina la proporción en que se satisfarán las solicitudes de
    licencias de importación de animales vivos de la especie bovina con un peso entre
    160 y 300 kilogramos, presentadas en octubre de 1995 dentro de un contingente
    arancelario establecido en el Reglamento (CE) n° 2465/95
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EG) nr 2648/95 av den 14 november 1995 om i
    vilken utsträckning licensansökningar inlämnade under oktober 1995 för levande
    nötkreatur med en vikt på 160_300 kg inom ramen för den avgiftskvot som fastställts
    i förordning (EG) nr 2465/95
