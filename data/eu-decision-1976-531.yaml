id: EUDecision1976531
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 27 April 1976 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of silk, unbleached, falling within
    heading No ex 50.09 of the Common Customs Tariff, originating in the People's
    Republic of China and in free circulation in the other Member States
  type: main
- language: fr
  script: Latn
  content: '76/531/CEE: Décision de la Commission, du 27 avril 1976, autorisant la
    République italienne à exclure du traitement communautaire les tissus de soie,
    écrus, de la position Ex 50.09 du Tarif douanier commun, originaires de la République
    populaire de Chine et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 27. April 1976, mit der die Italienische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Seide, roh, der Tarifnummer
    ex 50.09 des Gemeinsamen Zolltarifs, von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 27. april 1976 om bemyndigelse af Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af natursilke,
    ubehandlede, som henhører under pos. ex 50.09 i den fælles toldtarif, har oprindelse
    i Den kinesiske Folkerepublik og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 27 aprile 1976, che autorizza la Repubblica
    italiana ad escludere dal trattamento comunitario i tessuti di seta, greggi, della
    voce ex 50.09 della tariffa doganale comune, originari della Repubblica popolare
    cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 27 april 1976 waarbij de Italiaanse Republiek
    wordt gemachtigd weefsels van zijde, ongebleekt, van post ex 50.09 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China, en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
