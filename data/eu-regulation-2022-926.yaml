title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/926 of 15 June 2022 imposing
    a definitive anti-dumping duty on imports of tubes and pipes of ductile cast iron
    (also known as spheroidal graphite cast iron) originating in India following an
    expiry review pursuant to Article 11(2) of Regulation (EU) 2016/1036 of the European
    Parliament and of the Council
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/926 de la Commission du 15 juin 2022
    instituant un droit antidumping définitif sur les importations de tubes et de
    tuyaux en fonte ductile (également dénommée «fonte à graphite sphéroïdal»)
    originaires de l’Inde à l’issue d’un réexamen au titre de l’expiration
    des mesures effectué en vertu de l’article 11, paragraphe 2, du règlement
    (UE) 2016/1036 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
