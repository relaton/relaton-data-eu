    un Padomes Regulas (ES) 2016/1036 11. panta 2. punktu, nosaka galīgo antidempinga
    maksājumu Indijas izcelsmes plastiskā čuguna (saukta arī par čugunu ar lodveida
    grafītu) cauruļu un caurulīšu importam
  type: main
- language: lt
  script: Latn
