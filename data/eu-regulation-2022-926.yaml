    öntöttvasból) készült csövek behozatalára vonatkozó végleges dömpingellenes
    vámnak az (EU) 2016/1036 európai parlamenti és tanácsi rendelet 11. cikkének
    (2) bekezdése szerinti hatályvesztési felülvizsgálatot követő kivetéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/926 della Commissione del 15 giugno
    2022 che istituisce un dazio antidumping definitivo sulle importazioni di tubi
