    paragrafo 2, del regolamento (UE) 2016/1036 del Parlamento europeo e del Consiglio
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/926 (2022. gada 15. jūnijs),
