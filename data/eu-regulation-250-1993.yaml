  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 250/93 della Commissione, del 4 febbraio 1993, recante
    deroga, per la campagna 1993/94, al regolamento (CEE) n. 1558/91 che stabilisce
    le modalità di applicazione del regime di aiuti alla produzione per taluni prodotti
    trasformati a base di ortofrutticoli, per la data limite di conclusione dei contratti
    preliminari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 250/93 van de Commissie van 4 februari 1993 houdende
    afwijking, voor het verkoopseizoen 1993/1994, van Verordening (EEG) nr. 1558/91
    tot vaststelling van uitvoeringsbepalingen inzake de produktiesteunregeling voor
    op basis van groenten en fruit verwerkte produkten, wat betreft de uiterste datum
    van de voorcontracten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 250/93 da Comissão, de 4 de Fevereiro de 1993, que
