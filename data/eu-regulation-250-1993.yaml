    modalidades de aplicação do regime de ajuda à produção para os produtos transformados
    à base de frutas e produtos hortícolas, no que respeita à data limite de conclusão
    dos contratos preliminares
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 250/93 de la Comisión, de 4 de febrero de 1993, que
