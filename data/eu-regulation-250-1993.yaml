title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 250/93 of 4 February 1993 derogating, for
    the 1993/94 marketing year, from Regulation (EEC) No 1558/91 laying down detailed
    rules for the application of the system of production aid for products processed
    from fruit and vegetables as regards the time limit for the conclusion of preliminary
    contracts
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 250/93 de la Commission, du 4 février 1993, dérogeant,
    pour la campagne 1993/1994 au règlement (CEE) n° 1558/91 portant modalités
    d' application du régime d' aide à la production pour les produits transformés
    à base de fruits et légumes, en ce qui concerne la date limite de conclusion
    des contrats préliminaires
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 250/93 der Kommission vom 4. Februar 1993 mit Abweichung
