title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 633/85 of 12 March 1985 re-establishing
    the levying of customs duties on umbrellas and sunshades, falling within heading
    No 66.01, originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 633/85 de la Commission du 12 mars 1985 portant rétablissement
    de la perception des droits de douane applicables aux parapluies, parasols et
    ombrelles, de la position 66.01 du tarif douanier commun, originaires de Singapour,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) no
    3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 633/85 der Kommission vom 12. März 1985 zur Wiedereinführung
    der Erhebung der Zölle für Regenschirme und Sonnenschirme der Tarifnummer 66.01
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 633/85 af 12. marts 1985 om genindførelse
