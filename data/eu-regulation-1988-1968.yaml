title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 1988/68 de la Commission, du 9 décembre 1968, diminuant
    le montant compensatoire à l'importation des huiles de tournesol, originaires
    ou en provenance de Bulgarie, de Hongrie, de Roumanie, de l'U.R.S.S. et de Yougoslavie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1988/68 der Kommission vom 9. Dezember 1968 zur Herabsetzung
    des Betrages der Ausgleichsabgabe, die bei der Einfuhr von Sonnenblumenöl aus
    Bulgarien, Jugoslawien, Rumänien, Ungarn und der UdSSR zu erheben ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1988/68 della Commissione, del 9 dicembre 1968, che
    diminuisce l'ammontare di compensazione all'importazione di oli di semi di girasole
    originari o in provenienza dalla Bulgaria, dalla Jugoslavia, dalla Romania, dall'Ungheria
    e dall'URSS
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1988/68 van de Commissie van 9 december 1968 houdende
    vermindering van het compenserende bedrag bij de invoer van zonnebloemolie van
    oorsprong of van herkomst uit Bulgarije, Hongarije, Joegoslavië, Roemenië en
    de U.S.S.R.
  type: main
