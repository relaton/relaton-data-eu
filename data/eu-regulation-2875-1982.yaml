title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2875/82 of 26 October 1982 determining the
    amounts of the variable components and additional duties applicable from 1 November
    1982 to 31 January 1983 on the importation into the Community of goods covered
    by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2875/82 de la Commission, du 26 octobre 1982, déterminant
    les montants des éléments mobiles ainsi que les droits additionnels applicables
    pendant la période du 1er novembre 1982 au 31 janvier 1983 inclus à l'importation
    dans la Communauté des marchandises relevant du règlement (CEE) n 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2875/82 der Kommission vom 26. Oktober 1982 zur Festsetzung
    der Höhe der vom 1. November 1982 bis einschließlich 31. Januar 1983 bei der
    Einfuhr der unter die Verordnung (EWG) Nr. 3033/80 fallenden Waren in die Gemeinschaft
    anzuwendenden beweglichen Teilbeträge und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2875/82 af 26. oktober 1982 om fastsættelse
    af størrelsen af de variable elementer og tillægstold for indførsel i Fællesskabet
    af varer henhørende under forordning (EØF) nr. 3033/80 for perioden fra den
    1. november 1982 til den 31. januar 1983
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2875/82 της Επιτροπής
    της 26ης Οκτωβρίου 1982 περί καθορισμού των ποσών
    των μεταβλητών στοιχείων και των πρόσθετων
    δασμών πού εφαρμόζονται κατά την περίοδο από
    1ης Νοεμβρίου 1982 μέχρι και 31ης Ιανουαρίου 1983
    κατά την εισαγωγή στην Κοινότητα εμπορευμάτων
    πού υπάγονται στον κανονισμό (ΕΟΚ) αριθ. 3033/80
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2875/82 della Commissione, del 26 ottobre 1982, che
