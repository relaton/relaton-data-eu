title:
- language: en
  script: Latn
  content: '79/755/EEC: Commission Decision of 6 August 1979 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands not
    to apply Community treatment to men''s and boys''woven jackets and blazers, of
    wool, of cotton or of man-made textile fibres, falling within subheading 61.01
    ex B of the Common Customs Tariff (NIMEXE codes 61.01-34, 36, 37) (category 17),
    originating in Romania and in free circulation in the other Member States (Only
    the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/755/CEE: Décision de la Commission, du 6 août 1979, autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à exclure du traitement communautaire les vestes et vestons tissés pour hommes
    et garçonnets, de laine, de coton ou de fibres textiles synthétiques ou artificielles
    de la sous-position 61.01 ex B du tarif douanier commun (codes Nimexe : 61.01-34,
    36, 37) (catégorie 17) originaires de Roumanie et mis en libre pratique dans
    les autres États membres (Les textes en langues française et néerlandaise sont
    les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '79/755/EWG: Entscheidung der Kommission vom 6. August 1979, mit der das
    Königreich Belgien, das Großherzogtum Luxemburg und das Königreich der Niederlande
    ermächtigt werden, aus Rumänien stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Sakkos und Jacken aus Geweben, für Männer und
    Knaben, aus Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen,
    der Tarifstelle 61.01 ex B des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern 61.01-34
    ; 36 ; 37) (Kategorie 17) von der Gemeinschaftsbehandlung auszuschließen (Nur
    der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/755/EØF: Kommissionens beslutning af 6. august 1979 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til fra fællesskabsbehandling at undtage jakker og blazere (undtagen arbejdsjakker,
    hjemmejakker og strandjakker), vævede, til mænd og drenge, af uld, bomuld eller
    kunstige og syntetiske fibre, som henhører under pos. 61.01 ex B i den fælles
    toldtarif (NIMEXE-nummer 61.01- 34, 36, 37; kategori 17), har oprindelse i Rumænien
    og frit kan omsættes i de øvrige medlemsstater (Kun den franske og nederlandske
    udgave er autentiske)'
  type: main
- language: it
  script: Latn
  content: '79/755/CEE: Decisione della Commissione, del 6 agosto 1979, che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    ad escludere dal trattamento comunitario le giacche e giacchette per uomo e per
    ragazzo, di lana, di cotone o di fibre tessili sintetiche o artificiali, della
    sottovoce 61.01 ex B della tariffa doganale comune (codici Nimexe: 61.01-34, 36,
    37) (categoria 17), originarie della Romania e messe in libera pratica negli altri
    Stati membri (I testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '79/755/EEG: Beschikking van de Commissie van 6 augustus 1979 waarbij het
    Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der Nederlanden
    worden gemachtigd colbertjassen, blazers, geweven, van wol, van katoen of van
    synthetische of van kunstmatige textielvezels, voor heren en jongens, van post
    61.01 ex B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-34, 36, 37)
    (categorie 17), van oorsprong uit Roemenië en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts
    de teksten in de Franse en de Nederlandse taal zijn authentiek)'
