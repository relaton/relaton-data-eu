id: EUDecision2023994
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2023/994 of 22 May 2023 on the consequences of
    Denmark informing the other Member States that it no longer wishes to avail itself
    of Article 5 of Protocol No 22 on the position of Denmark, and amending Decision
    (CFSP) 2021/509 establishing a European Peace Facility and Decision 2014/401/CFSP
    on the European Union Satellite Centre
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2023/994 du Conseil du 22 mai 2023 sur les conséquences
    de l’information communiquée aux autres États membres par le Danemark, selon
    laquelle il ne souhaite plus se prévaloir de l’article 5 du protocole no 22
    sur la position du Danemark et modifiant la décision (PESC) 2021/509 établissant
    une facilité européenne pour la paix et la décision 2014/401/PESC relative
    au Centre satellitaire de l’Union européenne
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2023/994 des Rates vom 22. Mai 2023 über die Folgen der
    Mitteilung Dänemarks an die übrigen Mitgliedstaaten, dass es keinen Gebrauch
    mehr von Artikel 5 des Protokolls Nr. 22 über die Position Dänemarks machen
    will, zur Änderung des Beschlusses (GASP) 2021/509 zur Einrichtung einer Europäischen
    Friedensfazilität und des Beschlusses 2014/401/GASP über das Satellitenzentrum
    der Europäischen Union
  type: main
- language: bg
  script: Cyrl
  content: Решение (ОВППС) 2023/994 на Съвета от 22 май 2023
    година за последиците от информацията, изпратена
    от Дания до останалите държави членки, че не
    желае повече да се възползва от член 5 от Протокол
    № 22 относно позицията на Дания, и за изменение
    на Решение (ОВППС) 2021/509 за създаване на Европейски
    механизъм за подкрепа на мира и на Решение
    № 2014/401/ОВППС относно Сателитния център на
    Европейския съюз
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (SZBP) 2023/994 ze dne 22. května 2023 o důsledcích
    skutečnosti, že Dánsko informovalo ostatní členské státy, že si již nepřeje
    využívat článek 5 Protokolu č. 22 o postavení Dánska, a o změně rozhodnutí
    Rady (SZBP) 2021/509 o zřízení Evropského mírového nástroje a rozhodnutí
    Rady 2014/401/SZBP o satelitním středisku Evropské unie
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (FUSP) 2023/994 af 22. maj 2023 om konsekvenserne af,
    at Danmark har underrettet de øvrige medlemsstater om at landet ikke længere
    ønsker at benytte sig af artikel 5 i protokol nr. 22 om Danmarks stilling, og
    om ændring af afgørelse (FUSP) 2021/509 om oprettelse af en europæisk fredsfacilitet
    og afgørelse 2014/401/FUSP om EU-satellitcentret
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΚΕΠΠΑ) 2023/994 του Συμβουλίου της
    22ας Μαΐου 2023 σχετικά με τις συνέπειες της ενημέρωσης
    των άλλων κρατών μελών από τη Δανία ότι δεν
    επιθυμεί πλέον να υπόκειται στο άρθρο 5 του
    πρωτοκόλλου αριθ. 22 σχετικά με τη θέση της Δανίας
    και για την τροποποίηση της απόφασης (ΚΕΠΠΑ)
    2021/509 για τη θέσπιση Ευρωπαϊκού Μηχανισμού
    για την Ειρήνη και της απόφασης 2014/401/ΚΕΠΠΑ
    σχετικά με το Δορυφορικό Κέντρο της Ευρωπαϊκής
    Ένωσης
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (ÜVJP) 2023/994, 22. mai 2023, mis käsitleb tagajärgi,
    mis kaasnevad teistele liikmesriikidele tehtud Taani avaldusega selle kohta, et
    ta ei soovi enam kasutada Taani seisukohta käsitleva protokolli nr 22 artiklit
    5, ning millega muudetakse otsust (ÜVJP) 2021/509, millega luuakse Euroopa rahutagamisrahastu,
    ja otsust 2014/401/ÜVJP, mis käsitleb Euroopa Liidu Satelliidikeskust
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (YUTP) 2023/994, annettu 22 päivänä toukokuuta 2023,
    sen seurauksista, että Tanska on ilmoittanut muille jäsenvaltioille, ettei se
    enää halua käyttää Tanskan asemasta tehdyssä pöytäkirjassa N:o 22 olevaa
    5 artiklaa, sekä Euroopan rauhanrahaston perustamisesta annetun päätöksen
    (YUTP) 2021/509 ja Euroopan unionin satelliittikeskuksesta annetun päätöksen
    2014/401/YUTP muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Cinneadh (CBES) 2023/994 ón gComhairle an 22 Bealtaine 2023 maidir leis
    na hiarmhairtí a ghabhann leis an Danmhairg a bheith tar éis a chur in iúl
    do na Ballstáit eile nach mian léi leas a bhaint a thuilleadh as Airteagal 5
    de Phrótacal Uimh. 22 maidir le seasamh na Danmhairge, agus lena leasaítear
    Cinneadh (CBES) 2021/509 lena mbunaítear Saoráid Eorpach Síochána agus Cinneadh
    2014/401/CBES maidir le Lárionad Satailítí an Aontais Eorpaigh
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (ZVSP) 2023/994 od 22. svibnja 2023. o posljedicama obavijesti
    Danske ostalim državama članicama da se više ne želi koristiti člankom 5.
    Protokola br. 22 o stajalištu Danske i o izmjeni Odluke (ZVSP) 2021/509 o uspostavi
    Europskog instrumenta mirovne pomoći i Odluke 2014/401/ZVSP o Satelitskom centru
    Europske unije
  type: main
- language: hu
  script: Latn
  content: A Tanács (KKBP) 2023/994 határozata (2023. május 22.) egyrészt a többi
    tagállam Dánia általi, azzal kapcsolatos tájékoztatásának következményeiről,
    hogy Dánia a továbbiakban nem kíván élni a Dánia helyzetéről szóló 22.
    jegyzőkönyv 5. cikkében foglaltakkal, másrészt az Európai Békekeret létrehozásáról
    szóló (KKBP) 2021/509 határozat, továbbá az Európai Unió Műholdközpontjáról
    szóló 2014/401/KKBP határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione (PESC) 2023/994 del Consiglio del 22 maggio 2023 sulle conseguenze
    dell’informazione fornita dalla Danimarca agli altri Stati membri secondo cui
    non intende più avvalersi dell’articolo 5 del protocollo n. 22 sulla posizione
    della Danimarca, e di modifica della decisione (PESC) 2021/509, che istituisce
    uno strumento europeo per la pace, e della decisione 2014/401/PESC, sul centro
    satellitare dell’Unione europea
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (KĀDP) 2023/994 (2023. gada 22. maijs) par sekām, ko
    rada tas, ka Dānija informē pārējās dalībvalstis par to, ka tā vairs nevēlas
    izmantot 5. pantu Protokolā Nr. 22 par Dānijas nostāju, un ar kuru groza Lēmumu
    (KĀDP) 2021/509, ar ko izveido Eiropas Miera mehānismu, un Lēmumu 2014/401/KĀDP
    par Eiropas Savienības Satelītcentru
  type: main
- language: lt
  script: Latn
  content: Tarybos sprendimas (BUSP) 2023/994 2023 m. gegužės 22 d. dėl pasekmių,
    susijusių su Danijos pranešimu kitoms valstybėms narėms, kad ji nebepageidauja
    taikyti Protokolo Nr. 22 dėl Danijos pozicijos 5 straipsnio, ir kuriuo iš dalies
    keičiami Sprendimas (BUSP) 2021/509, kuriuo nustatoma Europos taikos priemonė,
    ir Sprendimas 2014/401/BUSP dėl Europos Sąjungos palydovų centro
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (PESK) 2023/994 tat-22 ta’ Mejju 2023 dwar il-konsegwenzi
    tal-fatt li d-Danimarka infurmat lill-Istati Membri l-oħra li ma tixtieqx tibqa’
    tagħmel użu mill-Artikolu 5 tal-Protokoll Nru 22 dwar il-pożizzjoni tad-Danimarka,
    u li temenda d-Deċiżjoni (PESK) 2021/509 li tistabbilixxi Faċilità Ewropea
    għall-Paċi u d-Deċiżjoni 2014/401/PESK dwar iċ-Ċentru Satellitari tal-Unjoni
    Ewropea
  type: main
- language: nl
  script: Latn
  content: Besluit (GBVB) 2023/994 van de Raad van 22 mei 2023 betreffende de gevolgen
    van de mededeling van Denemarken aan de andere lidstaten dat het niet langer een
    beroep wenst te doen op artikel 5 van Protocol nr. 22 betreffende de positie van
    Denemarken, en tot wijziging van Besluit (GBVB) 2021/509 tot oprichting van een
    Europese Vredesfaciliteit en van Besluit 2014/401/GBVB betreffende het satellietcentrum
    van de Europese Unie
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (WPZiB) 2023/994 z dnia 22 maja 2023 r. dotycząca skutków
    powiadomienia pozostałych państw członkowskich przez Danię, że nie zamierza
    już korzystać z postanowień art. 5 Protokołu nr 22 w sprawie stanowiska Danii
    oraz zmieniająca decyzję (WPZiB) 2021/509 w sprawie ustanowienia Europejskiego
    Instrumentu na rzecz Pokoju oraz decyzję 2014/401/WPZiB w sprawie Centrum Satelitarnego
    Unii Europejskiej
  type: main
- language: pt
  script: Latn
  content: Decisão (PESC) 2023/994 do Conselho de 22 de maio de 2023 sobre as consequências
    de a Dinamarca informar os demais Estados-Membros de que não pretende continuar
    a invocar o artigo 5.o do Protocolo n.o 22 relativo à posição da Dinamarca
    e que altera a Decisão (PESC) 2021/509 que cria um Mecanismo Europeu de Apoio
    à Paz e a Decisão 2014/401/PESC relativa ao Centro de Satélites da União Europeia
  type: main
- language: ro
  script: Latn
  content: Decizia (PESC) 2023/994 a Consiliului din 22 mai 2023 privind consecințele
    informării de către Danemarca a celorlalte state membre că nu mai dorește
    să se prevaleze de articolul 5 din Protocolul nr. 22 privind poziția Danemarcei
    și de modificare a Deciziei (PESC) 2021/509 de instituire a Instrumentului european
    pentru pace și a Deciziei 2014/401/PESC privind Centrul Satelitar al Uniunii
    Europene
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (SZBP) 2023/994 z 22. mája 2023 o dôsledkoch oznámenia
    Dánska ostatným členským štátom, že si už neželá využívať článok
    5 Protokolu č. 22 o postavení Dánska, a o zmene rozhodnutia (SZBP) 2021/509,
    ktorým sa zriaďuje Európsky mierový nástroj a rozhodnutia 2014/401/SZBP o
    Satelitnom stredisku Európskej únie
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (SZVP) 2023/994 z dne 22. maja 2023 o posledicah obvestitve
    drugih držav članic s strani Danske, da ne želi več uporabljati člena 5 Protokola
    št. 22 o stališču Danske, in spremembi Sklepa (SZVP) 2021/509 o vzpostavitvi
    Evropskega mirovnega instrumenta ter Sklepa 2014/401/SZVP o Satelitskem centru
    Evropske unije
  type: main
- language: es
  script: Latn
  content: Decisión (PESC) 2023/994 del Consejo de 22 de mayo de 2023 sobre las consecuencias
    de que Dinamarca haya informado a los demás Estados miembros de que ya no desea
    acogerse al artículo 5 del Protocolo n.o 22 sobre la posición de Dinamarca y
    por la que se modifican la Decisión (PESC) 2021/509 por la que se crea un Fondo
    Europeo de Apoyo a la Paz y la Decisión 2014/401/PESC relativa al Centro de Satélites
    de la Unión Europea
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (Gusp) 2023/994 av den 22 maj 2023 om konsekvenserna av
    att Danmark meddelat de övriga medlemsstaterna att Danmark inte längre vill
    utnyttja artikel 5 i protokoll nr 22 om Danmarks ställning samt om ändring av
    beslut (Gusp) 2021/509 om inrättande av en europeisk fredsfacilitet och av beslut
