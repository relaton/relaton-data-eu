title:
- language: en
  script: Latn
  content: '79/722/EEC: Commission Decision of 30 July 1979 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of cotton, other than
    gauze, terry fabrics, narrow woven fabrics, pile fabrics, chenille fabrics, tulle
    and other net fabrics, falling within heading No 55.09 of the Common Customs Tariff
    (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29,
    31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65,
    66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93,
    97) (category 2), originating in Thailand and in free circulation in the other
    Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/722/CEE: Décision de la Commission, du 30 juillet 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tissus de coton autres
    que tissus à point de gaze, bouclés, du genre éponge, rubanerie, velours, peluches,
    tissus bouclés, tissus de chenilles, tulles et tissus à mailles nouées, de
    la position 55.09 du tarif douanier commun (codes Nimexe : 55.09-01, 02, 03, 04,
    05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51,
    52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74,
    76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97) (catégorie 2), originaires de
    la Thaïlande et mis en libre pratique dans les autres Etats membres (Le texte
    en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/722/EWG: Entscheidung der Kommission vom 30. Juli 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus Thailand stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle, andere els
    Drehergewebe, Schlingengewebe (Frottiergewebe), Bänder, Samt, Plüsch, Schlingengewebe,
    Chenillegewebe, Tülle und geknüpfte Netzstoffe, der Tarifnummer 55.09 des Gemeinsamen
    Zolltarifs (NIMEXE- Kennziffern 55.09-01 ; 02 ; 03 ; 04 ; 05 ; 11 ; 12 ; 13 ;
    14 ; 15 ; 16 ; 17 ; 19 ; 21 ; 29 ; 31 ; 33 ; 35 ; 37 ; 38 ; 39 ; 41 ; 49 ; 51
    ; 52 ; 53 ; 54 ; 55 ; 56 ; 57 ; 59 ; 61 ; 63 ; 64 ; 65 ; 66 ; 67 ; 68 ; 69 ; 70
    ; 71 ; 72 ; 73 ; 74 ; 76 ; 77 ; 78 ; 81 ; 82 ; 83 ; 84 ; 86 ; 87 ; 92 ; 93 ; 97)
    (Kategorie 2) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/722/EØF: Kommissionens beslutning af 30. juli 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld, bortset fra drejervævet stof af bomuld, frotterstof, vævede bånd,
    fløjls-, plys- og chenillestoffer, tyl og knyttede netstoffer, som henhører
    under pos. 55.09 i den fælles toldtarif (NIMEXE-nummer 55.09-01, 02, 03, 04,
    05, 11, 12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51,
    52, 53, 54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74,
    76, 77, 78, 81, 82, 83, 84, 86, 87, 92, 93, 97 ; kategori 2), har oprindelse i
    Thailand og frit kan omsættes i de øvrige medlemsstater (Kun den engelske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/722/CEE: Decisione della Commissione, del 30 luglio 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i tessuti di cotone, diversi
    da quelli a punto di garza, ricci del tipo spugna, passamaneria, velluti, felpe,
    tessuti di ciniglia, rulli e tessuti a maglie annodate, della voce 55.09 della
    tariffa doganale comune (codici Nimexe: 55.09-01, 02, 03, 04, 05, 11, 12, 13,
    14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54, 55,
    56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78, 81,
    82, 83, 84, 86, 87, 92, 93, 97), categoria 2, originari della Tailandia e messi
    in libera pratica negli altri Stati membri (Il testo in lingua inglese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/722/EEG: Beschikking van de Commissie van 30 juli 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd weefsels van katoen, andere dan weefsels
    met gaasbinding, bad- of frotteerstof (lussendoek), lint, fluweel, pluche, lussenweefsel,
