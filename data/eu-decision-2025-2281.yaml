    Izvedbenega sklepa (EU) 2022/2470 glede tehničnih specifikacij za kakovost, ločljivost
    in obdelavo podob obraza, potrebnih za tehnični razvoj in izvajanje centraliziranega
    sistema za določitev držav članic, ki imajo informacije o obsodbah državljanov
    tretjih držav in oseb brez državljanstva (sistem ECRIS-TCN)
