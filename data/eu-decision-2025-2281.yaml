    respeito às especificações técnicas relativas à qualidade, à resolução
    e ao tratamento de imagens faciais, necessárias ao desenvolvimento técnico e
    à aplicação do sistema centralizado para a determinação dos Estados-Membros
    que possuem informações sobre condenações de nacionais de países terceiros
