    pre kvalitu, rozlíšenie a spracúvanie vyobrazení tváre, potrebné na technický
    vývoj a vykonávanie centralizovaného systému na identifikáciu členských
    štátov, ktoré majú informácie o odsúdeniach štátnych príslušníkov tretích
    krajín a osôb bez štátnej príslušnosti (ECRIS-TCN)
  type: main
