    y apátridas (ECRIS-TCN)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2025/2281 av den 13 november 2025
    om ändring av genomförandebeslut (EU) 2022/2470 vad gäller de tekniska specifikationer
    för kvalitet, bildupplösning och behandling av ansiktsbilder som är nödvändiga
    för den tekniska utvecklingen och implementeringen av det centraliserade systemet
    för identifiering av medlemsstater som innehar uppgifter om fällande domar mot
