title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/2281 of 13 November 2025 amending
    Implementing Decision (EU) 2022/2470 as regards technical specifications for the
    quality, resolution and processing of facial images, necessary for the technical
    development and implementation of the centralised system for the identification
    of Member States holding conviction information on third-country nationals and
    stateless persons (ECRIS-TCN)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/2281 de la Commission du 13 novembre
    2025 modifiant la décision d’exécution (UE) 2022/2470 en ce qui concerne les
    spécifications techniques portant sur la qualité, la résolution et le traitement
    des images faciales nécessaires au développement technique et à la mise en
    œuvre du système centralisé permettant d’identifier les États membres détenant
    des informations relatives aux condamnations concernant des ressortissants de
    pays tiers et des apatrides (ECRISTCN)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2025/2281 der Kommission vom 13. November
    2025 zur Änderung des Durchführungsbeschlusses (EU) 2022/2470 in Bezug auf die
    technischen Spezifikationen für die Qualität, Auflösung und Verarbeitung von
    Gesichtsbildern, die für die technische Entwicklung und Implementierung des zentralisierten
    Systems für die Ermittlung der Mitgliedstaaten, in denen Informationen zu Verurteilungen
    von Drittstaatsangehörigen und Staatenlosen vorliegen (ECRIS-TCN), erforderlich
    sind
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2025/2281 на Комисията
    от 13 ноември 2025 година за изменение на Решение
    за изпълнение (ЕС) 2022/2470 по отношение на техническите
    спецификации за качеството, разделителната
    способност и обработването на портретни снимки,
    необходими за техническото разработване и
    прилагане на централизираната система за установяване
    на държави членки, разполагащи с информация
    за присъди срещу граждани на трети държави
    и лица без гражданство (ECRIS-TCN)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2025/2281 ze dne 13. listopadu 2025,
    kterým se mění prováděcí rozhodnutí (EU) 2022/2470, pokud jde o technické
    specifikace pro kvalitu, rozlišení a zpracování zobrazení obličeje nezbytné
    pro technický vývoj a zavedení centralizovaného systému pro identifikaci
    členských států, jež mají informace o odsouzeních státních příslušníků
    třetích zemí a osob bez státní příslušnosti (ECRIS-TCN)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2025/2281 af 13. november
