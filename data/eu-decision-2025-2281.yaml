    le sonraíochtaí teicniúla maidir le cáilíocht, taifeach agus próiseáil
    íomhánna den aghaidh, sonraíochtaí a bhfuil gá leo chun an córas láraithe
    leis na Ballstáit a shainaithint ag a bhfuil faisnéis faoi chiontuithe náisiúnach
