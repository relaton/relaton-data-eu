    le specifiche tecniche per la qualità, la risoluzione e il trattamento delle
    immagini del volto, necessarie per lo sviluppo tecnico e l’attuazione del sistema
    centralizzato per individuare gli Stati membri in possesso di informazioni sulle
    condanne pronunciate a carico di cittadini di paesi terzi e apolidi (ECRIS-TCN)
  type: main
- language: lv
  script: Latn
