    specificaties voor de kwaliteit, resolutie en verwerking van gezichtsopnamen die
    nodig zijn voor de technische ontwikkeling en implementatie van het gecentraliseerd
    systeem voor de vaststelling welke lidstaten over informatie beschikken inzake
