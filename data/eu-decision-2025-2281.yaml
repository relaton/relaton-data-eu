    w zakresie jakości, rozdzielczości i przetwarzania wizerunków twarzy niezbędnych
    do rozwoju technicznego i wdrożenia scentralizowanego systemu służącego do
    ustalania państw członkowskich posiadających informacje o wyrokach skazujących
    wydanych wobec obywateli państw trzecich i bezpaństwowców (ECRIS-TCN)
  type: main
