    és a hontalan személyekkel szemben hozott ítéletekre vonatkozó információval
    rendelkező tagállamok azonosítására szolgáló központosított rendszer
    (ECRIS-TCN) technikai fejlesztéséhez és végrehajtásához szükséges, az
