    tehniskajām specifikācijām, kas vajadzīgas, lai tehniski izstrādātu un īstenotu
    centralizēto sistēmu tādu dalībvalstu identificēšanai, kurām ir informācija
    par notiesājošiem spriedumiem par trešo valstu valstspiederīgajiem un bezvalstniekiem
    (ECRIS-TCN), groza Īstenošanas lēmumu (ES) 2022/2470
  type: main
