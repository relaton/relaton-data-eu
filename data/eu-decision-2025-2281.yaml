    privește specificațiile tehnice privind calitatea, rezoluția și prelucrarea
    imaginilor faciale, necesare pentru dezvoltarea și implementarea tehnică a sistemului
    centralizat pentru determinarea statelor membre care dețin informații privind
    condamnările resortisanților țărilor terțe și ale apatrizilor (ECRIS-TCN)
  type: main
- language: sk
  script: Latn
