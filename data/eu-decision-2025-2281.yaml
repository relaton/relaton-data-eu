    specifikacijų, būtinų centralizuotai valstybių narių, turinčių informacijos
    apie priimtus trečiųjų šalių piliečių ir asmenų be pilietybės apkaltinamuosius
    nuosprendžius, nustatymo sistemai (ECRIS-TCN) techniškai plėtoti ir įgyvendinti,
