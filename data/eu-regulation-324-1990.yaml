    en tot wijn verwerken, in de vrije zones op het geografische grondgebied van de
    Gemeenschap, van produkten uit de wijnbouwsector, van oorsprong uit derde landen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 324/90 DA COMISSAO de 7 de Fevereiro de 1990 que revoga
