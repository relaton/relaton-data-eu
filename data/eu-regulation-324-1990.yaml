    της Κοινότητας για τα προϊόντα του οινικού
    τομέα που κατάγονται από τρίτες χώρες
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 324/90 DELLA COMMISSIONE del 7 febbraio 1990 recante
    abrogazione del regolamento (CEE) n. 643/77 che stabilisce modalità di applicazione
    per il taglio e la vinificazione, nelle zone franche del territorio geografico
    della Comunità, di prodotti del settore vinicolo originari dei paesi terzi
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 324/90 VAN DE COMMISSIE van 7 februari 1990 tot intrekking
