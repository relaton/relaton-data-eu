  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2020/1303 van de Commissie van 14 juli 2020
    tot aanvulling van Verordening (EU) nr. 648/2012 van het Europees Parlement en
    de Raad wat betreft de door de ESMA in aanmerking te nemen criteria om te beslissen
