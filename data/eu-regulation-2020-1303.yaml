  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2020/1303 z dnia 14 lipca 2020
    r. uzupełniające rozporządzenie Parlamentu Europejskiego i Rady (UE) nr 648/2012
    w odniesieniu do kryteriów, które ESMA powinien brać pod uwagę w celu ustalenia,
    czy kontrahent centralny z siedzibą w państwie trzecim ma lub może mieć systemowe
    znaczenie dla stabilności finansowej Unii lub co najmniej jednego z jej państw
    członkowskich
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2020/1303 da Comissão de 14 de julho de 2020
    que completa o Regulamento (UE) n.o 648/2012 do Parlamento Europeu e do Conselho
    no que diz respeito aos critérios que a ESMA deve ter em conta para determinar
    se uma contraparte central estabelecida num país terceiro é sistemicamente importante
    ou suscetível de se tornar sistemicamente importante para a estabilidade financeira
    da União ou de um ou mais Estados-Membros
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2020/1303 al Comisiei din 14 iulie 2020 de completare
    a Regulamentului (UE) nr. 648/2012 al Parlamentului European și al Consiliului
    în ceea ce privește criteriile pe care ESMA ar trebui să le ia în considerare
    pentru a stabili dacă o contraparte centrală stabilită într-o țară terță
    este importantă din punct de vedere sistemic sau este probabil să devină importantă
    din punct de vedere sistemic pentru stabilitatea financiară a Uniunii sau a unuia
    ori mai multor state membre ale acesteia
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2020/1303 zo 14. júla 2020, ktorým
    sa dopĺňa nariadenie Európskeho parlamentu a Rady (EÚ) č. 648/2012, pokiaľ
    ide o kritériá, ktoré by mal orgán ESMA zohľadniť pri určení toho, či
    je centrálna protistrana usadená v tretej krajine systémovo dôležitá alebo
    sa pravdepodobne stane systémovo dôležitou pre finančnú stabilitu Únie alebo
    jedného či viacerých jej členských štátov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2020/1303 z dne 14. julija 2020 o dopolnitvi
