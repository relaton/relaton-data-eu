title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2020/1303 of 14 July 2020 supplementing
    Regulation (EU) No 648/2012 of the European Parliament and of the Council with
    regard to the criteria that ESMA should take into account to determine whether
    a central counterparty established in a third country is systemically important
    or likely to become systemically important for the financial stability of the
    Union or of one or more of its Member States
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2020/1303 de la Commission du 14 juillet 2020
    complétant le règlement (UE) no 648/2012 du Parlement européen et du Conseil
    en ce qui concerne les critères dont l’AEMF devrait tenir compte pour déterminer
    si une contrepartie centrale établie dans un pays tiers présente une importance
    systémique ou est susceptible de présenter à l’avenir une importance systémique
    pour la stabilité financière de l’Union ou d’un ou de plusieurs de ses États
    membres
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2020/1303 der Kommission vom 14. Juli 2020 zur
    Ergänzung der Verordnung (EU) Nr. 648/2012 des Europäischen Parlaments und des
    Rates durch die Kriterien, die die ESMA bei der Feststellung, ob eine in einem
    Drittstaat niedergelassene zentrale Gegenpartei für die Finanzstabilität der
    Union oder eines oder mehrerer ihrer Mitgliedstaaten Systemrelevanz hat oder wahrscheinlich
    erlangen wird, berücksichtigen sollte
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2020/1303 на Комисията
