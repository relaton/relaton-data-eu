    bi jih moral organ ESMA upoštevati pri ugotavljanju, ali je centralna nasprotna
    stranka s sedežem v tretji državi sistemsko pomembna za finančno stabilnost
    Unije ali ene ali več njenih držav članic oziroma bo to verjetno postala
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2020/1303 de la Comisión de 14 de julio de 2020
    por el que se completa el Reglamento (UE) n.o 648/2012 del Parlamento Europeo
    y del Consejo en relación con los criterios que la AEVM debe tener en cuenta
    para determinar si una entidad de contrapartida central establecida en un tercer
    país tiene o puede adquirir importancia sistémica para la estabilidad financiera
    de la Unión o de uno o varios de sus Estados miembros
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2020/1303 av den 14 juli 2020
    om komplettering av Europaparlamentets och rådets förordning (EU) nr 648/2012
    vad gäller de kriterier som Esma bör beakta vid bedömningen av huruvida en
    central motpart etablerad i ett tredjeland är systemviktig eller sannolikt kommer
    att bli systemviktig för den finansiella stabiliteten i unionen eller i en eller
    flera av dess medlemsstater
