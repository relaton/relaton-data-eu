title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3361/91 of 19 November 1991 re-establishing
    the levying of customs duties on products falling within CN code 2903 51 00, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 3361/91 DE LA COMMISSION du 19 novembre 1991 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code NC 2903 51 00 originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) no 3831/90 du Conseil #'
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 3361/91 DER KOMMISSION vom 19. November 1991 zur
    Wiedereinführung der Erhebung der Zölle für die Waren des KN-Codes 2903 51
    00 mit Ursprung in China, dem die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3361/91 af 19. november 1991 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 2903 51 00 og med oprindelse
    i Kina, som er præferenceberettiget i henhold til Rådets forordning (EØF) nr.
    3831/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός ( ΕΟΚ ) αριθ. 3361/91 της Επιτροπής
    της 19ης Νοεμβρίου 1991 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 2903 51 00, καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό ( ΕΟΚ ) αριθ.
    3831/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 3361/91 DELLA COMMISSIONE del 19 novembre 1991 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 2903 51 00 originari della Cina beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3361/91 VAN DE COMMISSIE van 19 november 1991 houdende
