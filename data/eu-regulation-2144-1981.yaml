title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2144/81 of 27 July 1981 extending the period
    of validity of Council Regulation (EEC) No 1315/81 laying down certain interim
    measures for the conservation and management of fishery resources applicable to
    vessels flying the flag of Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2144/81 du Conseil, du 27 juillet 1981, prorogeant
    la durée de validité du règlement (CEE) n° 1315/81 fixant certaines mesures
    intérimaires de conservation et de gestion des ressources de pêche applicables
    aux navires battant pavillon de la Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2144/81 des Rates vom 27. Juli 1981 zur Verlängerung
    der Geltungsdauer der Verordnung (EWG) Nr. 1315/81 zur Festlegung von Interimsmaßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände gegenüber Schiffen unter
    der Flagge Schwedens
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2144/81 af 27. juli 1981 om forlængelse
    af gyldighedsperioden for forordning (EØF) nr. 1315/81 om fastsættelse af visse
    foranstaltninger til bevarelse og forvaltning af fiskeressourcerne, som skal finde
    anvendelse på fartøjer, der fører svensk flag
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2144/81 τού Συμβουλίου
    τής 27ης Ιουλίου 1981 περί παρατάσεως τής διάρκειας
    ισχύος τού κανονισμού (ΕΟΚ) αριθ. 1315/81 περί καθορισμού
    ορισμένων ενδιάμεσων μέτρων διατηρήσεως καί
    διαχειρίσεως τών αλιευτικών πόρων πού εφαρμόζονται
    σέ σκάφη υπό σουηδική σημαία
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2144/81 del Consiglio, del 27 luglio 1981, che proroga
    la durata di validità del regolamento (CEE) n. 1315/81 che stabilisce talune
    misure provvisorie di conservazione e di gestione delle risorse ittiche, da applicare
    ai pescherecci battenti bandiera della Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2144/81 van de Raad van 27 juli 1981 houdende verlenging
    van de geldigheidsduur van Verordening (EEG) nr. 1315/81 tot vaststelling van
    bepaalde tussentijdse maatregelen voor de instandhouding en het beheer van de
    visbestanden van toepassing op vaartuigen die de vlag van Zweden voeren
