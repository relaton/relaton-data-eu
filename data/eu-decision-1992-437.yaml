    και γερμανική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '92/437/CEE: Decisione della Commissione, del 30 luglio 1992, recante modifica
    della decisione 85/634/CEE della Commissione che autorizza taluni Stati membri
    a prevedere deroghe a determinate disposizioni della direttiva 77/93/CEE del Consiglio
    per quanto riguarda il legname di quercia originario del Canada o degli Stati
    Uniti d''America (Il testi in lingua francese, danese, italiana, spagnola, olandese
    e tedesca sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '92/437/EEG: Beschikking van de Commissie van 30 juli 1992 tot wijziging
    van Beschikking 85/634/EEG houdende machtiging van bepaalde Lid-Staten om voor
    eikehout van oorsprong uit Canada of de Verenigde Staten van Amerika afwijking
    van sommige bepalingen van Richtlijn 77/93/EEG van de Raad toe te staan (Slechts
    de teksten in de Franse, Deense, Italiaanse, Spaanse, Nederlandse en de Duitse
    taal zijn authentiek)'
  type: main
- language: pt
  script: Latn
  content: '92/437/CEE: Decisão da Comissão, de 30 de Julho de 1992, que altera
    a Decisão 85/634/CEE, que autoriza determinados Estados-membros a prever derrogações
    a determinadas disposições da Directiva 77/93/CEE do Conselho relativamente
    à madeira de carvalho originária do Canadá ou dos Estados Unidos da América
    (Apenas fazem fé os textos nas línguas francesa, dinamarquesa, italiana, espanhola,
    neerlandesa e alemã)'
  type: main
- language: es
  script: Latn
  content: '92/437/CEE: Decisión de la Comisión, de 30 de julio de 1992, que modifica
    la Decisión 85/634/CEE de la Comisión por la que se autoriza a determinados
    Estados miembros a establecer excepciones a determinadas disposiciones de la Directiva
    77/93/CEE del Consejo respecto de la madera de roble originaria de Canadá o de
    los Estados Unidos de América (Los textos en lenguas francesa, danesa, italiana,
    española, neerlandesa y alemana son los únicos auténticos)'
