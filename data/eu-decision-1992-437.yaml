title:
- language: en
  script: Latn
  content: '92/437/EEC: Commission Decision of 30 July 1992 amending Commission Decision
    85/634/EEC authorizing certain Member States to provide for derogations from certain
    provisions of Council Directive 77/93/EEC in respect of oak wood originating in
    Canada or the United States of America (Only the French, Danish, Italian, Spanish,
    Dutch and German texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: 92/437/CEE/ Décision de la Commission, du 30 juillet 1992, modifiant la
    décision 85/634/CEE autorisant certains Etats membres à prévoir des dérogations
    à certaines dispositions de la directive 77/93/CEE du Conseil pour le bois de
    chêne originaire du Canada ou des Etats-Unis d'Amérique (Les textes en langues
    française, danoise, italienne, espagnole, néerlandaise et allemande sont les
    seuls faisant foi)
  type: main
- language: de
  script: Latn
  content: '92/437/EWG: Entscheidung der Kommission vom 30. Juli 1992 zur Änderung
    der Entscheidung 85/634/EWG der Kommission zur Ermächtigung bestimmter Mitgliedstaaten,
    für Eichenholz mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
    (Nur der französische, dänische, italienische, spanische, niederländische und
    deutsche Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '92/437/EØF: Kommissionens beslutning af 30. juli 1992 om ændring af
    Kommissionens beslutning 85/634/EØF om bemyndigelse af visse medlemsstater til
    at undtage egetræ med oprindelse i Canada eller USA fra visse bestemmelser i
    Rådets direktiv 77/93/EØF (Kun den franske, danske, italienske, spanske, nederlandske
    og tyske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '92/437/ΕΟΚ: Απόφαση της Επιτροπής της 30ής
    Ιουλίου 1992 για την τροποποίηση της απόφασης
    85/634/ΕΟΚ της Επιτροπής σχετικά με την παροχή
    αδείας σε ορισμένα κράτη μέλη να παρεκκλίνουν
    από διατάξεις της οδηγίας 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά το ξύλο βελανιδιάς, καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών της Αμερικής (Τα κείμενα
