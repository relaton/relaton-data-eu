title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1929/83 of 13 July 1983 re-establishing
    the levying of customs duties on bags, sachets and similar articles, of polyethylene,
    falling within subheading 39.07 B V ex d) and originating in Hong Kong, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3377/82
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 1929/83 de la Commission du 13 juillet 1983 portant
    rétablissement de la perception des droits de douane applicables aux sacs, sachets
    et articles similaires, en polyéthylène, de la sous-position 39.07 B V ex d)
    du tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues au règlement (CEE) no 3377/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1929/83 der Kommission vom 13. Juli 1983 zur Wiedereinführung
    der Erhebung der Zölle für Säcke, Beutel und ähnliche Waren, aus Polyäthylen,
    der Tarifstelle 39.07 B V ex d), mit Ursprung in Hongkong, dem die in der Verordnung
    (EWG) Nr. 3377/82 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1929/83 af 13. juli 1983 om genindførelse
    af opkrævning af told for sække og poser, o.l. af polyethylen henhørende under
    pos. 39.07 B V ex d) og med oprindelse i Hongkong, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 3377/82
  type: main
- language: el
  script: Grek
