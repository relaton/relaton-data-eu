title:
- language: en
  script: Latn
  content: Council Directive 85/584/EEC of 20 December 1985 amending, on account of
    the accession of Spain and Portugal, Directive 85/433/EEC concerning the mutual
    recognition of diplomas, certificates and other evidence of formal qualifications
    in pharmacy, including measures to facilitate the effective exercise of the right
    of establishment relating to certain activities in the field of pharmacy
  type: main
- language: fr
  script: Latn
  content: Directive 85/584/CEE du Conseil du 20 décembre 1985 modifiant, en raison
    de l'adhésion de l'Espagne et du Portugal, la directive 85/433/CEE visant à
    la reconnaissance mutuelle des diplômes, certificats et autres titres en pharmacie
    et comportant des mesures destinées à faciliter l'exercice effectif du droit
    d'établissement pour certaines activités du domaine de la pharmacie
  type: main
- language: de
  script: Latn
  content: Richtlinie 85/584/EWG des Rates vom 20. Dezember 1985 zur Änderung aufgrund
    des Beitritts Spaniens und Portugals der Richtlinie 85/433/EWG über die gegenseitige
    Anerkennung der Diplome, Prüfungszeugnisse und sonstige Befähigungsnachweise
    des Apothekers und über Maßnahmen zur Erleichterung der tatsächlichen Ausübung
    des Niederlassungsrechts für bestimmte pharmazeutische Tätigkeiten
  type: main
- language: bg
  script: Cyrl
  content: Директива на Съвета от 20 декември 1985 година
    за изменение, вследствие присъединяването
    на Испания и на Португалия, на Директива 85/433/ЕИО
    относно взаимното признаване на дипломи, удостоверения
    и други официални документи за професионална
    квалификация в областта на фармацията, включващо
    и мерки за улесняване на действителното упражняване
    на правото на установяване по отношение на
    определени дейности в областта на фармацията
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady ze dne 20. prosince 1985, kterou se v důsledku přistoupení
    Španělska a Portugalska mění směrnice 85/433/EHS o vzájemném uznávání
    diplomů, osvědčení a jiných dokladů o dosažené kvalifikaci v oboru farmacie
    obsahující opatření k usnadnění účinného výkonu práva usazování v
    určitých činnostech v oboru farmacie
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 85/584/EØF af 20. december 1985 om ændring, som følge
    af Spaniens og Portugals tiltrædelse, af direktiv 85/433/EØF om gensidig anerkendelse
    af eksamensbeviser, certifikater og andre kvalifikationsbeviser i farmaci samt
    om foranstaltninger, der skal lette den faktiske udøvelse af etableringsretten
    i forbindelse med visse former for virksomhed på det farmaceutiske område
  type: main
- language: el
  script: Grek
  content: Οδηγία 85/584/ΕΟΚ του Συμβουλίου της 20ής Δεκεμβρίου
    1985 για την τροποποίηση, λόγω της προσχώρησης
    της Ισπανίας και της Πορτογαλίας, της οδηγίας
    85/433/ΕΟΚ για την αμοιβαία αναγνώριση των διπλωμάτων,
    πιστοποιητικών και άλλων τίτλων φαρμακευτικής
    και για τη λήψη μέτρων προς διευκόλυνση της
    πραγματικής άσκησης του δικαιώματος εγκατάστασης
    για ορισμένες δραστηριότητες του φαρμακευτικού
    τομέα
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv, 20. detsember 1985, millega muudetakse Hispaania ja
    Portugali ühinemise tõttu direktiivi 85/433/EMÜ, mis käsitleb farmaatsiaalaste
    diplomite, tunnistuste ja muude kvalifikatsiooni tõendavate dokumentide vastastikust
    tunnustamist ja mis sisaldab meetmeid teatava farmaatsiaalase tegevusega seotud
    asutamisõiguse kasutamise hõlbustamiseks
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 85/584/ETY, annettu 20 päivänä joulukuuta 1985,
    farmasian tutkintotodistusten, todistusten ja muiden muodollista kelpoisuutta
    osoittavien asiakirjojen vastavuoroisesta tunnustamisesta sekä toimenpiteistä
    sijoittautumisvapauden tehokkaan käyttämisen helpottamiseksi farmasian alalla
    annetun neuvoston direktiivin 85/433/ETY muuttamisesta Espanjan ja Portugalin
    liittymisen vuoksi
  type: main
- language: hu
  script: Latn
  content: A Tanács Irányelve (1985. december 20.) a gyógyszerészdiplomák, -bizonyítványok
    és hivatalos képesítésekről szóló egyéb tanúsítványok, köztük a gyógyszerészet
    területén bizonyos tevékenységekhez kapcsolódóan a letelepedési jog hatékony
    gyakorlását elősegítő intézkedések kölcsönös elismeréséről szóló
    85/433/EGK irányelv Spanyolország és Portugália csatlakozása következtében
    szükségessé vált módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 85/584/CEE del Consiglio del 20 dicembre 1985 che modifica a
    seguito dell'adesione della Spagna e del Portogallo, la direttiva 85/433/CEE concernente
    il reciproco riconoscimento dei diplomi, certificati ed altri titoli in farmacia
    e comportante misure destinate ad agevolare l'esercizio effettivo del diritto
    di stabilimento per talune attività nel settore farmaceutico
  type: main
- language: lv
  script: Latn
  content: Padomes direktīva (1985. gada 20. decembris), ar ko saistībā ar Spānijas
    un Portugāles pievienošanos groza Direktīvu 85/433/EEK par farmācijas diplomu,
    sertifikātu un citu kvalifikāciju apliecinošu dokumentu savstarpēju atzīšanu,
    tostarp par pasākumiem, kas palīdz sekmīgi īstenot tiesības veikt uzņēmējdarbību
    attiecībā uz konkrētām darbībām farmācijas jomā
  type: main
- language: lt
  script: Latn
  content: 1985 m. gruodžio 20 d. Tarybos Direktyva iš dalies keičianti, atsižvelgiant
    į Ispanijos ir Portugalijos įstojimą, Direktyvą 85/433/EEB dėl farmacijos
    diplomų, pažymėjimų ir kitų oficialią kvalifikaciją patvirtinančių dokumentų
    abipusio pripažinimo, įskaitant priemones, padedančias veiksmingiau naudotis
    su tam tikra farmacine veikla susijusia įsisteigimo teise
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva Tal-Kunsill ta’ l-20 ta’ Diċembru 1985 li temenda, minħabba
    l-adeżjoni ta’ Spanja u l-Portugall, id-Direttiva 85/433/KEE dwar ir-rikonoxximent
    reċiproku ta’ diplomi, ċertifikati u provi oħrajn ta’ kwalifiki formali
    fil-farmaċija, inklużi miżuri sabiex jiffaċilitaw l-eżerċizzju effettiv
    tad-dritt ta’stabbiliment fir-rigward ta’ ċerti attivitajiet fil-qasam tal-farmaċija
  type: main
- language: nl
  script: Latn
  content: Richtlijn 85/584/EEG van de Raad van 20 december 1985 tot wijziging, in
    verband met de toetreding van Spanje en Portugal, van Richtlijn 85/433/EEG inzake
    de onderlinge erkenning van de diploma's, certificaten en andere titels op het
    terrein van de farmacie, tevens houdende maatregelen tot vergemakkelijking van
    de daadwerkelijke uitoefening van het recht van vestiging voor bepaalde werkzaamheden
    op farmaceutisch gebied
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady z dnia 20 grudnia 1985 r. zmieniająca, ze względu na przystąpienie
    Hiszpanii i Portugalii, dyrektywę Rady 85/433/EWG, dotyczącą wzajemnego uznawania
    dyplomów, świadectw i innych dokumentów potwierdzających posiadanie kwalifikacji
    w zakresie farmacji, zawierającą środki mające na celu ułatwienie skutecznego
    wykonywania prawa przedsiębiorczości odnoszącego się do niektórych działalności
    z dziedziny farmacji
  type: main
- language: pt
  script: Latn
  content: Directiva 85/584/CEE do Conselho, de 20 de Dezembro de 1985, que altera,
    por força da adesão de Espanha e de Portugal, a Directiva 85/433/CEE relativa
    ao reconhecimento mútuo dos diplomas, certificados e outros títulos em farmácia,
    incluindo medidas destinadas a facilitar o exercício efectivo do direito de estabelecimento
    para certas actividades do sector farmacêutico
  type: main
- language: ro
  script: Latn
  content: Directiva Consiliului din 20 decembrie 1985 de modificare, în vederea
    aderării Spaniei și Portugaliei, a Directivei 85/433/CEE privind recunoașterea
    reciprocă a diplomelor, certificatelor și a altor titluri oficiale de calificare
    în domeniul farmaciei, inclusiv a măsurilor de facilitare a exercitării efective
    a dreptului de stabilire cu privire la anumite activități din domeniul farmaciei
  type: main
- language: sk
  script: Latn
  content: Smernica Rady z 20. decembra 1985, ktorou sa na základe pristúpenia Španielska
    a Portugalska mení a dopĺňa smernica 85/433/EHS o vzájomnom uznávaní diplomov,
    osvedčení a iných dokladov o formálnych kvalifikáciách farmaceutov vrátane
    opatrení na uľahčenie uplatňovania práva usadiť sa pre určité farmaceutické
    činnosti
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta z dne 20. decembra 1985 o spremembi Direktive 85/433/EGS
    o vzajemnem priznavanju diplom, spričeval in drugih dokazil o formalnih kvalifikacijah
    iz farmacije, vključno z ukrepi za učinkovito uresničevanje pravice do ustanavljanja
    za nekatere farmacevtske dejavnosti, zaradi pristopa Španije in Portugalske
  type: main
- language: es
  script: Latn
  content: Directiva 85/584/CEE del Consejo, de 20 de diciembre de 1985, por la que
    se modifica en razón de la adhesión de España y de Portugal, la Directiva 85/433/CEE
    encaminada al reconocimiento mutuo de diplomas, certificados y otros títulos
    en farmacia y que implican medidas destinadas a facilitar el ejercicio efectivo
    del derecho de establecimiento para determinadas actividades del ámbito de la
    farmacia
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 85/584/EEG av den 20 december 1985 om ändring med anledning
    av Spaniens och Portugals anslutning av direktiv 85/433/EEG om ömsesidigt erkännande
    av utbildnings-, examens- och andra behörighetsbevis i farmaci inklusive åtgärder
    för att underlätta det faktiska utövandet av etableringsrätten när det gäller
    viss farmaceutisk verksamhet
