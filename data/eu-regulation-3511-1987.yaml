    δικαιούχου των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3925/86 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3511/87 della Commissione del 23 novembre 1987 che
    ripristina la riscossione dei dazi doganali applicabili alle trecce, passamaneria
    e pizzi, della categoria di prodotti n. 62 (codice 40.0620), originari dell' Indonesia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 3925/86
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3511/87 van de Commissie van 23 november 1987 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op vlechten,
    passementwerk en kant van de categorie van produkten nr. 62 (codenummer 40.0620),
    van oorsprong uit Indonesië, waarvoor de algemene tariefpreferenties gelden als
    bepaald bij Verordening (EEG) nr. 3925/86 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3511/87 da Comissão de 23 de Novembro de 1987 que
