title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3511/87 of 23 November 1987 re-establishing
    the levying of customs duties on trimmings, braids and lace, products of category
    62 (code 40.0620), originating in Indonesia, to which the preferential tariff
    arrangements set out in Council Regulation (EEC) No 3925/86 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3511/87 de la Commission du 23 novembre 1987 portant
    rétablissement de la perception des droits de douane applicables aux tresses,
    passementerie, dentelles de la catégorie de produits n° 62 (code 40.0620) originaires
    d' Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3925/86 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3511/87 der Kommission vom 23. November 1987 zur Wiedereinführung
    des Zollsatzes für Geflechte, Posamentierwaren und Spitzen der Warenkategorie
    Nr. 62 (Kennziffer 40.0620) mit Ursprung in Indonesien, dem die in der Verordnung
    (EWG) Nr. 3925/86 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3511/87 af 23. november 1987 om genindførelse
    af opkrævning af toldafgifter for agramaner, possement og blonder under varekategori
    nr. 62 (kode 40.0620), som har oprindelse i Indonesien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3925/86
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3511/87 της Επιτροπής
