title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 3485/93 of 17 December 1993 deciding not
    to accept tenders submitted in response to the 105th partial invitation to tender
    opened as a general intervention measure pursuant to Regulation (EEC) No 1627/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 3485/93 de la Commission, du 17 décembre 1993, disposant
    de ne pas donner suite aux offres déposées à la suite de la cent cinquième
    adjudication partielle effectuée dans le cadre des mesures générales d'intervention
    conformément au règlement (CEE) n 1627/89
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3485/93 der Kommission vom 17. Dezember 1993 über
    den Beschluß, den zur 105. Teilausschreibung im Rahmen der allgemeinen Interventionsmaßnahmen
    gemäß der Verordnung (EWG) Nr. 1627/89 eingereichten Angeboten nicht stattzugeben
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 3485/93 af 17. december 1993 om ikke
    at tage den 105. dellicitation i forbindelse med de generelle interventionsforanstaltninger
    i henhold til forordning (EØF) nr. 1627/89 til følge
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 3485/93 της Επιτροπής
    της 17ης Δεκεμβρίου 1993 για να μην δοθεί συνέχεια
    στις προσφορές που κατατέθηκαν για τον 105ο
    μερικό διαγωνισμό που πραγματοποιείται στο
    πλαίσιο των γενικών μέτρων παρεμβάσεως σύμφωνα
    με τον κανονισμό (ΕΟΚ) αριθ. 1627/89
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 3485/93 della Commissione, del 17 dicembre 1993, che
    decide di non dare seguito alle offerte presentate per la centocinquesima gara
    parziale effettuata nel quadro delle misure generali di intervento a norma del
    regolamento (CEE) n. 1627/89
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3485/93 van de Commissie van 17 december 1993 houdende
    het besluit om geen gevolg te geven aan de offertes voor de 105e deelinschrijving
    die overeenkomstig Verordening (EEG) nr. 1627/89 in het kader van de algemene
    interventiemaatregelen is gehouden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3485/93 da Comissão, de 17 de Dezembro de 1993, que
    rejeita as propostas apresentadas na sequência do centésimo quinto concurso
    parcial realizado no âmbito das medidas gerais de intervenção em conformidade
    com o Regulamento (CEE) nº 1627/89
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 3485/93 de la Comisión, de 17 de diciembre de 1993,
    por el que se decide no dar curso a las ofertas presentadas para la centésima
    quinta licitación parcial efectuada en el marco de las medidas generales de intervención
    con arreglo al Reglamento (CEE) n 1627/89
  type: main
