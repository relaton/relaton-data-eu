title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/896 of 28 May 2019 amending
    Implementing Decision (EU) 2019/450 as regards European Assessment Documents for
    internal partition kits for use as non-loadbearing walls, systems of mechanically
    fastened flexible roof waterproofing sheets, thin metal composite sheet, elastic
    micro hollow spheres as concrete admixture, decking fixing assemblies and self-supporting
    translucent roof kits with covering made of plastic sheets
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2019/896 de la Commission du 28 mai 2019 modifiant
    la décision d'exécution (UE) 2019/450 en ce qui concerne les documents d'évaluation
    européens relatifs aux kits de cloisons internes à utiliser comme murs non porteurs,
    aux systèmes de feuilles d'étanchéité de toiture flexibles fixées mécaniquement,
    aux feuilles composites en métal mince, aux sphères micro-creuses élastiques
    en tant qu'adjuvant pour béton, aux assemblages de fixation de pont et aux kits
    de toit translucide autoportant avec revêtement en feuilles de plastique
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/896 der Kommission vom 28. Mai 2019 zur
    Änderung des Durchführungsbeschlusses (EU) 2019/450 in Bezug auf Europäische
    Bewertungsdokumente für Bausätze für innere Trennwände zur Verwendung als
    nichttragende Innenwände, für Systeme mit mechanisch befestigten flexiblen Dachdichtungsbahnen,
    für Blechverbundplatten, für elastische Mikrohohlkugeln als Betonzusatzmittel,
    für Bausätze für Dielenbefestigung und für selbsttragende transparente Dachsysteme
    mit einer Abdeckung aus Kunststoffplatten
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (EC) 2019/896 на Комисията
    от 28 май 2019 година за изменение на Решение за
    изпълнение (ЕС) 2019/450 по отношение на европейските
    документи за оценяване за комплекти за вътрешни
    преградни стени за употреба като неносещи
