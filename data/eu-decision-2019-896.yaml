  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2019/896, annettu 28 päivänä
    toukokuuta 2019, täytäntöönpanopäätöksen (EU) 2019/450 muuttamisesta siltä
    osin kuin on kyse eurooppalaisista arviointiasiakirjoista, jotka koskevat väliseinäpakkauksia
    ei-kantaville seinille, mekaanisesti kiinnitettäviä, joustavia katon vesieristyslevyjärjestelmiä,
    ohuita metallikomposiittilevyjä, elastisia, onttoja mikrokuulia betonin lisäaineena,
    kansilaudoituksen kiinnityslaitteistoja ja itsekantavia, läpikuultavia kattosarjoja
    muovilevyistä valmistetulla katteella
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2019/896 оd 28. svibnja 2019. o izmjeni
    Provedbene odluke (EU) 2019/450 u pogledu europskih dokumenata za ocjenjivanje
    opreme za unutarnje pregrade koja se upotrebljava kao nenosivi zidovi, sustava
    mehanički pričvršćenih savitljivih krovnih vodonepropusnih cerada, tankih
    metalnih kompozitnih limova, elastičnih šupljih mikrokuglica kao dodatka betonu,
    kompleta za pričvršćivanje obloga i samonosivih prozirnih krovnih sklopova
    s pokrovom od plastičnih ploča
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/896 végrehajtási határozata (2019. május 28.)
    az (EU) 2019/450 végrehajtási határozatnak a nem teherhordó falként alkalmazott
    belső válaszfalrendszerekre, a mechanikusan rögzített, hajlékony tetőszigetelő
    lemezrendszerekre, a vékony fém kompozit lapokra, a betonadalékszerként alkalmazott
    rugalmas, mikroüreges golyókra, a fedéshez alkalmazott rögzítőelemekre,
    valamint a műanyag lapokból készült borítással rendelkező, önhordó, fényáteresztő
    tetőszerkezetekre vonatkozó európai értékelési dokumentumok tekintetében
    történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2019/896 della Commissione, del 28 maggio
    2019, che modifica la decisione di esecuzione (UE) 2019/450 per quanto riguarda
    i documenti per la valutazione europea per kit di partizioni interne per pareti
    non portanti, sistemi flessibili e fissati meccanicamente di fogli impermeabilizzanti
    per tetti, fogli metallici compositi fini, microsfere cave elastiche come additivo
    per cemento, unità di fissaggio per pavimenti sopraelevati e sistemi autoportanti
    traslucidi per tetti con copertura in fogli di plastica
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2019/896 (2019. gada 28. maijs), ar
    ko groza Īstenošanas lēmumu (ES) 2019/450 attiecībā uz Eiropas novērtējuma
    dokumentiem iekšējo šķērssienu komplektiem, kurus izmanto kā nenesošās
    sienas, mehāniski stiprināmu lokanu jumta hidroizolācijas lokšņu sistēmām,
    plānām metāla kompozītu loksnēm, elastīgām dobām mikrosfērām, kuras
    izmanto kā piedevu betonam, pārseguma stiprināšanas mezgliem un pašnesošām
    gaismu caurlaidīgām jumta konstrukcijām, kuru pārklājums izgatavots no plastmasas
    loksnēm
  type: main
- language: lt
  script: Latn
  content: 2019 m. gegužės 28 d. Komisijos įgyvendinimo sprendimas (ES) 2019/896,
    kuriuo iš dalies keičiamas Įgyvendinimo sprendimas (ES) 2019/450 dėl vidinių
    pertvarų komplektams, naudojamiems kaip apkrovų nelaikančios sienos, mechaniškai
    tvirtinamų lanksčiųjų stogo hidroizoliacijos lakštų sistemoms, plonasluoksnio
    metalo kompoziciniams lakštams, elastiniams tuščiaviduriams mikrorutuliukams
    kaip betono įmaišoms, grindinio tvirtinimo rinkiniams ir savilaikiams permatomiems
    stogo rinkiniams su danga iš plastikinių lakštų taikomų Europos vertinimo
    dokumentų
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2019/896 tat-28 ta'
    Mejju 2019 li temenda d-Deċiżjoni ta' Implimentazzjoni (UE) 2019/450 fir-rigward
    tad-Dokumenti Ewropej ta' Valutazzjoni għal kittijiet ta' diviżjoni interna
    għall-użu bħala ħitan b'piż li mhux tat-tagħbija, sistemi ta' folji flessibbli
    li ma jidħolx ilma minnhom u li jkunu mwaħħlin mekkanikament, folja kompożita
    rqiqa tal-metall, mikrosferi vojta minn ġewwa u elastiċi bħala taħlita tal-konkos,
    assemblaġġi għat-twaħħil ta' superfiċe ċatta, u kittijiet tas-soqfa transluċidi
    li jifilħu lilhom infushom b'għata magħmula minn folji tal-plastik
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2019/896 van de Commissie van 28 mei 2019 tot wijziging
    van Uitvoeringsbesluit (EU) 2019/450 met betrekking tot de Europese beoordelingsdocumenten
    voor kits voor scheidingswanden voor gebruik als niet-dragende binnenmuren, systemen
    met flexibele, mechanisch te bevestigen dakafdichtingsplaten, dunne plaat van
    metaalcomposiet, elastische holle microbolletjes als betontoevoeging, bevestigingsmiddelen
    voor verhoogde vloeren en zelfdragende doorschijnende daksets met een bedekking
    van kunststof platen
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2019/896 z dnia 28 maja 2019 r. zmieniająca
    decyzję wykonawczą (UE) 2019/450 w odniesieniu do europejskich dokumentów oceny
    dotyczących zestawów wyrobów do wewnętrznych ścian działowych pełniących
    funkcję ścian nienośnych, systemów elastycznych wodoszczelnych arkuszy dachowych
    mocowanych mechanicznie, cienkich arkuszy z metalowych materiałów kompozytowych,
    pustych w środku elastycznych mikrokulek stosowanych jako domieszka do betonu,
    zestawów do mocowania pokryć oraz samonośnych półprzezroczystych systemów
    dachowych z pokryciami wykonanymi z arkuszy z tworzyw sztucznych
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2019/896 da Comissão, de 28 de maio de 2019,
    que altera a Decisão de Execução (UE) 2019/450 no que diz respeito aos Documentos
    de Avaliação Europeus sobre kits para paredes divisórias sem funções resistentes,
    sistemas de impermeabilização de coberturas formados por membranas flexíveis
    fixadas mecanicamente, chapa metálica fina compósita, microesferas ocas e elásticas
    utilizadas como adjuvante para betão, fixações para pavimentos sobrelevados
    e sistemas autoportantes de lanternins com cobertura de plástico
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2019/896 a Comisiei din 28 mai 2019
    de modificare a Deciziei de punere în aplicare (UE) 2019/450 în ceea ce privește
    documentele de evaluare europene pentru ansamblurile de pereți despărțitori
    utilizați ca pereți neportanți, sistemele de folii suple cu fixare mecanică
    pentru etanșarea acoperișurilor, foliile multistratificate subțiri din metal,
    microsferele elastice goale în interior utilizate ca material de adaos pentru
    beton, ansamblurile de fixare a pardoselilor și seturile de acoperiș translucide
    autoportante cu înveliș din folii de plastic
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2019/896 z 28. mája 2019, ktorým
    sa mení vykonávacie rozhodnutie (EÚ) 2019/450, pokiaľ ide o európske hodnotiace
    dokumenty pre zostavy vnútorných priečok pre použitie ako nenosné steny,
    systémy mechanicky ukotvených pružných strešných hydroizolačných povlakov,
    tenké kovové kompozitné dosky, pružné duté mikroskopické guľôčky ako
    betónovú prísadu, stropné závesné zostavy a samonosné priesvitné strešné
    zostavy s pokrytím z plastových tabúľ
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2019/896 z dne 28. maja 2019 o spremembi
    Izvedbenega sklepa (EU) 2019/450 v zvezi z evropskimi ocenjevalnimi dokumenti
    za komplete za notranje pregrade, ki se uporabljajo kot nenosilne stene, sisteme
    mehansko pritrjenih gibkih ponjav za hidroizolacijo streh, tanke plošče iz kovinskega
    kompozitnega materiala, elastične mikroporozne kroglice za dodajanje betonu,
    pritrdila za strešno kritino in samonosilne prosojne komplete za prekrivanje
    streh s kritino iz plošč iz umetne mase
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2019/896 de la Comisión, de 28 de mayo de
    2019, por la que se modifica la Decisión de Ejecución (UE) 2019/450 en lo que
    se refiere a los documentos de evaluación europeos de los kits de partición
    interna para paredes no portantes, los sistemas de impermeabilización de cubiertas
    compuestos por láminas flexibles fijadas mecánicamente, las chapas metálicas
    finas de composite, las microesferas huecas y elásticas utilizadas como adyuvante
    para hormigón, los montajes de fijación para entablado y los sistemas de construcción
    de tejados transparentes y autoportantes con cubierta de plástico
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2019/896 av den 28 maj 2019 om ändring
    av genomförandebeslut (EU) 2019/450 vad gäller europeiska bedömningsdokument
    för invändiga icke bärande skiljeväggssatser, system för mekaniskt fastsatta
    flexibla tätningsplåtar för tak, plåt av tunn metallkomposit, elastiska mikrohålkulor
    som tillsats för betong, fästanordningar för däck och självstödjande genomskinliga
    taksatser med täckning av täckplast
