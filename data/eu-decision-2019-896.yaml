  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2019/896 ze dne 28. května 2019,
    kterým se mění prováděcí rozhodnutí (EU) 2019/450, pokud jde o evropské
    dokumenty pro posuzování týkající se sestav vnitřních příček pro použití
    jako nenosné stěny, systémů mechanicky kotvených pružných střešních
    hydroizolačních povlaků, tenkých kovových kompozitních desek, pružných
    dutých mikroskopických kuliček jako betonové přísady, stropních závěsných
    sestav a samonosných průsvitných střešních sestav s pokrytím z plastových
    desek
  type: main
