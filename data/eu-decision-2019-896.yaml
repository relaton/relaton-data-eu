  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2019/896 της Επιτροπής,
    της 28ης Μαΐου 2019, για την τροποποίηση της εκτελεστικής
    απόφασης (ΕΕ) 2019/450 όσον αφορά τα ευρωπαϊκά έγγραφα
