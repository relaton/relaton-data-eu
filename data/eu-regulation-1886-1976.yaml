  content: Commission Regulation (EEC) No 1886/76 of 30 July 1976 concerning the issue
    of an invitation to tender for the supply to the International Committee of the
    Red Cross for the benefit of Vietnam for use as food aid of vitaminized skimmed-milk
    powder to be purchased on the Community market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1886/76 de la Commission, du 30 juillet 1976, relatif
    à l'adjudication pour la fourniture, au titre de l'aide alimentaire, de lait
    écrémé en poudre vitaminé acheté sur le marché de la Communauté et destiné
    au Comité international de la Croix-Rouge pour le Vietnam
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1886/76 der Kommission vom 30. Juli 1976 über die
    Ausschreibung einer Lieferung von auf dem Markt der Gemeinschaft gekauftem Magermilchpulver
