  content: Commission Decision of 22 December 1980 establishing that the apparatus
    described as 'Tektronix- controller based programmable digitizer system, model
    WP 2250' may not be imported free of Common Customs Tariff duties
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 22 décembre 1980, constatant que l'importation
    de l'appareil dénommé "Tektronix - controller-based programmable digitizer system,
    model WP 2250" ne peut être faite en franchise des droits du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Dezember 1980, mit der festgestellt
    wird, daß das Gerät ,,TEKTRONIX-Controller Based Programmable Digitizer System,
    model WP 2250" nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 22. december 1980 om fastslåelse af, at indførsel
    af apparatet "TEKTRONIX - Controller Based Programmable Digitizer System, model
    WP 2250" ikke kan ske med fritagelse for told efter den fælles toldtarif
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 dicembre 1980, che stabilisce che l'importazione
    dell'apparecchio denominato "Tektronix - controller based programmable digitizer
