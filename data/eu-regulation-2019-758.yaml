    trešās valstīs
  type: main
- language: lt
  script: Latn
  content: 2019 m. sausio 31 d. Komisijos deleguotasis reglamentas (ES) 2019/758,
    kuriuo Europos Parlamento ir Tarybos direktyva (ES) 2015/849 papildoma techniniais
    reguliavimo standartais, kuriais reglamentuojami būtiniausi veiksmai ir papildomos
    priemonės, kurių turi imtis kredito ir finansų įstaigos, kad sumažintų pinigų
    plovimo ir teroristų finansavimo riziką tam tikrose trečiosiose valstybėse
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2019/758 tal-31 ta' Jannar 2019
    li jissupplimenta d-Direttiva (UE) 2015/849 tal-Parlament Ewropew u tal-Kunsill
    fir-rigward tal-istandards tekniċi regolatorji għall-azzjoni minima u t-tipi
    ta' miżuri addizzjonali li jridu jittieħdu mill-istituzzjonijiet ta' kreditu
    u finanzjarji sabiex irażżnu r-riskju mill-ħasil tal-flus u mill-finanzjament
    tat-terroriżmu f'ċerti pajjiżi terzi
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2019/758 van de Commissie van 31 januari
    2019 tot aanvulling van Richtlijn (EU) 2015/849 van het Europees Parlement en
    de Raad met betrekking tot technische reguleringsnormen inzake de minimumactie
    en de soort bijkomende maatregelen waartoe krediet- en financiële instellingen
    verplicht zijn met het oog op het beperken van het witwasrisico en het risico
    van terrorismefinanciering in bepaalde derde landen
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2019/758 z dnia 31 stycznia 2019
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady (UE) 2015/849 w
    odniesieniu do regulacyjnych standardów technicznych określających minimalny
    zakres działań oraz rodzaj dodatkowych środków, które instytucje kredytowe
    i finansowe muszą wdrożyć, aby ograniczyć ryzyko związane z praniem pieniędzy
    i finansowaniem terroryzmu w niektórych państwach trzecich
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2019/758 da Comissão, de 31 de janeiro de 2019,
