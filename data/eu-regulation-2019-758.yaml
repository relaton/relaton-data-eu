  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/758 оd 31. siječnja 2019. o dopuni
    Direktive (EU) 2015/849 Europskog parlamenta i Vijeća u pogledu regulatornih
    tehničkih standarda za minimalno djelovanje i vrstu dodatnih mjera koje kreditne
    i financijske institucije moraju poduzeti kako bi se ublažili rizici pranja novca
    i financiranja terorizma u određenim trećim zemljama
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2019/758 felhatalmazáson alapuló rendelete (2019. január
