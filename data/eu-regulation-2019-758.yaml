title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2019/758 of 31 January 2019 supplementing
    Directive (EU) 2015/849 of the European Parliament and of the Council with regard
    to regulatory technical standards for the minimum action and the type of additional
    measures credit and financial institutions must take to mitigate money laundering
    and terrorist financing risk in certain third countries
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2019/758 de la Commission du 31 janvier 2019
    complétant la directive (UE) 2015/849 du Parlement européen et du Conseil en
    ce qui concerne les normes techniques de réglementation en précisant les actions
    que doivent au minimum engager les établissements de crédit et les établissements
    financiers et le type de mesures supplémentaires qu'ils doivent prendre pour
    atténuer les risques de blanchiment de capitaux et de financement du terrorisme
    dans certains pays tiers
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2019/758 der Kommission vom 31. Januar 2019
    zur Ergänzung der Richtlinie (EU) 2015/849 des Europäischen Parlaments und des
    Rates durch technische Regulierungsstandards für die von Kredit- und Finanzinstituten
    zur Minderung des Risikos von Geldwäsche und Terrorismusfinanzierung in bestimmten
    Drittländern mindestens zu treffenden Maßnahmen und die Art zusätzlich zu treffender
    Maßnahmen
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2019/758 на Комисията
