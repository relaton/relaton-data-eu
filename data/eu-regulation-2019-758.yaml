    Consejo en lo que respecta a las normas técnicas de regulación sobre las medidas
    mínimas y el tipo de medidas adicionales que han de adoptar las entidades de
    crédito y financieras para atenuar el riesgo de blanqueo de capitales y de financiación
    del terrorismo en determinados terceros países
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2019/758 av den 31 januari 2019
    om komplettering av Europaparlamentets och rådets direktiv (EU) 2015/849 med
    avseende på tekniska tillsynsstandarder som fastställer minimiåtgärder och
