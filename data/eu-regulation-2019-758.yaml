    (ЕС) 2015/849 на Европейския парламент и на Съвета
    по отношение на регулаторните технически стандарти
    за минималните действия и вида допълнителни
    мерки, които кредитните и финансовите институции
    трябва да предприемат с цел ограничаване на
    риска от изпиране на пари и финансиране на
    тероризма в някои трети държави
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2019/758 ze dne 31. ledna
    2019, kterým se doplňuje směrnice Evropského parlamentu a Rady (EU) 2015/849,
    pokud jde o regulační technické normy pro minimální opatření a druh dalších
    opatření, která musí úvěrové a finanční instituce přijmout ke zmírnění
    rizika praní peněz a financování terorismu v některých třetích zemích
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2019/758 af 31. januar 2019 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv (EU) 2015/849 for
    så vidt angår reguleringsmæssige tekniske standarder for de tiltag samt arten
    af supplerende foranstaltninger, som kreditinstitutter og finansieringsinstitutter
    som minimum skal gennemføre for at begrænse hvidvask af penge og finansiering
    af terrorisme i visse tredjelande
  type: main
- language: el
  script: Grek
