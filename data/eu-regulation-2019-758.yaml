    que diz respeito às normas técnicas reguladoras das medidas mínimas e do tipo
    de medidas adicionais que as instituições de crédito e financeiras devem tomar
    para mitigar o risco de branqueamento de capitais e de financiamento do terrorismo
    em determinados países terceiros
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2019/758 al Comisiei din 31 ianuarie 2019 de
    completare a Directivei (UE) 2015/849 a Parlamentului European și a Consiliului
    în ceea ce privește standardele tehnice de reglementare care stabilesc acțiunile
    minime și tipul de măsuri suplimentare pe care trebuie să le ia instituțiile
    de credit și financiare pentru a diminua riscul de spălare a banilor și de
    finanțare a terorismului în anumite țări terțe
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2019/758 z 31. januára 2019, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady (EÚ) 2015/849, pokiaľ ide
    o regulačné technické predpisy týkajúce sa minimálnych opatrení a druhu
    dodatočných opatrení, ktoré musia úverové a finančné inštitúcie prijať
    na zmiernenie rizika prania špinavých peňazí a financovania terorizmu v určitých
    tretích krajinách
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2019/758 z dne 31. januarja 2019 o dopolnitvi
