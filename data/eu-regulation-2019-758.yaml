    intézkedésekre és kiegészítő intézkedések típusaira vonatkozó szabályozástechnikai
    standardok tekintetében történő kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2019/758 della Commissione, del 31 gennaio 2019,
    che integra la direttiva (UE) 2015/849 del Parlamento europeo e del Consiglio
    per quanto riguarda le norme tecniche di regolamentazione per l'azione minima
    e il tipo di misure supplementari che gli enti creditizi e gli istituti finanziari
    devono intraprendere per mitigare il rischio di riciclaggio e di finanziamento
    del terrorismo in taluni paesi terzi
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2019/758 (2019. gada 31. janvāris),
