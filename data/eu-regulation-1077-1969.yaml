title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1077/69 de la Commission, du 10 juin 1969, modifiant
    les règlements n° 174/66/CEE et 284/67/CEE en ce qui concerne le dépôt des
    demandes de fixation à l'avance de la restitution à l'exportation pour l'huile
    d'olive et les graines oléagineuses
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1077/69 der Kommission vom 10. Juni 1969 zur Änderung
    der Verordnungen Nr. 174/66/EWG und Nr. 284/67/EWG bezüglich der Einreichung
    von Anträgen auf Vorausfestsetzung der Erstattung bei der Ausfuhr von Olivenöl
    und Ölsaaten
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1077/69 della Commissione, del 10 giugno 1969, che
    modifica i regolamenti nn. 174/66/CEE e 284/67/CEE per quanto riguarda il deposito
    delle domande di fissazione anticipata della restituzione all'esportazione per
    l'olio d'oliva e per i semi oleosi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1077/69 van de Commissie van 10 juni 1969 houdende
    wijziging van Verordeningen nrs. 174/66/EEG en 284/67/EEG ten aanzien van de indiening
    van de verzoeken om vaststelling vooraf van de restitutie bij uitvoer voor olijfolie
    en oliehoudende zaden
  type: main
