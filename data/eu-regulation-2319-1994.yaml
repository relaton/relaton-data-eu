  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2319/94 della Commissione, del 28 settembre 1994, recante
    modifica del regolamento (CE) n. 1787/94 che stabilisce entro quali limiti possono
    essere accettate le domande di titoli di importazione presentate nel mese di luglio
    1994 per taluni prodotti del settore del pollame nel quadro del regime previsto
    dal regolamento (CE) n. 774/94 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2319/94 van de Commissie van 28 september 1994 houdende
    wijziging van Verordening (EG) nr. 1787/94 tot vaststelling van de mate waarin
    gevolg kan worden gegeven aan de aanvragen om invoercertificaten voor bepaalde
    produkten in de sector slachtpluimvee, die in juli 1994 worden ingediend op grond
    van de regeling waarin is voorzien bij Verordening (EG) nr. 774/94 van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2319/94 da Comissão, de 28 de Setembro de 1994, que
