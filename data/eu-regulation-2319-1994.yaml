title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2319/94 of 28 September 1994 amending Regulation
    (EC) No 1787/94 determining the extent to which applications lodged in July 1994
    for import licences for certain poultrymeat products under the regime provided
    for in Council Regulation (EC) No 774/94 can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 2319/94 de la Commission, du 28 septembre 1994, modifiant
    le règlement (CE) n 1787/94 déterminant la mesure dans laquelle les demandes
    de licences d'importation introduites en juillet 1994 pour certains produits à
    base de viande de volaille peuvent être acceptées dans le cadre du régime prévu
    par le règlement (CE) n 774/94 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2319/94 der Kommission vom 28. September 1994 zur Änderung
    der Verordnung (EG) Nr. 1787/94 hinsichtlich des Umfangs, in dem die im Juli 1994
    für bestimmte Geflügelfleischerzeugnisse gestellten Einfuhrlizenzanträge gemäß
    der Verordnung (EG) Nr. 774/94 des Rates genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2319/94 af 28. september 1994 om ændring
    af forordning (EF) nr. 1787/94 om fastsættelse af, i hvilket omfang der kan accepteres
    ansøgninger, der blev indgivet i juli 1994 om importlicenser for visse fjerkræprodukter,
    som kun accepteres i forbindelse med den ordning, der er fastsat i Rådets forordning
    (EF) nr. 774/94
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2319/94 της Επιτροπής
