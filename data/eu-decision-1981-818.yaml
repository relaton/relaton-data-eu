title:
- language: en
  script: Latn
  content: Commission Decision of 17 July 1981 authorizing the Italian Republic not
    to apply Community treatment to woven fabrics of cotton originating in South Korea,
    India, Pakistan and the People's Republic of China (Only the Italian text is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission, du 17 juillet 1981, autorisant la République
    italienne à exclure du traitement communautaire les tissus de coton originaires
    de la Corée du Sud, de l'Inde, du Pakistan et de la République populaire de
    Chine (Le texte en langue italienne est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 17. Juli 1981 zur Ermächtigung der Italienischen
    Republik, aus Südkorea, Indien, Pakistan und der Volksrepublik China stammende
    Gewebe aus Baumwolle von der Gemeinschaftsbehandlung auszuschließen (Nur der
    italienische Text ist verbindlich)
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 17. juli 1981 om bemyndigelse til Den italienske
    Republik til fra fællesskabsbehandling at undtage vævede stoffer af bomuld med
    oprindelse i Sydkorea, Indien, Pakistan og Den kinesiske Folkerepublik (Kun den
    italienske udgave er autentisk)
  type: main
