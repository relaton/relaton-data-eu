    regulaminów ONZ nr 12, 13, 13-H, 22, 24, 48, 49, 51, 53, 54, 74, 79, 85, 86,
    90, 100, 106, 109, 117, 127, 129, 131, 135, 136, 137, 141, 145, 148, 149, 150,
    157 i 162, w odniesieniu do wniosku dotyczącego modyfikacji GTR ONZ nr 2, w odniesieniu
    do wniosku dotyczącego nowego regulaminu ONZ w sprawie sygnału ostrzegawczego
    przy cofaniu, w odniesieniu do wniosku dotyczącego nowego ogólnego przepisu
    technicznego ONZ w sprawie trwałości urządzeń kontrolujących emisję zanieczyszczeń,
    przeznaczonych dla pojazdów dwu- i trzykołowych, w odniesieniu do wniosku dotyczącego
    nowej ujednoliconej rezolucji w sprawie pomiaru liczby cząstek ultradrobnych
    w spalinach z pojazdów ciężkich oraz w odniesieniu do wniosku dotyczącego
    upoważnienia do opracowania poprawki 4 do GTR ONZ nr 3
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2022/969 do Conselho de 16 de junho de 2022 relativa à posição
    a tomar em nome da União Europeia no Fórum Mundial para a Harmonização das
    Regulamentações aplicáveis a Veículos da Comissão Económica para a Europa
    da Organização das Nações Unidas, no que diz respeito às propostas de alteração
    aos Regulamentos n.os 12, 13, 13-H, 22, 24, 48, 49, 51, 53, 54, 74, 79, 85, 86,
    90, 100, 106, 109, 117, 127, 129, 131, 135, 136, 137, 141, 145, 148, 149, 150,
    157 e 162 da ONU, à proposta de alteração do RTG n.o 2 da ONU, à proposta
    de um novo regulamento da ONU relativo a avisadores de marcha-atrás, à proposta
    de um novo Regulamento Técnico Global da ONU relativo à durabilidade dos dispositivos
    de controlo da poluição para veículos de duas e três rodas, à proposta de
    uma nova resolução consolidada relativa à medição do número de partículas
    ultrafinas dos gases de escape para veículos pesados e à proposta de autorização
    para desenvolver a Alteração 4 do RTG n.o 3 da ONU
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2022/969 a Consiliului din 16 iunie 2022 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene în cadrul Forumului
    mondial pentru armonizarea regulamentelor privind vehiculele al Comisiei Economice
    pentru Europa a Organizației Națiunilor Unite în ceea ce privește propunerile
    de modificare a Regulamentelor ONU nr. 12, 13, 13-H, 22, 24, 48, 49, 51, 53, 54,
    74, 79, 85, 86, 90, 100, 106, 109, 117, 127, 129, 131, 135, 136, 137, 141, 145,
    148, 149, 150, 157 și 162, în ceea ce privește propunerea de modificare a RTM
    ONU nr. 2, în ceea ce privește propunerea pentru un nou Regulament ONU privind
    avertizarea la mersul înapoi, în ceea ce privește o propunere pentru un nou
    Regulament tehnic mondial ONU privind durabilitatea dispozitivelor de control
    al poluării pentru vehiculele cu două și trei roți, în ceea ce privește
    propunerea pentru o nouă Rezoluție consolidată privind măsurarea numărului
    de particule ultra-fine din gazele de evacuare pentru vehiculele grele și în
    ceea ce privește propunerea de autorizare pentru elaborarea Amendamentului 4
    la RTM ONU nr. 3
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2022/969 zo 16. júna 2022 o pozícii, ktorá sa
    má v mene Európskej únie zaujať vo Svetovom fóre Európskej hospodárskej
    komisie Organizácie Spojených národov pre harmonizáciu predpisov o vozidlách,
    pokiaľ ide o návrhy zmien predpisov OSN č. 12, 13, 13-H, 22, 24, 48, 49, 51,
    53, 54, 74, 79, 85, 86, 90, 100, 106, 109, 117, 127, 129, 131, 135, 136, 137,
    141, 145, 148, 149, 150, 157 a 162, pokiaľ ide o návrh zmien globálneho technického
    predpisu OSN č. 2, pokiaľ ide o návrh nového predpisu OSN o varovaní pri
    spätnom chode, pokiaľ ide o návrh nového globálneho technického predpisu
    OSN o životnosti zariadení na reguláciu znečisťovania dvojkolesových a trojkolesových
    vozidiel, pokiaľ ide o návrh novej konsolidovanej rezolúcie o meraní počtu
    výfukových ultrajemných častíc pre ťažké úžitkové vozidlá a pokiaľ
    ide o návrh povolenia na vypracovanie zmeny 4 globálneho technického predpisu
    OSN č. 3
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2022/969 z dne 16. junija 2022 o stališču, ki se v imenu
    Evropske unije zastopa v Svetovnem forumu Ekonomske komisije Združenih narodov
    za Evropo za harmonizacijo pravilnikov o vozilih glede predlogov sprememb pravilnikov
    ZN št. 12, 13, 13-H, 22, 24, 48, 49, 51, 53, 54, 74, 79, 85, 86, 90, 100, 106,
    109, 117, 127, 129, 131, 135, 136, 137, 141, 145, 148, 149, 150, 157 in 162, predloga
    sprememb globalnega tehničnega predpisa ZN št. 2, predloga novega pravilnika
    ZN o opozorilnem signalu pri vzvratni vožnji, predloga novega globalnega tehničnega
    predpisa ZN o trajnosti naprav za uravnavanje onesnaževanja za dvo- in trikolesna
    vozila, predloga nove konsolidirane resolucije o merjenju števila ultrafinih
    delcev v izpušnih plinih za težka vozila in predloga za dovoljenje za pripravo
    spremembe 4 globalnega tehničnega predpisa ZN št. 3
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2022/969 del Consejo de 16 de junio de 2022 relativa a la
    posición que debe adoptarse, en nombre de la Unión Europea, en el Foro Mundial
    para la Armonización de la Reglamentación sobre Vehículos de la Comisión Económica
    para Europa de las Naciones Unidas por lo que respecta a las propuestas de modificación
    de los Reglamentos n.os 12, 13, 13-H, 22, 24, 48, 49, 51, 53, 54, 74, 79, 85,
    86, 90, 100, 106, 109, 117, 127, 129, 131, 135, 136, 137, 141, 145, 148, 149,
    150, 157 y 162 de las Naciones Unidas, la propuesta de modificación del RTM n.o
    2 de las Naciones Unidas, la propuesta de un nuevo Reglamento de las Naciones
    Unidas sobre avisadores de marcha atrás, la propuesta de un nuevo Reglamento
    Técnico Mundial de las Naciones Unidas sobre la durabilidad de los dispositivos
    de control de la contaminación para los vehículos de dos y tres ruedas, la propuesta
    de una nueva Resolución Consolidada relativa a la medición del número de partículas
    ultrafinas de escape para vehículos pesados y la propuesta de autorización para
    elaborar la Enmienda 4 al RTM n.o 3 de las Naciones Unidas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2022/969 av den 16 juni 2022 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Förenta nationernas ekonomiska kommission
    för Europas världsforum för harmonisering av fordonsföreskrifter vad gäller
    förslagen till ändringar av FN-föreskrifterna nr 12, 13, 13-H, 22, 24, 48,
    49, 51, 53, 54, 74, 79, 85, 86, 90, 100, 106, 109, 117, 127, 129, 131, 135, 136,
    137, 141, 145, 148, 149, 150, 157 och 162, vad gäller förslaget till ändringar
    av global teknisk föreskrift nr 2, vad gäller förslaget till ny FN-föreskrift
    om varning vid backning, vad gäller förslaget till ny global teknisk föreskrift
    om hållbarheten hos utsläppsbegränsande anordningar för två- och trehjulingar,
    vad gäller förslaget till ny konsoliderad resolution om mätning av utsläpp
    av ultrafina partiklar för tunga fordon samt vad gäller förslaget till godkännande
    av utveckling av ändring 4 av global teknisk föreskrift nr 3
