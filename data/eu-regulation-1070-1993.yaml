    Bestimmungen zur Anwendung des ergänzenden Handelsmechanismus (EHM) im Handel
    mit Tomaten, Artischocken, Melonen, Erdbeeren, Aprikosen und Pfirsichen zwischen
    Spanien und der Gemeinschaft in ihrer Zusammensetzung am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 1070/93 af 30. april 1993 om visse
