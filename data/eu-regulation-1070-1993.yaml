  content: COMMISSION REGULATION (EEC) No 1070/93 of 30 April 1993 laying down certain
    additional detailed rules for the application of the supplementary trade mechanism
    (STM) to trade in fruit and vegetables between Spain and the Community as constituted
    on 31 December 1985 as regards tomatoes, artichokes, melons, strawberries, apricots
    and peaches
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1070/93 de la Commission du 30 avril 1993 fixant certaines
    modalités additionnelles pour l'application du mécanisme complémentaire aux
    échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et la Communauté
    dans sa composition au 31 décembre 1985 en ce qui concerne les tomates, les artichauts,
    les melons, les fraises, les abricots et les pêches
  type: main
- language: de
  script: Latn
