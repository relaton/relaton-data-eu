    kattavuuden osalta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/2552 ón gCoimisiún an 12 Nollaig
    2022 lena leagtar síos sonraíochtaí teicniúla na gceanglas sonraí i ndáil
    le mionábhar an staidrimh maidir le táirgeadh tionsclaíoch lena mbunaítear
    miondealú aicmiúcháin ar tháirgí tionsclaíocha, de bhun Rialachán (AE)
    2019/2152 ó Pharlaimint na hEorpa agus ón gComhairle agus lena leasaítear Rialachán
    Cur Chun Feidhme (AE) 2020/1197 ón gCoimisiún, a mhéid a bhaineann le cumhdach
    an aicmithe táirgí
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/2552 оd 12. prosinca 2022. o utvrđivanju
    tehničkih specifikacija zahtjevâ u pogledu podataka za statistiku o detaljnoj
    temi „industrijska proizvodnja” kojom se utvrđuje raščlamba klasifikacije
    industrijskih proizvoda u skladu s Uredbom (EU) 2019/2152 Europskog parlamenta
    i Vijeća i o izmjeni Provedbene uredbe Komisije (EU) 2020/1197 u pogledu obuhvata
    klasifikacije proizvoda
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2552 végrehajtási rendelete (2022. december 12.)
    az „ipari termelés” részletes témával kapcsolatos statisztikai adatszolgáltatási
    követelményekre vonatkozó, az ipari termékek osztályozásán alapuló bontást
    megállapító technikai előírásoknak az (EU) 2019/2152 európai parlamenti
    és tanácsi rendelet alapján történő meghatározásáról, valamint az (EU)
    2020/1197 bizottsági végrehajtási rendeletnek a termékosztályozás hatóköre
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/2552 della Commissione, del 12 dicembre
    2022, che stabilisce le specifiche tecniche per i requisiti dei dati per le statistiche
    sulla tematica dettagliata «produzione industriale», che definiscono la disaggregazione
    della classificazione dei prodotti industriali a norma del regolamento (UE) 2019/2152
    del Parlamento europeo e del Consiglio, e che modifica il regolamento di esecuzione
    (UE) 2020/1197 della Commissione per quanto riguarda la copertura della classificazione
    dei prodotti
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/2552 (2022. gada 12. decembris),
    ar ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (ES) 2019/2152 nosaka
    datu prasību tehniskās specifikācijas detalizētajam tematam “Rūpniecības
    produkcijas statistika”, izveidojot rūpniecisko ražojumu klasifikācijas dalījumu,
    un ar ko attiecībā uz ražojumu klasifikācijas tvērumu groza Komisijas Īstenošanas
    regulu (ES) 2020/1197
  type: main
- language: lt
  script: Latn
