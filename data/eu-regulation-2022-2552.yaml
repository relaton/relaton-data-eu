    kuriuo pagal Europos Parlamento ir Tarybos reglamentą (ES) 2019/2152 nustatomos
    potemės „Pramonės produkcija“ statistiniams duomenims taikomų reikalavimų
    techninės specifikacijos, nustatomas pramonės produktų klasifikacinis suskirstymas
    ir dėl produktų klasifikavimo aprėpties iš dalies keičiamas Komisijos įgyvendinimo
    reglamentas (ES) 2020/1197
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/2552 tad-12
    ta’ Diċembru 2022 li jistabbilixxi l-ispeċifikazzjonijiet tekniċi tar-rekwiżiti
    tad-data għat-tema dettaljata tal-istatistika tal-produzzjoni industrijali li
    jistabbilixxi d-diżaggregazzjoni tal-klassifikazzjoni tal-prodotti industrijali,
    skont ir-Regolament (UE) 2019/2152 tal-Parlament Ewropew u tal-Kunsill u li jemenda
    r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/1197, fir-rigward
    tal-kopertura tal-klassifikazzjoni tal-prodotti
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/2552 van de Commissie van 12 december
    2022 tot vaststelling van de technische specificaties van de gegevensvereisten
    voor het gedetailleerde onderwerp industriële-productiestatistieken waarin de
    uitsplitsing van de classificatie van industrieproducten wordt vastgesteld, overeenkomstig
    Verordening (EU) 2019/2152 van het Europees Parlement en de Raad en tot wijziging
    van Uitvoeringsverordening (EU) 2020/1197 van de Commissie wat de dekking van
    de classificatie van producten betreft
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/2552 z dnia 12 grudnia 2022
    r. określające specyfikacje techniczne wymogów dotyczących danych w odniesieniu
    do szczegółowego tematu statystyki produkcji przemysłowej, ustanawiające podział
    klasyfikacji produktów przemysłowych na podstawie rozporządzenia Parlamentu
    Europejskiego i Rady (UE) 2019/2152 oraz zmieniające rozporządzenie wykonawcze
    Komisji (UE) 2020/1197 w odniesieniu do zakresu klasyfikacji produktów
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/2552 da Comissão, de 12 de dezembro
    de 2022, que estabelece as especificações técnicas dos requisitos em matéria
    de dados relativamente ao tópico detalhado «estatísticas da produção industrial»
    que estabelece a desagregação da classificação dos produtos industriais, nos
    termos do Regulamento (UE) 2019/2152 do Parlamento Europeu e do Conselho, e que
    altera o Regulamento de Execução (UE) 2020/1197 da Comissão, no que respeita
    à cobertura da classificação dos produtos
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/2552 al Comisiei din 12 decembrie
    2022 de stabilire a specificațiilor tehnice ale cerințelor în materie de date
    pentru subiectul detaliat „statistici privind producția industrială” și
    de stabilire a defalcării clasificării produselor industriale, în conformitate
    cu Regulamentul (UE) 2019/2152 al Parlamentului European și al Consiliului, și
    de modificare a Regulamentului de punere în aplicare (UE) 2020/1197 al Comisiei
    în ceea ce privește acoperirea clasificării produselor
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/2552 z 12. decembra 2022, ktorým
    sa stanovujú technické špecifikácie požiadaviek na údaje v rámci čiastkovej
    témy „štatistika priemyselnej výroby“, ktorou sa určuje klasifikačné
    členenie priemyselných výrobkov podľa nariadenia Európskeho parlamentu a
    Rady (EÚ) 2019/2152, a ktorým sa mení vykonávacie nariadenie Komisie (EÚ)
    2020/1197, pokiaľ ide o pokrytie klasifikácie výrobkov
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/2552 z dne 12. decembra 2022 o določitvi
    tehničnih specifikacij zahtev po podatkih za podrobno temo statistike industrijske
    proizvodnje, ki določa razčlenitev klasifikacije industrijskih proizvodov, v
    skladu z Uredbo (EU) 2019/2152 Evropskega parlamenta in Sveta ter o spremembi
    Izvedbene uredbe Komisije (EU) 2020/1197 glede zajetja klasifikacije proizvodov
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/2552 de la Comisión, de 12 de diciembre
    de 2022, por el que se establecen las especificaciones técnicas de los requisitos
    de datos para las estadísticas del tema detallado producción industrial, que
    establecen el desglose de la clasificación de los productos industriales, con
    arreglo al Reglamento (UE) 2019/2152 del Parlamento Europeo y del Consejo, y por
    el que se modifica el Reglamento de Ejecución (UE) 2020/1197 de la Comisión
    en lo que respecta a la cobertura de la clasificación de productos
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/2552 av den 12 december
    2022 om fastställande av de tekniska specifikationerna för datakrav för det
    specifika ämnet industriproduktionsstatistik som fastställer klassificeringen
    av industriprodukter, i enlighet med Europaparlamentets och rådets förordning
    (EU) 2019/2152 och om ändring av kommissionens genomförandeförordning (EU)
    2020/1197 vad gäller de produkter som omfattas av klassificeringen
