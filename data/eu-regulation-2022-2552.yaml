title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/2552 of 12 December 2022 laying
    down the technical specifications of data requirements for the detailed topic
    industrial production statistics establishing the industrial products classification
    breakdown, pursuant to Regulation (EU) 2019/2152 of the European Parliament and
    of the Council and amending Commission Implementing Regulation (EU) 2020/1197,
    as regards the coverage of the product classification
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/2552 de la Commission du 12 décembre
    2022 fixant les spécifications techniques des exigences en matière de données
    pour le thème détaillé «Statistiques de la production industrielle» établissant
    la ventilation de la classification des produits industriels, conformément au
    règlement (UE) 2019/2152 du Parlement européen et du Conseil, et modifiant le
    règlement d’exécution (UE) 2020/1197 de la Commission, en ce qui concerne
    la couverture de la classification des produits
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/2552 der Kommission vom 12. Dezember
    2022 zur Festlegung der technischen Spezifikationen der Datenanforderungen für
    die Statistik für das Einzelthema Industrieproduktion zur Erstellung der Aufschlüsselung
    der Klassifikation der Industrieprodukte gemäß der Verordnung (EU) 2019/2152
    des Europäischen Parlaments und des Rates und zur Änderung der Durchführungsverordnung
    (EU) 2020/1197 der Kommission im Hinblick auf den Abdeckungsbereich der Güterklassifikation
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/2552 на Комисията
    от 12 декември 2022 година за определяне на техническите
    спецификации на изискванията по отношение
    на данните за статистиката за подробна тема
    „Промишлено производство“ за установяване
    на разбивката на класификацията на промишлените
    продукти, в съответствие с Регламент (ЕС) 2019/2152
    на Европейския парламент и на Съвета, и за изменение
    на Регламент за изпълнение (ЕС) 2020/1197 на Комисията
    по отношение на обхвата на класификацията
    на продуктите
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/2552 ze dne 12. prosince 2022,
    kterým se podle nařízení Evropského parlamentu a Rady (EU) 2019/2152 stanoví
    technické specifikace požadavků na údaje pro dílčí téma týkající se
    statistik o průmyslové výrobě, které stanoví členění klasifikace průmyslových
    výrobků, a kterým se mění prováděcí nařízení Komise (EU) 2020/1197,
    pokud jde o pokrytí klasifikace výrobků
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/2552 af 12. december
    2022 om fastsættelse af de tekniske specifikationer for datakrav til den detaljerede
    variable statistik over industriproduktion til fastsættelse af en opdeling af
    klassifikationen af industriprodukter, jf. Europa-Parlamentets og Rådets forordning
    (EU) 2019/2152, og om ændring af Kommissionens gennemførelsesforordning (EU)
    2020/1197 for så vidt angår produktklassifikationens dækning
  type: main
- language: el
  script: Grek
