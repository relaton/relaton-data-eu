  script: Latn
  content: COMMISSION REGULATION (EC) No 1437/95 of 26 June 1995 determining the extent
    to which applications lodged in June 1995 licences for certain eggs and poultrymeat
    products under the regime provided for by the Agreements concluded by the Community
    with the Republic of Poland, the Republic of Hungary, the Czech Republic and the
    Slovak Republic can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1437/95 DE LA COMMISSION du 26 juin 1995 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juin 1995 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus entre la Communauté
    et la république de Pologne, la république de Hongrie, la République tchèque
    et la République slovaque peuvent être acceptées
  type: main
