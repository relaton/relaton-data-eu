  content: Commission Regulation (EEC) No 2472/77 of 9 November 1977 terminating the
    conclusion of short-term private storage contracts in respect of table wine of
    type A I and table wines in close economic relationship to that type of wine
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 2472/77 de la Commission, du 9 novembre 1977, relatif
    a la suppression de la conclusion des contrats de stockage privé à court terme
    pour le vin de table du type A I et pour les vins de table se trouvant dans une
    relation économique étroite avec celui-ci
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2472/77 der Kommission vom 9. November 1977 über
    die Einstellung des Abschlusses von Verträgen für die kurzfristige private Lagerhaltung
    für Tafelweine der Art A I und für Tafelweine, die in engem wirtschaftlichem
    Zusammenhang mit dieser Weinart stehen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2472/77 af 9. november 1977 om ophør
    af adgangen til at indgå kortfristede kontrakter om privat oplagring af bordvin
    af typen A I og af bordvine, der står i nær økonomisk forbindelse med denne
    type
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2472/77 della Commissione, del 9 novembre 1977, relativo
    alla soppressione della conclusione di contratti di magazzinaggio privato a breve
    termine per il vino da tavola del tipo A I e per i vini da tavola che sono in
    stretta relazione economica con quest'ultimo
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2472/77 van de Commissie van 9 november 1977 houdende
    beëindiging van de mogelijkheid tot het sluiten van kortlopende contracten voor
    de particuliere opslag van tafelwijn van soort A I en van tafelwijn die daarmee
    in nauw economisch verband staat
