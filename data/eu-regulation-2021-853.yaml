title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2021/853 of 27 May 2021 renewing
    the approval of the active substance Streptomyces strain K61 in accordance with
    Regulation (EC) No 1107/2009 of the European Parliament and of the Council concerning
    the placing of plant protection products on the market, and amending the Annex
    to Commission Implementing Regulation (EU) No 540/2011
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2021/853 de la Commission du 27 mai 2021
    renouvelant l’approbation de la substance active «Streptomyces souche K61»,
    conformément au règlement (CE) no 1107/2009 du Parlement européen et du Conseil
    concernant la mise sur le marché des produits phytopharmaceutiques, et modifiant
    l’annexe du règlement d’exécution (UE) no 540/2011 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2021/853 der Kommission vom 27. Mai 2021
    zur Erneuerung der Genehmigung für den Wirkstoff Streptomyces Stamm K61gemäß
    der Verordnung (EG) Nr. 1107/2009 des Europäischen Parlaments und des Rates über
    das Inverkehrbringen von Pflanzenschutzmitteln und zur Änderung des Anhangs der
    Durchführungsverordnung (EU) Nr. 540/2011 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2021/853 на Комисията
    от 27 май 2021 година за подновяване, в съответствие
    с Регламент (ЕО) № 1107/2009 на Европейския парламент
    и на Съвета относно пускането на пазара на
    продукти за растителна защита, на одобрението
    на активното вещество Streptomyces, щам K61, и за изменение
    на приложението към Регламент за изпълнение
    (ЕС) № 540/2011 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2021/853 ze dne 27. května 2021,
    kterým se v souladu s nařízením Evropského parlamentu a Rady (ES) č. 1107/2009
    o uvádění přípravků na ochranu rostlin na trh obnovuje schválení účinné
    látky Streptomyces kmen K61 a kterým se mění příloha prováděcího nařízení
    Komise (EU) č. 540/2011
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2021/853 af 27. maj 2021 om
    fornyelse af godkendelsen af aktivstoffet Streptomyces stamme K61, jf. Europa-Parlamentets
    og Rådets forordning (EF) nr. 1107/2009 om markedsføring af plantebeskyttelsesmidler,
    og om ændring af bilaget til Kommissionens gennemførelsesforordning (EU) nr.
    540/2011
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2021/853 της Επιτροπής
    της 27ης Μαΐου 2021 για την ανανέωση της έγκρισης
    της δραστικής ουσίας Streptomyces στέλεχος Κ61, σύμφωνα
    με τον κανονισμό (ΕΚ) αριθ. 1107/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου σχετικά με
    τη διάθεση φυτοπροστατευτικών προϊόντων στην
    αγορά, και για την τροποποίηση του παραρτήματος
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 540/2011
    της Επιτροπής
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2021/853, 27. mai 2021, millega pikendatakse
    toimeaine Streptomyces’e (tüvi K61) heakskiitu vastavalt Euroopa Parlamendi
    ja nõukogu määrusele (EÜ) nr 1107/2009 taimekaitsevahendite turulelaskmise
    kohta ning muudetakse komisjoni rakendusmääruse (EL) nr 540/2011 lisa
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2021/853, annettu 27 päivänä
    toukokuuta 2021, tehoaineen Streptomyces kanta K61 hyväksynnän uusimisesta kasvinsuojeluaineiden
    markkinoille saattamisesta annetun Euroopan parlamentin ja neuvoston asetuksen
    (EY) N:o 1107/2009 mukaisesti ja komission täytäntöönpanoasetuksen (EU) N:o
    540/2011 liitteen muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2021/853 ón gCoimisiún an 27 Bealtaine
    2021 lena ndéantar an formheas ar an tsubstaint ghníomhach Streptomyces tréithchineál
    K61 a athnuachan i gcomhréir le Rialachán (CE) Uimh. 1107/2009 ó Pharlaimint
    na hEorpa agus ón gComhairle maidir le táirgí cosanta plandaí a chur ar an
    margadh, agus lena leasaítear an Iarscríbhinn a ghabhann le Rialachán Cur Chun
    Feidhme (AE) Uimh. 540/2011 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2021/853 оd 27. svibnja 2021. o produljenju
    odobrenja aktivne tvari Streptomyces soj K61 u skladu s Uredbom (EZ) br. 1107/2009
    Europskog parlamenta i Vijeća o stavljanju na tržište sredstava za zaštitu
    bilja te o izmjeni Priloga Provedbenoj uredbi (EU) br. 540/2011
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2021/853 végrehajtási rendelete (2021. május 27.)
    a Streptomyces K61 törzse hatóanyagnak a növényvédő szerek forgalomba hozataláról
    szóló 1107/2009/EK európai parlamenti és tanácsi rendelet szerinti jóváhagyása
    meghosszabbításáról, valamint az 540/2011/EU bizottsági végrehajtási rendelet
    mellékletének módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2021/853 della Commissione del 27 maggio
    2021 che rinnova l’approvazione della sostanza attiva Streptomyces ceppo K61,
    in conformità al regolamento (CE) n. 1107/2009 del Parlamento europeo e del Consiglio
    relativo all’immissione sul mercato dei prodotti fitosanitari, e che modifica
    l’allegato del regolamento di esecuzione (UE) n. 540/2011 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2021/853 (2021. gada 27. maijs), ar
    ko saskaņā ar Eiropas Parlamenta un Padomes Regulu (EK) Nr. 1107/2009 par augu
    aizsardzības līdzekļu laišanu tirgū atjauno darbīgās vielas Streptomyces
    celma K61 apstiprinājumu un groza Komisijas Īstenošanas regulas (ES) Nr. 540/2011
    pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2021/853 2021 m. gegužės 27
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1107/2009 dėl
    augalų apsaugos produktų pateikimo į rinką pratęsiamas veikliosios medžiagos
    Streptomyces padermės K61 patvirtinimo galiojimas ir iš dalies keičiamas Komisijos
    įgyvendinimo reglamento (ES) Nr. 540/2011 priedas
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2021/853 tas-27
    ta’ Mejju 2021 li jġedded l-approvazzjoni tas-sustanza attiva Streptomyces
    tar-razza K61 f’konformità mar-Regolament (KE) Nru 1107/2009 tal-Parlament
    Ewropew u tal-Kunsill dwar it-tqegħid fis-suq ta’ prodotti għall-protezzjoni
    tal-pjanti, u li jemenda l-Anness tar-Regolament ta’ Implimentazzjoni tal-Kummissjoni
    (UE) Nru 540/2011
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2021/853 van de Commissie van 27 mei 2021 tot
    verlenging van de goedkeuring van de werkzame stof Streptomyces stam K61 overeenkomstig
    Verordening (EG) nr. 1107/2009 van het Europees Parlement en de Raad betreffende
    het op de markt brengen van gewasbeschermingsmiddelen, en tot wijziging van de
    bijlage bij Uitvoeringsverordening (EU) nr. 540/2011 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2021/853 z dnia 27 maja 2021 r.
    w sprawie odnowienia zatwierdzenia substancji czynnej Streptomyces szczep K61,
    zgodnie z rozporządzeniem Parlamentu Europejskiego i Rady (WE) nr 1107/2009 dotyczącym
    wprowadzania do obrotu środków ochrony roślin, oraz w sprawie zmiany załącznika
    do rozporządzenia wykonawczego Komisji (UE) nr 540/2011
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2021/853 da Comissão de 27 de maio de 2021
    que renova a aprovação da substância ativa Streptomyces estirpe K61, em conformidade
    com o Regulamento (CE) n.o 1107/2009 do Parlamento Europeu e do Conselho relativo
    à colocação dos produtos fitofarmacêuticos no mercado, e que altera o anexo
    do Regulamento de Execução (UE) n.o 540/2011 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2021/853 al Comisiei din 27 mai
    2021 de reînnoire a aprobării substanței active Streptomyces tulpina K61, în
    conformitate cu Regulamentul (CE) nr. 1107/2009 al Parlamentului European și
    al Consiliului privind introducerea pe piață a produselor fitosanitare, și
    de modificare a anexei la Regulamentul de punere în aplicare (UE) nr. 540/2011
    al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2021/853 z 27. mája 2021, ktorým
    sa v súlade s nariadením Európskeho parlamentu a Rady (ES) č. 1107/2009 o
    uvádzaní prípravkov na ochranu rastlín na trh obnovuje schválenie účinnej
    látky Streptomyces kmeň K61 a ktorým sa mení príloha k vykonávaciemu nariadeniu
    Komisie (EÚ) č. 540/2011
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2021/853 z dne 27. maja 2021 o obnovitvi
    odobritve aktivne snovi Streptomyces sev K61 v skladu z Uredbo (ES) št. 1107/2009
    Evropskega parlamenta in Sveta o dajanju fitofarmacevtskih sredstev v promet ter
    o spremembi Priloge k Izvedbeni uredbi Komisije (EU) št. 540/2011
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2021/853 de la Comisión de 27 de mayo de
    2021 por el que se renueva la aprobación de la sustancia activa Streptomyces,
    cepa K61, con arreglo al Reglamento (CE) n.o 1107/2009 del Parlamento Europeo
    y del Consejo, relativo a la comercialización de productos fitosanitarios, y
    se modifica el anexo del Reglamento de Ejecución (UE) n.o 540/2011 de la Comisión
  type: main
