title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 196/2006 of 3 February 2006 amending Annex
    I to Regulation (EC) No 761/2001 of the European Parliament and of the Council
    to take account of the European Standard EN ISO 14001:2004, and repealing Decision
    97/265/EC
  type: main
- language: fr
  script: Latn
