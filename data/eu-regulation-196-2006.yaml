    l’annexe I du règlement (CE) n o 761/2001 du Parlement européen et du Conseil
    afin de tenir compte de la norme européenne EN ISO 14001:2004, et abrogeant la
    décision 97/265/CE
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 196/2006 der Kommission vom 3. Februar 2006 zur Änderung
    des Anhangs I der Verordnung (EG) Nr. 761/2001 des Europäischen Parlaments und
    des Rates aufgrund der Europäischen Norm EN ISO 14001:2004 sowie zur Aufhebung
    der Entscheidung 97/265/EG der Kommission
  type: main
