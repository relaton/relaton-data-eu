title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1225/92 of 12 May 1992 re-establishing the
    levying of customs duties on products of category No 36 order of 40.0360, originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1225/92 de la Commission du 12 mai 1992 portant rétablissement
    de la perception des droits de douane applicables aux produits de la catégorie
    36 (numéro d'ordre 40.0360) originaires de la Chine, bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1225/92 DER KOMMISSION vom 12. Mai 1992 zur Wiedereinführung
    des Zollsatzes für die Waren der Kategorie 36 (laufende Nummer 40.0360) mit Ursprung
    in China, dem die in der Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen
    gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1225/92 af 12. maj 1992 om genindførelse
    af opkrævning af told for varer under kategori 36 (løbenummer 40.0360), som
    har oprindelse i Kina og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 3832/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1225/92 της Επιτροπής
    της 12ης Μαΐου 1992 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών για τα προϊόντα της κατηγορίας
    36 ( αύξων αριθ. 40.0360), καταγωγής Κίνας, δικαιούχου
    των προβλεπόμενων στον κανονισμό (ΕΟΚ) αριθ.
    3832/90 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1225/92 DELLA COMMISSIONE del 12 maggio 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti della categoria
    n. 36, n. d'' ordine 40.0360, originari della Cina beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3832/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1225/92 VAN DE COMMISSIE van 12 mei 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van categorie 36 (volgnummer 40.0360), van oorsprong uit China, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3832/90 van de
    Raad #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1225/92 DA COMISSÃO de 12 de Maio de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos da categoria 36 (número
    de ordem 40.0360), originários da China, beneficiários das preferências pautais
    previstas pelo Regulamento (CEE) no 3832/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1225/92 DE LA COMISIÓN de 12 de mayo de 1992 relativo
    al restablecimiento de la recaudación de los derechos arancelarios aplicables
    a los productos de la categoría no 36 (número de orden 40.0360), originarios
    de China, beneficiarios de las preferencias arancelarias previstas por el Reglamento
    (CEE) no 3832/90 del Consejo #'
