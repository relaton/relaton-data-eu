    der Mitgliedstaaten über die Umsatzsteuern abweichende Maßnahme einzuführen'
  type: main
- language: da
  script: Latn
  content: '97/189/EF: Rådets Beslutning af 17. marts 1997 om tilladelse til Forbundsrepublikken
