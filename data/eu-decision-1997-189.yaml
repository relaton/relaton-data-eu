    να εφαρμόσουν ένα μέτρο κατά παρέκκλιση του
    άρθρου 3 της έκτης οδηγίας 77/388/ΕΟΚ του Συμβουλίου,
    της 17ης Μαΐου 1977, για την εναρμόνιση των νομοθεσιών
    των κρατών μελών των σχετικών με τους φόρους
    κύκλου εργασιών'
  type: main
- language: fi
  script: Latn
  content: '97/189/EY: Neuvoston päätös, tehty 17 päivänä maaliskuuta 1997,
