  script: Latn
  content: '97/189/EC: Council Decision of 17 March 1997 authorizing the Federal Republic
    of Germany and the French Republic to apply a measure derogating from Article
    3 of the Sixth Directive 77/388/EEC on the harmonization of the laws of the Member
    States relating to turnover taxes'
  type: main
- language: fr
  script: Latn
  content: '97/189/CE: Décision du Conseil du 17 mars 1997 autorisant la République
    fédérale d''Allemagne et la République française à appliquer une mesure dérogatoire
    à l''article 3 de la sixième directive 77/388/CEE en matière d''harmonisation
    des législations des États membres relatives aux taxes sur le chiffre d''affaires'
  type: main
- language: de
  script: Latn
  content: '97/189/EG: Entscheidung des Rates vom 17. März 1997 zur Ermächtigung
