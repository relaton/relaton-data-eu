title:
- language: en
  script: Latn
  content: '2007/563/EC: Commission Decision of 1 August 2007 amending Decision 2006/504/EC
    on special conditions governing certain foodstuffs imported from certain third
    countries due to contamination risks of these products by aflatoxins as regards
    almonds and derived products originating in or consigned from the United States
    of America (notified under document number C(2007) 3613)'
  type: main
- language: fr
  script: Latn
  content: '2007/563/CE: Décision de la Commission du 1 er août 2007 modifiant la
    décision 2006/504/CE relative aux conditions particulières applicables à certaines
    denrées alimentaires importées de certains pays tiers en raison des risques
    de contamination de ces produits par les aflatoxines en ce qui concerne les amandes
    et les produits dérivés originaires ou en provenance des États-Unis d’Amérique
    [notifiée sous le numéro C(2007) 3613]'
  type: main
- language: de
  script: Latn
