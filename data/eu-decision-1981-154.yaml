title:
- language: en
  script: Latn
  content: '81/154/EEC: Commission Decision of 25 February 1981 changing the import
    arrangements established by Council Decision 80/1278/EEC and applied in Italy
    in respect of imports of aluminium alloy waste recast into ingots containing less
    than 97% aluminium, originating in the Soviet Union (Only the Italian text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/154/CEE: Décision de la Commission, du 25 février 1981, modifiant
    le régime d''importation prévu par la décision 80/1278/CEE du Conseil et appliqué
    en Italie à l''égard de l''Union soviétique en ce qui concerne les déchets
    d''aluminium allié relingotés dont la teneur en aluminium n''est pas supérieure
    à 97% (Le texte en langue italienne est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/154/EWG: Entscheidung der Kommission vom 25. Februar 1981 zur Änderung
    der durch Entscheidung 80/1278/EWG des Rates vorgesehenen und in Italien gegenüber
    der Sowjetunion für Aluminiumschrott, legiert, in Barren, mit einem Gehalt an
    Aluminium von weniger als 97%, angewandten Einfuhrregelung (Nur der italienische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/154/EØF: Kommissionens beslutning af 25. februar 1981 om ændring
    af den importordning, der er fastsat i Rådets beslutning 80/1278/EØF, og som
    anvendes i Italien over for Sovjetunionen for så vidt angår aluminiumsaffald
    i legeringer, genstøbt i barrer med et aluminiumsindhold på under 97% (Kun den
    italienske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/154/ΕΟΚ: Απόφαση τής Επιτροπής τής 25ης
    Φεβρουαρίου 1981 περί τροποποιήσεως τού καθεστώτος
    εισαγωγής τό οποίο προβλέπεται από τήν απόφαση
    80/1278/ΕΟΚ τού Συμβουλίου καί τό οποίο εφαρμόζεται
    στήν Ιταλία έναντι τής ΕΣΣΔ όσον αφορά τά πλινθοποιηθέντα
    εκ νέου απορρίμματα κραμμάτων αργιλίου τών
    οποίων η περιεκτικότητα σέ αργίλιο δέν υπερβαίνει
    τό 97% (Το κείμενο στην ιταλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/154/CEE: Decisione della Commissione, del 25 febbraio 1981, che modifica
    il regime d''importazione, istituito con decisione 80/1278/CEE del Consiglio,
    e applicato in Italia nei confronti dell''URSS in merito ai rottami di alluminio
    in lega rifusi in lingotti, con tenore di alluminio non superiore al 97% (Il testo
    in lingua italiana è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/154/EEG: Beschikking van de Commissie van 25 februari 1981 tot wijziging
    van de bij Beschikking 80/1278/EEG van de Raad vastgestelde invoerregeling welke
    in Italië ten opzichte van de Sowjetunie wordt toegepast met betrekking tot gelegeerd
    aluminium, opnieuw tot ingots verwerkt, met een aluminiumgehalte van minder dan
    97% (Slechts de tekst in de Italiaanse taal is authentiek)'
  type: main
