title:
- language: en
  script: Latn
  content: '73/56/EEC: Commission Decision of 14 March 1973 concerning the finding
    required by the second indent of Article 2 of Regulation (EEC) No 468/73 validating
    advance fixing certificates for levies, refunds and Community aid issued in the
    new Member States before 1 February 1973'
  type: main
- language: fr
  script: Latn
  content: '73/56/CEE: Décision de la Commission, du 14 mars 1973, relative à la
    constatation visée à l'' article 2 deuxième tiret du règlement (CEE) n° 468/73
    portant validation des certificats, comportant fixation à l'' avance du prélèvement,
    de la restitution ou de l'' aide communautaire, délivrés dans les nouveaux États
    membres avant le 1er février 1973'
  type: main
- language: de
  script: Latn
  content: '73/56/EWG: Entscheidung der Kommission vom 14. März 1973 betreffend die
    Feststellung im Sinne des Artikels 2 zweiter Gedankenstrich der Verordnung (EWG)
    Nr. 468/73 zur Anerkennung der Gültigkeit in den neuen Mitgliedstaaten bis zum
    1. Februar 1973 ausgestellter Bescheinigungen mit im voraus festgesetzter Abschöpfung,
    Erstattung oder Gemeinschaftsbeihilfe'
  type: main
- language: da
  script: Latn
  content: '73/56/EØF: Kommissionens Beslutning af 14. marts 1973 om den konstatering,
