    prelievo, della restituzione o dell'' integrazione comunitaria rilasciata nei
    nuovi Stati membri anteriormente al 1° febbraio 1973'
  type: main
- language: nl
  script: Latn
  content: '73/56/EEG: Beschikking van de Commissie van 14 maart 1973 betreffende
    de vaststelling bedoeld in artikel 2, tweede streepje, van Verordening (EEG) nr.
