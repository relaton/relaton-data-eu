title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/898 of 8 June 2016 concerning
    the authorisation of a preparation of Bacillus licheniformis (ATCC 53757) and
    its protease (EC 3.4.21.19) as a feed additive for chickens for fattening, chickens
    reared for laying and minor poultry species for fattening and reared for laying
    and ornamental birds (holder of authorisation Novus Europe SA/NV)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d''exécution (UE) 2016/898 de la Commission du 8 juin 2016
    concernant l''autorisation d''une préparation de Bacillus licheniformis (ATCC
    53757) et sa protéase (EC 3.4.21.19) en tant qu''additif dans l''alimentation
    des poulets d''engraissement, des poulettes élevées pour la ponte et des espèces
    aviaires mineures destinées à l''engraissement ou élevées pour la ponte et
    des oiseaux d''ornement (titulaire de l''autorisation: Novus Europe SA/NV)'
  type: main
