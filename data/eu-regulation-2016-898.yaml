    preparātu kā barības piedevu gaļas cāļiem, dējējvistām un retāk audzētu
    sugu gaļas mājputniem un dējējputniem, kā arī dekoratīvajiem putniem (atļaujas
    turētājs Novus Europe S.A./N.V.)
  type: main
