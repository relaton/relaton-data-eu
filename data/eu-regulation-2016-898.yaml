    Protease (EC 3.4.21.19) als Zusatzstoff in Futtermitteln für Masthühner und
    Junghennen sowie Geflügelarten von geringerer wirtschaftlicher Bedeutung für
    die Mast, Jungtiere von Geflügelarten von geringerer wirtschaftlicher Bedeutung
