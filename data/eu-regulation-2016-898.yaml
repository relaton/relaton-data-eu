    53757) e sua proteasi (EC 3.4.21.19) come additivo per mangimi destinati a polli
    da ingrasso, pollastre allevate per la produzione di uova, specie avicole minori
    da ingrasso e allevate per la produzione di uova e uccelli ornamentali (titolare
