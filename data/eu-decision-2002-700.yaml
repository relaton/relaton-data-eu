id: EUDecision2002700
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '2002/700/EC: Commission Decision of 20 December 2000 approving the single
    programming document for Community structural assistance in the Öarna (Islands)
    region, which covers Gotland and all inhabited islands without a permanent connection
    with the mainland along the western and eastern coast of Sweden (excluding the
    Norrland coast) and the islands in lakes Vänern, Vättern, Hjälmaren and Mälaren
    under Objective 2 in Sweden (notified under document number C(2000) 3524)'
  type: main
- language: fr
  script: Latn
  content: '2002/700/CE: Décision de la Commission, du 20 décembre 2000, portant
    approbation du document unique de programmation pour les interventions structurelles
    communautaires dans les Öarna ou région des îles comprenant l''île de Gotland,
    l''ensemble des îles habitées sans connexion directe avec le continent de la
    côte occidentale et orientale de la Suède (sauf la côte du Norrland), ainsi
    que les îles situées sur les lacs Vänern, Vättern, Hjälmaren et Mälaren,
    et relevant de l''objectif n° 2 en Suède [notifiée sous le numéro C(2000)
    3524]'
  type: main
- language: de
  script: Latn
  content: '2002/700/EG: Entscheidung der Kommission vom 20. Dezember 2000 zur Genehmigung
    des einheitlichen Programmplanungsdokuments für die Strukturinterventionen der
    Gemeinschaft in der in Schweden unter das Ziel 2 fallenden Region Öarna, bestehend
    aus der Insel Gotland, allen bewohnten Inseln vor der West- und Ostküste Schwedens
    (außer denen im Bottnischen Meerbusen) ohne direkte Verbindung zum Festland sowie
    den Inseln in den Seen Vänern, Vättern, Hjälmaren und Mälaren (Bekannt gegeben
    unter Aktenzeichen K(2000) 3524)'
  type: main
- language: da
  script: Latn
  content: '2002/700/EF: Kommissionens beslutning af 20. december 2000 om godkendelse
    af enhedsprogrammeringsdokumentet for EF-strukturinterventioner i regionen Öarna,
    der omfatter Gotland, samtlige beboede øer uden direkte forbindelse med fastlandet
    på vest- og østkysten (bortset fra Norrlandskysten) og øerne i Vänern, Vättern,
    Hjälmaren og Mälaren, og som er omfattet af mål 2 i Sverige (meddelt under
    nummer K(2000) 3524)'
  type: main
- language: el
  script: Grek
  content: '2002/700/ΕΚ: Απόφαση της Επιτροπής, της 20ής
    Δεκεμβρίου 2000, περί εγκρίσεως του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις στη νησιωτική περιφέρεια, συμπεριλαμβανομένων
    της νήσου Gotland, του συνόλου των κατοικούμενων
    νήσων χωρίς απευθείας σύνδεση με την ηπειρωτική
    χώρα της δυτικής και ανατολικής ακτής (με εξαίρεση
    την ακτή της Norrland), όπως και των νήσων στις λίμνες
    Vänern, Vättern, Hjälmaren και Mälaren, η οποία υπάγεται
    στο στόχο αριθ. 2 στη Σουηδία [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 3524]'
  type: main
- language: fi
  script: Latn
  content: '2002/700/EY: Komission päätös, tehty 20 päivänä joulukuuta 2000,
    Ruotsin tavoitteen 2 kohdealueisiin kuuluvalla Öarna-alueella, johon kuuluvat
    Gotlanti, kaikki länsi- ja itärannikon (Pohjanlahtea lukuun ottamatta) asutut
    saaret, joilla ei ole suoraa yhteyttä mantereelle, sekä Vänern-, Vättern-,
    Hjälmaren- ja Mälaren-järvillä sijaitsevat saaret, toteutettavia yhteisön
    rakenteellisia tukitoimia koskevan yhtenäisen ohjelma-asiakirjan hyväksymisestä
    (tiedoksiannettu numerolla K(2000) 3524)'
  type: main
- language: it
  script: Latn
  content: '2002/700/CE: Decisione della Commissione, del 20 dicembre 2000, recante
    approvazione del documento unico di programmazione per gli interventi strutturali
    comunitari nella regione Öarna, comprendente l''isola di Gotland, tutte le isole
    abitate senza collegamento fisso sulla costa occidentale e orientale (esclusa
    la costa del Norrland) nonché le isole dei laghi Vänern, Vättern, Hjälmaren
    e Mälaren, interessata dall''obiettivo 2 in Svezia [notificata con il numero
    C(2000) 3524]'
  type: main
- language: nl
  script: Latn
  content: '2002/700/EG: Beschikking van de Commissie van 20 december 2000 houdende
    goedkeuring van het enkelvoudig programmeringsdocument voor de structurele bijstandsverlening
    van de Gemeenschap in de Zweedse regio Öarna (Eilanden), waartoe Gotland, alle
    bewoonde eilanden zonder verbinding met het vasteland aan de Westkust en de Oostkust
    (met uitzondering van de kust van Norrland), en de eilanden in het Vänermeer,
    het Vättermeer, het Hjälmarmeer en het Mälarmeer behoren, en die onder doelstelling
    2 valt (Kennisgeving geschied onder nummer C(2000) 3524)'
  type: main
- language: pt
  script: Latn
  content: '2002/700/CE: Decisão da Comissão, de 20 de Dezembro de 2000, que aprova
    o documento único de programação para as intervenções estruturais comunitárias
    nas Öarna (região das ilhas), que incluem a ilha de Gotland, o conjunto das
    ilhas habitadas sem ligação directa com o continente da costa ocidental e oriental
    da Suécia (com excepção da costa de Norrland), bem como as ilhas situadas nos
    lagos Vänern, Vättern, Hjälmaren e Mälaren, abrangidas pelo objectivo 2 na
    Suécia [notificada com o número C(2000) 3524]'
  type: main
- language: es
  script: Latn
  content: '2002/700/CE: Decisión de la Comisión, de 20 de diciembre de 2000, por
    la que se aprueba el documento único de programación para las intervenciones
    estructurales comunitarias en la región de Öarna, integrada por Gotland, todas
    las islas deshabitadas de la costa occidental y oriental de Suecia (salvo la costa
    de Norrland) que no tienen una conexión permanente con el continente y las islas
    de Vänern, Vättern, Hjälmaren y Mälaren, y correspondiente al objetivo n°
    2 en Suecia [notificada con el número C(2000) 3524]'
  type: main
- language: sv
  script: Latn
  content: '2002/700/EG: Kommissionens beslut av den 20 december 2000 om godkännande
    av det samlade programdokumentet för gemenskapens strukturåtgärder i regionen
    Öarna, vilken inbegriper Gotland, samtliga bebodda öar utan landförbindelse
    på väst- och ostkusten (utom Norrlandskusten) samt öarna i Vänern, Vättern,
    Hjälmaren och Mälaren, och som omfattas av mål 2 i Sverige [delgivet med nr
    K(2000) 3524]'
