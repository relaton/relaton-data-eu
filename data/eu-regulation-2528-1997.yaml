    viinivuodelle 1997/98 pöytäviinin, rypälemehun, tiivistetyn rypälemehun ja
    puhdistetun tiivistetyn rypälemehun osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2528/97 della Commissione del 16 dicembre 1997 che
