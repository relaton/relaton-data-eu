    der Möglichkeit des Abschlusses von Verträgen für die langfristige private
    Lagerhaltung von Tafelwein, Traubenmost, konzentriertem Traubenmost und konzentriertem
    rektifizierten Traubenmost für das Wirtschaftsjahr 1997/98
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2528/97 af 16. december 1997 om adgang
    til indgåelse af langfristede kontrakter om privat oplagring af bordvin, druemost
    og rektificeret koncentreret druemost for produktionsåret 1997/98
  type: main
- language: el
  script: Grek
