title:
- language: en
  script: Latn
  content: '85/399/EEC: Commission Decision of 8 July 1985 authorizing the Kingdom
    of Denmark to apply intra- Community surveillance to imports of tomatoes originating
    in Spain which have been put into free circulation in the other Member States
    (Only the Danish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '85/399/CEE: Décision de la Commission du 8 juillet 1985 autorisant le
    Royaume du Danemark à instaurer une surveillance intracommunautaire des importations
    de tomates originaires d''Espagne et mises en libre pratique dans les autres États
    membres (Le texte en langue danoise est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '85/399/EWG: Entscheidung der Kommission vom 8. Juli 1985, mit der das
    Königreich Dänemark zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus Spanien stammenden und in den übrigen Mitgliedstaaten im
    freien Verkehr befindlichen Tomaten ermächtigt wird (Nur der dänische Text ist
    verbindlich)'
  type: main
- language: da
  script: Latn
  content: '85/399/EØF: Kommissionens beslutning af 8. juli 1985 om bemyndigelse
    af kongeriget Danmark til at indføre tilsyn inden for Fællesskabet med indførslen
    af tomater, der har oprindelse i Spanien og er overgået til fri omsætning i
    de øvrige medlemsstater (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '85/399/ΕΟΚ: Απόφαση της Επιτροπής της 8ης Ιουλίου
    1985 για τη χορήγηση άδειας στο Βασίλειο της
    Δανίας να εφαρμόσει κοινοτική επίβλεψη των
    εισαγωγών τομάτας, καταγωγής Ισπανίας, που
    τίθεται σε ελεύθερη κυκλοφορία στα άλλα κράτη
    μέλη (Το κείμενο στην δανική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '85/399/CEE: Decisione della Commissione dell''8 luglio 1985 che autorizza
    il Regno di Danimarca ad istituire una sorveglianza intracomunitaria delle importazioni
    di pomodori originari della Spagna e messi in libera pratica negli altri stati
    membri (Il testo in lingua danese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '85/399/EEG: Beschikking van de Commissie van 8 juli 1985 houdende machtiging
    van het Koninkrijk Denemarken tot instelling van een intracommunautair toezicht
    ten aanzien van de invoer van tomaten van oorsprong uit Spanje, die in de andere
    Lid-Staten in het vrije verkeer zijn gebracht (Slechts de tekst in de Deense taal
    is authentiek)'
  type: main
