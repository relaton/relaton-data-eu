    der Interventionspreise für Butter, Magermilchpulver und die Käsesorten Grana
    Padano und Parmigiano Reggiano für zwei Jahreszeiträume vom 1. Juli 1993 bis
    30. Juni 1995
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EØF) Nr. 1561/93 af 14. juni 1993 om ændring af forordning
    (EØF) nr. 2072/92 om fastsættelse af indikativprisen for mælk og interventionspriserne
    for smør, skummetmælkspulver samt ostesorterne grana padano og parmigiano reggiano
    for to årsperioder fra 1. juli 1993 til 30. juni 1995
  type: main
- language: el
  script: Grek
