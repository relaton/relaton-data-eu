    1993 al 30 giugno 1995, il prezzo indicativo del latte e i prezzi d' intervento
    del burro, del latte scremato in polvere e dei formaggi grana padano e parmigiano
    reggiano
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 1561/93 VAN DE RAAD van 14 juni 1993 tot wijziging
