  content: COUNCIL REGULATION (EEC) No 1561/93 of 14 June 1993 amending Regulation
    (EEC) No 2072/92 fixing the target price for milk and the invervention prices
    for butter, skimmed-milk powder and Grana Padano and Parmigiano Reggiano cheeses
    for two annual periods from 1 July 1993 to 30 June 1995
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1561/93 du Conseil du 14 juin 1993 modifiant le règlement
    (CEE) n° 2072/92 fixant le prix indicatif du lait et les prix d'intervention
    du beurre, du lait écrémé en poudre et des fromages grana padano et parmigiano
    reggiano pour deux périodes annuelles allant du 1er juillet 1993 au 30 juin 1995
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1561/93 DES RATES vom 14. Juni 1993 zur Änderung
