    openbare inschrijving voor de verkoop op de interne markt van maïs uit Franse
    interventievoorraden betrekking heeft, tot 400 000 ton te verhogen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 760/1999 da Comissão, de 13 de Abril de 1999, que
