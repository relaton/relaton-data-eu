title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 760/1999 of 13 April 1999 amending Regulation
    (EC) No 575/1999 increasing to 400 000 tonnes the quantity of maize held by the
    French intervention agency for which a standing invitation to tender for the sale
    on the internal market has been opened
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 760/1999 de la Commission, du 13 avril 1999, modifiant
    le règlement (CE) n° 575/1999 et portant à 400 000 tonnes l'adjudication permanente
    pour la revente sur le marché intérieur de maïs détenu par l'organisme d'intervention
    français
  type: main
- language: de
  script: Latn
