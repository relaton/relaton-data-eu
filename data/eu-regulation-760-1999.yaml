    (ΕΚ) αριθ. 575/1999 και για έναρξη διαρκούς δημοπρασίας
    για τη μεταπώληση στην εσωτερική αγορά 400 000
    τόνων αραβοσίτου που έχει στη διάθεσή του ο
    γαλλικός οργανισμός παρεμβάσεως
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 760/1999, annettu 13 päivänä huhtikuuta 1999,
    asetuksen (EY) N:o 575/1999 muuttamisesta ja Ranskan interventioelimen hallussaan
