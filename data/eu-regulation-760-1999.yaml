    der Verordnung (EG) Nr. 575/1999 und zur Erhöhung der Dauerausschreibung für
    den Wiederverkauf auf dem Binnenmarkt von im Besitz der französischen Interventionsstelle
    befindlichem Mais auf 400 000 Tonnen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 760/1999 af 13. april 1999 om ændring
    af forordning (EF) nr. 575/1999 og om forhøjelse til 400 000 tons af den løbende
    licitation med henblik på videresalg på det interne marked af majs, som det
    franske interventionsorgan ligger inde med
  type: main
- language: el
  script: Grek
