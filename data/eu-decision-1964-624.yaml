  content: Décision 64/624/CEE de la Commission, du 26 octobre 1964, portant modification
    de sa décision du 16 avril 1964 autorisant la République italienne à adopter
    des mesures de sauvegarde pour certains produits dérivés du plomb et du zinc
  type: main
- language: de
  script: Latn
  content: '64/624/EWG: Entscheidung der Kommission vom 26. Oktober 1964 zur Änderung
    der Entscheidung vom 16. April 1964, durch die die Italienische Republik ermächtigt
    wurde, Schutzmaßnahmen für einige Blei- und Zinkerzeugnisse zu erlassen'
  type: main
- language: it
  script: Latn
  content: '64/624/CEE: Decisione della Commissione, del 26 ottobre 1964, che modifica
    la propria decisione del 16 aprile 1964, che autorizza la Repubblica italiana
    ad adottare misure di salvaguardia per alcuni derivati del piombo e dello zinco'
  type: main
- language: nl
  script: Latn
  content: '64/624/EEG: Beschikking van de Commissie van 26 oktober 1964 tot wijziging
    van haar beschikking van 16 april 1964 waarbij de Italiaanse Republiek wordt gemachtigd
    vrijwaringsmaatregelen te nemen ten behoeve van enige lood- en zinkprodukten'
