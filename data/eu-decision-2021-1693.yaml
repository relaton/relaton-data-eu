    Verbreitung von Kleinwaffen und leichten Waffen (SALW) und dazugehöriger Munition
    sowie des unerlaubten Handels damit und ihrer Auswirkungen in Lateinamerika und
    der Karibik im Rahmen der EU-Strategie gegen unerlaubte Feuerwaffen, Kleinwaffen
    und leichte Waffen und dazugehörige Munition „Waffen sicherstellen, Menschen
    schützen“ („Securing Arms, Protecting Citizens“)
  type: main
