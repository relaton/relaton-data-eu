title:
- language: en
  script: Latn
  content: Council Decision (CFSP) 2021/1693 of 21 September 2021 amending Decision
    (CFSP) 2018/2010 in support of countering illicit proliferation and trafficking
    of small arms, light weapons (SALW) and ammunition and their impact in Latin America
    and the Caribbean in the framework of the EU Strategy against Illicit Firearms,
    Small Arms & Light Weapons and their Ammunition ‘Securing Arms, Protecting Citizens’
  type: main
- language: fr
  script: Latn
  content: Décision (PESC) 2021/1693 du Conseil du 21 septembre 2021 modifiant la
    décision (PESC) 2018/2010 à l’appui de la lutte contre la prolifération illicite
    et le trafic d’armes légères et de petit calibre (ALPC) et de leurs munitions
    ainsi que contre leurs incidences en Amérique latine et dans les Caraïbes dans
    le cadre de la stratégie de l’UE contre les armes à feu et armes légères
    et de petit calibre illicites et leurs munitions — «Sécuriser les armes, protéger
    les citoyens»
  type: main
- language: de
  script: Latn
  content: Beschluss (GASP) 2021/1693 des Rates vom 21. September 2021 zur Änderung
