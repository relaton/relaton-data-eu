    a traficului ilicit de arme de calibru mic, de armament ușor (SALW) și de muniție
    și a impactului acestora în America Latină și în zona Caraibilor în contextul
    Strategiei UE împotriva armelor de foc, armelor de calibru mic și armamentului
    ușor ilicite și a muniției aferente „Asigurarea securității armelor, protejarea
