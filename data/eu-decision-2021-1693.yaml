  script: Latn
  content: Decisione (PESC) 2021/1693 del Consiglio del 21 settembre 2021 che modifica
    la decisione (PESC) 2018/2010 a sostegno della lotta contro la proliferazione
    e il traffico illeciti di armi leggere e di piccolo calibro (SALW) e relative
    munizioni e il relativo impatto in America latina e nei Caraibi nel quadro della
    strategia dell'Unione europea contro le armi da fuoco, armi leggere e di piccolo
    calibro illegali e relative munizioni «Mettere in sicurezza le armi, proteggere
    i cittadini»
  type: main
