    e contra o seu impacto na América Latina e nas Caraíbas, no âmbito da Estratégia
    da UE contra as armas de fogo, armas ligeiras e de pequeno calibre e respetivas
    munições «Aumentar as condições de segurança das armas, proteger os cidadãos»
  type: main
