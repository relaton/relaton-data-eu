title:
- language: en
  script: Latn
  content: Regulation (EEC) No 59/74 of the Commission of 9 January 1974 supplementing
    Regulations (EEC) No 2637/70 and (EEC) No 2645/70 in particular by the insertion
    of an additional condition necessary for the issue of an export licence for sugar
    produced in excess of the maximum quota
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 59/74 de la Commission, du 9 janvier 1974, complétant
    les règlements (CEE) n° 2637/70 et (CEE) n° 2645/70 notamment par l' insertion
    d' une condition supplémentaire nécessaire à la délivrance d' un certificat
    d' exportation pour le sucre produit au-delà du quota maximum
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 59/74 der Kommission vom 9. Januar 1974 zur Ergänzung
    der Verordnungen (EWG) Nr. 2637/70 und (EWG) Nr. 2645/70 insbesondere durch die
    Einführung einer notwendigen zusätzlichen Bedingung für die Erteilung einer
    Ausfuhrlizenz für Zucker, der über die Höchstquote hinaus erzeugt wurde
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 59/74 af 9. januar 1974 om tillæg
    til forordning (EØF) nr. 2637/70 og til forordning (EØF) nr. 2645/70, især
    ved indføjelse af en yderligere betingelse, som er nødvendig ved udstedelsen
    af eksportlicenser for den del af sukkerproduktionen, der overstiger maksimalkvoten
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 59/74 τής Επιτροπής
    τής 9ης Ιανουαρίου 1974 περί συμπληρώσεως τών
    κανονισμών (ΕΟΚ) αριθ. 2637/70 καί (ΕΟΚ) αριθ. 2645/70
    ιδίως μέ τήν παρεμβολή ενός συμπληρωματικού
    όρου αναγκαίου γιά τή χορήγηση ενός πιστοποιητικού
    εξαγωγής γιά ζάχαρη παραχθείσα πέραν τού ανωτάτου
    ποσοστού
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 59/74 della Commissione, del 9 gennaio 1974, che completa
    i regolamenti (CEE) n. 2637/70 e (CEE) n. 2645/70, in particolare mediante l'
    inserzione di una condizione supplementare necessaria per il rilascio di un titolo
    di esportazione per lo zucchero prodotto in eccedenza della quota massima
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 59/74 van de Commissie van 9 januari 1974 tot aanvulling
    van de Verordeningen (EEG) nr. 2637/70 en (EEG) nr. 2645/70 met name door toevoeging
    van een bijzondere voorwaarde welke noodzakelijk is voor de afgifte van een uitvoercertificaat
    voor suiker welke boven het maximumquotum is geproduceerd
  type: main
