  content: Commission Regulation (EEC) No 1236/82 of 19 May 1982 amending for the
    second time Regulation (EEC) No 2657/80 on the determination of prices of fresh
    or chilled sheep carcases on representative Community markets and the survey of
    prices of certain other qualities of sheep carcases in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1236/82 de la Commission, du 19 mai 1982, portant
    deuxième modification du règlement (CEE) n° 2657/80 relatif à la détermination
    des prix des carcasses d' ovins fraîches ou réfrigérées constatés sur les
    marchés représentatifs de la Communauté et au relevé des prix de certaines
    autres qualités de carcasses d' ovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1236/82 der Kommission vom 19. Mai 1982 zur zweiten
    Änderung der Verordnung (EWG) Nr. 2657/80 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für frische oder gekühlte Tierkörper
    von Schafen und zur Ermittlung der Preise einiger anderer Qualitäten von Tierkörpern
    von Schafen in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1236/82 af 19. maj 1982 om anden ændring
    af forordning (EØF) nr. 2657/80 om bestemmelse af priserne for ferske eller kølede
    fårekroppe, der konstateres på Fællesskabets repræsentative markeder, og om
    registrering af priserne for visse andre fårekroppekvaliteter i Fællesskabet
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1236/82 τής Επιτροπής
    τής 19ης Μαΐου 1982 περί δευτέρας τροποποιήσεως
    τού κανονισμού (EOK) αριθ. 2657/80 περί καθορισμού
    τών τιμών τών νωπών ή διατηρημένων δι απλής
    ψύξεως ολοκλήρων σφαγίων προβάτων πού διαπιστώνονται
    στίς αντιπροσωπευτικές αγορές τής Κοινότητος
    καί περί τού πίνακα τών τιμών ορισμένων άλλων
    ποιοτήτων ολοκλήρων σφαγίων προβάτων εντός
    τής Κοινότητος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1236/82 della Commissione, del 19 maggio 1982, recante
    seconda modifica del regolamento (CEE) n. 2657/80 relativo alla determinazione
    dei prezzi delle carcasse ovine, fresche o refrigerate, constatati sui mercati
    rappresentativi della Comunità e al rilevamento dei prezzi di talune altre qualità
    di carcasse ovine nella Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1236/82 van de Commissie van 19 mei 1982 houdende
    tweede wijziging van Verordening (EEG) nr. 2657/80 betreffende de vaststelling
    van de op de representatieve markten van de Gemeenschap geconstateerde prijzen
    voor geslachte schapen, vers of gekoeld, en betreffende de constatering van de
    prijzen voor sommige andere kwaliteiten geslachte schapen in de Gemeenschap
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1236/82 da Comissão, de 19 de Maio de 1982, que
