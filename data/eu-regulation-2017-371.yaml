  script: Latn
  content: Regulation (EU) 2017/371 of the European Parliament and of the Council
    of 1 March 2017 amending Council Regulation (EC) No 539/2001 listing the third
    countries whose nationals must be in possession of visas when crossing the external
    borders and those whose nationals are exempt from that requirement (revision of
    the suspension mechanism)
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) 2017/371 du Parlement européen et du Conseil du 1er mars
    2017 modifiant le règlement (CE) n° 539/2001 du Conseil fixant la liste des
    pays tiers dont les ressortissants sont soumis à l’obligation de visa pour
    franchir les frontières extérieures des États membres et la liste de ceux dont
    les ressortissants sont exemptés de cette obligation (révision du mécanisme
    de suspension)
