title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1903/76 of 30 July 1976 fixing the amount
    by which the variable component of the levy applicable to bran and sharps originating
    in Algeria, Morocco and Tunisia must be reduced
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1903/76 de la Commission, du 30 juillet 1976, fixant
    le montant dont doit être diminué l' élément mobile du prélèvement applicable
    aux sons et remoulages originaires d' Algérie, du Maroc et de Tunisie
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1903/76 der Kommission vom 30. Juli 1976 zur Festsetzung
    des Betrages, um den der bewegliche Teilbetrag der Abschöpfung auf Kleie mit
    Ursprung in Algerien, Marokko und Tunesien vermindert wird
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1903/76 af 30. juli 1976 om fastsættelse
    af det beløb, hvormed det variable element i importafgiften for klid, med oprindelse
    i Algeriet, Marokko og Tunesien, skal nedsættes
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1903/76 della Commissione, del 30 luglio 1976, che
    fissa l' importo di cui deve essere diminuito l' elemento mobile del prelievo
    applicabile alle crusche e stacciature originarie dell' Algeria, del Marocco e
    della Tunisia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1903/76 van de Commissie van 30 juli 1976 tot vaststelling
    van het bedrag waarmee het variabele element moet worden verminderd van de heffing
    die van toepassing is op zemelen en slijpsel van oorsprong uit Algerije, Marokko
    en Tunesië
