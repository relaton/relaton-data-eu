title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2875/79 of 19 December 1979 re-establishing
    the levying of customs duties on filament lamps for lighting, falling within subheading
    85.20 A and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2875/79 de la Commission, du 19 décembre 1979, portant
    rétablissement de la perception des droits de douane applicables aux lampes et
    tubes à incandescence pour l' éclairage de la sous-position 85.20 A du tarif
    douanier commun, originaires de la Yougoslavie bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2875/79 der Kommission vom 19. Dezember 1979 zur Wiedereinführung
    des Zollsatzes für Glühlampen für elektrische Beleuchtung der Tarifstelle 85.20
    A, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 3156/78 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2875/79 af 19. december 1979 om genindførelse
    af opkrævning af toldafgifter for glødelamper til belysning under underposition
    85.20 A, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2875/79 della Commissione, del 19 dicembre 1979, che
    ripristina la riscossione dei dazi doganali applicabili a lampade e tubi a incandescenza
    per l' illuminazione, della sottovoce 85.20 A della tariffa doganale comune, originari
    della Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2875/79 van de Commissie van 19 december 1979 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op elektrische
    gloeilampen en -buizen voor verlichtingsdoeleinden van post 85.20 A van oorsprong
    uit Joegoslavië ten behoeve waarvan bij Verordening (EEG) nr. 3156/78 van de
    Raad algemene tariefpreferenties werden geopend
  type: main
