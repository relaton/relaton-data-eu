  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1264 of 27 June 2025 supplementing
    Regulation (EU) 2023/1114 of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the minimum contents of the liquidity
    management policy and procedures for certain issuers of asset-referenced tokens
    and e-money tokens
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1264 de la Commission du 27 juin 2025 complétant
