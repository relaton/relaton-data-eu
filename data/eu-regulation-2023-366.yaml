    wykonawcze (UE) 2015/1020, rozporządzenie wykonawcze (UE) 2017/2276 oraz uchylające
    rozporządzenie (UE) nr 107/2010 i rozporządzenie wykonawcze (UE) nr 885/2011
    (posiadacz zezwolenia Kemin Europa N.V.)
