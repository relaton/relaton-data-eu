  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2023/366 della Commissione del 16 febbraio
    2023 relativo al rinnovo dell’autorizzazione di un preparato di Bacillus velezensis
    ATCC PTA-6737 come additivo per mangimi destinati a polli da ingrasso, pollastre
    allevate per la produzione di uova e specie avicole minori, tranne che per la
    produzione di uova, e all’autorizzazione di tale preparato per gli uccelli ornamentali,
    che modifica il regolamento di esecuzione (UE) n. 306/2013, il regolamento di
    esecuzione (UE) n. 787/2013, il regolamento di esecuzione (UE) 2015/1020, il regolamento
    di esecuzione (UE) 2017/2276 e abroga il regolamento (UE) n. 107/2010 e il regolamento
    di esecuzione (UE) n. 885/2011 (titolare dell’autorizzazione Kemin Europa N.V.)
  type: main
- language: lv
  script: Latn
  content: 'Komisijas Īstenošanas regula (ES) 2023/366 (2023. gada 16. februāris),
    ar ko atjauno atļauju preparātu Bacillus velezensis ATCC PTA-6737 lietot par
    barības piedevu gaļas cāļiem, dējējvistu cāļiem un mazāk izplatītām
    putnu sugām, izņemot dējējputnus, lietot šo preparātu par barības piedevu
    dekoratīvajiem putniem un groza Īstenošanas regulu (ES) Nr. 306/2013, Īstenošanas
    regulu (ES) Nr. 787/2013, Īstenošanas regulu (ES) 2015/1020, Īstenošanas regulu
    (ES) 2017/2276 un atceļ Regulu (ES) Nr. 107/2010 un Īstenošanas regulu (ES)
    Nr. 885/2011 (atļaujas turētājs: uzņēmums Kemin Europa N.V.)'
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo reglamentas (ES) 2023/366 2023 m. vasario 16 d.
    dėl leidimo naudoti Bacillus velezensis ATCC PTA-6737 preparatą kaip mėsinių
    viščiukų, dedeklinių vištaičių ir retesnių rūšių naminių paukščių,
    išskyrus dedeklinius paukščius, lesalų priedą atnaujinimo ir dėl leidimo
    jį naudoti kaip dekoratyvinių paukščių lesalų priedą suteikimo, kuriuo
    iš dalies keičiamas Įgyvendinimo reglamentas (ES) Nr. 306/2013, Įgyvendinimo
    reglamentas (ES) Nr. 787/2013, Įgyvendinimo reglamentas (ES) 2015/1020, Įgyvendinimo
    reglamentas (ES) 2017/2276 ir panaikinamas Reglamentas (ES) Nr. 107/2010 ir Įgyvendinimo
    reglamentas (ES) Nr. 885/2011 (leidimo turėtoja – bendrovė „Kemin Europa
    N.V.“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/366 tas-16
    ta’ Frar 2023 dwar it-tiġdid tal-awtorizzazzjoni ta’ preparazzjoni ta’
    Bacillus velezensis ATCC PTA-6737 bħala addittiv tal-għalf għat-tiġieġ tas-simna,
    għat-tiġieġ imrobbija għall-bajd u għal speċijiet minuri ta’ tjur għajr
