    (EU) br. 107/2010 i Provedbene uredbe (EU) br. 885/2011 (nositelj odobrenja Kemin
    Europa N.V.)
  type: main
- language: hu
  script: Latn
  content: 'A Bizottság (EU) 2023/366 végrehajtási rendelete (2023. február 16.)
