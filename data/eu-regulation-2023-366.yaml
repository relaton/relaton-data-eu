    787/2013, Uitvoeringsverordening (EU) 2015/1020 en Uitvoeringsverordening (EU)
    2017/2276 en tot intrekking van Verordening (EU) nr. 107/2010 en Uitvoeringsverordening
    (EU) nr. 885/2011 (vergunninghouder Kemin Europa N.V.)
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2023/366 z dnia 16 lutego 2023
    r. dotyczące odnowienia zezwolenia na stosowanie preparatu Bacillus velezensis
    ATCC PTA-6737 jako dodatku paszowego dla kurcząt rzeźnych, kurcząt odchowywanych
