type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2023/366 of 16 February 2023 concerning
    the renewal of the authorisation of a preparation of Bacillus velezensis ATCC
    PTA-6737 as a feed additive for chickens for fattening, chickens reared for laying
    and minor poultry species except for laying purposes, its authorisation for ornamental
    birds, amending Implementing Regulation (EU) No 306/2013, Implementing Regulation
    (EU) No 787/2013, Implementing Regulation (EU) 2015/1020, Implementing Regulation
    (EU) 2017/2276 and repealing Regulation (EU) No 107/2010 and Implementing Regulation
    (EU) No 885/2011 (holder of authorisation Kemin Europa N.V.)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2023/366 de la Commission du 16 février
    2023 concernant le renouvellement de l’autorisation d’une préparation de
    Bacillus velezensis ATCC PTA-6737 en tant qu’additif dans l’alimentation des
    poulets d’engraissement, des poulettes élevées pour la ponte et des espèces
    mineures de volailles à l’exception de celles destinées à la ponte, son autorisation
    pour les oiseaux d’ornement, modifiant le règlement d’exécution (UE) no
    306/2013, le règlement d’exécution (UE) no 787/2013, le règlement d’exécution
    (UE) 2015/1020 et le règlement d’exécution (UE) 2017/2276, et abrogeant le
    règlement (UE) no 107/2010 et le règlement d’exécution (UE) no 885/2011 (titulaire
    de l’autorisation: Kemin Europa N.V.)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2023/366 der Kommission vom 16. Februar
    2023 zur Verlängerung der Zulassung einer Zubereitung aus Bacillus velezensis
    ATCC PTA-6737 als Futtermittelzusatzstoff für Masthühner, Junghennen und Geflügelarten
    von geringerer wirtschaftlicher Bedeutung außer für Legezwecke, zu ihrer Zulassung
    für Ziervögel, zur Änderung der Durchführungsverordnungen (EU) Nr. 306/2013,
    (EU) Nr. 787/2013, (EU) 2015/1020 und (EU) 2017/2276 sowie zur Aufhebung der Verordnung
    (EU) Nr. 107/2010 und der Durchführungsverordnung (EU) Nr. 885/2011 (Zulassungsinhaber:
    Kemin Europa N.V.)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2023/366 на Комисията
    от 16 февруари 2023 година за подновяване на разрешението
    за употреба на препарат от Bacillus velezensis ATCC PTA-6737
    като фуражна добавка за пилета за угояване,
    пилета, отглеждани за носачки, и видове домашни
    птици с по-малко стопанско значение, с изключение
    на носачки, за разрешаване на употребата му
    за декоративни птици, за изменение на Регламент
    за изпълнение (ЕС) № 306/2013, Регламент за изпълнение
    (ЕС) № 787/2013, Регламент за изпълнение (ЕС) 2015/1020,
    Регламент за изпълнение (ЕС) 2017/2276 и за отмяна
    на Регламент (ЕС) № 107/2010 и Регламент за изпълнение
    (ЕС) № 885/2011 (притежател на разрешението Kemin
    Europa N.V.)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2023/366 ze dne 16. února 2023 o
    obnovení povolení přípravku Bacillus velezensis ATCC PTA-6737 jako doplňkové
    látky pro výkrm kuřat, odchov kuřic a menšinové druhy drůbeže kromě menšinových
    druhů drůbeže určených ke snášce, o jeho povolení pro okrasné ptactvo,
    o změně prováděcího nařízení (EU) č. 306/2013, prováděcího nařízení
    (EU) č. 787/2013, prováděcího nařízení (EU) 2015/1020, prováděcího nařízení
    (EU) 2017/2276 a o zrušení nařízení (EU) č. 107/2010 a prováděcího nařízení
    (EU) č. 885/2011 (držitel povolení Kemin Europa N.V.)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2023/366 af 16. februar 2023
    om forlængelse af godkendelsen af et præparat af Bacillus velezensis ATCC PTA-6737
    som tilsætningsstof til foder til slagtekyllinger, hønniker og mindre udbredte
    fjerkræarter ikke bestemt til æglægning, om dets godkendelse til prydfugle,
    om ændring af gennemførelsesforordning (EU) nr. 306/2013, gennemførelsesforordning
    (EU) nr. 787/2013, gennemførelsesforordning (EU) 2015/1020 og gennemførelsesforordning
    (EU) 2017/2276 og om ophævelse af forordning (EU) nr. 107/2010 og gennemførelsesforordning
    (EU) nr. 885/2011 (indehaver af godkendelsen er Kemin Europa N.V.)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2023/366 της Επιτροπής
    της 16ης Φεβρουαρίου 2023 για την ανανέωση της
    έγκρισης παρασκευάσματος του Bacillus velezensis ATCC
    PTA-6737 ως πρόσθετης ύλης ζωοτροφών για κοτόπουλα
    προς πάχυνση, κοτόπουλα εκτρεφόμενα για ωοπαραγωγή
    και μικρά είδη πουλερικών εκτός εάν προορίζονται
    για ωοπαραγωγή, την έγκρισή του για διακοσμητικά
    πτηνά, την τροποποίηση του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 306/2013, του εκτελεστικού κανονισμού
    (ΕΕ) 2015/1020, του εκτελεστικού κανονισμού (ΕΕ)
    2017/2276, του εκτελεστικού κανονισμού (ΕΕ) αριθ.
    787/2013 και για την κατάργηση του κανονισμού (ΕΕ)
    αριθ. 107/2010 και του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 885/2011 (κάτοχος της άδειας: Kemin Europa NV)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2023/366, 16. veebruar 2023, millega pikendatakse
    luba Bacillus velezensis’e (ATCC PTA-6737) preparaadi kasutamiseks broilerite,
    noorkanade ja vähemlevinud kodulinnuliikide, välja arvatud munalindude söödalisandina
    ja antakse luba kasutada preparaati dekoratiivlindude puhul, ning millega muudetakse
    rakendusmäärust (EL) nr 306/2013, rakendusmäärust (EL) nr 787/2013, rakendusmäärust
    (EL) 2015/1020, rakendusmäärust (EL) 2017/2276 ning tunnistatakse kehtetuks
    määrus (EL) nr 107/2010 ja rakendusmäärus (EL) nr 885/2011 (loa hoidja Kemin
    Europa N.V.)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2023/366, annettu 16 päivänä
    helmikuuta 2023, Bacillus velezensis ATCC PTA-6737 -valmisteen hyväksynnän uusimisesta
    broilerien, kananuorikoiden ja muiden kuin munantuotantoon tarkoitettujen toissijaisten
    siipikarjalajien rehun lisäaineena, sen hyväksymisestä koristetarkoituksessa
    pidettävien lintujen rehun lisäaineena, täytäntöönpanoasetuksen (EU) N:o
    306/2013, täytäntöönpanoasetuksen (EU) N:o 787/2013, täytäntöönpanoasetuksen
    (EU) 2015/1020 ja täytäntöönpanoasetuksen (EU) 2017/2276 muuttamisesta sekä
    asetuksen (EU) N:o 107/2010 ja täytäntöönpanoasetuksen (EU) N:o 885/2011 kumoamisesta
    (hyväksynnän haltija Kemin Europa NV)
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2023/366 ón gCoimisiún an 16 Feabhra
    2023 maidir le húdarú ullmhóide Bacillus velezensis ATCC PTA-6737 mar bhreiseán
    beathaithe a athnuachan le haghaidh sicíní lena ramhrú, sicíní a thógtar
    le bheith ina mbéaróga agus mionspeicis éanlaithe clóis seachas mionspeicis
    éanlaithe clóis le haghaidh breithe, maidir lena húdarú le haghaidh éin ornáideacha,
    lena leasaítear Rialachán Cur Chun Feidhme (AE) Uimh. 306/2013, Rialachán Cur
    Chun Feidhme (AE) Uimh. 787/2013, Rialachán Cur Chun Feidhme (AE) 2015/1020,
    Rialachán Cur Chun Feidhme (AE) 2017/2276 agus lena n-aisghairtear Rialachán
    (AE) Uimh. 107/2010 agus Rialachán Cur Chun Feidhme (AE) Uimh. 885/2011 (sealbhóir
    an údaraithe Kemin Europa N.V.)
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2023/366 оd 16. veljače 2023. o produljenju
    odobrenja pripravka od Bacillus velezensis ATCC PTA-6737 kao dodatka hrani za
    piliće za tov, piliće uzgajane za nesenje i manje zastupljene vrste peradi osim
