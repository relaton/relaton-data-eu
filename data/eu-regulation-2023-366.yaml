    ir-Regolament (UE) Nru 107/2010 u r-Regolament ta’ Implimentazzjoni (UE) Nru
    885/2011 (id-detentur tal-awtorizzazzjoni Kemin Europa N.V.)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2023/366 van de Commissie van 16 februari 2023
    tot verlenging van de vergunning voor een preparaat van Bacillus velezensis ATCC
    PTA-6737 als toevoegingsmiddel voor diervoeding voor mestkippen, opfokleghennen
    en minder gangbare pluimveesoorten met uitzondering van die voor legdoeleinden,
