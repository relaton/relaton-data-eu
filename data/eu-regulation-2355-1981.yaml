    μολύβδου τής δασμολογικής διακρίσεως 32. 08 ex
    B καταγωγής Μεξικού δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου
    δασμο λογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2355/81 della Commissione, del 14 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai borosilicati di piombo,
    della sottovoce 32.08 ex B della tariffa doganale comune, originari del Messico
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2355/81 van de Commissie van 14 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op loodborosilicaten
    van postonderverdeling 32.08 ex B van oorsprong uit Mexico, waarvoor de in Verordening
    (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn verleend
