title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2355/81 of 14 August 1981 re-establishing
    the levying of customs duties on lead borosilicates, falling within subheading
    32.08 ex B and originating in Mexico, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2355/81 de la Commission, du 14 août 1981, portant
    rétablissement de la perception des droits de douane applicables aux borosilicates
    de plomb, de la sous-position 32.08 ex B du tarif douanier commun, originaires
    du Mexique, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2355/81 der Kommission vom 14. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für Bleiborosicate der Tarifstelle 32.08 ex B mit Ursprung
    in Mexiko, dem die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2355/81 af 14. august 1981 om genindførelse
    af opkrævning af told for blyborosilicat henhørende under pos. 32.08 ex B og
    med oprindelse i Mexico, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2355/81 τής Επιτροπής
    τής 14ης Αυγούστου 1981 περί αποκαταστάσεως τής
