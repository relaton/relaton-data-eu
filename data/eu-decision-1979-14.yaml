title:
- language: en
  script: Latn
  content: '79/14/EEC: Commission Decision of 28 November 1978 authorizing the Italian
    Republic not to apply Community treatment to receivers, whether or not combined
    with a sound recorder or reproducer, falling within subheading ex 85.15 A III
    of the Common Customs Tariff, originating in Japan and in free circulation in
    the other Member States'
  type: main
- language: fr
  script: Latn
  content: '79/14/CEE: Décision de la Commission, du 28 novembre 1978, autorisant
    la République italienne à exclure du traitement communautaire les appareils
    récepteurs de radio même combinés avec un appareil d'' enregistrement ou de
    reproduction du son de la sous-position ex 85.15 A III du tarif douanier commun,
    originaires du Japon et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '79/14/EWG: Entscheidung der Kommission vom 28. November 1978, mit der
    die Italienische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte, auch mit Tonaufnahme-
    oder Tonwiedergabegeräten kombiniert, der Tarifstelle ex 85.15 A III des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '79/14/EØF: Kommissionens beslutning af 28. november 1978 om bemyndigelse
    af Den italienske Republik til fra fællesskabsbehandling at undtage modtagere,
    også kombineret med lydoptagere eller lydgengivere, som henhører under pos.
    ex 85.15 A III i den fælles toldtarif, har oprindelse i Japan og frit kan omsættes
    i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '79/14/CEE: Decisione della Commissione, del 28 novembre 1978, che autorizza
    la Repubblica italiana ad escludere dal trattamento comunitario gli apparecchi
    radio riceventi anche combinati con un apparecchio di registrazione o di riproduzione
    del suono, della sottovoce ex 85.15 A III della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '79/14/EEG: Beschikking van de Commissie van 28 november 1978 waarbij de
    Italiaanse Republiek wordt gemachtigd ontvangtoestellen, ook indien met ingebouwd
    toestel voor het opnemen of voor het weergeven van geluid, van post ex 85.15 A
    III van het gemeenschappelijk douanetarief, van oorsprong uit Japan en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten'
  type: main
