---
id: EUDecision2012332
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2012/332/CFSP of 25 June 2012 amending and extending Joint
    Action 2005/889/CFSP on establishing a European Union Border Assistance Mission
    for the Rafah Crossing Point (EU BAM Rafah)
  type: main
- language: fr
  script: Latn
  content: Décision 2012/332/PESC du Conseil du 25 juin 2012 modifiant et prorogeant
    l’action commune 2005/889/PESC établissant une mission de l’Union européenne
    d’assistance à la frontière au point de passage de Rafah (EU BAM Rafah)
  type: main
- language: de
  script: Latn
  content: Beschluss 2012/332/GASP des Rates vom 25. Juni 2012 zur Änderung und Verlängerung
    der Gemeinsamen Aktion 2005/889/GASP zur Einrichtung einer Mission der Europäischen
    Union zur Unterstützung des Grenzschutzes am Grenzübergang Rafah (EU BAM Rafah)
  type: main
- language: bg
  script: Cyrl
  content: Решение 2012/332/ОВППС на Съвета от 25 юни 2012
    година за изменение и удължаване на срока на
    действие на Съвместно действие 2005/889/ОВППС
    за създаване на мисия на Европейския съюз за
    подпомагане на контролно-пропускателен пункт
    Рафа (EU BAM Rafah)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2012/332/SZBP ze dne 25. června 2012 , kterým se mění
    a prodlužuje společná akce 2005/889/SZBP o zřízení mise Evropské unie pro
    pomoc na hranicích na hraničním přechodu Rafáh (EU BAM Rafah)
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2012/332/FUSP af 25. juni 2012 om ændring og forlængelse
    af fælles aktion 2005/889/FUSP om oprettelse af en EU-grænsebistandsmission
    ved grænseovergangen i Rafah (EU BAM Rafah)
  type: main
- language: el
  script: Grek
  content: Απόφαση 2012/332/ΚΕΠΠΑ του Συμβουλίου, της
    25ης Ιουνίου 2012 , για την τροποποίηση και την
    παράταση της κοινής δράσης 2005/889/ΚΕΠΠΑ σχετικά
    με την ίδρυση αποστολής συνοριακής συνδρομής
    της Ευρωπαϊκής Ένωσης για το σημείο διέλευσης
    της Ράφα (EU BAM Rafah)
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2012/332/ÜVJP, 25. juuni 2012 , millega muudetakse ühismeedet
    2005/889/ÜVJP, millega asutatakse Euroopa Liidu piirihaldamise abimissioon Rafah
    piiriületuspunktis (EU BAM Rafah), ning pikendatakse selle kehtivust
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2012/332/YUTP, annettu 25 päivänä kesäkuuta 2012
    , Euroopan unionin rajavalvonnan avustusoperaation perustamisesta Rafahin rajanylityspaikkaa
    varten (EU BAM Rafah) hyväksytyn yhteisen toiminnan 2005/889/YUTP muuttamisesta
    ja sen voimassaolon jatkamisesta
  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća 2012/332/ZVSP od 25. lipnja 2012. o izmjeni i proširenju
    Zajedničke akcije 2005/889/ZVSP o uspostavi Misije pomoći Europske unije za
    granice za granični prijelaz Rafah (EU BAM Rafah)
  type: main
- language: hu
  script: Latn
  content: A Tanács 2012/332/KKBP határozata ( 2012. június 25. ) az Európai Uniónak
    a rafahi átkelőhelyen működő határőrizeti segítségnyújtó missziója
    (EU BAM Rafah) létrehozásáról szóló 2005/889/KKBP együttes fellépés módosításáról
    és meghosszabbításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2012/332/PESC del Consiglio, del 25 giugno 2012 , che modifica
    e proroga l’azione comune 2005/889/PESC che istituisce una missione dell’Unione
    europea di assistenza alle frontiere per il valico di Rafah (EU BAM Rafah)
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2012/332/KĀDP ( 2012. gada 25. jūnijs ), ar ko groza
    un pagarina Vienoto rīcību 2005/889/KĀDP par Eiropas Savienības Robežu palīdzības
    misijas izveidi Rafas šķērsošanas punktā (ES RPM Rafa)
  type: main
- language: lt
  script: Latn
  content: 2012 m. birželio 25 d. Tarybos sprendimas 2012/332/BUSP, kuriuo iš dalies
    keičiami Bendrieji veiksmai 2005/889/BUSP dėl Europos Sąjungos pasienio pagalbos
    misijos Rafah perėjimo punktui (ES PPM Rafah) įsteigimo ir pratęsiamas jų
    galiojimo terminas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2012/332/PESK tal- 25 ta’ Ġunju 2012 li temenda
    u testendi l-Azzjoni Konġunta 2005/889/PESK dwar l-istabbiliment ta’ Missjoni
    tal-Unjoni Ewropea ta’ Assistenza fil-Fruntieri għall-Punt ta’ Qsim ta’
    Rafah (EU BAM Rafah)
  type: main
- language: nl
  script: Latn
  content: Besluit 2012/332/GBVB van de Raad van 25 juni 2012 tot wijziging en verlenging
    van Gemeenschappelijk Optreden 2005/889/GBVB tot instelling van een missie van
    de Europese Unie voor bijstandverlening inzake grensbeheer aan de grensovergang
    bij Rafah (EU BAM Rafah)
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2012/332/WPZiB z dnia 25 czerwca 2012 r. w sprawie zmiany
    i przedłużenia obowiązywania wspólnego działania 2005/889/WPZiB ustanawiającego
    Misję Unii Europejskiej ds. Szkolenia i Kontroli na przejściu granicznym w Rafah
    (EU BAM Rafah)
  type: main
- language: pt
  script: Latn
  content: Decisão 2012/332/PESC do Conselho, de 25 de junho de 2012 , que altera
    e prorroga a Ação Comum 2005/889/PESC que cria a Missão de Assistência Fronteiriça
    da União Europeia para o Posto de Passagem de Rafa (MAF UE Rafa)
  type: main
- language: ro
  script: Latn
  content: Decizia 2012/332/PESC a Consiliului din 25 iunie 2012 de modificare și
    de prelungire a Acțiunii comune 2005/889/PESC privind instituirea Misiunii de
    Asistență la Frontieră a Uniunii Europene pentru punctul de trecere Rafah (EU
    BAM Rafah)
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2012/332/SZBP z 25. júna 2012 , ktorým sa mení a dopĺňa,
    ako aj predlžuje jednotná akcia 2005/889/SZBP o zriadení pomocnej hraničnej
    misie Európskej únie na hraničnom priechode v Rafahu (PHM EÚ v Rafahu)
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2012/332/SZVP z dne 25. junija 2012 o spremembi in podaljšanju
    Skupnega ukrepa 2005/889/SZVP o ustanovitvi Misije pomoči Evropske unije za mejni
    prehod Rafa (EU BAM Rafah)
  type: main
- language: es
  script: Latn
  content: Decisión 2012/332/PESC del Consejo, de 25 de junio de 2012 , que modifica
    y prorroga la Acción Común 2005/889/PESC por la que se establece una Misión
    de asistencia fronteriza de la Unión Europea para el paso fronterizo de Rafah
    (EU BAM Rafah)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2012/332/Gusp av den 25 juni 2012 om ändring och förlängning
    av gemensam åtgärd 2005/889/Gusp om inrättande av Europeiska unionens gränsövervakningsuppdrag
    för gränsövergångsstället i Rafah (EU BAM Rafah)
  type: main
