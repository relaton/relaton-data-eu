title:
- language: en
  script: Latn
  content: '87/171/EEC: Commission Decision of 27 February 1987 amending Decision
    86/221/EEC on the Guidelines for the Management of the European Social Fund in
    the financial years 1987 to 1989 in respect of the list of areas of high and long-term
    unemployment and/or industrial and sectoral restructuring'
  type: main
- language: fr
  script: Latn
  content: '87/171/CEE: Décision de la Commission du 27 février 1987 modifiant la
    décision 86/221/CEE concernant les orientations pour la gestion du Fonds social
    européen pour les exercices 1987 à 1989 en ce qui concerne la liste des zones
    de chômage élevé et de longue durée et/ou en restructuration industrielle
    et sectorielle'
  type: main
- language: de
  script: Latn
  content: '87/171/EWG: Beschluß der Kommission vom 27. Februar 1987 zur Änderung
    des Beschlusses 86/221/EWG über die Leitlinien für die Verwaltung des Europäischen
    Sozialfonds in den Haushaltsjahren 1987 bis 1989 hinsichtlich des Verzeichnisses
    der Gebiete mit hoher Arbeitslosigkeit und Langzeitarbeitslosigkeit und/oder industrieller
    und sektoraler Umstrukturierung'
  type: main
- language: da
  script: Latn
  content: '87/171/EØF: Kommissionens afgørelse af 27. februar 1987 om ændring
    for så vidt angår fortegnelsen over områder med høj og langvarig arbejdsløshed
    og/eller under industriel og sektoriel strukturomlægning af afgørelse 86/221/EØF
    om retningslinjerne for forvaltningen for Den europæiske Socialfond i regnskabsårene
    1987 til 1989'
  type: main
- language: el
  script: Grek
  content: '87/171/ΕΟΚ: Απόφαση της Επιτροπής της 27ης
    Φεβρουαρίου 1987 που τροποποιεί την απόφαση
    86/221/ΕΟΚ που αναφέρεται στις κατευθυντήριες
    γραμμές για τη διαχείριση του Ευρωπαϊκού Κοινωνικού
    Ταμείου για τα έτη 1987 έως 1989, όσον αφορά τον
    πίνακα των ζωνών με υψηλή και μακροχρόνια ανεργία
    ή/και οι οποίες βρίσκονται σε βιομηχανική και
    τομεακή αναδιάρθρωση'
  type: main
- language: it
  script: Latn
  content: '87/171/CEE: Decisione della Commissione del 27 febbraio 1987 recante modifica
    della decisione 86/221/CEE concernente gli orientamenti per la gestione del Fondo
    sociale europeo per gli esercizi dal 1987 al 1989, relativamente all'' elenco
    delle zone con disoccupazione elevata e di lunga durata e/o in ristrutturazione
    industriale e settoriale'
  type: main
- language: nl
  script: Latn
  content: '87/171/EEG: Besluit van de Commissie van 27 februari 1987 tot wijziging
    van Besluit 86/221/EEG inzake de richtsnoeren voor het beheer van het Europees
    Sociaal Fonds gedurende de jaren 1987-1989 ten aanzien van de lijst van de gebieden
    met een hoge en langdurige werkloosheid en/of een industriële en sectoriële
    herstructurering'
  type: main
- language: pt
  script: Latn
  content: '87/171/CEE: Decisão da Comissão de 27 de Fevereiro de 1987 que altera
    a Decisão 86/221/CEE, relativa às orientações para a gestão do Fundo Social
