    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στον τομέα των
    οπωροκηπευτικών (ΣΜΣ) μεταξύ της Ισπανίας και
    της Κοινότητας με τη σύνθεσή της στις 31 Δεκεμβρίου
