id: EURegulation20222387
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2387 of 30 August 2022 amending
    Delegated Regulation (EU) 2017/655 as regards the adaptation of the provisions
    on monitoring of gaseous pollutant emissions from in-service internal combustion
    engines installed in non-road mobile machinery to include engines with power of
    less than 56 kW and more than 560 kW
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2387 de la Commission du 30 août 2022
    modifiant le règlement délégué (UE) 2017/655 en ce qui concerne l’adaptation
    des dispositions relatives à la surveillance des émissions de gaz polluants
    en service des moteurs à combustion interne installés sur des engins mobiles
    non routiers afin d’inclure les moteurs dont la puissance est inférieure à
    56 kW et ceux dont la puissance est supérieure à 560 kW
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2387 der Kommission vom 30. August 2022
    zur Änderung der Delegierten Verordnung (EU) 2017/655 hinsichtlich der Anpassung
    der Bestimmungen über die Überwachung der Emissionen gasförmiger Schadstoffe
    von in Betrieb befindlichen Verbrennungsmotoren in nicht für den Straßenverkehr
    bestimmten mobilen Maschinen und Geräten zwecks Einbeziehung von Motoren mit
    einer Leistung von weniger als 56 kW und mehr als 560 kW
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/2387 на Комисията
    от 30 август 2022 година за изменение на Делегиран
    регламент (ЕС) 2017/655 във връзка с адаптирането
    на разпоредбите относно наблюдението на емисиите
    на газообразните замърсители от монтираните
    в извънпътната подвижна техника двигатели
    с вътрешно горене при експлоатация, за да бъдат
    включени двигатели с мощност под 56 kW и над 560
    kW
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/2387 ze dne 30. srpna
    2022, kterým se mění nařízení v přenesené pravomoci (EU) 2017/655, pokud
    jde o úpravu ustanovení o monitorování emisí plynných znečišťujících
    látek ze spalovacích motorů v provozu instalovaných v nesilničních mobilních
    strojích, aby zahrnovala motory s výkonem menším než 56 kW a větším než
    560 kW
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/2387 af 30. august 2022 om
    ændring af delegeret forordning (EU) 2017/655 for så vidt angår tilpasning
    af bestemmelserne om overvågning af emissioner af forurenende luftarter fra ibrugtagne
    forbrændingsmotorer, der er monteret i mobile ikke-vejgående maskiner, så de
    omfatter motorer med en effekt på mindre end 56 kW og mere end 560 kW
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/2387
    της Επιτροπής της 30ής Αυγούστου 2022 για την
    τροποποίηση του κατ’ εξουσιοδότηση κανονισμού
    (ΕΕ) 2017/655 όσον αφορά την προσαρμογή των διατάξεων
    σχετικά με την παρακολούθηση των εκπομπών
    αέριων ρύπων από εν χρήσει κινητήρες εσωτερικής
    καύσης εγκατεστημένους σε μη οδικά κινητά
    μηχανήματα, ώστε να συμπεριληφθούν κινητήρες
    με ισχύ μικρότερη από 56 kW και μεγαλύτερη από
    560 kW
  type: main
- language: et
  script: Latn
  content: Komisjoni delegeeritud määrus (EL) 2022/2387, 30. august 2022, millega
    muudetakse delegeeritud määrust (EL) 2017/655 seoses väljaspool teid kasutatavatele
    liikurmasinatele paigaldatud kasutusel olevate sisepõlemismootorite gaasiliste
    saasteainete heite seiret käsitlevate sätete kohandamisega, et need hõlmaksid
    mootoreid võimsusega alla 56 kW ja üle 560 kW
  type: main
- language: fi
  script: Latn
  content: Komission delegoitu asetus (EU) 2022/2387, annettu 30 päivänä elokuuta
    2022, delegoidun asetuksen (EU) 2017/655 muuttamisesta liikkuviin työkoneisiin
    asennettujen käytössä olevien polttomoottoreiden kaasupäästöjen valvontaa
    koskevien säännösten mukauttamiseksi koskemaan moottoreita, joiden teho on
    pienempi kuin 56 kW ja suurempi kuin 560 kW
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/2387 ón gCoimisiún an 30 Lúnasa 2022
    lena leasaítear Rialachán Tarmligthe (AE) 2017/655 a mhéid a bhaineann le glacadh
    na bhforálacha ar fhaireachán a dhéanamh ar astaíochtaí truailleán gásach
    ó innill dócháin inmheánaigh inseirbhíse atá suiteáilte in innealra soghluaiste
    nach innealra bóthair é chun innill ag a bhfuil cumhacht níos lú ná 56 kW
    agus níos mó ná 560 kW a chur san áireamh
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2387 оd 30. kolovoza 2022. o izmjeni
    Delegirane uredbe (EU) 2017/655 u pogledu prilagodbe odredaba o praćenju emisija
    plinovitih onečišćujućih tvari iz motora s unutarnjim izgaranjem u uporabi
    ugrađenih u necestovne pokretne strojeve kako bi se uključili motori snage manje
    od 56 kW i veće od 560 kW
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2387 felhatalmazáson alapuló rendelete (2022.
    augusztus 30.) az (EU) 2017/655 felhatalmazáson alapuló rendeletnek a nem közúti
    mozgó gépekbe beépített belső égésű motorok használat közbeni gáz-halmazállapotú
    szennyező anyag-kibocsátásának nyomon követésére vonatkozó rendelkezéseknek
    az 56 kW-nál kisebb és az 560 kW-nál nagyobb teljesítményű motorok vonatkozásában
    történő kiigazítása tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2387 della Commissione del 30 agosto 2022
    che modifica il regolamento delegato (UE) 2017/655 per quanto riguarda l’adeguamento
    delle disposizioni sul monitoraggio delle emissioni di inquinanti gassosi da motori
    a combustione interna in servizio installati su macchine mobili non stradali per
    includervi i motori di potenza inferiore a 56 kW e superiore a 560 kW
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2387 (2022. gada 30. augusts), ar
    ko groza Deleģēto regulu (ES) 2017/655, lai noteikumus par tādu gāzveida piesārņotāju
    emisiju uzraudzību, ko rada ekspluatācijā esoši iekšdedzes motori, kuri uzstādīti
    autoceļiem neparedzētā mobilajā tehnikā, pielāgotu tā, lai tie ietvertu
    motorus, kuru jauda ir mazāka par 56 kW vai lielāka par 560 kW
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2387 2022 m. rugpjūčio 30
    d. kuriuo dėl eksploatuojamų vidaus degimo variklių, sumontuotų ne keliais
    judančiuose mechanizmuose, išmetamų dujinių teršalų stebėsenos nuostatų
    pritaikymo įtraukiant mažesnės kaip 56 kW ir didesnės kaip 560 kW galios variklius
    iš dalies keičiamas Deleguotasis reglamentas (ES) 2017/655
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2387 tat-30 ta’ Awwissu
    2022 li jemenda r-Regolament Delegat (UE) 2017/655 fir-rigward tal-adattament
    tad-dispożizzjonijiet dwar il-monitoraġġ tal-emissjonijiet ta’ inkwinanti
    gassużi minn magni b’kombustjoni interna fis-servizz installati f’makkinarju
    mobbli mhux tat-triq biex jinkludu magni b’potenza ta’ inqas minn 56 kW u
    iktar minn 560 kW
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2387 van de Commissie van 30 augustus
    2022 tot wijziging van Gedelegeerde Verordening (EU) 2017/655 wat betreft de aanpassing
    van de bepalingen inzake de monitoring van de uitstoot van verontreinigende gassen
    door in gebruik zijnde interne verbrandingsmotoren die gemonteerd zijn in niet
    voor de weg bestemde mobiele machines, teneinde die uit te breiden tot motoren
    met een vermogen van minder dan 56 kW en meer dan 560 kW
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2387 z dnia 30 sierpnia 2022
    r. zmieniające rozporządzenie delegowane (UE) 2017/655 w zakresie dostosowania
    przepisów dotyczących monitorowania emisji zanieczyszczeń gazowych z silników
    spalinowych wewnętrznego spalania w trakcie eksploatacji zamontowanych w maszynach
    mobilnych nieporuszających się po drogach w celu uwzględnienia silników o
    mocy mniejszej niż 56 kW i większej niż 560 kW
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2387 da Comissão de 30 de agosto de 2022
    que altera o Regulamento Delegado (UE) 2017/655 no que respeita à adaptação
    das disposições relativas à monitorização de emissões de gases poluentes
    dos motores de combustão interna em serviço instalados em máquinas móveis
    não rodoviárias, de modo a incluir motores com potência inferior a 56 kW e
    superior a 560 kW
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2387 al Comisiei din 30 august 2022 de modificare
    a Regulamentului delegat (UE) 2017/655 în ceea ce privește adaptarea dispozițiilor
    privind monitorizarea emisiilor de poluanți gazoși provenind de la motoarele
    cu ardere internă în circulație instalate pe echipamentele mobile fără destinație
    rutieră pentru a include motoarele cu putere mai mică de 56 kW și mai mare
    de 560 kW
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2387 z 30. augusta 2022, ktorým
    sa mení delegované nariadenie (EÚ) 2017/655, pokiaľ ide o prispôsobenie ustanovení
    o monitorovaní emisií plynných znečisťujúcich látok zo spaľovacích motorov
    v prevádzke inštalovaných v necestných pojazdných strojoch tak, aby zahŕňali
    motory s výkonom menším ako 56 kW a väčším ako 560 kW
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2387 z dne 30. avgusta 2022 o spremembi
    Delegirane Uredbe (EU) 2017/655 v zvezi s prilagoditvijo določb o spremljanju
    emisij plinastih onesnaževal iz motorjev z notranjim zgorevanjem, vgrajenih v
    necestno mobilno mehanizacijo, med obratovanjem, da bi se vključili motorji z
    močjo manj kot 56 kW in več kot 560 kW
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2387 de la Comisión de 30 de agosto de 2022
    por el que se modifica el Reglamento Delegado (UE) 2017/655 en lo que respecta
    a la adaptación de las disposiciones sobre la vigilancia de las emisiones de
    gases contaminantes procedentes de motores de combustión interna instalados en
    máquinas móviles no de carretera para incluir motores con una potencia inferior
    a 56 kW y superior a 560 kW
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2387 av den 30 augusti 2022
    om ändring av delegerad förordning (EU) 2017/655 vad gäller anpassning av bestämmelserna
    om övervakning av utsläpp av gasformiga föroreningar från förbränningsmotorer
    i drift monterade i mobila maskiner som inte är avsedda att användas för transporter
    på väg så att de omfattar motorer med en effekt på mindre än 56 kW och mer
    än 560 kW
  type: main
