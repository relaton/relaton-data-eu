id: EUDecision1978872
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 October 1978 authorizing the French Republic not
    to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, falling within heading No 60.02 of the Common Customs
    Tariff, originating in the People's Republic of China and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/872/CEE: Décision de la Commission, du 9 octobre 1978, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, de la position 60.02 du Tarif douanier
    commun, originaire de la République populaire de Chine et mise en libre pratique
    dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. Oktober 1978, mit der die Französische
    Republik ermächtigt wird, aus der Volksrepublik China stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, der Tarifnummer 60.02 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung
    auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 9. oktober 1978 om bemyndigelse af Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, som henhører under pos. 60.02 i den
    fælles toldtarif, har oprindelse i Den kinesiske Folkerepublik og frit kan omsættes
    i de øvrige medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 9 ottobre 1978, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario guanti a maglia non elastica
    né gommata della voce 60.02 della tariffa doganale comune, originari della Repubblica
    popolare cinese e messi in libera pratica negli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 oktober 1978 waarbij de Franse Republiek
    wordt gemachtigd handschoenen, wanten en dergelijke artikelen van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van post 60.02 van het gemeenschappelijk
    douanetarief, van oorsprong uit de Volksrepubliek China en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
