title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2091/72 de la Commission, du 28 septembre 1972, fixant
    les taux des restitutions applicables, à compter du 1er octobre 1972, à certains
    produits laitiers exportés sous forme de marchandises ne relevant pas de l'annexe
    II du Traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2091/72 der Kommission vom 28. September 1972 zur
    Festsetzung der ab 1. Oktober 1972 geltenden Erstattungssätze bei der Ausfuhr
    von bestimmten Milcherzeugnissen in Form von nicht unter Anhang II des Vertrages
    fallenden Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2091/72 della Commissione, del 28 settembre 1972,
    che fissa i tassi delle restituzioni applicabili, a decorrere dal 1 ottobre 1972,
    a taluni prodotti lattiero-caseari esportati sotto forma di merci non comprese
    nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2091/72 van de Commissie van 28 september 1972 houdende
    vaststelling van de restituties welke vanaf 1 oktober 1972 van toepassing zijn
    op bepaalde zuivelprodukten die worden uitgevoerd in de vorm van niet in bijlage
    II van het verdrag vermelde goederen
