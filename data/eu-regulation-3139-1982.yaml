- language: en
  script: Latn
  content: Council Regulation (ECSC, EEC, Euratom) No 3139/82 of 22 November 1982
    amending the tables of basic salaries laid down in Regulation (ECSC, EEC, Euratom)
    No 371/82 and (ECSC, EEC, Euratom) No 372/82 and adjusting, with effect from 1
    April 1980, the weightings applicable to remuneration and pensions payable in
    the various countries of employment
  type: main
- language: fr
  script: Latn
  content: Règlement (CECA, CEE, Euratom) n° 3139/82 du Conseil, du 22 novembre
    1982, portant modification des tableaux des traitements de base arrêtés par
    les règlements (CECA, CEE, Euratom) n° 371/82 et (CECA, CEE, Euratom) n° 372/82
    et adaptation, à compter du 1er avril 1980, des coefficients correcteurs applicables
    aux rémunérations et pensions versées dans divers pays d' affectation
  type: main
- language: de
  script: Latn
  content: Verordnung (EGKS, EWG, Euratom) Nr. 3139/82 des Rates vom 22. November
