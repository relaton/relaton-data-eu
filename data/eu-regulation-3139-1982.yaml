    nr. 371/82 og (EKSF, EØF, Euratom) nr. 372/82 og om tilpasning fra 1. april 1980
    af justeringskoefficienterne for vederlag og pensioner, der udbetales på tjenestestederne
    i forskellige lande
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EKAX, EOK, Ευρατόμ) αριθ. 3139/82 τού
    Συμβουλίου τής 22ας Νοεμβρίου 1982 περί τροποποιήσεως
    τών πινάκων βασικών αποδοχών πού καθορίστηκαν
    μέ τούς κανονισμούς (EKAX, EOK, Ευρατόμ) αριθ. 371/82
    καί (EKAX, EOK, Ευρατόμ) αριθ. 372/82, καί γιά τήν προσαρμογή,
    από τήν 1η Απριλίου 1980, τών συντελεστών αναπροσαρμογής
    πού εφαρμόζονται επί τών αποδοχών καί τών συντάξεων
    πού χορηγούνται σέ διάφορες χώρες τοποθετήσεως
  type: main
- language: it
  script: Latn
  content: Regolamento (CECA, CEE, Euratom) n. 3139/82 del Consiglio, del 22 novembre
    1982, che modifica le tabelle degli stipendi di base adottate con i regolamenti
    (CECA, CEE, Euratom) nn. 371/82 e 372/82 e che adegua, a decorrere dal 1° aprile
    1980, i coefficienti correttori applicabili alle retribuzioni e pensioni versate
    nei vari paesi in cui si trovano le sedi di servizioo
  type: main
- language: nl
  script: Latn
  content: Verordening (EGKS, EEG, Euratom) nr. 3139/82 van de Raad van 22 november
    1982 tot wijziging van de tabellen van de basissalarissen vastgesteld bij de Verordeningen
    (EGKS, EEG, Euratom) nr. 371/82 en nr. 372/82 en tot aanpassing met ingang van
    1 april 1980 van de aanpassingscoëfficiënten die van toepassing zijn op de bezoldigingen
    en pensioenen die in verschillende landen van tewerkstelling worden uitgekeerd
  type: main
- language: pt
  script: Latn
  content: Regulamento (CECA, CEE, Euratom) n.° 3139/82 do Conselho, de 22 de Novembro
