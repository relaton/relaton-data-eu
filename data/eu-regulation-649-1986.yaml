title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 649/86 of 28 February 1986 adopting the
    list of wines produced in Portugal falling within heading No 22.05 of the Common
    Customs Tariff that are to be treated as quality wines produced in specified regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 649/86 de la Commission du 28 février 1986 arrêtant
    la liste des vins produits au Portugal assimilés aux vins de qualité produits
    dans des régions déterminées, relevant de la position 22.05 du tarif douanier
    commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 649/86 der Kommission vom 28. Februar 1986 zur Festlegung
    des Verzeichnisses der in Portugal erzeugten und den Qualitätsweinen bestimmter
    Anbaugebiete gleichgestellten Weine der Tarifnummer 22.05 des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 649/86 af 28. februar 1986 om fastsættelse
    af listen over de i Portugal fremstillede vine, der sidestilles med kvalitetsvine
    fra bestemte dyrkningsområder, henhørende under pos. 22.05 i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 649/86 της Επιτροπής
    της 28ης Φεβρουαρίου 1986 που θεσπίζει τον κατάλογο
    των οίνων που παράγονται στην Πορτογαλία οι
    οποίοι εξομοιούνται με οίνους ποιότητας που
    παράγονται σε καθορισμένες περιοχές που υπάγονται
    στην κλάση 22.05 του κοινού δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 649/86 della Commissione del 28 febbraio 1986 che
    stabilisce l' elenco dei vini prodotti in Portogallo assimiliati ai vini di qualità
    prodotti in regioni determinate di cui alla voce 22.05 della tariffa doganale
    comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 649/86 van de Commissie van 28 februari 1986 tot
    vaststelling van de lijst van in Portugal voortgebrachte wijnen die met v.q.p.r.d.-wijn
    van post 22.05 van het gemeenschappelijk douanetarief gelijkgesteld worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 649/86 da Comissão de 28 de Fevereiro de 1986 que
    adopta a lista dos vinhos produzidos em Portugal equiparados aos vinhos de qualidade
    produzidos em regiões determinadas, incluídos na posição 22.05 da pauta aduaneira
    comum
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 649/86 de la Comisión de 28 de febrero de 1986 por
    el que se adopta la lista de vinos producidos en Portugal asimilados a los vinos
    de calidad producidos en regiones determinadas incluidos en la partida n° 22.05
    del arancel aduanero común
