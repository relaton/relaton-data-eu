title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 2913/90 of 8 October 1990 derogating from the
    definition of the concept of "originating products" to take account of the special
    situation of the Netherlands' Antilles with regard to cigarettes falling within
    CN code 2402 20 00
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2913/90 du Conseil, du 8 octobre 1990, portant dérogation
    à la définition de la notion de produits originaires pour tenir compte de la
    situation particulière des Antilles néerlandaises en ce qui concerne les cigarettes
    relevant du code NC 2402 20 00
  type: main
- language: de
  script: Latn
  content: VERORDNUNG ( EWG ) NR. 2913/90 DES RATES VOM 8. OKTOBER 1990 ZUR ABWEICHUNG
    VON DER BEGRIFFSBESTIMMUNG " URSPRUNGSWAREN " ZUR BERUECKSICHTIGUNG DER BESONDEREN
    LAGE DER NIEDERLAENDISCHEN ANTILLEN HINSICHTLICH ZIGARETTEN DES KN-CODES 2402
    20 00
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 2913/90 af 8. oktober 1990 om undtagelse
    fra definitionen af begrebet "varer med oprindelsesstatus" for at tage hensyn
    til den særlige situation på de nederlandske Antiller for så vidt angår cigaretter
    henhørende under KN-kode 2402 20 00
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2913/90 του Συμβουλίου
    της 8ης Οκτωβρίου 1990 περί παρεκκλίσεως από
    τον ορισμό της εννοίας " καταγόμενα προϊόντα
    " ή " προϊόντα καταγωγής " ώστε να ληφθεί υπόψη
    η ειδική περίπτωση των Ολλανδικών Αντιλλών
    όσον αφορά τα τσιγάρα που υπάγονται στον κωδικό
    ΣΟ 2400 20 00
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO ( CEE ) N. 2913/90 DEL CONSIGLIO, DELL' 8 OTTOBRE 1990, RECANTE
    DEROGA ALLA DEFINIZIONE DI " PRODOTTI ORIGINARI " PER TENER CONTO DELLA PARTICOLARE
    SITUAZIONE DELLE ANTILLE OLANDESI PER QUANTO CONCERNE LE SIGARETTE DEL CODICE
    NC 2402 20 00
  type: main
- language: nl
  script: Latn
  content: VERORDENING ( EEG ) NR. 2913/90 VAN DE RAAD VAN 8 OKTOBER 1990 HOUDENDE
    AFWIJKING VAN DE DEFINITIE VAN HET BEGRIP " PRODUKTEN VAN OORSPRONG " IN VERBAND
    MET DE BIJZONDERE SITUATIE VAN DE NEDERLANDSE ANTILLEN TEN AANZIEN VAN SIGARETTEN
    VAN GN-CODE 2402 20 00
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO ( CEE ) NO 2913/90 DO CONSELHO, DE 8 DE OUTUBRO DE 1990, QUE
    DERROGA A DEFINICAO DA NOCAO DE " PRODUTOS ORIGINARIOS " PARA TER EM CONTA A SITUACAO
    ESPECIAL DAS ANTILHAS NEERLANDESAS NO QUE DIZ RESPEITO AOS CIGARROS DO CODIGO
    NC 2402 20 00
  type: main
- language: es
  script: Latn
  content: REGLAMENTO ( CEE ) NO 2913/90 DEL CONSEJO, DE 8 DE OCTUBRE DE 1990, POR
    EL QUE SE ESTABLECE UNA EXCEPCION A LA DEFINICION DE LA NOCION DE " PRODUCTOS
    ORIGINARIOS " PARA TENER EN CUENTA LA SITUACION ESPECIAL DE LAS ANTILLAS NEERLANDESAS
    RESPECTO DE LOS CIGARRILLOS DEL CODIGO NC 2402 20 00
