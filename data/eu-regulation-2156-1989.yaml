- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2156/89 of 18 July 1989 amending Council
    Regulation (EEC) No 797/85, following the fixing of new exchange rates to be applied
    in agriculture for the German mark and the Dutch guilder, by adjusting the amounts
    fixed therein in ecus for agricultural structures policy purposes
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2156/89 de la Commission du 18 juillet 1989 modifiant
    le règlement (CEE) n° 797/85 en ce qui concerne l'ajustement des montants fixés
    en écus dans le cadre de la politique des structures agricoles suite à la fixation
    de nouveaux taux de change à appliquer dans le secteur agricole pour le mark
    allemand et le florin néerlandais
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2156/89 DER KOMMISSION vom 18. Juli 1989 zur Änderung
    der Verordnung (EWG) Nr. 797/85 des Rates hinsichtlich der Anpassung der im Rahmen
    der Agrarstrukturpolitik in Ecu festgesetzten Beträge im Anschluß an die Festsetzung
    neuer, in der Landwirtschaft anwendbarer Umrechnungskurse für die Deutsche Mark
    und den niederländischen Gulden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2156/89 af 18. juli 1989 om ændring
    af forordning (EØF) nr. 797/85 for så vidt angår ændringen af beløbene i
    ECU inden for landbrugsstrukturpolitikken som følge af fastsættelsen af nye
    valutakurser for den tyske mark og den nederlandske gylden inden for landbruget
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2156/89 της Επιτροπής
