    degli importi fissati in ECU nell'' ambito della politica delle strutture agricole
    in seguito alla fissazione di nuovi tassi di cambio da applicare nel settore agricolo
    per il marco tedesco e il fiorino olandese #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 2156/89 VAN DE COMMISSIE van 18 juli 1989 tot wijziging
    van Verordening (EEG) nr. 797/85 van de Raad ten aanzien van de aanpassing van
    de in het kader van het landbouwstructuurbeleid in ecu vastgestelde bedragen in
    verband met de vaststelling van nieuwe in de landbouwsector voor de Duitse mark
    en de Nederlandse gulden toe te passen wisselkoersen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 2156/89 DA COMISSÃO de 18 de Julho de 1989 que
