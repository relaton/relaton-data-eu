title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2846/79 of 17 December 1979 amending Regulation
    (EEC) No 2546/79 as regards certain periods of application for the additional
    measures reserved for holders of long-term storage contracts for certain table
    wines for the 1978/79 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2846/79 de la Commission, du 17 décembre 1979, modifiant
    le règlement (CEE) n° 2546/79 en ce qui concerne certains délais d' application
    des mesures complémentaires réservées aux détenteurs de contrats de stockage
    à long terme de certains vins de table pour la campagne 1978/1979
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2846/79 der Kommission vom 17. Dezember 1979 zur Änderung
    der Verordnung (EWG) Nr. 2546/79 hinsichtlich bestimmter Fristen für die Durchführung
    der ergänzenden Maßnahmen für das Wirtschaftsjahr 1978/79, die Inhabern langfristiger
    Lagerverträge für Tafelweine vorbehalten sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2846/79 af 17. december 1979 om ændring
    af forordning (EØF) nr. 2546/79 for så vidt angår visse frister for anvendelse
    af de supplerende foranstaltninger, der er foreholdt indehavere af langfristede
    oplagringskontrakter for visse bordvine for produktionsåret 1978/79
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2846/79 της Επιτροπής
    της 17ης Δεκεμβρίου 1979 περί τροποποιήσεως του
    κανονισμού (EOK) αριθ. 2546/79 όσον αφορά ορισμένες
    προθεσμίες για την εφαρμογή συμπληρωματικών
    μέτρων που επιφυλάσσονται στους κατόχους συμφωνητικών
    μακροπροθέσμου αποθεματοποιήσεως ορισμένων
    επιτραπεζίων οίνων για την περίοδο 1978/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2846/79 della Commissione, del 17 dicembre 1979, recante
    modifica del regolamento (CEE) n. 2546/79 per quanto concerne talune date di applicazione
    delle misure complementari riservate ai titolari di contratti di magazzinaggio
    a lungo termine di taluni vini da tavola per la campagna 1978/1979
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2846/79 van de Commissie van 17 december 1979 tot
    wijziging van Verordening (EEG) nr. 2546/79 ten aanzien van bepaalde termijnen
    voor de toepassing van de aanvullende maatregelen ten behoeve van degenen die
    voor het wijnoogstjaar 1978/1979 langlopende opslagcontracten voor bepaalde soorten
    tafelwijn hebben gesloten
