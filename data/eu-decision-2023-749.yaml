type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/749 of 11 April 2023 amending
    Annexes I and II to Implementing Decision (EU) 2021/260 as regards the national
    measures which apply in Denmark concerning bacterial kidney disease (BKD) and
    infectious pancreatic necrosis (IPN) and the national measures which apply in
    the United Kingdom (Northern Ireland) concerning Ostreid herpesvirus-1μνar (OsHV-1μνar)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2023/749 de la Commission du 11 avril 2023
    modifiant les annexes I et II de la décision d’exécution (UE) 2021/260 en
    ce qui concerne les mesures nationales applicables au Danemark concernant la rénibactériose
    (BKD) et la nécrose pancréatique infectieuse (NPI), ainsi que les mesures nationales
    applicables au Royaume-Uni (Irlande du Nord) concernant l’infection par l’herpèsvirus
    de l’huître 1 μνar (OsHV-1 μνar)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/749 der Kommission vom 11. April 2023
    zur Änderung der Anhänge I und II des Durchführungsbeschlusses (EU) 2021/260
    hinsichtlich der in Dänemark geltenden nationalen Maßnahmen hinsichtlich der
    bakteriellen Nierenerkrankung (BKD) und der infektiösen Pankreasnekrose (IPN)
    sowie der im Vereinigten Königreich (Nordirland) geltenden nationalen Maßnahmen
    in Bezug auf das Ostreide Herpesvirus 1 μVar (OsHV-1 μVar)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/749 на Комисията
    от 11 април 2023 година за изменение на приложения
    I и II към Решение за изпълнение (ЕС) 2021/260 по отношение
    на националните мерки, които се прилагат в
    Дания във връзка с ренибактериозата (BKD) и инфекциозната
    панкреатична некроза (IPN), и на националните
    мерки, които се прилагат в Обединеното кралство
    (Северна Ирландия) във връзка с Ostreid herpesvirus-1μνar
    (OsHV-1μνar)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2023/749 ze dne 11. dubna 2023, kterým
    se mění přílohy I a II prováděcího rozhodnutí (EU) 2021/260, pokud jde
    o vnitrostátní opatření týkající se bakteriálního onemocnění ledvin
    (BKD) a infekční nekrózy pankreatu (IPN) platná v Dánsku a vnitrostátní
    opatření týkající se ostreid herpesviru 1 μνar (OsHV-1 μνar) platná
    ve Spojeném království (Severním Irsku)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/749 af 11. april 2023
    om ændring af bilag I og II til gennemførelsesafgørelse (EU) 2021/260 for så
    vidt angår de nationale foranstaltninger, der gælder i Danmark, vedrørende
    bakteriel nyresygdom (BKD) og infektiøs pankreasnekrose (IPN) og de nationale
    foranstaltninger, der gælder i Det Forenede Kongerige (Nordirland), vedrørende
    ostreid herpesvirus 1 μνar (OsHV-1 μνar)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2023/749 της Επιτροπής
