    huhtikuuta 2023, täytäntöönpanopäätöksen (EU) 2021/260 liitteiden I ja
    II muuttamisesta siltä osin kuin on kyse Tanskassa bakteeriperäisen munuaistaudin
    (BKD) ja tarttuvan haimakuoliotaudin (IPN) osalta sovellettavista kansallisista
    toimenpiteistä ja Yhdistyneessä kuningaskunnassa (Pohjois-Irlanti) ostereiden
    herpesviruksen 1 μνar (OsHV-1 μνar) osalta sovellettavista kansallisista toimenpiteistä
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2023/749 ón gCoimisiún an 11 Aibreán
    2023 lena leasaítear Iarscríbhinní I agus II a ghabhann le Cinneadh Cur Chun
    Feidhme (AE) 2021/260 a mhéid a bhaineann leis na bearta náisiúnta is infheidhme
    sa Danmhairg maidir le galar baictéarach duáin (BKD) agus neacróis phaincréasach
    thógálach (IPN) agus na bearta náisiúnta is infheidhme sa Ríocht Aontaithe
    (Tuaisceart Éireann) maidir le víreas heirpéis oisre-1μvar (OsHV-1μvar)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2023/749 оd 11. travnja 2023. o izmjeni
    priloga I. i II. Provedbenoj odluci (EU) 2021/260 u pogledu nacionalnih mjera
    za bakterijsku bolest bubrega (BKD) i zaraznu nekrozu gušterače (IPN) koje se
    primjenjuju u Danskoj i nacionalnih mjera za herpesvirus kamenice 1 μνar (OsHV-1
    μνar) koje se primjenjuju u Ujedinjenoj Kraljevini (Sjeverna Irska)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2023/749 végrehajtási határozata (2023. április 11.)
    az (EU) 2021/260 végrehajtási határozat I. és II. mellékletének a bakteriális
    vesebetegséggel (BKD) és a fertőző hasnyálmirigy-elhalással (IPN) kapcsolatban
    Dániában, valamint az Ostreid herpeszvírus 1 μνarral (OsHV-1 μνar) kapcsolatban
    az Egyesült Királyságban (Észak-Írországban) alkalmazandó nemzeti intézkedések
    tekintetében történő módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2023/749 della Commissione del 11 aprile 2023
    che modifica gli allegati I e II della decisione di esecuzione (UE) 2021/260 per
    quanto riguarda le misure nazionali applicabili in Danimarca in relazione alla
    nefrobatteriosi (BKD) e alla necrosi pancreatica infettiva (IPN) e le misure nazionali
    applicabili nel Regno Unito (Irlanda del Nord) in relazione all’Ostreid herpesvirus-1
    μνar (OsHV-1 μνar)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2023/749 (2023. gada 11. aprīlis),
    ar ko attiecībā uz Dānijā piemērojamiem valsts pasākumiem, kas attiecas
    uz bakteriālo nieru slimību (BKD) un infekciozo aizkuņģa dziedzera nekrozi
    (IPN), un Apvienotajā Karalistē (Ziemeļīrijā) piemērojamiem valsts pasākumiem,
    kas attiecas uz austeru herpesvīrusu 1μνar (OsHV-1μνar), groza Īstenošanas
    lēmuma (ES) 2021/260 I un II pielikumu
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2023/749 2023 m. balandžio 11
    d. kuriuo dėl Danijoje taikomų nacionalinių priemonių, susijusių su bakterine
    inkstų liga (BIL) ir infekcine kasos nekroze (IKN), ir Jungtinėje Karalystėje
    (Šiaurės Airijoje) taikomų nacionalinių priemonių, susijusių su austrių
    herpeso virusu-1μνar (OsHV-1μνar), iš dalies keičiami Įgyvendinimo sprendimo
    (ES) 2021/260 I ir II priedai
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2023/749 tal-11
    ta’ April 2023 li temenda l-Annessi I u II tad-Deċiżjoni ta’ Implimentazzjoni
    (UE) 2021/260 fir-rigward tal-miżuri nazzjonali li japplikaw fid-Danimarka dwar
    il-marda batterika tal-kliewi (BKD) u n-nekrożi pankreatika infettiva (IPN) u
    l-miżuri nazzjonali li japplikaw fir-Renju Unit (l-Irlanda ta’ Fuq) li jikkonċernaw
    l-Ostreid herpesvirus-1μνar (OsHV-1μνar)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2023/749 van de Commissie van 11 april 2023 tot
    wijziging van de bijlagen I en II bij Uitvoeringsbesluit (EU) 2021/260 wat betreft
    de nationale maatregelen die in Denemarken van toepassing zijn op bacteriële
    nierziekte (BKD) en infectieuze pancreasnecrose (IPN) en de nationale maatregelen
    die in het Verenigd Koninkrijk (Noord-Ierland) van toepassing zijn met betrekking
    tot ostreid herpesvirus 1 μνar (OsHV-1μνar)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2023/749 z dnia 11 kwietnia 2023 r. zmieniająca
    załączniki I i II do decyzji wykonawczej (UE) 2021/260 w odniesieniu do środków
    krajowych mających zastosowanie w Danii dotyczących bakteryjnej choroby nerek
    (BKD) i zakaźnej martwicy trzustki (IPN) oraz środków krajowych mających zastosowanie
    w Zjednoczonym Królestwie (Irlandia Północna) dotyczących herpeswirusa 1μνar
    (OsHV-1μνar) u ostryg
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2023/749 da Comissão de 11 de abril de 2023
    que altera os anexos I e II da Decisão de Execução (UE) 2021/260 no que diz
    respeito às medidas nacionais aplicáveis na Dinamarca relativas à corinebacteriose
    (BKD) e à necrose pancreática infecciosa (NPI) e às medidas nacionais aplicáveis
    no Reino Unido (Irlanda do Norte) relativas ao Ostreid herpesvirus 1μνar (OsHV-1μνar)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2023/749 a Comisiei din 11 aprilie
    2023 de modificare a anexelor I și II la Decizia de punere în aplicare (UE)
    2021/260 privind măsurile naționale care se aplică în Danemarca în ceea ce
    privește boala bacteriană a rinichiului (BKD) și necroza pancreatică infecțioasă
    (IPN) și măsurile naționale care se aplică în Regatul Unit (Irlanda de Nord)
    în ceea ce privește virusul herpetic al stridiilor-1μνar (OsHV-1μνar)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2023/749 zo 11. apríla 2023, ktorým
    sa menia prílohy I a II k vykonávaciemu rozhodnutiu (EÚ) 2021/260, pokiaľ
    ide o vnútroštátne opatrenia, ktoré sa uplatňujú v Dánsku v súvislosti
    s bakteriálnou chorobou obličiek (BKD) a infekčnou pankreatickou nekrózou
    (IPN), a vnútroštátne opatrenia, ktoré sa uplatňujú v Spojenom kráľovstve
    (Severné Írsko) v súvislosti s herpetickým vírusom ustríc – 1 μνar (OsHV-1
    μνar)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2023/749 z dne 11. aprila 2023 o spremembi
    prilog I in II k Izvedbenemu sklepu (EU) 2021/260 glede nacionalnih ukrepov, ki
    se uporabljajo na Danskem v zvezi z bakterijskim nefritisom (BKD) in nalezljivo
    nekrozo trebušne slinavke (IPN), ter nacionalnih ukrepov, ki se uporabljajo v
    Združenem kraljestvu (Severna Irska) v zvezi z ostreidnim herpesvirusom-1μvar
    (OsHV-1μvar)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2023/749 de la Comisión de 11 de abril de
    2023 por la que se modifican los anexos I y II de la Decisión de Ejecución (UE)
    2021/260 en lo que respecta a las medidas nacionales aplicables en Dinamarca en
    relación con la renibacteriosis y la necrosis pancreática infecciosa (NPI) y
    las medidas nacionales aplicables en el Reino Unido (Irlanda del Norte) en relación
    con el herpesvirus de los ostreidos tipo 1 μνar (OsHV-1 μνar)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2023/749 av den 11 april 2023 om
    ändring av bilagorna I och II till genomförandebeslut (EU) 2021/260 vad gäller
    de nationella åtgärder som tillämpas i Danmark när det gäller renibakterios
    (BKD) och infektiös pankreasnekros (IPN) samt de nationella åtgärder som tillämpas
    i Förenade kungariket (Nordirland) när det gäller herpesvirus (OsHV-1μνar)
