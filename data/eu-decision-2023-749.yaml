    παραρτημάτων I και II της εκτελεστικής απόφασης
    (ΕΕ) 2021/260 όσον αφορά τα εθνικά μέτρα που εφαρμόζονται
    στη Δανία σχετικά με τη βακτηριακή νεφρίτιδα
    (BKD) και τη λοιμώδη παγκρεατική νέκρωση (IPN) και
    τα εθνικά μέτρα που εφαρμόζονται στο Ηνωμένο
    Βασίλειο (Βόρεια Ιρλανδία) σχετικά με τον ερπητοϊό
    των στρειδιών-1 μνar (OsHV-1 μνar)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2023/749, 11. aprill 2023, millega muudetakse
    rakendusotsuse (EL) 2021/260 I ja II lisa seoses Taanis bakteriaalse neeruhaiguse
    (BKD) ja nakkusliku pankrease nekroosi (IPN) suhtes kohaldatavate riiklike meetmetega
    ning Ühendkuningriigis (Põhja-Iirimaa) austrite herpesviiruse 1 μVar (OsHV-1
    μVar) suhtes kohaldatavate riiklike meetmetega
  type: main
- language: fi
  script: Latn
