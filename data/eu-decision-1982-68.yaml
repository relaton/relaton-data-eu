title:
- language: en
  script: Latn
  content: '82/68/EEC: Commission Decision of 21 December 1981 establishing that the
    apparatus described as ''PGT-energy dispersive X-ray analysis system, model XCEL''
    may be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '82/68/CEE: Décision de la Commission, du 21 décembre 1981, constatant
    que l''importation de l''appareil dénommé "P.G.T. - Energy Dispersive X-ray
    Analysis System, model XCEL" peut être faite en franchise des droits du tarif
    douanier commun'
  type: main
- language: de
  script: Latn
  content: '82/68/EWG: Entscheidung der Kommission vom 21. Dezember 1981, mit der
    festgestellt wird, daß das Gerät ,,P.G.T. - Energy Dispersive X-ray Analysis
    System, model XCEL" unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs
    eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '82/68/EØF: Kommissionens beslutning af 21. december 1981 om fastslåelse
    af, at indførsel af apparatet "P.G.T. - Energy Dispersive X-ray Analysis System,
    model XCEL" kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
