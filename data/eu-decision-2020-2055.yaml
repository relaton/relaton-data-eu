- language: en
  script: Latn
  content: Council Decision (EU) 2020/2055 of 7 December 2020 on the position to be
    taken on behalf of the European Union within the Joint Committee established by
    the Agreement between the European Community, of the one part, and the Government
    of Denmark and the Home Government of the Faroe Islands, of the other part, as
    regards the amendment of that Agreement by replacing Protocol 3 thereto concerning
    the definition of the concept of ‘originating products’ and methods of administrative
    cooperation
  type: main
- language: fr
  script: Latn
