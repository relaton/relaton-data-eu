    gouvernement du Danemark et le gouvernement local des Îles Féroé, d’autre
    part, en ce qui concerne la modification dudit accord par le remplacement de son
    protocole no 3 relatif à la définition de la notion de «produits originaires»
    et aux méthodes de coopération administrative
  type: main
