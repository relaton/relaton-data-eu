id: EURegulation17471975
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1747/75 of the Commission of 7 July 1975 re-establishing
    the levying of customs duties on other sheep- and lamb-skin leather, falling within
    subheading 41.03 B II, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3054/74 of 2 December
    1974 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1747/75 de la Commission, du 7 juillet 1975, portant
    rétablissement de la perception des droits de douane applicables aux autres peaux
    d'ovins préparées, non dénommées, de la sous-position tarifaire 41.03 B II,
    originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3054/74 du Conseil du 2 décembre
    1974
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1747/75 der Kommission vom 7. Juli 1975 über die
    Wiedereinführung des Zollsatzes für Schaf- und Lammleder, anderes, der Tarifstelle
    41.03 B II, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3054/74 des Rates vom 2. Dezember 1974 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1747/75 af 7. juli 1975 om genindførelse
    af opkrævning af toldafgifter for i andre tilfælde af læder af fåre- og lammeskind,
    andre varer, under underposition 41.03 B II, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3054/74 af 2. december 1974
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1747/75 della Commissione, del 7 luglio 1975, che
    ripristina la riscossione dei dazi doganali applicabili alle altre pelli ovine
    preparate, non nominate, della sottovoce doganale 41.03 B II, originarie dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3054/74 del Consiglio, del 2 dicembre 1974
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1747/75 van de Commissie van 7 juli 1975 houdende
    wederinstelling van de heffing van de douanerechten voor ander schapeleder, alsmede
    voorgelooide huiden en vellen, overige, van onderverdeling 41.03 B II, van oorsprong
    uit de ontwikkelingslanden ten behoeve waarvan bij Verordening (EEG) nr. 3054/74
    van de Raad van 2 december 1974 tariefpreferenties werden geopend
  type: main
