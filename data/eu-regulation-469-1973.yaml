title:
- language: en
  script: Latn
  content: Regulation (EEC) No 469/73 of the Commission of 31 January 1973 on transitional
    measures to be taken in view of Accession with regard to provisions for implementing
    the systems of import levies, export refunds, export licences and advance fixing
    certificates
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 469/73 de la Commission, du 31 janvier 1973, relatif
    aux mesures transitoires à prendre du fait de l'adhésion de nouveaux États
    membres, concernant les dispositions d'application des régimes des prélèvements
    à l'importation, des restitutions à l'exportation et des certificats d'exportation
    et de préfixation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 469/73 der Kommission vom 31. Januar 1973 über die
    Übergangsmaßnahmen, die infolge des Beitritts hinsichtlich der Durchführungsbestimmungen
    der Regelungen für Einfuhrabschöpfungen, Ausfuhrerstattungen sowie Ausfuhrlizenzen
    und Vorausfestsetzungsbescheinigungen zu ergreifen sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 469/73 af 31. januar 1973 om de overgangsforanstaltninger,
    som på grund af tiltrædelsen skal træffes vedrørende gennemførelsesbestemmelserne
    for ordningerne med importafgifter, eksportrestitutioner, eksportlicenser og forudfastsættelsesattester
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 469/73 della Commissione, del 31 gennaio 1973, che
    stabilisce le misure transitorie da adottare a seguito dell'adesione di nuovi
    Stati membri per quanto riguarda le disposizioni di applicazione dei regimi dei
    prelievi all'importazione, delle restituzioni all'esportazione e dei titoli di
    esportazione e di fissazione anticipata
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 469/73 van de Commissie van 31 januari 1973 betreffende
    de ingevolge de toetreding van de nieuwe Lid-Staten te nemen overgangsmaatregelen
    met betrekking tot de uitvoeringsbepalingen van de regelingen inzake de invoerheffingen,
    de uitvoerrestituties en de uitvoer- en voorfixatiecertificaten
  type: main
