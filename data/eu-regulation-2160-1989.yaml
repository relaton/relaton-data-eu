title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2160/89 of 18 July 1989 re-establishing
    the levying of customs duties on sacks and bags (including cones) of polymers
    of ethylene falling within CN code 3923 21 00 originating in Thailand to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 4257/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2160/89 de la Commission du 18 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux sacs, sachets,
    pochettes et cornets en polymères de l'éthylène du code de la nomenclature
    combinée 3923 21 00 originaires de la Thaïlande bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2160/89 DER KOMMISSION vom 18. Juli 1989 zur Wiedereinführung
