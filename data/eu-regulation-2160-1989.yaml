    des Ethylens des KN-Code 3923 21 00 mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2160/89 af 18. juli 1989 om genindførelse
