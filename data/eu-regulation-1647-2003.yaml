  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1647/2003 van de Raad van 18 juni 2003 tot wijziging
    van Verordening (EEG) nr. 2309/93 tot vaststelling van communautaire procedures
    voor het verlenen van vergunningen voor en het toezicht op geneesmiddelen voor
    menselijk en diergeneeskundig gebruik en tot oprichting van een Europees Bureau
    voor de geneesmiddelenbeoordeling
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) NR 1647/2003 z dnia 18 czerwca 2003 r. zmieniające
    rozporządzenie (EWG) nr 2309/93 ustanawiające wspólnotowe procedury wydawania
    pozwoleń dla produktów leczniczych stosowanych u ludzi i do celów weterynaryjnych
    i nadzoru nad nimi oraz ustanawiające Europejską Agencję ds. Oceny Produktów
    Leczniczych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1647/2003 do Conselho, de 18 de Junho de 2003, que
    altera o Regulamento (CEE) n.° 2309/93 que estabelece procedimentos comunitários
    de autorização e fiscalização de medicamentos de uso humano e veterinário
    e institui uma Agência Europeia de Avaliação dos Medicamentos
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1647/2003 z 18. júna 2003, ktorým sa mení a
    dopĺňa nariadenie (EHS) č. 2309/93, na základe ktorého sa stanovujú postupy
    spoločenstva v oblasti povoľovania a kontroly liekov pre použitie v humánnej
    a veterinárnej medicíne a zriaďuje sa Európska agentúra na hodnotenie liekov
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1647/2003 z dne 18. junija 2003 o spremembi Uredbe
    (EGS) št. 2309/93, ki določa postopke Skupnosti za pridobitev dovoljenja za
    promet in nadzor zdravil za uporabo v humani medicini in za uporabo v veterini
    ter ustanavlja Evropsko agencijo za vrednotenje zdravil
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1647/2003 del Consejo, de 18 de junio de 2003, por
    el que se modifica el Reglamento (CEE) n° 2309/93 por el que se establecen procedimientos
    comunitarios para la autorización y supervisión de medicamentos de uso humano
    y veterinario y por el que se crea la Agencia Europea para la Evaluación de Medicamentos
  type: main
- language: sv
  script: Latn
