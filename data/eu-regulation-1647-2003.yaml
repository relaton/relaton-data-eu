    e la vigilanza dei medicinali per uso umano e veterinario e che istituisce un'Agenzia
    europea di valutazione dei medicinali
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1647/2003 (2003. gada 18. jūnijs), ar kuru groza
