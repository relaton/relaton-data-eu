title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1647/2003 of 18 June 2003 amending Regulation
    (EEC) No 2309/93 laying down Community procedures for the authorisation and supervision
    of medicinal products for human and veterinary use and establishing a European
    Agency for the evaluation of Medicinal Products
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1647/2003 du Conseil du 18 juin 2003 modifiant le règlement
    (CEE) n° 2309/93 établissant des procédures communautaires pour l'autorisation
    et la surveillance des médicaments à usage humain et à usage vétérinaire
    et instituant une Agence européenne pour l'évaluation des médicaments
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1647/2003 des Rates vom 18. Juni 2003 zur Änderung
    der Verordnung (EWG) Nr. 2309/93 zur Festlegung von Gemeinschaftsverfahren für
    die Genehmigung und Überwachung von Human- und Tierarzneimitteln und zur Schaffung
    einer Europäischen Agentur für die Beurteilung von Arzneimitteln
  type: main
- language: cs
  script: Latn
  content: Nařízení rady (ES) č. 1647/2003 ze dne 18. června 2003, kterým se
    mění nařízení (EHS) č. 2309/93, kterým se stanoví postupy Společenství
    pro registraci a dozor nad humánními a veterinárními léčivými přípravky
    a zřizuje se Evropská agentura pro hodnocení léčivých přípravků
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1647/2003 af 18. juni 2003 om ændring af forordning
    (EØF) nr. 2309/93 om fastlæggelse af fællesskabsprocedurer for godkendelse
    og overvågning af human- og veterinærmedicinske lægemidler og om oprettelse
    af et europæisk agentur for lægemiddelvurdering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1647/2003 του Συμβουλίου,
    της 18ης Ιουνίου 2003, για την τροποποίηση του
    κανονισμού (ΕΟΚ) αριθ. 2309/93 για τη θέσπιση κοινοτικών
    διαδικασιών έγκρισης και εποπτείας των φαρμακευτικών
    προϊόντων για ανθρώπινη και κτηνιατρική χρήση
    και για τη σύσταση Ευρωπαϊκού Οργανισμού για
    την Αξιολόγηση των Φαρμακευτικών Προϊόντων
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1647/2003, 18. juuni 2003, millega muudetakse
    määrust (EMÜ) nr 2309/93, milles sätestatakse ühenduse kord inimtervishoius
    ja veterinaarias kasutatavate ravimite lubade andmise ja järelevalve kohta ning
    millega asutatakse Euroopa Ravimihindamisamet
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1647/2003, annettu 18 päivänä kesäkuuta 2003,
    ihmisille ja eläimille tarkoitettuja lääkkeitä koskevista yhteisön luvananto-
    ja valvontamenettelyistä sekä Euroopan lääkearviointiviraston perustamisesta
    annetun asetuksen (ETY) N:o 2309/93 muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1647/2003/EK rendelete (2003. június 18.) az emberi, illetve
