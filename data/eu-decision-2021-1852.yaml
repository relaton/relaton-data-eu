  content: Neuvoston päätös (EU) 2021/1852, annettu 18 päivänä lokakuuta 2021,
    Euroopan yhteisön ja sen jäsenvaltioiden sekä Algerian demokraattisen kansantasavallan
    välisestä assosiaatiosta tehdyllä Euro–Välimeri-sopimuksella perustetussa
    assosiaationeuvostossa unionin puolesta otettavasta kannasta EU:n ja Algerian
