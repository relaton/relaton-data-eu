  type: main
- language: hr
  script: Latn
  content: Odluka Vijeća (EU) 2021/1852 od 18. listopada 2021. o stajalištu koje
    treba zauzeti u ime Europske unije u okviru Vijeća za pridruživanje osnovanog
    Euro-mediteranskim sporazumom o pridruživanju između Europske zajednice i njezinih
    država članica, s jedne strane, i Alžirske Narodne Demokratske Republike, s
    druge strane, u pogledu produljenja valjanosti Prioriteta partnerstva EU–Alžir
    dok Vijeće za pridruživanje ne donese nove ažurirane Prioritete partnerstva
  type: main
- language: hu
  script: Latn
  content: A Tanács (EU) 2021/1852 határozata (2021. október 18.) az Európai Unió
    által az egyrészről az Európai Közösség és tagállamai, másrészről
    az Algériai Demokratikus és Népi Köztársaság közötti társulás létrehozásáról
    szóló euromediterrán megállapodással létrehozott Társulási Tanácsban
    az EU–Algéria partnerségi prioritások érvényességének az új, aktualizált
    partnerségi prioritások Társulási Tanács általi elfogadásáig történő
    meghosszabbítása tekintetében képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2021/1852 del Consiglio del 18 ottobre 2021 relativa alla
    posizione che dovrà essere assunta a nome dell’Unione europea nel consiglio
    di associazione istituito dall’accordo euromediterraneo che istituisce un’associazione
    tra la Comunità europea e i suoi Stati membri, da una parte, e la Repubblica
    algerina democratica e popolare, dall’altra, in merito alla proroga della validità
    delle priorità del partenariato UE-Algeria finché non saranno adottate dal consiglio
    di associazione nuove priorità del partenariato aggiornate
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums (ES) 2021/1852 (2021. gada 18. oktobris) par nostāju,
    kas Eiropas Savienības vārdā jāieņem Asociācijas padomē, kura izveidota
    ar Eiropas un Vidusjūras valstu nolīgumu, ar ko izveido asociāciju starp Eiropas
    Kopienu un tās dalībvalstīm, no vienas puses, un Alžīrijas Tautas Demokrātisko
    Republiku, no otras puses, attiecībā uz ES un Alžīrijas partnerības prioritāšu
    spēkā esības termiņa pagarināšanu līdz brīdim, kad Asociācijas padome
    būs pieņēmusi jaunas, atjauninātas partnerības prioritātes
  type: main
