title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1852 of 18 October 2021 on the position to be
    taken on behalf of the European Union within the Association Council set up by
    the Euro-Mediterranean Agreement establishing an Association between the European
    Community and its Member States, of the one part, and the People’s Democratic
    Republic of Algeria, of the other part, as regards the extension of the validity
    of the EU-Algeria partnership priorities until new updated partnership priorities
    are adopted by the Association Council
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1852 du Conseil du 18 octobre 2021 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    la Communauté européenne et ses États membres, d’une part, et la République
    algérienne démocratique et populaire, d’autre part, concernant la prorogation
    de la validité des priorités du partenariat UE-Algérie jusqu’à l’adoption
    par le Conseil d’association de nouvelles priorités actualisées pour le partenariat
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1852 des Rates vom 18. Oktober 2021 über den Standpunkt,
    der im Namen der Europäischen Union in dem durch das Europa-Mittelmeer-Abkommen
    zur Gründung einer Assoziation zwischen der Europäischen Gemeinschaft und ihren
    Mitgliedstaaten einerseits und der Demokratischen Volksrepublik Algerien andererseits
    eingesetzten Assoziationsrat im Hinblick auf eine Verlängerung der Gültigkeit
    der Partnerschaftsprioritäten EU-Algerien bis zur Annahme neuer aktualisierter
    Partnerschaftsprioritäten durch den Assoziationsrat zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2021/1852 на Съвета от 18 октомври
    2021 година за позицията, която трябва да се заеме
    от името на Европейския съюз в рамките на Съвета
    по асоцииране, създаден с Евро-средиземноморското
    споразумение за асоцииране между Европейската
    общност и нейните държави членки, от една страна,
    и Народна демократична република Алжир, от
    друга страна, във връзка с удължаването на
    срока на валидност на приоритетите за партньорство
    между ЕС и Алжир до приемането на нови актуализирани
    приоритети за партньорство от Съвета по асоцииране
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2021/1852 ze dne 18. října 2021 o postoji, který
    má být zaujat jménem Evropské unie v Radě přidružení zřízené Evropsko-středomořskou
    dohodou zakládající přidružení mezi Evropským společenstvím a jeho členskými
    státy na jedné straně a Alžírskou demokratickou a lidovou republikou na straně
    druhé k prodloužení platnosti priorit partnerství EU-Alžírsko do doby, než
    Rada přidružení přijme nové aktualizované priority partnerství
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse (EU) 2021/1852 af 18. oktober 2021 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i det associeringsråd, der
    er oprettet ved Euro-Middelhavsaftalen om oprettelse af en associering mellem
    Det Europæiske Fællesskab og dets medlemsstater på den ene side og Den Demokratiske
    Folkerepublik Algeriet på den anden side, for så vidt angår forlængelse af
    gyldigheden af prioriteterne for partnerskabet mellem EU og Algeriet, indtil associeringsrådet
    har vedtaget nye ajourførte prioriteter for partnerskabet
  type: main
