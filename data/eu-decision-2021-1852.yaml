    Europos ir Viduržemio jūros regiono šalių susitarimu, įsteigiančiu Europos
    bendrijos bei jos valstybių narių ir Alžyro Liaudies Demokratinės Respublikos
    asociaciją, dėl ES ir Alžyro partnerystės prioritetų galiojimo pratęsimo,
    kol Asociacijos taryba priims naujus atnaujintus partnerystės prioritetus
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2021/1852 tat-18 ta’ Ottubru 2021 dwar il-pożizzjoni
    li għandha tittieħed f’isem l-Unjoni Ewropea fi ħdan il-Kunsill ta’ Assoċjazzjoni
    stabbilit mill-Ftehim Ewro-Mediterranju li jistabbilixxi Assoċjazzjoni bejn il-Komunità
    Ewropea u l-Istati Membri tagħha, min-naħa l-waħda, u r-Repubblika Demokratika
    tal-Poplu tal-Alġerija, min-naħa l-oħra, fir-rigward tal-estensjoni tal-validità
    tal-prijoritajiet tas-sħubija bejn l-UE u l-Alġerija sakemm ikunu adottati prijoritajiet
    tas-sħubija aġġornati ġodda mill-Kunsill ta’ Assoċjazzjoni
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2021/1852 van de Raad van 18 oktober 2021 inzake het namens
    de Europese Unie in te nemen standpunt in de Associatieraad die is ingesteld bij
    de Europees-mediterrane overeenkomst waarbij een associatie tot stand wordt gebracht
    tussen de Europese Gemeenschap en haar lidstaten, enerzijds, en de Democratische
    Volksrepubliek Algerije, anderzijds, over de geplande vaststelling van een besluit
    tot verlenging van de geldigheid van de partnerschapsprioriteiten EU-Algerije
    totdat de Associatieraad nieuwe geactualiseerde partnerschapsprioriteiten heeft
    vastgesteld
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2021/1852 z dnia 18 października 2021 r. w sprawie stanowiska,
    jakie ma być zajęte w imieniu Unii Europejskiej w ramach Rady Stowarzyszenia
    ustanowionej na mocy Układu eurośródziemnomorskiego ustanawiającego stowarzyszenie
    między Wspólnotą Europejską I jej państwami członkowskimi, z jednej strony,
    a Algierską Republiką Ludowo-Demokratyczną, z drugiej strony, w odniesieniu
    do przedłużenia obowiązywania priorytetów partnerstwa UE–Algieria do czasu
    przyjęcia przez Radę Stowarzyszenia nowych, zaktualizowanych priorytetów partnerstwa
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2021/1852 do Conselho de 18 de outubro de 2021 relativa à
    posição a tomar, em nome da União Europeia, no âmbito do Conselho de Associação
    instituído pelo Acordo Euro-Mediterrânico que cria uma associação entre a
    Comunidade Europeia e os seus Estados-Membros, por um lado, e a República Argelina
    Democrática e Popular, por outro, no que respeita à prorrogação da validade
    das Prioridades da Parceria UE-Argélia até que o Conselho de Associação adote
    novas Prioridades da Parceria atualizadas
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2021/1852 a Consiliului din 18 octombrie 2021 privind poziția
    care urmează să fie adoptată, în numele Uniunii Europene, în cadrul Consiliului
    de asociere înființat prin Acordul euro-mediteraneean de instituire a unei asocieri
    între Comunitățile Europene și statele membre ale acestora, pe de o parte,
    și Republica Algeriană Democratică și Populară, pe de altă parte, referitoare
    la prelungirea valabilității priorităților parteneriatului UE-Algeria până
    la adoptarea de către Consiliul de asociere a unor noi priorități actualizate
    ale parteneriatului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2021/1852 z 18. októbra 2021 o pozícii, ktorá
    sa má v mene Európskej únie zaujať v Asociačnej rade zriadenej Euro-stredomorskou
    dohodou o pridružení medzi Európskym spoločenstvom a jeho členskými štátmi
    na jednej strane a Alžírskou demokratickou ľudovou republikou na strane druhej,
    pokiaľ ide o predĺženie platnosti priorít partnerstva medzi EÚ a Alžírskom
    dovtedy, kým Asociačná rada neprijme nové aktualizované priority partnerstva
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2021/1852 z dne 18. oktobra 2021 o stališču, ki se v
    imenu Evropske unije zastopa v Pridružitvenem svetu, ustanovljenem z Evro-mediteranskim
    sporazumom o pridružitvi med Evropsko skupnostjo in njenimi državami članicami
    na eni strani ter Ljudsko demokratično republiko Alžirijo na drugi strani, v
    zvezi s podaljšanjem veljavnosti prednostnih nalog partnerstva EU-Alžirija,
    dokler Pridružitveni svet ne sprejme novih posodobljenih prednostnih nalog partnerstva
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2021/1852 del Consejo de 18 de octubre de 2021 relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación instituido por el Acuerdo Euromediterráneo por el que se establece
    una asociación entre la Comunidad Europea y sus Estados miembros, por una parte,
    y la República Argelina Democrática y Popular, por otra, en lo que respecta
    a la prórroga de la validez de las prioridades de la Asociación UE-Argelia hasta
    que el Consejo de Asociación adopte nuevas prioridades de la Asociación actualizadas
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2021/1852 av den 18 oktober 2021 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i det associeringsråd som inrättats
    genom Europa–Medelhavsavtalet om upprättande av en associering mellan Europeiska
    gemenskapen och dess medlemsstater, å ena sidan, och Demokratiska folkrepubliken
    Algeriet, å andra sidan, vad gäller en förlängning av giltighetstiden för
    prioriteringarna för partnerskapet EU–Algeriet fram till dess att nya uppdaterade
    prioriteringar för partnerskapet antas av associeringsrådet
  type: main
