    skraćenog roka za prethodnu obavijest prije dolaska u luku ribarskih plovila
    Unije sveukupne duljine 12 metara ili više koja se bave ribolovom stokova na
    koje se primjenjuju Uredba (EU) 2019/472 Europskog parlamenta i Vijeća i Uredba
    (EU) 2019/1022 Europskog parlamenta i Vijeća i koja iskrcavaju u španjolskim
    lukama
  type: main
- language: hu
  script: Latn
