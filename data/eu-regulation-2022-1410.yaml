title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/1410 of 18 August 2022 providing
    for a reduced prior notification period before arrival at port for Union fishing
    vessels of 12 metres’ length overall or more engaged in fisheries on stocks
    subject to Regulation (EU) 2019/472 of the European Parliament and of the Council
    and Regulation (EU) 2019/1022 of the European Parliament and of the Council landing
    in Spanish ports
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/1410 de la Commission du 18 août 2022
    prévoyant une réduction du délai de notification préalable avant l’arrivée
    au port pour les navires de pêche de l’Union d’une longueur hors tout de
    12 mètres au moins exerçant des activités de pêche dans des stocks soumis
    au règlement (UE) 2019/472 du Parlement européen et du Conseil et au règlement
    (UE) 2019/1022 du Parlement européen et du Conseil débarquant dans les ports
    espagnols
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/1410 der Kommission vom 18. August 2022
    zur Festlegung einer verkürzten Anmeldefrist vor der Ankunft im Hafen für Fischereifahrzeuge
    der Union mit einer Länge über alles von 12 m oder mehr, die Bestände befischen,
    die unter die Verordnung (EU) 2019/472 des Europäischen Parlaments und des Rates
    und die Verordnung (EU) 2019/1022 des Europäischen Parlaments und des Rates fallen,
    und in spanischen Häfen anlanden
  type: main
- language: bg
  script: Cyrl
