    срок за предварително уведомление преди пристигане
    в пристанище за риболовните кораби на Съюза
    с обща дължина 12 метра или повече, които извършват
    риболов на запасите, попадащи в обхвата на
    Регламент (ЕС) 2019/472 на Европейския парламент
    и на Съвета и на Регламент (ЕС) 2019/1022 на Европейския
    парламент и на Съвета, и разтоварват в испански
    пристанища
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/1410 ze dne 18. srpna 2022, kterým
