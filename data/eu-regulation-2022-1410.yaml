    hatálya alá tartozó állományokra halászó, fogásaikat spanyol kikötőkben
    kirakodó, legalább 12 méter teljes hosszúságú uniós halászhajók tekintetében
    a kikötőbe érkezés előtti előzetes értesítési időtartam lerövidítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/1410 della Commissione del 18 agosto
    2022 che prevede una riduzione del termine di notifica preventiva prima dell’arrivo
    in porto di pescherecci dell’Unione di lunghezza fuori tutto pari o superiore
    a 12 metri impegnati in attività di pesca di stock soggetti al regolamento (UE)
    2019/472 del Parlamento europeo e del Consiglio e al regolamento (UE) 2019/1022
    del Parlamento europeo e del Consiglio che sbarcano in porti spagnoli
  type: main
