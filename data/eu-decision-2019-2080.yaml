    laist tirgū produktus, kas satur ģenētiski modificēto kukurūzu MZHG0JG (SYN-ØØØJG-2),
    no tās sastāv vai ir no tās ražoti (izziņots ar dokumenta numuru C(2019)
    7477) (Autentisks ir tikai teksts franču un nīderlandiešu valodā)
  type: main
