    28.) a géntechnológiával módosított MZHG0JG (SYN-ØØØJG-2) kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2019) 7477. számú dokumentummal történt) (Csak a holland
