  script: Latn
  content: Decisione di esecuzione (UE) 2019/2080 della Commissione del 28 novembre
    2019 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato MZHG0JG (SYN-ØØØJG-2) in conformità
    al regolamento (CE) n. 1829/2003 del Parlamento europeo e del Consiglio [notificata
    con il numero C(2019) 7477] (I testi in lingua francese e neerlandese sono i soli
    facenti fede)
  type: main
