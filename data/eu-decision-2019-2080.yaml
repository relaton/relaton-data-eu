    се или произведени от генетично модифицирана
    царевица MZHG0JG (SYN-ØØØJG-2), в съответствие с Регламент
    (ЕО) № 1829/2003 на Европейския парламент и на Съвета
    (нотифицирано под номер C(2019) 7477) (само текстовете
    на нидерландски и френски език са автентични)
  type: main
