    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    MZHG0JG (SYN-ØØØJG-2), sestávají z ní nebo jsou z ní vyrobeny, na trh podle
    nařízení Evropského parlamentu a Rady (ES) č. 1829/2003 (oznámeno pod číslem
    C(2019) 7477) (Pouze nizozemské a fran ouzské znění je závazné)
  type: main
