    2019 de autorizare a introducerii pe piață a produselor care conțin, constau
    în sau sunt fabricate din porumb modificat genetic MZHG0JG (SYN-ØØØJG-2),
    în temeiul Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al
    Consiliului [notificată cu numărul C(2019) 7477] (Numai textul în limbile franceză
