    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    MZHG0JG (SYN-ØØØJG-2), kurie iš jų sudaryti arba kurie iš jų pagaminti
    (pranešta dokumentu Nr. C(2019) 7477) (Tekstas autentiškas tik nyderlandų ir
