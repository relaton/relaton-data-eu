title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2019/2080 of 28 November 2019 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize MZHG0JG (SYN-ØØØJG-2), pursuant to Regulation (EC)
    No 1829/2003 of the European Parliament and of the Council (notified under document
    C(2019) 7477) (Only the Dutch and French texts are authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2019/2080 de la Commission du 28 novembre
    2019 autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié MZHG0JG (SYN-ØØØJG-2), consistant en ce maïs ou produits à partir
    de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2019) 7477] (Les textes en langues
    française et néerlandaise sont les seuls faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2019/2080 der Kommission vom 28. November
    2019 über die Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch
    veränderten Mais der Sorte MZHG0JG (SYN-ØØØJG-2) enthalten, aus ihm bestehen
    oder aus ihm gewonnen werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen
    Parlaments und des Rates (Bekannt gegeben unter Aktenzeichen C(2019) 7477) (Nur
    der französische und niederländische Text sind verbindlich)
  type: main
- language: bg
  script: Cyrl
