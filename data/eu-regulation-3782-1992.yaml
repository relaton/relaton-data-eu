    einiger Interventionsstellen nach dem Verfahren der Verordnung (EWG) Nr. 2539/84
    und zur Aufhebung der Verordnungen (EWG) Nr. 2315/92 und Nr. 3028/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3782/92 af 28. december 1992 om salg
