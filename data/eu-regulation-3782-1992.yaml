  script: Latn
  content: Commission Regulation (EEC) No 3782/92 of 28 December 1992 on the sale
    by the procedure laid down in Regulation (EEC) No 2539/84 of bone-in beef held
    by certain intervention agencies and intended for export, repealing Regulation
    (EEC) No 2315/92 and (EEC) No 3028/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3782/92 de la Commission, du 28 décembre 1992, relatif
