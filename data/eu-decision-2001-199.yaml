  script: Latn
  content: '2001/199/EC: Commission Decision of 9 March 2001 authorising the Member
    States to provide for derogations from certain provisions of Council Directive
    2000/29/EC in respect of potatoes, other than potatoes intended for planting,
    originating in New Zealand (notified under document number C(2001) 685)'
  type: main
- language: fr
  script: Latn
