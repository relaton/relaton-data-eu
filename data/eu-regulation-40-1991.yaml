    sommige produkten van oorsprong uit Japan #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 40/91 DA COMISSÃO de 7 de Janeiro de 1991 que prorroga
    a vigilância comunitária das importações de determinados produtos originários
    do Japão #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) Nº 40/91 DE LA COMISIÓN de 7 de enero de 1991 por el
