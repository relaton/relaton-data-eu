  content: Commission Regulation (EEC) No 40/91 of 7 January 1991 extending retrospective
    Community surveillance of imports of certain products originating in Japan
  type: main
- language: fr
  script: Latn
  content: 'RÈGLEMENT (CEE) No 40/91 DE LA COMMISSION du 7 janvier 1991 prorogeant
