    την τροποποίηση, όσον αφορά τα μέτρα διαρθρωτικού
    χαρακτήρα, του κανονισμού (EOK) αριθ. 1601/92 για
    ειδικά μέτρα που αφορούν ορισμένα γεωργικά
    προϊόντα υπέρ των Καναρίων Νήσων
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1450/2001, annettu 28 päivänä kesäkuuta 2001,
    tiettyjä maataloustuotteita koskevista erityistoimenpiteistä Kanariansaarten
    hyväksi annetun asetuksen (ETY) N:o 1601/92 muuttamisesta rakenteellisiin kysymyksiin
    liittyvien toimenpiteiden osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1450/2001 del Consiglio, del 28 giugno 2001, che modifica,
    per quanto concerne le misure in materia strutturale, il regolamento (CEE) n.
    1601/92, relativo a misure specifiche a favore delle isole Canarie per taluni
    prodotti agricoli
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1450/2001 van de Raad van 28 juni 2001 tot wijziging,
    wat de structurele maatregelen betreft, van Verordening (EEG) nr. 1601/92 houdende
    specifieke maatregelen voor bepaalde landbouwproducten ten behoeve van de Canarische
    Eilanden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1450/2001 do Conselho, de 28 de Junho de 2001, que
    altera, no que diz respeito às medidas de carácter estrutural, o Regulamento
    (CEE) n.° 1601/92 que estabelece medidas específicas relativas a determinados
    produtos agrícolas a favor das ilhas Canárias
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1450/2001 del Consejo, de 28 de junio de 2001, por
