title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1450/2001 of 28 June 2001 amending Regulation
    (EEC) No 1601/92 concerning specific measures for the Canary Islands with regard
    to certain agricultural products as regards the structural measures
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1450/2001 du Conseil du 28 juin 2001 modifiant, en
    ce qui concerne les mesures en matière structurelle, le règlement (CEE) n°
    1601/92 relatif à des mesures spécifiques concernant certains produits agricoles
    en faveur des îles Canaries
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1450/2001 des Rates vom 28. Juni 2001 zur Änderung
    der Verordnung (EWG) Nr. 1601/92 zur Einführung von Sondermaßnahmen für bestimmte
    landwirtschaftliche Erzeugnisse zugunsten der Kanarischen Inseln in Bezug auf
    die Strukturmaßnahmen
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1450/2001 af 28. juni 2001 om ændring, for
    så vidt angår strukturforanstaltningerne, af forordning (EØF) nr. 1601/92 om
    særlige foranstaltninger for visse landbrugsprodukter til fordel for De Kanariske
    Øer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1450/2001 του Συμβουλίου,
