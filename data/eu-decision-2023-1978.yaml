  content: Commission Implementing Decision (EU) 2023/1978 of 21 September 2023 on
    the applicability of Article 34 of Directive 2014/25/EU of the European Parliament
    and of the Council to the award of contracts for the activities related to the
    generation and wholesale of electricity from renewable sources in Germany, with
    the exception of electricity from renewable sources generated in installations
    that went into operation before 1 August 2014 and still receive public funding
    and activities related to the generation and wholesale of electricity from offshore
    wind farms commissioned after 1 January 2012 and subject to the 2012 Renewable
    Energy Sources Act (Erneuerbare-Energien-Gesetz) in Germany (notified under document
    C(2023) 6271) (Only the German text is authentic)
  type: main
