  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2023/1978 z dne 21. septembra 2023 o uporabi
    člena 34 Direktive 2014/25/EU Evropskega parlamenta in Sveta za oddajo javnih
    naročil za dejavnosti, povezane s proizvodnjo in veleprodajo električne energije
    iz obnovljivih virov v Nemčiji, z izjemo električne energije iz obnovljivih
    virov, proizvedene v napravah, ki so začele delovati pred 1. avgustom 2014 in
    še vedno prejemajo javna sredstva, ter dejavnosti, povezane s proizvodnjo in
    veleprodajo električne energije iz vetrnih elektrarn na morju, ki so začele
    obratovati po 1. januarju 2012 in za katere se v Nemčiji uporablja zakon o obnovljivih
    virih energije (Erneuerbare-Energien-Gesetz) iz leta 2012 (notificirano pod dokumentarno
    številko C(2023) 6271) (Besedilo v nemškem jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2023/1978 de la Comisión de 21 de septiembre
    de 2023 sobre la aplicabilidad del artículo 34 de la Directiva 2014/25/UE del
    Parlamento Europeo y del Consejo a la adjudicación de contratos para las actividades
    relacionadas con la generación y venta al por mayor de electricidad procedente
    de fuentes renovables en Alemania, con excepción de la electricidad procedente
    de fuentes renovables generada en instalaciones que entraron en funcionamiento
    antes del 1 de agosto de 2014 y todavía reciben financiación pública y las
    actividades relacionadas con la generación y venta al por mayor de electricidad
    procedente de parques eólicos marinos puestos en servicio después del 1 de enero
    de 2012 y sujetos a la Ley de fuentes de energía renovables de 2012 (Erneuerbare-Energien-Gesetz)
    en Alemania [notificada con el número C(2023) 6271] (El texto en lengua alemana
    es el único auténtico)
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2023/1978 av den 21 september 2023
    om tillämpligheten av artikel 34 i Europaparlamentets och rådets direktiv 2014/25/EU
    på tilldelningen av kontrakt för verksamhet som rör produktion och grossistförsäljning
    av el från förnybara källor i Tyskland, med undantag för el från förnybara
    källor som produceras i anläggningar som tagits i drift före den 1 augusti
    2014 och fortfarande får offentlig finansiering, samt verksamhet som rör produktion
    och grossistförsäljning av el från havsbaserade vindkraftverk som tagits i
    drift efter den 1 januari 2012, och som omfattas av 2012 års lag om förnybara
    energikällor (Erneuerbare-Energien-Gesetz) i Tyskland. (delgivet med nr C(2023)
    6271) (Endast den tyska texten är giltig)
  type: main
