id: EUDecision1977701
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 6 May 1977 authorizing the United Kingdom not to
    apply Community treatment to cotton yarn falling within heading No 55.05 of the
    Common Customs Tariff, originating in the Federal Republic of Brazil and in free
    circulation in the Federal Republic of Germany
  type: main
- language: fr
  script: Latn
  content: '77/701/CEE: Décision de la Commission, du 6 mai 1977, autorisant le Royaume-Uni
    à exclure du traitement communautaire les fils de coton, de la position 55.05
    du Tarif douanier commun, originaires de la République fédérale du Brésil
    et mis en libre pratique en République fédérale d''Allemagne'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 6. Mai 1977, mit der das Vereinigte Königreich
    ermächtigt wird, aus der Föderativen Republik Brasilien stammende und in der
    Bundesrepublik Deutschland im freien Verkehr befindliche Baumwollgarne der Tarifnummer
    55.05 des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 6. maj 1977 om bemyndigelse af Det forenede
    Kongerige til fra fællesskabsbehandling at undtage garn af bomuld, der henhører
    under pos. 55.05 i den fælles toldtarif, har oprindelse i forbundsrepublikken
    Brasilien og frit kan omsættes i Forbundsrepublikken Tyskland
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 6 maggio 1977, che autorizza il Regno
    Unito ad escludere dal trattamento comunitario i filati di cotone della voce 55.05
    della tariffa doganale comune originari della Repubblica federale del Brasile
    e messi in libera pratica nella Repubblica federale di Germania
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 6 mei 1977 waarbij het Verenigd Koninkrijk
    wordt gemachtigd garens van katoen van post 55.05 van het gemeenschappelijk douanetarief,
    van oorsprong uit de Federale Republiek Brazilië en in de Bondsrepubliek Duitsland
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
