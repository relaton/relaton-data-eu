title:
- language: fr
  script: Latn
  content: Décision 66/52/CEE de la Commission, du 14 décembre 1965, portant nouvelle
    modification de sa décision du 6 novembre 1964, autorisant la perception de taxes
    compensatoires sur les importations, en République fédérale d'Allemagne, de
    pain et de produits similaires, en provenance du Royaume des Pays-Bas
  type: main
- language: de
  script: Latn
  content: '66/52/EWG: Entscheidung der Kommission vom 14. Dezember 1965 zur erneuten
    Änderung ihrer Entscheidung vom 6. November 1964 über die Erhebung von Ausgleichsabgaben
    auf Einfuhren von Brot und ähnlichen Erzeugnissen aus dem Königreich der Niederlande
    in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/52/CEE: Decisione della Commissione, del 14 dicembre 1965, che modifica
    nuovamente la decisione del 6 novembre 1964, con cui si autorizza la riscossione
    di tasse di compensazione sulle importazioni di pane o di prodotti analoghi nella
    Repubblica federale di Germania dal Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '66/52/EEG: Beschikking van de Commissie van 14 december 1965 tot nieuwe
    wijziging van haar beschikking van 6 november 1964 houdende machtiging tot het
    leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van brood en soortgelijke produkten uit het Koninkrijk der Nederlanden'
  type: main
