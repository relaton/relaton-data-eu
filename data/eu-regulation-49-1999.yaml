title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 49/1999 of 18 December 1998 fixing, for certain
    stocks of highly migratory fish, the total allowable catches for 1999, their distribution
    in quotas to Member States and certain conditions under which they may be fished
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 49/1999 du Conseil du 18 décembre 1998 fixant, pour
    certains stocks de grands migrateurs, les totaux admissibles de capture pour 1999,
    leur répartition par quotas entre les États membres et certaines conditions
    dans lesquelles ces poissons peuvent être pêchés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 49/1999 des Rates vom 18. Dezember 1998 zur Festlegung
    der zulässigen Gesamtfangmengen für 1999, ihrer Aufteilung auf die Mitgliedstaaten
    in Form von Quoten sowie bestimmter Fangbedingungen für bestimmte Bestände weit
    wandernder Fische
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 49/1999 af 18. december 1998 om fastsættelse
    for 1999 af de samlede tilladte fangstmængder for visse bestande af stærkt vandrende
    fiskearter, deres fordeling på kvoter til medlemsstaterne og visse betingelser
    for fiskeri af disse fangstmængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 49/1999 του Συμβουλίου
    της 18ης Δεκεμβρίου 1998 για τον καθορισμό, για
    ορισμένα αποθέματα άκρως μεταναστευτικών
    ψαριών, των συνολικών επιτρεπόμενων αλιευμάτων
    για το 1999, της κατανομής τους σε ποσοστώσεις
    στα κράτη μέλη και ορισμένων όρων υπό τους
    οποίους είναι δυνατόν να αλιεύονται
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 49/1999, annettu 18 päivänä joulukuuta 1998,
    laajasti vaeltavien kalakantojen suurimmista sallituista saaliista vuodelle 1999,
    niiden jakamisesta kiintiöinä jäsenvaltioille ja niiden kalastamista koskevista
    edellytyksistä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 49/1999 del Consiglio del 18 dicembre 1998 che stabilisce,
    per alcuni stock di specie ittiche altamente migratorie, il totale ammissibile
    di catture per il 1999, la loro ripartizione sotto forma di contingenti tra gli
    Stati membri e talune condizioni per la pesca di questi stock
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 49/1999 van de Raad van 18 december 1998 inzake de
    vaststelling van de voor 1999 geldende totaal toegestane vangsten voor bepaalde
    soorten over grote afstanden trekkende visbestanden, de verdeling daarvan in quota
    voor de lidstaten, alsmede bepaalde bij de visserij in acht te nemen voorschriften
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 49/1999 do Conselho de 18 de Dezembro de 1998 que
    fixa, os totais admissíveis de capturas de determinadas unidades populacionais
    de peixes altamente migradores para 1999, a sua repartição em quotas pelos Estados-membros
    e certas condições em que podem ser pescados
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 49/1999 del Consejo de 18 de diciembre de 1998 por
    el que se establecen, para 1999, los totales admisibles de capturas de determinadas
    poblaciones de peces altamente migratorios, su distribución en cuotas entre los
    Estados miembros y determinadas condiciones en que pueden pescarse
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 49/1999 av den 18 december 1998 om fastställande
