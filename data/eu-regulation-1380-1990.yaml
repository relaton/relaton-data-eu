  content: Commission Regulation (EEC) No 1380/90 of 22 May 1990 re-establishing the
    levying of customs duties on gloves, mittens and mitts, knitted or crocheted,
    products of category 10 (order No 40.0100), originating in Pakistan, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3897/89
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1380/90 de la Commission du 22 mai 1990 portant rétablissement
    de la perception des droits de douane applicables à la ganterie de bonneterie
    de la catégorie de produits n° 10 (numéro d'ordre 40.0100) originaires du Pakistan,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3897/89 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 1380/90 DER KOMMISSION vom 22. Mai 1990 ueber die
