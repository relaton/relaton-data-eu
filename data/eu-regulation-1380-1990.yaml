    10 (laufende Nummer 40.0100) mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 3897/89 des Rates vorgesehenen Zollpraeferenzen gewaehrt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1380/90 af 22. maj 1990 om genindførelse
