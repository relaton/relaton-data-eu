title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1045/2001 of 30 May 2001 deferring the final
    date for sowing certain arable crops in certain regions in the 2001/02 marketing
    year and derogating from Regulation (EC) No 2316/1999 laying down detailed rules
    for the application of Council Regulation (EC) No 1251/1999 establishing a support
    system for producers of certain arable crops
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1045/2001 de la Commission du 30 mai 2001 concernant
    le report de la date limite des semis de certaines cultures arables dans certaines
    régions effectués au titre de la campagne 2001/2002 et dérogeant au règlement
    (CE) n° 2316/1999 portant modalités d'application du règlement (CE) n° 1251/1999
    du Conseil instituant un régime de soutien aux producteurs de certaines cultures
    arables
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1045/2001 der Kommission vom 30. Mai 2001 zur Verlängerung
    der Frist für die Aussaat einiger landwirtschaftlicher Kulturpflanzen in bestimmten
    Regionen für das Wirtschaftsjahr 2001/02 und zur Abweichung von der Verordnung
    (EG) Nr. 2316/1999 mit Durchführungsbestimmungen zur Verordnung (EG) Nr. 1251/1999
    des Rates zur Einführung einer Stützungsregelung für Erzeuger bestimmter landwirtschaftlicher
    Kulturpflanzen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1045/2001 af 30. maj 2001 om udskydelse
