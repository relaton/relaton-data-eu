    2001/02 og om fravigelse af forordning (EF) nr. 2316/1999 om gennemførelsesbestemmelser
    til Rådets forordning (EF) nr. 1251/1999 om indførelse af en støtteordning
    for producenter af visse markafgrøder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1045/2001 της Επιτροπής,
    της 30ής Μαΐου 2001, σχετικά με τη μετάθεση της
    ημερομηνίας λήξης της σποράς ορισμένων αροτραίων
    καλλιεργειών σε ορισμένες περιφέρειες, η οποία
    πραγματοποιείται στο πλαίσιο της περιόδου
    2001/02 και σχετικά με παρέκκλιση από τον κανονισμό
