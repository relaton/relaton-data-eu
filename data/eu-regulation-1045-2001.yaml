    των παραγωγών ορισμένων αροτραίων καλλιεργειών
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1045/2001, annettu 30 päivänä toukokuuta 2001,
    tiettyjen peltokasvien kylvöjä markkinointivuonna 2001—2002 tietyillä alueilla
    koskevan määräajan pidentämisestä ja tukijärjestelmästä tiettyjen peltokasvien
    viljelijöille annetun neuvoston asetuksen (EY) N:o 1251/1999 soveltamista koskevista
    yksityiskohtaisista säännöistä annetusta asetuksesta (EY) N:o 2316/1999 poikkeamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1045/2001 della Commissione, del 30 maggio 2001, relativo
    alla proroga della data limite per le semine di taluni seminativi relative alla
