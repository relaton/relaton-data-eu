    recante modalità di applicazione del regolamento (CE) n. 1251/1999 del Consiglio,
    che istituisce un regime di sostegno ai coltivatori di taluni seminativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1045/2001 van de Commissie van 30 mei 2001 tot verschuiving
