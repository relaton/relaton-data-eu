title:
- language: en
  script: Latn
  content: '78/831/EEC: Commission Decision of 22 September 1978 authorizing Ireland
    not apply Community treatment to woven cotton terry fabrics; toilet and kitchen
    linen of woven cotton terry fabrics, falling within heading No 55.08 or subheading
    ex 62.02 B of the Common Customs Tariff (NIMEXE codes 55.08-10, 30, 50, 80; 62.02-71),
    originating in India and in free circulation in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/831/CEE: Décision de la Commission, du 22 septembre 1978, autorisant
    l'' Irlande à exclure du traitement communautaire les tissus de coton bouclés
    du genre éponge; linge de toilette, d'' office ou de cuisine, bouclé du genre
    éponge, de coton, de la position 55.08 et de la sous-position ex 62.02 B du tarif
    douanier commun (codes Nimexe: 55.08-10; 30; 50; 80 et 62.02-71), originaires
    d'' Inde et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/831/EWG: Entscheidung der Kommission vom 22. September 1978, mit der
    Irland ermächtigt wird, aus Indien stammende und in den úbrigen Mitgliedstaaten
    im freien Verkehr befindliche Schlingengewebe (Frottiergewebe) aus Baumwolle;
    Wásche zur Kórperpflege und andere Haushaltswásche aus Schlingengeweben (Frottiergeweben)
    aus Baumwolle, der Tarifnummern 55.08 und ex 62.02 B des Gemeinsamen Zolltarifs
    (NIMEXE-Kennziffern 55.08-10; 30; 50; 80 - 62.02-71) von der Gemeinschaftsbehandlung
    auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/831/EØF: Kommissionens beslutning af 22. september 1978 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage håndklædefrotterstof og
    lignende frotterstof af bomuld; håndklæder, vaskeklude og viskestykker og lignende,
    frotterstof af bomuld, som henhører under pos. 55.08 og ex 62.02 B i den fælles
    toldtarif (NIMEXE-kode 55.08-10, 30, 50, 80; 62.02-71), har oprindelse i Indien
    og frit kan omsættes i de øvrige medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/831/CEE: Decisione della Commissione, del 22 settembre 1978, che autorizza
    l'' Irlanda ad escludere dal trattamento comunitario tessuti di cotone ricci del
    tipo spugna, biancheria da toletta, da servizio o da cucina, riccia del genere
    spugna, di cotone, della voce 55.08 e della sottovoce ex 62.02 B della tariffa
    doganale comune (codice Nimexe: 55.08-10; 30; 50; 80 - 62.02-71), originari dell''
    India e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/831/EEG: Beschikking van de Commissie van 22 september 1978 waarbij
    Ierland wordt gemachtigd bad- of frotteerstof (lussendoek) van katoen ; huishoudlinnen,
    van bad- of frotteerstof (lussendoek) van katoen, van de posten 55.08-10 ; 30
    ; 50 ; 80 - 62.02-71), van oorsprong uit India en in de overige Lid-Staten in
    het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
