    2027 au 31 décembre 2029 pour chaque producteur ou importateur ayant légalement
    mis sur le marché de l’Union des hydrofluorocarbones du 1er janvier 2022 au
    31 décembre 2024 [notifiée sous le numéro C(2026) 3000]
  type: main
