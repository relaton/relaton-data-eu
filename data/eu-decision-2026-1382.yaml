  script: Latn
  content: Commission Implementing Decision (EU) 2026/1382 of 22 June 2026 determining,
    pursuant to Regulation (EU) 2024/573 of the European Parliament and of the Council,
    reference values for the period from 1 January 2027 to 31 December 2029 for each
    producer or importer which has lawfully placed hydrofluorocarbons on the Union
    market from 1 January 2022 to 31 December 2024 (notified under document C(2026)
    3000)
  type: main
