title:
- language: en
  script: Latn
  content: '81/466/EEC: Commission Decision of 27 April 1981 authorizing Ireland not
    to apply Community treatment to footwear with outer soles and uppers of rubber
    or artificial plastic material originating in Taiwan (Only the English text is
    authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/466/CEE: Décision de la Commission, du 27 avril 1981, autorisant l''Irlande
    à exclure du traitement communautaire les chaussures à semelles extérieures
    et dessus en caoutchouc ou en matières plastiques artificielles originaires de
    T''ai-wan (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/466/EWG: Entscheidung der Kommission vom 27. April 1981 zur Ermächtigung
    Irlands, aus Taiwan stammende Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    oder Kunststoff von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/466/EØF: Kommissionens beslutning af 27. april 1981 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage fodtøj med ydersål og overdel
    af gummi eller plast, med oprindelse i Taiwan (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/466/ΕΟΚ: Απόφαση τής Επιτροπής τής 27ης
    Απριλίου 1981 μέ τήν οποία η Ιρλανδία εξουσιοδοτείται
    νά εξαιρέσει από τήν κοινοτική μεταχείριση
    τά υποδήματα τά οποία έχουν τό εξωτερικό πέλμα
    καί τό άνω μέρος αυτών από καουτσούκ ή από τεχνητή
    πλαστική ύλη, καταγωγής Ταϊβάν (Το κείμενο
    στην αγγλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '81/466/CEE: Decisione della Commissione, del 27 aprile 1981, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario le calzature con suole esterne
    e tomaia di gomma o di materia plastica artificiale originarie di Taiwan (Il testo
    in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '81/466/EEG: Beschikking van de Commissie van 27 april 1981 houdende machtiging
    van Ierland om schoeisel met buitenzool en bovendeel van rubber, of van kunstmatige
    plastische stof, van oorsprong uit Taiwan, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
  type: main
