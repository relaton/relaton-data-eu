    und jedem Finanzierungsinstrument für das auswärtige Handeln der Union für
    jedes Programm sowie der Liste der zwischen den Aktionsbereichen im Rahmen des
    Ziels „Europäische territoriale Zusammenarbeit“ für den Zeitraum 2021 bis
    2027 übertragenen Beträge (Bekannt gegeben unter Aktenzeichen C(2022) 131)
