title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/74 of 17 January 2022 setting
    out the list of Interreg programmes and indicating the global amount of the total
    support from the European Regional Development Fund and from each external financing
    instrument of the Union for each programme and the list of the amounts transferred
    between strands under the European territorial cooperation goal for the period
    2021 to 2027 (notified under document C(2022) 131)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/74 de la Commission du 17 janvier 2022
    établissant la liste des programmes Interreg et indiquant le montant total du
    soutien apporté par le Fonds européen de développement régional et par chaque
    instrument de financement extérieur de l’Union pour chaque programme, ainsi
    que la liste des montants transférés entre les volets au titre de l’objectif
    «Coopération territoriale européenne» pour la période 2021-2027 [notifiéé
    sous le numéro C(2022) 131]
  type: main
