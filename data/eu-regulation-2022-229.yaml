    von Burkina Faso, Haiti, Jordanien, den Kaimaninseln, Mali, Marokko, den Philippinen,
    Senegal und Südsudan in die Tabelle unter Nummer I des Anhangs und die Streichung
    von den Bahamas, Botsuana, Ghana, Irak und Mauritius aus dieser Tabelle
