  script: Latn
  content: Commission Delegated Regulation (EU) 2022/229 of 7 January 2022 on amending
    Delegated Regulation (EU) 2016/1675 supplementing Directive (EU) 2015/849 of the
    European Parliament and of the Council, as regards adding Burkina Faso, Cayman
    Islands, Haiti, Jordan, Mali, Morocco, the Philippines, Senegal, and South Sudan
    to the table in point I of the Annex and deleting the Bahamas, Botswana, Ghana,
    Iraq and Mauritius from this table
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/229 de la Commission du 7 janvier 2022
    portant modification du règlement délégué (UE) 2016/1675 complétant la directive
    (UE) 2015/849 du Parlement européen et du Conseil en ce qui concerne l’ajout
    du Burkina Faso, des Îles Caïmans, d’Haïti, de la Jordanie, du Mali, du Maroc,
    des Philippines, du Sénégal et du Soudan du Sud dans le tableau figurant au
    point I de l’annexe et le retrait des Bahamas, du Botswana, du Ghana, de l’Iraq
    et de Maurice de ce tableau
  type: main
- language: de
