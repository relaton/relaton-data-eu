title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2508/97 of 15 December 1997 laying down detailed
    rules for the application to milk and milk products of the schemes provided for
    in the Europe Agreements between the Community and the Republic of Hungary, the
    Republic of Poland, the Czech Republic, the Slovak Republic, Bulgaria and Romania,
    the Agreements on free trade between the Community and the Baltic States and the
    Interim Agreement between the Community and the Republic of Slovenia, and repealing
    Regulations (EEC) No 584/92, (EC) No 1588/94, (EC) No 1713/95 and (EC) No 455/97
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2508/97 de la Commission du 15 décembre 1997 établissant
    les modalités d'application, dans le secteur du lait et des produits laitiers,
    des régimes prévus dans les accords européens entre la Communauté et la République
    de Hongrie, la République de Pologne, la République tchèque, la République
    slovaque, la Bulgarie et la Roumanie, du régime prévu dans les accords sur la
    libéralisation des échanges entre la Communauté et les pays baltes et du régime
    prévu dans l'accord intérimaire entre la Communauté et la Slovénie et abrogeant
    les règlements (CEE) n° 584/92, (CE) n 1588/94, (CE) n° 1713/95 et (CE) n 455/97
  type: main
- language: de
  script: Latn
