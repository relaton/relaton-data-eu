    zu den Regelungen gemäß den Europa-Abkommen zwischen der Gemeinschaft und der
    Republik Ungarn, der Republik Polen, der Tschechischen Republik, der Slowakischen
    Republik, Bulgarien und Rumänien, zu der Regelung gemäß den Freihandelsabkommen
    zwischen der Gemeinschaft und den baltischen Staaten und zu der Regelung gemäß
    dem Interimsabkommen zwischen der Gemeinschaft und Slowenien sowie zur Aufhebung
    der Verordnungen (EWG) Nr. 584/92, (EG) Nr. 1588/94, (EG) Nr. 1713/95 und (EG)
    Nr. 455/97
