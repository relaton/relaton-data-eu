    interinale tra la Comunità e la Repubblica slovena e che abroga i regolamenti
    (CEE) n. 584/92, (CE) n. 1588/94, (CE) n. 1713/95 e (CE) n. 455/97
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2508/97 van de Commissie van 15 december 1997 houdende
    bepalingen voor de uitvoering, in de sector melk en zuivelproducten, van de regelingen
    waarin is voorzien bij de Europa-Overeenkomsten tussen, enerzijds, de Gemeenschap
    en, anderzijds, Hongarije, de Republiek Polen, de Tsjechische Republiek, de Slowaakse
    Republiek, Bulgarije en Roemenië, van de regeling waarin is voorzien bij de overeenkomsten
    betreffende vrijhandel en met handel verband houdende zaken tussen de Gemeenschap
    en de Baltische staten, en van de regeling waarin is voorzien bij de Interim-overeenkomst
    tussen de Gemeenschap en Slovenië, en houdende intrekking van de Verordeningen
    (EEG) nr. 584/92, (EG) nr. 1588/94, (EG) nr. 1713/95 en (EG) nr. 455/97
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2508/97 da Comissão de 15 de Dezembro de 1997 que
    estabelece as regras de execução, no sector do leite e dos produtos lácteos,
    dos regimes previstos nos acordos europeus entre a Comunidade e a República da
    Hungria, a República da Polónia, a República Checa, a República Eslovaca,
    a Bulgária e a Roménia, do regime previsto nos acordos sobre comércio livre
    entre a Comunidade e os países bálticos e do regime previsto no acordo provisório
    entre a Comunidade e a Eslovénia e que revoga os Regulamentos (CEE) nº 584/92,
    (CE) nº 1588/94, (CE) nº 1713/95 e (CE) nº 455/97
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 2508/97 de la Comisión de 15 de diciembre de 1997
    por el que se establecen las disposiciones de aplicación, en el sector de la
    leche y los productos lácteos, de los regímenes establecidos en los Acuerdos
    europeos entre la Comunidad y la República de Hungría, la República de Polonia,
    la República Checa, la República Eslovaca, Bulgaria y Rumanía, del régimen
    establecido en los Acuerdos sobre libre comercio entre la Comunidad y los países
    bálticos y del régimen establecido en el Acuerdo interino entre la Comunidad
    y Eslovenia, y por el que se derogan los Reglamentos (CEE) nº 584/92, (CE) nº
    1588/94, (CE) nº 1713/95 y (CE) nº 455/97
