title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 23 février 1970, autorisant la République
    française à admettre, jusqu'au 30 avril 1970, la commercialisation des semences
    d'une variété de blé dur et d'une variété d'orge brassicole soumises à des
    exigences réduites
  type: main
- language: de
  script: Latn
  content: '70/174/EWG: Entscheidung der Kommission vom 23. Februar 1970 über die
    Ermächtigung der Französischen Republik, bis zum 30. April 1970 Saatgut einer
    Sorte von Hartweizen und einer Sorte Braugerste mit minderen Anforderungen zum
    Verkehr zuzulassen'
  type: main
- language: it
  script: Latn
  content: '70/174/CEE: Decisione della Commissione, del 23 febbraio 1970, che autorizza
    la Repubblica francese ad ammettere fino al 30 aprile 1970 la commercializzazione
    delle sementi di una varietà di grano duro e di una varietà di orzo di birreria
    soggette a requisiti ridotti'
  type: main
- language: nl
  script: Latn
  content: '70/174/EEG: Beschikking van de Commissie van 23 februari 1970 waarbij
    de Franse Republiek wordt gemachtigd om tot 30 april 1970 zaad van een ras harde
    tarwe en een ras brouwgerst waaraan minder strenge eisen zijn gesteld, tot de
    handel toe te laten'
  type: main
