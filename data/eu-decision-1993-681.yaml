title:
- language: en
  script: Latn
  content: '93/681/EC: Commission Decision of 15 December 1993 authorizing Greece,
    Spain, Italy and Portugal to provide for derogations from Council Directive 77/93/EEC
    in respect of seed potatoes originating in Poland (Only the Greek, Italian, Spanish
    and Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/681/CE: Décision de la Commission du 15 décembre 1993 autorisant
    la Grèce, l''Espagne, l''Italie et le Portugal à prévoir des dérogations à
    la directive 77/93/CEE du Conseil en ce qui concerne les plants de pommes de terre
    originaires de la Pologne (Les textes en langues espagnole, grecque, italienne
    et portugaise sont les seuls faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '93/681/EG: ENTSCHEIDUNG DER KOMMISSION vom 15. Dezember 1993 zur Ermächtigung
    Griechenlands, Spaniens, Italiens und Portugals, für Pflanzkartoffeln mit Ursprung
    in Polen Ausnahmen von der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der
    griechische, der spanische, der italienische und der portugiesische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/681/EF: KOMMISSIONENS BESLUTNING af 15. december 1993 om bemyndigelse
    af Grækenland, Spanien, Italien og Portugal til at fastsætte undtagelser fra
    Rådets direktiv 77/93/EØF, for så vidt angår læggekartofler med oprindelse
    i Polen (Kun den græske, spanske, italienske og portugisiske udgave er autentisk)'
  type: main
- language: el
  script: Grek
