    η Ισπανία, η Ιταλία και η Πορτογαλία να προβλέπουν
    παρεκκλίσεις από την οδηγία 77/93/ΕΟΚ του Συμβουλίου
    όσον αφορά τους σπόρους γεώμηλων προς φύτευση
    καταγωγής Πολωνίας (Τα κείμενα στην ελληνική,
