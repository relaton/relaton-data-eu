title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2932/81 of 12 October 1981 re-establishing
    the levying of customs duties on other leather and bovine cattle leather, falling
    within subheading 41.02 ex C and originating in Uruguay, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2932/81 de la Commission, du 12 octobre 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres cuirs
    et peaux de bovins, de la sous-position 41.02 ex C du tarif douanier commun, originaires
    de l' Uruguay, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2932/81 der Kommission vom 12. Oktober 1981 zur Wiedereinführung
    der Erhebung der Zölle für anderes Rind- und Kalbleder der Tarifstelle 41.02
    ex C, mit Ursprung in Uruguay, dem die in der Verordnung (EWG) Nr. 3322/80 des
    Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2932/81 af 12. oktober 1981 om genindførelse
    af opkrævning af told for andet læder af kvæghuder, henhørende under position
    41.02 ex C og med oprindelse i Uruguay, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 2932/81 τής Επιτροπής
    τής 12ης Οκτωβρίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά έτερα σκύτη καί
    δέρματα βοοειδών τής διακρίσεως 41. 02 ex Γ τού
    Κοινού Δασμολογίου, καταγωγής Ουρουγουάης,
    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (EOK) αριθ. 3322/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2932/81 della Commissione, del 12 ottobre 1981, che
    ripristina la riscossione dei dazi doganali applicabili ad altri cuoi e pelli
    di bovini, della sottovoce doganale 41.02 ex C, originari dell' Uruguay beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2932/81 van de Commissie van 12 oktober 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander leder
    en voorgelooide huiden en vellen, van runderen, van postonderverdeling 41.02 ex
    C, van oorsprong uit Uruguay, waarvoor de in Verordening (EEG) nr. 3322/80 van
    de Raad vermelde tariefpreferenties zijn verleend
  type: main
