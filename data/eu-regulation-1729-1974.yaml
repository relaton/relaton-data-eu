  content: Regulation (EEC) No 1729/74 of the Council of 27 June 1974 supplementing
    Regulation (EEC) No 1302/73 as regards transport charges for beef and veal offered
    for intervention and extending the period of validity of Regulations (EEC) No
    196/74 and (EEC) No 377/74
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1729/74 des Rates vom 27. Juni 1974 zur Ergänzung
    der Verordnung (EWG) Nr. 1302/73 hinsichtlich der Transportkosten für zur Intervention
    angebotenes Rindfleisch und zur Verlängerung der Geltungsdauer der Verordnungen
    (EWG) Nr. 196/74 und (EWG) 377/74
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 1729/74 af 27. juni 1974 om tillæg til forordning
    (EØF) nr. 1302/73 for så vidt angår udgifter ved transport af oksekød, som
    udbydes til intervention, og om forlængelse af gyldighedsperioden for forordningerne
    (EØF) nr. 196/74 og (EØF) nr. 377/74
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1729/74 del Consiglio, del 27 giugno 1974, che completa
    il regolamento (CEE) n. 1302/73 per quanto riguarda le spese di trasporto delle
    carni bovine offerte all'intervento e che proroga la durata di validità dei regolamenti
    (CEE) n. 196/74 e (CEE) n. 377/74
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1729/74 van de Raad van 27 juni 1974 tot aanvulling
    van Verordening (EEG) nr. 1302/73 met betrekking tot de vervoerkosten voor rundvlees
    dat voor interventie wordt aangeboden, en tot verlenging van de geldigheidsduur
    van Verordening (EEG) nr. 196/74 en Verordening (EEG) nr. 377/74
  type: main
