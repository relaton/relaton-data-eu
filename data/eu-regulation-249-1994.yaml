    el que se adaptan los códigos y designaciones de determinados productos de los
    Anexos del Reglamento (CEE) nº 2405/89 por el que se establecen las normas especiales
    de aplicación del régimen de certificados de importación y de fijación anticipada
    en el sector de los productos transformados a base de frutas y hortalizas, y del
    Anexo del Reglamento (CEE) nº 1129/93 por el que se fija el precio mínimo de
