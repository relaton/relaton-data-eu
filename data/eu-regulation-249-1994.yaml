  script: Latn
  content: REGULAMENTO (CE) Nº 249/94 DA COMISSÃO de 3 de Fevereiro de 1994 que
    adapta os códigos e a designação de determinados produtos incluídos nos anexos
    do Regulamento (CEE) nº 2405/89, que estabelece regras de execução especiais
    do regime de certificados de importação e de prefixação no sector dos produtos
    transformados à base de frutas e produtos hortícolas, e no anexo do Regulamento
    (CEE) nº 1129/93, que fixa o preço mínimo de importação aplicável a determinados
    produtos transformados à base de cerejas durante a campanha de comercialização
    de 1993/1994
  type: main
