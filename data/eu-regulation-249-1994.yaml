title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 249/94 of 3 February 1994 adjusting the codes
    and the description of certain products listed in the Annexes to Regulation (EEC)
    No 2405/89 laying down special detailed rules for the application of the system
    of import licences and advance fixing certificates for products processed from
    fruit and vegetables and in the Annex to Regulation (EEC) No 1129/93 fixing the
    minimum import price applicable to certain types of processed cherries during
    the 1993/94 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 249/94 de la Commission du 3 février 1994 adaptant
    les codes et la désignation de certains produits repris aux annexes du règlement
    (CEE) n° 2405/89 portant modalités d'application du régime des certificats
    d'importation et de préfixation dans le secteur des produits transformés à
    base de fruits et légumes et à l'annexe du règlement (CEE) n° 1129/93 fixant
    le prix minimal à l'importation applicable à certains produits transformés
    à base de cerises au cours de la campagne de commercialisation 1993/1994
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 249/94 DER KOMMISSION vom 3. Februar 1994 zur Anpassung
    der Codes und Bezeichnungen bestimmter Erzeugnisse der Anhänge zu der Verordnung
    (EWG) Nr. 2405/89 mit besonderen Durchführungsbestimmungen für Einfuhrlizenzen
    und Vorausfestsetzungsbescheinigungen für Verarbeitungserzeugnisse aus Obst und
    Gemüse und des Anhangs zu der Verordnung (EWG) Nr. 1129/93 zur Festsetzung des
    Mindesteinfuhrpreises für bestimmte Verarbeitungserzeugnisse aus Kirschen für
    das Wirtschaftsjahr 1993/94
  type: main
- language: da
  script: Latn
