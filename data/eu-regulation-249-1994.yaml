    forordning (EØF) nr. 2405/89 om særlige gennemførelsesbestemmelser for ordningen
    med importlicenser og forudfastsættelsesattester for produkter forarbejdet på
    basis af frugt og grøntsager og i bilaget til forordning (EØF) nr. 1129/93 om
    fastsættelse af minimumsimportprisen for visse former for forarbejdede kirsebær
    for produktionsåret 1993/94
  type: main
