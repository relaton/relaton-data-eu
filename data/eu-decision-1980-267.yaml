title:
- language: en
  script: Latn
  content: '80/267/EEC: Commission Decision of 13 February 1980 establishing that
    the conditions required for the admission free of Common Customs Tariff duties
    of the scientific apparatus described as ''Perkin-Elmer atomic absorption spectrophotometer,
    model 5000'' are not fulfilled'
  type: main
- language: fr
  script: Latn
  content: '80/267/CEE: Décision de la Commission, du 13 février 1980, constatant
    que les conditions requises pour l'' admission en franchise des droits du tarif
    douanier commun de l'' appareil scientifique dénommé "Perkin-Elmer-Atomic Absorption
    Spectrophotometer, model 5000" ne sont pas remplies'
  type: main
- language: de
  script: Latn
  content: '80/267/EWG: Entscheidung der Kommission vom 13. Februar 1980, mit der
    festgestellt wird, daß die Voraussetzungen für die Befreiung von den Zöllen
    des Gemeinsamen Zolltarifs für das wissenschaftliche Gerät ,,Perkin-Elmer-Atomic
    Absorption Spectrophotometer, model 5 000'' '' nicht vorliegen'
  type: main
- language: da
  script: Latn
  content: '80/267/EØF: Kommissionens beslutning af 13. februar 1980 om fastsættelse
    af, at betingelserne for fritagelse for told efter den fælles toldtarif ved indførsel
    af det videnskabelige apparat benævnt "Perkin-Elmer atomic absorption spectrophotometer,
    model 5*000" ikke er opfyldt'
  type: main
- language: el
  script: Grek
  content: '80/267/ΕΟΚ: Απόφαση τής Επιτροπής τής 13ης
