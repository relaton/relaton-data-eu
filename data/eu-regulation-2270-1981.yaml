    δικαιούχου τών προβλεπομένων από τόν κανονισμό
    (ΕΟΚ) αριθ. 3322/80 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2270/81 della Commissione, del 6 agosto 1981, che
    ripristina la riscossione dei dazi doganali applicabili agli oggetti di vestiario,
    guanti e altri accessori per oggetti di vestiario, delle sottovoci 42.03 A, B
    II, III, C della tariffa doganale comune, originari dell' Uruguay beneficiario
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2270/81 van de Commissie van 6 augustus 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kleding en
    kledingtoebehoren, van de postonderverdelingen 42.03 A, B II, B III en C, van
    oorsprong uit Uruguay, waarvoor de in Verordening (EEG) nr. 3322/80 van de Raad
    vermelde tariefpreferenties zijn verleend
