title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2270/81 of 6 August 1981 reintroducing the
    levying of the customs duties applicable to articles of apparel, gloves and other
    clothing accessories, falling within subheadings 42.03 A, B II, III, C originating
    in Uruguay and benefiting from the tariff preferences provided for by Council
    Regulation (EEC) No 3322/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2270/81 de la Commission, du 6 août 1981, portant
    rétablissement de la perception des droits de douane applicables aux vêtements,
    gants et autres accessoires du vêtement, des sous-positions 42.03 A, 42.03 B
    II, 42.03 B III, 42.03 C du tarif douanier commun, originaires de l' Uruguay,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) n°
    3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2270/81 der Kommission vom 6. August 1981 zur Wiedereinführung
    der Erhebung der Zölle für Bekleidung und Bekleidungszubehör der Tarifstellen
    42.03 A, B II, III und C, mit Ursprung in Uruguay, dem die in der Verordnung (EWG)
    Nr. 3322/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2270/81 om genindførelse af opkrævning
    af told for beklædningsgenstande og tilbehør henhørende under pos. 42.03 A,
    B II, III og C, og med oprindelse i Uruguay, som er præferenceberettiget i henhold
    til Rådets forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2270/81 τής Επιτροπής
    τής 6ης Αυγούστου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά ενδύματα, χειρόκτια
    καί έτερα συμπληρώματα τής ενδύσεως τής δασμολογικής
