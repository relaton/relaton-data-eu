  content: Commission Regulation (EEC) No 2159/81 of 29 July 1981 laying down detailed
    rules for the application of Council Regulation (EEC) No 37/81 determining certain
    national aid measures which Greece is authorized to maintain on a transitional
    basis in the field of agriculture
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2159/81 de la Commission, du 29 juillet 1981, portant
    modalités d' application du règlement (CEE) n° 37/81 du Conseil déterminant
    certaines aides nationales que la Grèce est autorisée à maintenir à titre
    transitoire dans le domaine de l' agriculture
  type: main
- language: de
  script: Latn
