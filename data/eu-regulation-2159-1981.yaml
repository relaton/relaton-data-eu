    Beihilfen in der Landwirtschaft, die Griechenland übergangsweise beibehalten
    darf
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2159/81 af 29. juli 1981 om gennemførelsesbestemmelser
