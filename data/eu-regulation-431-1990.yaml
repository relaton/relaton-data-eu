title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 431/90 of 20 February 1990 on the sale by
    the procedure laid down in Regulation (EEC) No 2539/84 of beef held by certain
    intervention agencies and intended for importation into the Union of Soviet Socialist
    Republics, amending Regulation (EEC) No 569/88 and repealing Regulation (EEC)
    No 2993/89
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 431/90 de la Commission du 20 février 1990 relatif
    à la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines détenues par certains organismes d'intervention et destinées
    à être importées en Union soviétique, modifiant le règlement (CEE) n° 569/88
    et abrogeant le règlement (CEE) n° 243/90
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 431/90 DER KOMMISSION vom 20. Februar 1990 über
    den Verkauf von zur Sowjetunion bestimmtem Rindfleisch aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 243/90 #'
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 431/90 af 20. februar 1990 om salg
    efter proceduren i forordning (EØF) nr. 2539/84 af oksekød fra visse interventionsorganer
    med henblik på indførsel til Sovjetunionen og om ændring af forordning (EØF)
    nr. 569/88 og om ophævelse af forordning (EØF) nr. 243/90
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 431/90 της Επιτροπής
