    carne de bovino detida por certos organismos de intervenção e destinada a ser
    importada pela União Soviética, que altera o Regulamento (CEE) nº 569/88 e
    que revoga o Regulamento (CEE) nº 243/90 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 431/90 DE LA COMISIÓN de 20 de febrero de 1990 relativo
