    του κανονισμού (ΕΟΚ) αριθ. 243/90
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 431/90 DELLA COMMISSIONE del 20 febbraio 1990 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine detenute da taluni organismi d'' intervento e destinate ad essere
    importate in Unione Sovietica, che modifica il regolamento (CEE) n. 569/88 e recante
    abrogazione del regolamento (CEE) n. 243/90 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 431/90 VAN DE COMMISSIE van 20 februari 1990 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor invoer in de Sowjetunie
    bestemd rundvlees, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende
    intrekking van Verordening (EEG) nr. 243/90 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) Nº 431/90 DA COMISSÃO de 20 de Fevereiro de 1990 relativo
