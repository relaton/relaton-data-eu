  script: Latn
  content: Règlement (CEE) n° 1380/92 du Conseil du 26 mai 1992 modifiant le règlement
    (CEE) n° 1678/85 fixant les taux de conversion à appliquer dans le secteur agricole
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1380/92 DES RATES vom 26. Mai 1992 zur Änderung
    der Verordnung (EWG) Nr. 1678/85 über die in der Landwirtschaft anzuwendenden
    Umrechnungskurse #'
  type: main
- language: da
  script: Latn
  content: 'RÅDETS FORORDNING (EØF) Nr. 1380/92 af 26. maj 1992 om ændring af forordning
