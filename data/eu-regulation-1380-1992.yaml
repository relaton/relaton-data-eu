    (ΕΟΚ) αριθ. 1678/85 περί καθορισμού των ισοτιμιών
    που πρέπει να εφαρμοσθούν στο γεωργικό τομέα
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1380/92 DEL CONSIGLIO del 26 maggio 1992 recante
    modificazione del regolamento (CEE) n. 1678/85 che fissa i tassi di conversione
    da applicare nel settore agricolo #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1380/92 VAN DE RAAD van 26 mei 1992 tot wijziging
    van Verordening (EEG) nr. 1678/85 tot vaststelling van de in de landbouw toe te
    passen omrekeningskoersen #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No. 1380/92 DO CONSELHO de 26 de Maio de 1992 que altera
    o Regulamento (CEE) no. 1678/85, que fixa as taxas de conversão aplicáveis no
    sector agrícola #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1380/92 DEL CONSEJO de 26 de mayo de 1992 que modifica
