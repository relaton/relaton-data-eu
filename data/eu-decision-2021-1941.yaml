  script: Latn
  content: Council Decision (EU) 2021/1941 of 9 November 2021 on the financial contributions
    to be paid by the parties to the European Development Fund to finance that Fund,
    including the ceiling for 2023, the annual amount for 2022, the amount of the
    first instalment for 2022 and an indicative and non-binding forecast for the expected
    annual amounts of contributions for the years 2024 and 2025
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1941 du Conseil du 9 novembre 2021 relative aux contributions
    financières à verser par les parties au Fonds européen de développement pour
    financer ce Fonds, notamment le plafond pour l’exercice 2023, le montant annuel
    pour l’exercice 2022, le montant de la première tranche pour l’exercice 2022
    et des prévisions indicatives et non contraignantes concernant le montant annuel
    des contributions escompté pour les exercices 2024 et 2025
