    CORRISPONDENTE, IL VALORE FORFETTARIO DEI PRODOTTI DELLA PESCA RITIRATI DAL MERCATO
    NELLA CAMPAGNA DI PESCA 1991
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3899/90 van de COMMISSIE van 19
  type: main
