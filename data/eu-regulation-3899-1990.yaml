  script: Latn
  content: Regulamento (CEE) n.° 3899/90 da Comissão, de 19 de Dezembro de 1990,
    que fixa, para efeitos do cálculo da compensação financeira e do adiantamento
    que lhe diz respeito, o valor forfetário dos produtos retirados do mercado durante
    a campanha de pesca de 1991
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3899/90 DE LA COMISION de 19 de diciembre de 1990 por
    el que se fija el valor a tanto alzado de los productos de la pesca retirados
    del mercado durante la campana pesquera de 1991, que ha de utilizarse en el calculo
    de la compensacion financiera y del anticipo relacionado con ésta
