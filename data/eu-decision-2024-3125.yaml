  content: Rådets afgørelse (EU) 2024/3125 af 5. december 2024 om den holdning,
    der skal indtages på Den Europæiske Unions vegne i Det Blandede Udvalg, der
    er nedsat ved aftalen mellem Det Europæiske Kul- og Stålfællesskab og Republikken
    Tyrkiet om handel med produkter, der er omfattet af traktaten om oprettelse af
    Det Europæiske Kul- og Stålfællesskab, til ændringen af nævnte aftale ved
    erstatning af protokol 1 dertil vedrørende definition af begrebet »produkter
    med oprindelsesstatus« og metoder til administrativt samarbejde
  type: main
- language: el
  script: Grek
  content: Απόφαση (ΕΕ) 2024/3125 του Συμβουλίου, της 5ης
    Δεκεμβρίου 2024, για τη θέση που πρέπει να ληφθεί
    εξ ονόματος της Ευρωπαϊκής Ένωσης στο πλαίσιο
    της μεικτής επιτροπής που συστάθηκε με τη συμφωνία
