title:
- language: en
  script: Latn
  content: Council Decision (EU) 2024/3125 of 5 December 2024 on the position to be
    adopted on behalf of the European Union within the Joint Committee set up by the
    Agreement between the European Coal and Steel Community and the Republic of Turkey
    on trade in products covered by the Treaty establishing the European Coal and
    Steel Community as regards the amendment of that Agreement by replacing Protocol
    1 thereto concerning the definition of the concept of ‘originating products’
    and methods of administrative cooperation
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2024/3125 du Conseil du 5 décembre 2024 relative à la
    position à prendre, au nom de l’Union européenne, au sein du comité mixte
    institué par l’accord entre la Communauté européenne du charbon et de l’acier
    et la République de Turquie sur le commerce des produits couverts par le traité
    instituant la Communauté européenne du charbon et de l’acier, en ce qui concerne
    la modification dudit accord par le remplacement de son protocole n° 1 relatif
    à la définition de la notion de «produits originaires» et aux méthodes de
    coopération administrative
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2024/3125 des Rates vom 5. Dezember 2024 über den Standpunkt,
    der im Namen der Europäischen Union in dem Gemischten Ausschuss, der mit dem
    Abkommen zwischen der Europäischen Gemeinschaft für Kohle und Stahl und der
    Republik Türkei über den Handel mit unter den Vertrag über die Gründung der
    Europäischen Gemeinschaft für Kohle und Stahl fallenden Erzeugnissen eingesetzt
    wurde, zur Änderung des genannten Abkommens durch die Ersetzung des Protokolls
    Nr. 1 über die Bestimmung des Begriffs „Erzeugnisse mit Ursprung in“ oder
    „Ursprungserzeugnisse“ und über die Methoden der Zusammenarbeit der Verwaltungen
    zu vertreten ist
  type: main
- language: bg
  script: Cyrl
  content: Решение (ЕС) 2024/3125 на Съвета от 5 декември
    2024 година относно позицията, която трябва да
    се заеме от името на Европейския съюз в рамките
    на Съвместния комитет, създаден със Споразумението
    между Европейската общност за въглища и стомана
    и Република Турция относно търговията с продукти,
    които попадат в обхвата на Договора за създаване
    на Европейската общност за въглища и стомана,
    във връзка с изменението на посоченото споразумение
    чрез замяна на Протокол 1 към него относно определението
    на понятието „продукти с произход“ и методите
    на административно сътрудничество
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady (EU) 2024/3125 ze dne 5. prosince 2024 o postoji, který
    má být zaujat jménem Evropské unie ve smíšeném výboru zřízeném Dohodou
    mezi Evropským společenstvím uhlí a oceli a Tureckou republikou o obchodování
    s výrobky, na něž se vztahuje Smlouva o založení Evropského společenství
    uhlí a oceli, pokud jde o změnu uvedené dohody nahrazením protokolu č. 1
    k dohodě týkajícího se definice pojmu „původní produkty“ a metod správní
    spolupráce
  type: main
- language: da
