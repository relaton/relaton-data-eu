    ar Nolīgumu starp Eiropas Ogļu un tērauda kopienu un Turcijas Republiku par
    produktu tirdzniecību, uz kuriem attiecas Eiropas Ogļu un tērauda kopienas
    dibināšanas līgums, attiecībā uz grozījumu minētajā nolīgumā, aizstājot
    tā 1. protokolu par jēdziena “noteiktas izcelsmes izstrādājumi” definīciju
    un administratīvās sadarbības metodēm
  type: main
- language: lt
  script: Latn
  content: 2024 m. gruodžio 5 d. Tarybos sprendimas (ES) 2024/3125, dėl pozicijos,
    kurios Europos Sąjungos vardu turi būti laikomasi Jungtiniame komitete, įsteigtame
    Europos anglių ir plieno bendrijos ir Turkijos Respublikos susitarimu dėl prekybos
    produktais, kuriems taikoma Europos anglių ir plieno bendrijos steigimo sutartis,
    dėl to susitarimo dalinio pakeitimo, pakeičiant jo 1 protokolą „Dėl sąvokos
    „produktų kilmė“ apibrėžties ir administracinio bendradarbiavimo metodų“
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill (UE) 2024/3125 tal-5 ta’ Diċembru 2024 dwar
    il-pożizzjoni li għandha tiġi adottata f’isem l-Unjoni Ewropea fi ħdan il-Kumitat
    Konġunt stabbilit mill-Ftehim bejn il-Komunità Ewropea tal-Faħam u l-Azzar
    u r-Repubblika tat-Turkija dwar il-kummerċ tal-prodotti koperti bit-Trattat li
    jistabbilixxi l-Komunità Ewropea tal-Faħam u l-Azzar fir-rigward tal-emendar
    ta’ dak il-Ftehim billi jiġi sostitwit il-Protokoll 1 tiegħu dwar id-definizzjoni
    tal-kunċett ta’ “prodotti oriġinarji” u l-metodi ta’ kooperazzjoni amministrattiva
  type: main
- language: nl
  script: Latn
  content: Besluit (EU) 2024/3125 van de Raad van 5 december 2024 betreffende het
    namens de Europese Unie in te nemen standpunt in het Gemengd Comité dat is opgericht
    bij de Overeenkomst tussen de Europese Gemeenschap voor Kolen en Staal en de Republiek
    Turkije betreffende de handel in producten waarop het Verdrag tot oprichting van
    de Europese Gemeenschap voor Kolen en Staal van toepassing is, over de wijziging
