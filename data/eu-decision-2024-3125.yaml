  type: main
- language: et
  script: Latn
  content: Nõukogu otsus (EL) 2024/3125, 5. detsember 2024, Euroopa Liidu nimel võetava
    seisukoha kohta Euroopa Söe- ja Teraseühenduse ning Türgi Vabariigi vahelise
    lepinguga (mis käsitleb Euroopa Söe- ja Teraseühenduse asutamislepinguga hõlmatud
    toodetega kauplemist) moodustatud ühiskomitees seoses nimetatud lepingu muutmisega
