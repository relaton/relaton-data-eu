    määratlust ja halduskoostöö meetodeid) asendamise teel
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös (EU) 2024/3125, annettu 5 päivänä joulukuuta 2024,
    Euroopan hiili- ja teräsyhteisön perustamissopimuksen soveltamisalaan kuuluvien
    tuotteiden kaupasta tehdyllä Euroopan hiili- ja teräsyhteisön ja Turkin tasavallan
    välisellä sopimuksella perustetussa sekakomiteassa Euroopan unionin puolesta
    esitettävästä kannasta kyseisen sopimuksen muuttamiseen korvaamalla käsitteen
    ”alkuperätuotteet” määrittelyä ja hallinnollisen yhteistyön menetelmiä
    koskeva sopimuksen pöytäkirja N:o 1
  type: main
- language: ga
  script: Latn
  content: Cinneadh (AE) 2024/3125 ón gComhairle an 5 Nollaig 2024 maidir leis an
