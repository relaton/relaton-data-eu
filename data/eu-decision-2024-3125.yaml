    samenwerking
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady (UE) 2024/3125 z dnia 5 grudnia 2024 r. w sprawie stanowiska,
    które ma być zajęte w imieniu Unii Europejskiej w ramach Wspólnego Komitetu
    ustanowionego na mocy Umowy między Europejską Wspólnotą Węgla i Stali a Republiką
    Turcji o handlu produktami objętymi Traktatem ustanawiającym Europejską Wspólnotę
    Węgla i Stali w odniesieniu do zmiany tej umowy poprzez zastąpienie protokołu
    1 do niej dotyczącego definicji pojęcia „produkty pochodzące” i metod współpracy
    administracyjnej
  type: main
- language: pt
  script: Latn
  content: Decisão (UE) 2024/3125 do Conselho, de 5 de dezembro de 2024, relativa
    à posição a tomar em nome da União Europeia no âmbito do Comité Misto criado
    pelo Acordo entre a Comunidade Europeia do Carvão e do Aço e a República da
    Turquia sobre o comércio de produtos abrangidos pelo Tratado que institui a Comunidade
    Europeia do Carvão e do Aço no que se refere à alteração desse Acordo mediante
    a substituição do seu Protocolo n.° 1 relativo à definição da noção de
    «produtos originários» e aos métodos de cooperação administrativa
  type: main
- language: ro
  script: Latn
  content: Decizia (UE) 2024/3125 a Consiliului din 5 decembrie 2024 privind poziția
    care urmează să fie adoptată în numele Uniunii Europene, în cadrul Comitetului
    mixt înființat prin Acordul dintre Comunitatea Europeană a Cărbunelui și
    Oțelului și Republica Turcia privind schimburile comerciale cu produse care
    intră sub incidența Tratatului de instituire a Comunității Europene a Cărbunelui
    și Oțelului, în ceea ce privește modificarea acordului prin înlocuirea Protocolului
    1 privind definirea noțiunii de „produse originare” și metodele de cooperare
    administrativă anexat la acord
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady (EÚ) 2024/3125 z 5. decembra 2024 o pozícii, ktorá
    sa má v mene Európskej únie prijať v Spoločnom výbore zriadenom Dohodou
    medzi Európskym spoločenstvom uhlia a ocele a Tureckou republikou o obchode
    s výrobkami, na ktoré sa vzťahuje Zmluva o založení Európskeho spoločenstva
    uhlia a ocele, pokiaľ ide o zmenu uvedenej dohody nahradením protokolu 1 k dohode
    týkajúceho sa vymedzenia pojmu „pôvodné výrobky“ a metód administratívnej
    spolupráce
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2024/3125 z dne 5. decembra 2024 o stališču, ki se v
    imenu Evropske unije zastopa v Skupnem odboru, ustanovljenem s Sporazumom med
    Evropsko skupnostjo za premog in jeklo ter Republiko Turčijo o trgovini z izdelki,
    zajetimi s Pogodbo o ustanovitvi Evropske skupnosti za premog in jeklo, glede
    spremembe navedenega sporazuma z nadomestitvijo Protokola 1 k navedenemu sporazumu
    o opredelitvi pojma „izdelki s poreklom“ in načinih upravnega sodelovanja
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2024/3125 del Consejo, de 5 de diciembre de 2024, relativa
    a la posición que debe adoptarse en nombre de la Unión Europea en el seno del
    Comité Mixto instituido en virtud del Acuerdo entre la Comunidad Europea del
    Carbón y del Acero y la República de Turquía sobre el comercio de los productos
    regulados por el Tratado constitutivo de la Comunidad Europea del Carbón y del
    Acero con respecto a la modificación de dicho Acuerdo mediante la sustitución
    de su Protocolo n.° 1 relativo a la definición de la noción de «productos
    originarios» y a los métodos de cooperación administrativa
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2024/3125 av den 5 december 2024 om den ståndpunkt
    som ska intas på Europeiska unionens vägnar i den gemensamma kommitté som inrättats
    genom avtalet mellan Europeiska kol- och stålgemenskapen och Republiken Turkiet
    om handel med produkter som omfattas av Fördraget om upprättandet av Europeiska
    kol- och stålgemenskapen vad gäller ändring av det avtalet genom ersättande
    av protokoll 1 om definition av begreppet ursprungsprodukter och om metoder för
    administrativt samarbete
