    leis an gComhaontú idir an Comhphobal Eorpach do Ghual agus Cruach agus Poblacht
    na Tuirce maidir le trádáil i dtáirgí a chumhdaítear leis an gConradh ag
    bunú an Chomhphobail Eorpaigh do Ghual agus Cruach, a mhéid a bhaineann le leasú
    ar an gComhaontú sin trí Phrótacal 1 a ghabhann leis, a bhaineann le sainmhíniú
    an choincheapa ‘táirgí tionscnaimh’ agus modhanna comhair riaracháin, a
    ionadú
  type: main
