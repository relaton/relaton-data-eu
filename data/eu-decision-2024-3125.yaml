  script: Latn
  content: Odluka Vijeća (EU) 2024 /3125 od 5. prosinca 2024. o stajalištu koje
    treba zauzeti u ime Europske unije u okviru Zajedničkog odbora osnovanog Sporazumom
    između Europske zajednice za ugljen i čelik i Republike Turske o trgovini proizvodima
    obuhvaćenima Ugovorom o osnivanju Europske zajednice za ugljen i čelik u pogledu
    izmjene tog sporazuma zamjenom njegova Protokola 1. o definiciji pojma „proizvodi
    s podrijetlom” i načinima administrativne suradnje
  type: main
