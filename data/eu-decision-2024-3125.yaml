  script: Latn
  content: A Tanács (EU) 2024/3125 határozata (2024. december 5) az Európai Szén-
    és Acélközösség és a Török Köztársaság közötti, az Európai Szén-
    és Acélközösséget létrehozó szerződés hatálya alá tartozó termékek
    kereskedelméről szóló megállapodással létrehozott Vegyes Bizottságban
    az említett megállapodásnak a „származó termék” fogalmának meghatározásáról
    és az igazgatási együttműködés módszereiről szóló 1. jegyzőkönyve
    felváltásával történő módosításával kapcsolatban az Európai Unió által
    képviselendő álláspontról
  type: main
- language: it
  script: Latn
  content: Decisione (UE) 2024/3125 del Consiglio, del 5 dicembre 2024, relativa alla
    posizione da adottare a nome dell’Unione europea in sede di comitato misto istituito
    dall’accordo tra la Comunità europea del carbone e dell’acciaio e la Repubblica
    di Turchia sul commercio dei prodotti contemplati dal trattato che istituisce
    la Comunità europea del carbone e dell’acciaio per quanto riguarda la modifica
    di tale accordo mediante la sostituzione del suo protocollo n. 1 relativo alla
    definizione della nozione di «prodotti originari» e ai metodi di cooperazione
    amministrativa
  type: main
