title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1500/72 of the Commission of 13 July 1972 fixing, for
    the 1972/73 marketing year, the variety of long-grained rice representative of
    Community production, the difference in value between this variety and the variety
    of round-grained rice corresponding to standard quality, the threshold price for
    long-grained husked rice and the threshold prices for milled rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1500/72 de la Commission, du 13 juillet 1972, fixant,
    pour la campagne 1972/1973, la variété de riz à grains longs représentative
    de la production communautaire, la différence de valeur entre celle-ci et la
    variété de riz à grains ronds correspondant à la qualité type, le prix de
    seuil du riz décortiqué à grains longs et les prix de seuil du riz blanchi
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1500/72 der Kommission vom 13. Juli 1972 zur Festsetzung
    der für die Gemeinschaftsproduktion repräsentativen langkörnigen Reissorte,
    des Wertunterschieds zwischen dieser Sorte und der der Standardqualität entsprechenden
    rundkörnigen Reissorte, des Schwellenpreises für geschälten langkörnigen Reis
    und der Schwellenpreise für vollständig geschliffenen Reis für das Wirtschaftsjahr
    1972/1973
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1500/72 af 13. juli 1972 om fastsættelse
    for høståret 1972/1973 af den langkornede rissort/risstamme, der er repræsentativ
    for produktionen i Fællesskabet, af værdiforskellen mellem denne sort/stamme
    og den rundkornede rissort/risstamme, der svarer til standardkvaliteten, af tærskelprisen
    for afskallet langkornet ris og af tærskelprisen for sleben ris
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1500/72 della Commissione, del 13 luglio 1972, che
    fissa, per la campagna 1972/1973, la varietà di riso a grani lunghi rappresentativa
    della produzione comunitaria, la differenza di valore tra quest' ultima e la varietà
    di riso a grani tondi corrispondente alla qualità tipo, il prezzo d' entrata
    del riso semigreggio a grani lunghi ed i prezzi d' entrata del riso lavorato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1500/72 van de Commissie van 13 juli 1972 tot vaststelling,
    voor het verkoopseizoen 1972/1973, van de variëteit langkorrelige rijst die representatief
    is voor de communautaire produktie, het waardeverschil tussen deze variëteit
    en de variëteit rondkorrelige rijst die met de standaardkwaliteit overeenkomt,
    de drempelprijs voor langkorrelige gedopte rijst en de drempelprijzen voor volwitte
    rijst
  type: main
