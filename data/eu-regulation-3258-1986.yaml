  content: Commission Regulation (EEC) No 3258/86 of 27 October 1986 re-establishing
    the levying of customs duties on other generators, motors and rotary converters,
    falling within subheading 85.01 B I b), originating in Hong Kong, to which the
    preferential tariff arrangements set out in Council Regulation (EEC) No 3599/85
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3258/86 de la Commission du 27 octobre 1986 portant
    rétablissement de la perception des droits de douane applicables aux autres machines
    génératrices, moteurs, convertisseurs rotatifs, de la sous-position 85.01 B
    I b) du tarif douanier commun, originaires de Hong-kong, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
