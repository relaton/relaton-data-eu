title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/267 of 17 February 2015 amending
    Annex II to Decision 2007/777/EC as regards the entry for Japan in the list of
    third countries or parts thereof from which the introduction of certain meat products
    and treated stomachs, bladders and intestines into the Union is authorised (notified
    under document C(2015) 738)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/267 de la Commission du 17 février 2015
    modifiant l'annexe II de la décision 2007/777/CE en ce qui concerne les mentions
    relatives au Japon sur la liste des pays tiers ou parties de pays tiers à partir
    desquels l'introduction dans l'Union de certains produits à base de viande et
    d'estomacs, vessies et boyaux traités est autorisée [notifiée sous le numéro
    C(2015) 738]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/267 der Kommission vom 17. Februar 2015
    zur Änderung des Anhangs II der Entscheidung 2007/777/EG hinsichtlich des Eintrags
    für Japan in der Liste der Drittländer bzw. Teile von Drittländern, aus denen
    die Einfuhr bestimmter Fleischerzeugnisse und behandelter Mägen, Blasen und Därme
    in die Union gestattet ist (Bekanntgegeben unter Aktenzeichen C(2015) 738)
  type: main
