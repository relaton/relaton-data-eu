title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 303/1999 of 10 February 1999 laying down
    exceptional measures in relation to the set-aside rules in order to alleviate
    the effects of adverse weather conditions in certain areas of the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 303/1999 de la Commission du 10 février 1999 arrêtant
    des mesures exceptionnelles en rapport avec les modalités de gel des terres afin
    d'atténuer les effets de mauvaises conditions climatiques dans certaines régions
    de la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 303/1999 der Kommission vom 10. Februar 1999 mit infolge
    ungünstiger Witterungsbedingungen in mehreren Gebieten der Gemeinschaft zu treffenden
    besonderen Stillegungsmaßnahmen
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 303/1999 af 10. februar 1999 om særforanstaltninger
    i forbindelse med jordudtagningsordningen for at afbøde konsekvenserne af ugunstige
    vejrforhold i visse EU-områder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 303/1999 της Επιτροπής
    της 10ης Φεβρουαρίου 1999 για τη θέσπιση εξαιρετικών
    μέτρων σχετικών με τους κανόνες που διέπουν
    την παύση της καλλιέργειας προκειμένου να
    αντισταθμιστούν οι αρνητικές συνέπειες δυσμενών
    καιρικών συνθηκών σε ορισμένες περιοχές της
    Κοινότητας
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 303/1999, annettu 10 päivänä helmikuuta 1999,
    kesantoa koskeviin sääntöihin liittyvistä poikkeustoimenpiteistä epäsuotuisten
    sääolojen vaikutusten helpottamiseksi tietyillä alueilla
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 303/1999 della Commissione del 10 febbraio 1999 recante
    misure eccezionali in materia di ritiro dei seminativi dalla produzione intese
    ad alleviare le conseguenze delle difficili condizioni meteorologiche in alcune
    regioni della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 303/1999 van de Commissie van 10 februari 1999 tot
    vaststelling van uitzonderingsmaatregelen in het kader van de braakleggingsvoorschriften
    om de gevolgen van de slechte weersomstandigheden in sommige delen van de Gemeenschap
    te beperken
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n° 303/1999 da Comissão de 10 de Fevereiro de 1999 que
    estabelece derrogações às regras aplicáveis no âmbito do regime de retiradas
    de terras, a fim de compensar os efeitos de condições climáticas adversas registadas
    em determinadas zonas da Comunidade
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 303/1999 de la Comisión de 10 de febrero de 1999 por
    el que se establecen medidas especiales en relación con las normas de retirada
    de tierras para paliar las consecuencias de las malas condiciones climáticas
    registradas en ciertas zonas de la Comunidad
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 303/1999 av den 10 februari 1999 om undantagsåtgärder
