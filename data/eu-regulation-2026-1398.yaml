    bestimmter Kontrollstellen, die für die Durchführung von Kontrollen und die
    Ausstellung von Öko-/Bio-Zertifikaten in Drittländern für die Zwecke der Einfuhr
    ökologischer/biologischer Erzeugnisse in die Union zuständig sind, gemäß Artikel
    46 der Verordnung (EU) 2018/848 des Europäischen Parlaments und des Rates
