  content: Commission Regulation (EEC) No 694/92 of 19 March 1992 laying down detailed
    rules applicable to the free supply of food products to the population of Albania
    as provided for in Council Regulation (EEC) No 3860/91
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 694/92 de la Commission, du 19 mars 1992, définissant
