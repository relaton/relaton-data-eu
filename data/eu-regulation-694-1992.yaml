    du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 694/92 der Kommission vom 19. März 1992 mit Einzelbestimmungen
    zur unentgeltlichen Lieferung von Nahrungsmitteln an die Bevölkerung von Albanien
    nach der Verordnung (EWG) Nr. 3860/91 des Rates
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 694/92 af 19. marts 1992 om gennemførelsesbestemmelser
