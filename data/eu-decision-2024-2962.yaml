    și încercări de rezistență) și EN 1273:2005 (Articole de puericultură –
    Premergătoare – Cerințe de securitate și metode de încercare) în Jurnalul
    Oficial al Uniunii Europene'
  type: main
- language: sk
  script: Latn
  content: 'Vykonávacie rozhodnutie Komisie (EÚ) 2024/2962 z 29. novembra 2024,
    ktorým sa mení vykonávacie rozhodnutie (EÚ) 2019/1698 o stanovovaní noriem
    pre výrobky vypracované na podporu smernice Európskeho parlamentu a Rady 2001/95/ES
    o všeobecnej bezpečnosti výrobkov a zrušuje uverejnenie odkazov na normy EN
    581-1:2006 (Vonkajší nábytok – Sedací a stolový nábytok na kempingové
    a domáce použitie a použitie v nebytových budovách – Časť 1: Všeobecné
    bezpečnostné požiadavky), EN 12491:2001 (Zariadenia na padákové lietanie.
    Záložné padáky. Bezpečnostné požiadavky a skúšobné metódy), EN 1651:1999
    (Zariadenia na padákové lietanie. Postroje. Bezpečnostné požiadavky a skúšky
    pevnosti konštrukcie) a EN 1273:2005 (Výrobky pre deti a starostlivosť o deti.
    Detské chodúľky. Bezpečnostné požiadavky a skúšobné metód) v Úradnom
    vestníku Európskej únie'
  type: main
- language: sl
  script: Latn
  content: 'Izvedbeni sklep Komisije (EU) 2024/2962 z dne 29. novembra 2024 o spremembi
    Izvedbenega sklepa (EU) 2019/1698 o evropskih standardih za proizvode, pripravljenih
    v podporo Direktivi 2001/95/ES Evropskega parlamenta in Sveta o splošni varnosti
    proizvodov, z umikom objave sklicevanj na standarde EN 581-1:2006 (Zunanje pohištvo
    – Sedežno pohištvo in mize za domačo in javno uporabo ter taborjenje –
    1. del: Splošne varnostne zahteve), EN 12491:2001 (Jadralno padalstvo – Varnostna
    padala – Varnostne zahteve in preskusne metode), EN 1651:1999 (Jadralno padalstvo
    – Pasovi – Varnostne zahteve in trdnostni preskusi) in EN 1273:2005 (Izdelki
    za otroke – Hojce – Varnostne zahteve in preskusne metode) v Uradnem listu
    Evropske unije'
  type: main
- language: es
  script: Latn
  content: 'Decisión de Ejecución (UE) 2024/2962 de la Comisión, de 29 de noviembre
    de 2024, por la que se modifica la Decisión de Ejecución (UE) 2019/1698 relativa
    a las normas europeas sobre productos redactadas en apoyo de la Directiva 2001/95/CE
    del Parlamento Europeo y del Consejo relativa a la seguridad general de los productos,
    en lo relativo a la retirada de la publicación en el Diario Oficial de la Unión
    Europea de las referencias de las normas EN 581-1:2006 (Mobiliario de exterior-Asientos
    y mesas de uso doméstico, público y de camping – Parte 1: Requisitos generales
    de seguridad), EN 12491:2001 (Equipo para la práctica del parapente – Paracaídas
    de emergencia – Requisitos de seguridad y métodos de ensayo), EN 1651:1999
    (Equipos para la práctica del parapente-Arneses-Requisitos de seguridad y ensayos
    de resistencia) y EN 1273:2005 (Artículos de puericultura-Andadores-Requisitos
    de seguridad y métodos de ensayo)'
  type: main
- language: sv
  script: Latn
  content: 'Kommissionens genomförandebeslut (EU) 2024/2962 av den 29 november 2024
    om ändring av genomförandebeslut (EU) 2019/1698 om europeiska produktstandarder
    utarbetade till stöd för Europaparlamentets och rådets direktiv 2001/95/EG
    om allmän produktsäkerhet vad gäller återkallande av hänvisningarna till
    standarderna SS-EN 581-1:2006 (Utomhusmöbler – Sittmöbler och bord för camping,
    hemmiljö och offentlig miljö – Del 1: Allmänna säkerhetskrav), SS-EN 12491:2001
    (Utrustning för skärmflygning – Nödfallsskärmar – Säkerhetskrav och provningsmetoder),
    SS-EN 1651:1999 (Utrustning för skärmflygning – Säkerhetsselar – Säkerhetskrav
    och provningsmetoder för hållfasthet) och SS-EN 1273:2005 (Barnartiklar –
    Gåstolar för barn – Säkerhetskrav och provningsmetoder) som offentliggjorts
    i Europeiska unionens officiella tidning'
