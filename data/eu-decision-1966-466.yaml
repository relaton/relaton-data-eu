  content: Décision 66/466/CEE de la Commission, du 29 juillet 1966, autorisant la
    perception de taxes compensatoires sur les importations, dans la République fédérale
    d'Allemagne, de certains produits de la chocolaterie en provenance des autres
    États membres
  type: main
- language: de
  script: Latn
  content: '66/466/EWG: Entscheidung der Kommission vom 29. Juli 1966 zur Erhebung
    von Ausgleichsabgaben auf Einfuhren von verschiedenen Schokoladewaren aus den
    anderen Mitgliedstaaten in die Bundesrepublik Deutschland'
  type: main
- language: it
  script: Latn
  content: '66/466/CEE: Decisione della Commissione del 29 luglio 1966 che autorizza
    la riscossione di tasse di compensazione sulle importazioni, nella Repubblica
    federale di Germania, di alcuni prodotti a base di cioccolata in provenienza dagli
    altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '66/466/EEG: Beschikking van de Commissie van 29 juli 1966 houdende machtiging
    tot het leggen van compenserende heffingen op de invoer in de Bondsrepubliek Duitsland
    van bepaalde chocoladeprodukten uit de overige Lid-Staten'
  type: main
