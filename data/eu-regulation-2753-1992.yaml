title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2753/92 of 22 September 1992 fixing the
    number of young male bovine animals which may be imported on special terms in
    the fourth quarter of 1992 and derogating from Regulation (EEC) No 2377/80 in
    respect of that quarter as regards the allocation of the quantities available
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2753/92 de la Commission, du 22 septembre 1992, relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le quatrième trimestre de 1992 et portant dérogation,
    pour ce trimestre, au règlement (CEE) n° 2377/80 en ce qui concerne l' attribution
    des quantités disponibles
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2753/92 der Kommission vom 22. September 1992 zur
    Festsetzung der Anzahl männlicher Jungrinder, die im vierten Vierteljahr 1992
    unter Sonderbedingungen eingeführt werden können, und zur Abweichung von der
    Verordnung (EWG) Nr. 2377/80 hinsichtlich der Zuteilung der verfügbaren Mengen
    in diesem Vierteljahr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2753/92 af 22. september 1992 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i fjerde kvartal
    af 1992, og om undtagelse for dette kvartal fra forordning (EØF) nr. 2377/80
    for så vidt angår tildelingen af disponible mængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2753/92 της Επιτροπής
    της 22ας Σεπτεμβρίου 1992 για τον καθορισμό των
    ποσοτήτων των νεαρών αρρένων βοοειδών που
    είναι δυνατόν να εισαχθούν με ειδικούς όρους
    κατά το τέταρτο τρίμηνο του 1992 και για παρέκκλιση,
    κατά το τρίμηνο αυτό, από τον κανονισμό (ΕΟΚ)
    αριθ. 2377/80 όσον αφορά την απόδοση των διαθεσίμων
    ποσοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2753/92 della Commissione, del 22 settembre 1992,
    che fissa il numero di giovani bovini maschi che possono essere importati a condizioni
    speciali nel quarto trimestre del 1992 e reca deroga, per tale trimestre, al regolamento
    (CEE) n. 2377/80 per quanto riguarda l' attribuzione dei quantitativi disponibili
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2753/92 van de Commissie van 22 september 1992 tot
    vaststelling van het aantal jonge mannelijke runderen dat in het vierde kwartaal
    van 1992 onder bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking,
    voor dat kwartaal, van Verordening (EEG) nr. 2377/80 ten aanzien van de toewijzing
    van de beschikbare aantallen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n° 2753/92 da Comissão, de 22 de Setembro de 1992,
    relativo à fixação da quantidade de vitelos machos que podem ser importados
    em condições especiais durante o quarto trimestre de 1992 e que prevê uma derrogação,
    no que diz respeito ao referido trimestre, ao Regulamento (CEE) n° 2377/80, quanto
    à atribuição das quantidades disponíveis
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2753/92 de la Comisión, de 22 de septiembre de 1992,
    por el que se fija la cantidad de machos jóvenes de la especie bovina que podrán
    importarse en condiciones especiales durante el cuarto trimestre de 1992 y por
    el que se establece una excepción, para este trimestre, al Reglamento (CEE) n°
    2377/80 en lo relativo a la atribución de las cantidades disponibles
  type: main
