title:
- language: en
  script: Latn
  content: '2007/411/EC: Commission Decision of 14 June 2007 prohibiting the placing
    on the market of products derived from bovine animals born or reared within the
    United Kingdom before 1 August 1996 for any purpose and exempting such animals
    from certain control and eradication measures laid down in Regulation (EC) No
    999/2001 and repealing Decision 2005/598/EC (notified under document number C(2007)
    2473)'
  type: main
- language: fr
  script: Latn
  content: '2007/411/CE: Décision de la Commission du 14 juin 2007 interdisant la
    mise sur le marché de produits dérivés de bovins nés ou élevés sur le territoire
    du Royaume-Uni avant le 1 er août 1996 à quelque fin que ce soit, exonérant
    ces animaux de certaines mesures de contrôle et d’éradication fixées dans
    le règlement (CE) n o 999/2001 du Parlement européen et du Conseil, et abrogeant
    la décision 2005/598/CE [notifiée sous le numéro C(2007) 2473]'
  type: main
