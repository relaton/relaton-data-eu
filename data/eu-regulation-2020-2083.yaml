    les mentions relatives au Japon dans la liste des pays tiers, territoires, zones
    ou compartiments en provenance desquels certains produits de volailles peuvent
    être importés dans l’Union ou transiter par celle-ci, quant à l’influenza
    aviaire hautement pathogène
  type: main
