  script: Latn
  content: Commission Implementing Regulation (EU) 2020/2083 of 14 December 2020 amending
    Annex I to Regulation (EC) No 798/2008 as regards the entry for Japan in the list
    of third countries, territories, zones or compartments from which certain poultry
    commodities may be imported into or transit through the Union in relation to highly
    pathogenic avian influenza
  type: main
- language: fr
  script: Latn
