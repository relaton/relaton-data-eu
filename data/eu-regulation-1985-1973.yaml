title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1985/73 of the Commission of 29 June 1973 determining
    the amounts of the variable components and compensatory amounts, and the additional
    duties applicable, during the third quarter of 1973 to the goods covered by Regulation
    (EEC) No 1059/69
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n 1985/73 de la Commission, du 29 juin 1973, déterminant
    les montants des éléments mobiles et les montants compensatoires, ainsi que
    les droits additionnels applicables, pendant le troisième trimestre de l'année
    1973, aux marchandises relevant du règlement (CEE) n 1059/69
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1985/73 der Kommission vom 29. Juni 1973 zur Festsetzung
    der Höhe der im dritten Vierteljahr 1973 bei der Einfuhr der unter die Verordnung
    (EWG) Nr. 1059/69 fallenden Waren anwendbaren beweglichen Teilbeträge, Ausgleichsbeträge
    und Zusatzzölle
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1985/73 af 29. juni 1973 om fastsættelse
    af størrelsen af de variable elementer, udligningsbeløb og tillægstold for
    varer henhørende under forordning (EØF) nr. 1059/69 i trejde kvartal 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1985/73 della Commissione, del 29 giugno 1973, che
    determina gli importi degli elementi mobili e gli importi compensativi, nonché
    i dazi addizionali applicabili all'importazione, per il secondo trimestre 1973,
    delle merci cui si applica il regolamento (CEE) n. 1059/69
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1985/73 van de Commissie van 29 juni 1973 tot vaststelling
    van de bedragen der gedurende het derde kwartal van 1973 bij invoer van onder
    Verordening (EEG) nr. 1059/69 vallende goederen toe te passen variabele elementen
    en compenserende heffingen alsmede aanvullende invoerrechten
  type: main
