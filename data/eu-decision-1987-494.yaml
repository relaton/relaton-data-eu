title:
- language: en
  script: Latn
  content: '87/494/EEC: Commission Decision of 18 September 1987 authorizing the Kingdom
    of Spain to apply intra- Community surveillance to imports of certain textile
    products originating in certain third countries which have been put into free
    circulation in the Community (Only the Spanish text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '87/494/CEE: Décision de la Commission du 18 septembre 1987 autorisant
    le Royaume d''Espagne à procéder à une surveillance intracommunautaire des
    importations de certains produits textiles originaires de certains pays tiers
    et mis en libre pratique dans la Communauté (Le texte en langue espagnole est
    le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '87/494/EWG: Entscheidung der Kommission vom 18. September 1987 zur Ermächtigung
    des Königreichs Spanien zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen bestimmten Textilwaren (Nur der spanische Text
    ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '87/494/EØF: Kommissionens beslutning af 18. september 1987 om bemyndigelse
    af Kongeriget Spanien til at indføre tilsyn inden for Fællesskabet med indførsel
    af visse tekstilvarer med oprindelse i visse tredjelande til fri omsætning i
    Fællesskabet (Kun den spanske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '87/494/ΕΟΚ: Απόφαση της Επιτροπής της 18ης
    Σεπτεμβρίου 1987 περί χορηγήσεως αδείας στο
    Βασίλειο της Ισπανίας για την καθιέρωση ενδοκοινοτικής
    επιβλέψεως των εισαγωγών ορισμένων κλωστοϋφαντουργικών
    προϊόντων καταγωγής ορισμένων τρίτων χωρών
    που βρίσκονται σε ελεύθερη κυκλοφορία στην
    Κοινότητα (Το κείμενο στην ισπανική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '87/494/CEE: Decisione della Commissione del 18 settembre 1987 che autorizza
    il Regno di Spagna ad istituire una sorveglianza intracomunitaria delle importazioni
    di taluni prodotti tessili originari di taluni paesi terzi messi in libera pratica
    nella Comunità (Il testo in lingua spagnola è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '87/494/EEG: Beschikking van de Commissie van 18 september 1987 houdende
    machtiging van het Koninkrijk Spanje tot toepassing van een intracommunautair
    toezicht ten aanzien van de invoer van bepaalde textielprodukten van oorsprong
    uit bepaalde derde landen, die in de Gemeenschap in het vrije verkeer zijn gebracht
    (Slechts de tekst in de Spaanse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '87/494/CEE: Decisão da Comissão de 18 de Setembro de 1987 que autoriza
    o Reino de Espanha a instaurar uma vigilância intracomunitária das importações
    de certos produtos têxteis originários de certos países terceiros introduzidos
    em livre prática na Comunidade (Apenas faz fé o texto em língua espanhola)'
  type: main
- language: es
  script: Latn
  content: '87/494/CEE: Decisión de la Comisión de 18 de septiembre de 1987 por
    la que se autoriza al Reino de España a establecer medidas de vigilancia intracomunitaria
    en relación con las importaciones de determinados productos textiles originarios
    de determinados terceros países despachados a libre práctica en la Comunidad
    (El texto en lengua española es el único auténtico)'
