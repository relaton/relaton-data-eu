title:
- language: en
  script: Latn
  content: '79/948/EEC: Commission Decision of 25 October 1979 authorizing the French
    Republic not to apply Community treatment to woven fabrics of cotton and woven
    fabrics of synthetic textile fibres, falling within heading No 55.09 and subheading
    56.07 A of the Common Customs Tariff (NIMEXE codes 55.09-01, 02, 03, 04, 05, 11,
    12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53,
    54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77,
    78, 81, 82, 83, 84, 86, 87, 92, 93, 97 ; 56.07-01, 04, 05, 07, 08, 11, 13, 14,
    16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (categories 2 and 3), originating
    in Thailand and in free circulation in the other Member States (Only the French
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/948/CEE: Décision de la Commission, du 25 octobre 1979, autorisant
    la République française à exclure du traitement communautaire les tissus de
    coton et de fibres textiles synthétiques de la position 55.09 et de la sous-position
    56.07 A du tarif douanier commun (codes Nimexe: 55.09-01, 02, 03, 04, 05, 11,
    12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53,
    54, 55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77,
    78, 81, 82, 83, 84, 86, 87, 92, 93, 97 - 56.07-01, 04, 05, 07, 08, 11, 13, 14,
    16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36) (catégories 2 et 3), originaires
    de la Thaïlande et mis en libre pratique dans les autres Etats membres (Le texte
    en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/948/EWG: Entscheidung der Kommission vom 25. Oktober 1979, mit der
    die Französische Republik ermächtigt wird, aus Thailand stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Gewebe aus Baumwolle und
    Gewebe aus synthetischen Spinnfasern der Tarifnummern 55.09 und 56.07 A des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 55.09-01; 02; 03; 04; 05; 11; 12; 13; 14; 15; 16;
    17; 19; 21; 29; 31; 33; 35; 37; 38; 39; 41; 49; 51; 52; 53; 54; 55; 56; 57; 59;
    61; 63; 64; 65; 66; 67; 68; 69; 70; 71; 72; 73; 74; 76; 77; 78; 81; 82; 83; 84;
    86; 87; 92; 93; 97 und 56.07-01; 04; 05; 07; 08; 11; 13; 14; 16; 17; 18; 21; 23;
    24; 26; 27; 28; 32; 33; 34; 36) (Kategorien 2 und 3) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/948/EØF: Kommissionens beslutning af 25. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage vævede stoffer
    af bomuld og vævet stof af syntetiske fibre, som henhører under pos. 55.09 og
    56.07 A i den fælles toldtarif (NIMEXE-nummer 55.09-01, 02, 03, 04, 05, 11, 12,
    13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53, 54,
    55, 56, 57, 59, 61, 63, 64, 65, 66, 67, 68, 69, 70, 71, 72, 73, 74, 76, 77, 78,
    81, 82, 83, 84, 86, 87, 92, 93, 97 ; 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16,
    17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36 ; kategori 2 og 3), har oprindelse
    i Thailand og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/948/CEE: Decisione della Commissione, del 25 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i tessuti di cotone
    e i tessuti di fibre tessili sintetiche della voce 55.09 e della sottovoce 56.07
    A della tariffa doganale comune (codici Nimexe: 55.09-01, 02, 03, 04, 05, 11,
    12, 13, 14, 15, 16, 17, 19, 21, 29, 31, 33, 35, 37, 38, 39, 41, 49, 51, 52, 53,
