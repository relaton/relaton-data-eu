    16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36), categorie 2 e 3, originari
    della Tailandia e messi in libera pratica negli altri Stati membri (Il testo in
    lingua francese è il solo facente fede)'
  type: main
