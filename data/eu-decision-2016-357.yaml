    jugoslávská republika Makedonie k účasti Bývalé jugoslávské republiky
    Makedonie jako pozorovatele na činnostech Agentury Evropské unie pro základní
    práva a způsobu této účasti v rámci stanoveném v článcích 4 a 5 nařízení
