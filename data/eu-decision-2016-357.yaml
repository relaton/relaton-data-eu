  content: Neuvoston päätös (EU) 2016/357, annettu 15 päivänä tammikuuta 2016,
    EU:n ja entisen Jugoslavian tasavallan Makedonian vakautus- ja assosiaationeuvostossa
    vahvistettavasta unionin kannasta, joka koskee entisen Jugoslavian tasavallan
