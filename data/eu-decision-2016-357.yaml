    Rady (ES) č. 168/2007, a to okrem iného v ustanoveniach o účasti na iniciatívach
    agentúry, o finančnom príspevku a zamestnancoch
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta (EU) 2016/357 z dne 15. januarja 2016 o stališču, ki ga sprejme
    Evropska unija v Stabilizacijsko-pridružitvenem svetu EU–nekdanja jugoslovanska
    republika Makedonija o udeležbi nekdanje jugoslovanske republike Makedonije kot
    opazovalke dela in njegovih podrobnosti v Agenciji Evropske unije za temeljne
    pravice v okviru, določenem v členih 4 in 5 Uredbe (ES) št. 168/2007, vključno
    z določbami o udeležbi pri pobudah Agencije, finančnem prispevku in osebju
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2016/357 del Consejo, de 15 de enero de 2016, relativa a
    la posición que ha de adoptar la Unión Europea en el Consejo de Estabilización
    y de Asociación UE-antigua República Yugoslava de Macedonia, en relación con
    la participación de la antigua República Yugoslava de Macedonia, en calidad
    de observador, en los trabajos de la Agencia de los Derechos Fundamentales de
    la Unión Europea, y con las modalidades respectivas de dicha participación,
    en el marco establecido por los artículos 4 y 5 del Reglamento (CE) n.° 168/2007,
