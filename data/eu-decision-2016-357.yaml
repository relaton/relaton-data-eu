  script: Latn
  content: Odluka Vijeća (EU) 2016/357 od 15. siječnja 2016. o stajalištu koje
    Europska unija treba donijeti u Vijeću za stabilizaciju i pridruživanje EU-a
    i bivše jugoslavenske republike Makedonije o sudjelovanju bivše jugoslavenske
