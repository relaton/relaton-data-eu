  content: Rådets beslut (EU) 2016/357 av den 15 januari 2016 om den ståndpunkt
    som ska intas av Europeiska unionen i stabiliserings- och associeringsrådet EU–f.d.
    jugoslaviska republiken Makedonien om f.d. jugoslaviska republiken Makedoniens
