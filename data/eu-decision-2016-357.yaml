title:
- language: en
  script: Latn
  content: Council Decision (EU) 2016/357 of 15 January 2016 on the position to be
    adopted by the European Union within the EU-the former Yugoslav Republic of Macedonia
    Stabilisation and Association Council on the participation of the former Yugoslav
    Republic of Macedonia as an observer in the European Union Agency for Fundamental
    Rights' work and the respective modalities thereof, within the framework set out
    in Articles 4 and 5 of Regulation (EC) No 168/2007, including provisions relating
    to participation in initiatives undertaken by the Agency, to the financial contribution
    and to staff
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2016/357 du Conseil du 15 janvier 2016 sur la position à
    prendre par l'Union européenne au sein du conseil de stabilisation et d'association
    UE-ancienne République yougoslave de Macédoine en ce qui concerne la participation
    de l'ancienne République yougoslave de Macédoine en tant qu'observateur aux
    travaux de l'Agence des droits fondamentaux de l'Union européenne, ainsi que
    les modalités respectives de ladite participation, dans le cadre établi par
    les articles 4 et 5 du règlement (CE) n° 168/2007, y compris les dispositions
    relatives à la participation aux initiatives prises par l'Agence, aux contributions
    financières et au personnel
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2016/357 des Rates vom 15. Januar 2016 über den im Namen
    der Europäischen Union zu vertretenden Standpunkt im Stabilitäts- und Assoziationsrat
    EU-ehemalige jugoslawische Republik Mazedonien im Hinblick auf die Beteiligung
    der ehemaligen jugoslawischen Republik Mazedonien im Rahmen von Artikel 4 und
    5 der Verordnung (EG) Nr. 168/2007 als Beobachter an den Arbeiten der Agentur
    der Europäischen Union für Grundrechte und die entsprechenden Modalitäten einschließlich
    Bestimmungen über die Mitwirkung an den von der Agentur eingeleiteten Initiativen,
    über finanzielle Beiträge und Personal
  type: main
- language: bg
  script: Cyrl
