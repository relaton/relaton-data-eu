    от Европейския съюз в Съвета за стабилизиране
    и асоцииране ЕС—бивша югославска република
    Македония относно участието на бившата югославска
    република Македония като наблюдател в работата
    на Агенцията на Европейския съюз за основните
    права и съответния ред и условия за това в съответствие
    с рамката, определена в членове 4 и 5 от Регламент
