    2006. gada jūnijā attiecībā uz dzīviem liellopiem tarifa kvotas ietvaros,
    kura paredzēta Regulā (EK) Nr. 1217/2005
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 25 d. Komisijos reglamentas (EB) Nr. 1133/2006 nustatantis,
