    mis on esitatud teatavate elusveiste kohta määrusega (EÜ) nr 1217/2005 ette
    nähtud tariifikvootide raames
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1133/2006, annettu 25 päivänä heinäkuuta
    2006 , eläviä nautaeläimiä koskevien kesäkuussa 2006 jätettyjen tuontioikeushakemusten
    hyväksyttävyydestä asetuksessa (EY) N:o 1217/2005 määriteltyjen tariffikiintiöiden
    rajoissa
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1133/2006/EK rendelete ( 2006. július 25. ) annak meghatározásáról,
