    presentate nel mese di giugno 2006 per bovini vivi nel quadro del contingente
    tariffario previsto dal regolamento (CE) n. 1217/2005
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1133/2006 ( 2006. gada 25. jūlijs ), ar ko nosaka,
