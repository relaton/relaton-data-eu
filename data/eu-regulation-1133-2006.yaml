    vámkontingens keretében, az egyes élő szarvasmarhafélékre vonatkozóan 2006
    júniusában benyújtott importjogosultság iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1133/2006 della Commissione, del 25 luglio 2006 , che
