title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1133/2006 of 25 July 2006 determining to
    what extent import right applications submitted during the month of June 2006
    for certain live bovine animals as part of a tariff quota provided for in Regulation
    (EC) No 1217/2005 may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1133/2006 de la Commission du 25 juillet 2006 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de droits d'importation
    introduites au mois de juin 2006 pour certains bovins vivants dans le cadre d'un
    contingent tarifaire prévu par le règlement (CE) n o 1217/2005
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1133/2006 der Kommission vom 25. Juli 2006 zur Festsetzung
    des Umfangs, in dem die im Juni 2006 eingereichten Anträge auf Einfuhrrechte
    für bestimmte lebende Rinder im Rahmen eines Zollkontingents gemäß der Verordnung
    (EG) Nr. 1217/2005 genehmigt werden können
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1133/2006 ze dne 25. července 2006 , kterým
    se stanoví, do jaké míry lze vyhovět žádostem o udělení dovozních práv
    na měsíc červen 2006 pro určitý živý skot, podaným v rámci celní kvóty
    dle nařízení (ES) č. 1217/2005
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1133/2006 af 25. juli 2006 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger om ret til import, som er
    indsendt i juni 2006, for levende kreaturer i forbindelse med et toldkontingent,
    der er fastsat i forordning (EF) nr. 1217/2005
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1133/2006 της Επιτροπής,
    της 25ης Ιουλίου 2006 , για καθορισμό του βαθμού
    στον οποίο είναι δυνατό να γίνουν αποδεκτές
    οι αιτήσεις διακαιωμάτων εισαγωγής που έχουν
    υποβληθεί τον Ιούνιο του 2006 για ορισμένα ζώντα
    βοοειδή, στο πλαίσιο μιας δασμολογικής ποσόστωσης
    η οποία προβλέπεται από τον κανονισμό (ΕΚ) αριθ.
    1217/2005
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1133/2006, 25. juuli 2006 , millega määratakse
