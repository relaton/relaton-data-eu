    juniju 2006 za nekatero živo govedo, v okviru tarifne kvote, predvidene z Uredbo
    (ES) št. 1217/2005
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 1133/2006 de la Comisión, de 25 de julio de 2006 ,
    por el que se determina la proporción en que se satisfarán las solicitudes de
    derechos de importación en el mes de junio de 2006 de animales vivos de la especie
    bovina, presentadas dentro de un contingente arancelario establecido en el Reglamento
    (CE) n o 1217/2005
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1133/2006 av den 25 juli 2006 om i vilken
