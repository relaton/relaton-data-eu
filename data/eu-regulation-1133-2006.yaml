  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1133/2006 van de Commissie van 25 juli 2006 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen van rechten tot
    invoer voor bepaalde levende runderen, die in juni 2006 zijn ingediend op grond
    van een bij Verordening (EG) nr. 1217/2005 vastgesteld tariefcontingent
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1133/2006 z dnia 25 lipca 2006 r. ustalające,
    w jakiej mierze mogą być uwzględnione wnioski o uprawnienia do przywozu w miesiącu
    czerwcu 2006 r. niektórych sztuk żywego bydła w ramach kontyngentu taryfowego
    przewidzianego w rozporządzeniu (WE) nr 1217/2005
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 1133/2006 da Comissão, de 25 de Julho de 2006 ,
    que determina em que medida podem ser aceites os pedidos de direitos de importação
    de determinados animais vivos da espécie bovina, apresentados no mês de Junho
    de 2006 ao abrigo de um contingente pautal previsto pelo Regulamento (CE) n. o
    1217/2005
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1133/2006 z 25. júla 2006 , ktorým sa určuje,
    do akej miery možno vyhovieť žiadostiam o udelenie dovozných licencií na
    mesiac jún 2006 na niektorý živý hovädzi dobytok v rámci colnej kvóty ustanovenej
    v nariadení (ES) č. 1217/2005
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1133/2006 z dne 25. julija 2006 o določitvi,
