    (ΕΟΚ) αριθ. 2552/93 για την επιβολή οριστικού δασμού
    αντιντάμπινγκ στις εισαγωγές τεχνητού κορούνδιου
    καταγωγής Λαϊκής Δημοκρατίας της Κίνας, Ρωσικής
