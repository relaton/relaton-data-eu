    kunstig korund med oprindelse i Den Kinesiske Folkerepublik, Rusland og Ukraine
    med undtagelse af sådanne varer, som sælges til eksport til Fællesskabet af
    selskaber, hvis tilsagn er blevet godtaget
  type: main
- language: el
  script: Grek
