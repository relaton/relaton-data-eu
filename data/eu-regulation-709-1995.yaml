title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 709/95 of 27 March 1995 amending Regulation
    (EEC) No 2552/93 imposing a definitive anti-dumping duty on imports of artificial
    corundum originating in the People's Republic of China, the Russian Federation
    and Ukraine, with the exception of those products sold for export to the Community
    by companies whose undertakings have been accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 709/95 du Conseil du 27 mars 1995 modifiant le règlement
    (CEE) n° 2552/93 instituant un droit antidumping définitif sur les importations
    de corindon artificiel originaire de la République populaire de Chine, de la
    fédération de Russie et de l'Ukraine, à l'exception des produits vendus à
    l'exportation dans la Communauté par les entreprises dont les engagements ont
    été acceptés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 709/95 des Rates vom 27. März 1995 zur Änderung der
    Verordnung (EWG) Nr. 2552/93 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von künstlichem Korund mit Ursprung in der Volksrepublik China,
    der Russischen Föderation und der Ukraine mit Ausnahme der Ausfuhren der Unternehmen,
    deren Verpflichtungen angenommen wurden
  type: main
- language: da
  script: Latn
  content: RÅDETS FORORDNING (EF) Nr. 709/95 af 27. marts 1995 om ændring af forordning
