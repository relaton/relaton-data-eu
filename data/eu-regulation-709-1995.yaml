  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 709/95, annettu 27 päivänä maaliskuuta 1995,
    lopullisen polkumyyntitullin käyttöön ottamisesta Kiinan kansantasavallasta,
    Venäjän federaatiosta ja Ukrainasta peräisin olevan keinotekoisen korundin
    tuonnissa, lukuun ottamatta niiden yritysten yhteisöön vietäväksi myytyjä
    tuotteita, joiden sitoumukset on hyväksytty, annetun asetuksen (ETY) N:o 2552/93
    muuttamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 709/95 del Consiglio del 27 marzo 1995 che modifica
