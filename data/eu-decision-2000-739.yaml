title:
- language: en
  script: Latn
  content: '2000/739/EC: Commission Decision of 17 November 2000 amending Decision
    1999/283/EC concerning the animal health conditions and veterinary certification
    for imports of fresh meat from certain African countries to take account of the
    animal health situation in South Africa (notified under document number C(2000)
    3335)'
  type: main
- language: fr
  script: Latn
  content: '2000/739/CE: Décision de la Commission du 17 novembre 2000 modifiant
    la décision 1999/283/CE concernant les conditions de police sanitaire et la certification
    vétérinaire requises à l''importation de viandes fraîches en provenance de
    certains pays africains pour tenir compte de la situation zoosanitaire en Afrique
    du Sud [notifiée sous le numéro C(2000) 3335]'
  type: main
- language: de
  script: Latn
  content: '2000/739/EG: Entscheidung der Kommission vom 17. November 2000 zur Änderung
    der Entscheidung 1999/283/EG über die Veterinärbedingungen und Veterinärbescheinigungen
    für die Einfuhr von frischem Fleisch aus bestimmten afrikanischen Ländern im
    Zusammenhang mit der Tierseuchenlage in Südafrika (Bekannt gegeben unter Aktenzeichen
    K(2000) 3335)'
  type: main
- language: da
  script: Latn
  content: '2000/739/EF: Kommissionens beslutning af 17. november 2000 om ændring
    af beslutning 1999/283/EF om dyresundhedsmæssige betingelser og udstedelse af
    veterinærcertifikat ved indførsel af fersk kød fra visse afrikanske lande for
    at tage hensyn til dyresundhedssituationen i Sydafrika (meddelt under nummer K(2000)
    3335)'
  type: main
- language: el
  script: Grek
