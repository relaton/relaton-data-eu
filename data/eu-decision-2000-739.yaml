    certificazione veterinaria cui è subordinata l''importazione di carni fresche
    provenienti da alcuni paesi africani, in considerazione della situazione zoosanitaria
    esistente in Sudafrica [notificata con il numero C(2000) 3335]'
  type: main
- language: nl
  script: Latn
  content: '2000/739/EG: Beschikking van de Commissie van 17 november 2000 houdende
