    ελέγχου και κτηνιατρικών πιστοποιητικών που
    απαιτούνται για την εισαγωγή νωπών κρεάτων
    με προέλευση ορισμένες αφρικανικές χώρες [κοινοποιηθείσα
    υπό τον αριθμό Ε(2000) 3335]'
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 17 päivänä marraskuuta 2000, eläinten terveysvaatimuksista
    ja eläinlääkärintodistuksesta tuoreen lihan tuonnissa tietyistä Afrikan maista
    Etelä-Afrikan eläinten terveydentilanteen huomioon ottamiseksi annetun komission
    päätöksen 1999/283/EY muuttamisesta (tiedoksiannettu numerolla K(2000) 3335)
  type: main
- language: it
  script: Latn
  content: '2000/739/CE: Decisione della Commissione, del 17 novembre 2000, che modifica
