title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1014/2004 of 24 May 2004 determining the
    percentage of quantities which may be allowed in respect of import licence applications
    lodged in May 2004 under tariff quotas for beef and veal provided for in Regulation
    (EC) No 1279/98 for Bulgaria and Romania
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1014/2004 de la Commission du 24 mai 2004 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en mai 2004 pour les contingents tarifaires de viandes bovines prévus
    par le règlement (CE) n° 1279/98 pour la Bulgarie et la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1014/2004 der Kommission vom 24. Mai 2004 zur Bestimmung
    des Prozentsatzes, zu dem den im Mai 2004 gestellten Anträgen auf Erteilung von
    Lizenzen für die Einfuhr von Rindfleisch aus Bulgarien und Rumänien im Rahmen
    der Zollkontingente gemäß der Verordnung (EG) Nr. 1279/98 stattgegeben wird
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise (ES) č. 1014/2004 ze dne 24. května 2004, kterým
    se stanoví množství, na něž lze podávat žádosti o dovozní licence na
    období od května 2004 v rámci celních kvót pro dovoz hovězího a telecího
    masa podle nařízení Rady (ES) č. 1279/98 pro Bulharsko a Rumunsko
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1014/2004 af 24. maj 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger indgivet i maj 2004 om importlicenser
    for kød i forbindelse med de toldkontingenter for oksekød, der i forordning
    (EF) nr. 1279/98 er fastsat for Republikken Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1014/2004 της Επιτροπής,
    της 24ης Μαΐου 2004, για καθορισμό σε ποιο βαθμό
    μπορούν να γίνουν αποδεκτές οι αιτήσεις χορηγήσεως
    πιστοποιητικών εισαγωγής που υποβλήθηκαν
    τον Μάιο του 2004 για τις συμπληρωματικές δασμολογικές
    ποσοστώσεις βοείου κρέατος που προβλέπονται
    από τον κανονισμό (ΕΚ) αριθ. 1279/98 για τη Βουλγαρία
    και τη Ρουμανία
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EÜ) nr 1014/2004, 24. mai 2004, millega määratakse
    kindlaks, kui suures ulatuses saab rahuldada impordisertifikaadi taotlusi, mis
    esitati mais 2004 veiseliha tariifikvootide alusel, mis on ette nähtud määrusega
    (EÜ) nr 1279/98 Bulgaaria ja Rumeenia puhul
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1014/2004, annettu 24 päivänä toukokuuta 2004,
    asetuksessa (EY) N:o 1279/98 säädettyjä naudanlihan tariffikiintiöitä koskevien,
    toukokuussa 2004 esitettyjen tuontitodistushakemusten hyväksyttävyydestä Bulgarian
    ja Romanian osalta
  type: main
- language: hu
  script: Latn
  content: A Bizottság 1014/2004/EK rendelete (2004. május 24.) azon mérték meghatározásáról,
    amelynek erejéig helyt lehet adni az 1279/98/EK rendeletben Bulgáriára és
    Romániára vonatkozóan meghatározott marha- és borjúhús-vámkontingensekre
    2004 májusában benyújtott behozatali engedély iránti kérelmeknek
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1014/2004 della Commissione, del 24 maggio 2004, che
    stabilisce in che misura possono essere accolte le domande di titoli di importazione
    presentate nel mese di maggio 2004 per i contingenti tariffari supplementari di
    carni bovine previsti dal regolamento (CE) n. 1279/98 per la Bulgaria e la Romania
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1014/2004 (2004. gada 24. maijs), ar ko nosaka
    daudzumus, par kuriem var iesniegt importa sertifikātu pieprasījumus 2004. gada
    maijā attiecībā uz liellopu gaļas tarifa kvotām, kas noteiktas Regulā (EK)
    Nr. 1279/98 Bulgārijai un Rumānijai
  type: main
- language: lt
  script: Latn
  content: 2004 m. gegužės 24 d. Komisijos reglamentas (EB) Nr. 1014/2004 nustatantis,
    kokia dalimi galima patenkinti 2004 m. gegužės mėn. pateiktas paraiškas importo
    licencijai gauti, remiantis galvijienos tarifinėmis kvotomis, Reglamente (EB)
    Nr. 1279/98 nustatytomis Bulgarijai ir Rumunijai
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1014/2004 van de Commissie van 24 mei 2004 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de in mei 2004 ingediende aanvragen
    om invoercertificaten voor de tariefcontingenten voor rundvlees die bij Verordening
    (EG) nr. 1279/98 zijn vastgesteld voor Bulgarije en Roemenië
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (WE) nr 1014/2004 z dnia 24 maja 2004 r. określające
    procentowo miarę, w jakiej mogą zostać uwzględnione wnioski o pozwolenie na
    przywóz, złożone w maju 2004 r. w ramach kontyngentów taryfowych na wołowinę
    i cielęcinę, przewidzianych w rozporządzeniu (WE) nr 1279/98 dla Bułgarii
    i Rumunii
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1014/2004 da Comissão, de 24 de Maio de 2004, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    apresentados em Maio de 2004 para os contingentes pautais de carnes de bovino
    previstos pelo Regulamento (CE) n.° 1279/98 para a Bulgária e a Roménia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 1014/2004 z 24. mája 2004, ktorým sa stanovuje
    množstvo, na ktoré je možné podať žiadosti o dovozné povolenie v máji
    2004 pre colné kvóty na hovädzie a teľacie mäso v zmysle nariadenia (ES)
    č. 1279/98 pre Bulharsko a Rumunsko
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (ES) št. 1014/2004 z dne 24. maja 2004 o določitvi količin,
    za katere je mogoče vložiti zahtevke za uvozna dovoljenja v maju 2004 v okviru
    tarifnih kvot za goveje in telečje meso, predvidenih v Uredbi (ES) št. 1279/98
    za Bolgarijo in Romunijo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1014/2004 de la Comisión, de 24 de mayo de 2004, por
    el que se determina la proporción en que podrán aceptarse las solicitudes de
    certificados de importación correspondientes a los contingentes arancelarios
    de carne de vacuno establecidos en el Reglamento (CE) n° 1279/98 para Bulgaria
    y Rumania, presentadas en mayo de 2004
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1014/2004 av den 24 maj 2004 om i vilken
    utsträckning ansökningar om importlicenser inlämnade under maj 2004 för de
    tilläggskvoter för nötkött som föreskrivs i förordning (EG) nr 1279/98 för
    Bulgarien och Rumänien kan godkännas
