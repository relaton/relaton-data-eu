title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2020/2121 of 16 December 2020
    concerning the authorisation of a preparation of 6-phytase produced by Komagataella
    phaffii DSM 32854 as a feed additive for all poultry species, ornamental birds,
    piglets, pigs for fattening, sows and minor porcine species for fattening or reproduction
    (holder of authorisation: Huvepharma EOOD)'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2020/2121 de la Commission du 16 décembre
    2020 concernant l’autorisation d’une préparation de 6-phytase produite par
    Komagataella phaffii DSM 32854 en tant qu’additif destiné à l’alimentation
    de toutes les espèces de volailles, des oiseaux d’ornement, des porcelets,
    des porcs d’engraissement, des truies et des espèces porcines mineures d’engraissement
    ou de reproduction (titulaire de l’autorisation: Huvepharma EOOD)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2020/2121 der Kommission vom 16. Dezember
    2020 zur Zulassung einer Zubereitung aus aus Komagataella phaffii DSM 32854 gewonnener
    6-Phytase als Zusatzstoff in Futtermitteln für alle Geflügelarten sowie für
    Ziervögel, Ferkel, Mastschweine, Sauen und Mast- oder Zuchtschweinearten von
    geringerer wirtschaftlicher Bedeutung (Zulassungsinhaber: Huvepharma EOOD)'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2020/2121 на Комисията
    от 16 декември 2020 година за разрешаване на употребата
    на препарат от 6-фитаза, получена от Komagataella
    phaffii DSM 32854, като хранителна добавка за всички
    видове домашни птици, декоративни птици, прасенца,
    прасета за угояване, свине майки и видове свине
    с по-малко стопанско значение, за угояване
    или за разплод (притежател на разрешението:
    Huvepharma EOOD)'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2020/2121, ze dne 16. prosince 2020
    o povolení přípravku 6-fytázy z Komagataella phaffii DSM 32854 jako doplňkové
    látky pro všechny druhy drůbeže, okrasné ptactvo, selata, výkrm prasat,
    prasnice, výkrm menšinových druhů prasat a menšinové druhy prasat určené
    k reprodukci (držitel povolení: Huvepharma EOOD)'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens gennemførelsesforordning (EU) 2020/2121 af 16. december
