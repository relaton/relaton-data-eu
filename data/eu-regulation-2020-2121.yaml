    DSM 32854 som fodertilsætningsstof til alle fjerkræarter, prydfugle, smågrise,
    slagtesvin, søer og mindre udbredte svinearter bestemt til slagtning eller avl
    (indehaver af godkendelsen: Huvepharma EOOD)'
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός κανονισμός (ΕΕ) 2020/2121 της
