title:
- language: fr
  script: Latn
  content: Décision du Conseil du 28 juin 1966, portant nouvelle prorogation de la
    décision du Conseil du 4 avril 1962, prévoyant la perception d'une taxe compensatoire
    sur certaines marchandises résultant de la transformation de produits agricoles
  type: main
- language: de
  script: Latn
  content: '66/385/EWG: Beschluß des Rates vom 28. Juni 1966 zur nochmaligen Verlängerung
    der Geltungsdauer des Beschlusses des Rates vom 4. April 1962 zur Erhebung einer
    Ausgleichsabgabe auf bestimmte Waren, die durch Verarbeitung landwirtschaftlicher
    Erzeugnisse entstehen'
  type: main
- language: it
  script: Latn
  content: '66/385/CEE: Decisione del Consiglio, del 28 giugno 1966, che proroga nuovamente
    la decisione del Consiglio del 4 aprile 1962, relativa alla percezione di una
    tassa di compensazione su talune merci risultanti dalla trasformazione di prodotti
    agricoli'
  type: main
- language: nl
  script: Latn
  content: '66/385/EEG: Besluit van de Raad van 28 juni 1966 houdende nieuwe verlenging
    van het besluit van de Raad van 4 april 1962 inzake het opleggen van een compenserende
    heffing op bepaalde produkten, verkregen uit de verwerking van landbouwprodukten'
  type: main
