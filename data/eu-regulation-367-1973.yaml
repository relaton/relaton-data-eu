  content: Regulation (EEC) No 367/73 of the Commission of 31 January 1973 amending,
    as regards its application in the new Member States, Regulation (EEC) No 1493/71
    on price increases and reductions applicable to intervention in cereals
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 367/73 de la Commission, du 31 janvier 1973, modifiant
    le règlement (CEE) n° 1493/71 relatif aux bonifications et réfactions à appliquer
    lors de l' intervention dans le secteur des céréales en ce qui concerne son
    application dans les nouveaux États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 367/73 der Kommission vom 31. Januar 1973 zur Änderung
    der Verordnung (EWG) Nr. 1493/71 über die Zu- und Abschläge für Getreide bei
    der Intervention im Hinblick auf ihre Anwendung in den neuen Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 367/73 af 31. januar 1973 om ændring
    af forordning (EØF) nr. 1493/71 om tillæg og fradrag ved intervention for korn
    med henblik på dens anvendelse i de nye medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 367/73 della Commissione, del 31 gennaio 1973, che
    modifica, per la sua applicazione nei nuovi Stati membri, il regolamento (CEE)
    n. 1493/71 relativo alle maggiorazioni e detrazioni applicabili all' intervento
    nel settore dei cereali
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 367/73 van de Commissie van 31 januari 1973 waarbij
    Verordening (EEG) nr. 1493/71 betreffende de bij interventie in de sector granen
    toe te passen toeslagen en kortingen wordt gewijzigd met het oog op de toepassing
    in de nieuwe Lid-Staten
