    τής κλάσεως 70. 13 τού Κοινού Δασμολογίου, καταγωγής
    Κίνας, δικαιούχου τών προβλεπομένων από τόν
    κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3009/82 della Commissione, del 10 novembre 1982, che
    ripristina la riscossopne dei dazi doganali applicabili agli oggetti di vetro
    della voce 70.13 della tariffa doganale comune, originari della Cina beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81 del Consigliob
  type: main
- language: nl
