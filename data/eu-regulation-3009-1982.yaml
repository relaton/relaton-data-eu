title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3009/82 of 10 November 1982 re-establishing
    the levying of customs duties on glassware, falling within heading No 70.13 and
    originating in China to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3009/82 de la Commission, du 10 novembre 1982, portant
    rétablissement de la perception des droits de douane applicables aux objets en
    verre de la position 70.13 du tarif douanier commun, originaires de Chine, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3009/82 der Kommission vom 10. November 1982 zur Wiedereinführung
    der Erhebung der Zölle für Glaswaren der Tarifnummer 70.13, mit Ursprung in
    China, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates vorgesehenen Zollpräferenzen
    gewährt werdeni
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3009/82 af 10. november 1982 om genindførelse
    af opkrævning af told for bordservice, af glas, henhørende under pos. 70.13
    og med oprindelse i Kina, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3601/81
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3009/82 τής Επιτροπής
    τής 10ης Νοεμβρίου 1982 περί αποκαταστάσεως τής
