title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1370/94 of 16 June 1994 amending Regulation
    (EC) No 614/94 authorizing the French and German intervention agencies to put
    up for sale by tender 350 000 tonnes of maize for export in the form of maize
    groats and meal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1370/94 de la Commission, du 16 juin 1994, modifiant
    le règlement (CE) n 614/94 autorisant les organismes d'intervention français
    et allemand à mettre en adjudication 350 000 tonnes de maïs en vue de l'exportation
    sous forme de gruaux et semoules de maïs
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1370/94 der Kommission vom 16. Juni 1994 zur Änderung
    der Verordnung (EG) Nr. 614/94 zur Ermächtigung der französischen und der deutschen
    Interventionsstelle zur Ausschreibung des Verkaufs von 350 000 Tonnen Mais zur
    Ausfuhr in Form von Grob- und Feingrieß
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1370/94 af 16. juni 1994 om ændring
    af forordning (EF) nr. 614/94 om bemyndigelse af det franske og det tyske interventionsorgan
    til at udbyde 350 000 tons majs i licitation med henblik på udførsel af gryn
    og groft mel af majs
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1370/94 της Επιτροπής
    της 16ης Ιουνίου 1994 για την τροποποίηση του
    κανονισμού (ΕΚ) αριθ. 614/94 που επιτρέπει στο
    γαλλικό και στο γερμανικό οργανισμό παρέμβασης
    να προκηρύξουν δημοπρασία για 350 000 τόνους αραβοσίτου
    προς εξαγωγή υπό μορφή πλιγουριών και σιμιγδαλιών
    αραβοσίτου
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1370/94 della Commissione, del 16 giugno 1994, che
    modifica il regolamento (CE) n. 614/94 che autorizza gli organismi di intervento
    francese e tedesco a vendere, mediante gara, 350 000 tonnellate di granturco da
    esportare sotto forma di semole e semolini di granturco
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1370/94 van de Commissie van 16 juni 1994 houdende
    wijziging van Verordening (EG) nr. 614/94 tot machtiging van het Franse en het
    Duitse interventiebureau om 350 000 ton maïs bij openbare inschrijving te koop
    aan te bieden voor uitvoer in de vorm van gries en griesmeel van maïs
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1370/94 da Comissão, de 16 de Junho de 1994, que
    altera o Regulamento (CE) nº 614/94 que autoriza os organismos de intervenção
    francês e alemão a porem a concurso 350 000 toneladas de milho destinadas à
    exportação sob a forma de grumos e sêmolas de milho
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n 1370/94 de la Comisión, de 16 de junio de 1994, por
    el que se modifica el Reglamento (CE) n 614/94 por el que se autoriza a los organismos
    de intervención francés y alemán para sacar a licitación 350 000 toneladas
    de maíz para su exportación en forma de grañones y sémola de maíz
