    pesticidů v ovoci a zelenině a v některých produktech rostlinného původu,
    včetně ovoce a zeleniny, a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Kommissionens direktiv 2000/57/EF af 22. september 2000 om ændring af
