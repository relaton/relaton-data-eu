title:
- language: en
  script: Latn
  content: Commission Directive 2000/57/EC of 22 September 2000 amending the Annexes
    to Council Directives 76/895/EEC and 90/642/EEC on the fixing of maximum levels
    for pesticide residues in and on fruit and vegetables and certain products of
    plant origin, including fruit and vegetables respectively
  type: main
- language: fr
  script: Latn
  content: Directive 2000/57/CE de la Commission du 22 septembre 2000 modifiant les
    annexes des directives 76/895/CEE et 90/642/CEE du Conseil concernant la fixation
    de teneurs maximales pour les résidus de pesticides respectivement sur et dans
    les fruits et légumes et certains produits d'origine végétale, y compris les
    fruits et légumes
  type: main
- language: de
  script: Latn
  content: Richtlinie 2000/57/EG der Kommission vom 22. September 2000 zur Änderung
    der Anhänge der Richtlinien 76/895/EWG und 90/642/EWG des Rates über die Festsetzung
    von Höchstgehalten an Rückständen von Schädlingsbekämpfungsmitteln auf und
    in Obst und Gemüse und bestimmten Erzeugnissen pflanzlichen Ursprungs, einschließlich
    Obst und Gemüse
  type: main
- language: bg
  script: Cyrl
  content: Директива 2000/57/EО на Комисията от 22 септември
    2000 година за изменение на приложенията към
    Директиви 76/895/EИО и 90/642/EИО на Съвета относно
    определянето на максимални количества на остатъци
    от пестициди във и върху на плодове и зеленчуци
    и някои продукти от растителен произход, включително
    плодове и зеленчуци
  type: main
- language: cs
  script: Latn
  content: Směrnice Komise 2000/57/ES ze dne 22. září 2000, kterou se mění přílohy
