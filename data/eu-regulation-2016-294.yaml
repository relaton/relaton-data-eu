  script: Latn
  content: Commission Implementing Regulation (EU) 2016/294 of 1 March 2016 amending
    for the 242nd time Council Regulation (EC) No 881/2002 imposing certain specific
    restrictive measures directed against certain persons and entities associated
    with the Al-Qaida network
  type: main
- language: fr
  script: Latn
