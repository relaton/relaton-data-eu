title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EEC) No 2047/93 of 27 July 1993 authorizing the
    trade of ozone depleting substances and products containing such substances with
    non-parties to the Montreal Protocol on substances that deplete the ozone layer
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2047/93 de la Commission du 27 juillet 1993 autorisant
    le commerce de substances qui appauvrissent la couche d'ozone et de produits qui
    en contiennent avec des pays non parties au protocole de Montréal relatif à
    des substances qui appauvrissent la couche d'ozone
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2047/93 DER KOMMISSION vom 27. Juli 1993 zur Genehmigung
    des Handels mit Stoffen, die zu einem Abbau der Ozonschicht führen, sowie mit
    Erzeugnissen, die solche Stoffe enthalten, mit Ländern, die nicht Vertragsparteien
    des Montrealer Protokolls über Stoffe, die zu einem Abbau der Ozonschicht führen,
    sind
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EØF) Nr. 2047/93 af 27. juli 1993 om tilladelse
    til handel med ozonlagsnedbrydende stoffer og produkter indeholdende sådanne
    stoffer med lande, der ikke er parter i Montreal-protokollen om stoffer, der nedbryder
    ozonlaget
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΟΚ) αριθ. 2047/93 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1993 ο οποίος επιτρέπει το εμπόριο
    ουσιών που καταστρέφουν τη στιβάδα του όζοντος
    και προϊόντων που περιέχουν τις ουσίες αυτές
    με χώρες μη μέρη του πρωτοκόλλου του Μόντρεαλ
    για τις ουσίες που καταστρέφουν τη στιβάδα
    του όζοντος
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 2047/93, annettu 27 päivänä heinäkuuta 1993,
    otsonikerrosta heikentävien aineiden ja otsonikerrosta heikentäviä aineita
    sisältävien tuotteiden kaupasta valtioiden kanssa, jotka eivät ole otsonikerrosta
    heikentävistä aineista tehdyn Montrealin pöytäkirjan osapuolia
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2047/93 DELLA COMMISSIONE del 27 luglio 1993 che autorizza
    gli scambi commerciali delle sostanze che riducono lo strato di ozono nonché
    dei prodotti contenenti tali sostanze con le parti non contraenti del Protocollo
    di Montreal relativo alle sostanze che riducono lo strato di ozono
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2047/93 VAN DE COMMISSIE van 27 juli 1993 houdende
    toestemming voor de handel in stoffen die de ozonlaag afbreken en produkten die
    dergelijke stoffen bevatten met niet-partijen bij het Protocol van Montreal betreffende
    stoffen die de ozonlaag afbreken
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) No 2047/93 DA COMISSÃO de 27 de Julho de 1993 que autoriza
    o comércio de substâncias destruidoras do ozono e de produtos que contêm essas
    substâncias com países que não são partes no protocolo de Montreal relativo
    às substâncias que empobrecem a camada de ozono
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2047/93 DE LA COMISIÓN de 27 de julio de 1993 por
    el que se autoriza el comercio de sustancias que destruyen el ozono y productos
    que contienen dichas sustancias con países y organizaciones que no sean Partes
    en el Protocolo de Montreal relativo a las sustancias que agotan la capa de ozono
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 2047/93 av den 27 juli 1993 om att tillåta
    handel med ozonnedbrytande ämnen och produkter som innehåller sådana ämnen
    med stater som inte är parter i Montrealprotokollet om ämnen som bryter ned
    ozonskiktet
  type: main
