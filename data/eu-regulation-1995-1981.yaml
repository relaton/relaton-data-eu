title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1995/81 of 15 July 1981 re-establishing
    the levying of customs duties on rubberized textile fabrics, products of category
    103 (code 1030), originating in South Korea, to which the preferential tariff
    arrangements of Council Regulation (EEC) No 3320/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1995/81 de la Commission, du 15 juillet 1981, portant
    rétablissement de la perception des droits de douane applicables aux tissus caoutchoutés
    de la catégorie 103 (code 1030), originaires de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3320/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1995/81 der Kommission vom 15. Juli 1981 über die
    Wiedereinführung des Zollsatzes für kautschutierte Gewebe der Warenkategorie
    Nr. 103 (Kennziffer 1030), mit Ursprung in Südkorea, dem die in der Verordnung
    (EWG) Nr. 3320/80 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1995/81 af 15. juli 1981 om genindførelse
    af opkrævning af toldafgifter for tekstilstoffer imprægneret, overtrukket eller
    lamineret med gummi under kategori 103 (kode 1030), som har oprindelse i Sydkorea
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3320/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1995/81 τής Επιτροπής
    τής 15ης Ιουλίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τελωνειακών δασμών γιά υφάσματα
    συνδεδυασμένα μετά καουτσούκ, τών προϊόντων
    τής κατηγορίας αριθ. 103 (κώδικας 1030), καταγωγής
    Νοτίου Κορέας, δικαιούχων τών προβλεπομένων
    στόν κανονισμό (ΕΟΚ) αριθ. 3320/80 τού Συμβουλίου,
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1995/81 della Commissione, del 15 luglio 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai tessuti gommati, della
    categoria di prodotti n. 103 (codice 1030), originari della Corea del Sud, beneficiaria
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3320/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1995/81 van de Commissie van 15 juli 1981 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op gegummeerde
    weefsels van de categorie van produkten nr. 103 (codenummer 1030), van oorsprong
    uit Zuid-Korea, waarvoor de algemene tariefpreferenties gelden als bepaald bij
    Verordening (EEG) nr. 3320/80 van de Raad
  type: main
