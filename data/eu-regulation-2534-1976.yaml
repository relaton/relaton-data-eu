title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2534/76 of 19 October 1976 re-establishing
    the levying of the customs duties on other articles for electrical lighting fittings,
    falling within subheading 70.14 A II, originating in Romania, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3010/75 of 17 November
    1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2534/76 de la Commission, du 19 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux autres articles
    pour l'équipement des appareils d'éclairage électrique, de la sous-position
    tarifaire 70.14 A II, originaires de la Roumanie, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre
    1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2534/76 der Kommission vom 19. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für andere Waren zum Ausstatten von elektrischen Beleuchtungskörpern,
    der Tarifstelle 70.14 A II, mit Ursprung in Rumänien, dem die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2534/76 af 19. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for andre glasartikler, der anvendes som udstyr
    til elektriske belysningsartikler, under underposition 70.14 A II, som har oprindelse
    i Rumænien og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2534/76 della Commissione, del 19 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili agli altri oggetti per
    completare gli apparecchi d'illuminazione elettrica, della sottovoce doganale
    70.14 A II, originari della Romania, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3010/75 del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2534/76 van de Commissie van 19 oktober 1976 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op andere uitrustingsstukken
    voor elektrische verlichtingsartikelen, van onderverdeling 70.14 A II, van oorsprong
    uit Roemenië ten behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad
    van 17 november 1975 algemene tariefpreferenties werden geopend
  type: main
