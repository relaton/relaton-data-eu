  content: Commission Decision of 22 February 1978 authorizing the Kingdom of the
    Netherlands to permit temporarily the marketing of seed not complying with requirements
    of Directive 69/208/EEC
  type: main
- language: fr
  script: Latn
  content: '78/286/CEE: Décision de la Commission, du 22 février 1978, autorisant
    le Royaume des Pays-Bas à admettre temporairement la commercialisation de semences
    ne répondant pas aux exigences de la directive 69/208/CEE'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 22. Februar 1978 zur Ermächtigung des
    Königreichs der Niederlande, vorübergehend Saatgut zum Verkehr zuzulassen, das
    den Anforderungen der Richtlinie 69/208/EWG des Rates nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 22. februar 1978 om bemyndigelse af kongeriget
