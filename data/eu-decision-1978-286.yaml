    i Rådets direktiv 69/208/EØF
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 22 febbraio 1978, che autorizza il Regno
    dei Paesi Bassi ad ammettere temporaneamente la commercializzazione di sementi
    che non soddisfano ai requisiti della direttiva 69/208/CEE del Consiglio
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 22 februari 1978 houdende machtiging van
    het Koninkrijk der Nederlanden om tijdelijk zaaizaad dat niet aan de eisen van
    Richtlijn 69/208/EEG van de Raad voldoet tot de handel toe te laten
