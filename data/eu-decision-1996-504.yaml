    Ιουνίου 1996 σχετικά με την ανταλλαγή επιστολών
    μεταξύ της Ευρωπαϊκής Κοινότητας και της Χιλής,
    για την προσωρινή εφαρμογή ορισμένων διατάξεων
    της συμφωνίας-πλαίσιο για τη συνεργασία, που
    έχει τελικό στόχο την προετοιμασία σύνδεσης
    πολιτικού και οικονομικού χαρακτήρα μεταξύ
    της Ευρωπαϊκής Κοινότητας και των κρατών μελών
    της, αφενός, και της Δημοκρατίας της Χιλής,
    αφετέρου'
  type: main
- language: fi
  script: Latn
  content: '96/504/EY: Neuvoston päätös, tehty 18 päivänä kesäkuuta 1996, Euroopan
    yhteisön ja sen jäsenvaltioiden sekä Chilen tasavallan poliittisen ja taloudellisen
    liiton perustamiseen tähtäävän yhteistyötä koskevan puitesopimuksen tiettyjen
    määräysten väliaikaista soveltamista koskevasta Euroopan yhteisön ja Chilen
    välisestä kirjeenvaihdosta'
  type: main
- language: it
  script: Latn
  content: '96/504/CE: Decisione del Consiglio del 18 giugno 1996 relativa allo scambio
