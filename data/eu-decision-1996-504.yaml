title:
- language: en
  script: Latn
  content: '96/504/EC: Council Decision of 18 July 1996 on the Exchange of Letters
    between the European Community and Chile concerning the provisional application
    of certain provisions of the Framework Cooperation Agreement leading ultimately
    to the establishment of a political and economic association between the European
    Community and its Member States, of the one part, and the Republic of Chile, of
    the other part'
  type: main
- language: fr
  script: Latn
  content: '96/504/CE: Décision du Conseil du 18 juin 1996 relative à l''échange
    de lettres entre la Communauté européenne et le Chili concernant l''application
    provisoire de certaines dispositions de l''accord-cadre de coopération destiné
    à préparer, comme objectif final, une association à caractère politique et
    économique entre la Communauté européenne et ses États membres, d''une part,
    et la République du Chili, d''autre part'
  type: main
- language: de
  script: Latn
  content: '96/504/EG: Beschluß des Rates vom 18. Juni 1996 über den Briefwechsel
    zwischen der Europaïschen Gemeinschaft und Chile betreffend die vorläufige Anwendung
    gewisser Bestimmungen des Kooperationsrahmenabkommens zur Vorbereitung einer politischen
    und wirtschaftlichen Assoziation zwischen der Europäischen Gemeinschaft und ihren
    Mitgliedstaaten einerseits und der Republik Chile andererseits'
  type: main
- language: da
  script: Latn
  content: '96/504/EF: Rådets afgørelse af 18. juni 1996 om brevvekslingen mellem
    Det Europæiske Fællesskab og Chile om midlertidig anvendelse af visse bestemmelser
    i rammeaftalen om samarbejde med henblik på som endeligt mål at forberede en
    associering af politisk og økonomisk art mellem Det Europæisk Fællesskab og
    dets medlemsstater på den ene side og Republikken Chile på den anden side'
  type: main
- language: el
  script: Grek
