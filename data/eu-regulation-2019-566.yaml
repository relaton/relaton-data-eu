    eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036
    des Europäischen Parlaments und des Rates und zur Einstellung der Untersuchung
    betreffend die Einfuhren derselben Ware mit Ursprung in der Republik Türkei
  type: main
