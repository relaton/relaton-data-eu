    de tuyauterie originaires de la Fédération de Russie, de la République de Corée
    et de Malaisie à la suite d'un réexamen au titre de l'expiration des mesures
    conformément à l'article 11, paragraphe 2, du règlement (UE) 2016/1036 du Parlement
