  script: Latn
  content: Commission Implementing Regulation (EU) 2019/566 of 9 April 2019 imposing
    a definitive anti-dumping duty on imports of certain tube and pipe fittings originating
    in the Russian Federation, the Republic of Korea and Malaysia following an expiry
    review pursuant to Article 11(2) of the Regulation (EU) 2016/1036 of the European
    Parliament and of the Council and terminating the investigation concerning the
    imports of the same product originating in the Republic of Turkey
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2019/566 de la Commission du 9 avril 2019
