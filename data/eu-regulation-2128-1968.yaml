  content: Règlement (CEE) n 2128/68 de la Commission, du 20 décembre 1968, déterminant
    les montants des éléments mobiles applicables pendant le premier trimestre de
    l'année 1969, à l'importation en provenance des pays tiers des marchandises
    relevant du règlement n 160/66/CEE du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2128/68 der Kommission vom 20. Dezember 1968 zur Festsetzung
    der Höhe der im ersten Vierteljahr des Jahres 1969 bei der Einfuhr der unter
    die Verordnung Nr. 160/66/EWG des Rates fallenden Waren in die Mitgliedstaaten
    anwendbaren beweglichen Teilbeträge
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2128/68 della Commissione, del 20 dicembre 1968, che
    determina gli importi degli elementi mobili applicabili durante il primo trimestre
    1969 all'importazione negli Stati membri delle merci di cui al regolamento n.
    160/ 66/CEE del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2128/68 van de Commissie van 20 december 1968 houdende
    vaststelling van de bedragen der gedurende het eerste kwartaal van 1969 bij invoer
    in de Lid-Staten van onder Verordening nr. 160/66/EEG van de Raad vallende goederen
    toe te passen variabele elementen
