    agencies and postponing the qualifying date for the sale of certain meat
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2195/77 de la Commission, du 4 octobre 1977, modifiant
    le règlement (CEE) n° 2073/74 en ce qui concerne les prix de vente de certaines
    viandes bovines détenues par les organismes d' intervention et reportant la date
    de prise en charge de certaines viandes mises en vente
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2195/77 der Kommission vom 4. Oktober 1977 zur Änderung
    der Verordnung (EWG) Nr. 2073/74 hinsichtlich der Verkaufspreise von Rindfleisch
    im Besitz der Interventionsstellen und des Übernahmetermins für zum Verkauf
    angebotenes Rindfleisch
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2195/77 af 4. oktober 1977 om ændring
