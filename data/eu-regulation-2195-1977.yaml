    di presa in consegna di talune carni bovine messe in vendita
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2195/77 van de Commissie van 4 oktober 1977 houdende
    wijziging van Verordening (EEG) nr. 2073/74 met betrekking tot de verkoopprijzen
    van bepaalde soorten rundvlees die in het bezit zijn van de interventiebureaus
    en wijziging van de uiterste datum van overname van vlees, dat te koop wordt aangeboden
