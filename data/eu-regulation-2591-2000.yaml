title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2591/2000 of 27 November 2000 laying down
    rates of compensatory interest applicable during the first half of 2001 to customs
    debts incurred in relation to compensating products or goods in the unaltered
    state (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2591/2000 de la Commission du 27 novembre 2000 fixant
    les taux d'intérêt compensatoire applicables en cas de naissance d'une dette
    douanière relative aux produits compensateurs ou aux marchandises en l'état
    (régime du perfectionnement actif, système de la suspension et régime de l'admission
    temporaire) pendant le premier semestre de 2001
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2591/2000 der Kommission vom 27. November 2000 mit
    Sätzen von Ausgleichszinsen, die im ersten Halbjahr 2001 bei Entstehung einer
    Zollschuld für Veredelungserzeugnisse oder unveränderte Waren (aktiver Veredelungsverkehr
    und vorübergehende Verwendung) anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2591/2000 af 27. november 2000 om fastsættelse
    af udligningsrenter, der skal tages i betragtning, når der opstår en toldskyld
    for forædlingsprodukter eller uforædlede varer (aktiv forædling og midlertidig
    indførsel) i første halvår af 2001
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2591/2000 της Επιτροπής,
    της 27ης Νοεμβρίου 2000, για τον καθορισμό εξισωτικών
    επιτοκίων που εφαρμόζονται σε περίπτωση γένεσης
    τελωνειακής οφειλής σχετικά με τα παράγωγα
    προϊόντα ή αρχικά εμπορεύματα (καθεστώς τελειοποίησης
    προς επανεξαγωγή και προσωρινής εισαγωγής)
    κατά τη διάρκεια του πρώτου εξάμηνου 2001
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 2591/2000, annettu 27 päivänä marraskuuta
    2000, vuoden 2001 ensimmäisellä kalenterivuosipuoliskolla sovellettavista jalostetuista
    tuotteista tai samassa tilassa olevista tavaroista syntyvän tullivelan hyvityskorkokannoista
    (sisäisen jalostuksen vapautusjärjestelmä, suspensiojärjestelmä ja väliaikainen
    maahantuonti)
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2591/2000 della Commissione, del 27 novembre 2000,
    che determina i tassi di interesse compensatori applicabili ove sorga un'obbligazione
    doganale relativa ai prodotti compensatori o alle merci tal quali (regime di perfezionamento
    attivo e ammissione temporanea) nel primo semestre 2001
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2591/2000 van de Commissie van 27 november 2000 tot
    vaststelling van de jaarlijkse intrestpercentages van toepassing in geval van
    het ontstaan van een douaneschuld voor veredelingsproducten of onveredelde goederen
    (regeling actieve veredeling en tijdelijke invoer) tijdens het eerste semester
    2001
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 2591/2000 da Comissão, de 27 de Novembro de 2000,
