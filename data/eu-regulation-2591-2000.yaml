    mercancías sin transformar (régimen de perfeccionamiento activo e importación
    temporal) durante el primer semestre de 2001
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 2591/2000 av den 27 november 2000 om
