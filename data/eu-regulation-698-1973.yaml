  content: Regulation (EEC) No 698/73 of the Commission of 5 March 1973 amending Regulation
    (EEC) No 741/72 on the method and rate of interest to be used for calculating
    financing costs in connection with interventions on the internal markets in beef
    and veal and milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 698/73 de la Commission, du 5 mars 1973, modifiant
    le règlement (CEE) n° 741/72 relatif à la méthode et aux taux d' intérêt
    à appliquer pour le calcul des frais de financement des interventions sur le
    marché intérieur dans le secteur de la viande bovine et dans le secteur du lait
    et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 698/73 der Kommission vom 5. März 1973 zur Änderung
    der Verordnung (EWG) Nr. 741/73 über die Methode und den Zinssatz, die zur Errechnung
    der Finanzierungskosten der Interventionen auf dem Binnenmarkt für Rindfleisch
    und für Milcherzeugnisse anzuwenden sind
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 698/73 af 5. marts 1973 om ændring
