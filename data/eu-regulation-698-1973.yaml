    ved beregningen af omkostningerne ved finansieringen af interventionerne på det
    indre marked for så vidt angår oksekød og mælk og mejeriprodukter
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 698/73 della Commissione, del 5 marzo 1973, che modifica
    il regolamento (CEE) n. 741/73, relativo al metodo e ai tassi d' interesse da
    applicare per il calcolo delle spese di finanziamento degli interventi sul mercato
    interno nel settore delle carni bovine, del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 698/73 van de Commissie van 5 maart 1973 tot wijziging
    van Verordening (EEG) nr. 741/72 betreffende de voor de berekening van de financieringskosten
    van de interventies op de interne markt in de sector rundvlees en in de sector
    melk en zuivelprodukten toe te passen methode en rentepercentages
