  content: DECISIONE DEL CONSIGLIO del 14 novembre 1988 che abroga la decisione 87/104/CEE
    recante accettazione dell'impegno assunto nell'ambito della procedura antidumping
    relativa alle importazioni di alcuni tipi di spazzole per dipingere, imbiancare
    o verniciare e simili, originarie della Repubblica popolare cinese e chiusura
    della procedura stessa (88/576/CEE)
  type: main
- language: nl
  script: Latn
  content: BESLUIT VAN DE RAAD van 14 november 1988 tot intrekking van Besluit 87/104/EEG
    houdende aanvaarding van een verbintenis in het kader van de anti-dumpingprocedure
    betreffende de invoer van borstels, kwasten en penselen voor het schilderen, verven,
    behangen en dergelijke, van oorsprong uit de Volksrepubliek China, en beëindiging
    van de procedure (88/576/EEG)
  type: main
- language: pt
  script: Latn
  content: DECISAO DO CONSELHO de 14 de Novembro de 1988 que revoga a Decisao 87/104/CEE,
    que aceita um compromisso no âmbito do processo anti-dumping relativo às importaçoes
    de pincéis para pintura, têmpera, envernizamento e similares, originarios da
    Republica Popular da China, e que encerra o inquérito (88/576/CEE)
  type: main
- language: es
