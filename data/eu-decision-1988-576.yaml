  content: DECISION DEL CONSEJO de 14 de noviembre de 1988 que deroga la Decision
    87/104/CEE por la que se acepta un compromiso ofrecido en relacion con el procedimiento
    antidumping relativo a las importaciones de brochas y pinceles para pintar, encalar,
    barnizar y similares originarios de la Republica Popular de China, y por la que
    se da por concluida la investigacion (88/576/CEE)
