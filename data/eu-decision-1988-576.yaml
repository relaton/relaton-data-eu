title:
- language: en
  script: Latn
  content: '88/576/EEC: Council Decision of 14 November 1988 repealing Decision 87/104/EEC
    accepting an undertaking given in connection with the anti-dumping proceeding
    concerning imports of paint, distemper, varnish and similar brushes originating
    in the People''s Republic of China and terminating the investigation'
  type: main
- language: fr
  script: Latn
  content: '88/576/CEE: Décision du Conseil du 14 novembre 1988 abrogeant la décision
    87/104/CEE portant acceptation d''un engagement souscrit dans le cadre de la procédure
    antidumping concernant les importations de certaines brosses à peindre, à badigeonner,
    à vernir et similaires, originaires de la République populaire de Chine, et
    portant clôture de l''enquête'
  type: main
- language: de
  script: Latn
  content: BESCHLUSS DES RATES vom 14. November 1988 zur Aufhebung des Beschlusses
    87/104/EWG zur Annahme einer Verpflichtung im Rahmen des Antidumpingverfahrens
    betreffend die Einfuhren von Farbpinseln und aehnlichen Pinseln mit Ursprung in
    der Volksrepublik China und ueber die Einstellung des Verfahrens (88/576/EWG)
  type: main
- language: da
  script: Latn
  content: RAADETS AFGOERELSE af 14. november 1988 om ophaevelse af afgoerelse 87/104/EOEF
    om godtagelse af tilsagn i forbindelse med antidumpingproceduren vedroerende importen
    af malerpensler, -boerster o.lign. med oprindelse i Den Kinesiske Folkerepublik
    og om afslutning af undersoegelsen (88/576/EOEF)
  type: main
- language: el
  script: Grek
  content: Απόφαση του Συμβουλίου της 14ης Νοεμβρίου
