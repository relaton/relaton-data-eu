title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3486/81 of 4 December 1981 re-establishing
    the levying of customs duties on raw or unmanufactured tobaccos other than Virginia
    type, falling within subheadings 24.01 ex A and ex B and originating in developing
    countries, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3321/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3486/81 de la Commission, du 4 décembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux tabacs bruts
    ou non fabriqués autres que du type Virginia, des sous-positions 24.01 ex A et
    ex B du tarif douanier commun, originaires des pays en voie de développement
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3321/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3486/81 der Kommission vom 4. Dezember 1981 zur Wiedereinführung
    des Zollsatzes für unverarbeiteten Tabak, anderen als der Sorte ,,Virginia' '
    , der Tarifstellen 24.01 ex A und ex B, mit Ursprung in Entwicklungsländern,
    denen die in der Verordnung (EWG) Nr. 3321/80 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3486/81 af 4. december 1981 om genindførelse
    af opkrævning af toldafgifter for rå eller ufabrikeret tobak af andre sorter
    end Virginia under position 24.01 ex A og ex B, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3321/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3486/81 τής Επιτροπής
    τής 4ης Δεκεμβρίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών πού εφαρμόζονται στά
    ακατέργαστα ή μή βιομηχανοποιημένα καπνά,
    εκτός τών καπνών τύπου Virginia, πού υπάγονται
    στίς διακρίσεις 24. 01 ex A καί ex B τού Κοινού Δασμολογίου,
    καταγωγής αναπτυσσομένων χωρών, δικαιούχων
    τών προβλεπομένων από τόν κανονισμό (EOK) αριθ.
    3321/80 τού Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3486/81 della Commissione, del 4 dicembre 1981, che
    ripristina la riscossione dei dazi doganali applicabili ai tabacchi grezzi o non
    lavorati, diversi dal tipo "Virginia", delle sottovoci 24.01 ex A e ex B della
    tariffa doganale comune, originari dei paesi in via di sviluppo beneficiari delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3321/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3486/81 van de Commissie van 4 december 1981 houdende
    wederinstelling van de heffing van de invoerrechten voor ruwe tabak en niet tot
    verbruik bereide tabak van andere soorten dan van de soort Virginia van post 24.01
    ex A en ex B van oorsprong uit de ontwikkelingslanden, ten behoeve waarvan bij
    Verordening (EEG) nr. 3321/80 van de Raad tariefpreferenties werden geopend
  type: main
