title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2025/1184 of 10 June 2025 amending
    Delegated Regulation (EU) 2016/1675 to add Algeria, Angola, Côte d’Ivoire,
    Kenya, Laos, Lebanon, Monaco, Namibia, Nepal and Venezuela to the list of high-risk
    third countries which have provided a written high-level political commitment
    to address the identified deficiencies and have developed an action plan with
    the FATF, and to remove Barbados, Gibraltar, Jamaica, Panama, the Philippines,
    Senegal, Uganda and the United Arab Emirates from that list
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2025/1184 de la Commission du 10 juin 2025 modifiant
    le règlement délégué (UE) 2016/1675 par l’ajout de l’Algérie, de l’Angola,
    de la Côte d’Ivoire, du Kenya, du Laos, du Liban, de Monaco, de la Namibie,
    du Népal et du Venezuela à la liste des pays tiers à haut risque qui ont pris
    un engagement écrit à haut niveau de remédier aux carences constatées et qui
    ont élaboré un plan d’action avec le GAFI, et par le retrait de cette liste
    de la Barbade, des Émirats arabes unis, de Gibraltar, de la Jamaïque, de l’Ouganda,
    du Panama, des Philippines et du Sénégal
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2025/1184 der Kommission vom 10. Juni 2025 zur
