    von Algerien, Angola, Côte d’Ivoire, Kenia, Laos, Libanon, Monaco, Namibia,
    Nepal und Venezuela in die Liste der Drittländer mit hohem Risiko, die sich schriftlich
    auf hoher politischer Ebene dazu verpflichtet haben, die festgestellten Mängel
    anzugehen, und mit der FATF einen Aktionsplan erarbeitet haben, und im Hinblick
    auf die Streichung von Barbados, Gibraltar, Jamaika, Panama, den Philippinen,
    Senegal, Uganda und den Vereinigten Arabischen Emiraten von dieser Liste
