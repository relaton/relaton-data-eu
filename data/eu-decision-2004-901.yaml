id: EUDecision2004901
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Decision 2004/901/CFSP of 22 December 2004 amending Decision 1999/730/CFSP
    implementing Joint Action 1999/34/CFSP with a view to a European Union contribution
    to combating the destabilising accumulation and spread of small arms and light
    weapons in Cambodia
  type: main
- language: fr
  script: Latn
  content: Décision 2004/901/PESC du Conseil du 22 décembre 2004 modifiant la décision
    1999/730/PESC mettant en œuvre l'action commune 1999/34/PESC en vue d'une contribution
    de l'Union européenne à la lutte contre l'accumulation et la diffusion déstabilisatrices
    des armes légères et de petit calibre au Cambodge
  type: main
- language: de
  script: Latn
  content: Beschluss 2004/901/GASP des Rates vom 22. Dezember 2004 zur Änderung des
    Beschlusses 1999/730/GASP zur Umsetzung der Gemeinsamen Aktion 1999/34/GASP durch
    einen Beitrag der Europäischen Union zur Bekämpfung der destabilisierenden Anhäufung
    und Verbreitung von Kleinwaffen und leichten Waffen in Kambodscha
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2004/901/SZBP ze dne 22. prosince 2004, kterým se mění
    rozhodnutí 1999/730/SZBP o provádění společné akce 1999/34/SZBP s ohledem
    na příspěvek Evropské unie k boji proti destabilizujícímu hromadění a
    šíření ručních palných zbraní a lehkých zbraní v Kambodži
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2004/901/FUSP af 22. december 2004 om ændring af afgørelse
    1999/730/FUSP om gennemførelse af fælles aktion 1999/34/FUSP med henblik på
    Den Europæiske Unions bidrag til bekæmpelse af destabiliserende ophobning og
    spredning af håndskydevåben og lette våben i Cambodja
  type: main
- language: el
  script: Grek
  content: Απόφαση 2004/901/ΚΕΠΠΑ του Συμβουλίου, της
    22ας Δεκεμβρίου 2004, όσον αφορά την τροποποίηση
    της απόφασης 1999/730/ΚΕΠΠΑ σχετικά με την εφαρμογή
    της κοινής δράσης 1999/34/ΚΕΠΠΑ για τη συμβολή
    της Ευρωπαϊκής Ένωσης στην καταπολέμηση της
    αποσταθεροποιητικής συσσώρευσης και διάδοσης
    φορητών όπλων και ελαφρού οπλισμού στην Καμπότζη
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2004/901/ÜVJP, 22. detsember 2004, millega muudetakse otsust
    1999/730/ÜVJP ühismeetme 1999/34/ÜVJP rakendamise kohta seoses Euroopa Liidu
    osalemisega käsi- ja kergete relvade destabiliseeriva kogunemise ja leviku vastases
    võitluses Kambodžas
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2004/901/YUTP, tehty 22 päivänä joulukuuta 2004,
    Euroopan unionin osallistumista käsiaseiden ja kevyiden aseiden epävakauttavan
    keskittymisen ja leviämisen torjumiseen Kambodžassa koskevan yhteisen toiminnan
    1999/34/YUTP täytäntöönpanosta tehdyn päätöksen 1999/730/YUTP muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2004/901/KKBP határozata (2004. december 22.) az Európai Uniónak
    Kambodzsában a kézi lőfegyverek és a könnyű fegyverek destabilizációra
    vezető felhalmozódása és elterjedése elleni küzdelemhez való hozzájárulása
    tekintetében az 1999/34/KKBP együttes fellépés végrehajtásáról szóló
    1999/730/KKBP határozat módosításáról
  type: main
- language: it
  script: Latn
  content: Decisione 2004/901/PESC del Consiglio, del 22 dicembre 2004, che modifica
    la decisione 1999/730/PESC che attua l'azione comune 1999/34/PESC in vista di
    un contributo dell'Unione europea alla lotta contro l'accumulazione e la diffusione
    destabilizzanti di armi portatili e di armi leggere in Cambogia
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2004/901/KĀDP (2004. gada 22. decembris), ar ko groza
    Lēmumu 1999/730/KĀDP par Vienotās rīcības 1999/34/KĀDP īstenošanu saistībā
    ar Eiropas Savienības ieguldījumu kājnieku ieroču un vieglo ieroču destabilizējošas
    uzkrāšanās un izplatīšanas Kambodžā apkarošanā
  type: main
- language: lt
  script: Latn
  content: 2004 m. gruodžio 22 d. Tarybos sprendimas 2004/901/BUSP, iš dalies keičiantis
    Sprendimą 1999/730/BUSP, įgyvendinantį Bendruosius veiksmus 1999/34/BUSP, dėl
    Europos Sąjungos indėlio į kovą su mažų ginklų ir lengvųjų ginklų destabilizuojančiu
    kaupimu ir plitimu Kambodžoje
  type: main
- language: nl
  script: Latn
  content: Besluit 2004/901/GBVB van de Raad van 22 december 2004 tot wijziging van
    Besluit 1999/730/GBVB tot uitvoering van Gemeenschappelijk Optreden 1999/34/GBVB
    met het oog op een bijdrage van de Europese Unie aan de bestrijding van de destabiliserende
    accumulatie en verspreiding van handvuurwapens en lichte wapens in Cambodja
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2004/901/WPZiB z dnia 22 grudnia 2004 r. zmieniająca decyzję
    1999/730/WPZiB wdrażającą wspólne działanie 1999/34/WPZiB w związku z wkładem
    Unii Europejskiej w zwalczanie destabilizującego gromadzenia i rozpowszechniania
    ręcznej broni strzeleckiej i broni lekkiej w Kambodży
  type: main
- language: pt
  script: Latn
  content: Decisão 2004/901/PESC do Conselho, de 22 de Dezembro de 2004, que altera
    a Decisão 1999/730/PESC que executa a Acção Comum 1999/34/PESC relativa ao
    contributo da União Europeia para o combate à acumulação e proliferação
    desestabilizadoras de armas de pequeno calibre e armas ligeiras no Camboja
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2004/901/SZBP z 22. decembra 2004, ktorým sa mení a
    dopĺňa rozhodnutie 1999/730/SZBP, ktorým sa vykonáva jednotná akcia 1999/34/SZBP
    o príspevku Európskej únie na boj proti destabilizačnému zhromažďovaniu
    a rozširovaniu zbraní malého kalibru a ľahkých zbraní v Kambodži
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2004/901/SZVP z dne 22. decembra 2004 o spremembi Sklepa 1999/730/SZVP
    o izvajanju Skupnega ukrepa 1999/34/SZVP o prispevku Evropske unije za boj proti
    destabilizirajočemu kopičenju in širjenju osebnega in lahkega orožja v Kambodži
  type: main
- language: es
  script: Latn
  content: Decisión 2004/901/PESC del Consejo, de 22 de diciembre de 2004, que modifica
    la Decisión 1999/730/PESC por la que se aplica la Acción Común 1999/34/PESC
    con vistas a la contribución de la Unión Europea para combatir la acumulación
    desestabilizadora y la proliferación de armas ligeras y de pequeño calibre en
    Camboya
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2004/901/GUSP av den 22 december 2004 om ändring av beslut
    1999/730/GUSP om genomförande av gemensam åtgärd 1999/34/GUSP som ett bidrag
    från Europeiska unionen för att bekämpa destabiliserande anhopning och spridning
    av handeldvapen och lätta vapen i Kambodja
  type: main
