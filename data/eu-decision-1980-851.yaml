title:
- language: en
  script: Latn
  content: '80/851/EEC: Commission Decision of 14 August 1980 amending for the fourth
    time Decision 78/360/EEC authorizing certain Member States to sell butter at a
    reduced price in the form of concentrated butter (Only the French, German, Dutch
    and English texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '80/851/CEE: Décision de la Commission, du 14 août 1980, portant quatrième
    modification de la décision 78/360/CEE autorisant plusieurs États membres à
    vendre du beurre à prix réduit sous forme de beurre concentré (Les textes en
    langues françaises, allemande, néerlandaise et anglaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '80/851/EWG: Entscheidung der Kommission vom 14. August 1980 zur vierten
    Änderung der Entscheidung 78/360/EWG zur Ermächtigung einiger Mitgliedstaaten,
    Butter in Form von Butterreinfett zu ermäßigten Preisen zu verkaufen (Nur der
    französische, deutsche, niederländische und englische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '80/851/EØF: Kommissionens beslutning af 14. august 1980 om fjerde ændring
    af beslutning 78/360/EØF om bemyndigelse til flere medlemsstater til at sælge
    smør til nedsat pris i form af koncentreret smør (Kun de franske, tyske, nederlandske
    og engelske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '80/851/ΕΟΚ: Απόφαση της Επιτροπής, της 14ης
    Αυγούστου 1980, με την οποία τροποποιείται για
    τέταρτη φορά η απόφαση 78/360/ΕΟΚ με την οποία
    επιτρέπεται σε αρκετά κράτη μέλη να πωλήσουν
    βούτυρο σε μειωμένη τιμή υπό τη μορφή συμπυκνώματος
    βουτύρου (Τα κείμενα στη γαλλική, γερμανική,
    ολλανδική και αγγλική γλώσσα είναι τα μόνα
    αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '80/851/CEE: Decisione della Commissione, del 14 agosto 1980, recante quarta
    modifica della decisione 78/360/CEE che autorizza alcuni Stati membri a vendere
    burro a prezzo ridotto sotto forma di burro concentrato (Il testi in lingua francese,
    tedesca, olandese e inglese sono il soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '80/851/EEG: Beschikking van de Commissie van 14 augustus 1980 houdende
    vierde wijziging van Beschikking 78/360/EEG tot machtiging van verschillende Lid-Staten
    om boter tegen verlaagde prijs in de vorm van boterconcentraat te verkopen (Slechts
    de teksten in de Franse, Duitse, Nederlandse en de Engelse taal zijn authentiek)'
  type: main
