title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 910/79 of 7 May 1979 re-establishing the
    levying of customs duties on dinoseb, falling within subheading ex 29.07 C III
    and originating in Romania, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3156/78 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 910/79 de la Commission, du 7 mai 1979, portant rétablissement
    de la perception des droits de douane applicables au dinosèbe, de la sous-position
    ex 29.07 C III du tarif douanier commun, originaire de la Roumanie, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) n° 3156/78 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 910/79 der Kommission vom 7. Mai 1979 zur Wiedereinführung
    des Zollsatzes für Dinoseb der Tarifstelle ex 29.07 C III, mit Ursprung in Rumänien,
    dem die in der Verordnung (EWG) Nr. 3156/78 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 910/79 af 7. maj 1979 om genindførelse
    af opkrævning af toldafgifter for dinoseb under underposition ex 29.07 C III
    som har oprindelse i Rumænien og omfattes af de toldpræferencer, som er fastsat
    i Rådets forordning (EØF) nr. 3156/78
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 910/79 della Commissione, del 7 maggio 1979, che ripristina
    la riscossione dei dazi doganali applicabili al dinosebe, della sottovoce doganale
    ex 29.07 C III, originario della Romania, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3156/78 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 910/79 van de Commissie van 7 mei 1979 houdende wederinstelling
    van de heffing van de invoerrechten van toepassing op dinoseb, van post ex 29.07
    C III, van oorsprong uit Roemenië, ten behoeve waarvan bij Verordening (EEG)
    nr. 3156/78 van de Raad algemene tariefpreferenties werden geopend
  type: main
