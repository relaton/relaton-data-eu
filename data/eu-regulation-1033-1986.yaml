title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1033/86 of 9 April 1986 re-establishing
    the levying of customs duties on ball bearings with greatest external diameter
    not more than 30 mm, falling within heading No ex 84.62, originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1033/86 de la Commission du 9 avril 1986 portant rétablissement
    de la perception des droits de douane applicables aux roulements à billes dont
    le plus grand diamètre n' excède pas 30 milimètres, de la position ex 84.62
    du tarif douanier commun, originaires de Singapour bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3599/85 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1033/86 der Kommission vom 9. April 1986 zur Wiedereinführung
    der Erhebung der Zölle für Kugellager mit einem größten äußeren Durchmesser
    von 30 mm oder weniger der Tarifnummer ex 84.62 des Gemeinsamen Zolltarifs mit
    Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1033/86 af 9. april 1986 om genindførelse
    af opkrævning af told for kuglelejer med største udvendige diameter på 30 mm
    og derunder, henhørende under position ex 84.62 i den fælles toldtarif og med
    oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3599/85
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1033/86 της Επιτροπής
    της 9ης Απριλίου 1986 περί αποκαταστάσεως της
    εφαρμογής των δασμών για ένσφαιρους τριβείς
    (με μπίλιες), των οποίων η μεγαλύτερη εξωτερική
    διάμετρος δεν υπερβαίνει τα 30 χιλιοστά, της
    κλάσεως ex 84.62 του κοινού δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου των προβλεπόμενων
    στον κανονισμό (ΕΟΚ) αριθ. 3599/85 του Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1033/86 della Commissione del 9 aprile 1986 che ripristina
    la riscossione dei dazi doganali applicabili ai cuscinetti a sfere, il cui più
    grande diametro esterno non ecceda 30 mm, della voce ex 84.62 della tariffa daganale
    comune, di Singapore beneficiario delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3599/85 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1033/86 van de Commissie van 9 april 1986 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kogellagers
    met een grootste uitwendige diameter van 30 mm of minder, van tariefpost ex 84.62
    van het gemeenschappelijk douanetarief, van oorsprong uit Singapore, waarvoor
    de in Verordening (EEG) nr. 3599/85 van de Raad vermelde tariefpreferenties zijn
    verleend
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1033/86 da Comissão de 9 de Abril de 1986 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis a rolamentos de esferas em que
    o maior diâmetro exterior não exceda 30 mm, da posição ex 84.62 da pauta aduaneira
    comum originários de Singapura, beneficiária das preferências pautais previstas
    pelo Regulamento (CEE) n.° 3599/85 do Conselho
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1033/86 de la Comisión de 9 de abril de 1986 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    rodamientos de bolas cuyo mayor diámetro exterior no exceda de 30 mm, de la partida
    arancelaria n° ex 84.62 originarios de Singapur, beneficiario de las preferencias
    arancelarias previstas por el Reglamento (CEE) n° 3599/85 del Consejo
  type: main
