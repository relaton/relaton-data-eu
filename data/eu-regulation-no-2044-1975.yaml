title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2044/75 of the Commission of 25 July 1975 on special
    detailed rules for the application of the system of import and export licences
    and the advance fixing of refunds in respect of milk and milk products
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2044/75 de la Commission, du 25 juillet 1975, portant
    modalités particulières d' application du régime des certificats d' importation
    et d' exportation et du régime de fixation à l' avance des restitutions dans
    le secteur du lait et des produits laitiers
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2044/75 der Kommission vom 25. Juli 1975 über besondere
    Durchführungsvorschriften für Einfuhr- und Ausfuhrlizenzen sowie für die Vorausfestsetzung
    der Erstattungen für Milch und Milcherzeugnisse
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2044/75 af 25. juli 1975 om de særlige
    gennemførelsesbestemmelser for ordningen med import- og eksportlicenser og forudfastsættelsesattester
    for mælk og mejeriprodukter
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2044/75 της Επιτροπής
    της 25ης Ιουλίου 1975 περί ειδικών διαδικασιών
    εφαρμογής του καθεστώτος των πιστοποιητικών
    εισαγωγής και εξαγωγής και του καθεστώτος
    προκαθορισμού των επιστροφών στον τομέα του
    γάλακτος και των γαλακτοκομικών προϊόντων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2044/75 della Commissione, del 25 luglio 1975, che
    stabilisce le modalità particolari d' applicazione del regime dei titoli d' importazione
    e d' esportazione e del regime di fissazione anticipata delle restituzioni nel
    settore del latte e dei prodotti lattiero-caseari
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2044/75 van de Commissie van 25 juli 1975 houdende
    bijzondere uitvoeringsbepalingen inzake de invoer- en uitvoercertificaten en inzake
    de vaststelling vooraf van de restituties, in de sector melk en zuivelprodukten
  type: main
