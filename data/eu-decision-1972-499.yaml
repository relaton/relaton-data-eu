title:
- language: fr
  script: Latn
  content: '72/499/CEE: Décision de la Commission du 22 décembre 1972, portant octroi
    du concours du Fonds social européen, prévu à l''article 125 du Traité, au
    bénéfice de la République fédérale d''Allemagne, pour des dépenses relatives
    à des opérations de rééducation professionnelle et de réinstallation effectuées
    par la Bundesversicherungsanstalt für Angestellte (BFA) les organismes d''assurances
    sociales des travailleurs, la Bundesanstalt für Arbeit (BA) et la Bergbau- Berufsgenossenschaft
    Bochum'
  type: main
- language: de
  script: Latn
  content: '72/499/EWG: Entscheidung der Kommission vom 22. Dezember 1972 zur Gewährung
    eines Zuschusses nach Artikel 125 EWG aus dem Europäischen Sozialfonds an die
    Bundesrepublik Deutschland zu Aufwendungen für von der Bundesversicherungsanstalt
    für Angestellte (BfA), den Arbeiterrentenversicherungsträgern, der Bundesanstalt
    für Arbeit (BA) und der Bergbau-Berufsgenossenschaft Bochum durchgeführte Berufsumschulungs-
    und Umsiedlungsmaßnahmen'
  type: main
- language: it
  script: Latn
  content: '72/499/CEE: Decisione della Commissione, del 22 dicembre 1972, recante
    la concessione di un contributo del Fondo sociale europeo, previsto dall''articolo
    125 del trattato, a favore della Repubblica federale di Germania per spese concernenti
    operazioni di riqualificazione professionale e di nuova sistemazione effettuate
    dalla «Bundesversicherungsanstalt für Angestellte (BfA)», dagli enti di assicurazioni
    sociali dei lavoratori, dalla «Bundesanstalt für Arbeit (BA)» e dalla «Bergbau-
    Berufsgenossenschaft-Bochum»'
  type: main
- language: nl
  script: Latn
  content: '72/499/EEG: Beschikking van de Commissie van 22 december 1972 houdende
    toekenning van een bijdrage uit het Europees Sociaal Fonds uit hoofde van artikel
    125 van het Verdrag ten gunste van de Bondsrepubliek Duitsland voor door de "Bundesversicherungsanstalt
    für Angestellte (BfA)", de sociale verzekeringsinstellingen voor werknemers,
    de "Bundesanstalt für Arbeit (BA)" en de "Bergbau-Berufsgenossenschaft Bochum"
    gemaakte omscholings- en verplaatsingskosten'
  type: main
