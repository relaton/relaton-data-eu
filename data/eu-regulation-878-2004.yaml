title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 878/2004 of 29 April 2004 laying down transitional
    measures in accordance with Regulation (EC) No 1774/2002 for certain animal by-products
    classified as Category 1 and 2 materials and intended for technical purposes
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 878/2004 de la Commission du 29 avril 2004 établissant
