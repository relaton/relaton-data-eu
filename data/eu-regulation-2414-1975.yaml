title:
- language: en
  script: Latn
  content: Regulation (EEC) No 2414/75 of the Commission of 22 September 1975 extending
    the period of validity of Regulation (EEC) No 3546/73 authorizing the United Kingdom
    to suspend temporarily and totally the customs duties on dried asparagus, celery
    and onions imported from other Member States
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2414/75 de la Commission, du 22 septembre 1975, prorogeant
    le règlement (CEE) n° 3546/73 autorisant le Royaume-Uni à suspendre temporairement
    et totalement les droits de douane applicables aux asperges, céleris et oignons
    séchés importés en provenance des autres États membres
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2414/75 der Kommission vom 22. September 1975 zur
    Verlängerung der Verordnung (EWG) Nr. 3546/73 zur Ermächtigung des Vereinigten
    Königreichs, die Zollsätze auf aus anderen Mitgliedstaaten eingeführte getrocknete
    Spargel, Knollensellerie und Zwiebeln zeitweilig und vollständig auszusetzen
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2414/75 af 22. september 1975 om forlængelse
    af forordning (EØF) nr. 3546/73 om bemyndigelse for Det forenede Kongerige til
    midlertidigt helt at suspendere tolden på tørrede asparges, knoldselleri og
    spiseløg indført fra andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2414/75 della Commissione, del 22 settembre 1975,
    che proroga il regolamento (CEE) n. 3546/73 che autorizza il Regno Unito a sospendere
    temporaneamente a totalmente i dazi doganali applicabili agli asparagi, sedanirape
    e cipolle, disseccati, importati in provenienza dagli altri Stati membri
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2414/75 van de Commissie van 22 september 1975 tot
    verlenging van Verordening (EEG) nr. 3546/73 waarbij het Verenigd Koninkrijk wordt
    gemachtigd tot een tijdelijke en gehele schorsing van de douanerechten op uit
    andere Lid-Staten ingevoerde gedroogde asperges, knolselderij en uien
  type: main
