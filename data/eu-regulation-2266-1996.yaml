  content: Commission Regulation (EC) No 2266/96 of 27 November 1996 amending Council
    Regulation (EC) No 1981/94 of 25 July 1994, opening and providing for the administration
    of Community tariff quotas for certain products originating in Algeria, Cyprus,
    Egypt, Israel, Jordan, Malta, Morocco, the West Bank and the Gaza Strip, Tunisia
    and Turkey, and providing detailed rules for extending and adapting these tariff
    quotas
  type: main
