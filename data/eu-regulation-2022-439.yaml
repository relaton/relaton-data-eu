title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/439 of 20 October 2021 supplementing
    Regulation (EU) No 575/2013 of the European Parliament and of the Council with
    regard to regulatory technical standards for the specification of the assessment
    methodology competent authorities are to follow when assessing the compliance
    of credit institutions and investment firms with the requirements to use the Internal
    Ratings Based Approach
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/439 de la Commission du 20 octobre 2021
    complétant le règlement (UE) no 575/2013 du Parlement européen et du Conseil
    par des normes techniques de réglementation précisant la méthode d’évaluation
    que les autorités compétentes doivent appliquer aux fins de l’évaluation
    du respect, par les établissements de crédit et les entreprises d’investissement,
    des exigences relatives à l’utilisation de l’approche fondée sur les notations
    internes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/439 der Kommission vom 20. Oktober 2021
    zur Ergänzung der Verordnung (EU) Nr. 575/2013 des Europäischen Parlaments und
    des Rates durch technische Regulierungsstandards zur Festlegung der Bewertungsmethode,
    nach der die zuständigen Behörden beurteilen, ob Kreditinstitute und Wertpapierfirmen
    die Anforderungen für die Anwendung des auf internen Beurteilungen basierenden
    Ansatzes (IRB-Ansatzes) erfüllen
  type: main
