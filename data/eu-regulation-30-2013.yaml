  content: Règlement d’exécution (UE) n ° 30/2013 de la Commission du 17 janvier
    2013 modifiant le règlement (CE) n ° 288/2009 portant modalités d’application
    du règlement (CE) n ° 1234/2007 du Conseil en ce qui concerne l’octroi d’une
    aide communautaire pour la distribution de fruits et de légumes, de fruits et
    de légumes transformés et de bananes et de produits qui en sont issus aux enfants
    dans les établissements scolaires, dans le cadre d’un programme en faveur de
