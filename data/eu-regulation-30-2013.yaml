  content: Commission Implementing Regulation (EU) No 30/2013 of 17 January 2013 amending
    Regulation (EC) No 288/2009 laying down detailed rules for applying Council Regulation
    (EC) No 1234/2007 as regards the Community aid for supplying fruit and vegetables,
    processed fruit and vegetables and banana products to children in educational
    establishments, in the framework of a School Fruit Scheme and derogating from
    Regulation (EC) No 288/2009
  type: main
- language: fr
