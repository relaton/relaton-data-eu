title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1644/2001 of 7 August 2001 amending Regulation
    (EC) No 2398/97 imposing a definitive anti-dumping duty on imports of cotton-type
    bed linen originating in Egypt, India and Pakistan and suspending its application
    with regard to imports originating in India
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1644/2001 du Conseil du 7 août 2001 modifiant le règlement
    (CE) n° 2398/97 instituant un droit antidumping définitif sur les importations
    de linge de lit en coton originaires d'Égypte, de l'Inde et du Pakistan et suspendant
    son application en ce qui concerne les importations originaires de l'Inde
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1644/2001 des Rates vom 7. August 2001 zur Änderung
    der Verordnung (EG) Nr. 2398/97 zur Einführung eines endgültigen Antidumpingzolls
    auf die Einfuhren von Bettwäsche aus Baumwolle mit Ursprung in Ägypten, Indien
    und Pakistan und zur Aussetzung ihrer Anwendung gegenüber den Einfuhren mit Ursprung
    in Indien
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1644/2001 af 7. august 2001 om ændring af
    forordning (EF) nr. 2398/97 om indførelse af en endelig antidumpingtold på importen
    af sengelinned af bomuld med oprindelse i Egypten, Indien og Pakistan og om suspension
    af anvendelsen heraf for import med oprindelse i Indien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1644/2001 του Συμβουλίου,
    της 7ης Αυγούστου 2001, για την τροποποίηση του
    κανονισμού (EΚ) αριθ. 2398/97 περί επιβολής οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές βαμβακερών
    πανικών κρεβατιού καταγωγής Αιγύπτου, Ινδίας
    και Πακιστάν και για την αναστολή της εφαρμογής
    του όσον αφορά τις εισαγωγές καταγωγής Ινδίας
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1644/2001, annettu 7 päivänä elokuuta 2001,
    lopullisen polkumyyntitullin käyttöönotosta Egyptistä, Intiasta ja Pakistanista
    peräisin olevien puuvillan tyyppisten vuodeliinavaatteiden tuonnissa annetun
    asetuksen (EY) N:o 2398/97 muuttamisesta ja sen Intiasta peräisin olevaan tuontiin
    soveltamisen keskeyttämisestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1644/2001 del Consiglio, del 7 agosto 2001, recante
    modifica del regolamento (CE) n. 2398/97, che istituisce un dazio antidumping
    definitivo sulle importazioni di biancheria da letto di cotone originarie dell'Egitto,
    dell'India e del Pakistan e che sospende la sua applicazione alle importazioni
    originarie dell'India
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1644/2001 van de Raad van 7 augustus 2001 tot wĳziging
    van Verordening (EG) nr. 2398/97 tot instelling van een definitief antidumpingrecht
    op de invoer van katoenachtig beddenlinnen van oorsprong uit Egypte, India en
    Pakistan en tot schorsing van de toepassing van die verordening op dit product
    uit India
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1644/2001 do Conselho, de 7 de Agosto de 2001, que
    altera o Regulamento (CE) n.° 2398/97 que institui um direito anti-dumping definitivo
    sobre as importações de roupas de cama de algodão originárias do Egipto, da
    Índia e do Paquistão, e que suspende a sua aplicação no que diz respeito às
    importações originárias da Índia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1644/2001 del Consejo, de 7 de agosto de 2001, por
    el que se modifica el Reglamento (CE) n° 2398/97 por el que se establece un derecho
    antidumping definitivo sobre las importaciones de ropa de cama de algodón originaria
    de Egipto, de la India y de Pakistán y por el que se suspende su aplicación
    respecto a las importaciones originarias de la India
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1644/2001 av den 7 augusti 2001 om ändring
