    wirtschaftlichen Expansion vom 30. Dezember 1970 vorgesehenen ergänzenden Regionalbeihilfe
    (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '84/472/EØF: Kommissionens beslutning af 16. maj 1984 om forlængelse
