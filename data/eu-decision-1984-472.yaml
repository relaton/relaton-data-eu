  script: Latn
  content: '84/472/EEC: Commission Decision of 16 May 1984 on the extension until
    30 June 1983 of the regional aid supplement provided for in Article 2 (b) of the
    Belgian Economic Expansion Act of 30 December 1970 (Only the French and Dutch
    texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '84/472/CEE: Décision de la Commission du 16 mai 1984 sur la prorogation
    jusqu''au 30 juin 1983 de l''aide régionale complémentaire prévue par l''article
    2 point b) de la loi belge sur l''expansion économique du 30 décembre 1970 (Les
    textes en langues française et néerlandaise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '84/472/EWG: Entscheidung der Kommission vom 16. Mai 1984 über die Weitergewährung
