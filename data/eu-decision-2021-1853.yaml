title:
- language: en
  script: Latn
  content: Council Decision (EU) 2021/1853 of 18 October 2021 on the position to be
    taken on behalf of the European Union within the Association Council set up by
    the Euro-Mediterranean Agreement establishing an Association between the European
    Communities and their Member States, of the one part, and the Arab Republic of
    Egypt, of the other part, as regards the extension of the validity of the EU-Egypt
    Partnership Priorities until new updated Partnership Priorities are adopted by
    the Association Council
  type: main
- language: fr
  script: Latn
  content: Décision (UE) 2021/1853 du Conseil du 18 octobre 2021 relative à la position
    à prendre, au nom de l’Union européenne, au sein du Conseil d’association
    institué par l’accord euro-méditerranéen établissant une association entre
    les Communautés européennes et leurs États membres, d’une part, et la République
    arabe d’Égypte, d’autre part, concernant la prorogation de la validité des
    priorités du partenariat UE-Égypte jusqu’à l’adoption par le Conseil d’association
    de nouvelles priorités actualisées pour le partenariat
  type: main
- language: de
  script: Latn
  content: Beschluss (EU) 2021/1853 des Rates vom 18. Oktober 2021 über den Standpunkt,
