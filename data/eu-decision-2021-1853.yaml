  script: Latn
  content: Decisión (UE) 2021/1853 del Consejo de 18 de octubre de 2021 relativa
    a la posición que debe adoptarse, en nombre de la Unión Europea, en el Consejo
    de Asociación instituido por el Acuerdo Euromediterráneo por el que se establece
    una Asociación entre las Comunidades Europeas y sus Estados miembros, por una
    parte, y la República Árabe de Egipto, por otra, en lo que respecta a la prórroga
