    som ska intas på Europeiska unionens vägnar i det associeringsråd som inrättats
    genom Europa–Medelhavsavtalet om upprättande av en associering mellan Europeiska
    gemenskaperna och deras medlemsstater, å ena sidan, och Arabrepubliken Egypten,
    å andra sidan, vad gäller en förlängning av giltighetstiden för prioriteringarna
    för partnerskapet EU–Egypten fram till dess att nya uppdaterade prioriteringar
    för partnerskapet antas av associeringsrådet
