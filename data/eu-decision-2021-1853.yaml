    zur Gründung einer Assoziation zwischen den Europäischen Gemeinschaften und
    ihren Mitgliedstaaten einerseits und der Arabischen Republik Ägypten andererseits
    eingesetzten Assoziationsrat zu der Verlängerung der Gültigkeit der Partnerschaftsprioritäten
    EU-Ägypten bis zur Annahme neuer aktualisierter Partnerschaftsprioritäten durch
    den Assoziationsrat zu vertreten ist
