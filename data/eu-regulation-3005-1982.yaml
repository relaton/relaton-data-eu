    condition on prices governing the importation into the Community of fresh lemons
    originating in certain Mediterranean countries
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3005/82 du Conseil, du 8 novembre 1982, modifiant
    le règlement (CEE) n° 471/76 en ce qui concerne la période de suspension de
    l' application de la condition en matière de prix à laquelle est soumise l'
    importation dans la Communauté de citrons frais originaires de certains pays
    du bassin méditerranéent
  type: main
- language: de
  script: Latn
