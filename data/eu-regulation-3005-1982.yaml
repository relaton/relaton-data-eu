    der Preisbedingung, der die Einfuhr frischer Zitronen mit Ursprung in einigen
    Ländern des Mittelmeerraums in die Gemeinschaft unterliegtn
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3005/82 af 8. november 1982 om ændring af
