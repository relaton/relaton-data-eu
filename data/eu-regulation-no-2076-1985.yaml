  content: Commission Regulation (EEC) No 2076/85 of 25 July 1985 fixing for the 1985/86
    marketing year the production aid for tinned pineapple and the minimum price to
    be paid to pineapple producers
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2076/85 de la Commission du 25 juillet 1985 fixant,
