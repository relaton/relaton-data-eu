    le conserve di ananassi ed il prezzo minimo da pagare ai produttori di ananassi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2076/85 van de Commissie van 25 juli 1985 houdende
    vaststelling, voor het verkoopseizoen 1985/1986, van het bedrag van de steun voor
    de produktie van ananasconserven en van de minimumprijs die aan de ananasproducenten
    moet worden betaald
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2076/85 da Comissão, de 25 de Julho de 1985, que
