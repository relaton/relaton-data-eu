    έτος 1985/86 την ενίσχυση στην παραγωγή για τις
    κονσέρβες ανανά και την ελάχιστη τιμή που θα
    πληρωθεί στους παραγωγούς ανανά
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2076/85 della Commissione del 25 luglio 1985 che fissa,
