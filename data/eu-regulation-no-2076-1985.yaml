    zahlenden Mindestpreises für das Wirtschaftsjahr 1985/86
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2076/85 af 25. juli 1985 om fastsættelse
    for produktionsåret 1985/86 af producentstøtten for ananaskonserves og den minimumspris,
    der skal betales ananasproducenterne
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2076/85 της Επιτροπής
