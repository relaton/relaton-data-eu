    di applicazione del regime dei titoli d' importazione, di esportazione e di fissazione
    anticipata relativi ai prodotti agricoli, per quanto riguarda segnatamente l'
    importazione e l' esportazione di piccoli quantitativi
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2666/82 van de Commissie van 5 oktober 1982 houdende
    vijfde wijziging, met voornamelijk betrekking tot invoer en uitvoer van kleine
    hoeveelheden, van Verordening (EEG) nr. 3183/80 houdende gemeenschappelijke uitvoeringsbepalingen
    inzake het stelsel van invoer-, uitvoer- en voorfixatiecertificaten voor landbouwprodukten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 2666/82 da Comissão, de 5 de Outubro de 1982, que
    estabelece a quinta alteração do Regulamento (CEE) n.° 3183/80 que estabelece
    as modalidades comuns de aplicação do regime de certificados de importação,
    de exportação e de prefixação para os produtos agrícolas no que se refere
    nomeadamente à importação e à exportação de pequenas quantidades
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 2666/82 de la Comisión, de 5 de octubre de 1982,
    por el que se modifica por quinta vez el Reglamento (CEE) n° 3183/80 por el que
    se establecen modalidades comunes de aplicación del régimen de certificados
    de importación, de exportación y de fijación anticipada para los productos
    agrícolas, en lo que se refiere en particular a la importación y la exportación
    de pequeñas cantidades
