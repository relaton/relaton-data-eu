    für Einfuhr- und Ausfuhrlizenzen sowie Vorausfestsetzungsbescheinigungen für
    landwirtschaftliche Erzeugnisse, insbesondere hinsichtlich der Einfuhr und Ausfuhr
    kleiner Mengen
  type: main
- language: da
  script: Latn
