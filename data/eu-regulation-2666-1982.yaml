    d' application du régime de certificats d' importation, d' exportation et de
    préfixation pour les produits agricoles en ce qui concerne notamment l' importation
    et l' exportation de petites quantités
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2666/82 der Kommission vom 5. Oktober 1982 zur fünften
