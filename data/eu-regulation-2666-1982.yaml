  content: Commission Regulation (EEC) No 2666/82 of 5 October 1982 amending for the
    fifth time Regulation (EEC) No 3183/80 laying down common detailed rules for the
    application of the system of import and export licences and advance fixing certificates
    for agricultural products in relation in particular to the import and export of
    small quantitiesl
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2666/82 de la Commission, du 5 octobre 1982, portant
