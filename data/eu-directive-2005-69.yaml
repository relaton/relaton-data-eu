title:
- language: en
  script: Latn
  content: Directive 2005/69/EC of the European Parliament and of the Council of 16
    November 2005 amending for the 27th time Council Directive 76/769/EEC on the approximation
    of the laws, regulations and administrative provisions of the Member States relating
    to restrictions on the marketing and use of certain dangerous substances and preparations
    (polycyclic aromatic hydrocarbons in extender oils and tyres)
  type: main
- language: fr
  script: Latn
  content: Directive 2005/69/CE du Parlement européen et du Conseil du 16 novembre
    2005 portant vingt-septième modification de la directive 76/769/CEE du Conseil
    concernant le rapprochement des dispositions législatives, réglementaires et
    administratives des États membres relatives à la limitation de la mise sur le
    marché et de l'emploi de certaines substances et préparations dangereuses (hydrocarbures
    aromatiques polycycliques contenus dans les huiles de dilution et les pneumatiques)
  type: main
- language: de
  script: Latn
  content: Richtlinie 2005/69/EG des Europäischen Parlaments und des Rates vom 16.
    November 2005 zur 27. Änderung der Richtlinie 76/769/EWG des Rates zur Angleichung
    der Rechts- und Verwaltungsvorschriften der Mitgliedstaaten betreffend Beschränkungen
    des Inverkehrbringens und der Verwendung gewisser gefährlicher Stoffe und Zubereitungen
    (polyzyklische aromatische Kohlenwasserstoffe in Weichmacherölen und Reifen)
  type: main
- language: bg
  script: Cyrl
