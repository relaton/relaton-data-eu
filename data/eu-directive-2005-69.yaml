  type: main
- language: it
  script: Latn
  content: Direttiva 2005/69/CE del Parlamento europeo e del Consiglio, del 16 novembre
    2005 , che modifica per la ventisettesima volta la direttiva 76/769/CEE del Consiglio
    concernente il ravvicinamento delle disposizioni legislative, regolamentari ed
    amministrative degli Stati membri relative alle restrizioni in materia di immissione
    sul mercato e di uso di talune sostanze e preparati pericolosi (idrocarburi policiclici
    aromatici contenuti negli oli diluenti e negli pneumatici)
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Direktīva 2005/69/EK ( 2005. gada 16. novembris
    ), ar ko divdesmit septīto reizi groza Padomes Direktīvu 76/769/EEK par dalībvalstu
    normatīvo un administratīvo aktu tuvināšanu attiecībā uz dažu bīstamu
    vielu un preparātu tirgū laišanas un lietošanas ierobežojumiem (policikliskie
    aromātiskie ogļūdeņraži pildeļļās un riepās)
  type: main
- language: lt
  script: Latn
  content: 2005 m. lapkričio 16 d. Europos Parlamento ir Tarybos direktyva 2005/69/EB,
    dvidešimt septintąjį kartą iš dalies keičianti Tarybos direktyvą 76/769/EEB
    dėl valstybių narių įstatymų ir kitų teisės aktų, susijusių su tam tikrų
    pavojingų medžiagų ir preparatų pardavimo ir naudojimo apribojimais, suderinimo
    (policikliniai aromatiniai angliavandeniliai minkštikliuose ir padangose)
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva 2005/69/KE tal-Parlament Ewropew u tal-Kunsill tas-16 ta’
    Novembru 2005 li temenda għas-sebgħa u għoxrin darba d-Direttiva tal-Kunsill
    76/769/KEE dwar l-approssimazzjoni tal-liġijiet, ir-regolamenti, u d-dispożizzjonijiet
    amministrattivi ta’ l-Istati Membri li għandhom x’jaqsmu ma’ restrizzjonijiet
    fuq il- marketing u l-użu ta’ ċertu sustanzi u preparazzjonijiet perikolużi
    (idrokarburi poliċikliċi aromatiċi fi żjut dilwenti u f’tajers)
  type: main
- language: nl
  script: Latn
  content: Richtlijn 2005/69/EG van het Europees Parlement en de Raad van 16 november
    2005 houdende zevenentwintigste wijziging van Richtlijn 76/769/EEG van de Raad
    betreffende de onderlinge aanpassing van de wettelijke en bestuursrechtelijke
    bepalingen der lidstaten inzake de beperking van het op de markt brengen en van
    het gebruik van bepaalde gevaarlijke stoffen en preparaten (polycyclische aromatische
    koolwaterstoffen in procesoliën voor rubberverwerking en in banden)
  type: main
- language: pl
  script: Latn
  content: Dyrektywa 2005/69/WE Parlamentu Europejskiego i Rady z dnia 16 listopada
    2005 r. zmieniająca po raz dwudziesty siódmy dyrektywę Rady 76/769/EWG w sprawie
    zbliżenia przepisów ustawowych, wykonawczych i administracyjnych Państw Członkowskich
    odnoszących się do ograniczeń we wprowadzaniu do obrotu i stosowaniu niektórych
    substancji i preparatów niebezpiecznych (wielopierścieniowych węglowodorów
    aromatycznych w olejach-zmiękczaczach i oponach)
  type: main
- language: pt
  script: Latn
  content: Directiva 2005/69/CE do Parlamento Europeu e do Conselho, de 16 de Novembro
    de 2005 , que altera pela vigésima sétima vez a Directiva 76/769/CEE do Conselho
    relativa à aproximação das disposições legislativas, regulamentares e administrativas
    dos Estados-Membros respeitantes à limitação da colocação no mercado e da
    utilização de algumas substâncias e preparações perigosas (hidrocarbonetos
    aromáticos policíclicos em óleos de diluição e pneumáticos)
  type: main
- language: ro
  script: Latn
  content: Directiva 2005/69/CE a Parlamentului European și a Consiliului din 16
    noiembrie 2005 de modificare pentru a douăzeci și șaptea oară a Directivei
    76/769/CEE a Consiliului privind apropierea actelor cu putere de lege și a actelor
    administrative ale statelor membre referitoare la restricțiile privind introducerea
    pe piață și utilizarea anumitor substanțe și preparate periculoase (hidrocarburi
    aromatice policiclice conținute în uleiurile de diluare și anvelope)
  type: main
- language: sk
  script: Latn
  content: Smernica Európskeho parlamentu a Rady 2005/69/ES zo 16. novembra 2005
    , ktorou sa po dvadsiatysiedmykrát mení a dopĺňa smernica Rady 76/769/EHS
    o aproximácii zákonov, iných právnych predpisov a správnych opatrení členských
    štátov vzťahujúcich sa na obmedzenia uvádzania na trh a používania niektorých
    nebezpečných látok a prípravkov (polycyklické aromatické uhľovodíky v
    procesných olejoch a pneumatikách)
  type: main
- language: sl
  script: Latn
  content: Direktiva Evropskega parlamenta in Sveta 2005/69/ES z dne 16. novembra
    2005 o sedemindvajseti spremembi Direktive Sveta 76/769/EGS o približevanju zakonov
    in drugih predpisov držav članic v zvezi z omejitvami pri trženju in uporabi
    nekaterih nevarnih snovi in pripravkov (policiklični aromatski ogljikovodiki
    v razteznih oljih in pnevmatikah)
  type: main
- language: es
  script: Latn
  content: Directiva 2005/69/CE del Parlamento Europeo y del Consejo, de 16 de noviembre
    de 2005 , por la que se modifica por vigesimoséptima vez la Directiva 76/769/CEE
    del Consejo relativa a la aproximación de las disposiciones legales, reglamentarias
    y administrativas de los Estados miembros que limitan la comercialización y el
    uso de determinadas sustancias y preparados peligrosos (hidrocarburos aromáticos
    policíclicos en aceites diluyentes y en neumáticos)
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets direktiv 2005/69/EG av den 16 november 2005
    om ändring för tjugosjunde gången av rådets direktiv 76/769/EEG om tillnärmning
    av medlemsstaternas lagar och andra författningar om begränsning av användning
    och utsläppande på marknaden av vissa farliga ämnen och preparat (beredningar)
    (polycykliska aromatiska kolväten i extender oils och däck)
