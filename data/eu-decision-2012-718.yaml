title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 20 September 2012 amending Decision
    2008/458/EC laying down rules for the implementation of Decision No 575/2007/EC
    of the European Parliament and of the Council establishing the European Return
    Fund for the period 2008 to 2013 as part of the General programme Solidarity and
    Management of Migration Flows as regards Member States’ management and control
    systems, the rules for administrative and financial management and the eligibility
    of expenditure on projects co-financed by the Fund (notified under document C(2012)
    6408)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution de la Commission du 20 septembre 2012 modifiant
    la décision 2008/458/CE fixant les modalités de mise en œuvre de la décision
    n o 575/2007/CE du Parlement européen et du Conseil portant création du Fonds
    européen pour le retour pour la période 2008-2013 dans le cadre du programme
    général Solidarité et gestion des flux migratoires en ce qui concerne les systèmes
    de gestion et de contrôle des États membres, les règles de gestion administrative
    et financière et l’éligibilité des dépenses pour les projets cofinancés
    par le Fonds [notifiée sous le numéro C(2012) 6408]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss der Kommission vom 20. September 2012 zur Änderung
    der Entscheidung 2008/458/EG mit Durchführungsbestimmungen zur Entscheidung Nr.
    575/2007/EG des Europäischen Parlaments und des Rates zur Einrichtung des Europäischen
    Rückkehrfonds für den Zeitraum 2008 bis 2013 innerhalb des Generellen Programms
    Solidarität und Steuerung der Migrationsströme in Bezug auf die Verwaltungs-
    und Kontrollsysteme der Mitgliedstaaten, die Vorschriften für die Verwaltung
    und finanzielle Abwicklung aus dem Fonds kofinanzierter Projekte und die Förderfähigkeit
    der Ausgaben im Rahmen solcher Projekte (Bekanntgegeben unter Aktenzeichen C(2012)
    6408)
  type: main
