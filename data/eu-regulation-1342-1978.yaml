title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1342/78 of 20 June 1978 re-establishing
    the levying of the customs duties on wrought bars, rods, angles, shapes and sections
    of aluminium; aluminium wire falling within heading No 76.02 originating in Yugoslavia,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1342/78 de la Commission, du 20 juin 1978, portant
    rétablissement de la perception des droits de douane applicables aux barres,
    profilés et fils de section pleine, en aluminium, de la position tarifaire 76.02,
    originaires de Yougoslavie bénéficiaire des préférences tarifaires prévues
    par le règlement (CEE) n° 2705/77 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1342/78 der Kommission vom 20. Juni 1978 zur Wiedereinführung
    des Zollsatzes für Stäbe, Profile und Draht, aus Aluminium, massiv, der Tarifnummer
    76.02, mit Ursprung in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1342/78 af 20. juni 1978 om genindførelse
    af opkrævning af toldafgifter for stænger, profiler og tråd, af aluminium,
    under position 76.02, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer,
    som er fastsat i Rådets forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1342/78 della Commissione, del 20 giugno 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle barre, profilati
    e fili di sezione piena, di alluminio della voce doganale 76.02 originari della
    Iugoslavia beneficiaria delle preferenze tariffarie previste dal regolamento (CEE)
    n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1342/78 van de Commissie van 20 juni 1978 houdende
    wederinstelling van de heffing van de douanerechten van toepassing op staven,
    profielen en draad, massief, van aluminium, van post 76.02, van oorsprong uit
    Joegoslavië, ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad
    algemene tariefpreferenties werden geopend
  type: main
