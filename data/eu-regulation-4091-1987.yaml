  content: Council Regulation (EEC) No 4091/87 of 22 December 1987 amending Regulation
    (EEC) No 3034/80 fixing the quantities of basic products considered to have been
    used in the manufacture of goods covered by Regulation (EEC) No 3033/80
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 4091/87 du Conseil du 22 décembre 1987 modifiant
    le règlement (CEE) n° 3034/80 fixant les quantités de produits de base considérées
    comme étant entrées dans la fabrication de marchandises relevant du règlement
    (CEE) n° 3033/80
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 4091/87 des Rates vom 22. Dezember 1987 zur Änderung
    der Verordnung (EWG) Nr. 3034/80 zur Festlegung der Grunderzeugnismengen, von
    denen unterstellt wird, daß sie zur Herstellung von Waren der Verordnung (EWG)
    Nr. 3033/80 verwendet worden sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 4091/87 af 22. december 1987 om ændring
    af forordning (EØF) nr. 3034/80 om fastsættelse af de mængder basisprodukter,
    der anses som medgået til fremstilling af varer, der henhører under forordning
    (EØF) nr. 3033/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 4091/87 του Συμβουλίου
