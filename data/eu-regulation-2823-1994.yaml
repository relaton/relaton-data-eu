    al beneficio dei massimali tariffari applicabili nel 1994 a taluni prodotti tessili
    originari dell' Indonesia e dell' India, beneficiarie delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3832/90 del Consiglio
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2823/94 VAN DE COMMISSIE van 21 november 1994 houdende
    wederinstelling van de heffing van de invoerrechten en stopzetting van de afboekingen
    die in 1994 van toepassing zijn op bepaalde textielprodukten van oorsprong uit
    Indonesië en India, waarvoor de algemene tariefpreferenties gelden als bepaald
    bij Verordening (EEG) nr. 3832/90 van de Raad
  type: main
