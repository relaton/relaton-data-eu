title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 2823/94 of 21 November 1994 re-establishing
    the levying of customs duties and ending the charges against tariff ceilings opened
    in 1994, on certain textile products originating in Indonesia and India, to which
    the preferential tariff arrangements set out in Council Regulation (EEC) No 3832/90
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 2823/94 de la Commission du 21 novembre 1994 portant
    établissement de la perception des droits de douane et cessation des imputations
    applicables en 1994 à certains produits textiles originaires d'Indonésie et
    d'Inde, bénéficiaires des préférences tarifaires prévues par le règlement
    (CEE) n° 3832/90 du Conseil
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2823/94 DER KOMMISSION vom 21. November 1994 über
    die Wiedereinführung des Zollsatzes und zur Einstellung von Anrechnungen für
    bestimmte Textilwaren mit Ursprung in Indonesien und Indien, für die die in der
    Verordnung (EWG) Nr. 3832/90 des Rates vorgesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2823/94 af 21. november 1994 om genindførelse
    af opkrævning af told og afslutning på afskrivninger på det toldloft, der blev
    åbnet i 1994 for visse tekstilvarer med oprindelse i Indonesien og Indien, som
    er præferenceberettiget i henhold til Rådets forordning (EØF) nr. 3832/90
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2823/94 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 21ης Νοεμβρίου 1994 περί επαναφοράς της εφαρμογής
    τελωνειακών δασμών και της διακοπής των καταλογισμών
