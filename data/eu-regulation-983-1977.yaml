  content: Commission Regulation (EEC) No 983/77 of 10 May 1977 amending Regulation
    (EEC) No 3188/76 on rules for the implementation of the special measures for the
    determination of offers of olive oil on the world market and on the Greek market
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 983/77 de la Commission, du 10 mai 1977, modifiant
    le règlement (CEE) n° 3188/76 relatif aux modalités d'application des mesures
    particulières, notamment pour la détermination des offres d'huile d'olive sur
    le marché mondial et le marché hellénique
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 983/77 der Kommission vom 10. Mai 1977 zur Änderung
    der Verordnung (EWG) Nr. 3188/76 über Durchführungsbestimmungen für die Sondermaßnahmen
    zur Ermittlung der Angebote von Olivenöl auf dem Weltmarkt und auf dem griechischen
    Markt
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 983/77 af 10. maj 1977 om ændring
