    jēdziena definīciju, ko izmanto vispārējā preferenču sistēmā, lai ņemtu
    vērā Nepālas īpašo stāvokli attiecībā uz dažu tekstilizstrādājumu eksportu
    uz Kopienu
  type: main
- language: lt
  script: Latn
