title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1715/97 of 3 September 1997 derogating from
    Regulation (EEC) No 2454/93 in respect of the definition of the concept of originating
    products used for the purposes of the scheme of generalized preferences to take
    account of the special situation of Nepal regarding certain exports of textiles
    to the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1715/97 de la Commission du 3 septembre 1997 portant
    dérogation au règlement (CEE) nº 2454/93 en ce qui concerne la définition
    de la notion de «produits originaires» établie dans le cadre du schéma de
    préférences tarifaires généralisées pour tenir compte de la situation particulière
    du Népal en ce qui concerne certains produits textiles exportés de ce pays vers
    la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1715/97 der Kommission vom 3. September 1997 über
    eine Abweichung von der Bestimmung des Begriffs "Ursprungserzeugnisse" in der
    Verordnung (EWG) Nr. 2454/93 im Rahmen des Allgemeinen Präferenzsystems zur Berücksichtigung
    der besonderen Lage Nepals bei bestimmten in die Gemeinschaft ausgeführten Textilwaren
  type: main
