    původní produkty používanou pro účely systému všeobecných celních preferencí
    s ohledem na zvláštní situaci Nepálu v případě některých textilních
    výrobků vyvážených z této země do Společenství
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1715/97 af 3. september 1997 om en undtagelse
