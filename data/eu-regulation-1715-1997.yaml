  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1715/97 della Commissione del 3 settembre 1997 recante
    deroga al regolamento (CEE) n. 2454/93 per quanto riguarda la definizione della
    nozione di «prodotti originari» stabilita nell'ambito dello schema di preferenze
    tariffarie generalizzate per tener conto della particolare situazione del Nepal
    per quanto concerne alcuni prodotti tessili esportati da tale paese nella Comunità
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (EK) Nr. 1715/97 (1997. gada 3. septembris), ar ko atkāpjas
