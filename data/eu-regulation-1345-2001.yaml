title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1345/2001 of 3 July 2001 specifying the extent
    to which applications lodged in June 2001 for import rights in respect of young
    male bovine animals for fattening may be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1345/2001 de la Commission du 3 juillet 2001 déterminant
    dans quelle mesure il peut être donné suite aux demandes de droits d'importation
    déposées au mois de juin 2001 pour les jeunes bovins mâles destinés à l'engraissement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1345/2001 der Kommission vom 3. Juli 2001 über das
    Ausmaß, in dem den im Juni 2001 eingereichten Anträgen auf Einfuhrrechte für
    zum Mästen bestimmte männliche Jungrinder stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1345/2001 af 3. juli 2001 om fastsættelse
    af, i hvilket omfang ansøgninger om importrettigheder, som er indsendt i juni
    2001 for ungtyre bestemt til opfedning, kan imødekommes
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1345/2001 της Επιτροπής,
    της 3ης Ιουλίου 2001, για καθορισμό σε ποιο βαθμό
    μπορεί να δοθεί συνέχεια στις αιτήσεις για
    δικαίωμα εισαγωγής που υποβλήθηκαν τον Ιούνιο
    2001 για τα νεαρά άρρενα βοοειδή που προορίζονται
    για πάχυνση
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1345/2001, annettu 3 päivänä heinäkuuta 2001,
    nuorten urospuolisten lihotukseen tarkoitettujen nautojen kesäkuussa 2001 esitettyjen
    tuontioikeushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1345/2001 della Commissione, del 3 luglio 2001, che
    stabilisce in quale misura può essere dato seguito alle domande di diritto d'importazione
    presentate nel mese di giugno 2001 per i giovani bovini maschi destinati all'ingrasso
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1345/2001 van de Commissie van 3 juli 2001 tot bepaling
    van de mate waarin de in juni 2001 ingediende aanvragen om een invoerrecht voor
    jonge mannelĳke mestrunderen ingewilligd kunnen worden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1345/2001 da Comissão, de 3 de Julho de 2001, que
    determina em que medida pode ser dado seguimento aos pedidos de direitos de importação
    apresentados no mês de Junho de 2001 para os bovinos machos jovens destinados
    à engorda
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1345/2001 de la Comisión, de 3 de julio de 2001, que
    determina en qué medida podrá darse curso a las solicitudes de derechos de importación
    presentadas en el mes de junio de 2001 para los machos jóvenes de la especie
    bovina destinados al engorde
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1345/2001 av den 3 juli 2001 om i vilken
    utsträckning ansökningar om importrättigheter inlämnade under juni 2001 för
    unga nötkreatur av hankön avsedda för gödning kan godkännas
  type: main
