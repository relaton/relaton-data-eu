title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 435/2008 of 19 May 2008 amending Regulation
    (EC) No 1371/2005 imposing a definitive anti-dumping duty on imports of grain-oriented
    flat-rolled products of silicon-electrical steel originating in the United States
    of America and Russia and repealing the anti-dumping duties imposed by Regulation
    (EC) No 1371/2005 on imports of grain-oriented flat-rolled products of silicon-electrical
    steel originating in Russia
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 435/2008 du Conseil du 19 mai 2008 modifiant le règlement
    (CE) n o 1371/2005 instituant un droit antidumping définitif sur les importations
    de produits laminés plats en aciers au silicium dits magnétiques à grains orientés
    originaires des États-Unis d’Amérique et de Russie et abrogeant les droits
    antidumping, institués par le règlement (CE) n o 1371/2005, sur les importations
    de produits laminés plats en aciers au silicium dits magnétiques à grains orientés
    originaires de Russie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 435/2008 des Rates vom 19. Mai 2008 zur Änderung der
    Verordnung (EG) Nr. 1371/2005 zur Einführung endgültiger Antidumpingzölle auf
    die Einfuhren kornorientierter flachgewalzter Erzeugnisse aus Silicium-Elektrostahl
    mit Ursprung in den Vereinigten Staaten von Amerika und Russland und zur Aufhebung
    der mit der Verordnung (EG) Nr. 1371/2005 eingeführten Antidumpingzölle auf
    die Einfuhren kornorientierter flachgewalzter Erzeugnisse aus Silicium-Elektrostahl
    mit Ursprung in Russland
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 435/2008 на Съвета от 19 май
