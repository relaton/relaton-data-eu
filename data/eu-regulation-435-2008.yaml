  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 435/2008, annettu 19 päivänä toukokuuta 2008
    , lopullisen polkumyyntitullin käyttöönotosta Amerikan yhdysvalloista ja Venäjältä
    peräisin olevien piiseosteisesta sähköteknisestä teräksestä valmistettujen
    suuntaisrakeisten levyvalmisteiden tuonnissa annetun asetuksen (EY) N:o 1371/2005
    muuttamisesta sekä Venäjältä peräisin olevien suuntaisrakeisten sähköteknisten
    levyvalmisteiden tuonnissa asetuksella (EY) N:o 1371/2005 käyttöön otettujen
    lopullisten polkumyyntitullien kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 435/2008/EK rendelete ( 2008. május 19. ) az Amerikai Egyesült
    Államokból és Oroszországból származó szilícium-elektromos acélból készült
    szemcseorientált síkhengerelt termékek behozatalát érintő végleges dömpingellenes
    vám kivetéséről szóló 1371/2005/EK rendelet módosításáról és az 1371/2005/EK
    rendelettel az Oroszországból származó szilícium-elektromos acélból készült
    szemcseorientált síkhengerelt termékek behozatalára kivetett dömpingellenes
    vám hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 435/2008 del Consiglio, del 19 maggio 2008 , recante
    modifica del regolamento (CE) n. 1371/2005 che istituisce un dazio antidumping
    definitivo sulle importazioni di lamiere e nastri di acciai al silicio detti magnetici,
    laminati a freddo e a grani orientati originari degli Stati Uniti e della Russia
    e che abroga il dazio antidumping imposto dal regolamento (CE) n. 1371/2005 sulle
    importazioni di lamiere e nastri di acciai al silicio detti magnetici, laminati
    a freddo e a grani orientati originari della Russia
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 435/2008 ( 2008. gada 19. maijs ), ar kuru groza
    Regulu (EK) Nr. 1371/2005, ar ko Amerikas Savienoto Valstu un Krievijas izcelsmes
    orientēta grauda struktūras elektrotehniskā silīcijtērauda plakanu velmējumu
    importu apliek ar galīgo antidempinga maksājumu un atceļ antidempinga maksājumus,
    kurus ar Regulu (EK) Nr. 1371/2005 noteica Krievijas izcelsmes orientēta grauda
    struktūras elektrotehniskā silīcijtērauda plakaniem velmējumiem
  type: main
- language: lt
  script: Latn
  content: 2008 m. gegužės 19 d. Tarybos reglamentas (EB) Nr. 435/2008, kuriuo iš
    dalies keičiamas Reglamentas (EB) Nr. 1371/2005, nustatantis galutinį antidempingo
    muitą Jungtinių Amerikos Valstijų ir Rusijos kilmės orientuoto grūdėtumo
    plokščių valcavimo produktų iš silicinio elektrotechninio plieno importui,
    ir panaikinami antidempingo muitai, nustatyti Reglamentu (EB) Nr. 1371/2005 importuojamiems
    Rusijos kilmės orientuoto grūdėtumo plokščių valcavimo produktams iš silicinio
    elektrotechninio plieno
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 435/2008 tad- 19 ta' Mejju 2008 li jemenda
    r-Regolament (KE) Nru 1371/2005 li jimponi dazju definittiv ta' anti-dumping fuq
    importazzjonijiet ta’ prodotti b’vina parallela rrumblati ċatt ta’ azzar
    silikon-elettriku li joriġinaw fl-Istati Uniti ta’ l-Amerika u r-Russja u li
    jirrevoka d-dazji ta' anti-dumping imposti bir-Regolament (KE) Nru 1371/2005 fuq
    importazzjonijiet ta’ prodotti b’vina parallela rrumblati ċatt ta’ azzar
    silikon-elettriku li joriġinaw fir-Russja
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 435/2008 van de Raad van 19 mei 2008 tot wijziging
    van Verordening (EG) nr. 1371/2005 tot instelling van een definitief antidumpingrecht
    op gewalste platte producten met georiënteerde korrel van siliciumstaal uit de
    Verenigde Staten van Amerika en Rusland, en tot intrekking van de bij Verordening
    (EG) nr. 1371/2005 ingestelde antidumpingrechten op gewalste platte producten
    met georiënteerde korrel van siliciumstaal van oorsprong uit Rusland
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 435/2008 z dnia 19 maja 2008 r. zmieniające
    rozporządzenie Rady (WE) nr 1371/2005 nakładające ostateczne cło antydumpingowe
    na przywóz wyrobów walcowanych płaskich ze stali krzemowej elektrotechnicznej
    o ziarnach zorientowanych pochodzących ze Stanów Zjednoczonych Ameryki i Rosji
    oraz uchylające cło antydumpingowe nałożone rozporządzeniem (WE) nr 1371/2005
    na przywóz wyrobów walcowanych płaskich ze stali krzemowej elektrotechnicznej
    o ziarnach zorientowanych pochodzących z Rosji
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 435/2008 do Conselho, de 19 de Maio de 2008 , que
    altera o Regulamento (CE) n. o 1371/2005 que institui um direito anti-dumping
    definitivo sobre as importações de produtos laminados planos, de grãos orientados,
    de aço ao silício, denominado magnético , originários dos Estados Unidos da
    América e da Rússia, e à revogação dos direitos anti-dumping instituídos
    pelo Regulamento (CE) n. o 1371/2005 sobre as importações de produtos laminados
    planos, de grãos orientados, de aço ao silício, denominado magnético , originários
    da Rússia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 435/2008 al Consiliului din 19 mai 2008 de modificare
    a Regulamentului (CE) nr. 1371/2005 de instituire a unei taxe antidumping definitive
    la importurile de produse laminate plate din oțeluri cu siliciu numite magnetice
    cu grăunți orientați din Statele Unite ale Americii și din Rusia și de abrogare
    a taxelor antidumping instituite prin Regulamentul (CE) nr. 1371/2005 la importurile
    de produse laminate plate din oțeluri cu siliciu numite magnetice cu grăunți
    orientați originare din Rusia
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 435/2008 z 19. mája 2008 o zmene a doplnení
    nariadenia (ES) č. 1371/2005, ktorým sa ukladá konečné antidumpingové clo
    na dovozy plochých valcovaných výrobkov s orientovanou štruktúrou z kremíkovej
    elektroocele s pôvodom v Spojených štátoch amerických a v Rusku a o zrušení
    antidumpingových ciel uložených nariadením (ES) č. 1371/2005 na dovozy elektroplechov
    s orientovanou štruktúrou z kremíkovej elektroocele s pôvodom v Rusku
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 435/2008 z dne 19. maja 2008 o spremembi Uredbe
    Sveta (ES) št. 1371/2005 o uvedbi dokončne protidampinške dajatve na uvoz zrnato
    usmerjenih ploščato valjanih izdelkov iz silicijevega jekla za elektropločevine
    s poreklom iz Združenih držav Amerike in Rusije in razveljavitvi protidampinških
    dajatev, uvedenih z Uredbo (ES) št. 1371/2005 na uvoz zrnato usmerjenih ploščato
    valjanih izdelkov iz silicijevega jekla za elektropločevine s poreklom iz Rusije
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 435/2008 del Consejo, de 19 de mayo de 2008 , por el
    que se modifica el Reglamento (CE) n o 1371/2005 por el que se impone un derecho
    antidumping definitivo sobre las importaciones de productos laminados planos de
    acero magnético al silicio, de grano orientado, originarios de Estados Unidos
    de América y de Rusia, y se derogan los derechos antidumping impuestos por el
    Reglamento (CE) n o 1371/2005 sobre las importaciones de productos laminados planos
    de acero magnético al silicio, de grano orientado, originarios de Rusia
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 435/2008 av den 19 maj 2008 om ändring av
    förordning (EG) nr 1371/2005 om införande av en slutgiltig antidumpningstull
    på import av kornorienterade valsade platta produkter av kisellegerat elektrostål
    med ursprung i Amerikas förenta stater och Ryska federationen och om upphävande
    av de antidumpningstullar som infördes genom förordning (EG) nr 1371/2005 på
    import av kornorienterade valsade platta produkter av kisellegerat elektrostål
    med ursprung i Ryssland
