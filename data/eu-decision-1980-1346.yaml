title:
- language: en
  script: Latn
  content: 'Commission Decision of 22 December 1980 establishing that the apparatus
    described as ''Quanta- ray-laboratory laser system, model DCR-IA Nd: YAG'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: 'Décision de la Commission, du 22 décembre 1980, constatant que l''importation
    de l''appareil dénommé "Quanta-Ray - laboratory laser system, model DCR-IA Nd:
    YAG" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: 'Entscheidung der Kommission vom 22. Dezember 1980, mit der festgestellt
    wird, daß das Gerät ,,QUANTA-RAY-Laboratory Laser System, model DCR-IA Nd: YAG"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: 'Kommissionens beslutning af 22. december 1980 om fastslåelse af, at indførsel
    af apparatet "QUANTA-RAY - Laboratory Laser System, model DCR-IA Nd: YAG" ikke
    kan ske med fritagelse for told efter den fælles toldtarif'
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 22 dicembre 1980, che stabilisce che
    l''importazione dell''apparecchio denominato "Quanta-Ray - laboratory laser system,
    model DCR-IA Nd: YAG" non può avvenire in franchigia dai dazi della tariffa doganale
    comune'
  type: main
- language: nl
  script: Latn
  content: 'Beschikking van de Commissie van 22 december 1980 waarbij wordt vastgesteld
    dat het apparaat genaamd ,,QUANTA-RAY-Laboratory Laser System, model DCR- IA Nd:
    YAG" niet met vrijstelling van de rechten van het gemeenschappelijk douanetarief
    mag worden ingevoerd'
  type: main
