title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3487/90 of 30 November 1990 laying down
    certain additional detailed rules for the application of the supplementary trade
    mechanism (STM) to fruit and vegetable trade between Spain and the Community as
    constituted at 31 December 1985 as regards tomatoes, lettuce, broad-leaf endives,
    carrots, artichokes, table grapes and melons
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3487/90 de la Commission du 30 novembre 1990 fixant
    certaines modalités additionnelles pour l'application du mécanisme complémentaire
    aux échanges (MCE) dans le secteur des fruits et légumes entre l'Espagne et
    la Communauté dans sa composition au 31 décembre 1985 en ce qui concerne les
    tomates, les laitues, les chicorées scaroles, les artichauts, les raisins de
    table et les melons
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 3487/90 DER KOMMISSION vom 30. November 1990 mit zusaetzlichen
    Bestimmungen zum ergaenzenden Mechanismus im Handel mit Tomaten, Salat, Endivie
    Eskariol, Artischocken, Tafeltrauben und Melonen zwischen Spanien und der Gemeinschaft
    in ihrer Zusammensetzung am 31. Dezember 1985
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3487/90 af 30. november 1990 om visse
    yderligere gennemførelsesbestemmelser for den supplerende mekanisme for samhandelen
    mellem Spanien og Fællesskabet i dets sammensætning pr. 31.12.1985 i sektoren
    for frugt og grønsager, for så vidt angår tomater, salat, bredbladet endivie,
    artiskokker, druer til spisebrug og meloner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3487/90 της Επιτροπής
    της 30ής Νοεμβρίου 1990 για τον καθορισμό ορισμένων
    πρόσθετων λεπτομερειών για την εφαρμογή του
    συμπληρωματικού μηχανισμού στις συναλλαγές
    στον τομέα των οπωροκηπευτικών μεταξύ της
    Ισπανίας και της Κοινότητας με τη σύνθεσή της
    στις 31 Δεκεμβρίου 1985 όσον αφορά τις τομάτες,
    τα μαρούλια, τις σκαρόλες, τις αγκινάρες, τα
    επιτραπέζια σταφύλια και τα πεπόνια
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 3487/90 DELLA COMMISSIONE del 30 novembre 1990 recante
    fissazione di modalità complementari di applicazione del meccanismo complementare
    agli scambi nel settore degli ortofrutticoli fra la Spagna e la Comunità nella
    sua composizione al 31 dicembre 1985 per quanto riguarda i pomodori, le lattughe,
    le cicorie scarole, i carciofi, le uve da tavola e i meloni
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 3487/90 VAN DE COMMISSIE van 30 november 1990 tot
    vaststelling van bijkomende bepalingen voor de toepassing van de aanvullende regeling
    voor het handelsverkeer in de sector groenten en fruit tussen Spanje en de Gemeenschap
    in haar samenstelling op 31 december 1985, ten aanzien van tomaten, sla, andijvie,
    artisjokken, tafeldruiven en meloenen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 3487/90 DA COMISSAO de 30 de Novembro de 1990 que
    fixa determinadas normas adicionais para a execuçao do mecanismo complementar
    aplicavel às trocas comerciais (MCT) no sector das frutas e produtos horticolas
    entre Espanha e a Comunidade na sua composiçao em 31 de Dezembro de 1985, no
    que diz respeito aos tomates, alfaces, chicorias-escarolas, alcachofras, uvas
    de mesa e meloes
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 3487/90 DE LA COMISION de 30 de noviembre de 1990 por
    el que se fijan determinadas normas adicionales para la aplicacion del mecanismo
    complementario a los intercambios (MCI) entre Espana y la Comunidad en su composicion
    de 31 de diciembre de 1985 en el sector de las frutas y hortalizas por lo que
    se refiere a los tomates, las lechugas, las escarolas, las alcachofas, las uvas
    de mesa y los melones
  type: main
