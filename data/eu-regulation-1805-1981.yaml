title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1805/81 of 26 June 1981 fixing for the 1981/82
    marketing year the Community offer prices for sweet oranges applicable as regards
    Greece and the coefficients to be used to calculate the offer prices for Greek
    oranges
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1805/81 de la Commission, du 26 juin 1981, fixant,
    pour la campagne 1981/1982, le prix d' offre communautaire des oranges douces
    applicable vis-à-vis de la Grèce ainsi que les coefficients à appliquer pour
    le calcul du prix d' offre du produit grec
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1805/81 der Kommission vom 26. Juni 1981 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Süßorangen gegenüber Griechenland
    sowie der zur Berechnung des Angebotspreises für das griechische Erzeugnis anzuwendenden
    Koeffizienten für das Wirtschaftsjahr 1981/82
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1805/81 af 26. juni 1981 om fastsættelse
    for høståret 1981/82, for så vidt angår Grækenland, af fællesskabstilbudsprisen
    på appelsiner samt af koefficienterne for beregningen af tilbudsprisen på det
    græske produkt
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1805/81 τής Επιτροπής
    τής 26ης Ιουνίου 1981 περί καθορισμού, γιά τήν
    περίοδο εμπορίας 1981/82, τής κοινοτικής τιμής
    προσφοράς γιά τά γλυκά πορτοκάλια η οποία εφαρμόζεται
    έναντι τής Ελλάδος, καθώς καί τών συντελεστών
    πού πρέπει νά εφαρμόζονται γιά τόν υπολογισμό
    τής τιμής προσφοράς τού ελληνικού προϊόντος
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1805/81 della Commissione, del 26 giugno 1981, che
    fissa, per la campagna 1981/1982, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per le arance dolci, nonché i coefficienti da utilizzare
    per il calcolo del prezzo d' offerta del prodotto ellenico
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1805/81 van de Commissie van 26 juni 1981 tot vaststelling,
    voor het verkoopseizoen 1981/1982, van de ten aanzien van Griekenland toe te passen
    communautaire aanbiedingsprijs voor zoete sinaasappelen en van de voor de berekening
    van de aanbiedingsprijs van het Griekse produkt toe te passen coëfficiënten
  type: main
