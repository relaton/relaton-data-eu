title:
- language: en
  script: Latn
  content: Council Directive 95/39/EC of 17 July 1995 amending the Annexes to Directives
    86/362/EEC and 86/363/EEC on the fixing of maximum levels for pesticide residues
    in and on cereals and foodstuffs of animal origin
  type: main
- language: fr
  script: Latn
  content: Directive 95/39/CE du Conseil, du 17 juillet 1995, modifiant les annexes
    des directives 86/362/CEE et 86/363/CEE concernant la fixation de teneurs maximales
    pour les résidus de pesticides sur et dans les céréales et les denrées alimentaires
    d'origine animale
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/39/EG des Rates vom 17. Juli 1995 zur Änderung der Anhänge
    der Richtlinien 86/362/EWG und 86/363/EWG über die Festsetzung von Höchstgehalten
    an Rückständen von Schädlingsbekämpfungsmitteln auf und in Getreide sowie
    Lebensmitteln tierischen Ursprungs
  type: main
- language: bg
  script: Cyrl
  content: Директива 95/39/ЕО на Съвета от 17 юли 1995 година
    за изменение на приложенията към Директиви
    86/362/ЕИО и 86/363/ЕИО относно определянето на максимални
    количества на остатъци от пестициди във и върху
    зърнените култури и храните от животински
    произход
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 95/39/ES ze dne 17. července 1995, kterou se mění přílohy
    směrnic 86/362/EHS a 86/363/EHS o stanovení maximálních limitů reziduí pesticidů
    v obilovinách a v potravinách živočišného původu a na jejich povrchu
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 95/39/EF af 17. juli 1995 om ændring af bilagene til
    direktiv 86/362/EØF og 86/363/EØF om fastsættelse af maksimalgrænseværdier
    for indholdet af pesticidrester i og på henholdsvis korn og levnedsmidler af
    animalsk oprindelse
  type: main
- language: el
  script: Grek
  content: Οδηγία 95/39/ΕΚ του Συμβουλίου της 17ης Ιουλίου
    1995 για την τροποποίηση των παραρτημάτων των
    οδηγιών 86/362/ΕΟΚ και 86/363/ΕΟΚ του Συμβουλίου
    που αφορούν τον καθορισμό ανώτατων περιεκτικοτήτων
    για τα κατάλοιπα φυτοφαρμάκων επάνω και μέσα
    στα σιτηρά και στα τρόφιμα ζωικής προέλευσης
    αντιστοίχως
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 95/39/EÜ, 17. juuli 1995, millega muudetakse lisasid
    direktiivides 86/362/EMÜ ja 86/363/EMÜ teraviljas ja loomses toidus sisalduvate
    ja nende pinnal esinevate pestitsiidide jääkide piirnormide kehtestamise kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 95/39/EY, annettu 17 päivänä heinäkuuta 1995,
    torjunta-aineiden jäämien enimmäismäärien vahvistamista viljatuotteille ja
    eläinkunnasta saataville elintarvikkeille koskevien neuvoston direktiivien 86/362/ETY
    ja 86/363/ETY liitteiden muuttamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 95/39/EK irányelve (1995. július 17.) a gabonafélékben, illetőleg
    az állati eredetű élelmiszerekben, illetve azok felületén található peszticid-szermaradványok
    megengedett legmagasabb mértékének meghatározásáról szóló 86/362/EGK,
    illetőleg 86/363/EGK irányelv mellékleteinek módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 95/39/CE del Consiglio, del 17 luglio 1995, che modifica gli
    allegati delle direttive 86/362/CEE e 86/363/CEE che fissano le quantità massime
    di residui di antiparassiti sui e nei cereali e prodotti alimentari di origine
    animale
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 95/39/EK (1995. gada 17. jūlijs), ar ko groza pielikumus
    Direktīvām 86/362/EEK un 86/363/EEK attiecībā uz pesticīdu atliekvielu maksimāli
    pieļaujamo daudzumu noteikšanu attiecīgi labībā un uz tās un dzīvnieku
    izcelsmes pārtikas produktos un uz tiem
  type: main
- language: lt
  script: Latn
  content: 1995 m. liepos 17 d. Tarybos direktyva 95/39/EB, iš dalies keičianti
    Tarybos direktyvų 86/362/EEB ir 86/363/EEB dėl didžiausių pesticidų likučių
    koncentracijų atitinkamai grūduose ir gyvūninės kilmės maisto produktuose
    bei ant jų nustatymo priedus
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 95/39/KE tas-17 ta’ Lulju 1995 li temenda l-Annessi
    tad-Direttivi 86/362/KEE u 86/363/KEE dwar l-iffissar tal-livelli massimi għar-residwi
    tal-pestiċidi fi u fuq iċ-ċereali u l-oġġetti ta' l-ikel li għandhom l-oriġini
    mill-annimali
  type: main
- language: nl
  script: Latn
  content: Richtlijn 95/39/EG van de Raad van 17 juli 1995 houdende wijziging van
    de bijlagen bij de Richtlijnen 86/362/EEG en 86/363/EEG tot vaststelling van maximumgehalten
    aan residuen van bestrijdingsmiddelen in en op granen, respectievelijk in en op
    levensmiddelen van dierlijke oorsprong
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 95/39/WE z dnia 17 lipca 1995 r. zmieniająca załączniki
    do dyrektyw 86/362/EWG i 86/363/EWG w sprawie ustalania najwyższych dopuszczalnych
    poziomów pozostałości pestycydów w zbożach i na ich powierzchni oraz w środkach
    spożywczych i na ich powierzchni
  type: main
- language: pt
  script: Latn
  content: Directiva 95/39/CE do Conselho, de 17 de Julho de 1995, que altera os anexos
    das Directivas 86/362/CEE e 86/363/CEE, relativas à fixação de teores máximos
    para os resíduos de pesticidas à superfície e no interior dos cereais e dos
    géneros alimentícios de origem animal
  type: main
- language: ro
  script: Latn
  content: Directiva 95/39/CE a Consiliului din 17 iulie 1995 de modificare a anexelor
    la directivele 86/362/CEE și 86/363/CEE de stabilire a conținuturilor maxime
    de reziduuri de pesticide de pe și din cereale și produsele alimentare de origine
    animală
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 95/39/ES zo 17. júla 1995, ktorou sa menia a dopĺňajú
    prílohy k smerniciam 86/362/EHS a 86/363/EHS o stanovovaní maximálnych hladín
    rezíduí pesticídov v a na obilninách a potravinách živočíšneho pôvodu
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 95/39/ES z dne 17. julija 1995 o spremembi prilog k direktivama
    86/362/EGS in 86/363/EGS o določitvi najvišjih mejnih vrednosti ostankov pesticidov
    v in na žitu in živilih živalskega izvora
  type: main
- language: es
  script: Latn
  content: Directiva 95/39/CE del Consejo, de 17 de julio de 1995, que modifica los
    Anexos de las Directivas 86/362/CEE y 86/363/CEE relativas a la fijación de los
    contenidos máximos para los residuos de plaguicidas sobre y en los cereales y
    los productos alimenticios de origen animal
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 95/39/EG av den 17 juli 1995 om ändring av bilagorna
    till direktiven 86/362/EEG och 86/363/EEG om fastställande av gränsvärden för
    bekämpningsmedelsrester i och på spannmål samt i och på livsmedel av animaliskt
    ursprung
  type: main
