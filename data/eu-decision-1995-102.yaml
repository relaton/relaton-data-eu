    de Gemeenschap voor de verbetering van de verwerking en de afzet van land- en
    bosbouwprodukten in Frankrijk (met uitzondering van Corsica, de Franse overzeese
    departementen en Henegouwen) in het kader van doelstelling 5a), voor de periode
    van 1994 tot en met 1999 (Slechts de tekst in de Franse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '95/102/CE: Decisão da Comissão, de 29 de Março de 1995, que aprova
