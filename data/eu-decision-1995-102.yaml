title:
- language: en
  script: Latn
  content: '95/102/EC: Commission Decision of 29 March 1995 approving the single programming
    document for Community structural measures for improving the processing and marketing
    conditions for agricultural and forestry products in France (with the exception
    of Corsica, the overseas departments and Hainaut province) in respect of Objective
    5 (a), covering the period between 1994 and 1999 (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '95/102/CE: Décision de la Commission, du 29 mars 1995, portant approbation
    du document unique de programmation pour les interventions structurelles communautaires
    relatives à l''amélioration des conditions de transformation et de commercialisation
    des produits agricoles et sylvicoles en France (à l''exception de la Corse, des
    départements d''outre-mer et du Hainaut), au titre de l''objectif 5a), couvrant
    la période entre 1994 et 1999 (Le texte en langue française est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '95/102/EG: Entscheidung der Kommission vom 29. März 1995 zur Genehmigung
    des den Zeitraum 1994 bis 1999 betreffenden einzigen Programmplanungsdokuments
    zu den strukturellen Interventionen der Gemeinschaft zur Verbesserung der Verarbeitungs-
    und Vermarktungsbedingungen land- und forstwirtschaftlicher Erzeugnisse im Rahmen
    der Zielvorgabe 5a in Frankreich (mit Ausnahme Korsikas, der überseeischen Departements
    und der Provinz Hainaut) (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '95/102/EF: Kommissionens beslutning af 29. marts 1995 om godkendelse af
    enhedsprogrammeringsdokumentet for EF''s strukturinterventioner vedrørende forarbejdning
    og afsætning af landbrugs- og skovbrugsprodukter i Frankrig (med undtagelse af
    Korsika, de oversøiske departementer og provinsen Hainaut) for mål nr. 5a for
    perioden 1994 til 1999 (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '95/102/ΕΚ: Απόφαση της Επιτροπής της 29ης Μαρτίου
    1995 σχετικά με την έγκριση του ενιαίου εγγράφου
    προγραμματισμού για τις κοινοτικές διαρθρωτικές
    παρεμβάσεις που αφορούν τη βελτίωση των συνθηκών
    μεταποίησης και εμπορίας των γεωργικών και
    δασοκομικών προϊόντων στη Γαλλία (με εξαίρεση
    την Κορσική, τα υπερπόντια διαμερίσματα και
    την περιοχή του Hainaut) στο πλαίσιο του στόχου
    5α, που καλύπτει την περίοδο από το 1994 μέχρι
    το 1999 (Το κείμενο στη γαλλική γλώσσα είναι το
    μόνο αυθεντικό)'
  type: main
- language: fi
  script: Latn
  content: '95/102/EY: Komission päätös, tehty 29 päivänä maaliskuuta 1995,
    Ranskan (lukuun ottamatta Korsikaa, merentakaisia departementteja ja Hainaut''n
    maakuntaa) maa- ja metsätaloustuotteiden jalostamisen ja kaupan pitämisen edellytysten
    parantamiseen liittyviä yhteisön rakenteellisia interventioita koskevan yhden
    ohjelma-asiakirjan hyväksymisestä tavoitteen 5 a mukaisesti vuosien 1994 ja
    1999 väliseksi ajaksi (Ainoastaan ranskankielinen teksti on todistusvoimainen)'
  type: main
- language: it
  script: Latn
  content: '95/102/CE: Decisione della Commissione, del 29 marzo 1995, recante approvazione
    del documento unico di programmazione per gli interventi strutturali comunitari
    relativi al miglioramento delle condizioni di trasformazione e di commercializzazione
    dei prodotti agricoli e silvicoli in Francia (ad eccezione della Corsica, dei
    dipartimenti d''oltremare e della provincia dello Hainaut), nel quadro dell''obiettivo
    n. 5 a), per il periodo dal 1994 al 1999 (Il testo in lingua francese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '95/102/EG: Beschikking van de Commissie van 29 maart 1995 houdende goedkeuring
