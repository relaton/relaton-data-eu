  script: Latn
  content: '2008/233/EC: Commission Decision of 17 March 2008 amending Decision 2004/558/EC
    implementing Council Directive 64/432/EEC as regards additional guarantees for
    intra-Community trade in bovine animals relating to infectious bovine rhinotracheitis
    and the approval of the eradication programme presented by certain Member States
    (notified under document number C(2008) 1004)'
  type: main
- language: fr
  script: Latn
  content: '2008/233/CE: Décision de la Commission du 17 mars 2008 modifiant la décision
    2004/558/CE mettant en œuvre la directive 64/432/CEE du Conseil en ce qui concerne
    des garanties additionnelles pour les échanges intracommunautaires de bovins
    en rapport avec la rhinotrachéite infectieuse bovine et l’approbation des programmes
    d’éradication présentés par certains États membres [notifiée sous le numéro
    C(2008) 1004]'
  type: main
