    представен от Словакия съгласно член 31, параграф
    2 от Директива (ЕС) 2018/2001 на Европейския парламент
    и на Съвета, съдържа точни данни за целите на
    измерването на емисиите на парникови газове,
    свързани с отглеждането на пшеница и сорго
    в тази държава членка
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2026/53 ze dne 6. ledna 2026, kterým
    se uznává, že zpráva předložená Slovenskem podle čl. 31 odst. 2 směrnice
    Evropského parlamentu a Rady (EU) 2018/2001 obsahuje přesné údaje pro účely
    měření emisí skleníkových plynů spojených s pěstováním pšenice tvrdé
    a čiroku v uvedeném členském státě
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2026/53 af 6. januar 2026
