    ciroktermesztésből származó üvegházhatásúgáz-kibocsátás mértékének
    meghatározására
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2026/53 della Commissione, del 6 gennaio 2026,
