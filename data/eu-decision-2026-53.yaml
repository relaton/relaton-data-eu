    data med henblik på måling af drivhusgasemissioner, som er knyttet til dyrkning
    af hvede og sorghum i Slovakiet
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2026/53 της Επιτροπής,
