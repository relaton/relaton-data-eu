title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2026/53 of 6 January 2026 recognising
    that the report submitted by Slovakia under Article 31(2) of Directive (EU) 2018/2001
    of the European Parliament and of the Council contains accurate data for the purposes
    of measuring the greenhouse gas emissions associated with the cultivation of wheat
    and sorghum in that Member State
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2026/53 de la Commission du 6 janvier 2026
    reconnaissant que le rapport soumis par la Slovaquie au titre de l’article 31,
    paragraphe 2, de la directive (UE) 2018/2001 du Parlement européen et du Conseil
    contient des données précises aux fins de la mesure des émissions de gaz à
    effet de serre associées à la culture du blé et du sorgho dans ledit État
    membre
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2026/53 der Kommission vom 6. Januar 2026
    zur Anerkennung, dass der von der Slowakei gemäß Artikel 31 Absatz 2 der Richtlinie
    (EU) 2018/2001 des Europäischen Parlaments und des Rates vorgelegte Bericht genaue
    Daten für die Messung der auf den Anbau von Weizen und Sorghum in diesem Mitgliedstaat
    zurückgehenden Treibhausgasemissionen enthält
  type: main
- language: bg
  script: Cyrl
