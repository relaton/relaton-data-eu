    31 alineatul (2) din Directiva (UE) 2018/2001 a Parlamentului European și a Consiliului
    conține date exacte în scopul măsurării emisiilor de gaze cu efect de seră
    asociate cultivării grâului și a sorgului în statul membru respectiv
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2026/53 zo 6. januára 2026, ktorým
