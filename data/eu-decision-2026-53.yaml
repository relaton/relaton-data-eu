    ust. 2 dyrektywy Parlamentu Europejskiego i Rady (UE) 2018/2001 zawiera dokładne
    dane służące do pomiaru emisji gazów cieplarnianych związanych z uprawą
    pszenicy zwyczajnej i sorgo w tym państwie członkowskim
  type: main
- language: pt
  script: Latn
