    (EU) 2018/2001 van het Europees Parlement en de Raad ingediende verslag nauwkeurige
    gegevens bevat ten behoeve van de meting van de broeikasgasemissies gerelateerd
    aan de teelt van tarwe en kafferkoren in die lidstaat
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2026/53 z dnia 6 stycznia 2026 r. w sprawie
