title:
- language: en
  script: Latn
  content: Council Decision (EU) 2019/222 of 20 December 2018 on the position to be
    taken, on behalf of the European Union, within the Joint Committee established
    by the Euro-Mediterranean Interim Association Agreement on trade and cooperation
    between the European Community, of the one part, and the Palestine Liberation
    Organization (PLO) for the benefit of the Palestinian Authority (PA) of the West
    Bank and the Gaza Strip, of the other part, concerning the extension of the EU-PA
    Action Plan
  type: main
