  script: Latn
  content: Nařízení Komise (EU) č. 969/2011 ze dne 29. září 2011 , kterým
    se zahajuje přezkum prováděcího nařízení Rady (EU) č. 400/2010 (rozšiřující
    konečné antidumpingové clo uložené nařízením (ES) č. 1858/2005 na dovoz
    ocelových lan a kabelů pocházejících mimo jiné z Čínské lidové republiky
    na dovoz ocelových lan a kabelů zasílaných z Korejské republiky bez ohledu
    na to, zda je u něho deklarován původ z Korejské republiky), jehož cílem
    je určit, zda od těchto opatření lze osvobodit jednoho korejského vývozce,
    zrušit antidumpingové clo, pokud jde o dovoz od tohoto vývozce, a zavést celní
    evidenci dovozu od tohoto vývozce
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 969/2011 af 29. september 2011 om indledning
    af en fornyet undersøgelse af Rådets gennemførelsesforordning (EU) nr. 400/2010
    (om udvidelse af den endelige antidumpingtold, der indførtes ved forordning (EF)
    nr. 1858/2005 på importen af tovværk og kabler af stål med oprindelse i bl.a.
    Folkerepublikken Kina, til også at omfatte importen af tovværk og kabler af
    stål afsendt fra Republikken Korea, uanset om varen er angivet med oprindelse
    i Republikken Korea) med henblik på at fastslå, om der kan bevilges en fritagelse
    for disse foranstaltninger til en koreansk eksportør ved at ophæve antidumpingtolden
    for importen fra denne eksportør, og om indførelse af registrering af importen
    fra denne eksportør
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΕ) αριθ. 969/2011 της Επιτροπής,
    της 29ης Σεπτεμβρίου 2011 , για την έναρξη επανεξέτασης
    του εκτελεστικού κανονισμού (ΕΕ) αριθ. 400/2010
    του Συμβουλίου [με τον οποίο επεκτάθηκε ο οριστικός
    δασμός αντιντάμπινγκ που επιβλήθηκε με τον
    κανονισμό (ΕΚ) αριθ. 1858/2005 στις εισαγωγές συρματόσχοινων
    και καλωδίων από χάλυβα καταγωγής, μεταξύ άλλων,
    Λαϊκής Δημοκρατίας της Κίνας σε εισαγωγές
    συρματόσχοινων και καλωδίων που αποστέλλονται
    από τη Δημοκρατία της Κορέας, είτε δηλώνονται
    ως καταγωγής Δημοκρατίας της Κορέας είτε όχι]
    προκειμένου να εξεταστεί η δυνατότητα χορήγησης
    απαλλαγής από τα μέτρα αυτά σε έναν εξαγωγέα
    από την Κορέα, κατάργησης του δασμού αντιντάμπινγκ
    όσον αφορά τις εισαγωγές από τον εν λόγω εξαγωγέα
    και υπαγωγής των εισαγωγών αυτών σε καταγραφή
  type: main
- language: et
  script: Latn
  content: Komisjoni määrus (EL) nr 969/2011, 29. september 2011 , millega algatatakse
    nõukogu rakendusmääruse (EL) nr 400/2010 (millega laiendatakse määrusega
    (EÜ) nr 1858/2005 teatavate, muu hulgas Hiina Rahvavabariigist pärit terastrosside
    ja -kaablite impordi suhtes kehtestatud lõplikku dumpinguvastast tollimaksu teatavate
    Korea Vabariigist lähetatud terastrosside ja -kaablite impordile, olenemata sellest,
    kas seda deklareeritakse Korea Vabariigist pärineva impordina või mitte) läbivaatamine,
    et selgitada välja võimalus teha kõnealuste meetmete kohaldamise suhtes erand
    ühele Korea eksportijale, tühistatakse dumpinguvastane tollimaks kõnealuse
    eksportija impordi suhtes ning kehtestatakse sellelt eksportijalt pärineva impordi
    registreerimise nõue
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EU) N:o 969/2011, annettu 29 päivänä syyskuuta 2011
    , neuvoston täytäntöönpanoasetusta (EU) N:o 400/2010 (muun muassa Kiinan kansantasavallasta
    peräisin olevien teräsköysien ja -kaapeleiden tuonnissa asetuksella (EY) N:o
    1858/2005 käyttöön otetun lopullisen polkumyyntitullin laajentamisesta koskemaan
    teräsköysien ja -kaapeleiden tuontia Korean tasavallasta riippumatta siitä,
    onko niiden alkuperämaaksi ilmoitettu Korean tasavalta) koskevan tarkastelun
    vireillepanosta sen määrittämiseksi, voidaanko näistä toimenpiteistä myöntää
    poikkeus yhdelle korealaiselle viejälle, kumota polkumyyntitulli kyseisen viejän
    tuonnissa ja tehdä kyseisen viejän tuonnin kirjaaminen pakolliseksi
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 969/2011 od 29. rujna 2011. o pokretanju revizije
    Provedbene uredbe Vijeća (EU) br. 400/2010 (o proširenju antidampinške pristojbe
    uvedene Uredbom (EZ) br. 1858/2005 o uvozu čelične užadi i kabela podrijetlom,
    između ostalog, iz Narodne Republike Kine na uvoz čelične užadi i kabela poslanih
    iz Republike Koreje, bez obzira na to imaju li deklarirano podrijetlo iz Republike
    Koreje ili ne) za potrebe utvrđivanja mogućnosti dodjele izuzeća od tih mjera
    jednom korejskom izvozniku, stavljanju antidampinške pristojbe u pogledu uvoza
    od tog izvoznika izvan snage i uvjetovanju uvoza tog izvoznika evidentiranjem
  type: main
- language: hu
  script: Latn
  content: A Bizottság 969/2011/EU rendelete ( 2011. szeptember 29. ) a dömpingellenes
    intézkedések alól egy koreai exportőr számára biztosítható mentesség
    megállapításának, a dömpingellenes vámoknak az érintett exportőrtől származó
    behozatalok tekintetében való hatályon kívül helyezésének és az érintett
    exportőrtől származó behozatalok nyilvántartásba vételre való kötelezésének
    céljából a (az 1858/2005/EK rendelettel a többek között a Kínai Népköztársaságból
    származó acél drótkötelek és -kábelek behozatalára kivetett végleges
    dömpingellenes vámnak a Koreai Köztársaságban feladott – akár a Koreai
    Köztársaságból származóként, akár nem ilyenként bejelentett – acél
    drótkötelek és -kábelek behozatalára történő kiterjesztéséről szóló)
    400/2010/EU tanácsi végrehajtási rendelet felülvizsgálatának megindításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 969/2011 della Commissione, del 29 settembre 2011 ,
    che avvia un riesame del regolamento di esecuzione (UE) n. 400/2010 del Consiglio
    (che estende il dazio antidumping definitivo istituito dal regolamento (CE) n.
    1858/2005 sulle importazioni di cavi d'acciaio originari, tra l'altro, della Repubblica
    popolare cinese alle importazioni di cavi d'acciaio spediti dalla Repubblica di
    Corea, anche se non dichiarati originari della Repubblica di Corea) allo scopo
    di determinare la possibilità di concedere l'esenzione da tali misure ad un esportatore
    coreano, che abroga il dazio antidumping sulle importazioni in provenienza da
    detto esportatore e che dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 969/2011 ( 2011. gada 29. septembris ), ar kuru
    sāk pārskatīt Padomes Īstenošanas regulu (ES) Nr. 400/2010 (ar ko paplašina
    galīgo antidempinga maksājumu, kurš ar Regulu (EK) Nr. 1858/2005 noteikts par
    cita starpā Ķīnas Tautas Republikas izcelsmes tērauda trošu un tauvu importu,
    attiecinot to uz tērauda trošu un tauvu importu, kas nosūtīts no Korejas Republikas,
    neatkarīgi no tā, vai tas ir deklarēts ar izcelsmi Korejas Republikā), lai
    noteiktu iespēju vienu Korejas eksportētāju atbrīvot no šo pasākumu piemērošanas,
    atceļot antidempinga maksājumu attiecībā uz importu, ko veic minētais eksportētājs,
    un paredzot minētā eksportētāja importa reģistrāciju
  type: main
- language: lt
  script: Latn
  content: 2011 m. rugsėjo 29 d. Komisijos reglamentas (ES) Nr. 969/2011, kuriuo
    inicijuojama Tarybos įgyvendinimo reglamento (ES) Nr. 400/2010 (kuriuo galutinio
    antidempingo muito, Tarybos reglamentu (EB) Nr. 1858/2005 nustatyto importuojamiems,
    inter alia, Kinijos Liaudies Respublikos kilmės plieniniams lynams ir kabeliams,
    taikymas išplečiamas importuojamiems plieniniams lynams ir kabeliams, siunčiamiems
    iš Korėjos Respublikos, deklaruojamiems kaip Korėjos Respublikos kilmės arba
    ne) peržiūra, siekiant nustatyti, ar vienam Korėjos eksportuotojui galima netaikyti
    šių priemonių, ir kuriuo panaikinamas antidempingo muitas iš šio eksportuotojo
    importuojamam produktui ir nustatoma privaloma iš šio eksportuotojo importuojamo
    produkto registracija
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 969/2011 tad- 29 ta’ Settembru 2011
    li jagħti bidu għal reviżjoni ta' Regolament ta' Implimentazzjoni tal-Kunsill
    (UE) Nru 400/2010 (li jestendi d-dazju definittiv anti-dumping impost bir-Regolament
    (KE) Nru 1858/2005 fuq l-importazzjonijiet ta' ħbula u kejbils tal-azzar li joriġinaw,
    fost l-oħrajn, fir-Repubblika tal-Poplu [Popolari] taċ-Ċina, għall-importazzjonijiet
    ta' ħbula u kejbils tal-azzar ikkunsinjati mir-Repubblika tal-Korea, kemm jekk
    iddikjarati bħala li joriġinaw fir-Repubblika tal-Korea kemm jekk le) għall-finijiet
    li tiġi ddeterminata l-possibbiltà li tingħata eżenzjoni minn dawk il-miżuri
    lil esportatur Korean wieħed, li jirrevoka d-dazju anti-dumping dwar l-importazzjonijiet
    minn dak l-esportatur u li l-importazzjonijiet minn dak l-esportatur jagħmilhom
    soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 969/2011 van de Commissie van 29 september 2011 tot
    opening van een nieuw onderzoek ten aanzien van Uitvoeringsverordening (EU) nr.
    400/2010 van de Raad (tot uitbreiding van het bij Verordening (EG) nr. 1858/2005
    ingestelde definitieve antidumpingrecht op stalen kabels van oorsprong uit onder
    meer de Volksrepubliek China tot stalen kabels verzonden vanuit de Republiek Korea,
    al dan niet aangegeven als van oorsprong uit de Republiek Korea) met het oog op
    de vaststelling of een Koreaanse exporteur van die maatregelen kan worden vrijgesteld,
    of het antidumpingrecht ten aanzien van de invoer afkomstig van die exporteur
    kan worden ingetrokken en of die invoer moet worden geregistreerd
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 969/2011 z dnia 29 września 2011 r. w
    sprawie wszczęcia przeglądu rozporządzenia wykonawczego Rady (UE) nr 400/2010
    (rozszerzającego ostateczne cło antydumpingowe nałożone rozporządzeniem (WE)
    nr 1858/2005 na przywóz stalowych lin i kabli pochodzących między innymi z
    Chińskiej Republiki Ludowej na przywóz stalowych lin i kabli wysyłanych z Republiki
    Korei zgłoszonych lub niezgłoszonych jako pochodzące z Republiki Korei) w celu
    ustalenia możliwości przyznania wyłączenia od tych środków jednemu koreańskiemu
    eksporterowi, w sprawie uchylenia cła antydumpingowego w odniesieniu do towarów
    przywożonych przez tego eksportera oraz w sprawie objęcia rejestracją towarów
    przywożonych przez tego eksportera
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 969/2011 da Comissão, de 29 de Setembro de 2011
    , que dá início ao reexame do Regulamento de Execução (UE) n. ° 400/2010
    do Conselho (que torna extensivas as medidas anti-dumping definitivas instituídas
    pelo Regulamento (CE) n. ° 1858/2005 sobre as importações de cabos de aço
    originários, nomeadamente, da República Popular da China às importações de
    cabos de aço expedidos da República da Coreia, independentemente de serem declarados
    ou não originários da Coreia) para efeitos de determinar a possibilidade de
    conceder uma isenção dessas medidas a um exportador coreano, que revoga o direito
    anti-dumping no que diz respeito às importações provenientes desse exportador
    e que sujeita as importações desse exportador a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 969/2011 al Comisiei din 29 septembrie 2011 de deschidere
    a unei reexaminări a Regulamentului de punere în aplicare (UE) nr. 400/2010
    al Consiliului [de extindere a taxei antidumping definitive instituite prin Regulamentul
    (CE) nr. 1858/2005 privind importurile de cabluri și parâme din oțel originare,
    printre altele, din Republica Populară Chineză la importurile de cabluri și
    parâme din oțel expediate din Republica Coreea, indiferent dacă produsul este
    sau nu declarat ca provenind din Republica Coreea] pentru a stabili posibilitatea
    de a acorda o scutire de la aceste măsuri unui exportator coreean, de abrogarea
    taxei antidumping cu privire la importurile provenite de la acest exportator și
    de supunere a acestor importuri înregistrării
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 969/2011 z 29. septembra 2011 , o začatí
    preskúmania vykonávacieho nariadenia Rady (EÚ) č. 400/2010 (ktorým sa rozširuje
    konečné antidampingové clo uložené nariadením (ES) č. 1858/2005 o dovoze
    oceľových lán a káblov s pôvodom okrem iného v Čínskej ľudovej republike
    na dovoz oceľových lán a káblov zasielaných z Kórejskej republiky bez ohľadu
    na to, či majú, alebo nemajú deklarovaný pôvod v Kórejskej republike) na
    účely zistenia možnosti udelenia výnimky z týchto opatrení jednému kórejskému
    vývozcovi, zrušenia antidampingového cla na dovoz od tohto vývozcu a podmienenia
    dovozu od tohto vývozcu registrácii
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 969/2011 z dne 29. septembra 2011 o začetku
    pregleda Izvedbene uredbe Sveta (EU) št. 400/2010 (o razširitvi dokončne protidampinške
    dajatve, uvedene z Uredbo (ES) št. 1858/2005 na uvoz jeklenih vrvi in kablov
    s poreklom, med drugim, iz Ljudske republike Kitajske, na uvoz jeklenih vrvi in
    kablov, poslanih iz Republike Koreje, ne glede na to, ali je njihovo poreklo deklarirano
    v Republiki Koreji ali ne), da se ugotovi, ali se za določenega korejskega izvoznika
    lahko odobri izvzetje iz navedenih ukrepov, odpravijo protidampinške dajatve
    pri njegovem uvozu in uvede registracija njegovega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 969/2011 de la Comisión, de 29 de septiembre de 2011
    , por el que se inicia una reconsideración del Reglamento de Ejecución (UE)
    n ° 400/2010 del Consejo (por el que se amplía el derecho antidumping definitivo
    establecido por el Reglamento (CE) n ° 1858/2005 sobre las importaciones de cables
    de acero originarios, entre otros países, de la República Popular China a las
    importaciones de cables de acero procedentes de la República de Corea, hayan
    sido o no declaradas originarias de la República de Corea) a fin de determinar
    la posibilidad de eximir de tales medidas a un exportador coreano, de derogar
    el derecho antidumping con respecto a las importaciones procedentes de ese exportador
    y de someter estas importaciones a la obligación de registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 969/2011 av den 29 september 2011 om
    inledande av en översyn av rådets genomförandeförordning (EU) nr 400/2010
    (om utvidgning av den slutgiltiga antidumpningstull som genom förordning (EG)
    nr 1858/2005 införts på import av linor och kablar av stål med ursprung i bland
    annat Folkrepubliken Kina till att även omfatta import av linor och kablar av
    stål som avsänts från Republiken Korea, oavsett om produkternas deklarerade
    ursprung är Republiken Korea eller inte) i syfte att fastställa om det är möjligt
    att bevilja en koreansk exportör befrielse från dessa åtgärder, om upphävande
    av antidumpningstullen avseende import från den exportören och om registrering
    av import från den exportören
  type: main
