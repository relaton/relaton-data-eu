title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 969/2011 of 29 September 2011 initiating
    a review of Implementing Regulation of the Council (EU) No 400/2010 (extending
    the definitive anti-dumping duty imposed by Regulation (EC) No 1858/2005 on imports
    of steel ropes and cables originating, inter alia, in the People's Republic of
    China to imports of steel ropes and cables consigned from the Republic of Korea,
    whether declared as originating in the Republic of Korea or not) for the purposes
    of determining the possibility of granting an exemption from those measures to
    one Korean exporter, repealing the anti-dumping duty with regard to imports from
    that exporter and making imports from that exporter subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 969/2011 de la Commission du 29 septembre 2011 portant
    ouverture d’un réexamen du règlement d’exécution (UE) n ° 400/2010 du
    Conseil (portant extension du droit antidumping définitif institué par le règlement
    (CE) n ° 1858/2005 sur les importations de câbles en acier originaires, entre
    autres, de la République populaire de Chine aux importations de câbles en acier
    expédiés de la République de Corée, qu’ils aient ou non été déclarés
    originaires de ce pays) afin d’étudier la possibilité d’accorder une exemption
    de ces mesures à un exportateur coréen, abrogeant le droit antidumping pour
    les importations effectuées par cet exportateur et soumettant ces importations
    à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 969/2011 der Kommission vom 29. September 2011 zur
    Einleitung einer Überprüfung der Durchführungsverordnung (EU) Nr. 400/2010
    des Rates (Ausweitung des mit der Verordnung (EG) Nr. 1858/2005 eingeführten
    endgültigen Antidumpingzolls auf die Einfuhren von Kabeln und Seilen aus Stahl
    mit Ursprung unter anderem in der Volksrepublik China auf die Einfuhren von aus
    der Republik Korea versandten Kabeln und Seilen aus Stahl, ob als Ursprungserzeugnisse
    aus der Republik Korea angemeldet oder nicht) zwecks Prüfung der Möglichkeit
    der Befreiung eines koreanischen Ausführers von diesen Maßnahmen, Außerkraftsetzung
    des Antidumpingzolls gegenüber den von diesem Ausführer bezogenen Einfuhren
    und zollamtlicher Erfassung der letztgenannten Einfuhren
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕС) № 969/2011 на Комисията от 29
    септември 2011 година за започване на процедура
    по преразглеждане на Регламент за изпълнение
    (ЕС) № 400/2010 на Съвета (за разширяване на обхвата
    на окончателното антидъмпингово мито, наложено
    с Регламент (ЕО) № 1858/2005 върху вноса на стоманени
    въжета и кабели с произход, inter alia , от Китайската
    народна република, към вноса на стоманени въжета
