type: standard
title:
- language: en
  script: Latn
  content: '79/927/EEC: Commission Decision of 19 October 1979 authorizing the French
    Republic not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, impregnated or coated with artificial
    plastic materials, falling within heading No 60.02 of the Common Customs Tariff
    (NIMEXE code 60.02-40) (category 10), originating in Taiwan and in free circulation
    in the other Member States (Only the French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/927/CEE: Décision de la Commission, du 19 octobre 1979, autorisant
    la République française à exclure du traitement communautaire la ganterie de
    bonneterie non élastique ni caoutchoutée, imprégnée ou enduite de matières
    plastiques de la position 60.02 du tarif douanier commun (code Nimexe: 60.02-40)
    (catégorie 10), originaire de T''ai-wan et mise en libre pratique dans les autres
    Etats membres (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/927/EWG: Entscheidung der Kommission vom 19. Oktober 1979, mit der
    die Französische Republik ermächtigt wird, aus Taiwan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch
    noch kautschutiert, mit Kunststoff getränkt oder bestrichen, der Tarifnummer
    60.02 des Gemeinsamen Zolltarifs (NIMEXE-Kennziffer 60.02-40) (Kategorie 10) von
    der Gemeinschaftsbehandlung auszuschließen (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/927/EØF: Kommissionens beslutning af 19. oktober 1979 om bemyndigelse
    af Den franske Republik til fra fællesskabsbehandling at undtage handsker, vanter
    og luffer, imprægneret eller overtrukket med plast, som henhører under pos.
    60.02 i den fælles toldtarif (NIMEXE-nummer 60.02-40 ; kategori 10), har oprindelse
    i Taiwan og frit kan omsættes i de øvrige medlemsstater (Kun den franske udgave
    er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/927/CEE: Decisione della Commissione, del 19 ottobre 1979, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario i guanti a maglia
    non elastica né gommata, impregnata o spalmata di materie plastiche, della voce
    60.02 della tariffa doganale comune (codice Nimexe: 60.02-40), categoria 10, originari
    di Taiwan e messi in libera pratica negli altri Stati membri (Il testo in lingua
    francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/927/EEG: Beschikking van de Commissie van 19 oktober 1979 waarbij de
    Franse Republiek wordt gemachtigd handschoenen, wanten en dergelijke artikelen,
    van niet- elastisch of van niet-gegummeerd brei- of haakwerk, geïmpregneerd of
    met een deklaag van plastische stoffen, van post 60.02 van het gemeenschappelijk
    douanetarief (NIMEXE-code 60.02-40) (categorie 10), van oorsprong uit Taiwan en
    in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling
    uit te sluiten (Slechts de tekst in de Franse taal is authentiek)'
  type: main
