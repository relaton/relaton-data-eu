title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2025/1321 of 4 July 2025 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified soybean MON 87705 × MON 87708 × MON 89788 pursuant to Regulation
    (EC) No 1829/2003 of the European Parliament and of the Council (notified under
    document C(2025) 4349)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2025/1321 de la Commission du 4 juillet 2025
    autorisant la mise sur le marché de produits contenant du soja génétiquement
    modifié MON 87705 × MON 87708 × MON 89788, consistant en ce soja ou produits
    à partir de celui-ci, en application du règlement (CE) no 1829/2003 du Parlement
