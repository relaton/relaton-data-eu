  content: Règlement (CEE) n° 2585/70 du Conseil, du 17 décembre 1970, portant
    ouverture, répartition et mode de gestion d'un contingent tarifaire communautaire
    pour certaines qualités de fils de bourre de soie (schappe), non conditionnés
    pour la vente au détail, de la position 50.05 du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2585/70 des Rates vom 17. Dezember 1970 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für bestimmte
    Qualitäten von Schappeseidengarnen, nicht in Aufmachungen für den Einzelverkauf,
    der Tarifnummer 50.05 des Gemeinsamen Zolltarifs
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2585/70 del Consiglio, del 17 dicembre 1970, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario per alcune qualità di filati di borra di seta (schappe),
    non preparati per la vendita al minuto, della voce 50.05 della tariffa doganale
    comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2585/70 van de Raad van 17 december 1970 betreffende
    de opening, de verdeling en de wijze van beheer van een communautair tariefcontingent
    voor bepaalde kwaliteiten van garens van vlokzijde, niet gereed voor de verkoop
    in het klein, van post 50.05 van het gemeenschappelijk douanetarief
  type: main
