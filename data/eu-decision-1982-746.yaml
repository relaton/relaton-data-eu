title:
- language: en
  script: Latn
  content: '82/746/EEC: Commission Decision of 19 October 1982 authorizing the French
    Republic to apply intra-Community surveillance to imports of natural honey and
    glazed setts, flags and paving, hearth and wall tiles originating in certain third
    countries, which have been put into free circulation in the Community (Only the
    French text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/746/CEE: Décision de la Commission, du 19 octobre 1982, autorisant
    la République française à procéder à une surveillance intra-communautaire
    des importations de miel naturel, de certains carreaux, pavés et dalles de pavement
    ou de revêtement originaires de certains pays tiers et mis en libre pratique
    dans la Communauté (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/746/EWG: Entscheidung der Kommission vom 19. Oktober 1982 zur Ermächtigung
    der Französischen Republik zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus bestimmten Drittländern stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen natürlichem Honig und Fliesen, gebrannten Pflastersteinen,
    Boden- und Wandplatten, glasiert (Nur der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/746/EØF: Kommissionens beslutning af 19. oktober 1982 om bemyndigelse
    af Den franske Republik til at indføre tilsyn inden for Fællesskabet med indførsel
    af naturlig honning og glaserede sten og fliser til brolægning, gulvbelægning
    eller beklædning af vægge, kaminer o. lign. med oprindelse i visse tredjelande
    til fri omsætning i Fællesskabet (Kun den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '82/746/EOK: Απόφαση τής Επιτροπής τής 19ης Οκτωβρίου
    1982 περί χορηγήσεως αδείας στή Γαλλική Δημοκρατία
    γιά τήν καθιέρωση ενδοκοινοτικής επιβλέψεως
    τών εισαγωγών φυσικού μελιού καί πλακιδίων,
    κύβων καί πλακών δαπέδου ή επενδύσεως, καταγωγής
    ορισμένων τρίτων χωρών, τά οποία ευρίσκονται
    σέ ελεύθερη κυκλοφορία στήν Κοινότητα (Το κείμενο
    στην γαλλική γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '82/746/CEE: Decisione della Commissione, del 19 ottobre 1982, che autorizza
    la Repubblica francese ad istituire una sorveglianza intracomunitaria delle importazioni
    di miele naturale e di piastrelle, blocchetti e lastre da pavimentazione o da
    rivestimento originari di taluni paesi terzi e messi in libera pratica nella Comunità
    (Il testo in lingua francese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '82/746/EEG: Beschikking van de Commissie van 19 oktober 1982 houdende
    machtiging van de Franse Republiek tot toepassing van een intracommunautair toezicht
    ten aanzien van de invoer van natuurhonig en plavuizen en andere vloer- en wandtegels,
    van oorsprong uit bepaalde derde landen, die in de Gemeenschap in het vrije verkeer
    zijn gebracht (Slechts de tekst in de Franse taal is authentiek)'
  type: main
