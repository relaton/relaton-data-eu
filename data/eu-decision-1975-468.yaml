---
id: EUDecision1975468
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 12 May 1975 authorizing the Republic of France not
    to apply Community treatment to gloves, mittens and mitts, knitted or crocheted,
    not elastic or rubberized, of textiles other than cotton, falling within heading
    No ex 60.02 of the Common Customs Tariff, originating in Taiwan and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '75/468/CEE: Décision de la Commission, du 12 mai 1975, autorisant la
    République française à exclure du traitement communautaire les gants de bonneterie
    non élastique ni caoutchoutée, en matières textiles autres que le coton, de
    la position Ex 60.02 du Tarif douanier commun, originaires de Taiwan et mis en
    libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 12. Mai 1975, mit der die Französische
    Republik ermächtigt wird, aus Taiwan stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Handschuhe aus Gewirken, weder gummielastisch noch
    kautschutiert, aus anderen Spinnstoffen als Baumwolle der Tarifnummer ex 60.02
    des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 12. maj 1975 om bemyndigelse for Den franske
    Republik til fra fællesskabsbehandling at undtage handsker, vanter og luffer
    af trikotage, ikke elastisk eller gummeret, af tekstilfibre (dog ikke bomuld),
    som henhører under position ex 60.02 i den fælles toldtarif, har oprindelse
    i Taiwan og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 12 maggio 1975, che autorizza la Repubblica
    francese ad escludere dal trattamento comunitario i guanti a maglia non elastica
    né gommata, di materie tessili diverse dal cotone, della voce ex 60.02 della
    tariffa doganale comune, originari di Taiwan e messi in libera pratica negli altri
    Stati membri
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 12 mei 1975 waarbij de Franse Republiek
    wordt gemachtigd handschoenen, wanten en dergelijke artikelen, van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, van textielstof andere dan van katoen
    van post ex 60.02 van het gemeenschappelijk douanetarief, van oorsprong uit Taiwan
    en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten
  type: main
