title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 802/97 of 29 April 1997 terminating the anti-dumping
    proceeding concerning imports of ball bearings with a greatest external diameter
    exceeding 30 mm originating in Japan and repealing the anti-dumping measures imposed
    on such imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 802/97 du Conseil du 29 avril 1997 clôturant la procédure
    antidumping relative aux importations de roulements à billes dont le plus grand
    diamètre extérieur excède 30 mm, originaires du Japon, et abrogeant les mesures
    antidumping instituées en ce qui concerne ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 802/97 des Rates vom 29. April 1997 zur Einstellung
    des Antidumpingverfahrens betreffend die Einfuhren von Kugellagern mit einem größten
    äußeren Durchmesser von mehr als 30 mm mit Ursprung in Japan und zur Aufhebung
    der für diese Einfuhren geltenden Antidumpingmaßnahmen
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) nr. 802/97 af 29. april 1997 om afslutning af antidumpingproceduren
    vedrørende importen af kuglelejer med største udvendige diameter på over 30
    mm med oprindelse i Japan og om ophævelse af antidumpingforanstaltningerne på
    denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 802/97 του Συμβουλίου
    της 29ης Απριλίου 1997 για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές ενσφαίρων
    τριβέων (ρουλεμάν με σφαιρίδια), με μέγιστη
    εξωτερική διάμετρο υπερβαίνουσα τα 30 χιλιοστά
    καταγωγής Ιαπωνίας και για την κατάργηση των
    μέτρων αντιντάμπινγκ που έχουν επιβληθεί σ'
    αυτές τις εισαγωγές
  type: main
- language: fi
  script: Latn
  content: NEUVOSTON ASETUS (EY) N:o 802/97, annettu 29 päivänä huhtikuuta 1997,
    polkumyynnin vastaisen menettelyn päättämisestä sellaisten Japanista peräisin
    olevien kuulalaakereiden tuonnissa, joiden suurin ulkohalkaisija on yli 30 millimetriä
    ja tällaisessa tuonnissa käyttöön otettujen polkumyynnin vastaisten toimenpiteiden
    kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento(CE) n. 802/97 del Consiglio del 29 aprile 1997 che chiude il
    procedimento antidumping relativo alle importazioni di cuscinetti a sfere con
    un diametro esterno massimo superiore a 30 mm originari del Giappone e che abroga
    le misure antidumping imposte su queste importazioni
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 802/97 van de Raad van 29 april 1997 tot beëindiging
    van de antidumpingprocedure betreffende de invoer van kogellagers met een grootste
    uitwendige diameter van meer dan 30 mm, van oorsprong uit Japan en tot intrekking
    van de op deze invoer ingestelde antidumpingmaatregelen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 802/97 do Conselho de 29 de Abril de 1997 que encerra
    o processo anti-dumping relativo às importações de rolamentos de esferas cujo
    maior diâmetro exterior excede 30 milímetros, originários do Japão, e que
    revoga as medidas anti-dumping instituídas sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 802/97 del Consejo de 29 de abril de 1997 por el que
    se da por concluido el procedimiento antidumping relativo a las importaciones
    de rodamientos de bolas cuyo diámetro exterior mayor sea superior a 30 mm originarios
    de Japón y por el que se derogan las medidas antidumping impuestas sobre dichas
    importaciones
  type: main
- language: sv
  script: Latn
  content: RÅDETS FÖRORDNING (EG) nr 802/97 av den 29 april 1997 om avslutande av
    antidumpningsförfarandet rörande import av kullager med en yttre diameter av
    mer än 30 mm med ursprung i Japan och upphävande av de antidumpningsåtgärder
    som införts på sådan import
  type: main
