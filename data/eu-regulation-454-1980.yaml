    der Verordnung (EWG) Nr. 337/79 über die gemeinsame Marktorganisation für Wein
    und der Verordnung (EWG) Nr. 338/79 zur Festlegung besonderer Vorschriften für
    Qualitätsweine bestimmter Anbaugebiete
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 454/80 af 18. februar 1980 om ændring af
