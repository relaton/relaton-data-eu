  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 454/80 del Consiglio, del 18 febbraio 1980, che modifica
    il regolamento (CEE) n. 337/79 relativo all' organizzazione comune del mercato
    vitivinicolo ed il regolamento (CEE) n. 338/79 che stabilisce disposizioni particolari
    per i vini di qualità prodotti in regioni determinate
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 454/80 van de Raad van 18 februari 1980 tot wijziging
    van Verordening (EEG) nr. 337/79 houdende een gemeenschappelijke ordening van
    de wijnmarkt en van Verordening (EEG) nr. 338/79 houdende vaststelling van bijzondere
    bepalingen betreffende in bepaalde gebieden voortgebrachte kwaliteitswijnen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 454/80 do Conselho, de 18 de Fevereiro de 1980,
    que altera o Regulamento (CEE) n.° 337/79 que estabelece a organização comum
    de mercado vitivinícola e o Regulamento (CEE) n.° 338/79 que estabelece as disposições
    particulares relativas aos vinhos de qualidade produzidos em regiões determinadas
  type: main
- language: es
  script: Latn
