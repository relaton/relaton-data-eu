title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 454/80 of 18 February 1980 amending Regulation
    (EEC) No 337/79 on the common organization of the market in wine and Regulation
    (EEC) No 338/79 laying down special provisions for quality wines produced in specified
    regions
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 454/80 du Conseil, du 18 février 1980, modifiant
    le règlement (CEE) n° 337/79 portant organisation commune du marché viti-vinicole
    et le règlement (CEE) n° 338/79 établissant les dispositions particulières
    relatives aux vins de qualité produits dans des régions déterminées
  type: main
- language: de
  script: Latn
