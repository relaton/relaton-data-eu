    de certificats à l'importation de bananes dans la Communauté pour le troisième
    trimestre de l'année 2000, dans le cadre des contingents tarifaires et de la
    quantité de bananes traditionnelles ACP
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1077/2000 der Kommission vom 22. Mai 2000 zur Festsetzung
