    ποσοστώσεων και της ποσότητας παραδοσιακών
    μπανανών ΑΚΕ
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1077/2000, annettu 22 päivänä toukokuuta 2000,
