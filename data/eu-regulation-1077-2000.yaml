    titoli d'importazione di banane nella Comunità per il terzo trimestre del 2000,
    nel quadro di contingenti tariffari e del quantitativo di banane tradizionali
    ACP
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1077/2000 van de Commissie van 22 mei 2000 tot vaststelling,
    voor het derde kwartaal van 2000, van bepaalde indicatieve hoeveelheden en individuele
    maxima voor de afgifte van certificaten voor de invoer van bananen in de Gemeenschap,
    in het kader van de tariefcontingenten en de traditionele hoeveelheid ACS-bananen
  type: main
- language: pt
