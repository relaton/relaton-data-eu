    ja perinteisten AKT-banaanien määrien osana vuoden 2000 kolmantena vuosineljänneksenä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1077/2000 della Commissione, del 22 maggio 2000, che
