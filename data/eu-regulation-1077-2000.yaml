    zur Einfuhr von Bananen in die Gemeinschaft im dritten Quartal 2000 im Rahmen
    der Zollkontingente und der traditionellen AKP-Menge
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1077/2000 af 22. maj 2000 om fastsættelse
