title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1077/2000 of 22 May 2000 fixing certain indicative
    quantities and individual ceilings for the issue of licences for the import of
    bananas into the Community in the third quarter of 2000 under the tariff quotas
    or as part of the quantity of traditional ACP bananas
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1077/2000 de la Commission du 22 mai 2000 portant fixation
