title:
- language: en
  script: Latn
  content: Ninth Commission Directive 90/506/EEC of 26 September 1990 amending annex
    IV to Council Directive 77/93/CEE on protective measures against the introduction
    into the member states of organisms harmful to plants or plant products
  type: main
- language: fr
  script: Latn
  content: Neuvième directive 90/506/CEE de la Commission, du 26 septembre 1990,
    modifiant l'annexe IV de la directive 77/93/CEE du Conseil, concernant les mesures
    de protection contre l'introduction dans les Etats Membres d'organismes nuisibles
    aux végétaux ou produits végétaux
  type: main
- language: de
  script: Latn
  content: Neunte Richtlinie 90/506/EWG der Kommission vom 26. September 1990 zur
    Änderung von Anhang IV der Richtlinie 77/93/EWG des Rates über Maßnahmen zum
    Schutz gegen das verbringen von schadorganismen der pflanzen oder pflanzenerzeugnisse
    in die Mitgliedstaaten
  type: main
- language: da
  script: Latn
  content: Kommissionens niende direktiv 90/506/EØF af 26. september 1990 om ændring
    af bilag IV til Rådets direktiv 77/93/EØF om foranstaltninger mod indslæbning
    i medlemsstaterne af skadegørere på planter eller planteprodukter
  type: main
- language: el
  script: Grek
  content: Ένατη οδηγία 90/506/ΕΟΚ της Επιτροπής της
    26ης Σεπτεμβρίου 1990 για τροποποίηση του παραρτήματος
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου περί των
    μέτρων προστασίας κατά της εισαγωγής στα κράτη
    μέλη οργανισμών επιβλαβών για τα φυτά ή τα
    φυτικά προϊόντα
  type: main
- language: fi
  script: Latn
  content: Komission yhdeksäs direktiivi 90/506/ETY, annettu 26 päivänä syyskuuta
    1990, kasvien tai kasvituotteiden haitallisten organismien jäsenvaltioihin kulkeutumisen
    estämiseen liittyvistä suojatoimenpiteistä annetun neuvoston direktiivin 77/93/ETY
    liitteen IV muuttamisesta
  type: main
- language: it
  script: Latn
  content: Nona direttiva 90/506/CEE della Commissione, del 26 settembre 1990, che
    modifica l'allegato IV della direttiva 77/93/CEE del Consiglio concernente le
    misure di protezione contro l'introduzione negli Stati Membri di organismi nocivi
    ai vegetali o ai prodotti vegetali
  type: main
- language: nl
  script: Latn
  content: Negende Richtlijn 90/506/EEG van de Commissie van 26 september 1990 tot
    Wijziging van bijlage IV bij Richtlijn 77/93/EEG betreffende de beschermende maatregelen
    tegen het binnenbrengen op het grondgebied van de Lid-Staten van voor planten
    of voor plantaardige produkten schadelijke organismen
  type: main
- language: pt
  script: Latn
  content: Nona Directiva 90/506/CEE da Comissão, de 26 de Setembro de 1990, que
    altera o anexo IV da Directiva 77/93/CEE do Conselho relativa as medidas de protecção
    contra a introdução nos Estados-Membros de organismos prejudiciais as plantas
    e produtos vegetais
  type: main
- language: es
  script: Latn
  content: Novena Directiva 90/506/CEE de la Comisión, de 26 de septiembre de 1990,
    por la que se modifica el anexo IV de la directiva 77/93/CEE del consejo relativa
    a las medidas de protección contra la introducción en los Estados Miembros de
    organismos nocivos para los vegetales o productos vegetales
  type: main
- language: sv
  script: Latn
  content: Kommissionens nionde direktiv 90/506/EEG av den 26 september 1990 om ändring
    av bilaga 4 till rådets direktiv 77/93/EEG om skyddsåtgärder mot att skadegörare
    på växter eller växtprodukter förs in till medlemsstaterna
  type: main
