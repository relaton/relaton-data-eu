title:
- language: en
  script: Latn
  content: '83/434/EEC: Commission Decision of 10 August 1983 establishing that the
    apparatus described as ''Comsat - Packet Satellite Program (PSP) Terminal'' may
    not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '83/434/CEE: Décision de la Commission du 10 août 1983 constatant que
    l''importation de l''appareil dénommé "Comsat - Packet Satellite Program (PSP)
    Terminal" ne peut être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '83/434/EWG: Entscheidung der Kommission vom 10. August 1983, mit der festgestellt
    wird, daß das Gerät ,,COMSAT - Packet Satellite Program (PSP) Terminal" nicht
    unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '83/434/EØF: Kommissionens beslutning af 10. august 1983 om fastslåelse
