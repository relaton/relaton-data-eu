  script: Latn
  content: 2013 m. rugpjūčio 26 d. Komisijos reglamentas (ES) Nr. 806/2013, kuriuo
    inicijuojama Tarybos įgyvendinimo reglamento (ES) Nr. 102/2012 (kuriuo nustatomas
    galutinis antidempingo muitas, inter alia , importuojamiems Kinijos Liaudies Respublikos
