  script: Latn
  content: Nařízení Komise (EU) č. 806/2013 ze dne 26. srpna 2013 , kterým se
    zahajuje přezkum prováděcího nařízení Rady (EU) č. 102/2012, kterým se
    ukládá konečné antidumpingové clo na dovoz ocelových lan a kabelů pocházejících
    mimo jiné z Čínské lidové republiky, rozšířené na dovoz ocelových lan
    a kabelů zasílaných mimo jiné z Korejské republiky, bez ohledu na to, zda
    je u něho deklarován původ z Korejské republiky, jehož cílem je určit,
    zda od těchto opatření lze osvobodit jednoho korejského vývozce a zrušit
    stávající antidumpingové clo, pokud jde o dovoz od tohoto vývozce, a zavést
    celní evidenci tohoto dovozu
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EU) nr. 806/2013 af 26. august 2013 om indledning
    af en fornyet undersøgelse af Rådets gennemførelsesforordning (EU) nr. 102/2012
    om indførelse af en endelig antidumpingtold på importen af tovværk og kabler
    af stål med oprindelse i bl.a. Republikken Kina, som er udvidet til også at
    omfatte importen af tovværk og kabler af stål afsendt fra bl.a. Republikken
    Korea, uanset om varen er angivet med oprindelse i Republikken Korea, med henblik
    på at fastslå, om en koreansk eksportør kan indrømmes fritagelse for disse
    foranstaltninger, om ophævelse af den gældende antidumpingtold på importen
    fra denne eksportør og om registrering af denne import
  type: main
