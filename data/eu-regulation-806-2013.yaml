title:
- language: en
  script: Latn
  content: Commission Regulation (EU) No 806/2013 of 26 August 2013 initiating a review
    of Council Implementing Regulation (EU) No 102/2012 imposing a definitive anti-dumping
    duty on imports of steel ropes and cables originating, inter alia, in the People’s
    Republic of China, as extended to imports of steel ropes and cables consigned
    from, inter alia, the Republic of Korea, whether declared as originating in the
    Republic of Korea or not, for the purposes of determining the possibility of granting
    an exemption from those measures to one Korean exporter and repealing the existing
    anti-dumping duty with regard to imports from that exporter and making those imports
    subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (UE) n ° 806/2013 de la Commission du 26 août 2013 portant
    ouverture d’un réexamen du règlement d’exécution (UE) n ° 102/2012 du
    Conseil instituant un droit antidumping définitif sur les importations de câbles
    en acier originaires, entre autres, de la République populaire de Chine, tel
    qu’étendu aux importations de câbles en acier expédiés, entre autres, de
    la République de Corée, qu’ils aient ou non été déclarés originaires de
    ce pays, afin d’étudier la possibilité d’accorder une exemption de ces mesures
    à un exportateur coréen, abrogeant le droit antidumping en vigueur pour les
    importations effectuées par cet exportateur et soumettant ces importations à
    enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EU) Nr. 806/2013 der Kommission vom 26. August 2013 zur Einleitung
    einer Überprüfung der Durchführungsverordnung (EU) Nr. 102/2012 des Rates zur
    Einführung eines endgültigen Antidumpingzolls auf die Einfuhren von Kabeln und
    Seilen aus Stahl mit Ursprung — unter anderem — in der Volksrepublik China,
    ausgeweitet auf die Einfuhren von — unter anderem — aus der Republik Korea
    versandten Kabeln und Seilen aus Stahl, ob als Ursprungserzeugnisse der Republik
    Korea angemeldet oder nicht, zwecks Prüfung der Möglichkeit der Befreiung eines
    koreanischen Ausführers von diesen Maßnahmen und zur Außerkraftsetzung des
    Antidumpingzolls auf die von diesem Ausführer stammenden Einfuhren sowie zur
    zollamtlichen Erfassung der letztgenannten Einfuhren
  type: main
