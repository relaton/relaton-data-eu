  script: Latn
  content: Regolament tal-Kummissjoni (UE) Nru 806/2013 tas- 26 ta’ Awwissu 2013
    li jagħti bidu għal reviżjoni tar-Regolament ta’ Implimentazzjoni tal-Kunsill
    (UE) Nru 102/2012 li jimponi dazju antidumping definittiv fuq importazzjonijiet
    ta’ ħbula u kejbils tal-azzar li joriġinaw mir-Repubblika Popolari taċ-Ċina,
    kif esstiż għall-importazzjonijiet ta’ ħbula u kejbils tal-azzar ikkunsinjati
    minn, fost l-oħrajn, mir-Repubblika tal-Korea, kemm jekk iddikjarati bħala li
    joriġinaw fir-Repubblika tal-Korea kemm jekk le, għall-finijiet li tiġi ddeterminata
    l-possibbiltà li tingħata eżenzjoni minn dawk il-miżuri lil esportatur Korean
    wieħed, u li jirrevoka d-dazju anti-dumping eżistenti dwar l-importazzjonijiet
    minn dak l-esportatur u li dawk l-importazzjonijiet jagħmilhom soġġetti għar-reġistrazzjoni
  type: main
- language: nl
  script: Latn
  content: Verordening (EU) nr. 806/2013 van de Commissie van 26 augustus 2013 tot
    opening van een nieuw onderzoek in verband met Uitvoeringsverordening (EU) nr.
    102/2012 van de Raad tot instelling van een definitief antidumpingrecht op stalen
    kabels van oorsprong uit onder meer de Volksrepubliek China, zoals uitgebreid
    tot stalen kabels verzonden uit onder meer de Republiek Korea, al dan niet aangegeven
    als van oorsprong uit de Republiek Korea, teneinde de mogelijkheid vast te stellen
    om een Koreaanse exporteur vrijstelling te verlenen van die maatregelen, het geldende
    antidumpingrecht ten aanzien van die exporteur in te trekken en de van deze exporteur
    afkomstige invoer te registreren
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Komisji (UE) nr 806/2013 z dnia 26 sierpnia 2013 r. w sprawie
    wszczęcia przeglądu rozporządzenia wykonawczego Rady (UE) nr 102/2012 nakładającego
    ostateczne cło antydumpingowe na przywóz stalowych lin i kabli pochodzących
    między innymi z Chińskiej Republiki Ludowej, rozszerzone na przywóz stalowych
    lin i kabli wysyłanych między innymi z Republiki Korei, zgłoszonych lub niezgłoszonych
    jako pochodzące z Republiki Korei, w celu ustalenia możliwości przyznania zwolnienia
    z tych środków jednemu koreańskiemu eksporterowi, uchylenia obowiązującego
    cła antydumpingowego w odniesieniu do towarów przywożonych przez tego eksportera
    oraz objęcia rejestracją towarów przywożonych przez tego eksportera
  type: main
- language: pt
  script: Latn
  content: Regulamento (UE) n. ° 806/2013 da Comissão, de 26 de agosto de 2013 ,
    que dá início ao reexame do Regulamento de Execução (UE) n. ° 102/2012 do
    Conselho que institui um direito anti-dumping definitivo sobre as importações
    de cabos de aço originários, nomeadamente, da República Popular da China tornado
    extensivo às importações de cabos de aço expedidos, nomeadamente, da República
    da Coreia, independentemente de serem ou não declarados originários da República
    da Coreia, para efeitos de determinar a possibilidade de conceder uma isenção
    dessas medidas a um exportador coreano e revogar o direito anti-dumping em vigor
    no que diz respeito às importações provenientes desse exportador e que sujeita
    essas importações a registo
  type: main
- language: ro
  script: Latn
  content: Regulamentul (UE) nr. 806/2013 al Comisiei din 26 august 2013 de deschidere
    a unei reexaminări a Regulamentului de punere în aplicare (UE) nr. 102/2012
    al Consiliului de instituire a unei taxe antidumping definitive asupra importurilor
    de cabluri din oțel originare, printre altele, din Republica Populară Chineză,
    astfel cum a fost extinsă la importurile de cabluri din oțel expediate, printre
    altele, din Republica Coreea, indiferent dacă sunt sau nu declarate ca fiind
    originare din Republica Coreea, pentru a stabili posibilitatea de a acorda o scutire
    de la aceste măsuri unui exportator coreean și de abrogare a taxei antidumping
    existente cu privire la importurile provenite de la acest exportator și de supunere
    a acestor importuri înregistrării
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (EÚ) č. 806/2013 z 26. augusta 2013 o začatí preskúmania
    vykonávacieho nariadenia Rady (EÚ) č. 102/2012, ktorým sa ukladá konečné
    antidumpingové clo na dovoz oceľových lán a káblov s pôvodom okrem iného
    v Čínskej ľudovej republike rozšírené na dovoz oceľových lán a káblov
    zasielaných okrem iného z Kórejskej republiky, bez ohľadu na to, či majú,
    alebo nemajú deklarovaný pôvod v Kórejskej republike, na účely zistenia
    možnosti udelenia výnimky z týchto opatrení jednému kórejskému vývozcovi,
    zrušenia existujúceho antidumpingového cla na dovoz od tohto vývozcu a podmienenia
    dovozu od tohto vývozcu registrácii
  type: main
- language: sl
  script: Latn
  content: Uredba Komisije (EU) št. 806/2013 z dne 26. avgusta 2013 o začetku pregleda
    Izvedbene uredbe Sveta (EU) št. 102/2012 o uvedbi dokončne protidampinške dajatve
    na uvoz jeklenih vrvi in kablov s poreklom iz, med drugim, Ljudske republike Kitajske,
    kot je bila razširjena na uvoz jeklenih vrvi in kablov, poslanih iz, med drugim,
    Republike Koreje, ne glede na to, ali so deklarirani kot s poreklom iz Republike
    Koreje ali ne, da se ugotovi, ali se za določenega korejskega izvoznika lahko
    odobri izvzetje iz navedenih ukrepov, odpravijo protidampinške dajatve pri njegovem
    uvozu in uvede registracija njegovega uvoza
  type: main
- language: es
  script: Latn
  content: Reglamento (UE) n ° 806/2013 de la Comisión, de 26 de agosto de 2013
    , mediante el cual se inicia una reconsideración del Reglamento de Ejecución
    (UE) n ° 102/2012 del Consejo, por el que se establece un derecho antidumping
    definitivo sobre las importaciones de cables de acero originarios, entre otros
    países, de la República Popular China, ampliado a las importaciones de cables
    de acero procedentes de, entre otros países, la República de Corea, hayan sido
    o no declarados originarios de la República de Corea, a fin de determinar la
    posibilidad de eximir de tales medidas a un exportador coreano, de derogar el
    derecho antidumping con respecto a las importaciones procedentes de ese exportador
    y de someter estas importaciones a la obligación de registro
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EU) nr 806/2013 av den 26 augusti 2013 om inledande
    av en översyn av rådets genomförandeförordning (EU) nr 102/2012 om införande
    av en slutgiltig antidumpningstull på import av linor och kablar av stål med
    ursprung i bland annat Folkrepubliken Kina, utvidgad till att även omfatta import
    av linor och kablar av stål som avsänts från bland annat Republiken Korea,
    oavsett om produkternas deklarerade ursprung är Republiken Korea eller inte,
    i syfte att fastställa om det är möjligt att bevilja en koreansk exportör
    befrielse från dessa åtgärder, om upphävande av antidumpningstullen avseende
    import från den exportören och om registrering av import från den exportören
  type: main
