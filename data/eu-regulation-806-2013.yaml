  content: Komisjoni määrus (EL) nr 806/2013, 26. august 2013 , millega algatatakse
    nõukogu rakendusmääruse (EL) nr 102/2012 (millega kehtestatakse muu hulgas
    Hiina Rahvavabariigist pärit terastrosside ja -kaablite impordi suhtes lõplik
    dumpinguvastane tollimaks, mida laiendatakse muu hulgas Korea Vabariigist lähetatud
