  script: Latn
  content: Komission asetus (EU) N:o 806/2013, annettu 26 päivänä elokuuta 2013
    , lopullisen polkumyyntitullin käyttöönotosta muun muassa Kiinan kansantasavallasta
    peräisin olevien teräsköysien ja -kaapeleiden tuonnissa laajennettuna koskemaan
    muun muassa Korean tasavallasta lähetettyjen teräsköysien ja -kaapeleiden tuontia
    riippumatta siitä, onko Korean tasavalta ilmoitettu alkuperämaaksi, annettua
    neuvoston täytäntöönpanoasetusta (EU) N:o 102/2012 koskevan tarkastelun vireillepanosta
    sen määrittämiseksi, voidaanko näistä toimenpiteistä myöntää vapautus
    yhdelle korealaiselle viejälle, voimassa olevan polkumyyntitullin kumoamisesta
    kyseisen viejän tuonnissa ja kyseisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: hr
  script: Latn
  content: Uredba Komisije (EU) br. 806/2013 оd 26. kolovoza 2013. o pokretanju revizije
    Provedbene uredbe Vijeća (EU) br. 102/2012 o uvođenju konačne antidampinške
    pristojbe na uvoz čelične užadi i kabela s podrijetlom, među ostalim, iz Narodne
    Republike Kine, kako je proširena na uvoz čelične užadi i kabela poslanih,
    među ostalim, iz Republike Koreje, bez obzira na to imaju li deklarirano podrijetlo
    iz Republike Koreje ili ne, radi utvrđivanja mogućnosti odobravanja izuzeća
    od tih mjera jednom korejskom izvozniku i stavljanja izvan snage postojeće antidampinške
    pristojbe s obzirom na uvoz koji obavlja taj izvoznik te nametanja obveze evidentiranja
    dotičnog uvoza
  type: main
- language: hu
  script: Latn
  content: A Bizottság 806/2013/EU rendelete ( 2013. augusztus 26. ) a dömpingellenes
    intézkedések alól egy koreai exportőr számára biztosítható mentesség
    megállapításának, a meglévő dömpingellenes vámnak az érintett exportőrtől
    származó behozatalok tekintetében való hatályon kívül helyezésének és
    az érintett exportőrtől származó behozatalok nyilvántartásba vételre való
    kötelezésének céljából a többek között a Kínai Népköztársaságból
    származó acél drótkötelek és -kábelek behozatalára vonatkozó és a többek
    között a Koreai Köztársaságból feladott – akár a Koreai Köztársaságból
    származóként, akár nem ilyenként bejelentett – acél drótkötelek és
    -kábelek behozatalára kiterjesztett végleges dömpingellenes vám kivetéséről
    szóló 102/2012/EU tanácsi végrehajtási rendelet felülvizsgálatának megindításáról
  type: main
- language: it
  script: Latn
  content: Regolamento (UE) n. 806/2013 della Commissione, del 26 agosto 2013 , che
    avvia un riesame del regolamento di esecuzione (UE) n. 102/2012 del Consiglio,
    che impone un dazio antidumping definitivo sulle importazioni di cavi d’acciaio
    originari, tra l’altro, della Repubblica popolare cinese, esteso alle importazioni
    di cavi d’acciaio provenienti, tra l’altro, dalla Repubblica di Corea, anche
    se non dichiarati originari della Repubblica di Corea, al fine di determinare
    la possibilità di concedere l’esenzione da tali misure a un esportatore coreano,
    e che abroga il vigente dazio antidumping sulle importazioni in provenienza da
    detto esportatore e dispone la registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
  content: Komisijas Regula (ES) Nr. 806/2013 ( 2013. gada 26. augusts ), ar kuru
    sāk pārskatīt Padomes Īstenošanas regulu (ES) Nr. 102/2012, ar ko nosaka
    galīgo antidempinga maksājumu par cita starpā Ķīnas Tautas Republikas izcelsmes
    tērauda trošu un tauvu importu un attiecina šo maksājumu arī uz tērauda
    trošu un tauvu importu, kurš nosūtīts cita starpā no Korejas Republikas,
    neatkarīgi no tā, vai tas ir deklarēts ar izcelsmi Korejas Republikā, lai
    noteiktu iespēju vienu Korejas eksportētāju atbrīvot no šo pasākumu piemērošanas,
    atcelt antidempinga maksājumu par tā veikto importu un paredzēt šā importa
    reģistrāciju
  type: main
