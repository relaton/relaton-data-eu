    nustatyti, ar vienam Korėjos eksportuotojui galima netaikyti šių priemonių,
    ir kuriuo panaikinamas galiojantis antidempingo muitas iš šio eksportuotojo
    importuojamam produktui ir nustatoma privaloma šio importuojamo produkto registracija
  type: main
