title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2978/78 of 15 December 1978 re-establishing
    the levying of customs duties on thermionic, cold cathode and photo-cathode valves
    and tubes, etc., falling within subheadings 85.21 A, B and C and originating in
    developing countries, to which the preferential tariff arrangements set out in
    Council Regulation (EEC) No 2705/77 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2978/78 de la Commission, du 15 décembre 1978, portant
    rétablissement de la perception des droits de douane applicables aux lampes,
    tubes et valves électroniques, etc., des sous-positions tarifaires 85.21 A, B
    et C, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 2705/77
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2978/78 der Kommission vom 15. Dezember 1978 zur Wiedereinführung
    des Zollsatzes für Elektronenröhren usw., der Tarifstellen 85.21 A, B und C,
    mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2705/77
    des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2978/78 af 15. december 1978 om genindførelse
    af opkrævning af toldafgifter for elektronrør, (glødekatoderør og fotokatoderør),
    såsom vakuumrør, etc., under underposition 85.21 A, B og C, som har oprindelse
    i udviklingslande og omfattes af de toldpræferencer, der er fastsat i Rådets
    forordning (EØF) nr. 2705/77
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2978/78 della Commissione, del 15 dicembre 1978, che
    ripristina la riscossione dei dazi doganali applicabili alle lampade, tubi e valvole,
    elettronici, ecc., delle sottovoci doganali 85.21 A, B e C, originari dei paesi
    in via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 2705/77 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2978/78 van de Commissie van 15 december 1978 houdende
    wederinstelling van de heffing van de douanerechten voor elektronenbuizen enz.,
    van de onderverdelingen 85.21 A, B en C, van oorsprong uit de ontwikkelingslanden,
    ten behoeve waarvan bij Verordening (EEG) nr. 2705/77 van de Raad tariefpreferenties
    werden geopend
  type: main
