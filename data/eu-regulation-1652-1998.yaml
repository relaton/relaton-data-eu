title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1652/98 of 27 July 1998 determining the extent
    to which applications lodged in July 1998 for import licences for certain pigmeat
    products under the regime provided for by the Agreements concluded by the Community
    with the Republic of Poland, the Republic of Hungary, the Czech Republic, Slovakia,
    Bulgaria and Romania can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1652/98 de la Commission du 27 juillet 1998 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 1998 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par les accords conclus par la Communauté avec la république
    de Pologne, la république de Hongrie, la République tchèque, la Slovaquie,
    la Bulgarie et la Roumanie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1652/98 der Kommission vom 27. Juli 1998 über die
    Festsetzung des Umfangs, in dem die im Juli 1998 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Polen, Ungarn, der Tschechischen Republik, der Slowakei,
    Bulgarien und Rumänien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1652/98 af 27. juli 1998 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1998 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i de aftaler, som Fællesskabet har indgået med Republikken Polen,
    Republikken Ungarn, Den Tjekkiske Republik, Den Slovakiske Republik, Republikken
    Bulgarien og Rumænien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1652/98 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 27ης Ιουλίου 1998 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο του 1998
    για πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες, τις οποίες συνήψε η Κοινότητα με
    τη Δημοκρατία της Πολωνίας, τη Δημοκρατία της
    Ουγγαρίας, την Τσεχική Δημοκρατία, τη Σλοβακία,
    τη Βουλγαρία και τη Ρουμανία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1652/98, annettu 27 päivänä heinäkuuta 1998,
    yhteisön Puolan tasavallan, Unkarin tasavallan, Tsekin tasavallan, Slovakian,
    Bulgarian sekä Romanian kanssa tekemissä sopimuksissa määrätyn järjestelmän
    mukaisesti heinäkuussa 1998 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1652/98 della Commissione del 27 luglio 1998 che stabilisce
