    με την πρώην Τσεχική και Σλοβακική Ομοσπονδιακή
    Δημοκρατία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 104/95, annettu 24 päivänä tammikuuta 1995,
    yhteisön sekä Puolan tasavallan ja Unkarin tasavallan välisissä sopimuksissa
    ja entisen Tsekin ja Slovakian liittotasavallan välisissä väliaikaisissa sopimuksissa
