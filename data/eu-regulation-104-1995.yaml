title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 104/95 of 24 January 1995 determining the
    extent to which applications lodged in January 1995 for import licences for fresh,
    chilled or frozen beef under the import arrangements provided for in the European
    Agreements between the Community and the Republic of Poland, the Republic of Hungary
    and the Interim Agreements with the former Czech and Slovak Federal Republic (CSFR)
    can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 104/95 DE LA COMMISSION du 24 janvier 1995 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de licences d'importation
    introduites en janvier 1995 pour les viandes bovines fraîches, réfrigérées
    ou congelées dans le cadre des régimes d'importation prévus par les accords
    européens entre la Communauté et la république de Pologne, la république de
    Hongrie et par l'accord intérimaire avec l'ancienne République fédérative
    tchèque et slovaque
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 104/95 DER KOMMISSION vom 24. Januar 1995 zur Festsetzung
    des Umfangs, in dem die im Januar 1995 für frisches, gekühltes oder gefrorenes
    Rindfleisch gestellten Einfuhrlizenzanträge gemäß den Europäischen Abkommen
    zwischen der Gemeinschaft und der Republik Polen, der Republik Ungarn und gemäß
    dem Interimsabkommen mit der ehemaligen Tschechischen und Slowakischen Föderativen
    Republik (CSFR) genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 104/95 af 24. januar 1995 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, indgivet i januar 1995 om
    importlicenser for fersk, kølet og frosset oksekød i forbindelse med de importordninger,
    der er fastsat i Europaaftalerne mellem Fællesskabet og Republikken Polen, Republikken
    Ungarn og interimsaftalen med den tidligere Tjekkiske og Slovakiske Føderative
    Republik
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 104/95 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 24ης Ιανουαρίου 1995 για καθορισμό του ορίου
    εντός του οποίου δύνανται να γίνουν αποδεκτές
    οι αιτήσεις αδειών εισαγωγής που υποβλήθηκαν
    τον Ιανουάριο 1995 για τα νωπά, διατηρημένα με
