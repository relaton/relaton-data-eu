  content: Règlement (CEE) n° 1343/71 de la Commission, du 25 juin 1971, modifiant
    le règlement (CEE) n° 1084/68 en ce qui concerne le taux de suspension du prélèvement
    applicable à l'importation des viandes bovines congelées destinées à la transformation
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1343/71 der Kommission vom 25. Juni 1971 zur Änderung
    der Verordnung (EWG) Nr. 1084/68 betreffend den Aussetzungssatz, der auf die Einfuhren
    von zur Verarbeitung bestimmtem gefrorenem Rindfleisch anzuwenden ist
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1343/71 della Commissione, del 25 giugno 1971, che
    modifica il regolamento (CEE) n. 1084/68 per quanto riguarda il tasso di sospensione
    del prelievo applicabile all'importazione delle carni bovine congelate atte alla
    trasformazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1343171 van de Commissie van 25 juni 1971 houdende
    wijziging van Verordening (EEG) nr. 1084/68 betreffende het percentage waarmee
    de heffing bij de invoer van bevroren, voor de verwerking bestemd, rundvlees wordt
    geschorst
