title:
- language: en
  script: Latn
  content: '93/208/EEC: Commission Decision of 17 March 1993 releasing the Kingdom
    of Denmark from the requirements to indicate on the official label the botanical
    name in respect of cereal seed, under Council Directive 66/402/EEC (Only the Danish
    text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/208/CEE: Décision de la Commission, du 17 mars 1993, dispensant le
    Royaume de Danemark de l''obligation d''indiquer sur l''étiquette officielle
    le nom botanique en ce qui concerne les semences de céréales conformément à
    la directive 66/402/CEE du Conseil (Le texte en langue danoise est le seul faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '93/208/EWG: Entscheidung der Kommission vom 17. März 1993 zur Freistellung
    des Königreichs Dänemark von der Verpflichtung zur Angabe der botanischen Bezeichnung
    von Getreidesaatgut gemäß der Richtlinie 66/402/EWG des Rates (Nur der dänische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/208/EØF: Kommissionens beslutning af 17. marts 1993 om fritagelse
    af Kongeriget Danmark fra kravet om, at det botaniske navn for sædekorn skal
    angives på den officielle etiket, i henhold til Rådets direktiv 66/402/EØF
    (Kun den danske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 17ης Μαρτίου 1993
    για την απαλλαγή του Βασιλείου της Δανίας από
    την υποχρέωση αναγραφής της βοτανικής ονομασίας
    στην επίσημη ετικέτα, όσον αφορά σπόρους για
    σπορά δημητριακών, βάσει της οδηγίας 66/402/ΕΟΚ
    του Συμβουλίου (Το κείμενο στην δανική γλώσσα
    είναι το μόνο αυθεντικό)
  type: main
- language: it
  script: Latn
  content: '93/208/CEE: Decisione della Commissione, del 17 marzo 1993, che dispensa
    il Regno di Danimarca dal rispetto dei requisiti prescritti per l''indicazione
    sull''etichetta ufficiale del nome botanico delle sementi di cereali, conformemente
    alla direttiva 66/402/CEE del Consiglio (Il testo in lingua danese è il solo
    facente fede)'
  type: main
- language: nl
  script: Latn
  content: '93/208/EEG: Beschikking van de Commissie van 17 maart 1993 tot vrijstelling
