  content: Commission Implementing Regulation (EU) No 485/2013 of 24 May 2013 amending
    Implementing Regulation (EU) No 540/2011, as regards the conditions of approval
    of the active substances clothianidin, thiamethoxam and imidacloprid, and prohibiting
    the use and sale of seeds treated with plant protection products containing those
    active substances
  type: main
- language: fr
  script: Latn
