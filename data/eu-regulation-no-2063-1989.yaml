    Strümpfe, Socken, aus Gewirken, der Warenkategorie Nr. 12 (lfd. Nr. 40.0120),
    Kostüme und Kombinationen, aus Gewirken, für Frauen, der Warenkategorie Nr.
    73 (lfd. Nr. 40.0730) und Kostüme, aus Gewirken, für Frauen, der Warenkategorie
    Nr. 74 (lfd. Nr. 40.0740) mit Ursprung in Indonesien, dem die in der Verordnung
    (EWG) Nr. 4259/88 des Rates vorgesehenen Zollpräferenzen gewährt werden #'
