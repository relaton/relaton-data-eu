title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2063/89 of 10 July 1989 re-establishing
    the levying of customs duties on jerseys, pullovers, etc., products of category
    No 5 (order No 40.0050), socks, sockettes, knitted or crocheted, products of category
    No 12 (order No 40.0120),track suits of knitted or crocheted fabric, products
    of category No 73 (order No 40.0730), and women's knitted or crocheted suits and
    ensembles, products of category No 74 (order No 40.0740), originating in the Indonesia,
    to which the preferential tariff arrangements of Council Regulation (EEC) No 4259/88
    apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2063/89 de la Commission du 10 juillet 1989 portant
    rétablissement de la perception des droits de douane applicables aux chandails,
    pull-overs, etc., de la catégorie 5 (numéro d'ordre 40.0050), aux bas, chaussettes,
    en bonneterie, de catégorie 12 (numéro d'ordre 40.0120), aux trainings, en bonneterie,
    de la catégorie 73 (numéro d'ordre 40.0730), et aux costumes- tailleurs, en
    bonneterie, pour femmes, de la catégorie 74 (numéro d'ordre 40.0740), originaires
    de l'Indonésie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 4259/88 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 2063/89 DER KOMMISSION vom 10. Juli 1989 zur Wiedereinführung
