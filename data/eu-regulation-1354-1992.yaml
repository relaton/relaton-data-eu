title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1354/92 of 26 May 1992 on the sale by the
    procedure laid down in Regulation (EEC) No 2539/84 of boneless beef held by certain
    intervention agencies and intended for export, amending Regulation (EEC) No 569/88
    and repealing Regulation (EEC) No 665/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1354/92 de la Commission du 26 mai 1992 relatif à
    la vente, dans le cadre de la procédure définie au règlement (CEE) n° 2539/84,
    de viandes bovines désossées détenues par certains organismes d'intervention
    et destinées à être exportées, modifiant le règlement (CEE) n° 569/88 et
    abrogeant le règlement (CEE) n° 665/92
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1354/92 DER KOMMISSION vom 26. Mai 1992 über den
    Verkauf von zur Ausfuhr bestimmtem Rindfleisch ohne Knochen aus Interventionsbeständen
    nach der Verordnung (EWG) Nr. 2539/84, zur Änderung der Verordnung (EWG) Nr.
    569/88 und zur Aufhebung der Verordnung (EWG) Nr. 665/92 #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1354/92 af 26. maj 1992 om salg efter
    proceduren i forordning (EØF) nr. 2539/84 af udbenet oksekød fra visse interventionsorganer
    med henblik på udførsel, om ændring af forordning (EØF) nr. 569/88 og om ophævelse
    af forordning (EØF) nr. 665/92 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1354/92 της Επιτροπής
    της 26ης Μαΐου 1992 σχετικά με την πώληση, βάσει
    της διαδικασίας που καθορίζεται στον κανονισμό
    (ΕΟΚ) αριθ. 2539/84, αποστεωμένου βοείου κρέατος
    που κρατείται από ορισμένους οργανισμούς παρεμβάσεως
    και προορίζεται να εξαχθεί, καθώς και σχετικά
    με την τροποποίηση του κανονισμού (ΕΟΚ) αριθ.
    569/88 και την κατάργηση του κανονισμού (ΕΟΚ) αριθ.
    665/92
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1354/92 DELLA COMMISSIONE del 26 maggio 1992 relativo
    alla vendita, mediante la procedura prevista dal regolamento (CEE) n. 2539/84,
    di carni bovine disossate detenute da taluni organismi d'' intervento e destinate
    ad essere esportate, che modifica il regolamento (CEE) n. 569/88 e recante abrogazione
    del regolamento (CEE) n. 665/92 #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1354/92 VAN DE COMMISSIE van 26 mei 1992 betreffende
    de verkoop overeenkomstig de in Verordening (EEG) nr. 2539/84 vastgestelde procedure
    van door bepaalde interventiebureaus opgeslagen en voor uitvoer bestemd rundvlees
    zonder been, houdende wijziging van Verordening (EEG) nr. 569/88 en houdende intrekking
    van Verordening (EEG) nr. 665/92 #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1354/92 DA COMISSÃO de 26 de Maio de 1992 relativo
    à venda, no âmbito do processo definido no Regulamento (CEE) no 2539/84, de
    carne de bovino desossada detida por certos organismos de intervenção e destinada
    a ser exportada, que altera o Regulamento (CEE) no 569/88 e que revoga o Regulamento
    (CEE) no 665/92 #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1354/92 DE LA COMISIÓN de 26 de mayo de 1992 relativo
    a la venta, en el marco del procedimiento definido en el Reglamento (CEE) no 2539/84,
    de carnes de vacuno deshuesadas en poder de determinados organismos de intervención
    y destinadas a ser exportadas y por el que se modifica el Reglamento (CEE) no
    569/88 y se deroga el Reglamento (CEE) no 665/92 #'
