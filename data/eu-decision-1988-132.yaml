title:
- language: en
  script: Latn
  content: '88/132/EEC: Commission Decision of 12 February 1988 allocating to Luxembourg
    a second tranche of appropriations to be set off against the 1988 financial year
    for the supply of food from intervention stocks to designated organizations for
    distribution to the most deprived persons in the Community'
  type: main
- language: fr
  script: Latn
  content: '88/132/CEE: Décision de la Commission du 12 février 1988 allouant au
    Luxembourg une deuxième tranche des crédits imputables à l'' exercice 1988
    pour la fourniture de denrées alimentaires provenant des stocks d'' intervention
    à des organisations désignées pour les distribuer aux personnes les plus démunies
    de la Communauté'
  type: main
- language: de
  script: Latn
  content: '88/132/EWG: Entscheidung der Kommission vom 12. Februar 1988 über eine
    zweite Zuteilung an Luxemburg von im Haushaltsjahr 1988 zu verbuchenden Mitteln
    für die Lieferung von Nahrungsmitteln aus Interventionsbeständen an bezeichnete
    Organisationen zu ihrer Verteilung an stark benachteiligte Personen in der Gemeinschaft'
  type: main
- language: da
  script: Latn
  content: '88/132/EØF: Kommissionens beslutning af 12. februar 1988 om en anden
    tildeling til Luxembourg af en del af de midler, der skal opføres på 1988-budgettet
    for levering af levnedsmidler fra interventionslagre til nærmere bestemte organisationer
    med henblik på uddeling til de socialt dårligst stillede personer i Fællesskabet'
  type: main
- language: el
  script: Grek
  content: '88/132/ΕΟΚ: Απόφαση της Επιτροπής της 12ης
    Φεβρουαρίου 1988 που χορηγεί στο Λουξεμβούργο
    μια δεύτερη μερίδα πιστώσεων που καταλογίζονται
    στο οικονομικό έτος 1988 για τη χορήγηση τροφίμων
    που προέρχονται από τα αποθέματα της παρεμβάσεως
    στους οργανισμούς που ορίζονται για τη διανομή
    τους στους απόρους της Κοινότητας'
  type: main
- language: it
  script: Latn
  content: '88/132/CEE: Decisione della Commissione del 12 febbraio 1988 relativa
    ad un secondo stanziamento al Lussemburgo di parte delle risorse da imputare all''
    esercizio finanziario 1988 per la fornitura di derrate alimentari provenienti
    dalle scorte di intervento agli organismi incaricati di distribuirle agli indigenti
    nella Comunità'
  type: main
- language: nl
  script: Latn
  content: '88/132/EEG: Beschikking van de Commissie van 12 februari 1988 waarbij
    aan Luxemburg een tweede gedeelte wordt toegekend van de voor het begrotingsjaar
    1988 te boeken financiële middelen voor de levering van voedsel uit interventievoorraden
    aan organisaties die zijn aangewezen voor de verstrekking ervan aan behoeftigen
    in de Gemeenschap'
  type: main
- language: pt
  script: Latn
  content: '88/132/CEE: Decisão da Comissão de 12 de Fevereiro de 1988 que atribui
    ao Luxemburgo uma segunda fracção das dotações a imputar ao exercício de
    1988 para o fornecimento de géneros alimentícios provenientes de existências
    de intervenção às organizações designadas para os distribuir às pessoas
    mais necessitadas na Comunidade'
  type: main
- language: es
  script: Latn
  content: '88/132/CEE: Decisión de la Comisión de 12 de febrero de 1988 por la
    que se establece la segunda asignación a Luxemburgo de parte de los recursos
    con cargo al presupuesto de 1988 para el suministro de alimentos procedentes de
    las existencias de intervención a las organizaciones encargadas de su distribución
    a las personas más necesitadas de la Comunidad'
  type: main
