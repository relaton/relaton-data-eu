title:
- language: en
  script: Latn
  content: Council Decision 2006/631/JHA of 24 July 2006 fixing the date of application
    of certain provisions of Decision 2005/211/JHA concerning the introduction of
    some new functions for the Schengen Information System, including in the fight
    against terrorism
  type: main
- language: fr
  script: Latn
  content: Décision 2006/631/JAI du Conseil du 24 juillet 2006 fixant la date d'application
    de certaines dispositions de la décision 2005/211/JAI concernant l'attribution
    de certaines fonctions nouvelles au système d'information Schengen, y compris
    dans le cadre de la lutte contre le terrorisme
  type: main
- language: de
  script: Latn
  content: Beschluss 2006/631/JI des Rates vom 24. Juli 2006 zur Festlegung des Beginns
    der Anwendung einiger Bestimmungen des Beschlusses 2005/211/JI über die Einführung
    neuer Funktionen für das Schengener Informationssystem, auch im Hinblick auf
    die Terrorismusbekämpfung
  type: main
- language: bg
  script: Cyrl
  content: Решение 2006/631/ПВР на Съвета от 24 юли 2006 година
    относно определяне на датата за прилагане
    на някои разпоредби от Решение 2005/211/ПВР относно
    въвеждането на някои нови функции за Шенгенската
    информационна система (ШИС), включително в
    борбата срещу тероризма
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Rady 2006/631/SVV ze dne 24. července 2006 , kterým se stanoví
    datum použitelnosti některých ustanovení rozhodnutí 2005/211/SVV o zavedení
    některých nových funkcí v Schengenském informačním systému, včetně boje
    proti terorismu
  type: main
- language: da
  script: Latn
  content: Rådets afgørelse 2006/631/RIA af 24. juli 2006 om fastsættelse af datoen
    for anvendelse af visse bestemmelser i afgørelse 2005/211/RIA om indførelse
    af nye funktioner i Schengen-informationssystemet, bl.a. med henblik på terrorismebekæmpelse
  type: main
- language: el
  script: Grek
  content: Απόφαση 2006/631/ΔΕΥ του Συμβουλίου, της 24ης
    Ιουλίου 2006 , που ορίζει την ημερομηνία εφαρμογής
    ορισμένων διατάξεων της απόφασης 2005/211/ΔΕΥ,
    για την εισαγωγή ορισμένων νέων λειτουργιών
    του συστήματος πληροφοριών Σένγκεν, συμπεριλαμβανομένης
    της καταπολέμησης της τρομοκρατίας
  type: main
- language: et
  script: Latn
  content: Nõukogu otsus 2006/631/JSK, 24. juuli 2006 , millega määratakse kindlaks
    otsuse 2005/211/JSK (Schengeni infosüsteemi jaoks mõnede uute, sealhulgas terrorismivastast
    võitlust käsitlevate toimingute sisseseadmise kohta) teatavate sätete kohaldamise
    kuupäev
  type: main
- language: fi
  script: Latn
  content: Neuvoston päätös 2006/631/YOS, tehty 24 päivänä heinäkuuta 2006
    , Schengenin tietojärjestelmän eräiden uusien toimintojen käyttöönottamisesta,
    myös terrorismin torjunnassa, tehdyn päätöksen 2005/211/YOS tiettyjen säännösten
    soveltamispäivän vahvistamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 2006/631/IB határozata ( 2006. július 24. ) a terrorizmus elleni
    küzdelem keretében a Schengeni Információs Rendszer egyes új funkcióinak
    bevezetéséről szóló 2005/211/IB határozat egyes rendelkezései alkalmazási
    időpontjának meghatározásáról
  type: main
- language: it
  script: Latn
  content: Decisione 2006/631/GAI del Consiglio, del 24 luglio 2006 , che stabilisce
    la data di applicazione di talune disposizioni della decisione 2005/211/GAI relativa
    all’introduzione di alcune nuove funzioni del sistema d’informazione Schengen,
    anche nel quadro della lotta contro il terrorismo
  type: main
- language: lv
  script: Latn
  content: Padomes Lēmums 2006/631/TI ( 2006. gada 24. jūlijs ), ar ko nosaka piemērošanas
    dienu dažiem noteikumiem Lēmumā 2005/211/TI par dažu jaunu funkciju ieviešanu
    Šengenas Informācijas sistēmā, tostarp attiecībā uz terorisma apkarošanu
  type: main
- language: lt
  script: Latn
  content: 2006 m. liepos 24 d. Tarybos sprendimas 2006/631/TVR, nustatantis Sprendimo
