    nustatymo, įskaitant kovos su terorizmu srityje, tam tikrų nuostatų taikymo
    datą
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni tal-Kunsill 2006/631/ĠAI ta' l- 24 ta' Lulju 2006 li tistipula
    d-data ta' applikazzjoni ta' ċerti dispożizzjonijiet tad-Deċiżjoni 2005/211/ĠAI
    dwar l-introduzzjoni ta' xi funzjonijiet ġodda għas-Sistema ta' Informazzjoni
    ta' Schengen, anke fil-ġlieda kontra t-terroriżmu
  type: main
- language: nl
  script: Latn
  content: Besluit 2006/631/JBZ van de Raad van 24 juli 2006 tot vaststelling van
    de datum voor de toepassing van sommige bepalingen van Besluit 2005/211/JBZ betreffende
    de invoering van enkele nieuwe functies in het Schengeninformatiesysteem, inclusief
    bij de bestrijding van terrorisme
  type: main
- language: pl
  script: Latn
  content: Decyzja Rady 2006/631/WSiSW z dnia 24 lipca 2006 r. ustalająca datę rozpoczęcia
    stosowania niektórych przepisów decyzji 2005/211/WSiSW dotyczącej wprowadzenia
    kilku nowych funkcji do Systemu Informacyjnego Schengen, w tym związanych z walką
    z terroryzmem
  type: main
- language: pt
  script: Latn
  content: Decisão 2006/631/JAI do Conselho, de 24 de Julho de 2006 , que fixa a
    data de aplicação de determinadas disposições da Decisão 2005/211/JAI relativa
    à introdução de novas funções no Sistema de Informação de Schengen, incluindo
    a luta contra o terrorismo
  type: main
- language: ro
  script: Latn
  content: Decizia 2006/631/JAI a Consiliului din 24 iulie 2006 de stabilire a datei
    de aplicare a anumitor dispoziții ale Deciziei 2005/211/JAI privind introducerea
    unor noi funcții ale Sistemului de informații Schengen, inclusiv în combaterea
    terorismului
  type: main
- language: sk
  script: Latn
  content: Rozhodnutie Rady 2006/631/SVV z 24. júla 2006 , ktorým sa stanovuje dátum
    uplatňovania niektorých ustanovení rozhodnutia 2005/211/SVV o zavedení niektorých
    nových funkcií pre Schengenský informačný systém vrátane boja proti terorizmu
  type: main
- language: sl
  script: Latn
  content: Sklep Sveta 2006/631/PNZ z dne 24. julija 2006 o določitvi datuma začetka
    učinkovanja nekaterih določb Sklepa 2005/211/PNZ o uvedbi nekaterih novih funkcij
    za schengenski informacijski sistem, vključno v zvezi z bojem proti terorizmu
  type: main
- language: es
  script: Latn
  content: Decisión 2006/631/JAI del Consejo, de 24 de julio de 2006 , por la que
    se fija la fecha de aplicación de determinadas disposiciones de la Decisión
    2005/211/JAI, relativa a la introducción de nuevas funciones para el Sistema
    de Información de Schengen, inclusive en materia de lucha contra el terrorismo
  type: main
- language: sv
  script: Latn
  content: Rådets beslut 2006/631/RIF av den 24 juli 2006 om fastställande av datum
