title:
- language: en
  script: Latn
  content: Regulation (EC) No 661/2009 of the European Parliament and of the Council
    of 13 July 2009 concerning type-approval requirements for the general safety of
    motor vehicles, their trailers and systems, components and separate technical
    units intended therefor
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 661/2009 du Parlement européen et du Conseil du 13
    juillet 2009 concernant les prescriptions pour l’homologation relatives à la
    sécurité générale des véhicules à moteur, de leurs remorques et des systèmes,
    composants et entités techniques distinctes qui leur sont destinés
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 661/2009 des Europäischen Parlaments und des Rates
    vom 13. Juli 2009 über die Typgenehmigung von Kraftfahrzeugen, Kraftfahrzeuganhängern
    und von Systemen, Bauteilen und selbstständigen technischen Einheiten für diese
    Fahrzeuge hinsichtlich ihrer allgemeinen Sicherheit
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 661/2009 на Европейския парламент
    и на Съвета от 13 юли 2009 година относно изискванията
    за одобрение на типа по отношение на общата
    безопасност на моторните превозни средства,
    техните ремаркета и системи, компоненти и отделни
    технически възли, предназначени за тях
  type: main
- language: cs
  script: Latn
  content: Nařízení Evropského parlamentu a Rady (ES) č. 661/2009 ze dne 13.
    července 2009 o požadavcích pro schvalování typu motorových vozidel, jejich
    přípojných vozidel a systémů, konstrukčních částí a samostatných technických
    celků určených pro tato vozidla z hlediska obecné bezpečnosti
  type: main
- language: da
  script: Latn
  content: Europa-Parlamentets og Rådets forordning (EF) nr. 661/2009 af 13. juli
    2009 om krav til typegodkendelse for den generelle sikkerhed af motorkøretøjer,
    påhængskøretøjer dertil samt systemer, komponenter og separate tekniske enheder
    til sådanne køretøjer
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 661/2009 του Ευρωπαϊκού
    Κοινοβουλίου και του Συμβουλίου, της 13ης Ιουλίου
    2009 , για τις απαιτήσεις έγκρισης τύπου και γενικής
    ασφαλείας των μηχανοκίνητων οχημάτων και των
    ρυμουλκουμένων τους, και των συστημάτων, κατασκευαστικών
    στοιχείων και χωριστών τεχνικών μονάδων που
    προορίζονται για τα οχήματα αυτά
  type: main
- language: et
  script: Latn
  content: Euroopa Parlamendi ja nõukogu määrus (EÜ) nr 661/2009, 13. juuli 2009
    , mis käsitleb mootorsõidukite, nende haagiste ning nende jaoks ette nähtud
    süsteemide, osade ja eraldi tehniliste seadmestike üldise ohutusega seotud tüübikinnituse
    nõudeid
  type: main
- language: fi
  script: Latn
  content: Euroopan parlamentin ja neuvoston asetus (EY) N:o 661/2009, annettu 13
    päivänä heinäkuuta 2009 moottoriajoneuvojen, niiden perävaunujen sekä niihin
    tarkoitettujen järjestelmien, osien ja erillisten teknisten yksiköiden yleiseen
    turvallisuuteen liittyvistä tyyppihyväksyntävaatimuksista
  type: main
- language: ga
  script: Latn
  content: Rialachán (CE) Uimh. 661/2009 ó Pharlaimint na hEorpa agus ón gComhairle
    an 13 Iúil 2009 maidir leis na ceanglais i gcomhair cineál-cheadaithe le haghaidh
    sábháilteachta ginearálta mótarfheithiclí, a leantóiri agus a gcóras, a
    gcomhpháirteanna agus a n-aonad teicniúil ar leithligh atá beartaithe dóibh
  type: main
- language: hr
  script: Latn
  content: Uredba (EZ) br. 661/2009 Europskog parlamenta i Vijeća od 13. srpnja 2009.
    o zahtjevima za homologaciju tipa za opću sigurnost motornih vozila, njihovih
    prikolica i sustava, sastavnih dijelova i zasebnih tehničkih jedinica namijenjenih
    za takva vozila
  type: main
- language: hu
  script: Latn
  content: Az Európai Parlament és a Tanács 661/2009/EK rendelete ( 2009. július
    13. ) a gépjárművek, az ezekhez tervezett pótkocsik és rendszerek, alkatrészek
    valamint önálló műszaki egységek általános biztonságára vonatkozó típus-jóváhagyási
    előírásokról
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 661/2009 del Parlamento europeo e del Consiglio, del
    13 luglio 2009 , sui requisiti dell’omologazione per la sicurezza generale dei
    veicoli a motore, dei loro rimorchi e sistemi, componenti ed entità tecniche
    ad essi destinati
  type: main
- language: lv
  script: Latn
  content: Eiropas Parlamenta un Padomes Regula (EK) Nr. 661/2009 ( 2009. gada 13.
    jūlijs ) par tipa apstiprināšanas prasībām attiecībā uz mehānisko transportlīdzekļu,
    to piekabju un tiem paredzēto sistēmu, sastāvdaļu un atsevišķu tehnisko
    vienību vispārējo drošību
  type: main
- language: lt
  script: Latn
  content: 2009 m. liepos 13 d. Europos Parlamento ir Tarybos reglamentas (EB) Nr.
    661/2009 dėl variklinių transporto priemonių, jų priekabų ir joms skirtų
    sistemų, sudėtinių dalių bei atskirų techninių mazgų tipo patvirtinimo,
    atsižvelgiant į jų bendrąją saugą, reikalavimų
  type: main
- language: mt
  script: Latn
  content: Regolament (KE) Nru 661/2009 tal-Parlament Ewropew u tal-Kunsill tat- 13
    ta’ Lulju 2009 dwar rekwiżiti għall-approvazzjoni tat-tip għas-sikurezza
    ġenerali tal-vetturi bil-mutur, it-trejlers tagħhom, u s-sistemi, il-komponenti
    u l-unitajiet tekniċi separati destinati għalihom
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 661/2009 van het Europees Parlement en de Raad van
    13 juli 2009 betreffende typegoedkeuringsvoorschriften voor de algemene veiligheid
    van motorvoertuigen, aanhangwagens daarvan en daarvoor bestemde systemen, onderdelen
    en technische eenheden
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Parlamentu Europejskiego i Rady (WE) nr 661/2009 z dnia
    13 lipca 2009 r. w sprawie wymagań technicznych w zakresie homologacji typu pojazdów
    silnikowych dotyczących ich bezpieczeństwa ogólnego, ich przyczep oraz przeznaczonych
    dla nich układów, części i oddzielnych zespołów technicznych
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n. o 661/2009 do Parlamento Europeu e do Conselho, de
    13 de Julho de 2009 , relativo às prescrições para homologação no que se
    refere à segurança geral dos veículos a motor, seus reboques e sistemas, componentes
    e unidades técnicas a eles destinados
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 661/2009 al Parlamentului European și al Consiliului
    din 13 iulie 2009 privind cerințele de omologare de tip pentru siguranța generală
    a autovehiculelor, a remorcilor acestora, precum și a sistemelor, componentelor
    și unităților tehnice separate care le sunt destinate
  type: main
- language: sk
  script: Latn
  content: Nariadenie Európskeho parlamentu a Rady (ES) č. 661/2009 z 13. júla
    2009 o požiadavkách typového schvaľovania na všeobecnú bezpečnosť motorových
    vozidiel, ich prípojných vozidiel a systémov, komponentov a samostatných technických
    jednotiek určených pre tieto vozidlá
  type: main
- language: sl
  script: Latn
  content: Uredba (ES) št. 661/2009 Evropskega parlamenta in Sveta z dne 13. julija
    2009 o zahtevah za homologacijo za splošno varnost motornih vozil, njihovih priklopnikov
    ter sistemov, sestavnih delov in samostojnih tehničnih enot, namenjenih za taka
    vozila
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n o 661/2009 del Parlamento Europeo y del Consejo, de 13
    de julio de 2009 , relativo a los requisitos de homologación de tipo referentes
    a la seguridad general de los vehículos de motor, sus remolques y sistemas, componentes
    y unidades técnicas independientes a ellos destinados
  type: main
- language: sv
  script: Latn
  content: Europaparlamentets och rådets förordning (EG) nr 661/2009 av den 13 juli
    2009 om krav för typgodkännande av allmän säkerhet hos motorfordon och deras
    släpvagnar samt av de system, komponenter och separata tekniska enheter som är
    avsedda för dem
  type: main
