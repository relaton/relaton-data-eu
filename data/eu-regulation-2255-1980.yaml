  content: Commission Regulation (EEC) No 2255/80 of 28 August 1980 laying down detailed
    rules implementing the system of aid for the use of grapes, grape must and concentrated
    grape must for the manufacture of grape juice and fixing the amounts of aid for
    the 1980/81 wine-growing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2255/80 de la Commission, du 28 août 1980, portant
