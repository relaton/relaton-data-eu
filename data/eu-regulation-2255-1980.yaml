    Traubenmost zur Herstellung von Traubensaft und zur Festsetzung des Beihilfebetrags
    für das Weinwirtschaftsjahr 1980/81
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2255/80 af 28. august 1980 om gennemførelsesbestemmelserne
