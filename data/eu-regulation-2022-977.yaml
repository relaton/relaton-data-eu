    heaks kaks uue eksportiva tootja režiimi taotlust seoses Hiina Rahvavabariigist
    pärit eriti tugeva polüesterlõnga impordi suhtes kehtestatud lõplike dumpinguvastaste
    meetmetega pärast Euroopa Parlamendi ja nõukogu määruse (EL) 2016/1036 artikli
    11 lõike 2 kohast aegumise läbivaatamist ning muudetakse komisjoni rakendusmäärust
    (EL) 2017/325
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanoasetus (EU) 2022/977, annettu 22 päivänä
    kesäkuuta 2022, kahden uuden vientiä harjoittavan tuottajan kohtelua koskevan
    pyynnön hyväksymisestä siltä osin kuin kyseessä ovat Kiinan kansantasavallasta
    peräisin olevan erikoislujan polyesterilangan tuonnissa Euroopan parlamentin
    ja neuvoston asetuksen (EU) 2016/1036 11 artiklan 2 kohdan mukaisen toimenpiteiden
    voimassaolon päättymistä koskevan tarkastelun jälkeen käyttöön otetut lopulliset
    polkumyyntitoimenpiteet ja komission täytäntöönpanoasetuksen (EU) 2017/325
    muuttamisesta
  type: main
- language: ga
  script: Latn
  content: Rialachán Cur Chun Feidhme (AE) 2022/977 ón gCoimisiún an 22 Meitheamh
    2022 lena nglactar le dhá iarraidh ar stádas táirgeora onnmhairiúcháin nua
    i ndáil leis na bearta cinntitheacha frithdhumpála arna bhforchur ar snáthanna
    ardrighnis as poileistir de thionscnamh Dhaon-Phoblacht na Síne a allmhairiú
    tar éis athbhreithniú éaga a bheith déanta de bhun Airteagal 11(2) de Rialachán
    (AE) 2016/1036 ó Pharlaimint na hEorpa agus ón gComhairle agus lena leasaítear
    Rialachán Cur Chun Feidhme (AE) 2017/325 ón gCoimisiún
  type: main
- language: hr
  script: Latn
  content: Provedbena uredba Komisije (EU) 2022/977 оd 22. lipnja 2022. o prihvaćanju
    dvaju zahtjeva za tretman novog proizvođača izvoznika u pogledu konačnih antidampinških
    mjera uvedenih na uvoz pređe visoke čvrstoće od poliestera podrijetlom iz Narodne
    Republike Kine nakon revizije zbog predstojećeg isteka mjera na temelju članka
    11. stavka 2. Uredbe (EU) 2016/1036 Europskog parlamenta i Vijeća i o izmjeni
    Provedbene uredbe Komisije (EU) 2017/325
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/977 végrehajtási rendelete (2022. június 22.)
    az (EU) 2016/1036 európai parlamenti és tanácsi rendelet 11. cikkének (2)
    bekezdése szerinti hatályvesztési felülvizsgálatot követően a Kínai Népköztársaságból
    származó nagy szakítószilárdságú poliészterfonalak behozatalára vonatkozó
    végleges dömpingellenes intézkedések tekintetében két, új exportáló gyártóként
    való figyelembevétel iránti kérelem elfogadásáról, valamint az (EU) 2017/325
    bizottsági végrehajtási rendelet módosításáról
  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) 2022/977 della Commissione del 22 giugno
    2022 relativo all’accettazione di due richieste di applicazione del trattamento
    riservato ai nuovi produttori esportatori per quanto concerne le misure antidumping
    definitive istituite sulle importazioni di filati di poliestere ad alta tenacità
    originari della Repubblica popolare cinese in seguito a un riesame in previsione
    della scadenza a norma dell’articolo 11, paragrafo 2, del regolamento (UE) 2016/1036
    del Parlamento europeo e del Consiglio e che modifica il regolamento di esecuzione
    (UE) 2017/325 della Commissione
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) 2022/977 (2022. gada 22. jūnijs),
    ar ko pieņem divus jauna ražotāja eksportētāja režīma pieprasījumus attiecībā
    uz galīgajiem antidempinga pasākumiem, kuri pēc termiņbeigu pārskatīšanas,
    kas veikta, ievērojot Eiropas Parlamenta un Padomes Regulas (ES) 2016/1036 11.
    panta 2. punktu, noteikti Ķīnas Tautas Republikas izcelsmes augstas stiprības
    poliestera pavedienu importam, un ar ko groza Komisijas Īstenošanas regulu (ES)
    2017/325
  type: main
