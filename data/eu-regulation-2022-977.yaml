id: EURegulation2022977
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2022/977 of 22 June 2022 accepting
    two requests for new exporting producer treatment with regard to the definitive
    anti-dumping measures imposed on imports of high tenacity yarns of polyesters
    originating in the People’s Republic of China following an expiry review pursuant
    to Article 11(2) of Regulation (EU) 2016/1036 of the European Parliament and of
    the Council and amending Commission Implementing Regulation (EU) 2017/325
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2022/977 de la Commission du 22 juin 2022
    acceptant deux demandes de statut de nouveau producteur-exportateur en ce qui
    concerne les mesures anti-dumping définitives instituées sur les importations
    de fils de polyesters à haute ténacité originaires de la République populaire
    de Chine à l’issue d’un réexamen au titre de l’expiration des mesures
    effectué en vertu de l’article 11, paragraphe 2, du règlement (UE) 2016/1036
    du Parlement européen et du Conseil et modifiant le règlement d’exécution
    (UE) 2017/325 de la Commission
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2022/977 der Kommission vom 22. Juni 2022
    zur Annahme zweier Anträge auf Behandlung als neuer ausführender Hersteller
    im Zusammenhang mit den endgültigen Antidumpingmaßnahmen gegenüber den Einfuhren
    hochfester Garne aus Polyestern mit Ursprung in der Volksrepublik China im Anschluss
    an eine Auslaufüberprüfung nach Artikel 11 Absatz 2 der Verordnung (EU) 2016/1036
    des Europäischen Parlaments und des Rates und zur Änderung der Durchführungsverordnung
    (EU) 2017/325 der Kommission
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2022/977 на Комисията
    от 22 юни 2022 година за приемане на две искания
    за статут на нов производител износител във
    връзка с окончателните антидъмпингови мерки,
    наложени върху вноса на прежди с висока здравина
    от полиестери с произход от Китайската народна
    република след провеждане на преглед с оглед
    изтичане на срока на действие на мерките в
    съответствие с член 11, параграф 2 от Регламент
    (ЕС) 2016/1036 на Европейския парламент и на Съвета,
    и за изменение на Регламент за изпълнение (ЕС)
    2017/325 на Комисията
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2022/977 ze dne 22. června 2022,
    kterým se přijímají dvě žádosti o udělení statusu nového vyvážejícího
    výrobce s ohledem na konečná antidumpingová opatření uložená na dovoz
    vysokopevnostních nití z polyesterů pocházejících z Čínské lidové republiky
    na základě přezkumu před pozbytím platnosti podle čl. 11 odst. 2 nařízení
    Evropského parlamentu a Rady (EU) 2016/1036 a kterým se mění prováděcí
    nařízení Komise (EU) 2017/325
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesforordning (EU) 2022/977 af 22. juni 2022
    om accept af to anmodninger om behandling som ny eksporterende producent i forbindelse
    med de endelige antidumpingforanstaltninger, der blev indført på importen af
    garn med høj styrke af polyestere med oprindelse i Folkerepublikken Kina efter
    en udløbsundersøgelse i henhold til artikel 11, stk. 2, i Europa-Parlamentets
    og Rådets forordning (EU) 2016/1036 og om ændring af Kommissionens gennemførelsesforordning
    (EU) 2017/325
  type: main
- language: el
  script: Grek
