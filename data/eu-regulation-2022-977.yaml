    d. kuriuo tenkinami du prašymai suteikti naujojo eksportuojančio gamintojo statusą
    taikant importuojamiems Kinijos Liaudies Respublikos kilmės labai atspariems
    tempimui poliesterių siūlams galutines antidempingo priemones, nustatytas atlikus
    priemonių galiojimo termino peržiūrą pagal Europos Parlamento ir Tarybos reglamento
    (ES) 2016/1036 11 straipsnio 2 dalį, ir kuriuo iš dalies keičiamas Komisijos
    įgyvendinimo reglamentas (ES) 2017/325
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/977 tat-22
    ta’ Ġunju 2022 li jaċċetta żewġ talbiet għal trattament ta’ produttur
    esportatur ġdid fir-rigward tal-miżuri anti-dumping definittivi imposti fuq
    l-importazzjonijiet ta’ ħjut tal-poliesteri ta’ tenaċità għolja li joriġinaw
    mir-Repubblika tal-Poplu taċ-Ċina wara rieżami ta’ skadenza skont l-Artikolu
    11(2) tar-Regolament (UE) 2016/1036 tal-Parlament Ewropew u tal-Kunsill u li jemenda
    r-Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2017/325
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2022/977 van de Commissie van 22 juni 2022
    tot aanvaarding van twee verzoeken om behandeling als nieuwe producent-exporteur
    met betrekking tot de definitieve antidumpingmaatregelen die zijn ingesteld ten
    aanzien van de invoer van garens met een hoge sterktegraad van polyesters van
    oorsprong uit de Volksrepubliek China naar aanleiding van een nieuw onderzoek
    in verband met het vervallen van de maatregelen op grond van artikel 11, lid 2,
    van Verordening (EU) 2016/1036 van het Europees Parlement en de Raad, en tot wijziging
    van Uitvoeringsverordening (EU) 2017/325 van de Commissie
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) 2022/977 z dnia 22 czerwca 2022
    r. w sprawie przyjęcia dwóch wniosków o przyznanie statusu nowego producenta
    eksportującego w odniesieniu do ostatecznych środków antydumpingowych wprowadzonych
    wobec przywozu przędzy o dużej wytrzymałości na rozciąganie, z poliestrów,
    pochodzącej z Chińskiej Republiki Ludowej w następstwie przeglądu wygaśnięcia
    zgodnie z art. 11 ust. 2 rozporządzenia Parlamentu Europejskiego i Rady (UE)
    2016/1036 oraz w sprawie zmiany rozporządzenia wykonawczego Komisji (UE) 2017/325
  type: main
- language: pt
  script: Latn
  content: Regulamento de Execução (UE) 2022/977 da Comissão de 22 de junho de
    2022 que aceita dois pedidos de tratamento de novo produtor-exportador no que
    diz respeito às medidas anti-dumping definitivas instituídas sobre as importações
    de fios de alta tenacidade, de poliésteres, originários da República Popular
    da China, na sequência de um reexame da caducidade nos termos do artigo 11.o,
    n.o 2, do Regulamento (UE) 2016/1036 do Parlamento Europeu e do Conselho e que
    altera o Regulamento de Execução (UE) 2017/325 da Comissão
  type: main
- language: ro
  script: Latn
  content: Regulamentul de punere în aplicare (UE) 2022/977 al Comisiei din 22 iunie
    2022 de acceptare a două cereri de acordare a tratamentului de nou producător-exportator
    cu privire la măsurile antidumping definitive instituite la importurile de fire
    de mare rezistență din poliester originare din Republica Populară Chineză
    în urma unei reexaminări efectuate în perspectiva expirării măsurilor în
    conformitate cu articolul 11 alineatul (2) din Regulamentul (UE) 2016/1036 al
    Parlamentului European și al Consiliului și de modificare a Regulamentului de
    punere în aplicare (UE) 2017/325 al Comisiei
  type: main
- language: sk
  script: Latn
  content: Vykonávacie nariadenie Komisie (EÚ) 2022/977 z 22. júna 2022, ktorým
    sa prijímajú dve žiadosti o udelenie štatútu nového vyvážajúceho výrobcu,
    pokiaľ ide o konečné antidumpingové opatrenia uložené na dovoz vysokopevnostnej
    priadze z polyesterov s pôvodom v Čínskej ľudovej republike na základe revízneho
    prešetrovania pred uplynutím platnosti podľa článku 11 ods. 2 nariadenia
    Európskeho parlamentu a Rady (EÚ) 2016/1036, a ktorým sa mení vykonávacie
    nariadenie Komisie (EÚ) 2017/325
  type: main
- language: sl
  script: Latn
  content: Izvedbena uredba Komisije (EU) 2022/977 z dne 22. junija 2022 o sprejetju
    dveh zahtevkov za obravnavo novega proizvajalca izvoznika v zvezi z dokončnimi
    protidampinškimi ukrepi, uvedenimi na uvoz preje visoke trdnosti iz poliestra
    s poreklom iz Ljudske republike Kitajske po pregledu zaradi izteka ukrepov v skladu
    s členom 11(2) Uredbe (EU) 2016/1036 Evropskega parlamenta in Sveta ter o spremembi
    Izvedbene uredbe Komisije (EU) 2017/325
  type: main
- language: es
  script: Latn
  content: Reglamento de Ejecución (UE) 2022/977 de la Comisión de 22 de junio de
    2022 por el que se aceptan dos solicitudes de trato de nuevo productor exportador
    con respecto a las medidas antidumping definitivas impuestas sobre las importaciones
    de hilados de alta tenacidad de poliésteres originarios de la República Popular
    China tras una reconsideración por expiración en virtud del artículo 11, apartado
    2, del Reglamento (UE) 2016/1036 del Parlamento Europeo y del Consejo, y por el
    que se modifica el Reglamento de Ejecución (UE) 2017/325 de la Comisión
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandeförordning (EU) 2022/977 av den 22 juni 2022
    om godtagande av två ansökningar om status som ny exporterande tillverkare med
    avseende på de slutgiltiga antidumpningsåtgärder som införts på import av
    högstyrkegarn av polyestrar med ursprung i Folkrepubliken Kina efter en översyn
    vid giltighetstidens utgång i enlighet med artikel 11.2 i Europaparlamentets
    och rådets förordning (EU) 2016/1036, och om ändring av kommissionens genomförandeförordning
    (EU) 2017/325
