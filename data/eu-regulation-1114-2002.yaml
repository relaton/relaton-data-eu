    Festsetzung des Umfangs für die im Juni 2002 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Erzeugnisse im Sektor Schweinefleisch für den Zeitraum vom 1.
    Juli bis zum 30. September 2002
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1114/2002 af 26. juni 2002 om fastsættelse
