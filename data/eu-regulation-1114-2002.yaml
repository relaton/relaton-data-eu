title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1114/2002 of 26 June 2002 determining the
    extent to which applications lodged in June 2002 for import licences under the
    regime provided for by tariff quotas for certain products in the pigmeat sector
    for the period 1 July to 30 September 2002 can be accepted
  type: main
- language: fr
  script: Latn
