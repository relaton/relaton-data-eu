    tuontitariffikiintiöiden avaamista ja hallintaa sianliha-alalla tiettyjen tuotteiden
    osalta 1 päivän heinäkuuta ja 30 päivän syyskuuta 2002 välisellä kaudella
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1114/2002 della Commissione, del 26 giugno 2002, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di giugno 2002 nel quadro dei contingenti tariffari d'importazione
    per taluni prodotti del settore delle carni suine per il periodo dal 1° luglio
    al 30 settembre 2002
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1114/2002 van de Commissie van 26 juni 2002 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten,
    die in juni 2002 worden ingediend op grond van de tariefcontingenten voor de invoer
    van bepaalde producten in de varkensvleessector voor de periode van 1 juli tot
    en met 30 september 2002
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1114/2002 da Comissão, de 26 de Junho de 2002, que
