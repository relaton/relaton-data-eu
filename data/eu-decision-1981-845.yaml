    wird, daß das Gerät ,,PACKARD- 2425 Tri-Carb Spectrometer with teleprinter"
    nicht unter Befreiung von den Zöllen des Gemeinsamen Zolltarifs eingeführt werden
    kann'
  type: main
- language: da
  script: Latn
  content: '81/845/EØF: Kommissionens beslutning af 8. oktober 1981 om fastslåelse
