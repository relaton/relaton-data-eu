  content: '81/845/EEC: Commission Decision of 8 October 1981 establishing that the
    apparatus described as ''Packard- 2425 tri-carb spectrometer with teleprinter''
    may not be imported free of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '81/845/CEE: Décision de la Commission, du 8 octobre 1981, constatant
    que l''importation de l''appareil dénommé "Packard 2425 tri-carb spectrometer
    with teleprinter" ne peut être faite en franchise des droits du tarif douanier
    commun'
  type: main
