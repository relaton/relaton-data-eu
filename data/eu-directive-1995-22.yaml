    przy wprowadzaniu na rynek zwierząt i produktów akwakultury
  type: main
- language: pt
  script: Latn
  content: Directiva 95/22/CE do Conselho, de 22 de Junho de 1995, que altera a Directiva
    91/67/CEE relativa às condições de polícia sanitária que regem a introdução
    no mercado de animais e produtos da aquicultura
  type: main
- language: ro
  script: Latn
  content: Directiva 95/22/CE a Consiliului din 22 iunie 1995 de modificare a Directivei
    91/67/CEE privind condițiile de sănătate animală care reglementează introducerea
    pe piață a animalelor și a produselor de acvacultură
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 95/22/ES z 22. júna 1995, ktorou sa mení a dopĺňa smernica
    91/67/EHS o veterinárnych podmienkach, ktoré upravujú uvádzanie živočíchov
    a produktov akvakultúry na trh
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 95/22/ES z dne 22. junija 1995 o spremembi Direktive 91/67/EGS
