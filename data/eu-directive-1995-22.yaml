  script: Latn
  content: Council Directive 95/22/EC of 22 June 1995 amending Directive 91/67/EEC
    concerning the animal health conditions governing the placing on the market of
    aquaculture animals and products
  type: main
- language: fr
  script: Latn
  content: Directive 95/22/CE du Conseil, du 22 juin 1995, modifiant la directive
    91/67/CE relative aux conditions de police sanitaire régissant la mise sur le
    marché d'animaux et de produits d'aquaculture
  type: main
- language: de
  script: Latn
  content: Richtlinie 95/22/EG des Rates vom 22. Juni 1995 zur Änderung der Richtlinie
    91/67/EWG betreffend die tierseuchenrechtlichen Vorschriften für die Vermarktung
    von Tieren und anderen Erzeugnissen der Aquakultur
  type: main
- language: bg
  script: Cyrl
  content: Директива 95/22/ЕО на Съвета от 22 юни 1995 година
