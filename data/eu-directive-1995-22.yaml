  type: main
- language: el
  script: Grek
  content: Οδηγία 95/22/ΕΚ του Συμβουλίου της 22ας Ιουνίου
    1995 που τροποποιεί την οδηγία 91/67/ΕΟΚ σχετικά
    με τους όρους υγειονομικού ελέγχου που διέπουν
    τη διάθεση στην αγορά ζώων και προϊόντων υδατοκαλλιέργειας
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 95/22/EÜ, 22. juuni 1995, millega muudetakse direktiivi
