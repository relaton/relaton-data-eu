title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1122/2009 of 30 November 2009 laying down
    detailed rules for the implementation of Council Regulation (EC) No 73/2009 as
    regards cross-compliance, modulation and the integrated administration and control
    system, under the direct support schemes for farmers provided for that Regulation,
    as well as for the implementation of Council Regulation (EC) No 1234/2007 as regards
    cross-compliance under the support scheme provided for the wine sector
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1122/2009 de la Commission du 30 novembre 2009 fixant
    les modalités d’application du règlement (CE) n o 73/2009 du Conseil en ce
    qui concerne la conditionnalité, la modulation et le système intégré de gestion
    et de contrôle dans le cadre des régimes de soutien direct en faveur des agriculteurs
    prévus par ce règlement ainsi que les modalités d’application du règlement
    (CE) n o 1234/2007 du Conseil en ce qui concerne la conditionnalité dans le cadre
    du régime d’aide prévu pour le secteur vitivinicole
  type: main
- language: de
  script: Latn
