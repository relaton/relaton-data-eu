---
id: EUDecision2015216
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2015/216 of 10 February 2015 amending
    Decision 2000/572/EC as regards the reference to the Harmonised System (HS) in
    the model certificate for meat preparations and amending Decision 2007/777/EC
    as regards the entry for Israel in the list of third countries or parts thereof
    from which the introduction of meat products and treated stomachs, bladders and
    intestines into the Union is authorised (notified under document C(2015) 438)
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2015/216 de la Commission du 10 février 2015
    modifiant la décision 2000/572/CE en ce qui concerne la référence au système
    harmonisé (SH) dans le modèle de certificat pour les préparations de viandes,
    et modifiant la décision 2007/777/CE en ce qui concerne l'inscription relative
    à Israël sur la liste des pays tiers ou parties de pays tiers en provenance
    desquels l'introduction dans l'Union européenne de produits à base de viande
    et d'estomacs, vessies et boyaux traités est autorisée [notifiée sous le numéro
    C(2015) 438]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2015/216 der Kommission vom 10. Februar 2015
    zur Änderung der Entscheidung 2000/572/EG hinsichtlich der Bezugnahme auf das
    Harmonisierte System (HS) in der Musterbescheinigung für Fleischzubereitungen
    sowie zur Änderung der Entscheidung 2007/777/EG hinsichtlich des Eintrags für
    Israel in der Liste der Drittländer bzw. Teile von Drittländern, aus denen die
    Einfuhr von Fleischerzeugnissen sowie behandelten Mägen, Blasen und Därmen in
    die Union gestattet ist (Bekanntgegeben unter Aktenzeichen C(2015) 438)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2015/216 на Комисията
    от 10 февруари 2015 година за изменение на Решение
    2000/572/ЕО по отношение на позоваването на Хармонизираната
    система (ХС) в образеца на сертификат за месни
    заготовки и за изменение на Решение 2007/777/ЕО
    по отношение на вписването на Израел в списъка
    с трети държави или части от тях, от които е
    разрешено въвеждането в ЕС на месни продукти
    и обработени стомаси, пикочни мехури и черва
    (нотифицирано под номер С(2015) 438)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2015/216 ze dne 10. února 2015 ,
    kterým se mění rozhodnutí 2000/572/ES, pokud jde o odkaz na harmonizovaný
    systém (HS) ve vzorovém osvědčení pro masné polotovary, a kterým se mění
    rozhodnutí 2007/777/ES, pokud jde o položku týkající se Izraele na seznamu
    třetích zemí nebo jejich částí, z nichž je do Unie povolen dovoz masných
    výrobků a opracovaných žaludků, močových měchýřů a střev (oznámeno
    pod číslem C(2015) 438)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2015/216 af 10. februar 2015
    om ændring af beslutning 2000/572/EF for så vidt angår henvisningen til det
    harmoniserede system (HS) i standardcertifikatet for tilberedt kød og om ændring
    af beslutning 2007/777/EF for så vidt angår oplysningerne om Israel på listen
    over tredjelande eller dele af tredjelande, hvorfra det er tilladt at indføre
    kødprodukter og behandlede maver, blærer og tarme til Unionen (meddelt under
    nummer C(2015) 438)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2015/216 της Επιτροπής,
    της 10ης Φεβρουαρίου 2015 , για την τροποποίηση
    της απόφασης 2000/572/ΕΚ όσον αφορά την αναφορά
    στο Εναρμονισμένο Σύστημα (ΕΣ) στο υπόδειγμα
    πιστοποιητικού για τα παρασκευάσματα κρέατος
    και για την τροποποίηση της απόφασης 2007/777/ΕΚ
    όσον αφορά την εγγραφή του Ισραήλ στον κατάλογο
    τρίτων χωρών ή μερών τους απ' όπου επιτρέπεται
    η είσοδος προϊόντων με βάση το κρέας και επεξεργασμένων
    στομαχιών, ουροδόχων κύστεων και εντέρων [κοινοποιηθείσα
    υπό τον αριθμό C(2015) 438]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2015/216, 10. veebruar 2015 , millega muudetakse
    otsust 2000/572/EÜ seoses viitega harmoneeritud süsteemile (HS) lihavalmististe
    näidissertifikaatides ja millega muudetakse otsust 2007/777/EÜ seoses Iisraeli
    käsitleva kandega selliste kolmandate riikide ja nende osade loetelus, kust on
    lubatud liitu importida lihatooteid ning töödeldud magusid, põisi ja sooli
    (teatavaks tehtud numbri C(2015) 438 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2015/216, annettu 10 päivänä
    helmikuuta 2015 , päätöksen 2000/572/EY muuttamisesta siltä osin kuin on kyse
    viittauksesta harmonoituun järjestelmään raakalihavalmisteiden todistusmallissa
    sekä päätöksen 2007/777/EY muuttamisesta siltä osin kuin on kyse Israelia
    koskevasta merkinnästä luettelossa kolmansista maista tai niiden osista, joista
    lihavalmisteiden sekä käsiteltyjen mahojen, rakkojen ja suolten tuonti unionin
    alueelle on sallittua (tiedoksiannettu numerolla C(2015) 438)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2015/216 оd 10. veljače 2015. o izmjeni
    Odluke 2000/572/EZ u pogledu upućivanja na Harmonizirani sustav (HS) u obrascu
    certifikata za mesne pripravke i o izmjeni Odluke 2007/777/EZ u pogledu unosa
    za Izrael na popisu trećih zemalja ili dijelova trećih zemalja iz kojih je odobren
    uvoz mesnih proizvoda i obrađenih želudaca, mjehura i crijeva u Uniju (priopćeno
    pod brojem dokumenta C(2015) 438)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2015/216 végrehajtási határozata ( 2015. február
    10. ) a 2000/572/EK határozatnak az előkészített hús bizonyítványmintáiban
    a Harmonizált Rendszerre (HR) való hivatkozás tekintetében történő módosításáról,
    és a 2007/777/EK határozatnak a húskészítmények, kezelt gyomor, hólyag
    és belek Unióba történő behozatalára engedélyezett harmadik országok vagy
    azok részei jegyzékében az Izraelre vonatkozó bejegyzés tekintetében történő
    módosításáról (az értesítés a C(2015) 438. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2015/216 della Commissione, del 10 febbraio
    2015 , che modifica la decisione 2000/572/CE per quanto riguarda il riferimento
    al sistema armonizzato (SA) nel modello di certificato per le preparazioni di
    carni e che modifica la decisione 2007/777/CE per quanto riguarda la voce relativa
    a Israele nell'elenco dei paesi terzi o parti dei paesi terzi da cui è autorizzata
    l'introduzione nell'Unione di prodotti a base di carne e di stomaci, vesciche
    e intestini trattati [notificata con il numero C(2015) 438]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2015/216 ( 2015. gada 10. februāris
    ), ar ko groza Lēmumu 2000/572/EK attiecībā uz atsauci uz harmonizēto sistēmu
    (HS) gaļas izstrādājumu sertifikāta paraugā un groza Lēmumu 2007/777/EK
    attiecībā uz ierakstu par Izraēlu to trešo valstu vai to daļu sarakstā,
    no kurām Savienībā atļauts ievest gaļas produktus un apstrādātus kuņģus,
    pūšļus un zarnas (izziņots ar dokumenta numuru C(2015) 438)
  type: main
- language: lt
  script: Latn
  content: 2015 m. vasario 10 d. Komisijos įgyvendinimo sprendimas (ES) 2015/216,
    kuriuo iš dalies keičiamas Sprendimas 2000/572/EB dėl nuorodos į suderintą
    sistemą (SS) sertifikato mėsos pusgaminiams pavyzdyje ir Sprendimas 2007/777/EB
    dėl Izraeliui skirto įrašo trečiųjų šalių ir jų dalių, iš kurių leidžiama
    į Sąjungą įvežti mėsos produktus, apdorotus skrandžius, pūsles ir žarnas,
    sąraše (pranešta dokumentu Nr. C(2015) 438)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2015/216 tal- 10
    ta' Frar 2015 li temenda d-Deċiżjoni 2000/572/KE fir-rigward tar-referenza għas-Sistema
    Armonizzata (SA) fiċ-ċertifikat mudell għal preparazzjonijiet tal-laħam u
    li temenda d-Deċiżjoni 2007/777/KE fir-rigward tal-annotazzjoni għall-Iżrael
    fil-lista ta' pajjiżi terzi jew partijiet tagħhom, li minnhom hija awtorizzata
    l-introduzzjoni fl-Unjoni ta' prodotti tal-laħam u stonkijiet, bżieżaq tal-awrina
    u msaren ittrattati (notifikata bid-dokument C(2015) 438)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2015/216 van de Commissie van 10 februari 2015
    tot wijziging van Beschikking 2000/572/EG wat betreft de vermelding van het Geharmoniseerd
    Systeem (HS) op het modelcertificaat voor vleesbereidingen en tot wijziging van
    Beschikking 2007/777/EG wat betreft de gegevens over Israël in de lijst van derde
    landen of delen daarvan waaruit het binnenbrengen in de Unie van vleesproducten
    en behandelde magen, blazen en darmen is toegestaan (Kennisgeving geschied onder
    nummer C(2015) 438)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2015/216 z dnia 10 lutego 2015 r. w sprawie
    zmiany decyzji 2000/572/WE w zakresie odniesienia do systemu zharmonizowanego
    (HS) we wzorze świadectwa dotyczącego wyrobów mięsnych oraz w sprawie zmiany
    decyzji 2007/777/WE w odniesieniu do wpisu dotyczącego Izraela w wykazie państw
    trzecich lub ich części, z których dozwolone jest wprowadzanie do Unii produktów
    mięsnych oraz przetworzonych żołądków, pęcherzy i jelit (notyfikowana jako
    dokument nr C(2015) 438)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (EU) 2015/216 da Comissão, de 10 de fevereiro de
    2015 , que altera a Decisão 2000/572/CE no que diz respeito à referência ao
    Sistema Harmonizado (SH) no modelo de certificado para os preparados de carne
    e que altera a Decisão 2007/777/CE no que respeita à entrada relativa a Israel
    na lista de países terceiros ou partes de países terceiros a partir dos quais
    é autorizada na União a introdução de produtos à base de carne e estômagos,
    bexigas e intestinos tratados [notificada com o número C(2015) 438]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2015/216 a Comisiei din 10 februarie
    2015 de modificare a Deciziei 2000/572/CE în ceea ce privește trimiterea la
    Sistemul armonizat (SA) în modelul de certificat pentru preparatele din carne
    și de modificare a Deciziei 2007/777/CE în ceea ce privește rubrica referitoare
    la Israel din lista conținând țările terțe sau părți ale acestora din care
    introducerea în Uniune de produse din carne și de stomacuri, vezici și intestine
    tratate este autorizată [notificată cu numărul C(2015) 438]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2015/216 z 10. februára 2015 ,
    ktorým sa mení rozhodnutie 2000/572/ES, pokiaľ ide o odkaz na harmonizovaný
    systém (HS) vo vzore certifikátu pre mäsové prípravky, a ktorým sa mení
    rozhodnutie 2007/777/ES, pokiaľ ide o položku týkajúcu sa Izraela v zozname
    tretích krajín alebo ich častí, z ktorých je povolený dovoz mäsových výrobkov
    a opracovaných žalúdkov, mechúrov a čriev do Únie [oznámené pod číslom
    C(2015) 438]
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2015/216 z dne 10. februarja 2015 o spremembi
    Odločbe 2000/572/ES glede sklica na harmonizirani sistem (HS) v vzorcu veterinarskega
    spričevala za mesne pripravke in o spremembi Odločbe 2007/777/ES glede vključitve
    Izraela na seznam tretjih držav ali njihovih delov, iz katerih je dovoljen uvoz
    mesnih izdelkov in obdelanih želodcev, mehurjev in črev v Unijo (notificirano
    pod dokumentarno številko C(2015) 438)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2015/216 de la Comisión, de 10 de febrero
    de 2015 , por la que se modifica la Decisión 2000/572/CE en lo que respecta a
    la referencia al Sistema Armonizado (SA) en el modelo de certificado para los
    preparados de carne, y se modifica la Decisión 2007/777/CE en lo relativo a la
    entrada correspondiente a Israel en la lista de terceros países o partes de los
    mismos desde donde está autorizada la introducción en la Unión de productos
    cárnicos y estómagos, vejigas e intestinos tratados [notificada con el número
    C(2015) 438]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2015/216 av den 10 februari 2015
    om ändring av beslut 2000/572/EG vad gäller hänvisningen till Harmoniserade
    systemet i förlagan till intyg för köttberedningar och om ändring av beslut
    2007/777/EG vad gäller uppgifterna om Israel i förteckningen över tredjeländer
    och delar av tredjeländer från vilka köttprodukter och behandlade magar, blåsor
    och tarmar får föras in till unionen [delgivet med nr C(2015) 438]
