id: EURegulation592000
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 59/2000 of 5 January 2000 initiating a 'new
    exporter' review of Council Regulation (EC) No 393/98 imposing a definitive anti-dumping
    duty on imports of stainless steel fasteners and parts thereof originating, inter
    alia, in the People's Republic of China, repealing the duty with regard to imports
    from one exporting producer and making these imports subject to registration
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 59/2000 de la Commission, du 5 janvier 2000, portant
    ouverture d'un réexamen au titre de nouvel exportateur du règlement (CE) nº
    393/98 du Conseil instituant un droit antidumping définitif sur les importations
    d'éléments de fixation en acier inoxydable et de leurs parties originaires,
    entre autres, de la République populaire de Chine, abrogeant le droit applicable
    aux importations d'un producteur-exportateur et soumettant les importations en
    question à enregistrement
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 59/2000 der Kommission vom 5. Januar 2000 zur Einleitung
    einer Überprüfung der Verordnung (EG) Nr. 393/98 des Rates zur Einführung eines
    endgültigen Antidumpingzolls auf die Einfuhren von Verbindungselementen und Teilen
    aus nichtrostendem Stahl mit Ursprung unter anderem in der Volksrepublik China
    (Überprüfung für neue Ausführer), zur Außerkraftsetzung des Zolls gegenüber
    den Einfuhren der Ware von einem ausführenden Hersteller in diesem Land und zur
    zollamtlichen Erfassung dieser Einfuhren
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 59/2000 af 5. januar 2000 om indledning
    af en fornyet undersøgelse i forbindelse med en "ny eksportør" af Rådets forordning
    (EF) nr. 393/98 om indførelse af en endelig antidumpingtold på importen af skruer,
    bolte, møtrikker og lignende varer af rustfrit stål med oprindelse i bl.a. Folkerepublikken
    Kina, om ophævelse af tolden på importen fra en eksporterende producent og om
    at gøre den pågældende import til genstand for registrering
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 59/2000 της Επιτροπής,
    της 5ης Ιανουαρίου 2000, σχετικά με την έναρξη
    διαδικασίας επανεξέτασης ως προς «νέο εξαγωγέα»
    του κανονισμού (ΕΚ) αριθ. 393/98 του Συμβουλίου,
    για την επιβολή οριστικού δασμού αντιντάμπινγκ
    στις εισαγωγές συνδετήρων και μερών αυτών
    από ανοξείδωτο χάλυβα καταγωγής, μεταξύ άλλων,
    Λαϊκής Δημοκρατίας της Κίνας, καθώς και σχετικά
    με την κατάργηση του δασμού όσον αφορά τις
    εισαγωγές που προέρχονται από παραγωγό εξαγωγέα
    της εν λόγω χώρας και με την υπαγωγή των εισαγωγών
    αυτών σε καταγραφή
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 59/2000, annettu 5 päivänä tammikuuta 2000,
    lopullisen polkumyyntitullin käyttöönotosta muun muassa Kiinan kansantasavallasta
    peräisin olevien ruostumattomasta teräksestä valmistettujen kiinnikkeiden ja
    niiden osien tuonnissa annettuun neuvoston asetukseen (EY) N:o 393/98 liittyvän
    "uuden viejän" tarkastelun vireillepanosta, yhden vievän tuottajan tuontiin
    sovellettavan tullin kumoamisesta ja tällaisen tuonnin kirjaamisvelvoitteesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 59/2000 della Commissione, del 5 gennaio 2000, che
    avvia un riesame, nei confronti di un nuovo esportatore, del regolamento (CE)
    n. 393/98 che istituisce un dazio antidumping definitivo sulle importazioni di
    elementi di fissaggio di acciaio inossidabile e di loro parti originari, tra l'altro,
    della Repubblica popolare cinese, che abroga il dazio per quanto riguarda le importazioni
    di un produttore esportatore e che stabilisce che tali importazioni siano soggette
    a registrazione
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 59/2000 van de Commissie van 5 januari 2000 tot inleiding
    van een procedure, ten behoeve van een nieuwe exporteur, voor de herziening van
    Verordening (EG) nr. 393/98 van de Raad tot instelling van een definitief antidumpingrecht
    op de invoer van roestvrij stalen bevestigingsmiddelen en delen daarvan uit, onder
    meer, de Volksrepubliek China, tot intrekking van het recht ten aanzien van een
    exporterende producent en tot registratie van de invoer van het betrokken product
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.o 59/2000 da Comissão, de 5 de Janeiro de 2000, que
    inicia um reexame de «novo exportador» do Regulamento (CE) n.o 393/98 do Conselho
    que cria um direito anti-dumping definitivo sobre as importações de parafusos
    e suas partes, de aço inoxidável, originários da República Popular da China,
    revoga o direito aplicável às importações de um exportador deste país e sujeita
    essas importações a registo
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 59/2000 de la Comisión, de 5 de enero de 2000, que
    inicia una reconsideración para un «nuevo exportador» del Reglamento (CE) nº
    393/98 del Consejo, por el que se establece un derecho antidumping definitivo
    sobre las importaciones de elementos de sujeción de acero inoxidable y sus partes
    originarias, entre otros países, de la República Popular de China, y por el
    que se deroga el derecho aplicable a las importaciones de un productor exportador
    y se someten a registro dichas importaciones
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 59/2000 av den 5 januari 2000 om inledande
    av en översyn, avseende en ny exportör, av rådets förordning (EG) nr 393/98
    om införande av en slutgiltig antidumpningstull på import av fästanordningar
    av rostfritt stål och deras delar med ursprung i bl.a. Folkrepubliken Kina, om
    upphävande av tullen på import från en exporterande tillverkare samt om registrering
    av denna import
  type: main
