  content: COMMISSION REGULATION (EEC) No 2480/93 of 7 September 1993 re-establishing
    the levying of customs duties on products of category No 16 (order No 40.0160),
    originating in Pakistan, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2480/93 de la Commission du 7 septembre 1993 portant
