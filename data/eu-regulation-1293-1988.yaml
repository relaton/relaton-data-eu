  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1293/88 della Commissione dell' 11 maggio 1988 che
    ripristina la riscossione dei dazi doganali applicabili alle gonne per donna o
    per ragazza, della categoria di prodotti n. 27 (numero d' ordine 40.0270), e alle
    reti ottenute con l' impiego di spago, corde e funi, della categoria di prodotti
    n. 97 (numero d' ordine 40.0970), originari della Tailandia beneficiaria delle
    preferenze tariffarie previste dal regolamento (CEE) n. 3783/87 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1293/88 van de Commissie van 11 mei 1988 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op rokken voor
    dames en meisjes, van de categorie van produkten nr. 27 (volgnummer 40.0270) en
    netten, vervaardigd van bindgaren, van touw of van kabel, van de categorie van
    produkten nr. 97 (volgnummer 40.0970), van oorsprong uit Thailand, waarvoor de
    algemene tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3783/87
    van de Raad
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1293/88 da Comissão de 11 de Maio de 1988 que restabelece
