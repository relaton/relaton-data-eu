title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1293/88 of 11 May 1988 re-establishing the
    levying of customs duties on women' s or girls' skirts, products of category 27
    (order No 40.0270), nets and netting made of twine, cordage or rope, products
    of category 97 (order No 40.0970), originating in Thailand to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3783/87 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1293/88 de la Commission du 11 mai 1988 portant rétablissement
    de la perception des droits de douane applicables aux jupes pour femmes ou fillettes
    de la catégorie de produits n° 27 (n° d' ordre 40.0270), aux filets fabriqués
    à l' aide de ficelles, cordes ou cordages de la catégorie de produits n° 97
    (n° d' ordre 40.0970), originaires de Thaïlande, bénéficiaire des préférences
    tarifaires prévues par le règlement (CEE) n° 3783/87 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1293/88 der Kommission vom 11. Mai 1988 zur Wiedereinführung
    des Zollsatzes für Röcke für Frauen und Mädchen, der Warenkategorie Nr. 27
    (lfd. Nr. 40.0270) sowie Netze, in Stücken oder als Meterware, aus Bindfäden,
    Seilen oder Tauen, der Warenkategorie Nr. 97 (lfd. Nr. 40.0970) mit Ursprung in
    Thailand, dem die in der Verordnung (EWG) Nr. 3783/87 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1293/88 af 11. maj 1988 om genindførelse
    af opkrævning af toldafgifter for nederdele, til kvinder og piger under varekategori
    nr. 27 (løbenummer 40.0270) og knyttede netstoffer af sejlgarn, reb og tovværk
    under varekategori nr. 97 (løbenummer 40.0970), som har oprindelse i Thailand
    og omfattes af de toldpræferencer, som er fastsat i Rådets forordning (EØF)
    nr. 3783/87
  type: main
- language: el
  script: Grek
