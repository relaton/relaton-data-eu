    in de Europese Unie mogen worden binnengebracht, en van de voorschriften inzake
    veterinaire certificering, wat betreft Rusland
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie wykonawcze Komisji (UE) nr 644/2012 z dnia 16 lipca 2012
