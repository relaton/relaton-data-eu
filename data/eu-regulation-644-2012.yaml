title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) No 644/2012 of 16 July 2012 amending
    Regulation (EU) No 206/2010 laying down lists of third countries, territories
    or parts thereof authorised for the introduction into the European Union of certain
    animals and fresh meat and the veterinary certification requirements, as regards
    Russia
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) n ° 644/2012 de la Commission du 16 juillet
    2012 modifiant le règlement (UE) n ° 206/2010 établissant des listes des pays
    tiers, territoires ou parties de pays tiers ou territoires en provenance desquels
    l’introduction dans l’Union européenne de certains animaux et viandes fraîches
    est autorisée, et définissant les exigences applicables en matière de certification
    vétérinaire, en ce qui concerne la Russie
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) Nr. 644/2012 der Kommission vom 16. Juli
    2012 zur Änderung der Verordnung (EU) Nr. 206/2010 zur Erstellung von Listen
    der Drittländer, Gebiete und Teile davon, aus denen das Verbringen bestimmter
    Tiere und bestimmten frischen Fleisches in die Europäische Union zulässig ist,
    und zur Festlegung der diesbezüglichen Veterinärbescheinigungen, in Bezug auf
    Russland
  type: main
