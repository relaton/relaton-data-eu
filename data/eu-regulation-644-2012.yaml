  type: main
- language: it
  script: Latn
  content: Regolamento di esecuzione (UE) n. 644/2012 della Commissione, del 16 luglio
    2012 , recante modifica, per quanto riguarda la Russia, del regolamento (UE) n.
    206/2010 che istituisce elenchi di paesi terzi, territori o loro parti autorizzati
    a introdurre nell'Unione europea determinati animali e carni fresche e che definisce
    le condizioni di certificazione veterinaria
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas regula (ES) Nr. 644/2012 ( 2012. gada 16. jūlijs
