title:
- language: en
  script: Latn
  content: '95/228/EC: Commission Decision of 20 June 1995 authorizing the Member
    States for a limited period to provide for derogations from certain provisions
    of Council Directive 77/93/EEC in respect of potatoes for factory processing for
    human consumption, originating in Saudi Arabia'
  type: main
- language: fr
  script: Latn
  content: '95/228/CE: Décision de la Commission, du 20 juin 1995, autorisant les
    États membres à prévoir, pour une période limitée, des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil pour ce qui concerne les pommes
    de terre de transformation destinées à la consommation humaine originaires d''
    Arabie saoudite'
  type: main
- language: de
  script: Latn
  content: '95/228/EG: Entscheidung der Kommission vom 20. Juni 1995 zur Ermächtigung
    der Mitgliedstaaten, zeitweilig Ausnahmen von einigen Bestimmungen der Richtlinie
    77/93/EWG des Rates in bezug auf Speisekartoffeln/Speiseerdäpfel zur industriellen
    Verarbeitung mit Ursprung in Saudi-Arabien zuzulassen'
  type: main
- language: da
  script: Latn
  content: '95/228/EF: Kommissionens beslutning af 20. juni 1995 om bemyndigelse af
    medlemsstaterne til i en begrænset periode at indrømme undtagelser fra visse
    bestemmelser i Rådets direktiv 77/93/EØF for så vidt angår kartofler til industriel
    forarbejdning til konsum med oprindelse i Saudi-Arabien'
  type: main
- language: el
  script: Grek
  content: '95/228/ΕΚ: Απόφαση της Επιτροπής της 20ής Ιουνίου
    1995 που επιτρέπει προσωρινά στα κράτη μέλη να
    προβλέπουν παρεκκλίσεις από ορισμένες διατάξεις
    τη οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά με
    τα γεώμηλα που προορίζονται για βιομηχανική
    μεταποίηση για ανθρώπινη κατανάλωση, καταγωγής
    Σαουδικής Αραβίας'
  type: main
- language: fi
  script: Latn
  content: '95/228/EY: Komission päätös, tehty 20 päivänä kesäkuuta 1995, luvan
    antamisesta jäsenvaltioille säätää rajoitetuksi ajaksi poikkeuksia neuvoston
    direktiivin 77/93/ETY tietyistä säännöksistä Saudi-Arabiasta peräisin olevien
    teolliseen jalostukseen tarkoitettujen ruokaperunoiden osalta'
  type: main
- language: it
  script: Latn
  content: '95/228/CE: Decisione della Commissione, del 20 giugno 1995, che autorizza
    gli Stati membri a derogare temporaneamente ad alcune disposizioni della direttiva
    77/93/CEE del Consiglio per le patate originarie dell'' Arabia Saudita destinate
    all'' industria trasformatrice per il consumo umano'
  type: main
- language: nl
  script: Latn
  content: '95/228/EG: Beschikking van de Commissie van 20 juni 1995 tot machtiging
    van de Lid-Staten om voor fabrieksaardappelen voor menselijke consumptie van oorsprong
    uit Saoedi-Arabië tijdelijke afwijkingen van sommige bepalingen van Richtlijn
    77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '95/228/CE: Decisão da Comissão, de 20 de Junho de 1995, que autoriza
