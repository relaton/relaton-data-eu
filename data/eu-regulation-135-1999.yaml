  content: Commission Regulation (EC) No 135/1999 of 21 January 1999 determining the
    extent to which the applications for import licences submitted in January 1999
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1374/98 can be accepted
  type: main
- language: fr
  script: Latn
