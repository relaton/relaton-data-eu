title:
- language: fr
  script: Latn
  content: Décision de la Commission autorisant l'Italie à maintenir pour l'année
    1961 un contingent de 730 quintaux pour l'acide citrique et de 33.000 quintaux
    pour le citrate de calcium en application de l'article 226 du Traité
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission, durch die Italien nach Artikel 226 des Vertrages
    ermächtigt werden soll, im Jahre 1961 für Zitronensäure ein Kontingent von
    730 Doppelzentnern und für Kalziumzitrat ein Kontingent von 33 000 Doppelzentnern
    aufrechtzuerhalten
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione con cui si autorizza l'Italia a mantenere per
    l'anno 1961 un contingente di 730 quintali per l'acido citrico e di 33.000 quintali
    per il citrato di calcio, in applicazione dell'articolo 226 del Trattato
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie waarbij Italië, op grond van artikel 226
    van het Verdrag, wordt gemachtigd, voor het jaar 1961, een contingent van 73 ton
    citroenzuur en 3.300 ton calciumcitraat te handhaven
