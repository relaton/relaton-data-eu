    relative al controllo e al pagamento delle restituzioni alla produzione nel settore
    dei cereali e del riso #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 3076/89 VAN DE COMMISSIE van 12 oktober 1989 tot
