title:
- language: en
  script: Latn
  content: Commission Decision of 15 December 1994 amending Decision 93/467/EEC authorizing
    Member States to provide for derogations from certain provisions of Council Directive
    77/93/EEC, in respect of oak (Quercus L.) logs with bark attached, originating
    in Canada or the United States of America
  type: main
- language: fr
  script: Latn
  content: Décision de la Commission du 15 décembre 1994 modifiant la décision
    93/467/CEE autorisant les États membres à prévoir des dérogations à certaines
    dispositions de la directive 77/93/CEE du Conseil en ce qui concerne les grumes
    de chêne (Quercus L.) avec écorce, originaires du Canada ou des États-Unis
    d'Amérique
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 15. Dezember 1994 zur Änderung der Entscheidung
    93/467/EWG zur Ermächtigung der Mitgliedstaaten, für Eichenstämme (Quercus
    L.) mit Rinde mit Ursprung in Kanada oder den Vereinigten Staaten von Amerika
    Ausnahmen von bestimmten Vorschriften der Richtlinie 77/93/EWG des Rates vorzusehen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 15. december 1994 om ændring af beslutning
    93/467/EØF om bemyndigelse af medlemsstaterne til at indrømme undtagelser fra
    visse bestemmelser i Rådets direktiv 77/93/EØF for uafbarkede kævler af egetræ
    (Quercus L.) med oprindelse i Canada eller USA
  type: main
- language: el
  script: Grek
  content: Απόφαση της Επιτροπής της 15ης Δεκεμβρίου
    1994 για την τροποποίηση της απόφασης της Επιτροπής
    93/467/ΕΟΚ που επιτρέπει στα κράτη μέλη να παρεκκλίνουν
    από ορισμένες διατάξεις της οδηγίας 77/93/ΕΟΚ
    του Συμβουλίου όσον αφορά τους μη αποφλοιωμένους
    κορμούς βελανιδιάς (Quercus L.) καταγωγής Καναδά
    ή Ηνωμένων Πολιτειών της Αμερικής
  type: main
- language: fi
  script: Latn
  content: Komission päätös, tehty 15 päivänä joulukuuta 1994, jäsenvaltioiden
    oikeuttamisesta säätämään poikkeuksia tiettyihin Kanadasta tai Amerikan yhdysvalloista
    peräisin olevia kuorellisia tammitukkeja (Quercus L.) koskeviin neuvoston direktiivin
    77/93/ETY säännöksiin tehdyn päätöksen N:o 93/467/ETY muuttamisesta
  type: main
- language: it
  script: Latn
  content: Decisione della Commissione del 15 dicembre 1994 recante modifica della
    decisione 93/467/CEE che autorizza gli Stati membri a prevedere deroghe a determinate
    disposizioni della direttiva 77/93/CEE del Consiglio per quanto riguarda i tronchi
    di quercia (Quercus L.) con corteccia originari del Canada o degli Stati Uniti
    d'America
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 15 december 1994 houdende wijziging van
    Beschikking 93/467/EEG tot machtiging van de Lid-Staten om voor de stammen van
    eikehout (Quercus L.), met bast, van oorsprong uit Canada en de Verenigde Staten
    van Amerika, afwijkingen van sommige bepalingen van Richtlijn 77/93/EEG van de
    Raad toe te staan
  type: main
- language: pt
  script: Latn
  content: Decisão da Comissão de 15 de Dezembro de 1994 que altera a Decisão 93/467/CEE,
    que autoriza os Estados-membros a prever derrogações a certas normas da Directiva
    77/93/CEE do Conselho relativamente aos toros de carvalho (Quercus L.) com casca,
    originários do Canadá ou dos Estados Unidos da América
  type: main
- language: es
  script: Latn
  content: Decisión de la Comisión de 15 de diciembre de 1994 por la que se modifica
    la Decisión 93/467/CEE por la que se autoriza a los Estados miembros para establecer
    excepciones a ciertas disposiciones de la Directiva 77/93/CEE del Consejo en lo
    que respecta a los troncos de roble (Quercus L.) con corteza originarios de Canadá
    o de Estados Unidos de América
  type: main
- language: sv
  script: Latn
  content: Kommissionens beslut av den 15 december 1994 om ändring av beslut 93/467/EEG
    om bemyndigande för medlemsstaterna att göra undantag från vissa bestämmelser
    i rådets direktiv 77/93/EEG för obarkade stockar av ek (Quercus L.) med ursprung
    i Canada och USA
  type: main
