title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 985/80 of 22 April 1980 re-establishing
    the levying of customs duties on thread of asbestos, falling within subheading
    68.13 B I and originating in Yugoslavia, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 985/80 de la Commission, du 22 avril 1980, portant
    rétablissement de la perception des droits de douane applicables aux fils d'
    amiante de la sous-position 68.13 B I du tarif douanier commun, originaires de
    Yougoslavie, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 985/80 der Kommission vom 22. April 1980 zur Wiedereinführung
    des Zollsatzes für Fäden aus Asbest der Tarifstelle 68.13 B I, mit Ursprung
    in Jugoslawien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 985/80 af 22. april 1980 om genindførelse
    af opkrævning af toldafgifter for bearbejdede asbestfibre, under pos. 68.13 B
    I, som har oprindelse i Jugoslavien og omfattes af de toldpræferencer, som er
    fastsat i Rådets forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 985/80 della Commissione, del 22 aprile 1980, che
    ripristina la riscossione dei dazi doganali applicabili ai fili di amianto della
    sottovoce 68.13 B I della tariffa doganale comune, originari della Iugoslavia
    beneficiaria delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 985/80 van de Commissie van 22 april 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op garens van
    asbest, van post 68.13 B I, van oorsprong uit Joegoslavië ten behoeve waarvan
    bij Verordening (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden
    geopend
  type: main
