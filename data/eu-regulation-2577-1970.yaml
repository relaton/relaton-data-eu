title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2577/70 du Conseil, du 17 décembre 1970, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de ferro-chrome contenant en poids 0,10 % ou moins de carbone et plus de 30 %
    jusqu'à 90 % inclus de chrome (ferro-chrome surrafiné) de la sous-position EX
    73.02 E I du tarif douanier commun (année 1971)
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2577/70 des Rates vom 17. Dezember 1970 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom,
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und
    an Chrom von mehr als 30, doch nicht mehr als 90 Gewichtshundertteilen (hochraffiniertes
    Ferrochrom) der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs (1971)
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2577/70 del Consiglio, del 17 dicembre 1970, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10% o meno di
    carbonio e oltre il 30 % e sino al 90 % incluso di cromo (ferro-cromo superraffinato)
    della sottovoce ex 73.02 E I della tariffa doganale comune (anno 1971)
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2577/70 van de Raad van 17 december 1970 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor ferrochroom, bevattende 0,10 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van onderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief (1971)
  type: main
