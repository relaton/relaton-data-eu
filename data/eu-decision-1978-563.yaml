id: EUDecision1978563
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Decision of 9 June 1978 authorizing Ireland not to apply Community
    treatment to bed linen, woven, falling within subheading ex 62.02 B (NIMEXE code
    62.02-11; 19) of the Common Customs Tariff, originating in India and in free circulation
    in the other Member States
  type: main
- language: fr
  script: Latn
  content: '78/563/CEE: Décision de la Commission, du 9 juin 1978, autorisant l''Irlande
    à exclure du traitement communautaire le linge de lit tissé, de la sous-position
    Ex 62.02 B du Tarif douanier commun (codes Nimexe : 62.02-11, 19), originaire
    de l''Inde et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 9. Juni 1978, mit der Irland ermächtigt
    wird, aus Indien stammende und in den übrigen Mitgliedstaaten im freien Verkehr
    befindliche Bettwäsche aus Geweben der Tarifnummer ex 62.02 B des Gemeinsamen
    Zolltarifs (NIMEXE-Kennziffern 62.02-11; 19) von der Gemeinschaftsbehandlung auszuschließen
  type: main
- language: da
  script: Latn
  content: Kommissionens beslutning af 9. juni 1978 om bemyndigelse af Irland til
    fra fællesskabsbehandling at undtage sengelinned, vævet, som henhører under
    pos. ex 62.02 B (NIMEXE-kode 62.02-11, 19) i den fælles toldtarif, har oprindelse
    i Indien og frit kan omsættes i de andre medlemsstater
  type: main
- language: it
  script: Latn
  content: 'Decisione della Commissione, del 9 giugno 1978, che autorizza l''Irlanda
    ad escludere dal trattamento comunitario la biancheria da letto, tessuta, della
    sottovoce ex 62.02 B della tariffa doganale comune (codice Nimexe: 62.02-11; 19),
    originaria dell''India e messa in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: Beschikking van de Commissie van 9 juni 1978 waarbij Ierland wordt gemachtigd
    geweven beddelinnen van post ex 62.02 B van het gemeenschappelijk douanetarief
    (NIMEXE-code 62.02-11, 19), van oorsprong uit India en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten
  type: main
