id: EUDecision1983373
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '83/373/EEC: Commission Decision of 19 July 1983 authorizing the Kingdom
    of Belgium, the Grand Duchy of Luxembourg and the Kingdom of the Netherlands to
    apply intra-Community surveillance to imports of certain products, originating
    in third countries, which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/373/CEE: Décision de la Commission du 19 juillet 1983 autorisant le
    Royaume de Belgique, le Grand-Duché de Luxembourg et le Royaume des Pays-Bas
    à procéder à une surveillance intracommunautaire des importations de certains
    produits originaires de pays tiers et mis en libre pratique dans la Communauté,
    susceptibles de faire l''objet de mesures de protection au titre de l''article
    115 du traité (Les textes en langues française et néerlandaise sont les seuls
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '83/373/EWG: Entscheidung der Kommission vom 19. Juli 1983 zur Ermächtigung
    des Königreichs Belgien, des Großherzogtums Luxemburg und des Königreichs der
    Niederlande zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus Drittländern stammenden und in der Gemeinschaft im freien Verkehr befindlichen
    Waren, für die Schutzmaßnahmen gemäß Artikel 115 des Vertrages ergriffen werden
    können (Nur der französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/373/EØF: Kommissionens beslutning af 19. juli 1983 om bemyndigelse
    af kongeriget Belgien, storhertugdømmet Luxembourg og kongeriget Nederlandene
    til at foretage tilsyn inden for Fællesskabet med indførsel af visse produkter,
    der har oprindelse i tredjelande og er overgået til fri omsætning i Fællesskabet,
    og som kan gøres til genstand for beskyttelsesforanstaltninger i henhold til
    traktatens artikel 115 (Kun den franske og nederlandske udgave er autentiske)'
  type: main
- language: el
  script: Grek
  content: '83/373/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουλίου 1983 περί εξουσιοδοτήσεως του Βασιλείου
    του Βελγίου, του Μεγάλου Δουκάτου του Λουξεμβούργου
    και του Βασιλείου των Κάτω Χωρών να πραγματοποιούν
    ενδοκοινοτική εποπτεία στις εισαγωγές ορισμένων
    προϊόντων που κατάγονται από τρίτη χώρα και
    τίθενται σε ελεύθερη κυκλοφορία μέσα στην
    Κοινότητα, δυναμένων να τύχουν προστατευτικών
    μέτρων βάσει του άρθρου 115 της συνθήκης (Τα
    κείμενα στην γαλλική και ολλανδική γλώσσα
    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '83/373/CEE: Decisione della Commissione del 19 luglio 1983 che autorizza
    il Regno del Belgio, il Granducato del Lussemburgo e il Regno dei Paesi Bassi
    a procedere ad una sorveglianza intracomunitaria delle importazioni di taluni
    prodotti originari dei paesi terzi e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (Il testi in lingua francese e olandese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '83/373/EEG: Beschikking van de Commissie van 19 juli 1983 houdende machtiging
    van het Koninkrijk België, het Groothertogdom Luxemburg en het Koninkrijk der
    Nederlanden tot toepassing van een intracommunautair toezicht ten aanzien van
    de invoer van bepaalde produkten van oorsprong uit derde landen die in de Gemeenschap
    in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn van beschermende
    maatregelen krachtens artikel 115 van het EEG-Verdrag (Slechts de teksten in de
    Franse en de Nederlandse taal zijn authentiek)'
  type: main
