    tammikuussa 2004 jätettyjen tuontitodistushakemusten hyväksyttävyydestä Puolan,
    Unkarin, Tšekin, Slovakian, Bulgarian ja Romanian osalta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 148/2004 della Commissione, del 28 gennaio 2004, che
