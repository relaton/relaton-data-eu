title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 148/2004 of 28 January 2004 determining the
    extent to which applications submitted in January 2004 for import licences for
    the tariff quotas for beef and veal provided for in Regulation (EC) No 1279/98
    for Bulgaria, the Czech Republic, Slovakia, Romania, the Republic of Poland and
    the Republic of Hungary can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 148/2004 de la Commission du 28 janvier 2004 déterminant
    la mesure dans laquelle peuvent être acceptées les demandes de certificats d'importation
    introduites en janvier 2004 pour les contingents tarifaires de viandes bovines
    prévus par le règlement (CE) n° 1279/98 pour la République de Pologne, la
    République de Hongrie, la République tchèque, la Slovaquie, la Bulgarie et
    la Roumanie
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 148/2004 der Kommission vom 28. Januar 2004 über den
    Umfang, in dem im Rahmen der in der Verordnung (EG) Nr. 1279/98 für die Republik
    Bulgarien, die Tschechische Republik, die Slowakische Republik, Rumänien, die
    Republik Polen und die Republik Ungarn vorgesehenen Zollkontingente für Rindfleisch
    den im Januar 2004 gestellten Einfuhrlizenzanträgen stattgegeben werden kann
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 148/2004 af 28. januar 2004 om fastsættelse
    af, i hvilket omfang der kan accepteres importlicensansøgninger indgivet i januar
    2004 i forbindelse med de toldkontingenter for oksekød, der ved Rådets forordning
    (EF) nr. 1279/98 er fastsat for Polen, Ungarn, Tjekkiet, Slovakiet, Bulgarien
    og Rumænien
  type: main
- language: el
  script: Grek
