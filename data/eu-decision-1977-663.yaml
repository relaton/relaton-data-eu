  type: main
- language: it
  script: Latn
  content: Decisione della Commissione, del 13 ottobre 1977, che modifica le decisioni
    77/222/CEE e 77/397/CEE che autorizzano la Repubblica italiana ad ammettere temporaneamente
    la commercializzazione di sementi che non soddisfano alle condizioni della direttiva
    66/401/CEE del Consiglio
  type: main
- language: nl
  script: Latn
