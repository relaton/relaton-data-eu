  content: Commission Decision of 13 October 1977 amending Decision 77/222/EEC and
    77/397/EEC authorizing the Italian Republic to permit temporarily the marketing
    of seed not complying with the requirements of Council Directive 66/401/EEC
  type: main
- language: fr
  script: Latn
  content: '77/663/CEE: Décision de la Commission, du 13 octobre 1977, modifiant
    les décisions 77/222/CEE et 77/397/CEE autorisant la République italienne à
    admettre temporairement la commercialisation de semences ne répondant pas aux
    exigences de la directive 66/401/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 13. Oktober 1977 zur Änderung der Entscheidungen
    77/222/EWG und 77/397/EWG, mit denen die Italienische Republik ermächtigt wird,
    vorübergehend Saatgut zum Verkehr zuzulassen, das den Anforderungen der Richtlinie
    66/401/EWG des Rates nicht entspricht
  type: main
- language: da
  script: Latn
  content: Kommissionens Beslutning af 13. oktober 1977 om ændring af beslutningerne
