title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2530/85 of 5 September 1985 re-establishing
    the levying of customs duties on polypropylene in one of the forms mentioned in
    Note 3 (d) to Chapter 39, falling within subheading 39.02 C ex IV, originating
    in South Korea, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3562/84 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2530/85 de la Commission du 5 septembre 1985 portant
    rétablissement de la perception des droits de douane applicables au polypropylène
    sous l' une des formes visées à la note 3 sous d) du chapitre 39, de la sous-position
    39.02 C ex IV du tarif douanier commun, originaire de Corée du Sud, bénéficiaire
    des préférences tarifaires prévues par le règlement (CEE) no 3562/84 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2530/85 der Kommission vom 5. September 1985 zur Wiedereinführung
    der Erhebung der Zölle für Polypropylen in Formen im Sinne der Vorschrift 3
    d) zu Kapitel 39 der Tarifstelle 39.02 C ex IV des Gemeinsamen Zolltarifs mit
    Ursprung in Südkorea, dem die in der Verordnung (EWG) Nr. 3562/84 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2530/85 af 5. september 1985 om genindførelse
    af opkrævning af told for polypropylen i former, som nævnt i bestemmelse 3 d)
    til kapitel 39, henhørende under pos. 39.02 C ex IV i den fælles toldtarif med
    oprindelse i Sydkorea, som præferenceberettiget i henhold til Rådets forordning
    (EØF) nr. 3562/84
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2530/85 της Επιτροπής
    της 5ης Σεπτεμβρίου 1985 περί επαναφοράς της
    εισπράξεως τελωνειακών δασμών για το πολυπροπυλένιο
    με μια από τις μορφές που αναφέρονται στη σημείωση
    3 δ) του κεφαλαίου 39 της διακρίσεως 39.02 Γ ex IV
    του Κοινού Δασμολογίου, καταγωγής Νοτίου Κορέας,
    δικαιούχου των προβλεπομένων από τον κανονισμό
    (ΕΟΚ) αριθ. 3562/84 του Συμβουλίου δασμολογικών
    προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2530/85 della Commissione del 5 settembre 1985 che
    ripristina la riscossione dei dazi doganali applicabili al polipropilene nelle
    forme previste dalla nota 3 d) del capitolo 39 della sottovoce 39.02 C ex IV della
    tariffa doganale comune, originario della Corea del Sud beneficiaria delle preferenze
    tariffarie previste dal regolamento (CEE) n. 3562/84 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2530/85 van de Commissie van 5 september 1985 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op polypropyleen
    in een van de vormen bedoeld bij Aantekening 3 d) op Hoofdstuk 39, van postonderverdeling
    39.02 C ex IV van het gemeenschappelijk douanetarief, van oorsprong uit Zuid-Korea,
    waarvoor de in Verordening (EEG) nr. 3562/84 van de Raad vermelde tariefpreferenties
    zijn verleend
  type: main
