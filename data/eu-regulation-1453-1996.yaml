title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 1453/96 of 25 July 1996 determining the extent
    to which applications lodged in July 1996 licences for certain eggs and poultrymeat
    products under the regime provided for by the Interim Agreements concluded by
    the Community with Romania and Bulgaria can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 1453/96 DE LA COMMISSION du 25 juillet 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    juillet 1996 pour certains produits des secteurs de la viande de volaille et des
    oeufs dans le cadre du régime prévu dans les accords conclus par la Communauté
    avec la Roumanie et la Bulgarie peuvent être acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 1453/96 DER KOMMISSION vom 25. Juli 1996 über die
    Festsetzung des Umfangs, in dem die im Juli 1996 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Eier und für Geflügelfleisch entsprechend der Regelung der Abkommen
    zwischen der Gemeinschaft und Rumänien und Bulgarien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1453/96 af 25. juli 1996 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    1996 om importlicenser for visse æg- og fjerkrækødsprodukter i forbindelse
    med den ordning, der er fastsat i de aftaler, som Fællesskabet har indgået med
    Rumænien og Bulgarien
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 1453/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 25ης Ιουλίου 1996 για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο του 1996
    για άδειες εισαγωγής αυγών και κρέατος πουλερικών
    βάσει του καθεστώτος που προβλέπεται από τις
    συμφωνίες τις οποίες συνήψε η Κοινότητα με
    τη Ρουμανία και τη Βουλγαρία
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 1453/96, annettu 25 päivänä heinäkuuta 1996,
    yhteisön Bulgarian ja Romanian kanssa tekemien sopimusten mukaisen järjestelmän
    mukaisesti heinäkuussa 1996 jätettyjen tiettyjä siipikarjanliha- ja muna-alan
    tuotteita koskevien tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 1453/96 DELLA COMMISSIONE del 25 luglio 1996 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 1996 per taluni prodotti del settore delle uova
    e del pollame nel quadro del regime previsto dagli accordi conclusi tra la Comunità
    e la Romania e la Bulgaria
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 1453/96 VAN DE COMMISSIE van 25 juli 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sectoren eieren en pluimvee, die in juli 1996 worden
    ingediend op grond van de regeling die is vastgesteld in de door de Gemeenschap
    gesloten Overeenkomsten met Bulgarije en Roemenië
  type: main
