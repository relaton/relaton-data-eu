title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1406/82 of 4 June 1982 re-establishing the
    levying of customs duties on umbrellas and sunshades, falling within heading No
    66.01 and originating in Singapore, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3601/81 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1406/82 de la Commission, du 4 juin 1982, portant
    rétablissement de la perception des droits de douane applicables aux parapluies,
    parasols et ombrelles, de la position 66.01 du tarif douanier commun, originaires
    de Singapour, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3601/81 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1406/82 der Kommission vom 4. Juni 1982 zur Wiedereinführung
    der Erhebung der Zölle für Regenschirme und Sonnenschirme der Tarifnummer 66.01,
    mit Ursprung in Singapur, dem die in der Verordnung (EWG) Nr. 3601/81 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1406/82 af 4. juni 1982 om genindførelse
    af opkrævning af told for paraplyer og parasoller, henhørende under pos. 66.01
    og med oprindelse i Singapore, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3601/81r
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 1406/82 τής Επιτροπής
    τής 4ης Ιουνίου 1982 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά αλεξιβρόχια καί αλεξήλια
    τής κλάσεως 66. 01 τού Κοινού Δασμολογίου, καταγωγής
    Σιγκαπούρης, δικαιούχου τών προβλεπομένων
    από τόν κανονισμό (EOK) αριθ. 3601/81 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1406/82 della Commissione, del 4 giugno 1982, che
    ripristina la riscossione dei dazi doganali applicabili agli ombrelli (da pioggia
    e da sole) della voce 66.01 della tariffa doganale comune, originari di Singapore,
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 3601/81
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1406/82 van de Commissie van 4 juni 1982 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op paraplu' s
    en parasols van tariefpost 66.01, van oorsprong uit Singapore, waarvoor de in
    Verordening (EEG) nr. 3601/81 van de Raad vermelde tariefpreferenties zijn verleend
  type: main
