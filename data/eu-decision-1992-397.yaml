title:
- language: en
  script: Latn
  content: '92/397/EEC: Commission Decision of 25 June 1992 authorizing the Italian
    Republic to apply intra- Community surveillance in respect of bananas originating
    in certain third countries and put into free circulation in the other Member States
    (Only the Italian text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '92/397/CEE: Décision de la Commission du 25 juin 1992 autorisant la République
    italienne à instaurer les mesures de surveillance intracommunautaire à l''égard
    des importations de bananes originaires de certains pays tiers et mises en libre
    pratique dans les autres États membres (Le texte en langue italienne est le seul
    faisant foi.)'
  type: main
- language: de
  script: Latn
  content: 'ENTSCHEIDUNG DER KOMMISSION vom 25. Juni 1992 mit der die Italienische
    Republik ermächtigt wird, eine innergemeinschaftliche Überwachung von aus bestimmten
    Drittländern stammenden und in den anderen Mitgliedstaaten im freien Verkehr
    befindlichen Bananen einzuführen (Nur der italienische Text ist verbindlich)
    (92/397/EWG) #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS BESLUTNING af 25. juni 1992 om bemyndigelse af Den Italienske
    Republik til at indføre foranstaltninger med henblik på tilsyn inden for Fællesskabet
    med indførsel af bananer, der har oprindelse i visse tredjelande, og som er overgået
    til fri omsætning i de øvrige medlemsstater (Kun den italienske udgave er autentisk)
    (92/397/EØF) #'
  type: main
- language: el
  script: Grek
  content: '92/397/ΕΟΚ: Απόφαση της Επιτροπής της 25ης
    Ιουνίου 1992 που επιτρέπει στην Ιταλική Δημοκρατία
    να θεσπίσει μέτρα ενδοκοινοτικής επιτήρησης
    των εισαγωγών μπανάνας, καταγωγής ορισμένων
    τρίτων χωρών, που έχουν τεθεί σε ελεύθερη κυκλοφορία
    στα υπόλοιπα κράτη μέλη'
  type: main
- language: it
  script: Latn
  content: 'DECISIONE DELLA COMMISSIONE del 25 giugno 1992 che autorizza la Repubblica
    italiana a istituire le misure di sorveglianza intracomunitaria nei confronti
    delle banane originarie di taluni paesi terzi e messe in libera pratica negli
    altri Stati membri (Il testo in lingua italiana è il solo facente fede) (92/397/CEE)
    #'
  type: main
- language: nl
  script: Latn
  content: 'BESCHIKKING VAN DE COMMISSIE van 25 juni 1992 waarbij de Italiaanse Republiek
    wordt gemachtigd maatregelen inzake intracommunautair toezicht te treffen ten
    aanzien van de invoer van bananen van oorsprong uit derde landen en die in de
    andere Lid-Staten in het vrije verkeer zijn gebracht (Slechts de tekst in de Italiaanse
    taal is authentiek) (92/397/EEG) #'
  type: main
- language: pt
  script: Latn
  content: 'DECISÃO DA COMISSÃO de 25 de Junho de 1992 que autoriza a República
    Italiana a instituir medidas de vigilância intracomunitária em relação às
    importações de bananas originárias de certos países terceiros, introduzidas
    em livre prática nos outros Estados-membros (Apenas faz fé o texto em língua
    italiana) (92/397/CEE) #'
  type: main
- language: es
  script: Latn
  content: 'DECISIÓN DE LA COMISIÓN de 25 de junio de 1992 por la que se autoriza
    a la República Italiana a establecer medidas de vigilancia intracomunitaria respecto
    a las importaciones de plátanos originarios de determinados terceros países,
    despachados a libre práctica en los demás Estados miembros (El texto en lengua
    italiana es el único auténtico) (92/397/CEE) #'
