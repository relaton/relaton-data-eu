title:
- language: en
  script: Latn
  content: '95/554/EC: Commission Decision of 12 December 1995 authorizing Member
    States to permit temporarily the marketing of forest reproductive material not
    satisfying the requirements of Council Directives 66/404/EEC and 71/161/EEC'
  type: main
- language: fr
  script: Latn
  content: '95/554/CE: Décision de la Commission, du 12 décembre 1995, autorisant
    les États membres à admettre temporairement la commercialisation de matériels
    forestiers de reproduction ne répondant pas aux exigences des directives 66/404/CEE
    et 71/161/CEE du Conseil'
  type: main
- language: de
  script: Latn
  content: '95/554/EG: Entscheidung der Kommission vom 12. Dezember 1995 zur Ermächtigung
    der Mitgliedstaaten, vorübergehend forstliches Vermehrungsgut zum Verkehr zuzulassen,
    das den Anforderungen der Richtlinien 66/404/EWG und 71/161/EWG des Rates nicht
    entspricht'
  type: main
- language: da
  script: Latn
  content: '95/554/EF: Kommissionens beslutning af 12. december 1995 om bemyndigelse
    af medlemsstaterne til midlertidigt at tillade handel med forstligt formeringsmateriale,
    der ikke opfylder kravene i Rådets direktiv 66/404/EØF og 71/161/EØF'
  type: main
- language: el
  script: Grek
  content: '95/554/ΕΚ: Απόφαση της Επιτροπής, της 12ης Δεκεμβρίου
    1995, που επιτρέπει στα κράτη μέλη να εγκρίνουν
    προσωρινώς την εμπορία δασικού πολλαπλασιαστικού
    υλικού που δεν πληροί τις απαιτήσεις των οδηγιών
    66/404/ΕΟΚ και 71/161/ΕΟΚ του Συμβουλίου'
  type: main
- language: fi
  script: Latn
  content: '95/554/EY: Komission päätös, tehty 12 päivänä joulukuuta 1995, luvan
    antamisesta jäsenvaltioille hyväksyä tilapäisesti sellaisen metsänviljelyaineiston
    pitäminen kaupan, joka ei täytä neuvoston direktiivien 66/404/ETY ja 71/161/ETY
    vaatimuksia'
  type: main
- language: it
  script: Latn
  content: '95/554/CE: Decisione della Commissione, del 12 dicembre 1995, che autorizza
    gli Stati membri ad ammettere temporaneamente la commercializzazione di materiali
    forestali di moltiplicazione non rispondenti ai requisiti prescritti dalle direttive
    66/404/CEE e 71/161/CEE del Consiglio'
  type: main
- language: nl
  script: Latn
  content: '95/554/EG: Beschikking van de Commissie van 12 december 1995 houdende
    machtiging van de Lid-Staten om tijdelijk toe te staan dat bosbouwkundig teeltmateriaal
    dat niet beantwoordt aan de vereisten van de Richtlijnen 66/404/EEG en 71/161/EEG
    van de Raad in de handel wordt gebracht'
  type: main
- language: pt
  script: Latn
  content: '95/554/CE: Decisão da Comissão, de 12 de Dezembro de 1995, que autoriza
    os Estados-membros a permitir temporariamente a comercialização de materiais
    florestais de reprodução que não satisfaçam as exigências das Directivas
    66/404/CEE e 71/161/CEE do Conselho'
  type: main
- language: es
  script: Latn
  content: '95/554/CE: Decisión de la Comisión, de 12 de diciembre de 1995, por
    la que se autoriza a los Estados miembros para permitir temporalmente la comercialización
    de material de reproducción forestal que no cumpla los requisitos de las Directivas
    66/404/CEE y 71/161/CEE del Consejo'
  type: main
- language: sv
  script: Latn
  content: '95/554/EG: Kommissionens beslut av den 12 december 1995 om bemyndigande
    för medlemsstaterna att tillfälligt tillåta saluföring av skogsodlingsmaterial
    som inte uppfyller kraven i rådets direktiv 66/404/EEG och 71/161/EEG'
