    mit Ursprung in China, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1959/92 af 14. juli 1992 om genindførelse
