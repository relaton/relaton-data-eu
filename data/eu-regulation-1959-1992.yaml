title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1959/92 of 14 July 1992 re- establishing
    the levying of customs duties on products falling within CN codes 2937 21 00 and
    2937 29 10 originating in China, to which the preferential arrangements of Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1959/92 de la Commission, du 14 juillet 1992, portant
    rétablissement de la perception des droits de douane applicables aux produits
    des codes de la nomenclature combinée 2937 21 00 et 2937 21 00 et 2937 29 10
    originaires de Chine, bénéficiaires des préférences tarifaires prévues par
    le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
