type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/196 of 13 February 2020 concerning
    the renewal of the authorisation of endo-1,4-beta-xylanase produced by Aspergillus
    niger CBS 109.713 as a feed additive for chickens for fattening, turkeys for fattening,
    turkeys reared for breeding, minor avian species (except laying birds) and ornamental
    birds and repealing Regulations (EC) No 1380/2007, (EC) No 1096/2009 and Implementing
    Regulation (EU) No 843/2012 (holder of authorisation BASF SE)
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’Exécution (UE) 2020/196 de la Commission du 13 février
    2020 concernant le renouvellement de l’autorisation de l’endo-1,4-bêta-xylanase
    produite par Aspergillus niger CBS 109.713 en tant qu’additif destiné à l’alimentation
    des poulets d’engraissement, des dindes d’engraissement, des dindons élevés
    pour la reproduction, des espèces aviaires mineures (à l’exception des oiseaux
    pondeurs) et des oiseaux d’ornement et abrogeant les règlements (CE) no 1380/2007
    et (CE) no 1096/2009 ainsi que le règlement d’exécution (UE) no 843/2012 (titulaire
    de l’autorisation: BASF SE)'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2020/196 der Kommission vom 13. Februar
    2020 zur Verlängerung der Zulassung von Endo-1,4-beta-Xylanase aus Aspergillus
    niger CBS 109.713 als Futtermittelzusatzstoff für Masthühner, Masttruthühner,
    Jungtruthühner für die Zucht, Vogelarten geringerer wirtschaftlicher Bedeutung
    (ausgenommen Legevögel) und Ziervögel sowie zur Aufhebung der Verordnungen (EG)
    Nr. 1380/2007 und (EG) Nr. 1096/2009 und der Durchführungsverordnung (EU) Nr.
    843/2012 (Zulassungsinhaber: BASF SE)'
  type: main
- language: bg
  script: Cyrl
  content: Регламент за изпълнение (ЕС) 2020/196 на Комисията
    от 13 февруари 2020 година за подновяване на разрешението
    за употреба на ендо-1,4-бета-ксиланаза, получена
    от Aspergillus niger CBS 109.713, като фуражна добавка за
    пилета за угояване, пуйки за угояване, пуйки,
    отглеждани за разплод, птичи видове с по-малко
    стопанско значение (с изключение на птици носачки)
    и декоративни птици и за отмяна на регламенти
    (ЕО) № 1380/2007, (ЕО) № 1096/2009 и Регламент за изпълнение
    (ЕС) № 843/2012 (притежател на разрешението BASF SE)
  type: main
- language: cs
  script: Latn
  content: Prováděcí nařízení Komise (EU) 2020/196 ze dne 13. února 2020 o
    obnovení povolení endo-1,4-beta-xylanázy z Aspergillus niger CBS 109.713 jako
    doplňkové látky pro výkrm kuřat, výkrm krůt, odchov krůt, menšinové
    druhy ptactva (s výjimkou nosnic) a okrasné ptactvo a o zrušení nařízení
    (ES) č. 1380/2007, (ES) č. 1096/2009 a prováděcího nařízení (EU) č. 843/2012
    (držitel povolení BASF SE)
  type: main
- language: da
  script: Latn
  content: Kommissionens Gennemførelsesforordning (EU) 2020/196 af 13. februar 2020
    om fornyelse af godkendelsen af endo-1,4-beta-xylanase produceret af Aspergillus
    niger CBS 109.713 som tilsætningsstof til foder til slagtekyllinger, slagtekalkuner,
    kalkuner opdrættet til avl, mindre udbredte fuglearter (undtagen æglæggende
    fugle) og prydfugle og om ophævelse af forordning (EF) nr. 1380/2007, (EF) nr.
    1096/2009 og gennemførelsesforordning (EU) nr. 843/2012 (indehaver af godkendelsen
    er BASF SE)
  type: main
- language: el
  script: Grek
  content: 'Εκτελεστικός Κανονισμός (ΕΕ) 2020/196 της Επιτροπής
    της 13ης Φεβρουαρίου 2020 σχετικά με την ανανέωση
    της άδειας της ενδο-1,4-β-ξυλανάσης που παράγεται
    από Aspergillus niger CBS 109.713 για χρήση ως πρόσθετης
    ύλης ζωοτροφών για κοτόπουλα προς πάχυνση,
    γαλοπούλες προς πάχυνση, γαλοπούλες εκτρεφόμενες
    για αναπαραγωγή, μικρά είδη πτηνών (εκτός από
    τα πτηνά ωοπαραγωγής) και διακοσμητικά πτηνά
    και την κατάργηση των κανονισμών (ΕΚ) αριθ.
    1380/2007, (ΕΚ) αριθ. 1096/2009 και του εκτελεστικού κανονισμού
    (ΕΕ) αριθ. 843/2012 (κάτοχος της άδειας: BASF SE)'
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusmäärus (EL) 2020/196, 13. veebruar 2020, millega pikendatakse
    luba kasutada Aspergillus niger’i CBS 109.713 abil toodetud endo-1,4-β-ksülanaasi
    broilerkanade, broilerkalkunite, aretuseks kasvatatavate kalkunite, vähem tähtsate
    linnuliikide (v.a munalinnud) ja dekoratiivlindude söödalisandina ning tunnistatakse
    kehtetuks määrused (EÜ) nr 1380/2007, (EÜ) nr 1096/2009 ja rakendusmäärus
    (EL) nr 843/2012 (loa omanik BASF SE)
  type: main
- language: fi
  script: Latn
  content: Komission Täytäntöönpanoasetus (EU) 2020/196, annettu 13 päivänä
    helmikuuta 2020, Aspergillus niger CBS 109.713 -organismin tuottaman endo-1,4-beeta-ksylanaasin
    hyväksynnän uusimisesta broilerien, lihakalkkunoiden, siitoseläimiksi kasvatettavien
    kalkkunoiden, toissijaisten lintulajien (munivia lintuja lukuun ottamatta) sekä
    koristetarkoituksissa pidettävien lintujen rehun lisäaineena sekä asetusten
    (EY) N:o 1380/2007 ja (EY) N:o 1096/2009 ja täytäntöönpanoasetuksen (EU) N:o
    843/2012 kumoamisesta(hyväksynnän haltija BASF SE)
  type: main
- language: hr
  script: Latn
  content: Provedbena Uredba Komisije (EU) 2020/196 оd 13. veljače 2020. o produljenju
    odobrenja endo-1,4-beta-ksilanaze dobivene od Aspergillus niger CBS 109.713 kao
    dodatka hrani za piliće za tov, purane za tov, purane uzgajane za rasplod, manje
    značajne vrste ptica (osim ptica nesilica) i ukrasne ptice te o stavljanju izvan
    snage uredaba (EZ) br. 1380/2007, (EZ) br. 1096/2009 i Provedbene uredbe (EU)
    br. 843/2012 (nositelj odobrenja BASF SE)
  type: main
- language: hu
  script: Latn
