    az Aspergillus niger CBS 109.713 által termelt endo-1,4-béta-xilanáz bojlercsirkék,
    hízópulykák, tenyészpulykák, kevésbé jelentős madárfajok (a tojómadarak
    kivételével), valamint díszmadarak takarmány-adalékanyagaként történő
    engedélyezésének megújításáról, továbbá az 1380/2007/EK, az 1096/2009/EK
    rendelet és a 843/2012/EU végrehajtási rendelet hatályon kívül helyezéséről
    (az engedély jogosultja: BASF SE)'
  type: main
- language: it
  script: Latn
  content: Regolamento di Esecuzione (UE) 2020/196 della Commissione del 13 febbraio
    2020 relativo al rinnovo dell’autorizzazione dell’endo-1,4-beta-xilanasi prodotta
    dall’Aspergillus niger CBS 109.713 come additivo per mangimi destinati a polli
    da ingrasso, tacchini da ingrasso, tacchini allevati per la riproduzione, specie
    avicole minori (esclusi gli uccelli ovaioli) e uccelli ornamentali e che abroga
    i regolamenti (CE) n. 1380/2007 e (CE) n. 1096/2009 e il regolamento di esecuzione
    (UE) n. 843/2012 (titolare dell’autorizzazione BASF SE)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas Regula (ES) 2020/196 (2020. gada 13. februāris),
    ar ko atjauno atļauju lietot no Aspergillus niger CBS 109.713 iegūtu endo-1,4-beta-ksilanāzi
    par barības piedevu gaļas cāļiem, gaļas tītariem, vaislas tītaru cāļiem,
    mazāk izplatītu sugu putniem (izņemot dējējputnus) un dekoratīvajiem putniem
    un ar ko atceļ Regulu (EK) Nr. 1380/2007, (EK) Nr. 1096/2009 un Īstenošanas
    regulu (ES) Nr. 843/2012 (atļaujas turētājs BASF SE)
  type: main
- language: lt
  script: Latn
  content: Komisijos Įgyvendinimo Reglamentas (ES) 2020/196 2020 m. vasario 13 d.
    dėl leidimo naudoti endo-1,4-beta-ksilanazę, gautą iš Aspergillus niger CBS
    109.713, kaip mėsinių viščiukų, mėsinių kalakutų, veislei auginamų kalakučiukų,
    retesnių rūšių paukščių (išskyrus dedeklinius paukščius) ir dekoratyvinių
    paukščių lesalų priedą atnaujinimo, kuriuo panaikinami reglamentai (EB) Nr.
    1380/2007, (EB) Nr. 1096/2009 ir Įgyvendinimo reglamentas (ES) Nr. 843/2012 (leidimo
    turėtojas – „BASF SE“)
  type: main
- language: mt
  script: Latn
  content: Regolament ta’ Implimentazzjoni tal-Kummissjoni (UE) 2020/196 tat-13
    ta’ Frar 2020 dwar it-tiġdid tal-awtorizzazzjoni tal-endo-1,4-beta-ksilanażi
    prodott mill-Aspergillus niger CBS 109.713 bħala addittiv tal-għalf għat-tiġieġ
    tas-simna, għad-dundjani tas-simna, għad-dundjani mrobbijin għat-tnissil, għal
    speċijiet minuri ta’ tjur (minbarra l-għasafar tal-bajd) u għall-għasafar
    ornamentali u li jħassar ir-Regolamenti (KE) Nru 1380/2007, (KE) Nru 1096/2009
    u r-Regolament ta’ Implimentazzjoni (UE) Nru 843/2012 (id-detentur tal-awtorizzazzjoni
    hija BASF SE)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsverordening (EU) 2020/196 van de Commissie van 13 februari 2020
