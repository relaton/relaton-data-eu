title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 1372/2005 of 19 August 2005 terminating the
    anti-dumping proceeding concerning imports of styrene-butadiene-styrene thermoplastic
    rubber originating in the Republic of Korea and Russia, terminating the interim
    review of the anti-dumping measures applicable to imports of styrene-butadiene-styrene
    thermoplastic rubber originating in Taiwan and repealing these measures
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1372/2005 du Conseil du 19 août 2005 clôturant la
    procédure antidumping concernant les importations de caoutchouc thermoplastique
    styrène-butadiène-styrène originaire de la République de Corée et de Russie,
    clôturant le réexamen intermédiaire des mesures antidumping applicables aux
    importations de caoutchouc thermoplastique styrène-butadiène-styrène originaire
    de Taïwan et abrogeant ces mesures
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1372/2005 des Rates vom 19. August 2005 zur Einstellung
    des Antidumpingverfahrens betreffend die Einfuhren von thermoplastischem Styrol-Butadien-Styrol-Kautschuk
    mit Ursprung in der Republik Korea und Russland, zur Einstellung der Interimsüberprüfung
    der Antidumpingmaßnahmen gegenüber den Einfuhren von thermoplastischem Styrol-Butadien-Styrol-Kautschuk
    mit Ursprung in Taiwan und zur Aufhebung dieser Maßnahmen
  type: main
- language: cs
  script: Latn
  content: Nařízení rady (ES) č. 1372/2005 ze dne 19. srpna 2005 o ukončení
    antidumpingového řízení týkajícího se dovozu termoplastického styren-butadien-styrenového
    kaučuku pocházejícího z Korejské republiky a Ruska, o ukončení prozatímního
    přezkumu antidumpingových opatření vztahujících se na dovoz termoplastického
    styren-butadien-styrenového kaučuku pocházejícího z Tchaj-wanu a o zrušení
    těchto opatření
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 1372/2005 af 19. august 2005 om afslutning
    af antidumpingproceduren vedrørende importen af termoplastisk styren-butadien-styren-gummi
    med oprindelse i Republikken Korea og Rusland, om afslutning af interimsundersøgelsen
    af antidumpingforanstaltningerne mod importen af termoplastisk styren-butadien-styren-gummi
    med oprindelse i Taiwan og om ophævelse af disse foranstaltninger
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1372/2005 του Συμβουλίου,
    της 19ης Αυγούστου 2005, για την περάτωση της διαδικασίας
    αντιντάμπινγκ όσον αφορά τις εισαγωγές θερμοπλαστικού
    καουτσούκ από στυρόλιο-βουταδιένιο-στυρόλιο
    καταγωγής Δημοκρατίας της Κορέας και Ρωσίας,
    για την περάτωση της ενδιάμεσης επανεξέτασης
    των μέτρων αντιντάμπινγκ που εφαρμόζονται
    στις εισαγωγές θερμοπλαστικού καουτσούκ από
    στυρόλιο-βουταδιένιο-στυρόλιο καταγωγής Ταϊβάν
    και για την κατάργηση των εν λόγω μέτρων
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 1372/2005, 19. august 2005, millega lõpetatakse
    dumpinguvastane menetlus, mis käsitleb Korea Vabariigist ja Venemaalt pärit
    termoplastilise stüreenbutadieenstüreenkummi importi, ja vahepealne läbivaatamine,
    mis käsitleb dumpinguvastaseid meetmeid Taiwanist pärit termoplastilise stüreenbutadieenstüreenkummi
    impordi suhtes, ning millega tunnistatakse need meetmed kehtetuks
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 1372/2005, annettu 19. elokuuta 2005 Korean tasavallasta
    ja Venäjältä peräisin olevan lämpömuovautuvan styreenibutadieenistyreenikumin
    tuontia koskevan polkumyynnin vastaisen menettelyn päättämisestä sekä Taiwanista
    peräisin olevan lämpömuovautuvan styreenibutadieenistyreenikumin tuontiin sovellettavien
    polkumyynnin vastaisten toimenpiteiden välivaiheen tarkastelun päättämisestä
    ja kyseisten toimenpiteiden kumoamisesta
  type: main
- language: hu
  script: Latn
  content: A Tanács 1372/2005/EK rendelete 2005. augusztus 19. a Koreai Köztársaságból
    és Oroszországból származó, hőre lágyuló sztirol-butadién-sztirol gumi
    behozatalára vonatkozó dömpingellenes eljárás megszüntetéséről, valamint
    a Tajvanból származó, hőre lágyuló sztirol-butadién-sztirol gumi behozatalára
    alkalmazandó dömpingellenes intézkedések ideiglenes felülvizsgálatának
    megszüntetéséről és ezen intézkedések hatályon kívül helyezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1372/2005 del Consiglio, del 19 agosto 2005, che chiude
    il procedimento antidumping relativo alle importazioni di gomma termoplastica
    stirene-butadiene-stirene originaria della Repubblica di Corea e della Russia,
    chiude il riesame intermedio delle misure antidumping applicabili alle importazioni
    di gomma termoplastica stirene-butadiene-stirene originaria di Taiwan e abroga
    tali misure
  type: main
- language: lv
  script: Latn
  content: Padomes Regula (EK) Nr. 1372/2005 (2005. gada 19. augusts), ar ko izbeidz
    antidempinga procedūru attiecībā uz Korejas Republikas un Krievijas izcelsmes
    stirolbutadiēnstirola termoplastiskā kaučuka importu, Taivanas izcelsmes stirolbutadiēnstirola
    termoplastiskā kaučuka importam piemērojamo starpposma pārskatu un ar ko atceļ
    šos pasākumus
  type: main
- language: lt
  script: Latn
  content: 2005 m. rugpjūčio 19 d. Tarybos reglamentas (EB) Nr. 1372/2005, nutraukiantis
    antidempingo tyrimą dėl stireno-butadieno-stireno termoplastinio kaučiuko,
    kurio kilmės šalis yra Korėjos Respublika ir Rusija, importo, nutraukiantis
    antidempingo priemonių, taikomų stireno-butadieno-stireno termoplastinio kaučiuko,
    kurio kilmės šalis yra Taivanas, importui, tarpinę peržiūrą ir panaikinantis
    šias priemones
  type: main
- language: mt
  script: Latn
  content: Regolament tal-Kunsill (KE) Nru 1372/2005 tad- 19 ta' Awwissu 2005 li jtemm
    il-proċediment anti-dumping fir-rigward ta' importazzjonijiet ta' lastku termoplastiku
    ta' l- istyrene-butadiene-styrene li joriġina fir-Repubblika tal-Korea u fir-Russja,
    li jtemm l-evalwazzjoni proviżorja tal-miżuri anti-dumping applikabbli għal
    importazzjonijiet ta' lastku termoplastiku ta' l- istyrene-butadiene-styrene li
    joriġina fit-Tajwan u li jirrevoka dawn il-miżuri
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1372/2005 van de Raad van 19 augustus 2005 tot beëindiging
    van de antidumpingprocedure betreffende de invoer van styreen-butadieen-styreen
    thermoplastisch rubber uit de Republiek Korea en Rusland en tot beëindiging van
    de tussentijdse procedure voor de eventuele herziening van de antidumpingrechten
    op styreen-butadieen-styreen thermoplastisch rubber uit Taiwan en tot intrekking
    van die rechten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 1372/2005 z dnia 19 sierpnia 2005 r. kończące
    postępowanie antydumpingowe dotyczące przywozu termoplastycznego kauczuku styreno-butadieno-styrenowego
    pochodzącego z Republiki Korei i Rosji, kończącego przegląd okresowy środków
    antydumpingowych stosowanych do przywozu termoplastycznego kauczuku styreno-butadieno-styrenowego
    pochodzącego z Tajwanu i znoszącego wymienione środki
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1372/2005 do Conselho, de 19 de Agosto de 2005, que
    encerra o processo anti-dumping relativo às importações de borracha termoplástica
    de estireno-butadieno-estireno originária da República da Coreia e da Rússia,
    que encerra o reexame intercalar das medidas anti-dumping aplicáveis às importações
    de borracha termoplástica de estireno-butadieno-estireno originária de Taiwan
    e que revoga estas medidas
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 1372/2005 z 19. augusta 2005, ktorým sa ukončuje
    antidumpingové konanie týkajúce sa dovozu styrén-butadién-styrénového termoplastického
    kaučuku s pôvodom v Kórejskej republike a Rusku, ktorým sa ukončuje predbežné
    preskúmanie antidumpingových opatrení uplatniteľných voči dovozu styrén-butadién-styrénového
    termoplastického kaučuku s pôvodom v Taiwane a ktorým sa rušia tieto opatrenia
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 1372/2005 z dne 19. avgusta 2005 o zaključku protidampinškega
    postopka glede uvoza stiren-butadien-stiren termoplastične gume s poreklom iz
    Republike Koreje in Rusije, o zaključku vmesnega pregleda protidampinških ukrepov,
    ki se uporabljajo za uvoz stiren-butadien-stiren termoplastične gume s poreklom
    iz Tajvana in o razveljavitvi teh ukrepov
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1372/2005 del Consejo, de 19 de agosto de 2005, por
    el que se da por concluido el procedimiento antidumping relativo a las importaciones
    de cauchos termoplásticos estireno-butadieno-estireno originarias de la República
    de Corea y Rusia, por el que se da por concluida la reconsideración provisional
    de las medidas antidumping aplicables a las importaciones de cauchos termoplásticos
    estireno-butadieno-estireno originarias de Taiwán y por el que se derogan dichas
    medidas
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 1372/2005 av den 19 augusti 2005 om avslutande
    av antidumpningsförfarandet beträffande import av termoplastiskt gummi av styrenbutadienstyren-typ
    med ursprung i Republiken Korea och Ryska federationen och av interimsöversynen
    av de antidumpningsåtgärder som tillämpas på import av termoplastiskt gummi
    av styrenbutadienstyren-typ med ursprung i Taiwan samt om upphävande av dessa
    åtgärder
