---
id: EUDirective199896
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Council Directive 98/96/EC of 14 December 1998 amending, inter alia, as
    regards unofficial field inspections under Directives 66/400/EEC, 66/401/EEC,
    66/402/EEC, 66/403/EEC, 69/208/EEC, 70/457/EEC and 70/458/EEC on the marketing
    of beet seed, fodder plant seed, cereal seed, seed potatoes, seed of oil and fibre
    plants and vegetable seed and on the common catalogue of varieties of agricultural
    plant species
  type: main
- language: fr
  script: Latn
  content: Directive 98/96/CE du Conseil du 14 décembre 1998 modifiant, entre autres
    quant aux inspections non officielles sur pied, les directives 66/400/CEE, 66/401/CEE,
    66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE et 70/458/CEE concernant la commercialisation
    des semences de betteraves, des semences de plantes fourragères, des semences
    de céréales, des plants de pommes de terre, des semences de plantes oléagineuses
    et à fibres et des semences de légumes, ainsi que le catalogue commun des variétés
    des espèces de plantes agricoles
  type: main
- language: de
  script: Latn
  content: Richtlinie 98/96/EG des Rates vom 14. Dezember 1998 zur Änderung unter
    anderem hinsichtlich der nichtamtlichen Feldbesichtigung nach den Richtlinien
    66/400/EWG, 66/401/EWG, 66/402/EWG, 66/403/EWG, 69/208/EWG, 70/457/EWG und 70/458/EWG
    über den Verkehr mit Betarübensaatgut, Futterpflanzensaatgut, Getreidesaatgut,
    Pflanzkartoffeln, Saatgut von Öl- und Faserpflanzen und Gemüsesaatgut sowie
    über einen gemeinsamen Sortenkatalog für landwirtschaftliche Pflanzenarten
  type: main
- language: bg
  script: Cyrl
  content: Директива 98/96/EО на Съвета от 14 декември
    1998 година относно изменение, inter alia, по отношение
    на неофициалните полски инспекции, на Директиви
    66/400/EИО, 66/401/EИО, 66/402/EИО, 66/403/EИО, 69/208/EИО, 70/457/EИО
    и 70/458/EИО относно търговията със семена от цвекло,
    фуражни култури, зърнени култури, посадъчен
    материал от картофи, семена от маслодайни и
    влакнодайни култури и семена от зеленчуци
    и общия каталог на сортовете от земеделски
    растителни видове
  type: main
- language: cs
  script: Latn
  content: Směrnice Rady 98/96/ES ze dne 14. prosince 1998, kterou se mění, mimo
    jiné ve věci neúředních inspekcí, směrnice 66/400/EHS, 66/401/EHS, 66/402/EHS,
    66/403/EHS, 69/208/EHS, 70/457/EHS a 70/458/EHS o uvádění osiva řepy, osiva
    pícnin, osiva obilovin, sadby brambor, osiva olejnin a přadných rostlin a osiva
    zeleniny na trh a o Společném katalogu odrůd druhů zemědělských rostlin
  type: main
- language: da
  script: Latn
  content: Rådets direktiv 98/96/EF af 14. december 1998 om ændring af bl.a. uofficielle
    afprøvninger i henhold til direktiv 66/400/EØF, 66/401/EØF, 66/402/EØF, 66/403/EØF,
    69/208/EØF, 70/457/EØF og 70/458/EØF om handel med bederoefrø, frø af foderplanter,
    sædekorn, læggekartofler, frø af olie- og spindplanter og grøntsagsfrø og
    om den fælles sortsliste over landbrugsplantearter
  type: main
- language: el
  script: Grek
  content: Οδηγία 98/96/ΕΚ του Συμβουλίου της 14ης Δεκεμβρίου
    1998 για την τροποποίηση, μεταξύ άλλων, των ανεπίσημων
    επιτόπου επιθεωρήσεων δυνάμει των οδηγιών
    66/400/ΕΟΚ, 66/401/ΕΟΚ, 66/402/ΕΟΚ, 66/403/ΕΟΚ, 69/208/ΕΟΚ, 70/457/ΕΟΚ
    και 70/458/ΕΟΚ που αφορούν την εμπορία σπόρων
    προς σπορά τεύτλων, κτηνοτροφικών φυτών, δημητριακών,
    γεωμήλων, ελαιούχων και κλωστικών φυτών, κηπευτικών
    και τον κοινό κατάλογο ποικιλιών καλλιεργουμένων
    φυτικών ειδών
  type: main
- language: et
  script: Latn
  content: Nõukogu direktiiv 98/96/EÜ, 14. detsember 1998, millega muudetakse muu
    hulgas mitteametliku põldtunnustamise osas direktiive 66/400/EMÜ, 66/401/EMÜ,
    66/402/EMÜ, 66/403/EMÜ, 69/208/EMÜ, 70/457/EMÜ ja 70/458/EMÜ peediseemne,
    söödakultuuride seemne, teraviljaseemne, seemnekartuli, õli- ja kiudtaimede
    seemne ja köögiviljaseemne turustamise ning ühise põllumajandustaimesortide
    kataloogi kohta
  type: main
- language: fi
  script: Latn
  content: Neuvoston direktiivi 98/96/EY, annettu 14 päivänä joulukuuta 1998, juurikkaiden
    siementen, rehukasvien siementen, viljakasvien siementen, siemenperunoiden, öljy-
    ja kuitukasvien siementen ja vihannesten siementen pitämisestä kaupan sekä
    viljelykasvilajien yleisestä lajikeluettelosta annettujen direktiivien 66/400/ETY,
    66/401/ETY, 66/402/ETY, 66/403/ETY, 69/208/ETY, 70/457/ETY ja 70/458/ETY muuttamisesta
    muun muassa epävirallisten viljelystarkastusten osalta
  type: main
- language: hr
  script: Latn
  content: Direktiva Vijeća 98/96/EZ od 14. prosinca 1998. o izmjeni, inter alia
    , u pogledu neslužbenih pregleda u polju, direktiva 66/400/EEZ, 66/401/EEZ, 66/402/EEZ,
    66/403/EEZ, 69/208/EEZ, 70/457/EEZ i 70/458/EEZ o stavljanju na tržište sjemena
    repe, sjemena krmnog bilja, sjemena žitarica, sjemenskog krumpira, sjemena uljarica
    i predivog bilja, sjemena povrća i o zajedničkom katalogu sorata poljoprivrednih
    biljnih vrsta
  type: main
- language: hu
  script: Latn
  content: A Tanács 98/96/EK irányelve (1998. december 14.) a cukorrépa-vetőmag,
    takarmánynövény-vetőmagok, a gabonavetőmagok, a vetőburgonya, az olaj- és
    rostnövények vetőmagjainak és a zöldségvetőmag forgalmazásáról, valamint
    a mezőgazdasági növényfajok közös fajtajegyzékéről szóló 66/400/EGK,
    66/401/EGK, 66/402/EGK, 66/403/EGK, 69/208/EGK, 70/457/EGK és 70/458/EGK irányelvek,
    többek között a nem hivatalos szántóföldi ellenőrzések tekintetében történő
    módosításáról
  type: main
- language: it
  script: Latn
  content: Direttiva 98/96/CE del Consiglio del 14 dicembre 1998 recante modifica,
    tra altro, per quanto riguarda le ispezioni sul campo non ufficiale, delle direttive
    66/400/CE, 66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE e 70/458/CEE
    relative alla commercializzazione delle sementi di barbabietole, delle sementi
    di piante foraggere, delle sementi di cereali, dei tuberi-seme di patata, delle
    sementi di piante oleaginose e da fibra e delle sementi di ortaggi e al catalogo
    comune delle varietà delle specie di piante agricole
  type: main
- language: lv
  script: Latn
  content: Padomes Direktīva 98/96/EK (1998. gada 14. decembris), ar ko inter alia
    groza attiecībā uz neoficiālām pārbaudēm uz lauka Direktīvas 66/400/EEK,
    66/401/EEK, 66/402/EEK, 66/403/EEK, 69/208/EEK, 70/457/EEK un 70/458/EEK par biešu
    sēklu, lopbarības augu sēklu, graudaugu sēklu, sēklas kartupeļu, eļļas
    augu un šķiedraugu sēklu un dārzeņu sēklu tirdzniecību, un par kopējo
    lauksaimniecības augu šķirņu katalogu
  type: main
- language: lt
  script: Latn
  content: 1998 m. gruodžio 14 d. Tarybos direktyva 98/96/EB, iš dalies keičianti,
    inter alia, dėl neoficialių aprobavimų Direktyvas 66/400/EEB, 66/401/EEB, 66/402/EEB,
    66/403/EEB, 69/208/EEB, 70/457/EEB ir 70/458/EEB dėl prekybos runkelių sėkla,
    pašarinių augalų sėkla, javų sėkla, sėklinėmis bulvėmis, aliejinių ir
    pluoštinių augalų sėkla bei daržovių sėkla, ir dėl bendrojo žemės ūkio
    augalų veislių katalogo
  type: main
- language: mt
  script: Latn
  content: Id-Direttiva tal-Kunsill 98/96/KE ta' l-14 ta' Diċembru 1998 li temenda,
    inter alia, f'dak li jirrigwarda l-ispezzjonijiet mhux uffiċjali fuq il-post
    skond id-Direttivi 66/400/KEE, 66/401/KEE, 66/402/KEE, 66/403/KEE, 69/208/KEE,
    70/457/KEE u 70/458/KEE dwar il-kummerċ taż-żerriegħa tal-pitravi, taż-żerriegħa
    tal-pjanti ta' l-għalf, taż-żerriegħa taċ-ċereali, tal-patata taż-żrigħ,
    taż-żerriegħa tal-pjanti taż-żejt u l-fibra u taż-żerriegħa tal-ħxejjex
    u dwar il-katalogu komuni tal-varjetajiet ta' l-ispeċi tal-pjanti agrikoli
  type: main
- language: nl
  script: Latn
  content: Richtlijn 98/96/EG van de Raad van 14 december 1998 tot wijziging onder
    andere van de niet-officiële veldkeuringen op grond van de Richtlijnen 66/400/EEG,
    66/401/EEG, 66/402/EEG, 66/403/EEG, 69/208/EEG en 70/458/EEG betreffende het in
    de handel brengen van respectievelijk bietenzaad, zaaizaad van groenvoedergewassen,
    zaaigranen, pootaardappelen, zaaizaad van oliehoudende planten en vezelgewassen,
    en groentezaad en van Richtlijn 70/457/EEG betreffende de gemeenschappelijke rassenlijst
    voor landbouwgewassen
  type: main
- language: pl
  script: Latn
  content: Dyrektywa Rady 98/96/WE z dnia 14 grudnia 1998 r. zmieniająca, między
    innymi, w odniesieniu do nieurzędowych inspekcji polowych, dyrektywy 66/400/EWG,
    66/401/EWG, 66/402/EWG, 66/403/EWG, 69/208/EWG, 70/457/EWG i 70/458/EWG w sprawie
    obrotu materiałem siewnym buraka, materiałem siewnym roślin pastewnych, materiałem
    siewnym roślin zbożowych, sadzeniakami ziemniaków, materiałem siewnym roślin
    oleistych i włóknistych oraz materiałem siewnym warzyw oraz w sprawie Wspólnego
    Katalogu Odmian Gatunków Roślin Rolniczych
  type: main
- language: pt
  script: Latn
  content: Directiva 98/96/CE do Conselho de 14 de Dezembro de 1998 que altera, nomeadamente
    no que diz respeito às inspecções não oficiais, as Directivas 66/400/CEE,
    66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE e 70/458/CEE relativas
    à comercialização de sementes de beterraba, de sementes de plantas forrageiras,
    de sementes de cereais, de batatas de semente, de sementes de plantas oleagionosas
    e de fibras, de sementes de produtos hortícolas, bem como ao catálogo comum
    das variedades das espécies de plantas agrícolas
  type: main
- language: ro
  script: Latn
  content: Directiva 98/96/CE a Consiliului din 14 decembrie 1998 de modificare, inter
    alia, cu privire la inspecțiile în câmp, a directivelor 66/400/CEE, 66/401/CEE,
    66/402/CEE, 66/403/CEE, 69/208/CEE, 70/457/CEE și 70/458/CEE privind comercializarea
    semințelor de sfeclă, semințelor de plante furajere, semințelor de cereale,
    cartofilor de sămânță, semințelor de plante oleaginoase și pentru fibre
    și a semințelor de legume, precum și Catalogul comun al soiurilor de plante
    agricole
  type: main
- language: sk
  script: Latn
  content: Smernica Rady 98/96/ES zo 14. decembra 1998, ktorá medziiným mení a
    dopĺňa, čo sa týka neoficiálnych poľných inšpekcií, smernice 66/400/EHS,
    66/401/EHS, 66/402/EHS, 66/403/EHS, 69/208/EHS, 70/457/EHS a 70/458/EHS o obchodovaní
    s osivom repy, osivom krmovín, osivom obilnín, sadivom zemiakov, osivom olejnín
    a priadnych rastlín a osivom zelenín a o spoločnom katalógu odrôd poľnohospodárskych
    rastlín
  type: main
- language: sl
  script: Latn
  content: Direktiva Sveta 98/96/ES z dne 14. decembra 1998 o spremembi, med drugim,
    glede neuradnih poljskih pregledov po direktivah 66/400/EGS, 66/401/EGS, 66/402/EGS,
    66/403/EGS, 69/208/EGS, 70/457/EGS in 70/458/EGS o trženju semena pese, semena
    krmnih rastlin, semena žit, semenskega krompirja, semena oljnic in predivnic
    in semena zelenjadnic ter o skupnem katalogu sort poljščin
  type: main
- language: es
  script: Latn
  content: Directiva 98/96/CE del Consejo de 14 de diciembre de 1998 por la que se
    modifican, en particular en lo relativo a las inspecciones no oficiales sobre
    el terreno, las Directivas 66/400/CEE, 66/401/CEE, 66/402/CEE, 66/403/CEE, 69/208/CEE,
    70/457/CEE y 70/458/CEE relativas a la comercialización de las semillas de remolacha,
    las semillas de plantas forrajeras, las semillas de cereales, las patatas de siembra,
    las semillas de plantas oleaginosas y textiles y las semillas de plantas hortícolas,
    y al Catálogo común de las variedades de las especies de plantas agrícolas
  type: main
- language: sv
  script: Latn
  content: Rådets direktiv 98/96/EG av den 14 december 1998 om ändring av bland
    annat icke-officiella fältinspektioner enligt direktiven 66/400/EEG, 66/401/EEG,
    66/402/EEG, 66/403/EEG, 69/208/EEG, 70/457/EEG och 70/458/EEG om saluföring av
    betutsäde, utsäde av foderväxter, utsäde av stråsäd, utsädespotatis, utsäde
    av olje- och spånadsväxter och utsäde av köksväxter samt om den gemensamma
    sortlistan för arter av lantbruksväxter
  type: main
