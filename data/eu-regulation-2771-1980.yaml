id: EURegulation27711980
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2771/80 of 28 October 1980 re-establishing
    the levying of customs duties on sewing machines, falling within subheading 84.41
    A I b) and originating in Brazil, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2771/80 de la Commission, du 28 octobre 1980, portant
    rétablissement de la perception des droits de douane applicables aux machines
    à coudre, de la sous-position 84.41 A I b) du tarif douanier commun, originaires
    du Brésil, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2771/80 der Kommission vom 28. Oktober 1980 zur Wiedereinführung
    des Zollsatzes für Nähmaschinen der Tarifstelle 84.41 A I b) mit Ursprung in
    Brasilien, dem die in der Verordnung (EWG) Nr. 2789/79 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2771/80 af 28. oktober 1980 om genindførelse
    af opkrævning af toldafgifter for symaskiner, under pos. 84.41 A I b), som har
    oprindelse i Brasilien og omfattes af de toldpræferencer, som er fastsat i Rådets
    forordning (EØF) nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2771/80 della Commissione, del 28 ottobre 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle macchine per cucire,
    della sottovoce 84.41 A I b) della tariffa doganale comune, originarie del Brasile
    beneficiario delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/80
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2771/80 van de Commissie van 28 oktober 1980 houdende
    wederinstelling van de heffing van de invoerrechten van toepassing op naaimachines,
    van post 84.41 A I b), van oorsprong uit Brazilië, ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad algemene tariefpreferenties werden geopend
  type: main
