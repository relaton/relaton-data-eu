title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3020/73 of the Commission of 7 November 1973 reintroducing
    Common Customs Tariff duties on cotton yarn, put up for retail sale, falling within
    heading No 55.06, originating in Yugoslavia to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 2172/73 of 8 August 1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3020/73 de la Commission, du 7 novembre 1973, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux fils de coton conditionnés pour la vente au détail, de la position tarifaire
    55.06, originaires de Yougoslavie, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2172/73 du Conseil du 8 août 1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3020/73 der Kommission vom 7. November 1973 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Baumwollgarne in Aufmachungen für
    den Einzelverkauf, der Tarifnummer 55.06, mit Ursprung in Jugoslawien, dem die
    in der Verordnung (EWG) Nr. 2172/73 des Rates vom 8. August 1973 vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 3020/73 af 7. november 1973 om genindførelse
    af tolden, ifølge den fælles toldtarif, for garn af bomuld i detailsalgsoplægninger,
    henhørende under position 55.06, der har oprindelse i Jugoslavien og omfattes
    af de toldpræferencer, som er fastsat i Rådets forordning (EØF) nr. 2172/73
    af 8. august 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3020/73 della Commissione, del 7 novembre 1973, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili ai
    filati di cotone preparati per la vendita al minuto della voce doganale n. 55.06,
    originari della Iugoslavia, beneficiaria delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2172/73 del Consiglio, dell' 8 agosto 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3020/73 van de Commissie van 7 november 1973 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op garens van katoen, gereed voor de verkoop in het klein, van
    tariefpost 55.06, van oorsprong uit Joegoslavië ten behoeve waarvan bij Verordening
    (EEG) nr. 2172/73 van de Raad van 8 augustus 1973 tariefpreferenties werden geopend
  type: main
