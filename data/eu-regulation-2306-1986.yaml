  content: Commission Regulation (EEC) No 2306/86 of 23 July 1986 re-establishing
    the levying of customs duties applicable to nuts, threaded or tapped, other than
    self-locking nuts falling within subheading 73.32 B ex II, originating in Singapore,
    to which the preferential tariff arrangements set out in Council Regulation (EEC)
    No 3599/85 apply
  type: main
- language: fr
  script: Latn
