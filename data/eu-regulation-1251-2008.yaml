    et les exigences de certification applicables à la mise sur le marché et à
    l’importation dans la Communauté d’animaux d’aquaculture et de produits
    issus de ces animaux et établissant une liste des espèces vectrices
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1251/2008 der Kommission vom 12. Dezember 2008 zur
    Durchführung der Richtlinie 2006/88/EG des Rates hinsichtlich der Bedingungen
    und Bescheinigungsvorschriften für das Inverkehrbringen und die Einfuhr in die
    Gemeinschaft von Tieren in Aquakultur und Aquakulturerzeugnissen sowie zur Festlegung
    einer Liste von Überträgerarten
  type: main
- language: bg
  script: Cyrl
