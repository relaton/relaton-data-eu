    osvědčení pro uvádění živočichů pocházejících z akvakultury a produktů
    akvakultury na trh a pro jejich dovoz do Společenství, a kterým se stanoví
    seznam druhů přenašečů
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1251/2008 af 12. december 2008 om gennemførelse
