  script: Latn
  content: Commission Regulation (EC) No 1251/2008 of 12 December 2008 implementing
    Council Directive 2006/88/EC as regards conditions and certification requirements
    for the placing on the market and the import into the Community of aquaculture
    animals and products thereof and laying down a list of vector species
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 1251/2008 de la Commission du 12 décembre 2008 portant
