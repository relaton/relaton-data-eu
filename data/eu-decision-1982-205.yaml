id: EUDecision1982205
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '82/205/EEC: Commission Decision of 22 December 1981 authorizing certain
    Member States to apply intra- Community surveillance to imports of products originating
    in a third country which have been put into free circulation in the Community
    and which may be the subject of protective measures under Article 115 of the Treaty
    (Only the French, German, Italian, Dutch, English and Danish texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '82/205/CEE: Décision de la Commission, du 22 décembre 1981, autorisant
    certains Etats membres à procéder à une surveillance intracommunautaire des
    importations de produits originaires d''un pays tiers et mis en libre pratique
    dans la Communauté, susceptibles de faire l''objet de mesures de protection au
    titre de l''article 115 du traité (Les textes en langues française, allemande,
    italienne, néerlandaise, anglaise et danoise sont les seuls faisant foi)'
  type: main
- language: de
  script: Latn
  content: '82/205/EWG: Entscheidung der Kommission vom 22. Dezember 1981 zur Ermächtigung
    bestimmter Mitgliedstaaten zur Einführung einer innergemeinschaftlichen Überwachung
    der Einfuhren von aus einem Drittland stammenden und in der Gemeinschaft im freien
    Verkehr befindlichen Waren, die Schutzmaßnahmen gemäß Artikel 115 des Vertrages
    unterworfen werden können (Nur der französische, deutsche, italienische, niederländische,
    englische und dänische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '82/205/EØF: Kommissionens beslutning af 22. december 1981 om bemyndigelse
    af visse af medlemsstaterne til at forlænge gyldighedsperioden for tilsyn inden
    for Fællesskabet med indførsel af produkter, der har oprindelse i et tredjeland
    og er overgået til fri omsætning i Fællesskabet, og som ville kunne gøres
    til genstand for beskyttelsesforanstaltninger i henhold til traktatens artikel
    115 (Kun den franske, tyske, italienske, nederlandske, engelske og danske udgave
    er autentiske)'
  type: main
- language: el
  script: Grek
  content: '82/205/EOK: Απόφαση τής Επιτροπής τής 22ας Δεκεμβρίου
    1981 περί χορηγήσεως αδείας σέ ορισμένα Κράτη
    μέλη νά προβούν σέ ενδοκοινοτική επιτήρηση
    τών εισαγωγών προϊόντων, καταγωγής τρίτης
    χώρας, τά οποία τίθενται σέ ελεύθερη κυκλοφορία
    στήν Κοινότητα καί τά οποία μπορούν νά αποτελέσουν
    αντικείμενο τών μέτρων προστασίας, δυνάμει
    τού άρθρου 115 τής συνθήκης (Τα κείμενα στην
    γαλλική, γερμανική, ιταλική, ολλανδική, αγγλική
    και δανική γλώσσα είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '82/205/CEE: Decisione della Commissione, del 22 dicembre 1981, che autorizza
    taluni Stati membri a procedere ad una sorveglianza intracomunitaria sulle importazioni
    di prodotti originari di paesi terzi e messi in libera pratica nella Comunità,
    che possono essere oggetto di misure di protezione ai sensi dell''articolo 115
    del trattato (I testi in lingua francese, tedesca, italiana, olandese, inglese
    e danese sono i soli facenti fede)'
  type: main
- language: nl
  script: Latn
  content: '82/205/EEG: Beschikking van de Commissie van 22 december 1981 houdende
    machtiging van bepaalde Lid-Staten om over te gaan tot een intracommunautair toezicht
    ten aanzien van de invoer van produkten van oorsprong uit derde landen die in
    de Gemeenschap in het vrije verkeer zijn gebracht en die het voorwerp kunnen zijn
    van beschermende maatregelen krachtens artikel 115 van het Verdrag (Slechts de
    teksten in de Franse, Duitse, Italiaanse, Nederlandse, Engelse en de Deense taal
    zijn authentiek)'
  type: main
