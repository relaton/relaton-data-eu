    up for sale by tender 225 000 tonnes of maize for export in the form of maize
    groats and meal
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n 1171/94 de la Commission, du 24 mai 1994, modifiant le
    règlement (CE) n 614/94 autorisant les organismes d'intervention français et
    allemand à mettre en adjudication 225000 tonnes de maïs en vue de l'exportation
    sous forme de gruaux et semoules de maïs
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1171/94 der Kommission vom 24. Mai 1994 zur Änderung
