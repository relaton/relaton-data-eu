    Interventionsstelle zur Ausschreibung des Verkaufs von 225 000 Tonnen Mais zur
    Ausfuhr in Form von Grob- und Feingrieß von Mais
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1171/94 af 24. maj 1994 om ændring af
