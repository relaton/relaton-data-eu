title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 2160/96 of 11 November 1996 imposing definitive
    anti-dumping duties on imports of polyester textured filament yarn originating
    in Indonesia and Thailand, terminating the proceeding concerning imports of polyester
    textured filament yarn originating in India and collecting definitively the provisional
    duties imposed
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 2160/96 du Conseil du 11 novembre 1996 instituant des
    droits antidumping définitifs sur les importations de fil continu texturé de
    polyester originaire d'Indonésie et de Thaïlande, clôturant la procédure concernant
    les importations de fil continu texturé de polyester originaire d'Inde et portant
    perception définitive des droits provisoires
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2160/96 des Rates vom 11. November 1996 zur Einführung
    endgültiger Antidumpingzölle auf die Einfuhren texturierter Polyester-Filamentgarne
    mit Ursprung in Indonesien und Thailand, zur Einstellung des Verfahrens gegenüber
    den Einfuhren texturierter Polyester-Filamentgarne mit Ursprung in Indien und
    zur endgültigen Vereinnahmung der vorläufigen Zölle
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EF) Nr. 2160/96 af 11. november 1996 om indførelse
    af en endelig antidumpingtold på importen af tekstureret garn af endeløse polyesterfibre
    med oprindelse i Indonesien og Thailand, om afslutning af proceduren vedrørende
    importen af tekstureret garn af endeløse polyesterfibre med oprindelse i Indien
    og om endelig opkrævning af den midlertidige told
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 2160/96 του Συμβουλίου
    της 11ης Νοεμβρίου 1996 για την επιβολή οριστικών
    δασμών αντιντάμπινγκ στις εισαγωγές ελαστικοποιημένων
    νημάτων από πολυεστέρα, καταγωγής Ινδονησίας
    και Ταϊλάνδης, για την περάτωση της διαδικασίας
    με αντικείμενο τις εισαγωγές ελαστικοποιημένων
    νημάτων από πολυεστέρα, καταγωγής Ινδίας, και
    για την οριστική είσπραξη των επιβληθέντων
    προσωρινών δασμών
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 2160/96, annettu 11 päivänä marraskuuta 1996,
    Indonesiasta ja Thaimaasta peräisin olevien teksturoitujen polyesterifilamenttilankojen
    tuontia koskevan lopullisen polkumyyntitullin käyttöön ottamisesta, Intiasta
    peräisin olevien teksturoitujen polyesterifilamenttilankojen tuontia koskevan
    menettelyn päättämisestä ja käyttöön otetun tullin lopullisesta kantamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 2160/96 del Consiglio dell'11 novembre 1996 che impone
    dazi antidumping definitivi sulle importazioni di filati testurizzati di poliesteri
    originari dell'Indonesia e della Thailandia, che chiude il procedimento relativo
    alle importazioni degli stessi prodotti originari dell'India e che decide la riscossione
    definitiva dei dazi provvisori imposti
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 2160/96 van de Raad van 11 november 1996 tot instelling
    van definitieve anti-dumpingrechten op de invoer van getextureerd filamentgaren
    van polyester van oorsprong uit Indonesië en Thailand, tot beëindiging van de
    procedure betreffende de invoer van getextureerd filamentgaren van polyester van
    oorsprong uit India, en tot definitieve inning van de voorlopig ingestelde rechten
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 2160/96 do Conselho de 11 de Novembro de 1996 que
    institui direitos anti-dumping definitivos sobre as importações de fios de filamentos
    texturizados de poliéster originários da Indonésia e da Tailândia, encerra
    o processo relativo às importações de fios de filamentos texturizados de poliéster
    originários da Índia e cobra definitivamente os direitos provisórios instituídos
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) nº 2160/96 del Consejo de 11 de noviembre de 1996 por
    el que se establecen derechos antidumping definitivos sobre las importaciones
    de hilados texturados de filamentos de poliéster originarias de Indonesia y de
    Tailandia, se da por terminado el procedimiento referente a las importaciones
    de hilados texturados de filamentos de poliéster originarias de la India, y se
    perciben definitivamente los derechos provisionales establecidos
  type: main
- language: sv
  script: Latn
  content: Rådets förordning (EG) nr 2160/96 av den 11 november 1996 om införande
    av en slutgiltig antidumpningstull på import av texturerat filamentgarn av polyester
    med ursprung i Indonesien och Thailand, om avslutande av förfarandet beträffande
    import av texturerat filamentgarn av polyester med ursprung i Indien och om slutgiltigt
    uttag av den preliminära antidumpningstullen
  type: main
