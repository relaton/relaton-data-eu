    certificados de importación de algunos productos del sector de la carne de porcino
    presentadas en el mes de julio de 2000 al amparo del régimen previsto en el Acuerdo
    celebrado entre la Comunidad y Eslovenia
  type: main
- language: sv
  script: Latn
  content: Kommissionens förordning (EG) nr 1583/2000 av den 19 juli 2000 om fastställande
