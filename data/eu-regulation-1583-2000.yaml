title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1583/2000 of 19 July 2000 determining the
    extent to which applications lodged in July 2000 for import licences for certain
    pigmeat products under the regime provided for by the Agreement concluded by the
    Community with Slovenia can be accepted
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 1583/2000 de la Commission du 19 juillet 2000 déterminant
    la mesure dans laquelle les demandes de certificats d'importation introduites
    en juillet 2000 pour certains produits à base de viande de porc dans le cadre
    du régime prévu par l'accord conclu par la Communauté avec la Slovénie peuvent
    être acceptées
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1583/2000 der Kommission vom 19. Juli 2000 über die
    Festsetzung des Umfangs, in dem die im Juli 2000 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Schweinefleischerzeugnisse entsprechend der Regelung des Abkommens
    zwischen der Gemeinschaft und Slowenien genehmigt werden können
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1583/2000 af 19. juli 2000 om fastsættelse
    af, i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i juli
    2000 om importlicenser for visse svinekødsprodukter i forbindelse med den ordning,
    der er fastsat i den aftale, som Fællesskabet har indgået med Slovenien
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1583/2000 της Επιτροπής,
    της 19ης Ιουλίου 2000, για καθορισμό ορίων εντός
    των οποίων δύνανται να γίνουν αποδεκτές οι
    αιτήσεις που υποβλήθηκαν τον Ιούλιο 2000 για
    πιστοποιητικά εισαγωγής χοιρείου κρέατος
    βάσει του καθεστώτος που προβλέπεται από τη
    συμφωνία που συνήψε η Κοινότητα με τη Σλοβενία
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1583/2000, annettu 19 päivänä heinäkuuta
    2000, yhteisön Slovenian kanssa tekemässä sopimuksessa määrätyn järjestelmän
    mukaisesti heinäkuussa 2000 jätettyjen tiettyjä sianlihavalmisteita koskevien
    tuontitodistushakemusten hyväksyttävyydestä
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1583/2000 della Commissione, del 19 luglio 2000, che
    stabilisce entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di luglio 2000 per taluni prodotti del settore delle carni
    suine nel quadro del regime previsto dall'accordo concluso tra la Comunità e
    la Slovenia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1583/2000 van de Commissie van 19 juli 2000 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde producten in de sector varkensvlees, die in juli 2000 worden ingediend
    op grond van de regeling die is vastgesteld in de door de Gemeenschap gesloten
    overeenkomst met Slovenië
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 1583/2000 da Comissão, de 19 de Julho de 2000, que
    determina em que medida podem ser aceites os pedidos de certificados de importação
    de determinados produtos do sector da carne de suíno apresentados em Julho de
    2000 ao abrigo do regime previsto no acordo concluído pela Comunidade com a Eslovénia
  type: main
- language: es
  script: Latn
  content: Reglamento (CE) n° 1583/2000 de la Comisión, de 19 de julio de 2000,
