title:
- language: en
  script: Latn
  content: '79/870/EEC: Commission Decision of 28 September 1979 authorizing Ireland
    not to apply Community treatment to men''s and boys''woven breeches, shorts and
    trousers (including slacks), women''s, girls''and infants''woven trousers and
    slacks of wool, of cotton or of man-made textile fibres falling within heading
    No ex 61.01 and subheading ex 61.02 B of the Common Customs Tariff (NIMEXE codes
    61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72) originating in Hong Kong and
    in free circulation in the other Member States (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/870/CEE: Décision de la Commission, du 28 septembre 1979, autorisant
    l''Irlande à exclure du traitement communautaire les culottes, "shorts" et pantalons
    tissés pour hommes et garçonnets, pantalons tissés pour femmes, fillettes et
    jeunes enfants, de laine, de coton ou de fibres textiles synthétiques et artificielles,
    de la position ex 61.01 et de la sous-position ex 61.02 B du tarif douanier commun
    (codes Nimexe: 61.01-62, 64, 66, 72, 74, 76 ; 61.02-66, 68, 72), originaires de
    Hong-kong et mis en libre pratique dans les autres Etats membres (Le texte en
    langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/870/EWG: Entscheidung der Kommission vom 28. September 1979, mit der
    Irland ermächtigt wird, aus Hongkong stammende und in den übrigen Mitgliedstaaten
    im freien Verkehr befindliche Shorts und andere kurze Hosen und lange Hosen, aus
    Geweben, für Männer und Knaben, lange Hosen aus Geweben für Frauen, Mädchen
    und Kleinkinder, aus Wolle, Baumwolle, synthetischen oder künstlichen Spinnstoffen,
    der Tarifnummern ex 61.01 und ex 61.02 B des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern
    61.01-62 ; 64 ; 66 ; 72 ; 74 ; 76 und 61.02- 66 ; 68 ; 72) von der Gemeinschaftsbehandlung
    auszuschließen (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/870/EØF: Kommissionens beslutning af 28. september 1979 om bemyndigelse
    af Irland til fra fællesskabsbehandling at undtage shorts og andre korte benklæder
    til mænd og drenge, vævede ; lange benklæder til kvinder, piger og småbørn,
    vævede af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. ex 61.01 og ex 61.02 B i den fælles toldtarif (NIMEXE-nummer 61.01-62,
    64, 66, 72, 74, 76 - 61.02-66, 68, 72), har oprindelse i Hongkong og frit kan
    omsættes i de øvrige medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/870/CEE: Decisione della Commissione, del 28 settembre 1979, che autorizza
    l''Irlanda ad escludere dal trattamento comunitario i calzoncini, shorts e pantaloni,
    tessuti, per uomo e per ragazzo, e pantaloni, tessuti, per donna, per ragazza
    e per bambini, di lana, di cotone o di fibre tessili sintetiche o artificiali,
    della voce ex 61.01 e della sottovoce ex 61.02 B della tariffa doganale comune
    (codici Nimexe: 61.01-62, 64, 66, 72, 74, 76; 61.02-66, 68, 72), originari di
    Hong Kong e messi in libera pratica negli altri Stati membri (Il testo in lingua
    inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/870/EEG: Beschikking van de Commissie van 28 september 1979 waarbij
    Ierland wordt gemachtigd shorts en andere korte broeken, lange broeken, geweven,
    voor heren en jongens, lange broeken, geweven van wol, van katoen of van synthetische
    of van kunstmatige textielvezels voor dames, meisjes en kinderen, van de posten
    ex 61.01 en ex 61.02 B van het gemeenschappelijk douanetarief (NIMEXE-code 61.01-62,
    64, 66, 72, 74, 76 ; 61.02-66, 68, 72), van oorsprong uit Hong-Kong en in de overige
    Lid-Staten in het vrije verkeer gebracht, van de communautaire behandeling uit
    te sluiten (Slechts de tekst in de Engelse taal is authentiek)'
