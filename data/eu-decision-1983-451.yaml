title:
- language: en
  script: Latn
  content: '83/451/EEC: Commission Decision of 29 August 1983 authorizing Ireland
    to apply intra-Community surveillance to imports of certain tyre cases originating
    in the German Democratic Republic, which have been put into free circulation in
    the Community (Only the English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '83/451/CEE: Décision de la Commission du 29 août 1983 autorisant l''Irlande
    à procéder à une surveillance intracommunautaire des importations de certains
    pneumatiques, originaires de la République démocratique allemande et mis en
    libre pratique dans la Communauté (Le texte en langue anglaise est le seul faisant
    foi)'
  type: main
- language: de
  script: Latn
  content: '83/451/EWG: Entscheidung der Kommission vom 29. August 1983 zur Ermächtigung
    Irlands zur Einführung einer innergemeinschaftlichen Überwachung der Einfuhren
    von aus der Deutschen Demokratischen Republik stammenden und in der Gemeinschaft
    im freien Verkehr befindlichen bestimmten Laufdecken und schlauchlosen Reifen
    (Nur der englische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '83/451/EØF: Kommissionens beslutning af 29. august 1983 om bemyndigelse
    af Irland til at indføre tilsyn inden for Fællesskabet med indførsel af visse
    dæk, (ikke massive) herunder stangstøbte med oprindelse i Den tyske demokratiske
    Republik til fri omsætning i Fællesskabet (Kun den engelske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '83/451/ΕΟΚ: Απόφαση της Επιτροπής της 29ης
    Αυγούστου 1983 περί χορηγήσεως αδείας στην Ιραλανδία
    για την καθιέρωση ενδοκοινοτικής επιβλέψεως
    των εισαγωγών επισώτρων διά πεπιεσμένου αέρος,
    καταγωγής Λαϊκής Δημοκρατίας της Γερμανίας,
    τα οποία ευρίσκονται σε ελεύθερη κυκλοφορία
    στην Κοινότητα (Το κείμενο στην αγγλική γλώσσα
    είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '83/451/CEE: Decisione della Commissione del 29 agosto 1983 che autorizza
    l''Irlanda ad istituire una sorveglianza intracomunitaria delle importazioni di
    talune coperture originarie della Repubblica democratica tedesca e messe in libera
    pratica nella Comunità (Il testo in lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '83/451/EEG: Beschikking van de Commissie van 29 augustus 1983 houdende
    machtiging van Ierland tot toepassing van een intracommunautair toezicht ten aanzien
    van de invoer van bepaalde buitenbanden, van oorsprong uit de Duitse Democratische
    Republiek, die in de Gemeenschap in het vrije verkeer zijn gebracht (Slechts de
    tekst in de Engelse taal is authentiek)'
