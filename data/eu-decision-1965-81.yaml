title:
- language: fr
  script: Latn
  content: Décision 65/81/CEE de la Commission, du 27 janvier 1965, relative au recours
    de la République française à l'article 115 alinéa 1 du Traité, pour exclure
    du traitement communautaire certains produits originaires de pays tiers et mis
    en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '65/81/EWG: Entscheidung der Kommission vom 27. Januar 1965 betreffend
    den Antrag der Französischen Republik, gemäß Artikel 115 Absatz (1) des Vertrages,
    bestimmte Erzeugnisse mit Ursprung in dritten Ländern, die in anderen Mitgliedstaaten
    zum freien Verkehr abgefertigt sind, von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '65/81/CEE: Decisione della Commissione, del 27 gennaio 1965, relativa
    al ricorso della Repubblica francese all''articolo 115, primo comma, del Trattato,
    per escludere dal trattamento comunitario determinati prodotti originari dei paesi
    terzi e immessi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '65/81/EEG: Beschikking van de Commissie van 27 januari 1965 betreffende
    het verzoek van de Franse Republiek om op grond van artikel 115, eerste alinea,
    van het Verdrag sommige produkten, die van oorsprong zijn uit derde landen en
    in de andere Lid-Staten in het vrije verkeer zijn gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
