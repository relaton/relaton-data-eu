title:
- language: en
  script: Latn
  content: 'Commission Implementing Regulation (EU) 2025/193 of 31 January 2025 concerning
    the renewal of the authorisation of a preparation of endo-1,4-beta-xylanase produced
    with Trichoderma reesei CBS 143953, subtilisin produced with Bacillus subtilis
    CBS 143946 and alpha-amylase produced with Bacillus amyloliquefaciens CBS 143954
    as a feed additive for chickens for fattening, turkeys for fattening, ducks, and
    laying hens, and the authorisation of new uses of that preparation as a feed additive
    for all other poultry species and categories (holder of authorisation: Genencor
    International B.V.) and repealing Regulation (EC) No 1087/2009 and Implementing
    Regulation (EU) No 389/2011'
  type: main
- language: fr
  script: Latn
  content: 'Règlement d’exécution (UE) 2025/193 de la Commission du 31 janvier
    2025 concernant le renouvellement de l’autorisation d’une préparation à
    base d’endo-1,4-bêta-xylanase produite par Trichoderma reesei CBS 143953, de
    subtilisine produite par Bacillus subtilis CBS 143946 et d’alpha-amylase produite
    par Bacillus amyloliquefaciens CBS 143954 en tant qu’additif pour l’alimentation
    des poulets d’engraissement, des dindons d’engraissement, des canards et des
    poules pondeuses, et l’autorisation de nouvelles utilisations de cette préparation
    en tant qu’additif pour l’alimentation de toutes les autres espèces et catégories
    de volailles (titulaire de l’autorisation: Genencor International B.V.), et
    abrogeant le règlement (CE) no 1087/2009 et le règlement d’exécution (UE)
    no 389/2011'
  type: main
- language: de
  script: Latn
  content: 'Durchführungsverordnung (EU) 2025/193 der Kommission vom 31. Januar 2025
    zur Verlängerung der Zulassung einer Zubereitung aus Endo-1,4-beta-Xylanase aus
    Trichoderma reesei CBS 143953, Subtilisin aus Bacillus subtilis CBS 143946 und
    Alpha-Amylase aus Bacillus amyloliquefaciens CBS 143954 als Futtermittelzusatzstoff
    für Masthühner, Masttruthühner, Enten und Legehennen, zur Zulassung neuer Verwendungen
    dieser Zubereitung als Futtermittelzusatzstoff für alle anderen Geflügelarten
    und -kategorien (Inhaber der Zulassung: Genencor International B.V.) sowie zur
    Aufhebung der Verordnung (EG) Nr. 1087/2009 und der Durchführungsverordnung (EU)
    Nr. 389/2011'
  type: main
- language: bg
  script: Cyrl
  content: 'Регламент за изпълнение (ЕС) 2025/193 на Комисията
    от 31 януари 2025 година за подновяване на разрешението
