    добавка за всички други видове и категории
    домашни птици (притежател на разрешението:
    Genencor International B.V.) и за отмяна на Регламент (ЕО)
    № 1087/2009 и Регламент за изпълнение (ЕС) № 389/2011'
  type: main
- language: cs
  script: Latn
  content: 'Prováděcí nařízení Komise (EU) 2025/193 ze dne 31. ledna 2025 o
