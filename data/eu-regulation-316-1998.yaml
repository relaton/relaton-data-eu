- language: en
  script: Latn
  content: Commission Regulation (EC) No 316/98 of 6 February 1998 determining the
    loss of income and the premiums applicable per ewe and per female goat in the
    Member States and the payment of the specific aid for sheep and goat farming in
    certain less-favoured areas of the Community for the 1997 marketing year
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 316/98 de la Commission du 6 février 1998 déterminant,
