    pagabile per pecora e per capra e il versamento dell'aiuto specifico a favore
    dell'allevamento ovino e caprino in talune zone svantaggiate della Comunità
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) Nr. 316/98 van de Commissie van 6 februari 1998 tot vaststelling,
