  script: Latn
  content: Commission Implementing Regulation (EU) 2026/1085 of 20 May 2026 making
    imports of certain acrylic esters originating in the People’s Republic of China,
    the Kingdom of Saudi Arabia, the Republic of South Africa, and the United States
    of America subject to registration with a view to allowing the levy of anti-dumping
    duties on the imports subject to registration
  type: main
- language: fr
