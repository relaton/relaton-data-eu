id: EUDecision1989473
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '89/473/EEC: Commission Decision of 19 July 1989 recognizing the Netherlands
    as an officially swine fever-free Member State within the context of eradication,
    amending for the third time Decision 81/400/EEC establishing the status of Member
    States as regards classical swine fever with a view to its eradication and revoking
    Decision 87/492/EEC recognizing certain parts of the territory of the Netherlands
    as being officially swine fever-free'
  type: main
- language: fr
  script: Latn
  content: '89/473/CEE: Décision de la Commission du 19 juillet 1989 reconnaissant
    les Pays-Bas comme État membre officiellement indemne de peste porcine dans le
    cadre de l''éradication, portant troisième modification de la décision 81/400/CEE
    établissant le statut des États membres en ce qui concerne la peste porcine
    classique en vue de son éradication, et abrogeant la décision 87/492/CEE reconnaissant
    certaines parties du territoire du Royaume des Pays-Bas comme officiellement indemnes
    de peste porcine'
  type: main
- language: de
  script: Latn
  content: '89/473/EWG: Entscheidung der Kommission vom 19. Juli 1989 zur Anerkennung
    der Niederlande als amtlich schweinepestfrei im Rahmen der Seuchentilgung, zur
    dritten Änderung der Entscheidung 81/400/EWG über die Festlegung des Status
    der Mitgliedstaaten hinsichtlich der Ausmerzung der klassischen Schweinepest und
    zur Aufhebung der Entscheidung 87/492/EWG, durch die bestimmte Teile des Hoheitsgebiets
    der Niederlande amtlich als schweinepestfrei anerkannt werden'
  type: main
- language: da
  script: Latn
  content: '89/473/EØF: Kommissionens Beslutning af 19. juli 1989 om anerkendelse
    af Nederlandene som værende officielt fri for svinepest i forbindelse med udryddelsen
    af denne sygdom, om tredje ændring af beslutning 81/400/EØF om fastlæggelse
    af medlemsstaternes status i forbindelse med udryddelse af klassisk svinepest
    og om ophævelse af beslutning 87/492/EØF om anerkendelse af visse dele af Nederlandenes
    område som værende officielt fri for svinepest'
  type: main
- language: el
  script: Grek
  content: '89/473/ΕΟΚ: Απόφαση της Επιτροπής της 19ης
    Ιουλίου 1989 για την αναγνώριση των Κάτω Χωρών
    ως κράτους μέλους επίσημα απαλλαγμένου από
    την πανώλη των χοίρων στο πλαίσιο του προγράμματος
    εξάλειψης της ασθένειας αυτής, για την τρίτη
    τροποποίηση της απόφασης 81/400/ΕΟΚ περί καθορισμού
    του καθεστώτος των κρατών μελών όσον αφορά
    την κλασική πανώλη των χοίρων με στόχο την
    εξάλειψή της, και για την ανάκληση της απόφασης
    87/492/ΕΟΚ σχετικά με την αναγνώριση ορισμένων
    τμημάτων του εδάφους των Κάτω Χωρών ως επίσημα
    απαλλαγμένων από την πανώλη των χοίρων'
  type: main
- language: fi
  script: Latn
  content: '89/473/ETY: Komission päätös, tehty 19 päivänä heinäkuuta 1989,
    Alankomaiden vahvistamisesta virallisesti sikarutosta vapaaksi jäsenvaltioksi
    taudin hävittämisen yhteydessä ja jäsenvaltioiden aseman vahvistamisesta klassisen
    sikaruton hävittämisen yhteydessä tehdyn päätöksen 81/400/ETY muuttamisesta
    kolmannen kerran ja Alankomaiden kuningaskunnan alueen tiettyjen osien vahvistamisesta
    virallisesti sikarutosta vapaiksi tehdyn päätöksen 87/492/ETY kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '89/473/CEE: Decisione della Commissione del 19 luglio 1989 che nel contesto
    del piano di eradicazione riconosce ufficialmente indenne dalla peste suina il
    territorio dei Paesi Bassi, modifica per la terza volta la decisione 81/400/CEE,
    che stabilisce lo status degli Stati membri nei confronti della peste suina classica
    in vista dell''eradicazione di tale malattia, ed abroga la decisione 87/492/CEE,
    che riconosce ufficialmente indenni dalla peste suina alcune parti del territorio
    del Regno dei Paesi Bassi'
  type: main
- language: nl
  script: Latn
  content: '89/473/EEG: Beschikking van de Commissie van 19 juli 1989 waarbij Nederland
    als officieel vrij van varkenspest wordt erkend in het kader van de uitroeiing
    van die ziekte, houdende derde wijziging van Beschikking 81/400/EEG houdende vaststelling
    van de status van de Lid-Staten ten aanzien van de uitroeiing van klassieke varkenspest,
    en tot intrekking van Beschikking 87/492/EEG waarbij bepaalde delen van het grondgebied
    van het Koninkrijk der Nederlanden als officieel vrij van varkenspest worden erkend'
  type: main
- language: pt
  script: Latn
  content: '89/473/CEE: Decisão da Comissão de 19 de Julho de 1989 que reconhece
    o Reino dos Países Baixos como um Estado- membro oficialmente indemne de peste
    suína no contexto da erradicação da doença, altera pela terceira vez a Decisão
    81/400/CEE, que estabelece o estatuto dos Estados-membros relativo à peste suína
    clássica para erradicação desta, e revoga a Decisão 87/492/CEE, que reconhece
    determinadas partes do território do Reino dos Países Baixos como sendo oficialmente
    indemnes de peste suína'
  type: main
- language: es
  script: Latn
  content: '89/473/CEE: Decisión de la Comisión de 19 de julio de 1989 por la que,
    en el marco de un plan de erradicación, se reconoce a los Países Bajos como
    Estado miembro oficialmente indemne de peste porcina, se modifica por tercera
    vez la Decisión 81/400/CEE, por la que se establece el estatuto de los Estados
    miembros en lo que respecta a la peste porcina clásica a fin de lograr su erradicación,
    y se revoca la Decisión 87/492/CEE por la que se reconoce que determinadas partes
    del territorio del Reino de los Países Bajos están oficialmente indemnes de
    peste porcina'
  type: main
- language: sv
  script: Latn
  content: '89/473/EEG: Kommissionens beslut av den 19 juli 1989 om erkännande av
    Nederländerna som en medlemsstat officiellt fri från svinpest i samband med
    sjukdomens utrotning, om tredje ändringen av beslut 81/400/EEG om fastställande
    av medlemsstaternas status ifråga om bekämpningen av klassisk svinpest och om
    återkallande av beslut 87/492/EEG om erkännande av vissa delar av Nederländernas
    territorium som officiellt fria från svinpest'
  type: main
