    2023 refusant l’approbation du phosphate d’argent, de sodium, d’hydrogène
    et de zirconium en tant que substance active destinée à être utilisée dans
    des produits biocides relevant du type de produits 4 conformément au règlement
    (UE) no 528/2012 du Parlement européen et du Conseil
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2023/2052 der Kommission vom 25. September
    2023 zur Nichtgenehmigung von Silber-Natrium-Hydrogen-Zirconium-Phosphat als alten
    Wirkstoff zur Verwendung in Biozidprodukten der Produktart 4 gemäß der Verordnung
    (EU) Nr. 528/2012 des Europäischen Parlaments und des Rates
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2023/2052 на Комисията
