    водороден натриев сребърен циркониев фосфат
    като съществуващо активно вещество за употреба
    в биоциди от продуктов тип 4 в съответствие
    с Регламент (ЕС) № 528/2012 на Европейския парламент
    и на Съвета
  type: main
- language: cs
  script: Latn
