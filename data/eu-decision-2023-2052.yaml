title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2023/2052 of 25 September 2023 not
    approving silver sodium hydrogen zirconium phosphate as an existing active substance
    for use in biocidal products of product-type 4 in accordance with Regulation (EU)
    No 528/2012 of the European Parliament and of the Council
  type: main
- language: fr
  script: Latn
