    stávající účinná látka pro použití v biocidních přípravcích typu
    4 v souladu s nařízením Evropského parlamentu a Rady (EU) č. 528/2012
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2023/2052 af 25. september
