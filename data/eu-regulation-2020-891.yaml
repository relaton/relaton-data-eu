  script: Latn
  content: Commission Implementing Regulation (EU) 2020/891 of 26 June 2020 amending
    Implementing Regulation (EU) No 447/2014 as regards specific provisions to align
    the provisions for the implementation of cross-border cooperation programmes financed
    under the Instrument for Pre-accession Assistance (IPA) with specific measures
    in response to the COVID-19 pandemic
  type: main
- language: fr
  script: Latn
