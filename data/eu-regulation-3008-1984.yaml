  content: Commission Regulation (EEC) No 3008/84 of 26 October 1984 amending for
    the fifth time Regulation (EEC) No 2657/80 on the determination of prices of fresh
    or chilled sheep carcases on representative Community markets and the survey of
    prices of certain other qualities of sheep carcases in the Community
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3008/84 de la Commission du 26 octobre 1984 portant
    cinquième modification du règlement (CEE) no 2657/80 relatif à la détermination
    des prix des carcasses d' ovins fraîches ou réfrigérées constatés sur les
    marchés représentatifs de la Communauté et au relevé des prix de certaines
    autres qualités de carcasses d' ovins dans la Communauté
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3008/84 der Kommission vom 26. Oktober 1984 zur fünften
    Änderung der Verordnung (EWG) Nr. 2657/80 zur Bestimmung der auf den repräsentativen
    Märkten der Gemeinschaft festgestellten Preise für frische oder gekühlte Tierkörper
    von Schafen und zur Ermittlung der Preise einiger anderer Qualitäten von Tierkörpern
    von Schafen in der Gemeinschaft
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3008/84 af 26. oktober 1984 om femte
    ændring af forordning (EØF) nr. 2657/80 om bestemmelse af priserne for ferske
    eller kølede fårekroppe, der konstateres på Fællesskabets repræsentative
    markeder, og om registrering af priserne for visse andre fårekroppekvaliteter
    i Fællesskabet
  type: main
- language: el
  script: Grek
