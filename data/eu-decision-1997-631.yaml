    είναι πλήρης ο φάκελος ο οποίος έχει υποβληθεί
    για λεπτομερή εξέταση ενόψει της ενδεχόμενης
    καταχώρησης της ουσίας flumioxazine στο παράρτημα
    Ι της οδηγίας 91/414/ΕΟΚ του Συμβουλίου όσον αφορά
    τη διάθεση στην αγορά φυτοπροστατευτικών προϊόντων'
  type: main
- language: fi
  script: Latn
