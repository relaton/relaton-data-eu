title:
- language: en
  script: Latn
  content: '97/631/EC: Commission Decision of 12 September 1997 recognizing in principle
    the completeness of the dossier submitted for detailed examination in view of
    the possible inclusion of flumioxazine in Annex I to Council Directive 91/414/EEC
    concerning the placing of plant protection products on the market'
  type: main
- language: fr
  script: Latn
  content: '97/631/CE: Décision de la Commission du 12 septembre 1997 reconnaissant
    en principe la conformité du dossier transmis pour examen détaillé en vue de
    l''inscription de la flumioxazine à l''annexe I de la directive 91/414/CEE du
    Conseil concernant la mise sur le marché des produits phytopharmaceutiques'
  type: main
- language: de
  script: Latn
  content: '97/631/EG: Entscheidung der Kommission vom 12. September 1997 über die
    grundsätzliche Anerkennung der Vollständigkeit der Unterlagen, die zur eingehenden
    Prüfung im Hinblick auf eine etwaige Aufnahme von Flumioxazin in Anhang I der
    Richtlinie 91/414/EWG des Rates über das Inverkehrbringen von Pflanzenschutzmitteln
    eingereicht wurden'
  type: main
- language: da
  script: Latn
  content: '97/631/EF: Kommissionens beslutning af 12. september 1997 om principiel
    anerkendelse af, at det dossier, som er forelagt til grundig behandling med henblik
    på eventuel optagelse af flumioxazin i bilag I til Rådets direktiv 91/414/EØF
    om markedsføring af plantebeskyttelsesmidler, er fuldstændigt'
  type: main
- language: el
  script: Grek
  content: '97/631/ΕΚ: Απόφαση της Επιτροπής της 12ης Σεπτεμβρίου
