  script: Latn
  content: Commission Regulation (EC) No 169/2008 of 25 February 2008 excluding ICES
    Subdivisions 27 and 28.2 from certain fishing effort limitations and recording
    obligations for 2008, pursuant to Council Regulation (EC) No 1098/2007 establishing
    a multiannual plan for the cod stocks in the Baltic Sea and the fisheries exploiting
    those stocks
