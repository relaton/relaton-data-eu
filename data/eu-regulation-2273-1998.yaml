  content: Commission Regulation (EC) No 2273/98 of 22 October 1998 determining the
    extent to which the applications for import licences submitted in October 1998
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 1374/98 can be accepted
  type: main
- language: fr
  script: Latn
