title:
- language: en
  script: Latn
  content: '94/502/EC: Commission Decision of 27 July 1994 on the eligibility of expenditure
    to be incurred by Belgium, Denmark, Germany, Greece, Spain, France, Ireland, the
    Netherlands and the United Kingdom on the implementation of pilot projects involving
    the use of continuous position monitoring systems for fishing vessels (Only the
    Spanish, Danish, German, Greek, English, French and Dutch texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '94/502/CE: Décision de la Commission, du 27 juillet 1994, relative à
    l''éligibilité des dépenses à effectuer par la Belgique, le Danemark, l''Allemagne,
    la Grèce, l''Espagne, la France, l''Irlande, les Pays-Bas et le Royaume-Uni pour
    la mise en oeuvre des projets pilotes relatifs à l''utilisation de systèmes
    de localisation continue des navires de pêche (Les textes en langues espagnole,
    danoise, allemande, grecque,anglaise, française et néerlandaise sont les seuls
    faisant foi)'
  type: main
- language: de
  script: Latn
  content: '94/502/EG: Entscheidung der Kommission vom 27. Juli 1994 über die Erstattungsfähigkeit
    von Ausgaben Belgiens, Dänemarks, Deutschlands, Griechenlands, Spaniens, Frankreichs,
    Irlands, der Niederlande und des Vereinigten Königreichs für die Durchführung
    von Pilotvorhaben zur Verwendung von Systemen der kontinuierlichen Ortung von
    Fischereifahrzeugen (Nur der spanische, dänische, deutsche, griechische, englische,
    französische und niederländische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '94/502/EF: Kommissionens beslutning af 27. juli 1994 om refusionsberettigelsen
