    af pilotprojekter vedrørende et system med automatisk registrering af fiskerfartøjers
    position (Kun de spanske, danske, tyske, græske, engelske, franske og nederlandske
    udgaver er autentiske)'
  type: main
- language: el
  script: Grek
  content: '94/502/ΕΚ: Απόφαση της Επιτροπής της 27ης Ιουλίου
