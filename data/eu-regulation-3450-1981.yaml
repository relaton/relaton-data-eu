title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 3450/81 of 2 December 1981 re-establishing
    the levying of customs duties on other footwear, falling within subheading 64.02
    B and originating in the Philippines, to which the preferential tariff arrangements
    set out in Council Regulation (EEC) No 3322/80 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3450/81 de la Commission, du 2 décembre 1981, portant
    rétablissement de la perception des droits de douane applicables aux autres chaussures
    de la sous-position 64.02 B du tarif douanier commun, originaires des Philippines,
    bénéficiaires des préférences tarifaires prévues par le règlement (CEE)
    n° 3322/80 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3450/81 der Kommission vom 2. Dezember 1981 zur Wiedereinführung
    der Erhebung der Zölle für andere Schuhe der Tarifstelle 64.02 B, mit Ursprung
    in den Philippinen, denen die in der Verordnung (EWG) Nr. 3322/80 des Rates vorgesehenen
    Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 3450/81 af 2. december 1981 om genindførelse
    af opkrævning af told for andet fodtøj, henhørende under pos. 64.02 B og med
    oprindelse i Filippinerne, som er præferenceberettiget i henhold til Rådets
    forordning (EØF) nr. 3322/80
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK) αριθ. 3450/81 τής Επιτροπής
    τής 2ας Δεκεμβρίου 1981 περί αποκαταστάσεως τής
    εφαρμογής τών δασμών γιά τά έτερα υποδήματα
    τής δασμολογικής διακρίσεως 64. 02 Β, καταγωγής
    Φιλιππίνων, δικαιούχου τών προβλεπομένων από
    τόν κανονισμό (EOK) αριθ. 3322/80 τού Συμβουλίου
    δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3450/81 della Commissione, del 2 dicembre 1981, che
    ripristina la riscossione dei dazi doganali applicabili alle altre calzature della
    sottovoce 64.02 B della tariffa doganale comune, originarie delle Filippine beneficiarie
    delle preferenze tariffarie previste dal regolamento (CEE) n. 3322/80 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3450/81 van de Commissie van 2 december 1981 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op ander schoeisel,
    van postonderverdeling 64.02 B, van oorsprong uit de Filippijnen, waarvoor de
    in Verordening (EEG) nr. 3322/80 van de Raad vermelde tariefpreferenties zijn
    verleend
