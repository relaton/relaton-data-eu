    на въвеждането в Съюза на естествено или изкуствено
    получени миниатюрни форми на растения за засаждане
    от родовете Chamaecyparis Spach, Juniperus L. и от някои видове
    от рода Pinus L. с произход от Япония и за отмяна
    на Решение 2002/887/ЕО
  type: main
- language: cs
  script: Latn
