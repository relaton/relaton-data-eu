    nebo uměle zakrslých rostlin do Unie za účelem pěstování Chamaecyparis
    Spach, Juniperus L. a některých druhů Pinus L. původem z Japonska, a kterým
    se zrušuje rozhodnutí 2002/887/ES
  type: main
