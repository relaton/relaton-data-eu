title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2020/1217 of 25 August 2020 on
    a derogation from Implementing Regulation (EU) 2019/2072 concerning the introduction
    into the Union of naturally or artificially dwarfed plants for planting of Chamaecyparis
    Spach, Juniperus L. and certain species of Pinus L., originating in Japan, and
    repealing Decision 2002/887/EC
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2020/1217 de la Commission du 25 août 2020
    relatif à une dérogation au règlement d’exécution (UE) 2019/2072 en ce qui
    concerne l’introduction dans l’Union de végétaux dont la croissance est
    inhibée naturellement ou artificiellement destinés à la plantation, de Chamaecyparis
    Spach, de Juniperus L. et de certaines espèces de Pinus L., originaires du Japon,
    et abrogeant la décision 2002/887/CE
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2020/1217 der Kommission vom 25. August 2020
    über eine Ausnahme von der Durchführungsverordnung (EU) 2019/2072 hinsichtlich
    der Einführung in die Union von auf natürliche oder künstliche Weise kleinwüchsig
    gehaltenen, zum Anpflanzen bestimmten Pflanzen von Chamaecyparis Spach, Juniperus
    L. und bestimmten Arten von Pinus L. mit Ursprung in Japan und zur Aufhebung der
    Entscheidung 2002/887/EG
  type: main
- language: bg
  script: Cyrl
