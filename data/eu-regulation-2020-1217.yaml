    Chamaecyparis Spach, Juniperus L. og visse arter af Pinus L., med oprindelse i
    Japan, og om ophævelse af beslutning 2002/887/EF
  type: main
- language: el
  script: Grek
  content: Εκτελεστικός κανονισμός (ΕΕ) 2020/1217 της Επιτροπής
