    származó Chamaecyparis Spach, Juniperus L. természetes úton vagy mesterségesen
    törpésített, ültetésre szánt növényeinek és a Pinus L. egyes fajainak
    az Unióba történő behozatala tekintetében és a 2002/887/EK határozat hatályon
    kívül helyezéséről
  type: main
- language: it
  script: Latn
