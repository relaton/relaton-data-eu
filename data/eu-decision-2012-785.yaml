title:
- language: en
  script: Latn
  content: Commission Implementing Decision of 13 December 2012 approving certain
    amended programmes for the eradication and monitoring of animal diseases and zoonoses
    for the year 2012 and amending Implementing Decision 2011/807/EU as regards the
    financial contribution by the Union for certain programmes approved by that Decision
    (notified under document C(2012) 9264)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution de la Commission du 13 décembre 2012 portant
