title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 3648/83 of 19 December 1983 imposing a definitive
    anti-dumping duty on imports of hardboard originating in Czechoslovakia and Poland
    and definitively collecting the amounts secured by way of a provisional anti-dumping
    duty on certain imports of hardboard originating in Sweden
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 3648/83 du Conseil du 19 décembre 1983 instituant
    un droit anti-dumping définitif sur les importations de panneaux durs originaires
    de Tchécoslovaquie et de Pologne et prévoyant la perception définitive des
    sommes versées au titre du droit anti-dumping provisoire sur certaines importations
    de panneaux durs originaires de Suède
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3648/83 des Rates vom 19. Dezember 1983 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Hartplatten mit Ursprung
    in der Tschechoslowakei und Polen und zur Vereinnahmung der für den vorläufigen
    Antidumpingzoll auf bestimmte Einfuhren von Hartplatten mit Ursprung in Schweden
    hinterlegten Beträge
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 3648/83 af 19. december 1983 om indførelse
    af en endelig antidumpingtold på importen af hårde plader med oprindelse i Tjekkoslovakiet
    og Polen og om endelig opkrævning af de beløb, for hvilke der er stillet sikkerhed
    i form af midlertidig told på importen af visse typer hårde plader med oprindelse
    i Sverige
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 3648/83 του Συμβουλίου
    της 19ης Δεκεμβρίου 1983 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές οικοδομικών
    πλακών—διαφραγμάτων εξ ινών (hardboard), καταγωγής
    Τσεχοσλοβακίας και Πολωνίας, και την οριστική
    είσπραξη των ποσών που αποτέλεσαν αντικείμενο
    εγγύησης υπό τη μορφή προσωρινού δασμού αντιντάμπινγκ
    σε ορισμένες εισαγωγές hardboard καταγωγής Σουηδίας
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3648/83 del Consiglio del 19 dicembre 1983 che istituisce
    un dazio antidumping definitivo sulle importazioni di cartone di fibra compresso
    originarie della Cecoslovacchia e della Polonia e che riscuote definitivamente
    gli importi depositati a garanzia del dazio provvisorio su talune importazioni
    di cartone di fibra compresso originario della Svezia
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3648/83 van de Raad van 19 december 1983 houdende
    instelling van een definitief anti-dumpingrecht op de invoer van hardboard van
    oorsprong uit Tsjechoslowakije en Polen en definitieve inning van de bedragen
    van de gestelde waarborgen voor het voorlopige recht op bepaalde invoer van hardboard
    van oorsprong uit Zweden
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 3648/83 do Conselho, de 19 de Dezembro de 1983,
    que institui um direito "anti-dumping" definitivo sobre as importações de painéis
    duros originários da Checoslováquia e da Polónia e determina a cobrança definitiva
    das quantias pagas a título do direito "anti-dumping" provisório sobre certas
    importações de painéis duros originários da Suécia
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 3648/83 del Consejo, de 19 de diciembre de 1983, por
    el que se establece un derecho antidumping definitivo sobre las importaciones
    de tableros duros originarios de Checoslovaquia y de Polonia y por el que se prevé
    la percepción definitiva de las cantidades pagadas en concepto de derecho antidumping
    provisional sobre determinadas importaciones de tableros duros originarios de
    Suecia
  type: main
