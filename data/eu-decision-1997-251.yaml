id: EUDecision1997251
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: '97/251/EC: Commission Decision of 14 April 1997 terminating the anti-dumping
    proceeding concerning imports of certain types of electronic microcircuits known
    as EPROMs (erasable programmable read only memories) originating in Japan and
    repealing the anti- dumping measures imposed on such imports'
  type: main
- language: fr
  script: Latn
  content: '97/251/CE: Décision de la Commission du 14 avril 1997 clôturant la procédure
    antidumping concernant les importations de certains types de microcircuits électroniques
    dits «EPROM» (mémoires fixes effaçables et reprogrammables) originaires du
    Japon et abrogeant les mesures antidumping instituées sur ces importations'
  type: main
- language: de
  script: Latn
  content: '97/251/EG: Beschluß der Kommission vom 14. April 1997 über die Einstellung
    des Antidumpingverfahrens betreffend die Einfuhren bestimmter elektronischer Mikroschaltungen,
    sogenannter EPROMs (löschbare, programmierbare Nur-Lese-Speicher), mit Ursprung
    in Japan und über das Auslaufen der für diese Einfuhren geltenden Antidumpingmaßnahmen'
  type: main
- language: da
  script: Latn
  content: '97/251/EF: Kommissionens Afgørelse af 14. april 1997 om afslutning af
    antidumpingproceduren vedrørende importen af visse typer elektroniske mikrokredsløb,
    såkaldte EPROMs (Erasable Programmable Read Only Memories) med oprindelse i Japan
    og om ophævelse af antidumpingforanstaltningerne vedrørende sådan import'
  type: main
- language: el
  script: Grek
  content: '97/251/ΕΚ: Απόφαση της Επιτροπής της 14ης Απριλίου
    1997 για περάτωση της διαδικασίας αντιντάμπινγκ
    σχετικά με τις εισαγωγές ορισμένων τύπων ηλεκτρονικών
    μικροκυκλωμάτων γνωστών ως EPROM (διαγραφόμενες
    προγραμματιζόμενες μνήμες μόνο ανάγνωσης)
    καταγωγής Ιαπωνίας και για την αναστολή των
    μέτρων αντιντάμπινγκ που επιβλήθηκαν στις
    εν λόγω εισαγωγές'
  type: main
- language: fi
  script: Latn
  content: '97/251/EY: Komission päätös, tehty 14 päivänä huhtikuuta 1997, tietyn
    tyyppisten Japanista peräisin olevien elektronisten mikropiirien, niin sanottujen
    EPROMien (erasable programmable read only memories), tuontia koskevan polkumyynnin
    vastaisen menettelyn päättämisestä ja kyseiseen tuontiin sovellettavien polkumyynnin
    vastaisten toimenpiteiden kumoamisesta'
  type: main
- language: it
  script: Latn
  content: '97/251/CE: Decisione della Commissione del 14 aprile 1997 che chiude l''inchiesta
    antidumping relativa alle importazioni di alcuni tipi di microcircuiti elettronici
    detti EPROM (erasable programmable read only memories - memorie a sola lettura
    cancellabili e programmabili) originari del Giappone e che abroga le misure antidumping
    istituite nei confronti di dette importazioni'
  type: main
- language: nl
  script: Latn
  content: '97/251/EG: Besluit van de Commissie van 14 april 1997 tot beëindiging
    van de antidumpingprocedure betreffende de invoer van bepaalde soorten elektronische
    microstructuren, zogenaamde EPROM''s (Erasable Programmable Read Only Memories)
    van oorsprong uit Japan en tot intrekking van de ten aanzien van deze invoer ingestelde
    antidumpingmaatregelen'
  type: main
- language: pt
  script: Latn
  content: '97/251/CE: Decisão da Comissão de 14 de Abril de 1997 que encerra o
    processo anti-dumping relativo às importações de certos tipos de microcircuitos
    electrónicos conhecidos por EPROM (memórias programáveis apagáveis exclusivamente
    de leitura) originários do Japão e que revoga as medidas anti-dumping instituídas
    sobre as referidas importações'
  type: main
- language: es
  script: Latn
  content: '97/251/CE: Decisión de la Comisión de 14 de abril de 1997 por la que
    se da por concluido el procedimiento antidumping con respecto a las importaciones
    de determinados tipos de microcircuitos electrónicos conocidos como EPROM (memorias
    exclusivamente de lectura programables borrables) originarios de Japón y por
    el que se derogan las medidas antidumping impuestas a tales importaciones'
  type: main
- language: sv
  script: Latn
  content: '97/251/EG: Kommissionens beslut av den 14 april 1997 om avslutande av
    antidumpningsförfarandet rörande import av vissa slags elektroniska mikrokretsar
    som benämns EPROM (raderbara, programmerbara läsminnen) med ursprung i Japan
    samt om upphävande av de antidumpningsåtgärder som införts mot sådan import'
  type: main
