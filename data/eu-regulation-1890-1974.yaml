id: EURegulation18901974
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1890/74 of the Commission of 19 July 1974 re-establishing
    the levying of customs duties on men's and boys' under garments, including collars,
    shirt fronts and cuffs, of cotton fabric, falling within heading No ex 61.03 of
    the Common Customs Tariff, originating in developing countries, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 3503/73 of 18 December
    1973 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1890/74 de la Commission, du 19 juillet 1974, portant
    rétablissement de la perception des droits de douane applicables aux vêtements
    de dessous (linge de corps) pour hommes et garçonnets, y compris les cols, faux
    cols, plastrons et manchettes, en tissus de coton, de la position tarifaire EX
    61.03, originaires des pays en voie de développement bénéficiaires des préférences
    tarifaires prévues par le règlement (CEE) n° 3503/73 du Conseil du 18 décembre
    1973
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1890/74 der Kommission vom 19. Juli 1974 über die
    Wiedereinführung des Zollsatzes für Unterkleidung (Leibwäsche) für Männer
    und Knaben, auch Kragen, Vorhemden und Manschetten, aus Baumwolle, der Tarifnummer
    ex 61.03, mit Ursprung in Entwicklungsländern, denen die in der Verordnung (EWG)
    Nr. 3503/73 des Rates vom 18. Dezember 1973 vogesehenen Zollpräferenzen gewährt
    werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 1890/74 af 19. juli 1974 om genindførelse
    af opkrævning af toldafgifter for underbeklædningsgenstande til mænd og drenge
    (herunder flipper, skjortebryster og manchetter), varer af bomuld, under position
    ex 61.03, som har oprindelse i udviklingslande og omfattes af de toldpræferencer,
    der er fastsat i Rådets forordning (EØF) nr. 3503/73 af 18. december 1973
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1890/74 della Commissione, del 19 luglio 1974, che
    ripristina la riscossione dei dazi doganali applicabili alle sottovesti (biancheria
    da dosso) per uomo e per ragazzo, compresi i colli, colletti, sparati e polsini,
    in tessuti di cotone, della voce doganale n. ex 61.03, originari dei paesi in
    via di sviluppo, beneficiari delle preferenze tariffarie previste dal regolamento
    (CEE) n. 3503/73 del Consiglio, del 18 dicembre 1973
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1890/74 van de Commissie van 19 juli 1974 houdende
    wederinvoering van de heffing van de douanerechten van toepassing op herenonderkleding
    en jongensonderkleding, kragen, boorden, fronten en manchetten daaronder begrepen,
    van weefsels van katoen, van tariefpost ex 61.03, van oorsprong uit de ontwikkelingslanden
    ten behoeve waarvan bij Verordening (EEG) nr. 3503/73 van de Raad van 18 december
    1973 algemene tariefpreferenties werden geopend
  type: main
