title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 1198/88 of 25 April 1988 imposing a definitive
    anti-dumping duty on imports of roller chains for cycles originating in the People'
    s Republic of China and providing for the definitive collection of the provisional
    anti-dumping duty on the said imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1198/88 du Conseil du 25 avril 1988 instituant un
    droit antidumping définitif sur les importations de chaînes à rouleaux pour
    cycles originaires de la République populaire de Chine et portant perception
    définitive du droit antidumping provisoire institué sur ces importations
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1198/88 des Rates vom 25. April 1988 zur Einführung
    eines endgültigen Antidumpingzolls auf die Einfuhren von Rollenketten für Fahrräder
    mit Ursprung in der Volksrepublik China und zur endgültigen Vereinnahmung des
    auf diese Einfuhren erhobenen vorläufigen Antidumpingzolls
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 1198/88 af 25. april 1988 om indførelse
    af en endelig antidumpingtold på importen af rullekæder til cykler med oprindelse
    i Den Kinesiske Folkerepublik og om endelig opkrævning af den midlertidige antidumpingtold
    på denne import
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1198/88 του Συμβουλίου
    της 25ης Απριλίου 1988 για την επιβολή οριστικού
    δασμού αντιντάμπινγκ στις εισαγωγές αλυσίδων
    με κυλίνδρους για ποδήλατα, καταγωγής Λαϊκής
    Δημοκρατίας της Κίνας, και για την οριστική
    είσπραξη του προσωρινού δασμού αντιντάμπινγκ
    που έχει επιβληθεί στις εισαγωγές αυτές
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1198/88 del Consiglio del 25 aprile 1988 che istituisce
    un dazio antidumping definitivo sulle importazioni di catene a rulli per biciclette
    originarie della Repubblica popolare cinese e che decide la riscossione definitiva
    del dazio antidumping provvisorio istituito sugli stessi prodotti
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1198/88 van de Raad van 25 april 1988 tot instelling
    van een definitief anti-dumpingrecht op de invoer van rolkettingen voor rijwielen,
    van oorsprong uit de Volksrepubliek China, en tot definitieve inning van het op
    deze invoer ingestelde voorlopige anti-dumpingrecht
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1198/88 do Conselho de 25 de Abril de 1988 que introduz
    um direito antidumping definitivo sobre as importações de correntes de rolos
    para ciclos originários da República Popular da China e que estabelece a cobrança
    definitiva do direito antidumping provisório introduzido sobre essas importações
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1198/88 del Consejo de 25 de abril de 1988 por el
    que se establece un derecho antidumping definitivo sobre las importaciones de
    cadenas de rodillos para bicicletas originarias de la República Popular de China
    y por el que se fija la percepción definitiva del derecho antidumping provisional
    establecido sobre estas importaciones
  type: main
