    den Wiederverkauf auf dem Binnenmarkt auf 895 911 Tonnen Getreide aus Beständen
    der spanischen Interventionsstelle
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 2972/94 af 6. december 1994 om ændring
