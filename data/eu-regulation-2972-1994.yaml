    pour la revente sur le marché intérieur de céréales détenues par l'organisme
    d'intervention espagnol
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 2972/94 der Kommission vom 6. Dezember 1994 zur Änderung
