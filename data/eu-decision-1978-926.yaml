title:
- language: en
  script: Latn
  content: '78/926/EEC: Commission Decision of 20 October 1978 authorizing the United
    Kingdom not to apply Community treatment to woven fabrics of synthetic fibres
    (discontinuous or waste) other than narrow woven fabrics, pile fabrics including
    terry fabrics and chenille fabrics falling within subheading 56.07 A of the Common
    Customs Tariff (NIMEXE codes 56.07-01, 04, 05, 07, 08, 11, 13, 14, 16, 17, 18,
    21, 23, 24, 26, 27, 28, 32, 33, 34, 36) originating in Taiwan and in free circulation
    in the other Member States'
  type: main
- language: fr
  script: Latn
  content: '78/926/CEE: Décision de la Commission, du 20 octobre 1978, autorisant
    le Royaume-Uni à exclure du traitement communautaire les tissus de fibres textiles
    synthétiques discontinues autres que rubanerie, velours, peluches, tissus bouclés
    (y compris les tissus bouclés du genre éponge) et tissus de chenille de la sous-position
    56.07 A du tarif douanier commun (codes Nimexe: 56.07-01; 04; 05; 07; 08; 11;
    13; 14; 16; 17; 18; 21; 23; 24; 26; 27; 28; 32; 33; 34; 36), originaires de T''
    ai-wan et mis en libre pratique dans les autres États membres'
  type: main
- language: de
  script: Latn
  content: '78/926/EWG: Entscheidung der Kommission vom 20. Oktober 1978, mit der
    das Vereinigte Königreich ermáchtigt wird, aus Taiwan stammende und in den úbrigen
    Mitgliedstaaten im freien Verkehr befindliche Gewebe aus synthetischen Spinnfasern,
    andere als Bánder, Samt, Plúsch, Schlingengewebe (einschließlich Frottiergewebe)
    und Chenillegewebe, der Tarifstelle 56.07 A des Gemeinsamen Zolltarifs (NIMEXE-Kennziffern:
    56.07-01; 04; 05; 07; 08; 11; 13; 14; 16; 17; 18; 21; 23; 24; 26; 27; 28; 32;
    33; 34; 36) von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: da
  script: Latn
  content: '78/926/EØF: Kommissionens beslutning af 20. oktober 1978 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage vævet stof
    af korte kemofibre, syntetiske eller regenererede, bortset fra vævede bånd,
    fløjls- og plysstoffer (inklusive håndklædefrotterstof af bomuld) og chenillestoffer,
    som henhører under pos. 56.07 A i den fælles toldtarif (NIMEXE-kode 56.07-01,
    04, 05, 07, 08, 11, 13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36),
    har oprindelse i Taiwan og frit kan omsættes i de andre medlemsstater'
  type: main
- language: it
  script: Latn
  content: '78/926/CEE: Decisione della Commissione, del 20 ottobre 1978, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario tessuti di fibre tessili
    sintetiche in fiocco, diversi da nastri, velluti, felpe, tessuti ricci (compresi
    i tessuti ricci del tipo spugna) e tessuti di ciniglia, della sottovoce 56.07
    A della tariffa doganale comune (codice Nimexe: 56.07-01, 04, 05, 07, 08, 11,
    13, 14, 16, 17, 18, 21, 23, 24, 26, 27, 28, 32, 33, 34, 36), originari di Taiwan
    e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '78/926/EEG: Beschikking van de Commissie van 20 oktober 1978 waarbij het
    Verenigd Koninkrijk wordt gemachtigd weefsels van synthetische stapelvezels, andere
    dan lint, fluweel, pluche, lussenweefsels (bad- en frotteerstof hieronder begrepen)
    en chenilleweefsel, van post 56.07 A van het gemeenschappelijk douanetarief (NIMEXE-code
    56.07-01 ; 04 ; 05 ; 07 ; 08 ; 11 ; 13 ; 14 ; 16 ; 17 ; 18 ; 21 ; 23 ; 24 ; 26
    ; 27 ; 28 ; 32 ; 33 ; 34 ; 36), van oorsprong uit Taiwan en in de overige Lid-Staten
    in het vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
