  content: Règlement n° 71/67/CEE du Conseil, du 7 avril 1967, modifiant le règlement
    n° 68/67/CEE en ce qui concerne les mesures à appliquer par la France et par
    l'Italie en matière de prix dans le secteur du lait et des produits laitiers
    pour la campagne laitière 1967/1968
  type: main
- language: de
  script: Latn
  content: Verordnung Nr. 71/67/EWG des Rates vom 7. April 1967 zur Änderung der
    Verordnung Nr. 68/67/EWG in bezug auf die von Frankreich und Italien zu treffenden
    Maßnahmen bei den Preisen für Milch und Milcherzeugnisse im Milchwirtschaftsjahr
    1967/1968
  type: main
- language: it
  script: Latn
  content: Regolamento n. 71/67/CEE del Consiglio, del 7 aprile 1967, che modifica
    il regolamento n. 68/67/CEE per quanto riguarda le misure che l'Italia e la Francia
    dovranno applicare in materia di prezzi nel settore del latte e dei prodotti lattiero-caseari
    per la campagna lattiera 1967/1968
  type: main
- language: nl
  script: Latn
  content: Verordening Nr. 71/67/EEG van de Raad van 7 april 1967 houdende wijziging
    van Verordening Nr. 68/67/EEG voor wat betreft de door Frankrijk en Italië voor
    het melkprijsjaar 1967/1968 met betrekking tot de prijs voor melk en zuivelprodukten
    te treffen maatregelen
  type: main
