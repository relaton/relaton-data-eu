  script: Latn
  content: Commission Implementing Regulation (EU) 2025/2526 of 16 December 2025 amending
    Implementing Regulation (EU) 2023/2713 to correct the designation of an EU reference
    laboratory and to designate European Union reference laboratories for in vitro
    diagnostic medical devices intended for detection or quantification of markers
    of parasite infection and detection of blood grouping markers
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/2526 de la Commission du 16 décembre
    2025 modifiant le règlement d’exécution (UE) 2023/2713 afin de corriger la
    désignation d’un laboratoire de référence de l’Union européenne et de
    désigner des laboratoires de référence de l’Union européenne pour les dispositifs
    médicaux de diagnostic in vitro destinés à la détection ou à la quantification
    des marqueurs d’infection parasitaire et à la détection des marqueurs de groupage
    sanguin
  type: main
