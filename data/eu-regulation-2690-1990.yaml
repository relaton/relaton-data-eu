title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2690/90 of 19 September 1990 fixing the
    number of young male bovine animals which may be imported on special terms in
    the fourth quarter of 1990, and derogating from Regulation (EEC) No 2377/80 in
    respect of that quarter as regards the allocation of the quantities available
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2690/90 de la Commission du 19 septembre 1990 relatif
    à la fixation de la quantité de jeunes bovins mâles pouvant être importés
    à des conditions spéciales pour le quatrième trimestre de 1990 et portant dérogation,
    pour ce trimestre, au règlement (CEE) n° 2377/80 en ce qui concerne l'attribution
    des quantités disponibles
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EWG) Nr. 2690/90 DER KOMMISSION vom 19. September 1990 zur
    Festsetzung der Anzahl maennlicher Jungrinder, die im vierten Vierteljahr 1990
    unter Sonderbedingungen eingefuehrt werden koennen, und zur Abweichung von der
    Verordnung (EWG) Nr. 2377/80 hinsichtlich der Zuteilung der verfuegbaren Mengen
    in diesem Vierteljahr
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2690/90 af 19. september 1990 om fastsættelse
    af den mængde ungtyre, der kan indføres på særlige betingelser i fjerde kvartal
    af 1990, og om undtagelse for dette kvartal fra forordning (EØF) nr. 2377/80
    for så vidt angår tildelingen af disponible mængder
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2690/90 της Επιτροπής
    της 19ης Σεπτεμβρίου 1990 για τον καθορισμό των
    ποσοτήτων των νεαρών αρένων βοοειδών που είναι
    δυνατόν να εισαχθούν με ειδικούς όρους κατά
    το τέταρτο τρίμηνο του 1990 και για παρέκκλιση,
    κατά το τρίμηνο αυτό, από τον κανονισμό (ΕΟΚ)
    αριθ. 2377/80 όσον αφορά την απόδοση των διαθεσίμων
    ποσοτήτων
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CEE) N. 2690/90 DELLA COMMISSIONE del 19 settembre 1990 che
    fissa il numero di giovani bovini maschi che possono essere importati a condizioni
    speciali nel quarto trimestre del 1990 e reca deroga, per tale trimestre, al regolamento
    (CEE) n. 2377/80 per quanto riguarda l'attribuzione dei quantitativi disponibili
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EEG) Nr. 2690/90 VAN DE COMMISSIE van 19 september 1990 tot
    vaststelling van het aantal jonge mannelijke runderen dat in het vierde kwartaal
    van 1990 onder bijzondere voorwaarden mag worden ingevoerd, en houdende afwijking,
    voor dat kwartaal, van Verordening (EEG) nr. 2377/80 ten aanzien van de toewijzing
    van de beschikbare aantallen
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CEE) N* 2690/90 DA COMISSAO de 19 de Setembro de 1990 relativo
    à fixaçao da quantidade de vitelos machos que podem ser importados em condiçoes
    especiais durante o quarto trimestre de 1990 e que prevê uma derrogaçao, no
    que diz respeito ao referido trimestre, ao Regulamento (CEE) n* 2377/80, quanto
    à atribuiçao das quantidades disponiveis
  type: main
- language: es
  script: Latn
  content: REGLAMENTO (CEE) No 2690/90 DE LA COMISION de 19 de septiembre de 1990
    por el que se fija la cantidad de machos jovenes de la especie bovina que podran
    importarse en condiciones especiales durante el cuarto trimestre de 1990 y por
    el que se establece una excepcion, para este trimestre, al Reglamento (CEE) no
    2377/80 en lo relativo a la atribucion de las cantidades disponibles
  type: main
