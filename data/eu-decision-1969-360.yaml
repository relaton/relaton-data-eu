title:
- language: fr
  script: Latn
  content: Décision du Conseil du 17 octobre 1969, autorisant la tacite reconduction,
    au-delà de la période de transition de certains accords commerciaux conclus
    par des États membres avec certains pays à commerce d'état
  type: main
- language: de
  script: Latn
  content: '69/360/EWG: Entscheidung des Rates vom 17. Oktober 1969 zur Genehmigung
    der stillschweigenden Verlängerung bestimmter, zwischen Mitgliedstaaten und bestimmten
    Staatshandelsländern geschlossener Handelsabkommen über die Übergangszeit hinaus'
  type: main
- language: it
  script: Latn
  content: '69/360/CEE: Decisione del Consiglio, del 17 ottobre 1969, che autorizza
    il tacito rinnovo oltre la fine del periodo transitorio di taluni accordi commerciali
    conclusi da Stati membri con paesi a commercio di Stato'
  type: main
- language: nl
  script: Latn
  content: '69/360/EEG: Beschikking van de Raad van 17 oktober 1969 houdende machtiging
    tot stilzwijgende verlenging tot na de overgangsperiode van bepaalde handelsakkoorden
    welke door Lid-Staten met sommige landen met staatshandel zijn gesloten'
  type: main
