title:
- language: en
  script: Latn
  content: '85/637/ECSC: Commission Decision of 20 December 1985 derogating from High
    Authority recommendation No 1-64 on tariff protection in order to enable the generalized
    tariff preferences to be applied to certain iron and steel products originating
    in the developing countries'
  type: main
- language: fr
  script: Latn
  content: '85/637/CECA: Décision de la Commission du 20 décembre 1985 portant dérogation
    à la recommandation no 1-64 de la Haute Autorité sur la protection tarifaire
    afin de permettre l'' application des préférences tarifaires généralisées
    à certains produits sidérurgiques originaires des pays en voie de développement
    (cent-dix-neuvième dérogation)'
  type: main
- language: de
  script: Latn
  content: '85/637/EGKS: Entscheidung der Kommission vom 20. Dezember 1985 betreffend
    Ausnahmen von der Empfehlung Nr. 1/64 der Hohen Behörde über den Außenschutz
    im Hinblick auf die Anwendung der allgemeinen Zollpräferenzen auf bestimmte Stahlerzeugnisse
    mit Ursprung in Entwicklungsländern (119. Ausnahmeentscheidung)'
  type: main
- language: da
  script: Latn
  content: '85/637/EKSF: Kommissionens beslutning af 20. december 1985 om undtagelse
    fra Den høje Myndigheds henstilling nr. 1/64 vedrørende toldbeskyttelse med
    henblik på at muliggøre anvendelse af de generelle toldpræferencer på visse
    jern- og stålprodukter med oprindelse i udviklingslandene'
  type: main
- language: el
  script: Grek
  content: '85/637/ΕΚΑΧ: Απόφαση της Επιτροπής της 20ής
    Δεκεμβρίου 1985 για παρέκκλιση από τη σύσταση
    αριθ. 1—64 της Ανωτάτης Αρχής για τη δασμολογική
    προστασία, προκειμένου να επιτραπεί η εφαρμογή
    των γενικευμένων δασμολογικών προτιμήσεων
    σε ορισμένα προϊόντα της βιομηχανίας σιδήρου
    και χάλυβα που κατάγονται από αναπτυσσόμενες
    χώρες'
  type: main
- language: it
  script: Latn
  content: '85/637/CEE: Decisione della Commissione del 20 dicembre 1985 recante deroga
    alla raccomandazione n. 1-64 dell'' Alta Autorità relativa alla protezione tariffaria
    per consentire l'' applicazione delle preferenze tariffarie generalizzate a taluni
    prodotti siderurgici originari dei paesi in via di sviluppo (119a deroga)'
  type: main
- language: nl
  script: Latn
  content: '85/637/EGKS: Beschikking van de Commissie van 20 december 1985 houdende
    afwijking van Aanbeveling nr. 1-64 van de Hoge Autoriteit betreffende de tariefbescherming,
    ten einde voor bepaalde ijzer- en staalprodukten van oorsprong uit de ontwikkelingslanden
    de toepassing van algemene tariefpreferenties mogelijk te maken (Honderdnegentiende
    uitzonderingsbeschikking)'
  type: main
- language: pt
  script: Latn
  content: '85/637/CEE: Decisão da Comissão, de 20 de Dezembro de 1985, que derroga
    a Recomendação n.° 1-64 da Alta Autoridade sobre a protecção pautal a fim
    de permitir a aplicação das preferências pautais generalizadas a certos produtos
    siderúrgicos originários dos países em vias de desenvolvimento'
  type: main
- language: es
  script: Latn
  content: '85/637/CEE: Decisión de la Comisión, de 20 de diciembre de 1985, por
    la que se establece una excepción respecto de la Recomendación n° 1/64 de la
    Alta Autoridad relativa a la protección arancelaria a fin de permitir la aplicación
    de preferencias arancelarias generalizadas a determinados productos siderúrgicos
    originarios de los países en vías de desarrollo'
