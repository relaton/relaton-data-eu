title:
- language: en
  script: Latn
  content: '94/877/EC: Commission Decision of 21 December 1994 amending Decision 93/52/EEC
    recording the compliance by certain Member States or regions with the requirements
    relating to brucellosis (B. melitensis) and according them the status of a Member
    State or region officially free of the disease'
  type: main
- language: fr
  script: Latn
  content: '94/877/CE: Décision de la Commission du 21 décembre 1994 modifiant la
    décision 93/52/CEE constatant le respect par certains États membres ou régions
    des conditions relatives à la brucellose (Br. melitensis) et leur reconnaissant
    le statut d''États membres ou de régions officiellement indemnes de cette maladie'
  type: main
- language: de
  script: Latn
  content: '94/877/EG: Entscheidung der Kommission vom 21. Dezember 1994 zur Änderung
    der Entscheidung 93/52/EWG zur Feststellung, daß bestimmte Mitgliedstaaten oder
    Gebiete die Bedingungen betreffend die Brucellose (Br. melitensis) eingehalten
    haben, und zur Anerkennung dieser Mitgliedstaaten oder Gebiete als amtlich brucellosefrei'
  type: main
- language: da
  script: Latn
  content: '94/877/EF: Kommissionens beslutning af 21. december 1994 om ændring af
    beslutning 93/52/EØF om konstatering af, at bestemte medlemsstater eller regioner
    overholder betingelserne for brucellose (B. melitensis), og om anerkendelse af
    deres status som medlemsstat eller region, der er officielt fri for denne sygdom'
  type: main
- language: el
  script: Grek
  content: '94/877/ΕΚ: Απόφαση της Επιτροπής της 21ης Δεκεμβρίου
    1994 για την τροποποίηση της απόφασης 93/52/ΕΟΚ
    που διαπιστώνει την τήρηση εκ μέρους ορισμένων
    κρατών μελών ή περιοχών των όρων σχετικά με
    τη βρουκέλλωση (Br. melitensis) και που τους αναγνωρίζει
    το καθεστώς κράτους μέλους ή περιοχής επίσημα
    απαλλαγμένης από την ασθένεια αυτή'
  type: main
- language: fi
  script: Latn
  content: '94/877/EY: Komission päätös, tehty 21 päivänä joulukuuta 1994, luomistautia
    (Br. melitensis) koskevien edellytysten täyttämisen toteamisesta tietyissä
    jäsenvaltioissa ja tietyillä alueilla ja näille jäsenvaltioille ja alueille
    tästä taudista virallisesti vapaan jäsenvaltion tai alueen aseman vahvistamisesta
    tehdyn päätöksen 93/52/ETY muuttamisesta'
  type: main
- language: it
  script: Latn
  content: '94/877/CE: Decisione della Commissione del 21 dicembre 1994 recante modifica
    della decisione 93/52/CEE che constata il rispetto da parte di taluni Stati membri
    o regioni delle condizioni relative alla brucellosi (B. melitensis) e riconosce
    loro la qualifica di Stato membro o regione ufficialmente indenne da tale malattia'
  type: main
- language: nl
  script: Latn
  content: '94/877/EG: Beschikking van de Commissie van 21 december 1994 tot wijziging
    van Beschikking 93/52/EEG houdende constatering dat bepaalde Lid-Staten of gebieden
    aan de voorwaarden voldoen om te worden erkend als officieel brucellosevrij (Br.
    melitensis)'
  type: main
- language: pt
  script: Latn
  content: '94/877/CE: Decisão da Comissão de 21 de Dezembro de 1994 que altera
    a Decisão 93/52/CEE que reconhece que certos Estados-membros ou regiões respeitam
    as condições relativas à brucelose (Br. melitensis) e que lhes reconhece o
    estatuto de Estado-membro ou região oficialmente indemne desta doença'
  type: main
- language: es
  script: Latn
  content: '94/877/CE: Decisión de la Comisión de 21 de diciembre de 1994 por la
    que se modifica la Decisión 93/52/CEE por la que se reconoce que determinados
    Estados miembros o regiones cumplen las condiciones referentes a la brucelosis
    (Brucella Melitensis) y se les concede la calificación de Estados miembros o
    regiones oficialmente indemnes de esta enfermedad'
  type: main
- language: sv
  script: Latn
  content: '94/877/EG: Kommissionens beslut av den 21 december 1994 om ändring av
    beslut 93/52/EEG om konstaterande av att vissa medlemsstater och regioner iakttar
    kraven i fråga om brucellos (B. melitensis) och erkännande av deras status som
    medlemsstat eller region som är officiellt fri från denna sjukdom'
  type: main
