    de onderverdeling 21.07 E van het gemeenschappelijk douanetarief afhankelijk is,
    moeten voldoen
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) n.° 1062/69 da Comissão, de 6 de Junho de 1969, que
    fixa as condições a que devem obedecer os certificados a cuja apresentação
    se subordina a admissão dos preparados designados por "fondues" na subposição
    21.07 E da pauta aduaneira comum
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) n° 1062/69 de la Comisión, de 6 de junio de 1969, por
