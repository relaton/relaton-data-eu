title:
- language: en
  script: Latn
  content: Regulation (EEC) No 1062/69 of the Commission of 6 June 1969 specifying
    the requirements relating to certificates which must be produced in order for
    preparations known as cheese fondues to be included under sub-heading No 21.07
    E of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1062/69 de la Commission, du 6 juin 1969, fixant les
    conditions auxquelles doivent répondre les certificats à la présentation desquels
    est subordonnée l' admission des préparations dites "fondues" dans la sous-position
    21.07 E du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1062/69 der Kommission vom 6. Juni 1969 zur Festlegung
    der Voraussetzungen für die Bescheinigungen, von deren Vorlage die Zulassung
    der ,,Käsefondue' ' genannten Zubereitungen zur Tarifstelle 21.07 E des Gemeinsamen
    Zolltarifs abhängig ist
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1062/69 af 6. juni 1069 om fastsættelse
    af de betingelser, som skal være opfyldt for de certifikater, hvis fremlæggelse
    er en betingelse for henførsel af tilberedte produkter betegnet "oste-fondue"
    til underposition 21.07 E i den fælles toldtarif
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1062/69 της Επιτροπής
    της 6ης Ιουνίου 1969 περί καθορισμού των προϋποθέσεων
    που πρέπει να πληρούν τα πιστοποιητικά, από
    την υποβολή των οποίων εξαρτάται η υπαγωγή
    των παρασκευασμάτων υπό την ονομασία «τετηγμένα»
    στη διάκριση 21.07 Ε του Κοινού Δασμολογίου
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1062/69 della Commissione, del 6 giugno 1969, che
    determina le condizioni alle quali devono rispondere certificati alla cui presentazione
    è subordinata l' ammissione delle preparazioni dette "fondute" nella sottovoce
    21.07 E della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1062/69 van de Commissie van 6 juni 1969 houdende
