title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 1286/98 of 22 June 1998 reintroducing normal
    customs duties on certain flat-rolled products of iron or non-alloy steel, originating
    in the former Yugoslav Republic of Macedonia, for which a tariff ceiling was opened
    by Regulation (EC) No 273/98
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) nº 1286/98 de la Commission du 22 juin 1998 portant rétablissement
    de la perception des droits de douane normaux applicables à certains produits
    laminés plats en fer ou en aciers non alliés, originaires de l'ancienne République
    yougoslave de Macédoine, pour lesquels un plafond tarifaire a été ouvert par
    le règlement (CE) nº 273/98
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 1286/98 der Kommission vom 22. Juni 1998 zur Wiedererhebung
    der Regelzölle für bestimmte flachgewalzte Erzeugnisse aus Eisen oder nichtlegiertem
    Stahl, mit Ursprung in der ehemaligen Jugoslawischen Republik Mazedonien, denen
    gemäß der Verordnung (EG) Nr. 273/98 ein Zollplafond gewährt wird
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EF) nr. 1286/98 af 22. juni 1998 om genindførelse
    af opkrævning af normal told på visse fladvalsede produkter, af jern og ulegeret
    stål, med oprindelse i Den Tidligere Jugoslaviske Republik Makedonien, for hvilke
    der er indført et toldloft ved forordning (EF) nr. 273/98
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΚ) αριθ. 1286/98 της Επιτροπής
    της 22ας Ιουνίου 1998 σχετικά με την επαναφορά
    της είσπραξης των κανονικών τελωνειακών δασμών
    που εφαρμόζονται σε ορισμένα πλατέα προϊόντα
    έλασης, από σίδηρο ή από όχι σε κράμα χάλυβες,
    καταγωγής της Πρώην Γιουγκοσλαβικής Δημοκρατίας
    της Μακεδονίας, δικαιούχα μιας δασμολογικής
    οροφής που προβλέπεται από τον κανονισμό (ΕΚ)
    αριθ. 273/98
  type: main
- language: fi
  script: Latn
  content: Komission asetus (EY) N:o 1286/98, annettu 22 päivänä kesäkuuta 1998,
    tiettyjen entisestä Jugoslavian tasavallasta Makedoniasta peräisin olevien asetuksessa
    (EY) N:o 273/98 säädettyjen tariffikattojen soveltamisalaan kuuluvien raudasta
    tai seostamattomasta teräksestä valmistettujen levyvalmisteiden tavanomaisten
    tullien uudelleen käyttöön ottamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 1286/98 della Commissione del 22 giugno 1998 che ripristina
    i dazi doganali normali applicabili a taluni prodotti laminati piatti, di ferro
    o di acciai non legati, originari dell'ex Repubblica iugoslava di Macedonia, che
    beneficiano di un massimale tariffario previsto dal regolamento (CE) n. 273/98
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 1286/98 van de Commissie van 22 juni 1998 tot wederinstelling
    van de heffing van de normale douanerechten voor bepaalde gewalste platte producten,
    van ijzer of van niet-gelegeerd staal, van oorsprong uit de Voormalige Joegoslavische
    Republiek Macedonië, waarvoor een tariefplafond geopend werd bij Verordening
    (EG) nr. 273/98
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 1286/98 da Comissão de 22 de Junho de 1998 que restabelece
