    Europeias e os seus Estados-membros, por um lado, e a Roménia, por outro, a fim
    de ter em conta a adesão da República da Áustria, da República da Finlândia
    e do Reino da Suécia à União Europeia, assim como os resultados das negociações
    do «Uruguay Round» no domínio agrícola, incluindo as melhorias do regime preferencial
    existente'
  type: main
