  script: Latn
  content: '98/626/EG: Besluit van de Raad van 5 oktober 1998 betreffende de sluiting
    van het protocol tot aanpassing van de handelsaspecten van de Europa-overeenkomst
    tussen de Europese Gemeenschappen en hun lidstaten, enerzijds, en Roemenië, anderzijds,
