    Europejskimi i ich Państwami Członkowskimi, z jednej strony, a Rumunią z drugiej
    strony, w celu uwzględnienia przystąpienia do Unii Europejskiej Republiki Austrii,
    Republiki Finlandii i Królestwa Szwecji oraz wyników negocjacji rolnych Rundy
    Urugwajskiej, wraz z rozszerzeniem istniejącego systemu preferencyjnego
  type: main
