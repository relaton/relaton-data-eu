    valamint az Uruguayi Forduló során a mezőgazdasági tárgyalásokon elért
    eredményeknek, többek között a meglévő kedvezményes rendszer javításának
    figyelembevétele céljából, az egyrészről az Európai Közösségek és azok
    tagállamai, másrészről Románia között létrejött Európa-megállapodás
    kereskedelmi vonatkozásainak kiigazításáról szóló jegyzőkönyv megkötéséről
  type: main
- language: it
  script: Latn
  content: '98/626/CE: Decisione del Consiglio del 5 ottobre 1998 relativa alla conclusione
    del protocollo di adeguamento degli aspetti commerciali dell''accordo europeo
    tra le Comunità europee e i loro Stati membri, da una parte, e la Romania, dall''altra,
    per tener conto dell''adesione della Repubblica d''Austria, della Repubblica di
    Finlandia e del Regno di Svezia all''Unione europea e dei risultati nei negoziati
    agricoli dell''Uruguay Round, compresi i miglioramenti del regime preferenziale
    esistente'
  type: main
- language: lv
  script: Latn
  content: Padomes lēmums (1998. gada 5. oktobris) par tāda Protokola noslēgšanu,
    ar ko koriģē tirdzniecības aspektus Eiropas Nolīgumā starp Eiropas Kopienām
    un to dalībvalstīm, no vienas puses, un Rumāniju, no otras puses, lai ņemtu
    vērā Austrijas Republikas, Somijas Republikas un Zviedrijas Karalistes pievienošanos
    Eiropas Savienībai, kā arī Urugvajas raunda lauksaimniecības sarunu rezultātus,
    ieskaitot uzlabojumus esošajā preferenciālajā režīmā
  type: main
- language: lt
  script: Latn
  content: 1998 m. spalio 5 d. Tarybos sprendimas, susijęs su protokolo, kuriuo suderinami
    Europos Bendrijų bei jų valstybių narių ir Rumunijos Europos susitarimo prekybos
    aspektai, kad būtų atsižvelgta į Austrijos Respublikos, Suomijos Respublikos
    ir Švedijos Karalystės įstojimą į Europos Sąjungą bei Urugvajaus raundo
    derybų išvadas dėl žemės ūkio, įskaitant šiuo metu galiojančio preferencinio
    režimo pataisymus, sudarymu
  type: main
- language: mt
  script: Latn
