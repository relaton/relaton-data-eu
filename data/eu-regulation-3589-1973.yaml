title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3589/73 of the Council of 28 December 1973 on the opening,
    allocation and administration of a Community tariff quota for ferro-chromium containing
    not more than 0.10 % by weight of carbon and more than 30 % but not more than
    90 % of chromium (super-refined ferro-chromium) falling within subheading No ex
    73.02 E I of the Common Customs Tariff
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3589/73 du Conseil, du 28 décembre 1973, portant
    ouverture, répartition et mode de gestion du contingent tarifaire communautaire
    de ferrochrome contenant en poids 0,10 % ou moins de carbone et plus de 30 % jusqu'à
    90 % inclus de chrome (ferrochrome surraffiné) de la sous-position EX 73.02 E
    I du tarif douanier commun
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3589/73 des Rates vom 28. Dezember 1973 über die
    Eröffnung, Aufteilung und Verwaltung des Gemeinschaftszollkontingents für Ferrochrom
    mit einem Gehalt an Kohlenstoff von 0,10 Gewichtshundertteilen oder weniger und
    an Chrom von mehr als 30 bis 90 Gewichtshundertteilen (hochraffiniertes Ferrochrom)
    der Tarifstelle ex 73.02 E I des Gemeinsamen Zolltarifs
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3589/73 af 28. december 1973 om åbning,
    fordeling og forvaltning af et fællesskabstoldkontingent for ferrochrom, indeholdende
    0,10 og derunder vægtprocent kulstof og over 30, men højst 90 vægtprocent chrom
    (overraffineret ferrochrom), henhørende under pos. ex 73.02 E I i den fælles
    toldtarif
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3589/73 del Consiglio, del 28 dicembre 1973, relativo
    all'apertura, alla ripartizione ed alle modalità di gestione del contingente
    tariffario comunitario di ferro-cromo contenente, in peso, lo 0,10 % o meno di
    carbonio e oltre il 30 % sino al 90 % incluso, di cromo (ferro-cromo superraffinato)
    della sottovoce ex 73.02 E I della tariffa doganale comune
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3589/73 van de Raad van 28 december 1973 betreffende
    de opening, de verdeling en de wijze van beheer van het communautaire tariefcontingent
    voor ferrochroom, bevattende 0,1 of minder gewichtspercent koolstof en meer dan
    30 doch niet meer dan 90 gewichtspercenten chroom (hooggeraffineerd ferrochroom),
    van onderverdeling ex 73.02 E I van het gemeenschappelijk douanetarief
  type: main
