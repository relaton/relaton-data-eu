id: EUDecision1971367
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 27 octobre 1971, autorisant la République
    française à exclure du traitement communautaire les appareils récepteurs de
    radio-diffusion, même combinés avec un appareil d'enregistrement ou de reproduction
    du son, de la position 85.15 A Ex III du Tarif douanier commun, originaires du
    Japon et mis en libre pratique dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '71/367/EWG: Entscheidung der Kommission vom 27. Oktober 1971, mit der
    die Französische Republik ermächtigt wird, aus Japan stammende und in den übrigen
    Mitgliedstaaten im freien Verkehr befindliche Empfangsgeräte für Rundfunk, auch
    mit einem Tonaufnahme- oder Tonwiedergabegerät kombiniert, der Tarifnummer 85.15
    A ex III des Gemeinsamen Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '71/367/CEE: Decisione della Commissione, del 27 ottobre 1971, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli apparecchi
    radioriceventi anche combinati con un apparecchio di registrazione o di riproduzione
    del suono della voce n. 85.15 A ex III della tariffa doganale comune, originari
    del Giappone e messi in libera pratica negli altri Stati membri'
  type: main
- language: nl
  script: Latn
  content: '71/367/EEG: Beschikking van de Commissie van 27 oktober 1971 waarbij de
    Franse Republiek wordt gemachtigd ontvangtoestellen voor de radio-omroep, ook
    indien met ingebouwd toestel voor het opnemen of voor het weergeven van geluid,
    van post 85.15 A ex III van het gemeenschappelijk douanetarief, van oorsprong
    uit Japan en in de overige Lid-Staten in het vrije verkeer gebracht, van de communautaire
    behandeling uit te sluiten'
  type: main
