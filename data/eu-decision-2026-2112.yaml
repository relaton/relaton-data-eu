    modifié GMB151 × DAS-44406-6, consistant en ce soja ou produits à partir de
    celui-ci, en application du règlement (CE) no 1829/2003 du Parlement européen
    et du Conseil [notifiée sous le numéro C(2026) 6604]
  type: main
