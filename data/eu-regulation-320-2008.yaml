    elektrooniliste mikrolülituste impordi suhtes kehtestatud tasakaalustav tollimaks
    ja lõpetatakse menetlus
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 320/2008, annettu 7 päivänä huhtikuuta 2008
    , tasoitustullin kumoamisesta tiettyjen Korean tasavallasta peräisin olevien
    elektronisten mikropiirien, niin sanottujen DRAMien (dynaamisten hakumuistien),
    tuonnissa sekä menettelyn päättämisestä
  type: main
- language: hr
  script: Latn
  content: Uredba Vijeća (EZ) br. 320/2008 od 7. travnja 2008. o stavljanju izvan
