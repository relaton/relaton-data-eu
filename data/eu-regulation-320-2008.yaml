    poznatih pod nazivom DRAM-ovi (memorije s nasumičnim dinamičkim pristupom) podrijetlom
    iz Republike Koreje i o završetku postupka
  type: main
- language: hu
  script: Latn
  content: A Tanács 320/2008/EK rendelete ( 2008. április 7. ) a Koreai Köztársaságból
