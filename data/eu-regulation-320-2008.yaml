title:
- language: en
  script: Latn
  content: Council Regulation (EC) No 320/2008 of 7 April 2008 repealing the countervailing
    duty imposed on imports of certain electronic microcircuits known as DRAMs (Dynamic
    Random Access Memories) originating in the Republic of Korea and terminating the
    proceeding
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 320/2008 du Conseil du 7 avril 2008 abrogeant le droit
    compensateur institué sur les importations de certains microcircuits électroniques
    dits DRAM ( dynamic random access memories , mémoires dynamiques à accès aléatoire)
    originaires de la République de Corée et clôturant la procédure
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 320/2008 des Rates vom 7. April 2008 zur Aufhebung
    des Ausgleichszolls auf die Einfuhren bestimmter elektronischer Mikroschaltungen,
    so genannter DRAMs (dynamische Schreib-Lesespeicher mit wahlfreiem Zugriff), mit
    Ursprung in der Republik Korea und zur Einstellung des Verfahrens
  type: main
- language: bg
  script: Cyrl
  content: Регламент (ЕО) № 320/2008 на Съвета от 7 април
    2008 година за отмяна на изравнителното мито,
    наложено върху вноса на някои електронни микровериги,
    известни като DRAM (dynamic random access memories — динамични
    памети за четене и запис с произволен достъп),
    с произход от Република Корея и за прекратяване
    на процедурата
  type: main
- language: cs
  script: Latn
  content: Nařízení Rady (ES) č. 320/2008 ze dne 7. dubna 2008 , kterým se zrušuje
    vyrovnávací clo z dovozu některých elektronických mikroobvodů nazývaných
    DRAMs (dynamické paměti s libovolným přístupem) pocházejících z Korejské
    republiky a zastavuje řízení
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 320/2008 af 7. april 2008 om ophævelse af
    udligningstolden på importen af visse elektroniske mikrokredsløb, såkaldte
    DRAMs (Dynamic Random Access Memories), med oprindelse i Republikken Korea og
    om afslutning af proceduren
  type: main
- language: el
  script: Grek
