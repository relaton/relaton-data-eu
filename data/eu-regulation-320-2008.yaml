    egyes elektronikus mikroáramkörök behozatalára kivetett kiegyenlítő vám
    hatályon kívül helyezéséről és az eljárás befejezéséről
  type: main
- language: it
  script: Latn
  content: Regolamento (CE) n. 320/2008 del Consiglio, del 7 aprile 2008 , che abroga
