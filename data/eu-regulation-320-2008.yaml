    Korejas Republikas izcelsmes mikroshēmām, kas pazīstamas kā DRAM (dinamiskās
    brīvpiekļuves atmiņas), un ar ko izbeidz procedūru
  type: main
- language: lt
  script: Latn
  content: 2008 m. balandžio 7 d. Tarybos reglamentas (EB) Nr. 320/2008, kuriuo panaikinamas
