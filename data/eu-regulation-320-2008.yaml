    magħrufa bħala DRAMs (Memorji Dinamiċi b’Aċċess Każwali – Dynamic Random
    Access Memories) li joriġinaw mir-Repubblika tal-Korea u li jtemm il-proċediment
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 320/2008 van de Raad van 7 april 2008 tot intrekking
    van het compenserend recht op bepaalde micro-elektronische schakelingen, DRAM's
    genaamd, van oorsprong uit de Republiek Korea, en tot beëindiging van de procedure
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie Rady (WE) nr 320/2008 z dnia 7 kwietnia 2008 r. uchylające
    cło wyrównawcze nałożone na przywóz niektórych mikroukładów elektronicznych
    znanych jako DRAM (pamięci dynamiczne o dostępie swobodnym) pochodzących z
    Republiki Korei oraz kończące postępowanie
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 320/2008 do Conselho, de 7 de Abril de 2008 , que
    revoga as medidas de compensação instituídas sobre as importações de certos
    microcircuitos electrónicos conhecidos por DRAM (memórias dinâmicas de acesso
    aleatório) originários da República da Coreia
  type: main
- language: ro
  script: Latn
  content: Regulamentul (CE) nr. 320/2008 al Consiliului din 7 aprilie 2008 de abrogare
    a taxei compensatorii instituite la importurile de anumite microcircuite electronice
    denumite DRAM (Dynamic Random Access Memories – memorii dinamice cu acces aleatoriu)
    originare din Republica Coreea și de încheiere a procedurii
  type: main
- language: sk
  script: Latn
  content: Nariadenie Rady (ES) č. 320/2008 zo 7. apríla 2008 , ktorým sa zrušuje
    vyrovnávacie clo uložené na dovoz určitých mikroelektronických obvodov známych
    ako DRAM (dynamické pamäte s priamym prístupom) s pôvodom v Kórejskej republike
    a ktorým sa ukončuje konanie
  type: main
- language: sl
  script: Latn
  content: Uredba Sveta (ES) št. 320/2008 z dne 7. aprila 2008 o razveljavitvi izravnalnih
