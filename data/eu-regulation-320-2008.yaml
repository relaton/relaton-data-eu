    δασμού που έχει επιβληθεί στις εισαγωγές ορισμένων
    ηλεκτρονικών μικροκυκλωμάτων γνωστών ως DRAM
    (δυναμικές μνήμες τυχαίας προσπέλασης) καταγωγής
    Δημοκρατίας της Κορέας και την περάτωση της
    διαδικασίας
  type: main
- language: et
  script: Latn
  content: Nõukogu määrus (EÜ) nr 320/2008, 7. aprill 2008 , millega tühistatakse
