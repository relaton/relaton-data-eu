  content: Regulation (EEC) No 302/69 of the Council of 18 February 1969 amending
    and supplementing certain provisions of Regulation (EEC) No 1052/68 on the import
    and export system for products processed from cereals and from rice
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 302/69 du Conseil, du 18 février 1969, modifiant
