title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1112/93 of 6 May 1993 laying down detailed
    rules for the application of the supplementary trade mechanism to trade in the
    beef and veal sector between the Community as constituted at 31 December 1985
    and Spain and Portugal and repealing Regulations (EEC) No 3810/91 and (EEC) No
    3829/92
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 1112/93 de la Commission, du 6 mai 1993, déterminant
    les modalités d' application du mécanisme complémentaire aux échanges dans
    le secteur de la viande bovine de la Communauté dans sa composition au 31 décembre
    1985 vers l' Espagne et le Portugal et abrogeant les règlements (CEE) nº 3810/91
    et (CEE) nº 3829/92
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1112/93 der Kommission vom 6. Mai 1993 mit Durchführungsbestimmungen
    zum ergänzenden Mechanismus für den Handel mit Rindfleisch zwischen der Gemeinschaft
    in ihrer Zusammensetzung vom 31. Dezember 1985 und Spanien und Portugal sowie
    zur Aufhebung der Verordnungen (EWG) Nr. 3810/91 und (EWG) Nr. 3829/92
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1112/93 af 6. maj 1993 om de nærmere
    bestemmelse for anvendelse af den supplerende mekanisme for samhandelen i oksekødsektoren
    mellem Fællesskabet i dets sammensætning pr. 31. december 1985 og Spanien og
    Portugal og om ophævelse af forordning (EØF) nr. 3810/91 og (EØF) nr. 3829/92
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1112/93 της Επιτροπής
    της 6ης Μαΐου 1993 για τον καθορισμό των λεπτομερειών
    εφαρμογής του συμπληρωματικού μηχανισμού
    στις συναλλαγές ορισμένων προϊόντων στον τομέα
    του βοείου κρέατος τα οποία προέρχονται από
    την Κοινότητα, με τη σύνθεσή της στις 31 Δεκεμβρίου
    1985, και τα οποία προορίζονται για την Ισπανία
    και την Πορτογαλία, καθώς και για την κατάργηση
    των κανονισμών (ΕΟΚ) αριθ. 3810/91 και (ΕΟΚ) αριθ.
    3829/92
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (ETY) N:o 1112/93, annettu 6 päivänä toukokuuta 1993,
    täydentävän kaupan järjestelmän soveltamista koskevista yksityiskohtaisista
    säännöistä naudanliha-alalla yhteisön, sellaisena kuin se oli 31 päivänä
    joulukuuta 1985, ja Espanjan ja Portugalin välillä sekä asetusten (ETY) N:o
    3810/91 ja (ETY) N:o 3829/92 kumoamisesta
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1112/93 della Commissione, del 6 maggio 1993, che
    determina le modalità d' applicazione del meccanismo complementare applicabile,
    nel settore delle carni bovine, agli scambi di prodotti spediti dalla Comunità
    quale si componeva al 31 dicembre 1985 verso la Spagna e il Portogallo, e che
    abroga i regolamenti (CEE) n. 3810/91 e (CEE) n. 3829/92
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1112/93 van de Commissie van 6 mei 1993 houdende
    vaststelling van de uitvoeringsbepalingen van de aanvullende regeling voor het
    handelsverkeer in de sector rundvlees tussen de Gemeenschap in haar samenstelling
    op 31 december 1985 en Spanje en Portugal en houdende intrekking van de Verordeningen
    (EEG) nr. 3810/91 en (EEG) nr. 3829/92
  type: main
- language: pt
  script: Latn
  content: Regulamento (CEE) nº 1112/93 da Comissão, de 6 de Maio de 1993, que determina
    as regras de execução do mecanismo complementar aplicável às trocas comerciais
    no sector da carne de bovino entre a Comunidade na sua composição em 31 de Dezembro
    de 1985 e Espanha e Portugal e que revoga os Regulamentos (CEE) nº 3810/91 e
    (CEE) nº 3829/92
  type: main
- language: es
  script: Latn
  content: Reglamento (CEE) nº 1112/93 de la Comisión, de 6 de mayo de 1993, por
    el que se establecen las disposiciones de aplicación del mecanismo complementario
    de los intercambios en el sector de la carne de vacuno entre la Comunidad, en
    su composición de 31 de diciembre de 1985, y España y Portugal, y por el que
    se derogan los Reglamentos (CEE) ns 3810/91 y 3829/92
  type: main
- language: sv
  script: Latn
  content: KOMMISSIONENS FÖRORDNING (EEG) nr 1112/93 av den 6 maj 1993 om tillämpningsföreskrifter
    för den kompletterande handelsmekanismen i handeln inom nötköttssektorn mellan
    gemenskapen i dess sammansättning den 31 december 1985 och Spanien och Portugal
    och om upphävande av förordningarna (EEG) nr 3810/91 och (EEG) nr 3829/92
  type: main
