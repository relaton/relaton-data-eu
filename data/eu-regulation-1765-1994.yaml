    und der je Mutterschaf und Ziege zu gewährenden Prämie sowie des zweiten Vorschusses
    auf diese Prämie
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 1765/94 af 18. juli 1994 om fastsættelse
