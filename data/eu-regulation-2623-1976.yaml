type: standard
title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2623/76 of 28 October 1976 re-establishing
    the levying of customs duties on portland cement, ciment fondu, etc., whether
    or not coloured or in the form of clinker, falling within heading No 25.23, originating
    in developing countries to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 3010/75 of 17 November 1975 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2623/76 de la Commission, du 28 octobre 1976, portant
    rétablissement de la perception des droits de douane applicables aux ciments
    hydrauliques, même colorés, de la position tarifaire 25.23, originaires des
    pays en voie de développement bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 3010/75 du Conseil du 17 novembre 1975
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2623/76 der Kommission vom 28. Oktober 1976 zur Wiedereinführung
    des Zollsatzes für Zement (einschließlich Zementklinker), auch gefärbt, der
    Tarifnummer 25.23, mit Ursprung in Entwicklungsländern, denen die in der Verordnung
    (EWG) Nr. 3010/75 des Rates vom 17. November 1975 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens Forordning (EØF) nr. 2623/76 af 28. oktober 1976 om genindførelse
    af opkrævning af toldafgifter for portlandcement, aluminatcement, etc., også
    farvet eller i form af klinker, under position 25.23, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 3010/75 af 17. november 1975
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2623/76 della Commissione, del 28 ottobre 1976, che
    ripristina la riscossione dei dazi doganali applicabili ai cementi idraulici,
    anche colorati, della voce doganale 25.23, originari dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 3010/75
    del Consiglio, del 17 novembre 1975
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2623/76 van de Commissie van 28 oktober 1976 houdende
    wederinstelling van de heffing van de douanerechten voor hydraulisch cement, ook
    indien gekleurd, van post 25.23, van oorsprong uit de ontwikkelingslanden, ten
    behoeve waarvan bij Verordening (EEG) nr. 3010/75 van de Raad van 17 november
    1975 tariefpreferenties werden geopend
  type: main
