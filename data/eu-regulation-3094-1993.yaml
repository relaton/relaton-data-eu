  content: COMMISSION REGULATION (EC) No 3094/93 of 9 November 1993 re-establishing
    the levying of customs duties on products of category 96 (order No 40.0960), originating
    in China, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3832/90 apply
  type: main
- language: fr
  script: Latn
