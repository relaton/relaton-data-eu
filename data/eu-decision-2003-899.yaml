title:
- language: en
  script: Latn
  content: '2003/899/EC: Commission Decision of 28 November 2003 granting certain
    parties an exemption from the extension to certain bicycle parts, by Council Regulation
    (EC) No 71/97, of the anti-dumping duty on bicycles originating in the People''s
    Republic of China imposed by Council Regulation (EEC) No 2474/93, and maintained
    by Council Regulation (EC) No 1524/2000, and lifting the suspension of the payment
    of the anti-dumping duty extended to certain bicycle parts originating in the
    People''s Republic of China granted to certain parties pursuant to Commission
    Regulation (EC) No 88/97 (notified under document number C(2003) 4419)'
  type: main
- language: fr
  script: Latn
  content: '2003/899/CE: Décision de la Commission du 28 novembre 2003 exemptant
    certaines parties de l''extension à certaines parties de bicyclettes originaires
    de la République populaire de Chine, par le règlement (CE) n° 71/97 du Conseil,
    du droit antidumping institué par le règlement (CEE) n° 2474/93 et maintenu
    par le règlement (CE) n° 1524/2000, et levant la suspension du paiement du droit
    antidumping étendu à certaines parties de bicyclettes originaires de la République
    populaire de Chine accordée à certaines parties en vertu du règlement (CE)
    n° 88/97 de la Commission [notifiée sous le numéro C(2003) 4419]'
  type: main
- language: de
  script: Latn
  content: '2003/899/EG: Entscheidung der Kommission vom 28. November 2003 zur Befreiung
    bestimmter Parteien von der Ausweitung auf bestimmte Fahrradteile gemäß der
    Verordnung (EG) Nr. 71/97 des Rates des Antidumpingzolls, der mit der Verordnung
    (EWG) Nr. 2474/93 auf die Einfuhren von Fahrrädern mit Ursprung in der Volksrepublik
    China eingeführt und mit der Verordnung (EG) Nr. 1524/2000 aufrechterhalten wurde,
    und zur Aufhebung der gemäß der Verordnung (EG) Nr. 88/97 der Kommission erfolgten
    Aussetzung der Entrichtung des auf bestimmte Fahrradteile mit Ursprung in der
    Volksrepublik China ausgeweiteten Antidumpingzolls im Fall bestimmter Parteien
    (Bekannt gegeben unter Aktenzeichen K(2003) 4419)'
  type: main
- language: bg
  script: Cyrl
  content: Решение на Комисията от 28 ноември 2003 година
    за освобождаване на някои дружества от разширяването
    с Регламент (ЕО) № 71/97 на Съвета по отношение
    на някои части за велосипеди на действието
    на антидъмпинговото мито за велосипеди с произход
    от Китайската народна република, наложено
    с Регламент (ЕИО) № 2474/93 на Съвета и оставено
    в сила с Регламент (ЕО) № 1524/2000 на Съвета, и за
    отмяна на спирането на плащане на антидъмпингово
    мито, разширено по отношение на някои части
    за велосипеди с произход от Китайската народна
    република, предоставено на някои дружества
    в съответствие с Регламент (ЕО) № 88/97 на Съвета
    (нотифицирано под номер С(2003) 4419)
  type: main
- language: cs
  script: Latn
  content: Rozhodnutí Komise ze dne 28. listopadu 2003, kterým se některé strany
    osvobozují od rozšíření antidumpingového cla z dovozu jízdních kol pocházejících
    z Čínské lidové republiky, uloženého nařízením Rady (EHS) č. 2474/93
    a zachovaného nařízením Rady (ES) č. 1524/2000, na některé součásti jízdních
    kol podle nařízení Rady (ES) č. 71/97 a kterým se zrušuje pozastavení platby
    antidumpingového cla rozšířeného na některé součásti jízdních kol pocházející
    z Čínské lidové republiky, jež bylo některým stranám uděleno podle nařízení
    Komise (ES) č. 88/97 (oznámeno pod číslem K(2003) 4419)
  type: main
- language: da
  script: Latn
  content: '2003/899/EF: Kommissionens beslutning af 28. november 2003 om indrømmelse
    af fritagelse til visse parter for den udvidelse til at omfatte visse dele til
    cykler, der indførtes ved Rådets forordning (EF) nr. 71/97, af den ved Rådets
