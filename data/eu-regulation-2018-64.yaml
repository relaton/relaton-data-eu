title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2018/64 of 29 September 2017 supplementing
    Regulation (EU) 2016/1011 of the European Parliament and of the Council with regard
    to specifying how the criteria of Article 20(1)(c)(iii) are to be applied for
    assessing whether certain events would result in significant and adverse impacts
    on market integrity, financial stability, consumers, the real economy or the financing
    of households and businesses in one or more Member States
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2018/64 de la Commission du 29 septembre 2017
    complétant le règlement (UE) 2016/1011 du Parlement européen et du Conseil
    en précisant comment les critères énoncés à son article 20, paragraphe 1,
    point c) iii), doivent être appliqués pour évaluer si certains événements
    entraîneraient des incidences négatives notables sur l'intégrité du marché,
    la stabilité financière, les consommateurs, l'économie réelle ou le financement
    des ménages et des entreprises dans un ou plusieurs États membres
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2018/64 der Kommission vom 29. September 2017
    zur Ergänzung der Verordnung (EU) 2016/1011 des Europäischen Parlaments und
    des Rates durch die Festlegung, wie die in Artikel 20 Absatz 1 Buchstabe c Ziffer
    iii genannten Kriterien anzuwenden sind, wenn beurteilt wird, ob bestimmte Ereignisse
    in einem oder mehreren Mitgliedstaaten erhebliche nachteilige Auswirkungen auf
    die Integrität der Märkte, die Finanzstabilität, die Verbraucher, die Realwirtschaft
    oder die Finanzierung der Haushalte und Unternehmen hätten
  type: main
- language: bg
  script: Cyrl
