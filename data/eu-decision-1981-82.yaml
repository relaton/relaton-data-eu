    πού προβλέπεται από τήν απόφαση 80/1278/ΕΟΚ τού
    Συμβουλίου καί πού εφαρμόζεται στή Γαλλία
    έναντι τής Τσεχοσλοβακίας όσον αφορά τό φυσικό
    μέλι (Το κείμενο στην γαλλική γλώσσα είναι
    το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
