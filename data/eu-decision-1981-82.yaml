title:
- language: en
  script: Latn
  content: '81/82/EEC: Commission Decision of 27 January 1981 changing the import
    arrangements established by Council Decision 80/1278/EEC and applied in France
    in respect of imports of natural honey from Czechoslovakia (Only the French text
    is authentic)'
  type: main
- language: fr
  script: Latn
  content: '81/82/CEE: Décision de la Commission, du 27 janvier 1981, modifiant le
    régime d''importation prévu par la décision 80/1278/CEE du Conseil et appliqué
    en France à l''égard de la Tchécoslovaquie en ce qui concerne le miel naturel
    (Le texte en langue française est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '81/82/EWG: Entscheidung der Kommission vom 27. Januar 1981 zur Änderung
    der durch Entscheidung 80/1278/EWG des Rates vorgesehenen und in Frankreich gegenüber
    der Tschechoslowakei für natürlichen Honig angewandten Einfuhrregelung (Nur
    der französische Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '81/82/EØF: Kommissionens beslutning af 27. januar 1981 om ændring af
    den importordning, der er fastsat i Rådets beslutning 80/1278/EØF og som anvendes
    i Frankrig over for Tjekkoslovakiet for så vidt angår naturlig honning (Kun
    den franske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '81/82/ΕΟΚ: Απόφαση τής Επιτροπής τής 27ης Ιανουαρίου
