title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 382/86 of 20 February 1986 re-establishing
    the levying of customs duties on urea containing more than 45 % by weight of nitrogen
    on the dry anhydrous product falling within subheading 31.02 B, originating in
    Kuwait, to which the preferential tariff arrangements set out in Council Regulation
    (EEC) No 3599/85 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 382/86 de la Commission du 20 février 1986 portant
    rétablissement de la perception des droits de douane applicables à l' urée
    d' une teneur en azote supérieure à 45 % en poids du produit anhydré à l'
    état sec, de la sous-position 31.02 B du tarif douanier commun, originaires de
    Kuwait, bénéficiaire des préférences tarifaires prévues par le règlement
    (CEE) n° 3599/85 du Conseil
  type: main
