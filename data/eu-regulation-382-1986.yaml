    der Tarifstelle 31.02 B des Gemeinsamen Zolltarifs mit Ursprung in Kuwait, dem
    die in der Verordnung (EWG) Nr. 3599/85 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 382/86 af 20. februar 1986 om genindførelse
