title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 638/2003 of 9 April 2003 laying down detailed
    rules for applying Council Regulation (EC) No 2286/2002 and Council Decision 2001/822/EC
    as regards the arrangements applicable to imports of rice originating in the African,
    Caribbean and Pacific States (ACP States) and the overseas countries and territories
    (OCT)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 638/2003 de la Commission du 9 avril 2003 portant modalités
    d'application du règlement (CE) n° 2286/2002 du Conseil et de la décision 2001/822/CE
    du Conseil en ce qui concerne le régime applicable à l'importation de riz originaire
    des États d'Afrique, des Caraïbes et du Pacifique (ACP) et des pays et territoires
    d'outre-mer (PTOM)
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 638/2003 der Kommission vom 9. April 2003 mit Durchführungsbestimmungen
