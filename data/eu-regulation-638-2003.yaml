    de arroz originário dos Estados de África, das Caraíbas e do Pacífico (ACP)
    e dos países e territórios ultramarinos (PTU)
  type: main
- language: sk
  script: Latn
  content: Nariadenie Komisie (ES) č. 638/2003 z 9. apríla 2003, ktorým sa ustanovujú
