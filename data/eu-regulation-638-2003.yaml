    Rady 2001/822/WE w odniesieniu do uzgodnień mających zastosowanie do przywozu
    ryżu pochodzącego z Państw Afryki, Karaibów i Pacyfiku (Państw AKP) oraz
    z krajów i terytoriów zamorskich (KTZ)
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) n.° 638/2003 da Comissão, de 9 de Abril de 2003, que
