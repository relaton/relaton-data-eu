---
id: EUDecision20171104
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2017/1104 of 20 June 2017 determining
    that a temporary suspension of the preferential customs duty pursuant to Article
    15 of Regulation (EU) No 20/2013 is not appropriate for imports of bananas originating
    in Nicaragua
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2017/1104 de la Commission du 20 juin 2017
    déterminant qu'une suspension temporaire du droit de douane préférentiel au
    titre de l'article 15 du règlement (UE) n° 20/2013 n'est pas appropriée dans
    le cas des importations de bananes originaires du Nicaragua
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2017/1104 der Kommission vom 20. Juni 2017
    zur Feststellung, dass eine vorübergehende Aussetzung des Präferenzzolls nach
    Artikel 15 der Verordnung (EU) Nr. 20/2013 für Einfuhren von Bananen mit Ursprung
    in Nicaragua nicht angemessen ist
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2017/1104 на Комисията
    от 20 юни 2017 година за определяне на временното
    спиране на прилагането на преференциалното
    мито по член 15 от Регламент (ЕС) № 20/2013 за нецелесъобразно
    по отношение на вноса на банани с произход
    от Никарагуа
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2017/1104 ze dne 20. června 2017,
    kterým se stanoví, že dočasné pozastavení preferenční celní sazby podle
    článku 15 nařízení (EU) č. 20/2013 není vhodné pro dovoz banánů pocházejících
    z Nikaraguy
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2017/1104 af 20. juni 2017
    om fastsættelse af, at en midlertidig suspension af den præferencetold, som
    er fastsat i henhold til artikel 15 i forordning (EU) nr. 20/2013, ikke er hensigtsmæssig
    for import af bananer med oprindelse i Nicaragua
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2017/1104 της Επιτροπής,
    της 20ής Ιουνίου 2017, η οποία ορίζει ότι η προσωρινή
    αναστολή του προτιμησιακού δασμού, σύμφωνα
    με το άρθρο 15 του κανονισμού (ΕΕ) αριθ. 20/2013,
    δεν είναι σκόπιμη για τις εισαγωγές μπανανών
    καταγωγής Νικαράγουας
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2017/1104, 20. juuni 2017, milles sätestatakse,
    et Nicaraguast pärit banaanide impordi suhtes kehtiva (määruse (EL) nr 20/2013
    artikli 15 kohase) soodustollimaksu ajutine peatamine ei ole asjakohane
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2017/1104, annettu 20 päivänä
    kesäkuuta 2017, sen määrittämisestä, että asetuksen (EU) N:o 20/2013 15
    artiklan mukainen etuustullin väliaikainen suspendoiminen ei ole tarpeen Nicaraguasta
    peräisin olevien banaanien tuonnissa
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2017/1104 оd 20. lipnja 2017. kojom se
    utvrđuje da privremena obustava povlaštenih carina utvrđena na temelju članka
    15. Uredbe (EU) br. 20/2013 nije primjerena za uvoz banana podrijetlom iz Nikaragve
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2017/1104 végrehajtási határozata (2017. június 20.)
    a Nicaraguából származó banán behozatalára a 20/2013/EU rendelet 15. cikke
    értelmében alkalmazott kedvezményes vámtételek ideiglenes felfüggesztése
    nem helyénvaló voltának megállapításáról
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2017/1104 della Commissione, del 20 giugno
    2017, che stabilisce che la sospensione temporanea del dazio doganale preferenziale
    a norma dell'articolo 15 del regolamento (UE) n. 20/2013 non è appropriata per
    quanto riguarda le importazioni di banane originarie del Nicaragua
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2017/1104 (2017. gada 20. jūnijs),
    ar ko nosaka, ka tā atvieglotā muitas nodokļa pagaidu atcelšana, kurš noteikts
    saskaņā ar Regulas (ES) Nr. 20/2013 15. pantu, attiecībā uz Nikaragvas izcelsmes
    banānu importu nav atbilstīga
  type: main
- language: lt
  script: Latn
  content: 2017 m. birželio 20 d. Komisijos įgyvendinimo sprendimas (ES) 2017/1104,
    kuriuo nustatoma, kad laikinas lengvatinės muito normos taikymo sustabdymas pagal
    Reglamento (ES) Nr. 20/2013 15 straipsnį importuojamiems Nikaragvos kilmės bananams
    yra netinkamas
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta' Implimentazzjoni tal-Kummissjoni (UE) 2017/1104 tal-20
    ta' Ġunju 2017 li tiddetermina li s-sospensjoni temporanja tad-dazju doganali
    preferenzjali skont l-Artikolu 15 tar-Regolament (UE) Nru 20/2013 mhijiex xierqa
    għal importazzjonijiet ta' banana li joriġinaw min-Nikaragwa
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2017/1104 van de Commissie van 20 juni 2017 waarbij
    wordt bepaald dat een tijdelijke opschorting van het preferentiële douanerecht
    krachtens artikel 15 van Verordening (EU) nr. 20/2013 niet passend is voor de
    invoer van bananen van oorsprong uit Nicaragua
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2017/1104 z dnia 20 czerwca 2017 r. stanowiąca,
    że tymczasowe zawieszenie preferencyjnego cła na podstawie art. 15 rozporządzenia
    (UE) nr 20/2013 nie jest odpowiednie w odniesieniu do przywozu bananów pochodzących
    z Nikaragui
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2017/1104 da Comissão, de 20 de junho de 2017,
    que determina que a suspensão temporária do direito aduaneiro preferencial,
    nos termos do disposto no artigo 15.° do Regulamento (UE) n.° 20/2013, não
    é adequada para as importações de bananas originárias da Nicarágua
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2017/1104 a Comisiei din 20 iunie 2017
    de stabilire a faptului că o suspendare temporară a taxei vamale preferențiale
    în temeiul articolului 15 din Regulamentul (UE) nr. 20/2013 nu este adecvată
    pentru importurile de banane originare din Nicaragua
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2017/1104 z 20. júna 2017, ktorým
    sa určuje, že dočasné pozastavenie preferenčného cla podľa článku 15
    nariadenia (EÚ) č. 20/2013 nie je primerané pre dovoz banánov s pôvodom v
    Nikarague
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2017/1104 z dne 20. junija 2017 o ugotovitvi,
    da začasna opustitev preferencialnih carin v skladu s členom 15 Uredbe (EU)
    št. 20/2013 ni primerna za uvoz banan s poreklom iz Nikaragve
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2017/1104 de la Comisión, de 20 de junio
    de 2017, por la que se determina que una suspensión temporal del arancel aduanero
    preferencial con arreglo al artículo 15 del Reglamento (UE) n.° 20/2013 no es
    apropiada para las importaciones de plátanos (bananas) originarios de Nicaragua
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2017/1104 av den 20 juni 2017 om
    fastställande av att ett tillfälligt upphävande av förmånstullarna i enlighet
    med artikel 15 i förordning (EU) nr 20/2013 inte är lämpligt för import av
    bananer med ursprung i Nicaragua
  type: main
