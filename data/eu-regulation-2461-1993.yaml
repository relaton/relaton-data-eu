    υπάγονται στο παράρτημα II της συνθήκης
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2461/93 della Commissione, del 3 settembre 1993, che
    rettifica il regolamento (CEE) n. 2416/93 che fissa i tassi delle restituzioni
    applicabili a taluni prodotti dei settori dei cereali e del riso esportati sotto
    forma di merci non comprese nell'allegato II del Trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2461/93 van de Commissie van 3 september 1993 tot
