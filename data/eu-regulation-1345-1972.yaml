title:
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1345/72 de la Commission, du 28 juin 1972, portant
    rétablissement de la perception des droits du tarif douanier commun applicables
    aux articles et engins pour les jeux de plein air, etc., des sous- positions tarifaires
    97.06 B et C, originaires du Pakistan, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) n° 2795/71 du Conseil du 20 décembre 1971
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1345/72 der Kommission vom 28. Juni 1972 zur Wiedereinführung
    des Zollsatzes des Gemeinsamen Zolltarifs für Geräte für Freiluftspiele usw.
    der Tarifstellen 97.06 B und C, mit Ursprung in Pakistan, dem die in der Verordnung
    (EWG) Nr. 2795/71 des Rates vom 20. Dezember 1971 vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1345/72 della Commissione, del 28 giugno 1972, che
    ripristina la riscossione dei dazi della tariffa doganale comune applicabili agli
    oggetti ed attrezzi per giochi all'aperto, ecc., delle sottovoci doganali 97.06
    B e C, originari del Pakistan beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 2795/71 del Consiglio, del 20 dicembre 1971
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1345/72 van de Commissie van 28 juni 1972 houdende
    wederinvoering van de heffing van de rechten van het gemeenschappelijk douanetarief
    van toepassing op artikelen en toestellen voor openluchtspelen, enz., van onderverdelingen
    97.06 B en C, van oorsprong uit Pakistan, ten behoeve waarvan bij Verordening
    (EEG) nr. 2795/71 van de Raad van 20 december 1971 algemene tariefpreferenties
    werden geopend
  type: main
