title:
- language: fr
  script: Latn
  content: Règlement (CEE) n 2630/69 de la Commission, du 23 décembre 1969, fixant
    les taux des restitutions applicables, à compter du 1er janvier 1970, à certains
    produits des secteurs des céréales et du riz exportés sous forme de marchandises
    ne relevant pas de l'annexe II du traité
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2630/69 der Kommission vom 23. Dezember 1969 zur Festsetzung
    der ab 1. Januar 1970 geltenden Erstattungssätze bei der Ausfuhr bestimmter Getreide-
    und Reiserzeugnisse in Form von nicht unter Anhang II des Vertrages fallenden
    Waren
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2630/69 della Commissione, del 23 dicembre 1969, che
    fissa i tassi delle restituzioni applicabili, a decorrere dal 1 gennaio 1970,
    a taluni prodotti dei settori dei cereali e del riso esportati sotto forma di
    merci non comprese nell'allegato II del trattato
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2630/69 van de Commissie van 23 december 1969 houdende
    vaststelling van de restituties die met ingang van 1 januari 1970 worden toegepast
    voor bepaalde produkten van de sector granen en de sector rijst, uitgevoerd in
    de vorm van niet in bijlage II van het Verdrag vermelde goederen
  type: main
