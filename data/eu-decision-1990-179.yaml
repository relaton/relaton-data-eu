type: standard
title:
- language: en
  script: Latn
  content: '90/179/Euratom, EEC: Commission Decision of 23 March 1990 authorizing
    the Federal Republic of Germany to use statistics for years earlier than the last
    year but one and not to take into account certain categories of transactions or
    to use certain approximate estimates for the calculation of the VAT own resources
    base (Only the German text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '90/179/Euratom, CEE: Décision de la Commission, du 23 mars 1990, autorisant
    la République fédérale d''Allemagne à utiliser des données statistiques antérieures
    à la pénultième année et à ne pas tenir compte de certaines catégories d''opérations
    ou à utiliser certaines estimations approximatives pour le calcul de la base
    des ressources propres provenant de la taxe sur la valeur ajoutée (Le texte en
    langue allemande est le seul faisant foi.)'
  type: main
- language: de
  script: Latn
  content: '90/179/Euratom, EWG: Entscheidung der Kommission vom 23. März 1990 mit
    der die Bundesrepublik Deutschland ermächtigt wird, statistische Angaben vor
    dem vorletzten Jahr zu verwenden und bei der Berechnung der Grundlage für die
    MwSt.-Eigenmittel bestimmte Gruppen von Umsätzen nicht zu berücksichtigen und
    die Grundlage bei bestimmten anderen Gruppen von Umsätzen anhand annähernder
    Schätzungen zu ermitteln (Nur der deutsche Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '90/179/Euratom, EØF: Kommissionens beslutning af 23. marts 1990 om bemyndigelse
    af Tyskland til at beregne grundlaget for Fællesskabernes momsindtægter på
    basis af statistiske oplysninger hidhørende fra et år, der ligger længere tilbage
    end det næstsidste år, at undlade at tage hensyn til visse transaktioner og,
    for andre transaktioners vedkommende, at foretage en tilnærmelsesvis vurdering
    (Kun den tyske udgave er autentisk)'
  type: main
- language: el
  script: Grek
  content: '90/179/Ευρατόμ, ΕΟΚ: Απόφαση της Επιτροπής
    της 23ης Μαρτίου 1990 με την οποία επιτρέπεται
    στη Γερμανία να χρησιμοποιεί στατιστικά δεδομένα
    προγενέστερα εκείνων του προτελευταίου έτους
    και να μην λαμβάνει υπόψη ορισμένες κατηγορίες
    δραστηριοτήτων ή να χρησιμοποιεί κατά προσέγγιση
    εκτιμήσεις κατά τον υπολογισμό της βάσης των
    ιδίων πόρων που προέρχονται από το φόρο επί
    της προστιθέμενης αξίας (Το κείμενο στη γερμανική
    γλώσσα είναι το μόνο αυθεντικό)'
  type: main
- language: it
  script: Latn
  content: '90/179/Euratom, CEE: Decisione della Commissione, del 23 marzo 1990, che
    autorizza la Repubblica federale di Germania a utilizzare dati statistici anteriori
    al penultimo anno e a non tener conto di determinate categorie di operazioni o
    a ricorrere a talune valutazioni approssimative per il calcolo della base delle
    risorse proprie provenienti dall''imposta sul valore aggiunto (Il testo in lingua
    tedesca è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '90/179/Euratom, EEG: Beschikking van de Commissie van 23 maart 1990 waarbij
    de Bondsrepubliek Duitsland wordt gemachtigd gebruik te maken van statistische
    gegevens van aan het voorlaatste jaar voorafgaande jaren en geen rekening te houden
    met bepaalde categorieën handelingen of gebruik te maken van ramingen voor de
    berekening van de grondslag van de eigen middelen uit de belasting over de toegevoegde
    waarde (Slechts de tekst in de Duitse taal is authentiek)'
  type: main
- language: pt
  script: Latn
  content: '90/179/Euratom, CEE: Decisão da Comissão, de 23 de Março de 1990, que
    autoriza a República Federal da Alemanha a utilizar dados estatísticos anteriores
    ao penúltimo ano e a não ter em conta certas categorias de operações e a utilizar
    determinadas estimativas aproximativas para o cálculo da matéria colectável
    dos recursos próprios provenientes do imposto sobre o valor acrescentado (Apenas
    faz fé o texto em língua alemã)'
  type: main
- language: es
  script: Latn
  content: '90/179/Euratom, CEE: Decisión de la Comisión, de 23 de marzo de 1990,
    por la que se autoriza a la República Federal de Alemania a utilizar datos estadísticos
    anteriores al penúltimo año y a no tomar en consideración determinadas categorías
    de operaciones y utilizar estimaciones aproximadas para el cálculo de la base
    de los recursos propios procedentes del impuesto sobre el valor añadido (El texto
    en lengua alemana es el único auténtico)'
