---
id: EUDecision20202215
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2020/2215 of 22 December 2020 amending
    Annex I to Implementing Decision 2011/630/EU as regards the entries for the United
    Kingdom and certain of the Crown Dependencies in the list of third countries or
    parts thereof authorised for imports into the Union of semen of domestic animals
    of the bovine species (notified under document C(2020) 9552)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2020/2215 de la Commission du 22 décembre
    2020 modifiant l’annexe I de la décision d’exécution 2011/630/UE en ce qui
    concerne les mentions relatives au Royaume-Uni et à certaines dépendances de
    la Couronne dans la liste des pays tiers ou parties de pays tiers en provenance
    desquels les importations dans l’Union de sperme d’animaux domestiques de
    l’espèce bovine sont autorisées [notifiée sous le numéro C(2020) 9552]
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2020/2215 der Kommission vom 22. Dezember
    2020 zur Änderung des Anhangs I des Durchführungsbeschlusses 2011/630/EU im
    Hinblick auf die Einträge für das Vereinigte Königreich und bestimmte unmittelbar
    der englischen Krone unterstehende Gebiete in der Liste der Drittländer bzw.
    der Teile von Drittländern, aus denen die Einfuhr von Rindersperma in die Union
    zugelassen ist (Bekannt gegeben unter Aktenzeichen C(2020) 9552)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2020/2215 на Комисията
    от 22 декември 2020 година за изменение на приложение
    I към Решение за изпълнение 2011/630/ЕС по отношение
    на вписванията за Обединеното кралство и някои
    подчинени на Британската корона територии
    в списъка на трети страни или части от тях,
    от които е разрешен вносът в Съюза на сперма
    от домашни животни от рода на едрия рогат добитък
    (нотифицирано под номер С(2020) 9552)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2020/2215, ze dne 22. prosince 2020,
    kterým se mění příloha I prováděcího rozhodnutí 2011/630/EU, pokud jde
    o položky týkající se Spojeného království a některých jeho závislých
    území v seznamu třetích zemí nebo jejich částí, ze kterých je povolen
    dovoz spermatu skotu do Unie (oznámeno pod číslem C(2020) 9552)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2020/2215 af 22. december
    2020 om ændring af bilag I til gennemførelsesafgørelse 2011/630/EU for så
    vidt angår oplysningerne om Det Forenede Kongerige og visse af kronbesiddelserne
    i listen over tredjelande eller dele deraf, hvorfra det er tilladt at importere
    tyresæd til Unionen (meddelt under nummer C(2020) 9552)
  type: main
- language: el
  script: Grek
  content: Εκτελεστική απόφαση (ΕΕ) 2020/2215 της Επιτροπής
    της 22ης Δεκεμβρίου 2020 για την τροποποίηση του
    παραρτήματος I της εκτελεστικής απόφασης 2011/630/ΕΕ
    όσον αφορά τις καταχωρίσεις για το Ηνωμένο
    Βασίλειο και ορισμένες Εξαρτήσεις του Στέμματος
    στον κατάλογο τρίτων χωρών ή τμημάτων τους
    εκ των οποίων επιτρέπονται οι εισαγωγές σπέρματος
    κατοικίδιων βοοειδών στην Ένωση [κοινοποιηθείσα
    υπό τον αριθμό C(2020) 9552]
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2020/2215, 22. detsember 2020, millega muudetakse
    rakendusotsuse 2011/630/EL I lisa Ühendkuningriiki ja teatavaid Briti krooni
    sõltkondi käsitlevate kannete osas selliste kolmandate riikide või nende osade
    loetelus, kust on lubatud liitu importida koduveiste spermat (teatavaks tehtud
    numbri C(2020) 9552 all)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2020/2215, annettu 22 päivänä
    joulukuuta 2020, täytäntöönpanopäätöksen 2011/630/EU liitteen I muuttamisesta
    siltä osin kuin on kyse Yhdistynyttä kuningaskuntaa ja tiettyjä sen kruunun
    alaisuuteen kuuluvia alueita koskevista kohdista sellaisten kolmansien maiden
    tai niiden osien luettelossa, joista naudansukuisten kotieläinten siemennesteen
    tuonti unioniin on sallittua (tiedoksiannettu numerolla C(2020) 9552)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2020/2215 оd 22. prosinca 2020. o izmjeni
    Priloga I. Provedbenoj odluci 2011/630/EU u pogledu unosa za Ujedinjenu Kraljevinu
    i određene krunske posjede na popisu trećih zemalja ili njihovih dijelova iz
    kojih je odobren uvoz sjemena domaćih životinja vrste goveda u Uniju (priopćeno
    pod brojem dokumenta C(2020) 9552)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2020/2215 végrehajtási határozata (2020. december
    22.) a 2011/630/EU végrehajtási határozat I. mellékletének az Egyesült Királyság
    és egyes koronafüggőségeinek a szarvasmarhafélék spermájának Unióba történő
    behozatala vonatkozásában engedélyezett harmadik országok vagy azok részeinek
    jegyzékébe való bejegyzése tekintetében történő módosításáról (az
    értesítés a C(2020) 9552. számú dokumentummal történt)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2020/2215 della Commissione del 22 dicembre
    2020 che modifica l’allegato I della decisione di esecuzione 2011/630/UE per
    quanto riguarda la voce relativa al Regno Unito e ad alcune dipendenze della Corona
    nell’elenco dei paesi terzi o di parti di paesi terzi da cui sono autorizzate
    le importazioni nell’Unione di sperma di animali della specie bovina [notificata
    con il numero C(2020) 9552]
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2020/2215 (2020. gada 22. decembris),
    ar ko Īstenošanas lēmuma 2011/630/ES I pielikumu groza attiecībā uz Apvienotās
    Karalistes un dažu atkarīgo teritoriju iekļaušanu to trešo valstu vai to
    daļu sarakstā, no kurām Savienībā atļauts ievest liellopu sugu mājdzīvnieku
    spermu (izziņots ar dokumenta numuru C(2020) 9552)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2020/2215 2020 m. gruodžio 22
    d. kuriuo dėl Jungtinės Karalystės ir tam tikrų Didžiosios Britanijos Karūnos
    priklausinių įrašų trečiųjų šalių arba jų dalių, iš kurių leidžiama
    importuoti į Sąjungą galvijų sėklą, sąraše iš dalies keičiamas Įgyvendinimo
    sprendimo 2011/630/ES I priedas (pranešta dokumentu Nr. C(2020) 9552)
  type: main
- language: mt
  script: Latn
  content: Id-Deċiżjoni ta’ Implimentazzojni tal-Kummissjoni (UE) 2020/2215 tat-22
    ta’ Diċembru 2020 li temenda l-Anness I tad-Deċiżjoni ta’ Implimentazzjoni
    2011/630/UE fir-rigward tal-entrati tar-Renju Unit u ċertu Dipendenzi tal-Kuruna
    fil-lista ta’ pajjiżi terzi jew partijiet minnhom awtorizzati għall-importazzjonijiet
    fl-Unjoni ta’ semen ta’ annimali domestiċi tal-ispeċi tal-bovini (notifikata
    bid-dokument C(2020) 9552)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2020/2215 van de Commissie van 22 december 2020
    tot wijziging van bijlage I bij Uitvoeringsbesluit 2011/630/EU wat betreft de
    vermelding van het Verenigd Koninkrijk en sommige van de Kroon afhankelijke gebieden
    in de lijst van derde landen of delen daarvan waaruit rundersperma in de Unie
    mag worden ingevoerd (Kennisgeving geschied onder nummer C(2020) 9552)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2020/2215 z dnia 22 grudnia 2020 r. zmieniająca
    załącznik I do decyzji wykonawczej 2011/630/UE w odniesieniu do wpisów dotyczących
    Zjednoczonego Królestwa i niektórych terytoriów zależnych Korony Brytyjskiej
    w wykazie państw trzecich lub ich części, z których dozwolony jest przywóz
    do Unii nasienia bydła domowego (notyfikowana jako dokument nr C(2020) 9552)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2020/2215 da Comissão de 22 de dezembro de
    2020 que altera o anexo I da Decisão de Execução 2011/630//UE no que diz respeito
    à inclusão do Reino Unido e de certas dependências da Coroa na lista de países
    terceiros ou partes de países terceiros autorizados a introduzir na União sémen
    de animais domésticos da espécie bovina [notificada com o número C(2020) 9552]
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2020/2215 a Comisiei din 22 decembrie
    2020 de modificare a anexei I la Decizia de punere în aplicare 2011/630/UE în
    ceea ce privește rubricile referitoare la Regatul Unit și la anumite dependențe
    ale Coroanei britanice din lista țărilor terțe sau a părților acestora autorizate
    pentru importurile în Uniune de material seminal de animale domestice din specia
    bovină [notificată cu numărul C(2020) 9552]
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2020/2215 z 22. decembra 2020, ktorým
    sa mení príloha I k vykonávaciemu rozhodnutiu 2011/630/EÚ, pokiaľ ide o položky
    týkajúce sa Spojeného kráľovstva a niektorých korunných dependencií v
    zozname tretích krajín, z ktorých je povolený dovoz spermy domáceho hovädzieho
    dobytka do Únie [oznámené pod číslom C(2020) 9552]
  type: main
- language: sl
  script: Latn
  content: Delegirani sklep Komisije (EU) 2020/2215 z dne 22. decembra 2020 o spremembi
    Priloge I k Izvedbenemu sklepu 2011/630/EU glede vnosov za Združeno kraljestvo
    in nekatera kronska odvisna ozemlja na seznam tretjih držav ali delov tretjih
    držav, iz katerih je dovoljen vnos semena domačih živali iz vrst govedi v Unijo
    (notificirano pod dokumentarno številko C(2020) 9552)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2020/2215 de la Comisión de 22 de diciembre
    de 2020 por la que se modifica el anexo I de la Decisión de Ejecución 2011/630/UE
    en lo relativo a la inclusión del Reino Unido y de algunas dependencias de la
    Corona en la lista de terceros países o partes de ellos autorizados a importar
    en la Unión esperma de bovinos domésticos [notificada con el número C(2020)
    9552]
  type: main
- language: sv
  script: Latn
  content: Kommissionens genomförandebeslut (EU) 2020/2215 av den 22 december 2020
    om ändring av bilaga I till genomförandebeslut 2011/630/EU vad gäller införande
    av Förenade kungariket och vissa av dess kronbesittningar i förteckningen över
    tredjeländer eller delar därav från vilka sperma från tamdjur av nötkreatur
    får importeras till unionen [delgivet med nr C(2020) 9552]
