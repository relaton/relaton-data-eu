title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 903/96 of 20 May 1996 laying down rates of
    compensatory interest applicable during the second half of 1996 to customs debts
    incurred in relation to compensating products or goods in the unaltered state
    (inward processing relief arrangements and temporary importation)
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 903/96 de la Commission, du 20 mai 1996, fixant les
    taux d'intérêts compensatoires applicables en cas de naissance d'une dette douanière
    relative aux produits compensateurs ou aux marchandises en l'état (régime du
    perfectionnement actif, système de la suspension et régime de l'admission temporaire)
    pendant le deuxième semestre de 1996
  type: main
- language: de
  script: Latn
