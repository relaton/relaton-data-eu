type: standard
title:
- language: en
  script: Latn
  content: '79/884/EEC: Commission Decision of 9 October 1979 authorizing the United
    Kingdom not to apply Community treatment to gloves, mittens and mitts, knitted
    or crocheted, not elastic or rubberized, other than those of category 10, of wool,
    of cotton or of man-made textile fibres falling within subheading 60.02 B of the
    Common Customs Tariff (NIMEXE codes 60.02-50, 60, 70, 80) (category 11), originating
    in the Philippines and in free circulation in the other Member States (Only the
    English text is authentic)'
  type: main
- language: fr
  script: Latn
  content: '79/884/CEE: Décision de la Commission, du 9 octobre 1979, autorisant
    le Royaume-Uni à exclure du traitement communautaire la ganterie de bonneterie
    non élastique ni caoutchoutée, autre que celle de la catégorie 10, de laine,
    de coton ou de fibres textiles synthétiques ou artificielles, de la sous-position
    60.02 B du tarif douanier commun (codes Nimexe: 60.02-50, 60, 70, 80) (catégorie
    11), originaire des Philippines et mise en libre pratique dans les autres Etats
    membres (Le texte en langue anglaise est le seul faisant foi)'
  type: main
- language: de
  script: Latn
  content: '79/884/EWG: Entscheidung der Kommission vom 9. Oktober 1979, mit der das
    Vereinigte Königreich ermächtigt wird, aus den Philippinen stammende und in
    den übrigen Mitgliedstaaten im freien Verkehr befindliche Handschuhe aus Gewirken,
    weder gummielastisch noch kautschutiert, andere als Waren der Kategorie 10, aus
    Wolle, Baumwolle oder synthetischen oder künstlichen Spinnstoffen, der Tarifstelle
    60.02 B des Gemeinsamen Zolltarifs (NIMEXE- Kennziffern 60.02-50 ; 60 ; 70 ; 80)
    (Kategorie 11) von der Gemeinschaftsbehandlung auszuschließen (Nur der englische
    Text ist verbindlich)'
  type: main
- language: da
  script: Latn
  content: '79/884/EØF: Kommissionens beslutning af 9. oktober 1979 om bemyndigelse
    af Det forenede Kongerige til fra fællesskabsbehandling at undtage handsker,
    vanter og luffer, af trikotage, ikke elastisk eller gummeret ; bortset fra varer
    i kategori 10, af uld, bomuld eller syntetiske eller regenererede fibre, som henhører
    under pos. 60.02 B i den fælles toldtarif (NIMEXE-nummer 60.02-50, 60, 70, 80)
    kategori 11, har oprindelse i Philippinerne og frit kan omsættes i de øvrige
    medlemsstater (Kun den engelske udgave er autentisk)'
  type: main
- language: it
  script: Latn
  content: '79/884/CEE: Decisione della Commissione, del 9 ottobre 1979, che autorizza
    il Regno Unito ad escludere dal trattamento comunitario i guanti a maglia non
    elastica né gommata, diversi da quelli della categria 10, di lana, di cotone
    o di fibre tessili sintetiche o artificiali, della sottovoce 60.02 B della tariffa
    doganale comune (codici Nimexe: 60.02-50, 60, 70, 80), categoria 11, originari
    delle Filippine e messi in libera pratica negli altri Stati membri (Il testo in
    lingua inglese è il solo facente fede)'
  type: main
- language: nl
  script: Latn
  content: '79/884/EEG: Beschikking van de Commissie van 9 oktober 1979 waarbij het
    Verenigd Koninkrijk wordt gemachtigd handschoenen, wanten en dergelijke van niet-elastisch
    of van niet-gegummeerd brei- of haakwerk, andere dan die van categorie 10, van
    wol, katoen of van synthetische of kunstmatige textielvezels, van post 60.02 B
    van het gemeenschappelijk douanetarief (NIMEXE-code 60.02-50, 60, 70, 80) (categorie
    11), van oorsprong uit de Filippijnen en in de overige Lid-Staten in het vrije
    verkeer gebracht, van de communautaire behandeling uit te sluiten (Slechts de
    tekst in de Engelse taal is authentiek)'
