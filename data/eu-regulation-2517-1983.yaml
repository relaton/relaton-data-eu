title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2517/83 of 7 September 1983 fixing for the
    1983/84 marketing year the Community offer price for mandarins including tangerines
    and satsumas, Wilkings and other similar citrus hybrids, with the exception of
    clementines, applicable as regards Greece
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2517/83 de la Commission du 7 septembre 1983 fixant,
    pour la campagne 1983/1984, le prix d' offre communautaire valable pour les mandarines,
    y compris tangerines et satsumas, wilkings et autres hybrides similiaires d' agrumes,
    à l' exclusion des clémentines, applicable vis-à-vis de la Grèce
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2517/83 der Kommission vom 7. September 1983 zur Festsetzung
    des Angebotspreises der Gemeinschaft für Mandarinen, einschließlich Tangerinen
    und Satsumas, Wilkings und andere ähnliche Kreuzungen von Zitrusfrüchten, ausgenommen
    Clementinen, gegenüber Griechenland für das Wirtschaftsjahr 1983/84
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2517/83 af 7. september 1983 om fastsættelse
    for produktionsåret 1983/84 for så vidt angår Grækenland af fællesskabstilbudsprisen
    på mandariner (herunder tangeriner og satsumas), wilkings og andre lignende krydsninger
    af citrusfrugter bortset fra clementiner
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2517/83 της Επιτροπής
    της 7ης Σεπτεμβρίου 1983 περί καθορισμού, για
    την περίοδο εμπορίας 1983/84, της ισχύουσας κοινοτικής
    τιμής προσφοράς για τα μανταρίνια, συμπεριλαμβανομένων
    των tangerines, satsumas, wilkings και άλλων παρόμοιων υβριδίων
    εσπεριδοειδών, εξαιρέσει των κλημεντινών
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2517/83 della Commissione del 7 settembre 1983 che
    fissa, per la campagna 1983/1984, il prezzo d' offerta comunitario applicabile
    nei confronti della Grecia per i mandarini, compresi i tangerini e i mandarini
    satsuma (o sazuma), wilkings e altri simili ibridi di agrumi, escluse le clementine
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2517/83 van de Commissie van 7 september 1983 tot
    vaststelling, voor het verkoopseizoen 1983/1984, van de ten aanzien van Griekenland
    toe te passen communautaire aanbiedingsprijs voor mandarijnen, tangerines en satsuma'
    s daaronder begrepen, wilkings en andere dergelijke kruisingen van citrusvruchten,
    met uitzondering van clementines
