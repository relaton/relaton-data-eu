    plovil iz leta 1994 (kodeks HSC iz leta 1994) in Mednarodnega kodeksa o varnosti
    visokohitrostnih plovil iz leta 2000 (kodeks HSC iz leta 2000), Mednarodnega kodeksa
    za ladje, ki obratujejo v polarnih vodah (Polarni kodeks), Mednarodne konvencije
    o standardih za usposabljanje, izdajanje spričeval in ladijsko stražarjenje
    pomorščakov iz leta 1978 (konvencija STCW) in kodeksa STCW ter Mednarodnega
    kodeksa o reševalni opremi (kodeks LSA)
  type: main
- language: es
  script: Latn
  content: Decisión (UE) 2023/1082 del Consejo de 30 de mayo de 2023 relativa a la
    posición que debe adoptarse en nombre de la Unión Europea en el Comité de Seguridad
    Marítima de la Organización Marítima Internacional en su 107.° período de
    sesiones en lo relativo a las enmiendas al Convenio Internacional para la Seguridad
    de la Vida Humana en el Mar (Convenio SOLAS), al Código Internacional de Seguridad
    para Naves de Gran Velocidad de 1994 (Código NGV de 1994), y al Código Internacional
    de Seguridad para Naves de Gran Velocidad de 2000 (Código NGV de 2000), al Código
    Internacional para los Buques que Operen en Aguas Polares (Código Polar), al
    Convenio Internacional sobre Normas de Formación, Titulación y Guardia para
    la Gente de Mar de 1978 (Convenio STCW) y al Código STCW, y al Código Internacional
    de Dispositivos de Salvamento (Código IDS)
  type: main
- language: sv
  script: Latn
  content: Rådets beslut (EU) 2023/1082 av den 30 maj 2023 om den ståndpunkt som
    ska intas på Europeiska unionens vägnar i Internationella sjöfartsorganisationens
    sjösäkerhetskommitté vid dess 107:e möte vad gäller ändringarna av internationella
    konventionen om säkerheten för människoliv till sjöss (Solas), 1994 års internationella
    säkerhetskod för höghastighetsfartyg (1994 års HSC-kod) och 2000 års internationella
    säkerhetskod för höghastighetsfartyg (2000 års HSC-kod), internationella koden
    för fartyg som trafikerar polarvatten (polarkoden), 1978 års internationella
    konvention angående normer för sjöfolks utbildning, certifiering och vakthållning
    (STCW) och STCW-koden samt internationella koden för livräddningsutrustning
    (LSA-koden)
  type: main
