  content: Council Decision (EU) 2023/1082 of 30 May 2023 on the position to be taken
    on behalf of the European Union within the International Maritime Organization’s
    Maritime Safety Committee during its 107th session as regards the amendment of
    the International Convention for the Safety of Life at Sea (SOLAS), of the 1994
    International Code of Safety for High-speed Craft (the ‘1994 HSC Code’) and
    the 2000 International Code of Safety for High-speed Craft (the ‘2000 HSC Code’),
    of the International Code for Ships Operating in Polar Waters (the ‘Polar Code’),
    of the 1978 International Convention on Standards of Training, Certification and
    Watch-keeping for Seafarers (STCW) and the STWC Code, and of the International
    Life-Saving Appliances Code (the ‘LSA Code’)
