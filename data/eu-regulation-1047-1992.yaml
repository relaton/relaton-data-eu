title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1047/92 of 27 April 1992 re-establishing
    the levying of customs duties on products falling within CN code 3102 80 00, originating
    in Bulgaria, to which the preferential tariff arrangements set out in Council
    Regulation (EEC) No 3831/90 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1047/92 de la Commission du 27 avril 1992 portant
    rétablissement de la perception des droits de douane applicables aux produits
    du code de la nomenclature combinée 3102 80 00 originaires de Bulgarie bénéficiaires
    des préférences tarifaires prévues par le règlement (CEE) n° 3831/90 du Conseil
  type: main
- language: de
  script: Latn
  content: 'VERORDNUNG (EWG) Nr. 1047/92 DER KOMMISSION vom 27. April 1992 zur Wiedereinführung
    der Erhebung der Zölle für die Waren des KN-Codes 3102 80 00 mit Ursprung in
    Bulgarien, für die die in der Verordnung (EWG) Nr. 3831/90 des Rates vorgesehenen
    Zollpräferenzen gewährt werden #'
  type: main
- language: da
  script: Latn
  content: 'KOMMISSIONENS FORORDNING (EØF) Nr. 1047/92 af 27. april 1992 om genindførelse
    af opkrævning af told for varer henhørende under KN-kode 3102 80 00 og med oprindelse
    i Bulgarien, som er præferenceberettiget i henhold til Rådets forordning (EØF)
    nr. 3831/90 #'
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 1047/92 της Επιτροπής
    της 27ης Απριλίου 1992 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για προϊόντα
    του κωδικού ΣΟ 3102 80 00, καταγωγής Βουλγαρίας,
    δικαιούχων των προβλεπόμενων στον κανονισμό
    (ΕΟΚ) αριθ. 3831/90 του Συμβουλίου
  type: main
- language: it
  script: Latn
  content: 'REGOLAMENTO (CEE) N. 1047/92 DELLA COMMISSIONE del 27 aprile 1992 che
    ripristina la riscossione dei dazi doganali applicabili ai prodotti del codice
    NC 3102 80 00 originari della Bulgaria, beneficiaria delle preferenze tariffarie
    previste dal regolamento (CEE) n. 3831/90 del Consiglio #'
  type: main
- language: nl
  script: Latn
  content: 'VERORDENING (EEG) Nr. 1047/92 VAN DE COMMISSIE van 27 april 1992 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op de produkten
    van GN-code 3102 80 00, van oorsprong uit Bulgarije, waarvoor de in Verordening
    (EEG) nr. 3831/90 van de Raad vermelde tariefpreferenties zijn verleend #'
  type: main
- language: pt
  script: Latn
  content: 'REGULAMENTO (CEE) No 1047/92 DA COMISSÃO de 27 de Abril de 1992 que restabelece
    a cobrança dos direitos aduaneiros aplicáveis aos produtos do código NC 3102
    80 00, originários da Bulgária, beneficiários das preferências pautais previstas
    pelo Regulamento (CEE) no 3831/90 do Conselho #'
  type: main
- language: es
  script: Latn
  content: 'REGLAMENTO (CEE) No 1047/92 DE LA COMISIÓN de 27 de abril de 1992 relativo
    al restablecimiento de la percepción de los derechos de aduana aplicables a los
    productos del código NC 3102 80 00 originarios de Bulgaria, beneficiarios de
    las preferencias arancelarias previstas por el Reglamento (CEE) no 3831/90 del
    Consejo #'
