title:
- language: en
  script: Latn
  content: '80/410/EEC: Commission Decision of 10 April 1980 accepting undertakings
    given in connection with the anti-dumping proceedings concerning certain filament
    lamps for lighting exceeding 28 volts, originating in Czechoslovakia, the German
    Democratic Republic, Hungary and Poland, and terminating those proceedings'
  type: main
- language: fr
  script: Latn
  content: '80/410/CEE: Décision de la Commission, du 10 avril 1980, portant acceptation
    des engagements souscrits dans le cadre de la procédure anti-"dumping" concernant
    certaines lampes et tubes à incandescence pour l'' éclairage pour tension de
    plus de 28 volts, originaires de Hongrie, de Pologne, de la République démocratique
    allemande et de Tchécoslovaquie, et portant clôture de cette procédure'
  type: main
- language: de
  script: Latn
  content: '80/410/EWG: Beschluß der Kommission vom 10. April 1980 über die Annahme
    von Verpflichtungen im Rahmen der Antidumpingverfahren betreffend bestimmte Glühlampen
    für elektrische Beleuchtung für eine Spannung von mehr als 28 Volt mit Ursprung
    in der Tschechoslowakei, der Deutschen Demokratischen Republik, Ungarn und Polen
    und über die Einstellung dieser Verfahren'
  type: main
- language: da
  script: Latn
  content: '80/410/EØF: Kommissionens afgørelse af 10. april 1980 om godtagelse
    af tilsagn afgivet i forbindelse med antidumpingprocedurerne vedrørende visse
    glødelamper til belysning, til spænding over 28 V, med oprindelse i Den tyske
    demokratiske Republik, Polen, Tjekkoslovakiet og Ungarn og om afslutning af disse
    procedurer'
  type: main
- language: it
  script: Latn
  content: '80/410/CEE: Decisione della Commissione, del 10 aprile 1980, recante accettazione
    degli impegni assunti nell'' ambito della procedura antidumping relativa alle
    lampade e tubi a incandescenza per l'' illuminazione per tensioni superiori a
    28 volt originari della Cecoslovacchia, della Polonia, della Repubblica democratica
    tedesca e dell'' Ungheria e recante conclusione di detta procedura'
  type: main
- language: nl
  script: Latn
  content: '80/410/EEG: Besluit van de Commissie van 10 april 1980 houdende aanvaarding
    van de verbintenissen aangegaan in het kader van de antidumpingprocedure betreffende
    bepaalde gloeilampen en gloeibuizen voor verlichtingsdoeleinden van meer dan 28
    V van oorsprong uit de Duitse Democratische Republiek, Hongarije, Polen en Tsjechoslowakije
    en houdende beëindiging van deze procedure'
