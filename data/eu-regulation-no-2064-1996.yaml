title:
- language: en
  script: Latn
  content: COMMISSION REGULATION (EC) No 2064/96 of 29 October 1996 determining the
    extent to which applications lodged in October 1996 for import licences for certain
    egg sector products and poultrymeat pursuant to Regulations (EC) No 1474/95 and
    (EC) No 1251/96 can be accepted
  type: main
- language: fr
  script: Latn
  content: RÈGLEMENT (CE) N° 2064/96 DE LA COMMISSION du 29 octobre 1996 déterminant
    la mesure dans laquelle les demandes de licences d'importation introduites en
    octobre 1996 pour certains produits du secteur des oeufs et de la viande de volaille
    dans le cadre des règlements (CE) n° 1474/95 et (CE) n° 1251/96 peuvent être
    acceptées
  type: main
- language: de
  script: Latn
  content: VERORDNUNG (EG) Nr. 2064/96 DER KOMMISSION vom 29. Oktober 1996 über die
    Festsetzung des Umfangs, in dem die im Oktober 1996 gestellten Anträge auf Einfuhrlizenzen
    für bestimmte Produkte des Sektors Eier und Geflügelfleisch entsprechend den
    Verordnungen (EG) Nr. 1474/95 und (EG) Nr. 1251/96 genehmigt werden können
  type: main
- language: da
  script: Latn
  content: KOMMISSIONENS FORORDNING (EF) Nr. 2064/96 af 29. oktober 1996 om fastsættelse
    af i hvilket omfang der kan accepteres ansøgninger, der blev indgivet i oktober
    1996 om importlicenser for visse ægprodukter og fjerkrækød i forbindelse med
    forordning (EF) nr. 1474/95 og (EF) nr. 1251/96
  type: main
- language: el
  script: Grek
  content: ΚΑΝΟΝΙΣΜΟΣ (ΕΚ) αριθ. 2064/96 ΤΗΣ ΕΠΙΤΡΟΠΗΣ
    της 29ης Οκτωβρίου 1996 για καθορισμό ορίων εντός
    των οποίων δύναται να γίνουν αποδεκτές οι αιτήσεις
    που υποβλήθηκαν τον Οκτώβριο του 1996 για άδειες
    εισαγωγής για ορισμένα προϊόντα του τομέα
    των αυγών και του κρέατος πουλερικών στα πλαίσια
    των κανονισμών (ΕΚ) αριθ. 1474/95 και (ΕΚ) 1251/96
  type: main
- language: fi
  script: Latn
  content: KOMISSION ASETUS (EY) N:o 2064/96, annettu 29 päivänä lokakuuta 1996,
    määrättyyn järjestelmään liittyvien lokakuussa 1996 jätettyjen tiettyjä
    muna-alan ja siipikarjanliha-alan tuotteita koskevien tuontilupahakemusten hyväksyttävyydestä
    asetuksen (EY) N:o 1474/95 ja asetuksen (EY) N:o 1251/96 mukaisesti
  type: main
- language: it
  script: Latn
  content: REGOLAMENTO (CE) N. 2064/96 DELLA COMMISSIONE del 29 ottobre 1996 che stabilisce
    entro quali limiti possono essere accettate le domande di titoli d'importazione
    presentate nel mese di ottobre 1996 per taluni prodotti del settore delle uova
    e del pollame nel quadro dei regolamenti (CE) n. 1474/95 e (CE) n. 1251/96
  type: main
- language: nl
  script: Latn
  content: VERORDENING (EG) Nr. 2064/96 VAN DE COMMISSIE van 29 oktober 1996 tot vaststelling
    van de mate waarin gevolg kan worden gegeven aan de aanvragen om invoercertificaten
    voor bepaalde produkten in de sector eieren en slachtpluimvee die in oktober 1996
    worden ingediend op grond van de Verordeningen (EG) nr. 1474/95 en (EG) nr. 1251/96
  type: main
- language: pt
  script: Latn
  content: REGULAMENTO (CE) Nº 2064/96 DA COMISSÃO de 29 de Outubro de 1996 que
