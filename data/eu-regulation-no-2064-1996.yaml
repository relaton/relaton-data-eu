  content: REGLAMENTO (CE) N° 2064/96 DE LA COMISIÓN de 29 de octubre de 1996 por
    el que se determina la proporción en que se satisfarán las solicitudes de licencias
    de importación de algunos productos del sector de los huevos y de la carne de
    aves de corral presentadas en el mes de octubre de 1996 al amparo de los Reglamentos
