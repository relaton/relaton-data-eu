    la mesure dans laquelle les demandes de certificats d'importation introduites
    en janvier 2006 pour certains produits laitiers dans le cadre de certains contingents
    tarifaires ouverts par le règlement (CE) n o 2535/2001 peuvent être acceptées
  type: main
- language: de
  script: Latn
