title:
- language: en
  script: Latn
  content: Commission Regulation (EC) No 160/2006 of 27 January 2006 determining the
    extent to which the applications for import licences submitted in January 2006
    for certain dairy products under certain tariff quotas opened by Regulation (EC)
    No 2535/2001 can be accepted
  type: main
- language: fr
  script: Latn
