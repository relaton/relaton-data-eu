    section "orientation", au Royaume-Uni des dépenses effectuées pendant l''année
    1975 pour les aides relatives à l''information socio-économique et à la qualification
    professionnelle des personnes travaillant dans l''agriculture'
  type: main
- language: de
  script: Latn
  content: Entscheidung der Kommission vom 20. Februar 1978 über die Rückvergütung
