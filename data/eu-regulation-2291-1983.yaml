title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 2291/83 of 10 August 1983 re-establishing
    the levying of customs duties on yarn of carded sheep' s or lambs' wool or of
    carded fine animal hair, not put up for retail sale, products of category 47 (code
    0470), originating in Peru, to which the preferential tariff arrangements set
    out in Council Regulation (EEC) No 3378/82 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) no 2291/83 de la Commission du 10 août 1983 portant rétablissement
    de la perception des droits de douane applicables aux fils de laine ou de poils
    fins, cardés, non conditionnés pour la vente au détail, de la catégorie 47
    (code 0470), originaires du Pérou, bénéficiaire des préférences tarifaires
    prévues par le règlement (CEE) no 3378/82 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2291/83 der Kommission vom 10. August 1983 über die
    Wiedereinführung des Zollsatzes für Streichgarne aus Wolle oder feinen Tierhaaren,
    nicht in Aufmachungen, der Warenkategorie Nr. 47 (Kennziffer 0470), mit Ursprung
    in Peru, dem die in der Verordnung (EWG) Nr. 3378/82 des Rates vorgesehenen Zollpräferenzen
    gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 2291/83 af 10. august 1983 om genindførelse
    af opkrævning af toldafgifter for garn af uld eller fine dyrehår, kartet, ikke
    i detailsalgsoplægninger, under kategori nr. 47 (kode 0470), som har oprindelse
    i Peru og omfattes af de toldpræferencer, som er fastsat i Rådets forordning
    (EØF) nr. 3378/82
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 2291/83 της Επιτροπής
    της 10ης Αυγούστου 1983 περί αποκαταστάσεως της
    εφαρμογής τελωνειακών δασμών για τα νήματα
    εξ ερίου λαναρισμένου, μη συνεσκευασμένα διά
    την λιανικήν πώλησιν, προϊόντα της κατηγορίας
    47 (κωδικός αριθμός 0470), καταγωγής Περού, δικαιούχων
    των προβλεπομένων στον κανονισμό (ΕΟΚ) αριθ.
    3378/82 του Συμβουλίου δασμολογικών προτιμήσεων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 2291/83 della Commissione del 10 agosto 1983 che ripristina
    la riscossione dei dazi doganali applicabili ai filati di lana o di peli fini,
    cardati, non preparati per la vendita al minuto, della categoria di prodotti 47
    (codice 0470), originari del Perù, beneficiario delle preferenze tariffarie previste
    dal regolamento (CEE) n. 3378/82 del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 2291/83 van de Commissie van 10 augustus 1983 houdende
    wederinstelling van de heffing van invoerrechten van toepassing op kaardgaren
    van wol of van fijn haar, niet gereed voor de verkoop in het klein, van de categorie
    van produkten nr. 47 (codenummer 0470), van oorsprong uit Peru, waarvoor de algemene
    tariefpreferenties gelden als bepaald bij Verordening (EEG) nr. 3378/82 van de
    Raad
  type: main
