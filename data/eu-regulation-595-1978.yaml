title:
- language: en
  script: Latn
  content: Council Regulation (EEC) No 595/78 of 20 March 1978 extending Regulation
    (EEC) No 744/77 on the advance implementation of certain provisions of the ACP-EEC
    Convention of Lomé relating to trade in respect of certain States that have signed
    Accession Agreements to that Convention
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 595/78 du Conseil, du 20 mars 1978, portant prorogation
    du règlement (CEE) n° 744/77 concernant l'application par anticipation de certaines
    dispositions de la convention ACP-CEE de Lomé afférentes aux échanges en ce
    qui concerne certains états signataires d'accords d'accession à cette convention
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 595/78 des Rates vom 20. März 1978 zur Verlängerung
    der Verordnung (EWG) Nr. 744/77 über die vorzeitige Anwendung einiger den Warenhandel
    betreffender Bestimmungen des AKP - EWG-Abkommens von Lome gegenüber einiger
    Staaten, die Abkommen über den Beitritt zu diesem Abkommen unterzeichnet haben
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF) nr. 595/78 af 20. marts 1978 om forlængelse
    af gyldigheden af forordning (EØF) nr. 744/77 om forlods anvendelse af visse
    bestemmelser i Lomé-konventionen AVS-EØF vedrørende samhandelen for så vidt
    angår visse stater, der har undertegnet aftaler om tiltrædelse af nævnte konvention
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 595/78 del Consiglio, del 20 marzo 1978, relativo
    alla proroga del regolamento (CEE) n. 744/77 relativo all'applicazione anticipata
    di talune disposizioni della convenzione ACP-CEE di Lomé concernenti gli scambi,
    per quanto riguarda taluni Stati firmatari di accordi di accessione a detta convenzione
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 595/78 van de Raad van 20 maart 1978 tot verlenging
    van Verordening (EEG) nr. 744/77 betreffende de vervroegde toepassing van sommige
    bepalingen van de ACS-EEG-Overeenkomst van Lomé met betrekking tot het handelsverkeer
    ten aanzien van bepaalde Staten die een akkoord houdende toetreding tot deze Overeenkomst
    hebben ondertekend
  type: main
