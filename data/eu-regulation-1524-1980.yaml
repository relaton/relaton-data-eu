title:
- language: en
  script: Latn
  content: Council Regulation (EEC, Euratom, ECSC) No 1524/80 of 18 June 1980 correcting
    the weightings applicable to the remuneration and pensions of officials and other
    servants of the European Communities employed or resident in Ireland or the United
    Kingdom
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE, Euratom, CECA) n° 1524/80 du Conseil, du 18 juin 1980,
    portant rectification des coefficients correcteurs applicables aux rémunérations
    et pensions des fonctionnaires et autres agents des Communautés européennes
    affectés ou domiciliés en Irlande ou au Royaume-Uni
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG, Euratom, EGKS) Nr. 1524/80 des Rates vom 18. Juni 1980
    zur Korrektur der Berichtigungskoeffizienten, die auf die Dienst- und Versorgungsbezüge
    der Beamten und sonstigen Bediensteten der Europäischen Gemeinschaften mit dienstlicher
    Verwendung oder Wohnsitz in Irland oder im Vereinigten Königreich anzuwenden
    sind
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EØF, Euratom, EKSF) nr. 1524/80 af 18. juni 1980 om
    berigtigelse af justeringskoefficienterne for vederlag og pensioner til tjenestemænd
    og øvrige ansatte i De europæiske Fællesskaber, som gør tjeneste eller har
    bopæl i Irland eller Det forenede Kongerige
  type: main
- language: el
  script: Grek
  content: Κανονισμός (EOK, Ευρατόμ, EKAX) αριθ. 1524/80 τού
    Συμβουλίου τής 18ης Ιουνίου 1980 περί διορθώσεως
    τών συντελεστών αναπροσαρμογής πού εφαρμόζονται
    επί τών αποδοχών καί τών συντάξεων τών υπαλλήλων
    καί τού λοιπού προσωπικού τών Ευρωπαϊκών Κοινοτήτων
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE, Euratom, CECA) n. 1524/80 del Consiglio, del 18 giugno
    1980, relativo alla rettifica dei coefficienti correttori applicabili alle retribuzioni
    e alle pensioni dei funzionari e degli altri agenti delle Comunità europee con
    sede di servizio o residenti in Irlanda o nel Regno Unito
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG, Euratom, EGKS) nr. 1524/80 van de Raad van 18 juni 1980
