    teknisillä sääntelystandardeilla, joissa määritetään luottolaitosten toimilupahakemuksissa
    toimitettavat tiedot ja seikat, jotka voivat estää toimivaltaisten viranomaisten
    valvontatehtävien tehokkaan hoitamisen
  type: main
- language: ga
  script: Latn
  content: Rialachán Tarmligthe (AE) 2022/2580 ón gCoimisiún an 17 Meitheamh 2022
