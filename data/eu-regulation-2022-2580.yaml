title:
- language: en
  script: Latn
  content: Commission Delegated Regulation (EU) 2022/2580 of 17 June 2022 supplementing
    Directive 2013/36/EU of the European Parliament and of the Council with regard
    to regulatory technical standards specifying the information to be provided in
    the application for the authorisation as a credit institution, and specifying
    the obstacles which may prevent the effective exercise of supervisory functions
    of competent authorities
  type: main
- language: fr
  script: Latn
  content: Règlement délégué (UE) 2022/2580 de la Commission du 17 juin 2022 complétant
    la directive 2013/36/UE du Parlement européen et du Conseil par des normes techniques
    de réglementation précisant les informations à fournir dans la demande d’agrément
    en tant qu’établissement de crédit et précisant les obstacles susceptibles
    d’entraver le bon exercice des fonctions de surveillance des autorités compétentes
  type: main
- language: de
  script: Latn
  content: Delegierte Verordnung (EU) 2022/2580 der Kommission vom 17. Juni 2022 zur
    Ergänzung der Richtlinie 2013/36/EU des Europäischen Parlaments und des Rates
    im Hinblick auf technische Regulierungsstandards zu den im Antrag auf Zulassung
    als Kreditinstitut zu übermittelnden Informationen und zur Präzisierung möglicher
    Hindernisse für die ordnungsgemäße Wahrnehmung von Aufsichtsfunktionen durch
    die zuständigen Behörden
  type: main
- language: bg
  script: Cyrl
  content: Делегиран регламент (ЕС) 2022/2580 на Комисията
    от 17 юни 2022 година за допълнение на Директива
    2013/36/ЕС на Европейския парламент и на Съвета
    с регулаторни технически стандарти за определяне
    на сведенията, която трябва да се предоставят
    в заявлението за лиценз за кредитна институция,
    и на пречките, които могат да възпрепятстват
    надзорните органи ефективно да упражняват
    надзорните си функции
  type: main
- language: cs
  script: Latn
  content: Nařízení Komise v přenesené pravomoci (EU) 2022/2580 ze dne 17. června
    2022, kterým se doplňuje směrnice Evropského parlamentu a Rady 2013/36/EU,
    pokud jde o regulační technické normy upřesňující informace, jež mají
    být poskytnuty v žádosti o povolení působit jako úvěrová instituce, a
    upřesňující překážky, jež mohou bránit účinnému výkonu dozorčích
    funkcí příslušných orgánů
  type: main
- language: da
  script: Latn
  content: Kommissionens delegerede forordning (EU) 2022/2580 af 17. juni 2022 om
    supplerende regler til Europa-Parlamentets og Rådets direktiv 2013/36/EU for
    så vidt angår reguleringsmæssige tekniske standarder, som præciserer, hvilke
    oplysninger der skal indsendes i ansøgningen om at blive meddelt tilladelse som
    kreditinstitut, og som præciserer, hvilke forhold der kan hindre kompetente myndigheders
    effektive varetagelse af tilsynsopgaver
  type: main
- language: el
  script: Grek
  content: Κατ’ εξουσιοδότηση κανονισμός (ΕΕ) 2022/2580
