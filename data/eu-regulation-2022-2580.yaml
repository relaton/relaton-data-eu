    maoirseachta údarás inniúil
  type: main
- language: hr
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2580 оd 17. lipnja 2022. o dopuni
    Direktive 2013/36/EU Europskog parlamenta i Vijeća u pogledu regulatornih tehničkih
    standarda kojima se pobliže određuju informacije koje se dostavljaju u zahtjevu
    za izdavanje odobrenja za rad kreditne institucije i prepreke učinkovitom izvršavanju
    nadzornih funkcija nadležnih tijela
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/2580 felhatalmazáson alapuló rendelete (2022.
    június 17.) a 2013/36/EU európai parlamenti és tanácsi irányelvnek a hitelintézeti
    engedély iránti kérelemben feltüntetendő információkat és az illetékes
    hatóságok felügyeleti feladatainak hatékony gyakorlását esetlegesen akadályozó
    tényezőket meghatározó szabályozástechnikai standardok tekintetében történő
    kiegészítéséről
  type: main
- language: it
  script: Latn
  content: Regolamento delegato (UE) 2022/2580 della Commissione del 17 giugno 2022
    che integra la direttiva 2013/36/UE del Parlamento europeo e del Consiglio per
    quanto riguarda le norme tecniche di regolamentazione che specificano le informazioni
    da fornire nella domanda di autorizzazione come ente creditizio e gli ostacoli
    che possono impedire l’efficace esercizio delle funzioni di vigilanza delle
    autorità competenti
  type: main
- language: lv
  script: Latn
  content: Komisijas Deleģētā regula (ES) 2022/2580 (2022. gada 17. jūnijs), ar
    ko Eiropas Parlamenta un Padomes Direktīvu 2013/36/ES papildina attiecībā uz
    regulatīvajiem tehniskajiem standartiem par informāciju, kas jāsniedz pieteikumā
    kredītiestādes atļaujas saņemšanai, un šķēršļiem, kuri var kavēt kompetento
    iestāžu uzraudzības funkciju efektīvu īstenošanu
  type: main
- language: lt
  script: Latn
  content: Komisijos deleguotasis reglamentas (ES) 2022/2580 2022 m. birželio 17
    d. kuriuo Europos Parlamento ir Tarybos direktyva 2013/36/ES papildoma techniniais
    reguliavimo standartais, kuriais nustatoma informacija, pateiktina prašyme išduoti
    kredito įstaigos veiklos leidimą, ir galimos kliūtys kompetentingoms institucijoms
    veiksmingai vykdyti priežiūros funkcijas
  type: main
- language: mt
  script: Latn
  content: Regolament Delegat tal-Kummissjoni (UE) 2022/2580 tas-17 ta’ Ġunju 2022
    li jissupplimenta d-Direttiva 2013/36/UE tal-Parlament Ewropew u tal-Kunsill fir-rigward
    tal-istandards tekniċi regolatorji li jispeċifikaw l-informazzjoni li għandha
    tiġi pprovduta fl-applikazzjoni għal awtorizzazzjoni bħala istituzzjoni ta’
    kreditu u li jispeċifikaw l-ostakli li jistgħu jipprevjenu l-eżerċitar effettiv
    ta’ funzjonijiet superviżorji tal-awtoritajiet kompetenti
  type: main
- language: nl
  script: Latn
  content: Gedelegeerde Verordening (EU) 2022/2580 van de Commissie van 17 juni 2022
    tot aanvulling van Richtlijn 2013/36/EU van het Europees Parlement en de Raad
    met technische reguleringsnormen tot nadere vaststelling van de informatie die
    moet worden verstrekt in de vergunningaanvraag van kredietinstellingen, en tot
    nadere vaststelling van belemmeringen voor de effectieve uitoefening van toezichtstaken
    door bevoegde autoriteiten
  type: main
- language: pl
  script: Latn
  content: Rozporządzenie delegowane Komisji (UE) 2022/2580 z dnia 17 czerwca 2022
    r. uzupełniające dyrektywę Parlamentu Europejskiego i Rady 2013/36/UE w odniesieniu
    do regulacyjnych standardów technicznych określających informacje, które należy
    przekazać we wniosku o udzielenie zezwolenia na prowadzenie działalności jako
    instytucja kredytowa, oraz określających przeszkody, które mogą uniemożliwiać
    skuteczne sprawowanie funkcji nadzorczych właściwych organów
  type: main
- language: pt
  script: Latn
  content: Regulamento Delegado (UE) 2022/2580 da Comissão de 17 de junho de 2022
    que complementa a Diretiva 2013/36/UE do Parlamento Europeu e do Conselho no que
    respeita às normas técnicas de regulamentação que especificam as informações
    a fornecer no pedido de autorização enquanto instituição de crédito, bem
    como os obstáculos suscetíveis de impedir o exercício eficaz das funções
    de supervisão das autoridades competentes
  type: main
- language: ro
  script: Latn
  content: Regulamentul delegat (UE) 2022/2580 al Comisiei din 17 iunie 2022 de completare
    a Directivei 2013/36/UE a Parlamentului European și a Consiliului în ceea ce
    privește standardele tehnice de reglementare care precizează informațiile care
    trebuie furnizate în cererea de autorizare ca instituție de credit și obstacolele
    care ar putea împiedica exercitarea efectivă a funcțiilor de supraveghere de
    către autoritățile competente
  type: main
- language: sk
  script: Latn
  content: Delegované nariadenie Komisie (EÚ) 2022/2580 zo 17. júna 2022, ktorým
    sa dopĺňa smernica Európskeho parlamentu a Rady 2013/36/EÚ, pokiaľ ide o
    regulačné technické predpisy, v ktorých sa spresňujú informácie, ktoré
    sa majú poskytovať v žiadosti o povolenie na vykonávanie činnosti úverovej
    inštitúcie, a v ktorých sa spresňujú prekážky, ktoré môžu brániť účinnému
    výkonu funkcií dohľadu príslušných orgánov
  type: main
- language: sl
  script: Latn
  content: Delegirana uredba Komisije (EU) 2022/2580 z dne 17. junija 2022 o dopolnitvi
    Direktive 2013/36/EU Evropskega parlamenta in Sveta v zvezi z regulativnimi tehničnimi
    standardi za določitev informacij, ki se predložijo v vlogi za izdajo dovoljenja
    za kreditne institucije, in za določitev okoliščin, ki bi lahko ovirale učinkovito
    opravljanje nadzorniških funkcij pristojnih organov
  type: main
- language: es
  script: Latn
  content: Reglamento Delegado (UE) 2022/2580 de la Comisión de 17 de junio de 2022
    por el que se completa la Directiva 2013/36/UE del Parlamento Europeo y del Consejo
    en lo referente a las normas técnicas de regulación que especifican la información
    que debe proporcionarse en la solicitud de autorización de las entidades de crédito,
    así como los obstáculos que podrían impedir el ejercicio efectivo de las funciones
    de supervisión de las autoridades competentes
  type: main
- language: sv
  script: Latn
  content: Kommissionens delegerade förordning (EU) 2022/2580 av den 17 juni 2022
    om komplettering av Europaparlamentets och rådets direktiv 2013/36/EU vad gäller
    tekniska tillsynsstandarder som specificerar de uppgifter som ska lämnas i ansökan
    om auktorisation som kreditinstitut och de faktorer som kan hindra behöriga myndigheter
    från att utöva en effektiv tillsyn
