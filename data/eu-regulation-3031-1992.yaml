- language: en
  script: Latn
  content: Commission Regulation (EEC, ECSC) No 3031/92 of 21 October 1992 amending
    Regulation (EEC, ECSC) No 2725/92 concerning the implementation of Council Regulation
    (EEC) No 2656/92 and Decision 92/470/ECSC concerning certain technical modalities
    in connection with the application of respectively Regulation (EEC) No 1432/92
    and Decision 92/285/ECSC prohibiting trade between the European Economic Community
    and the European Coal and Steel Community on the one hand, and the Republics of
    Serbia and Montenegro on the other hand
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE, CECA) n° 3031/92 de la Commission, du 21 octobre 1992,
