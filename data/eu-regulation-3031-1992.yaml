    (CEE) n° 2656/92 du Conseil et de la décision 92/470/CECA fixant certaines modalités
    techniques d'application respectivement du règlement (CEE) n° 1432/92 et de
    la décision 92/285/CECA interdisant les échanges entre la Communauté économique
