  script: Latn
  content: Regulamentul (CE) nr. 681/2009 al Consiliului din 27 iulie 2009 de încheiere
    a reexaminării în ceea ce privește un nou exportator a Regulamentului (CE)
    nr. 192/2007 al Consiliului de instituire a unei taxe antidumping definitive la
    importurile anumitor tipuri de polietilen tereftalat originar, printre altele,
