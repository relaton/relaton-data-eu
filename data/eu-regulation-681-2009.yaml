  script: Latn
  content: Council Regulation (EC) No 681/2009 of 27 July 2009 terminating the new
    exporter review of Regulation (EC) No 192/2007 imposing a definitive anti-dumping
    duty on imports of certain polyethylene terephthalate originating, inter alia,
    in Malaysia, re-imposing the duty with regard to imports from one exporter in
    this country and terminating the registration of these imports
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n o 681/2009 du Conseil du 27 juillet 2009 clôturant le
    réexamen au titre de nouvel exportateur du règlement (CE) n o 192/2007 instituant
    un droit antidumping définitif sur les importations de certains types de polyéthylène
    téréphtalate originaires, entre autres, de la Malaisie, réinstituant le droit
    en ce qui concerne les produits d’un exportateur de ce pays et mettant un terme
    à l’enregistrement de ces produits
  type: main
