    Consiglio che istituisce un dazio antidumping definitivo sulle importazioni di
    alcuni tipi di polietilentereftalato originari, fra l’altro, della Malaysia,
    istituisce di nuovo il dazio per quanto riguarda le importazioni provenienti da
    un esportatore di questo paese e pone termine alla registrazione di tali importazioni
  type: main
- language: lv
  script: Latn
