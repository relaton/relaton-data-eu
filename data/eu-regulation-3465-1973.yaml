title:
- language: en
  script: Latn
  content: Regulation (EEC) No 3465/73 of the Council of 17 December 1973 on the temporary
    and partial suspension of the autonomous duties in the Common Customs Tariff for
    dried apricots falling within subheading No 08.12 A, bitter or Seville oranges
    falling within subheading No ex 08.02 A II a) and b) and saffron, neither crushed
    or ground, falling within subheading No 09.10 C I
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 3465/73 du Conseil, du 17 décembre 1973, portant
    suspension temporaire et partielle des droits autonomes du tarif douanier commun
    pour les abricots séchés, de la sous-position 08.12 A, pour les oranges amères
    ou bigarades, de la sous-position EX 08.02 A II a) et b), et le safran, non broyé
    ni moulu, de la sous-position 09.10 C I
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 3465/73 des Rates vom 17. Dezember 1973 über die
    zeitweilige und teilweise Aussetzung der autonomen Zollsätze des Gemeinsamen
    Zolltarifs für Aprikosen, getrocknet, der Tarifstelle 08.12 A, Bitterorangen
    der Tarifstellen ex 08.02 A II a) und b) sowie für Safran, weder gemahlen noch
    sonst zerkleinert, der Tarifstelle 09.10 C I
  type: main
- language: da
  script: Latn
  content: Rådets Forordning (EØF) nr. 3465/73 af 17. december 1973 om midlertidig
    og delvis suspension af de autonome satser i den fælles toldtarif for tørrede
    abrikoser henhørende under position 08.12 A, bitre oranger og pomeranser henhørende
    under position ex 08.02 A II a) og b) og safran, ikke knust eller formalet, henhørende
    under position 09.10 C I
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 3465/73 del Consiglio, del 17 dicembre 1973, recante
    sospensione temporanea e parziale dei dazi autonomi della tariffa doganale comune
    per le albicocche secche della sottovoce n. 08.12 A, per le arance amare o melangole
    della sottovoce n. ex 08.02 A II a) e b) e per lo zafferano, non tritato né macinato,
    della sottovoce 09.10 C I
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 3465/73 van de Raad van 17 december 1973 houdende
    tijdelijke en gedeeltelijke schorsing van de autonome rechten van het gemeenschappelijk
    douanetarief voor gedroogde abrikozen van onderverdeling 08.12 A, voor pomeransen
    van onderverdeling ex 08.02 A II a) en b) en voor saffraan, niet fijngemaakt en
    niet gemalen, van onderverdeling 09.10 C I
  type: main
