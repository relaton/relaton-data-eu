title:
- language: en
  script: Latn
  content: '93/462/EEC: Commission Decision of 9 July 1993 authorizing certain Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of wood of conifers (Coniferales) originating in Norway,
    Sweden, Finland or Poland (Only the Spanish, Greek, English, French, Italian and
    Portuguese texts are authentic)'
  type: main
- language: fr
  script: Latn
  content: '93/462/CEE: Décision de la Commission du 9 juillet 1993 autorisant certains
    États membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne le bois de conifères (Coniferales) originaire
    de Norvège, de Suède, de Finlande ou de Pologne (Les textes en langues espagnole,
    grecque, anglaise, française, italienne et portugaise sont les seuls faisant
    foi.)'
  type: main
- language: de
  script: Latn
  content: '93/462/EWG: ENTSCHEIDUNG DER KOMMISSION vom 9. Juli 1993 zur Ermächtigung
    bestimmter Mitgliedstaaten, für Holz von Koniferen (Coniferales) mit Ursprung
    in Norwegen, Schweden, Finnland oder Polen Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates vorzusehen (Nur der spanische, griechische,
    englische, französische, italienische und portugiesische Text sind verbindlich)'
  type: main
- language: da
  script: Latn
  content: '93/462/EØF: KOMMISSIONENS BESLUTNING af 9. juli 1993 om bemyndigelse
    af visse medlemsstater til at indrømme undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF, for så vidt angår træ af nåletræer (Coniferales) med
    oprindelse i Norge, Sverige, Finland eller Polen (Kun de spanske, græske, engelske,
    franske, italienske og portugisiske udgaver er autentiske)'
  type: main
- language: el
  script: Grek
