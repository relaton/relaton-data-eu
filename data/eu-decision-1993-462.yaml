    είναι τα μόνα αυθεντικά)'
  type: main
- language: it
  script: Latn
  content: '93/462/CEE: DECISIONE DELLA COMMISSIONE del 9 luglio 1993 che autorizza
    alcuni Stati membri a derogare a determinate disposizioni della direttiva 77/93/CEE
    del Consiglio per quanto riguarda il legname di conifere (Coniferales) originario
    della Norvegia, della Svezia, della Finlandia e della Polonia (I testi in lingua
    spagnola, greca, inglese, francese, italiana e portoghese sono i soli facenti
    fede)'
  type: main
