    d'une part, et la République populaire fédérative de Yougoslavie, d'autre part
  type: main
- language: de
  script: Latn
  content: '69/142/EWG: Entscheidung des Rates vom 12. Mai 1969 zur Genehmigung der
    stillschweigenden Verlängerung des Handelsabkommens der Benelux-Länder mit der
    Föderativen Volksrepublik Jugoslawien bis zum 30. Juni 1970'
  type: main
- language: it
  script: Latn
