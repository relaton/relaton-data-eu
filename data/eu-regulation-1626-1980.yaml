title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 1626/80 of 26 June 1980 re-establishing
    the levying of customs duties on inner tubes and tyre cases (new or used) of the
    kind used on bicycles, etc., falling within heading No ex 40.11 and originating
    in developing countries, to which the preferential tariff arrangements set out
    in Council Regulation (EEC) No 2789/79 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 1626/80 de la Commission, du 26 juin 1980, portant
    rétablissement de la perception des droits de douane applicables aux chambres
    à air et pneumatiques (neufs et usagés) des types utilisés pour vélocipèdes,
    etc., de la sous-position ex 40.11 du tarif douanier commun, originaires des pays
    en voie de développement, bénéficiaires des préférences tarifaires prévues
    par le règlement (CEE) n° 2789/79 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 1626/80 der Kommission vom 26. Juni 1980 zur Wiedereinführung
    des Zollsatzes für Luftschläuche und Laufdecken und schlauchlose Reifen (neu
    oder gebraucht) für Fahrräder, usw., der Tarifnummer ex 40.11, mit Ursprung
    in Entwicklungsländern, denen die in der Verordnung (EWG) Nr. 2789/79 des Rates
    vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 1626/80 af 26. juni 1980 om genindførsel
    af opkrævning af toldafgifter for slanger og dæk (ikke massive, nye eller brugte)
    til cykler uden motor, etc., under pos. ex 40.11, som har oprindelse i udviklingslande
    og omfattes af de toldpræferencer, der er fastsat i Rådets forordning (EØF)
    nr. 2789/79
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1626/80 della Commissione, del 26 giugno 1980, che
    ripristina la riscossione dei dazi doganali applicabili alle camere d' aria e
    coperture (nuove o usate) dei tipi utilizzati per velocipedi, ecc., della voce
    ex 40.11 della tariffa doganale comune, originarie dei paesi in via di sviluppo,
    beneficiari delle preferenze tariffarie previste dal regolamento (CEE) n. 2789/79
    del Consiglio
  type: main
- language: nl
  script: Latn
  content: Verordening (EEG) nr. 1626/80 van de Commissie van 26 juni 1980 houdende
    wederinstelling van de heffing van de invoerrechten voor binnenbanden en buitenbanden
    (nieuwe en gebruikte) van het type gebruikt voor rijwielen, enz., van post ex
    40.11, van oorsprong uit de ontwikkelingslanden ten behoeve waarvan bij Verordening
    (EEG) nr. 2789/79 van de Raad tariefpreferenties werden geopend
  type: main
