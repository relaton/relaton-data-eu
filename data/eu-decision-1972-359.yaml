id: EUDecision1972359
schema_version: v1.5.6
type: standard
title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 12 octobre 1972, autorisant la République
    française à exclure du traitement communautaire les articles de bonneterie en
    matières textiles autres que le coton, des positions Ex 60.02, 60.04 B et Ex
    60.05 du Tarif douanier commun, originaires de Hong-Kong et mis en libre pratique
    dans les autres États membres
  type: main
- language: de
  script: Latn
  content: '72/359/EWG: Entscheidung der Kommission vom 12. Oktober 1972, mit der
    die Französische Republik ermächtigt wird, aus Hongkong stammende und in den
    übrigen Mitgliedstaaten im freien Verkehr befindliche Wirkwaren aus anderen Spinnstoffen
    als Baumwolle der Tarifnummern ex 60.02, 60.04 B und ex 60.05 des Gemeinsamen
    Zolltarifs von der Gemeinschaftsbehandlung auszuschließen'
  type: main
- language: it
  script: Latn
  content: '72/359/CEE: Decisione della Commissione, del 12 ottobre 1972, che autorizza
    la Repubblica francese ad escludere dal trattamento comunitario gli articoli di
    maglieria in materie tessili diverse dal cotone, delle voci nn. ex 60.02, 60.04
    B ed ex 60.05 della tariffa doganale comune, originari di Hong Kong e messi in
    libera pratica negli Stati membri'
  type: main
- language: nl
  script: Latn
  content: '72/359/EEG: Beschikking van de Commissie van 12 oktober 1972 waarbij de
    Franse Republiek wordt gemachtigd breiwerk en haakwerk uit textielstoffen andere
    dan katoen van posten ex 60.02, 60.04 B en ex 60.05 van het gemeenschappelijk
    douanetarief, van oorsprong uit Hong- Kong en in de overige Lid-Staten in het
    vrije verkeer gebracht, van de communautaire behandeling uit te sluiten'
  type: main
