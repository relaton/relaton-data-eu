title:
- language: en
  script: Latn
  content: '2000/412/EC: Commission Decision of 15 June 2000 recognising in principle
    the completeness of the dossier submitted for detailed examination with a view
    to the possible inclusion of IKF 916 (cyazofamid) in Annex I to Council Directive
    91/414/EEC concerning the placing of plant protection products on the market (notified
    under document number C(2000) 1547)'
  type: main
- language: fr
  script: Latn
  content: '2000/412/CE: Décision de la Commission du 15 juin 2000 reconnaissant
