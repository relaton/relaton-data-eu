title:
- language: en
  script: Latn
  content: Commission Regulation (EEC) No 549/89 of 1 March 1989 re-establishing the
    levying of customs duties on footwear with outer soles and uppers of rubber, falling
    within CN codes 6401 and 6402, originating in Thailand, to which the preferential
    tariff arrangements set out in Council Regulation (EEC) No 4257/88 apply
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) nº 549/89 de la Commission du 1er mars 1989 portant rétablissement
    de la perception des droits de douane applicables aux chaussures à semelles extérieures
    et dessus en caoutchouc, des codes NC 6401 et 6402, originaires de Thaïlande,
    bénéficiaire des préférences tarifaires prévues par le règlement (CEE) nº
    4257/88 du Conseil
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 549/89 der Kommission vom 1. März 1989 zur Wiedereinführung
    der Erhebung der Zölle für Schuhe mit Laufsohlen und Oberteil aus Kautschuk
    der KN- Code 6401 und 6402 mit Ursprung in Thailand, dem die in der Verordnung
    (EWG) Nr. 4257/88 des Rates vorgesehenen Zollpräferenzen gewährt werden
  type: main
- language: da
  script: Latn
  content: Kommissionens forordning (EØF) nr. 549/89 af 1. marts 1989 om genindførelse
    af opkrævning af told for fodtøj med ydersål og overdel af gummi, henhørende
    under KN- kode 6401 og 6402 og med oprindelse i Thailand, som er præferenceberettiget
    i henhold til Rådets forordning (EØF) nr. 4257/88
  type: main
- language: el
  script: Grek
  content: Κανονισμός (ΕΟΚ) αριθ. 549/89 της Επιτροπής
