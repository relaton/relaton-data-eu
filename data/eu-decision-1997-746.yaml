    af de fiskerimuligheder og den finansielle modydelse, der er omhandlet i aftalen
    mellem Det Europæiske Økonomiske Fællesskab og regeringen for Republikken Senegal
    om fiskeri ud for Senegals kyst, for perioden 1. maj 1997 til 30. april 2001'
  type: main
- language: el
  script: Grek
