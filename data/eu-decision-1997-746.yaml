title:
- language: en
  script: Latn
  content: '97/746/EC: Council Decision of 7 October 1997 on the conclusion of the
    Agreement in the form of an Exchange of Letters concerning the provisional application
    of the Protocol establishing the fishing rights and financial compensation provided
    for in the Agreement between the European Community and the Government of the
    Republic of Senegal on fishing off the coast of Senegal for the period from 1
    May 1997 to 30 April 2001'
  type: main
- language: fr
  script: Latn
  content: '97/746/CE: Décision du Conseil du 7 octobre 1997 concernant la conclusion
    de l''accord sous forme d''échange de lettres relatif à l''application provisoire
    du protocole fixant les possibilités de pêche et la contrepartie financière
    prévues dans l''accord entre la Communauté économique européenne et le gouvernement
    de la République du Sénégal concernant la pêche au large de la côte sénégalaise,
    pour la période du 1er mai 1997 au 30 avril 2001'
  type: main
- language: de
  script: Latn
  content: '97/746/EG: Beschluß des Rates vom 7. Oktober 1997 über den Abschluß
