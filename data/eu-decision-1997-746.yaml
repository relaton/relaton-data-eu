    dem Abkommen zwischen der Europäischen Wirtschaftsgemeinschaft und der Regierung
    der Republik Senegal über die Fischerei vor der senegalesischen Küste für die
    Zeit vom 1. Mai 1997 bis zum 30. April 2001'
  type: main
- language: da
  script: Latn
  content: '97/746/EF: Rådets afgørelse af 7. oktober 1997 om indgåelse af aftalen
