  content: Commission Implementing Regulation (EU) No 857/2012 of 20 September 2012
    amending Regulation (EC) No 1484/95 as regards representative prices in the poultrymeat
    and egg sectors and for egg albumin
  type: main
- language: fr
  script: Latn
