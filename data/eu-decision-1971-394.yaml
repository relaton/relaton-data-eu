title:
- language: fr
  script: Latn
  content: Décision de la Commission, du 30 novembre 1971, portant publication de
    la version de l'annexe I du règlement (CEE) n° 1025/70 du Conseil du 25 mai
    1970, portant établissement d'un règlement commun applicable aux importations
    de pays tiers
  type: main
- language: de
  script: Latn
  content: '71/394/EWG: Beschluß der Kommission vom 30. November 1971 zur Bekanntmachung
    der geltenden Fassung des Anhangs I der Verordnung (EWG) Nr. 1025/70 des Rates
    vom 25. Mai 1970 zur Festlegung einer gemeinsamen Regelung für die Einfuhr aus
    dritten Ländern'
  type: main
- language: it
  script: Latn
  content: '71/394/CEE: Decisione della Commissione, del 30 novembre 1971, recante
    pubblicazione della versione attuale dell''allegato I al regolamento (CEE) n.
    1025/70 del Consiglio, del 25 maggio 1970, che istituisce un regime comune applicabile
    alle importazioni da paesi terzi'
  type: main
- language: nl
  script: Latn
  content: '71/394/EEG: Besluit van de Commissie van 30 november 1971 tot bekendmaking
    van de geldige versie van bijlage I van Verordening (EEG) nr. 1025/70 van de Raad
    van 25 mei 1970 houdende de totstandbrenging van een gemeenschappelijke regeling
    voor de invoer uit derde landen'
