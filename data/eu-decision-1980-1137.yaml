  content: '80/1137/EEC: Commission Decision of 24 November 1980 establishing that
    the apparatus described as ''Picker Dyna camera 4/15'' may not be imported free
    of Common Customs Tariff duties'
  type: main
- language: fr
  script: Latn
  content: '80/1137/CEE: Décision de la Commission, du 24 novembre 1980, constatant
    que l''importation de l''appareil dénommé "Picker Dyna Camera 4/15" ne peut
    être faite en franchise des droits du tarif douanier commun'
  type: main
- language: de
  script: Latn
  content: '80/1137/EWG: Entscheidung der Kommission vom 24. November 1980, mit der
    festgestellt wird, daß das Gerät ,,PICKER-Dyna Camera 4/15" nicht unter Befreiung
    von Zöllen des Gemeinsamen Zolltarifs eingeführt werden kann'
  type: main
- language: da
  script: Latn
  content: '80/1137/EØF: Kommissionens beslutning af 24. november 1980 om fastslåelse
