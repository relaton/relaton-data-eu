    godkännande för utsläppande på marknaden av produkter som innehåller, består
    av eller har framställts av den genetiskt modifierade majsen DP4114 × MON 810
    × MIR604 × NK603 och genetiskt modifierad majs som kombinerar två eller tre
    av transformationshändelserna DP4114, MON 810, MIR604 och NK603, i enlighet med
    Europaparlamentets och rådets förordning (EG) nr 1829/2003 (delgivet med nr
    C(2022)4333) (Endast den nederländska texten är giltig)
