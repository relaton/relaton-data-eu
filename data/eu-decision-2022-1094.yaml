id: EUDecision20221094
schema_version: v1.5.6
type: standard
title:
- language: en
  script: Latn
  content: Commission Implementing Decision (EU) 2022/1094 of 29 June 2022 authorising
    the placing on the market of products containing, consisting of or produced from
    genetically modified maize DP4114 × MON 810 × MIR604 × NK603 and genetically
    modified maize combining two or three of the single events DP4114, MON 810, MIR604
    and NK603, pursuant to Regulation (EC) No 1829/2003 of the European Parliament
    and of the Council (notified under document C(2022) 4333) (Only the Dutch text
    is authentic)
  type: main
- language: fr
  script: Latn
  content: Décision d’exécution (UE) 2022/1094 de la Commission du 29 juin 2022
    autorisant la mise sur le marché de produits contenant du maïs génétiquement
    modifié DP4114 × MON 810 × MIR604 × NK603 et du maïs génétiquement modifié
    combinant deux ou trois des événements simples DP4114, MON 810, MIR604 et NK603,
    consistant en ces maïs ou produits à partir de ceux-ci, en application du règlement
    (CE) no 1829/2003 du Parlement européen et du Conseil [notifiée sous le numéro
    C(2022) 4333] (Le texte en langue néerlandaise est le seul faisant foi.)
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2022/1094 der Kommission vom 29. Juni 2022
    zur Zulassung des Inverkehrbringens von Erzeugnissen, die genetisch veränderten
    Mais der Sorte DP4114 × MON 810 × MIR604 × NK603 enthalten, aus ihm bestehen
    oder aus ihm hergestellt werden, und von genetisch verändertem Mais, bei dem
    zwei oder drei der Einzelereignisse DP4114, MON 810, MIR604 und NK603 kombiniert
    werden, gemäß der Verordnung (EG) Nr. 1829/2003 des Europäischen Parlaments
    und des Rates (Bekannt gegeben unter Aktenzeichen C(2022) 4333) (Nur der niederländische
    Text ist verbindlich)
  type: main
- language: bg
  script: Cyrl
  content: Решение за изпълнение (ЕС) 2022/1094 на Комисията
    от 29 юни 2022 година за разрешаване на пускането
    на пазара на продукти, съдържащи, състоящи
    се или произведени от генетично модифицирана
    царевица DP4114 × MON 810 × MIR604 × NK603 и генетично модифицирана
    царевица, съвместяваща две или три от единичните
    събития DP4114, MON 810, MIR604 и NK603 в съответствие с
    Регламент (ЕО) № 1829/2003 на Европейския парламент
    и на Съвета (нотифицирано под номер C(2022) 4333)
    (само текстът на нидерландски език е автентичен)
  type: main
- language: cs
  script: Latn
  content: Prováděcí rozhodnutí Komise (EU) 2022/1094 ze dne 29. června 2022
    o povolení uvedení produktů, které obsahují geneticky modifikovanou kukuřici
    DP4114 × MON 810 × MIR604 × NK603 a geneticky modifikovanou kukuřici kombinující
    dvě nebo tři jednoduché události DP4114, MON 810, MIR604 a NK603, sestávají
    z nich nebo jsou z nich vyrobeny, na trh podle nařízení Evropského parlamentu
    a Rady (ES) č. 1829/2003 (oznámeno pod číslem C(2022)4333) (Pouze nizozemské
    znění je závazné)
  type: main
- language: da
  script: Latn
  content: Kommissionens gennemførelsesafgørelse (EU) 2022/1094 af 29. juni 2022
    om tilladelse til markedsføring af produkter, der indeholder, består af eller
    er fremstillet af genetisk modificeret DP4114 × MON 810 × MIR604 × NK603-majs
    og genetisk modificeret majs, der kombinerer to eller tre af de individuelle begivenheder
    DP4114, MON 810, MIR604 og NK603, i henhold til Europa-Parlamentets og Rådets
    forordning (EF) nr. 1829/2003 (meddelt under nummer C(2022) 4333) (Kun den nederlandske
    udgave er autentisk)
  type: main
