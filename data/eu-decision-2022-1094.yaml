    είναι το μόνο αυθεντικό)
  type: main
- language: et
  script: Latn
  content: Komisjoni rakendusotsus (EL) 2022/1094, 29. juuni 2022, millega lubatakse
    vastavalt Euroopa Parlamendi ja nõukogu määrusele (EÜ) nr 1829/2003 lasta
    turule geneetiliselt muundatud maisi DP4114 × MON 810 × MIR604 × NK603 ning
    geneetiliselt muundatud maisi, milles on kombineeritud kaks või kolm DP4114,
    MON 810, MIR604 ja NK603 transformatsioonidest, sisaldavaid, nendest koosnevaid
    või nendest toodetud tooteid (teatavaks tehtud numbri C(2022) 4333 all) (Ainult
    hollandikeelne tekst on autentne)
  type: main
- language: fi
  script: Latn
  content: Komission täytäntöönpanopäätös (EU) 2022/1094, annettu 29 päivänä
    kesäkuuta 2022, muuntogeenistä maissia DP4114 × MON 810 × MIR604 × NK603
    ja muunnostapahtumista DP4114, MON 810, MIR604 ja NK603 kahta tai kolmea yhdistelemällä
    muodostettua muuntogeenistä maissia sisältävien, siitä koostuvien tai siitä
    valmistettujen tuotteiden markkinoille saattamisen sallimisesta Euroopan parlamentin
    ja neuvoston asetuksen (EY) N:o 1829/2003 mukaisesti (tiedoksiannettu numerolla
    C(2022) 4333) (Ainoastaan hollanninkielinen teksti on todistusvoimainen)
  type: main
- language: ga
  script: Latn
  content: Cinneadh Cur Chun Feidhme (AE) 2022/1094 ón gCoimisiún an 29 Meitheamh
    2022 lena n-údaraítear táirgí ina bhfuil, arb é atá iontu nó a tháirgtear
    as arbhar Indiach géinmhodhnaithe DP4114 × MON 810 × MIR604 × NK603 agus arbhar
    Indiach géinmhodhnaithe a dhéanann dhá cheann nó trí de na teagmhais aonair
    DP4114, MON 810, MIR604 agus NK603 a chumasc, de bhun Rialachán (CE) Uimh. 1829/2003
    ó Pharlaimint na hEorpa agus ón gComhairle (a bhfuil fógra tugtha ina leith
    faoi dhoiciméad C(2022)4333) (Is é an téacs san Ollainnis amháin atá barántúil)
  type: main
- language: hr
  script: Latn
  content: Provedbena odluka Komisije (EU) 2022/1094 оd 29. lipnja 2022. o odobravanju
    stavljanja na tržište proizvoda koji sadržavaju genetski modificirani kukuruz
    DP4114 × MON 810 × MIR604 × NK603 i genetski modificirani kukuruz koji je kombinacija
    dviju ili triju pojedinačnih promjena DP4114, MON 810, MIR604 i NK603 ili se
    sastoje ili su proizvedeni od njih, u skladu s Uredbom (EZ) br. 1829/2003 Europskog
    parlamenta i Vijeća (priopćeno pod brojem dokumenta C(2022) 4333) (Vjerodostojan
    je samo tekst na nizozemskom jeziku)
  type: main
- language: hu
  script: Latn
  content: A Bizottság (EU) 2022/1094 végrehajtási határozata (2022. június 29.)
    a géntechnológiával módosított DP4114 × MON 810 × MIR604 × NK603 kukoricából
    és a géntechnológiával módosított, a DP4114, MON 810, MIR604 és NK603 egyszeres
    genetikai események közül kettőt vagy hármat ötvöző kukoricát tartalmazó,
    abból álló vagy abból előállított termékek forgalomba hozatalának az
    1829/2003/EK európai parlamenti és tanácsi rendelet szerinti engedélyezéséről
    (az értesítés a C(2022) 4333. számú dokumentummal történt) (Csak a holland
    nyelvű szöveg hiteles)
  type: main
- language: it
  script: Latn
  content: Decisione di esecuzione (UE) 2022/1094 della Commissione del 29 giugno
    2022 che autorizza l’immissione in commercio di prodotti contenenti, costituiti
    o derivati da granturco geneticamente modificato DP4114 × MON 810 × MIR604 ×
    NK603 e da granturco geneticamente modificato che combina due o tre dei singoli
    eventi DP4114, MON 810, MIR604 e NK603 in conformità al regolamento (CE) n. 1829/2003
    del Parlamento europeo e del Consiglio [notificata con il numero C(2022) 4333]
    (Il testo in lingua neerlandese è il solo facente fede)
  type: main
- language: lv
  script: Latn
  content: Komisijas Īstenošanas lēmums (ES) 2022/1094 (2022. gada 29. jūnijs),
    ar ko atbilstoši Eiropas Parlamenta un Padomes Regulai (EK) Nr. 1829/2003 atļauj
    laist tirgū produktus, kas satur ģenētiski modificētu kukurūzu DP4114 ×
    MON 810 × MIR604 × NK603 un ģenētiski modificētu kukurūzu, kurā kombinēti
    divi vai trīs vienkārši notikumi DP4114, MON 810, MIR604 un NK603, no tām
    sastāv vai ir no tām ražoti (izziņots ar dokumenta numuru C(2022) 4333) (Autentisks
    ir tikai teksts nīderlandiešu valodā)
  type: main
- language: lt
  script: Latn
  content: Komisijos įgyvendinimo sprendimas (ES) 2022/1094 2022 m. birželio 29
    d. kuriuo pagal Europos Parlamento ir Tarybos reglamentą (EB) Nr. 1829/2003 leidžiama
    pateikti rinkai produktus, kurių sudėtyje yra genetiškai modifikuotų kukurūzų
    DP4114 × MON 810 × MIR604 × NK603 ir genetiškai modifikuotų kukurūzų, sudarytų
    iš dviejų ar trijų atskirų DP4114, MON 810, MIR604 ir NK603 transformacijos
    įvykių kombinacijų, arba kurie iš šių kukurūzų sudaryti ar pagaminti (pranešta
    dokumentu Nr. C(2022) 4333) (Tekstas autentiškas tik nyderlandų kalba)
  type: main
- language: mt
  script: Latn
  content: Deċiżjoni ta’ Implimentazzjoni tal-Kummissjoni (UE) 2022/1094 tad-29
    ta’ Ġunju 2022 li tawtorizza t-tqegħid fis-suq ta’ prodotti li fihom, li
    jikkonsistu minn, jew li jkunu prodotti mill-qamħirrum modifikat ġenetikament
    DP4114 × MON 810 × MIR604 × NK603, u mill-qamħirrum modifikat ġenetikament
    li jikkombina tnejn jew tlieta mill-eventi uniċi DP4114, MON 810, MIR604 u NK603
    skont ir-Regolament (KE) Nru 1829/2003 tal-Parlament Ewropew u tal-Kunsill (notifikata
    bid-dokument C(2022) 4333) (It-test bl-Olandiż biss huwa awtentiku)
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2022/1094 van de Commissie van 29 juni 2022 tot
    verlening van een vergunning voor het in de handel brengen van producten die geheel
    of gedeeltelijk bestaan uit of zijn geproduceerd met genetisch gemodificeerde
    mais DP4114 × MON 810 × MIR604 × NK603 en genetisch gemodificeerde mais die
    tot stand is gekomen door combinatie van twee of drie van de afzonderlijke transformatiestappen
    DP4114, MON 810, MIR604 en NK603, overeenkomstig Verordening (EG) nr. 1829/2003
    van het Europees Parlement en de Raad (Kennisgeving geschied onder nummer C(2022)
    4333) (Slechts de tekst in de Nederlandse taal is authentiek)
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Komisji (UE) 2022/1094 z dnia 29 czerwca 2022 r. zezwalająca
    na wprowadzenie do obrotu, na podstawie rozporządzenia (WE) nr 1829/2003 Parlamentu
    Europejskiego i Rady, produktów zawierających genetycznie zmodyfikowaną kukurydzę
    DP4114 × MON 810 × MIR604 × NK603 oraz rodzaje genetycznie zmodyfikowanej kukurydzy
    łączące dwie lub trzy pojedyncze modyfikacje DP4114, MON 810, MIR604 i NK603
    oraz produktów składających się z wymienionych rodzajów genetycznie zmodyfikowanej
    kukurydzy lub z niej wyprodukowanych (notyfikowana jako dokument nr C(2022) 4333)
    (Jedynie tekst w języku niderlandzkim jest autentyczny)
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2022/1094 da Comissão de 29 de junho de 2022
    que autoriza a colocação no mercado de produtos que contenham, sejam constituídos
    por ou sejam produzidos a partir de milho geneticamente modificado DP4114 × MON
    810 × MIR604 × NK603 e milho geneticamente modificado combinando dois ou três
    dos eventos únicos DP4114, MON 810, MIR604 e NK603, nos termos do Regulamento
    (CE) n.o 1829/2003 do Parlamento Europeu e do Conselho [notificada com o número
    C(2022) 4333] (Apenas faz fé o texto na língua neerlandesa)
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2022/1094 a Comisiei din 29 iunie 2022
    de autorizare a introducerii pe piață a produselor care conțin, constau în
    sau sunt fabricate din porumb modificat genetic DP4114 × MON 810 × MIR604 ×
    NK603 și din porumb modificat genetic obținut din combinarea a două sau trei
    dintre evenimentele de transformare DP4114, MON 810, MIR604 și NK603 în temeiul
    Regulamentului (CE) nr. 1829/2003 al Parlamentului European și al Consiliului
    [notificată cu numărul C(2022) 4333] (Numai textul în limba neerlandeză este
    autentic)
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Komisie (EÚ) 2022/1094 z 29. júna 2022, ktorým
    sa podľa nariadenia Európskeho parlamentu a Rady (ES) č. 1829/2003 povoľuje
    umiestňovať na trh výrobky, ktoré obsahujú geneticky modifikovanú kukuricu
    DP4114 × MON 810 × MIR604 × NK603 a geneticky modifikovanú kukuricu s kombináciou
    dvoch alebo troch samostatných transformačných udalostí DP4114, MON 810, MIR604
    a NK603, sú z nich zložené alebo vyrobené [oznámené pod číslom C(2022)
    4333] (Iba holandské znenie je autentické)
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Komisije (EU) 2022/1094 z dne 29. junija 2022 o odobritvi
    dajanja na trg proizvodov, ki vsebujejo gensko spremenjeno koruzo DP4114 × MON
    810 × MIR604 × NK603, so iz nje sestavljeni ali proizvedeni, in gensko spremenjeno
    koruzo, v kateri sta združena dva ali trije posamezni dogodki DP4114, MON 810,
    MIR604 in NK603, v skladu z Uredbo (ES) št. 1829/2003 Evropskega parlamenta in
    Sveta (notificirano pod dokumentarno številko C(2022) 4333) (Besedilo v nizozemskem
    jeziku je edino verodostojno)
  type: main
- language: es
  script: Latn
  content: Decisión de Ejecución (UE) 2022/1094 de la Comisión de 29 de junio de
    2022 por la que se autoriza la comercialización de productos que contengan, se
    compongan o se hayan producido a partir de maíz modificado genéticamente DP4114
    × MON 810 × MIR604 × NK603 y de maíz modificado genéticamente que combine
    dos o tres de los eventos únicos DP4114, MON 810, MIR604 y NK603, de conformidad
    con el Reglamento (CE) n.o 1829/2003 del Parlamento Europeo y del Consejo [notificada
    con el número C(2022) 4333] (El texto en lengua neerlandesa es el único auténtico)
  type: main
