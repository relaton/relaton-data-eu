    den im Anhang II zur Verordnung (EWG) Nr. 1025/70 aufgeführten Ländern
  type: main
- language: it
  script: Latn
  content: Regolamento (CEE) n. 1629/72 della Commissione, del 28 luglio 1972, che
    istituisce una sorveglianza comunitaria delle importazioni di alluminio greggio
    provenienti dai paesi indicati nell'allegato II del regolamento (CEE) n. 1025/70
  type: main
- language: nl
  script: Latn
