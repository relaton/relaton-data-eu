    da applicare alle navi battenti bandiera della Norvegia
  type: main
- language: nl
  script: Latn
  content: Verordening (EG) nr. 3075/95 van de Raad van 22 december 1995 tot vaststelling,
    voor 1996, van maatregelen voor de instandhouding en het beheer van de visbestanden,
    van toepassing op vaartuigen die de vlag van Noorwegen voeren
  type: main
- language: pt
  script: Latn
  content: Regulamento (CE) nº 3075/95 do Conselho, de 22 de Dezembro de 1995, que
