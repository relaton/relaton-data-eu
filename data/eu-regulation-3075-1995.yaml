  content: Council Regulation (EC) No 3075/95 of 22 December 1995 laying down, for
    1996, certain measures for the conservation and management of fishery resources
    applicable to vessels flying the flag of Norway
  type: main
- language: fr
  script: Latn
  content: Règlement (CE) n° 3075/95 du Conseil, du 22 décembre 1995, fixant, pour
    l'année 1996, certaines mesures de conservation et de gestion des ressources
    de pêche applicables aux navires battant pavillon de la Norvège
  type: main
- language: de
  script: Latn
  content: Verordnung (EG) Nr. 3075/95 des Rates vom 22. Dezember 1995 über Maßnahmen
    zur Erhaltung und Bewirtschaftung der Fischbestände für Fischereifahrzeuge unter
    der Flagge Norwegens (1996)
  type: main
- language: da
  script: Latn
  content: Rådets forordning (EF) nr. 3075/95 af 22. december 1995 om fastsættelse
    for 1996 af visse foranstaltninger til bevarelse og forvaltning af fiskeressourcerne,
    som finder anvendelse på fartøjer, der fører norsk flag
  type: main
- language: el
  script: Grek
  content: Kανονισμός (ΕΚ) αριθ. 3075/95 του Συμβουλίου,
