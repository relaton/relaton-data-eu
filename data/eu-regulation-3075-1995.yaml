    το 1996, ορισμένων μέτρων διατήρησης και διαχείρισης
    των αλιευτικών πόρων που εφαρμόζονται σε σκάφη
    υπό νορβηγική σημαία
  type: main
- language: fi
  script: Latn
  content: Neuvoston asetus (EY) N:o 3075/95, annettu 22 päivänä joulukuuta 1995,
