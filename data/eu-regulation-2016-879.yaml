    Parlaments und des Rates — der Einzelheiten der Konformitätserklärung für
    das Inverkehrbringen von Kälteanlagen, Klimaanlagen und Wärmepumpen, die mit
    teilfluorierten Kohlenwasserstoffen befüllt sind, und der Überprüfung durch
    einen unabhängigen Prüfer
  type: main
