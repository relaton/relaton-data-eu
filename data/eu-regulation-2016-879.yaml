title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2016/879 of 2 June 2016 establishing,
    pursuant to Regulation (EU) No 517/2014 of the European Parliament and of the
    Council, detailed arrangements relating to the declaration of conformity when
    placing refrigeration, air conditioning and heat pump equipment charged with hydrofluorocarbons
    on the market and its verification by an independent auditor
  type: main
- language: fr
  script: Latn
  content: Règlement d'exécution (UE) 2016/879 de la Commission du 2 juin 2016 établissant,
    conformément au règlement (UE) n° 517/2014 du Parlement européen et du Conseil,
    les modalités relatives à la déclaration de conformité à établir lors de
    la mise sur le marché d'équipements de réfrigération, de climatisation et
    de pompes à chaleur chargés d'hydrofluorocarbones et à la vérification de
    celle-ci par un vérificateur indépendant
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2016/879 der Kommission vom 2. Juni 2016
