title:
- language: en
  script: Latn
  content: '97/186/EC: Commission Decision of 14 March 1997 authorizing the Member
    States to provide for derogations from certain provisions of Council Directive
    77/93/EEC in respect of potatoes, other than potatoes intended for planting, originating
    in Cuba'
  type: main
- language: fr
  script: Latn
  content: '97/186/CE: Décision de la Commission du 14 mars 1997 autorisant les États
    membres à prévoir des dérogations à certaines dispositions de la directive
    77/93/CEE du Conseil en ce qui concerne les pommes de terre, autres que les pommes
    de terre destinées à la plantation, originaires de Cuba'
  type: main
- language: de
  script: Latn
  content: '97/186/EG: Entscheidung der Kommission vom 14. März 1997 zur Ermächtigung
    der Mitgliedstaaten, für Kartoffeln/Erdäpfel mit Ursprung in Kuba, die nicht
    als Pflanzgut bestimmt sind, Ausnahmen von einigen Vorschriften der Richtlinie
    77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '97/186/EF: Kommissionens Beslutning af 14. marts 1997 om bemyndigelse
    af medlemsstaterne til at fastsætte undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for kartofler, bortset fra læggekartofler, med oprindelse
    i Cuba'
  type: main
- language: el
  script: Grek
  content: '97/186/ΕΚ: Απόφαση της Επιτροπής της 14ης Μαρτίου
