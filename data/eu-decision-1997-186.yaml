    παρεκκλίσεις από ορισμένες διατάξεις της οδηγίας
    77/93/ΕΟΚ του Συμβουλίου όσον αφορά τα γεώμηλα
    εκτός από εκείνα που προορίζονται για φύτευση
    καταγωγής Κούβας'
  type: main
- language: fi
  script: Latn
  content: '97/186/EY: Komission päätös, tehty 14 päivänä maaliskuuta 1997,
    luvan antamisesta jäsenvaltiolle säätää poikkeuksia neuvoston direktiivin
    77/93/ETY säännöksistä Kuubasta peräisin olevien muiden kuin istutettavaksi
    tarkoitettujen perunoiden osalta'
  type: main
- language: it
  script: Latn
  content: '97/186/CE: Decisione della Commissione del 14 marzo 1997 che autorizza
