title:
- language: en
  script: Latn
  content: '93/411/EEC: Commission Decision of 22 July 1993 authorizing Member States
    to provide for derogations from certain provisions of Council Directive 77/93/EEC
    in respect of plants of strawberry (Fragaria L.), intended for planting, other
    than seeds, originating in Argentina'
  type: main
- language: fr
  script: Latn
  content: '93/411/CEE: Décision de la Commission, du 22 juillet 1993, autorisant
    les États membres à prévoir des dérogations à certaines dispositions de la
    directive 77/93/CEE du Conseil pour les fraisiers (Fragaria L.) destinés à la
    plantation, à l''exception des semences, originaires d''Argentine'
  type: main
- language: de
  script: Latn
  content: '93/411/EWG: Entscheidung der Kommission vom 22. Juli 1993 zur Ermächtigung
    der Mitgliedstaaten, für Erdbeerpflanzen (Fragaria L.), zum Anpflanzen bestimmt,
    außer Samen, mit Ursprung in Argentinien Ausnahmen von bestimmten Vorschriften
    der Richtlinie 77/93/EWG des Rates zuzulassen'
  type: main
- language: da
  script: Latn
  content: '93/411/EØF: Kommissionens beslutning af 22. juli 1993 om bemyndigelse
    af medlemsstaterne til at indrømme undtagelser fra visse bestemmelser i Rådets
    direktiv 77/93/EØF for jordbærplanter (Fragaria L.) til udplantning, dog ikke
    frø, med oprindelse i Argentina'
  type: main
- language: el
  script: Grek
  content: '93/411/ΕΟΚ: Απόφαση της Επιτροπής της 22ας
    Ιουλίου 1993 που επιτρέπει στα κράτη μέλη να
    παρέχουν παρεκκλίσεις από ορισμένες διατάξεις
    της οδηγίας 77/93/ΕΟΚ του Συμβουλίου σχετικά
    με τα φυτά χαμαικεράσου (Frageria L), που προορίζονται
    για φύτευση, με εξαίρεση τους σπόρους προς
    σπορά, καταγωγής Αργεντινής'
  type: main
- language: it
  script: Latn
  content: '93/411/CEE: Decisione della Commissione, del 22 luglio 1993, che autorizza
    gli Stati membri a prevedere deroghe a determinate disposizioni della direttiva
    77/93/CEE riguardo alle piantine di fragole (Fragaria L.) destinate alla piantagione
    tranne le sementi, originarie dell''Argentina'
  type: main
- language: nl
  script: Latn
  content: '93/411/EEG: Beschikking van de Commissie van 22 juli 1993 tot machtiging
    van de Lid-Staten om voor aardbeiplanten (Fragaria L.), bestemd voor opplant,
    met uitzondering van zaden, uit Argentinië afwijking van sommige bepalingen van
    Richtlijn 77/93/EEG van de Raad toe te staan'
  type: main
- language: pt
  script: Latn
  content: '93/411/CEE: Decisão da Comissão, de 22 de Julho de 1993, que autoriza
    os Estados-membros a prever derrogações a certas normas da Directiva 77/93/CEE
    do Conselho relativamente às plantas de Fragaria L., destinadas à plantação,
    com excepção das sementes, originárias da Argentina'
  type: main
- language: es
  script: Latn
  content: '93/411/CEE: Decisión de la Comisión, de 22 de julio de 1993, por la
    que se autoriza a los Estados miembros para establecer excepciones a algunas disposiciones
    de la Directiva 77/93/CEE del Consejo en relación con las fresas (Fragaria L.)
    originarias de Argentina y destinadas a ser plantadas con excepción de las semillas'
