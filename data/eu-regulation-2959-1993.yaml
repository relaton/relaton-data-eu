  content: Commission Regulation (EEC) No 2959/93 of 27 October 1993 amending Regulation
    (EEC) No 3769/92 implementing and amending Council Regulation (EEC) No 3677/90
    laying down measures to be taken to discourage the diversion of certain substances
    to the illicit manufacture of narcotic drugs and psychotropic substances
  type: main
- language: fr
  script: Latn
  content: Règlement (CEE) n° 2959/93 de la Commission du 27 octobre 1993 modifiant
    le règlement (CEE) n° 3769/92 portant application et modification du règlement
    (CEE) n 3677/90 du Conseil relatif aux mesures à prendre afin d'empêcher le
    détournement de certaines substances pour la fabrication illicite de stupéfiants
    ou de substances psychotropes
  type: main
- language: de
  script: Latn
  content: Verordnung (EWG) Nr. 2959/93 der Kommission vom 27. Oktober 1993 zur Änderung
