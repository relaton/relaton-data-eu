    ta' taxxa fuq il-valur miżjud
  type: main
- language: nl
  script: Latn
  content: Uitvoeringsbesluit (EU) 2018/1492 van de Raad van 2 oktober 2018 waarbij
    de Republiek Letland wordt gemachtigd een bijzondere maatregel te treffen die
    afwijkt van artikel 193 van Richtlijn 2006/112/EG betreffende het gemeenschappelijke
    stelsel van belasting over de toegevoegde waarde
  type: main
- language: pl
  script: Latn
  content: Decyzja wykonawcza Rady (UE) 2018/1492 z dnia 2 października 2018 r. w
    sprawie upoważnienia Republiki Łotewskiej do wprowadzenia szczególnego środka
    stanowiącego odstępstwo od art. 193 dyrektywy 2006/112/WE w sprawie wspólnego
    systemu podatku od wartości dodanej
  type: main
- language: pt
  script: Latn
  content: Decisão de Execução (UE) 2018/1492 do Conselho, de 2 de outubro de 2018,
    que autoriza a República da Letónia a aplicar uma medida especial em derrogação
    ao artigo 193.° da Diretiva 2006/112/CE relativa ao sistema comum do imposto
    sobre o valor acrescentado
  type: main
- language: ro
  script: Latn
  content: Decizia de punere în aplicare (UE) 2018/1492 a Consiliului din 2 octombrie
    2018 prin care Republica Letonia este autorizată să introducă o măsură specială
    de derogare de la articolul 193 din Directiva 2006/112/CE privind sistemul comun
    al taxei pe valoarea adăugată
  type: main
- language: sk
  script: Latn
  content: Vykonávacie rozhodnutie Rady (EÚ) 2018/1492 z 2. októbra 2018, ktorým
    sa Lotyšskej republike povoľuje zaviesť osobitné opatrenie odchyľujúce sa
    od článku 193 smernice 2006/112/ES o spoločnom systéme dane z pridanej hodnoty
  type: main
- language: sl
  script: Latn
  content: Izvedbeni sklep Sveta (EU) 2018/1492 z dne 2. oktobra 2018 o dovoljenju
