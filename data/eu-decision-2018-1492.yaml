  script: Latn
  content: Council Implementing Decision (EU) 2018/1492 of 2 October 2018 authorising
    the Republic of Latvia to introduce a special measure derogating from Article
    193 of Directive 2006/112/EC on the common system of value added tax
  type: main
- language: fr
  script: Latn
  content: Décision d'exécution (UE) 2018/1492 du Conseil du 2 octobre 2018 autorisant
    la République de Lettonie à introduire une mesure particulière dérogatoire
    à l'article 193 de la directive 2006/112/CE relative au système commun de taxe
    sur la valeur ajoutée
  type: main
- language: de
  script: Latn
  content: Durchführungsbeschluss (EU) 2018/1492 des Rates vom 2. Oktober 2018 zur
    Ermächtigung der Republik Lettland, eine von Artikel 193 der Richtlinie 2006/112/EG
    über das gemeinsame Mehrwertsteuersystem abweichende Regelung einzuführen
  type: main
- language: bg
