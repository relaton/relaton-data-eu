  type: main
- language: fi
  script: Latn
  content: Neuvoston täytäntöönpanopäätös (EU) 2018/1492, annettu 2 päivänä
    lokakuuta 2018, luvan antamisesta Latvian tasavallalle ottaa käyttöön yhteisestä
