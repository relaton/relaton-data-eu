    se od článku 193 směrnice 2006/112/ES o společném systému daně z přidané
    hodnoty
  type: main
- language: da
  script: Latn
  content: Rådets gennemførelsesafgørelse (EU) 2018/1492 af 2. oktober 2018 om
    at give Republikken Letland tilladelse til at indføre en særlig foranstaltning,
