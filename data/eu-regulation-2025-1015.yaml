    der Delegierten Verordnung (EU) 2017/891 der Kommission und der Durchführungsverordnung
    (EU) 2017/892 der Kommission zur Lösung spezifischer Probleme im Obst- und Gemüsesektor
    infolge schwerwiegender widriger Wetterereignisse
  type: main
