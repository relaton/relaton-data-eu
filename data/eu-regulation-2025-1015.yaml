title:
- language: en
  script: Latn
  content: Commission Implementing Regulation (EU) 2025/1015 of 26 May 2025 on temporary
    emergency measures for Spain derogating from certain provisions of Regulation
    (EU) No 1308/2013 of the European Parliament and of the Council, Commission Delegated
    Regulation (EU) 2017/891 and Commission Implementing Regulation (EU) 2017/892,
    to resolve specific problems in the fruit and vegetables sector caused by severe
    adverse meteorological events
  type: main
- language: fr
  script: Latn
  content: Règlement d’exécution (UE) 2025/1015 de la Commission du 26 mai 2025
    relatif à des mesures d’urgence temporaires en faveur de l’Espagne dérogeant
    à certaines dispositions du règlement (UE) no 1308/2013 du Parlement européen
    et du Conseil, du règlement délégué (UE) 2017/891 de la Commission et du règlement
    d’exécution (UE) 2017/892 de la Commission en vue de résoudre des problèmes
    spécifiques dans le secteur des fruits et légumes provoqués par des graves
    phénomènes météorologiques défavorables
  type: main
- language: de
  script: Latn
  content: Durchführungsverordnung (EU) 2025/1015 der Kommission vom 26. Mai 2025
